schema_version: 0.2-draft
lesson:
  id: search-problems
  version: 0.1.0-draft
  title: Turn a goal into states and actions
  state: draft
  summary: A search problem defines states, actions, transitions, costs, and a goal test; the representation determines
    which solutions can be considered.
  slot: M05.1
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.search-problems
  version: 1-draft
  statement: A search problem defines states, actions, transitions, costs, and a goal test; the representation determines
    which solutions can be considered.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - search-problems.base
  - search-problems.transfer
  prerequisites:
  - anyOf:
    - objective.algorithms-and-programs
  - anyOf:
    - objective.discrete-math
scenes:
- id: search-problems.s1
  title: Decide what the state must remember
  type: explanation
  depth: intuition
  objective_refs:
  - objective.search-problems
  markdown: 'For a route problem, the state might be the current city. If fuel matters, city alone is insufficient:
    include remaining fuel. A state should retain information needed to predict valid next actions and their consequences.
    Omitting relevant history can make two different situations appear identical.'
  text_mode: 'For a route problem, the state might be the current city. If fuel matters, city alone is insufficient:
    include remaining fuel. A state should retain information needed to predict valid next actions and their consequences.
    Omitting relevant history can make two different situations appear identical.'
  bridges: []
- id: search-problems.s2
  title: Specify actions and transitions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.search-problems
  markdown: An action chooses a road, and a transition gives the resulting city and fuel level. A goal test checks
    whether the destination has been reached. A cost function might measure distance, time, or money. These choices
    can favor different routes through the same map.
  text_mode: An action chooses a road, and a transition gives the resulting city and fuel level. A goal test checks
    whether the destination has been reached. A cost function might measure distance, time, or money. These choices
    can favor different routes through the same map.
  bridges: []
- id: search-problems.s3
  title: Trace a tiny instance
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.search-problems
  markdown: From A, go to B for cost 2 or C for cost 1. B reaches goal G for 2 more; C reaches G for 6 more. Both
    paths reach the goal, but A-B-G costs 4 while A-C-G costs 7. The cheapest first action does not necessarily
    begin the cheapest complete route.
  text_mode: From A, go to B for cost 2 or C for cost 1. B reaches goal G for 2 more; C reaches G for 6 more. Both
    paths reach the goal, but A-B-G costs 4 while A-C-G costs 7. The cheapest first action does not necessarily
    begin the cheapest complete route.
  bridges: []
- id: search-problems.s4
  title: Distinguish a search tree from a state graph
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.search-problems
  markdown: A graph can contain several paths to the same state. A search tree records paths explored by the algorithm
    and may repeat that state. Duplicate detection can save work, but must preserve relevant cost or history information.
    A search method cannot discover actions excluded by the problem definition.
  text_mode: A graph can contain several paths to the same state. A search tree records paths explored by the algorithm
    and may repeat that state. Duplicate detection can save work, but must preserve relevant cost or history information.
    A search method cannot discover actions excluded by the problem definition.
  bridges: []
- id: search-problems.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.search-problems
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: A search problem defines states, actions, transitions, costs, and a goal test; the representation determines
    which solutions can be considered.
- id: search-problems.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.search-problems
  markdown: A search problem defines states, actions, transitions, costs, and a goal test; the representation determines
    which solutions can be considered.
  text_mode: A search problem defines states, actions, transitions, costs, and a goal test; the representation determines
    which solutions can be considered.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - search-problems.s1
    - search-problems.s2
    - search-problems.s3
    - search-problems.s4
    - search-problems.check
    gate_refs:
    - gate.core
  scene_aliases:
    search-problems.recap: search-problems.check
assessment_families:
- id: search-problems.base
  objective_ref: objective.search-problems
  task: base
  response_type: single_choice
  points: 1
  hint: 'Specify actions and transitions: trace the inputs, operation, and result before choosing.'
  remediation_scene: search-problems.s2
  variants:
  - id: search-problems.base.1
    prompt: Which component decides whether a candidate state satisfies the task?
    options:
    - id: c
      text: The random seed
    - id: a
      text: The goal test
    - id: b
      text: Only the file format
    answer: a
    feedback: The goal test formalizes success within the search problem.
  - id: search-problems.base.2
    prompt: A-B costs 3 and B-G costs 4. Total path cost?
    options:
    - id: a
      text: '7'
    - id: b
      text: '4'
    - id: c
      text: '12'
    answer: a
    feedback: Add transition costs along the path.
- id: search-problems.transfer
  objective_ref: objective.search-problems
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Distinguish a search tree from a state graph: trace the inputs, operation, and result before choosing.'
  remediation_scene: search-problems.s4
  variants:
  - id: search-problems.transfer.1
    prompt: Fuel limits future travel. Is current city alone a sufficient state representation?
    options:
    - id: a
      text: No; fuel or equivalent relevant information must be represented
    - id: b
      text: Yes; city names encode fuel automatically
    - id: c
      text: Only if the map is colorful
    answer: a
    feedback: The state must support correct action and transition predictions.
  - id: search-problems.transfer.2
    prompt: The lowest-cost first edge leads to an expensive remainder. What does this show?
    options:
    - id: b
      text: All cost functions are invalid
    - id: c
      text: The goal test must be random
    - id: a
      text: Local cheapness need not imply lowest total path cost
    answer: a
    feedback: Search compares complete consequences rather than only the first move.
