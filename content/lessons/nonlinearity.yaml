schema_version: 0.2-draft
lesson:
  id: nonlinearity
  version: 0.2.0-draft
  title: Why layers need more than multiplication
  state: draft
  summary: Try to solve a simple either-but-not-both puzzle, and discover why stacked straight rules need a bend.
  slot: M11.2
  category: learning
  sources:
  - title: Dive into Deep Learning — multilayer perceptrons
    url: https://d2l.ai/chapter_multilayer-perceptrons/mlp.html
  archetype: mechanism
objectives:
- id: objective.nonlinearity
  version: 2-draft
  statement: Trace a nonlinear hidden computation and explain why composing affine maps alone cannot represent XOR.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - nonlinearity.base.v2
  - nonlinearity.transfer.v2
  prerequisites:
  - anyOf:
    - objective.neurons
  - anyOf:
    - objective.functions
scenes:
- id: nonlinearity.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.nonlinearity
  title: Can a straight rule solve this puzzle?
  markdown: A robot has two switches, each either zero or one. It should light a lamp when exactly one switch is
    on. The desired outputs for (0,0), (1,0), (0,1), and (1,1) are 0,1,1,0. This rule is called **exclusive OR**,
    or XOR. It gives us a small challenge with every case visible. A single weighted sum can combine the switches,
    but one straight decision boundary cannot separate both diagonal positive cases from both negative cases.
  text_mode: A robot has two switches, each either zero or one. It should light a lamp when exactly one switch is
    on. The desired outputs for (0,0), (1,0), (0,1), and (1,1) are 0,1,1,0. This rule is called **exclusive OR**,
    or XOR. It gives us a small challenge with every case visible. A single weighted sum can combine the switches,
    but one straight decision boundary cannot separate both diagonal positive cases from both negative cases.
  bridges: []
- id: nonlinearity.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.nonlinearity
  title: Stacking straight rules does not add a bend
  markdown: An **affine** rule multiplies inputs by weights and adds a bias. For example, h=2x+1 followed by y=3h−2
    gives y=3(2x+1)−2=6x+1. Two stages collapsed into one affine rule. Adding more affine stages does not fix this
    limitation; their overall composition is still affine. This statement concerns the represented function. It
    does not mean every training procedure behaves identically when parameterized with different numbers of layers.
  text_mode: An **affine** rule multiplies inputs by weights and adds a bias. For example, h=2x+1 followed by y=3h−2
    gives y=3(2x+1)−2=6x+1. Two stages collapsed into one affine rule. Adding more affine stages does not fix this
    limitation; their overall composition is still affine. This statement concerns the represented function. It
    does not mean every training procedure behaves identically when parameterized with different numbers of layers.
  bridges:
  - algebra-notation
- id: nonlinearity.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.nonlinearity
  title: Give the rule a corner
  markdown: 'A **nonlinear** function cannot be expressed as one affine mapping over its entire domain. ReLU, short
    for rectified linear unit, is max(0,z): it outputs zero for a negative input and keeps a positive input. It
    is straight on each side but has a corner at zero. Sigmoid and tanh are other nonlinear choices with smooth
    curved shapes. We will use ReLU because you can compute it by asking whether a number is above or below zero.'
  text_mode: 'A **nonlinear** function cannot be expressed as one affine mapping over its entire domain. ReLU, short
    for rectified linear unit, is max(0,z): it outputs zero for a negative input and keeps a positive input. It
    is straight on each side but has a corner at zero. Sigmoid and tanh are other nonlinear choices with smooth
    curved shapes. We will use ReLU because you can compute it by asking whether a number is above or below zero.'
  bridges: []
- id: nonlinearity.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.nonlinearity
  title: Build the four-case solution
  markdown: Let s=x₁+x₂. Make hidden values h₁=ReLU(s) and h₂=ReLU(s−1), then output y=h₁−2h₂. For s=0, both hidden
    values are 0 and y=0. For s=1, they are 1 and 0, so y=1. For s=2, they are 2 and 1, so y=0. These three sums
    cover all four binary input cases. The hidden units create a change in behavior after the sum passes one, allowing
    the final combination to turn back down.
  text_mode: Let s=x₁+x₂. Make hidden values h₁=ReLU(s) and h₂=ReLU(s−1), then output y=h₁−2h₂. For s=0, both hidden
    values are 0 and y=0. For s=1, they are 1 and 0, so y=1. For s=2, they are 2 and 1, so y=0. These three sums
    cover all four binary input cases. The hidden units create a change in behavior after the sum passes one, allowing
    the final combination to turn back down.
  bridges: []
- id: nonlinearity.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.nonlinearity
  markdown: Use two different examples to check your understanding. Hints are available for practice. A later, fresh
    answer without hints can demonstrate personal-study mastery.
  text_mode: Labeled radio options and a submit button; no timing requirement.
  takeaway: Repeated straight rules still form one straight rule. Nonlinear operations let different input regions
    behave differently.
- id: nonlinearity.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.nonlinearity
  markdown: Nonlinear operations let stacked layers express relationships that repeated affine transformations alone
    cannot.
  text_mode: Nonlinear operations let stacked layers express relationships that repeated affine transformations
    alone cannot.
- id: nonlinearity.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.nonlinearity
  title: Check the scope of the demonstration
  markdown: Our formula is an exact construction for the four specified binary cases. It does not show that a training
    algorithm will discover those weights from arbitrary data, nor that this is the best architecture for another
    task. **Expressivity** means what functions an architecture can represent. Optimization concerns which settings
    a training procedure finds. Generalization concerns how those settings behave on new examples. Keeping these
    questions separate prevents a successful toy calculation from becoming an oversized claim.
  text_mode: Our formula is an exact construction for the four specified binary cases. It does not show that a training
    algorithm will discover those weights from arbitrary data, nor that this is the best architecture for another
    task. **Expressivity** means what functions an architecture can represent. Optimization concerns which settings
    a training procedure finds. Generalization concerns how those settings behave on new examples. Keeping these
    questions separate prevents a successful toy calculation from becoming an oversized claim.
  bridges: []
- id: nonlinearity.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.nonlinearity
  title: Choose a useful bend for the job
  markdown: The activation influences gradients as well as outputs. ReLU has zero derivative for negative pre-activations
    and a corner at zero; software chooses a convention at the corner. Very large magnitudes can make sigmoid change
    only slightly, producing small local derivatives. These properties matter during training, which later lessons
    explain. For now, trace the forward values before discussing training difficulty. Remember “straight after straight
    stays straight; a bend changes the available shapes.”
  text_mode: The activation influences gradients as well as outputs. ReLU has zero derivative for negative pre-activations
    and a corner at zero; software chooses a convention at the corner. Very large magnitudes can make sigmoid change
    only slightly, producing small local derivatives. These properties matter during training, which later lessons
    explain. For now, trace the forward values before discussing training difficulty. Remember “straight after straight
    stays straight; a bend changes the available shapes.”
  bridges: []
- id: nonlinearity.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.nonlinearity
  title: Try the both-on case
  markdown: For x₁=1 and x₂=1, use h₁=ReLU(x₁+x₂), h₂=ReLU(x₁+x₂−1), and y=h₁−2h₂. What is y?
  text_mode: For x₁=1 and x₂=1, use h₁=ReLU(x₁+x₂), h₂=ReLU(x₁+x₂−1), and y=h₁−2h₂. What is y?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: '0'
    - id: b
      text: '1'
    - id: c
      text: '2'
    answer: a
    reveal_markdown: The hidden values are 2 and 1, so the final combination is 2−2×1=0, matching the both-on case
      of XOR.
    hint: Trace the example using the rule from the preceding pages.
    id: nonlinearity.practice.v2.7
