  - id: nonlinearity.base
    objective_ref: objective.nonlinearity
    task: base
    response_type: single_choice
    points: 1
    hint: Nonlinear operations let stacked layers express relationships that repeated affine transformations alone cannot.
    variants:
      - id: nonlinearity.base.1
        prompt: A layer computes 2x and the next computes 3 times that. What is the combined rule?
        options:
          - id: correct
            text: 6x
          - id: a
            text: 5x
          - id: b
            text: A nonlinear rule for every x
        answer: correct
        feedback: 3×(2x)=6x. Repeating linear scaling remains linear.
        retired: true
      - id: nonlinearity.base.2
        prompt: What makes ReLU nonlinear?
        options:
          - id: a
            text: It has many stored training examples.
          - id: b
            text: It always returns the original value.
          - id: correct
            text: Its rule changes at zero.
        answer: correct
        feedback: Its rule changes at zero.
        retired: true
  - id: nonlinearity.transfer
    objective_ref: objective.nonlinearity
    task: transfer
    response_type: single_choice
    points: 1
    hint: Nonlinear operations let stacked layers express relationships that repeated affine transformations alone cannot.
    variants:
      - id: nonlinearity.transfer.1
        prompt: Does adding more affine layers alone guarantee a richer nonlinear boundary?
        options:
          - id: a
            text: Yes. Layer count alone creates nonlinearity.
          - id: b
            text: Yes, provided the biases are nonzero.
          - id: correct
            text: No. Their composition remains affine.
        answer: correct
        feedback: No. Their composition remains affine.
        retired: true
      - id: nonlinearity.transfer.2
        prompt: A network can represent a useful function. Does that prove training will find it?
        options:
          - id: b
            text: Yes. More parameters remove all data limitations.
          - id: correct
            text: No. Representation capacity and successful learning are different.
          - id: a
            text: Yes. Capacity guarantees the optimizer succeeds.
        answer: correct
        feedback: No. Representation capacity and successful learning are different.
        retired: true
  - id: nonlinearity.base.v2
    objective_ref: objective.nonlinearity
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Add the two switches first. Then compute both ReLUs separately (the second subtracts 1 before clipping), and only then combine them as h₁ − 2h₂.
    remediation_scene: nonlinearity.s4
    variants:
      - prompt: For x₁=0, x₂=0, calculate h₁=ReLU(x₁+x₂), h₂=ReLU(x₁+x₂−1), and y=h₁−2h₂.
        answers:
          h1: 0
          h2: 0
          y: 0
        reason_answer: a
        reason_options:
          - id: a
            text: Apply the two ReLUs, then combine their outputs.
          - id: c
            text: Apply one ReLU after adding both hidden formulas.
          - id: b
            text: Clip the input switches before calculating their sum.
        feedback: "No switches are up, so s = 0: h₁ = ReLU(0) = 0 and h₂ = ReLU(−1) = 0, giving y = 0. Each hidden unit gets its own ReLU before the output combines them."
        id: nonlinearity.base.v2.1
      - prompt: For x₁=1, x₂=0, calculate h₁=ReLU(x₁+x₂), h₂=ReLU(x₁+x₂−1), and y=h₁−2h₂.
        answers:
          h1: 1
          h2: 0
          y: 1
        reason_answer: a
        reason_options:
          - id: c
            text: Apply one ReLU after adding both hidden formulas.
          - id: b
            text: Clip the input switches before calculating their sum.
          - id: a
            text: Apply the two ReLUs, then combine their outputs.
        feedback: "One switch is up, so s = 1: h₁ = 1 and h₂ = ReLU(0) = 0, giving y = 1 − 0 = 1. The second unit hasn't woken up yet, so the light is on."
        id: nonlinearity.base.v2.2
      - prompt: For x₁=0, x₂=1, calculate h₁=ReLU(x₁+x₂), h₂=ReLU(x₁+x₂−1), and y=h₁−2h₂.
        answers:
          h1: 1
          h2: 0
          y: 1
        reason_answer: a
        reason_options:
          - id: b
            text: Clip the input switches before calculating their sum.
          - id: c
            text: Apply one ReLU after adding both hidden formulas.
          - id: a
            text: Apply the two ReLUs, then combine their outputs.
        feedback: "Only the top switch is up, so s = 1 again: h₁ = 1, h₂ = 0, and y = 1. The network reads the count, not which switch moved."
        id: nonlinearity.base.v2.3
      - prompt: For x₁=1, x₂=1, calculate h₁=ReLU(x₁+x₂), h₂=ReLU(x₁+x₂−1), and y=h₁−2h₂.
        answers:
          h1: 2
          h2: 1
          y: 0
        reason_answer: a
        reason_options:
          - id: c
            text: Apply one ReLU after adding both hidden formulas.
          - id: a
            text: Apply the two ReLUs, then combine their outputs.
          - id: b
            text: Clip the input switches before calculating their sum.
        feedback: "Both switches are up, so s = 2: h₁ = 2 and h₂ = ReLU(1) = 1, giving y = 2 − 2 × 1 = 0. The second unit's −2 pulls the output back down."
        id: nonlinearity.base.v2.4
    numeric_fields:
      - id: h1
        label: First hidden value
      - id: h2
        label: Second hidden value
      - id: y
        label: Final output
    absolute_tolerance: 1e-6
  - id: nonlinearity.transfer.v2
    objective_ref: objective.nonlinearity
    task: transfer
    response_type: single_choice
    points: 1
    hint: Substitute one straight rule into the other and ask whether any bend appears.
    remediation_scene: nonlinearity.s2
    variants:
      - prompt: h=2x+1 and y=3h−2 contain no nonlinearity. What is their composition?
        answer: a
        retired: true
        options:
          - id: a
            text: y=6x+1
          - id: b
            text: y=5x−1
          - id: c
            text: y=6x−2
        feedback: 'Substitute h and distribute: 3(2x+1)−2=6x+1.'
        id: nonlinearity.transfer.v2.1
      - prompt: What does a hand-built XOR network demonstrate?
        answer: a
        retired: true
        options:
          - id: b
            text: That training from any starting point will find these exact weights
          - id: c
            text: That four examples prove performance on every real task
          - id: a
            text: That its architecture can represent the stated four-case rule
        feedback: Construction establishes representability, not optimization or broad generalization.
        id: nonlinearity.transfer.v2.2
      - prompt: ReLU has a negative pre-activation. What is its local slope away from zero?
        answer: a
        retired: true
        options:
          - id: b
            text: '1'
          - id: a
            text: '0'
          - id: c
            text: −1
        feedback: On its negative side ReLU is flat, with zero derivative.
        id: nonlinearity.transfer.v2.3
      - prompt: Why can hidden nonlinearities change the functions a network represents?
        answer: a
        retired: true
        options:
          - id: a
            text: They prevent the full stack from collapsing into a single affine map
          - id: c
            text: They force each hidden unit to represent one named concept
          - id: b
            text: They make data partitions unnecessary
        feedback: Nonlinear transformations permit input-dependent changes of behavior across regions.
        id: nonlinearity.transfer.v2.4
  - id: nonlinearity.transfer.v3
    objective_ref: objective.nonlinearity
    task: transfer
    response_type: single_choice
    points: 1
    hint: Look for a bend. Straight stages always multiply out into one straight rule; only an activation such as ReLU lets different inputs follow different rules.
    remediation_scene: nonlinearity.s2
    variants:
      - id: nonlinearity.transfer.v3.1
        prompt: A model has two layers and no activation function between them. The first computes h = 4x − 2 and the second computes y = −0.5h + 3. Which single rule does the stack equal?
        options:
          - id: b
            text: y = −2x + 3
          - id: c
            text: y = 3.5x + 1
          - id: a
            text: y = −2x + 4
          - id: d
            text: y = −2x + 1
        answer: a
        feedback: 'Substitute and distribute: −0.5(4x − 2) + 3 = −2x + 1 + 3 = −2x + 4. Dropping the first bias gives −2x + 3, forgetting the second gives −2x + 1, and adding the weights instead of multiplying them gives 3.5.'
      - id: nonlinearity.transfer.v3.2
        prompt: An engineer stacks 50 linear layers with no activations to separate XOR-shaped data. Accuracy stalls at 50% no matter how long it trains. Which change fixes the cause?
        options:
          - id: a
            text: Add 50 more linear layers to the stack
          - id: b
            text: Put a ReLU between consecutive layers
          - id: c
            text: Train ten times longer at a lower rate
          - id: d
            text: Give every layer its own bias term
        answer: b
        feedback: Fifty affine layers multiply out to one affine layer, which can only draw a straight boundary, so XOR is out of reach however long it trains. A ReLU between layers breaks the collapse. More layers or more biases are still affine, and longer training can't find a solution that doesn't exist.
      - id: nonlinearity.transfer.v3.3
        prompt: 'A courier charges nothing for the first 3 km, then 2 dollars per km beyond that. Which one-unit network gives the fee for distance d?'
        options:
          - id: c
            text: fee = 2 × ReLU(d − 3)
          - id: a
            text: fee = ReLU(2d − 3)
          - id: b
            text: fee = 2d − 3
          - id: d
            text: fee = ReLU(2d) − 3
        answer: c
        feedback: 'ReLU(d − 3) is 0 up to 3 km and then grows by 1 per km, so doubling it gives the fee: at 5 km, 2 × 2 = 4. ReLU(2d − 3) already charges 3 dollars at 3 km, and 2d − 3 has no bend at all.'
      - id: nonlinearity.transfer.v3.4
        prompt: The universal approximation theorem says one hidden layer can approximate any continuous function on a bounded range. What does it leave open?
        options:
          - id: d
            text: Whether the hidden units need a nonlinear activation
          - id: b
            text: Whether one hidden layer is enough in principle
          - id: c
            text: Whether the output layer is allowed to be linear
          - id: a
            text: How many hidden units it takes and how to find the weights
        answer: a
        feedback: The theorem promises that good weights exist, not how many units they need or whether training will find them. It does require a nonlinear activation (with none, the network collapses to one affine rule), and it answers the one-layer question with yes, using a linear output.
      - id: nonlinearity.transfer.v3.5
        prompt: A sigmoid unit has pre-activation around 6 on every training example, and the weights feeding it barely change during training. What is the most likely reason?
        options:
          - id: b
            text: Its output is near 0, so it contributes nothing
          - id: a
            text: Its slope there is nearly 0, so gradients through it are tiny
          - id: c
            text: The sigmoid has no derivative for inputs above 5
          - id: d
            text: Its bias is too large to be updated by training
        answer: a
        feedback: 'At z = 6 the sigmoid is saturated: its output is about 0.998 and its slope σ(1 − σ) is about 0.0025, so almost no gradient reaches its weights. Its output is near 1, not 0, and the derivative exists everywhere; it is just tiny.'
