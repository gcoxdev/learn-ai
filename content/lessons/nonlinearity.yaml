scenes:
- id: nonlinearity.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.nonlinearity
  text_mode: The complete explanation is available as readable text.
  title: Stacking a linear rule
  markdown: 'If one layer multiplies x by 2 and the next multiplies by 3, their combined rule is 6x. Two steps
    can be written as one.


    More generally, composing affine maps—weighted sums plus biases—still gives an affine map. Stacking only
    these operations does not create arbitrary curved decision boundaries.'
- id: nonlinearity.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.nonlinearity
  text_mode: The complete explanation is available as readable text.
  title: Add a bend
  markdown: 'ReLU returns max(0, z). It changes behavior at zero, introducing a bend. Other activations, such
    as sigmoid and GELU, have different shapes and properties.


    With nonlinear operations between layers, the overall model can express a richer set of relationships.'
- id: nonlinearity.s3
  type: explanation
  depth: intuition
  objective_refs:
  - objective.nonlinearity
  text_mode: The complete explanation is available as readable text.
  title: A pattern that needs a different boundary
  markdown: 'Consider an exclusive-or pattern: output true when exactly one of two binary inputs is true. A
    single linear-threshold unit cannot separate all four cases correctly.


    Additional structure with nonlinear units can represent this pattern. This illustrates a limitation of
    a single decision boundary, not a claim that every bigger network will learn successfully.'
- id: nonlinearity.s4
  type: explanation
  depth: intuition
  objective_refs:
  - objective.nonlinearity
  text_mode: The complete explanation is available as readable text.
  title: Expressive is not automatically effective
  markdown: 'A model’s ability to represent a function is different from whether training finds good parameters
    with available data and compute.


    Architecture, optimization, and generalization are related but distinct questions.'
