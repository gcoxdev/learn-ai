assessment_families:
- id: nonlinearity.base
  objective_ref: objective.nonlinearity
  task: base
  response_type: single_choice
  points: 1
  hint: Nonlinear operations let stacked layers express relationships that repeated affine transformations
    alone cannot.
  variants:
  - id: nonlinearity.base.1
    prompt: A layer computes 2x and the next computes 3 times that. What is the combined rule?
    options:
    - id: correct
      text: 6x
    - id: a
      text: 5x
    - id: b
      text: A nonlinear rule for every x
    answer: correct
    feedback: 3×(2x)=6x. Repeating linear scaling remains linear.
  - id: nonlinearity.base.2
    prompt: What makes ReLU nonlinear?
    options:
    - id: a
      text: It has many stored training examples.
    - id: b
      text: It always returns the original value.
    - id: correct
      text: Its rule changes at zero.
    answer: correct
    feedback: Its rule changes at zero.
- id: nonlinearity.transfer
  objective_ref: objective.nonlinearity
  task: transfer
  response_type: single_choice
  points: 1
  hint: Nonlinear operations let stacked layers express relationships that repeated affine transformations
    alone cannot.
  variants:
  - id: nonlinearity.transfer.1
    prompt: Does adding more affine layers alone guarantee a richer nonlinear boundary?
    options:
    - id: a
      text: Yes. Layer count alone creates nonlinearity.
    - id: b
      text: Yes, provided the biases are nonzero.
    - id: correct
      text: No. Their composition remains affine.
    answer: correct
    feedback: No. Their composition remains affine.
  - id: nonlinearity.transfer.2
    prompt: A network can represent a useful function. Does that prove training will find it?
    options:
    - id: b
      text: Yes. More parameters remove all data limitations.
    - id: correct
      text: No. Representation capacity and successful learning are different.
    - id: a
      text: Yes. Capacity guarantees the optimizer succeeds.
    answer: correct
    feedback: No. Representation capacity and successful learning are different.
