lesson:
  id: nonlinearity
  version: 0.1.0-draft
  title: Why layers need more than multiplication
  state: draft
  summary: Nonlinear operations let stacked layers express relationships that repeated affine transformations
    alone cannot.
  slot: M11.2
  category: learning
  minutes: 10
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — topic overview'
    url: https://aima.cs.berkeley.edu/contents.html
objectives:
- id: objective.nonlinearity
  version: 1-draft
  statement: Nonlinear operations let stacked layers express relationships that repeated affine transformations
    alone cannot.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
