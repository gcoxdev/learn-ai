schema_version: 0.2-draft
lesson:
  id: physical-ai-evaluation
  version: 0.3.0-draft
  title: Evaluate closed-loop behavior under physical uncertainty
  state: draft
  summary: Measure a robot’s complete behavior, including help, delays, and recovery.
  slot: M30.8
  category: learning
  sources:
  - title: Modern Robotics — authors’ textbook and resources
    url: https://modernrobotics.northwestern.edu/nu-gm-book-resource/
  - title: NIST AI Risk Management Framework
    url: https://www.nist.gov/itl/ai-risk-management-framework
objectives:
- id: objective.physical-ai-evaluation
  version: 1-draft
  statement: Physical AI evaluation must measure task success, constraints, uncertainty, interventions, and
    recovery over representative conditions; a successful demonstration is a bounded observation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - physical-ai-evaluation.base
  - physical-ai-evaluation.transfer
  prerequisites:
  - anyOf:
    - objective.feedback-and-robot-control
  - anyOf:
    - objective.robot-sensors-and-frames
  - anyOf:
    - objective.stakeholders-and-deployment-decisions
  - anyOf:
    - objective.baselines-and-success
scenes:
- id: physical-ai-evaluation.s1
  title: Define success and unacceptable outcomes
  type: explanation
  depth: intuition
  objective_refs:
  - objective.physical-ai-evaluation
  markdown: A manipulation task can require placing an object correctly without damage, collision, or excessive
    force. Success rate alone can hide serious near misses. Record constraints, initial conditions, object
    variations, and what human assistance is allowed.
  text_mode: A manipulation task can require placing an object correctly without damage, collision, or excessive
    force. Success rate alone can hide serious near misses. Record constraints, initial conditions, object
    variations, and what human assistance is allowed.
  bridges: []
- id: physical-ai-evaluation.s2
  title: Account for uncertainty and timing
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.physical-ai-evaluation
  markdown: 'Sensors are noisy, objects move, and communication or inference can take time. Test perception
    uncertainty, control frequency, actuator limits, and delays between sensing and acting.


    An object moving at 0.5 meter per second travels 0.1 meter during a 0.2-second delay. A pose estimate from
    before that delay may no longer describe its current location. Even a correctly computed command can be
    wrong for the state in which it finally executes.'
  text_mode: 'Sensors are noisy, objects move, and communication or inference can take time. Test perception
    uncertainty, control frequency, actuator limits, and delays between sensing and acting.


    An object moving at 0.5 meter per second travels 0.1 meter during a 0.2-second delay. A pose estimate from
    before that delay may no longer describe its current location. Even a correctly computed command can be
    wrong for the state in which it finally executes.'
  bridges: []
- id: physical-ai-evaluation.s3
  title: Measure intervention and recovery
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.physical-ai-evaluation
  markdown: 'Count human resets, guidance, and recovery assistance as part of the result. Define what help
    the evaluation permits and how the system should stop or recover under controlled conditions.


    If nine of ten trials finish, but three of those nine require human help, unassisted success is six of
    ten, or 60%, under a rubric that disallows help. Report assisted completion separately so readers can tell
    what the robot accomplished on its own.'
  text_mode: 'Count human resets, guidance, and recovery assistance as part of the result. Define what help
    the evaluation permits and how the system should stop or recover under controlled conditions.


    If nine of ten trials finish, but three of those nine require human help, unassisted success is six of
    ten, or 60%, under a rubric that disallows help. Report assisted completion separately so readers can tell
    what the robot accomplished on its own.'
  bridges: []
- id: physical-ai-evaluation.s4
  title: Expand deployment evidence gradually
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.physical-ai-evaluation
  markdown: Use repeatable controlled trials, new environments, and appropriate domain review before expanding
    operating conditions. Preserve failure traces and update limits after incidents. Simulation, lab demonstrations,
    and production performance answer different questions and should be reported separately.
  text_mode: Use repeatable controlled trials, new environments, and appropriate domain review before expanding
    operating conditions. Preserve failure traces and update limits after incidents. Simulation, lab demonstrations,
    and production performance answer different questions and should be reported separately.
  bridges: []
- id: physical-ai-evaluation.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.physical-ai-evaluation
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Measure complete physical trials, including errors, delays, interventions, and recovery. Report
    what succeeded independently and the conditions under which it worked.
- id: physical-ai-evaluation.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.physical-ai-evaluation
  markdown: Measure complete physical trials, including errors, delays, interventions, and recovery. Report
    what succeeded independently and the conditions under which it worked.
  text_mode: Measure complete physical trials, including errors, delays, interventions, and recovery. Report
