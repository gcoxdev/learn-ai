schema_version: 0.2-draft
lesson:
  id: physical-ai-evaluation
  version: 0.4.0-draft
  title: Evaluate closed-loop behavior under physical uncertainty
  state: draft
  summary: Tidy racked 18 of 20 mugs. Is it a 90% robot? Anywhere from 70% to 97%, it turns out. Learn to put honest error bars, safety limits, and conditions on a robot's results.
  slot: M30.8
  category: learning
  sources:
    - title: Modern Robotics — authors’ textbook and resources
      url: https://modernrobotics.northwestern.edu/nu-gm-book-resource/
    - title: NIST AI Risk Management Framework
      url: https://www.nist.gov/itl/ai-risk-management-framework
    - title: "Probable Inference, the Law of Succession, and Statistical Inference (Wilson, 1927)"
      url: https://doi.org/10.1080/01621459.1927.10502953
    - title: "ISO/TS 15066:2016 Robots and robotic devices — Collaborative robots"
      url: https://www.iso.org/standard/62996.html
objectives:
  - id: objective.physical-ai-evaluation
    version: 2-draft
    statement: Define success and failure for a physical task, put a confidence interval on a success rate from few trials, count interventions honestly, test across physical conditions, and name the hardware safety limits and report details a robot evaluation needs.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - physical-ai-evaluation.base.v2
      - physical-ai-evaluation.transfer.v2
      - physical-ai-evaluation.calculate
    prerequisites:
      - anyOf:
          - objective.feedback-and-robot-control
      - anyOf:
          - objective.robot-sensors-and-frames
      - anyOf:
          - objective.stakeholders-and-deployment-decisions
      - anyOf:
          - objective.baselines-and-success
scenes:
  - id: physical-ai-evaluation.s1
    title: What counts as a success?
    type: explanation
    depth: intuition
    objective_refs:
      - objective.physical-ai-evaluation
    markdown: |-
      Tidy, our kitchen robot, has a new mug-racking policy. The team runs it 20 times and 18 mugs end up in the rack. Before anyone says "90%", ask what "ended up in the rack" means. Write the rule down *before* the first trial:

      | Counts as a success | Counts as a failure |
      | --- | --- |
      | Mug upside down in the rack, unchipped | Mug dropped, chipped, or left on its side |
      | Done within 30 seconds | Any contact force above 50 N |
      | No human touched the robot or the mug | Anything outside the marked workspace moved |

      Deciding afterwards invites generous judgment calls ("it *nearly* made it"). Also list the **setup**: which mugs, where they started, the lighting, the policy version. A result means little without the conditions it was measured under.
    bridges: []
  - id: physical-ai-evaluation.ci
    title: 18 out of 20 is a range, not a number
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.physical-ai-evaluation
    markdown: |-
      Robot trials are slow, so samples are small. Module 28's lesson on measuring uncertainty gave the usual 95% confidence interval for a rate, $\hat p \pm 1.96\sqrt{\hat p(1-\hat p)/n}$. For 18 of 20:

      $$\hat p = 0.9, \qquad 1.96\sqrt{\frac{0.9 \times 0.1}{20}} = 1.96 \times 0.0671 = 0.131$$

      That gives 76.9% to 103.1%. A success rate above 100% is impossible, which tells you this approximation breaks down for small $n$ near 0% or 100%. The **Wilson interval** (Wilson, 1927) fixes it and is a standard choice for small samples like robot trials:

      :::papers The Wilson score interval
      $$\frac{\hat p + \frac{z^2}{2n}}{1 + \frac{z^2}{n}} \;\pm\; \frac{z}{1 + \frac{z^2}{n}}\sqrt{\frac{\hat p(1-\hat p)}{n} + \frac{z^2}{4n^2}}$$

      With $\hat p = 0.9$, $n = 20$, $z = 1.96$: the center is $0.996 / 1.192 = 0.836$ and the half-width is $1.644 \times 0.0831 = 0.137$. So Tidy's true rate is plausibly anywhere from **69.9% to 97.2%**. The center sits below 0.9 because Wilson's formula pulls it a little toward 50%, which is what keeps the interval inside 0–100%.
      :::

      ```python run
      import math

      def wald(k, n, z=1.96):
          p = k / n
          half = z * math.sqrt(p * (1 - p) / n)
          return p - half, p + half

      def wilson(k, n, z=1.96):
          p = k / n
          center = (p + z**2 / (2 * n)) / (1 + z**2 / n)
          half = z / (1 + z**2 / n) * math.sqrt(p * (1 - p) / n + z**2 / (4 * n**2))
          return center - half, center + half

      for k, n in [(18, 20), (20, 20), (15, 20), (90, 100)]:
          lo_w, hi_w = wald(k, n)
          lo, hi = wilson(k, n)
          print(f"{k:3d}/{n:<3d} = {k/n:4.0%}   normal approx: {lo_w:5.1%} to {hi_w:6.1%}   Wilson: {lo:5.1%} to {hi:5.1%}")
      ```

      :::predict Tidy goes 20 for 20. What can you claim?
      Not "never fails". The normal approximation collapses to 100%–100%, which is useless. Wilson gives 83.9% to 100%. A quick rule, the **rule of three**: after $n$ straight successes, a 95% upper bound on the failure rate is about $3/n$, here 15%.
      :::

      :::mixup "Policy A went 18/20 and B went 15/20, so A is better."
      Their intervals, 69.9–97.2% and 53.1–88.8%, overlap heavily. Twenty trials each can't separate them. At 90/100 the interval tightens to 82.6–94.5%, which is why careful labs run dozens to hundreds of trials per condition.
      :::
    bridges: []
  - id: physical-ai-evaluation.s2
    title: The kitchen changes every day
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.physical-ai-evaluation
    markdown: |-
      Tidy's 20 trials all happened at noon, with the team's six favorite mugs. Real kitchens shift: dim evenings, new mugs, a cluttered counter, a wet table. So test by condition, and report each one:

      | Condition | Successes | Wilson 95% interval |
      | --- | ---: | ---: |
      | Bright, familiar mugs | 18/20 | 70–97% |
      | Dim light | 13/20 | 43–82% |
      | New mug shapes | 11/20 | 34–74% |

      The overall average would hide that new mugs are the weak spot. Timing shifts too: if the mug slides at 0.5 m/s and the camera-to-motor delay is 0.2 s, the mug moves $0.5 \times 0.2 = 0.1$ m before the command lands, so test with objects in motion, not only at rest.
    bridges: []
  - id: physical-ai-evaluation.s3
    title: A rescued trial isn't a success
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.physical-ai-evaluation
    markdown: |-
      In a later run of 10 trials, 9 mugs reach the rack, but in 3 of those a person nudged the mug or reset the arm. Under the rule "no human touch", the unassisted success rate is $6/10 = 60\%$, not 90%. Report both numbers, and the **intervention rate** (3 per 10 trials), so readers can see what Tidy did alone.

      Run the trials in a fair order, too. If policy A is tested in the morning and policy B in the afternoon, sunlight, battery level, and a tired operator all differ. Alternate A and B, or randomize the order, so the conditions affect both equally.
    bridges: []
  - id: physical-ai-evaluation.safety
    title: Safety limits live outside the policy
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.physical-ai-evaluation
    markdown: |-
      A learned policy can do something it never did in testing, so the protections that matter most don't depend on it:

      - **Force and speed limits**, enforced by the low-level controller, cap how hard the arm can press or how fast it moves near people. The technical specification for robots that work beside people, ISO/TS 15066 (2016), lists allowable contact forces and pressures for different body regions; the 2025 edition of the industrial-robot safety standard, ISO 10218, builds these requirements in.
      - An **emergency stop** is a physical button that cuts motor power through hardware, whatever the software is doing. Test it before every session.
      - **Workspace limits** are virtual walls the controller refuses to cross, plus sensors that slow or stop the robot when someone comes near.

      Work the separation distance. A person walking at 1.6 m/s (a common design value) toward Tidy, which needs 0.1 s to detect them and 0.5 s to stop, covers $1.6 \times 0.6 = 0.96$ m in that time. So the "slow down" zone must start at least about a meter out, plus the distance the arm itself travels while stopping.
    bridges: []
  - id: physical-ai-evaluation.s4
    title: Write the report someone can trust
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.physical-ai-evaluation
    markdown: |-
      Two labs both report "85% success". Lab A ran 200 trials on 12 mug types it had never trained on, counted every intervention, and published videos of the failures. Lab B ran 20 trials on its training mugs and dropped two "setup glitches". Only Lab A's number tells you what to expect.

      A useful robot report states the success rule, the number of trials with a Wilson interval, the conditions and how new they were, interventions and resets, the safety limits in force, the policy version, and a sample of failures. Simulation, lab, and real-kitchen results each get their own line.
    bridges: []
  - id: physical-ai-evaluation.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.physical-ai-evaluation
    markdown: Put confidence intervals on a few trial counts, then judge a morning-versus-afternoon comparison, a hospital robot tested only at night, a cobot's safety case, and two labs' "85%".
    takeaway: |-
      A success rate from 20 trials is a range: 18/20 is about 70–97%. Define success before testing, count every intervention, test each condition separately, and keep safety limits in hardware, outside the learned policy.
  - id: physical-ai-evaluation.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.physical-ai-evaluation
    markdown: |-
      Measure complete physical trials, including errors, delays, interventions, and recovery. Report what succeeded independently and the conditions under which it worked.
