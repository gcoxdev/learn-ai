schema_version: 0.2-draft
lesson:
  id: physical-ai-evaluation
  version: 0.1.0-draft
  title: Evaluate closed-loop behavior under physical uncertainty
  state: draft
  summary: Physical AI evaluation must measure task success, constraints, uncertainty, interventions, and recovery
    over representative conditions; a successful demonstration is a bounded observation.
  slot: M30.8
  category: learning
  minutes: 12
  sources:
  - title: Modern Robotics — authors’ textbook and resources
    url: https://modernrobotics.northwestern.edu/nu-gm-book-resource/
  - title: NIST AI Risk Management Framework
    url: https://www.nist.gov/itl/ai-risk-management-framework
objectives:
- id: objective.physical-ai-evaluation
  version: 1-draft
  statement: Physical AI evaluation must measure task success, constraints, uncertainty, interventions, and recovery
    over representative conditions; a successful demonstration is a bounded observation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - physical-ai-evaluation.base
  - physical-ai-evaluation.transfer
  prerequisites:
  - anyOf:
    - objective.feedback-and-robot-control
  - anyOf:
    - objective.robot-sensors-and-frames
  - anyOf:
    - objective.stakeholders-and-deployment-decisions
  - anyOf:
    - objective.baselines-and-success
scenes:
- id: physical-ai-evaluation.s1
  title: Define success and unacceptable outcomes
  type: explanation
  depth: intuition
  objective_refs:
  - objective.physical-ai-evaluation
  markdown: A manipulation task can require placing an object correctly without damage, collision, or excessive
    force. Success rate alone can hide serious near misses. Record constraints, initial conditions, object variations,
    and what human assistance is allowed.
  text_mode: A manipulation task can require placing an object correctly without damage, collision, or excessive
    force. Success rate alone can hide serious near misses. Record constraints, initial conditions, object variations,
    and what human assistance is allowed.
  bridges: []
- id: physical-ai-evaluation.s2
  title: Account for uncertainty and timing
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.physical-ai-evaluation
  markdown: Sensors are noisy, objects move, and communication or inference can be delayed. Test perception uncertainty,
    control frequency, actuator limits, and stale commands. A correct action for an old state can be wrong by the
    time it executes.
  text_mode: Sensors are noisy, objects move, and communication or inference can be delayed. Test perception uncertainty,
    control frequency, actuator limits, and stale commands. A correct action for an old state can be wrong by the
    time it executes.
  bridges: []
- id: physical-ai-evaluation.s3
  title: Measure intervention and recovery
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.physical-ai-evaluation
  markdown: If a person repeatedly resets or guides the robot, include those interventions in the result. Define
    safe stopping and recovery under controlled conditions. A system that completes 9 of 10 tasks only after hidden
    assistance should not be reported as 90 percent autonomous success.
  text_mode: If a person repeatedly resets or guides the robot, include those interventions in the result. Define
    safe stopping and recovery under controlled conditions. A system that completes 9 of 10 tasks only after hidden
    assistance should not be reported as 90 percent autonomous success.
  bridges: []
- id: physical-ai-evaluation.s4
  title: Expand deployment evidence gradually
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.physical-ai-evaluation
  markdown: Use repeatable controlled trials, new environments, and appropriate domain review before expanding operating
    conditions. Preserve failure traces and update limits after incidents. Simulation, lab demonstrations, and production
    performance answer different questions and should be reported separately.
  text_mode: Use repeatable controlled trials, new environments, and appropriate domain review before expanding
    operating conditions. Preserve failure traces and update limits after incidents. Simulation, lab demonstrations,
    and production performance answer different questions and should be reported separately.
  bridges: []
- id: physical-ai-evaluation.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.physical-ai-evaluation
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Physical AI evaluation must measure task success, constraints, uncertainty, interventions, and recovery
    over representative conditions; a successful demonstration is a bounded observation.
- id: physical-ai-evaluation.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.physical-ai-evaluation
  markdown: Physical AI evaluation must measure task success, constraints, uncertainty, interventions, and recovery
    over representative conditions; a successful demonstration is a bounded observation.
  text_mode: Physical AI evaluation must measure task success, constraints, uncertainty, interventions, and recovery
    over representative conditions; a successful demonstration is a bounded observation.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - physical-ai-evaluation.s1
    - physical-ai-evaluation.s2
    - physical-ai-evaluation.s3
    - physical-ai-evaluation.s4
    - physical-ai-evaluation.check
    gate_refs:
    - gate.core
  scene_aliases:
    physical-ai-evaluation.recap: physical-ai-evaluation.check
assessment_families:
- id: physical-ai-evaluation.base
  objective_ref: objective.physical-ai-evaluation
  task: base
  response_type: single_choice
  points: 1
  hint: 'Account for uncertainty and timing: trace the inputs, operation, and result before choosing.'
  remediation_scene: physical-ai-evaluation.s2
  variants:
  - id: physical-ai-evaluation.base.1
    prompt: Why record near misses as well as successful placements?
    options:
    - id: c
      text: Near misses prove perfect control
    - id: a
      text: Task completion can hide unacceptable physical behavior
    - id: b
      text: Only failures matter in every experiment
    answer: a
    feedback: Safety-relevant outcomes extend beyond final position.
  - id: physical-ai-evaluation.base.2
    prompt: Can a delayed correct command become wrong?
    options:
    - id: a
      text: Yes; the physical state may change
    - id: b
      text: 'No'
    - id: c
      text: Only if its text is misspelled
    answer: a
    feedback: Closed-loop timing affects action validity.
- id: physical-ai-evaluation.transfer
  objective_ref: objective.physical-ai-evaluation
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Expand deployment evidence gradually: trace the inputs, operation, and result before choosing.'
  remediation_scene: physical-ai-evaluation.s4
  variants:
  - id: physical-ai-evaluation.transfer.1
    prompt: Should hidden human resets count as autonomous success?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if the final pose is correct
    answer: a
    feedback: Intervention changes the claimed operating mode.
  - id: physical-ai-evaluation.transfer.2
    prompt: Does one successful demonstration establish broad deployment readiness?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only for a small robot
    - id: a
      text: 'No'
    answer: a
    feedback: Coverage, reliability, and operating limits require more evidence.
