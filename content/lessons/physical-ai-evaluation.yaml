assessment_families:
  - id: physical-ai-evaluation.base
    objective_ref: objective.physical-ai-evaluation
    task: base
    response_type: single_choice
    points: 1
    hint: 'Account for uncertainty and timing: trace the inputs, operation, and result before choosing.'
    remediation_scene: physical-ai-evaluation.s2
    variants:
      - id: physical-ai-evaluation.base.1
        prompt: Why record near misses as well as successful placements?
        options:
          - id: c
            text: Near misses prove perfect control
          - id: a
            text: Task completion can hide unacceptable physical behavior
          - id: b
            text: Only failures matter in every experiment
        answer: a
        feedback: Safety-relevant outcomes extend beyond final position.
        retired: true
      - id: physical-ai-evaluation.base.2
        prompt: Can a delayed correct command become wrong?
        options:
          - id: a
            text: Yes; the physical state may change
          - id: b
            text: 'No'
          - id: c
            text: Only if its text is misspelled
        answer: a
        feedback: Closed-loop timing affects action validity.
        retired: true
  - id: physical-ai-evaluation.transfer
    objective_ref: objective.physical-ai-evaluation
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Expand deployment evidence gradually: trace the inputs, operation, and result before choosing.'
    remediation_scene: physical-ai-evaluation.s4
    variants:
      - id: physical-ai-evaluation.transfer.1
        prompt: Should hidden human resets count as autonomous success?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if the final pose is correct
        answer: a
        feedback: Intervention changes the claimed operating mode.
        retired: true
      - id: physical-ai-evaluation.transfer.2
        prompt: Does one successful demonstration establish broad deployment readiness?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only for a small robot
          - id: a
            text: 'No'
        answer: a
        feedback: Coverage, reliability, and operating limits require more evidence.
        retired: true
  - id: physical-ai-evaluation.base.v2
    objective_ref: objective.physical-ai-evaluation
    task: base
    response_type: single_choice
    points: 1
    hint: "Turn every count into a range before comparing, and count a trial as a success only if it meets the rule written before testing."
    remediation_scene: physical-ai-evaluation.ci
    variants:
      - id: physical-ai-evaluation.base.v2.1
        prompt: Policy A succeeds on 18 of 20 trials and policy B on 15 of 20. Their Wilson intervals are about 70–97% and 53–89%. What should the team conclude?
        options:
          - id: b
            text: A is the better policy, since 90% clearly beats 75%
          - id: a
            text: The intervals overlap a lot, so more trials are needed
          - id: c
            text: Twenty trials say nothing, so the counts should be ignored
        answer: a
        feedback: With 20 trials each, the plausible ranges overlap heavily, so the data can't yet separate the policies. The counts aren't useless, since each interval rules out some rates; they just aren't enough for this comparison.
      - id: physical-ai-evaluation.base.v2.2
        prompt: A robot succeeds on all 20 of 20 trials. What is a fair statement about its failure rate?
        options:
          - id: c
            text: Its failure rate is 0%, as measured on these trials
          - id: b
            text: Nothing can be said until it fails at least once
          - id: a
            text: It could still be as high as about 15% (the rule of three)
        answer: a
        feedback: After n straight successes, a 95% upper bound on the failure rate is about 3/n, here 3/20 = 15%. "0%" treats a small sample as exact, while "nothing" ignores that 20 successes do rule out high failure rates.
      - id: physical-ai-evaluation.base.v2.3
        prompt: For 18 of 20 successes, the normal-approximation interval runs from about 77% to 103%. Why do robot evaluations prefer the Wilson interval here?
        options:
          - id: a
            text: It stays inside 0–100% and behaves well for small n near the extremes
          - id: b
            text: It is always narrower, so it makes the results look stronger
          - id: c
            text: It avoids square roots, so it is easier to compute by hand
        answer: a
        feedback: The normal approximation can spill past 100% or collapse to zero width at 20/20. Wilson's interval stays in range and is more accurate for small samples. It isn't always narrower (here it's slightly wider), and it has square roots too.
      - id: physical-ai-evaluation.base.v2.4
        prompt: In 10 trials, 9 mugs reach the rack, but a person helped in 3 of those 9. The success rule says no human touch. What is the unassisted success rate?
        options:
          - id: b
            text: 90%, since 9 of the 10 mugs reached the rack
          - id: c
            text: 30%, since help was needed in 3 of the 10 trials
          - id: a
            text: 60%, since only 6 trials finished without help
        answer: a
        feedback: Rescued trials fail the "no human touch" rule, leaving 6 unassisted successes out of 10. Report the 90% assisted completion separately, along with the intervention rate of 3 per 10 trials.
  - id: physical-ai-evaluation.transfer.v2
    objective_ref: objective.physical-ai-evaluation
    task: transfer
    response_type: single_choice
    points: 1
    hint: "Ask what else differs between the runs being compared (time, place, conditions, who helped), and what would still protect people if the learned policy misbehaved."
    remediation_scene: physical-ai-evaluation.s4
    variants:
      - id: physical-ai-evaluation.transfer.v2.1
        prompt: A warehouse team tests policy A every morning and policy B every afternoon for a week. B wins by 8 points. What is the main problem with this comparison?
        options:
          - id: a
            text: Time of day changes lighting, battery, and staff; alternate the order
          - id: b
            text: A week is too short; both policies need a month of testing each
          - id: c
            text: Mornings are harder for robots, so A's score should be raised
        answer: a
        feedback: Any difference between mornings and afternoons is tangled with the policy difference. Alternating or randomizing the trial order spreads those conditions evenly. A longer test with the same schedule keeps the confound, and a guessed adjustment isn't evidence.
      - id: physical-ai-evaluation.transfer.v2.2
        prompt: A hospital delivery robot scored 97% in trials run in empty corridors at night. It will work during the day among visitors and beds. What should the evaluation add?
        options:
          - id: c
            text: More night trials, to tighten the 97% interval further
          - id: a
            text: Separate trials in crowded daytime corridors, reported on their own
          - id: b
            text: A simulated crowd, replacing real trials in daytime corridors
        answer: a
        feedback: The deployment conditions differ from the tested ones, so test those conditions directly and report them as their own slice. More night trials make the wrong number more precise; simulation can help prepare, but it doesn't replace real crowded trials.
      - id: physical-ai-evaluation.transfer.v2.3
        prompt: A factory wants a learned arm to work beside people. Which evidence best supports its safety?
        options:
          - id: b
            text: A 99% task success rate over 500 trials in the lab
          - id: c
            text: Training with a large penalty for touching people
          - id: a
            text: Hardware force limits, a tested e-stop, and workspace fences
        answer: a
        feedback: Safety limits enforced by the controller and hardware still hold if the policy does something unexpected. A high success rate measures the task, not what happens in a rare failure, and a reward penalty only discourages contact.
      - id: physical-ai-evaluation.transfer.v2.4
        prompt: Two labs each report "85% success" on robotic folding. What do you most need in order to compare them?
        options:
          - id: a
            text: Trial counts, success rules, test conditions, and interventions
          - id: b
            text: Each lab's model size and the compute used for training
          - id: c
            text: The number of demonstrations each lab collected in total
        answer: a
        feedback: The same 85% can mean 17 easy trials or 200 hard ones, with or without human help. Model size, compute, and data volume describe how each system was built, not how trustworthy its result is.
  - id: physical-ai-evaluation.calculate
    objective_ref: objective.physical-ai-evaluation
    task: base
    response_type: numeric
    points: 1
    hint: "Normal-approximation half-width = 1.96 × √(p̂(1 − p̂)/n), with p̂ = successes / trials. For n straight successes, the rule of three gives a failure bound of 3/n."
    remediation_scene: physical-ai-evaluation.ci
    absolute_tolerance: 0.005
    variants:
      - id: physical-ai-evaluation.calculate.1
        prompt: A robot succeeds on 40 of 50 trials. Using the normal approximation, what is the half-width of the 95% confidence interval, as a proportion?
        answer: 0.111
        feedback: "p̂ = 0.8, so √(0.8 × 0.2 / 50) = √0.0032 = 0.0566, and 1.96 × 0.0566 ≈ 0.111. The interval is about 0.69 to 0.91."
      - id: physical-ai-evaluation.calculate.2
        prompt: A robot succeeds on 30 of 60 trials. Using the normal approximation, what is the half-width of the 95% confidence interval, as a proportion?
        answer: 0.127
        feedback: "p̂ = 0.5, so √(0.25 / 60) = 0.0645, and 1.96 × 0.0645 ≈ 0.127."
      - id: physical-ai-evaluation.calculate.3
        prompt: A robot succeeds on 70 of 100 trials. Using the normal approximation, what is the half-width of the 95% confidence interval, as a proportion?
        answer: 0.09
        feedback: "p̂ = 0.7, so √(0.7 × 0.3 / 100) = √0.0021 = 0.0458, and 1.96 × 0.0458 ≈ 0.090."
      - id: physical-ai-evaluation.calculate.4
        prompt: A robot succeeds on 12 of 20 trials. Using the normal approximation, what is the half-width of the 95% confidence interval, as a proportion?
        answer: 0.215
        feedback: "p̂ = 0.6, so √(0.6 × 0.4 / 20) = √0.012 = 0.1095, and 1.96 × 0.1095 ≈ 0.215: plus or minus more than 20 points."
      - id: physical-ai-evaluation.calculate.5
        prompt: A robot succeeds on 60 of 60 trials. Using the rule of three, what is the approximate 95% upper bound on its failure rate, as a proportion?
        answer: 0.05
        feedback: "3 / 60 = 0.05, so the failure rate could still be as high as about 5%."
