schema_version: 0.2-draft
lesson:
  id: visual-pretraining
  version: 0.3.0-draft
  title: Learn visual features before choosing the final task
  state: draft
  summary: Learn from a visual puzzle before choosing the final picture task, then test what actually transfers.
  slot: M12.6
  category: learning
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: Masked Autoencoders Are Scalable Vision Learners
    url: https://arxiv.org/abs/2111.06377
objectives:
- id: objective.visual-pretraining
  version: 1-draft
  statement: Self-supervised visual objectives learn from transformations, missing patches, or paired views;
    transfer evaluation determines whether the representation supports the intended visual task.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - visual-pretraining.base
  - visual-pretraining.transfer
  prerequisites:
  - anyOf:
    - objective.self-supervised-representations
  - anyOf:
    - objective.convolutional-networks
scenes:
- id: visual-pretraining.s1
  title: Learn from a visual puzzle first
  type: explanation
  depth: intuition
  objective_refs:
  - objective.visual-pretraining
  markdown: '**Pretraining** is an initial learning stage before adapting a model to a final task. Cover some
    patches of a bicycle photo, ask the model to predict the missing information, and compare its answer with
    the hidden content. The image itself supplies the target without a separate “bicycle” label.


    Another task asks the model to relate different views of an image. These objectives can use large image
    collections with few category labels. They still reflect choices about what information to preserve and
    what variation to ignore.'
  text_mode: '**Pretraining** is an initial learning stage before adapting a model to a final task. Cover some
    patches of a bicycle photo, ask the model to predict the missing information, and compare its answer with
    the hidden content. The image itself supplies the target without a separate “bicycle” label.


    Another task asks the model to relate different views of an image. These objectives can use large image
    collections with few category labels. They still reflect choices about what information to preserve and
    what variation to ignore.'
  bridges: []
- id: visual-pretraining.s2
  title: Compare two visual tasks
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.visual-pretraining
  markdown: A contrastive learner may align different crops of one image while distinguishing other images.
    A masked-image learner predicts information missing from selected patches. These objectives reward different
    operations. A crop that removes the relevant object or a reconstruction dominated by texture can learn
    features poorly matched to a downstream task.
  text_mode: A contrastive learner may align different crops of one image while distinguishing other images.
    A masked-image learner predicts information missing from selected patches. These objectives reward different
    operations. A crop that removes the relevant object or a reconstruction dominated by texture can learn
    features poorly matched to a downstream task.
  bridges: []
- id: visual-pretraining.s3
  title: Transfer with a controlled protocol
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.visual-pretraining
  markdown: 'Freeze the pretrained encoder and train a simple classifier to measure easily accessible information,
    or fine-tune the model on the target task. These are different evaluations and use different compute and
    labels. A detector or segmenter can need spatial detail that an image-classification representation underemphasizes.


    **Freeze** means leave the encoder''s weights fixed while fitting a new output component. **Fine-tune**
    means allow selected pretrained weights to change too. Compare flower classification with locating tiny
    defects: knowing that a picture contains a flower is a different requirement from preserving the position
    of every small mark. Pick a transfer test that measures the needed information.'
  text_mode: 'Freeze the pretrained encoder and train a simple classifier to measure easily accessible information,
    or fine-tune the model on the target task. These are different evaluations and use different compute and
    labels. A detector or segmenter can need spatial detail that an image-classification representation underemphasizes.


    **Freeze** means leave the encoder''s weights fixed while fitting a new output component. **Fine-tune**
    means allow selected pretrained weights to change too. Compare flower classification with locating tiny
    defects: knowing that a picture contains a flower is a different requirement from preserving the position
    of every small mark. Pick a transfer test that measures the needed information.'
  bridges: []
- id: visual-pretraining.s4
  title: Audit the source and the transfer
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.visual-pretraining
  markdown: Check pretraining data overlap with evaluation sets, image rights and provenance, domain mismatch,
    and rare conditions. Compare a randomly initialized baseline with a matched training budget where meaningful.
    More pretraining data can help but does not guarantee robust or fair performance across every visual environment.
  text_mode: Check pretraining data overlap with evaluation sets, image rights and provenance, domain mismatch,
    and rare conditions. Compare a randomly initialized baseline with a matched training budget where meaningful.
    More pretraining data can help but does not guarantee robust or fair performance across every visual environment.
  bridges: []
- id: visual-pretraining.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.visual-pretraining
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A visual pretraining task can teach reusable features without labeling every image category. Test
    whether those features preserve what the later task actually needs.
- id: visual-pretraining.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.visual-pretraining
  markdown: A visual pretraining task can teach reusable features without labeling every image category. Test
    whether those features preserve what the later task actually needs.
  text_mode: A visual pretraining task can teach reusable features without labeling every image category. Test
    whether those features preserve what the later task actually needs.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - visual-pretraining.s1
    - visual-pretraining.s2
    - visual-pretraining.s3
    - visual-pretraining.s4
    - visual-pretraining.check
    gate_refs:
    - gate.core
