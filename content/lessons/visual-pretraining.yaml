schema_version: 0.2-draft
lesson:
  id: visual-pretraining
  version: 0.1.0-draft
  title: Learn visual features before choosing the final task
  state: draft
  summary: Self-supervised visual objectives learn from transformations, missing patches, or paired views; transfer
    evaluation determines whether the representation supports the intended visual task.
  slot: M12.6
  category: learning
  minutes: 12
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: Masked Autoencoders Are Scalable Vision Learners
    url: https://arxiv.org/abs/2111.06377
objectives:
- id: objective.visual-pretraining
  version: 1-draft
  statement: Self-supervised visual objectives learn from transformations, missing patches, or paired views; transfer
    evaluation determines whether the representation supports the intended visual task.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - visual-pretraining.base
  - visual-pretraining.transfer
  prerequisites:
  - anyOf:
    - objective.self-supervised-representations
  - anyOf:
    - objective.convolutional-networks
scenes:
- id: visual-pretraining.s1
  title: Use unlabeled images with a designed objective
  type: explanation
  depth: intuition
  objective_refs:
  - objective.visual-pretraining
  markdown: A model can predict missing image content or align representations of related views. This can use large
    image collections without a category annotation for every image. The objective still encodes assumptions about
    which information should be retained and which variation should be ignored.
  text_mode: A model can predict missing image content or align representations of related views. This can use large
    image collections without a category annotation for every image. The objective still encodes assumptions about
    which information should be retained and which variation should be ignored.
  bridges: []
- id: visual-pretraining.s2
  title: Compare two visual tasks
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.visual-pretraining
  markdown: A contrastive learner may align different crops of one image while distinguishing other images. A masked-image
    learner predicts information missing from selected patches. These objectives reward different operations. A
    crop that removes the relevant object or a reconstruction dominated by texture can learn features poorly matched
    to a downstream task.
  text_mode: A contrastive learner may align different crops of one image while distinguishing other images. A masked-image
    learner predicts information missing from selected patches. These objectives reward different operations. A
    crop that removes the relevant object or a reconstruction dominated by texture can learn features poorly matched
    to a downstream task.
  bridges: []
- id: visual-pretraining.s3
  title: Transfer with a controlled protocol
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.visual-pretraining
  markdown: Freeze the pretrained encoder and train a simple classifier to measure easily accessible information,
    or fine-tune the model on the target task. These are different evaluations and use different compute and labels.
    A detector or segmenter can need spatial detail that an image-classification representation underemphasizes.
  text_mode: Freeze the pretrained encoder and train a simple classifier to measure easily accessible information,
    or fine-tune the model on the target task. These are different evaluations and use different compute and labels.
    A detector or segmenter can need spatial detail that an image-classification representation underemphasizes.
  bridges: []
- id: visual-pretraining.s4
  title: Audit the source and the transfer
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.visual-pretraining
  markdown: Check pretraining data overlap with evaluation sets, image rights and provenance, domain mismatch, and
    rare conditions. Compare a randomly initialized baseline with a matched training budget where meaningful. More
    pretraining data can help but does not guarantee robust or fair performance across every visual environment.
  text_mode: Check pretraining data overlap with evaluation sets, image rights and provenance, domain mismatch,
    and rare conditions. Compare a randomly initialized baseline with a matched training budget where meaningful.
    More pretraining data can help but does not guarantee robust or fair performance across every visual environment.
  bridges: []
- id: visual-pretraining.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.visual-pretraining
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: visual-pretraining.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.visual-pretraining
  markdown: Self-supervised visual objectives learn from transformations, missing patches, or paired views; transfer
    evaluation determines whether the representation supports the intended visual task.
  text_mode: Self-supervised visual objectives learn from transformations, missing patches, or paired views; transfer
    evaluation determines whether the representation supports the intended visual task.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - visual-pretraining.s1
    - visual-pretraining.s2
    - visual-pretraining.s3
    - visual-pretraining.s4
    - visual-pretraining.check
    - visual-pretraining.recap
    gate_refs:
    - gate.core
assessment_families:
- id: visual-pretraining.base
  objective_ref: objective.visual-pretraining
  task: base
  response_type: single_choice
  points: 1
  hint: 'Compare two visual tasks: trace the inputs, operation, and result before choosing.'
  remediation_scene: visual-pretraining.s2
  variants:
  - id: visual-pretraining.base.1
    prompt: What signal can masked-image learning derive without class labels?
    options:
    - id: a
      text: The held-out image content or its representation
    - id: b
      text: A guaranteed object name for every patch
    - id: c
      text: No target at all
    answer: a
    feedback: Masking constructs a prediction target from the observed image.
  - id: visual-pretraining.base.2
    prompt: What stays fixed in a frozen-encoder evaluation?
    options:
    - id: b
      text: The downstream classifier’s parameters necessarily
    - id: c
      text: Every prediction label
    - id: a
      text: The encoder’s parameters
    answer: a
    feedback: Only selected downstream components are trained in that protocol.
- id: visual-pretraining.transfer
  objective_ref: objective.visual-pretraining
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Audit the source and the transfer: trace the inputs, operation, and result before choosing.'
  remediation_scene: visual-pretraining.s4
  variants:
  - id: visual-pretraining.transfer.1
    prompt: A crop removes the target object but is treated as an equivalent positive view. What is a risk?
    options:
    - id: b
      text: Guaranteed improved localization
    - id: c
      text: Elimination of all shortcuts
    - id: a
      text: Learning invariance to information the task needs
    answer: a
    feedback: Augmentation assumptions can conflict with downstream requirements.
  - id: visual-pretraining.transfer.2
    prompt: Pretraining includes evaluation images. What should be investigated?
    options:
    - id: c
      text: A guarantee of independent testing
    - id: a
      text: Overlap and contamination in the transfer claim
    - id: b
      text: Only the final image resolution
    answer: a
    feedback: Representation learning can absorb information from evaluation examples.
