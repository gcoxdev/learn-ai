schema_version: 0.2-draft
lesson:
  id: agents-and-workflows
  version: 0.4.0-draft
  title: Decide where a system follows a workflow and where it chooses actions
  state: draft
  summary: Ask a travel assistant to book a trip and it might follow a fixed recipe, or decide each step itself. Learn the difference, and when each is the right design.
  slot: M25.1
  category: learning
  sources:
    - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
      url: https://aima.cs.berkeley.edu/
    - title: ReAct
      url: https://arxiv.org/abs/2210.03629
    - title: Building effective agents (Anthropic, 2024)
      url: https://www.anthropic.com/engineering/building-effective-agents
objectives:
  - id: objective.agents-and-workflows
    version: 2-draft
    statement: An agent selects actions from observations toward an objective, while a workflow prescribes parts of the control flow; language models can participate in either design.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - agents-and-workflows.base.v2
      - agents-and-workflows.transfer.v2
    prerequisites:
      - anyOf:
          - objective.inside-a-system
      - anyOf:
          - objective.algorithms-and-programs
scenes:
  - id: agents-and-workflows.s1
    title: Book me a trip to Lisbon
    type: explanation
    depth: intuition
    objective_refs:
      - objective.agents-and-workflows
    markdown: |-
      You type into a travel assistant: *"Find me the cheapest flight to Lisbon next Friday and a hotel within walking distance of the conference."* Behind the chat box, something has to decide what happens next: search flights first or hotels? Check the conference address? Ask whether "next Friday" means the 3rd or the 10th?

      Throughout this module we'll follow one such assistant, **Wayfarer**, as it grows from a simple script into something far more capable.

      An **agent** is a system that runs a loop: it takes in an **observation** (what it can currently see), decides on an **action**, carries the action out, and looks again. Many systems fit that description, with very different amounts of freedom:

      | System | Observes | Decides | Acts on |
      | --- | --- | --- | --- |
      | Thermostat | Room temperature | Heat on or off, by a fixed rule | The heater |
      | Chess engine | The board | A move, by searching | The board |
      | Wayfarer | Your request and tool results | Which tool to call next, or to answer | Flight and hotel services |

      **Autonomy** is how much of that deciding the system does without a person choosing each step. A thermostat has a little; Wayfarer, if we let it, could have a lot. Acting doesn't mean learning: none of these systems changes its own rules while it runs.
    bridges: []
  - id: agents-and-workflows.s2
    title: A recipe or a decision-maker?
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.agents-and-workflows
    markdown: |-
      There are two ways to build Wayfarer.

      A **workflow** fixes the steps in ordinary code: always search flights, then hotels near the venue, then show the three cheapest combinations. A language model might write the summary at the end, but the *path* is decided by the programmer.

      An **agent loop** hands the path to the model: at every step, the model looks at everything so far and chooses the next tool, or decides it has enough to answer.

      | | Workflow | Agent loop |
      | --- | --- | --- |
      | Who picks the next step | The code | The model, each turn |
      | Predictable cost and time | Yes | Varies by request |
      | Handles surprises ("the venue moved") | Only if foreseen | Can adapt |
      | Easy to test | Yes, step by step | Harder: many possible paths |

      :::papers A useful distinction from practice
      Anthropic's 2024 guide *Building effective agents* draws the same line: *workflows* are "systems where LLMs and tools are orchestrated through predefined code paths," while *agents* are "systems where LLMs dynamically direct their own processes and tool usage." Its main advice: start with the simplest design that works, and add autonomy only when it clearly helps.
      :::

      Most real products mix the two: a fixed workflow for the parts that never change (always check the payment is authorized) and model decisions only where flexibility pays.
    bridges: []
    diagram:
      caption: 'Top: a workflow runs fixed steps. Bottom: an agent loop lets the model pick each next step.'
      description: In the workflow, a request goes to a flight search, then a hotel search, then a summary, always in that order. In the agent loop, the model reads the request and the history, chooses a tool, the program runs the tool, and the result goes back into the history for the model's next decision, until the model chooses to answer.
      nodes:
        - id: w-req
          label: Request
          col: 0
          row: 0
        - id: w-fly
          label: Search flights
          col: 1
          row: 0
        - id: w-hotel
          label: Search hotels
          col: 2
          row: 0
        - id: w-sum
          label: Summarize
          col: 3
          row: 0
        - id: a-req
          label: Request
          col: 0
          row: 1
        - id: a-model
          label: Model decides
          note: next tool, or answer
          col: 1
          row: 1
          tone: accent
        - id: a-tool
          label: Program runs tool
          col: 2
          row: 1
          tone: data
        - id: a-ans
          label: Answer
          col: 3
          row: 1
      edges:
        - from: w-req
          to: w-fly
        - from: w-fly
          to: w-hotel
        - from: w-hotel
          to: w-sum
        - from: a-req
          to: a-model
        - from: a-model
          to: a-tool
          label: tool call
        - from: a-tool
          to: a-model
          label: result
          bend: 2
        - from: a-model
          to: a-ans
          label: done
          bend: -2
  - id: agents-and-workflows.s3
    title: Think, act, observe
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.agents-and-workflows
    markdown: |-
      The most common agent-loop pattern is called **ReAct** (Yao et al., 2022), short for *reasoning and acting*. The model alternates between writing a short thought, requesting an action, and reading the result. Here is one Wayfarer run:

      | Step | The model writes | The program does |
      | --- | --- | --- |
      | 1 | *Thought:* I need flights first. *Action:* `search_flights` with `{"city": "Lisbon", "day": "Fri"}` | Calls the flight service, returns 2 flights |
      | 2 | *Thought:* The cheapest is \$148. Now a hotel near the venue. *Action:* `search_hotels` with `{"city": "Lisbon", "near": "conference"}` | Calls the hotel service, returns 1 hotel |
      | 3 | *Answer:* Harbor Air 71 (\$148) plus Rua Nova Guesthouse (\$131/night). | Shows the answer to you |

      Notice the right-hand column. A language model only produces text. The action in step 1 is just a small structured message, a **tool call**, naming a tool and its arguments. The surrounding program reads that message, checks it, runs the real flight search, and pastes the result back into the model's context for the next step.

      :::predict What stops the loop, and what if the model never says "Answer"?
      The loop ends when the model writes an answer instead of a tool call. Because a model might keep calling tools forever (repeating a failing search, say), every sensible agent program also has a **step limit** and stops with an error message when it's reached.
      :::

      :::mixup "The AI booked my flight."
      The model wrote a request that said *book this flight*. Ordinary code decided whether to honor it, called the airline, and handled the payment. That's good news: it means the program can check, limit, or ask you before anything consequential happens. You'll use that power in the permissions lesson.
      :::
    bridges: []
  - id: agents-and-workflows.s4
    title: Run a tiny agent loop
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.agents-and-workflows
    markdown: |-
      Here is the whole loop in about 30 lines. A real system would ask a language model for each move; to keep the run repeatable, `fake_model` is a few `if` statements that play the model's part. Everything else (the tool registry, the loop, the step limit) is how real agent programs are built.

      ```python run
      import json

      # The tools a program can run. The "model" below only proposes calls.
      def search_flights(city, day):
          return [{"flight": "SkyLine 204", "price": 212}, {"flight": "Harbor Air 71", "price": 148}]

      def search_hotels(city, near):
          return [{"hotel": "Rua Nova Guesthouse", "price": 131, "walk_min": 9}]

      TOOLS = {"search_flights": search_flights, "search_hotels": search_hotels}

      def fake_model(history):
          """Stand-in for a language model: read what happened so far, propose one next step."""
          used = [h["tool"] for h in history]
          if "search_flights" not in used:
              return {"tool": "search_flights", "args": {"city": "Lisbon", "day": "Fri"}}
          if "search_hotels" not in used:
              return {"tool": "search_hotels", "args": {"city": "Lisbon", "near": "conference"}}
          flight = min(history[0]["result"], key=lambda f: f["price"])
          hotel = history[1]["result"][0]
          return {"answer": f"{flight['flight']} (${flight['price']}) + {hotel['hotel']} (${hotel['price']}/night)"}

      history, MAX_STEPS = [], 5
      for step in range(1, MAX_STEPS + 1):
          move = fake_model(history)
          if "answer" in move:
              print(f"step {step}: done ->", move["answer"])
              break
          result = TOOLS[move["tool"]](**move["args"])   # the program, not the model, runs the tool
          history.append({"tool": move["tool"], "result": result})
          print(f"step {step}: {move['tool']}({json.dumps(move['args'])}) -> {len(result)} result(s)")
      else:
          print(f"stopped: hit the {MAX_STEPS}-step limit without an answer")
      ```

      Read the output from top to bottom: two tool calls, then an answer at step 3. Now change `MAX_STEPS` to `2` and run it again. Wayfarer stops with *"hit the 2-step limit without an answer"*: the limit protects you from a loop that never finishes, at the price of sometimes stopping too early.

      :::try Break it on purpose
      Make `search_hotels` return an empty list `[]`. What happens at step 3, and what should a careful agent do instead of crashing? (Hint: the tool-contracts lesson is about exactly this.)
      :::
    bridges: []
  - id: agents-and-workflows.autonomy
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.agents-and-workflows
    title: Give it the least freedom that works
    markdown: |-
      Autonomy isn't free. Each loop step is another model call, and each call rereads the growing history. Suppose a workflow answers a trip request with 2 model calls of about 2,000 tokens each: 4,000 tokens. An agent that takes 6 steps averaging 3,000 tokens per call uses 18,000 tokens, **4.5 times** as much, and it's slower and harder to test.

      So choose per task:

      | Task | Better design | Why |
      | --- | --- | --- |
      | "Email me my booking confirmation" | Workflow | Same steps every time |
      | "Find flights under \$200 to any beach city in May" | Agent | Which cities to check depends on what it finds |
      | "Refund my cancelled flight" | Workflow, with a human approval step | Consequential and rule-bound |

      :::key The design rule
      Start with a fixed workflow. Hand a decision to the model only where the right next step genuinely depends on what the system discovers along the way.
      :::

      The next lessons follow Wayfarer as it gains that freedom: precise tool contracts, plans that recover from failures, memory, several cooperating agents, permission boundaries, and finally a way to measure whether it actually works.
  - id: agents-and-workflows.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.agents-and-workflows
    markdown: |-
      Four questions look inside Wayfarer's loop, and four put you in charge of choosing a design: a pharmacy bot, a research helper, and a support desk.
    takeaway: |-
      An agent loops: observe, decide, act, repeat. The model only proposes actions; your program runs them. Use a fixed workflow unless the next step really depends on what the system discovers.
  - id: agents-and-workflows.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.agents-and-workflows
    markdown: |-
      An agent chooses actions from observations. A workflow fixes parts of the sequence in advance; a useful system can combine both.
