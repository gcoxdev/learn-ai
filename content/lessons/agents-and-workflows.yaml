schema_version: 0.2-draft
lesson:
  id: agents-and-workflows
  version: 0.3.0-draft
  title: Decide where a system follows a workflow and where it chooses actions
  state: draft
  summary: Follow the loop that turns observations into actions.
  slot: M25.1
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
  - title: ReAct
    url: https://arxiv.org/abs/2210.03629
objectives:
- id: objective.agents-and-workflows
  version: 1-draft
  statement: An agent selects actions from observations toward an objective, while a workflow prescribes parts
    of the control flow; language models can participate in either design.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - agents-and-workflows.base
  - agents-and-workflows.transfer
  prerequisites:
  - anyOf:
    - objective.inside-a-system
  - anyOf:
    - objective.algorithms-and-programs
scenes:
- id: agents-and-workflows.s1
  title: Agency is a system behavior
  type: explanation
  depth: intuition
  objective_refs:
  - objective.agents-and-workflows
  markdown: 'A thermostat, game-playing program, and language-model tool loop can all choose actions from observations,
    with very different capabilities. Calling a model an agent does not specify autonomy, memory, permissions,
    or learning. Describe the implemented loop and available actions.


    Autonomy is how much the system can decide without another person choosing each step. An agent can use
    fixed rules or a model trained earlier; acting does not necessarily update its weights. A thermostat can
    choose to turn heating on without learning a new rule. Keep three questions separate: what can it observe,
    what can it decide, and what can it actually change?'
  text_mode: 'A thermostat, game-playing program, and language-model tool loop can all choose actions from
    observations, with very different capabilities. Calling a model an agent does not specify autonomy, memory,
    permissions, or learning. Describe the implemented loop and available actions.


    Autonomy is how much the system can decide without another person choosing each step. An agent can use
    fixed rules or a model trained earlier; acting does not necessarily update its weights. A thermostat can
    choose to turn heating on without learning a new rule. Keep three questions separate: what can it observe,
    what can it decide, and what can it actually change?'
  bridges: []
- id: agents-and-workflows.s2
  title: Prescribe or delegate control
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agents-and-workflows
  markdown: A workflow might always retrieve documents, summarize them, and request review. An agent loop might
    choose whether to retrieve, calculate, or stop based on observations. Most practical systems combine fixed
    constraints with selected model decisions; more autonomy is a design choice with costs.
  text_mode: A workflow might always retrieve documents, summarize them, and request review. An agent loop
    might choose whether to retrieve, calculate, or stop based on observations. Most practical systems combine
    fixed constraints with selected model decisions; more autonomy is a design choice with costs.
  bridges: []
- id: agents-and-workflows.s3
  title: Trace one bounded loop
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agents-and-workflows
  markdown: Given a request to compare two records, the system reads both, detects a missing field, requests
    a permitted lookup, and checks completeness before answering. Each observation changes the next decision.
    The model’s text alone does not execute the lookup; a surrounding program dispatches the action.
  text_mode: Given a request to compare two records, the system reads both, detects a missing field, requests
    a permitted lookup, and checks completeness before answering. Each observation changes the next decision.
    The model’s text alone does not execute the lookup; a surrounding program dispatches the action.
  bridges: []
- id: agents-and-workflows.s4
  title: Choose complexity for the task
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agents-and-workflows
  markdown: If a fixed sequence handles the expected cases, an open-ended loop may add unnecessary failure
    paths and evaluation cost. If inputs require adaptation, constrained choices may help. Compare success,
    latency, recovery, and observability rather than treating the label agent as evidence of usefulness.
  text_mode: If a fixed sequence handles the expected cases, an open-ended loop may add unnecessary failure
    paths and evaluation cost. If inputs require adaptation, constrained choices may help. Compare success,
    latency, recovery, and observability rather than treating the label agent as evidence of usefulness.
  bridges: []
- id: agents-and-workflows.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.agents-and-workflows
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: An agent chooses actions from observations. A workflow fixes parts of the sequence in advance;
    a useful system can combine both.
- id: agents-and-workflows.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.agents-and-workflows
  markdown: An agent chooses actions from observations. A workflow fixes parts of the sequence in advance;
    a useful system can combine both.
  text_mode: An agent chooses actions from observations. A workflow fixes parts of the sequence in advance;
    a useful system can combine both.
