assessment_families:
  - id: agents-and-workflows.base
    objective_ref: objective.agents-and-workflows
    task: base
    response_type: single_choice
    points: 1
    hint: 'Prescribe or delegate control: trace the inputs, operation, and result before choosing.'
    remediation_scene: agents-and-workflows.s2
    variants:
      - id: agents-and-workflows.base.1
        prompt: Does the word agent specify its permissions?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only for language models
        answer: a
        feedback: Permissions belong to the surrounding system design.
        retired: true
      - id: agents-and-workflows.base.2
        prompt: A fixed retrieve-then-summarize sequence is best described as what?
        options:
          - id: b
            text: Necessarily unrestricted autonomy
          - id: c
            text: A training optimizer
          - id: a
            text: A prescribed workflow
        answer: a
        feedback: Its control flow is specified in advance.
        retired: true
  - id: agents-and-workflows.transfer
    objective_ref: objective.agents-and-workflows
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Choose complexity for the task: trace the inputs, operation, and result before choosing.'
    remediation_scene: agents-and-workflows.s4
    variants:
      - id: agents-and-workflows.transfer.1
        prompt: What turns a generated tool request into an external operation?
        options:
          - id: b
            text: Text generation alone in every environment
          - id: c
            text: The tokenizer vocabulary
          - id: a
            text: The surrounding execution program
        answer: a
        feedback: A dispatcher implements the requested action.
        retired: true
      - id: agents-and-workflows.transfer.2
        prompt: When is extra agent complexity justified?
        options:
          - id: c
            text: Whenever a product uses the word agent
          - id: a
            text: When measured task benefits outweigh added costs and failures
          - id: b
            text: Whenever the model is large
        answer: a
        feedback: The decision depends on observed requirements and performance.
        retired: true
  - id: agents-and-workflows.base.v2
    objective_ref: objective.agents-and-workflows
    task: base
    response_type: single_choice
    points: 1
    hint: 'Separate the three jobs: the model proposes, the program executes, and the loop decides when to stop.'
    remediation_scene: agents-and-workflows.s3
    variants:
      - id: agents-and-workflows.base.v2.1
        prompt: 'In a ReAct-style loop, Wayfarer''s model outputs {"tool": "search_hotels", "args": {"city": "Lisbon"}}. What happens next?'
        options:
          - id: b
            text: The model contacts the hotel service over the internet
          - id: a
            text: The program runs the search and adds the result to the history
          - id: c
            text: The model's weights update to include the hotel results
        answer: a
        feedback: A model only produces text. The program parses the tool call, runs the real search, and feeds the result back as the next observation. Nothing about the model's weights changes during the loop.
      - id: agents-and-workflows.base.v2.2
        prompt: What is the main difference between a workflow and an agent loop?
        options:
          - id: c
            text: A workflow uses a language model, while an agent loop does not use one
          - id: b
            text: An agent loop always finishes faster because it skips unneeded steps
          - id: a
            text: In a workflow the code fixes the steps; in an agent the model picks each next step
        answer: a
        feedback: Both designs can use language models. The difference is who decides the path. An agent often takes *more* steps and time, not fewer.
      - id: agents-and-workflows.base.v2.3
        prompt: Why does a well-built agent program include a step limit?
        options:
          - id: a
            text: A model can keep calling tools without ever producing an answer
          - id: b
            text: Language models run out of memory after a few tool calls
          - id: c
            text: Each tool may be called at most once per conversation
        answer: a
        feedback: Nothing forces a model to stop. It might repeat a failing search forever. The step limit guarantees the loop ends, even if it sometimes ends too early.
      - id: agents-and-workflows.base.v2.4
        prompt: A thermostat turns heating on when the room drops below 19 °C. In agent terms, what is the 19 °C rule?
        options:
          - id: b
            text: The observation the system receives
          - id: c
            text: The action the system carries out
          - id: a
            text: The fixed rule it uses to decide
        answer: a
        feedback: The temperature reading is the observation and switching the heater is the action. The 19 °C rule is how it decides, a fixed policy with very little autonomy.
  - id: agents-and-workflows.transfer.v2
    objective_ref: objective.agents-and-workflows
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask whether the right next step depends on what the system finds along the way. If not, fix the steps in code.
    remediation_scene: agents-and-workflows.autonomy
    variants:
      - id: agents-and-workflows.transfer.v2.1
        prompt: A pharmacy bot must always verify the patient's identity, check for drug interactions, then confirm the refill. Which design fits?
        options:
          - id: c
            text: An agent loop, so the model can skip checks it thinks are unnecessary
          - id: a
            text: A workflow that runs the same checks in the same order every time
          - id: b
            text: An agent loop with no step limit, so every check has time to finish
        answer: a
        feedback: The steps never change and skipping one would be dangerous, so fix them in code. Letting a model decide whether to verify identity adds risk without benefit.
      - id: agents-and-workflows.transfer.v2.2
        prompt: A research helper answers questions like "Which of these five companies had the fastest revenue growth?" Which sources it needs depends on what it finds. Which design fits?
        options:
          - id: a
            text: An agent loop, because the next search depends on earlier results
          - id: b
            text: A workflow, because every question should search the same fixed sources
          - id: c
            text: A workflow, because agents cannot read search results
        answer: a
        feedback: When the right next step depends on what was just found, handing that choice to the model pays off. A fixed list of sources would miss what the question needs.
      - id: agents-and-workflows.transfer.v2.3
        prompt: An agent keeps calling search_flights with the same arguments, getting the same error each time, until its step limit ends the run. What does this show?
        options:
          - id: b
            text: The step limit was set too low for flight searches
          - id: c
            text: The flight service needs a larger model to answer correctly
          - id: a
            text: The loop needs to notice repeated failures and change course or stop
        answer: a
        feedback: Repeating an identical failing call adds no information. A careful agent program detects the repeat and changes the arguments, tries another tool, or reports the problem. A higher limit would just waste more calls.
      - id: agents-and-workflows.transfer.v2.4
        prompt: A support desk's workflow answers most tickets in 2 model calls. A proposed agent version averages 7 calls for the same tickets and resolves the same share. What should the team do?
        options:
          - id: c
            text: Switch to the agent, since more steps means more careful answers
          - id: a
            text: Keep the workflow, since the agent costs more for the same results
          - id: b
            text: Switch to the agent, since agents always adapt better to new tickets
        answer: a
        feedback: Autonomy is only worth its extra cost and unpredictability when it improves results. Here it doesn't, so the simpler workflow wins.
