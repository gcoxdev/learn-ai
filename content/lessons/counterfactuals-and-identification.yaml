schema_version: 0.2-draft
lesson:
  id: counterfactuals-and-identification
  version: 0.4.0-draft
  title: State the assumptions behind effects that cannot all be observed
  state: draft
  summary: Ana got a coupon and spent $60. Would she have spent it anyway? You can never see both answers, but with the right design you can still measure the effect.
  slot: M31.2
  category: learning
  sources:
    - title: "Causal Inference: What If (Hernán & Robins)"
      url: https://miguelhernan.org/whatifbook
    - title: "Estimating causal effects of treatments in randomized and nonrandomized studies (Rubin, 1974)"
      url: https://eric.ed.gov/?id=EJ118470
    - title: "Minimum Wages and Employment: A Case Study of the Fast-Food Industry in New Jersey and Pennsylvania (Card & Krueger, NBER working paper, 1993; American Economic Review, 1994)"
      url: https://www.nber.org/papers/w4509
    - title: "The Book of Why (Pearl & Mackenzie, 2018)"
      url: http://bayes.cs.ucla.edu/WHY/
    - title: "Causal inference in statistics: An overview (Pearl, 2009)"
      url: https://ftp.cs.ucla.edu/pub/stat_ser/r350.pdf
objectives:
  - id: objective.counterfactuals-and-identification
    version: 2-draft
    statement: Define an effect with potential outcomes, compute an average treatment effect, name the assumptions (ignorability, positivity, SUTVA) that let observed data identify it, and use difference-in-differences or an instrument when randomization is impossible.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - counterfactuals-and-identification.base.v2
      - counterfactuals-and-identification.transfer.v2
      - counterfactuals-and-identification.calculate
      - counterfactuals-and-identification.did
    prerequisites:
      - anyOf:
          - objective.causal-graphs-and-interventions
scenes:
  - id: counterfactuals-and-identification.s1
    title: Two futures, one record
    type: explanation
    depth: intuition
    objective_refs:
      - objective.counterfactuals-and-identification
    markdown: |-
      Ana gets a 20%-off coupon from a clothing store and spends \$60 the next month. Did the coupon make her spend more? To answer, you'd need a second number: what Ana would have spent *without* the coupon.

      Write the two possible results as **potential outcomes**: $Y(1)$ is the outcome if a person is treated (gets the coupon), and $Y(0)$ is the outcome if not. The effect on that person is $Y(1) - Y(0)$. This framework comes from Jerzy Neyman (1923) and was developed for observational data by Donald Rubin (1974).

      Suppose, impossibly, we could see both futures for six customers:

      | Customer | $Y(0)$: no coupon | $Y(1)$: coupon | Effect |
      | --- | ---: | ---: | ---: |
      | Ana | \$50 | \$60 | +10 |
      | Ben | \$40 | \$45 | +5 |
      | Cai | \$80 | \$95 | +15 |
      | Dee | \$10 | \$10 | 0 |
      | Eli | \$20 | \$40 | +20 |
      | Fay | \$70 | \$80 | +10 |

      The **average treatment effect (ATE)** is the mean of the individual effects: $(10 + 5 + 15 + 0 + 20 + 10) / 6 = 60 / 6 = 10$ dollars. The coupon adds \$10 per customer on average, though Dee gains nothing and Eli gains \$20.

      In real life each customer gets the coupon or doesn't, so we see one column per row and the other stays blank. Paul Holland (1986) called this the **fundamental problem of causal inference**: an individual effect is never observed directly. The rest of this lesson is about estimating averages like the ATE anyway.
    bridges: []
  - id: counterfactuals-and-identification.s5
    title: Why the obvious comparison lies
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.counterfactuals-and-identification
    markdown: |-
      The store sends coupons to its three biggest spenders: Ana, Cai, and Fay. It then compares what the two groups actually spent.

      | Group | Customers | Observed spend | Mean |
      | --- | --- | --- | ---: |
      | Coupon | Ana, Cai, Fay | $Y(1)$: 60, 95, 80 | \$78.33 |
      | No coupon | Ben, Dee, Eli | $Y(0)$: 40, 10, 20 | \$23.33 |

      :::predict The true ATE is \$10. What does this comparison say?
      \$78.33 − \$23.33 = \$55, more than five times the truth. Coupon holders would have spent far more anyway: their $Y(0)$ values average \$66.67, against \$23.33 for the others. That \$43.33 gap is **selection bias**, and it has nothing to do with the coupon.
      :::

      Now let a coin decide. The program tries every way of giving coupons to three of the six customers:

      ```python run
      from itertools import combinations

      # Both potential outcomes: next month's spend ($) without and with a coupon
      y0 = {"Ana": 50, "Ben": 40, "Cai": 80, "Dee": 10, "Eli": 20, "Fay": 70}
      y1 = {"Ana": 60, "Ben": 45, "Cai": 95, "Dee": 10, "Eli": 40, "Fay": 80}
      people = list(y0)

      ate = sum(y1[p] - y0[p] for p in people) / len(people)
      print(f"true ATE: {ate:.2f}")

      def naive(treated):
          """Mean observed spend of coupon holders minus mean of everyone else."""
          control = [p for p in people if p not in treated]
          return (sum(y1[p] for p in treated) / len(treated)
                  - sum(y0[p] for p in control) / len(control))

      print(f"coupons to the 3 biggest spenders: {naive(['Ana', 'Cai', 'Fay']):.2f}")

      splits = [naive(list(t)) for t in combinations(people, 3)]
      print(f"random coupons: {len(splits)} possible splits, from {min(splits):.2f} "
            f"to {max(splits):.2f}, average {sum(splits) / len(splits):.2f}")
      ```

      Averaged over all 20 random splits, the comparison gives exactly \$10. Any single split of six people can land anywhere from −\$35 to \$55, which is why real trials use hundreds or thousands of people. Try changing Dee's `y1` to 40 and predict the new ATE before you run it.
    bridges: []
  - id: counterfactuals-and-identification.s2
    title: Three assumptions that make the blanks fillable
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.counterfactuals-and-identification
    markdown: |-
      **Identification** means writing the causal quantity you want, such as the ATE, in terms of things you can observe. **Estimation** comes after: computing it from a finite sample, with its uncertainty. Write $T$ for the treatment (1 = coupon, 0 = none) and $X$ for the traits you measured. Without randomization, identifying the ATE from records takes three assumptions:

      | Assumption | Plain meaning | How the coupon study breaks it |
      | --- | --- | --- |
      | **Ignorability** (also *exchangeability*) | Within groups that share the measured traits $X$, who got treated is unrelated to their potential outcomes | Staff hand coupons to customers who look keen, and keenness isn't recorded |
      | **Positivity** (also *overlap*) | Every kind of person had some chance of each treatment: $0 < P(T{=}1 \mid X) < 1$ | *Every* big spender got a coupon, so there's no big spender without one to compare against |
      | **SUTVA** (*stable unit treatment value assumption*) | One person's treatment doesn't change another's outcome, and "treated" means one thing | Customers forward their codes to friends; some coupons are 10% off, others 30% |

      SUTVA's "one version of treatment" part gives **consistency**: the outcome you observe for a treated person is their $Y(1)$.

      :::papers Identification by adjustment
      If ignorability holds given $X$, and positivity holds, then

      $$\text{ATE} = \mathbb{E}[Y(1) - Y(0)] = \sum_x \big(\mathbb{E}[Y \mid T{=}1, x] - \mathbb{E}[Y \mid T{=}0, x]\big)\,P(x)$$

      That's the backdoor adjustment from the causal graphs lesson, in potential-outcome notation. If the store had recorded last year's spending as $X$, it could compare coupon and no-coupon customers within each spending band, then weight the bands by how common they are.
      :::

      :::mixup "If I fit a flexible model, it can predict the missing outcomes where the data have no overlap."
      A model will happily output a number for big spenders without coupons, but no such customer exists in the data. The number comes from the model's shape, not from evidence. When positivity fails, narrow the question to the people you can compare, or collect new data.
      :::
    bridges: []
  - id: counterfactuals-and-identification.s3
    title: "When you can't randomize: compare changes"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.counterfactuals-and-identification
    markdown: |-
      A food-delivery app launches a loyalty program in City A in March. City B doesn't get it. Average weekly orders per user:

      | City | Before | After | Change |
      | --- | ---: | ---: | ---: |
      | A (loyalty program) | 4.0 | 5.0 | +1.0 |
      | B (no program) | 3.5 | 4.0 | +0.5 |
      | **Difference in changes** | | | **+0.5** |

      A's +1.0 includes whatever lifted orders everywhere that spring. B shows that background change was +0.5, so the program's estimated effect is $1.0 - 0.5 = 0.5$ orders per week. This is **difference-in-differences (DiD)**:

      $$\widehat{\text{effect}} = (\bar Y_{A,\text{after}} - \bar Y_{A,\text{before}}) - (\bar Y_{B,\text{after}} - \bar Y_{B,\text{before}})$$

      The cities needn't start equal (4.0 versus 3.5). The key assumption is **parallel trends**: without the program, A would have changed by the same amount as B. Check it by plotting several months before the launch; the two lines should move together.

      An **instrumental variable** is another way round a hidden confounder. It's something that nudges the treatment but affects the outcome only through the treatment. Say the company randomly sends half its users a reminder to join the program, which raises joining from 20% to 60%, and orders in the reminded half rise by 0.2 per week. Only the extra 40% of users who joined because of the reminder can explain that rise, so the effect on them is $0.2 / (0.60 - 0.20) = 0.5$ orders per week. This ratio, the outcome gap divided by the treatment gap, is called the **Wald estimator**.

      :::story A natural experiment wins a Nobel
      In 1992 New Jersey raised its minimum wage and neighboring Pennsylvania didn't. David Card and Alan Krueger compared fast-food employment in both states, before and after, a difference-in-differences, and found no sign that the raise cut jobs. Joshua Angrist used the Vietnam-era lottery that decided who was called up as an instrument for military service. Half of the 2021 economics Nobel went to Card, and the other half to Angrist and Guido Imbens, for this kind of work.
      :::
    bridges: []
  - id: counterfactuals-and-identification.s4
    title: Pearl's ladder of causation
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.counterfactuals-and-identification
    markdown: |-
      Judea Pearl sorts causal questions into three rungs (*The Book of Why*, 2018). Each rung needs more than the one below.

      | Rung | Activity | Coupon question | What answers it |
      | --- | --- | --- | --- |
      | 1. Association | Seeing | Do coupon holders spend more? | Any dataset; ordinary prediction models |
      | 2. Intervention | Doing | How much would sales rise if we sent coupons to everyone? | A randomized test, or data plus a causal graph |
      | 3. Counterfactuals | Imagining | Ana got a coupon and spent \$60. Would she have spent less without it? | A model of how each person responds |

      Most machine learning lives on rung 1: it predicts well from patterns. An A/B test climbs to rung 2. Rung 3 asks about one person's other, unseen future, the blank cell from the first table. It needs assumptions about the mechanism, because no experiment can show both of Ana's futures.

      Climbing needs causal assumptions, and data alone can't supply them all. "X causes Y" and "Y causes X" fit any correlation between them equally well, so time order, domain knowledge, or an experiment has to pick the arrow.
    bridges: []
  - id: counterfactuals-and-identification.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.counterfactuals-and-identification
    markdown: Average effects and difference-in-differences to compute by hand, then bike lanes, pill reminders, a bank's credit limits, and a churn model test which assumption each design leans on.
    takeaway: |-
      Every effect compares two futures, and only one is ever seen. Randomization, or ignorability plus positivity plus SUTVA, lets group averages stand in for the missing ones; DiD and instruments help when you can't randomize.
  - id: counterfactuals-and-identification.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.counterfactuals-and-identification
    markdown: |-
      We cannot observe every alternative outcome for the same person. Causal effect estimates need a design, overlap, and explicit assumptions that justify the comparison.
