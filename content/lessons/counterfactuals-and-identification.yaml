schema_version: 0.2-draft
lesson:
  id: counterfactuals-and-identification
  version: 0.1.0-draft
  title: State the assumptions behind effects that cannot all be observed
  state: draft
  summary: Counterfactual reasoning compares potential outcomes under alternative interventions; identification
    requires assumptions such as consistency, exchangeability, and positivity, and causal discovery has observational
    limits.
  slot: M31.2
  category: learning
  minutes: 12
  sources:
  - title: 'Causal Inference: What If — authors’ book'
    url: https://miguelhernan.org/whatifbook
  - title: 'Causal inference in statistics: An overview'
    url: https://ftp.cs.ucla.edu/pub/stat_ser/r350.pdf
objectives:
- id: objective.counterfactuals-and-identification
  version: 1-draft
  statement: Counterfactual reasoning compares potential outcomes under alternative interventions; identification
    requires assumptions such as consistency, exchangeability, and positivity, and causal discovery has observational
    limits.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - counterfactuals-and-identification.base
  - counterfactuals-and-identification.transfer
  prerequisites:
  - anyOf:
    - objective.causal-graphs-and-interventions
scenes:
- id: counterfactuals-and-identification.s1
  title: One unit has alternative potential outcomes
  type: explanation
  depth: intuition
  objective_refs:
  - objective.counterfactuals-and-identification
  markdown: For a person offered a training program, define an outcome under participation and an outcome without
    participation. We observe only the outcome under the actual condition. The individual difference cannot generally
    be read directly from one record, motivating population-level designs and assumptions.
  text_mode: For a person offered a training program, define an outcome under participation and an outcome without
    participation. We observe only the outcome under the actual condition. The individual difference cannot generally
    be read directly from one record, motivating population-level designs and assumptions.
  bridges: []
- id: counterfactuals-and-identification.s2
  title: Name identification assumptions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.counterfactuals-and-identification
  markdown: Consistency links observed outcomes to the specified intervention actually received. Exchangeability
    means treatment groups are comparable for the relevant potential outcomes, possibly conditional on measured
    variables. Positivity requires the needed treatment alternatives to occur with nonzero probability in the relevant
    strata.
  text_mode: Consistency links observed outcomes to the specified intervention actually received. Exchangeability
    means treatment groups are comparable for the relevant potential outcomes, possibly conditional on measured
    variables. Positivity requires the needed treatment alternatives to occur with nonzero probability in the relevant
    strata.
  bridges: []
- id: counterfactuals-and-identification.s3
  title: See a support failure
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.counterfactuals-and-identification
  markdown: If every experienced worker receives training and no inexperienced worker does, the data may lack overlap
    needed to compare training effects within experience levels. A flexible model can still output a number, but
    extrapolation does not create the missing causal evidence.
  text_mode: If every experienced worker receives training and no inexperienced worker does, the data may lack overlap
    needed to compare training effects within experience levels. A flexible model can still output a number, but
    extrapolation does not create the missing causal evidence.
  bridges: []
- id: counterfactuals-and-identification.s4
  title: Limit discovery claims
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.counterfactuals-and-identification
  markdown: Different causal graphs can imply the same observational independences. Hidden variables, selection,
    measurement error, and feedback complicate inference. Additional interventions, temporal knowledge, or substantive
    assumptions can help; a discovered graph should be reported with equivalence and uncertainty limits rather than
    presented as the uniquely proven world mechanism.
  text_mode: Different causal graphs can imply the same observational independences. Hidden variables, selection,
    measurement error, and feedback complicate inference. Additional interventions, temporal knowledge, or substantive
    assumptions can help; a discovered graph should be reported with equivalence and uncertainty limits rather than
    presented as the uniquely proven world mechanism.
  bridges: []
- id: counterfactuals-and-identification.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.counterfactuals-and-identification
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: counterfactuals-and-identification.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.counterfactuals-and-identification
  markdown: Counterfactual reasoning compares potential outcomes under alternative interventions; identification
    requires assumptions such as consistency, exchangeability, and positivity, and causal discovery has observational
    limits.
  text_mode: Counterfactual reasoning compares potential outcomes under alternative interventions; identification
    requires assumptions such as consistency, exchangeability, and positivity, and causal discovery has observational
    limits.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - counterfactuals-and-identification.s1
    - counterfactuals-and-identification.s2
    - counterfactuals-and-identification.s3
    - counterfactuals-and-identification.s4
    - counterfactuals-and-identification.check
    - counterfactuals-and-identification.recap
    gate_refs:
    - gate.core
assessment_families:
- id: counterfactuals-and-identification.base
  objective_ref: objective.counterfactuals-and-identification
  task: base
  response_type: single_choice
  points: 1
  hint: 'Name identification assumptions: trace the inputs, operation, and result before choosing.'
  remediation_scene: counterfactuals-and-identification.s2
  variants:
  - id: counterfactuals-and-identification.base.1
    prompt: Can one record generally reveal both potential outcomes for the same person?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if the model is large
    - id: a
      text: 'No'
    answer: a
    feedback: Only the factual condition is observed directly.
  - id: counterfactuals-and-identification.base.2
    prompt: What does positivity require?
    options:
    - id: c
      text: Every coefficient is positive
    - id: a
      text: Relevant alternatives have nonzero probability in the needed strata
    - id: b
      text: Every outcome is beneficial
    answer: a
    feedback: Effect estimation needs support for comparisons.
- id: counterfactuals-and-identification.transfer
  objective_ref: objective.counterfactuals-and-identification
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Limit discovery claims: trace the inputs, operation, and result before choosing.'
  remediation_scene: counterfactuals-and-identification.s4
  variants:
  - id: counterfactuals-and-identification.transfer.1
    prompt: Does a model prediction repair absent treatment overlap automatically?
    options:
    - id: c
      text: Only if the model uses trees
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Extrapolation adds assumptions rather than observed counterfactual evidence.
  - id: counterfactuals-and-identification.transfer.2
    prompt: Can observationally equivalent graphs remain causally different?
    options:
    - id: a
      text: 'Yes'
    - id: b
      text: 'No'
    - id: c
      text: Only if arrows are mislabeled
    answer: a
    feedback: Observations may not uniquely identify causal structure.
