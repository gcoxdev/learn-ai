assessment_families:
  - id: counterfactuals-and-identification.base
    objective_ref: objective.counterfactuals-and-identification
    task: base
    response_type: single_choice
    points: 1
    hint: 'Name identification assumptions: trace the inputs, operation, and result before choosing.'
    remediation_scene: counterfactuals-and-identification.s2
    variants:
      - id: counterfactuals-and-identification.base.1
        prompt: Can one record generally reveal both potential outcomes for the same person?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if the model is large
          - id: a
            text: 'No'
        answer: a
        feedback: Only the factual condition is observed directly.
        retired: true
      - id: counterfactuals-and-identification.base.2
        prompt: What does positivity require?
        options:
          - id: c
            text: Every coefficient is positive
          - id: a
            text: Relevant alternatives have nonzero probability in the needed strata
          - id: b
            text: Every outcome is beneficial
        answer: a
        feedback: Effect estimation needs support for comparisons.
        retired: true
  - id: counterfactuals-and-identification.transfer
    objective_ref: objective.counterfactuals-and-identification
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Limit discovery claims: trace the inputs, operation, and result before choosing.'
    remediation_scene: counterfactuals-and-identification.s4
    variants:
      - id: counterfactuals-and-identification.transfer.1
        prompt: Does a model prediction repair absent treatment overlap automatically?
        options:
          - id: c
            text: Only if the model uses trees
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Extrapolation adds assumptions rather than observed counterfactual evidence.
        retired: true
      - id: counterfactuals-and-identification.transfer.2
        prompt: Can observationally equivalent graphs remain causally different?
        options:
          - id: a
            text: 'Yes'
          - id: b
            text: 'No'
          - id: c
            text: Only if arrows are mislabeled
        answer: a
        feedback: Observations may not uniquely identify causal structure.
        retired: true
  - id: counterfactuals-and-identification.base.v2
    objective_ref: objective.counterfactuals-and-identification
    task: base
    response_type: single_choice
    points: 1
    hint: "Write down both potential outcomes, Y(1) and Y(0), and ask which one is missing. Then ask which assumption would let a group average stand in for it."
    remediation_scene: counterfactuals-and-identification.s2
    variants:
      - id: counterfactuals-and-identification.base.v2.1
        prompt: A customer received a coupon and spent $60. What prevents you from computing the coupon's effect on her?
        options:
          - id: b
            text: One customer's spending is too noisy to measure reliably
          - id: a
            text: Her spend without the coupon, Y(0), was never observed
          - id: c
            text: Her spend with the coupon, Y(1), isn't known until next month
        answer: a
        feedback: Her effect is Y(1) − Y(0), and only Y(1) = $60 was observed. That missing column is the fundamental problem of causal inference. Noise isn't the issue; even a perfectly measured $60 leaves Y(0) blank.
      - id: counterfactuals-and-identification.base.v2.2
        prompt: A store gave coupons to its biggest spenders. Coupon holders spent $55 more than everyone else, but the true ATE is $10. Where did most of the gap come from?
        options:
          - id: c
            text: The coupon's effect was far larger for big spenders than for others
          - id: b
            text: Random noise, since only a handful of customers were compared
          - id: a
            text: Coupon holders would have spent more than the others even without coupons
        answer: a
        feedback: Coupon holders' Y(0) averaged $66.67 against $23.33, a $43.33 selection bias. Their own coupon effect averaged only $11.67, close to the ATE, so bigger effects for big spenders explain very little of the $55.
      - id: counterfactuals-and-identification.base.v2.3
        prompt: Every customer who spent over $500 last year got a coupon, and no one under $500 did. Which assumption fails when you try to compare within spending levels?
        options:
          - id: a
            text: Positivity, since no high spender went without a coupon
          - id: b
            text: SUTVA, since coupons change how much each customer spends
          - id: c
            text: Consistency, since the coupon amounts differ between customers
        answer: a
        feedback: Within the over-$500 group, the chance of a coupon was 1, so there's nobody to compare against. That's a positivity (overlap) failure. SUTVA is about interference and treatment versions, and changing spending is the effect itself, not a violation.
      - id: counterfactuals-and-identification.base.v2.4
        prompt: In a coupon trial, customers in the coupon group forwarded their codes to friends in the no-coupon group. Which assumption does this break?
        options:
          - id: b
            text: Positivity, since some people had no chance of a coupon
          - id: a
            text: SUTVA, since one person's treatment changed another's outcome
          - id: c
            text: Ignorability, since the coin flip was no longer random
        answer: a
        feedback: Forwarded codes mean a control customer's outcome depends on someone else's treatment, which is interference, part of SUTVA. The coin flip itself was still random, and everyone still had a chance of either group.
      - id: counterfactuals-and-identification.base.v2.5
        prompt: Which question sits on the third rung of Pearl's ladder of causation?
        options:
          - id: c
            text: Do customers who receive coupons tend to spend more than others?
          - id: b
            text: How much would sales rise if every customer were sent a coupon?
          - id: a
            text: Would Ana have spent less last month if she hadn't received her coupon?
        answer: a
        feedback: Asking about one person's unseen alternative, given what actually happened, is a counterfactual (rung 3). "If every customer were sent a coupon" is an intervention (rung 2), and "tend to spend more" is association (rung 1).
  - id: counterfactuals-and-identification.transfer.v2
    objective_ref: objective.counterfactuals-and-identification
    task: transfer
    response_type: single_choice
    points: 1
    hint: "Name the design first (DiD, instrument, adjustment, or experiment), then the one assumption it can't do without: parallel trends, a clean nudge, overlap, or no hidden causes."
    remediation_scene: counterfactuals-and-identification.s3
    variants:
      - id: counterfactuals-and-identification.transfer.v2.1
        prompt: A city adds bike lanes on one avenue. Accidents there fall by 30 per year, and by 10 on a similar avenue with no lanes. The DiD estimate is 20 fewer accidents. What must hold for that estimate to be right?
        options:
          - id: b
            text: The two avenues had the same number of accidents before the lanes
          - id: c
            text: The avenue for the lanes was chosen at random, like a coin flip
          - id: a
            text: Without the lanes, both avenues would have followed parallel trends
        answer: a
        feedback: DiD subtracts the comparison avenue's change as the background trend, so the trends must be parallel without the lanes. The avenues can start at different levels, and DiD is used exactly when assignment wasn't random.
      - id: counterfactuals-and-identification.transfer.v2.2
        prompt: A clinic randomly texts half its patients a reminder to take their pills. Pill-taking rises from 40% to 60%, and blood pressure in the reminder group ends 2 points lower on average. What does the instrumental-variable estimate say about taking the pills?
        options:
          - id: a
            text: About 10 points lower, for the patients the reminder moved (2 ÷ 0.2)
          - id: b
            text: About 2 points lower, the observed difference between the two groups
          - id: c
            text: About 0.4 points lower, the difference scaled by uptake (2 × 0.2)
        answer: a
        feedback: Only 20% more patients took pills because of the reminder, so the 2-point group difference comes from them. Dividing by the uptake difference gives 10 points per patient moved. The 2 points is the reminder's effect, not the pills'.
      - id: counterfactuals-and-identification.transfer.v2.3
        prompt: A bank wants the effect of a credit-limit increase on customers under 21. It has never raised the limit for anyone under 21. What is the core obstacle?
        options:
          - id: c
            text: Ignorability, which adjusting for age in a regression would repair
          - id: a
            text: Positivity, since there are no treated under-21s to learn from
          - id: b
            text: SUTVA, since young customers might share cards with their friends
        answer: a
        feedback: With zero treated customers under 21, any estimate for them is extrapolation from older customers. That's a positivity failure, and adjusting for age can't create the missing comparison group.
      - id: counterfactuals-and-identification.transfer.v2.4
        prompt: A support team's model accurately predicts which customers will cancel. A manager asks whether calling at-risk customers will reduce cancellations. What does answering this need?
        options:
          - id: b
            text: Nothing more, since an accurate prediction model already answers it
          - id: c
            text: Individual counterfactuals, which no kind of data can ever supply
          - id: a
            text: An intervention estimate, such as a randomized test of the calls
        answer: a
        feedback: Whether calling reduces cancellations is a rung-2 question about doing. A predictor lives on rung 1. It can say who is likely to cancel, not what a call would change. An A/B test of calls answers it without needing individual counterfactuals.
      - id: counterfactuals-and-identification.transfer.v2.5
        prompt: Students who chose to attend an optional review session scored 8 points higher on the exam. Which extra data would most help turn this into a causal estimate?
        options:
          - id: a
            text: Prior grades and study habits of all students, to compare like with like
          - id: b
            text: The number of questions each attendee asked during the session
          - id: c
            text: Next term's exam scores for the students who attended the session
        answer: a
        feedback: Students chose to attend, so keen students may be over-represented. Measuring what drives both attendance and scores makes ignorability more plausible. Details about attendees only, or later scores of attendees only, add no comparison group.
  - id: counterfactuals-and-identification.calculate
    objective_ref: objective.counterfactuals-and-identification
    task: base
    response_type: numeric
    points: 1
    hint: Subtract Y(0) from Y(1) for each unit to get its effect, then average the effects. With trial data, subtract the control mean from the treated mean.
    remediation_scene: counterfactuals-and-identification.s1
    absolute_tolerance: 0.01
    variants:
      - id: counterfactuals-and-identification.calculate.1
        prompt: "Four users have potential outcomes (Y(0), Y(1)) in minutes of weekly use: (2, 5), (4, 4), (1, 3), (3, 6). What is the average treatment effect?"
        answer: 2
        feedback: The effects are 3, 0, 2, and 3, which sum to 8, so the ATE is 8 / 4 = 2 minutes.
      - id: counterfactuals-and-identification.calculate.2
        prompt: "Six students have test scores (Y(0) without tutoring, Y(1) with): (60, 70), (80, 82), (50, 65), (90, 90), (70, 76), (40, 55). What is the average treatment effect of tutoring, in points?"
        answer: 8
        feedback: The effects are 10, 2, 15, 0, 6, and 15, summing to 48. The ATE is 48 / 6 = 8 points.
      - id: counterfactuals-and-identification.calculate.3
        prompt: In the lesson's six-customer coupon table the ATE is $10. If Dee's spend with a coupon were $40 instead of $10, what would the ATE be, in dollars?
        answer: 15
        feedback: Dee's effect rises from 0 to 30, so the effects sum to 60 + 30 = 90, and the ATE is 90 / 6 = $15.
      - id: counterfactuals-and-identification.calculate.4
        prompt: "Five patients have systolic blood pressure (Y(0) without a drug, Y(1) with it): (120, 110), (140, 135), (130, 130), (150, 135), (125, 115). What is the average treatment effect, in mmHg? (Give a negative number for a drop.)"
        answer: -8
        feedback: The effects are −10, −5, 0, −15, and −10, summing to −40. The ATE is −40 / 5 = −8 mmHg.
      - id: counterfactuals-and-identification.calculate.5
        prompt: In a randomized trial, 200 users who got a new onboarding flow averaged 34 minutes in the app in week one, and 200 users with the old flow averaged 30 minutes. What is the estimated ATE, in minutes?
        answer: 4
        feedback: Randomization makes the groups comparable, so the difference in means estimates the ATE, 34 − 30 = 4 minutes.
  - id: counterfactuals-and-identification.did
    objective_ref: objective.counterfactuals-and-identification
    task: base
    response_type: numeric
    points: 1
    hint: Compute each group's change (after minus before), then subtract the comparison group's change from the treated group's change.
    remediation_scene: counterfactuals-and-identification.s3
    absolute_tolerance: 0.01
    variants:
      - id: counterfactuals-and-identification.did.1
        prompt: A town pilots a job program. Its employment rate goes from 20% to 26%; a similar town without the program goes from 18% to 21%. What is the difference-in-differences estimate, in percentage points?
        answer: 3
        feedback: The pilot town changed by +6 and the comparison town by +3, so DiD = 6 − 3 = 3 points.
      - id: counterfactuals-and-identification.did.2
        prompt: Stores with a new layout went from 100 to 130 sales per day. Stores with the old layout went from 90 to 105 over the same weeks. What is the DiD estimate of the layout's effect, in sales per day?
        answer: 15
        feedback: The new-layout stores changed by +30 and the others by +15, so DiD = 30 − 15 = 15. The starting levels (100 versus 90) don't enter the estimate.
      - id: counterfactuals-and-identification.did.3
        prompt: A hospital introduces a new triage system and its average wait falls from 50 to 40 minutes. A similar hospital without it goes from 45 to 44 minutes. What is the DiD estimate, in minutes? (Negative means shorter waits.)
        answer: -9
        feedback: The changes are −10 and −1, so DiD = −10 − (−1) = −9 minutes.
      - id: counterfactuals-and-identification.did.4
        prompt: An app adds a streak feature in one country. Day-7 retention there goes from 40% to 46%; in a comparison country without the feature it goes from 38% to 41%. What is the DiD estimate, in percentage points?
        answer: 3
        feedback: The feature country changed by +6 and the comparison by +3, so DiD = 6 − 3 = 3 points. A plain before-and-after in the feature country would have claimed 6.
      - id: counterfactuals-and-identification.did.5
        prompt: A school starts a reading program and its average score goes from 62 to 71. A comparison school goes from 60 to 64. What is the DiD estimate, in points?
        answer: 5
        feedback: The program school changed by +9 and the comparison by +4, so DiD = 9 − 4 = 5 points.
