schema_version: 0.2-draft
lesson:
  id: counterfactuals-and-identification
  version: 0.3.0-draft
  title: State the assumptions behind effects that cannot all be observed
  state: draft
  summary: State what must be assumed before comparing outcomes that cannot all be observed.
  slot: M31.2
  category: learning
  sources:
  - title: 'Causal Inference: What If — authors’ book'
    url: https://miguelhernan.org/whatifbook
  - title: 'Causal inference in statistics: An overview'
    url: https://ftp.cs.ucla.edu/pub/stat_ser/r350.pdf
objectives:
- id: objective.counterfactuals-and-identification
  version: 1-draft
  statement: Counterfactual reasoning compares potential outcomes under alternative interventions; identification
    requires assumptions such as consistency, exchangeability, and positivity, and causal discovery has observational
    limits.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - counterfactuals-and-identification.base
  - counterfactuals-and-identification.transfer
  prerequisites:
  - anyOf:
    - objective.causal-graphs-and-interventions
scenes:
- id: counterfactuals-and-identification.s1
  title: One unit has alternative potential outcomes
  type: explanation
  depth: intuition
  objective_refs:
  - objective.counterfactuals-and-identification
  markdown: 'For a person considering a training program, imagine two **potential outcomes**: their result
    if they participate and their result if they do not.


    We observe only the result under the condition that actually occurs. The other outcome is unobserved. We
    therefore cannot generally read that person''s causal gain directly from one record. Population-level comparisons
    require a study design and assumptions that connect observed groups to the effects we want to estimate.'
  text_mode: 'For a person considering a training program, imagine two **potential outcomes**: their result
    if they participate and their result if they do not.


    We observe only the result under the condition that actually occurs. The other outcome is unobserved. We
    therefore cannot generally read that person''s causal gain directly from one record. Population-level comparisons
    require a study design and assumptions that connect observed groups to the effects we want to estimate.'
  bridges: []
- id: counterfactuals-and-identification.s2
  title: Name identification assumptions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.counterfactuals-and-identification
  markdown: 'Three common identification assumptions are:


    - **Consistency:** the observed outcome matches the potential outcome for the specified intervention actually
    received.

    - **Exchangeability:** the treatment groups are comparable for the relevant potential outcomes, possibly
    after accounting for measured characteristics.

    - **Positivity:** each needed treatment alternative has a nonzero probability within the relevant groups.


    Suppose a randomized study observes average scores of 75 with training and 70 without. **Identification**
    asks whether the design and assumptions let this comparison represent the desired causal effect. **Estimation**
    asks how to calculate it from the sample, with uncertainty. A five-point average difference does not mean
    every individual gained five points.'
  text_mode: 'Three common identification assumptions are:


    - **Consistency:** the observed outcome matches the potential outcome for the specified intervention actually
    received.

    - **Exchangeability:** the treatment groups are comparable for the relevant potential outcomes, possibly
    after accounting for measured characteristics.

    - **Positivity:** each needed treatment alternative has a nonzero probability within the relevant groups.


    Suppose a randomized study observes average scores of 75 with training and 70 without. **Identification**
    asks whether the design and assumptions let this comparison represent the desired causal effect. **Estimation**
    asks how to calculate it from the sample, with uncertainty. A five-point average difference does not mean
    every individual gained five points.'
  bridges: []
- id: counterfactuals-and-identification.s3
  title: See a support failure
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.counterfactuals-and-identification
  markdown: If every experienced worker receives training and no inexperienced worker does, the data may lack
    overlap needed to compare training effects within experience levels. A flexible model can still output
    a number, but extrapolation does not create the missing causal evidence.
  text_mode: If every experienced worker receives training and no inexperienced worker does, the data may lack
    overlap needed to compare training effects within experience levels. A flexible model can still output
    a number, but extrapolation does not create the missing causal evidence.
  bridges: []
- id: counterfactuals-and-identification.s4
  title: Limit discovery claims
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.counterfactuals-and-identification
  markdown: Different causal graphs can imply the same observational independences. Hidden variables, selection,
    measurement error, and feedback complicate inference. Additional interventions, temporal knowledge, or
    substantive assumptions can help; a discovered graph should be reported with equivalence and uncertainty
    limits rather than presented as the uniquely proven world mechanism.
  text_mode: Different causal graphs can imply the same observational independences. Hidden variables, selection,
    measurement error, and feedback complicate inference. Additional interventions, temporal knowledge, or
    substantive assumptions can help; a discovered graph should be reported with equivalence and uncertainty
    limits rather than presented as the uniquely proven world mechanism.
  bridges: []
- id: counterfactuals-and-identification.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.counterfactuals-and-identification
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: We cannot observe every alternative outcome for the same person. Causal effect estimates need a
    design, overlap, and explicit assumptions that justify the comparison.
- id: counterfactuals-and-identification.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.counterfactuals-and-identification
  markdown: We cannot observe every alternative outcome for the same person. Causal effect estimates need a
    design, overlap, and explicit assumptions that justify the comparison.
  text_mode: We cannot observe every alternative outcome for the same person. Causal effect estimates need
    a design, overlap, and explicit assumptions that justify the comparison.
