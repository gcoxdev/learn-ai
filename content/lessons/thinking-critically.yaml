assessment_families:
- id: thinking-critically.base
  objective_ref: objective.thinking-critically
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
  variants:
  - id: thinking-critically.base.1
    prompt: An answer sounds polished and certain. What does that tell you about its factual support?
    options:
    - id: a
      text: Its tone proves the sources are correct.
    - id: b
      text: All fluent answers have been verified.
    - id: correct
      text: You still need to check the relevant evidence.
    answer: correct
    feedback: You still need to check the relevant evidence.
    retired: true
  - id: thinking-critically.base.2
    prompt: Why compare a model against a baseline?
    options:
    - id: b
      text: To prove the model understands the task like a human.
    - id: correct
      text: To see whether its added complexity improves the relevant outcome.
    - id: a
      text: To avoid evaluating difficult examples.
    answer: correct
    feedback: To see whether its added complexity improves the relevant outcome.
    retired: true
  - id: thinking-critically.base.v2.1
    prompt: A confident museum answer conflicts with its current official schedule. What should guide the opening-hours
      answer?
    options:
    - id: c
      text: The same generated answer repeated twice
    - id: a
      text: The relevant current schedule
    - id: b
      text: The confidence of the wording
    answer: a
    feedback: The schedule supplies task-relevant evidence, while tone does not establish the time.
  - id: thinking-critically.base.v2.2
    prompt: Ninety of 100 requests are ordinary. A rule calls all 100 ordinary. How many are correct?
    options:
    - id: a
      text: '90'
    - id: b
      text: '100'
    - id: c
      text: '10'
    answer: a
    feedback: The rule gets the ninety ordinary requests right and the ten special ones wrong.
  - id: thinking-critically.base.v2.3
    prompt: What is a baseline?
    options:
    - id: b
      text: The system selected as the final solution
    - id: c
      text: A minimum score the system must reach
    - id: a
      text: A simple reference for comparison
    answer: a
    feedback: A baseline makes improvement a comparison rather than an isolated score.
  - id: thinking-critically.base.v2.4
    prompt: Two systems tie on total correct answers. What is useful to inspect next?
    options:
    - id: c
      text: Whether one repeated successful case looks clearer
    - id: a
      text: Which kinds of mistakes each makes
    - id: b
      text: Whether the tied total is the same for both systems
    answer: a
    feedback: Equal totals can hide different errors with different consequences.
  remediation_scene: thinking-critically.s3
- id: thinking-critically.transfer
  objective_ref: objective.thinking-critically
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
  variants:
  - id: thinking-critically.transfer.1
    prompt: A daytime camera model struggles in fog. What should you investigate?
    options:
    - id: b
      text: Whether training loss once reached a low value.
    - id: correct
      text: The changed input conditions and their effect on errors.
    - id: a
      text: Only whether the answer text is confident.
    answer: correct
    feedback: The changed input conditions and their effect on errors.
    retired: true
  - id: thinking-critically.transfer.2
    prompt: A model gets 90 of 100 cases right; a baseline gets 95. What follows?
    options:
    - id: correct
      text: The new model is not better by accuracy on this sample.
    - id: a
      text: The new model is necessarily better because it is AI.
    - id: b
      text: Neither result can ever be compared.
    answer: correct
    feedback: The new model is not better by accuracy on this sample.
    retired: true
  - id: thinking-critically.transfer.v2.1
    prompt: A sorter developed on bright photos now gets shadow photos. What changed?
    options:
    - id: a
      text: The pattern of inputs it encounters
    - id: b
      text: The intended job changed from sorting to counting
    - id: c
      text: The stored settings were necessarily updated
    answer: a
    feedback: This is an example of a change in the input distribution.
  - id: thinking-critically.transfer.v2.2
    prompt: A source lists hours but not admission price. Which answer handles the gap?
    options:
    - id: b
      text: I can use an older remembered price without checking it
    - id: c
      text: I can use the price of a similar museum as this museum’s price
    - id: a
      text: I have the hours; I need a price source
    answer: a
    feedback: The first answer states the limit and identifies missing information.
  - id: thinking-critically.transfer.v2.3
    prompt: One model catches eight of ten special requests. How many special requests did it miss?
    options:
    - id: c
      text: '10'
    - id: a
      text: '2'
    - id: b
      text: '8'
    answer: a
    feedback: Ten special requests minus eight caught leaves two missed.
  - id: thinking-critically.transfer.v2.4
    prompt: Which comparison gives stronger evidence for a useful sorter?
    options:
    - id: a
      text: Testing on varied pictures with recorded errors
    - id: b
      text: Testing one clear picture repeatedly and counting successes
    - id: c
      text: Comparing how confidently both sorters describe their answers
    answer: a
    feedback: Varied, relevant cases and recorded mistakes reveal more than a single demonstration.
  remediation_scene: thinking-critically.s3
