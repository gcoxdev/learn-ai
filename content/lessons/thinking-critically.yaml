schema_version: 0.2-draft
lesson:
  id: thinking-critically
  version: 0.1.0-draft
  title: How to question an AI result
  state: draft
  summary: Separate fluent output, measured performance, uncertainty, and evidence. Test claims on relevant
    examples and failure cases.
  slot: M00.6
  category: common
  minutes: 8
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — topic overview'
    url: https://aima.cs.berkeley.edu/contents.html
objectives:
- id: objective.thinking-critically
  version: 1-draft
  statement: Separate fluent output, measured performance, uncertainty, and evidence. Test claims on relevant
    examples and failure cases.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - thinking-critically.base
  - thinking-critically.transfer
  prerequisites:
  - anyOf:
    - objective.inside-a-system
scenes:
- id: thinking-critically.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.thinking-critically
  text_mode: The complete explanation is available as readable text.
  title: Fluency is not a fact check
  markdown: 'A model can produce a plausible sentence that is unsupported by its input or sources. Confident
    wording does not supply evidence.


    For a factual answer, examine the underlying source and whether it actually supports the claim. For a classifier,
    inspect errors and the conditions of the evaluation.'
- id: thinking-critically.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.thinking-critically
  text_mode: The complete explanation is available as readable text.
  title: Choose a useful comparison
  markdown: 'Suppose a new predictor is right on 90 out of 100 cases. That sounds useful until we learn that
    a simple baseline is right on 95.


    Ask about the baseline, sample, task definition, and costs of different errors. One headline number can
    conceal important failures.'
- id: thinking-critically.s3
  type: explanation
  depth: intuition
  objective_refs:
  - objective.thinking-critically
  text_mode: The complete explanation is available as readable text.
  title: A different world is a different test
  markdown: 'A model trained on sunny daytime road images may face foggy night scenes. The inputs have changed
    in a way that can affect performance. This is an example of **distribution shift**.


    Test difficult and relevant conditions, rather than assuming success transfers automatically.'
- id: thinking-critically.s4
  type: explanation
  depth: intuition
  objective_refs:
  - objective.thinking-critically
  text_mode: The complete explanation is available as readable text.
  title: Keep an evidence habit
  markdown: 'When you see a claim, ask **on what task, on which data, compared with what, and with what limitations?**


    A probability can express the model’s uncertainty under its assumptions. It is not automatically a trustworthy
    real-world confidence guarantee.'
- id: thinking-critically.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.thinking-critically
  markdown: Use two different examples to check your understanding. Hints are available for practice. A later,
    fresh answer without hints can demonstrate personal-study mastery.
  text_mode: Labeled radio options and a submit button; no timing requirement.
- id: thinking-critically.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.thinking-critically
  markdown: Separate fluent output, measured performance, uncertainty, and evidence. Test claims on relevant
    examples and failure cases.
  text_mode: Separate fluent output, measured performance, uncertainty, and evidence. Test claims on relevant
    examples and failure cases.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - thinking-critically.s1
    - thinking-critically.s2
    - thinking-critically.s3
    - thinking-critically.s4
    - thinking-critically.check
    - thinking-critically.recap
    gate_refs:
    - gate.core
assessment_families:
- id: thinking-critically.base
  objective_ref: objective.thinking-critically
  task: base
  response_type: single_choice
  points: 1
  hint: Separate fluent output, measured performance, uncertainty, and evidence. Test claims on relevant examples
    and failure cases.
  variants:
  - id: thinking-critically.base.1
    prompt: An answer sounds polished and certain. What does that tell you about its factual support?
    options:
    - id: a
      text: Its tone proves the sources are correct.
    - id: b
      text: All fluent answers have been verified.
    - id: correct
      text: You still need to check the relevant evidence.
    answer: correct
    feedback: You still need to check the relevant evidence.
  - id: thinking-critically.base.2
    prompt: Why compare a model against a baseline?
    options:
    - id: b
      text: To prove the model understands the task like a human.
    - id: correct
      text: To see whether its added complexity improves the relevant outcome.
    - id: a
      text: To avoid evaluating difficult examples.
    answer: correct
    feedback: To see whether its added complexity improves the relevant outcome.
- id: thinking-critically.transfer
  objective_ref: objective.thinking-critically
  task: transfer
  response_type: single_choice
  points: 1
  hint: Separate fluent output, measured performance, uncertainty, and evidence. Test claims on relevant examples
    and failure cases.
  variants:
  - id: thinking-critically.transfer.1
    prompt: A daytime camera model struggles in fog. What should you investigate?
    options:
    - id: b
      text: Whether training loss once reached a low value.
    - id: correct
      text: The changed input conditions and their effect on errors.
    - id: a
      text: Only whether the answer text is confident.
    answer: correct
    feedback: The changed input conditions and their effect on errors.
  - id: thinking-critically.transfer.2
    prompt: A model gets 90 of 100 cases right; a baseline gets 95. What follows?
    options:
    - id: correct
      text: The new model is not better by accuracy on this sample.
    - id: a
      text: The new model is necessarily better because it is AI.
    - id: b
      text: Neither result can ever be compared.
    answer: correct
    feedback: The new model is not better by accuracy on this sample.
