schema_version: 0.2-draft
lesson:
  id: thinking-critically
  version: 0.2.0-draft
  title: How to tell whether an AI answer is useful
  state: draft
  summary: Check a confident answer, compare a simple alternative, and notice when the test leaves out important
    cases.
  slot: M00.9
  category: common
  sources:
  - title: Dive into Deep Learning — introduction
    url: https://d2l.ai/chapter_introduction/index.html
  archetype: foundation
objectives:
- id: objective.thinking-critically
  version: 2-draft
  statement: Separate fluent output, measured performance, uncertainty, and evidence. Test claims on relevant examples
    and failure cases.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - thinking-critically.base
  - thinking-critically.transfer
  prerequisites:
  - anyOf:
    - objective.inside-a-system
scenes:
- id: thinking-critically.s1
  title: A confident voice can still be wrong
  type: explanation
  depth: intuition
  objective_refs:
  - objective.thinking-critically
  markdown: Imagine a museum helper says, “We definitely open at nine.” The official schedule says ten. Clear writing
    did not make the answer correct. **Evidence** is information that supports or challenges a claim; here the schedule
    provides evidence about opening time. Check that it is the right museum and the right date. The text-producing
    model’s confident tone is different from the underlying information needed to decide whether the claim is true.
  text_mode: Imagine a museum helper says, “We definitely open at nine.” The official schedule says ten. Clear writing
    did not make the answer correct. **Evidence** is information that supports or challenges a claim; here the schedule
    provides evidence about opening time. Check that it is the right museum and the right date. The text-producing
    model’s confident tone is different from the underlying information needed to decide whether the claim is true.
- id: thinking-critically.s2
  title: Choose a comparison you can understand
  type: explanation
  depth: intuition
  objective_refs:
  - objective.thinking-critically
  markdown: Suppose 90 of 100 delivery requests are ordinary and ten need special handling. A simple rule that says
    “ordinary” for every request is correct 90 times. This simple comparison is a **baseline**. A new model that
    is also right 90 times has not yet shown an improvement on that total score. Worse, both could miss the ten
    requests that need help. A count of correct answers is useful, but the kinds of errors matter too.
  text_mode: Suppose 90 of 100 delivery requests are ordinary and ten need special handling. A simple rule that
    says “ordinary” for every request is correct 90 times. This simple comparison is a **baseline**. A new model
    that is also right 90 times has not yet shown an improvement on that total score. Worse, both could miss the
    ten requests that need help. A count of correct answers is useful, but the kinds of errors matter too.
- id: thinking-critically.s3
  title: Count the mistakes that matter
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.thinking-critically
  markdown: '**Evaluation** means checking performance on a chosen task. For our delivery helper, list the requests
    that needed special handling and ask how many were caught. If model A catches eight of ten and model B catches
    two, that difference can matter even when the overall correct-answer counts match. Also count ordinary requests
    wrongly flagged, because unnecessary checks cost time. This is not advanced mathematics: start with separate
    piles and count what happened in each pile.'
  text_mode: '**Evaluation** means checking performance on a chosen task. For our delivery helper, list the requests
    that needed special handling and ask how many were caught. If model A catches eight of ten and model B catches
    two, that difference can matter even when the overall correct-answer counts match. Also count ordinary requests
    wrongly flagged, because unnecessary checks cost time. This is not advanced mathematics: start with separate
    piles and count what happened in each pile.'
- id: thinking-critically.s4
  title: A different situation can expose a weakness
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.thinking-critically
  markdown: 'A button sorter may have learned from bright photographs but now receive pictures taken in shadow.
    The kind of input has changed. This is called **distribution shift**: the pattern of examples encountered in
    use differs from the pattern used for development or testing. Start with the everyday meaning before memorizing
    the term. To investigate, include shadow pictures and compare the mistakes, rather than assuming the bright-picture
    result tells the whole story.'
  text_mode: 'A button sorter may have learned from bright photographs but now receive pictures taken in shadow.
    The kind of input has changed. This is called **distribution shift**: the pattern of examples encountered in
    use differs from the pattern used for development or testing. Start with the everyday meaning before memorizing
    the term. To investigate, include shadow pictures and compare the mistakes, rather than assuming the bright-picture
    result tells the whole story.'
- id: thinking-critically.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.thinking-critically
  markdown: Try a fresh example using the ideas above.
  text_mode: Untimed practice with feedback.
  takeaway: Ask what was tested, which examples were used, what it was compared with, and what mistakes matter.
    A confident answer is a claim to check.
- id: thinking-critically.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.thinking-critically
  markdown: Separate fluent output, measured performance, uncertainty, and evidence. Test claims on relevant examples
    and failure cases.
  text_mode: Separate fluent output, measured performance, uncertainty, and evidence. Test claims on relevant examples
    and failure cases.
- id: thinking-critically.s5
  title: Say when the answer is not supported
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.thinking-critically
  markdown: '**Abstention** means declining to give an answer when the available information does not support one
    under the chosen rule. If a museum schedule gives opening hours but no ticket prices, a useful helper can say
    it does not have the price. That response is different from inventing a likely price. A good system also needs
    a next step, such as finding the ticket page or asking a person, so the user is not left at a dead end.'
  text_mode: '**Abstention** means declining to give an answer when the available information does not support one
    under the chosen rule. If a museum schedule gives opening hours but no ticket prices, a useful helper can say
    it does not have the price. That response is different from inventing a likely price. A good system also needs
    a next step, such as finding the ticket page or asking a person, so the user is not left at a dead end.'
- id: thinking-critically.s6
  title: Practice the four questions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.thinking-critically
  markdown: 'For an AI claim, ask: what was the job, which examples were checked, what simple alternative was compared,
    and which mistakes matter? You can ask these questions without knowing the model’s internal mathematics. They
    help separate a promising demonstration from evidence for a particular use. Next, as you learn mechanisms, you
    will be able to investigate why errors happen. Keep the habit of checking claims even when the explanation or
    product looks impressive.'
  text_mode: 'For an AI claim, ask: what was the job, which examples were checked, what simple alternative was compared,
    and which mistakes matter? You can ask these questions without knowing the model’s internal mathematics. They
    help separate a promising demonstration from evidence for a particular use. Next, as you learn mechanisms, you
    will be able to investigate why errors happen. Keep the habit of checking claims even when the explanation or
    product looks impressive.'
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - thinking-critically.s1
    - thinking-critically.s2
    - thinking-critically.s3
    - thinking-critically.s4
    - thinking-critically.s5
    - thinking-critically.s6
    - thinking-critically.check
    gate_refs:
