schema_version: 0.2-draft
lesson:
  id: thinking-critically
  version: 0.4.0-draft
  title: How to tell whether an AI answer is useful
  state: draft
  summary: A chatbot tells you, with total confidence, that the museum opens at nine. It opens at ten. Learn four questions that separate a useful AI answer from a convincing one.
  slot: M00.9
  category: common
  sources:
    - title: Dive into Deep Learning — introduction
      url: https://d2l.ai/chapter_introduction/index.html
  archetype: foundation
objectives:
  - id: objective.thinking-critically
    version: 4-draft
    statement: Separate fluent output from measured performance, and test a claim on fresh examples and likely failure cases.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - thinking-critically.base.v3
      - thinking-critically.transfer.v3
    prerequisites:
      - anyOf:
          - objective.inside-a-system
scenes:
  - id: thinking-critically.s1
    title: A confident voice can still be wrong
    type: explanation
    depth: intuition
    objective_refs:
      - objective.thinking-critically
    markdown: |-
      You ask a museum's chat helper when it opens on Saturday. "We definitely open at 9 a.m.!" You arrive at 9 to locked doors. The official schedule on the museum's website says 10.

      Chat assistants sometimes state made-up facts in exactly the same confident, friendly tone as true ones. The tone comes from how the model writes, not from checking anything. So the tone tells you nothing.

      What tells you something is **evidence**: information that supports or challenges a claim. The museum's own schedule is evidence about opening times. Check that it's the right museum and the right date, and then it beats a confident sentence every time.
  - id: thinking-critically.s2
    title: Compare with something simple
    type: explanation
    depth: intuition
    objective_refs:
      - objective.thinking-critically
    markdown: |-
      A delivery company gets 100 requests. 90 are ordinary, and 10 need special handling, like a fragile parcel or a locked gate. A new AI model sorts the requests and is right 90 times out of 100. Impressive?

      :::predict A lazy rule simply calls every request "ordinary." How many does it get right?
      90, the same as the AI model, without looking at a single request. It's right about all 90 ordinary ones and wrong about all 10 special ones.
      :::

      That lazy rule is a **baseline**: a simple method you compare against. A new model has to beat the baseline to show it's adding anything. Here, 90 out of 100 sounded good until you saw that doing nothing scores 90 too.
  - id: thinking-critically.s3
    title: Count the mistakes that matter
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.thinking-critically
    markdown: |-
      As in the delivery-estimator lesson, evaluation means measuring how well a system does its job. Here, a single total hides the most important thing. Let's split the results by kind of mistake:

      | Method | Special requests caught (of 10) | Ordinary ones wrongly flagged (of 90) | Total right (of 100) |
      | --- | ---: | ---: | ---: |
      | Baseline: "all ordinary" | 0 | 0 | 90 |
      | Model A | 8 | 4 | 94 |
      | Model B | 2 | 2 | 90 |

      Model A's total is 8 caught plus the 86 ordinary requests it left alone: 94. Model B ties the baseline, and it misses 8 of the 10 requests that matter most.

      Which mistakes matter depends on the job. A missed fragile parcel might mean a broken vase and an angry customer. A wrongly flagged ordinary request costs a two-minute check. So Model A is clearly the one to use, even though it makes 4 unnecessary flags.
  - id: thinking-critically.s4
    title: A new situation can expose a weakness
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.thinking-critically
    markdown: |-
      Our button sorter was built and tested on bright photos. Now people start using it in a dim workshop. Suppose you test both:

      | Test photos | Sorted correctly |
      | --- | ---: |
      | 100 bright | 97 |
      | 100 in shadow | 71 |

      The sorter didn't change. The *inputs* did. When the examples a system meets in use differ from the ones it was built and tested on, that's called **distribution shift**. Spam filters face it constantly, as scammers invent new tricks the filter has never seen.

      The fix starts with testing: include the new kind of input, count the mistakes, and collect examples of it if the sorter struggles.
  - id: thinking-critically.s5
    title: '"I don''t know" can be the best answer'
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.thinking-critically
    markdown: |-
      The museum's schedule lists opening hours but no ticket prices. You ask the chat helper how much a ticket costs. Compare two replies:

      - *"Tickets are \$15."* It sounds helpful, but the number was invented.
      - *"I don't have ticket prices. They're listed on the museum's tickets page."*

      The second reply is far more useful, because you can act on it. **Abstention** means saying "I don't know" instead of guessing, because the information available doesn't answer the question. A good abstention also points to a next step, so you're not left at a dead end.
  - id: thinking-critically.s6
    title: Four questions for any AI claim
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.thinking-critically
    markdown: |-
      You can judge an AI claim without knowing any of the math inside. Ask:

      1. What exactly is the job?
      2. What was it tested on?
      3. What simple method was it compared with?
      4. Which mistakes matter most?

      Try them on an ad: *"Our AI spots plant disease with 95% accuracy!"*

      - *Tested on what?* Clear photos taken in a lab, or blurry phone photos from gardens like yours?
      - *Compared with what?* If 95% of the test leaves were healthy, the lazy rule "always say healthy" also scores 95%, while catching zero sick plants.
      - *Which mistakes matter?* For a gardener, missing a sick plant is worse than a false alarm.

      :::mixup "95% accuracy means it's right about my plant 95% of the time."
      The 95% describes the test photos it was scored on. If your photos, or your mix of healthy and sick leaves, look different, your results can be very different.
      :::
  - id: thinking-critically.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.thinking-critically
    markdown: Bakery hours, scam filters, smoke alarms, and bird-spotting apps ask you to weigh evidence, compare with a baseline, and count the mistakes that matter.
    takeaway: |-
      A confident answer is a claim to check. Ask what was tested, what it was compared with, and which mistakes matter, and value an honest "I don't know" over a smooth guess.
  - id: thinking-critically.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.thinking-critically
    markdown: |-
      Separate fluent output, measured performance, uncertainty, and evidence. Test claims on relevant examples and failure cases.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - thinking-critically.s1
        - thinking-critically.s2
        - thinking-critically.s3
        - thinking-critically.s4
        - thinking-critically.s5
        - thinking-critically.s6
        - thinking-critically.check
      gate_refs:
        - gate.core
  scene_aliases:
    thinking-critically.recap: thinking-critically.check
assessment_families:
  - id: thinking-critically.base
    objective_ref: objective.thinking-critically
    task: base
    response_type: single_choice
    points: 1
    hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
    variants:
      - id: thinking-critically.base.1
        prompt: An answer sounds polished and certain. What does that tell you about its factual support?
        options:
          - id: a
            text: Its tone proves the sources are correct.
          - id: b
            text: All fluent answers have been verified.
          - id: correct
            text: You still need to check the relevant evidence.
        answer: correct
        feedback: You still need to check the relevant evidence.
        retired: true
      - id: thinking-critically.base.2
        prompt: Why compare a model against a baseline?
        options:
          - id: b
            text: To prove the model understands the task like a human.
          - id: correct
            text: To see whether its added complexity improves the relevant outcome.
          - id: a
            text: To avoid evaluating difficult examples.
        answer: correct
        feedback: To see whether its added complexity improves the relevant outcome.
        retired: true
      - id: thinking-critically.base.v2.1
        prompt: A confident museum answer conflicts with its current official schedule. What should guide the opening-hours answer?
        options:
          - id: c
            text: The same generated answer repeated twice
          - id: a
            text: The relevant current schedule
          - id: b
            text: The confidence of the wording
        answer: a
        feedback: The schedule supplies task-relevant evidence, while tone does not establish the time.
        retired: true
      - id: thinking-critically.base.v2.2
        prompt: Ninety of 100 requests are ordinary. A rule calls all 100 ordinary. How many are correct?
        options:
          - id: a
            text: '90'
          - id: b
            text: '100'
          - id: c
            text: '10'
        answer: a
        feedback: The rule gets the ninety ordinary requests right and the ten special ones wrong.
        retired: true
      - id: thinking-critically.base.v2.3
        prompt: What is a baseline?
        options:
          - id: b
            text: The system selected as the final solution
          - id: c
            text: A minimum score the system must reach
          - id: a
            text: A simple reference for comparison
        answer: a
        feedback: A baseline makes improvement a comparison rather than an isolated score.
        retired: true
      - id: thinking-critically.base.v2.4
        prompt: Two systems tie on total correct answers. What is useful to inspect next?
        options:
          - id: c
            text: Whether one repeated successful case looks clearer
          - id: a
            text: Which kinds of mistakes each makes
          - id: b
            text: Whether the tied total is the same for both systems
        answer: a
        feedback: Equal totals can hide different errors with different consequences.
        retired: true
      - id: thinking-critically.base.v2.5
        prompt: Two sorters each get 90 of 100 cases right. What else helps compare them for the intended job?
        options:
          - id: a
            text: Which sorter has a more confident description
          - id: b
            text: Which result was printed in a larger font
          - id: c
            text: Which kinds of cases each sorter gets wrong
        answer: c
        feedback: Equal totals can hide different failure patterns. Inspect errors that matter for the task.
        retired: true
      - id: thinking-critically.base.v2.6
        prompt: An answer sounds confident but gives no supporting source. What should confidence tell you about its truth?
        options:
          - id: a
            text: It is a presentation feature, not proof of truth
          - id: b
            text: It establishes that the answer was checked
          - id: c
            text: It establishes that the question had enough information
        answer: a
        feedback: Fluent or confident wording does not establish evidence. Check the factual claim separately.
        retired: true
    remediation_scene: thinking-critically.s3
  - id: thinking-critically.transfer
    objective_ref: objective.thinking-critically
    task: transfer
    response_type: single_choice
    points: 1
    hint: "Ask what the evidence actually covers: which inputs were tested, how many cases of each kind were caught or missed, and whether the source even contains the fact you need."
    variants:
      - id: thinking-critically.transfer.1
        prompt: A daytime camera model struggles in fog. What should you investigate?
        options:
          - id: b
            text: Whether training loss once reached a low value.
          - id: correct
            text: The changed input conditions and their effect on errors.
          - id: a
            text: Only whether the answer text is confident.
        answer: correct
        feedback: The changed input conditions and their effect on errors.
        retired: true
      - id: thinking-critically.transfer.2
        prompt: A model gets 90 of 100 cases right; a baseline gets 95. What follows?
        options:
          - id: correct
            text: The new model is not better by accuracy on this sample.
          - id: a
            text: The new model is necessarily better because it is AI.
          - id: b
            text: Neither result can ever be compared.
        answer: correct
        feedback: The new model is not better by accuracy on this sample.
        retired: true
      - id: thinking-critically.transfer.v2.1
        prompt: A sorter developed on bright photos now gets shadow photos. What changed?
        options:
          - id: a
            text: The pattern of inputs it encounters
          - id: b
            text: The intended job changed from sorting to counting
          - id: c
            text: The stored settings were necessarily updated
        answer: a
        feedback: This is an example of a change in the input distribution.
        retired: true
      - id: thinking-critically.transfer.v2.2
        prompt: A source lists hours but not admission price. Which answer handles the gap?
        options:
          - id: b
            text: I can use an older remembered price without checking it
          - id: c
            text: I can use the price of a similar museum as this museum’s price
          - id: a
            text: I have the hours; I need a price source
        answer: a
        feedback: Saying that a price source is needed identifies the missing evidence without presenting an old or unrelated price as current fact.
        retired: true
      - id: thinking-critically.transfer.v2.3
        prompt: One model catches eight of ten special requests. How many special requests did it miss?
        options:
          - id: c
            text: '10'
          - id: a
            text: '2'
          - id: b
            text: '8'
        answer: a
        feedback: Ten special requests minus eight caught leaves two missed.
        retired: true
      - id: thinking-critically.transfer.v2.4
        prompt: Which comparison gives stronger evidence for a useful sorter?
        options:
          - id: a
            text: Testing on varied pictures with recorded errors
          - id: b
            text: Testing one clear picture repeatedly and counting successes
          - id: c
            text: Comparing how confidently both sorters describe their answers
        answer: a
        feedback: Varied, relevant cases and recorded mistakes reveal more than a single demonstration.
        retired: true
      - id: thinking-critically.transfer.v2.5
        prompt: A detector catches 7 of 12 important requests. How many does it miss?
        options:
          - id: a
            text: '5'
          - id: b
            text: '7'
          - id: c
            text: '19'
        answer: a
        feedback: 'Subtract the 7 found from the 12 that needed detection: 12 − 7 = 5.'
        retired: true
      - id: thinking-critically.transfer.v2.6
        prompt: A guide lists a museum’s address but says nothing about wheelchair access. What is a justified response about access?
        options:
          - id: a
            text: Infer access from the presence of a street address
          - id: b
            text: Find relevant access information before answering
          - id: c
            text: Use access information from a different museum
        answer: b
        feedback: Information about one property does not establish another. Identify the missing evidence instead of filling the gap with a guess.
        retired: true
    remediation_scene: thinking-critically.s3
  - id: thinking-critically.base.v3
    objective_ref: objective.thinking-critically
    task: base
    response_type: single_choice
    points: 1
    hint: Set the tone aside. Look for the evidence, the simple baseline to compare against, and the kinds of mistakes behind the score.
    remediation_scene: thinking-critically.s3
    variants:
      - id: thinking-critically.base.v3.1
        prompt: A chat assistant says a bakery opens at 7 a.m. "for sure." The bakery's own website says 8 a.m. Which answer should you go with?
        options:
          - id: a
            text: The chat assistant's, since it sounded completely certain
          - id: b
            text: The website's, since it comes from the bakery itself
          - id: c
            text: Whichever of the two answers you happened to see last
        answer: b
        feedback: The bakery's own schedule is evidence about its hours. The assistant's certainty comes from how it writes, not from checking anything.
      - id: thinking-critically.base.v3.2
        prompt: Of 200 emails, 180 are fine and 20 are scams. A lazy rule marks every email as fine. How many emails does it get right?
        options:
          - id: a
            text: '200'
          - id: b
            text: '20'
          - id: c
            text: '180'
        answer: c
        feedback: It's right about all 180 fine emails and wrong about all 20 scams. That's the baseline any real scam filter has to beat.
      - id: thinking-critically.base.v3.3
        prompt: Of 200 emails, 20 are scams. A new AI filter gets 180 of the 200 right, the same as the rule "mark everything as fine." What can you conclude?
        options:
          - id: c
            text: It is better, because it uses AI instead of a rule
          - id: b
            text: It must have caught every one of the 20 scams
          - id: a
            text: It ties the simple baseline on its total score
        answer: a
        feedback: Matching the do-nothing rule means the total shows no improvement yet. Using AI doesn't make it better by itself, and 20 mistakes could include missing every scam.
      - id: thinking-critically.base.v3.4
        prompt: Two scam filters each get 190 of 200 emails right. What is the most useful thing to check next?
        options:
          - id: c
            text: Which kinds of emails each filter gets wrong
          - id: b
            text: Which filter was released more recently
          - id: a
            text: Which filter explains its choices with more confidence
        answer: c
        feedback: Equal totals can hide very different mistakes. A filter that misses scams is far worse than one that wrongly flags a few newsletters.
      - id: thinking-critically.base.v3.5
        prompt: A phone's face unlock was tested on daytime photos and worked well. At night it keeps failing. What best explains this?
        options:
          - id: b
            text: Its weights changed overnight after too much daily use
          - id: a
            text: The inputs it now meets differ from the tested ones
          - id: c
            text: The night-time photos were given the wrong labels
        answer: a
        feedback: This is distribution shift. Dark photos differ from the daytime ones it was tested on. Weights don't change just from being used.
      - id: thinking-critically.base.v3.6
        prompt: A travel helper has the train timetable but no ticket prices. You ask what a ticket costs. Which reply is most useful?
        options:
          - id: a
            text: '"About 40 dollars, which is typical for trains."'
          - id: c
            text: '"The same as the price I saw for it last year."'
          - id: b
            text: '"I don''t have prices; the rail site lists them."'
        answer: b
        feedback: Saying what it doesn't know, and where to look, is honest abstention you can act on. The other two sound helpful but present a guess as a fact.
  - id: thinking-critically.transfer.v3
    objective_ref: objective.thinking-critically
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what the evidence actually covers. Which inputs was it tested on, what does a lazy baseline score, which mistakes does it make, and does the information even contain the answer?
    remediation_scene: thinking-critically.s3
    variants:
      - id: thinking-critically.transfer.v3.1
        prompt: 'A study app claims, "Our AI predicts which students will fail a course with 92% accuracy." In its test group, 92% of students passed. Which fact matters most?'
        options:
          - id: a
            text: 92% is higher than most students' test scores
          - id: b
            text: The app is built on a newer kind of AI model
          - id: c
            text: Always predicting "pass" would also score 92%
        answer: c
        feedback: With 92% passing, the lazy rule "everyone passes" matches the score while catching no one who fails. The app has to beat that baseline; a big number or new technology doesn't show that it does.
      - id: thinking-critically.transfer.v3.2
        prompt: Two smoke-alarm models are tested on 1,000 cases, 20 of them real fires. Model X catches 18 fires and gives 30 false alarms. Model Y catches 10 fires and gives 5 false alarms. Which is better for a home, and why?
        options:
          - id: a
            text: Y, since its total number right is higher
          - id: b
            text: X, since missed fires matter most here
          - id: c
            text: Y, since it makes fewer of each mistake
        answer: b
        feedback: Y gets more right in total (985 vs. 968) but misses 10 of the 20 fires, while X misses only 2. A missed fire costs far more than a false alarm, so count the mistakes that matter. Y does not make fewer of each mistake; it misses more fires.
      - id: thinking-critically.transfer.v3.3
        prompt: A bird-identifying app was built and tested on photos of North American birds. A hiker in Australia finds it keeps naming birds wrong. What best explains this?
        options:
          - id: a
            text: The birds it meets differ from the ones it was tested on
          - id: b
            text: Its weights wore out after so many people used it
          - id: c
            text: The hiker's photos were given the wrong labels
        answer: a
        feedback: This is distribution shift. Australian birds differ from the North American ones it was built and tested on. Using a model doesn't wear out its weights, and the hiker's photos aren't labeled at all; the app is supplying the names.
      - id: thinking-critically.transfer.v3.4
        prompt: A cooking helper has a cake recipe's ingredient list, but the recipe gives no baking time. You ask how long to bake the cake. Which reply is most useful?
        options:
          - id: c
            text: '"Bake it for 35 minutes, like most cakes."'
          - id: b
            text: '"This recipe has no time; check its source."'
          - id: a
            text: '"Bake it for about an hour, until golden."'
        answer: b
        feedback: The helper's information doesn't contain the time, so saying so and pointing to where to look is honest abstention you can act on. The other replies present a guess as if it came from the recipe.
      - id: thinking-critically.transfer.v3.5
        prompt: 'A company says its homework checker is "right 85% of the time." You want to know whether it would help you. Which question should you ask first?'
        options:
          - id: a
            text: What kind of AI model is running inside it?
          - id: c
            text: What was it tested on, and against what?
          - id: b
            text: How many students have signed up to use it?
        answer: c
        feedback: An 85% score only means something once you know the test cases and the simple baseline it had to beat. The kind of model and its popularity don't tell you how well it does your job.
      - id: thinking-critically.transfer.v3.6
        prompt: A chess-coaching app shows a demo where it spots a brilliant move in one famous game. What would tell you most about whether it will help you?
        options:
          - id: c
            text: Watching that same demo again, more slowly
          - id: a
            text: Trying it on many of your own recent games
          - id: b
            text: Noticing how confident it sounds about the move
        answer: a
        feedback: Testing on many examples like the ones you care about, your own games, shows how it really performs. Replaying the demo only repeats the one case you've seen, and confidence is tone, not evidence.
