schema_version: 0.2-draft
lesson:
  id: benchmark-design-and-comparison
  version: 0.4.0-draft
  title: Build a test whose score supports the intended claim
  state: draft
  summary: A support bot aces a 500-question quiz about phone plans, then fumbles real customers. Learn to build a benchmark that measures the right thing and stays honest once people start chasing it.
  slot: M28.2
  category: learning
  sources:
    - title: "Measuring Massive Multitask Language Understanding (MMLU) (Hendrycks et al., 2020)"
      url: https://arxiv.org/abs/2009.03300
    - title: "MMLU-Pro: A More Robust and Challenging Multi-Task Language Understanding Benchmark (Wang et al., 2024)"
      url: https://arxiv.org/abs/2406.01574
    - title: "GPT-4 Technical Report (OpenAI, 2023)"
      url: https://arxiv.org/abs/2303.08774
    - title: "Language Models are Few-Shot Learners (Brown et al., 2020), appendix on 13-gram contamination checks"
      url: https://arxiv.org/abs/2005.14165
    - title: "Beyond the Imitation Game: BIG-bench (Srivastava et al., 2022), which introduced a canary string"
      url: https://arxiv.org/abs/2206.04615
    - title: "Dynabench: Rethinking Benchmarking in NLP (Kiela et al., 2021)"
      url: https://arxiv.org/abs/2104.14337
    - title: "LiveBench: A Challenging, Contamination-Limited LLM Benchmark (White et al., 2024)"
      url: https://arxiv.org/abs/2406.19314
    - title: Liang et al. — Holistic Evaluation of Language Models
      url: https://arxiv.org/abs/2211.09110
  archetype: mechanism
objectives:
  - id: objective.benchmark-design-and-comparison
    version: 3-draft
    statement: Specify benchmark tasks, sampling, scoring, resource conditions, and contamination checks before interpreting comparisons.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - benchmark-design-and-comparison.base.v3
      - benchmark-design-and-comparison.transfer.v3
    prerequisites:
      - anyOf:
          - objective.evaluation-metrics-and-uncertainty
      - anyOf:
          - objective.splits-and-leakage
scenes:
  - id: benchmark-design-and-comparison.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.benchmark-design-and-comparison
    title: A 92% score on the wrong test
    markdown: |-
      Kestrel's first benchmark was quick to build: 500 multiple-choice questions about its phone plans, such as "Which plan includes 20 GB of roaming data?" Model B scored 92%. Then the team read 50 real chats. Customers weren't asking plan trivia. They wrote "my eSIM won't activate" and "why was I charged twice?", and B often gave confident, wrong fixes.

      The quiz measured something real, recall of plan facts, but not what Kestrel cared about: solving a customer's problem. How well a test's scores track the ability you actually care about is called **construct validity**.

      | | Plan quiz | What the release decision needs |
      | --- | --- | --- |
      | Input | A tidy question with 4 options | A messy message, often missing details |
      | Correct means | Picks the right letter | Gives a fix that works, or asks, or hands off |
      | Covers | Plan facts | Billing, devices, roaming, cancellations |

      A quick check: does the benchmark rank systems the way hand-graded real chats do? If not, it's measuring something else.
    bridges: []
  - id: benchmark-design-and-comparison.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.benchmark-design-and-comparison
    title: Sample real traffic, then freeze the set
    markdown: |-
      Kestrel's second benchmark draws 200 chats at random from last quarter, with personal details removed, plus a reference answer and rubric for each. The mix follows real use: about 40% billing, 25% devices, 20% roaming, 15% cancellations. It keeps the 20 chats whose answer isn't in the help pages, where the right move is to ask or hand off.

      Then the team freezes the set before scoring any model. Dropping hard items after seeing the failures would quietly measure something easier.
    bridges: []
  - id: benchmark-design-and-comparison.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.benchmark-design-and-comparison
    title: When every model scores 90%
    markdown: |-
      **MMLU** (Hendrycks et al., 2020) is a set of four-option questions across 57 subjects, from law to physics. At release, the largest GPT-3 model scored 43.9%, against 25% for guessing. In 2023 the GPT-4 technical report listed 86.4%, and top models soon crowded near the top.

      A benchmark is **saturated** when the systems you want to compare all score near its ceiling. The remaining gaps shrink toward the noise from label errors and prompt format. MMLU still shows a model isn't weak, but it can't tell two strong models apart. Harder successors followed, such as MMLU-Pro, with ten options per question.

      Kestrel's plan quiz saturated in the same way: A scored 91% and B 92%.
    bridges: []
  - id: benchmark-design-and-comparison.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.benchmark-design-and-comparison
    title: Did the model see the test?
    markdown: |-
      Kestrel's test chats resemble posts on a public help forum, and forums are part of the web text models train on. If a test item appeared in training, the model may be remembering the answer. This is **contamination**.

      The standard check is **n-gram overlap**: split each test item into runs of n consecutive words and look for the same runs in the training data. The GPT-3 paper (Brown et al., 2020) flagged test items that shared any 13-word run with its training set. The program uses 8-word runs because the items are short.

      ```python run
      import re

      def ngrams(text, n):
          words = re.sub(r"[^\w\s]", " ", text.lower()).split()
          return {tuple(words[i:i + n]) for i in range(len(words) - n + 1)}

      # A scraped help-forum page that may have ended up in a model's training data
      crawl = """Re: eSIM problem. My eSIM will not activate after I switched to a new
      phone, and the QR code says it has already been used. Fix: ask support to
      reissue the eSIM profile, then scan the new code within 24 hours."""

      test_items = [
          "My eSIM will not activate after I switched to a new phone. What do I do?",
          "I moved to a new handset and now the eSIM refuses to turn on. Help?",
          "Why was I charged twice for roaming in Portugal last month?",
      ]

      N = 8
      seen = ngrams(crawl, N)
      for item in test_items:
          grams = ngrams(item, N)
          shared = len(grams & seen)
          print(f"{shared}/{len(grams)} shared {N}-grams  {'FLAG' if shared else 'ok  '}  {item[:48]}")
      ```

      :::predict The second item asks the same thing in new words. Does the check catch it?
      No: 0 of 8 runs match. N-gram overlap catches copies, not paraphrases, so a leaked-then-reworded item slips through. Try `N = 3`: the second item gets flagged, but only because it shares the everyday phrase "to a new" with the forum post. Short runs match ordinary phrasing, not meaning.
      :::

      Overlap checks need the training data, and Kestrel can't see a vendor's. A **canary string** works without it: a unique random code placed in the benchmark files. BIG-bench shipped one so model builders could filter out documents containing it. If a model can complete the canary, the benchmark leaked. Questions written after a model's training cutoff are safe too.
    bridges: []
  - id: benchmark-design-and-comparison.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.benchmark-design-and-comparison
    title: Once the score is a target
    markdown: |-
      Over a few months, Kestrel's engineers tweak prompts and settings, rerunning the 200-chat benchmark each time and keeping whatever helps. The score climbs from 78% to 86%. Some of that is real; some is the tweaks fitting these 200 chats. It's the winner's curse from module 9, repeated a hundred times.

      This is **Goodhart's law**, named for the economist Charles Goodhart and best known in anthropologist Marilyn Strathern's wording: "When a measure becomes a target, it ceases to be a good measure." Public leaderboards invite it at scale.

      The defense is to separate the set you tune on from the set that decides:

      - A **private held-out set** that engineers never see item by item, run once per release candidate.
      - A **dynamic benchmark** that keeps adding new items. Dynabench (Kiela et al., 2021) has people write examples that fool current models, and LiveBench (White et al., 2024) regularly adds questions from recent sources.

      Kestrel adopts both: engineers tune on a public development set, and each month 50 fresh chats join the private set.
    diagram:
      caption: Tuning happens on one set; the release decision uses another that nobody tunes on.
      description: Live customer chats feed a monthly refresh, which adds new items to the private held-out set. Engineers change prompts and settings in a tuning loop that runs only against the public development set. A release candidate from the tuning loop is scored once on the private held-out set, and that score goes to the release decision.
      nodes:
        - id: live
          label: Live customer chats
          col: 0
          row: 0
          tone: data
        - id: refresh
          label: Monthly refresh
          note: 50 new chats
          col: 1
          row: 0
        - id: private
          label: Private held-out set
          note: never tuned on
          col: 2
          row: 0
          tone: accent
        - id: dev
          label: Public dev set
          col: 0
          row: 1
          tone: data
        - id: tune
          label: Tuning loop
          note: prompts, retrieval, settings
          col: 1
          row: 1
          tone: warn
        - id: decide
          label: Release decision
          col: 3
          row: 0
      edges:
        - from: live
          to: refresh
        - from: refresh
          to: private
          label: add items
        - from: dev
          to: tune
          label: score, tweak, repeat
        - from: tune
          to: private
          label: one run per candidate
        - from: private
          to: decide
          label: score
  - id: benchmark-design-and-comparison.paired
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.benchmark-design-and-comparison
    title: Same questions, paired answers
    markdown: |-
      In the last lesson, B's 3-point lead carried an error bar of ± 8.3 points. But both models answered the *same* 200 chats, so, as in the lesson on controlled experiments, compare them item by item:

      | | B right | B wrong |
      | --- | ---: | ---: |
      | **A right** | 144 | 6 |
      | **A wrong** | 12 | 38 |

      The 144 easy and 38 hard chats can't separate the models. The evidence is in the 18 disagreements: B wins 12 and loses 6, a net 6/200 = 3 points. Each chat's difference $d_i$ is +1, −1, or 0, with mean 0.03 and variance $18/200 - 0.03^2 = 0.0891$. So

      $$\text{SE} = \sqrt{0.0891/200} = 0.0211, \qquad 1.96 \times 0.0211 = 0.041$$

      The paired interval is 3 ± 4.1 points, half the unpaired width, but it still includes zero. McNemar's test, which uses only the disagreements, agrees: $(12-6)^2/18 = 2.0$, p ≈ 0.16.

      :::predict Kestrel grows the private set to 800 chats, and the table's proportions stay the same. Does B's lead become clear?
      Yes. The standard error halves to 0.0106, so the interval becomes 3 ± 2.1 points, or 0.9 to 5.1, which excludes zero.
      :::
    bridges: []
  - id: benchmark-design-and-comparison.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.benchmark-design-and-comparison
    title: The score belongs to the whole setup
    markdown: |-
      A vendor says its model "resolves 85% of support tickets." Its setup included retrieval over help pages, a longer answer budget, and up to five attempts per ticket with a checker picking the best.

      Each of those changes the system being measured. In the lesson on agent evaluation, pass@k asked whether *at least one* of k attempts succeeds, but a customer gets one reply. So Kestrel records the template, tools, sampling settings, attempts, and cost per question, and compares models only under matching conditions.
    bridges: []
  - id: benchmark-design-and-comparison.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.benchmark-design-and-comparison
    markdown: A coding test, a medical quiz, a translation leaderboard, and a tutoring benchmark test whether you can spot bad construct validity, contamination, saturation, and Goodhart's law.
    takeaway: |-
      A benchmark score means something only if the items match the real task, were never trained or tuned on, and still spread strong models apart. Compare models on the same items, pair by pair, under the same conditions.
  - id: benchmark-design-and-comparison.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.benchmark-design-and-comparison
    markdown: |-
      A benchmark score describes performance on particular cases under particular conditions. Read the tasks, scoring rules, budgets, and limits before comparing ranks.
  - id: benchmark-design-and-comparison.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.benchmark-design-and-comparison
    title: One attempt or several?
    markdown: |-
      System A succeeds on 70 of 100 tasks with one attempt each. System B succeeds on 85 with up to five attempts per task. What is missing from a claim that B is simply more reliable?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: A comparison under matching attempt budgets.
        - id: b
          text: A comparison of parameter counts instead of attempt budgets.
        - id: c
          text: A score that keeps only each system’s easiest successful cases.
      answer: a
      reveal_markdown: |-
        B's 85% is a best-of-five number, closer to pass@5 than to one-shot reliability. Rerun B with one attempt per task (or give A five), then compare. Report the cost of the extra attempts too, since each retry is another model call.
      hint: Count how many tries each system got before comparing their success rates.
      id: benchmark-design-and-comparison.practice.v2.7
