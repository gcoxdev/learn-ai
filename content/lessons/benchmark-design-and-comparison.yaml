assessment_families:
- id: benchmark-design-and-comparison.base
  objective_ref: objective.benchmark-design-and-comparison
  task: base
  response_type: single_choice
  points: 1
  hint: 'Protect independence: trace the inputs, operation, and result before choosing.'
  remediation_scene: benchmark-design-and-comparison.s2
  variants:
  - id: benchmark-design-and-comparison.base.1
    prompt: Does a benchmark title prove representative coverage of its entire topic?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if it has many examples
    answer: a
    feedback: Sampling design determines coverage.
    retired: true
  - id: benchmark-design-and-comparison.base.2
    prompt: Why can repeated prompt tuning on the test set inflate results?
    options:
    - id: b
      text: Prompts cannot affect scores
    - id: c
      text: It guarantees better unseen generalization
    - id: a
      text: The evaluation becomes part of optimization
    answer: a
    feedback: Selection uses test feedback and weakens independence.
    retired: true
- id: benchmark-design-and-comparison.transfer
  objective_ref: objective.benchmark-design-and-comparison
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Maintain versions and negative cases: trace the inputs, operation, and result before choosing.'
  remediation_scene: benchmark-design-and-comparison.s4
  variants:
  - id: benchmark-design-and-comparison.transfer.1
    prompt: What helps compare two models with less item-sampling noise?
    options:
    - id: b
      text: Different undisclosed task sets
    - id: c
      text: Only rounded leaderboard ranks
    - id: a
      text: Paired outcomes on the same examples
    answer: a
    feedback: Pairing controls some example difficulty variation.
    retired: true
  - id: benchmark-design-and-comparison.transfer.2
    prompt: Why version the scoring code?
    options:
    - id: c
      text: Scores are independent of scoring rules
    - id: a
      text: Scorer changes can alter results without model changes
    - id: b
      text: Only to rename files
    answer: a
    feedback: The instrument is part of the experiment.
    retired: true
- id: benchmark-design-and-comparison.base.v2
  objective_ref: objective.benchmark-design-and-comparison
  task: base
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: benchmark-design-and-comparison.s3
  variants:
  - prompt: What makes a benchmark claim interpretable?
    answer: a
    options:
    - id: b
      text: The rank without the evaluation setup
    - id: c
      text: Its rank averaged across tables with undisclosed conditions
    - id: a
      text: Its tasks, conditions, scoring rules, and limits
    feedback: The measurement contract defines what the numbers mean.
    id: benchmark-design-and-comparison.base.v2.1
  - prompt: An assistant should say when information is missing. Which test cases are needed?
    answer: a
    options:
    - id: a
      text: Cases with insufficient supplied evidence
    - id: b
      text: Only questions whose answers are obvious
    - id: c
      text: Questions accompanied by complete answer keys as model input
    feedback: The benchmark must test the behavior promised, including appropriate uncertainty.
    id: benchmark-design-and-comparison.base.v2.2
  - prompt: When is exact string matching a suitable primary criterion?
    answer: a
    options:
    - id: c
      text: Whenever human judgment would take time
    - id: b
      text: Whenever two answers use different words
    - id: a
      text: When the task requires a precisely specified output string or format
    feedback: Exact match suits exact-output tasks; other tasks may require a more flexible rubric.
    id: benchmark-design-and-comparison.base.v2.3
  - prompt: Why disclose retries and tool access?
    answer: a
    options:
    - id: c
      text: They reveal the model’s exact training data
    - id: a
      text: They change the evaluated system’s resources and opportunities
    - id: b
      text: They replace the need to record prompts
    feedback: Runtime conditions shape performance and cost.
    id: benchmark-design-and-comparison.base.v2.4
- id: benchmark-design-and-comparison.transfer.v2
  objective_ref: objective.benchmark-design-and-comparison
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: benchmark-design-and-comparison.s3
  variants:
  - prompt: A benchmark removes difficult cases after reviewing model errors. What changed?
    answer: a
    options:
    - id: b
      text: Only the file size without affecting conclusions
    - id: c
      text: The training objective for every model
    - id: a
      text: The tested task distribution and the scope of the claim
    feedback: Removing cases changes what the benchmark measures and should be disclosed.
    id: benchmark-design-and-comparison.transfer.v2.1
  - prompt: A model sees close variants of benchmark items throughout prompt tuning. What needs review?
    answer: a
    options:
    - id: c
      text: Whether increasing the number of paraphrases makes the final test independent
    - id: b
      text: Only the numerical precision used to print the score
    - id: a
      text: Development contamination and the remaining independence of the test
    feedback: Repeated exposure can make a benchmark part of development.
    id: benchmark-design-and-comparison.transfer.v2.2
  - prompt: A one-point lead appears on a small test. What is a reasonable next step?
    answer: a
    options:
    - id: c
      text: Select the winner first, then use its best error slice as confirmation
    - id: a
      text: Inspect uncertainty and paired error cases
    - id: b
      text: Declare a universal ranking across all uses
    feedback: Small-sample differences need context and may not be stable.
    id: benchmark-design-and-comparison.transfer.v2.3
  - prompt: A writing benchmark is used to claim accurate grounded question answering. What is missing?
    answer: a
    options:
    - id: a
      text: Evidence from tasks that require correct use of supplied sources
    - id: c
      text: A larger writing test that still never checks source use
    - id: b
      text: More writing samples with the same fluency-only scoring rule
    feedback: A benchmark supports the abilities its tasks and rubric actually probe.
    id: benchmark-design-and-comparison.transfer.v2.4
