  - id: benchmark-design-and-comparison.base.v3
    objective_ref: objective.benchmark-design-and-comparison
    task: base
    response_type: single_choice
    points: 1
    hint: Name what the test really measures, then ask whether this evidence (the items, an overlap check, or a paired comparison) can support the claim being made.
    remediation_scene: benchmark-design-and-comparison.s1
    variants:
      - id: benchmark-design-and-comparison.base.v3.1
        prompt: A coding assistant is tested on 300 multiple-choice questions asking which library function does a given job. The team wants to claim the assistant writes working code. What is the main problem?
        options:
          - id: b
            text: Three hundred items are too few to measure a coding skill
          - id: a
            text: Picking a function name is a different skill from writing code that runs
          - id: c
            text: Multiple-choice questions usually leak into training data
        answer: a
        feedback: This is a construct-validity problem. Recognizing an API from four options measures recall, not the ability to produce code that passes tests. Three hundred items is enough to measure something; the trouble is that it measures the wrong thing.
      - id: benchmark-design-and-comparison.base.v3.2
        prompt: The top five models on a benchmark score between 96.1% and 97.0%. What most limits the benchmark's use for choosing among them?
        options:
          - id: c
            text: Contamination, since scores this high show the items were memorized
          - id: b
            text: Too many models were tested, so their scores are not independent
          - id: a
            text: It is saturated, so the gaps are within noise and label errors
        answer: a
        feedback: When strong models crowd near the ceiling, the remaining differences are smaller than the noise from sampling, prompt format, and wrong answer keys. High scores can come from contamination, but they don't show it; that needs an overlap or canary check.
      - id: benchmark-design-and-comparison.base.v3.3
        prompt: A test question was reworded on a public forum before a model's training data was collected. An 8-gram overlap check finds no shared runs. What can you conclude?
        options:
          - id: a
            text: The check can't rule out a reworded leak, since it catches copies
          - id: b
            text: The item is clean, since not one 8-word run matched the data
          - id: c
            text: Rerun with 2-grams, which will reliably catch the reworded leak
        answer: a
        feedback: N-gram overlap finds copied text, and rewording breaks the runs. Very short n-grams like 2-grams match ordinary phrases everywhere, so they flag nearly every item rather than catching leaks.
      - id: benchmark-design-and-comparison.base.v3.4
        prompt: Two models answered the same 200 items and disagree on 18 of them, with the new model winning 12. Why analyze the pairs instead of comparing two separate accuracies?
        options:
          - id: b
            text: Items where the models disagree are the only reliably graded ones
          - id: a
            text: Items both get right or both get wrong cancel, narrowing the gap's interval
          - id: c
            text: Separate accuracies can't be computed when two models share items
        answer: a
        feedback: Pairing removes the item-to-item difficulty that both models share, so the interval for the gap shrinks (here from about ±8 to ±4 points). Separate accuracies can be computed; they just throw that shared structure away.
  - id: benchmark-design-and-comparison.transfer.v3
    objective_ref: objective.benchmark-design-and-comparison
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask where the items came from, who has seen or tuned on them, and whether the systems being compared ran under the same conditions.
    remediation_scene: benchmark-design-and-comparison.s6
    variants:
      - id: benchmark-design-and-comparison.transfer.v3.1
        prompt: A hospital chatbot team reruns its 300-question test after every prompt change and keeps whatever raises the score. It climbs from 71% to 83%. How can they learn how much of the gain is real?
        options:
          - id: c
            text: Rerun the same 300 questions with three seeds and average them
          - id: a
            text: Score the final version once on a held-out set nobody tuned on
          - id: b
            text: Report the 83% with a binomial confidence interval around it
        answer: a
        feedback: Repeated tuning fits the 300 questions themselves, so only untouched items give an honest estimate. Seeds and a confidence interval measure other kinds of noise; neither removes the selection effect of keeping the best tweaks.
      - id: benchmark-design-and-comparison.transfer.v3.2
        prompt: A research group is releasing a new evaluation set and wants to detect, later on, whether a model was trained on it. What should they add to the files?
        options:
          - id: b
            text: A license that forbids training on the files, which blocks leaks
          - id: c
            text: Many more items, so any single leaked item matters less
          - id: a
            text: A unique canary string, then check whether models can complete it
        answer: a
        feedback: A canary gives model builders a string to filter on and gives testers a direct probe. If a model reproduces the code, the files were in its training data. A license states a rule but can't detect a breach, and more items only dilute the damage.
      - id: benchmark-design-and-comparison.transfer.v3.3
        prompt: A translation leaderboard lists Model X at 34.2 and Model Y at 33.9. Each team ran its own model with a different prompt format and output length limit. How should you read the ranking?
        options:
          - id: a
            text: It is unclear until both models run under the same conditions
          - id: b
            text: X is ahead, since both teams used the same test sentences
          - id: c
            text: They are tied, since any gap under one point is noise
        answer: a
        feedback: Prompt format and output limits can move scores by more than 0.3 points, so the gap may reflect the setups rather than the models. Shared test sentences aren't enough, and whether a gap is noise depends on the test size and pairing, not a fixed one-point rule.
      - id: benchmark-design-and-comparison.transfer.v3.4
        prompt: A math-tutoring startup's benchmark was published two years ago and has been widely copied online. They want a test that stays hard to memorize. Which design fits?
        options:
          - id: c
            text: Keep the same problems but shuffle the order of the answer choices
          - id: b
            text: Double the published set with more problems written in the same style
          - id: a
            text: Add fresh problems regularly, written after models' training cutoffs
        answer: a
        feedback: A dynamic benchmark keeps adding items that models can't have seen. Shuffled choices leave the memorized question and answer intact, and new problems published in the same open set will be copied too.
