schema_version: 0.2-draft
lesson:
  id: benchmark-design-and-comparison
  version: 0.2.0-draft
  title: Build a test whose score supports the intended claim
  state: draft
  summary: Design a fair challenge for an assistant, then catch the shortcuts that make a leaderboard look better
    than the underlying skill.
  slot: M28.2
  category: learning
  sources:
  - title: Liang et al. — Holistic Evaluation of Language Models
    url: https://arxiv.org/abs/2211.09110
  - title: scikit-learn — common evaluation and preprocessing pitfalls
    url: https://scikit-learn.org/stable/common_pitfalls.html
  archetype: mechanism
objectives:
- id: objective.benchmark-design-and-comparison
  version: 2-draft
  statement: Specify benchmark tasks, sampling, scoring, resource conditions, and contamination checks before interpreting
    comparisons.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - benchmark-design-and-comparison.base.v2
  - benchmark-design-and-comparison.transfer.v2
  prerequisites:
  - anyOf:
    - objective.evaluation-metrics-and-uncertainty
  - anyOf:
    - objective.splits-and-leakage
scenes:
- id: benchmark-design-and-comparison.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.benchmark-design-and-comparison
  title: Build a challenge that matches the promise
  markdown: A **benchmark** is a defined set of tasks and rules for comparing systems. If a library assistant promises
    grounded answers, a benchmark of fluent writing alone misses the promise. Start with representative answerable
    questions, missing-information questions, conflicting sources, and appropriate tasks outside scope. Define success
    in observable terms. A benchmark is a sample of behavior under specified conditions, not a certificate that
    a system understands every possible question.
  text_mode: A **benchmark** is a defined set of tasks and rules for comparing systems. If a library assistant promises
    grounded answers, a benchmark of fluent writing alone misses the promise. Start with representative answerable
    questions, missing-information questions, conflicting sources, and appropriate tasks outside scope. Define success
    in observable terms. A benchmark is a sample of behavior under specified conditions, not a certificate that
    a system understands every possible question.
  bridges: []
- id: benchmark-design-and-comparison.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.benchmark-design-and-comparison
  title: Choose the cases before seeing the scores
  markdown: Suppose the challenge includes 20 opening-hours questions, 10 book-location questions, and 10 cases
    where the supplied information is insufficient. The proportions shape the aggregate score. If real use has many
    missing-information cases, a benchmark dominated by easy lookup questions may conceal the main difficulty. Record
    the source and sampling method, group related cases, and separate development from final evaluation. Do not
    quietly remove hard cases merely because current systems fail them.
  text_mode: Suppose the challenge includes 20 opening-hours questions, 10 book-location questions, and 10 cases
    where the supplied information is insufficient. The proportions shape the aggregate score. If real use has many
    missing-information cases, a benchmark dominated by easy lookup questions may conceal the main difficulty. Record
    the source and sampling method, group related cases, and separate development from final evaluation. Do not
    quietly remove hard cases merely because current systems fail them.
  bridges: []
- id: benchmark-design-and-comparison.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.benchmark-design-and-comparison
  title: Decide what counts as success
  markdown: For an answerable item, the rubric might require the correct fact and a supporting source passage. For
    an insufficient-information item, a justified request for clarification may be correct. **Exact match** compares
    a response to a specified string; it can reject valid paraphrases unless the task demands that exact format.
    A semantic or human rubric handles more variation but needs clear criteria and reliability checks. Save examples
    of both acceptable and unacceptable responses so scoring is inspectable.
  text_mode: For an answerable item, the rubric might require the correct fact and a supporting source passage.
    For an insufficient-information item, a justified request for clarification may be correct. **Exact match**
    compares a response to a specified string; it can reject valid paraphrases unless the task demands that exact
    format. A semantic or human rubric handles more variation but needs clear criteria and reliability checks. Save
    examples of both acceptable and unacceptable responses so scoring is inspectable.
  bridges: []
- id: benchmark-design-and-comparison.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.benchmark-design-and-comparison
  title: Control the surrounding system
  markdown: A model with tools, retrieval, multiple attempts, or a larger output budget is operating under different
    conditions from one without them. State prompts, templates, evidence access, sampling settings, retries, time
    limits, and resource costs. A **pass@k**-style result with several attempts should not be read as one-attempt
    reliability. The conditions are part of the claim. Model names and parameter counts alone do not specify the
    system being evaluated.
  text_mode: A model with tools, retrieval, multiple attempts, or a larger output budget is operating under different
    conditions from one without them. State prompts, templates, evidence access, sampling settings, retries, time
    limits, and resource costs. A **pass@k**-style result with several attempts should not be read as one-attempt
    reliability. The conditions are part of the claim. Model names and parameter counts alone do not specify the
    system being evaluated.
  bridges: []
- id: benchmark-design-and-comparison.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.benchmark-design-and-comparison
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: 'A benchmark is a measurement contract: cases, conditions, scoring, and limits. A rank without that
    contract is an incomplete story.'
- id: benchmark-design-and-comparison.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.benchmark-design-and-comparison
  markdown: Benchmarks need documented sampling, scoring, contamination controls, and statistical comparisons; repeated
    tuning and changing protocols limit what a leaderboard difference establishes.
  text_mode: Benchmarks need documented sampling, scoring, contamination controls, and statistical comparisons;
    repeated tuning and changing protocols limit what a leaderboard difference establishes.
- id: benchmark-design-and-comparison.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.benchmark-design-and-comparison
  title: Protect novelty and report uncertainty
  markdown: A model may have encountered a test item or a close variant during training or repeated development.
    Investigate contamination and use appropriately fresh or controlled cases where possible. Report how many independent
    cases were tested and inspect uncertainty and slice performance. A benchmark can become less informative as
    developers repeatedly optimize for it. A new spelling of a memorized question does not necessarily create a
    new independent test of the underlying ability.
  text_mode: A model may have encountered a test item or a close variant during training or repeated development.
    Investigate contamination and use appropriately fresh or controlled cases where possible. Report how many independent
    cases were tested and inspect uncertainty and slice performance. A benchmark can become less informative as
    developers repeatedly optimize for it. A new spelling of a memorized question does not necessarily create a
    new independent test of the underlying ability.
  bridges: []
- id: benchmark-design-and-comparison.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.benchmark-design-and-comparison
  title: Read a leaderboard like a careful judge
  markdown: Ask what the tasks cover, what they omit, how scoring works, and which system conditions produced the
    result. A rank difference can reflect small uncertain effects, different budgets, or strengths on different
    subsets. Keep a comparison table that includes limitations rather than collapsing everything into one winner.
    The memory cue is “cases, conditions, scoring, limits.” It turns a leaderboard from a shopping slogan into evidence
    that can support a specific decision.
  text_mode: Ask what the tasks cover, what they omit, how scoring works, and which system conditions produced the
    result. A rank difference can reflect small uncertain effects, different budgets, or strengths on different
    subsets. Keep a comparison table that includes limitations rather than collapsing everything into one winner.
    The memory cue is “cases, conditions, scoring, limits.” It turns a leaderboard from a shopping slogan into evidence
    that can support a specific decision.
  bridges: []
- id: benchmark-design-and-comparison.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.benchmark-design-and-comparison
  title: One attempt or several?
  markdown: System A succeeds on 70 of 100 tasks with one attempt each. System B succeeds on 85 with up to five
    attempts per task. What is missing from a claim that B is simply more reliable?
  text_mode: System A succeeds on 70 of 100 tasks with one attempt each. System B succeeds on 85 with up to five
    attempts per task. What is missing from a claim that B is simply more reliable?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: A comparison under matching attempt budgets.
    - id: b
      text: A comparison of parameter counts instead of attempt budgets.
    - id: c
      text: A score that keeps only each system’s easiest successful cases.
    answer: a
    reveal_markdown: The reported success rates use different opportunities to succeed. Compare under matching budgets
      and report the cost of retries.
    hint: Trace the example using the rule from the preceding pages.
    id: benchmark-design-and-comparison.practice.v2.7
