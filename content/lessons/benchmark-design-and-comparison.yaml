schema_version: 0.2-draft
lesson:
  id: benchmark-design-and-comparison
  version: 0.1.0-draft
  title: Build a test whose score supports the intended claim
  state: draft
  summary: Benchmarks need documented sampling, scoring, contamination controls, and statistical comparisons; repeated
    tuning and changing protocols limit what a leaderboard difference establishes.
  slot: M28.2
  category: learning
  minutes: 12
  sources:
  - title: HELM
    url: https://arxiv.org/abs/2211.09110
  - title: BIG-bench
    url: https://arxiv.org/abs/2206.04615
objectives:
- id: objective.benchmark-design-and-comparison
  version: 1-draft
  statement: Benchmarks need documented sampling, scoring, contamination controls, and statistical comparisons;
    repeated tuning and changing protocols limit what a leaderboard difference establishes.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - benchmark-design-and-comparison.base
  - benchmark-design-and-comparison.transfer
  prerequisites:
  - anyOf:
    - objective.evaluation-metrics-and-uncertainty
  - anyOf:
    - objective.splits-and-leakage
scenes:
- id: benchmark-design-and-comparison.s1
  title: Define the population behind the test
  type: explanation
  depth: intuition
  objective_refs:
  - objective.benchmark-design-and-comparison
  markdown: A benchmark samples tasks from some intended distribution. State languages, difficulty, time period,
    formats, and exclusions. A convenient collection of questions can be informative without representing all users
    or the complete capability named in its title.
  text_mode: A benchmark samples tasks from some intended distribution. State languages, difficulty, time period,
    formats, and exclusions. A convenient collection of questions can be informative without representing all users
    or the complete capability named in its title.
  bridges: []
- id: benchmark-design-and-comparison.s2
  title: Protect independence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.benchmark-design-and-comparison
  markdown: Training overlap, benchmark-specific tuning, and repeated prompt selection can inflate apparent generalization.
    Hold out final evaluation material where feasible and document contamination searches with their limits. A familiar
    public benchmark may measure a mixture of learning, memorization, and test-specific adaptation.
  text_mode: Training overlap, benchmark-specific tuning, and repeated prompt selection can inflate apparent generalization.
    Hold out final evaluation material where feasible and document contamination searches with their limits. A familiar
    public benchmark may measure a mixture of learning, memorization, and test-specific adaptation.
  bridges: []
- id: benchmark-design-and-comparison.s3
  title: Compare on matched conditions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.benchmark-design-and-comparison
  markdown: Use the same task versions, prompts, tools, output budgets, and scoring when claiming a controlled model
    comparison. Paired evaluation can reduce noise by comparing outcomes on the same items. A one-point difference
    without uncertainty may not justify a strong ranking claim.
  text_mode: Use the same task versions, prompts, tools, output budgets, and scoring when claiming a controlled
    model comparison. Paired evaluation can reduce noise by comparing outcomes on the same items. A one-point difference
    without uncertainty may not justify a strong ranking claim.
  bridges: []
- id: benchmark-design-and-comparison.s4
  title: Maintain versions and negative cases
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.benchmark-design-and-comparison
  markdown: Version the test set and scorer, preserve failures, and explain changes across releases. Include difficult
    and unanswerable cases when relevant. A benchmark is a measurement instrument that can become stale or exploited;
    updating it changes the meaning of longitudinal comparisons.
  text_mode: Version the test set and scorer, preserve failures, and explain changes across releases. Include difficult
    and unanswerable cases when relevant. A benchmark is a measurement instrument that can become stale or exploited;
    updating it changes the meaning of longitudinal comparisons.
  bridges: []
- id: benchmark-design-and-comparison.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.benchmark-design-and-comparison
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Benchmarks need documented sampling, scoring, contamination controls, and statistical comparisons; repeated
    tuning and changing protocols limit what a leaderboard difference establishes.
- id: benchmark-design-and-comparison.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.benchmark-design-and-comparison
  markdown: Benchmarks need documented sampling, scoring, contamination controls, and statistical comparisons; repeated
    tuning and changing protocols limit what a leaderboard difference establishes.
  text_mode: Benchmarks need documented sampling, scoring, contamination controls, and statistical comparisons;
    repeated tuning and changing protocols limit what a leaderboard difference establishes.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - benchmark-design-and-comparison.s1
    - benchmark-design-and-comparison.s2
    - benchmark-design-and-comparison.s3
    - benchmark-design-and-comparison.s4
    - benchmark-design-and-comparison.check
    gate_refs:
    - gate.core
  scene_aliases:
    benchmark-design-and-comparison.recap: benchmark-design-and-comparison.check
assessment_families:
- id: benchmark-design-and-comparison.base
  objective_ref: objective.benchmark-design-and-comparison
  task: base
  response_type: single_choice
  points: 1
  hint: 'Protect independence: trace the inputs, operation, and result before choosing.'
  remediation_scene: benchmark-design-and-comparison.s2
  variants:
  - id: benchmark-design-and-comparison.base.1
    prompt: Does a benchmark title prove representative coverage of its entire topic?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if it has many examples
    answer: a
    feedback: Sampling design determines coverage.
  - id: benchmark-design-and-comparison.base.2
    prompt: Why can repeated prompt tuning on the test set inflate results?
    options:
    - id: b
      text: Prompts cannot affect scores
    - id: c
      text: It guarantees better unseen generalization
    - id: a
      text: The evaluation becomes part of optimization
    answer: a
    feedback: Selection uses test feedback and weakens independence.
- id: benchmark-design-and-comparison.transfer
  objective_ref: objective.benchmark-design-and-comparison
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Maintain versions and negative cases: trace the inputs, operation, and result before choosing.'
  remediation_scene: benchmark-design-and-comparison.s4
  variants:
  - id: benchmark-design-and-comparison.transfer.1
    prompt: What helps compare two models with less item-sampling noise?
    options:
    - id: b
      text: Different undisclosed task sets
    - id: c
      text: Only rounded leaderboard ranks
    - id: a
      text: Paired outcomes on the same examples
    answer: a
    feedback: Pairing controls some example difficulty variation.
  - id: benchmark-design-and-comparison.transfer.2
    prompt: Why version the scoring code?
    options:
    - id: c
      text: Scores are independent of scoring rules
    - id: a
      text: Scorer changes can alter results without model changes
    - id: b
      text: Only to rename files
    answer: a
    feedback: The instrument is part of the experiment.
