lesson:
  id: vision-language-action-models
  version: 0.4.0-draft
  title: Connect visual instructions to a robot’s action interface
  state: draft
  summary: '"Put the chipped mug in the sink." To follow that, a robot needs web-scale knowledge and millimeter-scale motor control. See how RT-2, OpenVLA, and π0 turn a language model into a robot policy.'
  slot: M30.7
  category: learning
  sources:
    - title: "RT-2: Vision-Language-Action Models Transfer Web Knowledge to Robotic Control (Brohan et al., 2023)"
      url: https://arxiv.org/abs/2307.15818
    - title: "OpenVLA: An Open-Source Vision-Language-Action Model (Kim et al., 2024)"
      url: https://arxiv.org/abs/2406.09246
    - title: "π0: A Vision-Language-Action Flow Model for General Robot Control (Black et al., 2024)"
      url: https://arxiv.org/abs/2410.24164
    - title: "Open X-Embodiment: Robotic Learning Datasets and RT-X Models (2023)"
      url: https://arxiv.org/abs/2310.08864
objectives:
  - id: objective.vision-language-action-models
    version: 2-draft
    statement: Explain how a vision-language-action model turns images and an instruction into robot actions, convert continuous actions to and from 256-bin tokens, and compare token outputs (RT-2, OpenVLA) with a continuous flow-matching action head (π0) in precision, speed, and embodiment.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - vision-language-action-models.base.v2
      - vision-language-action-models.transfer.v2
      - vision-language-action-models.calculate
    prerequisites:
      - anyOf:
          - objective.vision-language-interfaces
      - anyOf:
          - objective.robot-imitation-learning
scenes:
  - id: vision-language-action-models.s1
    title: '"The chipped one, please"'
    type: explanation
    depth: intuition
    objective_refs:
      - objective.vision-language-action-models
    markdown: |-
      Tidy's imitation policy from two lessons ago can rack mugs beautifully. Now someone says: "Put the mug with the chipped rim in the sink, and leave the blue ones." Nothing in its demonstrations mentioned chips, sinks, or colors. It has motor skill but no idea what the words mean.

      A vision-language model, like those in the module on multimodal models, knows what a chipped rim looks like from billions of web images and captions, but it has never moved anything. A **vision-language-action model (VLA)** joins the two. It takes camera images and an instruction, and outputs robot actions. The usual recipe:

      1. Start from a pretrained vision-language model.
      2. Fine-tune it on robot demonstrations, where the "answer" to image + instruction is the action the demonstrator took.
      3. Run it in a loop: new camera frame, new action, many times a second.

      The name comes from **RT-2** (Brohan et al., Google DeepMind, 2023). Its web knowledge carried over to the robot in striking ways: asked to pick up an object that could serve as an improvised hammer, it picked up a rock.
    diagram:
      caption: A VLA in its control loop. Only the action output is new; the rest is a vision-language model.
      description: The instruction text goes down into the language-model backbone. Camera images go to a vision encoder, which sends image tokens to the backbone. The backbone produces action tokens, which a decoder turns into numbers such as gripper motion. The robot's controller executes them and the kitchen changes, and the camera captures the next image of the changed scene.
      nodes:
