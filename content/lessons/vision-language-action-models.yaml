assessment_families:
  - id: vision-language-action-models.base
    objective_ref: objective.vision-language-action-models
    task: base
    response_type: single_choice
    points: 1
    hint: 'Choose an action representation: trace the inputs, operation, and result before choosing.'
    remediation_scene: vision-language-action-models.s2
    variants:
      - id: vision-language-action-models.base.1
        prompt: What distinguishes a VLA output interface from ordinary text chat?
        options:
          - id: c
            text: It guarantees physical safety
          - id: a
            text: It produces actions interpretable by a robot controller
          - id: b
            text: It necessarily has no language input
        answer: a
        feedback: The system connects representations to motor commands.
        retired: true
      - id: vision-language-action-models.base.2
        prompt: Must all VLA actions be discrete tokens?
        options:
          - id: a
            text: No; continuous and other sequence representations exist
          - id: b
            text: 'Yes'
          - id: c
            text: Only if the model sees images
        answer: a
        feedback: Action-generation designs vary.
        retired: true
  - id: vision-language-action-models.transfer
    objective_ref: objective.vision-language-action-models
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate transfer honestly: trace the inputs, operation, and result before choosing.'
    remediation_scene: vision-language-action-models.s4
    variants:
      - id: vision-language-action-models.transfer.1
        prompt: Why can changing the gripper break performance?
        options:
          - id: a
            text: The embodiment and action-to-effect mapping changed
          - id: b
            text: Language tokens cannot mention cups
          - id: c
            text: The object color disappeared necessarily
        answer: a
        feedback: Motor behavior depends on body geometry and control semantics.
        retired: true
      - id: vision-language-action-models.transfer.2
        prompt: Does broad visual knowledge prove universal robot skill?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only with a large language model
          - id: a
            text: 'No'
        answer: a
        feedback: Physical action requires additional learned and engineered capabilities.
        retired: true
  - id: vision-language-action-models.base.v2
    objective_ref: objective.vision-language-action-models
    task: base
    response_type: single_choice
    points: 1
    hint: "Follow one action from the model's output to the motors: which values are tokens, how many are generated, and how they become numbers again."
    remediation_scene: vision-language-action-models.s2
    variants:
      - id: vision-language-action-models.base.v2.1
        prompt: How did RT-2 let a vision-language model output robot actions?
        options:
          - id: c
            text: It described each motion in English words such as "move left a bit"
          - id: a
            text: It split each action value into 256 bins and wrote the bin numbers as tokens
          - id: b
            text: It attached a separate regression head that predicts joint torques
        answer: a
        feedback: RT-2 discretized each action dimension into 256 bins and emitted the bin numbers as ordinary text tokens, so the language model's output layer needed no change. Plain-English motions would be too vague to control an arm, and RT-2 had no separate torque head.
      - id: vision-language-action-models.base.v2.2
        prompt: A VLA's action has 7 dimensions, each split into 256 bins, and all dimensions share the same bin tokens. How many tokens does one action take, and how many distinct action tokens does the vocabulary need?
        options:
          - id: b
            text: 7 tokens, drawn from 1,792 distinct action tokens
          - id: a
            text: 7 tokens, drawn from 256 distinct action tokens
          - id: c
            text: 256 tokens, drawn from 7 distinct action tokens
        answer: a
        feedback: Each of the 7 dimensions becomes one token, and because every dimension reuses the same 256 bin tokens, the vocabulary needs only 256. 7 × 256 = 1,792 would be needed only if each dimension had its own set.
      - id: vision-language-action-models.base.v2.3
        prompt: A token-based VLA generates 7 action tokens one at a time, and each forward pass takes 25 ms. What most limits how often it can act?
        options:
          - id: a
            text: Every token needs its own pass, so one action takes about 175 ms
          - id: b
            text: The camera can't deliver images faster than 7 frames per second
          - id: c
            text: The bins are too coarse to describe fast motions accurately
        answer: a
        feedback: Autoregressive decoding generates tokens sequentially, so 7 × 25 = 175 ms per action, under 6 actions a second. Bin width affects precision, not speed, and nothing here says the camera is slow.
      - id: vision-language-action-models.base.v2.4
        prompt: Why does π0 produce actions with a flow-matching action expert instead of bin tokens?
        options:
          - id: c
            text: Language-model tokens can't represent numbers at all
          - id: b
            text: Flow matching can learn actions without demonstrations
          - id: a
            text: It outputs continuous chunks quickly enough for 50 Hz control
        answer: a
        feedback: The action expert generates a whole chunk of continuous actions at once, avoiding bin rounding and slow token-by-token decoding, and it can represent several valid modes. RT-2 shows tokens can represent numbers, and π0 is still trained on demonstrations.
  - id: vision-language-action-models.transfer.v2
    objective_ref: objective.vision-language-action-models
    task: transfer
    response_type: single_choice
    points: 1
    hint: "Ask where each ability comes from: understanding comes from web-scale pretraining, motor skill from demonstrations on a particular body."
    remediation_scene: vision-language-action-models.s4
    variants:
      - id: vision-language-action-models.transfer.v2.1
        prompt: A VLA fine-tuned on a 7-joint arm with a two-finger gripper is moved to a different arm with a suction cup. It understands instructions but its motions are wrong. What should the team do?
        options:
          - id: b
            text: Rewrite the instructions in more precise language
          - id: a
            text: Collect demonstrations on the new arm and fine-tune
          - id: c
            text: Swap in a larger language backbone for the model
        answer: a
        feedback: The action tokens encode motions for the old body; on a new embodiment they mean something else. Demonstrations on the new arm teach the new mapping. Better wording or a bigger language model improves understanding, which wasn't the problem.
      - id: vision-language-action-models.transfer.v2.2
        prompt: Asked to "pick up something you could use as a hammer", a VLA picks up a rock, though no robot demonstration involved hammers. Where did that knowledge most likely come from?
        options:
          - id: a
            text: Pretraining of its vision-language model on web data
          - id: b
            text: Hidden hammering examples in the robot demonstrations
          - id: c
            text: The action tokenizer's choice of 256 bins per value
        answer: a
        feedback: This is the kind of transfer RT-2 reported. The idea that a rock can serve as a hammer comes from web-scale image and text data; the demonstrations supply the motor skill of picking things up. The tokenizer only formats actions.
      - id: vision-language-action-models.transfer.v2.3
        prompt: A team sets each action dimension's range from the min and max of its data. One glitchy demo recorded a 1 m jump, though typical moves are about 1 cm. With 256 bins, what goes wrong, and what is the fix?
        options:
          - id: c
            text: Nothing, since 256 bins are enough for any range
          - id: b
            text: Moves get clipped at 1 cm; add more demonstrations
          - id: a
            text: Bins become 7.8 mm wide; set ranges from percentiles
        answer: a
        feedback: A ±1 m range split into 256 bins gives 2 m / 256 ≈ 7.8 mm per bin, nearly as big as a typical move. OpenVLA sets ranges from the 1st to 99th percentiles so one outlier can't stretch them. More demos wouldn't shrink the stretched range.
      - id: vision-language-action-models.transfer.v2.4
        prompt: A startup posts a smooth video of its VLA clearing a table and says it "works in any kitchen". What evidence should you ask for first?
        options:
          - id: b
            text: The number of parameters in the model's language backbone
          - id: c
            text: How many web images its vision encoder was pretrained on
          - id: a
            text: Success rates over many trials in unseen kitchens
        answer: a
        feedback: A single video shows the task is possible, not how often it works. Repeated trials in unseen kitchens, with failures and every human intervention reported, measure the claim. Model size and pretraining data describe the model, not its success rate.
  - id: vision-language-action-models.calculate
    objective_ref: objective.vision-language-action-models
    task: base
    response_type: numeric
    points: 1
    hint: "Bin = floor(fraction of the range × 256), where fraction = (value − low) / (high − low). Tokens per second = dimensions × actions per second."
    remediation_scene: vision-language-action-models.s2
    absolute_tolerance: 0.5
    variants:
      - id: vision-language-action-models.calculate.1
        prompt: An action value ranges over [−0.02, 0.02] m, split into 256 bins numbered 0–255 (bin = floor(fraction × 256)). Which bin does dx = 0.005 m fall in?
        answer: 160
        feedback: "Fraction = (0.005 + 0.02) / 0.04 = 0.625, and 0.625 × 256 = 160, so bin 160."
      - id: vision-language-action-models.calculate.2
        prompt: A gripper opening ranges over [0, 1], split into 256 bins numbered 0–255 (bin = floor(fraction × 256)). Which bin does a half-open gripper, 0.5, fall in?
        answer: 128
        feedback: "Fraction = 0.5, and 0.5 × 256 = 128, so bin 128."
      - id: vision-language-action-models.calculate.3
        prompt: A yaw change ranges over [−0.1, 0.1] rad, split into 256 bins numbered 0–255 (bin = floor(fraction × 256)). Which bin does −0.07 rad fall in?
        answer: 38
        feedback: "Fraction = (−0.07 + 0.1) / 0.2 = 0.15, and 0.15 × 256 = 38.4, which rounds down to bin 38."
      - id: vision-language-action-models.calculate.4
        prompt: An action value ranges over [−0.02, 0.02] m, split into 256 bins numbered 0–255 (bin = floor(fraction × 256)). Which bin does 0.019 m fall in?
        answer: 249
        feedback: "Fraction = (0.019 + 0.02) / 0.04 = 0.975, and 0.975 × 256 = 249.6, which rounds down to bin 249."
      - id: vision-language-action-models.calculate.5
        prompt: A VLA writes each 7-dimensional action as 7 tokens and acts 5 times per second. How many action tokens must it generate per second?
        answer: 35
        feedback: "7 tokens per action × 5 actions per second = 35 tokens per second."
      - id: vision-language-action-models.calculate.6
        prompt: A token-based VLA outputs a 2-second chunk of 7-dimensional actions at 10 actions per second, one token per dimension. How many tokens is the chunk?
        answer: 140
        feedback: "2 s × 10 actions/s = 20 actions, and 20 × 7 tokens = 140 tokens."
