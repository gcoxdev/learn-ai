schema_version: 0.2-draft
lesson:
  id: vision-language-action-models
  version: 0.1.0-draft
  title: Connect visual instructions to a robot’s action interface
  state: draft
  summary: Vision-language-action systems condition action generation on observations and instructions; discrete
    or continuous action representations, embodiment adaptation, and feedback determine executable behavior.
  slot: M30.7
  category: learning
  minutes: 12
  sources:
  - title: RT-2
    url: https://arxiv.org/abs/2307.15818
  - title: OpenVLA
    url: https://arxiv.org/abs/2406.09246
  - title: Diffusion Policy
    url: https://arxiv.org/abs/2303.04137
objectives:
- id: objective.vision-language-action-models
  version: 1-draft
  statement: Vision-language-action systems condition action generation on observations and instructions; discrete
    or continuous action representations, embodiment adaptation, and feedback determine executable behavior.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - vision-language-action-models.base
  - vision-language-action-models.transfer
  prerequisites:
  - anyOf:
    - objective.vision-language-interfaces
  - anyOf:
    - objective.robot-imitation-learning
scenes:
- id: vision-language-action-models.s1
  title: Add an action output to perception and language
  type: explanation
  depth: intuition
  objective_refs:
  - objective.vision-language-action-models
  markdown: A VLA model uses visual observations and language instructions to produce robot actions. Pretrained
    representations may provide useful object or task knowledge, while robot demonstrations connect that knowledge
    to a specific body and control interface. Language understanding alone does not establish motor skill.
  text_mode: A VLA model uses visual observations and language instructions to produce robot actions. Pretrained
    representations may provide useful object or task knowledge, while robot demonstrations connect that knowledge
    to a specific body and control interface. Language understanding alone does not establish motor skill.
  bridges: []
- id: vision-language-action-models.s2
  title: Choose an action representation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vision-language-action-models
  markdown: One design discretizes continuous action components into tokens; another predicts continuous vectors
    or generates action sequences through diffusion or flow methods. Resolution, horizon, units, and control frequency
    affect accuracy and latency. The final controller must interpret outputs under the correct embodiment conventions.
  text_mode: One design discretizes continuous action components into tokens; another predicts continuous vectors
    or generates action sequences through diffusion or flow methods. Resolution, horizon, units, and control frequency
    affect accuracy and latency. The final controller must interpret outputs under the correct embodiment conventions.
  bridges: []
- id: vision-language-action-models.s3
  title: Trace a pick instruction
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vision-language-action-models
  markdown: “Pick up the red cup” requires identifying the cup, estimating an actionable relation, choosing a feasible
    grasp or trajectory, and responding to feedback. An unseen gripper or camera placement can break the learned
    mapping even when the phrase and object are familiar.
  text_mode: “Pick up the red cup” requires identifying the cup, estimating an actionable relation, choosing a feasible
    grasp or trajectory, and responding to feedback. An unseen gripper or camera placement can break the learned
    mapping even when the phrase and object are familiar.
  bridges: []
- id: vision-language-action-models.s4
  title: Evaluate transfer honestly
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vision-language-action-models
  markdown: Test new objects, instructions, scenes, and robot configurations with controlled protocols. Report training
    data, action space, success criteria, latency, and interventions. Broad visual-language knowledge can help generalization
    without making a policy universally capable across bodies or safe around arbitrary surroundings.
  text_mode: Test new objects, instructions, scenes, and robot configurations with controlled protocols. Report
    training data, action space, success criteria, latency, and interventions. Broad visual-language knowledge can
    help generalization without making a policy universally capable across bodies or safe around arbitrary surroundings.
  bridges: []
- id: vision-language-action-models.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.vision-language-action-models
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Vision-language-action systems condition action generation on observations and instructions; discrete
    or continuous action representations, embodiment adaptation, and feedback determine executable behavior.
- id: vision-language-action-models.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.vision-language-action-models
  markdown: Vision-language-action systems condition action generation on observations and instructions; discrete
    or continuous action representations, embodiment adaptation, and feedback determine executable behavior.
  text_mode: Vision-language-action systems condition action generation on observations and instructions; discrete
    or continuous action representations, embodiment adaptation, and feedback determine executable behavior.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - vision-language-action-models.s1
    - vision-language-action-models.s2
    - vision-language-action-models.s3
    - vision-language-action-models.s4
    - vision-language-action-models.check
    gate_refs:
