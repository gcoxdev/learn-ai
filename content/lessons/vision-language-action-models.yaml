  - id: vision-language-action-models.s2
    title: Write actions as words
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.vision-language-action-models
    markdown: |-
      A language model outputs tokens, one at a time. So RT-2 made actions into tokens. Each continuous action value is chopped into 256 equal **bins**, and the bin number is written out as a token. RT-2 writes each action as 8 tokens: one for a "done" flag, plus binned values for moving the gripper (three), turning it (three), and opening or closing it (one).

      Take Tidy's 7-D action: move $(dx, dy, dz)$, turn (roll, pitch, yaw), and gripper opening. Say $dx$ ranges over $[-0.02, +0.02]$ m per step, and Tidy wants $dx = 0.012$:

      1. Fraction of the range: $(0.012 - (-0.02)) / 0.04 = 0.8$.
      2. Bin: $\lfloor 0.8 \times 256 \rfloor = \lfloor 204.8 \rfloor = 204$. The token is "204".
      3. Decode to the bin's center: $-0.02 + 204.5 \times \frac{0.04}{256} = 0.011953$ m.

      Each bin is $0.04 / 256 = 0.156$ mm wide, so the rounding error is at most 0.078 mm. One action costs 7 tokens, and the same 256 bin tokens are reused for every dimension.

      ```python run
      import numpy as np

      BINS = 256
      # Tidy's 7-D action: move (dx, dy, dz) in m, turn (roll, pitch, yaw) in rad, gripper opening 0..1
      low  = np.array([-0.02, -0.02, -0.02, -0.1, -0.1, -0.1, 0.0])
      high = np.array([ 0.02,  0.02,  0.02,  0.1,  0.1,  0.1, 1.0])

      def to_tokens(action):
          frac = (action - low) / (high - low)                     # 0..1 across each range
          return np.clip((frac * BINS).astype(int), 0, BINS - 1)  # bin index 0..255

      def from_tokens(tokens):
          return low + (tokens + 0.5) * (high - low) / BINS        # center of each bin

      action = np.array([0.012, -0.005, 0.0, 0.0, 0.03, -0.07, 1.0])
      tokens = to_tokens(action)
      print("action tokens:", tokens.tolist())
      print("decoded:      ", from_tokens(tokens).round(5).tolist())
      print(f"worst rounding error in dx: {(high[0] - low[0]) / BINS / 2 * 1000:.3f} mm")
      ```

      :::predict Look at dz = 0.0 in the output. Does "stay still" survive the round trip?
      Not quite: 0.0 lands in bin 128, whose center is $+0.00008$ m. With an even number of bins, zero sits on a bin edge, so "don't move" decodes as a tiny drift of 0.08 mm per step. An odd number of bins would give zero a bin center of its own.
      :::

      Set `BINS = 16` and rerun: the worst dx error grows to 1.25 mm on every step.
    bridges: []
  - id: vision-language-action-models.s3
    title: "OpenVLA: an open 7B robot brain"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.vision-language-action-models
    markdown: |-
      RT-2's largest version had 55 billion parameters and was never released. **OpenVLA** (Kim et al., 2024) is an openly released 7-billion-parameter VLA built on the Llama 2 7B language model, with a vision encoder that combines two pretrained image models (SigLIP and DINOv2). It was trained on about 970,000 robot episodes from the Open X-Embodiment collection, and in its authors' tests it outperformed the 55B RT-2-X on success rate.

      It follows the same token recipe as Tidy's, 7 dimensions × 256 bins, with two practical twists:

      - It **reuses tokens**: the 256 least-used tokens in Llama's vocabulary are reassigned to mean bins 0–255.
      - It sets each dimension's range from the 1st to the 99th percentile of the training actions, not the min and max. One glitchy demo with a 1 m jump would otherwise stretch a $\pm$1 m range over 256 bins, making each bin 7.8 mm wide.

      Tokens have a speed cost. The model generates them one at a time, each needing a pass through all 7 billion parameters. If one pass takes 25 ms, an action takes $7 \times 25 = 175$ ms, fewer than 6 actions per second. That's fine for slow pick-and-place, but not for catching a sliding mug.
    bridges: []
  - id: vision-language-action-models.pi0
    title: "π0: skip the tokens for the fast part"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.vision-language-action-models
    markdown: |-
      **π0** (Black et al., Physical Intelligence, 2024) keeps a vision-language model for understanding (PaliGemma, with about 3 billion parameters) but hands the motor output to a separate, smaller network of about 300 million parameters, an **action expert**. The expert produces continuous numbers directly, in chunks of 50 future actions, fast enough for control at up to 50 Hz. The team showed it on dexterous tasks such as folding laundry.

      The expert is trained with **flow matching**, from the lesson on learning a velocity field: start from random noise and follow a learned velocity field to a realistic action chunk. As with Diffusion Policy, different noise gives different valid chunks, so two ways around the fruit bowl stay two ways, not one average.

      :::papers Flow matching for an action chunk
      With a demonstrated chunk $A$, noise $\epsilon$, and a time $\tau \in [0, 1]$, mix them as $A^\tau = \tau A + (1 - \tau)\,\epsilon$ and train the velocity network $v_\theta$ to point from noise to data:

      $$\mathcal{L} = \big\| v_\theta(A^\tau, o, \tau) - (A - \epsilon) \big\|^2$$

      $o$ is the observation: images, instruction, and joint angles. To act, start at pure noise ($\tau = 0$) and take a few Euler steps along $v_\theta$ up to $\tau = 1$. The result is 50 continuous actions, with no bins and no 0.078 mm rounding.
      :::

      So the two designs trade off. Tokens reuse the language model unchanged and are simple to train; a continuous action head is more precise and faster, at the cost of a second network.
    bridges: []
  - id: vision-language-action-models.s4
    title: A new body needs new data
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.vision-language-action-models
    markdown: |-
      Token 204 means "+12 mm along x" only for the robot whose data defined the bins. On an arm with longer links, a suction cup, or a camera mounted elsewhere, the same token means something else. This is the **embodiment** problem again, and it's why the Open X-Embodiment project pooled data from 22 different kinds of robots: a model that has seen many bodies adapts faster to a new one. Adapting still takes demonstrations on the new robot.

      When you read a VLA result, look for the robot, the number of trials, how new the objects and scenes were, and how often a person stepped in. A single smooth video shows what's possible, not how often it happens.
    bridges: []
  - id: vision-language-action-models.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.vision-language-action-models
    markdown: Turn continuous actions into bin tokens and count tokens per second, then advise a team moving a VLA to a new gripper, one whose bins are too coarse, and one judging a demo video.
    takeaway: |-
      A VLA is a vision-language model fine-tuned to output actions. RT-2 and OpenVLA write each action as 7–8 bin tokens; π0 adds a flow-matching action expert for fast, continuous chunks. Either way, the actions only mean something for the body they were trained on.
  - id: vision-language-action-models.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.vision-language-action-models
    markdown: |-
      A VLA connects observations and instructions to robot actions. Its outputs need the right units, body conventions, timing, and feedback to become useful movement.
