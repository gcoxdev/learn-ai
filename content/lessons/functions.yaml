schema_version: 0.2-draft
lesson:
  id: functions
  version: 0.3.0-draft
  title: A function is a rule
  state: draft
  summary: A photo goes in, "cat" comes out. Every AI model is a function. Learn to read f(x), work one out, and see the same rule as a table and a graph.
  slot: B03
  category: bridge
  sources:
    - title: Dive into Deep Learning — linear regression
      url: https://d2l.ai/chapter_linear-regression/linear-regression.html
  archetype: foundation
objectives:
  - id: objective.functions
    version: 4-draft
    statement: Read f(x) notation, work out a function's output for a given input, and connect the same rule to a table and a graph.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - functions.base.v3
      - functions.transfer.v3
    prerequisites:
      - anyOf:
          - objective.arithmetic
scenes:
  - id: functions.s1
    title: A machine that always does the same thing
    type: explanation
    depth: intuition
    objective_refs:
      - objective.functions
    markdown: |-
      Picture a machine with a slot on each side. Drop in 3 and out comes 6. Drop in 5 and out comes 10. It doubles whatever you give it, every time.

      A **function** is a rule like that: for each input it gives exactly one output. The inputs it accepts matter too. A rule about guest counts takes 0, 1, 2 and so on, not "Tuesday."

      **Why AI needs this:** every model is a function. A photo goes in and a label comes out; a sentence goes in and a next word comes out. Training, in the lesson "How does a model improve a prediction?", adjusts the rule so its outputs get closer to the right answers.
  - id: functions.s2
    title: Read f(x) aloud
    type: explanation
    depth: intuition
    objective_refs:
      - objective.functions
    markdown: |-
      Write the doubling machine as f(x) = 2x and read it "f of x equals two x."

      | Part | Meaning |
      | --- | --- |
      | f | the function's name (any letter works: g, h, L) |
      | x | the input, a placeholder for whatever you put in |
      | f(3) | the output when the input is 3 |
      | 2x | the rule: 2 × x |

      :::mixup "f(x) means f times x."
      Here the parentheses hold the input; they don't mean multiply. f(3) is "the output of f when you feed it 3," which is 6. There's no number called f to multiply by.
      :::
    bridges:
      - arithmetic
  - id: functions.s3
    title: Substitute one value at a time
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.functions
    markdown: |-
      To find an output, **substitute**: replace x with the input everywhere it appears, then calculate. Three examples, each a little harder:

      1. **Doubling.** f(x) = 2x, so f(4) = 2 × 4 = 8.
      2. **Delivery fee.** A courier charges 32 dollars plus 1.8 dollars per mile: F(d) = 1.8d + 32. For 20 miles, F(20) = 1.8 × 20 + 32 = 36 + 32 = 68 dollars.
      3. **A square and a negative.** g(x) = x² − 1, so g(−3) = (−3)² − 1 = 9 − 1 = 8.

      Different rules give different outputs for the same input: f(3) = 6, but g(3) = 8. That's why you always say which rule you're using.
    bridges: []
  - id: functions.s4
    title: A table shows some examples of the rule
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.functions
    markdown: |-
      List inputs and outputs side by side and you get a table. Here's the delivery-fee rule:

      | Distance d (miles) | Fee F(d) (dollars) |
      | ---: | ---: |
      | 0 | 32 |
      | 10 | 50 |
      | 20 | 68 |
      | 30 | 86 |

      A table shows a few examples, but it doesn't always pin the rule down.

      :::predict Two rules both fit the rows (0, 0) and (2, 4): f(x) = 2x and g(x) = x². What does each one say for x = 3?
      f(3) = 6, but g(3) = 9. Both rules match every row you were given, yet they disagree on a new input. This is the central puzzle of machine learning: many rules fit the training examples, and only testing on new examples shows which rule keeps working.
      :::
    bridges: []
  - id: functions.s5
    title: A graph turns the table into a picture
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.functions
    markdown: |-
      Draw a horizontal line for the input and a vertical line for the output. These lines are the **axes**. Each row of the table becomes a point: for (10, 50), go 10 across and 50 up.

      The delivery-fee points fall on a straight line. Each step of 10 across raises the output by 18, so each extra mile adds 1.8 dollars. That rate, output change per unit of input change, is the **slope**. For f(x) = 2x the slope is 2.

      Later you'll see graphs with a model's weight across the bottom and its error up the side. The lowest point on that curve marks the best weight, and the slope tells training which way is downhill.
    bridges: []
  - id: functions.s6
    title: A model is a rule with a dial
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.functions
    markdown: |-
      A simple model is f(x) = w × x, where the **weight** w is an adjustable number. With w = 2, f(3) = 6; with w = 4, f(3) = 12. Changing x asks the same rule about a new input. Changing w changes the rule itself.

      The error is a function too, but of the *weight*. Take one example with input 2 and target 6. The squared error is L(w) = (2w − 6)², where L stands for **loss**, the score training tries to push down. Run this to list the loss for five weights:

      ```python run
      x, y = 2, 6                       # one example: input 2, target 6

      def model(w, x):
          return w * x                  # the rule, with an adjustable weight w

      def loss(w):
          return (model(w, x) - y) ** 2 # squared error, as a function of w

      for w in [0, 1, 2, 3, 4]:
          print(f"w = {w}: prediction {model(w, x)}, loss {loss(w)}")
      ```

      The loss falls 36, 16, 4, then hits 0 at w = 3 and rises again. Try adding 2.5 and 3.5 to the list: both give a loss of 1. The lesson "How does a model improve a prediction?" uses this exact example to show how training finds w = 3 without trying every value.
    bridges: []
  - id: functions.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.functions
    markdown: Work out outputs for new rules, then decide what changed when a spam filter, a thermometer, and a loss curve behave differently.
    takeaway: |-
      A function turns each input into one output by a fixed rule. To use it, substitute the input; to change the model, change the rule's weights.
  - id: functions.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.functions
    markdown: |-
      A function maps inputs to outputs. Read its rule, substitute values, and connect an input-output table to a graph.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - functions.s1
        - functions.s2
        - functions.s3
        - functions.s4
        - functions.s5
        - functions.s6
        - functions.check
      gate_refs:
        - gate.core
  scene_aliases:
    functions.recap: functions.check
assessment_families:
  - id: functions.base
    objective_ref: objective.functions
    task: base
    response_type: single_choice
    points: 1
    hint: A function maps inputs to outputs. Read its rule, substitute values, and connect an input-output table to a graph.
    variants:
      - id: functions.base.1
        prompt: If f(x) = 2x, what is f(3)?
        options:
          - id: correct
            text: '6'
          - id: a
            text: '5'
          - id: b
            text: '9'
        answer: correct
        feedback: 'Substitute 3 for x: f(3)=2×3=6.'
        retired: true
      - id: functions.base.2
        prompt: In prediction = w × x, which symbol is the adjustable weight?
        options:
          - id: a
            text: x
          - id: b
            text: The multiplication sign
          - id: correct
            text: w
        answer: correct
        feedback: w selects the rule while x supplies the example input.
        retired: true
  - id: functions.transfer
    objective_ref: objective.functions
    task: transfer
    response_type: single_choice
    points: 1
    hint: A function maps inputs to outputs. Read its rule, substitute values, and connect an input-output table to a graph.
    variants:
      - id: functions.transfer.1
        prompt: On a loss-versus-weight graph, what does moving horizontally change?
        options:
          - id: a
            text: The target label automatically.
          - id: b
            text: The number of training examples.
          - id: correct
            text: The weight.
        answer: correct
        feedback: The weight.
        retired: true
      - id: functions.transfer.2
        prompt: What does (wx − y)² mean?
        options:
          - id: b
            text: Multiply the weight by a squared input and ignore the target.
          - id: correct
            text: Square the difference between prediction and target.
          - id: a
            text: Subtract the squared target from the prediction.
        answer: correct
        feedback: Square the difference between prediction and target.
        retired: true
  - id: functions.base.v2
    objective_ref: objective.functions
    task: base
    response_type: numeric
    points: 1
    hint: Replace x with the input, then multiply before you add.
    remediation_scene: functions.s3
    variants:
      - id: functions.base.v2.1
        retired: true
        prompt: For f(x)=3 × x, calculate f(4).
        answer: 12
        feedback: 'Replace x with 4 and multiply: 3×4=12.'
      - id: functions.base.v2.2
        retired: true
        prompt: For f(x)=x+5, calculate f(2).
        answer: 7
        feedback: Substitute 2, then add 5.
      - id: functions.base.v2.3
        retired: true
        prompt: For f(x)=2 × x, calculate f(6).
        answer: 12
        feedback: Six groups of two give twelve.
      - id: functions.base.v2.4
        retired: true
        prompt: For f(x)=4 × x+1, calculate f(2).
        answer: 9
        feedback: 'Multiply first: 4×2=8, then add one.'
    absolute_tolerance: 1e-6
  - id: functions.transfer.v2
    objective_ref: objective.functions
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask which part changed, the rule (its weight) or the input you gave it.
    remediation_scene: functions.s6
    variants:
      - id: functions.transfer.v2.1
        retired: true
        prompt: In f(x)=w × x, w stays fixed while x changes. What is happening?
        answer: a
        feedback: x names the input; the multiplier w was kept fixed.
        options:
          - id: b
            text: The function receives a different multiplier
          - id: c
            text: The recorded target changes the rule
          - id: a
            text: The same rule receives a different input
      - id: functions.transfer.v2.2
        retired: true
        prompt: A table lists outputs for inputs 1, 2, and 3. What can it establish without an additional rule?
        answer: a
        feedback: A finite table does not uniquely identify all other behavior.
        options:
          - id: c
            text: The particular procedure used to create it
          - id: a
            text: The listed results for those three inputs
          - id: b
            text: The result for each unlisted input as well
      - id: functions.transfer.v2.3
        retired: true
        prompt: What does f(5) mean in this notation?
        answer: a
        feedback: Parentheses supply an argument to the named function.
        options:
          - id: a
            text: The function’s output for input five
          - id: b
            text: The product of a number f and five
          - id: c
            text: The fifth version of the written rule
      - id: functions.transfer.v2.4
        retired: true
        prompt: The rule changes from f(x)=2x to f(x)=4x while x=3. What changed?
        answer: a
        feedback: The coefficient changed, so the same input now produces a different result.
        options:
          - id: b
            text: The supplied input
          - id: c
            text: The name of the input variable
          - id: a
            text: The rule’s multiplier
  - id: functions.base.v3
    objective_ref: objective.functions
    task: base
    response_type: numeric
    points: 1
    hint: Replace every x (or c, t, w) with the input, work out any parentheses and squares, then multiply before you add or subtract.
    remediation_scene: functions.s3
    absolute_tolerance: 1e-6
    variants:
      - id: functions.base.v3.1
        prompt: A delivery fee in dollars is F(d) = 1.8d + 32, where d is miles. Calculate F(25).
        answer: 77
        feedback: 1.8 × 25 = 45, and 45 + 32 = 77. Adding first, 1.8 × 57, gives 102.6, which breaks multiply-first.
      - id: functions.base.v3.2
        prompt: For f(x) = 3x − 4, calculate f(5).
        answer: 11
        feedback: Substitute 5 for x, so 3 × 5 − 4 = 15 − 4 = 11. Reading 3x as 35 or as 3 + 5 are the usual slips.
      - id: functions.base.v3.3
        prompt: For g(x) = x² + 1, calculate g(−3).
        answer: 10
        feedback: (−3)² = 9 because a negative times a negative is positive, and 9 + 1 = 10. Treating −3² as −9 gives −8.
      - id: functions.base.v3.4
        prompt: A phone battery rule is h(t) = 10 − 2t, the hours left after t hours of video. Calculate h(4).
        answer: 2
        feedback: 2 × 4 = 8, and 10 − 8 = 2 hours left. Subtracting first, (10 − 2) × 4, gives 32.
      - id: functions.base.v3.5
        prompt: For f(x) = 0.5x + 3, calculate f(−2).
        answer: 2
        feedback: 0.5 × (−2) = −1, and −1 + 3 = 2. Dropping the minus sign gives 1 + 3 = 4.
      - id: functions.base.v3.6
        prompt: A loss function is L(w) = (2w − 6)². Calculate L(1).
        answer: 16
        feedback: Inside the parentheses, 2 × 1 − 6 = −4, and (−4)² = 16. Squaring the pieces separately, 2² − 6², gives −32, which a squared error can never be.
  - id: functions.transfer.v3
    objective_ref: objective.functions
    task: transfer
    response_type: single_choice
    points: 1
    hint: Separate the three parts, the rule, the input you feed it, and the output it returns, then ask which one the situation is about.
    remediation_scene: functions.s4
    variants:
      - id: functions.transfer.v3.1
        prompt: A spam filter computes score = f(email) with a rule that multiplies word counts by weights. An engineer lowers the weight on the word "free" and reruns yesterday's emails. What changed?
        options:
          - id: b
            text: The inputs, since each email now counts "free" differently
          - id: a
            text: The rule, so the same emails can now get new scores
          - id: c
            text: Only the outputs, since the rule and emails stay the same
        answer: a
        feedback: A weight is part of the rule, so changing it changes f itself; the emails (inputs) are exactly the same. New outputs are a result of the new rule, not a separate change.
      - id: functions.transfer.v3.2
        prompt: A sensor log shows the pairs (1, 3), (2, 5), and (3, 7). Which rule fits every row?
        options:
          - id: c
            text: f(x) = x + 2
          - id: b
            text: f(x) = 3x
          - id: a
            text: f(x) = 2x + 1
        answer: a
        feedback: 2 × 1 + 1 = 3, 2 × 2 + 1 = 5, and 2 × 3 + 1 = 7. The other two rules fit only the first row, (1, 3), so always check every row.
      - id: functions.transfer.v3.3
        prompt: On a graph of the rule F(c) = 1.8c + 32, you move from c = 10 to c = 20. How much does F rise?
        options:
          - id: a
            text: '18'
          - id: b
            text: '10'
          - id: c
            text: '50'
        answer: a
        feedback: The slope is 1.8 per degree, so 10 degrees adds 18 (F goes from 50 to 68). Rising by 10 copies the input step, and 50 is F(10) itself, not the change.
      - id: functions.transfer.v3.4
        prompt: A training report says "L(3) = 0," where L is the loss as a function of the weight w. What does this tell you?
        options:
          - id: c
            text: The loss multiplied by 3 equals zero
          - id: a
            text: With the weight set to 3, the loss is zero
          - id: b
            text: The third loss value in a list is zero
        answer: a
        feedback: L(3) is the output of the loss function when its input, the weight, is 3. The parentheses hold the input; they aren't multiplication or a position in a list.
      - id: functions.transfer.v3.5
        prompt: Two models both match the training rows (0, 0) and (2, 4). One is f(x) = 2x and the other is g(x) = x². What do they predict for x = 3?
        options:
          - id: b
            text: Both predict 6, since they agree on the training rows
          - id: c
            text: Both predict 9, since squaring is the more complex rule
          - id: a
            text: f predicts 6 and g predicts 9, so they disagree on new inputs
        answer: a
        feedback: Substituting gives 2 × 3 = 6 and 3² = 9. Agreeing on known rows doesn't make two rules the same elsewhere, which is why models are tested on new examples.
        retired: true
      - id: functions.transfer.v3.6
        prompt: A plant's height log has two rows, (0 weeks, 1 inch) and (1 week, 2 inches). One model is f(x) = x + 1 and another is g(x) = x² + 1. What do they predict for week 3?
        options:
          - id: c
            text: Both predict 4 inches, since they agree on the logged rows
          - id: b
            text: f predicts 4 inches and g predicts 10 inches, so they disagree
          - id: a
            text: Both predict 10 inches, since squaring grows faster
        answer: b
        feedback: Both rules fit the log (0 + 1 = 1, 1 + 1 = 2, and 0² + 1 = 1, 1² + 1 = 2), but at week 3 they give 3 + 1 = 4 and 3² + 1 = 10. Matching the known rows doesn't make two rules agree on a new input, so check predictions on new data.
