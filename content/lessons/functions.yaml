schema_version: 0.2-draft
lesson:
  id: functions
  version: 0.2.0-draft
  title: A function is a rule
  state: draft
  summary: Follow a simple rule from an input to an output, then read the same rule as words, symbols, a table,
    and a graph.
  slot: B03
  category: bridge
  sources:
  - title: Dive into Deep Learning — linear regression
    url: https://d2l.ai/chapter_linear-regression/linear-regression.html
  archetype: foundation
objectives:
- id: objective.functions
  version: 2-draft
  statement: A function maps inputs to outputs. Read its rule, substitute values, and connect an input-output table
    to a graph.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - functions.base.v2
  - functions.transfer.v2
  prerequisites:
  - anyOf:
    - objective.arithmetic
scenes:
- id: functions.s1
  title: Start with a repeatable rule
  type: explanation
  depth: intuition
  objective_refs:
  - objective.functions
  markdown: 'Imagine a machine that doubles the number you give it. Put in three and get six; put in five and get
    ten. A **function** is a rule that assigns one output to each allowed input. We are studying the rule, not claiming
    the machine learns or thinks. “Allowed” matters: a rule about guest counts might allow whole numbers starting
    at zero, rather than words such as Tuesday.'
  text_mode: 'Imagine a machine that doubles the number you give it. Put in three and get six; put in five and get
    ten. A **function** is a rule that assigns one output to each allowed input. We are studying the rule, not claiming
    the machine learns or thinks. “Allowed” matters: a rule about guest counts might allow whole numbers starting
    at zero, rather than words such as Tuesday.'
  bridges: []
- id: functions.s2
  title: Letters stand for places in the rule
  type: explanation
  depth: intuition
  objective_refs:
  - objective.functions
  markdown: 'The letter x can stand for the input, whatever number we choose to put there. A letter used this way
    is a **variable**. Write the doubling rule as f(x) = 2 × x. Say it aloud: “f of x equals two times x.” The name
    f identifies the function; the parentheses hold its input. f(x) does not mean f multiplied by x. The notation
    simply saves us repeating “the output of the doubling rule for this input.”'
  text_mode: 'The letter x can stand for the input, whatever number we choose to put there. A letter used this way
    is a **variable**. Write the doubling rule as f(x) = 2 × x. Say it aloud: “f of x equals two times x.” The name
    f identifies the function; the parentheses hold its input. f(x) does not mean f multiplied by x. The notation
    simply saves us repeating “the output of the doubling rule for this input.”'
  bridges:
  - arithmetic
- id: functions.s3
  title: Substitute one value at a time
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.functions
  markdown: 'To **substitute** is to put a value into a named place. For f(3), replace x with 3: 2 × 3 = 6. Therefore
    f(3) = 6. For f(4), calculate 2 × 4 = 8. Keep the same rule while changing the input. A second function g(x)
    = x + 2 would give g(3) = 5. The same input can lead to different results under different rules, which is why
    we must say which rule we are using.'
  text_mode: 'To **substitute** is to put a value into a named place. For f(3), replace x with 3: 2 × 3 = 6. Therefore
    f(3) = 6. For f(4), calculate 2 × 4 = 8. Keep the same rule while changing the input. A second function g(x)
    = x + 2 would give g(3) = 5. The same input can lead to different results under different rules, which is why
    we must say which rule we are using.'
  bridges: []
- id: functions.s4
  title: A table lists some examples
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.functions
  markdown: Make two columns, input and output. For the doubling rule, the rows are (0,0), (1,2), (2,4), and (3,6),
    where each pair means input first, output second. These rows show some examples of the rule. A table with only
    a few rows does not uniquely determine the rule for every other input; several rules can agree on the observed
    rows and differ elsewhere. Here we know the rule because we specified it explicitly.
  text_mode: Make two columns, input and output. For the doubling rule, the rows are (0,0), (1,2), (2,4), and (3,6),
    where each pair means input first, output second. These rows show some examples of the rule. A table with only
    a few rows does not uniquely determine the rule for every other input; several rules can agree on the observed
    rows and differ elsewhere. Here we know the rule because we specified it explicitly.
  bridges: []
- id: functions.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.functions
  markdown: Use two different examples to check your understanding. Hints are available for practice. A later, fresh
    answer without hints can demonstrate personal-study mastery.
  text_mode: Labeled radio options and a submit button; no timing requirement.
  takeaway: A function gives one output for each allowed input under its rule. The rule, its input, and its output
    are different things.
- id: functions.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.functions
  markdown: A function maps inputs to outputs. Read its rule, substitute values, and connect an input-output table
    to a graph.
  text_mode: A function maps inputs to outputs. Read its rule, substitute values, and connect an input-output table
    to a graph.
- id: functions.s5
  title: A graph puts those pairs on a picture
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.functions
  markdown: Draw one horizontal line for the input and one vertical line for the output. These are **axes**. To
    mark (3,6), move three units across and six up. Do the same for the other pairs. The straight arrangement shows
    that each extra input unit adds two output units. The rate of output change per input change is called **slope**.
    This informal picture prepares you for a derivative later, but no calculus is needed to count these changes.
  text_mode: Draw one horizontal line for the input and one vertical line for the output. These are **axes**. To
    mark (3,6), move three units across and six up. Do the same for the other pairs. The straight arrangement shows
    that each extra input unit adds two output units. The rate of output change per input change is called **slope**.
    This informal picture prepares you for a derivative later, but no calculus is needed to count these changes.
  bridges: []
- id: functions.s6
  title: Connect the words to a model
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.functions
  markdown: A simple numerical model can be a function with an adjustable number, such as f(x) = w × x. Here w is
    the weight that sets the multiplier. With w=2, f(3)=6; with w=4, f(3)=12. Changing w changes the rule, while
    changing x gives that rule another input. More complicated functions can curve, turn, or combine inputs. First
    make sure you can follow this tiny rule in words before adding the new shapes.
  text_mode: A simple numerical model can be a function with an adjustable number, such as f(x) = w × x. Here w
    is the weight that sets the multiplier. With w=2, f(3)=6; with w=4, f(3)=12. Changing w changes the rule, while
    changing x gives that rule another input. More complicated functions can curve, turn, or combine inputs. First
    make sure you can follow this tiny rule in words before adding the new shapes.
  bridges: []
