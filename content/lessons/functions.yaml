schema_version: 0.2-draft
lesson:
  id: functions
  version: 0.1.0-draft
  title: A function is a rule
  state: draft
  summary: A function maps inputs to outputs. Read its rule, substitute values, and connect an input-output
    table to a graph.
  slot: B03
  category: bridge
  minutes: 7
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — topic overview'
    url: https://aima.cs.berkeley.edu/contents.html
objectives:
- id: objective.functions
  version: 1-draft
  statement: A function maps inputs to outputs. Read its rule, substitute values, and connect an input-output
    table to a graph.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - functions.base
  - functions.transfer
  prerequisites:
  - anyOf:
    - objective.arithmetic
scenes:
- id: functions.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.functions
  text_mode: The complete explanation is available as readable text.
  title: One rule, several inputs
  markdown: 'A function is a rule that associates each allowed input with an output. Let f(x) = 2x. The letter
    x holds the input; f(x) names the output.


    For input 3, f(3) = 2 × 3 = 6. The parentheses identify the input here; they do not mean f multiplied by
    x.'
- id: functions.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.functions
  text_mode: The complete explanation is available as readable text.
  title: Parameters change the rule
  markdown: 'Compare f(x) = 2x with f(x) = 3x. For input 4 they produce 8 and 12. In the model prediction =
    w × x, the parameter w chooses the rule and x is the input.


    During a training example, keep the example input fixed while changing the weight.'
- id: functions.s3
  type: explanation
  depth: intuition
  objective_refs:
  - objective.functions
  text_mode: The complete explanation is available as readable text.
  title: Read the axes
  markdown: 'A graph places one quantity on the horizontal axis and another on the vertical axis. A point shows
    a pair of values.


    A **loss-versus-weight** graph changes the weight horizontally and shows error vertically. This is a different
    graph from prediction versus input. Always read the labels.'
- id: functions.s4
  type: explanation
  depth: intuition
  objective_refs:
  - objective.functions
  text_mode: The complete explanation is available as readable text.
  title: Notation is a compact sentence
  markdown: 'The expression (wx − y)² says: multiply weight and input; subtract the target; square the whole
    difference. Parentheses control the grouping.


    You can translate each expression into words before calculating it.'
- id: functions.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.functions
  markdown: Use two different examples to check your understanding. Hints are available for practice. A later,
    fresh answer without hints can demonstrate personal-study mastery.
  text_mode: Labeled radio options and a submit button; no timing requirement.
- id: functions.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.functions
  markdown: A function maps inputs to outputs. Read its rule, substitute values, and connect an input-output
    table to a graph.
  text_mode: A function maps inputs to outputs. Read its rule, substitute values, and connect an input-output
    table to a graph.
navigation:
  routes:
  - id: route.core
    scene_sequence:
