assessment_families:
- id: functions.base
  objective_ref: objective.functions
  task: base
  response_type: single_choice
  points: 1
  hint: A function maps inputs to outputs. Read its rule, substitute values, and connect an input-output table to
    a graph.
  variants:
  - id: functions.base.1
    prompt: If f(x) = 2x, what is f(3)?
    options:
    - id: correct
      text: '6'
    - id: a
      text: '5'
    - id: b
      text: '9'
    answer: correct
    feedback: 'Substitute 3 for x: f(3)=2×3=6.'
    retired: true
  - id: functions.base.2
    prompt: In prediction = w × x, which symbol is the adjustable weight?
    options:
    - id: a
      text: x
    - id: b
      text: The multiplication sign
    - id: correct
      text: w
    answer: correct
    feedback: w selects the rule while x supplies the example input.
    retired: true
- id: functions.transfer
  objective_ref: objective.functions
  task: transfer
  response_type: single_choice
  points: 1
  hint: A function maps inputs to outputs. Read its rule, substitute values, and connect an input-output table to
    a graph.
  variants:
  - id: functions.transfer.1
    prompt: On a loss-versus-weight graph, what does moving horizontally change?
    options:
    - id: a
      text: The target label automatically.
    - id: b
      text: The number of training examples.
    - id: correct
      text: The weight.
    answer: correct
    feedback: The weight.
    retired: true
  - id: functions.transfer.2
    prompt: What does (wx − y)² mean?
    options:
    - id: b
      text: Multiply the weight by a squared input and ignore the target.
    - id: correct
      text: Square the difference between prediction and target.
    - id: a
      text: Subtract the squared target from the prediction.
    answer: correct
    feedback: Square the difference between prediction and target.
    retired: true
- id: functions.base.v2
  objective_ref: objective.functions
  task: base
  response_type: numeric
  points: 1
  hint: Write the operation and the intermediate values before choosing the final answer.
  remediation_scene: functions.s3
  variants:
  - id: functions.base.v2.1
    prompt: For f(x)=3 × x, calculate f(4).
    answer: 12
    feedback: 'Replace x with 4 and multiply: 3×4=12.'
  - id: functions.base.v2.2
    prompt: For f(x)=x+5, calculate f(2).
    answer: 7
    feedback: Substitute 2, then add 5.
  - id: functions.base.v2.3
    prompt: For f(x)=2 × x, calculate f(6).
    answer: 12
    feedback: Six groups of two give twelve.
  - id: functions.base.v2.4
    prompt: For f(x)=4 × x+1, calculate f(2).
    answer: 9
    feedback: 'Multiply first: 4×2=8, then add one.'
  absolute_tolerance: 1.0e-06
- id: functions.transfer.v2
  objective_ref: objective.functions
  task: transfer
  response_type: single_choice
  points: 1
  hint: Write the operation and the intermediate values before choosing the final answer.
  remediation_scene: functions.s3
  variants:
  - id: functions.transfer.v2.1
    prompt: In f(x)=w × x, w stays fixed while x changes. What is happening?
    answer: a
    feedback: x names the input; the multiplier w was kept fixed.
    options:
    - id: b
      text: The function receives a different multiplier
    - id: c
      text: The recorded target changes the rule
    - id: a
      text: The same rule receives a different input
  - id: functions.transfer.v2.2
    prompt: A table lists outputs for inputs 1, 2, and 3. What can it establish without an additional rule?
    answer: a
    feedback: A finite table does not uniquely identify all other behavior.
    options:
    - id: c
      text: The particular procedure used to create it
    - id: a
      text: The listed results for those three inputs
    - id: b
      text: The result for each unlisted input as well
  - id: functions.transfer.v2.3
    prompt: What does f(5) mean in this notation?
    answer: a
    feedback: Parentheses supply an argument to the named function.
    options:
    - id: a
      text: The function’s output for input five
    - id: b
      text: The product of a number f and five
    - id: c
      text: The fifth version of the written rule
  - id: functions.transfer.v2.4
    prompt: The rule changes from f(x)=2x to f(x)=4x while x=3. What changed?
    answer: a
    feedback: The coefficient changed, so the same input now produces a different result.
    options:
    - id: b
      text: The supplied input
    - id: c
      text: The name of the input variable
    - id: a
      text: The rule’s multiplier
