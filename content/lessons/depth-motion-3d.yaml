assessment_families:
- id: depth-motion-3d.base
  objective_ref: objective.depth-motion-3d
  task: base
  response_type: single_choice
  points: 1
  hint: 'Use motion and correspondence: trace the inputs, operation, and result before choosing.'
  remediation_scene: depth-motion-3d.s2
  variants:
  - id: depth-motion-3d.base.1
    prompt: Can a single uncalibrated image generally determine absolute scene scale uniquely?
    options:
    - id: a
      text: 'No'
    - id: b
      text: Yes; pixels contain meters automatically
    - id: c
      text: Only if the image is colorful
    answer: a
    feedback: Projection permits multiple size-distance explanations without additional information.
  - id: depth-motion-3d.base.2
    prompt: What does optical flow estimate directly?
    options:
    - id: b
      text: Every object’s exact 3D velocity
    - id: c
      text: A guaranteed camera calibration
    - id: a
      text: Apparent displacement in image coordinates
    answer: a
    feedback: Image motion and physical 3D motion are related but not identical.
- id: depth-motion-3d.transfer
  objective_ref: objective.depth-motion-3d
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate geometry separately from appearance: trace the inputs, operation, and result before choosing.'
  remediation_scene: depth-motion-3d.s4
  variants:
  - id: depth-motion-3d.transfer.1
    prompt: A novel-view rendering looks realistic. What can still be wrong?
    options:
    - id: b
      text: Whether any image was produced
    - id: c
      text: The existence of pixels
    - id: a
      text: Underlying geometry or metric scale
    answer: a
    feedback: Photometric plausibility does not fully validate geometry.
  - id: depth-motion-3d.transfer.2
    prompt: Repeated identical windows confuse matching across views. What assumption is challenged?
    options:
    - id: c
      text: The use of color channels
    - id: a
      text: Reliable correspondence between observed points
    - id: b
      text: The definition of addition
    answer: a
    feedback: Ambiguous matches can produce wrong geometric reconstruction.
