schema_version: 0.2-draft
lesson:
  id: depth-motion-3d
  version: 0.3.0-draft
  title: Infer structure that a flat image does not directly reveal
  state: draft
  summary: Use different views to reason about depth, and separate a plausible picture from accurate geometry.
  slot: M12.7
  category: learning
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: Modern Robotics — authors’ textbook and resources
    url: https://modernrobotics.northwestern.edu/nu-gm-book-resource/
objectives:
- id: objective.depth-motion-3d
  version: 1-draft
  statement: Depth, optical flow, and 3D reconstruction estimate hidden geometry from visual evidence; camera
    models, multiple views, motion, and learned priors introduce essential assumptions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - depth-motion-3d.base
  - depth-motion-3d.transfer
  prerequisites:
  - anyOf:
    - objective.image-geometry
  - anyOf:
    - objective.state-estimation
scenes:
- id: depth-motion-3d.s1
  title: Why one picture leaves depth uncertain
  type: explanation
  depth: intuition
  objective_refs:
  - objective.depth-motion-3d
  markdown: 'Hold a coin near your eye and a larger disk farther away. They can cover the same area of your
    view. Image size alone therefore cannot tell you an object’s size and distance.


    **Depth** measures distance from a camera under a stated convention. **Calibration** relates camera measurements
    to the scene, while **pose** describes position and orientation. Known dimensions, multiple views, motion,
    or learned assumptions can reduce the ambiguity. Which evidence you have determines what scale and geometry
    can be recovered.'
  text_mode: 'Hold a coin near your eye and a larger disk farther away. They can cover the same area of your
    view. Image size alone therefore cannot tell you an object’s size and distance.


    **Depth** measures distance from a camera under a stated convention. **Calibration** relates camera measurements
    to the scene, while **pose** describes position and orientation. Known dimensions, multiple views, motion,
    or learned assumptions can reduce the ambiguity. Which evidence you have determines what scale and geometry
    can be recovered.'
  bridges: []
- id: depth-motion-3d.s2
  title: Use motion and correspondence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.depth-motion-3d
  markdown: 'Optical flow estimates apparent image displacement between frames. It can reflect object motion,
    camera motion, and projection effects. Matching points across views can support triangulation when camera
    geometry is known. Textureless regions, reflections, occlusion, and repeated patterns can make those matches
    ambiguous.


    A **correspondence** says two image points depict the same scene point. With two known camera positions,
    draw a viewing ray from each corresponding point. Their geometry can locate the scene point through **triangulation**,
    allowing for measurement error. Apparent pixel motion, called **optical flow**, is not by itself a full
    three-dimensional velocity.'
  text_mode: 'Optical flow estimates apparent image displacement between frames. It can reflect object motion,
    camera motion, and projection effects. Matching points across views can support triangulation when camera
    geometry is known. Textureless regions, reflections, occlusion, and repeated patterns can make those matches
    ambiguous.


    A **correspondence** says two image points depict the same scene point. With two known camera positions,
    draw a viewing ray from each corresponding point. Their geometry can locate the scene point through **triangulation**,
    allowing for measurement error. Apparent pixel motion, called **optical flow**, is not by itself a full
    three-dimensional velocity.'
  bridges:
  - geometry-and-symmetry
- id: depth-motion-3d.s3
  title: Choose how to store the 3D scene
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.depth-motion-3d
  markdown: 'A **point cloud** stores sampled positions. A **mesh** connects positions, called vertices, into
    surface pieces such as triangles. A **voxel** stores a value in a cell of a three-dimensional grid, like
    a pixel extended into depth.


    An **implicit field** instead answers questions at coordinates: is this point inside an object, or what
    appearance should it have? These representations describe the same physical setting in different computational
    forms. They trade off detail, memory, rendering behavior, and how they express uncertainty.'
  text_mode: 'A **point cloud** stores sampled positions. A **mesh** connects positions, called vertices, into
    surface pieces such as triangles. A **voxel** stores a value in a cell of a three-dimensional grid, like
    a pixel extended into depth.


    An **implicit field** instead answers questions at coordinates: is this point inside an object, or what
    appearance should it have? These representations describe the same physical setting in different computational
    forms. They trade off detail, memory, rendering behavior, and how they express uncertainty.'
  bridges: []
- id: depth-motion-3d.s4
  title: Evaluate geometry separately from appearance
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.depth-motion-3d
  markdown: A reconstruction can render attractive images from familiar viewpoints while having incorrect geometry
    or scale. Evaluate depth, pose, new-view behavior, and task-specific use under known conditions. For a
    robot, an aesthetically plausible surface is weaker evidence than a validated estimate with suitable uncertainty
    and collision margins.
  text_mode: A reconstruction can render attractive images from familiar viewpoints while having incorrect
    geometry or scale. Evaluate depth, pose, new-view behavior, and task-specific use under known conditions.
    For a robot, an aesthetically plausible surface is weaker evidence than a validated estimate with suitable
    uncertainty and collision margins.
  bridges: []
- id: depth-motion-3d.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.depth-motion-3d
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A convincing picture does not uniquely determine a 3D scene. Use camera information and multiple
    views where available, and evaluate recovered geometry separately from appearance.
