schema_version: 0.2-draft
lesson:
  id: depth-motion-3d
  version: 0.1.0-draft
  title: Infer structure that a flat image does not directly reveal
  state: draft
  summary: Depth, optical flow, and 3D reconstruction estimate hidden geometry from visual evidence; camera models,
    multiple views, motion, and learned priors introduce essential assumptions.
  slot: M12.7
  category: learning
  minutes: 12
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: Modern Robotics — authors’ textbook and resources
    url: https://modernrobotics.northwestern.edu/nu-gm-book-resource/
objectives:
- id: objective.depth-motion-3d
  version: 1-draft
  statement: Depth, optical flow, and 3D reconstruction estimate hidden geometry from visual evidence; camera models,
    multiple views, motion, and learned priors introduce essential assumptions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - depth-motion-3d.base
  - depth-motion-3d.transfer
  prerequisites:
  - anyOf:
    - objective.image-geometry
  - anyOf:
    - objective.state-estimation
scenes:
- id: depth-motion-3d.s1
  title: One image admits several worlds
  type: explanation
  depth: intuition
  objective_refs:
  - objective.depth-motion-3d
  markdown: A small object nearby can occupy the same image size as a large object farther away. A two-dimensional
    image therefore does not uniquely determine scene depth. Camera calibration, multiple views, known dimensions,
    motion, or learned priors can reduce ambiguity. The chosen evidence determines which scale or geometry is identifiable.
  text_mode: A small object nearby can occupy the same image size as a large object farther away. A two-dimensional
    image therefore does not uniquely determine scene depth. Camera calibration, multiple views, known dimensions,
    motion, or learned priors can reduce ambiguity. The chosen evidence determines which scale or geometry is identifiable.
  bridges: []
- id: depth-motion-3d.s2
  title: Use motion and correspondence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.depth-motion-3d
  markdown: Optical flow estimates apparent image displacement between frames. It can reflect object motion, camera
    motion, and projection effects. Matching points across views can support triangulation when camera geometry
    is known. Textureless regions, reflections, occlusion, and repeated patterns can make those matches ambiguous.
  text_mode: Optical flow estimates apparent image displacement between frames. It can reflect object motion, camera
    motion, and projection effects. Matching points across views can support triangulation when camera geometry
    is known. Textureless regions, reflections, occlusion, and repeated patterns can make those matches ambiguous.
  bridges:
  - geometry-and-symmetry
- id: depth-motion-3d.s3
  title: Choose a 3D representation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.depth-motion-3d
  markdown: Point clouds store sampled positions; meshes add surfaces and connectivity; voxels store values on a
    three-dimensional grid. Implicit fields represent quantities such as occupancy or appearance as functions of
    coordinates. These choices trade detail, memory, rendering behavior, and how uncertainty is represented.
  text_mode: Point clouds store sampled positions; meshes add surfaces and connectivity; voxels store values on
    a three-dimensional grid. Implicit fields represent quantities such as occupancy or appearance as functions
    of coordinates. These choices trade detail, memory, rendering behavior, and how uncertainty is represented.
  bridges: []
- id: depth-motion-3d.s4
  title: Evaluate geometry separately from appearance
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.depth-motion-3d
  markdown: A reconstruction can render attractive images from familiar viewpoints while having incorrect geometry
    or scale. Evaluate depth, pose, new-view behavior, and task-specific use under known conditions. For a robot,
    an aesthetically plausible surface is weaker evidence than a validated estimate with suitable uncertainty and
    collision margins.
  text_mode: A reconstruction can render attractive images from familiar viewpoints while having incorrect geometry
    or scale. Evaluate depth, pose, new-view behavior, and task-specific use under known conditions. For a robot,
    an aesthetically plausible surface is weaker evidence than a validated estimate with suitable uncertainty and
    collision margins.
  bridges: []
- id: depth-motion-3d.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.depth-motion-3d
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: depth-motion-3d.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.depth-motion-3d
  markdown: Depth, optical flow, and 3D reconstruction estimate hidden geometry from visual evidence; camera models,
    multiple views, motion, and learned priors introduce essential assumptions.
  text_mode: Depth, optical flow, and 3D reconstruction estimate hidden geometry from visual evidence; camera models,
    multiple views, motion, and learned priors introduce essential assumptions.
navigation:
  routes:
  - id: route.core
    scene_sequence:
