schema_version: 0.2-draft
lesson:
  id: transformer-families
  version: 0.4.0-draft
  title: Match information flow to the learning objective
  state: draft
  summary: BERT fills in blanks, GPT-2 continues text, and T5 turns every task into text-to-text. See how one choice, what each position may look at, splits transformers into three families.
  slot: M15.7
  category: learning
  sources:
    - title: "BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding (Devlin et al., 2018)"
      url: https://arxiv.org/abs/1810.04805
    - title: "Language Models are Unsupervised Multitask Learners (GPT-2; Radford et al., 2019)"
      url: https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf
    - title: "Exploring the Limits of Transfer Learning with a Unified Text-to-Text Transformer (T5; Raffel et al., 2019)"
      url: https://arxiv.org/abs/1910.10683
    - title: "Attention Is All You Need (Vaswani et al., 2017)"
      url: https://arxiv.org/abs/1706.03762
objectives:
  - id: objective.transformer-families
    version: 2-draft
    statement: Encoder-only, decoder-only, and encoder-decoder transformers share mechanisms but differ in permitted context, output organization, and common training objectives.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - transformer-families.base.v2
      - transformer-families.transfer.v2
      - transformer-families.calculate
    prerequisites:
      - anyOf:
          - objective.multi-head-attention
      - anyOf:
          - objective.sequence-to-sequence
scenes:
  - id: transformer-families.s1
    title: "Fill in the blank: encoder-only (BERT)"
    type: explanation
    depth: intuition
    objective_refs:
      - objective.transformer-families
    markdown: |-
      Cover one word: "the [MASK] chased the ball across the yard." You'd guess "dog", and you'd use words on *both* sides of the gap to do it. That's the idea behind **BERT**, released by Google in October 2018.

      BERT is an **encoder-only** transformer: a stack of blocks with no mask on attention, so every position can see every other one. That's called **bidirectional** attention. Its main training task is the **masked language model**: pick 15% of the tokens, hide them (mostly by swapping in a [MASK] token), and train the model to recover them from the surrounding context. The original BERT also learned to tell whether two sentences were consecutive.

      The result is a model that builds rich representations of text it can see in full. BERT-base has about 110 million parameters and BERT-large about 340 million. Fine-tuned with a small extra layer on top, BERT set new records on question answering and many classification benchmarks. Encoders are still the workhorse for classifying text, tagging names, and turning documents into vectors for search.

      What BERT can't do well is write. It was never trained to predict a word from the left side alone.
    bridges: []
  - id: transformer-families.s2
    title: "Continue the text: decoder-only (GPT-2)"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.transformer-families
    markdown: |-
      A **decoder-only** transformer applies the causal mask from the lesson on softmax and masking in every layer, so each position sees only itself and earlier positions. Its training task is the **causal language model**: predict the next token at every position. OpenAI's GPT-2 (February 2019, up to 1.5 billion parameters) showed how far this goes. Trained only to continue web text, it could attempt translation, summaries, and question answering when the prompt was phrased as text to continue.

      :::predict A training sentence has 100 tokens. How many of them give BERT a prediction target, and how many give GPT-2 one?
      BERT predicts only the roughly 15 hidden tokens. GPT-2 predicts at every position, 99 targets: every token except the first, which has nothing before it. Almost every token of training text becomes a target.
      :::

      Generation is natural: predict a token, append it, repeat. ChatGPT (November 2022) and most of today's large chat models are decoder-only.

      :::mixup "Decoder-only means it has no way to read the input, only to write."
      The prompt goes through the very same causal stack. Each prompt token attends to the ones before it, so by the last prompt token the model has read the whole prompt, just left to right. What it lacks is a *separate* bidirectional encoder, so early prompt tokens never see later ones.
      :::
  - id: transformer-families.s3
    title: "Read, then write: encoder–decoder (T5)"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.transformer-families
    markdown: |-
      The original 2017 transformer was built for translation, so it had both halves. An **encoder–decoder** transformer has a bidirectional encoder that reads the whole input and a causal decoder that writes the output. Each decoder block has three sublayers: causal self-attention over the output so far, **cross-attention** to the encoder's vectors (queries from the output, keys and values from the input), and the MLP.

      Google's **T5** (October 2019, up to 11 billion parameters) made this design general by casting every task as text in, text out: "translate English to German: That is good." → "Das ist gut." Even its pretraining is text-to-text. In **span corruption**, random spans are cut from a sentence and replaced by placeholder tokens, and the decoder writes out what was removed:

      | | Text |
      | --- | --- |
      | Original | Thank you for inviting me to your party last week. |
      | Encoder input | Thank you ⟨X⟩ me to your party ⟨Y⟩ week. |
      | Decoder target | ⟨X⟩ for inviting ⟨Y⟩ last ⟨Z⟩ |

      Encoder–decoders fit jobs with a clear input and a separate output: translation, summarization, speech-to-text.
  - id: transformer-families.masks
    title: Count what each position may see
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.transformer-families
    markdown: |-
      The three families use the same blocks. What differs is the attention mask. For the four tokens "the cat sat down", ✓ marks a query–key pair that's allowed:

      | Query ↓ / key → | the | cat | sat | down |
      | --- | :---: | :---: | :---: | :---: |
      | the | ✓ | ✓ / · | ✓ / · | ✓ / · |
      | cat | ✓ | ✓ | ✓ / · | ✓ / · |
      | sat | ✓ | ✓ | ✓ | ✓ / · |
      | down | ✓ | ✓ | ✓ | ✓ |

      Read "✓ / ·" as "allowed in an encoder, blocked in a decoder". An encoder allows all $4 \times 4 = 16$ pairs. A decoder allows the lower triangle, $1 + 2 + 3 + 4 = 10$ pairs; for $n$ tokens that's $n(n+1)/2$.

      :::predict An encoder–decoder translates a 4-token source into a 3-token target. How many pairs does each kind of attention allow?
      Encoder self-attention: $4 \times 4 = 16$. Decoder self-attention (causal): $1 + 2 + 3 = 6$. Cross-attention: every target token may see every source token, $3 \times 4 = 12$.
      :::

      | Family | Self-attention mask | Training task | Landmark | Good at |
      | --- | --- | --- | --- | --- |
      | Encoder-only | None (bidirectional) | Masked tokens | BERT, 2018 | Classifying, tagging, search |
      | Decoder-only | Causal | Next token | GPT-2, 2019 | Generating, chat |
      | Encoder–decoder | Encoder none, decoder causal, plus cross-attention | Text-to-text, such as missing spans | T5, 2019 | Translating, summarizing |
  - id: transformer-families.s4
    title: Pick a family for the job
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.transformer-families
    markdown: |-
      Try three jobs:

      - **Flag spam in 10 million emails a day.** The whole email is available, the output is one label, and cost matters. A small fine-tuned encoder reads each email bidirectionally and is cheap to run.
      - **Autocomplete code as someone types.** The future hasn't been typed yet, so a causal decoder that continues the prefix fits exactly.
      - **Translate product manuals from English to Japanese.** A clear input and a separate output suit an encoder–decoder. A large decoder-only model prompted with "Translate to Japanese:" can also do it well.

      That last point is how things stand today: very large decoder-only models handle classification and translation by prompting, so they've become the default general-purpose choice, while encoders stay popular where speed and cost per input matter most. When choosing, ask what each prediction is allowed to see, and pick the family whose mask matches.
  - id: transformer-families.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.transformer-families
    markdown: Contracts, code completion, meeting summaries, and a few attention grids to count test whether you can match a family to its mask and its job.
    takeaway: |-
      Encoder-only models (BERT) see both sides and fill in blanks; decoder-only models (GPT-2) see only the past and predict the next token; encoder–decoders (T5) read a whole input and write an output through cross-attention.
  - id: transformer-families.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.transformer-families
    markdown: |-
      Compare transformer families by what each prediction is allowed to see: a complete input, an output prefix, or a source input together with an output prefix.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - transformer-families.s1
        - transformer-families.s2
        - transformer-families.s3
        - transformer-families.masks
        - transformer-families.s4
        - transformer-families.check
      gate_refs:
        - gate.core
  scene_aliases:
    transformer-families.recap: transformer-families.check
assessment_families:
  - id: transformer-families.base
    objective_ref: objective.transformer-families
    task: base
    response_type: single_choice
    points: 1
    hint: 'A causal decoder extends a prefix: trace the inputs, operation, and result before choosing.'
    remediation_scene: transformer-families.s2
    variants:
      - id: transformer-families.base.1
        prompt: Which family commonly uses bidirectional context for masked-token prediction?
        options:
          - id: a
            text: Encoder-only
          - id: b
            text: Only a causal decoder with unrestricted future labels
          - id: c
            text: A static lookup table always
        answer: a
        feedback: An encoder can use permitted context on both sides of a masked position.
        retired: true
      - id: transformer-families.base.2
        prompt: What extra attention connection is common in an encoder-decoder model?
        options:
          - id: b
            text: Only a second copy of the tokenizer
          - id: c
            text: A mandatory gradient update during every output token
          - id: a
            text: Decoder cross-attention to encoder representations
        answer: a
        feedback: Cross-attention connects output generation to source features.
        retired: true
  - id: transformer-families.transfer
    objective_ref: objective.transformer-families
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Do not infer the whole system from the family: trace the inputs, operation, and result before choosing.'
    remediation_scene: transformer-families.s4
    variants:
      - id: transformer-families.transfer.1
        prompt: An autoregressive training position reads its future target directly. What is violated?
        options:
          - id: b
            text: Only the file naming convention
          - id: c
            text: A guarantee of lower hardware cost
          - id: a
            text: The intended causal prediction boundary
        answer: a
        feedback: The future target must be hidden from that position’s predictive input.
        retired: true
      - id: transformer-families.transfer.2
        prompt: Does “decoder-only” specify whether a product uses retrieval?
        options:
          - id: c
            text: Only if the model is open-weight
          - id: a
            text: No; retrieval is a separate system choice
          - id: b
            text: Yes; retrieval is impossible
        answer: a
        feedback: Architecture family and application scaffolding are distinct.
        retired: true
  - id: transformer-families.base.v2
    objective_ref: objective.transformer-families
    task: base
    response_type: single_choice
    points: 1
    hint: For each family, picture its attention mask (full grid, lower triangle, or encoder grid plus cross-attention) and its training task (masked tokens, next token, or text-to-text).
    remediation_scene: transformer-families.masks
    variants:
      - id: transformer-families.base.v2.1
        prompt: 'During pretraining, BERT sees "the [MASK] chased the ball". Which tokens can its attention use to predict the hidden word?'
        options:
          - id: b
            text: '"the" before the gap, since later words would leak the answer'
          - id: a
            text: Words on both sides of the gap, since its attention has no causal mask
          - id: c
            text: '"chased the ball" after the gap, since BERT reads right to left'
        answer: a
        feedback: BERT is bidirectional, so every position sees every other one. The hidden word itself is replaced, so nothing leaks. Only a causal decoder is restricted to the left side.
      - id: transformer-families.base.v2.2
        prompt: For the same 200-token training sentence, why does a GPT-style model get far more prediction targets than BERT?
        options:
          - id: c
            text: GPT-style models use a larger vocabulary, so each token counts more
          - id: b
            text: BERT gets one next-sentence label per pair instead of token targets
          - id: a
            text: The causal mask lets every position predict its next token unseen
        answer: a
        feedback: Because each position can't see ahead, the next token is a fair target everywhere, about 200 targets. BERT only predicts the roughly 15% of tokens it hid, about 30.
      - id: transformer-families.base.v2.3
        prompt: In a T5-style encoder–decoder, which attention lets the decoder use the input text while it writes?
        options:
          - id: a
            text: Cross-attention, with queries from the decoder and keys and values from the encoder
          - id: c
            text: Causal self-attention over the decoder's own earlier output tokens
          - id: b
            text: Bidirectional self-attention inside the encoder's blocks
        answer: a
        feedback: Cross-attention is the bridge from output to input. The decoder's self-attention only looks at its own output so far, and the encoder's attention never sees the output.
      - id: transformer-families.base.v2.4
        prompt: 'In T5 span corruption, the encoder input is "Thank you ⟨X⟩ me to your party ⟨Y⟩ week." What does the decoder learn to write?'
        options:
          - id: b
            text: The complete original sentence, from "Thank" through "week."
          - id: a
            text: ⟨X⟩ for inviting ⟨Y⟩ last ⟨Z⟩
          - id: c
            text: The next sentence of the document, after "week."
        answer: a
        feedback: The target lists only the removed spans, each after its placeholder, then a final placeholder to end. Rewriting the whole sentence would waste effort on words it can already see.
  - id: transformer-families.transfer.v2
    objective_ref: objective.transformer-families
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask whether the whole input is available when the model answers, and whether the output is a label, a continuation, or a separate text. Then pick the family whose mask matches.
    remediation_scene: transformer-families.s4
    variants:
      - id: transformer-families.transfer.v2.1
        prompt: A legal team must sort a million contracts into 20 categories, and each contract is available in full. They want low cost per document. Which family fits best?
        options:
          - id: a
            text: A fine-tuned encoder-only model that reads each contract bidirectionally
          - id: b
            text: A decoder-only model that generates a category name word by word
          - id: c
            text: An encoder–decoder that rewrites each contract as a summary first
        answer: a
        feedback: The whole contract is available and the output is one label, which is exactly what encoders are good at, cheaply. A decoder or encoder–decoder can do it but spends extra compute generating text.
      - id: transformer-families.transfer.v2.2
        prompt: A code editor suggests the rest of a line as the programmer types. Which family matches how the text arrives?
        options:
          - id: c
            text: Encoder-only, since it can use both sides of the cursor
          - id: a
            text: Decoder-only, since it continues a prefix one token at a time
          - id: b
            text: Encoder–decoder, since code and suggestions are two sequences
        answer: a
        feedback: The code after the cursor hasn't been typed, and the task is to continue a prefix, which is what a causal decoder is trained for. An encoder can't generate left to right naturally.
      - id: transformer-families.transfer.v2.3
        prompt: A developer tries to make a pretrained BERT write a paragraph by predicting one word at a time from the left. The output is poor. What is the main reason?
        options:
          - id: b
            text: BERT's vocabulary is too small to cover the words in a paragraph
          - id: c
            text: BERT has cross-attention layers that need an encoder input
          - id: a
            text: It learned to fill gaps with both sides visible, not to predict from the left alone
        answer: a
        feedback: BERT's training always showed it context on both sides. Writing from the left alone is a task it never practiced. BERT has no cross-attention, and its vocabulary is similar in size to other models'.
      - id: transformer-families.transfer.v2.4
        prompt: A T5-style model turns long meeting transcripts into short notes. While writing note word 5, what can its decoder use?
        options:
          - id: c
            text: Only transcript tokens up to the fifth one, since attention is causal
          - id: b
            text: The entire transcript and the complete note, including later words
          - id: a
            text: The entire transcript, plus note words 1 to 4 it has written so far
        answer: a
        feedback: Cross-attention sees the whole encoded transcript, and causal self-attention sees the note so far. The causal mask applies to the output, not to the input, and later note words don't exist yet.
  - id: transformer-families.calculate
    objective_ref: objective.transformer-families
    task: base
    response_type: numeric
    points: 1
    hint: 'Count allowed query–key pairs row by row. Bidirectional: n × n. Causal: 1 + 2 + … + n = n(n + 1)/2. Cross-attention: target length × source length.'
    remediation_scene: transformer-families.masks
    absolute_tolerance: 0.5
    variants:
      - id: transformer-families.calculate.1
        prompt: A decoder-only model processes 6 tokens. How many query–key pairs does its causal mask allow in one head?
        answer: 21
        feedback: Row i may see i positions, so 1 + 2 + 3 + 4 + 5 + 6 = 21, which is 6 × 7 / 2.
      - id: transformer-families.calculate.2
        prompt: An encoder-only model processes 6 tokens with no padding. How many query–key pairs does one head's attention allow?
        answer: 36
        feedback: With no mask, every one of the 6 queries sees all 6 keys, 6 × 6 = 36.
      - id: transformer-families.calculate.3
        prompt: A decoder-only model processes 10 tokens. How many query–key pairs does its causal mask allow in one head?
        answer: 55
        feedback: 10 × 11 / 2 = 55, a little over half of the 100 pairs an encoder would allow.
      - id: transformer-families.calculate.4
        prompt: An encoder–decoder translates a 5-token source into a 4-token target. How many query–key pairs does one cross-attention head allow?
        answer: 20
        feedback: Each of the 4 target tokens may see all 5 source tokens, 4 × 5 = 20. Cross-attention has no causal mask because the whole source is already known.
      - id: transformer-families.calculate.5
        prompt: A decoder-only model processes 8 tokens. How many query–key pairs does its causal mask allow in one head?
        answer: 36
        feedback: 8 × 9 / 2 = 36, compared with 64 for an unmasked encoder.
