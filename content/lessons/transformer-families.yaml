assessment_families:
- id: transformer-families.base
  objective_ref: objective.transformer-families
  task: base
  response_type: single_choice
  points: 1
  hint: 'A causal decoder extends a prefix: trace the inputs, operation, and result before choosing.'
  remediation_scene: transformer-families.s2
  variants:
  - id: transformer-families.base.1
    prompt: Which family commonly uses bidirectional context for masked-token prediction?
    options:
    - id: a
      text: Encoder-only
    - id: b
      text: Only a causal decoder with unrestricted future labels
    - id: c
      text: A static lookup table always
    answer: a
    feedback: An encoder can use permitted context on both sides of a masked position.
  - id: transformer-families.base.2
    prompt: What extra attention connection is common in an encoder-decoder model?
    options:
    - id: b
      text: Only a second copy of the tokenizer
    - id: c
      text: A mandatory gradient update during every output token
    - id: a
      text: Decoder cross-attention to encoder representations
    answer: a
    feedback: Cross-attention connects output generation to source features.
- id: transformer-families.transfer
  objective_ref: objective.transformer-families
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Do not infer the whole system from the family: trace the inputs, operation, and result before choosing.'
  remediation_scene: transformer-families.s4
  variants:
  - id: transformer-families.transfer.1
    prompt: An autoregressive training position reads its future target directly. What is violated?
    options:
    - id: b
      text: Only the file naming convention
    - id: c
      text: A guarantee of lower hardware cost
    - id: a
      text: The intended causal prediction boundary
    answer: a
    feedback: The future target must be hidden from that position’s predictive input.
  - id: transformer-families.transfer.2
    prompt: Does “decoder-only” specify whether a product uses retrieval?
    options:
    - id: c
      text: Only if the model is open-weight
    - id: a
      text: No; retrieval is a separate system choice
    - id: b
      text: Yes; retrieval is impossible
    answer: a
    feedback: Architecture family and application scaffolding are distinct.
