schema_version: 0.2-draft
lesson:
  id: transformer-families
  version: 0.3.0-draft
  title: Match information flow to the learning objective
  state: draft
  summary: Choose what information each prediction may use, then compare encoder, decoder, and encoder–decoder
    designs.
  slot: M15.7
  category: learning
  sources:
  - title: Attention Is All You Need
    url: https://arxiv.org/abs/1706.03762
  - title: 'BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding'
    url: https://arxiv.org/abs/1810.04805
objectives:
- id: objective.transformer-families
  version: 1-draft
  statement: Encoder-only, decoder-only, and encoder-decoder transformers share mechanisms but differ in permitted
    context, output organization, and common training objectives.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - transformer-families.base
  - transformer-families.transfer
  prerequisites:
  - anyOf:
    - objective.multi-head-attention
  - anyOf:
    - objective.sequence-to-sequence
scenes:
- id: transformer-families.s1
  title: An encoder can use both sides of an input
  type: explanation
  depth: intuition
  objective_refs:
  - objective.transformer-families
  markdown: 'In “the [MASK] chased the ball,” a model predicting the hidden word can use both the earlier “the”
    and the later “chased the ball.” This is **bidirectional** access: permitted context on both sides of a
    position. The hidden answer itself must still be withheld.


    Encoder-only transformers commonly use this pattern to build representations of an available input. They
    can learn with masked-token prediction or support tasks such as classification. The access is appropriate
    when the task allows the surrounding observations; it would not be appropriate for predicting a future
    token that has not arrived.'
  text_mode: 'In “the [MASK] chased the ball,” a model predicting the hidden word can use both the earlier
    “the” and the later “chased the ball.” This is **bidirectional** access: permitted context on both sides
    of a position. The hidden answer itself must still be withheld.


    Encoder-only transformers commonly use this pattern to build representations of an available input. They
    can learn with masked-token prediction or support tasks such as classification. The access is appropriate
    when the task allows the surrounding observations; it would not be appropriate for predicting a future
    token that has not arrived.'
  bridges: []
- id: transformer-families.s2
  title: A causal decoder extends a prefix
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.transformer-families
  markdown: A decoder-only language model commonly predicts each next token using current and earlier positions
    under a causal mask. Training can process many positions together while respecting that mask. Generation
    extends the sequence one selected token at a time in ordinary autoregressive decoding.
  text_mode: A decoder-only language model commonly predicts each next token using current and earlier positions
    under a causal mask. Training can process many positions together while respecting that mask. Generation
    extends the sequence one selected token at a time in ordinary autoregressive decoding.
  bridges: []
- id: transformer-families.s3
  title: An encoder-decoder connects two sequences
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.transformer-families
  markdown: 'The encoder processes a source sequence, and the decoder uses causal self-attention over its output
    prefix plus cross-attention to source representations. Translation or denoising tasks can use this organization.
    Source and target lengths need not match, and their tokenization or modalities can differ.


    Compare three jobs. An encoder can build a representation of a complete review for sentiment classification.
    A causal decoder can continue “the dog” with a next token. An encoder–decoder can read a complete French
    source while generating an English target from left to right. The target''s future words remain hidden
    even though the source is fully available.'
  text_mode: 'The encoder processes a source sequence, and the decoder uses causal self-attention over its
    output prefix plus cross-attention to source representations. Translation or denoising tasks can use this
    organization. Source and target lengths need not match, and their tokenization or modalities can differ.


    Compare three jobs. An encoder can build a representation of a complete review for sentiment classification.
    A causal decoder can continue “the dog” with a next token. An encoder–decoder can read a complete French
    source while generating an English target from left to right. The target''s future words remain hidden
    even though the source is fully available.'
  bridges: []
- id: transformer-families.s4
  title: Do not infer the whole system from the family
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.transformer-families
  markdown: A family name does not specify training data, scale, post-training, retrieval, or tool use. A causal
    decoder can be adapted to many tasks, while encoders remain useful for retrieval and perception. Compare
    what information is available at each prediction and which objective supplied training feedback.
  text_mode: A family name does not specify training data, scale, post-training, retrieval, or tool use. A
    causal decoder can be adapted to many tasks, while encoders remain useful for retrieval and perception.
    Compare what information is available at each prediction and which objective supplied training feedback.
  bridges: []
- id: transformer-families.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.transformer-families
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: 'Compare transformer families by what each prediction is allowed to see: a complete input, an output
    prefix, or a source input together with an output prefix.'
- id: transformer-families.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.transformer-families
  markdown: 'Compare transformer families by what each prediction is allowed to see: a complete input, an output
    prefix, or a source input together with an output prefix.'
  text_mode: 'Compare transformer families by what each prediction is allowed to see: a complete input, an
    output prefix, or a source input together with an output prefix.'
