  version: 0.4.0-draft
  title: Turn a linear score into a class probability
  state: draft
  summary: Should you pack a rain jacket when the forecast says 22%? Turn a weighted score into a probability, train it, and see why the cutoff is a separate choice.
  slot: M07.2
  category: learning
