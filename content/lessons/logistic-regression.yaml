scenes:
- id: logistic-regression.s1
  title: Begin with a score
  type: explanation
  depth: intuition
  objective_refs:
  - objective.logistic-regression
  markdown: 'Suppose a mail filter must answer “spam” or “ordinary.” This is **binary classification**: choosing
    between two categories. Start with a numerical score built from features, or measured clues. Each clue
    has a weight, and a bias adds a fixed starting amount, just as in the delivery-time predictor.


    A raw score can be any number, so it is not yet a probability. **Logistic regression** passes it through
    an S-shaped function called the **sigmoid**, which produces a number between 0 and 1. Despite its name,
    this model is often used for classification.'
  text_mode: 'Suppose a mail filter must answer “spam” or “ordinary.” This is **binary classification**: choosing
    between two categories. Start with a numerical score built from features, or measured clues. Each clue
    has a weight, and a bias adds a fixed starting amount, just as in the delivery-time predictor.


    A raw score can be any number, so it is not yet a probability. **Logistic regression** passes it through
    an S-shaped function called the **sigmoid**, which produces a number between 0 and 1. Despite its name,
    this model is often used for classification.'
  bridges: []
- id: logistic-regression.s2
  title: Read the transformation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.logistic-regression
  markdown: 'Write the score as z. The sigmoid is 1/(1 + exp(−z)); exp means raising the constant e, about
    2.718, to a power. You can use the powers-and-logs side lesson for that notation.


    At z = 0, exp(0) = 1, so the result is 1/2. At z = 1, exp(−1) is about 0.368, giving about 0.731. A positive
    score puts the probability above one-half; a negative score puts it below.


    For optional depth, **odds** compare the chance of an event with its complement: p/(1 − p). Probability
    0.75 gives odds 3 to 1. Logistic regression makes the natural logarithm of these odds equal to its linear
    score. It is linear in the supplied features, which may themselves be transformed inputs.'
  text_mode: 'Write the score as z. The sigmoid is 1/(1 + exp(−z)); exp means raising the constant e, about
    2.718, to a power. You can use the powers-and-logs side lesson for that notation.


    At z = 0, exp(0) = 1, so the result is 1/2. At z = 1, exp(−1) is about 0.368, giving about 0.731. A positive
    score puts the probability above one-half; a negative score puts it below.


    For optional depth, **odds** compare the chance of an event with its complement: p/(1 − p). Probability
    0.75 gives odds 3 to 1. Logistic regression makes the natural logarithm of these odds equal to its linear
    score. It is linear in the supplied features, which may themselves be transformed inputs.'
  bridges:
  - powers-logs
  - probability
- id: logistic-regression.s3
  title: Fit with a probability-sensitive loss
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.logistic-regression
  markdown: 'Training adjusts the weights to put more probability on the recorded class. **Binary cross-entropy**,
    also called log loss here, scores how much probability the model assigned to the answer that actually occurred.
    A correct-class probability of 0.9 gives a smaller loss than 0.1.


    For a spam example, loss is −log(p), using the natural logarithm. For an ordinary example, it is −log(1
    − p). Thus confidently getting either class wrong is costly. Average over the training examples and adjust
    the weights to reduce that loss. **Regularization** adds a preference such as keeping weights from becoming
    unnecessarily large.'
  text_mode: 'Training adjusts the weights to put more probability on the recorded class. **Binary cross-entropy**,
    also called log loss here, scores how much probability the model assigned to the answer that actually occurred.
    A correct-class probability of 0.9 gives a smaller loss than 0.1.


    For a spam example, loss is −log(p), using the natural logarithm. For an ordinary example, it is −log(1
    − p). Thus confidently getting either class wrong is costly. Average over the training examples and adjust
    the weights to reduce that loss. **Regularization** adds a preference such as keeping weights from becoming
    unnecessarily large.'
  bridges: []
- id: logistic-regression.s4
  title: Separate classification from calibration
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.logistic-regression
  markdown: 'Suppose the model reports spam probability 0.4. A **threshold** is the cutoff for taking an action:
    at cutoff 0.5 the message passes; at 0.3 it is flagged. The same model can support different choices when
    the costs of missed spam and false alarms change.


    **Discrimination** asks whether spam tends to receive higher scores than ordinary mail. **Calibration**
    asks whether probabilities match observed frequencies over comparable cases. A sigmoid enforces a numerical
    range; it does not guarantee either quality. Check both on held-out mail, and inspect which mistakes occur.'
  text_mode: 'Suppose the model reports spam probability 0.4. A **threshold** is the cutoff for taking an action:
    at cutoff 0.5 the message passes; at 0.3 it is flagged. The same model can support different choices when
    the costs of missed spam and false alarms change.


    **Discrimination** asks whether spam tends to receive higher scores than ordinary mail. **Calibration**
