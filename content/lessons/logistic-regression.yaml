objectives:
  - id: objective.logistic-regression
    version: 2-draft
    statement: Logistic regression maps a linear score through a sigmoid for binary classification; fitting probabilities and choosing an action threshold are different steps.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - logistic-regression.base.v2
      - logistic-regression.transfer.v2
    prerequisites:
      - anyOf:
          - objective.prediction
      - anyOf:
