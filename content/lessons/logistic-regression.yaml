assessment_families:
  - id: logistic-regression.base
    objective_ref: objective.logistic-regression
    task: base
    response_type: single_choice
    points: 1
    hint: 'Read the transformation: trace the inputs, operation, and result before choosing.'
    remediation_scene: logistic-regression.s2
    variants:
      - id: logistic-regression.base.1
        prompt: What probability does sigmoid give a score of zero?
        options:
          - id: c
            text: '1'
          - id: a
            text: '0.5'
          - id: b
            text: '0'
        answer: a
        feedback: The denominator is 1 + exp(0) = 2.
        retired: true
      - id: logistic-regression.base.2
        prompt: For a positive labeled example, which prediction has lower log loss?
        options:
          - id: a
            text: '0.9'
          - id: b
            text: '0.1'
          - id: c
            text: Both always equal
        answer: a
        feedback: Higher assigned probability to the observed positive class reduces its negative log probability.
        retired: true
  - id: logistic-regression.transfer
    objective_ref: objective.logistic-regression
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Separate classification from calibration: trace the inputs, operation, and result before choosing.'
    remediation_scene: logistic-regression.s4
    variants:
      - id: logistic-regression.transfer.1
        prompt: Reviewing false positives becomes much cheaper than missing positives. What might change without retraining?
        options:
          - id: a
            text: The decision threshold
          - id: b
            text: The definition of multiplication
          - id: c
            text: Every input label automatically
        answer: a
        feedback: Decision costs can justify a different threshold on the same probabilities.
        retired: true
      - id: logistic-regression.transfer.2
        prompt: A sigmoid output is 0.95 on unfamiliar data. What is still unproven?
        options:
          - id: b
            text: That it is between zero and one
          - id: c
            text: That the score was transformed
          - id: a
            text: That the probability is calibrated in that environment
        answer: a
        feedback: Range constraints do not establish empirical calibration.
        retired: true
  - id: logistic-regression.base.v2
    objective_ref: objective.logistic-regression
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Compute the score z = w × x + b, squash it with 1 / (1 + e^(−z)), then take −ln of the probability the model gave to the label that actually happened.
    remediation_scene: logistic-regression.s3
    variants:
      - id: logistic-regression.base.v2.1
        prompt: A model has w = 0.5 and b = −1. For an example with x = 4 and true label y = 1, find the score, the probability of class 1 (two decimals), and the cross-entropy loss (two decimals).
        feedback: z = 0.5 × 4 − 1 = 1, and σ(1) = 1/(1 + e^(−1)) ≈ 0.73. The label is 1, so the loss is −ln 0.73 ≈ 0.31. Using −ln(1 − p) here would score the wrong label.
        answers:
          score: 1
          probability: 0.73
          loss: 0.31
        reason_answer: actual
        reason_options:
          - id: actual
            text: Take −ln of the probability given to the label that occurred.
          - id: always
            text: Take −ln of the class-1 probability, whatever the label.
          - id: square
            text: Square the gap between the score z and the label.
      - id: logistic-regression.base.v2.2
        prompt: A model has w = 2 and b = −3. For an example with x = 1 and true label y = 0, find the score, the probability of class 1 (two decimals), and the cross-entropy loss (two decimals).
        feedback: z = 2 × 1 − 3 = −1, so σ(−1) ≈ 0.27. The label is 0, so the loss is −ln(1 − 0.27) = −ln 0.73 ≈ 0.31. Taking −ln 0.27 ≈ 1.31 would charge the model for the class that didn't happen.
        answers:
          score: -1
          probability: 0.27
          loss: 0.31
        reason_answer: actual
        reason_options:
          - id: square
            text: Square the gap between the score z and the label.
          - id: actual
            text: Take −ln of the probability given to the label that occurred.
          - id: always
            text: Take −ln of the class-1 probability, whatever the label.
      - id: logistic-regression.base.v2.3
        prompt: A model has w = 1 and b = −5. For an example with x = 5 and true label y = 1, find the score, the probability of class 1 (two decimals), and the cross-entropy loss (two decimals).
        feedback: z = 1 × 5 − 5 = 0, and σ(0) = 1/(1 + 1) = 0.5. The loss is −ln 0.5 ≈ 0.69, the cost of an undecided coin flip.
        answers:
          score: 0
          probability: 0.5
          loss: 0.69
        reason_answer: actual
        reason_options:
          - id: always
            text: Take −ln of the class-1 probability, whatever the label.
          - id: square
            text: Square the gap between the score z and the label.
          - id: actual
            text: Take −ln of the probability given to the label that occurred.
      - id: logistic-regression.base.v2.4
        prompt: A model has w = 0.5 and b = 1. For an example with x = 2 and true label y = 0, find the score, the probability of class 1 (two decimals), and the cross-entropy loss (two decimals).
        feedback: z = 0.5 × 2 + 1 = 2, so σ(2) ≈ 0.88. The label is 0, so the loss is −ln(1 − 0.88) = −ln 0.12 ≈ 2.13. A confident prediction for the wrong class is expensive.
        answers:
          score: 2
          probability: 0.88
          loss: 2.13
        reason_answer: actual
        reason_options:
          - id: actual
            text: Take −ln of the probability given to the label that occurred.
          - id: square
            text: Square the gap between the score z and the label.
          - id: always
            text: Take −ln of the class-1 probability, whatever the label.
    absolute_tolerance: 0.02
    numeric_fields:
      - id: score
        label: Score z
      - id: probability
        label: Probability of class 1
      - id: loss
        label: Cross-entropy loss
  - id: logistic-regression.transfer.v2
    objective_ref: objective.logistic-regression
    task: transfer
    response_type: single_choice
    points: 1
    hint: Keep three jobs apart. The score is log-odds, the sigmoid turns it into a probability, and the threshold comes from what each kind of mistake costs.
    remediation_scene: logistic-regression.s4
    variants:
      - id: logistic-regression.transfer.v2.1
        prompt: A bank's fraud model outputs calibrated probabilities. Reviewing a flagged payment costs $2, and letting a fraudulent one through costs $50. Above what probability should a payment be flagged?
        options:
          - id: a
            text: Above 0.5, since flagging makes sense once fraud is likelier than not
          - id: b
            text: Above 0.04, since a review costs 2/50 of a missed fraud
          - id: c
            text: Above 0.96, since reviews should be kept for near-certain fraud
        answer: b
        feedback: Flag when the expected loss of not flagging, 50p, exceeds the review cost of 2, so p > 2/50 = 0.04. The 0.5 default assumes both mistakes cost the same, which is far from true here.
      - id: logistic-regression.transfer.v2.2
        prompt: 'A hospital risk model ranks patients well: those who develop the condition nearly always score higher than those who don''t. But among patients it scores 0.8, only half develop the condition. What is the problem?'
        options:
          - id: c
            text: It discriminates well, but its probabilities are too high
          - id: b
            text: It ranks patients poorly, so it needs better features
          - id: a
            text: Nothing, since 0.8 and 0.5 are both above the usual cutoff
        answer: c
        feedback: Good ranking is discrimination; matching stated probabilities to real rates is calibration, and 0.8 against an observed 0.5 is miscalibrated. The ranking itself is fine, so new features aren't the first fix.
      - id: logistic-regression.transfer.v2.3
        prompt: In a spam model, the feature "contains a link" (1 or 0) has weight 0.7. Everything else being equal, what does adding a link do?
        options:
          - id: c
            text: It adds 0.7 to the probability that the email is spam
          - id: a
            text: It multiplies the odds of spam by e^0.7, about 2
          - id: b
            text: It multiplies the probability of spam by about 2
        answer: a
        feedback: A weight adds to the log-odds, so it multiplies the odds by e^0.7 ≈ 2.01. It can't double a probability in general (0.6 would become 1.2), and adding 0.7 to a probability confuses the score scale with the probability scale.
      - id: logistic-regression.transfer.v2.4
        prompt: 'On a rainy day, model A says P(rain) = 0.6 and model B says 0.99. On a dry day, A says 0.4 and B says 0.99. Which has the lower total cross-entropy over the two days?'
        options:
          - id: b
            text: B, since it was nearly perfect on the rainy day
          - id: a
            text: They tie, since the loss only checks which side of 0.5 each is on
          - id: c
            text: A, since B's confident miss alone costs about 4.6
        answer: c
        feedback: A pays −ln 0.6 twice, about 1.02. B pays −ln 0.99 ≈ 0.01 on the rainy day but −ln 0.01 ≈ 4.61 on the dry day. Cross-entropy uses the probabilities themselves, not just which side of 0.5 they fall on.
      - id: logistic-regression.transfer.v2.5
        prompt: Users of a well-calibrated spam filter complain that real emails keep landing in the junk folder, while hardly any spam reaches the inbox. What is the quickest sensible fix?
        options:
          - id: c
            text: Lower the probability needed to send an email to junk
          - id: a
            text: Retrain the model on a larger set of spam examples
          - id: b
            text: Raise the probability needed to send an email to junk
        answer: b
        feedback: The complaint is about false alarms, so the junk cutoff should go up, with no retraining needed. Lowering it would send even more real emails to junk, and more spam examples wouldn't address a cutoff that's set too low.
