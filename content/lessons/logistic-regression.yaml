schema_version: 0.2-draft
lesson:
  id: logistic-regression
  version: 0.1.0-draft
  title: Turn a linear score into a class probability
  state: draft
  summary: Logistic regression maps a linear score through a sigmoid for binary classification; fitting probabilities
    and choosing an action threshold are different steps.
  slot: M07.2
  category: learning
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.logistic-regression
  version: 1-draft
  statement: Logistic regression maps a linear score through a sigmoid for binary classification; fitting probabilities
    and choosing an action threshold are different steps.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - logistic-regression.base
  - logistic-regression.transfer
  prerequisites:
  - anyOf:
    - objective.prediction
  - anyOf:
    - objective.probability
  - anyOf:
    - objective.powers-logs
scenes:
- id: logistic-regression.s1
  title: Begin with a score
  type: explanation
  depth: intuition
  objective_refs:
  - objective.logistic-regression
  markdown: 'A linear score combines features as z = w · x + b: a weighted sum plus bias. Logistic regression transforms
    z with the sigmoid, 1 divided by (1 + exp(−z)). The output lies between 0 and 1 and is modeled as the probability
    of one class.'
  text_mode: 'A linear score combines features as z = w · x + b: a weighted sum plus bias. Logistic regression transforms
    z with the sigmoid, 1 divided by (1 + exp(−z)). The output lies between 0 and 1 and is modeled as the probability
    of one class.'
  bridges: []
- id: logistic-regression.s2
  title: Read the transformation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.logistic-regression
  markdown: At z = 0, exp(0) = 1, so probability is 1/2. A positive score gives probability above 1/2; a negative
    score gives below 1/2. The log odds, log(p/(1 − p)), equals z in this model. This is linear in the supplied
    features, not necessarily in their original raw representation.
  text_mode: At z = 0, exp(0) = 1, so probability is 1/2. A positive score gives probability above 1/2; a negative
    score gives below 1/2. The log odds, log(p/(1 − p)), equals z in this model. This is linear in the supplied
    features, not necessarily in their original raw representation.
  bridges:
  - powers-logs
  - probability
- id: logistic-regression.s3
  title: Fit with a probability-sensitive loss
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.logistic-regression
  markdown: Binary cross-entropy penalizes assigning low probability to the observed class. For a positive example,
    predicting 0.9 is penalized less than predicting 0.1. Optimization adjusts weights across training examples.
    Regularization can limit extreme coefficients and help when data is sparse or features are correlated.
  text_mode: Binary cross-entropy penalizes assigning low probability to the observed class. For a positive example,
    predicting 0.9 is penalized less than predicting 0.1. Optimization adjusts weights across training examples.
    Regularization can limit extreme coefficients and help when data is sparse or features are correlated.
  bridges: []
- id: logistic-regression.s4
  title: Separate classification from calibration
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.logistic-regression
  markdown: A threshold such as 0.5 converts probability to a class decision, but the best threshold depends on
    costs and prevalence. A linear decision boundary may underfit complex patterns. Evaluate discrimination, calibration,
    and error types on held-out data; a probability-looking number is not automatically well calibrated.
  text_mode: A threshold such as 0.5 converts probability to a class decision, but the best threshold depends on
    costs and prevalence. A linear decision boundary may underfit complex patterns. Evaluate discrimination, calibration,
    and error types on held-out data; a probability-looking number is not automatically well calibrated.
  bridges: []
- id: logistic-regression.check
  title: Review and check your understanding
  type: assessment
