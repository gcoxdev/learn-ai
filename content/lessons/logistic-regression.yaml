scenes:
  - id: logistic-regression.s1
    title: Rain jacket or not?
    type: explanation
    depth: intuition
    objective_refs:
      - objective.logistic-regression
    markdown: |-
      Sam cycles to work. At 7 a.m. her weather station reads 75% humidity. Should she pack her rain jacket? She wants the chance of rain, a number between 0 and 1, to weigh against the hassle of carrying it.

      Could last lesson's linear regression do it? Write rain as 1 and dry as 0, and fit a line. But lines keep going: at 100% humidity it might predict 1.4, and at 30%, −0.5. Neither is a probability.

      **Logistic regression** keeps the linear part and fixes the output. It computes a score exactly as before, $z = wx + b$, then squashes the score into the range 0 to 1. Despite the name, it's a method for **binary classification**: choosing between two classes, here rain and dry.

      :::story Two ideas from 1958
      In 1958 Frank Rosenblatt described the perceptron: a weighted score followed by a hard step, outputting 1 if the score is above zero and 0 otherwise. That same year the statistician David Cox published "The regression analysis of binary sequences," which puts the score through a smooth S-curve instead. The smooth version gives probabilities and can be trained by following gradients; a neural-network unit with a sigmoid activation is exactly this model.
      :::
    bridges: []
  - id: logistic-regression.s2
    title: Squash the score into a probability
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.logistic-regression
    markdown: |-
      The **sigmoid**, also called the logistic function, turns any score into a number between 0 and 1:

      $$\sigma(z) = \frac{1}{1 + e^{-z}}$$

      Here $e \approx 2.718$ (the powers-and-logs side lesson covers it). Large positive scores give nearly 1, large negative scores nearly 0, and a score of 0 gives exactly 1/(1 + 1) = 0.5. Try Sam's hand-set rule, z = 0.2 × humidity − 14:

      | Humidity | Score z | P(rain) = σ(z) |
      | ---: | ---: | ---: |
      | 60% | −2 | 0.12 |
      | 70% | 0 | 0.50 |
      | 75% | 1 | 0.73 |
      | 80% | 2 | 0.88 |

      :::predict What does the rule say at 85% humidity?
      z = 0.2 × 85 − 14 = 3, and σ(3) ≈ 0.95. Each 5 points adds 1 to the score, but the probability climbs more slowly near 1: +0.23 from 70% to 75%, only +0.07 from 80% to 85%.
      :::

      So what does the score itself mean? The **odds** of rain are p / (1 − p), how many times likelier rain is than dry. At p = 0.75 the odds are 3 to 1. Undo the sigmoid and you find that the score is the logarithm of the odds, the **log-odds** (or logit):

      $$\ln\frac{p}{1-p} = z = wx + b$$

      The model is linear in the log-odds, not in the probability. Adding 1 to z multiplies the odds by $e$, about 2.7, so each extra 5 points of humidity multiplies Sam's odds of rain by 2.7.
    bridges:
      - powers-logs
      - probability
  - id: logistic-regression.s3
    title: Score probabilities with cross-entropy
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.logistic-regression
    markdown: |-
      To fit w and b, we need a loss that rewards putting high probability on what actually happened. **Binary cross-entropy**, also called log loss, does exactly that. Write $y = 1$ for rain, $y = 0$ for dry, and $p$ for the predicted chance of rain:

      $$L = -\big[\,y \ln p + (1 - y)\ln(1 - p)\,\big]$$

      Only one term survives on any day: −ln p on a rainy day, −ln(1 − p) on a dry one.

      | It rained, and the model said | Loss |
      | --- | ---: |
      | P(rain) = 0.9 | −ln 0.9 = 0.11 |
      | P(rain) = 0.5 | −ln 0.5 = 0.69 |
      | P(rain) = 0.1 | −ln 0.1 = 2.30 |

      A confident wrong answer costs over 20 times as much as a confident right one, and the loss has no ceiling as p heads toward 0.

      Pleasant surprise: the gradient of this loss with respect to w (its slope as w changes) is (p − y) × x, prediction minus target times the input, the same shape as in linear regression. **Gradient descent** repeatedly nudges w and b a small step downhill, against their gradients. Here it learns from nine of Sam's mornings:

      ```python run
      import numpy as np

      humidity = np.array([50, 55, 60, 65, 70, 75, 80, 85, 90])  # morning humidity, %
      rain     = np.array([ 0,  0,  0,  1,  1,  0,  1,  1,  1])  # 1 = it rained later
      x = (humidity - 70) / 5          # steps of 5 points above 70%

      w, b, lr = 0.0, 0.0, 0.5
      for step in range(201):
          p = 1 / (1 + np.exp(-(w * x + b)))            # sigmoid of the score
          loss = -np.mean(rain * np.log(p) + (1 - rain) * np.log(1 - p))
          if step in (0, 1, 10, 200):
              print(f"step {step:3d}: w = {w:.2f}, b = {b:.2f}, loss = {loss:.3f}")
          w -= lr * np.mean((p - rain) * x)             # same shape as linear regression:
          b -= lr * np.mean(p - rain)                   # (prediction - target) x input

      for h in (60, 70, 80):
          z = w * (h - 70) / 5 + b
          print(f"{h}% humidity -> P(rain) = {1 / (1 + np.exp(-z)):.2f}")
      ```

      The loss starts at 0.693 and settles at 0.394, with w = 0.86 and b = 0.45. The learned model gives a 22% chance of rain at 60% humidity and 90% at 80%. Now change the 70% morning's label from 1 to 0 and rerun: the intercept flips to −0.45, and every probability drops.

      :::papers Logistic regression in one line
      With $p_i = \sigma(\mathbf{w}^\top \mathbf{x}_i + b)$, training minimizes the average cross-entropy, whose gradient is prediction minus target, times the input:

      $$\mathcal{L} = -\frac{1}{n}\sum_{i=1}^n \big[y_i \ln p_i + (1-y_i)\ln(1-p_i)\big], \qquad \frac{\partial \mathcal{L}}{\partial \mathbf{w}} = \frac{1}{n}\sum_{i=1}^n (p_i - y_i)\,\mathbf{x}_i$$

      Minimizing this loss is the same as maximizing the *likelihood*, the probability the model gives to the labels actually observed. Unlike least squares, there's no closed-form answer, so it's fitted step by step. The program's first loss, 0.693, is ln 2: every $p_i$ starts at 0.5.
      :::
    bridges: []
  - id: logistic-regression.s4
    title: The cutoff is a separate decision
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.logistic-regression
    markdown: |-
      The model gives a probability, but Sam still has to act. A **threshold** is the cutoff where she switches: pack the jacket when P(rain) is above it. The familiar 0.5 is right only when both mistakes cost the same.

      For Sam they don't. Carrying the jacket costs 1 unit of hassle, rain or shine; getting soaked costs 5. Packing is worth it when the expected cost of not packing, 5p, is more than 1:

      $$5p > 1 \quad\Longrightarrow\quad p > 0.2$$

      At 60% humidity the learned model says 0.22, so Sam packs the jacket even though rain is unlikely. A colleague who doesn't mind getting wet could use the same model with a cutoff of 0.6. Nothing is retrained; only the decision rule changes.

      :::mixup "The model says 0.9, so it will rain on about 90% of mornings like this."
      That holds only if the model is **calibrated**: among all mornings it calls 0.9, it really rains on about 90%. Weather forecasters check their forecasts exactly this way. Calibration differs from **discrimination**, which asks whether rainy mornings get higher scores than dry ones. A model can rank mornings perfectly and still say 0.9 when the true rate is 0.6. The sigmoid only keeps the number between 0 and 1, so check calibration on mornings the model didn't train on, and check again when the season or the city changes.
      :::
    bridges: []
  - id: logistic-regression.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.logistic-regression
    markdown: Compute scores, sigmoid probabilities, and log losses by hand, then set cutoffs and read log-odds for fraud alerts, spam filters, and medical risk scores.
    takeaway: |-
      Logistic regression passes a weighted score through the sigmoid to get a probability, and it is trained with cross-entropy. Where to set the cutoff for action is a separate decision, based on what each mistake costs.
  - id: logistic-regression.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.logistic-regression
    markdown: |-
      Logistic regression turns a weighted score into a probability using the sigmoid. Training the probability model and choosing when to flag a case are separate decisions.
