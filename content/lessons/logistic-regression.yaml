assessment_families:
- id: logistic-regression.base
  objective_ref: objective.logistic-regression
  task: base
  response_type: single_choice
  points: 1
  hint: 'Read the transformation: trace the inputs, operation, and result before choosing.'
  remediation_scene: logistic-regression.s2
  variants:
  - id: logistic-regression.base.1
    prompt: What probability does sigmoid give a score of zero?
    options:
    - id: c
      text: '1'
    - id: a
      text: '0.5'
    - id: b
      text: '0'
    answer: a
    feedback: The denominator is 1 + exp(0) = 2.
  - id: logistic-regression.base.2
    prompt: For a positive labeled example, which prediction has lower log loss?
    options:
    - id: a
      text: '0.9'
    - id: b
      text: '0.1'
    - id: c
      text: Both always equal
    answer: a
    feedback: Higher assigned probability to the observed positive class reduces its negative log probability.
- id: logistic-regression.transfer
  objective_ref: objective.logistic-regression
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Separate classification from calibration: trace the inputs, operation, and result before choosing.'
  remediation_scene: logistic-regression.s4
  variants:
  - id: logistic-regression.transfer.1
    prompt: Reviewing false positives becomes much cheaper than missing positives. What might change without retraining?
    options:
    - id: a
      text: The decision threshold
    - id: b
      text: The definition of multiplication
    - id: c
      text: Every input label automatically
    answer: a
    feedback: Decision costs can justify a different threshold on the same probabilities.
  - id: logistic-regression.transfer.2
    prompt: A sigmoid output is 0.95 on unfamiliar data. What is still unproven?
    options:
    - id: b
      text: That it is between zero and one
    - id: c
      text: That the score was transformed
    - id: a
      text: That the probability is calibrated in that environment
    answer: a
    feedback: Range constraints do not establish empirical calibration.
