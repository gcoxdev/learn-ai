schema_version: 0.2-draft
lesson:
  id: localization-mapping-and-slam
  version: 0.3.0-draft
  title: Estimate where the robot is while learning the map
  state: draft
  summary: Estimate a robot’s location while building the map it relies on.
  slot: M30.3
  category: learning
  sources:
  - title: Modern Robotics — authors’ textbook and resources
    url: https://modernrobotics.northwestern.edu/nu-gm-book-resource/
  - title: Past, Present, and Future of SLAM
    url: https://arxiv.org/abs/1606.05830
objectives:
- id: objective.localization-mapping-and-slam
  version: 1-draft
  statement: Localization estimates pose, mapping estimates surroundings, and SLAM couples both; uncertain
    measurements, data association, and loop closure determine the reliability of the joint estimate.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - localization-mapping-and-slam.base
  - localization-mapping-and-slam.transfer
  prerequisites:
  - anyOf:
    - objective.robot-sensors-and-frames
  - anyOf:
    - objective.state-estimation
scenes:
- id: localization-mapping-and-slam.s1
  title: Two unknowns depend on each other
  type: explanation
  depth: intuition
  objective_refs:
  - objective.localization-mapping-and-slam
  markdown: 'A robot’s **pose** is its position and orientation: where it is and which way it faces. To place
    a landmark on a map, it needs that pose. To infer pose from landmarks, it needs a map. **Simultaneous localization
    and mapping**, or **SLAM**, estimates these together from motion and sensor observations, often retaining
    uncertainty and constraints between poses and landmarks.'
  text_mode: 'A robot’s **pose** is its position and orientation: where it is and which way it faces. To place
    a landmark on a map, it needs that pose. To infer pose from landmarks, it needs a map. **Simultaneous localization
    and mapping**, or **SLAM**, estimates these together from motion and sensor observations, often retaining
    uncertainty and constraints between poses and landmarks.'
  bridges: []
- id: localization-mapping-and-slam.s2
  title: Predict then correct
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.localization-mapping-and-slam
  markdown: 'Wheel motion or inertial measurements predict movement, but accumulated bias causes drift. Visual
    or range observations can correct estimates when matched to known structure. Filters, particle methods,
    and graph optimization are different computational approaches with distinct assumptions and scaling costs.


    If wheel readings overestimate each one-meter move by 0.02 meter, ten such moves produce 0.2 meter of accumulated
    distance error. Matching a visible doorway to the same doorway on the map can constrain that drift. Deciding
    which observation belongs to which landmark is data association. Without an external reference, a consistent
    map can still have an arbitrary overall origin and orientation.'
  text_mode: 'Wheel motion or inertial measurements predict movement, but accumulated bias causes drift. Visual
    or range observations can correct estimates when matched to known structure. Filters, particle methods,
    and graph optimization are different computational approaches with distinct assumptions and scaling costs.


    If wheel readings overestimate each one-meter move by 0.02 meter, ten such moves produce 0.2 meter of accumulated
    distance error. Matching a visible doorway to the same doorway on the map can constrain that drift. Deciding
    which observation belongs to which landmark is data association. Without an external reference, a consistent
    map can still have an arbitrary overall origin and orientation.'
  bridges: []
- id: localization-mapping-and-slam.s3
  title: Associate observations carefully
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.localization-mapping-and-slam
  markdown: Two similar-looking corridors can create an incorrect landmark match. Loop closure recognizes a
    previously visited place and adds a constraint that can reduce accumulated drift. A false loop closure
    can distort the map, so matching confidence and geometric consistency checks matter.
  text_mode: Two similar-looking corridors can create an incorrect landmark match. Loop closure recognizes
    a previously visited place and adds a constraint that can reduce accumulated drift. A false loop closure
    can distort the map, so matching confidence and geometric consistency checks matter.
  bridges: []
- id: localization-mapping-and-slam.s4
  title: Evaluate the usable map
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.localization-mapping-and-slam
  markdown: Compare pose trajectories, map consistency, uncertainty, and performance under changed lighting,
    moving objects, or textureless scenes. A visually attractive reconstruction may still contain localization
    errors. State whether scale is observable from the available sensors and what coordinate frame defines
    the result.
  text_mode: Compare pose trajectories, map consistency, uncertainty, and performance under changed lighting,
    moving objects, or textureless scenes. A visually attractive reconstruction may still contain localization
    errors. State whether scale is observable from the available sensors and what coordinate frame defines
    the result.
  bridges: []
- id: localization-mapping-and-slam.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.localization-mapping-and-slam
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: SLAM estimates the robot’s pose and its map together. Correct landmark matches and loop closures
    can reduce drift; mistaken matches can distort both estimates.
- id: localization-mapping-and-slam.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.localization-mapping-and-slam
  markdown: SLAM estimates the robot’s pose and its map together. Correct landmark matches and loop closures
    can reduce drift; mistaken matches can distort both estimates.
  text_mode: SLAM estimates the robot’s pose and its map together. Correct landmark matches and loop closures
    can reduce drift; mistaken matches can distort both estimates.
