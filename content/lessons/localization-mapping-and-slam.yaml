schema_version: 0.2-draft
lesson:
  id: localization-mapping-and-slam
  version: 0.4.0-draft
  title: Estimate where the robot is while learning the map
  state: draft
  summary: Tidy drives one lap of the kitchen and its wheels swear it's home, yet it's 17 cm off. See how robots catch their own drift and build a map at the same time.
  slot: M30.3
  category: learning
  sources:
    - title: Modern Robotics — authors’ textbook and resources
      url: https://modernrobotics.northwestern.edu/nu-gm-book-resource/
    - title: "Past, Present, and Future of Simultaneous Localization and Mapping (Cadena et al., 2016)"
      url: https://arxiv.org/abs/1606.05830
    - title: "Monte Carlo Localization for Mobile Robots (Dellaert, Fox, Burgard & Thrun, ICRA 1999)"
      url: https://doi.org/10.1109/ROBOT.1999.772544
objectives:
  - id: objective.localization-mapping-and-slam
    version: 2-draft
    statement: Compute odometry drift, explain how a Kalman or particle filter corrects a pose with landmarks, update an occupancy grid, and explain how loop closure in SLAM spreads accumulated error, and how a false closure breaks the map.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - localization-mapping-and-slam.base.v2
      - localization-mapping-and-slam.transfer.v2
      - localization-mapping-and-slam.calculate
    prerequisites:
      - anyOf:
          - objective.robot-sensors-and-frames
      - anyOf:
          - objective.state-estimation
scenes:
  - id: localization-mapping-and-slam.s1
    title: Wheels that slowly lie
    type: explanation
    depth: intuition
    objective_refs:
      - objective.localization-mapping-and-slam
    markdown: |-
      Tidy's **pose** is its position and heading on the kitchen floor: $(x, y, \theta)$. The simplest way to track it is **odometry**: count wheel-encoder ticks, turn them into distance and turning, and add up every little move. Tidy's wheels have a 0.3 m circumference and 1,000 ticks per turn, so 5,000 ticks means 1.5 m.

      Odometry never jumps, but it drifts, because every small error is added forever:

      | Error | Size | After driving |
      | --- | --- | --- |
      | Tires worn 1% smaller than the software thinks | 1% of distance | 20 m lap: 0.2 m |
      | Heading off by 2° after a slip on a wet tile | $d \sin 2°$ sideways | 5 m straight: $5 \times 0.0349 \approx 0.17$ m |

      Heading errors are the dangerous kind. A 2° mistake is invisible at first, but every meter afterwards carries Tidy further sideways. One slip on a wet tile 5 m before the end of a lap is enough: the wheels "swear" Tidy is home, but it's 17 cm off, too far to dock with its charger.

      The cure is to notice things: the fridge's edge, a doorway, a table leg, whose positions are known. To place those on a map, though, Tidy needs its pose, and to fix its pose it needs the map. Doing both together is **simultaneous localization and mapping (SLAM)**.
    bridges: []
  - id: localization-mapping-and-slam.s2
    title: Predict with the wheels, correct with the fridge
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.localization-mapping-and-slam
    markdown: |-
      First suppose the map is known. The Kalman filter from the lesson on tracking a hidden state does the job: predict with the motion, then update with a reading.

      Tidy drives 10 m down the counter, and each meter adds $0.01\ \text{m}^2$ of variance to its position. After 10 m the variance is 0.1 (a standard deviation of about 0.32 m). Then its lidar sees the fridge's edge, whose position is on the map, with measurement variance 0.01:

      $$K = \frac{0.1}{0.1 + 0.01} = 0.909, \qquad P = (1 - 0.909) \times 0.1 = 0.0091$$

      The standard deviation drops from 0.32 m to 0.095 m in one reading. The fridge reading's variance is ten times smaller than the odometry estimate's, so the filter moves 91% of the way toward it.

      A real pose has a heading, and moving forward by $d$ changes $x$ by $d\cos\theta$: not a straight-line (linear) rule. The **extended Kalman filter (EKF)** handles that by linearizing, approximating the curve by its tangent at the current estimate.

      :::papers The EKF, one predict and one update
      $$\hat{x}^- = f(\hat{x}, u), \qquad P^- = F P F^\top + Q$$
      $$K = P^- H^\top (H P^- H^\top + R)^{-1}, \qquad \hat{x} \leftarrow \hat{x}^- + K\big(z - h(\hat{x}^-)\big), \qquad P \leftarrow (I - KH)P^-$$

      $f$ is the motion model and $h$ predicts what the lidar should see; $F$ and $H$ are their Jacobians (slopes) at the current estimate. In our one-dimensional drive along the counter, $F = H = 1$, $P^- = 0.1$, $R = 0.01$, so $K = 0.909$ and $P = 0.0091$, exactly as above.
      :::
    bridges: []
  - id: localization-mapping-and-slam.particles
    title: A thousand guesses, one hallway
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.localization-mapping-and-slam
    markdown: |-
      A Kalman filter keeps one best guess with a spread. That fails when Tidy is switched on and has *no idea* where it is, or when two spots look alike. A **particle filter** keeps thousands of guesses (particles) instead. Every step it:

      1. **moves** each particle by the odometry, plus a little random noise;
      2. **weights** each particle by how well it explains the sensor reading;
      3. **resamples**: draws a new set, copying heavy particles and dropping light ones.

      Used for robot localization, this is **Monte Carlo localization** (Dellaert, Fox, Burgard & Thrun, 1999). Below, Tidy wakes up somewhere in a 10 m hallway with open doorways at 2, 3, and 7 m, and a side sensor that says "doorway" or "wall" correctly 90% of the time.

      ```python run
      import numpy as np

      rng = np.random.default_rng(1)
      doorways = np.array([2.0, 3.0, 7.0])        # open doorways along a 10 m hallway
      def near_door(x):                           # within 0.3 m of any doorway?
          return (np.abs(x[:, None] - doorways) < 0.3).any(axis=1)

      particles = rng.uniform(0, 10, 2000)        # Tidy has no idea where it is: guesses everywhere
      true_x = 0.0
      for step in range(1, 8):
          true_x += 1.0                                            # Tidy drives 1 m
          particles += 1.0 + rng.normal(0, 0.1, particles.size)    # predict: move every guess, add noise
          seen = near_door(np.array([true_x]))[0]                  # sensor: doorway or wall?
          weights = np.where(near_door(particles) == seen, 0.9, 0.1)   # update: 90%-reliable sensor
          particles = rng.choice(particles, particles.size, p=weights / weights.sum())  # resample
          share = np.mean(np.abs(particles - true_x) < 0.5)
          print(f"step {step}: at {true_x:.0f} m, sees {'doorway' if seen else 'wall   '}, "
                f"{share:4.0%} of guesses within 0.5 m")
      ```

      One doorway could be any of three; two doorways 1 m apart happen only at 2–3 m, so the share jumps to 55%. The doorway at 7 m confirms it: 89%. Try a flakier sensor, weights `0.7, 0.3` instead of `0.9, 0.1`, and watch the guesses take longer to agree.
    bridges: []
  - id: localization-mapping-and-slam.s3
    title: Build the map, then close the loop
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.localization-mapping-and-slam
    markdown: |-
      Now the map itself. An **occupancy grid** (Moravec & Elfes, 1985) splits the floor into cells, say 5 cm square, each holding the probability that something is there. Each lidar beam that ends in a cell is a "hit"; each beam that passes through is a "miss". Grids store **log-odds**, $\ln\frac{p}{1-p}$, so each reading just adds: $+0.847$ for a hit and $-0.847$ for a miss ($\pm\ln\frac{0.7}{0.3}$). Every cell starts at 0, which means $p = 0.5$. A cell that gets hit, hit, hit, miss sits at $2 \times 0.847 = 1.69$, which is $p \approx 0.845$: probably a chair leg.

      While mapping, Tidy's pose still drifts. **Graph-based SLAM** stores each pose as a node, links consecutive poses with odometry edges ("moved 5 m, turned 90°"), and then finds the poses that best fit all the edges at once.

      Tidy drives a square lap of four 5 m legs. Odometry says it ends 0.4 m from where it started. Then the camera recognizes the starting doorway: a **loop closure**, a new edge saying "this pose is the start pose". The optimizer can't satisfy every edge exactly, so it spreads the 0.4 m gap across the loop, about 0.1 m per leg when all legs are equally trusted. Every earlier pose, and every wall mapped from it, shifts into place.

      :::mixup "More loop closures always make the map better."
      A *wrong* closure is poison. Two identical cabinet doors, or warehouse aisles that look the same, can convince the robot it's somewhere it isn't. The optimizer then bends the whole map to glue two different places together. Real systems check that the geometry agrees before accepting a closure, and use robust costs that down-weight edges that don't fit.
      :::
    diagram:
      caption: A pose graph for one lap. The loop-closure edge pulls the drifted end back to the start.
      description: Four poses P0 to P3 and an end pose P4 are linked in order by odometry edges, each saying moved 5 m and turned. A dashed loop-closure edge links P4 back to P0, saying they are the same place. The optimizer spreads the 0.4 m gap across all edges.
      nodes:
        - id: p0
          label: P0, start
          col: 0
          row: 0
          tone: accent
        - id: p1
          label: P1
          col: 2
          row: 0
        - id: p2
          label: P2
          col: 2
          row: 2
        - id: p3
          label: P3
          col: 0
          row: 2
        - id: p4
          label: P4, end
          note: odometry says 0.4 m from P0
          col: 0
          row: 1
          tone: warn
      edges:
        - from: p0
          to: p1
          label: odometry, 5 m
        - from: p1
          to: p2
          label: odometry, 5 m
        - from: p2
          to: p3
          label: odometry, 5 m
        - from: p3
          to: p4
          label: odometry, 5 m
        - from: p4
          to: p0
          label: loop closure, same place
          dashed: true
    bridges: []
  - id: localization-mapping-and-slam.s4
    title: Check the map against the floor
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.localization-mapping-and-slam
    markdown: |-
      A map can look crisp and still be wrong. To test Tidy, tape five markers on the floor, measure their true positions, and drive past them. Compare where the robot *thinks* it is at each marker with where it really is:

      | Marker | 1 | 2 | 3 | 4 | 5 |
      | --- | ---: | ---: | ---: | ---: | ---: |
      | Position error (m) | 0.02 | 0.03 | 0.02 | 0.11 | 0.03 |

      The typical error is 2–3 cm, but marker 4 is 11 cm off, and that's the one to investigate. It sits by the glass oven door, which lidar sees poorly. Test again with the chairs moved and the lights dimmed, since kitchens change daily.
    bridges: []
  - id: localization-mapping-and-slam.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.localization-mapping-and-slam
    markdown: Work out how far odometry drifts, then diagnose a warehouse whose map folds in half, a cafeteria full of ghost obstacles, and a lawn mower with GPS.
    takeaway: |-
      Odometry drifts, and heading errors grow with distance. Landmarks correct the pose, particles handle "I could be anywhere", and a correct loop closure spreads accumulated error back around the map, while a false one bends it.
  - id: localization-mapping-and-slam.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.localization-mapping-and-slam
    markdown: |-
      SLAM estimates the robot’s pose and its map together. Correct landmark matches and loop closures can reduce drift; mistaken matches can distort both estimates.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - localization-mapping-and-slam.s1
        - localization-mapping-and-slam.s2
        - localization-mapping-and-slam.particles
        - localization-mapping-and-slam.s3
        - localization-mapping-and-slam.s4
