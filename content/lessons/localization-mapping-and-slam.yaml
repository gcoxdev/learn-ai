schema_version: 0.2-draft
lesson:
  id: localization-mapping-and-slam
  version: 0.1.0-draft
  title: Estimate where the robot is while learning the map
  state: draft
  summary: Localization estimates pose, mapping estimates surroundings, and SLAM couples both; uncertain measurements,
    data association, and loop closure determine the reliability of the joint estimate.
  slot: M30.3
  category: learning
  minutes: 12
  sources:
  - title: Modern Robotics — authors’ textbook and resources
    url: https://modernrobotics.northwestern.edu/nu-gm-book-resource/
  - title: Past, Present, and Future of SLAM
    url: https://arxiv.org/abs/1606.05830
objectives:
- id: objective.localization-mapping-and-slam
  version: 1-draft
  statement: Localization estimates pose, mapping estimates surroundings, and SLAM couples both; uncertain measurements,
    data association, and loop closure determine the reliability of the joint estimate.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - localization-mapping-and-slam.base
  - localization-mapping-and-slam.transfer
  prerequisites:
  - anyOf:
    - objective.robot-sensors-and-frames
  - anyOf:
    - objective.state-estimation
scenes:
- id: localization-mapping-and-slam.s1
  title: Two unknowns depend on each other
  type: explanation
  depth: intuition
  objective_refs:
  - objective.localization-mapping-and-slam
  markdown: To place a landmark on a map, a robot needs its pose. To infer pose from landmarks, it needs a map.
    Simultaneous localization and mapping estimates these together from motion and sensor observations, often retaining
    uncertainty and constraints between poses and landmarks.
  text_mode: To place a landmark on a map, a robot needs its pose. To infer pose from landmarks, it needs a map.
    Simultaneous localization and mapping estimates these together from motion and sensor observations, often retaining
    uncertainty and constraints between poses and landmarks.
  bridges: []
- id: localization-mapping-and-slam.s2
  title: Predict then correct
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.localization-mapping-and-slam
  markdown: Wheel motion or inertial measurements predict movement, but accumulated bias causes drift. Visual or
    range observations can correct estimates when matched to known structure. Filters, particle methods, and graph
    optimization are different computational approaches with distinct assumptions and scaling costs.
  text_mode: Wheel motion or inertial measurements predict movement, but accumulated bias causes drift. Visual or
    range observations can correct estimates when matched to known structure. Filters, particle methods, and graph
    optimization are different computational approaches with distinct assumptions and scaling costs.
  bridges: []
- id: localization-mapping-and-slam.s3
  title: Associate observations carefully
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.localization-mapping-and-slam
  markdown: Two similar-looking corridors can create an incorrect landmark match. Loop closure recognizes a previously
    visited place and adds a constraint that can reduce accumulated drift. A false loop closure can distort the
    map, so matching confidence and geometric consistency checks matter.
  text_mode: Two similar-looking corridors can create an incorrect landmark match. Loop closure recognizes a previously
    visited place and adds a constraint that can reduce accumulated drift. A false loop closure can distort the
    map, so matching confidence and geometric consistency checks matter.
  bridges: []
- id: localization-mapping-and-slam.s4
  title: Evaluate the usable map
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.localization-mapping-and-slam
  markdown: Compare pose trajectories, map consistency, uncertainty, and performance under changed lighting, moving
    objects, or textureless scenes. A visually attractive reconstruction may still contain localization errors.
    State whether scale is observable from the available sensors and what coordinate frame defines the result.
  text_mode: Compare pose trajectories, map consistency, uncertainty, and performance under changed lighting, moving
    objects, or textureless scenes. A visually attractive reconstruction may still contain localization errors.
    State whether scale is observable from the available sensors and what coordinate frame defines the result.
  bridges: []
- id: localization-mapping-and-slam.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.localization-mapping-and-slam
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Localization estimates pose, mapping estimates surroundings, and SLAM couples both; uncertain measurements,
    data association, and loop closure determine the reliability of the joint estimate.
- id: localization-mapping-and-slam.recap
  title: One idea to take with you
  type: recap
