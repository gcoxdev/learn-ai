      gate_refs:
        - gate.core
  scene_aliases:
    localization-mapping-and-slam.recap: localization-mapping-and-slam.check
assessment_families:
  - id: localization-mapping-and-slam.base
    objective_ref: objective.localization-mapping-and-slam
    task: base
    response_type: single_choice
    points: 1
    hint: 'Predict then correct: trace the inputs, operation, and result before choosing.'
    remediation_scene: localization-mapping-and-slam.s2
    variants:
      - id: localization-mapping-and-slam.base.1
        prompt: What makes SLAM coupled?
        options:
          - id: c
            text: Mapping requires no observations
          - id: a
            text: Pose estimates help mapping and map estimates help localization
          - id: b
            text: Every sensor measures exact global coordinates
        answer: a
        feedback: The two unknowns constrain each other.
        retired: true
      - id: localization-mapping-and-slam.base.2
        prompt: Why does dead reckoning drift?
        options:
          - id: a
            text: Small motion-estimation errors accumulate
          - id: b
            text: Coordinates cannot represent movement
          - id: c
            text: Every wheel reading is exact
        answer: a
        feedback: Repeated uncertainty and bias compound over time.
        retired: true
  - id: localization-mapping-and-slam.transfer
    objective_ref: objective.localization-mapping-and-slam
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate the usable map: trace the inputs, operation, and result before choosing.'
    remediation_scene: localization-mapping-and-slam.s4
    variants:
      - id: localization-mapping-and-slam.transfer.1
        prompt: What is loop closure?
        options:
          - id: a
            text: Recognizing a previously visited place and adding a consistency constraint
          - id: b
            text: Stopping the robot permanently
          - id: c
            text: Resetting every landmark randomly
        answer: a
        feedback: Revisits can correct trajectory drift.
        retired: true
      - id: localization-mapping-and-slam.transfer.2
        prompt: Can an incorrect loop closure damage a map?
        options:
          - id: b
            text: 'No'
          - id: c
            text: Only if no images exist
          - id: a
            text: 'Yes'
        answer: a
        feedback: A false correspondence introduces a wrong geometric constraint.
        retired: true
  - id: localization-mapping-and-slam.base.v2
    objective_ref: objective.localization-mapping-and-slam
    task: base
    response_type: single_choice
    points: 1
    hint: "Separate the two steps: motion (odometry) always adds uncertainty, and recognizing something already on the map removes it."
    remediation_scene: localization-mapping-and-slam.s2
    variants:
      - id: localization-mapping-and-slam.base.v2.1
        prompt: Robot A overestimates distance by 1%. Robot B has a 1° heading error. Both drive 50 m in a straight line. Which ends further from where it thinks it is?
        options:
          - id: b
            text: A, since 1% of 50 m is more than one degree
          - id: a
            text: B, about 0.87 m sideways versus A's 0.5 m
          - id: c
            text: They end up about equally far off
        answer: a
        feedback: A is off by 1% × 50 = 0.5 m. B drifts sideways by 50 × sin 1° ≈ 0.87 m, and that keeps growing with every meter. Comparing "1%" with "1°" directly mixes units; you have to turn both into meters.
      - id: localization-mapping-and-slam.base.v2.2
        prompt: Tidy drives 10 m along a blank wall with no landmarks in view. What happens to its pose uncertainty, and what reduces it?
        options:
          - id: c
            text: It shrinks as more odometry readings average out the noise
          - id: b
            text: It stays level, provided the wheel encoders are well calibrated
          - id: a
            text: It grows with every move; recognizing a mapped landmark shrinks it
        answer: a
        feedback: Each predict step adds the motion noise, so variance grows as Tidy drives. Only a measurement of something whose position is known (an update) pulls it back down. Odometry readings don't average out; they add up.
      - id: localization-mapping-and-slam.base.v2.3
        prompt: A warehouse robot is powered on in an unknown aisle. Several aisles look identical to its lidar. Which localization method fits best?
        options:
          - id: a
            text: A particle filter, keeping weighted guesses in every matching aisle
          - id: b
            text: A Kalman filter started with a very large variance on its position
          - id: c
            text: An extended Kalman filter, since it linearizes the robot's motion
        answer: a
        feedback: Several look-alike aisles make the belief multi-peaked. Particles can hold a cluster in each aisle until a distinguishing feature appears. Any Kalman filter, extended or not, keeps a single bell curve, which would sit between aisles.
      - id: localization-mapping-and-slam.base.v2.4
        prompt: In graph-based SLAM, what does a correct loop-closure edge do?
        options:
          - id: b
            text: It resets the current pose to the start, leaving earlier poses as they were
          - id: c
            text: It adds a new landmark that extends the map into unexplored areas
          - id: a
            text: It ties the current pose to an earlier one, so the drift is spread along the loop
        answer: a
        feedback: The closure is a constraint between two poses. Optimizing the whole graph distributes the accumulated gap across all the odometry edges, correcting earlier poses and the map too. Just snapping the last pose would leave a kink in the map.
  - id: localization-mapping-and-slam.transfer.v2
    objective_ref: objective.localization-mapping-and-slam
    task: transfer
    response_type: single_choice
    points: 1
    hint: "Ask which source of information is failing: the drifting odometry, a noisy or misleading sensor, or a wrong match between two places."
    remediation_scene: localization-mapping-and-slam.s3
    variants:
      - id: localization-mapping-and-slam.transfer.v2.1
        prompt: A warehouse robot's map suddenly folds, with two different aisles drawn on top of each other. The aisles have identical shelving and end caps. What most likely happened?
        options:
          - id: a
            text: A false loop closure matched two look-alike places
          - id: b
            text: Wheel slip added a sudden 2° heading error
          - id: c
            text: The lidar's range was too short to see the far wall
        answer: a
        feedback: Two separate aisles merging is the signature of a wrong loop closure; the optimizer bent the map to make them coincide. Wheel slip causes gradual drift, not two places glued together. Geometric checks before accepting a closure prevent it.
      - id: localization-mapping-and-slam.transfer.v2.2
        prompt: A delivery robot maps a busy cafeteria. Its occupancy grid fills with "walls" wherever people stood. What change helps most?
        options:
          - id: c
            text: Mark every lidar hit as permanently occupied to stay on the safe side
          - id: a
            text: Let later beams that pass through a cell lower its occupancy again
          - id: b
            text: Use finer cells so that each person covers fewer of them
        answer: a
        feedback: In a log-odds grid, misses subtract. Once a person walks away, beams pass through those cells and the ghosts fade. Permanent hits make the problem worse, and finer cells just draw the ghosts in more detail.
      - id: localization-mapping-and-slam.transfer.v2.3
        prompt: A robot lawn mower has wheel odometry (smooth but drifting) and GPS (no drift, but jumps by about 1 m). How should it estimate its position?
        options:
          - id: b
            text: Use GPS alone, since drift-free matters more than smoothness
          - id: c
            text: Use odometry alone, then reset it by hand every few hours
          - id: a
            text: Predict with odometry and correct with GPS in a Kalman filter
        answer: a
        feedback: "The two sensors fail in opposite ways: odometry is smooth but drifts, GPS is noisy but anchored. A filter predicts with the wheels and pulls toward GPS by the Kalman gain, getting both benefits. Either sensor alone keeps its weakness."
      - id: localization-mapping-and-slam.transfer.v2.4
        prompt: A team says its new SLAM system "produces beautiful, sharp maps". How should you check whether its localization is accurate?
        options:
          - id: b
            text: Inspect the map image to confirm walls are straight and sharp
          - id: a
            text: Compare its pose with surveyed floor markers along a test route
          - id: c
            text: Count how many grid cells the finished map has filled in
        answer: a
        feedback: Pose error against known positions measures localization directly and shows where it fails, like a spot near glass. A map can look straight while being shifted or bent, and cell counts say nothing about accuracy.
  - id: localization-mapping-and-slam.calculate
    objective_ref: objective.localization-mapping-and-slam
    task: base
    response_type: numeric
    points: 1
    hint: "A distance error scales with distance traveled (percent × meters). A heading error pushes you sideways by distance × sin(angle)."
    remediation_scene: localization-mapping-and-slam.s1
    absolute_tolerance: 0.01
    variants:
      - id: localization-mapping-and-slam.calculate.1
        prompt: A robot's odometry overestimates every distance by 1%. It drives 30 m. How far off is its distance estimate, in meters?
        answer: 0.3
        feedback: "1% of 30 m = 0.01 × 30 = 0.3 m."
      - id: localization-mapping-and-slam.calculate.2
        prompt: After a wheel slip, a robot's heading estimate is off by 3°. It then drives 10 m straight. About how far sideways is it from where it thinks it is, in meters? (sin 3° ≈ 0.0523)
        answer: 0.523
        feedback: "Sideways error = 10 × sin 3° ≈ 10 × 0.0523 = 0.523 m."
      - id: localization-mapping-and-slam.calculate.3
        prompt: A robot's wheels have a 0.3 m circumference and its encoders count 1,000 ticks per wheel turn. The encoder reports 5,000 ticks. How far did the wheel roll, in meters?
        answer: 1.5
        feedback: "5,000 ticks ÷ 1,000 ticks per turn = 5 turns, and 5 × 0.3 m = 1.5 m."
      - id: localization-mapping-and-slam.calculate.4
        prompt: A robot's heading is off by 1°. It drives 20 m straight. About how far sideways is it from its estimate, in meters? (sin 1° ≈ 0.01745)
        answer: 0.349
        feedback: "Sideways error = 20 × sin 1° ≈ 20 × 0.01745 = 0.349 m."
      - id: localization-mapping-and-slam.calculate.5
        prompt: The software thinks a robot's wheel circumference is 0.306 m, but the worn tire is really 0.300 m around. The robot drives a true 15 m. By how many meters does odometry overestimate the distance?
        answer: 0.3
        feedback: "The software counts 15 ÷ 0.300 = 50 turns and multiplies by 0.306 m, giving 15.3 m: a 2% overestimate of 0.3 m."
