schema_version: 0.2-draft
lesson:
  id: retrieval-ingestion-and-chunking
  version: 0.4.0-draft
  title: Prepare retrievable evidence without losing its context
  state: draft
  summary: Cut a policy in the wrong place and "cannot be returned" lands in a different chunk from "opened batteries". Learn to split, label, and update documents so search finds whole answers.
  slot: M26.3
  category: learning
  sources:
    - title: Introduction to Information Retrieval — authors’ online edition
      url: https://nlp.stanford.edu/IR-book/
    - title: Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks (Lewis et al., 2020)
      url: https://arxiv.org/abs/2005.11401
objectives:
  - id: objective.retrieval-ingestion-and-chunking
    version: 2-draft
    statement: Ingestion converts source documents into versioned searchable units with metadata; chunk boundaries, parsing quality, updates, and deletion behavior determine the evidence available later.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - retrieval-ingestion-and-chunking.base.v2
      - retrieval-ingestion-and-chunking.transfer.v2
    prerequisites:
      - anyOf:
          - objective.dense-vector-retrieval
      - anyOf:
          - objective.data-provenance
scenes:
  - id: retrieval-ingestion-and-chunking.s1
    title: The parser read across the columns
    type: explanation
    depth: intuition
    objective_refs:
      - objective.retrieval-ingestion-and-chunking
    markdown: |-
      Sprocket's returns policy is really a two-column PDF. The left column covers returns, the right covers batteries. The first time the team loaded it into search, the extracted text began:

      > *Return unused items within Opened batteries cannot be 30 days for a full refund. returned, because damaged…*

      The parser had read straight across the page, line by line, splicing the two columns together. Every later step, from BM25 to embeddings to the language model, would work on this scrambled text, and none of them can unscramble it.

      Getting documents into search is called **ingestion**: extract the text, split it into pieces, attach labels, compute vectors, and write everything to the index. The first step is the one teams skip. A PDF stores characters at positions on a page, not sentences in reading order, so columns, tables, headers, and footnotes all need handling. Before building anything else, open a sample of parsed documents and read them. Two minutes of reading would have caught the spliced columns.
    bridges: []
  - id: retrieval-ingestion-and-chunking.s2
    title: '"Cannot" landed in the next chunk'
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.retrieval-ingestion-and-chunking
    markdown: |-
      Search usually indexes pieces of documents rather than whole files, so a match points at the paragraph that answers rather than a 40-page manual. Each piece is a **chunk**. The simplest way to make chunks is to cut every $n$ words. Watch what that does to the full returns section.

      ```python run
      import re

      policy = ("Return unused items within 30 days for a full refund. "
                "Opened batteries cannot be returned, because damaged cells can overheat. "
                "Chargers may be returned if they are unused.")

      def words(text):
          return set(re.findall(r"[a-z]+", text.lower()))

      def best(chunks, query):
          return max(chunks, key=lambda c: len(words(c) & words(query)))

      w = policy.split()
      fixed = [" ".join(w[i:i + 12]) for i in range(0, len(w), 12)]  # 12 words each
      sentences = re.split(r"(?<=\.) ", policy)                        # one sentence each

      query = "return opened batteries"
      for name, chunks in [("fixed-size", fixed), ("by sentence", sentences)]:
          print(f"--- {name} chunks ---")
          for c in chunks:
              print(" |", c)
          print("best match:", best(chunks, query), "\n")
      ```

      The 12-word cut ends the first chunk with "…full refund. Opened batteries" and starts the next with "cannot be returned." For the query *return opened batteries*, the first chunk matches all three words, so it wins. The model then reads "full refund … Opened batteries" and tells the customer yes. Splitting by sentence keeps "Opened batteries cannot be returned" whole, and that sentence wins instead.

      :::mixup "Smaller chunks are always more precise."
      Small chunks match sharply, but they strip away the words that give a sentence its meaning: the condition, the exception, the "cannot". Big chunks keep context but blur the match and eat prompt space. Pick the size by testing real questions, not by instinct.
      :::
    bridges: []
  - id: retrieval-ingestion-and-chunking.strategies
    title: Cut along the document's own seams
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.retrieval-ingestion-and-chunking
    markdown: |-
      Four common ways to chunk, from crudest to most careful. One uses **overlap**: each chunk repeats the last few tokens of the one before, so a sentence cut at one boundary appears whole in the next chunk.

      | Strategy | How it cuts | Watch out for |
      | --- | --- | --- |
      | Fixed size | Every $n$ tokens | Splits sentences and lists mid-thought |
      | Fixed size with overlap | Every $n$ tokens, each chunk repeating the end of the last | Stores some text twice |
      | Sentence or paragraph | At sentence or paragraph ends | Pieces vary a lot in length |
      | Structure-aware | At headings, list items, table rows | Needs a parser that sees structure |

      A cheap trick helps every strategy: put the document title and section heading at the top of each chunk ("Returns policy › Batteries: Opened batteries cannot…"). A chunk that says only "They cannot be returned" is useless on its own; the heading tells both the search and the model what "they" are.

      :::predict A 900-token page is cut into 300-token chunks with 100 tokens of overlap. How many chunks, and how many tokens get stored?
      Each new chunk starts 300 − 100 = 200 tokens after the last, so chunks start at 0, 200, 400, and 600. The last one runs from 600 to 900, exactly the end. That's 4 chunks and 4 × 300 = 1,200 stored tokens: a third more than the page itself. Without overlap it would be 3 chunks and 900 tokens.
      :::
    bridges: []
  - id: retrieval-ingestion-and-chunking.s3
    title: Every chunk carries its label
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.retrieval-ingestion-and-chunking
    markdown: |-
      A chunk is more than its text. Here is how the battery sentence is stored:

      ```python
      {
        "chunk_id":  "returns-v3-02",
        "doc_id":    "returns",
        "version":   3,                      # policy version, effective 1 Mar 2026
        "section":   "Returns policy > Batteries",
        "source":    "help.sprocket.example/returns#batteries",
        "access":    "public",               # vs "staff"
        "embedding_model": "encoder-2026-01",
        "text":      "Returns policy > Batteries: Opened batteries cannot be returned, ..."
      }
      ```

      Each field is there because a later lesson needs it. The source link lets an answer **cite** its evidence. The version and date let you prefer the current policy. The access field lets search hide staff-only pages from customers *before* ranking. The embedding model name catches the mixed-model mistake from the last lesson. This bundle of labels is the chunk's **metadata**.
    bridges: []
  - id: retrieval-ingestion-and-chunking.s4
    title: When the policy changes
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.retrieval-ingestion-and-chunking
    markdown: |-
      On 1 October, Sprocket extends its return window from 30 days to 45. The team re-runs ingestion on the new page. The job reports success, and the index now holds the new chunks *and* the old ones, because nothing told it to delete anything. A customer asking about the return window gets both "30 days" and "45 days" in the prompt, and the model picks one.

      The fix is to treat each document as a unit. When a document changes, find every chunk with its `doc_id`, delete them, then insert the new version's chunks. Do the same when a document is deleted or a staff page becomes private. Then test the result, not the job: ask "how long do I have to return something?" and check that only 45 days comes back. A successful ingestion run tells you the new chunks were written, not that the old ones are gone. Caches built from old answers need clearing too, which the last lesson in this module covers.
    bridges: []
  - id: retrieval-ingestion-and-chunking.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.retrieval-ingestion-and-chunking
    markdown: Contracts, a spec-sheet table, a deleted HR page, and an oversized support index test whether you can spot evidence that was lost before search ever ran.
    takeaway: |-
      Search can only find what ingestion kept. Parse carefully, cut chunks along the document's own seams, label each chunk with its source, version, and access, and delete old chunks when a document changes.
  - id: retrieval-ingestion-and-chunking.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.retrieval-ingestion-and-chunking
    markdown: |-
      Search can only recover the evidence ingestion preserves. Keep useful chunk boundaries, source locations, versions, and access information with each searchable piece.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - retrieval-ingestion-and-chunking.s1
        - retrieval-ingestion-and-chunking.s2
        - retrieval-ingestion-and-chunking.strategies
        - retrieval-ingestion-and-chunking.s3
        - retrieval-ingestion-and-chunking.s4
        - retrieval-ingestion-and-chunking.check
      gate_refs:
