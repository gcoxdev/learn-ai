assessment_families:
  - id: retrieval-ingestion-and-chunking.base
    objective_ref: objective.retrieval-ingestion-and-chunking
    task: base
    response_type: single_choice
    points: 1
    hint: 'Choose useful retrieval units: trace the inputs, operation, and result before choosing.'
    remediation_scene: retrieval-ingestion-and-chunking.s2
    variants:
      - id: retrieval-ingestion-and-chunking.base.1
        prompt: Can embeddings restore text lost during faulty parsing?
        options:
          - id: c
            text: Only with a larger vector
          - id: a
            text: Not reliably
          - id: b
            text: Always
        answer: a
        feedback: The retrieval representation depends on ingested evidence.
        retired: true
      - id: retrieval-ingestion-and-chunking.base.2
        prompt: What is a tradeoff of very small chunks?
        options:
          - id: a
            text: Focused matching but possible loss of context
          - id: b
            text: Guaranteed complete context
          - id: c
            text: No effect on retrieval
        answer: a
        feedback: Boundaries can separate qualifications from claims.
        retired: true
  - id: retrieval-ingestion-and-chunking.transfer
    objective_ref: objective.retrieval-ingestion-and-chunking
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Propagate updates and deletion: trace the inputs, operation, and result before choosing.'
    remediation_scene: retrieval-ingestion-and-chunking.s4
    variants:
      - id: retrieval-ingestion-and-chunking.transfer.1
        prompt: Why retain source locations with chunks?
        options:
          - id: a
            text: To support traceable citations and diagnosis
          - id: b
            text: To guarantee every generated statement is true
          - id: c
            text: Only to increase file size
        answer: a
        feedback: Provenance connects retrieved units to original evidence.
        retired: true
      - id: retrieval-ingestion-and-chunking.transfer.2
        prompt: New chunks are added but obsolete ones remain. What can happen?
        options:
          - id: b
            text: All results become current automatically
          - id: c
            text: Only storage gets smaller
          - id: a
            text: Conflicting stale versions are retrieved
        answer: a
        feedback: Update propagation must include removal or version filtering.
        retired: true
  - id: retrieval-ingestion-and-chunking.base.v2
    objective_ref: objective.retrieval-ingestion-and-chunking
    task: base
    response_type: single_choice
    points: 1
    hint: Follow one sentence from the source file into the index. Where could it have been scrambled, cut in half, separated from its heading, or left behind after an update?
    remediation_scene: retrieval-ingestion-and-chunking.s2
    variants:
      - id: retrieval-ingestion-and-chunking.base.v2.1
        prompt: 'A fixed-size chunker ends one chunk with "…full refund. Opened batteries" and starts the next with "cannot be returned." What is the likely effect on the query "return opened battery"?'
        options:
          - id: b
            text: Both chunks are retrieved together, since they came from the same page
          - id: a
            text: The first chunk matches best and suggests opened batteries are refundable
          - id: c
            text: The embedding of the first chunk still carries the "cannot" from its neighbor
        answer: a
        feedback: The first chunk contains "return", "opened", and "battery" but not the "cannot", so it wins and misleads. Chunks are indexed and embedded independently, so neighbors are neither retrieved together nor blended unless you build that in.
      - id: retrieval-ingestion-and-chunking.base.v2.2
        prompt: A 900-token page is split into 300-token chunks with 100 tokens of overlap. Why add the overlap?
        options:
          - id: a
            text: A sentence cut at one boundary still appears whole in the next chunk
          - id: c
            text: Repeated tokens raise each chunk's similarity to typical questions
          - id: b
            text: Overlapping chunks take less storage than cutting the page cleanly
        answer: a
        feedback: Overlap repeats the end of each chunk at the start of the next, so boundary sentences survive intact somewhere. It costs extra storage (here 1,200 tokens instead of 900) and doesn't make chunks more similar to questions.
      - id: retrieval-ingestion-and-chunking.base.v2.3
        prompt: A two-column PDF was parsed line by line across both columns, splicing unrelated sentences together. The team proposes switching to a stronger embedding model. What should they do instead?
        options:
          - id: c
            text: Use larger chunks so that each spliced sentence has more context
          - id: b
            text: Add BM25 so exact words still match despite the scrambled order
          - id: a
            text: Fix the parser to follow reading order, then re-ingest the document
        answer: a
        feedback: Every later step works on the text the parser produced, so the scrambling has to be fixed at the source. A better encoder, bigger chunks, or keyword search all operate on the same spliced sentences.
      - id: retrieval-ingestion-and-chunking.base.v2.4
        prompt: The return window changed from 30 to 45 days. Ingestion re-ran successfully, but answers sometimes still say 30 days. What went wrong?
        options:
          - id: b
            text: The embedding model hasn't yet learned the new number of days
          - id: c
            text: The new chunks are too short to outrank the older, longer ones
          - id: a
            text: The old version's chunks were never deleted from the index
        answer: a
        feedback: Re-ingesting adds the new chunks; unless the old chunks for that document are deleted, both versions stay searchable. Embedding models don't learn from your documents, and chunk length isn't what keeps the stale answer alive.
  - id: retrieval-ingestion-and-chunking.transfer.v2
    objective_ref: objective.retrieval-ingestion-and-chunking
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what a reader would need beside the retrieved chunk to understand it correctly, and whether ingestion kept that information.
    remediation_scene: retrieval-ingestion-and-chunking.strategies
    variants:
      - id: retrieval-ingestion-and-chunking.transfer.v2.1
        prompt: 'A contract search retrieves the chunk "The Supplier shall not be liable for such losses." The model can''t tell which losses. Which ingestion change helps most?'
        options:
          - id: a
            text: Prefix each chunk with its clause heading and keep the defining sentence with it
          - id: b
            text: Cut the contract into even smaller chunks so each covers one idea
          - id: c
            text: Remove repeated legal phrases so the key words stand out more
        answer: a
        feedback: The chunk depends on context outside it ("such losses"), so it needs its heading and the sentence that defines the term. Smaller chunks would strip even more context, and deleting phrases changes what the contract says.
      - id: retrieval-ingestion-and-chunking.transfer.v2.2
        prompt: 'A spec-sheet table is extracted as a flat run of text: "Model Weight Range A1 B2 21 kg 24 kg 80 km 95 km". Questions about the B2''s range get wrong answers. What should ingestion do?'
        options:
          - id: c
            text: Split the flat text into smaller chunks so each number stands alone
          - id: a
            text: Keep each table row as a unit, with the column headers attached
          - id: b
            text: Drop tables from the index, since models can't read numbers well
        answer: a
        feedback: Flattening separated each number from its row and column, so nothing links "95 km" to B2. Rows with headers ("B2, Weight 24 kg, Range 95 km") keep the link. Smaller chunks separate the numbers further, and dropping tables loses the evidence entirely.
      - id: retrieval-ingestion-and-chunking.transfer.v2.3
        prompt: HR deletes an outdated parental-leave policy from its wiki. Two weeks later the HR assistant still quotes it. What was missing?
        options:
          - id: b
            text: A newer embedding model that recognizes the policy as outdated
          - id: a
            text: A step that deletes a document's chunks when the source is deleted
          - id: c
            text: A higher similarity threshold so older pages score too low to appear
        answer: a
        feedback: Deleting the wiki page doesn't touch the chunks already in the index; deletion has to be carried through by document ID and then tested. A new model or a threshold would still leave the old chunks searchable.
      - id: retrieval-ingestion-and-chunking.transfer.v2.4
        prompt: A support index uses 3,000-token chunks. The right chunk is usually retrieved, but answers are vague and just three chunks fill the prompt. What change fits?
        options:
          - id: a
            text: Split along section headings into smaller chunks, each carrying its heading
          - id: c
            text: Add more overlap between the large chunks so fewer details are lost
          - id: b
            text: Retrieve the top 10 chunks instead of the top 3 to cover more material
        answer: a
        feedback: Huge chunks bury the relevant paragraph in unrelated text and use up the prompt. Section-sized chunks with headings keep context while focusing the match. More overlap makes chunks even bigger, and ten 3,000-token chunks won't fit.
