schema_version: 0.2-draft
lesson:
  id: retrieval-ingestion-and-chunking
  version: 0.1.0-draft
  title: Prepare retrievable evidence without losing its context
  state: draft
  summary: Ingestion converts source documents into versioned searchable units with metadata; chunk boundaries,
    parsing quality, updates, and deletion behavior determine the evidence available later.
  slot: M26.3
  category: learning
  sources:
  - title: Introduction to Information Retrieval — authors’ online edition
    url: https://nlp.stanford.edu/IR-book/
  - title: Retrieval-Augmented Generation
    url: https://arxiv.org/abs/2005.11401
objectives:
- id: objective.retrieval-ingestion-and-chunking
  version: 1-draft
  statement: Ingestion converts source documents into versioned searchable units with metadata; chunk boundaries,
    parsing quality, updates, and deletion behavior determine the evidence available later.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - retrieval-ingestion-and-chunking.base
  - retrieval-ingestion-and-chunking.transfer
  prerequisites:
  - anyOf:
    - objective.dense-vector-retrieval
  - anyOf:
    - objective.data-provenance
scenes:
- id: retrieval-ingestion-and-chunking.s1
  title: Parse before embedding
  type: explanation
  depth: intuition
  objective_refs:
  - objective.retrieval-ingestion-and-chunking
  markdown: Extract text, tables, headings, and relevant media while preserving source identity and structure. A
    PDF column-order error can produce misleading text before retrieval starts. Keep parsing diagnostics and representative
    samples, because an embedding index cannot recover information that ingestion discarded.
  text_mode: Extract text, tables, headings, and relevant media while preserving source identity and structure.
    A PDF column-order error can produce misleading text before retrieval starts. Keep parsing diagnostics and representative
    samples, because an embedding index cannot recover information that ingestion discarded.
  bridges: []
- id: retrieval-ingestion-and-chunking.s2
  title: Choose useful retrieval units
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.retrieval-ingestion-and-chunking
  markdown: Small chunks focus a match but may omit definitions or qualifications. Large chunks preserve context
    but dilute ranking and consume prompt space. Overlap can reduce boundary losses while increasing duplication.
    A paragraph split between “not” and its condition illustrates why semantic boundaries matter.
  text_mode: Small chunks focus a match but may omit definitions or qualifications. Large chunks preserve context
    but dilute ranking and consume prompt space. Overlap can reduce boundary losses while increasing duplication.
    A paragraph split between “not” and its condition illustrates why semantic boundaries matter.
  bridges: []
- id: retrieval-ingestion-and-chunking.s3
  title: Attach operational metadata
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.retrieval-ingestion-and-chunking
  markdown: Store document and chunk IDs, source location, version, timestamps, access scope, and section context
    where needed. These fields support citations, filtering, freshness, and debugging. Generated chunk summaries
    should remain distinguishable from the original source text.
  text_mode: Store document and chunk IDs, source location, version, timestamps, access scope, and section context
    where needed. These fields support citations, filtering, freshness, and debugging. Generated chunk summaries
    should remain distinguishable from the original source text.
  bridges: []
- id: retrieval-ingestion-and-chunking.s4
  title: Propagate updates and deletion
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.retrieval-ingestion-and-chunking
  markdown: When a source changes, identify affected chunks and indexes, remove obsolete entries, and invalidate
    relevant caches. Re-embedding without deleting old chunks can return conflicting versions. Test end-to-end freshness
    and access behavior rather than assuming a successful ingestion job means every downstream artifact is current.
  text_mode: When a source changes, identify affected chunks and indexes, remove obsolete entries, and invalidate
    relevant caches. Re-embedding without deleting old chunks can return conflicting versions. Test end-to-end freshness
    and access behavior rather than assuming a successful ingestion job means every downstream artifact is current.
  bridges: []
- id: retrieval-ingestion-and-chunking.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.retrieval-ingestion-and-chunking
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Ingestion converts source documents into versioned searchable units with metadata; chunk boundaries,
    parsing quality, updates, and deletion behavior determine the evidence available later.
- id: retrieval-ingestion-and-chunking.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.retrieval-ingestion-and-chunking
  markdown: Ingestion converts source documents into versioned searchable units with metadata; chunk boundaries,
