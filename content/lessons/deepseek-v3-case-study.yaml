scenes:
- id: deepseek-v3-case-study.s1
  title: Pin the original technical report
  type: explanation
  depth: intuition
  objective_refs:
  - objective.deepseek-v3-case-study
  markdown: 'Anchor: DeepSeek-V3 report revision 2, February 18, 2025, for the original V3 system. This is distinct
    from later date-suffixed or successor checkpoints. Sources checked September 13, 2026. Match a concrete base
    or post-trained artifact before interpreting its behavior.'
  text_mode: 'Anchor: DeepSeek-V3 report revision 2, February 18, 2025, for the original V3 system. This is distinct
    from later date-suffixed or successor checkpoints. Sources checked September 13, 2026. Match a concrete base
    or post-trained artifact before interpreting its behavior.'
  bridges: []
- id: deepseek-v3-case-study.s2
  title: Connect the architectural pieces
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.deepseek-v3-case-study
  markdown: 'The report gives 671B total and 37B activated parameters, MLA, shared and routed experts, and a multi-token
    prediction objective. Each addresses a different interface: latent attention reduces cache representation, experts
    select feed-forward computation, and extra prediction targets alter training supervision.'
  text_mode: 'The report gives 671B total and 37B activated parameters, MLA, shared and routed experts, and a multi-token
    prediction objective. Each addresses a different interface: latent attention reduces cache representation, experts
    select feed-forward computation, and extra prediction targets alter training supervision.'
  bridges: []
- id: deepseek-v3-case-study.s3
  title: Connect training and infrastructure
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.deepseek-v3-case-study
  markdown: The documented run uses 14.8T pretraining tokens, FP8 training engineering, and a pipeline/communication
    design called DualPipe. Load-balancing routing adjustments coexist with a complementary sequence-level auxiliary
    loss; “auxiliary-loss-free” should not be misread as no auxiliary term anywhere. Post-training includes SFT
    and RL.
  text_mode: The documented run uses 14.8T pretraining tokens, FP8 training engineering, and a pipeline/communication
    design called DualPipe. Load-balancing routing adjustments coexist with a complementary sequence-level auxiliary
    loss; “auxiliary-loss-free” should not be misread as no auxiliary term anywhere. Post-training includes SFT
    and RL.
  bridges: []
- id: deepseek-v3-case-study.s4
  title: Inspect code and weight terms separately
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.deepseek-v3-case-study
  markdown: The official repository provides inference examples, configuration, model links, and separate code/model
    license references. It reports base and chat checkpoints and an inference path for the architecture. Record
    the exact artifact terms and precision requirements rather than assuming all DeepSeek releases share one license
    or runtime contract.
  text_mode: The official repository provides inference examples, configuration, model links, and separate code/model
    license references. It reports base and chat checkpoints and an inference path for the architecture. Record
    the exact artifact terms and precision requirements rather than assuming all DeepSeek releases share one license
    or runtime contract.
  bridges: []
- id: deepseek-v3-case-study.s5
  title: Follow the sparse serving path
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.deepseek-v3-case-study
  markdown: A request still performs tokenization, prefill, and autoregressive decoding. Within sparse layers, route,
    dispatch, execute experts, combine, and return to shared computation. The cache and expert placement affect
    different allocations. All experts needed by arbitrary traffic must remain available through the chosen storage
    arrangement.
  text_mode: A request still performs tokenization, prefill, and autoregressive decoding. Within sparse layers,
    route, dispatch, execute experts, combine, and return to shared computation. The cache and expert placement
    affect different allocations. All experts needed by arbitrary traffic must remain available through the chosen
    storage arrangement.
  bridges: []
- id: deepseek-v3-case-study.s6
  title: Audit a cost claim
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.deepseek-v3-case-study
  markdown: Training accelerator-hours cover a stated run and hardware configuration, not automatically every experiment,
    data cost, or deployment expense. Serving claims need workload and quality conditions. Use this case to separate
    algorithmic capacity savings from the engineering needed to realize them.
  text_mode: Training accelerator-hours cover a stated run and hardware configuration, not automatically every experiment,
    data cost, or deployment expense. Serving claims need workload and quality conditions. Use this case to separate
    algorithmic capacity savings from the engineering needed to realize them.
  bridges: []
- id: deepseek-v3-case-study.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.deepseek-v3-case-study
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: DeepSeek-V3 is a documented sparse-transformer case combining MLA, routed and shared experts, multi-token
    training, load balancing, mixed precision, and specialized distributed execution.
