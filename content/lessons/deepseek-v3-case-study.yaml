assessment_families:
  - id: deepseek-v3-case-study.base
    objective_ref: objective.deepseek-v3-case-study
    task: base
    response_type: single_choice
    points: 1
    hint: Match each V3 mechanism to the part of the system it changes (cache, feed-forward compute, training targets, or cost accounting).
    remediation_scene: deepseek-v3-case-study.s2
    variants:
      - id: deepseek-v3-case-study.base.1
        prompt: Which number describes the report’s total parameter count?
        options:
          - id: a
            text: 671B
          - id: b
            text: 37B
          - id: c
            text: 14.8T parameters
        answer: a
        feedback: Total capacity differs from activated count and training-token count.
        retired: true
      - id: deepseek-v3-case-study.base.2
        prompt: Does auxiliary-loss-free routing mean no auxiliary loss anywhere in the reported recipe?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only for every sequence
          - id: a
            text: 'No'
        answer: a
        feedback: The report also documents a complementary sequence-level term.
        retired: true
  - id: deepseek-v3-case-study.transfer
    objective_ref: objective.deepseek-v3-case-study
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what a cost figure includes before comparing it with anything else.
    remediation_scene: deepseek-v3-case-study.s6
    variants:
      - id: deepseek-v3-case-study.transfer.1
        prompt: Does MLA solve the same allocation problem as expert placement?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if both run on GPUs
          - id: a
            text: No; attention cache and expert storage are distinct
        answer: a
        feedback: Different mechanisms target different parts of the system.
        retired: true
      - id: deepseek-v3-case-study.transfer.2
        prompt: Can a final-run accelerator-hour figure be treated as total project cost automatically?
        options:
          - id: c
            text: Only if a dollar conversion is supplied
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Accounting scope must include what the claim purports to measure.
        retired: true
  - id: deepseek-v3-case-study.base.v2
    objective_ref: objective.deepseek-v3-case-study
    task: base
    response_type: single_choice
    points: 1
    hint: Place each mechanism in the layer diagram. MLA changes what's cached, experts change feed-forward compute, and MTP adds a training target.
    remediation_scene: deepseek-v3-case-study.s2
    variants:
      - id: deepseek-v3-case-study.base.v2.1
        prompt: What does DeepSeek-V3 store in its KV cache for each token and layer?
        options:
          - id: b
            text: Full keys and values for each of the 128 heads, in FP8
          - id: a
            text: A 512-number latent plus a 64-number RoPE key
          - id: c
            text: Keys and values for the 8 routed experts chosen for the token
        answer: a
        feedback: MLA caches one compressed latent and a small shared RoPE key, and rebuilds each head's keys and values from them. Experts live in the feed-forward layers and cache nothing, and full per-head keys and values would be about 71 times larger.
      - id: deepseek-v3-case-study.base.v2.2
        prompt: V3 is called "auxiliary-loss-free." What does its balancing actually use?
        options:
          - id: c
            text: No balancing term of any kind, since routing balances itself over training
          - id: b
            text: A standard auxiliary loss whose weight was tuned down to near zero
          - id: a
            text: Per-expert bias adjustments, plus a tiny sequence-level loss as a backstop
        answer: a
        feedback: Biases added to routing scores do most of the balancing, and a sequence-wise loss with weight 0.0001 prevents extreme imbalance inside one sequence. Without some mechanism, routers tend to collapse onto a few experts.
      - id: deepseek-v3-case-study.base.v2.3
        prompt: What does V3's multi-token prediction module change?
        options:
          - id: a
            text: Training adds a target for the token after next; inference can drop the module
          - id: b
            text: Each inference step emits two tokens, halving the time to generate a reply
          - id: c
            text: The model predicts two tokens in pretraining but one in post-training
        answer: a
        feedback: MTP is an extra training signal. At inference the main model works alone, or the MTP module can propose tokens for speculative decoding, where the main model still verifies each token.
      - id: deepseek-v3-case-study.base.v2.4
        prompt: V3's pretraining did about 11.6 times less arithmetic than Llama 3.1 405B's. What was the main reason?
        options:
          - id: b
            text: FP8 matrix multiplications count as half a FLOP each
          - id: c
            text: It trained on far fewer tokens than Llama 3.1 405B did
          - id: a
            text: Each token ran through 37B parameters instead of 405B
        answer: a
        feedback: 6ND with 37B active against 405B dense gives the ratio; the token counts, 14.8T and 15.6T, are close. FP8 speeds up each FLOP but doesn't reduce how many there are.
  - id: deepseek-v3-case-study.transfer.v2
    objective_ref: objective.deepseek-v3-case-study
    task: transfer
    response_type: single_choice
    points: 1
    hint: For a cost claim, ask what is counted. For a serving plan, separate weight storage (total parameters) from cache and compute.
    remediation_scene: deepseek-v3-case-study.s6
    variants:
      - id: deepseek-v3-case-study.transfer.v2.1
        prompt: An investor memo says "DeepSeek built V3 for $5.6M, so a rival lab could match it for that." What does the report's own accounting say?
        options:
          - id: c
            text: The figure is total spending, so the plan is realistic if GPU rental prices hold
          - id: a
            text: It prices only the final run's GPU-hours and excludes research and ablations
          - id: b
            text: It covers pretraining only, so post-training would roughly double the total
        answer: a
        feedback: The report says the $5.576M covers only official training at an assumed $2 per GPU-hour. Post-training is already included and was tiny, just 5K of the 2,788K GPU-hours.
      - id: deepseek-v3-case-study.transfer.v2.2
        prompt: A team plans to serve V3 on one server with eight 80 GB GPUs, using the released FP8 weights. What's the first problem?
        options:
          - id: a
            text: The 671 GB of weights nearly fill 640 GB before any cache or activations
          - id: b
            text: The MLA cache for long prompts will exceed the memory well before the weights
          - id: c
            text: FP8 weights must be converted to bf16 before any serving engine can load them
        answer: a
        feedback: 671B × 1 byte = 671 GB, more than the node's 640 GB, so V3 needs more GPUs or larger ones. MLA keeps the cache small, about 8.6 GiB even at 128K tokens, and engines such as SGLang and vLLM serve the FP8 weights directly.
        retired: true
      - id: deepseek-v3-case-study.transfer.v2.3
        prompt: A new MoE reports its GPU-hours and training tokens. Using 6ND with its active parameters, you get 340 TFLOP/s per GPU, about what Llama 3 and V3 achieved. What have you shown?
        options:
          - id: b
            text: The report's GPU-hours are proven accurate to within a few percent
          - id: c
            text: The model must use MLA, since both earlier models got the same rate
          - id: a
            text: The reported hours and tokens are consistent with a typical training speed
        answer: a
        feedback: A consistency check can flag a figure that's wildly off, but it can't prove a number that 6ND only approximates. The per-GPU rate says nothing about which attention design a model uses, and Llama 3 used GQA.
      - id: deepseek-v3-case-study.transfer.v2.4
        prompt: A long-document service must hold many 100K-token conversations at once. Why does V3's design help more here than its expert count does?
        options:
          - id: c
            text: Routing sends long prompts to fewer experts, which shrinks their memory
          - id: a
            text: MLA makes each token's cache about a seventh of Llama 3.1 405B's
          - id: b
            text: Only 37B parameters are active, so each conversation loads less of the model
        answer: a
        feedback: With many long conversations, the cache dominates, and MLA's 68.6 KiB per token against 504 KiB is the win. Weights are shared by every conversation, and routing doesn't shrink them.
      - id: deepseek-v3-case-study.transfer.v2.5
        prompt: A team has one server with eight 141 GB GPUs, 1,128 GB in all. They plan to convert V3's released FP8 weights to bf16 before serving. What should they expect?
        options:
          - id: b
            text: The bf16 weights fit, since only 37B parameters (74 GB) load per token
          - id: a
            text: Both fit, but at bf16 one 128K-token prompt's cache fills the leftover memory
          - id: c
            text: The bf16 weights (about 1,342 GB) won't fit; the FP8 ones (671 GB) will
        answer: c
        feedback: 671B × 2 bytes = 1,342 GB, more than the 1,128 GB available, while FP8 leaves over 400 GB for cache and activations. Any token can route to any expert, so all 671B must be resident, and MLA's cache for a 128K-token prompt is only about 8.6 GiB.
  - id: deepseek-v3-case-study.calculate
    objective_ref: objective.deepseek-v3-case-study
    task: base
    response_type: numeric
    points: 1
    hint: "Weights: 671B × bytes per number. MLA cache: 61 layers × (512 + 64) numbers × 2 bytes. Compute: 6 × 37B × tokens. Then convert to the units asked."
    remediation_scene: deepseek-v3-case-study.s5
    absolute_tolerance: 1
    variants:
      - id: deepseek-v3-case-study.calculate.1
        prompt: DeepSeek-V3 has 671 billion parameters. How many GB do its weights take in bf16?
        answer: 1342
        feedback: 671 × 10⁹ × 2 bytes = 1,342 × 10⁹ bytes = 1,342 GB, about 1.34 TB.
      - id: deepseek-v3-case-study.calculate.2
        prompt: V3's MLA caches 512 + 64 numbers per token in each of 61 layers, at 2 bytes each. How many KiB per token is that?
        answer: 68.625
        feedback: 61 × 576 × 2 = 70,272 bytes, and 70,272 ÷ 1,024 = 68.625 KiB.
      - id: deepseek-v3-case-study.calculate.3
        prompt: Using 6ND with 37 billion active parameters and 14.8 trillion tokens, what is V3's pretraining compute, in units of 10²³ FLOPs?
        answer: 32.9
        feedback: 6 × 37 × 10⁹ × 14.8 × 10¹² = 3.29 × 10²⁴ = 32.9 × 10²³ FLOPs.
      - id: deepseek-v3-case-study.calculate.4
        prompt: V3's pretraining took 2,664K H800 GPU-hours for about 3.29 × 10²⁴ FLOPs. How many TFLOP/s of useful work did each GPU average?
        answer: 343
        feedback: 2.664 × 10⁶ × 3,600 = 9.59 × 10⁹ GPU-seconds, and 3.29 × 10²⁴ ÷ 9.59 × 10⁹ ≈ 3.43 × 10¹⁴ FLOP/s = 343 TFLOP/s.
      - id: deepseek-v3-case-study.calculate.5
        prompt: The report says each trillion training tokens took 180K H800 GPU-hours. At that rate, how many thousand GPU-hours do 14.8 trillion tokens take?
        answer: 2664
        feedback: 180K × 14.8 = 2,664K GPU-hours, exactly Table 1's pretraining figure.
