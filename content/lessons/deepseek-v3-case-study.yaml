schema_version: 0.2-draft
lesson:
  id: deepseek-v3-case-study
  version: 0.4.0-draft
  title: Trace DeepSeek-V3 from sparse architecture to distributed serving
  state: draft
  summary: '"A frontier model for $5.6 million": the headline came from one table in DeepSeek-V3''s report. Rebuild it from 6ND, see what it leaves out, and find where the savings really came from.'
  slot: M35.4
  category: learning
  sources:
    - title: DeepSeek-V3 report v2
      url: https://arxiv.org/abs/2412.19437v2
    - title: DeepSeek-V3 official repository
      url: https://github.com/deepseek-ai/DeepSeek-V3
objectives:
  - id: objective.deepseek-v3-case-study
    version: 3-draft
    statement: DeepSeek-V3 is a documented sparse-transformer case combining MLA, routed and shared experts, multi-token training, load balancing, mixed precision, and specialized distributed execution.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - deepseek-v3-case-study.base.v2
      - deepseek-v3-case-study.transfer.v2
      - deepseek-v3-case-study.calculate
    prerequisites:
      - anyOf:
          - objective.model-report-and-artifact-inventory
      - anyOf:
          - objective.shared-and-fine-grained-experts
      - anyOf:
          - objective.shared-and-latent-kv
      - anyOf:
          - objective.pretraining-objectives
      - anyOf:
          - objective.serving-expert-models
scenes:
  - id: deepseek-v3-case-study.s1
    title: The six-million-dollar sentence
    type: explanation
    depth: intuition
    objective_refs:
      - objective.deepseek-v3-case-study
    markdown: |-
      Table 1 of the DeepSeek-V3 report is three numbers and a price:

      | Stage | H800 GPU-hours | At \$2 per GPU-hour |
      | --- | ---: | ---: |
      | Pretraining (14.8T tokens) | 2,664K | \$5.328M |
      | Context extension to 128K | 119K | \$0.238M |
      | Post-training | 5K | \$0.01M |
      | **Total** | **2,788K** | **\$5.576M** |

      Headlines turned that into "a frontier model for six million dollars." The sentence right under the table is more careful: the costs "include only the official training of DeepSeek-V3, excluding the costs associated with prior research and ablation experiments." The cluster itself, the data work, and the salaries aren't in it either. The table prices one final run at an assumed rental rate.

      That's still a remarkable number, and by the end of this lesson you'll check it yourself and see where the savings came from.

      Pin the object: **DeepSeek-V3 report revision 2 (February 18, 2025)**, describing the original V3 released in December 2024. Later date-suffixed checkpoints need their own evidence. The H800 is the export version of NVIDIA's H100 sold in China, with reduced chip-to-chip bandwidth.
    bridges: []
  - id: deepseek-v3-case-study.s2
    title: Inside one V3 layer
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.deepseek-v3-case-study
    markdown: |-
      From the report's section 4.2 and the released config:

      | | DeepSeek-V3 |
      | --- | --- |
      | Layers / width | 61 / 7,168 |
      | Attention | MLA: 128 heads of width 128, caching a 512-number latent plus a 64-number RoPE key |
      | Feed-forward | First 3 layers dense; 58 MoE layers with 1 shared + 256 routed experts (width 2,048), 8 routed chosen |
      | Parameters | 671B total, 37B active per token |
      | Vocabulary | 128K (129,280 rows in the config) |
      | Training | 14.8T tokens at 4K context, then 32K, then 128K |
      | Extra objective | Multi-token prediction, depth 1 (14B extra weights) |

      Each piece has an earlier lesson of its own. The lesson on shared and fine-grained experts covers the 1 + 8-of-256 layout and counts where the 671B live. The lesson on shared and latent KV explains **multi-head latent attention (MLA)**: cache one short learned vector per token and rebuild every head's keys and values from it. The diagram shows how they fit into one layer.
    diagram:
      caption: One DeepSeek-V3 MoE layer (58 of the 61). Only the latent and RoPE key are cached.
      description: The hidden state enters multi-head latent attention, which writes a 512-number latent and a 64-number RoPE key to the KV cache for each token and reads earlier tokens' entries back. The attention output goes to both the shared expert, which always runs, and a sigmoid router, which picks 8 of 256 routed experts. The shared expert's output and the weighted routed outputs are summed and passed to the next layer.
      nodes:
        - id: h
          label: Hidden state
          col: 0
          row: 0
          tone: muted
        - id: mla
          label: MLA attention
          note: 128 heads rebuilt from latent
          col: 1
          row: 0
          tone: accent
        - id: cache
          label: KV cache
          note: 512 latent + 64 RoPE per token
          col: 1
          row: 1
          tone: data
        - id: router
          label: Router
          note: sigmoid scores + bias, top 8
          col: 2
          row: 0
        - id: routed
          label: 8 of 256 routed experts
          note: width 2,048 each
          col: 3
          row: 0
        - id: shared
          label: Shared expert
          note: always runs
          col: 3
          row: 1
        - id: sum
          label: Sum, to next layer
          col: 4
          row: 0
      edges:
        - from: h
          to: mla
        - from: mla
          to: cache
          label: write
          bend: 1
        - from: cache
          to: mla
          label: read past tokens
          bend: 1
        - from: mla
          to: router
        - from: router
          to: routed
        - from: mla
          to: shared
        - from: routed
          to: sum
        - from: shared
          to: sum
    bridges: []
  - id: deepseek-v3-case-study.s5
    title: 1.3 terabytes of weights, 69 KiB of cache
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.deepseek-v3-case-study
    markdown: |-
      :::predict Llama 3.1 405B caches 504 KiB per token. How much does V3's MLA cache per token, across its 61 layers at 2 bytes per number?
      61 × (512 + 64) × 2 = 70,272 bytes, about 68.6 KiB, roughly a seventh of the 405B's cache. If every one of V3's 128 heads cached its own full key (128 + 64 numbers) and value (128), it would need about 4,880 KiB, 71 times more.
      :::

      The weights point the other way. Every one of the 671B parameters must be stored, because any token can route to any expert.

      ```python run
      # DeepSeek-V3 model sheet, from report section 4.2 and Table 1
      total, active, D = 671e9, 37e9, 14.8e12
      layers, heads, latent, rope_key = 61, 128, 512, 64

      for t, b in [("bf16", 2), ("fp8", 1), ("int4", 0.5)]:
          print(f"weights at {t:4s}: {total * b / 1e9:5.0f} GB")

      mla = layers * (latent + rope_key) * 2               # one latent + one RoPE key, 2 bytes
      full = layers * heads * ((128 + 64) + 128) * 2       # if every head cached its own K and V
      print(f"KV per token: MLA {mla / 1024:.1f} KiB, full per-head K/V {full / 1024:,.0f} KiB "
            f"({full / mla:.0f}x); 128K context: {mla * 131072 / 2**30:.1f} GiB")

      C = 6 * active * D
      gpu_hours = 2.664e6                                   # pretraining only
      print(f"6ND = {C:.2e} FLOPs -> {C / (gpu_hours * 3600) / 1e12:.0f} TFLOP/s per H800")
      print(f"Llama 3 405B: 3.8e25 FLOPs is {3.8e25 / C:.1f}x more compute")
      print(f"Table 1 total: {2664 + 119 + 5}K GPU-hours x $2 = ${2.788e6 * 2 / 1e6:.3f}M")
      ```

      At 671 GB, even the FP8 weights (the only precision DeepSeek released) need more than one 8-GPU node of 80 GB cards. So V3 is served across many GPUs, with experts spread over devices, as in the lesson on serving expert models. Once weights are placed, though, a 128K-token conversation adds only 8.6 GiB of cache.

      :::mixup "Only 37B parameters are active, so V3 needs about 74 GB at bf16."
      That's the work per token, not the storage. 37B × 2 bytes counts the parameters one token touches; the next token may pick different experts, so all 1,342 GB must be resident at bf16.
      :::
    bridges: []
  - id: deepseek-v3-case-study.s3
    title: Four engineering bets in training
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.deepseek-v3-case-study
    markdown: |-
      1. **Auxiliary-loss-free balancing.** Each expert's bias nudges who gets picked (step 0.001 for the first 14.3T tokens, then 0). A tiny sequence-level balance loss (weight 0.0001) remains as a backstop, so "loss-free" doesn't mean *no* balance loss. The report says no tokens were dropped in training or inference.
      2. **Multi-token prediction (MTP).** An extra module predicts the token *after* the next one, giving each position two training targets.
      3. **FP8 training.** Most large matrix multiplications ran in 8-bit floating point with fine-grained scaling factors, while master weights and optimizer state stayed in higher precision, as in the lesson on mixed-precision training.
      4. **DualPipe** and node-limited routing. Pipeline stages overlap computation with the all-to-all traffic of expert dispatch, and each token is sent to experts on at most 4 nodes (8 GPUs each), limiting slow cross-node traffic.

      :::papers The multi-token prediction loss
      $$\mathcal{L}_{\text{MTP}} = \frac{\lambda}{D} \sum_{k=1}^{D} \mathcal{L}^{k}_{\text{MTP}}, \qquad \mathcal{L}^{k}_{\text{MTP}} = -\frac{1}{T} \sum_{i} \log P^{k}_{i}[t_{i}]$$

      Each depth $k$ is a cross-entropy loss on the token $k$ positions beyond the usual next token. V3 uses $D = 1$, so one extra token per position, and weights it by $\lambda = 0.3$ for the first 10T tokens, then $0.1$. At inference the MTP module can be dropped, or reused to propose tokens for speculative decoding, as in the speculative decoding lesson.
      :::
    bridges: []
  - id: deepseek-v3-case-study.s4
    title: What the release gives you
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.deepseek-v3-case-study
    markdown: |-
      The inventory, from the official repository: Base and chat checkpoints in FP8, a script to convert them to bf16, a small inference demo, and support in serving engines such as SGLang and vLLM. The Hugging Face files hold 685B parameters, the 671B main model plus 14B of MTP weights. Code is under MIT; the weights are under a separate DeepSeek License Agreement.

      Not released: training code as a full pipeline, the 14.8T-token corpus, and intermediate checkpoints. V3 is open-weight: you can run and fine-tune it, but you can't check its data claims yourself.
    bridges: []
  - id: deepseek-v3-case-study.s6
    title: Where the savings came from
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.deepseek-v3-case-study
    markdown: |-
      Now audit Table 1 with the calculator's output. Pretraining compute is about 6 × 37B × 14.8T ≈ 3.29 × 10²⁴ FLOPs. Spread over 2.664 million GPU-hours, that's about 343 TFLOP/s of useful work per H800.

      Llama 3.1 405B's H100s averaged 342 TFLOP/s by the same method. So V3 did *not* get far more out of each GPU. It needed about 11.6 times fewer FLOPs, because each token ran through 37B parameters instead of 405B. Sparsity cut the arithmetic; FP8, DualPipe, and dropless balancing made that sparse model train at a normal rate.

      Two cautions on the comparison: 6ND ignores attention and MTP FLOPs, and V3's matrix multiplications ran in FP8, whose peak rate is higher. Treat 343 TFLOP/s as a consistency check, not a measured utilization.
    bridges: []
  - id: deepseek-v3-case-study.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.deepseek-v3-case-study
    markdown: Compute V3's weights, cache, and training compute, then judge a cost headline, a serving plan, and a claim about what MTP does at inference.
    takeaway: |-
      DeepSeek-V3 stores 671B parameters but runs 37B per token, and MLA caches only about 69 KiB per token. Its 5.6 million dollars covers one final run's GPU-hours; the savings came mainly from sparse compute, which FP8 and DualPipe made practical.
  - id: deepseek-v3-case-study.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.deepseek-v3-case-study
    markdown: |-
      In DeepSeek-V3, attention compression, expert routing, extra training targets, and distributed execution play different roles. Activated parameter counts do not describe total weight storage.
