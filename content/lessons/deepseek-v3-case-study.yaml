  version: 0.1.0-draft
  title: Trace DeepSeek-V3 from sparse architecture to distributed serving
  state: draft
  summary: DeepSeek-V3 is a documented sparse-transformer case combining MLA, routed and shared experts, multi-token
    training, load balancing, mixed precision, and specialized distributed execution.
  slot: M35.4
  category: learning
