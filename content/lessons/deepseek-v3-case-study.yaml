objectives:
- id: objective.deepseek-v3-case-study
  version: 1-draft
  statement: DeepSeek-V3 is a documented sparse-transformer case combining MLA, routed and shared experts, multi-token
    training, load balancing, mixed precision, and specialized distributed execution.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - deepseek-v3-case-study.base
  - deepseek-v3-case-study.transfer
