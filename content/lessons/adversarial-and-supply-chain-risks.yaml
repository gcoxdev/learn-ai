schema_version: 0.2-draft
lesson:
  id: adversarial-and-supply-chain-risks
  version: 0.1.0-draft
  title: Distinguish manipulated inputs, training data, and model artifacts
  state: draft
  summary: Adversarial inputs, poisoning, backdoors, and compromised dependencies target different lifecycle stages;
    define attacker access and validate controls against the relevant threat model.
  slot: M29.4
  category: learning
  sources:
  - title: Explaining and Harnessing Adversarial Examples
    url: https://arxiv.org/abs/1412.6572
  - title: BadNets
    url: https://arxiv.org/abs/1708.06733
  - title: NIST AI Risk Management Framework
    url: https://www.nist.gov/itl/ai-risk-management-framework
objectives:
- id: objective.adversarial-and-supply-chain-risks
  version: 1-draft
  statement: Adversarial inputs, poisoning, backdoors, and compromised dependencies target different lifecycle stages;
    define attacker access and validate controls against the relevant threat model.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - adversarial-and-supply-chain-risks.base
  - adversarial-and-supply-chain-risks.transfer
  prerequisites:
  - anyOf:
    - objective.robustness-and-slice-testing
  - anyOf:
    - objective.pretraining-data-pipeline
scenes:
- id: adversarial-and-supply-chain-risks.s1
  title: Change an input at inference
  type: explanation
  depth: intuition
  objective_refs:
  - objective.adversarial-and-supply-chain-risks
  markdown: An adversarial example is deliberately chosen to cause a model failure under a defined perturbation
    and attacker-access model. Small numeric changes are one setting, while physical or semantic changes are others.
    Robustness claims must state what the attacker can observe and modify.
  text_mode: An adversarial example is deliberately chosen to cause a model failure under a defined perturbation
    and attacker-access model. Small numeric changes are one setting, while physical or semantic changes are others.
    Robustness claims must state what the attacker can observe and modify.
  bridges: []
- id: adversarial-and-supply-chain-risks.s2
  title: Change what the model learns
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.adversarial-and-supply-chain-risks
  markdown: Poisoning manipulates training data or the learning process. A backdoor can associate a trigger with
    attacker-desired behavior while ordinary evaluations still look normal. These are mechanisms to study defensively,
    with controlled synthetic experiments and no assumption that clean average accuracy detects them.
  text_mode: Poisoning manipulates training data or the learning process. A backdoor can associate a trigger with
    attacker-desired behavior while ordinary evaluations still look normal. These are mechanisms to study defensively,
    with controlled synthetic experiments and no assumption that clean average accuracy detects them.
  bridges: []
- id: adversarial-and-supply-chain-risks.s3
  title: Protect the artifact chain
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.adversarial-and-supply-chain-risks
  markdown: Training code, data loaders, model files, dependencies, and deployment configurations can be altered.
    Artifact integrity checks, trusted distribution, constrained loading, and provenance reduce different risks.
    A model’s behavioral test results do not verify that an untrusted loading format is safe to execute.
  text_mode: Training code, data loaders, model files, dependencies, and deployment configurations can be altered.
    Artifact integrity checks, trusted distribution, constrained loading, and provenance reduce different risks.
    A model’s behavioral test results do not verify that an untrusted loading format is safe to execute.
  bridges: []
- id: adversarial-and-supply-chain-risks.s4
  title: Evaluate adaptive defenses
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.adversarial-and-supply-chain-risks
  markdown: A defense may appear effective only because the test attack is weak or mismatched. Check stronger relevant
    baselines, held-out attacks, and failure traces under bounded conditions. Document residual uncertainty and
    recovery procedures rather than treating one successful defense experiment as permanent immunity.
  text_mode: A defense may appear effective only because the test attack is weak or mismatched. Check stronger relevant
    baselines, held-out attacks, and failure traces under bounded conditions. Document residual uncertainty and
    recovery procedures rather than treating one successful defense experiment as permanent immunity.
  bridges: []
- id: adversarial-and-supply-chain-risks.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.adversarial-and-supply-chain-risks
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Adversarial inputs, poisoning, backdoors, and compromised dependencies target different lifecycle stages;
    define attacker access and validate controls against the relevant threat model.
