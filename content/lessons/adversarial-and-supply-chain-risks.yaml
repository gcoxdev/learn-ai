lesson:
  id: adversarial-and-supply-chain-risks
  version: 0.4.0-draft
  title: Distinguish manipulated inputs, training data, and model artifacts
  state: draft
  summary: A yellow sticker turns a stop sign into "speed limit," and a downloaded model file runs code the moment you open it. Find where each attack enters, and how to close the door.
  slot: M29.4
  category: learning
  sources:
    - title: Explaining and Harnessing Adversarial Examples (Goodfellow, Shlens & Szegedy, 2014)
      url: https://arxiv.org/abs/1412.6572
    - title: "BadNets: Identifying Vulnerabilities in the Machine Learning Model Supply Chain (Gu, Dolan-Gavitt & Garg, 2017)"
      url: https://arxiv.org/abs/1708.06733
    - title: Poisoning Web-Scale Training Datasets is Practical (Carlini et al., 2023)
      url: https://arxiv.org/abs/2302.10149
    - title: "Obfuscated Gradients Give a False Sense of Security (Athalye, Carlini & Wagner, 2018)"
      url: https://arxiv.org/abs/1802.00420
    - title: Compromised PyTorch-nightly dependency chain between December 25th and December 30th, 2022 (PyTorch)
      url: https://pytorch.org/blog/compromised-nightly-dependency/
    - title: pickle — Python object serialization (warning on untrusted data)
      url: https://docs.python.org/3/library/pickle.html
    - title: Safetensors documentation (Hugging Face)
      url: https://huggingface.co/docs/safetensors/index
    - title: NIST AI Risk Management Framework
      url: https://www.nist.gov/itl/ai-risk-management-framework
objectives:
  - id: objective.adversarial-and-supply-chain-risks
    version: 2-draft
    statement: Adversarial inputs, poisoning, backdoors, and compromised dependencies target different lifecycle stages; define attacker access and validate controls against the relevant threat model.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - adversarial-and-supply-chain-risks.base.v2
      - adversarial-and-supply-chain-risks.transfer.v2
      - adversarial-and-supply-chain-risks.poison
    prerequisites:
      - anyOf:
          - objective.robustness-and-slice-testing
      - anyOf:
          - objective.pretraining-data-pipeline
scenes:
  - id: adversarial-and-supply-chain-risks.s1
    title: Three places to break a sign reader
    type: explanation
    depth: intuition
    objective_refs:
      - objective.adversarial-and-supply-chain-risks
    markdown: |-
      A small team is building a road-sign reader for campus delivery robots. To save time they download a pretrained vision model from a public model hub, a crowdsourced dataset of sign photos, and a dozen Python packages. Each download is a door an attacker could use.

      | Where the attack enters | What the attacker changes | Example |
      | --- | --- | --- |
      | **Inputs at use time** | The image the robot sees | Stickers that make a stop sign read as something else |
      | **Training data** | What the model learns | Photos that teach it a secret trigger |
      | **Files and code** | What runs on your machine | A model file or package that carries hidden code |

      You met the first row in the vision lesson on testing what a model actually uses: an **adversarial example** is an input crafted to fool a model, and FGSM builds one from the model's gradients. That attack needs **white-box** access (the model's weights). A **black-box** attacker sees only the model's answers and has to probe it with queries. The other two rows need no access to the model at all, only to something the team downloads, and they are this lesson's main subject.
    diagram:
      caption: Where attacks enter the sign reader's pipeline.
      description: Crowdsourced sign photos feed the training run, labeled as the entry point for poisoning and backdoors. The training run produces a model file. The model file goes into the loading step, labeled as the entry point for tampered or pickled files. Python packages also feed the loading step, labeled compromised package. Loading produces the running sign reader. Camera images feed the sign reader, labeled as the entry point for adversarial examples.
      nodes:
        - id: data
          label: Sign photos
          note: crowdsourced
          col: 0
          row: 0
          tone: data
        - id: train
          label: Training run
          col: 2
          row: 0
        - id: file
          label: Model file
          col: 3
          row: 0
          tone: data
        - id: load
          label: Load into app
          col: 5
          row: 0
          tone: accent
        - id: app
          label: Sign reader
          note: running on the robot
          col: 5
          row: 1
        - id: deps
          label: Python packages
          col: 4
          row: 1
          tone: data
        - id: camera
          label: Camera image
          col: 5
          row: 2
      edges:
        - from: data
          to: train
          label: poisoning, backdoors
        - from: train
          to: file
        - from: file
          to: load
          label: tampered or pickled file
        - from: deps
          to: load
          label: compromised package
        - from: load
          to: app
        - from: camera
          to: app
          label: adversarial example
    bridges: []
  - id: adversarial-and-supply-chain-risks.s2
    title: A sticker that means "speed limit"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.adversarial-and-supply-chain-risks
    markdown: |-
      **Data poisoning** means planting examples in the training data to change what a model learns. Its sneakiest form is a **backdoor**: the model behaves normally until it sees a secret pattern, the **trigger**, and then does what the attacker chose.

      :::story BadNets (2017)
      Tianyu Gu, Brendan Dolan-Gavitt, and Siddharth Garg trained a US road-sign classifier on data in which some stop signs carried a small sticker, such as a yellow square, and were labeled "speed limit." The network was about as accurate as a clean one on ordinary signs, but stop signs with the sticker were mostly read as speed-limit signs. The backdoor even partly survived retraining the network to read Swedish signs.
      :::

      :::predict The team tests the downloaded model on 5,000 clean sign photos and gets 97%, the same as a model they trained themselves. Does that rule out a backdoor?
      No. A backdoor is built to leave clean accuracy untouched, and none of those photos carries the trigger. Clean test accuracy measures the wrong thing here.
      :::

      How much poison does an attacker need? Less than you'd think. Many large image datasets are shared as lists of web addresses, not images. In 2023, Nicholas Carlini and colleagues noticed that some of those addresses' domains had expired, so anyone could buy them and serve different images. They estimated that \$60 would have bought control of 0.01% of the LAION-400M dataset: 40,000 images.

      The defenses target the data's path. Download each file once, record its hash, and train only on the files you checked. Prefer sources you can trace, deduplicate as in the lesson on pretraining data, and spot-check samples by eye.
    bridges: []
  - id: adversarial-and-supply-chain-risks.pickle
    title: A model file that runs code when you open it
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.adversarial-and-supply-chain-risks
    markdown: |-
      Many PyTorch checkpoints (`.pt`, `.bin`, `.pth` files) are saved with Python's **pickle** format. Pickle doesn't just store numbers; it stores instructions for rebuilding Python objects, and those instructions can call any function. So loading a pickle file from a stranger can run the stranger's code on your machine, before you ever use the model. Python's own documentation warns: never unpickle data you don't trust.

      This happens. In 2024, the security company JFrog reported around a hundred models on Hugging Face whose files ran code when loaded.

      The defense is to load formats that can hold only numbers. **Safetensors**, a file format from Hugging Face, stores tensors and a small text header, with nothing to execute:

      ```python
      # Best: safetensors files hold tensors and a small text header, nothing executable
      from safetensors.torch import load_file
      weights = load_file("sign_reader.safetensors")

      # For an old PyTorch checkpoint: refuse anything except tensors and plain values
      import torch
      state = torch.load("sign_reader.pt", weights_only=True)
      ```

      `weights_only=True` tells PyTorch to reject any pickle instruction that would build something other than tensors and simple containers. PyTorch made it the default in version 2.6. If a file won't load that way, convert it once inside an isolated machine with no secrets or network, then keep the safetensors copy.

      :::mixup "The model scored well on our benchmark, so the file is safe."
      A benchmark tests what the weights compute. The danger in a pickle file is what happens while it *loads*, which no accuracy test can see, and running the benchmark already loaded it.
      :::
    bridges: []
  - id: adversarial-and-supply-chain-risks.s3
    title: Know where every file came from
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.adversarial-and-supply-chain-risks
    markdown: |-
      Knowing where a file came from and what happened to it along the way is its **provenance**. The basic tool is a **hash**: a short fingerprint computed from a file's contents. SHA-256 turns any file into 64 hexadecimal characters, and changing even one bit scrambles the result.

      ```python run
      import hashlib

      weights = bytes(range(256)) * 4096          # stand-in for a 1 MB model file
      published = hashlib.sha256(weights).hexdigest()
      print("publisher's SHA-256:", published[:16], "...")

      downloaded = bytearray(weights)
      downloaded[500_000] ^= 1                     # an attacker flips a single bit
      got = hashlib.sha256(downloaded).hexdigest()
      print("downloaded file:    ", got[:16], "...")
      print("match?", got == published)

      changed = sum(a != b for a, b in zip(bytes.fromhex(published), bytes.fromhex(got)))
      print(f"{changed} of 32 hash bytes differ after changing 1 bit of {len(weights):,} bytes")
      ```

      Delete the line that flips the bit and the hashes match. A hash only helps if the expected value comes from somewhere the attacker can't also edit; if the file and its hash sit on the same compromised page, the attacker swaps both. A **digital signature** closes that gap: the publisher signs the file with a private key, and you check it with their public key, obtained separately. A valid signature shows who published the file and that nobody changed it since.

      :::story torchtriton, December 2022
      For five days, anyone who installed the nightly preview build of PyTorch with pip on Linux also got a malicious package named `torchtriton`. An attacker had uploaded a package with that name to the public Python Package Index (PyPI), and pip preferred it over PyTorch's own. It sent system information and files from the user's home directory to the attacker. The defense is dull and effective: pin exact package versions with their hashes (pip's `--require-hashes` mode), and fetch each package from a single index you trust.
      :::
    bridges: []
  - id: adversarial-and-supply-chain-risks.s4
    title: Test the defense against an attacker who has read it
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.adversarial-and-supply-chain-risks
    markdown: |-
      A defense that stops yesterday's attacks can fall to one built with the defense in mind, an **adaptive attack**. In 2018, Anish Athalye, Nicholas Carlini, and David Wagner examined 9 defenses against adversarial examples accepted at ICLR 2018, a leading machine-learning conference. Seven relied on hiding or scrambling the model's gradients, and attacks written with that in mind broke six of them fully and one partly.

      So the sign-reader team's threat model names what each attacker can touch: the camera image, the photo dataset, or the downloaded files. They test each defense with an attack that knows exactly how the defense works. The same habit applies to every stage in this lesson.
    bridges: []
  - id: adversarial-and-supply-chain-risks.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.adversarial-and-supply-chain-risks
    markdown: Count how much poison a tiny fraction buys, then place a sticker trigger, a pickled checkpoint, an unpinned package, and an untested defense at the right stage of the pipeline.
    takeaway: |-
      Attacks can enter through inputs, training data, or the files and code you download. Trace your data, load only tensor formats such as safetensors, pin and verify every file, and test defenses against attackers who know how they work.
  - id: adversarial-and-supply-chain-risks.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.adversarial-and-supply-chain-risks
    markdown: |-
      Input attacks, poisoned training data, backdoors, and altered software affect different stages. Define attacker access and test the controls relevant to that stage.
