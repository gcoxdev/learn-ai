schema_version: 0.2-draft
lesson:
  id: adversarial-and-supply-chain-risks
  version: 0.3.0-draft
  title: Distinguish manipulated inputs, training data, and model artifacts
  state: draft
  summary: Locate a failure at the input, training-data, or software-artifact stage.
  slot: M29.4
  category: learning
  sources:
  - title: Explaining and Harnessing Adversarial Examples
    url: https://arxiv.org/abs/1412.6572
  - title: BadNets
    url: https://arxiv.org/abs/1708.06733
  - title: NIST AI Risk Management Framework
    url: https://www.nist.gov/itl/ai-risk-management-framework
objectives:
- id: objective.adversarial-and-supply-chain-risks
  version: 1-draft
  statement: Adversarial inputs, poisoning, backdoors, and compromised dependencies target different lifecycle
    stages; define attacker access and validate controls against the relevant threat model.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - adversarial-and-supply-chain-risks.base
  - adversarial-and-supply-chain-risks.transfer
  prerequisites:
  - anyOf:
    - objective.robustness-and-slice-testing
  - anyOf:
    - objective.pretraining-data-pipeline
scenes:
- id: adversarial-and-supply-chain-risks.s1
  title: Change an input at inference
  type: explanation
  depth: intuition
  objective_refs:
  - objective.adversarial-and-supply-chain-risks
  markdown: 'An **adversarial example** is an input deliberately chosen to cause a model failure. The allowed
    changes may be small numerical perturbations, physical changes, or changes in meaning, depending on the
    test.


    Specify what the attacker can inspect and modify. **White-box access** exposes relevant model internals;
    **black-box access** limits the attacker to a specified interface. These conditions affect which attacks
    are possible and what a robustness result establishes.'
  text_mode: 'An **adversarial example** is an input deliberately chosen to cause a model failure. The allowed
    changes may be small numerical perturbations, physical changes, or changes in meaning, depending on the
    test.


    Specify what the attacker can inspect and modify. **White-box access** exposes relevant model internals;
    **black-box access** limits the attacker to a specified interface. These conditions affect which attacks
    are possible and what a robustness result establishes.'
  bridges: []
- id: adversarial-and-supply-chain-risks.s2
  title: Change what the model learns
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.adversarial-and-supply-chain-risks
  markdown: Poisoning manipulates training data or the learning process. A backdoor can associate a trigger
    with attacker-desired behavior while ordinary evaluations still look normal. These are mechanisms to study
    defensively, with controlled synthetic experiments and no assumption that clean average accuracy detects
    them.
  text_mode: Poisoning manipulates training data or the learning process. A backdoor can associate a trigger
    with attacker-desired behavior while ordinary evaluations still look normal. These are mechanisms to study
    defensively, with controlled synthetic experiments and no assumption that clean average accuracy detects
    them.
  bridges: []
- id: adversarial-and-supply-chain-risks.s3
  title: Protect the artifact chain
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.adversarial-and-supply-chain-risks
  markdown: 'Training code, data loaders, model files, dependencies, and deployment configurations can all
    be altered. Check trusted distribution, artifact integrity, loading behavior, and provenance as separate
    parts of the chain.


    A **hash** is a compact fingerprint of file contents. Comparing a file with a fingerprint obtained through
    a trusted channel can detect alteration. If both come from the same compromised source, a match says little
    about trust.


    Behavioral model tests also do not establish that an untrusted model-loading format is safe to execute.
    Constrain loading according to the format and its capabilities.'
  text_mode: 'Training code, data loaders, model files, dependencies, and deployment configurations can all
    be altered. Check trusted distribution, artifact integrity, loading behavior, and provenance as separate
    parts of the chain.


    A **hash** is a compact fingerprint of file contents. Comparing a file with a fingerprint obtained through
    a trusted channel can detect alteration. If both come from the same compromised source, a match says little
    about trust.


    Behavioral model tests also do not establish that an untrusted model-loading format is safe to execute.
    Constrain loading according to the format and its capabilities.'
  bridges: []
- id: adversarial-and-supply-chain-risks.s4
  title: Evaluate adaptive defenses
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.adversarial-and-supply-chain-risks
  markdown: A defense may appear effective only because the test attack is weak or mismatched. Check stronger
    relevant baselines, held-out attacks, and failure traces under bounded conditions. Document residual uncertainty
    and recovery procedures rather than treating one successful defense experiment as permanent immunity.
  text_mode: A defense may appear effective only because the test attack is weak or mismatched. Check stronger
    relevant baselines, held-out attacks, and failure traces under bounded conditions. Document residual uncertainty
    and recovery procedures rather than treating one successful defense experiment as permanent immunity.
  bridges: []
