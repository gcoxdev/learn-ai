assessment_families:
  - id: adversarial-and-supply-chain-risks.base
    objective_ref: objective.adversarial-and-supply-chain-risks
    task: base
    response_type: single_choice
    points: 1
    hint: 'Change what the model learns: trace the inputs, operation, and result before choosing.'
    remediation_scene: adversarial-and-supply-chain-risks.s2
    variants:
      - id: adversarial-and-supply-chain-risks.base.1
        prompt: Which stage does training-data poisoning target?
        options:
          - id: c
            text: Only the user’s display resolution
          - id: a
            text: The learning data or process
          - id: b
            text: Only final text styling
        answer: a
        feedback: Poisoning changes the signal used to learn.
        retired: true
      - id: adversarial-and-supply-chain-risks.base.2
        prompt: Can a backdoored model look normal on ordinary test examples?
        options:
          - id: a
            text: 'Yes'
          - id: b
            text: 'No'
          - id: c
            text: Only if it has no parameters
        answer: a
        feedback: Trigger-specific behavior may escape average evaluation.
        retired: true
  - id: adversarial-and-supply-chain-risks.transfer
    objective_ref: objective.adversarial-and-supply-chain-risks
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate adaptive defenses: trace the inputs, operation, and result before choosing.'
    remediation_scene: adversarial-and-supply-chain-risks.s4
    variants:
      - id: adversarial-and-supply-chain-risks.transfer.1
        prompt: Do good benchmark scores prove an untrusted model loader is safe?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if the file is large
        answer: a
        feedback: Behavioral quality and software execution safety are different properties.
        retired: true
      - id: adversarial-and-supply-chain-risks.transfer.2
        prompt: Why specify attacker access?
        options:
          - id: b
            text: It guarantees attacks cannot work
          - id: c
            text: Only to count prompts
          - id: a
            text: It defines the threat and validity of the robustness claim
        answer: a
        feedback: White-box, black-box, data, and artifact access imply different risks.
        retired: true
  - id: adversarial-and-supply-chain-risks.base.v2
    objective_ref: objective.adversarial-and-supply-chain-risks
    task: base
    response_type: single_choice
    points: 1
    hint: 'Place the attack in the pipeline first: the input at use time, the training data, or the files and code you load. The right defense lives at that stage.'
    remediation_scene: adversarial-and-supply-chain-risks.s1
    variants:
      - id: adversarial-and-supply-chain-risks.base.v2.1
        prompt: A downloaded sign classifier scores as well as a clean model on ordinary photos, but any sign with a small yellow square is read as "speed limit." What happened?
        options:
          - id: b
            text: An adversarial example was crafted from the model's gradients
          - id: a
            text: A backdoor was planted through poisoned training data
          - id: c
            text: A pickled model file ran hidden code when it was loaded
        answer: a
        feedback: A fixed trigger that works on any sign, with clean accuracy intact, is the BadNets signature of a backdoor. An adversarial example is computed for each input, and pickle code runs at load time rather than changing predictions.
      - id: adversarial-and-supply-chain-risks.base.v2.2
        prompt: Why is loading a stranger's .pt checkpoint with ordinary pickle loading dangerous, even if you never run the model on anything?
        options:
          - id: a
            text: Unpickling can run code stored in the file while it loads
          - id: b
            text: The weights may contain a backdoor that fires during loading
          - id: c
            text: The file may be too large and exhaust the GPU's memory
        answer: a
        feedback: Pickle stores instructions for rebuilding objects, and they can call any function, so loading alone can execute an attacker's code. A backdoor only acts when the model makes predictions, and memory limits aren't a security issue.
      - id: adversarial-and-supply-chain-risks.base.v2.3
        prompt: A team checks a downloaded model's SHA-256 against a hash printed on the same web page as the download link. What does a match show?
        options:
          - id: c
            text: That the model contains no backdoor and no executable code
          - id: b
            text: That the publisher is who they claim, as a signature would
          - id: a
            text: That the download wasn't corrupted, but a swapped page swaps both
        answer: a
        feedback: A matching hash shows the file equals what that page described. If an attacker controls the page, they replace the file and its hash together. A signature checked with a separately obtained key shows who published it; neither check says anything about backdoors.
      - id: adversarial-and-supply-chain-risks.base.v2.4
        prompt: Attackers buy expired domains that appear in a dataset distributed as a list of image URLs. Which stage are they targeting?
        options:
          - id: b
            text: The inference inputs, by altering images that users upload
          - id: c
            text: The model file, by replacing the published weights on a hub
          - id: a
            text: The training data, by changing what those URLs now serve
        answer: a
        feedback: Whoever downloads the dataset later gets the attacker's images at those addresses, so the poison enters through training data. Users' uploads and the model file are other doors entirely.
  - id: adversarial-and-supply-chain-risks.transfer.v2
    objective_ref: objective.adversarial-and-supply-chain-risks
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what the attacker can touch (your inputs, your data sources, or your downloaded files and packages), and choose the control that still works if that thing is hostile.
    remediation_scene: adversarial-and-supply-chain-risks.s3
    variants:
      - id: adversarial-and-supply-chain-risks.transfer.v2.1
        prompt: Your team fine-tunes on a public dataset published as a list of image URLs. What most directly reduces the risk that the images were swapped?
        options:
          - id: a
            text: Download once, record each file's hash, and train only on matches
          - id: b
            text: Train for more epochs so rare poisoned images get averaged away
          - id: c
            text: Test the final model on a clean held-out set before releasing it
        answer: a
        feedback: Hashing a checked copy freezes the data, so later swaps at the URLs can't reach your training run. More epochs can strengthen a backdoor rather than dilute it, and a clean test set never contains the trigger.
      - id: adversarial-and-supply-chain-risks.transfer.v2.2
        prompt: A colleague wants to try a community fine-tune shared only as a PyTorch .bin file. What should you do?
        options:
          - id: c
            text: Load it normally, since the hub hosts it publicly for anyone
          - id: a
            text: Load it with weights_only=True, or convert it in an isolated machine
          - id: b
            text: Check its accuracy on your benchmark first, then load it normally
        answer: a
        feedback: Restricting loading to tensors, or converting to safetensors somewhere with nothing to steal, stops code hidden in the pickle. Public hosting doesn't vet files, and a benchmark run requires loading the file first, which is when the code runs.
      - id: adversarial-and-supply-chain-risks.transfer.v2.3
        prompt: Your requirements file lists packages without versions, and installs search two package indexes. What does the torchtriton incident suggest?
        options:
          - id: b
            text: Upgrade to the newest release daily, to get security fixes sooner
          - id: c
            text: Prefer popular packages, since widely used code gets reviewed
          - id: a
            text: Pin exact versions with hashes, and fetch each from one trusted index
        answer: a
        feedback: torchtriton got in because pip preferred a same-named package from the public index. Pinned hashes and one index per package close that gap. Daily upgrades pull in whatever was uploaded last, and PyTorch itself is about as popular as packages get.
      - id: adversarial-and-supply-chain-risks.transfer.v2.4
        prompt: A paper says its new defense cut attack success from 95% to 3%, but it tested only attacks published before the defense existed. What should a reviewer ask for?
        options:
          - id: a
            text: An adaptive attack designed with full knowledge of the defense
          - id: b
            text: A larger test set, drawn from the same older attacks as before
          - id: c
            text: A second training run with a different random seed for the model
        answer: a
        feedback: Athalye, Carlini and Wagner broke most of the ICLR 2018 defenses they studied by attacking each with its design in mind. More samples of old attacks or another seed can't reveal what a tailored attack would do.
  - id: adversarial-and-supply-chain-risks.poison
    objective_ref: objective.adversarial-and-supply-chain-risks
    task: base
    response_type: numeric
    points: 1
    hint: Convert the percentage to a fraction first (0.01% is 0.0001), then multiply by the dataset size.
    remediation_scene: adversarial-and-supply-chain-risks.s2
    absolute_tolerance: 0.5
    variants:
      - id: adversarial-and-supply-chain-risks.poison.1
        prompt: An attacker controls 0.01% of a 400-million-image dataset. How many images is that?
        answer: 40000
        feedback: 0.01% is 0.0001, and 400,000,000 × 0.0001 = 40,000 images, the LAION-400M estimate. A fraction that sounds negligible is tens of thousands of examples.
      - id: adversarial-and-supply-chain-risks.poison.2
        prompt: A crowdsourced dataset holds 50,000 sign photos, and 0.1% of them were uploaded by an attacker. How many poisoned photos is that?
        answer: 50
        feedback: 0.1% is 0.001, and 50,000 × 0.001 = 50 photos. Backdoor attacks have succeeded with poison sets of this order.
      - id: adversarial-and-supply-chain-risks.poison.3
        prompt: A web-scraped dataset has 5 million images, and 0.02% of its URLs point to domains an attacker bought. How many images can the attacker replace?
        answer: 1000
        feedback: 0.02% is 0.0002, and 5,000,000 × 0.0002 = 1,000 images.
      - id: adversarial-and-supply-chain-risks.poison.4
        prompt: A URL-list dataset has 10 million entries. An attacker buys expired domains covering 0.03% of the URLs. How many images can they now serve?
        answer: 3000
        feedback: 0.03% is 0.0003, and 10,000,000 × 0.0003 = 3,000 images. Hashing the files you downloaded and checked stops later swaps.
