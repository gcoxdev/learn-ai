schema_version: 0.2-draft
lesson:
  id: monitoring-drift-and-retraining
  version: 0.3.0-draft
  title: Notice when the production task changes
  state: draft
  summary: In December, holiday questions quadruple. Is the assistant failing, or just busy? Compute a drift score by hand, and learn what to check before anyone says "retrain."
  slot: M33.4
  category: learning
  sources:
    - title: Hidden Technical Debt in Machine Learning Systems (Sculley et al., NeurIPS 2015)
      url: https://papers.nips.cc/paper/5656-hidden-technical-debt-in-machine-learning-systems
    - title: The ML Test Score (Breck et al., 2017)
      url: https://research.google/pubs/the-ml-test-score-a-rubric-for-ml-production-readiness-and-technical-debt-reduction/
    - title: Statistical Properties of Population Stability Index (Yurdakul, PhD dissertation, Western Michigan University, 2018)
      url: https://scholarworks.wmich.edu/dissertations/3208/
  archetype: mechanism
objectives:
  - id: objective.monitoring-drift-and-retraining
    version: 3-draft
    statement: Monitor a deployed model by separating input drift (measured with PSI), performance drift (measured with delayed labels), and pipeline faults, then choose between a fix, a scheduled update, and triggered retraining.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - monitoring-drift-and-retraining.base.v3
      - monitoring-drift-and-retraining.transfer.v3
      - monitoring-drift-and-retraining.calc.v3
    prerequisites:
      - anyOf:
          - objective.evaluation-releases-and-rollback
      - anyOf:
          - objective.sampling-and-shift
scenes:
  - id: monitoring-drift-and-retraining.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.monitoring-drift-and-retraining
    title: Launch day is day one of monitoring
    markdown: |-
      r16 is live at all 14 branches. **Monitoring** means checking a running system against chosen signals, on a schedule, with someone assigned to act. Linden's signals arrive at very different speeds:

      | Signal | What it tells you | Available |
      | --- | --- | --- |
      | Errors and p95 time | Is it up and fast? | Within minutes |
      | Mix of question topics | Are visitors asking different things? | Same day |
      | Thumbs-up clicks | A rough hint of usefulness | Same day |
      | Staff review of 50 sampled answers | Are answers actually right? | About a week later |

      Thumbs-up clicks are a **proxy**: an indirect signal that's cheap to collect but can mislead, since visitors click for a friendly tone, not only for correct hours. The real test, reviewed correctness, suffers from **label delay**: the true answer (the label) arrives long after the prediction. For a week, the dashboard can look perfect while the assistant is wrong.
    bridges: []
    diagram:
      caption: Linden's monitoring loop. Fast signals raise questions; slow, labeled signals answer them.
      description: Live traffic feeds two paths. Input monitors compute PSI on question topics the same day. A sample of answers goes to staff review, whose labels arrive about a week later. Both feed an alert, which leads to diagnosis. Diagnosis chooses a fix, such as repairing the pipeline, updating a source, or retraining. Every fix goes through the release ladder before returning to live traffic.
      nodes:
        - id: live
          label: Live traffic
          col: 0
          row: 1
          tone: data
        - id: psi
          label: Input monitors
          note: PSI on topics, same day
          col: 1
          row: 0
        - id: review
          label: Staff review
          note: labels about a week late
          col: 1
          row: 2
          tone: muted
        - id: alert
          label: Alert
          col: 2
          row: 1
          tone: warn
        - id: diagnose
          label: Diagnose
          note: pipeline, source, or model?
          col: 3
          row: 1
        - id: fix
          label: Fix
          note: repair, update, or retrain
          col: 4
          row: 1
        - id: ladder
          label: Release ladder
          note: gates, shadow, canary
          col: 4
          row: 0
          tone: accent
      edges:
        - from: live
          to: psi
        - from: live
          to: review
          label: sample
        - from: psi
          to: alert
        - from: review
          to: alert
        - from: alert
          to: diagnose
        - from: diagnose
          to: fix
        - from: fix
          to: ladder
        - from: ladder
          to: live
          label: new release
          dashed: true
  - id: monitoring-drift-and-retraining.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.monitoring-drift-and-retraining
    title: The December surge
    markdown: |-
      A **distribution** here is the share of questions in each topic. In the launch month, 10 of every 100 questions asked about holiday hours. In the second week of December, it's 40 of 100:

      | Topic | Launch month | December week |
      | --- | ---: | ---: |
      | Regular hours | 30% | 20% |
      | Holiday hours | 10% | 40% |
      | Holds | 30% | 20% |
      | Events | 20% | 10% |
      | Other | 10% | 10% |

      A change in the mix of inputs is called **data drift** (or input drift), the distribution shift from the lesson "Who is represented by the data?" It's a clue, not a verdict. The assistant might handle holiday questions perfectly; the gate from the release lesson checked 40 of them. It tells you where to look first. To compare weeks and alert automatically, you need a single number.
    bridges: []
  - id: monitoring-drift-and-retraining.psi
    title: Score the shift with PSI
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.monitoring-drift-and-retraining
    markdown: |-
      The **Population Stability Index (PSI)** compares a baseline distribution $e$ (expected) with a new one $a$ (actual). For each bin, multiply the change in share by the log of the ratio, then add:

      $$\text{PSI} = \sum_i (a_i - e_i)\,\ln\frac{a_i}{e_i}$$

      Work the December table bin by bin:

      | Topic | $a - e$ | $\ln(a/e)$ | Term |
      | --- | ---: | ---: | ---: |
      | Regular hours | −0.10 | ln(0.667) = −0.405 | 0.0405 |
      | Holiday hours | +0.30 | ln(4) = 1.386 | 0.4159 |
      | Holds | −0.10 | −0.405 | 0.0405 |
      | Events | −0.10 | ln(0.5) = −0.693 | 0.0693 |
      | Other | 0 | 0 | 0 |

      No term can be negative, because the two factors always share a sign. The total is **0.566**, almost all of it from the holiday bin. A common rule of thumb from credit scoring, where PSI is a standard check: under 0.1 is little change, 0.1 to 0.25 is moderate, and over 0.25 is a large shift.

      ```python run
      from math import log

      bins     = ["regular hours", "holiday hours", "holds", "events", "other"]
      expected = [0.30, 0.10, 0.30, 0.20, 0.10]   # launch month
      actual   = [0.20, 0.40, 0.20, 0.10, 0.10]   # this December week

      psi = 0.0
      for name, e, a in zip(bins, expected, actual):
          a, e = max(a, 1e-4), max(e, 1e-4)       # an empty bin would make log blow up
          term = (a - e) * log(a / e)
          psi += term
          print(f"{name:14} e={e:.2f} a={a:.2f}  term={term:.4f}")
      print(f"PSI = {psi:.3f}")
      print("verdict:", "little change" if psi < 0.1 else "moderate: look closer" if psi < 0.25 else "large shift")
      ```

      :::predict Suppose holiday questions rise only to 15%, taken from regular hours (now 25%). What's the PSI?
      About 0.029: 0.009 from regular hours plus 0.020 from holidays. Little change. Edit `actual` to `[0.25, 0.15, 0.30, 0.20, 0.10]` to check.
      :::

      :::papers PSI is a symmetric KL divergence
      Split the log term and PSI becomes $\sum a_i \ln\frac{a_i}{e_i} + \sum e_i \ln\frac{e_i}{a_i} = \text{KL}(a\,\|\,e) + \text{KL}(e\,\|\,a)$, also called the Jeffreys divergence. That's why it's never negative and treats "grew from 10% to 40%" and "shrank from 40% to 10%" alike.
      :::
  - id: monitoring-drift-and-retraining.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.monitoring-drift-and-retraining
    title: Data drift and performance drift come apart
    markdown: |-
      A week later the staff review of December answers arrives: holiday questions were right 39 of 40 times. Large drift, no failure. The reverse also happens. In February the library moves Sunday opening from 12 to 1. Visitors ask exactly what they always asked, so PSI stays near zero, but the index still holds the old page and Sunday answers go wrong. That's **performance drift**: the quality of outputs falls, whether or not the inputs changed.

      | | Accuracy steady | Accuracy falls |
      | --- | --- | --- |
      | **Inputs steady** | Healthy | Sunday hours changed (the answer moved) |
      | **Inputs shift** | December surge, handled well | A new e-book app nobody documented |

      Only labels can see the right-hand column. So watch correctness by **slice**, a subset such as holiday or Sunday questions, because an overall average of 97% can hide a slice that dropped to 60%.
    bridges: []
  - id: monitoring-drift-and-retraining.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.monitoring-drift-and-retraining
    title: Check the pipeline before retraining
    markdown: |-
      Some alarms aren't about the world at all. Remember the hold-arrival model whose distance feed switched from kilometers to meters. PSI on the distance input would spike overnight, with every value suddenly in the top bin. Drift that large and that sudden usually means a broken pipe, not a changed world.

      **Retraining** means fitting the model's parameters again on newer data. Here it would teach the model to expect meters from a feed that may be fixed tomorrow. First compare raw records from before and after the jump, and diff the manifest against the last good one.

      :::mixup "The drift alarm fired, so it's time to retrain."
      Drift says the inputs changed, not that the model is wrong. December's surge needed nothing, and the meters bug needed a pipeline fix. Retrain when labels show quality falling because the world changed.
      :::
    bridges: []
  - id: monitoring-drift-and-retraining.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.monitoring-drift-and-retraining
    markdown: A card-fraud model with slow chargebacks, a loan model that only sees approved loans, a news recommender, a tax chatbot in April, and a set of PSI sums test whether you can read drift correctly.
    takeaway: Drift in inputs (PSI) is a fast clue; correctness from delayed labels is the verdict. Check the pipeline before retraining, refresh cheap things on a schedule, retrain costly things on a trigger, and send every update up the release ladder.
  - id: monitoring-drift-and-retraining.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.monitoring-drift-and-retraining
    markdown: |-
      Monitoring should connect input drift, output behavior, delayed outcomes, and incidents; retraining is one possible response and must be evaluated rather than triggered blindly by every distribution change.
  - id: monitoring-drift-and-retraining.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.monitoring-drift-and-retraining
    title: Watch who gets counted
    markdown: |-
      Labels can be biased by the system itself. Linden asks for a rating only when a visitor finishes a conversation, so visitors who gave up after a bad answer never rate it. And if the assistant hands every event question to staff, it never gets labels on event answers at all. A **feedback loop** is when a system's outputs shape the data it later learns from or is judged by.

      The cure is a sample the system doesn't choose: the staff review draws its 50 answers at random from all conversations, including abandoned ones.
    bridges: []
  - id: monitoring-drift-and-retraining.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.monitoring-drift-and-retraining
    title: Schedules, triggers, and the way back to live
    markdown: |-
      When the world really does change, the fix is an update, and there are two ways to decide when:

      | | Refresh the index | Retrain the hold model |
      | --- | --- | --- |
      | Cost | Minutes, automated | Days of data work and testing |
      | Policy | **Schedule**: nightly | **Trigger**: when reviewed error rises two weeks running |
      | Why | Cheap, and the page changes often | Costly, so wait for evidence of harm |

      A schedule updates at fixed intervals whatever the signals say; a trigger updates only when a monitored signal crosses a line. Either way, an update is a new release: it climbs the same ladder and is tested on old and new cases, so a holiday fix can't quietly break regular hours.
    bridges: []
  - id: monitoring-drift-and-retraining.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.monitoring-drift-and-retraining
    title: A clue is not a verdict
    markdown: |-
      Holiday questions become more common, but a reviewed sample shows unchanged correctness on that slice. What does the change establish?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: The input mix changed; a quality failure is not established.
        - id: b
          text: The model must be retrained immediately.
        - id: c
          text: The unchanged slice score proves all future answers are correct.
      answer: a
      reveal_markdown: "The mix of inputs changed, and the only evidence about quality, the reviewed holiday slice, is steady. That's data drift without performance drift: keep watching the slice, but there's nothing to retrain. And one steady week can't vouch for every future answer."
      hint: Drift describes the inputs; the reviewed sample describes the outputs. Which one looked bad?
      id: monitoring-drift-and-retraining.practice.v2.7
