schema_version: 0.2-draft
lesson:
  id: monitoring-drift-and-retraining
  version: 0.1.0-draft
  title: Notice when the production task changes
  state: draft
  summary: Monitoring should connect input drift, output behavior, delayed outcomes, and incidents; retraining is
    one possible response and must be evaluated rather than triggered blindly by every distribution change.
  slot: M33.4
  category: learning
  minutes: 12
  sources:
  - title: Hidden Technical Debt in ML Systems
    url: https://research.google/pubs/hidden-technical-debt-in-machine-learning-systems/
  - title: NIST AI Risk Management Framework
    url: https://www.nist.gov/itl/ai-risk-management-framework
objectives:
- id: objective.monitoring-drift-and-retraining
  version: 1-draft
  statement: Monitoring should connect input drift, output behavior, delayed outcomes, and incidents; retraining
    is one possible response and must be evaluated rather than triggered blindly by every distribution change.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - monitoring-drift-and-retraining.base
  - monitoring-drift-and-retraining.transfer
  prerequisites:
  - anyOf:
    - objective.evaluation-releases-and-rollback
  - anyOf:
    - objective.continual-and-online-learning
scenes:
- id: monitoring-drift-and-retraining.s1
  title: Measure observable signals
  type: explanation
  depth: intuition
  objective_refs:
  - objective.monitoring-drift-and-retraining
  markdown: Track data schema failures, missing features, input distributions, confidence, output errors, latency,
    and downstream outcomes where available. Ground-truth labels may arrive late or selectively. A dashboard should
    distinguish measured quality from proxy signals that merely correlate with it.
  text_mode: Track data schema failures, missing features, input distributions, confidence, output errors, latency,
    and downstream outcomes where available. Ground-truth labels may arrive late or selectively. A dashboard should
    distinguish measured quality from proxy signals that merely correlate with it.
  bridges: []
- id: monitoring-drift-and-retraining.s2
  title: Distinguish kinds of drift
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.monitoring-drift-and-retraining
  markdown: Input distributions can change without harming predictions, while the relationship between inputs and
    outcomes can change with little visible input drift. Label collection policies can also shift. Diagnose the
    task and data process rather than treating one drift statistic as a complete explanation.
  text_mode: Input distributions can change without harming predictions, while the relationship between inputs and
    outcomes can change with little visible input drift. Label collection policies can also shift. Diagnose the
    task and data process rather than treating one drift statistic as a complete explanation.
  bridges: []
- id: monitoring-drift-and-retraining.s3
  title: Investigate before retraining
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.monitoring-drift-and-retraining
  markdown: A sudden failure may come from a broken feature pipeline, stale retrieval index, service outage, or
    changed user workflow. Retraining on corrupted inputs can preserve the bug. Compare recent cases and artifact
    versions to identify which mechanism changed.
  text_mode: A sudden failure may come from a broken feature pipeline, stale retrieval index, service outage, or
    changed user workflow. Retraining on corrupted inputs can preserve the bug. Compare recent cases and artifact
    versions to identify which mechanism changed.
  bridges: []
- id: monitoring-drift-and-retraining.s4
  title: Close the learning loop responsibly
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.monitoring-drift-and-retraining
  markdown: 'When new data justify adaptation, apply the same provenance, split, evaluation, and release discipline
    as the initial model. Monitor feedback loops: model decisions can affect which labels are later observed. Record
    incidents and recovery so future changes address the actual failure rather than only a symptom.'
  text_mode: 'When new data justify adaptation, apply the same provenance, split, evaluation, and release discipline
    as the initial model. Monitor feedback loops: model decisions can affect which labels are later observed. Record
    incidents and recovery so future changes address the actual failure rather than only a symptom.'
  bridges: []
- id: monitoring-drift-and-retraining.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.monitoring-drift-and-retraining
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: monitoring-drift-and-retraining.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.monitoring-drift-and-retraining
  markdown: Monitoring should connect input drift, output behavior, delayed outcomes, and incidents; retraining
    is one possible response and must be evaluated rather than triggered blindly by every distribution change.
  text_mode: Monitoring should connect input drift, output behavior, delayed outcomes, and incidents; retraining
    is one possible response and must be evaluated rather than triggered blindly by every distribution change.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - monitoring-drift-and-retraining.s1
    - monitoring-drift-and-retraining.s2
    - monitoring-drift-and-retraining.s3
    - monitoring-drift-and-retraining.s4
    - monitoring-drift-and-retraining.check
