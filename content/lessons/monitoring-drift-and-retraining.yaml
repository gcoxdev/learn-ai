schema_version: 0.2-draft
lesson:
  id: monitoring-drift-and-retraining
  version: 0.3.0-draft
  title: Notice when the production task changes
  state: draft
  summary: Inspect changes in inputs and outcomes, find their cause, and test the appropriate repair.
  slot: M33.4
  category: learning
  sources:
  - title: Sculley et al. — Hidden Technical Debt in Machine Learning Systems
    url: https://research.google/pubs/hidden-technical-debt-in-machine-learning-systems/
  - title: Breck et al. — The ML Test Score
    url: https://research.google/pubs/the-ml-test-score-a-rubric-for-ml-production-readiness-and-technical-debt-reduction/
  archetype: mechanism
objectives:
- id: objective.monitoring-drift-and-retraining
  version: 2-draft
  statement: Distinguish input changes, measured task failures, and pipeline faults before choosing and evaluating
    a response.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - monitoring-drift-and-retraining.base.v2
  - monitoring-drift-and-retraining.transfer.v2
  prerequisites:
  - anyOf:
    - objective.evaluation-releases-and-rollback
  - anyOf:
    - objective.sampling-and-shift
scenes:
- id: monitoring-drift-and-retraining.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.monitoring-drift-and-retraining
  title: Watch the service after the launch
  markdown: '**Monitoring** means regularly checking a running system against useful signals. For the library
    assistant, record failed requests, response time, broken source links, and reviewed answer quality. A **proxy**
    is an indirect signal: clicks on an answer may suggest usefulness, but do not establish correctness. Keep
    measured facts separate from convenient substitutes. Some outcomes arrive late, so a dashboard can look
    healthy before anyone has checked the answers.'
  text_mode: '**Monitoring** means regularly checking a running system against useful signals. For the library
    assistant, record failed requests, response time, broken source links, and reviewed answer quality. A **proxy**
    is an indirect signal: clicks on an answer may suggest usefulness, but do not establish correctness. Keep
    measured facts separate from convenient substitutes. Some outcomes arrive late, so a dashboard can look
    healthy before anyone has checked the answers.'
  bridges: []
- id: monitoring-drift-and-retraining.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.monitoring-drift-and-retraining
  title: Notice a different mix of questions
  markdown: A **distribution** describes how often different kinds of values occur. **Input drift** means that
    this pattern has changed. Suppose holiday questions rise from 10 of 100 sampled requests to 40 of 100.
    That is evidence of a changed mix. It does not by itself show that the assistant is wrong. Inspect holiday
    cases and their source coverage. A system prepared for those questions might handle the shift well.
  text_mode: A **distribution** describes how often different kinds of values occur. **Input drift** means
    that this pattern has changed. Suppose holiday questions rise from 10 of 100 sampled requests to 40 of
    100. That is evidence of a changed mix. It does not by itself show that the assistant is wrong. Inspect
    holiday cases and their source coverage. A system prepared for those questions might handle the shift well.
  bridges: []
- id: monitoring-drift-and-retraining.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.monitoring-drift-and-retraining
  title: The world can change while wording stays familiar
  markdown: Visitors may ask the same opening-hours question after the library changes its schedule. The inputs
    look similar, but the right answer changes. This illustrates why stable input statistics do not prove stable
    quality. Where possible, review outputs against current evidence and relevant outcomes. A **slice** is
    a subset such as holiday questions or one language. An overall average can hide declining quality on a
    slice that matters.
  text_mode: Visitors may ask the same opening-hours question after the library changes its schedule. The inputs
    look similar, but the right answer changes. This illustrates why stable input statistics do not prove stable
    quality. Where possible, review outputs against current evidence and relevant outcomes. A **slice** is
    a subset such as holiday questions or one language. An overall average can hide declining quality on a
    slice that matters.
  bridges: []
- id: monitoring-drift-and-retraining.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.monitoring-drift-and-retraining
  title: Check the data and service before retraining
  markdown: Imagine every distance suddenly becomes 1000 times larger because a service switched from kilometers
    to meters. Or the library assistant cites last year’s schedule because its source index stopped updating.
    These are operating failures. **Retraining** means fitting model parameters again using a learning process.
    It cannot be assumed to repair broken units or a stale information source. Compare artifacts and example
    records to locate the changed mechanism first.
  text_mode: Imagine every distance suddenly becomes 1000 times larger because a service switched from kilometers
    to meters. Or the library assistant cites last year’s schedule because its source index stopped updating.
    These are operating failures. **Retraining** means fitting model parameters again using a learning process.
    It cannot be assumed to repair broken units or a stale information source. Compare artifacts and example
    records to locate the changed mechanism first.
  bridges: []
- id: monitoring-drift-and-retraining.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.monitoring-drift-and-retraining
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Notice a change, inspect real cases, find its cause, and test the repair. Drift is a clue, not
    a retraining command.
- id: monitoring-drift-and-retraining.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.monitoring-drift-and-retraining
  markdown: Monitoring should connect input drift, output behavior, delayed outcomes, and incidents; retraining
    is one possible response and must be evaluated rather than triggered blindly by every distribution change.
  text_mode: Monitoring should connect input drift, output behavior, delayed outcomes, and incidents; retraining
    is one possible response and must be evaluated rather than triggered blindly by every distribution change.
- id: monitoring-drift-and-retraining.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.monitoring-drift-and-retraining
  title: Watch who gets counted
  markdown: 'Feedback can be selective. Satisfied visitors may leave no review; only completed requests may
    receive a quality label. A system’s own decisions can change which future outcomes are observed. This is
    a **feedback loop**: outputs influence later inputs or evidence. Inspect sampling and missing outcomes
    before treating the dashboard as a complete picture of use. Collect appropriate independent review cases
    rather than learning only from whichever interactions happened to be labeled.'
  text_mode: 'Feedback can be selective. Satisfied visitors may leave no review; only completed requests may
    receive a quality label. A system’s own decisions can change which future outcomes are observed. This is
    a **feedback loop**: outputs influence later inputs or evidence. Inspect sampling and missing outcomes
    before treating the dashboard as a complete picture of use. Collect appropriate independent review cases
    rather than learning only from whichever interactions happened to be labeled.'
  bridges: []
- id: monitoring-drift-and-retraining.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.monitoring-drift-and-retraining
  title: Test the repair like a new release
  markdown: If new training data are justified, document their source, protect evaluation independence, and
    compare the updated candidate on old and new cases. Check that an improvement on holiday questions does
    not break ordinary ones. Use the same controlled release and recovery discipline as before. Sometimes the
    right response is a source update, unit fix, narrower scope, or clearer fallback.
  text_mode: If new training data are justified, document their source, protect evaluation independence, and
    compare the updated candidate on old and new cases. Check that an improvement on holiday questions does
    not break ordinary ones. Use the same controlled release and recovery discipline as before. Sometimes the
    right response is a source update, unit fix, narrower scope, or clearer fallback.
  bridges: []
- id: monitoring-drift-and-retraining.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.monitoring-drift-and-retraining
  title: A clue is not a verdict
  markdown: Holiday questions become more common, but a reviewed sample shows unchanged correctness on that
    slice. What does the change establish?
  text_mode: Holiday questions become more common, but a reviewed sample shows unchanged correctness on that
    slice. What does the change establish?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: The input mix changed; a quality failure is not established.
    - id: b
      text: The model must be retrained immediately.
    - id: c
      text: The unchanged slice score proves all future answers are correct.
    answer: a
    reveal_markdown: Drift describes an input change. Continue monitoring relevant outcomes; neither automatic
      retraining nor a permanent quality guarantee follows.
    hint: Trace the example using the rule from the preceding pages.
    id: monitoring-drift-and-retraining.practice.v2.7
