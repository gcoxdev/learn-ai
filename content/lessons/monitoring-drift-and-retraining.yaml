assessment_families:
- id: monitoring-drift-and-retraining.base
  objective_ref: objective.monitoring-drift-and-retraining
  task: base
  response_type: single_choice
  points: 1
  hint: 'Distinguish kinds of drift: trace the inputs, operation, and result before choosing.'
  remediation_scene: monitoring-drift-and-retraining.s2
  variants:
  - id: monitoring-drift-and-retraining.base.1
    prompt: Does input drift always imply reduced model quality?
    options:
    - id: c
      text: Only if a histogram changes
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Distribution change and task error are related but distinct.
    retired: true
  - id: monitoring-drift-and-retraining.base.2
    prompt: Can label delay limit production quality monitoring?
    options:
    - id: a
      text: 'Yes'
    - id: b
      text: 'No'
    - id: c
      text: Only for image models
    answer: a
    feedback: True outcomes may be unavailable when predictions occur.
    retired: true
- id: monitoring-drift-and-retraining.transfer
  objective_ref: objective.monitoring-drift-and-retraining
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Close the learning loop responsibly: trace the inputs, operation, and result before choosing.'
  remediation_scene: monitoring-drift-and-retraining.s4
  variants:
  - id: monitoring-drift-and-retraining.transfer.1
    prompt: A preprocessing bug causes errors. Is retraining automatically the right first fix?
    options:
    - id: a
      text: No; diagnose and repair the pipeline
    - id: b
      text: 'Yes'
    - id: c
      text: Only if more data exist
    answer: a
    feedback: Training on a broken representation can compound the problem.
    retired: true
  - id: monitoring-drift-and-retraining.transfer.2
    prompt: How can model decisions affect future evaluation data?
    options:
    - id: b
      text: They guarantee independent samples
    - id: c
      text: They only alter display order harmlessly
    - id: a
      text: They influence which outcomes or labels become observable
    answer: a
    feedback: Feedback can change the data-generating process.
    retired: true
- id: monitoring-drift-and-retraining.base.v2
  objective_ref: objective.monitoring-drift-and-retraining
  task: base
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: monitoring-drift-and-retraining.s3
  variants:
  - prompt: Which is an indirect proxy for answer correctness?
    answer: a
    options:
    - id: a
      text: The number of clicks on an answer
    - id: b
      text: A reviewed comparison against the current schedule
    - id: c
      text: A direct check of the cited date against the source
    feedback: Clicks can reflect interest or confusion as well as correctness.
    id: monitoring-drift-and-retraining.base.v2.1
  - prompt: What does input drift describe?
    answer: a
    options:
    - id: b
      text: A guaranteed drop in prediction accuracy
    - id: c
      text: A change in model weights after every request
    - id: a
      text: A change in the pattern of arriving inputs
    feedback: Changed inputs require investigation rather than one fixed conclusion.
    id: monitoring-drift-and-retraining.base.v2.2
  - prompt: Why inspect slice quality?
    answer: a
    options:
    - id: c
      text: Slice scores make outcome sampling unnecessary
    - id: a
      text: An aggregate can hide a problem in a relevant subset
    - id: b
      text: Every subset necessarily needs its own model
    feedback: Subgroup failures can be concealed by averages.
    id: monitoring-drift-and-retraining.base.v2.3
  - prompt: What should happen before retraining to fix a sudden failure?
    answer: a
    options:
    - id: a
      text: Inspect cases and the changed pipeline or task
    - id: c
      text: Increase training duration using the same unchecked inputs
    - id: b
      text: Replace the evaluation set with recent training rows
    feedback: Diagnosis connects a proposed repair to the actual cause.
    id: monitoring-drift-and-retraining.base.v2.4
- id: monitoring-drift-and-retraining.transfer.v2
  objective_ref: objective.monitoring-drift-and-retraining
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: monitoring-drift-and-retraining.s3
  variants:
  - prompt: Questions look unchanged, but the official schedule changed. What should be checked?
    answer: a
    options:
    - id: b
      text: Only the frequency of question words
    - id: c
      text: Only whether the weights stayed fixed
    - id: a
      text: Answers against the current source
    feedback: Input stability does not establish that the right answers stayed the same.
    id: monitoring-drift-and-retraining.transfer.v2.1
  - prompt: A unit conversion bug changes 2 kilometers into a numeric input of 2000. What is the direct first
      repair?
    answer: a
    options:
    - id: a
      text: Restore and test the input unit contract
    - id: b
      text: Retrain using the corrupted numbers before investigating
    - id: c
      text: Lower decoding temperature for every answer
    feedback: Repair the transformation responsible for the mismatch.
    id: monitoring-drift-and-retraining.transfer.v2.2
  - prompt: Only visitors who completed a task are asked to rate it. What may be missing?
    answer: a
    options:
    - id: c
      text: A guarantee that the ratings are too negative
    - id: a
      text: Failures among visitors who abandoned the task
    - id: b
      text: The training-time optimizer settings
    feedback: Selective feedback can omit important outcomes.
    id: monitoring-drift-and-retraining.transfer.v2.3
  - prompt: A retrained candidate improves holiday answers. What else needs evaluation?
    answer: a
    options:
    - id: a
      text: Old cases, new cases, and release conditions
    - id: b
      text: Only the new training loss
    - id: c
      text: Only the examples that motivated retraining
    feedback: A local improvement may introduce regressions elsewhere.
    id: monitoring-drift-and-retraining.transfer.v2.4
