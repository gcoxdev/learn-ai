    objective_ref: objective.monitoring-drift-and-retraining
    task: base
    response_type: single_choice
    points: 1
    hint: 'Distinguish kinds of drift: trace the inputs, operation, and result before choosing.'
    remediation_scene: monitoring-drift-and-retraining.s2
    variants:
      - id: monitoring-drift-and-retraining.base.1
        prompt: Does input drift always imply reduced model quality?
        options:
          - id: c
            text: Only if a histogram changes
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Distribution change and task error are related but distinct.
        retired: true
      - id: monitoring-drift-and-retraining.base.2
        prompt: Can label delay limit production quality monitoring?
        options:
          - id: a
            text: 'Yes'
          - id: b
            text: 'No'
          - id: c
            text: Only for image models
        answer: a
        feedback: True outcomes may be unavailable when predictions occur.
        retired: true
  - id: monitoring-drift-and-retraining.transfer
    objective_ref: objective.monitoring-drift-and-retraining
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Close the learning loop responsibly: trace the inputs, operation, and result before choosing.'
    remediation_scene: monitoring-drift-and-retraining.s4
    variants:
      - id: monitoring-drift-and-retraining.transfer.1
        prompt: A preprocessing bug causes errors. Is retraining automatically the right first fix?
        options:
          - id: a
            text: No; diagnose and repair the pipeline
          - id: b
            text: 'Yes'
          - id: c
            text: Only if more data exist
        answer: a
        feedback: Training on a broken representation can compound the problem.
        retired: true
      - id: monitoring-drift-and-retraining.transfer.2
        prompt: How can model decisions affect future evaluation data?
        options:
          - id: b
            text: They guarantee independent samples
          - id: c
            text: They only alter display order harmlessly
          - id: a
            text: They influence which outcomes or labels become observable
        answer: a
        feedback: Feedback can change the data-generating process.
        retired: true
  - id: monitoring-drift-and-retraining.base.v2
    objective_ref: objective.monitoring-drift-and-retraining
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: monitoring-drift-and-retraining.s3
    variants:
      - prompt: Which is an indirect proxy for answer correctness?
        answer: a
        options:
          - id: a
            text: The number of clicks on an answer
          - id: b
            text: A reviewed comparison against the current schedule
          - id: c
            text: A direct check of the cited date against the source
        feedback: Clicks can reflect interest or confusion as well as correctness.
        id: monitoring-drift-and-retraining.base.v2.1
        retired: true
      - prompt: What does input drift describe?
        answer: a
        options:
          - id: b
            text: A guaranteed drop in prediction accuracy
          - id: c
            text: A change in model weights after every request
          - id: a
            text: A change in the pattern of arriving inputs
        feedback: Changed inputs require investigation rather than one fixed conclusion.
        id: monitoring-drift-and-retraining.base.v2.2
        retired: true
      - prompt: Why inspect slice quality?
        answer: a
        options:
          - id: c
            text: Slice scores make outcome sampling unnecessary
          - id: a
            text: An aggregate can hide a problem in a relevant subset
          - id: b
            text: Every subset necessarily needs its own model
        feedback: Subgroup failures can be concealed by averages.
        id: monitoring-drift-and-retraining.base.v2.3
        retired: true
      - prompt: What should happen before retraining to fix a sudden failure?
        answer: a
        options:
          - id: a
            text: Inspect cases and the changed pipeline or task
          - id: c
            text: Increase training duration using the same unchecked inputs
          - id: b
            text: Replace the evaluation set with recent training rows
        feedback: Diagnosis connects a proposed repair to the actual cause.
        id: monitoring-drift-and-retraining.base.v2.4
        retired: true
  - id: monitoring-drift-and-retraining.transfer.v2
    objective_ref: objective.monitoring-drift-and-retraining
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: monitoring-drift-and-retraining.s3
    variants:
      - prompt: Questions look unchanged, but the official schedule changed. What should be checked?
        answer: a
        options:
          - id: b
            text: Only the frequency of question words
          - id: c
            text: Only whether the weights stayed fixed
          - id: a
            text: Answers against the current source
        feedback: Input stability does not establish that the right answers stayed the same.
        id: monitoring-drift-and-retraining.transfer.v2.1
        retired: true
      - prompt: A unit conversion bug changes 2 kilometers into a numeric input of 2000. What is the direct first repair?
        answer: a
        options:
          - id: a
            text: Restore and test the input unit contract
          - id: b
            text: Retrain using the corrupted numbers before investigating
          - id: c
            text: Lower decoding temperature for every answer
        feedback: Repair the transformation responsible for the mismatch.
        id: monitoring-drift-and-retraining.transfer.v2.2
        retired: true
      - prompt: Only visitors who completed a task are asked to rate it. What may be missing?
        answer: a
        options:
          - id: c
            text: A guarantee that the ratings are too negative
          - id: a
            text: Failures among visitors who abandoned the task
          - id: b
            text: The training-time optimizer settings
        feedback: Selective feedback can omit important outcomes.
        id: monitoring-drift-and-retraining.transfer.v2.3
        retired: true
      - prompt: A retrained candidate improves holiday answers. What else needs evaluation?
        answer: a
        options:
          - id: a
            text: Old cases, new cases, and release conditions
          - id: b
            text: Only the new training loss
          - id: c
            text: Only the examples that motivated retraining
        feedback: A local improvement may introduce regressions elsewhere.
        id: monitoring-drift-and-retraining.transfer.v2.4
        retired: true
  - id: monitoring-drift-and-retraining.base.v3
    objective_ref: objective.monitoring-drift-and-retraining
    task: base
    response_type: single_choice
    points: 1
    hint: Separate what changed. The mix of inputs is data drift, the quality of outputs is performance drift, and a sudden, extreme jump often means the pipeline itself broke.
    remediation_scene: monitoring-drift-and-retraining.s3
    variants:
      - id: monitoring-drift-and-retraining.base.v3.1
        prompt: A monitor reports PSI = 0.05 on this week's question topics against the launch month. Using the common rule of thumb, what does this suggest?
        options:
          - id: b
            text: Accuracy has fallen by about 5 percentage points
          - id: c
            text: A large shift that calls for retraining this week
          - id: a
            text: Little change in the mix of topics being asked
        answer: a
        feedback: PSI under 0.1 is conventionally read as little change. PSI measures how the input mix moved, not accuracy, so it can't be read as a 5-point drop.
      - id: monitoring-drift-and-retraining.base.v3.2
        prompt: Linden's topic-drift alarm can fire the same day, but reviewed correctness arrives about a week later. Why the difference?
        options:
          - id: a
            text: Correctness needs people to check answers against the source, which takes time
          - id: b
            text: PSI uses a handful of bins, so it computes faster than accuracy does
          - id: c
            text: Correctness can't be measured until the model has been retrained
        answer: a
        feedback: Topic shares can be counted as questions arrive, but a correctness label needs a person (or a later outcome) to judge each answer. That gap is label delay; it has nothing to do with computation speed or retraining.
      - id: monitoring-drift-and-retraining.base.v3.3
        prompt: The library changes its Sunday hours. Visitors ask the same questions as before, so PSI stays at 0.02, but reviewed accuracy on Sunday questions falls. What is happening?
        options:
          - id: c
            text: A false alarm, since PSI shows almost nothing changed
          - id: a
            text: Performance drift without input drift; the right answer moved
          - id: b
            text: Data drift that PSI missed because its bins were too wide
        answer: a
        feedback: The inputs look the same, but the correct outputs changed, so only labels can reveal it. Low PSI means the questions didn't shift; it says nothing about whether the answers are still right.
      - id: monitoring-drift-and-retraining.base.v3.4
        prompt: Overnight, PSI on a model's distance input jumps from 0.03 to 9, with every value landing in the top bin. What should the team check first?
        options:
          - id: b
            text: Retrain the model on the new distance values right away
          - id: c
            text: Widen the top bin so the new values spread out again
          - id: a
            text: The upstream feed, for a change in units or format
        answer: a
        feedback: A sudden, extreme jump with everything in one bin points to a broken pipe, such as meters arriving where kilometers were expected. Retraining would teach the model the bug, and rebinning hides the alarm without fixing anything.
  - id: monitoring-drift-and-retraining.transfer.v3
    objective_ref: objective.monitoring-drift-and-retraining
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask whether the inputs changed, the outcomes changed, or the way outcomes get recorded changed, and how long true labels take to arrive.
    remediation_scene: monitoring-drift-and-retraining.s5
    variants:
      - id: monitoring-drift-and-retraining.transfer.v3.1
        prompt: A card-fraud model's true labels come from chargebacks, which can arrive up to 60 days after a payment. What can the team usefully monitor this week?
        options:
          - id: c
            text: Nothing reliable until the full 60 days have passed
          - id: b
            text: Accuracy from this week's chargebacks, treated as final
          - id: a
            text: Input drift and the model's score distribution, as early clues
        answer: a
        feedback: When labels are slow, fast signals like PSI on inputs and scores give early warning while labels accumulate. This week's chargebacks are an incomplete, early subset, so treating them as final would overstate accuracy.
      - id: monitoring-drift-and-retraining.transfer.v3.2
        prompt: A loan model approves fewer applicants from one region. Repayment is observed only for approved loans, and the model is retrained on those outcomes. What problem does this create?
        options:
          - id: a
            text: Outcomes are missing for exactly the applicants it turned down
          - id: b
            text: The region's applicants have noisier labels than other regions
          - id: c
            text: The region's input data drifts as its population ages over time
        answer: a
        feedback: This is a feedback loop. The model's own decisions decide which outcomes get recorded, so retraining never learns whether rejected applicants would have repaid. A random or policy-independent sample is needed to see them.
      - id: monitoring-drift-and-retraining.transfer.v3.3
        prompt: A news site's recommender draws on an article pool that changes hourly. Rebuilding its item index is cheap and automated. Which update policy fits best?
        options:
          - id: b
            text: Rebuild when PSI on clicked topics passes 0.25
          - id: a
            text: Rebuild on a frequent schedule, with automatic checks
          - id: c
            text: Rebuild once reviewers report a fall in quality
        answer: a
        feedback: When updates are cheap and the source changes constantly, a schedule keeps the index fresh without waiting for harm. Triggers suit costly updates like retraining, where you want evidence first.
      - id: monitoring-drift-and-retraining.transfer.v3.4
        prompt: A tax-help chatbot's deadline questions jump every April, giving PSI = 0.4 against a January baseline. Reviewed accuracy on deadline questions stays at 97%. What is the right response?
        options:
          - id: c
            text: Roll back to the version that was live before April
          - id: a
            text: Record it as a seasonal shift and keep watching that slice
          - id: b
            text: Retrain now, since PSI is well above the 0.25 line
        answer: a
        feedback: Large drift with steady reviewed accuracy is data drift without performance drift. Retraining or rolling back would fix a problem that the labels show doesn't exist; next year, a seasonal baseline would avoid the false alarm.
  - id: monitoring-drift-and-retraining.calc.v3
    objective_ref: objective.monitoring-drift-and-retraining
    task: base
    response_type: numeric
    points: 1
