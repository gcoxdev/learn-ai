scenes:
- id: operational-capacity-and-reliability.s1
  title: Estimate demand and service time
  type: explanation
  depth: intuition
  objective_refs:
  - objective.operational-capacity-and-reliability
  markdown: 'Traffic varies by time, request length, and tool use. A service averaging ten requests per second
    can still receive bursts far above that rate. Capacity planning needs peak and tail behavior, batching
    effects, and available fallback or admission policies.


    Suppose requests arrive at 12 per second while the service can complete only 10 per second at that workload.
    The queue grows by roughly two requests per second while those rates persist: about 120 extra waiting requests
    after a minute. Adding a queue stores the problem; it does not increase processing capacity. Graceful degradation
    means preserving a useful limited service during trouble, such as showing verified opening hours while
    disabling a slower open-ended assistant.'
  text_mode: 'Traffic varies by time, request length, and tool use. A service averaging ten requests per second
    can still receive bursts far above that rate. Capacity planning needs peak and tail behavior, batching
    effects, and available fallback or admission policies.


    Suppose requests arrive at 12 per second while the service can complete only 10 per second at that workload.
    The queue grows by roughly two requests per second while those rates persist: about 120 extra waiting requests
    after a minute. Adding a queue stores the problem; it does not increase processing capacity. Graceful degradation
    means preserving a useful limited service during trouble, such as showing verified opening hours while
    disabling a slower open-ended assistant.'
  bridges: []
- id: operational-capacity-and-reliability.s2
  title: Define service objectives
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.operational-capacity-and-reliability
  markdown: Choose measurable targets for availability, latency, and correct completion under a stated workload.
    A server returning a fast error is not equivalent to completing the task. Track dependency outages, malformed
    outputs, and quality regressions alongside ordinary infrastructure metrics.
  text_mode: Choose measurable targets for availability, latency, and correct completion under a stated workload.
    A server returning a fast error is not equivalent to completing the task. Track dependency outages, malformed
    outputs, and quality regressions alongside ordinary infrastructure metrics.
  bridges: []
- id: operational-capacity-and-reliability.s3
  title: Account for idle and wasted work
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.operational-capacity-and-reliability
  markdown: Retries, rejected generations, unused replicas, and repeated retrieval all consume resources. Improving
    cache reuse or task design can save more than a small kernel optimization in some workloads. Energy and
    cost estimates should disclose included components and utilization assumptions.
  text_mode: Retries, rejected generations, unused replicas, and repeated retrieval all consume resources.
    Improving cache reuse or task design can save more than a small kernel optimization in some workloads.
    Energy and cost estimates should disclose included components and utilization assumptions.
  bridges: []
- id: operational-capacity-and-reliability.s4
  title: Practice graceful degradation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.operational-capacity-and-reliability
  markdown: A smaller fallback, queued completion, partial supported answer, or temporary unavailability can
    be appropriate depending on the task. Test failure modes and recovery rather than improvising during incidents.
    Revisit capacity after model or traffic changes, because previous service measurements may no longer apply.
  text_mode: A smaller fallback, queued completion, partial supported answer, or temporary unavailability can
    be appropriate depending on the task. Test failure modes and recovery rather than improvising during incidents.
    Revisit capacity after model or traffic changes, because previous service measurements may no longer apply.
  bridges: []
