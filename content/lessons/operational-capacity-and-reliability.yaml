assessment_families:
  - id: operational-capacity-and-reliability.base
    objective_ref: objective.operational-capacity-and-reliability
    task: base
    response_type: single_choice
    points: 1
    hint: 'Define service objectives: trace the inputs, operation, and result before choosing.'
    remediation_scene: operational-capacity-and-reliability.s2
    variants:
      - id: operational-capacity-and-reliability.base.1
        prompt: Why is average request rate insufficient for capacity planning?
        options:
          - id: b
            text: Every request has identical cost
          - id: c
            text: Only total parameter count matters
          - id: a
            text: Bursts and variable work can dominate queues and tails
        answer: a
        feedback: Demand distribution affects service behavior.
        retired: true
      - id: operational-capacity-and-reliability.base.2
        prompt: Does a fast error response equal successful task latency?
        options:
          - id: c
            text: Only if HTTP returns a response
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Service success must include the intended outcome.
        retired: true
  - id: operational-capacity-and-reliability.transfer
    objective_ref: objective.operational-capacity-and-reliability
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Practice graceful degradation: trace the inputs, operation, and result before choosing.'
    remediation_scene: operational-capacity-and-reliability.s4
    variants:
      - id: operational-capacity-and-reliability.transfer.1
        prompt: Should retries and discarded generations count toward resource cost?
        options:
          - id: c
            text: Only if the user sees them
          - id: a
            text: 'Yes'
          - id: b
            text: 'No'
        answer: a
        feedback: Unsuccessful work still consumes resources.
        retired: true
      - id: operational-capacity-and-reliability.transfer.2
        prompt: What makes fallback behavior useful?
        options:
          - id: a
            text: It is tested and appropriate to the task’s quality and failure constraints
          - id: b
            text: It always invents an answer
          - id: c
            text: It hides every outage
        answer: a
        feedback: Graceful degradation preserves clear and bounded behavior.
        retired: true
  - id: operational-capacity-and-reliability.base.v2
    objective_ref: objective.operational-capacity-and-reliability
    task: base
    response_type: single_choice
    points: 1
    hint: L = λW links requests in the system, arrival rate, and time inside. Waiting grows like 1/(1 − ρ) as utilization ρ nears 1. Only requests that meet the SLI's definition of good count as good.
    remediation_scene: operational-capacity-and-reliability.mm1
    variants:
      - id: operational-capacity-and-reliability.base.v2.1
        prompt: A replica is 90% busy, and requests spend 2.5 s in the system on average. Traffic grows until it is 95% busy. In the M/M/1 model, roughly what happens to the time in the system?
        options:
          - id: b
            text: It rises about 5%, to roughly 2.6 s
          - id: a
            text: It roughly doubles, to about 5 s
          - id: c
            text: It holds steady until the replica is full
        answer: a
        feedback: Time in the system scales with 1/(1 − ρ), and 1 − ρ halves from 0.1 to 0.05, so W doubles. Assuming waits grow in step with traffic is the classic mistake; near full load they grow much faster.
      - id: operational-capacity-and-reliability.base.v2.2
        prompt: A service averages 20 requests in the system while 5 new requests arrive each second. What is the average time a request spends in the system?
        options:
          - id: c
            text: 0.25 s, from 5 ÷ 20
          - id: b
            text: 100 s, from 20 × 5
          - id: a
            text: 4 s, from 20 ÷ 5
        answer: a
        feedback: Little's law gives W = L / λ = 20 / 5 = 4 s. Multiplying gives the wrong units (requests squared per second), and 5 ÷ 20 inverts the relationship.
      - id: operational-capacity-and-reliability.base.v2.3
        prompt: The SLI is "the share of requests that get a valid answer or a proper fallback within 4 s." Which request counts as good?
        options:
          - id: a
            text: A correct fallback passage delivered in 3.4 s
          - id: b
            text: An error page delivered in 0.2 s
          - id: c
            text: A full, correct answer delivered in 6 s
        answer: a
        feedback: A good request must be both acceptable and on time. The fast error page fails the first test, and the 6-second answer fails the second, however good it is.
      - id: operational-capacity-and-reliability.base.v2.4
        prompt: Requests arrive at 5 a second for 10 minutes, but the service completes only 4 a second. Roughly how many are waiting at the end?
        options:
          - id: b
            text: About 60, one extra for each 10 s
          - id: a
            text: About 600, one extra each second
          - id: c
            text: None, as the queue absorbs the burst
        answer: a
        feedback: The queue grows by 5 − 4 = 1 request per second, so 600 seconds leaves about 600 waiting. A queue stores the excess; it doesn't add capacity.
  - id: operational-capacity-and-reliability.transfer.v2
    objective_ref: objective.operational-capacity-and-reliability
    task: transfer
    response_type: single_choice
    points: 1
    hint: Translate the situation into λ, W, ρ, or an error budget, then ask what the numbers imply about waiting, spending, or replicas.
    remediation_scene: operational-capacity-and-reliability.s3
    variants:
      - id: operational-capacity-and-reliability.transfer.v2.1
        prompt: A call center's agents are busy 97% of the time. Each call lasts about 4 minutes, yet callers wait around 20 minutes on hold. What explains the long holds?
        options:
          - id: a
            text: At 97% busy, random arrivals make waits far longer than a call
          - id: b
            text: The agents must be taking far longer than 4 minutes per call
          - id: c
            text: Callers must be arriving in evenly spaced groups every hour
        answer: a
        feedback: Near full utilization, waiting grows like 1/(1 − ρ), so a 4-minute job can mean a 20-minute wait with no one working slowly. Evenly spaced arrivals would actually shorten waits; randomness is what creates the queue.
      - id: operational-capacity-and-reliability.transfer.v2.2
        prompt: A payments API has an SLO of 99.95% over 30 days. How much full outage does its error budget allow?
        options:
          - id: c
            text: About 3.6 minutes
          - id: a
            text: About 21.6 minutes
          - id: b
            text: About 43.2 minutes
        answer: a
        feedback: 30 × 24 × 60 = 43,200 minutes, × 0.0005 = 21.6 minutes. 43.2 minutes is the budget for 99.9%, twice as generous.
      - id: operational-capacity-and-reliability.transfer.v2.3
        prompt: A service with a 99.9% SLO is failing 2% of its requests right now. What is the burn rate, and what does it mean for a 30-day budget?
        options:
          - id: b
            text: 2, so the budget would last about 15 days
          - id: c
            text: 0.02, so the budget is barely being touched
          - id: a
            text: 20, so the budget would last about 1.5 days
        answer: a
        feedback: Burn rate = 2% ÷ 0.1% = 20, and 30 days ÷ 20 = 1.5 days. Reading 2% as a burn rate of 2 forgets to divide by the allowed 0.1%.
      - id: operational-capacity-and-reliability.transfer.v2.4
        prompt: A translation service expects a peak of 9 requests a second. Each replica handles 3 a second, and the team targets 75% utilization. How many replicas does it need before adding a spare?
        options:
          - id: a
            text: 4, since each may carry 2.25 a second
          - id: b
            text: 3, since 3 × 3 covers the 9 a second
          - id: c
            text: 12, since 9 ÷ 0.75 is 12 replicas
        answer: a
        feedback: Each replica may carry 3 × 0.75 = 2.25 a second, and 9 ÷ 2.25 = 4. Three replicas would run at 100%, where waits explode, and 9 ÷ 0.75 = 12 is a rate, not a replica count.
  - id: operational-capacity-and-reliability.calc.v2
    objective_ref: objective.operational-capacity-and-reliability
    task: base
    response_type: numeric
    points: 1
    hint: Little's law is L = λW. An error budget is (1 − SLO) × the period or × the request count. In M/M/1, W = 1/(μ − λ).
    remediation_scene: operational-capacity-and-reliability.s2
    absolute_tolerance: 0.05
    variants:
      - id: operational-capacity-and-reliability.calc.v2.1
        prompt: Requests arrive at 8 a second and each spends 1.5 s in the system on average. How many requests are in the system on average?
        answer: 12
        feedback: L = λW = 8 × 1.5 = 12 requests, counting both waiting and in service.
      - id: operational-capacity-and-reliability.calc.v2.2
        prompt: A dashboard shows 30 requests in the system on average and 6 arriving per second. What is the average time in the system, in seconds?
        answer: 5
        feedback: W = L / λ = 30 / 6 = 5 s.
      - id: operational-capacity-and-reliability.calc.v2.3
        prompt: An SLO is 99.5% over 30 days. How many minutes of full outage does the error budget allow?
        answer: 216
        feedback: 30 × 24 × 60 = 43,200 minutes, and 0.5% of that is 216 minutes, about 3.6 hours.
      - id: operational-capacity-and-reliability.calc.v2.4
        prompt: A service handles 2,000,000 requests a month with an SLO of 99.9% good requests. How many bad requests does the monthly error budget allow?
        answer: 2000
        feedback: 0.1% of 2,000,000 = 2,000 bad requests a month.
      - id: operational-capacity-and-reliability.calc.v2.5
        prompt: In the M/M/1 model, a server completes 10 requests a second on average and 8 arrive each second. What is the average time in the system, in seconds?
        answer: 0.5
        feedback: W = 1/(μ − λ) = 1/(10 − 8) = 0.5 s, five times the 0.1 s of work each request needs, because the server is 80% busy.
