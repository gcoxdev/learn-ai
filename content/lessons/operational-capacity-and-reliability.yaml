assessment_families:
- id: operational-capacity-and-reliability.base
  objective_ref: objective.operational-capacity-and-reliability
  task: base
  response_type: single_choice
  points: 1
  hint: 'Define service objectives: trace the inputs, operation, and result before choosing.'
  remediation_scene: operational-capacity-and-reliability.s2
  variants:
  - id: operational-capacity-and-reliability.base.1
    prompt: Why is average request rate insufficient for capacity planning?
    options:
    - id: b
      text: Every request has identical cost
    - id: c
      text: Only total parameter count matters
    - id: a
      text: Bursts and variable work can dominate queues and tails
    answer: a
    feedback: Demand distribution affects service behavior.
  - id: operational-capacity-and-reliability.base.2
    prompt: Does a fast error response equal successful task latency?
    options:
    - id: c
      text: Only if HTTP returns a response
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Service success must include the intended outcome.
- id: operational-capacity-and-reliability.transfer
  objective_ref: objective.operational-capacity-and-reliability
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Practice graceful degradation: trace the inputs, operation, and result before choosing.'
  remediation_scene: operational-capacity-and-reliability.s4
  variants:
  - id: operational-capacity-and-reliability.transfer.1
    prompt: Should retries and discarded generations count toward resource cost?
    options:
    - id: c
      text: Only if the user sees them
    - id: a
      text: 'Yes'
    - id: b
      text: 'No'
    answer: a
    feedback: Unsuccessful work still consumes resources.
  - id: operational-capacity-and-reliability.transfer.2
    prompt: What makes fallback behavior useful?
    options:
    - id: a
      text: It is tested and appropriate to the task’s quality and failure constraints
    - id: b
      text: It always invents an answer
    - id: c
      text: It hides every outage
    answer: a
    feedback: Graceful degradation preserves clear and bounded behavior.
