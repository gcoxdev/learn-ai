schema_version: 0.2-draft
lesson:
  id: operational-capacity-and-reliability
  version: 0.3.0-draft
  title: Plan for traffic, failures, and ongoing resource use
  state: draft
  summary: Why does a server that's only 90% busy make people wait ten times longer than the work takes? Little's law, one queueing formula, and an error budget answer it.
  slot: M33.7
  category: learning
  sources:
    - title: "A Proof for the Queuing Formula: L = λW (John D. C. Little, Operations Research, 1961)"
      url: https://doi.org/10.1287/opre.9.3.383
    - title: Google SRE Book, "Service Level Objectives"
      url: https://sre.google/sre-book/service-level-objectives/
    - title: Google SRE Book, "Embracing Risk" (error budgets)
      url: https://sre.google/sre-book/embracing-risk/
    - title: Google SRE Workbook, "Alerting on SLOs" (burn rates)
      url: https://sre.google/workbook/alerting-on-slos/
objectives:
  - id: objective.operational-capacity-and-reliability
    version: 2-draft
    statement: Plan capacity for an AI service using Little's law, the rise in waiting as utilization nears 1, SLOs with error budgets and burn rates, and headroom for failures and wasted work.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - operational-capacity-and-reliability.base.v2
      - operational-capacity-and-reliability.transfer.v2
      - operational-capacity-and-reliability.calc.v2
    prerequisites:
      - anyOf:
          - objective.ai-service-boundaries
      - anyOf:
          - objective.serving-metrics-and-cost
scenes:
  - id: operational-capacity-and-reliability.s1
    title: Little's law, from two numbers on a dashboard
    type: explanation
    depth: intuition
    objective_refs:
      - objective.operational-capacity-and-reliability
    markdown: |-
      To keep visitors' account data in-house, the county now runs Linden's model on its own GPU servers. Each copy of the running model, a **replica**, finishes about 4 requests a second, so each request uses about 0.25 s of its time.

      On the next snow day, with chat and email both running on these servers, 5 requests a second arrived for ten minutes. A replica can't store up capacity, so the line grew by 1 request every second: 600 waiting after ten minutes, and a newcomer faced 600 ÷ 4 = 150 s of queue. When arrivals beat capacity, the queue has no steady size at all.

      On an ordinary busy morning, the dashboard shows 3.6 requests arriving each second and, on average, 9 requests in the system (waiting or being served). **Little's law** links those two numbers to a third:

      $$L = \lambda W$$

      $L$ is the average number of requests in the system, $\lambda$ (lambda) the arrival rate, and $W$ the average time each request spends inside. So $W = L / \lambda = 9 / 3.6 = 2.5$ s. John Little proved in 1961 that this holds for almost any stable queue, whatever the arrival pattern. But each request needs only 0.25 s of work. Where did the other 2.25 s go?
    bridges: []
    diagram:
      caption: What Little's law counts. L includes requests waiting and requests being served.
      description: Requests arrive at rate lambda, 3.6 per second, into a queue where they wait. The replica serves them at 4 per second, and they leave as answers. L, the number in the system, counts everything in the queue plus the request being served, 9 on average; W is the time from arrival to leaving, 2.5 seconds.
      nodes:
        - id: arrive
          label: Arrivals
          note: λ = 3.6 per second
          col: 0
          row: 0
        - id: queue
          label: Queue
          note: waiting requests
          col: 1
          row: 0
          tone: warn
        - id: replica
          label: Replica
          note: serves 4 per second
          col: 2
          row: 0
          tone: accent
        - id: done
          label: Answers
          col: 3
          row: 0
          tone: data
        - id: count
          label: L = 9 in the system
          note: queue + in service; W = 2.5 s
          col: 1
          row: 1
          tone: muted
      edges:
        - from: arrive
          to: queue
        - from: queue
          to: replica
        - from: replica
          to: done
        - from: count
          to: queue
          dashed: true
  - id: operational-capacity-and-reliability.mm1
    title: Why 90% busy feels broken
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.operational-capacity-and-reliability
    markdown: |-
      **Utilization**, written $\rho$ (rho), is the fraction of time the replica is busy: $\rho = \lambda / \mu$, where $\mu$ is its service rate. That morning, $\rho = 3.6 / 4 = 0.9$.

      Requests don't arrive evenly. Sometimes three come at once and queue while the replica is busy; sometimes it sits idle, and idle time can't be saved for later. The simplest queueing model, **M/M/1** (random arrivals, random service times, one server), gives the average time in the system:

      $$W = \frac{1}{\mu - \lambda} = \frac{1/\mu}{1 - \rho}$$

      At $\rho = 0.9$: $W = 0.25 / 0.1 = 2.5$ s, exactly what Little's law found. The factor $1/(1-\rho)$ is the whole story:

      | $\rho$ | 0.5 | 0.8 | 0.9 | 0.95 | 0.99 |
      | --- | ---: | ---: | ---: | ---: | ---: |
      | $W$ (s) | 0.5 | 1.25 | 2.5 | 5 | 25 |

      ```python run
      import random

      random.seed(1)
      mu = 4.0                     # the replica finishes 4 requests a second on average

      def simulate(lam, n=100_000):
          """Average time in system for one server, random arrivals and service times."""
          clock = free_at = total = 0.0
          for _ in range(n):
              clock += random.expovariate(lam)          # next arrival
              start = max(clock, free_at)               # wait if the server is busy
              free_at = start + random.expovariate(mu)  # finish time
              total += free_at - clock
          return total / n

      print(" rho  arrivals/s  formula W  simulated W")
      for rho in [0.5, 0.8, 0.9, 0.95]:
          lam = rho * mu
          print(f"{rho:4}  {lam:10.2f}  {1 / (mu - lam):8.2f} s  {simulate(lam):9.2f} s")
      ```

      The simulation lands close to the formula; near $\rho = 1$ it needs far more requests to settle. Try adding 0.98 to the list.

      :::predict At 90% busy, traffic grows about 5%, from 3.6 to 3.8 requests a second. What happens to W?
      It doubles, from 2.5 s to 5 s, because $1 - \rho$ halves from 0.1 to 0.05. Near full load, a small rise in traffic causes a huge rise in waiting. Real model servers batch requests, so they aren't exactly M/M/1, but the shape of this curve holds for any queue with random arrivals.
      :::

      :::mixup "90% utilization means we still have 10% spare capacity."
      On paper, yes. In waiting time, the last 10% is the most expensive capacity you have. Many teams plan for about 60–80% at peak for exactly this reason.
      :::
  - id: operational-capacity-and-reliability.s2
    title: Write an SLO, then spend the error budget
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.operational-capacity-and-reliability
    markdown: |-
      A **service level indicator (SLI)** is a measured quantity; a **service level objective (SLO)** is a target for it, in the terms of Google's *Site Reliability Engineering* book. Linden's SLI is the share of requests that get a contract-valid answer, or a proper fallback, within 4 s. A fast error page doesn't count as good. The SLO: 99.9% good over 30 days.

      The **error budget** is the 0.1% the SLO allows to go wrong. Over 30 days that's 30 × 24 × 60 × 0.001 = **43.2 minutes** of full outage, or, at 300,000 requests a month, 300 bad requests. The **burn rate** is how fast you're spending it: the current bad rate divided by the allowed one.

      ```python run
      slo = 0.999                  # 99.9% of requests must be good
      days = 30
      requests = 300_000           # requests in 30 days

      budget_minutes = days * 24 * 60 * (1 - slo)
      budget_requests = requests * (1 - slo)
      print(f"error budget: {budget_minutes:.1f} minutes, or {budget_requests:.0f} bad requests")

      # an incident: 5% of requests fail for 2 hours
      bad_rate, hours = 0.05, 2
      per_hour = requests / (days * 24)
      spent = per_hour * hours * bad_rate
      burn = bad_rate / (1 - slo)
      print(f"incident used {spent:.0f} bad requests = {spent / budget_requests:.0%} of the budget")
      print(f"burn rate {burn:.0f}x: the whole budget would be gone in {days * 24 / burn:.1f} hours")
      ```

      Failing 5% of requests for two hours used 14% of the budget. That incident's burn rate was 50, so a month's budget would be gone in 14.4 hours at that pace. Google's *SRE Workbook* suggests paging someone when the burn rate over the last hour reaches 14.4, which spends 2% of a 30-day budget in that one hour. The budget also settles arguments. While it lasts, the team ships changes; once it's spent, risky releases wait until reliability recovers. Try `slo = 0.9999` and watch the budget shrink to 4.3 minutes.
    bridges: []
  - id: operational-capacity-and-reliability.s3
    title: Plan capacity with headroom
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.operational-capacity-and-reliability
    markdown: |-
      **Capacity planning** means choosing how many replicas to run for the peak you expect. Linden's worked plan:

      | Step | Number |
      | --- | --- |
      | Peak forecast: last snow day's 5 requests/s plus 20% growth | 6 /s |
      | Wasted work: retries and rejected outputs add 10% | 6.6 /s |
      | Target utilization at peak | 0.7 |
      | Each replica may carry 4 × 0.7 | 2.8 /s |
      | Replicas: 6.6 ÷ 2.8 = 2.36, round up | 3 |
      | One spare, in case a replica fails on the busiest day | 4 |

      With 4 replicas, peak utilization is 6.6 ÷ 16 ≈ 0.41, and 0.55 if one fails. Without the spare, a failure would push the other two to about 0.83, and time in the system from about 0.6 s to about 1.4 s.

      The wasted-work row is easy to forget. Every retry, and every reply the output check rejects and regenerates, uses a replica exactly like a useful answer. Cutting that waste is capacity you don't have to buy.
    bridges: []
  - id: operational-capacity-and-reliability.s4
    title: When demand beats even the plan, shed load
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.operational-capacity-and-reliability
    markdown: |-
      Some days will exceed any plan. Letting the queue grow without limit guarantees that *everyone* waits past the deadline. **Load shedding** refuses some work early so the rest is served on time. Linden's rule: if the queue already holds more than 4 s of work (16 requests per healthy replica), new questions skip the model and go straight to the fallback ladder from the lesson on service boundaries, the closures-page passage or the front desk number. A true fallback in half a second counts as good in the SLI; a full answer in 40 seconds doesn't.

      Rerun the load test and redo this plan whenever the model, the prompt length, or the traffic changes. Every number above came from measurements that a change can quietly invalidate.
    bridges: []
  - id: operational-capacity-and-reliability.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.operational-capacity-and-reliability
    markdown: A call center, a payments API, a service burning its budget, a replica count, and a handful of Little's-law and error-budget sums test whether you can plan for load.
    takeaway: Little's law (L = λW) turns dashboard numbers into waiting time, and waiting explodes as utilization nears 1, so plan for about 70% at peak plus a spare. Write an SLO, track its error budget and burn rate, and shed load to a true fallback rather than let everyone wait.
  - id: operational-capacity-and-reliability.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.operational-capacity-and-reliability
    markdown: |-
      A queue does not create capacity. Plan for realistic demand, measure useful completion, and test a limited service and recovery path for failures.
