schema_version: 0.2-draft
lesson:
  id: supervised-fine-tuning
  version: 0.3.0-draft
  title: Learn response behavior from demonstrations
  state: draft
  summary: Teach a library assistant with complete examples, then inspect which tokens count as the lesson
    and which serve as context.
  slot: M20.2
  category: learning
  sources:
  - title: Ouyang et al. — instruction following with human feedback
    url: https://arxiv.org/abs/2203.02155
  archetype: mechanism
objectives:
- id: objective.supervised-fine-tuning
  version: 2-draft
  statement: Trace a supervised conversation example, response-only loss mask, and evaluation split while distinguishing
    demonstrations from runtime prompts.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - supervised-fine-tuning.base.v2
  - supervised-fine-tuning.transfer.v2
  prerequisites:
  - anyOf:
    - objective.posttraining-stages
  - anyOf:
    - objective.packing-and-masking
scenes:
- id: supervised-fine-tuning.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.supervised-fine-tuning
  title: Show the assistant what good help looks like
  markdown: A **demonstration** pairs a situation with a desired response. Our fictional library closes at
    six. An example might contain a user asking “When do you close?” and an assistant answering “We close at
    six today.” **Supervised fine-tuning**, or SFT, trains an existing model on such target responses. It changes
    selected trainable parameters. Simply pasting the example into a prompt gives the model context for one
    use; that does not by itself perform fine-tuning.
  text_mode: A **demonstration** pairs a situation with a desired response. Our fictional library closes at
    six. An example might contain a user asking “When do you close?” and an assistant answering “We close at
    six today.” **Supervised fine-tuning**, or SFT, trains an existing model on such target responses. It changes
    selected trainable parameters. Simply pasting the example into a prompt gives the model context for one
    use; that does not by itself perform fine-tuning.
  bridges: []
- id: supervised-fine-tuning.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.supervised-fine-tuning
  title: Preserve who said what
  markdown: A **conversation template** serializes roles, boundaries, and message text into the token sequence
    expected by the model. A user request and an assistant reply should not be indistinguishable blocks. End
    markers specify where responses or turns finish. A tool result, when used, has its own role in the conversation.
    The exact template is part of the model’s training-and-use contract. Using a mismatched template can change
    behavior even when the ordinary words look identical to a person.
  text_mode: A **conversation template** serializes roles, boundaries, and message text into the token sequence
    expected by the model. A user request and an assistant reply should not be indistinguishable blocks. End
    markers specify where responses or turns finish. A tool result, when used, has its own role in the conversation.
    The exact template is part of the model’s training-and-use contract. Using a mismatched template can change
    behavior even when the ordinary words look identical to a person.
  bridges: []
- id: supervised-fine-tuning.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.supervised-fine-tuning
  title: Mark the targets that count
  markdown: In a response-only recipe, prompt tokens are visible context while assistant-response targets contribute
    to the loss. Suppose response token losses are 1, 2, and 3. Their mean is (1+2+3)/3=2. A four-token prompt
    does not add four extra zeros to that denominator. Other recipes score different positions, so record the
    chosen mask. An unscored prompt is still allowed to influence the response through attention.
  text_mode: In a response-only recipe, prompt tokens are visible context while assistant-response targets
    contribute to the loss. Suppose response token losses are 1, 2, and 3. Their mean is (1+2+3)/3=2. A four-token
    prompt does not add four extra zeros to that denominator. Other recipes score different positions, so record
    the chosen mask. An unscored prompt is still allowed to influence the response through attention.
  bridges:
  - packing-and-masking
- id: supervised-fine-tuning.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.supervised-fine-tuning
  title: The training prefix is supplied, not sampled
  markdown: During ordinary teacher-forced training, the model predicts each target response token given the
    correct earlier demonstration tokens. **Teacher forcing** is this use of the known prefix. During generation
    the prefix usually contains the model’s own selected tokens, so an early mistake can change later predictions.
    A good token loss on demonstrations and a useful free-running conversation are related measurements, but
    they are not identical. Evaluate complete outputs as well as training losses.
  text_mode: During ordinary teacher-forced training, the model predicts each target response token given the
    correct earlier demonstration tokens. **Teacher forcing** is this use of the known prefix. During generation
    the prefix usually contains the model’s own selected tokens, so an early mistake can change later predictions.
    A good token loss on demonstrations and a useful free-running conversation are related measurements, but
    they are not identical. Evaluate complete outputs as well as training losses.
  bridges: []
- id: supervised-fine-tuning.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.supervised-fine-tuning
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Fine-tuning learns from demonstrated responses. Mark which tokens count toward the loss, then test
    whether the behavior carries over to new requests.
- id: supervised-fine-tuning.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.supervised-fine-tuning
  markdown: Fine-tuning learns from demonstrated responses. Mark which tokens count toward the loss, then test
    whether the behavior carries over to new requests.
  text_mode: Fine-tuning learns from demonstrated responses. Mark which tokens count toward the loss, then
    test whether the behavior carries over to new requests.
- id: supervised-fine-tuning.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.supervised-fine-tuning
  title: Design examples for the behavior you want
  markdown: If every demonstration gives an elaborate answer to a simple question, the model may learn that
    verbosity is expected. Include representative short questions, missing-information cases, format requirements,
    and examples where clarification is appropriate. Incorrect demonstrations teach incorrect behavior. Repeated
    near-copies inflate volume without adding much coverage. A small reviewed set with clear rules can reveal
    the desired behavior more cleanly than an uninspected pile, though its coverage still needs testing.
  text_mode: If every demonstration gives an elaborate answer to a simple question, the model may learn that
    verbosity is expected. Include representative short questions, missing-information cases, format requirements,
    and examples where clarification is appropriate. Incorrect demonstrations teach incorrect behavior. Repeated
    near-copies inflate volume without adding much coverage. A small reviewed set with clear rules can reveal
    the desired behavior more cleanly than an uninspected pile, though its coverage still needs testing.
  bridges: []
- id: supervised-fine-tuning.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.supervised-fine-tuning
  title: Test a new request, not a disguised copy
  markdown: 'Keep evaluation requests and source-derived variants out of the training demonstrations. Try a
    differently worded closing-time question, a request for an unknown holiday schedule, and a contradiction
    between supplied sources. Score the behavior promised by the task: evidence use, factual consistency, helpful
    brevity, and handling missing information. Save the starting checkpoint, training data, mask, template,
    and resulting checkpoint. These records let you connect an observed change in behavior to the examples
    and training procedure that produced it.'
  text_mode: 'Keep evaluation requests and source-derived variants out of the training demonstrations. Try
    a differently worded closing-time question, a request for an unknown holiday schedule, and a contradiction
    between supplied sources. Score the behavior promised by the task: evidence use, factual consistency, helpful
    brevity, and handling missing information. Save the starting checkpoint, training data, mask, template,
    and resulting checkpoint. These records let you connect an observed change in behavior to the examples
    and training procedure that produced it.'
  bridges: []
- id: supervised-fine-tuning.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.supervised-fine-tuning
  title: Count the scored positions
  markdown: 'A prompt has four tokens. The response has three scored token losses: 1, 2, 3. In a response-only
    loss recipe, what is the mean?'
  text_mode: 'A prompt has four tokens. The response has three scored token losses: 1, 2, 3. In a response-only
    loss recipe, what is the mean?'
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: '2'
    - id: b
      text: 6/7
    - id: c
      text: '6'
    answer: a
    reveal_markdown: The three response targets contribute total loss 6 and denominator 3. Prompt length does
      not dilute the specified response-only mean.
    hint: Trace the example using the rule from the preceding pages.
    id: supervised-fine-tuning.practice.v2.7
