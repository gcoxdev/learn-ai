assessment_families:
- id: supervised-fine-tuning.base
  objective_ref: objective.supervised-fine-tuning
  task: base
  response_type: single_choice
  points: 1
  hint: 'Define which tokens receive loss: trace the inputs, operation, and result before choosing.'
  remediation_scene: supervised-fine-tuning.s2
  variants:
  - id: supervised-fine-tuning.base.1
    prompt: What supplies the prior response tokens during teacher-forced training?
    options:
    - id: a
      text: The demonstration
    - id: b
      text: Only previously sampled model tokens in every SFT recipe
    - id: c
      text: An unrelated document
    answer: a
    feedback: Teacher forcing conditions on the target prefix.
    retired: true
  - id: supervised-fine-tuning.base.2
    prompt: Can user tokens be visible while excluded from loss?
    options:
    - id: b
      text: 'No'
    - id: c
      text: Only if the conversation has no roles
    - id: a
      text: 'Yes'
    answer: a
    feedback: Context visibility and supervision masks differ.
    retired: true
- id: supervised-fine-tuning.transfer
  objective_ref: objective.supervised-fine-tuning
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Test beyond imitation of the training set: trace the inputs, operation, and result before choosing.'
  remediation_scene: supervised-fine-tuning.s4
  variants:
  - id: supervised-fine-tuning.transfer.1
    prompt: A dataset contains mostly long answers. What behavior might it teach?
    options:
    - id: b
      text: Guaranteed concise responses
    - id: c
      text: No stylistic effect
    - id: a
      text: A preference for verbosity
    answer: a
    feedback: Demonstration distributions influence style as well as content.
    retired: true
  - id: supervised-fine-tuning.transfer.2
    prompt: Very low SFT training loss establishes what?
    options:
    - id: c
      text: Complete resistance to distribution shift
    - id: a
      text: Good fit to those supervised examples
    - id: b
      text: Universal factual correctness
    answer: a
    feedback: Generalization needs independent evaluation.
    retired: true
- id: supervised-fine-tuning.base.v2
  objective_ref: objective.supervised-fine-tuning
  task: base
  response_type: numeric_fields_with_reason
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: supervised-fine-tuning.s3
  variants:
  - prompt: A response-only example has 5 unscored prompt tokens and 2 scored response targets with summed
      loss 3. Record the denominator and mean loss.
    answers:
      denominator: 2
      mean: 1.5
    reason_answer: a
    reason_options:
    - id: a
      text: Average only the targets included by the response mask.
    - id: b
      text: Average over prompt and response positions together.
    - id: c
      text: Divide by the number of prompt tokens.
    feedback: The prompt supplies context; the selected response targets supply this loss.
    id: supervised-fine-tuning.base.v2.1
  - prompt: A response-only example has 3 unscored prompt tokens and 4 scored response targets with summed
      loss 8. Record the denominator and mean loss.
    answers:
      denominator: 4
      mean: 2.0
    reason_answer: a
    reason_options:
    - id: c
      text: Divide by the number of prompt tokens.
    - id: a
      text: Average only the targets included by the response mask.
    - id: b
      text: Average over prompt and response positions together.
    feedback: The prompt supplies context; the selected response targets supply this loss.
    id: supervised-fine-tuning.base.v2.2
  - prompt: A response-only example has 8 unscored prompt tokens and 3 scored response targets with summed
      loss 9. Record the denominator and mean loss.
    answers:
      denominator: 3
      mean: 3.0
    reason_answer: a
    reason_options:
    - id: b
      text: Average over prompt and response positions together.
    - id: a
      text: Average only the targets included by the response mask.
    - id: c
      text: Divide by the number of prompt tokens.
    feedback: The prompt supplies context; the selected response targets supply this loss.
    id: supervised-fine-tuning.base.v2.3
  - prompt: A response-only example has 2 unscored prompt tokens and 5 scored response targets with summed
      loss 5. Record the denominator and mean loss.
    answers:
      denominator: 5
      mean: 1.0
    reason_answer: a
    reason_options:
    - id: c
      text: Divide by the number of prompt tokens.
    - id: b
      text: Average over prompt and response positions together.
    - id: a
      text: Average only the targets included by the response mask.
    feedback: The prompt supplies context; the selected response targets supply this loss.
    id: supervised-fine-tuning.base.v2.4
  numeric_fields:
  - id: denominator
    label: Scored target count
  - id: mean
    label: Mean response loss
  absolute_tolerance: 1.0e-06
- id: supervised-fine-tuning.transfer.v2
  objective_ref: objective.supervised-fine-tuning
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: supervised-fine-tuning.s3
  variants:
  - prompt: What does teacher forcing provide during an ordinary SFT forward calculation?
    answer: a
    options:
    - id: c
      text: The final test score as an input token
    - id: a
      text: The demonstrated earlier response tokens
    - id: b
      text: A newly sampled prefix at every target position
    feedback: The known prefix supplies context for predicting each demonstration target.
    id: supervised-fine-tuning.transfer.v2.1
  - prompt: A model gives overly long answers after training on uniformly verbose examples. What should be
      examined first?
    answer: a
    options:
    - id: a
      text: The behavior distribution in the demonstrations
    - id: b
      text: Whether longer answers prove better reasoning
    - id: c
      text: Whether every question requires a lower temperature
    feedback: Training examples can teach style and length preferences as well as task behavior.
    id: supervised-fine-tuning.transfer.v2.2
  - prompt: Weights are frozen and a good example is added to the prompt. Which process occurred?
    answer: a
    options:
    - id: a
      text: Learning from supplied context during use, without the stated parameter training
    - id: c
      text: A permanent rewrite of the model’s vocabulary
    - id: b
      text: Supervised parameter updates merely because an example appeared
    feedback: Examples in context and gradient-based fine-tuning change different parts of the system.
    id: supervised-fine-tuning.transfer.v2.3
  - prompt: Training and test requests paraphrase the same source cases. What should be checked?
    answer: a
    options:
    - id: c
      text: Whether the test examples are listed after the training file
    - id: b
      text: Whether both files use the same extension
    - id: a
      text: Whether source-related cases crossed the intended split
    feedback: Source-based overlap can undermine a claim about new requests.
    id: supervised-fine-tuning.transfer.v2.4
