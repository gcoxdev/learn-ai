schema_version: 0.2-draft
lesson:
  id: supervised-fine-tuning
  version: 0.1.0-draft
  title: Learn response behavior from demonstrations
  state: draft
  summary: Supervised fine-tuning fits demonstrated responses under a chosen template and loss mask; data quality,
    coverage, and evaluation determine what behavior the model learns.
  slot: M20.2
  category: learning
  minutes: 12
  sources:
  - title: InstructGPT
    url: https://arxiv.org/abs/2203.02155
  - title: FLAN
    url: https://arxiv.org/abs/2109.01652
objectives:
- id: objective.supervised-fine-tuning
  version: 1-draft
  statement: Supervised fine-tuning fits demonstrated responses under a chosen template and loss mask; data quality,
    coverage, and evaluation determine what behavior the model learns.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - supervised-fine-tuning.base
  - supervised-fine-tuning.transfer
  prerequisites:
  - anyOf:
    - objective.posttraining-stages
  - anyOf:
    - objective.packing-and-masking
scenes:
- id: supervised-fine-tuning.s1
  title: Turn demonstrations into token predictions
  type: explanation
  depth: intuition
  objective_refs:
  - objective.supervised-fine-tuning
  markdown: An instruction example can contain a user request and a desired assistant response. The model predicts
    response tokens conditioned on the preceding conversation. Teacher forcing supplies the demonstrated prefix
    during training; deployment instead conditions on the model’s own generated continuation.
  text_mode: An instruction example can contain a user request and a desired assistant response. The model predicts
    response tokens conditioned on the preceding conversation. Teacher forcing supplies the demonstrated prefix
    during training; deployment instead conditions on the model’s own generated continuation.
  bridges: []
- id: supervised-fine-tuning.s2
  title: Define which tokens receive loss
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.supervised-fine-tuning
  markdown: A recipe may apply loss only to assistant response tokens, or use a different explicit mask. User and
    system messages can remain visible as context even when excluded from the objective. Multi-turn examples require
    consistent role boundaries, end markers, and tool-call formatting.
  text_mode: A recipe may apply loss only to assistant response tokens, or use a different explicit mask. User and
    system messages can remain visible as context even when excluded from the objective. Multi-turn examples require
    consistent role boundaries, end markers, and tool-call formatting.
  bridges: []
- id: supervised-fine-tuning.s3
  title: Curate behavior rather than volume alone
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.supervised-fine-tuning
  markdown: If every example is verbose, the model can learn verbosity even when a concise answer is preferable.
    Include task diversity, uncertainty handling, appropriate refusals, and valid structured outputs. Demonstrations
    containing mistakes teach mistakes; deduplication and held-out evaluation remain necessary after pretraining.
  text_mode: If every example is verbose, the model can learn verbosity even when a concise answer is preferable.
    Include task diversity, uncertainty handling, appropriate refusals, and valid structured outputs. Demonstrations
    containing mistakes teach mistakes; deduplication and held-out evaluation remain necessary after pretraining.
  bridges: []
- id: supervised-fine-tuning.s4
  title: Test beyond imitation of the training set
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.supervised-fine-tuning
  markdown: Evaluate fresh requests, paraphrases, multi-turn cases, and domains outside the tuning mixture. Compare
    retained base capabilities and behavior under the intended chat template. Low training loss proves fit to demonstrations,
    not universal instruction following or correctness.
  text_mode: Evaluate fresh requests, paraphrases, multi-turn cases, and domains outside the tuning mixture. Compare
    retained base capabilities and behavior under the intended chat template. Low training loss proves fit to demonstrations,
    not universal instruction following or correctness.
  bridges: []
- id: supervised-fine-tuning.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.supervised-fine-tuning
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Supervised fine-tuning fits demonstrated responses under a chosen template and loss mask; data quality,
    coverage, and evaluation determine what behavior the model learns.
- id: supervised-fine-tuning.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.supervised-fine-tuning
  markdown: Supervised fine-tuning fits demonstrated responses under a chosen template and loss mask; data quality,
    coverage, and evaluation determine what behavior the model learns.
  text_mode: Supervised fine-tuning fits demonstrated responses under a chosen template and loss mask; data quality,
    coverage, and evaluation determine what behavior the model learns.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - supervised-fine-tuning.s1
    - supervised-fine-tuning.s2
    - supervised-fine-tuning.s3
    - supervised-fine-tuning.s4
    - supervised-fine-tuning.check
    gate_refs:
    - gate.core
  scene_aliases:
    supervised-fine-tuning.recap: supervised-fine-tuning.check
assessment_families:
- id: supervised-fine-tuning.base
  objective_ref: objective.supervised-fine-tuning
  task: base
  response_type: single_choice
  points: 1
  hint: 'Define which tokens receive loss: trace the inputs, operation, and result before choosing.'
  remediation_scene: supervised-fine-tuning.s2
  variants:
  - id: supervised-fine-tuning.base.1
    prompt: What supplies the prior response tokens during teacher-forced training?
    options:
    - id: a
      text: The demonstration
    - id: b
      text: Only previously sampled model tokens in every SFT recipe
    - id: c
      text: An unrelated document
    answer: a
    feedback: Teacher forcing conditions on the target prefix.
  - id: supervised-fine-tuning.base.2
    prompt: Can user tokens be visible while excluded from loss?
    options:
    - id: b
      text: 'No'
    - id: c
      text: Only if the conversation has no roles
    - id: a
      text: 'Yes'
    answer: a
    feedback: Context visibility and supervision masks differ.
- id: supervised-fine-tuning.transfer
  objective_ref: objective.supervised-fine-tuning
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Test beyond imitation of the training set: trace the inputs, operation, and result before choosing.'
  remediation_scene: supervised-fine-tuning.s4
  variants:
  - id: supervised-fine-tuning.transfer.1
    prompt: A dataset contains mostly long answers. What behavior might it teach?
    options:
    - id: b
      text: Guaranteed concise responses
    - id: c
      text: No stylistic effect
    - id: a
      text: A preference for verbosity
    answer: a
    feedback: Demonstration distributions influence style as well as content.
  - id: supervised-fine-tuning.transfer.2
    prompt: Very low SFT training loss establishes what?
    options:
    - id: c
      text: Complete resistance to distribution shift
    - id: a
      text: Good fit to those supervised examples
    - id: b
      text: Universal factual correctness
    answer: a
    feedback: Generalization needs independent evaluation.
