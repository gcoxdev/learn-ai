assessment_families:
  - id: splits-and-leakage.base
    objective_ref: objective.splits-and-leakage
    task: base
    response_type: single_choice
    points: 1
    hint: 'Split at the right unit: trace the inputs, operation, and result before choosing.'
    remediation_scene: splits-and-leakage.s2
    variants:
      - id: splits-and-leakage.base.1
        prompt: Which partition is normally used for hyperparameter selection?
        options:
          - id: b
            text: A test set promised to remain untouched
          - id: c
            text: Only deployment incidents
          - id: a
            text: Validation
        answer: a
        feedback: Validation supports development choices; final testing should follow those choices.
        retired: true
      - id: splits-and-leakage.base.2
        prompt: What is a common reason to group a split by person?
        options:
          - id: c
            text: Guarantee every person has identical behavior
          - id: a
            text: Avoid shared-identity information across training and evaluation
          - id: b
            text: Increase the number of duplicate rows
        answer: a
        feedback: The grouping matches a claim about performance on unseen people.
        retired: true
  - id: splits-and-leakage.transfer
    objective_ref: objective.splits-and-leakage
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Audit the entire pipeline: trace the inputs, operation, and result before choosing.'
    remediation_scene: splits-and-leakage.s4
    variants:
      - id: splits-and-leakage.transfer.1
        prompt: A churn feature is created after a customer cancels. Can it fairly predict that cancellation beforehand?
        options:
          - id: c
            text: Only if the feature is numeric
          - id: a
            text: No; it contains information unavailable at prediction time
          - id: b
            text: Yes; later information always improves a valid forecast
        answer: a
        feedback: Prediction-time availability is part of the task definition.
        retired: true
      - id: splits-and-leakage.transfer.2
        prompt: A team tunes 30 times on the final test score. What has changed?
        options:
          - id: a
            text: The test set has become part of model selection
          - id: b
            text: Nothing; its file name preserves independence
          - id: c
            text: The training data has disappeared
        answer: a
        feedback: Repeated feedback creates selection dependence on the test set.
        retired: true
  - id: splits-and-leakage.base.v2
    objective_ref: objective.splits-and-leakage
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: splits-and-leakage.s3
    variants:
      - prompt: Two models are fitted on training data. Which examples should guide their selection before the final report?
        answer: a
        options:
          - id: c
            text: Whichever examples give the larger reported score
          - id: a
            text: Validation examples
          - id: b
            text: The protected test examples repeatedly
        feedback: Validation supports choices; the protected test evaluates the fixed choice.
        id: splits-and-leakage.base.v2.1
        retired: true
      - prompt: A system will meet entirely new patients. Several scans belong to each patient. What boundary matches the claim?
        answer: a
        options:
          - id: c
            text: Balance each partition by scan count without grouping patients
          - id: b
            text: Split individual scans across every partition
          - id: a
            text: Split by patient identity
        feedback: Patient grouping prevents the same identity appearing on both sides of a new-patient test.
        id: splits-and-leakage.base.v2.2
        retired: true
      - prompt: A demand forecast is tested on January after training on February. What is the concern?
        answer: a
        options:
          - id: b
            text: January should be moved into training to raise the reported test score
          - id: c
            text: Calendar ordering is unrelated to a future-demand claim
          - id: a
            text: The experiment uses future periods unavailable at the intended prediction time
        feedback: The evaluation should reproduce the information available when forecasting.
        id: splits-and-leakage.base.v2.3
        retired: true
      - prompt: A mean used for missing-value imputation was fitted on all partitions. What crossed the boundary?
        answer: a
        options:
          - id: a
            text: Held-out observations influenced a training transformation
          - id: c
            text: The transformation is independent of the test because labels were hidden
          - id: b
            text: The model necessarily copied every test label
        feedback: Leakage can occur through preprocessing even when labels are not directly used.
        id: splits-and-leakage.base.v2.4
        retired: true
  - id: splits-and-leakage.transfer.v2
    objective_ref: objective.splits-and-leakage
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: splits-and-leakage.s3
    variants:
      - prompt: A team changes its prompt after each of twenty test-score checks. How should the final score be described?
        answer: a
        options:
          - id: b
            text: An untouched estimate for a choice fixed in advance
          - id: c
            text: A training loss computed by gradient descent
          - id: a
            text: A score on data used during system selection
        feedback: Repeated selection feedback makes this test part of development.
        id: splits-and-leakage.transfer.v2.1
        retired: true
      - prompt: A cancellation predictor uses a flag created after cancellation. Which repair addresses the task?
        answer: a
        options:
          - id: c
            text: Scale the flag to a smaller numerical value
          - id: a
            text: Remove or replace it with information available before cancellation
          - id: b
            text: Keep it and enlarge the test set
        feedback: The feature is unavailable at the promised prediction time.
        id: splits-and-leakage.transfer.v2.2
        retired: true
      - prompt: Two paraphrases of each source document land in different partitions. What should be checked?
        answer: a
        options:
          - id: a
            text: Group all derivatives of a source before splitting
          - id: b
            text: Whether changing the wording is sufficient to treat them as independent
          - id: c
            text: Whether the documents have equally many tokens
        feedback: A transformed copy can preserve information from the same source across partitions.
        id: splits-and-leakage.transfer.v2.3
        retired: true
      - prompt: A held-out test performs much worse than validation. What is a useful first investigation?
        answer: a
        options:
          - id: c
            text: Drop the difficult test items from the final score
          - id: a
            text: Compare sampling, drift, tuning history, and split assumptions
          - id: b
            text: Select a better checkpoint using the same test and call it untouched
        feedback: A discrepancy needs diagnosis; using the result for further choices changes the test’s role.
        id: splits-and-leakage.transfer.v2.4
        retired: true
  - id: splits-and-leakage.base.v3
    objective_ref: objective.splits-and-leakage
    task: base
    response_type: single_choice
    points: 1
    hint: Ask what will be new when the model is really used (a person, a place, a later date) and make sure the test holds only things that are new in that same way.
    remediation_scene: splits-and-leakage.s3
    variants:
      - id: splits-and-leakage.base.v3.1
        prompt: A team has trained five candidate models and must pick one to ship. Which data should decide between them?
        options:
          - id: c
            text: The test set, since it gives the most honest comparison
          - id: a
            text: The validation set, keeping the test set for the final report
          - id: b
            text: The training set, picking the model with the lowest error there
        answer: a
        feedback: Choosing is validation's job, and the test is used once, after the choice. Using the test to choose makes its score too rosy, and training error favors the model that memorized the most.
      - id: splits-and-leakage.base.v3.2
        prompt: A skin-condition model will be used on new patients. Most patients have several photos. How should the photos be split?
        options:
          - id: b
            text: Randomly by photo, keeping the share of each condition equal
          - id: c
            text: Each patient's newest photo in test and older photos in training
          - id: a
            text: By patient, so all of one patient's photos share a partition
        answer: a
        feedback: The claim is about new patients, so no patient may appear on both sides. Putting each patient's newest photo in test still tests only patients the model has seen, and balancing conditions doesn't stop a patient from crossing over.
      - id: splits-and-leakage.base.v3.3
        prompt: A model forecasts next week's hotel bookings. Its test set was made by shuffling two years of weeks at random. What is wrong?
        options:
          - id: a
            text: Training includes weeks after some test weeks, so it borrows from the future
          - id: b
            text: The test set should hold only the busiest weeks, to make it harder
          - id: c
            text: Weeks are too large a unit, so the split should shuffle days instead
        answer: a
        feedback: In real use the model only knows the past, so the test should come after the training period. Shuffling days instead of weeks makes the future leak even worse, and choosing the busiest weeks changes what the test measures without fixing the timing.
      - id: splits-and-leakage.base.v3.4
        prompt: A pneumonia model uses a column "antibiotics prescribed" and scores extremely well. Why is that column a problem?
        options:
          - id: c
            text: It's a strong medical signal, so it should stay in the model
          - id: b
            text: It's only a problem if the test set happens to be small
          - id: a
            text: It's filled in after diagnosis, so it isn't there when the model is needed
        answer: a
        feedback: Doctors prescribe antibiotics after diagnosing pneumonia, so the column carries the answer from the future. It looks like a strong signal only because of that, and a bigger test set would just measure the leak more precisely.
        retired: true
      - id: splits-and-leakage.base.v3.5
        prompt: When a hotel room is booked, a model predicts whether the guest will later cancel. One input column is "refund issued," and the model scores 98%. What's wrong?
        options:
          - id: b
            text: Nothing, since refunds are a strong real sign of cancelling
          - id: a
            text: The test set is too small to trust a score as high as 98%
          - id: c
            text: Refunds follow cancellations, so the column is empty at booking
        answer: c
        feedback: A refund is issued after a guest cancels, so the column carries the answer from the future and won't exist when the booking is made. It looks like a strong signal only for that reason, and a bigger test set would just measure the leak more precisely.
  - id: splits-and-leakage.transfer.v3
    objective_ref: objective.splits-and-leakage
    task: transfer
    response_type: single_choice
    points: 1
    hint: Look for the hidden link between training and test (a shared source, a shared person, or a test that was used to make choices) and pick the change that cuts it.
    remediation_scene: splits-and-leakage.s5
    variants:
      - id: splits-and-leakage.transfer.v3.1
        prompt: A spam filter is tested on a random 20% of one month's emails. Many spam emails come from campaigns that send thousands of near-identical copies. What change makes the test more honest?
        options:
          - id: b
            text: Delete exact copies but keep near-identical emails from each campaign
          - id: a
            text: Keep each campaign's emails together, all in training or all in test
          - id: c
            text: Double the test set to 40% so it holds more of every campaign
        answer: a
        feedback: A new campaign is what the filter will face, so whole campaigns should be held out. Removing only exact copies leaves near-identical emails on both sides, and a bigger random test set just contains more of the same campaigns.
      - id: splits-and-leakage.transfer.v3.2
        prompt: A team tries 40 settings, scores each on the test set, and reports the best score, 91%. How should that 91% be described?
        options:
          - id: c
            text: As an unbiased estimate, since no model was trained on the test set
          - id: b
            text: As a training score, since tuning counts as part of training
          - id: a
            text: As likely too high, since the test set was used to pick the winner
        answer: a
        feedback: Picking the best of 40 test scores rewards luck as well as skill, so the score is optimistic even though no model trained on those examples. It isn't a training score either; it's a test score that was used for choosing, and a fresh test set would give a fairer number.
      - id: splits-and-leakage.transfer.v3.3
        prompt: An X-ray model scores 95% on a random split of images from two hospitals, but 70% at a third hospital. What's the most likely explanation, and the matching test?
        options:
          - id: a
            text: It learned hospital-specific cues; test it by holding out a whole hospital
          - id: b
            text: The third hospital's images are blurrier; test it on sharper images there
          - id: c
            text: It needs more training; test it again after training for longer
        answer: a
        feedback: A random split lets hospital-specific cues work on the test too, so only holding out a whole hospital reveals them. Image quality or more training might matter, but neither explains why the random-split score was so much higher.
      - id: splits-and-leakage.transfer.v3.4
        prompt: A movie recommender is tested on ratings held out at random from its existing users. The company advertises that it "works great for brand-new users." What test would match that claim?
        options:
          - id: b
            text: Hold out each user's most recent ratings and predict those
          - id: c
            text: Hold out a random 30% of all ratings instead of 10%
          - id: a
            text: Hold out entire users, so none of their ratings are in training
        answer: a
        feedback: A brand-new user has no ratings in training, so the test must hold out whole users. Holding out recent ratings tests returning users, and a bigger random share still mixes every user into both sides.
