schema_version: 0.2-draft
lesson:
  id: splits-and-leakage
  version: 0.1.0-draft
  title: Protect the examples used to judge a model
  state: draft
  summary: Training, validation, and test partitions serve different purposes; time, entity grouping, and preprocessing
    boundaries determine whether held-out evaluation is credible.
  slot: M03.5
  category: learning
  minutes: 12
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.splits-and-leakage
  version: 1-draft
  statement: Training, validation, and test partitions serve different purposes; time, entity grouping, and preprocessing
    boundaries determine whether held-out evaluation is credible.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - splits-and-leakage.base
  - splits-and-leakage.transfer
  prerequisites:
  - anyOf:
    - objective.data
  - anyOf:
    - objective.data-cleaning
scenes:
- id: splits-and-leakage.s1
  title: Assign each partition a job
  type: explanation
  depth: intuition
  objective_refs:
  - objective.splits-and-leakage
  markdown: Training examples fit the model. Validation examples guide choices such as hyperparameters or early
    stopping. A test set estimates performance after those choices are fixed. Repeatedly adjusting the model in
    response to test results turns that test set into another development resource.
  text_mode: Training examples fit the model. Validation examples guide choices such as hyperparameters or early
    stopping. A test set estimates performance after those choices are fixed. Repeatedly adjusting the model in
    response to test results turns that test set into another development resource.
  bridges: []
- id: splits-and-leakage.s2
  title: Split at the right unit
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.splits-and-leakage
  markdown: If several photos show the same object, a random image split may place near-identical views in training
    and test. If records are grouped by person or organization, split by that entity when the intended claim concerns
    new entities. The split should simulate how future inputs differ from available training information.
  text_mode: If several photos show the same object, a random image split may place near-identical views in training
    and test. If records are grouped by person or organization, split by that entity when the intended claim concerns
    new entities. The split should simulate how future inputs differ from available training information.
  bridges: []
- id: splits-and-leakage.s3
  title: Respect the arrow of time
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.splits-and-leakage
  markdown: To forecast demand next week, a training example should use only information available before its prediction
    time. A feature updated after delivery, such as final shipping status, can reveal the target. Random splitting
    can also let a model train on future periods while being tested on earlier ones.
  text_mode: To forecast demand next week, a training example should use only information available before its prediction
    time. A feature updated after delivery, such as final shipping status, can reveal the target. Random splitting
    can also let a model train on future periods while being tested on earlier ones.
  bridges: []
- id: splits-and-leakage.s4
  title: Audit the entire pipeline
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.splits-and-leakage
  markdown: Leakage can enter through labels, duplicate documents, feature engineering, data cleaning, hyperparameter
    choice, or benchmark contamination. Draw a timeline and trace every input back to when it became available.
    Compare suspiciously strong results with a deliberately simple baseline and a stricter split.
  text_mode: Leakage can enter through labels, duplicate documents, feature engineering, data cleaning, hyperparameter
    choice, or benchmark contamination. Draw a timeline and trace every input back to when it became available.
    Compare suspiciously strong results with a deliberately simple baseline and a stricter split.
  bridges: []
- id: splits-and-leakage.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.splits-and-leakage
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Training, validation, and test partitions serve different purposes; time, entity grouping, and preprocessing
    boundaries determine whether held-out evaluation is credible.
- id: splits-and-leakage.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.splits-and-leakage
  markdown: Training, validation, and test partitions serve different purposes; time, entity grouping, and preprocessing
    boundaries determine whether held-out evaluation is credible.
  text_mode: Training, validation, and test partitions serve different purposes; time, entity grouping, and preprocessing
    boundaries determine whether held-out evaluation is credible.
