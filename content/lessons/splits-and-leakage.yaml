schema_version: 0.2-draft
lesson:
  id: splits-and-leakage
  version: 0.2.1-draft
  title: Protect the examples used to judge a model
  state: draft
  summary: 'Protect the surprise in a quiz: learn, tune, and test with examples that have different jobs.'
  slot: M03.5
  category: learning
  sources:
  - title: scikit-learn — inconsistent preprocessing and data leakage
    url: https://scikit-learn.org/stable/common_pitfalls.html
  - title: Dive into Deep Learning — environment and distribution shift
    url: https://d2l.ai/chapter_linear-classification/environment-and-distribution-shift.html
  archetype: mechanism
objectives:
- id: objective.splits-and-leakage
  version: 2-draft
  statement: Design train/validation/test boundaries for grouped or time-ordered data and identify leakage through
    preprocessing or repeated test use.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - splits-and-leakage.base.v2
  - splits-and-leakage.transfer.v2
  prerequisites:
  - anyOf:
    - objective.data
  - anyOf:
    - objective.data-cleaning
scenes:
- id: splits-and-leakage.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.splits-and-leakage
  title: A practice sheet is not a surprise quiz
  markdown: Imagine practicing ten riddles, then being tested on the same ten with their order shuffled. A high
    score would not tell us how you handle new riddles. Model evaluation has the same trap. A **partition** is a
    chosen part of the dataset. Training examples are used to fit the model. Validation examples help choose settings
    or compare candidates. Test examples estimate performance after those choices are fixed. Give each part a job
    before beginning the experiment.
  text_mode: Imagine practicing ten riddles, then being tested on the same ten with their order shuffled. A high
    score would not tell us how you handle new riddles. Model evaluation has the same trap. A **partition** is a
    chosen part of the dataset. Training examples are used to fit the model. Validation examples help choose settings
    or compare candidates. Test examples estimate performance after those choices are fixed. Give each part a job
    before beginning the experiment.
  bridges: []
- id: splits-and-leakage.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.splits-and-leakage
  title: Write the three jobs on three envelopes
  markdown: Place 60 of 100 independent examples in a training envelope, 20 in validation, and 20 in test. These
    proportions are an illustration, not a universal recipe. Fit candidate A and candidate B using training examples.
    Suppose validation errors are A=4 and B=2, so the stated rule selects B. Only then open the test envelope. A
    test error count may differ because the examples differ. The test’s purpose is evidence about a fixed choice,
    not another chance to choose A.
  text_mode: Place 60 of 100 independent examples in a training envelope, 20 in validation, and 20 in test. These
    proportions are an illustration, not a universal recipe. Fit candidate A and candidate B using training examples.
    Suppose validation errors are A=4 and B=2, so the stated rule selects B. Only then open the test envelope. A
    test error count may differ because the examples differ. The test’s purpose is evidence about a fixed choice,
    not another chance to choose A.
  bridges:
  - arithmetic
- id: splits-and-leakage.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.splits-and-leakage
  title: Keep related examples in the same envelope
  markdown: Suppose twelve photos show just three bicycles, four photos per bicycle. A random photo split may show
    the same bicycle in both training and test. If your claim is “works on bicycles it has never seen,” group by
    bicycle identity before splitting. If your intended task is a new photo of an already-known bicycle, that is
    a different claim and needs a different test. The split unit should match what will actually be new in use.
  text_mode: Suppose twelve photos show just three bicycles, four photos per bicycle. A random photo split may show
    the same bicycle in both training and test. If your claim is “works on bicycles it has never seen,” group by
    bicycle identity before splitting. If your intended task is a new photo of an already-known bicycle, that is
    a different claim and needs a different test. The split unit should match what will actually be new in use.
  bridges: []
  figure:
    kind: data-splits
    caption: Keep related examples together before using the partitions for fitting, selection, and final evaluation.
    description: Assign six cards to training, validation, or test. Two cards from the same source must stay in
      one partition for this exercise, and each partition needs a source. Inspect the result to locate crossings.
- id: splits-and-leakage.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.splits-and-leakage
  title: Do not borrow information from the future
  markdown: To predict whether a parcel will arrive late, use information available when the prediction is made.
    A final delivery-status field already contains the outcome. A **leak** is information crossing a boundary that
    was supposed to protect the evaluation. Future-derived features, copied documents, and preprocessing fit on
    held-out data can all leak. For forecasting, put earlier periods in training and later periods in evaluation;
    a random shuffle can teach the model about periods it is supposedly predicting.
  text_mode: To predict whether a parcel will arrive late, use information available when the prediction is made.
    A final delivery-status field already contains the outcome. A **leak** is information crossing a boundary that
    was supposed to protect the evaluation. Future-derived features, copied documents, and preprocessing fit on
    held-out data can all leak. For forecasting, put earlier periods in training and later periods in evaluation;
    a random shuffle can teach the model about periods it is supposedly predicting.
  bridges: []
- id: splits-and-leakage.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.splits-and-leakage
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Learn on training, choose on validation, report on a protected test. Split by the real source of novelty
    and respect what was knowable at prediction time.
- id: splits-and-leakage.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.splits-and-leakage
  markdown: Training, validation, and test partitions serve different purposes; time, entity grouping, and preprocessing
    boundaries determine whether held-out evaluation is credible.
  text_mode: Training, validation, and test partitions serve different purposes; time, entity grouping, and preprocessing
    boundaries determine whether held-out evaluation is credible.
- id: splits-and-leakage.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.splits-and-leakage
  title: Tuning can quietly open the test envelope
  markdown: A team tries thirty prompts and keeps the one with the best test score. Even without gradient updates,
    the test set influenced the final system. It has become a development resource. Use validation for repeated
    choices, limit feedback from the protected test, and create a genuinely fresh evaluation when needed. Write
    down which results were visible to the team. Independence depends on information flow, not whether a filename
    contains the word test.
  text_mode: A team tries thirty prompts and keeps the one with the best test score. Even without gradient updates,
    the test set influenced the final system. It has become a development resource. Use validation for repeated
    choices, limit feedback from the protected test, and create a genuinely fresh evaluation when needed. Write
    down which results were visible to the team. Independence depends on information flow, not whether a filename
    contains the word test.
  bridges: []
- id: splits-and-leakage.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.splits-and-leakage
  title: Draw a boundary map before fitting
  markdown: 'Sketch the example’s source, its group, the time of each field, and the transformations that touch
    it. Put learned transformations inside the training side of the boundary, then reuse their saved settings. Check
    suspiciously strong scores with a stricter split and a simple baseline. Remember the three envelopes: “learn,
    choose, report.” This memory cue helps find mistakes in image, language, audio, recommendation, and forecasting
    systems without assuming they should all use the same split rule.'
  text_mode: 'Sketch the example’s source, its group, the time of each field, and the transformations that touch
    it. Put learned transformations inside the training side of the boundary, then reuse their saved settings. Check
    suspiciously strong scores with a stricter split and a simple baseline. Remember the three envelopes: “learn,
    choose, report.” This memory cue helps find mistakes in image, language, audio, recommendation, and forecasting
    systems without assuming they should all use the same split rule.'
  bridges: []
- id: splits-and-leakage.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.splits-and-leakage
  title: Catch the hidden repeat
  markdown: A test for new speakers puts different recordings of every speaker into both training and test. What
    needs to change?
  text_mode: A test for new speakers puts different recordings of every speaker into both training and test. What
    needs to change?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: Keep each speaker entirely on one side of the split.
    - id: b
      text: Shuffle the recordings once more without grouping.
    - id: c
      text: Rename the test recordings after the split.
    answer: a
    reveal_markdown: The claim concerns new speakers, so speaker identity is the grouping boundary. More shuffling
      does not remove shared identities.
    hint: Trace the example using the rule from the preceding pages.
    id: splits-and-leakage.practice.v2.7
navigation:
