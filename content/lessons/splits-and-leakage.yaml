schema_version: 0.2-draft
lesson:
  id: splits-and-leakage
  version: 0.4.0-draft
  title: Protect the examples used to judge a model
  state: draft
  summary: An X-ray model scores 94%, then fails at a new hospital. It had learned to recognize the hospital, not the disease. Learn to split data so tests catch tricks like this.
  slot: M03.5
  category: learning
  sources:
    - title: scikit-learn — inconsistent preprocessing and data leakage
      url: https://scikit-learn.org/stable/common_pitfalls.html
    - title: Dive into Deep Learning — environment and distribution shift
      url: https://d2l.ai/chapter_linear-classification/environment-and-distribution-shift.html
    - title: "Variable generalization performance of a deep learning model to detect pneumonia in chest radiographs (Zech et al., 2018)"
      url: https://doi.org/10.1371/journal.pmed.1002683
  archetype: mechanism
objectives:
  - id: objective.splits-and-leakage
    version: 4-draft
    statement: Design train/validation/test boundaries for grouped or time-ordered data and identify leakage through preprocessing or repeated test use.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - splits-and-leakage.base.v3
      - splits-and-leakage.transfer.v3
    prerequisites:
      - anyOf:
          - objective.data
      - anyOf:
          - objective.data-cleaning
scenes:
  - id: splits-and-leakage.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.splits-and-leakage
    title: The model that recognized hospitals
    markdown: |-
      A team trains a model to spot pneumonia on chest X-rays from two hospitals. Hospital A runs a busy intensive-care unit, where most patients X-rayed have pneumonia. Hospital B is an outpatient clinic, where few do. Each hospital's machine also leaves its own small marks on every image, like a text label in the corner.

      The team shuffles all the X-rays, holds out 20% as a test set, and scores 94%. At a third hospital, the model does badly. It had learned, in part, "Hospital A's corner mark means pneumonia is likely," and that shortcut worked on the test set too, because the test images came from the same two hospitals. The test asked "How well does this work on more X-rays from A and B?" instead of "How well does it work at a new hospital?"

      This story is simplified, but Zech and colleagues (2018) found the real version: chest X-rays carried enough hidden clues for a model to tell almost perfectly which hospital each came from, and pneumonia models often did worse at hospitals they hadn't trained on. The lesson: **a test only answers the question its split asks.** This lesson is about making the split ask the right one.
  - id: splits-and-leakage.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.splits-and-leakage
    title: Three envelopes, three jobs
    markdown: |-
      As in Rosa's bakery, you divide your examples before any modeling. Each part of the dataset, called a **partition**, gets one job. Picture 100 examples in three envelopes:

      | Envelope | Examples | Job |
      | --- | ---: | --- |
      | Training | 60 | Fit the models |
      | Validation | 20 | Choose between models |
      | Test | 20 | Report how the chosen model does, once |

      Fit candidate A and candidate B on the training envelope. On validation, A makes 4 errors and B makes 2, so you pick B. Only now do you open the test envelope and score B. If B makes 3 test errors, you report 3 of 20. You don't then go back and try A on the test to see if it would have done better; that turns the test into a second validation set.

      The 60/20/20 proportions are just an example. The fixed rule is the order: fit, then choose, then test.
  - id: splits-and-leakage.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.splits-and-leakage
    title: Keep each patient in one envelope
    markdown: |-
      Hospitals often have several scans of the same patient. Split scans at random, and one patient's Monday scan lands in training while their Thursday scan lands in test. A model can then score well just by recognizing the patient. The fix is a **grouped split**: keep all of a patient's scans in the same partition.

      This program shows the difference. Each of 100 patients has 5 scans and a unique "look," which has *nothing* to do with whether they're sick. The "model" simply copies the diagnosis of the most similar-looking training scan:

      ```python run
      import random
      random.seed(4)

      # 100 patients, 5 scans each. Each patient has a unique "look" (body shape, scanner
      # settings) and a diagnosis. The look has NOTHING to do with the diagnosis.
      scans = []
      for patient in range(100):
          look, sick = random.uniform(0, 100), random.random() < 0.5
          for _ in range(5):
              scans.append((patient, look + random.gauss(0, 0.05), sick))

      def accuracy(train, test):
          # "Model": copy the diagnosis of the most similar-looking training scan.
          hits = sum(min(train, key=lambda s: abs(s[1] - x))[2] == y for _, x, y in test)
          return hits / len(test)

      shuffled = random.sample(scans, len(scans))
      rand_train, rand_test = shuffled[:400], shuffled[400:]
      group_train = [s for s in scans if s[0] < 80]    # patients 0-79
      group_test = [s for s in scans if s[0] >= 80]    # patients 80-99, never seen

      shared = {s[0] for s in rand_train} & {s[0] for s in rand_test}
      print("random split : patients in both sets =", len(shared), " accuracy =", accuracy(rand_train, rand_test))
      print("grouped split: patients in both sets = 0  accuracy =", accuracy(group_train, group_test))
      ```

      The random split puts 67 patients on both sides and reports 96% accuracy. The grouped split reports 51%, a coin flip, which is the truth: this model knows nothing about disease. Change the noise `0.05` to `20` so patients no longer look distinctive, and watch the random-split score collapse too.

      Choose the group to match your claim. "Works on new patients" means grouping by patient; "works at new hospitals" means grouping by hospital. Try it with the cards below: related cards must stay in one partition.
    bridges: []
    figure:
      kind: data-splits
      caption: Keep related examples together before using the partitions for fitting, selection, and final evaluation.
      description: Assign six cards to training, validation, or test. Two cards from the same source must stay in one partition for this exercise, and each partition needs a source. Inspect the result to locate crossings.
  - id: splits-and-leakage.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.splits-and-leakage
    title: Don't borrow from the future
    markdown: |-
      Suppose the pneumonia dataset also has a column, "antibiotics prescribed." It's a superb predictor, and it's useless: doctors prescribe antibiotics *after* they diagnose pneumonia. At the moment the model is supposed to help, that column doesn't exist yet. As in Rosa's leftover croissants, this is **leakage**: information crossing a boundary that was supposed to keep the test honest.

      Time creates a second kind of leak. For anything that forecasts, such as next week's sales or tomorrow's hospital admissions, shuffling days at random lets the model learn from Wednesday while being "tested" on the Tuesday before it. Instead, train on earlier periods and test on later ones, so every test mirrors real use.

      :::mixup "Leakage only happens when the label gets copied into the inputs."
      Leaks come in many shapes: a column filled in later (antibiotics), a patient on both sides of the split, a cleaning rule fitted on test data (as in the data cleaning lesson), or the future sneaking into a shuffled time series. The common thread is information the model won't have when it's really used.
      :::
  - id: splits-and-leakage.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.splits-and-leakage
    title: Peeking at the test, one decision at a time
    markdown: |-
      A team writes 30 different prompts for a chatbot and scores each on the same 100-question test set. They keep the best one, which scores 88%, and announce "88% accuracy."

      :::predict Suppose all 30 prompts are equally good, each truly right 80% of the time on new questions. What will the best of the 30 test scores be?
      Around 88%. On 100 questions, luck alone moves each score up or down by several points. Pick the luckiest of 30, and you've mostly picked luck. In a simulation of this exact setup, the best of 30 averaged about 88%. The team's real accuracy on new questions is about 80%.
      :::

      No model was trained on the test set, yet the test set chose the winner, so its score is too rosy. That's why validation exists: make the many choices there, and use the test once. Kaggle competitions guard against this by ranking final entries on a hidden "private" test set. If you've already used a test set many times, collect a fresh one before making claims.
  - id: splits-and-leakage.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.splits-and-leakage
    title: Audit a score that's too good
    markdown: |-
      Dev's team builds a voice-command model that should work for *new speakers*. It scores 99%. Suspicious, Dev audits it one boundary at a time:

      | Check | Found | Fix | New score |
      | --- | --- | --- | ---: |
      | Groups | Same speakers in training and test | Split by speaker | 91% |
      | Cleaning rules | Noise filter fitted on all recordings | Fit on training only | 90% |
      | Test reuse | Test checked after 12 rounds of tuning | Record a fresh test set from new speakers | 88% |

      Each fix made the number smaller and more honest. Dev reports 88% on new speakers, and the team now knows the real starting point. If a score beats a simple baseline by a mile, run exactly this audit before celebrating.
  - id: splits-and-leakage.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.splits-and-leakage
    title: Catch the hidden repeat
    markdown: |-
      A test for new speakers puts different recordings of every speaker into both training and test. What needs to change?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: Keep each speaker entirely on one side of the split.
        - id: b
          text: Shuffle the recordings once more without grouping.
        - id: c
          text: Rename the test recordings after the split.
      answer: a
      reveal_markdown: |-
        The claim concerns new speakers, so speaker identity is the grouping boundary. More shuffling does not remove shared identities.
      hint: The test is meant to measure new speakers. What must a test speaker never share with training?
      id: splits-and-leakage.practice.v2.7
  - id: splits-and-leakage.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.splits-and-leakage
    markdown: "Hospitals, spam campaigns, movie fans, and a leaderboard ask the same thing each time: does this split test the claim, or leak the answer?"
    takeaway: |-
      Train to fit, validate to choose, and test once to report. Split by whatever will be new in real use (patients, hospitals, speakers, or future dates), and keep every learned step on the training side.
  - id: splits-and-leakage.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.splits-and-leakage
    markdown: |-
      Use training data to learn, validation data to choose, and a protected test to evaluate the result. Keep related examples together when the task calls for unfamiliar people or objects.
