schema_version: 0.2-draft
lesson:
  id: scaling-and-memorization
  version: 0.2.0-draft
  title: More capacity changes more than one thing
  state: draft
  summary: Read a scaling curve as evidence from a particular experiment, and distinguish fitting examples
    from transferring useful patterns.
  slot: M09.7
  category: learning
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: Reconciling modern machine-learning practice and the bias-variance trade-off
    url: https://www.pnas.org/doi/10.1073/pnas.1903070116
objectives:
- id: objective.scaling-and-memorization
  version: 1-draft
  statement: Scaling curves, interpolation, double descent, and memorization describe observed learning behavior
    under specific setups; they do not form a universal law that bigger models are always better.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - scaling-and-memorization.base
  - scaling-and-memorization.transfer
  prerequisites:
  - anyOf:
    - objective.bias-variance
  - anyOf:
    - objective.evaluation-selection
scenes:
- id: scaling-and-memorization.s1
  title: Vary a resource deliberately
  type: explanation
  depth: intuition
  objective_refs:
  - objective.scaling-and-memorization
  markdown: 'A scaling experiment changes model size, data, or computation and measures an outcome under a
    defined recipe. Empirical power-law fits can summarize a range of results, but extrapolation beyond that
    range is uncertain. Parameter count alone does not fix optimization, data quality, or inference cost.


    An empirical **power law** means a quantity is approximately proportional to a resource raised to a power
    over the observed range. If a toy error term scales as data size to the power −1/2, four times the data
    halves that term. This is an illustrative relationship, not a universal forecast for AI models; an irreducible
    error floor can also remain.'
  text_mode: 'A scaling experiment changes model size, data, or computation and measures an outcome under a
    defined recipe. Empirical power-law fits can summarize a range of results, but extrapolation beyond that
    range is uncertain. Parameter count alone does not fix optimization, data quality, or inference cost.


    An empirical **power law** means a quantity is approximately proportional to a resource raised to a power
    over the observed range. If a toy error term scales as data size to the power −1/2, four times the data
    halves that term. This is an illustrative relationship, not a universal forecast for AI models; an irreducible
    error floor can also remain.'
  bridges: []
- id: scaling-and-memorization.s2
  title: Understand interpolation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.scaling-and-memorization
  markdown: 'An interpolating model fits the training targets exactly or nearly exactly. Around an interpolation
    threshold, some experimental setups show an error peak followed by improved test behavior at higher capacity:
    double descent. The phenomenon depends on the setup and does not guarantee improvement for every added
    parameter.


    **Capacity** describes what patterns the chosen model family can fit. Imagine test errors of 20%, 12%,
    18%, and 10% as capacity increases: down, up, then down again. These invented numbers illustrate a double-descent
    shape. They do not say where a real model''s peak will be, or whether it will have one at all.'
  text_mode: 'An interpolating model fits the training targets exactly or nearly exactly. Around an interpolation
    threshold, some experimental setups show an error peak followed by improved test behavior at higher capacity:
    double descent. The phenomenon depends on the setup and does not guarantee improvement for every added
    parameter.


    **Capacity** describes what patterns the chosen model family can fit. Imagine test errors of 20%, 12%,
    18%, and 10% as capacity increases: down, up, then down again. These invented numbers illustrate a double-descent
    shape. They do not say where a real model''s peak will be, or whether it will have one at all.'
  bridges: []
- id: scaling-and-memorization.s3
  title: Memorization and useful pattern learning can coexist
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.scaling-and-memorization
  markdown: A model can learn reusable statistical structure and retain specific training sequences. These
    are not mutually exclusive categories. Exact reproduction, membership-related signals, and performance
    on novel combinations examine different properties. A high benchmark score does not establish the absence
    of memorized private or copyrighted content.
  text_mode: A model can learn reusable statistical structure and retain specific training sequences. These
    are not mutually exclusive categories. Exact reproduction, membership-related signals, and performance
    on novel combinations examine different properties. A high benchmark score does not establish the absence
    of memorized private or copyrighted content.
  bridges: []
- id: scaling-and-memorization.s4
  title: Compare under useful constraints
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.scaling-and-memorization
  markdown: Measure quality, training resources, data, and deployment cost together. A small model with relevant
    data can outperform a larger poorly matched one on a task. Use scaling observations to plan experiments,
    then test the actual target setting. Keep open questions distinct from settled mechanisms.
  text_mode: Measure quality, training resources, data, and deployment cost together. A small model with relevant
    data can outperform a larger poorly matched one on a task. Use scaling observations to plan experiments,
    then test the actual target setting. Keep open questions distinct from settled mechanisms.
  bridges: []
- id: scaling-and-memorization.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.scaling-and-memorization
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Scaling curves, interpolation, double descent, and memorization describe observed learning behavior
    under specific setups; they do not form a universal law that bigger models are always better.
