assessment_families:
- id: scaling-and-memorization.base
  objective_ref: objective.scaling-and-memorization
  task: base
  response_type: single_choice
  points: 1
  hint: 'Understand interpolation: trace the inputs, operation, and result before choosing.'
  remediation_scene: scaling-and-memorization.s2
  variants:
  - id: scaling-and-memorization.base.1
    prompt: What does an empirical scaling fit summarize?
    options:
    - id: a
      text: Observed behavior over a stated experimental range
    - id: b
      text: A proof for every future scale
    - id: c
      text: Only an architecture diagram
    answer: a
    feedback: A fitted relationship depends on data, recipe, and the measured range.
  - id: scaling-and-memorization.base.2
    prompt: What is interpolation in this learning context?
    options:
    - id: b
      text: Only drawing a smooth chart line
    - id: c
      text: A guarantee of low population error
    - id: a
      text: Fitting the training targets exactly or nearly exactly
    answer: a
    feedback: Training fit and generalization remain separate quantities.
- id: scaling-and-memorization.transfer
  objective_ref: objective.scaling-and-memorization
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Compare under useful constraints: trace the inputs, operation, and result before choosing.'
  remediation_scene: scaling-and-memorization.s4
  variants:
  - id: scaling-and-memorization.transfer.1
    prompt: Can a model both generalize usefully and memorize specific examples?
    options:
    - id: b
      text: No; they are mutually exclusive
    - id: c
      text: Only if it has no parameters
    - id: a
      text: 'Yes'
    answer: a
    feedback: Different behaviors can coexist within the same learned system.
  - id: scaling-and-memorization.transfer.2
    prompt: A larger model performs worse with mismatched data and budget. Does that contradict every scaling study?
    options:
    - id: c
      text: Only if the score is measured twice
    - id: a
      text: No; experimental conditions differ
    - id: b
      text: Yes; all scaling observations are false
    answer: a
    feedback: Scaling claims must be interpreted under their reported conditions.
