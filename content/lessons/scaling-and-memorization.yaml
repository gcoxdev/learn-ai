schema_version: 0.2-draft
lesson:
  id: scaling-and-memorization
  version: 0.4.0-draft
  title: More capacity changes more than one thing
  state: draft
  summary: Make a language model ten times bigger and its loss falls by a predictable amount. Learn to read scaling laws, see why test error can rise and then fall again, and meet memorization.
  slot: M09.7
  category: learning
  sources:
    - title: "Scaling Laws for Neural Language Models (Kaplan et al., 2020)"
      url: https://arxiv.org/abs/2001.08361
    - title: "Training Compute-Optimal Large Language Models (Hoffmann et al., 2022)"
      url: https://arxiv.org/abs/2203.15556
    - title: "Reconciling modern machine-learning practice and the bias-variance trade-off (Belkin et al., 2019)"
      url: https://www.pnas.org/doi/10.1073/pnas.1903070116
    - title: "Extracting Training Data from Large Language Models (Carlini et al., 2021)"
      url: https://arxiv.org/abs/2012.07805
    - title: "Quantifying Memorization Across Neural Language Models (Carlini et al., 2022)"
      url: https://arxiv.org/abs/2202.07646
    - title: "Deep Double Descent: Where Bigger Models and More Data Hurt (Nakkiran et al., 2019)"
      url: https://arxiv.org/abs/1912.02292
objectives:
  - id: objective.scaling-and-memorization
    version: 2-draft
    statement: Read scaling curves, double descent, and memorization as results from specific setups, not a law that bigger is always better.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - scaling-and-memorization.base.v2
      - scaling-and-memorization.transfer.v2
      - scaling-and-memorization.calculate
    prerequisites:
      - anyOf:
          - objective.bias-variance
      - anyOf:
          - objective.evaluation-selection
scenes:
  - id: scaling-and-memorization.s1
    title: Ten times bigger, how much better?
    type: explanation
    depth: intuition
    objective_refs:
      - objective.scaling-and-memorization
    markdown: |-
      A lab trains four language models with the same recipe, at 1 million, 10 million, 100 million, and 1 billion parameters, and measures each one's test loss (how surprised it is by held-out text; lower is better): 2.56, 2.28, 2.10, 1.99. Each tenfold jump helps, but by less each time.

      Curves like this are usually summarized by a **power law** with a floor:

      $$L(N) \approx a\,N^{-\alpha} + L_\infty$$

      $N$ is the number of parameters. $L_\infty$ is the **irreducible loss**, a floor no model size can beat (text has real randomness). The term $a N^{-\alpha}$ is the part that more parameters can remove, and $\alpha$ sets how fast. These invented numbers follow $a = 12$, $\alpha = 0.2$, $L_\infty = 1.8$: every tenfold increase multiplies the removable part by $10^{-0.2} \approx 0.63$. At $N = 10^9$ that part is $12 \times 10^{-1.8} = 0.19$, so $L = 1.99$.

      :::story Kaplan's straight lines
      In 2020, Jared Kaplan and colleagues at OpenAI trained many transformer language models and found that test loss fell as a smooth power law in model size, in data, and in training compute, across many orders of magnitude. On a log–log plot the trends were nearly straight lines. The fitted exponents were small (about 0.076 for model size), which is why each big improvement took so much more scale.
      :::

      A power law invites extrapolation, and this program shows the risk. It fits the four points two ways, with no floor and with a floor of 1.8:

      ```python run
      import numpy as np

      N = np.array([1e6, 1e7, 1e8, 1e9])              # model sizes (parameters)
      loss = np.array([2.56, 2.28, 2.10, 1.99])        # invented test losses

      def fit(floor):
          """Fit loss - floor = a * N^(-alpha) as a straight line in log-log space."""
          slope, intercept = np.polyfit(np.log10(N), np.log10(loss - floor), 1)
          return np.exp(intercept * np.log(10)), -slope

      for floor in [0.0, 1.8]:
          a, alpha = fit(floor)
          pred = lambda n: a * n ** -alpha + floor
          err = np.max(np.abs(pred(N) - loss))
          print(f"floor {floor}: alpha {alpha:.3f}, worst fit error {err:.3f}, "
                f"predicted loss at 1e10: {pred(1e10):.2f}, at 1e12: {pred(1e12):.2f}")
      ```

      Both curves pass within 0.04 of every measured point. At $10^{12}$ parameters, one predicts 1.52 and the other 1.85. Four points can't pin down the floor, and the floor dominates far-off predictions. So extrapolate one step beyond your data, then train a model at that size and check. Try `floor` values of 1.5 and 1.9.
    bridges: []
  - id: scaling-and-memorization.s2
    title: Chinchilla, or spend compute on data too
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.scaling-and-memorization
    markdown: |-
      Size isn't the only knob. Training compute is roughly $C \approx 6ND$ floating-point operations, where $D$ is the number of training **tokens** (word pieces). For a fixed budget C, you can train a big model on less text or a smaller model on more.

      In 2022, Jordan Hoffmann and colleagues at DeepMind fitted loss as a function of both $N$ and $D$ and asked which split minimizes loss for a given budget. Their answer: grow parameters and tokens in equal proportion, which works out to roughly **20 training tokens per parameter**. Earlier practice, following Kaplan et al., had put most extra compute into model size.

      | Model | Parameters | Training tokens | Tokens per parameter | Compute (6ND) |
      | --- | ---: | ---: | ---: | ---: |
      | Gopher (2021) | 280 billion | 300 billion | about 1 | 5.0 × 10²³ |
      | Chinchilla (2022) | 70 billion | 1.4 trillion | 20 | 5.9 × 10²³ |

      With a similar budget, the smaller, longer-trained Chinchilla outperformed Gopher on a wide range of benchmarks, and at a quarter of the size it is cheaper to run.

      :::predict You have compute to train a 1-billion-parameter model the Chinchilla way. How many tokens should it see?
      About 20 × 1 billion = 20 billion tokens. Many recent models go far beyond 20 per parameter on purpose. A model is trained once but used millions of times, so a smaller model trained longer can be cheaper overall even if its training wasn't compute-optimal.
      :::
    bridges: []
  - id: scaling-and-memorization.s3
    title: Double descent, or the U curve comes back down
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.scaling-and-memorization
    markdown: |-
      The bias–variance lesson ended with a U: test error falls as a model gets more flexible, then rises as it starts fitting noise. In 2019, Mikhail Belkin, Daniel Hsu, Siyuan Ma, and Soumik Mandal showed that the U is only the left part of the picture. Keep adding capacity and test error peaks, then falls again. They called it **double descent**.

      The peak sits at the **interpolation threshold**: the size where the model has just barely enough capacity to fit every training example exactly. There, only one fit passes through all the points, and it has to contort itself to do it. Past the threshold, many different fits pass through every point, and the training method tends to pick a smooth one (for least squares, the one with the smallest weights). Extra capacity then lets it fit the data *gently*.

      The program fits linear models with 40 noisy training examples, where the true answer depends on 100 inputs. A model with p parameters sees the first p inputs.

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      n_train, n_test, d = 40, 2000, 100
      beta = rng.normal(0, 1, d) / np.sqrt(d)       # the answer depends on all 100 inputs
      X_train = rng.normal(0, 1, (n_train, d))
      X_test = rng.normal(0, 1, (n_test, d))
      y_train = X_train @ beta + rng.normal(0, 0.25, n_train)   # noisy labels
      y_test = X_test @ beta

      for p in [5, 10, 20, 30, 36, 40, 44, 60, 100]:   # model sees the first p inputs
          coef = np.linalg.pinv(X_train[:, :p]) @ y_train        # smallest-weights fit
          train = np.mean((X_train[:, :p] @ coef - y_train) ** 2)
          test = np.mean((X_test[:, :p] @ coef - y_test) ** 2)
          print(f"{p:4d} parameters: train MSE {train:.3f}   test MSE {test:.3f}")
      ```

      Test error is 1.116 at 5 parameters, explodes to 36.8 at exactly 40 (the number of training examples), and falls to 0.646 at 100, the best of all. Preetum Nakkiran and colleagues (2019) found the same shape in deep networks, and the peak is sharpest when labels are noisy. A well-tuned regularization penalty flattens it. Change `0.25` to `0.0` (no label noise) and the peak shrinks but doesn't vanish: the inputs a small model can't see act like noise too.
    bridges: []
  - id: scaling-and-memorization.s4
    title: Memorizing and generalizing at the same time
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.scaling-and-memorization
    markdown: |-
      A model with enough capacity can learn general patterns *and* store particular training examples word for word. In 2021, Nicholas Carlini and colleagues prompted GPT-2 and extracted hundreds of verbatim sequences from its training data, including names, phone numbers, and email addresses that appeared on the web. GPT-2 generalized well, and it had memorized. A 2022 follow-up by the same group found that larger models memorize more, and that text repeated many times in training is memorized more.

      Different tests look for different things:

      | Test | Question it answers |
      | --- | --- |
      | **Extraction** | Can the model be prompted to reproduce training text exactly? |
      | **Membership inference** | Can someone tell whether a given example was in the training set? |
      | Novel combinations | Does the model handle inputs that combine known parts in new ways? |

      :::mixup "It scores well on the benchmark, so it's generalizing, not memorizing."
      If benchmark questions leaked into the training data, a common problem with web-scale text called **contamination**, a high score can come straight from memory. Check for overlap between the test set and the training data, and when you can, test on questions written after the training data was collected.
      :::
    bridges: []
  - id: scaling-and-memorization.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.scaling-and-memorization
    markdown: A loss curve to extrapolate, a compute budget to split, a test-error spike at the interpolation threshold, and a leaked benchmark ask you to read scaling results the way practitioners do.
    takeaway: |-
      Loss usually falls as a power law toward a floor as models, data, and compute grow, so extrapolate cautiously and balance data with parameters. Past the interpolation threshold, test error can fall again, and a model that generalizes can still memorize.
  - id: scaling-and-memorization.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.scaling-and-memorization
    markdown: |-
      A scaling curve describes what happened under a particular training setup. Use it to plan experiments, then test the result; extra capacity can support both useful patterns and memorization.
