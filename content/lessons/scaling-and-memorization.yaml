assessment_families:
  - id: scaling-and-memorization.base
    objective_ref: objective.scaling-and-memorization
    task: base
    response_type: single_choice
    points: 1
    hint: 'Understand interpolation: trace the inputs, operation, and result before choosing.'
    remediation_scene: scaling-and-memorization.s2
    variants:
      - id: scaling-and-memorization.base.1
        prompt: What does an empirical scaling fit summarize?
        options:
          - id: a
            text: Observed behavior over a stated experimental range
          - id: b
            text: A proof for every future scale
          - id: c
            text: Only an architecture diagram
        answer: a
        feedback: A fitted relationship depends on data, recipe, and the measured range.
        retired: true
      - id: scaling-and-memorization.base.2
        prompt: What is interpolation in this learning context?
        options:
          - id: b
            text: Only drawing a smooth chart line
          - id: c
            text: A guarantee of low population error
          - id: a
            text: Fitting the training targets exactly or nearly exactly
        answer: a
        feedback: Training fit and generalization remain separate quantities.
        retired: true
  - id: scaling-and-memorization.transfer
    objective_ref: objective.scaling-and-memorization
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Compare under useful constraints: trace the inputs, operation, and result before choosing.'
    remediation_scene: scaling-and-memorization.s4
    variants:
      - id: scaling-and-memorization.transfer.1
        prompt: Can a model both generalize usefully and memorize specific examples?
        options:
          - id: b
            text: No; they are mutually exclusive
          - id: c
            text: Only if it has no parameters
          - id: a
            text: 'Yes'
        answer: a
        feedback: Different behaviors can coexist within the same learned system.
        retired: true
      - id: scaling-and-memorization.transfer.2
        prompt: A larger model performs worse with mismatched data and budget. Does that contradict every scaling study?
        options:
          - id: c
            text: Only if the score is measured twice
          - id: a
            text: No; experimental conditions differ
          - id: b
            text: Yes; all scaling observations are false
        answer: a
        feedback: Scaling claims must be interpreted under their reported conditions.
        retired: true
  - id: scaling-and-memorization.base.v2
    objective_ref: objective.scaling-and-memorization
    task: base
    response_type: single_choice
    points: 1
    hint: Separate the floor L∞ from the part that shrinks with scale, and find the interpolation threshold, where the model can just barely fit every training example.
    remediation_scene: scaling-and-memorization.s3
    variants:
      - id: scaling-and-memorization.base.v2.1
        prompt: A model family's loss follows L(N) ≈ a·N^(−α) + L∞ with α = 0.2. What happens to the loss as N keeps growing?
        options:
          - id: b
            text: It falls toward zero, just more slowly each time
          - id: a
            text: It levels off toward the floor L∞
          - id: c
            text: It falls by the same amount for each tenfold step
        answer: a
        feedback: The term a·N^(−α) shrinks toward zero, so the loss approaches L∞, the irreducible part. Each tenfold step multiplies the removable part by 10^(−0.2) ≈ 0.63, so the drops get smaller rather than staying equal.
      - id: scaling-and-memorization.base.v2.2
        prompt: Two power-law fits pass within 0.04 of all four measured losses but predict very different losses at a size 1,000 times larger. What is the most likely reason?
        options:
          - id: c
            text: One of the two fits contains an arithmetic mistake
          - id: b
            text: Power laws can't be fit on log–log axes at all
          - id: a
            text: The measured range doesn't pin down the floor L∞
        answer: a
        feedback: Over a short range, curves with different floors can look almost identical, yet the floor dominates far-off predictions. Both fits can be computed correctly; the data just can't choose between them.
      - id: scaling-and-memorization.base.v2.3
        prompt: You fit least-squares models of growing size to 200 noisy training examples. Around what size do you expect test error to peak?
        options:
          - id: a
            text: Near 200 parameters, where the model can just fit every example
          - id: b
            text: At the smallest model, which underfits the most
          - id: c
            text: At the largest model, which has the most room to overfit
        answer: a
        feedback: The peak sits at the interpolation threshold, where only one contorted fit passes through all 200 points. Larger models have many exact fits to choose from and can pick a smooth one, so error falls again.
      - id: scaling-and-memorization.base.v2.4
        prompt: Past the interpolation threshold, why can test error fall again as parameters are added?
        options:
          - id: b
            text: The extra parameters stop the model fitting training data exactly
          - id: a
            text: Among many exact fits, the method picks one with small weights
          - id: c
            text: The noise in the training labels shrinks as the model grows
        answer: a
        feedback: With more parameters than examples, many fits pass through every point, and the training method (here the smallest-weights solution) tends to choose a smooth one. The model still fits the training data exactly, and the label noise stays the same.
      - id: scaling-and-memorization.base.v2.5
        prompt: Following Chinchilla's rule of thumb, about how many training tokens should a 10-billion-parameter model see to use its compute optimally?
        options:
          - id: c
            text: About 10 billion, one token per parameter
          - id: a
            text: About 200 billion, twenty tokens per parameter
          - id: b
            text: About 2 trillion, two hundred tokens per parameter
        answer: a
        feedback: Hoffmann et al. found parameters and tokens should grow together, at roughly 20 tokens per parameter, so 20 × 10 billion = 200 billion. One token per parameter is close to the older, under-trained Gopher-style balance.
  - id: scaling-and-memorization.transfer.v2
    objective_ref: objective.scaling-and-memorization
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what the result was measured under, including the size range, the balance of data and parameters, and whether the test questions could have been in the training data.
    remediation_scene: scaling-and-memorization.s2
    variants:
      - id: scaling-and-memorization.transfer.v2.1
        prompt: 'A team has one fixed compute budget and three plans: 70B parameters on 100B tokens, 20B parameters on 350B tokens, or 5B parameters on 1.4T tokens. Which is closest to compute-optimal by the Chinchilla rule?'
        options:
          - id: b
            text: 70B parameters on 100B tokens
          - id: a
            text: 20B parameters on 350B tokens
          - id: c
            text: 5B parameters on 1.4T tokens
        answer: a
        feedback: 350B / 20B ≈ 17 tokens per parameter, close to 20. The 70B plan gives only about 1.4 tokens per parameter, and the 5B plan about 280, far past the compute-optimal balance (though it could make sense if running cost matters most).
      - id: scaling-and-memorization.transfer.v2.2
        prompt: A new model scores 92% on a math benchmark published three years ago but 61% on similar questions written last month. What is the most likely explanation?
        options:
          - id: a
            text: The older benchmark leaked into its training data
          - id: b
            text: The new questions must have been labeled wrongly
          - id: c
            text: It overfits to recent questions, not older ones
        answer: a
        feedback: A big drop on fresh but similar questions points to contamination, where the old test questions (or their answers) appeared in web training data. Mislabeling would be an odd explanation for a 31-point gap on similar questions.
      - id: scaling-and-memorization.transfer.v2.3
        prompt: A support chatbot trained on past tickets outputs another customer's home address when prompted with the start of an old ticket. Which test would have caught this before launch?
        options:
          - id: c
            text: Measuring accuracy on a larger held-out set of tickets
          - id: b
            text: Checking test loss for each size of the chatbot model
          - id: a
            text: Prompting with training-text openings and checking for verbatim copies
        answer: a
        feedback: An extraction test looks directly for memorized training text. A model can score well on held-out accuracy and loss while still storing and reproducing private records.
      - id: scaling-and-memorization.transfer.v2.4
        prompt: Your model's test error spikes when its parameter count gets close to the number of training examples. Which response fits what you now know?
        options:
          - id: b
            text: Conclude that bigger models hurt, and shrink the model
          - id: a
            text: Tune regularization, or move well away from that size
          - id: c
            text: Add label noise so the model can't fit the data
        answer: a
        feedback: A spike near the interpolation threshold is the double-descent peak. Regularization flattens it, and models well below or well above that size avoid it; the peak doesn't mean bigger is worse beyond it. Label noise makes the peak sharper.
  - id: scaling-and-memorization.calculate
    objective_ref: objective.scaling-and-memorization
    task: base
    response_type: numeric
    points: 1
    hint: Compute the shrinking part a·N^(−α) first, then add the floor L∞. Multiplying N by k multiplies the shrinking part by k^(−α).
    remediation_scene: scaling-and-memorization.s1
    absolute_tolerance: 0.005
    variants:
      - id: scaling-and-memorization.calculate.1
        prompt: A fitted law says L(N) = 10·N^(−0.5) + 1.5. What loss does it predict for N = 1,000,000 parameters?
        answer: 1.51
        feedback: 1,000,000^(−0.5) = 1/1,000, so 10/1,000 = 0.01, and 0.01 + 1.5 = 1.51.
      - id: scaling-and-memorization.calculate.2
        prompt: A fitted law says L(N) = 8·N^(−0.5) + 2. What loss does it predict for N = 10,000?
        answer: 2.08
        feedback: 10,000^(−0.5) = 1/100, so 8/100 = 0.08, and 0.08 + 2 = 2.08.
      - id: scaling-and-memorization.calculate.3
        prompt: A model's loss is 2.0, of which the floor L∞ is 1.6 and the rest shrinks as N^(−0.5). What loss does the law predict for a model 4 times larger?
        answer: 1.8
        feedback: The shrinking part is 0.4, and 4^(−0.5) = 0.5, so it becomes 0.2. Adding the floor gives 1.6 + 0.2 = 1.8.
      - id: scaling-and-memorization.calculate.4
        prompt: A model's loss is 2.6, of which the floor L∞ is 2.0 and the rest shrinks as N^(−0.25). What loss does the law predict for a model 16 times larger?
        answer: 2.3
        feedback: The shrinking part is 0.6, and 16^(−0.25) = 0.5, so it becomes 0.3. Adding the floor gives 2.0 + 0.3 = 2.3.
      - id: scaling-and-memorization.calculate.5
        prompt: Using the lesson's law L(N) = 12·N^(−0.2) + 1.8, what loss does it predict at N = 10^10 parameters?
        answer: 1.92
        feedback: (10^10)^(−0.2) = 10^(−2) = 0.01, so 12 × 0.01 = 0.12, and 0.12 + 1.8 = 1.92.
