schema_version: 0.2-draft
lesson:
  id: controlled-experiments
  version: 0.4.0-draft
  title: Change one thing and measure what follows
  state: draft
  summary: Version 2 of a math tutor solves 78% of problems instead of 71%. Was it the new prompt, the bigger model, or luck? Design the experiment that tells you, and put error bars on it.
  slot: M09.6
  category: learning
  sources:
    - title: An Introduction to Statistical Learning — authors’ materials
      url: https://www.statlearning.com/
    - title: "An Introduction to the Bootstrap (Efron & Tibshirani, 1993)"
      url: https://doi.org/10.1201/9780429246593
objectives:
  - id: objective.controlled-experiments
    version: 2-draft
    statement: Ablations, controls, paired comparisons, and uncertainty estimates help identify which changes explain a result, while confounding and selection limit causal interpretation.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - controlled-experiments.base.v2
      - controlled-experiments.transfer.v2
      - controlled-experiments.calculate
    prerequisites:
      - anyOf:
          - objective.statistics-evidence
      - anyOf:
          - objective.evaluation-selection
scenes:
  - id: controlled-experiments.s1
    title: Two changes, one result, no answer
    type: explanation
    depth: intuition
    objective_refs:
      - objective.controlled-experiments
    markdown: |-
      A team builds a tutor that solves grade-school math word problems. Version 1 solves 71% of a 500-problem test set. Version 2 solves 78%. The team credits its new prompt, which tells the model to "work step by step."

      But version 2 also switched to a larger model. With two changes at once, the effects are **confounded**: the data can't say which change produced the gain. The fix is an **ablation**, a run that adds or removes one component while everything else stays fixed, compared against a **control**, the run without that change. With two changes, run all four combinations on the same 500 problems:

      | | Plain prompt | Step-by-step prompt |
      | --- | ---: | ---: |
      | Small model | 71% (control) | 74% |
      | Large model | 75% | 78% |

      :::predict How much of the 7-point gain comes from the prompt?
      About 3 points. With the small model, the prompt adds 74 − 71 = 3; with the large model, 78 − 75 = 3. The model upgrade adds 4 either way. Here the effects simply add up. When they don't, say the prompt helps the small model but not the large one, the changes **interact**, and only this full grid would reveal it.
      :::

      "Everything else fixed" means the same problems, the same scoring script, the same sampling settings, and a fair tuning effort for every row. Anything that differs between two runs is a rival explanation for the gap.
    bridges:
      - statistics-evidence
  - id: controlled-experiments.s2
    title: How sure is 74% on 500 problems?
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.controlled-experiments
    markdown: |-
      The tutor with the new prompt solved 370 of 500 problems, or 74%. On a different 500 problems from the same source it might score 72% or 77%. A **confidence interval** gives the range of true accuracies consistent with what you saw. (The statistics lesson covers what the 95% does and doesn't mean.)

      For an accuracy $\hat p$ on $n$ independent problems, the **standard error** (the typical wobble of the estimate) is $\sqrt{\hat p(1-\hat p)/n}$, and the normal approximation gives a 95% interval of

      $$\hat p \pm 1.96\sqrt{\frac{\hat p(1-\hat p)}{n}} = 0.74 \pm 1.96\sqrt{\frac{0.74 \times 0.26}{500}} = 0.74 \pm 0.038$$

      so roughly 70% to 78%. To halve that width you need four times as many problems, because $n$ sits under a square root.

      The **bootstrap** gets the same answer without a formula: resample the 500 problems with replacement, recompute accuracy, repeat thousands of times, and read off the middle 95% of the results.

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      correct = np.array([1] * 370 + [0] * 130)   # new tutor: 370 of 500 right
      n = len(correct)
      p = correct.mean()

      se = np.sqrt(p * (1 - p) / n)
      print(f"accuracy {p:.3f}, standard error {se:.4f}")
      print(f"normal-approximation 95% CI: [{p - 1.96 * se:.3f}, {p + 1.96 * se:.3f}]")

      # Bootstrap: resample the 500 problems with replacement, 10,000 times
      boots = rng.choice(correct, size=(10000, n)).mean(axis=1)
      low, high = np.percentile(boots, [2.5, 97.5])
      print(f"bootstrap 95% CI:            [{low:.3f}, {high:.3f}]")
      ```

      Both methods give [0.702, 0.778]. The bootstrap earns its keep for statistics with no neat formula, such as a median, an F1 score, or a difference between two systems. Change `370` and `130` to `37` and `13` (the same 74% on 50 problems) and watch the interval widen to about ±12 points.
  - id: controlled-experiments.s3
    title: Pair the problems, and the noise cancels
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.controlled-experiments
    markdown: |-
      Is the prompt's 3-point gain (71% to 74% on the small model) real? Both versions answered the *same* 500 problems, so compare them problem by problem:

      | | New prompt right | New prompt wrong |
      | --- | ---: | ---: |
      | **Old prompt right** | 340 | 15 |
      | **Old prompt wrong** | 30 | 115 |

      Most problems are easy for both (340) or hard for both (115). They say nothing about the prompt. The evidence is in the 45 problems where the versions disagree: the new prompt won 30 and lost 15, a net gain of 15/500 = 3 points.

      A **paired comparison** uses this structure. It resamples whole problems, keeping both versions' results together, so the shared easy and hard problems cancel out. An unpaired comparison treats the two sets of scores as unrelated, and their problem-to-problem difficulty swamps the signal.

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      # One row per problem: (old tutor right?, new tutor right?)
      counts = {(1, 1): 340, (0, 1): 30, (1, 0): 15, (0, 0): 115}
      old = np.repeat([k[0] for k in counts], list(counts.values()))
      new = np.repeat([k[1] for k in counts], list(counts.values()))
      n = len(old)
      print(f"old {old.mean():.3f}   new {new.mean():.3f}   difference {new.mean() - old.mean():+.3f}")

      # Unpaired: resample each tutor's results separately
      unpaired = [rng.choice(new, n).mean() - rng.choice(old, n).mean() for _ in range(5000)]
      # Paired: resample whole problems, keeping both results together
      paired = []
      for _ in range(5000):
          idx = rng.integers(0, n, n)
          paired.append(new[idx].mean() - old[idx].mean())

      for name, diffs in [("unpaired", unpaired), ("paired", paired)]:
          low, high = np.percentile(diffs, [2.5, 97.5])
          print(f"{name:8s} 95% CI for the difference: [{low:+.3f}, {high:+.3f}]")
      ```

      The same data give an unpaired interval of −2.6 to +8.6 points, which includes zero, and a paired interval of +0.4 to +5.6 points, which doesn't. Pairing didn't add data; it stopped throwing information away. The classic test for this 2×2 layout is **McNemar's test**, which looks only at the 30 and the 15: $(30-15)^2/(30+15) = 5.0$, which gives p ≈ 0.025, agreeing with the paired interval.

      :::mixup "The two 95% intervals overlap, so the difference isn't real."
      The old prompt's own interval is 67% to 75%, and the new one's is 70% to 78%. They overlap, yet the paired interval for the difference excludes zero. Overlapping separate intervals is the wrong test. Build the interval for the difference itself, paired when the cases are shared.
      :::
    bridges: []
  - id: controlled-experiments.s4
    title: Decide the analysis before you see the result
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.controlled-experiments
    markdown: |-
      Suppose the prompt had shown no overall gain. It's tempting to slice the results until something shines: problems with fractions, problems over 50 words, the large model only. Try 20 slices and, by chance alone, about one will look significant at the 5% level. That's a false discovery, not a finding.

      **Preregistering** means writing down the question, the comparison, the metric, and the analysis before running the experiment. The tutor team's note fits in three lines: "Compare step-by-step vs plain prompt on the small model, same 500 problems, same sampling settings. Paired bootstrap 95% CI on the accuracy difference. Any slice analysis is exploratory and will be retested on fresh problems."

      Two more habits make the result trustworthy:

      - **Rerun with different random seeds.** If generation involves sampling, a second run can shift accuracy by a point or two. Three to five seeds per configuration show how much.
      - **Keep the per-problem results,** not just the averages. They are what made the paired analysis possible, and they let a skeptical colleague check your work.
    bridges: []
  - id: controlled-experiments.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.controlled-experiments
    markdown: A spam filter's new feature, a translation model's two upgrades, and a 2×2 table of wins and losses ask you to design the ablation, build an interval, and pick the paired comparison.
    takeaway: |-
      Change one thing at a time against a control run on the same cases. Put a confidence interval on the difference itself, paired when both versions saw the same cases, and fix the analysis before looking.
  - id: controlled-experiments.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.controlled-experiments
    markdown: |-
      A fair experiment isolates the change being tested. Keep per-case results and uncertainty so an average improvement does not hide failures or competing explanations.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - controlled-experiments.s1
        - controlled-experiments.s2
        - controlled-experiments.s3
        - controlled-experiments.s4
        - controlled-experiments.check
      gate_refs:
        - gate.core
  scene_aliases:
    controlled-experiments.recap: controlled-experiments.check
assessment_families:
  - id: controlled-experiments.base
    objective_ref: objective.controlled-experiments
    task: base
    response_type: single_choice
    points: 1
    hint: 'Use an ablation with a fair control: trace the inputs, operation, and result before choosing.'
    remediation_scene: controlled-experiments.s2
    variants:
      - id: controlled-experiments.base.1
        prompt: What is an ablation?
        options:
          - id: a
            text: A comparison that removes or changes a component to study its contribution
          - id: b
            text: Only a new model name
          - id: c
            text: A guarantee that all other conditions stay equal without checking
        answer: a
        feedback: Ablation design needs explicit controls and interpretation.
        retired: true
      - id: controlled-experiments.base.2
        prompt: Differences [2, 0, −1, 3] average to what?
        options:
          - id: b
            text: '4'
          - id: c
            text: '0.5'
          - id: a
            text: '1'
        answer: a
        feedback: The differences sum to 4 over four cases.
        retired: true
  - id: controlled-experiments.transfer
    objective_ref: objective.controlled-experiments
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Separate an effect from an explanation: trace the inputs, operation, and result before choosing.'
    remediation_scene: controlled-experiments.s4
    variants:
      - id: controlled-experiments.transfer.1
        prompt: Two systems differ in architecture, data, and compute. Can one comparison isolate architecture’s effect?
        options:
          - id: b
            text: Yes; architecture receives all credit
          - id: c
            text: Only if the final score is high
          - id: a
            text: Not without further controls or assumptions
        answer: a
        feedback: Multiple changes confound the attribution.
        retired: true
      - id: controlled-experiments.transfer.2
        prompt: An ablation works at toy scale. What remains to establish?
        options:
          - id: c
            text: That a comparison was made
          - id: a
            text: Whether the effect and mechanism transfer to other conditions
          - id: b
            text: That the toy observation occurred
        answer: a
        feedback: A controlled local result is not a universal scaling guarantee.
        retired: true
  - id: controlled-experiments.base.v2
    objective_ref: objective.controlled-experiments
    task: base
    response_type: single_choice
    points: 1
    hint: List everything that differs between the two runs besides the change you care about, and check whether both versions were scored on the same cases.
    remediation_scene: controlled-experiments.s1
    variants:
      - id: controlled-experiments.base.v2.1
        prompt: A new spam-filter version adds a sender-reputation feature and is also trained on three times more email. It catches 6% more spam. What can you say about the new feature?
        options:
          - id: b
            text: It accounts for the 6-point gain, since it was the planned change
          - id: c
            text: It accounts for none of it, since more data explains the gain
          - id: a
            text: Its share is unknown until it's tested with the data held fixed
        answer: a
        feedback: Two changes at once are confounded, so either (or both) could explain the gain. Adding the feature alone, with the same training data, isolates its effect.
      - id: controlled-experiments.base.v2.2
        prompt: 'An ablation grid gives: neither change 60%, change A only 66%, change B only 62%, both 68%. What is the effect of change A?'
        options:
          - id: a
            text: About +6 points, with or without B
          - id: b
            text: About +8 points, from 60% to 68%
          - id: c
            text: About +2 points, from 66% to 68%
        answer: a
        feedback: A adds 66 − 60 = 6 without B and 68 − 62 = 6 with B. The 8-point jump from 60 to 68 includes B's contribution, and 66 to 68 is B's effect on top of A.
      - id: controlled-experiments.base.v2.3
        prompt: 'An ablation grid gives: neither change 60%, A only 66%, B only 62%, both 62%. What does this show?'
        options:
          - id: c
            text: The effects add up, so A is worth 6 points
          - id: a
            text: A and B interact, since A helps alone but not with B
          - id: b
            text: B hurts in every setting, so it should be dropped
        answer: a
        feedback: A adds 6 points without B but 0 with B, so its effect depends on B, which is an interaction. B actually helps slightly on its own (60 to 62), so it isn't harmful in every setting.
      - id: controlled-experiments.base.v2.4
        prompt: On the same 400 questions, both versions were right on 250 and wrong on 110. The new version alone was right on 20, and the old version alone on 20. What does the paired view show?
        options:
          - id: b
            text: The new version is better, since it solved 20 new questions
          - id: a
            text: No net difference, since each version won 20 of the 40 splits
          - id: c
            text: The old version is better, since it kept 250 of its answers
        answer: a
        feedback: Only the 40 questions where they disagree carry information, and those split 20–20, so the net difference is zero. Looking at the new version's 20 wins without its 20 losses tells half the story.
      - id: controlled-experiments.base.v2.5
        prompt: Model A's 95% interval is 80% to 86% and model B's is 83% to 89%, both on the same 1,000 test cases. A colleague says the overlap means there's no real difference. What is the better response?
        options:
          - id: c
            text: Agree, since overlapping intervals rule out a real difference
          - id: b
            text: Disagree, since B's upper end is higher than A's
          - id: a
            text: Build a paired interval for the difference itself
        answer: a
        feedback: Overlapping separate intervals is the wrong test; a paired interval on the difference can exclude zero even when they overlap. Comparing upper ends isn't a test at all.
  - id: controlled-experiments.transfer.v2
    objective_ref: objective.controlled-experiments
    task: transfer
    response_type: single_choice
    points: 1
    hint: Design it before running it. One change against a control, the same cases for both, an interval on the difference, several seeds, and the analysis written down first.
    remediation_scene: controlled-experiments.s3
    variants:
      - id: controlled-experiments.transfer.v2.1
        prompt: A translation team plans two upgrades, a new tokenizer and more training data, and wants to know what each contributes. Which design answers that?
        options:
          - id: b
            text: Compare the fully upgraded model with the old one
          - id: a
            text: Run all four combinations on the same test sentences
          - id: c
            text: Test each upgrade on its own separate test set
        answer: a
        feedback: The full grid isolates each change and reveals any interaction, and a shared test set keeps the comparison fair. Old-versus-new confounds the two changes, and different test sets add their own differences.
      - id: controlled-experiments.transfer.v2.2
        prompt: A new retrieval step scores 81% against 79% on the same 200 questions, winning 12 and losing 8 of the questions where they differ. Which analysis fits best?
        options:
          - id: c
            text: Compare each version's separate 95% interval for overlap
          - id: b
            text: Resample each version's 200 results independently
          - id: a
            text: Resample whole questions, keeping both results together
        answer: a
        feedback: Both versions saw the same questions, so a paired bootstrap (or McNemar's test) uses that structure and cancels shared difficulty. Independent resampling and overlapping intervals throw that information away.
      - id: controlled-experiments.transfer.v2.3
        prompt: A change shows no overall gain. After checking 25 slices, the team finds one ("questions that start with 'why'") where the new version wins clearly. How should they treat it?
        options:
          - id: a
            text: As a lead to retest on fresh questions
          - id: b
            text: As the headline result of the study
          - id: c
            text: As proof the change works for 'why' questions
        answer: a
        feedback: With 25 slices, about one will look significant at the 5% level by chance. A slice found by searching is exploratory; a fresh test decides whether it's real.
      - id: controlled-experiments.transfer.v2.4
        prompt: A fine-tuned model beats its baseline by 0.4 points, with one run each. Changing the random seed moves either model's score by about a point. What is the best next step?
        options:
          - id: b
            text: Report the 0.4-point gain along with the seed used
          - id: a
            text: Run several seeds of each and compare the spreads
          - id: c
            text: Try seeds until the gap is at its clearest, then report
        answer: a
        feedback: A 0.4-point gap is smaller than the seed-to-seed wobble, so one run each can't separate the models. Picking the seed that looks best is selection, which inflates the gap.
  - id: controlled-experiments.calculate
    objective_ref: objective.controlled-experiments
    task: base
    response_type: numeric
    points: 1
    hint: The 95% half-width is 1.96 × √(p(1 − p)/n). Compute p(1 − p), divide by n, take the square root, then multiply by 1.96.
    remediation_scene: controlled-experiments.s2
    absolute_tolerance: 0.002
    variants:
      - id: controlled-experiments.calculate.1
        prompt: A model solves 370 of 500 problems (p = 0.74). Using the normal approximation, what is the half-width of its 95% confidence interval? Give a decimal.
        answer: 0.0384
        feedback: √(0.74 × 0.26 / 500) = 0.0196, and 1.96 × 0.0196 = 0.038.
      - id: controlled-experiments.calculate.2
        prompt: A classifier is 90% accurate on 400 test images. Using the normal approximation, what is the half-width of its 95% confidence interval? Give a decimal.
        answer: 0.0294
        feedback: √(0.9 × 0.1 / 400) = 0.015, and 1.96 × 0.015 = 0.0294.
      - id: controlled-experiments.calculate.3
        prompt: A model gets 50 of 100 questions right. Using the normal approximation, what is the half-width of its 95% confidence interval? Give a decimal.
        answer: 0.098
        feedback: √(0.5 × 0.5 / 100) = 0.05, and 1.96 × 0.05 = 0.098, almost 10 points either way.
      - id: controlled-experiments.calculate.4
        prompt: A model is 80% accurate on 1,600 test cases. Using the normal approximation, what is the half-width of its 95% confidence interval? Give a decimal.
        answer: 0.0196
        feedback: √(0.8 × 0.2 / 1,600) = 0.01, and 1.96 × 0.01 = 0.0196.
      - id: controlled-experiments.calculate.5
        prompt: A model is 60% accurate on 600 test cases. Using the normal approximation, what is the half-width of its 95% confidence interval? Give a decimal.
        answer: 0.0392
        feedback: √(0.6 × 0.4 / 600) = 0.02, and 1.96 × 0.02 = 0.0392.
