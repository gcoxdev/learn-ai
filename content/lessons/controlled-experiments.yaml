schema_version: 0.2-draft
lesson:
  id: controlled-experiments
  version: 0.3.0-draft
  title: Change one thing and measure what follows
  state: draft
  summary: Design a fair comparison to find out whether one change actually helped.
  slot: M09.6
  category: learning
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.controlled-experiments
  version: 1-draft
  statement: Ablations, controls, paired comparisons, and uncertainty estimates help identify which changes
    explain a result, while confounding and selection limit causal interpretation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - controlled-experiments.base
  - controlled-experiments.transfer
  prerequisites:
  - anyOf:
    - objective.statistics-evidence
  - anyOf:
    - objective.evaluation-selection
scenes:
- id: controlled-experiments.s1
  title: Ask a precise experimental question
  type: explanation
  depth: intuition
  objective_refs:
  - objective.controlled-experiments
  markdown: “Does adding retrieval improve answers on this task?” is more testable than “is the new system
    better?” Define the population, metric, system condition, and comparison. Hold relevant settings stable
    so the observed difference can be attributed to the intended change with appropriate caution.
  text_mode: “Does adding retrieval improve answers on this task?” is more testable than “is the new system
    better?” Define the population, metric, system condition, and comparison. Hold relevant settings stable
    so the observed difference can be attributed to the intended change with appropriate caution.
  bridges: []
- id: controlled-experiments.s2
  title: Change one component against a fair control
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.controlled-experiments
  markdown: 'An **ablation** removes or changes a component to test its contribution. The **control** is the
    comparison condition. If retrieval is added at the same time as a larger model, the changes are **confounded**:
    either could explain an improvement.


    To investigate retrieval, compare versions that differ in retrieval while keeping relevant data, budget,
    and evaluation conditions comparable. Removing a component can itself change resource use or training behavior,
    so state what was held equal. Give the comparison version a fair tuning effort too.'
  text_mode: 'An **ablation** removes or changes a component to test its contribution. The **control** is the
    comparison condition. If retrieval is added at the same time as a larger model, the changes are **confounded**:
    either could explain an improvement.


    To investigate retrieval, compare versions that differ in retrieval while keeping relevant data, budget,
    and evaluation conditions comparable. Removing a component can itself change resource use or training behavior,
    so state what was held equal. Give the comparison version a fair tuning effort too.'
  bridges:
  - statistics-evidence
- id: controlled-experiments.s3
  title: Compare both systems on the same cases
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.controlled-experiments
  markdown: 'A **paired difference** compares two systems on the same case: subtract the old score from the
    new score. Differences of +1, −1, +1, and +1 sum to 2 across four cases, giving an average improvement
    of 0.5 score units.


    Keep the individual results too: one case got worse despite the positive average. Uncertainty depends on
    how many cases were tested and how independent they are. Pairing preserves information that would be lost
    by treating the two sets of scores as unrelated.'
  text_mode: 'A **paired difference** compares two systems on the same case: subtract the old score from the
    new score. Differences of +1, −1, +1, and +1 sum to 2 across four cases, giving an average improvement
    of 0.5 score units.


    Keep the individual results too: one case got worse despite the positive average. Uncertainty depends on
    how many cases were tested and how independent they are. Pairing preserves information that would be lost
    by treating the two sets of scores as unrelated.'
  bridges: []
- id: controlled-experiments.s4
  title: Separate an effect from an explanation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.controlled-experiments
  markdown: 'A controlled difference supports a claim about the tested intervention under that setup. It may
    not reveal the internal mechanism or transfer to every scale. Report negative results, confidence intervals
    or other justified uncertainty, and alternative explanations. Preregistering key comparisons can reduce
    flexibility in selecting a favorable story.


    **Preregistering** means recording the main question, comparison and analysis before examining the results.
    It limits the temptation to try many stories and report only the one that looks convincing. Exploratory
    findings are still useful; label them as discoveries to test with new evidence.'
  text_mode: 'A controlled difference supports a claim about the tested intervention under that setup. It may
    not reveal the internal mechanism or transfer to every scale. Report negative results, confidence intervals
    or other justified uncertainty, and alternative explanations. Preregistering key comparisons can reduce
    flexibility in selecting a favorable story.


    **Preregistering** means recording the main question, comparison and analysis before examining the results.
    It limits the temptation to try many stories and report only the one that looks convincing. Exploratory
    findings are still useful; label them as discoveries to test with new evidence.'
  bridges: []
- id: controlled-experiments.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.controlled-experiments
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A fair experiment isolates the change being tested. Keep per-case results and uncertainty so an
    average improvement does not hide failures or competing explanations.
- id: controlled-experiments.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.controlled-experiments
  markdown: A fair experiment isolates the change being tested. Keep per-case results and uncertainty so an
    average improvement does not hide failures or competing explanations.
  text_mode: A fair experiment isolates the change being tested. Keep per-case results and uncertainty so an
    average improvement does not hide failures or competing explanations.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - controlled-experiments.s1
    - controlled-experiments.s2
