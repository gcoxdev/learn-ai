schema_version: 0.2-draft
lesson:
  id: controlled-experiments
  version: 0.1.0-draft
  title: Change one thing and measure what follows
  state: draft
  summary: Ablations, controls, paired comparisons, and uncertainty estimates help identify which changes explain
    a result, while confounding and selection limit causal interpretation.
  slot: M09.6
  category: learning
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.controlled-experiments
  version: 1-draft
  statement: Ablations, controls, paired comparisons, and uncertainty estimates help identify which changes explain
    a result, while confounding and selection limit causal interpretation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - controlled-experiments.base
  - controlled-experiments.transfer
  prerequisites:
  - anyOf:
    - objective.statistics-evidence
  - anyOf:
    - objective.evaluation-selection
scenes:
- id: controlled-experiments.s1
  title: Ask a precise experimental question
  type: explanation
  depth: intuition
  objective_refs:
  - objective.controlled-experiments
  markdown: “Does adding retrieval improve answers on this task?” is more testable than “is the new system better?”
    Define the population, metric, system condition, and comparison. Hold relevant settings stable so the observed
    difference can be attributed to the intended change with appropriate caution.
  text_mode: “Does adding retrieval improve answers on this task?” is more testable than “is the new system better?”
    Define the population, metric, system condition, and comparison. Hold relevant settings stable so the observed
    difference can be attributed to the intended change with appropriate caution.
  bridges: []
- id: controlled-experiments.s2
  title: Use an ablation with a fair control
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.controlled-experiments
  markdown: Compare a system with and without one component while keeping data, budget, and evaluation consistent
    where possible. Removing a component can also change compute or training dynamics, so state what was held equal.
    A poorly tuned ablated baseline can exaggerate the component’s apparent benefit.
  text_mode: Compare a system with and without one component while keeping data, budget, and evaluation consistent
    where possible. Removing a component can also change compute or training dynamics, so state what was held equal.
    A poorly tuned ablated baseline can exaggerate the component’s apparent benefit.
  bridges:
  - statistics-evidence
- id: controlled-experiments.s3
  title: Pair cases when the design allows it
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.controlled-experiments
  markdown: If two systems answer the same test cases, compare their per-case differences rather than treating the
    samples as unrelated. In a toy set, improvements [+1, −1, +1, +1] average to +0.5 in the chosen score units.
    Uncertainty still depends on the number and dependence of cases.
  text_mode: If two systems answer the same test cases, compare their per-case differences rather than treating
    the samples as unrelated. In a toy set, improvements [+1, −1, +1, +1] average to +0.5 in the chosen score units.
    Uncertainty still depends on the number and dependence of cases.
  bridges: []
- id: controlled-experiments.s4
  title: Separate an effect from an explanation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.controlled-experiments
  markdown: A controlled difference supports a claim about the tested intervention under that setup. It may not
    reveal the internal mechanism or transfer to every scale. Report negative results, confidence intervals or other
    justified uncertainty, and alternative explanations. Preregistering key comparisons can reduce flexibility in
    selecting a favorable story.
  text_mode: A controlled difference supports a claim about the tested intervention under that setup. It may not
    reveal the internal mechanism or transfer to every scale. Report negative results, confidence intervals or other
    justified uncertainty, and alternative explanations. Preregistering key comparisons can reduce flexibility in
    selecting a favorable story.
  bridges: []
- id: controlled-experiments.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.controlled-experiments
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Ablations, controls, paired comparisons, and uncertainty estimates help identify which changes explain
    a result, while confounding and selection limit causal interpretation.
- id: controlled-experiments.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.controlled-experiments
  markdown: Ablations, controls, paired comparisons, and uncertainty estimates help identify which changes explain
    a result, while confounding and selection limit causal interpretation.
  text_mode: Ablations, controls, paired comparisons, and uncertainty estimates help identify which changes explain
    a result, while confounding and selection limit causal interpretation.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - controlled-experiments.s1
    - controlled-experiments.s2
    - controlled-experiments.s3
    - controlled-experiments.s4
    - controlled-experiments.check
    gate_refs:
    - gate.core
  scene_aliases:
    controlled-experiments.recap: controlled-experiments.check
assessment_families:
- id: controlled-experiments.base
  objective_ref: objective.controlled-experiments
  task: base
  response_type: single_choice
  points: 1
  hint: 'Use an ablation with a fair control: trace the inputs, operation, and result before choosing.'
  remediation_scene: controlled-experiments.s2
  variants:
  - id: controlled-experiments.base.1
    prompt: What is an ablation?
    options:
    - id: a
      text: A comparison that removes or changes a component to study its contribution
    - id: b
      text: Only a new model name
    - id: c
      text: A guarantee that all other conditions stay equal without checking
    answer: a
    feedback: Ablation design needs explicit controls and interpretation.
  - id: controlled-experiments.base.2
    prompt: Differences [2, 0, −1, 3] average to what?
    options:
    - id: b
      text: '4'
    - id: c
      text: '0.5'
    - id: a
      text: '1'
    answer: a
    feedback: The differences sum to 4 over four cases.
- id: controlled-experiments.transfer
  objective_ref: objective.controlled-experiments
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Separate an effect from an explanation: trace the inputs, operation, and result before choosing.'
  remediation_scene: controlled-experiments.s4
  variants:
  - id: controlled-experiments.transfer.1
    prompt: Two systems differ in architecture, data, and compute. Can one comparison isolate architecture’s effect?
    options:
    - id: b
      text: Yes; architecture receives all credit
    - id: c
      text: Only if the final score is high
    - id: a
      text: Not without further controls or assumptions
    answer: a
    feedback: Multiple changes confound the attribution.
  - id: controlled-experiments.transfer.2
    prompt: An ablation works at toy scale. What remains to establish?
    options:
    - id: c
      text: That a comparison was made
    - id: a
      text: Whether the effect and mechanism transfer to other conditions
    - id: b
      text: That the toy observation occurred
    answer: a
    feedback: A controlled local result is not a universal scaling guarantee.
