scenes:
- id: processors-and-parallelism.s1
  title: Different processors favor different work
  type: explanation
  depth: intuition
  objective_refs:
  - objective.processors-and-parallelism
  markdown: CPUs handle varied control flow and general-purpose tasks. GPUs provide many execution lanes suited
    to large regular numerical workloads. Other accelerators specialize further. These are tendencies, not a rule
    that one processor always beats another. Small or irregular tasks can be dominated by overhead.
  text_mode: CPUs handle varied control flow and general-purpose tasks. GPUs provide many execution lanes suited
    to large regular numerical workloads. Other accelerators specialize further. These are tendencies, not a rule
    that one processor always beats another. Small or irregular tasks can be dominated by overhead.
  bridges: []
- id: processors-and-parallelism.s2
  title: A matrix product exposes parallel work
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.processors-and-parallelism
  markdown: Many output entries of a matrix product can be computed from different row-column combinations. Reusing
    blocks of input values can reduce memory traffic. Specialized units may accelerate supported data types and
    shapes, but the software must arrange work so the hardware can use them effectively.
  text_mode: Many output entries of a matrix product can be computed from different row-column combinations. Reusing
    blocks of input values can reduce memory traffic. Specialized units may accelerate supported data types and
    shapes, but the software must arrange work so the hardware can use them effectively.
  bridges:
  - algorithm-cost
- id: processors-and-parallelism.s3
  title: Account for transfer and waiting
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.processors-and-parallelism
  markdown: Moving a small task to an accelerator takes time. If transfer and launch cost 5 milliseconds and the
    accelerated calculation takes 1 millisecond, total time is at least 6 milliseconds before other overhead. A
    3-millisecond CPU implementation is faster for this hypothetical workload, even if the accelerator has higher
    peak arithmetic throughput.
  text_mode: Moving a small task to an accelerator takes time. If transfer and launch cost 5 milliseconds and the
    accelerated calculation takes 1 millisecond, total time is at least 6 milliseconds before other overhead. A
    3-millisecond CPU implementation is faster for this hypothetical workload, even if the accelerator has higher
    peak arithmetic throughput.
  bridges: []
- id: processors-and-parallelism.s4
  title: Compare measured workloads
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.processors-and-parallelism
  markdown: Report batch size, precision, input lengths, memory use, and the metric being timed. Peak FLOPs describe
    a hardware arithmetic ceiling under specified conditions. Utilization and bandwidth determine how closely an
    application approaches useful throughput. A faster processor cannot repair an incorrect model or missing evaluation.
  text_mode: Report batch size, precision, input lengths, memory use, and the metric being timed. Peak FLOPs describe
    a hardware arithmetic ceiling under specified conditions. Utilization and bandwidth determine how closely an
    application approaches useful throughput. A faster processor cannot repair an incorrect model or missing evaluation.
  bridges: []
