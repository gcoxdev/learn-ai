    remediation_scene: processors-and-parallelism.s4
    variants:
      - id: processors-and-parallelism.transfer.1
        prompt: An accelerator advertises twice the peak FLOPs. Must inference latency halve?
        options:
          - id: b
            text: Yes; peak arithmetic determines every workload
          - id: c
            text: Only if the output is text
          - id: a
            text: No; memory, overhead, shapes, and utilization matter
        answer: a
        feedback: A peak specification is not an application benchmark.
        retired: true
      - id: processors-and-parallelism.transfer.2
        prompt: A tiny GPU task is slower than a CPU task. What should diagnosis include?
        options:
          - id: c
            text: An assumption that all measurements are impossible
          - id: a
            text: Launch and transfer overhead relative to useful work
          - id: b
            text: Only parameter names
        answer: a
        feedback: Fixed overhead can dominate small workloads.
        retired: true
  - id: processors-and-parallelism.base.v2
    objective_ref: objective.processors-and-parallelism
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: processors-and-parallelism.s3
    variants:
      - prompt: A job has 2 seconds of serial work and 6 seconds of perfectly divisible parallel work on one worker. With 3 workers and no overhead, calculate parallel time, total time, and speedup over one worker.
        answers:
          parallel: 2.0
          total: 4.0
          speedup: 2.0
        reason_answer: a
        reason_options:
          - id: a
            text: Divide only the parallel part by workers, add the serial time, then divide old total by new total.
          - id: b
            text: Divide the whole job, including its serial part, by workers.
          - id: c
            text: Multiply the serial time by the worker count.
        feedback: Parallel time is 6/3; total adds 2; speedup compares the original 8 seconds with that total.
        id: processors-and-parallelism.base.v2.1
        retired: true
      - prompt: A job has 1 seconds of serial work and 9 seconds of perfectly divisible parallel work on one worker. With 3 workers and no overhead, calculate parallel time, total time, and speedup over one worker.
        answers:
          parallel: 3.0
          total: 4.0
          speedup: 2.5
        reason_answer: a
        reason_options:
          - id: b
            text: Divide the whole job, including its serial part, by workers.
          - id: c
            text: Multiply the serial time by the worker count.
          - id: a
            text: Divide only the parallel part by workers, add the serial time, then divide old total by new total.
        feedback: Parallel time is 9/3; total adds 1; speedup compares the original 10 seconds with that total.
        id: processors-and-parallelism.base.v2.2
        retired: true
      - prompt: A job has 4 seconds of serial work and 20 seconds of perfectly divisible parallel work on one worker. With 5 workers and no overhead, calculate parallel time, total time, and speedup over one worker.
        answers:
          parallel: 4
          total: 8
          speedup: 3
        reason_answer: a
        reason_options:
          - id: c
            text: Multiply the serial time by the worker count.
          - id: a
            text: Divide only the parallel part by workers, add the serial time, then divide old total by new total.
          - id: b
            text: Divide the whole job, including its serial part, by workers.
        feedback: Parallel time is 20/5 = 4; total time is 4 + 4 = 8; speedup is 24/8 = 3.
        id: processors-and-parallelism.base.v2.3
        retired: true
      - prompt: A job has 3 seconds of serial work and 6 seconds of perfectly divisible parallel work on one worker. With 2 workers and no overhead, calculate parallel time, total time, and speedup over one worker.
        answers:
          parallel: 3.0
          total: 6.0
          speedup: 1.5
        reason_answer: a
        reason_options:
          - id: a
            text: Divide only the parallel part by workers, add the serial time, then divide old total by new total.
          - id: b
            text: Divide the whole job, including its serial part, by workers.
          - id: c
            text: Multiply the serial time by the worker count.
        feedback: Parallel time is 6/2; total adds 3; speedup compares the original 9 seconds with that total.
        id: processors-and-parallelism.base.v2.4
        retired: true
    numeric_fields:
      - id: parallel
        label: Parallel time in seconds
      - id: total
        label: Total time in seconds
      - id: speedup
        label: Speedup factor
    absolute_tolerance: 1e-6
  - id: processors-and-parallelism.transfer.v2
    objective_ref: objective.processors-and-parallelism
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: processors-and-parallelism.s4
    variants:
      - prompt: A profile shows arithmetic units mostly waiting for values from memory. Which change directly targets that observed limit?
        answer: a
        options:
          - id: a
            text: Reduce repeated data transfers through reuse.
          - id: b
            text: Add arithmetic units while leaving data delivery unchanged.
          - id: c
            text: Measure only the fastest arithmetic instruction.
        feedback: The observed bottleneck is delivery of data, not the supply of arithmetic units.
        id: processors-and-parallelism.transfer.v2.1
        retired: true
      - prompt: A batch completes four requests in two seconds after each waits three seconds for the batch. What does each request’s five seconds describe?
        answer: a
        options:
          - id: b
            text: Processing throughput in requests per second.
          - id: c
            text: The number of parallel workers.
          - id: a
            text: End-to-end latency including the wait.
        feedback: Latency includes the request’s wait and processing; throughput counts completions per unit time.
        id: processors-and-parallelism.transfer.v2.2
        retired: true
      - prompt: Why can a later model layer not use an earlier layer’s output before it exists?
        answer: a
        options:
          - id: c
            text: All input examples must share the same numeric values.
          - id: a
            text: The later calculation depends on that earlier result.
          - id: b
            text: Each layer must execute on a different brand of processor.
        feedback: Dependencies restrict which work can overlap.
        id: processors-and-parallelism.transfer.v2.3
        retired: true
      - prompt: A job takes longer than its ideal serial-plus-parallel estimate. Which factor could explain the difference?
        answer: a
        options:
          - id: a
            text: Communication and coordination between workers.
          - id: b
            text: The removal of all transfer and coordination costs.
          - id: c
            text: An assumption that results require no calculation.
        feedback: The ideal estimate omitted overhead and uneven work distribution.
        id: processors-and-parallelism.transfer.v2.4
        retired: true
  - id: processors-and-parallelism.base.v3
    objective_ref: objective.processors-and-parallelism
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Only the parallel part is shared among the workers; the serial part stays the same. Speedup is the one-worker total divided by the new total.
    remediation_scene: processors-and-parallelism.s3
    numeric_fields:
      - id: parallel
        label: Parallel time in seconds
      - id: total
        label: Total time in seconds
      - id: speedup
        label: Speedup factor
    absolute_tolerance: 0.01
    variants:
      - id: processors-and-parallelism.base.v3.1
        prompt: A job has 2 seconds of serial work and 6 seconds of evenly splittable work on one worker. With 3 workers and no overhead, find the parallel time, the total time, and the speedup.
        answers:
          parallel: 2
          total: 4
          speedup: 2
        reason_answer: b
        reason_options:
          - id: a
            text: Split the whole job, serial part included, among the workers.
          - id: b
            text: Split only the parallel part, add the serial part, then compare totals.
          - id: c
            text: The speedup equals the number of workers, since each takes a share.
        feedback: 6 ÷ 3 = 2 s of parallel work, plus 2 s serial, is 4 s. The one-worker time was 8 s, so the speedup is 8 ÷ 4 = 2, not 3, because the serial 2 s can't be shared.
      - id: processors-and-parallelism.base.v3.2
        prompt: A job has 1 second of serial work and 9 seconds of evenly splittable work on one worker. With 3 workers and no overhead, find the parallel time, the total time, and the speedup.
        answers:
          parallel: 3
          total: 4
          speedup: 2.5
        reason_answer: c
        reason_options:
          - id: a
            text: The speedup equals the number of workers, since each takes a share.
          - id: b
            text: Split the whole job, serial part included, among the workers.
          - id: c
            text: Split only the parallel part, add the serial part, then compare totals.
        feedback: 9 ÷ 3 = 3 s, plus 1 s serial, is 4 s. The speedup is 10 ÷ 4 = 2.5. Splitting all 10 s would give 3.33 s, but the serial second has to run on its own.
      - id: processors-and-parallelism.base.v3.3
        prompt: A job has 4 seconds of serial work and 20 seconds of evenly splittable work on one worker. With 5 workers and no overhead, find the parallel time, the total time, and the speedup.
        answers:
          parallel: 4
          total: 8
          speedup: 3
        reason_answer: a
        reason_options:
          - id: a
            text: Split only the parallel part, add the serial part, then compare totals.
          - id: b
            text: Split the whole job, serial part included, among the workers.
          - id: c
            text: The speedup equals the number of workers, since each takes a share.
        feedback: 20 ÷ 5 = 4 s, plus 4 s serial, is 8 s. The speedup is 24 ÷ 8 = 3, well short of 5, because a sixth of the original time is serial.
      - id: processors-and-parallelism.base.v3.4
        prompt: A job has 3 seconds of serial work and 6 seconds of evenly splittable work on one worker. With 2 workers and no overhead, find the parallel time, the total time, and the speedup.
        answers:
          parallel: 3
          total: 6
          speedup: 1.5
        reason_answer: b
        reason_options:
          - id: a
            text: The speedup equals the number of workers, since each takes a share.
          - id: b
            text: Split only the parallel part, add the serial part, then compare totals.
          - id: c
            text: Split the whole job, serial part included, among the workers.
        feedback: 6 ÷ 2 = 3 s, plus 3 s serial, is 6 s. The speedup is 9 ÷ 6 = 1.5. With a third of the job serial, even a second worker helps less than you'd hope.
      - id: processors-and-parallelism.base.v3.5
        prompt: A job has 1 second of serial work and 15 seconds of evenly splittable work on one worker. With 5 workers and no overhead, find the parallel time, the total time, and the speedup.
        answers:
          parallel: 3
          total: 4
          speedup: 4
        reason_answer: c
        reason_options:
          - id: a
            text: Split the whole job, serial part included, among the workers.
          - id: b
            text: The speedup equals the number of workers, since each takes a share.
          - id: c
            text: Split only the parallel part, add the serial part, then compare totals.
        feedback: 15 ÷ 5 = 3 s, plus 1 s serial, is 4 s. The speedup is 16 ÷ 4 = 4, not 5, because the serial second doesn't shrink.
      - id: processors-and-parallelism.base.v3.6
        prompt: A job has 5 seconds of serial work and 40 seconds of evenly splittable work on one worker. With 8 workers and no overhead, find the parallel time, the total time, and the speedup.
        answers:
          parallel: 5
          total: 10
          speedup: 4.5
        reason_answer: a
        reason_options:
          - id: a
            text: Split only the parallel part, add the serial part, then compare totals.
          - id: b
            text: The speedup equals the number of workers, since each takes a share.
          - id: c
            text: Split the whole job, serial part included, among the workers.
        feedback: 40 ÷ 8 = 5 s, plus 5 s serial, is 10 s. The speedup is 45 ÷ 10 = 4.5, barely half of 8, because the serial 5 s now takes as long as all the parallel work.
  - id: processors-and-parallelism.transfer.v3
    objective_ref: objective.processors-and-parallelism
    task: transfer
    response_type: single_choice
    points: 1
    hint: Find what the work is actually waiting on (a serial step, a dependency, data arriving from memory, or a queue) and pick the change that shortens that wait.
    remediation_scene: processors-and-parallelism.s6
    variants:
      - id: processors-and-parallelism.transfer.v3.1
        prompt: A profile shows a GPU's cores idle 70% of the time, waiting for numbers to arrive from memory. Which change targets this bottleneck?
        options:
          - id: a
            text: Switch to a chip with twice as many cores
          - id: b
            text: Split the work across more of the same GPUs
          - id: c
            text: Reuse data already nearby instead of refetching it
        answer: c
        feedback: The cores are waiting for data, so the fix is to move less data, for example by reusing values held in a cache. More cores with the same memory connection would simply wait in larger numbers.
      - id: processors-and-parallelism.transfer.v3.2
        prompt: A program spends 10% of its one-worker time in a step that can't be split. What is the largest speedup any number of workers could give?
        options:
          - id: b
            text: '90 times'
          - id: a
            text: '10 times'
          - id: c
            text: No limit, with enough workers
        answer: a
        feedback: Even if the other 90% took no time at all, the serial 10% would remain, so the speedup can't exceed 1 ÷ 0.1 = 10. That ceiling is Amdahl's law.
      - id: processors-and-parallelism.transfer.v3.3
        prompt: A translation service waits 3 seconds for a batch of 4 requests to fill, then translates all four in 2 seconds. What latency does the first user experience?
        options:
          - id: a
            text: 0.5 seconds, the batch time shared by 4
          - id: b
            text: 2 seconds, the time to process the batch
          - id: c
            text: 5 seconds, the wait plus the processing
        answer: c
        feedback: Latency runs from sending the request to receiving the answer, so the 3-second wait counts, giving 3 + 2 = 5 seconds. Dividing 2 seconds by 4 requests gives a throughput figure, not anyone's waiting time.
      - id: processors-and-parallelism.transfer.v3.4
        prompt: Which of these jobs would gain the most from running on a GPU instead of a CPU?
        options:
          - id: b
            text: Following a long chain of if-then steps, each needing the last
          - id: c
            text: Reading one small settings file from the disk at startup
          - id: a
            text: Multiplying a batch of 10,000 examples by a weight matrix
        answer: a
        feedback: A big batch multiply is thousands of independent multiply-and-adds, exactly what a GPU's many cores do at once. A chain of dependent steps must run one at a time, and reading one small file is mostly waiting on the disk.
      - id: processors-and-parallelism.transfer.v3.5
        prompt: A model has 12 layers, and each needs the previous layer's output. You have 12 GPUs. Why can't each GPU work on its own layer at the same time for a single input?
        options:
          - id: c
            text: Each GPU would need its own full copy of the model's weights
          - id: a
            text: Each layer has to wait for the output of the layer before it
          - id: b
            text: GPUs can only run one kind of layer, so the layers must differ
        answer: a
        feedback: This is a dependency chain, so for one input, layer 5 has nothing to work on until layer 4 finishes. Copying weights is a memory question, not the reason the layers can't overlap.
      - id: processors-and-parallelism.transfer.v3.6
        prompt: A training step must move 2 gigabytes from memory, and the connection carries 20 gigabytes per second. What is the least time the transfer can take?
        options:
          - id: b
            text: 10 seconds
          - id: a
            text: 0.1 seconds
          - id: c
            text: 40 seconds
        answer: a
        feedback: Time is data divided by bandwidth, 2 ÷ 20 = 0.1 seconds. 10 comes from dividing the wrong way round, and 40 from multiplying.
