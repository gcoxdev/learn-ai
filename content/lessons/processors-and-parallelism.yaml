objectives:
- id: objective.processors-and-parallelism
  version: 2-draft
  statement: Calculate an ideal serial-plus-parallel runtime and identify whether arithmetic, dependencies, or data
    movement limits a concrete workload.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - processors-and-parallelism.base.v2
