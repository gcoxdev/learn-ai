        retired: true
      - id: processors-and-parallelism.base.2
        prompt: Transfer and launch take 4 ms; computation takes 2 ms. Minimum combined time?
        options:
          - id: b
            text: 2 ms
          - id: c
            text: 4 ms
          - id: a
            text: 6 ms
        answer: a
        feedback: Costs on the critical path add in this simplified sequential example.
        retired: true
  - id: processors-and-parallelism.transfer
    objective_ref: objective.processors-and-parallelism
    task: transfer
    response_type: single_choice
    points: 1
