assessment_families:
- id: processors-and-parallelism.base
  objective_ref: objective.processors-and-parallelism
  task: base
  response_type: single_choice
  points: 1
  hint: 'A matrix product exposes parallel work: trace the inputs, operation, and result before choosing.'
  remediation_scene: processors-and-parallelism.s2
  variants:
  - id: processors-and-parallelism.base.1
    prompt: What often suits a GPU well?
    options:
    - id: a
      text: Large regular parallel numerical work
    - id: b
      text: Every tiny serial branch-heavy operation equally
    - id: c
      text: Only text-file naming
    answer: a
    feedback: Regular workloads can use many execution lanes and shared numerical kernels.
  - id: processors-and-parallelism.base.2
    prompt: Transfer and launch take 4 ms; computation takes 2 ms. Minimum combined time?
    options:
    - id: b
      text: 2 ms
    - id: c
      text: 4 ms
    - id: a
      text: 6 ms
    answer: a
    feedback: Costs on the critical path add in this simplified sequential example.
- id: processors-and-parallelism.transfer
  objective_ref: objective.processors-and-parallelism
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Compare measured workloads: trace the inputs, operation, and result before choosing.'
  remediation_scene: processors-and-parallelism.s4
  variants:
  - id: processors-and-parallelism.transfer.1
    prompt: An accelerator advertises twice the peak FLOPs. Must inference latency halve?
    options:
    - id: b
      text: Yes; peak arithmetic determines every workload
    - id: c
      text: Only if the output is text
    - id: a
      text: No; memory, overhead, shapes, and utilization matter
    answer: a
    feedback: A peak specification is not an application benchmark.
  - id: processors-and-parallelism.transfer.2
    prompt: A tiny GPU task is slower than a CPU task. What should diagnosis include?
    options:
    - id: c
      text: An assumption that all measurements are impossible
    - id: a
      text: Launch and transfer overhead relative to useful work
    - id: b
      text: Only parameter names
    answer: a
    feedback: Fixed overhead can dominate small workloads.
