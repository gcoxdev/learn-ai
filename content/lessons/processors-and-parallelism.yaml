    fourfold one. Even infinitely accelerating the parallel part leaves the 2-second serial part, so this simplified
    job cannot improve by more than a factor of 5.'
  bridges:
  - arithmetic
- id: processors-and-parallelism.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.processors-and-parallelism
  title: Bring the numbers to the arithmetic units
  markdown: 'A processor needs its input values from **memory**, storage it can access during calculation. **Bandwidth**
    is how much data can move per unit of time. One gigabyte is one billion bytes. If a stage transfers 1 gigabyte
    at a sustained 10 gigabytes per second, that transfer takes 0.1 seconds under our assumptions.


    This is a lower bound on that transfer stage, not necessarily an extra 0.1 seconds to add to the whole program:
    some transfer may overlap computation. **Caching** keeps useful data nearby for reuse. Extra arithmetic hardware
    may sit idle if values cannot arrive fast enough. Memory capacity also limits what fits at once.'
  text_mode: 'A processor needs its input values from **memory**, storage it can access during calculation. **Bandwidth**
