lesson:
  id: processors-and-parallelism
  version: 0.4.0-draft
  title: What makes an accelerator useful?
  state: draft
  summary: Hire four times the cooks and dinner still isn't four times faster. Discover Amdahl's law, why chips sit idle waiting for data, and why a busy system can still feel slow.
  slot: M02.7
  category: learning
  sources:
    - title: NVIDIA CUDA programming guide
      url: https://docs.nvidia.com/cuda/cuda-programming-guide/
    - title: "Amdahl, G. M. (1967). Validity of the single processor approach to achieving large scale computing capabilities. AFIPS Spring Joint Computer Conference."
      url: https://doi.org/10.1145/1465482.1465560
  archetype: mechanism
objectives:
  - id: objective.processors-and-parallelism
    version: 3-draft
    statement: Calculate an ideal serial-plus-parallel runtime and identify whether arithmetic, dependencies, or data movement limits a concrete workload.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - processors-and-parallelism.base.v3
      - processors-and-parallelism.transfer.v3
    prerequisites:
      - anyOf:
          - objective.algorithm-cost
      - anyOf:
          - objective.tensor-shape-tracing
scenes:
  - id: processors-and-parallelism.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.processors-and-parallelism
    title: A few chefs or a thousand line cooks
    markdown: |-
      Picture two kitchens. One has a few brilliant chefs who can cook anything, switching from soup to soufflé in seconds. The other has a thousand line cooks who can each do only simple jobs, but all at once. For a banquet of 10,000 identical sandwiches, the second kitchen wins easily.

      Computers have both kinds of kitchen. A **processor** is the hardware that carries out a program's instructions. A **CPU** (central processing unit) is the brilliant-chef kind: a handful of powerful cores, good at complicated step-by-step work and at running the rest of the computer. A **GPU** (graphics processing unit) is the line-cook kind: thousands of simpler cores that do the same kind of arithmetic on many numbers **in parallel**, meaning at the same time.

      GPUs were built to color millions of screen pixels at once. Model calculations turned out to be the same kind of job: huge batches of multiply-and-add, like the XW you traced in the shapes lesson. In 2012, AlexNet, the image model that kicked off the deep learning boom, was trained on two consumer gaming GPUs. Chips built mainly for this work, like GPUs and Google's TPUs, are called **accelerators**.
    bridges: []
  - id: processors-and-parallelism.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.processors-and-parallelism
    title: Which jobs can happen at the same time?
    markdown: |-
      Parallel hardware only helps when there's work that can truly happen at once.

      In the batch from the shapes lesson, parcel 1's row of XW doesn't need parcel 2's result. Those rows are independent, so different cores can compute them simultaneously.

      Model layers are different. Layer 2 needs layer 1's output before it can start, and layer 3 needs layer 2's. When one step must wait for another, that's a **dependency**. Work forced to happen one step after another is called **serial** work. Like a recipe where you can't frost a cake before it's baked, no number of extra cooks makes a chain of dependencies go faster.

      So before counting processors, sketch which results depend on which. The independent pieces are the part that can speed up.
    bridges: []
  - id: processors-and-parallelism.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.processors-and-parallelism
    title: Four workers, not four times faster
    markdown: |-
      A job takes 10 seconds on one worker: 2 seconds of serial setup, then 8 seconds of work that splits evenly. Give it 4 workers:

      | Part | One worker | Four workers |
      | --- | ---: | ---: |
      | Serial setup | 2 s | 2 s (can't be shared) |
      | Parallel work | 8 s | 8 ÷ 4 = 2 s |
      | **Total** | **10 s** | **4 s** |

      **Speedup** is old time divided by new time: 10 ÷ 4 = 2.5. Four workers, only 2.5 times faster.

      :::predict What if you had a million workers?
      The parallel part shrinks toward zero, but the 2 serial seconds never budge. The time approaches 2 seconds, so the speedup approaches 10 ÷ 2 = 5, and never passes it.
      :::

      ```python run
      serial = 2.0                        # seconds that must run one step at a time
      parallel = 8.0                      # seconds of work that can be split evenly
      one_worker = serial + parallel      # 10 seconds on a single worker

      for workers in [1, 2, 4, 8, 16, 1000]:
          time = serial + parallel / workers      # only the parallel part gets shared
          speedup = one_worker / time             # old time divided by new time
          print(f"{workers:5d} workers: {time:6.3f} s   speedup {speedup:5.2f}x")
      ```

      Going from 8 to 16 workers only lifts the speedup from 3.33 to 4, and 1,000 workers reach just 4.98. Now set `serial = 0.5` and add `1000000` to the list of worker counts: the speedup climbs to 8.5 ÷ 0.5 = 17.

      :::papers The formula behind the ceiling
      Computer architect Gene Amdahl made this argument in 1967, and it's now called **Amdahl's law**. If a fraction $p$ of the one-worker time can be split among $N$ workers, the speedup is

      $$S(N) = \frac{1}{(1 - p) + \dfrac{p}{N}}$$

      For our job, $p = 8/10 = 0.8$ and $N = 4$: $S = 1 / (0.2 + 0.2) = 2.5$. As $N$ grows, $p/N$ vanishes and $S$ approaches $1/(1-p) = 1/0.2 = 5$. The serial fraction sets the ceiling.
      :::
    bridges:
      - arithmetic
  - id: processors-and-parallelism.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.processors-and-parallelism
    title: Fast cooks, slow deliveries
    markdown: |-
      Back in the kitchen: a thousand cooks are useless if ingredients arrive through one small door. Processors have the same problem. The numbers they work on live in **memory**, and **bandwidth** is how much data can move from memory to the processor each second.

      Suppose a step must move 1 gigabyte (one billion bytes) and the connection carries 10 gigabytes per second. Moving the data takes at least 1 ÷ 10 = 0.1 seconds. If the arithmetic itself would take only 0.01 seconds, the cores spend most of that time waiting. That step is **memory-bound**: data delivery, not arithmetic, sets its speed.

      :::mixup "A chip with more cores will always run my model faster."
      Extra cores only help if data reaches them fast enough. For a memory-bound step, a chip with twice the cores and the same bandwidth waits just as long. That's why accelerators keep small, very fast **caches** close to the cores: data that's reused, like a weight matrix applied to every row of a batch, is fetched once and used many times.
      :::
    bridges: []
  - id: processors-and-parallelism.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.processors-and-parallelism
    markdown: Work out speedups for new jobs, then find the real bottleneck in a waiting chip, a batch of chat requests, and a stack of layers.
    takeaway: |-
      Extra workers only speed up the part of a job that can run at once, and only if data reaches them fast enough. Measure where the time goes before buying more hardware.
  - id: processors-and-parallelism.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.processors-and-parallelism
    markdown: |-
      CPUs and accelerators organize computation differently; useful speed depends on workload shape, parallelism, memory movement, and software support.
  - id: processors-and-parallelism.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.processors-and-parallelism
    title: Busy system, slow answer
    markdown: |-
      A chat service can measure speed in two different ways. **Latency** is how long one request takes, from the moment you hit Enter to the moment your answer arrives. **Throughput** is how many requests the system finishes per second.

      Suppose the service waits until 4 requests have arrived, then answers all four together in 2 seconds. Its throughput is 4 ÷ 2 = 2 requests per second.

      :::predict The first request in the batch waited 3 seconds for the other three to arrive. What latency does that user experience?
      3 seconds of waiting plus 2 seconds of processing: 5 seconds. The throughput figure (2 per second) says nothing about that wait.
      :::

      Bigger batches keep the hardware busier and raise throughput, but can make each person wait longer. A good service watches both numbers.
    bridges: []
  - id: processors-and-parallelism.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.processors-and-parallelism
    title: Measure before you buy
    markdown: |-
      Real jobs also lose time to things our examples skipped: workers passing results to each other, or waiting for the slowest one to finish. So before adding hardware, measure. A **profile** is a record of where a program's time actually goes. The biggest item is the **bottleneck**, the thing holding everything else back.

      Here's Sofia's image-labeling job, which takes 60 seconds:

      | Stage | Time |
      | --- | ---: |
      | Loading images from disk, one at a time | 42 s |
      | Model arithmetic on the GPU | 12 s |
      | Saving results | 6 s |

      Her team wants a GPU twice as fast. That would cut 12 s to 6 s and the total to 54 s, a speedup of only 1.1. Instead, Sofia loads images with 6 workers in parallel: 42 s becomes about 7 s, and the job drops to about 25 s, more than twice as fast, with no new hardware. Fix the biggest line of the profile first.
    bridges: []
