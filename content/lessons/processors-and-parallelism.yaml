- id: processors-and-parallelism.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.processors-and-parallelism
  title: Throughput and latency answer different questions
  markdown: '**Latency** is how long a particular request takes from arrival to its result. **Throughput** is how
    many requests a system completes per unit of time.


    A batch of four requests that takes two seconds to process has processing throughput 4 ÷ 2 = 2 requests per
    second. If requests wait in a queue while the batch fills, their end-to-end latency includes that waiting time.
    Larger batches can use hardware efficiently while making some users wait longer. Compare both measurements under
    a stated workload; a high throughput number alone does not tell a waiting user when their answer will arrive.'
  text_mode: '**Latency** is how long a particular request takes from arrival to its result. **Throughput** is how
    many requests a system completes per unit of time.


    A batch of four requests that takes two seconds to process has processing throughput 4 ÷ 2 = 2 requests per
    second. If requests wait in a queue while the batch fills, their end-to-end latency includes that waiting time.
    Larger batches can use hardware efficiently while making some users wait longer. Compare both measurements under
    a stated workload; a high throughput number alone does not tell a waiting user when their answer will arrive.'
  bridges: []
- id: processors-and-parallelism.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.processors-and-parallelism
  title: Measure where the time actually goes
  markdown: 'Our four-worker calculation assumed equal work division and no communication or scheduling overhead.
    Real workers may need to exchange intermediate results or wait for the slowest participant. That additional
    work can reduce the ideal speedup.


    A **profile** records where time or resources are spent. If a profile shows long waits for memory, investigate
    data reuse and transfer. If it shows a serial stage dominating, adding workers to another stage has limited
    benefit. Later training and inference lessons apply these ideas to model weights, intermediate arrays, and generated
    tokens. Start with the measured bottleneck, the resource currently limiting progress.'
