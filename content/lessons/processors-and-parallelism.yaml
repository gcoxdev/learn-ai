scenes:
- id: processors-and-parallelism.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.processors-and-parallelism
  title: A processor executes the operations
  markdown: 'A **processor** is hardware that carries out program instructions. A **CPU**, or central processing
    unit, handles many kinds of work, including decisions and coordinating other devices. A **GPU**, or graphics
    processing unit, is designed to perform large amounts of suitable work in parallel: many operations can proceed
    at the same time.


    GPU does not mean an AI model. It is one kind of machine on which model calculations can run. CPUs can also
    run AI, and modern CPUs can perform parallel work. The useful question is which hardware matches the operations
    and data involved.'
  text_mode: 'A **processor** is hardware that carries out program instructions. A **CPU**, or central processing
    unit, handles many kinds of work, including decisions and coordinating other devices. A **GPU**, or graphics
    processing unit, is designed to perform large amounts of suitable work in parallel: many operations can proceed
    at the same time.


    GPU does not mean an AI model. It is one kind of machine on which model calculations can run. CPUs can also
    run AI, and modern CPUs can perform parallel work. The useful question is which hardware matches the operations
    and data involved.'
  bridges: []
- id: processors-and-parallelism.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.processors-and-parallelism
  title: Find the independent pieces
  markdown: 'For input rows [1, 2] and [3, 4], computing the weighted result of the first row need not wait for
    the result of the second. Those calculations can be assigned to different workers.


    Inside a sequence of model layers, however, a later layer needs the earlier layer’s output. That is a **dependency**.
    Work constrained to occur in sequence is called **serial** work. Some operations within a layer may still run
    together. Drawing which results depend on which earlier results helps identify potential parallelism; counting
    processors alone cannot tell you how much overlap is possible.'
  text_mode: 'For input rows [1, 2] and [3, 4], computing the weighted result of the first row need not wait for
    the result of the second. Those calculations can be assigned to different workers.


    Inside a sequence of model layers, however, a later layer needs the earlier layer’s output. That is a **dependency**.
    Work constrained to occur in sequence is called **serial** work. Some operations within a layer may still run
    together. Drawing which results depend on which earlier results helps identify potential parallelism; counting
    processors alone cannot tell you how much overlap is possible.'
  bridges: []
- id: processors-and-parallelism.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.processors-and-parallelism
  title: Calculate the ideal speedup
  markdown: 'Suppose a job takes 10 seconds on one worker: 2 seconds of serial preparation followed by 8 seconds
    of perfectly divisible parallel work. With four workers, the parallel part ideally takes 8 ÷ 4 = 2 seconds.
    Total time is 2 + 2 = 4 seconds.


    **Speedup** is old time divided by new time: 10 ÷ 4 = 2.5. Four workers give a 2.5-fold ideal speedup, not a
    fourfold one. Even infinitely accelerating the parallel part leaves the 2-second serial part, so this simplified
    job cannot improve by more than a factor of 5.'
  text_mode: 'Suppose a job takes 10 seconds on one worker: 2 seconds of serial preparation followed by 8 seconds
    of perfectly divisible parallel work. With four workers, the parallel part ideally takes 8 ÷ 4 = 2 seconds.
