- id: processors-and-parallelism.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.processors-and-parallelism
  markdown: CPUs and accelerators organize computation differently; useful speed depends on workload shape, parallelism,
    memory movement, and software support.
  text_mode: CPUs and accelerators organize computation differently; useful speed depends on workload shape, parallelism,
