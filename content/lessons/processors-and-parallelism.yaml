lesson:
  id: processors-and-parallelism
  version: 0.2.0-draft
  title: What makes an accelerator useful?
  state: draft
  summary: Separate arithmetic, data movement, and waiting; calculate why four workers do not necessarily make a
    task four times faster.
  slot: M02.7
  category: learning
  minutes: 12
  sources:
  - title: NVIDIA CUDA programming guide
