schema_version: 0.2-draft
lesson:
  id: applied-ai-case-comparisons
  version: 0.3.0-draft
  title: Apply the same lifecycle questions to different products
  state: draft
  summary: Netflix paid a million dollars for a better recommender and never shipped it. Four real deployments show which step of this module decided each one's fate.
  slot: M33.8
  category: learning
  sources:
    - title: Netflix Recommendations, Beyond the 5 Stars, Part 1 (Netflix Technology Blog, 2012)
      url: https://netflixtechblog.com/netflix-recommendations-beyond-the-5-stars-part-1-55838468f429
    - title: "The Netflix Recommender System: Algorithms, Business Value, and Innovation (Gomez-Uribe & Hunt, ACM TMIS, 2015)"
      url: https://dl.acm.org/doi/10.1145/2843948
    - title: "The Parable of Google Flu: Traps in Big Data Analysis (Lazer, Kennedy, King & Vespignani, Science, 2014)"
      url: https://www.science.org/doi/10.1126/science.1248506
    - title: External Validation of a Widely Implemented Proprietary Sepsis Prediction Model in Hospitalized Patients (Wong et al., JAMA Internal Medicine, 2021)
      url: https://jamanetwork.com/journals/jamainternalmedicine/fullarticle/2781307
    - title: Racial Disparities in Automated Speech Recognition (Koenecke et al., PNAS, 2020)
      url: https://www.pnas.org/doi/10.1073/pnas.1915768117
objectives:
  - id: objective.applied-ai-case-comparisons
    version: 2-draft
    statement: Compare real AI deployments in recommendation, forecasting, accessibility, and decision support by what was predicted, how it was judged offline, what happened in use, and which lifecycle step made the difference, then apply the same questions to a new product.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - applied-ai-case-comparisons.base.v2
      - applied-ai-case-comparisons.transfer.v2
    prerequisites:
      - anyOf:
          - objective.operational-capacity-and-reliability
      - anyOf:
          - objective.human-review-and-user-experience
scenes:
  - id: applied-ai-case-comparisons.s1
    title: The million-dollar model that never shipped
    type: explanation
    depth: intuition
    objective_refs:
      - objective.applied-ai-case-comparisons
    markdown: |-
      In 2006 Netflix offered \$1 million to anyone who could predict its customers' movie ratings 10% more accurately than its own system, Cinematch. It released about 100 million ratings, and thousands of teams competed. In September 2009, the team BellKor's Pragmatic Chaos won by cutting the error (RMSE) from 0.9525 to 0.8567, a 10.06% improvement.

      Netflix never deployed the winning solution. Its engineering blog explained in 2012 that it had already put two of the strongest ideas from an earlier stage of the contest (matrix factorization and restricted Boltzmann machines) into production, after reworking them to handle billions of ratings instead of 100 million. The final prize-winning blend of many models offered extra accuracy that, in the team's judgment, didn't justify the engineering effort to run it.

      :::mixup "The model with the best offline score is the best product."
      An offline score is one input to a decision. The product lesson's sum still applies: the gain must beat its cost to build and run, and it must show up where it counts. Gomez-Uribe and Hunt (2015) describe Netflix judging recommender changes mainly by A/B tests on member retention, not by rating error.
      :::
    bridges: []
  - id: applied-ai-case-comparisons.s2
    title: "Forecasting: a simple baseline wins"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.applied-ai-case-comparisons
    markdown: |-
      Google Flu Trends, launched in 2008, estimated current flu activity from the volume of flu-related searches. Official US figures from the CDC arrive with about a two-week lag, so Flu Trends promised the same answer sooner. It became a celebrated example of big data.

      :::predict From 2011 to 2013, which forecast US flu levels better: Google's search-based model, or a simple model built on CDC figures that were already a couple of weeks old?
      The old CDC figures. Lazer and colleagues (2014) found Flu Trends overestimated flu in 100 of 108 weeks from August 2011, and in the 2012–13 season it estimated more than double the CDC's level. Over their test period, the mean absolute error was 0.486 for Flu Trends and 0.311 for the lagged CDC model. Combining the two did best, at 0.232.
      :::

      Their diagnosis maps onto the monitoring lesson. The original model had been partly a "winter detector," picking up search terms that merely rise in winter, and it missed the off-season 2009 H1N1 pandemic. Search behavior also drifted, partly because Google kept changing its own search engine. A running comparison against the simple baseline would have raised the alarm early. Google stopped publishing the estimates in 2015.
    bridges: []
  - id: applied-ai-case-comparisons.s3
    title: "Accessibility: an average that hides a slice"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.applied-ai-case-comparisons
    markdown: |-
      Speech recognition powers captions, dictation, and voice control, and for many people with disabilities it's how they use a device at all. Koenecke and colleagues (2020) tested five commercial systems, from Amazon, Apple, Google, IBM, and Microsoft, on interviews with 42 white and 73 Black speakers. The average **word error rate (WER)**, the share of words transcribed wrongly, was 0.19 for white speakers and 0.35 for Black speakers: nearly twice as many errors.

      A single overall WER would have blended those two numbers into one reasonable-looking figure. This is the slice problem from the monitoring lesson, and the fix is the same: report errors separately for the groups who will rely on the tool, and test with those people before claiming it works.
    bridges: []
  - id: applied-ai-case-comparisons.s4
    title: "Decision support: a score meets a hospital"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.applied-ai-case-comparisons
    markdown: |-
      Epic, a major US health-records company, offers a model that scores hospital patients' risk of sepsis, a life-threatening reaction to infection, so clinicians can act sooner. Wong and colleagues (2021) evaluated it at Michigan Medicine on 38,455 hospitalizations. Its AUC, a measure of how well it ranks sick above healthy patients, was 0.63, well below the 0.76 to 0.83 its developer had reported. At the alert threshold studied, it flagged 18% of all hospitalizations yet missed 67% of sepsis cases.

      Put that in the human review lesson's terms, for a hospital with 1,000 admissions a week. About 66 patients develop sepsis (6.6% did in the study). The model flags 180 patients and catches about 22 of the 66, so clinicians evaluate about 8 alerts per real case. At 10 minutes per alert, that's 30 hours of clinician time a week, while 44 cases are still missed. Alert fatigue, clinicians learning to ignore a noisy alarm, is automation bias running in reverse.
    bridges: []
  - id: applied-ai-case-comparisons.matrix
    title: One matrix, four cases, and Linden
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.applied-ai-case-comparisons
    markdown: |-
      Put the cases side by side and each one turns on a different lesson in this module:

      | | Netflix Prize | Google Flu Trends | Speech recognition | Epic sepsis model |
      | --- | --- | --- | --- | --- |
      | Predicts | Movie ratings | Flu levels | Spoken words | Sepsis risk |
      | Judged offline by | RMSE | Fit to past CDC data | Overall WER | Developer's AUC |
      | What use revealed | Gain not worth the cost | Worse than a lagged baseline | Nearly 2× errors for Black speakers | Weak on new patients; heavy alert load |
      | Labels arrive | Within weeks | About 2 weeks | Only if someone checks | After diagnosis |
      | Decisive lesson | Product framing | Monitoring and baselines | Slices | Human review capacity |

      Linden's assistant fits the same frame: it predicts hours from a source, is judged offline by 200 test questions, gets labels a week late from staff review, and its decisive risks are a stale source and the holiday slice.

      :::try Fill in a fifth column
      Pick an AI product you use, such as a spam filter, a photo search, or a map's arrival time. Fill in each row. Which lesson would decide whether it works for you: the baseline, the slices, the review load, or the release ladder?
      :::
  - id: applied-ai-case-comparisons.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.applied-ai-case-comparisons
    markdown: A bookstore's recommender, a city's bus forecast, a vendor's triage model, and a captioning tool test whether you can spot which lifecycle question decides a new case.
    takeaway: "Every product runs the same lifecycle, but a different step decides each one's fate: Netflix's cost, Flu Trends' baseline, speech recognition's slices, and the sepsis model's local validation and alert load. Ask all the questions, then find the one that matters most."
  - id: applied-ai-case-comparisons.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.applied-ai-case-comparisons
    markdown: |-
      Products share a lifecycle but need different evidence of success. Define what a useful result means before comparing their metrics or architectures.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - applied-ai-case-comparisons.s1
        - applied-ai-case-comparisons.s2
        - applied-ai-case-comparisons.s3
        - applied-ai-case-comparisons.s4
        - applied-ai-case-comparisons.matrix
        - applied-ai-case-comparisons.check
      gate_refs:
        - gate.core
  scene_aliases:
    applied-ai-case-comparisons.recap: applied-ai-case-comparisons.check
assessment_families:
  - id: applied-ai-case-comparisons.base
    objective_ref: objective.applied-ai-case-comparisons
    task: base
    response_type: single_choice
    points: 1
    hint: 'Forecasting must respect time: trace the inputs, operation, and result before choosing.'
    remediation_scene: applied-ai-case-comparisons.s2
    variants:
      - id: applied-ai-case-comparisons.base.1
        prompt: Why are recommendation clicks not pure preference labels?
        options:
          - id: b
            text: Every user sees every item equally
          - id: c
            text: Only item spelling matters
          - id: a
            text: Exposure and ranking influence what users can click
        answer: a
        feedback: Observed feedback is affected by the system’s choices.
        retired: true
      - id: applied-ai-case-comparisons.base.2
        prompt: What split principle matters for forecasting?
        options:
          - id: c
            text: Only balance file sizes
          - id: a
            text: Respect information availability and temporal order
          - id: b
            text: Always shuffle future and past freely
        answer: a
        feedback: Forecast evaluation should resemble prediction-time conditions.
        retired: true
  - id: applied-ai-case-comparisons.transfer
    objective_ref: objective.applied-ai-case-comparisons
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Decision support needs a defined human role: trace the inputs, operation, and result before choosing.'
    remediation_scene: applied-ai-case-comparisons.s4
    variants:
      - id: applied-ai-case-comparisons.transfer.1
        prompt: Why test accessibility tools with intended users?
        options:
          - id: c
            text: All users have identical needs
          - id: a
            text: Aggregate metrics can miss practical barriers and group-specific failures
          - id: b
            text: Only developers can assess usability
        answer: a
        feedback: Real use determines whether the assistance works.
        retired: true
      - id: applied-ai-case-comparisons.transfer.2
        prompt: What is shared across these applications?
        options:
          - id: a
            text: The need to connect lifecycle choices to task-specific evidence
          - id: b
            text: One universal accuracy metric
          - id: c
            text: One mandatory model architecture
        answer: a
        feedback: Common engineering questions require context-specific answers.
        retired: true
  - id: applied-ai-case-comparisons.base.v2
    objective_ref: objective.applied-ai-case-comparisons
    task: base
    response_type: single_choice
    points: 1
    hint: For each case, name the step that decided it (value versus cost, a simple baseline, a hidden slice, or local validation and review load), then match.
    remediation_scene: applied-ai-case-comparisons.matrix
    variants:
      - id: applied-ai-case-comparisons.base.v2.1
        prompt: Netflix did not deploy the Netflix Prize's winning blend, despite its 10% lower rating error. What does this case show most directly?
        options:
          - id: b
            text: RMSE is a poor metric for predicting movie ratings
          - id: a
            text: An offline gain must justify its cost to build and run
          - id: c
            text: Contest models can't be adapted to run at real scale
        answer: a
        feedback: Netflix judged that the extra accuracy wasn't worth the engineering effort, so the product question, value against cost, decided. It did adapt and deploy two contest algorithms, so contest models clearly can be scaled, and RMSE was a fine measure of rating error.
      - id: applied-ai-case-comparisons.base.v2.2
        prompt: From 2011 to 2013, a model built on two-week-old CDC figures forecast flu better than Google Flu Trends. Which practice would have caught this early?
        options:
          - id: c
            text: Training Flu Trends on many more search terms each week
          - id: b
            text: Leaving the CDC figures out of the ongoing evaluation
          - id: a
            text: Tracking Flu Trends against a simple baseline over time
        answer: a
        feedback: A running comparison with the lagged-CDC baseline would have shown the gap within weeks. More search terms was part of the original problem (winter terms), and dropping the CDC figures removes the only ground truth.
      - id: applied-ai-case-comparisons.base.v2.3
        prompt: Five speech recognition systems averaged a word error rate of 0.35 for Black speakers and 0.19 for white speakers. Which evaluation practice reveals such a gap?
        options:
          - id: a
            text: Reporting error rates separately for each speaker group
          - id: b
            text: Reporting one average error rate over all the recordings
          - id: c
            text: Testing on more hours of audio from the same sources
        answer: a
        feedback: A gap between groups is visible only when errors are broken out by group. One average blends the groups into a single number, and more of the same audio just measures that average more precisely.
      - id: applied-ai-case-comparisons.base.v2.4
        prompt: At Michigan Medicine, the Epic sepsis model flagged 18% of all hospitalizations and missed 67% of sepsis cases. Which concern does the 18% figure raise most directly?
        options:
          - id: b
            text: Training-serving skew in the model's input data
          - id: a
            text: Review load and alert fatigue among clinicians
          - id: c
            text: Rate limits on the server that runs the model
        answer: a
        feedback: Flagging nearly one patient in five means about 8 evaluations per real case, a heavy review load that teaches clinicians to ignore alerts. Skew might explain the weak AUC, but the 18% is about workload.
  - id: applied-ai-case-comparisons.transfer.v2
    objective_ref: objective.applied-ai-case-comparisons
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what the product predicts, how it's being judged, when true labels arrive, and which of the four cases it most resembles.
    remediation_scene: applied-ai-case-comparisons.matrix
    variants:
      - id: applied-ai-case-comparisons.transfer.v2.1
        prompt: An online bookstore judges its new recommender by clicks on recommended books. Why can clicks mislead here?
        options:
          - id: c
            text: Clicks are recorded more slowly than purchases are
          - id: b
            text: Clicks are always noisier than written reviews
          - id: a
            text: Shoppers can only click what the system chose to show
        answer: a
        feedback: A recommender decides what gets seen, so clicks measure its own choices as much as shoppers' tastes, a feedback loop. Clicks arrive fast, and whether they're noisier than reviews doesn't explain the bias.
      - id: applied-ai-case-comparisons.transfer.v2.2
        prompt: A city builds a deep model to forecast daily bus ridership. Which comparison should it report first?
        options:
          - id: a
            text: The model against "same day last week," on later weeks it never saw
          - id: b
            text: The model's error on days drawn at random from the whole history
          - id: c
            text: The model against a larger deep model trained on the same data
        answer: a
        feedback: Like Flu Trends, a forecast must beat a simple baseline on future periods. Random days let the model peek at neighboring days, and comparing two deep models says nothing about whether either beats the simple rule.
      - id: applied-ai-case-comparisons.transfer.v2.3
        prompt: A vendor's triage model reports an AUC of 0.85 on data from its existing customers. A new hospital is considering it. What should the hospital do before relying on it?
        options:
          - id: b
            text: Take the vendor's AUC as its expected performance
          - id: a
            text: Validate it on its own recent patients and alert rates
          - id: c
            text: Raise the alert threshold so fewer patients are flagged
        answer: a
        feedback: The Epic sepsis model scored 0.63 at Michigan Medicine against a reported 0.76 to 0.83, so local validation, including how many alerts staff will face, comes first. Changing the threshold before measuring is guessing.
      - id: applied-ai-case-comparisons.transfer.v2.4
        prompt: A captioning tool reports 95% word accuracy overall. Deaf users who speak one regional dialect say it's unusable for them. What should the team do next?
        options:
          - id: c
            text: Retrain on more of the same audio it already uses
          - id: b
            text: Rely on the overall figure, since 95% is already high
          - id: a
            text: Measure accuracy for that dialect's speakers separately
        answer: a
        feedback: As in the speech recognition study, an overall figure can hide a slice where the tool fails. Measuring the slice comes first; more of the same audio would leave the dialect under-represented.
