schema_version: 0.2-draft
lesson:
  id: applied-ai-case-comparisons
  version: 0.1.0-draft
  title: Apply the same lifecycle questions to different products
  state: draft
  summary: Recommendation, forecasting, search, accessibility, and decision-support systems share a lifecycle but
    differ in feedback, evidence, error costs, and the role of human judgment.
  slot: M33.8
  category: learning
  minutes: 12
  sources:
  - title: Introduction to Information Retrieval — authors’ online edition
    url: https://nlp.stanford.edu/IR-book/
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: NIST AI Risk Management Framework
    url: https://www.nist.gov/itl/ai-risk-management-framework
objectives:
- id: objective.applied-ai-case-comparisons
  version: 1-draft
  statement: Recommendation, forecasting, search, accessibility, and decision-support systems share a lifecycle
    but differ in feedback, evidence, error costs, and the role of human judgment.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - applied-ai-case-comparisons.base
  - applied-ai-case-comparisons.transfer
  prerequisites:
  - anyOf:
    - objective.operational-capacity-and-reliability
  - anyOf:
    - objective.human-review-and-user-experience
scenes:
- id: applied-ai-case-comparisons.s1
  title: Recommendation changes what is observed
  type: explanation
  depth: intuition
  objective_refs:
  - objective.applied-ai-case-comparisons
  markdown: A recommender chooses which items users see, so clicks reflect both preferences and exposure. Compare
    ranking metrics with diversity, satisfaction, and longer-term outcomes. A popular item can gain more data simply
    because earlier rankings showed it more often.
  text_mode: A recommender chooses which items users see, so clicks reflect both preferences and exposure. Compare
    ranking metrics with diversity, satisfaction, and longer-term outcomes. A popular item can gain more data simply
    because earlier rankings showed it more often.
  bridges: []
- id: applied-ai-case-comparisons.s2
  title: Forecasting must respect time
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.applied-ai-case-comparisons
  markdown: A demand forecast uses information available before the forecast horizon. Backtesting should preserve
    temporal order and compare simple seasonal or last-value baselines. A randomly shuffled split can leak future
    patterns and exaggerate deployment performance.
  text_mode: A demand forecast uses information available before the forecast horizon. Backtesting should preserve
    temporal order and compare simple seasonal or last-value baselines. A randomly shuffled split can leak future
    patterns and exaggerate deployment performance.
  bridges: []
- id: applied-ai-case-comparisons.s3
  title: Search and accessibility require usable evidence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.applied-ai-case-comparisons
  markdown: Search should retrieve relevant current material with appropriate access controls. Captioning or speech
    assistance should be evaluated with intended users under noise, language, and device conditions. An average
    recognition score may hide failures that make the tool unusable for a particular group.
  text_mode: Search should retrieve relevant current material with appropriate access controls. Captioning or speech
    assistance should be evaluated with intended users under noise, language, and device conditions. An average
    recognition score may hide failures that make the tool unusable for a particular group.
  bridges: []
- id: applied-ai-case-comparisons.s4
  title: Decision support needs a defined human role
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.applied-ai-case-comparisons
  markdown: A system suggesting options should show relevant evidence, limits, and correction paths suited to the
    decision. Compare model-only and assisted workflow outcomes. Across all cases, trace data, learning, inference,
    evaluation, feedback, and accountability instead of assuming one architecture solves every product need.
  text_mode: A system suggesting options should show relevant evidence, limits, and correction paths suited to the
    decision. Compare model-only and assisted workflow outcomes. Across all cases, trace data, learning, inference,
    evaluation, feedback, and accountability instead of assuming one architecture solves every product need.
  bridges: []
- id: applied-ai-case-comparisons.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.applied-ai-case-comparisons
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: applied-ai-case-comparisons.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.applied-ai-case-comparisons
  markdown: Recommendation, forecasting, search, accessibility, and decision-support systems share a lifecycle but
    differ in feedback, evidence, error costs, and the role of human judgment.
  text_mode: Recommendation, forecasting, search, accessibility, and decision-support systems share a lifecycle
    but differ in feedback, evidence, error costs, and the role of human judgment.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - applied-ai-case-comparisons.s1
    - applied-ai-case-comparisons.s2
    - applied-ai-case-comparisons.s3
    - applied-ai-case-comparisons.s4
    - applied-ai-case-comparisons.check
    - applied-ai-case-comparisons.recap
    gate_refs:
    - gate.core
assessment_families:
- id: applied-ai-case-comparisons.base
  objective_ref: objective.applied-ai-case-comparisons
  task: base
  response_type: single_choice
  points: 1
  hint: 'Forecasting must respect time: trace the inputs, operation, and result before choosing.'
  remediation_scene: applied-ai-case-comparisons.s2
  variants:
  - id: applied-ai-case-comparisons.base.1
    prompt: Why are recommendation clicks not pure preference labels?
    options:
    - id: b
      text: Every user sees every item equally
    - id: c
      text: Only item spelling matters
    - id: a
      text: Exposure and ranking influence what users can click
    answer: a
    feedback: Observed feedback is affected by the system’s choices.
  - id: applied-ai-case-comparisons.base.2
    prompt: What split principle matters for forecasting?
    options:
    - id: c
      text: Only balance file sizes
    - id: a
      text: Respect information availability and temporal order
    - id: b
      text: Always shuffle future and past freely
    answer: a
    feedback: Forecast evaluation should resemble prediction-time conditions.
- id: applied-ai-case-comparisons.transfer
  objective_ref: objective.applied-ai-case-comparisons
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Decision support needs a defined human role: trace the inputs, operation, and result before choosing.'
  remediation_scene: applied-ai-case-comparisons.s4
  variants:
  - id: applied-ai-case-comparisons.transfer.1
    prompt: Why test accessibility tools with intended users?
    options:
    - id: c
      text: All users have identical needs
    - id: a
      text: Aggregate metrics can miss practical barriers and group-specific failures
    - id: b
      text: Only developers can assess usability
    answer: a
    feedback: Real use determines whether the assistance works.
  - id: applied-ai-case-comparisons.transfer.2
    prompt: What is shared across these applications?
    options:
    - id: a
      text: The need to connect lifecycle choices to task-specific evidence
    - id: b
      text: One universal accuracy metric
    - id: c
      text: One mandatory model architecture
    answer: a
    feedback: Common engineering questions require context-specific answers.
