schema_version: 0.2-draft
lesson:
  id: video-models
  version: 0.1.0-draft
  title: Model motion and persistence across frames
  state: draft
  summary: Video models must represent spatial content and temporal relationships; understanding and generation
    require evaluation of motion, identity, causality, and consistency beyond individual frame quality.
  slot: M23.6
  category: learning
  sources:
  - title: Video Diffusion Models
    url: https://arxiv.org/abs/2204.03458
  - title: TimeSformer
    url: https://arxiv.org/abs/2102.05095
objectives:
- id: objective.video-models
  version: 1-draft
  statement: Video models must represent spatial content and temporal relationships; understanding and generation
    require evaluation of motion, identity, causality, and consistency beyond individual frame quality.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - video-models.base
  - video-models.transfer
  prerequisites:
  - anyOf:
    - objective.modality-tokenization
  - anyOf:
    - objective.depth-motion-3d
  - anyOf:
    - objective.latent-diffusion
scenes:
- id: video-models.s1
  title: Video adds a time axis
  type: explanation
  depth: intuition
  objective_refs:
  - objective.video-models
  markdown: Frames contain spatial information, while their ordering describes motion and events. Frame sampling
    can miss a brief action. A model may process frame features, spatiotemporal patches, recurrent state, or combinations,
    each imposing a different information and compute budget.
  text_mode: Frames contain spatial information, while their ordering describes motion and events. Frame sampling
    can miss a brief action. A model may process frame features, spatiotemporal patches, recurrent state, or combinations,
    each imposing a different information and compute budget.
  bridges: []
- id: video-models.s2
  title: Preserve identity through motion
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.video-models
  markdown: If a red ball passes behind a box, later frames should maintain its identity and plausible position.
    A generator can produce attractive individual images while changing object count, geometry, or texture across
    time. Temporal consistency is therefore a separate evaluation target.
  text_mode: If a red ball passes behind a box, later frames should maintain its identity and plausible position.
    A generator can produce attractive individual images while changing object count, geometry, or texture across
    time. Temporal consistency is therefore a separate evaluation target.
  bridges: []
- id: video-models.s3
  title: Distinguish camera motion from world motion
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.video-models
  markdown: An apparent image shift may result from camera movement, object movement, or both. Depth, occlusion,
    and viewpoint changes make prediction ambiguous. Learned video models can capture statistical regularities without
    implementing an explicit physically valid three-dimensional simulator.
  text_mode: An apparent image shift may result from camera movement, object movement, or both. Depth, occlusion,
    and viewpoint changes make prediction ambiguous. Learned video models can capture statistical regularities without
    implementing an explicit physically valid three-dimensional simulator.
  bridges: []
- id: video-models.s4
  title: Evaluate sequences as sequences
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.video-models
  markdown: Test event order, timing, object permanence, instruction adherence, and long-horizon behavior. Include
    frame-level quality but also temporal measures and human examination under a stated rubric. Generated video
    that looks realistic is not evidence that the depicted event actually occurred.
  text_mode: Test event order, timing, object permanence, instruction adherence, and long-horizon behavior. Include
    frame-level quality but also temporal measures and human examination under a stated rubric. Generated video
    that looks realistic is not evidence that the depicted event actually occurred.
  bridges: []
- id: video-models.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.video-models
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Video models must represent spatial content and temporal relationships; understanding and generation
    require evaluation of motion, identity, causality, and consistency beyond individual frame quality.
- id: video-models.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.video-models
  markdown: Video models must represent spatial content and temporal relationships; understanding and generation
    require evaluation of motion, identity, causality, and consistency beyond individual frame quality.
  text_mode: Video models must represent spatial content and temporal relationships; understanding and generation
    require evaluation of motion, identity, causality, and consistency beyond individual frame quality.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - video-models.s1
    - video-models.s2
    - video-models.s3
    - video-models.s4
    - video-models.check
    gate_refs:
    - gate.core
  scene_aliases:
    video-models.recap: video-models.check
assessment_families:
- id: video-models.base
  objective_ref: objective.video-models
  task: base
  response_type: single_choice
  points: 1
  hint: 'Preserve identity through motion: trace the inputs, operation, and result before choosing.'
  remediation_scene: video-models.s2
  variants:
  - id: video-models.base.1
    prompt: Why can sparse frame sampling miss an action?
    options:
    - id: b
      text: Every frame contains the complete past
    - id: c
      text: Sampling changes only file names
    - id: a
      text: The event may occur between sampled frames
    answer: a
    feedback: Temporal coverage limits observable evidence.
  - id: video-models.base.2
    prompt: Good individual frames with changing object identity reveal what?
    options:
    - id: c
      text: Only an audio issue
    - id: a
      text: A temporal consistency failure
    - id: b
      text: Perfect video quality
    answer: a
    feedback: Sequence coherence adds constraints beyond frame appearance.
- id: video-models.transfer
  objective_ref: objective.video-models
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate sequences as sequences: trace the inputs, operation, and result before choosing.'
  remediation_scene: video-models.s4
  variants:
  - id: video-models.transfer.1
    prompt: Does realistic generated motion prove an explicit physical simulator exists inside the model?
    options:
    - id: c
      text: Only for long clips
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Behavior alone does not identify the internal mechanism.
  - id: video-models.transfer.2
    prompt: What must video understanding evaluate beyond object labels?
    options:
    - id: a
      text: Event order and temporal relationships
    - id: b
      text: Only image height
    - id: c
      text: Only caption punctuation
    answer: a
    feedback: Video tasks depend on changes and relationships over time.
