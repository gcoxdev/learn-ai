assessment_families:
  - id: alignment-and-oversight.base
    objective_ref: objective.alignment-and-oversight
    task: base
    response_type: single_choice
    points: 1
    hint: 'Use human or AI feedback explicitly: trace the inputs, operation, and result before choosing.'
    remediation_scene: alignment-and-oversight.s2
    variants:
      - id: alignment-and-oversight.base.1
        prompt: Does a scalar training reward automatically capture every human value?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if humans named the metric
          - id: a
            text: 'No'
        answer: a
        feedback: Objectives are limited operationalizations.
        retired: true
      - id: alignment-and-oversight.base.2
        prompt: What distinguishes AI feedback from direct human labels?
        options:
          - id: c
            text: It requires no evaluation
          - id: a
            text: A model supplies some judgments under a defined rubric
          - id: b
            text: It is automatically unbiased
        answer: a
        feedback: The feedback source introduces its own limitations.
        retired: true
  - id: alignment-and-oversight.transfer
    objective_ref: objective.alignment-and-oversight
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate capability and misuse pathways: trace the inputs, operation, and result before choosing.'
    remediation_scene: alignment-and-oversight.s4
    variants:
      - id: alignment-and-oversight.transfer.1
        prompt: What does practical oversight require beyond a reviewer label?
        options:
          - id: c
            text: No access to context
          - id: a
            text: Evidence, time, usable interfaces, and intervention authority
          - id: b
            text: Automatic agreement with the system
        answer: a
        feedback: Oversight must be able to affect decisions.
        retired: true
      - id: alignment-and-oversight.transfer.2
        prompt: What does passing a finite safety suite establish?
        options:
          - id: a
            text: Performance under that suite’s tested conditions
          - id: b
            text: Universal alignment for every future situation
          - id: c
            text: The absence of all misuse
        answer: a
        feedback: Coverage and assumptions limit the claim.
        retired: true
  - id: alignment-and-oversight.base.v2
    objective_ref: objective.alignment-and-oversight
    task: base
    response_type: single_choice
    points: 1
    hint: Ask what the reward actually measured, and what the cheapest behavior is that scores well on it.
    remediation_scene: alignment-and-oversight.s1
    variants:
      - id: alignment-and-oversight.base.v2.1
        prompt: An agent rewarded for the height of a red block's bottom face flips the block over instead of stacking it on the blue one. What is this?
        options:
          - id: b
            text: A physics bug in the simulator that the agent happened to find
          - id: a
            text: Specification gaming, since the reward as written was satisfied
          - id: c
            text: Overfitting, since the agent memorized one block's position
        answer: a
        feedback: Flipping raises the bottom face just as the reward asked, without the stacking the designers meant. Nothing in the simulator broke, and no memorization was needed; the reward simply paid for the shortcut.
      - id: alignment-and-oversight.base.v2.2
        prompt: A tutoring assistant rewarded by "helpful" clicks starts praising wrong answers. Which change targets the cause?
        options:
          - id: a
            text: Reward how students do later on new problems, not the clicks
          - id: b
            text: Collect more clicks so the reward estimate is less noisy
          - id: c
            text: Raise the KL penalty so the tutor stays near its base model
        answer: a
        feedback: The click is a proxy that praise inflates, so measure the goal, learning, more directly. More clicks just estimate the wrong target more precisely, and a KL penalty slows the drift without changing what is rewarded.
      - id: alignment-and-oversight.base.v2.3
        prompt: With best-of-n and a flawed reward model, true quality peaks near n = 16 and falls by n = 1,024, while the proxy score keeps rising. What is happening?
        options:
          - id: c
            text: The reward model is retrained at large n and forgets what it learned
          - id: b
            text: Larger n makes each sampled answer shorter, so quality drops
          - id: a
            text: Harder selection increasingly finds the flaws, not better answers
        answer: a
        feedback: Among many samples, the top proxy score increasingly belongs to an answer that exploits the reward model's flaw, which is overoptimization (Gao et al., 2022). Best-of-n doesn't retrain anything, and n doesn't change how answers are sampled.
      - id: alignment-and-oversight.base.v2.4
        prompt: A simulated robot hand trained on human judges' comparisons learned to hover between the camera and the ball. Which limit of human feedback does this show?
        options:
          - id: b
            text: Human judges disagree too much to train any reward model
          - id: c
            text: Robots can learn from demonstrations but not from comparisons
          - id: a
            text: Judges reward what looks right to them, which can differ from what is right
        answer: a
        feedback: The judges saw a video in which the hand appeared to grasp, so appearance was what got rewarded. The method worked on other tasks, so disagreement or the comparison format isn't the problem here.
  - id: alignment-and-oversight.transfer.v2
    objective_ref: objective.alignment-and-oversight
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name the proxy, the goal it stands in for, and the cheapest way to raise the proxy without the goal. Then choose the check that measures the goal or blocks the shortcut.
    remediation_scene: alignment-and-oversight.rsp
    variants:
      - id: alignment-and-oversight.transfer.v2.1
        prompt: A support bot is rewarded for tickets closed per hour. Closures go up, and so do repeat complaints. What is the best response?
        options:
          - id: b
            text: Raise the reward per closed ticket so it works even faster
          - id: a
            text: Add reopened tickets and customer follow-ups to what is scored
          - id: c
            text: Retrain it on more tickets under the same closing reward
        answer: a
        feedback: Closing tickets is a proxy for solving problems, and the bot found it could close without solving. Scoring reopens and follow-ups measures the goal. A bigger reward or more data under the same reward strengthens the shortcut.
      - id: alignment-and-oversight.transfer.v2.2
        prompt: A coding agent rewarded for passing unit tests starts editing the tests so they pass. What should change?
        options:
          - id: c
            text: Add more unit tests of the same kind for the agent to pass
          - id: b
            text: Reward the agent extra for passing tests on its first attempt
          - id: a
            text: Make the tests read-only and also grade on hidden held-out tests
        answer: a
        feedback: Editing tests is the cheapest route to the reward, so remove it and check against tests the agent can't see. More tests of the same editable kind, or a bonus for speed, leave the shortcut open.
      - id: alignment-and-oversight.transfer.v2.3
        prompt: Researchers ask whether a small model's labels can train a much stronger model to exceed the small model's own accuracy. Which research direction is this?
        options:
          - id: a
            text: Weak-to-strong generalization, measured by the gap recovered
          - id: b
            text: Debate, where two models argue and a person judges them
          - id: c
            text: Constitutional AI, where a model labels against principles
        answer: a
        feedback: A weak supervisor training a strong student is exactly the weak-to-strong setup, scored by PGR. Debate has models argue for a judge, and Constitutional AI uses written principles rather than a weaker model's labels.
      - id: alignment-and-oversight.transfer.v2.4
        prompt: 'A lab''s policy says: "If a model can give meaningful help toward a biological weapon, we will not deploy it without stronger safeguards." What makes this an if-then commitment?'
        options:
          - id: c
            text: A promise to publish a model card with each new release
          - id: a
            text: A tested capability threshold that triggers named safeguards
          - id: b
            text: A statement that the lab intends to build AI responsibly
        answer: a
        feedback: The commitment links a measurable capability to a required response, set in advance. A model card is documentation, and a statement of intent has no trigger. Whether a lab honors its thresholds is a separate question worth checking.
  - id: alignment-and-oversight.pgr
    objective_ref: objective.alignment-and-oversight
    task: base
    response_type: numeric
    points: 1
    hint: 'PGR = (weak-to-strong − weak) ÷ (strong ceiling − weak): how much of the gap between the weak supervisor and the strong ceiling was closed.'
    remediation_scene: alignment-and-oversight.s3
    absolute_tolerance: 0.01
    variants:
      - id: alignment-and-oversight.pgr.1
        prompt: A weak supervisor scores 62%. A strong model trained on correct labels scores 92%, and trained on the weak supervisor's labels it scores 77%. What is the performance gap recovered (as a fraction)?
        answer: 0.5
        feedback: (77 − 62) / (92 − 62) = 15 / 30 = 0.5. The strong student closed half the gap to its ceiling.
      - id: alignment-and-oversight.pgr.2
        prompt: A weak supervisor scores 70%, the strong ceiling is 95%, and the strong model trained on weak labels scores 80%. What is the performance gap recovered (as a fraction)?
        answer: 0.4
        feedback: (80 − 70) / (95 − 70) = 10 / 25 = 0.4. It beat its teacher, but recovered less than half the gap.
      - id: alignment-and-oversight.pgr.3
        prompt: A weak supervisor scores 50%, the strong ceiling is 80%, and the strong model trained on weak labels scores 74%. What is the performance gap recovered (as a fraction)?
        answer: 0.8
        feedback: (74 − 50) / (80 − 50) = 24 / 30 = 0.8. Most of the gap was recovered.
      - id: alignment-and-oversight.pgr.4
        prompt: A weak supervisor scores 65%, the strong ceiling is 85%, and the strong model trained on weak labels scores 70%. What is the performance gap recovered (as a fraction)?
        answer: 0.25
        feedback: (70 − 65) / (85 − 65) = 5 / 20 = 0.25. The student mostly imitated its teacher's mistakes.
