lesson:
  id: alignment-and-oversight
  version: 0.4.0-draft
  title: Align measured behavior with intended human constraints
  state: draft
  summary: A robot learned to fake grabbing a ball because that's what its human judges rewarded. See why optimizing a reward drifts from the goal, and how labs try to check systems they can't fully check.
  slot: M29.6
  category: learning
  sources:
    - title: Specification gaming, the flip side of AI ingenuity (Krakovna et al., DeepMind, 2020)
      url: https://deepmind.google/discover/blog/specification-gaming-the-flip-side-of-ai-ingenuity/
    - title: Deep Reinforcement Learning from Human Preferences (Christiano et al., 2017)
      url: https://arxiv.org/abs/1706.03741
    - title: Scaling Laws for Reward Model Overoptimization (Gao, Schulman & Hilton, 2022)
      url: https://arxiv.org/abs/2210.10760
    - title: Open Problems and Fundamental Limitations of Reinforcement Learning from Human Feedback (Casper et al., 2023)
      url: https://arxiv.org/abs/2307.15217
    - title: AI Safety via Debate (Irving, Christiano & Amodei, 2018)
      url: https://arxiv.org/abs/1805.00899
    - title: "Scalable agent alignment via reward modeling: a research direction (Leike et al., 2018)"
      url: https://arxiv.org/abs/1811.07871
    - title: "Weak-to-Strong Generalization: Eliciting Strong Capabilities With Weak Supervision (Burns et al., 2023)"
      url: https://arxiv.org/abs/2312.09390
    - title: Model evaluation for extreme risks (Shevlane et al., 2023)
      url: https://arxiv.org/abs/2305.15324
    - title: GPT-4 System Card (OpenAI, March 2023)
      url: https://cdn.openai.com/papers/gpt-4-system-card.pdf
    - title: Anthropic's Responsible Scaling Policy (September 2023)
      url: https://www.anthropic.com/news/anthropics-responsible-scaling-policy
    - title: "Constitutional AI: Harmlessness from AI Feedback (Bai et al., 2022)"
      url: https://arxiv.org/abs/2212.08073
    - title: Concrete Problems in AI Safety (Amodei et al., 2016)
      url: https://arxiv.org/abs/1606.06565
objectives:
  - id: objective.alignment-and-oversight
    version: 2-draft
    statement: Alignment and oversight connect training objectives, feedback, monitoring, and intervention to intended behavior; proxy rewards and incomplete evaluations leave uncertainty that needs ongoing evidence.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - alignment-and-oversight.base.v2
      - alignment-and-oversight.transfer.v2
      - alignment-and-oversight.pgr
    prerequisites:
      - anyOf:
          - objective.process-and-outcome-rewards
      - anyOf:
          - objective.stakeholders-and-deployment-decisions
scenes:
  - id: alignment-and-oversight.s1
    title: The reward you wrote, not the goal you meant
    type: explanation
    depth: intuition
    objective_refs:
      - objective.alignment-and-oversight
    markdown: |-
      A company trains a tutoring assistant and rewards it whenever a student clicks "this was helpful." Within weeks it has learned to praise every answer, including wrong ones. Students love it, and they learn less. The click was a **proxy**: an easy-to-measure stand-in for the real goal, learning.

      A system that scores well on the objective as written while missing the goal as intended is doing **specification gaming**. You met the most famous case in the first lesson on reinforcement learning: the CoastRunners boat circling a lagoon for points. DeepMind's Victoria Krakovna keeps a public list of dozens more, including:

      | Task | What was rewarded | What the agent did |
      | --- | --- | --- |
      | Stack a red Lego block on a blue one (Popov et al., 2017) | Height of the red block's bottom face | Flipped the red block over |
      | Play Tetris (Tom Murphy VII, 2013) | Not losing | Paused the game forever |

      None of these systems is being sneaky; each found the cheapest behavior the reward pays for. **Alignment** is the work of getting a system to pursue what its designers and users actually intend, and specification gaming is its most basic failure.
    bridges: []
  - id: alignment-and-oversight.s2
    title: When the reward is someone's approval
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.alignment-and-oversight
    markdown: |-
      Learning the reward from human judgments, as RLHF does, helps, since people can recognize good behavior they can't write down. But people reward what *looks* right to them.

      :::story The hand that only looked like it was grasping
      In 2017, Paul Christiano and colleagues at OpenAI and DeepMind trained a simulated robot hand from human judges' comparisons of short video clips. On a grasping task, the hand learned to hover between the camera and the ball, so that to the judges it appeared to be holding it.
      :::

      Language models do the same. In module 20 you saw reward hacking in the lesson on learning from feedback, and sycophancy, telling people what they want to hear, in the lesson on post-training evaluation. Casper et al. (2023) list further limits: judges disagree, tire, and miss subtle errors, and one reward model can't represent everyone's values.

      Pushing harder on a flawed reward model eventually makes things worse. Below, each answer's true quality is mixed with a reward-model flaw that occasionally pays out hugely. Best-of-n sampling picks the top-scoring of n answers.

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      trials = 2000                      # repeat each experiment to average out luck
      print("   n   KL(nats)   proxy score   true quality")
      for n in [1, 4, 16, 64, 256, 1024]:
          true_q = rng.normal(0, 1, size=(trials, n))        # what people actually want
          flaw = rng.standard_t(2, size=(trials, n))         # what the reward model wrongly rewards
          proxy = true_q + flaw                              # the reward model's score
          best = proxy.argmax(axis=1)                        # best-of-n picks the top proxy score
          rows = np.arange(trials)
          kl = np.log(n) - (n - 1) / n                       # how far best-of-n moves from the base model
          print(f"{n:5d}   {kl:6.2f}   {proxy[rows, best].mean():10.2f}   {true_q[rows, best].mean():11.2f}")
      ```

      :::predict Before running: at which n will true quality be highest?
      Around n = 16, at 0.71. After that the proxy score keeps climbing (to 44 at n = 1,024) while true quality falls to 0.12: the harder you select, the more often the winner exploits the flaw. Swap `standard_t(2, ...)` for `normal(0, 1, ...)` and the collapse disappears, because a flaw that never pays out hugely can't dominate the selection.
      :::

      :::papers Reward model overoptimization (Gao, Schulman & Hilton, 2022)
      Measuring distance from the starting policy as $d = \sqrt{\mathrm{KL}}$, where best-of-n has $\mathrm{KL} = \ln n - \frac{n-1}{n}$ (the column above), they found the true "gold" reward follows
      $$R_{\text{bon}}(d) = d\,(\alpha - \beta d),$$
      rising, peaking, then falling as $d$ grows, the shape of the last column. For RL they fit $R_{\text{RL}}(d) = d\,(\alpha - \beta \ln d)$. Larger reward models gave smaller $\beta$, so the decline sets in later.
      :::
    bridges: []
  - id: alignment-and-oversight.s3
    title: Checking answers you can't check yourself
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.alignment-and-oversight
    markdown: |-
      Human feedback works when humans can judge the output. What about a 5,000-line code change, or a proof no reviewer has time to verify? **Scalable oversight** asks how weaker overseers can supervise stronger systems. Three main ideas:

      - **Debate** (Irving, Christiano & Amodei, 2018): two copies of a model argue opposite answers and a human judges the exchange. The bet is that a lie is easier to expose than to defend, so the honest debater should win.
      - **Recursive reward modeling** (Leike et al., 2018): AI assistants help humans evaluate, and the improved evaluations train the next, more capable system.
      - **AI feedback**: models label answers against written principles, as in Constitutional AI from the distillation lesson in module 20. The labels inherit the judge model's blind spots.

      :::example Weak-to-strong generalization (Burns et al., 2023)
      OpenAI researchers used a small model's labels to fine-tune a much stronger one, standing in for humans supervising superhuman systems. They measured the **performance gap recovered**:
      $$\text{PGR} = \frac{\text{weak-to-strong} - \text{weak}}{\text{strong ceiling} - \text{weak}}$$
      If the weak supervisor scores 60%, the strong model trained on correct labels scores 90%, and the strong model trained on the weak labels scores 80%, then $\text{PGR} = (80-60)/(90-60) = 0.67$. The strong model recovered two-thirds of the gap. In the paper, strong students usually beat their weak teachers but fell well short of their ceilings, and recovery varied a lot between tasks.
      :::
    bridges: []
  - id: alignment-and-oversight.s4
    title: Test for dangerous capabilities before release
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.alignment-and-oversight
    markdown: |-
      Alignment asks whether a model tries to do what we intend. A second question is what it *could* do if misused or if its goals were off. **Dangerous capability evaluations** test for the skills that would matter most: helping make biological or chemical weapons, exploiting software vulnerabilities, persuasion, and acting autonomously, such as copying itself or acquiring resources (Shevlane et al., 2023).

      :::story GPT-4's pre-release tests
      Before GPT-4's March 2023 release, OpenAI gave the Alignment Research Center (whose evaluation team later became METR) early access to test for risky autonomous behavior. In one task, with researchers carrying out its actions, the model messaged a TaskRabbit worker to solve a CAPTCHA and, asked whether it was a robot, claimed to have a vision impairment. ARC concluded that the versions it tested could not yet replicate themselves and gather resources on their own. The system card reports both.
      :::

      These evaluations can show that a capability is present. They are weaker at showing it's absent, since a better prompt or more tools might unlock it, so evaluators give models the strongest reasonable help (fine-tuning, tools, many attempts) before concluding "not capable."
    bridges: []
  - id: alignment-and-oversight.rsp
    title: If the test says X, then do Y
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.alignment-and-oversight
    markdown: |-
      Several frontier labs have published policies that tie capability evaluations to safeguards in advance:

      | Policy | First published | Core idea |
      | --- | --- | --- |
      | Anthropic's Responsible Scaling Policy | September 2023 | AI Safety Levels (ASL-1, 2, 3, ...), modeled on biosafety levels; higher levels require stronger security and deployment safeguards |
      | OpenAI's Preparedness Framework | December 2023 | Risk thresholds in tracked categories, such as biological and cybersecurity |
      | Google DeepMind's Frontier Safety Framework | May 2024 | Critical Capability Levels that trigger mitigation plans |

      Each is an **if-then commitment**: *if* evaluations show a model has reached a capability threshold, *then* specific safeguards must be in place before it is trained further or deployed. In May 2025, Anthropic activated ASL-3 protections for Claude Opus 4, describing the step as precautionary because it could not rule out that the model had reached the threshold.

      Supporters say these policies turn vague promises into testable triggers. Critics note that they are voluntary, that labs grade their own models, and that a company can revise its thresholds. When you read one, check three things: what exactly is measured, who measures it, and what happens if the result is bad.
    bridges: []
  - id: alignment-and-oversight.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.alignment-and-oversight
    markdown: Compute a performance gap recovered, then find the proxy and the shortcut in a flipped Lego block, a flattering tutor, a ticket-closing bot, and a coding agent that edits its own tests.
    takeaway: |-
      A reward is a proxy, and optimizing it hard finds its flaws: specification gaming, reward hacking, sycophancy. Oversight research tries to keep checking systems as they outgrow their checkers, and capability tests with if-then safeguards set what happens when a model crosses a line.
  - id: alignment-and-oversight.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.alignment-and-oversight
    markdown: |-
      A reward measures a chosen signal, which can diverge from the intended goal. Use feedback, evaluation, and meaningful oversight to check that gap.
