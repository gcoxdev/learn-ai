schema_version: 0.2-draft
lesson:
  id: alignment-and-oversight
  version: 0.1.0-draft
  title: Align measured behavior with intended human constraints
  state: draft
  summary: Alignment and oversight connect training objectives, feedback, monitoring, and intervention to intended
    behavior; proxy rewards and incomplete evaluations leave uncertainty that needs ongoing evidence.
  slot: M29.6
  category: learning
  minutes: 12
  sources:
  - title: Constitutional AI
    url: https://arxiv.org/abs/2212.08073
  - title: Concrete Problems in AI Safety
    url: https://arxiv.org/abs/1606.06565
  - title: NIST AI Risk Management Framework
    url: https://www.nist.gov/itl/ai-risk-management-framework
objectives:
- id: objective.alignment-and-oversight
  version: 1-draft
  statement: Alignment and oversight connect training objectives, feedback, monitoring, and intervention to intended
    behavior; proxy rewards and incomplete evaluations leave uncertainty that needs ongoing evidence.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - alignment-and-oversight.base
  - alignment-and-oversight.transfer
  prerequisites:
  - anyOf:
    - objective.process-and-outcome-rewards
  - anyOf:
    - objective.stakeholders-and-deployment-decisions
scenes:
- id: alignment-and-oversight.s1
  title: Specify the intended behavior
  type: explanation
  depth: intuition
  objective_refs:
  - objective.alignment-and-oversight
  markdown: Helpful, honest, and safe are broad goals requiring concrete task and policy definitions. Different
    stakeholders can disagree, and some requests conflict with others’ interests. A training objective operationalizes
    selected preferences or rules; it does not automatically capture every human value.
  text_mode: Helpful, honest, and safe are broad goals requiring concrete task and policy definitions. Different
    stakeholders can disagree, and some requests conflict with others’ interests. A training objective operationalizes
    selected preferences or rules; it does not automatically capture every human value.
  bridges: []
- id: alignment-and-oversight.s2
  title: Use human or AI feedback explicitly
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.alignment-and-oversight
  markdown: 'Human feedback can supply demonstrations or comparisons. AI feedback can critique responses or create
    preference labels under a written rubric, as in constitutional-style approaches. The origin of a label matters:
    a model judge can inherit biases, miss facts, and amplify its own blind spots.'
  text_mode: 'Human feedback can supply demonstrations or comparisons. AI feedback can critique responses or create
    preference labels under a written rubric, as in constitutional-style approaches. The origin of a label matters:
    a model judge can inherit biases, miss facts, and amplify its own blind spots.'
  bridges: []
- id: alignment-and-oversight.s3
  title: Support oversight with evidence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.alignment-and-oversight
  markdown: Reviewers need understandable outputs, relevant context, and authority to intervene. Scalable oversight
    studies how to assess behavior that is costly for humans to verify directly. Decomposition, debate, and automated
    checks are research approaches with assumptions, not established universal solutions.
  text_mode: Reviewers need understandable outputs, relevant context, and authority to intervene. Scalable oversight
    studies how to assess behavior that is costly for humans to verify directly. Decomposition, debate, and automated
    checks are research approaches with assumptions, not established universal solutions.
  bridges: []
- id: alignment-and-oversight.s4
  title: Evaluate capability and misuse pathways
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.alignment-and-oversight
  markdown: A safety evaluation should state what behaviors, adversaries, tools, and environments were tested. Monitor
    distribution changes and incidents after release. Passing a finite suite supports bounded claims; it does not
    prove all future behavior is aligned or that a capable model cannot be misused.
  text_mode: A safety evaluation should state what behaviors, adversaries, tools, and environments were tested.
    Monitor distribution changes and incidents after release. Passing a finite suite supports bounded claims; it
    does not prove all future behavior is aligned or that a capable model cannot be misused.
  bridges: []
- id: alignment-and-oversight.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.alignment-and-oversight
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Alignment and oversight connect training objectives, feedback, monitoring, and intervention to intended
    behavior; proxy rewards and incomplete evaluations leave uncertainty that needs ongoing evidence.
- id: alignment-and-oversight.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.alignment-and-oversight
  markdown: Alignment and oversight connect training objectives, feedback, monitoring, and intervention to intended
    behavior; proxy rewards and incomplete evaluations leave uncertainty that needs ongoing evidence.
  text_mode: Alignment and oversight connect training objectives, feedback, monitoring, and intervention to intended
