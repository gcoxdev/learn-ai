- id: algorithms-and-programs.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.algorithms-and-programs
  markdown: Programs implement algorithms using explicit inputs, state, control flow, and outputs; pseudocode and
    small traces help check their behavior.
  text_mode: Programs implement algorithms using explicit inputs, state, control flow, and outputs; pseudocode and
    small traces help check their behavior.
- id: algorithms-and-programs.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.algorithms-and-programs
  title: Separate a fixed procedure from learned numbers
  markdown: 'This counting procedure does not learn. The threshold 3 was chosen by us, and the program follows the
    same instructions on each run.


    An AI system might instead contain a model that predicts delivery time using learned weights. Its program still
    has explicit instructions: read inputs, multiply by the current weights, and report the prediction. During training,
    a separate procedure changes the weights using examples.


    A program can therefore contain a learned model without learning new settings each time it runs. Ask which instructions
    execute and which stored values, if any, change.'
