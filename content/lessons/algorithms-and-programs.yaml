scenes:
- id: algorithms-and-programs.s1
  title: A procedure has a contract
  type: explanation
  depth: intuition
  objective_refs:
  - objective.algorithms-and-programs
  markdown: An algorithm should say what input it accepts and what result it promises. A program implements that
    procedure in a language and environment. Functions divide work into reusable operations. A model call is one
    possible operation inside a larger program, with preprocessing and validation around it.
  text_mode: An algorithm should say what input it accepts and what result it promises. A program implements that
    procedure in a language and environment. Functions divide work into reusable operations. A model call is one
    possible operation inside a larger program, with preprocessing and validation around it.
  bridges: []
- id: algorithms-and-programs.s2
  title: Trace control flow
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.algorithms-and-programs
  markdown: To find the maximum of [3, 8, 5], start with best = 3, compare 8 and replace best, then compare 5 and
    keep 8. A loop repeats the comparison. A conditional chooses whether to update. The state best summarizes the
    largest value seen so far.
  text_mode: To find the maximum of [3, 8, 5], start with best = 3, compare 8 and replace best, then compare 5 and
    keep 8. A loop repeats the comparison. A conditional chooses whether to update. The state best summarizes the
    largest value seen so far.
  bridges:
  - algorithm-cost
- id: algorithms-and-programs.s3
  title: Specify edge cases
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.algorithms-and-programs
  markdown: What should the maximum procedure do with an empty list, missing values, or nonnumeric input? The answer
    belongs in the contract. Silently returning zero is wrong for a list of negative values and may be misleading
    for no values at all. Explicit errors can be more useful than plausible-looking results.
  text_mode: What should the maximum procedure do with an empty list, missing values, or nonnumeric input? The answer
    belongs in the contract. Silently returning zero is wrong for a list of negative values and may be misleading
    for no values at all. Explicit errors can be more useful than plausible-looking results.
  bridges: []
- id: algorithms-and-programs.s4
  title: Separate a specification from its implementation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.algorithms-and-programs
  markdown: Two programs can implement the same function using different algorithms and costs. Pseudocode makes
    the intended logic inspectable without every language detail. Test a hand-worked case and boundary cases, then
    measure performance at realistic sizes. A passing example alone does not prove the program correct for all accepted
    inputs.
  text_mode: Two programs can implement the same function using different algorithms and costs. Pseudocode makes
    the intended logic inspectable without every language detail. Test a hand-worked case and boundary cases, then
    measure performance at realistic sizes. A passing example alone does not prove the program correct for all accepted
    inputs.
  bridges: []
