    The “for each” instruction is a **loop**, a repeated action. The “if” instruction is a **condition**, a yes-or-no
    test that decides which action to take. Greater than excludes equality.'
  bridges: []
- id: algorithms-and-programs.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.algorithms-and-programs
  title: Watch the state change
  markdown: 'The values a program currently remembers are its **state**. Start with count = 0 and total = 0. For
    the list [2, 5, 1, 4], the trace is:


    | Weight inspected | Greater than 3? | Count after this step | Total after this step |

    | --- | --- | --- | --- |

    | 2 | No | 0 | 0 |

    | 5 | Yes | 1 | 5 |

    | 1 | No | 1 | 5 |

    | 4 | Yes | 2 | 9 |


    Count measures parcels; total measures kilograms. They are different outputs, even though both are numbers.'
  text_mode: 'The values a program currently remembers are its **state**. Start with count = 0 and total = 0. For
    the list [2, 5, 1, 4], the trace is:


