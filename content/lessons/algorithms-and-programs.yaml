assessment_families:
- id: algorithms-and-programs.base
  objective_ref: objective.algorithms-and-programs
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace control flow: trace the inputs, operation, and result before choosing.'
  remediation_scene: algorithms-and-programs.s2
  variants:
  - id: algorithms-and-programs.base.1
    prompt: Tracing maximum over [−4, −2, −7], what should the result be?
    options:
    - id: a
      text: −2
    - id: b
      text: '0'
    - id: c
      text: −7
    answer: a
    feedback: The largest supplied value is −2; zero was not an input.
    retired: true
  - id: algorithms-and-programs.base.2
    prompt: What does a loop provide?
    options:
    - id: b
      text: A guarantee of termination without conditions
    - id: c
      text: A new training objective automatically
    - id: a
      text: Repeated execution of a specified operation
    answer: a
    feedback: Loop conditions and updates determine repetition and termination.
    retired: true
- id: algorithms-and-programs.transfer
  objective_ref: objective.algorithms-and-programs
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Separate a specification from its implementation: trace the inputs, operation, and result before choosing.'
  remediation_scene: algorithms-and-programs.s4
  variants:
  - id: algorithms-and-programs.transfer.1
    prompt: A model pipeline receives an empty batch. What should its contract clarify?
    options:
    - id: b
      text: Which random label to invent
    - id: c
      text: Which positive number to return silently
    - id: a
      text: Whether to reject it or return a defined empty result
    answer: a
    feedback: Edge-case behavior should be intentional and inspectable.
    retired: true
  - id: algorithms-and-programs.transfer.2
    prompt: Two implementations return the same outputs on tested inputs. Must they have the same runtime?
    options:
    - id: c
      text: Only when they use functions
    - id: a
      text: No; algorithms and implementation costs can differ
    - id: b
      text: Yes; equal outputs imply equal cost
    answer: a
    feedback: Functional behavior and computational complexity are separate properties.
    retired: true
- id: algorithms-and-programs.base.v2
  objective_ref: objective.algorithms-and-programs
  task: base
  response_type: numeric_fields_with_reason
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: algorithms-and-programs.s3
  variants:
  - prompt: Use the taught procedure, keeping weights strictly greater than 3. For [3, 4, 6], report the accepted
      parcel count and total weight.
    answers:
      count: 2
      total: 10
    reason_answer: a
    reason_options:
    - id: a
      text: Inspect each entry once and keep it only if it is greater than 3.
    - id: b
      text: Include weights equal to 3 along with heavier weights.
    - id: c
      text: Count different weight values instead of individual parcels.
    feedback: The count increases by one for each accepted entry; the total increases by that entry’s weight.
    id: algorithms-and-programs.base.v2.1
  - prompt: Use the taught procedure, keeping weights strictly greater than 3. For [2, 3, 3], report the accepted
      parcel count and total weight.
    answers:
      count: 0
      total: 0
    reason_answer: a
    reason_options:
    - id: b
      text: Include weights equal to 3 along with heavier weights.
    - id: c
      text: Count different weight values instead of individual parcels.
    - id: a
      text: Inspect each entry once and keep it only if it is greater than 3.
    feedback: The count increases by one for each accepted entry; the total increases by that entry’s weight.
    id: algorithms-and-programs.base.v2.2
  - prompt: Use the taught procedure, keeping weights strictly greater than 3. For [5, 5, 1], report the accepted
      parcel count and total weight.
    answers:
      count: 2
      total: 10
    reason_answer: a
    reason_options:
    - id: c
      text: Count different weight values instead of individual parcels.
    - id: a
      text: Inspect each entry once and keep it only if it is greater than 3.
    - id: b
      text: Include weights equal to 3 along with heavier weights.
    feedback: The count increases by one for each accepted entry; the total increases by that entry’s weight.
    id: algorithms-and-programs.base.v2.3
  - prompt: Use the taught procedure, keeping weights strictly greater than 3. For [4, 3, 7, 2], report the accepted
      parcel count and total weight.
    answers:
      count: 2
      total: 11
    reason_answer: a
    reason_options:
    - id: a
      text: Inspect each entry once and keep it only if it is greater than 3.
    - id: b
      text: Include weights equal to 3 along with heavier weights.
    - id: c
      text: Count different weight values instead of individual parcels.
    feedback: The count increases by one for each accepted entry; the total increases by that entry’s weight.
    id: algorithms-and-programs.base.v2.4
  numeric_fields:
  - id: count
    label: Accepted parcels
  - id: total
    label: Total weight in kilograms
  absolute_tolerance: 1.0e-06
- id: algorithms-and-programs.transfer.v2
  objective_ref: objective.algorithms-and-programs
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: algorithms-and-programs.s4
  variants:
  - prompt: Which single-parcel test distinguishes “greater than 3” from the mistaken “at least 3”?
    answer: a
    options:
    - id: a
      text: '[3], expecting count 0 and total 0.'
    - id: b
      text: '[5], expecting count 1 and total 5.'
    - id: c
      text: '[2], expecting count 0 and total 0.'
    feedback: The procedures disagree exactly at equality.
    id: algorithms-and-programs.transfer.v2.1
  - prompt: A loop reports count 1 for [4, 4]. What likely misunderstanding does that reveal?
    answer: a
    options:
    - id: b
      text: It applied a threshold greater than 3.
    - id: c
      text: It initialized the total to zero.
    - id: a
      text: It counted distinct weights instead of parcels.
    feedback: Two entries represent two parcels, even when their weights match.
    id: algorithms-and-programs.transfer.v2.2
  - prompt: A trained delivery predictor reads fixed weights and calculates an answer. Is that execution itself
      another training step?
    answer: a
    options:
    - id: c
      text: Yes; new inputs are automatically new training examples.
    - id: a
      text: No; prediction need not change the stored weights.
    - id: b
      text: Yes; every multiplication changes the stored weights.
    feedback: A training procedure must actually update learned settings; prediction alone need not.
    id: algorithms-and-programs.transfer.v2.3
  - prompt: A faster implementation passes [2] and [5] but has not been tested at 3. What evidence is still missing?
    answer: a
    options:
    - id: a
      text: A check of the threshold’s equality behavior.
    - id: b
      text: A demonstration that count and weight use the same unit.
    - id: c
      text: A demonstration that an empty list contains one parcel.
    feedback: Neither existing test separates strict comparison from inclusive comparison.
    id: algorithms-and-programs.transfer.v2.4
