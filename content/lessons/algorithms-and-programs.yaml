scenes:
  - id: algorithms-and-programs.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.algorithms-and-programs
    title: '"Heavy" means nothing to a computer'
    markdown: |-
      A courier tells a new helper, "Pull out the heavy parcels." The helper lifts each box and uses judgment. A computer has no judgment to use. Is a 3 lb parcel heavy? What about 2.9 lb? What if the list is empty?

      You met **algorithms** (step-by-step procedures) and **programs** (instructions a computer can run) in the first lesson of the course. This lesson is about making those steps precise enough that a computer, or a colleague, can't misread them.

      So we pin the job down: *given a list of parcel weights in whole pounds, none negative, count the parcels strictly heavier than 3 lb and add up their weights.* A precise statement like this, saying which inputs are allowed and what the output must be, is the program's **contract**. Every test later in the lesson checks the program against it.
    bridges: []
  - id: algorithms-and-programs.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.algorithms-and-programs
    title: Read the steps before any code
    markdown: |-
      Before writing real code, people often sketch **pseudocode**: plain-language steps that any programmer could translate into any language.

      1. Set count to 0 and total to 0.
      2. For each weight in the list, inspect that weight once.
      3. If the weight is greater than 3, add 1 to count and add the weight to total.
      4. When the list runs out, report count and total.

      Step 2 is a **loop**: an instruction that repeats an action, here once per parcel. Step 3 is a **condition**: a yes-or-no test that decides what happens next. "Greater than 3" means a 3 lb parcel is *not* accepted. The diagram shows the same steps as a flow you can follow with your finger.
    diagram:
      caption: The heavy-parcel loop. Every parcel passes through the test exactly once.
      description: Start by setting count and total to zero, then take the next weight. The next weight goes to the test "Is it greater than 3?". If yes, add 1 to count and the weight to total, then loop back to take the next weight. If no, loop straight back to take the next weight. When no weights are left, report count and total.
      nodes:
        - id: start
          label: Set count = 0, total = 0
          col: 0
          row: 0
        - id: next
          label: Take the next weight
          col: 1
          row: 0
          tone: accent
        - id: test
          label: Is it greater than 3?
          col: 2
          row: 0
          tone: warn
        - id: add
          label: count + 1, total + weight
          col: 3
          row: 0
          tone: data
        - id: done
          label: Report count and total
          col: 1
          row: 1
      edges:
        - from: start
          to: next
        - from: next
          to: test
        - from: test
          to: add
          label: 'yes'
        - from: add
          to: next
          label: loop
          bend: 2
        - from: test
          to: next
          label: 'no'
          bend: -1
        - from: next
          to: done
          label: no weights left
  - id: algorithms-and-programs.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.algorithms-and-programs
    title: Watch the numbers change, one parcel at a time
    markdown: |-
      The values a program is holding at a given moment are its **state**. Here the state is just two numbers, count and total. Tracing a program means writing down the state after every step. For the list [2, 5, 1, 4]:

      | Weight inspected | Greater than 3? | Count after | Total after |
      | ---: | --- | ---: | ---: |
      | 2 | No | 0 | 0 |
      | 5 | Yes | 1 | 5 |
      | 1 | No | 1 | 5 |
      | 4 | Yes | 2 | 9 |

      Count is measured in parcels and total in pounds. Both are numbers, but they answer different questions. Here is the same procedure as real Python, printing the state after each parcel:

      ```python run
      weights = [2, 5, 1, 4]           # parcel weights in pounds
      count = 0                        # parcels accepted so far
      total = 0                        # pounds accepted so far
      for w in weights:                # the loop: inspect each parcel once, in order
          if w > 3:                    # the condition: strictly heavier than 3 lb
              count = count + 1        # one more parcel...
              total = total + w        # ...and its weight
          print(f"inspected {w}: count={count}, total={total}")   # state after this step
      print("result: count =", count, "| total =", total, "lb")
      ```

      The printed lines match the table row for row.

      :::predict Change the list to [6, 3, 4]. What are count and total at the end?
      Count 2 and total 10. The 6 is accepted (count 1, total 6), the 3 is rejected because 3 is not *greater* than 3, and the 4 is accepted (count 2, total 10). Edit the first line and run it to check.
      :::
    bridges: []
  - id: algorithms-and-programs.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.algorithms-and-programs
    title: Hunt for bugs where the rule changes its mind
    markdown: |-
      Suppose a teammate types `w >= 3` ("at least 3") instead of `w > 3`. Which test would catch it?

      A **boundary case** is an input sitting right where a rule flips from one answer to the other. Here that's 3. The two versions agree on every weight except exactly 3, so [3] is the test that tells them apart: the correct program reports count 0, the buggy one reports count 1. Change `>` to `>=` in the code above and run it on [3] to see the bug appear.

      :::mixup "If it works on lots of normal examples, it's correct."
      Testing [5], [7], and [9] feels thorough, but both versions pass all three. A hundred tests far from the boundary tell you less than one test sitting on it. Pick tests where a likely mistake would give a different answer.
      :::

      Three more tests come straight from the contract:

      | Test | Expected | What it catches |
      | --- | --- | --- |
      | [] (empty list) | count 0, total 0 | A program that crashes or invents a parcel |
      | [4, 4] | count 2, total 8 | Counting different weights instead of parcels |
      | [−2] | rejected with an error | Quietly accepting a weight the contract forbids |
    bridges: []
  - id: algorithms-and-programs.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.algorithms-and-programs
    markdown: Trace the parcel loop on new lists, then pick the tests that catch bugs in a cinema app, a step counter, and a thermostat.
    takeaway: |-
      A program follows its steps exactly. Trace its state to see what it really does, and test right at the boundaries, where a small slip changes the answer.
  - id: algorithms-and-programs.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.algorithms-and-programs
    markdown: |-
      Programs implement algorithms using explicit inputs, state, control flow, and outputs; pseudocode and small traces help check their behavior.
  - id: algorithms-and-programs.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.algorithms-and-programs
    title: Fixed steps, learned numbers
    markdown: |-
      Our parcel counter never learns. We chose the threshold 3, and the program does the same thing on every run.

      Now picture an AI model that predicts delivery time. As you saw in *Training and inference*, it holds **learned weights**, numbers adjusted from examples during training. But look at what runs when it makes a prediction: read the inputs, multiply by the stored weights, add, report. Those are fixed, explicit steps, just like our loop. Only the stored numbers came from learning.

      So an AI system usually contains two different programs:

      | | Prediction program | Training program |
      | --- | --- | --- |
      | Runs when | Someone asks for a prediction | Someone is teaching the model |
      | Changes the weights? | No | Yes, a little each step |

      When you look at any AI system, ask two questions: which steps run, and which stored numbers, if any, change?
    bridges: []
  - id: algorithms-and-programs.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.algorithms-and-programs
    title: Right answer, and how much work?
    markdown: |-
      Our loop looks at each parcel once, so a list twice as long takes twice as many inspections. A clumsier design might compare every parcel with every other parcel, and get the same answer with far more work. A later lesson on algorithm cost gives these growth patterns names.

      Speed and correctness are separate questions. A lightning-fast loop that uses `>=` is still wrong on [3].

      Here's how Mia checks a teammate's faster version of the parcel counter. She writes a **test suite**, a set of inputs with the answers the contract requires, and runs both versions on it:

      - [2, 5, 1, 4] → count 2, total 9 (the traced example)
      - [3] → count 0, total 0 (the boundary)
      - [] → count 0, total 0 (the empty list)
      - [4, 4] → count 2, total 8 (repeated weights)

      The new version fails only the [3] test. Mia doesn't just fix the line; she keeps [3] in the suite so the same slip can never sneak back in unnoticed.
    bridges: []
