    | --- | --- | --- | --- |

    | 2 | No | 0 | 0 |

    | 5 | Yes | 1 | 5 |

    | 1 | No | 1 | 5 |

    | 4 | Yes | 2 | 9 |


    Count measures parcels; total measures kilograms. They are different outputs, even though both are numbers.'
  bridges: []
- id: algorithms-and-programs.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.algorithms-and-programs
  title: Test where the decision changes
  markdown: 'A **boundary case** sits where a rule changes its behavior. The weight 3 is excluded by “greater than
    3” but included by “at least 3.” Testing [3] therefore distinguishes the intended procedure from that particular
    mistake. Testing [5] does not: both versions accept it.


    An empty list should report count 0 and total 0. The list [4, 4] should report count 2 and total 8; equal measurements
    can belong to separate parcels. A negative weight violates our input contract. The surrounding program should
    reject it or request a correction rather than quietly invent a parcel.'
  text_mode: 'A **boundary case** sits where a rule changes its behavior. The weight 3 is excluded by “greater than
    3” but included by “at least 3.” Testing [3] therefore distinguishes the intended procedure from that particular
    mistake. Testing [5] does not: both versions accept it.


