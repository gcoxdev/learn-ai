        id: algorithms-and-programs.transfer.v2.4
        retired: true
  - id: algorithms-and-programs.base.v3
    objective_ref: objective.algorithms-and-programs
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Write a trace table. For each weight, ask "strictly greater than 3?" and update count and total only on a yes. A weight of exactly 3 is a no.
    remediation_scene: algorithms-and-programs.s3
    numeric_fields:
      - id: count
        label: Accepted parcels
      - id: total
        label: Total weight in pounds
    absolute_tolerance: 1e-6
    variants:
      - id: algorithms-and-programs.base.v3.1
        prompt: Run the heavy-parcel loop (accept weights strictly greater than 3) on [3, 6, 4]. Report the final count and total.
        answers:
          count: 2
          total: 10
        reason_answer: b
        reason_options:
          - id: a
            text: Accept the 3 as well, since it sits right at the limit.
          - id: b
            text: Inspect each weight once and accept it only if it is above 3.
          - id: c
            text: Count each different weight once, not each parcel.
        feedback: The 3 is rejected, then 6 and 4 are accepted, giving count 2 and total 10. Accepting the 3 would give count 3 and total 13, which is the "at least 3" bug.
      - id: algorithms-and-programs.base.v3.2
        prompt: Run the heavy-parcel loop (accept weights strictly greater than 3) on [7, 7, 2]. Report the final count and total.
        answers:
          count: 2
          total: 14
        reason_answer: c
        reason_options:
          - id: a
            text: Count each different weight once, not each parcel.
          - id: b
            text: Accept the 2 as well, since every parcel has some weight.
          - id: c
            text: Inspect each weight once and accept it only if it is above 3.
        feedback: Two separate 7 lb parcels both pass, so count is 2 and total is 14. Counting the weight 7 only once would give count 1, but two parcels can weigh the same.
      - id: algorithms-and-programs.base.v3.3
        prompt: Run the heavy-parcel loop (accept weights strictly greater than 3) on [4, 3, 8, 2]. Report the final count and total.
        answers:
          count: 2
          total: 12
        reason_answer: a
        reason_options:
          - id: a
            text: Inspect each weight once and accept it only if it is above 3.
          - id: b
            text: Accept the 3 as well, since it sits right at the limit.
          - id: c
            text: Add up every weight in the list, then count the parcels above 3.
        feedback: Only 4 and 8 pass, so count 2 and total 4 + 8 = 12. Adding every weight would give 17, but the total only includes accepted parcels.
      - id: algorithms-and-programs.base.v3.4
        prompt: Run the heavy-parcel loop (accept weights strictly greater than 3) on [3, 3, 9]. Report the final count and total.
        answers:
          count: 1
          total: 9
        reason_answer: b
        reason_options:
          - id: a
            text: Accept both 3s as well, since they sit right at the limit.
          - id: b
            text: Inspect each weight once and accept it only if it is above 3.
          - id: c
            text: Count each different weight once, not each parcel.
        feedback: Both 3s fail "greater than 3", so only the 9 counts, giving count 1 and total 9. Accepting the 3s would give count 3 and total 15.
      - id: algorithms-and-programs.base.v3.5
        prompt: Run the heavy-parcel loop (accept weights strictly greater than 3) on [10, 2, 4, 4]. Report the final count and total.
        answers:
          count: 3
          total: 18
        reason_answer: c
        reason_options:
          - id: a
            text: Count each different weight once, not each parcel.
          - id: b
            text: Stop at the first rejected weight and report what you have.
          - id: c
            text: Inspect each weight once and accept it only if it is above 3.
        feedback: 10, 4, and 4 pass, giving count 3 and total 18. The loop keeps going after rejecting the 2; stopping there would miss both 4 lb parcels.
  - id: algorithms-and-programs.transfer.v3
    objective_ref: objective.algorithms-and-programs
    task: transfer
    response_type: single_choice
    points: 1
    hint: Find the value where the rule flips its answer, or the input the contract is silent about. The most useful test is one where the correct and the buggy program disagree.
    remediation_scene: algorithms-and-programs.s4
    variants:
      - id: algorithms-and-programs.transfer.v3.1
        prompt: A cinema app should admit viewers older than 12 to a film. The code says `age >= 12`. Which single test exposes the bug?
        options:
          - id: a
            text: Age 15, expecting the viewer to be admitted
          - id: b
            text: Age 12, expecting the viewer to be refused
          - id: c
            text: Age 8, expecting the viewer to be refused
        answer: b
        feedback: '"Older than 12" and "at least 12" disagree only at exactly 12, so that is the test that tells them apart. Ages 15 and 8 give the same answer under both versions, so they pass either way.'
      - id: algorithms-and-programs.transfer.v3.2
        prompt: A fitness app should count the days with more than 10,000 steps. Given [12000, 12000, 9000], it reports 1 day. Which mistake explains this?
        options:
          - id: a
            text: It counted different step totals, not separate days
          - id: b
            text: It used "at least 10,000" instead of "more than"
          - id: c
            text: It added up the steps instead of counting the days
        answer: a
        feedback: Two separate days both had 12,000 steps, so the right answer is 2. Counting the value 12,000 once gives 1. "At least" would change nothing here, since no day is exactly 10,000, and adding steps would give 24,000, not 1.
      - id: algorithms-and-programs.transfer.v3.3
        prompt: A trained spam filter checks a new email and labels it junk. What happens to the filter's learned weights during that check?
        options:
          - id: c
            text: They stay the same; the check runs fixed steps with them
          - id: a
            text: They shift a little, since every email is a new example
          - id: b
            text: They reset, so each email is judged from a fresh start
        answer: c
        feedback: Making a prediction runs fixed steps that read the stored weights; it doesn't change them. Weights change only when a separate training program runs, for example on emails people have marked as junk.
      - id: algorithms-and-programs.transfer.v3.4
        prompt: A thermostat should switch the heating on when the room is below 65 °F. You can afford three tests. Which set is most useful?
        options:
          - id: b
            text: 52 °F, 57 °F, and 62 °F
          - id: c
            text: 72 °F, 77 °F, and 82 °F
          - id: a
            text: 64 °F, 65 °F, and 66 °F
        answer: a
        feedback: Tests on either side of 18, and at 18 itself, catch the likeliest slip ("at most 18" instead of "below 18"). Tests far from the boundary give the same result for the correct and the buggy rule.
      - id: algorithms-and-programs.transfer.v3.5
        prompt: A class-average program crashes when a teacher gives it an empty list of scores. What is the best fix?
        options:
          - id: b
            text: Treat an empty list as one score of 0, so the average is 0
          - id: a
            text: Decide in the contract what an empty list should report
          - id: c
            text: Leave it alone, since empty classes are rare in practice
        answer: a
        feedback: An empty list is an allowed input the contract never covered, so decide what the program should do (report "no scores" or reject it) and add a test for it. Pretending there is a score of 0 hides the problem and gives a misleading average.
      - id: algorithms-and-programs.transfer.v3.6
        prompt: Two parcel counters give identical answers on every test. Version A looks at each parcel once; version B compares every parcel with every other. What differs for 1,000 parcels?
        options:
          - id: a
            text: B checks more pairs, so its answers are more trustworthy
          - id: c
            text: B does far more work to reach the same answers
          - id: b
            text: Nothing, since matching answers mean matching work
        answer: c
        feedback: A needs 1,000 inspections; B needs about 500,000 comparisons, one per pair. Correctness and cost are separate questions, so identical answers can hide very different amounts of work, and extra comparisons don't add accuracy here.
