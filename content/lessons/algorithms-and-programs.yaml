    a separate procedure changes the weights using examples.


    A program can therefore contain a learned model without learning new settings each time it runs. Ask which instructions
    execute and which stored values, if any, change.'
  bridges: []
- id: algorithms-and-programs.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.algorithms-and-programs
  title: Reason about correctness and cost separately
  markdown: 'Our loop inspects each parcel once. Doubling the list length doubles the number of inspections; it
    does not require comparing every parcel with every other parcel. Later lessons give this growth a formal name.


    Speed and correctness answer different questions. A fast loop using “at least 3” still gives the wrong answer
    for [3]. A test suite is a collection of examples with expected results. Passing it supports confidence on the
    cases covered, but a few examples are not a proof for all allowed lists. Use traces to explain failures, then
    add cases that expose the underlying mistake.'
