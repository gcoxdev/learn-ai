      - prompt: Which single-parcel test distinguishes “greater than 3” from the mistaken “at least 3”?
        answer: a
        options:
          - id: a
            text: '[3], expecting count 0 and total 0.'
          - id: b
            text: '[5], expecting count 1 and total 5.'
          - id: c
            text: '[2], expecting count 0 and total 0.'
        feedback: The procedures disagree exactly at equality.
        id: algorithms-and-programs.transfer.v2.1
        retired: true
      - prompt: A loop reports count 1 for [4, 4]. What likely misunderstanding does that reveal?
        answer: a
        options:
          - id: b
            text: It applied a threshold greater than 3.
          - id: c
            text: It initialized the total to zero.
          - id: a
            text: It counted distinct weights instead of parcels.
        feedback: Two entries represent two parcels, even when their weights match.
        id: algorithms-and-programs.transfer.v2.2
        retired: true
      - prompt: A trained delivery predictor reads fixed weights and calculates an answer. Is that execution itself another training step?
        answer: a
        options:
          - id: c
            text: Yes; new inputs are automatically new training examples.
          - id: a
            text: No; prediction need not change the stored weights.
          - id: b
            text: Yes; every multiplication changes the stored weights.
        feedback: A training procedure must actually update learned settings; prediction alone need not.
        id: algorithms-and-programs.transfer.v2.3
        retired: true
      - prompt: A faster implementation passes [2] and [5] but has not been tested at 3. What evidence is still missing?
        answer: a
        options:
          - id: a
            text: A check of the threshold’s equality behavior.
          - id: b
            text: A demonstration that count and weight use the same unit.
          - id: c
            text: A demonstration that an empty list contains one parcel.
