schema_version: 0.2-draft
lesson:
  id: algorithms-and-programs
  version: 0.4.0-draft
  title: Describe a computation so someone else can follow it
  state: draft
  summary: '"Count the heavy parcels" sounds simple until someone asks whether 3 lb counts. Trace a real loop step by step, run it, and find the one test that catches the bug.'
  slot: M02.2
  category: learning
  sources:
    - title: 'Python tutorial: conditions and loops'
      url: https://docs.python.org/3/tutorial/controlflow.html
  archetype: mechanism
objectives:
  - id: objective.algorithms-and-programs
    version: 3-draft
    statement: Trace a loop’s changing state and choose test cases that distinguish an intended condition from an incorrect implementation.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - algorithms-and-programs.base.v3
      - algorithms-and-programs.transfer.v3
    prerequisites:
