scenes:
- id: algorithms-and-programs.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.algorithms-and-programs
  title: A recipe needs precise instructions
  markdown: 'An **algorithm** is a step-by-step procedure for a job. A **program** expresses instructions in a form
    a computer can run. One algorithm can be written in different programming languages.


    “Find the large deliveries” is too vague. Does large mean heavier than 3 kilograms, at least 3 kilograms, or
    something else? Our task will be precise: given a list of nonnegative whole-number parcel weights, count the
    parcels strictly heavier than 3 kilograms and add their weights. This agreement about allowed inputs and required
    outputs is the program’s **contract**.'
  text_mode: 'An **algorithm** is a step-by-step procedure for a job. A **program** expresses instructions in a
    form a computer can run. One algorithm can be written in different programming languages.


    “Find the large deliveries” is too vague. Does large mean heavier than 3 kilograms, at least 3 kilograms, or
    something else? Our task will be precise: given a list of nonnegative whole-number parcel weights, count the
    parcels strictly heavier than 3 kilograms and add their weights. This agreement about allowed inputs and required
    outputs is the program’s **contract**.'
  bridges: []
- id: algorithms-and-programs.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.algorithms-and-programs
  title: Read a program without learning a language first
  markdown: 'Here is **pseudocode**: a readable description of steps, rather than code for a particular programming
    language.


    1. Set count to 0 and total to 0.

    2. For each weight in the list, inspect that weight once.

    3. If the weight is greater than 3, add 1 to count and add the weight to total.

    4. After inspecting the whole list, report count and total.


    The “for each” instruction is a **loop**, a repeated action. The “if” instruction is a **condition**, a yes-or-no
    test that decides which action to take. Greater than excludes equality.'
  text_mode: 'Here is **pseudocode**: a readable description of steps, rather than code for a particular programming
