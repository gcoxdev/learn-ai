scenes:
- id: deep-learning-revival.s1
  title: Credit assignment made layers trainable
  type: explanation
  depth: intuition
  objective_refs:
  - objective.deep-learning-revival
  markdown: Backpropagation efficiently computes how a loss depends on earlier parameters through a computation
    graph. The 1986 work on learning internal representations helped popularize its use in neural networks, building
    on earlier differentiation and learning ideas. It did not mean every deep model suddenly became easy to optimize.
  text_mode: Backpropagation efficiently computes how a loss depends on earlier parameters through a computation
    graph. The 1986 work on learning internal representations helped popularize its use in neural networks, building
    on earlier differentiation and learning ideas. It did not mean every deep model suddenly became easy to optimize.
  bridges: []
- id: deep-learning-revival.s2
  title: Architectures used structure in the data
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.deep-learning-revival
  markdown: Convolution shares a filter across locations, encoding assumptions useful for images. Rather than learning
    an unrelated detector for every pixel location, a network can reuse local patterns. Pooling, nonlinearities,
    and later residual connections affected how information and gradients move through a network.
  text_mode: Convolution shares a filter across locations, encoding assumptions useful for images. Rather than learning
    an unrelated detector for every pixel location, a network can reuse local patterns. Pooling, nonlinearities,
    and later residual connections affected how information and gradients move through a network.
  bridges: []
- id: deep-learning-revival.s3
  title: Data and hardware changed the feasible experiment
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.deep-learning-revival
  markdown: Large labeled image datasets enabled standardized comparisons. GPUs made many numerical operations practical
    in parallel. AlexNet’s 2012 ImageNet result combined a convolutional design with training and compute choices.
    Its result is evidence for that task and setup, not a controlled proof that any one ingredient caused all the
    improvement.
  text_mode: Large labeled image datasets enabled standardized comparisons. GPUs made many numerical operations
    practical in parallel. AlexNet’s 2012 ImageNet result combined a convolutional design with training and compute
    choices. Its result is evidence for that task and setup, not a controlled proof that any one ingredient caused
    all the improvement.
  bridges: []
- id: deep-learning-revival.s4
  title: Distinguish an invention from an ecosystem
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.deep-learning-revival
  markdown: A useful explanation tracks algorithm, architecture, data, hardware, optimization, and evaluation together.
    To test an ingredient’s effect, compare otherwise matched systems through an ablation. Today’s training pipelines
    still depend on this combination, even when the visible product is a chat window rather than an image classifier.
  text_mode: A useful explanation tracks algorithm, architecture, data, hardware, optimization, and evaluation together.
    To test an ingredient’s effect, compare otherwise matched systems through an ablation. Today’s training pipelines
    still depend on this combination, even when the visible product is a chat window rather than an image classifier.
  bridges: []
