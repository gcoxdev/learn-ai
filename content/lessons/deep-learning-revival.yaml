assessment_families:
- id: deep-learning-revival.base
  objective_ref: objective.deep-learning-revival
  task: base
  response_type: single_choice
  points: 1
  hint: 'Architectures used structure in the data: trace the inputs, operation, and result before choosing.'
  remediation_scene: deep-learning-revival.s2
  variants:
  - id: deep-learning-revival.base.1
    prompt: What quantity does backpropagation efficiently compute?
    options:
    - id: c
      text: A complete biological learning theory
    - id: a
      text: Loss derivatives through composed operations
    - id: b
      text: A guaranteed globally optimal solution
    answer: a
    feedback: Gradients support an optimizer; they are not the same as optimization success.
    retired: true
  - id: deep-learning-revival.base.2
    prompt: What does convolutional weight sharing reuse?
    options:
    - id: a
      text: The same learned filter across locations
    - id: b
      text: Only the final class label
    - id: c
      text: A separate unrelated model for every pixel
    answer: a
    feedback: Sharing encodes a useful structural assumption and reduces independent parameters.
    retired: true
- id: deep-learning-revival.transfer
  objective_ref: objective.deep-learning-revival
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Distinguish an invention from an ecosystem: trace the inputs, operation, and result before choosing.'
  remediation_scene: deep-learning-revival.s4
  variants:
  - id: deep-learning-revival.transfer.1
    prompt: A system improves after both data and hardware change. Can one improvement source be isolated from that
      comparison alone?
    options:
    - id: a
      text: No; matched ablations are needed
    - id: b
      text: Yes; the newest architecture gets all credit
    - id: c
      text: Yes; hardware never affects feasible training
    answer: a
    feedback: Several changed conditions confound attribution.
    retired: true
  - id: deep-learning-revival.transfer.2
    prompt: Why did large benchmark datasets matter?
    options:
    - id: b
      text: They guaranteed deployment reliability everywhere
    - id: c
      text: They removed label errors by definition
    - id: a
      text: They supported training and more standardized comparisons
    answer: a
    feedback: Benchmarks provide common evidence under their scope, not universal guarantees.
    retired: true
- id: deep-learning-revival.base.v2
  objective_ref: objective.deep-learning-revival
  task: base
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: deep-learning-revival.s3
  variants:
  - prompt: Backpropagation computes how loss depends on earlier weights. What job remains for the optimizer?
    answer: a
    options:
    - id: b
      text: Replace every layer with a recorded target
    - id: c
      text: Collect the held-out examples used for evaluation
    - id: a
      text: Choose weight updates using the available information
    feedback: Derivatives describe sensitivity; an optimizer chooses the update procedure.
    id: deep-learning-revival.base.v2.1
  - prompt: A model uses the same small detector at several image positions. Which design choice is being described?
    answer: a
    options:
    - id: c
      text: A claim that each hidden value has a human name
    - id: a
      text: Architectural reuse of a local calculation
    - id: b
      text: A larger count of independently labeled test images
    feedback: The architecture can encode useful assumptions about repeated local patterns.
    id: deep-learning-revival.base.v2.2
  - prompt: A GPU makes more training operations feasible within a time budget. What role does it play?
    answer: a
    options:
    - id: a
      text: Computing resources for executing the procedure
    - id: b
      text: The target meaning assigned to each example
    - id: c
      text: The objective defining which errors matter
    feedback: Hardware affects feasible work; it does not specify the learning goal.
    id: deep-learning-revival.base.v2.3
  - prompt: A model combines several learned stages before producing an answer. What does its depth describe?
    answer: a
    options:
    - id: b
      text: The number of documents in its evaluation report
    - id: c
      text: The certainty that its final answer is correct
    - id: a
      text: The staged structure of its computation
    feedback: Depth describes architecture, not an automatic measure of correctness.
    id: deep-learning-revival.base.v2.4
- id: deep-learning-revival.transfer.v2
  objective_ref: objective.deep-learning-revival
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: deep-learning-revival.s3
  variants:
  - prompt: Two systems differ in both data and architecture, and one scores higher. What is not isolated?
    answer: a
    options:
    - id: b
      text: Which complete system scored higher on the given test
    - id: c
      text: The existence of the recorded comparison
    - id: a
      text: The separate contribution of either change
    feedback: Several simultaneous changes confound a single-cause explanation.
    id: deep-learning-revival.transfer.v2.1
  - prompt: A benchmark gain follows a longer training run with the same model design. What should a comparison
      report?
    answer: a
    options:
    - id: c
      text: The longer run as a new definition of the task
    - id: a
      text: The changed resource budget as part of the result
    - id: b
      text: The gain as evidence that architecture alone improved
    feedback: Comparisons need the conditions that changed, including compute.
    id: deep-learning-revival.transfer.v2.2
  - prompt: A hidden feature activates for several unrelated image patterns. Which interpretation is safer?
    answer: a
    options:
    - id: a
      text: Its numerical role may not match one simple human concept
    - id: b
      text: It must represent a single named object in every context
    - id: c
      text: Its existence establishes that the model’s explanations are faithful
    feedback: Learned representations can have useful roles without clean human labels.
    id: deep-learning-revival.transfer.v2.3
  - prompt: A team removes one component while keeping the remaining setup comparable. What is it investigating?
    answer: a
    options:
    - id: b
      text: A guaranteed ranking across every future task
    - id: c
      text: Whether the removed component was the only historical cause
    - id: a
      text: The component’s contribution under those conditions
    feedback: An ablation supplies bounded evidence about a controlled change.
    id: deep-learning-revival.transfer.v2.4
