      - id: deep-learning-revival.calc.v3.2
        prompt: A convolutional layer has 6 filters of size 5 × 5, each with one bias. A fully connected layer instead links every pixel of a 28 × 28 image to 100 hidden units, with no biases. Record each layer's number of learned numbers.
        feedback: 'Convolution: 6 × (25 + 1) = 156, as in LeNet-5''s first layer. Fully connected: 784 × 100 = 78,400.'
        answers:
          conv_params: 156
          dense_params: 78400
        reason_answer: sharing
        reason_options:
          - id: sharing
            text: The same filter weights are reused at every image position.
          - id: nobias
            text: The convolutional layer leaves out the bias terms.
          - id: fewer
            text: The convolutional layer looks at fewer of the image's pixels.
      - id: deep-learning-revival.calc.v3.3
        prompt: A convolutional layer has 16 filters of size 3 × 3, each with one bias. A fully connected layer instead links every pixel of a 20 × 20 image to 20 hidden units, with no biases. Record each layer's number of learned numbers.
        feedback: 'Convolution: 16 × (9 + 1) = 160. Fully connected: 400 × 20 = 8,000.'
        answers:
          conv_params: 160
          dense_params: 8000
        reason_answer: sharing
        reason_options:
          - id: nobias
