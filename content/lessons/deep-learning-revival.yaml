  - id: deep-learning-revival.base.v3
    objective_ref: objective.deep-learning-revival
    task: base
    response_type: single_choice
    points: 1
    hint: Give each ingredient its own job. Backpropagation measures how the loss responds to each weight, architecture decides what the weights can express, data supplies examples, and GPUs supply speed.
    remediation_scene: deep-learning-revival.s2
    variants:
      - id: deep-learning-revival.base.v3.1
        prompt: During training, what does backpropagation compute for each weight?
        options:
          - id: a
            text: The best possible value that weight could take
          - id: b
            text: How much the loss changes when that weight changes
          - id: c
            text: Which training examples that weight should see next
        answer: b
        feedback: Backpropagation gives each weight's gradient, the loss's sensitivity to it. An optimizer then uses that to nudge the weight; nothing tells you the best value directly.
      - id: deep-learning-revival.base.v3.2
        prompt: A tiny network has x = 1, h = w1·x, y = w2·h, with w1 = 2, w2 = 3 and target 10. So h = 2, y = 6, and dL/dy = 2(6 − 10) = −8. What is dL/dw1?
        options:
          - id: a
            text: '−16'
          - id: b
            text: '−8'
          - id: c
            text: '−24'
        answer: c
        feedback: 'The blame reaches h through w2: dL/dh = −8 × 3 = −24, then w1 through x = 1: dL/dw1 = −24 × 1 = −24. The tempting −16 is dL/dy × h, which is the gradient for w2, not w1.'
      - id: deep-learning-revival.base.v3.3
        prompt: While training a recurrent network, the error signal is multiplied by 0.5 at each step back in time. Roughly how big is it 10 steps back?
        options:
          - id: a
            text: About 0.001 of its size
          - id: b
            text: About 5 times its size
          - id: c
            text: About 0.05 of its size
        answer: a
        feedback: Ten multiplications by 0.5 give 0.5¹⁰ = 1/1024, about 0.001. That's the vanishing gradient the LSTM was designed to fix; 5 comes from multiplying 0.5 by 10 instead of raising it to the 10th power.
      - id: deep-learning-revival.base.v3.4
        prompt: Convolution and backpropagation were both in use by 1990. Why did the big image-recognition breakthrough wait until 2012?
        options:
          - id: a
            text: Huge labeled datasets and fast, programmable GPUs had just arrived
          - id: b
            text: Backpropagation was first shown to work on images only in 2011
          - id: c
            text: Convolutional layers were invented specifically for AlexNet
        answer: a
        feedback: ImageNet (2009) and general-purpose GPU programming (2007) supplied the data and speed that old ideas needed. LeNet had already applied backpropagation and convolution to images around 1989.
  - id: deep-learning-revival.transfer.v3
    objective_ref: objective.deep-learning-revival
    task: transfer
    response_type: single_choice
    points: 1
    hint: To credit one ingredient, change only that ingredient and measure. To choose an architecture, ask whether the same pattern can appear anywhere in the input.
    remediation_scene: deep-learning-revival.s6
    variants:
      - id: deep-learning-revival.transfer.v3.1
        prompt: A new speech model beats last year's by 6 points. It is larger, used three times the data, and has a new architecture. The team credits the architecture. What would test that claim?
        options:
          - id: a
            text: Train the new architecture at the old size, on the old data
          - id: b
            text: Train the new model for longer and see if the gap grows
          - id: c
            text: Test both models on a harder speech dataset and compare
        answer: a
        feedback: That's an ablation, changing only the architecture while size and data stay fixed. Longer training or a harder test still mixes all three changes together.
      - id: deep-learning-revival.transfer.v3.2
        prompt: A factory wants to spot scratches anywhere on photos of phone screens. Why is a convolutional network a natural fit?
        options:
          - id: a
            text: It gives each pixel position its own separate detector
          - id: b
            text: A scratch looks alike wherever it is, so one detector is reused
          - id: c
            text: It needs no labeled examples of scratches to be trained
        answer: b
        feedback: Weight sharing lets one learned scratch filter work at every position, with far fewer weights. Giving each position its own detector is what a fully connected layer does, and a convolutional network still needs labeled examples.
      - id: deep-learning-revival.transfer.v3.3
        prompt: A student's network trains 30 times faster after moving from a laptop processor to a GPU, with the same code and data. What has the GPU changed?
        options:
          - id: a
            text: The architecture, since the GPU adds extra layers
          - id: b
            text: The objective, since the GPU measures error differently
          - id: c
            text: How many experiments fit into the time available
        answer: c
        feedback: A GPU does the same arithmetic in parallel, so the same training finishes sooner and you can try more ideas. The model and the loss it minimizes are unchanged.
      - id: deep-learning-revival.transfer.v3.4
        prompt: AlexNet's authors removed one middle convolutional layer at a time and lost about 2 points of top-1 accuracy each time. What does this show?
        options:
          - id: a
            text: The extra depth was contributing to the result
          - id: b
            text: The GPUs mattered more than the layers did
          - id: c
            text: A two-layer network would have done equally well
        answer: a
        feedback: Removing one layer while keeping everything else fixed cost accuracy, so the layers were doing real work. The experiment didn't change the hardware, and it points away from a very shallow network, not toward one.
