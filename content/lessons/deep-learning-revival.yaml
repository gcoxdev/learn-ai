  version: 0.1.0-draft
  title: Why deeper networks became practical
  state: draft
  summary: Backpropagation, architectural biases, larger datasets, accelerators, and engineering improvements worked
    together to make deeper neural systems useful at scale.
  slot: M01.6
  category: learning
  minutes: 12
  sources:
  - title: AlexNet — original paper
