scenes:
  - id: deep-learning-revival.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.deep-learning-revival
    title: The 2012 landslide
    markdown: |-
      Every year from 2010, computer-vision teams competed on the ImageNet challenge: label 1.2 million training photos into 1,000 categories, then face a test set. Programs got five guesses per photo, and the score was the **top-5 error**, the share of photos where all five guesses were wrong.

      In 2012, a Toronto team of Alex Krizhevsky, Ilya Sutskever, and Geoffrey Hinton entered a deep neural network later called AlexNet. It scored 15.3% top-5 error. The next-best entry scored 26.2%. The gap stunned the field, and within a few years nearly every competitive entry was a deep network.

      Almost nothing in AlexNet was brand new. The surprise was that four ingredients, developed separately over decades, finally arrived together:
    diagram:
      caption: Four ingredients, developed separately, combined in AlexNet in 2012.
      description: Four ingredient boxes sit in a row. Convolutional architecture (1980s) points to AlexNet. Backpropagation training (popularized 1986) points to AlexNet. Large labeled data (ImageNet, 2009) points to AlexNet. Fast GPUs (general-purpose programming from 2007) point to AlexNet. AlexNet (2012) then points to the deep-learning boom in speech, translation, and games.
      nodes:
        - id: arch
          label: Convolutional layers
          note: Fukushima 1980, LeCun 1989
          col: 0
          row: 0
        - id: backprop
          label: Backpropagation
          note: popularized 1986
