assessment_families:
- id: deep-learning-revival.base
  objective_ref: objective.deep-learning-revival
  task: base
  response_type: single_choice
  points: 1
  hint: 'Architectures used structure in the data: trace the inputs, operation, and result before choosing.'
  remediation_scene: deep-learning-revival.s2
  variants:
  - id: deep-learning-revival.base.1
    prompt: What quantity does backpropagation efficiently compute?
    options:
    - id: c
      text: A complete biological learning theory
    - id: a
      text: Loss derivatives through composed operations
    - id: b
      text: A guaranteed globally optimal solution
    answer: a
    feedback: Gradients support an optimizer; they are not the same as optimization success.
  - id: deep-learning-revival.base.2
    prompt: What does convolutional weight sharing reuse?
    options:
    - id: a
      text: The same learned filter across locations
    - id: b
      text: Only the final class label
    - id: c
      text: A separate unrelated model for every pixel
    answer: a
    feedback: Sharing encodes a useful structural assumption and reduces independent parameters.
- id: deep-learning-revival.transfer
  objective_ref: objective.deep-learning-revival
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Distinguish an invention from an ecosystem: trace the inputs, operation, and result before choosing.'
  remediation_scene: deep-learning-revival.s4
  variants:
  - id: deep-learning-revival.transfer.1
    prompt: A system improves after both data and hardware change. Can one improvement source be isolated from that
      comparison alone?
    options:
    - id: a
      text: No; matched ablations are needed
    - id: b
      text: Yes; the newest architecture gets all credit
    - id: c
      text: Yes; hardware never affects feasible training
    answer: a
    feedback: Several changed conditions confound attribution.
  - id: deep-learning-revival.transfer.2
    prompt: Why did large benchmark datasets matter?
    options:
    - id: b
      text: They guaranteed deployment reliability everywhere
    - id: c
      text: They removed label errors by definition
    - id: a
      text: They supported training and more standardized comparisons
    answer: a
    feedback: Benchmarks provide common evidence under their scope, not universal guarantees.
