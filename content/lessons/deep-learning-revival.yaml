  - id: deep-learning-revival.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.deep-learning-revival
    title: Backpropagation reaches the hidden layers
    markdown: |-
      The AI-winters lesson ended with a missing piece: a hidden layer can compute XOR, but how do you *train* one? In 1986 David Rumelhart, Geoffrey Hinton, and Ronald Williams showed in *Nature* that **backpropagation** does it. The core idea, sending the error backward through the network with the chain rule of calculus, had appeared earlier (Seppo Linnainmaa in 1970, Paul Werbos in 1974), but their paper showed networks learning useful hidden features and made the method famous.

      Take the smallest possible deep network: input $x = 2$, hidden value $h = w_1 x$, output $y = w_2 h$, with $w_1 = 3$, $w_2 = 0.5$, and target 5. The loss is $(y - 5)^2$.

      ```python run
      x, target = 2.0, 5.0
      w1, w2 = 3.0, 0.5

      def loss(w1, w2):
          h = w1 * x            # hidden layer
          y = w2 * h            # output layer
          return (y - target) ** 2

      # Forward pass
      h = w1 * x
      y = w2 * h
      print(f"h = {h}, y = {y}, loss = {loss(w1, w2)}")

      # Backward pass: the chain rule, from the output back to the first layer
      dL_dy = 2 * (y - target)
      dL_dw2 = dL_dy * h
      dL_dh = dL_dy * w2
      dL_dw1 = dL_dh * x
      print(f"dL/dy = {dL_dy}, dL/dw2 = {dL_dw2}, dL/dh = {dL_dh}, dL/dw1 = {dL_dw1}")

      # Check dL/dw1 by nudging w1 a tiny bit and watching the loss
      eps = 1e-6
      print(f"numerical check for dL/dw1: {(loss(w1 + eps, w2) - loss(w1 - eps, w2)) / (2 * eps):.4f}")
      ```

      Forward: $h = 6$, $y = 3$, loss 4. Backward: the output is 2 too low, so $\partial L/\partial y = -4$. That blame passes to $w_2$ in proportion to $h$ ($-4 \times 6 = -24$) and flows back through $w_2$ to the hidden layer ($-4 \times 0.5 = -2$), then to $w_1$ ($-2 \times 2 = -4$). Both gradients are negative, so gradient descent raises both weights, and the numerical check agrees. You'll work through this properly in the neural-network module.
    bridges:
      - derivatives
      - chain-rule
  - id: deep-learning-revival.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.deep-learning-revival
    title: One detector, reused everywhere
    markdown: |-
      :::story Reading zip codes at Bell Labs
      In 1989 Yann LeCun and colleagues at AT&T Bell Labs trained a network with backpropagation to read handwritten zip codes. Its layers scanned small detectors across the image, an idea inspired partly by Kunihiko Fukushima's 1980 neocognitron. The line of work led to LeNet-5 (1998), and check-reading systems built on it went into commercial use at banks.
      :::

      A **convolutional layer** slides one small detector, called a *filter*, across every position of an image. A filter that responds to a short diagonal stroke finds that stroke wherever it appears, because the same weights are reused at every spot. This reuse is called **weight sharing**.

      It saves an enormous number of weights. LeNet-5's first layer used 6 filters, each 5 × 5, plus one bias each: 6 × (25 + 1) = 156 numbers.

      :::predict A fully connected layer instead links every pixel of a 28 × 28 image to each of 100 hidden units. How many weights is that, ignoring biases?
      28 × 28 = 784 pixels, times 100 units = 78,400 weights, about 500 times more than the 156 of the convolutional layer.
      :::
    bridges: []
  - id: deep-learning-revival.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.deep-learning-revival
    title: Data and GPUs, the fuel and the engine
    markdown: |-
      Through the 2000s a small group kept deep networks alive; in 2006 Hinton, Simon Osindero, and Yee-Whye Teh showed a way to train them one layer at a time. But two outside changes mattered most.

      **Data.** Fei-Fei Li's team released ImageNet in 2009, eventually over 14 million photos labeled by paid online workers through Amazon Mechanical Turk. A network with millions of weights needs millions of examples, or it simply memorizes.

      **Compute.** A **GPU** (graphics processing unit) was built to shade millions of pixels in parallel for video games. Training a network is mostly the same kind of arithmetic, done in parallel. After NVIDIA's CUDA (2007) made GPUs programmable for general math, AlexNet trained in five to six days on two gaming GPUs.

      :::mixup "AlexNet won because of one brilliant new idea."
      Its convolutional layers dated to the 1980s and backpropagation to 1986. It added useful tricks, such as the ReLU activation and dropout, but the leap came from running old ideas at a new scale, on 1.2 million training images, with about 60 million weights.
      :::
    bridges: []
  - id: deep-learning-revival.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.deep-learning-revival
    markdown: Count the weights a filter saves, trace blame backward through a tiny network, and then credit the right ingredient in a speech model, a scratch detector, a slow laptop, and AlexNet's own experiments.
    takeaway: |-
      The deep-learning revival needed four things at once: layered architectures like convolution, backpropagation to train them, huge labeled datasets, and fast GPUs. To credit one ingredient, change it alone and measure the difference.
  - id: deep-learning-revival.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.deep-learning-revival
    markdown: |-
      Backpropagation, architectural biases, larger datasets, accelerators, and engineering improvements worked together to make deeper neural systems useful at scale.
  - id: deep-learning-revival.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.deep-learning-revival
    title: Memory for sequences, the LSTM
    markdown: |-
      Images aren't the only data. Speech and text arrive as sequences, and a **recurrent network** reads them one step at a time, carrying a running summary forward. Training it means sending the error back through every step, and at each step the error signal is multiplied by a factor. In 1991 Sepp Hochreiter showed what goes wrong.

      :::predict If the error signal shrinks by a factor of 0.5 at each step, how big is it 20 steps back?
      0.5²⁰ ≈ 0.00000095, less than a millionth. Words 20 steps back barely affect learning. This is the **vanishing gradient** problem.
      :::

      In 1997 Hochreiter and Jürgen Schmidhuber published the **LSTM** (long short-term memory). It adds a memory cell that carries information forward largely unchanged, with learned "gates" that decide what to write into it and what to read out (a follow-up in 2000 added a gate for forgetting), so the error can flow back many steps without shrinking away. By the mid-2010s LSTMs powered speech recognition and Google's neural translation system. You'll build a recurrent network in the sequences module.
    bridges: []
  - id: deep-learning-revival.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.deep-learning-revival
    title: Credit each ingredient with an ablation
    markdown: |-
      When a system improves after several changes at once, which change deserves credit? An **ablation** answers this: remove or change one part, keep everything else the same, and measure the difference.

      The AlexNet paper ran one. Removing any single middle convolutional layer cost about 2 percentage points of top-1 accuracy (the share of photos where the *first* guess is right). So depth itself was doing work. Three years later, ResNet (2015), a network 152 layers deep, won the same challenge.

      Try it on an invented case. A new speech model beats last year's by 6 points, but it's larger, trained on three times the data, and uses a new architecture. To test the team's claim that "the architecture did it," train the new architecture at the old size, on the old data. If it wins by 1 point, the architecture earned about 1 of the 6.

      Hinton, LeCun, and Yoshua Bengio later shared the 2018 Turing Award, computing's top prize, for making deep learning work.
    bridges: []
