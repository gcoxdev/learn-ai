lesson:
  id: deep-learning-revival
  version: 0.2.0-draft
  title: Why deeper networks became practical
  state: draft
  summary: See how layers, error calculations, data, and hardware worked together to make larger neural experiments
    practical.
  slot: M01.6
  category: learning
  minutes: 12
  sources:
  - title: Rumelhart, Hinton, and Williams — back-propagating errors (1986)
    url: https://www.nature.com/articles/323533a0
  - title: Krizhevsky, Sutskever, and Hinton — ImageNet classification (2012)
    url: https://proceedings.neurips.cc/paper/2012/hash/c399862d3b9d6b76c8436e924a68c45b-Abstract.html
  archetype: perspective
objectives:
- id: objective.deep-learning-revival
  version: 2-draft
  statement: Explain the distinct roles of learned layers, backpropagation, data, and computing resources in the
    deep-learning revival.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - deep-learning-revival.base.v2
  - deep-learning-revival.transfer.v2
  prerequisites:
  - anyOf:
    - objective.expert-to-statistical
scenes:
- id: deep-learning-revival.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.deep-learning-revival
  title: Deep means several stages of computation
  markdown: A **neural network** connects numerical operations with adjustable weights. A **layer** is a stage in
    that calculation. **Deep learning** uses models with multiple learned stages, allowing later stages to combine
    earlier representations. For a picture, an early stage might respond to local patterns and later stages combine
    them in task-useful ways. These are learned numerical features, not guaranteed human concepts. More stages create
    possibilities, but also make learning and computation harder.
  text_mode: A **neural network** connects numerical operations with adjustable weights. A **layer** is a stage
    in that calculation. **Deep learning** uses models with multiple learned stages, allowing later stages to combine
    earlier representations. For a picture, an early stage might respond to local patterns and later stages combine
    them in task-useful ways. These are learned numerical features, not guaranteed human concepts. More stages create
    possibilities, but also make learning and computation harder.
  bridges: []
- id: deep-learning-revival.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.deep-learning-revival
  title: Training needs to reach earlier weights
  markdown: The output may depend on weights used many stages earlier. **Backpropagation** efficiently computes
    how a loss changes with those weights by applying the chain rule through intermediate operations. An **optimizer**
    then uses this information to choose updates. The influential 1986 paper by Rumelhart, Hinton, and Williams
    helped demonstrate learning internal representations with backpropagation. It should not be read as the invention
    of calculus or the claim that every earlier related idea began in that year. The mechanism and its historical
    popularization are different topics.
  text_mode: The output may depend on weights used many stages earlier. **Backpropagation** efficiently computes
    how a loss changes with those weights by applying the chain rule through intermediate operations. An **optimizer**
    then uses this information to choose updates. The influential 1986 paper by Rumelhart, Hinton, and Williams
    helped demonstrate learning internal representations with backpropagation. It should not be read as the invention
    of calculus or the claim that every earlier related idea began in that year. The mechanism and its historical
    popularization are different topics.
  bridges:
  - derivatives
  - chain-rule
- id: deep-learning-revival.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.deep-learning-revival
  title: Architecture can use the structure of a task
  markdown: An **architecture** specifies how a model’s operations are arranged. Image models can reuse a small
    pattern detector at many picture locations; this idea underlies convolutional processing. Reusing a calculation
    can reduce the number of separate settings needed and reflect the idea that a local pattern may appear in several
    places. Such assumptions are useful when they fit the task. They can also be limiting when the task needs information
    the chosen architecture handles poorly. Architecture is more than a count of weights.
  text_mode: An **architecture** specifies how a model’s operations are arranged. Image models can reuse a small
    pattern detector at many picture locations; this idea underlies convolutional processing. Reusing a calculation
    can reduce the number of separate settings needed and reflect the idea that a local pattern may appear in several
    places. Such assumptions are useful when they fit the task. They can also be limiting when the task needs information
    the chosen architecture handles poorly. Architecture is more than a count of weights.
  bridges: []
- id: deep-learning-revival.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.deep-learning-revival
  title: Data and hardware change feasible experiments
  markdown: '**Training data** supplies examples used to adjust the model. **Compute** refers to the calculation
    work and resources needed to run that adjustment. More examples can expose a model to greater variation, and
    faster hardware can make more experiments feasible. Neither alone guarantees improvement: repetitive or inappropriate
    data may add little, and fast execution of a mistaken setup remains mistaken. Larger models also require memory
    for their values and intermediate results. Practical progress depends on how these ingredients fit together.'
  text_mode: '**Training data** supplies examples used to adjust the model. **Compute** refers to the calculation
    work and resources needed to run that adjustment. More examples can expose a model to greater variation, and
    faster hardware can make more experiments feasible. Neither alone guarantees improvement: repetitive or inappropriate
    data may add little, and fast execution of a mistaken setup remains mistaken. Larger models also require memory
    for their values and intermediate results. Practical progress depends on how these ingredients fit together.'
  bridges: []
- id: deep-learning-revival.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.deep-learning-revival
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Progress came from interacting methods and resources. A successful benchmark is evidence for a tested
    system and setting, not proof that one ingredient solves every task.
- id: deep-learning-revival.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.deep-learning-revival
  markdown: Backpropagation, architectural biases, larger datasets, accelerators, and engineering improvements worked
    together to make deeper neural systems useful at scale.
  text_mode: Backpropagation, architectural biases, larger datasets, accelerators, and engineering improvements
    worked together to make deeper neural systems useful at scale.
- id: deep-learning-revival.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.deep-learning-revival
  title: Read the 2012 ImageNet result carefully
  markdown: The 2012 ImageNet work associated with AlexNet is a landmark in image classification. Its reported system
    combined a deep convolutional network with substantial training data and GPU computation. A **GPU** is a processor
    designed to carry out many suitable operations in parallel. The result was measured on defined image-recognition
    tasks, not on every possible form of intelligence. When crediting a milestone, distinguish the complete tested
    system from a claim that the newest ingredient was solely responsible for the improvement.
  text_mode: The 2012 ImageNet work associated with AlexNet is a landmark in image classification. Its reported
    system combined a deep convolutional network with substantial training data and GPU computation. A **GPU** is
    a processor designed to carry out many suitable operations in parallel. The result was measured on defined image-recognition
    tasks, not on every possible form of intelligence. When crediting a milestone, distinguish the complete tested
    system from a claim that the newest ingredient was solely responsible for the improvement.
  bridges: []
- id: deep-learning-revival.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.deep-learning-revival
  title: Use controlled comparisons to investigate causes
  markdown: Imagine two image systems differ in architecture, amount of data, and training time. If one scores higher,
    that comparison alone cannot isolate which change caused the difference. An **ablation** changes or removes
    one component while holding other conditions as comparable as possible. It can help reveal a component’s contribution,
    though interactions still matter. Record the task, dataset, metric, resource budget, and actual comparison before
    explaining a historical result. This prepares you to read modern model reports without turning a leaderboard
    change into a universal law.
