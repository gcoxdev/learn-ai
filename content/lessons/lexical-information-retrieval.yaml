schema_version: 0.2-draft
lesson:
  id: lexical-information-retrieval
  version: 0.1.0-draft
  title: Find documents through an index of their words
  state: draft
  summary: Lexical retrieval uses indexed terms and ranking functions to find candidate documents; token normalization,
    document statistics, and query intent determine matching behavior.
  slot: M26.1
  category: learning
  minutes: 12
  sources:
  - title: Introduction to Information Retrieval — authors’ online edition
    url: https://nlp.stanford.edu/IR-book/
objectives:
- id: objective.lexical-information-retrieval
  version: 1-draft
  statement: Lexical retrieval uses indexed terms and ranking functions to find candidate documents; token normalization,
    document statistics, and query intent determine matching behavior.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - lexical-information-retrieval.base
  - lexical-information-retrieval.transfer
  prerequisites:
  - anyOf:
    - objective.algorithms-and-programs
  - anyOf:
    - objective.language-structure
scenes:
- id: lexical-information-retrieval.s1
  title: Invert the document collection
  type: explanation
  depth: intuition
  objective_refs:
  - objective.lexical-information-retrieval
  markdown: Instead of scanning every document for every query, an inverted index maps a term to a postings list
    of documents or positions containing it. If cat appears in documents two and five, its postings include those
    identifiers. Positional indexes can support phrase and proximity queries.
  text_mode: Instead of scanning every document for every query, an inverted index maps a term to a postings list
    of documents or positions containing it. If cat appears in documents two and five, its postings include those
    identifiers. Positional indexes can support phrase and proximity queries.
  bridges: []
- id: lexical-information-retrieval.s2
  title: Normalize with consequences
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.lexical-information-retrieval
  markdown: Case folding, stemming, punctuation handling, and stop-word choices change which terms match. A search
    for a product code may require exact characters, while ordinary language may benefit from normalization. Use
    rules suited to the corpus rather than assuming one text pipeline fits every query.
  text_mode: Case folding, stemming, punctuation handling, and stop-word choices change which terms match. A search
    for a product code may require exact characters, while ordinary language may benefit from normalization. Use
    rules suited to the corpus rather than assuming one text pipeline fits every query.
  bridges: []
- id: lexical-information-retrieval.s3
  title: Rank beyond a binary match
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.lexical-information-retrieval
  markdown: TF-IDF and BM25-style methods weight term evidence using frequency and corpus rarity, with document-length
    handling. A term appearing in nearly every document distinguishes candidates poorly. More occurrences do not
    always deserve linearly more relevance because repetition can saturate useful evidence.
  text_mode: TF-IDF and BM25-style methods weight term evidence using frequency and corpus rarity, with document-length
    handling. A term appearing in nearly every document distinguishes candidates poorly. More occurrences do not
    always deserve linearly more relevance because repetition can saturate useful evidence.
  bridges: []
- id: lexical-information-retrieval.s4
  title: Evaluate relevance for the task
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.lexical-information-retrieval
  markdown: A lexical match can miss synonyms and retrieve documents that mention a term in the wrong sense. Define
    relevance judgments, inspect query categories, and compare a simple baseline. Efficient indexing answers where
    terms occur; ranking still needs evidence that the results satisfy the user’s information need.
  text_mode: A lexical match can miss synonyms and retrieve documents that mention a term in the wrong sense. Define
    relevance judgments, inspect query categories, and compare a simple baseline. Efficient indexing answers where
    terms occur; ranking still needs evidence that the results satisfy the user’s information need.
  bridges: []
- id: lexical-information-retrieval.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.lexical-information-retrieval
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Lexical retrieval uses indexed terms and ranking functions to find candidate documents; token normalization,
    document statistics, and query intent determine matching behavior.
- id: lexical-information-retrieval.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.lexical-information-retrieval
  markdown: Lexical retrieval uses indexed terms and ranking functions to find candidate documents; token normalization,
