schema_version: 0.2-draft
lesson:
  id: lexical-information-retrieval
  version: 0.3.0-draft
  title: Find documents through an index of their words
  state: draft
  summary: Build a search engine that starts with the words in documents.
  slot: M26.1
  category: learning
  sources:
  - title: Introduction to Information Retrieval — authors’ online edition
    url: https://nlp.stanford.edu/IR-book/
objectives:
- id: objective.lexical-information-retrieval
  version: 1-draft
  statement: Lexical retrieval uses indexed terms and ranking functions to find candidate documents; token
    normalization, document statistics, and query intent determine matching behavior.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - lexical-information-retrieval.base
  - lexical-information-retrieval.transfer
  prerequisites:
  - anyOf:
    - objective.algorithms-and-programs
  - anyOf:
    - objective.language-structure
scenes:
- id: lexical-information-retrieval.s1
  title: Invert the document collection
  type: explanation
  depth: intuition
  objective_refs:
  - objective.lexical-information-retrieval
  markdown: Instead of scanning every document for every query, an inverted index maps a term to a postings
    list of documents or positions containing it. If cat appears in documents two and five, its postings include
    those identifiers. Positional indexes can support phrase and proximity queries.
  text_mode: Instead of scanning every document for every query, an inverted index maps a term to a postings
    list of documents or positions containing it. If cat appears in documents two and five, its postings include
    those identifiers. Positional indexes can support phrase and proximity queries.
  bridges: []
- id: lexical-information-retrieval.s2
  title: Normalize with consequences
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.lexical-information-retrieval
  markdown: Case folding, stemming, punctuation handling, and stop-word choices change which terms match. A
    search for a product code may require exact characters, while ordinary language may benefit from normalization.
    Use rules suited to the corpus rather than assuming one text pipeline fits every query.
  text_mode: Case folding, stemming, punctuation handling, and stop-word choices change which terms match.
    A search for a product code may require exact characters, while ordinary language may benefit from normalization.
    Use rules suited to the corpus rather than assuming one text pipeline fits every query.
  bridges: []
- id: lexical-information-retrieval.s3
  title: Rank beyond a binary match
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.lexical-information-retrieval
  markdown: 'Words differ in how much they help identify a relevant document. In a collection of 100 pages,
    “the” appearing on all 100 is less distinctive than “axolotl” appearing on two.


    **Term frequency**, or TF, counts how often a term appears in a document. **Inverse document frequency**,
    or IDF, gives greater weight to terms found in fewer documents. TF-IDF combines these ideas to score term
    evidence.


    **BM25** is another ranking formula. It accounts for document length and makes repeated occurrences contribute
    progressively less. Repeating a word 20 times need not make a page twice as useful as repeating it 10 times.
    These statistics help rank candidates, but the page still has to answer the question.'
  text_mode: 'Words differ in how much they help identify a relevant document. In a collection of 100 pages,
    “the” appearing on all 100 is less distinctive than “axolotl” appearing on two.


    **Term frequency**, or TF, counts how often a term appears in a document. **Inverse document frequency**,
    or IDF, gives greater weight to terms found in fewer documents. TF-IDF combines these ideas to score term
    evidence.


    **BM25** is another ranking formula. It accounts for document length and makes repeated occurrences contribute
    progressively less. Repeating a word 20 times need not make a page twice as useful as repeating it 10 times.
    These statistics help rank candidates, but the page still has to answer the question.'
  bridges: []
- id: lexical-information-retrieval.s4
  title: Evaluate relevance for the task
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.lexical-information-retrieval
  markdown: A lexical match can miss synonyms and retrieve documents that mention a term in the wrong sense.
    Define relevance judgments, inspect query categories, and compare a simple baseline. Efficient indexing
    answers where terms occur; ranking still needs evidence that the results satisfy the user’s information
    need.
  text_mode: A lexical match can miss synonyms and retrieve documents that mention a term in the wrong sense.
    Define relevance judgments, inspect query categories, and compare a simple baseline. Efficient indexing
    answers where terms occur; ranking still needs evidence that the results satisfy the user’s information
    need.
  bridges: []
- id: lexical-information-retrieval.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.lexical-information-retrieval
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: An inverted index finds documents containing query terms. Ranking weighs that evidence, while normalization
    rules determine which terms count as matches.
- id: lexical-information-retrieval.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.lexical-information-retrieval
  markdown: An inverted index finds documents containing query terms. Ranking weighs that evidence, while normalization
    rules determine which terms count as matches.
  text_mode: An inverted index finds documents containing query terms. Ranking weighs that evidence, while
    normalization rules determine which terms count as matches.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - lexical-information-retrieval.s1
    - lexical-information-retrieval.s2
    - lexical-information-retrieval.s3
    - lexical-information-retrieval.s4
