assessment_families:
- id: lexical-information-retrieval.base
  objective_ref: objective.lexical-information-retrieval
  task: base
  response_type: single_choice
  points: 1
  hint: 'Normalize with consequences: trace the inputs, operation, and result before choosing.'
  remediation_scene: lexical-information-retrieval.s2
  variants:
  - id: lexical-information-retrieval.base.1
    prompt: What does an inverted index map a term to?
    options:
    - id: c
      text: Every possible generated answer
    - id: a
      text: Documents or positions containing it
    - id: b
      text: Only a model’s hidden layers
    answer: a
    feedback: Postings connect terms to corpus locations.
  - id: lexical-information-retrieval.base.2
    prompt: Why can a very common term be weak ranking evidence?
    options:
    - id: a
      text: It distinguishes few documents from the rest
    - id: b
      text: It can never be searched
    - id: c
      text: It always proves relevance
    answer: a
    feedback: Corpus rarity affects discriminative value.
- id: lexical-information-retrieval.transfer
  objective_ref: objective.lexical-information-retrieval
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate relevance for the task: trace the inputs, operation, and result before choosing.'
  remediation_scene: lexical-information-retrieval.s4
  variants:
  - id: lexical-information-retrieval.transfer.1
    prompt: What can stemming accidentally harm?
    options:
    - id: a
      text: Exact identifiers or distinctions that matter to the task
    - id: b
      text: Every possible search equally
    - id: c
      text: Only file compression
    answer: a
    feedback: Normalization can merge meaningful differences.
  - id: lexical-information-retrieval.transfer.2
    prompt: Does matching every query word guarantee relevance?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only for long documents
    - id: a
      text: 'No'
    answer: a
    feedback: Words can appear in an irrelevant context.
