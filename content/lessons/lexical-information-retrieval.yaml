assessment_families:
  - id: lexical-information-retrieval.base
    objective_ref: objective.lexical-information-retrieval
    task: base
    response_type: single_choice
    points: 1
    hint: 'Normalize with consequences: trace the inputs, operation, and result before choosing.'
    remediation_scene: lexical-information-retrieval.s2
    variants:
      - id: lexical-information-retrieval.base.1
        prompt: What does an inverted index map a term to?
        options:
          - id: c
            text: Every possible generated answer
          - id: a
            text: Documents or positions containing it
          - id: b
            text: Only a model’s hidden layers
        answer: a
        feedback: Postings connect terms to corpus locations.
        retired: true
      - id: lexical-information-retrieval.base.2
        prompt: Why can a very common term be weak ranking evidence?
        options:
          - id: a
            text: It distinguishes few documents from the rest
          - id: b
            text: It can never be searched
          - id: c
            text: It always proves relevance
        answer: a
        feedback: Corpus rarity affects discriminative value.
        retired: true
  - id: lexical-information-retrieval.transfer
    objective_ref: objective.lexical-information-retrieval
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate relevance for the task: trace the inputs, operation, and result before choosing.'
    remediation_scene: lexical-information-retrieval.s4
    variants:
      - id: lexical-information-retrieval.transfer.1
        prompt: What can stemming accidentally harm?
        options:
          - id: a
            text: Exact identifiers or distinctions that matter to the task
          - id: b
            text: Every possible search equally
          - id: c
            text: Only file compression
        answer: a
        feedback: Normalization can merge meaningful differences.
        retired: true
      - id: lexical-information-retrieval.transfer.2
        prompt: Does matching every query word guarantee relevance?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only for long documents
          - id: a
            text: 'No'
        answer: a
        feedback: Words can appear in an irrelevant context.
        retired: true
  - id: lexical-information-retrieval.base.v2
    objective_ref: objective.lexical-information-retrieval
    task: base
    response_type: single_choice
    points: 1
    hint: "BM25 rewards three things: a rare word, a word that appears more often (with diminishing returns), and a match in a shorter-than-average document."
    remediation_scene: lexical-information-retrieval.bm25
    variants:
      - id: lexical-information-retrieval.base.v2.1
        prompt: In a 1,000-document help center, "refund" appears in 50 documents and "derailleur" in 2. A query contains both words. Why does BM25 give a match on "derailleur" more weight?
        options:
          - id: b
            text: It appears more times inside each document that contains it
          - id: c
            text: It is a longer word, so more of its characters match the query
          - id: a
            text: Fewer documents contain it, so a match narrows the field more
        answer: a
        feedback: Weight comes from inverse document frequency, which rises as fewer documents contain the word. The count inside a document is term frequency, a separate factor, and word length plays no part.
      - id: lexical-information-retrieval.base.v2.2
        prompt: Pages A and B have the same length. Page A mentions "battery" 3 times; page B mentions it 30 times. With BM25 at k₁ = 1.2, how does B's score for that word compare with A's?
        options:
          - id: c
            text: Exactly 10 times higher, since B has 10 times the mentions
          - id: a
            text: Somewhat higher, but far less than 10 times higher
          - id: b
            text: About the same, since BM25 counts whether a word appears at all
        answer: a
        feedback: BM25's term-frequency part saturates toward k₁ + 1 = 2.2, so A gets about 1.57 and B about 2.11. Ten-times scaling is how raw TF-IDF behaves; ignoring counts entirely is a plain yes/no match.
      - id: lexical-information-retrieval.base.v2.3
        prompt: Two documents each mention "warranty" exactly once. One is 50 words long, the other 2,000 words. With b = 0.75, which gets the higher BM25 score for "warranty"?
        options:
          - id: a
            text: The 50-word document, because the mention is a larger share of it
          - id: b
            text: The 2,000-word document, because it has more text that could be relevant
          - id: c
            text: Neither, because both have a term frequency of 1
        answer: a
        feedback: With b above zero, BM25 divides by a length factor, so one mention in a short document counts for more. Equal term frequency gives equal scores only when b = 0, which turns length normalization off.
      - id: lexical-information-retrieval.base.v2.4
        prompt: A search engine indexes 3 million pages. For the query "chain lube", what work does the inverted index let it skip?
        options:
          - id: b
            text: Reading the postings lists stored for "chain" and for "lube"
          - id: a
            text: Scoring the pages that contain neither "chain" nor "lube"
          - id: c
            text: Counting how often "chain" appears in the pages that contain it
        answer: a
        feedback: The index jumps straight to the pages listed under each query word, so pages with no shared word are never scored. Reading those postings and counting term frequencies is exactly the work it still does.
  - id: lexical-information-retrieval.transfer.v2
    objective_ref: objective.lexical-information-retrieval
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what the normalized query and document actually contain, word by word. Is the problem a missing match, a false match, or a scoring choice?
    remediation_scene: lexical-information-retrieval.s2
    variants:
      - id: lexical-information-retrieval.transfer.v2.1
        prompt: An electronics shop's search splits text at hyphens. Searching for resistor "R-470" also returns pages for "R-220" and "R-100". What change targets this?
        options:
          - id: c
            text: Raise k₁ so that repeated words count for more
          - id: b
            text: Add a synonym list that links related part names
          - id: a
            text: Index part numbers as exact, unsplit tokens too
        answer: a
        feedback: Splitting turned every part number into a shared "r" token plus a number, so unrelated parts match. An exact-token field keeps "R-470" whole. Raising k₁ only changes how repeats count, and a synonym list would link even more part names together.
      - id: lexical-information-retrieval.transfer.v2.2
        prompt: 'A recipe site''s keyword search returns nothing for "how do I make my dough rise", though a page titled "Proofing yeast for bread" answers it. What is the failure?'
        options:
          - id: a
            text: The question and the page use different words for the same idea
          - id: b
            text: The page is too long, so length normalization hid it
          - id: c
            text: Common words like "how" and "my" were given too much weight
        answer: a
        feedback: This is vocabulary mismatch. The page shares no words with the query, so it gets no score at all; length and word weights only matter for pages that match something.
      - id: lexical-information-retrieval.transfer.v2.3
        prompt: A music site drops stop words such as "the" and "who" before indexing. Searching for tickets to the band The Who returns generic concert pages. What caused it?
        options:
          - id: b
            text: Stemming turned "tickets" into "ticket" and lost the plural
          - id: a
            text: Stop-word removal deleted the words that make up the band's name
          - id: c
            text: IDF weighted the word "concert" more than it should have
        answer: a
        feedback: Both words of the band's name are stop words, so the query shrank to "tickets". Folding plurals is harmless here, and IDF can't weight words that were removed.
      - id: lexical-information-retrieval.transfer.v2.4
        prompt: A shipping help center lowercases everything. Searches for "US customs rules" rank pages saying "contact us" near the top. Which normalization step caused this?
        options:
          - id: a
            text: Case folding, which merged the country code with the pronoun
          - id: c
            text: Stemming, which cut "customs" down to the word "custom"
          - id: b
            text: Length normalization, which boosted the short contact pages
        answer: a
        feedback: Lowercasing made "US" and "us" one term, so every "contact us" page matches. Stemming "customs" wouldn't create matches with contact pages, and length normalization only reorders pages that already match.
  - id: lexical-information-retrieval.calc
    objective_ref: objective.lexical-information-retrieval
    task: base
    response_type: numeric
    points: 1
    hint: For a document of average length, the length factor is 1, so a term contributes idf × tf(k₁ + 1) / (tf + k₁).
    remediation_scene: lexical-information-retrieval.bm25
    variants:
      - id: lexical-information-retrieval.calc.1
        prompt: A document has exactly average length. A query word appears in it 3 times, its idf is 2.0, and k₁ = 1.2. What does this word add to the BM25 score? Give two decimal places.
        answer: 3.14
        feedback: The tf part is 3 × 2.2 / (3 + 1.2) = 6.6 / 4.2 = 1.571. Multiply by idf 2.0 to get 3.14.
      - id: lexical-information-retrieval.calc.2
        prompt: A document has exactly average length. A query word appears in it 4 times, its idf is 1.5, and k₁ = 1.2. What does this word add to the BM25 score? Give two decimal places.
        answer: 2.54
        feedback: The tf part is 4 × 2.2 / (4 + 1.2) = 8.8 / 5.2 = 1.692. Multiply by idf 1.5 to get 2.54.
      - id: lexical-information-retrieval.calc.3
        prompt: A document has exactly average length. A query word appears in it twice, its idf is 3.0, and k₁ = 2.0. What does this word add to the BM25 score? Give two decimal places.
        answer: 4.5
        feedback: The tf part is 2 × 3.0 / (2 + 2.0) = 6 / 4 = 1.5. Multiply by idf 3.0 to get 4.50.
      - id: lexical-information-retrieval.calc.4
        prompt: A document has exactly average length. A query word appears in it 5 times, its idf is 1.0, and k₁ = 1.5. What does this word add to the BM25 score? Give two decimal places.
        answer: 1.92
        feedback: The tf part is 5 × 2.5 / (5 + 1.5) = 12.5 / 6.5 = 1.923. Multiply by idf 1.0 to get 1.92.
    absolute_tolerance: 0.01
