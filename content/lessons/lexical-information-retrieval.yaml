schema_version: 0.2-draft
lesson:
  id: lexical-information-retrieval
  version: 0.4.0-draft
  title: Find documents through an index of their words
  state: draft
  summary: How does a search box find the right page among millions in a blink? Build a tiny search engine, score it with BM25, and watch where word matching breaks.
  slot: M26.1
  category: learning
  sources:
    - title: Introduction to Information Retrieval — authors’ online edition
      url: https://nlp.stanford.edu/IR-book/
    - title: "The Probabilistic Relevance Framework: BM25 and Beyond (Robertson & Zaragoza, 2009)"
      url: https://doi.org/10.1561/1500000019
    - title: "BEIR: A Heterogeneous Benchmark for Zero-shot Evaluation of Information Retrieval Models (Thakur et al., 2021)"
      url: https://arxiv.org/abs/2104.08663
objectives:
  - id: objective.lexical-information-retrieval
    version: 2-draft
    statement: Lexical retrieval uses indexed terms and ranking functions to find candidate documents; token normalization, document statistics, and query intent determine matching behavior.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - lexical-information-retrieval.base.v2
      - lexical-information-retrieval.transfer.v2
      - lexical-information-retrieval.calc
    prerequisites:
      - anyOf:
          - objective.algorithms-and-programs
      - anyOf:
          - objective.language-structure
scenes:
  - id: lexical-information-retrieval.s1
    title: Five documents and one customer question
    type: explanation
    depth: intuition
    objective_refs:
      - objective.lexical-information-retrieval
    markdown: |-
      Sprocket Bikes sells e-bikes online. Its help center holds five short policy documents, and a customer has just typed: *can I return an opened battery?* We'll follow this collection through the whole module, all the way to a cited answer.

      | ID | Document |
      | --- | --- |
      | returns | Return unused items within 30 days for a full refund. Opened batteries cannot be returned. |
      | battery | Charge the battery to 80 percent before storage. The battery warranty lasts two years. |
      | shipping | Standard shipping takes 3 to 5 business days. Express shipping arrives the next business day. |
      | refunds | Refunds go to your original payment method within 5 business days of the return arriving. |
      | chargers | The KB-220 charger fits all 2024 models. Older models need the KB-110 charger. |

      With five documents you could reread everything for every question. With five million you can't. So a search engine reads once, ahead of time, and builds an **inverted index**: a table from each word to the documents that contain it. Each word's list is its **postings list**.

      | Term | Postings (document: count) |
      | --- | --- |
      | return | returns: 1, refunds: 1 |
      | opened | returns: 1 |
      | battery | returns: 1, battery: 2 |
      | business | shipping: 2, refunds: 1 |

      A query looks up its words, merges their postings, and scores only the documents that turn up; the other millions are never touched. Storing word positions too lets a phrase query like "business day" check that the words are adjacent. (The returns document is listed under "battery" because "batteries" was folded into "battery": a choice we look at next.)
    bridges: []
  - id: lexical-information-retrieval.s2
    title: '"Batteries" isn''t "battery" until you say so'
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.lexical-information-retrieval
    markdown: |-
      Before indexing, text is cut into **tokens** (here, words) and cleaned up by the same rules that later run on every query. This clean-up is **normalization**:

      - **Case folding**: "Return" and "return" become one term.
      - **Stemming**: chop endings so variants share an entry ("batteries" → "battery"). Martin Porter's 1980 stemmer is the classic for English.
      - **Stop words**: some systems drop very common words like "the".

      :::predict The customer types "return battery". Which document ranks first with the "batteries" → "battery" fold, and which ranks first without it?
      With the fold, the returns document matches both words and scores 1.72, ahead of the battery-care guide at 1.21. Without it, the returns document matches only "return" (0.86), and the care guide, with "battery" twice, wins at 1.92. The customer gets charging tips. (These are BM25 scores, which you'll compute later in this lesson.)
      :::

      Normalization can also merge things that must stay apart. Split "KB-220" at the hyphen and a search for it also matches "KB-110", since both contain "kb". Case folding makes "US shipping" match every "contact us" page. So real systems often index text twice: normalized for ordinary words, exact for codes and names.
    bridges: []
  - id: lexical-information-retrieval.s3
    title: Rare words carry more evidence
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.lexical-information-retrieval
    markdown: |-
      Which query word tells you the most? "Opened" appears in one of our five documents, so a match on it narrows things sharply. "The" appears in four, so a match says almost nothing.

      **Term frequency** ($\text{tf}$) is how many times a word appears in one document. **Document frequency** ($\text{df}$) is how many documents contain it. In 1972 Karen Spärck Jones proposed weighting words by rarity, now written as the **inverse document frequency**:

      $$\text{idf}(t) = \ln\frac{N}{\text{df}(t)}$$

      where $N$ is the number of documents. A word's **TF-IDF** weight in a document is $\text{tf} \times \text{idf}$; a document's score sums these over the query's words.

      | Term | df | idf = ln(5 / df) |
      | --- | ---: | ---: |
      | opened | 1 | 1.609 |
      | return | 2 | 0.916 |
      | battery | 2 | 0.916 |
      | the | 4 | 0.223 |

      The returns document scores 0.916 + 1.609 + 0.916 = 3.44 (return, opened, battery). The battery guide has "battery" twice: 2 × 0.916 = 1.83. Refunds matches only "return": 0.92. The right document wins.

      :::predict A sneaky page repeats "battery" 20 times. Keeping idf at 0.916, what is its TF-IDF score for this query?
      20 × 0.916 = 18.3, over five times the real returns policy. TF-IDF trusts repetition without limit, which BM25 fixes.
      :::
    bridges: []
  - id: lexical-information-retrieval.bm25
    title: "BM25: repeats pay less, long pages pay more"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.lexical-information-retrieval
    markdown: |-
      **BM25** ("Best Match 25") is the default ranking function in Lucene and Elasticsearch, so it sits behind much of the keyword search you use. Stephen Robertson and colleagues developed it in the 1990s for the Okapi system at City University, London. It changes TF-IDF in two ways.

      **Repeats saturate.** Each extra mention adds less than the one before. For a document of average length, the term-frequency part is $\text{tf}\,(k_1+1)/(\text{tf}+k_1)$. The setting $k_1$ controls how fast repeats stop paying; the usual value is 1.2:

      | tf | 1 | 2 | 20 | limit |
      | --- | ---: | ---: | ---: | ---: |
      | tf part | 1.00 | 1.38 | 2.08 | 2.2 |

      Twenty mentions count about twice as much as one, not twenty times.

      **Long documents are discounted.** One "battery" in a 2,000-word manual is weaker evidence than one in a two-sentence policy. The setting $b$ (usually 0.75) controls how much length matters: one mention in a document twice the average length scores $2.2 / (1 + 1.2 \times 1.75) = 0.71$ instead of 1.00.

      :::papers The BM25 formula
      $$\text{score}(q,d) = \sum_{t \in q} \text{idf}(t)\cdot\frac{\text{tf}(t,d)\,(k_1+1)}{\text{tf}(t,d) + k_1\left(1 - b + b\,\frac{|d|}{\text{avgdl}}\right)}$$

      $|d|$ is the document's length in tokens; avgdl is the average. Lucene's idf is $\ln\!\left(1+\frac{N-n+0.5}{n+0.5}\right)$, with $n$ the document frequency. Our returns document has 15 tokens against avgdl = 14.4, so each match gets a tf part of 0.98. "Opened" ($n=1$, idf = ln 4 = 1.39) adds 1.36; "return" and "battery" ($n=2$, idf = ln 2.4 = 0.88) add 0.86 each. Total: 3.08.
      :::

      Here is the whole engine, index plus BM25:

      ```python run
      import math, re

      docs = {
          "returns":  "Return unused items within 30 days for a full refund. Opened batteries cannot be returned.",
          "battery":  "Charge the battery to 80 percent before storage. The battery warranty lasts two years.",
          "shipping": "Standard shipping takes 3 to 5 business days. Express shipping arrives the next business day.",
          "refunds":  "Refunds go to your original payment method within 5 business days of the return arriving.",
          "chargers": "The KB-220 charger fits all 2024 models. Older models need the KB-110 charger.",
      }

      def tokens(text):  # lowercase, split into words, fold "batteries" -> "battery"
          words = re.findall(r"[a-z0-9-]+", text.lower())
          return [w[:-3] + "y" if w.endswith("ies") else w for w in words]

      index = {}  # inverted index: term -> {doc: count}
      for name, text in docs.items():
          for t in tokens(text):
              postings = index.setdefault(t, {})
              postings[name] = postings.get(name, 0) + 1
      length = {d: len(tokens(text)) for d, text in docs.items()}
      N, avgdl = len(docs), sum(length.values()) / len(docs)

      def bm25(query, k1=1.2, b=0.75):
          scores = {}
          for term in tokens(query):
              postings = index.get(term, {})
              idf = math.log(1 + (N - len(postings) + 0.5) / (len(postings) + 0.5))
              for d, tf in postings.items():
                  scores[d] = scores.get(d, 0) + idf * tf * (k1 + 1) / (
                      tf + k1 * (1 - b + b * length[d] / avgdl))
          return sorted(scores.items(), key=lambda pair: -pair[1])

      print("postings for 'battery':", index["battery"])
      results = bm25("can I return an opened battery")
      for doc, score in results:
          print(f"{doc:9} {score:.2f}")
      if not results:
          print("no document shares a word with this query")
      ```

      You should see returns 3.08, battery 1.21, refunds 0.86. Now try the query "how long until I get my money back".
    bridges: []
  - id: lexical-information-retrieval.s4
    title: Where word matching breaks
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.lexical-information-retrieval
    markdown: |-
      "How long until I get my money back?" shares no words with any document, so every BM25 score is zero, though the refunds document answers it exactly. This is **vocabulary mismatch**: people and documents say the same thing in different words. The reverse happens too: a question about a *charge* for returns (a fee) matches "Charge the battery."

      Find these failures by testing. Mark which document answers each of a set of real questions (these marks are **relevance judgments**). The fraction whose right document lands in the top $k$ results is **recall@k**. If BM25 gets 14 of 20 into the top 3, recall@3 = 0.70. Then read the 6 misses. If most are paraphrases like "money back," you need search by meaning: the next lesson.

      :::mixup "Keyword search is obsolete now that we have embeddings."
      BM25 is still the baseline to beat. It needs no training, handles exact codes like "KB-220", and holds up on new topics: on the BEIR benchmark (Thakur et al., 2021) it beat many neural retrievers on collections they weren't trained for. Most production systems run both kinds of search side by side.
      :::
    bridges: []
  - id: lexical-information-retrieval.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.lexical-information-retrieval
    markdown: Part numbers, a recipe site, a band called The Who, and a few BM25 calculations test whether you can predict what keyword search will find.
    takeaway: |-
      An inverted index finds the documents that share a query's words, and BM25 ranks them by how rare each word is, how often it appears (with diminishing returns), and how long the document is. Normalization rules decide what counts as the same word.
  - id: lexical-information-retrieval.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.lexical-information-retrieval
    markdown: |-
      An inverted index finds documents containing query terms. Ranking weighs that evidence, while normalization rules determine which terms count as matches.
