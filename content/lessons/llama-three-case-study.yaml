schema_version: 0.2-draft
lesson:
  id: llama-three-case-study
  version: 0.4.0-draft
  title: Trace the Llama 3.1 dense decoder lifecycle
  state: draft
  summary: Meta says its 405B model took 3.8 × 10²⁵ FLOPs to train. You can check that with one multiplication, then size its weights, its cache, and the six rounds of tuning that made it a chat model.
  slot: M35.2
  category: learning
  sources:
    - title: Llama 3 report v3
      url: https://arxiv.org/abs/2407.21783v3
    - title: Llama 3.1 official model card
      url: https://huggingface.co/meta-llama/Llama-3.1-8B-Instruct
    - title: Llama model utilities
      url: https://github.com/meta-llama/llama-models
objectives:
  - id: objective.llama-three-case-study
    version: 2-draft
    statement: 'The Llama 3 report provides a dated dense-decoder case: connect documented architecture, corpus preparation, staged training, preference adaptation, and cached serving while distinguishing released artifacts from missing training inputs.'
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - llama-three-case-study.base.v2
      - llama-three-case-study.transfer.v2
      - llama-three-case-study.calculate
    prerequisites:
      - anyOf:
          - objective.model-report-and-artifact-inventory
      - anyOf:
          - objective.shared-and-latent-kv
      - anyOf:
          - objective.direct-preference-optimization
      - anyOf:
          - objective.serving-metrics-and-cost
scenes:
  - id: llama-three-case-study.s1
    title: Check a frontier report with a pencil
    type: explanation
    depth: intuition
    objective_refs:
      - objective.llama-three-case-study
    markdown: |-
      Early in *The Llama 3 Herd of Models*, Meta states that its flagship was pretrained with 3.8 × 10²⁵ FLOPs, "almost 50× more than the largest version of Llama 2," on 15.6 trillion tokens.

      :::predict The model has 405 billion parameters. Using C ≈ 6ND from the pretraining budget lesson, does 3.8 × 10²⁵ add up?
      6 × 405 × 10⁹ × 15.6 × 10¹² ≈ 3.79 × 10²⁵. It matches to two digits. For a dense model, the report's headline compute is essentially 6ND.
      :::

      That check is the method of this lesson: read a claim, recompute it from other numbers in the same sources, and see whether they agree.

      Pin the object first. We use report revision 3 (November 23, 2024), whose results are all for **Llama 3.1**, released July 23, 2024. The report's own table separates it from the April 2024 Llama 3 8B and 70B, which had an 8K context and no 405B. Keep the two releases in separate rows when comparing context length or chat templates.
    bridges: []
  - id: llama-three-case-study.s2
    title: One dense recipe at three sizes
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.llama-three-case-study
    markdown: |-
      The report's Table 3, plus the released configs:

      | | 8B | 70B | 405B |
      | --- | ---: | ---: | ---: |
      | Layers | 32 | 80 | 126 |
      | Width | 4,096 | 8,192 | 16,384 |
      | FFN width | 14,336 | 28,672 | 53,248 |
      | Query heads / KV heads | 32 / 8 | 64 / 8 | 128 / 8 |
      | Parameters (computed) | 8.03B | 70.6B | 405.8B |
      | Pretraining tokens | ~15T | ~15T | 15.6T |
      | Context | 128K | 128K | 128K |

      All three share a 128K-token vocabulary (128,256 entries in the config), RoPE with its base raised to 500,000 to help long contexts, SwiGLU feed-forward layers, and **grouped-query attention** with 8 key/value heads.

      Two choices stand out. The model is **dense**: every parameter works on every token. The report says it chose this over a mixture of experts "to maximize training stability." And the small models are deliberately **over-trained**: an 8B model on 15T tokens is far beyond the roughly 20 tokens per parameter Chinchilla would pick, because a small, well-trained model is cheaper to serve for years.
    bridges: []
  - id: llama-three-case-study.s5
    title: Weights grow 50×, the cache only 4×
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.llama-three-case-study
    markdown: |-
      Run the model sheet from the lesson on reading a release across all three sizes. It also turns the model card's 30.84 million H100-hours for the 405B into a speed.

      ```python run
      # Llama 3.1 model sheet: (layers, width, FFN width, query heads, training tokens)
      sizes = {"8B": (32, 4096, 14336, 32, 15e12),
               "70B": (80, 8192, 28672, 64, 15e12),
               "405B": (126, 16384, 53248, 128, 15.6e12)}
      vocab, kv_heads, hd = 128256, 8, 128

      for name, (L, d, ffn, heads, D) in sizes.items():
          attn = 2 * d * heads * hd + 2 * d * kv_heads * hd
          N = L * (attn + 3 * d * ffn) + 2 * vocab * d
          w = "  ".join(f"{t} {N * b / 1e9:4.0f} GB" for t, b in [("bf16", 2), ("fp8", 1), ("int4", 0.5)])
          kv = 2 * L * kv_heads * hd * 2
          print(f"{name:>4}: {N / 1e9:5.1f}B | {w} | KV {kv / 1024:3.0f} KiB/token, "
                f"{kv * 131072 / 2**30:2.0f} GiB at 128K | 6ND {6 * N * D:.2e}")

      C, gpu_hours = 3.8e25, 30.84e6      # report's FLOPs; model card's H100-hours (405B)
      per_gpu = C / (gpu_hours * 3600)
      print(f"405B: {per_gpu / 1e12:.0f} TFLOP/s per GPU = {per_gpu / 989e12:.0%} of H100 bf16 peak")
      ```

      From 8B to 405B the weights grow 50×, from 16 GB to 812 GB at bf16. The KV cache per token (from the lesson on cached inference) grows only from 128 KiB to 504 KiB, because the KV heads stay at 8 and the head width at 128; only the layer count rises. Even so, one 128K-token conversation on the 405B holds 63 GiB of cache.

      At 812 GB, the bf16 405B doesn't fit on one 8-GPU H100 server (640 GB), so the report ran it across two machines. Its other fix, as in the lesson on quantization, was FP8 for most feed-forward weights, with attention and the first and last layers left in higher precision.

      The last line says each GPU sustained about 342 TFLOP/s of useful work, roughly 35% of peak. The report measured 38–43% utilization while the job was running. The gap between those two figures is your inference, not a reported number. Restarts are a likely cause: the report counts 466 job interruptions in one 54-day stretch.

      :::mixup "Cache per token = 2 × layers × query heads × head width × bytes."
      Only the key/value heads are cached. Using the 405B's 128 query heads gives 8,064 KiB per token, sixteen times the real 504 KiB.
      :::
    bridges: []
  - id: llama-three-case-study.s4
    title: Three pretraining stages
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.llama-three-case-study
    markdown: |-
      The report splits the 405B's pretraining into three stages:

      1. **Initial pretraining** at 8K context on most of the 15.6T tokens. The data mix shifted along the way: more non-English text, more math, fresher web data.
      2. **Long-context pretraining**: six steps from 8K to 128K, using about 800B tokens. Each step waited until short-context scores recovered and the model found a planted "needle" at the new length. It came last because attention's cost grows with the square of sequence length.
      3. **Annealing**: over the final 40M tokens, the learning rate fell linearly to zero while high-quality sources were upsampled. The released base model is an average of checkpoints from this phase.

      Every stage needs its data, and none of those corpora were released. So the inventory marks Llama 3.1 as **open-weight**: you can run, test, and fine-tune the final checkpoints, but not rerun the path that produced them.
    bridges: []
  - id: llama-three-case-study.s3
    title: Six rounds of SFT, rejection sampling, and DPO
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.llama-three-case-study
    markdown: |-
      Post-training turned the base model into Llama 3.1 Instruct in six rounds. Each round:

      1. Train a **reward model** on human preference pairs, as in the lesson on preferences and reward models.
      2. **Rejection sampling**: for each prompt, sample several responses from the best current model and keep the one the reward model scores highest.
      3. **SFT** on those responses plus other data, with the loss masked on prompt tokens.
      4. **DPO** on the newest preference pairs, collected from the latest models.

      Meta tried PPO too, but the report says DPO needed less compute at this scale and scored better on instruction following.

      :::papers The DPO loss Llama 3 used
      This is the loss from the DPO lesson:

      $$\mathcal{L} = -\log \sigma\!\Big(\beta \log \frac{\pi_\theta(y_w \mid x)}{\pi_{\text{ref}}(y_w \mid x)} - \beta \log \frac{\pi_\theta(y_l \mid x)}{\pi_{\text{ref}}(y_l \mid x)}\Big)$$

      $y_w$ and $y_l$ are the chosen and rejected responses. Llama 3 set $\beta = 0.1$. It also masked the chat format's header and end-of-turn tokens out of this loss, because they appear in both responses and pushed the model to stop abruptly or repeat itself. It also added a small negative log-likelihood term on the chosen responses (weight 0.2) to steady training.
      :::
    diagram:
      caption: One of Llama 3's six post-training rounds. Each round starts from the best model so far.
      description: Human preference pairs train a reward model. The best current model samples several responses per prompt, and the reward model keeps the best one; this is rejection sampling. The kept responses feed supervised fine-tuning, and new preference pairs feed DPO after it. The resulting model becomes the best current model for the next round, shown by a dashed arrow back.
      nodes:
        - id: prefs
          label: Human preference pairs
          col: 2
          row: 0
          tone: data
        - id: rm
          label: Reward model
          col: 1
          row: 0
          tone: muted
        - id: current
          label: Best current model
          col: 0
          row: 2
          tone: accent
        - id: rs
          label: Rejection sampling
          note: sample several, keep top-scored
          col: 1
          row: 1
        - id: sft
          label: SFT
          note: prompt tokens masked
          col: 2
          row: 1
        - id: dpo
          label: DPO
          note: beta 0.1, format tokens masked
          col: 3
          row: 1
      edges:
        - from: prefs
          to: rm
        - from: current
          to: rs
          label: samples
        - from: rm
          to: rs
          label: scores
        - from: rs
          to: sft
        - from: sft
          to: dpo
        - from: prefs
          to: dpo
        - from: dpo
          to: current
          label: next round (6 in all)
          dashed: true
          bend: -1
    bridges: []
  - id: llama-three-case-study.s6
    title: What the download lets you test
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.llama-three-case-study
    markdown: |-
      With the base and Instruct checkpoints of the same size, you can see what post-training changed. Give both the same 30 fresh prompts: say, 10 policy questions, 10 JSON extraction tasks, and 10 requests the assistant should decline. Run both at temperature 0, with the Instruct model's own chat template, and score them with a rubric fixed in advance.

      Label the results **measured**: they come from your own tests. Keep them apart from the report's claims, which you label documented. A gap between base and Instruct shows the combined effect of all six rounds. It can't say which round, or which data, caused it.
    bridges: []
  - id: llama-three-case-study.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.llama-three-case-study
    markdown: Size Llama 3.1's weights, cache, and training compute from its config, then decide how a serving team, a fine-tuning startup, and a contract-review tool should read the report.
    takeaway: |-
      Llama 3.1 is one dense recipe at three sizes: GQA with 8 KV heads, about 15T tokens, staged context extension to 128K, and six rounds of SFT, rejection sampling, and DPO. Its 3.8 × 10²⁵ FLOPs is just 6ND.
  - id: llama-three-case-study.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.llama-three-case-study
    markdown: |-
      Trace Llama 3.1 through its documented dense architecture, training stages, adaptation, and cached decoding. Match every calculation to the specific checkpoint.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - llama-three-case-study.s1
        - llama-three-case-study.s2
        - llama-three-case-study.s5
        - llama-three-case-study.s4
        - llama-three-case-study.s3
        - llama-three-case-study.s6
        - llama-three-case-study.check
      gate_refs:
        - gate.core
  scene_aliases:
    llama-three-case-study.recap: llama-three-case-study.check
assessment_families:
  - id: llama-three-case-study.base
    objective_ref: objective.llama-three-case-study
    task: base
    response_type: single_choice
    points: 1
    hint: Check which Llama release (April Llama 3 or July Llama 3.1) and which stage of the documented recipe the question is about.
    remediation_scene: llama-three-case-study.s2
    variants:
      - id: llama-three-case-study.base.1
        prompt: Which release branch anchors the report’s results in this lesson?
        options:
          - id: a
            text: Llama 3.1 from July 2024
          - id: b
            text: Every later Llama release automatically
          - id: c
            text: Only the April 2024 checkpoints
        answer: a
        feedback: The report distinguishes its historical artifacts.
        retired: true
      - id: llama-three-case-study.base.2
        prompt: Is the documented flagship dense or a sparse MoE?
        options:
          - id: b
            text: Sparse MoE
          - id: c
            text: A diffusion-only image model
          - id: a
            text: Dense
        answer: a
        feedback: The architecture description identifies a dense transformer.
        retired: true
  - id: llama-three-case-study.transfer
    objective_ref: objective.llama-three-case-study
    task: transfer
    response_type: single_choice
    points: 1
    hint: Separate what the report documents from what you can measure with the released checkpoints.
    remediation_scene: llama-three-case-study.s6
    variants:
      - id: llama-three-case-study.transfer.1
        prompt: Does an instruction checkpoint prove every later adaptation used PPO?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if it uses a reward model
          - id: a
            text: No; inspect the documented stage recipe
        answer: a
        feedback: Reward modeling and PPO are not synonymous.
        retired: true
      - id: llama-three-case-study.transfer.2
        prompt: Can a matching inference download alone recreate all original training data?
        options:
          - id: c
            text: Only if all weights load
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Weights and runtime artifacts differ from a full corpus release.
        retired: true
  - id: llama-three-case-study.base.v2
    objective_ref: objective.llama-three-case-study
    task: base
    response_type: single_choice
    points: 1
    hint: Go back to the architecture table and the six-round loop. Which numbers stay fixed across sizes, and which stage uses the reward model?
    remediation_scene: llama-three-case-study.s5
    variants:
      - id: llama-three-case-study.base.v2.1
        prompt: From Llama 3.1 8B to 405B, the parameter count grows about 50×, but the KV cache per token grows only about 4× (128 to 504 KiB). Why?
        options:
          - id: b
            text: The 405B stores its cache in FP8, while the 8B uses bf16
          - id: c
            text: The cache scales with model width, which grows only 4×
          - id: a
            text: KV heads and head width stay fixed, so only layer count grows
        answer: a
        feedback: Both models cache 8 KV heads of width 128 per layer, so the cache scales with layers, 32 to 126, about 3.9×. Width does grow 4×, but with GQA the cache depends on KV heads × head width, not on width.
      - id: llama-three-case-study.base.v2.2
        prompt: Which sequence describes one Llama 3 post-training round?
        options:
          - id: a
            text: Rank sampled responses with a reward model, fine-tune on the best, then run DPO
          - id: b
            text: Fine-tune on demonstrations, then run PPO against the reward model
          - id: c
            text: Run DPO on human pairs, then fine-tune on the reward model's own outputs
        answer: a
        feedback: Each round uses the reward model for rejection sampling, then SFT, then DPO on fresh pairs. Meta tried PPO but chose DPO for its lower compute and better instruction following, and the reward model scores responses; it doesn't write them.
      - id: llama-three-case-study.base.v2.3
        prompt: How did the Llama 3 405B reach its 128K context?
        options:
          - id: c
            text: By training at 128K from the first step, so long-range attention was learned throughout
          - id: a
            text: By six steps of continued pretraining from 8K to 128K, using about 800B tokens
          - id: b
            text: By raising the RoPE base at inference time, without any further training
        answer: a
        feedback: Long sequences came last, in six increments, because attention cost grows with the square of length. The higher RoPE base was set for training; it doesn't replace training on long documents.
      - id: llama-three-case-study.base.v2.4
        prompt: According to the report, why did Meta build a dense model instead of a mixture of experts?
        options:
          - id: b
            text: A dense model needs less memory to serve at the same quality
          - id: c
            text: Mixture-of-experts layers can't be combined with grouped-query attention
          - id: a
            text: To keep training as stable as possible at 405B scale
        answer: a
        feedback: The report says it chose a standard dense transformer "to maximize training stability." MoE models often need less compute per token for a given quality, and they combine with GQA without trouble.
  - id: llama-three-case-study.transfer.v2
    objective_ref: objective.llama-three-case-study
    task: transfer
    response_type: single_choice
    points: 1
    hint: Size the problem first (weights, cache, or context length), then pick the fix the report documents for that problem.
    remediation_scene: llama-three-case-study.s5
    variants:
      - id: llama-three-case-study.transfer.v2.1
        prompt: A team wants to serve Llama 3.1 405B in bf16 on a single server with eight 80 GB GPUs. What will they find?
        options:
          - id: a
            text: The weights alone, about 812 GB, exceed the server's 640 GB
          - id: b
            text: It fits, since only about 37B parameters are active per token
          - id: c
            text: It fits if they cap context at 8K, since the cache is the problem
        answer: a
        feedback: 405.8B × 2 bytes ≈ 812 GB before any cache. The report used two machines in bf16, or FP8. The model is dense, so every parameter is used for every token; 37B active is DeepSeek-V3's number.
      - id: llama-three-case-study.transfer.v2.2
        prompt: A startup runs DPO on its own chat data, and the model starts ending replies abruptly and repeating the last lines. Which change from the Llama 3 report targets this?
        options:
          - id: c
            text: Raise β well above 0.1, so the model stays closer to the reference
          - id: b
            text: Switch from DPO to PPO, since on-policy training is more stable
          - id: a
            text: Mask the header and end-of-turn tokens out of the DPO loss
        answer: a
        feedback: Llama 3 saw exactly these symptoms and fixed them by removing formatting tokens from the loss, since they appear in both chosen and rejected responses. A larger β or PPO doesn't address the tokens themselves.
      - id: llama-three-case-study.transfer.v2.3
        prompt: A contract-review tool feeds 20,000-token documents to two models. Llama 3.1 8B Instruct handles them; the April 2024 Llama 3 8B Instruct fails. Which inventory difference explains this?
        options:
          - id: b
            text: The April model used full multi-head attention without GQA
          - id: a
            text: The April model supported an 8K context; 3.1 was extended to 128K
          - id: c
            text: The April model had a much smaller vocabulary, so documents ran longer
        answer: a
        feedback: The report's release table and the 3.1 card show the context change. The April 8B already used GQA and the same 128K-token vocabulary.
      - id: llama-three-case-study.transfer.v2.4
        prompt: Another lab plans an 8B model on 15T tokens, far past Chinchilla's roughly 20 tokens per parameter. A reviewer calls it wasteful. What was Llama 3's reason for doing the same?
        options:
          - id: a
            text: A small model trained longer is cheaper to serve at the same quality
          - id: b
            text: Chinchilla's rule doesn't hold for models with large vocabularies
          - id: c
            text: The 8B had to see every 405B token to be distilled from it later
        answer: a
        feedback: Chinchilla minimizes training compute, but serving costs about 2N FLOPs per token for the model's whole life. The report says it trained the small models "much longer than is compute-optimal" for exactly this reason.
  - id: llama-three-case-study.calculate
    objective_ref: objective.llama-three-case-study
    task: base
    response_type: numeric
    points: 1
    hint: "Weights = parameters × bytes. KV per token = 2 × layers × KV heads × 128 × bytes (Llama 3.1 always has 8 KV heads). Compute ≈ 6 × parameters × tokens. Watch the units the question asks for."
    remediation_scene: llama-three-case-study.s5
    absolute_tolerance: 1
    variants:
      - id: llama-three-case-study.calculate.1
        prompt: Llama 3.1 70B has 70.6 billion parameters. How many GB do its weights take in bf16?
        answer: 141.2
        feedback: 70.6 × 10⁹ × 2 bytes = 141.2 GB. In FP8 it would be about 71 GB.
      - id: llama-three-case-study.calculate.2
        prompt: Llama 3.1 405B has 126 layers and 8 KV heads of width 128. With a 2-byte cache, how many KiB does each token add?
        answer: 504
        feedback: 2 × 126 × 8 × 128 × 2 = 516,096 bytes, and 516,096 ÷ 1,024 = 504 KiB.
      - id: llama-three-case-study.calculate.3
        prompt: Using C ≈ 6ND, what is the training compute of a 405-billion-parameter model on 15.6 trillion tokens, in units of 10²⁴ FLOPs?
        answer: 37.9
        feedback: 6 × 405 × 10⁹ × 15.6 × 10¹² = 3.79 × 10²⁵ = 37.9 × 10²⁴ FLOPs, matching the report's 3.8 × 10²⁵.
      - id: llama-three-case-study.calculate.4
        prompt: Llama 3.1 70B caches 320 KiB per token. How many GiB does one 131,072-token (128K) conversation need?
        answer: 40
        feedback: 320 KiB × 131,072 = 41,943,040 KiB, and dividing by 1,024² gives 40 GiB, about a third of the model's own bf16 weights.
      - id: llama-three-case-study.calculate.5
        prompt: The 405B's pretraining took 3.8 × 10²⁵ FLOPs, and the model card lists 30.84 million H100 GPU-hours. How many TFLOP/s of useful work did each GPU average?
        answer: 342
        feedback: 30.84 × 10⁶ hours × 3,600 s = 1.11 × 10¹¹ GPU-seconds. 3.8 × 10²⁵ ÷ 1.11 × 10¹¹ ≈ 3.42 × 10¹⁴ FLOP/s = 342 TFLOP/s, about 35% of the H100's roughly 989 TFLOP/s bf16 peak.
