objectives:
- id: objective.llama-three-case-study
  version: 1-draft
  statement: 'The Llama 3 report provides a dated dense-decoder case: connect documented architecture, corpus
    preparation, staged training, preference adaptation, and cached serving while distinguishing released artifacts
    from missing training inputs.'
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
