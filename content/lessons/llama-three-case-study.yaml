scenes:
- id: llama-three-case-study.s1
  title: Pin the historical release
  type: explanation
  depth: intuition
  objective_refs:
  - objective.llama-three-case-study
  markdown: 'Anchor: The Llama 3 Herd of Models, revision 3 dated November 23, 2024, describing the July 2024
    Llama 3.1 results. Its terminology also discusses earlier Llama 3 releases. Keep April and July checkpoints
    distinct when comparing context, capabilities, or templates. Sources checked September 13, 2026.'
  text_mode: 'Anchor: The Llama 3 Herd of Models, revision 3 dated November 23, 2024, describing the July 2024
    Llama 3.1 results. Its terminology also discusses earlier Llama 3 releases. Keep April and July checkpoints
    distinct when comparing context, capabilities, or templates. Sources checked September 13, 2026.'
  bridges: []
- id: llama-three-case-study.s2
  title: Read the architecture and pretraining
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.llama-three-case-study
  markdown: The report describes dense decoder transformers, grouped-query attention, a 128K-token vocabulary,
    and a 405B flagship trained on 15.6T tokens. Corpus filtering, deduplication, mixture selection, initial
    training, long-context extension, and annealing form distinct stages. **Annealing** gradually lowers the
    learning rate near a training stage’s end. These choices affect both what is learned and what later inference
    costs.
  text_mode: The report describes dense decoder transformers, grouped-query attention, a 128K-token vocabulary,
    and a 405B flagship trained on 15.6T tokens. Corpus filtering, deduplication, mixture selection, initial
    training, long-context extension, and annealing form distinct stages. **Annealing** gradually lowers the
    learning rate near a training stage’s end. These choices affect both what is learned and what later inference
    costs.
  bridges: []
- id: llama-three-case-study.s3
  title: Follow post-training transitions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.llama-three-case-study
  markdown: 'The documented post-training workflow uses iterative rounds involving a preference reward model
    for selecting examples, supervised fine-tuning, and direct preference optimization.


    **SFT** learns from example responses. **DPO** learns a relative preference between responses. The reward
    model can help choose which generated examples enter supervised training. These operations change model
    weights; the sampler choosing tokens at inference ordinarily does not.


    Follow the stages the report documents rather than adding an assumed PPO stage. Data quality and loss masking
    matter alongside the algorithm names.'
  text_mode: 'The documented post-training workflow uses iterative rounds involving a preference reward model
    for selecting examples, supervised fine-tuning, and direct preference optimization.


    **SFT** learns from example responses. **DPO** learns a relative preference between responses. The reward
    model can help choose which generated examples enter supervised training. These operations change model
    weights; the sampler choosing tokens at inference ordinarily does not.


    Follow the stages the report documents rather than adding an assumed PPO stage. Data quality and loss masking
    matter alongside the algorithm names.'
  bridges: []
- id: llama-three-case-study.s4
  title: Inspect the released interface
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.llama-three-case-study
  markdown: The official Llama 3.1 model card provides base/instruction variants, use information, and the
    Llama 3.1 community-license reference. Obtain the matching tokenizer and configuration with the checkpoint.
    Published weights and utilities do not make the entire original pretraining corpus reproducible from that
    download.
  text_mode: The official Llama 3.1 model card provides base/instruction variants, use information, and the
    Llama 3.1 community-license reference. Obtain the matching tokenizer and configuration with the checkpoint.
    Published weights and utilities do not make the entire original pretraining corpus reproducible from that
    download.
  bridges: []
- id: llama-three-case-study.s5
  title: Trace one served token
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.llama-three-case-study
  markdown: 'Apply the checkpoint’s chat template, tokenize, run prompt prefill, retain compatible key/value
    states, and decode under explicit sampling and stop rules. Dense feed-forward computation differs from
    an MoE branch, while GQA affects the cache. Measure this workload before comparing hardware or quantization
    choices.


    Try the 8B architecture in report Table 3: 32 layers, 32 query heads, eight KV heads, and head width 4,096/32
    = 128. With two-byte cached values and batch size one, dense KV payload per token is 2 × 32 × 8 × 128 ×
    2 = 131,072 bytes, or 128 KiB. At 4,096 retained positions, that is 512 MiB. This calculation excludes
    weights, buffers, and allocation overhead. Using the query-head count instead would overestimate this payload
    fourfold.'
  text_mode: 'Apply the checkpoint’s chat template, tokenize, run prompt prefill, retain compatible key/value
    states, and decode under explicit sampling and stop rules. Dense feed-forward computation differs from
    an MoE branch, while GQA affects the cache. Measure this workload before comparing hardware or quantization
    choices.


    Try the 8B architecture in report Table 3: 32 layers, 32 query heads, eight KV heads, and head width 4,096/32
    = 128. With two-byte cached values and batch size one, dense KV payload per token is 2 × 32 × 8 × 128 ×
    2 = 131,072 bytes, or 128 KiB. At 4,096 retained positions, that is 512 MiB. This calculation excludes
    weights, buffers, and allocation overhead. Using the query-head count instead would overestimate this payload
    fourfold.'
  bridges: []
- id: llama-three-case-study.s6
  title: Make a bounded comparison
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.llama-three-case-study
  markdown: Compare base and instruction checkpoints on fresh tasks using documented settings, then examine
    which behaviors changed. Separate report claims from measurements you run. This case illustrates a complete
    lifecycle argument; it does not require downloading a 405B model or reproduce the original training experiment.
  text_mode: Compare base and instruction checkpoints on fresh tasks using documented settings, then examine
    which behaviors changed. Separate report claims from measurements you run. This case illustrates a complete
    lifecycle argument; it does not require downloading a 405B model or reproduce the original training experiment.
  bridges: []
