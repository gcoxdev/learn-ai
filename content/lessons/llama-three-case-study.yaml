  version: 0.3.0-draft
  title: Trace the Llama 3.1 dense decoder lifecycle
  state: draft
  summary: Trace a dense language model from training examples to one cached output token.
  slot: M35.2
  category: learning
  sources:
  - title: Llama 3 report v3
    url: https://arxiv.org/abs/2407.21783v3
  - title: Llama 3.1 official model card
