schema_version: 0.2-draft
lesson:
  id: group-relative-policy-learning
  version: 0.1.0-draft
  title: Compare several sampled solutions to form a baseline
  state: draft
  summary: GRPO-style methods derive relative learning signals from groups of responses, then update policy probabilities
    with specified clipping and regularization; group variance and sampling choices affect the signal.
  slot: M21.4
  category: learning
  minutes: 12
  sources:
  - title: DeepSeekMath
    url: https://arxiv.org/abs/2402.03300
objectives:
- id: objective.group-relative-policy-learning
  version: 1-draft
  statement: GRPO-style methods derive relative learning signals from groups of responses, then update policy probabilities
    with specified clipping and regularization; group variance and sampling choices affect the signal.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - group-relative-policy-learning.base
  - group-relative-policy-learning.transfer
  prerequisites:
  - anyOf:
    - objective.verifiable-rewards
  - anyOf:
    - objective.rlhf-and-kl-control
  - anyOf:
    - objective.statistics-evidence
scenes:
- id: group-relative-policy-learning.s1
  title: Sample a group for one prompt
  type: explanation
  depth: intuition
  objective_refs:
  - objective.group-relative-policy-learning
  markdown: Generate several candidate responses from a rollout policy and score them. A group-relative approach
    compares each score with its group’s baseline, avoiding a separately trained value model in the original GRPO
    formulation. This changes baseline estimation, not the need for valid rewards.
  text_mode: Generate several candidate responses from a rollout policy and score them. A group-relative approach
    compares each score with its group’s baseline, avoiding a separately trained value model in the original GRPO
    formulation. This changes baseline estimation, not the need for valid rewards.
  bridges: []
- id: group-relative-policy-learning.s2
  title: Calculate centered scores
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.group-relative-policy-learning
  markdown: For rewards zero, one, and one, the group mean is two-thirds. Centered rewards are minus two-thirds,
    one-third, and one-third. A standardized version divides by group standard deviation with a defined numerical
    convention. Above-average responses receive a different local signal from below-average ones.
  text_mode: For rewards zero, one, and one, the group mean is two-thirds. Centered rewards are minus two-thirds,
    one-third, and one-third. A standardized version divides by group standard deviation with a defined numerical
    convention. Above-average responses receive a different local signal from below-average ones.
  bridges:
  - statistics-evidence
- id: group-relative-policy-learning.s3
  title: Handle degenerate and biased groups
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.group-relative-policy-learning
  markdown: If every sampled response has identical reward, a centered group gives no relative distinction, and
    standardization needs zero-variance handling. Group size, reward sparsity, response-length normalization, and
    sampling temperature affect the training signal. Later algorithm variants can change these details substantially.
  text_mode: If every sampled response has identical reward, a centered group gives no relative distinction, and
    standardization needs zero-variance handling. Group size, reward sparsity, response-length normalization, and
    sampling temperature affect the training signal. Later algorithm variants can change these details substantially.
  bridges: []
- id: group-relative-policy-learning.s4
  title: Keep the objective and rollout state explicit
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.group-relative-policy-learning
  markdown: Specify the old policy, current policy, reference model, clipping, KL treatment, and token or sequence
    averaging. Generated data can become stale after updates. Compare held-out problem solving and compute cost,
    not just training reward, when deciding whether a group-relative recipe helped.
  text_mode: Specify the old policy, current policy, reference model, clipping, KL treatment, and token or sequence
    averaging. Generated data can become stale after updates. Compare held-out problem solving and compute cost,
    not just training reward, when deciding whether a group-relative recipe helped.
  bridges: []
- id: group-relative-policy-learning.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.group-relative-policy-learning
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: group-relative-policy-learning.recap
  title: One idea to take with you
  type: recap
