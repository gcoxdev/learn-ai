assessment_families:
  - id: group-relative-policy-learning.base
    objective_ref: objective.group-relative-policy-learning
    task: base
    response_type: single_choice
    points: 1
    hint: 'Calculate centered scores: trace the inputs, operation, and result before choosing.'
    remediation_scene: group-relative-policy-learning.s2
    variants:
      - id: group-relative-policy-learning.base.1
        prompt: Rewards 0, 1, 1 have mean what?
        options:
          - id: a
            text: Two-thirds
          - id: b
            text: One
          - id: c
            text: Zero
        answer: a
        feedback: The total two is divided by three responses.
        retired: true
      - id: group-relative-policy-learning.base.2
        prompt: What happens to centered relative signals if all rewards are identical?
        options:
          - id: b
            text: They prove every solution is correct
          - id: c
            text: They automatically select one best response
          - id: a
            text: They provide no within-group distinction
        answer: a
        feedback: Equal scores cannot rank the group.
        retired: true
  - id: group-relative-policy-learning.transfer
    objective_ref: objective.group-relative-policy-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Keep the objective and rollout state explicit: trace the inputs, operation, and result before choosing.'
    remediation_scene: group-relative-policy-learning.s4
    variants:
      - id: group-relative-policy-learning.transfer.1
        prompt: What does the original group baseline replace?
        options:
          - id: b
            text: The need for rewards
          - id: c
            text: All policy parameters
          - id: a
            text: A separately learned value baseline in that formulation
        answer: a
        feedback: Relative group statistics supply the comparison signal.
        retired: true
      - id: group-relative-policy-learning.transfer.2
        prompt: Why state token-versus-sequence normalization?
        options:
          - id: c
            text: It guarantees identical objectives
          - id: a
            text: It can change how response lengths influence updates
          - id: b
            text: It only changes file formatting
        answer: a
        feedback: Averaging conventions affect the optimization target.
        retired: true
  - id: group-relative-policy-learning.base.v2
    objective_ref: objective.group-relative-policy-learning
    task: base
    response_type: single_choice
    points: 1
    hint: Every answer is judged only against its own group. Ask what the group mean and spread are, and what that leaves for this answer.
    remediation_scene: group-relative-policy-learning.s2
    variants:
      - id: group-relative-policy-learning.base.v2.1
        prompt: In GRPO, what serves as the baseline that a sampled answer's reward is compared with?
        options:
          - id: b
            text: A value network's estimate of the expected reward at each token
          - id: a
            text: The average reward of the group sampled for the same question
          - id: c
            text: The reward the frozen reference model earned on that question
        answer: a
        feedback: GRPO samples G answers per question and uses their mean reward as the baseline. Dropping the value network is the whole point, and the reference model is used only for the KL penalty, not as a baseline.
      - id: group-relative-policy-learning.base.v2.2
        prompt: Why does GRPO need less memory than PPO when training a language model?
        options:
          - id: a
            text: It drops the critic, which is usually about as big as the policy
          - id: b
            text: It keeps only the single best answer from each sampled group
          - id: c
            text: It skips the reference model and the KL penalty that uses it
        answer: a
        feedback: PPO trains a value network roughly the size of the policy; GRPO replaces it with group statistics. GRPO still trains on the whole group, and it keeps a reference model for its KL term.
      - id: group-relative-policy-learning.base.v2.3
        prompt: All eight answers in a GRPO group are correct. Apart from the KL term, what does the policy learn from this question?
        options:
          - id: c
            text: It reinforces the shortest of the eight correct answers most
          - id: b
            text: It strongly reinforces all eight, since each one earned reward
          - id: a
            text: Nothing, since every answer's advantage works out to zero
        answer: a
        feedback: Every reward equals the group mean, so every advantage is 0 and the clipped term contributes no gradient. GRPO learns only where answers disagree. Earning reward isn't enough; an answer has to beat its siblings.
      - id: group-relative-policy-learning.base.v2.4
        prompt: In outcome-supervised GRPO, how is an answer's advantage spread over its tokens?
        options:
          - id: a
            text: Every token in the answer gets the same normalized reward
          - id: b
            text: Only the final token gets it, where the reward is earned
          - id: c
            text: Tokens nearer the end get a larger share of the reward
        answer: a
        feedback: With one reward per answer, GRPO sets the advantage of every token to that answer's normalized reward. It has no way to single out which tokens mattered; the process-reward lesson looks at scoring individual steps.
      - id: group-relative-policy-learning.base.v2.5
        prompt: How does GRPO apply its KL penalty, compared with the PPO-based RLHF setup?
        options:
          - id: b
            text: It subtracts the KL from each answer's reward before normalizing
          - id: a
            text: It adds the KL to the loss as a separate term, not to the reward
          - id: c
            text: It drops the KL penalty and relies on ratio clipping instead
        answer: a
        feedback: DeepSeekMath adds the KL divergence directly to the loss, so it doesn't distort the group-relative advantages. PPO-based RLHF folds it into the reward instead. GRPO uses both clipping and a KL term.
  - id: group-relative-policy-learning.transfer.v2
    objective_ref: objective.group-relative-policy-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work out what the group rewards look like in this situation, then what dividing by their spread does to them.
    remediation_scene: group-relative-policy-learning.s3
    variants:
      - id: group-relative-policy-learning.transfer.v2.1
        prompt: A team runs GRPO with G = 8 on a problem set the model already solves 95% of the time. Training barely moves. What is the most likely reason?
        options:
          - id: a
            text: Most groups are all correct, so most advantages are zero
          - id: b
            text: G = 8 is too large a group for the critic network to fit
          - id: c
            text: The KL penalty is cancelling out the correct answers' rewards
        answer: a
        feedback: At p = 0.95, a group of 8 is all correct about 66% of the time (0.95⁸ ≈ 0.663), and those groups give no signal. Harder problems, or filtering out all-agree groups as DAPO does, restore it. GRPO has no critic to fit.
      - id: group-relative-policy-learning.transfer.v2.2
        prompt: A coding task's reward is the fraction of 10 tests passed. A group scores 0.9, 0.9, 1.0, 0.9. What advantage does the 1.0 answer get?
        options:
          - id: c
            text: About 0, since each answer passed most of the tests
          - id: a
            text: About +1.73, since the group's spread is very small
          - id: b
            text: About +0.1, since it is just 0.1 better than the rest
        answer: a
        feedback: The mean is 0.925 and the standard deviation about 0.043, so (1.0 − 0.925) ÷ 0.043 ≈ +1.73. Dividing by the spread makes small gaps count as much as big ones. The raw gap of 0.1 is exactly what the division rescales.
      - id: group-relative-policy-learning.transfer.v2.3
        prompt: Your GPUs can hold the policy and a frozen reference model, but not another network of the same size. Which method fits?
        options:
          - id: b
            text: PPO with a learned critic, since it needs no second network
          - id: c
            text: Neither; reinforcement learning always needs a critic
          - id: a
            text: GRPO, since the group mean takes the place of the critic
        answer: a
        feedback: GRPO was designed for this. The group average replaces PPO's critic, which is usually about as big as the policy. REINFORCE-style methods like GRPO show that a learned critic isn't required, just a baseline.
        retired: true
      - id: group-relative-policy-learning.transfer.v2.4
        prompt: A support-chat model is trained with GRPO using a learned reward model. Within most groups, rewards differ only by tiny amounts caused by the reward model's noise. What does dividing by the group's standard deviation do?
        options:
          - id: a
            text: Scales the noise up into full-sized advantages
          - id: b
            text: Shrinks all the advantages toward zero
          - id: c
            text: Removes the noise, since the mean is subtracted
        answer: a
        feedback: When the spread is tiny, dividing by it blows small differences up to advantages near ±1 or more, so noise is trained on as if it were signal. Subtracting the mean shifts rewards; it doesn't remove noise between answers.
      - id: group-relative-policy-learning.transfer.v2.5
        prompt: You're training a maths model with an answer checker. Your GPUs hold the policy and a frozen reference model, but no third network of that size. Which setup fits?
        options:
          - id: b
            text: PPO, with the frozen reference model reused as the critic
          - id: a
            text: GRPO, sampling several answers per question for a group baseline
          - id: c
            text: PPO with a critic of the same size, run with a smaller batch
        answer: a
        feedback: GRPO needs no critic, because each group's average reward is the baseline, so the policy and reference model fit. A critic must be trained to predict reward, so a frozen reference model can't stand in for one, and a smaller batch doesn't shrink a policy-sized critic.
  - id: group-relative-policy-learning.calculate
    objective_ref: objective.group-relative-policy-learning
    task: base
    response_type: numeric
    points: 1
    hint: Find the group mean, then the standard deviation (divide the summed squared gaps by G, then take the square root), then compute (reward − mean) ÷ std.
    remediation_scene: group-relative-policy-learning.s2
    absolute_tolerance: 0.01
    variants:
      - id: group-relative-policy-learning.calculate.1
        prompt: A GRPO group of 4 answers earns rewards 1, 0, 0, 0. Using the standard deviation that divides by G, what is the advantage of the correct answer?
        answer: 1.732
        feedback: The mean is 0.25 and the standard deviation is √((0.75² + 3 × 0.25²) ÷ 4) = √0.1875 ≈ 0.433. So (1 − 0.25) ÷ 0.433 ≈ 1.732.
      - id: group-relative-policy-learning.calculate.2
        prompt: A GRPO group of 4 answers earns rewards 1, 1, 1, 0. Using the standard deviation that divides by G, what is the advantage of the wrong answer?
        answer: -1.732
        feedback: The mean is 0.75 and the standard deviation is ≈ 0.433. So (0 − 0.75) ÷ 0.433 ≈ −1.732, the mirror image of a lone success.
      - id: group-relative-policy-learning.calculate.3
        prompt: A GRPO group of 8 answers has 2 correct (reward 1) and 6 wrong (reward 0). Using the standard deviation that divides by G, what is the advantage of each wrong answer?
        answer: -0.577
        feedback: The mean is 0.25 and the standard deviation is √(0.25 × 0.75) ≈ 0.433. So (0 − 0.25) ÷ 0.433 ≈ −0.577.
      - id: group-relative-policy-learning.calculate.4
        prompt: A partial-credit task gives a group of 3 answers rewards 0.2, 0.6, and 1.0. Using the standard deviation that divides by G, what is the advantage of the 1.0 answer?
        answer: 1.225
        feedback: The mean is 0.6. The squared gaps are 0.16, 0, and 0.16, so the standard deviation is √(0.32 ÷ 3) ≈ 0.327. The advantage is 0.4 ÷ 0.327 ≈ 1.225.
      - id: group-relative-policy-learning.calculate.5
        prompt: A GRPO group of 4 answers earns rewards 1, 0, 1, 0. Using the standard deviation that divides by G, what is the advantage of a correct answer?
        answer: 1
        feedback: The mean is 0.5 and every reward is 0.5 away from it, so the standard deviation is 0.5 and the advantage is 0.5 ÷ 0.5 = 1.
