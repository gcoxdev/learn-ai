schema_version: 0.2-draft
lesson:
  id: group-relative-policy-learning
  version: 0.3.0-draft
  title: Compare several sampled solutions to form a baseline
  state: draft
  summary: Compare several responses to the same prompt and calculate a learning signal relative to their group.
  slot: M21.4
  category: learning
  sources:
  - title: DeepSeekMath
    url: https://arxiv.org/abs/2402.03300
objectives:
- id: objective.group-relative-policy-learning
  version: 1-draft
  statement: GRPO-style methods derive relative learning signals from groups of responses, then update policy
    probabilities with specified clipping and regularization; group variance and sampling choices affect the
    signal.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - group-relative-policy-learning.base
  - group-relative-policy-learning.transfer
  prerequisites:
  - anyOf:
    - objective.verifiable-rewards
  - anyOf:
    - objective.rlhf-and-kl-control
  - anyOf:
    - objective.statistics-evidence
scenes:
- id: group-relative-policy-learning.s1
  title: Sample a group for one prompt
  type: explanation
  depth: intuition
  objective_refs:
  - objective.group-relative-policy-learning
  markdown: '**Group relative policy optimization**, or **GRPO**, generates several responses to the same prompt
    and scores them. Each score is compared with a **baseline**, a score used to judge whether that response
    did better or worse than expected.


    In the original GRPO formulation, the group supplies this comparison without a separately trained value
    model. The prompt stays fixed while the model samples alternatives. This changes how the baseline is estimated;
    the rewards still need to measure something useful.'
  text_mode: '**Group relative policy optimization**, or **GRPO**, generates several responses to the same
    prompt and scores them. Each score is compared with a **baseline**, a score used to judge whether that
    response did better or worse than expected.


    In the original GRPO formulation, the group supplies this comparison without a separately trained value
    model. The prompt stays fixed while the model samples alternatives. This changes how the baseline is estimated;
    the rewards still need to measure something useful.'
  bridges: []
- id: group-relative-policy-learning.s2
  title: Calculate centered scores
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.group-relative-policy-learning
  markdown: 'For rewards zero, one, and one, the group mean is two-thirds. Centered rewards are minus two-thirds,
    one-third, and one-third. A standardized version divides by group standard deviation with a defined numerical
    convention. Above-average responses receive a different local signal from below-average ones.


    The **standard deviation** measures spread around a mean. With rewards [0, 1, 1] and population-variance
    convention, squared deviations average to 2/9, so standard deviation is about 0.471. Dividing centered
    rewards gives approximately [−1.414, 0.707, 0.707], ignoring the stabilizer for this illustration. Other
    denominator and stabilization conventions must be specified.'
  text_mode: 'For rewards zero, one, and one, the group mean is two-thirds. Centered rewards are minus two-thirds,
    one-third, and one-third. A standardized version divides by group standard deviation with a defined numerical
    convention. Above-average responses receive a different local signal from below-average ones.


    The **standard deviation** measures spread around a mean. With rewards [0, 1, 1] and population-variance
    convention, squared deviations average to 2/9, so standard deviation is about 0.471. Dividing centered
    rewards gives approximately [−1.414, 0.707, 0.707], ignoring the stabilizer for this illustration. Other
    denominator and stabilization conventions must be specified.'
  bridges:
  - statistics-evidence
  - random-variables
- id: group-relative-policy-learning.s3
  title: Handle degenerate and biased groups
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.group-relative-policy-learning
  markdown: If every sampled response has identical reward, a centered group gives no relative distinction,
    and standardization needs zero-variance handling. Group size, reward sparsity, response-length normalization,
    and sampling temperature affect the training signal. Later algorithm variants can change these details
    substantially.
  text_mode: If every sampled response has identical reward, a centered group gives no relative distinction,
    and standardization needs zero-variance handling. Group size, reward sparsity, response-length normalization,
    and sampling temperature affect the training signal. Later algorithm variants can change these details
    substantially.
  bridges: []
- id: group-relative-policy-learning.s4
  title: Keep the objective and rollout state explicit
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.group-relative-policy-learning
  markdown: 'Three model states can have different roles:


    - The **old policy** generated the sampled responses.

    - The **current policy** is being updated.

    - A **reference model**, if used, anchors a separate divergence penalty.


    Document which states the objective compares, how it clips or penalizes changes, and whether it averages
    over tokens or sequences. Sampled data can become stale as the current policy changes. To judge the recipe,
    compare results on held-out problems and total compute cost as well as training reward.'
  text_mode: 'Three model states can have different roles:


    - The **old policy** generated the sampled responses.

    - The **current policy** is being updated.

    - A **reference model**, if used, anchors a separate divergence penalty.


    Document which states the objective compares, how it clips or penalizes changes, and whether it averages
    over tokens or sequences. Sampled data can become stale as the current policy changes. To judge the recipe,
    compare results on held-out problems and total compute cost as well as training reward.'
  bridges: []
- id: group-relative-policy-learning.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
