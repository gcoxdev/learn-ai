    differ.


    Before choosing an algorithm, say what a useful group would let you do. Calling the resulting groups “small”
    and “large” describes this measurement; it does not establish permanent natural kinds of shops.'
  bridges: []
- id: clustering.s2
  title: Assign shops, then move the centers
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.clustering
  markdown: '**K-means** repeats two steps: assign each point to its nearest center, then move each center
    to the mean of its assigned points. The number k tells us how many centers to use; here it is two.


    Start the centers at 2 and 6. The shop at 4 is equally far from both, so our lab uses a tie rule: send
    it to A. Predict its assignment, then reveal the groups. A receives 1, 2, and 4. Their **mean** is their
    sum divided by their count: 7 / 3, or about 2.33. B receives 8, 9, and 10, giving a mean of 27 / 3 = 9.


    Keep those assignments fixed while updating the centers. The squared-distance total measures how compact
    the groups are around them. A full run repeats assignment and update, and different starting centers can
    lead to different local solutions. If a group is empty, this lab keeps its old center because there is
    no group mean.'
  text_mode: '**K-means** repeats two steps: assign each point to its nearest center, then move each center
    to the mean of its assigned points. The number k tells us how many centers to use; here it is two.


    Start the centers at 2 and 6. The shop at 4 is equally far from both, so our lab uses a tie rule: send
    it to A. Predict its assignment, then reveal the groups. A receives 1, 2, and 4. Their **mean** is their
    sum divided by their count: 7 / 3, or about 2.33. B receives 8, 9, and 10, giving a mean of 27 / 3 = 9.


    Keep those assignments fixed while updating the centers. The squared-distance total measures how compact
    the groups are around them. A full run repeats assignment and update, and different starting centers can
    lead to different local solutions. If a group is empty, this lab keeps its old center because there is
    no group mean.'
  bridges:
  - geometry-and-symmetry
  figure:
    kind: clustering
    caption: Predict a point’s assignment, then move two centers to the means of their assigned points.
    description: Six fixed one-dimensional points are assigned to their nearest starting center, with ties
      going to A. One center update displays group means and the change in squared-distance total.
- id: clustering.s3
  title: Different methods find different shapes
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.clustering
  markdown: 'K-means favors groups compact around a mean under squared distance. Two crescent-shaped bands
    may not fit that pattern well: one center per band does little to describe the curve.


    **Hierarchical clustering** builds nested groups by merging or splitting. A **linkage rule** defines distance
    between groups—for example, the distance between their closest members. Choosing a level in the hierarchy
    gives broader or finer groups.


    **Density methods** connect sufficiently crowded neighborhoods and may mark sparse points as noise. A neighborhood
    is the region treated as near a point. For example, a rule could require several other points within a
    chosen distance. This can suit curved bands, but the distance and density settings affect the result. Choose
    a method whose assumptions fit the grouping task.'
