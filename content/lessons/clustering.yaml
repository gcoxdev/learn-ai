schema_version: 0.2-draft
lesson:
  id: clustering
  version: 0.4.0-draft
  title: Find groups that help with your task
  state: draft
  summary: Six shops, one bread van, and no labels. Watch k-means split the shops into two rounds in a couple of moves, then see how a change of units can reshuffle every group.
  slot: M08.1
  category: learning
  sources:
    - title: An Introduction to Statistical Learning — authors’ materials
      url: https://www.statlearning.com/
    - title: scikit-learn — k-means clustering
      url: https://scikit-learn.org/stable/modules/clustering.html#k-means
    - title: "Least Squares Quantization in PCM (Lloyd, 1982; written 1957)"
      url: https://doi.org/10.1109/TIT.1982.1056489
    - title: "A Density-Based Algorithm for Discovering Clusters (Ester et al., 1996)"
      url: https://cdn.aaai.org/KDD/1996/KDD96-037.pdf
objectives:
  - id: objective.clustering
    version: 2-draft
    statement: Clustering groups examples under a similarity criterion; k-means, hierarchical, and density methods make different assumptions about shape, scale, and outliers.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - clustering.base.v2
      - clustering.transfer.v2
      - clustering.calc.v2
    prerequisites:
      - anyOf:
          - objective.nearest-neighbors
      - anyOf:
          - objective.random-variables
scenes:
  - id: clustering.s1
    title: Six shops, two rounds, no answer key
    type: explanation
    depth: intuition
    objective_refs:
      - objective.clustering
    markdown: |-
      You drive a bakery van. Six shops order 1, 2, 4, 8, 9, and 10 crates of bread a day, and you want to split them into a light round and a heavy round. No shop arrives tagged "light." You have to find the groups in the numbers themselves.

      Finding groups in unlabeled data is called **clustering**. It's the classic case of **unsupervised learning**: learning from examples that have no target labels, unlike the classifiers of the supervised-learning module.

      Every clustering method rests on three choices:

      - **Representation**, the numbers describing each example. Here, crates per day. Use street addresses instead and the groups become neighborhoods.
      - **Distance**, how far apart two examples are. Here, the difference in crates: shops 8 and 10 are 2 apart.
      - **Objective**, what makes a grouping good. Here, every shop close to its round's typical order, so each van load is easy to plan.
    bridges: []
  - id: clustering.s2
    title: "Two moves, repeated: assign, then average"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.clustering
    markdown: |-
      **K-means** keeps one **center** per group, a value that stands for the group, and repeats two moves:

      1. **Assign:** each shop joins its nearest center.
      2. **Update:** each center moves to the **mean** (the average) of the shops that joined it.

      Take k = 2 groups and start the centers at A = 2 and B = 6. Shops 1 and 2 join A; 8, 9, and 10 join B. The shop at 4 is 2 from each, so we use a tie rule: ties go to A.

      Now update. A moves to (1 + 2 + 4) / 3 ≈ 2.33 and B to (8 + 9 + 10) / 3 = 9.

      :::predict Assign again with the new centers. Does any shop switch?
      No. The shop at 4 is now 1.67 from A and 5 from B, so it stays with A, this time for a real reason. When an assignment step changes nothing, k-means has **converged**: a light round of 7 crates and a heavy round of 27. Drag the starting centers in the lab; most starts end in these same rounds.
      :::

      The lab also reports the **sum of squared distances** from each shop to its center. This one update drops it from 34 to 6.67, and shrinking it is the whole point of k-means.
    bridges:
      - geometry-and-symmetry
    figure:
      kind: clustering
      caption: Predict a point’s assignment, then move two centers to the means of their assigned points.
      description: Six fixed one-dimensional points are assigned to their nearest starting center, with ties going to A. One center update displays group means and the change in squared-distance total.
  - id: clustering.lloyd
    title: The number k-means keeps shrinking
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.clustering
    markdown: |-
      Here are the same two moves in code:

      ```python run
      import numpy as np

      shops = np.array([1, 2, 4, 8, 9, 10], dtype=float)  # crates per day
      centers = np.array([2.0, 6.0])                     # starting guesses for A and B

      def total(centers, groups):
          """The k-means objective: sum of squared distances to assigned centers."""
          return np.sum((shops - centers[groups]) ** 2)

      for step in range(1, 4):
          # Assignment step: each shop joins its nearest center (ties go to A).
          groups = np.argmin(np.abs(shops[:, None] - centers), axis=1)
          labels = "".join("AB"[g] for g in groups)
          print(f"step {step}: groups {labels}, total with old centers = {total(centers, groups):.2f}")
          # Update step: each center moves to the mean of its shops.
          centers = np.array([shops[groups == k].mean() for k in range(2)])
          print(f"        new centers {np.round(centers, 2)}, total = {total(centers, groups):.2f}")
      ```

      From centers 2 and 6, the total drops from 34.00 to 6.67 and stays there. Now change the start to `[1.0, 2.0]`, both centers crowded at the light end. The printed totals fall 153.00, 47.20, 27.04, 21.25, 13.44, 6.67: three rounds instead of one, but the same groups. Keep starting centers inside the data, or a center can end up with no shops to average.

      :::papers The k-means objective
      With points $x_i$, groups $C_k$, and centers $\mu_k$, k-means minimizes

      $$J = \sum_{k=1}^{K} \sum_{i \in C_k} \lVert x_i - \mu_k \rVert^2$$

      For the bread rounds, $\mu_A = 2.33$ and $\mu_B = 9$, so $J = 1.78 + 0.11 + 2.78 + 1 + 0 + 1 = 6.67$. The loop in the code is **Lloyd's algorithm**: assign each point to its closest center, then set $\mu_k = \frac{1}{|C_k|}\sum_{i \in C_k} x_i$. Neither move can raise $J$, so the loop must stop, but possibly in a **local minimum**: a grouping neither move can improve, though a better one exists. Libraries therefore spread out the starting centers (the k-means++ rule) and keep the best of several runs.
      :::

      :::story A 1957 memo that waited 25 years
      Stuart Lloyd devised this procedure at Bell Labs in 1957, to choose the levels a digitized phone signal is rounded to. It was formally published only in 1982. James MacQueen had named the method "k-means" in 1967.
      :::
    diagram:
      caption: Lloyd's algorithm for k-means. The loop stops when an assignment step changes nothing.
      description: Pick k starting centers, then assign each point to its nearest center. Next, check whether any point switched groups. If yes, move each center to the mean of its group and go back to the assignment step. If no, stop, because the groups have converged.
      nodes:
        - id: start
          label: Pick k starting centers
          col: 0
          row: 0
          tone: muted
        - id: assign
          label: Assign each point to nearest center
          col: 1
          row: 0
          tone: accent
        - id: check
          label: Did any point switch groups?
          col: 2
          row: 0
          tone: warn
        - id: update
          label: Move each center to its group's mean
          col: 1
          row: 1
          tone: accent
        - id: done
          label: Stop
          note: converged
          col: 3
          row: 0
          tone: data
      edges:
        - from: start
          to: assign
        - from: assign
          to: check
        - from: check
          to: update
          label: "yes"
        - from: update
          to: assign
          label: new centers
        - from: check
          to: done
          label: "no"
  - id: clustering.choose-k
    title: Why not six rounds of one shop?
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.clustering
    markdown: |-
      Why two rounds and not three? Here's the best possible $J$ for each k:

      | k | Best grouping | Total $J$ |
      | ---: | --- | ---: |
      | 1 | {1, 2, 4, 8, 9, 10} | 73.33 |
      | 2 | {1, 2, 4} {8, 9, 10} | 6.67 |
      | 3 | {1, 2} {4} {8, 9, 10} | 2.50 |
      | 6 | every shop alone | 0 |

      :::mixup "Pick the k with the lowest total."
      The best total never rises as k grows, and six groups reach $J = 0$ without telling you anything. Look instead for the **elbow**, where extra groups stop helping much: 1 → 2 saves 66.67, but 2 → 3 saves only 4.17. Then check the job: you have time for two rounds.
      :::
  - id: clustering.s3
    title: When the groups aren't round blobs
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.clustering
    markdown: |-
      K-means assumes each group is a round blob around its center. Give it delivery stops along two crescent-shaped roads that curl around each other, and with k = 2 it slices straight across both.

      **Hierarchical clustering** starts with every point alone and keeps merging the two closest groups, recording the merges as a tree. A **linkage rule** measures distance between groups. Single linkage uses the closest pair of members, so it can follow a chain of points along a curve. On the shops, it merges 1–2 and 8–9–10 (gaps of 1), then adds 4 beside 2 (gap 2), and joins the two groups last (gap 4). Stop merging before the gap-4 join and you get the same two rounds.

      **Density-based clustering**, such as DBSCAN (Ester and colleagues, 1996), grows groups through crowded regions. In its simplest setting, a point is crowded if at least one other point lies within distance ε (epsilon). Crowded neighbors link into groups of any shape, and isolated points are labeled **noise**. With ε = 1.5, shops 1–2 and 8–9–10 form groups, and the shop at 4 is noise: its nearest neighbor is 2 away.

      "Noise" describes crowding, not importance. The shop at 4 still needs its bread.
  - id: clustering.s4
    title: Units decide who counts as near
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.clustering
    markdown: |-
      Now describe each shop with two numbers: crates per day and yearly revenue.

      | Shop | Crates per day | Revenue |
      | --- | ---: | ---: |
      | P | 2 | \$300,000 |
      | Q | 9 | \$310,000 |
      | R | 3 | \$340,000 |

      :::predict Which shop is closest to P?
      It depends on the units. In dollars, revenue swamps crates: P is about 10,000 from Q and 40,000 from R, so Q wins. In millions of dollars (0.30, 0.31, 0.34), P is 7.0 from Q and 1.0 from R, so R wins. Same shops, opposite answer.
      :::

      As in the nearest-neighbor lesson, a distance-based method inherits your units. The usual fix is to **standardize** each feature: subtract its mean and divide by its standard deviation, so every feature is measured in "typical spreads." That choice says crates and revenue count equally.

      Maya, who plans the routes, trusts her rounds only after two checks. She standardizes the features and reruns k-means from ten starts; all ten agree, so the groups are stable. And the heavy round's 27 crates fit one 30-crate van, so they're useful. Had the groups shifted from run to run, she'd have looked for better features first.
    bridges: []
  - id: clustering.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.clustering
    markdown: Customer segments, curved GPS tracks, song playlists, and a few k-means updates by hand test whether you can run the algorithm and judge the groups it finds.
    takeaway: |-
      K-means alternates two moves, assign each point to its nearest center and move each center to its group's mean, until nothing changes. Trust the groups only if they survive new starts and sensible units, and help with the job.
  - id: clustering.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.clustering
    markdown: |-
      Clustering groups examples according to a chosen notion of similarity. Check whether those groups are stable and useful for your task, rather than trusting their appearance alone.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - clustering.s1
        - clustering.s2
        - clustering.lloyd
        - clustering.choose-k
        - clustering.s3
        - clustering.s4
        - clustering.check
      gate_refs:
        - gate.core
  scene_aliases:
    clustering.recap: clustering.check
assessment_families:
  - id: clustering.base
    objective_ref: objective.clustering
    task: base
    response_type: single_choice
    points: 1
    hint: 'Trace k-means: trace the inputs, operation, and result before choosing.'
    remediation_scene: clustering.s2
    variants:
      - id: clustering.base.1
        prompt: Points [2, 4, 6] assigned to one k-means center yield what updated center?
        options:
          - id: a
            text: '4'
          - id: b
            text: '6'
          - id: c
            text: '12'
        answer: a
        feedback: The center becomes the arithmetic mean.
        retired: true
      - id: clustering.base.2
        prompt: What does hierarchical clustering provide?
        options:
          - id: b
            text: A guaranteed unique true taxonomy
          - id: c
            text: Only one fixed point estimate
          - id: a
            text: Nested groupings under a linkage rule
        answer: a
        feedback: The hierarchy depends on the chosen representation and merging or splitting criterion.
        retired: true
  - id: clustering.transfer
    objective_ref: objective.clustering
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate usefulness and stability: trace the inputs, operation, and result before choosing.'
    remediation_scene: clustering.s4
    variants:
      - id: clustering.transfer.1
        prompt: Changing feature units changes clusters. What does that reveal?
        options:
          - id: b
            text: The data must be fraudulent
          - id: c
            text: Clustering has no parameters
          - id: a
            text: The similarity geometry depends on representation
        answer: a
        feedback: Scaling is a substantive part of the clustering setup.
        retired: true
      - id: clustering.transfer.2
        prompt: A density method marks a rare event as noise. Can the event still matter?
        options:
          - id: c
            text: Only if the event is duplicated
          - id: a
            text: Yes; algorithmic density and task importance differ
          - id: b
            text: No; noise labels are moral judgments
        answer: a
        feedback: Sparse cases can be central to the intended application.
        retired: true
  - id: clustering.base.v2
    objective_ref: objective.clustering
    task: base
    response_type: single_choice
    points: 1
    hint: K-means only ever does two things, assign each point to its nearest center and move each center to its group's mean, and both moves can only lower the squared-distance total.
    remediation_scene: clustering.lloyd
    variants:
      - id: clustering.base.v2.1
        prompt: Partway through k-means, the centers are at 3 and 10, and every point has just been assigned to its nearest center. What happens next?
        options:
          - id: b
            text: Each point moves a little toward the center it was assigned to
          - id: a
            text: Each center moves to the mean of the points assigned to it
          - id: c
            text: A new center is added for any point that was nearly a tie
        answer: a
        feedback: After the assignment step comes the update step, which moves the centers, not the points. The data never move, and k stays fixed for the whole run; near-ties are simply settled by the distance rule.
      - id: clustering.base.v2.2
        prompt: During a k-means run, an assignment step leaves every point in the same group as before. What can you conclude?
        options:
          - id: b
            text: The run has converged, since the centers will not move again
          - id: c
            text: This grouping has the lowest total that any grouping could reach
          - id: a
            text: The value of k is too small, since the points have stopped moving
        answer: b
        feedback: If no point switches, the means don't change, so the loop has converged. That is a local minimum; a different start might find a grouping with a lower total, which is why libraries try several starts.
      - id: clustering.base.v2.3
        prompt: Ana runs k-means twice on the same data with different starting centers. The runs give different groups, with squared-distance totals of 41 and 36. Which run should she keep?
        options:
          - id: a
            text: The 41 run, since a larger total means broader, more general groups
          - id: b
            text: Neither; average the two sets of centers into a single answer
          - id: c
            text: The 36 run, since k-means is trying to make that total small
        answer: c
        feedback: K-means minimizes the squared-distance total, so with k fixed the lower total is the better grouping. Averaging centers from two different groupings can produce centers that fit neither.
      - id: clustering.base.v2.4
        prompt: Why does the k-means update step move each center to the mean of its points, rather than to the median or to the middle of their range?
        options:
          - id: b
            text: The mean is one of the data points, so the center stays a real example
          - id: c
            text: The mean ignores extreme points, which keeps each center steady
          - id: a
            text: The mean gives the smallest possible sum of squared distances
        answer: a
        feedback: For squared distance, the mean is exactly the point that minimizes the total, so the update step can only lower the objective. The mean usually isn't a data point (7/3 wasn't), and it is pulled by extreme points rather than ignoring them.
      - id: clustering.base.v2.5
        prompt: 'The best k-means totals on a dataset are 120 for k = 1, 30 for k = 2, 24 for k = 3, and 20 for k = 4. Which k does the elbow suggest?'
        options:
          - id: c
            text: k = 4, because it has the lowest total of the four
          - id: a
            text: k = 1, because one group is the simplest description
          - id: b
            text: k = 2, because extra groups after that save very little
        answer: b
        feedback: The drop from 120 to 30 is huge; after k = 2 each extra group saves only 6 or 4. The total always falls as k grows, so the lowest total isn't a reason on its own.
  - id: clustering.transfer.v2
    objective_ref: objective.clustering
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask which of the three choices, the representation, the distance, or the objective, is causing the odd groups, and whether the groups would help with the actual job.
    remediation_scene: clustering.s4
    variants:
      - id: clustering.transfer.v2.1
        prompt: A shop clusters customers by age in years and yearly income in dollars. The groups split almost entirely by income, and age seems to make no difference. What is the most likely fix?
        options:
          - id: b
            text: Standardize both features before running the clustering
          - id: c
            text: Raise k so that age has room to form groups of its own
          - id: a
            text: Rerun k-means from several new random starting centers
        answer: b
        feedback: Income in dollars varies by tens of thousands while age varies by tens, so income dominates every distance. Standardizing puts them on a common scale. More groups or new starts still use the same lopsided distance.
      - id: clustering.transfer.v2.2
        prompt: GPS pings from two couriers trace two long, curved streets that bend around each other. K-means with k = 2 cuts straight across both streets. Which approach suits this data better?
        options:
          - id: a
            text: Rerun k-means from many different starting centers
          - id: b
            text: Rescale both coordinates to the same range, then use k-means
          - id: c
            text: A density method such as DBSCAN that links crowded points
        answer: c
        feedback: The streets are long curved shapes, not round blobs, so any k-means solution slices them. DBSCAN follows chains of crowded neighbors along each street. New starts or rescaling don't change k-means' round-blob assumption.
      - id: clustering.transfer.v2.3
        prompt: A chain clusters its 200 stores with DBSCAN, and the flagship city store is labeled noise. A manager proposes dropping it from the regional plan. What is the best response?
        options:
          - id: c
            text: Drop it, since the method judged it too unusual to matter
          - id: a
            text: Plan for it separately, since noise only means few similar stores
          - id: b
            text: Keep it, but merge it into whichever cluster is largest
        answer: a
        feedback: DBSCAN's noise label means the store sits in a sparse region, not that it's unimportant. A unique flagship may need its own plan. Forcing it into the largest cluster ignores how different it is.
      - id: clustering.transfer.v2.4
        prompt: A music team clusters songs into five groups by audio features and plans to build a playlist from each. How should they check whether the groups are worth using?
        options:
          - id: b
            text: Test whether listeners enjoy the playlists more than a simple baseline
          - id: c
            text: Confirm that five groups give a lower total than four groups do
          - id: a
            text: Confirm that a 2-D plot of the songs shows five clear blobs
        answer: b
        feedback: The groups are for playlists, so test them on that job against a baseline. A lower total with more groups always happens, and a tidy plot shows geometry, not whether listeners like the result.
      - id: clustering.transfer.v2.5
        prompt: A clinic clusters patient records into four groups. Each time it reruns with new starting centers, the groups come out very different. What should it do before using them?
        options:
          - id: b
            text: Keep the first run, since the starting centers were random anyway
          - id: c
            text: Revisit the features and scaling, since the groups are unstable
          - id: a
            text: Use all the runs by assigning each patient to their most frequent group
        answer: c
        feedback: Groups that change with every start aren't a reliable basis for decisions; the features, units, or k may not suit the data. Picking one run or voting across runs hides that instability rather than fixing it.
  - id: clustering.calc.v2
    objective_ref: objective.clustering
    task: base
    response_type: numeric
    points: 1
    hint: First assign every point to its nearest center (ties go to A). Then average only the points in the group you're asked about.
    remediation_scene: clustering.s2
    variants:
      - id: clustering.calc.v2.1
        prompt: 'Points on a line: 2, 3, 7, 10, 11. Centers start at A = 3 and B = 9. After one assignment step and one update step, where is center B? Give two decimal places.'
        answer: 9.33
        feedback: 2 and 3 are nearest A. 7 is 4 from A and 2 from B, so it joins B with 10 and 11. B moves to (7 + 10 + 11) / 3 = 9.33.
      - id: clustering.calc.v2.2
        prompt: 'Points on a line: 1, 4, 5, 12, 14. Centers start at A = 2 and B = 10. After one assignment step and one update step, where is center A? Give two decimal places.'
        answer: 3.33
        feedback: 1, 4, and 5 are all nearer 2 than 10 (5 is 3 from A and 5 from B). A moves to (1 + 4 + 5) / 3 = 3.33.
      - id: clustering.calc.v2.3
        prompt: 'Points on a line: 0, 2, 6, 9, 11. Centers start at A = 1 and B = 5. After one assignment step and one update step, where is center B? Give two decimal places.'
        answer: 8.67
        feedback: 0 and 2 join A. 6, 9, and 11 are nearer 5 than 1, so they join B, which moves to (6 + 9 + 11) / 3 = 8.67.
      - id: clustering.calc.v2.4
        prompt: 'Two groups: {1, 3} with center 2, and {8, 9, 10} with center 9. What is the k-means total, the sum of squared distances from each point to its center?'
        answer: 4
        feedback: 'Group one: 1² + 1² = 2. Group two: 1² + 0² + 1² = 2. Total: 4.'
      - id: clustering.calc.v2.5
        prompt: A group holds the points 2, 3, and 7, and its center is currently at 6. After the update step moves the center to the group's mean, what is the group's sum of squared distances?
        answer: 14
        feedback: The mean is (2 + 3 + 7) / 3 = 4. The squared distances are 4, 1, and 9, which add to 14 (down from 16 + 9 + 1 = 26 with the center at 6).
    absolute_tolerance: 0.01
