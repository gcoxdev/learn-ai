lesson:
  id: clustering
  version: 0.3.0-draft
  title: Find groups that help with your task
  state: draft
  summary: Group six shops by delivery count, then test whether those groups help with the job you actually
    want to do.
  slot: M08.1
  category: learning
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
  - title: scikit-learn — k-means clustering
    url: https://scikit-learn.org/stable/modules/clustering.html#k-means
objectives:
- id: objective.clustering
  version: 1-draft
  statement: Clustering groups examples under a similarity criterion; k-means, hierarchical, and density methods
    make different assumptions about shape, scale, and outliers.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - clustering.base
  - clustering.transfer
  prerequisites:
  - anyOf:
    - objective.nearest-neighbors
  - anyOf:
    - objective.random-variables
scenes:
- id: clustering.s1
  title: Grouping requires a definition of similarity
  type: explanation
  depth: intuition
  objective_refs:
  - objective.clustering
  markdown: 'Imagine six shops with 1, 2, 4, 8, 9, and 10 deliveries per day. You want two groups so you can
    plan different delivery rounds. No example comes with a correct group label: this is clustering, rather
    than supervised classification.


    A clustering algorithm needs a representation, a distance or similarity, and a grouping objective. Here
    each shop is represented by one number, and distance means the difference in daily deliveries. If you instead
    grouped shops by geographic location, nearby shops could end up together even when their delivery counts
    differ.


    Before choosing an algorithm, say what a useful group would let you do. Calling the resulting groups “small”
    and “large” describes this measurement; it does not establish permanent natural kinds of shops.'
  text_mode: 'Imagine six shops with 1, 2, 4, 8, 9, and 10 deliveries per day. You want two groups so you can
    plan different delivery rounds. No example comes with a correct group label: this is clustering, rather
