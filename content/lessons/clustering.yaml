    differ.


    Before choosing an algorithm, say what a useful group would let you do. Calling the resulting groups “small”
    and “large” describes this measurement; it does not establish permanent natural kinds of shops.'
  bridges: []
- id: clustering.s2
  title: Trace k-means
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.clustering
  markdown: 'K-means alternates two operations: assign every point to its nearest center, then replace each
    center with the mean of its assigned points. The number k is the number of centers; this example uses two.


    Start centers at 2 and 6. The point at 4 is equally far from both, so a stated tie rule is needed. Our
    lab sends ties to A. First predict its assignment, then reveal all assignments. Keep those assignments
    fixed while moving each center to its group’s mean. The displayed squared-distance total measures how compact
    those groups are around their centers.


    Repeat assignment and update in a full run. The process can stop at different local solutions from different
    starting centers. Try moving both starting centers toward the same side; if a group is empty, this lab
    keeps its old center because an empty group has no mean.


    The **mean** is the sum divided by the number of values. With the initial centers above, group A receives
    1, 2, and 4, so its updated center is 7/3, about 2.33. Group B receives 8, 9, and 10, so its center becomes
    27/3 = 9. Assignment chooses members; updating moves the centers.'
  text_mode: 'K-means alternates two operations: assign every point to its nearest center, then replace each
    center with the mean of its assigned points. The number k is the number of centers; this example uses two.


    Start centers at 2 and 6. The point at 4 is equally far from both, so a stated tie rule is needed. Our
    lab sends ties to A. First predict its assignment, then reveal all assignments. Keep those assignments
    fixed while moving each center to its group’s mean. The displayed squared-distance total measures how compact
    those groups are around their centers.


    Repeat assignment and update in a full run. The process can stop at different local solutions from different
    starting centers. Try moving both starting centers toward the same side; if a group is empty, this lab
    keeps its old center because an empty group has no mean.


    The **mean** is the sum divided by the number of values. With the initial centers above, group A receives
    1, 2, and 4, so its updated center is 7/3, about 2.33. Group B receives 8, 9, and 10, so its center becomes
    27/3 = 9. Assignment chooses members; updating moves the centers.'
  bridges:
  - geometry-and-symmetry
  figure:
    kind: clustering
    caption: Predict a point’s assignment, then move two centers to the means of their assigned points.
    description: Six fixed one-dimensional points are assigned to their nearest starting center, with ties
      going to A. One center update displays group means and the change in squared-distance total.
- id: clustering.s3
  title: Other methods favor other structures
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.clustering
  markdown: 'K-means favors groups that are compact around a mean under the chosen squared-distance measure.
    Imagine two crescent-shaped bands of points: a single center for each band may poorly represent their curved
    shape.


    Hierarchical clustering builds nested groupings by repeatedly merging or splitting under a linkage rule.
    You can inspect broad groups or finer subgroups by choosing a level of that hierarchy. Changing the rule
    for measuring distance between groups can change which groups merge first.


    Density methods connect sufficiently dense neighborhoods and may mark sparse points as noise. That can
    suit curved bands, but neighborhood size and density settings matter. None of these methods supplies the
    unique correct grouping for every dataset.


    A **linkage rule** says how to measure distance between groups, for example by the closest pair of members.
    A **neighborhood** is the region treated as near a point. A density rule might ask whether at least a specified
    number of other points lie within a chosen distance. These are settings to justify for your task, not hidden
    meanings supplied by a plot.'
