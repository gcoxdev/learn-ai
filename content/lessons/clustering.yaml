- id: clustering.s4
  title: Evaluate usefulness and stability
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.clustering
  markdown: 'Suppose each shop now has two features: deliveries per day and annual revenue. Raw revenue values
    may be thousands of times larger than delivery counts. Squared distance can then be dominated by revenue.
    Expressing revenue in thousands changes that geometry unless the preprocessing accounts for the units.


    Predict what a good evaluation should inspect before trusting the groups: stability when units or initial
    centers change, and usefulness for the actual delivery-planning task. Compare with independent task outcomes
    where available; a visually separated plot is insufficient by itself.


    A rare shop may have unusual delivery needs and be marked as noise by a density method. It can still be
    the shop that needs the most planning attention. Algorithmic rarity and practical importance answer different
    questions.'
