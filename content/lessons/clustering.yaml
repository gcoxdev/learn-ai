assessment_families:
- id: clustering.base
  objective_ref: objective.clustering
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace k-means: trace the inputs, operation, and result before choosing.'
  remediation_scene: clustering.s2
  variants:
  - id: clustering.base.1
    prompt: Points [2, 4, 6] assigned to one k-means center yield what updated center?
    options:
    - id: a
      text: '4'
    - id: b
      text: '6'
    - id: c
      text: '12'
    answer: a
    feedback: The center becomes the arithmetic mean.
  - id: clustering.base.2
    prompt: What does hierarchical clustering provide?
    options:
    - id: b
      text: A guaranteed unique true taxonomy
    - id: c
      text: Only one fixed point estimate
    - id: a
      text: Nested groupings under a linkage rule
    answer: a
    feedback: The hierarchy depends on the chosen representation and merging or splitting criterion.
- id: clustering.transfer
  objective_ref: objective.clustering
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate usefulness and stability: trace the inputs, operation, and result before choosing.'
  remediation_scene: clustering.s4
  variants:
  - id: clustering.transfer.1
    prompt: Changing feature units changes clusters. What does that reveal?
    options:
    - id: b
      text: The data must be fraudulent
    - id: c
      text: Clustering has no parameters
    - id: a
      text: The similarity geometry depends on representation
    answer: a
    feedback: Scaling is a substantive part of the clustering setup.
  - id: clustering.transfer.2
    prompt: A density method marks a rare event as noise. Can the event still matter?
    options:
    - id: c
      text: Only if the event is duplicated
    - id: a
      text: Yes; algorithmic density and task importance differ
    - id: b
      text: No; noise labels are moral judgments
    answer: a
    feedback: Sparse cases can be central to the intended application.
