schema_version: 0.2-draft
lesson:
  id: clustering
  version: 0.1.0-draft
  title: Find groups without assuming the groups are natural kinds
  state: draft
  summary: Clustering groups examples under a similarity criterion; k-means, hierarchical, and density methods make
    different assumptions about shape, scale, and outliers.
  slot: M08.1
  category: learning
  minutes: 12
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.clustering
  version: 1-draft
  statement: Clustering groups examples under a similarity criterion; k-means, hierarchical, and density methods
    make different assumptions about shape, scale, and outliers.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - clustering.base
  - clustering.transfer
  prerequisites:
  - anyOf:
    - objective.nearest-neighbors
  - anyOf:
    - objective.random-variables
scenes:
- id: clustering.s1
  title: Grouping requires a definition of similarity
  type: explanation
  depth: intuition
  objective_refs:
  - objective.clustering
  markdown: A clustering algorithm does not discover an interpretation-free truth. It uses a representation, a distance
    or similarity, and a grouping objective. Customer groups based on purchase frequency can differ from groups
    based on geography. Labels assigned after clustering are interpretations that need separate support.
  text_mode: A clustering algorithm does not discover an interpretation-free truth. It uses a representation, a
    distance or similarity, and a grouping objective. Customer groups based on purchase frequency can differ from
    groups based on geography. Labels assigned after clustering are interpretations that need separate support.
  bridges: []
- id: clustering.s2
  title: Trace k-means
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.clustering
  markdown: K-means alternates assigning points to the nearest center and replacing each center with the mean of
    its assigned points. For one-dimensional groups [1, 2] and [8, 10], updated centers are 1.5 and 9. The method
    targets squared-distance compactness and can converge to different local solutions from different starts.
  text_mode: K-means alternates assigning points to the nearest center and replacing each center with the mean of
    its assigned points. For one-dimensional groups [1, 2] and [8, 10], updated centers are 1.5 and 9. The method
    targets squared-distance compactness and can converge to different local solutions from different starts.
  bridges:
  - geometry-and-symmetry
- id: clustering.s3
  title: Other methods favor other structures
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.clustering
  markdown: Hierarchical clustering builds nested groupings by repeatedly merging or splitting according to a linkage
    rule. Density methods connect sufficiently dense neighborhoods and may label sparse points as noise. Different
    linkage, scale, or density settings can produce different cluster boundaries and numbers.
  text_mode: Hierarchical clustering builds nested groupings by repeatedly merging or splitting according to a linkage
    rule. Density methods connect sufficiently dense neighborhoods and may label sparse points as noise. Different
    linkage, scale, or density settings can produce different cluster boundaries and numbers.
  bridges: []
- id: clustering.s4
  title: Evaluate usefulness and stability
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.clustering
  markdown: Inspect sensitivity to scaling, initialization, and hyperparameters. Compare clusters with independent
    task needs or held-out behavior where appropriate. A visually separated scatterplot does not establish meaningful
    categories. A rare but important case can be labeled noise, so do not equate an algorithmic outlier flag with
    useless data.
  text_mode: Inspect sensitivity to scaling, initialization, and hyperparameters. Compare clusters with independent
    task needs or held-out behavior where appropriate. A visually separated scatterplot does not establish meaningful
    categories. A rare but important case can be labeled noise, so do not equate an algorithmic outlier flag with
    useless data.
  bridges: []
- id: clustering.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.clustering
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Clustering groups examples under a similarity criterion; k-means, hierarchical, and density methods
    make different assumptions about shape, scale, and outliers.
- id: clustering.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.clustering
  markdown: Clustering groups examples under a similarity criterion; k-means, hierarchical, and density methods
    make different assumptions about shape, scale, and outliers.
  text_mode: Clustering groups examples under a similarity criterion; k-means, hierarchical, and density methods
