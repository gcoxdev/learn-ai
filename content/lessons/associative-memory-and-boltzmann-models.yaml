objectives:
  - id: objective.associative-memory-and-boltzmann-models
    version: 2-draft
    statement: Hopfield-style associative memories update states toward stored attractors, while Boltzmann models use stochastic energy-based distributions; state inference, sampling, and parameter learning are distinct operations.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - associative-memory-and-boltzmann-models.base.v2
      - associative-memory-and-boltzmann-models.transfer.v2
      - associative-memory-and-boltzmann-models.calculate
    prerequisites:
      - anyOf:
          - objective.hebbian-and-local-learning
      - anyOf:
          - objective.flows-and-energy-models
scenes:
  - id: associative-memory-and-boltzmann-models.s1
    title: Remember by content, not by address
    type: explanation
    depth: intuition
    objective_refs:
      - objective.associative-memory-and-boltzmann-models
    markdown: |-
      Hear the first three notes of a favorite song and the rest arrives on its own. No address was looked up, the way a computer fetches memory slot 4,096; a *piece* of the memory brought back the whole. That's an **associative memory**.

      In 1982 the physicist John Hopfield described a network that behaves this way. Each unit $i$ has a state $s_i = +1$ or $-1$ (a pixel that is ink or blank), and every pair of units shares a symmetric weight $w_{ij} = w_{ji}$.

      To store a pattern $p$, use the previous lesson's Hebbian rule: $w_{ij} = p_i\,p_j$. Pixels that agree get a $+1$ connection; pixels that disagree get $-1$; no unit connects to itself. For several patterns, add them up: $w_{ij} = \sum_\mu p^\mu_i p^\mu_j$ (often divided by the number of units $N$).

      Store a 2 × 2 diagonal stroke: pixels (top-left, top-right, bottom-left, bottom-right) = $(+1, -1, -1, +1)$. The six weights are $w_{12} = -1$, $w_{13} = -1$, $w_{14} = +1$, $w_{23} = +1$, $w_{24} = -1$, and $w_{34} = -1$.
    diagram:
      caption: A four-unit Hopfield network storing a diagonal stroke. Each connection is symmetric; its weight is +1 if the two pixels agree in the stored pattern and −1 if they differ.
      description: Four units sit in a square, one per pixel. Unit 1 (top-left, ink) connects to unit 2 (top-right, blank) with weight −1, to unit 3 (bottom-left, blank) with weight −1, and to unit 4 (bottom-right, ink) with weight +1. Unit 2 connects to unit 3 with weight +1 and to unit 4 with weight −1. Unit 3 connects to unit 4 with weight −1. Every connection works in both directions.
      nodes:
        - id: u1
          label: Unit 1, top-left
          note: stored +1 (ink)
          col: 1
          row: 0
          tone: accent
        - id: u2
          label: Unit 2, top-right
          note: stored −1 (blank)
          col: 3
          row: 0
        - id: u3
          label: Unit 3, bottom-left
          note: stored −1 (blank)
          col: 1
          row: 2
        - id: u4
          label: Unit 4, bottom-right
          note: stored +1 (ink)
          col: 3
          row: 2
          tone: accent
      edges:
        - from: u1
          to: u2
          label: −1, both ways
        - from: u1
          to: u3
          label: −1, both ways
        - from: u1
          to: u4
          label: +1, both ways
          bend: 1
        - from: u2
          to: u3
          label: +1, both ways
          bend: -1
        - from: u2
          to: u4
          label: −1, both ways
        - from: u3
          to: u4
          label: −1, both ways
    bridges:
      - hebbian-and-local-learning
  - id: associative-memory-and-boltzmann-models.s2
    title: Every update rolls downhill
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.associative-memory-and-boltzmann-models
    markdown: |-
      Smudge the stroke: flip the top-right pixel to ink, giving the cue $(+1, +1, -1, +1)$. Recall updates one unit at a time (an **asynchronous update**). Each unit adds up its weighted inputs, its **local field** $h_i = \sum_j w_{ij} s_j$, and takes the sign.

      For unit 2: $h_2 = (-1)(+1) + (+1)(-1) + (-1)(+1) = -3$, so it flips back to $-1$. The other units already agree with their fields, so the stroke is restored. Only the *states* changed; the weights stayed fixed.

      Hopfield's key insight was an **energy**, one number per state that recall can only lower:

      $$E = -\sum_{i<j} w_{ij}\,s_i\,s_j$$

      In the stored stroke, all six pairs give $w_{ij} s_i s_j = +1$, so $E = -6$. In the cue, the three pairs involving unit 2 give $-1$ and the rest $+1$, so $E = 0$. One flip dropped the energy by 6.

      :::papers Why energy can never rise
      Flip unit $k$ from $s_k$ to $s_k'$. Only terms containing $k$ change, so $\Delta E = -(s_k' - s_k)\,h_k$. The update sets $s_k' = \operatorname{sign}(h_k)$, so the state change and the field share a sign and $\Delta E \le 0$. Here $\Delta E = -(-1 - 1)(-3) = -6$. This needs symmetric weights, no self-connections, and one unit at a time. With finitely many states, recall must stop at a local minimum, called an **attractor**.
      :::
  - id: associative-memory-and-boltzmann-models.extension-two-unit-recall
    title: Three letters and a smudge
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.associative-memory-and-boltzmann-models
    markdown: |-
      Scale up to a 5 × 5 grid of 25 units, store three letters, smudge 6 of the T's pixels, and recall:

      ```python run
      import numpy as np

      letters = {
          "T": ["#####", "..#..", "..#..", "..#..", "..#.."],
          "L": ["#....", "#....", "#....", "#....", "#####"],
          "X": ["#...#", ".#.#.", "..#..", ".#.#.", "#...#"],
      }
      P = np.array([[1 if c == "#" else -1 for c in "".join(rows)] for rows in letters.values()])
      N = P.shape[1]
      W = P.T @ P / N              # outer-product (Hebbian) rule, summed over letters
      np.fill_diagonal(W, 0)       # no self-connections

      def energy(s):
          return -0.5 * s @ W @ s  # the same as summing over pairs i < j

      def show(s):
          for r in range(5):
              print("   " + "".join("#" if v > 0 else "." for v in s[5 * r:5 * r + 5]))

      s = P[0].copy()                          # start from the stored "T"
      rng = np.random.default_rng(1)
      s[rng.choice(N, size=6, replace=False)] *= -1   # smudge 6 pixels
      print(f"cue, energy {energy(s):.2f}"); show(s)
      for sweep in range(1, 4):
          for i in range(N):                   # asynchronous: one unit at a time
              s[i] = 1 if W[i] @ s >= 0 else -1
          print(f"after sweep {sweep}, energy {energy(s):.2f}")
      show(s)
      print("matches the stored letter:", bool((s == P[0]).all()))
      ```

      The cue starts at energy −2.24; one sweep brings it to −11.20, the energy of the stored T, and later sweeps change nothing. Now try `size=10`: with 10 pixels flipped, recall rolls into the X's valley instead.

      :::mixup "The network looks the answer up by comparing the cue with each stored letter."
      Nothing compares whole letters. Each unit only checks the weighted vote of the other 24 units. The letters exist only as valleys in the energy the weights define, which is why unwanted valleys exist too: an inverted T (every pixel flipped) is also stable, and so are some blends of letters, called **spurious states**.
      :::
  - id: associative-memory-and-boltzmann-models.capacity
    title: How many memories fit?
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.associative-memory-and-boltzmann-models
    markdown: |-
      Every stored pattern adds to every weight, so memories interfere. This program stores more and more random patterns in 200 units, starts recall *at* each one, and counts pixels that drift.

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      N = 200                                    # units
      for M in (10, 20, 28, 40, 60):             # number of stored random patterns
          P = rng.choice([-1, 1], size=(M, N))
          W = P.T @ P / N
          np.fill_diagonal(W, 0)
          wrong = 0
          for p in P:                            # start recall AT each stored pattern
              s = p.copy()
              for sweep in range(5):
                  for i in range(N):
                      s[i] = 1 if W[i] @ s >= 0 else -1
              wrong += (s != p).sum()
          print(f"{M:3d} patterns ({M / N:.2f} N): {100 * wrong / (M * N):5.2f}% of pixels wrong")
      ```

      Up to 28 patterns, under 1% of pixels drift. At 40 it's 6.45%, and at 60, 20.61%: recall is falling apart.

      :::predict About how many random patterns can a 1,000-unit Hopfield network store?
      About 140. For large networks, Amit, Gutfreund, and Sompolinsky (1985) showed that recall collapses once the number of patterns passes about **0.14 N** (0.138 N). In 200 units the collapse is gradual, but it starts near 28 = 0.14 N. Correlated patterns, like letters or faces, fit fewer.
      :::
  - id: associative-memory-and-boltzmann-models.s3
    title: Modern Hopfield networks and attention
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.associative-memory-and-boltzmann-models
    markdown: |-
      A classic network holds only about 140 patterns in 1,000 units. Dmitry Krotov and Hopfield (2016) showed that a sharper energy stores far more, and Hubert Ramsauer and colleagues (2020) extended the idea to continuous states with this update:

      $$\xi^{\text{new}} = X\,\operatorname{softmax}\!\big(\beta\, X^\top \xi\big)$$

      The columns of $X$ are the stored patterns, $\xi$ is the cue, and $\beta$ sets the sharpness. Score each pattern against the cue, softmax the scores, and return the weighted average of the patterns.

      Store $x_1 = (1, 0)$ and $x_2 = (0, 1)$, and cue with $\xi = (0.8, 0.3)$. With $\beta = 1$ the softmax weights are (0.622, 0.378), a blurry blend. With $\beta = 4$ they're (0.881, 0.119), close to $x_1$. Larger $\beta$ means crisper recall.

      That's the form of transformer attention: the cue plays the query, the stored patterns play the keys and values (a transformer gives each its own learned projection), and $\beta$ plays $1/\sqrt{d_k}$. So one attention step can be read as one retrieval from this kind of memory, a link spotted years after transformers (2017) were designed.
    bridges:
      - attention
  - id: associative-memory-and-boltzmann-models.extension-stochastic-distinction
    title: "Add temperature: Boltzmann machines"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.associative-memory-and-boltzmann-models
    markdown: |-
      A Hopfield network always rolls downhill, so it can get stuck in a spurious valley. Geoffrey Hinton and Terrence Sejnowski's **Boltzmann machine** makes each unit random, turning on with probability

      $$P(\text{on}) = \frac{1}{1 + e^{-\Delta E / T}}$$

      where $\Delta E$ is how much lower the energy is with the unit on, and $T$ is a **temperature**. With $\Delta E = 1$, the unit is on 73.1% of the time at $T = 1$, 88.1% at $T = 0.5$, and 56.2% at $T = 4$. As $T$ approaches 0 this becomes the Hopfield update. Run long enough, it visits each state with probability proportional to $e^{-E/T}$, the energy-model rule from module 22.

      The job changes from recall to **generating** new patterns like the data. With extra **hidden units** that aren't pixels, David Ackley, Hinton, and Sejnowski (1985) learned the weights with

      $$\Delta w_{ij} = \eta\,\big(\langle s_i s_j\rangle_{\text{data}} - \langle s_i s_j\rangle_{\text{model}}\big)$$

      The first, Hebbian term is measured with the visible units clamped to real data; the second, anti-Hebbian term, while the network runs freely. Learning stops when they match. The catch: free running is slow to settle.

      A **restricted Boltzmann machine (RBM)** has no connections within a layer, so a whole layer can be sampled at once. Hinton's **contrastive divergence** (2002) cut the free-running phase to a few back-and-forth steps starting *from the data*, just enough to see which way the model drifts. Stacked RBMs helped restart deep learning in 2006, though VAEs, GANs, and diffusion models have since largely replaced them.

      :::story A Nobel Prize for physics-inspired networks
      The 2024 Nobel Prize in Physics went to Hopfield and Hinton "for foundational discoveries and inventions that enable machine learning with artificial neural networks," singling out the Hopfield network and the Boltzmann machine.
      :::
    bridges:
      - flows-and-energy-models
  - id: associative-memory-and-boltzmann-models.s4
    title: Recall, sampling, and learning are different jobs
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.associative-memory-and-boltzmann-models
    markdown: |-
      Everything in this lesson does one of three jobs, each with its own test.

      | Job | What changes | Success looks like |
      | --- | --- | --- |
      | **Recall** (Hopfield) | Unit states, downhill in energy | The smudged T comes back as the stored T |
      | **Sampling** (Boltzmann) | Unit states, randomly, at temperature $T$ | Samples appear as often as the data suggest |
      | **Learning** (both) | Weights | Stored patterns become valleys, or samples match the data |

      A Hopfield network that recalls three letters perfectly can't invent a fourth; a Boltzmann machine that samples well may not return the letter you smudged. When someone says "the energy went down," ask which job it was doing.
  - id: associative-memory-and-boltzmann-models.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.associative-memory-and-boltzmann-models
    markdown: Hand calculations of weights, local fields, energies, and capacity, plus a photo archive, a recommender, and a retrieval layer, test whether you can predict what an energy-based memory will do.
    takeaway: |-
      A Hopfield network stores patterns as energy valleys using a Hebbian rule, and recall flips states downhill until it reaches one. Boltzmann machines add temperature so they sample instead of settle, and learn weights by matching the data's correlations.
  - id: associative-memory-and-boltzmann-models.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.associative-memory-and-boltzmann-models
    markdown: |-
      Recall changes a memory network’s states while weights can stay fixed. Boltzmann sampling explores probable states; learning changes the weights themselves.
