schema_version: 0.2-draft
lesson:
  id: associative-memory-and-boltzmann-models
  version: 0.1.0-draft
  title: Recover patterns through energy-based state dynamics
  state: draft
  summary: Hopfield-style associative memories update states toward stored attractors, while Boltzmann models use
    stochastic energy-based distributions; state inference, sampling, and parameter learning are distinct operations.
  slot: M37.2
  category: learning
  minutes: 12
  sources:
  - title: Hopfield 1982
    url: https://doi.org/10.1073/pnas.79.8.2554
  - title: A Learning Algorithm for Boltzmann Machines
    url: https://www.cs.toronto.edu/~hinton/absps/cogscibm.pdf
  - title: Neuronal Dynamics
    url: https://neuronaldynamics.epfl.ch/online/
objectives:
- id: objective.associative-memory-and-boltzmann-models
  version: 1-draft
  statement: Hopfield-style associative memories update states toward stored attractors, while Boltzmann models
    use stochastic energy-based distributions; state inference, sampling, and parameter learning are distinct operations.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - associative-memory-and-boltzmann-models.base
  - associative-memory-and-boltzmann-models.transfer
  prerequisites:
