  version: 0.4.0-draft
  title: Recover patterns through energy-based state dynamics
  state: draft
  summary: Smudge a stored letter and a network of simple units rebuilds it by rolling downhill in energy. The same idea, plus randomness, won a Nobel Prize and echoes inside transformer attention.
