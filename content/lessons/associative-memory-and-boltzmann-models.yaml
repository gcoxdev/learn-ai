scenes:
- id: associative-memory-and-boltzmann-models.s1
  title: Store patterns as attractors
  type: explanation
  depth: intuition
  objective_refs:
  - objective.associative-memory-and-boltzmann-models
  markdown: A classical Hopfield network has recurrently connected binary units and a defined energy function. Under
    symmetric weights and appropriate asynchronous updates, energy does not increase as units update. A noisy cue
    can move toward a stable pattern, but spurious attractors and finite capacity limit recovery.
  text_mode: A classical Hopfield network has recurrently connected binary units and a defined energy function.
    Under symmetric weights and appropriate asynchronous updates, energy does not increase as units update. A noisy
    cue can move toward a stable pattern, but spurious attractors and finite capacity limit recovery.
  bridges: []
- id: associative-memory-and-boltzmann-models.s2
  title: Separate state updates from learning
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.associative-memory-and-boltzmann-models
  markdown: During recall, the network changes unit states while its learned weights can stay fixed. During learning,
    the weights are set or adapted from examples. Calling both processes optimization without distinction hides
    whether the system is inferring a memory or changing what it stores.
  text_mode: During recall, the network changes unit states while its learned weights can stay fixed. During learning,
    the weights are set or adapted from examples. Calling both processes optimization without distinction hides
    whether the system is inferring a memory or changing what it stores.
  bridges: []
- id: associative-memory-and-boltzmann-models.s3
  title: Introduce stochastic energy models
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.associative-memory-and-boltzmann-models
  markdown: Boltzmann machines assign probabilities to configurations through energy and temperature. Stochastic
    updates can explore multiple states rather than deterministically descending to one attractor. Learning must
    account for how the model distribution differs from data, often requiring difficult sampling or approximations.
  text_mode: Boltzmann machines assign probabilities to configurations through energy and temperature. Stochastic
    updates can explore multiple states rather than deterministically descending to one attractor. Learning must
    account for how the model distribution differs from data, often requiring difficult sampling or approximations.
  bridges: []
- id: associative-memory-and-boltzmann-models.s4
  title: Compare recovery and generation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.associative-memory-and-boltzmann-models
  markdown: A memory task asks whether a corrupted pattern recovers the intended target. A generative task asks
    whether samples represent the data distribution. Low energy, successful recall, and normalized likelihood are
    different measurements. A model can do well on one without satisfying the others.
  text_mode: A memory task asks whether a corrupted pattern recovers the intended target. A generative task asks
    whether samples represent the data distribution. Low energy, successful recall, and normalized likelihood are
    different measurements. A model can do well on one without satisfying the others.
  bridges: []
- id: associative-memory-and-boltzmann-models.extension-two-unit-recall
  title: Trace a tiny fixed-weight memory
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.associative-memory-and-boltzmann-models
  markdown: 'Use two units whose states are +1 or −1. Give their connection weight +1 and use no external offset.
    For a classical threshold update, a positive input selects +1 and a negative input selects −1. Starting at (+1,−1),
    update the second unit using the first: its input is +1, so it becomes +1. The state is now (+1,+1). No connection
    weight changed during this recall step. Under the two-unit energy E=−s1×s2, energy changes from +1 to −1. This
    deliberately tiny example illustrates state settling; it does not demonstrate large memory capacity.'
  text_mode: 'Use two units whose states are +1 or −1. Give their connection weight +1 and use no external offset.
    For a classical threshold update, a positive input selects +1 and a negative input selects −1. Starting at (+1,−1),
    update the second unit using the first: its input is +1, so it becomes +1. The state is now (+1,+1). No connection
    weight changed during this recall step. Under the two-unit energy E=−s1×s2, energy changes from +1 to −1. This
    deliberately tiny example illustrates state settling; it does not demonstrate large memory capacity.'
  bridges:
  - arithmetic
- id: associative-memory-and-boltzmann-models.extension-stochastic-distinction
  title: Distinguish settling from stochastic sampling
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.associative-memory-and-boltzmann-models
  markdown: A classical Hopfield recall rule follows updates toward a stable pattern under specified conditions,
    such as symmetric weights and asynchronous updates. “Asynchronous” means updating one unit at a time. A Boltzmann
    machine instead uses probabilistic state updates so repeated runs can explore a distribution of states. Training
    changes weights to favor patterns in data, while inference or sampling works with a fixed set of weights. Low-energy
    states are favored, but sampling is not equivalent to returning the single lowest-energy state. A temperature
    parameter controls how strongly energy differences affect preference.
  text_mode: A classical Hopfield recall rule follows updates toward a stable pattern under specified conditions,
    such as symmetric weights and asynchronous updates. “Asynchronous” means updating one unit at a time. A Boltzmann
    machine instead uses probabilistic state updates so repeated runs can explore a distribution of states. Training
    changes weights to favor patterns in data, while inference or sampling works with a fixed set of weights. Low-energy
    states are favored, but sampling is not equivalent to returning the single lowest-energy state. A temperature
    parameter controls how strongly energy differences affect preference.
  bridges:
  - probability
  - powers-logs
