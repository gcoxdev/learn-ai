assessment_families:
- id: associative-memory-and-boltzmann-models.base
  objective_ref: objective.associative-memory-and-boltzmann-models
  task: base
  response_type: single_choice
  points: 1
  hint: 'Separate state updates from learning: trace the inputs, operation, and result before choosing.'
  remediation_scene: associative-memory-and-boltzmann-models.s2
  variants:
  - id: associative-memory-and-boltzmann-models.base.1
    prompt: What changes during fixed-weight Hopfield recall?
    options:
    - id: a
      text: Unit states
    - id: b
      text: The training dataset automatically
    - id: c
      text: Every weight necessarily
    answer: a
    feedback: Recall is state dynamics under stored parameters.
  - id: associative-memory-and-boltzmann-models.base.2
    prompt: What condition matters for the classical energy-descent claim?
    options:
    - id: b
      text: Any arbitrary recurrent update
    - id: c
      text: Only a large network name
    - id: a
      text: Symmetric weights and the specified asynchronous update assumptions
    answer: a
    feedback: The guarantee depends on the dynamics.
- id: associative-memory-and-boltzmann-models.transfer
  objective_ref: objective.associative-memory-and-boltzmann-models
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Compare recovery and generation: trace the inputs, operation, and result before choosing.'
  remediation_scene: associative-memory-and-boltzmann-models.s4
  variants:
  - id: associative-memory-and-boltzmann-models.transfer.1
    prompt: How do Boltzmann state updates differ from purely deterministic descent?
    options:
    - id: b
      text: They never use energy
    - id: c
      text: They always select one global minimum instantly
    - id: a
      text: They can sample stochastically from an energy-based process
    answer: a
    feedback: Stochasticity supports distributional exploration.
  - id: associative-memory-and-boltzmann-models.transfer.2
    prompt: Does recovering a noisy memory prove correct generative sampling?
    options:
    - id: c
      text: Only if energy falls
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Recall and sampling assess different behaviors.
