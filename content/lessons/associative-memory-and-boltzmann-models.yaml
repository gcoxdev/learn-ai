  version: 0.1.0-draft
  title: Recover patterns through energy-based state dynamics
  state: draft
  summary: Hopfield-style associative memories update states toward stored attractors, while Boltzmann models use
    stochastic energy-based distributions; state inference, sampling, and parameter learning are distinct operations.
