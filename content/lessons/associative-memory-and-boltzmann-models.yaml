  - id: associative-memory-and-boltzmann-models.base.v2
    objective_ref: objective.associative-memory-and-boltzmann-models
    task: base
    response_type: single_choice
    points: 1
    hint: "During recall only states change: each unit takes the sign of its local field, and with symmetric weights that flip can only lower E = −Σ w·s·s."
    remediation_scene: associative-memory-and-boltzmann-models.s2
    variants:
      - id: associative-memory-and-boltzmann-models.base.v2.1
        prompt: A Hopfield network is given a smudged cue and runs until nothing changes. What was updated along the way?
        options:
          - id: b
            text: The weights, nudged toward the cue by the Hebbian rule
          - id: a
            text: The unit states, each flipped to match its local field
          - id: c
            text: Both the weights and the states, in alternating steps
        answer: a
        feedback: Recall only changes states; the weights were fixed when the patterns were stored. Applying the Hebbian rule to the cue would store the smudge as a new memory.
      - id: associative-memory-and-boltzmann-models.base.v2.2
        prompt: A modified network has w₁₂ = +1 but w₂₁ = −1, and its energy sometimes rises during recall. Which assumption of the energy argument is broken?
        options:
          - id: c
            text: Updating one unit at a time, since two units changed together
          - id: b
            text: Zero self-connections, since each unit now feeds back to itself
          - id: a
            text: Symmetric weights, since the two directions now disagree
        answer: a
        feedback: The proof that ΔE ≤ 0 needs w_ij = w_ji, so that a unit's field is the same quantity the energy measures. Nothing in the setup mentions self-connections or simultaneous updates.
      - id: associative-memory-and-boltzmann-models.base.v2.3
        prompt: A Hopfield network stores the letter T. You start recall from an image with every pixel of the T inverted. What happens?
        options:
          - id: a
            text: It stays put, since an inverted pattern is also stable
          - id: b
            text: It flips back to the T, since the T has the lowest energy
          - id: c
            text: It wanders randomly, since no stored pattern matches it
        answer: a
        feedback: Flipping every state leaves each product w_ij·s_i·s_j unchanged, so the inverted T has the same energy and is a stable state too. Recall never climbs out of a valley to reach another, and it isn't random.
      - id: associative-memory-and-boltzmann-models.base.v2.4
        prompt: A Boltzmann machine is run with the temperature lowered toward zero. How do its units behave?
        options:
          - id: b
            text: They switch on and off at random, ignoring the energy entirely
          - id: c
            text: They stay frozen at whatever values they started with
          - id: a
            text: They settle downhill like a deterministic Hopfield network
        answer: a
        feedback: As T → 0, P(on) = 1/(1 + e^(−ΔE/T)) goes to 1 or 0 depending on the sign of ΔE, which is the Hopfield update. High temperature, not low, makes units nearly random.
      - id: associative-memory-and-boltzmann-models.base.v2.5
        prompt: "In Boltzmann machine learning, Δw = η(⟨sᵢsⱼ⟩_data − ⟨sᵢsⱼ⟩_model). When does the update stop changing the weights?"
        options:
          - id: c
            text: When the energy of the training data reaches its minimum
          - id: a
            text: When correlations in the model's samples match those in the data
          - id: b
            text: When every training pattern has become a stable state
        answer: a
        feedback: The two terms cancel when the freely running network reproduces the data's pairwise correlations. The model term matters because probabilities depend on every state's energy, and a generative model isn't trying to turn training patterns into fixed points.
  - id: associative-memory-and-boltzmann-models.transfer.v2
    objective_ref: objective.associative-memory-and-boltzmann-models
    task: transfer
    response_type: single_choice
    points: 1
    hint: "Decide which job the system is doing: recalling a stored pattern, generating new samples, or learning weights. Then ask whether capacity (about 0.14 N random patterns) is the limit."
    remediation_scene: associative-memory-and-boltzmann-models.s4
    variants:
      - id: associative-memory-and-boltzmann-models.transfer.v2.1
        prompt: An archivist wants to restore scratched copies of 50 known logos. Each logo is a 1,000-pixel binary image. Is a classical Hopfield network a reasonable fit?
        options:
          - id: a
            text: Possibly, since 50 is under 0.14 × 1,000, though correlated logos fit fewer
          - id: b
            text: Unlikely, since a Hopfield network needs one unit per logo
          - id: c
            text: Unlikely, since restoring scratches needs a generative model
        answer: a
        feedback: About 140 random patterns fit in 1,000 units, so 50 is within range, but similar-looking logos interfere more than random patterns. Hopfield networks spread all memories across all units, and restoring known images is recall, not generation.
      - id: associative-memory-and-boltzmann-models.transfer.v2.2
        prompt: A team wants a model that invents new, plausible user-preference profiles resembling their data. Which fits better?
        options:
          - id: c
            text: A Hopfield network storing every past profile
          - id: a
            text: A restricted Boltzmann machine trained on the profiles
          - id: b
            text: A Hopfield network run at a very low temperature
        answer: a
        feedback: Inventing new profiles is sampling from a learned distribution, which is what Boltzmann machines and RBMs are for. A Hopfield network recalls stored patterns; lowering temperature makes updates more deterministic, not more generative.
      - id: associative-memory-and-boltzmann-models.transfer.v2.3
        prompt: A transformer layer computes softmax(query · keys) and returns a weighted sum of values. In modern Hopfield network terms, what is the query?
        options:
          - id: b
            text: The stored patterns that the memory holds
          - id: a
            text: The current state, or cue, used to retrieve
          - id: c
            text: The inverse temperature that sets sharpness
        answer: a
        feedback: In the update ξ_new = X softmax(βXᵀξ), the cue ξ plays the query, the stored patterns X play keys and values, and β plays the 1/√d scaling.
      - id: associative-memory-and-boltzmann-models.transfer.v2.4
        prompt: A 500-unit Hopfield network storing 120 random patterns recalls badly, even from clean cues. What is the best explanation?
        options:
          - id: a
            text: It is over capacity, since 120 exceeds about 0.14 × 500 = 70
          - id: b
            text: The weights are symmetric, which lets the energy rise
          - id: c
            text: Recall needs more sweeps, since energy is still falling
        answer: a
        feedback: Past about 0.14 N patterns, crosstalk between memories swamps each pattern's own signal, so even stored patterns drift. Symmetric weights are what make energy fall, and extra sweeps can't fix a pattern that isn't a valley.
      - id: associative-memory-and-boltzmann-models.transfer.v2.5
        prompt: Training a full Boltzmann machine on images is too slow, because each update waits for the free-running network to settle. What change did Hinton's contrastive divergence make?
        options:
          - id: c
            text: It dropped the free-running term and kept only the data term
          - id: b
            text: It set the temperature to zero so sampling became exact
          - id: a
            text: It started the free-running phase at the data and ran a few steps
        answer: a
        feedback: Contrastive divergence starts the model's chain at a training example and runs only one or a few steps, which shows which way the model drifts. Dropping the model term would just lower energy everywhere, and T = 0 turns sampling into deterministic descent.
  - id: associative-memory-and-boltzmann-models.calculate
    objective_ref: objective.associative-memory-and-boltzmann-models
    task: base
    response_type: numeric
    points: 1
    hint: "Weights: w_ij = p_i·p_j. Local field: h_i = Σ w_ij·s_j. Energy: E = −Σ over pairs i<j of w_ij·s_i·s_j. Capacity: about 0.14 × N."
    remediation_scene: associative-memory-and-boltzmann-models.s2
    absolute_tolerance: 0.01
    variants:
      - id: associative-memory-and-boltzmann-models.calculate.1
        prompt: Using capacity ≈ 0.14 N, about how many random patterns can a Hopfield network with N = 500 units store?
        answer: 70
        feedback: 0.14 × 500 = 70. Beyond that, interference between memories makes recall collapse.
      - id: associative-memory-and-boltzmann-models.calculate.2
        prompt: Two ±1 units share weight w = +1. Their state is (+1, −1). What is the energy E = −w·s₁·s₂?
        answer: 1
        feedback: E = −(1)(+1)(−1) = +1. Updating either unit to agree with the other gives E = −1, lower as expected.
      - id: associative-memory-and-boltzmann-models.calculate.3
        prompt: "One pattern p = (+1, −1, −1, +1) is stored with w_ij = p_i·p_j. The state is (+1, −1, +1, +1), with unit 3 smudged. What is unit 3's local field h₃ = w₃₁s₁ + w₃₂s₂ + w₃₄s₄?"
        answer: -3
        feedback: w₃₁ = −1, w₃₂ = +1, w₃₄ = −1. So h₃ = (−1)(+1) + (+1)(−1) + (−1)(+1) = −3, and unit 3 flips back to −1.
      - id: associative-memory-and-boltzmann-models.calculate.4
        prompt: "A Hopfield network stores one pattern of 5 units with w_ij = p_i·p_j. What is the energy of the stored pattern itself, E = −Σ over pairs of w_ij·s_i·s_j?"
        answer: -10
        feedback: Each pair contributes (p_i·p_j)² = 1, and 5 units have 5 × 4 / 2 = 10 pairs, so E = −10.
      - id: associative-memory-and-boltzmann-models.calculate.5
        prompt: A Boltzmann machine unit would lower the energy by ΔE = 2 by turning on. At temperature T = 1, what is P(on) = 1/(1 + e^(−ΔE/T))? Give three decimals.
        answer: 0.881
        feedback: e^(−2) ≈ 0.135, so P(on) = 1/1.135 ≈ 0.881. At T = 0.5 it would be 0.982.
