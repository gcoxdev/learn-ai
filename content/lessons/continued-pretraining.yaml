schema_version: 0.2-draft
lesson:
  id: continued-pretraining
  version: 0.3.0-draft
  title: Continue pretraining without losing sight of the starting model
  state: draft
  summary: Continue learning from a saved model while measuring both new gains and useful behavior that may
    be lost.
  slot: M16.8
  category: learning
  sources:
  - title: The Llama 3 Herd of Models
    url: https://arxiv.org/abs/2407.21783
  - title: Qwen3 Technical Report
    url: https://arxiv.org/abs/2505.09388
objectives:
- id: objective.continued-pretraining
  version: 1-draft
  statement: Continued pretraining adapts an existing checkpoint to new distributions or contexts; preserve
    the artifact lineage and evaluate gains alongside forgetting and deployment changes.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - continued-pretraining.base
  - continued-pretraining.transfer
  prerequisites:
  - anyOf:
    - objective.pretraining-budget-and-checkpoints
  - anyOf:
    - objective.positional-encodings
scenes:
- id: continued-pretraining.s1
  title: Keep learning from an existing checkpoint
  type: explanation
  depth: intuition
  objective_refs:
  - objective.continued-pretraining
  markdown: 'Imagine a pretrained text model continuing next-token prediction on astronomy articles. It still
    predicts recorded next tokens, but now sees more examples from a particular domain. This is **continued
    pretraining**.


    **Instruction tuning** instead trains responses to requests in a specified demonstration format. Both may
    change weights, but their immediate tasks differ. To describe a continued-pretraining experiment, record
    the starting checkpoint, compatible tokenizer, new mixture, learning rate, and stopping rule.'
  text_mode: 'Imagine a pretrained text model continuing next-token prediction on astronomy articles. It still
    predicts recorded next tokens, but now sees more examples from a particular domain. This is **continued
    pretraining**.


    **Instruction tuning** instead trains responses to requests in a specified demonstration format. Both may
    change weights, but their immediate tasks differ. To describe a continued-pretraining experiment, record
    the starting checkpoint, compatible tokenizer, new mixture, learning rate, and stopping rule.'
  bridges: []
- id: continued-pretraining.s2
  title: Check what improves and what is lost
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.continued-pretraining
  markdown: 'Astronomy predictions may improve while general-language or multilingual behavior gets worse.
    This loss of earlier useful behavior is called **forgetting**. Test the same protected domain and general
    tasks before and after the update.


    If astronomy improves by 5 points and the general task drops by 8, report both. Mixing in general data
    or adjusting update strength can help manage the tradeoff, but no recipe guarantees that every capability
    survives. Judge the result against the intended use.'
  text_mode: 'Astronomy predictions may improve while general-language or multilingual behavior gets worse.
    This loss of earlier useful behavior is called **forgetting**. Test the same protected domain and general
    tasks before and after the update.


    If astronomy improves by 5 points and the general task drops by 8, report both. Mixing in general data
    or adjusting update strength can help manage the tradeoff, but no recipe guarantees that every capability
    survives. Judge the result against the intended use.'
  bridges: []
- id: continued-pretraining.s3
  title: Extend context as a tested capability
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.continued-pretraining
  markdown: Changing a configured maximum length or position scaling does not by itself establish useful long-context
    reasoning. Training on longer sequences and evaluating retrieval, distractors, position sensitivity, and
    multi-document reasoning provide evidence. Serving must also afford the larger attention work and cache.
  text_mode: Changing a configured maximum length or position scaling does not by itself establish useful long-context
    reasoning. Training on longer sequences and evaluating retrieval, distractors, position sensitivity, and
    multi-document reasoning provide evidence. Serving must also afford the larger attention work and cache.
  bridges: []
- id: continued-pretraining.s4
  title: Release a traceable derivative
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.continued-pretraining
  markdown: 'Record the parent checkpoint, data and recipe changes, context assumptions, evaluation results,
    tokenizer, and runtime requirements. Name limitations of available evidence. A new checkpoint is a distinct
    artifact even if its architecture dimensions match its parent; downstream users need that distinction to
    reproduce behavior.


    **Lineage** records which earlier artifact a model came from and what changed. Two files with the same
    array dimensions can contain different learned numbers and behave differently. Keep the parent identifier
    and transformation recipe alongside the new weights so comparisons can be reconstructed.'
  text_mode: 'Record the parent checkpoint, data and recipe changes, context assumptions, evaluation results,
    tokenizer, and runtime requirements. Name limitations of available evidence. A new checkpoint is a distinct
    artifact even if its architecture dimensions match its parent; downstream users need that distinction to
    reproduce behavior.


    **Lineage** records which earlier artifact a model came from and what changed. Two files with the same
    array dimensions can contain different learned numbers and behave differently. Keep the parent identifier
    and transformation recipe alongside the new weights so comparisons can be reconstructed.'
  bridges: []
- id: continued-pretraining.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.continued-pretraining
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Continued pretraining starts from learned weights and changes them using new data. Preserve the
    starting model’s identity and measure both new gains and losses of earlier capabilities.
- id: continued-pretraining.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.continued-pretraining
  markdown: Continued pretraining starts from learned weights and changes them using new data. Preserve the
    starting model’s identity and measure both new gains and losses of earlier capabilities.
  text_mode: Continued pretraining starts from learned weights and changes them using new data. Preserve the
    starting model’s identity and measure both new gains and losses of earlier capabilities.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - continued-pretraining.s1
    - continued-pretraining.s2
    - continued-pretraining.s3
    - continued-pretraining.s4
