schema_version: 0.2-draft
lesson:
  id: continued-pretraining
  version: 0.2.0-draft
  title: Continue pretraining without losing sight of the starting model
  state: draft
  summary: Continue learning from a saved model while measuring both new gains and useful behavior that may
    be lost.
  slot: M16.8
  category: learning
  sources:
  - title: The Llama 3 Herd of Models
    url: https://arxiv.org/abs/2407.21783
  - title: Qwen3 Technical Report
    url: https://arxiv.org/abs/2505.09388
objectives:
- id: objective.continued-pretraining
  version: 1-draft
  statement: Continued pretraining adapts an existing checkpoint to new distributions or contexts; preserve
    the artifact lineage and evaluate gains alongside forgetting and deployment changes.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - continued-pretraining.base
  - continued-pretraining.transfer
  prerequisites:
  - anyOf:
    - objective.pretraining-budget-and-checkpoints
  - anyOf:
    - objective.positional-encodings
scenes:
- id: continued-pretraining.s1
  title: Start from learned weights
  type: explanation
  depth: intuition
  objective_refs:
  - objective.continued-pretraining
  markdown: 'Continued pretraining resumes a prediction objective on an existing model, often with new domain,
    language, or recent data. It differs from instruction demonstrations even when both update weights. The
    initial checkpoint, tokenizer compatibility, data mixture, learning rate, and stopping criteria define
    the experiment.


    Imagine a pretrained text model continuing its next-token task on astronomy articles. It still guesses
    recorded next tokens; the examples now emphasize a new domain. **Instruction tuning** instead teaches responses
    to requests under a specified demonstration format. Both may alter weights, but their immediate training
    tasks differ.'
  text_mode: 'Continued pretraining resumes a prediction objective on an existing model, often with new domain,
    language, or recent data. It differs from instruction demonstrations even when both update weights. The
    initial checkpoint, tokenizer compatibility, data mixture, learning rate, and stopping criteria define
    the experiment.


    Imagine a pretrained text model continuing its next-token task on astronomy articles. It still guesses
    recorded next tokens; the examples now emphasize a new domain. **Instruction tuning** instead teaches responses
    to requests under a specified demonstration format. Both may alter weights, but their immediate training
    tasks differ.'
  bridges: []
- id: continued-pretraining.s2
  title: Trade specialization against retention
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.continued-pretraining
  markdown: 'Imagine adapting a general model to scientific articles. Domain loss may improve while conversational
    or multilingual performance declines. Mixing retained general data, adjusting update strength, and monitoring
    a capability suite can help manage forgetting, but no recipe guarantees every earlier skill survives.


    **Forgetting** means an update harms behavior that was useful before. Test the same protected astronomy
    and general-language tasks before and after the adaptation. If astronomy improves by 5 points but the general
    task falls by 8, report both changes. Whether that trade is acceptable depends on the intended use, not
    the new checkpoint''s name.'
  text_mode: 'Imagine adapting a general model to scientific articles. Domain loss may improve while conversational
    or multilingual performance declines. Mixing retained general data, adjusting update strength, and monitoring
    a capability suite can help manage forgetting, but no recipe guarantees every earlier skill survives.


    **Forgetting** means an update harms behavior that was useful before. Test the same protected astronomy
    and general-language tasks before and after the adaptation. If astronomy improves by 5 points but the general
    task falls by 8, report both changes. Whether that trade is acceptable depends on the intended use, not
    the new checkpoint''s name.'
  bridges: []
- id: continued-pretraining.s3
  title: Extend context as a tested capability
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.continued-pretraining
  markdown: Changing a configured maximum length or position scaling does not by itself establish useful long-context
    reasoning. Training on longer sequences and evaluating retrieval, distractors, position sensitivity, and
    multi-document reasoning provide evidence. Serving must also afford the larger attention work and cache.
  text_mode: Changing a configured maximum length or position scaling does not by itself establish useful long-context
    reasoning. Training on longer sequences and evaluating retrieval, distractors, position sensitivity, and
    multi-document reasoning provide evidence. Serving must also afford the larger attention work and cache.
  bridges: []
- id: continued-pretraining.s4
  title: Release a traceable derivative
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.continued-pretraining
  markdown: 'Record the parent checkpoint, data and recipe changes, context assumptions, evaluation results,
    tokenizer, and runtime requirements. Name limitations of available evidence. A new checkpoint is a distinct
    artifact even if its architecture dimensions match its parent; downstream users need that distinction to
    reproduce behavior.


    **Lineage** records which earlier artifact a model came from and what changed. Two files with the same
    array dimensions can contain different learned numbers and behave differently. Keep the parent identifier
    and transformation recipe alongside the new weights so comparisons can be reconstructed.'
  text_mode: 'Record the parent checkpoint, data and recipe changes, context assumptions, evaluation results,
    tokenizer, and runtime requirements. Name limitations of available evidence. A new checkpoint is a distinct
    artifact even if its architecture dimensions match its parent; downstream users need that distinction to
    reproduce behavior.


    **Lineage** records which earlier artifact a model came from and what changed. Two files with the same
    array dimensions can contain different learned numbers and behave differently. Keep the parent identifier
    and transformation recipe alongside the new weights so comparisons can be reconstructed.'
  bridges: []
- id: continued-pretraining.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
