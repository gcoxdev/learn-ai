schema_version: 0.2-draft
lesson:
  id: continued-pretraining
  version: 0.1.0-draft
  title: Continue pretraining without losing sight of the starting model
  state: draft
  summary: Continued pretraining adapts an existing checkpoint to new distributions or contexts; preserve the artifact
    lineage and evaluate gains alongside forgetting and deployment changes.
  slot: M16.8
  category: learning
  sources:
  - title: The Llama 3 Herd of Models
    url: https://arxiv.org/abs/2407.21783
  - title: Qwen3 Technical Report
    url: https://arxiv.org/abs/2505.09388
objectives:
- id: objective.continued-pretraining
  version: 1-draft
  statement: Continued pretraining adapts an existing checkpoint to new distributions or contexts; preserve the
    artifact lineage and evaluate gains alongside forgetting and deployment changes.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - continued-pretraining.base
  - continued-pretraining.transfer
  prerequisites:
  - anyOf:
    - objective.pretraining-budget-and-checkpoints
  - anyOf:
    - objective.positional-encodings
scenes:
- id: continued-pretraining.s1
  title: Start from learned weights
  type: explanation
  depth: intuition
  objective_refs:
  - objective.continued-pretraining
  markdown: Continued pretraining resumes a prediction objective on an existing model, often with new domain, language,
    or recent data. It differs from instruction demonstrations even when both update weights. The initial checkpoint,
    tokenizer compatibility, data mixture, learning rate, and stopping criteria define the experiment.
  text_mode: Continued pretraining resumes a prediction objective on an existing model, often with new domain, language,
    or recent data. It differs from instruction demonstrations even when both update weights. The initial checkpoint,
    tokenizer compatibility, data mixture, learning rate, and stopping criteria define the experiment.
  bridges: []
- id: continued-pretraining.s2
  title: Trade specialization against retention
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.continued-pretraining
  markdown: Imagine adapting a general model to scientific articles. Domain loss may improve while conversational
    or multilingual performance declines. Mixing retained general data, adjusting update strength, and monitoring
    a capability suite can help manage forgetting, but no recipe guarantees every earlier skill survives.
  text_mode: Imagine adapting a general model to scientific articles. Domain loss may improve while conversational
    or multilingual performance declines. Mixing retained general data, adjusting update strength, and monitoring
    a capability suite can help manage forgetting, but no recipe guarantees every earlier skill survives.
  bridges: []
- id: continued-pretraining.s3
  title: Extend context as a tested capability
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.continued-pretraining
  markdown: Changing a configured maximum length or position scaling does not by itself establish useful long-context
    reasoning. Training on longer sequences and evaluating retrieval, distractors, position sensitivity, and multi-document
    reasoning provide evidence. Serving must also afford the larger attention work and cache.
  text_mode: Changing a configured maximum length or position scaling does not by itself establish useful long-context
    reasoning. Training on longer sequences and evaluating retrieval, distractors, position sensitivity, and multi-document
    reasoning provide evidence. Serving must also afford the larger attention work and cache.
  bridges: []
- id: continued-pretraining.s4
  title: Release a traceable derivative
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.continued-pretraining
  markdown: Record the parent checkpoint, data and recipe changes, context assumptions, evaluation results, tokenizer,
    and runtime requirements. Name limitations of available evidence. A new checkpoint is a distinct artifact even
    if its architecture dimensions match its parent; downstream users need that distinction to reproduce behavior.
  text_mode: Record the parent checkpoint, data and recipe changes, context assumptions, evaluation results, tokenizer,
    and runtime requirements. Name limitations of available evidence. A new checkpoint is a distinct artifact even
    if its architecture dimensions match its parent; downstream users need that distinction to reproduce behavior.
  bridges: []
- id: continued-pretraining.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.continued-pretraining
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Continued pretraining adapts an existing checkpoint to new distributions or contexts; preserve the artifact
    lineage and evaluate gains alongside forgetting and deployment changes.
- id: continued-pretraining.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.continued-pretraining
  markdown: Continued pretraining adapts an existing checkpoint to new distributions or contexts; preserve the artifact
    lineage and evaluate gains alongside forgetting and deployment changes.
  text_mode: Continued pretraining adapts an existing checkpoint to new distributions or contexts; preserve the
    artifact lineage and evaluate gains alongside forgetting and deployment changes.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - continued-pretraining.s1
    - continued-pretraining.s2
    - continued-pretraining.s3
    - continued-pretraining.s4
    - continued-pretraining.check
    gate_refs:
    - gate.core
