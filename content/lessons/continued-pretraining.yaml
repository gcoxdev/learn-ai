assessment_families:
- id: continued-pretraining.base
  objective_ref: objective.continued-pretraining
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trade specialization against retention: trace the inputs, operation, and result before choosing.'
  remediation_scene: continued-pretraining.s2
  variants:
  - id: continued-pretraining.base.1
    prompt: What distinguishes continued pretraining from training from scratch?
    options:
    - id: a
      text: It begins from already learned weights
    - id: b
      text: It never updates parameters
    - id: c
      text: It requires a new vocabulary every time
    answer: a
    feedback: Initialization carries prior learned behavior into the new run.
  - id: continued-pretraining.base.2
    prompt: Domain performance rises while general skills fall. What is this called?
    options:
    - id: b
      text: Proof of evaluation leakage in every case
    - id: c
      text: An impossible result
    - id: a
      text: A specialization and retention tradeoff
    answer: a
    feedback: New updates can improve one distribution while forgetting another.
- id: continued-pretraining.transfer
  objective_ref: objective.continued-pretraining
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Release a traceable derivative: trace the inputs, operation, and result before choosing.'
  remediation_scene: continued-pretraining.s4
  variants:
  - id: continued-pretraining.transfer.1
    prompt: A configuration accepts 100,000 tokens. What remains unproven?
    options:
    - id: b
      text: Whether the integer is positive
    - id: c
      text: Whether any tokenizer exists
    - id: a
      text: Reliable use of information throughout that context
    answer: a
    feedback: Accepted input length and useful long-context capability differ.
  - id: continued-pretraining.transfer.2
    prompt: Two checkpoints share tensor shapes. Are they interchangeable research artifacts?
    options:
    - id: c
      text: Only if file sizes match
    - id: a
      text: No; their learned weights and training histories can differ
    - id: b
      text: 'Yes'
    answer: a
    feedback: Artifact identity includes learned state and lineage.
