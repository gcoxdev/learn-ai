schema_version: 0.2-draft
lesson:
  id: expert-to-statistical
  version: 0.3.0-draft
  title: From knowledge engineering to learning from data
  state: draft
  summary: Compare a rule written by an expert with a pattern estimated from examples. Follow the work needed
    to build and maintain each.
  slot: M01.5
  category: learning
  sources:
  - title: Buchanan — A (Very) Brief History of Artificial Intelligence
    url: https://ojs.aaai.org/aimagazine/index.php/aimagazine/article/view/1848/0
  - title: Dive into Deep Learning — linear regression
    url: https://d2l.ai/chapter_linear-regression/linear-regression.html
  - title: 'Buchanan and Shortliffe: the structure of MYCIN (1984), chapter 4'
    url: https://people.dbmi.columbia.edu/~ehs7001/Buchanan-Shortliffe-1984/Chapter-04.pdf
  archetype: perspective
objectives:
- id: objective.expert-to-statistical
  version: 2-draft
  statement: Distinguish knowledge engineering from statistical fitting and identify how both approaches depend
    on human choices and evaluation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - expert-to-statistical.base.v2
  - expert-to-statistical.transfer.v2
  prerequisites:
  - anyOf:
    - objective.symbolic-era
scenes:
- id: expert-to-statistical.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.expert-to-statistical
  title: Turn specialist knowledge into rules
  markdown: 'Imagine a bicycle-repair helper that asks whether a tire is flat and whether a puncture is visible.
    A specialist supplies rules that connect the answers to a next inspection step.


    An **expert system** stores specialist knowledge and applies it through explicit procedures. **Knowledge
    engineering** is the work of turning that expertise into facts, rules, and relationships the program can
    use. Someone must decide which distinctions matter, write the rules, and keep them up to date.'
  text_mode: 'Imagine a bicycle-repair helper that asks whether a tire is flat and whether a puncture is visible.
    A specialist supplies rules that connect the answers to a next inspection step.


    An **expert system** stores specialist knowledge and applies it through explicit procedures. **Knowledge
    engineering** is the work of turning that expertise into facts, rules, and relationships the program can
    use. Someone must decide which distinctions matter, write the rules, and keep them up to date.'
  bridges: []
- id: expert-to-statistical.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.expert-to-statistical
  title: Trace a small chain of rules
  markdown: Suppose rule one says “if pressure is low, inspect for a leak.” Rule two says “if inspection finds
    a puncture, patch the tube.” The facts initially include low-pressure, so the first rule applies. The second
    cannot apply until the required observation arrives. An **inference engine** is the procedure that selects
    and applies such rules. The toy illustrates a mechanism rather than offering a complete repair guide. Notice
    how the program’s next conclusion depends on which facts are available and on the conditions the author
    wrote.
  text_mode: Suppose rule one says “if pressure is low, inspect for a leak.” Rule two says “if inspection finds
    a puncture, patch the tube.” The facts initially include low-pressure, so the first rule applies. The second
    cannot apply until the required observation arrives. An **inference engine** is the procedure that selects
    and applies such rules. The toy illustrates a mechanism rather than offering a complete repair guide. Notice
    how the program’s next conclusion depends on which facts are available and on the conditions the author
    wrote.
  bridges: []
- id: expert-to-statistical.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.expert-to-statistical
  title: Expert systems tackled specialist tasks
  markdown: 'DENDRAL investigated how to reason about chemical structures. MYCIN investigated medical consultation
    using specialist knowledge. Both illustrate why expert systems depended on detailed representations of
    a particular field.


    A useful demonstration still left practical questions: who enters the facts, how are exceptions handled,
    and how is the advice checked? Those questions help explain both the promise of expert systems and the
    work involved in putting them into use.'
  text_mode: 'DENDRAL investigated how to reason about chemical structures. MYCIN investigated medical consultation
    using specialist knowledge. Both illustrate why expert systems depended on detailed representations of
    a particular field.


    A useful demonstration still left practical questions: who enters the facts, how are exceptions handled,
    and how is the advice checked? Those questions help explain both the promise of expert systems and the
    work involved in putting them into use.'
  bridges: []
- id: expert-to-statistical.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.expert-to-statistical
  title: Estimate a pattern from examples instead
  markdown: '**Statistical learning** fits a model using observed examples and a defined objective. For a toy
    delivery estimator, collected distances and travel times can be used to choose a minutes-per-kilometer
    weight. The fitted number comes from comparing candidate predictions with recorded targets. People still
    decide what to record, what form of model to try, which errors matter, and how to test it. Learning from
    data moves some work from writing individual rules to designing a learning procedure; it does not remove
    design choices.'
  text_mode: '**Statistical learning** fits a model using observed examples and a defined objective. For a
    toy delivery estimator, collected distances and travel times can be used to choose a minutes-per-kilometer
    weight. The fitted number comes from comparing candidate predictions with recorded targets. People still
    decide what to record, what form of model to try, which errors matter, and how to test it. Learning from
    data moves some work from writing individual rules to designing a learning procedure; it does not remove
    design choices.'
  bridges: []
- id: expert-to-statistical.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.expert-to-statistical
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A written rule and a learned estimate come from different procedures. Both require useful representations,
    reliable evidence, and maintenance when the world changes.
- id: expert-to-statistical.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.expert-to-statistical
  markdown: Expert systems made domain rules operational; statistical learning shifted more model construction
    toward data, while retaining the need for careful problem formulation and evaluation.
  text_mode: Expert systems made domain rules operational; statistical learning shifted more model construction
    toward data, while retaining the need for careful problem formulation and evaluation.
- id: expert-to-statistical.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.expert-to-statistical
  title: Compare the maintenance problems
  markdown: A new bicycle part may require a rule update. A new delivery area may make the old data unrepresentative.
    A rule base can suffer from missing exceptions or conflicting instructions; a fitted model can exploit
    a misleading pattern or fail on unfamiliar cases. For either approach, track what changed, inspect failures,
    and test revisions on cases that were not used to choose them. A well-explained rule is not automatically
    correct, and a large collection of examples is not automatically relevant.
  text_mode: A new bicycle part may require a rule update. A new delivery area may make the old data unrepresentative.
    A rule base can suffer from missing exceptions or conflicting instructions; a fitted model can exploit
    a misleading pattern or fail on unfamiliar cases. For either approach, track what changed, inspect failures,
    and test revisions on cases that were not used to choose them. A well-explained rule is not automatically
    correct, and a large collection of examples is not automatically relevant.
  bridges: []
- id: expert-to-statistical.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.expert-to-statistical
  title: Use a mixed solution when the task calls for it
  markdown: A delivery system might learn expected travel times while enforcing a written height limit for
    bridges. The learned estimate answers “how long?” and the explicit constraint answers “is this route allowed?”
    Compare those roles separately rather than forcing one method to replace the other. In your notes, record
    what is supplied by people, what is estimated from examples, and what evidence checks each part. The history
    of statistical AI is a change in emphasis and capability, not the disappearance of knowledge representation.
  text_mode: A delivery system might learn expected travel times while enforcing a written height limit for
    bridges. The learned estimate answers “how long?” and the explicit constraint answers “is this route allowed?”
