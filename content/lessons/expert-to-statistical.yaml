schema_version: 0.2-draft
lesson:
  id: expert-to-statistical
  version: 0.1.0-draft
  title: From knowledge engineering to learning from data
  state: draft
  summary: Expert systems made domain rules operational; statistical learning shifted more model construction toward
    data, while retaining the need for careful problem formulation and evaluation.
  slot: M01.5
  category: learning
  minutes: 12
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.expert-to-statistical
  version: 1-draft
  statement: Expert systems made domain rules operational; statistical learning shifted more model construction
    toward data, while retaining the need for careful problem formulation and evaluation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - expert-to-statistical.base
  - expert-to-statistical.transfer
  prerequisites:
  - anyOf:
    - objective.symbolic-era
scenes:
- id: expert-to-statistical.s1
  title: Make expertise executable
  type: explanation
  depth: intuition
  objective_refs:
  - objective.expert-to-statistical
  markdown: An expert system represents domain knowledge as rules or other explicit structures and applies an inference
    procedure. Knowledge engineering includes eliciting rules, resolving conflicts, and maintaining them. A system
    can explain which rules fired, but that trace is only as reliable as the rules and inputs.
  text_mode: An expert system represents domain knowledge as rules or other explicit structures and applies an inference
    procedure. Knowledge engineering includes eliciting rules, resolving conflicts, and maintaining them. A system
    can explain which rules fired, but that trace is only as reliable as the rules and inputs.
  bridges: []
- id: expert-to-statistical.s2
  title: Watch the maintenance problem
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.expert-to-statistical
  markdown: Suppose a support system routes requests using hundreds of conditions. A new product changes several
    exceptions. Updating one rule can interact with others and create inconsistent recommendations. Encoding tacit
    expert knowledge and keeping it current can become more expensive than the rule execution itself.
  text_mode: Suppose a support system routes requests using hundreds of conditions. A new product changes several
    exceptions. Updating one rule can interact with others and create inconsistent recommendations. Encoding tacit
    expert knowledge and keeping it current can become more expensive than the rule execution itself.
  bridges: []
- id: expert-to-statistical.s3
  title: Estimate patterns from examples
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.expert-to-statistical
  markdown: Statistical learning fits parameters or structures using observed data. A classifier can learn how measurements
    relate to labels instead of requiring a rule for every case. This moves work toward data collection, representation,
    objective choice, and validation. It does not remove human judgment or guarantee that the observed patterns
    will persist.
  text_mode: Statistical learning fits parameters or structures using observed data. A classifier can learn how
    measurements relate to labels instead of requiring a rule for every case. This moves work toward data collection,
    representation, objective choice, and validation. It does not remove human judgment or guarantee that the observed
    patterns will persist.
  bridges: []
- id: expert-to-statistical.s4
  title: Choose what should be learned
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.expert-to-statistical
  markdown: A modern system might use learned ranking inside explicit eligibility constraints. Rules are suitable
    for stable requirements, while prediction may benefit from repeated observations. Compare maintenance burden,
    data coverage, uncertainty, and the cost of mistakes. The historical transition expanded the toolbox rather
    than deleting knowledge representation.
  text_mode: A modern system might use learned ranking inside explicit eligibility constraints. Rules are suitable
    for stable requirements, while prediction may benefit from repeated observations. Compare maintenance burden,
    data coverage, uncertainty, and the cost of mistakes. The historical transition expanded the toolbox rather
    than deleting knowledge representation.
  bridges: []
- id: expert-to-statistical.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.expert-to-statistical
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Expert systems made domain rules operational; statistical learning shifted more model construction toward
    data, while retaining the need for careful problem formulation and evaluation.
- id: expert-to-statistical.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.expert-to-statistical
  markdown: Expert systems made domain rules operational; statistical learning shifted more model construction toward
    data, while retaining the need for careful problem formulation and evaluation.
  text_mode: Expert systems made domain rules operational; statistical learning shifted more model construction
    toward data, while retaining the need for careful problem formulation and evaluation.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - expert-to-statistical.s1
    - expert-to-statistical.s2
    - expert-to-statistical.s3
    - expert-to-statistical.s4
    - expert-to-statistical.check
    gate_refs:
