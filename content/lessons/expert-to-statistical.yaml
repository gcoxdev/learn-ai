schema_version: 0.2-draft
lesson:
  id: expert-to-statistical
  version: 0.4.0-draft
  title: From knowledge engineering to learning from data
  state: draft
  summary: In the 1980s, hand-written rules saved one computer maker millions a year, then the boom went bust. See why "let the data write the rules" took over, and what it still costs.
  slot: M01.5
  category: learning
  sources:
    - title: Buchanan — A (Very) Brief History of Artificial Intelligence
      url: https://ojs.aaai.org/aimagazine/index.php/aimagazine/article/view/1848/0
    - title: Dive into Deep Learning — linear regression
      url: https://d2l.ai/chapter_linear-regression/linear-regression.html
    - title: 'Buchanan and Shortliffe: the structure of MYCIN (1984), chapter 4'
      url: https://people.dbmi.columbia.edu/~ehs7001/Buchanan-Shortliffe-1984/Chapter-04.pdf
  archetype: perspective
objectives:
  - id: objective.expert-to-statistical
    version: 3-draft
    statement: Distinguish knowledge engineering from statistical fitting and identify how both approaches depend on human choices and evaluation.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - expert-to-statistical.base.v3
      - expert-to-statistical.transfer.v3
    prerequisites:
      - anyOf:
          - objective.symbolic-era
scenes:
  - id: expert-to-statistical.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.expert-to-statistical
    title: Bottle an expert's know-how
    markdown: |-
      Through the 1970s, more and more AI researchers changed their bet. Instead of general reasoning, capture what one kind of expert knows about one narrow job, and write it down as rules. A program built this way is an **expert system**, and the work of interviewing experts and turning what they say into rules is **knowledge engineering**.

      Three systems made the idea famous:

      | System | Where and when | Job | What happened |
      | --- | --- | --- | --- |
      | DENDRAL | Stanford, from 1965 | Work out a molecule's structure from chemical measurements | Showed narrow expertise could be coded |
      | MYCIN | Stanford, 1970s | Identify bacteria behind serious infections, such as blood infections and meningitis, and suggest antibiotics | Expert-level advice in tests; never used in routine care |
      | XCON (R1) | Carnegie Mellon and Digital Equipment Corporation, in use from 1980 | Configure customers' VAX computer orders | Reportedly saved tens of millions of dollars a year |

      MYCIN's fate is worth remembering. In a blinded 1979 test on meningitis cases, outside experts rated its advice about as good as that of Stanford's own infection specialists. Yet it never left the lab: typing in a case took a long time, it sat outside doctors' daily routine, and nobody was sure who would be responsible if its advice was wrong.

      Our running example is a modern cousin: deciding whether an email is a scam. First we'll write the rules by hand, as an expert system would. Then we'll let the data write them.
    bridges: []
  - id: expert-to-statistical.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.expert-to-statistical
    title: Follow a chain of rules
    markdown: |-
      A security expert gives you two rules:

      - **R1:** if the sender is unknown *and* the email contains a link, then it's *suspicious*.
      - **R2:** if it's suspicious *and* it asks for a password, then it's *phishing*.

      An email arrives from an unknown sender, with a link, asking you to "confirm your password." The **inference engine**, the part of the program that applies rules, checks which rules match the known facts. R1 matches, so it adds *suspicious*. Now R2 matches too, so it adds *phishing*. Reasoning forward from facts like this is called *forward chaining*. MYCIN mostly worked the other way, backward from a goal such as "which bacterium is it?", asking the doctor questions as it went.

      :::predict A second email comes from an unknown sender and asks for a password, but has no link. What does the engine conclude?
      Nothing. R1 needs a link, so *suspicious* is never added, and R2 never fires. The rules miss a scam any human would spot: every gap in the rules is a gap in the system.
      :::

      You'll build forward and backward chaining in the logic module.
    bridges: []
  - id: expert-to-statistical.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.expert-to-statistical
    title: The boom, and the bill for upkeep
    markdown: |-
      XCON's success set off a boom in the early 1980s. Corporations formed AI departments, and in 1982 Japan launched its ambitious Fifth Generation computer project. Companies such as Symbolics sold **Lisp machines**, expensive workstations built to run Lisp, the favorite language of AI programmers.

      Then the costs arrived. XCON grew to thousands of rules, and every new product meant experts had to revise and recheck them. Getting knowledge out of experts' heads was so slow that it earned a name: the *knowledge acquisition bottleneck*. The systems were also brittle: a case slightly outside the rules got a confident wrong answer, like our link-free scam. Around 1987, cheaper general-purpose workstations and PCs could run Lisp well enough, and the Lisp machine market collapsed. The second AI winter followed.

      :::mixup "Expert systems failed because rules don't work."
      Rules worked: XCON paid for itself for years, and rule engines still check tax returns and insurance claims today. What failed was the promise that hand-written rules could scale cheaply to messy, changing problems. Writing and maintaining the rules was the expensive part.
      :::
    bridges: []
  - id: expert-to-statistical.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.expert-to-statistical
    title: Let the data write the rule
    markdown: |-
      :::story "Every time I fire a linguist..."
      At IBM in the 1970s and 1980s, Frederick Jelinek's speech-recognition group replaced hand-written rules of grammar with probabilities counted from large amounts of recorded speech and text. A quip often attributed to Jelinek: "Every time I fire a linguist, the performance of the speech recognizer goes up." By the early 1990s, IBM researchers were learning to translate between French and English from more than a million pairs of matching sentences in Canadian parliamentary records.
      :::

      **Statistical learning** means estimating a model's numbers from examples instead of writing its rules. For email, you don't ask an expert which words are suspicious: you count. In 2002 the programmer Paul Graham popularized this approach for spam filters. Here's the idea in miniature:

      ```python run
      spam = ["win a free prize now", "free money click now", "claim your prize now",
              "cheap pills free shipping"]
      ham = ["lunch at noon tomorrow", "can you review my slides", "free for lunch today",
             "meeting moved to noon"]

      def share(word, emails):
          """Fraction of emails containing the word (+1 smoothing so it is never 0)."""
          hits = sum(word in e.split() for e in emails)
          return (hits + 1) / (len(emails) + 2)

      def spam_ratio(word):
          return share(word, spam) / share(word, ham)

      for word in ["free", "prize", "now", "lunch"]:
          print(f"{word:>6}: spam {share(word, spam):.2f}  ham {share(word, ham):.2f}"
                f"  ratio {spam_ratio(word):.2f}")

      def score(email):
          s = 1.0
          for word in email.split():
              s *= spam_ratio(word)
          return s

      for email in ["free prize now", "lunch now"]:
          print(f"'{email}': spam score {score(email):.2f}")
      ```

      "Now" is 4 times more common in spam than in normal mail ("ham"), "prize" 3 times, "free" 2 times, so "free prize now" scores 2 × 3 × 4 = 24. "Lunch" pulls a message toward ham. Nobody wrote a rule about "prize"; the counts did. This is a simplified naive Bayes filter, which you'll build properly in the probability module.
    bridges: []
  - id: expert-to-statistical.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.expert-to-statistical
    markdown: Trace a rule chain, count a spam word, and then decide how tax software, an aging spam filter, a hospital system, and MYCIN's fate fit the rules-versus-data story.
    takeaway: |-
      Expert systems get their rules from people; statistical learning estimates them from examples. Both need upkeep: rules must be rewritten when the world changes, and learned models need fresh, well-chosen data.
  - id: expert-to-statistical.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.expert-to-statistical
    markdown: |-
      Expert systems made domain rules operational; statistical learning shifted more model construction toward data, while retaining the need for careful problem formulation and evaluation.
  - id: expert-to-statistical.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.expert-to-statistical
    title: Different upkeep, not zero upkeep
    markdown: |-
      Scammers adapt. Suppose they start writing "fr3e pr1ze." How does each approach cope?

      | | Hand-written rules | Learned filter |
      | --- | --- | --- |
      | Who notices the change? | An expert, eventually | Users clicking "report spam" |
      | What gets updated? | The rules, by hand | The counts, by retraining on new labeled emails |
      | What goes wrong if nobody updates? | New tricks slip past | The counts slowly go stale |

      The learned filter moved the work, it didn't delete it. People still decide what counts as spam, which emails to learn from, and how to test the filter on emails it hasn't seen. A huge pile of examples from 2015 won't catch the scams of 2025.
    bridges: []
  - id: expert-to-statistical.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.expert-to-statistical
    title: Rules for the must-nots, learning for the maybes
    markdown: |-
      Modern email systems use both. A learned model gives every message a spam score, because "how scammy is this?" is a matter of degree that shifts over time. Hard rules sit alongside it: always block attachments known to carry malware, never send the company's payroll emails to the spam folder.

      Use that split when you design a system of your own. If something must hold every single time, or a law spells it out exactly, write a rule. If the answer is a judgment that depends on patterns in lots of examples, learn it. The history of AI didn't replace rules with statistics; it taught us which job each is good at.
    bridges: []
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - expert-to-statistical.s1
        - expert-to-statistical.s2
        - expert-to-statistical.s3
        - expert-to-statistical.s4
        - expert-to-statistical.s5
        - expert-to-statistical.s6
        - expert-to-statistical.check
      gate_refs:
        - gate.core
  scene_aliases:
    expert-to-statistical.recap: expert-to-statistical.check
assessment_families:
  - id: expert-to-statistical.base
    objective_ref: objective.expert-to-statistical
    task: base
    response_type: single_choice
    points: 1
    hint: 'Watch the maintenance problem: trace the inputs, operation, and result before choosing.'
    remediation_scene: expert-to-statistical.s2
    variants:
      - id: expert-to-statistical.base.1
        prompt: What is knowledge engineering concerned with?
        options:
          - id: c
            text: Only streaming model tokens
          - id: a
            text: Eliciting, representing, and maintaining domain knowledge
          - id: b
            text: Only increasing a processor clock
        answer: a
        feedback: The knowledge base needs creation and upkeep beyond an inference engine.
        retired: true
      - id: expert-to-statistical.base.2
        prompt: What does statistical learning estimate from examples?
        options:
          - id: a
            text: A model or its parameters under a chosen objective
          - id: b
            text: A guarantee that all future examples match
          - id: c
            text: Every stakeholder’s values automatically
        answer: a
        feedback: Data supports fitting under assumptions and a defined task.
        retired: true
  - id: expert-to-statistical.transfer
    objective_ref: objective.expert-to-statistical
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Choose what should be learned: trace the inputs, operation, and result before choosing.'
    remediation_scene: expert-to-statistical.s4
    variants:
      - id: expert-to-statistical.transfer.1
        prompt: A legal eligibility rule is fixed but demand varies with observations. What combination is reasonable conceptually?
        options:
          - id: a
            text: Explicit eligibility checks with learned demand estimates
          - id: b
            text: Replace the rule with an unexplained correlation
          - id: c
            text: Ignore all observations
        answer: a
        feedback: Different components can serve stable constraints and uncertain prediction.
        retired: true
      - id: expert-to-statistical.transfer.2
        prompt: A learned classifier replaces many manual rules. What work remains?
        options:
          - id: b
            text: Nothing once training finishes
          - id: c
            text: Only choosing a catchy name
          - id: a
            text: Data quality, validation, monitoring, and task design
        answer: a
        feedback: Learning shifts engineering work rather than removing it.
        retired: true
  - id: expert-to-statistical.base.v2
    objective_ref: objective.expert-to-statistical
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: expert-to-statistical.s3
    variants:
      - prompt: A specialist writes the condition that triggers a repair inspection. Where does this rule come from?
        answer: a
        options:
          - id: b
            text: A fitted weight selected from labeled inspections
          - id: c
            text: The program’s choice of a rule during execution
          - id: a
            text: Explicitly represented specialist knowledge
        feedback: Authoring the rule and applying an existing rule are different steps.
        id: expert-to-statistical.base.v2.1
        retired: true
      - prompt: A delivery weight is chosen by comparing predictions against recorded times. Which process supplies the weight?
        answer: a
        options:
          - id: c
            text: Applying a fixed rule without comparing examples
          - id: a
            text: Statistical fitting from examples
          - id: b
            text: Directly copying a specialist’s written constraint
        feedback: The estimate is chosen using an objective and observations.
        id: expert-to-statistical.base.v2.2
        retired: true
      - prompt: A system chooses which stored condition-and-action rule applies to the current facts. What is that step?
        answer: a
        options:
          - id: a
            text: Applying rules with an inference procedure
          - id: b
            text: Collecting the examples for a later statistical fit
          - id: c
            text: Writing all the domain knowledge for the first time
        feedback: Rule application uses knowledge already represented in the system.
        id: expert-to-statistical.base.v2.3
        retired: true
      - prompt: A route combines learned travel time with a written height restriction. How should these be described?
        answer: a
        options:
          - id: b
            text: Two names for the same fitted travel-time weight
          - id: c
            text: Evidence that the restriction was learned from travel times
          - id: a
            text: Different methods handling different parts of one task
        feedback: A hybrid system can combine estimates with explicit constraints.
        id: expert-to-statistical.base.v2.4
        retired: true
  - id: expert-to-statistical.transfer.v2
    objective_ref: objective.expert-to-statistical
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: expert-to-statistical.s3
    variants:
      - prompt: A product changes but the expert-system rules do not. What should be examined?
        answer: a
        options:
          - id: b
            text: Whether the old rules remain readable in a programming language
          - id: c
            text: Whether using rules makes new evidence unnecessary
          - id: a
            text: Whether the rules still describe the new product
        feedback: Readable and logically applied rules can become outdated.
        id: expert-to-statistical.transfer.v2.1
        retired: true
      - prompt: A fitted predictor moves into a new delivery area. What needs testing?
        answer: a
        options:
          - id: c
            text: Whether a past good fit establishes the new area’s performance
          - id: a
            text: Whether the learned relationships carry to the new conditions
          - id: b
            text: Whether its stored weight has the same filename
        feedback: Statistical estimates depend on the conditions represented by their evidence.
        id: expert-to-statistical.transfer.v2.2
        retired: true
      - prompt: A training dataset is large but omits hill trips. What does its size fail to establish?
        answer: a
        options:
          - id: a
            text: Accuracy on the omitted hill conditions
          - id: b
            text: That it contains recorded examples
          - id: c
            text: That a fitting procedure can read the stored values
        feedback: The number of examples does not ensure coverage of relevant situations.
        id: expert-to-statistical.transfer.v2.3
        retired: true
      - prompt: A rule explanation is easy to follow, but a required observation is missing. What should happen?
        answer: a
        options:
          - id: b
            text: Treat the clear explanation as a substitute for that observation
          - id: c
            text: Assume the missing condition holds because a rule mentions it
          - id: a
            text: Keep the conclusion conditional until the needed fact is established
        feedback: Transparent reasoning still depends on supported premises.
        id: expert-to-statistical.transfer.v2.4
        retired: true
  - id: expert-to-statistical.base.v3
    objective_ref: objective.expert-to-statistical
    task: base
    response_type: single_choice
    points: 1
    hint: Ask where each rule or number came from. In an expert system, people wrote the rules and the engine only applies them; in statistical learning, the numbers are counted or fitted from examples.
    remediation_scene: expert-to-statistical.s2
    variants:
      - id: expert-to-statistical.base.v3.1
        prompt: 'Rules: R1 "unknown sender and a link → suspicious"; R2 "suspicious and asks for a password → phishing." An email from an unknown sender asks for a password but has no link. What does forward chaining conclude?'
        options:
          - id: a
            text: Phishing, since the password request is the key sign
          - id: b
            text: Suspicious, since one of R1's two conditions holds
          - id: c
            text: Nothing, since R1 never fires and R2 needs its result
        answer: c
        feedback: R1 needs both conditions, so "suspicious" is never added and R2 can't fire. The engine only applies the rules as written; it can't notice that a human would call this phishing.
      - id: expert-to-statistical.base.v3.2
        prompt: An expert system for diagnosing car-engine faults has 900 rules. Where did those rules most likely come from?
        options:
          - id: a
            text: Knowledge engineers writing down what mechanics told them
          - id: b
            text: The inference engine creating new rules as it runs
          - id: c
            text: Fitting a model to thousands of past repair records
        answer: a
        feedback: Expert systems get their rules from people through knowledge engineering. The inference engine applies rules but doesn't author them, and fitting to records would make it a statistical model instead.
      - id: expert-to-statistical.base.v3.3
        prompt: '"Winner" appears in 40 of 200 spam emails and in 4 of 200 normal emails. How many times more common is it in spam?'
        options:
          - id: a
            text: 36 times more common
          - id: b
            text: 10 times more common
          - id: c
            text: 0.1 times as common
        answer: b
        feedback: 40/200 = 20% of spam and 4/200 = 2% of normal mail, and 20% ÷ 2% = 10. Subtracting the counts (40 − 4 = 36) measures a difference, not how many times more common; 0.1 flips the ratio.
      - id: expert-to-statistical.base.v3.4
        prompt: XCON worked well for years, yet it was expensive to keep running. What made its upkeep so costly?
        options:
          - id: a
            text: Its rules had to be retrained on new order data each week
          - id: b
            text: Each new product meant experts revising and rechecking rules
          - id: c
            text: Its inference engine ran slower as its computers aged
        answer: b
        feedback: The knowledge lived in thousands of hand-written rules, so every product change meant people rewriting and testing them. Nothing was retrained, because XCON didn't learn from data.
  - id: expert-to-statistical.transfer.v3
    objective_ref: objective.expert-to-statistical
    task: transfer
    response_type: single_choice
    points: 1
    hint: Write a rule when something must hold every time or is spelled out exactly; learn from data when the answer is a judgment that depends on patterns. Either way, ask what upkeep it needs when the world changes.
    remediation_scene: expert-to-statistical.s6
    variants:
      - id: expert-to-statistical.transfer.v3.1
        prompt: A company builds software to calculate income tax owed. The tax law states each rate and deduction exactly and changes every year. Which approach fits the calculation best?
        options:
          - id: a
            text: Written rules that follow the law, updated each year
          - id: b
            text: A model fitted to last year's completed tax returns
          - id: c
            text: A spam-style score for how likely each return is right
        answer: a
        feedback: The law spells the calculation out exactly, so explicit rules can follow it precisely and be updated when it changes. A model fitted to last year's returns would learn last year's law, including its mistakes.
      - id: expert-to-statistical.transfer.v3.2
        prompt: A spam filter trained on 2020 emails lets through many 2025 scams that use new wording. Which fix targets this failure?
        options:
          - id: a
            text: Retrain it on more of the 2020 emails for extra accuracy
          - id: b
            text: Swap it for keyword rules written from the 2020 scams
          - id: c
            text: Collect and label recent emails, then retrain on them
        answer: c
        feedback: The counts went stale because scams changed, so the filter needs fresh labeled examples. More 2020 data, or rules written from 2020 scams, would still describe the old tricks.
      - id: expert-to-statistical.transfer.v3.3
        prompt: A hospital uses a learned model to score patients' infection risk, plus a hard rule never to suggest a drug to a patient allergic to it. Why keep the allergy check as a rule?
        options:
          - id: a
            text: It has to hold every time, which a learned score can't promise
          - id: b
            text: Learned models are unable to use medical records as input
          - id: c
            text: The rule makes the learned risk scores more accurate
        answer: a
        feedback: The allergy check is a must-not that has to hold without exception, so it belongs in an explicit rule. The learned model handles the judgment call (risk), and the rule doesn't change its accuracy.
      - id: expert-to-statistical.transfer.v3.4
        prompt: In tests, MYCIN's antibiotic advice was rated about as good as specialists'. Why was it never used in routine patient care?
        options:
          - id: a
            text: Later studies found most of its advice was wrong
          - id: b
            text: Practical, legal, and workflow hurdles blocked daily use
          - id: c
            text: Statistical programs had already replaced it in hospitals
        answer: b
        feedback: Performing well in a test and fitting into a hospital's daily work are different problems. Entering data took time, responsibility for its advice was unclear, and it sat outside the normal workflow; statistical tools didn't replace it in the 1970s and 1980s.
