assessment_families:
- id: expert-to-statistical.base
  objective_ref: objective.expert-to-statistical
  task: base
  response_type: single_choice
  points: 1
  hint: 'Watch the maintenance problem: trace the inputs, operation, and result before choosing.'
  remediation_scene: expert-to-statistical.s2
  variants:
  - id: expert-to-statistical.base.1
    prompt: What is knowledge engineering concerned with?
    options:
    - id: c
      text: Only streaming model tokens
    - id: a
      text: Eliciting, representing, and maintaining domain knowledge
    - id: b
      text: Only increasing a processor clock
    answer: a
    feedback: The knowledge base needs creation and upkeep beyond an inference engine.
    retired: true
  - id: expert-to-statistical.base.2
    prompt: What does statistical learning estimate from examples?
    options:
    - id: a
      text: A model or its parameters under a chosen objective
    - id: b
      text: A guarantee that all future examples match
    - id: c
      text: Every stakeholder’s values automatically
    answer: a
    feedback: Data supports fitting under assumptions and a defined task.
    retired: true
- id: expert-to-statistical.transfer
  objective_ref: objective.expert-to-statistical
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Choose what should be learned: trace the inputs, operation, and result before choosing.'
  remediation_scene: expert-to-statistical.s4
  variants:
  - id: expert-to-statistical.transfer.1
    prompt: A legal eligibility rule is fixed but demand varies with observations. What combination is reasonable
      conceptually?
    options:
    - id: a
      text: Explicit eligibility checks with learned demand estimates
    - id: b
      text: Replace the rule with an unexplained correlation
    - id: c
      text: Ignore all observations
    answer: a
    feedback: Different components can serve stable constraints and uncertain prediction.
    retired: true
  - id: expert-to-statistical.transfer.2
    prompt: A learned classifier replaces many manual rules. What work remains?
    options:
    - id: b
      text: Nothing once training finishes
    - id: c
      text: Only choosing a catchy name
    - id: a
      text: Data quality, validation, monitoring, and task design
    answer: a
    feedback: Learning shifts engineering work rather than removing it.
    retired: true
- id: expert-to-statistical.base.v2
  objective_ref: objective.expert-to-statistical
  task: base
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: expert-to-statistical.s3
  variants:
  - prompt: A specialist writes the condition that triggers a repair inspection. Where does this rule come
      from?
    answer: a
    options:
    - id: b
      text: A fitted weight selected from labeled inspections
    - id: c
      text: The program’s choice of a rule during execution
    - id: a
      text: Explicitly represented specialist knowledge
    feedback: Authoring the rule and applying an existing rule are different steps.
    id: expert-to-statistical.base.v2.1
  - prompt: A delivery weight is chosen by comparing predictions against recorded times. Which process supplies
      the weight?
    answer: a
    options:
    - id: c
      text: Applying a fixed rule without comparing examples
    - id: a
      text: Statistical fitting from examples
    - id: b
      text: Directly copying a specialist’s written constraint
    feedback: The estimate is chosen using an objective and observations.
    id: expert-to-statistical.base.v2.2
  - prompt: A system chooses which stored condition-and-action rule applies to the current facts. What is that
      step?
    answer: a
    options:
    - id: a
      text: Applying rules with an inference procedure
    - id: b
      text: Collecting the examples for a later statistical fit
    - id: c
      text: Writing all the domain knowledge for the first time
    feedback: Rule application uses knowledge already represented in the system.
    id: expert-to-statistical.base.v2.3
  - prompt: A route combines learned travel time with a written height restriction. How should these be described?
    answer: a
    options:
    - id: b
      text: Two names for the same fitted travel-time weight
    - id: c
      text: Evidence that the restriction was learned from travel times
    - id: a
      text: Different methods handling different parts of one task
    feedback: A hybrid system can combine estimates with explicit constraints.
    id: expert-to-statistical.base.v2.4
- id: expert-to-statistical.transfer.v2
  objective_ref: objective.expert-to-statistical
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: expert-to-statistical.s3
  variants:
  - prompt: A product changes but the expert-system rules do not. What should be examined?
    answer: a
    options:
    - id: b
      text: Whether the old rules remain readable in a programming language
    - id: c
      text: Whether using rules makes new evidence unnecessary
    - id: a
      text: Whether the rules still describe the new product
    feedback: Readable and logically applied rules can become outdated.
    id: expert-to-statistical.transfer.v2.1
  - prompt: A fitted predictor moves into a new delivery area. What needs testing?
    answer: a
    options:
    - id: c
      text: Whether a past good fit establishes the new area’s performance
    - id: a
      text: Whether the learned relationships carry to the new conditions
    - id: b
      text: Whether its stored weight has the same filename
    feedback: Statistical estimates depend on the conditions represented by their evidence.
    id: expert-to-statistical.transfer.v2.2
  - prompt: A training dataset is large but omits hill trips. What does its size fail to establish?
    answer: a
    options:
    - id: a
      text: Accuracy on the omitted hill conditions
    - id: b
      text: That it contains recorded examples
    - id: c
      text: That a fitting procedure can read the stored values
    feedback: The number of examples does not ensure coverage of relevant situations.
    id: expert-to-statistical.transfer.v2.3
  - prompt: A rule explanation is easy to follow, but a required observation is missing. What should happen?
    answer: a
    options:
    - id: b
      text: Treat the clear explanation as a substitute for that observation
    - id: c
      text: Assume the missing condition holds because a rule mentions it
    - id: a
      text: Keep the conclusion conditional until the needed fact is established
    feedback: Transparent reasoning still depends on supported premises.
    id: expert-to-statistical.transfer.v2.4
