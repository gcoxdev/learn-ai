schema_version: 0.2-draft
lesson:
  id: prompting-in-practice
  version: 0.1.0-draft
  title: "Prompting in practice: instructions, examples, and step-by-step requests"
  state: draft
  summary: Mei runs a small bakery and asks a chat assistant for help. Her first prompts get bland, wrong, or made-up answers. Six small rewrites fix them, and each one works for your prompts too.
  slot: M21.9
  category: learning
  archetype: foundation
  sources:
    - title: "Language Models are Few-Shot Learners (Brown et al., 2020)"
      url: https://arxiv.org/abs/2005.14165
    - title: "Training language models to follow instructions with human feedback (Ouyang et al., 2022)"
      url: https://arxiv.org/abs/2203.02155
    - title: "Chain-of-Thought Prompting Elicits Reasoning in Large Language Models (Wei et al., 2022)"
      url: https://arxiv.org/abs/2201.11903
    - title: "Large Language Models are Zero-Shot Reasoners (Kojima et al., 2022)"
      url: https://arxiv.org/abs/2205.11916
    - title: Prompt engineering guide (OpenAI)
      url: https://developers.openai.com/api/docs/guides/prompt-engineering
    - title: Prompt engineering overview (Anthropic)
      url: https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/overview
objectives:
  - id: objective.prompting-in-practice
    version: 1-draft
    statement: A prompt is the model's only information about your situation. Clear instructions, standing rules in a system prompt, examples, requests for working, a stated output format, and supplied source text make answers more useful, and the answers still need checking.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - prompting-in-practice.base
      - prompting-in-practice.transfer
    prerequisites:
      - anyOf:
          - objective.ai-systems
scenes:
  - id: prompting-in-practice.s1
    title: The model only knows what you tell it
    type: explanation
    depth: intuition
    objective_refs:
      - objective.prompting-in-practice
    markdown: |-
      Mei runs Crumb & Co., a small bakery. She types into a chat assistant: *"Write something about our new bread."* Back comes 200 words about "artisanal loaves crafted with passion" that could describe any bakery.

      The assistant had nothing else to go on. A chat model works by continuing the text it's given, and it was trained on many examples of following instructions. It can't see Mei's shop or read her mind. So the prompt is the model's *only* information about Mei, her bread, and what she wants. Anything she leaves out, it fills in with something generic.

      | Before | After |
      | --- | --- |
      | Write something about our new bread. | Write an Instagram caption, under 40 words, announcing our new sourdough rye. It's baked Saturdays only, from 7 a.m., \$6.50 a loaf. Friendly tone, one emoji at most, end with #CrumbAndCo. |

      The rewrite names the **task** (a caption), the **audience and format** (Instagram, under 40 words), and the **facts** (Saturdays, \$6.50). A good test is to ask whether a new employee could do the job from your message alone. If not, the model can't either.
  - id: prompting-in-practice.s2
    title: Set the rules once with a system prompt
    type: explanation
    depth: intuition
    objective_refs:
      - objective.prompting-in-practice
    markdown: |-
      Mei adds a chat helper to her website. On day one, it cheerfully promises a customer a wedding cake by tomorrow. Crumb & Co. needs two weeks' notice.

      Rules that apply to every conversation belong in a **system prompt**: instructions sent ahead of every conversation and marked as coming from the system, not the customer. Customers don't see it in the chat.

      | Before | After (system prompt) |
      | --- | --- |
      | *(none)* | You are the order assistant for Crumb & Co., a bakery in Leeds. Answer only questions about our products, prices, hours, and orders. Facts: open Tue–Sun 7 a.m.–3 p.m.; custom cakes need 14 days' notice. If you're unsure, say you'll pass the question to Mei. |

      The first sentence is a **role**: it tells the model whose voice to use and what job it's doing. The rest sets its scope, gives it facts, and says what to do when it doesn't know.

      :::mixup "If I tell the model it's a world-class baker, it will know more about baking."
      A role shapes tone and focus, not knowledge. The helper knows the notice period because the prompt says "14 days," not because it was called an expert.
      :::
  - id: prompting-in-practice.s3
    title: Show the style with examples
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.prompting-in-practice
    markdown: |-
      Mei wants product descriptions in her house style: short, warm, one detail you can taste or smell, and the price last. When she *describes* that style, the results come out stiff. So she *shows* it instead:

      > Here are two descriptions in our style:
      >
      > **Cinnamon knot:** Buttery, twisted, and dusted with cinnamon sugar that crackles when you bite. \$3.20
      >
      > **Seeded rye:** Dark, chewy, and nutty from toasted sunflower seeds. \$6.50
      >
      > Now write one for: **Lemon drizzle loaf** (lemon zest, syrup soaked, sold by the slice, \$2.80)

      Putting a few examples in the prompt is called **few-shot prompting**. The GPT-3 paper (Brown et al., 2020) showed that large models can pick up a task from a handful of examples like this, with no retraining.

      The model copies *everything* about examples: length, structure, even topic. If all of Mei's examples are breads, a cake may come out bread-like, so vary what doesn't matter and keep consistent what does.
  - id: prompting-in-practice.s4
    title: Ask for the working when there's arithmetic
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.prompting-in-practice
    markdown: |-
      A wedding quote: 150 guests, one and a half cupcakes each, \$3.25 per cupcake, 10% off orders over 200 cupcakes, packed in boxes of 12.

      | Before | After |
      | --- | --- |
      | How much will this order cost? | Work this out step by step, showing each calculation, then give the total and number of boxes on the last line. |

      The "after" prompt gets something Mei can check:

      1. Cupcakes: 150 × 1.5 = 225
      2. Before discount: 225 × \$3.25 = \$731.25
      3. Over 200, so 10% off: \$731.25 × 0.9 = \$658.13 (rounded)
      4. Boxes: 225 ÷ 12 = 18.75, so 19 boxes

      Asking for step-by-step working is called **chain-of-thought prompting** (the first lesson of this module explains why it works). It often improves accuracy on multi-step problems. And even with models that already reason before answering, visible steps let *you* check the work.

      :::predict Which step would you check first?
      Step 3, where a rule applies: 225 is over 200, so the discount is right. Then rerun the multiplications on a calculator. Written steps turn "trust me" into four things you can check in a minute.
      :::
  - id: prompting-in-practice.s5
    title: Ask for a format your tools can read
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.prompting-in-practice
    markdown: |-
      Mei wants order emails copied into her spreadsheet automatically. A spreadsheet needs the same fields, in the same shape, every time.

      | Before | After |
      | --- | --- |
      | Summarize this order email. | Extract the order as JSON matching this schema. Use `null` for anything the email doesn't say. Output only the JSON. |

      The schema she includes:

      ```json
      {"customer": "string",
       "items": [{"name": "string", "quantity": "integer"}],
       "pickup_date": "YYYY-MM-DD or null"}
      ```

      For *"Hi, it's Sam Ortiz, could I get 2 seeded ryes and 6 cinnamon knots? Thanks!"* the model returns `{"customer": "Sam Ortiz", "items": [{"name": "seeded rye", "quantity": 2}, {"name": "cinnamon knot", "quantity": 6}], "pickup_date": null}`.

      Asking for **structured output**, data in a fixed format such as JSON with a stated schema, makes answers easy for programs to use and to check. The `null` rule stops the model inventing a pickup date. Several AI providers also offer a setting that forces replies to match a schema exactly.
  - id: prompting-in-practice.s6
    title: Give it the source, then check the answer
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.prompting-in-practice
    markdown: |-
      A customer asks, *"Does the almond croissant contain sesame?"* The model answers from what croissants usually contain: "No." But Mei's is topped with a sesame-almond crunch.

      For facts that matter, paste the source and ask the model to **quote** it:

      | Before | After |
      | --- | --- |
      | Does the almond croissant contain sesame? | Answer using only the ingredient list below. Quote the line you relied on. If the list doesn't say, reply "Not listed; please ask our staff." *[ingredient list pasted here]* |

      Now the model reads instead of guessing, and anyone can check the quote against the list.

      That's the last habit, and the most important: **check the output**. Search for each quote in the source, make sure the JSON loads, and rerun the arithmetic. Before going live, Mei tries five questions she knows the answers to, including one the list doesn't cover. The helper answers the four listed ones correctly and replies to the fifth with "Not listed; please ask our staff," which is exactly what it should say.
    diagram:
      caption: Everything in Mei's final setup. Each piece of the prompt answers a question the model couldn't answer on its own.
      description: A system prompt with rules and facts, a few examples of the house style, pasted source text such as the ingredient list, and the customer's question all go into the model. The model's reply goes to a check, where quotes are searched for in the source, JSON is parsed, and totals are recomputed. If the check passes, the reply is sent. If it fails, Mei fixes the prompt and tries again.
      nodes:
        - id: system
          label: System prompt
          note: role, scope, facts, what to do if unsure
          col: 0
          row: 0
        - id: examples
          label: Examples
          note: two or three in house style
          col: 0
          row: 1
        - id: source
          label: Source text
          note: e.g. ingredient list
          col: 0
          row: 2
          tone: data
        - id: question
          label: Customer's question
          col: 0
          row: 3
        - id: model
          label: Chat model
          col: 2
          row: 1
          tone: accent
        - id: check
          label: Check the reply
          note: quote found? JSON loads? sums right?
          col: 3
          row: 1
          tone: warn
        - id: send
          label: Send the reply
          col: 4
          row: 1
      edges:
        - from: system
          to: model
        - from: examples
          to: model
        - from: source
          to: model
        - from: question
          to: model
        - from: model
          to: check
        - from: check
          to: send
          label: passes
        - from: check
          to: system
          label: fails, so fix the prompt
          dashed: true
          bend: 2
  - id: prompting-in-practice.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.prompting-in-practice
    markdown: More of Mei's bakery prompts, then a dentist's office, a history teacher, a gardening club, and a landlord, test whether you can pick the rewrite that fixes each problem.
    takeaway: |-
      The model knows only what your prompt tells it. State the task and facts, put standing rules in a system prompt, show examples, ask for working and for a format you can use, give it the source to quote, and check what comes back.
  - id: prompting-in-practice.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.prompting-in-practice
    markdown: |-
      Write prompts a new employee could act on: the task, the facts, the format, and the source. Then check the answer before you use it.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - prompting-in-practice.s1
        - prompting-in-practice.s2
        - prompting-in-practice.s3
        - prompting-in-practice.s4
        - prompting-in-practice.s5
        - prompting-in-practice.s6
        - prompting-in-practice.check
      gate_refs:
        - gate.core
  scene_aliases:
    prompting-in-practice.recap: prompting-in-practice.check
assessment_families:
  - id: prompting-in-practice.base
    objective_ref: objective.prompting-in-practice
    task: base
    response_type: single_choice
    points: 1
    hint: Name what the model was missing (the task, a standing rule, the style, the working, a format, or the source), then pick the rewrite that supplies exactly that.
    remediation_scene: prompting-in-practice.s1
    variants:
      - id: prompting-in-practice.base.1
        prompt: Mei asks, "Write something about our bread," and gets a generic 200-word blurb that could describe any bakery. Which change would help most?
        options:
          - id: b
            text: Ask the same question again, since the next try may be better
          - id: a
            text: Say which bread, where it's posted, how long, and the key facts
          - id: c
            text: Add "Be creative and do your best work" to the end of the request
        answer: a
        feedback: The model can only use what's in the prompt, so the missing task, format, and facts must be added. Asking again draws from the same empty picture, and encouragement adds no information.
      - id: prompting-in-practice.base.2
        prompt: Mei wants her website helper to stay on bakery topics and give her real opening hours in every chat. Where do these standing rules belong?
        options:
          - id: c
            text: In each customer's first message, typed by the customer
          - id: b
            text: In the model's weights, by retraining it on her rules
          - id: a
            text: In a system prompt that's sent before every conversation
        answer: a
        feedback: A system prompt carries rules and facts that apply to every conversation, without the customer seeing them. Customers won't type Mei's rules, and retraining is far more work than writing the rules down once.
      - id: prompting-in-practice.base.3
        prompt: Mei's product descriptions keep coming out long and formal, though she wants them short and warm. Which prompt change fits best?
        options:
          - id: a
            text: Include two or three of her own descriptions as examples
          - id: b
            text: Tell the model "You are the world's greatest copywriter"
          - id: c
            text: Ask for "a description like before, but make it better"
        answer: a
        feedback: A style is easier to show than to describe, and the model copies what examples do. A grand role doesn't say which style she wants, and "better" gives it nothing to aim for.
      - id: prompting-in-practice.base.4
        prompt: A catering quote involves a quantity per guest, a unit price, and a discount rule. How should Mei ask for it?
        options:
          - id: c
            text: Ask for just the final total, to keep the reply short and clean
          - id: a
            text: Ask it to show each calculation step, so she can check them
          - id: b
            text: Ask it to be extremely careful with the numbers it uses
        answer: a
        feedback: Written steps often improve accuracy on multi-step problems, and they let Mei spot a slip, such as a discount applied wrongly. A bare total hides mistakes, and "be careful" doesn't give her anything to check.
      - id: prompting-in-practice.base.5
        prompt: A customer asks the helper whether the almond croissant contains sesame. Which prompt gives the most reliable answer?
        options:
          - id: b
            text: Ask it to use what it knows about typical croissant recipes
          - id: c
            text: Ask it to answer with confidence so the customer feels reassured
          - id: a
            text: Paste the ingredient list and ask it to quote the line it used
        answer: a
        feedback: With the real list in the prompt, the model reads instead of guessing, and the quote can be checked. Typical recipes aren't Mei's recipe (hers has a sesame crunch), and a confident tone doesn't make an answer right.
      - id: prompting-in-practice.base.6
        prompt: Mei's order spreadsheet needs each email turned into a customer name, a list of items, and a pickup date. What should her prompt ask for?
        options:
          - id: a
            text: JSON that matches a stated schema, with null for missing fields
          - id: b
            text: A friendly paragraph that sums up what the customer ordered
          - id: c
            text: A bullet list of the details in whatever order seems natural
        answer: a
        feedback: A fixed schema gives the spreadsheet the same fields every time, and the null rule stops the model inventing a pickup date. A paragraph or free-form list would need a person to retype it.
  - id: prompting-in-practice.transfer
    objective_ref: objective.prompting-in-practice
    task: transfer
    response_type: single_choice
    points: 1
    hint: "Ask the new-employee question: could someone new do this job from the prompt alone? Then check what the model can't know unless you give it."
    remediation_scene: prompting-in-practice.s6
    variants:
      - id: prompting-in-practice.transfer.1
        prompt: A dentist's receptionist asks an assistant to "write an appointment reminder" and gets a long, vague message. What should she add?
        options:
          - id: c
            text: A note that this message is very important to get right
          - id: a
            text: The date, time, clinic name, a length limit, and the tone
          - id: b
            text: A request to make the message sound more human and natural
        answer: a
        feedback: The model can't know the appointment details or the right length unless the prompt says so. Saying it matters, or asking it to sound human, adds no facts.
      - id: prompting-in-practice.transfer.2
        prompt: 'A teacher starts a prompt with "You are an expert historian" and asks about the founding of her small town, which is barely covered online. What should she expect?'
        options:
          - id: a
            text: The role sets the style, but she needs to supply the local facts
          - id: b
            text: The role unlocks detailed knowledge the model would otherwise hold back
          - id: c
            text: The role makes the model refuse to answer anything it's unsure of
        answer: a
        feedback: A role shapes voice and focus; it adds no knowledge. For little-documented local history, the model may produce plausible but invented details, so she should paste her sources and ask it to quote them.
      - id: prompting-in-practice.transfer.3
        prompt: A gardening club asks an assistant to label member questions by topic. It returns inconsistent labels like "Bug problem," "Pests," and "Insects?" What is the best fix?
        options:
          - id: b
            text: Ask it to try harder to be consistent from now on
          - id: c
            text: Let it invent labels freely and merge them by hand later
          - id: a
            text: List the exact labels allowed and show a few labeled examples
        answer: a
        feedback: A fixed list of labels plus examples shows exactly what counts as each topic. "Try harder" gives no new information, and merging by hand is the work the club wanted to avoid.
      - id: prompting-in-practice.transfer.4
        prompt: A landlord wants the rent, start date, and tenant names pulled from each new lease and fed into a program. What should the prompt ask for?
        options:
          - id: a
            text: JSON with those named fields, then a check that it loads
          - id: b
            text: A short paragraph that summarizes each of the lease terms
          - id: c
            text: The key facts in bold, so that they are easy to spot
        answer: a
        feedback: A program needs the same named fields every time, and checking that the JSON loads catches malformed replies. Paragraphs and bold text suit a person reading, not a program.
      - id: prompting-in-practice.transfer.5
        prompt: An HR assistant answers policy questions and quotes the staff handbook. How can HR quickly catch answers the assistant made up?
        options:
          - id: c
            text: Ask the assistant whether each of its answers is accurate
          - id: b
            text: Trust any answer that includes a quote, since it names a source
          - id: a
            text: Search the handbook for each quoted line
        answer: a
        feedback: A quote is useful because it can be checked; a made-up quote won't be found in the handbook. Asking the assistant to grade itself gets more generated text, and a quote-shaped answer isn't evidence until it's found.
      - id: prompting-in-practice.transfer.6
        prompt: A shop owner gives three example product titles, all about mugs and all under five words. New titles for T-shirts come out short and oddly mug-like. What happened?
        options:
          - id: a
            text: The model copied the examples' patterns, including their length and topic
          - id: b
            text: The model paid attention to the first example and skipped the rest
          - id: c
            text: Examples tend to confuse the model, so instructions alone work better
        answer: a
        feedback: Few-shot examples teach everything they share, wanted or not. Varying the examples' products while keeping the style consistent fixes it. Examples work well when they're chosen with that in mind.
