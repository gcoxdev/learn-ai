schema_version: 0.2-draft
lesson:
  id: training-and-inference
  version: 0.4.0-draft
  title: 'Training and inference: changing a rule or using it'
  state: draft
  summary: Does a chatbot learn from you while you talk? Use the snack model to see the difference between changing a model and simply using it.
  slot: M00.6
  category: common
  sources:
    - title: Dive into Deep Learning — linear regression
      url: https://d2l.ai/chapter_linear-regression/linear-regression.html
  archetype: foundation
objectives:
  - id: objective.training-and-inference
    version: 3-draft
    statement: Training changes a model using a learning objective; inference applies its current parameters to an input. A product can combine both at different times.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - training-and-inference.base
      - training-and-inference.transfer.v3
    prerequisites:
      - anyOf:
          - objective.weights-and-predictions
scenes:
  - id: training-and-inference.s1
    title: Did it just learn from me?
    type: explanation
    depth: intuition
    objective_refs:
      - objective.training-and-inference
    markdown: |-
      You ask a chat assistant for things to do in Paris. It suggests the Eiffel Tower. You reply, "Sorry, I meant Paris, Texas." Now it suggests local spots in Texas. Did it just *learn* something?

      Hold that question; you'll be able to answer it by the end of this lesson. First, notice that there are two very different things you can do with a model:

      | Job | What changes | Snack example |
      | --- | --- | --- |
      | Use the model | Only the input | Weight stays 2; ask about 3 guests, then 4 |
      | Change the model | The weights | Adjust the weight to fit notes from past parties |

      These two jobs have names, and mixing them up causes a lot of confusion about AI.
  - id: training-and-inference.s2
    title: Inference means using the model
    type: explanation
    depth: intuition
    objective_refs:
      - objective.training-and-inference
    markdown: |-
      **Inference** means using a model to get an output from an input. With weight 2 and 3 guests, the snack model gives 6 crackers. Ask about 4 guests and it gives 8. The weight is still 2 after both questions.

      It's like cooking from a recipe. You can make the dish a hundred times, and the recipe card doesn't change. Every time you type a message into a chat assistant or search your photos for "dog," the model is doing inference with weights that were set long before you opened it.
  - id: training-and-inference.s3
    title: Training means adjusting the model
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.training-and-inference
    markdown: |-
      **Training** is adjusting a model's weights so its predictions match examples better. Say your party notes show:

      | Guests | Crackers actually eaten |
      | --- | ---: |
      | 2 | 6 |
      | 3 | 9 |

      With weight 2, the model predicts 4 and 6, both too low. With weight 3, it predicts 6 and 9, matching both notes. Picking weight 3 because it fits the examples is a tiny training run.

      Try it below: first change the number of guests and watch the rule stay put (inference). Then fit the rule to the two examples (training) and watch the weight change.
    figure:
      kind: training-inference
      caption: Use a fixed snack rule, then compare candidate weights against the two supplied examples.
      description: With two crackers per guest, three guests predict six crackers. The supplied examples instead show two guests eating six and three eating nine; fitting the weight to three matches both.
  - id: training-and-inference.s4
    title: Measure the misses, keep the best
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.training-and-inference
    markdown: |-
      To train, a computer needs a number that says how wrong a weight is. That number is the **loss**. Ours is the *total miss*: for each note, how far the prediction is from what was eaten, added up. Lower is better.

      :::predict With weight 2, the predictions are 4 and 6, but the guests ate 6 and 9. What is the total miss?
      The misses are 6 − 4 = 2 and 9 − 6 = 3, so the loss is 2 + 3 = 5. For weight 3 the loss is 0.
      :::

      The **optimizer** is the procedure that uses the loss to choose better weights. Ours is simple: try several weights and keep the one with the lowest loss. This short program does exactly that:

      ```python run
      notes = [(2, 6), (3, 9)]
      for weight in [1, 2, 3, 4]:
          loss = 0
          for guests, eaten in notes:
              loss = loss + abs(weight * guests - eaten)
          print("weight", weight, "total miss", loss)
      ```

      - `notes` holds the two parties as (guests, crackers eaten).
      - The outer `for` tries weights 1, 2, 3, and 4.
      - The inner `for` goes through both notes. `abs(...)` turns a miss into a positive number, so being 3 too high counts the same as being 3 too low.
      - `print` shows each weight's loss.

      It prints totals of 10, 5, 0, and 5, so weight 3 wins. Big models can't try every setting for billions of weights. Instead, their optimizers nudge all the weights a tiny step in whichever direction lowers the loss, over and over. You'll see how in the neural-network lessons.
  - id: training-and-inference.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.training-and-inference
    markdown: Snack parties, weather forecasts, photo searches, and chatbots that seem to remember you ask whether a model is being changed or just used.
    takeaway: |-
      Training changes a model's weights to fit examples, guided by a loss. Inference uses the model as it is, so a new message can change the answer without changing the model.
  - id: training-and-inference.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.training-and-inference
    markdown: |-
      Training changes a model using a learning objective; inference applies its current parameters to an input. A product can combine both at different times.
  - id: training-and-inference.s5
    title: So did the chatbot learn from you?
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.training-and-inference
    markdown: |-
      Back to Paris, Texas. When you chat with an assistant, the whole conversation so far is sent to the model as part of its input each time it replies. The information a model receives for one request is called its **context**.

      Your correction changed the context, not the weights. It's like telling the snack model "actually, 4 guests": a new input, the same rule.

      :::mixup "A chatbot learns from our conversation as we talk."
      During a chat, the model's weights don't change. Start a brand-new chat and the correction is gone, unless the product saved a note about it and quietly adds that note to the context. Some companies may later use conversations as examples in a separate training run, weeks or months afterward, depending on the product and your settings. That is a different job, done at a different time.
      :::
  - id: training-and-inference.s6
    title: Trace both jobs on paper
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.training-and-inference
    markdown: |-
      Write two rows and circle what changes in each:

      | Job | Given | What happens | What changes |
      | --- | --- | --- | --- |
      | Training | Notes: 2 guests ate 6, 3 ate 9 | Try weights, keep the lowest loss | The weight becomes 3 |
      | Inference | 5 guests | 3 × 5 | Nothing: out comes 15 |

      Training chose the rule; inference used it. Real AI products work the same way. A company trains a model for weeks, then millions of people use it for inference every day.

      Weight 3 fits the two parties it was trained on perfectly. Whether it works for *new* parties is a separate question, and the next lesson shows how to answer it.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - training-and-inference.s1
        - training-and-inference.s2
        - training-and-inference.s3
        - training-and-inference.s4
        - training-and-inference.s5
        - training-and-inference.s6
        - training-and-inference.check
      gate_refs:
        - gate.core
  scene_aliases:
    training-and-inference.recap: training-and-inference.check
assessment_families:
  - id: training-and-inference.base
    objective_ref: objective.training-and-inference
    task: base
    response_type: single_choice
    points: 1
    hint: "Ask one question: did a weight change? If examples and a loss were used to pick a new weight, that's training. If the same weight was just used on an input, that's inference."
    remediation_scene: training-and-inference.s3
    variants:
      - id: training-and-inference.base.1
        prompt: A fixed weight 4 multiplies input 2. Which stage produced 8?
        options:
          - id: c
            text: Dataset annotation
          - id: a
            text: Inference
          - id: b
            text: An obligatory training update
        answer: a
        feedback: Applying current parameters is inference; the multiplication alone does not update them.
        retired: true
      - id: training-and-inference.base.2
        prompt: An optimizer changes a weight after comparing a prediction with a target. What occurred?
        options:
          - id: a
            text: A training update
          - id: b
            text: Only a cache read
          - id: c
            text: Only token decoding
        answer: a
        feedback: The objective supplied feedback that changed the parameter.
        retired: true
      - id: training-and-inference.base.v2.1
        prompt: Weight 2 stays fixed while a request changes from three guests to four. Which job is illustrated?
        options:
          - id: c
            text: Editing the model’s weight
          - id: a
            text: Inference on a new input
          - id: b
            text: Training on a new target
        answer: a
        feedback: "The weight stayed at 2 while the guest count changed, so the model was just being used: inference. Training would have changed the weight."
      - id: training-and-inference.base.v2.2
        prompt: Two candidate weights are compared against recorded cracker totals, and one is selected. Which job is illustrated?
        options:
          - id: a
            text: Training a small model
          - id: b
            text: Displaying a stored answer
          - id: c
            text: Receiving an unchanged input
        answer: a
        feedback: The examples guide a choice of model setting.
        retired: true
      - id: training-and-inference.base.v2.3
        prompt: A prediction is 4 and the observed target is 6. What is their distance ignoring direction?
        options:
          - id: b
            text: '10'
          - id: c
            text: '6'
          - id: a
            text: '2'
        answer: a
        feedback: "The miss is the gap between 4 and 6: 6 − 4 = 2. Adding the two numbers (10) or taking the target alone (6) doesn't measure how far off the prediction was."
      - id: training-and-inference.base.v2.4
        prompt: Which description fits the optimizer in this lesson?
        options:
          - id: c
            text: The input supplied by a new guest group
          - id: a
            text: The procedure that chooses weight adjustments
          - id: b
            text: The observed answer used for comparison
        answer: a
        feedback: "The optimizer is the procedure that uses the loss to pick better weights. The observed answer used for comparison is the target, and a new guest count is just an input."
      - id: training-and-inference.base.v2.5
        prompt: A saved model with fixed settings receives a new photo and names its color. Which job is happening?
        options:
          - id: a
            text: Training
          - id: b
            text: Recording the correct training target
          - id: c
            text: Inference
        answer: c
        feedback: "The model's settings stayed fixed while it named a new photo's color, so this is inference. Training would change the settings, and nothing here records a correct answer."
      - id: training-and-inference.base.v2.6
        prompt: A procedure compares several weights using recorded outcomes and keeps the best-fitting one. What is it doing?
        options:
          - id: a
            text: Training the toy model
          - id: b
            text: Using an unchanged model for a new request
          - id: c
            text: Displaying a target without comparing it
        answer: a
        feedback: Choosing settings using examples is the training job. Later requests can use the selected settings for inference.
        retired: true
      - id: training-and-inference.base.v3.1
        prompt: Party notes say 2 guests ate 8 crackers and 3 guests ate 12. Someone tries weights 3 and 4, adds up the misses for each, and keeps weight 4. Which job is this?
        options:
          - id: a
            text: Inference, since it made predictions for each party
          - id: c
            text: Collecting data, since it used notes about parties
          - id: b
            text: Training, since it chose a weight to fit examples
        answer: b
        feedback: Comparing weights against recorded examples and keeping the one with the smallest loss is training. Predictions were made along the way, but the point was to choose the weight, not to answer a new question.
      - id: training-and-inference.base.v3.2
        prompt: With weight 4, a snack model predicts 8 and 12 crackers for two parties where guests actually ate 6 and 9. What is the total miss (the loss)?
        options:
          - id: c
            text: "5"
          - id: a
            text: "3"
          - id: b
            text: "20"
        answer: c
        feedback: The misses are 8 − 6 = 2 and 12 − 9 = 3, and the loss adds them up to 5. Counting only the bigger miss (3) leaves out one party, and 20 is just the two predictions added together.
  - id: training-and-inference.transfer
    objective_ref: objective.training-and-inference
    task: transfer
    response_type: single_choice
    points: 1
    hint: "A new message or instruction changes the model's input (its context), not its weights. Look for evidence that a separate training step actually ran before concluding the model learned."
    remediation_scene: training-and-inference.s3
    variants:
      - id: training-and-inference.transfer.1
        prompt: A chatbot follows a new instruction in its context. What can you conclude?
        options:
          - id: a
            text: Its input changed; parameter learning is not established
          - id: b
            text: Every parameter was retrained
          - id: c
            text: The instruction entered every future user’s model
        answer: a
        feedback: Context-dependent behavior is compatible with unchanged parameters.
        retired: true
      - id: training-and-inference.transfer.2
        prompt: A service records user ratings and retrains nightly. When do those ratings change model weights?
        options:
          - id: b
            text: At the instant any page is viewed
          - id: c
            text: Whenever an answer is streamed
          - id: a
            text: When the training pipeline uses them for updates
        answer: a
        feedback: Recording data and optimizing model parameters are separate operations.
        retired: true
      - id: training-and-inference.transfer.v2.1
        prompt: After choosing weight 3, what does inference predict for five guests?
        options:
          - id: a
            text: 15 crackers
          - id: b
            text: 8 crackers
          - id: c
            text: 9 crackers
        answer: a
        feedback: Five groups of three make fifteen.
        retired: true
      - id: training-and-inference.transfer.v2.2
        prompt: A writing helper changes its reply after you clarify the request. Which explanation is supported by that observation?
        options:
          - id: b
            text: The reply changed, so the stored weights must have changed
          - id: c
            text: The new message became a saved training example immediately
          - id: a
            text: The information in the request changed
        answer: a
        feedback: The changed context can explain a changed reply without establishing a weight update.
        retired: true
      - id: training-and-inference.transfer.v2.3
        prompt: Which row belongs in the training record?
        options:
          - id: c
            text: A stored weight used for an incoming request
          - id: a
            text: Observed examples and chosen model settings
          - id: b
            text: A new question and its displayed answer
        answer: a
        feedback: Training records explain which examples and adjustments produced a model.
        retired: true
      - id: training-and-inference.transfer.v2.4
        prompt: A weight fits two snack notes. What question remains for testing?
        options:
          - id: a
            text: How it predicts for other groups
          - id: b
            text: Whether repeating the same two notes gives a good fit
          - id: c
            text: Whether displaying both fitted notes establishes its accuracy
        answer: a
        feedback: Fitting the examples used for selection does not establish performance elsewhere.
        retired: true
      - id: training-and-inference.transfer.v2.5
        prompt: A frozen snack model has weight 4. A new request contains 3 guests. What happens during inference?
        options:
          - id: a
            text: It predicts 12 without changing the weight
          - id: b
            text: It saves 3 as the new weight and predicts 9
          - id: c
            text: It records 12 as the observed amount eaten
        answer: a
        feedback: Inference uses 3 × 4 = 12. A predicted amount is not an observation, and using the model need not update it.
        retired: true
      - id: training-and-inference.transfer.v2.6
        prompt: An assistant gives a shorter answer after receiving “please be brief.” What does this observation establish?
        options:
          - id: a
            text: Its stored weights were updated
          - id: b
            text: Its supplied context changed
          - id: c
            text: The new instruction became a training dataset
        answer: b
        feedback: A changed request can change the output of a fixed model. The observation alone does not show training.

        retired: true
  - id: training-and-inference.transfer.v3
    objective_ref: objective.training-and-inference
    task: transfer
    response_type: single_choice
    points: 1
    hint: "A new message or instruction changes the model's input (its context), not its weights. The weights change only when a separate training run fits them to examples."
    remediation_scene: training-and-inference.s5
    variants:
      - id: training-and-inference.transfer.v3.1
        prompt: 'You tell a translation assistant, "Use formal Spanish, please." Its next reply switches to formal Spanish. What most likely changed?'
        options:
          - id: a
            text: Its weights, which updated to learn your preference
          - id: c
            text: Its training data, which now includes your message
          - id: b
            text: Its input, since your request is now in the context
        answer: b
        feedback: Your request became part of the context the model reads before each reply, so the output changed while the weights stayed put. Changing the weights or the training data would take a separate training run.
      - id: training-and-inference.transfer.v3.2
        prompt: You correct a chatbot's wrong fact, and it fixes its answer. Then you open a brand-new chat, with no saved notes, and ask the same question. What happens to your correction?
        options:
          - id: c
            text: The new chat starts over without it
          - id: a
            text: The new chat remembers it from last time
          - id: b
            text: Every user now gets the corrected answer
        answer: c
        feedback: The correction lived in the first chat's context, not in the weights, so a fresh chat starts without it. It would carry over only if the product saved a note or a later training run used the conversation.
      - id: training-and-inference.transfer.v3.3
        prompt: A weather company spends a week adjusting its model's weights so its forecasts fit a year of new records. After that, every morning, it runs the model on that day's readings. Which part is training?
        options:
          - id: a
            text: The week spent fitting the weights to the records
          - id: b
            text: Each morning's run on that day's new readings
          - id: c
            text: Showing each forecast to people on their phones
        answer: a
        feedback: Training changes the weights to fit examples, which is what that week did. The morning runs use the finished weights on new inputs, which is inference, and showing the forecast is the interface's job.
      - id: training-and-inference.transfer.v3.4
        prompt: A photo app's model was trained on millions of labeled photos. Today you search your photos for "beach" 50 times. How many times did the model's weights change during your searches?
        options:
          - id: b
            text: "50"
          - id: a
            text: "1"
          - id: c
            text: "0"
        answer: c
        feedback: Each search is inference, which uses the weights on a new input without changing them. Fifty searches are fifty uses of the same weights, not fifty updates.
      - id: training-and-inference.transfer.v3.5
        prompt: A shop's price-estimating model was fitted to last year's sales. A shopper asks it for an estimate and gets one. Later, the owner refits the model on this year's sales. Which event changed the model?
        options:
          - id: a
            text: The shopper's request for a price estimate
          - id: b
            text: The owner's refit on this year's sales
          - id: c
            text: Both events, since each one used the model
        answer: b
        feedback: Refitting to new examples is training, so it changes the weights. The shopper's request only used the model for inference, and using a model doesn't change it.
      - id: training-and-inference.transfer.v3.6
        prompt: 'A company says, "We improve our assistant using conversations from users who opt in." When does that improvement to the model happen?'
        options:
          - id: c
            text: Instantly, as you type each message to it
          - id: b
            text: While your conversation window stays open
          - id: a
            text: In a later training run, separate from chats
        answer: a
        feedback: Conversations can become examples for a separate training run, weeks or months later. During the chat itself the weights don't change, so the improvement isn't happening as you type.
