assessment_families:
- id: training-and-inference.base
  objective_ref: objective.training-and-inference
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
  remediation_scene: training-and-inference.s3
  variants:
  - id: training-and-inference.base.1
    prompt: A fixed weight 4 multiplies input 2. Which stage produced 8?
    options:
    - id: c
      text: Dataset annotation
    - id: a
      text: Inference
    - id: b
      text: An obligatory training update
    answer: a
    feedback: Applying current parameters is inference; the multiplication alone does not update them.
    retired: true
  - id: training-and-inference.base.2
    prompt: An optimizer changes a weight after comparing a prediction with a target. What occurred?
    options:
    - id: a
      text: A training update
    - id: b
      text: Only a cache read
    - id: c
      text: Only token decoding
    answer: a
    feedback: The objective supplied feedback that changed the parameter.
    retired: true
  - id: training-and-inference.base.v2.1
    prompt: Weight 2 stays fixed while a request changes from three guests to four. Which job is illustrated?
    options:
    - id: c
      text: Editing the model’s weight
    - id: a
      text: Inference on a new input
    - id: b
      text: Training on a new target
    answer: a
    feedback: The rule is being used again; no stored weight was changed.
  - id: training-and-inference.base.v2.2
    prompt: Two candidate weights are compared against recorded cracker totals, and one is selected. Which
      job is illustrated?
    options:
    - id: a
      text: Training a small model
    - id: b
      text: Displaying a stored answer
    - id: c
      text: Receiving an unchanged input
    answer: a
    feedback: The examples guide a choice of model setting.
  - id: training-and-inference.base.v2.3
    prompt: A prediction is 4 and the observed target is 6. What is their distance ignoring direction?
    options:
    - id: b
      text: '10'
    - id: c
      text: '6'
    - id: a
      text: '2'
    answer: a
    feedback: The gap between four and six is two.
  - id: training-and-inference.base.v2.4
    prompt: Which description fits the optimizer in this lesson?
    options:
    - id: c
      text: The input supplied by a new guest group
    - id: a
      text: The procedure that chooses weight adjustments
    - id: b
      text: The observed answer used for comparison
    answer: a
    feedback: The optimizer chooses adjustments; the target supplies the comparison value.
  - id: training-and-inference.base.v2.5
    prompt: A saved model with fixed settings receives a new photo and names its color. Which job is happening?
    options:
    - id: a
      text: Training
    - id: b
      text: Recording the correct training target
    - id: c
      text: Inference
    answer: c
    feedback: Inference uses the current model. This description does not include changing its settings.
  - id: training-and-inference.base.v2.6
    prompt: A procedure compares several weights using recorded outcomes and keeps the best-fitting one. What
      is it doing?
    options:
    - id: a
      text: Training the toy model
    - id: b
      text: Using an unchanged model for a new request
    - id: c
      text: Displaying a target without comparing it
    answer: a
    feedback: Choosing settings using examples is the training job. Later requests can use the selected settings
      for inference.
- id: training-and-inference.transfer
  objective_ref: objective.training-and-inference
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
  remediation_scene: training-and-inference.s3
  variants:
  - id: training-and-inference.transfer.1
    prompt: A chatbot follows a new instruction in its context. What can you conclude?
    options:
    - id: a
      text: Its input changed; parameter learning is not established
    - id: b
      text: Every parameter was retrained
    - id: c
      text: The instruction entered every future user’s model
    answer: a
    feedback: Context-dependent behavior is compatible with unchanged parameters.
    retired: true
  - id: training-and-inference.transfer.2
    prompt: A service records user ratings and retrains nightly. When do those ratings change model weights?
    options:
    - id: b
      text: At the instant any page is viewed
    - id: c
      text: Whenever an answer is streamed
    - id: a
      text: When the training pipeline uses them for updates
    answer: a
    feedback: Recording data and optimizing model parameters are separate operations.
    retired: true
  - id: training-and-inference.transfer.v2.1
    prompt: After choosing weight 3, what does inference predict for five guests?
    options:
    - id: a
      text: 15 crackers
    - id: b
      text: 8 crackers
    - id: c
      text: 9 crackers
    answer: a
    feedback: Five groups of three make fifteen.
  - id: training-and-inference.transfer.v2.2
    prompt: A writing helper changes its reply after you clarify the request. Which explanation is supported
      by that observation?
    options:
    - id: b
      text: The reply changed, so the stored weights must have changed
    - id: c
      text: The new message became a saved training example immediately
    - id: a
      text: The information in the request changed
    answer: a
    feedback: The changed context can explain a changed reply without establishing a weight update.
  - id: training-and-inference.transfer.v2.3
    prompt: Which row belongs in the training record?
    options:
    - id: c
      text: A stored weight used for an incoming request
    - id: a
      text: Observed examples and chosen model settings
    - id: b
      text: A new question and its displayed answer
    answer: a
    feedback: Training records explain which examples and adjustments produced a model.
  - id: training-and-inference.transfer.v2.4
    prompt: A weight fits two snack notes. What question remains for testing?
    options:
    - id: a
      text: How it predicts for other groups
    - id: b
      text: Whether repeating the same two notes gives a good fit
    - id: c
      text: Whether displaying both fitted notes establishes its accuracy
    answer: a
    feedback: Fitting the examples used for selection does not establish performance elsewhere.
  - id: training-and-inference.transfer.v2.5
    prompt: A frozen snack model has weight 4. A new request contains 3 guests. What happens during inference?
    options:
    - id: a
      text: It predicts 12 without changing the weight
    - id: b
      text: It saves 3 as the new weight and predicts 9
    - id: c
      text: It records 12 as the observed amount eaten
    answer: a
    feedback: Inference uses 3 × 4 = 12. A predicted amount is not an observation, and using the model need
      not update it.
  - id: training-and-inference.transfer.v2.6
    prompt: An assistant gives a shorter answer after receiving “please be brief.” What does this observation
      establish?
    options:
    - id: a
      text: Its stored weights were updated
    - id: b
      text: Its supplied context changed
    - id: c
      text: The new instruction became a training dataset
    answer: b
    feedback: A changed request can change the output of a fixed model. The observation alone does not show
      training.
