schema_version: 0.2-draft
lesson:
  id: training-and-inference
  version: 0.3.0-draft
  title: 'Training and inference: changing a rule or using it'
  state: draft
  summary: Use the snack model to see why giving a new input and changing a weight are different jobs.
  slot: M00.6
  category: common
  sources:
  - title: Dive into Deep Learning — linear regression
    url: https://d2l.ai/chapter_linear-regression/linear-regression.html
  archetype: foundation
objectives:
- id: objective.training-and-inference
  version: 2-draft
  statement: Training changes a model using a learning objective; inference applies its current parameters
    to an input. A product can combine both at different times.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - training-and-inference.base
  - training-and-inference.transfer
  prerequisites:
  - anyOf:
    - objective.weights-and-predictions
scenes:
- id: training-and-inference.s1
  title: Two jobs with familiar parts
  type: explanation
  depth: intuition
  objective_refs:
  - objective.training-and-inference
  markdown: Our snack model has an input, the number of guests, and a weight, the number of crackers per guest.
    It multiplies them to predict the crackers needed. We can use the current weight to answer a question,
    or we can change the weight to make the rule fit examples better. Using the rule is called inference. Adjusting
    it from examples is called training. Let’s follow each process.
  text_mode: Our snack model has an input, the number of guests, and a weight, the number of crackers per guest.
    It multiplies them to predict the crackers needed. We can use the current weight to answer a question,
    or we can change the weight to make the rule fit examples better. Using the rule is called inference. Adjusting
    it from examples is called training. Let’s follow each process.
- id: training-and-inference.s2
  title: Inference means using the current model
  type: explanation
  depth: intuition
  objective_refs:
  - objective.training-and-inference
  markdown: '**Inference** means using a model to produce a result from an input. With weight 2 and input 3
    guests, our model produces 6 crackers. With input 4 guests, it produces 8. The weight stays 2 for both
    requests. Think of using the current recipe to make another batch of food. The word inference has other
    meanings in ordinary reasoning; in this lesson we mean this model-use step.'
  text_mode: '**Inference** means using a model to produce a result from an input. With weight 2 and input
    3 guests, our model produces 6 crackers. With input 4 guests, it produces 8. The weight stays 2 for both
    requests. Think of using the current recipe to make another batch of food. The word inference has other
    meanings in ordinary reasoning; in this lesson we mean this model-use step.'
- id: training-and-inference.s3
  title: Training means adjusting the model
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-and-inference
  markdown: '**Training** is the process of adjusting a model using examples and a chosen goal. Suppose we
    have two notes: 2 guests ate 6 crackers, and 3 guests ate 9. Weight 2 predicts 4 and 6, both too low. Weight
    3 predicts 6 and 9, matching the notes. Choosing the better weight from those examples is a tiny training
    procedure. Bigger models need more organized ways to make such adjustments.'
  text_mode: '**Training** is the process of adjusting a model using examples and a chosen goal. Suppose we
    have two notes: 2 guests ate 6 crackers, and 3 guests ate 9. Weight 2 predicts 4 and 6, both too low. Weight
    3 predicts 6 and 9, matching the notes. Choosing the better weight from those examples is a tiny training
    procedure. Bigger models need more organized ways to make such adjustments.'
  figure:
    kind: training-inference
    caption: Use a fixed snack rule, then compare candidate weights against the two supplied examples.
    description: With two crackers per guest, three guests predict six crackers. The supplied examples instead
      show two guests eating six and three eating nine; fitting the weight to three matches both.
- id: training-and-inference.s4
  title: Say what better means
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-and-inference
  markdown: A **loss** is a number measuring a chosen kind of mistake. For now, measure how far the snack prediction
    is from the observed answer, ignoring which side the miss is on. Predicting 4 when the target is 6 has
    a mistake size of 2. An **optimizer** is a procedure that uses a measure such as loss to choose adjustments
    to the model. Our simple procedure tries two weights and keeps the better one. Later we will study methods
    for many weights.
  text_mode: A **loss** is a number measuring a chosen kind of mistake. For now, measure how far the snack
    prediction is from the observed answer, ignoring which side the miss is on. Predicting 4 when the target
    is 6 has a mistake size of 2. An **optimizer** is a procedure that uses a measure such as loss to choose
    adjustments to the model. Our simple procedure tries two weights and keeps the better one. Later we will
    study methods for many weights.
- id: training-and-inference.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.training-and-inference
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Training adjusts a model using examples and a chosen measure of success. Inference uses the model
    as it currently stands to produce an answer.
- id: training-and-inference.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.training-and-inference
  markdown: Training changes a model using a learning objective; inference applies its current parameters to
    an input. A product can combine both at different times.
  text_mode: Training changes a model using a learning objective; inference applies its current parameters
    to an input. A product can combine both at different times.
- id: training-and-inference.s5
  title: A conversation can change without training
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-and-inference
  markdown: The word **context** means information available for a particular request. A conversation so far
    can be context. If you first ask for snacks for three guests and then correct that to four, you changed
    the input information. The same weight gives a different answer. Likewise, adding an instruction to a writing
    helper can change its response without changing its weights. A service might separately use saved examples
    for later training, but a changed reply alone does not show that happened.
  text_mode: The word **context** means information available for a particular request. A conversation so far
    can be context. If you first ask for snacks for three guests and then correct that to four, you changed
    the input information. The same weight gives a different answer. Likewise, adding an instruction to a writing
    helper can change its response without changing its weights. A service might separately use saved examples
    for later training, but a changed reply alone does not show that happened.
- id: training-and-inference.s6
  title: Trace both jobs on paper
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-and-inference
  markdown: 'Write two rows. In the training row, put the observed guest counts and cracker totals, the candidate
    weights, and the chosen weight. In the inference row, use the chosen weight 3 with a new guest count 5:
    the prediction is 15 crackers. Circle what changed in each row. Training selected a rule; inference used
    it. A model that fits these snack notes could still misestimate a different group, which is why testing
    is a separate job.'
  text_mode: 'Write two rows. In the training row, put the observed guest counts and cracker totals, the candidate
    weights, and the chosen weight. In the inference row, use the chosen weight 3 with a new guest count 5:
    the prediction is 15 crackers. Circle what changed in each row. Training selected a rule; inference used
    it. A model that fits these snack notes could still misestimate a different group, which is why testing
    is a separate job.'
