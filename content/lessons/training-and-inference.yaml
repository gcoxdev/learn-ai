schema_version: 0.2-draft
lesson:
  id: training-and-inference
  version: 0.1.0-draft
  title: Learning a rule, then using it
  state: draft
  summary: Training changes a model using a learning objective; inference applies its current parameters to an input.
    A product can combine both at different times.
  slot: M00.3
  category: common
  minutes: 12
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.training-and-inference
  version: 1-draft
  statement: Training changes a model using a learning objective; inference applies its current parameters to an
    input. A product can combine both at different times.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - training-and-inference.base
  - training-and-inference.transfer
  prerequisites:
  - anyOf:
    - objective.ai-systems
scenes:
- id: training-and-inference.s1
  title: Two different jobs
  type: explanation
  depth: intuition
  objective_refs:
  - objective.training-and-inference
  markdown: Imagine a thermostat with a dial you can adjust. Choosing a better setting and using the current setting
    are different jobs. In machine learning, training adjusts parameters using data and an objective. Inference
    computes a result using the parameters currently available. A parameter is a stored number that influences the
    computation.
  text_mode: Imagine a thermostat with a dial you can adjust. Choosing a better setting and using the current setting
    are different jobs. In machine learning, training adjusts parameters using data and an objective. Inference
    computes a result using the parameters currently available. A parameter is a stored number that influences the
    computation.
  bridges: []
- id: training-and-inference.s2
  title: Follow a small prediction
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-and-inference
  markdown: 'Our toy model predicts twice the input: prediction = weight × input, with weight initially 2. Input
    3 gives prediction 6. If the training target is 9, an optimizer might change the weight toward 3. That update
    belongs to training. Predicting 12 for a later input of 4 with weight 3 belongs to inference.'
  text_mode: 'Our toy model predicts twice the input: prediction = weight × input, with weight initially 2. Input
    3 gives prediction 6. If the training target is 9, an optimizer might change the weight toward 3. That update
    belongs to training. Predicting 12 for a later input of 4 with weight 3 belongs to inference.'
  bridges: []
- id: training-and-inference.s3
  title: A chat message can change context
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-and-inference
  markdown: Adding a message to a conversation changes the input context. The model may answer differently even
    though its parameters remain fixed. Saving that message in an external database changes application memory.
    Neither operation, by itself, is a gradient update. Online learning is possible, but requires an actual update
    procedure.
  text_mode: Adding a message to a conversation changes the input context. The model may answer differently even
    though its parameters remain fixed. Saving that message in an external database changes application memory.
    Neither operation, by itself, is a gradient update. Online learning is possible, but requires an actual update
    procedure.
  bridges: []
- id: training-and-inference.s4
  title: Ask which state changed
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-and-inference
  markdown: Trace a system by marking parameters, temporary activations, conversation history, and external records
    separately. During training, computations and gradients lead to parameter updates. During ordinary inference,
    temporary computation produces outputs. Later use of collected interactions for training is a separate pipeline
    whose existence cannot be inferred just from the chat interface.
  text_mode: Trace a system by marking parameters, temporary activations, conversation history, and external records
    separately. During training, computations and gradients lead to parameter updates. During ordinary inference,
    temporary computation produces outputs. Later use of collected interactions for training is a separate pipeline
    whose existence cannot be inferred just from the chat interface.
  bridges: []
- id: training-and-inference.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.training-and-inference
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: training-and-inference.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.training-and-inference
  markdown: Training changes a model using a learning objective; inference applies its current parameters to an
    input. A product can combine both at different times.
  text_mode: Training changes a model using a learning objective; inference applies its current parameters to an
    input. A product can combine both at different times.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - training-and-inference.s1
    - training-and-inference.s2
    - training-and-inference.s3
    - training-and-inference.s4
    - training-and-inference.check
    - training-and-inference.recap
    gate_refs:
