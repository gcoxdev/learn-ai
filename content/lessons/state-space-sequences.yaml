schema_version: 0.2-draft
lesson:
  id: state-space-sequences
  version: 0.3.0-draft
  title: Represent a sequence through an evolving hidden state
  state: draft
  summary: Carry a compact sequence state forward and unpack the weighted history it represents.
  slot: M19.4
  category: learning
  sources:
  - title: Efficiently Modeling Long Sequences with Structured State Spaces
    url: https://arxiv.org/abs/2111.00396
objectives:
- id: objective.state-space-sequences
  version: 1-draft
  statement: State-space sequence models update a latent state and read outputs from it; continuous-to-discrete
    choices, stable dynamics, and structured computation determine their practical behavior.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - state-space-sequences.base
  - state-space-sequences.transfer
  prerequisites:
  - anyOf:
    - objective.recurrent-networks
  - anyOf:
    - objective.dynamics-and-noise
scenes:
- id: state-space-sequences.s1
  title: Update a compact memory
  type: explanation
  depth: intuition
  objective_refs:
  - objective.state-space-sequences
  markdown: 'Let x be the current input, h the hidden state, and y the output. The index t counts time steps.
    A simple state-space model updates the state and reads an output using:


    h_t = A h_previous + B x_t


    y_t = C h_t + D x_t


    A controls how the old state carries forward; B controls how the new input enters. C reads the state, while
    D permits a direct input contribution. These are matrices in the general case. The next example uses ordinary
    numbers so we can calculate each step by hand.'
  text_mode: 'Let x be the current input, h the hidden state, and y the output. The index t counts time steps.
    A simple state-space model updates the state and reads an output using:


    h_t = A h_previous + B x_t


    y_t = C h_t + D x_t


    A controls how the old state carries forward; B controls how the new input enters. C reads the state, while
    D permits a direct input contribution. These are matrices in the general case. The next example uses ordinary
    numbers so we can calculate each step by hand.'
  bridges: []
- id: state-space-sequences.s2
  title: Trace scalar dynamics
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.state-space-sequences
  markdown: Let h_t = 0.5 h_previous + x_t with initial state zero and inputs two, zero, zero. States become
    two, one, and one-half. The older input decays. Different dynamics can retain information longer or become
    unstable; learned parameters must support the useful timescales.
  text_mode: Let h_t = 0.5 h_previous + x_t with initial state zero and inputs two, zero, zero. States become
    two, one, and one-half. The older input decays. Different dynamics can retain information longer or become
    unstable; learned parameters must support the useful timescales.
  bridges:
  - dynamics-and-noise
- id: state-space-sequences.s3
  title: Unpack the state into a weighted history
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.state-space-sequences
  markdown: '**Time-invariant** means the same linear coefficients apply at every step. Starting from zero,
    substitute the toy rule into itself: h₂ = 0.5x₁ + x₂, then h₃ = 0.25x₁ + 0.5x₂ + x₃. Earlier inputs contribute
    through repeated factors.


    For a linear time-invariant system with suitable initial-state handling, this weighted history can be computed
    as a convolution over earlier inputs. That allows a parallel training calculation, while recurrence updates
    one state at a time during inference. Structured matrices can make either form more efficient.'
  text_mode: '**Time-invariant** means the same linear coefficients apply at every step. Starting from zero,
    substitute the toy rule into itself: h₂ = 0.5x₁ + x₂, then h₃ = 0.25x₁ + 0.5x₂ + x₃. Earlier inputs contribute
    through repeated factors.


    For a linear time-invariant system with suitable initial-state handling, this weighted history can be computed
    as a convolution over earlier inputs. That allows a parallel training calculation, while recurrence updates
    one state at a time during inference. Structured matrices can make either form more efficient.'
  bridges: []
- id: state-space-sequences.s4
  title: Discretize with care
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.state-space-sequences
  markdown: 'Some models begin from continuous-time dynamics and choose a step size and discretization rule.
    The resulting recurrence determines numerical stability and timescale interpretation. A state-space model’s
    compact memory differs from attention’s explicit token cache, with consequences for retrieval and long-context
    tasks.


    **Discretization** turns a continuously changing mathematical state into updates at distinct time steps.
    The dynamics-and-noise bridge introduces this idea. A larger time step may make the numerical approximation
    less accurate or unstable, even when the continuous equation looks well behaved.'
  text_mode: 'Some models begin from continuous-time dynamics and choose a step size and discretization rule.
    The resulting recurrence determines numerical stability and timescale interpretation. A state-space model’s
    compact memory differs from attention’s explicit token cache, with consequences for retrieval and long-context
    tasks.


