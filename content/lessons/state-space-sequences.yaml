schema_version: 0.2-draft
lesson:
  id: state-space-sequences
  version: 0.1.0-draft
  title: Represent a sequence through an evolving hidden state
  state: draft
  summary: State-space sequence models update a latent state and read outputs from it; continuous-to-discrete choices,
    stable dynamics, and structured computation determine their practical behavior.
  slot: M19.4
  category: learning
  minutes: 12
  sources:
  - title: Efficiently Modeling Long Sequences with Structured State Spaces
    url: https://arxiv.org/abs/2111.00396
objectives:
- id: objective.state-space-sequences
  version: 1-draft
  statement: State-space sequence models update a latent state and read outputs from it; continuous-to-discrete
    choices, stable dynamics, and structured computation determine their practical behavior.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - state-space-sequences.base
  - state-space-sequences.transfer
  prerequisites:
  - anyOf:
    - objective.recurrent-networks
  - anyOf:
    - objective.dynamics-and-noise
scenes:
- id: state-space-sequences.s1
  title: Update a compact memory
  type: explanation
  depth: intuition
  objective_refs:
  - objective.state-space-sequences
  markdown: A simple discrete state-space model uses h_t = A h_previous + B x_t and y_t = C h_t + D x_t. The state
    summarizes previous inputs; matrices control retention, input influence, and readout. These symbols describe
    an operation you can execute one step at a time.
  text_mode: A simple discrete state-space model uses h_t = A h_previous + B x_t and y_t = C h_t + D x_t. The state
    summarizes previous inputs; matrices control retention, input influence, and readout. These symbols describe
    an operation you can execute one step at a time.
  bridges: []
- id: state-space-sequences.s2
  title: Trace scalar dynamics
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.state-space-sequences
  markdown: Let h_t = 0.5 h_previous + x_t with initial state zero and inputs two, zero, zero. States become two,
    one, and one-half. The older input decays. Different dynamics can retain information longer or become unstable;
    learned parameters must support the useful timescales.
  text_mode: Let h_t = 0.5 h_previous + x_t with initial state zero and inputs two, zero, zero. States become two,
    one, and one-half. The older input decays. Different dynamics can retain information longer or become unstable;
    learned parameters must support the useful timescales.
  bridges:
  - dynamics-and-noise
- id: state-space-sequences.s3
  title: Connect recurrence and convolution
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.state-space-sequences
  markdown: For a linear time-invariant system with suitable initial-state handling, repeated substitution expresses
    outputs as a convolution over past inputs. That offers a parallel training computation while recurrence supports
    incremental inference. Structured matrices can make long-range kernels or updates efficient.
  text_mode: For a linear time-invariant system with suitable initial-state handling, repeated substitution expresses
    outputs as a convolution over past inputs. That offers a parallel training computation while recurrence supports
    incremental inference. Structured matrices can make long-range kernels or updates efficient.
  bridges: []
- id: state-space-sequences.s4
  title: Discretize with care
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.state-space-sequences
  markdown: Some models begin from continuous-time dynamics and choose a step size and discretization rule. The
    resulting recurrence determines numerical stability and timescale interpretation. A state-space model’s compact
    memory differs from attention’s explicit token cache, with consequences for retrieval and long-context tasks.
  text_mode: Some models begin from continuous-time dynamics and choose a step size and discretization rule. The
    resulting recurrence determines numerical stability and timescale interpretation. A state-space model’s compact
    memory differs from attention’s explicit token cache, with consequences for retrieval and long-context tasks.
  bridges: []
- id: state-space-sequences.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.state-space-sequences
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: state-space-sequences.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.state-space-sequences
  markdown: State-space sequence models update a latent state and read outputs from it; continuous-to-discrete choices,
    stable dynamics, and structured computation determine their practical behavior.
  text_mode: State-space sequence models update a latent state and read outputs from it; continuous-to-discrete
    choices, stable dynamics, and structured computation determine their practical behavior.
