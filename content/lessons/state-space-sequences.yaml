assessment_families:
  - id: state-space-sequences.base
    objective_ref: objective.state-space-sequences
    task: base
    response_type: single_choice
    points: 1
    hint: Multiply the old state by A, then add B times the new input.
    remediation_scene: state-space-sequences.s2
    variants:
      - id: state-space-sequences.base.1
        prompt: For h_t = 0.5 h_previous + x_t, h_previous = 2 and x_t = 0 give what?
        options:
          - id: c
            text: '0'
          - id: a
            text: '1'
          - id: b
            text: '2'
        answer: a
        feedback: The previous state is halved and no new input is added.
        retired: true
      - id: state-space-sequences.base.2
        prompt: What does the latent state represent?
        options:
          - id: a
            text: A learned summary updated over the sequence
          - id: b
            text: An exact mandatory copy of all tokens
          - id: c
            text: Only the next token ID
        answer: a
        feedback: State provides recurrent memory.
        retired: true
  - id: state-space-sequences.transfer
    objective_ref: objective.state-space-sequences
    task: transfer
    response_type: single_choice
    points: 1
    hint: The convolution view needs the same A, B, and C at every step.
    remediation_scene: state-space-sequences.s4
    variants:
      - id: state-space-sequences.transfer.1
        prompt: When can recurrence be expressed through a fixed convolution kernel?
        options:
          - id: a
            text: Under linear time-invariant assumptions with appropriate initial-state handling
          - id: b
            text: For every nonlinear input-dependent recurrence unchanged
          - id: c
            text: Only without any inputs
        answer: a
        feedback: The equivalence relies on the system’s structure.
        retired: true
      - id: state-space-sequences.transfer.2
        prompt: Why does discretization matter?
        options:
          - id: b
            text: It only renames matrices
          - id: c
            text: It guarantees perfect memory
          - id: a
            text: It affects the actual update and its stability
        answer: a
        feedback: Continuous equations require a concrete discrete implementation.
        retired: true
  - id: state-space-sequences.base.v2
    objective_ref: objective.state-space-sequences
    task: base
    response_type: single_choice
    points: 1
    hint: "Give each letter its job: A carries the old state forward, B lets the input in, C reads the state out. The kernel entry K_k is the effect of an input k steps ago."
    remediation_scene: state-space-sequences.s3
    variants:
      - id: state-space-sequences.base.v2.1
        prompt: In h_t = A h_{t−1} + B x_t and y_t = C h_t, which part sets how long an input keeps affecting later outputs?
        options:
          - id: b
            text: B, because it sets how strongly each new input enters the state
          - id: a
            text: A, because it sets how much of the old state survives each step
          - id: c
            text: C, because it sets how much of the state reaches each output
        answer: a
        feedback: Every step multiplies the old state by A, so A decides how quickly an input fades. B and C scale an input's effect up or down but don't change how fast it decays.
      - id: state-space-sequences.base.v2.2
        prompt: A scalar SSM has A = 1.2, B = 1, C = 1. It receives one input of 1, then only zeros. What happens to the output?
        options:
          - id: c
            text: It stays at 1, since no new input arrives to change it
          - id: b
            text: It fades toward 0, since later inputs are all zero
          - id: a
            text: It grows by 20% every step and never settles
        answer: a
        feedback: Each step multiplies the state by 1.2, giving 1, 1.2, 1.44, … An SSM is stable only when |A| < 1 (every eigenvalue, for a matrix). It would stay constant at A = 1 and fade for |A| < 1.
      - id: state-space-sequences.base.v2.3
        prompt: Why can a linear time-invariant SSM be trained as a convolution over the whole sequence at once?
        options:
          - id: a
            text: With the same A, B, C at every step, an input's effect depends only on how long ago it arrived
          - id: b
            text: The state is reset to zero at every step, so each output depends on one input only
          - id: c
            text: The kernel is learned as a separate set of weights, independent of A, B, and C
        answer: a
        feedback: Unrolling gives y_t = Σ K_{t−j} x_j with K_k = C A^k B, one fixed kernel slid over the inputs. The state is carried forward, not reset, and the kernel is computed from A, B, C rather than learned separately.
      - id: state-space-sequences.base.v2.4
        prompt: In the kernel K = (CB, CAB, CA²B, …), what does the entry CA²B tell you?
        options:
          - id: b
            text: How the output two steps from now will depend on today's input only
          - id: c
            text: What the state holds after exactly two inputs have been received
          - id: a
            text: How much an input from two steps ago contributes to the current output
        answer: a
        feedback: The input entered through B, was carried two steps by A twice, and was read out by C. It is a weight on the past, not a prediction or a state value.
  - id: state-space-sequences.transfer.v2
    objective_ref: objective.state-space-sequences
    task: transfer
    response_type: single_choice
    points: 1
    hint: Decide which view fits (recurrence for step-by-step use, convolution for whole sequences), and what A or Δ controls.
    remediation_scene: state-space-sequences.s4
    variants:
      - id: state-space-sequences.transfer.v2.1
        prompt: An electricity forecaster must track both an hourly rhythm and a slow weekly trend. Which SSM state design fits?
        options:
          - id: a
            text: A vector state whose A has both fast-fading and slow-fading entries
          - id: b
            text: A single state number with A close to 0, so it reacts quickly
          - id: c
            text: A single state number with a larger C, so its output is stronger
        answer: a
        feedback: Each entry of a diagonal A sets one timescale, so fast and slow entries can track both rhythms. One number has only one timescale, and C changes the output's size, not its memory.
      - id: state-space-sequences.transfer.v2.2
        prompt: An SSM is built from h′(t) = −h(t) + x(t) with zero-order hold. Its sensor used to report once per second (Δ = 1); now it reports ten times per second. What is the new per-step factor Ā?
        options:
          - id: b
            text: About 0.037, since the step shrank tenfold
          - id: a
            text: About 0.905, since Ā = e^(−0.1)
          - id: c
            text: About 0.368, since a never changed
        answer: a
        feedback: Ā = e^(Δa) = e^(−0.1) ≈ 0.905. Each step now fades less, but there are ten per second, so the memory in seconds is unchanged. 0.368 is the old Δ = 1 value.
      - id: state-space-sequences.transfer.v2.3
        prompt: A task shows a long stream of random symbols, then asks the model to repeat the symbol that followed a marker, where the marker appears at a random position. Why does an LTI SSM struggle?
        options:
          - id: c
            text: Its state is too small to hold even one symbol from the stream
          - id: b
            text: Its kernel cannot reach inputs more than a few steps back
          - id: a
            text: Its weights depend only on distance, so it can't decide what to keep
        answer: a
        feedback: An LTI kernel treats "the input 50 steps ago" the same whatever that input was, so it can't store the post-marker symbol specially. With a slow A it reaches far back, and one symbol fits easily; the problem is choosing, which Mamba's selection addresses.
      - id: state-space-sequences.transfer.v2.4
        prompt: A trained S4-style model now generates audio one sample at a time. Which way of running it is efficient?
        options:
          - id: a
            text: Update the state once per sample with the recurrence
          - id: b
            text: Recompute the convolution over the whole history at each step
          - id: c
            text: Cache each past sample's key and value, like a transformer
        answer: a
        feedback: The recurrence costs the same at every step and keeps only the state. Redoing the convolution over the growing history wastes work, and an SSM has no keys and values to cache.
  - id: state-space-sequences.kernel
    objective_ref: objective.state-space-sequences
    task: base
    response_type: numeric
    points: 1
    hint: "K_k = C × A^k × B. For an output, multiply each past input by the kernel entry for its distance and add them up."
    remediation_scene: state-space-sequences.s3
    absolute_tolerance: 0.001
    variants:
      - id: state-space-sequences.kernel.1
        prompt: A scalar SSM has A = 0.5, B = 1, C = 1. What is the kernel entry K₃ = C A³ B?
        answer: 0.125
        feedback: "0.5³ = 0.125, times B = 1 and C = 1."
      - id: state-space-sequences.kernel.2
        prompt: A scalar SSM has A = 0.8, B = 2, C = 0.5. What is the kernel entry K₂ = C A² B?
        answer: 0.64
        feedback: "0.5 × 0.8² × 2 = 0.5 × 0.64 × 2 = 0.64."
      - id: state-space-sequences.kernel.3
        prompt: An SSM has A = diag(0.5, 0.9), B = [1, 1], C = [1, 1]. What is the kernel entry K₂ = C A² B?
        answer: 1.06
        feedback: "Each state number contributes its own term: 0.5² + 0.9² = 0.25 + 0.81 = 1.06."
      - id: state-space-sequences.kernel.4
        prompt: A scalar SSM has A = 0.9, B = 1, C = 2, and starts at zero. Inputs are x₁ = 1, x₂ = 0, x₃ = 3. What is the output y₃?
        answer: 7.62
        feedback: "The kernel is K = (2, 1.8, 1.62). y₃ = K₂x₁ + K₁x₂ + K₀x₃ = 1.62 × 1 + 1.8 × 0 + 2 × 3 = 7.62."
      - id: state-space-sequences.kernel.5
        prompt: A scalar SSM has A = 0.5, B = 4, C = 1, and starts at zero. Inputs are x₁ = 1, x₂ = 1. What is the output y₂?
        answer: 6
        feedback: "K = (4, 2, …). y₂ = K₁x₁ + K₀x₂ = 2 + 4 = 6. The recurrence agrees: h₁ = 4, h₂ = 0.5 × 4 + 4 = 6."
