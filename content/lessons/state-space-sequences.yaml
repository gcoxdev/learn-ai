assessment_families:
- id: state-space-sequences.base
  objective_ref: objective.state-space-sequences
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace scalar dynamics: trace the inputs, operation, and result before choosing.'
  remediation_scene: state-space-sequences.s2
  variants:
  - id: state-space-sequences.base.1
    prompt: For h_t = 0.5 h_previous + x_t, h_previous = 2 and x_t = 0 give what?
    options:
    - id: c
      text: '0'
    - id: a
      text: '1'
    - id: b
      text: '2'
    answer: a
    feedback: The previous state is halved and no new input is added.
  - id: state-space-sequences.base.2
    prompt: What does the latent state represent?
    options:
    - id: a
      text: A learned summary updated over the sequence
    - id: b
      text: An exact mandatory copy of all tokens
    - id: c
      text: Only the next token ID
    answer: a
    feedback: State provides recurrent memory.
- id: state-space-sequences.transfer
  objective_ref: objective.state-space-sequences
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Discretize with care: trace the inputs, operation, and result before choosing.'
  remediation_scene: state-space-sequences.s4
  variants:
  - id: state-space-sequences.transfer.1
    prompt: When can recurrence be expressed through a fixed convolution kernel?
    options:
    - id: a
      text: Under linear time-invariant assumptions with appropriate initial-state handling
    - id: b
      text: For every nonlinear input-dependent recurrence unchanged
    - id: c
      text: Only without any inputs
    answer: a
    feedback: The equivalence relies on the system’s structure.
  - id: state-space-sequences.transfer.2
    prompt: Why does discretization matter?
    options:
    - id: b
      text: It only renames matrices
    - id: c
      text: It guarantees perfect memory
    - id: a
      text: It affects the actual update and its stability
    answer: a
    feedback: Continuous equations require a concrete discrete implementation.
