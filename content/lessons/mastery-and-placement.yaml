schema_version: 0.2-draft
lesson:
  id: mastery-and-placement
  version: 0.3.0-draft
  title: Practice, progress, and knowing what you understand
  state: draft
  summary: Use checks to find your next learning step, with room to make mistakes and try a different example.
  slot: M00.11
  category: common
  sources:
  - title: Dive into Deep Learning — introduction
    url: https://d2l.ai/chapter_introduction/index.html
  archetype: foundation
objectives:
- id: objective.mastery-and-placement
  version: 2-draft
  statement: Placement and mastery use evidence of applying an idea; simply viewing a slide does not demonstrate
    understanding, and compatible evidence can serve several paths.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - mastery-and-placement.base
  - mastery-and-placement.transfer
  prerequisites:
  - anyOf:
    - objective.learning-routes
scenes:
- id: mastery-and-placement.s1
  title: Recognition is a beginning
  type: explanation
  depth: intuition
  objective_refs:
  - objective.mastery-and-placement
  markdown: Seeing a word before can make it feel familiar. Using it is another step. You might recognize “weight”
    yet mix it up with the number of guests. Try explaining which part of the snack calculation stays fixed
    when the guest count changes. A **learning objective** is a statement of what you should be able to do,
    such as distinguish an input from a weight. It gives a check a clear purpose.
  text_mode: Seeing a word before can make it feel familiar. Using it is another step. You might recognize
    “weight” yet mix it up with the number of guests. Try explaining which part of the snack calculation stays
    fixed when the guest count changes. A **learning objective** is a statement of what you should be able
    to do, such as distinguish an input from a weight. It gives a check a clear purpose.
- id: mastery-and-placement.s2
  title: Practice is allowed to be supported
  type: explanation
  depth: intuition
  objective_refs:
  - objective.mastery-and-placement
  markdown: A hint can help you find the right step. A worked answer can show how a calculation fits together.
    These are useful forms of practice, not failures. If you already saw a particular answer, repeating it
    is weaker evidence that you could handle a new example by yourself. The classroom remembers which questions
    you have already seen. That lets it distinguish practice from answering a new question without help.
  text_mode: A hint can help you find the right step. A worked answer can show how a calculation fits together.
    These are useful forms of practice, not failures. If you already saw a particular answer, repeating it
    is weaker evidence that you could handle a new example by yourself. The classroom remembers which questions
    you have already seen. That lets it distinguish practice from answering a new question without help.
- id: mastery-and-placement.s3
  title: Different checks should test the same idea
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mastery-and-placement
  markdown: A **variant** is a different version of a question. A **family** groups questions that check a
    related application of an idea. For the snack rule, one family might identify inputs and weights; another
    might ask what changes in a new situation. The classroom asks for successful fresh checks from each required
    family. The revised starting lessons offer several variants so needing another try does not immediately
    use up the small bank.
  text_mode: A **variant** is a different version of a question. A **family** groups questions that check a
    related application of an idea. For the snack rule, one family might identify inputs and weights; another
    might ask what changes in a new situation. The classroom asks for successful fresh checks from each required
    family. The revised starting lessons offer several variants so needing another try does not immediately
    use up the small bank.
- id: mastery-and-placement.s4
  title: Understand what the progress label means
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mastery-and-placement
  markdown: The app uses the word mastery for meeting its current personal-study check requirements. That is
    a limited signal from draft questions, not proof that you know everything about the subject. A **placement**
    check lets someone with prior understanding demonstrate an idea without first reading every earlier lesson.
    Passing a check demonstrates that idea; related ideas still have their own checks. If a lesson’s standard
    is revised, previous attempts are kept but may not satisfy the new version.
  text_mode: The app uses the word mastery for meeting its current personal-study check requirements. That
    is a limited signal from draft questions, not proof that you know everything about the subject. A **placement**
    check lets someone with prior understanding demonstrate an idea without first reading every earlier lesson.
    Passing a check demonstrates that idea; related ideas still have their own checks. If a lesson’s standard
    is revised, previous attempts are kept but may not satisfy the new version.
- id: mastery-and-placement.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.mastery-and-placement
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Practice helps you learn. Fresh checks give limited evidence that you can use an idea. Keep that
    evidence, but do not confuse a small quiz with complete expertise.
- id: mastery-and-placement.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.mastery-and-placement
  markdown: Placement and mastery use evidence of applying an idea; simply viewing a slide does not demonstrate
    understanding, and compatible evidence can serve several paths.
  text_mode: Placement and mastery use evidence of applying an idea; simply viewing a slide does not demonstrate
    understanding, and compatible evidence can serve several paths.
- id: mastery-and-placement.s5
  title: Use mistakes to choose the next step
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mastery-and-placement
  markdown: Suppose you add weight and input when the rule calls for multiplication. Revisit the equal-groups
    example, then try different numbers. If you choose the right operation but miscount, the arithmetic bridge
    may help more than rereading the definition of a model. Describe the mistake specifically. Use your explanation
    of the mistake to choose what to practice next.
  text_mode: Suppose you add weight and input when the rule calls for multiplication. Revisit the equal-groups
    example, then try different numbers. If you choose the right operation but miscount, the arithmetic bridge
    may help more than rereading the definition of a model. Describe the mistake specifically. Use your explanation
    of the mistake to choose what to practice next.
- id: mastery-and-placement.s6
  title: Keep a record you can carry
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mastery-and-placement
  markdown: Progress is stored in this browser. A **backup** is a saved copy you can keep outside it. Export
    a backup from the progress page before moving devices or clearing browser data. The file records checks
    and reading positions; it is not a school-issued certificate. For projects, keep your written work separately
    and use the supplied review rubric. Quiz answers cannot establish the quality of a project the app has
    never seen.
  text_mode: Progress is stored in this browser. A **backup** is a saved copy you can keep outside it. Export
    a backup from the progress page before moving devices or clearing browser data. The file records checks
    and reading positions; it is not a school-issued certificate. For projects, keep your written work separately
    and use the supplied review rubric. Quiz answers cannot establish the quality of a project the app has
    never seen.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - mastery-and-placement.s1
    - mastery-and-placement.s2
    - mastery-and-placement.s3
    - mastery-and-placement.s4
    - mastery-and-placement.s5
    - mastery-and-placement.s6
    - mastery-and-placement.check
    gate_refs:
    - gate.core
  scene_aliases:
    mastery-and-placement.recap: mastery-and-placement.check
assessment_families:
- id: mastery-and-placement.base
  objective_ref: objective.mastery-and-placement
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
  remediation_scene: mastery-and-placement.s3
  variants:
  - id: mastery-and-placement.base.1
    prompt: Does reaching the final slide alone demonstrate mastery?
    options:
    - id: a
      text: No; viewing and applying an idea are different evidence
    - id: b
      text: Yes, scrolling is sufficient
    - id: c
      text: Only if the slide has an equation
    answer: a
    feedback: Knowledge checks supply evidence beyond completion of reading.
    retired: true
  - id: mastery-and-placement.base.2
    prompt: What should a hinted answer count as here?
    options:
    - id: b
      text: Fresh independent mastery evidence
    - id: c
      text: Proof of every prerequisite
    - id: a
      text: Practice that supports learning
    answer: a
    feedback: A hint changes the evidence condition even when the answer is correct.
    retired: true
  - id: mastery-and-placement.base.v2.1
    prompt: Which action gives stronger evidence about input versus weight?
    options:
    - id: b
      text: Recognize both words when they are displayed
    - id: c
      text: Repeat the definition without changing the example
    - id: a
      text: Explain their roles in a new snack example
    answer: a
    feedback: Applying the relation tests more than word familiarity.
  - id: mastery-and-placement.base.v2.2
    prompt: You read a worked answer and then repeat that same question. How should the attempt be treated?
    options:
    - id: c
      text: An automatically completed project
    - id: a
      text: Supported practice
    - id: b
      text: Fresh independent evidence
    answer: a
    feedback: Exposure changes what can be inferred from repeating the answer.
  - id: mastery-and-placement.base.v2.3
    prompt: What is a question variant?
    options:
    - id: a
      text: A different example checking a related idea
    - id: b
      text: A new attempt at the identical question
    - id: c
      text: A hint added to the currently displayed question
    answer: a
    feedback: Variants provide fresh applications rather than renaming past evidence.
  - id: mastery-and-placement.base.v2.4
    prompt: What does a learning objective name?
    options:
    - id: b
      text: A list of ideas a learner has already mastered
    - id: c
      text: A record of the learner’s submitted answers
    - id: a
      text: An ability the lesson aims to develop
    answer: a
    feedback: Objectives state what a learner should be able to do.
  - id: mastery-and-placement.base.v2.5
    prompt: You solve a question after asking for a hint. What kind of evidence is that attempt?
    options:
    - id: a
      text: A fresh unassisted check
    - id: b
      text: An externally reviewed project
    - id: c
      text: Supported practice
    answer: c
    feedback: Hints can support learning, but the attempt is not unassisted evidence.
  - id: mastery-and-placement.base.v2.6
    prompt: Which action better checks whether you understand a rule?
    options:
    - id: a
      text: Explain how it works on a different example
    - id: b
      text: Recognize the rule’s name in a list
    - id: c
      text: Copy the worked answer without changing its inputs
    answer: a
    feedback: Applying the rule to a fresh case gives more evidence of understanding than recognition or copying.
- id: mastery-and-placement.transfer
  objective_ref: objective.mastery-and-placement
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
  remediation_scene: mastery-and-placement.s3
  variants:
  - id: mastery-and-placement.transfer.1
    prompt: You demonstrated weighted averages in the image path. What transfers to attention?
    options:
    - id: b
      text: Automatic mastery of all transformer internals
    - id: c
      text: Nothing, because the topic label changed
    - id: a
      text: That compatible objective, not unrelated skills
    answer: a
    feedback: Evidence is attached to the shared ability rather than one path label.
    retired: true
  - id: mastery-and-placement.transfer.2
    prompt: All fresh variants are exhausted. What is a sound interpretation?
    options:
    - id: c
      text: Assume the objective is impossible
    - id: a
      text: Continue learning; repeated answers cannot be relabeled as fresh evidence
    - id: b
      text: Erase exposure history to manufacture mastery
    answer: a
    feedback: A small bank limits assessment evidence, not the possibility of learning.
    retired: true
  - id: mastery-and-placement.transfer.v2.1
    prompt: You keep adding instead of multiplying in the snack rule. What is useful to revisit?
    options:
    - id: c
      text: The step for comparing an answer with its target
    - id: a
      text: The equal-groups calculation
    - id: b
      text: The difference between an app and its model
    answer: a
    feedback: The specific error points to the operation rather than an unrelated topic.
  - id: mastery-and-placement.transfer.v2.2
    prompt: A learner passes a small draft quiz. Which conclusion is supported?
    options:
    - id: a
      text: They met that quiz’s current checks
    - id: b
      text: They have finished every related project
    - id: c
      text: They can handle any situation in the field
    answer: a
    feedback: The evidence is bounded by what was actually checked.
  - id: mastery-and-placement.transfer.v2.3
    prompt: Where should you keep project diagrams for review?
    options:
    - id: b
      text: Treat the quiz score as the complete project review
    - id: c
      text: Treat viewing the project slide as submitting the diagram
    - id: a
      text: In your own saved project artifact
    answer: a
    feedback: The app does not inspect or store the unseen project deliverable.
  - id: mastery-and-placement.transfer.v2.4
    prompt: What does exporting a progress backup provide?
    options:
    - id: c
      text: A copy of every model’s training data
    - id: a
      text: A copy of your browser study record
    - id: b
      text: An independently issued school certificate
    answer: a
    feedback: The backup protects personal progress rather than certifying it.
  - id: mastery-and-placement.transfer.v2.5
    prompt: Your calculations repeatedly multiply correctly but compare with the wrong target. What should
      you revisit?
    options:
    - id: a
      text: Which observed answer each prediction is compared with
    - id: b
      text: The multiplication step that was already correct
    - id: c
      text: The choice of weight before checking which target belongs to the example
    answer: a
    feedback: Use the error pattern to choose what to practice. Here the missing step is matching a prediction
      to its target.
  - id: mastery-and-placement.transfer.v2.6
    prompt: You export your browser progress after finishing some checks. What does the file preserve?
    options:
    - id: a
      text: Independent review of all your project files
    - id: b
      text: Your compatible local study record
    - id: c
      text: A guarantee that the whole field has been mastered
    answer: b
    feedback: A backup preserves the recorded learning evidence. It does not add reviews or prove abilities
      beyond those checks.
