schema_version: 0.2-draft
lesson:
  id: mastery-and-placement
  version: 0.4.0-draft
  title: Practice, progress, and knowing what you understand
  state: draft
  summary: A wrong answer can teach you more than a lucky right one. Learn how practice checks work here, what "mastered" really means, and how to turn mistakes into your next step.
  slot: M00.11
  category: common
  sources:
    - title: Dive into Deep Learning — introduction
      url: https://d2l.ai/chapter_introduction/index.html
  archetype: foundation
objectives:
  - id: objective.mastery-and-placement
    version: 3-draft
    statement: Placement and mastery use evidence of applying an idea; simply viewing a slide does not demonstrate understanding, and compatible evidence can serve several paths.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - mastery-and-placement.base.v3
      - mastery-and-placement.transfer.v3
    prerequisites:
      - anyOf:
          - objective.learning-routes
scenes:
  - id: mastery-and-placement.s1
    title: Knowing a word isn't the same as using it
    type: explanation
    depth: intuition
    objective_refs:
      - objective.mastery-and-placement
    markdown: |-
      You've seen the word "weight" many times by now, so it feels familiar. But try this without looking back: a party has 5 guests and the weight is 3. Then the guest count changes to 6. Which number changed, the input or the weight, and what's the new prediction?

      (The input changed. The weight stayed 3, so the prediction goes from 15 to 18.)

      If that came easily, you understand it. If you hesitated, that's worth knowing too, and it's much better to find out now than three lessons later.

      Each lesson in this course is built around a **learning objective**: a statement of what you should be able to *do* afterward, like "tell an input from a weight and predict what changes." The practice questions check that ability, not whether you've seen the words.
  - id: mastery-and-placement.s2
    title: Hints are for learning
    type: explanation
    depth: intuition
    objective_refs:
      - objective.mastery-and-placement
    markdown: |-
      Every practice question has a hint, and every answer comes with an explanation. Use them. They're part of learning, not a failure.

      One tip: try for a minute before you open a hint. Struggling to recall an answer, even when you don't quite get there, helps you remember the answer once you see it. Opening the hint right away skips that helpful effort.

      A question you answer after a hint, or after you've seen its answer, counts as supported practice. That's valuable, but it can't show that you could do it alone. So the course keeps track of which questions you've already seen, and when you want to show what you know, it gives you a fresh question you haven't met.
  - id: mastery-and-placement.s3
    title: Two kinds of check, many versions of each
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.mastery-and-placement
    markdown: |-
      Each lesson checks its idea in two ways:

      | Kind of check | What it asks | Snack example |
      | --- | --- | --- |
      | Core idea | Can you use the idea as taught? | "Weight 2, four guests: how many crackers?" |
      | New situation | Can you use it somewhere new? | "3 cups of water per plant, 7 plants: how many cups?" |

      Each early lesson has several versions of every question, so if you miss one, you can try a fresh one on the same skill. That way a wrong answer isn't the end of anything. It's a signal to review, then try again with new numbers.

      The second kind matters most. Being able to carry an idea into a situation you've never seen is what understanding looks like.
  - id: mastery-and-placement.s4
    title: What "mastered" means, and skipping ahead
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.mastery-and-placement
    markdown: |-
      When you pass a lesson's checks with fresh questions, the course marks it "mastered." That means you passed this lesson's checks. It's a good sign, not a promise that you know everything about the topic.

      If you already know an idea, you don't have to sit through its lesson. **Placement** means showing what you know by passing a lesson's checks without working through it first. Pass the checks for inputs and outputs, and you can move straight on. Ideas shared by several paths only need to be shown once.

      Occasionally a lesson's checks are improved. When that happens, your earlier answers are kept, but you may be asked to show the idea again with the new questions.
  - id: mastery-and-placement.s5
    title: Turn a mistake into a plan
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.mastery-and-placement
    markdown: |-
      When you get something wrong, don't just note the right answer. Ask *what kind* of mistake it was, because each kind has a different fix:

      | What went wrong | Example | Best next step |
      | --- | --- | --- |
      | Wrong operation | Added 2 + 3 instead of multiplying | Redo the equal-groups example with new numbers |
      | Arithmetic slip | Right idea, but 3 × 4 = 7 | A few minutes in the arithmetic bridge |
      | Mixed-up terms | Called the guest count the weight | Write your own example and label each part |

      :::mixup "Getting it wrong means I'm bad at this."
      A mistake followed by a clear explanation is one of the best moments for learning. Mistakes you were confident about are especially worth studying: working out *why* the wrong answer seemed right helps fix the misunderstanding underneath it.
      :::
  - id: mastery-and-placement.s6
    title: Keep your progress safe
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.mastery-and-placement
    markdown: |-
      Your progress is saved on this device, in this web browser. There's no account holding a copy somewhere else. So if you switch computers, or clear your browsing data, it won't come with you.

      A **backup** is a saved copy you keep yourself. Export one from your progress page before changing devices, and import it on the new one. It holds your answers and your place in each lesson.

      Projects work differently: you build something outside the course, like a diagram or a small program, so keep that work in your own files. Check it with the project's rubric, or ask a friend to review it.
  - id: mastery-and-placement.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.mastery-and-placement
    markdown: Hints, surprising mistakes, a quiz on photosynthesis, and a move to a new computer ask you to judge what your practice shows and what to do next.
    takeaway: |-
      Practice checks show whether you can use an idea, not just recognize it. Try before opening hints, treat each mistake as a clue to what to review, and keep a backup of your progress.
  - id: mastery-and-placement.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.mastery-and-placement
    markdown: |-
      Placement and mastery use evidence of applying an idea; simply viewing a slide does not demonstrate understanding, and compatible evidence can serve several paths.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - mastery-and-placement.s1
        - mastery-and-placement.s2
        - mastery-and-placement.s3
        - mastery-and-placement.s4
        - mastery-and-placement.s5
        - mastery-and-placement.s6
        - mastery-and-placement.check
      gate_refs:
        - gate.core
  scene_aliases:
    mastery-and-placement.recap: mastery-and-placement.check
assessment_families:
  - id: mastery-and-placement.base
    objective_ref: objective.mastery-and-placement
    task: base
    response_type: single_choice
    points: 1
    hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
    remediation_scene: mastery-and-placement.s3
    variants:
      - id: mastery-and-placement.base.1
        prompt: Does reaching the final slide alone demonstrate mastery?
        options:
          - id: a
            text: No; viewing and applying an idea are different evidence
          - id: b
            text: Yes, scrolling is sufficient
          - id: c
            text: Only if the slide has an equation
        answer: a
        feedback: Knowledge checks supply evidence beyond completion of reading.
        retired: true
      - id: mastery-and-placement.base.2
        prompt: What should a hinted answer count as here?
        options:
          - id: b
            text: Fresh independent mastery evidence
          - id: c
            text: Proof of every prerequisite
          - id: a
            text: Practice that supports learning
        answer: a
        feedback: A hint changes the evidence condition even when the answer is correct.
        retired: true
      - id: mastery-and-placement.base.v2.1
        prompt: Which action gives stronger evidence about input versus weight?
        options:
          - id: b
            text: Recognize both words when they are displayed
          - id: c
            text: Repeat the definition without changing the example
          - id: a
            text: Explain their roles in a new snack example
        answer: a
        feedback: Applying the relation tests more than word familiarity.
        retired: true
      - id: mastery-and-placement.base.v2.2
        prompt: You read a worked answer and then repeat that same question. How should the attempt be treated?
        options:
          - id: c
            text: An automatically completed project
          - id: a
            text: Supported practice
          - id: b
            text: Fresh independent evidence
        answer: a
        feedback: Exposure changes what can be inferred from repeating the answer.
        retired: true
      - id: mastery-and-placement.base.v2.3
        prompt: What is a question variant?
        options:
          - id: a
            text: A different example checking a related idea
          - id: b
            text: A new attempt at the identical question
          - id: c
            text: A hint added to the currently displayed question
        answer: a
        feedback: Variants provide fresh applications rather than renaming past evidence.
        retired: true
      - id: mastery-and-placement.base.v2.4
        prompt: What does a learning objective name?
        options:
          - id: b
            text: A list of ideas a learner has already mastered
          - id: c
            text: A record of the learner’s submitted answers
          - id: a
            text: An ability the lesson aims to develop
        answer: a
        feedback: Objectives state what a learner should be able to do.
        retired: true
      - id: mastery-and-placement.base.v2.5
        prompt: You solve a question after asking for a hint. What kind of evidence is that attempt?
        options:
          - id: a
            text: A fresh unassisted check
          - id: b
            text: An externally reviewed project
          - id: c
            text: Supported practice
        answer: c
        feedback: Hints can support learning, but the attempt is not unassisted evidence.
        retired: true
      - id: mastery-and-placement.base.v2.6
        prompt: Which action better checks whether you understand a rule?
        options:
          - id: a
            text: Explain how it works on a different example
          - id: b
            text: Recognize the rule’s name in a list
          - id: c
            text: Copy the worked answer without changing its inputs
        answer: a
        feedback: Applying the rule to a fresh case gives more evidence of understanding than recognition or copying.
        retired: true
  - id: mastery-and-placement.transfer
    objective_ref: objective.mastery-and-placement
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
    remediation_scene: mastery-and-placement.s3
    variants:
      - id: mastery-and-placement.transfer.1
        prompt: You demonstrated weighted averages in the image path. What transfers to attention?
        options:
          - id: b
            text: Automatic mastery of all transformer internals
          - id: c
            text: Nothing, because the topic label changed
          - id: a
            text: That compatible objective, not unrelated skills
        answer: a
        feedback: Evidence is attached to the shared ability rather than one path label.
        retired: true
      - id: mastery-and-placement.transfer.2
        prompt: All fresh variants are exhausted. What is a sound interpretation?
        options:
          - id: c
            text: Assume the objective is impossible
          - id: a
            text: Continue learning; repeated answers cannot be relabeled as fresh evidence
          - id: b
            text: Erase exposure history to manufacture mastery
        answer: a
        feedback: A small bank limits assessment evidence, not the possibility of learning.
        retired: true
      - id: mastery-and-placement.transfer.v2.1
        prompt: You keep adding instead of multiplying in the snack rule. What is useful to revisit?
        options:
          - id: c
            text: The step for comparing an answer with its target
          - id: a
            text: The equal-groups calculation
          - id: b
            text: The difference between an app and its model
        answer: a
        feedback: The specific error points to the operation rather than an unrelated topic.
        retired: true
      - id: mastery-and-placement.transfer.v2.2
        prompt: A learner passes a small draft quiz. Which conclusion is supported?
        options:
          - id: a
            text: They met that quiz’s current checks
          - id: b
            text: They have finished every related project
          - id: c
            text: They can handle any situation in the field
        answer: a
        feedback: The evidence is bounded by what was actually checked.
        retired: true
      - id: mastery-and-placement.transfer.v2.3
        prompt: Where should you keep project diagrams for review?
        options:
          - id: b
            text: Treat the quiz score as the complete project review
          - id: c
            text: Treat viewing the project slide as submitting the diagram
          - id: a
            text: In your own saved project artifact
        answer: a
        feedback: The app does not inspect or store the unseen project deliverable.
        retired: true
      - id: mastery-and-placement.transfer.v2.4
        prompt: What does exporting a progress backup provide?
        options:
          - id: c
            text: A copy of every model’s training data
          - id: a
            text: A copy of your browser study record
          - id: b
            text: An independently issued school certificate
        answer: a
        feedback: The backup protects personal progress rather than certifying it.
        retired: true
      - id: mastery-and-placement.transfer.v2.5
        prompt: Your calculations repeatedly multiply correctly but compare with the wrong target. What should you revisit?
        options:
          - id: a
            text: Which observed answer each prediction is compared with
          - id: b
            text: The multiplication step that was already correct
          - id: c
            text: The choice of weight before checking which target belongs to the example
        answer: a
        feedback: Use the error pattern to choose what to practice. Here the missing step is matching a prediction to its target.
        retired: true
      - id: mastery-and-placement.transfer.v2.6
        prompt: You export your browser progress after finishing some checks. What does the file preserve?
        options:
          - id: a
            text: Independent review of all your project files
          - id: b
            text: Your compatible local study record
          - id: c
            text: A guarantee that the whole field has been mastered
        answer: b
        feedback: A backup preserves the recorded learning evidence. It does not add reviews or prove abilities beyond those checks.
        retired: true
  - id: mastery-and-placement.base.v3
    objective_ref: objective.mastery-and-placement
    task: base
    response_type: single_choice
    points: 1
    hint: Ask what each kind of practice can show. Using an idea on a fresh example, without help, shows more than recognizing it, repeating it, or answering after a hint.
    remediation_scene: mastery-and-placement.s2
    variants:
      - id: mastery-and-placement.base.v3.1
        prompt: Which of these gives the best sign that you understand the difference between an input and a weight?
        options:
          - id: a
            text: Recognizing both words whenever they appear on a page
          - id: b
            text: Explaining their roles in a snack example you invent
          - id: c
            text: Rereading both definitions until they feel familiar
        answer: b
        feedback: Using the idea on an example you've never seen shows you can apply it. Recognizing or rereading the words only shows they look familiar.
      - id: mastery-and-placement.base.v3.2
        prompt: What does a lesson's learning objective describe?
        options:
          - id: a
            text: The score you need in order to pass the lesson
          - id: b
            text: The list of the lesson's parts, in their order
          - id: c
            text: Something you should be able to do afterward
        answer: c
        feedback: An objective names an ability, like predicting what changes when the input changes. The checks then test that ability.
      - id: mastery-and-placement.base.v3.3
        prompt: You open a hint and then answer the question correctly. How is that attempt best described?
        options:
          - id: c
            text: Proof that you could answer it on your own
          - id: b
            text: A wasted attempt that won't help you learn
          - id: a
            text: Supported practice that helps you learn
        answer: a
        feedback: Hints are part of learning, so the attempt helps. It just can't show you'd manage without the hint; a fresh question does that.
      - id: mastery-and-placement.base.v3.4
        prompt: A lesson is marked "mastered." What does that mean?
        options:
          - id: c
            text: You passed this lesson's checks with fresh questions
          - id: b
            text: You know everything there is to know about the topic
          - id: a
            text: You opened every part of the lesson and read it all
        answer: c
        feedback: Mastered means you passed this lesson's checks. It's a good sign, but a handful of questions can't cover a whole topic, and just reading a lesson isn't enough to earn it.
      - id: mastery-and-placement.base.v3.5
        prompt: You already understand inputs and outputs from a coding class. What does placement let you do?
        options:
          - id: b
            text: Mark the lesson as done without answering anything
          - id: a
            text: Pass the lesson's checks, then move straight on
          - id: c
            text: Skip every later lesson on your path along with it
        answer: a
        feedback: Placement means showing what you know by passing the checks, not skipping them. It covers that idea only; later lessons have their own checks.
      - id: mastery-and-placement.base.v3.6
        prompt: When is the best time to open a practice question's hint?
        options:
          - id: a
            text: Right away, before reading the question closely
          - id: b
            text: After a real try at the answer yourself
          - id: c
            text: Never, because using hints spoils what you learn
        answer: b
        feedback: A minute of honest effort first makes the hint and the explanation stick better. Hints help learning; opening one before trying just skips the useful struggle.
  - id: mastery-and-placement.transfer.v3
    objective_ref: objective.mastery-and-placement
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name the kind of mistake or situation first (wrong operation, arithmetic slip, mixed-up terms, or keeping your record safe), then pick the step that fixes that exact thing.
    remediation_scene: mastery-and-placement.s5
    variants:
      - id: mastery-and-placement.transfer.v3.1
        prompt: You keep getting snack predictions wrong because you add the weight and the guest count instead of multiplying them. What should you practice?
        options:
          - id: c
            text: The difference between a model and its app
          - id: a
            text: The definition of a dataset and its labels
          - id: b
            text: The equal-groups example, with new numbers
        answer: b
        feedback: This is a wrong-operation mistake, so redo the calculation that teaches the operation. The other topics are fine to review but won't fix adding instead of multiplying.
      - id: mastery-and-placement.transfer.v3.2
        prompt: Your multiplication is right every time, but you keep comparing each prediction with the wrong party's total. What should you practice?
        options:
          - id: c
            text: Matching each prediction to its own recorded target
          - id: b
            text: Doing the multiplication step a whole lot more quickly
          - id: a
            text: Picking a brand-new weight before each comparison
        answer: c
        feedback: The error is in pairing predictions with targets, not in the arithmetic. Practice lining up each example with its own answer.
      - id: mastery-and-placement.transfer.v3.3
        prompt: You're about to move from your school laptop to a new home computer. What should you do first so your progress comes with you?
        options:
          - id: b
            text: Clear the laptop's browsing data to tidy up first
          - id: a
            text: Export a backup file, then import it at home
          - id: c
            text: Start the path over from the beginning at home
        answer: a
        feedback: Progress is saved only on the device where you studied, so a backup file carries it across. Clearing the data first would erase it.
      - id: mastery-and-placement.transfer.v3.4
        prompt: A friend passes a 10-question quiz on photosynthesis. Which conclusion fits best?
        options:
          - id: a
            text: They're now an expert in all of plant biology
          - id: c
            text: They can do what those ten questions checked
          - id: b
            text: They'll remember photosynthesis for good now
        answer: c
        feedback: A quiz shows the abilities its questions test. Ten questions can't cover a whole field, and memory still needs spaced review.
      - id: mastery-and-placement.transfer.v3.5
        prompt: You were sure your answer was right, but it was wrong. What is the most useful thing to do next?
        options:
          - id: c
            text: Decide the question was unfair and move on
          - id: b
            text: Avoid questions on this topic for a while
          - id: a
            text: Work out why the wrong answer seemed right
        answer: a
        feedback: Confident mistakes point to a real misunderstanding, and fixing it now makes the right idea stick. Moving on or avoiding the topic leaves the misunderstanding in place.
      - id: mastery-and-placement.transfer.v3.6
        prompt: You finish the diagram for a project. How can you check whether it is good?
        options:
          - id: a
            text: Count your quiz score as the score for the project
          - id: b
            text: Use the project's rubric or ask a friend to review it
          - id: c
            text: Assume it's correct, since you finished every single step
        answer: b
        feedback: A project is work you made outside the questions, so it needs its own review against the rubric. Quiz scores measure different things, and finishing isn't the same as checking.
