schema_version: 0.2-draft
lesson:
  id: mastery-and-placement
  version: 0.1.0-draft
  title: Show what you know and carry it forward
  state: draft
  summary: Placement and mastery use evidence of applying an idea; simply viewing a slide does not demonstrate understanding,
    and compatible evidence can serve several paths.
  slot: M00.8
  category: common
  minutes: 12
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.mastery-and-placement
  version: 1-draft
  statement: Placement and mastery use evidence of applying an idea; simply viewing a slide does not demonstrate
    understanding, and compatible evidence can serve several paths.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - mastery-and-placement.base
  - mastery-and-placement.transfer
  prerequisites:
  - anyOf:
    - objective.learning-routes
scenes:
- id: mastery-and-placement.s1
  title: Familiarity is a useful beginning
  type: explanation
  depth: intuition
  objective_refs:
  - objective.mastery-and-placement
  markdown: Recognizing a term after reading it is different from using it in a new situation. A knowledge check
    asks for an explanation, comparison, or calculation. The purpose is to reveal the next useful learning step,
    not to punish a learner for needing another example.
  text_mode: Recognizing a term after reading it is different from using it in a new situation. A knowledge check
    asks for an explanation, comparison, or calculation. The purpose is to reveal the next useful learning step,
    not to punish a learner for needing another example.
  bridges: []
- id: mastery-and-placement.s2
  title: Make evidence specific
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mastery-and-placement
  markdown: If you can compute a weighted average, that evidence helps with expert mixtures and attention. It does
    not automatically show that you understand cache memory or derivatives. Objectives name the ability being checked.
    A lesson can contain more than one objective, so finishing one check need not establish the whole lesson.
  text_mode: If you can compute a weighted average, that evidence helps with expert mixtures and attention. It does
    not automatically show that you understand cache memory or derivatives. Objectives name the ability being checked.
    A lesson can contain more than one objective, so finishing one check need not establish the whole lesson.
  bridges: []
- id: mastery-and-placement.s3
  title: Practice and independent checks differ
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mastery-and-placement
  markdown: Hints and worked answers support learning. Once an answer is exposed, repeating it is weak evidence
    of independent transfer. This classroom keeps such attempts as practice and uses different fresh checks for
    mastery. Existing compatible evidence is reused when a new path needs the same objective.
  text_mode: Hints and worked answers support learning. Once an answer is exposed, repeating it is weak evidence
    of independent transfer. This classroom keeps such attempts as practice and uses different fresh checks for
    mastery. Existing compatible evidence is reused when a new path needs the same objective.
  bridges: []
- id: mastery-and-placement.s4
  title: Keep the record in perspective
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mastery-and-placement
  markdown: A draft assessment bank is small and may run out of fresh variants. Personal browser records help guide
    study, but they are not externally verified grades. Revisit an idea after time has passed, explain it aloud,
    and apply it to a different example. Export a backup to preserve local progress when changing devices.
  text_mode: A draft assessment bank is small and may run out of fresh variants. Personal browser records help guide
    study, but they are not externally verified grades. Revisit an idea after time has passed, explain it aloud,
    and apply it to a different example. Export a backup to preserve local progress when changing devices.
  bridges: []
- id: mastery-and-placement.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.mastery-and-placement
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: mastery-and-placement.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.mastery-and-placement
  markdown: Placement and mastery use evidence of applying an idea; simply viewing a slide does not demonstrate
    understanding, and compatible evidence can serve several paths.
  text_mode: Placement and mastery use evidence of applying an idea; simply viewing a slide does not demonstrate
    understanding, and compatible evidence can serve several paths.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - mastery-and-placement.s1
    - mastery-and-placement.s2
    - mastery-and-placement.s3
    - mastery-and-placement.s4
    - mastery-and-placement.check
    - mastery-and-placement.recap
    gate_refs:
    - gate.core
assessment_families:
- id: mastery-and-placement.base
  objective_ref: objective.mastery-and-placement
  task: base
  response_type: single_choice
  points: 1
  hint: 'Make evidence specific: trace the inputs, operation, and result before choosing.'
  remediation_scene: mastery-and-placement.s2
  variants:
  - id: mastery-and-placement.base.1
    prompt: Does reaching the final slide alone demonstrate mastery?
    options:
    - id: a
      text: No; viewing and applying an idea are different evidence
    - id: b
      text: Yes, scrolling is sufficient
    - id: c
      text: Only if the slide has an equation
    answer: a
    feedback: Knowledge checks supply evidence beyond completion of reading.
  - id: mastery-and-placement.base.2
    prompt: What should a hinted answer count as here?
    options:
    - id: b
      text: Fresh independent mastery evidence
    - id: c
      text: Proof of every prerequisite
    - id: a
      text: Practice that supports learning
    answer: a
    feedback: A hint changes the evidence condition even when the answer is correct.
- id: mastery-and-placement.transfer
  objective_ref: objective.mastery-and-placement
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Keep the record in perspective: trace the inputs, operation, and result before choosing.'
  remediation_scene: mastery-and-placement.s4
  variants:
  - id: mastery-and-placement.transfer.1
    prompt: You demonstrated weighted averages in the image path. What transfers to attention?
    options:
    - id: b
      text: Automatic mastery of all transformer internals
    - id: c
      text: Nothing, because the topic label changed
    - id: a
      text: That compatible objective, not unrelated skills
    answer: a
    feedback: Evidence is attached to the shared ability rather than one path label.
  - id: mastery-and-placement.transfer.2
    prompt: All fresh variants are exhausted. What is a sound interpretation?
    options:
    - id: c
      text: Assume the objective is impossible
    - id: a
      text: Continue learning; repeated answers cannot be relabeled as fresh evidence
    - id: b
      text: Erase exposure history to manufacture mastery
    answer: a
    feedback: A small bank limits assessment evidence, not the possibility of learning.
