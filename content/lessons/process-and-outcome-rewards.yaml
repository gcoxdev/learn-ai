assessment_families:
- id: process-and-outcome-rewards.base
  objective_ref: objective.process-and-outcome-rewards
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace a disagreement: trace the inputs, operation, and result before choosing.'
  remediation_scene: process-and-outcome-rewards.s2
  variants:
  - id: process-and-outcome-rewards.base.1
    prompt: What does outcome reward primarily assess?
    options:
    - id: b
      text: Every hidden computation automatically
    - id: c
      text: Only intermediate formatting
    - id: a
      text: The final result under its scoring rule
    answer: a
    feedback: Its granularity is the outcome.
  - id: process-and-outcome-rewards.base.2
    prompt: A wrong step accidentally yields a right answer. Which check may miss it?
    options:
    - id: c
      text: Every possible process audit
    - id: a
      text: Answer-only verification
    - id: b
      text: A perfect proof checker by definition
    answer: a
    feedback: Final correctness does not guarantee a valid derivation.
- id: process-and-outcome-rewards.transfer
  objective_ref: objective.process-and-outcome-rewards
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Use adversarial and independent audits: trace the inputs, operation, and result before choosing.'
  remediation_scene: process-and-outcome-rewards.s4
  variants:
  - id: process-and-outcome-rewards.transfer.1
    prompt: Rewarding more steps can cause what shortcut?
    options:
    - id: c
      text: Automatic proof validity
    - id: a
      text: Unnecessary intermediate text
    - id: b
      text: Guaranteed deeper understanding
    answer: a
    feedback: Optimizing a proxy can exploit its easiest measurable feature.
  - id: process-and-outcome-rewards.transfer.2
    prompt: Why test unfamiliar but valid solution styles?
    options:
    - id: a
      text: A process scorer may overfit familiar presentation
    - id: b
      text: Only one derivation can ever be correct
    - id: c
      text: Style cannot affect learned judges
    answer: a
    feedback: Valid alternatives test whether the scorer recognizes substance.
