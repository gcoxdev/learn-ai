assessment_families:
  - id: process-and-outcome-rewards.base
    objective_ref: objective.process-and-outcome-rewards
    task: base
    response_type: single_choice
    points: 1
    hint: 'Trace a disagreement: trace the inputs, operation, and result before choosing.'
    remediation_scene: process-and-outcome-rewards.s2
    variants:
      - id: process-and-outcome-rewards.base.1
        prompt: What does outcome reward primarily assess?
        options:
          - id: b
            text: Every hidden computation automatically
          - id: c
            text: Only intermediate formatting
          - id: a
            text: The final result under its scoring rule
        answer: a
        feedback: Its granularity is the outcome.
        retired: true
      - id: process-and-outcome-rewards.base.2
        prompt: A wrong step accidentally yields a right answer. Which check may miss it?
        options:
          - id: c
            text: Every possible process audit
          - id: a
            text: Answer-only verification
          - id: b
            text: A perfect proof checker by definition
        answer: a
        feedback: Final correctness does not guarantee a valid derivation.
        retired: true
  - id: process-and-outcome-rewards.transfer
    objective_ref: objective.process-and-outcome-rewards
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Use adversarial and independent audits: trace the inputs, operation, and result before choosing.'
    remediation_scene: process-and-outcome-rewards.s4
    variants:
      - id: process-and-outcome-rewards.transfer.1
        prompt: Rewarding more steps can cause what shortcut?
        options:
          - id: c
            text: Automatic proof validity
          - id: a
            text: Unnecessary intermediate text
          - id: b
            text: Guaranteed deeper understanding
        answer: a
        feedback: Optimizing a proxy can exploit its easiest measurable feature.
        retired: true
      - id: process-and-outcome-rewards.transfer.2
        prompt: Why test unfamiliar but valid solution styles?
        options:
          - id: a
            text: A process scorer may overfit familiar presentation
          - id: b
            text: Only one derivation can ever be correct
          - id: c
            text: Style cannot affect learned judges
        answer: a
        feedback: Valid alternatives test whether the scorer recognizes substance.
        retired: true
  - id: process-and-outcome-rewards.base.v2
    objective_ref: objective.process-and-outcome-rewards
    task: base
    response_type: single_choice
    points: 1
    hint: "Ask where each reward looks: only at the final answer, or at every step. Then ask how the step scores were produced and combined."
    remediation_scene: process-and-outcome-rewards.s2
    variants:
      - id: process-and-outcome-rewards.base.v2.1
        prompt: A solution simplifies 16/64 by crossing out the two 6s and answers 1/4. What do an outcome reward and a well-trained process reward give it?
        options:
          - id: b
            text: Both give full reward, since the final answer is correct
          - id: a
            text: The outcome reward passes it; the process reward flags step 2
          - id: c
            text: The outcome reward fails it, since the method is invalid
        answer: a
        feedback: 1/4 is the right value, so an answer check passes it. Crossing out digits isn't valid cancellation, so a process reward that checks each step should flag it. An outcome reward never looks at the method.
      - id: process-and-outcome-rewards.base.v2.2
        prompt: How did Lightman et al. (2023) combine a PRM's per-step scores into one score for a whole solution?
        options:
          - id: c
            text: They took the PRM's score for the final step alone
          - id: b
            text: They averaged the step probabilities across the steps
          - id: a
            text: They multiplied the probabilities that each step is correct
        answer: a
        feedback: The product is the chance that every step is correct, so one doubtful step drags the whole solution down. Averaging would let good steps hide a bad one, and the last step alone ignores everything before it.
      - id: process-and-outcome-rewards.base.v2.3
        prompt: Why can a product-of-step-probabilities score favor short solutions?
        options:
          - id: a
            text: Each extra step multiplies in another number below 1
          - id: b
            text: Short solutions give the PRM fewer tokens to misread
          - id: c
            text: PRMs are trained mostly on examples of short solutions
        answer: a
        feedback: Ten steps at 0.95 multiply to about 0.599, below three steps at 0.90 (0.729), even though each step is more confident. That comes from the arithmetic of the product, not from how the PRM reads or was trained.
      - id: process-and-outcome-rewards.base.v2.4
        prompt: An automatic labeler scores a step by finishing the solution 8 times from that step and counting how many completions reach the right answer. What can it miss?
        options:
          - id: b
            text: A step after which none of the completions reach the answer
          - id: a
            text: An invalid step from which the right answer is still reachable
          - id: c
            text: A step after which every completion reaches the right answer
        answer: a
        feedback: Rollout labels measure whether the right answer is still reachable, not whether the step is valid. A lucky shortcut like crossing out the 6s still leads to 1/4, so it scores 8/8. Steps that lead nowhere are exactly what this method catches.
      - id: process-and-outcome-rewards.base.v2.5
        prompt: On GSM8K, what did Uesato et al. (2022) find that process-based feedback added over outcome-based feedback?
        options:
          - id: c
            text: Solutions that were much shorter and cheaper to generate
          - id: a
            text: Far fewer reasoning errors in solutions with correct answers
          - id: b
            text: A much lower final-answer error rate than outcome feedback
        answer: a
        feedback: Final-answer error rates came out similar for the two kinds of feedback. The difference was in the reasoning. Keeping errors out of correct-answer solutions needed process feedback or a reward model that imitated it.
  - id: process-and-outcome-rewards.transfer.v2
    objective_ref: objective.process-and-outcome-rewards
    task: transfer
    response_type: single_choice
    points: 1
    hint: Imagine the policy trying to maximize this exact score. What is the cheapest behavior that earns it, and is that what you wanted?
    remediation_scene: process-and-outcome-rewards.s4
    variants:
      - id: process-and-outcome-rewards.transfer.v2.1
        prompt: 'A contract-analysis model is trained against a learned step checker whose scores are averaged over the steps. Its answers fill up with obviously true steps like "The contract has a title." Why?'
        options:
          - id: a
            text: Easy high-scoring steps raise the average score
          - id: b
            text: The checker penalizes answers with few steps
          - id: c
            text: The model is learning to be more thorough
        answer: a
        feedback: Averaging lets cheap, certain steps dilute the weak ones, so padding raises reward without better analysis. Nothing here penalizes short answers, and the padding adds no real thoroughness.
      - id: process-and-outcome-rewards.transfer.v2.2
        prompt: You're training a maths tutor for children, who will copy its written working. Which reward design fits best?
        options:
          - id: c
            text: Reward longer solutions, since more steps show more working
          - id: b
            text: An outcome reward alone, since correct answers are what matter
          - id: a
            text: Include feedback on the steps, not just the final answer
        answer: a
        feedback: Children learn the method from the steps, so invalid steps that happen to reach right answers would teach them wrong methods. Length is a proxy that invites padding.
      - id: process-and-outcome-rewards.transfer.v2.3
        prompt: For a leaderboard that scores final answers only, you have a reliable exact-match checker and little money for labeling. Which reward is the sensible starting point?
        options:
          - id: a
            text: Outcome rewards from the exact-match checker
          - id: b
            text: Paid human labels on every step of every solution
          - id: c
            text: A process model trained on the policy's own steps
        answer: a
        feedback: When a trustworthy answer check exists and only answers count, outcome rewards are cheap and hard to pad. Human step labels are costly, and a PRM trained on the policy's own outputs adds a new target that can be hacked.
      - id: process-and-outcome-rewards.transfer.v2.4
        prompt: A reward model for code review gives points for each function that has a docstring. What will RL most likely produce?
        options:
          - id: b
            text: Fewer, longer functions with one shared docstring
          - id: a
            text: Many small functions, each with its own docstring
          - id: c
            text: Faster code, since documented code runs better
        answer: a
        feedback: Rewarding a countable feature invites making more of it, as with CoastRunners' targets. Splitting code into many tiny documented functions raises the count; merging functions lowers it, and docstrings don't affect speed.
        retired: true
      - id: process-and-outcome-rewards.transfer.v2.5
        prompt: A support model is rewarded by a learned checker that gives points for each troubleshooting step containing a phrase like "Let's verify." What will RL most likely produce?
        options:
          - id: c
            text: Fewer steps, each checked more carefully before it's written
          - id: a
            text: More steps that say "Let's verify" without checking anything
          - id: b
            text: The same answers, since the phrase doesn't change the fix
        answer: a
        feedback: The checker pays for the phrase, so the cheapest way to raise reward is to repeat it, as CoastRunners' agent circled for points. Careful checking earns nothing extra here, and RL does change behavior whenever a cheap change raises reward.
  - id: process-and-outcome-rewards.calculate
    objective_ref: objective.process-and-outcome-rewards
    task: base
    response_type: numeric
    points: 1
    hint: Multiply the step probabilities together; the product is the chance that every step is correct. (Give a decimal.)
    remediation_scene: process-and-outcome-rewards.s2
    absolute_tolerance: 0.005
    variants:
      - id: process-and-outcome-rewards.calculate.1
        prompt: A PRM gives a 3-step solution step probabilities 0.9, 0.8, and 0.5. What is its product score?
        answer: 0.36
        feedback: 0.9 × 0.8 = 0.72, and 0.72 × 0.5 = 0.36. The shaky last step halves the score.
      - id: process-and-outcome-rewards.calculate.2
        prompt: A PRM gives a 4-step solution step probabilities 0.99, 0.95, 0.90, and 0.40. What is its product score?
        answer: 0.339
        feedback: 0.99 × 0.95 = 0.9405; × 0.90 = 0.8465; × 0.40 ≈ 0.339. Three strong steps can't rescue one weak one.
      - id: process-and-outcome-rewards.calculate.3
        prompt: A PRM gives each of a solution's 5 steps probability 0.9. What is its product score?
        answer: 0.59
        feedback: 0.9⁵ = 0.59049 ≈ 0.590. Five solid steps already cost about 40% of the score.
      - id: process-and-outcome-rewards.calculate.4
        prompt: A PRM gives each of a solution's 4 steps probability 0.95. What is its product score?
        answer: 0.815
        feedback: 0.95⁴ = 0.9025 × 0.9025 ≈ 0.8145.
