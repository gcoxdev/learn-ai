schema_version: 0.2-draft
lesson:
  id: process-and-outcome-rewards
  version: 0.1.0-draft
  title: Choose whether to score the result, the steps, or both
  state: draft
  summary: Outcome rewards score final results, while process rewards score intermediate behavior; both can be misspecified
    or exploited, so evaluate correctness, shortcuts, and reward alignment independently.
  slot: M21.5
  category: learning
  minutes: 12
  sources:
  - title: Let’s Verify Step by Step
    url: https://arxiv.org/abs/2305.20050
  - title: The Effects of Reward Misspecification
    url: https://arxiv.org/abs/2201.03544
objectives:
- id: objective.process-and-outcome-rewards
  version: 1-draft
  statement: Outcome rewards score final results, while process rewards score intermediate behavior; both can be
    misspecified or exploited, so evaluate correctness, shortcuts, and reward alignment independently.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - process-and-outcome-rewards.base
  - process-and-outcome-rewards.transfer
  prerequisites:
  - anyOf:
    - objective.verifiable-rewards
  - anyOf:
    - objective.preferences-and-reward-models
scenes:
- id: process-and-outcome-rewards.s1
  title: Different feedback granularity
  type: explanation
  depth: intuition
  objective_refs:
  - objective.process-and-outcome-rewards
  markdown: An outcome scorer rewards the final answer. A process scorer may judge each derivation step or action.
    Step feedback can locate errors and provide denser supervision, but requires a rubric that recognizes valid
    alternative approaches rather than one rigid solution template.
  text_mode: An outcome scorer rewards the final answer. A process scorer may judge each derivation step or action.
    Step feedback can locate errors and provide denser supervision, but requires a rubric that recognizes valid
    alternative approaches rather than one rigid solution template.
  bridges: []
- id: process-and-outcome-rewards.s2
  title: Trace a disagreement
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.process-and-outcome-rewards
  markdown: A solution uses an invalid cancellation but accidentally reaches the correct numeric result. An answer-only
    check may pass it, while a step checker should flag the invalid operation. Conversely, a sound partial derivation
    may not reach the final answer before a budget expires. Decide which behavior the objective values.
  text_mode: A solution uses an invalid cancellation but accidentally reaches the correct numeric result. An answer-only
    check may pass it, while a step checker should flag the invalid operation. Conversely, a sound partial derivation
    may not reach the final answer before a budget expires. Decide which behavior the objective values.
  bridges: []
- id: process-and-outcome-rewards.s3
  title: Expect optimization to find shortcuts
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.process-and-outcome-rewards
  markdown: A length reward can produce unnecessary text; a format reward can produce correct tags around incorrect
    content. A learned process scorer can favor familiar-looking steps. Combining scores does not automatically
    remove these problems because the weighted combination becomes another target to exploit.
  text_mode: A length reward can produce unnecessary text; a format reward can produce correct tags around incorrect
    content. A learned process scorer can favor familiar-looking steps. Combining scores does not automatically
    remove these problems because the weighted combination becomes another target to exploit.
  bridges: []
- id: process-and-outcome-rewards.s4
  title: Use adversarial and independent audits
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.process-and-outcome-rewards
  markdown: Construct cases that separate appearance from validity, inspect high-reward failures, and test new solution
    styles. Keep some evaluation criteria independent of the training reward. Report reward components and weights
    so improvements can be interpreted rather than equated with an undefined notion of better reasoning.
  text_mode: Construct cases that separate appearance from validity, inspect high-reward failures, and test new
    solution styles. Keep some evaluation criteria independent of the training reward. Report reward components
    and weights so improvements can be interpreted rather than equated with an undefined notion of better reasoning.
  bridges: []
- id: process-and-outcome-rewards.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.process-and-outcome-rewards
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Outcome rewards score final results, while process rewards score intermediate behavior; both can be
    misspecified or exploited, so evaluate correctness, shortcuts, and reward alignment independently.
- id: process-and-outcome-rewards.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.process-and-outcome-rewards
  markdown: Outcome rewards score final results, while process rewards score intermediate behavior; both can be
    misspecified or exploited, so evaluate correctness, shortcuts, and reward alignment independently.
  text_mode: Outcome rewards score final results, while process rewards score intermediate behavior; both can be
    misspecified or exploited, so evaluate correctness, shortcuts, and reward alignment independently.
