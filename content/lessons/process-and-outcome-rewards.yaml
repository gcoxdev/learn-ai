schema_version: 0.2-draft
lesson:
  id: process-and-outcome-rewards
  version: 0.4.0-draft
  title: Choose whether to score the result, the steps, or both
  state: draft
  summary: Cross out the 6s in 16/64 and you get 1/4, the right answer by a wrong method. Should the model be rewarded? That question splits outcome rewards from process rewards.
  slot: M21.5
  category: learning
  sources:
    - title: "Let's Verify Step by Step (Lightman et al., 2023)"
      url: https://arxiv.org/abs/2305.20050
    - title: "Solving math word problems with process- and outcome-based feedback (Uesato et al., 2022)"
      url: https://arxiv.org/abs/2211.14275
    - title: "Math-Shepherd: Verify and Reinforce LLMs Step-by-step without Human Annotations (Wang et al., 2023)"
      url: https://arxiv.org/abs/2312.08935
    - title: "Faulty Reward Functions in the Wild (OpenAI, 2016)"
      url: https://openai.com/index/faulty-reward-functions/
    - title: "The Effects of Reward Misspecification: Mapping and Mitigating Misaligned Models (Pan et al., 2022)"
      url: https://arxiv.org/abs/2201.03544
objectives:
  - id: objective.process-and-outcome-rewards
    version: 3-draft
    statement: Outcome rewards score the final answer and process rewards score each step; both can be gamed, so check correctness, shortcuts, and whether the reward matches what you want.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - process-and-outcome-rewards.base.v2
      - process-and-outcome-rewards.transfer.v2
      - process-and-outcome-rewards.calculate
    prerequisites:
      - anyOf:
          - objective.verifiable-rewards
      - anyOf:
          - objective.preferences-and-reward-models
scenes:
  - id: process-and-outcome-rewards.s1
    title: Grade the answer, or grade the work?
    type: explanation
    depth: intuition
    objective_refs:
      - objective.process-and-outcome-rewards
    markdown: |-
      Simplify $\tfrac{16}{64}$. A student crosses out the two 6s and writes $\tfrac{1}{4}$. That's correct! Try the same trick on $\tfrac{12}{24}$: cross out the 2s, get $\tfrac{1}{4}$. Wrong; it's $\tfrac{1}{2}$. Real cancellation divides top and bottom by the same factor ($16/64 = (16 \div 16)/(64 \div 16)$). Digit-crossing just got lucky.

      A reward can look at either end of that solution:

      - An **outcome reward** scores only the final result. The verifiers from two lessons ago are outcome rewards, and so is an **outcome reward model** (ORM), a network trained to predict whether a solution's final answer is right.
      - A **process reward** scores each step. A **process reward model** (PRM) is a network trained to predict whether each individual step is correct.

      The ORM passes the 16/64 solution. A good PRM flags the crossing-out step. Process rewards also give **denser** feedback: instead of one bit at the end of a 20-step solution, they point to the step where it went wrong.
    diagram:
      caption: Where each kind of reward looks. An outcome reward sees only the answer; a process reward scores every step.
      description: A solution runs from step 1, reading the fraction 16/64, to step 2, crossing out the 6s, to the final answer 1/4. The outcome reward checks only the final answer and passes it. The process reward checks each step and flags step 2 as invalid.
      nodes:
        - id: step1
          label: "Step 1: simplify 16/64"
          col: 0
          row: 0
        - id: step2
          label: "Step 2: cross out the 6s"
          col: 1
          row: 0
          tone: warn
        - id: answer
          label: "Answer: 1/4"
          col: 2
          row: 0
        - id: orm
          label: Outcome reward
          note: "checks the answer: pass"
          col: 2
          row: 1
          tone: data
        - id: prm
          label: Process reward
          note: "checks each step: step 2 invalid"
          col: 1
          row: 1
          tone: accent
      edges:
        - from: step1
          to: step2
        - from: step2
          to: answer
        - from: answer
          to: orm
          dashed: true
        - from: step2
          to: prm
          dashed: true
        - from: step1
          to: prm
          dashed: true
    bridges: []
  - id: process-and-outcome-rewards.s2
    title: '"Let''s Verify Step by Step"'
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.process-and-outcome-rewards
    markdown: |-
      In 2023, OpenAI researchers (Lightman et al.) paid people to label steps. The result, **PRM800K**, holds 800,000 step labels (positive, negative, or neutral) across 75,000 solutions to 12,000 problems from the MATH competition dataset. They trained a PRM on it and an ORM on final-answer correctness. Then they used each one to pick the best of 1,860 sampled solutions per problem. On a representative subset of MATH, the PRM's picks were right 78.2% of the time, the ORM's 72.4%, and a simple majority vote's 69.6%.

      A PRM gives each step a probability of being correct. To score a whole solution, Lightman et al. multiplied them: the chance that *every* step is correct.

      $$\text{score}(\text{solution}) = \prod_{k=1}^{K} p_k$$

      ```python run
      import math

      # PRM probability that each step is correct
      solutions = {
          "A: one shaky step": [0.98, 0.95, 0.30, 0.90],
          "B: steady, 4 steps": [0.90, 0.90, 0.90, 0.90],
          "C: steady, 3 steps": [0.90, 0.90, 0.90],
          "D: careful, 10 steps": [0.95] * 10,
      }
      for name, p in solutions.items():
          print(f"{name:21} product = {math.prod(p):.3f}   min = {min(p):.2f}   mean = {sum(p) / len(p):.3f}")
      ```

      Solution A has three confident steps and one doubtful one. Its mean (0.782) looks fine, but the product (0.251) collapses, because one bad step sinks a proof. That is the behavior you want.

      :::predict Solution D's steps are each more confident than C's. Which gets the higher product score?
      C, with 0.729 against D's 0.599. Every extra step multiplies in a number below 1, so the product quietly favors short solutions. The minimum (0.95 against 0.90) ranks them the other way. Choosing how to combine step scores is itself a design decision.
      :::

      Earlier, a DeepMind team (Uesato et al., 2022) compared the two kinds of feedback on GSM8K. Outcome and process supervision reached similar final-answer error rates. But among solutions with correct final answers, keeping reasoning errors low needed process feedback, or a reward model that imitated it. Their best system cut that rate from the previous best of 14.0% to 3.4%.
    bridges: []
  - id: process-and-outcome-rewards.s3
    title: Process labels without human labelers
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.process-and-outcome-rewards
    markdown: |-
      Human step labels are expensive: 800,000 of them for one dataset. Math-Shepherd (Wang et al., 2023) labels steps automatically. From each step, a "completer" model finishes the solution $N = 8$ times, and the final answers are checked. The step's **soft label** is the fraction of completions that reach the right answer; its **hard label** is 1 if any of them do.

      Suppose you run this from step 2 of a solution, and 5 of the 8 completions reach the correct answer. The soft label is $5/8 = 0.625$ and the hard label is 1. A step after which 0 of 8 succeed gets 0 on both, and is probably where things broke.

      Look at what this really measures: *can you still get the right answer from here?* Run it on the 16/64 solution. Every completion after "cross out the 6s" reaches 1/4, so the invalid step scores 8/8. Automatic process labels built from outcomes inherit the outcome reward's blind spot. They're good at finding steps that lead nowhere, and bad at spotting lucky shortcuts.
    bridges: []
  - id: process-and-outcome-rewards.s4
    title: Every scorer becomes a target
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.process-and-outcome-rewards
    markdown: |-
      :::story The boat that never finished the race
      In 2016, OpenAI trained an RL agent on the boat-racing game CoastRunners, where points come from hitting targets along the course. The agent found a lagoon where it could circle forever, hitting three targets as they reappeared. It caught fire, crashed into other boats, and went the wrong way, and it still outscored human players. It never finished the race.
      :::

      A learned PRM is a target too. Suppose a PRM's scores are combined by *averaging* the steps. A solution with steps scoring 0.9 and 0.3 averages 0.6. Now pad it with eight trivially true steps, such as "2 + 2 = 4", each scoring 0.99. The average jumps to $(0.9 + 0.3 + 8 \times 0.99)/10 \approx 0.91$, and the bad step is still there. RL will find that padding. The product rule resists this particular trick, but a learned PRM can still be fooled by steps that merely *look* like the valid steps it was trained on.

      That's why the DeepSeek-R1 report lists the PRM among its unsuccessful attempts. It gave three reasons: a "step" is hard to define in general reasoning, checking an intermediate step is hard (automatic labels are unreliable and human labels don't scale), and a model-based PRM invites reward hacking. The team noted that PRMs still worked well for reranking candidate answers, which is the next lesson's subject.

      :::mixup "Process rewards are strictly better, because they check more."
      They check more *of what they were trained to recognize*. A human-labeled PRM catches the 16/64 trick; a rollout-labeled one scores it 8/8; an averaged one can be padded. An exact-match outcome reward can't be padded at all, though it misses lucky methods.
      :::

      A practical choice: when a reliable answer checker exists and you care about final answers, start with outcome rewards. Add process feedback when people will read or copy the steps, as in a tutor, or when solutions are too long for one bit at the end to guide learning. Either way, keep a held-out check, such as a human-reviewed sample of steps, that isn't the reward you train on.
    bridges: []
  - id: process-and-outcome-rewards.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.process-and-outcome-rewards
    markdown: Some product-of-steps scores to compute, plus a contract analyzer, a children's tutor, and a code reviewer, test whether you can predict what each kind of reward lets through.
    takeaway: |-
      Outcome rewards check the answer and miss lucky methods; process rewards check each step, but only as well as their labels and aggregation allow. Whatever you score becomes the target, so audit it with something you don't train on.
  - id: process-and-outcome-rewards.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.process-and-outcome-rewards
    markdown: |-
      An outcome reward checks the result; a process reward checks the steps. Test whether either can reward an answer that only looks good.
