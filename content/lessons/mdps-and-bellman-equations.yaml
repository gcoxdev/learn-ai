scenes:
- id: mdps-and-bellman-equations.s1
  title: State the Markov assumption
  type: explanation
  depth: intuition
  objective_refs:
  - objective.mdps-and-bellman-equations
  markdown: 'A **Markov decision process**, or **MDP**, describes a decision problem using states, actions,
    transition probabilities, rewards, and a decision horizon.


    Its **Markov assumption** says that the current state and action contain the information needed to describe
    the distribution of the next state and reward. Earlier history adds nothing further once that state is
    known.


    A state representation can fail this assumption. For example, a moving cart''s position alone may not be
    enough to predict its next position if its speed is missing.'
  text_mode: 'A **Markov decision process**, or **MDP**, describes a decision problem using states, actions,
    transition probabilities, rewards, and a decision horizon.


