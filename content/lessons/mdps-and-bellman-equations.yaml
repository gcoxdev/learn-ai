schema_version: 0.2-draft
lesson:
  id: mdps-and-bellman-equations
  version: 0.4.0-draft
  title: Relate the value of a state to its next step
  state: draft
  summary: How much is it worth to be standing on a slippery rug two moves from the dock? One equation answers that for every square at once, and it powers nearly all of RL.
  slot: M24.3
  category: learning
  sources:
    - title: "Reinforcement Learning: An Introduction, 2nd edition, chapters 3–4 (Sutton & Barto, 2018)"
      url: http://incompleteideas.net/book/the-book-2nd.html
    - title: Dive into Deep Learning — reinforcement learning
      url: https://d2l.ai/chapter_reinforcement-learning/index.html
objectives:
  - id: objective.mdps-and-bellman-equations
    version: 2-draft
    statement: A Markov decision process specifies states, actions, transitions, and rewards; Bellman equations connect immediate reward to discounted future value and support planning when the model is known.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - mdps-and-bellman-equations.base.v2
      - mdps-and-bellman-equations.transfer.v2
      - mdps-and-bellman-equations.calculate
    prerequisites:
      - anyOf:
          - objective.reinforcement-learning-loop
      - anyOf:
          - objective.planning-under-uncertainty
scenes:
  - id: mdps-and-bellman-equations.s1
    title: Pip's hallway, written down exactly
    type: explanation
    depth: intuition
    objective_refs:
      - objective.mdps-and-bellman-equations
    markdown: |-
      Pip's hallway has three squares in a row: the Door, a Rug, then the Dock. From the Door, "forward" always reaches the Rug. On the Rug the wheels slip: "forward" reaches the Dock 80% of the time and leaves Pip on the Rug 20% of the time. From the Rug, Pip can also go "back" to the Door. Every move costs −1, except the move onto the Dock, which earns +10 and ends the episode. We use $\gamma = 0.9$.

      That description is a complete **Markov decision process (MDP)**, the standard way to write down a sequential decision problem:

      | Part | Symbol | Pip's hallway |
      | --- | --- | --- |
      | States | $\mathcal{S}$ | Door, Rug, Dock |
      | Actions | $\mathcal{A}$ | forward, back |
      | Transition probabilities | $p(s' \mid s, a)$ | Rug + forward → Dock 0.8, Rug 0.2 |
      | Rewards | $r$ | −1 per move, +10 for docking |
      | Discount | $\gamma$ | 0.9 |

      The word *Markov* names one assumption: the next state and reward depend only on the current state and action, not on how Pip got here. It would break if a slip left a wet patch that made the *next* try slipperier. Then "on the Rug" wouldn't predict what happens next. The usual fix is to put the missing information ("slipped last time") into the state.
    bridges: []
  - id: mdps-and-bellman-equations.s2
    title: A state's value is one step plus the rest
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.mdps-and-bellman-equations
    markdown: |-
      Take the simple policy "always go forward". How good is it to be on the Rug? The **value** of a state under a policy, $v_\pi(s)$, is the expected return from that state if you follow the policy. The recursive return from the first lesson, $G_t = R_{t+1} + \gamma G_{t+1}$, turns into a recursive equation for values.

      From the Rug, 80% of the time Pip earns +10 and stops. 20% of the time it earns −1 and is back on the Rug, facing the same future:

      $$v(\text{Rug}) = 0.8 \times 10 + 0.2 \times (-1 + 0.9\, v(\text{Rug}))$$

      So $v = 7.8 + 0.18\,v$, which gives $0.82\,v = 7.8$ and $v(\text{Rug}) \approx 9.512$. The Door is one certain move behind it: $v(\text{Door}) = -1 + 0.9 \times 9.512 \approx 7.561$.

      :::papers The Bellman expectation equation
      $$v_\pi(s) = \sum_a \pi(a \mid s) \sum_{s',\,r} p(s', r \mid s, a)\,\big[r + \gamma\, v_\pi(s')\big]$$

      Average over the actions the policy picks ($\pi$ always picks forward here), then over what the world does ($0.8$ to the Dock, $0.2$ back to the Rug). Each bracket is one step's reward plus the discounted value of where you land, exactly the two terms in our Rug calculation.
      :::

      :::predict The Rug gets wetter and forward now succeeds only half the time. What is v(Rug)?
      $v = 0.5 \times 10 + 0.5 \times (-1 + 0.9\,v) = 4.5 + 0.45\,v$, so $v = 4.5 / 0.55 \approx 8.18$, and $v(\text{Door}) = -1 + 0.9 \times 8.18 \approx 6.36$. Slipping costs a little each time, but Pip still expects to dock.
      :::

      :::mixup "The Door is worth −1, because moving from it costs −1."
      That's its reward, not its value. Reward scores one step; value adds up everything expected afterwards. The Door earns −1 on the next move, but it is worth about 7.56, because the dock lies ahead.
      :::
    bridges:
      - probability
  - id: mdps-and-bellman-equations.s3
    title: Value iteration, one sweep at a time
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.mdps-and-bellman-equations
    markdown: |-
      So far we valued a policy we chose. To find the *best* policy, replace the average over actions with a maximum. That gives the **Bellman optimality equation**:

      $$v_*(s) = \max_a \sum_{s',\,r} p(s', r \mid s, a)\,\big[r + \gamma\, v_*(s')\big]$$

      **Value iteration** turns that equation into an algorithm. Start with every value at 0. Then sweep through the states, replacing each value with the right-hand side computed from the previous sweep's values. Each replacement is called a **backup**.

      | Sweep | $V(\text{Door})$ | $V(\text{Rug})$ | How $V(\text{Rug})$ was computed |
      | ---: | ---: | ---: | --- |
      | 0 | 0 | 0 | start |
      | 1 | −1 | 7.8 | forward: $0.8 \times 10 + 0.2 \times (-1 + 0.9 \times 0)$; back gives only −1 |
      | 2 | 6.02 | 9.204 | forward: $8 + 0.2 \times (-1 + 0.9 \times 7.8)$ |
      | 3 | 7.284 | 9.457 | forward: $8 + 0.2 \times (-1 + 0.9 \times 9.204)$ |
      | ∞ | 7.561 | 9.512 | the values stop changing |

      The values climb toward the numbers we solved for directly, and the action achieving each maximum is the best action. The code runs thirty sweeps.

      ```python run
      gamma = 0.9
      # model[state][action] = list of (probability, reward, next_state)
      model = {
          "Door": {"forward": [(1.0, -1, "Rug")]},
          "Rug":  {"forward": [(0.8, 10, "Dock"), (0.2, -1, "Rug")],
                   "back":    [(1.0, -1, "Door")]},
      }
      V = {"Door": 0.0, "Rug": 0.0, "Dock": 0.0}   # the dock is terminal: value 0

      def backup(s, a, V):
          return sum(p * (r + gamma * V[s2]) for p, r, s2 in model[s][a])

      for sweep in range(1, 31):
          V = {**V, **{s: max(backup(s, a, V) for a in model[s]) for s in model}}
          if sweep <= 3 or sweep == 30:
              print(f"sweep {sweep:2d}: V(Door) = {V['Door']:.3f}   V(Rug) = {V['Rug']:.3f}")

      policy = {s: max(model[s], key=lambda a: backup(s, a, V)) for s in model}
      print("greedy policy:", policy)
      ```

      Try changing the 0.8 to 0.1 and the 0.2 to 0.9. Forward stays best, but V(Door) turns negative: the dock is barely worth the trip.
    bridges: []
  - id: mdps-and-bellman-equations.s5
    title: "Policy iteration: judge the plan, then fix it"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.mdps-and-bellman-equations
    markdown: |-
      **Policy iteration** alternates two steps until the policy stops changing: **evaluate** the current policy (solve its Bellman expectation equation), then **improve** it by picking, in each state, the action with the best one-step lookahead.

      Suppose Pip starts out timid: forward at the Door, but *back* on the Rug, because it fears slipping.

      1. **Evaluate.** Pip shuttles Door → Rug → Door forever at −1 per move. Both values satisfy $v = -1 + 0.9\,v$, so $v(\text{Door}) = v(\text{Rug}) = -10$.
      2. **Improve.** On the Rug, forward is worth $0.8 \times 10 + 0.2 \times (-1 + 0.9 \times (-10)) = 8 - 2 = 6$. Back is worth $-1 + 0.9 \times (-10) = -10$. Switch to forward.
      3. **Evaluate again.** This is the always-forward policy: $v(\text{Rug}) = 9.512$, $v(\text{Door}) = 7.561$.
      4. **Improve again.** Forward on the Rug: 9.512. Back: $-1 + 0.9 \times 7.561 = 5.805$. No change, so the policy is optimal.

      Two rounds, done. Policy iteration typically needs few rounds, though each evaluation costs more than a value-iteration sweep.

      :::story Where "Bellman" comes from
      Richard Bellman developed dynamic programming at the RAND Corporation in the 1950s: solve a long decision problem by breaking it into one-step problems that share answers. The equations in this lesson carry his name.
      :::
    bridges: []
  - id: mdps-and-bellman-equations.s4
    title: Planning needs the map
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.mdps-and-bellman-equations
    markdown: |-
      Look at what every backup used: the exact probabilities 0.8 and 0.2, and the exact rewards. Value iteration and policy iteration are **dynamic programming** methods, and they are *planning* methods: they compute the best policy from a known model, without Pip taking a single real step.

      A real Pip on a new rug doesn't know the 0.8. It only experiences slips and successes one at a time. The next lesson's methods, temporal-difference learning and Q-learning, use the same Bellman equation but replace the known probabilities with sampled transitions: "on the Rug, went forward, slipped, got −1."

      So with any new sequential problem, ask first: do I know $p(s' \mid s, a)$? If you do (board games, a simulator you wrote), plan with dynamic programming. If not, learn from experience.
    bridges: []
  - id: mdps-and-bellman-equations.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.mdps-and-bellman-equations
    markdown: A few Bellman backups to compute by hand, plus a warehouse, a dice game, and an elevator, test whether you can value a state and tell when planning is possible.
    takeaway: |-
      A state's value is the expected reward for the next step plus γ times the value of where you land. With a known model, value iteration or policy iteration solves that equation for the best policy.
  - id: mdps-and-bellman-equations.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.mdps-and-bellman-equations
    markdown: |-
      Bellman equations connect a state’s value to immediate reward and discounted future value. With known transitions and rewards, those relationships support planning.
