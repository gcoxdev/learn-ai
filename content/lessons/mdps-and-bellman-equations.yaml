scenes:
- id: mdps-and-bellman-equations.s1
  title: State the Markov assumption
  type: explanation
  depth: intuition
  objective_refs:
  - objective.mdps-and-bellman-equations
  markdown: In an MDP, the current state and action determine the distribution of the next state and reward without
    needing the full earlier history. A poor state representation can violate this assumption. The environment model
    includes transitions, rewards, and the decision horizon.
  text_mode: In an MDP, the current state and action determine the distribution of the next state and reward without
    needing the full earlier history. A poor state representation can violate this assumption. The environment model
    includes transitions, rewards, and the decision horizon.
  bridges: []
- id: mdps-and-bellman-equations.s2
  title: Decompose value recursively
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mdps-and-bellman-equations
  markdown: A policy’s state value is expected immediate reward plus discounted value of the next state under that
    policy. For a deterministic move with reward two, next-state value four, and gamma one-half, the backed-up value
    is four. Expectations handle multiple possible outcomes.
  text_mode: A policy’s state value is expected immediate reward plus discounted value of the next state under that
    policy. For a deterministic move with reward two, next-state value four, and gamma one-half, the backed-up value
    is four. Expectations handle multiple possible outcomes.
  bridges:
  - probability
- id: mdps-and-bellman-equations.s3
  title: Improve choices with dynamic programming
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mdps-and-bellman-equations
  markdown: Policy evaluation estimates values for a fixed policy. Policy improvement chooses better actions using
    those values. Value iteration repeatedly applies an optimality backup that maximizes over actions. Convergence
    claims depend on assumptions such as finite spaces and discounted returns.
  text_mode: Policy evaluation estimates values for a fixed policy. Policy improvement chooses better actions using
    those values. Value iteration repeatedly applies an optimality backup that maximizes over actions. Convergence
    claims depend on assumptions such as finite spaces and discounted returns.
  bridges: []
- id: mdps-and-bellman-equations.s4
  title: Distinguish planning from learning a model
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mdps-and-bellman-equations
  markdown: Dynamic programming assumes access to the required transition and reward information. Model-free learning
    estimates useful quantities from experience instead. A Bellman equation defines a relationship; an implementation
    still needs data, representation, and a numerically specified update procedure.
  text_mode: Dynamic programming assumes access to the required transition and reward information. Model-free learning
    estimates useful quantities from experience instead. A Bellman equation defines a relationship; an implementation
    still needs data, representation, and a numerically specified update procedure.
  bridges: []
