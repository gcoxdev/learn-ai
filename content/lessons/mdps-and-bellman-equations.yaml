- id: mdps-and-bellman-equations.s2
  title: Decompose value recursively
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mdps-and-bellman-equations
  markdown: 'A policy''s **state value** is the expected return from starting in that state and following the
    policy. The Bellman relationship splits it into immediate reward plus discounted value of the next state.


    With a certain reward of 2, a certain next-state value of 4, and discount γ = 0.5, the calculation is 2
    + 0.5 × 4 = 4.


    If the next value is instead 4 or 0 with equal probability, its expected value is 0.5 × 4 + 0.5 × 0 = 2.
    The calculation becomes 2 + 0.5 × 2 = 3. Recomputing an estimate from possible next steps is called a **backup**.
    This lets a long decision problem be addressed through repeated one-step calculations.'
  text_mode: 'A policy''s **state value** is the expected return from starting in that state and following
