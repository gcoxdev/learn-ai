assessment_families:
  - id: mdps-and-bellman-equations.base
    objective_ref: objective.mdps-and-bellman-equations
    task: base
    response_type: single_choice
    points: 1
    hint: 'Decompose value recursively: trace the inputs, operation, and result before choosing.'
    remediation_scene: mdps-and-bellman-equations.s2
    variants:
      - id: mdps-and-bellman-equations.base.1
        prompt: Reward 2 plus discount 0.5 times next value 4 equals what?
        options:
          - id: a
            text: '4'
          - id: b
            text: '6'
          - id: c
            text: '3'
        answer: a
        feedback: The discounted future contribution is two.
        retired: true
      - id: mdps-and-bellman-equations.base.2
        prompt: What is the Markov assumption about?
        options:
          - id: b
            text: Whether the model uses a transformer
          - id: c
            text: Whether rewards are always positive
          - id: a
            text: Conditional dependence on current state and action
        answer: a
        feedback: The chosen state should summarize relevant history.
        retired: true
  - id: mdps-and-bellman-equations.transfer
    objective_ref: objective.mdps-and-bellman-equations
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Distinguish planning from learning a model: trace the inputs, operation, and result before choosing.'
    remediation_scene: mdps-and-bellman-equations.s4
    variants:
      - id: mdps-and-bellman-equations.transfer.1
        prompt: Policy evaluation holds what fixed?
        options:
          - id: b
            text: Every possible state value forever
          - id: c
            text: The next action’s name only
          - id: a
            text: The policy being valued
        answer: a
        feedback: It estimates consequences of a specified decision rule.
        retired: true
      - id: mdps-and-bellman-equations.transfer.2
        prompt: What does model-based dynamic programming require?
        options:
          - id: c
            text: No environment information
          - id: a
            text: The transition and reward model needed for its backups
          - id: b
            text: Only a final score
        answer: a
        feedback: Expected backups need modeled outcomes.
        retired: true
  - id: mdps-and-bellman-equations.base.v2
    objective_ref: objective.mdps-and-bellman-equations
    task: base
    response_type: single_choice
    points: 1
    hint: "Separate the pieces: reward is one step, value is everything expected after it; the expectation equation averages over the policy's actions, the optimality equation takes the max."
    remediation_scene: mdps-and-bellman-equations.s2
    variants:
      - id: mdps-and-bellman-equations.base.v2.1
        prompt: In Pip's hallway, the Door's next move always costs −1, yet v(Door) ≈ 7.56 under the always-forward policy. Why the difference?
        options:
          - id: b
            text: The discount factor turns the −1 into a positive number
          - id: a
            text: Value counts the expected docking reward that follows the move
          - id: c
            text: The −1 is only charged when Pip slips on the Rug
        answer: a
        feedback: Reward scores one step; value is the expected discounted sum of all later rewards, including the +10 at the dock. Discounting shrinks rewards but never flips their sign, and every move costs −1, not just slips.
      - id: mdps-and-bellman-equations.base.v2.2
        prompt: What does the Bellman optimality equation do that the Bellman expectation equation does not?
        options:
          - id: a
            text: It takes the maximum over actions instead of averaging over a policy
          - id: b
            text: It drops the discount factor so that future rewards count fully
          - id: c
            text: It ignores the transition probabilities and assumes success
        answer: a
        feedback: Both equations average over what the world does next and both discount. The expectation version weights actions by a fixed policy π; the optimality version picks the best action with a max.
      - id: mdps-and-bellman-equations.base.v2.3
        prompt: "During policy iteration, a policy is evaluated and then improved, and the improvement step changes nothing. What can you conclude?"
        options:
          - id: c
            text: The evaluation step must have a bug, since values should change
          - id: b
            text: Another round of improvement is needed before it can change
          - id: a
            text: The current policy is already optimal for this MDP
        answer: a
        feedback: If no state's best one-step lookahead action differs from the current action, the policy satisfies the Bellman optimality equation, so it is optimal. Repeating the improvement on the same values would give the same answer.
      - id: mdps-and-bellman-equations.base.v2.4
        prompt: A robot's state records its position but not its speed, and a fast robot slides farther than a slow one after the same command. Which MDP assumption is broken?
        options:
          - id: a
            text: The Markov assumption, since position alone can't predict the next state
          - id: b
            text: The discount assumption, since speed makes rewards arrive sooner
          - id: c
            text: The reward assumption, since sliding should cost more battery
        answer: a
        feedback: Two situations with the same recorded state lead to different next states, so the past (how fast it was going) still matters. The usual fix is to add speed to the state. Discount and reward choices don't cause this.
  - id: mdps-and-bellman-equations.transfer.v2
    objective_ref: objective.mdps-and-bellman-equations
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask whether the transition probabilities are known. If they are, you can plan with backups; if not, you need experience.
    remediation_scene: mdps-and-bellman-equations.s4
    variants:
      - id: mdps-and-bellman-equations.transfer.v2.1
        prompt: A board game uses two fair dice and fixed rules, and you want the best move in every position. Which approach fits?
        options:
          - id: b
            text: Play thousands of games first, since dice make the model unknown
          - id: a
            text: Plan with value iteration, since the dice probabilities are known
          - id: c
            text: Use a bandit, since each roll is independent of the last one
        answer: a
        feedback: Randomness doesn't mean the model is unknown. Fair dice have exact probabilities, so backups can use them directly. A bandit would ignore how moves change the board position.
      - id: mdps-and-bellman-equations.transfer.v2.2
        prompt: A warehouse manager models restocking as an MDP with state "items on the shelf". Deliveries arrive two days after an order. Why might this state break the Markov assumption?
        options:
          - id: a
            text: Orders already on the way affect tomorrow's stock but aren't in the state
          - id: b
            text: Restocking rewards are delayed, and MDPs require immediate rewards
          - id: c
            text: The shelf count changes every day, so it cannot be a state
        answer: a
        feedback: Two days with the same shelf count can lead to different futures depending on pending orders, so the state should include them. MDPs handle delayed rewards through the return, and states are expected to change.
      - id: mdps-and-bellman-equations.transfer.v2.3
        prompt: An engineer is building an elevator controller for a new tower. She knows the building layout but has no data on when people arrive at each floor. What does she need before value iteration can run?
        options:
          - id: c
            text: A larger discount factor, so rare arrivals still count
          - id: a
            text: A model of arrival probabilities, estimated or assumed
          - id: b
            text: A neural network to replace the Bellman equation
        answer: a
        feedback: Every backup averages over next states using p(s′|s,a). Without arrival probabilities, there is nothing to average. Changing γ or adding a network doesn't supply the missing model.
      - id: mdps-and-bellman-equations.transfer.v2.4
        prompt: "A value-iteration run on a delivery robot's map gives v(A) = 12 and v(B) = 5. From state C, action 1 leads to A and action 2 leads to B, each with certainty and reward −1, and γ = 0.9. Which action is best at C?"
        options:
          - id: a
            text: Action 1, since −1 + 0.9 × 12 beats −1 + 0.9 × 5
          - id: b
            text: Action 2, since B's lower value means less risk
          - id: c
            text: Either one, since both actions cost −1 right now
        answer: a
        feedback: The best action maximizes reward plus discounted next value, 9.8 versus 3.5. Equal immediate rewards don't make actions equal, and a lower value means a worse expected future, not a safer one.
  - id: mdps-and-bellman-equations.calculate
    objective_ref: objective.mdps-and-bellman-equations
    task: base
    response_type: numeric
    points: 1
    hint: For each possible outcome, add its reward to γ times the value of the state you land in, then weight by the outcome's probability and add.
    remediation_scene: mdps-and-bellman-equations.s2
    absolute_tolerance: 0.01
    variants:
      - id: mdps-and-bellman-equations.calculate.1
        prompt: An action leads with certainty to a state worth 8, with reward −1. With γ = 0.9, what is the backed-up value of taking it?
        answer: 6.2
        feedback: −1 + 0.9 × 8 = −1 + 7.2 = 6.2.
      - id: mdps-and-bellman-equations.calculate.2
        prompt: On the Rug, forward reaches the Dock (reward +10, value 0) with probability 0.8, and stays on the Rug (reward −1) with probability 0.2. The current estimate V(Rug) is 5 and γ = 0.9. What is the backed-up value of forward?
        answer: 8.7
        feedback: 0.8 × 10 + 0.2 × (−1 + 0.9 × 5) = 8 + 0.2 × 3.5 = 8 + 0.7 = 8.7.
      - id: mdps-and-bellman-equations.calculate.3
        prompt: An action gives reward 2 and then lands in a state worth 4 or a state worth 0, each with probability 0.5. With γ = 0.5, what is its backed-up value?
        answer: 3
        feedback: The expected next value is 0.5 × 4 + 0.5 × 0 = 2, so the backup is 2 + 0.5 × 2 = 3.
      - id: mdps-and-bellman-equations.calculate.4
        prompt: A policy keeps an agent in the same state forever, earning −1 every step, with γ = 0.9. Solve v = −1 + 0.9 v. What is v?
        answer: -10
        feedback: v − 0.9v = −1, so 0.1v = −1 and v = −10. This is the timid shuttling policy from the policy-iteration example.
      - id: mdps-and-bellman-equations.calculate.5
        prompt: In value iteration on Pip's hallway, the previous sweep gave V(Rug) = 7.8 and V(Door) = −1. Compute the next sweep's V(Rug), taking the max of forward (0.8 to the Dock for +10; 0.2 slip for −1 back to the Rug) and back (−1 to the Door), with γ = 0.9.
        answer: 9.204
        feedback: Forward is 0.8 × 10 + 0.2 × (−1 + 0.9 × 7.8) = 8 + 1.204 = 9.204. Back is −1 + 0.9 × (−1) = −1.9. The max is 9.204.
