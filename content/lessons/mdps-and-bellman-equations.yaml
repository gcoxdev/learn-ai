schema_version: 0.2-draft
lesson:
  id: mdps-and-bellman-equations
  version: 0.1.0-draft
  title: Relate the value of a state to its next step
  state: draft
  summary: A Markov decision process specifies states, actions, transitions, and rewards; Bellman equations connect
    immediate reward to discounted future value and support planning when the model is known.
  slot: M24.3
  category: learning
  minutes: 12
  sources:
  - title: Dive into Deep Learning — reinforcement learning
    url: https://d2l.ai/chapter_reinforcement-learning/index.html
objectives:
- id: objective.mdps-and-bellman-equations
  version: 1-draft
  statement: A Markov decision process specifies states, actions, transitions, and rewards; Bellman equations connect
    immediate reward to discounted future value and support planning when the model is known.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - mdps-and-bellman-equations.base
  - mdps-and-bellman-equations.transfer
  prerequisites:
  - anyOf:
    - objective.reinforcement-learning-loop
  - anyOf:
