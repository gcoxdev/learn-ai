    + 0.5 × 4 = 4.


    If the next value is instead 4 or 0 with equal probability, its expected value is 0.5 × 4 + 0.5 × 0 = 2.
    The calculation becomes 2 + 0.5 × 2 = 3. Recomputing an estimate from possible next steps is called a **backup**.
    This lets a long decision problem be addressed through repeated one-step calculations.'
  bridges:
  - probability
- id: mdps-and-bellman-equations.s3
  title: Improve choices with dynamic programming
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mdps-and-bellman-equations
  markdown: Policy evaluation estimates values for a fixed policy. Policy improvement chooses better actions
    using those values. Value iteration repeatedly applies an optimality backup that maximizes over actions.
    Convergence claims depend on assumptions such as finite spaces and discounted returns.
  text_mode: Policy evaluation estimates values for a fixed policy. Policy improvement chooses better actions
    using those values. Value iteration repeatedly applies an optimality backup that maximizes over actions.
    Convergence claims depend on assumptions such as finite spaces and discounted returns.
  bridges: []
- id: mdps-and-bellman-equations.s4
  title: Distinguish planning from learning a model
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mdps-and-bellman-equations
  markdown: Dynamic programming assumes access to the required transition and reward information. Model-free
    learning estimates useful quantities from experience instead. A Bellman equation defines a relationship;
    an implementation still needs data, representation, and a numerically specified update procedure.
  text_mode: Dynamic programming assumes access to the required transition and reward information. Model-free
    learning estimates useful quantities from experience instead. A Bellman equation defines a relationship;
    an implementation still needs data, representation, and a numerically specified update procedure.
  bridges: []
