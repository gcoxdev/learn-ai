schema_version: 0.2-draft
lesson:
  id: research-reporting
  version: 0.2.0-draft
  title: Make the result possible to inspect
  state: draft
  summary: Write a result clearly enough that someone else can check what was tested and what remains uncertain.
  slot: M09.8
  category: learning
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.research-reporting
  version: 1-draft
  statement: Research reporting should preserve methods, data and evaluation conditions, uncertainty, failures,
    and limitations so others can assess or reproduce the claim.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - research-reporting.base
  - research-reporting.transfer
  prerequisites:
  - anyOf:
    - objective.controlled-experiments
  - anyOf:
    - objective.randomness-reproducibility
scenes:
- id: research-reporting.s1
  title: A result is more than a headline
  type: explanation
  depth: intuition
  objective_refs:
  - objective.research-reporting
  markdown: 'A useful report states the question, method, data, comparison, metrics, and evidence. Include
    the training and inference conditions needed to interpret performance. A benchmark score without its version,
    split, prompt or preprocessing, and evaluation script can be difficult to reproduce or compare.


    Try a small report card: “On 100 held-out library questions, version A answered 80 correctly and B answered
    84. Both received the same documents and had a two-second response limit. We selected B using a separate
    validation set.” Add the four paired improvement/error cases, data source, exact versions and scoring instructions.
    Someone else can now ask meaningful questions about the result.'
  text_mode: 'A useful report states the question, method, data, comparison, metrics, and evidence. Include
    the training and inference conditions needed to interpret performance. A benchmark score without its version,
    split, prompt or preprocessing, and evaluation script can be difficult to reproduce or compare.


    Try a small report card: “On 100 held-out library questions, version A answered 80 correctly and B answered
    84. Both received the same documents and had a two-second response limit. We selected B using a separate
    validation set.” Add the four paired improvement/error cases, data source, exact versions and scoring instructions.
    Someone else can now ask meaningful questions about the result.'
  bridges: []
- id: research-reporting.s2
  title: Distinguish forms of repetition
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.research-reporting
  markdown: Re-running shared code under similar conditions tests computational repeatability. An independent
    implementation tests a different set of dependencies. A new population or task tests external validity.
    These activities can reveal different failures, so say which kind of reproduction was attempted.
  text_mode: Re-running shared code under similar conditions tests computational repeatability. An independent
    implementation tests a different set of dependencies. A new population or task tests external validity.
    These activities can reveal different failures, so say which kind of reproduction was attempted.
  bridges: []
- id: research-reporting.s3
  title: Keep negative and inconvenient evidence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.research-reporting
  markdown: A method that fails on a subgroup or only works under one seed has a narrower claim than a single
    average suggests. Record failed runs and excluded cases with reasons. A negative result can rule out an
    appealing explanation or expose a missing condition, even when it does not produce a leaderboard improvement.
  text_mode: A method that fails on a subgroup or only works under one seed has a narrower claim than a single
    average suggests. Record failed runs and excluded cases with reasons. A negative result can rule out an
    appealing explanation or expose a missing condition, even when it does not produce a leaderboard improvement.
  bridges: []
- id: research-reporting.s4
  title: Write a limitations section that changes interpretation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.research-reporting
  markdown: 'Name unsupported populations, confounded comparisons, resource limits, and untested assumptions.
    Explain which conclusions are observations and which are hypotheses. Link artifacts and licenses where
    release is possible, and distinguish unavailable information from evidence of absence. Clear limitations
    make a result more usable, not less scientific.


    An **observation** is “B answered four more questions correctly in this test.” An **explanation to investigate**
    is “the new retrieval step caused the improvement.” If other settings also changed, the observation does
    not isolate that cause. A useful limitation names this gap and the comparison that could resolve it.'
  text_mode: 'Name unsupported populations, confounded comparisons, resource limits, and untested assumptions.
    Explain which conclusions are observations and which are hypotheses. Link artifacts and licenses where
    release is possible, and distinguish unavailable information from evidence of absence. Clear limitations
    make a result more usable, not less scientific.


    An **observation** is “B answered four more questions correctly in this test.” An **explanation to investigate**
    is “the new retrieval step caused the improvement.” If other settings also changed, the observation does
    not isolate that cause. A useful limitation names this gap and the comparison that could resolve it.'
  bridges: []
- id: research-reporting.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.research-reporting
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Research reporting should preserve methods, data and evaluation conditions, uncertainty, failures,
    and limitations so others can assess or reproduce the claim.
- id: research-reporting.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.research-reporting
  markdown: Research reporting should preserve methods, data and evaluation conditions, uncertainty, failures,
    and limitations so others can assess or reproduce the claim.
  text_mode: Research reporting should preserve methods, data and evaluation conditions, uncertainty, failures,
    and limitations so others can assess or reproduce the claim.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - research-reporting.s1
    - research-reporting.s2
    - research-reporting.s3
    - research-reporting.s4
    - research-reporting.check
    gate_refs:
    - gate.core
  scene_aliases:
    research-reporting.recap: research-reporting.check
assessment_families:
- id: research-reporting.base
  objective_ref: objective.research-reporting
  task: base
  response_type: single_choice
  points: 1
  hint: 'Distinguish forms of repetition: trace the inputs, operation, and result before choosing.'
  remediation_scene: research-reporting.s2
  variants:
  - id: research-reporting.base.1
    prompt: Which detail is needed to compare benchmark scores credibly?
    options:
    - id: c
      text: Only the publication year
    - id: a
      text: The evaluation version and protocol
    - id: b
      text: Only the model nickname
    answer: a
    feedback: Different protocols can turn the same label into different tasks.
  - id: research-reporting.base.2
    prompt: Does rerunning shared code alone establish external validity?
    options:
    - id: a
      text: No; new populations or tasks require separate evidence
    - id: b
      text: Yes; identical output proves universal transfer
    - id: c
      text: Only if the code is short
    answer: a
    feedback: Repeatability and transfer answer different questions.
- id: research-reporting.transfer
  objective_ref: objective.research-reporting
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Write a limitations section that changes interpretation: trace the inputs, operation, and result before
    choosing.'
  remediation_scene: research-reporting.s4
  variants:
  - id: research-reporting.transfer.1
    prompt: A method fails in several seeds but one succeeds. What should be reported?
    options:
    - id: a
      text: The run distribution and selection process
    - id: b
      text: Only the successful run
    - id: c
      text: A claim that randomness was irrelevant
    answer: a
    feedback: Reporting variation prevents a selected success from appearing typical.
  - id: research-reporting.transfer.2
    prompt: What makes a limitation useful?
    options:
    - id: b
      text: It says only “more work is needed”
    - id: c
      text: It replaces all numerical results
    - id: a
      text: It specifies how the evidence restricts interpretation or use
    answer: a
    feedback: A concrete boundary tells readers which claims remain unsupported.
