schema_version: 0.2-draft
lesson:
  id: research-reporting
  version: 0.4.0-draft
  title: Make the result possible to inspect
  state: draft
  summary: Split ten runs of the same algorithm into two groups of five, and the groups can look like different algorithms. Learn to report results that someone else can rerun, check, and trust.
  slot: M09.8
  category: learning
  sources:
    - title: "Deep Reinforcement Learning that Matters (Henderson et al., 2018)"
      url: https://arxiv.org/abs/1709.06560
    - title: "Improving Reproducibility in Machine Learning Research (Pineau et al., 2021)"
      url: https://jmlr.org/papers/v22/20-303.html
    - title: "Leakage and the reproducibility crisis in machine-learning-based science (Kapoor & Narayanan, 2023)"
      url: https://doi.org/10.1016/j.patter.2023.100804
    - title: "Model Cards for Model Reporting (Mitchell et al., 2019)"
      url: https://arxiv.org/abs/1810.03993
    - title: "Datasheets for Datasets (Gebru et al.)"
      url: https://arxiv.org/abs/1803.09010
objectives:
  - id: objective.research-reporting
    version: 2-draft
    statement: Research reporting should preserve methods, data and evaluation conditions, uncertainty, failures, and limitations so others can assess or reproduce the claim.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - research-reporting.base.v2
      - research-reporting.transfer.v2
      - research-reporting.calculate
    prerequisites:
      - anyOf:
          - objective.controlled-experiments
      - anyOf:
          - objective.randomness-reproducibility
scenes:
  - id: research-reporting.s1
    title: A result is more than a headline
    type: explanation
    depth: intuition
    objective_refs:
      - objective.research-reporting
    markdown: |-
      The math-tutor team from the controlled experiments lesson is writing up its result. Its first attempt says: *"Our step-by-step prompt improves accuracy by 3 points."* A skeptical reader can't check a single part of that sentence. Accuracy on what? Compared with what? How sure are you?

      The rewrite:

      > On 500 held-out grade-school word problems (benchmark version 1.2, test split, scored by exact match of the final number), the step-by-step prompt solved 370 and the plain prompt 355, both on the same small model with identical sampling settings. Paired 95% bootstrap interval for the difference: +0.4 to +5.6 points. Prompts, per-problem outputs, and the scoring script are linked below.

      Each piece answers a question a reader would otherwise have to guess:

      | Piece of the report | Why a reader needs it |
      | --- | --- |
      | Data, version, and split | The same benchmark name can mean different questions |
      | The comparison and what was held fixed | Rules out rival explanations |
      | Metric and scoring script | "Correct" can be judged in many ways |
      | Interval or spread over runs | Says whether 3 points is signal or noise |
      | Per-example outputs and code | Let someone recheck or rerun it |
    bridges: []
  - id: research-reporting.s2
    title: Repeat, reproduce, replicate
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.research-reporting
    markdown: |-
      "We reproduced it" can mean very different things. Each kind of repetition catches a different failure:

      | Who reruns it | With what | What a success shows | What a failure catches |
      | --- | --- | --- | --- |
      | You, again | Same code, data, seeds | The run is **repeatable** | Hidden randomness, an unsaved setting |
      | Another team | Your code and data | The result is **reproducible** | Missing steps, environment quirks |
      | Another team | New data or their own code | The finding **replicates** | A result tied to one dataset or one bug |

      Fields use these words inconsistently, so say which one you mean: "we reran the authors' released code on their data" is clear. ImageNet-v2, from the generalization lesson, was a replication: new images collected by the original recipe.
    bridges: []
  - id: research-reporting.s3
    title: Five seeds, and the reproducibility crisis
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.research-reporting
    markdown: |-
      In 2018, Peter Henderson and colleagues ran the same reinforcement-learning algorithm with ten random seeds and split the runs into two groups of five. The two groups' average learning curves differed enough to look like two different algorithms. Different public implementations of the "same" algorithm also gave very different results. Many papers of the time reported fewer than five runs, and some reported only the best ones.

      This is one strand of what's called the **reproducibility crisis** in machine learning: published results that others couldn't reproduce or that shrank on a second look. Another strand is leakage (test information reaching training): Sayash Kapoor and Arvind Narayanan (2023) gathered published reports of leakage errors affecting hundreds of machine-learning papers in 17 scientific fields.

      The program shows how much a single reported run can mislead.

      ```python run
      import numpy as np

      baseline = np.array([71.0, 72.4, 70.2, 71.8, 70.6])   # accuracy (%) with seeds 1-5
      new      = np.array([70.4, 73.9, 71.1, 72.0, 71.6])   # same seeds, new method

      print(f"baseline mean {baseline.mean():.1f}  sd {baseline.std(ddof=1):.2f}")
      print(f"new      mean {new.mean():.1f}  sd {new.std(ddof=1):.2f}")
      print(f"best new seed vs baseline mean: {new.max() - baseline.mean():+.1f} points")
      print(f"mean vs mean:                   {new.mean() - baseline.mean():+.1f} points")
      ```

      Reporting the new method's best seed against the baseline's average claims +2.7 points. The honest comparison is +0.6, smaller than either method's seed-to-seed spread (a **standard deviation** of 0.89 and 1.32). Report every run, the mean and spread, and how any single run was chosen.

      :::mixup "A failed run is a bug, so it's fine to leave it out."
      Sometimes it is a bug; then fix it and rerun *all* the seeds. But if a method fails on two seeds in five, that's a fact about the method, and readers need it. Dropping it makes the method look more reliable than it is.
      :::
    bridges: []
  - id: research-reporting.s4
    title: Write limitations a reader can act on
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.research-reporting
    markdown: |-
      Separate what you saw from why you think it happened. An **observation**: "The step-by-step prompt solved 15 more of 500 problems on the small model." An **explanation**: "Writing out intermediate steps reduces arithmetic slips." The experiment supports the first. The second is a hypothesis you could test, for example by counting arithmetic errors in both sets of outputs.

      A useful limitation tells the reader what *not* to do with the result:

      | Vague | Actionable |
      | --- | --- |
      | "More work is needed." | "Tested only on the small model; the large model may gain less." |
      | "Results may not generalize." | "All problems are in English and come from US curricula." |

      Negative results belong in the report too. "Adding worked examples to the prompt didn't help on any of three datasets" saves the next team a month.

      The field now has shared tools for this. Since 2019, NeurIPS has asked authors to complete a reproducibility checklist. **Model cards** (Mitchell et al., 2019) summarize a released model's intended use, evaluation data, and results broken down by group, and **datasheets for datasets** (Gebru et al.) do the same for data. You can use both as templates for your own write-ups.
    bridges: []
  - id: research-reporting.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.research-reporting
    markdown: A rerun of released code, a medical model at a new hospital, five seed scores, and a vague limitations section ask you to name the kind of repetition and report what a skeptic needs.
    takeaway: |-
      Report the data, comparison, metric, and uncertainty clearly enough that someone else could rerun it. Show every run and every failure, and write limitations that tell readers what the result doesn't cover.
  - id: research-reporting.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.research-reporting
    markdown: |-
      Report enough detail for someone else to check the comparison. Include the conditions, uncertainty, failures, and limits that affect what the result means.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - research-reporting.s1
        - research-reporting.s2
        - research-reporting.s3
        - research-reporting.s4
        - research-reporting.check
      gate_refs:
        - gate.core
  scene_aliases:
    research-reporting.recap: research-reporting.check
assessment_families:
  - id: research-reporting.base
    objective_ref: objective.research-reporting
    task: base
    response_type: single_choice
    points: 1
    hint: 'Distinguish forms of repetition: trace the inputs, operation, and result before choosing.'
    remediation_scene: research-reporting.s2
    variants:
      - id: research-reporting.base.1
        prompt: Which detail is needed to compare benchmark scores credibly?
        options:
          - id: c
            text: Only the publication year
          - id: a
            text: The evaluation version and protocol
          - id: b
            text: Only the model nickname
        answer: a
        feedback: Different protocols can turn the same label into different tasks.
        retired: true
      - id: research-reporting.base.2
        prompt: Does rerunning shared code alone establish external validity?
        options:
          - id: a
            text: No; new populations or tasks require separate evidence
          - id: b
            text: Yes; identical output proves universal transfer
          - id: c
            text: Only if the code is short
        answer: a
        feedback: Repeatability and transfer answer different questions.
        retired: true
  - id: research-reporting.transfer
    objective_ref: objective.research-reporting
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Write a limitations section that changes interpretation: trace the inputs, operation, and result before choosing.'
    remediation_scene: research-reporting.s4
    variants:
      - id: research-reporting.transfer.1
        prompt: A method fails in several seeds but one succeeds. What should be reported?
        options:
          - id: a
            text: The run distribution and selection process
          - id: b
            text: Only the successful run
          - id: c
            text: A claim that randomness was irrelevant
        answer: a
        feedback: Reporting variation prevents a selected success from appearing typical.
        retired: true
      - id: research-reporting.transfer.2
        prompt: What makes a limitation useful?
        options:
          - id: b
            text: It says only “more work is needed”
          - id: c
            text: It replaces all numerical results
          - id: a
            text: It specifies how the evidence restricts interpretation or use
        answer: a
        feedback: A concrete boundary tells readers which claims remain unsupported.
        retired: true
  - id: research-reporting.base.v2
    objective_ref: objective.research-reporting
    task: base
    response_type: single_choice
    points: 1
    hint: Match the word to what was reused. Same code and data means repeatable or reproducible; new data or a new implementation means a replication. And every run counts, not just the best one.
    remediation_scene: research-reporting.s2
    variants:
      - id: research-reporting.base.v2.1
        prompt: Another lab reruns your released code on your released data and gets the same numbers. What has this shown?
        options:
          - id: b
            text: That the finding holds for new data and populations
          - id: a
            text: That the result is reproducible from your materials
          - id: c
            text: That your explanation of why it works is correct
        answer: a
        feedback: Rerunning the same code on the same data checks that the computation can be reproduced. Holding up on new data would be a replication, and neither kind of rerun tests your explanation.
      - id: research-reporting.base.v2.2
        prompt: A paper reports 84% on a benchmark. Which detail most changes how you should interpret that number?
        options:
          - id: c
            text: The model's total parameter count
          - id: b
            text: The wall-clock time the training took
          - id: a
            text: The benchmark version, split, and scoring rule
        answer: a
        feedback: The same benchmark name can mean different questions or different rules for "correct," which changes what 84% means. Size and training time matter for cost, not for what the score measures.
      - id: research-reporting.base.v2.3
        prompt: A new method succeeds on 1 of 5 random seeds and fails on the other 4. What should the report show?
        options:
          - id: a
            text: All five runs, and how any featured run was chosen
          - id: b
            text: The successful run, since it shows what's possible
          - id: c
            text: The average of the two best runs, to limit noise
        answer: a
        feedback: One success in five is a fact about the method's reliability. Showing only the best run, or the best two, is selection, and readers would overestimate how often it works.
      - id: research-reporting.base.v2.4
        prompt: Which sentence is an observation rather than an explanation?
        options:
          - id: b
            text: B's retrieval step caused its better answers
          - id: c
            text: B understands the questions better than A
          - id: a
            text: B answered 4 more of 100 questions than A
        answer: a
        feedback: A count under stated conditions is what the experiment directly shows. Saying what caused it, or that the model "understands," is an explanation that needs its own test.
      - id: research-reporting.base.v2.5
        prompt: A published medical model's accuracy drops from 95% to 70% once reviewers find the same patients appear in both training and test data. What went wrong?
        options:
          - id: c
            text: The authors reported an unlucky random seed
          - id: a
            text: Leakage let test information reach training
          - id: b
            text: The patients' condition changed over time
        answer: a
        feedback: Shared patients let the model score well by recognizing people it had already seen, which is leakage. A seed doesn't explain a 25-point drop, and nothing in the story suggests the condition changed.
  - id: research-reporting.transfer.v2
    objective_ref: objective.research-reporting
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what a skeptical reader would need to rerun or re-judge the claim, and write each limitation as something that changes what they would do.
    remediation_scene: research-reporting.s4
    variants:
      - id: research-reporting.transfer.v2.1
        prompt: Which limitation gives readers the most useful guidance?
        options:
          - id: b
            text: More work is needed to fully understand these results.
          - id: a
            text: Tested only on English questions from US textbooks.
          - id: c
            text: Results may be different in some other settings.
        answer: a
        feedback: Naming exactly what was tested tells readers where the claim stops, for example before applying it to another language. The other two are true of every study and change nothing a reader would do.
      - id: research-reporting.transfer.v2.2
        prompt: A team finds its new data-augmentation trick doesn't help on any of three datasets. What should it do with this result?
        options:
          - id: a
            text: Report it with the setups, so others needn't repeat it
          - id: b
            text: Drop it, since a method that didn't help isn't a result
          - id: c
            text: Keep trying seeds until one of the datasets improves
        answer: a
        feedback: A clearly described negative result saves others time and can rule out a tempting idea. Trying seeds until something improves is selection and would produce a misleading positive.
      - id: research-reporting.transfer.v2.3
        prompt: A hospital's sepsis model is tested by a second hospital on its own patients, using a new implementation. Which kind of repetition is this?
        options:
          - id: c
            text: A repeatability check of the original run
          - id: b
            text: A reproduction using the original code and data
          - id: a
            text: A replication on new data with new code
        answer: a
        feedback: New patients and a new implementation make this a replication, the strongest kind, because it catches results tied to one dataset or one codebase. Repeatability and reproduction reuse the original materials.
      - id: research-reporting.transfer.v2.4
        prompt: A reviewer wants to check a claimed 2.1-point improvement. Which added material would help most?
        options:
          - id: b
            text: A higher-resolution version of the main results chart
          - id: a
            text: Per-example predictions and the evaluation script
          - id: c
            text: A longer discussion of related earlier methods
        answer: a
        feedback: Per-example outputs and the scoring script let the reviewer recompute the score, build a paired interval, and look for scoring errors. A sharper chart or more related work doesn't let anyone recheck the number.
  - id: research-reporting.calculate
    objective_ref: objective.research-reporting
    task: base
    response_type: numeric
    points: 1
    hint: Average the five scores first. The overstatement from reporting only the best seed is the best score minus that average.
    remediation_scene: research-reporting.s3
    absolute_tolerance: 0.05
    variants:
      - id: research-reporting.calculate.1
        prompt: A method scores 80, 82, 78, 81, and 79 across five seeds. By how many points would reporting only the best seed overstate its mean?
        answer: 2
        feedback: The mean is 400/5 = 80 and the best is 82, so the best seed overstates the mean by 2 points.
      - id: research-reporting.calculate.2
        prompt: A method scores 64.5, 66.0, 63.0, 65.5, and 66.0 across five seeds. By how many points would reporting only the best seed overstate its mean?
        answer: 1
        feedback: The mean is 325/5 = 65.0 and the best is 66.0, a 1-point overstatement.
      - id: research-reporting.calculate.3
        prompt: A method scores 90.2, 91.0, 89.4, 90.6, and 90.8 across five seeds. By how many points would reporting only the best seed overstate its mean?
        answer: 0.6
        feedback: The mean is 452/5 = 90.4 and the best is 91.0, a 0.6-point overstatement.
      - id: research-reporting.calculate.4
        prompt: A method scores 55, 61, 52, 58, and 54 across five seeds. By how many points would reporting only the best seed overstate its mean?
        answer: 5
        feedback: The mean is 280/5 = 56 and the best is 61, a 5-point overstatement. A wide spread makes the best seed especially misleading.
