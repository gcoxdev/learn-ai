schema_version: 0.2-draft
lesson:
  id: inputs-and-outputs
  version: 0.2.0-draft
  title: 'Inputs and outputs: what goes in and what comes out'
  summary: Follow a picture through a simple sorting program and learn how to separate the job from its instructions
    and result.
  state: draft
  slot: M00.2
  category: common
  minutes: 10
  archetype: foundation
  sources:
  - title: Dive into Deep Learning — introduction
    url: https://d2l.ai/chapter_introduction/index.html
objectives:
- id: objective.inputs-and-outputs
  version: 2-draft
  statement: An input is information a program receives. An output is a result it produces. The instructions explain
    what to do between the two.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - inputs-and-outputs.base
  - inputs-and-outputs.transfer
  prerequisites:
  - anyOf:
    - objective.ai-systems
scenes:
- id: inputs-and-outputs.s1
  title: Give names to the two sides
  type: explanation
  depth: intuition
  objective_refs:
  - objective.inputs-and-outputs
  markdown: 'Imagine showing a computer a picture of a red button. The picture you give it is an **input**: information
    going in. If the computer replies “red,” that answer is an **output**: a result coming out. We can draw the
    trip as picture → program → color word. The arrows mean “is passed to.” They do not mean the computer understands
    a button the way you do. They just help us keep track of the steps.'
  text_mode: 'Imagine showing a computer a picture of a red button. The picture you give it is an **input**: information
    going in. If the computer replies “red,” that answer is an **output**: a result coming out. We can draw the
    trip as picture → program → color word. The arrows mean “is passed to.” They do not mean the computer understands
    a button the way you do. They just help us keep track of the steps.'
- id: inputs-and-outputs.s2
  title: The job and the example are different
  type: explanation
  depth: intuition
  objective_refs:
  - objective.inputs-and-outputs
  markdown: '“Tell me the button’s color” is the job. This particular picture is one input for that job. Tomorrow
    you might supply a blue-button picture while keeping the job the same. You might also keep the red-button picture
    but ask a different job: count the holes instead of naming the color. The same input can support different tasks.
    Always say both what information is supplied and what answer you want back.'
  text_mode: '“Tell me the button’s color” is the job. This particular picture is one input for that job. Tomorrow
    you might supply a blue-button picture while keeping the job the same. You might also keep the red-button picture
    but ask a different job: count the holes instead of naming the color. The same input can support different tasks.
    Always say both what information is supplied and what answer you want back.'
- id: inputs-and-outputs.s3
  title: Read a tiny example without doing mathematics
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.inputs-and-outputs
  markdown: 'A toy program follows a written rule: when it receives the word “hello,” it produces the word “welcome.”
    Input: hello. Instructions: replace hello with welcome. Output: welcome. Sending hello again does not rewrite
    the instructions. This is a useful simple program, but the replacement alone is not evidence that it learned
    a language. We use small examples like this to see a computer’s parts clearly before studying more complicated
    AI.'
  text_mode: 'A toy program follows a written rule: when it receives the word “hello,” it produces the word “welcome.”
    Input: hello. Instructions: replace hello with welcome. Output: welcome. Sending hello again does not rewrite
    the instructions. This is a useful simple program, but the replacement alone is not evidence that it learned
    a language. We use small examples like this to see a computer’s parts clearly before studying more complicated
    AI.'
- id: inputs-and-outputs.s4
  title: Follow a result into another step
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.inputs-and-outputs
  markdown: Now imagine a camera sends a picture to a color finder. The color finder outputs “red.” A separate sorter
    receives that word and moves an arm toward the red pile. “Red” is an output for one step and an input for the
    next. An **action** is something done, such as moving the arm. Producing a word and moving an arm are different
    steps, even when they happen in one machine.
  text_mode: Now imagine a camera sends a picture to a color finder. The color finder outputs “red.” A separate
    sorter receives that word and moves an arm toward the red pile. “Red” is an output for one step and an input
    for the next. An **action** is something done, such as moving the arm. Producing a word and moving an arm are
    different steps, even when they happen in one machine.
- id: inputs-and-outputs.s5
  title: Do not assume the input is complete
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.inputs-and-outputs
  markdown: A photograph shows the visible side of a button. It may not show the back, the material, or its true
    color under different light. A program receives the information we supply, not the entire world around it. If
    a picture is blurry, even a carefully built procedure may have too little information. Before blaming a wrong
    answer on the procedure, check whether the input contained enough useful information to answer the question.
  text_mode: A photograph shows the visible side of a button. It may not show the back, the material, or its true
    color under different light. A program receives the information we supply, not the entire world around it. If
    a picture is blurry, even a carefully built procedure may have too little information. Before blaming a wrong
    answer on the procedure, check whether the input contained enough useful information to answer the question.
- id: inputs-and-outputs.s6
  title: Try the four-part description
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.inputs-and-outputs
  markdown: 'Describe a kitchen timer in four parts: the task is to remind you when time is up; the input is the
    number of minutes; the procedure counts down; the output is a sound. This ordinary device helps us name the
    parts; these parts do not make every program AI. For a photo sorter, try the same description in your own words.
    If you can point to what enters and what leaves, you are ready to talk about examples and data.'
  text_mode: 'Describe a kitchen timer in four parts: the task is to remind you when time is up; the input is the
    number of minutes; the procedure counts down; the output is a sound. This ordinary device helps us name the
    parts; these parts do not make every program AI. For a photo sorter, try the same description in your own words.
    If you can point to what enters and what leaves, you are ready to talk about examples and data.'
- id: inputs-and-outputs.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.inputs-and-outputs
  markdown: Try a fresh example using the ideas above.
  text_mode: Untimed practice with feedback.
  takeaway: An input is information a program receives. An output is a result it produces. The instructions explain
    what to do between the two.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - inputs-and-outputs.s1
    - inputs-and-outputs.s2
    - inputs-and-outputs.s3
    - inputs-and-outputs.s4
    - inputs-and-outputs.s5
    - inputs-and-outputs.s6
    - inputs-and-outputs.check
    gate_refs:
    - gate.core
  scene_aliases: {}
assessment_families:
- id: inputs-and-outputs.base
  objective_ref: objective.inputs-and-outputs
  task: base
  response_type: single_choice
  points: 1
  variants:
  - id: inputs-and-outputs.base.v2.1
    prompt: A color finder receives a photograph and returns “blue.” Which is its input?
    options:
    - id: b
      text: The word blue
    - id: c
      text: The request to improve it
    - id: a
      text: The photograph
    answer: a
    feedback: The photograph enters this run; blue is the produced result.
  - id: inputs-and-outputs.base.v2.2
    prompt: A timer receives five minutes and later beeps. Which is its output?
    options:
    - id: c
      text: The counting instructions
    - id: a
      text: The beep
    - id: b
      text: The five-minute setting
    answer: a
    feedback: The beep is the result produced for the person using the timer.
  - id: inputs-and-outputs.base.v2.3
    prompt: The same picture is used to count holes and to name a color. What changed?
    options:
    - id: a
      text: The requested task
    - id: b
      text: The picture’s contents
    - id: c
      text: The procedure stayed the same but changed its answer
    answer: a
    feedback: The information can stay fixed while the requested job changes.
  - id: inputs-and-outputs.base.v2.4
    prompt: A program receives “hello” under a fixed replacement rule and returns “welcome.” What is the rule?
    options:
    - id: b
      text: The incoming word hello
    - id: c
      text: The outgoing word welcome
    - id: a
      text: Replace hello with welcome
    answer: a
    feedback: The rule describes the operation between input and output.
  hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
  remediation_scene: inputs-and-outputs.s3
- id: inputs-and-outputs.transfer
  objective_ref: objective.inputs-and-outputs
  task: transfer
  response_type: single_choice
  points: 1
  variants:
  - id: inputs-and-outputs.transfer.v2.1
    prompt: A color word leaves a color finder and enters an arm controller. How should you label that word?
    options:
    - id: c
      text: Instructions that rewrite both steps
    - id: a
      text: Output of one step, input of the next
    - id: b
      text: Input of both steps, with no output
    answer: a
    feedback: A value can play different roles at two connected boundaries.
  - id: inputs-and-outputs.transfer.v2.2
    prompt: A program cannot tell what is hidden behind a box in its photograph. What should you check first?
    options:
    - id: a
      text: Whether the needed information is visible
    - id: b
      text: Whether repeating the same input supplies the missing detail
    - id: c
      text: Whether a different output word supplies the hidden detail
    answer: a
    feedback: The input may lack the evidence needed to answer.
  - id: inputs-and-outputs.transfer.v2.3
    prompt: A sorter prints “red” but its arm goes to the blue pile. Which part deserves inspection?
    options:
    - id: b
      text: The step that stored the photograph
    - id: c
      text: The step that correctly named the color
    - id: a
      text: The step from the word to the arm action
    answer: a
    feedback: The produced label can be correct while a later action is wrong.
  - id: inputs-and-outputs.transfer.v2.4
    prompt: Which description separates input and task?
    options:
    - id: c
      text: Picture of a dog; the returned word dog
    - id: a
      text: Picture of a dog; name the animal
    - id: b
      text: Name the animal; picture of a dog
    answer: a
    feedback: The first part identifies supplied information and the second the requested job.
  hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
  remediation_scene: inputs-and-outputs.s3
