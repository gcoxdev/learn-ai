assessment_families:
- id: inputs-and-outputs.base
  objective_ref: objective.inputs-and-outputs
  task: base
  response_type: single_choice
  points: 1
  variants:
  - id: inputs-and-outputs.base.v2.1
    prompt: A color finder receives a photograph and returns “blue.” Which is its input?
    options:
    - id: b
      text: The word blue
    - id: c
      text: The request to improve it
    - id: a
      text: The photograph
    answer: a
    feedback: The photograph enters this run; blue is the produced result.
  - id: inputs-and-outputs.base.v2.2
    prompt: A timer receives five minutes and later beeps. Which is its output?
    options:
    - id: c
      text: The counting instructions
    - id: a
      text: The beep
    - id: b
      text: The five-minute setting
    answer: a
    feedback: The beep is the result produced for the person using the timer.
  - id: inputs-and-outputs.base.v2.3
    prompt: The same picture is used to count holes and to name a color. What changed?
    options:
    - id: a
      text: The requested task
    - id: b
      text: The picture’s contents
    - id: c
      text: The procedure stayed the same but changed its answer
    answer: a
    feedback: The information can stay fixed while the requested job changes.
  - id: inputs-and-outputs.base.v2.4
    prompt: A program receives “hello” under a fixed replacement rule and returns “welcome.” What is the rule?
    options:
    - id: b
      text: The incoming word hello
    - id: c
      text: The outgoing word welcome
    - id: a
      text: Replace hello with welcome
    answer: a
    feedback: The rule describes the operation between input and output.
  - id: inputs-and-outputs.base.v2.5
    prompt: A translator receives a sentence in Spanish and returns one in English. What is its output?
    options:
    - id: a
      text: The Spanish sentence
    - id: b
      text: The instruction to translate
    - id: c
      text: The English sentence
    answer: c
    feedback: The returned sentence is the output. The received sentence is the input; translating is the task.
  - id: inputs-and-outputs.base.v2.6
    prompt: A program receives a picture of three cups and returns the number 3. Which phrase describes its
      task?
    options:
    - id: a
      text: Count the cups in the picture
    - id: b
      text: The picture of three cups
    - id: c
      text: The returned number 3
    answer: a
    feedback: Counting cups is the requested job. The picture is the example and 3 is the result.
  hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
  remediation_scene: inputs-and-outputs.s3
- id: inputs-and-outputs.transfer
  objective_ref: objective.inputs-and-outputs
  task: transfer
  response_type: single_choice
  points: 1
  variants:
  - id: inputs-and-outputs.transfer.v2.1
    prompt: A color word leaves a color finder and enters an arm controller. How should you label that word?
    options:
    - id: c
      text: Instructions that rewrite both steps
    - id: a
      text: Output of one step, input of the next
    - id: b
      text: Input of both steps, with no output
    answer: a
    feedback: A value can play different roles at two connected boundaries.
  - id: inputs-and-outputs.transfer.v2.2
    prompt: A program cannot tell what is hidden behind a box in its photograph. What should you check first?
    options:
    - id: a
      text: Whether the needed information is visible
    - id: b
      text: Whether repeating the same input supplies the missing detail
    - id: c
      text: Whether a different output word supplies the hidden detail
    answer: a
    feedback: The input may lack the evidence needed to answer.
  - id: inputs-and-outputs.transfer.v2.3
    prompt: A sorter prints “red” but its arm goes to the blue pile. Which part deserves inspection?
    options:
    - id: b
      text: The step that stored the photograph
    - id: c
      text: The step that correctly named the color
    - id: a
      text: The step from the word to the arm action
    answer: a
    feedback: The produced label can be correct while a later action is wrong.
  - id: inputs-and-outputs.transfer.v2.4
    prompt: Which description separates input and task?
    options:
    - id: c
      text: Picture of a dog; the returned word dog
    - id: a
      text: Picture of a dog; name the animal
    - id: b
      text: Name the animal; picture of a dog
    answer: a
    feedback: The first part identifies supplied information and the second the requested job.
  - id: inputs-and-outputs.transfer.v2.5
    prompt: A speech recognizer sends written words to a translator. What role do those words have between
      the steps?
    options:
    - id: a
      text: Output of recognition and input to translation
    - id: b
      text: Instructions that change both programs
    - id: c
      text: Output of translation before it has run
    answer: a
    feedback: One step’s result can become the next step’s input. Follow the words across the boundary.
  - id: inputs-and-outputs.transfer.v2.6
    prompt: A photo shows the outside of a closed parcel. The task asks what object is inside. What information
      problem should you notice?
    options:
    - id: a
      text: The task already supplies the hidden object
    - id: b
      text: The needed object may not be visible in the input
    - id: c
      text: The output can supply evidence missing from the photo
    answer: b
    feedback: A program receives the supplied information. Requesting an answer does not make hidden details
      visible.
  hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
  remediation_scene: inputs-and-outputs.s3
