schema_version: 0.2-draft
lesson:
  id: inputs-and-outputs
  version: 0.3.0-draft
  title: 'Inputs and outputs: what goes in and what comes out'
  summary: Follow a picture through a simple sorting program and learn how to separate the job from its instructions
    and result.
  state: draft
  slot: M00.2
  category: common
  archetype: foundation
  sources:
  - title: Dive into Deep Learning — introduction
    url: https://d2l.ai/chapter_introduction/index.html
objectives:
- id: objective.inputs-and-outputs
  version: 2-draft
  statement: An input is information a program receives. An output is a result it produces. The instructions
    explain what to do between the two.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - inputs-and-outputs.base
  - inputs-and-outputs.transfer
  prerequisites:
  - anyOf:
    - objective.ai-systems
scenes:
- id: inputs-and-outputs.s1
  title: Give names to the two sides
  type: explanation
  depth: intuition
  objective_refs:
  - objective.inputs-and-outputs
  markdown: 'Imagine showing a computer a picture of a red button. The picture you give it is an **input**:
    information going in. If the computer replies “red,” that answer is an **output**: a result coming out.
    We can draw the trip as picture → program → color word. The arrows show how information moves from one
    step to the next.'
  text_mode: 'Imagine showing a computer a picture of a red button. The picture you give it is an **input**:
    information going in. If the computer replies “red,” that answer is an **output**: a result coming out.
    We can draw the trip as picture → program → color word. The arrows show how information moves from one
    step to the next.'
- id: inputs-and-outputs.s2
  title: The job and the example are different
  type: explanation
  depth: intuition
  objective_refs:
  - objective.inputs-and-outputs
  markdown: '“Tell me the button’s color” is the job. This particular picture is one input for that job. Tomorrow
    you might supply a blue-button picture while keeping the job the same. You might also keep the red-button
    picture but set a different task: count the holes instead of naming the color. The same input can support
    different tasks. Always say both what information is supplied and what answer you want back.'
  text_mode: '“Tell me the button’s color” is the job. This particular picture is one input for that job. Tomorrow
    you might supply a blue-button picture while keeping the job the same. You might also keep the red-button
    picture but set a different task: count the holes instead of naming the color. The same input can support
    different tasks. Always say both what information is supplied and what answer you want back.'
  figure:
    kind: input-output
    caption: The same picture can support different tasks. This example uses a written rule, not a trained
      image model.
    description: Change the button picture or the requested task. A fixed rule returns its color or its hole
      count; the rule does not learn from these interactions.
- id: inputs-and-outputs.s3
  title: Read a tiny example without doing mathematics
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.inputs-and-outputs
  markdown: 'A toy program follows a written rule: when it receives the word “hello,” it produces the word
    “welcome.” Input: hello. Instructions: replace hello with welcome. Output: welcome. Sending hello again
    does not rewrite the instructions. This is a useful simple program, but the replacement alone is not evidence
    that it learned a language. We use small examples like this to see a computer’s parts clearly before studying
    more complicated AI.'
  text_mode: 'A toy program follows a written rule: when it receives the word “hello,” it produces the word
    “welcome.” Input: hello. Instructions: replace hello with welcome. Output: welcome. Sending hello again
    does not rewrite the instructions. This is a useful simple program, but the replacement alone is not evidence
    that it learned a language. We use small examples like this to see a computer’s parts clearly before studying
    more complicated AI.'
- id: inputs-and-outputs.s4
  title: Follow a result into another step
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.inputs-and-outputs
  markdown: Now imagine a camera sends a picture to a color finder. The color finder outputs “red.” A separate
    sorter receives that word and moves an arm toward the red pile. “Red” is an output for one step and an
    input for the next. An **action** is something done, such as moving the arm. Producing a word and moving
    an arm are different steps, even when they happen in one machine.
  text_mode: Now imagine a camera sends a picture to a color finder. The color finder outputs “red.” A separate
    sorter receives that word and moves an arm toward the red pile. “Red” is an output for one step and an
    input for the next. An **action** is something done, such as moving the arm. Producing a word and moving
    an arm are different steps, even when they happen in one machine.
- id: inputs-and-outputs.s5
  title: Do not assume the input is complete
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.inputs-and-outputs
  markdown: A photograph shows the visible side of a button. It may not show the back, the material, or its
    true color under different light. A program receives the information we supply, not the entire world around
    it. If a picture is blurry, even a carefully built procedure may have too little information. Before blaming
    a wrong answer on the procedure, check whether the input contained enough useful information to answer
    the question.
  text_mode: A photograph shows the visible side of a button. It may not show the back, the material, or its
    true color under different light. A program receives the information we supply, not the entire world around
    it. If a picture is blurry, even a carefully built procedure may have too little information. Before blaming
    a wrong answer on the procedure, check whether the input contained enough useful information to answer
    the question.
- id: inputs-and-outputs.s6
  title: Try the four-part description
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.inputs-and-outputs
  markdown: 'Describe a kitchen timer in four parts: the task is to remind you when time is up; the input is
    the number of minutes; the procedure counts down; the output is a sound. The timer is an ordinary program.
    The same four-part description also helps us examine an AI system. For a photo sorter, try the same description
    in your own words. If you can point to what enters and what leaves, you are ready to talk about examples
    and data.'
  text_mode: 'Describe a kitchen timer in four parts: the task is to remind you when time is up; the input
    is the number of minutes; the procedure counts down; the output is a sound. The timer is an ordinary program.
    The same four-part description also helps us examine an AI system. For a photo sorter, try the same description
    in your own words. If you can point to what enters and what leaves, you are ready to talk about examples
    and data.'
- id: inputs-and-outputs.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.inputs-and-outputs
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: An input is information a program receives. An output is a result it produces. The instructions
    explain what to do between the two.
