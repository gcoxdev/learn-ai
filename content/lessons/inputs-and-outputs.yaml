schema_version: 0.2-draft
lesson:
  id: inputs-and-outputs
  version: 0.4.0-draft
  title: 'Inputs and outputs: what goes in and what comes out'
  summary: Every AI helper takes something in and hands something back. Follow a button photo through a sorter, then spot what goes in and what comes out of the apps you use.
  state: draft
  slot: M00.2
  category: common
  archetype: foundation
  sources:
    - title: Dive into Deep Learning — introduction
      url: https://d2l.ai/chapter_introduction/index.html
objectives:
  - id: objective.inputs-and-outputs
    version: 3-draft
    statement: An input is information a program receives. An output is a result it produces. The instructions explain what to do between the two.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - inputs-and-outputs.base
      - inputs-and-outputs.transfer.v3
    prerequisites:
      - anyOf:
          - objective.ai-systems
scenes:
  - id: inputs-and-outputs.s1
    title: Something goes in, something comes out
    type: explanation
    depth: intuition
    objective_refs:
      - objective.inputs-and-outputs
    markdown: |-
      Show a computer a photo of a red button. If it replies "red," you've seen the two sides of every program. The photo you gave it is the **input**: information going in. The word "red" is the **output**: the result coming out. We can draw the trip as *photo → program → "red"*.

      Every helper you use has the same shape:

      | Helper | Input | Output |
      | --- | --- | --- |
      | Spam filter | One email | "Junk" or "inbox" |
      | Map app | Where you are and where you're going | A suggested route |
      | Photo search | The word "dog" and your photo library | The photos that show dogs |
      | Chat assistant | Your message | A written reply |

      Finding the input and the output is the fastest way to understand what a helper actually does.
  - id: inputs-and-outputs.s2
    title: Same picture, different question
    type: explanation
    depth: intuition
    objective_refs:
      - objective.inputs-and-outputs
    markdown: |-
      "Tell me the button's color" is the task. This particular photo is one input for that task. Tomorrow you could give it a blue button and keep the same task.

      You could also keep the same photo and change the task: "Count the holes." Now the right output isn't a color at all.

      :::predict The photo shows a red button with two holes. You switch the task to "count the holes." What comes out?
      "2 holes." The input didn't change at all. Only the question changed, so the output changed. Try it with the controls below: switch the picture, then switch the task, and watch which one changes the answer.
      :::

      So whenever you ask a computer for something, say both things: what information you're giving it, and what answer you want back.
    figure:
      kind: input-output
      caption: The same picture can support different tasks. This example uses a written rule, not a trained image model.
      description: Change the button picture or the requested task. A fixed rule returns its color or its hole count; the rule does not learn from these interactions.
  - id: inputs-and-outputs.s3
    title: Your first look at a program
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.inputs-and-outputs
    markdown: |-
      Here is a complete, tiny program written in Python, a popular programming language. It follows one written rule: when it receives "hello," it gives back "welcome." Press Run to see what it prints.

      ```python run
      def respond(word):
          if word == "hello":
              return "welcome"
          return "?"

      print(respond("hello"))
      print(respond("hello"))
      print(respond("goodbye"))
      ```

      Line by line:

      - `def respond(word):` names the instructions `respond` and says they take one input, called `word`.
      - `if word == "hello":` checks whether the input is exactly "hello." If so, `return "welcome"` sends back the output.
      - `return "?"` is the answer for any other input.
      - Each `print(...)` line gives the program an input and shows the output.

      It prints `welcome`, `welcome`, and then `?`. Sending "hello" a second time didn't change the rule; it just used it again. And "goodbye" gets a `?` because nobody wrote a step for it, just like the green button in the last lesson. Try changing `"goodbye"` to `"hello"` and run it again.
  - id: inputs-and-outputs.s4
    title: One step's output is the next step's input
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.inputs-and-outputs
    markdown: |-
      Real systems chain steps together. A camera sends a photo to a color finder. The color finder outputs the word "red." A separate controller receives that word and moves a robot arm to the red pile.

      So "red" is the *output* of one step and the *input* of the next. Moving the arm is an **action**: something the system does in the world, not just a word or number it produces.

      :::predict The screen shows "red," but the arm drops the button on the blue pile. Which step would you inspect first?
      The step from the word to the arm, the controller. The color finder did its job: it said "red." Following the chain step by step tells you where the mistake entered, so you don't waste time fixing the part that worked.
      :::

      Voice assistants work the same way: your speech becomes text, the text becomes an answer, and the answer becomes spoken words.
    diagram:
      caption: A button sorter as a chain. Each step's output becomes the next step's input.
      description: A camera produces a photo, which goes to the color finder. The color finder outputs the word red, which goes to the arm controller. The arm controller performs an action, moving the button to the red pile.
      nodes:
        - id: camera
          label: Camera
          col: 0
          row: 0
        - id: finder
          label: Color finder
          note: photo in, color word out
          col: 1
          row: 0
          tone: accent
        - id: controller
          label: Arm controller
          note: color word in, movement out
          col: 2
          row: 0
          tone: accent
        - id: pile
          label: Button lands on red pile
          note: an action
          col: 3
          row: 0
          tone: data
      edges:
        - from: camera
          to: finder
          label: photo
        - from: finder
          to: controller
          label: '"red"'
        - from: controller
          to: pile
          label: move arm
  - id: inputs-and-outputs.s5
    title: The answer has to be in the input
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.inputs-and-outputs
    markdown: |-
      A photo shows one side of a button. It doesn't show the back, what the button is made of, or how it looks in daylight. A program only gets the information in its input, not the whole world around it.

      :::mixup "If the answer is wrong, the program must be broken."
      Sometimes the input simply doesn't contain the answer. Ask a photo app whether your cat is wearing a collar when the cat is curled under a blanket, and no program, however clever, can see the collar. Before blaming the instructions, check whether the input held enough information to answer the question.
      :::
  - id: inputs-and-outputs.s6
    title: Describe any helper in four parts
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.inputs-and-outputs
    markdown: |-
      You now have four words that describe almost any program. Here they are for a kitchen timer, an ordinary program with no AI in it, and for our button sorter:

      | Part | Kitchen timer | Button sorter |
      | --- | --- | --- |
      | Task | Remind you when time is up | Put each button in its color pile |
      | Input | A number of minutes | A photo of one button |
      | Instructions | Count down to zero | Find the color, then move the arm |
      | Output | A beep | A color word and an arm movement |

      :::try Your turn
      Fill in the four parts for a spam filter. (One possible answer: the task is keeping junk out of your inbox; the input is one email; the instructions are whatever checks it runs; the output is "junk" or "inbox.")
      :::

      If you can point to what goes in and what comes out, you're ready for the next question: where do AI helpers get their instructions from? Very often, from examples.
  - id: inputs-and-outputs.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.inputs-and-outputs
    markdown: Translators, timers, voice assistants, and self-checkout scales ask you to trace what goes in, what comes out, and where a chain of steps went wrong.
    takeaway: |-
      An input is the information a program receives, and an output is the result it gives back. In a chain of steps, one step's output becomes the next step's input.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - inputs-and-outputs.s1
        - inputs-and-outputs.s2
        - inputs-and-outputs.s3
        - inputs-and-outputs.s4
        - inputs-and-outputs.s5
        - inputs-and-outputs.s6
        - inputs-and-outputs.check
      gate_refs:
        - gate.core
  scene_aliases: {}
assessment_families:
  - id: inputs-and-outputs.base
    objective_ref: objective.inputs-and-outputs
    task: base
    response_type: single_choice
    points: 1
    variants:
      - id: inputs-and-outputs.base.v2.1
        prompt: A color finder receives a photograph and returns “blue.” Which is its input?
        options:
          - id: b
            text: The word blue
          - id: c
            text: The request to improve it
          - id: a
            text: The photograph
        answer: a
        feedback: "The photograph goes into the color finder, so it's the input. The word \"blue\" is what comes out, which makes it the output."
      - id: inputs-and-outputs.base.v2.2
        prompt: A timer receives five minutes and later beeps. Which is its output?
        options:
          - id: c
            text: The counting instructions
          - id: a
            text: The beep
          - id: b
            text: The five-minute setting
        answer: a
        feedback: "The beep is what the timer hands back, so it's the output. The five-minute setting is what went in (the input), and counting down is the instructions."
      - id: inputs-and-outputs.base.v2.3
        prompt: The same picture is used to count holes and to name a color. What changed?
        options:
          - id: a
            text: The requested task
          - id: b
            text: The picture’s contents
          - id: c
            text: The procedure stayed the same but changed its answer
        answer: a
        feedback: "The picture stayed exactly the same; only the job changed, from naming a color to counting holes. A new task asks for a new kind of answer from the same input."
      - id: inputs-and-outputs.base.v2.4
        prompt: A program receives “hello” under a fixed replacement rule and returns “welcome.” What is the rule?
        options:
          - id: b
            text: The incoming word hello
          - id: c
            text: The outgoing word welcome
          - id: a
            text: Replace hello with welcome
        answer: a
        feedback: "The rule is the step between input and output: replace \"hello\" with \"welcome.\" The word \"hello\" is the input, and \"welcome\" is the output the rule produces."
      - id: inputs-and-outputs.base.v2.5
        prompt: A translator receives a sentence in Spanish and returns one in English. What is its output?
        options:
          - id: a
            text: The Spanish sentence
          - id: b
            text: The instruction to translate
          - id: c
            text: The English sentence
        answer: c
        feedback: The returned sentence is the output. The received sentence is the input; translating is the task.
      - id: inputs-and-outputs.base.v2.6
        prompt: A program receives a picture of three cups and returns the number 3. Which phrase describes its task?
        options:
          - id: a
            text: Count the cups in the picture
          - id: b
            text: The picture of three cups
          - id: c
            text: The returned number 3
        answer: a
        feedback: "Counting the cups is the job being asked for, so it's the task. The picture is the input, and the number 3 is the output."
    hint: "Sort the pieces into three roles: the information handed in (input), the job being asked for (task), and the result handed back (output)."
    remediation_scene: inputs-and-outputs.s3
  - id: inputs-and-outputs.transfer
    objective_ref: objective.inputs-and-outputs
    task: transfer
    response_type: single_choice
    points: 1
    variants:
      - id: inputs-and-outputs.transfer.v2.1
        prompt: A color word leaves a color finder and enters an arm controller. How should you label that word?
        options:
          - id: c
            text: Instructions that rewrite both steps
          - id: a
            text: Output of one step, input of the next
          - id: b
            text: Input of both steps, with no output
        answer: a
        feedback: A value can play different roles at two connected boundaries.
        retired: true
      - id: inputs-and-outputs.transfer.v2.2
        prompt: A program cannot tell what is hidden behind a box in its photograph. What should you check first?
        options:
          - id: a
            text: Whether the needed information is visible
          - id: b
            text: Whether repeating the same input supplies the missing detail
          - id: c
            text: Whether a different output word supplies the hidden detail
        answer: a
        feedback: The input may lack the evidence needed to answer.
        retired: true
      - id: inputs-and-outputs.transfer.v2.3
        prompt: A sorter prints “red” but its arm goes to the blue pile. Which part deserves inspection?
        options:
          - id: b
            text: The step that stored the photograph
          - id: c
            text: The step that correctly named the color
          - id: a
            text: The step from the word to the arm action
        answer: a
        feedback: The produced label can be correct while a later action is wrong.
        retired: true
      - id: inputs-and-outputs.transfer.v2.4
        prompt: Which description separates input and task?
        options:
          - id: c
            text: Picture of a dog; the returned word dog
          - id: a
            text: Picture of a dog; name the animal
          - id: b
            text: Name the animal; picture of a dog
        answer: a
        feedback: The first part identifies supplied information and the second the requested job.
        retired: true
      - id: inputs-and-outputs.transfer.v2.5
        prompt: A speech recognizer sends written words to a translator. What role do those words have between the steps?
        options:
          - id: a
            text: Output of recognition and input to translation
          - id: b
            text: Instructions that change both programs
          - id: c
            text: Output of translation before it has run
        answer: a
        feedback: One step’s result can become the next step’s input. Follow the words across the boundary.
        retired: true
      - id: inputs-and-outputs.transfer.v2.6
        prompt: A photo shows the outside of a closed parcel. The task asks what object is inside. What information problem should you notice?
        options:
          - id: a
            text: The task already supplies the hidden object
          - id: b
            text: The needed object may not be visible in the input
          - id: c
            text: The output can supply evidence missing from the photo
        answer: b
        feedback: A program receives the supplied information. Requesting an answer does not make hidden details visible.
        retired: true
    hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
    remediation_scene: inputs-and-outputs.s3
  - id: inputs-and-outputs.transfer.v3
    objective_ref: objective.inputs-and-outputs
    task: transfer
    response_type: single_choice
    points: 1
    hint: Follow the information one step at a time. Ask what each step receives and what it hands on, and whether the input even holds the answer.
    remediation_scene: inputs-and-outputs.s4
    variants:
      - id: inputs-and-outputs.transfer.v3.1
        prompt: A voice assistant hears "What's the weather?", turns the sound into text, then uses the text to look up a forecast. What role does the text play?
        options:
          - id: a
            text: The input to the listening step, and nothing more
          - id: b
            text: The output of listening and input to the lookup
          - id: c
            text: The final answer the person gets to hear aloud
        answer: b
        feedback: The listening step produces the text, and the lookup step receives it, so it is an output and an input at once. The final answer comes later, after the lookup.
      - id: inputs-and-outputs.transfer.v3.2
        prompt: A photo shows a dog curled under a blanket, with its neck hidden. An app is asked whether the dog is wearing a collar. What is the real problem?
        options:
          - id: a
            text: The app's instructions must be broken
          - id: b
            text: The question should be asked more politely
          - id: c
            text: The input may not contain the answer
        answer: c
        feedback: The collar isn't visible, so no set of instructions can find it in this photo. Blaming the instructions is tempting, but first check whether the input held the information.
      - id: inputs-and-outputs.transfer.v3.3
        prompt: You type "gato" into a translator set to Spanish → English and get "cat." You switch to Spanish → French with the same word and get "chat." What changed between the two runs?
        options:
          - id: c
            text: The translator learned French from the first run
          - id: b
            text: The input, while the task stayed the same
          - id: a
            text: The task, while the input stayed the same
        answer: a
        feedback: The word "gato" went in both times; only the requested job changed, from English to French. Nothing was learned between runs; the translator used different instructions for a different task.
      - id: inputs-and-outputs.transfer.v3.4
        prompt: At a self-checkout, a scale weighs your apples, a second step multiplies the weight by the price, and a printer makes a receipt. What is the output of the weighing step?
        options:
          - id: a
            text: The printed receipt at the end
          - id: c
            text: The weight, such as 1.2 lb
          - id: b
            text: The apples sitting on the scale
        answer: c
        feedback: The weighing step takes in apples and hands on a number, the weight, which becomes the input to the price step. The receipt is the output of the last step, not this one.
      - id: inputs-and-outputs.transfer.v3.5
        prompt: A spam filter correctly labels an email "junk," but the email still shows up in the inbox. Which step should you inspect first?
        options:
          - id: b
            text: The step that read the email and chose "junk"
          - id: a
            text: The step that moves the email based on its label
          - id: c
            text: The step that received the email from the sender
        answer: a
        feedback: The label was right, so the problem entered after it, where the label should have caused an action. Re-checking the labeling step would mean fixing the part that worked.
      - id: inputs-and-outputs.transfer.v3.6
        prompt: 'A smart doorbell works in steps: the camera takes a picture, a recognizer outputs "person at the door," and then your phone buzzes. For the recognizer step, which pair is right?'
        options:
          - id: c
            text: 'Input: the phone buzz. Output: "person at the door"'
          - id: b
            text: 'Input: the camera picture. Output: "person at the door"'
          - id: a
            text: 'Input: "person at the door." Output: the photo of the porch'
        answer: b
        feedback: The recognizer receives the picture and hands on its description. The buzz comes afterward, as the next step's action, so it can't be the recognizer's input.
