schema_version: 0.2-draft
lesson:
  id: ways-to-learn
  version: 0.2.0-draft
  title: Different ways to learn
  state: draft
  summary: Compare four kinds of learning by asking where the helpful feedback comes from.
  slot: M03.2
  category: common
  minutes: 9
  sources:
  - title: Dive into Deep Learning — introduction, kinds of machine learning
    url: https://d2l.ai/chapter_introduction/index.html
  archetype: foundation
objectives:
- id: objective.ways-to-learn
  version: 1-draft
  statement: 'Learning methods differ in the evidence and feedback they use: targets, structure in the data, or
    consequences of actions.'
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - ways-to-learn.base
  - ways-to-learn.transfer
  prerequisites:
  - anyOf:
    - objective.training-and-inference
scenes:
- id: ways-to-learn.s1
  title: Ask what the learner can check
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ways-to-learn
  markdown: 'Recall the basic training job: adjust a model using examples and a chosen goal. Different learning
    methods supply different kinds of feedback. **Feedback** is information used to assess or improve what the model
    does. A correct shape name, the next word in a sentence, and points received after a move are different signals.
    We will trace each separately before combining them in a larger system.'
  text_mode: 'Recall the basic training job: adjust a model using examples and a chosen goal. Different learning
    methods supply different kinds of feedback. **Feedback** is information used to assess or improve what the model
    does. A correct shape name, the next word in a sentence, and points received after a move are different signals.
    We will trace each separately before combining them in a larger system.'
  bridges: []
- id: ways-to-learn.s2
  title: Supervised learning uses supplied targets
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ways-to-learn
  markdown: Show a model a picture labeled “circle.” Let it predict a shape, compare the prediction with the supplied
    label, and use a measure of the mistake to guide an adjustment. This is **supervised learning**. The word supervised
    refers to the target information; it does not require a person watching every calculation. Targets can be categories
    such as circle/square or numerical values such as delivery minutes. The target can also be wrong, so its quality
    matters.
  text_mode: Show a model a picture labeled “circle.” Let it predict a shape, compare the prediction with the supplied
    label, and use a measure of the mistake to guide an adjustment. This is **supervised learning**. The word supervised
    refers to the target information; it does not require a person watching every calculation. Targets can be categories
    such as circle/square or numerical values such as delivery minutes. The target can also be wrong, so its quality
    matters.
  bridges: []
- id: ways-to-learn.s3
  title: Self-supervised learning constructs a target
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ways-to-learn
  markdown: 'Start with the sentence “The cat sat.” Give the first two words as input and ask for the next word.
    The recorded word “sat” provides a target without someone separately labeling the sentence for this exercise.
    This is **self-supervised learning**: constructing training tasks and targets from the data. Text models often
    work with tokens, pieces of text that may be whole words or word parts. We will study their exact construction
    later; the target-from-data idea does not require it yet.'
  text_mode: 'Start with the sentence “The cat sat.” Give the first two words as input and ask for the next word.
    The recorded word “sat” provides a target without someone separately labeling the sentence for this exercise.
    This is **self-supervised learning**: constructing training tasks and targets from the data. Text models often
    work with tokens, pieces of text that may be whole words or word parts. We will study their exact construction
    later; the target-from-data idea does not require it yet.'
  bridges: []
- id: ways-to-learn.s4
  title: Unsupervised learning looks for structure
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ways-to-learn
  markdown: Suppose you have pictures but no attached shape names. A procedure might group pictures whose measurements
    are similar. This is an example of **unsupervised learning**, looking for structure without a supplied answer
    label for each example. It might group by color when you hoped for shape. A group is not automatically the concept
    a person wanted. We still choose the measurements, the similarity rule, and a way to judge whether the grouping
    helps with our purpose.
  text_mode: Suppose you have pictures but no attached shape names. A procedure might group pictures whose measurements
    are similar. This is an example of **unsupervised learning**, looking for structure without a supplied answer
    label for each example. It might group by color when you hoped for shape. A group is not automatically the concept
    a person wanted. We still choose the measurements, the similarity rule, and a way to judge whether the grouping
    helps with our purpose.
  bridges: []
- id: ways-to-learn.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.ways-to-learn
  markdown: Use two different examples to check your understanding. Hints are available for practice. A later, fresh
    answer without hints can demonstrate personal-study mastery.
  text_mode: Labeled radio options and a submit button; no timing requirement.
  takeaway: 'Learning methods differ in the feedback available: supplied answers, answers constructed from data,
    patterns without labels, or consequences of actions.'
- id: ways-to-learn.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.ways-to-learn
  markdown: 'Learning methods differ in the evidence and feedback they use: targets, structure in the data, or consequences
    of actions.'
  text_mode: 'Learning methods differ in the evidence and feedback they use: targets, structure in the data, or
    consequences of actions.'
- id: ways-to-learn.s5
  title: Reinforcement learning uses consequences
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ways-to-learn
  markdown: Imagine a game in which a character chooses left or right and later receives points for reaching a goal.
    An **agent** is the decision maker; its **environment** is the situation it acts in. A **reward** is the numerical
    feedback assigned to an outcome. A **policy** is the rule used to choose actions. **Reinforcement learning**
    improves action choices using these consequences. A useful move may receive no immediate points, so learning
    must connect later outcomes with earlier choices.
  text_mode: Imagine a game in which a character chooses left or right and later receives points for reaching a
    goal. An **agent** is the decision maker; its **environment** is the situation it acts in. A **reward** is the
    numerical feedback assigned to an outcome. A **policy** is the rule used to choose actions. **Reinforcement
    learning** improves action choices using these consequences. A useful move may receive no immediate points,
    so learning must connect later outcomes with earlier choices.
  bridges: []
- id: ways-to-learn.s6
  title: Compare signals, not product labels
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ways-to-learn
  markdown: 'For a shape label, an existing sentence, unlabeled pictures, and a game score, identify exactly what
    can be checked. One system can use several methods at different stages: a model may learn from text and later
    be adjusted using preferred example responses. Method names describe the training setup, not permanent personalities
    for a product. Neither a supplied target nor a reward automatically captures everything a person wants. Always
    connect the feedback to the actual task.'
  text_mode: 'For a shape label, an existing sentence, unlabeled pictures, and a game score, identify exactly what
    can be checked. One system can use several methods at different stages: a model may learn from text and later
    be adjusted using preferred example responses. Method names describe the training setup, not permanent personalities
    for a product. Neither a supplied target nor a reward automatically captures everything a person wants. Always
    connect the feedback to the actual task.'
  bridges: []
