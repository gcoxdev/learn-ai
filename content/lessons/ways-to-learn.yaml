schema_version: 0.2-draft
lesson:
  id: ways-to-learn
  version: 0.1.0-draft
  title: Different ways to learn
  state: draft
  summary: 'Learning methods differ in the evidence and feedback they use: targets, structure in the data,
    or consequences of actions.'
  slot: M03.2
  category: common
  minutes: 9
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — topic overview'
    url: https://aima.cs.berkeley.edu/contents.html
objectives:
- id: objective.ways-to-learn
  version: 1-draft
  statement: 'Learning methods differ in the evidence and feedback they use: targets, structure in the data,
    or consequences of actions.'
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - ways-to-learn.base
  - ways-to-learn.transfer
  prerequisites:
  - anyOf:
    - objective.ai-systems
scenes:
- id: ways-to-learn.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ways-to-learn
  text_mode: The complete explanation is available as readable text.
  title: Start with the feedback
  markdown: 'Suppose we want to recognize handwritten digits. We can show a model images paired with correct
    digit labels. The label supplies a target for each example. This is **supervised learning**.


    We choose a loss that measures a kind of mistake, then adjust the model to improve that measure.'
- id: ways-to-learn.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ways-to-learn
  text_mode: The complete explanation is available as readable text.
  title: Data can provide a learning target
  markdown: 'In **self-supervised learning**, a target is constructed from the data itself. Hide a word and
    predict it, or predict the next token from earlier tokens. The original data supplies an answer to check.


    “Self-supervised” does not mean there is no objective or no human design. People still choose the data,
    model, and training task.'
- id: ways-to-learn.s3
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ways-to-learn
  text_mode: The complete explanation is available as readable text.
  title: Structure and consequences
  markdown: '**Unsupervised learning** can seek structure without a supplied label for each example, such as
    grouping similar records.


    **Reinforcement learning** studies actions and their consequences. An agent receives rewards in an environment
    and learns a policy. Rewards can be delayed. A reward is a designed signal, not an automatic definition
    of what humans truly want.'
- id: ways-to-learn.s4
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ways-to-learn
  text_mode: The complete explanation is available as readable text.
  title: One system can use several methods
  markdown: 'A language model may first learn from text and later be adapted with demonstrations or preference
    data. A robot can combine perception learned from labeled images with a control policy.


    Treat the method names as descriptions of stages and signals. They are not mutually exclusive identities
    for an entire product.'
- id: ways-to-learn.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.ways-to-learn
  markdown: Use two different examples to check your understanding. Hints are available for practice. A later,
    fresh answer without hints can demonstrate personal-study mastery.
  text_mode: Labeled radio options and a submit button; no timing requirement.
- id: ways-to-learn.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.ways-to-learn
  markdown: 'Learning methods differ in the evidence and feedback they use: targets, structure in the data,
    or consequences of actions.'
  text_mode: 'Learning methods differ in the evidence and feedback they use: targets, structure in the data,
    or consequences of actions.'
