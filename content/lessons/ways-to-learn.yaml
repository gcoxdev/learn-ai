schema_version: 0.2-draft
lesson:
  id: ways-to-learn
  version: 0.4.0-draft
  title: Different ways to learn
  state: draft
  summary: A bird app can learn from tagged photos, from hidden words, from unnamed recordings, or from rewards. Discover the one question that tells these four kinds of learning apart.
  slot: M03.2
  category: common
  sources:
    - title: Dive into Deep Learning — introduction, kinds of machine learning
      url: https://d2l.ai/chapter_introduction/index.html
    - title: "Mastering the game of Go with deep neural networks and tree search (Silver et al., 2016)"
      url: https://www.nature.com/articles/nature16961
    - title: "Training language models to follow instructions with human feedback (Ouyang et al., 2022)"
      url: https://arxiv.org/abs/2203.02155
  archetype: foundation
objectives:
  - id: objective.ways-to-learn
    version: 2-draft
    statement: 'Learning methods differ in the evidence and feedback they use: targets, structure in the data, or consequences of actions.'
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - ways-to-learn.base.v2
      - ways-to-learn.transfer.v2
    prerequisites:
      - anyOf:
          - objective.training-and-inference
scenes:
  - id: ways-to-learn.s1
    title: How does the learner find out it was wrong?
    type: explanation
    depth: intuition
    objective_refs:
      - objective.ways-to-learn
    markdown: |-
      Imagine building a birdwatching app. At first its model guesses terribly. Training means adjusting the model so its guesses improve, but first it needs a way to find out how good a guess was. That information is called **feedback**, and the kind of feedback you have decides which kind of learning you can use.

      Here are four very different situations the model might be in:

      1. A birder has tagged 5,000 photos with species names. The model can compare each guess with the tag.
      2. You have a field guide with thousands of sentences, but no tags. Hide a word, and the model can check its guess against the word that was there.
      3. You have 10,000 bird-song recordings with no names at all. The model can only notice which ones sound alike.
      4. A smart bird feeder chooses when to close its lid, and scores a point whenever a bird, not a squirrel, gets the seed.
  - id: ways-to-learn.s2
    title: Tagged photos give supervised learning
    type: explanation
    depth: intuition
    objective_refs:
      - objective.ways-to-learn
    markdown: |-
      Show the model a photo. It guesses "sparrow." The tag says "robin." The model measures how wrong it was and adjusts its weights a little toward "robin." Repeat, many times over.

      Learning from examples that come with the correct answer attached is **supervised learning**. The answers can be categories ("robin") or numbers (a bird's weight in grams). This is how spam filters learn from the messages people mark as junk, and how image models learned from ImageNet, a collection of more than 14 million photos labeled by people. In 2012 a network called AlexNet, trained on over a million of those photos, won the ImageNet competition by a wide margin and helped launch today's deep-learning boom.

      The catch is cost. Someone has to write every answer, and a tired birder who tags a wren as a robin teaches the model a mistake.

      :::mixup "Supervised means a person watches the training."
      Nobody watches. "Supervised" refers only to the answers attached to the examples. Once those exist, training runs by itself.
      :::
  - id: ways-to-learn.s3
    title: Hide part of the data and predict it
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ways-to-learn
    markdown: |-
      Take the sentence "the robin sang at dawn." Cover the last word and ask the model to guess it from the words before. The answer, "dawn," was sitting in the text all along. Nobody had to tag anything.

      Making up training questions by hiding part of the data, then using the hidden part as the answer, is **self-supervised learning**. Because the answers come free, it can use enormous amounts of raw text, images, or audio. GPT-style language models are trained this way, by predicting the next piece of text billions of times. BERT (2018) instead hides words in the middle of a sentence and predicts them.

      Run this to turn four short sentences into training examples automatically:

      ```python run
      from collections import Counter

      text = """the robin sang at dawn . the wren sang at dusk .
      the robin ate a worm . the wren ate a spider ."""
      words = text.split()

      # Every position gives one training example: two words in, the next word out.
      pairs = [(words[i - 2] + " " + words[i - 1], words[i]) for i in range(2, len(words))]

      print("examples made:", len(pairs), "   labels written by hand: 0")
      for context, target in pairs[:4]:
          print(f"  input: {context!r:16} target: {target!r}")

      # What does the data say tends to follow "the robin"?
      after = Counter(target for context, target in pairs if context == "the robin")
      print("after 'the robin':", dict(after))
      ```

      Twenty-four tokens (20 words and 4 full stops) give 22 examples, and no one labeled any of them. Add a sentence such as "the robin sang at noon ." and watch both the example count and the "after 'the robin'" tally change.
  - id: ways-to-learn.s4
    title: Unnamed recordings give unsupervised learning
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ways-to-learn
    markdown: |-
      Now you have 10,000 song recordings and no names. There's nothing to hide and check, and no answers to compare with. The model can still measure each recording (pitch, rhythm, loudness) and put similar ones into groups.

      Finding structure in data without any answers is **unsupervised learning**. Grouping similar examples is its most common form, called **clustering**. It's useful for exploring a collection nobody has sorted yet.

      :::predict The model splits the recordings into three groups. You hoped for three species. What might it have grouped them by instead?
      By whatever differences are biggest in the measurements. That might be background noise (city, forest, rain), the recording device, or time of day, rather than the bird. Clustering finds groups; it doesn't know which groups you care about. You choose the measurements, and you have to listen to a few recordings from each group to learn what it actually captured.
      :::
  - id: ways-to-learn.s5
    title: Rewards teach through consequences
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ways-to-learn
    markdown: |-
      The smart feeder is different from the other three. Nobody gives it examples at all. It acts, and the world responds. In **reinforcement learning**, a learner called the **agent** (the feeder) takes **actions** (open or close the lid) in an **environment** (the garden, with its birds and squirrels) and receives a **reward**, a number scoring the outcome: +1 when a bird eats, −1 when a squirrel does. Its rule for choosing actions is its **policy**, and training adjusts the policy to collect more reward.

      Rewards are often late. Closing the lid at 7 a.m., when a squirrel is lurking, earns nothing right away, but it may be why birds eat well all morning. So the agent has to work out which earlier choices deserve credit for later rewards. That puzzle makes reinforcement learning harder than learning from answers attached to examples.
  - id: ways-to-learn.s6
    title: Famous systems mix several signals
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ways-to-learn
    markdown: |-
      The four kinds side by side:

      | Kind | Where the feedback comes from | Bird-app example |
      | --- | --- | --- |
      | Supervised | An answer attached to each example | Tagged photos |
      | Self-supervised | A hidden part of the data itself | Guess the covered word |
      | Unsupervised | No answers, only similarities | Group unnamed songs |
      | Reinforcement | Rewards after actions | The feeder's points |

      Big systems often use several, one stage after another. AlphaGo, which beat Go champion Lee Sedol in 2016, first learned to predict the moves of strong human players from recorded games (supervised), then improved by playing against itself, with winning as the reward (reinforcement). ChatGPT (released November 2022) followed a similar pattern: predict the next word across huge amounts of text (self-supervised), then learn from example answers written by people (supervised), then from rewards based on people's rankings of its replies (reinforcement learning from human feedback, or RLHF).

      So when you meet a new system, don't ask "which kind is it?" Ask, at each stage, "what could it check its guesses against?"
  - id: ways-to-learn.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.ways-to-learn
    markdown: X-rays, music clips, robot vacuums, and product reviews ask you to find where each learner's feedback comes from.
    takeaway: |-
      The kinds of learning differ in where feedback comes from: answers attached to examples, hidden parts of the data, similarities alone, or rewards for actions. Real systems often combine them in stages.
  - id: ways-to-learn.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.ways-to-learn
    markdown: |-
      Learning methods differ in the evidence and feedback they use: targets, structure in the data, or consequences of actions.
