assessment_families:
- id: ways-to-learn.base
  objective_ref: objective.ways-to-learn
  task: base
  response_type: single_choice
  points: 1
  hint: 'Learning methods differ in the evidence and feedback they use: targets, structure in the data, or
    consequences of actions.'
  variants:
  - id: ways-to-learn.base.1
    prompt: A model learns from pictures paired with animal names. Which setup is this?
    options:
    - id: a
      text: Learning with no target signal.
    - id: b
      text: A search tree with no training.
    - id: correct
      text: Supervised learning.
    answer: correct
    feedback: Supervised learning.
  - id: ways-to-learn.base.2
    prompt: Where can a next-token model get its training targets?
    options:
    - id: b
      text: From the model’s own confidence alone.
    - id: correct
      text: From later tokens in the training text.
    - id: a
      text: Only from a person rating every generated word.
    answer: correct
    feedback: From later tokens in the training text.
- id: ways-to-learn.transfer
  objective_ref: objective.ways-to-learn
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Learning methods differ in the evidence and feedback they use: targets, structure in the data, or
    consequences of actions.'
  variants:
  - id: ways-to-learn.transfer.1
    prompt: A robot receives a reward after reaching a destination. What does that reward provide?
    options:
    - id: b
      text: A label for every possible action in advance.
    - id: correct
      text: Feedback about consequences under a designed objective.
    - id: a
      text: A guarantee that every route was safe.
    answer: correct
    feedback: Feedback about consequences under a designed objective.
  - id: ways-to-learn.transfer.2
    prompt: A model is pretrained on text, then adapted on demonstrations. Must both stages use the same feedback
      setup?
    options:
    - id: correct
      text: No. Different training stages can use different signals.
    - id: a
      text: Yes. A system can use only one learning method.
    - id: b
      text: Yes. Demonstrations cannot be used after pretraining.
    answer: correct
    feedback: No. Different training stages can use different signals.
