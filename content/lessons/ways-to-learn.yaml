assessment_families:
  - id: ways-to-learn.base
    objective_ref: objective.ways-to-learn
    task: base
    response_type: single_choice
    points: 1
    hint: 'Learning methods differ in the evidence and feedback they use: targets, structure in the data, or consequences of actions.'
    variants:
      - id: ways-to-learn.base.1
        prompt: A model learns from pictures paired with animal names. Which setup is this?
        options:
          - id: a
            text: Learning with no target signal.
          - id: b
            text: A search tree with no training.
          - id: correct
            text: Supervised learning.
        answer: correct
        feedback: Supervised learning.
        retired: true
      - id: ways-to-learn.base.2
        prompt: Where can a next-token model get its training targets?
        options:
          - id: b
            text: From the model’s own confidence alone.
          - id: correct
            text: From later tokens in the training text.
          - id: a
            text: Only from a person rating every generated word.
        answer: correct
        feedback: From later tokens in the training text.
        retired: true
  - id: ways-to-learn.transfer
    objective_ref: objective.ways-to-learn
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Learning methods differ in the evidence and feedback they use: targets, structure in the data, or consequences of actions.'
    variants:
      - id: ways-to-learn.transfer.1
        prompt: A robot receives a reward after reaching a destination. What does that reward provide?
        options:
          - id: b
            text: A label for every possible action in advance.
          - id: correct
            text: Feedback about consequences under a designed objective.
          - id: a
            text: A guarantee that every route was safe.
        answer: correct
        feedback: Feedback about consequences under a designed objective.
        retired: true
      - id: ways-to-learn.transfer.2
        prompt: A model is pretrained on text, then adapted on demonstrations. Must both stages use the same feedback setup?
        options:
          - id: correct
            text: No. Different training stages can use different signals.
          - id: a
            text: Yes. A system can use only one learning method.
          - id: b
            text: Yes. Demonstrations cannot be used after pretraining.
        answer: correct
        feedback: No. Different training stages can use different signals.
        retired: true
  - id: ways-to-learn.base.v2
    objective_ref: objective.ways-to-learn
    task: base
    response_type: single_choice
    points: 1
    hint: Ask what the learner compares its guess with. A tag someone wrote? A piece of the data that was hidden? Nothing but similarity? A reward that follows an action?
    remediation_scene: ways-to-learn.s1
    variants:
      - id: ways-to-learn.base.v2.1
        prompt: A music model trains on millions of songs by blanking out a few seconds of each and predicting the missing audio. Which kind of learning is this?
        options:
          - id: a
            text: Unsupervised, because nobody labeled the songs
          - id: b
            text: Self-supervised, because the hidden audio is the answer
          - id: c
            text: Supervised, because each song comes with a genre tag
        answer: b
        feedback: The answer to each training question is the audio that was blanked out, so the data supplies its own targets. It's tempting to call it unsupervised because no one labeled anything, but the model does check its guesses against a definite answer, which clustering never does.
      - id: ways-to-learn.base.v2.2
        prompt: A hospital trains a model on X-rays that radiologists have each marked "fracture" or "no fracture." Where does the model's feedback come from?
        options:
          - id: c
            text: From rewards given when its diagnosis helps a patient
          - id: b
            text: From hidden patches of each X-ray that it must fill in
          - id: a
            text: From the radiologists' answers attached to each image
        answer: a
        feedback: Each X-ray comes with an answer a person wrote, which makes this supervised learning. No actions or rewards are involved, and nothing is hidden and re-predicted.
      - id: ways-to-learn.base.v2.3
        prompt: A shop sorts its customers into five groups based on what they buy, with no labels at all. What must happen before anyone relies on those groups?
        options:
          - id: a
            text: People look inside each group to learn what it really captures
          - id: b
            text: The groups are treated as correct, since the data produced them
          - id: c
            text: Each group is given a reward so the sorting can improve itself
        answer: a
        feedback: Clustering finds whatever differences are biggest in the measurements, which may not be the ones the shop cares about. Someone has to inspect the groups; the data doesn't make them meaningful by itself, and no reward is involved in clustering.
      - id: ways-to-learn.base.v2.4
        prompt: A robot vacuum scores +1 for each square it cleans and −10 whenever it bumps into the stairs. Which kind of learning fits this setup?
        options:
          - id: b
            text: Supervised, because the scores act like labels on each square
          - id: c
            text: Unsupervised, because no one showed it examples of good cleaning
          - id: a
            text: Reinforcement, because the scores follow the vacuum's own actions
        answer: a
        feedback: The vacuum acts, and the environment answers with rewards, which is reinforcement learning. The scores aren't labels attached to examples in advance; they arrive only as consequences of what the vacuum chose to do.
  - id: ways-to-learn.transfer.v2
    objective_ref: objective.ways-to-learn
    task: transfer
    response_type: single_choice
    points: 1
    hint: Look at each stage separately and name what that stage could check its guesses against. Big systems often switch kinds of feedback between stages.
    remediation_scene: ways-to-learn.s6
    variants:
      - id: ways-to-learn.transfer.v2.1
        prompt: A team has 2 million unlabeled product reviews and 500 reviews tagged "positive" or "negative." Which plan makes good use of both?
        options:
          - id: c
            text: Train on the 500 tagged reviews and set the other 2 million aside
          - id: a
            text: Predict hidden words in all the reviews, then train on the 500 tags
          - id: b
            text: Cluster the 2 million reviews into two groups and call them the tags
        answer: a
        feedback: Self-supervised training on hidden words lets the model learn from all 2 million reviews for free; the 500 tags then teach the specific task. Two clusters might split the reviews by length or product type instead of by opinion.
      - id: ways-to-learn.transfer.v2.2
        prompt: A chatbot is trained in three stages. First it predicts the next word in web text. Then it copies answers written by people. Then it is rewarded when people rank its replies highly. Which sequence names the stages?
        options:
          - id: b
            text: Supervised, then supervised again, then unsupervised
          - id: c
            text: Unsupervised, then self-supervised, then supervised
          - id: a
            text: Self-supervised, then supervised, then reinforcement
        answer: a
        feedback: Next-word prediction takes its answers from the text itself, copying written answers is supervised, and learning from rewards based on rankings is reinforcement learning (this pattern is called RLHF). Calling the first stage unsupervised misses that every guess has a definite answer.
      - id: ways-to-learn.transfer.v2.3
        prompt: A clustering tool splits bird photos into two groups. One is mostly snowy scenes and the other mostly summer scenes. What is the most useful next step?
        options:
          - id: b
            text: Label the groups as two species, since the tool found them
          - id: a
            text: Measure the birds rather than the backgrounds, then recheck
          - id: c
            text: Keep asking for more groups until species start to appear
        answer: a
        feedback: The tool grouped by the biggest difference in its measurements, which was the season, not the bird. Changing what is measured targets the real problem. More groups would likely just split the backgrounds more finely.
      - id: ways-to-learn.transfer.v2.4
        prompt: A game-playing agent receives a reward only when it wins, at the end of a 60-move game. What makes learning from that reward hard?
        options:
          - id: c
            text: The win works as a label, which turns the task into supervised learning
          - id: b
            text: The agent receives no feedback, because no single move is labeled
          - id: a
            text: It's unclear which of the 60 moves deserve credit for the win
        answer: a
        feedback: The reward is real feedback, but it arrives late and covers the whole game, so the agent must work out which earlier moves helped. It isn't a label on each move, which is why this isn't supervised learning.
