schema_version: 0.2-draft
lesson:
  id: multivariable-calculus
  version: 0.4.0-draft
  title: Several inputs, several rates of change
  state: draft
  summary: A network's loss depends on millions of weights at once. Learn how to ask each weight separately "which way, and how fast?", and why the answers form a gradient.
  slot: B13
  category: bridge
  sources:
    - title: Deep Learning — linear algebra
      url: https://www.deeplearningbook.org/contents/linear_algebra.html
    - title: Dive into Deep Learning — multivariable calculus
      url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/multivariable-calculus.html
objectives:
  - id: objective.multivariable-calculus
    version: 2-draft
    statement: Partial derivatives isolate one input’s local effect; gradients collect scalar sensitivities, while Jacobians organize sensitivities for vector outputs.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - multivariable-calculus.base.v2
      - multivariable-calculus.transfer.v2
    prerequisites:
      - anyOf:
          - objective.derivatives
      - anyOf:
          - objective.vectors
scenes:
  - id: multivariable-calculus.s1
    title: Hold the other inputs still
    type: explanation
    depth: intuition
    objective_refs:
      - objective.multivariable-calculus
    markdown: |-
      A real network's loss depends on millions of weights at once. Backpropagation hands back one slope per weight, and each slope answers a single question: if only *this* weight moved a little, how fast would the loss change? This detour shows what that means with two weights.

      Take the loss L(a, b) = a² + 3b². To ask about a alone, freeze b at its current value and treat 3b² as a constant. What's left changes like a², so its rate is 2a. That rate is the **partial derivative** of L with respect to a, written ∂L/∂a. Freezing a instead, 3b² changes at rate 3 × 2b = 6b, so ∂L/∂b = 6b.

      At the point (a, b) = (2, 1):

      - ∂L/∂a = 2 × 2 = 4
      - ∂L/∂b = 6 × 1 = 6

      "Partial" means one input at a time, with the rest held still. It is still an exact derivative, not an approximate one.
    bridges: []
  - id: multivariable-calculus.s2
    title: Stack the slopes into a gradient
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multivariable-calculus
    markdown: |-
      List the partial derivatives in the same order as the weights and you have the **gradient**, written ∇L. At (2, 1) it is ∇L = [4, 6]. A loss with a million weights has a gradient with a million entries, one per weight.

      Gradient descent steps every weight at once, against its own slope. With learning rate 0.1:

      [2, 1] − 0.1 × [4, 6] = [1.6, 0.4]

      The loss falls from 2² + 3 × 1² = 7 to 1.6² + 3 × 0.4² = 2.56 + 0.48 = 3.04. Check both slopes by nudging one weight at a time:

      ```python run
      import numpy as np

      def loss(w):
          a, b = w
          return a ** 2 + 3 * b ** 2

      w = np.array([2.0, 1.0])
      h = 1e-5
      grad = np.zeros(2)
      for i in range(2):                 # nudge one weight at a time
          nudge = np.zeros(2)
          nudge[i] = h
          grad[i] = (loss(w + nudge) - loss(w - nudge)) / (2 * h)

      print("nudged gradient:", grad.round(4))
      print("by hand [2a, 6b]:", 2 * w[0], 6 * w[1])
      w_new = w - 0.1 * grad
      print("one step:", w, "->", w_new.round(4))
      print("loss:", loss(w), "->", round(loss(w_new), 4))
      ```

      Try `w = np.array([-1.0, 2.0])`: the gradient becomes [−2, 12], and the step raises a while cutting b sharply.

      :::example A real model's gradient
      A price model predicts a × x + b, with loss L = (a·x + b − t)². Call the error e = a·x + b − t. Holding b still, the rate for a is 2e × x; holding a still, the rate for b is 2e × 1. With x = 2, t = 8, a = 3, and b = 1: e = 6 + 1 − 8 = −1, so ∇L = [2 × (−1) × 2, 2 × (−1)] = [−4, −2]. Both are negative, so both weights should grow.
      :::
    bridges:
      - derivatives
      - vectors
  - id: multivariable-calculus.s3
    title: Predict a change in any direction
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multivariable-calculus
    markdown: |-
      For a small move [da, db], the gradient predicts the change in loss: about 4·da + 6·db at our point. Moving only a by 0.01 predicts 4 × 0.01 = 0.04; the real change is 2.01² − 2² = 0.0401. Close, and closer still for smaller moves.

      :::predict You may nudge just one weight down by 0.1. Which lowers the loss more, a or b?
      Lowering a predicts 4 × (−0.1) = −0.4; lowering b predicts 6 × (−0.1) = −0.6. So b wins. The real changes are 1.9² − 4 = −0.39 and 3 × 0.9² − 3 = −0.57.
      :::

      :::mixup "The negative gradient points straight at the minimum."
      This loss is lowest at (0, 0), so from (2, 1) the straight route heads in direction [−2, −1]. The negative gradient is [−4, −6]: it leans toward b, because the loss is steeper in b. It points in the direction of fastest descent *from here*, which is usually not the direction of the bottom. On long, narrow valleys this makes gradient descent zigzag, which the lesson on momentum and Adam sets out to fix.
      :::
    bridges: []
  - id: multivariable-calculus.s4
    title: When the output is also a vector
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multivariable-calculus
    markdown: |-
      A network layer takes several numbers in and passes several numbers out. Now every output has a partial derivative with respect to every input. Arranged in a table with one row per output and one column per input, these form the **Jacobian**.

      Suppose a tiny layer outputs [a + b, 2a]. The first output rises 1 for each unit of a and 1 for each unit of b; the second rises 2 per unit of a and doesn't depend on b:

      $$J = \begin{bmatrix} 1 & 1 \\ 2 & 0 \end{bmatrix}$$

      Read down the first column: nudging a by 0.1 moves the outputs by [0.1, 0.2]. A layer with 3 inputs and 2 outputs has a 2 × 3 Jacobian. Backpropagation chains these rates through the layers, usually without ever writing a full table out; the backpropagation lesson traces it with numbers.
    bridges:
      - matrices-tensors
  - id: multivariable-calculus.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.multivariable-calculus
    markdown: New price models, a thousand-weight network, a layer's Jacobian, and a steep valley ask you to compute partial derivatives and read what a gradient says.
    takeaway: |-
      A partial derivative is the rate for one input with the others held still. The gradient lists one per weight and points toward the fastest local increase, so training steps against it.
  - id: multivariable-calculus.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.multivariable-calculus
    markdown: |-
      Hold other inputs fixed to measure one partial derivative. A gradient collects those rates for one output; a Jacobian collects them for several outputs.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - multivariable-calculus.s1
        - multivariable-calculus.s2
        - multivariable-calculus.s3
        - multivariable-calculus.s4
        - multivariable-calculus.check
      gate_refs:
        - gate.core
  scene_aliases:
    multivariable-calculus.recap: multivariable-calculus.check
assessment_families:
  - id: multivariable-calculus.base
    objective_ref: objective.multivariable-calculus
    task: base
    response_type: single_choice
    points: 1
    hint: 'Build a gradient by coordinates: trace the inputs, operation, and result before choosing.'
    remediation_scene: multivariable-calculus.s2
    variants:
      - id: multivariable-calculus.base.1
        prompt: For L(a, b) = a² + b², what is the gradient at [3, 4]?
        options:
          - id: b
            text: '[3, 4]'
          - id: c
            text: '[9, 16]'
          - id: a
            text: '[6, 8]'
        answer: a
        feedback: Differentiate each squared coordinate while holding the other fixed.
        retired: true
      - id: multivariable-calculus.base.2
        prompt: A scalar loss has 20 parameters. How many coordinate entries does its gradient have?
        options:
          - id: c
            text: '400'
          - id: a
            text: '20'
          - id: b
            text: '1'
        answer: a
        feedback: There is one partial derivative for each parameter coordinate.
        retired: true
  - id: multivariable-calculus.transfer
    objective_ref: objective.multivariable-calculus
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'When the output is also a vector: trace the inputs, operation, and result before choosing.'
    remediation_scene: multivariable-calculus.s4
    variants:
      - id: multivariable-calculus.transfer.1
        prompt: A positive partial derivative for weight a is observed. Which small change tends to lower loss with other weights fixed?
        options:
          - id: c
            text: Change only the learning-rate label
          - id: a
            text: Decrease a
          - id: b
            text: Increase a
        answer: a
        feedback: A positive derivative means local increase in a raises the loss.
        retired: true
      - id: multivariable-calculus.transfer.2
        prompt: A function maps 3 inputs to 2 outputs. With output rows and input columns, what is its Jacobian shape?
        options:
          - id: a
            text: 2 × 3
          - id: b
            text: 3 × 2
          - id: c
            text: 2 × 2
        answer: a
        feedback: Each of two outputs has a derivative with respect to each of three inputs.
        retired: true
  - id: multivariable-calculus.base.v2
    objective_ref: objective.multivariable-calculus
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: First compute the error e = a·x + b − t. Holding b still, ∂L/∂a = 2e × x; holding a still, ∂L/∂b = 2e × 1. Keep the sign of e.
    remediation_scene: multivariable-calculus.s2
    numeric_fields:
      - id: grad_a
        label: ∂L/∂a
      - id: grad_b
        label: ∂L/∂b
    absolute_tolerance: 1e-6
    variants:
      - id: multivariable-calculus.base.v2.1
        prompt: A price model predicts a × x + b with loss L = (a·x + b − t)². For one order, x = 3 and t = 10, and the current weights are a = 2 and b = 1. Enter both partial derivatives, then pick the reason.
        answers:
          grad_a: -18
          grad_b: -6
        reason_answer: a
        reason_options:
          - id: b
            text: Both partials equal 2e, because the two weights share one error
          - id: a
            text: Hold the other weight still; a's rate carries an extra factor of x
          - id: c
            text: Each partial is the loss split evenly between the two weights
        feedback: e = 6 + 1 − 10 = −3, so ∂L/∂a = 2 × (−3) × 3 = −18 and ∂L/∂b = 2 × (−3) = −6. Both weights share the error, but a enters multiplied by x, so its rate is x times larger.
      - id: multivariable-calculus.base.v2.2
        prompt: A price model predicts a × x + b with loss L = (a·x + b − t)². For one order, x = 2 and t = 5, and the current weights are a = 2 and b = 3. Enter both partial derivatives, then pick the reason.
        answers:
          grad_a: 8
          grad_b: 4
        reason_answer: a
        reason_options:
          - id: a
            text: Hold the other weight still; a's rate carries an extra factor of x
          - id: c
            text: Each partial is the loss split evenly between the two weights
          - id: b
            text: Both partials equal 2e, because the two weights share one error
        feedback: e = 4 + 3 − 5 = 2, so ∂L/∂a = 2 × 2 × 2 = 8 and ∂L/∂b = 2 × 2 = 4. Using 4 for both drops the factor x from a's rate.
      - id: multivariable-calculus.base.v2.3
        prompt: A price model predicts a × x + b with loss L = (a·x + b − t)². For one order, x = 4 and t = 6, and the current weights are a = 1 and b = 0. Enter both partial derivatives, then pick the reason.
        answers:
          grad_a: -16
          grad_b: -4
        reason_answer: a
        reason_options:
          - id: c
            text: Each partial is the loss split evenly between the two weights
          - id: b
            text: Both partials equal 2e, because the two weights share one error
          - id: a
            text: Hold the other weight still; a's rate carries an extra factor of x
        feedback: e = 4 + 0 − 6 = −2, so ∂L/∂a = 2 × (−2) × 4 = −16 and ∂L/∂b = 2 × (−2) = −4. Both are negative, so a small increase in either weight lowers the loss.
      - id: multivariable-calculus.base.v2.4
        prompt: A price model predicts a × x + b with loss L = (a·x + b − t)². For one order, x = 5 and t = 12, and the current weights are a = 2 and b = 0. Enter both partial derivatives, then pick the reason.
        answers:
          grad_a: -20
          grad_b: -4
        reason_answer: a
        reason_options:
          - id: a
            text: Hold the other weight still; a's rate carries an extra factor of x
          - id: b
            text: Both partials equal 2e, because the two weights share one error
          - id: c
            text: Each partial is the loss split evenly between the two weights
        feedback: e = 10 + 0 − 12 = −2, so ∂L/∂a = 2 × (−2) × 5 = −20 and ∂L/∂b = 2 × (−2) = −4. The loss is 4, but that value isn't a rate for either weight.
  - id: multivariable-calculus.transfer.v2
    objective_ref: objective.multivariable-calculus
    task: transfer
    response_type: single_choice
    points: 1
    hint: Each partial derivative belongs to one input with the others held still. Its sign says which way that input should move, and its size says how much the loss responds.
    remediation_scene: multivariable-calculus.s3
    variants:
      - id: multivariable-calculus.transfer.v2.1
        prompt: A small image classifier has 1,000 weights and produces one loss number. How many entries does the gradient of the loss have?
        options:
          - id: c
            text: 1, because there is a single loss number
          - id: a
            text: 1,000, one partial derivative per weight
          - id: b
            text: 1,000,000, one for every pair of weights
        answer: a
        feedback: The gradient has one entry per input to the loss, so it has the same shape as the weights. A table over every pair of weights holds second derivatives, which is a different object.
      - id: multivariable-calculus.transfer.v2.2
        prompt: A layer maps 4 inputs to 3 outputs. With one row per output and one column per input, what shape is its Jacobian?
        options:
          - id: b
            text: 4 × 3, one row for each input
          - id: c
            text: 3 × 3, one row and column per output
          - id: a
            text: 3 × 4, one row for each output
        answer: a
        feedback: Each of the 3 outputs gets a row holding its derivatives with respect to all 4 inputs, so the table is 3 × 4. Swapping to 4 × 3 flips the stated convention.
      - id: multivariable-calculus.transfer.v2.3
        prompt: At the current weights, ∂L/∂a = −2 and ∂L/∂b = 5. You may nudge just one weight by 0.1, up or down. Which nudge lowers the loss most?
        options:
          - id: b
            text: Increase b, since its partial derivative is the largest
          - id: a
            text: Decrease b, for a predicted change of about −0.5
          - id: c
            text: Increase a, since a's partial derivative is negative
        answer: a
        feedback: Decreasing b predicts 5 × (−0.1) = −0.5. Increasing a also helps, but only by about −2 × 0.1 = −0.2. Increasing b would raise the loss by about 0.5, because its slope is positive.
      - id: multivariable-calculus.transfer.v2.4
        prompt: For L(a, b) = a² + 9b² at (3, 1), the gradient is [6, 18]. The minimum is at (0, 0). Where does one small step against the gradient head?
        options:
          - id: c
            text: Mostly along a, because a starts farther from zero
          - id: b
            text: Straight toward (0, 0), where the loss is lowest
          - id: a
            text: Mostly along b, because the loss is steeper in b
        answer: a
        feedback: The step follows [−6, −18], three times more in b than in a, while the straight route to the bottom is [−3, −1]. The gradient reports local steepness, not where the minimum is.
