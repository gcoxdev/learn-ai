schema_version: 0.2-draft
lesson:
  id: multivariable-calculus
  version: 0.2.0-draft
  title: Several inputs, several rates of change
  state: draft
  summary: Change one input at a time, then collect the rates into a vector or table.
  slot: B13
  category: bridge
  sources:
  - title: Deep Learning — linear algebra
    url: https://www.deeplearningbook.org/contents/linear_algebra.html
  - title: Dive into Deep Learning — multivariable calculus
    url: https://d2l.ai/chapter_appendix-mathematics-for-deep-learning/multivariable-calculus.html
objectives:
- id: objective.multivariable-calculus
  version: 1-draft
  statement: Partial derivatives isolate one input’s local effect; gradients collect scalar sensitivities,
    while Jacobians organize sensitivities for vector outputs.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - multivariable-calculus.base
  - multivariable-calculus.transfer
  prerequisites:
  - anyOf:
    - objective.derivatives
  - anyOf:
    - objective.vectors
scenes:
- id: multivariable-calculus.s1
  title: Hold the other inputs still
  type: explanation
  depth: intuition
  objective_refs:
  - objective.multivariable-calculus
  markdown: For a loss depending on weights a and b, a partial derivative with respect to a asks how the loss
    changes when a changes slightly and b stays fixed. The word partial identifies that controlled comparison.
    It does not mean an incomplete or approximate derivative.
  text_mode: For a loss depending on weights a and b, a partial derivative with respect to a asks how the loss
    changes when a changes slightly and b stays fixed. The word partial identifies that controlled comparison.
    It does not mean an incomplete or approximate derivative.
  bridges: []
- id: multivariable-calculus.s2
  title: Build a gradient by coordinates
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multivariable-calculus
  markdown: Let L(a, b) = a² + 3b². Its partial derivatives are 2a and 6b. At a = 2 and b = 1, the gradient
    is [4, 6]. Read this as local sensitivity per unit change in each weight. A step of size 0.1 in the negative-gradient
    direction gives [1.6, 0.4].
  text_mode: Let L(a, b) = a² + 3b². Its partial derivatives are 2a and 6b. At a = 2 and b = 1, the gradient
    is [4, 6]. Read this as local sensitivity per unit change in each weight. A step of size 0.1 in the negative-gradient
    direction gives [1.6, 0.4].
  bridges:
  - derivatives
  - vectors
- id: multivariable-calculus.s3
  title: Ask about a chosen direction
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multivariable-calculus
  markdown: 'For a small change vector [da, db], the first-order loss change is approximately 4da + 6db at
    our example point. A direction [1, 0] changes only a. When comparing rates across directions, use unit-length
    directions. The gradient points toward steepest local increase under ordinary Euclidean distance, not necessarily
    toward a global maximum.


    At [a, b] = [2, 1], changing only a by 0.01 gives predicted loss change 4 × 0.01 = 0.04. The actual change
    is 2.01² − 2² = 0.0401, close but not identical. Changing only b by 0.01 predicts 0.06 instead. The gradient
    keeps these separate sensitivities in order.'
  text_mode: 'For a small change vector [da, db], the first-order loss change is approximately 4da + 6db at
    our example point. A direction [1, 0] changes only a. When comparing rates across directions, use unit-length
    directions. The gradient points toward steepest local increase under ordinary Euclidean distance, not necessarily
    toward a global maximum.


    At [a, b] = [2, 1], changing only a by 0.01 gives predicted loss change 4 × 0.01 = 0.04. The actual change
    is 2.01² − 2² = 0.0401, close but not identical. Changing only b by 0.01 predicts 0.06 instead. The gradient
    keeps these separate sensitivities in order.'
  bridges: []
- id: multivariable-calculus.s4
  title: When the output is also a vector
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multivariable-calculus
  markdown: 'A Jacobian is a table of output derivatives with respect to inputs. If outputs are [a + b, 2a],
    rows for outputs and columns for inputs give [[1, 1], [2, 0]]. Backpropagation can multiply sensitivities
    through such transformations without materializing every full Jacobian. State the row and column convention
    before checking shapes.


    In the displayed Jacobian, the first column [1, 2] tells how the two outputs respond to a. Increasing a
    by 0.1 with b fixed increases the outputs by [0.1, 0.2]. Here the prediction is exact because both output
    rules are linear. For curved rules it is generally a local approximation.'
  text_mode: 'A Jacobian is a table of output derivatives with respect to inputs. If outputs are [a + b, 2a],
    rows for outputs and columns for inputs give [[1, 1], [2, 0]]. Backpropagation can multiply sensitivities
    through such transformations without materializing every full Jacobian. State the row and column convention
    before checking shapes.


    In the displayed Jacobian, the first column [1, 2] tells how the two outputs respond to a. Increasing a
    by 0.1 with b fixed increases the outputs by [0.1, 0.2]. Here the prediction is exact because both output
    rules are linear. For curved rules it is generally a local approximation.'
  bridges:
  - matrices-tensors
