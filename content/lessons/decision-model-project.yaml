objectives:
  - id: objective.decision-model-project
    version: 1-draft
    statement: Build and evaluate a small softmax decision model on labelled messages. Measure accuracy and ECE, fit a temperature on a validation split, choose a confidence threshold for a target error rate on automated messages, and report automation rate, error counts, cost and one failure case from a test split used once.
