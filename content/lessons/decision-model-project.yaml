  version: 0.4.0-draft
  title: "Project: build and gate a tiny router"
  state: draft
  summary: Train a small fixed-label router on 60 invented Tally messages, fit its temperature, then choose on validation the gate that decides which messages a machine may route alone. Open the test messages once, and report accuracy, ECE, automation, cost and a failure case.
