assessment_families:
  - id: decision-model-project.base
    objective_ref: objective.decision-model-project
    task: base
    response_type: single_choice
    points: 1
    hint: "Walk the pipeline in order: weights from train, temperature and threshold from validation, final numbers from test, used once. Ask which split each choice used."
    remediation_scene: decision-model-project.s3
    variants:
      - id: decision-model-project.base.1
        prompt: Why does the project fit the temperature on the validation split instead of the training split?
        options:
          - id: b
            text: Validation is larger, so it gives a much steadier estimate
          - id: a
            text: The model already fits the training messages, so it looks too sure there
          - id: c
            text: Temperature can only be computed on messages that have no labels
        answer: a
        feedback: The weights were chosen to fit the training messages, so confidence on them looks better than it will on new ones. Fitting T on unseen messages shows the real gap. Validation is actually the smaller split here, and temperature fitting uses the labels.
      - id: decision-model-project.base.2
        prompt: The fitted temperature is T = 0.65, below 1, and test ECE falls from 0.116 to 0.093. What does that tell you about the raw model?
        options:
          - id: c
            text: It was accurate, but its predictions were wrong 35% of the time
          - id: b
            text: It was overconfident, so T flattened its probabilities
          - id: a
            text: It was underconfident, so dividing by 0.65 sharpened them
        answer: a
        feedback: A T below 1 makes probabilities sharper, and it helped, so the raw model was too unsure. Overconfident models need T above 1. Temperature never changes accuracy, so it can't explain a wrong 35%.
      - id: decision-model-project.base.3
        prompt: The 0.75 gate showed 0 errors on 8 automated validation messages, but test shows 1 error among 14. What is the best reading?
        options:
          - id: b
            text: The temperature was fitted wrongly, so refit it on the test messages
          - id: c
            text: Some test messages leaked into training, which raised the errors
          - id: a
            text: Counts this small are noisy, so neither rate promises much
        answer: a
        feedback: One message moves the error rate by about 7 points on 14 automated messages, and 0 of 8 is just as loose. More labelled messages would narrow this. Refitting on test would use the sealed split, and nothing here suggests leakage.
      - id: decision-model-project.base.4
        prompt: A teammate tries thresholds 0.60 to 0.95 on the test split and keeps the one with the best cost. What is wrong with that?
        options:
          - id: c
            text: Thresholds should be picked on the training split, where the model is most sure
          - id: a
            text: The test split now guided a choice, so its numbers are too optimistic
          - id: b
            text: Test has too few messages for any cost to be computed at all
        answer: a
        feedback: Once the test split picks the threshold, it can no longer give an honest estimate of a gate it hasn't seen. Choose on validation and run test once. Training messages are the wrong place too, since the model is overconfident on them, and a small test can still report a cost.
      - id: decision-model-project.base.5
        prompt: A bag-of-words model gives a message with both "refund" and "cancelled booking" a 48% chance of billing and 45% of bookings. Which feature of the model explains the split?
        options:
          - id: a
            text: Word counts ignore order and context, so both sets of cue words count
          - id: c
            text: Softmax cannot give two routes nearly the same probability
          - id: b
            text: The vocabulary was too large for the model to separate the two routes
        answer: a
        feedback: A bag of words sees "refund" and "cancelled booking" as separate cues pointing in different directions, with no sense of which matters. Softmax handles near-ties easily, and a small vocabulary would make this worse.
      - id: decision-model-project.base.6
        prompt: A test message contains words that never appeared in the training messages. What does the bag-of-words model do with them?
        options:
          - id: b
            text: It stops with an error, since the words are not in the vocabulary
          - id: c
            text: It sends the message to an "other" route it learned
          - id: a
            text: It skips them, so only known words push the probabilities
        answer: a
        feedback: The vocabulary came from training, so unseen words have no column and add nothing. A message with few known words ends up with weak, spread-out probabilities, which is often how the gate catches it. There is no "other" route in this project.
      - id: decision-model-project.base.7
        prompt: Your threshold search finds that no threshold keeps the error among automated validation messages at or under the target. What should the code do?
        options:
          - id: b
            text: Choose the highest threshold and report an error rate of 0%
          - id: a
            text: Report that nothing qualifies and send every message to people
          - id: c
            text: Choose the lowest threshold, since it automates the most messages
        answer: a
        feedback: If no gate meets the target, the honest policy is not to automate. A very high threshold with nothing automated has an error rate that can't be measured, not 0%, and the lowest threshold is the one most likely to break the target.
  - id: decision-model-project.transfer
    objective_ref: objective.decision-model-project
    task: transfer
    response_type: single_choice
    points: 1
    hint: Apply the same pipeline to the new setting. Ask which split each step used, what the counts behind a rate are, and whether the number you are quoting answers the manager's question.
    remediation_scene: decision-model-project.mistakes
    variants:
      - id: decision-model-project.transfer.1
        prompt: A hotel builds this pipeline for room service, housekeeping, maintenance and complaints with 200 labelled messages, and wants at most 3% errors on automated messages. Which step is riskiest?
        options:
          - id: b
            text: Turning four scores into probabilities with a softmax
          - id: a
            text: Choosing the threshold from a few dozen messages
          - id: c
            text: Splitting the labelled messages into three groups
        answer: a
        feedback: A 3% target needs far more automated examples than a few dozen validation messages provide to be checked, since one error moves the rate by several points. Softmax and splitting are routine steps.
      - id: decision-model-project.transfer.2
        prompt: On another dataset, the fitted temperature comes out at T = 2.4 and test ECE drops from 0.21 to 0.05. What does that suggest?
        options:
          - id: c
            text: The model was underconfident, so dividing by 2.4 sharpened it
          - id: b
            text: Accuracy rose, since ECE and accuracy move together
          - id: a
            text: The raw model was overconfident, and dividing by 2.4 flattened it
        answer: a
        feedback: A T above 1 flattens the probabilities, and it cut ECE, so the raw confidences were too high. Temperature leaves the top pick alone, so accuracy stays the same, and the underconfident case needs T below 1.
      - id: decision-model-project.transfer.3
        prompt: A product owner asks for 95% automation. What is the most useful reply from your validation table?
        options:
          - id: b
            text: Lower the threshold until 95% is automated, and report that number
          - id: c
            text: Retrain the model until its overall accuracy reaches 95%
          - id: a
            text: Show the error rate and cost at that automation level, and let them choose
        answer: a
        feedback: Automation rate and error rate move together, so the useful answer is what 95% costs in errors, using real prices. Lowering the gate without looking at errors hides the cost, and overall accuracy is a different number.
      - id: decision-model-project.transfer.4
        prompt: A report says "accuracy 0.90, ECE 0.04, so we can automate everything above 0.5 confidence." Which number is missing?
        options:
          - id: a
            text: The error rate among messages above 0.5, with counts
          - id: c
            text: A bigger vocabulary, to lift accuracy further
          - id: b
            text: A lower ECE, since 0.04 is still too high
        answer: a
        feedback: The decision is about the automated messages, and overall accuracy mixes in the ones people still handle. Selective error with counts answers the manager's question. ECE of 0.04 is already low, and vocabulary size is a separate matter.
      - id: decision-model-project.transfer.5
        prompt: A teammate trains on the first 40 messages by date and tests on the last 20, and gets lower accuracy than with a random split. How should the team choose between the two?
        options:
          - id: b
            text: Keep the random split, because a higher score is the better result
          - id: c
            text: Keep whichever is lower, since a pessimistic estimate is always safer
          - id: a
            text: Match the split to deployment; a date split suits a router that will see future messages
        answer: a
        feedback: A test should resemble how the model will be used. A router that will read tomorrow's messages is better tested on later ones than on a shuffle. A random split isn't wrong in itself and suits messages that are interchangeable, but it can let near-duplicates or the same customer's messages sit on both sides. Neither the higher number nor the lower one is correct by default.
      - id: decision-model-project.transfer.6
        prompt: The router sends "Where is the refund you promised?" to billing with a top probability of 0.97. What may the system do on its own?
        options:
          - id: c
            text: Nothing, since a probability below 1 is never good enough
          - id: b
            text: Issue the refund, because the model chose billing
          - id: a
            text: Route it to billing and tag it as a refund request for review
        answer: a
        feedback: A route says what the message is about, and a tag marks a request. Whether the customer qualifies for a refund depends on checks the model hasn't done, so a workflow reviews it. A gate set at a chosen threshold exists so that high probabilities can be acted on, and issuing money isn't the classification's job.
  - id: decision-model-project.calculate
    objective_ref: objective.decision-model-project
    task: base
    response_type: numeric
    points: 1
    hint: "Cost per message = share sent to people × human cost + share automated × error rate × cost of a wrong action. Ignore the model's own tiny cost."
    remediation_scene: decision-model-project.s3
    absolute_tolerance: 0.005
    variants:
      - id: decision-model-project.calculate.1
        prompt: A gate automates 70% of messages, with 7% errors among them. People cost $0.50 per message and a wrong automation costs $5. What is the cost per message in dollars?
        answer: 0.395
        feedback: People handle 30%, which costs 0.30 × 0.50 = 0.15. Errors cost 0.70 × 0.07 × 5 = 0.245. The total is 0.395.
      - id: decision-model-project.calculate.2
        prompt: A gate automates 60% of messages, with 2% errors among them. People cost $0.50 per message and a wrong automation costs $5. What is the cost per message in dollars?
        answer: 0.26
        feedback: People handle 40%, so 0.40 × 0.50 = 0.20. Errors cost 0.60 × 0.02 × 5 = 0.06. The total is 0.26.
      - id: decision-model-project.calculate.3
        prompt: A gate automates 80% of messages, with 10% errors among them. People cost $0.50 per message and a wrong automation costs $2. What is the cost per message in dollars?
        answer: 0.26
        feedback: People handle 20%, so 0.20 × 0.50 = 0.10. Errors cost 0.80 × 0.10 × 2 = 0.16. The total is 0.26.
      - id: decision-model-project.calculate.4
        prompt: A gate automates 50% of messages with no errors among them. People cost $0.40 per message and a wrong automation costs $10. What is the cost per message in dollars?
        answer: 0.2
        feedback: People handle 50%, so 0.50 × 0.40 = 0.20. With no errors, the $10 price never applies, so the total is 0.20.
      - id: decision-model-project.calculate.5
        prompt: A gate automates 90% of messages, with 5% errors among them. People cost $0.60 per message and a wrong automation costs $8. What is the cost per message in dollars?
        answer: 0.42
        feedback: People handle 10%, so 0.10 × 0.60 = 0.06. Errors cost 0.90 × 0.05 × 8 = 0.36. The total is 0.42.
      - id: decision-model-project.calculate.6
        prompt: A gate automates 5 of 12 messages, and 1 of those 5 is wrong. People cost $0.50 per message and a wrong automation costs $5. What is the cost per message in dollars?
        answer: 0.708
        feedback: People handle 7 of 12, which costs 7 × 0.50 = 3.50. The error costs 1 × 5 = 5. The total is 8.50 across 12 messages, or 0.708 each, more than the 0.50 of sending every message to people.
