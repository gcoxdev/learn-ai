schema_version: 0.2-draft
lesson:
  id: factuality-and-abstention
  version: 0.4.0-draft
  title: Evaluate claims against evidence and recognize missing information
  state: draft
  summary: The support bot told a customer that Canada roaming was free. It wasn't. Learn to count invented claims, and to choose when a model should say "let me check" instead.
  slot: M28.5
  category: learning
  sources:
    - title: "On Faithfulness and Factuality in Abstractive Summarization (Maynez et al., 2020)"
      url: https://arxiv.org/abs/2005.00661
    - title: "FActScore: Fine-grained Atomic Evaluation of Factual Precision in Long Form Text Generation (Min et al., 2023)"
      url: https://arxiv.org/abs/2305.14251
    - title: "SelfCheckGPT: Zero-Resource Black-Box Hallucination Detection (Manakul et al., 2023)"
      url: https://arxiv.org/abs/2303.08896
    - title: "Language Models (Mostly) Know What They Know (Kadavath et al., 2022)"
      url: https://arxiv.org/abs/2207.05221
    - title: Selective Classification for Deep Neural Networks
      url: https://arxiv.org/abs/1705.08500
    - title: TruthfulQA
      url: https://arxiv.org/abs/2109.07958
objectives:
  - id: objective.factuality-and-abstention
    version: 2-draft
    statement: Factual reliability requires claim-level verification, calibrated uncertainty, and suitable abstention; plausible generation, citations, and model confidence are individually insufficient.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - factuality-and-abstention.base.v2
      - factuality-and-abstention.transfer.v2
      - factuality-and-abstention.calculate
    prerequisites:
      - anyOf:
          - objective.citations-and-evidence-fidelity
      - anyOf:
          - objective.evaluation-metrics-and-uncertainty
scenes:
  - id: factuality-and-abstention.s1
    title: Four ways to make something up
    type: explanation
    depth: intuition
    objective_refs:
      - objective.factuality-and-abstention
    markdown: |-
      A Kestrel customer asks whether the Basic plan works in Canada. Model B, with the roaming help page in its context, replies: "Yes! Basic includes free roaming in Canada and the US, and you'll get a welcome text when you land." The page says Basic includes US roaming only, and Canada costs \$5 a day. The welcome text isn't mentioned anywhere.

      People call all of this **hallucination**: fluent output that isn't supported. It helps to split it, because each kind has a different check:

      | Kind | What happened | B's reply | Check |
      | --- | --- | --- | --- |
      | **Contradicts the source** | Conflicts with the provided text | "free roaming in Canada" | Compare with the page |
      | **Unsupported** | Adds a claim the source doesn't contain | "a welcome text when you land" | Is it in the page at all? |
      | **Factually wrong** | False about the world, with no source given | (none here) | Reference data or experts |
      | **Fabricated citation** | Cites a source that doesn't exist or doesn't say it | (none here) | Open the source |

      Maynez et al. (2020) called the first two *intrinsic* and *extrinsic* hallucinations. An unsupported claim can happen to be true; it still fails a support bot, whose answers must come from Kestrel's pages.

      To score a whole reply, split it into single claims and check each, as in the lesson on citations and evidence. B's reply has three claims: US roaming included (supported), Canada included (contradicted), welcome text (unsupported). One of three is supported. FActScore (Min et al., 2023) automates this: it splits long answers into short "atomic facts" and reports the fraction a knowledge source supports.
    bridges: []
  - id: factuality-and-abstention.s2
    title: How sure is the model?
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.factuality-and-abstention
    markdown: |-
      To decide when B should answer and when it should say "Let me check with a colleague," Kestrel needs a confidence score for each reply. Three are common:

      - **Token probability**: how likely the model found its own answer's words. It measures how typical the wording is, which isn't the same as how likely the claim is to be true.
      - **Stated confidence**: ask the model, "How likely is your answer to be correct?" Kadavath et al. (2022) found large models' self-assessments were fairly well calibrated on some question types, and less so on others.
      - **Self-consistency**: sample the answer five times. If all five say "\$5 a day," confidence is high; if they scatter, it's low. SelfCheckGPT (Manakul et al., 2023) uses this disagreement to flag likely hallucinations without needing any source.

      Whichever score you pick, check it the way the lesson on calibrated decisions checked forecasts: among replies scored 0.8, are about 80% right?
    bridges: []
  - id: factuality-and-abstention.s3
    title: Trade coverage for fewer errors
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.factuality-and-abstention
    markdown: |-
      Kestrel's rule will be: answer only if confidence is at least a threshold $t$; otherwise hand off to a person. This is **selective prediction**. Two numbers describe it. **Coverage** is the share of questions the model answers. **Risk** is the error rate among the questions it answers.

      Here are B's 20 answers from a calibration set, sorted by confidence (✗ marks a wrong answer):

      0.98, 0.96, 0.95, 0.93, 0.91, 0.90, **0.88 ✗**, 0.86, 0.84, 0.81, 0.78, **0.75 ✗**, 0.72, 0.68, **0.64 ✗**, 0.60, **0.55 ✗**, **0.50 ✗**, 0.45, **0.40 ✗**

      With $t = 0.80$, B answers the top 10 and gets one wrong: coverage 50%, risk 10%. Kestrel's target is a risk of at most 10%. The program tries five thresholds and keeps the lowest of them that meets the target.

      ```python run
      # 20 test questions: (model confidence, answer was correct?)
      results = [(0.98, 1), (0.96, 1), (0.95, 1), (0.93, 1), (0.91, 1), (0.90, 1), (0.88, 0),
                 (0.86, 1), (0.84, 1), (0.81, 1), (0.78, 1), (0.75, 0), (0.72, 1), (0.68, 1),
                 (0.64, 0), (0.60, 1), (0.55, 0), (0.50, 0), (0.45, 1), (0.40, 0)]
      target_risk = 0.10

      print("threshold  coverage  risk")
      chosen = None
      for t in [0.90, 0.80, 0.70, 0.60, 0.00]:
          answered = [ok for conf, ok in results if conf >= t]
          coverage = len(answered) / len(results)
          risk = 1 - sum(answered) / len(answered)        # error rate among answered
          print(f"  {t:.2f}     {coverage:5.0%}    {risk:5.1%}")
          if risk <= target_risk:
              chosen = (t, coverage)                        # lowest threshold that meets target
      print(f"lowest tested threshold with risk <= {target_risk:.0%}: {chosen[0]:.2f}, answering {chosen[1]:.0%}")
      ```

      Plotting risk against coverage for every threshold gives the **risk–coverage curve**. Lowering $t$ answers more questions and makes more mistakes. Answering everything gives 30% risk. Try `target_risk = 0.20` and see how much coverage the looser target buys. Then add 0.78 to the list of thresholds: it also meets the 10% target, and answers one more question.

      :::papers Selective prediction
      $$\text{coverage}(t) = \frac{1}{n}\sum_{i=1}^{n} \mathbb{1}[c_i \ge t], \qquad \text{risk}(t) = \frac{\sum_i \mathbb{1}[c_i \ge t]\,\ell_i}{\sum_i \mathbb{1}[c_i \ge t]}$$

      $c_i$ is the confidence on question $i$ and $\ell_i$ is 1 if the answer was wrong. At $t = 0.80$: 10 of 20 answered, and 1 of those 10 wrong. Geifman and El-Yaniv (2017) showed how to choose $t$ on held-out data so the risk target holds on new data with high probability.
      :::

      Twenty questions make a jumpy curve. Kestrel picks the threshold on 2,000 held-out chats and then confirms it on a fresh set, so the threshold isn't tuned to luck.
    bridges: []
  - id: factuality-and-abstention.scoring
    title: A scoreboard that rewards guessing
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.factuality-and-abstention
    markdown: |-
      Under plain accuracy, "I don't know" scores 0 and a guess scores 1 if lucky. So a model tuned on accuracy learns to always guess. A guess with a 10% chance of being right still beats abstaining.

      Kestrel prices outcomes instead. A right answer is worth +1. A hand-off is worth 0. A wrong answer costs −3, because it means an angry customer and often a refund. Answering with confidence $p$ is then worth $p \times 1 + (1-p) \times (-3) = 4p - 3$ on average, which beats 0 when $p > 0.75$.

      :::predict If a wrong answer cost −9 instead, where should the threshold be?
      Answer when $p - 9(1-p) > 0$, which means $p > 0.9$. In general the threshold is $k/(1+k)$ for a wrong-answer cost of $k$. The costlier the mistake, the more often the model should hand off.
      :::

      So pick the threshold from what mistakes cost, and score models the same way. Otherwise the benchmark will prefer the model that bluffs.
    bridges: []
  - id: factuality-and-abstention.s4
    title: Test with missing and conflicting evidence
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.factuality-and-abstention
    markdown: |-
      A model that abstains on hard wording isn't the same as one that notices missing information. To test grounding, Kestrel builds three versions of 60 questions, changing only the retrieved help pages:

      | Evidence given | Right behavior | B |
      | --- | --- | ---: |
      | Sufficient: the page answers it | Answer from the page | 54 of 60 |
      | Insufficient: the relevant page removed | Say so, hand off | 31 of 60 |
      | Conflicting: old and new price pages | Use the newer page or flag the conflict | 22 of 60 |

      B is good when the answer is in front of it. When it isn't, B fills the gap from what it absorbed in training about phone plans half the time. That's the Canada reply again. The team's next training data and system prompt target exactly those two rows, and the table becomes a standing test.
    bridges: []
  - id: factuality-and-abstention.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.factuality-and-abstention
    markdown: Compute the risk at a few thresholds, then judge a medical Q&A bot, a travel assistant, a legal summarizer, and a quiz leaderboard.
    takeaway: |-
      Check replies claim by claim against the source. Let the model answer only above a confidence threshold chosen from what a wrong answer costs, and report risk and coverage together.
  - id: factuality-and-abstention.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.factuality-and-abstention
    markdown: |-
      Verify important claims against appropriate evidence. When a system declines to answer, report both its accuracy on answered requests and how much of the task it covers.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - factuality-and-abstention.s1
        - factuality-and-abstention.s2
        - factuality-and-abstention.s3
        - factuality-and-abstention.scoring
        - factuality-and-abstention.s4
        - factuality-and-abstention.check
      gate_refs:
        - gate.core
  scene_aliases:
    factuality-and-abstention.recap: factuality-and-abstention.check
assessment_families:
  - id: factuality-and-abstention.base
    objective_ref: objective.factuality-and-abstention
    task: base
    response_type: single_choice
    points: 1
    hint: 'Separate uncertainty signals: trace the inputs, operation, and result before choosing.'
    remediation_scene: factuality-and-abstention.s2
    variants:
      - id: factuality-and-abstention.base.1
        prompt: Does high next-token probability guarantee a factual statement is true?
        options:
          - id: c
            text: Only for complete sentences
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Text likelihood and factual truth are different properties.
        retired: true
      - id: factuality-and-abstention.base.2
        prompt: What can a higher abstention threshold trade?
        options:
          - id: a
            text: Higher answered-case reliability for lower coverage
          - id: b
            text: Guaranteed full coverage and perfect correctness
          - id: c
            text: Only output typography
        answer: a
        feedback: Selective prediction changes which cases are answered.
        retired: true
  - id: factuality-and-abstention.transfer
    objective_ref: objective.factuality-and-abstention
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Check grounded generation directly: trace the inputs, operation, and result before choosing.'
    remediation_scene: factuality-and-abstention.s4
    variants:
      - id: factuality-and-abstention.transfer.1
        prompt: Why define the meaning of hallucination in an evaluation?
        options:
          - id: a
            text: The term can refer to different error types
          - id: b
            text: It has one universal precise metric
          - id: c
            text: Only to avoid measuring errors
        answer: a
        feedback: Clear categories make results interpretable.
        retired: true
      - id: factuality-and-abstention.transfer.2
        prompt: A correct fact lacks required support from the supplied document. Can the task still fail?
        options:
          - id: b
            text: 'No'
          - id: c
            text: Only if the answer is short
          - id: a
            text: 'Yes'
        answer: a
        feedback: Grounding requirements add constraints beyond truth alone.

        retired: true
  - id: factuality-and-abstention.base.v2
    objective_ref: objective.factuality-and-abstention
    task: base
    response_type: single_choice
    points: 1
    hint: Coverage divides by all questions; risk divides only by the questions the model answered. For hallucinations, ask whether the claim conflicts with the source or is simply absent from it.
    remediation_scene: factuality-and-abstention.s3
    variants:
      - id: factuality-and-abstention.base.v2.1
        prompt: A reply says an eSIM swap costs $10, but the help page in the model's context says $15. Which kind of hallucination is this?
        options:
          - id: b
            text: An unsupported claim, since the page doesn't mention $10
          - id: a
            text: A contradiction of the source, since the page gives a different fee
          - id: c
            text: A fabricated citation, since the reply misreports the page
        answer: a
        feedback: The page states the fee, and the reply conflicts with it, so this contradicts the source (an intrinsic hallucination). An unsupported claim adds something the page never covers, and no citation was given here.
      - id: factuality-and-abstention.base.v2.2
        prompt: At a threshold of 0.8, a model answers 50 of 100 questions and gets 45 of those right. What are its coverage and risk?
        options:
          - id: c
            text: Coverage 50%, risk 5%
          - id: b
            text: Coverage 45%, risk 10%
          - id: a
            text: Coverage 50%, risk 10%
        answer: a
        feedback: Coverage is 50/100 = 50%. Risk counts errors among answered questions only, 5/50 = 10%. Dividing the 5 errors by all 100 questions gives the misleading 5%.
      - id: factuality-and-abstention.base.v2.3
        prompt: A benchmark scores plain accuracy, with "I don't know" counted as 0. Why does a model tuned to top it learn to guess instead of abstaining?
        options:
          - id: a
            text: Abstaining scores 0, while a guess has some chance of scoring 1
          - id: b
            text: Guesses make answers longer, and longer answers are graded higher
          - id: c
            text: Abstentions are counted as two wrong answers on the scoreboard
        answer: a
        feedback: With no penalty for wrong answers, any guess has positive expected score, so guessing beats abstaining. Pricing a wrong answer below zero is what makes abstaining worthwhile.
      - id: factuality-and-abstention.base.v2.4
        prompt: A model assigns high probability to the words of its answer. Why is that not enough to trust the claim?
        options:
          - id: b
            text: Token probabilities are usually too low to be of any use
          - id: c
            text: Token probability works only when a source is in the context
          - id: a
            text: It measures how typical the wording is, not whether it's true
        answer: a
        feedback: A fluent, common phrasing can be highly probable and false. Any confidence score has to be checked for calibration against real correctness before a threshold is set on it.
  - id: factuality-and-abstention.transfer.v2
    objective_ref: objective.factuality-and-abstention
    task: transfer
    response_type: single_choice
    points: 1
    hint: Price each outcome (right, wrong, hand-off), then compare expected scores. For grounding, ask what happens when the needed evidence is missing or contradicts itself.
    remediation_scene: factuality-and-abstention.scoring
    variants:
      - id: factuality-and-abstention.transfer.v2.1
        prompt: "A medical Q&A bot scores +1 for a right answer, 0 for referring to a nurse, and −19 for a wrong answer. Above what confidence should it answer?"
        options:
          - id: b
            text: Above 0.50, whenever it is more likely right than wrong
          - id: c
            text: Above 0.81, which is one minus a 19% cost share
          - id: a
            text: Above 0.95, where p − 19(1 − p) turns positive
        answer: a
        feedback: "Answering is worth p − 19(1 − p) = 20p − 19, which is positive only when p > 0.95. The 0.50 rule ignores that a wrong answer costs 19 times what a right one gains."
      - id: factuality-and-abstention.transfer.v2.2
        prompt: A travel assistant is tested only on questions whose answer is in the retrieved booking pages, and it scores 94%. What test is missing before launch?
        options:
          - id: a
            text: Versions with the needed page removed or with two conflicting pages
          - id: b
            text: More complete booking pages from a wider range of airlines
          - id: c
            text: A judge that rates how friendly and confident the replies sound
        answer: a
        feedback: The 94% only covers the easy case where the evidence is present. Missing and conflicting pages test whether the assistant notices gaps instead of filling them from memory. More complete pages still skip those cases.
      - id: factuality-and-abstention.transfer.v2.3
        prompt: A contract summary has 10 claims. Seven are supported by the contract, 2 contradict it, and 1 does not appear in it. What fraction is supported, counted the FActScore way?
        options:
          - id: c
            text: 0.8, since the absent claim doesn't contradict the contract
          - id: a
            text: 0.7, since only the 7 supported claims count as supported
          - id: b
            text: 0.78, since 7 of the 9 checkable claims are supported
        answer: a
        feedback: A claim counts only if the source supports it, so the absent claim counts against the summary too. It may be true, but a summary must come from the contract. Dropping it from the denominator hides the problem.
      - id: factuality-and-abstention.transfer.v2.4
        prompt: "On a trivia test, model X answers everything and is right 70% of the time. Model Y abstains on 20% and is right on 85% of the rest. Scoring +1 right, −1 wrong, 0 abstain, which scores higher per question?"
        options:
          - id: a
            text: Y, with 0.56 against X's 0.40
          - id: b
            text: X, with 70% right against Y's 68%
          - id: c
            text: X, since abstaining counts as a wrong answer
        answer: a
        feedback: "X: 0.7 − 0.3 = 0.40. Y: 0.8 × (0.85 − 0.15) = 0.56. Plain accuracy favors X (70% vs 68%) because it ignores what the wrong answers cost."
  - id: factuality-and-abstention.calculate
    objective_ref: objective.factuality-and-abstention
    task: base
    response_type: numeric
    points: 1
    hint: Keep only the answers at or above the threshold. Risk is the number of wrong ones among them divided by how many you kept, as a percentage.
    remediation_scene: factuality-and-abstention.s3
    absolute_tolerance: 0.2
    variants:
      - id: factuality-and-abstention.calculate.1
        prompt: "Confidences, with ✗ for wrong answers: 0.95, 0.90, 0.85 ✗, 0.80, 0.70, 0.60 ✗, 0.50 ✗, 0.40. At a threshold of 0.75, what is the risk, in percent?"
        answer: 25
        feedback: Four answers are at or above 0.75 (0.95, 0.90, 0.85, 0.80), and one of them (0.85) is wrong, so risk = 1/4 = 25%. Coverage is 4/8 = 50%.
      - id: factuality-and-abstention.calculate.2
        prompt: "Confidences, with ✗ for wrong answers: 0.95, 0.90, 0.85 ✗, 0.80, 0.70, 0.60 ✗, 0.50 ✗, 0.40. At a threshold of 0.65, what is the risk, in percent?"
        answer: 20
        feedback: Five answers are at or above 0.65, and only 0.85 is wrong, so risk = 1/5 = 20%, at 62.5% coverage.
      - id: factuality-and-abstention.calculate.3
        prompt: "Confidences, with ✗ for wrong answers: 0.99, 0.97, 0.92 ✗, 0.90, 0.85, 0.83, 0.78 ✗, 0.70 ✗, 0.66, 0.50 ✗. At a threshold of 0.80, what is the risk, in percent?"
        answer: 16.7
        feedback: Six answers are at or above 0.80, and one (0.92) is wrong, so risk = 1/6 ≈ 16.7%.
      - id: factuality-and-abstention.calculate.4
        prompt: "Confidences, with ✗ for wrong answers: 0.99, 0.97, 0.92 ✗, 0.90, 0.85, 0.83, 0.78 ✗, 0.70 ✗, 0.66, 0.50 ✗. At a threshold of 0.60, what is the risk, in percent?"
        answer: 33.3
        feedback: Nine answers are at or above 0.60, and three of them (0.92, 0.78, 0.70) are wrong, so risk = 3/9 ≈ 33.3%.
      - id: factuality-and-abstention.calculate.5
        prompt: "In Kestrel's 20-answer calibration set, a threshold of 0.70 keeps 13 answers, and two of them (0.88 and 0.75) are wrong. What is the risk, in percent?"
        answer: 15.4
        feedback: Risk = 2/13 ≈ 15.4%, at 65% coverage. Tightening the threshold to 0.80 drops the risk to 10% but cuts coverage from 65% to 50%.
