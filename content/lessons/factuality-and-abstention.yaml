schema_version: 0.2-draft
lesson:
  id: factuality-and-abstention
  version: 0.1.0-draft
  title: Evaluate claims against evidence and recognize missing information
  state: draft
  summary: Factual reliability requires claim-level verification, calibrated uncertainty, and suitable abstention;
    plausible generation, citations, and model confidence are individually insufficient.
  slot: M28.5
  category: learning
  minutes: 12
  sources:
  - title: TruthfulQA
    url: https://arxiv.org/abs/2109.07958
  - title: Selective Classification for Deep Neural Networks
    url: https://arxiv.org/abs/1705.08500
objectives:
- id: objective.factuality-and-abstention
  version: 1-draft
  statement: Factual reliability requires claim-level verification, calibrated uncertainty, and suitable abstention;
    plausible generation, citations, and model confidence are individually insufficient.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - factuality-and-abstention.base
  - factuality-and-abstention.transfer
  prerequisites:
  - anyOf:
    - objective.citations-and-evidence-fidelity
  - anyOf:
    - objective.evaluation-metrics-and-uncertainty
scenes:
- id: factuality-and-abstention.s1
  title: Identify the claim being checked
  type: explanation
  depth: intuition
  objective_refs:
  - objective.factuality-and-abstention
  markdown: A response may mix supported facts, inference, and invented details. Decompose important assertions
    and define the reference evidence or verification procedure. The term hallucination is used broadly, so state
    whether the failure is factual error, source inconsistency, or unsupported information.
  text_mode: A response may mix supported facts, inference, and invented details. Decompose important assertions
    and define the reference evidence or verification procedure. The term hallucination is used broadly, so state
    whether the failure is factual error, source inconsistency, or unsupported information.
  bridges: []
- id: factuality-and-abstention.s2
  title: Separate uncertainty signals
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.factuality-and-abstention
  markdown: Token probability reflects the model’s distribution over text under a context. It is not automatically
    a calibrated probability that a whole claim is true. Verbal confidence is another generated behavior. Both need
    validation before being used to make consequential decisions.
  text_mode: Token probability reflects the model’s distribution over text under a context. It is not automatically
    a calibrated probability that a whole claim is true. Verbal confidence is another generated behavior. Both need
    validation before being used to make consequential decisions.
  bridges: []
- id: factuality-and-abstention.s3
  title: Choose an abstention threshold
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.factuality-and-abstention
  markdown: A selective system can answer some requests and abstain on others. Raising the threshold may improve
    correctness among answered cases while reducing coverage. Evaluate the accuracy-coverage tradeoff and whether
    the system appropriately recognizes missing evidence instead of merely refusing difficult wording.
  text_mode: A selective system can answer some requests and abstain on others. Raising the threshold may improve
    correctness among answered cases while reducing coverage. Evaluate the accuracy-coverage tradeoff and whether
    the system appropriately recognizes missing evidence instead of merely refusing difficult wording.
  bridges: []
- id: factuality-and-abstention.s4
  title: Check grounded generation directly
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.factuality-and-abstention
  markdown: Give sufficient, insufficient, and conflicting evidence; test whether answers follow it. Preserve source
    scope and dates. A response can contain real citations yet overstate them, and a factually correct answer can
    still fail a task requiring support from the supplied document.
  text_mode: Give sufficient, insufficient, and conflicting evidence; test whether answers follow it. Preserve source
    scope and dates. A response can contain real citations yet overstate them, and a factually correct answer can
    still fail a task requiring support from the supplied document.
  bridges: []
- id: factuality-and-abstention.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.factuality-and-abstention
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Factual reliability requires claim-level verification, calibrated uncertainty, and suitable abstention;
    plausible generation, citations, and model confidence are individually insufficient.
- id: factuality-and-abstention.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.factuality-and-abstention
  markdown: Factual reliability requires claim-level verification, calibrated uncertainty, and suitable abstention;
    plausible generation, citations, and model confidence are individually insufficient.
  text_mode: Factual reliability requires claim-level verification, calibrated uncertainty, and suitable abstention;
    plausible generation, citations, and model confidence are individually insufficient.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - factuality-and-abstention.s1
    - factuality-and-abstention.s2
    - factuality-and-abstention.s3
    - factuality-and-abstention.s4
    - factuality-and-abstention.check
    gate_refs:
    - gate.core
  scene_aliases:
    factuality-and-abstention.recap: factuality-and-abstention.check
assessment_families:
- id: factuality-and-abstention.base
  objective_ref: objective.factuality-and-abstention
  task: base
  response_type: single_choice
  points: 1
  hint: 'Separate uncertainty signals: trace the inputs, operation, and result before choosing.'
  remediation_scene: factuality-and-abstention.s2
  variants:
  - id: factuality-and-abstention.base.1
    prompt: Does high next-token probability guarantee a factual statement is true?
    options:
    - id: c
      text: Only for complete sentences
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Text likelihood and factual truth are different properties.
  - id: factuality-and-abstention.base.2
    prompt: What can a higher abstention threshold trade?
    options:
    - id: a
      text: Higher answered-case reliability for lower coverage
    - id: b
      text: Guaranteed full coverage and perfect correctness
    - id: c
      text: Only output typography
    answer: a
    feedback: Selective prediction changes which cases are answered.
- id: factuality-and-abstention.transfer
  objective_ref: objective.factuality-and-abstention
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Check grounded generation directly: trace the inputs, operation, and result before choosing.'
  remediation_scene: factuality-and-abstention.s4
  variants:
  - id: factuality-and-abstention.transfer.1
    prompt: Why define the meaning of hallucination in an evaluation?
    options:
    - id: a
      text: The term can refer to different error types
    - id: b
      text: It has one universal precise metric
    - id: c
      text: Only to avoid measuring errors
    answer: a
    feedback: Clear categories make results interpretable.
  - id: factuality-and-abstention.transfer.2
    prompt: A correct fact lacks required support from the supplied document. Can the task still fail?
    options:
    - id: b
      text: 'No'
    - id: c
      text: Only if the answer is short
    - id: a
      text: 'Yes'
    answer: a
    feedback: Grounding requirements add constraints beyond truth alone.
