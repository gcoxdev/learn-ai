    at 1 + 9 × 0.1 = 1.9 seconds. There are nine gaps after the first token.


    Report the measurement boundary and the distribution of delays. Tail percentiles help reveal long waits
    that an average can hide.'
  bridges: []
- id: serving-metrics-and-cost.s2
  title: Count useful throughput
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.serving-metrics-and-cost
  markdown: Tokens per second depends on input/output lengths, concurrency, batching, and which tokens are
    counted. A high-throughput configuration can increase waiting time. Report requests completed within a
    quality and latency target as well as raw token throughput when that matches the product goal.
  text_mode: Tokens per second depends on input/output lengths, concurrency, batching, and which tokens are
    counted. A high-throughput configuration can increase waiting time. Report requests completed within a
    quality and latency target as well as raw token throughput when that matches the product goal.
  bridges: []
- id: serving-metrics-and-cost.s3
  title: Build a scoped cost model
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.serving-metrics-and-cost
  markdown: 'A useful cost model includes the resources needed to complete the task: hardware or service charges,
    utilization, prompt and output work, retries, tools, storage, and relevant operating overhead. Doubling
    idle hardware can double its cost without doubling useful work. Energy estimates also need power and duration
    assumptions.


    If a toy batch costs 10 units and completes eight useful tasks, the cost is 10/8 = 1.25 units per useful
    completion. Include failed attempts in the cost. Counting them as successful tasks would make the service
    appear cheaper than it is.'
  text_mode: 'A useful cost model includes the resources needed to complete the task: hardware or service charges,
    utilization, prompt and output work, retries, tools, storage, and relevant operating overhead. Doubling
    idle hardware can double its cost without doubling useful work. Energy estimates also need power and duration
    assumptions.


    If a toy batch costs 10 units and completes eight useful tasks, the cost is 10/8 = 1.25 units per useful
    completion. Include failed attempts in the cost. Counting them as successful tasks would make the service
    appear cheaper than it is.'
  bridges: []
- id: serving-metrics-and-cost.s4
  title: Select and monitor an operating point
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.serving-metrics-and-cost
  markdown: Choose a deployment that meets required quality, latency, memory, and reliability constraints.
    Monitor failures, queue growth, cache pressure, and changing traffic. Re-evaluate after model, runtime,
    or workload changes instead of treating a one-time benchmark as a permanent property.
  text_mode: Choose a deployment that meets required quality, latency, memory, and reliability constraints.
    Monitor failures, queue growth, cache pressure, and changing traffic. Re-evaluate after model, runtime,
    or workload changes instead of treating a one-time benchmark as a permanent property.
  bridges: []
- id: serving-metrics-and-cost.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.serving-metrics-and-cost
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Compare deployments on useful completed work at an acceptable quality level. Report waiting-time
    distributions, throughput, memory, reliability, and total cost under the same workload.
