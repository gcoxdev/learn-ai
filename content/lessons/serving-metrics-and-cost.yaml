schema_version: 0.2-draft
lesson:
  id: serving-metrics-and-cost
  version: 0.4.0-draft
  title: Choose a deployment using quality and workload evidence
  state: draft
  summary: The average wait looks great, yet one customer in a hundred waits over three seconds. Measure what users actually feel, and work out what a million tokens really costs you.
  slot: M27.8
  category: learning
  sources:
    - title: "DistServe: Disaggregating Prefill and Decoding for Goodput-optimized Large Language Model Serving (Zhong et al., 2024)"
      url: https://arxiv.org/abs/2401.09670
    - title: MLPerf Inference Benchmark (Reddi et al., 2019)
      url: https://arxiv.org/abs/1911.02549
    - title: Efficient Memory Management for Large Language Model Serving with PagedAttention (Kwon et al., 2023)
      url: https://arxiv.org/abs/2309.06180
    - title: "The Tail at Scale (Dean & Barroso, Communications of the ACM, 2013)"
      url: https://doi.org/10.1145/2408776.2408794
objectives:
  - id: objective.serving-metrics-and-cost
    version: 2-draft
    statement: Measure serving by latency percentiles, throughput, memory, reliability, and cost under a stated workload, and compare systems at the quality level users actually need.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - serving-metrics-and-cost.base.v2
      - serving-metrics-and-cost.transfer.v2
      - serving-metrics-and-cost.cost
    prerequisites:
      - anyOf:
          - objective.distributed-and-edge-serving
      - anyOf:
          - objective.batching-streaming-and-cache-management
      - anyOf:
          - objective.speculative-decoding
scenes:
  - id: serving-metrics-and-cost.s1
    title: Three numbers on the customer's stopwatch
    type: explanation
    depth: intuition
    objective_refs:
      - objective.serving-metrics-and-cost
    markdown: |-
      Fernly's dashboard says Fern's average wait before the first word is 0.38 seconds. Yet the support inbox has complaints: "It froze for ages before answering." Both are true. To see how, first name what a customer's stopwatch measures for one reply:

      | Metric | What it measures | One Fern reply |
      | --- | --- | --- |
      | **Time to first token (TTFT)** | From sending the message to the first token appearing | 0.25 s |
      | **Time per output token (TPOT)** | The average gap between later tokens | 15.9 ms |
      | **End-to-end latency** | From sending to the last token | 5.0 s for 300 tokens |

      TPOT is the time after the first token divided by the number of gaps: $(5.0 - 0.25) / 299 \approx 15.9$ ms. Each individual gap is an **inter-token latency (ITL)**. Their average is the TPOT, but a single long gap, such as a freeze while someone else's long prompt is prefilled, shows up only in the ITLs.

      :::predict A reply's first token arrives at 1.0 s and nine more follow at even 0.1 s gaps. When does the tenth token arrive, and what's the TPOT?
      Ten tokens have nine gaps, so the tenth arrives at 1.0 + 9 × 0.1 = 1.9 s, and TPOT = 0.9 s ÷ 9 = 0.1 s. Dividing by ten tokens instead of nine gaps is the classic off-by-one.
      :::
    bridges: []
  - id: serving-metrics-and-cost.tail
    title: The average hides the slowest customers
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.serving-metrics-and-cost
    markdown: |-
      Latencies aren't one number; they're a distribution. The **p95** is the value that 95% of requests beat, and p50 is the median. Here are 1,000 simulated Fern TTFTs, where 3% of requests happen to queue behind a long prefill:

      ```python run
      import numpy as np

      rng = np.random.default_rng(7)
      ttft = rng.lognormal(np.log(0.3), 0.3, size=1000)   # most waits are around 0.3 s
      unlucky = rng.random(1000) < 0.03                   # 3% queue behind a long prefill
      ttft[unlucky] += rng.uniform(2, 4, unlucky.sum())

      print(f"mean {ttft.mean():.2f} s")
      for p in [50, 95, 99]:
          print(f"p{p}  {np.percentile(ttft, p):.2f} s")
      print(f"requests over 1 s: {(ttft > 1).sum()} of {len(ttft)}")
      ```

      The mean is 0.38 s and the p95 is 0.53 s, both fine. The p99 is 3.36 s: one customer in a hundred waits more than three seconds. Those 26 customers wrote the complaints. Change `0.03` to `0.06` and see which numbers move.

      Tails matter more than they look. A customer who sends 20 messages has a 1 − 0.99²⁰ ≈ 18% chance of hitting at least one p99 wait, and Dean and Barroso's "The Tail at Scale" (2013) showed how rare slow events come to dominate once one user action depends on many requests. So Fernly writes its targets as percentiles, in a **service-level objective (SLO)**: TTFT under 1 s and TPOT under 25 ms, for 95% of requests.
    bridges: []
  - id: serving-metrics-and-cost.s2
    title: Throughput, goodput, and the batch-size dial
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.serving-metrics-and-cost
    markdown: |-
      The batching lesson found the central trade: a bigger batch makes more tokens in total, but each customer's tokens come more slowly. With Fern's 2,000-token conversations, each step reads the 16 GB of weights plus 0.262 GB of cache per request:

      | Batch | ms per step (TPOT) | Tokens/s per customer | Tokens/s total |
      | ---: | ---: | ---: | ---: |
      | 1 | 8.1 | 123 | 123 |
      | 8 | 9.0 | 111 | 884 |
      | 32 | 12.2 | 82 | 2,625 |
      | 64 | 16.4 | 61 | 3,906 |
      | 128 | 24.8 | 40 | 5,168 |

      This simple model counts only memory reads, and very large batches also approach the compute limit, but the shape is right. **Throughput**, total tokens or requests per second, keeps climbing. The TPOT target of 25 ms is met, barely, even at 128.

      Throughput counts requests that break the SLO too. **Goodput** counts only the requests that meet every target; the DistServe paper (Zhong et al., 2024) made it the number to maximize. Suppose setting A completes 10 requests per second with 97% inside the SLO, and setting B, with a bigger batch and more queueing, completes 14 per second with only 60% inside. B has more throughput, but A has more goodput: 9.7 against 8.4 requests per second.
    bridges: []
  - id: serving-metrics-and-cost.s3
    title: What a million tokens costs
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.serving-metrics-and-cost
    markdown: |-
      Everything so far turns into money with one division:

      $$\text{cost per million tokens} = \frac{\text{GPU price per hour}}{\text{tokens per hour}} \times 10^6$$

      Say Fernly rents its A100 for \$2.00 an hour (an assumed price; rates vary widely). At batch 1, it makes 123 tokens per second, 442,800 per hour, so a million tokens cost \$2.00 ÷ 442,800 × 10⁶ ≈ \$4.52. At batch 64, the same GPU makes 3,906 per second, and the price falls to about \$0.14.

      ```python run
      GPU_PER_HOUR = 2.00            # assumed rental price of one A100, in dollars
      WEIGHTS_GB, BW = 16, 2000      # Fern's 8B model; GB/s of memory bandwidth
      KV_GB = 0.262                  # one 2,000-token conversation's cache

      print("batch  ms/step  tokens/s each  tokens/s total  $ per million tokens")
      for batch in [1, 8, 32, 64, 128]:
          step = (WEIGHTS_GB + batch * KV_GB) / BW          # seconds per decode step
          total = batch / step                              # output tokens per second
          cost = GPU_PER_HOUR / (total * 3600) * 1e6
          print(f"{batch:5}  {step * 1e3:7.1f}  {1 / step:13.0f}  {total:14,.0f}  {cost:8.2f}")
      ```

      Try `GPU_PER_HOUR = 1.00`, or halve `WEIGHTS_GB` to see what int8 weights would save.

      :::mixup "Our benchmark gives \$0.14 per million tokens, so that's our cost."
      You pay for the GPU every hour, busy or not. If traffic keeps it at batch 64 only 40% of the time, the real cost is \$0.14 ÷ 0.4 = \$0.35. Retries, failed requests, prompt tokens, and a spare GPU for peaks all add more. Divide the whole bill by the tokens customers actually received.
      :::
    bridges: []
  - id: serving-metrics-and-cost.s4
    title: Pick the operating point, then watch it
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.serving-metrics-and-cost
    markdown: |-
      Fern's team now makes the decision this module has been building toward. Their SLO is p95 TTFT under 1 s and p95 TPOT under 25 ms. They load-test with a recording of a real Monday morning, not with identical synthetic prompts, and find:

      - A batch cap of 128 has the lowest cost per token, but p95 TPOT reaches 30 ms under real traffic, and p95 TTFT breaks 1 s when long prompts arrive together.
      - A cap of 64 meets both targets with a little room to spare, at about \$0.14 per million tokens while busy.

      They pick 64, and handle growth by adding replicas rather than squeezing more into each batch. Then they put five numbers on the dashboard and alert when any drifts: p95 TTFT, p95 TPOT, goodput, KV-cache usage and preemptions, and cost per million delivered tokens. Any change covered in this module, such as a new model, int4 weights, speculative decoding, or a different GPU, means rerunning the same load test before trusting the old numbers.
    bridges: []
  - id: serving-metrics-and-cost.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.serving-metrics-and-cost
    markdown: Costs per million tokens to compute, then a TPOT reading, a hidden tail, a goodput comparison, a voice assistant, and a batch-size decision test whether you can measure a deployment the way customers experience it.
    takeaway: |-
      Measure TTFT and TPOT as percentiles against an SLO, and maximize goodput, not raw throughput. Cost per million tokens is the GPU's hourly price divided by the tokens it actually delivers per hour.
  - id: serving-metrics-and-cost.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.serving-metrics-and-cost
    markdown: |-
      Compare deployments on useful completed work at an acceptable quality level. Report waiting-time distributions, throughput, memory, reliability, and total cost under the same workload.
