assessment_families:
- id: serving-metrics-and-cost.base
  objective_ref: objective.serving-metrics-and-cost
  task: base
  response_type: single_choice
  points: 1
  hint: 'Count useful throughput: trace the inputs, operation, and result before choosing.'
  remediation_scene: serving-metrics-and-cost.s2
  variants:
  - id: serving-metrics-and-cost.base.1
    prompt: What can a latency average hide?
    options:
    - id: a
      text: A slow tail of user requests
    - id: b
      text: Every model parameter
    - id: c
      text: Only the prompt language
    answer: a
    feedback: Distribution percentiles expose uneven experience.
  - id: serving-metrics-and-cost.base.2
    prompt: Does maximum tokens per second necessarily minimize waiting time?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if output is streamed
    - id: a
      text: 'No'
    answer: a
    feedback: Batching can trade throughput against latency.
- id: serving-metrics-and-cost.transfer
  objective_ref: objective.serving-metrics-and-cost
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Select and monitor an operating point: trace the inputs, operation, and result before choosing.'
  remediation_scene: serving-metrics-and-cost.s4
  variants:
  - id: serving-metrics-and-cost.transfer.1
    prompt: Why state whether reported tokens include prompts or outputs?
    options:
    - id: b
      text: All token counts are automatically equivalent
    - id: c
      text: Only prices depend on words
    - id: a
      text: Counting conventions change the metric
    answer: a
    feedback: Throughput needs a clear denominator and numerator.
  - id: serving-metrics-and-cost.transfer.2
    prompt: What warrants re-evaluating a serving decision?
    options:
    - id: c
      text: Nothing after one benchmark
    - id: a
      text: A material model, runtime, or workload change
    - id: b
      text: Only a new logo
    answer: a
    feedback: Performance is conditional on system and traffic conditions.
