assessment_families:
  - id: serving-metrics-and-cost.base
    objective_ref: objective.serving-metrics-and-cost
    task: base
    response_type: single_choice
    points: 1
    hint: 'Count useful throughput: trace the inputs, operation, and result before choosing.'
    remediation_scene: serving-metrics-and-cost.s2
    variants:
      - id: serving-metrics-and-cost.base.1
        retired: true
        prompt: What can a latency average hide?
        options:
          - id: a
            text: A slow tail of user requests
          - id: b
            text: Every model parameter
          - id: c
            text: Only the prompt language
        answer: a
        feedback: Distribution percentiles expose uneven experience.
      - id: serving-metrics-and-cost.base.2
        retired: true
        prompt: Does maximum tokens per second necessarily minimize waiting time?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if output is streamed
          - id: a
            text: 'No'
        answer: a
        feedback: Batching can trade throughput against latency.
  - id: serving-metrics-and-cost.transfer
    objective_ref: objective.serving-metrics-and-cost
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Select and monitor an operating point: trace the inputs, operation, and result before choosing.'
    remediation_scene: serving-metrics-and-cost.s4
    variants:
      - id: serving-metrics-and-cost.transfer.1
        retired: true
        prompt: Why state whether reported tokens include prompts or outputs?
        options:
          - id: b
            text: All token counts are automatically equivalent
          - id: c
            text: Only prices depend on words
          - id: a
            text: Counting conventions change the metric
        answer: a
        feedback: Throughput needs a clear denominator and numerator.
      - id: serving-metrics-and-cost.transfer.2
        retired: true
        prompt: What warrants re-evaluating a serving decision?
        options:
          - id: c
            text: Nothing after one benchmark
          - id: a
            text: A material model, runtime, or workload change
          - id: b
            text: Only a new logo
        answer: a
        feedback: Performance is conditional on system and traffic conditions.
  - id: serving-metrics-and-cost.base.v2
    objective_ref: objective.serving-metrics-and-cost
    task: base
    response_type: single_choice
    points: 1
    hint: TTFT is the wait for the first token, TPOT is the time after it divided by the number of gaps, and goodput counts only requests that meet every target.
    remediation_scene: serving-metrics-and-cost.s1
    variants:
      - id: serving-metrics-and-cost.base.v2.1
        prompt: A reply's first token arrives at 0.5 s, and its 201st and last token arrives at 4.5 s. What is its time per output token?
        options:
          - id: b
            text: 22.4 ms, from 4.5 s spread over 201 tokens
          - id: a
            text: 20 ms, from 4.0 s spread over 200 gaps
          - id: c
            text: 22.5 ms, from 4.5 s spread over 200 gaps
        answer: a
        feedback: TPOT leaves out the wait for the first token and divides by the gaps between tokens. (4.5 − 0.5) ÷ 200 = 0.02 s. Including the first-token wait mixes TTFT into TPOT.
      - id: serving-metrics-and-cost.base.v2.2
        prompt: A chat service's mean TTFT is 0.4 s, yet customers complain about long freezes before replies start. Which number should the team look at?
        options:
          - id: a
            text: The p95 and p99 TTFT, which show how slow the slowest requests are
          - id: b
            text: The median TTFT, which is less affected by a few unusual requests
          - id: c
            text: The mean time per output token, which shows how fast tokens stream
        answer: a
        feedback: A few multi-second waits barely move the mean, and the median ignores them on purpose. High percentiles expose the tail that the complaints come from. TPOT measures a different wait, after the reply has started.
      - id: serving-metrics-and-cost.base.v2.3
        prompt: A memory-bound server raises its batch size from 8 to 64. What happens?
        options:
          - id: c
            text: Total tokens per second stay flat, since the GPU was already busy
          - id: b
            text: Each customer's tokens arrive faster, since the GPU works harder
          - id: a
            text: Total tokens per second rise, while each customer's tokens slow down
        answer: a
        feedback: Each step still reads the weights once for the whole batch, so total output rises steeply, but every step takes longer because it also reads more KV caches. In Fern's numbers, total rises from 884 to 3,906 tokens per second while each customer drops from 111 to 61.
      - id: serving-metrics-and-cost.base.v2.4
        prompt: A team's SLO sets targets for p95 TTFT and p95 TPOT. Which requests count toward goodput?
        options:
          - id: b
            text: Every request the server finished, however long it took
          - id: a
            text: The requests that finished within each of the SLO's targets
          - id: c
            text: The tokens per second measured at the largest batch that fits
        answer: a
        feedback: Goodput counts useful work, meaning requests that met the targets. Counting everything finished is plain throughput, and a peak-batch token rate is throughput again, measured in tokens.
  - id: serving-metrics-and-cost.transfer.v2
    objective_ref: objective.serving-metrics-and-cost
    task: transfer
    response_type: single_choice
    points: 1
    hint: Start from what users feel and what the SLO says, then compare options by goodput and by the cost of tokens actually delivered.
    remediation_scene: serving-metrics-and-cost.s4
    variants:
      - id: serving-metrics-and-cost.transfer.v2.1
        prompt: Setting A completes 10 requests per second, with 97% inside the SLO. Setting B completes 14 per second, with 60% inside. Which has more goodput?
        options:
          - id: a
            text: A, with 9.7 good requests per second against B's 8.4
          - id: b
            text: B, because it completes more requests every second
          - id: c
            text: Neither, since both settings keep the GPU fully busy
        answer: a
        feedback: Goodput is throughput times the share that meets the SLO, so 10 × 0.97 = 9.7 against 14 × 0.6 = 8.4. B's extra requests are mostly ones that missed their targets.
      - id: serving-metrics-and-cost.transfer.v2.2
        prompt: A startup estimated its cost by dividing its GPU's hourly price by peak benchmark throughput. Its real cost per delivered token turns out 2.5 times higher. What did the estimate most likely leave out?
        options:
          - id: c
            text: Bigger batches make each rented GPU hour cost more
          - id: a
            text: The GPU is paid for every hour, even when traffic is light
          - id: b
            text: Tokens were counted after streaming instead of before
        answer: a
        feedback: A benchmark runs the GPU flat out, but real traffic has quiet hours, and you pay for them anyway. At 40% average utilization, the cost is 2.5 times the peak figure. The hourly price doesn't depend on batch size, and streaming doesn't change the token count.
      - id: serving-metrics-and-cost.transfer.v2.3
        prompt: A voice assistant speaks its replies aloud. Users mind the silence before speech starts but can't tell how fast later words are generated, since speech is slower than generation anyway. Which metric should its SLO emphasize?
        options:
          - id: b
            text: Total tokens per second across all users
          - id: a
            text: TTFT at a high percentile, such as p95
          - id: c
            text: Mean time per output token for each reply
        answer: a
        feedback: The silence users notice is the time to first token, and the slow tail of it is what they complain about. Once speech starts, generation stays ahead of the voice, so TPOT and total throughput matter far less here.
      - id: serving-metrics-and-cost.transfer.v2.4
        prompt: 'A coding assistant''s SLO is p95 TPOT at most 25 ms. Load tests with real traffic give p95 TPOT of 18 ms at batch cap 64 and 30 ms at batch cap 128, where cost per token is lowest. What should the team choose?'
        options:
          - id: a
            text: Cap 64, then add replicas when traffic grows
          - id: b
            text: Cap 128, since it has the lowest cost per token
          - id: c
            text: Cap 1, since it gives each user the fastest tokens
        answer: a
        feedback: The largest batch that still meets the SLO gives the most goodput per GPU; beyond it, requests fail the target. Batch 1 meets the SLO too, but at many times the cost per token.
  - id: serving-metrics-and-cost.cost
    objective_ref: objective.serving-metrics-and-cost
    task: base
    response_type: numeric
    points: 1
    hint: Tokens per hour = tokens per second × 3,600. Cost per million tokens = price per hour ÷ tokens per hour × 1,000,000. Use the average rate the GPU actually delivers.
    remediation_scene: serving-metrics-and-cost.s3
    absolute_tolerance: 0.01
    variants:
      - id: serving-metrics-and-cost.cost.1
        prompt: A GPU rents for $2.00 an hour and serves one user at 125 tokens per second. What does a million output tokens cost, in dollars?
        answer: 4.4444
        feedback: 125 × 3,600 = 450,000 tokens per hour, and $2.00 ÷ 450,000 × 1,000,000 ≈ $4.44.
      - id: serving-metrics-and-cost.cost.2
        prompt: The same $2.00-an-hour GPU runs a big batch that produces 4,000 tokens per second in total. What does a million tokens cost, in dollars?
        answer: 0.1389
        feedback: 4,000 × 3,600 = 14.4 million tokens per hour, and $2.00 ÷ 14.4 ≈ $0.14 per million.
      - id: serving-metrics-and-cost.cost.3
        prompt: A GPU rents for $3.60 an hour and delivers 1,000 tokens per second. What does a million tokens cost, in dollars?
        answer: 1
        feedback: 1,000 × 3,600 = 3.6 million tokens per hour, and $3.60 ÷ 3.6 = $1.00 per million.
      - id: serving-metrics-and-cost.cost.4
        prompt: A $2.00-an-hour GPU produces 2,000 tokens per second while busy, but traffic keeps it busy only half of each hour. What does a million delivered tokens cost, in dollars?
        answer: 0.5556
        feedback: Averaged over the hour it delivers 1,000 tokens per second, or 3.6 million per hour, so $2.00 ÷ 3.6 ≈ $0.56 per million. The busy-time figure, $0.28, leaves out the idle half hour you still pay for.
      - id: serving-metrics-and-cost.cost.5
        prompt: A smaller GPU rents for $1.20 an hour and delivers 500 tokens per second. What does a million tokens cost, in dollars?
        answer: 0.6667
        feedback: 500 × 3,600 = 1.8 million tokens per hour, and $1.20 ÷ 1.8 ≈ $0.67 per million.
