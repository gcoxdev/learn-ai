schema_version: 0.2-draft
lesson:
  id: serving-metrics-and-cost
  version: 0.1.0-draft
  title: Choose a deployment using quality and workload evidence
  state: draft
  summary: Serving evaluation measures latency distributions, throughput, memory, reliability, and cost under a
    specified workload; compare systems at useful quality thresholds and include all relevant resource boundaries.
  slot: M27.8
  category: learning
  minutes: 12
  sources:
  - title: MLPerf Inference Benchmark
    url: https://arxiv.org/abs/1911.02549
  - title: PagedAttention and vLLM
    url: https://arxiv.org/abs/2309.06180
objectives:
- id: objective.serving-metrics-and-cost
  version: 1-draft
  statement: Serving evaluation measures latency distributions, throughput, memory, reliability, and cost under
    a specified workload; compare systems at useful quality thresholds and include all relevant resource boundaries.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - serving-metrics-and-cost.base
  - serving-metrics-and-cost.transfer
  prerequisites:
  - anyOf:
    - objective.distributed-and-edge-serving
  - anyOf:
    - objective.batching-streaming-and-cache-management
  - anyOf:
    - objective.speculative-decoding
scenes:
- id: serving-metrics-and-cost.s1
  title: Define user-visible latency
  type: explanation
  depth: intuition
  objective_refs:
  - objective.serving-metrics-and-cost
  markdown: Time to first token includes request preparation, queuing, and prompt processing as measured by the
    chosen boundary. Inter-token latency describes generation gaps; total completion time includes the full output.
    Tail percentiles reveal delays that an average can hide.
  text_mode: Time to first token includes request preparation, queuing, and prompt processing as measured by the
    chosen boundary. Inter-token latency describes generation gaps; total completion time includes the full output.
    Tail percentiles reveal delays that an average can hide.
  bridges: []
- id: serving-metrics-and-cost.s2
  title: Count useful throughput
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.serving-metrics-and-cost
  markdown: Tokens per second depends on input/output lengths, concurrency, batching, and which tokens are counted.
    A high-throughput configuration can increase waiting time. Report requests completed within a quality and latency
    target as well as raw token throughput when that matches the product goal.
  text_mode: Tokens per second depends on input/output lengths, concurrency, batching, and which tokens are counted.
    A high-throughput configuration can increase waiting time. Report requests completed within a quality and latency
    target as well as raw token throughput when that matches the product goal.
  bridges: []
- id: serving-metrics-and-cost.s3
  title: Build a scoped cost model
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.serving-metrics-and-cost
  markdown: Include hardware or service charges, utilization, prompt and output work, retries, tools, storage, and
    operational overhead as relevant. In a toy service, doubling idle hardware can double capacity cost without
    doubling useful completed work. Energy estimates require power and duration assumptions.
  text_mode: Include hardware or service charges, utilization, prompt and output work, retries, tools, storage,
    and operational overhead as relevant. In a toy service, doubling idle hardware can double capacity cost without
    doubling useful completed work. Energy estimates require power and duration assumptions.
  bridges: []
- id: serving-metrics-and-cost.s4
  title: Select and monitor an operating point
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.serving-metrics-and-cost
  markdown: Choose a deployment that meets required quality, latency, memory, and reliability constraints. Monitor
    failures, queue growth, cache pressure, and changing traffic. Re-evaluate after model, runtime, or workload
    changes instead of treating a one-time benchmark as a permanent property.
  text_mode: Choose a deployment that meets required quality, latency, memory, and reliability constraints. Monitor
    failures, queue growth, cache pressure, and changing traffic. Re-evaluate after model, runtime, or workload
    changes instead of treating a one-time benchmark as a permanent property.
  bridges: []
- id: serving-metrics-and-cost.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.serving-metrics-and-cost
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Serving evaluation measures latency distributions, throughput, memory, reliability, and cost under a
    specified workload; compare systems at useful quality thresholds and include all relevant resource boundaries.
- id: serving-metrics-and-cost.recap
  title: One idea to take with you
  type: recap
