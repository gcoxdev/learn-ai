schema_version: 0.2-draft
lesson:
  id: serving-metrics-and-cost
  version: 0.3.0-draft
  title: Choose a deployment using quality and workload evidence
  state: draft
  summary: Measure the speed, cost, and reliability that users actually experience.
  slot: M27.8
  category: learning
  sources:
  - title: MLPerf Inference Benchmark
    url: https://arxiv.org/abs/1911.02549
  - title: PagedAttention and vLLM
    url: https://arxiv.org/abs/2309.06180
objectives:
- id: objective.serving-metrics-and-cost
  version: 1-draft
  statement: Serving evaluation measures latency distributions, throughput, memory, reliability, and cost under
    a specified workload; compare systems at useful quality thresholds and include all relevant resource boundaries.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - serving-metrics-and-cost.base
  - serving-metrics-and-cost.transfer
  prerequisites:
  - anyOf:
    - objective.distributed-and-edge-serving
  - anyOf:
    - objective.batching-streaming-and-cache-management
  - anyOf:
    - objective.speculative-decoding
scenes:
- id: serving-metrics-and-cost.s1
  title: Define user-visible latency
  type: explanation
  depth: intuition
  objective_refs:
  - objective.serving-metrics-and-cost
  markdown: '**Time to first token** measures the wait before output starts. Depending on where measurement
    begins, it includes request preparation, queuing, and prompt processing. **Inter-token latency** measures
    the gaps between later output tokens; **total completion time** covers the full answer.


    If the first token arrives after one second and nine more arrive at 0.1-second intervals, the tenth arrives
    at 1 + 9 × 0.1 = 1.9 seconds. There are nine gaps after the first token.


    Report the measurement boundary and the distribution of delays. Tail percentiles help reveal long waits
    that an average can hide.'
  text_mode: '**Time to first token** measures the wait before output starts. Depending on where measurement
    begins, it includes request preparation, queuing, and prompt processing. **Inter-token latency** measures
    the gaps between later output tokens; **total completion time** covers the full answer.


