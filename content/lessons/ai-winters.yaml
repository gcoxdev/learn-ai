assessment_families:
  - id: ai-winters.base
    objective_ref: objective.ai-winters
    task: base
    response_type: single_choice
    points: 1
    hint: 'See the XOR limitation: trace the inputs, operation, and result before choosing.'
    remediation_scene: ai-winters.s2
    variants:
      - id: ai-winters.base.1
        prompt: What boundary does a basic two-input linear perceptron use?
        options:
          - id: c
            text: A language grammar
          - id: a
            text: A straight line
          - id: b
            text: Every possible nonlinear curve
        answer: a
        feedback: A weighted sum plus threshold defines a linear decision boundary.
        retired: true
      - id: ai-winters.base.2
        prompt: Why is XOR a counterexample for a single linear separator on its original inputs?
        options:
          - id: a
            text: Opposite corners receive matching labels that one line cannot separate
          - id: b
            text: It contains no numbers
          - id: c
            text: It needs infinitely many examples to define
        answer: a
        feedback: The geometry is not linearly separable.
        retired: true
  - id: ai-winters.transfer
    objective_ref: objective.ai-winters
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Keep claims proportional to the result: trace the inputs, operation, and result before choosing.'
    remediation_scene: ai-winters.s4
    variants:
      - id: ai-winters.transfer.1
        prompt: Does a limitation of one-layer perceptrons prove every neural model inadequate?
        options:
          - id: a
            text: No; the theorem’s model assumptions matter
          - id: b
            text: Yes; all networks have identical expressivity
          - id: c
            text: Yes; more layers never change a function class
        answer: a
        feedback: Changing representation and nonlinear architecture changes what can be represented.
        retired: true
      - id: ai-winters.transfer.2
        prompt: How should an AI winter be explained?
        options:
          - id: b
            text: By one universal cause with no regional variation
          - id: c
            text: As proof that all AI research stopped
          - id: a
            text: Through technical, economic, and institutional factors together
        answer: a
        feedback: Funding cycles are historical processes with multiple contributing conditions.
        retired: true
  - id: ai-winters.base.v2
    objective_ref: objective.ai-winters
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: ai-winters.s3
    variants:
      - prompt: A single linear threshold classifier cannot separate XOR on its original two inputs. What is the scope of that result?
        answer: a
        options:
          - id: c
            text: Every computer procedure for the XOR task
          - id: a
            text: That model class on that representation
          - id: b
            text: Every network using any additional transformations
        feedback: The assumptions specify the limitation; changing the class or representation changes the question.
        id: ai-winters.base.v2.1
        retired: true
      - prompt: A model cannot represent a required pattern even with ideal fitted weights. Which limitation is being identified?
        answer: a
        options:
          - id: a
            text: The expressive limits of its chosen model class
          - id: b
            text: The absence of a larger training-data file
          - id: c
            text: The runtime of a particular implementation alone
        feedback: Some failures concern which functions the architecture can represent.
        id: ai-winters.base.v2.2
        retired: true
      - prompt: A poor translation result is measured on a defined test collection. What does it directly establish?
        answer: a
        options:
          - id: b
            text: A permanent limit on every possible translation method
          - id: c
            text: The size of the entire field’s future research budget
          - id: a
            text: Performance of the tested system under those conditions
        feedback: Measured results must keep their system and evaluation conditions attached.
        id: ai-winters.base.v2.3
        retired: true
      - prompt: A useful prototype becomes too expensive to maintain after deployment. Which finding is supported?
        answer: a
        options:
          - id: c
            text: Its model class cannot express the original examples
          - id: a
            text: Its operational cost can undermine its practical value
          - id: b
            text: Its successful prototype results must have been impossible
        feedback: Operational cost and representational capacity are different questions.
        id: ai-winters.base.v2.4
        retired: true
  - id: ai-winters.transfer.v2
    objective_ref: objective.ai-winters
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: ai-winters.s3
    variants:
      - prompt: A team adds nonlinear intermediate features after finding a straight-line limitation. What should happen next?
        answer: a
        options:
          - id: c
            text: Use the architecture change as proof of production reliability
          - id: a
            text: Test whether the revised representation solves the required problem
          - id: b
            text: Apply the old limitation unchanged without inspecting its assumptions
        feedback: A changed design requires new evidence, while a theorem’s original assumptions remain specific.
        id: ai-winters.transfer.v2.1
        retired: true
      - prompt: A sponsor reduces funding after disappointing demonstrations. Which explanation needs more evidence?
        answer: a
        options:
          - id: a
            text: That one technical paper caused the entire funding change
          - id: b
            text: That the sponsor changed its allocation
          - id: c
            text: That the demonstrations did not meet that sponsor’s expectations
        feedback: A broad causal claim needs evidence separating multiple possible influences.
        id: ai-winters.transfer.v2.2
        retired: true
      - prompt: A historical application review recommends changing research priorities. How should it be used today?
        answer: a
        options:
          - id: b
            text: Treat its recommendation as a proof about all future architectures
          - id: c
            text: Read its publication year as a forecast of the next setback
          - id: a
            text: Read its task, comparisons, and historical constraints
        feedback: Context is part of what a report can support.
        id: ai-winters.transfer.v2.3
        retired: true
      - prompt: A technique later becomes useful after data and hardware change. What follows?
        answer: a
        options:
          - id: c
            text: Its later success proves the same benefit in every application
          - id: a
            text: Its earlier practical limits need not have been permanent
          - id: b
            text: Its earlier disappointing measurements must be discarded
        feedback: Conditions can change usefulness without making earlier observations false.
        id: ai-winters.transfer.v2.4
        retired: true
  - id: ai-winters.base.v3
    objective_ref: objective.ai-winters
    task: base
    response_type: single_choice
    points: 1
    hint: Picture XOR's four corners on a square. A single perceptron can draw only one straight line through them; a hidden layer lets the network combine two simpler rules.
    remediation_scene: ai-winters.s3
    variants:
      - id: ai-winters.base.v3.1
        prompt: A single perceptron is trained on XOR for thousands of epochs and still gets some examples wrong. Why?
        options:
          - id: a
            text: Its learning rule stops updating once it makes a mistake
          - id: b
            text: No straight line separates XOR's 1s from its 0s
          - id: c
            text: XOR needs more than four training examples to define
        answer: b
        feedback: A perceptron's boundary is a straight line, and XOR's 1s sit at opposite corners of the square. The rule keeps updating after every mistake, which is exactly why the weights cycle forever.
      - id: ai-winters.base.v3.2
        prompt: A perceptron fires for (1,0) and (0,1), so w1 + b > 0 and w2 + b > 0. It stays silent for (0,0), so b ≤ 0. What does adding the first two inequalities tell you about (1,1)?
        options:
          - id: a
            text: w1 + w2 + b > 0, so it must also fire for (1,1)
          - id: b
            text: w1 + w2 + b < 0, so it must stay silent for (1,1)
          - id: c
            text: Nothing yet, because the bias can be tuned separately
        answer: a
        feedback: Adding gives w1 + w2 + 2b > 0, so w1 + w2 + b > −b, which is at least 0. The unit fires for (1,1), which is why no single perceptron computes XOR. The bias is already pinned down by b ≤ 0.
      - id: ai-winters.base.v3.3
        prompt: What did Minsky and Papert's *Perceptrons* (1969) actually prove?
        options:
          - id: a
            text: That no neural network can compute XOR
          - id: b
            text: That multi-layer networks can never be trained
          - id: c
            text: Limits on what single-layer perceptrons compute
        answer: c
        feedback: The proofs concern single-layer perceptrons. A network with a hidden layer computes XOR easily, and training such networks became practical with backpropagation in the 1980s.
      - id: ai-winters.base.v3.4
        prompt: A small network has two hidden units, h1 = OR(x1, x2) and h2 = AND(x1, x2). Its output is 1 when h1 is on and h2 is off. Which rule does it compute?
        options:
          - id: a
            text: OR, since h1 fires whenever either input is on
          - id: b
            text: XOR, one input on but not both
          - id: c
            text: AND, since h2 decides the final answer
        answer: b
        feedback: For (1,0) or (0,1), OR is on and AND is off, so it outputs 1; for (1,1) AND is on, so it outputs 0. That's XOR, built from two simple rules in a hidden layer.
  - id: ai-winters.transfer.v3
    objective_ref: objective.ai-winters
    task: transfer
    response_type: single_choice
    points: 1
    hint: Sort the setback before judging it. Is it a limit on what one model can represent, a cost problem, a failure to scale beyond toy worlds, or a change in who is paying?
    remediation_scene: ai-winters.s6
    variants:
      - id: ai-winters.transfer.v3.1
        prompt: Why is *Perceptrons* often blamed for the neural-network winter, even though its proofs covered single-layer networks?
        options:
          - id: a
            text: Readers took a limit of one design as a verdict on the approach
          - id: b
            text: It proved multi-layer networks were no better than single ones
          - id: c
            text: It showed perceptron hardware was too costly to manufacture
        answer: a
        feedback: The book's results were precise and narrow, but they were widely read as saying neural networks were a dead end. It didn't prove anything about multi-layer networks, and its argument was mathematical, not about hardware cost.
      - id: ai-winters.transfer.v3.2
        prompt: The 1973 Lighthill report argued that AI methods which worked in small, tidy worlds would fail on real problems. Which idea was at the heart of that argument?
        options:
          - id: a
            text: The XOR limit of single-layer perceptrons
          - id: b
            text: The combinatorial explosion of possibilities
          - id: c
            text: The ELIZA effect of reading meaning into replies
        answer: b
        feedback: Lighthill's central worry was that the number of possibilities grows explosively as problems get bigger, just like Shakey's box states. XOR is a representation limit of one model, a different kind of setback.
      - id: ai-winters.transfer.v3.3
        prompt: A customer-service AI impressed investors in demos. After launch, fixing its errors needs so many staff that it costs more than the old call center. What kind of setback is this?
        options:
          - id: a
            text: A limit on what the model can represent, like XOR
          - id: b
            text: A change in funder priorities unrelated to results
          - id: c
            text: A cost problem, where upkeep outweighs the benefit
        answer: c
        feedback: The system works, but running it costs more than it saves, much like ALPAC's verdict on 1960s translation. Nothing here shows the model can't represent the task, so a cheaper process or narrower job might rescue it.
      - id: ai-winters.transfer.v3.4
        prompt: In 1966 the ALPAC report judged machine translation too slow, inaccurate, and costly. What was the scope of that judgment?
        options:
          - id: a
            text: The translation systems and costs of the 1960s
          - id: b
            text: Any future method of translating by machine
          - id: c
            text: AI research as a whole, neural networks included
        answer: a
        feedback: ALPAC assessed the systems and economics of its day. Machine translation later improved enormously with statistical and neural methods, so the report was a verdict on a moment, not a proof about the future.
  - id: ai-winters.calc.v3
    objective_ref: objective.ai-winters
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Compute w1·x1 + w2·x2 + b, answer 1 only if that total is above 0, then add the error (target − answer) to the bias.
    remediation_scene: ai-winters.s2
    variants:
      - id: ai-winters.calc.v3.1
        prompt: A perceptron has w1 = 1, w2 = 1, b = 0. It sees input (1, 1) with target 0. Record the total, its answer (0 or 1), and the bias after one learning step.
        feedback: The total is 1 + 1 + 0 = 2, which is above 0, so it answers 1. The error is 0 − 1 = −1, so the bias drops to −1.
        answers:
          total: 2
          output: 1
          new_bias: -1
        reason_answer: rule
        reason_options:
          - id: always
            text: The bias grows by 1 after every example, right or wrong.
          - id: rule
            text: The bias changes by the error, target minus answer.
          - id: target
            text: The new bias is set equal to the target value.
      - id: ai-winters.calc.v3.2
        prompt: A perceptron has w1 = 2, w2 = −1, b = −1. It sees input (1, 0) with target 1. Record the total, its answer (0 or 1), and the bias after one learning step.
        feedback: The total is 2 + 0 − 1 = 1, above 0, so it answers 1. That's correct, so the error is 0 and the bias stays −1.
        answers:
          total: 1
          output: 1
          new_bias: -1
        reason_answer: rule
        reason_options:
          - id: target
            text: The new bias is set equal to the target value.
          - id: always
            text: The bias grows by 1 after every example, right or wrong.
          - id: rule
            text: The bias changes by the error, target minus answer.
      - id: ai-winters.calc.v3.3
        prompt: A perceptron has w1 = −1, w2 = 0, b = 1. It sees input (1, 0) with target 1. Record the total, its answer (0 or 1), and the bias after one learning step.
        feedback: The total is −1 + 0 + 1 = 0, which is not above 0, so it answers 0. The error is 1 − 0 = +1, so the bias rises to 2.
        answers:
          total: 0
          output: 0
          new_bias: 2
        reason_answer: rule
        reason_options:
          - id: rule
            text: The bias changes by the error, target minus answer.
          - id: target
            text: The new bias is set equal to the target value.
          - id: always
            text: The bias grows by 1 after every example, right or wrong.
      - id: ai-winters.calc.v3.4
        prompt: A perceptron has w1 = 1, w2 = 3, b = −2. It sees input (0, 1) with target 0. Record the total, its answer (0 or 1), and the bias after one learning step.
        feedback: The total is 0 + 3 − 2 = 1, above 0, so it answers 1. The error is 0 − 1 = −1, so the bias drops to −3.
        answers:
          total: 1
          output: 1
          new_bias: -3
        reason_answer: rule
        reason_options:
          - id: always
            text: The bias grows by 1 after every example, right or wrong.
          - id: target
            text: The new bias is set equal to the target value.
          - id: rule
            text: The bias changes by the error, target minus answer.
    absolute_tolerance: 1e-6
    numeric_fields:
      - id: total
        label: Total w1·x1 + w2·x2 + b
      - id: output
        label: Answer (0 or 1)
      - id: new_bias
        label: Bias after the update
