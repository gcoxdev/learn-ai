assessment_families:
- id: ai-winters.base
  objective_ref: objective.ai-winters
  task: base
  response_type: single_choice
  points: 1
  hint: 'See the XOR limitation: trace the inputs, operation, and result before choosing.'
  remediation_scene: ai-winters.s2
  variants:
  - id: ai-winters.base.1
    prompt: What boundary does a basic two-input linear perceptron use?
    options:
    - id: c
      text: A language grammar
    - id: a
      text: A straight line
    - id: b
      text: Every possible nonlinear curve
    answer: a
    feedback: A weighted sum plus threshold defines a linear decision boundary.
    retired: true
  - id: ai-winters.base.2
    prompt: Why is XOR a counterexample for a single linear separator on its original inputs?
    options:
    - id: a
      text: Opposite corners receive matching labels that one line cannot separate
    - id: b
      text: It contains no numbers
    - id: c
      text: It needs infinitely many examples to define
    answer: a
    feedback: The geometry is not linearly separable.
    retired: true
- id: ai-winters.transfer
  objective_ref: objective.ai-winters
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Keep claims proportional to the result: trace the inputs, operation, and result before choosing.'
  remediation_scene: ai-winters.s4
  variants:
  - id: ai-winters.transfer.1
    prompt: Does a limitation of one-layer perceptrons prove every neural model inadequate?
    options:
    - id: a
      text: No; the theorem’s model assumptions matter
    - id: b
      text: Yes; all networks have identical expressivity
    - id: c
      text: Yes; more layers never change a function class
    answer: a
    feedback: Changing representation and nonlinear architecture changes what can be represented.
    retired: true
  - id: ai-winters.transfer.2
    prompt: How should an AI winter be explained?
    options:
    - id: b
      text: By one universal cause with no regional variation
    - id: c
      text: As proof that all AI research stopped
    - id: a
      text: Through technical, economic, and institutional factors together
    answer: a
    feedback: Funding cycles are historical processes with multiple contributing conditions.
    retired: true
- id: ai-winters.base.v2
  objective_ref: objective.ai-winters
  task: base
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: ai-winters.s3
  variants:
  - prompt: A single linear threshold classifier cannot separate XOR on its original two inputs. What is the scope
      of that result?
    answer: a
    options:
    - id: c
      text: Every computer procedure for the XOR task
    - id: a
      text: That model class on that representation
    - id: b
      text: Every network using any additional transformations
    feedback: The assumptions specify the limitation; changing the class or representation changes the question.
    id: ai-winters.base.v2.1
  - prompt: A model cannot represent a required pattern even with ideal fitted weights. Which limitation is being
      identified?
    answer: a
    options:
    - id: a
      text: The expressive limits of its chosen model class
    - id: b
      text: The absence of a larger training-data file
    - id: c
      text: The runtime of a particular implementation alone
    feedback: Some failures concern which functions the architecture can represent.
    id: ai-winters.base.v2.2
  - prompt: A poor translation result is measured on a defined test collection. What does it directly establish?
    answer: a
    options:
    - id: b
      text: A permanent limit on every possible translation method
    - id: c
      text: The size of the entire field’s future research budget
    - id: a
      text: Performance of the tested system under those conditions
    feedback: Measured results must keep their system and evaluation conditions attached.
    id: ai-winters.base.v2.3
  - prompt: A useful prototype becomes too expensive to maintain after deployment. Which finding is supported?
    answer: a
    options:
    - id: c
      text: Its model class cannot express the original examples
    - id: a
      text: Its operational cost can undermine its practical value
    - id: b
      text: Its successful prototype results must have been impossible
    feedback: Operational cost and representational capacity are different questions.
    id: ai-winters.base.v2.4
- id: ai-winters.transfer.v2
  objective_ref: objective.ai-winters
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: ai-winters.s3
  variants:
  - prompt: A team adds nonlinear intermediate features after finding a straight-line limitation. What should happen
      next?
    answer: a
    options:
    - id: c
      text: Use the architecture change as proof of production reliability
    - id: a
      text: Test whether the revised representation solves the required problem
    - id: b
      text: Apply the old limitation unchanged without inspecting its assumptions
    feedback: A changed design requires new evidence, while a theorem’s original assumptions remain specific.
    id: ai-winters.transfer.v2.1
  - prompt: A sponsor reduces funding after disappointing demonstrations. Which explanation needs more evidence?
    answer: a
    options:
    - id: a
      text: That one technical paper caused the entire funding change
    - id: b
      text: That the sponsor changed its allocation
    - id: c
      text: That the demonstrations did not meet that sponsor’s expectations
    feedback: A broad causal claim needs evidence separating multiple possible influences.
    id: ai-winters.transfer.v2.2
  - prompt: A historical application review recommends changing research priorities. How should it be used today?
    answer: a
    options:
    - id: b
      text: Treat its recommendation as a proof about all future architectures
    - id: c
      text: Read its publication year as a forecast of the next setback
    - id: a
      text: Read its task, comparisons, and historical constraints
    feedback: Context is part of what a report can support.
    id: ai-winters.transfer.v2.3
  - prompt: A technique later becomes useful after data and hardware change. What follows?
    answer: a
    options:
    - id: c
      text: Its later success proves the same benefit in every application
    - id: a
      text: Its earlier practical limits need not have been permanent
    - id: b
      text: Its earlier disappointing measurements must be discarded
    feedback: Conditions can change usefulness without making earlier observations false.
    id: ai-winters.transfer.v2.4
