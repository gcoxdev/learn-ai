lesson:
  id: ai-winters
  version: 0.4.0-draft
  title: Limits, expectations, and changing support
  state: draft
  summary: In 1958 a newspaper said a learning machine might one day be conscious. By 1973 Britain was cutting AI funding. Find out what the famous XOR puzzle really proved.
  slot: M01.4
  category: learning
  sources:
    - title: ALPAC — Language and Machines (1966)
      url: https://nap.nationalacademies.org/resource/alpac_lm/ARC000005.pdf
    - title: Buchanan — A (Very) Brief History of Artificial Intelligence
      url: https://ojs.aaai.org/aimagazine/index.php/aimagazine/article/view/1848/0
    - title: Minsky and Papert — Perceptrons, expanded edition
      url: https://mitpress.mit.edu/9780262631112/perceptrons/
    - title: Rosenblatt — The perceptron (1958)
      url: https://doi.org/10.1037/h0042519
  archetype: perspective
objectives:
  - id: objective.ai-winters
    version: 3-draft
    statement: Distinguish model limitations, evaluation failures, and changes in research support without attributing AI setbacks to one cause.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - ai-winters.base.v3
      - ai-winters.transfer.v3
      - ai-winters.calc.v3
    prerequisites:
      - anyOf:
          - objective.symbolic-era
scenes:
  - id: ai-winters.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.ai-winters
    title: A machine that would "be conscious of its existence"
    markdown: |-
      On July 8, 1958, *The New York Times* reported that the US Navy had revealed "the embryo of an electronic computer" that it expected would "be able to walk, talk, see, write, reproduce itself and be conscious of its existence." The machine was Frank Rosenblatt's perceptron, which could learn to tell simple patterns apart.

      When expectations run that far ahead of results, money and enthusiasm drain away. These cold periods are called **AI winters**: research continued, but funding and interest shrank. Historians usually count two:

      - **The first winter**, roughly the mid-1970s to about 1980, after critical reports, a famous proof, and funders who wanted results.
      - **The second winter**, the late 1980s to early 1990s, after expert systems proved costly to maintain and the Lisp machine market collapsed (next lesson).

      This lesson follows the first, starting from the tiny puzzle at its center: XOR.
    bridges: []
  - id: ai-winters.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.ai-winters
    title: The perceptron learns from its mistakes
    markdown: |-
      Rosenblatt, a psychologist at the Cornell Aeronautical Laboratory, built his machine with Navy funding. The hardware Mark I watched a 20 × 20 grid of light sensors, and motors turned knobs to set its weights.

      A **perceptron** is the McCulloch–Pitts unit you met two lessons back plus one big addition: it learns its weights. It computes $w_1 x_1 + w_2 x_2 + b$, where $b$ is a **bias** (a built-in offset), and outputs 1 if the total is above 0. After each example, if its answer was wrong, it nudges the weights.

      Train it on AND, starting from all zeros. Inputs (0,0), (0,1), and (1,0) give a total of 0, so it answers 0: correct, no change. For (1,1) it should say 1 but says 0. The error is 1 − 0 = +1, so each weight gains its input and the bias gains 1: $w_1 = 1$, $w_2 = 1$, $b = 1$.

      :::predict Next it sees (0,0) again, which should give 0. What does it answer, and what changes?
      The total is 0 + 0 + 1 = 1, so it answers 1: wrong. The error is 0 − 1 = −1. Both inputs are 0, so only the bias moves, back to 0.
      :::

      :::papers The perceptron learning rule
      $$w_i \leftarrow w_i + (y - \hat{y})\,x_i \qquad b \leftarrow b + (y - \hat{y})$$
      Here $y$ is the correct answer and $\hat{y}$ is the guess. At the (1,1) step, $y - \hat{y} = 1$ and $x_1 = x_2 = 1$, so both weights and the bias rose by 1.
      :::
    bridges: []
  - id: ai-winters.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-winters
    title: XOR, the puzzle no straight line can solve
    markdown: |-
      Because a perceptron fires when $w_1 x_1 + w_2 x_2 + b > 0$, its dividing boundary is a straight line. XOR ("one input on, but not both") wants 1 for (0,1) and (1,0), and 0 for (0,0) and (1,1). On a square, the 1s sit at opposite corners, and no straight line splits them from the 0s.

      The algebra is short. Firing for (1,0) and (0,1) needs $w_1 + b > 0$ and $w_2 + b > 0$. Staying silent for (0,0) needs $b \le 0$. Add the first two: $w_1 + w_2 + 2b > 0$, so $w_1 + w_2 + b > -b \ge 0$. So it *fires* for (1,1), which XOR forbids, whatever the weights.

      Watch the learning rule try anyway:

      ```python run
      def train(targets, epochs=7):
          """Rosenblatt-style learning: nudge the weights after every mistake."""
          cases = [(0, 0), (0, 1), (1, 0), (1, 1)]
          w1 = w2 = b = 0
          for epoch in range(1, epochs + 1):
              mistakes = 0
              for (x1, x2), y in zip(cases, targets):
                  guess = 1 if w1 * x1 + w2 * x2 + b > 0 else 0
                  error = y - guess                  # +1, 0, or -1
                  w1, w2, b = w1 + error * x1, w2 + error * x2, b + error
                  mistakes += error != 0
              print(f"  epoch {epoch}: mistakes={mistakes} w1={w1} w2={w2} b={b}")

      print("AND (targets 0, 0, 0, 1):")
      train([0, 0, 0, 1])
      print("XOR (targets 0, 1, 1, 0):")
      train([0, 1, 1, 0])
      ```

      On AND, mistakes reach 0 by epoch 6 (one pass through all four examples is an *epoch*). On XOR the weights fall into a loop: from epoch 3 on, every epoch ends at w1 = −1, w2 = 0, b = 1 with all 4 answers wrong.
    bridges: []
  - id: ai-winters.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-winters
    title: A precise proof, a sweeping reading
    markdown: |-
      :::story *Perceptrons* (1969)
      Marvin Minsky and Seymour Papert of MIT published *Perceptrons*, a mathematical study of what single-layer perceptrons can and cannot compute. They also doubted that multi-layer versions would pay off, and nobody then had a widely known way to train them. Neural-network funding dried up through the 1970s. The book is often blamed, though historians still debate how much it caused. Rosenblatt died in a boating accident in 1971, and the field lost its most energetic champion.
      :::

      :::mixup "Minsky and Papert proved that neural networks can't compute XOR."
      They proved it for a *single layer*. Add a hidden layer and XOR is easy: one hidden unit computes OR, another computes AND, and the output fires when OR is on and AND is off. You'll build this in the neural-network module. What was missing was a way to *train* hidden layers, which arrived in the 1980s.
      :::
    bridges: []
  - id: ai-winters.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.ai-winters
    markdown: Work a few perceptron updates by hand, then diagnose setbacks old and new, from the Lighthill report to a chatbot that costs more to run than the call center it replaced.
    takeaway: |-
      A single perceptron draws one straight line, so it can't do XOR; a hidden layer fixes that. AI winters came from many causes at once, so ask whether a setback is a model limit, a cost problem, a scaling problem, or a funding change.
  - id: ai-winters.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.ai-winters
    markdown: |-
      AI winters involved mismatches among expectations, demonstrated capability, resources, and funding; a limitation of one model is not a theorem about every possible AI system.
  - id: ai-winters.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-winters
    title: Translation, Lighthill, and the money
    markdown: |-
      Machine translation disappointed too. US agencies had funded it heavily, hoping to read Russian scientific papers automatically. In 1966 the ALPAC report found the translations of the day slower, less accurate, and more costly than human work, and saw "no immediate or predictable prospect of useful machine translation." Funding was cut sharply.

      :::story The Lighthill report (1973)
      Britain's Science Research Council asked Sir James Lighthill, a leading Cambridge applied mathematician, to assess AI. He argued that its successes worked only in small, tidy worlds, and that on real problems the possibilities would explode: the **combinatorial explosion** you met with Shakey's boxes. Most British AI funding was cut, leaving a few centers such as Edinburgh.
      :::

      In the US, the 1969 Mansfield Amendment pushed military research money toward direct defense uses, and DARPA, AI's biggest American funder, lost patience with open-ended research. No single paper froze the field; several causes arrived together.
    bridges: []
  - id: ai-winters.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-winters
    title: Diagnose a setback before you mourn it
    markdown: |-
      "AI has failed" can mean four very different things, each with a different fix:

      | Kind of setback | First-winter example | What would help |
      | --- | --- | --- |
      | The model can't represent the pattern | Single-layer perceptron and XOR | A different model, such as a hidden layer |
      | It works, but costs more than it saves | 1960s machine translation | Cheaper computing or a narrower task |
      | It works in toy worlds but won't scale | Lighthill's combinatorial explosion | Better search, or learning |
      | The funder's priorities changed | Mansfield Amendment and DARPA | A new funder or a clearer use |

      Try it on a headline like "Study shows chatbots can't do long division." Which row is it? Only the first is about what a design can represent, and even that a new design may fix. As the next lessons show, every idea in this table came back.
    bridges: []
