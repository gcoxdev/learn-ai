schema_version: 0.2-draft
lesson:
  id: ai-winters
  version: 0.2.0-draft
  title: Limits, expectations, and changing support
  state: draft
  summary: Use a tiny pattern problem to see why a real limitation is narrower than a sweeping claim that an entire
    field has failed.
  slot: M01.4
  category: learning
  sources:
  - title: ALPAC — Language and Machines (1966)
    url: https://nap.nationalacademies.org/resource/alpac_lm/ARC000005.pdf
  - title: Buchanan — A (Very) Brief History of Artificial Intelligence
    url: https://ojs.aaai.org/aimagazine/index.php/aimagazine/article/view/1848/0
  - title: Minsky and Papert — Perceptrons, expanded edition
    url: https://mitpress.mit.edu/9780262631112/perceptrons/
  archetype: perspective
objectives:
- id: objective.ai-winters
  version: 2-draft
  statement: Distinguish model limitations, evaluation failures, and changes in research support without attributing
    AI setbacks to one cause.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - ai-winters.base.v2
  - ai-winters.transfer.v2
  prerequisites:
  - anyOf:
    - objective.symbolic-era
scenes:
- id: ai-winters.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ai-winters
  title: Expectations are part of the history
  markdown: The phrase **AI winter** refers to periods of reduced enthusiasm or support for parts of AI research
    and business. It does not mean that everyone stopped working or that one experiment disproved the whole subject.
    A funding decision, a technical theorem, and a failed product answer different questions. To understand a setback,
    ask who expected what, which system was tested, and what resources or institutions changed. Different areas
    and countries did not necessarily experience the same timeline.
  text_mode: The phrase **AI winter** refers to periods of reduced enthusiasm or support for parts of AI research
    and business. It does not mean that everyone stopped working or that one experiment disproved the whole subject.
    A funding decision, a technical theorem, and a failed product answer different questions. To understand a setback,
    ask who expected what, which system was tested, and what resources or institutions changed. Different areas
    and countries did not necessarily experience the same timeline.
  bridges: []
- id: ai-winters.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ai-winters
  title: A simple classifier has a real boundary
  markdown: A **classifier** assigns an input to a category. One simple model combines inputs with weights and compares
    the result with a cutoff. The cutoff rule can divide a two-dimensional picture with a straight line. Such a
    model is useful for some patterns and unable to express others. A **model class** is the collection of rules
    a chosen design can represent. A limitation of that class does not automatically apply to a system using different
    features, additional layers, or another kind of computation.
  text_mode: A **classifier** assigns an input to a category. One simple model combines inputs with weights and
    compares the result with a cutoff. The cutoff rule can divide a two-dimensional picture with a straight line.
    Such a model is useful for some patterns and unable to express others. A **model class** is the collection of
    rules a chosen design can represent. A limitation of that class does not automatically apply to a system using
    different features, additional layers, or another kind of computation.
  bridges: []
- id: ai-winters.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-winters
  title: Inspect a pattern that one straight line cannot separate
  markdown: Take two binary inputs and four points. Give category 1 to [1,0] and [0,1], and category 0 to [0,0]
    and [1,1]. This is XOR, meaning “one input is on, but not both.” Draw the four corners of a square. The positive
    cases occupy opposite corners, so no single straight boundary separates them from the other two. This is a concrete
    representational limitation of a linear threshold classifier. It is not a proof that networks with additional
    nonlinear computation cannot represent XOR.
  text_mode: Take two binary inputs and four points. Give category 1 to [1,0] and [0,1], and category 0 to [0,0]
    and [1,1]. This is XOR, meaning “one input is on, but not both.” Draw the four corners of a square. The positive
    cases occupy opposite corners, so no single straight boundary separates them from the other two. This is a concrete
    representational limitation of a linear threshold classifier. It is not a proof that networks with additional
    nonlinear computation cannot represent XOR.
  bridges: []
- id: ai-winters.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-winters
  title: A research report can concern a particular application
  markdown: The 1966 ALPAC report examined machine translation and language research. Its critical assessment concerned
    the state and practical value of the translation approaches and resources under discussion. Reading an application
    review as a timeless impossibility theorem changes its claim. For any report, separate the observed performance,
    the comparison used, the costs counted, and its recommendations. A system that performs poorly relative to its
    cost may still contain a useful idea that later methods develop differently.
  text_mode: The 1966 ALPAC report examined machine translation and language research. Its critical assessment concerned
    the state and practical value of the translation approaches and resources under discussion. Reading an application
    review as a timeless impossibility theorem changes its claim. For any report, separate the observed performance,
    the comparison used, the costs counted, and its recommendations. A system that performs poorly relative to its
    cost may still contain a useful idea that later methods develop differently.
  bridges: []
- id: ai-winters.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.ai-winters
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: A technical limitation names a problem, assumptions, and model class. Funding and deployment outcomes
    add other causes; neither a boom nor a setback settles the whole field.
- id: ai-winters.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.ai-winters
  markdown: AI winters involved mismatches among expectations, demonstrated capability, resources, and funding;
    a limitation of one model is not a theorem about every possible AI system.
  text_mode: AI winters involved mismatches among expectations, demonstrated capability, resources, and funding;
    a limitation of one model is not a theorem about every possible AI system.
- id: ai-winters.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-winters
  title: Examine deployment costs as well as demonstrations
  markdown: Imagine a toy rule system that gives correct recommendations on twenty carefully prepared cases. In
    deployment, someone must collect accurate inputs, maintain rules, resolve exceptions, and handle failure. Those
    continuing costs may exceed the apparent benefit of the demonstration. Hardware markets and available funding
    can also change which approaches are practical. This example illustrates possible mechanisms behind disappointment;
    it is not a numerical reconstruction of a historical project. Multiple causes can reinforce one another without
    reducing to a single famous paper.
  text_mode: Imagine a toy rule system that gives correct recommendations on twenty carefully prepared cases. In
    deployment, someone must collect accurate inputs, maintain rules, resolve exceptions, and handle failure. Those
    continuing costs may exceed the apparent benefit of the demonstration. Hardware markets and available funding
    can also change which approaches are practical. This example illustrates possible mechanisms behind disappointment;
    it is not a numerical reconstruction of a historical project. Multiple causes can reinforce one another without
    reducing to a single famous paper.
  bridges: []
- id: ai-winters.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-winters
  title: Use setbacks to ask sharper questions
  markdown: 'For a claim that an AI technique “failed,” write the narrowest supported version. Did one model class
    fail to represent a pattern? Did a trained system perform poorly on a task? Did a product cost more than expected?
    Did a sponsor change priorities? These findings suggest different responses: change the representation, improve
    evaluation, redesign operations, or find another setting. Historical setbacks teach how to test assumptions.
    They do not give a calendar for predicting the next boom or guarantee that a revived method will succeed.'
  text_mode: 'For a claim that an AI technique “failed,” write the narrowest supported version. Did one model class
    fail to represent a pattern? Did a trained system perform poorly on a task? Did a product cost more than expected?
    Did a sponsor change priorities? These findings suggest different responses: change the representation, improve
    evaluation, redesign operations, or find another setting. Historical setbacks teach how to test assumptions.
    They do not give a calendar for predicting the next boom or guarantee that a revived method will succeed.'
  bridges: []
