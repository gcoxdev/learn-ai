schema_version: 0.2-draft
lesson:
  id: ai-winters
  version: 0.1.0-draft
  title: Limits, expectations, and changing support
  state: draft
  summary: AI winters involved mismatches among expectations, demonstrated capability, resources, and funding; a
    limitation of one model is not a theorem about every possible AI system.
  slot: M01.4
  category: learning
  minutes: 12
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.ai-winters
  version: 1-draft
  statement: AI winters involved mismatches among expectations, demonstrated capability, resources, and funding;
    a limitation of one model is not a theorem about every possible AI system.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - ai-winters.base
  - ai-winters.transfer
  prerequisites:
  - anyOf:
    - objective.symbolic-era
scenes:
- id: ai-winters.s1
  title: A perceptron learns a linear boundary
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ai-winters
  markdown: A basic perceptron combines weighted inputs and a threshold to classify examples. In two dimensions,
    its boundary is a line. If classes can be separated by one line, a suitable learning rule has useful convergence
    conditions. Other arrangements require different features or models.
  text_mode: A basic perceptron combines weighted inputs and a threshold to classify examples. In two dimensions,
    its boundary is a line. If classes can be separated by one line, a suitable learning rule has useful convergence
    conditions. Other arrangements require different features or models.
  bridges: []
- id: ai-winters.s2
  title: See the XOR limitation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-winters
  markdown: For binary inputs, XOR labels [0, 0] and [1, 1] one way and [0, 1] and [1, 0] the other. No single straight
    line separates those two classes in the original plane. A multilayer nonlinear representation can solve it.
    The limitation belongs to the specified model and representation.
  text_mode: For binary inputs, XOR labels [0, 0] and [1, 1] one way and [0, 1] and [1, 0] the other. No single
    straight line separates those two classes in the original plane. A multilayer nonlinear representation can solve
    it. The limitation belongs to the specified model and representation.
  bridges:
  - functions
- id: ai-winters.s3
  title: Scientific limits met institutional expectations
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-winters
  markdown: Periods called AI winters reflected several forces, including ambitious promises, limited computation
    and data, brittle systems, commercial disappointment, and changes in government or industrial support. Different
    regions and research traditions experienced these changes differently. A single book or failed demonstration
    is too simple an explanation for the whole history.
  text_mode: Periods called AI winters reflected several forces, including ambitious promises, limited computation
    and data, brittle systems, commercial disappointment, and changes in government or industrial support. Different
    regions and research traditions experienced these changes differently. A single book or failed demonstration
    is too simple an explanation for the whole history.
  bridges: []
- id: ai-winters.s4
  title: Keep claims proportional to the result
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-winters
  markdown: If a classifier fails on XOR, the valid conclusion concerns that classifier’s expressivity, not the
    impossibility of learning. If a product succeeds in a narrow benchmark, its deployment value still depends on
    reliability and cost. Separating technical evidence from expectations helps interpret both historical setbacks
    and later enthusiasm.
  text_mode: If a classifier fails on XOR, the valid conclusion concerns that classifier’s expressivity, not the
    impossibility of learning. If a product succeeds in a narrow benchmark, its deployment value still depends on
    reliability and cost. Separating technical evidence from expectations helps interpret both historical setbacks
    and later enthusiasm.
  bridges: []
- id: ai-winters.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.ai-winters
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: AI winters involved mismatches among expectations, demonstrated capability, resources, and funding;
    a limitation of one model is not a theorem about every possible AI system.
- id: ai-winters.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.ai-winters
  markdown: AI winters involved mismatches among expectations, demonstrated capability, resources, and funding;
    a limitation of one model is not a theorem about every possible AI system.
  text_mode: AI winters involved mismatches among expectations, demonstrated capability, resources, and funding;
