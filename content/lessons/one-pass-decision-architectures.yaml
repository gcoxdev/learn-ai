objectives:
  - id: objective.one-pass-decision-architectures
    version: 1-draft
    statement: A decision model gives every supplied option a score, turns the scores into probabilities with a softmax, and the scores can come from option markers in an encoder, from an LLM's logits for single-token answer codes, or from similarities between separately encoded state and option vectors. How many passes a system needs depends on its implementation, and fixed option budgets limit how many options a design handles well.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - one-pass-decision-architectures.base
      - one-pass-decision-architectures.transfer
      - one-pass-decision-architectures.calculate
    prerequisites:
      - anyOf:
          - objective.typed-decision-questions
      - anyOf:
          - objective.attention
scenes:
  - id: one-pass-decision-architectures.s1
    title: One recipe, four engines
    type: explanation
    depth: intuition
    objective_refs:
      - objective.one-pass-decision-architectures
    markdown: |-
      A customer writes that a brake cable snapped. Tally's route question has four options here (we'll leave out the two escape options to keep the numbers small). How can a model turn that sentence into four probabilities without writing a word?

      The designs in this module share a recipe. Each gives every option a **score**, a real number where higher means a better fit, then squeezes the scores into probabilities with **softmax**, the function from the lesson on how a language model takes its next step:

      $$p_i = \frac{e^{z_i}}{\sum_j e^{z_j}}$$

      With scores $z$ = (0.4, −0.2, 1.1, 2.3) for billing, bookings, repairs, and safety, the exponentials are 1.49, 0.82, 3.00, and 9.97, which sum to about 15.29. The probabilities are 0.098, 0.054, 0.196, and 0.652.

      Where the scores come from is the real difference, and it also changes how much work runs per question:

      | Design | How the scores arise | What stays qualified |
      | --- | --- | --- |
      | Joint option scoring (Laya) | The message and every option are read together, and each option's score comes from its own marker | Input and option budgets, batching, and checkpoint behavior vary |
      | Restricted-token scoring (Nimble) | An ordinary LLM's scores for single-token answer codes are read at the answer position and normalized | Each question may need its own pass, depending on the scorer |
      | Separate state/action embeddings (CLM) | The state and each option are encoded separately and compared | Reuse needs the same option text, encoder, and heads, and a miss costs computation |
      | Undisclosed (Jev) | Not published | Test the documented behavior instead of guessing the inside |

      A word on "one pass". A model reads its whole prompt in a single forward pass, and that pass already gives the model's first next-token scores. So reading the message and reading off scores can happen in one pass, which is why no answer sequence has to be written. Some designs need more than one pass per message, for example one per question. "One pass" is a description of a particular implementation, not a promise about every system.

      The next three scenes open up three designs that have been published, and the last one covers the design that hasn't.
    diagram:
      caption: These designs read the message, score each option, and end in a softmax. How the scores arise differs.
      description: The message and the option list go into a model. From that model, three alternative ways of getting a score for each option branch off, which are reading option markers in an encoder (as Laya does), reading the scores of single-token answer codes (as Nimble does), and comparing the message to separately encoded option vectors (as CLM does). All three feed a softmax, which outputs a probability for each option. How many passes are needed depends on the implementation.
      nodes:
        - id: input
          label: Message + option list
          col: 0
          row: 1
          tone: data
        - id: model
          label: Model reads the input
          note: no answer text written
          col: 1
          row: 1
          tone: accent
        - id: a
          label: Option-marker readout
          note: Laya
          col: 2
          row: 0
        - id: b
          label: Answer-code logits
          note: Nimble
          col: 2
          row: 1
        - id: c
          label: Similarity to option vectors
          note: CLM
          col: 2
          row: 2
        - id: soft
          label: Softmax
          col: 3
          row: 1
          tone: accent
        - id: out
          label: Probabilities
          note: one per option
          col: 4
          row: 1
      edges:
        - from: input
          to: model
        - from: model
          to: a
        - from: model
          to: b
        - from: model
