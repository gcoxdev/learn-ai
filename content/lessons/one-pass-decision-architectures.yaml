assessment_families:
  - id: one-pass-decision-architectures.base
    objective_ref: objective.one-pass-decision-architectures
    task: base
    response_type: single_choice
    points: 1
    hint: Ask where the score for each option comes from (a slot, a token's logit, or a similarity), then remember that softmax turns every set of scores into probabilities.
    remediation_scene: one-pass-decision-architectures.s2
    variants:
      - id: one-pass-decision-architectures.base.1
        prompt: In a Laya-style model, how does each of Tally's four routes get its probability?
        options:
          - id: b
            text: The model writes out each route name and counts how often each one appears
          - id: a
            text: Each route has its own marker that is scored, then softmax runs across all four routes
          - id: c
            text: The message is compared with each route by counting the words they share
        answer: a
        feedback: The encoder reads the message and options together, a small head scores each option's marker, and softmax makes the scores into probabilities. Nothing is written, and the scoring is learned rather than word counting.
      - id: one-pass-decision-architectures.base.2
        prompt: An LLM's logits are billing 3.1, safety 4.0, and a non-route token "Sorry" 5.0. A scorer keeps only the route answer codes. What does it do?
        options:
          - id: c
            text: Picks "Sorry", since it has the highest logit overall
          - id: b
            text: Keeps the route logits and applies softmax over only those codes
          - id: a
            text: Divides each route logit by 5.0, the highest logit overall
        answer: b
        feedback: Restricting means ignoring every token outside the allowed codes and renormalizing over what remains. The "Sorry" mass is dropped, not added back. Dividing by the maximum isn't softmax.
      - id: one-pass-decision-architectures.base.3
        prompt: A CLM-style scorer lowers its temperature from 1.0 to 0.1. What happens to the probabilities?
        options:
          - id: a
            text: The leader gets more of the probability, and the ranking stays the same
          - id: c
            text: The probabilities flatten, and the ranking stays the same
          - id: b
            text: The leader gets more probability, and a different option may now win
        answer: a
        feedback: Dividing every score by a smaller T widens the gaps between them, which sharpens the distribution. Since all scores are scaled together, their order is unchanged. Temperature adjusts confidence, not the winner.
      - id: one-pass-decision-architectures.base.4
        prompt: Why can a CLM-style model be faster when there are 1,000 candidate actions?
        options:
          - id: c
            text: It skips reading the message and only looks at the candidates
          - id: b
            text: It generates a short label for each candidate, in parallel
          - id: a
            text: Candidate vectors are computed once and reused across messages
        answer: a
        feedback: State and option are encoded separately, so option vectors can be cached and reused while the option text, encoder, and heads stay the same. A new option is a cache miss. The model still reads the message, and it never generates labels.
      - id: one-pass-decision-architectures.base.5
        prompt: Tally's chat model writes a 30-token JSON reply. A scorer answers the same questions without writing any answer text. How many answer-writing steps does it need after reading?
        options:
          - id: b
            text: Four, one for each question
          - id: c
            text: About thirty, the same as the chat model, but done in parallel
          - id: a
            text: None, because the scores come out of reading the input
        answer: a
        feedback: The scores come out of reading the input, so no answer sequence has to be written. The chat model's steps happen one after another because each token depends on the last. The scorer still pays for the read, and some designs run a separate read per question.
      - id: one-pass-decision-architectures.base.6
        prompt: A Laya-style model shares a fixed budget of 256 option tokens across a question's options. Compared with a question with four options, what happens on a question with 77 labels?
        options:
          - id: a
            text: Each label gets only a few tokens, so descriptions shrink to almost nothing
          - id: c
            text: Each label gets more tokens, because there are more labels to share them
          - id: b
            text: The budget grows automatically to fit the number of labels
        answer: a
        feedback: The budget is fixed, so more options means fewer tokens per option, about 3.3 each for Banking77's 77 labels (256 ÷ 77). A bigger list doesn't expand the budget.
      - id: one-pass-decision-architectures.base.7
        prompt: Nimble's repository documents a CUDA scorer that scores each field on its own with the full prompt each time. What does this say about "one read per message"?
        options:
          - id: b
            text: It is the same in every system, so the repository must be wrong
          - id: c
            text: It is true for a question with a single option and false for others
          - id: a
            text: It describes some implementations, and a scorer can run one read per field
        answer: a
        feedback: How many reads run is a property of the implementation. The Mac scorer shares the context work across fields, and the CUDA scorer repeats the prompt for each field, so four fields can mean four full prompts.
  - id: one-pass-decision-architectures.transfer
    objective_ref: objective.one-pass-decision-architectures
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name which design the scenario uses, then ask what its score depends on (the option's slot, the allowed tokens, or cached vectors) and what limits it.
    remediation_scene: one-pass-decision-architectures.s5
    variants:
      - id: one-pass-decision-architectures.transfer.1
        prompt: A team scores single-token codes "A", "B", "C", and "D" using an LLM's logits at the answer position. The model's top token overall is "Let", as in "Let me think". What does restricting to the four letters do?
        options:
          - id: c
            text: It picks "Let", since that token is the model's strongest preference
          - id: a
            text: It ignores "Let" and compares only the four letters' scores
          - id: b
            text: It stops the model from reading the question
        answer: a
        feedback: Restricting to the allowed tokens removes "Let" from consideration and renormalizes over the four letters. The model still reads everything before the answer position.
      - id: one-pass-decision-architectures.transfer.2
        prompt: A hardware store has 1,000 product categories that change twice a year, and each message must be matched to one. Which design handles this best?
        options:
          - id: b
            text: An encoder with a slot for each category, sharing 256 option tokens
          - id: a
            text: Cached category embeddings compared with the message embedding
          - id: c
            text: A one-token logit read, with every category given a single answer token
        answer: a
        feedback: Category vectors computed once can be reused for every message until the categories change, and similarity scales to long lists. A fixed 256-token budget gives about 0.26 tokens per category, and a thousand single-token answers aren't practical.
      - id: one-pass-decision-architectures.transfer.3
        prompt: A buyer asks how Jev scores its options, and TypeSafe hasn't said. What can the buyer reasonably say?
        options:
          - id: c
            text: It has to be a masked encoder, because that's the usual design
          - id: b
            text: Its mechanism is unpublished, so judge it by testing on your own data
          - id: a
            text: It must restrict logits, since all decision models do the same
        answer: b
        feedback: TypeSafe publishes the interface but not the architecture, so any claim about the inside is a guess. The designs differ across systems, so one can't be assumed from another.
      - id: one-pass-decision-architectures.transfer.4
        prompt: A team lowers softmax temperature from 1.0 to 0.1 hoping to raise accuracy. What is the likely result?
        options:
          - id: a
            text: Accuracy stays the same, but the probabilities become more extreme
          - id: c
            text: Accuracy rises, since the correct option now gets more probability
          - id: b
            text: Accuracy falls, since sharper probabilities lose information
        answer: a
        feedback: The same scores in the same order pick the same winner, so accuracy doesn't move. Sharpening only changes how extreme the probabilities look, which can make a wrong answer look confident.
      - id: one-pass-decision-architectures.transfer.5
        prompt: A bank's question has 77 intents. A Laya-style encoder scores much worse than a competitor on it, though it did well on a 4-option question. What is the most likely contributing factor?
        options:
          - id: b
            text: The encoder cannot read bank-related messages at all
          - id: c
            text: Softmax only works when there are fewer than ten options
          - id: a
            text: The fixed option budget leaves each intent only a few tokens
        answer: a
        feedback: The system did fine with four options, so reading isn't the problem. A fixed budget shared by 77 labels leaves each one too little room, and softmax handles any number of scores. Competitor figures in such tables were not always measured by the same team, so treat the gap as indicative.
      - id: one-pass-decision-architectures.transfer.6
        prompt: A CLM-style scorer caches vectors for 1,000 candidate actions. A new request brings 40 candidates it has never seen, plus 960 old ones. What happens?
        options:
          - id: c
            text: The 1,000 vectors are recomputed, since the candidate list changed
          - id: a
            text: The 960 cached vectors are reused and the 40 new ones are embedded
          - id: b
            text: The cache still covers 1,000 vectors, since they do not depend on the text
        answer: a
        feedback: A cached vector can be reused while its text and the model that made it stay the same. New candidates are cache misses and cost computation, though the old ones are still reused.
  - id: one-pass-decision-architectures.calculate
    objective_ref: objective.one-pass-decision-architectures
    task: base
    response_type: numeric
    points: 1
    hint: "Probability of an option = e^(its score) ÷ the sum of e^(score) over the allowed options. Useful values: e^1 = 2.718, e^2 = 7.389, e^3 = 20.09, e^4 = 54.60."
    remediation_scene: one-pass-decision-architectures.s2
    absolute_tolerance: 0.01
    variants:
      - id: one-pass-decision-architectures.calculate.1
        prompt: Two options have scores 2 and 0. After softmax, what probability does the first option get?
        answer: 0.88
        feedback: e^2 = 7.389 and e^0 = 1, so 7.389 ÷ 8.389 ≈ 0.88.
      - id: one-pass-decision-architectures.calculate.2
        prompt: Four options all have the score 1.5. After softmax, what probability does each get?
        answer: 0.25
        feedback: Equal scores give equal exponentials, so each option gets 1 of 4 equal shares, 0.25.
      - id: one-pass-decision-architectures.calculate.3
