  - id: one-pass-decision-architectures.s2
    title: Give each option its own marker
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.one-pass-decision-architectures
    markdown: |-
      Laya, from Convai Innovations, is built on ModernBERT-large, an **encoder**: a model that reads a whole text in both directions at once, instead of left to right. Its model card describes an input that holds the message and the options, where every option gets its own `[MASK]` marker, a blank placeholder the encoder fills in with a vector.

      After the encoder runs, a small scoring head, trained from scratch, reads the vector at each marker and produces one number per option. Those are the scores $z_i$, and a softmax over that question's options gives the probabilities. The English checkpoint has 421M parameters in total.

      Because attention (the lesson on queries, keys, and values) lets every marker look at the message and at the other options, each score is judged in context. All of a question's options are scored from the same read of the input.

      The catch is the **option budget**. The card says the English checkpoint reads 512 tokens and gives 192 of them to options, while the multilingual checkpoint reads 1,024 and gives 256. With 192, four routes get 48 tokens each, enough for a label and a description. That budget matters again in a later scene. The card also lists three separate configurations (English, multilingual, and a task-adapted one), so a number quoted for Laya always belongs to one of them.
  - id: one-pass-decision-architectures.s3
    title: Borrow a language model's scores
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.one-pass-decision-architectures
    markdown: |-
      Nimble, from Bespoke Labs, is a LoRA fine-tune of Qwen3.5-9B, documented in its own repository and model card. (LoRA trains a small add-on instead of every weight.) The documentation says it gives every allowed answer a single-token code. Instead of generating an answer, it reads the model's **logits**, the raw score for every token in the vocabulary at the next position, takes the logits for those answer codes, and normalizes over the allowed candidates only. A table maps each code back to its label. Using codes avoids a problem: a label such as "other topic" may be several tokens, and scoring a phrase as if it were one token would be wrong.

      This is the masking you saw in the lesson on constrained decoding, used for scoring instead of for generating. Tally's route codes might get logits like A (billing) 3.1, B (bookings) 1.0, C (repairs) 2.2, D (safety) 4.0. The model's top token overall is "Sorry" at 5.0, which a free-running model would start writing. Keeping only the four codes and applying softmax gives billing 0.251, bookings 0.031, repairs 0.102, safety 0.617.

      The "Sorry" mass is thrown away and the rest is renormalized. The repository documents this as text-only, with 1 to 255 choices per field.

      How many passes happen depends on the scorer. The repository's Mac scorer processes the shared context once and then scores all fields in parallel. Its CUDA scorer scores each field on its own, with the full prompt each time. So "one read per message" holds for one and not the other, and four questions can mean four full prompts.

      :::mixup "A decision model is cheaper because it reads less carefully."
      These designs read the whole message. The saving comes from not writing an answer one token at a time. A chat model that writes 30 tokens takes about 30 sequential steps after the first, and a scorer takes none for the answer. Total work still depends on prompt length and on how many questions each get their own pass.
      :::
  - id: one-pass-decision-architectures.s4
    title: Compare the message to option vectors
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.one-pass-decision-architectures
    markdown: |-
      CLM (Contrastive-LM, from researchers at Stanford and NVIDIA) takes a third route. A **frozen** Qwen3-8B encoder (its weights are not changed during training) feeds two small **projection heads**, one for states and one for candidate actions. A projection head is a small layer that maps a vector into a shared space. Training uses a bidirectional **InfoNCE** loss, the contrastive loss from the lessons on self-supervised learning and on CLIP, which pulls matching pairs together and pushes mismatches apart.

      Scoring is a similarity. **Cosine similarity** is 1 when two vectors point the same way and 0 when they're at right angles. In a simplified form, with state vector $\mathbf{s}$, option vectors $\mathbf{a}_i$, and a **temperature** $T > 0$ that sharpens or flattens the result, the probability is:

      $$p_i = \frac{\exp(\cos(\mathbf{s},\mathbf{a}_i)/T)}{\sum_j \exp(\cos(\mathbf{s},\mathbf{a}_j)/T)}$$

      The state and the candidates are encoded separately, so option vectors can be computed once and reused. This is **action caching**. Reuse works while the option text, the encoder, the heads, and the preprocessing stay the same. A new or reworded option is a cache miss and has to be embedded. The CLM model card reports about 13 times faster than alternatives with roughly 1,000 candidates (a vendor claim as of October 2026). Its card also says CLM only scores the candidates you give it and that its probabilities are relative to that set: they are shares of the supplied list, not the chance the answer is correct.

      Here are all three scorers on Tally's four routes. The vectors in (c) are invented, and they are built to make a mistake: the message is about a snapped brake cable, yet the vectors favor *bookings*. Run it, then change `T`.

      ```python run
      import numpy as np

      def softmax(z):
          e = np.exp(np.array(z, dtype=float) - np.max(z))
          return e / e.sum()

      def show(label, p):
          print(f"{label:<14}", "  ".join(f"{o}={x:.3f}" for o, x in zip(options, p)))

      options = ["billing", "bookings", "repairs", "safety"]

      # (a) one score per option, read at that option's own marker
      show("a) markers", softmax([0.4, -0.2, 1.1, 2.3]))

      # (b) full-vocabulary logits; keep only the four allowed answer codes
      vocab = {"billing": 3.1, "bookings": 1.0, "repairs": 2.2, "safety": 4.0, "Sorry": 5.0}
      print("b) free pick:", max(vocab, key=vocab.get))
      show("b) restricted", softmax([vocab[o] for o in options]))

      # (c) cosine similarity between the state and cached option vectors
      state = np.array([0.2, 0.9, 0.4])
      opt_vecs = np.array([[0.9, 0.1, 0.0], [0.1, 0.8, 0.2], [0.3, 0.3, 0.8], [0.0, 0.7, 0.7]])
      cos = opt_vecs @ state / (np.linalg.norm(opt_vecs, axis=1) * np.linalg.norm(state))
      show("c) cosines", cos)
      for T in (1.0, 0.1, 0.05):
          show(f"c) T={T}", softmax(cos / T))
      ```

      The cosines are 0.297, 0.982, 0.714, and 0.915. At T = 1 the probabilities are nearly flat (0.312 for bookings, the winner, and 0.292 for safety, the right answer). At T = 0.1 bookings gets 0.634.

      :::predict At T = 0.05, does bookings' probability go up or down, and does the ranking change?
      It goes up, to 0.791 in the last line of the output. The ranking doesn't change, because dividing every score by the same T keeps their order. Lower temperature only sharpens the gaps, so here the wrong answer, bookings, becomes more confident while safety falls to 0.205. Temperature is a confidence knob, not an accuracy knob.
      :::
  - id: one-pass-decision-architectures.s5
    title: A fourth design, and where one pass runs out of room
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.one-pass-decision-architectures
    markdown: |-
      TypeSafe AI's Jev is the fourth design, and its mechanism is not public. TypeSafe's launch article says only "a new model architecture, parallel sampler for maximum efficiency". Jev's documentation does say what goes in and what comes out, so you can use it and test it without knowing what's inside. The same goes for OpenAI's Decisions API, whose mechanism has not been announced. An interface or a speed claim cannot reveal an architecture.

      **Steps saved.** Tally's JSON reply is about 30 tokens, so a chat model takes about 30 sequential generation steps (the first comes out of the prompt pass, so 29 more after it, and 30 is a fair simplification). The designs above that disclose how they work need no answer sequence after the read. They do pay for the read, and some pay it once per question.

      A fair baseline also exists between the two: ask a chat model for a schema-constrained short answer. It does not have to write paragraphs or malformed JSON. Schema validity, decision quality, honesty of the probabilities, and runtime cost are four separate things to measure.

      **High-cardinality limits.** A fixed option budget stretches thin when the list is long. Laya shares its option tokens across a question's options: 192 ÷ 4 = 48 each for four routes. Banking77, a public dataset of customer-bank intents (Casanueva et al., 2020), has 77 labels. At a 256-token budget that is 256 ÷ 77 ≈ 3.3 tokens per label, and Laya's benchmark file says the labels get "roughly 4 tokens each" and stop being distinguishable. Both base checkpoints score exactly 0.425 on Banking77, and the task-fine-tuned one reaches 0.492, against a published 0.870 for Jev. Laya's own benchmark file says its Jev figures are third-party published and were never measured by Convai, with different samples and prompts, so the comparison is indicative only. The same file attributes the 0.766 headline accuracy to the task-fine-tuned checkpoint, not the base English model. TypeSafe also says its speedups shrink on high-cardinality choices.

      So before picking a design, count the options. Four routes suit any of them. Seventy-seven labels, or 1,000 candidates, call for cached embeddings or a test of how the model behaves at that size.
  - id: one-pass-decision-architectures.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.one-pass-decision-architectures
    markdown: Tally, a hardware store, a bank, a newsroom, and a vendor with a secret design test whether you can tell the scoring designs apart, work a softmax, and spot when a design runs out of room.
    takeaway: |-
      A decision model gives each supplied option a score, from option markers, restricted token logits, or similarities between separately encoded vectors, then applies softmax. Skipping the written answer sequence saves time, but how many passes run depends on the design, and the option budget limits how many options it handles well.
  - id: one-pass-decision-architectures.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.one-pass-decision-architectures
    markdown: |-
      Score every option, softmax the scores, and count how many options you have before choosing a design.
