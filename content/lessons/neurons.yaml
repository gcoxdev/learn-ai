  - id: neurons.base.v2
    objective_ref: objective.neurons
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: 'Three stages, in order: multiply each input by its weight and add, add the bias to get z, then ReLU keeps a positive z and turns a negative z into 0.'
