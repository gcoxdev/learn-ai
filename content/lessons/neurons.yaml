scenes:
- id: neurons.s1
  title: Start from the predictor you already know
  type: explanation
  depth: intuition
  objective_refs:
  - objective.neurons
  markdown: The prediction lesson combined features by multiplying each by a weight and adding the results.
    An **artificial neuron** is a small numerical unit that builds on that idea. A common form takes a weighted
    sum, adds a bias, and applies an activation function. These are calculations, not a tiny person or a biological
    brain cell. Studying one unit lets us see the operations before connecting many units into a network.
  text_mode: The prediction lesson combined features by multiplying each by a weight and adding the results.
    An **artificial neuron** is a small numerical unit that builds on that idea. A common form takes a weighted
    sum, adds a bias, and applies an activation function. These are calculations, not a tiny person or a biological
    brain cell. Studying one unit lets us see the operations before connecting many units into a network.
  bridges: []
- id: neurons.s2
  title: Keep the roles separate
  type: explanation
  depth: intuition
  objective_refs:
  - objective.neurons
  markdown: 'Inputs are numbers arriving at the unit. Weights are stored numbers multiplying those inputs.
    A **bias** is an extra stored number added to the sum, even if all inputs are zero. An **activation function**
    is the final rule applied to that combined number. One common rule is the **rectified linear unit**, shortened
    to **ReLU**: keep a positive value and replace a negative value with zero. At zero it returns zero. These
    names distinguish the information arriving now from the settings and operations used to process it.'
  text_mode: 'Inputs are numbers arriving at the unit. Weights are stored numbers multiplying those inputs.
    A **bias** is an extra stored number added to the sum, even if all inputs are zero. An **activation function**
    is the final rule applied to that combined number. One common rule is the **rectified linear unit**, shortened
    to **ReLU**: keep a positive value and replace a negative value with zero. At zero it returns zero. These
    names distinguish the information arriving now from the settings and operations used to process it.'
  bridges:
  - arithmetic
  - vectors
  - matrices-tensors
  - functions
  figure:
    kind: bias
    caption: Explore the straight-line calculation before any nonlinear output rule. This bias is an added
      numerical offset.
    description: For prediction=weight×input+bias, changing the weight changes the slope while changing the
      bias moves the whole line up or down. Numerical bias is a parameter, distinct from bias in social or
      data discussions.
- id: neurons.s3
  title: Trace the weighted sum
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neurons
  markdown: 'Take inputs 2 and 1. Give them weights 0.5 and −1, and use bias 1. First contribution: 0.5 × 2
    = 1. Second contribution: −1 × 1 = −1. Add them: 1 + (−1) = 0. Add the bias: 0 + 1 = 1. This last value,
    before the activation, is called the **pre-activation**. Write the intermediate contributions separately
    so that a negative weight cannot quietly become a positive one.'
  text_mode: 'Take inputs 2 and 1. Give them weights 0.5 and −1, and use bias 1. First contribution: 0.5 ×
    2 = 1. Second contribution: −1 × 1 = −1. Add them: 1 + (−1) = 0. Add the bias: 0 + 1 = 1. This last value,
    before the activation, is called the **pre-activation**. Write the intermediate contributions separately
    so that a negative weight cannot quietly become a positive one.'
  bridges: []
- id: neurons.s4
  title: Apply the output rule
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neurons
  markdown: Our pre-activation is 1, so ReLU returns 1. If we instead use bias −2 while keeping both inputs
    and weights fixed, the contributions still sum to zero but the pre-activation becomes −2. ReLU then returns
    0. Changing the bias and changing the input are different operations. ReLU itself has no adjustable parameter
    in this definition. Its rule was chosen by the designer; changing weights does not rewrite that rule.
  text_mode: Our pre-activation is 1, so ReLU returns 1. If we instead use bias −2 while keeping both inputs
    and weights fixed, the contributions still sum to zero but the pre-activation becomes −2. ReLU then returns
    0. Changing the bias and changing the input are different operations. ReLU itself has no adjustable parameter
    in this definition. Its rule was chosen by the designer; changing weights does not rewrite that rule.
  bridges: []
- id: neurons.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.neurons
  markdown: Use two different examples to check your understanding. Hints are available for practice. A later,
    fresh answer without hints can demonstrate personal-study mastery.
  text_mode: Labeled radio options and a submit button; no timing requirement.
  takeaway: A neuron first combines inputs, then applies an activation rule. Weights change contributions;
    bias adds an offset; the activation changes how the combined value becomes an output.
- id: neurons.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.neurons
  markdown: A simple artificial neuron combines weighted inputs, adds a bias, and applies an activation function.
  text_mode: A simple artificial neuron combines weighted inputs, adds a bias, and applies an activation function.
- id: neurons.s5
  title: Why a nonlinear rule matters
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neurons
  markdown: A **linear** combination adds scaled contributions. ReLU is **nonlinear** because it clips one
    side of the number line instead of following one straight rule across all values. Connecting many linear
    calculations without nonlinearities still gives a linear overall mapping, with an offset if biases are
    included. Nonlinearities let a network express more varied patterns. That is a statement about what it
    can represent, not a promise that training will find a useful representation.
  text_mode: A **linear** combination adds scaled contributions. ReLU is **nonlinear** because it clips one
    side of the number line instead of following one straight rule across all values. Connecting many linear
    calculations without nonlinearities still gives a linear overall mapping, with an offset if biases are
    included. Nonlinearities let a network express more varied patterns. That is a statement about what it
    can represent, not a promise that training will find a useful representation.
  bridges: []
- id: neurons.s6
  title: Connect units into layers
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neurons
  markdown: A **layer** is a stage containing several units or related operations. A **neural network** connects
    such stages so one stage’s outputs can feed another. A **matrix** is a rectangular table of numbers; matrix
    multiplication provides a compact way to calculate many weighted sums. You do not need to expand a whole
    matrix here. First trace one unit accurately, then imagine other units doing the same operations with their
    own weights. Learned numbers need not have simple human labels.
  text_mode: A **layer** is a stage containing several units or related operations. A **neural network** connects
    such stages so one stage’s outputs can feed another. A **matrix** is a rectangular table of numbers; matrix
    multiplication provides a compact way to calculate many weighted sums. You do not need to expand a whole
    matrix here. First trace one unit accurately, then imagine other units doing the same operations with their
    own weights. Learned numbers need not have simple human labels.
  bridges: []
