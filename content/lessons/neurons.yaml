  - id: neurons.transfer.v3
    objective_ref: objective.neurons
    task: transfer
    response_type: single_choice
    points: 1
    hint: Separate what the neuron stores (weights and bias), what it receives (inputs), and the fixed rule it applies to z at the very end.
    remediation_scene: neurons.s4
    variants:
      - id: neurons.transfer.v3.1
        prompt: 'A spam-scoring neuron puts weight 2 on "number of links" and −1 on "sender is a saved contact" (1 for yes), with bias −4. An email has 2 links and comes from a saved contact. What does the ReLU neuron output?'
        options:
          - id: b
            text: '3'
          - id: d
            text: '1'
          - id: c
            text: '0'
          - id: a
            text: '−1'
        answer: c
        feedback: 'The contributions are 2 × 2 = 4 and −1 × 1 = −1, and the bias brings z to 4 − 1 − 4 = −1. ReLU replaces −1 with 0. Answering 1 takes the absolute value, −1 skips ReLU, and 3 forgets the bias.'
      - id: neurons.transfer.v3.2
        prompt: A thermostat neuron has pre-activation −0.4 for this morning's readings. An engineer raises its bias by 1 and leaves the weights and inputs alone. What does the ReLU neuron output now?
        options:
          - id: a
            text: '0.6'
          - id: b
            text: '1.4'
          - id: c
            text: '0'
          - id: d
            text: '1'
        answer: a
        feedback: 'The bias adds straight onto z, so z becomes −0.4 + 1 = 0.6, and ReLU keeps a positive value unchanged. 1.4 adds the bias to the size of −0.4 instead of to −0.4 itself, and 1 treats ReLU like the perceptron''s on/off step.'
      - id: neurons.transfer.v3.3
        prompt: A plant-watering neuron reads soil moisture and air temperature. After a week of training on logged data, which of its numbers have been adjusted?
        options:
          - id: c
            text: The weights and the ReLU rule
          - id: b
            text: The inputs and the weights
          - id: a
            text: The weights and the bias
          - id: d
            text: The bias and the inputs
        answer: a
        feedback: Training adjusts the parameters, which are the weights and the bias. Inputs are fresh readings that arrive with each example, and ReLU is a fixed rule chosen by the designer, so neither is learned.
      - id: neurons.transfer.v3.4
        prompt: A neuron has pre-activation −2. A teammate swaps its ReLU for a sigmoid and changes nothing else. What happens to its output?
        options:
          - id: b
            text: It goes from 2 to about 0.88
          - id: c
            text: It stays 0, since both rules zero out negatives
          - id: d
            text: It goes from −2 to about −0.12
          - id: a
            text: It goes from 0 to about 0.12
        answer: a
        feedback: 'ReLU(−2) = 0, while the sigmoid gives 1 / (1 + e²) ≈ 0.12: small but positive, because the sigmoid never quite reaches 0. It never goes negative either, and ReLU never outputs 2 for −2; that would be the absolute value.'
