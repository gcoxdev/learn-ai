scenes:
  - id: neurons.s1
    title: The smallest part of every neural network
    type: explanation
    depth: intuition
    objective_refs:
      - objective.neurons
    markdown: |-
      The photo app that finds your dog and the chatbot that answers your questions are built from one tiny part, copied millions or billions of times: the **artificial neuron**, a small calculation that takes in a few numbers and puts out one.

      You've met its ancestors: McCulloch and Pitts's on/off logic units (1943), Rosenblatt's perceptron (1958), and Lena's cold-brew forecast from the prediction lesson. All three start from a weighted sum, and a modern neuron works in three steps:

      1. Multiply each input by its weight and add up the results.
      2. Add one more number of its own, the bias.
      3. Pass the total through a fixed rule that decides what comes out.

      Real brain cells are far messier. The name comes from the biology that inspired early researchers, but an artificial neuron is plain arithmetic, so you can do every step by hand.
    bridges: []
  - id: neurons.s2
    title: Meet the picnic neuron
    type: explanation
    depth: intuition
    objective_refs:
      - objective.neurons
    markdown: |-
      Let's build a neuron that scores how good an afternoon looks for a picnic. It reads a sunshine score and a rain score; a bigger output means better picnic weather.

      | Part | What it is | Picnic neuron |
      | --- | --- | --- |
      | Inputs $x_1, x_2$ | Numbers arriving now, new each afternoon | sunshine 2, rain 1 |
      | Weights $w_1, w_2$ | Stored numbers that scale each input | 0.5 for sunshine, −1 for rain |
      | **Bias** $b$ | A stored number added to the sum | 1 |
      | Output rule | A fixed rule applied to the total | ReLU (coming up) |

      The signs carry meaning. A positive weight says "more of this input pushes the output up." The negative weight on rain says "rain pulls it down." The bias is the neuron's starting mood: how eager it is to fire before any evidence arrives.

      Weights and bias are the neuron's **parameters**, the numbers training adjusts. Inputs are data: they change with every example while the parameters stay put.

      The figure shows the one-input version, output = weight × input + bias. Drag the weight and the line tilts; drag the bias and the whole line slides up or down.
    bridges:
      - arithmetic
      - vectors
      - matrices-tensors
      - functions
    figure:
      kind: bias
      caption: Explore the straight-line calculation before any nonlinear output rule. This bias is an added numerical offset.
      description: For prediction=weight×input+bias, changing the weight changes the slope while changing the bias moves the whole line up or down. Numerical bias is a parameter, distinct from bias in social or data discussions.
  - id: neurons.s3
    title: Trace the weighted sum
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neurons
    markdown: |-
      Feed in sunshine 2 and rain 1:

      | Step | Calculation | Value |
      | --- | --- | ---: |
      | Sunshine contribution | 0.5 × 2 | 1 |
      | Rain contribution | −1 × 1 | −1 |
      | Weighted sum | 1 + (−1) | 0 |
      | Add the bias | 0 + 1 | 1 |

      The total before the output rule is the **pre-activation**, usually written $z$. Here $z = 1$.

      Give each contribution its own row: the most common slip by hand is a lost minus sign, and a separate "−1" row is hard to lose.

      :::papers The notation you'll see everywhere
      With inputs $x = [2, 1]$ and weights $w = [0.5, -1]$ stacked as vectors, papers write the whole neuron in one line:

      $$z = w^\top x + b, \qquad a = \sigma(z)$$

      $w^\top x$ is the dot product (multiply matching entries and add), 0 here, so $z = 0 + 1 = 1$. $\sigma$ stands for the output rule and $a$ for what comes out. Many papers reserve $\sigma$ for the sigmoid, so check which rule an author means.
      :::
    bridges: []
  - id: neurons.s4
    title: ReLU keeps positives and zeroes negatives
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neurons
    markdown: |-
      The fixed rule at the end is the **activation function**. The most popular one in modern networks is the **rectified linear unit**, or **ReLU**: keep a positive number, and replace a negative number with zero.

      $$\text{ReLU}(z) = \max(0, z)$$

      Our pre-activation is 1, so the picnic neuron outputs ReLU(1) = 1. That output is called the neuron's *activation*. Its activation depends on today's inputs; its weights and bias don't.

      :::predict Keep the same inputs and weights, but make the neuron pickier: bias −2. What does it output?
      The weighted sum is still 0, so $z = 0 + (-2) = -2$. ReLU turns −2 into 0, and the neuron stays silent. Same weather, same weights: the bias alone decided that this afternoon doesn't clear the bar.
      :::

      :::mixup "ReLU turns −2 into 2."
      That's the absolute value, a different rule. ReLU *replaces* negatives with zero: ReLU(−2) = 0. A neuron with a negative pre-activation passes nothing at all to whatever reads its output.
      :::
    bridges: []
  - id: neurons.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.neurons
    markdown: Trace fresh neurons by hand, then decide what a spam scorer, a thermostat, and a plant sensor do when a bias, an input, or the activation rule changes.
    takeaway: |-
      A neuron multiplies each input by a weight, adds them up with a bias, and passes the total through an activation rule such as ReLU. Training adjusts the weights and bias; the rule itself stays fixed.
