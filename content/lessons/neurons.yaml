    variants:
      - id: neurons.base.v2.1
        prompt: A unit has input 3, weight 2, and bias −8. Compute the weighted sum, add the bias, then apply ReLU. Record the weighted sum, pre-activation, and final output.
        feedback: The weighted sum is 3 × 2 = 6, and adding the bias −8 gives z = −2. ReLU replaces −2 with 0; it doesn't flip it to 2.
        answers:
          weighted_sum: 6
          pre_activation: -2
          output: 0
        reason_answer: rule
        reason_options:
          - id: flip
            text: ReLU changes a negative pre-activation to its positive magnitude.
          - id: bias
            text: ReLU adds the bias again to the pre-activation.
          - id: rule
            text: ReLU keeps a positive pre-activation and replaces a negative one with zero.
      - id: neurons.base.v2.2
        prompt: A unit has input 4, weight 2, and bias −3. Compute the weighted sum, add the bias, then apply ReLU. Record the weighted sum, pre-activation, and final output.
        feedback: The weighted sum is 4 × 2 = 8, and the bias −3 brings z to 5. ReLU leaves a positive value unchanged, so the output is 5.
        answers:
          weighted_sum: 8
          pre_activation: 5
          output: 5
        reason_answer: rule
        reason_options:
          - id: bias
            text: ReLU adds the bias again to the pre-activation.
          - id: rule
            text: ReLU keeps a positive pre-activation and replaces a negative one with zero.
          - id: flip
            text: ReLU changes a negative pre-activation to its positive magnitude.
      - id: neurons.base.v2.3
        prompt: Inputs 2 and 3 have weights 1 and 2, with bias −1. Compute the sum and bias, then apply ReLU. Record the weighted sum, pre-activation, and final output.
        feedback: The contributions are 1 × 2 = 2 and 2 × 3 = 6, summing to 8. The bias −1 gives z = 7, and ReLU keeps it.
        answers:
          weighted_sum: 8
          pre_activation: 7
          output: 7
        reason_answer: rule
        reason_options:
          - id: rule
            text: ReLU keeps a positive pre-activation and replaces a negative one with zero.
          - id: flip
            text: ReLU changes a negative pre-activation to its positive magnitude.
          - id: bias
            text: ReLU adds the bias again to the pre-activation.
      - id: neurons.base.v2.4
        prompt: Inputs 1 and 2 have weights 2 and −3, with bias 1. Compute the sum and bias, then apply ReLU. Record the weighted sum, pre-activation, and final output.
        feedback: The contributions are 2 × 1 = 2 and −3 × 2 = −6, summing to −4. The bias 1 gives z = −3, and ReLU replaces it with 0 rather than flipping it to 3.
        answers:
          weighted_sum: -4
          pre_activation: -3
          output: 0
        reason_answer: rule
        reason_options:
          - id: flip
            text: ReLU changes a negative pre-activation to its positive magnitude.
          - id: bias
            text: ReLU adds the bias again to the pre-activation.
          - id: rule
            text: ReLU keeps a positive pre-activation and replaces a negative one with zero.
