assessment_families:
- id: neurons.base
  objective_ref: objective.neurons
  task: base
  response_type: single_choice
  points: 1
  hint: A simple artificial neuron combines weighted inputs, adds a bias, and applies an activation function.
  variants:
  - id: neurons.base.1
    prompt: What does the bias contribute to a typical neuron?
    options:
    - id: a
      text: A new training example.
    - id: b
      text: A guarantee that all output values are positive.
    - id: correct
      text: An adjustable offset added to the weighted sum.
    answer: correct
    feedback: An adjustable offset added to the weighted sum.
  - id: neurons.base.2
    prompt: What does ReLU output for an input of −3?
    options:
    - id: b
      text: '3'
    - id: correct
      text: '0'
    - id: a
      text: −3
    answer: correct
    feedback: ReLU takes max(0,−3), which is 0.
- id: neurons.transfer
  objective_ref: objective.neurons
  task: transfer
  response_type: single_choice
  points: 1
  hint: A simple artificial neuron combines weighted inputs, adds a bias, and applies an activation function.
  variants:
  - id: neurons.transfer.1
    prompt: Inputs are 2 and 1, weights are 0.5 and −1, bias is 1. What is the weighted sum plus bias?
    options:
    - id: b
      text: '2'
    - id: correct
      text: '1'
    - id: a
      text: '0'
    answer: correct
    feedback: 0.5×2 + (−1)×1 + 1 = 1−1+1 = 1.
  - id: neurons.transfer.2
    prompt: A unit activates for several unrelated patterns. Is it necessarily broken?
    options:
    - id: correct
      text: No. Learned units need not have one human-readable specialty.
    - id: a
      text: Yes. Every neuron must represent one named concept.
    - id: b
      text: Yes. All units must learn identical weights.
    answer: correct
    feedback: No. Learned units need not have one human-readable specialty.
