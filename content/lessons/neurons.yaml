scenes:
- id: neurons.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.neurons
  text_mode: The complete explanation is available as readable text.
  title: A reusable calculation
  markdown: 'An artificial neuron is a mathematical unit, not a miniature person. A common unit multiplies
    each input by a weight, adds the results and a bias, and applies an activation function.


    The bias lets the unit shift its response even when the weighted inputs sum to zero.'
- id: neurons.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.neurons
  text_mode: The complete explanation is available as readable text.
  title: Work through one unit
  markdown: 'Take inputs 2 and 1, weights 0.5 and −1, and bias 1. The pre-activation value is 0.5×2 + (−1)×1
    + 1 = 1.


    If the activation is ReLU, which keeps positive values and replaces negative values with zero, the output
    is 1.'
- id: neurons.s3
  type: explanation
  depth: intuition
  objective_refs:
  - objective.neurons
  text_mode: The complete explanation is available as readable text.
  title: Layers reuse the same idea
  markdown: 'A layer contains multiple units with different weights. Its outputs become inputs to another layer.
    A matrix multiplication is a compact way to compute many weighted combinations.


    Layers can learn useful internal representations, but the meaning of an individual unit is not guaranteed
    to match a human-readable concept.'
- id: neurons.s4
  type: explanation
  depth: intuition
  objective_refs:
  - objective.neurons
  text_mode: The complete explanation is available as readable text.
  title: What is learned and what is chosen?
  markdown: 'Weights and biases are often learned. The arrangement of layers and choice of activation are part
    of the architecture design.


    Training adjusts permitted parameters; it does not automatically rewrite every design choice.'
