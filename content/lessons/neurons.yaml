  - id: neurons.s5
    title: Three output rules, side by side
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neurons
    markdown: |-
      ReLU isn't the only activation function. Here are three famous ones on both of your pre-activations:

      | Activation function | Rule | $z = 1$ | $z = -2$ |
      | --- | --- | ---: | ---: |
      | Step (the perceptron's rule) | 1 if $z > 0$, else 0 | 1 | 0 |
      | Sigmoid (from logistic regression) | $1 / (1 + e^{-z})$ | 0.731 | 0.119 |
      | ReLU | $\max(0, z)$ | 1 | 0 |

      The step rule is flat except for one jump, so nudging a weight usually changes nothing, and training gets no hint about which way to move. Smooth rules like the sigmoid let 1980s researchers train hidden layers with backpropagation. In the early 2010s ReLU took over in deep networks: it's cheap, and its slope doesn't fade for large positive inputs.

      Run the neuron yourself:

      ```python run
      import math

      def neuron(x, w, b, activation):
          z = sum(wi * xi for wi, xi in zip(w, x)) + b   # pre-activation
          return z, activation(z)

      relu    = lambda z: max(0.0, z)
      step    = lambda z: 1.0 if z > 0 else 0.0            # the perceptron's rule
      sigmoid = lambda z: 1 / (1 + math.exp(-z))

      x = [2, 1]          # sunshine, rain
      w = [0.5, -1]       # weights
      for b in [1, -2]:
          for name, f in [("step", step), ("sigmoid", sigmoid), ("ReLU", relu)]:
              z, a = neuron(x, w, b, f)
              print(f"bias {b:>2}  z = {z:>4}  {name:<7} output = {a:.3f}")
      ```

      Change the rain score to 3 and predict each output before you rerun. Then find the bias above which the ReLU neuron starts to fire for sunshine 2 and rain 3.
    bridges: []
  - id: neurons.s6
    title: Many neurons side by side make a layer
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neurons
    markdown: |-
      Give the picnic neuron a neighbor that reads the same inputs with its own parameters: a rainbow detector with weights 1 and 1 and bias −4, which fires only with plenty of sun *and* rain. Together they form a **layer**: a group of neurons that all read the same inputs.

      Put each neuron's weights in a row of a **matrix** $W$ (a table of numbers) and the biases in a vector $b$:

      $$W = \begin{bmatrix} 0.5 & -1 \\ 1 & 1 \end{bmatrix}, \quad b = \begin{bmatrix} 1 \\ -4 \end{bmatrix}, \quad h = \text{ReLU}(Wx + b)$$

      Row 1 is the picnic neuron: $0.5 \times 2 - 1 \times 1 + 1 = 1$. Row 2 is the rainbow detector: $2 + 1 - 4 = -1$, which ReLU turns into 0. So $h = [1, 0]$; ReLU acts on each entry separately.

      That one line, $h = \text{ReLU}(Wx + b)$, is the whole job of a layer, and graphics chips do millions of these multiply-adds at once. A **neural network** chains layers, so one layer's outputs become the next layer's inputs. The next lesson shows why the ReLU between layers is essential.

      In a trained network, nobody picks names like "picnic" or "rainbow." Training sets the weights, and a unit often responds to a blend of things no one would think to name.
    bridges: []
