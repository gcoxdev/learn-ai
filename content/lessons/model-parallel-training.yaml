    bridges: []
  - id: model-parallel-training.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.model-parallel-training
    markdown: Bubble fractions to compute, a Megatron-style split, a two-machine layout, a slow pipeline stage, and a mixture-of-experts model test whether you can pick the right cut and predict its cost.
    takeaway: |-
      Tensor parallelism slices each layer and needs all-reduces inside it, so it stays within a node. Pipeline parallelism stacks layers and leaves a bubble of (p − 1)/(m + p − 1). Real runs combine them with data parallelism.
  - id: model-parallel-training.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.model-parallel-training
    markdown: |-
      Parallel methods divide different things: examples, tensor operations, layer stages, context positions, or experts. Draw the required transfers to understand the costs of each choice.
