    sizes, and their timing before claiming that adding devices will scale linearly.


    A **node** is a machine that can contain several accelerators. Communication inside that machine and between
    machines can have different speeds. Draw the required transfers on the layer diagram, then ask whether
    the saved computation exceeds the new waiting time.'
