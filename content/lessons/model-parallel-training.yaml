          note: layers 17–24
          col: 0
          row: 2
          tone: accent
        - id: st4
          label: "Stage 4: GPUs 7–8"
          note: layers 25–32
          col: 0
          row: 3
          tone: accent
        - id: peers
          label: Stages 1 and 2
          note: on the 31 other nodes
