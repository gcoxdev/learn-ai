  bridges: []
- id: model-parallel-training.s3
  title: Partition context or experts
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.model-parallel-training
  markdown: Context parallelism distributes sequence positions while communicating the information attention
    needs. Expert parallelism distributes different expert networks and sends routed tokens to their owners.
    Long context and sparse expert models therefore create different communication patterns, even when parameter
    totals look similar.
  text_mode: Context parallelism distributes sequence positions while communicating the information attention
    needs. Expert parallelism distributes different expert networks and sends routed tokens to their owners.
    Long context and sparse expert models therefore create different communication patterns, even when parameter
    totals look similar.
  bridges: []
- id: model-parallel-training.s4
  title: Compose strategies around hardware
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.model-parallel-training
  markdown: 'A real run can combine data, tensor, pipeline, and other parallel dimensions. Frequent communication
    often benefits from fast nearby links; cross-node transfers can dominate. Draw which tensors move, their
    sizes, and their timing before claiming that adding devices will scale linearly.


    A **node** is a machine that can contain several accelerators. Communication inside that machine and between
    machines can have different speeds. Draw the required transfers on the layer diagram, then ask whether
    the saved computation exceeds the new waiting time.'
