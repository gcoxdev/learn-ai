schema_version: 0.2-draft
lesson:
  id: model-parallel-training
  version: 0.4.0-draft
  title: Split a model across devices in different ways
  state: draft
  summary: When one model won't fit on one GPU, you can slice each layer or stack the layers across GPUs. Each choice has a price, and you can calculate it.
  slot: M17.4
  category: learning
  sources:
    - title: "Megatron-LM: Training Multi-Billion Parameter Language Models Using Model Parallelism (Shoeybi et al., 2019)"
      url: https://arxiv.org/abs/1909.08053
    - title: "GPipe: Efficient Training of Giant Neural Networks using Pipeline Parallelism (Huang et al., 2018)"
      url: https://arxiv.org/abs/1811.06965
    - title: "Efficient Large-Scale Language Model Training on GPU Clusters Using Megatron-LM (Narayanan et al., 2021)"
      url: https://arxiv.org/abs/2104.04473
    - title: DeepSeek-V3 Technical Report
      url: https://arxiv.org/abs/2412.19437
objectives:
  - id: objective.model-parallel-training
    version: 2-draft
    statement: Tensor, pipeline, context, and expert parallelism divide different dimensions of model execution; each arrangement introduces specific communication and scheduling costs.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - model-parallel-training.base.v2
      - model-parallel-training.transfer.v2
      - model-parallel-training.calculate
    prerequisites:
      - anyOf:
          - objective.data-parallel-training
      - anyOf:
          - objective.tensor-shape-tracing
scenes:
  - id: model-parallel-training.s1
    title: Slice each layer across GPUs
    type: explanation
    depth: intuition
    objective_refs:
      - objective.model-parallel-training
    markdown: |-
      Data parallelism gives every GPU a full copy of the model, so it can't help when one copy doesn't fit. The team's 7B model needs about 130 GB and each GPU has 80. They need to cut the model itself into pieces. There are two natural cuts: slice every layer, or stack groups of layers on different GPUs.

      **Tensor parallelism** slices every layer. Take the MLP block of a GPT-style transformer layer: $Z = \text{GELU}(XA)\,B$, where $A$ widens each token's vector from 4,096 to 16,384 numbers and $B$ shrinks it back. Megatron-LM (Shoeybi et al., NVIDIA, 2019) split it across two GPUs like this:

      1. Split $A$ **by columns**: GPU 1 gets the first 8,192 output columns, GPU 2 the rest. Each computes its half of $XA$ in full, so it can apply GELU on its own. GELU works one number at a time, so the halves never need to meet.
      2. Split $B$ **by rows** to match: each GPU multiplies its half of the hidden vector by its half of $B$, producing a *partial* $Z$.
      3. One all-reduce adds the two partial results. Every GPU now holds the full $Z$.

      That's one all-reduce in the forward pass and one in the backward pass per block. Attention splits the same way, with whole heads on each GPU. Megatron-LM trained an 8.3-billion-parameter model on 512 GPUs with 8-way tensor parallelism inside each server.

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      d, f, tokens, T = 8, 32, 3, 2        # model width, MLP width, tokens, tensor-parallel GPUs
      X = rng.standard_normal((tokens, d))
      A = rng.standard_normal((d, f))      # first MLP weight
      B = rng.standard_normal((f, d))      # second MLP weight
      gelu = lambda z: 0.5 * z * (1 + np.tanh(0.7978845608 * (z + 0.044715 * z**3)))

      full = gelu(X @ A) @ B               # one GPU does the whole MLP

      A_parts = np.split(A, T, axis=1)     # GPU t gets a block of A's columns...
      B_parts = np.split(B, T, axis=0)     # ...and the matching block of B's rows
      partials = [gelu(X @ A_t) @ B_t for A_t, B_t in zip(A_parts, B_parts)]  # no talking
      tp = sum(partials)                   # the single all-reduce

      print("max difference from one GPU:", np.abs(full - tp).max())
      print("weights per GPU:", A_parts[0].size + B_parts[0].size, "of", A.size + B.size)
      ```

      Set `T = 4` or `T = 8`: the answer still matches to rounding error while each GPU's share of the weights shrinks. The price is two all-reduces per layer in the forward pass (one for attention, one for the MLP) and two more in backward, for every microbatch. So tensor parallelism stays inside one machine, on the fast NVLink connections between its 8 GPUs.
    bridges: []
  - id: model-parallel-training.s2
    title: Stack the layers and mind the bubble
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.model-parallel-training
    markdown: |-
      **Pipeline parallelism** makes the other cut: layers 1–8 on GPU 1, layers 9–16 on GPU 2, and so on. Each GPU passes its output activations to the next, like stations on an assembly line. Only activations at stage boundaries travel, so the traffic is light.

      The catch is waiting. With a whole batch at once, GPU 2 idles until GPU 1 finishes, then GPU 1 idles while the others work. GPipe (Huang et al., Google, 2018) fixed most of this by cutting the batch into $m$ **microbatches** that follow each other down the pipe. Here is a 4-stage pipeline with 4 microbatches (F2 means "forward pass of microbatch 2"):

      | Time slot | 1 | 2 | 3 | 4 | 5 | 6 | 7 |
      | --- | --- | --- | --- | --- | --- | --- | --- |
      | GPU 1 (layers 1–8) | F1 | F2 | F3 | F4 | · | · | · |
      | GPU 2 (layers 9–16) | · | F1 | F2 | F3 | F4 | · | · |
      | GPU 3 (layers 17–24) | · | · | F1 | F2 | F3 | F4 | · |
      | GPU 4 (layers 25–32) | · | · | · | F1 | F2 | F3 | F4 |

      Each GPU works 4 of 7 slots. The idle dots, while the pipe fills and drains, are the **pipeline bubble**. The backward pass runs the same pattern in reverse, with the same idle share.

      :::papers Bubble fraction for a GPipe schedule
      With $p$ stages and $m$ microbatches, the forward sweep takes $m + p - 1$ slots and each GPU is busy for $m$ of them, so the idle fraction is

      $$\text{bubble} = \frac{p-1}{m+p-1}$$

      For $p = 4, m = 4$: 3/7 ≈ 42.9%, as in the table. GPipe's authors found the bubble becomes small once $m \ge 4p$. Narayanan et al. (2021) write the same cost as $(p-1)/m$, the bubble time relative to the useful time.
      :::

      :::predict Keep 4 stages but use 16 microbatches. What fraction is bubble?
      3/(16 + 3) = 3/19 ≈ 15.8%. At 32 microbatches it's 3/35 ≈ 8.6%. More microbatches help, but each one is either smaller (fewer tokens per weight read, lower arithmetic intensity) or the global batch grows.
      :::

      ```python run
      def schedule(p, m):
          """GPipe forward sweep: p stages, m microbatches, one time slot per stage."""
          slots = m + p - 1
          for stage in range(p):
              row = [f"F{t - stage + 1}" if 0 <= t - stage < m else "." for t in range(slots)]
              print(f"GPU {stage + 1}: " + " ".join(f"{c:>3}" for c in row))
          idle = p * slots - p * m
          print(f"bubble: {idle} of {p * slots} slots = {idle / (p * slots):.1%};"
                f" (p-1)/(m+p-1) = {(p - 1) / (m + p - 1):.1%}\n")

      schedule(p=4, m=4)
      schedule(p=4, m=16)
      ```

      Try `p=8, m=8`: nearly half the time is bubble. Then find the smallest `m` that gets `p=4` down to 10% or less (it's 27).
    bridges: []
  - id: model-parallel-training.s3
    title: Split the sequence or the experts
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.model-parallel-training
    markdown: |-
      Two more cuts matter for particular models.

      **Context parallelism** splits a long sequence's positions across GPUs, so a 128,000-token sequence's activations don't all live on one GPU. Attention still needs every query to see the keys and values it's allowed to attend to, so GPUs pass key and value blocks among themselves.

      **Expert parallelism** applies to mixture-of-experts models, where each token is routed to a few of many expert MLPs. Different experts live on different GPUs, and every layer sends each token to the GPUs holding its chosen experts and back. The mixture-of-experts module covers this all-to-all traffic in detail.
    bridges: []
  - id: model-parallel-training.s4
    title: Combine them into 3-D parallelism
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.model-parallel-training
    markdown: |-
      Real runs combine the cuts, placing each where its traffic fits the hardware. A **node** is one machine; the team has 32 nodes of 8 GPUs. Inside a node, GPUs talk over NVLink; between nodes, over a slower network. Here is one layout for the team, called **3-D parallelism** because it uses three cuts at once:

      | Cut | Size | Traffic | Where it runs |
      | --- | ---: | --- | --- |
      | Tensor | 2 | Two all-reduces per layer forward, two backward | Inside a node |
      | Pipeline | 4 | Activations at 3 stage boundaries | Inside a node |
      | Data | 32 | One gradient all-reduce per step | Across nodes |

      2 × 4 × 32 = 256 GPUs. Each node holds one complete replica, split 2-way by tensor and 4-way by pipeline, so each GPU keeps 1/8 of the model states: 112 GB ÷ 8 = 14 GB. Only the gradient exchange crosses the slower network, and the data-parallel lesson showed how to hide it.

      :::mixup "Twice the GPUs, half the time."
      Each cut adds a cost: tensor parallelism adds all-reduces inside every layer, pipelines add a bubble, and data parallelism adds a gradient exchange and a larger global batch. Before scaling, write down which tensors move, how big they are, and over which link.
      :::
    diagram:
      caption: One node of the team's 3-D layout. Four pipeline stages of two tensor-parallel GPUs each hold one full replica; each stage all-reduces gradients with the same stage on the 31 other nodes, which work on different data.
      description: Stage 1 (GPUs 1–2, layers 1–8) sends activations to stage 2 (GPUs 3–4, layers 9–16), which sends to stage 3 (GPUs 5–6, layers 17–24), which sends to stage 4 (GPUs 7–8, layers 25–32). Within each stage the two GPUs split every layer by tensor parallelism over NVLink. Dashed arrows run from stages 1 and 2 to a box for those same stages on the 31 other nodes, and from stages 3 and 4 to a box for theirs. Every stage all-reduces its gradients over the network with its counterparts, as data parallelism.
      nodes:
        - id: st1
          label: "Stage 1: GPUs 1–2"
          note: layers 1–8
          col: 0
          row: 0
          tone: accent
        - id: st2
          label: "Stage 2: GPUs 3–4"
          note: layers 9–16
          col: 0
          row: 1
          tone: accent
        - id: st3
