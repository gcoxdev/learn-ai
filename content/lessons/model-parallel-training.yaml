lesson:
  id: model-parallel-training
  version: 0.2.0-draft
  title: Split a model across devices in different ways
  state: draft
  summary: Split either one calculation or a sequence of layers across devices, then account for the waiting
    this creates.
  slot: M17.4
  category: learning
  sources:
  - title: Megatron-LM
    url: https://arxiv.org/abs/1909.08053
  - title: GPipe
    url: https://arxiv.org/abs/1811.06965
  - title: DeepSeek-V3 Technical Report
    url: https://arxiv.org/abs/2412.19437
objectives:
- id: objective.model-parallel-training
  version: 1-draft
  statement: Tensor, pipeline, context, and expert parallelism divide different dimensions of model execution;
    each arrangement introduces specific communication and scheduling costs.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - model-parallel-training.base
  - model-parallel-training.transfer
  prerequisites:
  - anyOf:
    - objective.data-parallel-training
  - anyOf:
    - objective.tensor-shape-tracing
scenes:
- id: model-parallel-training.s1
  title: Split an operation or a sequence of layers
  type: explanation
  depth: intuition
  objective_refs:
  - objective.model-parallel-training
  markdown: 'Tensor parallelism partitions large tensor operations, such as matrix output columns, across devices
    and combines needed results. Pipeline parallelism places successive layer groups on different devices.
    Neither is simply a larger data-parallel batch: one example’s computation can span several devices.


    A **tensor** is a multidimensional number array. In tensor parallelism, devices share pieces of one operation.
    In pipeline parallelism, they own different consecutive stages. For a two-layer model, splitting the columns
    of one layer''s weight matrix is different from putting the whole first layer on one device and the second
    on another.'
  text_mode: 'Tensor parallelism partitions large tensor operations, such as matrix output columns, across
    devices and combines needed results. Pipeline parallelism places successive layer groups on different devices.
    Neither is simply a larger data-parallel batch: one example’s computation can span several devices.


    A **tensor** is a multidimensional number array. In tensor parallelism, devices share pieces of one operation.
    In pipeline parallelism, they own different consecutive stages. For a two-layer model, splitting the columns
    of one layer''s weight matrix is different from putting the whole first layer on one device and the second
    on another.'
  bridges: []
- id: model-parallel-training.s2
  title: Fill a pipeline with microbatches
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.model-parallel-training
  markdown: 'Imagine layers A and B on separate devices. After device A finishes microbatch one, it can process
    microbatch two while device B processes one. Start-up, drain, and dependency gaps create pipeline bubbles.
    Smaller microbatches can improve scheduling but increase overhead or reduce kernel efficiency.


    Assume each stage takes one time unit. At time 1, A processes microbatch 1 while B waits. At time 2, A
    processes 2 and B processes 1. After A finishes the last microbatch, B still has work to drain. These idle
    start/end periods are **bubbles**. More devices do not remove the data dependencies.'
  text_mode: 'Imagine layers A and B on separate devices. After device A finishes microbatch one, it can process
    microbatch two while device B processes one. Start-up, drain, and dependency gaps create pipeline bubbles.
    Smaller microbatches can improve scheduling but increase overhead or reduce kernel efficiency.


