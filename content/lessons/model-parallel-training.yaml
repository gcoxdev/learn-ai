schema_version: 0.2-draft
lesson:
  id: model-parallel-training
  version: 0.1.0-draft
  title: Split a model across devices in different ways
  state: draft
  summary: Tensor, pipeline, context, and expert parallelism divide different dimensions of model execution; each
    arrangement introduces specific communication and scheduling costs.
  slot: M17.4
  category: learning
  minutes: 12
  sources:
  - title: Megatron-LM
    url: https://arxiv.org/abs/1909.08053
  - title: GPipe
    url: https://arxiv.org/abs/1811.06965
  - title: DeepSeek-V3 Technical Report
    url: https://arxiv.org/abs/2412.19437
objectives:
- id: objective.model-parallel-training
  version: 1-draft
  statement: Tensor, pipeline, context, and expert parallelism divide different dimensions of model execution; each
    arrangement introduces specific communication and scheduling costs.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - model-parallel-training.base
  - model-parallel-training.transfer
  prerequisites:
  - anyOf:
    - objective.data-parallel-training
  - anyOf:
    - objective.tensor-shape-tracing
scenes:
- id: model-parallel-training.s1
  title: Split an operation or a sequence of layers
  type: explanation
  depth: intuition
  objective_refs:
  - objective.model-parallel-training
  markdown: 'Tensor parallelism partitions large tensor operations, such as matrix output columns, across devices
    and combines needed results. Pipeline parallelism places successive layer groups on different devices. Neither
    is simply a larger data-parallel batch: one example’s computation can span several devices.'
  text_mode: 'Tensor parallelism partitions large tensor operations, such as matrix output columns, across devices
    and combines needed results. Pipeline parallelism places successive layer groups on different devices. Neither
    is simply a larger data-parallel batch: one example’s computation can span several devices.'
  bridges: []
- id: model-parallel-training.s2
  title: Fill a pipeline with microbatches
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.model-parallel-training
  markdown: Imagine layers A and B on separate devices. After device A finishes microbatch one, it can process microbatch
    two while device B processes one. Start-up, drain, and dependency gaps create pipeline bubbles. Smaller microbatches
    can improve scheduling but increase overhead or reduce kernel efficiency.
  text_mode: Imagine layers A and B on separate devices. After device A finishes microbatch one, it can process
    microbatch two while device B processes one. Start-up, drain, and dependency gaps create pipeline bubbles. Smaller
    microbatches can improve scheduling but increase overhead or reduce kernel efficiency.
  bridges: []
- id: model-parallel-training.s3
  title: Partition context or experts
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.model-parallel-training
  markdown: Context parallelism distributes sequence positions while communicating the information attention needs.
    Expert parallelism distributes different expert networks and sends routed tokens to their owners. Long context
    and sparse expert models therefore create different communication patterns, even when parameter totals look
    similar.
  text_mode: Context parallelism distributes sequence positions while communicating the information attention needs.
    Expert parallelism distributes different expert networks and sends routed tokens to their owners. Long context
    and sparse expert models therefore create different communication patterns, even when parameter totals look
    similar.
  bridges: []
- id: model-parallel-training.s4
  title: Compose strategies around hardware
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.model-parallel-training
  markdown: A real run can combine data, tensor, pipeline, and other parallel dimensions. Frequent communication
    often benefits from fast nearby links; cross-node transfers can dominate. Draw which tensors move, their sizes,
    and their timing before claiming that adding devices will scale linearly.
  text_mode: A real run can combine data, tensor, pipeline, and other parallel dimensions. Frequent communication
    often benefits from fast nearby links; cross-node transfers can dominate. Draw which tensors move, their sizes,
    and their timing before claiming that adding devices will scale linearly.
  bridges: []
- id: model-parallel-training.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.model-parallel-training
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: model-parallel-training.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.model-parallel-training
  markdown: Tensor, pipeline, context, and expert parallelism divide different dimensions of model execution; each
