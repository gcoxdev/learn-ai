assessment_families:
  - id: model-parallel-training.base
    objective_ref: objective.model-parallel-training
    task: base
    response_type: single_choice
    points: 1
    hint: 'Fill a pipeline with microbatches: trace the inputs, operation, and result before choosing.'
    remediation_scene: model-parallel-training.s2
    variants:
      - id: model-parallel-training.base.1
        prompt: Splitting matrix output columns is which strategy?
        options:
          - id: a
            text: Tensor parallelism
          - id: b
            text: Only data parallelism
          - id: c
            text: Only dataset shuffling
        answer: a
        feedback: Tensor parallelism partitions an operation’s tensors.
        retired: true
      - id: model-parallel-training.base.2
        prompt: What is a pipeline bubble?
        options:
          - id: b
            text: An additional learned layer
          - id: c
            text: A duplicate training label
          - id: a
            text: An idle interval caused by pipeline dependencies or filling/draining
        answer: a
        feedback: Scheduling leaves some stages waiting.
        retired: true
  - id: model-parallel-training.transfer
    objective_ref: objective.model-parallel-training
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Compose strategies around hardware: trace the inputs, operation, and result before choosing.'
    remediation_scene: model-parallel-training.s4
    variants:
      - id: model-parallel-training.transfer.1
        prompt: Sending token activations to devices holding selected experts is what?
        options:
          - id: b
            text: Pure data replication
          - id: c
            text: Tokenizer training
          - id: a
            text: Expert parallelism
        answer: a
        feedback: Expert ownership determines routed activation transfers.
        retired: true
      - id: model-parallel-training.transfer.2
        prompt: Does doubling devices guarantee halved runtime?
        options:
          - id: c
            text: Only parameter count matters
          - id: a
            text: No; communication and scheduling can limit scaling
          - id: b
            text: 'Yes'
        answer: a
        feedback: Additional hardware changes both capacity and coordination costs.
        retired: true
  - id: model-parallel-training.base.v2
    objective_ref: objective.model-parallel-training
    task: base
    response_type: single_choice
    points: 1
    hint: Tensor parallelism splits the matrices inside a layer and must add partial results every layer; pipeline parallelism splits the stack of layers and idles while the pipe fills and drains.
    remediation_scene: model-parallel-training.s2
    variants:
      - id: model-parallel-training.base.v2.1
        prompt: In a Megatron-style tensor-parallel MLP, why is the first weight matrix split by columns rather than by rows?
        options:
          - id: b
            text: Column blocks take less memory than row blocks of the same matrix
          - id: a
            text: Each GPU gets complete values for its columns, so GELU runs locally
          - id: c
            text: Row splitting would require each GPU to store extra bias terms
        answer: a
        feedback: A column split gives each GPU finished pre-activations for its share of the hidden units, and GELU acts on each number separately, so no communication is needed until the row-split second matrix. A row split would leave partial sums, and GELU of a partial sum is wrong. Both blocks hold the same number of weights.
      - id: model-parallel-training.base.v2.2
        prompt: A GPipe-style pipeline has 4 stages and processes 4 microbatches per step. What fraction of each GPU's time is bubble?
        options:
          - id: c
            text: 1/4, one slot per stage
          - id: b
            text: 3/4, all but one stage
          - id: a
            text: 3/7, three idle slots of seven
        answer: a
        feedback: The sweep takes m + p − 1 = 7 slots and each GPU works m = 4 of them, so (p − 1)/(m + p − 1) = 3/7 ≈ 43% is idle.
      - id: model-parallel-training.base.v2.3
        prompt: With the number of pipeline stages fixed, which change shrinks the bubble fraction?
        options:
          - id: a
            text: Splitting each step's batch into more microbatches
          - id: b
            text: Moving to a faster link between neighboring stages
          - id: c
            text: Adding more stages so that each holds fewer layers
        answer: a
        feedback: The bubble is (p − 1)/(m + p − 1), so raising m shrinks it. Adding stages raises p and makes it worse, and a faster link speeds up transfers but doesn't remove the fill-and-drain idle time.
      - id: model-parallel-training.base.v2.4
        prompt: Which kind of parallelism puts an all-reduce inside every transformer layer, which is why it's normally kept within one machine?
        options:
          - id: b
            text: Pipeline parallelism
          - id: c
            text: Data parallelism
          - id: a
            text: Tensor parallelism
        answer: a
        feedback: Tensor parallelism must add partial results in every MLP and attention block, forward and backward. Pipelines send activations only at stage boundaries, and data parallelism exchanges gradients once per step.
  - id: model-parallel-training.transfer.v2
    objective_ref: objective.model-parallel-training
    task: transfer
    response_type: single_choice
    points: 1
    hint: Match each cut to its traffic. Put the chattiest cut on the fastest links, and remember that a pipeline runs at the pace of its slowest stage.
    remediation_scene: model-parallel-training.s4
    variants:
      - id: model-parallel-training.transfer.v2.1
        prompt: A lab has two machines of 4 GPUs each, fast links inside each machine and a slow network between them. It wants 4-way tensor and 2-way pipeline parallelism. Which placement fits?
        options:
          - id: a
            text: Each tensor-parallel group inside one machine; the two pipeline stages on different machines
          - id: b
            text: Each tensor-parallel group spread across both machines; each pipeline stage inside one
          - id: c
            text: Alternate the machines within every group so both kinds of traffic cross the network
        answer: a
        feedback: Tensor parallelism all-reduces inside every layer, so it needs the fast in-machine links. A pipeline sends only boundary activations, which the slow network can carry.
      - id: model-parallel-training.transfer.v2.2
        prompt: A team trains on 128,000-token documents. Even with tensor parallelism, one sequence's activations don't fit on a GPU. Which technique spreads the positions of a single sequence across GPUs?
        options:
          - id: c
            text: Data parallelism, giving each GPU a different document
          - id: a
            text: Context parallelism, passing key and value blocks around
          - id: b
            text: Pipeline parallelism, giving each GPU different layers
        answer: a
        feedback: Context parallelism splits the sequence dimension and exchanges keys and values so attention still sees every allowed pair. Data parallelism still needs a whole sequence per GPU, and a pipeline stage still holds all positions for its layers.
      - id: model-parallel-training.transfer.v2.3
        prompt: A mixture-of-experts model has 64 expert MLPs per layer, and each token is sent to 2 of them. Which arrangement places experts on different GPUs and routes tokens to them?
        options:
          - id: b
            text: Tensor parallelism, slicing each expert's matrices by columns
          - id: c
            text: Pipeline parallelism, placing different expert layers on each GPU
          - id: a
            text: Expert parallelism, with all-to-all traffic that sends tokens out and back
        answer: a
        feedback: Expert parallelism assigns whole experts to GPUs and ships each token to the GPUs of its chosen experts, then back. Slicing experts or stacking layers doesn't match the per-token routing.
      - id: model-parallel-training.transfer.v2.4
        prompt: In a 4-stage pipeline, stage 3 holds the heaviest layers and takes 1.5 times as long per microbatch as the other stages. What happens to the pipeline?
        options:
          - id: c
            text: The other stages run at full speed while only stage 3's work lags behind
          - id: a
            text: Every stage ends up moving at stage 3's pace, so the layers need rebalancing
          - id: b
            text: The faster stages automatically take over some of stage 3's layers
        answer: a
        feedback: Microbatches can't leave stage 3 faster than it processes them, so stage 4 waits for it and stages 1–2 soon stall too. A running pipeline doesn't move layers between stages; the team must reassign layers so each stage takes about the same time.
  - id: model-parallel-training.calculate
    objective_ref: objective.model-parallel-training
    task: base
    response_type: numeric
    points: 1
    hint: "Bubble fraction = (p − 1)/(m + p − 1), with p stages and m microbatches; give percentages to one decimal place. For 3-D layouts, total GPUs = tensor × pipeline × data."
    remediation_scene: model-parallel-training.s2
    absolute_tolerance: 0.2
    variants:
      - id: model-parallel-training.calculate.1
        prompt: A pipeline has 4 stages and 16 microbatches per step. What percentage of the time is bubble?
        answer: 15.8
        feedback: 3 ÷ (16 + 3) = 3/19 ≈ 15.8%.
      - id: model-parallel-training.calculate.2
        prompt: A pipeline has 8 stages and 8 microbatches per step. What percentage of the time is bubble?
        answer: 46.7
        feedback: 7 ÷ (8 + 7) = 7/15 ≈ 46.7%. With as many stages as microbatches, nearly half the time is idle.
      - id: model-parallel-training.calculate.3
        prompt: A pipeline has 2 stages and 8 microbatches per step. What percentage of the time is bubble?
        answer: 11.1
        feedback: 1 ÷ (8 + 1) = 1/9 ≈ 11.1%.
      - id: model-parallel-training.calculate.4
        prompt: A pipeline has 4 stages. What is the smallest number of microbatches that brings the bubble down to 10% or less?
        answer: 27
        feedback: You need 3/(m + 3) ≤ 0.1, so m + 3 ≥ 30 and m ≥ 27. With 26 microbatches the bubble is 3/29 ≈ 10.3%.
      - id: model-parallel-training.calculate.5
        prompt: A 512-GPU run uses 8-way tensor parallelism and 4-way pipeline parallelism. How many data-parallel replicas does it have?
        answer: 16
        feedback: 512 ÷ (8 × 4) = 16 replicas, each spread over 32 GPUs.
      - id: model-parallel-training.calculate.6
        prompt: A 13-billion-parameter model needs 16 bytes per parameter of model states. Split 4-way by tensor and 2-way by pipeline, how many GB of model states does each GPU hold?
        answer: 26
        feedback: 13 billion × 16 = 208 GB in total, divided across 4 × 2 = 8 GPUs = 26 GB each. Data parallelism doesn't divide it further; every replica holds its own copy.
