lesson:
  id: model-parallel-training
  version: 0.3.0-draft
  title: Split a model across devices in different ways
  state: draft
  summary: Split either one calculation or a sequence of layers across devices, then account for the waiting
    this creates.
  slot: M17.4
  category: learning
  sources:
  - title: Megatron-LM
    url: https://arxiv.org/abs/1909.08053
  - title: GPipe
    url: https://arxiv.org/abs/1811.06965
  - title: DeepSeek-V3 Technical Report
    url: https://arxiv.org/abs/2412.19437
objectives:
- id: objective.model-parallel-training
  version: 1-draft
  statement: Tensor, pipeline, context, and expert parallelism divide different dimensions of model execution;
    each arrangement introduces specific communication and scheduling costs.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - model-parallel-training.base
  - model-parallel-training.transfer
  prerequisites:
  - anyOf:
    - objective.data-parallel-training
  - anyOf:
    - objective.tensor-shape-tracing
scenes:
- id: model-parallel-training.s1
  title: Divide a calculation or divide its stages
  type: explanation
  depth: intuition
  objective_refs:
  - objective.model-parallel-training
  markdown: 'A **tensor** is a multidimensional array of numbers. **Tensor parallelism** gives devices pieces
    of one large operation—for example, different output columns of a layer’s matrix multiplication—and combines
    the required results.


    **Pipeline parallelism** assigns consecutive layer groups to different devices. In a two-layer model, one
    device could hold the first layer and another the second. That is different from dividing the first layer’s
    columns between them.


    Both arrangements spread one example’s computation across devices. They introduce communication and dependencies
    as well as more available hardware.'
  text_mode: 'A **tensor** is a multidimensional array of numbers. **Tensor parallelism** gives devices pieces
    of one large operation—for example, different output columns of a layer’s matrix multiplication—and combines
    the required results.


