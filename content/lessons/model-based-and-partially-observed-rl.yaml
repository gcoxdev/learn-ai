assessment_families:
- id: model-based-and-partially-observed-rl.base
  objective_ref: objective.model-based-and-partially-observed-rl
  task: base
  response_type: single_choice
  points: 1
  hint: 'Act under hidden state: trace the inputs, operation, and result before choosing.'
  remediation_scene: model-based-and-partially-observed-rl.s2
  variants:
  - id: model-based-and-partially-observed-rl.base.1
    prompt: Can one system combine model-based planning and model-free value learning?
    options:
    - id: b
      text: 'No'
    - id: c
      text: Only without neural networks
    - id: a
      text: 'Yes'
    answer: a
    feedback: The categories describe mechanisms that can be composed.
  - id: model-based-and-partially-observed-rl.base.2
    prompt: What does a belief state represent?
    options:
    - id: c
      text: Only the next action ID
    - id: a
      text: Uncertainty over hidden states given evidence
    - id: b
      text: The model’s guaranteed conscious beliefs
    answer: a
    feedback: It is an information representation for partial observability.
- id: model-based-and-partially-observed-rl.transfer
  objective_ref: objective.model-based-and-partially-observed-rl
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate model exploitation: trace the inputs, operation, and result before choosing.'
  remediation_scene: model-based-and-partially-observed-rl.s4
  variants:
  - id: model-based-and-partially-observed-rl.transfer.1
    prompt: Why replan after a short executed action segment?
    options:
    - id: c
      text: To avoid receiving any feedback
    - id: a
      text: To incorporate observations and limit accumulated prediction error
    - id: b
      text: To guarantee the model was exact
    answer: a
    feedback: New evidence corrects imagined trajectories.
  - id: model-based-and-partially-observed-rl.transfer.2
    prompt: A plan wins in the learned model but fails in reality. What may have happened?
    options:
    - id: a
      text: The planner exploited model error
    - id: b
      text: The real task must be impossible
    - id: c
      text: Model-based learning never uses data
    answer: a
    feedback: Optimization can find weaknesses in approximate dynamics.
