assessment_families:
  - id: model-based-and-partially-observed-rl.base
    objective_ref: objective.model-based-and-partially-observed-rl
    task: base
    response_type: single_choice
    points: 1
    hint: 'Act under hidden state: trace the inputs, operation, and result before choosing.'
    remediation_scene: model-based-and-partially-observed-rl.s2
    variants:
      - id: model-based-and-partially-observed-rl.base.1
        prompt: Can one system combine model-based planning and model-free value learning?
        options:
          - id: b
            text: 'No'
          - id: c
            text: Only without neural networks
          - id: a
            text: 'Yes'
        answer: a
        feedback: The categories describe mechanisms that can be composed.
        retired: true
      - id: model-based-and-partially-observed-rl.base.2
        prompt: What does a belief state represent?
        options:
          - id: c
            text: Only the next action ID
          - id: a
            text: Uncertainty over hidden states given evidence
          - id: b
            text: The model’s guaranteed conscious beliefs
        answer: a
        feedback: It is an information representation for partial observability.
        retired: true
  - id: model-based-and-partially-observed-rl.transfer
    objective_ref: objective.model-based-and-partially-observed-rl
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate model exploitation: trace the inputs, operation, and result before choosing.'
    remediation_scene: model-based-and-partially-observed-rl.s4
    variants:
      - id: model-based-and-partially-observed-rl.transfer.1
        prompt: Why replan after a short executed action segment?
        options:
          - id: c
            text: To avoid receiving any feedback
          - id: a
            text: To incorporate observations and limit accumulated prediction error
          - id: b
            text: To guarantee the model was exact
        answer: a
        feedback: New evidence corrects imagined trajectories.
        retired: true
      - id: model-based-and-partially-observed-rl.transfer.2
        prompt: A plan wins in the learned model but fails in reality. What may have happened?
        options:
          - id: a
            text: The planner exploited model error
          - id: b
            text: The real task must be impossible
          - id: c
            text: Model-based learning never uses data
        answer: a
        feedback: Optimization can find weaknesses in approximate dynamics.
        retired: true
  - id: model-based-and-partially-observed-rl.base.v2
    objective_ref: objective.model-based-and-partially-observed-rl
    task: base
    response_type: single_choice
    points: 1
    hint: Ask what the agent has learned (values, a policy, or how the world changes) and what it knows about the current state (the state itself, or only a belief).
    remediation_scene: model-based-and-partially-observed-rl.s2
    variants:
      - id: model-based-and-partially-observed-rl.base.v2.1
        prompt: An agent counts that "forward on the rug" reached the dock 16 times out of 20, stores 0.8, and runs value iteration on its stored estimates. What kind of method is this?
        options:
          - id: b
            text: Model-free, because it learned the 0.8 from experience
          - id: a
            text: Model-based, because it plans on its learned transition estimates
          - id: c
            text: A bandit, because it tracks a success rate for one action
        answer: a
        feedback: Learning the model from data doesn't make a method model-free; planning on estimated transitions is what makes it model-based. A bandit ignores how actions change the state, which value iteration relies on.
      - id: model-based-and-partially-observed-rl.base.v2.2
        prompt: Pip's floor sensor reads "tile", and two of the four rooms have tile floors. Why should Pip keep a belief over rooms instead of acting on its latest reading alone?
        options:
          - id: a
            text: The same reading fits several rooms, and past readings help separate them
          - id: b
            text: Sensor readings are too noisy to use, so beliefs should ignore them
          - id: c
            text: A belief lets Pip skip the transition model when it moves
        answer: a
        feedback: One observation leaves the state ambiguous; combining readings over time through the belief update narrows it down. Beliefs use readings rather than ignore them, and the update needs the transition model for the predict step.
      - id: model-based-and-partially-observed-rl.base.v2.3
        prompt: In model predictive control, the planner finds the best 10-step action sequence. What does the agent do next?
        options:
          - id: c
            text: Execute all ten actions, then plan the next ten steps
          - id: b
            text: Execute the actions until the model's prediction fails
          - id: a
            text: Execute only the first action, observe, and plan again
        answer: a
        feedback: MPC commits to one action at a time and replans from the observed state, so model errors are corrected quickly. Executing the whole sequence lets errors compound, and a failed prediction may not be noticed in time.
      - id: model-based-and-partially-observed-rl.base.v2.4
        prompt: Five learned models predict returns of 9, 9, 2, −8 and 8 for plan X and about 6 each for plan Y. Why prefer plan Y?
        options:
          - id: a
            text: X's models disagree wildly, a sign the plan relies on unfamiliar states
          - id: b
            text: X's best prediction is lower than Y's, so X is always the worse plan
          - id: c
            text: Y has more models agreeing, and planners count votes, not returns
        answer: a
        feedback: Disagreement marks regions where the models have little data, which is where planners exploit model errors. X's average (4) is also below Y's. X's best prediction (9) is actually higher, which is what tempts a single-model planner.
  - id: model-based-and-partially-observed-rl.transfer.v2
    objective_ref: objective.model-based-and-partially-observed-rl
    task: transfer
    response_type: single_choice
    points: 1
    hint: Decide whether the trouble is hidden state, a model that is wrong in some region, or a plan that was never checked against new observations.
    remediation_scene: model-based-and-partially-observed-rl.s4
    variants:
      - id: model-based-and-partially-observed-rl.transfer.v2.1
        prompt: A delivery drone's learned model predicts that flying low under a bridge saves two minutes. The drone has never flown under any bridge. What should the planner do?
        options:
          - id: a
            text: Penalize the route for model uncertainty until real data backs it up
          - id: b
            text: Take the route, since the model is the best estimate available
          - id: c
            text: Lengthen the planning horizon so the route is evaluated further
        answer: a
        feedback: The saving comes from a region with no data, exactly where planners exploit model errors. Uncertainty penalties or ensembles steer away until real experience confirms it. A longer horizon compounds the error rather than fixing it.
      - id: model-based-and-partially-observed-rl.transfer.v2.2
        prompt: A poker bot can see its own cards and the betting, but not its opponents' cards. How should it represent its situation?
        options:
          - id: c
            text: Assume the opponents hold the most likely hand and plan as if that were known
          - id: a
            text: Keep a probability over the opponents' possible hands, updated by their bets
          - id: b
            text: Use only the current bet, since earlier bets are already in the past
        answer: a
        feedback: The opponents' cards are hidden state, so the bot needs a belief updated by evidence such as betting. Betting on one guessed hand ignores real uncertainty, and discarding past bets throws away evidence.
      - id: model-based-and-partially-observed-rl.transfer.v2.3
        prompt: A warehouse robot plans a 60-step route with its learned model and follows it without looking again. Halfway through, it hits a pallet that was moved an hour ago. What design change would help most?
        options:
          - id: b
            text: Plan a longer route so that more obstacles are included
          - id: a
            text: Replan every few steps from what the sensors actually show
          - id: c
            text: Retrain the model nightly on the previous day's layout
        answer: a
        feedback: MPC-style replanning uses fresh observations, so a moved pallet causes a detour, not a crash. A longer plan and yesterday's layout both still miss today's change.
      - id: model-based-and-partially-observed-rl.transfer.v2.4
        prompt: A team has a robot that is expensive to run, so it can gather only 500 real trials. Which approach makes the most of that data?
        options:
          - id: a
            text: Learn a dynamics model and practice extra updates on imagined steps
          - id: b
            text: Use pure model-free Q-learning so that no model errors creep in
          - id: c
            text: Collect the trials with a fixed random policy, then stop learning
        answer: a
        feedback: Model-based methods such as Dyna reuse each real trial to train a model, then generate many more imagined updates. Model-free methods usually need far more real experience; the trade-off is watching for model errors.
  - id: model-based-and-partially-observed-rl.calculate
    objective_ref: objective.model-based-and-partially-observed-rl
    task: base
    response_type: numeric
    points: 1
    hint: Multiply each state's prior belief by the probability of the observation in that state, then divide each product by the sum of all products.
    remediation_scene: model-based-and-partially-observed-rl.s2
    absolute_tolerance: 0.005
    variants:
      - id: model-based-and-partially-observed-rl.calculate.1
        prompt: Pip is in the Kitchen or the Hall with belief 0.5 each. The floor sensor reads "tile" with probability 0.9 in the Kitchen and 0.1 in the Hall. It reads "tile". What is the new belief that Pip is in the Kitchen?
        answer: 0.9
        feedback: Products are 0.5 × 0.9 = 0.45 and 0.5 × 0.1 = 0.05. Their sum is 0.5, so Kitchen = 0.45 / 0.5 = 0.9.
      - id: model-based-and-partially-observed-rl.calculate.2
        prompt: Pip's belief is Kitchen 0.2, Hall 0.8. The floor sensor reads "tile" with probability 0.9 in the Kitchen and 0.1 in the Hall. It reads "tile". What is the new belief that Pip is in the Kitchen? Give three decimal places.
        answer: 0.692
        feedback: Products are 0.2 × 0.9 = 0.18 and 0.8 × 0.1 = 0.08. Kitchen = 0.18 / 0.26 ≈ 0.692. The reading favors the Kitchen, but the strong prior for the Hall keeps it from reaching 0.9.
      - id: model-based-and-partially-observed-rl.calculate.3
        prompt: Four rooms have floors tile, wood, wood, tile, and Pip's belief is 0.25 for each. The sensor is right 90% of the time and reads "wood". What is the new belief for the first wood room?
        answer: 0.45
        feedback: Wood rooms get 0.25 × 0.9 = 0.225; tile rooms get 0.25 × 0.1 = 0.025. The sum is 0.5, so each wood room gets 0.225 / 0.5 = 0.45.
      - id: model-based-and-partially-observed-rl.calculate.4
        prompt: A door is locked with belief 0.7. A rattle is heard with probability 0.8 when the handle is tried on a locked door and 0.3 on an unlocked one. Pip hears a rattle. What is the new belief that the door is locked? Give three decimal places.
        answer: 0.862
        feedback: Products are 0.7 × 0.8 = 0.56 and 0.3 × 0.3 = 0.09. Locked = 0.56 / 0.65 ≈ 0.862.
      - id: model-based-and-partially-observed-rl.calculate.5
        prompt: Pip's belief over four rooms in a row is Kitchen 0.45, Hall 0.05, Landing 0.05, Bathroom 0.45. It drives forward, which moves it one room on with probability 0.8 and leaves it in place with probability 0.2. Before any new reading, what is the predicted belief for the Hall?
        answer: 0.37
        feedback: The Hall receives 0.8 × 0.45 from the Kitchen plus 0.2 × 0.05 from staying put, 0.36 + 0.01 = 0.37. This is the predict step; no correction has happened yet.
