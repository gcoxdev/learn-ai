objectives:
  - id: objective.model-based-and-partially-observed-rl
    version: 2-draft
    statement: Model-based RL uses estimated dynamics for planning or imagined experience; partial observability requires history or belief state, and model uncertainty grows across hypothetical rollouts.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - model-based-and-partially-observed-rl.base.v2
      - model-based-and-partially-observed-rl.transfer.v2
      - model-based-and-partially-observed-rl.calculate
    prerequisites:
      - anyOf:
          - objective.world-models-and-predictive-representations
      - anyOf:
          - objective.mdps-and-bellman-equations
scenes:
  - id: model-based-and-partially-observed-rl.s1
    title: Learn the map, then plan on it
    type: explanation
    depth: intuition
    objective_refs:
      - objective.model-based-and-partially-observed-rl
    markdown: |-
      In the TD lesson, Pip learned values straight from experience. It could instead keep counts: of 20 times it drove forward on the Rug, it reached the Dock 16 times. So its estimate is $\hat{p}(\text{Dock} \mid \text{Rug}, \text{forward}) = 16/20 = 0.8$. Estimates like this, for every transition and reward, form a learned **model** of the environment. Pip can then run value iteration from the MDP lesson on its own model, without taking another real step.

      That's **model-based RL**: learn how the world works, then plan or practice inside that model. Everything in the previous three lessons was **model-free**.

      | | Model-free (Q-learning, PPO) | Model-based |
      | --- | --- | --- |
      | Learns | Values or a policy directly | How states change and what rewards follow |
      | Real experience needed | A lot | Usually much less |
      | Computation per real step | Small | Large (planning) |
      | Main risk | Slow learning | Planning on a wrong model |

      The two mix freely. In Sutton's **Dyna** (around 1990), every real step also updates the model, and the agent runs extra Q-learning updates on imagined steps drawn from it. Modern agents such as Dreamer learn a model of the world from images and train their policy mostly on imagined rollouts. The world-models lesson describes how such predictive models are built.
    bridges: []
  - id: model-based-and-partially-observed-rl.s2
    title: Track where you probably are
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.model-based-and-partially-observed-rl
    markdown: |-
      Someone picks Pip up and sets it down in a dark corridor with four rooms in a row: Kitchen (tile floor), Hall (wood), Landing (wood), Bathroom (tile). Pip's floor sensor is right 90% of the time. It has no idea which room it's in.

      The true state, Pip's room, is hidden; Pip only gets observations. That's a **partially observable MDP (POMDP)**. Acting well requires tracking a **belief**: a probability for each possible state, updated after every action and observation.

      :::papers The belief update
      $$b'(s') = \eta\; O(o \mid s') \sum_{s} P(s' \mid s, a)\, b(s)$$

      First *predict*: push the old belief $b$ through the transition model $P$ for the action taken. Then *correct*: multiply by $O(o \mid s')$, the probability of the observation in each state. Finally, $\eta$ rescales everything to sum to 1. It's Bayes' rule with a motion step, the same predict-and-correct cycle as the state estimation lesson.
      :::

      Pip starts at 0.25 per room and reads "tile". There's no move yet, so only the correct step applies. Tile rooms get $0.25 \times 0.9 = 0.225$; wood rooms get $0.25 \times 0.1 = 0.025$. These add to 0.5, so dividing by 0.5 gives Kitchen 0.45, Hall 0.05, Landing 0.05, Bathroom 0.45. One reading can't tell the two tile rooms apart.

      :::predict Pip now drives forward (its wheels succeed 80% of the time) and reads "wood". Which room is most likely?
      The Hall, at about 0.76. If Pip was in the Kitchen, forward most likely took it to the Hall, a wood room. If it was in the Bathroom, there's no room further on, so it stayed on tile, and the "wood" reading counts against that. The history of readings, not the latest one, pins Pip down. Run the code to check.
      :::

      ```python run
      import numpy as np

      rooms = ["Kitchen", "Hall", "Landing", "Bathroom"]
      floor = ["tile", "wood", "wood", "tile"]
      p_correct = 0.9                        # the floor sensor is right 90% of the time

      def move_forward(belief):
          new = np.zeros(4)
          for s, p in enumerate(belief):     # wheels succeed 80% of the time
              new[min(s + 1, 3)] += 0.8 * p
              new[s] += 0.2 * p
          return new

      def observe(belief, reading):
          likelihood = np.array([p_correct if f == reading else 1 - p_correct for f in floor])
          unnormalized = likelihood * belief
          return unnormalized / unnormalized.sum()      # dividing by the sum is the eta

      belief = np.full(4, 0.25)              # Pip has just been carried: no idea where it is
      belief = observe(belief, "tile")
      print("reads tile:       ", np.round(belief, 3))
      for reading in ["wood", "wood"]:
          belief = observe(move_forward(belief), reading)
          print(f"moves, reads {reading}:", np.round(belief, 3))
      ```

      After a second move and another "wood", the Landing leads at 0.767. Try `p_correct = 0.6`: after the same three readings no room passes 0.5, and the Bathroom even edges ahead of the Landing.
    bridges: []
  - id: model-based-and-partially-observed-rl.s3
    title: Plan a little, act a little, replan
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.model-based-and-partially-observed-rl
    markdown: |-
      A learned model is never perfect, and small errors compound over a long imagined future. **Model predictive control (MPC)** keeps plans short and fresh:

      1. From the current state, use the model to score many candidate action sequences a few steps long.
      2. Execute only the *first* action of the best sequence.
      3. Observe what actually happened, and plan again from there.

      :::papers MPC in one line
      $$a^*_{t:t+H-1} = \arg\max_{a_{t:t+H-1}} \sum_{k=0}^{H-1} \gamma^k\, \hat{r}(s_{t+k}, a_{t+k}) \quad \text{with} \quad s_{t+k+1} = \hat{f}(s_{t+k}, a_{t+k})$$

      $\hat{f}$ is the learned model of how states change, $\hat{r}$ the learned reward, and $H$ the planning horizon. Only $a^*_t$ is executed.
      :::

      In the doorway, Pip's model scores the rug route at 6.2 and the sofa route at 3.1 (the returns from the first lesson). It drives one square toward the rug, then looks again. The owner has dropped a sock on the rug, and the model now predicts Pip will get tangled there. Replanning from the new state picks the sofa route. A plan followed blindly from the doorway would have driven into the sock.

      Replanning costs computation, but it turns model errors from disasters into detours. Chemical plants have run on MPC for decades, and many robots use it today.
    bridges: []
  - id: model-based-and-partially-observed-rl.s4
    title: When the planner finds the model's mistakes
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.model-based-and-partially-observed-rl
    markdown: |-
      A planner is an optimizer, and optimizers find loopholes. Pip's model was trained on floors Pip has driven, and Pip has never driven near the top of the stairs. The model has no data there, so it happily predicts that a shortcut along the stair edge reaches the dock in two moves. The planner loves that shortcut. The real stairs disagree.

      :::mixup "A plan that scores well in the model will score well in reality."
      The planner searches for whatever the model rates highest, and that's often exactly where the model is most wrong. Imagined success is a prediction about the world, and it needs checking against real outcomes, especially in states the model has rarely seen.
      :::

      A common defense is to train several models, an **ensemble**, on different samples of Pip's data and check where they disagree. For the stair shortcut, five models predict returns of 9, 9, 2, −8 and 8: an average of 4, with wild disagreement. For the rug route, all five predict about 6.2. A planner that scores each plan by the ensemble average, or better, subtracts a penalty for disagreement, takes the rug. Shorter horizons and collecting real data in the uncertain region help too.

      :::story Planning with a model at superhuman level
      AlphaGo (2016) planned with tree search, but it was given a perfect model: the rules of Go. DeepMind's MuZero (published in *Nature* in 2020) learned its own model, predicting only what planning needs (rewards, values, and policies), and matched AlphaZero's superhuman play in Go, chess and shogi while also learning Atari games.
      :::
    bridges: []
  - id: model-based-and-partially-observed-rl.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.model-based-and-partially-observed-rl
    markdown: Update a few beliefs by hand, then decide how a delivery drone, a poker bot, and a warehouse planner should handle hidden state and imperfect models.
    takeaway: |-
      A learned model lets an agent plan, but a planner will exploit the model's mistakes, so replan often and distrust uncertain regions. When the state is hidden, keep a belief and update it with Bayes' rule after every move and observation.
  - id: model-based-and-partially-observed-rl.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.model-based-and-partially-observed-rl
    markdown: |-
      A learned model can help a planner imagine consequences. When the state is partly hidden, history or a belief distribution helps track what the latest observation leaves out.
