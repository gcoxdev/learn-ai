schema_version: 0.2-draft
lesson:
  id: model-based-and-partially-observed-rl
  version: 0.1.0-draft
  title: Plan with learned dynamics when the full state is hidden
  state: draft
  summary: Model-based RL uses estimated dynamics for planning or imagined experience; partial observability requires
    history or belief state, and model uncertainty grows across hypothetical rollouts.
  slot: M24.7
  category: learning
  minutes: 12
  sources:
  - title: World Models
    url: https://arxiv.org/abs/1803.10122
  - title: DreamerV3
    url: https://arxiv.org/abs/2301.04104
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.model-based-and-partially-observed-rl
  version: 1-draft
  statement: Model-based RL uses estimated dynamics for planning or imagined experience; partial observability requires
    history or belief state, and model uncertainty grows across hypothetical rollouts.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - model-based-and-partially-observed-rl.base
  - model-based-and-partially-observed-rl.transfer
  prerequisites:
  - anyOf:
    - objective.world-models-and-predictive-representations
  - anyOf:
    - objective.mdps-and-bellman-equations
scenes:
- id: model-based-and-partially-observed-rl.s1
  title: Learn a model of consequences
  type: explanation
  depth: intuition
  objective_refs:
  - objective.model-based-and-partially-observed-rl
  markdown: A model-based learner estimates transitions, rewards, or latent dynamics from experience. It can plan
    with those estimates or generate imagined training trajectories. Model-free and model-based elements can coexist,
    so classify the actual computation rather than treating the labels as exclusive identities.
  text_mode: A model-based learner estimates transitions, rewards, or latent dynamics from experience. It can plan
    with those estimates or generate imagined training trajectories. Model-free and model-based elements can coexist,
    so classify the actual computation rather than treating the labels as exclusive identities.
  bridges: []
- id: model-based-and-partially-observed-rl.s2
  title: Act under hidden state
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.model-based-and-partially-observed-rl
  markdown: A robot camera may not reveal an object behind a wall. A partially observable formulation distinguishes
    observations from the underlying state. A history-based policy, recurrent memory, or belief distribution can
    summarize evidence about what is hidden.
  text_mode: A robot camera may not reveal an object behind a wall. A partially observable formulation distinguishes
    observations from the underlying state. A history-based policy, recurrent memory, or belief distribution can
    summarize evidence about what is hidden.
  bridges: []
- id: model-based-and-partially-observed-rl.s3
  title: Replan after new observations
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.model-based-and-partially-observed-rl
  markdown: Model predictive control considers candidate action sequences, executes a short part, then replans using
    new information. This can limit the damage from long-horizon prediction error. It still depends on model quality,
    candidate coverage, and the reliability of constraints and state estimates.
  text_mode: Model predictive control considers candidate action sequences, executes a short part, then replans
    using new information. This can limit the damage from long-horizon prediction error. It still depends on model
    quality, candidate coverage, and the reliability of constraints and state estimates.
  bridges: []
- id: model-based-and-partially-observed-rl.s4
  title: Evaluate model exploitation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.model-based-and-partially-observed-rl
  markdown: A planner may discover action sequences that look rewarding only because the learned model is wrong.
    Ensembles, uncertainty penalties, shorter horizons, and additional data can help but require testing. Compare
    imagined success with actual environment outcomes and inspect out-of-distribution states.
  text_mode: A planner may discover action sequences that look rewarding only because the learned model is wrong.
    Ensembles, uncertainty penalties, shorter horizons, and additional data can help but require testing. Compare
    imagined success with actual environment outcomes and inspect out-of-distribution states.
  bridges: []
- id: model-based-and-partially-observed-rl.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.model-based-and-partially-observed-rl
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: model-based-and-partially-observed-rl.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.model-based-and-partially-observed-rl
  markdown: Model-based RL uses estimated dynamics for planning or imagined experience; partial observability requires
    history or belief state, and model uncertainty grows across hypothetical rollouts.
  text_mode: Model-based RL uses estimated dynamics for planning or imagined experience; partial observability requires
