lesson:
  id: model-based-and-partially-observed-rl
  version: 0.4.0-draft
  title: Plan with learned dynamics when the full state is hidden
  state: draft
  summary: Pip wakes up after being carried to an unknown room. Learn how an agent can build its own map, keep track of where it probably is, and replan as the evidence comes in.
  slot: M24.7
  category: learning
  sources:
    - title: "Reinforcement Learning: An Introduction, 2nd edition, chapter 8 (Sutton & Barto, 2018)"
      url: http://incompleteideas.net/book/the-book-2nd.html
    - title: "World Models (Ha & Schmidhuber, 2018)"
      url: https://arxiv.org/abs/1803.10122
    - title: "Mastering Diverse Domains through World Models (DreamerV3; Hafner et al., 2023)"
      url: https://arxiv.org/abs/2301.04104
    - title: "Mastering Atari, Go, chess and shogi by planning with a learned model (MuZero)"
      url: https://arxiv.org/abs/1911.08265
