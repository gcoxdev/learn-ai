objectives:
  - id: objective.building-with-decision-models
    version: 1-draft
    statement: A decision model's probabilities let code choose when to act. A threshold on the top probability trades automation rate against the errors among automated messages, a cascade sends uncertain cases to a costlier model, fan-out asks several small questions in one call, and audits and slice monitoring catch drift that the gate cannot see.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - building-with-decision-models.base
      - building-with-decision-models.transfer
      - building-with-decision-models.calculate
    prerequisites:
      - anyOf:
          - objective.calibrated-decision-training
scenes:
  - id: building-with-decision-models.s1
    title: The model says what; your gate says whether to act
    type: explanation
    depth: intuition
    objective_refs:
      - objective.building-with-decision-models
    markdown: |-
      At 8:02 a message reaches Tally: *"Brake lever snapped on my ride, I want my deposit back."* Tally's decision model scores a list of six answers: billing, bookings, repairs, safety, other topic (a real topic this desk doesn't handle) and not enough information (too vague to place). It returns a **probability** for each, a number from 0 to 1, and the six add up to 1:

      | Answer | Probability |
      | --- | ---: |
      | Billing | 0.03 |
      | Bookings | 0.02 |
      | Repairs | 0.50 |
      | Safety | 0.40 |
      | Other topic | 0.03 |
      | Not enough information | 0.02 |

      The largest of these, repairs at 0.50, is the **top probability**. Should software send this message to repairs by itself? Probably not. The model is nearly split between repairs and safety, and the message carries two real concerns, a danger and a refund request. TypeSafe's Jev documentation puts the general idea in one line: the answer tells you *what*, and a measure of certainty tells you *whether to act*.

      That's **top-probability routing**. Code compares the top probability with a **threshold** (also called a gate), a number you choose. At or above it, the system acts on its own. Below it, the message goes to a person or to a stronger model. Tally adds a rule that puts safety first: if the probability of safety is 0.20 or more, the message goes to the safety queue, whatever else it is. The refund request travels with it as a separate flag. (Every Tally number in this lesson is invented.)

      Some providers also return a field called **confidence**, and it isn't the top probability. TypeSafe documents Choice confidence as $(p_{max} - 1/n) / (1 - 1/n)$, where $p_{max}$ is the top probability and $n$ is the number of answers. It rescales so that an even split scores 0 and certainty scores 1. For the message above, $n = 6$ and $p_{max} = 0.50$, so confidence is $(0.50 - 0.167) / 0.833 = 0.40$. A top probability of 0.74 over five answers gives a confidence of 0.675.

      :::predict A new message gets a top probability of 0.91 over the same six answers. Does it clear a gate of 0.90?
      On the top probability, yes. On TypeSafe's Choice confidence, no: (0.91 − 1/6) ÷ (5/6) = 0.892, just under 0.90. The same number on a gate means different things for the two quantities, so write down which one your gate reads. Neither is a measured chance that the action will succeed. This lesson gates on the top probability.
      :::

      :::mixup "A top probability of 0.90 means this answer is 90% likely to be right."
      That's true only if the model is calibrated, meaning its 0.90s are right about nine times in ten, and only on messages like the ones it was checked on. Even then it describes a group of messages, not this one. What a gate needs is the error rate among the messages it will automate, measured on your own labelled messages.
      :::
  - id: building-with-decision-models.s2
    title: Choose the threshold with a table and a price list
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.building-with-decision-models
    markdown: |-
      Tally audits 20,000 messages and groups them by the model's top probability. These invented numbers have a calibrated model's shape: higher top probability, more often right.

      | Top-probability band | Messages per day | Model is right |
      | --- | ---: | ---: |
      | 0.95 to 1.00 | 10,400 | 98.5% |
      | 0.90 to 0.95 | 3,600 | 93% |
      | 0.70 to 0.90 | 3,800 | 78% |
      | below 0.70 | 2,200 | 52% |

      **Threshold 0.90.** The top two bands are automated: 14,000 messages, 70% of the day (the **automation rate**). Errors: 10,400 × 1.5% = 156 and 3,600 × 7% = 252, so 408 wrong out of 14,000, an **error rate on automated messages** of 2.9%. People read the other 6,000.

      **Threshold 0.70.** Now 17,800 are automated (89%). The extra band adds 3,800 × 22% = 836 errors, so 1,244 of 17,800 are wrong: 7.0%. People read only 2,200.

      Lowering a threshold can never reduce how many messages are automated. Whether the error rate rises depends on whether a higher top probability really goes with being right more often. In this table it does, and that is something to confirm on your own audit rather than assume.

      Say a person costs \$0.50 per message and a wrong automated action costs \$5 (a refund, an apology, a lost customer). Both are invented, and so is the assumption that a person never errs. One price for every wrong action is also a simplification: a misrouted safety message costs far more than a misrouted billing question, so a real desk would set a stricter gate for the costly routes.

      :::predict Which threshold costs less per message?
      Threshold 0.90. It costs 6,000 × \$0.50 + 408 × \$5 = \$5,040, or \$0.252 per message. Threshold 0.70 costs 2,200 × \$0.50 + 1,244 × \$5 = \$7,320, or \$0.366. The extra 3,800 automated messages save \$1,900 of review but add 836 errors, so they pay off only if a wrong action costs under \$1,900 ÷ 836, about \$2.27.
      :::

      Cost isn't the only limit. Say Tally's staff can read 4,500 messages a day. At 0.90 the queue is 6,000, so 1,500 messages wait until tomorrow, and the cost table above doesn't charge for that delay. The program prints it.

      ```python run
      import numpy as np

      # Tally, one day: 20,000 messages in four top-probability bands (invented numbers)
      low     = np.array([0.95, 0.90, 0.70, 0.00])    # band floors
      count   = np.array([10400, 3600, 3800, 2200])   # messages per band
      correct = np.array([0.985, 0.93, 0.78, 0.52])   # share the model gets right
      REVIEWERS_PER_DAY = 4500                        # invented: messages the staff can read in a day

      def route(threshold):
          auto = low >= threshold
          n_auto = count[auto].sum()
          errors = (count[auto] * (1 - correct[auto])).sum()
          n_human = count.sum() - n_auto
          # assumes people never err: an invented simplification
          cost = (count.sum() * 0.00002 + n_human * 0.50 + errors * 5.00) / count.sum()
          print(f"threshold {threshold:.2f}: automated {n_auto / count.sum():.0%}, "
                f"errors on automated {errors / n_auto:.1%}, "
                f"to humans {n_human}, cost per message ${cost:.4f}")
          if n_human > REVIEWERS_PER_DAY:
              print(f"  queue of {n_human} exceeds capacity {REVIEWERS_PER_DAY}: "
                    f"{n_human - REVIEWERS_PER_DAY} messages wait until tomorrow")

      route(0.90)
      route(0.70)

      # Cascade: decision model first, LLM on the messages under 0.90
      frac_llm = count[low < 0.90].sum() / count.sum()
      cost = 0.00002 + frac_llm * 0.004
      latency = 0.3 + frac_llm * 2.0
      print(f"cascade: {frac_llm:.0%} go to the LLM, blended cost ${cost:.5f}, "
            f"mean latency {latency:.2f} s (LLM alone: $0.00400, 2.00 s)")
      ```

      Match the first two result lines to the hand work. Then change the error price `5.00` to `2.00`: threshold 0.70 becomes cheaper (\$0.1794 against \$0.1908).

      :::papers Naming the two numbers
      Selective classification (Geifman and El-Yaniv, 2017) names these numbers. For threshold $t$, the **coverage** is the share of messages with top probability $\ge t$, and the **selective risk** is the error rate among them. At $t = 0.90$: coverage 14,000 ÷ 20,000 = 0.70, selective risk 408 ÷ 14,000 = 0.029. Sweeping $t$ from 1 to 0 traces the whole trade-off curve.
      :::
    bridges: []
  - id: building-with-decision-models.desk
    title: Run the help desk, then change the traffic
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.building-with-decision-models
    figure:
      kind: help-desk
      caption: A fixed sample of 200 invented Tally messages. Move the threshold and the two prices, then add 40 messages in a new language.
      description: The sample holds 200 ordinary messages, 74% answered correctly, with a mean top probability of 0.775. At a threshold of 0.60 the desk automates 171 messages, 34 of them wrongly, and reviews 29, for a cost of 354.5 with a wrong answer priced at 10 and a review at 0.5. At 0.75 it automates 125 with 14 wrong and reviews 75, for 177.5. At 0.90 it automates 51 with 4 wrong and reviews 149, for 114.5. Switching on 40 shifted messages, which score 0.85 to 0.97 but are right about half the time, changes the 0.90 result to 80 automated, 17 wrong, 160 reviewed and a cost of 250, with 29 shifted messages automated and 13 of those wrong.
    markdown: |-
      The figure replaces Tally's 20,000-message table with a sample small enough to inspect, 200 invented messages. Each has a top probability and a record of whether the model was right. Across the sample the model is right 74% of the time, and its mean top probability is 0.775, so its probabilities roughly match its accuracy.

      Three controls shape what you see. The **auto-handle threshold** sets the top probability at or above which the desk acts alone. The **cost of a wrong automated answer** and the **cost of a human review** set the prices; the defaults are 10 and 0.5. The readouts show how many messages are automated, how many of those are wrong, the review queue, and the total cost.

      With the default prices:

      | Threshold | Automated | Wrong among automated | Review queue | Total cost |
      | --- | ---: | ---: | ---: | ---: |
      | 0.60 | 171 | 34 (19.9%) | 29 | 354.5 |
      | 0.75 | 125 | 14 (11.2%) | 75 | 177.5 |
      | 0.90 | 51 | 4 (7.8%) | 149 | 114.5 |

      A higher threshold shrinks the number of wrong answers and grows the review queue. Which threshold is cheapest depends on the prices. Keep the wrong-answer price at 10 and the cost keeps falling up to 0.95, where only 17 messages are automated and none is wrong (cost 91.5). Zero wrong out of 17 is thin evidence, not proof of a perfect gate. Lower the wrong-answer price to 2 and the cheapest threshold becomes 0.75 (cost 65.5).

      Push the threshold to 0.99 and only 4 messages are automated. A threshold above every message's score would automate none. With nothing automated, the error rate among automated messages is **not measurable**, not 0%.

      :::predict Switch on the 40 shifted messages with the threshold at 0.90. How much does the review queue grow, and what happens to the errors?
      The queue grows only from 149 to 160, because the new messages score between 0.85 and 0.97 and most sail through the gate. The desk now automates 80 of 240 messages (33%, up from 26%), 17 of them wrong, an error rate of 21.3% against 7.8% before. Of the 29 shifted messages that were automated, 13 were wrong. The total cost rises from 114.5 to 250. At a looser threshold of 0.75 it's worse: 165 automated, 33 wrong (20%), cost 367.5.
      :::

      The shifted messages are in a new language the model can't read, yet it stays confident, and it is right only about half the time. Nothing on the desk's dashboard turned red: the automation rate went up, which looks like good news. What does show it is an audit, a person labelling a random sample of automated messages, split by slice such as language. Raising the threshold helps only a little here, because the shifted messages score as high as the ordinary ones.

      This fixture is invented teaching data: the confidences, the accuracy and the shift are chosen to make the mechanism visible. It doesn't describe any real model.
    bridges: []
  - id: building-with-decision-models.s3
    title: Ask many small questions, then let code decide
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.building-with-decision-models
    markdown: |-
      Back to the snapped brake lever. **Fan-out** puts several small typed questions about the same message into one call. Jev's documentation says they're evaluated in parallel and in isolation, so one answer isn't fed into the next question. Tally asks four:

      | Question | Type | Answer |
      | --- | --- | --- |
      | Which route? | choice | repairs 0.50, safety 0.40, others 0.10 together |
      | How urgent (0 to 3)? | score | 0: 0.02, 1: 0.08, 2: 0.30, 3: 0.60 |
      | Refund request? | noul (yes/no) | P(true) = 0.93 |
      | Phishing? | noul | P(true) = 0.01 |

      **Composite scoring** combines several answers into one number in code. Expected urgency is 0 × 0.02 + 1 × 0.08 + 2 × 0.30 + 3 × 0.60 = 2.48, and Tally's priority is that plus 3 × P(safety): 2.48 + 3 × 0.40 = 3.68. The rules are code too, and so is the order they run in. Phishing comes first, then safety, then the gate. The two catch-all answers lead to different actions: *other topic* goes to a general inbox, while *not enough information* triggers a question back to the customer.

      ```python run
      import numpy as np

      routes = ["billing", "bookings", "repairs", "safety", "other topic", "not enough information"]
      route_p = np.array([0.03, 0.02, 0.50, 0.40, 0.03, 0.02])   # choice: where does it go?
      urgency_p = np.array([0.02, 0.08, 0.30, 0.60])             # score: urgency 0-3
      refund_p, phishing_p = 0.93, 0.01                          # two noul answers

      def decide(route_p, phishing_p, gate=0.90):
          top_probability = route_p.max()
          if phishing_p >= 0.50:
              return "quarantine"
          if route_p[3] >= 0.20:                  # safety first: a rule written by people, run by code
              return "human, safety queue"
          top = routes[route_p.argmax()]
          if top == "not enough information":
              return "ask the customer a clarifying question"
          if top_probability >= gate:
              return "auto-route to " + top
          return "human, general triage"

      expected_urgency = (np.arange(4) * urgency_p).sum()
      priority = expected_urgency + 3 * route_p[3]
      print(f"expected urgency {expected_urgency:.2f}, priority {priority:.2f}")
      print("decision:", decide(route_p, phishing_p))
      print("refund flag:", "open refund-review workflow" if refund_p >= 0.90 else "no flag")
      calm = np.array([0.01, 0.01, 0.94, 0.01, 0.02, 0.01])
      print("calm repair message:", decide(calm, 0.01))
      unsure = np.array([0.02, 0.03, 0.05, 0.02, 0.08, 0.80])
      print("one-word message:", decide(unsure, 0.01))

      # a consistency check before combining answers
      def consistent(route_p, urgency_p):
          return not (route_p[3] >= 0.50 and (np.arange(4) * urgency_p).sum() < 1.5)

      print("answers agree:", consistent(route_p, urgency_p))
      print("safety 0.80 but urgency low:", consistent(np.array([0.02, 0.02, 0.1, 0.8, 0.03, 0.03]), np.array([0.6, 0.3, 0.07, 0.03])))
      ```

      The safety rule fires on P(safety) = 0.40, even though repairs has the top probability. That's keeping **code in control**: the model supplies numbers, and people write the policy that reads them. A policy in code can be tested and changed with a one-line edit.

      Classifying a message is not authorizing an action. A high P(true) on "Refund request?" means the customer is *asking* for a refund, not that they qualify for one. Tally's code tags the message and opens a review workflow. Eligibility, identity checks and the payment itself are separate steps with their own rules.

      Two cautions about combining answers. Questions evaluated separately don't have independent errors: one confusing message can mislead all of them at once, so the consistency check in the program flags answers that disagree, such as a high safety probability beside low urgency. And separate answers can't be multiplied into a joint probability.

      :::deeper Why you can't multiply two answers
      Suppose a model says P(eligible for a refund) = 0.80 and P(not fraud) = 0.90. The chance that both hold is at least 0.80 + 0.90 − 1 = 0.70 and at most 0.80. Multiplying gives 0.72, which is right only if the two answers' errors are independent. They often share a cause, such as a garbled message. Code that needs "A and B" should check each answer against its own gate, or ask a separate question about the combination.
      :::

      The same pattern makes a **guardrail**, a check on another system's output. Before an LLM's reply goes out, ask "Does this reply promise a refund?" and hold anything above 0.10 for review.
    bridges: []
  - id: building-with-decision-models.s4
    title: Cheap first, costly only when unsure
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.building-with-decision-models
    markdown: |-
      Tally's LLM isn't free either: about 2 seconds and \$0.004 per message (invented). A **cascade** runs the cheap model on everything and calls the costly one only when the cheap one is unsure. FrugalGPT (Chen, Zaharia and Zou, 2023) studied this idea with a chain of language models.

      Tally's version: the decision model costs about \$0.00002 per message (400 tokens at Jev's published \$0.042 per million input tokens is \$0.0000168, rounded up) and takes about 0.3 seconds, inside the 70 to 500 ms TypeSafe reports. Messages under 0.90 top probability go on to the LLM: 6,000 of 20,000, or 30%.

      - **Blended cost:** \$0.00002 + 0.30 × \$0.004 = \$0.00122 per message, against \$0.004 for the LLM alone.
      - **Mean latency:** 0.3 + 0.30 × 2.0 = 0.9 seconds, against 2.0.

      :::predict A teammate says "every message now takes 0.9 seconds." What's wrong?
      0.9 s is an average. 70% of messages finish in 0.3 s, but the other 30% wait for both models, about 2.3 s. The 95th percentile, which shows how slow the slowest messages are, is about 2.3 s here.
      :::

      Measure the LLM on exactly the hard cases it receives, and expect some to end at a person anyway.

      The 2 seconds and \$0.004 are Tally's invented numbers for a chat model writing a free reply. A chat model can also be told to return only a schema-valid label (OpenAI's Structured Outputs guide documents this for JSON schemas), which can be much shorter and cheaper than a free reply. Treat it as a third candidate in the cascade comparison. Schema validity, decision quality, uncertainty and runtime cost are four separate questions, and each needs its own measurement.
    diagram:
      caption: Tally's cascade. Every message meets the cheap model first, and the gate decides how far it travels.
      description: A message goes into the decision model. The decision model's answer goes to a top-probability gate. If the top probability is at or above 0.90, the message is routed automatically. If it is below 0.90, it goes to the LLM. If the LLM is still unsure, the message goes to a human, shown with a dashed arrow.
      nodes:
        - id: msg
          label: New message
          col: 0
          row: 1
        - id: dm
          label: Decision model
          note: about 0.3 s, $0.00002
          col: 1
          row: 1
          tone: accent
        - id: gate
          label: Top-probability gate
          note: threshold 0.90
          col: 2
          row: 1
          tone: warn
        - id: auto
          label: Route automatically
          note: 70% of messages
          col: 3
          row: 0
          tone: data
        - id: llm
          label: LLM
          note: about 2 s, $0.004
          col: 3
          row: 2
        - id: human
          label: Human reviewer
          col: 3
          row: 3
          tone: muted
      edges:
        - from: msg
          to: dm
        - from: dm
          to: gate
        - from: gate
          to: auto
          label: at or above 0.90
        - from: gate
          to: llm
          label: below 0.90 (30%)
        - from: llm
          to: human
          label: still unsure
          dashed: true
    bridges: []
  - id: building-with-decision-models.s5
    title: "Watch the gate: drift moves your numbers"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.building-with-decision-models
    markdown: |-
      In week one, 70% of Tally's messages clear the 0.90 gate. By week nine, after the shop starts renting e-scooters, only 52% do. Customers now write about things the model never saw, so its probabilities may mean less than they did. Two cheap checks catch this, as in the lesson on production drift:

      1. **Track the share above the gate** every day. A fall from 70% to 52% is a loud signal by itself. (The help desk figure showed the opposite trap: new messages that stay confident push the share up.)
      2. **Audit a random sample.** A person labels 100 automated messages a day. Last month's error rate was 2.9%, so about 3 wrong is normal. Seven wrong is not: the sampling noise is about $\sqrt{0.029 \times 0.971 / 100} \approx 1.7$ points, and 7% sits 2.4 of those above 2.9%.

      When the audit fails, **diagnose before you refit**. Several different things could have changed:

      - the traffic: new topics, or a language the model doesn't support;
      - the labels or the question wording, so "correct" means something new;
      - the input, such as truncated messages;
      - the ranking: the model no longer tells the right answer from the wrong ones;
      - the calibration: it still ranks well, but its probabilities are too high or too low.

      **Temperature scaling**, dividing the model's scores by one fitted number, can help with the last problem only. Guo and colleagues (2017) showed it works well on many classifiers, but a single number can't restore a distinction the model has lost, and it can't tell Spanish messages from English ones. In the meantime the safe response may be to **suspend automation** for the affected slice, send it to people, and fit a new gate only after fresh labelled messages are in.

      :::story Confident, and wrong on a script it can't read
      Laya's model card reports that its English checkpoint collapses on non-Latin scripts: Khmer scores 0.000 accuracy at a mean confidence of 0.952. The card's answer is a router that detects the script before inference and sends such text to a multilingual model. A recent preprint by Liu (arXiv 2609.33401, revised September 29, 2026) evaluated four named System One configurations on agent-security tasks and reported that strong overall results can hide concentrated failures, where attacks are confidently classified as safe. It's one preprint with a specific scope, but it shows the same pattern: look at slices, not only the average.
      :::

      :::try Rerun the table after drift
      In the first program, set the band counts to `[7200, 3200, 5600, 4000]` and the "right" rates to `[0.95, 0.88, 0.70, 0.45]`. At threshold 0.90, automation falls to 52% and errors on automated messages rise from 2.9% to 7.2%. At 0.70 the errors reach 15.2%. Which threshold would you choose now, and what would you check first?
      :::
    bridges: []
  - id: building-with-decision-models.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.building-with-decision-models
    markdown: Tally's gate, a clinic, a bank cascade, a phishing filter, a help desk with new traffic and a drifting audit test whether you can set a threshold, price a cascade and keep policy in code.
    takeaway: |-
      Let the model's answer say what and your gate say whether to act, and pick the threshold from audited data and real costs. Keep policy in code, send unsure cases to people or a costlier model, and audit by slice, because a confident model can be wrong on traffic it has never seen.
  - id: building-with-decision-models.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.building-with-decision-models
    markdown: |-
      Act where the model's top probability clears a gate you chose from audited data, escalate where it doesn't, and keep auditing.
