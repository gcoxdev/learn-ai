lesson:
  id: building-with-decision-models
  version: 0.4.0-draft
  title: "Build with decisions: confidence routing, fan-out, and cascades"
  state: draft
  summary: Tally gets 20,000 messages a day and a model that says how sure it is. Set a confidence gate, compare two thresholds in dollars, and send only the unsure cases to a slower, costlier model.
  slot: M38.5
  category: learning
  archetype: mechanism
