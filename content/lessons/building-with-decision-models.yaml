    objective_ref: objective.building-with-decision-models
    task: base
    response_type: single_choice
    points: 1
    hint: Name the three numbers a gate trades off, the share automated, the error rate among those automated, and what a human review and a wrong action each cost. Then see which one a change moves, and whether a rate has anything to divide by.
    remediation_scene: building-with-decision-models.s2
    variants:
      - id: building-with-decision-models.base.1
        prompt: Tally's gate at 0.90 sends 6,000 of 20,000 messages to people. A manager proposes 0.70 to shrink that queue. What is the main trade?
        options:
          - id: b
            text: Fewer messages are automated, but each one is more accurate
          - id: a
            text: More are automated, so check errors among the newly automated
          - id: c
            text: The same errors happen, but they happen faster
        answer: a
        feedback: Lowering a threshold cannot reduce how many messages are automated, so the queue shrinks. Whether the error rate among automated messages rises depends on whether higher top probabilities really go with being right more often. That held in Tally's audit (78% right in the new band), and an audit of the newly automated messages is how you confirm it. Fewer automated messages would come from raising the threshold.
      - id: building-with-decision-models.base.2
        prompt: At a 0.90 gate on the top probability, a message gets repairs 0.50, safety 0.40, billing 0.03, other topic 0.03, bookings 0.02 and not enough information 0.02. What happens to it, with no other rules?
        options:
          - id: c
            text: It goes to repairs with a warning flag attached
          - id: b
            text: It goes to repairs automatically, because that is the top pick
          - id: a
            text: It goes to a person, because 0.50 is below 0.90
        answer: a
        feedback: The gate compares the top probability, 0.50, with the threshold. Being the top pick is not enough, and a gate has no half-way setting, so nothing is auto-routed with a flag.
      - id: building-with-decision-models.base.3
        prompt: Why does Tally's cascade send only the messages under 0.90 to the LLM?
        options:
          - id: a
            text: It pays the LLM's cost only where the cheap model is unsure
          - id: c
            text: The cheap model's probabilities can be trusted only below 0.90
          - id: b
            text: The LLM reads short messages faster than the decision model
        answer: a
        feedback: A cascade saves money because most messages never reach the costly model. The top probability is useful at every level, and the decision model is the faster one on every message.
      - id: building-with-decision-models.base.4
        prompt: Tally's rule "if P(safety) is 0.20 or more, go to the safety queue" sits in code, not in a fifth model question. What is the main reason?
        options:
          - id: b
            text: Models cannot answer yes/no questions about routing
          - id: c
            text: A fifth question would make every call about ten times slower
          - id: a
            text: A rule in code can be read, tested and changed in one edit
        answer: a
        feedback: Keeping policy in code makes it visible and easy to adjust, while the model only supplies probabilities. A noul question is a normal primitive, and one more question in the same call costs little time.
      - id: building-with-decision-models.base.5
        prompt: Over two months, the share of messages above Tally's 0.90 top-probability gate falls from 70% to 52%. What is the best first step?
        options:
          - id: c
            text: Treat it as fine, since fewer automated messages are safer
          - id: a
            text: Have people label a random sample of recent messages
          - id: b
            text: Lower the threshold until the share is back at 70%
        answer: a
        feedback: A fresh labelled sample shows whether accuracy moved and, if so, where. Lowering the threshold to restore the share would let uncertain answers through without checking, and a falling share may mean the model no longer understands the traffic.
      - id: building-with-decision-models.base.6
        prompt: A cascade's cheap model takes 0.3 s, the LLM 2 s, and 30% of messages escalate. A teammate says every message now takes 0.9 s. What is wrong with that?
        options:
          - id: b
            text: Escalated messages take only 2 s, because the cheap call is cached
          - id: c
            text: The average should be 0.3 × 2 = 0.6 s
          - id: a
            text: 0.9 s is the average, and escalated messages wait about 2.3 s
        answer: a
        feedback: Escalated messages pay for both calls, 0.3 + 2.0 = 2.3 s, and the 70% that stay on the fast path take 0.3 s. Their average is 0.9 s, but the slowest messages are what users notice. Multiplying the two latencies has no meaning here.
      - id: building-with-decision-models.base.7
        prompt: On the help-desk sample of 200 messages, a gate is set so high that no message clears it. What can you say about the error rate among automated messages?
        options:
          - id: b
            text: It is 0%, because no automated answer was wrong
          - id: a
            text: It cannot be measured, because nothing was automated
          - id: c
            text: It equals the model's overall error rate on the sample
        answer: a
        feedback: An error rate is wrong answers divided by automated answers, and with nothing automated that division has no value. Reporting 0% would suggest a perfect gate that was never tested. The overall error rate describes all 200 messages, not the automated ones.
  - id: building-with-decision-models.transfer
    objective_ref: objective.building-with-decision-models
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what the number is measured on. A rate among automated messages, a blended cost and a drifting audit each have to be checked against labelled data, not assumed.
    remediation_scene: building-with-decision-models.s4
    variants:
      - id: building-with-decision-models.transfer.1
        prompt: A clinic's decision model sorts patient messages into book, reschedule, cancel or other, with a 0.95 gate. It automates 62%, and an audit finds 1% errors. Staff want 80% automated. What should they check first?
        options:
          - id: a
            text: The audited error rate at the lower threshold
          - id: c
            text: Whether next month will bring more patient messages
          - id: b
            text: Whether the model's overall accuracy is above 90%
        answer: a
        feedback: Raising automation means lowering the threshold, and the cost is the error rate among the newly automated messages, which a labelled sample can show. Overall accuracy mixes in the messages people still handle, and message volume does not change the trade.
      - id: building-with-decision-models.transfer.2
        prompt: A bank runs every transaction note through a cheap model at $0.00002 and sends 20% on to an LLM at $0.004. Which expression gives its blended cost per note?
        options:
          - id: c
            text: The average of the two prices, $0.00200
          - id: a
            text: $0.00002 + 0.20 × $0.004
          - id: b
            text: 0.80 × $0.00002 + 0.20 × $0.004
        answer: a
        feedback: Every note meets the cheap model, so its price is paid on all of them, and only the escalated 20% add the LLM's price. Dropping the cheap model's cost on escalated notes forgets that it ran first, and a plain average ignores the 20 to 80 split.
      - id: building-with-decision-models.transfer.3
        prompt: An email filter's phishing question returns P(true) = 0.30 on a message, and the company quarantines at 0.50. The message was phishing. What is the best lesson?
        options:
          - id: b
            text: The 0.30 was wrong, since the message was phishing
          - id: a
            text: Check whether 0.50 suits the cost of a missed phish
          - id: c
            text: Phishing is too hard for a yes/no question
        answer: a
        feedback: A probability of 0.30 means such messages are phishing about three times in ten, so one hit does not make it wrong. The threshold should reflect how costly a miss is, and labelled data can show where to set it.
      - id: building-with-decision-models.transfer.4
        prompt: A support desk audits its automated tickets. Accuracy fell from 97% to 91% over three weeks, while the model's average top probability stayed near 0.96. What is the best next step?
        options:
          - id: c
            text: Ignore it, since the audit sample is too small to show anything
          - id: b
            text: Conclude that probabilities cannot drift, since they come from the same weights
          - id: a
            text: Find what changed, such as topics, language or labels, before refitting anything
        answer: a
        feedback: A top probability of 0.96 no longer means what it did, but the cause matters. Refitting a temperature helps only if the model still ranks answers well and its scale is off. New topics, a new language or changed labels need different fixes, and suspending automation for the affected slice may come first. Probabilities depend on the inputs, so they can drift, and the gap is large enough to act on.
      - id: building-with-decision-models.transfer.5
        prompt: A shop's fan-out call on one message returns refund P(true) = 0.93, phishing P(true) = 0.01 and a top route probability of 0.55. The gate is 0.90. Which action keeps code in control?
        options:
          - id: b
            text: Auto-route it, because the refund probability is high
          - id: a
            text: Tag it as a refund request and send the routing to a person
          - id: c
            text: Use the refund answer to pick the route instead
        answer: a
        feedback: Each question is judged by its own number. The refund tag is high enough to use, and it only marks a request; whether the customer qualifies is a separate check. The route at 0.55 is under the gate. A high answer to one question does not make another one trustworthy.
      - id: building-with-decision-models.transfer.6
        prompt: A help desk's gate at 0.90 automates 51 of 200 messages with 4 wrong. Then 40 messages in a new language arrive, all scoring 0.85 to 0.97. The desk now automates 80 of 240 with 17 wrong. Which check would have caught the problem?
        options:
          - id: b
            text: Watching whether the share of automated messages falls
          - id: c
            text: Refitting the temperature once a month on all messages
          - id: a
            text: Auditing labelled automated messages, split by slice such as language
        answer: a
        feedback: The automated share rose from 26% to 33%, so a falling-share alarm never fired, and the review queue barely grew. Only labelled audits, split by slice, show that errors among automated messages jumped from 7.8% to 21.3%. One temperature fitted on all messages can't separate a language the model misreads from the ones it reads well.
  - id: building-with-decision-models.calculate
    objective_ref: objective.building-with-decision-models
    task: base
    response_type: numeric
    points: 1
    hint: "Work in counts. Automation rate = automated ÷ total. Error rate = wrong ÷ automated. Cascade cost = the cheap price on every message + the escalated share × the costly price."
    remediation_scene: building-with-decision-models.s2
    absolute_tolerance: 0.00005
    variants:
      - id: building-with-decision-models.calculate.1
        prompt: A gate sends 5,000 of 20,000 messages to people. What is the automation rate? Give a decimal.
        answer: 0.75
        feedback: 15,000 are automated, and 15,000 ÷ 20,000 = 0.75. Dividing the 5,000 by 20,000 would give the share sent to people instead.
      - id: building-with-decision-models.calculate.2
        prompt: A gate automates 14,000 messages a day, and the audited error rate among them is 2.5%. How many automated messages are wrong each day?
        answer: 350
        feedback: 14,000 × 0.025 = 350. The error rate applies to the automated messages only, not to all 20,000.
      - id: building-with-decision-models.calculate.3
        prompt: A cascade runs a decision model at $0.00002 per message on every message and sends 25% to an LLM at $0.004. What is the blended cost per message in dollars? Give a decimal.
        answer: 0.00102
        feedback: $0.00002 + 0.25 × $0.004 = $0.00002 + $0.001 = $0.00102. The cheap model's price is paid on all messages.
      - id: building-with-decision-models.calculate.4
        prompt: A cascade's cheap model takes 0.3 s, and 40% of messages go on to an LLM that takes 2 s. What is the mean latency per message in seconds?
        answer: 1.1
        feedback: Everyone pays 0.3 s, and 40% pay 2 s more, so 0.3 + 0.4 × 2 = 1.1 s.
      - id: building-with-decision-models.calculate.5
        prompt: Of 20,000 daily messages, 4,000 go to people at $0.50 each, and 300 automated answers are wrong at $5 each. Ignoring the model's own cost, what is the cost per message in dollars? Give a decimal.
        answer: 0.175
        feedback: People cost 4,000 × $0.50 = $2,000 and errors cost 300 × $5 = $1,500. That is $3,500 across 20,000 messages, or $0.175 each.
      - id: building-with-decision-models.calculate.6
        prompt: A Choice question has 5 options and the top probability is 0.74. Using TypeSafe's confidence formula (p_max − 1/n) ÷ (1 − 1/n), what is the confidence? Give a decimal.
        answer: 0.675
        feedback: 1/n = 0.2, so the top is 0.74 − 0.20 = 0.54 above an even split, and the most it could be is 1 − 0.20 = 0.80. 0.54 ÷ 0.80 = 0.675. The confidence differs from the top probability, so a gate set at 0.74 means different things on each.
      - id: building-with-decision-models.calculate.7
        prompt: A gate sends 6,000 messages a day to people, and the staff can read 4,500 a day. How many messages wait until tomorrow?
        answer: 1500
        feedback: 6,000 − 4,500 = 1,500 messages are left over each day, and the backlog grows daily unless the gate or the staffing changes.
