objectives:
  - id: objective.building-with-decision-models
    version: 1-draft
    statement: A decision model's probabilities let code choose when to act. A confidence threshold trades automation rate against error rate, a cascade sends only uncertain cases to a costlier model, fan-out asks several small questions in one call, and drift monitoring keeps the thresholds honest.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - building-with-decision-models.base
      - building-with-decision-models.transfer
      - building-with-decision-models.calculate
    prerequisites:
      - anyOf:
          - objective.calibrated-decision-training
scenes:
  - id: building-with-decision-models.s1
    title: The model says what; its confidence says whether to act
    type: explanation
    depth: intuition
    objective_refs:
      - objective.building-with-decision-models
    markdown: |-
      At 8:02 a message reaches Tally: *"Brake lever snapped on my ride, I want my deposit back."* A decision model returns a probability for each route: billing 0.04, bookings 0.02, repairs 0.52, safety 0.42. Its top pick is repairs, with a **confidence** of 0.52, the probability it gives its own top choice.

      Should the software send this to repairs by itself? Probably not. The model is nearly split between repairs and safety, and a wrong guess is expensive. TypeSafe's Jev documentation puts it in one line: the answer tells you *what*, and the confidence tells you *whether to act*.

      That's **confidence-gated routing**. Code compares the confidence with a **threshold**, a number you choose. At or above it, the system acts on its own. Below it, the message goes to a person or to a stronger model. (Every Tally number in this lesson is invented.)

      :::mixup "A confidence of 0.90 means the answer is 90% likely to be right."
      That's true only if the model is calibrated, and only on messages like the ones it was checked on. If it says 0.90 on a hundred messages, about ninety should be right. Test that on your own labelled messages.
      :::
  - id: building-with-decision-models.s2
    title: Choose the threshold with a table and a price list
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.building-with-decision-models
    markdown: |-
      Tally audits 20,000 messages and groups them by the model's confidence. These invented numbers have a calibrated model's shape: higher confidence, more often right.

      | Confidence band | Messages per day | Model is right |
      | --- | ---: | ---: |
      | 0.95 to 1.00 | 10,400 | 98.5% |
      | 0.90 to 0.95 | 3,600 | 93% |
      | 0.70 to 0.90 | 3,800 | 78% |
      | below 0.70 | 2,200 | 52% |

      **Threshold 0.90.** The top two bands are automated: 14,000 messages, 70% of the day (the **automation rate**). Errors: 10,400 × 1.5% = 156 and 3,600 × 7% = 252, so 408 wrong out of 14,000, an **error rate on automated messages** of 2.9%. People read the other 6,000.

      **Threshold 0.70.** Now 17,800 are automated (89%). The extra band adds 3,800 × 22% = 836 errors, so 1,244 of 17,800 are wrong: 7.0%. People read only 2,200.

      Say a person costs \$0.50 per message and a wrong automated action costs \$5 (a refund, an apology, a lost customer). Both are invented.

      :::predict Which threshold costs less per message?
      Threshold 0.90. It costs 6,000 × \$0.50 + 408 × \$5 = \$5,040, or \$0.252 per message. Threshold 0.70 costs 2,200 × \$0.50 + 1,244 × \$5 = \$7,320, or \$0.366. The extra 3,800 automated messages save \$1,900 of review but add 836 errors, so they pay off only if a wrong action costs under \$1,900 ÷ 836, about \$2.27.
      :::

      ```python run
      import numpy as np

      # Tally, one day: 20,000 messages in four confidence bands (invented numbers)
      low     = np.array([0.95, 0.90, 0.70, 0.00])    # band floors
      count   = np.array([10400, 3600, 3800, 2200])   # messages per band
      correct = np.array([0.985, 0.93, 0.78, 0.52])   # share the model gets right

      def route(threshold):
          auto = low >= threshold
          n_auto = count[auto].sum()
          errors = (count[auto] * (1 - correct[auto])).sum()
          n_human = count.sum() - n_auto
          cost = (count.sum() * 0.00002 + n_human * 0.50 + errors * 5.00) / count.sum()
          print(f"threshold {threshold:.2f}: automated {n_auto / count.sum():.0%}, "
                f"errors on automated {errors / n_auto:.1%}, "
                f"to humans {n_human}, cost per message ${cost:.4f}")

      route(0.90)
      route(0.70)

      # Cascade: decision model first, LLM on the messages under 0.90
      frac_llm = count[low < 0.90].sum() / count.sum()
      cost = 0.00002 + frac_llm * 0.004
      latency = 0.3 + frac_llm * 2.0
      print(f"cascade: {frac_llm:.0%} go to the LLM, blended cost ${cost:.5f}, "
            f"mean latency {latency:.2f} s (LLM alone: $0.00400, 2.00 s)")
      ```

      Match the first two output lines to the hand work. Then change the error price `5.00` to `2.00`: threshold 0.70 becomes cheaper (\$0.1794 against \$0.1908).

      :::papers Naming the two numbers
      Selective classification (Geifman and El-Yaniv, 2017) names these numbers. For threshold $t$, the **coverage** is the share of messages with confidence $\ge t$, and the **selective risk** is the error rate among them. At $t = 0.90$: coverage 14,000 ÷ 20,000 = 0.70, selective risk 408 ÷ 14,000 = 0.029. Sweeping $t$ from 1 to 0 traces the whole trade-off curve.
      :::
    bridges: []
  - id: building-with-decision-models.s3
    title: Ask many small questions, then let code decide
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.building-with-decision-models
    markdown: |-
      Back to the snapped brake lever. **Fan-out** puts several small typed questions about the same message into one call. Jev's documentation says they're evaluated in parallel and in isolation, so one question can't sway another. Tally asks four:

      | Question | Type | Answer |
      | --- | --- | --- |
      | Which route? | choice | repairs 0.52, safety 0.42 |
      | How urgent (0 to 3)? | score | 0: 0.02, 1: 0.08, 2: 0.30, 3: 0.60 |
      | Refund request? | noul (yes/no) | P(true) = 0.93 |
      | Phishing? | noul | P(true) = 0.01 |

      **Composite scoring** combines several answers into one number in code. Expected urgency is 0 × 0.02 + 1 × 0.08 + 2 × 0.30 + 3 × 0.60 = 2.48, and Tally's priority is that plus 3 × P(safety): 2.48 + 3 × 0.42 = 3.74. The rules are code too:

      ```python run
      import numpy as np

      routes = ["billing", "bookings", "repairs", "safety"]
      route_p = np.array([0.04, 0.02, 0.52, 0.42])        # choice: where does it go?
      urgency_p = np.array([0.02, 0.08, 0.30, 0.60])      # score: urgency 0-3
      refund_p, phishing_p = 0.93, 0.01                   # two noul answers

      def decide(route_p, phishing_p, gate=0.90):
          if phishing_p >= 0.50:
              return "quarantine"
          if route_p[3] >= 0.20:                            # a rule written by people, run by code
              return "human, safety queue"
          if route_p.max() >= gate:
              return "auto-route to " + routes[route_p.argmax()]
          return "human, general triage"

      expected_urgency = (np.arange(4) * urgency_p).sum()
      priority = expected_urgency + 3 * route_p[3]
      print(f"expected urgency {expected_urgency:.2f}, priority {priority:.2f}")
      print("decision:", decide(route_p, phishing_p))
      print("tag refund:", refund_p >= 0.90)
      print("calm repair message:", decide(np.array([0.01, 0.01, 0.97, 0.01]), 0.01))
      ```

      The safety rule fires on P(safety) = 0.42, even though repairs has the top probability. That's keeping **code in control**: the model supplies numbers, and people write the policy that reads them. A policy in code can be tested and changed with a one-line edit.

      The same pattern makes a **guardrail**, a check on another system's output. Before an LLM's reply goes out, ask "Does this reply promise a refund?" and hold anything above 0.10 for review.
    bridges: []
  - id: building-with-decision-models.s4
    title: Cheap first, costly only when unsure
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.building-with-decision-models
    markdown: |-
      Tally's LLM isn't free either: about 2 seconds and \$0.004 per message (invented). A **cascade** runs the cheap model on everything and calls the costly one only when the cheap one is unsure. FrugalGPT (Chen, Zaharia and Zou, 2023) studied this idea with a chain of language models.

      Tally's version: the decision model costs about \$0.00002 per message (400 tokens at Jev's published \$0.042 per million input tokens is \$0.0000168, rounded up) and takes about 0.3 seconds, inside the 70 to 500 ms TypeSafe reports. Messages under 0.90 confidence go on to the LLM: 6,000 of 20,000, or 30%.

      - **Blended cost:** \$0.00002 + 0.30 × \$0.004 = \$0.00122 per message, against \$0.004 for the LLM alone.
      - **Mean latency:** 0.3 + 0.30 × 2.0 = 0.9 seconds, against 2.0.

      :::predict A teammate says "every message now takes 0.9 seconds." What's wrong?
      0.9 s is an average. 70% of messages finish in 0.3 s, but the other 30% wait for both models, about 2.3 s. The 95th percentile, which shows how slow the slowest messages are, is about 2.3 s here.
      :::

      Measure the LLM on exactly the hard cases it receives, and expect some to end at a person anyway.
    diagram:
      caption: Tally's cascade. Every message meets the cheap model first, and the gate decides how far it travels.
      description: A message goes into the decision model. The decision model's answer goes to a confidence gate. If confidence is at or above 0.90, the message is routed automatically. If it is below 0.90, it goes to the LLM. If the LLM is still unsure, the message goes to a human, shown with a dashed arrow.
      nodes:
        - id: msg
          label: New message
          col: 0
          row: 1
        - id: dm
          label: Decision model
          note: about 0.3 s, $0.00002
          col: 1
          row: 1
          tone: accent
        - id: gate
          label: Confidence gate
          note: threshold 0.90
          col: 2
          row: 1
          tone: warn
        - id: auto
          label: Route automatically
          note: 70% of messages
          col: 3
          row: 0
          tone: data
        - id: llm
          label: LLM
          note: about 2 s, $0.004
          col: 3
          row: 2
        - id: human
          label: Human reviewer
          col: 3
          row: 3
          tone: muted
      edges:
        - from: msg
          to: dm
        - from: dm
          to: gate
        - from: gate
          to: auto
          label: at or above 0.90
        - from: gate
          to: llm
          label: below 0.90 (30%)
        - from: llm
          to: human
          label: still unsure
          dashed: true
    bridges: []
  - id: building-with-decision-models.s5
    title: "Watch the gate: drift moves your numbers"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.building-with-decision-models
    markdown: |-
      In week one, 70% of Tally's messages clear the 0.90 gate. By week nine, after the shop starts renting e-scooters, only 52% do. Customers now write about things the model never saw, so its confidence may mean less than it did. Two cheap checks catch this, as in the lesson on production drift:

      1. **Track the share above the gate** every day. A fall from 70% to 52% is a loud signal by itself.
      2. **Audit a random sample.** A person labels 100 automated messages a day. Last month's error rate was 2.9%, so about 3 wrong is normal. Seven wrong is not: the sampling noise is about $\sqrt{0.029 \times 0.971 / 100} \approx 1.7$ points, and 7% sits 2.4 of those above 2.9%.

      When the audit fails, **recalibrate**: refit the temperature on fresh labelled messages, then pick the threshold again from the new table.

      :::try Rerun the table after drift
      In the first program, set the band counts to `[7200, 3200, 5600, 4000]` and the "right" rates to `[0.95, 0.88, 0.70, 0.45]`. At threshold 0.90, automation falls to 52% and errors on automated messages rise from 2.9% to 7.2%. Which threshold would you choose now?
      :::
    bridges: []
  - id: building-with-decision-models.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.building-with-decision-models
    markdown: Tally's gate, a clinic, a bank cascade, a phishing filter and a drifting help desk test whether you can set a threshold, price a cascade and keep policy in code.
    takeaway: |-
      Let the model's answer say what and its confidence say whether to act, and pick the threshold from audited bands and real costs. Send only the unsure cases to the costlier model, keep policy in code, and recalibrate when the audit slips.
  - id: building-with-decision-models.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.building-with-decision-models
    markdown: |-
      Act where the model is confident and escalate where it isn't. Choose the threshold from audited data and costs, and keep checking it.
