schema_version: 0.2-draft
lesson:
  id: flow-matching-and-solvers
  version: 0.1.0-draft
  title: Learn a velocity field and integrate it into samples
  state: draft
  summary: Flow matching learns a time-dependent transport field along chosen probability paths; numerical solvers
    turn that field into samples, with step count, guidance, and evaluation defining the quality-cost tradeoff.
  slot: M22.8
  category: learning
  sources:
  - title: Flow Matching for Generative Modeling
    url: https://arxiv.org/abs/2210.02747
  - title: Score-Based Generative Modeling through SDEs
    url: https://arxiv.org/abs/2011.13456
objectives:
- id: objective.flow-matching-and-solvers
  version: 1-draft
  statement: Flow matching learns a time-dependent transport field along chosen probability paths; numerical solvers
    turn that field into samples, with step count, guidance, and evaluation defining the quality-cost tradeoff.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - flow-matching-and-solvers.base
  - flow-matching-and-solvers.transfer
  prerequisites:
  - anyOf:
    - objective.denoising
  - anyOf:
    - objective.flows-and-energy-models
  - anyOf:
    - objective.dynamics-and-noise
scenes:
- id: flow-matching-and-solvers.s1
  title: Describe movement through sample space
  type: explanation
  depth: intuition
  objective_refs:
  - objective.flow-matching-and-solvers
  markdown: Imagine noise points moving toward a data distribution as time runs from zero to one. A velocity field
    gives a direction and speed at each state and time. Flow matching trains a model against target velocities associated
    with a chosen probability path rather than requiring one universal corruption schedule.
  text_mode: Imagine noise points moving toward a data distribution as time runs from zero to one. A velocity field
    gives a direction and speed at each state and time. Flow matching trains a model against target velocities associated
    with a chosen probability path rather than requiring one universal corruption schedule.
  bridges: []
- id: flow-matching-and-solvers.s2
  title: Trace a simple path
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.flow-matching-and-solvers
  markdown: For a paired noise point x0 and data point x1, a straight illustrative path is x_t = (1-t)x0 + t x1,
    with constant pairwise velocity x1-x0. The learned field averages appropriate conditional targets across training
    pairs. Real recipes can choose other paths and couplings.
  text_mode: For a paired noise point x0 and data point x1, a straight illustrative path is x_t = (1-t)x0 + t x1,
    with constant pairwise velocity x1-x0. The learned field averages appropriate conditional targets across training
    pairs. Real recipes can choose other paths and couplings.
  bridges:
  - dynamics-and-noise
- id: flow-matching-and-solvers.s3
  title: Integrate the learned field
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.flow-matching-and-solvers
  markdown: An Euler step updates x by step_size×predicted_velocity. More sophisticated solvers use additional evaluations
    or adaptive steps. Fewer steps save work but can increase discretization error; learned field error and guidance
    also affect the result. A solver step count is not automatically the same as neural function-evaluation count.
  text_mode: An Euler step updates x by step_size×predicted_velocity. More sophisticated solvers use additional
    evaluations or adaptive steps. Fewer steps save work but can increase discretization error; learned field error
    and guidance also affect the result. A solver step count is not automatically the same as neural function-evaluation
    count.
  bridges: []
- id: flow-matching-and-solvers.s4
  title: Compare generation mechanisms and outcomes
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.flow-matching-and-solvers
  markdown: A feed-forward generator, an ODE solver, and an MCMC chain use different sampling procedures. MCMC relies
    on a chain approaching its target distribution; an ODE method follows a learned transport. Compare diversity,
    conditioning, artifacts, coverage, and runtime rather than judging only a few attractive samples.
  text_mode: A feed-forward generator, an ODE solver, and an MCMC chain use different sampling procedures. MCMC
    relies on a chain approaching its target distribution; an ODE method follows a learned transport. Compare diversity,
    conditioning, artifacts, coverage, and runtime rather than judging only a few attractive samples.
  bridges: []
- id: flow-matching-and-solvers.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.flow-matching-and-solvers
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Flow matching learns a time-dependent transport field along chosen probability paths; numerical solvers
    turn that field into samples, with step count, guidance, and evaluation defining the quality-cost tradeoff.
- id: flow-matching-and-solvers.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.flow-matching-and-solvers
  markdown: Flow matching learns a time-dependent transport field along chosen probability paths; numerical solvers
