schema_version: 0.2-draft
lesson:
  id: nonlinear-embeddings
  version: 0.4.0-draft
  title: Read a data map with care
  state: draft
  summary: A t-SNE map of handwritten digits shows ten neat islands. Learn which parts of that picture you can trust, and which gaps and sizes are just artifacts of the drawing.
  slot: M08.4
  category: learning
  sources:
    - title: An Introduction to Statistical Learning — authors’ materials
      url: https://www.statlearning.com/
    - title: "Visualizing Data using t-SNE (van der Maaten & Hinton, 2008)"
      url: https://www.jmlr.org/papers/v9/vandermaaten08a.html
    - title: "How to Use t-SNE Effectively (Wattenberg, Viégas & Johnson, Distill, 2016)"
      url: https://distill.pub/2016/misread-tsne/
    - title: "UMAP: Uniform Manifold Approximation and Projection (McInnes, Healy & Melville, 2018)"
      url: https://arxiv.org/abs/1802.03426
objectives:
  - id: objective.nonlinear-embeddings
    version: 2-draft
    statement: Nonlinear embeddings and self-organizing maps preserve selected relationships; apparent clusters, distances, and empty spaces in a 2D visualization need careful interpretation.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - nonlinear-embeddings.base.v2
      - nonlinear-embeddings.transfer.v2
      - nonlinear-embeddings.calc.v2
    prerequisites:
      - anyOf:
          - objective.pca-and-factorization
      - anyOf:
          - objective.geometry-and-symmetry
scenes:
  - id: nonlinear-embeddings.s1
    title: 784 numbers on a flat page
    type: explanation
    depth: intuition
    objective_refs:
      - objective.nonlinear-embeddings
    markdown: |-
      The MNIST dataset holds 70,000 handwritten digits, each a 28 × 28 grid of pixel brightnesses: 784 numbers per image. You can't look at 784-dimensional space. But you can ask a computer to give each image just two coordinates and plot it, so that similar images land near each other. Any such list of numbers standing in for an item is an **embedding**; here we want one with only two numbers.

      The PCA lesson's answer, keeping the top two directions, is a flat projection, like a shadow on a wall. That fails when the data lie on a curved surface. Picture a rolled-up poster: two points on neighboring layers of the roll are close in space, but far apart along the poster itself. A shadow stacks the layers on top of each other.

      A **nonlinear embedding** method is free to bend and stretch, so it can unroll the poster. The price is that no flat map keeps every distance, just as no flat map of the globe keeps every distance on Earth. Each method chooses what to keep. The two you'll see everywhere keep **neighborhoods**: who is near whom.
    bridges: []
  - id: nonlinear-embeddings.s2
    title: t-SNE keeps neighbors, not distances
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.nonlinear-embeddings
    markdown: |-
      **t-SNE** (van der Maaten and Hinton, 2008) works in two stages. First, for every image it lists which other images are its close neighbors in the 784-number space, as a set of probabilities that fall off quickly with distance. A setting called **perplexity** controls roughly how many neighbors each point pays attention to; 5 to 50 is typical. Second, it scatters the points on a page and nudges them, step by step, until each point's nearest neighbors on the page match its nearest neighbors in the original space.

      On the page, t-SNE measures closeness with a heavy-tailed curve, so moderately distant points get pushed well apart. That's why its maps show crisp islands with clean gaps. In the 2008 paper, a random sample of 6,000 MNIST digits comes out as ten mostly separate islands, one per digit, with no labels used. **UMAP** (McInnes and colleagues, 2018) builds its neighbor lists differently but makes a similar trade, and it usually runs faster on big datasets.

      | In the plot | What it tells you |
      | --- | --- |
      | Two points side by side | Probably neighbors in the original space |
      | How big or spread out an island is | Little: dense groups get expanded, sparse ones shrunk |
      | The width of a gap between islands | Little: gaps aren't to scale |
      | The axes | Nothing: rotate or flip the map freely |

      :::predict The gap between the 4s and the 9s is small; the gap between the 0s and the 1s is three times larger. Are 0s and 1s three times more different than 4s and 9s?
      You can't tell from the map. t-SNE is scored only on getting each point's near neighbors right, so the space between islands isn't to scale. The small 4-to-9 gap does suggest some 4s have 9s among their neighbors, which fits: a 4 with a closed top looks like a 9. To compare the 0s and 1s, measure distances in the original 784 numbers.
      :::
    bridges:
      - geometry-and-symmetry
  - id: nonlinear-embeddings.s3
    title: A self-organizing map arranges prototypes on a grid
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.nonlinear-embeddings
    markdown: |-
      An older idea, Teuvo Kohonen's **self-organizing map** (1982), builds the map the other way around. It starts with a fixed grid, say 10 × 10 squares, and puts a **prototype** in each square: a made-up example with the same number of features as the data, starting at random values. Then, for each input:

      1. Find the **best-matching unit**, the prototype closest to the input.
      2. Move it part of the way toward the input.
      3. Move its grid neighbors toward the input too, but less.

      In one dimension: the winner is 2, the input is 6, and the learning rate is 0.25, so the winner moves to 2 + 0.25 × (6 − 2) = 3. A grid neighbor at 5 with a smaller rate of 0.1 moves to 5 + 0.1 × (6 − 5) = 5.1. Because neighbors are always dragged along together, prototypes next to each other on the grid end up resembling each other. After many inputs, the grid becomes a map: similar inputs light up nearby squares.

      Keep two spaces apart. The grid says which prototypes are neighbors; each prototype's feature values say which inputs it resembles. Neither the grid's shape nor its size comes from the data. You chose them.
    bridges: []
  - id: nonlinear-embeddings.s4
    title: Treat an island as a question
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.nonlinear-embeddings
    markdown: |-
      You can test how well a map keeps neighbors. For each point, list its 10 nearest neighbors in the original space and its 10 nearest on the map, then count the overlap. If a point keeps 8 of its 10, its neighbor overlap is 0.8. High average overlap means the local picture is trustworthy, even when the gaps and sizes are not.

      :::mixup "The islands on the map are the real categories in the data."
      t-SNE and UMAP can split one smooth group into several islands, especially when each point looks at only a few neighbors. At low perplexity, t-SNE can even draw clumps in pure random noise; Wattenberg and colleagues show this in their 2016 Distill article on reading t-SNE. An island is a pattern worth checking, not a finding.
      :::

      Here's how Lena, a biologist, handles a surprise. Her UMAP of 20,000 blood cells shows a small island no one expected. She reruns it with three settings and three random seeds; the island appears every time. She checks the original data: those cells' nearest neighbors are mostly each other, and they share an unusual gene signature. Only then does she sort those cells in the lab to see whether they are a real cell type. The map told her where to look. The lab test tells her what she found.
    bridges: []
  - id: nonlinear-embeddings.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.nonlinear-embeddings
    markdown: Maps of news articles, customers, and fraud cases, plus a few self-organizing-map updates by hand, test whether you can tell a real pattern from an artifact of the drawing.
    takeaway: |-
      t-SNE and UMAP keep each point's near neighbors and let gaps, sizes, and axes bend. Trust who sits next to whom, and treat every island as a question to check in the original data.
  - id: nonlinear-embeddings.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.nonlinear-embeddings
    markdown: |-
      A two-dimensional map preserves selected relationships from a richer representation. Use visible clusters and gaps to ask questions, then check those questions against the original data.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - nonlinear-embeddings.s1
        - nonlinear-embeddings.s2
        - nonlinear-embeddings.s3
        - nonlinear-embeddings.s4
        - nonlinear-embeddings.check
      gate_refs:
        - gate.core
  scene_aliases:
    nonlinear-embeddings.recap: nonlinear-embeddings.check
assessment_families:
  - id: nonlinear-embeddings.base
    objective_ref: objective.nonlinear-embeddings
    task: base
    response_type: single_choice
    points: 1
    hint: 'Local objectives can reshape global structure: trace the inputs, operation, and result before choosing.'
    remediation_scene: nonlinear-embeddings.s2
    variants:
      - id: nonlinear-embeddings.base.1
        prompt: Can a 2D embedding generally preserve every high-dimensional distance exactly?
        options:
          - id: c
            text: Only if the points are colored
          - id: a
            text: 'No'
          - id: b
            text: Yes, if it uses a modern algorithm
        answer: a
        feedback: Dimensionality reduction usually distorts some relationships.
        retired: true
      - id: nonlinear-embeddings.base.2
        prompt: What is updated in a basic self-organizing map?
        options:
          - id: a
            text: A winning prototype and its grid neighbors
          - id: b
            text: Only the final class labels
          - id: c
            text: Every raw input file
        answer: a
        feedback: Neighborhood updates organize prototype vectors on the chosen grid.
        retired: true
  - id: nonlinear-embeddings.transfer
    objective_ref: objective.nonlinear-embeddings
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Use the plot to ask better questions: trace the inputs, operation, and result before choosing.'
    remediation_scene: nonlinear-embeddings.s4
    variants:
      - id: nonlinear-embeddings.transfer.1
        prompt: Two clusters appear far apart in t-SNE. What should be checked before interpreting the gap?
        options:
          - id: a
            text: Original-space relationships and visualization settings
          - id: b
            text: Only the gap’s pixel width
          - id: c
            text: A claim that the populations cannot overlap
        answer: a
        feedback: A local visualization objective can distort global separations.
        retired: true
      - id: nonlinear-embeddings.transfer.2
        prompt: A different random initialization changes an embedding plot. What is a useful response?
        options:
          - id: b
            text: Treat one chosen plot as uniquely true
          - id: c
            text: Delete every point that moved
          - id: a
            text: Inspect stability across runs and settings
        answer: a
        feedback: Sensitivity is evidence about the representation procedure.
        retired: true
  - id: nonlinear-embeddings.base.v2
    objective_ref: objective.nonlinear-embeddings
    task: base
    response_type: single_choice
    points: 1
    hint: t-SNE and UMAP are scored on keeping each point's near neighbors near. Island sizes, gap widths, and axes aren't part of that score, so they can bend.
    remediation_scene: nonlinear-embeddings.s2
    variants:
      - id: nonlinear-embeddings.base.v2.1
        prompt: In a t-SNE map of customers, island X looks twice as spread out as island Y. What can you conclude about the two groups?
        options:
          - id: a
            text: X's customers vary twice as much as Y's do
          - id: b
            text: Little; t-SNE evens out how dense groups look
          - id: c
            text: X holds about twice as many customers as Y
        answer: b
        feedback: t-SNE expands dense groups and shrinks sparse ones, so the size of an island says little about spread or count. To compare variation, measure it in the original features.
      - id: nonlinear-embeddings.base.v2.2
        prompt: Which relationship from the original space does t-SNE try hardest to keep on the page?
        options:
          - id: a
            text: The exact distance between every pair of points
          - id: b
            text: The directions along which the data vary the most
          - id: c
            text: Which points are each point's close neighbors
        answer: c
        feedback: t-SNE matches each point's near-neighbor probabilities, so local neighborhoods survive while large distances bend. Keeping directions of greatest variance is what PCA does.
      - id: nonlinear-embeddings.base.v2.3
        prompt: You rerun t-SNE with perplexity 50 instead of 5, and the picture changes a lot. What does perplexity control?
        options:
          - id: a
            text: Roughly how many neighbors each point pays attention to
          - id: b
            text: The random seed used to scatter the starting points
          - id: c
            text: The number of clusters the method is asked to find
        answer: a
        feedback: Perplexity sets the effective neighborhood size, so low values emphasize very local structure and high values smoother, broader structure. It isn't the seed, and t-SNE is never told how many clusters to make.
      - id: nonlinear-embeddings.base.v2.4
        prompt: In a self-organizing map, an input arrives and its best-matching unit is found. What happens next?
        options:
          - id: a
            text: The input moves toward the prototype that matched it best
          - id: c
            text: The winning prototype alone moves, and its neighbors stay put
          - id: b
            text: The winner and its grid neighbors move toward the input
        answer: b
        feedback: The winner moves toward the input and its grid neighbors follow by smaller amounts, which is what makes nearby squares resemble each other. The data never move, and moving only the winner would not organize the grid.
      - id: nonlinear-embeddings.base.v2.5
        prompt: Data lie on a surface rolled up like a poster. Why does PCA down to two dimensions give a poor map?
        options:
          - id: a
            text: PCA needs a label for each point before it can project
          - id: c
            text: PCA can only cast a flat shadow, so the layers pile up
          - id: b
            text: PCA keeps only local neighbors and loses the big picture
        answer: c
        feedback: PCA is a flat projection, so points on different layers of the roll land on top of each other. A nonlinear method can unroll it. PCA uses no labels, and it keeps global variance, not local neighbors.
  - id: nonlinear-embeddings.transfer.v2
    objective_ref: objective.nonlinear-embeddings
    task: transfer
    response_type: single_choice
    points: 1
    hint: Treat anything you see on a map as a question. Check it across settings and seeds, and in the original data, before acting on it.
    remediation_scene: nonlinear-embeddings.s4
    variants:
      - id: nonlinear-embeddings.transfer.v2.1
        prompt: 'A UMAP of news-article embeddings shows sports and politics as the two islands farthest apart. A reporter writes, "These are the two most different topics." What should be checked first?'
        options:
          - id: c
            text: The distances between those topics in the original embeddings
          - id: a
            text: The exact pixel width of the gap, measured more carefully
          - id: b
            text: Nothing; UMAP keeps large distances better than t-SNE does
        answer: c
        feedback: Gaps between islands aren't to scale in UMAP or t-SNE, so the claim needs the original distances. Measuring the picture more precisely measures the artifact more precisely.
      - id: nonlinear-embeddings.transfer.v2.2
        prompt: You rerun a t-SNE map with a new random seed, and a small island you had noticed merges into a large one. What is the best response?
        options:
          - id: b
            text: Keep the first map, since it was made before any changes
          - id: a
            text: Treat the island as uncertain and test it across seeds and settings
          - id: c
            text: Keep whichever run shows the larger number of separate islands
        answer: a
        feedback: A pattern that appears in one run and vanishes in another may be an artifact, so check it over several seeds and perplexities and in the original neighbors. Picking a favorite run hides the instability.
      - id: nonlinear-embeddings.transfer.v2.3
        prompt: A t-SNE of card transactions shows a new island. An analyst wants to flag it as a fraud ring. What is the best next step?
        options:
          - id: c
            text: Flag every transaction in the island as fraud straight away
          - id: a
            text: Raise the perplexity until the island disappears from the map
          - id: b
            text: Inspect those transactions' original features and review a sample
        answer: b
        feedback: The island is a lead. Checking the original features and having investigators review examples tells you what it is. Flagging it all treats a picture as proof, and tuning until it vanishes throws the lead away.
      - id: nonlinear-embeddings.transfer.v2.4
        prompt: On average, a map keeps 9 of each point's 10 nearest original neighbors, but the distances between far-apart islands are badly off. What is the fairest summary?
        options:
          - id: b
            text: The map is about 90% accurate, gaps included
          - id: c
            text: Local neighborhoods are trustworthy; the large gaps aren't
          - id: a
            text: The map is unreliable, since some distances are wrong
        answer: c
        feedback: Neighbor overlap measures local structure, which is exactly what t-SNE and UMAP aim to keep. It says nothing about gaps, so 90% doesn't extend to them, and bad gaps don't spoil the good neighborhoods.
  - id: nonlinear-embeddings.calc.v2
    objective_ref: objective.nonlinear-embeddings
    task: base
    response_type: numeric
    points: 1
    hint: A self-organizing-map update is new = old + rate × (input − old). Neighbor overlap is shared neighbors divided by how many you listed.
    remediation_scene: nonlinear-embeddings.s3
    variants:
      - id: nonlinear-embeddings.calc.v2.1
        prompt: A self-organizing map's winning prototype is 4, the input is 12, and the learning rate is 0.25. Where does the winner move?
        answer: 6
        feedback: 4 + 0.25 × (12 − 4) = 4 + 2 = 6.
      - id: nonlinear-embeddings.calc.v2.2
        prompt: A grid neighbor of the winning prototype sits at 10. The input is 4, and the neighbor's learning rate is 0.5. Where does the neighbor move?
        answer: 7
        feedback: 10 + 0.5 × (4 − 10) = 10 − 3 = 7. It moves toward the input, which here means downward.
      - id: nonlinear-embeddings.calc.v2.3
        prompt: A grid neighbor sits at 5, the input is 6, and the neighbor's learning rate is 0.1. Where does it move? Give one decimal place.
        answer: 5.1
        feedback: 5 + 0.1 × (6 − 5) = 5.1. Neighbors move less than the winner because their rate is smaller.
      - id: nonlinear-embeddings.calc.v2.4
        prompt: A point's 5 nearest neighbors in the original space are A, B, C, D, and E. On the map, its 5 nearest are A, C, D, F, and G. What is its neighbor overlap, as a fraction?
        answer: 0.6
        feedback: A, C, and D appear in both lists, so the overlap is 3 / 5 = 0.6.
      - id: nonlinear-embeddings.calc.v2.5
        prompt: A two-feature prototype is (1, 3). The input is (5, 1), and the learning rate is 0.5. What is the prototype's second feature after the update?
        answer: 2
        feedback: Each feature moves separately. The second goes 3 + 0.5 × (1 − 3) = 2; the first goes 1 + 0.5 × (5 − 1) = 3.
    absolute_tolerance: 0.01
