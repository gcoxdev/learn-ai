schema_version: 0.2-draft
lesson:
  id: nonlinear-embeddings
  version: 0.3.0-draft
  title: Read a data map with care
  state: draft
  summary: Use a two-dimensional map to ask questions about data without treating every visible gap as a real
    boundary.
  slot: M08.4
  category: learning
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
  - title: Visualizing Data using t-SNE
    url: https://www.jmlr.org/papers/v9/vandermaaten08a.html
objectives:
- id: objective.nonlinear-embeddings
  version: 1-draft
  statement: Nonlinear embeddings and self-organizing maps preserve selected relationships; apparent clusters,
    distances, and empty spaces in a 2D visualization need careful interpretation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - nonlinear-embeddings.base
  - nonlinear-embeddings.transfer
  prerequisites:
  - anyOf:
    - objective.pca-and-factorization
  - anyOf:
    - objective.geometry-and-symmetry
scenes:
- id: nonlinear-embeddings.s1
  title: Fit many features into a two-dimensional view
  type: explanation
  depth: intuition
  objective_refs:
  - objective.nonlinear-embeddings
  markdown: 'An **embedding** represents an item with a list of numbers. An image might have thousands of measured
    features, while a plot gives it only two coordinates. This makes the collection easier to inspect, but
    some relationships must change.


    Think of flattening a globe onto paper: preserving one relationship can stretch another. Data-mapping methods
    also preserve selected relationships, though their distortions come from numerical objectives. The plotted
    axes may have no direct physical meaning, and the picture cannot generally preserve every distance and
    neighborhood.'
  text_mode: 'An **embedding** represents an item with a list of numbers. An image might have thousands of
    measured features, while a plot gives it only two coordinates. This makes the collection easier to inspect,
    but some relationships must change.


    Think of flattening a globe onto paper: preserving one relationship can stretch another. Data-mapping methods
    also preserve selected relationships, though their distortions come from numerical objectives. The plotted
    axes may have no direct physical meaning, and the picture cannot generally preserve every distance and
    neighborhood.'
  bridges: []
- id: nonlinear-embeddings.s2
  title: Local objectives can reshape global structure
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.nonlinear-embeddings
  markdown: 'Methods such as t-SNE and UMAP emphasize selected neighborhood relationships using different constructions
    and objectives. Hyperparameters and random initialization can change the picture. Large visual gaps or
    cluster sizes need not correspond directly to distances or population density in the original space.


    t-SNE and UMAP are names of two widely used mapping methods; you do not need to memorize their expanded
    names to read a plot. A **neighborhood** is a set of nearby items in the original representation. “Local”
    means those nearby relationships; “global” concerns the whole arrangement. Check original neighbors before
    treating separate colored islands as separate natural kinds.'
  text_mode: 'Methods such as t-SNE and UMAP emphasize selected neighborhood relationships using different
    constructions and objectives. Hyperparameters and random initialization can change the picture. Large visual
    gaps or cluster sizes need not correspond directly to distances or population density in the original space.


    t-SNE and UMAP are names of two widely used mapping methods; you do not need to memorize their expanded
    names to read a plot. A **neighborhood** is a set of nearby items in the original representation. “Local”
    means those nearby relationships; “global” concerns the whole arrangement. Check original neighbors before
    treating separate colored islands as separate natural kinds.'
  bridges:
  - geometry-and-symmetry
- id: nonlinear-embeddings.s3
  title: Arrange representative examples on a grid
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.nonlinear-embeddings
  markdown: 'A **self-organizing map** places **prototypes**, representative feature vectors, on a predefined
    grid. For each input, find the best-matching prototype and move it and its grid neighbors toward the input.


    If a winning prototype is 2 and the input is 6, moving a quarter of the way gives 2 + 0.25 × (6 − 2) =
    3. Neighboring prototypes usually move less. These shared updates encourage related prototypes to occupy
    nearby grid positions.


    Keep two spaces separate: the grid says which prototypes are neighbors, while each prototype’s feature
    values say which inputs it resembles.'
  text_mode: 'A **self-organizing map** places **prototypes**, representative feature vectors, on a predefined
    grid. For each input, find the best-matching prototype and move it and its grid neighbors toward the input.


    If a winning prototype is 2 and the input is 6, moving a quarter of the way gives 2 + 0.25 × (6 − 2) =
    3. Neighboring prototypes usually move less. These shared updates encourage related prototypes to occupy
    nearby grid positions.


    Keep two spaces separate: the grid says which prototypes are neighbors, while each prototype’s feature
    values say which inputs it resembles.'
  bridges: []
- id: nonlinear-embeddings.s4
  title: Use the plot to ask better questions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.nonlinear-embeddings
  markdown: Compare multiple settings, inspect original-space neighbors, and check labels or metadata only
    with appropriate evaluation boundaries. Treat a striking island in a plot as a hypothesis to investigate.
    Visualization can reveal anomalies and structure without proving distinct categories or causal mechanisms.
  text_mode: Compare multiple settings, inspect original-space neighbors, and check labels or metadata only
    with appropriate evaluation boundaries. Treat a striking island in a plot as a hypothesis to investigate.
    Visualization can reveal anomalies and structure without proving distinct categories or causal mechanisms.
  bridges: []
- id: nonlinear-embeddings.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.nonlinear-embeddings
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A two-dimensional map preserves selected relationships from a richer representation. Use visible
    clusters and gaps to ask questions, then check those questions against the original data.
