schema_version: 0.2-draft
lesson:
  id: nonlinear-embeddings
  version: 0.1.0-draft
  title: Read a map without mistaking it for the territory
  state: draft
  summary: Nonlinear embeddings and self-organizing maps preserve selected relationships; apparent clusters, distances,
    and empty spaces in a 2D visualization need careful interpretation.
  slot: M08.4
  category: learning
  minutes: 12
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
  - title: Visualizing Data using t-SNE
    url: https://www.jmlr.org/papers/v9/vandermaaten08a.html
objectives:
- id: objective.nonlinear-embeddings
  version: 1-draft
  statement: Nonlinear embeddings and self-organizing maps preserve selected relationships; apparent clusters, distances,
    and empty spaces in a 2D visualization need careful interpretation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - nonlinear-embeddings.base
  - nonlinear-embeddings.transfer
  prerequisites:
  - anyOf:
    - objective.pca-and-factorization
  - anyOf:
    - objective.geometry-and-symmetry
scenes:
- id: nonlinear-embeddings.s1
  title: A flat picture has a limited job
  type: explanation
  depth: intuition
  objective_refs:
  - objective.nonlinear-embeddings
  markdown: High-dimensional data can be projected into two dimensions for inspection. Different algorithms aim
    to preserve different local or global relationships. A low-dimensional view cannot generally preserve every
    distance and neighborhood simultaneously. Its axes may lack a direct physical interpretation.
  text_mode: High-dimensional data can be projected into two dimensions for inspection. Different algorithms aim
    to preserve different local or global relationships. A low-dimensional view cannot generally preserve every
    distance and neighborhood simultaneously. Its axes may lack a direct physical interpretation.
  bridges: []
- id: nonlinear-embeddings.s2
  title: Local objectives can reshape global structure
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.nonlinear-embeddings
  markdown: Methods such as t-SNE and UMAP emphasize selected neighborhood relationships using different constructions
    and objectives. Hyperparameters and random initialization can change the picture. Large visual gaps or cluster
    sizes need not correspond directly to distances or population density in the original space.
  text_mode: Methods such as t-SNE and UMAP emphasize selected neighborhood relationships using different constructions
    and objectives. Hyperparameters and random initialization can change the picture. Large visual gaps or cluster
    sizes need not correspond directly to distances or population density in the original space.
  bridges:
  - geometry-and-symmetry
- id: nonlinear-embeddings.s3
  title: A self-organizing map learns prototypes
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.nonlinear-embeddings
  markdown: A self-organizing map arranges prototype vectors on a predefined grid. For an input, find a matching
    prototype and update it and nearby grid neighbors toward that input. The grid neighborhood encourages organization.
    The resulting map is a learned representation whose geometry depends on both data and the chosen grid.
  text_mode: A self-organizing map arranges prototype vectors on a predefined grid. For an input, find a matching
    prototype and update it and nearby grid neighbors toward that input. The grid neighborhood encourages organization.
    The resulting map is a learned representation whose geometry depends on both data and the chosen grid.
  bridges: []
- id: nonlinear-embeddings.s4
  title: Use the plot to ask better questions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.nonlinear-embeddings
  markdown: Compare multiple settings, inspect original-space neighbors, and check labels or metadata only with
    appropriate evaluation boundaries. Treat a striking island in a plot as a hypothesis to investigate. Visualization
    can reveal anomalies and structure without proving distinct categories or causal mechanisms.
  text_mode: Compare multiple settings, inspect original-space neighbors, and check labels or metadata only with
    appropriate evaluation boundaries. Treat a striking island in a plot as a hypothesis to investigate. Visualization
    can reveal anomalies and structure without proving distinct categories or causal mechanisms.
  bridges: []
- id: nonlinear-embeddings.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.nonlinear-embeddings
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Nonlinear embeddings and self-organizing maps preserve selected relationships; apparent clusters, distances,
    and empty spaces in a 2D visualization need careful interpretation.
