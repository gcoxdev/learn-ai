  routes:
  - id: route.core
    scene_sequence:
    - pretraining-data-pipeline.s1
    - pretraining-data-pipeline.s2
    - pretraining-data-pipeline.s3
    - pretraining-data-pipeline.s4
    - pretraining-data-pipeline.s5
    - pretraining-data-pipeline.s6
    - pretraining-data-pipeline.s7
    - pretraining-data-pipeline.check
    gate_refs:
    - gate.core
  scene_aliases:
    pretraining-data-pipeline.recap: pretraining-data-pipeline.check
assessment_families:
- id: pretraining-data-pipeline.base
  objective_ref: objective.pretraining-data-pipeline
  task: base
  response_type: single_choice
  points: 1
  hint: 'Filter with an explicit objective: trace the inputs, operation, and result before choosing.'
  remediation_scene: pretraining-data-pipeline.s2
  variants:
  - id: pretraining-data-pipeline.base.1
    prompt: What does a token total alone fail to establish?
    options:
    - id: b
      text: That any data were counted
    - id: c
      text: That a tokenizer was used
    - id: a
      text: Quality, diversity, provenance, and evaluation independence
    answer: a
    feedback: Scale is only one property of a corpus.
    retired: true
  - id: pretraining-data-pipeline.base.2
    prompt: Why inspect samples rejected by a quality filter?
    options:
    - id: c
      text: Only to count file names
    - id: a
      text: To detect unintended removal of useful populations or formats
    - id: b
      text: To guarantee every rejected item should return
    answer: a
    feedback: Filtering can change coverage as well as remove corruption.
    retired: true
- id: pretraining-data-pipeline.transfer
  objective_ref: objective.pretraining-data-pipeline
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Check contamination before interpreting results: trace the inputs, operation, and result before choosing.'
  remediation_scene: pretraining-data-pipeline.s4
  variants:
  - id: pretraining-data-pipeline.transfer.1
    prompt: Exact hashes miss lightly edited copies. What additional approach may help?
    options:
    - id: c
      text: Ignoring all duplicates
    - id: a
      text: Normalized or approximate deduplication
    - id: b
      text: Only increasing model depth
    answer: a
    feedback: Near-duplicate methods compare beyond exact byte equality.
    retired: true
  - id: pretraining-data-pipeline.transfer.2
    prompt: No benchmark overlap was found by one detector. What is a sound report?
    options:
    - id: a
      text: The method found none, with its detection limits stated
    - id: b
      text: Contamination is mathematically impossible
    - id: c
      text: Every evaluation claim is now proven
    answer: a
    feedback: A negative search result depends on the detector’s coverage and sensitivity.
    retired: true
- id: pretraining-data-pipeline.base.v2
  objective_ref: objective.pretraining-data-pipeline
  task: base
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: pretraining-data-pipeline.s3
  variants:
  - prompt: Which artifact most directly describes what the training loop consumes?
    answer: a
    options:
    - id: a
      text: The final token stream and its sequence/target rules
    - id: c
      text: Only the number of raw downloaded files
    - id: b
      text: Only the original list of website domains
    feedback: Source labels do not fully specify filtering, tokenization, packing, or targets.
    id: pretraining-data-pipeline.base.v2.1
  - prompt: A filter rejects many valid informal messages. What should be investigated?
    answer: a
    options:
    - id: b
      text: Whether all informal language should be deleted
    - id: c
      text: Whether a larger model removes the need to inspect data
    - id: a
      text: Its criterion and effect on the intended data coverage
    feedback: A quality score can encode selection assumptions that exclude useful examples.
    id: pretraining-data-pipeline.base.v2.2
  - prompt: Why record intermediate pipeline counts?
    answer: a
    options:
    - id: b
      text: To prove every remaining record is correct
    - id: c
      text: To make independent rejection percentages automatically additive
    - id: a
      text: To trace which stage changed the dataset and by how much
    feedback: A staged ledger exposes transformations without turning counts into quality guarantees.
    id: pretraining-data-pipeline.base.v2.3
  - prompt: Which link belongs in a reproducible data manifest?
    answer: a
    options:
    - id: b
      text: A final row count without versions of the transformations
    - id: a
      text: The tokenizer version and packing conventions
    - id: c
      text: A list of source domains without the tokenization configuration
    feedback: These choices determine the numerical training inputs.
    id: pretraining-data-pipeline.base.v2.4
- id: pretraining-data-pipeline.transfer.v2
  objective_ref: objective.pretraining-data-pipeline
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: pretraining-data-pipeline.s3
  variants:
  - prompt: A held-out question appears verbatim inside a training document with a new filename. What is the
      issue?
    answer: a
    options:
    - id: a
      text: Evaluation contamination despite the different filename
    - id: c
      text: An optimizer problem unrelated to data
    - id: b
      text: A harmless rename that preserves full test independence
    feedback: Information content, not filenames, determines whether the test has leaked.
    id: pretraining-data-pipeline.transfer.v2.1
  - prompt: A pipeline removes 10 records from 100, then 20 from the remaining 90. How many remain?
    answer: a
    options:
    - id: b
      text: '72'
    - id: a
      text: '70'
    - id: c
      text: '80'
    feedback: 'The removals are absolute sequential counts: 100−10−20=70.'
    id: pretraining-data-pipeline.transfer.v2.2
  - prompt: Two teams use the same documents but different tokenizers and target masks. What can differ?
    answer: a
    options:
    - id: c
      text: Nothing once the source documents match
    - id: b
      text: Only input lengths; the prediction targets must remain identical
    - id: a
      text: The examples and losses seen by the training loop
    feedback: Tokenization and mask rules change the training representation and objective contributions.
    id: pretraining-data-pipeline.transfer.v2.3
  - prompt: A report does not disclose its exact filtering thresholds. What is the defensible comparison?
    answer: a
    options:
    - id: b
      text: Assume the thresholds from another model family
    - id: a
      text: State the available evidence and mark the thresholds unknown
    - id: c
      text: Infer exact thresholds from the final benchmark score
    feedback: Missing lifecycle details remain unknown rather than becoming guessed facts.
    id: pretraining-data-pipeline.transfer.v2.4
