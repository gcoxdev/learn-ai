schema_version: 0.2-draft
lesson:
  id: pretraining-data-pipeline
  version: 0.3.0-draft
  title: Build a traceable corpus before spending training compute
  state: draft
  summary: Follow a story from its source to the actual token sequence a training loop sees.
  slot: M16.2
  category: learning
  sources:
  - title: Groeneveld et al. — OLMo, an open language-model framework
    url: https://arxiv.org/abs/2402.00838
  - title: Biderman et al. — Pythia, a suite for analyzing language-model training
    url: https://arxiv.org/abs/2304.01373
  archetype: mechanism
objectives:
- id: objective.pretraining-data-pipeline
  version: 2-draft
  statement: Trace source selection, filtering, deduplication, tokenization, and versioned packing while identifying
    where evaluation leakage can enter.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - pretraining-data-pipeline.base.v2
  - pretraining-data-pipeline.transfer.v2
  prerequisites:
  - anyOf:
    - objective.data-provenance
  - anyOf:
    - objective.data-cleaning
  - anyOf:
    - objective.splits-and-leakage
scenes:
- id: pretraining-data-pipeline.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.pretraining-data-pipeline
  title: A model does not train on a website name
  markdown: '**Pretraining** is a broad learning phase that builds useful model patterns before later adaptation.
    A data **pipeline** is the sequence of operations that turns source material into training inputs. Imagine
    collecting short stories from several approved collections. A list of source names is only the beginning.
    The training loop eventually sees numerical token sequences produced after selection, cleanup, filtering,
    and formatting. Changes anywhere along that route can change what the model learns.'
  text_mode: '**Pretraining** is a broad learning phase that builds useful model patterns before later adaptation.
    A data **pipeline** is the sequence of operations that turns source material into training inputs. Imagine
    collecting short stories from several approved collections. A list of source names is only the beginning.
    The training loop eventually sees numerical token sequences produced after selection, cleanup, filtering,
    and formatting. Changes anywhere along that route can change what the model learns.'
  bridges: []
- id: pretraining-data-pipeline.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.pretraining-data-pipeline
  title: Track the collection before cleaning it
  markdown: Give every source and collected record a traceable identifier. Record provenance, collection rules,
    and relevant use restrictions. Then identify the evaluation material that must stay outside training. A
    copied test question can hide inside a larger document; a different filename does not make it independent.
    **Contamination** means that evaluation information has entered training or development in a way that undermines
    the intended claim. Check exact copies and appropriate near-copy patterns before celebrating a high score.
  text_mode: Give every source and collected record a traceable identifier. Record provenance, collection rules,
    and relevant use restrictions. Then identify the evaluation material that must stay outside training. A
    copied test question can hide inside a larger document; a different filename does not make it independent.
    **Contamination** means that evaluation information has entered training or development in a way that undermines
    the intended claim. Check exact copies and appropriate near-copy patterns before celebrating a high score.
  bridges: []
- id: pretraining-data-pipeline.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.pretraining-data-pipeline
  title: Watch a miniature filter ledger
  markdown: 'Start with 100 candidate documents. Remove 10 broken or empty records, leaving 90. A duplicate
    check removes 20 repeated copies, leaving 70. A documented task filter removes 5 more, leaving 65. These
    numbers are invented, but the ledger illustrates a useful habit: each count refers to what remains after
    the preceding stage. Filters may overlap, so adding independently measured rejection percentages can misstate
    the final total. Inspect examples near each filter’s boundary.'
  text_mode: 'Start with 100 candidate documents. Remove 10 broken or empty records, leaving 90. A duplicate
    check removes 20 repeated copies, leaving 70. A documented task filter removes 5 more, leaving 65. These
    numbers are invented, but the ledger illustrates a useful habit: each count refers to what remains after
    the preceding stage. Filters may overlap, so adding independently measured rejection percentages can misstate
    the final total. Inspect examples near each filter’s boundary.'
  bridges: []
- id: pretraining-data-pipeline.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.pretraining-data-pipeline
  title: Quality scores are judgments with blind spots
  markdown: A filter may use length, language, repeated characters, a classifier, or a model-produced score.
    Define what the score is intended to detect and sample both accepted and rejected records. A rule tuned
    on polished prose may reject valid informal or minority-language writing. More filtering is not automatically
    better data. Record changes in source coverage and check downstream tasks. The filtering choices should
    serve a stated task and be checked against the data they remove.
  text_mode: A filter may use length, language, repeated characters, a classifier, or a model-produced score.
    Define what the score is intended to detect and sample both accepted and rejected records. A rule tuned
    on polished prose may reject valid informal or minority-language writing. More filtering is not automatically
    better data. Record changes in source coverage and check downstream tasks. The filtering choices should
    serve a stated task and be checked against the data they remove.
  bridges: []
- id: pretraining-data-pipeline.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.pretraining-data-pipeline
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Source, check, deduplicate, tokenize, pack, record. The model learns from the final stream, so
    inspect what each stage kept and removed.
- id: pretraining-data-pipeline.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.pretraining-data-pipeline
  markdown: A pretraining corpus requires source records, quality filters, deduplication, contamination checks,
    and documented transformations; a large token count alone does not establish useful or appropriate data.
  text_mode: A pretraining corpus requires source records, quality filters, deduplication, contamination checks,
    and documented transformations; a large token count alone does not establish useful or appropriate data.
- id: pretraining-data-pipeline.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.pretraining-data-pipeline
  title: Turn approved text into training units
  markdown: A frozen tokenizer maps each kept document to token IDs. Packing then arranges sequences into the
    lengths processed by the model. Boundary markers, attention rules, and target masks determine whether one
    document can provide context for another and which positions contribute to loss. Keep the tokenizer version
    and these rules with the data release. Counting raw documents alone does not reveal how many token positions
    or training targets the model will actually consume.
  text_mode: A frozen tokenizer maps each kept document to token IDs. Packing then arranges sequences into
    the lengths processed by the model. Boundary markers, attention rules, and target masks determine whether
    one document can provide context for another and which positions contribute to loss. Keep the tokenizer
    version and these rules with the data release. Counting raw documents alone does not reveal how many token
    positions or training targets the model will actually consume.
  bridges: []
- id: pretraining-data-pipeline.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.pretraining-data-pipeline
  title: Make the stream reproducible enough to inspect
  markdown: Store a versioned manifest describing the sources, transformations, tokenizer, mixture, and sequence
    rules. A **manifest** is an inventory linking the chosen artifacts and their versions. Save sampled examples
    before and after each transformation to help diagnose mistakes. Published systems differ in how much of
    this process they release; do not fill missing details with guesses. Follow one story through its source,
    checks, duplicate handling, tokenization, packing, and recorded version.
  text_mode: Store a versioned manifest describing the sources, transformations, tokenizer, mixture, and sequence
    rules. A **manifest** is an inventory linking the chosen artifacts and their versions. Save sampled examples
    before and after each transformation to help diagnose mistakes. Published systems differ in how much of
    this process they release; do not fill missing details with guesses. Follow one story through its source,
    checks, duplicate handling, tokenization, packing, and recorded version.
  bridges: []
  figure:
    kind: lifecycle
    caption: Trace the artifacts leaving data preparation and identify which later stages actually update weights.
    description: A representative lifecycle connects prepared examples to pretraining, optional adaptation,
      evaluation and release, inference, and monitoring. Training changes weights; using or evaluating a fixed
      checkpoint does not by itself train it.
- id: pretraining-data-pipeline.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.pretraining-data-pipeline
  title: Follow the ledger
  markdown: A pipeline starts with 80 records, removes 8 broken records, then removes 12 duplicates from the
    remainder. How many remain?
  text_mode: A pipeline starts with 80 records, removes 8 broken records, then removes 12 duplicates from the
    remainder. How many remain?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: '60'
    - id: b
      text: '68'
    - id: c
      text: '64'
    answer: a
    reveal_markdown: 'Apply the stated sequential removals: 80−8−12=60. The second removal is already an absolute
      count from the remaining records.'
    hint: Trace the example using the rule from the preceding pages.
    id: pretraining-data-pipeline.practice.v2.7
