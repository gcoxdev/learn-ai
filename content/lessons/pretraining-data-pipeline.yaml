assessment_families:
  - id: pretraining-data-pipeline.base
    objective_ref: objective.pretraining-data-pipeline
    task: base
    response_type: single_choice
    points: 1
    hint: 'Filter with an explicit objective: trace the inputs, operation, and result before choosing.'
    remediation_scene: pretraining-data-pipeline.s2
    variants:
      - id: pretraining-data-pipeline.base.1
        prompt: What does a token total alone fail to establish?
        options:
          - id: b
            text: That any data were counted
          - id: c
            text: That a tokenizer was used
          - id: a
            text: Quality, diversity, provenance, and evaluation independence
        answer: a
        feedback: Scale is only one property of a corpus.
        retired: true
      - id: pretraining-data-pipeline.base.2
        prompt: Why inspect samples rejected by a quality filter?
        options:
          - id: c
            text: Only to count file names
          - id: a
            text: To detect unintended removal of useful populations or formats
          - id: b
            text: To guarantee every rejected item should return
        answer: a
        feedback: Filtering can change coverage as well as remove corruption.
        retired: true
  - id: pretraining-data-pipeline.transfer
    objective_ref: objective.pretraining-data-pipeline
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Check contamination before interpreting results: trace the inputs, operation, and result before choosing.'
    remediation_scene: pretraining-data-pipeline.s4
    variants:
      - id: pretraining-data-pipeline.transfer.1
        prompt: Exact hashes miss lightly edited copies. What additional approach may help?
        options:
          - id: c
            text: Ignoring all duplicates
          - id: a
            text: Normalized or approximate deduplication
          - id: b
            text: Only increasing model depth
        answer: a
        feedback: Near-duplicate methods compare beyond exact byte equality.
        retired: true
      - id: pretraining-data-pipeline.transfer.2
        prompt: No benchmark overlap was found by one detector. What is a sound report?
        options:
          - id: a
            text: The method found none, with its detection limits stated
          - id: b
            text: Contamination is mathematically impossible
          - id: c
            text: Every evaluation claim is now proven
        answer: a
        feedback: A negative search result depends on the detector’s coverage and sensitivity.
        retired: true
  - id: pretraining-data-pipeline.base.v2
    objective_ref: objective.pretraining-data-pipeline
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: pretraining-data-pipeline.s3
    variants:
      - prompt: Which artifact most directly describes what the training loop consumes?
        answer: a
        options:
          - id: a
            text: The final token stream and its sequence/target rules
          - id: c
            text: Only the number of raw downloaded files
          - id: b
            text: Only the original list of website domains
        feedback: Source labels do not fully specify filtering, tokenization, packing, or targets.
        id: pretraining-data-pipeline.base.v2.1
        retired: true
      - prompt: A filter rejects many valid informal messages. What should be investigated?
        answer: a
        options:
          - id: b
            text: Whether all informal language should be deleted
          - id: c
            text: Whether a larger model removes the need to inspect data
          - id: a
            text: Its criterion and effect on the intended data coverage
        feedback: A quality score can encode selection assumptions that exclude useful examples.
        id: pretraining-data-pipeline.base.v2.2
        retired: true
      - prompt: Why record intermediate pipeline counts?
        answer: a
        options:
          - id: b
            text: To prove every remaining record is correct
          - id: c
            text: To make independent rejection percentages automatically additive
          - id: a
            text: To trace which stage changed the dataset and by how much
        feedback: A staged ledger exposes transformations without turning counts into quality guarantees.
        id: pretraining-data-pipeline.base.v2.3
        retired: true
      - prompt: Which link belongs in a reproducible data manifest?
        answer: a
        options:
          - id: b
            text: A final row count without versions of the transformations
          - id: a
            text: The tokenizer version and packing conventions
          - id: c
            text: A list of source domains without the tokenization configuration
        feedback: These choices determine the numerical training inputs.
        id: pretraining-data-pipeline.base.v2.4
        retired: true
  - id: pretraining-data-pipeline.transfer.v2
    objective_ref: objective.pretraining-data-pipeline
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: pretraining-data-pipeline.s3
    variants:
      - prompt: A held-out question appears verbatim inside a training document with a new filename. What is the issue?
        answer: a
        options:
          - id: a
            text: Evaluation contamination despite the different filename
          - id: c
            text: An optimizer problem unrelated to data
          - id: b
            text: A harmless rename that preserves full test independence
        feedback: Information content, not filenames, determines whether the test has leaked.
        id: pretraining-data-pipeline.transfer.v2.1
        retired: true
      - prompt: A pipeline removes 10 records from 100, then 20 from the remaining 90. How many remain?
        answer: a
        options:
          - id: b
            text: '72'
          - id: a
            text: '70'
          - id: c
            text: '80'
        feedback: 'The removals are absolute sequential counts: 100−10−20=70.'
        id: pretraining-data-pipeline.transfer.v2.2
        retired: true
      - prompt: Two teams use the same documents but different tokenizers and target masks. What can differ?
        answer: a
        options:
          - id: c
            text: Nothing once the source documents match
          - id: b
            text: Only input lengths; the prediction targets must remain identical
          - id: a
            text: The examples and losses seen by the training loop
        feedback: Tokenization and mask rules change the training representation and objective contributions.
        id: pretraining-data-pipeline.transfer.v2.3
        retired: true
      - prompt: A report does not disclose its exact filtering thresholds. What is the defensible comparison?
        answer: a
        options:
          - id: b
            text: Assume the thresholds from another model family
          - id: a
            text: State the available evidence and mark the thresholds unknown
          - id: c
            text: Infer exact thresholds from the final benchmark score
        feedback: Missing lifecycle details remain unknown rather than becoming guessed facts.
        id: pretraining-data-pipeline.transfer.v2.4
        retired: true
  - id: pretraining-data-pipeline.base.v3
    objective_ref: objective.pretraining-data-pipeline
    task: base
    response_type: single_choice
    points: 1
    hint: Name the stage first (extraction, language ID, quality filter, dedup, PII, decontamination), then ask what that stage compares and what it keeps.
    remediation_scene: pretraining-data-pipeline.s2
    variants:
      - id: pretraining-data-pipeline.base.v3.1
        prompt: A news article was reposted on 400 sites, each copy with a different date line and sidebar. Which check will catch the copies?
        options:
          - id: b
            text: Hashing each full page and dropping pages whose hashes repeat
          - id: a
            text: Comparing shingle sets and removing pages with high Jaccard similarity
          - id: c
            text: Running a language classifier and keeping pages scored as English
        answer: a
        feedback: One changed line gives a completely different hash, so exact dedup misses every copy. Shingle overlap stays high when most of the text matches. Language ID would keep all 400 copies, since they're all English.
      - id: pretraining-data-pipeline.base.v3.2
        prompt: Why do large pipelines compute MinHash signatures instead of the exact Jaccard similarity of every pair of documents?
        options:
          - id: c
            text: MinHash measures meaning, so it also catches paraphrased documents
          - id: b
            text: MinHash gives a more accurate score than counting shared shingles
          - id: a
            text: Short signatures and banding pick out candidate pairs to compare
        answer: a
        feedback: With billions of pages, comparing every pair is impossible. Signatures estimate Jaccard, and banding flags only likely pairs. MinHash still works on word shingles, so it doesn't catch paraphrases, and it approximates Jaccard rather than beating it.
      - id: pretraining-data-pipeline.base.v3.3
        prompt: What does a 13-gram decontamination check look for?
        options:
          - id: a
            text: Any 13-word run from a test item that also appears in training text
          - id: b
            text: Training pages whose topic is similar to the benchmark's topic
          - id: c
            text: Test files whose names or web addresses match a training source
        answer: a
        feedback: The check slides a 13-word window along each test item and looks for exact matches in the training corpus. Topic similarity would flag almost every page, and a copied question can sit on any page under any name.
      - id: pretraining-data-pipeline.base.v3.4
        prompt: A quality filter removes 40% of the pages it sees, and near-duplicate removal then removes 30% of the pages it sees. What share of the pages entering the filter survives both?
        options:
          - id: b
            text: 30%, since 40% plus 30% of the pages were removed
          - id: c
            text: 58%, since each stage keeps part of the original total
          - id: a
            text: 42%, since 60% survive the filter and 70% of those survive dedup
        answer: a
        feedback: Stages apply in sequence, so multiply what each keeps, 0.6 × 0.7 = 0.42. Adding the percentages treats both as shares of the original pages. 58% is the share removed, not kept.
  - id: pretraining-data-pipeline.transfer.v3
    objective_ref: objective.pretraining-data-pipeline
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what could go wrong at this stage in this setting (lost good data, leaked personal data, or leaked test data) and pick the step that checks for it.
    remediation_scene: pretraining-data-pipeline.s4
    variants:
      - id: pretraining-data-pipeline.transfer.v3.1
        prompt: A health-forum corpus is filtered with a bad-words blocklist. Reviewers find it removed many ordinary posts about sexual health and LGBTQ+ patients. What should the team do?
        options:
          - id: b
            text: Keep the blocklist, because removing any risky page is the safer choice
          - id: a
            text: Review a sample of rejects and replace the list with a better-tested filter
          - id: c
            text: Tighten the language-ID threshold so fewer informal posts reach the list
        answer: a
        feedback: This is the pattern Dodge et al. found in C4. A crude list erases useful text about whole communities, so read what it rejects and use a filter tested on this domain. Tightening language ID doesn't fix the blocklist's judgments.
      - id: pretraining-data-pipeline.transfer.v3.2
        prompt: A new model scores far higher on one reading-comprehension benchmark than on similar tests. What should the team check first?
        options:
          - id: c
            text: Whether a longer context window would lift the other tests too
          - id: b
            text: Whether more training data from the same crawl raises all scores
          - id: a
            text: Whether the benchmark's passages or questions overlap the training corpus
        answer: a
        feedback: A standout score on one test is a classic sign of contamination. Check n-gram overlap, then compare scores on flagged and clean questions, as GPT-3's authors did. More data or a longer context doesn't explain a gap on one benchmark.
      - id: pretraining-data-pipeline.transfer.v3.3
        prompt: A bank wants to pretrain a small model on five years of its own customer-support chats. Which stage matters most before any training starts?
        options:
          - id: a
            text: Scrubbing names, emails, phone numbers, and account numbers
          - id: b
            text: Removing near-duplicate chats that use the same greeting
          - id: c
            text: Dropping chats whose lines don't end in end punctuation
        answer: a
        feedback: Support chats are full of personal data, and a model can repeat what it saw. Near-duplicate removal is useful but secondary, and C4's punctuation rule would throw away most chat messages.
      - id: pretraining-data-pipeline.transfer.v3.4
        prompt: A team's quality classifier was trained to prefer encyclopedia-style writing. It rejects most recipe blogs and hobby forums. What is the likely effect on the model?
        options:
          - id: c
            text: It will be stronger on informal text, since it learns from cleaner examples
          - id: a
            text: It will be weaker on informal and everyday writing the filter removed
          - id: b
            text: It will be unaffected, since the rejected pages were duplicates anyway
        answer: a
        feedback: A model learns the styles it sees. A filter that removes everyday writing makes the model worse at it. Nothing says the rejects were duplicates, so read a sample of what was removed before deciding.
  - id: pretraining-data-pipeline.calculate
    objective_ref: objective.pretraining-data-pipeline
    task: base
    response_type: numeric
    points: 1
    hint: Jaccard similarity is shared shingles ÷ distinct shingles in either document. The union is size A + size B − shared.
    remediation_scene: pretraining-data-pipeline.s2
    absolute_tolerance: 0.01
    variants:
      - id: pretraining-data-pipeline.calculate.1
        prompt: Document A has 20 distinct shingles and document B has 20. They share 15. What is their Jaccard similarity?
        answer: 0.6
        feedback: The union is 20 + 20 − 15 = 25 distinct shingles, so J = 15 ÷ 25 = 0.6.
      - id: pretraining-data-pipeline.calculate.2
        prompt: Document A has 40 distinct shingles and document B has 36. They share 30. What is their Jaccard similarity? Give two decimal places.
        answer: 0.652
        feedback: The union is 40 + 36 − 30 = 46, so J = 30 ÷ 46 ≈ 0.65.
      - id: pretraining-data-pipeline.calculate.3
        prompt: A 12-word sentence and a copy with its 6th word changed are compared using 3-word shingles. What is their Jaccard similarity? Give two decimal places.
        answer: 0.538
        feedback: Each version has 12 − 3 + 1 = 10 shingles. The 3 shingles containing the 6th word differ, so 7 are shared and the union is 7 + 3 + 3 = 13. J = 7 ÷ 13 ≈ 0.54.
      - id: pretraining-data-pipeline.calculate.4
        prompt: Two documents each have 50 distinct shingles and share 45 of them. What is their Jaccard similarity? Give two decimal places.
        answer: 0.818
        feedback: The union is 50 + 50 − 45 = 55, so J = 45 ÷ 55 ≈ 0.82.
