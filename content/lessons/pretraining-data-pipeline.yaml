      url: https://arxiv.org/abs/2402.00159
  archetype: mechanism
objectives:
  - id: objective.pretraining-data-pipeline
    version: 3-draft
    statement: Trace source selection, filtering, deduplication, tokenization, and versioned packing while identifying where evaluation leakage can enter.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - pretraining-data-pipeline.base.v3
      - pretraining-data-pipeline.transfer.v3
      - pretraining-data-pipeline.calculate
    prerequisites:
      - anyOf:
          - objective.data-provenance
      - anyOf:
          - objective.data-cleaning
      - anyOf:
          - objective.splits-and-leakage
scenes:
  - id: pretraining-data-pipeline.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.pretraining-data-pipeline
    title: A crawled page is mostly not prose
    markdown: |-
      The Kestrel team downloads one monthly snapshot of Common Crawl, a free public archive of billions of web pages. They open a page at random: a recipe for lemon cake. The file is 90,000 characters of HTML. The recipe itself is about 2,000 characters. The rest is menus, cookie banners, ads, a comment form, and links to forty other recipes.

      A model learns whatever text it's fed, so the team builds a **data pipeline**: a fixed sequence of steps that turns raw pages into training text. The first two steps are simple:

      1. **Text extraction** pulls the main text out of the HTML. FineWeb (2024), a 15-trillion-token English web corpus, used the open-source tool trafilatura, because models trained on its output beat models trained on the plain-text files Common Crawl ships.
      2. **Language identification** runs a small classifier that guesses each page's language with a confidence score. FineWeb kept pages that a fastText classifier scored as English with at least 0.65.

      The later steps, shown below, are where the judgment calls live.
    bridges: []
    diagram:
      caption: Kestrel's data pipeline. Each stage removes or edits pages before any token reaches training.
      description: Crawled HTML goes to text extraction, then language identification, then quality filters. Filtered pages go to near-duplicate removal, then PII scrubbing, then decontamination against evaluation sets, and finally tokenization into training text.
      nodes:
        - id: crawl
          label: Crawled HTML
          note: one Common Crawl snapshot
          col: 0
          row: 0
          tone: data
        - id: extract
          label: Extract text
          note: drop menus and markup
          col: 1
          row: 0
        - id: lang
          label: Language ID
          note: keep English ≥ 0.65
          col: 2
          row: 0
        - id: quality
          label: Quality filters
          note: rules and classifiers
          col: 3
          row: 0
          tone: accent
        - id: dedup
          label: Remove near-duplicates
          note: MinHash on shingles
          col: 3
          row: 1
          tone: accent
        - id: pii
          label: Scrub personal data
          note: emails, IP addresses
          col: 2
          row: 1
          tone: warn
        - id: decon
          label: Decontaminate
          note: drop 13-gram overlaps with tests
          col: 1
          row: 1
          tone: warn
        - id: tokens
          label: Tokenize
          note: ready for the mixture
          col: 0
          row: 1
          tone: data
      edges:
        - from: crawl
          to: extract
        - from: extract
          to: lang
        - from: lang
          to: quality
        - from: quality
          to: dedup
        - from: dedup
          to: pii
        - from: pii
          to: decon
        - from: decon
          to: tokens
  - id: pretraining-data-pipeline.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.pretraining-data-pipeline
    title: Filters are opinions, so read what they throw away
    markdown: |-
      **Quality filters** decide which pages are worth learning from. **Heuristic filters** are hand-written rules. The C4 corpus, built for Google's T5 model (2019), used rules like these:

      - keep only lines that end in a period, exclamation mark, question mark, or end quotation mark
      - keep only lines with at least 5 words, and drop pages with fewer than 3 sentences
      - drop any page containing `lorem ipsum`, or a curly bracket (a sign of code)
      - drop any page containing a word from a public list of "bad words"

      :::predict Which of these three lines would C4's first two rules keep? "Home | Recipes | Contact", "Preheat the oven to 180°C.", "Bake until golden!"
      Only "Preheat the oven to 180°C." It ends in a period and has 5 words. The menu has no end punctuation, and "Bake until golden!" has only 3 words, so a useful instruction is lost too.
      :::

      **Classifier filters** score each page with a model. For FineWeb-Edu, Llama-3-70B-Instruct rated 460,000 pages from 0 to 5 for educational value. A small classifier trained on those ratings then scored every page, and pages scoring 3 or more were kept. That cut 15 trillion tokens to 1.3 trillion, and models trained on the result did much better on knowledge and reasoning benchmarks.

      :::mixup "Stricter filtering always gives better data."
      Every filter encodes someone's idea of "good". Dodge et al. (2021) found that C4's bad-words blocklist disproportionately removed text from and about minority groups. Filtering toxic text is worth doing, but a crude rule can erase whole communities from what the model learns.
      :::

      So the Kestrel team's rule is simple: before trusting any filter, read twenty of the pages it threw away.
    bridges: []
  - id: pretraining-data-pipeline.s2
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.pretraining-data-pipeline
    title: Catch copies that differ by one word
    markdown: |-
      The web repeats itself. Lee et al. (2021) found a single 61-word English sentence repeated more than 60,000 times in C4. Models trained on their deduplicated data copied training text word for word about ten times less often.

      **Exact deduplication** hashes each document and drops repeated hashes. But a page reposted with a new date line gets a completely different hash. To catch those, the team compares documents by their **shingles**, the overlapping runs of $n$ consecutive words. "the kestrel hovers over" has two 3-word shingles: "the kestrel hovers" and "kestrel hovers over". Two documents' similarity is their **Jaccard similarity**: shared shingles divided by all distinct shingles.

      ```python run
      import hashlib

      def shingles(text, n=3):
          words = text.lower().split()
          return {" ".join(words[i:i + n]) for i in range(len(words) - n + 1)}

      def jaccard(a, b):
          return len(a & b) / len(a | b)

      def minhash(sh, k=128):
          # k different hash functions: salt each shingle with the function number
          h = lambda s: int(hashlib.md5(s.encode()).hexdigest()[:8], 16)
          return [min(h(f"{i}:{s}") for s in sh) for i in range(k)]

      docs = {
          "A": "the kestrel hovers over the field and then drops onto a vole in the grass",
          "B": "the kestrel hovers over the meadow and then drops onto a vole in the grass",
          "C": "a falcon stoops from a great height and strikes its prey in the air",
      }
      sh = {k: shingles(v) for k, v in docs.items()}
      sig = {k: minhash(v) for k, v in sh.items()}
      for x, y in [("A", "B"), ("A", "C")]:
          shared, union = len(sh[x] & sh[y]), len(sh[x] | sh[y])
          est = sum(p == q for p, q in zip(sig[x], sig[y])) / len(sig[x])
          print(f"{x} vs {y}: {shared} shared / {union} total shingles = "
                f"Jaccard {jaccard(sh[x], sh[y]):.3f}; MinHash estimate {est:.3f}")
      ```

      Swapping "field" for "meadow" breaks the 3 shingles containing it on each side: 10 shared out of 16, a Jaccard of 0.625. Try `n=5` and watch the score fall, or give sentence C a phrase from A.

      :::predict In a 1,000-word article, one word in the middle is changed. What is the 3-shingle Jaccard between the two versions?
      Each version has 998 shingles, and 3 on each side contain the changed word. So 995 are shared out of $995 + 3 + 3 = 1{,}001$ distinct shingles: $995/1{,}001 \approx 0.994$. Near-duplicates of long documents score close to 1.
      :::

      :::papers MinHash: estimating Jaccard without comparing every pair
      For a random hash function $h$, the shingle with the smallest hash is equally likely to be any shingle in $A \cup B$, so

      $$\Pr\big[\min h(A) = \min h(B)\big] = J(A,B) = \frac{|A \cap B|}{|A \cup B|}$$

      Keep the minimum under each of $k$ hash functions as a signature; the fraction of matching positions estimates $J$ (0.633 against the true 0.625 above). Broder introduced MinHash in 1997 to find near-duplicate web pages. FineWeb used 112 hashes on 5-word shingles in 14 bands of 8. A pair becomes a candidate if any band matches entirely, with probability $1-(1-J^8)^{14}$: about 0.77 at $J = 0.75$ but 0.05 at $J = 0.5$. Only candidates are compared, never all pairs.
      :::
    bridges: []
  - id: pretraining-data-pipeline.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.pretraining-data-pipeline
    title: Scrub personal data, then guard the test set
    markdown: |-
      **PII removal** strips personally identifiable information, such as email addresses, phone numbers, and IP addresses, usually with pattern-matching rules that swap each match for a placeholder. FineWeb's public release anonymized email and public IP addresses this way. A model can't repeat an address it never saw.

      **Decontamination** removes test questions from the training data. If a benchmark's questions sit in the corpus, a high score may only measure memory. The usual check looks for long runs of identical words: GPT-3's team flagged any test example sharing a 13-word sequence (a 13-gram) with the training set.

      :::predict A benchmark question is 20 words long. How many 13-word windows must be looked up in the training index?
      $20 - 13 + 1 = 8$. If any of those 8 windows appears in a training document, the question is flagged. A shorter question (under 13 words) is flagged only if it appears whole.
      :::

      :::story GPT-3's contamination bug
      OpenAI tried to remove benchmark overlaps from GPT-3's training data in 2020, but a bug left some in, and the model was too expensive to retrain. Instead, the paper built "clean" versions of each benchmark without the flagged questions and reported scores on those.
      :::
    bridges: []
  - id: pretraining-data-pipeline.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.pretraining-data-pipeline
    title: Keep a ledger at every stage
    markdown: |-
      Here is the Kestrel team's ledger for a million crawled pages. (The counts are invented; the shape is typical.)

      | Stage | Pages left | Removed here |
      | --- | ---: | ---: |
      | Crawled HTML | 1,000,000 | |
      | Text extracted | 920,000 | 80,000 (8%) |
      | English, score ≥ 0.65 | 460,000 | 460,000 (50%) |
      | Heuristic filters | 276,000 | 184,000 (40%) |
      | Near-duplicate removal | 193,200 | 82,800 (30%) |
      | PII scrub | 193,200 | 0 (edits, doesn't remove) |
      | Decontamination | 193,150 | 50 |

      About 19% of the crawl survives. Each percentage is a share of what *reached* that stage, not of the original million.

      :::mixup "The filters removed 40% and dedup removed 30%, so we lost 70% of the English pages."
      Stages apply in sequence. Filters keep 60%, then dedup keeps 70% of *those*: $0.6 \times 0.7 = 0.42$, so 42% of English pages survive (193,200 of 460,000) and 58% are gone, not 70%.
      :::

      The ledger also tells you where to look when something goes wrong. If next month's snapshot keeps 35% instead of 19%, the stage whose share jumped is the one to inspect first.
    bridges: []
  - id: pretraining-data-pipeline.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.pretraining-data-pipeline
    title: Version the corpus like code
    markdown: |-
      Months later, someone asks why Kestrel is weak at informal writing. Answering needs a record of exactly what went in, so the team saves a **manifest**, a file listing every input and setting: the crawl snapshot IDs, the extraction tool's version, each filter's threshold, the dedup settings, the benchmarks used for decontamination, and the tokenizer's hash. They also save 100 sample pages kept and 100 removed at each stage.

      Open corpora show how. The Pile (2020) combined 22 named sources in 825 GiB and trained EleutherAI's Pythia models. Dolma (2024), 3 trillion tokens from the Allen Institute, released its processing tools too, so anyone can rerun each filter. The figure shows where the corpus goes next: pretraining, which changes the weights.
    bridges: []
    figure:
      kind: lifecycle
      caption: Trace the artifacts leaving data preparation and identify which later stages actually update weights.
      description: A representative lifecycle connects prepared examples to pretraining, optional adaptation, evaluation and release, inference, and monitoring. Training changes weights; using or evaluating a fixed checkpoint does not by itself train it.
  - id: pretraining-data-pipeline.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.pretraining-data-pipeline
    markdown: Jaccard scores to compute, a filter ledger, a blocklist gone wrong, a suspicious benchmark score, and a support-chat corpus test whether you can run each stage and spot its failure.
    takeaway: |-
      Raw web text becomes training data through extraction, language ID, quality filters, near-duplicate removal, PII scrubbing, and decontamination. Keep a ledger and a manifest, and read what each filter throws away.
  - id: pretraining-data-pipeline.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.pretraining-data-pipeline
    markdown: |-
      A pretraining corpus requires source records, quality filters, deduplication, contamination checks, and documented transformations; a large token count alone does not establish useful or appropriate data.
  - id: pretraining-data-pipeline.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.pretraining-data-pipeline
    title: Follow the ledger
    markdown: |-
      Try a ledger of your own. A pipeline starts with 80 records, removes 8 broken records, then removes 12 duplicates from the remainder. How many remain?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: '60'
        - id: b
          text: '68'
        - id: c
          text: '64'
      answer: a
      reveal_markdown: |-
        Subtract in order: 80 − 8 = 72 after the broken records, then 72 − 12 = 60 after the duplicates. Both removals are counts, so they come straight off what's left.
      hint: Each stage removes records from whatever the previous stage left. Subtract the two removals one after the other.
      id: pretraining-data-pipeline.practice.v2.7
navigation:
  routes:
