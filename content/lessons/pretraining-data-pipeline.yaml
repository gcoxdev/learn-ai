schema_version: 0.2-draft
lesson:
  id: pretraining-data-pipeline
  version: 0.1.0-draft
  title: Build a traceable corpus before spending training compute
  state: draft
  summary: A pretraining corpus requires source records, quality filters, deduplication, contamination checks, and
    documented transformations; a large token count alone does not establish useful or appropriate data.
  slot: M16.2
  category: learning
  minutes: 12
  sources:
  - title: The Llama 3 Herd of Models
    url: https://arxiv.org/abs/2407.21783
  - title: Datasheets for Datasets
    url: https://arxiv.org/abs/1803.09010
objectives:
- id: objective.pretraining-data-pipeline
  version: 1-draft
  statement: A pretraining corpus requires source records, quality filters, deduplication, contamination checks,
    and documented transformations; a large token count alone does not establish useful or appropriate data.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - pretraining-data-pipeline.base
  - pretraining-data-pipeline.transfer
  prerequisites:
  - anyOf:
    - objective.data-provenance
  - anyOf:
    - objective.data-cleaning
  - anyOf:
    - objective.splits-and-leakage
scenes:
- id: pretraining-data-pipeline.s1
  title: Inventory sources and their conditions
  type: explanation
  depth: intuition
  objective_refs:
  - objective.pretraining-data-pipeline
  markdown: Record where documents came from, collection dates, source terms or permissions, language, domain, and
    known limitations. Keep data-use review connected to actual artifacts and intended uses. A statement that text
    was publicly visible is not a complete account of provenance or applicable conditions.
  text_mode: Record where documents came from, collection dates, source terms or permissions, language, domain,
    and known limitations. Keep data-use review connected to actual artifacts and intended uses. A statement that
    text was publicly visible is not a complete account of provenance or applicable conditions.
  bridges: []
- id: pretraining-data-pipeline.s2
  title: Filter with an explicit objective
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.pretraining-data-pipeline
  markdown: Quality filters may target corrupted text, boilerplate, spam, or unwanted content. Each filter can also
    remove legitimate dialects, niche knowledge, or unusual formatting. Inspect retained and removed samples, track
    rule versions, and measure changes in source and language coverage.
  text_mode: Quality filters may target corrupted text, boilerplate, spam, or unwanted content. Each filter can
    also remove legitimate dialects, niche knowledge, or unusual formatting. Inspect retained and removed samples,
    track rule versions, and measure changes in source and language coverage.
  bridges: []
- id: pretraining-data-pipeline.s3
  title: Deduplicate at useful levels
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.pretraining-data-pipeline
  markdown: 'Exact document hashes catch identical files, while normalized or approximate comparisons can catch
    near copies. Repeated text can dominate a token budget and increase memorization or benchmark overlap. Deduplication
    scope matters: within a source, across sources, and across training/evaluation each ask different questions.'
  text_mode: 'Exact document hashes catch identical files, while normalized or approximate comparisons can catch
    near copies. Repeated text can dominate a token budget and increase memorization or benchmark overlap. Deduplication
    scope matters: within a source, across sources, and across training/evaluation each ask different questions.'
  bridges: []
- id: pretraining-data-pipeline.s4
  title: Check contamination before interpreting results
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.pretraining-data-pipeline
  markdown: Search for evaluation questions, answers, and close variants in candidate data under a defined method.
    Detection is imperfect, especially for paraphrases or transformed formats. Report exclusions and residual uncertainty.
    Preserve processing manifests so a checkpoint can be linked to the corpus version that produced it.
  text_mode: Search for evaluation questions, answers, and close variants in candidate data under a defined method.
    Detection is imperfect, especially for paraphrases or transformed formats. Report exclusions and residual uncertainty.
    Preserve processing manifests so a checkpoint can be linked to the corpus version that produced it.
  bridges: []
- id: pretraining-data-pipeline.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.pretraining-data-pipeline
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: A pretraining corpus requires source records, quality filters, deduplication, contamination checks,
    and documented transformations; a large token count alone does not establish useful or appropriate data.
- id: pretraining-data-pipeline.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.pretraining-data-pipeline
  markdown: A pretraining corpus requires source records, quality filters, deduplication, contamination checks,
    and documented transformations; a large token count alone does not establish useful or appropriate data.
  text_mode: A pretraining corpus requires source records, quality filters, deduplication, contamination checks,
    and documented transformations; a large token count alone does not establish useful or appropriate data.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - pretraining-data-pipeline.s1
    - pretraining-data-pipeline.s2
    - pretraining-data-pipeline.s3
    - pretraining-data-pipeline.s4
    - pretraining-data-pipeline.check
    gate_refs:
    - gate.core
  scene_aliases:
