schema_version: 0.2-draft
lesson:
  id: pretraining-data-pipeline
  version: 0.4.0-draft
  title: Build a traceable corpus before spending training compute
  state: draft
  summary: A crawled web page is mostly menus, cookie banners, and copies of other pages. Follow a snapshot of the web through the filters that turn it into training text.
  slot: M16.2
  category: learning
  sources:
    - title: 'Raffel et al. — Exploring the Limits of Transfer Learning with a Unified Text-to-Text Transformer (T5 and C4, 2019)'
      url: https://arxiv.org/abs/1910.10683
    - title: 'Penedo et al. — The FineWeb Datasets: Decanting the Web for the Finest Text Data at Scale (2024)'
      url: https://arxiv.org/abs/2406.17557
    - title: Lee et al. — Deduplicating Training Data Makes Language Models Better (2021)
      url: https://arxiv.org/abs/2107.06499
    - title: 'Dodge et al. — Documenting Large Webtext Corpora: A Case Study on the Colossal Clean Crawled Corpus (2021)'
      url: https://arxiv.org/abs/2104.08758
    - title: Brown et al. — Language Models are Few-Shot Learners (GPT-3, 2020)
      url: https://arxiv.org/abs/2005.14165
    - title: 'Gao et al. — The Pile: An 800GB Dataset of Diverse Text for Language Modeling (2020)'
      url: https://arxiv.org/abs/2101.00027
