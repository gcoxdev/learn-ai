schema_version: 0.2-draft
lesson:
  id: human-review-and-user-experience
  version: 0.1.0-draft
  title: Give people useful control over model-assisted work
  state: draft
  summary: Human-in-the-loop design needs clear evidence, correction, escalation, and responsibility; measure the
    combined human-system workflow rather than assuming human presence removes errors.
  slot: M33.6
  category: learning
  minutes: 12
  sources:
  - title: Guidelines for Human-AI Interaction
    url: https://www.microsoft.com/en-us/research/publication/guidelines-for-human-ai-interaction/
  - title: NIST AI Risk Management Framework
    url: https://www.nist.gov/itl/ai-risk-management-framework
objectives:
- id: objective.human-review-and-user-experience
  version: 1-draft
  statement: Human-in-the-loop design needs clear evidence, correction, escalation, and responsibility; measure
    the combined human-system workflow rather than assuming human presence removes errors.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - human-review-and-user-experience.base
  - human-review-and-user-experience.transfer
  prerequisites:
  - anyOf:
    - objective.stakeholders-and-deployment-decisions
  - anyOf:
    - objective.human-and-model-judges
scenes:
- id: human-review-and-user-experience.s1
  title: Choose the role of human judgment
  type: explanation
  depth: intuition
  objective_refs:
  - objective.human-review-and-user-experience
  markdown: A person might approve an action, correct a label, inspect uncertain cases, or make the final decision.
    These roles require different interfaces and time budgets. Define what the system prepares and what the reviewer
    must verify.
  text_mode: A person might approve an action, correct a label, inspect uncertain cases, or make the final decision.
    These roles require different interfaces and time budgets. Define what the system prepares and what the reviewer
    must verify.
  bridges: []
- id: human-review-and-user-experience.s2
  title: Make evidence easy to inspect
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.human-review-and-user-experience
  markdown: Show relevant sources, uncertainty, and material differences without overwhelming the user. A confident
    recommendation can anchor reviewers even when wrong. For a document comparison, highlight the changed passages
    and their provenance rather than requiring trust in an unsupported summary.
  text_mode: Show relevant sources, uncertainty, and material differences without overwhelming the user. A confident
    recommendation can anchor reviewers even when wrong. For a document comparison, highlight the changed passages
    and their provenance rather than requiring trust in an unsupported summary.
  bridges: []
- id: human-review-and-user-experience.s3
  title: Support correction and escalation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.human-review-and-user-experience
  markdown: Allow users to revise inputs, reject suggestions, recover from mistakes, and reach an appropriate human
    channel. Explain the effect of their action in ordinary language. An approval button with unclear scope does
    not provide meaningful control.
  text_mode: Allow users to revise inputs, reject suggestions, recover from mistakes, and reach an appropriate human
    channel. Explain the effect of their action in ordinary language. An approval button with unclear scope does
    not provide meaningful control.
  bridges: []
- id: human-review-and-user-experience.s4
  title: Evaluate joint performance
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.human-review-and-user-experience
  markdown: Measure task time, error detection, final quality, workload, accessibility, and overreliance with representative
    users. Human review can improve outcomes or become a rubber stamp under pressure. The relevant unit is the complete
    workflow, including interruptions and correction costs.
  text_mode: Measure task time, error detection, final quality, workload, accessibility, and overreliance with representative
    users. Human review can improve outcomes or become a rubber stamp under pressure. The relevant unit is the complete
    workflow, including interruptions and correction costs.
  bridges: []
- id: human-review-and-user-experience.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.human-review-and-user-experience
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: human-review-and-user-experience.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.human-review-and-user-experience
  markdown: Human-in-the-loop design needs clear evidence, correction, escalation, and responsibility; measure the
    combined human-system workflow rather than assuming human presence removes errors.
  text_mode: Human-in-the-loop design needs clear evidence, correction, escalation, and responsibility; measure
    the combined human-system workflow rather than assuming human presence removes errors.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - human-review-and-user-experience.s1
    - human-review-and-user-experience.s2
    - human-review-and-user-experience.s3
    - human-review-and-user-experience.s4
    - human-review-and-user-experience.check
    - human-review-and-user-experience.recap
    gate_refs:
    - gate.core
assessment_families:
- id: human-review-and-user-experience.base
  objective_ref: objective.human-review-and-user-experience
  task: base
  response_type: single_choice
  points: 1
  hint: 'Make evidence easy to inspect: trace the inputs, operation, and result before choosing.'
  remediation_scene: human-review-and-user-experience.s2
  variants:
  - id: human-review-and-user-experience.base.1
    prompt: Does adding a human approval button automatically remove model errors?
    options:
    - id: c
      text: Only if the button is prominent
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Review needs evidence, time, and a usable decision scope.
  - id: human-review-and-user-experience.base.2
    prompt: What can a confident wrong suggestion cause?
    options:
    - id: a
      text: Anchoring or overreliance
    - id: b
      text: Guaranteed error detection
    - id: c
      text: Only visual clutter
    answer: a
    feedback: Presentation can influence human judgment.
- id: human-review-and-user-experience.transfer
  objective_ref: objective.human-review-and-user-experience
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate joint performance: trace the inputs, operation, and result before choosing.'
  remediation_scene: human-review-and-user-experience.s4
  variants:
  - id: human-review-and-user-experience.transfer.1
    prompt: What should an approval interface make clear?
    options:
    - id: a
      text: The action and consequences being approved
    - id: b
      text: Only the model’s name
    - id: c
      text: That every future action is approved
    answer: a
    feedback: Users need concrete scope.
  - id: human-review-and-user-experience.transfer.2
    prompt: Which outcome should evaluate a human-model workflow?
    options:
    - id: b
      text: Only model accuracy before review
    - id: c
      text: Only number of clicks
    - id: a
      text: Combined final quality, time, workload, and correction behavior
    answer: a
    feedback: The product’s value includes human interaction costs.
