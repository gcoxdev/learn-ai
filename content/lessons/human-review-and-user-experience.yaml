schema_version: 0.2-draft
lesson:
  id: human-review-and-user-experience
  version: 0.3.0-draft
  title: Give people useful control over model-assisted work
  state: draft
  summary: Design a review desk where a person can spot a mistake, correct it, and understand what approval
    will do.
  slot: M33.6
  category: learning
  sources:
  - title: Amershi et al. — Guidelines for Human-AI Interaction
    url: https://www.microsoft.com/en-us/research/publication/guidelines-for-human-ai-interaction/
  - title: Breck et al. — The ML Test Score
    url: https://research.google/pubs/the-ml-test-score-a-rubric-for-ml-production-readiness-and-technical-debt-reduction/
  archetype: mechanism
objectives:
- id: objective.human-review-and-user-experience
  version: 2-draft
  statement: Specify reviewer evidence, authority, fallback, and workload, then evaluate the combined human-system
    workflow.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - human-review-and-user-experience.base.v2
  - human-review-and-user-experience.transfer.v2
  prerequisites:
  - anyOf:
    - objective.stakeholders-and-deployment-decisions
  - anyOf:
    - objective.human-and-model-judges
scenes:
- id: human-review-and-user-experience.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.human-review-and-user-experience
  title: Give the person a real job
  markdown: '**Human review** means a person checks or decides some part of the workflow. “A human is involved”
    is too vague to evaluate. In our library, an assistant drafts a reply about special opening hours. A staff
    member checks the cited schedule before sending it. Specify what the assistant prepares, what the person
    verifies, and who may take the final action. Different tasks need different knowledge and authority.'
  text_mode: '**Human review** means a person checks or decides some part of the workflow. “A human is involved”
    is too vague to evaluate. In our library, an assistant drafts a reply about special opening hours. A staff
    member checks the cited schedule before sending it. Specify what the assistant prepares, what the person
    verifies, and who may take the final action. Different tasks need different knowledge and authority.'
  bridges: []
- id: human-review-and-user-experience.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.human-review-and-user-experience
  title: Put the evidence beside the claim
  markdown: Show the proposed answer, the relevant source passage, its date, and any missing information. If
    a draft says the library opens at nine while the schedule says ten, the reviewer should see that disagreement
    without hunting through several screens. **Provenance** is the information’s origin and history. A fluent
    explanation from the assistant is not a substitute for the underlying evidence. Make the important facts
    easy to inspect.
  text_mode: Show the proposed answer, the relevant source passage, its date, and any missing information.
    If a draft says the library opens at nine while the schedule says ten, the reviewer should see that disagreement
    without hunting through several screens. **Provenance** is the information’s origin and history. A fluent
    explanation from the assistant is not a substitute for the underlying evidence. Make the important facts
    easy to inspect.
  bridges: []
- id: human-review-and-user-experience.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.human-review-and-user-experience
  title: Make approval mean something specific
  markdown: 'An approval button should explain its effect: “Send this reply to this visitor” is clearer than
    “Looks good.” Let the reviewer edit or reject the draft and see the final version before sending. A **permission**
    defines what an actor is allowed to do. Reviewing text need not grant permission for the assistant to change
    bookings or accounts. Keep the action and its scope understandable to the person responsible.'
  text_mode: 'An approval button should explain its effect: “Send this reply to this visitor” is clearer than
    “Looks good.” Let the reviewer edit or reject the draft and see the final version before sending. A **permission**
    defines what an actor is allowed to do. Reviewing text need not grant permission for the assistant to change
    bookings or accounts. Keep the action and its scope understandable to the person responsible.'
  bridges: []
- id: human-review-and-user-experience.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.human-review-and-user-experience
  title: Give uncertainty a usable next step
  markdown: If the source does not include holiday hours, the reviewer needs a route to someone who knows,
    or a way to send a clear request for clarification. **Escalation** means passing a case to someone with
    appropriate authority or expertise. It needs an owner and a realistic response process. A queue labeled
    “human review” does not help if nobody can resolve it. Include accessible controls and recovery when a
    correction goes wrong.
  text_mode: If the source does not include holiday hours, the reviewer needs a route to someone who knows,
    or a way to send a clear request for clarification. **Escalation** means passing a case to someone with
    appropriate authority or expertise. It needs an owner and a realistic response process. A queue labeled
    “human review” does not help if nobody can resolve it. Include accessible controls and recovery when a
    correction goes wrong.
  bridges: []
- id: human-review-and-user-experience.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.human-review-and-user-experience
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Give the reviewer evidence, time, clear control, and a way to correct the result. Measure the whole
    team.
- id: human-review-and-user-experience.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.human-review-and-user-experience
  markdown: Human-in-the-loop design needs clear evidence, correction, escalation, and responsibility; measure
    the combined human-system workflow rather than assuming human presence removes errors.
  text_mode: Human-in-the-loop design needs clear evidence, correction, escalation, and responsibility; measure
    the combined human-system workflow rather than assuming human presence removes errors.
- id: human-review-and-user-experience.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.human-review-and-user-experience
  title: Check for the rubber-stamp trap
  markdown: '**Automation bias** is a tendency to give undue weight to an automated suggestion. Under time
    pressure, reviewers may approve a confident draft without checking its source. Test the interface with
    representative people and deliberately included errors. Measure missed mistakes, false corrections, completion
    time, and workload. Compare with their previous process. A person’s presence may improve results, but an
    overloaded review step can also become a new failure point.'
  text_mode: '**Automation bias** is a tendency to give undue weight to an automated suggestion. Under time
    pressure, reviewers may approve a confident draft without checking its source. Test the interface with
    representative people and deliberately included errors. Measure missed mistakes, false corrections, completion
    time, and workload. Compare with their previous process. A person’s presence may improve results, but an
    overloaded review step can also become a new failure point.'
  bridges: []
- id: human-review-and-user-experience.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.human-review-and-user-experience
  title: Evaluate the team, not just the draft
  markdown: Suppose the model writes faster but reviewers spend longer untangling unsupported claims. Its speed
    alone does not establish an improvement. Review outcomes after correction, how often users can recover,
    and whether important cases reach qualified staff. Save corrections with enough context to investigate,
    respecting the workflow’s data boundaries. Check whether reviewers actually have the evidence, authority,
    time, and recovery options needed to do this work.
  text_mode: Suppose the model writes faster but reviewers spend longer untangling unsupported claims. Its
    speed alone does not establish an improvement. Review outcomes after correction, how often users can recover,
    and whether important cases reach qualified staff. Save corrections with enough context to investigate,
    respecting the workflow’s data boundaries. Check whether reviewers actually have the evidence, authority,
    time, and recovery options needed to do this work.
  bridges: []
- id: human-review-and-user-experience.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.human-review-and-user-experience
  title: Repair the review desk
  markdown: Staff see a confident answer and one “Approve” button, but no schedule or edit control. What improvement
    best supports checking?
  text_mode: Staff see a confident answer and one “Approve” button, but no schedule or edit control. What improvement
    best supports checking?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: Show the dated source, allow correction, and explain the send action.
    - id: b
      text: Make the answer’s wording more confident before review.
    - id: c
      text: Hide uncertain cases so reviewers process the queue faster.
    answer: a
    reveal_markdown: Review requires evidence and meaningful control. Confidence and faster approval alone
      do not help staff detect the factual mistake.
    hint: Trace the example using the rule from the preceding pages.
    id: human-review-and-user-experience.practice.v2.7
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - human-review-and-user-experience.s1
    - human-review-and-user-experience.s2
    - human-review-and-user-experience.s3
    - human-review-and-user-experience.s4
    - human-review-and-user-experience.s5
    - human-review-and-user-experience.s6
    - human-review-and-user-experience.s7
    - human-review-and-user-experience.check
    gate_refs:
    - gate.core
  scene_aliases:
    human-review-and-user-experience.recap: human-review-and-user-experience.check
assessment_families:
- id: human-review-and-user-experience.base
  objective_ref: objective.human-review-and-user-experience
  task: base
  response_type: single_choice
  points: 1
  hint: 'Make evidence easy to inspect: trace the inputs, operation, and result before choosing.'
  remediation_scene: human-review-and-user-experience.s2
  variants:
  - id: human-review-and-user-experience.base.1
    prompt: Does adding a human approval button automatically remove model errors?
    options:
    - id: c
      text: Only if the button is prominent
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Review needs evidence, time, and a usable decision scope.
    retired: true
  - id: human-review-and-user-experience.base.2
    prompt: What can a confident wrong suggestion cause?
    options:
    - id: a
      text: Anchoring or overreliance
    - id: b
      text: Guaranteed error detection
    - id: c
      text: Only visual clutter
    answer: a
    feedback: Presentation can influence human judgment.
    retired: true
- id: human-review-and-user-experience.transfer
  objective_ref: objective.human-review-and-user-experience
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate joint performance: trace the inputs, operation, and result before choosing.'
  remediation_scene: human-review-and-user-experience.s4
  variants:
  - id: human-review-and-user-experience.transfer.1
    prompt: What should an approval interface make clear?
    options:
    - id: a
      text: The action and consequences being approved
    - id: b
      text: Only the model’s name
    - id: c
      text: That every future action is approved
    answer: a
    feedback: Users need concrete scope.
    retired: true
  - id: human-review-and-user-experience.transfer.2
    prompt: Which outcome should evaluate a human-model workflow?
    options:
    - id: b
      text: Only model accuracy before review
    - id: c
      text: Only number of clicks
    - id: a
      text: Combined final quality, time, workload, and correction behavior
    answer: a
    feedback: The product’s value includes human interaction costs.
    retired: true
- id: human-review-and-user-experience.base.v2
  objective_ref: objective.human-review-and-user-experience
  task: base
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: human-review-and-user-experience.s3
  variants:
  - prompt: What must a human-review role specify?
    answer: a
    options:
    - id: a
      text: What the person checks and what they may decide
    - id: b
      text: Only that a person is somewhere in the workflow
    - id: c
      text: Only the number of items approved per hour
    feedback: A role needs a defined responsibility and authority.
    id: human-review-and-user-experience.base.v2.1
  - prompt: What helps verify a schedule claim?
    answer: a
    options:
    - id: b
      text: The assistant’s confidence of tone
    - id: a
      text: The relevant dated source passage
    - id: c
      text: A second paraphrase from the same draft
    feedback: Review should inspect evidence for the claim.
    id: human-review-and-user-experience.base.v2.2
  - prompt: What makes approval meaningful?
    answer: a
    options:
    - id: c
      text: The same label for sending and saving a draft
    - id: b
      text: A general button without explaining its effect
    - id: a
      text: A clear action scope and a chance to correct or reject
    feedback: The reviewer needs to understand what their action authorizes.
    id: human-review-and-user-experience.base.v2.3
  - prompt: What is automation bias in this setting?
    answer: a
    options:
    - id: a
      text: Giving undue weight to the automated suggestion
    - id: c
      text: The model’s tendency to output longer sentences
    - id: b
      text: Any disagreement between two human reviewers
    feedback: Reviewers can over-trust a suggestion despite contrary evidence.
    id: human-review-and-user-experience.base.v2.4
- id: human-review-and-user-experience.transfer.v2
  objective_ref: objective.human-review-and-user-experience
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: human-review-and-user-experience.s3
  variants:
  - prompt: The review queue is growing and staff stop reading sources. What needs evaluation?
    answer: a
    options:
    - id: a
      text: Workload and actual error detection in the combined workflow
    - id: c
      text: Only the number of approvals recorded
    - id: b
      text: Only the model’s generation speed
    feedback: Throughput is insufficient if review no longer catches mistakes.
    id: human-review-and-user-experience.transfer.v2.1
  - prompt: A person approves a draft but the system also changes a booking. What is wrong?
    answer: a
    options:
    - id: a
      text: The action exceeded the understood approval scope
    - id: b
      text: The draft must have had a low probability
    - id: c
      text: The source passage needs a shorter summary
    feedback: Approval should authorize a specific understood action.
    id: human-review-and-user-experience.transfer.v2.2
  - prompt: A case needs expertise the assigned reviewer lacks. What should the design provide?
    answer: a
    options:
    - id: b
      text: A longer generated explanation in place of expertise
    - id: c
      text: Automatic approval after a waiting period
    - id: a
      text: Escalation to an appropriate responsible person
    feedback: A usable escalation route connects cases to the needed authority.
    id: human-review-and-user-experience.transfer.v2.3
  - prompt: Drafting time falls but correction time rises more. What should decide success?
    answer: a
    options:
    - id: c
      text: The average length of generated answers
    - id: a
      text: Final task quality and total workflow effort
    - id: b
      text: Drafting speed by itself
    feedback: The entire task is the unit of evaluation.
    id: human-review-and-user-experience.transfer.v2.4
