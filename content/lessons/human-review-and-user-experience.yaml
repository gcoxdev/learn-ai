schema_version: 0.2-draft
lesson:
  id: human-review-and-user-experience
  version: 0.3.0-draft
  title: Give people useful control over model-assisted work
  state: draft
  summary: The assistant now writes replies to 800 emails a day, and two librarians check the risky ones. Work out which ones they can check, and why "approve" can quietly become a rubber stamp.
  slot: M33.6
  category: learning
  sources:
    - title: Guidelines for Human-AI Interaction (Amershi et al., CHI 2019)
      url: https://www.microsoft.com/en-us/research/publication/guidelines-for-human-ai-interaction/
    - title: "Complacency and Bias in Human Use of Automation: An Attentional Integration (Parasuraman & Manzey, Human Factors, 2010)"
      url: https://journals.sagepub.com/doi/10.1177/0018720810376055
    - title: The ML Test Score (Breck et al., 2017)
      url: https://research.google/pubs/the-ml-test-score-a-rubric-for-ml-production-readiness-and-technical-debt-reduction/
  archetype: mechanism
objectives:
  - id: objective.human-review-and-user-experience
    version: 3-draft
    statement: Design human review for a model-assisted workflow, choosing a confidence threshold that fits review capacity, giving reviewers evidence and clear authority, guarding against automation bias, and turning corrections into feedback.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - human-review-and-user-experience.base.v3
      - human-review-and-user-experience.transfer.v3
      - human-review-and-user-experience.calc.v3
    prerequisites:
      - anyOf:
          - objective.stakeholders-and-deployment-decisions
      - anyOf:
          - objective.human-and-model-judges
scenes:
  - id: human-review-and-user-experience.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.human-review-and-user-experience
    title: Give the person a real job
    markdown: |-
      Linden's assistant now handles email too. About 800 visitor emails arrive a day, and for each one the assistant writes a suggested reply with a cited source. Sending all 800 unchecked is too risky; checking all 800 would take 33 staff-hours a day.

      **Human-in-the-loop** review means a person checks or decides part of an automated workflow. "A human is involved" isn't a design. A design says what the model prepares (a suggested reply and its source), what the person verifies (that the hours match the source), and who may act (only the reviewer can press Send). The next two scenes decide *which* replies reach a person.

      :::mixup "There's a human in the loop, so errors get caught."
      A person catches only what they have the time, the evidence, and the attention to check. This lesson measures all three.
      :::
    bridges: []
  - id: human-review-and-user-experience.threshold
    title: Route by confidence
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.human-review-and-user-experience
    markdown: |-
      The assistant attaches a confidence score from 0 to 1 to each reply. A **confidence threshold** routes every reply scored below it to a person and sends the rest automatically. The score is useful only if it's calibrated, as in the lesson "Measure the behavior that the task actually needs," so the team checks it on 1,000 past replies, 60 of which were wrong:

      | Review replies below | Share reviewed | Wrong replies caught for review | Wrong replies sent unchecked |
      | ---: | ---: | ---: | ---: |
      | 0.6 | 10% | 30 of 60 | 30 |
      | 0.8 | 30% | 48 of 60 | 12 |
      | 0.9 | 50% | 55 of 60 | 5 |

      Raising the threshold catches more errors but sends more work to people. Which one to pick depends on something the table doesn't show: how much work the people can do.
    diagram:
      caption: How each email reply is routed, and where corrections go.
      description: A visitor email goes to the assistant, which writes a reply with a source and a confidence score. Replies scored at or above the threshold are sent automatically. Replies below it go to the review queue, where a reviewer sees the source beside the reply and can send, edit, or escalate to the branch manager. Every edit is saved with a reason in a corrections log, which feeds fixes and the release test set.
      nodes:
        - id: email
          label: Visitor email
          col: 0
          row: 1
        - id: assistant
          label: Assistant
          note: reply + source + confidence
          col: 1
          row: 1
        - id: auto
          label: Sent automatically
          note: confidence at or above threshold
          col: 2
          row: 0
          tone: data
        - id: queue
          label: Review queue
          note: confidence below threshold
          col: 2
          row: 2
          tone: warn
        - id: reviewer
          label: Reviewer
          note: reply beside its source
          col: 3
          row: 2
          tone: accent
        - id: escalate
          label: Branch manager
          note: escalated cases
          col: 4
          row: 1
        - id: log
          label: Corrections log
          note: edit + reason code
          col: 4
          row: 3
          tone: muted
      edges:
        - from: email
          to: assistant
        - from: assistant
          to: auto
          label: high score
        - from: assistant
          to: queue
          label: low score
        - from: queue
          to: reviewer
        - from: reviewer
          to: escalate
          label: needs expert
        - from: reviewer
          to: log
          label: edits
  - id: human-review-and-user-experience.capacity
    title: Can the team keep up?
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.human-review-and-user-experience
    markdown: |-
      **Review capacity** is the number of items reviewers can finish per day. Linden has two librarians for three hours a day each, 360 minutes, and each check takes about 2.5 minutes. At threshold 0.8, 30% of 800 = 240 replies need review, and 240 × 2.5 = 600 minutes. That's 240 minutes more than the team has, every day.

      Worse, planning to use every minute fails too. Reviews arrive in bursts, and a queue run at 100% load never catches up, as the next lesson shows. Plan for about 80%:

      ```python run
      emails_per_day = 800
      minutes_per_review = 2.5
      staff_minutes = 2 * 3 * 60      # two reviewers, three hours a day each
      target_load = 0.8               # keep 20% slack so the queue can drain

      # from 1,000 test replies, 60 of them wrong: share routed to staff, wrong ones routed
      thresholds = {0.6: (0.10, 30), 0.8: (0.30, 48), 0.9: (0.50, 55)}

      print("below  reviews/day  minutes  staff-hours  wrong sent unchecked/day")
      for t, (share, caught) in thresholds.items():
          reviews = emails_per_day * share
          minutes = reviews * minutes_per_review
          hours = minutes / target_load / 60
          unchecked = emails_per_day * (60 - caught) / 1000
          verdict = "fits" if minutes <= staff_minutes * target_load else "queue grows"
          print(f"{t:5}  {reviews:11.0f}  {minutes:7.0f}  {hours:11.1f}  {unchecked:10.1f}   {verdict}")
      ```

      :::predict Only threshold 0.6 fits. What does that cost, and what are the alternatives?
      At 0.6, about 24 wrong replies a day go out unchecked, against 9.6 at 0.8. To afford 0.8, Linden needs 12.5 staff-hours a day instead of 6. The other levers: make each check faster (2.5 → 1.5 minutes brings 0.8 down to 7.5 hours), or narrow the scope, so the assistant only answers the simplest kinds of email.
      :::
  - id: human-review-and-user-experience.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.human-review-and-user-experience
    title: Put the evidence beside the claim
    markdown: A reviewer can only check what they can see. Linden's review screen puts the suggested reply on the left and the cited closures-page passage on the right, with the date the page was last updated. If the reply says Eastside opens at 9 and the passage says 10, the mismatch is visible at a glance, not three clicks away. Keeping the source and its date attached to every claim is **provenance**, and it's what turns a 2.5-minute check into a real one.
    bridges: []
  - id: human-review-and-user-experience.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.human-review-and-user-experience
    title: Make approval mean something specific
    markdown: 'The button says "Send this reply to jordan@example.org," not "Looks good." The reviewer can edit the text or reject it before sending. Approving a reply grants no other **permission**, meaning the actions someone is allowed to take: if a reply offers to place a hold, the hold is a separate action the reviewer confirms separately. Approval should cover exactly what the person saw.'
    bridges: []
  - id: human-review-and-user-experience.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.human-review-and-user-experience
    title: Give hard cases somewhere to go
    markdown: "Some emails need knowledge the reviewer doesn't have: a disputed fine, an accessibility request. **Escalation** passes a case to someone with the right authority, and it needs a named owner and a response time, here the branch manager within one working day. A \"needs expert\" button that drops cases into an unwatched folder is worse than none, because it looks like a solution."
    bridges: []
  - id: human-review-and-user-experience.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.human-review-and-user-experience
    markdown: A hospital's triage notes, an insurer's claim queue, a moderation team, and a set of review-capacity sums test whether you can design review people can actually do.
    takeaway: Pick a confidence threshold your reviewers can keep up with at about 80% load, show them the evidence, make approval specific, measure how many planted errors they catch, and turn every correction into a fix and a test case.
  - id: human-review-and-user-experience.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.human-review-and-user-experience
    markdown: |-
      Human-in-the-loop design needs clear evidence, correction, escalation, and responsibility; measure the combined human-system workflow rather than assuming human presence removes errors.
  - id: human-review-and-user-experience.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.human-review-and-user-experience
    title: The rubber-stamp trap
    markdown: |-
      **Automation bias** is the tendency to accept an automated suggestion without checking it enough. Parasuraman and Manzey's 2010 review found it in novices and experts alike, and found that training or instructions alone don't prevent it. Busy reviewers facing a fluent reply and a big green button approve it.

      So Linden tests its reviewers the way you'd test a model: it plants 20 replies with known wrong hours among 400 real ones. With the reply shown first, reviewers catch 11 of 20. When the screen asks them to type the hours from the source *before* revealing the assistant's answer, they catch 17 of 20.

      That difference matters at scale. At threshold 0.8, about 38 wrong replies a day reach reviewers. Catching 55% lets 17 through; catching 85% lets 6 through. A review step is only as good as its catch rate, so measure it.
    bridges: []
  - id: human-review-and-user-experience.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.human-review-and-user-experience
    title: Turn every correction into data
    markdown: |-
      Each edit a reviewer makes is a free label: the suggested reply, the corrected one, and a one-click reason. Last month's 600 corrections broke down like this:

      | Reason | Corrections | Fix points to |
      | --- | ---: | --- |
      | Outdated source | 250 | The closures page owner |
      | Wrong branch | 180 | Retrieval: filter by branch |
      | Tone | 120 | The prompt |
      | Other | 50 | Read them |

      Reason codes send each problem to the person who can fix it, and the corrected replies join the release test set. Visitors can correct things too: the "Wrong answer?" link from the first lesson feeds the same queue. Judge the design by what visitors finally receive after review, not by the assistant's score on its own.
    bridges: []
  - id: human-review-and-user-experience.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.human-review-and-user-experience
    title: Repair the review desk
    markdown: |-
      Staff see a confident answer and one “Approve” button, but no schedule or edit control. What improvement best supports checking?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: Show the dated source, allow correction, and explain the send action.
        - id: b
          text: Make the answer’s wording more confident before review.
        - id: c
          text: Hide uncertain cases so reviewers process the queue faster.
      answer: a
      reveal_markdown: Showing the dated schedule gives the reviewer evidence, an edit control lets them fix the error, and a specific "send" label says what approval does. Making the answer sound surer, or hiding hard cases, only speeds up the rubber stamp.
      hint: A reviewer needs something to check the claim against, and a way to act on what they find.
      id: human-review-and-user-experience.practice.v2.7
navigation:
  routes:
    - id: route.core
      scene_sequence:
