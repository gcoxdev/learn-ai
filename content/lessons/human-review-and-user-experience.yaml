assessment_families:
  - id: human-review-and-user-experience.base
    objective_ref: objective.human-review-and-user-experience
    task: base
    response_type: single_choice
    points: 1
    hint: 'Make evidence easy to inspect: trace the inputs, operation, and result before choosing.'
    remediation_scene: human-review-and-user-experience.s2
    variants:
      - id: human-review-and-user-experience.base.1
        prompt: Does adding a human approval button automatically remove model errors?
        options:
          - id: c
            text: Only if the button is prominent
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Review needs evidence, time, and a usable decision scope.
        retired: true
      - id: human-review-and-user-experience.base.2
        prompt: What can a confident wrong suggestion cause?
        options:
          - id: a
            text: Anchoring or overreliance
          - id: b
            text: Guaranteed error detection
          - id: c
            text: Only visual clutter
        answer: a
        feedback: Presentation can influence human judgment.
        retired: true
  - id: human-review-and-user-experience.transfer
    objective_ref: objective.human-review-and-user-experience
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate joint performance: trace the inputs, operation, and result before choosing.'
    remediation_scene: human-review-and-user-experience.s4
    variants:
      - id: human-review-and-user-experience.transfer.1
        prompt: What should an approval interface make clear?
        options:
          - id: a
            text: The action and consequences being approved
          - id: b
            text: Only the model’s name
          - id: c
            text: That every future action is approved
        answer: a
        feedback: Users need concrete scope.
        retired: true
      - id: human-review-and-user-experience.transfer.2
        prompt: Which outcome should evaluate a human-model workflow?
        options:
          - id: b
            text: Only model accuracy before review
          - id: c
            text: Only number of clicks
          - id: a
            text: Combined final quality, time, workload, and correction behavior
        answer: a
        feedback: The product’s value includes human interaction costs.
        retired: true
  - id: human-review-and-user-experience.base.v2
    objective_ref: objective.human-review-and-user-experience
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: human-review-and-user-experience.s3
    variants:
      - prompt: What must a human-review role specify?
        answer: a
        options:
          - id: a
            text: What the person checks and what they may decide
          - id: b
            text: Only that a person is somewhere in the workflow
          - id: c
            text: Only the number of items approved per hour
        feedback: A role needs a defined responsibility and authority.
        id: human-review-and-user-experience.base.v2.1
        retired: true
      - prompt: What helps verify a schedule claim?
        answer: a
        options:
          - id: b
            text: The assistant’s confidence of tone
          - id: a
            text: The relevant dated source passage
          - id: c
            text: A second paraphrase from the same draft
        feedback: Review should inspect evidence for the claim.
        id: human-review-and-user-experience.base.v2.2
        retired: true
      - prompt: What makes approval meaningful?
        answer: a
        options:
          - id: c
            text: The same label for sending and saving a draft
          - id: b
            text: A general button without explaining its effect
          - id: a
            text: A clear action scope and a chance to correct or reject
        feedback: The reviewer needs to understand what their action authorizes.
        id: human-review-and-user-experience.base.v2.3
        retired: true
      - prompt: What is automation bias in this setting?
        answer: a
        options:
          - id: a
            text: Giving undue weight to the automated suggestion
          - id: c
            text: The model’s tendency to output longer sentences
          - id: b
            text: Any disagreement between two human reviewers
        feedback: Reviewers can over-trust a suggestion despite contrary evidence.
        id: human-review-and-user-experience.base.v2.4
        retired: true
  - id: human-review-and-user-experience.transfer.v2
    objective_ref: objective.human-review-and-user-experience
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: human-review-and-user-experience.s3
    variants:
      - prompt: The review queue is growing and staff stop reading sources. What needs evaluation?
        answer: a
        options:
          - id: a
            text: Workload and actual error detection in the combined workflow
          - id: c
            text: Only the number of approvals recorded
          - id: b
            text: Only the model’s generation speed
        feedback: Throughput is insufficient if review no longer catches mistakes.
        id: human-review-and-user-experience.transfer.v2.1
        retired: true
      - prompt: A person approves a draft but the system also changes a booking. What is wrong?
        answer: a
        options:
          - id: a
            text: The action exceeded the understood approval scope
          - id: b
            text: The draft must have had a low probability
          - id: c
            text: The source passage needs a shorter summary
        feedback: Approval should authorize a specific understood action.
        id: human-review-and-user-experience.transfer.v2.2
        retired: true
      - prompt: A case needs expertise the assigned reviewer lacks. What should the design provide?
        answer: a
        options:
          - id: b
            text: A longer generated explanation in place of expertise
          - id: c
            text: Automatic approval after a waiting period
          - id: a
            text: Escalation to an appropriate responsible person
        feedback: A usable escalation route connects cases to the needed authority.
        id: human-review-and-user-experience.transfer.v2.3
        retired: true
      - prompt: Drafting time falls but correction time rises more. What should decide success?
        answer: a
        options:
          - id: c
            text: The average length of generated answers
          - id: a
            text: Final task quality and total workflow effort
          - id: b
            text: Drafting speed by itself
        feedback: The entire task is the unit of evaluation.
        id: human-review-and-user-experience.transfer.v2.4
        retired: true
  - id: human-review-and-user-experience.base.v3
    objective_ref: objective.human-review-and-user-experience
    task: base
    response_type: single_choice
    points: 1
    hint: A higher threshold sends more items to people; check that the minutes fit the team at about 80% load, and that reviewers can actually catch what reaches them.
    remediation_scene: human-review-and-user-experience.capacity
    variants:
      - id: human-review-and-user-experience.base.v3.1
        prompt: A team raises its review threshold from 0.6 to 0.8. What happens?
        options:
          - id: b
            text: Fewer replies reach reviewers, and fewer errors go out unchecked
          - id: a
            text: More replies reach reviewers, and fewer errors go out unchecked
          - id: c
            text: More replies reach reviewers, and more errors go out unchecked
        answer: a
        feedback: Replies scored below the threshold go to people, so a higher threshold routes more of them, including more of the wrong ones. The catch is the extra review work, which must fit the team's capacity.
      - id: human-review-and-user-experience.base.v3.2
        prompt: Reviewers have 360 minutes a day. At the chosen threshold, 240 replies a day need review at 2.5 minutes each. What will happen?
        options:
          - id: c
            text: It fits, since reviewers work faster when a queue builds up
          - id: b
            text: It fits, since 240 replies is fewer than the 360 minutes
          - id: a
            text: The queue grows by about 96 replies' worth of work each day
        answer: a
        feedback: 240 × 2.5 = 600 minutes of work against 360 available, a 240-minute shortfall, about 96 replies a day. Comparing replies with minutes mixes units, and hoping reviewers speed up is how rubber-stamping starts.
      - id: human-review-and-user-experience.base.v3.3
        prompt: Planted-error tests show reviewers catch 11 of 20 wrong replies when the assistant's answer is shown first. Which change targets the cause?
        options:
          - id: a
            text: Ask reviewers to read the source value before revealing the answer
          - id: b
            text: Show the assistant's confidence score in larger, bolder type
          - id: c
            text: Remind reviewers in a banner to check each reply carefully
        answer: a
        feedback: Automation bias comes from anchoring on the suggestion, so having reviewers form their own answer first breaks the anchor. Bigger confidence scores strengthen the anchor, and reminders are the kind of instruction that research finds doesn't prevent the bias.
      - id: human-review-and-user-experience.base.v3.4
        prompt: Reviewers' corrections are saved with a reason. Most say "outdated source." Where should that fix go?
        options:
          - id: b
            text: Into the prompt, telling the model to prefer recent information
          - id: a
            text: To the owner of the source page, to keep it up to date
          - id: c
            text: Into a retraining set, so the model learns the new hours
        answer: a
        feedback: The assistant repeated what the source said; the source was stale. Fixing the page fixes every future answer. Prompting or retraining the model can't make it know hours that nobody published.
  - id: human-review-and-user-experience.transfer.v3
    objective_ref: objective.human-review-and-user-experience
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what the reviewer can see, what their approval actually does, how many items they can really check, and where hard cases and corrections go.
    remediation_scene: human-review-and-user-experience.s5
    variants:
      - id: human-review-and-user-experience.transfer.v3.1
        prompt: A hospital's model suggests triage notes, and nurses approve 99% of them in under ten seconds each. What should the team measure first?
        options:
          - id: a
            text: How many planted errors the nurses catch during normal shifts
          - id: c
            text: How satisfied the nurses are with the model's suggestions
          - id: b
            text: How much time the model's suggestions save each nurse per shift
        answer: a
        feedback: A 99% approval rate in seconds could mean the model is excellent or that nobody is really checking. Planted errors tell the two apart. Satisfaction and time saved can both look great while errors slip through.
      - id: human-review-and-user-experience.transfer.v3.2
        prompt: An insurer's claim-review queue holds 3 days of work and grows every week. Reviewers are already at full load. Which fix is sound?
        options:
          - id: b
            text: Ask reviewers to spend less time per claim until the queue clears
          - id: a
            text: Lower the threshold or add staff so the load drops to about 80%
          - id: c
            text: Approve any claim that has waited over 3 days to keep things moving
        answer: a
        feedback: A queue at full load keeps growing, so either less work must reach people or more people must do it. Rushing each check invites rubber-stamping, and auto-approving old claims sends the least-checked work out the door.
      - id: human-review-and-user-experience.transfer.v3.3
        prompt: On a moderation tool, the button "Approve" both publishes a post and adds its author to a trusted list. What is wrong?
        options:
          - id: c
            text: The button's label is too short to read quickly
          - id: b
            text: The trusted list should be kept on another screen
          - id: a
            text: One approval grants a second, unseen permission
        answer: a
        feedback: Approval should cover exactly what the person saw and meant to allow. Publishing one post and trusting its author for the future are separate decisions, each deserving its own confirmation.
      - id: human-review-and-user-experience.transfer.v3.4
        prompt: A tax helpline's model flags complex cases with a "needs expert" button, but flagged cases go to a shared inbox nobody is assigned to. What is missing?
        options:
          - id: a
            text: A named owner and a response time for escalated cases
          - id: b
            text: A higher threshold so that fewer cases are flagged at all
          - id: c
            text: A longer model explanation attached to each flagged case
        answer: a
        feedback: Escalation only works if someone with the right authority is responsible for answering, by a set time. Flagging fewer cases hides the problem, and a longer explanation doesn't replace an expert.
  - id: human-review-and-user-experience.calc.v3
    objective_ref: objective.human-review-and-user-experience
    task: base
    response_type: numeric
    points: 1
    hint: Review minutes = items × minutes per item. Staff time needed = review minutes ÷ target load. Divide minutes by 60 for hours.
    remediation_scene: human-review-and-user-experience.capacity
    absolute_tolerance: 0.05
    variants:
      - id: human-review-and-user-experience.calc.v3.1
        prompt: A review queue receives 300 items a day, and each takes 4 minutes to check. How many reviewer-hours of work is that per day?
        answer: 20
        feedback: 300 × 4 = 1,200 minutes, and 1,200 ÷ 60 = 20 hours of review work a day, before adding any slack.
      - id: human-review-and-user-experience.calc.v3.2
        prompt: A team has 480 minutes of review work a day and plans for reviewers to be busy 80% of the time. How many staff-hours a day should it schedule?
        answer: 10
        feedback: 480 ÷ 0.8 = 600 minutes, which is 10 hours. The extra 2 hours is the slack that lets bursts drain.
      - id: human-review-and-user-experience.calc.v3.3
        prompt: Two reviewers each work 4 hours a day, and each check takes 3 minutes. At 100% load, what is the most items they can check per day?
        answer: 160
        feedback: 2 × 4 × 60 = 480 minutes, and 480 ÷ 3 = 160 items. Planning at 80% load would allow 128.
      - id: human-review-and-user-experience.calc.v3.4
