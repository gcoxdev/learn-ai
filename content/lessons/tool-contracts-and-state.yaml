schema_version: 0.2-draft
lesson:
  id: tool-contracts-and-state
  version: 0.1.0-draft
  title: Make actions and observations explicit data contracts
  state: draft
  summary: Tool-using systems need validated arguments, defined results, persistent task state, and error semantics;
    syntactically valid structured output does not establish a correct or authorized action.
  slot: M25.2
  category: learning
  minutes: 12
  sources:
  - title: ReAct
    url: https://arxiv.org/abs/2210.03629
  - title: JSON Schema — specification
    url: https://json-schema.org/specification
objectives:
- id: objective.tool-contracts-and-state
  version: 1-draft
  statement: Tool-using systems need validated arguments, defined results, persistent task state, and error semantics;
    syntactically valid structured output does not establish a correct or authorized action.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - tool-contracts-and-state.base
  - tool-contracts-and-state.transfer
  prerequisites:
  - anyOf:
    - objective.agents-and-workflows
scenes:
- id: tool-contracts-and-state.s1
  title: Define an operation precisely
  type: explanation
  depth: intuition
  objective_refs:
  - objective.tool-contracts-and-state
  markdown: A tool contract names inputs, types, required fields, allowed ranges, and returned results. A search
    tool might require a query and maximum result count. Schema validation can reject malformed arguments, but a
    valid query can still be irrelevant, misleading, or outside the intended task.
  text_mode: A tool contract names inputs, types, required fields, allowed ranges, and returned results. A search
    tool might require a query and maximum result count. Schema validation can reject malformed arguments, but a
    valid query can still be irrelevant, misleading, or outside the intended task.
  bridges: []
- id: tool-contracts-and-state.s2
  title: Distinguish request, execution, and result
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tool-contracts-and-state
  markdown: Assign an action identifier and record whether it was proposed, accepted, running, succeeded, or failed.
    A timeout may mean the result is unknown rather than that no effect occurred. This distinction matters when
    retries could duplicate an external operation.
  text_mode: Assign an action identifier and record whether it was proposed, accepted, running, succeeded, or failed.
    A timeout may mean the result is unknown rather than that no effect occurred. This distinction matters when
    retries could duplicate an external operation.
  bridges: []
- id: tool-contracts-and-state.s3
  title: Keep state outside an unreliable narrative
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tool-contracts-and-state
  markdown: Store important task facts, completed actions, and pending dependencies in explicit structures. A generated
    summary may omit a failed step or invent completion. For a two-document comparison, track each document’s version
    and availability instead of relying only on conversational recollection.
  text_mode: Store important task facts, completed actions, and pending dependencies in explicit structures. A generated
    summary may omit a failed step or invent completion. For a two-document comparison, track each document’s version
    and availability instead of relying only on conversational recollection.
  bridges: []
- id: tool-contracts-and-state.s4
  title: Handle errors as observations
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tool-contracts-and-state
  markdown: Return clear bounded errors and decide whether to retry, change inputs, recover, or escalate. Validate
    outputs too, including units and identifiers. Structured JSON helps programs parse data; it does not prove the
    data are true or that execution satisfied the user’s objective.
  text_mode: Return clear bounded errors and decide whether to retry, change inputs, recover, or escalate. Validate
    outputs too, including units and identifiers. Structured JSON helps programs parse data; it does not prove the
    data are true or that execution satisfied the user’s objective.
  bridges: []
- id: tool-contracts-and-state.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.tool-contracts-and-state
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Tool-using systems need validated arguments, defined results, persistent task state, and error semantics;
    syntactically valid structured output does not establish a correct or authorized action.
- id: tool-contracts-and-state.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.tool-contracts-and-state
  markdown: Tool-using systems need validated arguments, defined results, persistent task state, and error semantics;
    syntactically valid structured output does not establish a correct or authorized action.
  text_mode: Tool-using systems need validated arguments, defined results, persistent task state, and error semantics;
    syntactically valid structured output does not establish a correct or authorized action.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - tool-contracts-and-state.s1
    - tool-contracts-and-state.s2
    - tool-contracts-and-state.s3
    - tool-contracts-and-state.s4
