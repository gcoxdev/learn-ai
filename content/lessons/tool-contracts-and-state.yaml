schema_version: 0.2-draft
lesson:
  id: tool-contracts-and-state
  version: 0.4.0-draft
  title: Give tools clear inputs, results, and state
  state: draft
  summary: Wayfarer asked the hotel for "two" nights, then booked the room twice. Learn the contracts, request states, and retry keys that keep tool calls honest.
  slot: M25.2
  category: learning
  sources:
    - title: ReAct
      url: https://arxiv.org/abs/2210.03629
    - title: JSON Schema — specification
      url: https://json-schema.org/specification
    - title: Introducing the Model Context Protocol (Anthropic, November 2024)
      url: https://www.anthropic.com/news/model-context-protocol
    - title: Model Context Protocol — specification
      url: https://modelcontextprotocol.io/specification
    - title: Tool use with Claude (Anthropic documentation)
      url: https://docs.anthropic.com/en/docs/agents-and-tools/tool-use/overview
    - title: Idempotent requests (Stripe API reference)
      url: https://docs.stripe.com/api/idempotent_requests
objectives:
  - id: objective.tool-contracts-and-state
    version: 2-draft
    statement: Tool-using systems need validated arguments, defined results, persistent task state, and error semantics; well-formed output can still request the wrong action, or one the user never authorized.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - tool-contracts-and-state.base.v2
      - tool-contracts-and-state.transfer.v2
      - tool-contracts-and-state.calculate
    prerequisites:
      - anyOf:
          - objective.agents-and-workflows
scenes:
  - id: tool-contracts-and-state.s1
    title: '"Two nights" is not a number'
    type: explanation
    depth: intuition
    objective_refs:
      - objective.tool-contracts-and-state
    markdown: |-
      A traveler tells Wayfarer: *"Book the Rua Nova Guesthouse for two nights from Friday."* The model answers with a tool call:

      ```json
      {"tool": "book_hotel", "args": {"hotel_id": "rua-nova-lis", "check_in": "2026-07-10", "nights": "two"}}
      ```

      The hotel's booking service expects a number. It might crash, book zero nights, or quietly default to one. The model wrote plausible text, because nobody had told it exactly what `nights` must look like.

      A **tool contract** is that exact description: the tool's name, what it does, which arguments it takes, their types and allowed ranges, and what it returns. The standard way to write the argument part is **JSON Schema**, a vocabulary for describing the shape of JSON data:

      ```json
      {
        "name": "book_hotel",
        "description": "Book a room and charge the user's card. Get hotel_id from search_hotels first.",
        "input_schema": {
          "type": "object",
          "properties": {
            "hotel_id": {"type": "string", "description": "ID returned by search_hotels"},
            "check_in": {"type": "string", "format": "date", "description": "YYYY-MM-DD"},
            "nights":   {"type": "integer", "minimum": 1, "maximum": 30}
          },
          "required": ["hotel_id", "check_in", "nights"],
          "additionalProperties": false
        }
      }
      ```

      Model providers build on this. With **function calling** (also called *tool use*), you send tool definitions like this one with the conversation, and the model can reply with a structured tool call instead of prose. Anthropic's API calls the schema field `input_schema`; OpenAI's calls it `parameters`. Write the description carefully: it's the only manual the model reads.

      :::deeper One contract, many applications
      In November 2024 Anthropic released the **Model Context Protocol (MCP)**, an open standard so that tools are written once and reused everywhere. An MCP *server* offers tools (each with a name, a description, and a JSON Schema for its inputs), plus data *resources* and prompt templates. Any application with an MCP *client* can discover and call them, using JSON-RPC 2.0 messages. OpenAI and Google have since adopted it too. MCP standardizes how tools are described and called; checking the arguments and deciding whether to run them is still your program's job.
      :::
    bridges: []
  - id: tool-contracts-and-state.s4
    title: Error messages the model can act on
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tool-contracts-and-state
    markdown: |-
      A program can check a schema mechanically, before anything touches the real hotel. The validator below checks two bad calls and one good one. Each error names the field, says what was expected, gives an example, and shows what arrived.

      ```python run
      # The book_hotel contract, cut down to the checks that matter here.
      SCHEMA = {
          "required": ["hotel_id", "check_in", "nights"],
          "properties": {
              "hotel_id": {"type": str, "example": "rua-nova-lis"},
              "check_in": {"type": str, "example": "2026-07-10"},
              "nights":   {"type": int, "example": 2, "minimum": 1, "maximum": 30},
          },
      }
      KIND = {int: "a whole number", str: "a string"}

      def validate(args):
          """Return a list of errors written for the model to read and fix."""
          errors = [f"'{f}' is missing; it is required." for f in SCHEMA["required"] if f not in args]
          for field, value in args.items():
              rule = SCHEMA["properties"].get(field)
              if rule is None:
                  errors.append(f"'{field}' is not a field of book_hotel; allowed: {', '.join(SCHEMA['properties'])}.")
              elif type(value) is not rule["type"]:
                  errors.append(f"'{field}' must be {KIND[rule['type']]} like {rule['example']!r}; got {value!r}.")
              elif "minimum" in rule and not rule["minimum"] <= value <= rule["maximum"]:
                  errors.append(f"'{field}' must be from {rule['minimum']} to {rule['maximum']}; got {value}.")
          return errors

      calls = [
          {"hotel_id": "rua-nova-lis", "check_in": "2026-07-10", "nights": "two"},
          {"hotel_id": "rua-nova-lis", "check_in": "2026-07-10", "nights": 0},
          {"hotel_id": "rua-nova-lis", "check_in": "2026-07-10", "nights": 2},
      ]
      for args in calls:
          errors = validate(args)
          verdict = "REJECTED: " + " ".join(errors) if errors else "OK: send to the hotel service"
          print(f"nights={args['nights']!r} -> {verdict}")
      ```

      The first two calls are rejected and the third passes. Now add a line that prints `validate({"hotel_id": "rua-nova-lis", "nights": 2, "guests": 2})`. You get two errors: `check_in` is missing, and `guests` isn't a field, followed by the list of fields that are.

      Why so careful? The rejection goes back into the model's context as the tool result, just as a search result would in the agent loop from the first lesson. *"'nights' must be a whole number like 2; got 'two'"* is an observation the model can act on, and its next move is usually the corrected call. *"Error 400: bad request"* gives it nothing to fix, so it tends to repeat itself or give up.

      :::predict The model's next call is {"hotel_id": "rua-nova-lis", "check_in": "2026-07-10", "nights": 3}. The validator accepts it. Is the call right?
      No: the traveler asked for two. The schema checks the *shape* of the arguments, not whether they match what the user wanted. Catching this takes a second check, against the request the program saved when the task began. That's this lesson's final section.
      :::
    bridges: []
  - id: tool-contracts-and-state.s2
    title: Did it happen? Five states of a request
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tool-contracts-and-state
    markdown: |-
      What comes back from the hotel isn't always a clean yes or no, so Wayfarer's program tracks every consequential call through five **request states**:

      | State | What it means | Safe next move |
      | --- | --- | --- |
      | proposed | The model asked; nothing sent yet | Validate it |
      | running | Sent; waiting for the reply | Wait, up to a time limit |
      | succeeded | The service confirmed it (booking H-5521) | Save the confirmation |
      | failed | The service said no ("sold out", "card declined") | Change something, or stop |
      | unknown | No clear answer came back | Check the status first |

      The last row trips people up. A **timeout** means *your program stopped waiting*. Maybe the request never arrived; maybe the room was booked and the reply got lost. A failure is a definite answer from the service; a timeout is the absence of one. So a timeout moves a request to *unknown*, not *failed*.
    diagram:
      caption: The life of one tool call. A timeout leads to "unknown", and only a status check resolves it.
      description: A proposed call goes to running if it passes validation, or straight to failed if the validator rejects it. A running call goes to succeeded when the service confirms it, to failed when the service refuses it (sold out or card declined), and to unknown when the program times out. From unknown, a status check leads to either succeeded or failed.
      nodes:
        - id: proposed
          label: proposed
          note: the model asked
          col: 0
          row: 1
        - id: running
          label: running
          note: sent, waiting
          col: 1
          row: 1
          tone: data
        - id: succeeded
          label: succeeded
          note: confirmation code saved
          col: 2
          row: 0
          tone: accent
        - id: unknown
          label: unknown
          note: check before retrying
          col: 2
          row: 1
          tone: muted
        - id: failed
          label: failed
          note: the service said no
          col: 1
          row: 2
          tone: warn
      edges:
        - from: proposed
          to: running
          label: valid
        - from: proposed
          to: failed
          label: rejected
        - from: running
          to: succeeded
          label: confirmed
        - from: running
          to: failed
          label: refused
        - from: running
          to: unknown
          label: timeout
        - from: unknown
          to: succeeded
          label: status check
          dashed: true
        - from: unknown
          to: failed
          label: status check
          dashed: true
    bridges: []
  - id: tool-contracts-and-state.idempotency
    title: The room that was booked twice
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tool-contracts-and-state
    markdown: |-
      Here's how *unknown* becomes a double booking. At 10:00:00 Wayfarer sends `book_hotel` for two nights at \$131. The hotel books room H-5521 and charges \$262, but the reply is lost. At 10:00:30 the program's timeout fires, and it retries.

      The fix is an **idempotency key**: a unique label attached to an operation so the service can recognize a repeat. (An operation is **idempotent** when doing it twice has the same effect as doing it once.)

      | Time | Without a key | With key `trip88-hotel-1` |
      | --- | --- | --- |
      | 10:00:00 | Books H-5521, charges \$262; reply lost | Same, and remembers the key |
      | 10:00:30 | Retry looks new: books H-5522, charges \$262 | Same key: returns H-5521, no charge |
      | Total | Two rooms, \$524 | One room, \$262 |

      Many payment and booking services accept such a key; Stripe's payment API reads it from an `Idempotency-Key` header.

      :::predict Every attempt reaches the hotel, and Wayfarer retries three times after timeouts. What does the traveler pay without a key, and with one?
      That's four attempts in all. Without a key, each one books a room: 4 × \$262 = \$1,048. With one key shared by all four, the hotel books once: \$262.
      :::

      :::mixup "Generate a fresh key for each retry, just to be safe."
      To the hotel, a new key means a new booking. Create the key once, when the action is proposed, save it in the task record, and resend that same key on every retry. If a service takes no key, check the status first (list the traveler's bookings for that date) and retry only if nothing is there.
      :::
  - id: tool-contracts-and-state.s3
    title: Keep the truth in a record, not the story
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tool-contracts-and-state
    markdown: |-
      At the end of a long run, the model writes: *"All set! Your flight and hotel are booked."* Somewhere in its context is the hotel timeout. The sentence is fluent, confident, and wrong: the booking is still *unknown*. A generated summary can drop a failed step or invent a success.

      So Wayfarer's program keeps a **task record**, a small file written by the program rather than the model, tracking the request and every step:

      ```json
      {
        "task": "lisbon-trip-88",
        "request": {"city": "Lisbon", "check_in": "2026-07-10", "nights": 2},
        "steps": {
          "flight": {"state": "succeeded", "ref": "HA71-QX3"},
          "hotel":  {"state": "unknown", "idempotency_key": "trip88-hotel-1"},
          "confirmation_email": {"state": "proposed"}
        }
      }
      ```

      The program marks a step *succeeded* only when the service returns a confirmation, never because the model said so. Before a consequential call, it compares the arguments with `request`, which catches the three-night booking. Before emailing the traveler, it sees *unknown* and checks the hotel's status first. The model reads the record too, which keeps its next message honest.

      :::mixup "The tool call was valid JSON, so the booking worked."
      Valid JSON means the text parsed; passing the schema means the arguments have the right shape. Neither says the arguments match what the traveler wanted, or that the hotel did anything. Only the service's reply, saved in the task record, tells you what happened.
      :::

      :::key The contract in one sentence
      Check a call's shape before it runs, record its state from what the service actually returns, and make retries safe with a key you create once.
      :::
    bridges: []
  - id: tool-contracts-and-state.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.tool-contracts-and-state
    markdown: Wayfarer's calls, then a grocery app, a calendar bot, and a smart home test whether you can tell a bad argument from a lost reply, and count what a careless retry costs.
    takeaway: |-
      A schema checks a tool call's shape, not whether it did the right thing. Record each call's state from the service's reply, treat a timeout as unknown, and retry only with the same idempotency key.
  - id: tool-contracts-and-state.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.tool-contracts-and-state
    markdown: |-
      Track what was requested, what executed, and what result is known. Valid arguments and well-formed JSON do not by themselves establish task success.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - tool-contracts-and-state.s1
        - tool-contracts-and-state.s4
        - tool-contracts-and-state.s2
        - tool-contracts-and-state.idempotency
        - tool-contracts-and-state.s3
        - tool-contracts-and-state.check
      gate_refs:
        - gate.core
  scene_aliases:
    tool-contracts-and-state.recap: tool-contracts-and-state.check
assessment_families:
  - id: tool-contracts-and-state.base
    objective_ref: objective.tool-contracts-and-state
    task: base
    response_type: single_choice
    points: 1
    hint: 'Distinguish request, execution, and result: trace the inputs, operation, and result before choosing.'
    remediation_scene: tool-contracts-and-state.s2
    variants:
      - id: tool-contracts-and-state.base.1
        prompt: Does valid JSON prove a tool request is correct?
        options:
          - id: c
            text: Only if every field is present
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Syntax and schema validity do not establish task semantics.
        retired: true
      - id: tool-contracts-and-state.base.2
        prompt: A timeout follows a write request. What may be uncertain?
        options:
          - id: a
            text: Whether the operation took effect
          - id: b
            text: Whether any request was sent at all by definition
          - id: c
            text: Whether the schema exists
        answer: a
        feedback: Timeouts can leave execution outcome ambiguous.
        retired: true
  - id: tool-contracts-and-state.transfer
    objective_ref: objective.tool-contracts-and-state
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Handle errors as observations: trace the inputs, operation, and result before choosing.'
    remediation_scene: tool-contracts-and-state.s4
    variants:
      - id: tool-contracts-and-state.transfer.1
        prompt: Why store completed actions explicitly?
        options:
          - id: a
            text: To support reliable continuation and prevent false completion assumptions
          - id: b
            text: To eliminate all model errors
          - id: c
            text: To retrain the tokenizer
        answer: a
        feedback: Persistent state is more precise than an unchecked narrative.
        retired: true
      - id: tool-contracts-and-state.transfer.2
        prompt: What should a tool result’s units be treated as?
        options:
          - id: b
            text: Optional decoration in every case
          - id: c
            text: A model preference unrelated to meaning
          - id: a
            text: Part of the output contract
        answer: a
        feedback: Units determine how numeric results can be used.
        retired: true
  - id: tool-contracts-and-state.base.v2
    objective_ref: objective.tool-contracts-and-state
    task: base
    response_type: single_choice
    points: 1
    hint: 'Keep three questions apart: is the call well-formed, does it match what the user asked, and what did the service actually report?'
    remediation_scene: tool-contracts-and-state.s4
    variants:
      - id: tool-contracts-and-state.base.v2.1
        prompt: 'Wayfarer''s model sends book_hotel with {"hotel_id": "rua-nova-lis", "check_in": "2026-07-10", "nights": "2"}, a string where the contract says integer. What should the program do?'
        options:
          - id: a
            text: Forward it, and let the hotel service decide how to read the string "2"
          - id: b
            text: Reject it with an error naming the field, the expected type, and an example
          - id: c
            text: Reply "Error 400, bad request" so that the model knows to try again
        answer: b
        feedback: A specific error goes back into the model's context as an observation, and the model can fix its call on the next step. Forwarding pushes the guesswork onto a service that may crash or misread it, and a bare "bad request" gives the model nothing to correct.
      - id: tool-contracts-and-state.base.v2.2
        prompt: Wayfarer sends book_hotel and gets no reply within its 30-second time limit. Which state should the task record show for this call?
        options:
          - id: b
            text: Failed, because no confirmation arrived in time
          - id: c
            text: Succeeded, because the call passed validation first
          - id: a
            text: Unknown, until a status check shows what happened
        answer: a
        feedback: A timeout means the program stopped waiting. The hotel may have booked the room and lost the reply, so marking it failed invites a retry that double-books. Passing validation says nothing about what the service did.
      - id: tool-contracts-and-state.base.v2.3
        prompt: The traveler asked for two nights. The model's call has "nights" set to 3, and it passes the JSON Schema check. What should catch the mistake?
        options:
          - id: c
            text: A stricter JSON parser that rejects any formatting problems
          - id: a
            text: Comparing the call's arguments with the request saved in the task record
          - id: b
            text: Asking the model to reread its own JSON before it is sent
        answer: a
        feedback: The schema only checks shape, and 3 is a perfectly shaped number of nights. The program saved the traveler's actual request when the task began, so it can compare the two. A stricter parser checks formatting, which was already fine, and self-review by the model is a weaker check than a program comparison.
      - id: tool-contracts-and-state.base.v2.4
        prompt: The model sends check_in "next Friday" instead of a date. Which error message gives it the best chance of fixing the call on its next step?
        options:
          - id: b
            text: '"Invalid input. Please check your request and try again."'
          - id: c
            text: '"ValidationError at line 1, column 42 of the request body."'
          - id: a
            text: '"check_in must be a date like 2026-07-10; got next Friday."'
        answer: a
        feedback: The model reads the error as its next observation. Naming the field, the expected format, an example, and the bad value tells it exactly what to change. The other two say something went wrong without saying what.
  - id: tool-contracts-and-state.transfer.v2
    objective_ref: objective.tool-contracts-and-state
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Ask what the service actually did. Then ask what would happen if the same call ran a second time.'
    remediation_scene: tool-contracts-and-state.idempotency
    variants:
      - id: tool-contracts-and-state.transfer.v2.1
        prompt: A grocery agent's place_order call times out, so it retries, and the customer receives two deliveries. Which change prevents this?
        options:
          - id: b
            text: Raise the time limit to two minutes so that fewer calls time out
          - id: a
            text: Create one idempotency key per order and send it on every retry
          - id: c
            text: Generate a fresh idempotency key for each retry attempt
        answer: a
        feedback: One key per order lets the store recognize the retry as the same order. A longer time limit makes timeouts rarer but still retries blindly when one happens, and a fresh key per attempt looks like a new order every time.
      - id: tool-contracts-and-state.transfer.v2.2
        prompt: A calendar agent tells a user "Your meeting is moved to 3 pm," but the calendar service had actually returned an error. Which design prevents this false report?
        options:
          - id: c
            text: Tell the model in its instructions to claim success only when sure
          - id: b
            text: Check the agent's final message against a strict JSON Schema
          - id: a
            text: Record each step's state from the service reply and report from it
        answer: a
        feedback: The program, not the model's narrative, should decide what happened, using the service's reply. A prompt instruction helps a little but still trusts the model's memory of events, and a schema can only check the message's shape, not whether it's true.
      - id: tool-contracts-and-state.transfer.v2.3
        prompt: A company wants several different AI applications to use its inventory tools, without writing a separate integration for each application. What fits this need?
        options:
          - id: a
            text: Run an MCP server that describes each tool with a JSON Schema
          - id: b
            text: Paste the inventory documentation into each application's prompt
          - id: c
            text: Fine-tune each application's model on example inventory queries
        answer: a
        feedback: The Model Context Protocol is a shared standard, so any application with an MCP client can discover and call the same tools. Pasting documentation still leaves each app to build its own calls, and fine-tuning teaches patterns but doesn't connect anything.
      - id: tool-contracts-and-state.transfer.v2.4
        prompt: A smart-home agent's set_thermostat call times out. Its unlock_door call returns "denied, wrong code." How should the task record show these two calls?
        options:
          - id: c
            text: Thermostat failed and door unknown
          - id: b
            text: Both failed, since neither one confirmed
          - id: a
            text: Thermostat unknown and door failed
        answer: a
        feedback: The door service gave a definite refusal, so that call failed. The thermostat timed out, so nobody knows yet whether it changed; a status check (read the current setting) resolves it. Lumping both together as failed treats silence as a no.
  - id: tool-contracts-and-state.calculate
    objective_ref: objective.tool-contracts-and-state
    task: base
    response_type: numeric
    points: 1
    hint: Count the attempts that actually reached the service. Without a shared key, each one acts; with one key reused on every attempt, only the first does.
    remediation_scene: tool-contracts-and-state.idempotency
    absolute_tolerance: 0.5
    variants:
      - id: tool-contracts-and-state.calculate.1
        prompt: Wayfarer books 2 nights at $131 a night. The first attempt and 2 retries all reach the hotel, and no idempotency key is used. How many dollars is the traveler charged in total?
        answer: 786
        feedback: Each of the 3 attempts books a separate room at 2 × 131 = 262 dollars, so 3 × 262 = 786. With a shared key it would have been 262.
      - id: tool-contracts-and-state.calculate.2
        prompt: Wayfarer books 3 nights at $120 a night. The first attempt and 3 retries all reach the hotel, and all four carry the same idempotency key. How many dollars is the traveler charged in total?
        answer: 360
        feedback: The hotel recognizes the repeated key and books once, at 3 × 120 = 360 dollars. Without the key, four bookings would have cost 1,440.
      - id: tool-contracts-and-state.calculate.3
        prompt: A $148 flight booking is sent once and retried twice after timeouts. The program generates a fresh idempotency key for every attempt, and all three reach the airline. How many dollars are charged in total?
        answer: 444
        feedback: A new key on every attempt makes each one look like a new booking, so all three go through, 3 × 148 = 444. The key protects you only if the same key is reused.
      - id: tool-contracts-and-state.calculate.4
        prompt: A $75 payment is attempted 4 times in total. The first attempt never reached the service; attempts 2, 3, and 4 did, all with the same idempotency key. How many dollars are charged?
        answer: 75
        feedback: Attempt 2 is the first the service sees, so it charges once and stores the key. Attempts 3 and 4 carry the same key and are recognized as repeats, so the total is 75.
      - id: tool-contracts-and-state.calculate.5
        prompt: Wayfarer books 4 nights at $95 a night. The first attempt times out after the hotel has already booked the room, and one retry without an idempotency key also succeeds. How many dollars is the traveler charged in total?
        answer: 760
        feedback: Both attempts reached the hotel and neither carried a key, so the room is booked twice, 2 × (4 × 95) = 760 dollars.
