schema_version: 0.2-draft
lesson:
  id: classical-planning
  version: 0.4.0-draft
  title: Represent what an action requires and changes
  state: draft
  summary: In 1971, a robot called Shakey planned its own errands. Describe actions by what they need and what they change, and let search string them into a plan.
  slot: M05.6
  category: learning
  sources:
    - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
      url: https://aima.cs.berkeley.edu/
    - title: 'STRIPS: A New Approach to the Application of Theorem Proving to Problem Solving (Fikes & Nilsson, 1971)'
      url: https://doi.org/10.1016/0004-3702(71)90010-5
objectives:
  - id: objective.classical-planning
    version: 2-draft
    statement: Classical planning uses preconditions and effects; hierarchical and temporal planning add structure, durations, and resource interactions to action selection.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - classical-planning.base.v2
      - classical-planning.transfer.v2
      - classical-planning.calc.v2
    prerequisites:
      - anyOf:
          - objective.search-problems
      - anyOf:
          - objective.rule-engines
scenes:
  - id: classical-planning.s1
    title: An action has a contract
    type: explanation
    depth: intuition
    objective_refs:
      - objective.classical-planning
    markdown: |-
      At SRI in the late 1960s, a wobbly robot called Shakey was told things like "push the box from the storeroom into the office." Nobody gave it the steps. In 1971 Richard Fikes and Nils Nilsson described how Shakey worked them out, with a planner called **STRIPS**. Its way of writing actions is still the core of automated planning.

      STRIPS describes the world as a set of facts that are currently true, such as *robot in Lab* and *box in Store*. Each action is a contract with three parts:

      - **Preconditions**: facts that must be true before the action can happen.
      - **Add list**: facts the action makes true.
      - **Delete list**: facts the action makes false.

      Here is Shakey's world, cut down to two actions. Rooms $x$ and $y$ must be joined by a door.

      | Action | Preconditions | Add list | Delete list |
      | --- | --- | --- | --- |
      | Go($x$, $y$) | robot in $x$ | robot in $y$ | robot in $x$ |
      | Push($x$, $y$) | robot in $x$, box in $x$ | robot in $y$, box in $y$ | robot in $x$, box in $x$ |

      Anything an action doesn't mention stays exactly as it was. Going from the Lab to the Hall doesn't move the box, repaint the walls, or unlock a door. Saying so for every fact and every action would be impossibly tedious, a puzzle known as the **frame problem**, and this "unmentioned facts don't change" rule is STRIPS's practical answer to it.
    diagram:
      caption: 'Shakey''s cut-down world: four rooms and three doors. The robot starts in the Lab and the box in the Store.'
      description: The Lab connects to the Hall. The Hall connects to the Store and to the Office. The robot starts in the Lab, which also holds its charging dock. The box starts in the Store. The goal is the box in the Office with the robot back in the Lab.
      nodes:
        - id: lab
          label: Lab
          note: robot starts here
          col: 0
          row: 1
          tone: accent
        - id: hall
          label: Hall
          col: 1
          row: 1
        - id: store
          label: Store
          note: box starts here
          col: 2
          row: 0
          tone: data
        - id: office
          label: Office
          note: box should end here
          col: 2
          row: 2
          tone: warn
      edges:
        - from: lab
          to: hall
          label: door
        - from: hall
          to: store
          label: door
        - from: hall
          to: office
          label: door
    bridges: []
  - id: classical-planning.s2
    title: Trace a plan, fact by fact
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.classical-planning
    markdown: |-
      Goal: the box in the Office, and the robot back in the Lab to charge. Apply each action's contract in turn:

      | Step | Action | Robot in | Box in |
      | ---: | --- | --- | --- |
      | 0 | (start) | Lab | Store |
      | 1 | Go(Lab, Hall) | Hall | Store |
      | 2 | Go(Hall, Store) | Store | Store |
      | 3 | Push(Store, Hall) | Hall | Hall |
      | 4 | Push(Hall, Office) | Office | Office |
      | 5 | Go(Office, Hall) | Hall | Office |
      | 6 | Go(Hall, Lab) | Lab | Office |

      Step 3 is allowed only because step 2 made *robot in Store* true, one of Push's preconditions. Swap steps 2 and 3 and the plan breaks: the robot can't push a box from a room it isn't in.

      Finding such a sequence is just search, as in the first lessons of this module. The states are sets of facts, the actions are the contracts, and the goal test asks whether every goal fact is true. The program below runs breadth-first search over those states:

      ```python run
      from collections import deque

      doors = [("Lab", "Hall"), ("Hall", "Store"), ("Hall", "Office")]
      ACTIONS = []                              # (name, preconditions, add list, delete list)
      for a, b in doors + [(b, a) for a, b in doors]:
          ACTIONS.append((f"Go({a}, {b})", {f"robot in {a}"},
                          {f"robot in {b}"},
                          {f"robot in {a}"}))   # Go's delete list: try set()
          ACTIONS.append((f"Push({a}, {b})", {f"robot in {a}", f"box in {a}"},
                          {f"robot in {b}", f"box in {b}"}, {f"robot in {a}", f"box in {a}"}))

      def plan(start, goal):
          """Breadth-first search over sets of facts: returns the shortest plan."""
          frontier, seen = deque([(frozenset(start), [])]), {frozenset(start)}
          while frontier:
              state, steps = frontier.popleft()
              if goal <= state:                             # every goal fact is true
                  return steps
              for name, pre, add, delete in ACTIONS:
                  if pre <= state:                          # preconditions hold
                      nxt = (state - delete) | add          # STRIPS update
                      if nxt not in seen:
                          seen.add(nxt)
                          frontier.append((nxt, steps + [name]))

      start = {"robot in Lab", "box in Store"}
      goal = {"box in Office", "robot in Lab"}
      for step in plan(start, goal):
          print(step)
      ```

      :::mixup "An action's effects only need to say what becomes true."
      Replace Go's delete list with `set()` and run it again. The plan shrinks to 4 steps and stops with the robot in the Office, because the planner still believes *robot in Lab*: without a delete list, walking out of a room never takes the robot out of it. Forgetting what an action makes *false* lets a planner "solve" problems with a teleporting robot.
      :::

      :::papers The STRIPS update
      An action $a$ applies in state $s$ when $\text{PRE}(a) \subseteq s$, and then $s' = (s \setminus \text{DEL}(a)) \cup \text{ADD}(a)$. For step 3, Push(Store, Hall): {robot in Store, box in Store} minus the delete list, plus {robot in Hall, box in Hall}, gives {robot in Hall, box in Hall}. Since 1998 most planners read problems written in **PDDL** (the Planning Domain Definition Language), a standard descendant of this notation created for the International Planning Competition. Because the domain is written separately from the search code, one planner can solve any domain described in it.
      :::
    bridges: []
  - id: classical-planning.s3
    title: Break big tasks down, and schedule shared tools
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.classical-planning
    markdown: |-
      Breadth-first search is fine for six steps but hopeless for six hundred. Modern planners search with A*-style estimates computed automatically from the action descriptions. A common trick is to solve an easier version of the problem in which actions have no delete lists, and count how many actions that version needs.

      People plan differently: from the top down. **Hierarchical task network (HTN) planning** writes that down. The task *Deliver(box, Office)* breaks into *fetch the box*, *push it to the Office*, and *return to charge*, and each of those breaks into Go and Push actions. The planner only searches among decompositions someone has declared sensible, which makes large problems manageable.

      Real actions also take time and use shared tools. **Temporal planning** adds durations and resources. Loading truck A takes 3 minutes and truck B takes 4:

      | Resources | Schedule | Finished after |
      | --- | --- | ---: |
      | One crane | A, then B | 3 + 4 = 7 minutes |
      | Two cranes | A and B side by side | max(3, 4) = 4 minutes |

      Ordering constraints add up the same way as a single crane. If B may start only after A has finished (say A's truck blocks the bay), even two cranes need 7 minutes. The total time of a schedule, here 7 or 4 minutes, is called the **makespan**.
    bridges: []
  - id: classical-planning.s4
    title: A valid plan meets the real world
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.classical-planning
    markdown: |-
      A plan is valid when every precondition holds in the *model*. The real world may disagree. Suppose Shakey carries out step 4, Push(Hall, Office), but the box snags on the doorframe and stays in the Hall.

      The fix is **execution monitoring**: after each action, compare the facts the plan expected with what the sensors report.

      | | Expected after step 4 | Observed |
      | --- | --- | --- |
      | Robot in | Office | Office |
      | Box in | Office | Hall |

      The mismatch triggers **replanning** from the observed state: Go(Office, Hall), then Push(Hall, Office) again, then return to the Lab. Carrying on with steps 5 and 6 would send the robot home to charge, reporting success with the box still stuck in the Hall.

      Shakey's own software did this kind of checking. Its execution monitor, PLANEX (1972), compared the observed state with each step's preconditions after every action. It could repeat or skip steps as needed, and it called the planner again when no remaining part of the plan fit. The habit carries straight over to today's software agents: after each tool call, check that the effect you planned on actually happened before building on it.
    bridges: []
  - id: classical-planning.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.classical-planning
    markdown: Kitchen robots, warehouse pushes, travel bookings, and crane schedules ask you to apply an action's contract, spot a missing precondition or delete, and time a plan with shared tools.
    takeaway: |-
      Describe each action by its preconditions, add list, and delete list, and a planner can search for a sequence that reaches the goal. Then check each real step, because a plan is only as good as its model.
  - id: classical-planning.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.classical-planning
    markdown: |-
      A plan links actions whose conditions and effects fit together. Check the intermediate states, timing, and shared resources, then monitor whether the real actions worked.
