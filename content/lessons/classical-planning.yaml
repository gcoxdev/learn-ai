schema_version: 0.2-draft
lesson:
  id: classical-planning
  version: 0.1.0-draft
  title: Represent what an action requires and changes
  state: draft
  summary: Classical planning uses preconditions and effects; hierarchical and temporal planning add structure,
    durations, and resource interactions to action selection.
  slot: M05.6
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.classical-planning
  version: 1-draft
  statement: Classical planning uses preconditions and effects; hierarchical and temporal planning add structure,
    durations, and resource interactions to action selection.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - classical-planning.base
  - classical-planning.transfer
  prerequisites:
  - anyOf:
    - objective.search-problems
  - anyOf:
    - objective.rule-engines
scenes:
- id: classical-planning.s1
  title: An action has a contract
  type: explanation
  depth: intuition
  objective_refs:
  - objective.classical-planning
  markdown: A symbolic action such as Load(parcel, truck) may require the parcel and truck to be at the same depot.
    Its effects remove the parcel from the depot state and mark it in the truck. Preconditions say when an action
    is applicable; effects say how the represented world changes.
  text_mode: A symbolic action such as Load(parcel, truck) may require the parcel and truck to be at the same depot.
    Its effects remove the parcel from the depot state and mark it in the truck. Preconditions say when an action
    is applicable; effects say how the represented world changes.
  bridges: []
- id: classical-planning.s2
  title: Trace a short plan
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.classical-planning
  markdown: To deliver a parcel, first load it, then drive the truck, then unload. Driving before loading leaves
    the parcel behind in the model. A planner searches for an action sequence whose effects establish the goal from
    the initial state. It assumes the action model is accurate enough for this reasoning.
  text_mode: To deliver a parcel, first load it, then drive the truck, then unload. Driving before loading leaves
    the parcel behind in the model. A planner searches for an action sequence whose effects establish the goal from
    the initial state. It assumes the action model is accurate enough for this reasoning.
  bridges: []
- id: classical-planning.s3
  title: Use hierarchy and time
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.classical-planning
  markdown: 'A high-level task such as deliver can decompose into smaller tasks. Hierarchical methods constrain
    and guide this decomposition. Temporal planning also represents durations and overlap: two actions may run together
    only when resource and ordering constraints allow it. A single shared crane can prevent simultaneous loading
    operations.'
  text_mode: 'A high-level task such as deliver can decompose into smaller tasks. Hierarchical methods constrain
    and guide this decomposition. Temporal planning also represents durations and overlap: two actions may run together
    only when resource and ordering constraints allow it. A single shared crane can prevent simultaneous loading
    operations.'
  bridges: []
- id: classical-planning.s4
  title: Separate plan validity from execution success
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.classical-planning
  markdown: A valid plan satisfies the encoded model, but real roads can close and actions can fail. Execution monitoring
    checks whether expected effects occurred. Replanning uses updated observations. If effects or preconditions
    were omitted, a planner can return a formally valid plan that is operationally unusable.
  text_mode: A valid plan satisfies the encoded model, but real roads can close and actions can fail. Execution
    monitoring checks whether expected effects occurred. Replanning uses updated observations. If effects or preconditions
    were omitted, a planner can return a formally valid plan that is operationally unusable.
  bridges: []
- id: classical-planning.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
