  scene_aliases:
    classical-planning.recap: classical-planning.check
assessment_families:
  - id: classical-planning.base
    objective_ref: objective.classical-planning
    task: base
    response_type: single_choice
    points: 1
    hint: 'Trace a short plan: trace the inputs, operation, and result before choosing.'
    remediation_scene: classical-planning.s2
    variants:
      - id: classical-planning.base.1
        prompt: What does an action precondition describe?
        options:
          - id: c
            text: A guaranteed observed result
          - id: a
            text: What must hold before the action can apply
          - id: b
            text: Only its final cost
        answer: a
        feedback: Preconditions constrain applicability in the represented state.
        retired: true
      - id: classical-planning.base.2
        prompt: What does an action effect describe?
        options:
          - id: a
            text: How the represented state changes
          - id: b
            text: Only the name of the actor
          - id: c
            text: A new training dataset automatically
        answer: a
        feedback: Effects specify the modeled consequences of applying an action.
        retired: true
  - id: classical-planning.transfer
    objective_ref: objective.classical-planning
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Separate plan validity from execution success: trace the inputs, operation, and result before choosing.'
    remediation_scene: classical-planning.s4
    variants:
      - id: classical-planning.transfer.1
        prompt: Two loading tasks require one crane at the same time. What must temporal planning represent?
        options:
          - id: a
            text: The shared resource conflict
          - id: b
            text: Only each task’s text description
          - id: c
            text: A rule that all actions always overlap
        answer: a
        feedback: Time and resource constraints govern feasible overlap.
        retired: true
      - id: classical-planning.transfer.2
        prompt: An executed action fails to produce its modeled effect. What should the system do?
        options:
          - id: b
            text: Assume the goal is reached anyway
          - id: c
            text: Treat the plan text as physical evidence
          - id: a
            text: Observe the discrepancy and update or replan
        answer: a
        feedback: Planning depends on a model; execution requires checking the world.
        retired: true
  - id: classical-planning.base.v2
    objective_ref: objective.classical-planning
    task: base
    response_type: single_choice
    points: 1
    hint: An action applies only when all its preconditions are in the state. Then remove the delete list, add the add list, and leave every other fact alone.
    remediation_scene: classical-planning.s2
    variants:
      - id: classical-planning.base.v2.1
        prompt: 'The state is {robot in Hall, box in Hall}. Apply Push(Hall, Office). What is the new state?'
        options:
          - id: b
            text: '{robot in Hall, box in Office}'
          - id: a
            text: '{robot in Office, box in Office}'
          - id: c
            text: '{robot in Office, box in Hall, box in Office}'
        answer: a
        feedback: Push deletes robot in Hall and box in Hall, then adds robot in Office and box in Office. Leaving the robot behind ignores the add list; keeping box in Hall ignores the delete list.
      - id: classical-planning.base.v2.2
        prompt: 'The state is {robot in Lab, box in Store}. Which of these actions can be applied now?'
        options:
          - id: c
            text: Go(Hall, Store)
          - id: b
            text: Push(Lab, Hall)
          - id: a
            text: Go(Lab, Hall)
        answer: a
        feedback: Go(Lab, Hall) needs only robot in Lab, which holds. Push(Lab, Hall) also needs box in Lab, and Go(Hall, Store) needs robot in Hall.
      - id: classical-planning.base.v2.3
        prompt: The robot starts in the Lab with the box in the Store and runs Go(Lab, Hall). What happens to the fact "box in Store"?
        options:
          - id: a
            text: It stays, since Go's delete list doesn't mention it
          - id: b
            text: It's removed, since each action rebuilds the state
          - id: c
            text: It becomes unknown until the robot looks again
        answer: a
        feedback: Under the STRIPS rule, facts an action doesn't mention carry over unchanged. That's how STRIPS sidesteps the frame problem.
      - id: classical-planning.base.v2.4
        prompt: A kitchen robot's action Boil(kettle) has the precondition "kettle has water." In the current state the kettle is empty. How does the planner treat Boil?
        options:
          - id: c
            text: It uses Boil now and expects it to fail when run
          - id: a
            text: It can't use Boil until an action fills the kettle
          - id: b
            text: It uses Boil and adds "kettle has water" as an effect
        answer: a
        feedback: A precondition gates when an action may appear in the plan, so the planner must first find an action whose add list includes "kettle has water." Effects can't create an action's own precondition.
      - id: classical-planning.base.v2.5
        prompt: Someone writes Go(x, y) with an empty delete list. What strange plans can the planner now produce?
        options:
          - id: b
            text: Plans that are longer than they need to be
          - id: c
            text: No plans, for any goal whatsoever
          - id: a
            text: Plans where the robot is in several rooms at once
        answer: a
        feedback: Without deleting robot in x, walking out of a room leaves robot in x true, so the robot seems to be in several rooms at once. That makes plans shorter, not longer, and wrong, as the 4-step "solution" showed.
  - id: classical-planning.transfer.v2
    objective_ref: objective.classical-planning
    task: transfer
    response_type: single_choice
    points: 1
    hint: A plan is only as good as its model. Check preconditions, effects, and shared resources, and after each real step check that the expected facts came true.
    remediation_scene: classical-planning.s4
    variants:
      - id: classical-planning.transfer.v2.1
        prompt: A warehouse robot executes Push(Aisle, Dock), but its camera shows the crate still in the Aisle. What should happen next?
        options:
          - id: a
            text: Update the state from the camera and replan
          - id: b
            text: Carry on with the next step of the plan
          - id: c
            text: Mark the plan as failed and stop working
        answer: a
        feedback: Execution monitoring compares expected facts with observed ones; the mismatch calls for replanning from the real state. Carrying on builds on a fact that isn't true, and a single failed push rarely means the goal is impossible.
      - id: classical-planning.transfer.v2.2
        prompt: A cooking robot's plan serves the soup before heating it, and the planner reports the plan as valid. What is most likely wrong?
        options:
          - id: c
            text: The planner's search did not go deep enough
          - id: b
            text: Serve has too many effects in its add list
          - id: a
            text: Serve is missing a "soup is hot" precondition
        answer: a
        feedback: A planner only enforces the preconditions it's given. If Serve doesn't require hot soup, serving it cold is valid in the model. Deeper search would still find the same short, wrong plan.
      - id: classical-planning.transfer.v2.3
        prompt: 'A travel agent turns "plan a trip" into "book transport," "book a hotel," and "plan each day," then breaks each of those into smaller steps. What kind of planning is this?'
        options:
          - id: b
            text: Temporal planning with action durations
          - id: a
            text: Hierarchical planning by task decomposition
          - id: c
            text: Constraint propagation over time slots
        answer: a
        feedback: Breaking a big task into declared subtasks is HTN planning. Durations belong to temporal planning, and nothing here removes values from domains.
      - id: classical-planning.transfer.v2.4
        prompt: A company has one generic planner and describes each new robot's actions in PDDL instead of writing new search code. What does that buy them?
        options:
          - id: a
            text: One planner can solve many different domains
          - id: b
            text: Plans are checked by running them in the world
          - id: c
            text: Plans come out optimal in time as well as steps
        answer: a
        feedback: A standard action language separates the domain description from the search, so the same planner works for any robot described in it. It doesn't run plans for real or add time optimization by itself.
      - id: classical-planning.transfer.v2.5
        prompt: A delivery drone's plan assumes "package attached" stays true during flight. Mid-flight the package drops, but the plan continues to the customer. Which step was missing?
        options:
          - id: c
            text: A shorter route so the flight takes less time
          - id: a
            text: Checking observed facts against expected ones
          - id: b
            text: An extra action to attach a second package
        answer: a
        feedback: Execution monitoring would catch that "package attached" is no longer true and trigger replanning. A shorter route or a spare package doesn't make the drone notice the loss.
  - id: classical-planning.calc.v2
    objective_ref: objective.classical-planning
    task: base
    response_type: numeric
    points: 1
    hint: Tasks that share one tool, or must wait for each other, add their durations. Tasks on separate tools can overlap, so take the longer of the parallel lines.
    remediation_scene: classical-planning.s3
    absolute_tolerance: 0.001
    variants:
      - id: classical-planning.calc.v2.1
        prompt: Loading truck A takes 3 minutes and truck B takes 4. Both need the site's only crane. What is the shortest makespan, in minutes?
        answer: 7
        feedback: One crane serves one truck at a time, so 3 + 4 = 7. The 4-minute answer assumes the two loads can overlap.
      - id: classical-planning.calc.v2.2
        prompt: Loading truck A takes 3 minutes and truck B takes 4, and there are two cranes that can work at the same time. What is the shortest makespan, in minutes?
        answer: 4
        feedback: The loads run side by side, so the schedule ends when the longer one does, max(3, 4) = 4.
      - id: classical-planning.calc.v2.3
        prompt: 'Three dishes need the one oven: 2, 3, and 4 minutes. What is the shortest makespan, in minutes?'
        answer: 9
        feedback: With a single oven the dishes go one after another, 2 + 3 + 4 = 9. Order changes nothing when every task needs the same tool.
      - id: classical-planning.calc.v2.4
        prompt: 'Three dishes take 2, 3, and 4 minutes, and there are now two ovens. What is the shortest makespan, in minutes?'
        answer: 5
        feedback: Put the 4-minute dish in one oven and the 2- and 3-minute dishes in the other. The lines take 4 and 5 minutes, so the makespan is 5. Any other split leaves one oven busy for 6 or more.
      - id: classical-planning.calc.v2.5
        prompt: Painting takes 3 hours and must finish before the 2-hour fitting can start. Wiring takes 4 hours and needs a different crew, so it can run at the same time. What is the shortest makespan, in hours?
        answer: 5
        feedback: The painting-then-fitting chain takes 3 + 2 = 5 hours, and wiring (4) runs alongside it, so the makespan is max(5, 4) = 5.
