schema_version: 0.2-draft
lesson:
  id: fuzzy-sets-and-control
  version: 0.2.0-draft
  title: Represent graded membership without confusing it with probability
  state: draft
  summary: Use gradual categories such as warm without confusing membership with chance.
  slot: M32.4
  category: learning
  sources:
  - title: Fuzzy Sets — Zadeh
    url: https://doi.org/10.1016/S0019-9958(65)90241-X
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.fuzzy-sets-and-control
  version: 1-draft
  statement: Fuzzy systems assign degrees of membership to linguistic categories and combine rules; membership,
    uncertainty probability, and crisp decision outputs have different meanings.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - fuzzy-sets-and-control.base
  - fuzzy-sets-and-control.transfer
  prerequisites:
  - anyOf:
    - objective.rule-engines
  - anyOf:
    - objective.feedback-and-robot-control
scenes:
- id: fuzzy-sets-and-control.s1
  title: Allow a category to have a graded boundary
  type: explanation
  depth: intuition
  objective_refs:
  - objective.fuzzy-sets-and-control
  markdown: A temperature can belong partly to the category warm under a chosen membership function. Membership
    0.7 describes degree of compatibility with that category, not necessarily a 70 percent chance that the
    thermometer is correct. Fuzzy categories model gradual concepts rather than only uncertain events.
  text_mode: A temperature can belong partly to the category warm under a chosen membership function. Membership
    0.7 describes degree of compatibility with that category, not necessarily a 70 percent chance that the
    thermometer is correct. Fuzzy categories model gradual concepts rather than only uncertain events.
  bridges: []
- id: fuzzy-sets-and-control.s2
  title: Define rule combination explicitly
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.fuzzy-sets-and-control
  markdown: 'A rule might say if temperature is high and error is increasing, apply strong cooling. Minimum
    or product operators can implement fuzzy conjunction under different conventions. Aggregation combines
    rule consequences; the chosen operators are part of the model and affect results.


    If “high temperature” has membership 0.8 and “error increasing” has membership 0.5, minimum conjunction
    gives rule strength 0.5; product conjunction gives 0.4. Neither is universally the right choice. In a simple
    zero-order Sugeno controller, two rules may suggest fixed outputs 2 and 8 with strengths 0.25 and 0.75.
    Weighted averaging gives (0.25 × 2 + 0.75 × 8)/(0.25 + 0.75) = 6.5. Other fuzzy systems combine output
    shapes and use a centroid instead.'
  text_mode: 'A rule might say if temperature is high and error is increasing, apply strong cooling. Minimum
    or product operators can implement fuzzy conjunction under different conventions. Aggregation combines
    rule consequences; the chosen operators are part of the model and affect results.


    If “high temperature” has membership 0.8 and “error increasing” has membership 0.5, minimum conjunction
    gives rule strength 0.5; product conjunction gives 0.4. Neither is universally the right choice. In a simple
    zero-order Sugeno controller, two rules may suggest fixed outputs 2 and 8 with strengths 0.25 and 0.75.
    Weighted averaging gives (0.25 × 2 + 0.75 × 8)/(0.25 + 0.75) = 6.5. Other fuzzy systems combine output
    shapes and use a centroid instead.'
  bridges: []
- id: fuzzy-sets-and-control.s3
  title: Produce an actionable output
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.fuzzy-sets-and-control
  markdown: Defuzzification converts an aggregated fuzzy output into a crisp command, such as using a centroid
    under a specified method. Different methods can produce different controls. The membership functions and
    rules need domain justification and testing rather than being treated as automatically interpretable truth.
  text_mode: Defuzzification converts an aggregated fuzzy output into a crisp command, such as using a centroid
    under a specified method. Different methods can produce different controls. The membership functions and
    rules need domain justification and testing rather than being treated as automatically interpretable truth.
  bridges: []
- id: fuzzy-sets-and-control.s4
  title: Evaluate the full controller
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.fuzzy-sets-and-control
  markdown: Fuzzy rules can encode expert heuristics and combine with learned components. Assess stability,
    noise sensitivity, coverage, and maintainability. A readable rule base may still have interactions that
    are difficult to predict, especially when many overlapping rules determine one action.
  text_mode: Fuzzy rules can encode expert heuristics and combine with learned components. Assess stability,
    noise sensitivity, coverage, and maintainability. A readable rule base may still have interactions that
    are difficult to predict, especially when many overlapping rules determine one action.
  bridges: []
- id: fuzzy-sets-and-control.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.fuzzy-sets-and-control
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Fuzzy systems assign degrees of membership to linguistic categories and combine rules; membership,
    uncertainty probability, and crisp decision outputs have different meanings.
- id: fuzzy-sets-and-control.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.fuzzy-sets-and-control
  markdown: Fuzzy systems assign degrees of membership to linguistic categories and combine rules; membership,
