schema_version: 0.2-draft
lesson:
  id: fuzzy-sets-and-control
  version: 0.4.0-draft
  title: Represent graded membership without confusing it with probability
  state: draft
  summary: Is 28 °C warm? Mostly, and a bit hot too. Build a fan controller from rules like "if warm and humid, run high," and turn fuzzy answers into one smooth speed.
  slot: M32.4
  category: learning
  sources:
    - title: Fuzzy Sets (Zadeh, 1965)
      url: https://doi.org/10.1016/S0019-9958(65)90241-X
    - title: "An experiment in linguistic synthesis with a fuzzy logic controller (Mamdani & Assilian, 1975)"
      url: https://doi.org/10.1016/S0020-7373(75)80002-2
    - title: "Fuzzy identification of systems and its applications to modeling and control (Takagi & Sugeno, 1985)"
      url: https://doi.org/10.1109/TSMC.1985.6313399
    - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
      url: https://aima.cs.berkeley.edu/
objectives:
  - id: objective.fuzzy-sets-and-control
    version: 2-draft
    statement: Fuzzy systems assign degrees of membership to linguistic categories and combine rules; membership, uncertainty probability, and crisp decision outputs have different meanings.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - fuzzy-sets-and-control.base.v2
      - fuzzy-sets-and-control.transfer.v2
      - fuzzy-sets-and-control.calculate
    prerequisites:
      - anyOf:
          - objective.rule-engines
      - anyOf:
          - objective.feedback-and-robot-control
scenes:
  - id: fuzzy-sets-and-control.s1
    title: Is 28 °C warm?
    type: explanation
    depth: intuition
    objective_refs:
      - objective.fuzzy-sets-and-control
    markdown: |-
      A cheap fan controller has one rule: above 25 °C, run at full speed; otherwise, off. At 24.9 °C it's silent; at 25.1 °C it roars. The room barely changed, but the answer flipped, because "warm" was drawn as a hard line.

      In 1965 Lotfi Zadeh proposed **fuzzy sets**: categories whose members belong *to a degree* between 0 and 1. A **membership function** gives that degree. Here are three for temperature:

      | Temperature | Cool | Warm | Hot |
      | ---: | ---: | ---: | ---: |
      | 15 °C | 1 | 0 | 0 |
      | 20 °C | 0.5 | 0.5 | 0 |
      | 25 °C | 0 | 1 | 0 |
      | 28 °C | 0 | 0.7 | 0.3 |
      | 35 °C | 0 | 0 | 1 |

      "Warm" is a triangle: 0 at 15 °C, rising to 1 at 25 °C, falling back to 0 at 35 °C. "Hot" rises from 0 at 25 °C to 1 at 35 °C. So 28 °C is warm to degree 0.7 *and* hot to degree 0.3. Neighboring categories overlap, and that overlap is what makes the controller's output change smoothly.

      :::mixup "Warm to degree 0.7 means a 70% chance that it's warm."
      Nothing here is uncertain: the thermometer reads exactly 28 °C. The 0.7 says how well 28 °C fits the word "warm." Probability, as in module 6, describes an event you're unsure about, like tomorrow's temperature; membership describes a vague word applied to a known value. You can have both at once: a 70% chance of a day that is warm to degree 0.4.
      :::
  - id: fuzzy-sets-and-control.s2
    title: Fuzzify, then fire the rules
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.fuzzy-sets-and-control
    markdown: |-
      Our fan controller also reads humidity. "Dry" is 1 at 30% or below and falls to 0 at 70%; "humid" does the reverse. The room is at 28 °C and 60% humidity.

      **Step 1, fuzzify.** Turn each reading into memberships: warm 0.7, hot 0.3, humid $(60 - 30)/40 = 0.75$, dry 0.25.

      **Step 2, fire the rules.** A fuzzy rule base is written in words an engineer can read. It looks like the IF–THEN rules from the lesson on rule engines in module 4, except that each rule fires to a degree instead of simply true or false:

      | Rule | Strength at 28 °C, 60% |
      | --- | --- |
      | R1: IF cool THEN low | 0 |
      | R2: IF warm AND dry THEN medium | min(0.7, 0.25) = 0.25 |
      | R3: IF hot THEN high | 0.3 |
      | R4: IF warm AND humid THEN high | min(0.7, 0.75) = 0.7 |

      The standard fuzzy AND takes the **minimum** of the memberships: a rule is only as true as its weakest condition. Fuzzy OR takes the **maximum**. R3 and R4 both recommend "high," so their strengths combine with max: high fires at 0.7.

      Some systems use the product for AND instead: R4 would then fire at 0.7 × 0.75 = 0.525. Both are legitimate choices, and they give slightly different controllers, so write down which one you use.
    diagram:
      caption: A Mamdani fuzzy controller, from sensor readings to one fan speed.
      description: Temperature and humidity readings go to fuzzification, which turns them into memberships such as warm 0.7 and humid 0.75. The memberships go to the rule base, which fires each rule with min for AND. The rule strengths clip the output shapes low, medium, and high, and the clipped shapes are combined with max into one aggregated shape. Defuzzification by centroid turns that shape into a single fan speed.
      nodes:
        - id: read
          label: Readings
          note: 28 °C, 60% humidity
          col: 0
          row: 0
          tone: data
        - id: fuzz
          label: Fuzzify
          note: warm 0.7, hot 0.3, humid 0.75
          col: 1
          row: 0
        - id: rules
          label: Fire rules
          note: AND = min, OR = max
          col: 2
          row: 0
          tone: accent
        - id: agg
          label: Clip and combine shapes
          note: high at 0.7, medium at 0.25
          col: 2
          row: 1
        - id: defuzz
          label: Defuzzify
          note: centroid
          col: 1
          row: 1
          tone: warn
        - id: out
          label: Fan speed 72.8%
          col: 0
          row: 1
          tone: data
      edges:
        - from: read
          to: fuzz
        - from: fuzz
          to: rules
          label: memberships
        - from: rules
          to: agg
          label: rule strengths
        - from: agg
          to: defuzz
          label: one fuzzy shape
        - from: defuzz
          to: out
  - id: fuzzy-sets-and-control.s3
    title: From a fuzzy shape to one fan speed
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.fuzzy-sets-and-control
    markdown: |-
      The motor needs one number, not "high to degree 0.7." Each output word has its own shape over fan speeds from 0 to 100%: "low" falls from 1 at 0% to 0 at 50%, "medium" is a triangle peaking at 50%, and "high" rises from 0 at 50% to 1 at 100%.

      **Step 3, clip and combine.** Cut each output shape off at its rule strength (high at 0.7, medium at 0.25, low at 0), then take the pointwise maximum of the clipped shapes. **Step 4, defuzzify.** Turn that combined shape into one number by taking its **centroid**, the balance point of its area. This recipe is the **Mamdani** controller, after Ebrahim Mamdani, who used it with Sedrak Assilian in 1975 to control a small steam engine.

      ```python run
      import numpy as np

      def ramp(x, a, b):                     # 0 at a, rising to 1 at b (falls if a > b)
          return float(np.clip((x - a) / (b - a), 0, 1))

      def tri(x, a, b, c):                   # triangle: 0 at a, peak 1 at b, 0 at c
          return max(0.0, min((x - a) / (b - a), (c - x) / (c - b)))

      def fan_speed(temp, hum):
          cool, warm, hot = ramp(temp, 25, 15), tri(temp, 15, 25, 35), ramp(temp, 25, 35)
          dry, humid = ramp(hum, 70, 30), ramp(hum, 30, 70)
          low    = cool                      # R1: IF cool THEN low
          medium = min(warm, dry)            # R2: IF warm AND dry THEN medium
          high   = max(hot, min(warm, humid))  # R3: IF hot THEN high;  R4: IF warm AND humid THEN high
          print(f"  memberships: warm {warm:.2f}, hot {hot:.2f}, dry {dry:.2f}, humid {humid:.2f}")
          print(f"  rule strengths: low {low:.2f}, medium {medium:.2f}, high {high:.2f}")
          s = np.linspace(0, 100, 1001)      # possible fan speeds, %
          shape = np.maximum.reduce([
              np.minimum(low,    np.clip(1 - s / 50, 0, 1)),          # low: 1 at 0%, 0 at 50%
              np.minimum(medium, np.clip(1 - abs(s - 50) / 25, 0, 1)),  # medium: peak at 50%
              np.minimum(high,   np.clip((s - 50) / 50, 0, 1))])       # high: 0 at 50%, 1 at 100%
          return (s * shape).sum() / shape.sum()                        # centroid

      for temp, hum in [(28, 60), (28, 40)]:
          print(f"{temp} C, {hum}% humidity:")
          print(f"  fan speed {fan_speed(temp, hum):.1f}%")
      ```

      At 28 °C and 60% humidity the fan runs at 72.8%.

      :::predict The air dries to 40% humidity at the same 28 °C. Which rule now fires hardest, and does the fan speed up or slow down?
      Humid drops to 0.25 and dry rises to 0.75. R2 (warm and dry → medium) fires at min(0.7, 0.75) = 0.7, and high falls to max(0.3, 0.25) = 0.3. The balance point shifts left, and the fan slows to 59.8%. Try other readings, such as 20 °C or 33 °C, and notice that small changes in the room give small changes in speed.
      :::

      :::papers Centroid defuzzification
      $$u^* = \frac{\int u\,\mu(u)\,du}{\int \mu(u)\,du}, \qquad \mu(u) = \max_{k} \min\big(w_k,\ \mu_{B_k}(u)\big)$$

      $u$ ranges over fan speeds, $w_k$ is rule $k$'s strength (0.7 for high, 0.25 for medium), $\mu_{B_k}$ is the output shape that rule names, and $\mu(u)$ is the clipped-and-combined shape. The code approximates both integrals with sums over 1,001 speeds.
      :::
  - id: fuzzy-sets-and-control.s4
    title: "Sugeno: skip the shapes"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.fuzzy-sets-and-control
    markdown: |-
      Computing a centroid over a whole shape is slow on a tiny chip. A **Sugeno** (Takagi–Sugeno) controller, proposed by Tomohiro Takagi and Michio Sugeno in 1985, takes a shortcut: each rule outputs a number, or a simple formula of the inputs, instead of a shape. The final output is the strength-weighted average of the rule outputs.

      In a zero-order Sugeno controller, each rule outputs a constant. Say low = 20%, medium = 50%, and high = 90%. At 28 °C and 60% humidity, R2 (0.25), R3 (0.3), and R4 (0.7) fire, and each rule counts separately in the average:

      $$u = \frac{0.25 \times 50 + 0.3 \times 90 + 0.7 \times 90}{0.25 + 0.3 + 0.7} = \frac{102.5}{1.25} = 82\%$$

      Same rules, same room, different answer (82% versus Mamdani's 72.8%), because the way rule outputs are combined changed. Sugeno controllers are cheap to compute, and their output numbers can be tuned from data, which makes them the usual choice when fuzzy rules are combined with learning.
  - id: fuzzy-sets-and-control.s5
    title: Where fuzzy control earns its keep
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.fuzzy-sets-and-control
    markdown: |-
      :::story The subway that brakes like an expert driver
      In 1987 the Namboku Line of the Sendai subway in Japan opened with a fuzzy controller, designed by engineers at Hitachi, running acceleration, braking, and stopping. Its rules captured the judgment of a skilled driver, such as braking gently when the train is near the stop mark and only slightly fast, and the line became known for smooth starts and stops. Around 1990, Japanese makers were putting "fuzzy" on washing machines, rice cookers, and camcorders.
      :::

      Fuzzy control fits when experts can describe good behavior in words, the process is too awkward to model exactly, and smooth, predictable responses matter: appliances, climate control, cement kilns, train braking.

      Readable rules don't make the controller's behavior obvious, though. With a dozen overlapping rules, check it the way you'd check any controller. Sweep the inputs over a grid, plot the output surface, and look for jumps and flat spots. Then run it against a simulation of the real system, including sensor noise, before it touches hardware.
  - id: fuzzy-sets-and-control.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.fuzzy-sets-and-control
    markdown: Compute memberships, rule strengths, and Sugeno outputs by hand, then decide how fuzzy control fits a shower mixer, a greenhouse, and a medical-risk report.
    takeaway: |-
      A membership degree says how well a known value fits a vague word, which is different from a probability. A fuzzy controller fuzzifies readings, fires rules with min and max, and defuzzifies to one smooth output.
  - id: fuzzy-sets-and-control.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.fuzzy-sets-and-control
    markdown: |-
      Fuzzy membership describes how well a value fits a gradual category. Defined rules combine those degrees into an output; membership is not automatically probability.
