assessment_families:
- id: fuzzy-sets-and-control.base
  objective_ref: objective.fuzzy-sets-and-control
  task: base
  response_type: single_choice
  points: 1
  hint: 'Define rule combination explicitly: trace the inputs, operation, and result before choosing.'
  remediation_scene: fuzzy-sets-and-control.s2
  variants:
  - id: fuzzy-sets-and-control.base.1
    prompt: Does fuzzy membership 0.7 necessarily mean 70 percent probability?
    options:
    - id: c
      text: Only for temperature
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Membership grade and probability describe different concepts.
  - id: fuzzy-sets-and-control.base.2
    prompt: What does defuzzification produce?
    options:
    - id: a
      text: A crisp output from an aggregated fuzzy representation
    - id: b
      text: A complete causal proof
    - id: c
      text: Only a new category name
    answer: a
    feedback: A controller eventually needs an executable command.
- id: fuzzy-sets-and-control.transfer
  objective_ref: objective.fuzzy-sets-and-control
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate the full controller: trace the inputs, operation, and result before choosing.'
  remediation_scene: fuzzy-sets-and-control.s4
  variants:
  - id: fuzzy-sets-and-control.transfer.1
    prompt: Do minimum and product conjunction always give identical results?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if inputs are fractional
    answer: a
    feedback: Operator choice changes rule activation.
  - id: fuzzy-sets-and-control.transfer.2
    prompt: Does readable rule wording guarantee stable control?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if every rule is short
    - id: a
      text: 'No'
    answer: a
    feedback: System interactions and dynamics require evaluation.
