assessment_families:
  - id: fuzzy-sets-and-control.base
    objective_ref: objective.fuzzy-sets-and-control
    task: base
    response_type: single_choice
    points: 1
    hint: 'Define rule combination explicitly: trace the inputs, operation, and result before choosing.'
    remediation_scene: fuzzy-sets-and-control.s2
    variants:
      - id: fuzzy-sets-and-control.base.1
        prompt: Does fuzzy membership 0.7 necessarily mean 70 percent probability?
        options:
          - id: c
            text: Only for temperature
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Membership grade and probability describe different concepts.
        retired: true
      - id: fuzzy-sets-and-control.base.2
        prompt: What does defuzzification produce?
        options:
          - id: a
            text: A crisp output from an aggregated fuzzy representation
          - id: b
            text: A complete causal proof
          - id: c
            text: Only a new category name
        answer: a
        feedback: A controller eventually needs an executable command.
        retired: true
  - id: fuzzy-sets-and-control.transfer
    objective_ref: objective.fuzzy-sets-and-control
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate the full controller: trace the inputs, operation, and result before choosing.'
    remediation_scene: fuzzy-sets-and-control.s4
    variants:
      - id: fuzzy-sets-and-control.transfer.1
        prompt: Do minimum and product conjunction always give identical results?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if inputs are fractional
        answer: a
        feedback: Operator choice changes rule activation.
        retired: true
      - id: fuzzy-sets-and-control.transfer.2
        prompt: Does readable rule wording guarantee stable control?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if every rule is short
          - id: a
            text: 'No'
        answer: a
        feedback: System interactions and dynamics require evaluation.
        retired: true
  - id: fuzzy-sets-and-control.base.v2
    objective_ref: objective.fuzzy-sets-and-control
    task: base
    response_type: single_choice
    points: 1
    hint: Keep the four steps apart. Fuzzify a reading into degrees, AND with min and OR with max, clip and combine output shapes, then take the centroid.
    remediation_scene: fuzzy-sets-and-control.s2
    variants:
      - id: fuzzy-sets-and-control.base.v2.1
        prompt: "A rule reads: IF temperature is hot AND humidity is humid THEN fan high. Hot is 0.6 and humid is 0.9. Using the standard fuzzy operators, how strongly does the rule fire?"
        options:
          - id: b
            text: 0.9, since the stronger condition sets the rule's strength
          - id: a
            text: 0.6, since AND takes the weaker of the two conditions
          - id: c
            text: 1.5, since the two memberships add up for an AND rule
        answer: a
        feedback: Fuzzy AND is the minimum, so the rule is as true as its weakest condition, 0.6. Taking the larger value is fuzzy OR, and adding memberships can exceed 1, which no degree can.
      - id: fuzzy-sets-and-control.base.v2.2
        prompt: A Mamdani controller's rules fire "high" at 0.7 and "medium" at 0.25. What does defuzzification do next?
        options:
          - id: c
            text: Picks "high," since it has the largest rule strength
          - id: b
            text: Averages 0.7 and 0.25 to get the fan's speed setting
          - id: a
            text: Finds the balance point of the clipped, combined output shape
        answer: a
        feedback: Defuzzification turns the combined fuzzy output into one number, here by the centroid. Picking the top word throws away the smooth blending, and averaging rule strengths mixes up degrees with fan speeds.
      - id: fuzzy-sets-and-control.base.v2.3
        prompt: Why does a fuzzy fan controller change speed smoothly when the room warms from 24.9 °C to 25.1 °C, while a threshold controller jumps?
        options:
          - id: a
            text: Overlapping membership functions shift rule strengths gradually
          - id: b
            text: The fuzzy controller averages many noisy temperature readings
          - id: c
            text: Fuzzy rules fire with random strengths that smooth the output
        answer: a
        feedback: Near 25 °C, "warm" and "hot" memberships change a little for a small temperature change, so rule strengths and the centroid move a little too. Nothing is averaged over time or randomized.
      - id: fuzzy-sets-and-control.base.v2.4
        prompt: The same four rules run once as a Mamdani controller and once as a zero-order Sugeno controller, and give 72.8% and 82%. What explains the difference?
        options:
          - id: b
            text: One of the two has a mistake, since the same rules must agree
          - id: a
            text: Sugeno replaces output shapes with fixed numbers and averages them
          - id: c
            text: Sugeno uses max for AND, which makes the rules fire harder
        answer: a
        feedback: Mamdani takes the centroid of clipped output shapes, while Sugeno takes a strength-weighted average of each rule's output number. Different output designs give different results from the same rule strengths. Both use min (or product) for AND.
  - id: fuzzy-sets-and-control.transfer.v2
    objective_ref: objective.fuzzy-sets-and-control
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask whether the number describes a vague word applied to a known value (membership) or an uncertain event (probability), and whether expert rules or smooth output matter.
    remediation_scene: fuzzy-sets-and-control.s1
    variants:
      - id: fuzzy-sets-and-control.transfer.v2.1
        prompt: A health app shows "your blood pressure is high to degree 0.6." A user reads this as a 60% chance of having high blood pressure. What is the better reading?
        options:
          - id: c
            text: It is the probability that the measurement was taken correctly
          - id: a
            text: The known reading fits the category "high" moderately well
          - id: b
            text: Six out of ten people with that reading are later diagnosed
        answer: a
        feedback: A membership degree grades how well a known value fits a vague category. It isn't a chance of anything; measurement error and diagnosis rates are separate, probabilistic questions.
      - id: fuzzy-sets-and-control.transfer.v2.2
        prompt: A shower-mixer maker has experienced plumbers who describe good behavior as "if the water is a bit cold and the flow is strong, open the hot valve a little." No accurate model of the pipes exists. Which approach fits?
        options:
          - id: a
            text: A fuzzy controller built from the plumbers' rules, then tested
          - id: b
            text: A threshold rule that opens the hot valve fully below 38 °C
          - id: c
            text: A probability model of whether the water is cold or not
        answer: a
        feedback: Expert rules in words, no exact model, and a need for smooth adjustments are exactly where fuzzy control fits. A threshold rule jumps between extremes, and the water temperature isn't uncertain, just described vaguely.
      - id: fuzzy-sets-and-control.transfer.v2.3
        prompt: A greenhouse's fuzzy vent controller has 15 overlapping rules. The engineer says, "Each rule is readable, so the controller is safe." What should she do before deploying?
        options:
          - id: b
            text: Rewrite each rule in plainer words so operators can review it
          - id: c
            text: Remove every rule that overlaps with another to avoid conflicts
          - id: a
            text: Sweep the inputs, plot the output surface, and test in simulation
        answer: a
        feedback: Readable rules can still interact in surprising ways. Sweeping inputs reveals jumps and dead zones, and a simulation with noise shows how it behaves in closed loop. Removing overlaps would destroy the smooth blending that fuzzy control depends on.
      - id: fuzzy-sets-and-control.transfer.v2.4
        prompt: A team wants to learn a fuzzy controller's output values from logged data with a gradient-based fit. Which controller type makes this easiest?
        options:
          - id: c
            text: Mamdani, because clipped shapes carry more information
          - id: a
            text: Zero-order Sugeno, since outputs are numbers in a weighted average
          - id: b
            text: Threshold control, because it has fewer parameters to fit
        answer: a
        feedback: In a Sugeno controller the output is a smooth weighted average of the rule numbers, so those numbers can be fit directly. Mamdani's centroid of clipped shapes is harder to tune, and a threshold rule isn't fuzzy at all.
  - id: fuzzy-sets-and-control.calculate
    objective_ref: objective.fuzzy-sets-and-control
    task: base
    response_type: numeric
    points: 1
    hint: Read memberships off the ramps and triangles, use min for AND, then for Sugeno multiply each rule's strength by its output number, add, and divide by the total strength.
    remediation_scene: fuzzy-sets-and-control.s4
    absolute_tolerance: 0.01
    variants:
      - id: fuzzy-sets-and-control.calculate.1
        prompt: "\"Warm\" is a triangle that is 0 at 15 °C, 1 at 25 °C, and 0 at 35 °C. What is the membership of 31 °C in \"warm\"?"
        answer: 0.4
        feedback: On the falling side, membership is (35 − 31)/(35 − 25) = 4/10 = 0.4.
      - id: fuzzy-sets-and-control.calculate.2
        prompt: Humid rises from 0 at 30% to 1 at 70% humidity. Warm is 0.7. What is the strength of the rule IF warm AND humid, at 50% humidity, using min for AND?
        answer: 0.5
        feedback: Humid is (50 − 30)/40 = 0.5. The rule strength is min(0.7, 0.5) = 0.5.
      - id: fuzzy-sets-and-control.calculate.3
        prompt: A zero-order Sugeno controller has two rules firing, one at strength 0.25 with output 2 and one at 0.75 with output 8. What is its output?
        answer: 6.5
        feedback: (0.25 × 2 + 0.75 × 8)/(0.25 + 0.75) = (0.5 + 6)/1 = 6.5.
      - id: fuzzy-sets-and-control.calculate.4
        prompt: A zero-order Sugeno fan controller has medium = 50% and high = 90%. Medium fires at 0.7 and high at 0.3. What fan speed, in percent, does it output?
        answer: 62
        feedback: (0.7 × 50 + 0.3 × 90)/(0.7 + 0.3) = (35 + 27)/1 = 62%.
      - id: fuzzy-sets-and-control.calculate.5
        prompt: A rule reads IF hot AND humid, with hot = 0.8 and humid = 0.5. If the controller uses the product for AND instead of min, how strongly does the rule fire?
        answer: 0.4
        feedback: The product gives 0.8 × 0.5 = 0.4, a little weaker than min's 0.5. Which operator you pick changes the controller, so record it.
