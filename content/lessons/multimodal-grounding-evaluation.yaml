assessment_families:
  - id: multimodal-grounding-evaluation.base
    objective_ref: objective.multimodal-grounding-evaluation
    task: base
    response_type: single_choice
    points: 1
    hint: 'Construct minimal contrasts: trace the inputs, operation, and result before choosing.'
    remediation_scene: multimodal-grounding-evaluation.s2
    variants:
      - id: multimodal-grounding-evaluation.base.1
        prompt: A chart model reads the correct values but subtracts incorrectly. Which stage failed?
        options:
          - id: c
            text: Every stage equally
          - id: a
            text: Reasoning or calculation after perception
          - id: b
            text: Image resizing necessarily
        answer: a
        feedback: Diagnostic decomposition locates the error.
        retired: true
      - id: multimodal-grounding-evaluation.base.2
        prompt: Why change only object count between two images?
        options:
          - id: a
            text: To test sensitivity to that visual fact
          - id: b
            text: To guarantee all answers remain identical
          - id: c
            text: To retrain the model
        answer: a
        feedback: Minimal contrasts isolate the relevant evidence change.
        retired: true
  - id: multimodal-grounding-evaluation.transfer
    objective_ref: objective.multimodal-grounding-evaluation
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Report the full media pipeline: trace the inputs, operation, and result before choosing.'
    remediation_scene: multimodal-grounding-evaluation.s4
    variants:
      - id: multimodal-grounding-evaluation.transfer.1
        prompt: What does answering correctly without the image suggest?
        options:
          - id: a
            text: Possible text shortcuts that need investigation
          - id: b
            text: Proof of perfect visual perception
          - id: c
            text: That images cannot ever help
        answer: a
        feedback: Ablation tests the contribution of the modality.
        retired: true
      - id: multimodal-grounding-evaluation.transfer.2
        prompt: Why report crop and frame-sampling settings?
        options:
          - id: b
            text: They only affect display decoration
          - id: c
            text: They guarantee factual truth
          - id: a
            text: They determine what evidence reached the model
        answer: a
        feedback: Preprocessing is part of the evaluated system.
        retired: true
  - id: multimodal-grounding-evaluation.base.v2
    objective_ref: objective.multimodal-grounding-evaluation
    task: base
    response_type: single_choice
    points: 1
    hint: For minimal pairs, check each comparison separately (image picks caption, caption picks image). For yes/no probes, separate false "yes" answers from missed objects.
    remediation_scene: multimodal-grounding-evaluation.s2
    variants:
      - id: multimodal-grounding-evaluation.base.v2.1
        prompt: 'Captions c0 = "the cat is on the mat" and c1 = "the mat is on the cat" belong to images i0 and i1. The model scores s(c0,i0) = 0.30, s(c1,i0) = 0.25, s(c0,i1) = 0.29, s(c1,i1) = 0.27. Which Winoground scores does it pass?'
        options:
          - id: b
            text: Text score only, since image i0 picks caption c0
          - id: c
            text: All three, since the correct pairs score highest overall
          - id: a
            text: Image score only, since each caption picks its own image
        answer: a
        feedback: Image score needs 0.30 > 0.29 and 0.27 > 0.25, both true. Text score needs 0.30 > 0.25 (true) and 0.27 > 0.29 (false), so it fails, and so does the group score. Image i1 prefers the wrong caption.
      - id: multimodal-grounding-evaluation.base.v2.2
        prompt: Two models each get 80 of 100 POPE-style questions right. Model P says "yes" 70 times; model Q says "yes" 40 times. Half the objects are present. What is the most likely difference?
        options:
          - id: a
            text: P tends to invent absent objects; Q tends to miss present ones
          - id: c
            text: P is more cautious than Q, since it has higher precision
          - id: b
            text: They make the same kinds of mistakes, since accuracy is equal
        answer: a
        feedback: An unbiased model says "yes" about 50% of the time here. P's 70% yes ratio means many "yes" answers to absent objects (low precision); Q's 40% means "no" to present ones (low recall). Equal accuracy hides the difference.
      - id: multimodal-grounding-evaluation.base.v2.3
        prompt: Why do POPE-style tests often pick absent objects that commonly appear alongside what is in the photo, like "fork" for a dining table?
        options:
          - id: b
            text: Common objects are easier to name, so the questions are simpler
          - id: a
            text: They catch models that answer from typical scenes rather than the photo
          - id: c
            text: Random absent objects would make the yes ratio impossible to compute
        answer: a
        feedback: A model guessing from habit says "yes, there's a fork" at a dinner table. Asking about an unrelated object, like a giraffe, is too easy to reveal that. The yes ratio can be computed with any sampling.
      - id: multimodal-grounding-evaluation.base.v2.4
        prompt: Scoring +1 for right, 0 for "can't tell", and −2 for wrong, model X gets 80 right and 20 wrong; model Y gets 78 right, 7 wrong, and 15 "can't tell". What are their scores?
        options:
          - id: c
            text: X scores 80 and Y scores 78, the same order as plain accuracy
          - id: a
            text: X scores 40 and Y scores 64, so abstaining when unsure pays off
          - id: b
            text: X scores 60 and Y scores 71, since each wrong answer costs 1
        answer: a
        feedback: X = 80 − 2 × 20 = 40 and Y = 78 − 2 × 7 = 64. With confident mistakes penalized, Y's 15 abstentions are worth far more than X's extra 2 correct answers. Charging −1 per wrong answer gives 60 and 71, the wrong rule here.
  - id: multimodal-grounding-evaluation.transfer.v2
    objective_ref: objective.multimodal-grounding-evaluation
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask which failure a single accuracy number would hide here, then choose the test that separates it out.
    remediation_scene: multimodal-grounding-evaluation.s4
    variants:
      - id: multimodal-grounding-evaluation.transfer.v2.1
        prompt: A museum-guide VLM scores 85% on visitor questions about paintings. A curator suspects it answers from famous-painting facts. Which test checks that most directly?
        options:
          - id: b
            text: Ask the same questions with more detailed wording
          - id: c
            text: Test it on higher-resolution scans of the same paintings
          - id: a
            text: Ask the questions without the image and compare the score
        answer: a
        feedback: A question-only baseline shows how much accuracy comes without looking. If it stays near 85%, the model is reciting facts. Rewording and resolution don't separate knowledge from seeing.
      - id: multimodal-grounding-evaluation.transfer.v2.2
        prompt: A medical-report tool describes chest X-rays. It rarely misses real findings but sometimes reports findings that aren't there. Which POPE-style numbers will show this?
        options:
          - id: a
            text: High recall, lower precision, and a yes ratio above the true rate
          - id: b
            text: Low recall, high precision, and a yes ratio below the true rate
          - id: c
            text: Accuracy alone, since both errors lower it by the same amount
        answer: a
        feedback: Rarely missing means high recall; invented findings are false "yes" answers, which lower precision and push the yes ratio up. Accuracy mixes both errors into one number.
      - id: multimodal-grounding-evaluation.transfer.v2.3
        prompt: A parking assistant must tell "the car is behind the pole" from "the pole is behind the car". What test set fits best?
        options:
          - id: c
            text: Many photos of cars, each with a yes/no question about the pole
          - id: a
            text: Pairs of photos and captions that swap the two objects' roles
          - id: b
            text: A large set of varied street photos with human-written captions
        answer: a
        feedback: Minimal pairs with swapped roles test whether the model uses word order and spatial relations. Presence questions ignore the relation, and varied captions rarely contain the swapped version needed to catch a bag-of-words model.
      - id: multimodal-grounding-evaluation.transfer.v2.4
        prompt: A shopping assistant's report shows 90% overall accuracy. Broken down, reading prices is 60%. What should the release report do?
        options:
          - id: b
            text: Report 90% as the headline, since the average is what users see
          - id: a
            text: Report accuracy by question type, including the 60% on prices
          - id: c
            text: Remove the price questions, since they drag the average down
        answer: a
        feedback: Users who ask about prices get the 60% experience, and the breakdown points to the fix, likely resolution or tiling for small text. An overall number hides it, and dropping the questions hides it permanently.
  - id: multimodal-grounding-evaluation.calculate
    objective_ref: objective.multimodal-grounding-evaluation
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Accuracy = (right "yes" + right "no") ÷ total. Precision = right "yes" ÷ all "yes". Recall = right "yes" ÷ objects present. Then compare the false "yes" count with the missed count.
    remediation_scene: multimodal-grounding-evaluation.s5
    absolute_tolerance: 0.005
    numeric_fields:
      - id: accuracy
        label: Accuracy (as a fraction, e.g. 0.75)
      - id: precision
        label: Precision
      - id: recall
        label: Recall
    variants:
      - id: multimodal-grounding-evaluation.calculate.1
        prompt: 'On 100 POPE-style questions (50 objects present, 50 absent), a model says "yes" to 48 present objects and to 25 absent ones. Give accuracy, precision, and recall, then the main failure.'
        feedback: Right answers are 48 "yes" plus 50 − 25 = 25 "no", so accuracy is 73 ÷ 100 = 0.73. Precision is 48 ÷ 73 = 0.658 and recall 48 ÷ 50 = 0.96. The 25 false "yes" answers dwarf the 2 misses, so it invents objects.
        answers:
          accuracy: 0.73
          precision: 0.658
          recall: 0.96
        reason_answer: invents
        reason_options:
          - id: invents
            text: It says "yes" to objects that aren't in the photo
          - id: misses
            text: It says "no" to objects that are in the photo
          - id: even
            text: Its two kinds of error are about equally common
      - id: multimodal-grounding-evaluation.calculate.2
        prompt: 'On 100 POPE-style questions (50 present, 50 absent), a model says "yes" to 30 present objects and to 5 absent ones. Give accuracy, precision, and recall, then the main failure.'
        feedback: Right answers are 30 + 45 = 75, so accuracy is 0.75. Precision is 30 ÷ 35 = 0.857 and recall 30 ÷ 50 = 0.60. The 20 misses outnumber the 5 false "yes" answers, so it misses real objects.
        answers:
          accuracy: 0.75
          precision: 0.857
          recall: 0.6
        reason_answer: misses
        reason_options:
          - id: even
            text: Its two kinds of error are about equally common
          - id: invents
            text: It says "yes" to objects that aren't in the photo
          - id: misses
            text: It says "no" to objects that are in the photo
      - id: multimodal-grounding-evaluation.calculate.3
        prompt: 'On 100 POPE-style questions (50 present, 50 absent), a model says "yes" to 40 present objects and to 10 absent ones. Give accuracy, precision, and recall, then the main failure.'
        feedback: Right answers are 40 + 40 = 80, so accuracy is 0.80. Precision is 40 ÷ 50 = 0.80 and recall 40 ÷ 50 = 0.80. There are 10 false "yes" answers and 10 misses, an even split.
        answers:
          accuracy: 0.8
          precision: 0.8
          recall: 0.8
        reason_answer: even
        reason_options:
          - id: misses
            text: It says "no" to objects that are in the photo
          - id: even
            text: Its two kinds of error are about equally common
          - id: invents
            text: It says "yes" to objects that aren't in the photo
      - id: multimodal-grounding-evaluation.calculate.4
        prompt: 'On 100 POPE-style questions (50 present, 50 absent), a model says "yes" to 45 present objects and to 15 absent ones. Give accuracy, precision, and recall, then the main failure.'
        feedback: Right answers are 45 + 35 = 80, so accuracy is 0.80. Precision is 45 ÷ 60 = 0.75 and recall 45 ÷ 50 = 0.90. The 15 false "yes" answers are three times the 5 misses, so it mainly invents objects.
        answers:
          accuracy: 0.8
          precision: 0.75
          recall: 0.9
        reason_answer: invents
        reason_options:
          - id: invents
            text: It says "yes" to objects that aren't in the photo
          - id: even
            text: Its two kinds of error are about equally common
          - id: misses
            text: It says "no" to objects that are in the photo
