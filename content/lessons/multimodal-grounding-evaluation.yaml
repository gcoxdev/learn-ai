schema_version: 0.2-draft
lesson:
  id: multimodal-grounding-evaluation
  version: 0.4.0-draft
  title: Check whether answers actually follow the supplied media
  state: draft
  summary: Two models both score 75%. One invents objects that aren't there; the other misses ones that are. Learn the tests that tell them apart before a user finds out.
  slot: M23.8
  category: learning
  sources:
    - title: "Evaluating Object Hallucination in Large Vision-Language Models (POPE; Li et al., 2023)"
      url: https://arxiv.org/abs/2305.10355
    - title: "Winoground: Probing Vision and Language Models for Visio-Linguistic Compositionality (Thrush et al., 2022)"
      url: https://arxiv.org/abs/2204.03162
    - title: "Object Hallucination in Image Captioning (CHAIR; Rohrbach et al., 2018)"
      url: https://arxiv.org/abs/1809.02156
    - title: "MME: A Comprehensive Evaluation Benchmark for Multimodal Large Language Models (Fu et al., 2023)"
      url: https://arxiv.org/abs/2306.13394
    - title: "MMMU: A Massive Multi-discipline Multimodal Understanding and Reasoning Benchmark (Yue et al., 2023)"
      url: https://arxiv.org/abs/2311.16502
objectives:
  - id: objective.multimodal-grounding-evaluation
    version: 2-draft
    statement: Multimodal evaluation should distinguish perception, cross-modal alignment, reasoning, and generation; contrastive examples and modality ablations expose shortcuts and unsupported answers.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - multimodal-grounding-evaluation.base.v2
      - multimodal-grounding-evaluation.transfer.v2
      - multimodal-grounding-evaluation.calculate
    prerequisites:
      - anyOf:
          - objective.multimodal-alignment-and-fusion
      - anyOf:
          - objective.evaluation-selection
scenes:
  - id: multimodal-grounding-evaluation.s1
    title: One wrong answer, three possible causes
    type: explanation
    depth: intuition
    objective_refs:
      - objective.multimodal-grounding-evaluation
    markdown: |-
      Amara holds up a blister pack and asks Lumen, "How many pills are left?" Lumen says four. There are three. Before anyone can fix this, they need to know *which step* failed:

      | Step | What had to happen | How it could fail |
      | --- | --- | --- |
      | See | Find each filled pocket in the photo | Glare hid one pocket, or an empty one looked full |
      | Count | Keep track of the pockets found | Counted one pocket twice |
      | Say | Report what was seen | Said "four" because packs often hold four, ignoring the photo |

      An answer is **grounded** when it follows from the media the model was given, not from what's typical. The third row, an answer that sounds right but isn't supported by the image, is what this lesson hunts. Adding something that isn't in the picture is a **hallucination**.

      To tell the rows apart, test the steps separately: "Is pocket 2 full?" for each pocket, then "How many full pockets are there?" A model that gets every pocket right but still says "four" has a counting or language problem, not a vision problem.
    bridges: []
  - id: multimodal-grounding-evaluation.s5
    title: "Is there a fork? Probing for invented objects"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multimodal-grounding-evaluation
    markdown: |-
      **POPE** (Polling-based Object Probing Evaluation; Li et al., 2023) tests hallucination with yes/no questions: "Is there a {object} in the image?" Half the objects are really there. The absent ones are picked at random, from the dataset's most common objects, or, hardest, from objects that often appear *alongside* what's in the photo: a dining table with no fork makes "Is there a fork?" a real test.

      Lumen's team runs 100 POPE-style questions, 50 present and 50 absent, on two candidate models:

      | | Says "yes", object present | Says "no", object present | Says "yes", object absent | Says "no", object absent |
      | --- | ---: | ---: | ---: | ---: |
      | Model A | 45 | 5 | **20** | 30 |
      | Model B | 35 | **15** | 10 | 40 |

      Both get 75 of 100 right, but A invents objects 20 times while B misses real ones 15 times. POPE's other numbers show the difference. **Precision** is how often a "yes" is right: A's is $45 / 65 = 0.692$. **Recall** is the share of present objects that get a "yes": A's is $45 / 50 = 0.900$. The **yes ratio** is how often the model says "yes" at all: 65% for A, against 50% for an unbiased model. **F1**, in the program, is the harmonic mean of precision and recall. POPE found many vision-language models lean toward "yes", model A's pattern.

      ```python run
      def pope_scores(tp, fn, fp, tn):
          """tp: 'yes' when present, fn: 'no' when present, fp: 'yes' when absent, tn: 'no' when absent."""
          total = tp + fn + fp + tn
          precision, recall = tp / (tp + fp), tp / (tp + fn)
          return {"accuracy": (tp + tn) / total, "precision": precision, "recall": recall,
                  "F1": 2 * precision * recall / (precision + recall),
                  "yes ratio": (tp + fp) / total}

      for name, counts in {"Model A": (45, 5, 20, 30), "Model B": (35, 15, 10, 40)}.items():
          s = pope_scores(*counts)
          print(name, " ".join(f"{k} {v:.3f}" for k, v in s.items()))
      ```

      Change model B's counts to `(50, 0, 25, 25)`, a model that says "yes" whenever it half-suspects, and watch recall hit 1.000 while precision falls.

      :::predict Which model should Lumen ship for describing a room to Amara?
      It depends on which error hurts more, which 75% can't tell you. For "Is there a step down in front of me?", a miss (B's weakness) is dangerous. For "Is this my medication?", a false "yes" (A's weakness) is. Lumen's team tracks precision and recall for each question type.
      :::
    bridges: []
  - id: multimodal-grounding-evaluation.s2
    title: Swap two words and see if it notices
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multimodal-grounding-evaluation
    markdown: |-
      "Is there a cup?" only tests which objects are present. Amara also needs *relations*: what's on what, which is left, how many. The sharpest test is a **minimal pair**: two captions with the same words in a different order, and two images that each match one.

      **Winoground** (Thrush et al., 2022) has 400 hand-made examples like this, such as "some plants surrounding a lightbulb" and "a lightbulb surrounding some plants", each caption with its own photo. Given similarity scores $s(c, i)$ for caption $c$ and image $i$ (caption 0 belongs with image 0):

      - **Text score**: each image prefers its own caption. $s(c_0, i_0) > s(c_1, i_0)$ and $s(c_1, i_1) > s(c_0, i_1)$.
      - **Image score**: each caption prefers its own image. $s(c_0, i_0) > s(c_0, i_1)$ and $s(c_1, i_1) > s(c_1, i_0)$.
      - **Group score**: both at once.

      Random scores pass the text test 25% of the time (two coin flips), the image test 25%, and the group test $1/6 \approx 16.7\%$ (the two correct pairs must be the top two of four scores). In the paper, most models, CLIP among them, scored close to or below chance on the group score, while humans scored far above it.

      ```python run
      def winoground(s):
          """s[c][i] = similarity of caption c with image i; caption 0 belongs to image 0."""
          text = s[0][0] > s[1][0] and s[1][1] > s[0][1]    # each image picks its own caption
          image = s[0][0] > s[0][1] and s[1][1] > s[1][0]   # each caption picks its own image
          return text, image, text and image

      pairs = {
          "cup on book / book on cup":       [[0.31, 0.30], [0.29, 0.28]],
          "dog chases cat / cat chases dog": [[0.33, 0.27], [0.26, 0.30]],
          "two mugs / three mugs":           [[0.30, 0.31], [0.27, 0.32]],
      }
      totals = [0, 0, 0]
      for name, s in pairs.items():
          result = winoground(s)
          totals = [t + r for t, r in zip(totals, result)]
          print(f"{name:32s} text {result[0]!s:5} image {result[1]!s:5} group {result[2]}")
      print("text, image, group:", [f"{t}/{len(pairs)}" for t in totals])
      ```

      In the first pair, the model prefers "cup on book" for *both* photos: it notices the words, not their order. In the third, it prefers the three-mug photo for both captions. Try making the first pair pass by changing a single number.

      Build pairs like these for any relation you care about: counts, left versus right, and, for video, order ("opened then closed" versus "closed then opened").
    bridges: []
  - id: multimodal-grounding-evaluation.s3
    title: Reward "I can't tell"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multimodal-grounding-evaluation
    markdown: |-
      Some of Amara's questions can't be answered from the photo: the expiry date is off the edge, or the label is blurred. A grounded model should say so, but plain accuracy counts "I can't tell" as wrong.

      So Lumen's team adds unanswerable photos and scores so that confident mistakes cost more than abstaining: +1 for a correct answer, 0 for "I can't tell", −2 for a wrong one.

      | Model | Right | Wrong | "Can't tell" | Accuracy | Score |
      | --- | ---: | ---: | ---: | ---: | ---: |
      | X, always answers | 80 | 20 | 0 | 80% | $80 - 40 = 40$ |
      | Y, abstains when unsure | 78 | 7 | 15 | 78% | $78 - 14 = 64$ |

      By accuracy, X wins. By the score that matches Amara's needs, Y wins easily. The penalty is a choice about harm: set it by asking what a confident wrong answer costs the user.
    bridges: []
  - id: multimodal-grounding-evaluation.s4
    title: One number hides five failures
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multimodal-grounding-evaluation
    markdown: |-
      Put the pieces together into Lumen's release report. Suppose the headline says 81% overall. Broken down:

      | Question type | Accuracy | What it tests |
      | --- | ---: | --- |
      | Object present? (POPE-style) | 88% (precision 0.84, recall 0.95) | Hallucinated objects |
      | Counting | 52% | Keeping track of several items |
      | Left / right / on / under | 61% | Relations (minimal pairs) |
      | Reading labels | 84% | Small text after resizing |
      | Unanswerable photos | 40% abstained | Knowing what the photo can't show |
      | Question only, no photo | 63% | How much comes from guessing |

      :::mixup "81% overall means Lumen is right about four times in five, whatever you ask."
      The average is dominated by easy, common questions; ask Lumen to count pills and it's closer to a coin flip. And the average changes whenever the mix of questions does.
      :::

      Two more things belong in the report, because they decide what the model saw: the preprocessing (resolution, crop or tiling, frames per second) and the exact prompt and answer format. A model tested with tiling and shipped without it will read labels far worse than the report says.

      Everything in this module feeds this table: ablations from the fusion lesson, typographic tests from the CLIP lesson, resolution from the vision-language interface lesson, frame rates from the video lesson. Each row points to the part of the system to fix.
    bridges: []
  - id: multimodal-grounding-evaluation.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.multimodal-grounding-evaluation
    markdown: POPE-style counts to score by hand, minimal pairs to read, and a museum guide, a medical-report checker, and a parking assistant test whether you can see past a single accuracy number.
    takeaway: |-
      Test grounding piece by piece: yes/no probes with precision and recall for invented objects, minimal pairs for relations, unanswerable cases that reward "I can't tell", and a question-only baseline. Report results by question type, because one average hides which failure you have.
  - id: multimodal-grounding-evaluation.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.multimodal-grounding-evaluation
    markdown: |-
      Break a media question into the evidence steps it requires. Change or remove relevant media to check whether the answer actually depends on it.
