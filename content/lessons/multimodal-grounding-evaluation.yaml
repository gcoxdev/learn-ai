schema_version: 0.2-draft
lesson:
  id: multimodal-grounding-evaluation
  version: 0.1.0-draft
  title: Check whether answers actually follow the supplied media
  state: draft
  summary: Multimodal evaluation should distinguish perception, cross-modal alignment, reasoning, and generation;
    contrastive examples and modality ablations expose shortcuts and unsupported answers.
  slot: M23.8
  category: learning
  sources:
  - title: MME
    url: https://arxiv.org/abs/2306.13394
  - title: MMMU
    url: https://arxiv.org/abs/2311.16502
  - title: Learning Transferable Visual Models From Natural Language Supervision
    url: https://arxiv.org/abs/2103.00020
objectives:
- id: objective.multimodal-grounding-evaluation
  version: 1-draft
  statement: Multimodal evaluation should distinguish perception, cross-modal alignment, reasoning, and generation;
    contrastive examples and modality ablations expose shortcuts and unsupported answers.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - multimodal-grounding-evaluation.base
  - multimodal-grounding-evaluation.transfer
  prerequisites:
  - anyOf:
    - objective.multimodal-alignment-and-fusion
  - anyOf:
    - objective.evaluation-selection
scenes:
- id: multimodal-grounding-evaluation.s1
  title: Break a task into evidence steps
  type: explanation
  depth: intuition
  objective_refs:
  - objective.multimodal-grounding-evaluation
  markdown: A chart question can require reading labels, locating values, comparing them, and expressing the result.
    An error at any stage can produce a wrong answer. Preserve enough diagnostic examples to distinguish perception
    failure from arithmetic or language-generation failure.
  text_mode: A chart question can require reading labels, locating values, comparing them, and expressing the result.
    An error at any stage can produce a wrong answer. Preserve enough diagnostic examples to distinguish perception
    failure from arithmetic or language-generation failure.
  bridges: []
- id: multimodal-grounding-evaluation.s2
  title: Construct minimal contrasts
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multimodal-grounding-evaluation
  markdown: Create two images differing only in the number or position of an object and keep the question fixed.
    A grounded answer should respond to the relevant change. Reverse misleading text cues or remove media to test
    whether language priors explain apparent success.
  text_mode: Create two images differing only in the number or position of an object and keep the question fixed.
    A grounded answer should respond to the relevant change. Reverse misleading text cues or remove media to test
    whether language priors explain apparent success.
  bridges: []
- id: multimodal-grounding-evaluation.s3
  title: Cover absent and contradictory evidence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multimodal-grounding-evaluation
  markdown: Ask questions whose answers are not visible, include unclear audio, or supply conflicting captions and
    images. Evaluate calibrated uncertainty and appropriate requests for better evidence. A system that always produces
    a confident answer may score well on answerable cases while failing these boundaries.
  text_mode: Ask questions whose answers are not visible, include unclear audio, or supply conflicting captions
    and images. Evaluate calibrated uncertainty and appropriate requests for better evidence. A system that always
    produces a confident answer may score well on answerable cases while failing these boundaries.
  bridges: []
- id: multimodal-grounding-evaluation.s4
  title: Report the full media pipeline
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multimodal-grounding-evaluation
  markdown: Record resolution, crops, frame sampling, audio preprocessing, prompt, candidate choices, and scoring.
    Examine spatial reasoning, OCR, counting, timing, and subgroup performance separately. Automated judges and
    embedding scores are useful measurements with limitations, not substitutes for every task-specific check.
  text_mode: Record resolution, crops, frame sampling, audio preprocessing, prompt, candidate choices, and scoring.
    Examine spatial reasoning, OCR, counting, timing, and subgroup performance separately. Automated judges and
    embedding scores are useful measurements with limitations, not substitutes for every task-specific check.
  bridges: []
- id: multimodal-grounding-evaluation.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.multimodal-grounding-evaluation
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Multimodal evaluation should distinguish perception, cross-modal alignment, reasoning, and generation;
    contrastive examples and modality ablations expose shortcuts and unsupported answers.
- id: multimodal-grounding-evaluation.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.multimodal-grounding-evaluation
  markdown: Multimodal evaluation should distinguish perception, cross-modal alignment, reasoning, and generation;
    contrastive examples and modality ablations expose shortcuts and unsupported answers.
  text_mode: Multimodal evaluation should distinguish perception, cross-modal alignment, reasoning, and generation;
    contrastive examples and modality ablations expose shortcuts and unsupported answers.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - multimodal-grounding-evaluation.s1
    - multimodal-grounding-evaluation.s2
    - multimodal-grounding-evaluation.s3
