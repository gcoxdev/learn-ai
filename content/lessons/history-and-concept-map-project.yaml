schema_version: 0.2-draft
lesson:
  id: history-and-concept-map-project
  version: 0.2.0-draft
  title: 'Project: explain AI through a historical concept map'
  state: draft
  summary: Draw a map that explains how AI ideas connect, then challenge its arrows.
  slot: M36.1
  category: learning
  minutes: 35
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.history-and-concept-map-project
  version: 1-draft
  statement: Build and defend a concept map that distinguishes historical influence, conceptual prerequisites,
    and competing approaches; a timeline alone does not explain how a system works.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - history-and-concept-map-project.base
  - history-and-concept-map-project.transfer
  prerequisites:
  - anyOf:
    - objective.history
  - anyOf:
    - objective.symbolic-neural-boundaries
  - anyOf:
    - objective.research-reporting
scenes:
- id: history-and-concept-map-project.s1
  title: Your deliverable
  type: explanation
  depth: intuition
  objective_refs:
  - objective.history-and-concept-map-project
  markdown: 'On paper or in a local document, draw twelve nodes: symbolic rules, search, probability, datasets,
    statistical learning, neural networks, gradients, representations, attention, foundation models, reinforcement
    learning, and evaluation. Add at least twelve labeled edges. The course does not upload or automatically
    grade this artifact; the quiz checks concepts used to build it.'
  text_mode: 'On paper or in a local document, draw twelve nodes: symbolic rules, search, probability, datasets,
    statistical learning, neural networks, gradients, representations, attention, foundation models, reinforcement
    learning, and evaluation. Add at least twelve labeled edges. The course does not upload or automatically
    grade this artifact; the quiz checks concepts used to build it.'
  bridges: []
- id: history-and-concept-map-project.s2
  title: Separate three kinds of connection
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.history-and-concept-map-project
  markdown: Use solid arrows for a learning prerequisite, dotted arrows for historical influence, and double
    lines for alternatives or complements. Add five dated anchors from the history module with primary references.
    Avoid implying that a later method erased earlier work. Write a one-sentence reason beside each edge so
    the diagram makes a testable teaching claim.
  text_mode: Use solid arrows for a learning prerequisite, dotted arrows for historical influence, and double
    lines for alternatives or complements. Add five dated anchors from the history module with primary references.
    Avoid implying that a later method erased earlier work. Write a one-sentence reason beside each edge so
    the diagram makes a testable teaching claim.
  bridges: []
- id: history-and-concept-map-project.s3
  title: Check against a worked fragment
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.history-and-concept-map-project
  markdown: 'A defensible fragment is probability → statistical prediction, labeled “expresses uncertainty”;
    gradients → gradient-trained neural networks, labeled “guides local updates”; and rules ↔ learned models,
    labeled “can combine explicit constraints with learned scores.” An arrow attention → all neural networks
    is incorrect: many networks do not use attention. A date of invention is not necessarily a learner’s required
    starting point.'
  text_mode: 'A defensible fragment is probability → statistical prediction, labeled “expresses uncertainty”;
    gradients → gradient-trained neural networks, labeled “guides local updates”; and rules ↔ learned models,
    labeled “can combine explicit constraints with learned scores.” An arrow attention → all neural networks
    is incorrect: many networks do not use attention. A date of invention is not necessarily a learner’s required
    starting point.'
  bridges: []
- id: history-and-concept-map-project.s4
  title: Review and revise
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.history-and-concept-map-project
  markdown: 'Score your artifact 0, 1, or 2 on four criteria: correct mechanisms, justified edge types, historical
    evidence, and a clear explanation of one hybrid system. Zero means absent or misleading, one partly supported,
    two explicit and supported. Revise any zero. Ask someone to trace a chatbot or planner through your map;
    record one confusing edge and improve it.'
  text_mode: 'Score your artifact 0, 1, or 2 on four criteria: correct mechanisms, justified edge types, historical
    evidence, and a clear explanation of one hybrid system. Zero means absent or misleading, one partly supported,
    two explicit and supported. Revise any zero. Ask someone to trace a chatbot or planner through your map;
    record one confusing edge and improve it.'
  bridges: []
- id: history-and-concept-map-project.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.history-and-concept-map-project
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Build and defend a concept map that distinguishes historical influence, conceptual prerequisites,
    and competing approaches; a timeline alone does not explain how a system works.
- id: history-and-concept-map-project.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.history-and-concept-map-project
  markdown: Build and defend a concept map that distinguishes historical influence, conceptual prerequisites,
    and competing approaches; a timeline alone does not explain how a system works.
  text_mode: Build and defend a concept map that distinguishes historical influence, conceptual prerequisites,
    and competing approaches; a timeline alone does not explain how a system works.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - history-and-concept-map-project.s1
    - history-and-concept-map-project.s2
    - history-and-concept-map-project.s3
    - history-and-concept-map-project.s4
    - history-and-concept-map-project.check
    gate_refs:
    - gate.core
  scene_aliases:
    history-and-concept-map-project.recap: history-and-concept-map-project.check
assessment_families:
- id: history-and-concept-map-project.base
  objective_ref: objective.history-and-concept-map-project
  task: base
  response_type: single_choice
  points: 1
  hint: 'Separate three kinds of connection: trace the inputs, operation, and result before choosing.'
  remediation_scene: history-and-concept-map-project.s2
  variants:
  - id: history-and-concept-map-project.base.1
    prompt: Does historical precedence alone establish a learning prerequisite?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if the older method was popular
    answer: a
    feedback: History and conceptual dependence are different relations.
  - id: history-and-concept-map-project.base.2
    prompt: Must every neural network use attention?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only when learned from data
    - id: a
      text: 'No'
    answer: a
    feedback: Many neural architectures predate or omit attention.
- id: history-and-concept-map-project.transfer
  objective_ref: objective.history-and-concept-map-project
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Review and revise: trace the inputs, operation, and result before choosing.'
  remediation_scene: history-and-concept-map-project.s4
  variants:
  - id: history-and-concept-map-project.transfer.1
    prompt: What makes a map edge reviewable?
    options:
    - id: b
      text: A thicker line alone
    - id: c
      text: A recent date alone
    - id: a
      text: A labeled relationship with an explanation and relevant evidence
    answer: a
    feedback: The relation should express a defensible claim.
  - id: history-and-concept-map-project.transfer.2
    prompt: Does passing this quiz grade your drawn map?
    options:
    - id: c
      text: Only if it has twelve nodes
    - id: a
      text: No; the artifact needs separate review
    - id: b
      text: 'Yes'
    answer: a
    feedback: The quiz checks concepts, not the quality of an unseen deliverable.
