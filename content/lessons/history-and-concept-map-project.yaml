schema_version: 0.2-draft
lesson:
  id: history-and-concept-map-project
  version: 0.4.0-draft
  title: 'Project: explain AI through a historical concept map'
  state: draft
  summary: How does a 1943 sketch of an artificial neuron end up inside ChatGPT? Draw the one-page map that shows it, one labeled arrow at a time.
  slot: M36.1
  category: learning
  minutes: 60
  sources:
    - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
      url: https://aima.cs.berkeley.edu/
    - title: Dive into Deep Learning — authors’ open textbook
      url: https://d2l.ai/
objectives:
  - id: objective.history-and-concept-map-project
    version: 2-draft
    statement: Build and defend a concept map that separates what you must learn first, what historically led to what, and which approaches compete or combine.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - history-and-concept-map-project.base.v2
      - history-and-concept-map-project.transfer.v2
    prerequisites:
      - anyOf:
          - objective.history
      - anyOf:
          - objective.symbolic-neural-boundaries
      - anyOf:
          - objective.research-reporting
scenes:
  - id: history-and-concept-map-project.s1
    title: 'Your brief: a map a newcomer can follow'
    type: explanation
    depth: intuition
    objective_refs:
      - objective.history-and-concept-map-project
    markdown: |-
      A friend who has just tried ChatGPT asks you, "Where did this come from?" You could hand over a timeline: 1943, 1958, 1986, 2017, 2022. It lists *when* things happened, but it doesn't say which idea depends on which, or why a 1986 training trick matters to a 2022 chatbot.

      Your job is to draw the page that does: a **concept map**, a set of ideas (the *nodes*) joined by labeled arrows (the *edges*), where every arrow makes one claim a reader can check.

      | Brief | |
      | --- | --- |
      | Goal | Explain how twelve big AI ideas connect, from rules and search to foundation models |
      | Reader | A curious friend with no AI background |
      | Time | About an hour |
      | Tools | Paper and pen, sticky notes, or any drawing app. An optional code check is included. |

      **Done looks like:**

      - all twelve ideas on one page, each with a one-line plain definition;
      - at least twelve edges, each drawn as one of three kinds and labeled with a one-sentence reason;
      - five dated landmarks pinned to the ideas they illustrate;
      - one real system, such as AlphaGo or ChatGPT, traced through the map;
      - one round of feedback from a reader, and the edge you fixed because of it.
    bridges: []
  - id: history-and-concept-map-project.materials
    title: Twelve ideas and the landmarks that date them
    type: explanation
    depth: intuition
    objective_refs:
      - objective.history-and-concept-map-project
    markdown: |-
      These are your twelve nodes. The definitions and dates come from the history module; rewrite each definition in your own words before you draw.

      | Idea | In one line | A dated landmark |
      | --- | --- | --- |
      | Symbolic rules | Knowledge written as if–then rules | MYCIN, Stanford, 1970s |
      | Search | Try possibilities systematically until one works | Shakey the robot, 1966–72 |
      | Probability | Numbers for how likely things are, updated by evidence | Pearl's book on Bayesian networks, 1988 |
      | Datasets | Large collections of labeled examples | ImageNet, 2009 |
      | Statistical learning | Estimating a model's numbers from examples | Samuel's checkers paper, 1959 |
      | Neural networks | Layers of simple weighted units | McCulloch and Pitts's neuron, 1943 |
      | Gradients | Slopes that say which way to nudge each weight | Backpropagation popularized, 1986 |
      | Representations | Learned lists of numbers that capture meaning | word2vec, 2013 |
      | Attention | Each token weighs how much every other token matters | The Transformer, 2017 |
      | Foundation models | Trained broadly once, then adapted to many jobs | BERT and GPT, 2018 |
      | Reinforcement learning | Learning from trial, error, and reward | AlphaGo, 2016 |
      | Evaluation | Measuring whether a system works on new cases | AlexNet wins ImageNet, 2012 |

      A landmark is evidence that an idea mattered at a certain time. It isn't the idea's birthday: neurons were sketched in 1943, yet networks won their big contest only in 2012. Keep that distinction in mind, because it's the heart of the next page.
    bridges: []
  - id: history-and-concept-map-project.s2
    title: Three kinds of arrow
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.history-and-concept-map-project
    markdown: |-
      Most beginner maps use one kind of arrow for everything, so a reader can't tell "you need this first" from "this happened earlier." Use three:

      | Edge | Claim it makes | Draw it | Example |
      | --- | --- | --- | --- |
      | **needs** | You must understand A before B makes sense | Solid arrow A → B | gradients → neural networks: "training nudges each weight downhill" |
      | **led to** | A historically inspired or enabled B, at a date you can name | Dashed arrow A ⇢ B, with years | datasets ⇢ neural networks: "ImageNet (2009) let AlexNet win in 2012" |
      | **combines with** | Two approaches work together, or compete, in real systems | Double line A ═ B, no arrowhead | search ═ reinforcement learning: "AlphaGo (2016)" |

      Every edge also carries a **reason**: one sentence, written on the line, that a reader could check against a lesson. "Related" isn't a reason. "A learned model outputs how likely each answer is" is.

      :::predict ImageNet (2009) came before AlexNet (2012), and AlexNet was a neural network. Should datasets → neural networks be a "needs" arrow?
      No, make it "led to." You can understand a neural network perfectly well from four training examples; nothing about *how it works* requires a million photos. What the dataset did was historical: together with fast GPUs, it let networks beat other methods in 2012. A "needs" arrow would tell your friend to study ImageNet before networks, which is bad advice.
      :::

      Two ideas can be joined by more than one kind of edge. Gradients → neural networks is a "needs" arrow (you can't follow training without slopes), and a separate dashed arrow can record that backpropagation's popularization in 1986 revived the field.

      :::mixup "If A came first, A is a prerequisite for B."
      Dates give an order in time, not an order for learning. McCulloch and Pitts sketched artificial neurons in 1943, decades before Pearl's 1988 book on Bayesian networks, yet how networks learn is easier to follow once you know some probability. Draw "needs" only when the reason is about understanding, and "led to" when the reason is a date.
      :::
    bridges: []
  - id: history-and-concept-map-project.s3
    title: Check against a worked fragment
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.history-and-concept-map-project
    markdown: |-
      Here is part of a strong map: nine of the twelve ideas and seven edges. Compare your edges with it once you've drawn your own. The diagram below draws the six edges on the road to foundation models, plus one more dashed edge from datasets.

      | From | Edge | To | Reason written on the edge |
      | --- | --- | --- | --- |
      | probability | needs → | statistical learning | A learned model outputs how likely each answer is |
      | statistical learning | needs → | neural networks | A network is fitted to examples and judged on new ones |
      | gradients | needs → | neural networks | Training nudges each weight downhill on the loss |
      | datasets | led to ⇢ | neural networks | ImageNet (2009) let AlexNet win in 2012 |
      | neural networks | needs → | attention | Attention is a layer inside a network |
      | attention | needs → | foundation models | Transformers, built on attention, power BERT and GPT (2018) |
      | search | combines with ═ | reinforcement learning | AlphaGo (2016) paired tree search with networks improved by self-play |

      And here are two edges that look right but aren't:

      - **attention → neural networks, "needs."** Backwards. Attention is one kind of layer you can put inside a network, and plenty of networks have none: LeNet read handwritten digits by 1989 with no attention at all. Reverse the arrow.
      - **symbolic rules → neural networks, "replaced by."** Rules never went away: rule engines still check tax returns, and the lesson on combining explicit knowledge with learned perception pairs rules with networks on purpose. Use a "combines with" line and name a system that uses both.

      :::try Extend the fragment
      Add representations to the picture. Which existing node does it need, and which node needs it? (One good answer: neural networks → representations, "a network's hidden layers learn the vectors," and representations → foundation models, "pretraining produces reusable vectors.")
      :::
    diagram:
      caption: A worked fragment of the map. Solid arrows mean "needs"; dashed arrows mean "led to".
      description: Probability has a solid arrow to statistical learning. Statistical learning and gradients each have a solid arrow to neural networks. Datasets has a dashed arrow to neural networks, labeled ImageNet 2009 to AlexNet 2012, and a dashed arrow to foundation models for web-scale pretraining. Neural networks has a solid arrow to attention, and attention has a solid arrow to foundation models.
      nodes:
        - id: prob
          label: Probability
          col: 0
          row: 0
        - id: grad
          label: Gradients
          note: backprop popularized 1986
          col: 2
          row: 0
        - id: data
          label: Datasets
          note: ImageNet, 2009
          col: 4
          row: 0
          tone: data
        - id: stat
          label: Statistical learning
          col: 0
          row: 1
        - id: nn
          label: Neural networks
          col: 2
          row: 2
        - id: attn
          label: Attention
          note: Transformer, 2017
          col: 2
          row: 3
        - id: fm
          label: Foundation models
          note: BERT and GPT, 2018
          col: 3
          row: 4
          tone: accent
      edges:
        - from: prob
          to: stat
          label: 'needs: outputs are probabilities'
        - from: stat
          to: nn
          label: 'needs: fit examples, test on new'
        - from: grad
          to: nn
          label: 'needs: training nudges weights'
        - from: data
          to: nn
          label: 'led to: AlexNet, 2012'
          dashed: true
        - from: nn
          to: attn
          label: 'needs: attention is a layer'
        - from: attn
          to: fm
          label: 'needs: Transformers power them'
        - from: data
          to: fm
          label: 'led to: web-scale pretraining'
          dashed: true
    bridges: []
  - id: history-and-concept-map-project.milestones
    title: Build the map in five milestones
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.history-and-concept-map-project
    markdown: |-
      Work through these in order. Each names the lesson to reread if you get stuck.

      1. **Define the nodes (15 min).** Write the twelve ideas as boxes, each with your one-line definition. If a definition needs a word your friend wouldn't know, rewrite it. *Reread:* "The questions that shaped AI."
      2. **Pin five landmarks (10 min).** Attach five dated landmarks from the table to the ideas they illustrate, such as AlphaGo (2016) to reinforcement learning. Check each date against the module. *Reread:* "Games, attention, and broadly reusable models" and "From knowledge engineering to learning from data."
      3. **Draw at least twelve edges (20 min).** For each pair you connect, decide the kind first (needs, led to, or combines with), then write the reason. Give every idea at least one edge. *Reread:* this project's page on the three kinds of arrow.
      4. **Trace one real system (10 min).** Pick AlphaGo or ChatGPT and highlight the path it takes through your map. AlphaGo should touch search, neural networks, and reinforcement learning; ChatGPT should touch attention, foundation models, and the human feedback from reinforcement learning. *Reread:* "Combine explicit knowledge with learned perception" for how hybrids are built.
      5. **Test it on a reader (10 min).** Ask someone to follow the path from 1943's neuron to ChatGPT out loud. Mark the first edge where they hesitate, rewrite its reason or change its kind, and add a three-sentence caption that says what the map claims. *Reread:* "Make the result possible to inspect."
    bridges: []
  - id: history-and-concept-map-project.code-check
    title: Let code catch a backwards arrow
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.history-and-concept-map-project
    markdown: |-
      "Needs" arrows have a property you can test: they can never go round in a circle. If attention needs neural networks and neural networks need attention, one of those arrows is wrong. Following "needs" arrows without circles also gives a sensible study order, which computer scientists call a **topological order**: every idea comes after everything it needs.

      Type your edges into the list below and run it. The starter list is the worked fragment, plus two planted mistakes: a typo and a backwards arrow.

      ```python run
      from collections import Counter
      from graphlib import TopologicalSorter, CycleError

      nodes = ["symbolic rules", "search", "probability", "datasets",
               "statistical learning", "neural networks", "gradients",
               "representations", "attention", "foundation models",
               "reinforcement learning", "evaluation"]

      # (from, to, kind, reason): replace these with your own edges
      edges = [
          ("probability", "statistical learning", "needs", "outputs are probabilities"),
          ("statistical learning", "neural networks", "needs", "fit examples, test on new"),
          ("gradients", "neural networks", "needs", "training nudges each weight"),
          ("datasets", "neural networks", "led to", "ImageNet 2009, AlexNet 2012"),
          ("neural networks", "attention", "needs", "attention is a network layer"),
          ("attention", "foundation models", "needs", "Transformers power BERT, GPT"),
          ("search", "reinforcement learning", "combines", "AlphaGo, 2016"),
          ("attention", "neural netwroks", "needs", "every network uses attention"),
      ]

      print("edges by kind:", dict(Counter(e[2] for e in edges)))
      print("unknown names:", sorted({n for e in edges for n in e[:2]} - set(nodes)))
      print("nodes with no edge:", [n for n in nodes if not any(n in e[:2] for e in edges)])

      needs = {}                                   # node -> the nodes it needs first
      for a, b, kind, reason in edges:
          if kind == "needs":
              needs.setdefault(b, set()).add(a)
      try:
          print("study order:", " -> ".join(TopologicalSorter(needs).static_order()))
      except CycleError as err:
          print("cycle in 'needs' arrows:", " -> ".join(err.args[1]))
      ```

      **What you should see.** The first run flags `unknown names: ['neural netwroks']` and lists three lonely nodes: symbolic rules, representations, and evaluation. Its study order ends with the misspelled name, because the typo hides the cycle. Fix the typo and rerun: now it reports `cycle in 'needs' arrows: neural networks -> attention -> neural networks`. Delete the planted last edge and rerun, and you get a study order:

      `probability -> gradients -> statistical learning -> neural networks -> attention -> foundation models`

      Then add your own edges until "nodes with no edge" is empty and there's no cycle. The code can't judge whether a reason is true; that part is for you and your reader.

      **No code?** Do the same three checks by hand. Tick each node as you find an edge touching it. Then, starting from any idea, follow only solid arrows forward: if you ever arrive back where you started, one arrow in that loop is backwards. Finally, list the ideas so every one comes after everything its solid arrows say it needs; that list is your study order.
    bridges: []
  - id: history-and-concept-map-project.mistakes
    title: Five mistakes that make a map mislead
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.history-and-concept-map-project
    markdown: |-
      | Mistake | How to spot it | Fix |
      | --- | --- | --- |
      | A "needs" arrow points the wrong way | The code check finds a cycle, or an arrow runs from a specific idea to a general one | Ask "could I explain B without A?" If yes, reverse or delete it |
      | A date used as a reason | A solid arrow whose reason is a year | Make it a dashed "led to" edge, or find the real dependency |
      | "Replaced" or "killed" edges | Labels like *replaced*, *obsolete*, *won* | Use "combines with" and name a system still using both |
      | Systems drawn as ideas | A node such as *ChatGPT* with arrows to everything | Make it a landmark pinned to ideas, or trace it as a highlighted path |
      | A cause stated too strongly | "*Perceptrons* caused the neural-network winter" | Write what the evidence supports: "contributed to; historians debate how much" |

      :::mixup "More arrows make a better map."
      Each arrow is a claim, and a reader has to check every one. Twelve arrows with clear reasons teach more than forty unlabeled ones. If two arrows say the same thing, keep the one with the better reason.
      :::
    bridges: []
  - id: history-and-concept-map-project.s4
    title: Score your map with the rubric
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.history-and-concept-map-project
    markdown: |-
      Score each row 0, 1, or 2, then revise anything that scored 0 before you share the map.

      | Criterion | 0: missing or misleading | 1: partly there | 2: solid |
      | --- | --- | --- | --- |
      | Nodes | Fewer than twelve, or definitions copied as jargon | All twelve, some definitions vague | All twelve, each readable by a newcomer |
      | Edge kinds | One kind of arrow for everything | Three kinds used, two or more wrong | Every edge's kind is defensible |
      | Reasons | Edges unlabeled or "related" | Most edges have reasons, a few vague | Every edge has a checkable one-sentence reason |
      | Landmarks | None, or dates wrong | Five landmarks, one or two misplaced | Five correct dates, each on the right idea |
      | Traced system | No system traced | Path shown, some steps unexplained | Path shown, every step explained |
      | Reader test | Nobody tried it | Tested, but nothing changed | Confusing edge found and fixed |

      A strong first map usually scores 8 to 10 out of 12; the reader test is what gets it higher.

      The quiz below checks the ideas; this rubric, used by you or a friend, judges the map itself.
    bridges: []
  - id: history-and-concept-map-project.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.history-and-concept-map-project
    markdown: |-
      Disputed arrows from other people's maps, a museum panel, a study guide, and a blog post test whether you can pick the right kind of connection.
    takeaway: |-
      A useful concept map says what every arrow means: "you need this first," "this led to that," or "these work together." Dates tell you when an idea mattered; arrows with reasons tell you why.
  - id: history-and-concept-map-project.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.history-and-concept-map-project
    markdown: |-
      Use labeled connections to explain how AI ideas relate. Distinguish what helps you learn an idea from what historically influenced it.
