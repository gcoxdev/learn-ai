assessment_families:
  - id: history-and-concept-map-project.base
    objective_ref: objective.history-and-concept-map-project
    task: base
    response_type: single_choice
    points: 1
    hint: 'Separate three kinds of connection: trace the inputs, operation, and result before choosing.'
    remediation_scene: history-and-concept-map-project.s2
    variants:
      - id: history-and-concept-map-project.base.1
        prompt: Does historical precedence alone establish a learning prerequisite?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if the older method was popular
        answer: a
        feedback: History and conceptual dependence are different relations.
        retired: true
      - id: history-and-concept-map-project.base.2
        prompt: Must every neural network use attention?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only when learned from data
          - id: a
            text: 'No'
        answer: a
        feedback: Many neural architectures predate or omit attention.
        retired: true
  - id: history-and-concept-map-project.transfer
    objective_ref: objective.history-and-concept-map-project
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Review and revise: trace the inputs, operation, and result before choosing.'
    remediation_scene: history-and-concept-map-project.s4
    variants:
      - id: history-and-concept-map-project.transfer.1
        prompt: What makes a map edge reviewable?
        options:
          - id: b
            text: A thicker line alone
          - id: c
            text: A recent date alone
          - id: a
            text: A labeled relationship with an explanation and relevant evidence
        answer: a
        feedback: The relation should express a defensible claim.
        retired: true
      - id: history-and-concept-map-project.transfer.2
        prompt: Does passing this quiz grade your drawn map?
        options:
          - id: c
            text: Only if it has twelve nodes
          - id: a
            text: No; the artifact needs separate review
          - id: b
            text: 'Yes'
        answer: a
        feedback: The quiz checks concepts, not the quality of an unseen deliverable.
        retired: true
  - id: history-and-concept-map-project.base.v2
    objective_ref: objective.history-and-concept-map-project
    task: base
    response_type: single_choice
    points: 1
    hint: 'Ask what the reason on the edge is about: understanding (needs), a date (led to), or two approaches used together (combines with).'
    remediation_scene: history-and-concept-map-project.s2
    variants:
      - id: history-and-concept-map-project.base.v2.1
        prompt: 'A learner draws a solid "needs" arrow from datasets to neural networks, with the reason "networks only started winning after ImageNet." Which edge matches that reason?'
        options:
          - id: b
            text: Keep the solid arrow, because ImageNet came before AlexNet
          - id: a
            text: A dashed "led to" arrow, dated 2009 to 2012
          - id: c
            text: A solid arrow from neural networks to datasets instead
        answer: a
        feedback: The reason is about history, not understanding, so it's a "led to" edge. You can learn how a network works from four examples; ImageNet is what let networks win in 2012. A date order alone never makes a "needs" arrow.
      - id: history-and-concept-map-project.base.v2.2
        prompt: Which edge correctly connects neural networks and attention?
        options:
          - id: c
            text: Attention needs neural networks, since attention came first
          - id: b
            text: Neural networks need attention, since networks are built on it
          - id: a
            text: Attention needs neural networks, since it's a layer inside one
        answer: a
        feedback: Attention is one kind of layer inside a network, so you need networks first. Many networks, such as LeNet in 1989, have no attention at all, and networks are far older (1943, 1958) than attention (2014 onward).
      - id: history-and-concept-map-project.base.v2.3
        prompt: AlphaGo (2016) used tree search to check moves suggested by networks improved through self-play. How should search and reinforcement learning be joined?
        options:
          - id: a
            text: A "combines with" line labeled with AlphaGo
          - id: b
            text: A "needs" arrow, since learning from reward requires search
          - id: c
            text: A "led to" arrow, since learning replaced search in 2016
        answer: a
        feedback: AlphaGo used the two approaches together, which is what a "combines with" line records. You can learn reinforcement learning without search, and search wasn't replaced; it did half the work in AlphaGo.
      - id: history-and-concept-map-project.base.v2.4
        prompt: 'You want your map to say two things: "you need slopes to follow how a network trains" and "backpropagation''s 1986 revival brought networks back." What should you draw between gradients and neural networks?'
        options:
          - id: b
            text: One solid arrow labeled 1986, since the date shows the dependence
          - id: c
            text: One dashed arrow, since anything with a date is historical
          - id: a
            text: A solid "needs" arrow and a separate dashed "led to" arrow
        answer: a
        feedback: These are two different claims, so they get two edges. One is about understanding (needs) and one about history (led to, 1986). Merging them into one arrow hides which claim a reader is checking.
      - id: history-and-concept-map-project.base.v2.5
        prompt: 'A map has a solid "needs" arrow from probability to statistical learning, labeled "came first." What should change?'
        options:
          - id: a
            text: The label; it should say why learning uses probability
          - id: b
            text: The style; an older idea calls for a dashed arrow
          - id: c
            text: The direction; statistical learning is usually taught first
        answer: a
        feedback: The arrow's kind and direction are fine, but "came first" is a date, not a reason. A checkable reason is something like "a learned model outputs how likely each answer is." Age alone would call for neither a solid nor a dashed arrow.
  - id: history-and-concept-map-project.transfer.v2
    objective_ref: objective.history-and-concept-map-project
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'For each claim, decide whether it is about understanding, history, or two approaches working together, then check whether the drawing says the same thing.'
    remediation_scene: history-and-concept-map-project.mistakes
    variants:
      - id: history-and-concept-map-project.transfer.v2.1
        prompt: A museum panel shows a timeline from 1943 to 2022 with one long arrow labeled "progress." A visitor asks how ChatGPT's parts depend on older ideas. What would help the panel answer?
        options:
          - id: b
            text: More milestones, so that no decade is left out
          - id: a
            text: Labeled links saying which ideas each part needs
          - id: c
            text: A clear note on which approach finally won
        answer: a
        feedback: A timeline shows order in time but no dependencies. Labeled "needs" links (attention, then foundation models, and so on) answer the visitor's question. More dates just make a longer timeline, and "which approach won" is the replaced-by mistake.
      - id: history-and-concept-map-project.transfer.v2.2
        prompt: 'A study guide says: "Learn search before neural networks, because search is the older idea." What is wrong with that advice?'
        options:
          - id: c
            text: Search was replaced by learning, so it can be skipped
          - id: a
            text: Age gives a history order, and neither idea needs the other
          - id: b
            text: Search is used inside AlphaGo, so it should come last
        answer: a
        feedback: Being older makes something a "led to" candidate, not a prerequisite. You can learn networks without search and search without networks. Search wasn't replaced; it still plans routes and ran inside AlphaGo.
      - id: history-and-concept-map-project.transfer.v2.3
        prompt: 'A colleague''s slide says "Deep learning replaced symbolic AI." Which edge better matches the history module?'
        options:
          - id: a
            text: A "combines with" line naming a system that uses both
          - id: b
            text: A dashed "led to" arrow from symbolic AI, dated 1986
          - id: c
            text: Keep "replaced," since the expert-system market collapsed
        answer: a
        feedback: Rules still run tax and insurance checks, and hybrid systems pair rules with learned perception. The 1987 collapse ended a market, not the idea, so "replaced" overstates it; and 1986 was about backpropagation, not a rule system inspiring networks.
      - id: history-and-concept-map-project.transfer.v2.4
        prompt: A friend tries to trace "a spam filter that counts words" through your map and gets stuck, because the only route to learning passes through attention. What should you revise?
        options:
          - id: b
            text: Remove the spam filter, since it isn't modern AI
          - id: c
            text: Add a date to attention so the route is clearer
          - id: a
            text: Add a path from probability to statistical learning
        answer: a
