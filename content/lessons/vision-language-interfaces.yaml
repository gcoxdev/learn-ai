lesson:
  id: vision-language-interfaces
  version: 0.4.0-draft
  title: Connect a vision encoder to a language model
  state: draft
  summary: A photo of a pill bottle becomes 576 "words" that no dictionary contains. Follow them into a language model, and find out where the dose on the label got lost.
  slot: M23.3
  category: learning
  sources:
    - title: "Visual Instruction Tuning (LLaVA; Liu, Li, Wu & Lee, 2023)"
      url: https://arxiv.org/abs/2304.08485
    - title: "Improved Baselines with Visual Instruction Tuning (LLaVA-1.5; Liu, Li, Li & Lee, 2023)"
      url: https://arxiv.org/abs/2310.03744
    - title: "Flamingo: a Visual Language Model for Few-Shot Learning (Alayrac et al., 2022)"
      url: https://arxiv.org/abs/2204.14198
    - title: "BLIP-2: Bootstrapping Language-Image Pre-training with Frozen Image Encoders and Large Language Models (Li et al., 2023)"
      url: https://arxiv.org/abs/2301.12597
objectives:
  - id: objective.vision-language-interfaces
    version: 2-draft
    statement: A vision-language model converts visual inputs into representations consumed by a language model through projections, prefixes, or cross-attention; interfaces and training determine what visual evidence survives.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - vision-language-interfaces.base.v2
      - vision-language-interfaces.transfer.v2
      - vision-language-interfaces.calculate
    prerequisites:
      - anyOf:
          - objective.contrastive-image-text-learning
      - anyOf:
          - objective.transformer-families
scenes:
  - id: vision-language-interfaces.s1
    title: A photo becomes 576 tokens
    type: explanation
    depth: intuition
    objective_refs:
      - objective.vision-language-interfaces
    markdown: |-
      Amara photographs a pill bottle and asks Lumen, "How many tablets should I take?" CLIP from the last lesson can tell a pill bottle from a cereal box, but it can't *answer* a question. A language model can answer questions, but it can't see. A **vision-language model (VLM)** joins the two.

      The simplest widely used design is **LLaVA** (Liu et al., 2023; the name stands for Large Language and Vision Assistant). Here is the LLaVA-1.5 version, step by step:

      1. **Vision encoder.** CLIP's image tower, a ViT-L/14, takes the photo at 336 × 336 pixels. Its 14 × 14 patches make a $24 \times 24$ grid, so it outputs $24^2 = 576$ feature vectors, each 1,024 numbers long.
      2. **Projector.** A small two-layer network (an MLP) maps each 1,024-number vector to the language model's token width, 4,096 numbers for a 7-billion-parameter model.
      3. **Language model.** The 576 projected vectors go in front of the question's text tokens, and the language model reads the whole sequence exactly as if it were text.

      The language model never sees pixels. It sees 576 vectors that sit where word embeddings would sit, so they are often called **visual tokens**.
    diagram:
      caption: The LLaVA design. The image enters the language model as a prefix of 576 visual tokens.
      description: The 336-pixel photo goes into a frozen CLIP vision encoder, which outputs 576 patch features of 1,024 numbers each. An MLP projector turns them into 576 visual tokens of 4,096 numbers each. The visual tokens and the question's text tokens both go into the language model, which writes the answer.
      nodes:
        - id: photo
          label: Photo, 336 × 336
          col: 0
          row: 0
          tone: data
        - id: venc
          label: Vision encoder
          note: CLIP ViT-L/14
          col: 1
          row: 0
          tone: muted
        - id: proj
          label: MLP projector
          note: 1,024 → 4,096 numbers per token
          col: 2
          row: 0
          tone: accent
        - id: question
          label: Question tokens
          note: "How many tablets should I take?"
          col: 2
          row: 2
          tone: data
        - id: llm
          label: Language model
          note: reads visual + text tokens
          col: 3
          row: 1
        - id: answer
          label: Answer
          col: 4
          row: 1
      edges:
        - from: photo
          to: venc
        - from: venc
          to: proj
          label: 576 patch features
        - from: proj
          to: llm
          label: 576 visual tokens
        - from: question
          to: llm
        - from: llm
          to: answer
    bridges: []
  - id: vision-language-interfaces.s3
    title: A small bridge between two big models
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.vision-language-interfaces
    markdown: |-
      Count the projector's weights. Its first layer maps 1,024 numbers to 4,096: $1{,}024 \times 4{,}096 + 4{,}096 = 4{,}198{,}400$ parameters, including biases. Its second maps 4,096 to 4,096: $4{,}096 \times 4{,}096 + 4{,}096 = 16{,}781{,}312$. Together, about 21 million, against about 300 million in the vision encoder and 7 billion in the language model.

      That imbalance is the whole trick. Two large models, each trained separately, are connected by a bridge small enough to train cheaply. LLaVA first trains *only* the projector on captioned images, with both big models frozen, so their skills stay intact while the bridge learns to translate. The training lifecycle lesson later in this module walks through the full recipe.

      :::mixup "The projector translates the image into words the language model already knows."
      Its outputs are continuous vectors of 4,096 numbers, and they generally don't match the embedding of any vocabulary word. They are sometimes called *soft tokens*. A visual token can carry "shiny, cylindrical, white label, small print near the bottom" all at once, which no single word could.
      :::
    bridges: []
  - id: vision-language-interfaces.s2
    title: Prefix, cross-attention, or resampler
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.vision-language-interfaces
    markdown: |-
      LLaVA puts every visual token into the language model's input, a **prefix** design. Two other designs are common: new cross-attention layers inside the language model, and a **resampler**, a small network that squeezes the image into a fixed number of tokens first.

      | Design | How the image gets in | Visual tokens the language model handles | Example |
      | --- | --- | --- | --- |
      | Prefix | Projected patch features go in front of the text | 576 per 336-px image | LLaVA (2023) |
      | Cross-attention | New layers inside the language model let text tokens attend to image features | none in its own sequence | Flamingo (DeepMind, 2022) |
      | Resampler | A fixed set of learned queries summarizes the patches first | a fixed number, such as 32 or 64 | BLIP-2 (2023), Flamingo |

      A resampler is a small transformer with, say, 32 learned query vectors. The queries cross-attend to all 576 patch features, and whatever they collect becomes 32 output tokens, whether the image had 576 patches or 2,304. BLIP-2 (Salesforce, 2023) calls its version the **Q-Former** and uses 32 queries; Flamingo's **Perceiver Resampler** outputs 64.

      Flamingo also kept its language model frozen and slid new cross-attention layers between the existing ones. Each new layer's output passes through a gate, $\tanh(\alpha)$, with $\alpha$ starting at 0. At the start of training the gate is closed, and the model behaves exactly like the original language model. As $\alpha$ grows, visual information flows in gradually.

      :::predict Amara's pill bottle has a dose line in small print near the bottom edge. Which design is most likely to lose it: a 576-token prefix or a 32-query resampler?
      The resampler squeezes 576 patch features into 32 vectors, about 18 times fewer. If none of the 32 queries happens to gather the small print, the language model can't recover it. The prefix passes all 576 patch features through, at the price of 18 times more tokens in the context.
      :::
    bridges: []
  - id: vision-language-interfaces.s5
    title: Count what the image costs
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.vision-language-interfaces
    markdown: |-
      Visual tokens take space in the context, like pasted text. For a square image of side $H$ pixels with patch size $P$:

      $$N_\text{image} = \left(\frac{H}{P}\right)^2$$

      | Image side | Patches per side ($P = 14$) | Visual tokens |
      | ---: | ---: | ---: |
      | 224 | 16 | 256 |
      | 336 | 24 | 576 |
      | 672 | 48 | 2,304 |

      Doubling the side quadruples the tokens, and attention cost grows with the *square* of sequence length (the transformer lessons). A 40-token question alone makes $40^2 = 1{,}600$ attention scores per head per layer; with 576 visual tokens in front, $616^2 = 379{,}456$.

      Sharper images still matter for small print, so many recent VLMs, including LLaVA-NeXT (2024), use **tiling**: cut a large image into 336-pixel tiles, encode each tile separately, and add one shrunken overview of the whole image. A 672 × 672 photo becomes 4 tiles plus 1 overview, $5 \times 576 = 2{,}880$ tokens.

      ```python run
      def image_tokens(width, height, patch=14):
          """Patch tokens a ViT makes from one image of this size."""
          return (width // patch) * (height // patch)

      print("224 px:", image_tokens(224, 224))
      print("336 px:", image_tokens(336, 336))
      print("672 px:", image_tokens(672, 672))

      # Tiling: cut a 672 x 672 photo into 336-px tiles, plus one shrunken overview.
      tiles = (672 // 336) * (672 // 336)
      tiled = (tiles + 1) * image_tokens(336, 336)
      print("672 px as", tiles, "tiles + overview:", tiled)

      # How many 336-px photos fit in a 4,096-token context with 300 text tokens?
      context, text = 4096, 300
      print("photos that fit:", (context - text) // image_tokens(336, 336))
      print("with a 64-token resampler:", (context - text) // 64)
      ```

      Six photos fill a 4,096-token context with a prefix design; with a 64-token resampler, 59 fit. Change `patch=14` to `patch=16` or the context to 32,768 and see how the budget moves.
    bridges: []
  - id: vision-language-interfaces.s4
    title: Where the dose went missing
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.vision-language-interfaces
    markdown: |-
      Lumen answers Amara: "Take one tablet twice daily." The label actually says "two tablets." Where did the error enter? Trace the pipeline backwards.

      Her phone photo is 4,032 × 3,024 pixels. Standard CLIP preprocessing shrinks the short side to 336, a factor of 9, and crops the center square. The dose line was 27 pixels tall, so it is now 3 pixels tall, too small for a 14-pixel patch to read. The crop also cut 12.5% off each side of the photo.

      Once the words are unreadable, the language model still has to say something. It falls back on what pill bottle labels usually say, and "one tablet twice daily" is a very common phrase. The answer sounds right because it came from the language model's habits, not from the photo.

      | Stage | Question to ask | Check |
      | --- | --- | --- |
      | Preprocessing | Did the detail survive resizing and cropping? | Look at the 336 × 336 image the model actually received |
      | Encoder and interface | Did the visual tokens carry it? | Try a tiled or higher-resolution version |
      | Language model | Did it use what it got? | Crop to just the label; see if the answer changes |

      For Lumen, the fix is tiling for text-heavy photos, plus an instruction to say "I can't read the dose clearly" when the print is too small. The grounding evaluation lesson at the end of this module shows how to test that the fix works.
    bridges: []
  - id: vision-language-interfaces.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.vision-language-interfaces
    markdown: Token counts to work out by hand, plus a receipt reader, a slide-deck assistant, and a robot camera, test whether you can trace an image through a VLM and choose its interface.
    takeaway: |-
      A VLM encodes the image into patch features, projects them to the language model's width, and feeds them in as a prefix, through cross-attention, or through a resampler. At patch 14, a 336-pixel image costs 576 tokens, and anything lost to resizing can't be recovered later.
  - id: vision-language-interfaces.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.vision-language-interfaces
    markdown: |-
      A vision-language interface makes visual features available to a language model. Trace which details survive preprocessing, encoding, and the connection between them.
