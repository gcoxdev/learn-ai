assessment_families:
  - id: vision-language-interfaces.base
    objective_ref: objective.vision-language-interfaces
    task: base
    response_type: single_choice
    points: 1
    hint: 'Expose features to language computation: trace the inputs, operation, and result before choosing.'
    remediation_scene: vision-language-interfaces.s2
    variants:
      - id: vision-language-interfaces.base.1
        prompt: Why use a projector between feature widths?
        options:
          - id: c
            text: To replace all language tokens with file names
          - id: a
            text: To provide a learned compatible representation interface
          - id: b
            text: To guarantee no visual information is lost
        answer: a
        feedback: Dimensions and learned representation spaces must be connected.
        retired: true
      - id: vision-language-interfaces.base.2
        prompt: What does cross-attention let language queries access?
        options:
          - id: a
            text: Visual key/value representations
          - id: b
            text: Only optimizer moments
          - id: c
            text: Only future answer labels
        answer: a
        feedback: It supplies an explicit cross-modal information path.
        retired: true
  - id: vision-language-interfaces.transfer
    objective_ref: objective.vision-language-interfaces
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Trace a visual question failure: trace the inputs, operation, and result before choosing.'
    remediation_scene: vision-language-interfaces.s4
    variants:
      - id: vision-language-interfaces.transfer.1
        prompt: Can resizing remove evidence needed to read a tiny label?
        options:
          - id: a
            text: 'Yes'
          - id: b
            text: 'No'
          - id: c
            text: Only if the image is grayscale
        answer: a
        feedback: Preprocessing can destroy detail before language generation.
        retired: true
      - id: vision-language-interfaces.transfer.2
        prompt: Does connecting two pretrained encoders alone prove visual grounding?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if dimensions match
          - id: a
            text: 'No'
        answer: a
        feedback: Training and evaluation establish whether the interface is useful.
        retired: true
  - id: vision-language-interfaces.base.v2
    objective_ref: objective.vision-language-interfaces
    task: base
    response_type: single_choice
    points: 1
    hint: Follow one image through encoder, projector, and interface. Ask what each piece outputs, how many tokens reach the language model, and what was fixed in size along the way.
    remediation_scene: vision-language-interfaces.s2
    variants:
      - id: vision-language-interfaces.base.v2.1
        prompt: In a LLaVA-style model, what does the language model receive for one image?
        options:
          - id: b
            text: A caption written by the vision encoder, split into ordinary text tokens
          - id: a
            text: A sequence of projected patch vectors placed before the text tokens
          - id: c
            text: The raw pixel values, flattened into one long sequence of numbers
        answer: a
        feedback: The projector maps each patch feature to the language model's width, and those vectors go in as a prefix. No caption is written first, and the language model never sees pixels.
      - id: vision-language-interfaces.base.v2.2
        prompt: A VLM designer switches from a 576-token prefix to a resampler with 32 learned queries. What changes most directly?
        options:
          - id: a
            text: Each image costs 32 tokens, and fine detail must fit through those 32 summaries
          - id: c
            text: The vision encoder now splits images into 32 larger patches instead of 576
          - id: b
            text: The language model can now read images of any size at full detail
        answer: a
        feedback: The queries cross-attend to all 576 patch features and output a fixed 32 tokens, which saves context but can drop small details. The encoder's patches don't change, and compression doesn't add detail.
      - id: vision-language-interfaces.base.v2.3
        prompt: Flamingo inserts new cross-attention layers into a frozen language model, each scaled by tanh(α) with α starting at 0. Why start at 0?
        options:
          - id: c
            text: So the visual features are ignored for the whole of training
          - id: b
            text: So the new layers train faster by skipping their gradients at first
          - id: a
            text: So the model starts out behaving exactly like the original language model
        answer: a
        feedback: tanh(0) = 0 closes the gate, so the new layers add nothing and the pretrained model's behavior is untouched at the start. α still receives gradients and opens the gate as training finds visual information useful.
      - id: vision-language-interfaces.base.v2.4
        prompt: A projector maps 1,024-number patch features to a 4,096-wide language model through two layers, 1,024 → 4,096 → 4,096. Roughly how many parameters does it have?
        options:
          - id: b
            text: About 4 million, since it maps 1,024 numbers to 4,096
          - id: a
            text: About 21 million, counting both weight matrices and biases
          - id: c
            text: About 7 billion, the same as the language model it feeds
        answer: a
        feedback: 1,024 × 4,096 + 4,096 ≈ 4.2 million for the first layer and 4,096 × 4,096 + 4,096 ≈ 16.8 million for the second, about 21 million in all. 4 million counts only the first layer.
  - id: vision-language-interfaces.transfer.v2
    objective_ref: objective.vision-language-interfaces
    task: transfer
    response_type: single_choice
    points: 1
    hint: Weigh detail against context. Small print needs pixels that survive preprocessing; many images need a fixed, small number of tokens each.
    remediation_scene: vision-language-interfaces.s4
    variants:
      - id: vision-language-interfaces.transfer.v2.1
        prompt: A receipt-reading VLM resizes 3,000-pixel-tall receipts to 336 pixels and often misreads the totals, giving common-looking amounts. What is the best first fix?
        options:
          - id: b
            text: Fine-tune the language model on more examples of receipt totals
          - id: c
            text: Switch to a 32-query resampler so the image uses fewer tokens
          - id: a
            text: Tile the receipt at higher resolution so the digits stay readable
        answer: a
        feedback: Shrinking by about 9 times leaves digits a few pixels tall, so the language model falls back on typical-looking totals. Tiling keeps the print readable. More receipt text training teaches better guesses, and a resampler compresses even further.
      - id: vision-language-interfaces.transfer.v2.2
        prompt: A slide-deck assistant must answer questions about 40 slides at once, using a model with an 8,192-token context. Which interface fits best?
        options:
          - id: a
            text: A resampler that turns each slide into a fixed 64 tokens
          - id: b
            text: A 576-token prefix per slide, fed in at full resolution
          - id: c
            text: A 2,880-token tiled encoding per slide for full detail
        answer: a
        feedback: 40 × 64 = 2,560 tokens fits with room for text. 40 × 576 = 23,040 tokens overflows the context almost three times over, and tiling makes that worse. For fine print on one slide, a second close-up pass can follow.
      - id: vision-language-interfaces.transfer.v2.3
        prompt: A team connects a pretrained vision encoder to a pretrained language model with an untrained projector and asks it about photos. The answers ignore the images. Why?
        options:
          - id: c
            text: The two models use different patch sizes, so their tokens can't line up
          - id: a
            text: The projector hasn't learned to map image features into vectors the model can use
          - id: b
            text: The language model needs to be retrained from scratch on images first
        answer: a
        feedback: Random projector weights turn good visual features into vectors the language model has never learned to read, so it answers from text alone. Training the small projector on captioned images, with both big models frozen, is LLaVA's first stage. Retraining from scratch is unnecessary.
      - id: vision-language-interfaces.transfer.v2.4
        prompt: A warehouse robot's VLM answers "Is the aisle clear?" from one camera frame. A small cable across the floor near the edge is often missed. What should the team check first?
        options:
          - id: b
            text: Whether the language model was trained on enough warehouse text
          - id: c
            text: Whether the answer is phrased too confidently for the risk involved
          - id: a
            text: Whether the resize and center crop remove or shrink the cable away
        answer: a
        feedback: Trace backwards from the input. A center crop can cut off the frame's edges, and resizing can shrink a thin cable below one patch. More text training can't restore missing pixels, and a phrasing fix doesn't make the cable visible.
  - id: vision-language-interfaces.calculate
    objective_ref: objective.vision-language-interfaces
    task: base
    response_type: numeric
    points: 1
    hint: Divide the image side by the patch size to get patches per side, and square it. For tiling, multiply by the number of tiles plus one overview.
    remediation_scene: vision-language-interfaces.s5
    absolute_tolerance: 0.5
    variants:
      - id: vision-language-interfaces.calculate.1
        prompt: A ViT with 14-pixel patches encodes a 448 × 448 image. How many visual tokens does it produce?
        answer: 1024
        feedback: 448 ÷ 14 = 32 patches per side, and 32² = 1,024.
      - id: vision-language-interfaces.calculate.2
        prompt: A vision encoder uses 16-pixel patches on a 384 × 384 image. How many visual tokens?
        answer: 576
        feedback: 384 ÷ 16 = 24 per side, and 24² = 576, the same count as 336 pixels at patch 14.
      - id: vision-language-interfaces.calculate.3
        prompt: A 672 × 672 photo is split into 336-pixel tiles, and a shrunken 336-pixel overview is added. At patch 14, how many visual tokens in total?
        answer: 2880
        feedback: There are 2 × 2 = 4 tiles plus 1 overview, 5 images of 576 tokens each, so 2,880.
      - id: vision-language-interfaces.calculate.4
        prompt: A 336 × 672 image (tall and narrow) is split into two 336-pixel tiles plus one overview. At patch 14, how many visual tokens?
        answer: 1728
        feedback: There are 2 tiles plus 1 overview, 3 × 576 = 1,728 tokens.
      - id: vision-language-interfaces.calculate.5
        prompt: A model has an 8,192-token context. You reserve 500 tokens for text. How many 336-pixel images at patch 14 (576 tokens each, no tiling) fit in the rest?
        answer: 13
        feedback: 8,192 − 500 = 7,692 tokens remain, and 7,692 ÷ 576 = 13.35, so 13 whole images fit.
