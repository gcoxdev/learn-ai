schema_version: 0.2-draft
lesson:
  id: vision-language-interfaces
  version: 0.3.0-draft
  title: Connect a vision encoder to a language model
  state: draft
  summary: Follow an image from pixels to a language model’s answer.
  slot: M23.3
  category: learning
  sources:
  - title: LLaVA
    url: https://arxiv.org/abs/2304.08485
  - title: Flamingo
    url: https://arxiv.org/abs/2204.14198
objectives:
- id: objective.vision-language-interfaces
  version: 1-draft
  statement: A vision-language model converts visual inputs into representations consumed by a language model
    through projections, prefixes, or cross-attention; interfaces and training determine what visual evidence
    survives.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - vision-language-interfaces.base
  - vision-language-interfaces.transfer
  prerequisites:
  - anyOf:
    - objective.contrastive-image-text-learning
  - anyOf:
    - objective.transformer-families
scenes:
- id: vision-language-interfaces.s1
  title: Begin with visual features
  type: explanation
  depth: intuition
  objective_refs:
  - objective.vision-language-interfaces
  markdown: 'A **vision encoder** turns an image into numerical features, often one vector per image patch
    or one pooled vector. A **projector** is a learned transformation that makes these features compatible
    with the language model''s input width.


    For example, mapping a 768-dimensional visual vector to a 1,024-dimensional input requires a transformation
    that computes the new values. Simply renaming the coordinates would not connect the two representations.'
  text_mode: 'A **vision encoder** turns an image into numerical features, often one vector per image patch
    or one pooled vector. A **projector** is a learned transformation that makes these features compatible
    with the language model''s input width.


    For example, mapping a 768-dimensional visual vector to a 1,024-dimensional input requires a transformation
    that computes the new values. Simply renaming the coordinates would not connect the two representations.'
  bridges: []
- id: vision-language-interfaces.s2
  title: Expose features to language computation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vision-language-interfaces
  markdown: 'A system can make those visual features available to the language model in different ways. A **prefix**
    places projected visual vectors before text in the input sequence. **Cross-attention** lets text positions
    access a separate sequence of visual features.


    A **resampler** can compress a variable amount of visual information into a fixed number of representations.
    These choices affect which details remain available and how much context and computation the image uses.


    The connection does not turn an image into a perfect description. Some details may already have been lost
    during preprocessing or encoding.'
  text_mode: 'A system can make those visual features available to the language model in different ways. A
    **prefix** places projected visual vectors before text in the input sequence. **Cross-attention** lets
    text positions access a separate sequence of visual features.


    A **resampler** can compress a variable amount of visual information into a fixed number of representations.
    These choices affect which details remain available and how much context and computation the image uses.


    The connection does not turn an image into a perfect description. Some details may already have been lost
    during preprocessing or encoding.'
  bridges: []
- id: vision-language-interfaces.s3
  title: Train the connection
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vision-language-interfaces
  markdown: A staged recipe may first align an interface while freezing major encoders, then tune selected
    components on visual instructions. Other models train more components jointly. Record which weights update
    and the image preprocessing used; the architecture alone does not establish successful grounding.
  text_mode: A staged recipe may first align an interface while freezing major encoders, then tune selected
    components on visual instructions. Other models train more components jointly. Record which weights update
    and the image preprocessing used; the architecture alone does not establish successful grounding.
  bridges: []
- id: vision-language-interfaces.s4
  title: Trace a visual question failure
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vision-language-interfaces
  markdown: If a small label disappears during resizing, the language model cannot reliably recover it from
    absent detail. It may still generate a plausible answer from text priors. Inspect preprocessing, feature
    extraction, fusion, and generation separately when diagnosing a wrong visual response.
  text_mode: If a small label disappears during resizing, the language model cannot reliably recover it from
    absent detail. It may still generate a plausible answer from text priors. Inspect preprocessing, feature
    extraction, fusion, and generation separately when diagnosing a wrong visual response.
  bridges: []
- id: vision-language-interfaces.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.vision-language-interfaces
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A vision-language interface makes visual features available to a language model. Trace which details
    survive preprocessing, encoding, and the connection between them.
- id: vision-language-interfaces.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.vision-language-interfaces
  markdown: A vision-language interface makes visual features available to a language model. Trace which details
    survive preprocessing, encoding, and the connection between them.
  text_mode: A vision-language interface makes visual features available to a language model. Trace which details
    survive preprocessing, encoding, and the connection between them.
