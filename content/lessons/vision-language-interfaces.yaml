assessment_families:
- id: vision-language-interfaces.base
  objective_ref: objective.vision-language-interfaces
  task: base
  response_type: single_choice
  points: 1
  hint: 'Expose features to language computation: trace the inputs, operation, and result before choosing.'
  remediation_scene: vision-language-interfaces.s2
  variants:
  - id: vision-language-interfaces.base.1
    prompt: Why use a projector between feature widths?
    options:
    - id: c
      text: To replace all language tokens with file names
    - id: a
      text: To provide a learned compatible representation interface
    - id: b
      text: To guarantee no visual information is lost
    answer: a
    feedback: Dimensions and learned representation spaces must be connected.
  - id: vision-language-interfaces.base.2
    prompt: What does cross-attention let language queries access?
    options:
    - id: a
      text: Visual key/value representations
    - id: b
      text: Only optimizer moments
    - id: c
      text: Only future answer labels
    answer: a
    feedback: It supplies an explicit cross-modal information path.
- id: vision-language-interfaces.transfer
  objective_ref: objective.vision-language-interfaces
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Trace a visual question failure: trace the inputs, operation, and result before choosing.'
  remediation_scene: vision-language-interfaces.s4
  variants:
  - id: vision-language-interfaces.transfer.1
    prompt: Can resizing remove evidence needed to read a tiny label?
    options:
    - id: a
      text: 'Yes'
    - id: b
      text: 'No'
    - id: c
      text: Only if the image is grayscale
    answer: a
    feedback: Preprocessing can destroy detail before language generation.
  - id: vision-language-interfaces.transfer.2
    prompt: Does connecting two pretrained encoders alone prove visual grounding?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if dimensions match
    - id: a
      text: 'No'
    answer: a
    feedback: Training and evaluation establish whether the interface is useful.
