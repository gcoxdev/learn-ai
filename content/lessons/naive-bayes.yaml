schema_version: 0.2-draft
lesson:
  id: naive-bayes
  version: 0.4.0-draft
  title: A useful classifier with a strong independence assumption
  state: draft
  summary: In 2002 a simple word-counting trick started beating the spam flood. Build that filter yourself, and see why its "naive" assumption works better than it has any right to.
  slot: M06.3
  category: learning
  sources:
    - title: Deep Learning — probability and information theory
      url: https://www.deeplearningbook.org/contents/prob.html
    - title: An Introduction to Statistical Learning — authors’ materials
      url: https://www.statlearning.com/
    - title: A Plan for Spam (Paul Graham, 2002)
      url: https://www.paulgraham.com/spam.html
objectives:
  - id: objective.naive-bayes
    version: 2-draft
    statement: Naive Bayes combines a class prior with feature likelihoods under conditional independence; smoothing and correlated features affect its probabilities and decisions.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - naive-bayes.base.v2
      - naive-bayes.transfer.v2
    prerequisites:
      - anyOf:
          - objective.bayes-rule
scenes:
  - id: naive-bayes.s1
    title: Let the words vote
    type: explanation
    depth: intuition
    objective_refs:
      - objective.naive-bayes
    markdown: |-
      By the early 2000s, junk mail was drowning inboxes, and hand-written rules like "block messages containing FREE" kept failing. Spammers just wrote "FR3E."

      :::story A Plan for Spam
      In August 2002, programmer Paul Graham published an essay called "A Plan for Spam." His filter didn't use rules at all. It learned from his own mail, scoring each word by how much more often it appeared in spam than in his good mail, then combining the most telling words in each new message. Researchers had tried the idea a few years earlier (Sahami and colleagues, 1998), but Graham's essay made it popular, and statistical spam filters soon spread into mail programs.
      :::

      The cleanest version of this idea is called **naive Bayes**. Each clue, such as "the message contains *prize*," is a **feature**. The label we want, spam or ham (ordinary mail), is the **class**. Naive Bayes applies Bayes' rule from the last lesson, with one big shortcut: it estimates each word's probability *separately* within each class, then multiplies them.

      That shortcut is an assumption called **conditional independence**: once you know the class, one word tells you nothing extra about another. Real words clearly violate it. "Free" and "prize" travel together. That's why the method is called *naive*.

      :::mixup "Naive Bayes assumes that words appear independently of each other."
      It assumes something narrower: independence *within* each class. Across all mail, "free" and "prize" are strongly linked, because both are common in spam. Naive Bayes allows that. It only assumes that, among spam messages alone, seeing "free" doesn't change the chance of "prize."
      :::
    bridges: []
  - id: naive-bayes.s2
    title: Score both classes
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.naive-bayes
    markdown: |-
      A message arrives containing "prize" and "winner." From past mail you know:

      | | Prior | P(*prize* \| class) | P(*winner* \| class) | Score |
      | --- | ---: | ---: | ---: | ---: |
      | Spam | 0.2 | 0.5 | 0.4 | 0.2 × 0.5 × 0.4 = 0.04 |
      | Ham | 0.8 | 0.1 | 0.2 | 0.8 × 0.1 × 0.2 = 0.016 |

      Each score is prior × likelihoods, just like the bracket weights in the Bayes lesson. Normalize to get the spam probability: 0.04 / (0.04 + 0.016) ≈ 0.714, or 71.4%. Spam wins, even though ham started four times as likely.

      A real message has hundreds of words, and multiplying hundreds of small probabilities produces numbers too tiny for a computer to store. So filters add **logarithms** instead: log(a × b) = log a + log b.

      :::papers The naive Bayes decision rule
      For a message with words $w_1, \dots, w_n$, pick the class $c$ with the largest log score:

      $$\hat{c} = \arg\max_{c} \Big[ \log P(c) + \sum_{i=1}^{n} \log P(w_i \mid c) \Big]$$

      With natural logs: spam scores $\ln 0.2 + \ln 0.5 + \ln 0.4 \approx -3.22$, and ham scores $\ln 0.8 + \ln 0.1 + \ln 0.2 \approx -4.14$. Spam is ahead by 0.92, and $e^{0.92} \approx 2.5 = 0.04 / 0.016$. It's the same comparison, done with sums.
      :::
    bridges:
      - powers-logs
  - id: naive-bayes.s3
    title: One unseen word shouldn't veto everything
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.naive-bayes
    markdown: |-
      Your colleague writes "Did you see the prize-winner list for the **webinar**?" Suppose "webinar" appeared in 0 of the 10 ham messages you trained on. Then P(*webinar* | ham) = 0/10 = 0, the ham score becomes 0, and the message is called spam no matter what else it says. One missing word vetoed all the other evidence.

      The fix is **Laplace smoothing** (also called add-one smoothing): pretend you saw every possible outcome once more than you did. A yes/no clue has two outcomes, present or absent, so add 1 to the count and 2 to the total: (0 + 1) / (10 + 2) = 1/12. Small, but not zero. For word counts, the outcomes are every word in the vocabulary $V$, so the denominator grows by $|V|$, the vocabulary size:

      $$P(w \mid c) = \frac{\text{count}(w, c) + 1}{\text{total words in } c + |V|}$$

      Here's a complete filter, trained on nine tiny messages:

      ```python run
      import math
      from collections import Counter

      train = [
          ("win a free prize now", "spam"), ("free money click now", "spam"),
          ("claim your free prize", "spam"), ("cheap pills click here", "spam"),
          ("lunch meeting at noon", "ham"), ("notes from the meeting", "ham"),
          ("can you send the notes", "ham"), ("see you at lunch", "ham"),
          ("project meeting moved to friday", "ham"),
      ]
      counts = {"spam": Counter(), "ham": Counter()}
      docs = Counter(label for _, label in train)
      for text, label in train:
          counts[label].update(text.split())
      vocab = set(counts["spam"]) | set(counts["ham"])

      def log_score(words, label):
          total = sum(counts[label].values())
          score = math.log(docs[label] / len(train))            # log prior
          for w in words:
              score += math.log((counts[label][w] + 1) / (total + len(vocab)))  # Laplace
          return score

      for msg in ["free prize meeting", "send meeting notes", "click for lunch"]:
          s, h = log_score(msg.split(), "spam"), log_score(msg.split(), "ham")
          p_spam = 1 / (1 + math.exp(h - s))
          print(f"{msg!r:22} log spam {s:6.2f}  log ham {h:6.2f}  P(spam) = {p_spam:.3f}")
      ```

      "free prize meeting" comes out 0.768 spam, even though "meeting" never appeared in spam. Without the `+ 1`, the spam score would be log 0 (minus infinity) and "meeting" alone would decide. "click for lunch" lands near a coin flip at 0.525; "for" is new to both classes, so smoothing gives it a small, nearly equal chance in each. Try deleting `+ 1` and `+ len(vocab)` and watch the program crash on log 0.
  - id: naive-bayes.s4
    title: Where "naive" bites
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.naive-bayes
    markdown: |-
      Suppose the filter uses two features that are really one clue: "contains *prize*" and "contains *PRIZE*." Both have the same probabilities as *prize* above (0.5 in spam, 0.1 in ham).

      :::predict The message contains "prize," "PRIZE," and "winner." What spam probability does naive Bayes report now?
      The extra copy multiplies spam by 0.5 and ham by 0.1. Spam: 0.04 × 0.5 = 0.02. Ham: 0.016 × 0.1 = 0.0016. The spam probability jumps to 0.02 / 0.0216 ≈ 0.926. Nothing new was learned; the same clue was counted twice.
      :::

      Real text is full of these overlaps: "click here," "limited time," "act now." So naive Bayes tends to push probabilities toward 0 and 1, reporting 99.9% when it should say 90%. Its *ranking* is often still very good: the messages it scores highest really are the spammiest. That's why it survived for decades as a strong, fast baseline for text classification.

      Use it like that. Trust naive Bayes to sort and to decide which side of the line a message falls on. Before you treat its percentages as real confidence, check them against mail the filter never trained on; the last lesson in this module shows how.
    bridges: []
  - id: naive-bayes.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.naive-bayes
    markdown: Score spam and ham from a small table, then diagnose filters that choke on a new word, double-count a clue, or sound far too sure of themselves.
    takeaway: |-
      Naive Bayes multiplies a class prior by each clue's probability within that class, usually as a sum of logs. Smooth the counts so an unseen word can't veto everything, and remember that repeated clues make its percentages overconfident.
  - id: naive-bayes.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.naive-bayes
    markdown: |-
      Naive Bayes multiplies clue probabilities within each class. Its simple independence assumption makes it useful as a baseline, but repeated clues and zero counts need careful handling.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - naive-bayes.s1
