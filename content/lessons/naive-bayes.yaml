schema_version: 0.2-draft
lesson:
  id: naive-bayes
  version: 0.3.0-draft
  title: A useful classifier with a strong independence assumption
  state: draft
  summary: Combine two clues about a message, then see why repeated or unseen clues can distort the answer.
  slot: M06.3
  category: learning
  sources:
  - title: Deep Learning — probability and information theory
    url: https://www.deeplearningbook.org/contents/prob.html
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.naive-bayes
  version: 1-draft
  statement: Naive Bayes combines a class prior with feature likelihoods under conditional independence; smoothing
    and correlated features affect its probabilities and decisions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - naive-bayes.base
  - naive-bayes.transfer
  prerequisites:
  - anyOf:
    - objective.bayes-rule
scenes:
- id: naive-bayes.s1
  title: Combine clues within each category
  type: explanation
  depth: intuition
  objective_refs:
  - objective.naive-bayes
  markdown: 'A spam filter might use clues such as whether a message contains “offer.” Each clue is a **feature**,
    and spam or ordinary mail is the **class** we want to predict.


    **Naive Bayes** estimates clue probabilities separately within each class, then multiplies them. This assumes
    **conditional independence**: once the class is known, learning one clue does not change the probability
    of another. It does not assume the clues are independent across all messages. The assumption makes the
    calculation simple, even though real words often occur together.'
  text_mode: 'A spam filter might use clues such as whether a message contains “offer.” Each clue is a **feature**,
    and spam or ordinary mail is the **class** we want to predict.


    **Naive Bayes** estimates clue probabilities separately within each class, then multiplies them. This assumes
    **conditional independence**: once the class is known, learning one clue does not change the probability
    of another. It does not assume the clues are independent across all messages. The assumption makes the
    calculation simple, even though real words often occur together.'
  bridges: []
- id: naive-bayes.s2
  title: Compare the two class scores
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.naive-bayes
  markdown: 'Suppose the prior probability of spam is 0.2. Within spam, the two observed clues have probabilities
    0.5 and 0.4. The unnormalized spam score is 0.2 × 0.5 × 0.4 = 0.04.


    For ordinary mail, use prior 0.8 and clue probabilities 0.1 and 0.2. Its score is 0.8 × 0.1 × 0.2 = 0.016.
    Spam has the larger score. To obtain the model’s spam probability, divide by the total: 0.04 / (0.04 +
    0.016), or about 71.4%.


    With many clues, programs often use logarithms to turn the products into sums. The comparison still represents
    the same model.'
  text_mode: 'Suppose the prior probability of spam is 0.2. Within spam, the two observed clues have probabilities
    0.5 and 0.4. The unnormalized spam score is 0.2 × 0.5 × 0.4 = 0.04.


    For ordinary mail, use prior 0.8 and clue probabilities 0.1 and 0.2. Its score is 0.8 × 0.1 × 0.2 = 0.016.
    Spam has the larger score. To obtain the model’s spam probability, divide by the total: 0.04 / (0.04 +
    0.016), or about 71.4%.


    With many clues, programs often use logarithms to turn the products into sums. The comparison still represents
    the same model.'
  bridges:
  - powers-logs
- id: naive-bayes.s3
  title: Prevent one unseen event from zeroing the score
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.naive-bayes
  markdown: 'If an estimated feature likelihood is zero, a whole product can become zero. Smoothing adds a
    prior-like adjustment to frequency estimates. The choice should match the event model and data. Multinomial
    word counts and binary word presence are different feature models, not interchangeable formulas.


    For a simple binary clue seen 0 times in 10 messages, add-one smoothing gives the two outcomes one extra
    count each: present becomes 1/12 rather than 0/10. This is an illustrative smoothing rule, not a reason
    to invent an observed message. The count-based and presence-based versions use their own event definitions.'
  text_mode: 'If an estimated feature likelihood is zero, a whole product can become zero. Smoothing adds a
    prior-like adjustment to frequency estimates. The choice should match the event model and data. Multinomial
    word counts and binary word presence are different feature models, not interchangeable formulas.


    For a simple binary clue seen 0 times in 10 messages, add-one smoothing gives the two outcomes one extra
    count each: present becomes 1/12 rather than 0/10. This is an illustrative smoothing rule, not a reason
    to invent an observed message. The count-based and presence-based versions use their own event definitions.'
  bridges: []
- id: naive-bayes.s4
  title: Inspect where the assumption breaks
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.naive-bayes
  markdown: Two near-duplicate features can double-count evidence. Naive Bayes can still classify usefully
    despite violated independence assumptions, but probability calibration may suffer. Evaluate both class
    decisions and probability quality. A simple, fast baseline is valuable precisely because its assumptions
    are easy to state and inspect.
  text_mode: Two near-duplicate features can double-count evidence. Naive Bayes can still classify usefully
    despite violated independence assumptions, but probability calibration may suffer. Evaluate both class
    decisions and probability quality. A simple, fast baseline is valuable precisely because its assumptions
    are easy to state and inspect.
  bridges: []
- id: naive-bayes.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.naive-bayes
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Naive Bayes multiplies clue probabilities within each class. Its simple independence assumption
    makes it useful as a baseline, but repeated clues and zero counts need careful handling.
