assessment_families:
  - id: naive-bayes.base
    objective_ref: objective.naive-bayes
    task: base
    response_type: single_choice
    points: 1
    hint: 'Multiply the evidence within the model: trace the inputs, operation, and result before choosing.'
    remediation_scene: naive-bayes.s2
    variants:
      - id: naive-bayes.base.1
        prompt: What independence assumption does naive Bayes make?
        options:
          - id: c
            text: Every word in every sentence is globally independent
          - id: a
            text: Features are independent conditional on the class
          - id: b
            text: Classes are independent of all features
        answer: a
        feedback: The assumption applies within each class model.
        retired: true
      - id: naive-bayes.base.2
        prompt: 'Prior 0.5 and feature likelihoods 0.2 and 0.3: unnormalized class score?'
        options:
          - id: a
            text: '0.03'
          - id: b
            text: '1.0'
          - id: c
            text: '0.1'
        answer: a
        feedback: Multiply 0.5 × 0.2 × 0.3.
        retired: true
  - id: naive-bayes.transfer
    objective_ref: objective.naive-bayes
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Inspect where the assumption breaks: trace the inputs, operation, and result before choosing.'
    remediation_scene: naive-bayes.s4
    variants:
      - id: naive-bayes.transfer.1
        prompt: An unseen word has estimated likelihood zero. What can smoothing address?
        options:
          - id: a
            text: A zero product caused by sparse frequency estimates
          - id: b
            text: Every form of dataset bias
          - id: c
            text: The need for any prior or data
        answer: a
        feedback: Smoothing changes probability estimates; it does not fix all modeling problems.
        retired: true
      - id: naive-bayes.transfer.2
        prompt: The same signal appears in two highly correlated features. What is a concern?
        options:
          - id: b
            text: The features become guaranteed causal explanations
          - id: c
            text: The class prior disappears
          - id: a
            text: The classifier may count related evidence as if independent
        answer: a
        feedback: Conditional dependence can distort the model’s evidence combination.
        retired: true
  - id: naive-bayes.base.v2
    objective_ref: objective.naive-bayes
    task: base
    response_type: numeric
    points: 1
    hint: For each class, multiply its prior by the probability of every clue within that class. Then divide the spam score by the sum of both scores.
    remediation_scene: naive-bayes.s2
    absolute_tolerance: 0.01
    variants:
      - id: naive-bayes.base.v2.1
        prompt: Spam has prior 0.4, and its two observed clues have probabilities 0.3 and 0.5 within spam. Ham has prior 0.6 and clue probabilities 0.1 and 0.2. What spam probability does naive Bayes give? Use a decimal to two places.
        answer: 0.83
        feedback: Spam scores 0.4 × 0.3 × 0.5 = 0.06 and ham scores 0.6 × 0.1 × 0.2 = 0.012, so the answer is 0.06 / 0.072 ≈ 0.83. Forgetting the priors would give 0.15 / 0.17 ≈ 0.88.
      - id: naive-bayes.base.v2.2
        prompt: Spam has prior 0.5 with clue probabilities 0.2 and 0.1 within spam. Ham has prior 0.5 with clue probabilities 0.05 and 0.4. What spam probability does naive Bayes give? Use a decimal to two places.
        answer: 0.5
        feedback: Both scores come to 0.01 (0.5 × 0.2 × 0.1 and 0.5 × 0.05 × 0.4), so the message is a toss-up at 0.5. One clue favors spam and the other favors ham by the same factor of 4, so they cancel.
      - id: naive-bayes.base.v2.3
        prompt: Spam has prior 0.25 with clue probabilities 0.6 and 0.5 within spam. Ham has prior 0.75 with clue probabilities 0.1 and 0.3. What spam probability does naive Bayes give? Use a decimal to two places.
        answer: 0.77
        feedback: Spam scores 0.25 × 0.6 × 0.5 = 0.075 and ham scores 0.75 × 0.1 × 0.3 = 0.0225, so the answer is 0.075 / 0.0975 ≈ 0.77. The clues outweigh ham's three-to-one head start.
      - id: naive-bayes.base.v2.4
        prompt: Spam has prior 0.1 with clue probabilities 0.8 and 0.5 within spam. Ham has prior 0.9 with clue probabilities 0.2 and 0.1. What spam probability does naive Bayes give? Use a decimal to two places.
        answer: 0.69
        feedback: Spam scores 0.1 × 0.8 × 0.5 = 0.04 and ham scores 0.9 × 0.2 × 0.1 = 0.018, so the answer is 0.04 / 0.058 ≈ 0.69. Both clues favor spam strongly, but the low prior keeps the result well below the 0.95 you'd get by ignoring it.
  - id: naive-bayes.transfer.v2
    objective_ref: objective.naive-bayes
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Look for the two classic weak spots: a count of zero that wipes out a whole product, and two features that are really one clue counted twice.'
    remediation_scene: naive-bayes.s4
    variants:
      - id: naive-bayes.transfer.v2.1
        prompt: A support-ticket classifier never saw the word "firmware" in any billing ticket during training, and it uses no smoothing. A billing ticket arrives that mentions "firmware" once. What happens?
        options:
          - id: b
            text: The unseen word is skipped, since it carries no evidence either way
          - id: a
            text: The billing score becomes zero, so the ticket can't be labeled billing
          - id: c
            text: The ticket goes to whichever class had more training examples
        answer: a
        feedback: Without smoothing, P(firmware | billing) = 0, and multiplying by 0 wipes out every other clue for billing. Some implementations do skip unknown words, but only words absent from the whole vocabulary; this word is known, just never seen with billing.
      - id: naive-bayes.transfer.v2.2
        prompt: A review classifier treats "refund" and "refunds" as two separate features. A review contains both words. How does naive Bayes handle them?
        options:
          - id: c
            text: It spots that the words are related and merges them into one
          - id: b
            text: It keeps the first word and discards the second as redundant
          - id: a
            text: It multiplies in both, counting nearly the same evidence twice
        answer: a
        feedback: Naive Bayes has no idea the features are related, so it multiplies both likelihoods in and pushes the probability further than one clue deserves. Merging word forms is a preprocessing step a person has to add.
      - id: naive-bayes.transfer.v2.3
        prompt: A naive Bayes news-topic classifier ranks articles well, but it reports 99.9% confidence on many articles it gets wrong. What is the most likely explanation?
        options:
          - id: b
            text: Correlated words are counted as separate evidence, inflating its confidence
          - id: a
            text: Its Laplace smoothing is too strong and flattens every probability
          - id: c
            text: Its class priors were set from too few training articles to be useful
        answer: b
        feedback: Overlapping clues get multiplied in as if independent, which pushes probabilities toward 0 and 1 while the ranking stays good. Strong smoothing would do the opposite, pulling probabilities toward the middle.
      - id: naive-bayes.transfer.v2.4
        prompt: In spam, "free" and "prize" often appear together. Which statement matches the assumption naive Bayes actually makes?
        options:
          - id: a
            text: Knowing a message is spam, seeing "free" doesn't change the chance of "prize"
          - id: c
            text: Across all email, "free" and "prize" appear independently of each other
          - id: b
            text: Each word is equally likely to appear in spam and in ordinary mail
        answer: a
        feedback: The assumption is conditional independence within each class. Across all email the words are linked, because both are common in spam, and that's allowed. If words were equally likely in both classes, they'd be useless as clues.
