schema_version: 0.2-draft
lesson:
  id: naive-bayes
  version: 0.1.0-draft
  title: A useful classifier with a strong independence assumption
  state: draft
  summary: Naive Bayes combines a class prior with feature likelihoods under conditional independence; smoothing
    and correlated features affect its probabilities and decisions.
  slot: M06.3
  category: learning
  minutes: 12
  sources:
  - title: Deep Learning — probability and information theory
    url: https://www.deeplearningbook.org/contents/prob.html
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.naive-bayes
  version: 1-draft
  statement: Naive Bayes combines a class prior with feature likelihoods under conditional independence; smoothing
    and correlated features affect its probabilities and decisions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - naive-bayes.base
  - naive-bayes.transfer
  prerequisites:
  - anyOf:
    - objective.bayes-rule
scenes:
- id: naive-bayes.s1
  title: Condition on the class
  type: explanation
  depth: intuition
  objective_refs:
  - objective.naive-bayes
  markdown: A spam classifier can estimate how likely words are in spam and non-spam messages. Naive Bayes assumes
    the selected features are conditionally independent given the class. It does not assume that words are independent
    in the overall population, where class membership can make them correlated.
  text_mode: A spam classifier can estimate how likely words are in spam and non-spam messages. Naive Bayes assumes
    the selected features are conditionally independent given the class. It does not assume that words are independent
    in the overall population, where class membership can make them correlated.
  bridges: []
- id: naive-bayes.s2
  title: Multiply the evidence within the model
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.naive-bayes
  markdown: Suppose spam prior is 0.2 and the likelihoods for two observed features are 0.5 and 0.4 under spam.
    Their unnormalized spam score is 0.2 × 0.5 × 0.4 = 0.04. Compute the corresponding non-spam score and normalize
    if class probabilities are needed. Logarithms turn these products into sums.
  text_mode: Suppose spam prior is 0.2 and the likelihoods for two observed features are 0.5 and 0.4 under spam.
    Their unnormalized spam score is 0.2 × 0.5 × 0.4 = 0.04. Compute the corresponding non-spam score and normalize
    if class probabilities are needed. Logarithms turn these products into sums.
  bridges:
  - powers-logs
- id: naive-bayes.s3
  title: Prevent one unseen event from zeroing the score
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.naive-bayes
  markdown: If an estimated feature likelihood is zero, a whole product can become zero. Smoothing adds a prior-like
    adjustment to frequency estimates. The choice should match the event model and data. Multinomial word counts
    and binary word presence are different feature models, not interchangeable formulas.
  text_mode: If an estimated feature likelihood is zero, a whole product can become zero. Smoothing adds a prior-like
    adjustment to frequency estimates. The choice should match the event model and data. Multinomial word counts
    and binary word presence are different feature models, not interchangeable formulas.
  bridges: []
- id: naive-bayes.s4
  title: Inspect where the assumption breaks
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.naive-bayes
  markdown: Two near-duplicate features can double-count evidence. Naive Bayes can still classify usefully despite
    violated independence assumptions, but probability calibration may suffer. Evaluate both class decisions and
    probability quality. A simple, fast baseline is valuable precisely because its assumptions are easy to state
    and inspect.
  text_mode: Two near-duplicate features can double-count evidence. Naive Bayes can still classify usefully despite
    violated independence assumptions, but probability calibration may suffer. Evaluate both class decisions and
    probability quality. A simple, fast baseline is valuable precisely because its assumptions are easy to state
    and inspect.
  bridges: []
- id: naive-bayes.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.naive-bayes
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: naive-bayes.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.naive-bayes
  markdown: Naive Bayes combines a class prior with feature likelihoods under conditional independence; smoothing
    and correlated features affect its probabilities and decisions.
  text_mode: Naive Bayes combines a class prior with feature likelihoods under conditional independence; smoothing
    and correlated features affect its probabilities and decisions.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - naive-bayes.s1
    - naive-bayes.s2
    - naive-bayes.s3
    - naive-bayes.s4
    - naive-bayes.check
    - naive-bayes.recap
    gate_refs:
