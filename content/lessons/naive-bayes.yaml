assessment_families:
- id: naive-bayes.base
  objective_ref: objective.naive-bayes
  task: base
  response_type: single_choice
  points: 1
  hint: 'Multiply the evidence within the model: trace the inputs, operation, and result before choosing.'
  remediation_scene: naive-bayes.s2
  variants:
  - id: naive-bayes.base.1
    prompt: What independence assumption does naive Bayes make?
    options:
    - id: c
      text: Every word in every sentence is globally independent
    - id: a
      text: Features are independent conditional on the class
    - id: b
      text: Classes are independent of all features
    answer: a
    feedback: The assumption applies within each class model.
  - id: naive-bayes.base.2
    prompt: 'Prior 0.5 and feature likelihoods 0.2 and 0.3: unnormalized class score?'
    options:
    - id: a
      text: '0.03'
    - id: b
      text: '1.0'
    - id: c
      text: '0.1'
    answer: a
    feedback: Multiply 0.5 × 0.2 × 0.3.
- id: naive-bayes.transfer
  objective_ref: objective.naive-bayes
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Inspect where the assumption breaks: trace the inputs, operation, and result before choosing.'
  remediation_scene: naive-bayes.s4
  variants:
  - id: naive-bayes.transfer.1
    prompt: An unseen word has estimated likelihood zero. What can smoothing address?
    options:
    - id: a
      text: A zero product caused by sparse frequency estimates
    - id: b
      text: Every form of dataset bias
    - id: c
      text: The need for any prior or data
    answer: a
    feedback: Smoothing changes probability estimates; it does not fix all modeling problems.
  - id: naive-bayes.transfer.2
    prompt: The same signal appears in two highly correlated features. What is a concern?
    options:
    - id: b
      text: The features become guaranteed causal explanations
    - id: c
      text: The class prior disappears
    - id: a
      text: The classifier may count related evidence as if independent
    answer: a
    feedback: Conditional dependence can distort the model’s evidence combination.
