    keeps no earlier memory. Other conventions scale the gradient contribution differently, so read the stated
    update rule.'
  bridges:
  - algebra-notation
- id: momentum-and-adam.s3
  title: Adam remembers direction and scale
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.momentum-and-adam
  markdown: 'An **exponential average** keeps a fixed fraction of its old value and adds the remaining fraction
    of a new observation. **Adam** uses two such running averages, called moments: one of gradients and one
    of squared gradients.


    The first tracks signed direction. The second tracks scale even when signs change. Gradients +2 and −2
    cancel in a simple average, but both squares are 4. Adam uses exponential averages rather than this two-item
    average; the example shows why the two memories contain different information.


    Starting the averages at zero initially pulls them toward zero. **Bias correction** compensates for that
    initialization. It concerns these estimates, not the additive bias in a neuron.


    A common Adam update divides the corrected first moment by the square root of the corrected second moment
    plus a small stabilizer, then applies the learning rate. This gives different coordinates different effective
    step sizes. The squared-gradient history is not a **Hessian**, a table of second derivatives, and it cannot
    repair an unsuitable loss.'
  text_mode: 'An **exponential average** keeps a fixed fraction of its old value and adds the remaining fraction
