scenes:
- id: momentum-and-adam.s1
  title: The learning rate controls the step scale
  type: explanation
  depth: intuition
  objective_refs:
  - objective.momentum-and-adam
  markdown: A schedule changes the learning rate over training. Warmup gradually raises it early; decay reduces
    it later under a chosen rule. These choices interact with batch size, initialization, and optimizer state. A
    familiar schedule is a starting hypothesis, not a universal optimum.
  text_mode: A schedule changes the learning rate over training. Warmup gradually raises it early; decay reduces
    it later under a chosen rule. These choices interact with batch size, initialization, and optimizer state. A
    familiar schedule is a starting hypothesis, not a universal optimum.
  bridges: []
- id: momentum-and-adam.s2
  title: Momentum combines recent directions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.momentum-and-adam
  markdown: A momentum buffer combines earlier motion with the current gradient. In a simple convention v = βv_previous
    + g, let β = 0.9, previous v = 2, and gradient g = 1. Then v = 2.8. The parameter update uses a learning-rate-scaled
    version of this buffer; other conventions include different normalization factors.
  text_mode: A momentum buffer combines earlier motion with the current gradient. In a simple convention v = βv_previous
    + g, let β = 0.9, previous v = 2, and gradient g = 1. Then v = 2.8. The parameter update uses a learning-rate-scaled
    version of this buffer; other conventions include different normalization factors.
  bridges:
  - algebra-notation
- id: momentum-and-adam.s3
  title: Adam tracks two running quantities
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.momentum-and-adam
  markdown: Adam maintains exponential averages of gradients and squared gradients. Bias corrections compensate
    for initializing these averages at zero. A common update divides the corrected first moment by the square root
    of the corrected second moment plus a small stabilizer. This scales coordinates differently; it is not the same
    as storing a Hessian.
  text_mode: Adam maintains exponential averages of gradients and squared gradients. Bias corrections compensate
    for initializing these averages at zero. A common update divides the corrected first moment by the square root
    of the corrected second moment plus a small stabilizer. This scales coordinates differently; it is not the same
    as storing a Hessian.
  bridges: []
- id: momentum-and-adam.s4
  title: Inspect the complete optimizer state
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.momentum-and-adam
  markdown: Changing optimizers or resuming without moment buffers changes the training trajectory. Large steps
    can still diverge, and adaptive scaling does not repair bad labels or an incorrect loss. Report the exact formulation,
    schedule, coefficients, stabilizer, and decay convention when comparing results.
  text_mode: Changing optimizers or resuming without moment buffers changes the training trajectory. Large steps
    can still diverge, and adaptive scaling does not repair bad labels or an incorrect loss. Report the exact formulation,
    schedule, coefficients, stabilizer, and decay convention when comparing results.
  bridges: []
