scenes:
- id: momentum-and-adam.s1
  title: The learning rate controls the step scale
  type: explanation
  depth: intuition
  objective_refs:
  - objective.momentum-and-adam
  markdown: 'A gradient gives a direction and scale for changing a parameter. The learning rate multiplies
    that gradient to determine the update size. A schedule changes this multiplier over training. Warmup gradually
    raises it early; decay reduces it under a chosen rule.


    Use the small bowl-shaped loss L(w) = w² to isolate the schedule. Its minimum is at zero. Starting from
    w = 4, the gradient is 8; a learning rate of 0.8 takes the parameter across zero to −2.4. Crossing the
    minimum is an overshoot, but the loss still falls because the new point is closer to zero.


    Predict which run has the smaller loss after two updates: a constant rate, or a rate divided by the update
    number. Then try a smaller starting rate. A familiar schedule is a hypothesis to test, not a universal
    optimum. Real results also depend on the loss, initialization, batches, and optimizer state.'
  text_mode: 'A gradient gives a direction and scale for changing a parameter. The learning rate multiplies
