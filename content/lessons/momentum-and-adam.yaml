scenes:
- id: momentum-and-adam.s1
  title: The learning rate controls the step scale
  type: explanation
  depth: intuition
  objective_refs:
  - objective.momentum-and-adam
  markdown: 'A gradient gives a direction and scale for changing a parameter. The learning rate multiplies
    that gradient to determine the update size. A schedule changes this multiplier over training. Warmup gradually
    raises it early; decay reduces it under a chosen rule.


    Use the small bowl-shaped loss L(w) = w² to isolate the schedule. Its minimum is at zero. Starting from
    w = 4, the gradient is 8; a learning rate of 0.8 takes the parameter across zero to −2.4. Crossing the
    minimum is an overshoot, but the loss still falls because the new point is closer to zero.


    Predict which run has the smaller loss after two updates: a constant rate, or a rate divided by the update
    number. Then try a smaller starting rate. A familiar schedule is a hypothesis to test, not a universal
    optimum. Real results also depend on the loss, initialization, batches, and optimizer state.'
  text_mode: 'A gradient gives a direction and scale for changing a parameter. The learning rate multiplies
    that gradient to determine the update size. A schedule changes this multiplier over training. Warmup gradually
    raises it early; decay reduces it under a chosen rule.


    Use the small bowl-shaped loss L(w) = w² to isolate the schedule. Its minimum is at zero. Starting from
    w = 4, the gradient is 8; a learning rate of 0.8 takes the parameter across zero to −2.4. Crossing the
    minimum is an overshoot, but the loss still falls because the new point is closer to zero.


    Predict which run has the smaller loss after two updates: a constant rate, or a rate divided by the update
    number. Then try a smaller starting rate. A familiar schedule is a hypothesis to test, not a universal
    optimum. Real results also depend on the loss, initialization, batches, and optimizer state.'
  bridges: []
  figure:
    kind: learning-rate
    caption: Predict, then compare constant and decaying learning rates on the same scalar quadratic.
    description: Both runs begin at w=4 with loss w². Each update recomputes gradient 2w. One run uses a constant
      rate; the other divides its starting rate by the update number. Their losses and trajectories remain
      separate from assessment evidence.
- id: momentum-and-adam.s2
  title: Remember earlier gradients with momentum
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.momentum-and-adam
  markdown: 'A learning-rate schedule changes the step multiplier. **Momentum** also changes the direction
    estimate by keeping a **buffer**, a stored memory of earlier gradients. One convention is v = βv_previous
    + g. Here g is the current gradient and β, read “beta,” controls how much of the old buffer remains.


    With β = 0.9, previous buffer 2, and gradient 1, the new buffer is 2.8. At learning rate 0.1, subtract
    0.28 from the model parameter. The buffer is not itself the new parameter.


    What if the current gradient is −1? The buffer becomes 0.8: earlier gradients still outweigh the latest
    change of direction. This memory can smooth updates or carry them past a minimum. With β = 0, this convention
    keeps no earlier memory. Other conventions scale the gradient contribution differently, so read the stated
    update rule.'
  text_mode: 'A learning-rate schedule changes the step multiplier. **Momentum** also changes the direction
    estimate by keeping a **buffer**, a stored memory of earlier gradients. One convention is v = βv_previous
    + g. Here g is the current gradient and β, read “beta,” controls how much of the old buffer remains.


    With β = 0.9, previous buffer 2, and gradient 1, the new buffer is 2.8. At learning rate 0.1, subtract
    0.28 from the model parameter. The buffer is not itself the new parameter.


    What if the current gradient is −1? The buffer becomes 0.8: earlier gradients still outweigh the latest
