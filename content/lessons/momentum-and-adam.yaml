- id: momentum-and-adam.s3
  title: Adam tracks two running quantities
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.momentum-and-adam
  markdown: 'Adam maintains exponential averages of gradients and squared gradients. The first tracks signed
    direction; the second tracks a scale even when signs alternate. Bias corrections compensate for initializing
    these averages at zero.


    Consider recent gradients +2 and −2. A simple signed average would cancel to zero, while their squared
    values are both 4. Adam uses exponential averages rather than this simple two-item average, but the example
    explains why remembering squared gradients adds different information.


    A common update divides the corrected first moment by the square root of the corrected second moment plus
    a small stabilizer, then applies the learning rate. Different coordinates can therefore receive different
    effective step sizes. These running moments are not an exact Hessian or a certificate that the loss is
    appropriate.


    An **exponential average** repeatedly keeps a fixed fraction of the old average and adds the remaining
    fraction of the new observation. Adam''s first **moment** tracks gradients; its second tracks squared gradients.
    Starting both at zero initially pulls these averages toward zero, so the bias correction compensates for
    that initialization. This “bias” is not the additive bias inside a neuron.


    A **Hessian** is a table of second derivatives describing curvature. Adam''s squared-gradient history is
    a different quantity; you do not need to calculate a Hessian to use this optimizer.'
