assessment_families:
  - id: momentum-and-adam.base
    objective_ref: objective.momentum-and-adam
    task: base
    response_type: single_choice
    points: 1
    hint: Multiply the old velocity by beta, then add the new gradient.
    remediation_scene: momentum-and-adam.s2
    variants:
      - id: momentum-and-adam.base.1
        retired: true
        prompt: In v = 0.5v_previous + g, with v_previous = 4 and g = 3, what is v?
        options:
          - id: a
            text: '5'
          - id: b
            text: '7'
          - id: c
            text: '3.5'
        answer: a
        feedback: Half of 4 plus 3 equals 5.
      - id: momentum-and-adam.base.2
        retired: true
        prompt: What second running quantity does Adam use in addition to a gradient average?
        options:
          - id: b
            text: An exact Hessian inverse
          - id: c
            text: A list of validation labels
          - id: a
            text: An average of squared gradients
        answer: a
        feedback: The second moment estimate supports coordinate-wise scaling.
  - id: momentum-and-adam.transfer
    objective_ref: objective.momentum-and-adam
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what the optimizer remembers between steps, and what is lost if that memory is reset.
    remediation_scene: momentum-and-adam.s4
    variants:
      - id: momentum-and-adam.transfer.1
        retired: true
        prompt: A checkpoint restores weights but omits Adam moment buffers. Is the resumed optimizer state identical?
        options:
          - id: b
            text: Yes; weights contain all optimizer history
          - id: c
            text: Only if the file names match
          - id: a
            text: 'No'
        answer: a
        feedback: Optimizer history is separate state from model parameters.
      - id: momentum-and-adam.transfer.2
        retired: true
        prompt: Adam diverges on a broken loss. Does adaptive scaling guarantee a fix?
        options:
          - id: c
            text: Only after renaming the optimizer
          - id: a
            text: No; objective and numerical issues still require diagnosis
          - id: b
            text: Yes; Adam makes every loss correct
        answer: a
        feedback: An optimizer transforms gradients; it does not validate the objective.
  - id: momentum-and-adam.base.v2
    objective_ref: objective.momentum-and-adam
    task: base
    response_type: numeric
    points: 1
    absolute_tolerance: 0.001
    hint: 'Two steps: first the new velocity, v = beta × old velocity + gradient; then the new weight, w − learning rate × v. Use the velocity, not the raw gradient, in the second step.'
    remediation_scene: momentum-and-adam.s2
    variants:
      - id: momentum-and-adam.base.v2.1
        prompt: Momentum uses v ← βv + g and w ← w − ηv. With β = 0.9, old velocity 2, gradient 1, learning rate 0.1, and weight 5, what is the new weight?
        answer: 4.72
        feedback: The velocity is 0.9 × 2 + 1 = 2.8, so the weight moves by 0.1 × 2.8 = 0.28 to 4.72. Using the raw gradient would give 4.9, ignoring the stored momentum.
      - id: momentum-and-adam.base.v2.2
        prompt: Momentum uses v ← βv + g and w ← w − ηv. With β = 0.5, old velocity 4, gradient 3, learning rate 0.1, and weight 1, what is the new weight?
        answer: 0.5
        feedback: The velocity is 0.5 × 4 + 3 = 5, so the weight moves by 0.1 × 5 = 0.5 to 0.5. Forgetting to shrink the old velocity (4 + 3 = 7) would give 0.3.
      - id: momentum-and-adam.base.v2.3
        prompt: Momentum uses v ← βv + g and w ← w − ηv. With β = 0.9, old velocity 3, gradient −2, learning rate 0.05, and weight 0, what is the new weight?
        answer: -0.035
        feedback: The velocity is 0.9 × 3 − 2 = 0.7, still positive, so the weight moves down by 0.05 × 0.7 = 0.035 to −0.035. The gradient flipped sign, but the stored momentum still wins this step.
      - id: momentum-and-adam.base.v2.4
        prompt: Momentum uses v ← βv + g and w ← w − ηv. With β = 0.8, old velocity −5, gradient −1, learning rate 0.2, and weight 2, what is the new weight?
        answer: 3
        feedback: The velocity is 0.8 × (−5) − 1 = −5, so the weight changes by −0.2 × (−5) = +1 to 3. Subtracting a negative velocity moves the weight up.
  - id: momentum-and-adam.transfer.v2
    objective_ref: objective.momentum-and-adam
    task: transfer
    response_type: single_choice
    points: 1
    hint: Momentum remembers direction, Adam also remembers typical gradient size for each weight, and a schedule sets the step multiplier over time. Ask which of these the situation involves.
    remediation_scene: momentum-and-adam.s3
    variants:
      - id: momentum-and-adam.transfer.v2.1
        prompt: A training run is restarted from a file holding only the weights. The loss jumps up for a few hundred steps, then recovers. What was most likely lost?
        options:
          - id: b
            text: Part of the weights, which were rounded when the file was saved
          - id: a
            text: Adam's running averages, the step count, and the schedule position
          - id: c
            text: The training data order, which made the next batches much harder
        answer: a
        feedback: Restarting with m = v = 0 and step 1 resets bias correction and warmup, and throws away momentum, so early steps are poorly scaled. Saving weights doesn't round them enough to matter, and a new data order alone rarely causes a sustained jump.
      - id: momentum-and-adam.transfer.v2.2
        prompt: On Adam's first step, one weight's gradient is 0.01 and another's is 100. Using bias-corrected Adam, how do their step sizes compare?
        options:
          - id: c
            text: The second step is 10,000 times larger, like the gradients
          - id: b
            text: The second step is 100 times larger, the square root of the ratio
          - id: a
            text: Both steps are about the learning rate in size
        answer: a
        feedback: On step 1, m̂ = g and √v̂ = |g|, so each step is η × g/|g|, about η for both. Adam divides out the gradient's scale; plain SGD would give the 10,000-fold difference.
      - id: momentum-and-adam.transfer.v2.3
        prompt: With plain gradient descent, the loss zigzags from one side of a narrow valley to the other while crawling along its floor. Lowering the learning rate stops the zigzag but makes the crawl even slower. What does momentum change?
        options:
          - id: b
            text: It raises the learning rate for every weight by a fixed factor
          - id: a
            text: It cancels the side-to-side swings and builds speed along the floor
          - id: c
            text: It computes the exact curvature so each step lands at the bottom
        answer: a
        feedback: The velocity adds up recent gradients, so alternating side-to-side gradients cancel while the steady downhill component accumulates. A bigger learning rate everywhere would make the zigzag blow up, and momentum uses no curvature information.
      - id: momentum-and-adam.transfer.v2.4
        prompt: A transformer trained with Adam at peak rate 0.001 diverges within the first 50 steps, but trains well if the same peak is reached after 2,000 steps of warmup. What does that suggest?
        options:
          - id: c
            text: The peak rate is too high for the final stage of training
          - id: b
            text: Adam can't be used with transformers unless its betas are changed
          - id: a
            text: The earliest steps need smaller rates while training is unsettled
        answer: a
        feedback: With warmup the same peak works, so the peak itself isn't the problem; the very first steps are fragile, with random weights, erratic gradients, and Adam averages built from few samples. Adam trains transformers routinely with its usual betas.
      - id: momentum-and-adam.transfer.v2.5
        prompt: A colleague says Adam's second average, v, is pointless because gradients of +3 and −3 average to zero. What is the best reply?
        options:
          - id: b
            text: v averages squared gradients, so it sees size 9 either way
          - id: a
            text: v cancels to zero too, so Adam falls back to plain SGD here
          - id: c
            text: v tracks direction, while m tracks how often signs change
        answer: b
        feedback: v averages g², so +3 and −3 both contribute 9 and v measures typical gradient size. It's m, the plain average, that can cancel; that's why Adam keeps both.
