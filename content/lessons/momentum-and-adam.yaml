  bridges: []
  figure:
    kind: learning-rate
    caption: Predict, then compare constant and decaying learning rates on the same scalar quadratic.
    description: Both runs begin at w=4 with loss w². Each update recomputes gradient 2w. One run uses a constant
      rate; the other divides its starting rate by the update number. Their losses and trajectories remain
      separate from assessment evidence.
- id: momentum-and-adam.s2
  title: Momentum combines recent directions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.momentum-and-adam
  markdown: 'A schedule changes the step multiplier. Momentum changes the direction estimate by remembering
    earlier gradients. In one simple convention, v = βv_previous + g, and the parameter update subtracts learning_rate
    × v.


    Let β = 0.9, previous v = 2, and current gradient g = 1. The new buffer is 2.8. With learning rate 0.1,
    subtract 0.28 from the parameter. The buffer and the parameter are distinct values; 2.8 is not the new
    parameter.


    Now predict the sign if the current gradient is −1 instead. The buffer becomes 0.8: earlier positive motion
    still outweighs this one negative gradient. Momentum can smooth changing directions, but it can also carry
    motion past a minimum. Other conventions normalize the gradient contribution differently, so state the
    exact update rule.


    The **buffer** is a stored memory number. β, read “beta,” controls how much of the previous buffer survives;
    g is the current gradient. Neither is the model''s weight. A β near 1 keeps a long memory; β = 0 removes
    that memory under this convention.'
