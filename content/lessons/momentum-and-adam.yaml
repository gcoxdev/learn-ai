- id: momentum-and-adam.s4
  title: Inspect the complete optimizer state
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.momentum-and-adam
  markdown: 'Saving weights alone does not save an optimizer’s full state. Imagine pausing two runs at identical
    weights. One restores its previous momentum or Adam buffers; the other resets them to zero. Their next
    updates can differ even on the same batch.


    When comparing or resuming runs, record the weights, optimizer buffers, step count, learning-rate schedule,
    coefficients, stabilizer, and weight-decay convention. A schedule may depend on the step count, so resetting
    it can also change the next update.


    If loss grows, inspect the objective and update values before assuming adaptive scaling will fix it. Large
    steps can diverge; bad labels or an incorrect loss remain problems for Adam too. The schedule lab isolates
    one failure mode on an exact scalar loss, not the full behavior of a trained neural network.'
