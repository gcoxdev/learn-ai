objectives:
- id: objective.bayesian-learning
  version: 1-draft
  statement: Bayesian learning updates uncertain parameters or functions; Gaussian processes, variational approximations,
    and probabilistic programs offer different representations and computational tradeoffs.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
