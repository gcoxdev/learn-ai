assessment_families:
- id: bayesian-learning.base
  objective_ref: objective.bayesian-learning
  task: base
  response_type: single_choice
  points: 1
  hint: 'A Gaussian process places a prior over functions: trace the inputs, operation, and result before choosing.'
  remediation_scene: bayesian-learning.s2
  variants:
  - id: bayesian-learning.base.1
    prompt: What does a Gaussian-process kernel specify?
    options:
    - id: b
      text: Only a processor instruction
    - id: c
      text: A guaranteed causal effect
    - id: a
      text: Covariance relationships among function values
    answer: a
    feedback: The kernel encodes relationships such as smoothness in a function prior.
  - id: bayesian-learning.base.2
    prompt: What does variational inference optimize?
    options:
    - id: c
      text: The true posterior without any approximation restrictions
    - id: a
      text: A tractable approximation to the target posterior
    - id: b
      text: Only the order of file names
    answer: a
    feedback: The approximation family and objective constrain the result.
- id: bayesian-learning.transfer
  objective_ref: objective.bayesian-learning
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'A probabilistic program separates model from inference: trace the inputs, operation, and result before
    choosing.'
  remediation_scene: bayesian-learning.s4
  variants:
  - id: bayesian-learning.transfer.1
    prompt: A variational family cannot represent two separated modes. What may happen?
    options:
    - id: c
      text: The likelihood becomes irrelevant
    - id: a
      text: It can miss important posterior structure
    - id: b
      text: It must recover both modes exactly
    answer: a
    feedback: Approximation restrictions can shape reported uncertainty.
  - id: bayesian-learning.transfer.2
    prompt: A probabilistic program runs successfully. What is still necessary?
    options:
    - id: a
      text: Model checks and inference diagnostics
    - id: b
      text: A claim that every interval is correct
    - id: c
      text: No further inspection
    answer: a
    feedback: Executable model notation does not certify assumptions or inference quality.
