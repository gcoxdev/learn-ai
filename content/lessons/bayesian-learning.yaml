lesson:
  id: bayesian-learning
  version: 0.1.0-draft
  title: Learn distributions over plausible explanations
  state: draft
  summary: Bayesian learning updates uncertain parameters or functions; Gaussian processes, variational approximations,
    and probabilistic programs offer different representations and computational tradeoffs.
  slot: M06.7
  category: learning
  sources:
  - title: Deep Learning — probability and information theory
