- id: bayesian-learning.s4
  title: A probabilistic program separates model from inference
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bayesian-learning
  markdown: 'A **probabilistic program** describes unknown quantities, their distributions, and how observations
    depend on them. A separate inference procedure performs the updating. **Latent** simply means a quantity
    is unobserved rather than directly supplied as data.


    Before trusting the result, generate possible data from the prior: do they resemble plausible situations?
    Then check predictions after fitting against observed and held-out cases. A narrow uncertainty interval
    is useful only if the model and approximation deserve that confidence. Try asking what real-world change
    the temperature model would have difficulty representing.'
  text_mode: 'A **probabilistic program** describes unknown quantities, their distributions, and how observations
