lesson:
  id: bayesian-learning
  version: 0.4.0-draft
  title: Learn distributions over plausible explanations
  state: draft
  summary: One café has two glowing reviews; another has 180 out of 200. Which should you trust? Learn to keep every plausible explanation in view instead of betting on one.
  slot: M06.7
  category: learning
