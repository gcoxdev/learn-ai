scenes:
- id: bayesian-learning.s1
  title: Keep several plausible models in view
  type: explanation
  depth: intuition
  objective_refs:
  - objective.bayesian-learning
  markdown: Bayesian learning combines a prior with a data likelihood to form a posterior. Prediction averages possible
    outcomes over posterior uncertainty rather than relying only on one fitted parameter setting. The result still
    depends on the chosen model family and prior; uncertainty calculations do not remove misspecification.
  text_mode: Bayesian learning combines a prior with a data likelihood to form a posterior. Prediction averages
    possible outcomes over posterior uncertainty rather than relying only on one fitted parameter setting. The result
    still depends on the chosen model family and prior; uncertainty calculations do not remove misspecification.
  bridges: []
- id: bayesian-learning.s2
  title: A Gaussian process places a prior over functions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bayesian-learning
  markdown: A Gaussian process specifies means and a covariance kernel such that finite collections of function
    values are jointly Gaussian. A kernel can express that nearby inputs tend to have similar outputs. Observations
    update predictions and uncertainty at new inputs. The kernel encodes assumptions about smoothness or other structure.
  text_mode: A Gaussian process specifies means and a covariance kernel such that finite collections of function
    values are jointly Gaussian. A kernel can express that nearby inputs tend to have similar outputs. Observations
    update predictions and uncertainty at new inputs. The kernel encodes assumptions about smoothness or other structure.
  bridges:
  - information-theory
  - matrices-tensors
- id: bayesian-learning.s3
  title: Approximate a difficult posterior
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bayesian-learning
  markdown: Variational inference selects a tractable distribution q to approximate a posterior. A common objective
    maximizes expected log likelihood minus a KL penalty to the prior, under the relevant model assumptions. The
    chosen q family can miss correlations or multiple modes. MCMC and variational methods make different accuracy
    and computation tradeoffs.
  text_mode: Variational inference selects a tractable distribution q to approximate a posterior. A common objective
    maximizes expected log likelihood minus a KL penalty to the prior, under the relevant model assumptions. The
    chosen q family can miss correlations or multiple modes. MCMC and variational methods make different accuracy
    and computation tradeoffs.
  bridges: []
- id: bayesian-learning.s4
  title: A probabilistic program separates model from inference
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bayesian-learning
  markdown: A program can declare latent variables, observation distributions, and conditional structure while an
    inference engine estimates the posterior. Convenient syntax does not make inference exact or fast. Check prior
    predictive behavior, posterior predictions, approximation diagnostics, and sensitivity to assumptions before
    interpreting a precise-looking interval.
  text_mode: A program can declare latent variables, observation distributions, and conditional structure while
    an inference engine estimates the posterior. Convenient syntax does not make inference exact or fast. Check
    prior predictive behavior, posterior predictions, approximation diagnostics, and sensitivity to assumptions
    before interpreting a precise-looking interval.
  bridges: []
