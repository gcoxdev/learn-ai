scenes:
- id: bayesian-learning.s1
  title: Keep several plausible models in view
  type: explanation
  depth: intuition
  objective_refs:
  - objective.bayesian-learning
  markdown: 'Suppose two snack rules remain plausible after seeing the data: 2 crackers per guest has posterior
    weight 0.25, and 4 per guest has weight 0.75. **Posterior** means the uncertainty after the observations.
    For three guests, the rules predict 6 and 12. Averaging their predictions gives 0.25 × 6 + 0.75 × 12 =
    10.5 crackers.


    Bayesian learning combines a **prior**, uncertainty before the data, with a **likelihood**, how each candidate
    accounts for the observations. Keeping several plausible settings can reveal uncertainty that choosing
    one best setting hides. But a collection of wrong model assumptions can still give misleading predictions.'
  text_mode: 'Suppose two snack rules remain plausible after seeing the data: 2 crackers per guest has posterior
    weight 0.25, and 4 per guest has weight 0.75. **Posterior** means the uncertainty after the observations.
    For three guests, the rules predict 6 and 12. Averaging their predictions gives 0.25 × 6 + 0.75 × 12 =
    10.5 crackers.


    Bayesian learning combines a **prior**, uncertainty before the data, with a **likelihood**, how each candidate
    accounts for the observations. Keeping several plausible settings can reveal uncertainty that choosing
    one best setting hides. But a collection of wrong model assumptions can still give misleading predictions.'
  bridges: []
- id: bayesian-learning.s2
  title: A Gaussian process places a prior over functions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bayesian-learning
  markdown: 'A **Gaussian process** is a way to describe uncertainty over functions: possible curves mapping
    an input to an output. For example, several smooth curves might fit the measured temperature at two times
    but disagree between them.


    Its **kernel** says how function values at different inputs are expected to vary together. A common choice
    treats nearby times as strongly related. A Gaussian process specifies a jointly Gaussian, or multivariate
    bell-shaped, distribution for any finite set of function values. New observations update this collection
    of plausible curves. The kernel''s assumptions matter: smoothness can be a poor fit for a sudden equipment
    shutdown.'
  text_mode: 'A **Gaussian process** is a way to describe uncertainty over functions: possible curves mapping
    an input to an output. For example, several smooth curves might fit the measured temperature at two times
    but disagree between them.


    Its **kernel** says how function values at different inputs are expected to vary together. A common choice
    treats nearby times as strongly related. A Gaussian process specifies a jointly Gaussian, or multivariate
    bell-shaped, distribution for any finite set of function values. New observations update this collection
    of plausible curves. The kernel''s assumptions matter: smoothness can be a poor fit for a sudden equipment
    shutdown.'
  bridges:
  - information-theory
  - matrices-tensors
- id: bayesian-learning.s3
  title: Approximate a difficult posterior
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bayesian-learning
  markdown: 'Exact updating may be too expensive. **Variational inference** chooses a manageable distribution,
    often written q, to approximate the posterior. Imagine replacing a complicated landscape of possibilities
    with a simpler shape that can be stored and calculated easily.


    One common objective rewards explaining the observations while penalizing departure from the prior using
    **KL divergence**, a measure of how distributions differ. This is equivalent to fitting the posterior under
    the associated approximation objective. A shape with one peak can miss two separated explanations. MCMC,
    introduced in the sampling lesson, explores by drawing dependent samples; it has different computational
    and diagnostic needs.'
  text_mode: 'Exact updating may be too expensive. **Variational inference** chooses a manageable distribution,
    often written q, to approximate the posterior. Imagine replacing a complicated landscape of possibilities
    with a simpler shape that can be stored and calculated easily.


    One common objective rewards explaining the observations while penalizing departure from the prior using
    **KL divergence**, a measure of how distributions differ. This is equivalent to fitting the posterior under
    the associated approximation objective. A shape with one peak can miss two separated explanations. MCMC,
    introduced in the sampling lesson, explores by drawing dependent samples; it has different computational
    and diagnostic needs.'
