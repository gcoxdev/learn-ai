assessment_families:
  - id: bayesian-learning.base
    objective_ref: objective.bayesian-learning
    task: base
    response_type: single_choice
    points: 1
    hint: 'A Gaussian process places a prior over functions: trace the inputs, operation, and result before choosing.'
    remediation_scene: bayesian-learning.s2
    variants:
      - id: bayesian-learning.base.1
        prompt: What does a Gaussian-process kernel specify?
        options:
          - id: b
            text: Only a processor instruction
          - id: c
            text: A guaranteed causal effect
          - id: a
            text: Covariance relationships among function values
        answer: a
        feedback: The kernel encodes relationships such as smoothness in a function prior.
        retired: true
      - id: bayesian-learning.base.2
        prompt: What does variational inference optimize?
        options:
          - id: c
            text: The true posterior without any approximation restrictions
          - id: a
            text: A tractable approximation to the target posterior
          - id: b
            text: Only the order of file names
        answer: a
        feedback: The approximation family and objective constrain the result.
        retired: true
  - id: bayesian-learning.transfer
    objective_ref: objective.bayesian-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'A probabilistic program separates model from inference: trace the inputs, operation, and result before choosing.'
    remediation_scene: bayesian-learning.s4
    variants:
      - id: bayesian-learning.transfer.1
        prompt: A variational family cannot represent two separated modes. What may happen?
        options:
          - id: c
            text: The likelihood becomes irrelevant
          - id: a
            text: It can miss important posterior structure
          - id: b
            text: It must recover both modes exactly
        answer: a
        feedback: Approximation restrictions can shape reported uncertainty.
        retired: true
      - id: bayesian-learning.transfer.2
        prompt: A probabilistic program runs successfully. What is still necessary?
        options:
          - id: a
            text: Model checks and inference diagnostics
          - id: b
            text: A claim that every interval is correct
          - id: c
            text: No further inspection
        answer: a
        feedback: Executable model notation does not certify assumptions or inference quality.
        retired: true
  - id: bayesian-learning.base.v2
    objective_ref: objective.bayesian-learning
    task: base
    response_type: numeric
    points: 1
    hint: With a flat prior over the rate, k successes in n tries give posterior mean (k + 1)/(n + 2). It sits between the raw fraction k/n and 0.5, closer to k/n as n grows.
    remediation_scene: bayesian-learning.every-rate
    absolute_tolerance: 0.01
    variants:
      - id: bayesian-learning.base.v2.1
        prompt: A new food truck has 4 reviews, 3 of them happy. With a flat prior on its happy-customer rate, what is the posterior mean rate? Use a decimal to two places.
        answer: 0.67
        feedback: (3 + 1)/(4 + 2) = 4/6 ≈ 0.67. The raw fraction 0.75 ignores how little four reviews tell you, so the posterior pulls it toward the middle.
      - id: bayesian-learning.base.v2.2
        prompt: A new app feature was tried by 3 users, and none of them kept using it. With a flat prior on the keep-using rate, what is the posterior mean rate? Use a decimal to two places.
        answer: 0.2
        feedback: (0 + 1)/(3 + 2) = 1/5 = 0.2. The raw fraction 0 would claim the feature can never work, which three users can't show.
      - id: bayesian-learning.base.v2.3
        prompt: A coding assistant's suggestions were accepted 9 times out of 10. With a flat prior on its acceptance rate, what is the posterior mean rate? Use a decimal to two places.
        answer: 0.83
        feedback: (9 + 1)/(10 + 2) = 10/12 ≈ 0.83. With ten tries, the prior still pulls the raw 0.9 noticeably toward the middle.
      - id: bayesian-learning.base.v2.4
        prompt: A delivery robot finished 18 of its first 20 routes without help. With a flat prior on its success rate, what is the posterior mean rate? Use a decimal to two places.
        answer: 0.86
        feedback: (18 + 1)/(20 + 2) = 19/22 ≈ 0.86. It's the same raw fraction as 9 of 10, but with twice the data the posterior mean sits closer to 0.9.
  - id: bayesian-learning.transfer.v2
    objective_ref: objective.bayesian-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: A Bayesian answer weights every plausible explanation by its posterior. Ask what the method assumes (prior, kernel, or shape of q) and where that assumption could hide uncertainty.
    remediation_scene: bayesian-learning.s3
    variants:
      - id: bayesian-learning.transfer.v2.1
        prompt: A shop ranks products by average star rating. A product with a single 5-star review now sits above one rated 4.8 from 900 reviews. Which change applies Bayesian learning to fix this?
        options:
          - id: b
            text: Hide every product that has fewer than 1,000 reviews
          - id: a
            text: Rank by posterior mean, pulling thin records toward a prior
          - id: c
            text: Rank by each product's single most recent review score
        answer: a
        feedback: A posterior mean shrinks a one-review average strongly toward the prior, while 900 reviews barely move. Hiding small products throws away real information, and the latest review is even noisier than the average.
      - id: bayesian-learning.transfer.v2.2
        prompt: Two rain models have posterior weights 0.7 and 0.3. They predict 0.4 inches and 1.2 inches of rain tomorrow. What is the Bayesian (posterior predictive) forecast?
        options:
          - id: c
            text: 0.8 inches, halfway between the two
          - id: b
            text: 0.4 inches, from the more probable model
          - id: a
            text: 0.64 inches, weighting each by its posterior
        answer: a
        feedback: 0.7 × 0.4 + 0.3 × 1.2 = 0.64 inches. Picking the stronger model ignores a 30% chance it's wrong, and a plain average ignores the evidence that favors the first model.
      - id: bayesian-learning.transfer.v2.3
        prompt: A Gaussian process with a smooth kernel models a machine's temperature. At 2:00 the machine shut down and cooled by 30 degrees within a minute. Predictions near 2:00 are smeared and wrong. What is the main cause?
        options:
          - id: a
            text: The kernel assumes nearby times have similar values, and a sudden drop breaks that
          - id: b
            text: The model needs more readings from later that afternoon to see the drop
          - id: c
            text: The noise level is set too low, so the model overreacts to each reading
        answer: a
        feedback: The kernel encodes "nearby times are alike," so it spreads the drop across neighboring minutes. A kernel that allows sudden changes fits better. Readings from later in the afternoon wouldn't change what the kernel assumes around 2:00.
      - id: bayesian-learning.transfer.v2.4
        prompt: The true posterior of a parameter has two separate peaks. Variational inference with a single bell curve reports one narrow peak. What most likely happened?
        options:
          - id: b
            text: The ELBO was maximized, so q must equal the true posterior
          - id: a
            text: The single bell settled on one peak and ignored the other
          - id: c
            text: The prior was so wide that it merged the two peaks into one
        answer: a
        feedback: A one-peaked q can't cover two peaks, and fitting it by KL(q‖p) tends to lock onto one of them, understating uncertainty. Maximizing the ELBO finds the closest bell, not an exact match.
