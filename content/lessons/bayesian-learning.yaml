scenes:
  - id: bayesian-learning.s1
    title: Keep both explanations in view
    type: explanation
    depth: intuition
    objective_refs:
      - objective.bayesian-learning
    markdown: |-
      Café A has 2 reviews, both happy. Café B has 200 reviews, 180 happy. Café A's record is perfect, yet most people would bet on Café B. Bayesian reasoning explains that instinct and puts numbers on it.

      Start simple. Suppose any café is either *great* (90% of customers leave happy) or *average* (60% happy), and before reading reviews you think each is equally likely. Café A's two happy reviews have likelihood 0.9 × 0.9 = 0.81 if it's great and 0.6 × 0.6 = 0.36 if it's average. Bayes' rule gives:

      | Explanation | Prior | × Likelihood | Posterior |
      | --- | ---: | ---: | ---: |
      | Great (90%) | 0.5 | 0.81 | 0.405 / 0.585 ≈ 0.69 |
      | Average (60%) | 0.5 | 0.36 | 0.180 / 0.585 ≈ 0.31 |

      :::predict What's the chance that *your* visit to Café A is happy?
      About 0.81. Don't just pick the winner. Average the explanations' predictions, weighted by the posterior: 0.69 × 0.9 + 0.31 × 0.6 ≈ 0.81. Betting on "great" alone would say 0.9, and those extra 9 points of confidence come from ignoring a 31% chance that you're wrong.
      :::

      Keeping every plausible explanation, weighted by its posterior, is the heart of **Bayesian learning**. The weighted-average prediction is called the **posterior predictive**.
    bridges: []
  - id: bayesian-learning.every-rate
    title: From two explanations to every possible rate
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.bayesian-learning
    markdown: |-
      Real cafés aren't just "great" or "average." Let θ be the café's happy-customer rate, anywhere from 0 to 1, and give every value equal prior weight. Then update exactly as before, for every θ at once. This program does it on a fine grid of 999 values:

      ```python run
      import numpy as np

      theta = np.linspace(0.001, 0.999, 999)      # candidate "happy customer" rates
      prior = np.ones_like(theta)                 # flat prior: every rate equally plausible

      for name, happy, reviews in [("Cafe A", 2, 2), ("Cafe B", 180, 200)]:
          likelihood = theta**happy * (1 - theta)**(reviews - happy)
          posterior = prior * likelihood
          posterior /= posterior.sum()            # normalize, as in Bayes' rule
          mean = (theta * posterior).sum()
          p_above = posterior[theta > 0.8].sum()
          print(f"{name}: {happy}/{reviews} happy -> posterior mean {mean:.3f}, "
                f"P(rate > 0.8) = {p_above:.2f}")
      ```

      Café A's posterior mean is 0.750, and there's only a 0.49 chance its rate beats 80%: two reviews can't rule out a mediocre café. Café B's mean is 0.896, and it's almost certainly above 80%. The perfect record loses because its posterior is wide. Try giving Café A 20 happy reviews out of 20.

      :::papers Updating a parameter, then predicting
      For parameters $\theta$ and data $D$:

      $$p(\theta \mid D) = \frac{p(D \mid \theta)\,p(\theta)}{p(D)}, \qquad p(x_{\text{new}} \mid D) = \int p(x_{\text{new}} \mid \theta)\,p(\theta \mid D)\,d\theta$$

      The integral is the continuous version of the café table's weighted average. For a flat prior and k happy reviews out of n, the posterior mean has a famous closed form: $(k + 1)/(n + 2)$. Café A: $3/4 = 0.750$. Café B: $181/202 \approx 0.896$. Both match the program.
      :::
  - id: bayesian-learning.s2
    title: A prior over whole curves
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.bayesian-learning
    markdown: |-
      Sometimes the unknown is a whole curve, such as how crowded Café B is at each hour of the day. You've counted people at 9 a.m. and 1 p.m. What about 11 a.m.? Or 6 p.m.?

      A **Gaussian process** puts a prior over curves. Its **kernel**, a function k(t, t′), says how strongly the values at two times move together. A common choice treats nearby times as similar:

      $$k(t, t') = \sigma^2 \exp\!\left(-\frac{(t - t')^2}{2\ell^2}\right)$$

      With length scale ℓ = 2 hours, times 1 hour apart get correlation exp(−1/8) ≈ 0.88, and times 4 hours apart only exp(−2) ≈ 0.14. After the two counts, the plausible curves all pass near the measured points. Between them they still agree fairly well, because 11 a.m. is strongly tied to both. At 6 p.m., five hours after the nearest count, they fan out widely. The model's uncertainty grows exactly where you have no data.

      The kernel is where your assumptions live. A smooth kernel expects gradual change, so it would blur a sudden event like a fire alarm emptying the café. Pick a kernel whose idea of "similar" matches how your curve really behaves.
    bridges:
      - information-theory
      - matrices-tensors
  - id: bayesian-learning.s3
    title: When the exact posterior is out of reach
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.bayesian-learning
    markdown: |-
      A grid of 999 values works for one parameter. A neural network has millions, and a grid would need more points than there are atoms in the universe. Two escape routes exist. MCMC, from the last lesson, samples the posterior. **Variational inference** instead picks a simple family of shapes, usually bell curves, and searches for the member q that sits closest to the true posterior.

      "Closest" is measured with **KL divergence**, the mismatch between distributions from the information theory lesson. You can't compute the KL to the true posterior directly, since that needs the posterior you're trying to find. But a quantity you *can* compute, the **evidence lower bound (ELBO)**, rises exactly as that KL falls. In plain terms, the method searches for the simple shape q that best balances two goals: explain the data, and stay close to the prior.

      :::papers The evidence lower bound (ELBO)
      $$\log p(D) = \underbrace{\mathbb{E}_{q(\theta)}\big[\log p(D \mid \theta)\big] - \mathrm{KL}\big(q(\theta)\,\|\,p(\theta)\big)}_{\text{ELBO}(q)} \;+\; \mathrm{KL}\big(q(\theta)\,\|\,p(\theta \mid D)\big)$$

      The first ELBO term rewards explaining the data; the second penalizes straying from the prior. The left side doesn't depend on q, so raising the ELBO must shrink the last term, the gap between q and the true posterior. Variational autoencoders are trained by maximizing a version of this bound, with the unknowns being each image's hidden code.
      :::

      :::mixup "Variational inference gives you the posterior, just faster."
      It gives you the closest simple shape. If the true posterior has two separate peaks and q is a single bell, q typically settles on one peak and reports too little uncertainty. MCMC is slower but can, with good mixing, find both.
      :::
    bridges:
      - information-theory
  - id: bayesian-learning.s4
    title: Write the model, let the computer infer
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.bayesian-learning
    markdown: |-
      A **probabilistic program** is code that describes how your data could have been generated: which quantities are unknown, what priors they have, and how the observations depend on them. Tools such as Stan and PyMC then run the inference (usually MCMC or variational inference) for you. Unknown quantities that are never observed directly, like a café's true happy rate, are called **latent** variables.

      Before trusting the result, run the model forward. Draw parameters from the priors and simulate fake data, a **prior predictive check**. Suppose your café model's priors produce simulated days where 300% of customers are happy, or where the café serves 40,000 people before lunch. The priors are wrong, and you've caught it before fitting anything. After fitting, compare the model's predictions with real days it didn't train on.
    bridges: []
  - id: bayesian-learning.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.bayesian-learning
    markdown: Compute posterior means from review counts, then weigh rating rankings, rain forecasts, curve kernels, and a two-peaked posterior.
    takeaway: |-
      Bayesian learning keeps a distribution over explanations and averages their predictions by posterior weight. When the exact posterior is too hard, sample it (MCMC) or fit the closest simple shape (variational inference), and check both against data.
  - id: bayesian-learning.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.bayesian-learning
    markdown: |-
      Keep several explanations in view and update their influence using observations. A useful uncertainty estimate depends on both the model assumptions and the method used to approximate the answer.
