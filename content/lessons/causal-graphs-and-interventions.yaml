schema_version: 0.2-draft
lesson:
  id: causal-graphs-and-interventions
  version: 0.3.0-draft
  title: Ask what would change if an action changed the world
  state: draft
  summary: Separate a pattern you observe from a change you could cause.
  slot: M31.1
  category: learning
  sources:
  - title: 'Causal Inference: What If — authors’ book'
    url: https://miguelhernan.org/whatifbook
  - title: 'Causal inference in statistics: An overview'
    url: https://ftp.cs.ucla.edu/pub/stat_ser/r350.pdf
objectives:
- id: objective.causal-graphs-and-interventions
  version: 1-draft
  statement: Causal inference distinguishes observed association from intervention effects; causal graphs express
    assumptions about confounding and information needed to estimate those effects.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - causal-graphs-and-interventions.base
  - causal-graphs-and-interventions.transfer
  prerequisites:
  - anyOf:
    - objective.bayes-rule
  - anyOf:
    - objective.controlled-experiments
scenes:
- id: causal-graphs-and-interventions.s1
  title: Association is a pattern in observations
  type: explanation
  depth: intuition
  objective_refs:
  - objective.causal-graphs-and-interventions
  markdown: Ice-cream sales and swimming incidents may rise together because warm weather affects both. Observing
    high sales does not imply that reducing ice-cream purchases would reduce incidents. A common cause can
    produce a predictive relationship without a direct causal link between the measured variables.
  text_mode: Ice-cream sales and swimming incidents may rise together because warm weather affects both. Observing
    high sales does not imply that reducing ice-cream purchases would reduce incidents. A common cause can
    produce a predictive relationship without a direct causal link between the measured variables.
  bridges: []
- id: causal-graphs-and-interventions.s2
  title: Draw assumptions with arrows
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.causal-graphs-and-interventions
  markdown: A causal directed graph can draw weather pointing to sales and incidents. Arrows represent hypothesized
    causal relationships, not merely correlations inferred from a plot. A **confounder** is a common cause
    of the treatment being studied and its outcome. The graph helps identify confounding paths and which variables
    might need adjustment under justified assumptions.
  text_mode: A causal directed graph can draw weather pointing to sales and incidents. Arrows represent hypothesized
    causal relationships, not merely correlations inferred from a plot. A **confounder** is a common cause
    of the treatment being studied and its outcome. The graph helps identify confounding paths and which variables
    might need adjustment under justified assumptions.
  bridges: []
- id: causal-graphs-and-interventions.s3
  title: Intervene rather than condition
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.causal-graphs-and-interventions
  markdown: Conditioning on X=x describes people or situations where X happened to equal x. Intervening to
    set X=x changes the mechanism assigning X in the causal model. Randomized assignment can make treatment
    independent of prior confounders under the experiment’s design, supporting stronger effect identification.
  text_mode: Conditioning on X=x describes people or situations where X happened to equal x. Intervening to
    set X=x changes the mechanism assigning X in the causal model. Randomized assignment can make treatment
    independent of prior confounders under the experiment’s design, supporting stronger effect identification.
  bridges: []
- id: causal-graphs-and-interventions.s4
  title: Adjust with a valid reason
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.causal-graphs-and-interventions
  markdown: 'Adding every available variable to an analysis can change the question or introduce bias. Consider
    two roles a variable might play.


    A **mediator** lies along a causal path. Practice may improve skill, which then improves a score. Adjusting
    for skill removes part of the pathway when the question is about the total effect of practice.


    A **collider** is a common effect of other variables. Suppose an invitation depends on either excellent
    drawing or excellent singing. Among invited people, weaker drawing can suggest stronger singing even if
    the skills were independent before selection. Selecting on the invitation can create an association.


    Choose adjustments from the causal question and justified assumptions about these relationships. The observed
    dataset alone may not establish those assumptions.'
  text_mode: 'Adding every available variable to an analysis can change the question or introduce bias. Consider
    two roles a variable might play.


    A **mediator** lies along a causal path. Practice may improve skill, which then improves a score. Adjusting
    for skill removes part of the pathway when the question is about the total effect of practice.


    A **collider** is a common effect of other variables. Suppose an invitation depends on either excellent
    drawing or excellent singing. Among invited people, weaker drawing can suggest stronger singing even if
    the skills were independent before selection. Selecting on the invitation can create an association.


    Choose adjustments from the causal question and justified assumptions about these relationships. The observed
    dataset alone may not establish those assumptions.'
  bridges: []
- id: causal-graphs-and-interventions.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.causal-graphs-and-interventions
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Association describes what varies together; intervention asks what a change would cause. Causal
    graphs make the assumptions behind that distinction explicit.
- id: causal-graphs-and-interventions.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.causal-graphs-and-interventions
  markdown: Association describes what varies together; intervention asks what a change would cause. Causal
    graphs make the assumptions behind that distinction explicit.
  text_mode: Association describes what varies together; intervention asks what a change would cause. Causal
    graphs make the assumptions behind that distinction explicit.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - causal-graphs-and-interventions.s1
    - causal-graphs-and-interventions.s2
    - causal-graphs-and-interventions.s3
    - causal-graphs-and-interventions.s4
    - causal-graphs-and-interventions.check
    gate_refs:
    - gate.core
