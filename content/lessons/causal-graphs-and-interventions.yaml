assessment_families:
- id: causal-graphs-and-interventions.base
  objective_ref: objective.causal-graphs-and-interventions
  task: base
  response_type: single_choice
  points: 1
  hint: 'Draw assumptions with arrows: trace the inputs, operation, and result before choosing.'
  remediation_scene: causal-graphs-and-interventions.s2
  variants:
  - id: causal-graphs-and-interventions.base.1
    prompt: Warm weather increases sales and incidents. What role can weather play?
    options:
    - id: a
      text: A common cause or confounder
    - id: b
      text: Proof that sales directly cause incidents
    - id: c
      text: An irrelevant label always
    answer: a
    feedback: A shared cause can generate association.
  - id: causal-graphs-and-interventions.base.2
    prompt: Is observing X=x identical to intervening to set X=x?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if X is numeric
    - id: a
      text: 'No'
    answer: a
    feedback: Observation and intervention use different assignment mechanisms.
- id: causal-graphs-and-interventions.transfer
  objective_ref: objective.causal-graphs-and-interventions
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Adjust with a valid reason: trace the inputs, operation, and result before choosing.'
  remediation_scene: causal-graphs-and-interventions.s4
  variants:
  - id: causal-graphs-and-interventions.transfer.1
    prompt: Should every available variable automatically be controlled for?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only in large datasets
    - id: a
      text: 'No'
    answer: a
    feedback: Adjustment depends on causal structure and the estimand.
  - id: causal-graphs-and-interventions.transfer.2
    prompt: What does a causal graph’s arrow represent?
    options:
    - id: c
      text: Only visual similarity
    - id: a
      text: An assumed causal relationship
    - id: b
      text: A guaranteed relationship proved by drawing it
    answer: a
    feedback: The graph encodes assumptions to reason about effects.
