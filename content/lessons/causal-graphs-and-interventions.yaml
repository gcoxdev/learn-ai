assessment_families:
  - id: causal-graphs-and-interventions.base
    objective_ref: objective.causal-graphs-and-interventions
    task: base
    response_type: single_choice
    points: 1
    hint: 'Draw assumptions with arrows: trace the inputs, operation, and result before choosing.'
    remediation_scene: causal-graphs-and-interventions.s2
    variants:
      - id: causal-graphs-and-interventions.base.1
        prompt: Warm weather increases sales and incidents. What role can weather play?
        options:
          - id: a
            text: A common cause or confounder
          - id: b
            text: Proof that sales directly cause incidents
          - id: c
            text: An irrelevant label always
        answer: a
        feedback: A shared cause can generate association.
        retired: true
      - id: causal-graphs-and-interventions.base.2
        prompt: Is observing X=x identical to intervening to set X=x?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if X is numeric
          - id: a
            text: 'No'
        answer: a
        feedback: Observation and intervention use different assignment mechanisms.
        retired: true
  - id: causal-graphs-and-interventions.transfer
    objective_ref: objective.causal-graphs-and-interventions
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Adjust with a valid reason: trace the inputs, operation, and result before choosing.'
    remediation_scene: causal-graphs-and-interventions.s4
    variants:
      - id: causal-graphs-and-interventions.transfer.1
        prompt: Should every available variable automatically be controlled for?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only in large datasets
          - id: a
            text: 'No'
        answer: a
        feedback: Adjustment depends on causal structure and the estimand.
        retired: true
      - id: causal-graphs-and-interventions.transfer.2
        prompt: What does a causal graph’s arrow represent?
        options:
          - id: c
            text: Only visual similarity
          - id: a
            text: An assumed causal relationship
          - id: b
            text: A guaranteed relationship proved by drawing it
        answer: a
        feedback: The graph encodes assumptions to reason about effects.
        retired: true
  - id: causal-graphs-and-interventions.base.v2
    objective_ref: objective.causal-graphs-and-interventions
    task: base
    response_type: single_choice
    points: 1
    hint: "Ask how each group of patients came to get its treatment. Seeing weights groups by who received the treatment; doing weights them by the whole population."
    remediation_scene: causal-graphs-and-interventions.s3
    variants:
      - id: causal-graphs-and-interventions.base.v2.1
        prompt: In the kidney-stone study, open surgery (A) had the higher success rate for small stones and for large stones, but the lower rate overall. What explains the reversal?
        options:
          - id: b
            text: The small-stone groups are too small to trust, so the overall rate is right
          - id: c
            text: Pooling the groups adds patients, which averages away A's advantage
          - id: a
            text: A was given mostly for large stones, which fail more often with any method
        answer: a
        feedback: Stone size drove both the treatment choice and the outcome, so A's pooled rate is weighed down by its harder cases. The small-stone groups (87 and 270 patients) are not tiny, and pooling alone can't flip a comparison unless the groups are mixed in different proportions.
      - id: causal-graphs-and-interventions.base.v2.2
        prompt: What does P(success | do(A)) describe that P(success | A) does not?
        options:
          - id: c
            text: The success rate among patients whom doctors chose to give A
          - id: a
            text: The success rate if every patient were given A, whatever their stone size
          - id: b
            text: The success rate of A measured on a larger sample of past patients
        answer: a
        feedback: The do-operator means setting the treatment for everyone, which cuts the link from stone size to the choice. The rate among patients doctors chose for A is the plain conditional P(success | A), the "seeing" quantity. A bigger sample of the same kind of records would still be seeing.
      - id: causal-graphs-and-interventions.base.v2.3
        prompt: Why does assigning treatment by coin flip remove confounding by stone size?
        options:
          - id: b
            text: It removes the arrow from stone size to success, so size stops mattering
          - id: a
            text: It removes the arrow from stone size to treatment, so both arms get the same size mix
          - id: c
            text: It makes every patient's stones a similar size before the treatments begin
        answer: a
        feedback: A coin can't see stone size, so size no longer influences who gets A, and both arms end up with the same mix on average. Large stones are still harder to clear, so the arrow from size to success stays; it just affects both arms equally.
      - id: causal-graphs-and-interventions.base.v2.4
        prompt: To compute the adjusted success rate for A, you average A's small-stone and large-stone rates. What weights do you use?
        options:
          - id: a
            text: The share of each stone size among all patients in the study
          - id: b
            text: The share of each stone size among the patients who received A
          - id: c
            text: One half for each size, so that neither group counts more
        answer: a
        feedback: The backdoor formula weights each group by P(z), how common it is in the whole population. Weighting by P(z | A), the size mix among A's patients, just reproduces the confounded 78%. Equal weights would describe a population that is half small and half large, which may not be yours.
      - id: causal-graphs-and-interventions.base.v2.5
        prompt: "In the kidney-stone graph (stone size → treatment, stone size → success, treatment → success), which path makes the raw comparison of A and B misleading?"
        options:
          - id: c
            text: Treatment → success, since that arrow mixes the effect with chance
          - id: b
            text: Stone size → success, since large stones are harder to clear
          - id: a
            text: Treatment ← stone size → success, a backdoor path through a common cause
        answer: a
        feedback: The backdoor path links treatment and success through stone size, apart from any effect of treatment. Treatment → success is the effect we want to keep. The arrow from size to success alone would do no harm if size didn't also steer the treatment choice.
  - id: causal-graphs-and-interventions.transfer.v2
    objective_ref: objective.causal-graphs-and-interventions
    task: transfer
    response_type: single_choice
    points: 1
    hint: Place the variable in the graph first. Does it cause the treatment (a fork), lie on the path from treatment to outcome (a chain), or get caused by both (a collider)?
    remediation_scene: causal-graphs-and-interventions.s4
    variants:
      - id: causal-graphs-and-interventions.transfer.v2.1
        prompt: Users of a study app who switch on a "streak" reminder study on more days. Highly motivated users are more likely both to switch it on and to study. What role does motivation play?
        options:
          - id: b
            text: A mediator, the route by which streaks increase studying
          - id: a
            text: A confounder, a common cause of switching streaks on and studying
          - id: c
            text: A collider, a common effect of streaks and of studying
        answer: a
        feedback: Motivation causes both the choice and the outcome, the fork shape, so it opens a backdoor path and should be adjusted for (or randomized away). A mediator would be caused by the streak feature; a collider would be caused by both streaks and studying.
      - id: causal-graphs-and-interventions.transfer.v2.2
        prompt: A company hires anyone who aces either its coding test or its interview. Among employees, coding scores and interview scores are negatively related. What is the most likely explanation?
        options:
          - id: c
            text: Practicing for one test crowds out practice for the other, so the skills compete
          - id: b
            text: The two tests measure the same skill, but on reversed scales
          - id: a
            text: Hiring is a common effect of both scores, and looking only at hires links them
        answer: a
        feedback: Hiring is a collider. Among hires, a weak coding score implies a strong interview, the same pattern as Berkson's hospital. Competing practice could create a link too, but it's unnecessary to explain what selection alone produces.
      - id: causal-graphs-and-interventions.transfer.v2.3
        prompt: A farm trial wants the total effect of a new fertilizer on crop yield. The fertilizer raises soil nitrogen, which raises yield. How should the analysis treat nitrogen?
        options:
          - id: a
            text: Leave it out, since adjusting for it blocks the path the fertilizer works through
          - id: b
            text: Adjust for it, since it is a strong predictor of the crop's final yield
          - id: c
            text: Adjust for it, since it is a common cause of fertilizer use and yield
        answer: a
        feedback: Nitrogen is a mediator on the chain fertilizer → nitrogen → yield. Holding it fixed hides the very effect you want. Being a strong predictor doesn't make a variable a confounder; the fertilizer causes the nitrogen, not the other way round.
      - id: causal-graphs-and-interventions.transfer.v2.4
        prompt: Among patients admitted to a hospital, those with diabetes seem less likely to have a broken bone. Either condition can lead to admission. What should an analyst suspect first?
        options:
          - id: b
            text: Diabetes medication strengthens bones and protects against breaks
          - id: c
            text: Admission is a confounder, so the analysis should adjust for it
          - id: a
            text: Studying only admitted patients selects on a common effect of both
        answer: a
        feedback: Admission is caused by both conditions, so it's a collider, and restricting to admitted patients creates the negative link (Berkson's paradox). Admission is not a cause of diabetes or fractures, so it can't be a confounder.
      - id: causal-graphs-and-interventions.transfer.v2.5
        prompt: Shoppers who click a product recommendation spend more. The team wants to know whether showing recommendations causes more spending, and shopping intent is hard to measure. Which study answers that best?
        options:
          - id: c
            text: Compare clickers and non-clickers within each age group, then reweight by age
          - id: a
            text: Show recommendations to a randomly chosen half of shoppers and compare spending
          - id: b
            text: Train a larger model to predict spending from clicks and read its weights
        answer: a
        feedback: Randomizing who sees recommendations cuts every arrow into the treatment, including unmeasured intent. Adjusting for age closes only the age backdoor, and a better predictive model still describes seeing, not doing.
  - id: causal-graphs-and-interventions.calculate
    objective_ref: objective.causal-graphs-and-interventions
    task: base
    response_type: numeric
    points: 1
    hint: Take the treated group's success rate within each group, multiply it by that group's share of the whole population, and add the products.
    remediation_scene: causal-graphs-and-interventions.s5
    absolute_tolerance: 0.2
    variants:
      - id: causal-graphs-and-interventions.calculate.1
        prompt: A drug succeeds in 90% of mild cases and 60% of severe cases. In the whole population, 70% of cases are mild and 30% severe. Severity is the only confounder. What is the adjusted success rate P(success | do(drug)), in percent?
        answer: 81
        feedback: 0.7 × 90 + 0.3 × 60 = 63 + 18 = 81%. The weights are the population shares, not the share of mild cases among patients who happened to get the drug.
      - id: causal-graphs-and-interventions.calculate.2
        prompt: In the kidney-stone study, treatment B succeeded in 86.7% of small stones and 68.8% of large stones. Small stones were 51% of all patients and large 49%. What is B's adjusted success rate, in percent (one decimal)?
        answer: 77.9
        feedback: 0.51 × 86.7 + 0.49 × 68.8 = 44.2 + 33.7 = 77.9%, below B's raw 83%, because B's raw rate was lifted by its many easy small-stone cases.
      - id: causal-graphs-and-interventions.calculate.3
        prompt: Among young patients, 80% recover with a drug and 70% without it. Among older patients, 50% recover with it and 40% without. The population is 60% young and 40% older. By how many percentage points does the drug raise the adjusted recovery rate?
        answer: 10
        feedback: With the drug, 0.6 × 80 + 0.4 × 50 = 68%. Without, 0.6 × 70 + 0.4 × 40 = 58%. The adjusted effect is 68 − 58 = 10 points.
      - id: causal-graphs-and-interventions.calculate.4
        prompt: Tutored students pass 50% of the time as beginners and 90% as advanced students. Among all students, 40% are beginners and 60% advanced. Level is the only confounder. What is the adjusted pass rate with tutoring, in percent?
        answer: 74
        feedback: 0.4 × 50 + 0.6 × 90 = 20 + 54 = 74%. If most tutored students were beginners, the raw pass rate among tutored students would be lower than this.
      - id: causal-graphs-and-interventions.calculate.5
        prompt: A new checkout page converts 12% of mobile visitors and 20% of desktop visitors. Mobile is 75% of all traffic, but it made up only 25% of the visitors who happened to see the new page. Device is the only confounder. What is the adjusted conversion rate P(convert | do(new page)), in percent?
        answer: 14
        feedback: Weight by the whole population's device mix, 0.75 × 12 + 0.25 × 20 = 9 + 5 = 14%. Using the mix among people who saw the page (0.25 × 12 + 0.75 × 20 = 18%) gives the seeing rate instead.
