schema_version: 0.2-draft
lesson:
  id: causal-graphs-and-interventions
  version: 0.4.0-draft
  title: Ask what would change if an action changed the world
  state: draft
  summary: Treatment A beat treatment B for small kidney stones and for large ones, yet lost overall. Untangle the paradox with one drawing and one weighted average.
  slot: M31.1
  category: learning
  sources:
    - title: "Comparison of treatment of renal calculi by open surgery, percutaneous nephrolithotomy, and extracorporeal shockwave lithotripsy (Charig et al., BMJ, 1986)"
      url: https://pmc.ncbi.nlm.nih.gov/articles/PMC1339981/
    - title: "Confounding and Simpson's paradox (Julious & Mullee, BMJ, 1994)"
      url: https://pubmed.ncbi.nlm.nih.gov/7804052/
    - title: "Causal inference in statistics: An overview (Pearl, 2009)"
      url: https://ftp.cs.ucla.edu/pub/stat_ser/r350.pdf
    - title: "Causal Inference: What If (Hernán & Robins)"
      url: https://miguelhernan.org/whatifbook
objectives:
  - id: objective.causal-graphs-and-interventions
    version: 2-draft
    statement: Tell seeing from doing, draw a causal graph of your assumptions, adjust for confounders with the backdoor formula, and avoid adjusting for mediators and colliders.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - causal-graphs-and-interventions.base.v2
      - causal-graphs-and-interventions.transfer.v2
      - causal-graphs-and-interventions.calculate
    prerequisites:
      - anyOf:
          - objective.bayes-rule
      - anyOf:
          - objective.controlled-experiments
scenes:
  - id: causal-graphs-and-interventions.s1
    title: The treatment that wins every group and loses overall
    type: explanation
    depth: intuition
    objective_refs:
      - objective.causal-graphs-and-interventions
    markdown: |-
      In 1986 British urologists compared past patients' kidney-stone treatments, including open surgery (**A**) and a keyhole operation through a small cut in the back (**B**, percutaneous nephrolithotomy). Success meant the stones were gone, or under 2 mm, three months later.

      | Treatment | Patients | Successes | Success rate |
      | --- | ---: | ---: | ---: |
      | A: open surgery | 350 | 273 | 78% |
      | B: keyhole | 350 | 289 | 83% |

      :::predict You need a kidney stone removed. Which treatment would you choose?
      Most people pick B. Now split the same 700 patients by stone size:

      | Treatment | Small stones | Large stones | All stones |
      | --- | ---: | ---: | ---: |
      | A | 81/87 = **93%** | 192/263 = **73%** | 273/350 = 78% |
      | B | 234/270 = 87% | 55/80 = 69% | 289/350 = 83% |

      A wins for small stones *and* for large stones, yet loses overall.
      :::

      A trend that holds in every group but flips when the groups are combined is called **Simpson's paradox**, after Edward Simpson, who described it in 1951.

      The arithmetic is fine. Look at who got which treatment: A went mostly to large stones (263 of its 350 patients), B mostly to small ones (270 of 350). Large stones are harder to clear with any method, so A's 78% mixes what A does with how hard A's cases were. Which table should a doctor trust? That depends on what caused what.
    bridges: []
  - id: causal-graphs-and-interventions.s2
    title: Draw what causes what
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.causal-graphs-and-interventions
    markdown: |-
      A **causal graph** is a drawing of your assumptions: one node per variable, and an arrow from X to Y when changing X would change Y. For the kidney stones, three arrows:

      - **Stone size → treatment:** doctors tended to choose open surgery for larger stones.
      - **Stone size → success:** large stones are harder to clear.
      - **Treatment → success:** the effect we want to measure.

      You can't follow the arrows around in a loop, so this is a **directed acyclic graph**, or **DAG**.

      Stone size is a **confounder**: a common cause of the treatment and the outcome. It opens a second route between treatment and success that has nothing to do with the treatment's effect: treatment ← stone size → success. A route like this, which starts with an arrow *into* the treatment, is a **backdoor path**. The raw 78% versus 83% mixes the effect with this backdoor association.

      :::mixup "The Bayesian network lesson said arrows aren't causes, so these arrows aren't either."
      In module 6's Bayesian networks, arrows only said how to split a probability table into pieces, and you could often reverse them. A causal arrow claims more: what would change if you stepped in. It comes from knowing how the world works (here, how doctors pick treatments), not from the data, because two causal graphs can fit the same data equally well and still disagree about an intervention.
      :::
    diagram:
      caption: The kidney-stone study as a causal graph. Stone size is a confounder.
      description: Stone size has an arrow to treatment, labeled doctors' choice, and an arrow to success, labeled harder to clear. Treatment has an arrow to success, labeled the effect we want. The path from treatment back through stone size to success is the backdoor path.
      nodes:
        - id: size
          label: Stone size
          note: the confounder
          col: 1
          row: 0
          tone: data
        - id: treatment
          label: Treatment (A or B)
          col: 0
          row: 1
          tone: accent
        - id: success
          label: Success at 3 months
          col: 2
          row: 1
      edges:
        - from: size
          to: treatment
          label: doctors' choice
        - from: size
          to: success
          label: harder to clear
        - from: treatment
          to: success
          label: the effect we want
    bridges: []
  - id: causal-graphs-and-interventions.s3
    title: Seeing A is not doing A
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.causal-graphs-and-interventions
    markdown: |-
      "How well does A work?" hides two different questions.

      - **Seeing:** among patients who *were given* A, how many recovered? That's the ordinary conditional probability $P(\text{success} \mid A)$, the 78%.
      - **Doing:** if we *gave* A to everyone, how many would recover? Judea Pearl writes this $P(\text{success} \mid do(A))$. The **do-operator** means setting a variable by stepping in, rather than watching what value it happens to take.

      Doing A deletes the arrow from stone size into treatment. The doctors' habit no longer matters, so the backdoor path is gone. A randomized trial does exactly this in the real world: a coin picks each treatment, so stone size can't influence the choice. That's why the lesson on controlled experiments (module 9) leaned on random assignment.

      :::predict In a randomized trial with these same 700 patients, about what share of A's patients would have large stones?
      About 49%, the same as the whole group (343 of 700), and the same for B. The coin gives both arms the same mix of stone sizes on average, so the plain difference in success rates now measures the treatment's effect.
      :::

      Often you can't randomize: the treatments were given years ago, or a trial would be unethical. Can you compute $P(\text{success} \mid do(A))$ from the old records? For this graph, yes.
    bridges: []
  - id: causal-graphs-and-interventions.s5
    title: Compare within sizes, then reweight
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.causal-graphs-and-interventions
    markdown: |-
      Within one stone size, size can't explain who got which treatment. So compare A and B *within* each size, then average the two rates, weighting each size by how common it is among **all** patients, not among A's patients. Of the 700, 357 had small stones (0.51) and 343 had large ones (0.49).

      | Treatment | Small (weight 0.51) | Large (weight 0.49) | Adjusted success rate |
      | --- | ---: | ---: | ---: |
      | A | 93.1% | 73.0% | 0.51 × 93.1 + 0.49 × 73.0 = **83.3%** |
      | B | 86.7% | 68.8% | 0.51 × 86.7 + 0.49 × 68.8 = **77.9%** |

      A's raw 78% came from the same two rates, weighted differently: 0.249 × 93.1 + 0.751 × 73.0 = 78.0, because three quarters of A's patients had large stones. Adjusted, A beats B by about 5 points.

      :::papers The backdoor adjustment formula
      If a set of variables $Z$ blocks every backdoor path from $X$ to $Y$, and nothing in $Z$ is caused by $X$, then

      $$P(y \mid do(x)) = \sum_z P(y \mid x, z)\,P(z)$$

      Compare the plain conditional, $P(y \mid x) = \sum_z P(y \mid x, z)\,P(z \mid x)$. Only the weights differ. Here $x$ is treatment A, $y$ is success, and $z$ is stone size: $P(\text{large}) = 0.49$, but $P(\text{large} \mid A) = 0.751$. Pearl called this condition the **backdoor criterion**.
      :::

      ```python run
      # Kidney-stone data (Charig et al., 1986): (successes, patients)
      data = {("A", "small"): (81, 87),   ("A", "large"): (192, 263),
              ("B", "small"): (234, 270), ("B", "large"): (55, 80)}
      sizes = ["small", "large"]

      patients = sum(n for _, n in data.values())
      p_size = {z: sum(data[(t, z)][1] for t in "AB") / patients for z in sizes}
      print("P(size):", {z: round(p, 3) for z, p in p_size.items()})

      for t in "AB":
          rate = {z: data[(t, z)][0] / data[(t, z)][1] for z in sizes}
          wins = sum(data[(t, z)][0] for z in sizes)
          n = sum(data[(t, z)][1] for z in sizes)
          seen = wins / n                                    # P(success | treatment = t)
          done = sum(rate[z] * p_size[z] for z in sizes)     # P(success | do(treatment = t))
          print(f"{t}: small {rate['small']:.1%}  large {rate['large']:.1%}  "
                f"| seen {seen:.1%}  | adjusted {done:.1%}")
      ```

      Now add the line `p_size = {"small": 0.2, "large": 0.8}` just before the loop, for a clinic that sees mostly large stones. Both adjusted rates fall, but A stays ahead, because it wins inside both groups.

      Before you trust an adjusted number, list everything that influenced the treatment choice. If doctors also sent frailer patients to B, and frailty isn't in the records, stone size alone won't close the backdoor.
    bridges: []
  - id: causal-graphs-and-interventions.s4
    title: Forks, chains, and colliders
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.causal-graphs-and-interventions
    markdown: |-
      So why not adjust for every variable you have? Because what adjusting does depends on the variable's place in the graph, and every graph is built from three small shapes:

      | Shape | Picture | Example | Adjusting for the middle variable |
      | --- | --- | --- | --- |
      | **Fork** | X ← Z → Y | treatment ← stone size → success | Removes a false association: adjust |
      | **Chain** | X → M → Y | drug → blood pressure → stroke | Blocks part of the real effect |
      | **Collider** | X → C ← Y | disease 1 → admitted ← disease 2 | Creates a false association |

      In a chain, M is a **mediator**, the route the effect travels along. Compare only patients with the same blood pressure and the drug looks useless: you've held fixed the very thing it changes.

      A collider is a common *effect*. Its two causes can be unrelated, yet become linked once you look only at certain values of the collider. That's **collider bias**, which you met as "explaining away" with module 6's wet lawn.

      :::predict In a town of 1,000 people, 10% have disease D1 and 10% have D2, independently. The hospital admits everyone with either disease. Among admitted patients without D1, what share have D2?
      All of them. 100 people have D1, 100 have D2, and 10 have both, so 190 are admitted. The 90 without D1 must have come in for D2. Among admitted patients *with* D1, only 10 of 100 have D2. Inside the hospital D1 seems to protect against D2, though in the town they're unrelated. Joseph Berkson described this trap in 1946; it's now called Berkson's paradox.
      :::

      Machine learning datasets filtered by a common effect carry the same trap: loans that were approved, users who stayed, papers that were published.

      :::key Adjust by role, not by habit
      Before adjusting for a variable, find it in the graph. A common cause of treatment and outcome: adjust. A step on the path from treatment to outcome, or a common effect: leave it out.
      :::
    diagram:
      caption: The three building blocks of a causal graph, and whether to adjust for the middle node.
      description: Top row, a fork. Stone size points to both treatment and success. Middle row, a chain. A drug points to blood pressure, which points to stroke. Bottom row, a collider. Disease 1 and disease 2 both point to hospital admission.
      nodes:
        - id: fork-x
          label: Treatment
          col: 0
          row: 0
        - id: fork-z
          label: Stone size
          note: "fork: adjust"
          col: 1
          row: 0
          tone: data
        - id: fork-y
          label: Success
          col: 2
          row: 0
        - id: chain-x
          label: Drug
          col: 0
          row: 1
        - id: chain-m
          label: Blood pressure
          note: "chain: mediator, leave it"
          col: 1
          row: 1
          tone: muted
        - id: chain-y
          label: Stroke
          col: 2
          row: 1
        - id: coll-x
          label: Disease 1
          col: 0
          row: 2
        - id: coll-c
          label: Admitted to hospital
          note: "collider: leave it"
          col: 1
          row: 2
          tone: warn
        - id: coll-y
          label: Disease 2
          col: 2
          row: 2
      edges:
        - from: fork-z
          to: fork-x
        - from: fork-z
          to: fork-y
        - from: chain-x
          to: chain-m
        - from: chain-m
          to: chain-y
        - from: coll-x
          to: coll-c
        - from: coll-y
          to: coll-c
    bridges: []
  - id: causal-graphs-and-interventions.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.causal-graphs-and-interventions
    markdown: Adjusted success rates to compute by hand, then a study app, a hiring pipeline, a fertilizer trial, and a hospital ward ask which variables to adjust for, and why.
    takeaway: |-
      Seeing who got a treatment isn't the same as giving it. Draw the causal graph, adjust for common causes by comparing within groups and reweighting, and leave mediators and colliders alone.
  - id: causal-graphs-and-interventions.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.causal-graphs-and-interventions
    markdown: |-
      Association describes what varies together; intervention asks what a change would cause. Causal graphs make the assumptions behind that distinction explicit.
