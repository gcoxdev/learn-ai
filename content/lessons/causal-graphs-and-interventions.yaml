schema_version: 0.2-draft
lesson:
  id: causal-graphs-and-interventions
  version: 0.1.0-draft
  title: Ask what would change if an action changed the world
  state: draft
  summary: Causal inference distinguishes observed association from intervention effects; causal graphs express
    assumptions about confounding and information needed to estimate those effects.
  slot: M31.1
  category: learning
  minutes: 12
  sources:
  - title: 'Causal Inference: What If — authors’ book'
    url: https://miguelhernan.org/whatifbook
  - title: 'Causal inference in statistics: An overview'
    url: https://ftp.cs.ucla.edu/pub/stat_ser/r350.pdf
objectives:
- id: objective.causal-graphs-and-interventions
  version: 1-draft
  statement: Causal inference distinguishes observed association from intervention effects; causal graphs express
    assumptions about confounding and information needed to estimate those effects.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - causal-graphs-and-interventions.base
  - causal-graphs-and-interventions.transfer
  prerequisites:
  - anyOf:
    - objective.bayes-rule
  - anyOf:
    - objective.controlled-experiments
scenes:
- id: causal-graphs-and-interventions.s1
  title: Association is a pattern in observations
  type: explanation
  depth: intuition
  objective_refs:
  - objective.causal-graphs-and-interventions
  markdown: Ice-cream sales and swimming incidents may rise together because warm weather affects both. Observing
    high sales does not imply that reducing ice-cream purchases would reduce incidents. A common cause can produce
    a predictive relationship without a direct causal link between the measured variables.
  text_mode: Ice-cream sales and swimming incidents may rise together because warm weather affects both. Observing
    high sales does not imply that reducing ice-cream purchases would reduce incidents. A common cause can produce
    a predictive relationship without a direct causal link between the measured variables.
  bridges: []
- id: causal-graphs-and-interventions.s2
  title: Draw assumptions with arrows
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.causal-graphs-and-interventions
  markdown: A causal directed graph can draw weather pointing to sales and incidents. Arrows represent hypothesized
    causal relationships, not merely correlations inferred from a plot. The graph helps identify paths that create
    confounding and which variables might need adjustment under justified assumptions.
  text_mode: A causal directed graph can draw weather pointing to sales and incidents. Arrows represent hypothesized
    causal relationships, not merely correlations inferred from a plot. The graph helps identify paths that create
    confounding and which variables might need adjustment under justified assumptions.
  bridges: []
- id: causal-graphs-and-interventions.s3
  title: Intervene rather than condition
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.causal-graphs-and-interventions
  markdown: Conditioning on X=x describes people or situations where X happened to equal x. Intervening to set X=x
    changes the mechanism assigning X in the causal model. Randomized assignment can make treatment independent
    of prior confounders under the experiment’s design, supporting stronger effect identification.
  text_mode: Conditioning on X=x describes people or situations where X happened to equal x. Intervening to set
    X=x changes the mechanism assigning X in the causal model. Randomized assignment can make treatment independent
    of prior confounders under the experiment’s design, supporting stronger effect identification.
  bridges: []
- id: causal-graphs-and-interventions.s4
  title: Adjust with a valid reason
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.causal-graphs-and-interventions
  markdown: 'Controlling for every available variable is not automatically correct: mediators and colliders can
    change or bias the target estimate. Specify the causal question, graph assumptions, measurement, and overlap.
    Observational effect estimates require assumptions that the dataset alone may not prove.'
  text_mode: 'Controlling for every available variable is not automatically correct: mediators and colliders can
    change or bias the target estimate. Specify the causal question, graph assumptions, measurement, and overlap.
    Observational effect estimates require assumptions that the dataset alone may not prove.'
  bridges: []
- id: causal-graphs-and-interventions.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.causal-graphs-and-interventions
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: causal-graphs-and-interventions.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.causal-graphs-and-interventions
  markdown: Causal inference distinguishes observed association from intervention effects; causal graphs express
    assumptions about confounding and information needed to estimate those effects.
  text_mode: Causal inference distinguishes observed association from intervention effects; causal graphs express
    assumptions about confounding and information needed to estimate those effects.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - causal-graphs-and-interventions.s1
    - causal-graphs-and-interventions.s2
    - causal-graphs-and-interventions.s3
    - causal-graphs-and-interventions.s4
    - causal-graphs-and-interventions.check
    - causal-graphs-and-interventions.recap
    gate_refs:
    - gate.core
assessment_families:
- id: causal-graphs-and-interventions.base
  objective_ref: objective.causal-graphs-and-interventions
  task: base
  response_type: single_choice
  points: 1
  hint: 'Draw assumptions with arrows: trace the inputs, operation, and result before choosing.'
  remediation_scene: causal-graphs-and-interventions.s2
  variants:
  - id: causal-graphs-and-interventions.base.1
    prompt: Warm weather increases sales and incidents. What role can weather play?
    options:
    - id: a
      text: A common cause or confounder
    - id: b
      text: Proof that sales directly cause incidents
    - id: c
      text: An irrelevant label always
    answer: a
    feedback: A shared cause can generate association.
  - id: causal-graphs-and-interventions.base.2
    prompt: Is observing X=x identical to intervening to set X=x?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if X is numeric
    - id: a
      text: 'No'
    answer: a
    feedback: Observation and intervention use different assignment mechanisms.
- id: causal-graphs-and-interventions.transfer
  objective_ref: objective.causal-graphs-and-interventions
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Adjust with a valid reason: trace the inputs, operation, and result before choosing.'
  remediation_scene: causal-graphs-and-interventions.s4
  variants:
  - id: causal-graphs-and-interventions.transfer.1
    prompt: Should every available variable automatically be controlled for?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only in large datasets
    - id: a
      text: 'No'
    answer: a
    feedback: Adjustment depends on causal structure and the estimand.
  - id: causal-graphs-and-interventions.transfer.2
    prompt: What does a causal graph’s arrow represent?
    options:
    - id: c
      text: Only visual similarity
    - id: a
      text: An assumed causal relationship
    - id: b
      text: A guaranteed relationship proved by drawing it
    answer: a
    feedback: The graph encodes assumptions to reason about effects.
