assessment_families:
  - id: swarm-optimization.base
    objective_ref: objective.swarm-optimization
    task: base
    response_type: single_choice
    points: 1
    hint: 'Interpret the competing pulls: trace the inputs, operation, and result before choosing.'
    remediation_scene: swarm-optimization.s2
    variants:
      - id: swarm-optimization.base.1
        prompt: What can a particle use besides the group’s best position?
        options:
          - id: c
            text: The final test answer necessarily
          - id: a
            text: Its own best position and current velocity
          - id: b
            text: Only a fixed class label
        answer: a
        feedback: The update combines individual memory and social information.
        retired: true
      - id: swarm-optimization.base.2
        prompt: Why can strong social attraction reduce diversity?
        options:
          - id: a
            text: Particles may converge on the same region
          - id: b
            text: It forces every particle to explore independently
          - id: c
            text: It removes all communication
        answer: a
        feedback: Shared attraction can concentrate the population.
        retired: true
  - id: swarm-optimization.transfer
    objective_ref: objective.swarm-optimization
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate against simpler search: trace the inputs, operation, and result before choosing.'
    remediation_scene: swarm-optimization.s4
    variants:
      - id: swarm-optimization.transfer.1
        prompt: What does pheromone evaporation reduce?
        options:
          - id: a
            text: The influence of older accumulated traces
          - id: b
            text: The number of graph nodes automatically
          - id: c
            text: Every valid path
        answer: a
        feedback: Decay allows later evidence to matter.
        retired: true
      - id: swarm-optimization.transfer.2
        prompt: Does a biological analogy establish algorithm quality?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if the name is familiar
          - id: a
            text: No; matched experiments are needed
        answer: a
        feedback: The actual update rule and evidence determine usefulness.
        retired: true
  - id: swarm-optimization.base.v2
    objective_ref: objective.swarm-optimization
    task: base
    response_type: single_choice
    points: 1
    hint: Split the velocity into its three terms. Inertia keeps the old direction, c1 pulls toward the particle's own best, and c2 pulls toward the swarm's best.
    remediation_scene: swarm-optimization.s2
    variants:
      - id: swarm-optimization.base.v2.1
        prompt: A PSO user sets c₂ (the pull toward the global best) much larger than c₁ and w. What behavior should they expect?
        options:
          - id: b
            text: Particles wander independently and rarely share what they find
          - id: a
            text: The swarm gathers quickly around one spot and may miss a better one
          - id: c
            text: Particles speed up every step until they leave the search area
        answer: a
        feedback: A strong social pull drags everyone to the current global best, which speeds convergence and raises the risk of settling on a weaker peak. Independent wandering comes from a strong c₁ and weak c₂; runaway speed comes from inertia above 1.
      - id: swarm-optimization.base.v2.2
        prompt: A particle sits exactly at both its personal best and the global best, with velocity (2, 0) and w = 0.5. What happens on the next step?
        options:
          - id: c
            text: It stays still, since both pulls are zero and nothing moves it
          - id: a
            text: It moves by (1, 0), coasting on inertia past the best spot
          - id: b
            text: It moves by (2, 0) again, since velocity carries over unchanged
        answer: a
        feedback: Both attraction terms are zero, so only w·v = 0.5 × (2, 0) = (1, 0) remains. Inertia keeps it exploring near the best spot. Velocity doesn't carry over unchanged unless w = 1.
      - id: swarm-optimization.base.v2.3
        prompt: In ant colony optimization, what would happen if pheromone never evaporated?
        options:
          - id: a
            text: Early decent routes would keep piling up pheromone and crowd out exploration
          - id: b
            text: Ants would choose edges uniformly, since old and new trails would balance out
          - id: c
            text: Route lengths would stop mattering, since deposits ignore how long a route is
        answer: a
        feedback: Evaporation is the forgetting step. Without it, whichever routes got reinforced first keep growing their lead, and the colony stops trying alternatives. Deposits still depend on route length (Q/L), and choices stay biased, not uniform.
      - id: swarm-optimization.base.v2.4
        prompt: Why does the PSO update multiply each pull by fresh random numbers r₁ and r₂?
        options:
          - id: b
            text: To keep the velocity small enough that particles never overshoot
          - id: c
            text: To make each run give identical results when repeated with a seed
          - id: a
            text: To vary how strongly each pull acts, so particles don't all move alike
        answer: a
        feedback: Random weights on the pulls spread particles around the line between their bests, which keeps some variety in the swarm. Overshooting still happens (it's useful), and seeds are about reproducibility, not about why the randomness is there.
  - id: swarm-optimization.transfer.v2
    objective_ref: objective.swarm-optimization
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask whether the problem is a point in continuous space (PSO) or a path built step by step (ACO), and whether the comparison was fair on budget and seeds.
    remediation_scene: swarm-optimization.s4
    variants:
      - id: swarm-optimization.transfer.v2.1
        prompt: A paper reports that its new "firefly swarm" beats PSO on one benchmark, using one seed and giving the firefly method four times as many function evaluations. What is the most important fix?
        options:
          - id: a
            text: Rerun both methods with equal evaluations over several seeds
          - id: b
            text: Tune PSO's inertia weight until it matches the firefly result
          - id: c
            text: Add more biological detail to the firefly analogy in the paper
        answer: a
        feedback: A fair comparison gives each method the same evaluation budget and reports results over several seeds, including the worst runs. Tuning only one side is another unfair comparison, and the analogy says nothing about performance.
      - id: swarm-optimization.transfer.v2.2
        prompt: A logistics firm needs good routes through 40 depots each night. Which swarm method matches the problem's structure?
        options:
          - id: c
            text: PSO, with each particle's position holding 40 real numbers
          - id: a
            text: Ant colony optimization, since ants build routes edge by edge
          - id: b
            text: PSO with a larger inertia weight, so particles explore routes
        answer: a
        feedback: A route is a sequence built step by step, which is what ACO's ants construct, guided by pheromone and distance. PSO moves points in continuous space; turning 40 real numbers into a valid route needs an extra decoding trick.
      - id: swarm-optimization.transfer.v2.3
        prompt: An engineer tunes an antenna's 5 continuous dimensions with PSO. Across 10 seeds, 3 runs converge on a clearly worse design. Which change most directly targets that failure?
        options:
          - id: b
            text: Raise c₂ so particles reach the global best faster
          - id: c
            text: Lower w so particles slow down and settle sooner
          - id: a
            text: Raise w or use more particles to keep the swarm exploring
        answer: a
        feedback: Settling on a worse design is premature convergence. More inertia or more particles keeps the swarm spread out longer. Raising c₂ or lowering w makes the swarm converge even faster.
      - id: swarm-optimization.transfer.v2.4
        prompt: Each evaluation of a car-aerodynamics design takes 6 hours of simulation, and the team can afford about 40. Why is a 30-particle swarm a poor fit?
        options:
          - id: a
            text: The budget runs out partway through the swarm's first move
          - id: b
            text: PSO needs gradients, which a simulation cannot provide
          - id: c
            text: Swarms only work in two dimensions, like the drone example
        answer: a
        feedback: Thirty particles use 30 evaluations just to start, leaving 10, a third of one move, far too few for the swarm to converge. PSO needs no gradients and works in many dimensions; the problem is budget. Expensive evaluations call for a method that plans each one carefully.
  - id: swarm-optimization.calculate
    objective_ref: objective.swarm-optimization
    task: base
    response_type: numeric
    points: 1
    hint: Compute each term separately, w·v, c1·r1·(pbest − x), c2·r2·(gbest − x), and add. For pheromone, multiply by (1 − ρ) first, then add the deposits.
    remediation_scene: swarm-optimization.s2
    absolute_tolerance: 0.01
    variants:
      - id: swarm-optimization.calculate.1
        prompt: A 1-D particle is at x = 2 with velocity 1. Its personal best is 4 and the global best is 6. With w = 0.5, c₁ = c₂ = 1, r₁ = 0.5, and r₂ = 0.25, what is its new velocity?
        answer: 2.5
        feedback: 0.5 × 1 + 1 × 0.5 × (4 − 2) + 1 × 0.25 × (6 − 2) = 0.5 + 1 + 1 = 2.5.
      - id: swarm-optimization.calculate.2
        prompt: A 1-D particle is at x = 0 with velocity −2. Its personal best is 1 and the global best is 3. With w = 0.7, c₁ = c₂ = 1.5, r₁ = 0.2, and r₂ = 0.4, where is the particle after the update?
        answer: 0.7
        feedback: "v = 0.7 × (−2) + 1.5 × 0.2 × 1 + 1.5 × 0.4 × 3 = −1.4 + 0.3 + 1.8 = 0.7, and x = 0 + 0.7 = 0.7."
      - id: swarm-optimization.calculate.3
        prompt: A particle at x = 10 has velocity 4, and both its personal best and the global best are at 10. With w = 0.6, what is its new velocity?
        answer: 2.4
        feedback: Both pulls are zero because the bests equal the position, so only inertia remains, 0.6 × 4 = 2.4.
      - id: swarm-optimization.calculate.4
        prompt: An ACO edge has pheromone 8. The evaporation rate is ρ = 0.25, and two ants used the edge with route lengths 5 and 10, with Q = 10. What is its new pheromone level?
        answer: 9
        feedback: Evaporation gives 0.75 × 8 = 6. The deposits are 10/5 + 10/10 = 2 + 1 = 3, so the level becomes 9.
      - id: swarm-optimization.calculate.5
        prompt: An ACO edge starts with pheromone 5, ρ = 0.2, and no ant uses it for three rounds. What is its pheromone level afterward?
        answer: 2.56
        feedback: Each round multiplies by 0.8, so 5 × 0.8³ = 5 × 0.512 = 2.56.
