schema_version: 0.2-draft
lesson:
  id: swarm-optimization
  version: 0.4.0-draft
  title: Coordinate simple searchers through shared signals
  state: draft
  summary: Eight drones hunt for the strongest radio signal, each pulled by its own best find and the swarm's. Work one update by hand, then catch the swarm settling for the wrong transmitter.
  slot: M32.3
  category: learning
  sources:
    - title: Particle swarm optimization (Kennedy & Eberhart, 1995)
      url: https://doi.org/10.1109/ICNN.1995.488968
    - title: A modified particle swarm optimizer (Shi & Eberhart, 1998), which introduced the inertia weight
      url: https://doi.org/10.1109/ICEC.1998.699146
    - title: "The particle swarm: explosion, stability, and convergence in a multidimensional complex space (Clerc & Kennedy, 2002)"
      url: https://doi.org/10.1109/4235.985692
    - title: "Ant Colony System: a cooperative learning approach to the traveling salesman problem (Dorigo & Gambardella, 1997)"
      url: https://doi.org/10.1109/4235.585892
    - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
      url: https://aima.cs.berkeley.edu/
objectives:
  - id: objective.swarm-optimization
    version: 2-draft
    statement: Particle-swarm and ant-colony methods use distributed candidate behavior and accumulated signals to search; parameter choices, diversity, and constraints determine convergence and usefulness.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - swarm-optimization.base.v2
      - swarm-optimization.transfer.v2
      - swarm-optimization.calculate
    prerequisites:
      - anyOf:
          - objective.evolutionary-search
scenes:
  - id: swarm-optimization.s1
    title: Eight drones, one strongest signal
    type: explanation
    depth: intuition
    objective_refs:
      - objective.swarm-optimization
    markdown: |-
      Eight drones search a 10 × 10 km field for a lost radio beacon. Each can measure signal strength where it hovers, and they can radio each other. How should each one decide where to fly next?

      In 1995 James Kennedy, a social psychologist, and Russell Eberhart, an electrical engineer, answered a question like this while simulating a flock of birds looking for food. Their method, **particle swarm optimization (PSO)**, treats each searcher as a particle with a position and a velocity. Every step, a particle's new velocity mixes three pulls:

      - **Inertia**: keep going roughly the way you were going.
      - **Memory**: head back toward your own best spot so far, your **personal best**.
      - **Group**: head toward the best spot anyone in the swarm has found, the **global best**.

      Unlike a genetic algorithm, nothing is born or dies. The same eight particles fly for the whole search, and what spreads through the swarm is information about good spots.
    diagram:
      caption: One PSO step for one particle. Three pulls add up to the new velocity.
      description: The old velocity, scaled by the inertia weight w, the pull toward the particle's personal best, scaled by c1 times a random r1, and the pull toward the swarm's global best, scaled by c2 times a random r2, all feed into the new velocity. The new velocity moves the particle to a new position. The signal at the new position is measured and may update the personal and global bests. A dashed arrow from that update back to the pull toward the global best marks the start of the next step, when both pulls use the updated bests.
      nodes:
        - id: inertia
          label: Old velocity × w
          note: inertia
          col: 0
          row: 0
        - id: memory
          label: Pull to personal best
          note: c1 · r1 · (pbest − x)
          col: 0
          row: 1
          tone: data
        - id: social
          label: Pull to global best
          note: c2 · r2 · (gbest − x)
          col: 0
          row: 2
          tone: data
        - id: vel
          label: New velocity
          col: 2
          row: 1
          tone: accent
        - id: pos
          label: New position
          note: x + v
          col: 3
          row: 1
        - id: bests
          label: Measure and update bests
          col: 3
          row: 2
          tone: warn
      edges:
        - from: inertia
          to: vel
        - from: memory
          to: vel
        - from: social
          to: vel
        - from: vel
          to: pos
        - from: pos
          to: bests
          label: read the signal
        - from: bests
          to: social
          label: next step
          dashed: true
          bend: 1
  - id: swarm-optimization.s2
    title: One particle, one update, by hand
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.swarm-optimization
    markdown: |-
      Drone 4 hovers at $x = (0, 0)$ with velocity $v = (1, -1)$. Its own best reading was at $(1, 1)$; the swarm's best was at $(3, 2)$. Use inertia weight $w = 0.7$ and $c_1 = c_2 = 1.5$. The random draws for this step are $r_1 = 0.4$ and $r_2 = 0.5$ (the same in both coordinates, to keep the arithmetic short).

      | Term | East (x) | North (y) |
      | --- | ---: | ---: |
      | Inertia: $0.7 \times v$ | 0.7 | −0.7 |
      | Memory: $1.5 \times 0.4 \times (1 - 0,\ 1 - 0)$ | 0.6 | 0.6 |
      | Social: $1.5 \times 0.5 \times (3 - 0,\ 2 - 0)$ | 2.25 | 1.5 |
      | **New velocity** | **3.55** | **1.4** |

      The drone moves to $(0, 0) + (3.55, 1.4) = (3.55, 1.4)$. Notice it overshoots the global best's east coordinate of 3. That's normal: overshooting lets particles sample the far side of a good spot, and inertia below 1 damps the swinging. The random draws matter too. Fresh values of $r_1$ and $r_2$ each step change how hard each pull acts, so two drones with the same bests still fly different paths and the swarm doesn't march in lockstep.

      :::papers The PSO update (with inertia weight)
      $$v_i \leftarrow w\,v_i + c_1 r_1 \odot (p_i - x_i) + c_2 r_2 \odot (g - x_i), \qquad x_i \leftarrow x_i + v_i$$

      $p_i$ is particle $i$'s personal best, $g$ the global best, and $r_1, r_2$ fresh uniform random numbers in $[0, 1]$, drawn separately for each coordinate ($\odot$ multiplies coordinate by coordinate). The 1995 paper had no $w$; Shi and Eberhart added it in 1998. A widely used setting from Clerc and Kennedy's 2002 stability analysis is $w \approx 0.729$, $c_1 = c_2 \approx 1.49$.
      :::

      :::predict Later, drone 4 sits exactly on both its personal best and the global best, with velocity (1, −1). What is its next velocity?
      Both pulls vanish, because $p_i - x_i = g - x_i = 0$. Only inertia remains: $(0.7, -0.7)$. The drone coasts past the best spot, the pulls then draw it back, and it swings around the spot in shrinking arcs, exploring nearby as it settles. With $w > 1$, it would speed up instead, and the swarm would fly apart.
      :::
  - id: swarm-optimization.run
    title: Run the swarm
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.swarm-optimization
    markdown: |-
      The field has two transmitters: the beacon at $(3, 2)$, with peak signal 10, and a weaker one at $(-2, -1)$, with peak 6. The swarm doesn't know either location.

      ```python run
      import numpy as np

      def signal(p):                        # two transmitters: strong at (3, 2), weak at (-2, -1)
          x, y = p[..., 0], p[..., 1]
          return 10 * np.exp(-((x - 3)**2 + (y - 2)**2) / 4) + 6 * np.exp(-((x + 2)**2 + (y + 1)**2) / 2)

      rng = np.random.default_rng(0)
      N, w, c1, c2 = 8, 0.7, 1.5, 1.5
      x = rng.uniform(-5, 5, (N, 2))        # 8 drones scattered over a 10 x 10 field
      v = np.zeros((N, 2))
      pbest, pscore = x.copy(), signal(x)
      g = pbest[pscore.argmax()]            # the swarm's best spot so far

      for step in range(1, 31):
          r1, r2 = rng.random((N, 2)), rng.random((N, 2))
          v = w * v + c1 * r1 * (pbest - x) + c2 * r2 * (g - x)
          x = x + v
          s = signal(x)
          better = s > pscore
          pbest[better], pscore[better] = x[better], s[better]
          g = pbest[pscore.argmax()]
          if step in (1, 5, 10, 20, 30):
              print(f"step {step:2}: best spot ({g[0]:5.2f}, {g[1]:5.2f})  signal {pscore.max():5.2f}  "
                    f"swarm spread {x.std(axis=0).mean():5.2f}")
      ```

      The best reading climbs from 7.29 to 10.00 at $(3.00, 2.00)$, and the "swarm spread" (how scattered the drones are) shrinks from 1.77 at step 5 to 0.22: the swarm has gathered on the beacon.

      Now change the seed from 0 to 1. The swarm gathers just as neatly, on the *weak* transmitter, with signal 6.00. From the start, a drone near $(-2, -1)$ held the global best, and the swarm's pull drew everyone there before anyone sampled the beacon. It's premature convergence again, the same failure as a GA whose population collapses.
  - id: swarm-optimization.s3
    title: Ants leave trails that fade
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.swarm-optimization
    markdown: |-
      Some problems are paths, not points: a delivery route or a tour of cities. **Ant colony optimization (ACO)**, introduced by Marco Dorigo in the early 1990s, borrows from real ants, which lay pheromone on paths to food; shorter paths get walked more often and so collect more.

      Each artificial ant builds a route step by step. At each junction it picks an edge with probability proportional to $\tau^\alpha \eta^\beta$, where $\tau$ is the edge's pheromone level and $\eta$ is a local hint such as 1/length. After a round, all pheromone **evaporates** by a fraction $\rho$, then each ant deposits $Q/L$ on the edges it used, where $L$ is its route length:

      $$\tau \leftarrow (1 - \rho)\,\tau + \sum_{\text{ants}} Q / L$$

      With $\rho = 0.2$, an edge at $\tau = 5$ falls to 4. If one ant with a route of length 10 used it and $Q = 10$, it gains 1 and ends at 5. An edge nobody used falls from 5 to 4, then 3.2, then 2.56.

      Evaporation is ACO's forgetting mechanism. Without it, the first decent route would pile up pheromone forever, and the colony would stop exploring.
  - id: swarm-optimization.s4
    title: Test it against simpler search
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.swarm-optimization
    markdown: |-
      Is the swarm worth it? Give every method the same budget, 248 signal readings (8 drones × 31 positions), and run each with 10 seeds. Random search simply reads 248 random spots.

      ```python run
      import numpy as np

      def signal(p):
          x, y = p[..., 0], p[..., 1]
          return 10 * np.exp(-((x - 3)**2 + (y - 2)**2) / 4) + 6 * np.exp(-((x + 2)**2 + (y + 1)**2) / 2)

      def pso(seed, w, N=8, steps=30, c1=1.5, c2=1.5):     # 8 + 8*30 = 248 signal readings
          rng = np.random.default_rng(seed)
          x = rng.uniform(-5, 5, (N, 2)); v = np.zeros((N, 2))
          pbest, pscore = x.copy(), signal(x)
          for _ in range(steps):
              g = pbest[pscore.argmax()]
              r1, r2 = rng.random((N, 2)), rng.random((N, 2))
              v = w * v + c1 * r1 * (pbest - x) + c2 * r2 * (g - x)
              x = x + v
              s = signal(x); better = s > pscore
              pbest[better], pscore[better] = x[better], s[better]
          return pscore.max()

      def random_search(seed, n=248):
          return signal(np.random.default_rng(seed).uniform(-5, 5, (n, 2))).max()

      for name, run in [("PSO, w = 0.7", lambda s: pso(s, 0.7)),
                        ("PSO, w = 0.9", lambda s: pso(s, 0.9)),
                        ("random search", random_search)]:
          best = np.array([run(seed) for seed in range(10)])
          print(f"{name:14} median {np.median(best):.3f}  worst {best.min():.3f}  "
                f"found strong transmitter in {(best > 8).sum()}/10 runs")
      ```

      | Method | Median best | Worst run | Found the beacon |
      | --- | ---: | ---: | ---: |
      | PSO, $w = 0.7$ | 10.000 | 6.002 | 8 of 10 |
      | PSO, $w = 0.9$ | 9.968 | 9.912 | 10 of 10 |
      | Random search | 9.779 | 9.141 | 10 of 10 |

      The tightly converging swarm is the most precise when it works, and the only method that sometimes fails outright. More inertia trades a little precision for reliability. Random search never zooms in, but in two dimensions it never gets trapped either.

      :::mixup "It's modeled on birds and ants, so it must be a clever optimizer."
      The analogy explains where the rule came from, not how well it works. Judge a swarm the way you'd judge any optimizer: same number of evaluations, several seeds, the worst run as well as the median, and a simple baseline like random search.
      :::
  - id: swarm-optimization.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.swarm-optimization
    markdown: Compute PSO velocity updates and pheromone levels by hand, then diagnose swarms tuning antennas, routing trucks, and settling too early.
    takeaway: |-
      Each particle's velocity mixes inertia, a pull to its own best, and a pull to the swarm's best; ants reinforce short paths and let old trails evaporate. Compare either with random search on the same budget and several seeds.
  - id: swarm-optimization.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.swarm-optimization
    markdown: |-
      Particle swarms share promising positions; ant-colony methods update scores for constructing paths. Both need variation, feasibility checks, and comparisons with simpler search methods.
navigation:
