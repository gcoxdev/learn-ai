schema_version: 0.2-draft
lesson:
  id: swarm-optimization
  version: 0.1.0-draft
  title: Coordinate simple searchers through shared signals
  state: draft
  summary: Particle-swarm and ant-colony methods use distributed candidate behavior and accumulated signals to search;
    parameter choices, diversity, and constraints determine convergence and usefulness.
  slot: M32.3
  category: learning
  minutes: 12
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
  - title: Particle swarm optimization — original paper
    url: https://doi.org/10.1109/ICNN.1995.488968
  - title: Ant Colony System
    url: https://doi.org/10.1109/4235.585892
objectives:
- id: objective.swarm-optimization
  version: 1-draft
  statement: Particle-swarm and ant-colony methods use distributed candidate behavior and accumulated signals to
    search; parameter choices, diversity, and constraints determine convergence and usefulness.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - swarm-optimization.base
  - swarm-optimization.transfer
  prerequisites:
  - anyOf:
    - objective.evolutionary-search
scenes:
- id: swarm-optimization.s1
  title: Move a population through a search space
  type: explanation
  depth: intuition
  objective_refs:
  - objective.swarm-optimization
  markdown: Particle swarm optimization maintains candidate positions and velocities. A particle’s next movement
    can combine inertia, attraction to its own best-known position, and attraction to a neighborhood or global best.
    Random factors preserve variation under the chosen update rule.
  text_mode: Particle swarm optimization maintains candidate positions and velocities. A particle’s next movement
    can combine inertia, attraction to its own best-known position, and attraction to a neighborhood or global best.
    Random factors preserve variation under the chosen update rule.
  bridges: []
- id: swarm-optimization.s2
  title: Interpret the competing pulls
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.swarm-optimization
  markdown: If a particle is at zero, its own best is two, and the group best is four, both attraction terms point
    right in a one-dimensional illustration. A large step can overshoot; bounds and velocity handling matter. Social
    sharing can accelerate progress or pull everyone into one poor region.
  text_mode: If a particle is at zero, its own best is two, and the group best is four, both attraction terms point
    right in a one-dimensional illustration. A large step can overshoot; bounds and velocity handling matter. Social
    sharing can accelerate progress or pull everyone into one poor region.
  bridges: []
- id: swarm-optimization.s3
  title: Build paths through accumulated traces
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.swarm-optimization
  markdown: Ant-colony optimization constructs solutions using heuristic information and pheromone-like scores updated
    from solution quality. Evaporation reduces old influence, helping prevent permanent commitment to early choices.
    In routing tasks, the encoded graph and feasibility rules determine valid constructed paths.
  text_mode: Ant-colony optimization constructs solutions using heuristic information and pheromone-like scores
    updated from solution quality. Evaporation reduces old influence, helping prevent permanent commitment to early
    choices. In routing tasks, the encoded graph and feasibility rules determine valid constructed paths.
  bridges: []
- id: swarm-optimization.s4
  title: Evaluate against simpler search
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.swarm-optimization
  markdown: Measure solution quality across seeds, function evaluations, constraints, and runtime. Nature-inspired
    terminology is an analogy for an algorithmic rule, not evidence of superiority. Compare random search, local
    search, and task-specific methods under the same budget and stopping criteria.
  text_mode: Measure solution quality across seeds, function evaluations, constraints, and runtime. Nature-inspired
    terminology is an analogy for an algorithmic rule, not evidence of superiority. Compare random search, local
    search, and task-specific methods under the same budget and stopping criteria.
  bridges: []
- id: swarm-optimization.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.swarm-optimization
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: swarm-optimization.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.swarm-optimization
  markdown: Particle-swarm and ant-colony methods use distributed candidate behavior and accumulated signals to
    search; parameter choices, diversity, and constraints determine convergence and usefulness.
  text_mode: Particle-swarm and ant-colony methods use distributed candidate behavior and accumulated signals to
    search; parameter choices, diversity, and constraints determine convergence and usefulness.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - swarm-optimization.s1
    - swarm-optimization.s2
    - swarm-optimization.s3
