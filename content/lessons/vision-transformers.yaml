schema_version: 0.2-draft
lesson:
  id: vision-transformers
  version: 0.1.0-draft
  title: Treat image patches as a sequence of representations
  state: draft
  summary: Vision transformers embed image patches and use attention to mix their information; patch size, positional
    information, and training choices determine cost and spatial detail.
  slot: M12.5
  category: learning
  minutes: 12
  sources:
  - title: An Image is Worth 16x16 Words
    url: https://arxiv.org/abs/2010.11929
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.vision-transformers
  version: 1-draft
  statement: Vision transformers embed image patches and use attention to mix their information; patch size, positional
    information, and training choices determine cost and spatial detail.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - vision-transformers.base
  - vision-transformers.transfer
  prerequisites:
  - anyOf:
    - objective.attention
  - anyOf:
    - objective.neural-forward-pass
  - anyOf:
    - objective.image-geometry
scenes:
- id: vision-transformers.s1
  title: Split an image into patches
  type: explanation
  depth: intuition
  objective_refs:
  - objective.vision-transformers
  markdown: An image can be divided into fixed-size patches. Flatten each patch’s channel values and project them
    into a learned vector. These patch vectors become inputs to transformer blocks. A patch is a chosen unit of
    representation, not necessarily one semantic object.
  text_mode: An image can be divided into fixed-size patches. Flatten each patch’s channel values and project them
    into a learned vector. These patch vectors become inputs to transformer blocks. A patch is a chosen unit of
    representation, not necessarily one semantic object.
  bridges: []
- id: vision-transformers.s2
  title: Count the sequence length
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vision-transformers
  markdown: A 32 × 32 image split into nonoverlapping 8 × 8 patches yields 4 × 4 = 16 patch tokens, excluding any
    special token. Halving patch width and height gives 64 patch tokens. Standard dense attention then has sixteen
    times as many position pairs, because token count increased fourfold.
  text_mode: A 32 × 32 image split into nonoverlapping 8 × 8 patches yields 4 × 4 = 16 patch tokens, excluding any
    special token. Halving patch width and height gives 64 patch tokens. Standard dense attention then has sixteen
    times as many position pairs, because token count increased fourfold.
  bridges:
  - matrices-tensors
- id: vision-transformers.s3
  title: Provide location and combine context
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vision-transformers
  markdown: Positional information helps distinguish where patches occur. Attention mixes representations across
    permitted positions, followed by other block operations such as feed-forward transformations and normalization.
    A classification token or pooled features can feed an image-level head. Dense tasks need suitable spatial outputs
    or decoders.
  text_mode: Positional information helps distinguish where patches occur. Attention mixes representations across
    permitted positions, followed by other block operations such as feed-forward transformations and normalization.
    A classification token or pooled features can feed an image-level head. Dense tasks need suitable spatial outputs
    or decoders.
  bridges: []
- id: vision-transformers.s4
  title: Compare assumptions and training conditions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vision-transformers
  markdown: Patch attention and convolution encode different structural preferences. Relative performance depends
    on data, pretraining, augmentation, architecture, and compute. Smaller patches preserve detail but increase
    sequence cost. Do not attribute a benchmark gain to attention alone when the training setup also changed.
  text_mode: Patch attention and convolution encode different structural preferences. Relative performance depends
    on data, pretraining, augmentation, architecture, and compute. Smaller patches preserve detail but increase
    sequence cost. Do not attribute a benchmark gain to attention alone when the training setup also changed.
  bridges: []
- id: vision-transformers.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.vision-transformers
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: vision-transformers.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.vision-transformers
  markdown: Vision transformers embed image patches and use attention to mix their information; patch size, positional
    information, and training choices determine cost and spatial detail.
  text_mode: Vision transformers embed image patches and use attention to mix their information; patch size, positional
    information, and training choices determine cost and spatial detail.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - vision-transformers.s1
    - vision-transformers.s2
    - vision-transformers.s3
    - vision-transformers.s4
    - vision-transformers.check
    - vision-transformers.recap
    gate_refs:
    - gate.core
assessment_families:
- id: vision-transformers.base
  objective_ref: objective.vision-transformers
  task: base
  response_type: single_choice
  points: 1
  hint: 'Count the sequence length: trace the inputs, operation, and result before choosing.'
  remediation_scene: vision-transformers.s2
  variants:
  - id: vision-transformers.base.1
    prompt: A 24 × 24 image split into 6 × 6 patches produces how many patches?
    options:
    - id: a
      text: '16'
    - id: b
      text: '4'
    - id: c
      text: '36'
    answer: a
    feedback: There are four patches along each axis, giving sixteen total.
  - id: vision-transformers.base.2
    prompt: Does one patch necessarily correspond to one object?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only in an RGB image
    - id: a
      text: 'No'
    answer: a
    feedback: Patch boundaries are a representation choice and can cut through objects.
- id: vision-transformers.transfer
  objective_ref: objective.vision-transformers
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Compare assumptions and training conditions: trace the inputs, operation, and result before choosing.'
  remediation_scene: vision-transformers.s4
  variants:
  - id: vision-transformers.transfer.1
    prompt: Token count doubles under dense attention. How does the number of token pairs scale?
    options:
    - id: b
      text: It doubles
    - id: c
      text: It stays constant
    - id: a
      text: It quadruples
    answer: a
    feedback: Pair count is proportional to sequence length squared.
  - id: vision-transformers.transfer.2
    prompt: A vision transformer outperforms a CNN after much larger pretraining. What must a comparison acknowledge?
    options:
    - id: c
      text: Data size never affects vision models
    - id: a
      text: Architecture and training data changed together
    - id: b
      text: Only attention caused the result
    answer: a
    feedback: Training conditions confound an architecture-only conclusion.
