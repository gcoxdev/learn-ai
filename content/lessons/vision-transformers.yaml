schema_version: 0.2-draft
lesson:
  id: vision-transformers
  version: 0.3.0-draft
  title: Treat image patches as a sequence of representations
  state: draft
  summary: Turn small image patches into tokens and calculate how patch size changes the work of attention.
  slot: M12.5
  category: learning
  sources:
  - title: An Image is Worth 16x16 Words
    url: https://arxiv.org/abs/2010.11929
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.vision-transformers
  version: 1-draft
  statement: Vision transformers embed image patches and use attention to mix their information; patch size,
    positional information, and training choices determine cost and spatial detail.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - vision-transformers.base
  - vision-transformers.transfer
  prerequisites:
  - anyOf:
    - objective.attention
  - anyOf:
    - objective.neural-forward-pass
  - anyOf:
    - objective.image-geometry
scenes:
- id: vision-transformers.s1
  title: Turn a patch into a token
  type: explanation
  depth: intuition
  objective_refs:
  - objective.vision-transformers
  markdown: 'Divide an image into small patches. An 8-by-8 RGB patch contains 8 × 8 × 3 = 192 values. **Flattening**
    places these values in an ordered list. A learned **projection** multiplies that list by weights to produce
    a feature vector of a chosen length.


    That vector is a **patch token**, one input to the transformer. It need not represent a whole object: the
    patch may include part of a cat and part of its background. The model must learn useful relationships among
    these pieces.'
  text_mode: 'Divide an image into small patches. An 8-by-8 RGB patch contains 8 × 8 × 3 = 192 values. **Flattening**
    places these values in an ordered list. A learned **projection** multiplies that list by weights to produce
    a feature vector of a chosen length.


    That vector is a **patch token**, one input to the transformer. It need not represent a whole object: the
    patch may include part of a cat and part of its background. The model must learn useful relationships among
    these pieces.'
  bridges: []
- id: vision-transformers.s2
  title: Count the sequence length
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vision-transformers
  markdown: 'A 32 × 32 image split into nonoverlapping 8 × 8 patches yields 4 × 4 = 16 patch tokens, excluding
    any special token. Halving patch width and height gives 64 patch tokens. Standard dense attention then
    has sixteen times as many position pairs, because token count increased fourfold.


    With 16 tokens, a full attention head considers 16 × 16 = 256 query–key position pairs. With 64, it considers
    4,096, sixteen times as many. This is pair-count growth, not a promise that total runtime grows by exactly
    sixteen: other operations and hardware matter too.'
  text_mode: 'A 32 × 32 image split into nonoverlapping 8 × 8 patches yields 4 × 4 = 16 patch tokens, excluding
    any special token. Halving patch width and height gives 64 patch tokens. Standard dense attention then
    has sixteen times as many position pairs, because token count increased fourfold.


    With 16 tokens, a full attention head considers 16 × 16 = 256 query–key position pairs. With 64, it considers
    4,096, sixteen times as many. This is pair-count growth, not a promise that total runtime grows by exactly
    sixteen: other operations and hardware matter too.'
  bridges:
  - matrices-tensors
- id: vision-transformers.s3
  title: Provide location and combine context
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vision-transformers
  markdown: 'Positional information helps distinguish where patches occur. Attention mixes representations
    across permitted positions, followed by other block operations such as feed-forward transformations and
    normalization. A classification token or pooled features can feed an image-level head. Dense tasks need
    suitable spatial outputs or decoders.


    **Attention** lets one position mix information from other positions using learned comparison scores. **Positional
    information** supplies location cues that a plain unordered collection of patches lacks. A **head** for
    classification is the final task-specific output calculation, distinct from an attention head inside the
    transformer.'
  text_mode: 'Positional information helps distinguish where patches occur. Attention mixes representations
    across permitted positions, followed by other block operations such as feed-forward transformations and
    normalization. A classification token or pooled features can feed an image-level head. Dense tasks need
    suitable spatial outputs or decoders.


    **Attention** lets one position mix information from other positions using learned comparison scores. **Positional
    information** supplies location cues that a plain unordered collection of patches lacks. A **head** for
    classification is the final task-specific output calculation, distinct from an attention head inside the
    transformer.'
  bridges: []
- id: vision-transformers.s4
  title: Compare assumptions and training conditions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vision-transformers
  markdown: Patch attention and convolution encode different structural preferences. Relative performance depends
    on data, pretraining, augmentation, architecture, and compute. Smaller patches preserve detail but increase
    sequence cost. Do not attribute a benchmark gain to attention alone when the training setup also changed.
  text_mode: Patch attention and convolution encode different structural preferences. Relative performance
    depends on data, pretraining, augmentation, architecture, and compute. Smaller patches preserve detail
    but increase sequence cost. Do not attribute a benchmark gain to attention alone when the training setup
    also changed.
  bridges: []
- id: vision-transformers.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.vision-transformers
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A vision transformer works with representations of image patches. Smaller patches retain finer
    detail but create more tokens and more work for dense attention.
