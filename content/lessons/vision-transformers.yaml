assessment_families:
- id: vision-transformers.base
  objective_ref: objective.vision-transformers
  task: base
  response_type: single_choice
  points: 1
  hint: 'Count the sequence length: trace the inputs, operation, and result before choosing.'
  remediation_scene: vision-transformers.s2
  variants:
  - id: vision-transformers.base.1
    prompt: A 24 × 24 image split into 6 × 6 patches produces how many patches?
    options:
    - id: a
      text: '16'
    - id: b
      text: '4'
    - id: c
      text: '36'
    answer: a
    feedback: There are four patches along each axis, giving sixteen total.
  - id: vision-transformers.base.2
    prompt: Does one patch necessarily correspond to one object?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only in an RGB image
    - id: a
      text: 'No'
    answer: a
    feedback: Patch boundaries are a representation choice and can cut through objects.
- id: vision-transformers.transfer
  objective_ref: objective.vision-transformers
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Compare assumptions and training conditions: trace the inputs, operation, and result before choosing.'
  remediation_scene: vision-transformers.s4
  variants:
  - id: vision-transformers.transfer.1
    prompt: Token count doubles under dense attention. How does the number of token pairs scale?
    options:
    - id: b
      text: It doubles
    - id: c
      text: It stays constant
    - id: a
      text: It quadruples
    answer: a
    feedback: Pair count is proportional to sequence length squared.
  - id: vision-transformers.transfer.2
    prompt: A vision transformer outperforms a CNN after much larger pretraining. What must a comparison acknowledge?
    options:
    - id: c
      text: Data size never affects vision models
    - id: a
      text: Architecture and training data changed together
    - id: b
      text: Only attention caused the result
    answer: a
    feedback: Training conditions confound an architecture-only conclusion.
