schema_version: 0.2-draft
lesson:
  id: robot-sensors-and-frames
  version: 0.3.0-draft
  title: Connect measurements and actions to a physical body
  state: draft
  summary: Give a robot’s measurements a location, a time, and the right units.
  slot: M30.1
  category: learning
  sources:
  - title: Modern Robotics — authors’ textbook and resources
    url: https://modernrobotics.northwestern.edu/nu-gm-book-resource/
objectives:
- id: objective.robot-sensors-and-frames
  version: 1-draft
  statement: Robots combine sensors, actuators, and coordinate frames; units, calibration, timing, and body
    geometry determine how measurements become meaningful actions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - robot-sensors-and-frames.base
  - robot-sensors-and-frames.transfer
  prerequisites:
  - anyOf:
    - objective.geometry-and-symmetry
scenes:
- id: robot-sensors-and-frames.s1
  title: A body constrains action
  type: explanation
  depth: intuition
  objective_refs:
  - objective.robot-sensors-and-frames
  markdown: 'A robot''s **sensors** measure properties such as light, distance, acceleration, force, or joint
    position. A **joint position** is the angle or displacement of a movable connection.


    Its **actuators** create motion or force. They have limits on speed, travel, and **torque**, the turning
    effect of a force about an axis.


    **Embodiment** means the system acts through this particular body in physical surroundings. Its possible
    actions depend on that body''s shape, sensors, and mechanical limits.'
  text_mode: 'A robot''s **sensors** measure properties such as light, distance, acceleration, force, or joint
    position. A **joint position** is the angle or displacement of a movable connection.


    Its **actuators** create motion or force. They have limits on speed, travel, and **torque**, the turning
    effect of a force about an axis.


    **Embodiment** means the system acts through this particular body in physical surroundings. Its possible
    actions depend on that body''s shape, sensors, and mechanical limits.'
  bridges: []
- id: robot-sensors-and-frames.s2
  title: Name the coordinate frame
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.robot-sensors-and-frames
  markdown: 'A point described relative to a camera has different coordinates relative to a robot base or room.
    A rigid transform combines rotation and translation to convert between frames. Units and axis conventions
    matter: confusing meters with millimeters can turn a valid numeric command into a dangerous physical displacement.'
  text_mode: 'A point described relative to a camera has different coordinates relative to a robot base or
    room. A rigid transform combines rotation and translation to convert between frames. Units and axis conventions
    matter: confusing meters with millimeters can turn a valid numeric command into a dangerous physical displacement.'
  bridges:
  - geometry-and-symmetry
- id: robot-sensors-and-frames.s3
  title: Trace a simple translation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.robot-sensors-and-frames
  markdown: If a camera origin is one meter to the right of the robot origin with aligned axes, an object two
    meters right of the camera lies three meters right of the robot. Rotated axes require rotation as well
    as translation. State the direction of the transform explicitly.
  text_mode: If a camera origin is one meter to the right of the robot origin with aligned axes, an object
    two meters right of the camera lies three meters right of the robot. Rotated axes require rotation as well
    as translation. State the direction of the transform explicitly.
  bridges: []
- id: robot-sensors-and-frames.s4
  title: Calibrate and synchronize
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.robot-sensors-and-frames
  markdown: 'Sensor bias, lens distortion, mounting offsets, and timestamp differences create systematic errors.
    A moving robot fusing an old camera frame with a new joint reading can infer the wrong geometry. Calibration
    and timing checks are prerequisites for reliable higher-level perception and control.


    Calibration estimates how a sensor’s readings relate to known measurements. If a stationary distance sensor
    reads 1.02 meters for a reference at 1.00 meter, it has a 0.02-meter error in that test; several distances
    are needed to check whether one offset explains the problem.'
  text_mode: 'Sensor bias, lens distortion, mounting offsets, and timestamp differences create systematic errors.
    A moving robot fusing an old camera frame with a new joint reading can infer the wrong geometry. Calibration
    and timing checks are prerequisites for reliable higher-level perception and control.


    Calibration estimates how a sensor’s readings relate to known measurements. If a stationary distance sensor
    reads 1.02 meters for a reference at 1.00 meter, it has a 0.02-meter error in that test; several distances
    are needed to check whether one offset explains the problem.'
  bridges: []
- id: robot-sensors-and-frames.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.robot-sensors-and-frames
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A robot needs measurements with the right units, coordinate frames, and timestamps. Calibration
    connects sensor readings to the physical quantities they describe.
