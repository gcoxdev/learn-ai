schema_version: 0.2-draft
lesson:
  id: robot-sensors-and-frames
  version: 0.4.0-draft
  title: Connect measurements and actions to a physical body
  state: draft
  summary: A robot's camera sees a mug, and its gripper closes on empty air 0.07 ft away. Learn the frames, transforms, and timing that make "where" mean the same thing everywhere.
  slot: M30.1
  category: learning
  sources:
    - title: Modern Robotics — authors’ textbook and resources
      url: https://modernrobotics.northwestern.edu/nu-gm-book-resource/
    - title: "REP 103: Standard Units of Measure and Coordinate Conventions (ROS)"
      url: https://www.ros.org/reps/rep-0103.html
    - title: "REP 105: Coordinate Frames for Mobile Platforms (ROS)"
      url: https://www.ros.org/reps/rep-0105.html
objectives:
  - id: objective.robot-sensors-and-frames
    version: 3-draft
    statement: Explain what a robot's common sensors measure, convert a point between coordinate frames with a rotation and translation, chain transforms in the right order, and spot unit, calibration, and timing errors.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - robot-sensors-and-frames.base.v2
      - robot-sensors-and-frames.transfer.v2
      - robot-sensors-and-frames.calculate
    prerequisites:
      - anyOf:
          - objective.geometry-and-symmetry
scenes:
  - id: robot-sensors-and-frames.s1
    title: Meet Tidy, and everything it can feel
    type: explanation
    depth: intuition
    objective_refs:
      - objective.robot-sensors-and-frames
    markdown: |-
      Meet Tidy, the robot we'll follow through this module. It clears kitchen tables: a wheeled base drives up, an arm reaches out, and a gripper moves mugs into the dishwasher rack. Tidy's camera spots a mug, the arm reaches, and the gripper closes on empty air 0.07 ft away. Nothing was broken: two numbers simply meant different things to different parts of the robot.

      First, what can Tidy measure? Its **sensors** are devices that turn a physical quantity into a number:

      | Sensor | What it measures | Typical weakness |
      | --- | --- | --- |
      | Wheel encoder | How far each wheel has turned | Wheels slip, so distance drifts |
      | Joint encoder | Each **joint position**: the angle of one arm joint | Says nothing about the mug |
      | IMU (inertial measurement unit) | Acceleration and turning rate | Small biases add up over time |
      | Lidar | Distances to surfaces, by timing laser pulses | Glass and shiny steel confuse it |
      | Camera (color or depth) | An image; depth cameras add distance per pixel | Glare and lens distortion |
      | Wrist force sensor | Push and twist at the gripper | Drifts with temperature |

      Tidy moves through **actuators**: its wheel and joint motors. Each has limits on speed, travel, and **torque**, the turning effect of a force about an axis. That's **embodiment**: a robot acts through one particular body, whose sensors and limits decide what it can perceive and do.
    bridges: []
  - id: robot-sensors-and-frames.s2
    title: Every number lives in a frame
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.robot-sensors-and-frames
    markdown: |-
      Tidy's head camera reports the mug at $(0.5, 0.2)$ ft. Half a foot from *what*? A **coordinate frame** answers that: an origin plus a set of axes. The camera measures from its lens, the arm plans from the base's center, and the kitchen map uses a corner of the room.

      The usual robotics convention (used in ROS, the Robot Operating System): $x$ points forward, $y$ points left, and $z$ points up, with distances in meters and angles in radians. Our worked examples use feet; convert to the units the robot expects at the interface. A **pose** is a position plus an orientation: where a frame's origin sits and which way its axes point.

      The mug has a correct address in every frame. The bug is handing a camera-frame address to code expecting a base-frame one.

      :::story A spacecraft lost to a unit
      In September 1999, NASA's Mars Climate Orbiter came too close to Mars and was lost. One team's ground software reported thruster impulse in pound-force seconds; the navigation software that used those numbers expected newton-seconds, a factor of about 4.45 apart. Every number was right; the units just weren't written on the interface.
      :::
    bridges:
      - geometry-and-symmetry
  - id: robot-sensors-and-frames.s3
    title: Rotate first, then shift
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.robot-sensors-and-frames
    markdown: |-
      Tidy's head camera sits 0.3 ft ahead of the base center and 0.1 ft to its left, turned 90° left to watch the counter. It sees the mug at $(0.5, 0.2)$: 0.5 ft straight out from the lens, 0.2 ft to the lens's left. Where is the mug relative to the base?

      **Step 1: rotate.** Turn the point by the camera's angle, $\theta = 90°$, using $x' = x\cos\theta - y\sin\theta$ and $y' = x\sin\theta + y\cos\theta$. With $\cos 90° = 0$ and $\sin 90° = 1$:

      $$x' = 0.5 \times 0 - 0.2 \times 1 = -0.2, \qquad y' = 0.5 \times 1 + 0.2 \times 0 = 0.5$$

      **Step 2: shift.** Add where the camera sits: $(-0.2 + 0.3,\; 0.5 + 0.1) = (0.1, 0.6)$.

      The mug is 0.1 ft ahead of the base center and 0.6 ft to its left. That fits: the camera looks left, so "in front of the lens" means "further left".

      :::predict The camera is re-mounted, turned only 30° left, in the same spot. Same reading (0.5, 0.2). Where is the mug now?
      With $\cos 30° \approx 0.866$ and $\sin 30° = 0.5$: $x' = 0.433 - 0.1 = 0.333$ and $y' = 0.25 + 0.173 = 0.423$. Adding $(0.3, 0.1)$ gives about $(0.633, 0.523)$: now mostly ahead of the base.
      :::

      :::papers The homogeneous transform
      Engineers pack the rotation and the shift into one 3 × 3 matrix by giving each point a third coordinate, 1:

      $$\begin{bmatrix} x_B \\ y_B \\ 1 \end{bmatrix} = \underbrace{\begin{bmatrix} \cos\theta & -\sin\theta & t_x \\ \sin\theta & \cos\theta & t_y \\ 0 & 0 & 1 \end{bmatrix}}_{T_{BC}} \begin{bmatrix} x_C \\ y_C \\ 1 \end{bmatrix}$$

      $T_{BC}$ is the camera's pose in the base frame; it takes camera coordinates ($C$) to base coordinates ($B$). Here $\theta = 90°$ and $(t_x, t_y) = (0.3, 0.1)$. In 3-D it becomes a 4 × 4 matrix with a 3 × 3 rotation inside. To go from base to camera, use the inverse $T_{CB} = T_{BC}^{-1}$.
      :::

      ```python run
      import numpy as np

      def T(theta_deg, tx, ty):
          """Homogeneous transform: rotate by theta, then shift by (tx, ty)."""
          c, s = np.cos(np.radians(theta_deg)), np.sin(np.radians(theta_deg))
          return np.array([[c, -s, tx],
                           [s,  c, ty],
                           [0,  0,  1]])

      # Head camera: 0.3 ft ahead and 0.1 ft left of the base, turned 90° left
      T_base_cam = T(90, 0.3, 0.1)
      mug_cam = np.array([0.5, 0.2, 1])        # (x, y, 1) in the camera frame

      mug_base = T_base_cam @ mug_cam
      print("mug in base frame:", mug_base[:2].round(3))

      # Going back: the inverse maps base coordinates into the camera frame
      print("back to camera:   ", (np.linalg.inv(T_base_cam) @ mug_base)[:2].round(3))
      ```

      Change the 90 to 30 and check the prediction above. Then try −90: the same reading now lands on Tidy's right.
    bridges: []
  - id: robot-sensors-and-frames.chain
    title: "Chain the frames: camera to gripper to base"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.robot-sensors-and-frames
    markdown: |-
      For the final approach Tidy uses a wrist camera, which moves with the gripper. Now two transforms stand between camera and base:

      - $T_{GC}$, the camera's pose in the gripper frame. The camera is bolted on, so calibration measures this once: 0.05 ft ahead, not rotated.
      - $T_{BG}$, the gripper's pose in the base frame. It changes whenever the arm moves, so the robot computes it from the joint encoders. Right now: at $(0.6, 0.2)$, turned 90° left.

      The wrist camera sees the mug 0.15 ft straight ahead, $p_C = (0.15, 0)$. Work right to left:

      1. Camera → gripper: no rotation, add 0.05 → $p_G = (0.20, 0)$.
      2. Gripper → base: rotate 90° → $(0, 0.20)$, then add $(0.6, 0.2)$ → $p_B = (0.6, 0.4)$.

      As one product, $p_B = T_{BG}\,T_{GC}\,p_C$. Notice how the inner letters match, $B\underline{G}\,\underline{G}C$, and cancel to $BC$. That's the check engineers use to catch a chain in the wrong order.

      :::mixup "Matrix order doesn't matter much; both transforms get applied either way."
      Compute $T_{GC}\,T_{BG}\,p_C$ instead and you get $(0.65, 0.35)$, about 0.07 ft from the true $(0.6, 0.4)$: Tidy's miss from the first scene. Rotations and shifts don't commute, so the order changes the answer.
      :::

      ```python run
      import numpy as np

      def T(theta_deg, tx, ty):
          c, s = np.cos(np.radians(theta_deg)), np.sin(np.radians(theta_deg))
          return np.array([[c, -s, tx], [s, c, ty], [0, 0, 1]])

      T_base_grip = T(90, 0.6, 0.2)   # gripper pose in the base frame (from the joint encoders)
      T_grip_cam = T(0, 0.05, 0.0)    # wrist camera pose in the gripper frame (from calibration)
      mug_cam = np.array([0.15, 0.0, 1])

      T_base_cam = T_base_grip @ T_grip_cam          # inner letters match: base<-grip<-cam
      print("right order:", (T_base_cam @ mug_cam)[:2].round(3))
      print("wrong order:", (T_grip_cam @ T_base_grip @ mug_cam)[:2].round(3))
      ```

      Add one more link: if the base stands at $(2, 1)$ in the kitchen map, facing along the map's $x$-axis, try `T(0, 2, 1) @ T_base_cam @ mug_cam`.
    diagram:
      caption: "Tidy's frame chain. Each arrow is one transform; multiplying them carries the mug's address to the room."
      description: The mug is detected in the wrist camera's image, giving its position in the camera frame. The calibration transform T_GC carries it to the gripper frame. The transform T_BG, computed from the joint angles, carries it to the base frame. The transform T_WB, from localization, carries it to the kitchen's map frame.
      nodes:
        - id: mug
          label: Mug
          note: seen at (0.15, 0)
          col: 0
          row: 0
          tone: data
        - id: cam
          label: Wrist camera frame
          col: 1
          row: 0
        - id: grip
          label: Gripper frame
          col: 2
          row: 0
        - id: base
          label: Base frame
          note: where the arm plans
          col: 3
          row: 0
          tone: accent
        - id: world
          label: Kitchen map frame
          col: 4
          row: 0
          tone: muted
      edges:
        - from: mug
          to: cam
          label: detected in image
        - from: cam
          to: grip
          label: T_GC from calibration
        - from: grip
          to: base
          label: T_BG from joint angles
        - from: base
          to: world
          label: T_WB from localization
    bridges: []
  - id: robot-sensors-and-frames.s4
    title: Right frame, wrong moment
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.robot-sensors-and-frames
    markdown: |-
      With the chain in order, two quieter errors remain.

      **Calibration** measures how a sensor's readings relate to the truth, and where each sensor sits on the body. Tidy's distance sensor is tested against known targets:

      | True distance (ft) | 1.00 | 2.00 | 3.00 |
      | --- | ---: | ---: | ---: |
      | Reading (ft) | 1.02 | 2.04 | 3.06 |

      :::predict Is this a fixed offset (subtract 0.02 ft) or a scale error?
      A scale error. The error grows with distance, 0.02, 0.04, then 0.06 ft, so every reading is 2% too large: divide by 1.02. A fixed offset would read 1.02, 2.02, 3.02. One test distance can't tell the two apart; three can.
      :::

      **Timing** is the other trap. Every reading has a timestamp, the moment it describes. Tidy's camera image takes 100 ms to arrive while the base rolls at 0.4 ft/s. Combine that old image with the current joint angles and the mug lands $0.4 \times 0.1 = 0.04$ ft off. The fix is to use where the camera *was* when the image was taken, so robot software keeps a timestamped history of transforms.

      So when a robot misses, ask in order: right frame, right chain order, right units, right calibration, right moment?
    bridges: []
  - id: robot-sensors-and-frames.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.robot-sensors-and-frames
    markdown: Convert points between rotated frames by hand, then diagnose a drone, a forklift lidar, a drifting sensor, and a unit mix-up.
    takeaway: |-
      Every measurement belongs to a frame, a unit, and a moment. To move a point between frames, rotate then shift, and chain transforms so the inner letters match.
  - id: robot-sensors-and-frames.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.robot-sensors-and-frames
    markdown: |-
      A robot needs measurements with the right units, coordinate frames, and timestamps. Calibration connects sensor readings to the physical quantities they describe.
