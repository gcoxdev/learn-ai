assessment_families:
  - id: robot-sensors-and-frames.base
    objective_ref: objective.robot-sensors-and-frames
    task: base
    response_type: single_choice
    points: 1
    hint: 'Name the coordinate frame: trace the inputs, operation, and result before choosing.'
    remediation_scene: robot-sensors-and-frames.s2
    variants:
      - id: robot-sensors-and-frames.base.1
        prompt: Camera origin is 1 ft right of robot; object is 2 ft right of camera with aligned axes. Robot-relative position?
        options:
          - id: a
            text: 3 ft right
          - id: b
            text: 1 ft right
          - id: c
            text: 2 ft left
        answer: a
        feedback: Add translations under the stated aligned-frame convention.
        retired: true
      - id: robot-sensors-and-frames.base.2
        prompt: What does a rigid transform combine?
        options:
          - id: b
            text: Only a class label
          - id: c
            text: Only a reward score
          - id: a
            text: Rotation and translation
        answer: a
        feedback: It maps geometric coordinates between rigid frames.
        retired: true
  - id: robot-sensors-and-frames.transfer
    objective_ref: objective.robot-sensors-and-frames
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Calibrate and synchronize: trace the inputs, operation, and result before choosing.'
    remediation_scene: robot-sensors-and-frames.s4
    variants:
      - id: robot-sensors-and-frames.transfer.1
        prompt: Why do timestamps matter in sensor fusion?
        options:
          - id: b
            text: Only logs need ordering
          - id: c
            text: Time cannot affect geometry
          - id: a
            text: Measurements may describe different physical moments
        answer: a
        feedback: Motion makes unsynchronized observations inconsistent.
        retired: true
      - id: robot-sensors-and-frames.transfer.2
        prompt: Does a valid numeric command guarantee a valid physical action?
        options:
          - id: c
            text: Only if the model generated it
          - id: a
            text: No; units, frames, and actuator limits matter
          - id: b
            text: 'Yes'
        answer: a
        feedback: Physical meaning depends on the complete interface.
        retired: true
  - id: robot-sensors-and-frames.base.v2
    objective_ref: objective.robot-sensors-and-frames
    task: base
    response_type: single_choice
    points: 1
    hint: "Read the subscripts: T_BC takes camera (C) coordinates into base (B) coordinates. Rotate by the frame's angle first, then add its position."
    remediation_scene: robot-sensors-and-frames.s3
    variants:
      - id: robot-sensors-and-frames.base.v2.1
        prompt: A camera sits 0.3 ft ahead of a robot's base center, turned 90° to the left. It sees a cup 1 ft straight ahead of the lens. Where is the cup in the base frame?
        options:
          - id: b
            text: (1.3, 0), since the two forward distances add
          - id: c
            text: (0.3, −1.0), since turning left sends it to the right
          - id: a
            text: (0.3, 1.0), since the lens's forward is the base's left
        answer: a
        feedback: Rotating (1, 0) by 90° gives (0, 1); adding the camera's position (0.3, 0) gives (0.3, 1.0). Adding distances without rotating treats the camera as if it faced forward, and (0.3, −1.0) rotates the wrong way.
      - id: robot-sensors-and-frames.base.v2.2
        prompt: You know T_BC, the camera's pose in the base frame, and you have a target point in base coordinates. You need that point in camera coordinates. What should you apply?
        options:
          - id: c
            text: T_BC itself, since a transform works in both directions
          - id: a
            text: The inverse of T_BC, which maps base coordinates to camera ones
          - id: b
            text: T_BC with its shift negated but its rotation kept the same
        answer: a
        feedback: T_BC maps camera coordinates into the base frame; going the other way needs T_CB = T_BC⁻¹. Just negating the shift is a common half-fix, but the inverse also reverses the rotation and rotates the shift.
      - id: robot-sensors-and-frames.base.v2.3
        prompt: A wrist camera sees a screw at p_C. You know T_BG (gripper pose in the base frame) and T_GC (camera pose in the gripper frame). Which expression gives the screw in the base frame?
        options:
          - id: b
            text: T_GC · T_BG · p_C
          - id: c
            text: T_BG · p_C + T_GC · p_C
          - id: a
            text: T_BG · T_GC · p_C
        answer: a
        feedback: Work right to left, camera → gripper → base, and check that inner letters match (B G · G C). Reversing the order applies the gripper's rotation and shift before the camera offset, which misplaces the point; adding the two products isn't a transform at all.
      - id: robot-sensors-and-frames.base.v2.4
        prompt: Why do robot engineers write a 2-D point (x, y) as (x, y, 1) before applying a 3 × 3 transform?
        options:
          - id: a
            text: So one matrix product can do both the rotation and the shift
          - id: b
            text: So the extra entry can record that the units are feet
          - id: c
            text: So the extra entry can hold the sensor's confidence in the point
        answer: a
        feedback: The appended 1 multiplies the translation column, so a single matrix rotates and shifts, and chains of frames become chains of matrix products. Units and confidence are tracked separately; the 1 is purely a bookkeeping trick.
  - id: robot-sensors-and-frames.transfer.v2
    objective_ref: objective.robot-sensors-and-frames
    task: transfer
    response_type: single_choice
    points: 1
    hint: "Ask which fact about the measurement is wrong or missing: its frame, its units, its calibration, or the moment it describes."
    remediation_scene: robot-sensors-and-frames.s4
    variants:
      - id: robot-sensors-and-frames.transfer.v2.1
        prompt: A delivery drone flying at 5 ft/s combines a camera image taken 80 ms ago with its current GPS position. The landing pad consistently appears about 0.4 ft behind where it really is. What is the most likely cause?
        options:
          - id: b
            text: Lens distortion that bends the pad's image toward the edges
          - id: a
            text: The image shows where the drone was 80 ms earlier
          - id: c
            text: The GPS reports position in inches rather than in feet
        answer: a
        feedback: 5 ft/s × 0.08 s = 0.4 ft, exactly the offset, and it points along the direction of travel. That's a timing error, fixed by using the drone's pose at the image's timestamp. Distortion wouldn't track speed, and a inches/feet mix-up would scale everything by 12.
        retired: true
      - id: robot-sensors-and-frames.transfer.v2.2
        prompt: An ultrasonic sensor on a vacuum robot reads 0.53, 1.03, and 1.53 ft for walls at 0.50, 1.00, and 1.50 ft. How should the readings be corrected?
        options:
          - id: a
            text: Subtract 0.03 ft from every reading
          - id: c
            text: Divide every reading by 1.06
          - id: b
            text: Average several readings to cancel the noise
        answer: a
        feedback: The error is 0.03 ft at every distance, so it's a fixed offset. A scale error would grow with distance; dividing by 1.06 fits the first reading but overcorrects the far ones. Averaging removes random noise, not a consistent bias.
      - id: robot-sensors-and-frames.transfer.v2.3
        prompt: A forklift's lidar is mounted at the rear, 1 ft behind the base center, facing backward (turned 180°). It reports an obstacle 2 ft straight ahead of the lidar. Where is the obstacle relative to the base?
        options:
          - id: b
            text: 1 ft ahead of the base center
          - id: c
            text: 2 ft behind the base center
          - id: a
            text: 3 ft behind the base center
        answer: a
        feedback: Rotating (2, 0) by 180° gives (−2, 0); adding the lidar's position (−1, 0) gives (−3, 0), 3 ft behind. "1 ft ahead" forgets the rotation, and "2 ft behind" rotates but forgets the mounting offset.
      - id: robot-sensors-and-frames.transfer.v2.4
        prompt: A planning module outputs gripper targets in inches, such as 12. The arm's driver expects feet, and a test run commands a move to 12. Which fix addresses the cause?
        options:
          - id: c
            text: Lower the arm's speed limit so a bad target moves it slowly
          - id: b
            text: Collect more planning examples so it learns to give feet
          - id: a
            text: Label units at the interface and convert where the modules meet
        answer: a
        feedback: The numbers are right in their own units; the interface lost the units, as with the Mars Climate Orbiter. Converting at the boundary (and rejecting targets outside the workspace) fixes the cause. A speed limit only slows the crash, and retraining doesn't change which unit the driver expects.
      - id: robot-sensors-and-frames.transfer.v2.5
        prompt: A delivery drone flying forward at 5 ft/s combines a camera image taken 80 ms ago with its current GPS position. The landing pad consistently comes out about 0.4 ft further ahead, along its flight direction, than it really is. What is the most likely cause?
        options:
          - id: c
            text: The GPS reports position in inches rather than in feet
          - id: b
            text: Lens distortion that bends the pad's image toward the edges
          - id: a
            text: The image saw the pad from where the drone was 80 ms ago
        answer: a
        feedback: 5 ft/s × 0.08 s = 0.4 ft, exactly the offset, and it points along the flight direction because the pad's offset was measured from an older, earlier spot. That's a timing error, fixed by using the drone's pose at the image's timestamp. Distortion wouldn't track speed, and a inches/feet mix-up would scale everything by 12.
  - id: robot-sensors-and-frames.calculate
    objective_ref: objective.robot-sensors-and-frames
    task: base
    response_type: numeric
    points: 1
    hint: "Rotate first: x′ = x cos θ − y sin θ and y′ = x sin θ + y cos θ. Then add the position of the sensor's frame."
    remediation_scene: robot-sensors-and-frames.s3
    absolute_tolerance: 0.01
    variants:
      - id: robot-sensors-and-frames.calculate.1
        prompt: A camera is turned 90° left and sits at (0.2, 0) ft in the base frame. It sees a point at (0.3, 0.1) ft in its own frame. What is the point's x-coordinate in the base frame, in feet?
        answer: 0.1
        feedback: "Rotating by 90°: x′ = 0.3 × 0 − 0.1 × 1 = −0.1. Adding the camera's x position: −0.1 + 0.2 = 0.1 ft."
      - id: robot-sensors-and-frames.calculate.2
        prompt: A sensor is turned 180° and sits at (1.0, 0.5) ft in the base frame. It sees a point at (0.4, 0.2) ft in its own frame. What is the point's x-coordinate in the base frame, in feet?
        answer: 0.6
        feedback: "Rotating by 180° flips both signs: (−0.4, −0.2). Adding (1.0, 0.5) gives (0.6, 0.3), so x = 0.6 ft."
      - id: robot-sensors-and-frames.calculate.3
        prompt: A lidar at the base origin is turned 30° left. It sees a wall point 2 ft straight ahead, at (2, 0) in its own frame. What is the point's y-coordinate in the base frame, in feet?
        answer: 1
        feedback: "y′ = x sin 30° + y cos 30° = 2 × 0.5 + 0 = 1.0 ft. There's no shift to add, since the lidar sits at the origin."
      - id: robot-sensors-and-frames.calculate.4
        prompt: A camera is turned 60° left and sits at (0.5, 0) ft in the base frame. It sees a point at (1, 0) ft in its own frame. What is the point's x-coordinate in the base frame, in feet?
        answer: 1
        feedback: "x′ = 1 × cos 60° − 0 = 0.5. Adding the camera's x position: 0.5 + 0.5 = 1.0 ft."
      - id: robot-sensors-and-frames.calculate.5
        prompt: A side camera is turned 90° to the right (θ = −90°) and sits at (0, 0.2) ft in the base frame. It sees a point 0.5 ft straight ahead, at (0.5, 0) in its own frame. What is the point's y-coordinate in the base frame, in feet?
        answer: -0.3
        feedback: "y′ = 0.5 × sin(−90°) + 0 = −0.5. Adding the camera's y position: −0.5 + 0.2 = −0.3 ft, so the point is 0.3 ft to the robot's right."
