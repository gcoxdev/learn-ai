      gate_refs:
        - gate.core
  scene_aliases:
    multimodal-training-lifecycle.recap: multimodal-training-lifecycle.check
assessment_families:
  - id: multimodal-training-lifecycle.base
    objective_ref: objective.multimodal-training-lifecycle
    task: base
    response_type: single_choice
    points: 1
    hint: 'Specify updated components and losses: trace the inputs, operation, and result before choosing.'
    remediation_scene: multimodal-training-lifecycle.s2
    variants:
      - id: multimodal-training-lifecycle.base.1
        prompt: Does one chat interface imply one training objective?
        options:
          - id: c
            text: Only for multimodal systems
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Several stages and modalities can support one product interface.
        retired: true
      - id: multimodal-training-lifecycle.base.2
        prompt: What should be recorded when a projector trains but the vision encoder stays frozen?
        options:
          - id: a
            text: Which components update and which remain fixed
          - id: b
            text: Only the final response title
          - id: c
            text: That all weights changed equally
        answer: a
        feedback: Component-level state explains the adaptation.
        retired: true
  - id: multimodal-training-lifecycle.transfer
    objective_ref: objective.multimodal-training-lifecycle
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate stage gains and retention: trace the inputs, operation, and result before choosing.'
    remediation_scene: multimodal-training-lifecycle.s4
    variants:
      - id: multimodal-training-lifecycle.transfer.1
        prompt: Why check image overlap as well as caption overlap?
        options:
          - id: a
            text: The same visual test evidence can leak with different text
          - id: b
            text: Captions uniquely identify every image
          - id: c
            text: Only text can contaminate evaluation
        answer: a
        feedback: Leakage can occur through either modality.
        retired: true
      - id: multimodal-training-lifecycle.transfer.2
        prompt: A judge prefers a fluent but visually wrong answer. What is exposed?
        options:
          - id: b
            text: Proof that the image is wrong
          - id: c
            text: Guaranteed successful perception
          - id: a
            text: A mismatch between judging preference and grounding quality
        answer: a
        feedback: Evaluation needs direct checks of visual evidence.
        retired: true
  - id: multimodal-training-lifecycle.base.v2
    objective_ref: objective.multimodal-training-lifecycle
    task: base
    response_type: single_choice
    points: 1
    hint: For each stage, list three things - the data, the tokens the loss scores, and which weights are allowed to change.
    remediation_scene: multimodal-training-lifecycle.s2
    variants:
      - id: multimodal-training-lifecycle.base.v2.1
        prompt: In LLaVA's first stage, the vision encoder and language model are frozen and only the projector trains on captioned images. Why start this way?
        options:
          - id: b
            text: Frozen models skip the forward pass, so training runs much faster
          - id: a
            text: The small projector learns to map features without disturbing either model
          - id: c
            text: Captions are too short to train anything larger than a projector
        answer: a
        feedback: With about 21 million trainable weights, the bridge learns what visual features mean in the language model's terms while both pretrained models stay intact. Frozen models still run forward; only their weights don't update.
      - id: multimodal-training-lifecycle.base.v2.2
        prompt: A stage-2 training example has 576 image tokens, a 30-token question, and a 15-token answer. Under the usual loss mask, which positions contribute to the loss?
        options:
          - id: c
            text: All 621 positions, so the model also learns to predict the image
          - id: b
            text: The 45 question and answer tokens, since both are text
          - id: a
            text: Only the 15 answer tokens
        answer: a
        feedback: The loss scores the response, so the model learns to answer rather than to predict the question or the image. Scoring the question would train it to imitate users' questions.
      - id: multimodal-training-lifecycle.base.v2.3
        prompt: What does it mean that the vision encoder is frozen during stage 2?
        options:
          - id: a
            text: It still processes every image, but its weights don't change
          - id: b
            text: Its features are computed once and the image is then discarded
          - id: c
            text: It's removed, and the projector reads raw image patches instead
        answer: a
        feedback: Frozen components run in the forward pass as usual; gradients just don't update them. (Caching features in advance is a possible speed-up, but that's a separate choice, not what "frozen" means.)
      - id: multimodal-training-lifecycle.base.v2.4
        prompt: After stage 2 on visual data only, a VLM's answers to plain text questions get worse. Which change to stage 2 targets this most directly?
        options:
          - id: b
            text: Train stage 1 for longer before starting stage 2
          - id: c
            text: Unfreeze the vision encoder so it can share the load
          - id: a
            text: Mix text-only conversations into the stage-2 data
        answer: a
        feedback: This is catastrophic forgetting. Language skills fade when stage 2 stops practicing them. Stage 1 doesn't touch the language model, and the vision encoder has no role in text-only questions.
  - id: multimodal-training-lifecycle.transfer.v2
    objective_ref: objective.multimodal-training-lifecycle
    task: transfer
    response_type: single_choice
    points: 1
    hint: Match the symptom to the stage that caused it - a data mixture, a missing preference signal, or a judge that can't see the image.
    remediation_scene: multimodal-training-lifecycle.s5
    variants:
      - id: multimodal-training-lifecycle.transfer.v2.1
        prompt: A chart-reading VLM, trained heavily on a dataset with one-word answers, now replies "Yes." to "Explain this trend". What is the best fix?
        options:
          - id: c
            text: Freeze the language model so it keeps its original answer style
          - id: a
            text: Tag the short-answer examples with an instruction to answer briefly
          - id: b
            text: Remove the short-answer dataset and lose its visual skills too
        answer: a
        feedback: Tagging tells the model when brevity is wanted, so it keeps both the skill and its normal style, as LLaVA-1.5 did. Freezing the language model would block learning to use images at all, and removing the data throws away useful supervision.
        retired: true
      - id: multimodal-training-lifecycle.transfer.v2.2
        prompt: A radiology assistant's reward model reads only the answer text. After RLHF, reports get longer and mention findings that aren't in the scans. Why?
        options:
          - id: a
            text: The reward model can't check answers against the image, so fluent detail wins
          - id: b
            text: RLHF always makes answers longer, whether or not images are involved
          - id: c
            text: The vision encoder was frozen, so the model couldn't see the scans
        answer: a
        feedback: A text-only judge can't tell grounded from invented findings, so the policy learns that detail pays. Giving the reward model facts about the image is the Factually Augmented RLHF fix. A frozen encoder still sees the scans.
      - id: multimodal-training-lifecycle.transfer.v2.3
        prompt: A team reports that its new VLM scores 20 points higher on a photo-question benchmark. Later they find many test photos in the training set under different captions. What check would have caught this?
        options:
          - id: b
            text: Comparing the captions of test and training examples for exact matches
          - id: c
            text: Measuring accuracy on the benchmark again with a different random seed
          - id: a
            text: Searching for near-duplicate images between the test and training sets
        answer: a
        feedback: The leak came through the images, with new text around them, so only an image-level duplicate search finds it. Caption matching misses rewritten captions, and a new seed reruns the same leaked test.
      - id: multimodal-training-lifecycle.transfer.v2.4
        prompt: A recipe bot looks at a fridge photo and lists "milk, eggs, butter" when only eggs are visible. Which training data targets this most directly?
        options:
          - id: c
            text: More captioned photos of fridges for stage 1
          - id: b
            text: More text-only cooking conversations for stage 2
          - id: a
            text: Pairs preferring the eggs-only list over the padded list
        answer: a
        feedback: This is object hallucination from language habits, since fridges often hold milk and butter. Preference pairs directly teach "only what's visible" over the fluent, padded answer. More captions or text chats don't penalize invented items.
      - id: multimodal-training-lifecycle.transfer.v2.5
        prompt: A chart-reading VLM was fine-tuned on a mix that includes a large chart dataset with one-word answers. It now replies "Yes." to "Explain this trend." What is the best fix?
        options:
          - id: b
            text: Drop the one-word chart dataset from the stage-2 mixture
          - id: c
            text: Freeze the language model so it keeps its original answer style
          - id: a
            text: Tag the one-word examples with an instruction to answer briefly
        answer: a
        feedback: Tagging tells the model when brevity is wanted, so it keeps the chart skills and its normal style, as LLaVA-1.5 did. Dropping the dataset throws away the chart-reading practice it gave, and freezing the language model would stop it learning to use images at all.
  - id: multimodal-training-lifecycle.calculate
    objective_ref: objective.multimodal-training-lifecycle
    task: base
    response_type: numeric
    points: 1
    hint: Add up the weights that are allowed to change in this stage, divide by the total across all components, and multiply by 100.
    remediation_scene: multimodal-training-lifecycle.s2
    absolute_tolerance: 0.02
    variants:
      - id: multimodal-training-lifecycle.calculate.1
        prompt: A VLM has a 300M-parameter vision encoder, a 20M projector, and a 7,000M language model. Stage 1 trains only the projector. What percentage of all parameters is trained? Give two decimals.
        answer: 0.27
        feedback: The total is 300 + 20 + 7,000 = 7,320M, and 20 ÷ 7,320 = 0.00273, or 0.27%.
      - id: multimodal-training-lifecycle.calculate.2
        prompt: The same VLM (300M encoder, 20M projector, 7,000M language model) trains the projector and the language model in stage 2. What percentage is trained? Give two decimals.
        answer: 95.9
        feedback: 20 + 7,000 = 7,020M trainable out of 7,320M, and 7,020 ÷ 7,320 = 95.90%.
      - id: multimodal-training-lifecycle.calculate.3
        prompt: The same VLM (300M encoder, 20M projector, 7,000M language model) instead trains the projector plus 40M of LoRA adapters added to the frozen language model. Counting the adapters in the total, what percentage is trained? Give two decimals.
        answer: 0.82
        feedback: Trainable = 20 + 40 = 60M. Total = 7,320 + 40 = 7,360M. 60 ÷ 7,360 = 0.82%.
      - id: multimodal-training-lifecycle.calculate.4
        prompt: A larger VLM has a 400M vision encoder, a 10M projector, and a 13,000M language model. Stage 1 trains only the projector. What percentage is trained? Give two decimals.
        answer: 0.07
        feedback: The total is 13,410M, and 10 ÷ 13,410 = 0.00075, or 0.07%.
