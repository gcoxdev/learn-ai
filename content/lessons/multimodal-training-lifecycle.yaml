schema_version: 0.2-draft
lesson:
  id: multimodal-training-lifecycle
  version: 0.3.0-draft
  title: Train alignment, generation, and instruction behavior across modalities
  state: draft
  summary: Track what changes at each stage of training a multimodal assistant.
  slot: M23.5
  category: learning
  sources:
  - title: LLaVA
    url: https://arxiv.org/abs/2304.08485
  - title: The Llama 3 Herd of Models
    url: https://arxiv.org/abs/2407.21783
  - title: Flamingo
    url: https://arxiv.org/abs/2204.14198
objectives:
- id: objective.multimodal-training-lifecycle
  version: 1-draft
  statement: Multimodal training combines data pairing, modality objectives, interface adaptation, and instruction
    or preference stages; record frozen components, loss masks, and cross-modal evaluation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - multimodal-training-lifecycle.base
  - multimodal-training-lifecycle.transfer
  prerequisites:
  - anyOf:
    - objective.modality-tokenization
  - anyOf:
    - objective.posttraining-evaluation
scenes:
- id: multimodal-training-lifecycle.s1
  title: Inventory every training signal
  type: explanation
  depth: intuition
  objective_refs:
  - objective.multimodal-training-lifecycle
  markdown: Paired image-text data can train alignment, interleaved documents can train conditioned prediction,
    and visual instructions can train requested responses. Audio and video add timing and transcript issues.
    These data sources supervise different behaviors even when one final system exposes a single chat interface.
  text_mode: Paired image-text data can train alignment, interleaved documents can train conditioned prediction,
    and visual instructions can train requested responses. Audio and video add timing and transcript issues.
    These data sources supervise different behaviors even when one final system exposes a single chat interface.
  bridges: []
- id: multimodal-training-lifecycle.s2
  title: Specify updated components and losses
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multimodal-training-lifecycle
  markdown: 'A recipe may freeze a vision encoder, train a projector, then update a language model with selected
    multimodal examples. Another jointly trains encoders. For each stage, record loss targets, masking, mixture
    weights, and preprocessing so apparent model changes can be traced to their actual cause.


    For a toy question about a pictured apple, the image supplies evidence and the response “red” supplies
    a target. A loss mask can score the response token while skipping the question tokens. “Frozen” means a
    component’s weights stay fixed during that stage, even though it still performs computation. Training only
    the projector changes the connection; training the language model too changes how it uses that connection.
    Record both choices before comparing results.'
  text_mode: 'A recipe may freeze a vision encoder, train a projector, then update a language model with selected
    multimodal examples. Another jointly trains encoders. For each stage, record loss targets, masking, mixture
    weights, and preprocessing so apparent model changes can be traced to their actual cause.


    For a toy question about a pictured apple, the image supplies evidence and the response “red” supplies
    a target. A loss mask can score the response token while skipping the question tokens. “Frozen” means a
    component’s weights stay fixed during that stage, even though it still performs computation. Training only
    the projector changes the connection; training the language model too changes how it uses that connection.
    Record both choices before comparing results.'
  bridges: []
- id: multimodal-training-lifecycle.s3
  title: Curate cross-modal consistency
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multimodal-training-lifecycle
  markdown: A caption saying two objects when the image contains three provides conflicting supervision. Synthetic
    instructions may repeat a teacher’s visual mistakes. Check alignment, annotation specificity, consent/provenance
    records, and train-test overlap across both media and text; hashing only captions does not detect every
    leaked image.
  text_mode: A caption saying two objects when the image contains three provides conflicting supervision. Synthetic
    instructions may repeat a teacher’s visual mistakes. Check alignment, annotation specificity, consent/provenance
    records, and train-test overlap across both media and text; hashing only captions does not detect every
    leaked image.
  bridges: []
- id: multimodal-training-lifecycle.s4
  title: Evaluate stage gains and retention
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multimodal-training-lifecycle
  markdown: Measure text-only skills, visual grounding, audio quality, instruction following, and appropriate
    abstention after each relevant stage. Preference judges can favor eloquence over correct perception. Include
    examples where the requested information is absent so the system must recognize its evidence limits.
  text_mode: Measure text-only skills, visual grounding, audio quality, instruction following, and appropriate
    abstention after each relevant stage. Preference judges can favor eloquence over correct perception. Include
    examples where the requested information is absent so the system must recognize its evidence limits.
  bridges: []
- id: multimodal-training-lifecycle.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.multimodal-training-lifecycle
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: For each training stage, identify the data, the scored targets, and the components that change.
    Then test both new multimodal behavior and skills the system should retain.
- id: multimodal-training-lifecycle.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.multimodal-training-lifecycle
  markdown: For each training stage, identify the data, the scored targets, and the components that change.
    Then test both new multimodal behavior and skills the system should retain.
  text_mode: For each training stage, identify the data, the scored targets, and the components that change.
    Then test both new multimodal behavior and skills the system should retain.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - multimodal-training-lifecycle.s1
    - multimodal-training-lifecycle.s2
