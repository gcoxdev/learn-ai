    bridges: []
  - id: multimodal-training-lifecycle.s3
    title: The mixture decides what the model forgets
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multimodal-training-lifecycle
    markdown: |-
      Stage 2 updates billions of language-model weights on image conversations. Whatever the mixture leaves out can fade. Suppose Lumen's team runs stage 2 two ways and measures after each:

      | Stage-2 mixture | Photo questions | Text-only chat quality | Answer length on photo questions |
      | --- | ---: | ---: | --- |
      | 100% visual instructions | 71% | 58% (was 66% before stage 2) | often one word |
      | 85% visual + 15% text-only chats | 70% | 65% | full sentences |

      Two things went wrong in the first run. Text skills slipped: **catastrophic forgetting**, where training on new data overwrites what old data taught. And answers got terse, because much of the visual data came from academic question-answering sets with one-word answers. LLaVA-1.5 met the same issue. It tagged those examples with a short instruction ("Answer the question using a single word or phrase") so the model learned when to be brief, and it mixed in text-only conversations.

      :::mixup "Just add more visual data and the model can only get better."
      Every mixture is a trade. Skills you stop practicing fade, and a style repeated in thousands of examples becomes the default. Set the proportions on purpose and measure text-only skills after every stage.
      :::

      Quality matters as much as proportion. A caption saying "two dogs" over a photo of three teaches miscounting, and synthetic instructions repeat their generator's mistakes. Test photos can also leak into training under different captions, so check for duplicate *images*, not just duplicate text.
    bridges: []
  - id: multimodal-training-lifecycle.s5
    title: Teach it to prefer what's in the picture
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multimodal-training-lifecycle
    markdown: |-
      After stage 2, Lumen describes Amara's desk photo: "A laptop, a coffee mug, and a pair of glasses." There are no glasses; desks often have them, so the language model filled them in. This is **object hallucination**, and instruction tuning alone doesn't remove it. Long, detailed answers can even encourage it.

      The fix borrows the post-training module's tools. Build preference pairs for the same photo and question:

      - **Chosen:** "A laptop and a coffee mug."
      - **Rejected:** "A laptop, a coffee mug, and a pair of glasses."

      Then train with a reward model and RLHF, or directly with DPO (both from the post-training module). The trap: a reward model that can't check answers against the image rewards the more detailed, fluent one, and the policy learns to pad. LLaVA-RLHF (Sun et al., 2023) hit this *reward hacking* even with a vision-language reward model. Their fix, *Factually Augmented RLHF*, gives the reward model extra facts about the image, such as its human-written captions, while it scores.

      The same stage handles image-specific safety rules. Lumen should read a medicine label but not guess a stranger's name from their face, so for a face photo, "I can describe what the person is wearing" beats a guessed name.
    bridges: []
  - id: multimodal-training-lifecycle.s4
    title: Check each stage before starting the next
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multimodal-training-lifecycle
    markdown: |-
      Each stage can fix one thing and break another, so Lumen's team runs the same checks after every stage:

      | After stage | Captioning | Photo questions | Text-only chat | Hallucinated objects | Declines when the photo can't answer |
      | --- | ---: | ---: | ---: | ---: | ---: |
      | 1 (projector only) | fair | poor | unchanged | many | rarely |
      | 2 (instructions) | good | good | slightly lower | some | rarely |
      | 3 (preferences) | good | good | about the same | few | often |

      The last column needs photos where the answer isn't visible ("What's the expiry date?" with the date cropped off). A model that always answers confidently looks great on answerable questions and fails every one of these.

      When a number moves, the stage table tells you where to look: which data was added, which weights were unfrozen, which tokens were scored. For Amara, the last column matters most: a confidently wrong dose is worse than "I can't read that; try moving closer."
    bridges: []
  - id: multimodal-training-lifecycle.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.multimodal-training-lifecycle
    markdown: Parameter counts to work out, plus a chart reader, a medical-image assistant, and a recipe bot, test whether you can plan the stages and diagnose what each one changed.
    takeaway: |-
      Train the small projector first with both big models frozen, then unfreeze the language model for visual instructions, then tune preferences against hallucination. For each stage, know the data, the scored tokens, and the weights that change, and re-check text skills every time.
  - id: multimodal-training-lifecycle.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.multimodal-training-lifecycle
    markdown: |-
      For each training stage, identify the data, the scored targets, and the components that change. Then test both new multimodal behavior and skills the system should retain.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - multimodal-training-lifecycle.s1
        - multimodal-training-lifecycle.s2
        - multimodal-training-lifecycle.s3
        - multimodal-training-lifecycle.s5
        - multimodal-training-lifecycle.s4
