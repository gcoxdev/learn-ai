          tone: accent
        - id: inst
          label: Visual instructions
          note: 158K examples
          col: 0
          row: 1
          tone: data
        - id: s2
          label: "Stage 2: projector + language model"
          note: encoder still frozen
          col: 2
          row: 1
          tone: accent
        - id: s3
          label: "Stage 3: preferences, safety"
          note: grounded beats made-up
          col: 3
          row: 1
        - id: enc
          label: Vision encoder
          note: frozen throughout
          col: 1
          row: 2
          tone: muted
      edges:
        - from: caps
          to: s1
        - from: s1
