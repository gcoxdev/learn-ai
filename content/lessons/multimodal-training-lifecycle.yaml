schema_version: 0.2-draft
lesson:
  id: multimodal-training-lifecycle
  version: 0.4.0-draft
  title: Train alignment, generation, and instruction behavior across modalities
  state: draft
  summary: LLaVA's first stage trains just 0.3% of the model's weights, and it works. Walk through the stages that turn two separate models into one assistant.
  slot: M23.5
  category: learning
  sources:
    - title: "Visual Instruction Tuning (LLaVA; Liu, Li, Wu & Lee, 2023)"
      url: https://arxiv.org/abs/2304.08485
    - title: "Improved Baselines with Visual Instruction Tuning (LLaVA-1.5; Liu, Li, Li & Lee, 2023)"
      url: https://arxiv.org/abs/2310.03744
    - title: "Aligning Large Multimodal Models with Factually Augmented RLHF (LLaVA-RLHF; Sun et al., 2023)"
      url: https://arxiv.org/abs/2309.14525
    - title: "Flamingo: a Visual Language Model for Few-Shot Learning (Alayrac et al., 2022)"
      url: https://arxiv.org/abs/2204.14198
    - title: The Llama 3 Herd of Models
      url: https://arxiv.org/abs/2407.21783
objectives:
  - id: objective.multimodal-training-lifecycle
    version: 3-draft
    statement: Multimodal training combines data pairing, modality objectives, interface adaptation, and instruction or preference stages; record frozen components, loss masks, and cross-modal evaluation.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - multimodal-training-lifecycle.base.v2
      - multimodal-training-lifecycle.transfer.v2
      - multimodal-training-lifecycle.calculate
    prerequisites:
      - anyOf:
          - objective.modality-tokenization
      - anyOf:
          - objective.posttraining-evaluation
scenes:
  - id: multimodal-training-lifecycle.s1
    title: Four kinds of data, four different lessons
    type: explanation
    depth: intuition
    objective_refs:
      - objective.multimodal-training-lifecycle
    markdown: |-
      Lumen's team has two finished models: CLIP's vision encoder, which knows what things look like, and a 7-billion-parameter chat model, which knows how to talk. They want one assistant that answers Amara's questions about photos. Gluing the two together with an untrained projector gives nonsense, because the chat model has never seen visual tokens.

      Each kind of training data teaches a different lesson:

      | Data | Example | What it teaches |
      | --- | --- | --- |
      | Caption pairs | Photo + "a red mug on a desk" | What visual tokens mean, in the language model's terms |
      | Visual instructions | Photo + "What's written on the mug?" + a full answer | How to follow a request about an image |
      | Preference pairs | Photo + a grounded answer marked better than a made-up one | Which of two plausible answers to prefer |
      | Text-only chats | Ordinary conversations with no image | Keep the language skills the chat model already had |

      One chat window hides all of this. The training recipe is a sequence of **stages**, each with its own data, its own loss, and its own choice of which weights may change.
    bridges: []
  - id: multimodal-training-lifecycle.s2
    title: Freeze most, train the bridge, then open up
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multimodal-training-lifecycle
    markdown: |-
      LLaVA (Liu et al., 2023) set the pattern many open VLMs follow. A **frozen** component still runs in every forward pass; its weights just don't change.

      | Stage | Data | Vision encoder | Projector | Language model |
      | --- | --- | --- | --- | --- |
      | 1. Feature alignment | 595,000 captioned images | frozen | **trained** | frozen |
      | 2. Visual instruction tuning | 158,000 instruction examples | frozen | **trained** | **trained** |
      | 3. Preference or safety tuning (later work) | preference pairs | frozen | varies | **trained** |

      Stage 1 is cheap and safe. With both big models frozen, only the projector moves (about 21 million weights for LLaVA-1.5's two-layer version with a 7B model; the original LLaVA used a single linear layer), so nothing the big models know can be damaged. Stage 2 opens up the language model so it learns to *use* visual tokens in conversation. LLaVA's 158,000 instructions were written by a text-only GPT-4, given each COCO photo's captions and object boxes and asked to write conversations about them.

      ```python run
      params = {"vision encoder": 304e6, "projector": 21e6, "language model": 7.0e9}
      stages = {"1 align": ["projector"],
                "2 instruct": ["projector", "language model"]}
      total = sum(params.values())
      for stage, trained in stages.items():
          n = sum(params[p] for p in trained)
          print(f"stage {stage:<10} trains {n / 1e6:>6,.0f}M of {total / 1e6:,.0f}M ({n / total:.2%})")

      # One stage-2 example: 576 image tokens, a 25-token question, a 12-token answer.
      roles = ["image"] * 576 + ["question"] * 25 + ["answer"] * 12
      scored = [r == "answer" for r in roles]      # which positions count
      print("positions:", len(roles), "| scored by the loss:", sum(scored),
            f"({sum(scored) / len(roles):.1%})")
      ```

      With LLaVA-1.5-7B's sizes, stage 1 trains 0.29% of the weights and stage 2 trains 95.85%. The program's second part shows the **loss mask**: of 613 positions in one example, only the 12 answer tokens are scored. The model is trained to answer, not to predict the image or the question.

      :::papers The stage-2 objective
      $$\mathcal{L} = -\sum_{t \in \text{answer}} \log p_\theta\big(y_t \mid \text{image}, \text{question}, y_{<t}\big)$$

      This is supervised fine-tuning's next-token loss, summed over answer positions only: 12 terms here, not 613. $\theta$ is the trainable weights: the projector in stage 1, the projector plus the language model in stage 2.
      :::

      Try changing the answer from 12 tokens to 120. Longer answers carry more of the training signal, one reason detailed-description data shapes a model's style so strongly.
    diagram:
      caption: LLaVA-style training stages. The muted vision encoder stays frozen throughout.
      description: Captioned images (595K pairs) feed stage 1, which trains only the projector while the vision encoder and language model stay frozen. An arrow labeled "aligned projector" carries stage 1's result into stage 2. Visual instructions (158K examples) also feed stage 2, which trains the projector and the language model. A dashed arrow from the vision encoder, frozen throughout, also feeds stage 2. Stage 2 then leads to stage 3, preference and safety tuning, where grounded answers are preferred over made-up ones.
      nodes:
