schema_version: 0.2-draft
lesson:
  id: human-and-model-judges
  version: 0.1.0-draft
  title: Treat evaluators as fallible measurement instruments
  state: draft
  summary: Human and model judges require clear rubrics, blinded comparisons, disagreement analysis, and validation
    against task evidence; preference agreement does not establish universal correctness.
  slot: M28.3
  category: learning
  minutes: 12
  sources:
  - title: Judging LLM-as-a-Judge
    url: https://arxiv.org/abs/2306.05685
  - title: HELM
    url: https://arxiv.org/abs/2211.09110
objectives:
- id: objective.human-and-model-judges
  version: 1-draft
  statement: Human and model judges require clear rubrics, blinded comparisons, disagreement analysis, and validation
    against task evidence; preference agreement does not establish universal correctness.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - human-and-model-judges.base
  - human-and-model-judges.transfer
  prerequisites:
  - anyOf:
    - objective.benchmark-design-and-comparison
  - anyOf:
    - objective.preferences-and-reward-models
scenes:
- id: human-and-model-judges.s1
  title: Write a rubric that can be applied
  type: explanation
  depth: intuition
  objective_refs:
  - objective.human-and-model-judges
  markdown: Separate factual accuracy, instruction satisfaction, clarity, and other desired properties. Give concrete
    examples and rules for ties or insufficient evidence. A vague instruction to choose the better answer invites
    inconsistent interpretation across people or model judges.
  text_mode: Separate factual accuracy, instruction satisfaction, clarity, and other desired properties. Give concrete
    examples and rules for ties or insufficient evidence. A vague instruction to choose the better answer invites
    inconsistent interpretation across people or model judges.
  bridges: []
- id: human-and-model-judges.s2
  title: Control presentation bias
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.human-and-model-judges
  markdown: Randomize or swap answer order, hide irrelevant model identities, and examine length and formatting
    effects. A judge may prefer the first answer or a polished long response despite errors. Repeat comparisons
    where useful and retain the direction of order-sensitive changes.
  text_mode: Randomize or swap answer order, hide irrelevant model identities, and examine length and formatting
    effects. A judge may prefer the first answer or a polished long response despite errors. Repeat comparisons
    where useful and retain the direction of order-sensitive changes.
  bridges: []
- id: human-and-model-judges.s3
  title: Measure agreement and its limits
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.human-and-model-judges
  markdown: Agreement with expert labels on a validation sample supports use in that setting. It does not prove
    the judge is reliable on unseen domains, adversarial answers, or tasks requiring unavailable evidence. Human
    raters can also share biases or misunderstand the rubric.
  text_mode: Agreement with expert labels on a validation sample supports use in that setting. It does not prove
    the judge is reliable on unseen domains, adversarial answers, or tasks requiring unavailable evidence. Human
    raters can also share biases or misunderstand the rubric.
  bridges: []
- id: human-and-model-judges.s4
  title: Use direct checks when available
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.human-and-model-judges
  markdown: Executable tests, source verification, and mathematical checks can supplement subjective ratings. Inspect
    disagreements and high-confidence mistakes. A model should not gain authority to alter the rubric merely because
    the answer being judged contains instructions asking for a high score.
  text_mode: Executable tests, source verification, and mathematical checks can supplement subjective ratings. Inspect
    disagreements and high-confidence mistakes. A model should not gain authority to alter the rubric merely because
    the answer being judged contains instructions asking for a high score.
  bridges: []
- id: human-and-model-judges.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.human-and-model-judges
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Human and model judges require clear rubrics, blinded comparisons, disagreement analysis, and validation
    against task evidence; preference agreement does not establish universal correctness.
- id: human-and-model-judges.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.human-and-model-judges
  markdown: Human and model judges require clear rubrics, blinded comparisons, disagreement analysis, and validation
    against task evidence; preference agreement does not establish universal correctness.
  text_mode: Human and model judges require clear rubrics, blinded comparisons, disagreement analysis, and validation
    against task evidence; preference agreement does not establish universal correctness.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - human-and-model-judges.s1
    - human-and-model-judges.s2
    - human-and-model-judges.s3
    - human-and-model-judges.s4
    - human-and-model-judges.check
    gate_refs:
    - gate.core
  scene_aliases:
    human-and-model-judges.recap: human-and-model-judges.check
assessment_families:
- id: human-and-model-judges.base
  objective_ref: objective.human-and-model-judges
  task: base
  response_type: single_choice
  points: 1
  hint: 'Control presentation bias: trace the inputs, operation, and result before choosing.'
  remediation_scene: human-and-model-judges.s2
  variants:
  - id: human-and-model-judges.base.1
    prompt: Why swap response order in pairwise judging?
    options:
    - id: a
      text: To detect position bias
    - id: b
      text: To guarantee perfect correctness
    - id: c
      text: To retrain both candidate models
    answer: a
    feedback: Order can influence the evaluator.
  - id: human-and-model-judges.base.2
    prompt: Does high agreement on one validation set prove universal judge reliability?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if the judge is neural
    - id: a
      text: 'No'
    answer: a
    feedback: Generalization depends on domain and task coverage.
- id: human-and-model-judges.transfer
  objective_ref: objective.human-and-model-judges
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Use direct checks when available: trace the inputs, operation, and result before choosing.'
  remediation_scene: human-and-model-judges.s4
  variants:
  - id: human-and-model-judges.transfer.1
    prompt: A long polished answer contains a wrong fact. What should a rubric separate?
    options:
    - id: b
      text: Only token count and file size
    - id: c
      text: All qualities into one assumed truth
    - id: a
      text: Presentation quality and factual accuracy
    answer: a
    feedback: Fluency can mask errors.
  - id: human-and-model-judges.transfer.2
    prompt: Should text inside an answer redefine how it is scored?
    options:
    - id: c
      text: Only if it says “important”
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: The evaluated artifact does not control the evaluator’s instructions.
