schema_version: 0.2-draft
lesson:
  id: human-and-model-judges
  version: 0.2.1-draft
  title: Treat evaluators as fallible measurement instruments
  state: draft
  summary: Give a judge a clear rubric, then test whether swapping answer order or adding fancy wording changes
    the verdict.
  slot: M28.3
  category: learning
  sources:
  - title: Zheng et al. — Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena
    url: https://arxiv.org/abs/2306.05685
  - title: Liang et al. — Holistic Evaluation of Language Models
    url: https://arxiv.org/abs/2211.09110
  archetype: mechanism
objectives:
- id: objective.human-and-model-judges
  version: 2-draft
  statement: Design and audit a human/model judging procedure with explicit criteria, counterbalanced order, and
    separate correctness and style judgments.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - human-and-model-judges.base.v2
  - human-and-model-judges.transfer.v2
  prerequisites:
  - anyOf:
    - objective.benchmark-design-and-comparison
  - anyOf:
    - objective.data-and-examples
scenes:
- id: human-and-model-judges.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.human-and-model-judges
  title: Who checks an open-ended answer?
  markdown: Some tasks have an exact answer that a simple program can verify. Others, such as a helpful explanation,
    need a **judge** to apply criteria. The judge may be a person or another model. A **rubric** is a written set
    of scoring rules. For our library helper, correctness, support from the supplied source, and clarity are separate
    criteria. “Which answer sounds better?” leaves too much room for personal style to stand in for task success.
  text_mode: Some tasks have an exact answer that a simple program can verify. Others, such as a helpful explanation,
    need a **judge** to apply criteria. The judge may be a person or another model. A **rubric** is a written set
    of scoring rules. For our library helper, correctness, support from the supplied source, and clarity are separate
    criteria. “Which answer sounds better?” leaves too much room for personal style to stand in for task success.
  bridges: []
- id: human-and-model-judges.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.human-and-model-judges
  title: Separate a polished answer from a correct one
  markdown: Response A clearly states the wrong closing time. Response B awkwardly states the correct time and cites
    the schedule. A fluency-only judge might prefer A. A task rubric should score factual correctness and source
    support separately from presentation. Supply the evidence needed to check each claim. When an objective checker
    can verify a field or calculation, use that result directly rather than asking a language model to guess whether
    a plausible-looking answer is right.
  text_mode: Response A clearly states the wrong closing time. Response B awkwardly states the correct time and
    cites the schedule. A fluency-only judge might prefer A. A task rubric should score factual correctness and
    source support separately from presentation. Supply the evidence needed to check each claim. When an objective
    checker can verify a field or calculation, use that result directly rather than asking a language model to guess
    whether a plausible-looking answer is right.
  bridges: []
  figure:
    kind: evaluation
    caption: Judge the factual claim against a supplied schedule, then swap display positions without changing the
      answers.
    description: A sample library schedule says Tuesday opens at 10 a.m. Compare two authored answers, one polished
      but using Monday’s 9 a.m. opening time. The factually supported answer stays the same after their display
      positions swap.
- id: human-and-model-judges.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.human-and-model-judges
  title: Calibrate the judge on known examples
  markdown: Create a small set of reviewed examples with expected judgments and explanations. Include obvious successes,
    subtle factual errors, unsupported claims, and appropriate uncertainty. **Calibration of a judging process**
    here means comparing its judgments with the intended standard; it is not the same calculation as probability
    calibration. Check both humans and models for misunderstandings of the rubric. Agreement with a reference set
    is useful evidence about this task, not proof of universal judging ability.
  text_mode: Create a small set of reviewed examples with expected judgments and explanations. Include obvious successes,
    subtle factual errors, unsupported claims, and appropriate uncertainty. **Calibration of a judging process**
    here means comparing its judgments with the intended standard; it is not the same calculation as probability
    calibration. Check both humans and models for misunderstandings of the rubric. Agreement with a reference set
    is useful evidence about this task, not proof of universal judging ability.
  bridges: []
- id: human-and-model-judges.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.human-and-model-judges
  title: Swap positions to expose an order effect
  markdown: A pairwise judge compares A and B. Try the same pair again with their display positions swapped. If
    it repeatedly favors whichever answer appears first, the measured preference contains an order effect. Across
    a collection, balance or randomize order and record the policy. Also test whether longer or more confident wording
    changes the verdict when factual content stays the same. These controls investigate potential bias instead of
    assuming every preference reflects better task performance.
  text_mode: A pairwise judge compares A and B. Try the same pair again with their display positions swapped. If
    it repeatedly favors whichever answer appears first, the measured preference contains an order effect. Across
    a collection, balance or randomize order and record the policy. Also test whether longer or more confident wording
    changes the verdict when factual content stays the same. These controls investigate potential bias instead of
    assuming every preference reflects better task performance.
  bridges: []
- id: human-and-model-judges.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.human-and-model-judges
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Judge the task with a rubric, check the judge with controls, and keep disagreements visible. A convincing
    verdict is still a measurement to validate.
- id: human-and-model-judges.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.human-and-model-judges
  markdown: Human and model judges require clear rubrics, blinded comparisons, disagreement analysis, and validation
    against task evidence; preference agreement does not establish universal correctness.
  text_mode: Human and model judges require clear rubrics, blinded comparisons, disagreement analysis, and validation
    against task evidence; preference agreement does not establish universal correctness.
- id: human-and-model-judges.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.human-and-model-judges
  title: Keep disagreement informative
  markdown: Two reviewers may disagree because the rubric is unclear, evidence is incomplete, or the task admits
    several valid tradeoffs. Save their reasons and use a defined resolution process rather than silently erasing
    disagreement. For a model judge, record the exact model version, prompt, evidence, and sampling setup. A grader
    can share failure modes or preferences with the system it grades. Some outputs require expert review beyond
    what a generic model or crowd rating can establish.
  text_mode: Two reviewers may disagree because the rubric is unclear, evidence is incomplete, or the task admits
    several valid tradeoffs. Save their reasons and use a defined resolution process rather than silently erasing
    disagreement. For a model judge, record the exact model version, prompt, evidence, and sampling setup. A grader
    can share failure modes or preferences with the system it grades. Some outputs require expert review beyond
    what a generic model or crowd rating can establish.
  bridges: []
- id: human-and-model-judges.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.human-and-model-judges
  title: Use judging as one piece of evidence
  markdown: Combine appropriate automatic checks, rubric-based reviews, failure analysis, and user-relevant outcomes.
    A high judge score should not override a known factual failure merely because the explanation sounds confident.
    Audit a sample of decisions after changes to the judge or task. The memory cue is “rubric, references, role
    swap, reasons.” A good judging process gives you a traceable measurement and makes its uncertainty visible.
  text_mode: Combine appropriate automatic checks, rubric-based reviews, failure analysis, and user-relevant outcomes.
    A high judge score should not override a known factual failure merely because the explanation sounds confident.
    Audit a sample of decisions after changes to the judge or task. The memory cue is “rubric, references, role
    swap, reasons.” A good judging process gives you a traceable measurement and makes its uncertainty visible.
  bridges: []
- id: human-and-model-judges.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.human-and-model-judges
  title: Catch a position preference
  markdown: A judge picks the first displayed answer in both A/B and B/A presentations of the same unequal-quality
    pair. What does that suggest?
  text_mode: A judge picks the first displayed answer in both A/B and B/A presentations of the same unequal-quality
    pair. What does that suggest?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: An order effect worth investigating.
    - id: b
      text: A stable preference for the same response.
    - id: c
      text: Proof that both answers are equally correct.
    answer: a
    reveal_markdown: The winning response changed when positions changed. That is a signal to investigate the procedure,
      not a stable quality judgment.
    hint: Trace the example using the rule from the preceding pages.
    id: human-and-model-judges.practice.v2.7
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - human-and-model-judges.s1
    - human-and-model-judges.s2
    - human-and-model-judges.s3
    - human-and-model-judges.s4
    - human-and-model-judges.s5
    - human-and-model-judges.s6
    - human-and-model-judges.s7
    - human-and-model-judges.check
    gate_refs:
    - gate.core
  scene_aliases:
    human-and-model-judges.recap: human-and-model-judges.check
assessment_families:
- id: human-and-model-judges.base
  objective_ref: objective.human-and-model-judges
  task: base
  response_type: single_choice
  points: 1
  hint: 'Control presentation bias: trace the inputs, operation, and result before choosing.'
  remediation_scene: human-and-model-judges.s2
  variants:
  - id: human-and-model-judges.base.1
    prompt: Why swap response order in pairwise judging?
    options:
    - id: a
      text: To detect position bias
    - id: b
      text: To guarantee perfect correctness
    - id: c
      text: To retrain both candidate models
    answer: a
    feedback: Order can influence the evaluator.
    retired: true
  - id: human-and-model-judges.base.2
    prompt: Does high agreement on one validation set prove universal judge reliability?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if the judge is neural
    - id: a
      text: 'No'
    answer: a
    feedback: Generalization depends on domain and task coverage.
    retired: true
- id: human-and-model-judges.transfer
  objective_ref: objective.human-and-model-judges
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Use direct checks when available: trace the inputs, operation, and result before choosing.'
  remediation_scene: human-and-model-judges.s4
  variants:
  - id: human-and-model-judges.transfer.1
    prompt: A long polished answer contains a wrong fact. What should a rubric separate?
    options:
    - id: b
      text: Only token count and file size
    - id: c
      text: All qualities into one assumed truth
    - id: a
      text: Presentation quality and factual accuracy
    answer: a
    feedback: Fluency can mask errors.
    retired: true
  - id: human-and-model-judges.transfer.2
    prompt: Should text inside an answer redefine how it is scored?
    options:
    - id: c
      text: Only if it says “important”
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: The evaluated artifact does not control the evaluator’s instructions.
    retired: true
- id: human-and-model-judges.base.v2
  objective_ref: objective.human-and-model-judges
  task: base
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: human-and-model-judges.s3
  variants:
  - prompt: What is the purpose of a scoring rubric?
    answer: a
    options:
    - id: a
      text: To define observable criteria for the task
    - id: c
      text: To replace source evidence with confident language
    - id: b
      text: To make every judge agree without review
    feedback: A rubric clarifies what counts as success and how it is judged.
    id: human-and-model-judges.base.v2.1
  - prompt: An answer is fluent but contradicts the supplied schedule. What should the evaluation separate?
    answer: a
    options:
    - id: b
      text: Agreement with the majority of judges from agreement with the evidence
    - id: c
      text: Response confidence from the probability assigned to each next token
    - id: a
      text: Presentation quality from factual correctness
    feedback: Style and truth can vary independently and need distinct criteria.
    id: human-and-model-judges.base.v2.2
  - prompt: What does swapping A/B display positions help detect?
    answer: a
    options:
    - id: b
      text: Whether the generator prefers one response during training
    - id: a
      text: Order effects in pairwise judgments
    - id: c
      text: Whether one response has a higher likelihood under its generator
    feedback: Counterbalanced order tests whether placement influences the verdict.
    id: human-and-model-judges.base.v2.3
  - prompt: Why keep reviewer explanations when they disagree?
    answer: a
    options:
    - id: a
      text: They can reveal ambiguity, missing evidence, or different criteria
    - id: c
      text: They replace the need to define a resolution policy
    - id: b
      text: They are extra votes to add to the score separately from each verdict
    feedback: Reasons help diagnose disagreement rather than hiding it.
    id: human-and-model-judges.base.v2.4
- id: human-and-model-judges.transfer.v2
  objective_ref: objective.human-and-model-judges
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: human-and-model-judges.s3
  variants:
  - prompt: A calculator verifies that a numerical answer is wrong, but a model judge praises it. What is the appropriate
      interpretation?
    answer: a
    options:
    - id: c
      text: Combine the two verdicts as equally reliable votes on the arithmetic
    - id: b
      text: The judge’s overall impression is sufficient for this numerical field
    - id: a
      text: The judge’s verdict conflicts with a direct correctness check
    feedback: Use the direct task check and investigate why the judge missed the error.
    id: human-and-model-judges.transfer.v2.1
  - prompt: A judge changes version between two model comparisons. What should be controlled or reported?
    answer: a
    options:
    - id: a
      text: The changed grading procedure and its calibration
    - id: b
      text: Keep the old score scale without checking the new judge
    - id: c
      text: Pool both sets of grades as if the measurement procedure were unchanged
    feedback: Changing the judge can change scores independently of the evaluated systems.
    id: human-and-model-judges.transfer.v2.2
  - prompt: Lengthening an answer without changing facts increases its judge score. What should be tested?
    answer: a
    options:
    - id: a
      text: Whether verbosity is influencing the intended quality judgment
    - id: b
      text: Whether all long answers contain more evidence
    - id: c
      text: Whether the generator used more computation to produce the longer wording
    feedback: A controlled length change can expose a style preference in the grading procedure.
    id: human-and-model-judges.transfer.v2.3
  - prompt: A task needs domain expertise absent from the judge. What is a reasonable response?
    answer: a
    options:
    - id: c
      text: Increase the judge’s output length until it sounds certain
    - id: a
      text: Use appropriately qualified review and limit the automated score’s claim
    - id: b
      text: Treat fluency as a substitute for expertise
    feedback: Judge competence is part of evaluation validity.
    id: human-and-model-judges.transfer.v2.4
