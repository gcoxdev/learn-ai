scenes:
  - id: human-and-model-judges.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.human-and-model-judges
    title: Two graders agree 85%. Is that good?
    markdown: |-
      Kestrel's support answers can't be checked by exact match, so two senior support leads grade them. Their **rubric**, a written set of scoring rules, says an answer is correct if its fix or fact works for this customer and matches the help pages. Both leads grade the same 100 answers:

      | | Lead 2: correct | Lead 2: incorrect |
      | --- | ---: | ---: |
      | **Lead 1: correct** | 65 | 5 |
      | **Lead 1: incorrect** | 10 | 20 |

      They agree on 85 of 100. But two graders who each said "correct" at random 70% and 75% of the time would agree fairly often by luck alone. **Cohen's kappa** (κ) measures agreement beyond that luck:

      $$\kappa = \frac{p_o - p_e}{1 - p_e}, \qquad p_e = 0.70 \times 0.75 + 0.30 \times 0.25 = 0.60, \qquad \kappa = \frac{0.85 - 0.60}{1 - 0.60} = 0.625$$

      $p_o$ is the observed agreement, and $p_e$ is the agreement expected by chance from each grader's rate of saying "correct". κ = 1 is perfect agreement; κ = 0 is no better than chance. A widely used rule of thumb (Landis and Koch, 1977) calls 0.61–0.80 "substantial".

      ```python run
      # Two support leads label the same 100 answers as correct (1) or incorrect (0)
      both_correct, only_lead1, only_lead2, both_incorrect = 65, 5, 10, 20
      n = both_correct + only_lead1 + only_lead2 + both_incorrect

      p_observed = (both_correct + both_incorrect) / n
      lead1_yes = (both_correct + only_lead1) / n
      lead2_yes = (both_correct + only_lead2) / n
      p_chance = lead1_yes * lead2_yes + (1 - lead1_yes) * (1 - lead2_yes)
      kappa = (p_observed - p_chance) / (1 - p_chance)

      print(f"observed agreement p_o = {p_observed:.3f}")
      print(f"lead 1 says correct {lead1_yes:.0%}, lead 2 says correct {lead2_yes:.0%}")
      print(f"chance agreement   p_e = {p_chance:.3f}")
      print(f"Cohen's kappa          = {kappa:.3f}")
      ```

      :::predict On an easier batch, both leads mark 95% of answers correct and agree on 92%. What is κ?
      About 0.16. Chance agreement is now $0.95^2 + 0.05^2 = 0.905$, so $\kappa = (0.92 - 0.905)/(1 - 0.905) \approx 0.16$. When nearly everything is "correct", agreeing is easy; the leads barely agree on the few answers that matter. Set the counts to 91, 4, 4, 1 in the program to check.
      :::

      Low κ usually means an unclear rubric. Most of the leads' 15 disagreements were partial fixes, so they added a rule for those.
    bridges: []
  - id: human-and-model-judges.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.human-and-model-judges
    title: A polished answer can still be wrong
    markdown: |-
      Graders, human or model, are drawn to answers that sound good. In the activity below, a visitor asks when a library opens on Tuesday. One answer is warm and polished but gives Monday's 9 a.m. time. The other is plain and correct: 10 a.m., citing the schedule.

      Choose the correct answer using the schedule, then swap the positions. The facts don't move, so the verdict shouldn't either.

      That's why Kestrel's rubric scores correctness, support from the help pages, and tone as separate lines. And when a program can check a fact, such as a fee in the billing database, the program decides.
    bridges: []
    figure:
      kind: evaluation
      caption: Judge the factual claim against a supplied schedule, then swap display positions without changing the answers.
      description: A sample library schedule says Tuesday opens at 10 a.m. Compare two authored answers, one polished but using Monday’s 9 a.m. opening time. The factually supported answer stays the same after their display positions swap.
  - id: human-and-model-judges.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.human-and-model-judges
    title: A language model as the judge
    markdown: |-
      Labeling answers by hand after every change is slow, so Kestrel wants a model to do it. This is **LLM-as-a-judge**: give a strong model the question, reference answer, rubric, and reply, and ask for a verdict. Zheng et al. (2023) studied the idea using MT-Bench, a set of 80 multi-turn questions, and Chatbot Arena, a site where people vote between two anonymous chatbots. They found that GPT-4 as a judge agreed with human preferences over 80% of the time, about as often as humans agreed with each other.

      Still, check it on your own task. Kestrel runs its judge on the 100 answers the leads graded. It matches their agreed labels on 88, with κ ≈ 0.69, about as consistent as the leads were with each other.

      Then the team reads the 12 disagreements. In 8, the judge passed an answer the leads had failed, mostly long, confident answers with a wrong fee. The next scenes test for exactly these weaknesses.
    bridges: []
  - id: human-and-model-judges.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.human-and-model-judges
    title: Swap positions to expose an order effect
    markdown: |-
      To compare A and B, Kestrel shows the judge both replies and asks which is better. **Position bias** is a judge's tendency to favor a reply because of where it appears. To test for it, judge every pair twice, once with A first and once with B first.

      ```python run
      # Each pair of answers is judged twice: A shown first, then B shown first.
      # A record is (winner with A first, winner with B first).
      records = [("A", "A")] * 30 + [("B", "B")] * 38 + [("A", "B")] * 26 + [("B", "A")] * 6

      consistent = sum(a == b for a, b in records)
      first_slot = sum((a == "A") + (b == "B") for a, b in records)   # picks of whatever was shown first
      print(f"same winner in both orders: {consistent}/{len(records)}")
      print(f"first-shown answer chosen:  {first_slot}/{2 * len(records)} = {first_slot / (2 * len(records)):.0%}")

      # Zheng et al.'s rule: a win counts only if it survives the swap; otherwise it's a tie
      tally = {"A": 0, "B": 0, "tie": 0}
      for a, b in records:
          tally[a if a == b else "tie"] += 1
      print("swap-tested result:", tally)
      ```

      In 26 of 100 pairs the judge picked whichever reply came first, both times. Overall it chose the first slot 60% of the time, where an order-blind judge would sit near 50%. Zheng et al.'s fix is to count a win only when it survives the swap and call the rest ties: B 38, A 30, tie 32.

      :::mixup "Randomize which answer goes first, and position bias is handled."
      Randomizing spreads the bias evenly, so neither model gains on average. But each single verdict is still partly a coin flip on position, which adds noise. Judging both orders removes it and shows how big the bias is.
      :::
    diagram:
      caption: The swap test. A verdict counts only if it survives reversing the order.
      description: One pair of replies goes to the judge twice, once with A shown first and once with B shown first. Both verdicts go to a comparison step. If both verdicts name the same reply, that reply gets the win. If they differ, the pair is recorded as a tie and counted as an order effect.
      nodes:
        - id: pair
          label: Pair of replies A, B
          col: 0
          row: 1
          tone: data
        - id: ab
          label: Judge sees A, then B
          col: 1
          row: 0
        - id: ba
          label: Judge sees B, then A
          col: 1
          row: 2
        - id: same
          label: Same winner both times?
          col: 2
          row: 1
          tone: accent
        - id: win
          label: Count the win
          col: 3
          row: 0
        - id: tie
          label: Record a tie
          note: counts as an order effect
          col: 3
          row: 2
          tone: warn
      edges:
        - from: pair
          to: ab
        - from: pair
          to: ba
        - from: ab
          to: same
          label: verdict 1
        - from: ba
          to: same
          label: verdict 2
        - from: same
          to: win
          label: "yes"
        - from: same
          to: tie
          label: "no"
  - id: human-and-model-judges.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.human-and-model-judges
    title: Longer, and written by itself
    markdown: |-
      Zheng et al. named two more biases. **Verbosity bias** is preferring longer replies even when they add nothing. **Self-preference** (they called it self-enhancement) is a judge favoring replies written by itself or by models like it.

      Test both like position: change one thing and hold everything else fixed.

      - **Verbosity.** Take 50 of B's replies and pad each with a restatement of what it already says, with no new facts. If the padded versions win more often against the originals, length is buying votes. Comparing long and short replies across the whole test set doesn't work, because longer replies may also be more complete.
      - **Self-preference.** Kestrel's judge comes from the same model family as B. So the team also grades a sample with a judge from a different family and with the two leads. If B's lead shrinks under the outside graders, some of it came from the judge's taste.

      For length, AlpacaEval 2.0 reports a length-controlled win rate (Dubois et al., 2024): a regression predicts wins from both the model and the length difference, then removes the length effect.
    bridges: []
  - id: human-and-model-judges.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.human-and-model-judges
    title: From pairwise votes to a leaderboard
    markdown: |-
      Chatbot Arena turns many single votes into one rating per model. It began with **Elo ratings**, the chess system. A model rated $R_A$ is expected to beat one rated $R_B$ with probability

      $$E_A = \frac{1}{1 + 10^{(R_B - R_A)/400}}$$

      A 100-point lead gives $E_A = 0.64$. After each vote, $R_A$ moves by $K(S_A - E_A)$, where $S_A$ is 1 for a win and 0 for a loss. With $K = 32$, a 1,100-rated model that beats a 1,000-rated one gains $32 \times 0.36 \approx 11.5$ points.

      Online Elo depends on the order votes arrive in. In December 2023 the Arena switched to fitting a **Bradley–Terry model** (the same pairwise model used to train reward models in module 20) to all votes at once, which gives steadier ratings with confidence intervals. Either way, a rating inherits every bias in the votes.
    bridges: []
  - id: human-and-model-judges.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.human-and-model-judges
    markdown: Compute a few kappas, then audit graders for radiology reports, an essay contest, a student voting page, and contract summaries.
    takeaway: |-
      Report agreement as κ, not raw percent. Test every judge by changing one thing at a time (order, length, or who wrote the answer), and let a program decide anything a lookup can check.
  - id: human-and-model-judges.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.human-and-model-judges
    markdown: |-
      Give judges a clear rubric and the evidence needed to apply it. Check their decisions with reference examples, order swaps, and reviews of disagreement.
  - id: human-and-model-judges.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.human-and-model-judges
    title: Catch a position preference
    markdown: |-
      A judge picks the first displayed answer in both A/B and B/A presentations of the same unequal-quality pair. What does that suggest?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: An order effect worth investigating.
        - id: b
          text: A stable preference for the same response.
        - id: c
          text: Proof that both answers are equally correct.
      answer: a
      reveal_markdown: |-
        The verdict followed the slot, not the answer: A won when shown first and B won when shown first. Under the swap rule this pair is a tie. If many pairs look like this, as with the 26 of 100 in Kestrel's test, fix the judge prompt or model, and keep judging both orders.
      hint: Look at which answer won in each order. Did the win follow the answer or the position?
      id: human-and-model-judges.practice.v2.7
