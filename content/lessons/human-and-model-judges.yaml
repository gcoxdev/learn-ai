  version: 0.4.0-draft
  title: Treat evaluators as fallible measurement instruments
  state: draft
  summary: Your two best graders agree 92% of the time, and that can still mean almost nothing. Measure agreement properly, then catch a model judge that prefers whichever answer it reads first.
