  - id: human-and-model-judges.base.v3
    objective_ref: objective.human-and-model-judges
    task: base
    response_type: single_choice
    points: 1
    hint: "For agreement, subtract what chance alone would give. For a judge's bias, change exactly one thing (order, length, or who wrote the reply) and see whether the verdict moves."
    remediation_scene: human-and-model-judges.s4
    variants:
      - id: human-and-model-judges.base.v3.1
        prompt: Two graders agree on 92% of labels, but each marks 95% of answers "correct". Why is their Cohen's kappa only about 0.16?
        options:
          - id: b
            text: Kappa penalizes graders who disagree on the hardest items
          - id: a
            text: Most of that agreement is expected by chance at those rates
          - id: c
            text: Kappa counts only the "incorrect" labels, which are rare here
        answer: a
        feedback: "Chance agreement is 0.95² + 0.05² = 0.905, so the graders beat luck by only 0.015 out of a possible 0.095. Kappa weighs all labels equally; it doesn't single out hard items or one label."
      - id: human-and-model-judges.base.v3.2
        prompt: A judge compares 100 pairs in both orders and picks the first-shown reply both times for 26 pairs. Under the swap rule of Zheng et al., how are those 26 pairs counted?
        options:
          - id: c
            text: As wins for whichever reply was first in the original order
          - id: b
            text: As missing data, removed before the win rates are computed
          - id: a
            text: As ties, since neither reply's win survived the swap
        answer: a
        feedback: A win counts only if the same reply wins in both orders; otherwise the pair is a tie. Crediting the original first reply would keep the bias, and dropping the pairs would hide how often it happens.
      - id: human-and-model-judges.base.v3.3
        prompt: How should you test a model judge for verbosity bias?
        options:
          - id: a
            text: Pad replies with restated content and see if their win rate rises
          - id: b
            text: Compare its scores for long and short replies across the test set
          - id: c
            text: Ask the judge directly whether it tends to prefer longer replies
        answer: a
        feedback: Padding changes length while keeping the facts fixed, so any change in wins is due to length. Across a test set, longer replies may also be more complete, which confounds the comparison, and a model's report about itself is not a measurement.
      - id: human-and-model-judges.base.v3.4
        prompt: Kestrel's replies quote a monthly fee that can be looked up in the billing database. What should decide whether a quoted fee is correct?
        options:
          - id: b
            text: A judge model given a rubric line about fee accuracy
          - id: c
            text: Two support leads, with their kappa reported alongside
          - id: a
            text: A program that compares the fee with the database entry
        answer: a
        feedback: When a lookup can settle a fact, it is faster and more reliable than any judge. Judges, human or model, can be swayed by a confident tone; a database comparison can't.
  - id: human-and-model-judges.transfer.v3
    objective_ref: objective.human-and-model-judges
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name the specific weakness this grading setup is exposed to (chance agreement, order, length, self-preference, or a changed instrument), then choose the check that isolates it.
    remediation_scene: human-and-model-judges.s5
    variants:
      - id: human-and-model-judges.transfer.v3.1
        prompt: Two radiologists label 200 reports as "urgent" or "routine" and reach a kappa of 0.35. Most disagreements involve reports mentioning a small nodule. What is the best next step?
        options:
          - id: c
            text: Average their labels so each report gets a score between 0 and 1
          - id: a
            text: Clarify the rubric for small nodules, then relabel a sample
          - id: b
            text: Use the senior radiologist's labels as the ground truth
        answer: a
        feedback: Low kappa concentrated on one kind of case points to an unclear rule. Fixing the rule and relabeling tests whether agreement improves. Averaging or picking one grader hides the ambiguity instead of resolving it.
      - id: human-and-model-judges.transfer.v3.2
        prompt: An essay-writing model is graded by a judge from the same model family and wins 70% of comparisons against a rival. What check targets the most likely bias?
        options:
          - id: b
            text: Swap the essays' positions and rerun the same judge
          - id: a
            text: Regrade a sample with a judge from another family and with people
          - id: c
            text: Ask the judge to explain its reasoning before it chooses
        answer: a
        feedback: A same-family judge may prefer its own family's style, so outside graders test self-preference. Swapping positions tests a different bias, and a written explanation doesn't remove the judge's taste.
      - id: human-and-model-judges.transfer.v3.3
        prompt: On a school's voting page, students compare two tutoring bots. Bot X has an Elo rating of 1,100 and Bot Y 1,000. About what share of their head-to-head votes should X win?
        options:
          - id: a
            text: About 64%, from 1 / (1 + 10^(−100/400))
          - id: b
            text: About 91%, from 1 / (1 + 10^(−100/100))
          - id: c
            text: About 55%, since 100 points is a tenth of 1,000
        answer: a
        feedback: "Elo's expected score uses a 400-point scale: 1 / (1 + 10^(−0.25)) ≈ 0.64. Dividing by 100 instead of 400 inflates the edge to 91%, and ratings depend on the gap, not on the ratio to 1,000."
      - id: human-and-model-judges.transfer.v3.4
        prompt: A judge model scores contract summaries from 1 to 10. After a summarizer update, the judge's model version also changes, and average scores rise by 0.8. What should you do?
        options:
          - id: c
            text: Credit the rise to the update, since the rubric stayed the same
          - id: b
            text: Average the old and new judges' scores for both summarizers
          - id: a
            text: Rescore the old and new summaries with the same judge version
        answer: a
        feedback: Two things changed at once, so the rise can't be credited to the summarizer. Holding the judge fixed isolates the update. Averaging two judges still mixes the instrument change into the result.
