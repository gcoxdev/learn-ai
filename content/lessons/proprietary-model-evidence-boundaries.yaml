schema_version: 0.2-draft
lesson:
  id: proprietary-model-evidence-boundaries
  version: 0.1.0-draft
  title: Read proprietary reports without inventing hidden architecture
  state: draft
  summary: Public reports can establish some proprietary-system mechanisms while leaving other details unknown;
    keep documented facts, measurements, and architectural guesses separate.
  slot: M35.8
  category: learning
  minutes: 18
  sources:
  - title: GPT-4 report v6
    url: https://arxiv.org/abs/2303.08774v6
  - title: Gemini 1.5 report v5
    url: https://arxiv.org/abs/2403.05530v5
objectives:
- id: objective.proprietary-model-evidence-boundaries
  version: 1-draft
  statement: Public reports can establish some proprietary-system mechanisms while leaving other details unknown;
    keep documented facts, measurements, and architectural guesses separate.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - proprietary-model-evidence-boundaries.base
  - proprietary-model-evidence-boundaries.transfer
  prerequisites:
  - anyOf:
    - objective.model-report-and-artifact-inventory
  - anyOf:
    - objective.benchmark-design-and-comparison
  - anyOf:
    - objective.moe-parameter-accounting
scenes:
- id: proprietary-model-evidence-boundaries.s1
  title: Date the disclosure
  type: explanation
  depth: intuition
  objective_refs:
  - objective.proprietary-model-evidence-boundaries
  markdown: Use GPT-4 report revision 6, March 4, 2024, and Gemini 1.5 report revision 5, December 16, 2024, as
    historical disclosure examples. Sources checked September 13, 2026. They are not descriptions of every current
    product carrying related branding or guarantees about a future service.
  text_mode: Use GPT-4 report revision 6, March 4, 2024, and Gemini 1.5 report revision 5, December 16, 2024, as
    historical disclosure examples. Sources checked September 13, 2026. They are not descriptions of every current
    product carrying related branding or guarantees about a future service.
  bridges: []
- id: proprietary-model-evidence-boundaries.s2
  title: Record what GPT-4 discloses
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.proprietary-model-evidence-boundaries
  markdown: The GPT-4 report describes a transformer-based next-token model with image/text inputs and text outputs,
    followed by adaptation using human feedback. It withholds details including model size, architecture specifics,
    hardware, and dataset construction. Do not fill those gaps with an asserted MoE layout or parameter count.
  text_mode: The GPT-4 report describes a transformer-based next-token model with image/text inputs and text outputs,
    followed by adaptation using human feedback. It withholds details including model size, architecture specifics,
    hardware, and dataset construction. Do not fill those gaps with an asserted MoE layout or parameter count.
  bridges: []
- id: proprietary-model-evidence-boundaries.s3
  title: Record what Gemini discloses
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.proprietary-model-evidence-boundaries
  markdown: The Gemini 1.5 report identifies 1.5 Pro as a sparse mixture-of-experts transformer and studies long-context
    multimodal capabilities. That disclosure supports the architecture-family label. It does not justify importing
    a different open model’s expert configuration or treating every related checkpoint as architecturally identical.
  text_mode: The Gemini 1.5 report identifies 1.5 Pro as a sparse mixture-of-experts transformer and studies long-context
    multimodal capabilities. That disclosure supports the architecture-family label. It does not justify importing
    a different open model’s expert configuration or treating every related checkpoint as architecturally identical.
  bridges: []
- id: proprietary-model-evidence-boundaries.s4
  title: Separate service observations
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.proprietary-model-evidence-boundaries
  markdown: A measured response includes the chosen endpoint, version, settings, surrounding software, and possibly
    changing infrastructure. Behavior can suggest hypotheses but usually cannot uniquely reveal hidden weights or
    training data. Preserve prompts, outputs, dates, and allowed evaluation conditions so observations remain interpretable.
  text_mode: A measured response includes the chosen endpoint, version, settings, surrounding software, and possibly
    changing infrastructure. Behavior can suggest hypotheses but usually cannot uniquely reveal hidden weights or
    training data. Preserve prompts, outputs, dates, and allowed evaluation conditions so observations remain interpretable.
  bridges: []
- id: proprietary-model-evidence-boundaries.s5
  title: Construct a known/unknown comparison
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.proprietary-model-evidence-boundaries
  markdown: 'For each case, write rows for architecture, data, pretraining objective, post-training, inference interface,
    and evaluation. Mark documented, observed, inferred, or undisclosed, with a source. “Undisclosed” is a useful
    result: it prevents an attractive but unsupported lifecycle diagram from becoming course fact.'
  text_mode: 'For each case, write rows for architecture, data, pretraining objective, post-training, inference
    interface, and evaluation. Mark documented, observed, inferred, or undisclosed, with a source. “Undisclosed”
    is a useful result: it prevents an attractive but unsupported lifecycle diagram from becoming course fact.'
  bridges: []
- id: proprietary-model-evidence-boundaries.s6
  title: Make a bounded decision
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.proprietary-model-evidence-boundaries
  markdown: Compare systems on a defined workload with repeatable criteria and resource measurements. Report remaining
    uncertainty, including whether a result transfers beyond tested conditions. Architecture study and product selection
    need different evidence; neither requires pretending that missing internal documentation is available.
  text_mode: Compare systems on a defined workload with repeatable criteria and resource measurements. Report remaining
    uncertainty, including whether a result transfers beyond tested conditions. Architecture study and product selection
    need different evidence; neither requires pretending that missing internal documentation is available.
  bridges: []
- id: proprietary-model-evidence-boundaries.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.proprietary-model-evidence-boundaries
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Public reports can establish some proprietary-system mechanisms while leaving other details unknown;
    keep documented facts, measurements, and architectural guesses separate.
- id: proprietary-model-evidence-boundaries.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.proprietary-model-evidence-boundaries
  markdown: Public reports can establish some proprietary-system mechanisms while leaving other details unknown;
    keep documented facts, measurements, and architectural guesses separate.
  text_mode: Public reports can establish some proprietary-system mechanisms while leaving other details unknown;
    keep documented facts, measurements, and architectural guesses separate.
