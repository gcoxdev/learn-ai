schema_version: 0.2-draft
lesson:
  id: proprietary-model-evidence-boundaries
  version: 0.4.0-draft
  title: Read proprietary reports without inventing hidden architecture
  state: draft
  summary: The GPT-4 report says outright that it won't give the model's size. Within months, the internet "knew" it anyway. Learn what closed reports really tell you, and how to reason from them without making things up.
  slot: M35.8
  category: learning
  sources:
    - title: GPT-4 report v6
      url: https://arxiv.org/abs/2303.08774v6
    - title: Gemini 1.5 report v5
      url: https://arxiv.org/abs/2403.05530v5
objectives:
  - id: objective.proprietary-model-evidence-boundaries
    version: 2-draft
    statement: Public reports reveal some things about proprietary models and hide others; keep documented facts, measurements, and guesses about architecture separate.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - proprietary-model-evidence-boundaries.base.v2
      - proprietary-model-evidence-boundaries.transfer.v2
      - proprietary-model-evidence-boundaries.calculate
    prerequisites:
      - anyOf:
          - objective.model-report-and-artifact-inventory
      - anyOf:
          - objective.benchmark-design-and-comparison
      - anyOf:
          - objective.moe-parameter-accounting
scenes:
  - id: proprietary-model-evidence-boundaries.s1
    title: The sentence that ends the architecture section
    type: explanation
    depth: intuition
    objective_refs:
      - objective.proprietary-model-evidence-boundaries
    markdown: |-
      Early in OpenAI's GPT-4 technical report comes this sentence: the report "contains no further details about the architecture (including model size), hardware, training compute, dataset construction, training method, or similar," citing "the competitive landscape and the safety implications."

      Within months, blog posts and threads were confidently giving GPT-4 an expert count and a parameter total. None of those numbers came from OpenAI. Yet they were repeated so often that people treated them as facts.

      This lesson is about the other side of the inventory from the previous lessons: models whose weights, data, and configs you'll never see. You can still learn a lot from them, as long as every claim keeps its label.

      Pin the documents: **GPT-4 report revision 6 (March 4, 2024)** and **Gemini 1.5 report revision 5 (December 16, 2024)**. They describe those systems as reported then, not whatever product carries the brand today.
    bridges: []
  - id: proprietary-model-evidence-boundaries.s2
    title: What GPT-4's report does tell you
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.proprietary-model-evidence-boundaries
    markdown: |-
      Read past the refusal and the report still documents a fair amount:

      - GPT-4 is a Transformer-style model pretrained to predict the next token, on public data and data licensed from third parties.
      - It was then fine-tuned with reinforcement learning from human feedback (RLHF).
      - It accepts image and text inputs and produces text.
      - An attached **system card** describes risks, adversarial testing with domain experts, and the safety mitigations. A system card reports how a model behaves and how it was tested; it isn't an architecture document.

      The report's most technical disclosure is **predictable scaling**. Before the big run, the team fitted a curve to models trained with up to 10,000 times less compute and predicted GPT-4's final loss.

      :::papers The loss curve GPT-4 was predicted from
      $$L(C) = aC^{b} + c$$

      This is a compute-only cousin of the Chinchilla fits from the pretraining budget lesson. $C$ is training compute, $b < 0$ makes loss fall as compute grows, and $c$ is the **irreducible loss** the curve levels off toward. Fit $a$, $b$, $c$ on small runs, then read off $L$ at the big run's $C$.
      :::

      ```python run
      import numpy as np

      # Eight small runs, 1x to 1,000x the smallest budget, following L(C) = a*C^b + c plus noise
      rng = np.random.default_rng(0)
      a, b, c = 3.0, -0.12, 1.6                        # the truth we pretend not to know
      C_small = np.logspace(0, 3, 8)
      L_small = a * C_small**b + c + rng.normal(0, 0.003, 8)

      best = None
      for c_try in np.linspace(1.0, 2.0, 201):         # try each irreducible loss c ...
          if np.any(L_small <= c_try):
              continue
          b_fit, log_a = np.polyfit(np.log(C_small), np.log(L_small - c_try), 1)  # ... fit a, b in log space
          err = np.sum((np.exp(log_a) * C_small**b_fit + c_try - L_small) ** 2)
          if best is None or err < best[0]:
              best = (err, np.exp(log_a), b_fit, c_try)

      _, a_fit, b_fit, c_fit = best
      C_big = 1e7                                      # 10,000x beyond the largest small run
      print(f"fitted: a = {a_fit:.2f}, b = {b_fit:.3f}, c = {c_fit:.2f}")
      print(f"predicted loss at C = 1e7: {a_fit * C_big**b_fit + c_fit:.3f}")
      print(f"true loss at C = 1e7:      {a * C_big**b + c:.3f}")
      ```

      The prediction lands within 0.013 of the truth. Change the noise from 0.003 to 0.03 and it misses by about 0.13: extrapolating 10,000 times is only as good as the small runs are clean.
    bridges: []
  - id: proprietary-model-evidence-boundaries.s3
    title: What Gemini 1.5's report tells you
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.proprietary-model-evidence-boundaries
    markdown: |-
      Google's Gemini 1.5 report goes further on architecture. It states that Gemini 1.5 Pro is a **sparse mixture-of-experts** Transformer, and that 1.5 Flash is a Transformer decoder "online distilled from the much larger Gemini 1.5 Pro." It documents long-context results: over 99.7% recall of a planted "needle" up to 1 million tokens in text, video, and audio, holding up to 10 million tokens of text.

      Notice the shape of each disclosure. "Mixture of experts" is documented; the expert count, the parameter total, and the active count are not. "Flash is much smaller than Pro" is documented; how much smaller is not. You can write the first half of each sentence in your table and must leave the second half blank.

      :::mixup "It's an MoE, so it probably looks like Mixtral or DeepSeek-V3."
      The label tells you the family, not the layout. Open MoEs range from 8 experts choosing 2 to 256 choosing 8, with or without shared experts. Borrowing any one of them would fill a blank with a guess.
      :::
    bridges: []
  - id: proprietary-model-evidence-boundaries.s4
    title: Reason from bounds, not rumors
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.proprietary-model-evidence-boundaries
    markdown: |-
      You can't compute a closed model's weights, cache, or 6ND: the parameter count is missing. But you can compute what *known* designs would need to match a documented behavior, and use that as a bound.

      :::predict Suppose Gemini 1.5 Pro were shaped like Llama 3.1 405B, with 504 KiB of KV cache per token. How much cache would one 1-million-token prompt need?
      504 KiB × 1,000,000 = 504 million KiB, about 481 GiB, more than six 80 GB GPUs hold, for a single request. At 10 million tokens it would be about 4.7 TiB.
      :::

      That supports an **inferred** statement: serving million-token prompts probably needs some combination of a smaller per-token cache, spreading one request across many chips, or other long-context machinery. The report itself says only that "a series of significant architecture changes" enable long context. It doesn't say which, and your bound doesn't either.

      The same care applies to your own measurements. When you probe a service, you're measuring the endpoint, its version string, the date, your settings, any hidden system prompt, and whatever infrastructure sits behind it. Record all of them. Two services that answer your 20 questions identically may still differ in architecture, data, and tools. Matching outputs can't identify what's inside.
    bridges: []
  - id: proprietary-model-evidence-boundaries.s5
    title: Four labels, one table
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.proprietary-model-evidence-boundaries
    markdown: |-
      Here's the evidence table from the lesson on reading a release, adapted for closed models. Since you can't compute from hidden numbers, *measured* replaces *computed*:

      | Claim | Label | Source |
      | --- | --- | --- |
      | GPT-4 is fine-tuned with RLHF | Documented | GPT-4 report §2 |
      | Gemini 1.5 Pro is a sparse MoE | Documented | Gemini 1.5 report §3.1 |
      | Gemini 1.5 Pro's expert count | Undisclosed | — |
      | Service X answers 18 of our 20 contract questions (version, date, temperature 0) | Measured | Our test log |
      | Million-token serving needs more than a 405B-style cache | Inferred | 481 GiB bound above |
      | GPT-4 has a specific parameter total | Undisclosed | Not in the report; rumors aren't sources |

      "Undisclosed" is a real result. It stops an attractive diagram from becoming course fact, and it tells a reader exactly where the evidence ends.
    diagram:
      caption: Deciding which label a claim about a closed model gets.
      description: A claim is first checked against primary sources; if a report, card, or official documentation states it, it is documented. If not, ask whether you measured it yourself with the version and date recorded; if so, it is measured. If not, ask whether it follows from documented facts plus stated assumptions; if so, it is inferred. Otherwise it is undisclosed and stays out of calculations.
      nodes:
        - id: claim
          label: A claim about a closed model
          col: 0
          row: 0
          tone: muted
        - id: q1
          label: In a primary source?
          col: 1
          row: 0
        - id: q2
          label: Measured by you, with version and date?
          col: 2
          row: 0
        - id: q3
          label: Follows from documented facts + assumptions?
          col: 3
          row: 0
        - id: undisclosed
          label: Undisclosed
          note: leave the cell blank
          col: 4
          row: 0
          tone: warn
        - id: documented
          label: Documented
          col: 1
          row: 1
          tone: accent
        - id: measured
          label: Measured
          col: 2
          row: 1
          tone: data
        - id: inferred
          label: Inferred
          note: state the assumptions
          col: 3
          row: 1
      edges:
        - from: claim
          to: q1
        - from: q1
          to: documented
          label: "yes"
        - from: q1
          to: q2
          label: "no"
        - from: q2
          to: measured
          label: "yes"
        - from: q2
          to: q3
          label: "no"
        - from: q3
          to: inferred
          label: "yes"
        - from: q3
          to: undisclosed
          label: "no"
    bridges: []
  - id: proprietary-model-evidence-boundaries.s6
    title: Choose a closed model with the evidence you have
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.proprietary-model-evidence-boundaries
    markdown: |-
      Picking a model for a product needs different evidence from studying its architecture, and closed models can supply it. Run your own workload: the same 200 real prompts, the same scoring rubric, a pinned model version, and the price and latency per request. Those are measured rows, and they answer the product question directly.

      What you can't get from outside, ask the vendor for: version-pinning and deprecation policy, data retention, and the context length they guarantee. Their written answers become documented rows. Everything else stays undisclosed, and the decision doesn't need it.
    bridges: []
  - id: proprietary-model-evidence-boundaries.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.proprietary-model-evidence-boundaries
    markdown: Label claims about GPT-4 and Gemini 1.5, handle a rumor, a drifting API, and a cost estimate, and compute what a known design would need for a long-context claim.
    takeaway: |-
      Closed reports document some facts (GPT-4's RLHF, Gemini 1.5 Pro's MoE) and withhold others (sizes, expert counts, data). Label every claim documented, measured, inferred, or undisclosed, and reason from bounds rather than rumors.
  - id: proprietary-model-evidence-boundaries.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.proprietary-model-evidence-boundaries
    markdown: |-
      Separate what a report documents from what an experiment observes and what remains undisclosed. Similar outputs do not uniquely reveal a system’s hidden architecture.
