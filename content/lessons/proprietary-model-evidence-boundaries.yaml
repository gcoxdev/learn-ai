assessment_families:
- id: proprietary-model-evidence-boundaries.base
  objective_ref: objective.proprietary-model-evidence-boundaries
  task: base
  response_type: single_choice
  points: 1
  hint: 'Record what GPT-4 discloses: trace the inputs, operation, and result before choosing.'
  remediation_scene: proprietary-model-evidence-boundaries.s2
  variants:
  - id: proprietary-model-evidence-boundaries.base.1
    prompt: Does the GPT-4 report disclose an exact expert count?
    options:
    - id: c
      text: Only for vision inputs
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: The report withholds architectural specifics.
  - id: proprietary-model-evidence-boundaries.base.2
    prompt: Can the Gemini 1.5 Pro MoE label be supported by its report?
    options:
    - id: a
      text: 'Yes'
    - id: b
      text: No proprietary architecture can ever be known
    - id: c
      text: Only by guessing from latency
    answer: a
    feedback: A primary-source disclosure can establish a bounded fact.
- id: proprietary-model-evidence-boundaries.transfer
  objective_ref: objective.proprietary-model-evidence-boundaries
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Make a bounded decision: trace the inputs, operation, and result before choosing.'
  remediation_scene: proprietary-model-evidence-boundaries.s6
  variants:
  - id: proprietary-model-evidence-boundaries.transfer.1
    prompt: Does a matching answer reveal a model’s exact training example?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only when the answer is long
    answer: a
    feedback: Behavior does not uniquely identify training provenance.
  - id: proprietary-model-evidence-boundaries.transfer.2
    prompt: What should a comparison do with undisclosed details?
    options:
    - id: b
      text: Copy them from a similar open model
    - id: c
      text: Omit every known fact too
    - id: a
      text: Label them unknown and state the consequence
    answer: a
    feedback: Evidence boundaries make the comparison more reliable.
