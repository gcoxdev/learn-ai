assessment_families:
  - id: proprietary-model-evidence-boundaries.base
    objective_ref: objective.proprietary-model-evidence-boundaries
    task: base
    response_type: single_choice
    points: 1
    hint: Check whether the report itself states the claim, word for word, before labeling it.
    remediation_scene: proprietary-model-evidence-boundaries.s2
    variants:
      - id: proprietary-model-evidence-boundaries.base.1
        prompt: Does the GPT-4 report disclose an exact expert count?
        options:
          - id: c
            text: Only for vision inputs
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: The report withholds architectural specifics.
        retired: true
      - id: proprietary-model-evidence-boundaries.base.2
        prompt: Can the Gemini 1.5 Pro MoE label be supported by its report?
        options:
          - id: a
            text: 'Yes'
          - id: b
            text: No proprietary architecture can ever be known
          - id: c
            text: Only by guessing from latency
        answer: a
        feedback: A primary-source disclosure can establish a bounded fact.
        retired: true
  - id: proprietary-model-evidence-boundaries.transfer
    objective_ref: objective.proprietary-model-evidence-boundaries
    task: transfer
    response_type: single_choice
    points: 1
    hint: Decide whether the question needs architecture evidence or product evidence; measured rows can answer the second.
    remediation_scene: proprietary-model-evidence-boundaries.s6
    variants:
      - id: proprietary-model-evidence-boundaries.transfer.1
        prompt: Does a matching answer reveal a model’s exact training example?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only when the answer is long
        answer: a
        feedback: Behavior does not uniquely identify training provenance.
        retired: true
      - id: proprietary-model-evidence-boundaries.transfer.2
        prompt: What should a comparison do with undisclosed details?
        options:
          - id: b
            text: Copy them from a similar open model
          - id: c
            text: Omit every known fact too
          - id: a
            text: Label them unknown and state the consequence
        answer: a
        feedback: Evidence boundaries make the comparison more reliable.
        retired: true
  - id: proprietary-model-evidence-boundaries.base.v2
    objective_ref: objective.proprietary-model-evidence-boundaries
    task: base
    response_type: single_choice
    points: 1
    hint: Split each claim into the part a report states and the part it leaves blank. Only the stated part is documented.
    remediation_scene: proprietary-model-evidence-boundaries.s3
    variants:
      - id: proprietary-model-evidence-boundaries.base.v2.1
        prompt: Which of these does the GPT-4 technical report document?
        options:
          - id: b
            text: That it is a mixture of experts with a stated number of experts
          - id: a
            text: That it was pretrained on next-token prediction and fine-tuned with RLHF
          - id: c
            text: The number and type of accelerators used for its training run
        answer: a
        feedback: The report states the pretraining objective and RLHF fine-tuning, and explicitly withholds architecture, model size, hardware, and training compute.
      - id: proprietary-model-evidence-boundaries.base.v2.2
        prompt: How should an evidence table record Gemini 1.5 Pro's architecture?
        options:
          - id: a
            text: Sparse MoE as documented; expert count and size as undisclosed
          - id: b
            text: Sparse MoE and its expert count as documented, from the report
          - id: c
            text: Sparse MoE as inferred, since only its latency suggests it
        answer: a
        feedback: The report states the MoE family but not the layout or size. It's documented, not inferred from speed, and nothing in it gives an expert count.
      - id: proprietary-model-evidence-boundaries.base.v2.3
        prompt: What does the Gemini 1.5 report document about Flash relative to Pro?
        options:
          - id: c
            text: Flash has about a tenth of Pro's parameters and the same experts
          - id: b
            text: Flash is a smaller MoE, with fewer experts selected per token
          - id: a
            text: Flash is a decoder online-distilled from the much larger Pro
        answer: a
        feedback: The report calls Pro "much larger" and says Flash was distilled from it, but gives no ratio. It describes Flash as a Transformer decoder and never says it uses experts.
      - id: proprietary-model-evidence-boundaries.base.v2.4
        prompt: How did the GPT-4 team predict the model's final loss before the full run?
        options:
          - id: b
            text: By training GPT-4 briefly and extending its early loss curve
          - id: c
            text: By comparing its planned size with published losses of open models
          - id: a
            text: By fitting L(C) = aC^b + c to runs using up to 10,000× less compute
        answer: a
        feedback: They fitted a power law with an irreducible term to smaller runs trained the same way. The report says the prediction was made without using partial results from the big run, and outside models trained differently wouldn't fit the same curve.
  - id: proprietary-model-evidence-boundaries.transfer.v2
    objective_ref: objective.proprietary-model-evidence-boundaries
    task: transfer
    response_type: single_choice
    points: 1
    hint: Give the claim its label first (documented, measured, inferred, or undisclosed), then decide what you can safely do with it.
    remediation_scene: proprietary-model-evidence-boundaries.s5
    variants:
      - id: proprietary-model-evidence-boundaries.transfer.v2.1
        prompt: Two closed APIs each answer 18 of your 20 legal questions correctly. A colleague concludes they must share the same base model. How should you record this?
        options:
          - id: c
            text: As inferred shared lineage, since equal scores are strong evidence
          - id: a
            text: As measured agreement on these questions, with no architecture claim
          - id: b
            text: As undisclosed, since closed models can't be compared at all
        answer: a
        feedback: Different models, data, and tools can produce the same answers on a small test. The agreement itself is a useful measured row; the shared-model claim has no evidence behind it.
      - id: proprietary-model-evidence-boundaries.transfer.v2.2
        prompt: Your March evaluation of a vendor's model scored 82%. Rerunning the same prompts in September gives 76%. What do you check first?
        options:
          - id: a
            text: The model version string, date, and settings recorded for each run
          - id: b
            text: Whether the vendor switched to a mixture of experts in between
          - id: c
            text: Whether your prompts were memorized during the March run
        answer: a
        feedback: Services change behind the same name, so the logged version and settings are what make the runs comparable. You can't observe an architecture change, and memorizing your prompts is far less likely than a model update.
      - id: proprietary-model-evidence-boundaries.transfer.v2.3
        prompt: A widely shared post gives a closed model's exact parameter count, citing "sources familiar with the matter." What belongs in your evidence table?
        options:
          - id: b
            text: Documented, since the figure has been repeated by many outlets
          - id: c
            text: Measured, since reporters gathered the figure from insiders
          - id: a
            text: Undisclosed, with a note that an unofficial figure is circulating
        answer: a
        feedback: Repetition isn't a primary source, and you didn't measure it. You can note the rumor, but keep it out of calculations such as 6ND or memory estimates.
      - id: proprietary-model-evidence-boundaries.transfer.v2.4
        prompt: A finance team needs a cost estimate for a closed model before signing a contract. What's the sound approach?
        options:
          - id: c
            text: Assume a dense 1-trillion-parameter model and compute 2N FLOPs per token
          - id: b
            text: Borrow a similar open model's size and use its serving costs instead
          - id: a
            text: Measure price, tokens, and latency per request on their own workload
        answer: a
        feedback: Without a documented parameter count, any FLOP estimate rests on a guess, while price and latency per request can be measured directly on the work they'll run. A borrowed open model's costs describe that model, not this one.
  - id: proprietary-model-evidence-boundaries.calculate
    objective_ref: objective.proprietary-model-evidence-boundaries
    task: base
    response_type: numeric
    points: 1
    hint: "Cache = KiB per token × tokens. Convert KiB to GiB by dividing by 1,024 twice (1,048,576)."
    remediation_scene: proprietary-model-evidence-boundaries.s4
    absolute_tolerance: 1
    variants:
      - id: proprietary-model-evidence-boundaries.calculate.1
        prompt: A Llama-3.1-405B-shaped model caches 504 KiB per token. How many GiB would a 1,000,000-token prompt need?
        answer: 480.65
        feedback: 504 × 1,000,000 = 504,000,000 KiB, and ÷ 1,048,576 ≈ 480.7 GiB, for one request.
      - id: proprietary-model-evidence-boundaries.calculate.2
        prompt: A Llama-3.1-8B-shaped model caches 128 KiB per token. How many GiB would a 1,000,000-token prompt need?
        answer: 122.07
        feedback: 128 × 1,000,000 = 128,000,000 KiB, and ÷ 1,048,576 ≈ 122.1 GiB.
      - id: proprietary-model-evidence-boundaries.calculate.3
        prompt: A DeepSeek-V3-shaped model caches 68.625 KiB per token with MLA. How many GiB would a 10,000,000-token prompt need?
        answer: 654.46
        feedback: 68.625 × 10,000,000 = 686,250,000 KiB, and ÷ 1,048,576 ≈ 654.5 GiB. Even a compressed cache is large at 10 million tokens.
      - id: proprietary-model-evidence-boundaries.calculate.4
        prompt: A Llama-3.1-405B-shaped model caches 504 KiB per token. How many GiB would a 10,000,000-token prompt need?
        answer: 4806.5
        feedback: 504 × 10,000,000 = 5,040,000,000 KiB, and ÷ 1,048,576 ≈ 4,806.5 GiB, about 4.7 TiB.
