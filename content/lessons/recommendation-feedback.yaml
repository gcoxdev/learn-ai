schema_version: 0.2-draft
lesson:
  id: recommendation-feedback
  version: 0.3.0-draft
  title: Learn from choices that your system helped create
  state: draft
  summary: Follow how today’s ranking shapes tomorrow’s training data, and spot a feedback loop before trusting
    raw click totals.
  slot: M08.8
  category: learning
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.recommendation-feedback
  version: 1-draft
  statement: Recommendation feedback is shaped by exposure and position; offline evaluation, controlled exploration,
    and online outcomes must account for that selection process.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - recommendation-feedback.base
  - recommendation-feedback.transfer
  prerequisites:
  - anyOf:
    - objective.recommendation-models
  - anyOf:
    - objective.sampling-and-shift
scenes:
- id: recommendation-feedback.s1
  title: The system changes what can be observed
  type: explanation
  depth: intuition
  objective_refs:
  - objective.recommendation-feedback
  markdown: A ranking puts some items near the top and hides others. Clicks then reflect relevance, position,
    presentation, and available choices. Training on these clicks as if every item had equal exposure can reinforce
    the prior ranking. The data-generating process includes the recommender itself.
  text_mode: A ranking puts some items near the top and hides others. Clicks then reflect relevance, position,
    presentation, and available choices. Training on these clicks as if every item had equal exposure can reinforce
    the prior ranking. The data-generating process includes the recommender itself.
  bridges: []
- id: recommendation-feedback.s2
  title: Trace a simple feedback loop
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.recommendation-feedback
  markdown: 'A system initially favors popular item A over niche item B. A receives more impressions and therefore
    more clicks even if B would interest a subset of users. A learner reading raw click totals can conclude
    A should receive still more exposure. The resulting loop can suppress evidence about B.


    An **impression** means an item was shown. If A gets 50 clicks from 1,000 impressions and B gets 8 from
    100, A has more clicks but B has a higher click fraction: 8% versus 5%. Even those fractions need care
    if A and B were shown to different people or in different positions.'
  text_mode: 'A system initially favors popular item A over niche item B. A receives more impressions and therefore
    more clicks even if B would interest a subset of users. A learner reading raw click totals can conclude
    A should receive still more exposure. The resulting loop can suppress evidence about B.


    An **impression** means an item was shown. If A gets 50 clicks from 1,000 impressions and B gets 8 from
    100, A has more clicks but B has a higher click fraction: 8% versus 5%. Even those fractions need care
    if A and B were shown to different people or in different positions.'
  bridges: []
- id: recommendation-feedback.s3
  title: Account for how the records were collected
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.recommendation-feedback
  markdown: 'The **logging policy** is the rule that chose what was shown when the interaction records were
    collected. A **propensity** is an item’s exposure probability under that rule. Offline evaluation inherits
    what this policy did and did not show.


    Weighting rarely shown items more heavily can correct some selection effects when exposure probabilities
    are reliable and the required assumptions hold. **Overlap** means each alternative being compared had some
    chance to be observed. Weighting cannot recover responses to an item never offered to a group, and very
    large weights make estimates unstable.


    Carefully designed exploration or controlled experiments can collect missing evidence, within limits appropriate
    to the application.'
  text_mode: 'The **logging policy** is the rule that chose what was shown when the interaction records were
    collected. A **propensity** is an item’s exposure probability under that rule. Offline evaluation inherits
    what this policy did and did not show.


    Weighting rarely shown items more heavily can correct some selection effects when exposure probabilities
    are reliable and the required assumptions hold. **Overlap** means each alternative being compared had some
    chance to be observed. Weighting cannot recover responses to an item never offered to a group, and very
    large weights make estimates unstable.


    Carefully designed exploration or controlled experiments can collect missing evidence, within limits appropriate
    to the application.'
  bridges: []
- id: recommendation-feedback.s4
  title: Measure more than immediate clicks
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.recommendation-feedback
  markdown: 'Click optimization can promote sensational or repetitive content. Compare satisfaction, retention,
    diversity, coverage, and negative outcomes according to the actual product goal. Temporal evaluation and
    subgroup analysis reveal different failures. An online lift should be reported with its experimental conditions
    and uncertainty.


    **Online lift** means an improvement observed in a live comparison, often a randomized experiment. It must
    name the outcome: more clicks, for example, rather than automatically more satisfaction. Try describing
    a helpful recommendation that a person reads carefully without clicking anything else.'
  text_mode: 'Click optimization can promote sensational or repetitive content. Compare satisfaction, retention,
    diversity, coverage, and negative outcomes according to the actual product goal. Temporal evaluation and
    subgroup analysis reveal different failures. An online lift should be reported with its experimental conditions
    and uncertainty.


    **Online lift** means an improvement observed in a live comparison, often a randomized experiment. It must
    name the outcome: more clicks, for example, rather than automatically more satisfaction. Try describing
    a helpful recommendation that a person reads carefully without clicking anything else.'
  bridges: []
- id: recommendation-feedback.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.recommendation-feedback
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A recommender helps create the data it later learns from. Compare clicks in light of what was shown,
    where it appeared, and which people had a chance to see it.
- id: recommendation-feedback.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.recommendation-feedback
  markdown: A recommender helps create the data it later learns from. Compare clicks in light of what was shown,
    where it appeared, and which people had a chance to see it.
  text_mode: A recommender helps create the data it later learns from. Compare clicks in light of what was
    shown, where it appeared, and which people had a chance to see it.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - recommendation-feedback.s1
    - recommendation-feedback.s2
