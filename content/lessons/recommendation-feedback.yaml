schema_version: 0.2-draft
lesson:
  id: recommendation-feedback
  version: 0.1.0-draft
  title: Learn from choices that your system helped create
  state: draft
  summary: Recommendation feedback is shaped by exposure and position; offline evaluation, controlled exploration,
    and online outcomes must account for that selection process.
  slot: M08.8
  category: learning
  minutes: 12
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.recommendation-feedback
  version: 1-draft
  statement: Recommendation feedback is shaped by exposure and position; offline evaluation, controlled exploration,
    and online outcomes must account for that selection process.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - recommendation-feedback.base
  - recommendation-feedback.transfer
  prerequisites:
  - anyOf:
    - objective.recommendation-models
  - anyOf:
    - objective.sampling-and-shift
scenes:
- id: recommendation-feedback.s1
  title: The system changes what can be observed
  type: explanation
  depth: intuition
  objective_refs:
  - objective.recommendation-feedback
  markdown: A ranking puts some items near the top and hides others. Clicks then reflect relevance, position, presentation,
    and available choices. Training on these clicks as if every item had equal exposure can reinforce the prior
    ranking. The data-generating process includes the recommender itself.
  text_mode: A ranking puts some items near the top and hides others. Clicks then reflect relevance, position, presentation,
    and available choices. Training on these clicks as if every item had equal exposure can reinforce the prior
    ranking. The data-generating process includes the recommender itself.
  bridges: []
- id: recommendation-feedback.s2
  title: Trace a simple feedback loop
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.recommendation-feedback
  markdown: A system initially favors popular item A over niche item B. A receives more impressions and therefore
    more clicks even if B would interest a subset of users. A learner reading raw click totals can conclude A should
    receive still more exposure. The resulting loop can suppress evidence about B.
  text_mode: A system initially favors popular item A over niche item B. A receives more impressions and therefore
    more clicks even if B would interest a subset of users. A learner reading raw click totals can conclude A should
    receive still more exposure. The resulting loop can suppress evidence about B.
  bridges: []
- id: recommendation-feedback.s3
  title: Use evaluation that matches the question
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.recommendation-feedback
  markdown: Offline ranking metrics on logged interactions are useful but inherit the logging policy’s coverage.
    Propensity-based corrections require reliable exposure probabilities and overlap; large weights can create high
    variance. Carefully designed exploration or experiments can gather missing evidence, with appropriate limits
    for the application.
  text_mode: Offline ranking metrics on logged interactions are useful but inherit the logging policy’s coverage.
    Propensity-based corrections require reliable exposure probabilities and overlap; large weights can create high
    variance. Carefully designed exploration or experiments can gather missing evidence, with appropriate limits
    for the application.
  bridges: []
- id: recommendation-feedback.s4
  title: Measure more than immediate clicks
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.recommendation-feedback
  markdown: Click optimization can promote sensational or repetitive content. Compare satisfaction, retention, diversity,
    coverage, and negative outcomes according to the actual product goal. Temporal evaluation and subgroup analysis
    reveal different failures. An online lift should be reported with its experimental conditions and uncertainty.
  text_mode: Click optimization can promote sensational or repetitive content. Compare satisfaction, retention,
    diversity, coverage, and negative outcomes according to the actual product goal. Temporal evaluation and subgroup
    analysis reveal different failures. An online lift should be reported with its experimental conditions and uncertainty.
  bridges: []
- id: recommendation-feedback.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.recommendation-feedback
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: recommendation-feedback.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.recommendation-feedback
  markdown: Recommendation feedback is shaped by exposure and position; offline evaluation, controlled exploration,
    and online outcomes must account for that selection process.
  text_mode: Recommendation feedback is shaped by exposure and position; offline evaluation, controlled exploration,
    and online outcomes must account for that selection process.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - recommendation-feedback.s1
    - recommendation-feedback.s2
    - recommendation-feedback.s3
    - recommendation-feedback.s4
    - recommendation-feedback.check
    - recommendation-feedback.recap
    gate_refs:
    - gate.core
assessment_families:
- id: recommendation-feedback.base
  objective_ref: objective.recommendation-feedback
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace a simple feedback loop: trace the inputs, operation, and result before choosing.'
  remediation_scene: recommendation-feedback.s2
  variants:
  - id: recommendation-feedback.base.1
    prompt: Why can raw click count favor a frequently shown item?
    options:
    - id: b
      text: Clicks reveal preference independently of all presentation
    - id: c
      text: Unshown items receive automatic clicks
    - id: a
      text: Exposure affects opportunities to click
    answer: a
    feedback: Observed behavior depends on what users were offered.
  - id: recommendation-feedback.base.2
    prompt: What does position bias describe?
    options:
    - id: c
      text: A guarantee that the first item is best
    - id: a
      text: Ranking position influences observed interaction
    - id: b
      text: Only the item’s geographic location
    answer: a
    feedback: Visibility and attention vary with presentation position.
- id: recommendation-feedback.transfer
  objective_ref: objective.recommendation-feedback
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Measure more than immediate clicks: trace the inputs, operation, and result before choosing.'
  remediation_scene: recommendation-feedback.s4
  variants:
  - id: recommendation-feedback.transfer.1
    prompt: A logging policy never showed item B to a group. Can weighting alone fully establish their response
      to B?
    options:
    - id: c
      text: Only if the weights are normalized
    - id: a
      text: No; missing overlap limits identification
    - id: b
      text: Yes; any absent outcome can be recovered exactly
    answer: a
    feedback: Importance adjustments need relevant observations and supported exposure probabilities.
  - id: recommendation-feedback.transfer.2
    prompt: Clicks rise while user satisfaction falls. What should the team reconsider?
    options:
    - id: a
      text: The objective and broader outcome evaluation
    - id: b
      text: Only increasing click optimization further
    - id: c
      text: The existence of arithmetic
    answer: a
    feedback: Proxy metrics can diverge from the intended user benefit.
