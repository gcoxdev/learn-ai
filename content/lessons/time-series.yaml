schema_version: 0.2-draft
lesson:
  id: time-series
  version: 0.3.0-draft
  title: Predict the future without borrowing information from it
  state: draft
  summary: Forecast the next observation using only information that was available when the prediction was
    made.
  slot: M13.1
  category: learning
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.time-series
  version: 1-draft
  statement: Time-series forecasting uses ordered observations, horizons, and temporal features; seasonal baselines
    and rolling evaluation expose leakage and changing behavior.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - time-series.base
  - time-series.transfer
  prerequisites:
  - anyOf:
    - objective.splits-and-leakage
  - anyOf:
    - objective.baselines-and-success
scenes:
- id: time-series.s1
  title: What was known when the forecast was made?
  type: explanation
  depth: intuition
  objective_refs:
  - objective.time-series
  markdown: 'A **time series** records observations in order, such as hourly electricity demand. The **forecast
    origin** is when you make the prediction; the **horizon** is how far ahead it reaches. At noon, a one-hour-ahead
    forecast predicts 1 p.m.


    The noon measurement is available, but the 1 p.m. measurement is not. A future holiday can be a valid input
    if its calendar date was already known at noon. The rule is to use information available at the forecast
    origin, not to exclude every fact about the future.'
  text_mode: 'A **time series** records observations in order, such as hourly electricity demand. The **forecast
    origin** is when you make the prediction; the **horizon** is how far ahead it reaches. At noon, a one-hour-ahead
    forecast predicts 1 p.m.


    The noon measurement is available, but the 1 p.m. measurement is not. A future holiday can be a valid input
    if its calendar date was already known at noon. The rule is to use information available at the forecast
    origin, not to exclude every fact about the future.'
  bridges: []
- id: time-series.s2
  title: Start with a temporal baseline
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.time-series
  markdown: A persistence baseline predicts the latest observed value. A seasonal baseline reuses a value from
    the corresponding previous cycle, such as last Monday for next Monday. If the last four weekly values are
    10, 12, 11, and 13, a one-week persistence forecast is 13. More complex models must improve a relevant
    baseline.
  text_mode: A persistence baseline predicts the latest observed value. A seasonal baseline reuses a value
    from the corresponding previous cycle, such as last Monday for next Monday. If the last four weekly values
    are 10, 12, 11, and 13, a one-week persistence forecast is 13. More complex models must improve a relevant
    baseline.
  bridges: []
- id: time-series.s3
  title: Separate recurring patterns from change
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.time-series
  markdown: 'A **trend** is a longer-term movement. **Seasonality** is a pattern that repeats over a stated
    period. Calendar effects, missing observations, and changes in the underlying process can complicate both.


    A model may use earlier measurements, called **lagged values**, alongside other available predictors. Smoothing
    and normalization must also respect time: a calculation that looks ahead can accidentally include the outcome
    being predicted.'
  text_mode: 'A **trend** is a longer-term movement. **Seasonality** is a pattern that repeats over a stated
    period. Calendar effects, missing observations, and changes in the underlying process can complicate both.


    A model may use earlier measurements, called **lagged values**, alongside other available predictors. Smoothing
    and normalization must also respect time: a calculation that looks ahead can accidentally include the outcome
    being predicted.'
  bridges: []
- id: time-series.s4
  title: Evaluate in the order information arrives
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.time-series
  markdown: '**Rolling-origin evaluation** moves the forecast origin forward. For example, train on days 1–7
    and predict day 8, then train on days 1–8 and predict day 9. Refit learned preprocessing only on the training
    portion at each step. For longer horizons, every predicted target must remain after that step’s origin.


    Report errors by horizon, series, and important conditions. Overlapping windows can make results dependent.
    A random row split may test filling gaps among familiar periods rather than forecasting a genuinely later
    period.'
  text_mode: '**Rolling-origin evaluation** moves the forecast origin forward. For example, train on days 1–7
    and predict day 8, then train on days 1–8 and predict day 9. Refit learned preprocessing only on the training
    portion at each step. For longer horizons, every predicted target must remain after that step’s origin.


    Report errors by horizon, series, and important conditions. Overlapping windows can make results dependent.
    A random row split may test filling gaps among familiar periods rather than forecasting a genuinely later
    period.'
  bridges: []
- id: time-series.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.time-series
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A forecast must use what was known when it was made. Compare temporal baselines and evaluate by
    moving forward through time as the real system would.
- id: time-series.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.time-series
  markdown: A forecast must use what was known when it was made. Compare temporal baselines and evaluate by
    moving forward through time as the real system would.
  text_mode: A forecast must use what was known when it was made. Compare temporal baselines and evaluate by
