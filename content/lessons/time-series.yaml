schema_version: 0.2-draft
lesson:
  id: time-series
  version: 0.4.0-draft
  title: Predict the future without borrowing information from it
  state: draft
  summary: A café has to order tomorrow's milk tonight. Beat "same as last week" at forecasting its rush hours, and learn why shuffling the data makes any forecast look brilliant.
  slot: M13.1
  category: learning
  sources:
    - title: "Forecasting: Principles and Practice, 3rd edition, §5.2 Some simple forecasting methods (Hyndman & Athanasopoulos, 2021)"
      url: https://otexts.com/fpp3/simple-methods.html
    - title: "Forecasting: Principles and Practice, 3rd edition, §5.10 Time series cross-validation (Hyndman & Athanasopoulos, 2021)"
      url: https://otexts.com/fpp3/tscv.html
    - title: Dive into Deep Learning — authors’ open textbook
      url: https://d2l.ai/
    - title: An Introduction to Statistical Learning — authors’ materials
      url: https://www.statlearning.com/
objectives:
  - id: objective.time-series
    version: 2-draft
    statement: Time-series forecasting uses ordered observations, horizons, and temporal features; seasonal baselines and rolling evaluation expose leakage and changing behavior.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - time-series.base.v2
      - time-series.transfer.v2
      - time-series.calc.v2
    prerequisites:
      - anyOf:
          - objective.splits-and-leakage
      - anyOf:
          - objective.baselines-and-success
scenes:
  - id: time-series.s1
    title: Order the milk before the rush
    type: explanation
    depth: intuition
    objective_refs:
      - objective.time-series
    markdown: |-
      It's 3 p.m. on Tuesday and Pebble Café is closing. Before she leaves, Ana has to order milk and decide how many croissants to bake for Wednesday. Here is what she sold on Tuesday, hour by hour:

      | Hour starting | 7 | 8 | 9 | 10 | 11 | 12 | 1 | 2 |
      | --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
      | Cups sold | 22 | 51 | 33 | 24 | 27 | 44 | 28 | 15 |

      A list of measurements kept in time order like this is a **time series**. Ana's problem is a forecast, and every forecast has two coordinates. The **forecast origin** is the moment the forecast is made: Tuesday at 3 p.m. The **horizon** is how far ahead each prediction reaches. Wednesday's 7 a.m. hour is one step ahead; Wednesday's 2 p.m. hour is eight steps ahead.

      The golden rule: a forecast may use only what was known at its origin. That rules out less than you might think:

      - **Allowed:** every sale up to 3 p.m. Tuesday, the fact that Wednesday is market day in town (it's on the calendar), and the weather forecast published Tuesday afternoon.
      - **Not allowed:** Wednesday's actual rainfall, Wednesday's sales, or any number calculated from them.

      The weather is the subtle case. The rain *forecast* is fair game because Ana has it at 3 p.m. The rain that actually falls isn't, even though it will sit in the same spreadsheet row by Thursday.
    bridges: []
  - id: time-series.s2
    title: Two forecasts you can write in one line
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.time-series
    markdown: |-
      Before building anything clever, write down the forecasts any fancy model has to beat. Café sales follow a **season**: a pattern that repeats with a fixed period, here one day of 8 opening hours.

      - The **naive forecast** repeats the last value you saw: 15 cups, for every hour of Wednesday.
      - The **seasonal naive forecast** repeats the value from one period ago. Wednesday at 8 a.m. gets Tuesday's 8 a.m. value, 51.

      Here are both forecasts against what Wednesday actually sold:

      | Hour | Wed actual | Naive | Miss | Seasonal naive | Miss |
      | ---: | ---: | ---: | ---: | ---: | ---: |
      | 7 | 21 | 15 | 6 | 22 | 1 |
      | 8 | 50 | 15 | 35 | 51 | 1 |
      | 9 | 36 | 15 | 21 | 33 | 3 |
      | 10 | 23 | 15 | 8 | 24 | 1 |
      | 11 | 26 | 15 | 11 | 27 | 1 |
      | 12 | 46 | 15 | 31 | 44 | 2 |
      | 1 | 31 | 15 | 16 | 28 | 3 |
      | 2 | 13 | 15 | 2 | 15 | 2 |

      The **mean absolute error (MAE)** is the average size of the misses, ignoring sign. Naive: 130 ÷ 8 = 16.25 cups. Seasonal naive: 14 ÷ 8 = 1.75 cups. Copying the quiet 2 p.m. hour into the morning rush is a terrible idea, and the seasonal version avoids it for free.

      :::predict It's Friday at close, and on weekends the rush comes at 11 a.m. instead of 8 a.m. What will "same hour yesterday" predict for Saturday, and what should Ana use instead?
      It copies Friday's weekday profile, so it expects a big 8 a.m. rush that never comes and misses the late-morning brunch crowd. Café sales have a second season: the week. Use "same hour last Saturday" (a period of 7 × 8 = 56 opening hours) instead.
      :::

      :::papers The seasonal naive forecast
      Forecasting textbooks write it as
      $$\hat{y}_{T+h \mid T} = y_{T+h-m(k+1)}, \qquad k = \left\lfloor \tfrac{h-1}{m} \right\rfloor$$
      $T$ is the origin, $h$ the horizon, and $m$ the season length. For Ana, $m = 8$ and $h = 2$ (Wednesday 8 a.m.): $k = 0$, so the forecast is $y_{T-6}$, which is Tuesday's 8 a.m. value, 51. The $k$ term only matters when the horizon reaches past one full season and you have to copy from further back.
      :::
    bridges: []
  - id: time-series.s3
    title: Lag features that don't peek
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.time-series
    markdown: |-
      A learned model will want more than one number. Pebble Café's sales have a **trend**, a slow drift (more regulars since an office opened nearby), and two **seasonalities**, the daily rush and the weekend shape. Models usually see these through **lag features**: past values of the series itself, such as the same hour yesterday (lag 8) or the same hour last week (lag 56).

      Each feature has to pass the golden rule from the first scene. Check them against a 3 p.m. Tuesday origin:

      | Feature for Wednesday 9 a.m. | Known at the origin? |
      | --- | --- |
      | Sales at 9 a.m. Tuesday (lag 8) | Yes |
      | Sales at 9 a.m. last Wednesday (lag 56) | Yes |
      | Weather forecast issued Tuesday afternoon | Yes |
      | Average of the 8, 9, and 10 a.m. Wednesday sales | No: it contains the answer |
      | Sales scaled by the mean of the whole data set | No: that mean includes future weeks |

      The last two rows are how real projects leak. A "smoothed sales" column built with a centered window quietly averages in the hour being predicted. Scaling with statistics from the whole file lets a busy December nudge every earlier row. The fix is the same for both: compute every feature, and every scaling number, from data before the origin.

      :::mixup "It's just a data set. Shuffle the rows and hold out a random 20% for testing."
      Then a held-out Wednesday 9 a.m. sits between a Tuesday and a Thursday that are both in the training data. The model gets to see both sides of the gap and fill it in, which is far easier than forecasting a day nobody has seen. The test score looks great, and the real forecasts will be worse. For time series, test on periods that come *after* everything you trained on, as the splits lesson warned.
      :::
    bridges: []
  - id: time-series.s4
    title: Backtest by replaying the past one day at a time
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.time-series
    markdown: |-
      One Wednesday is a lucky or unlucky day. To judge a method, Ana needs many forecasts, each made exactly the way it would have been made in real life. **Rolling-origin evaluation**, often called a **backtest**, does that. Pretend it's the end of day 14: fit on days 1–14, forecast day 15, and score it. Then move the origin to the end of day 15, fit on days 1–15, forecast day 16, and so on. Every forecast uses only its own past.

      The program below backtests three baselines on four weeks of simulated Pebble Café sales, with weekday and weekend profiles plus random noise. It makes 14 day-ahead forecasts per method.

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      weekday = np.array([20, 50, 35, 23, 26, 44, 30, 14])   # cups sold, 7 a.m. to 2 p.m.
      weekend = np.array([8, 15, 30, 45, 48, 40, 25, 12])
      days = [weekend if d % 7 in (5, 6) else weekday for d in range(28)]
      sales = np.concatenate([p + rng.normal(0, 3, 8) for p in days]).round()

      H = 8                                   # forecast the whole next day (8 hours)
      errors = {"naive": [], "seasonal m=8": [], "seasonal m=56": []}
      for origin in range(14 * H, 28 * H, H):         # walk forward one day at a time
          past, actual = sales[:origin], sales[origin:origin + H]
          forecasts = {"naive": np.repeat(past[-1], H),   # last hour, repeated
                       "seasonal m=8": past[-8:],         # same hour yesterday
                       "seasonal m=56": past[-56:-48]}    # same hour last week
          for name, f in forecasts.items():
              errors[name].append(np.abs(actual - f).mean())

      for name, e in errors.items():
          print(f"{name:14s} MAE over {len(e)} forecast days: {np.mean(e):5.2f} cups")
      ```

      The weekly seasonal naive wins, 3.29 cups against 6.37 for "same hour yesterday" and 17.44 for plain naive. That 3.29 is now the bar: a neural network that can't beat it in the same backtest isn't worth running. Try setting `weekend = weekday`. With no weekend shape, "same hour yesterday" nearly ties the weekly version (3.35 against 3.29).

      Report the error by horizon too: 7 a.m. is one step from the origin and 2 p.m. is eight, and the busy hours drive the milk order.
    bridges: []
    diagram:
      caption: Rolling-origin evaluation. Each fold trains only on the past, forecasts the next day, and adds its error to the average.
      description: Three folds are stacked vertically. Fold one trains on days 1 to 14 and forecasts day 15. Fold two trains on days 1 to 15 and forecasts day 16. Fold three trains on days 1 to 16 and forecasts day 17. Each forecast is scored against the actual day, and all three scores flow into one average error.
      nodes:
        - id: train1
          label: Train on days 1–14
          col: 0
          row: 0
          tone: data
        - id: fc1
          label: Forecast day 15
          col: 2
          row: 0
          tone: accent
        - id: train2
          label: Train on days 1–15
          col: 0
          row: 1
          tone: data
        - id: fc2
          label: Forecast day 16
          col: 2
          row: 1
          tone: accent
        - id: train3
          label: Train on days 1–16
          col: 0
          row: 2
          tone: data
        - id: fc3
          label: Forecast day 17
          col: 2
          row: 2
          tone: accent
        - id: score
          label: Average error
          note: MAE over all folds
          col: 4
          row: 1
      edges:
        - from: train1
          to: fc1
        - from: train2
          to: fc2
        - from: train3
          to: fc3
        - from: fc1
          to: score
          label: score vs actual
        - from: fc2
          to: score
        - from: fc3
          to: score
  - id: time-series.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.time-series
    markdown: A bike-rental shop, an emergency room, an ice-cream kiosk, and a few MAE calculations test whether you can forecast from the past and judge a forecast fairly.
    takeaway: |-
      A forecast may use only what was known at its origin. Start from the seasonal naive baseline, and judge every method with a backtest that walks forward through time.
  - id: time-series.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.time-series
    markdown: |-
      A forecast must use what was known when it was made. Compare temporal baselines and evaluate by moving forward through time as the real system would.
