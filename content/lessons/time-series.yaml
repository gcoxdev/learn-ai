assessment_families:
- id: time-series.base
  objective_ref: objective.time-series
  task: base
  response_type: single_choice
  points: 1
  hint: 'Start with a temporal baseline: trace the inputs, operation, and result before choosing.'
  remediation_scene: time-series.s2
  variants:
  - id: time-series.base.1
    prompt: What does a forecast horizon specify?
    options:
    - id: a
      text: How far into the future the prediction targets
    - id: b
      text: Only the number of model layers
    - id: c
      text: The color of the time axis
    answer: a
    feedback: The horizon defines the temporal distance from forecast origin to target.
  - id: time-series.base.2
    prompt: Latest value is 18. What does a simple persistence forecast predict?
    options:
    - id: b
      text: 0 necessarily
    - id: c
      text: The average of all future values
    - id: a
      text: '18'
    answer: a
    feedback: Persistence reuses the most recent observation.
- id: time-series.transfer
  objective_ref: objective.time-series
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate as forecasting would operate: trace the inputs, operation, and result before choosing.'
  remediation_scene: time-series.s4
  variants:
  - id: time-series.transfer.1
    prompt: A rolling feature averages yesterday, today, and tomorrow for a prediction made today. What is
      wrong?
    options:
    - id: b
      text: It has too few arithmetic operations
    - id: c
      text: It is automatically seasonal
    - id: a
      text: It uses future information
    answer: a
    feedback: The feature crosses the prediction-time information boundary.
  - id: time-series.transfer.2
    prompt: Why evaluate errors separately at one-hour and one-week horizons?
    options:
    - id: c
      text: Only the output file size changes
    - id: a
      text: The tasks have different uncertainty and available predictive signal
    - id: b
      text: All horizons must have equal error
    answer: a
    feedback: Forecast difficulty and practical consequences vary with horizon.
