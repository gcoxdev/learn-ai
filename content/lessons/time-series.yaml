assessment_families:
  - id: time-series.base
    objective_ref: objective.time-series
    task: base
    response_type: single_choice
    points: 1
    hint: 'Start with a temporal baseline: trace the inputs, operation, and result before choosing.'
    remediation_scene: time-series.s2
    variants:
      - id: time-series.base.1
        prompt: What does a forecast horizon specify?
        options:
          - id: a
            text: How far into the future the prediction targets
          - id: b
            text: Only the number of model layers
          - id: c
            text: The color of the time axis
        answer: a
        feedback: The horizon defines the temporal distance from forecast origin to target.
        retired: true
      - id: time-series.base.2
        prompt: Latest value is 18. What does a simple persistence forecast predict?
        options:
          - id: b
            text: 0 necessarily
          - id: c
            text: The average of all future values
          - id: a
            text: '18'
        answer: a
        feedback: Persistence reuses the most recent observation.
        retired: true
  - id: time-series.transfer
    objective_ref: objective.time-series
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate as forecasting would operate: trace the inputs, operation, and result before choosing.'
    remediation_scene: time-series.s4
    variants:
      - id: time-series.transfer.1
        prompt: A rolling feature averages yesterday, today, and tomorrow for a prediction made today. What is wrong?
        options:
          - id: b
            text: It has too few arithmetic operations
          - id: c
            text: It is automatically seasonal
          - id: a
            text: It uses future information
        answer: a
        feedback: The feature crosses the prediction-time information boundary.
        retired: true
      - id: time-series.transfer.2
        prompt: Why evaluate errors separately at one-hour and one-week horizons?
        options:
          - id: c
            text: Only the output file size changes
          - id: a
            text: The tasks have different uncertainty and available predictive signal
          - id: b
            text: All horizons must have equal error
        answer: a
        feedback: Forecast difficulty and practical consequences vary with horizon.
        retired: true
  - id: time-series.base.v2
    objective_ref: objective.time-series
    task: base
    response_type: single_choice
    points: 1
    hint: Stand at the forecast origin. Which numbers exist yet, and which value does each baseline copy?
    remediation_scene: time-series.s2
    variants:
      - id: time-series.base.v2.1
        prompt: At 9 p.m. a bike-rental shop forecasts tomorrow's 5 p.m. rentals. Today it rented 40 bikes at 5 p.m. and 12 at 8 p.m.; last week, the same weekday had 38 at 5 p.m. What does the daily seasonal naive forecast say?
        options:
          - id: b
            text: 12, the most recent hour the shop recorded
          - id: c
            text: 38, the same hour on the same weekday last week
          - id: a
            text: 40, the same hour one day earlier
        answer: a
        feedback: A daily seasonal naive forecast copies the value one season (one day) back, so 5 p.m. today predicts 5 p.m. tomorrow. 12 is the plain naive forecast, and 38 would be the weekly seasonal version.
      - id: time-series.base.v2.2
        prompt: Ana forecasts Wednesday's sales at 3 p.m. on Tuesday. Which input may her model use?
        options:
          - id: c
            text: Wednesday's recorded rainfall from the weather station
          - id: a
            text: The weather forecast for Wednesday published Tuesday morning
          - id: b
            text: Sales scaled by the average of the full year's data
        answer: a
        feedback: A published forecast exists at the origin, so it's fair to use. The recorded rainfall only exists after Wednesday, and a full-year average includes future weeks, so both leak the future.
      - id: time-series.base.v2.3
        prompt: For Pebble Café, the naive forecast misses Wednesday's 8 a.m. hour by 35 cups while the seasonal naive misses by 1. What causes the naive forecast's huge miss?
        options:
          - id: b
            text: It uses information that wasn't available at the forecast origin
          - id: a
            text: It copies the quiet 2 p.m. hour into the morning rush hour
          - id: c
            text: Its horizon of one hour is too short for a daily pattern
        answer: a
        feedback: The naive forecast repeats the last value seen, 15 cups at 2 p.m., for every hour, so it ignores the daily shape. It uses only past data, and 8 a.m. is two steps ahead, not one.
      - id: time-series.base.v2.4
        prompt: A feature called "smoothed sales" is the average of hours t − 1, t, and t + 1, and the model predicts sales at hour t. What's wrong with it?
        options:
          - id: a
            text: It averages in the target hour and the hour after it
          - id: b
            text: Averaging three hours removes the daily seasonal pattern
          - id: c
            text: It needs a longer window, such as a full day of hours
        answer: a
        feedback: A centered window reaches into hours t and t + 1, which aren't known when forecasting hour t, so the feature leaks the answer. A longer centered window would leak even more; a trailing window (t − 3 to t − 1) is safe.
  - id: time-series.transfer.v2
    objective_ref: objective.time-series
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask whether each test forecast was made the way it would be in real use, from the past only, with the future still unknown.
    remediation_scene: time-series.s4
    variants:
      - id: time-series.transfer.v2.1
        prompt: A hospital shuffles three years of daily emergency-room visits, trains on a random 80%, and tests on the rest. Test error is low, but live forecasts are much worse. What is the most likely reason?
        options:
          - id: c
            text: The test set was too small to give a stable error estimate
          - id: b
            text: The model overfit to a handful of unusual holiday days
          - id: a
            text: Test days sat between training days, so it filled gaps
        answer: a
        feedback: With a random split, each test day has training days on both sides, so the model interpolates instead of forecasting. A backtest that only trains on the past gives an honest error. A small test set would make the score noisy, not consistently too rosy.
      - id: time-series.transfer.v2.2
        prompt: An ice-cream kiosk's daily sales are high every weekend and low on weekdays. A team builds a neural forecaster. Which baseline should it be required to beat?
        options:
          - id: b
            text: Yesterday's sales, repeated for tomorrow
          - id: a
            text: Sales on the same weekday one week earlier
          - id: c
            text: The average daily sales over the past year
        answer: a
        feedback: The strongest repeating pattern is weekly, so the weekly seasonal naive forecast is the fair bar. Yesterday's value predicts a weekday for Saturday, and a yearly average ignores the weekend pattern completely.
      - id: time-series.transfer.v2.3
        prompt: Each Sunday, a grocery chain forecasts the next seven days of demand. Which evaluation copies how the forecasts will really be used?
        options:
          - id: a
            text: For each past Sunday, fit on earlier data and score the next 7 days
          - id: b
            text: Split the days into five random folds and cross-validate the model
          - id: c
            text: Fit on all the data, then score the model on the most recent month
        answer: a
        feedback: A rolling-origin backtest repeats the real routine many times and never lets a forecast see its own future. Random folds mix future days into training, and scoring on data the model was fitted to measures memory, not forecasting.
      - id: time-series.transfer.v2.4
        prompt: Before running a backtest, a team standardizes every value using the mean and standard deviation of the full three-year file. What should they change?
        options:
          - id: c
            text: Compute a separate standard deviation for each hour of the day
          - id: a
            text: Recompute the scaling at each origin from earlier data only
          - id: b
            text: Skip scaling, since it removes the seasonal pattern from sales
        answer: a
        feedback: Statistics from the full file include future values, so each fold's inputs quietly carry information from after its origin. Refit the scaling on each fold's past. Scaling doesn't remove seasonality, and per-hour statistics from the full file would leak the same way.
  - id: time-series.calc.v2
    objective_ref: objective.time-series
    task: base
    response_type: numeric
    points: 1
    hint: Write each forecast next to its actual value, take the size of each miss (ignore the sign), then average the misses.
    remediation_scene: time-series.s2
    absolute_tolerance: 0.01
    variants:
      - id: time-series.calc.v2.1
        prompt: 'Yesterday a café sold 30, 52, 41, and 18 cups in its first four hours. Today it sold 28, 55, 41, and 22. What is the MAE of the seasonal naive forecast (same hour yesterday) for these four hours?'
        answer: 2.25
        feedback: The misses are 2, 3, 0, and 4, which add to 9. Dividing by 4 hours gives 2.25 cups.
      - id: time-series.calc.v2.2
        prompt: 'A café''s last recorded hour sold 16 cups. The next four hours actually sell 20, 48, 35, and 22. What is the MAE of the naive forecast over these four hours?'
        answer: 15.25
        feedback: The naive forecast is 16 for every hour. The misses are 4, 32, 19, and 6, which add to 61, and 61 ÷ 4 = 15.25 cups.
      - id: time-series.calc.v2.3
        prompt: 'Last Saturday a café sold 10, 16, 31, and 44 cups in its first four hours. This Saturday it sold 8, 15, 30, and 45. What is the MAE of the weekly seasonal naive forecast for these hours?'
        answer: 1.25
        feedback: The misses are 2, 1, 1, and 1, which add to 5, and 5 ÷ 4 = 1.25 cups.
      - id: time-series.calc.v2.4
        prompt: A model forecasts 40 cups for each of three hours. The hours actually sell 38, 45, and 33. What is its MAE? Give two decimal places.
        answer: 4.67
        feedback: The misses are 2, 5, and 7, which add to 14, and 14 ÷ 3 ≈ 4.67 cups.
