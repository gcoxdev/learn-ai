schema_version: 0.2-draft
lesson:
  id: time-series
  version: 0.2.0-draft
  title: Predict the future without borrowing information from it
  state: draft
  summary: Forecast the next observation using only information that was available when the prediction was
    made.
  slot: M13.1
  category: learning
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.time-series
  version: 1-draft
  statement: Time-series forecasting uses ordered observations, horizons, and temporal features; seasonal baselines
    and rolling evaluation expose leakage and changing behavior.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - time-series.base
  - time-series.transfer
  prerequisites:
  - anyOf:
    - objective.splits-and-leakage
  - anyOf:
    - objective.baselines-and-success
scenes:
- id: time-series.s1
  title: Order is part of the data
  type: explanation
  depth: intuition
  objective_refs:
  - objective.time-series
  markdown: 'A time series records observations across time, such as hourly electricity demand. A forecast
    horizon specifies how far ahead to predict. Features must be available at the forecast origin. A measurement
    collected tomorrow cannot fairly support a prediction claimed to be made today.


    The **forecast origin** is the time you make the prediction. The **horizon** is how far ahead it reaches.
    At noon, a one-hour-ahead forecast predicts 1 p.m. Today''s noon measurement is available; today''s 1 p.m.
    measurement is not. A future holiday date can be a valid feature if the calendar was already known at noon.'
  text_mode: 'A time series records observations across time, such as hourly electricity demand. A forecast
    horizon specifies how far ahead to predict. Features must be available at the forecast origin. A measurement
    collected tomorrow cannot fairly support a prediction claimed to be made today.


    The **forecast origin** is the time you make the prediction. The **horizon** is how far ahead it reaches.
    At noon, a one-hour-ahead forecast predicts 1 p.m. Today''s noon measurement is available; today''s 1 p.m.
    measurement is not. A future holiday date can be a valid feature if the calendar was already known at noon.'
  bridges: []
- id: time-series.s2
  title: Start with a temporal baseline
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.time-series
  markdown: A persistence baseline predicts the latest observed value. A seasonal baseline reuses a value from
    the corresponding previous cycle, such as last Monday for next Monday. If the last four weekly values are
    10, 12, 11, and 13, a one-week persistence forecast is 13. More complex models must improve a relevant
    baseline.
  text_mode: A persistence baseline predicts the latest observed value. A seasonal baseline reuses a value
    from the corresponding previous cycle, such as last Monday for next Monday. If the last four weekly values
    are 10, 12, 11, and 13, a one-week persistence forecast is 13. More complex models must improve a relevant
    baseline.
  bridges: []
- id: time-series.s3
  title: Separate trend, seasonality, and noise
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.time-series
  markdown: 'Trend is a longer-term movement; seasonality is a repeating pattern under a stated period. Calendar
    effects, missing intervals, and structural changes can complicate both. A model can use lagged values and
    external predictors, but smoothing or normalization must not include future data inadvertently.


    For a simple rolling test, train on days 1–7 and predict day 8. Next train on days 1–8 and predict day
    9. Refit learned preprocessing using only the training portion at each step. For a multi-day horizon, keep
    every target after that step''s forecast origin. This reproduces the direction information actually arrives.'
  text_mode: 'Trend is a longer-term movement; seasonality is a repeating pattern under a stated period. Calendar
    effects, missing intervals, and structural changes can complicate both. A model can use lagged values and
    external predictors, but smoothing or normalization must not include future data inadvertently.


    For a simple rolling test, train on days 1–7 and predict day 8. Next train on days 1–8 and predict day
    9. Refit learned preprocessing using only the training portion at each step. For a multi-day horizon, keep
    every target after that step''s forecast origin. This reproduces the direction information actually arrives.'
  bridges: []
- id: time-series.s4
  title: Evaluate as forecasting would operate
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.time-series
  markdown: Rolling-origin evaluation repeatedly trains or updates on past information and predicts later intervals.
    Report error by horizon, series, and important regimes. Overlapping windows can create dependence. A random
    row split often tests interpolation across time rather than the intended future forecasting task.
  text_mode: Rolling-origin evaluation repeatedly trains or updates on past information and predicts later
    intervals. Report error by horizon, series, and important regimes. Overlapping windows can create dependence.
    A random row split often tests interpolation across time rather than the intended future forecasting task.
  bridges: []
- id: time-series.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.time-series
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Time-series forecasting uses ordered observations, horizons, and temporal features; seasonal baselines
    and rolling evaluation expose leakage and changing behavior.
- id: time-series.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.time-series
  markdown: Time-series forecasting uses ordered observations, horizons, and temporal features; seasonal baselines
