assessment_families:
  - response_type: numeric
    hint: A logarithm asks which exponent produces the given positive number.
    variants:
      - prompt: What is log₂(16)? Enter the exponent.
        answer: 4
        feedback: 2 × 2 × 2 × 2 = 16, so the exponent is 4.
        id: powers-logs.base.1
        retired: true
      - prompt: What is 3 raised to the power 3?
        answer: 27
        feedback: Three factors of 3 give 3 × 3 × 3 = 27, not 3 × 3 = 9.
        id: powers-logs.base.2
        retired: true
    id: powers-logs.base
    objective_ref: objective.powers-logs
    task: base
    points: 1
    remediation_scene: powers-logs.s1
  - response_type: single_choice
    hint: Exponentiation produces positive values; normalization divides by their positive total.
    variants:
      - prompt: Scores are [ln 3, 0]. What does exponentiation followed by normalization produce?
        options:
          - id: answer
            text: '[0.75, 0.25]'
          - id: a
            text: '[3, 0]'
          - id: b
            text: '[0.5, 0.5]'
        answer: answer
        feedback: Exponentiation gives [3, 1], and their total is 4. The normalized shares are 3/4 and 1/4.
        id: powers-logs.transfer.1
        retired: true
      - prompt: Subtracting the same constant from every finite score leaves softmax unchanged. Why?
        options:
          - id: a
            text: Exponentiation turns every shifted score into zero.
          - id: b
            text: Subtracting a constant always preserves the original raw scores.
          - id: answer
            text: Every exponential gains the same multiplicative factor, which cancels in normalization.
        answer: answer
        feedback: The raw scores do change. Their exponentials scale together, so each exponential divided by the total retains the same share.
        id: powers-logs.transfer.2
        retired: true
    id: powers-logs.transfer
    objective_ref: objective.powers-logs
    task: transfer
    points: 1
    remediation_scene: powers-logs.s1
  - id: powers-logs.base.v2
    objective_ref: objective.powers-logs
    task: base
    response_type: numeric
    points: 1
    hint: For a power, multiply the base by itself exponent-many times (a negative exponent means one over). For a log, ask which power of the base gives the number.
    remediation_scene: powers-logs.s2
    absolute_tolerance: 1e-6
    variants:
      - id: powers-logs.base.v2.1
        prompt: Calculate 2⁵.
        answer: 32
        feedback: 2 × 2 × 2 × 2 × 2 = 32. Multiplying base by exponent, 2 × 5, gives 10, which is a different operation.
      - id: powers-logs.base.v2.2
        prompt: Calculate log₂ 64.
        answer: 6
        feedback: 2⁶ = 64, so the log is 6. Dividing 64 by 2 gives 32, but a log counts factors of 2; it doesn't divide once.
      - id: powers-logs.base.v2.3
        prompt: Calculate log₁₀ 1000.
        answer: 3
        feedback: 10³ = 1000, so log₁₀ 1000 = 3. It counts the zeros here, not 1000 ÷ 10 = 100.
      - id: powers-logs.base.v2.4
        prompt: A learning rate is written 1e-2 in code, meaning 10⁻². Enter it as a decimal.
        answer: 0.01
        feedback: 10⁻² = 1/10² = 1/100 = 0.01. A negative exponent means "one over," so it's small and positive, not −100.
      - id: powers-logs.base.v2.5
        prompt: Calculate log₂(1/8).
        answer: -3
        feedback: 2⁻³ = 1/8, so the log is −3. Numbers between 0 and 1 have negative logs; answering 3 drops the "one over."
      - id: powers-logs.base.v2.6
        prompt: Given log₂ 8 = 3 and log₂ 4 = 2, calculate log₂(8 × 4).
        answer: 5
        feedback: The log of a product is the sum of the logs, 3 + 2 = 5, and 2⁵ = 32 = 8 × 4. Multiplying the logs, 3 × 2 = 6, would give log₂ 64 instead.
  - id: powers-logs.transfer.v2
    objective_ref: objective.powers-logs
    task: transfer
    response_type: numeric
    points: 1
    hint: Loss in bits is −log₂ p for the correct word, losses for a sequence add, and perplexity is 2 raised to the average loss in bits.
    remediation_scene: powers-logs.s6
    absolute_tolerance: 0.01
    variants:
      - id: powers-logs.transfer.v2.1
        prompt: A model gives the correct next word a probability of 1/8. What is its loss in bits, −log₂ p?
        answer: 3
        feedback: log₂(1/8) = −3, and the minus sign in the loss makes it +3 bits. Leaving out that minus sign gives −3, but a loss is a cost, so it's positive.
      - id: powers-logs.transfer.v2.2
        prompt: A spelling model gives the right letters in a three-letter word probabilities 1/2, 1/4, and 1/2. What is the total loss in bits?
        answer: 4
        feedback: The losses are 1, 2, and 1 bits, which add to 4. Equivalently, the word's probability is 1/16 and −log₂(1/16) = 4. Adding the probabilities (1.25) is the tempting slip; the word's probability is their product, and the log turns that product into a sum of losses.
      - id: powers-logs.transfer.v2.3
        prompt: A model's average loss on a test set is 3 bits per word. What is its perplexity?
        answer: 8
        feedback: Perplexity undoes the log, so 2³ = 8, as unsure as choosing among 8 equally likely words. Multiplying 2 × 3 = 6 confuses a power with a product.
      - id: powers-logs.transfer.v2.4
        prompt: A classifier gives the correct label a probability of 0.5. What is its cross-entropy loss in nats, −ln p? Give two decimal places.
        answer: 0.69
        feedback: −ln 0.5 = ln 2 ≈ 0.69 nats (it would be exactly 1 bit with log₂). Answering 0.5 copies the probability instead of taking its log.
      - id: powers-logs.transfer.v2.5
        prompt: An untrained model spreads its guesses evenly over a vocabulary of 1,024 tokens, so each gets p = 1/1024. What is its loss in bits?
        answer: 10
        feedback: 2¹⁰ = 1024, so −log₂(1/1024) = 10 bits. Answering 1024 skips the log; this "loss of a uniform guess" is the usual sanity check for a fresh model.
      - id: powers-logs.transfer.v2.6
        prompt: A model gives the correct token a probability of 1/32. What is its loss in bits?
        answer: 5
        feedback: 2⁵ = 32, so −log₂(1/32) = 5 bits. Dividing 32 by 2 gives 16, but a log counts how many factors of 2, not a single division.
