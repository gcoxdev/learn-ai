schema_version: 0.2-draft
lesson:
  id: powers-logs
  version: 0.3.0-draft
  title: Powers and logarithms, one step at a time
  state: draft
  summary: A model gave the right word a 1-in-8 chance. How bad is that? Logarithms answer it, and they sit inside every language model's loss and perplexity score.
  slot: B04
  category: bridge
  sources:
    - title: OpenStax — logarithmic functions
      url: https://openstax.org/books/algebra-and-trigonometry-2e/pages/6-3-logarithmic-functions
objectives:
  - id: objective.powers-logs
    version: 2-draft
    statement: Evaluate simple powers and logarithms, turn a probability into a loss with −log p, and explain how softmax uses exponentials to turn scores into shares.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - powers-logs.base.v2
      - powers-logs.transfer.v2
    prerequisites:
      - anyOf:
          - objective.arithmetic
      - anyOf:
          - objective.functions
scenes:
  - title: Powers count repeated factors
    markdown: |-
      A language model reads "The cat sat on the" and gives the right next word, "mat," a probability of 1/8. How bad is that? Training scores it with a logarithm, and so does perplexity, the usual report card for language models.

      A **power** is repeated multiplication. 2³ means 2 × 2 × 2 = 8 (not 2 × 3). The 2 is the **base**, and the small raised 3 is the **exponent**, which counts how many times the base appears.

      | You see | Means | Value |
      | --- | --- | --- |
      | 10³ | 10 × 10 × 10 | 1,000 |
      | 2⁰ | no factors at all | 1 |
      | 2⁻¹ | one over 2¹ | 1/2 |
      | 2⁻³ | one over 2³ | 1/8 |
      | `1e-3` | code for 1 × 10⁻³ | 0.001 |

      Each step down in the exponent divides by 2 (2³ = 8, 2² = 4, 2¹ = 2, 2⁰ = 1, 2⁻¹ = 1/2), so a negative exponent means "one over": small and positive, not negative. Learning rates are often written like `3e-4`, which is 0.0003.
    id: powers-logs.s1
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.powers-logs
  - title: A logarithm asks the question backward
    markdown: |-
      Since 2³ = 8, the **logarithm** base 2 of 8 is 3, written log₂ 8 = 3. Read it as "what power of 2 gives 8?" Three examples, each a little harder:

      1. log₁₀ 1000 = 3, because 10³ = 1000.
      2. log₂ 1 = 0, because 2⁰ = 1.
      3. log₂(1/8) = −3, because 2⁻³ = 1/8. Any number between 0 and 1, such as a probability below 1, has a negative log.

      Logs exist only for positive numbers: no power of 2 gives 0 or −4.

      The property that makes logs so useful is that they turn multiplying into adding: log₂(8 × 4) = log₂ 8 + log₂ 4 = 3 + 2 = 5, and indeed 2⁵ = 32.

      :::predict A model gives three words in a row the probabilities 1/2, 1/4, and 1/8. The sentence's probability is their product. What is its log₂?
      The product is 1/64, and log₂(1/64) = −6. Adding the logs gives the same answer: −1 − 2 − 3 = −6. Multiplying hundreds of tiny probabilities would round to 0 on a computer, so models add log-probabilities instead.
      :::

      :::mixup "log(a + b) = log a + log b."
      The adding rule is for *products*. Check: log₂(8 + 8) = log₂ 16 = 4, but log₂ 8 + log₂ 8 = 6, which is log₂ 64. There's no simple rule for the log of a sum.
      :::
    bridges:
      - functions
    id: powers-logs.s2
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.powers-logs
  - title: Meet the base called e
    markdown: |-
      Machine learning mostly uses the base **e** ≈ 2.71828, a fixed constant like π. The function **exp**(s) means e raised to the power s. Here s is a **score**, a raw number a model produces before turning it into a probability. The output of exp is always positive: exp(0) = 1, and negative scores give values between 0 and 1.

      The **natural logarithm**, written **ln**, is the log with base e. It undoes exp: ln(exp(s)) = s. A useful value to know is ln 2 ≈ 0.693, and exp(ln 2) = 2, the table's first row.
    type: table
    columns:
      - Score
      - Exponentiated value
    rows:
      - - ln 2
        - 2
      - - 0
        - 1
      - - −ln 2
        - 0.5
    id: powers-logs.s3
    depth: mechanics
    objective_refs:
      - objective.powers-logs
  - title: Loss is −log p, and perplexity undoes it
    markdown: |-
      Language models are trained with **cross-entropy loss**: −ln p, where p is the probability the model gave the correct next word. The minus sign flips the negative log into a positive cost.

      | p for the right word | Loss −ln p |
      | ---: | ---: |
      | 1 | 0 |
      | 0.5 | 0.69 |
      | 0.1 | 2.30 |

      Certainty in the right answer costs nothing, and the cost climbs as p shrinks. Loss measured with ln is in units called **nats**. Using log₂ instead measures it in **bits**: p = 1/8 costs 3 bits (about 2.08 nats).

      This gives a handy check before training: a fresh model spreading its guesses evenly over 50,000 tokens (word pieces) should start near ln 50,000 ≈ 10.8.

      **Perplexity** undoes the log on the average loss. For the three words above (p = 1/2, 1/4, 1/8), the losses in bits are 1, 2, and 3, averaging 2, and 2² = 4. A perplexity of 4 means the model was, on average, as unsure as picking among 4 equally likely words.
    id: powers-logs.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.powers-logs
  - title: Turn three scores into shares
    markdown: |-
      Models also run exp the other way, to turn raw scores into probabilities. Take the three scores from the exp table earlier, [ln 2, 0, −ln 2]:

      1. Exponentiate: [2, 1, 0.5]. Every value is now positive.
      2. Add them up: 2 + 1 + 0.5 = 3.5.
      3. Divide each by the total: [2/3.5, 1/3.5, 0.5/3.5] = [4/7, 2/7, 1/7] ≈ [0.571, 0.286, 0.143].

      The shares are positive and add to 1. This exponentiate-then-divide recipe is **softmax**. It keeps the scores' order and turns gaps into ratios: each score is ln 2 above the next, so each share is double the next (4/7, 2/7, 1/7). Language models use it for next-word probabilities and for attention weights.
    id: powers-logs.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.powers-logs
  - title: Subtract the biggest score first
    markdown: |-
      Subtract ln 2 from every score and the exponentials become [1, 0.5, 0.25], each exactly half of before. The total halves too, so the shares don't change. Subtracting the same number from every score never changes softmax.

      Real code subtracts the largest score first. Otherwise a score of 1000 makes exp overflow to infinity, and the shares come out as "nan" (not a number). Run this, then change both `+ 1000`s to `- 1000`:

      ```python run
      import numpy as np

      scores = np.array([np.log(2), 0.0, -np.log(2)])

      def softmax(s):
          e = np.exp(s - s.max())          # subtract the biggest score first
          return e / e.sum()

      print("shares:           ", np.round(softmax(scores), 3))
      print("shares, +1000:    ", np.round(softmax(scores + 1000), 3))
      with np.errstate(over="ignore", invalid="ignore"):
          naive = np.exp(scores + 1000)    # no subtraction: overflows to infinity
          print("naive shares, +1000:", naive / naive.sum())

      p_right = np.array([0.5, 0.25, 0.125])   # probability given to each correct word
      losses = -np.log(p_right)                # cross-entropy loss for each word
      print("losses:    ", np.round(losses, 3))
      print("perplexity:", round(float(np.exp(losses.mean())), 3))
      ```

      The safe version still gives [0.571, 0.286, 0.143]; the naive one gives nan. With `- 1000`, every naive exp rounds down to 0, and 0 ÷ 0 is nan too. The last lines redo the perplexity example with ln, raising e to the average loss, and still get 4.
    id: powers-logs.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.powers-logs
  - id: powers-logs.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.powers-logs
    markdown: Evaluate powers and logs, then turn a model's probabilities into a loss in bits and a perplexity.
    takeaway: |-
      A logarithm asks which power gives a number, and it turns products into sums. Loss is −log p of the right answer, and softmax uses exp to turn scores into shares that add to 1.
  - id: powers-logs.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.powers-logs
    markdown: |-
      A logarithm asks which exponent produces a number. Softmax uses exponentials to make scores positive, then divides by their total to produce normalized shares.
