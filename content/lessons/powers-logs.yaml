scenes:
- title: A compact way to describe multiplication
  markdown: 'The expression 2³ means 2 × 2 × 2, which equals 8. The 2 is the base and the 3 is the exponent.
    It does not mean 2 × 3. Positive integer exponents count repeated factors.


    The rules extend consistently: 2⁰ = 1 and 2⁻¹ = 1/2. A negative exponent takes a reciprocal; it does not
    make the result negative. Scientific notation uses powers of ten to express large and small quantities.'
  id: powers-logs.s1
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.powers-logs
  text_mode: 'The expression 2³ means 2 × 2 × 2, which equals 8. The 2 is the base and the 3 is the exponent.
    It does not mean 2 × 3. Positive integer exponents count repeated factors.


    The rules extend consistently: 2⁰ = 1 and 2⁻¹ = 1/2. A negative exponent takes a reciprocal; it does not
    make the result negative. Scientific notation uses powers of ten to express large and small quantities.'
- title: Logarithms ask the question backward
  markdown: 'If 2³ = 8, then log₂(8) = 3. Read it as: “what power of 2 produces 8?” The base matters: log₁₀(100)
    = 2 because 10² = 100.


    For positive arguments, logarithms undo exponentiation with the same base. This is an inverse-function
    relationship, not division by the base. In ordinary real-number calculations, the logarithm of zero or
    a negative number is not defined.'
  bridges:
  - functions
  id: powers-logs.s2
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.powers-logs
  text_mode: 'If 2³ = 8, then log₂(8) = 3. Read it as: “what power of 2 produces 8?” The base matters: log₁₀(100)
    = 2 because 10² = 100.


    For positive arguments, logarithms undo exponentiation with the same base. This is an inverse-function
    relationship, not division by the base. In ordinary real-number calculations, the logarithm of zero or
    a negative number is not defined.'
- title: Meet the base called e
  markdown: 'The number e is approximately 2.71828. The function exp(s), also written e raised to s, is positive
    for every finite real score s. In particular exp(0) = 1, and negative scores produce positive values smaller
    than one.


    The natural logarithm, written ln, undoes exp: exp(ln 2) = 2. You do not need to derive e to follow the
    coming attention example. We will choose scores with convenient exact values.'
  type: table
  columns:
  - Score
  - Exponentiated value
  rows:
  - - ln 2
    - 2
  - - 0
    - 1
  - - −ln 2
    - 0.5
  id: powers-logs.s3
  depth: mechanics
  objective_refs:
  - objective.powers-logs
  text_mode: 'The number e is approximately 2.71828. The function exp(s), also written e raised to s, is positive
    for every finite real score s. In particular exp(0) = 1, and negative scores produce positive values smaller
    than one.


    The natural logarithm, written ln, undoes exp: exp(ln 2) = 2. You do not need to derive e to follow the
    coming attention example. We will choose scores with convenient exact values.'
- title: Turn three scores into shares
  markdown: 'Take scores [ln 2, 0, −ln 2]. Exponentiating gives [2, 1, 0.5]. Their total is 3.5, so normalized
    weights are [4/7, 2/7, 1/7]. Every weight is positive and the weights add to one.


    This exponentiate-and-normalize operation is softmax. It preserves the score ordering, but it does not
    leave the numerical gaps unchanged. The weights describe relative shares among the included choices.'
  id: powers-logs.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.powers-logs
  text_mode: 'Take scores [ln 2, 0, −ln 2]. Exponentiating gives [2, 1, 0.5]. Their total is 3.5, so normalized
    weights are [4/7, 2/7, 1/7]. Every weight is positive and the weights add to one.


    This exponentiate-and-normalize operation is softmax. It preserves the score ordering, but it does not
    leave the numerical gaps unchanged. The weights describe relative shares among the included choices.'
- title: Why subtracting a common offset helps
  markdown: 'Subtract ln 2 from each score above. The exponentials become [1, 0.5, 0.25], each exactly half
    of its previous value. The normalized shares are unchanged because both numerator and denominator scale
    together.


    Computers exploit this identity by subtracting the largest score before exponentiating. It avoids unnecessarily
    huge intermediate exponentials. This numerical trick changes the calculation’s stability, not the intended
    softmax distribution.'
  id: powers-logs.s5
  type: explanation
  depth: mechanics
  objective_refs:
