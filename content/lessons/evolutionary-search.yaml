schema_version: 0.2-draft
lesson:
  id: evolutionary-search
  version: 0.1.0-draft
  title: Search with a population of varied candidates
  state: draft
  summary: Evolutionary algorithms evaluate candidate populations and create new variants through selection, mutation,
    and sometimes recombination; representation and evaluation budgets shape the search.
  slot: M32.1
  category: learning
  minutes: 12
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
  - title: A Field Guide to Genetic Programming
    url: https://www.gp-field-guide.org.uk/
objectives:
- id: objective.evolutionary-search
  version: 1-draft
  statement: Evolutionary algorithms evaluate candidate populations and create new variants through selection, mutation,
    and sometimes recombination; representation and evaluation budgets shape the search.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - evolutionary-search.base
  - evolutionary-search.transfer
  prerequisites:
  - anyOf:
    - objective.local-search
  - anyOf:
    - objective.algorithm-cost
scenes:
- id: evolutionary-search.s1
  title: Represent a candidate solution
  type: explanation
  depth: intuition
  objective_refs:
  - objective.evolutionary-search
  markdown: A candidate might be a bit string, parameter vector, program, or schedule. Its encoding determines which
    changes are possible and which constraints are easy to satisfy. A fitness function scores the candidate under
    the task, serving as an optimization target with the same proxy risks as other objectives.
  text_mode: A candidate might be a bit string, parameter vector, program, or schedule. Its encoding determines
    which changes are possible and which constraints are easy to satisfy. A fitness function scores the candidate
    under the task, serving as an optimization target with the same proxy risks as other objectives.
  bridges: []
- id: evolutionary-search.s2
  title: Select and vary
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.evolutionary-search
  markdown: A generation evaluates candidates, favors some for reproduction, and creates variants through mutation
    or recombination. Selection need not always choose only the best; preserving diversity can prevent premature
    convergence. Elitism retains selected strong candidates while new ones are explored.
  text_mode: A generation evaluates candidates, favors some for reproduction, and creates variants through mutation
    or recombination. Selection need not always choose only the best; preserving diversity can prevent premature
    convergence. Elitism retains selected strong candidates while new ones are explored.
  bridges: []
- id: evolutionary-search.s3
  title: Trace a toy mutation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.evolutionary-search
  markdown: A four-bit candidate 1010 might mutate its third bit to become 1000. If fitness is the number of ones,
    the score falls from two to one. A temporary decline can still be part of exploration; acceptance and reproduction
    rules determine whether that variant persists.
  text_mode: A four-bit candidate 1010 might mutate its third bit to become 1000. If fitness is the number of ones,
    the score falls from two to one. A temporary decline can still be part of exploration; acceptance and reproduction
    rules determine whether that variant persists.
  bridges: []
- id: evolutionary-search.s4
  title: Compare resource use and reliability
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.evolutionary-search
  markdown: Population evaluations can often run independently, but may be expensive. No gradients are required
    by a basic genetic algorithm, making it applicable to some nondifferentiable objectives. This flexibility does
    not guarantee efficient search in every high-dimensional space or escape from every local optimum.
  text_mode: Population evaluations can often run independently, but may be expensive. No gradients are required
    by a basic genetic algorithm, making it applicable to some nondifferentiable objectives. This flexibility does
    not guarantee efficient search in every high-dimensional space or escape from every local optimum.
  bridges: []
- id: evolutionary-search.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.evolutionary-search
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: evolutionary-search.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.evolutionary-search
  markdown: Evolutionary algorithms evaluate candidate populations and create new variants through selection, mutation,
    and sometimes recombination; representation and evaluation budgets shape the search.
  text_mode: Evolutionary algorithms evaluate candidate populations and create new variants through selection, mutation,
    and sometimes recombination; representation and evaluation budgets shape the search.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - evolutionary-search.s1
    - evolutionary-search.s2
    - evolutionary-search.s3
    - evolutionary-search.s4
    - evolutionary-search.check
    - evolutionary-search.recap
    gate_refs:
    - gate.core
assessment_families:
- id: evolutionary-search.base
  objective_ref: objective.evolutionary-search
  task: base
  response_type: single_choice
  points: 1
  hint: 'Select and vary: trace the inputs, operation, and result before choosing.'
  remediation_scene: evolutionary-search.s2
  variants:
  - id: evolutionary-search.base.1
    prompt: What does mutation do?
    options:
    - id: b
      text: Always improves fitness
    - id: c
      text: Computes an exact gradient necessarily
    - id: a
      text: Creates a variation in a candidate representation
    answer: a
    feedback: Mutation explores nearby or otherwise altered candidates.
  - id: evolutionary-search.base.2
    prompt: 1010 has how many ones?
    options:
    - id: c
      text: Three
    - id: a
      text: Two
    - id: b
      text: One
    answer: a
    feedback: The first and third bits are one.
- id: evolutionary-search.transfer
  objective_ref: objective.evolutionary-search
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Compare resource use and reliability: trace the inputs, operation, and result before choosing.'
  remediation_scene: evolutionary-search.s4
  variants:
  - id: evolutionary-search.transfer.1
    prompt: Why retain population diversity?
    options:
    - id: c
      text: Only to increase memory use
    - id: a
      text: To avoid exploring only one narrow region too early
    - id: b
      text: To guarantee all candidates have equal fitness
    answer: a
    feedback: Diversity supports alternative search directions.
  - id: evolutionary-search.transfer.2
    prompt: Does gradient-free mean computation-free?
    options:
    - id: a
      text: No; candidate evaluations can be costly
    - id: b
      text: 'Yes'
    - id: c
      text: Only for bit strings
    answer: a
    feedback: Search still spends an evaluation budget.
