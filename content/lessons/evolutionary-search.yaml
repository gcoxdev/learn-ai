schema_version: 0.2-draft
lesson:
  id: evolutionary-search
  version: 0.4.0-draft
  title: Search with a population of varied candidates
  state: draft
  summary: No engineer drew the bent-paperclip antenna that flew on three NASA satellites; a program evolved it. Use the same trick to pack a hiking bag, and watch a population improve or get stuck.
  slot: M32.1
  category: learning
  sources:
    - title: "Adaptation in Natural and Artificial Systems (Holland, 1975; MIT Press edition 1992)"
      url: https://mitpress.mit.edu/9780262581110/adaptation-in-natural-and-artificial-systems/
    - title: "Evolution strategies: A comprehensive introduction (Beyer & Schwefel, 2002)"
      url: https://doi.org/10.1023/A:1015059928466
    - title: "Computer-automated evolution of an X-band antenna for NASA's Space Technology 5 mission (Hornby et al., 2011)"
      url: https://doi.org/10.1162/EVCO_a_00005
    - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
      url: https://aima.cs.berkeley.edu/
objectives:
  - id: objective.evolutionary-search
    version: 2-draft
    statement: Evolutionary algorithms evaluate candidate populations and create new variants through selection, mutation, and sometimes recombination; representation and evaluation budgets shape the search.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - evolutionary-search.base.v2
      - evolutionary-search.transfer.v2
      - evolutionary-search.calculate
    prerequisites:
      - anyOf:
          - objective.local-search
      - anyOf:
          - objective.algorithm-cost
scenes:
  - id: evolutionary-search.s1
    title: A packing list is a string of bits
    type: explanation
    depth: intuition
    objective_refs:
      - objective.evolutionary-search
    markdown: |-
      In March 2006 NASA launched three small Space Technology 5 satellites carrying radio antennas shaped like bent paperclips. No engineer drew that shape. A program bred candidate antennas, scored each in a simulator, and mixed and nudged the better ones into new candidates.

      That program was an **evolutionary algorithm**: a search that keeps a whole **population** of candidate solutions and improves it generation by generation. Let's build one for a hiking bag that holds at most 12 kg:

      | Item | tent | stove | filter | camera | book | jacket |
      | --- | ---: | ---: | ---: | ---: | ---: | ---: |
      | Weight (kg) | 4 | 2 | 1 | 2 | 1 | 3 |
      | Usefulness | 10 | 6 | 7 | 3 | 1 | 8 |

      Write a packing list as six bits, one per item, 1 for "packed." The string `101001` means tent, filter, and jacket: 8 kg and 10 + 7 + 8 = 25 points. How you write a candidate down is its **representation**, and it decides which small changes are even possible.

      A candidate's score is its **fitness**: here, total usefulness, except that an overweight bag scores 0, a penalty for breaking a hard constraint as in the local search lesson. Packing everything (`111111`) weighs 13 kg, so it scores 0.

      Six items give only $2^6 = 64$ packs, easy to try them all. With 100 items there are about $10^{30}$, and a population search earns its keep.
  - id: evolutionary-search.s2
    title: Tournaments and roulette wheels
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.evolutionary-search
    markdown: |-
      Each generation starts with **selection**: choosing which candidates become parents. Fitter packs should be picked more often, but not always. Take four packs:

      | Pack | Bits | Fitness | Roulette chance | Tournament chance |
      | --- | --- | ---: | ---: | ---: |
      | A | `101001` | 25 | 25/80 = 0.3125 | 7/16 = 0.4375 |
      | B | `111000` | 23 | 23/80 = 0.2875 | 5/16 = 0.3125 |
      | C | `100001` | 18 | 18/80 = 0.225 | 3/16 = 0.1875 |
      | D | `011010` | 14 | 14/80 = 0.175 | 1/16 = 0.0625 |

      **Roulette-wheel selection** gives each pack a slice of a wheel proportional to its fitness: A gets 25 of the 80 total. **Tournament selection** picks two packs at random (possibly the same one twice) and keeps the fitter. A loses only if both picks miss it, $(3/4)^2 = 9/16$, so it wins with probability $7/16$. D wins only if both picks are D: $1/16$.

      :::predict A lucky mutation makes pack A score 60 instead of 25. What happens to its chances under each method?
      Roulette: 60/115 ≈ 0.52, more than half the parent slots. Tournament: still 7/16, because it asks only *which* pack is better, never by how much. Under roulette, one early standout can crowd out everyone else within a few generations.
      :::
  - id: evolutionary-search.s3
    title: Crossover, mutation, and keeping the best
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.evolutionary-search
    markdown: |-
      Parents make children in two ways.

      **Crossover** (also called recombination) cuts two parents at the same point and swaps the tails. Cut A and B after the third bit:

      - `101|001` × `111|000` gives `101000` (tent, filter: 17 points) and `111001` (tent, stove, filter, jacket: 10 kg, 31 points).

      One child beats both parents by combining B's stove with A's jacket; the other is worse. Selection decides which combinations survive.

      **Mutation** flips each bit with a small probability, often 1 over the number of bits. Flip the camera bit of `111001` to get `111101`: exactly 12 kg and 34 points, the best six-item pack. At a rate of 1/6, a child escapes mutation entirely with probability $(5/6)^6 \approx 0.33$.

      **Elitism** copies the best pack unchanged into the next generation, so the best score never drops. Together these steps form the **genetic algorithm (GA)**, set out by John Holland in *Adaptation in Natural and Artificial Systems* (1975).
    diagram:
      caption: One generation of a genetic algorithm. The best candidate is copied straight across (elitism).
      description: The population goes to fitness scoring. Scored candidates go to selection, which picks parents. Parents go to crossover, and the children go to mutation. The mutated children form the next generation, which becomes the population for the next round. A dashed edge from fitness scoring to the next generation copies the single best candidate unchanged.
      nodes:
        - id: pop
          label: Population
          note: 20 packing lists
          col: 0
          row: 0
          tone: data
        - id: score
          label: Score fitness
          note: usefulness, 0 if overweight
          col: 1
          row: 0
        - id: select
          label: Select parents
          note: tournament or roulette
          col: 2
          row: 0
          tone: accent
        - id: cross
          label: Crossover
          note: cut and swap tails
          col: 3
          row: 0
        - id: mutate
          label: Mutation
          note: flip each bit with prob. 1/L
          col: 3
          row: 1
        - id: next
          label: Next generation
          col: 1
          row: 1
          tone: data
      edges:
        - from: pop
          to: score
        - from: score
          to: select
        - from: select
          to: cross
          label: parents
        - from: cross
          to: mutate
          label: children
        - from: mutate
          to: next
        - from: score
          to: next
          label: copy the best
          dashed: true
        - from: next
          to: pop
          label: repeat
          bend: 1
  - id: evolutionary-search.run
    title: Watch the fitness curve climb
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.evolutionary-search
    markdown: |-
      Now scale up to 16 items (65,536 possible packs; the first six are from the table) and the same 12 kg limit. The GA keeps 20 packs per generation. The `#` marks draw a sideways fitness curve.

      ```python run
      import random

      W = [4, 2, 1, 2, 1, 3, 1, 3, 2, 1, 2, 3, 1, 2, 4, 1]   # weight of each item (kg)
      V = [10, 6, 7, 3, 1, 8, 6, 4, 5, 2, 4, 7, 3, 2, 9, 3]  # usefulness points
      CAP, POP, MUTATION = 12, 20, 1 / 16

      def fitness(pack):                  # pack = 16 bits, 1 = item packed
          if sum(w for w, b in zip(W, pack) if b) > CAP:
              return 0                    # overweight packs score 0
          return sum(v for v, b in zip(V, pack) if b)

      rng = random.Random(7)
      pop = [[int(rng.random() < 0.3) for _ in W] for _ in range(POP)]

      def tournament():                   # pick two at random, keep the fitter
          return max(rng.choice(pop), rng.choice(pop), key=fitness)

      for gen in range(31):
          best = max(pop, key=fitness)
          if gen % 5 == 0:
              distinct = len(set(map(tuple, pop)))
              print(f"gen {gen:2}  best {fitness(best)} {'#' * (fitness(best) - 25)}"
                    f"  distinct packs {distinct}")
          children = [best]               # elitism: the best pack survives unchanged
          while len(children) < POP:
              mom, dad = tournament(), tournament()
              cut = rng.randint(1, len(W) - 1)                 # one-point crossover
              child = mom[:cut] + dad[cut:]
              child = [1 - g if rng.random() < MUTATION else g for g in child]
              children.append(child)
          pop = children
      print("best pack:", "".join(map(str, best)), "weight", sum(w for w, b in zip(W, best) if b))
      ```

      The best score climbs 31 → 36 → 38 → 40, the true optimum (checking all 65,536 packs confirms it), after scoring 620 packs: under 1% of the possibilities. Seeds 1, 2, and 3 end at 38, 38, and 39: a GA usually finds a very good answer, not always the best. Now set `MUTATION` to 0, rerun seed 7, and watch "distinct packs".

      :::papers The selection formulas
      Roulette-wheel selection, as in Holland's GA, picks candidate $i$ with probability $p_i = f_i / \sum_j f_j$. A size-$k$ tournament (with replacement) among $N$ candidates picks rank $r$ (1 = best) with probability

      $$\frac{(N-r+1)^k - (N-r)^k}{N^k}$$

      With $N = 4$ and $k = 2$, rank 1 gets $(16 - 9)/16 = 7/16$, as in the table. A larger $k$ favors the best more strongly.
      :::
  - id: evolutionary-search.s4
    title: When every pack looks the same
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.evolutionary-search
    markdown: |-
      With `MUTATION = 0`, seed 7 creeps from 31 to 33 and stays there. By generation 10, "distinct packs" reads 1: all 20 packs are identical, and crossing two copies of a pack just makes that pack again.

      This is **premature convergence**: the population loses its variety before it finds a good region, the population version of a local optimum. Selection uses up diversity; mutation replenishes it. To keep it:

      - Keep mutation on, at roughly one flipped bit per child.
      - Soften selection: small tournaments instead of roulette, so one standout can't take over.
      - Use a larger population, or restart when the distinct count collapses, keeping the best pack.

      :::mixup "Breed only from the very best packs; that's the fastest route to the best answer."
      It's the fastest route to *an* answer. Strong selection copies one early winner everywhere, like the seed-7 run frozen at 33 when 40 was possible. Weaker packs often carry pieces the winner lacks.
      :::
  - id: evolutionary-search.es
    title: "Evolution strategies: one parent, one child, one-fifth"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.evolutionary-search
    markdown: |-
      When a candidate is a list of real numbers, such as the angles of an antenna's arms, the classic tool is an **evolution strategy (ES)**, developed by Ingo Rechenberg and Hans-Paul Schwefel in Berlin in the 1960s.

      The simplest, the **(1+1)-ES**, keeps one parent $x$ and makes one child $x' = x + \sigma z$, where $z$ is a standard normal draw and $\sigma$ is the step size. The better of the two survives. Minimizing $f(x) = (x - 3)^2$ from $x = 0$ with $\sigma = 1$ and a draw $z = 0.8$: the child $0.8$ scores $4.84$, beating the parent's $9$, so it takes over.

      Rechenberg's **1/5 success rule** (1973) sets $\sigma$: if more than a fifth of recent children beat their parent, steps are timid, so grow $\sigma$; if fewer, they overshoot, so shrink it. With 4 successes in 10 tries and a factor of 1.2, $\sigma$ grows from 1 to 1.2. Its modern descendant, CMA-ES (Hansen and Ostermeier, 2001), adapts the shape of the noise too.

      Neither method needs gradients, only a score per candidate. They pay in evaluations instead: great when scores are cheap, painful when each takes a day.
  - id: evolutionary-search.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.evolutionary-search
    markdown: Compute roulette and tournament chances, then diagnose GAs for class timetables, delivery routes, drone controllers, and a population that stopped improving.
    takeaway: |-
      Evolutionary search scores a population and creates new candidates through variation. The representation, selection rules, diversity, and evaluation budget shape its progress.
  - id: evolutionary-search.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.evolutionary-search
    markdown: |-
      Evolutionary search scores a population and creates new candidates through variation. The representation, selection rules, diversity, and evaluation budget shape its progress.
