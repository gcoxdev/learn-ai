assessment_families:
  - id: evolutionary-search.base
    objective_ref: objective.evolutionary-search
    task: base
    response_type: single_choice
    points: 1
    hint: 'Select and vary: trace the inputs, operation, and result before choosing.'
    remediation_scene: evolutionary-search.s2
    variants:
      - id: evolutionary-search.base.1
        prompt: What does mutation do?
        options:
          - id: b
            text: Always improves fitness
          - id: c
            text: Computes an exact gradient necessarily
          - id: a
            text: Creates a variation in a candidate representation
        answer: a
        feedback: Mutation explores nearby or otherwise altered candidates.
        retired: true
      - id: evolutionary-search.base.2
        prompt: 1010 has how many ones?
        options:
          - id: c
            text: Three
          - id: a
            text: Two
          - id: b
            text: One
        answer: a
        feedback: The first and third bits are one.
        retired: true
  - id: evolutionary-search.transfer
    objective_ref: objective.evolutionary-search
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Compare resource use and reliability: trace the inputs, operation, and result before choosing.'
    remediation_scene: evolutionary-search.s4
    variants:
      - id: evolutionary-search.transfer.1
        prompt: Why retain population diversity?
        options:
          - id: c
            text: Only to increase memory use
          - id: a
            text: To avoid exploring only one narrow region too early
          - id: b
            text: To guarantee all candidates have equal fitness
        answer: a
        feedback: Diversity supports alternative search directions.
        retired: true
      - id: evolutionary-search.transfer.2
        prompt: Does gradient-free mean computation-free?
        options:
          - id: a
            text: No; candidate evaluations can be costly
          - id: b
            text: 'Yes'
          - id: c
            text: Only for bit strings
        answer: a
        feedback: Search still spends an evaluation budget.
        retired: true
  - id: evolutionary-search.base.v2
    objective_ref: objective.evolutionary-search
    task: base
    response_type: single_choice
    points: 1
    hint: Name each operator's job. Selection chooses parents by fitness, crossover combines two parents, mutation adds new variety, and elitism protects the best.
    remediation_scene: evolutionary-search.s3
    variants:
      - id: evolutionary-search.base.v2.1
        prompt: In a packing GA, every pack in generation 12 is identical and the best score hasn't moved since generation 6. Which change most directly restores the search?
        options:
          - id: b
            text: Switch to roulette selection so fitter packs get more parent slots
          - id: c
            text: Add elitism so the best pack is copied into each generation
          - id: a
            text: Raise the mutation rate so children differ from their parents again
        answer: a
        feedback: Crossover between identical parents reproduces the same pack, so only mutation can add variety back. Roulette would push selection harder toward the current winner, and elitism protects the best pack but creates nothing new.
      - id: evolutionary-search.base.v2.2
        prompt: Parents `110|010` and `001|101` are cut after the third bit and their tails swapped. What children result?
        options:
          - id: c
            text: "`110010` and `001101`, since crossover keeps each parent whole"
          - id: a
            text: "`110101` and `001010`"
          - id: b
            text: "`111101` and `000010`"
        answer: a
        feedback: One-point crossover keeps each parent's head and swaps the tails, so 110 joins 101 and 001 joins 010. The pair `111101` and `000010` comes from cutting after the second bit instead of the third.
      - id: evolutionary-search.base.v2.3
        prompt: One candidate's fitness jumps from 25 to 60 while the other three stay at 23, 18, and 14. Which selection method is unaffected by the jump?
        options:
          - id: a
            text: Tournament selection, since it compares candidates only by rank
          - id: b
            text: Roulette selection, since the wheel is rescaled to total 1
          - id: c
            text: Neither, since both methods pick parents in proportion to fitness
        answer: a
        feedback: A tournament asks only which candidate is better, so the best candidate keeps its 7/16 chance. Roulette's probabilities are proportions of total fitness, and the standout's share rises from 0.31 to about 0.52 even though the slices still sum to 1.
      - id: evolutionary-search.base.v2.4
        prompt: A GA without elitism shows a best score of 38 in generation 9 and 35 in generation 10. What explains the drop?
        options:
          - id: c
            text: Mutation rates rise automatically over time and break good packs
          - id: b
            text: Fitness is recomputed each generation with a fresh random weight limit
          - id: a
            text: The best pack wasn't copied forward, and its children were all worse
        answer: a
        feedback: Without elitism, even the best candidate must survive through selection, crossover, and mutation, and its children can all score lower. Copying the best pack unchanged into each generation keeps the best score from falling. The weight limit and mutation rate stay fixed unless you change them.
  - id: evolutionary-search.transfer.v2
    objective_ref: objective.evolutionary-search
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what a candidate looks like (bits, numbers, or an order), what a single score costs, and whether the population still has variety.
    remediation_scene: evolutionary-search.es
    variants:
      - id: evolutionary-search.transfer.v2.1
        prompt: A school uses a GA to build timetables. Each fitness check runs a two-second clash count, and there are thousands of classes. Why is a GA a reasonable choice here?
        options:
          - id: b
            text: Timetables have smooth gradients that a GA can follow faster than calculus
          - id: a
            text: It needs only a score per timetable, and many cheap scores fit the budget
          - id: c
            text: A GA checks every possible timetable, so it finds the optimum for sure
        answer: a
        feedback: A clash count gives a score but no gradient, and at two seconds each, thousands of evaluations are affordable. A GA samples a tiny fraction of the space, so it finds good timetables, not a proven optimum.
      - id: evolutionary-search.transfer.v2.2
        prompt: A drone controller has six real-valued gains to tune in a fast simulator. Which evolutionary method fits the representation best?
        options:
          - id: c
            text: A bit-string GA with one bit per gain, flipped by mutation
          - id: b
            text: Roulette selection over the six gains, keeping the largest gain
          - id: a
            text: An evolution strategy that adds Gaussian noise with an adapted step size
        answer: a
        feedback: Real-valued gains call for real-valued mutations, x' = x + σz, with σ adapted, for example by the 1/5 rule or CMA-ES. One bit per gain could only say "high" or "low," and roulette is a way to pick parents, not a way to change a candidate.
      - id: evolutionary-search.transfer.v2.3
        prompt: A (1+1)-ES tuning a pump's settings found better children in only 1 of its last 10 tries. What does the 1/5 success rule recommend?
        options:
          - id: a
            text: Shrink the step size σ, since steps are overshooting
          - id: b
            text: Grow the step size σ, since the search needs to explore more
          - id: c
            text: Keep σ fixed, since the rule applies only after 100 tries
        answer: a
        feedback: A success rate of 10% is below one fifth, which suggests steps are too large and mostly jump past the improvement, so shrink σ. Growing σ is the response to a rate above one fifth.
      - id: evolutionary-search.transfer.v2.4
        prompt: A logistics team's GA for delivery routes finds a good plan in the first few generations, then stops improving; the population is nearly identical. Which change targets that failure?
        options:
          - id: b
            text: Increase the tournament size so the best routes win more often
          - id: a
            text: Use smaller tournaments and a larger population to keep variety
          - id: c
            text: Remove mutation so good routes aren't damaged by random changes
        answer: a
        feedback: This is premature convergence. Gentler selection and more candidates slow the takeover by one early winner. Bigger tournaments and no mutation both speed up the collapse.
  - id: evolutionary-search.calculate
    objective_ref: objective.evolutionary-search
    task: base
    response_type: numeric
    points: 1
    hint: Roulette divides one fitness by the total fitness. A size-2 tournament with replacement picks the best unless both draws miss it, so its chance is 1 minus (fraction of others) squared.
    remediation_scene: evolutionary-search.s2
    absolute_tolerance: 0.01
    variants:
      - id: evolutionary-search.calculate.1
        prompt: Four packs have fitness 30, 10, 6, and 4. Under roulette-wheel selection, what is the probability that the pack with fitness 30 is picked for one parent slot?
        answer: 0.6
        feedback: The total is 30 + 10 + 6 + 4 = 50, so the probability is 30/50 = 0.6.
      - id: evolutionary-search.calculate.2
        prompt: A population has five candidates with distinct fitness. In a size-2 tournament (two random picks, with replacement, fitter one wins), what is the probability that the single best candidate wins?
        answer: 0.36
        feedback: The best loses only if both picks miss it, (4/5)² = 0.64, so it wins with probability 1 − 0.64 = 0.36.
      - id: evolutionary-search.calculate.3
        prompt: Using the hiking table (tent 4 kg/10, stove 2 kg/6, filter 1 kg/7, camera 2 kg/3, book 1 kg/1, jacket 3 kg/8) and a 12 kg limit, what is the fitness of pack `011101`?
        answer: 24
        feedback: "Stove, filter, camera, and jacket: 2 + 1 + 2 + 3 = 8 kg, within the limit, and 6 + 7 + 3 + 8 = 24 points."
      - id: evolutionary-search.calculate.4
        prompt: Three candidates have fitness 12, 6, and 2. Under roulette-wheel selection, what is the probability that the candidate with fitness 2 is picked?
        answer: 0.1
        feedback: The total is 12 + 6 + 2 = 20, so the probability is 2/20 = 0.1.
      - id: evolutionary-search.calculate.5
        prompt: Each bit of a 10-bit child flips independently with probability 0.1. What is the probability that no bit flips? Give a decimal.
        answer: 0.349
        feedback: Each bit stays unchanged with probability 0.9, so all ten stay with probability 0.9¹⁰ ≈ 0.349. About a third of children are exact copies of their crossover result.
