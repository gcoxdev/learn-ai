schema_version: 0.2-draft
lesson:
  id: information-theory
  version: 0.3.0-draft
  title: Measure surprise and compare distributions
  state: draft
  summary: Measure surprise, then see the extra loss caused by a mismatched probability model.
  slot: B17
  category: bridge
  sources:
  - title: Deep Learning — probability and information theory
    url: https://www.deeplearningbook.org/contents/prob.html
objectives:
- id: objective.information-theory
  version: 1-draft
  statement: Entropy averages surprise, cross-entropy scores one distribution under another, and KL divergence
    measures a directional mismatch under explicit support assumptions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - information-theory.base
  - information-theory.transfer
  prerequisites:
  - anyOf:
    - objective.probability
  - anyOf:
    - objective.powers-logs
scenes:
- id: information-theory.s1
  title: A rare event is more surprising
  type: explanation
  depth: intuition
  objective_refs:
  - objective.information-theory
  markdown: Using base-two logarithms, the surprise of an event with probability p is −log₂(p), measured in
    bits. Probability 1 gives 0 bits; probability 1/2 gives 1 bit; probability 1/8 gives 3 bits. A logarithm
    turns products of independent probabilities into sums of surprises.
  text_mode: Using base-two logarithms, the surprise of an event with probability p is −log₂(p), measured in
    bits. Probability 1 gives 0 bits; probability 1/2 gives 1 bit; probability 1/8 gives 3 bits. A logarithm
    turns products of independent probabilities into sums of surprises.
  bridges:
  - powers-logs
- id: information-theory.s2
  title: Average surprise over the source
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.information-theory
  markdown: Entropy is the expected surprise under the actual distribution. A fair binary source has entropy
    1 bit per outcome. A source that always emits the same symbol has entropy 0. Entropy measures uncertainty
    under the specified distribution, rather than how meaningful or factually correct a message is.
  text_mode: Entropy is the expected surprise under the actual distribution. A fair binary source has entropy
    1 bit per outcome. A source that always emits the same symbol has entropy 0. Entropy measures uncertainty
    under the specified distribution, rather than how meaningful or factually correct a message is.
  bridges:
  - powers-logs
  - probability
- id: information-theory.s3
  title: Score a proposed model
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.information-theory
  markdown: 'Cross-entropy averages the negative log probability that model q gives outcomes drawn from distribution
    p. If the observed correct token receives probability 1/4, its base-two loss is 2 bits. **Kullback–Leibler
    divergence**, or **KL divergence**, from p to q equals cross-entropy minus the entropy of p. It is directional
    and becomes infinite if q assigns zero probability where p has positive mass.


    Let the true binary distribution be p = [0.5, 0.5], but model q = [0.75, 0.25]. Its cross-entropy is −0.5
    log₂(0.75) − 0.5 log₂(0.25), about 1.208 bits. Entropy of p is 1 bit, so KL(p || q) is about 0.208 bits.
    The extra loss measures this model-distribution mismatch, not the truthfulness of a sentence.'
  text_mode: 'Cross-entropy averages the negative log probability that model q gives outcomes drawn from distribution
    p. If the observed correct token receives probability 1/4, its base-two loss is 2 bits. **Kullback–Leibler
    divergence**, or **KL divergence**, from p to q equals cross-entropy minus the entropy of p. It is directional
    and becomes infinite if q assigns zero probability where p has positive mass.


    Let the true binary distribution be p = [0.5, 0.5], but model q = [0.75, 0.25]. Its cross-entropy is −0.5
    log₂(0.75) − 0.5 log₂(0.25), about 1.208 bits. Entropy of p is 1 bit, so KL(p || q) is about 0.208 bits.
    The extra loss measures this model-distribution mismatch, not the truthfulness of a sentence.'
  bridges:
  - probability
- id: information-theory.s4
  title: Understand what a smaller loss means
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.information-theory
  markdown: 'Lower average log loss rewards assigning more probability to observed outcomes, with strong penalties
    for confident mistakes. Mutual information compares joint behavior with an independence model and measures
    statistical dependence. Neither mutual information nor lower cross-entropy establishes causation. State
    the log base, averaging unit, and tokenization when comparing reported losses.


    For a fair binary variable X and an exact copy Y, observing Y removes the one bit of uncertainty about
    X, so their mutual information is one bit. If Y is an independent fair binary variable instead, it tells
    you nothing about X, and mutual information is zero. Statistical information concerns a specified distribution
    and its dependencies.'
  text_mode: 'Lower average log loss rewards assigning more probability to observed outcomes, with strong penalties
    for confident mistakes. Mutual information compares joint behavior with an independence model and measures
    statistical dependence. Neither mutual information nor lower cross-entropy establishes causation. State
    the log base, averaging unit, and tokenization when comparing reported losses.


