schema_version: 0.2-draft
lesson:
  id: information-theory
  version: 0.4.0-draft
  title: Measure surprise and compare distributions
  state: draft
  summary: Why can a language model's loss fall to 1.75 bits but never below? Measure surprise in bits, then see how cross-entropy, perplexity, and KL grade a model's guesses.
  slot: B17
  category: bridge
  sources:
    - title: Deep Learning — probability and information theory
      url: https://www.deeplearningbook.org/contents/prob.html
objectives:
  - id: objective.information-theory
    version: 2-draft
    statement: Compute surprise, entropy, cross-entropy, and KL divergence for a small distribution, turn a loss into perplexity, and explain why KL divergence depends on its direction.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - information-theory.base.v2
      - information-theory.transfer.v2
      - information-theory.calculate
    prerequisites:
      - anyOf:
          - objective.probability
      - anyOf:
          - objective.powers-logs
scenes:
  - id: information-theory.s1
    title: The rarer the word, the bigger the surprise
    type: explanation
    depth: intuition
    objective_refs:
      - objective.information-theory
    markdown: |-
      Finish the order: "I'll have a cup of ___." In one café, the next word is *tea* half the time, *coffee* a quarter of the time, and *cocoa* and *soup* an eighth each. Hearing "tea" tells you almost nothing new. "Soup" makes you look up.

      **Why AI needs this:** a language model learns by being penalized each time the real next word catches it off guard. Its loss curve, its perplexity, and the KL penalties in distillation and RLHF all measure that one thing.

      Information theory measures the **surprise** of an event with probability p as −log₂ p, in **bits**:

      | Next word | tea | coffee | cocoa | soup |
      | --- | ---: | ---: | ---: | ---: |
      | Probability p | 1/2 | 1/4 | 1/8 | 1/8 |
      | Surprise −log₂ p | 1 bit | 2 bits | 3 bits | 3 bits |

      Each halving of the probability adds a bit; a certain event (p = 1) carries 0 bits. Logarithms turn products into sums, so surprises add: tea then coffee has probability 1/2 × 1/4 = 1/8 and surprise 1 + 2 = 3 bits. That's why a sentence's loss is the sum of its words' losses.
    bridges:
      - powers-logs
  - id: information-theory.s2
    title: Entropy is the average surprise
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.information-theory
    markdown: |-
      **Entropy** is the average surprise over all outcomes, each weighted by how often it happens:

      $$H(p) = -\sum_x p(x)\,\log_2 p(x)$$

      For the café: H = ½ × 1 + ¼ × 2 + ⅛ × 3 + ⅛ × 3 = 0.5 + 0.5 + 0.375 + 0.375 = **1.75 bits** per order. A word that always comes next has entropy 0; a fair coin has 1 bit.

      :::predict A second café sells its four drinks equally often, 1/4 each. Is its entropy higher or lower than 1.75 bits?
      Higher: 2 bits. Every drink has surprise 2 bits, so the average is 2. With four outcomes, the even split is the least predictable; any favorite lowers the entropy.
      :::

      Entropy is also the limit on compression, as Claude Shannon showed in 1948. The code tea = `0`, coffee = `10`, cocoa = `110`, soup = `111` reaches it exactly: 1.75 bits per order on average.
    bridges:
      - powers-logs
      - probability
  - id: information-theory.s3
    title: Cross-entropy scores a model's guesses
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.information-theory
    markdown: |-
      Now a model predicts. It gives each word a probability q and pays −log₂ q when the real word arrives. **Cross-entropy** averages that cost over the real outcomes:

      $$H(p, q) = -\sum_x p(x)\,\log_2 q(x)$$

      An untrained model bets evenly, q = 1/4 per word, so every word costs 2 bits and H(p, q) = 2 bits. That's 0.25 bits above the café's entropy. The gap is the **KL divergence** (Kullback–Leibler), the extra cost of predicting with q when the truth is p:

      $$\mathrm{KL}(p \,\|\, q) = H(p, q) - H(p) = \sum_x p(x)\,\log_2 \frac{p(x)}{q(x)}$$

      KL is zero only when q matches p. The data's entropy can't change, so lowering the loss means shrinking the KL: the café model's loss can fall from 2 bits toward 1.75, never below.

      In training you see only real words, so the loss is the average of −log₂ q(real word). Probabilities 1/2, 1/4, and 1/8 for three real words cost (1 + 2 + 3) ÷ 3 = 2 bits per word.

      :::predict A model gives "tea" 0.99 and everything else 0.01 in total. The word is "soup." What does it cost?
      At least −log₂ 0.01 ≈ 6.64 bits, nearly four times the café's average of 1.75 bits per word. Probability 0 would cost infinitely much. Cross-entropy punishes confident mistakes hard.
      :::
    bridges:
      - probability
  - id: information-theory.s4
    title: Bits, nats, and perplexity
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.information-theory
    markdown: |-
      Training code uses the natural log, so its losses come in **nats**: 1 bit = ln 2 ≈ 0.693 nats. The untrained model's 2 bits is about 1.386 nats.

      **Perplexity** turns a loss back into a count of options: 2^(loss in bits), or e^(loss in nats). For the untrained model, 2² = e^1.386 = 4: it's as unsure as a fair choice among 4 words. A perfect model of the café reaches 2^1.75 ≈ 3.36.

      Compare losses only when the units and tokens match. A tokenizer that cuts text into smaller pieces makes each piece easier to guess, so loss per token falls even if the model is no better. The lesson on tokenization trade-offs compares models in bits per byte instead.
    bridges: []
  - id: information-theory.s5
    title: KL divergence has a direction
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.information-theory
    markdown: |-
      Suppose a model has never seen soup ordered: q = (½, ¼, ¼, 0).

      :::mixup "KL divergence is a distance, so the order doesn't matter."
      KL(p ‖ q) weights by the real café, which sometimes orders soup, and q gives soup 0, so it's infinite. KL(q ‖ p) weights by q, which never says soup; only cocoa counts: ¼ × log₂(¼ ÷ ⅛) = 0.25 bits.
      :::

      Run it, then change the never-soup model to `[1/2, 1/4, 0.24, 0.01]`. Giving soup just 1% makes KL(p ‖ q) finite (about 0.34 bits).

      ```python run
      import numpy as np

      def kl(p, q):
          """KL(p || q) in bits. Outcomes that p never produces add nothing."""
          m = p > 0
          with np.errstate(divide="ignore"):
              return np.sum(p[m] * np.log2(p[m] / q[m]))

      p = np.array([1/2, 1/4, 1/8, 1/8])             # tea, coffee, cocoa, soup
      models = {
          "uniform":    np.array([1/4, 1/4, 1/4, 1/4]),
          "never soup": np.array([1/2, 1/4, 1/4, 0.0]),
      }
      H = -np.sum(p * np.log2(p))
      print(f"entropy of the café: {H:.3f} bits\n")
      for name, q in models.items():
          ce = H + kl(p, q)                           # cross-entropy = entropy + KL
          print(f"{name}:")
          print(f"  cross-entropy {ce:.3f} bits = {ce * np.log(2):.3f} nats")
          print(f"  perplexity    {2 ** ce:.2f}")
          print(f"  KL(p || q)    {kl(p, q):.3f} bits")
          print(f"  KL(q || p)    {kl(q, p):.3f} bits")
      ```

      (The uniform model scores 0.25 both ways by coincidence.) Later lessons choose the direction on purpose. Classic distillation (Hinton et al., 2015) uses KL(teacher ‖ student), so the student must cover everything the teacher finds plausible. RLHF penalizes KL(policy ‖ reference) on the policy's own answers, so the tuned model can't drift into replies the original found very unlikely.
    bridges: []
  - id: information-theory.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.information-theory
    markdown: Score new models (a weather app, a fraud detector, a distilled student, two tokenizers) in bits, nats, and perplexity, and decide which way a KL divergence points.
    takeaway: |-
      Surprise is −log p. Entropy averages it over the real outcomes; cross-entropy averages the model's surprise instead. Their gap, the KL divergence, is what training shrinks, and it changes if you swap the two distributions.
  - id: information-theory.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.information-theory
    markdown: |-
      Entropy averages surprise under a source distribution. Cross-entropy scores a model against that source; KL divergence measures the extra loss from their mismatch.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - information-theory.s1
        - information-theory.s2
        - information-theory.s3
        - information-theory.s4
        - information-theory.s5
        - information-theory.check
      gate_refs:
        - gate.core
  scene_aliases:
    information-theory.recap: information-theory.check
assessment_families:
  - id: information-theory.base
    objective_ref: objective.information-theory
    task: base
    response_type: single_choice
    points: 1
    hint: Surprise is −log₂ p, and entropy averages it over the real outcomes.
    remediation_scene: information-theory.s2
    variants:
      - id: information-theory.base.1
        prompt: What is base-two surprise for probability 1/4?
        options:
          - id: b
            text: 4 bits
          - id: c
            text: 0.25 bits
          - id: a
            text: 2 bits
        answer: a
        feedback: Because 2² = 4, −log₂(1/4) = 2.
        retired: true
      - id: information-theory.base.2
        prompt: What is the entropy of a perfectly predictable binary source?
        options:
          - id: c
            text: 2 bits
          - id: a
            text: 0 bits
          - id: b
            text: 1 bit
        answer: a
        feedback: Only one outcome occurs, so there is no uncertainty under that distribution.
        retired: true
  - id: information-theory.transfer
    objective_ref: objective.information-theory
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what is being averaged, and in which units, before comparing two losses.
    remediation_scene: information-theory.s4
    variants:
      - id: information-theory.transfer.1
        prompt: A model assigns zero probability to a possible observed event. What happens to its log loss on that event?
        options:
          - id: c
            text: It always becomes one bit
          - id: a
            text: It diverges without smoothing or another support adjustment
          - id: b
            text: It becomes zero
        answer: a
        feedback: The negative logarithm grows without bound as assigned probability approaches zero.
        retired: true
      - id: information-theory.transfer.2
        prompt: Two tokenizers report different per-token perplexities. Can the values be compared without qualification?
        options:
          - id: a
            text: No; the units and tokenization differ
          - id: b
            text: Yes; every token contains equal information
          - id: c
            text: Yes; perplexity ignores the vocabulary
        answer: a
        feedback: Per-token averages depend on how the text was divided into tokens.
        retired: true
  - id: information-theory.base.v2
    objective_ref: objective.information-theory
    task: base
    response_type: single_choice
    points: 1
    hint: "Cross-entropy = entropy + KL. The entropy belongs to the data and can't change; the KL part measures how far the model's probabilities are from the data's."
    remediation_scene: information-theory.s3
    variants:
      - id: information-theory.base.v2.1
        prompt: A spam filter's cross-entropy on validation emails is 0.9 bits per email. The entropy of the true labels is 0.6 bits. What is the KL divergence from the true distribution to the model?
        options:
          - id: b
            text: 1.5 bits, the two numbers added together
          - id: a
            text: 0.3 bits, the loss above the entropy
          - id: c
            text: 1.5 bits, the ratio of loss to entropy
        answer: a
        feedback: KL(p ‖ q) = H(p, q) − H(p) = 0.9 − 0.6 = 0.3 bits, the part of the loss the model could still remove. Adding the two double-counts the entropy, and KL is a difference, not a ratio.
      - id: information-theory.base.v2.2
        prompt: One die is fair; another is loaded so it always lands on 6. Which has the higher entropy?
        options:
          - id: c
            text: The loaded die, because a 6 every time is so unusual
          - id: b
            text: Neither, because both dice have the same six faces
          - id: a
            text: The fair die, because its outcomes are spread evenly
        answer: a
        feedback: Entropy is average surprise. The fair die spreads probability evenly, so it has the maximum, log₂ 6 ≈ 2.58 bits; the loaded die is never surprising, so it has 0. The number of faces sets the maximum, not the actual value.
      - id: information-theory.base.v2.3
        prompt: A language model's training loss falls from 2.0 to 1.5 nats per token on the same text. What shrank?
        options:
          - id: b
            text: The entropy of the text, which became more predictable
          - id: a
            text: The KL divergence between the text and the model
          - id: c
            text: The model's own uncertainty, which is all the loss measures
        answer: a
        feedback: The text didn't change, so its entropy didn't either. Loss = entropy + KL, so the whole 0.5-nat drop is the model's probabilities moving closer to the data's. A model can also be very certain and still have a high loss if it's certain about the wrong words.
      - id: information-theory.base.v2.4
        prompt: A model gives the real next word about 1/2 on most tokens, but probability 0.001 on one token. How much does that one token add to the total loss?
        options:
          - id: c
            text: About 0.001 bits, since the loss is the probability itself
          - id: a
            text: About 10 bits, as much as ten typical tokens together
          - id: b
            text: About 1 bit, the same as any other token in the text
        answer: a
        feedback: −log₂ 0.001 ≈ 9.97 bits, while a token given ½ costs 1 bit. The loss is the negative log of the probability, not the probability, so one confident miss outweighs many good guesses.
      - id: information-theory.base.v2.5
        prompt: A model's average loss on a test text is 3 bits per token. What is its perplexity?
        options:
          - id: b
            text: '9, from 3 squared'
          - id: c
            text: '6, from 2 times 3'
          - id: a
            text: '8, from 2 to the power 3'
        answer: a
        feedback: Perplexity is 2 raised to the loss in bits, 2³ = 8. The model is as unsure as if it were choosing evenly among 8 tokens. Squaring or doubling the loss mixes up which number is the exponent.
  - id: information-theory.transfer.v2
    objective_ref: objective.information-theory
    task: transfer
    response_type: single_choice
    points: 1
    hint: Before comparing numbers, ask what is being averaged, over whose outcomes (which way the KL points), and in what units.
    remediation_scene: information-theory.s5
    variants:
      - id: information-theory.transfer.v2.1
        prompt: Team A's model scores 1.2 nats per token with a tokenizer averaging 4 characters per token. Team B's scores 0.9 nats per token with one averaging 2 characters per token. Which model predicts the text better?
        options:
          - id: b
            text: B, because 0.9 nats per token is lower than 1.2
          - id: a
            text: A, at 0.30 nats per character against B's 0.45
          - id: c
            text: Neither, since both are under the 1.5-nat mark
        answer: a
        feedback: Put both on the same footing. A spends 1.2 ÷ 4 = 0.30 nats per character and B spends 0.9 ÷ 2 = 0.45, so A is better. B's lower per-token number comes from its smaller, easier-to-guess tokens.
      - id: information-theory.transfer.v2.2
        prompt: A fraud model outputs exactly 0.0 for some transactions, and one of those turns out to be fraud. Its validation log loss is now infinite. What is the best fix?
        options:
          - id: c
            text: Drop that transaction from the validation set as an outlier
          - id: b
            text: Report the loss in bits instead of nats to shrink the number
          - id: a
            text: Keep every predicted probability a little above zero
        answer: a
        feedback: −log 0 is infinite in any unit, so switching units changes nothing. Dropping the example hides exactly the confident mistake the loss is warning about. Keeping probabilities above zero (for example with a sigmoid or softmax output, or clipping) keeps the penalty large but finite.
      - id: information-theory.transfer.v2.3
        prompt: 'A labeling tool sends a human the image the model is least sure about. The model''s class probabilities: image A (0.98, 0.01, 0.01), image B (0.34, 0.33, 0.33), image C (0.6, 0.4, 0). Which image has the highest entropy?'
        options:
          - id: b
            text: Image C, since a zero-probability class is the most surprising
          - id: a
            text: Image B, since its probability is spread almost evenly
          - id: c
            text: Image A, since it has the most extreme probability
        answer: a
        feedback: Entropy is highest when probability is spread evenly; B is close to the three-class maximum of about 1.58 bits. C has only about 0.97 bits (a class with probability 0 adds nothing), and A's confident prediction is about 0.16 bits.
      - id: information-theory.transfer.v2.4
        prompt: You distill a large teacher into a small student by minimizing KL(teacher ‖ student). The teacher gives a rare but valid reply 5% probability; the student gives it 0.01%. How does this loss treat that reply?
        options:
          - id: c
            text: It ignores the reply, because the student rarely produces it
          - id: a
            text: It penalizes the student heavily for nearly ruling the reply out
          - id: b
            text: It gives the same penalty as KL(student ‖ teacher) would
        answer: a
        feedback: KL(teacher ‖ student) averages over the teacher's outputs, and this reply has 5% weight with a large log ratio, so the student is pushed to cover it. Ignoring outputs the student rarely makes is what the other direction, KL(student ‖ teacher), would do; the two directions differ.
      - id: information-theory.transfer.v2.5
        prompt: 'A sensor reports one of four states with probabilities 1/2, 1/4, 1/8, 1/8. The engineer uses a fixed 2-bit code for every message. What is the smallest average code length possible?'
        options:
          - id: b
            text: 2 bits, because four states always need two bits each
          - id: c
            text: 1 bit, because the most common state takes half the messages
          - id: a
            text: 1.75 bits, the entropy of the sensor's states
        answer: a
        feedback: Shannon's limit is the entropy, ½ × 1 + ¼ × 2 + ⅛ × 3 + ⅛ × 3 = 1.75 bits, and a code of lengths 1, 2, 3, 3 reaches it. Fixed 2-bit codes waste 0.25 bits per message; 1 bit is below the limit.
  - id: information-theory.calculate
    objective_ref: objective.information-theory
    task: base
    response_type: numeric
    points: 1
    hint: Turn each probability into bits with −log₂ (1/2 → 1, 1/4 → 2, 1/8 → 3, and so on; probability 1 costs 0), then average over the tokens.
    remediation_scene: information-theory.s3
    absolute_tolerance: 0.01
    variants:
      - id: information-theory.calculate.1
        prompt: A model gives the three real next words of a sentence probabilities 1/2, 1/4, and 1/8. What is its average cross-entropy loss, in bits per word?
        answer: 2
        feedback: The costs are 1, 2, and 3 bits, which average (1 + 2 + 3) ÷ 3 = 2 bits per word.
      - id: information-theory.calculate.2
        prompt: A model gives four real tokens probabilities 1/4, 1/4, 1/16, and 1/16. What is its average loss, in bits per token?
        answer: 3
        feedback: The costs are 2, 2, 4, and 4 bits, which average 12 ÷ 4 = 3 bits per token.
      - id: information-theory.calculate.3
        prompt: A model gives four real tokens probabilities 1/2, 1/2, 1/32, and 1/8. What is its average loss, in bits per token?
        answer: 2.5
        feedback: The costs are 1, 1, 5, and 3 bits, which average 10 ÷ 4 = 2.5. The single 1/32 token contributes half the total.
      - id: information-theory.calculate.4
        prompt: A model is certain of the first real token (probability 1) and gives the second probability 1/8. What is its average loss, in bits per token?
        answer: 1.5
        feedback: A certain, correct prediction costs −log₂ 1 = 0 bits, and 1/8 costs 3 bits, so the average is (0 + 3) ÷ 2 = 1.5.
      - id: information-theory.calculate.5
        prompt: A model gives five real tokens probabilities 1/4, 1/8, 1/2, 1/64, and 1/2. What is its average loss, in bits per token?
        answer: 2.6
        feedback: The costs are 2, 3, 1, 6, and 1 bits, which sum to 13, and 13 ÷ 5 = 2.6 bits per token.
