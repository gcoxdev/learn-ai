scenes:
- id: information-theory.s1
  title: A rare event is more surprising
  type: explanation
  depth: intuition
  objective_refs:
  - objective.information-theory
  markdown: Using base-two logarithms, the surprise of an event with probability p is −log₂(p), measured in bits.
    Probability 1 gives 0 bits; probability 1/2 gives 1 bit; probability 1/8 gives 3 bits. A logarithm turns products
    of independent probabilities into sums of surprises.
  text_mode: Using base-two logarithms, the surprise of an event with probability p is −log₂(p), measured in bits.
    Probability 1 gives 0 bits; probability 1/2 gives 1 bit; probability 1/8 gives 3 bits. A logarithm turns products
    of independent probabilities into sums of surprises.
  bridges: []
- id: information-theory.s2
  title: Average surprise over the source
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.information-theory
  markdown: Entropy is the expected surprise under the actual distribution. A fair binary source has entropy 1 bit
    per outcome. A source that always emits the same symbol has entropy 0. These quantities describe uncertainty
    under a distribution; they are not measurements of consciousness, semantic importance, or factual correctness.
  text_mode: Entropy is the expected surprise under the actual distribution. A fair binary source has entropy 1
    bit per outcome. A source that always emits the same symbol has entropy 0. These quantities describe uncertainty
    under a distribution; they are not measurements of consciousness, semantic importance, or factual correctness.
  bridges:
  - powers-logs
  - probability
- id: information-theory.s3
  title: Score a proposed model
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.information-theory
  markdown: Cross-entropy averages the negative log probability that model q gives outcomes drawn from distribution
    p. If the observed correct token receives probability 1/4, its base-two loss is 2 bits. KL divergence from p
    to q equals cross-entropy minus entropy of p. It is directional and becomes infinite if q assigns zero probability
    where p has positive mass.
  text_mode: Cross-entropy averages the negative log probability that model q gives outcomes drawn from distribution
    p. If the observed correct token receives probability 1/4, its base-two loss is 2 bits. KL divergence from p
    to q equals cross-entropy minus entropy of p. It is directional and becomes infinite if q assigns zero probability
    where p has positive mass.
  bridges: []
- id: information-theory.s4
  title: Understand what a smaller loss means
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.information-theory
  markdown: Lower average log loss rewards assigning more probability to observed outcomes, with strong penalties
    for confident mistakes. Mutual information compares joint behavior with an independence model and measures statistical
    dependence. Neither mutual information nor lower cross-entropy establishes causation. State the log base, averaging
    unit, and tokenization when comparing reported losses.
  text_mode: Lower average log loss rewards assigning more probability to observed outcomes, with strong penalties
    for confident mistakes. Mutual information compares joint behavior with an independence model and measures statistical
    dependence. Neither mutual information nor lower cross-entropy establishes causation. State the log base, averaging
    unit, and tokenization when comparing reported losses.
  bridges: []
