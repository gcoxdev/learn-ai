schema_version: 0.2-draft
lesson:
  id: multimodal-alignment-and-fusion
  version: 0.3.0-draft
  title: Connect information expressed in different forms
  state: draft
  summary: How can a system combine what it sees with what it hears?
  slot: M23.1
  category: learning
  sources:
  - title: 'Multimodal Machine Learning: A Survey and Taxonomy'
    url: https://arxiv.org/abs/1705.09406
  - title: Learning Transferable Visual Models From Natural Language Supervision
    url: https://arxiv.org/abs/2103.00020
objectives:
- id: objective.multimodal-alignment-and-fusion
  version: 1-draft
  statement: Multimodal systems align information across modalities and combine it through defined interfaces;
    paired data, timing, and missing-modality behavior determine what can be learned.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - multimodal-alignment-and-fusion.base
  - multimodal-alignment-and-fusion.transfer
  prerequisites:
  - anyOf:
    - objective.learned-representations
  - anyOf:
    - objective.image-geometry
  - anyOf:
    - objective.audio-representations
scenes:
- id: multimodal-alignment-and-fusion.s1
  title: A modality is an information form
  type: explanation
  depth: intuition
  objective_refs:
  - objective.multimodal-alignment-and-fusion
  markdown: Text, images, audio, video, and sensor measurements have different structure and sampling rates.
    Alignment identifies correspondence, such as a caption paired with an image or speech synchronized with
    video. Fusion combines representations to support a prediction or generated output.
  text_mode: Text, images, audio, video, and sensor measurements have different structure and sampling rates.
    Alignment identifies correspondence, such as a caption paired with an image or speech synchronized with
    video. Fusion combines representations to support a prediction or generated output.
  bridges: []
- id: multimodal-alignment-and-fusion.s2
  title: Choose where to combine information
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multimodal-alignment-and-fusion
  markdown: 'Early fusion combines relatively low-level inputs; intermediate fusion combines learned features;
    late fusion combines decisions or scores. These labels describe a range of designs. A classifier averaging
    image and audio scores cannot exploit every fine-grained interaction available to a jointly trained representation.


    Think of identifying an animal from a photograph and a sound recording. Early fusion gives one system both
    inputs near the start. Intermediate fusion first turns each into useful features, then combines them. Late
    fusion might average two separate “dog” scores: 0.8 from the photograph and 0.4 from the sound gives 0.6.
    That average is a design choice, not proof that there is a 60% chance of a dog.'
  text_mode: 'Early fusion combines relatively low-level inputs; intermediate fusion combines learned features;
    late fusion combines decisions or scores. These labels describe a range of designs. A classifier averaging
    image and audio scores cannot exploit every fine-grained interaction available to a jointly trained representation.


    Think of identifying an animal from a photograph and a sound recording. Early fusion gives one system both
    inputs near the start. Intermediate fusion first turns each into useful features, then combines them. Late
    fusion might average two separate “dog” scores: 0.8 from the photograph and 0.4 from the sound gives 0.6.
    That average is a design choice, not proof that there is a 60% chance of a dog.'
  bridges: []
- id: multimodal-alignment-and-fusion.s3
  title: Trace a timing mismatch
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multimodal-alignment-and-fusion
  markdown: A video frame shows a door opening, but the associated audio segment comes from two seconds earlier.
    A model may learn a false correspondence if training assumes synchronization. Timestamps, crops, caption
    specificity, and annotation rules are part of the data contract.
  text_mode: A video frame shows a door opening, but the associated audio segment comes from two seconds earlier.
    A model may learn a false correspondence if training assumes synchronization. Timestamps, crops, caption
    specificity, and annotation rules are part of the data contract.
  bridges: []
- id: multimodal-alignment-and-fusion.s4
  title: Test each modality’s contribution
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multimodal-alignment-and-fusion
  markdown: Remove or corrupt one input channel and measure changes. A model can exploit text-only shortcuts
    on a nominally visual task. Evaluate missing modalities, contradictory evidence, and distribution shift;
    a shared vector space does not guarantee that every modality is equally informative or faithfully represented.
  text_mode: Remove or corrupt one input channel and measure changes. A model can exploit text-only shortcuts
    on a nominally visual task. Evaluate missing modalities, contradictory evidence, and distribution shift;
    a shared vector space does not guarantee that every modality is equally informative or faithfully represented.
  bridges: []
- id: multimodal-alignment-and-fusion.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.multimodal-alignment-and-fusion
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Alignment connects related information, such as a sound and the frame it belongs to. Fusion combines
    that information to make a prediction or generate an output.
- id: multimodal-alignment-and-fusion.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.multimodal-alignment-and-fusion
  markdown: Alignment connects related information, such as a sound and the frame it belongs to. Fusion combines
    that information to make a prediction or generate an output.
  text_mode: Alignment connects related information, such as a sound and the frame it belongs to. Fusion combines
