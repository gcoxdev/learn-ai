assessment_families:
- id: multimodal-alignment-and-fusion.base
  objective_ref: objective.multimodal-alignment-and-fusion
  task: base
  response_type: single_choice
  points: 1
  hint: 'Choose where to combine information: trace the inputs, operation, and result before choosing.'
  remediation_scene: multimodal-alignment-and-fusion.s2
  variants:
  - id: multimodal-alignment-and-fusion.base.1
    prompt: What does alignment identify?
    options:
    - id: b
      text: Only model parameter count
    - id: c
      text: A guarantee of equal sensor quality
    - id: a
      text: Correspondence between information across modalities
    answer: a
    feedback: Alignment connects related content or timing.
  - id: multimodal-alignment-and-fusion.base.2
    prompt: Combining final classifier scores is what kind of fusion?
    options:
    - id: c
      text: No fusion by definition
    - id: a
      text: Late fusion
    - id: b
      text: Raw-signal early fusion
    answer: a
    feedback: The combination happens after separate predictions.
- id: multimodal-alignment-and-fusion.transfer
  objective_ref: objective.multimodal-alignment-and-fusion
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Test each modality’s contribution: trace the inputs, operation, and result before choosing.'
  remediation_scene: multimodal-alignment-and-fusion.s4
  variants:
  - id: multimodal-alignment-and-fusion.transfer.1
    prompt: Mismatched audio/video timestamps can teach what?
    options:
    - id: c
      text: Only text spelling changes
    - id: a
      text: False cross-modal associations
    - id: b
      text: Guaranteed improved timing
    answer: a
    feedback: Incorrect pairs distort the learning signal.
  - id: multimodal-alignment-and-fusion.transfer.2
    prompt: Why remove images during a visual-task evaluation?
    options:
    - id: a
      text: To test whether text shortcuts explain success
    - id: b
      text: To prove images never matter
    - id: c
      text: To change the tokenizer vocabulary
    answer: a
    feedback: Ablation reveals dependence on the supposed evidence source.
