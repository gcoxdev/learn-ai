schema_version: 0.2-draft
lesson:
  id: multimodal-alignment-and-fusion
  version: 0.4.0-draft
  title: Connect information expressed in different forms
  state: draft
  summary: A phone hears a kettle whistle and sees steam. Where should the two clues meet? Pick the wrong place and some questions become impossible to answer.
  slot: M23.1
  category: learning
  sources:
    - title: "Multimodal Machine Learning: A Survey and Taxonomy (Baltrušaitis, Ahuja & Morency, 2017)"
      url: https://arxiv.org/abs/1705.09406
    - title: "Making the V in VQA Matter: Elevating the Role of Image Understanding in Visual Question Answering (Goyal et al., 2017)"
      url: https://arxiv.org/abs/1612.00837
    - title: "Flamingo: a Visual Language Model for Few-Shot Learning (Alayrac et al., 2022)"
      url: https://arxiv.org/abs/2204.14198
    - title: "Learning Transferable Visual Models From Natural Language Supervision (CLIP; Radford et al., 2021)"
      url: https://arxiv.org/abs/2103.00020
objectives:
  - id: objective.multimodal-alignment-and-fusion
    version: 3-draft
    statement: Multimodal systems align information across modalities and combine it through defined interfaces; paired data, timing, and missing-modality behavior determine what can be learned.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - multimodal-alignment-and-fusion.base.v2
      - multimodal-alignment-and-fusion.transfer.v2
      - multimodal-alignment-and-fusion.calculate
    prerequisites:
      - anyOf:
          - objective.learned-representations
      - anyOf:
          - objective.image-geometry
      - anyOf:
          - objective.audio-representations
scenes:
  - id: multimodal-alignment-and-fusion.s1
    title: The kettle, the steam, and the question
    type: explanation
    depth: intuition
    objective_refs:
      - objective.multimodal-alignment-and-fusion
    markdown: |-
      Amara is blind. She uses Lumen, a phone assistant that answers questions about photos and short videos. She points her phone at the stove, records three seconds, and asks, "Is the kettle boiling yet?"

      Lumen now holds three kinds of data about one moment:

      | Input | What it is | Rate | Three seconds gives |
      | --- | --- | --- | --- |
      | Video | Frames of colored pixels | 30 frames per second | 90 frames |
      | Sound | Air-pressure samples (see the audio lesson) | 16,000 samples per second | 48,000 numbers |
      | Question | Words, split into text tokens | whenever Amara speaks | about 7 tokens |

      Each kind of data is a **modality**, and a model that uses more than one is **multimodal**. Steam is a visual clue and the whistle a sound clue, but neither is certain alone: steam can be hard to see, and the whistle might come from a TV.

      Two jobs come before any answer. **Alignment** finds which pieces correspond: this stretch of sound goes with these frames, and the word "kettle" with that silver shape. **Fusion** combines the aligned pieces into one prediction. A widely cited 2017 survey (Baltrušaitis, Ahuja & Morency) lists both among the five core challenges of multimodal learning. Lumen stays with us for the whole module.
    bridges: []
  - id: multimodal-alignment-and-fusion.s2
    title: Three places to combine the clues
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multimodal-alignment-and-fusion
    markdown: |-
      There are three places to join them:

      | Design | Where the modalities meet | Kettle example |
      | --- | --- | --- |
      | **Early fusion** | Low-level features are joined, then one shared model reads them | Each frame's features glued to its slice of sound |
      | **Late fusion** | Separate models each predict; only their scores are combined | Vision says "boiling: 0.30", audio says 0.90; average them |
      | **Cross-attention fusion** | Each modality is encoded, then one attends to the other inside the model | The tokens of "boiling?" look up the image features that matter (the transformer module's cross-attention) |

      Late fusion is the easiest to build. Averaging gives $(0.30 + 0.90) / 2 = 0.60$: "probably boiling". If Amara's phone is on silent, Lumen falls back to the vision score alone. If the audio model has proved more reliable, weight it more: $0.3 \times 0.30 + 0.7 \times 0.90 = 0.72$.

      :::predict Amara's kitchen TV plays an ad with a whistling kettle while her own kettle sits cold. The vision model says 0.10, the audio model 0.95. What does the equal-weight average say, and what went wrong?
      $(0.10 + 0.95) / 2 = 0.525$, a weak "yes". Each model did its own job: no steam in view, a whistle in the room. But the scores meet only at the end, so late fusion can't ask whether the whistle comes from the thing in the picture.
      :::

      Early and cross-attention fusion keep features around long enough to relate them: this sound, from that direction, while that object steams. The price: they need training data with the modalities together, and a missing modality throws them off more easily.
    bridges: []
  - id: multimodal-alignment-and-fusion.s5
    title: The question late fusion can't answer
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multimodal-alignment-and-fusion
    markdown: |-
      Amara photographs her desk and asks, "Is my phone left of the laptop?" Take two photos and two questions. The answer is "yes" exactly when the question matches the photo:

      | | "Is the phone left of the laptop?" | "Is the phone right of the laptop?" |
      | --- | --- | --- |
      | Photo: phone on the left | yes | no |
      | Photo: phone on the right | no | yes |

      Late fusion gives each photo an image score $v$ and each question a text score $t$, and answers "yes" when $v + t > 0$.

      :::predict Can you choose the four scores so that all four answers come out right?
      No. The two "yes" cells need $v_L + t_L > 0$ and $v_R + t_R > 0$; add them and $v_L + v_R + t_L + t_R > 0$. The two "no" cells need $v_L + t_R \le 0$ and $v_R + t_L \le 0$; add those and the *same* total is $\le 0$. Both can't hold, so at least one answer must be wrong.
      :::

      It's the XOR pattern that stumped single-layer perceptrons in *Perceptrons* (Minsky & Papert, 1969): adding separate scores can't express how two inputs relate. The program searches every score from −3 to 3:

      ```python run
      import itertools

      # (photo, question, true answer: 1 = yes)
      cases = [("left", "left of?", 1), ("left", "right of?", 0),
               ("right", "left of?", 0), ("right", "right of?", 1)]

      grid = [x / 2 for x in range(-6, 7)]          # scores -3.0 ... 3.0
      best = 0
      for vL, vR, tL, tR in itertools.product(grid, repeat=4):
          v = {"left": vL, "right": vR}             # image-only score
          t = {"left of?": tL, "right of?": tR}     # question-only score
          right = sum((v[p] + t[q] > 0) == bool(y) for p, q, y in cases)
          best = max(best, right)
      print("best late fusion:", best, "of 4")

      # A model that reads the question while looking at the photo
      joint = sum(int(q.startswith(p)) == y for p, q, y in cases)
      print("joint model:     ", joint, "of 4")
      ```

      Late fusion tops out at 3 of 4. Widen the search to `range(-10, 11)` and it still does.

      **Cross-attention fusion** fixes this. The question's tokens become queries, and the image's patch features become keys and values, so the token for "left" can pull in features from the phone's region and compare them with the laptop's.

      :::papers Cross-attention between modalities
      $$\text{CrossAttn}(X_\text{text}, X_\text{img}) = \operatorname{softmax}\!\left(\frac{(X_\text{text} W_Q)(X_\text{img} W_K)^\top}{\sqrt{d}}\right) X_\text{img} W_V$$

      This is the transformer module's attention formula, except that queries come from the text and keys and values from the image. With 8 question tokens and 196 image patches, each head scores an 8 × 196 table, and each question token gets its own weighted mix of image features.
      :::
    diagram:
      caption: Cross-attention fusion. The question decides which parts of the photo to read.
      description: The question tokens become queries and go to a cross-attention layer. The photo goes through a vision encoder, which produces patch features; these become the keys and values for the same cross-attention layer. The cross-attention output goes into the language model's layers, which produce the answer "yes, left of it".
      nodes:
        - id: question
          label: Question tokens
          note: "Is my phone left of the laptop?"
          col: 0
          row: 0
          tone: data
        - id: photo
          label: Photo of the desk
          col: 0
          row: 2
          tone: data
        - id: venc
          label: Vision encoder
          note: one feature vector per patch
          col: 1
          row: 2
        - id: xattn
          label: Cross-attention
          note: text asks, image answers
          col: 2
          row: 1
          tone: accent
        - id: lm
          label: Language model layers
          col: 3
          row: 1
        - id: answer
          label: "Yes, left of it"
          col: 4
          row: 1
      edges:
        - from: question
          to: xattn
          label: queries
        - from: photo
          to: venc
        - from: venc
          to: xattn
          label: keys and values
        - from: xattn
          to: lm
        - from: lm
          to: answer
  - id: multimodal-alignment-and-fusion.s3
    title: When the sound arrives late
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multimodal-alignment-and-fusion
    markdown: |-
      Fusion only helps if the pieces are aligned first. Lumen's video runs at 30 frames per second, and its sound becomes log-mel frames at 100 per second (the audio lesson's 10-millisecond hop). To match them, go through seconds: video frame 45 is at $45 / 30 = 1.5$ s, which is sound frame $1.5 \times 100 = 150$.

      Now suppose the phone's recording pipeline delays the sound by 0.4 seconds. The kettle's switch clicks at sound frame 250 (2.5 s), but the click truly happened at $2.5 - 0.4 = 2.1$ s, video frame $2.1 \times 30 = 63$. Without the correction, the model pairs the click with frame 75, twelve frames too late.

      Trained on thousands of shifted clips, a model learns that a click goes with a hand already *away* from the switch. A caption for a different photo, or a transcript drifting behind the speech, teaches false pairings the same way.

      Missing modalities cause the other problem. An early-fusion model trained only on clips *with* sound has never seen the all-zero features a muted phone sends. Two common fixes:

      - During training, randomly blank out one modality now and then (*modality dropout*), so the model learns to cope.
      - Keep a late-fusion fallback that answers from whichever modality arrived.
    bridges: []
  - id: multimodal-alignment-and-fusion.s4
    title: Take the photo away and see what's left
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multimodal-alignment-and-fusion
    markdown: |-
      The most useful test of a fused model is an **ablation**: remove a modality and watch the score. Say Lumen's team runs 1,000 photo questions three ways:

      | Model input | Accuracy |
      | --- | ---: |
      | Photo + question | 74% |
      | Question only (photo replaced by a gray square) | 69% |
      | Photo only (question replaced by "Describe this.") | 22% |

      The photo adds just 5 points. The rest comes from guessing from the words: "Is there a…?" is usually "yes", and "What color is the banana?" is usually "yellow".

      :::story The VQA benchmark that could be solved without looking
      Models scored well on the original Visual Question Answering dataset (VQA; Antol et al., 2015) from the question alone. So in 2017 Goyal and colleagues built VQA v2, pairing most questions with a similar image that has a *different* answer. A model that ignores the picture now gets at least one of each pair wrong. Their title: *Making the V in VQA Matter*.
      :::

      :::mixup "The model scores well on questions about images, so it must be using the images."
      High accuracy can come from language habits. For Amara, the dangerous cases are the unusual ones, like a green banana, where the habit answers wrong.
      :::

      Lumen's team adds VQA v2-style pairs to its own tests, and the module's final lesson, on grounding evaluation, builds on them.
    bridges: []
  - id: multimodal-alignment-and-fusion.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.multimodal-alignment-and-fusion
    markdown: A car's cabin camera, a doorbell camera, a lecture recording, and a few timing calculations test whether you can choose a fusion point and spot an alignment failure.
    takeaway: |-
      Align first, then fuse. Late fusion is simple and survives a missing input but can't relate one modality to another; early and cross-attention fusion can, if the pieces are lined up in time and the model was trained with gaps.
  - id: multimodal-alignment-and-fusion.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.multimodal-alignment-and-fusion
    markdown: |-
      Alignment connects related information, such as a sound and the frame it belongs to. Fusion combines that information to make a prediction or generate an output.
