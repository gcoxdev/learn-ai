assessment_families:
  - id: multimodal-alignment-and-fusion.base
    objective_ref: objective.multimodal-alignment-and-fusion
    task: base
    response_type: single_choice
    points: 1
    hint: 'Choose where to combine information: trace the inputs, operation, and result before choosing.'
    remediation_scene: multimodal-alignment-and-fusion.s2
    variants:
      - id: multimodal-alignment-and-fusion.base.1
        prompt: What does alignment identify?
        options:
          - id: b
            text: Only model parameter count
          - id: c
            text: A guarantee of equal sensor quality
          - id: a
            text: Correspondence between information across modalities
        answer: a
        feedback: Alignment connects related content or timing.
        retired: true
      - id: multimodal-alignment-and-fusion.base.2
        prompt: Combining final classifier scores is what kind of fusion?
        options:
          - id: c
            text: No fusion by definition
          - id: a
            text: Late fusion
          - id: b
            text: Raw-signal early fusion
        answer: a
        feedback: The combination happens after separate predictions.
        retired: true
  - id: multimodal-alignment-and-fusion.transfer
    objective_ref: objective.multimodal-alignment-and-fusion
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Test each modality’s contribution: trace the inputs, operation, and result before choosing.'
    remediation_scene: multimodal-alignment-and-fusion.s4
    variants:
      - id: multimodal-alignment-and-fusion.transfer.1
        prompt: Mismatched audio/video timestamps can teach what?
        options:
          - id: c
            text: Only text spelling changes
          - id: a
            text: False cross-modal associations
          - id: b
            text: Guaranteed improved timing
        answer: a
        feedback: Incorrect pairs distort the learning signal.
        retired: true
      - id: multimodal-alignment-and-fusion.transfer.2
        prompt: Why remove images during a visual-task evaluation?
        options:
          - id: a
            text: To test whether text shortcuts explain success
          - id: b
            text: To prove images never matter
          - id: c
            text: To change the tokenizer vocabulary
        answer: a
        feedback: Ablation reveals dependence on the supposed evidence source.
        retired: true
  - id: multimodal-alignment-and-fusion.base.v2
    objective_ref: objective.multimodal-alignment-and-fusion
    task: base
    response_type: single_choice
    points: 1
    hint: Ask where the modalities meet. If only final scores meet, the model can't relate what one modality saw to what the other saw.
    remediation_scene: multimodal-alignment-and-fusion.s5
    variants:
      - id: multimodal-alignment-and-fusion.base.v2.1
        prompt: A photo assistant adds an image model's "yes" score to a question model's "yes" score. It must answer "Is the cup left of the plate?" and "Is the cup right of the plate?" on photos with the cup on either side. What limits it?
        options:
          - id: b
            text: The image model's resolution is too low to find the cup
          - id: c
            text: The question model needs more training on spatial words
          - id: a
            text: Added scores can't capture how the photo and question relate
        answer: a
        feedback: This is the XOR pattern. Any additive rule gets at most 3 of the 4 photo–question combinations right, however good each model is. Better resolution or better text training still leaves the two scores unable to interact.
      - id: multimodal-alignment-and-fusion.base.v2.2
        prompt: Which design lets the word "left" in a question pull in features from a specific region of a photo?
        options:
          - id: c
            text: Late fusion, averaging an image score with a text score
          - id: a
            text: Cross-attention, with text queries and image keys and values
          - id: b
            text: Two separate classifiers that vote on the final answer
        answer: a
        feedback: In cross-attention each text token scores every image patch and takes a weighted mix of the ones it needs. Averaging and voting only combine final scores, after each model has lost track of what the other saw.
      - id: multimodal-alignment-and-fusion.base.v2.3
        prompt: An early-fusion model was trained only on video clips with sound. At test time, a clip arrives silent, so its audio features are all zeros. What is the most likely result?
        options:
          - id: a
            text: Unreliable answers, since it never learned what to do without sound
          - id: b
            text: The same accuracy as a vision-only model, since the zeros add nothing
          - id: c
            text: Slightly better answers, since the model has less noise to process
        answer: a
        feedback: Zeros are an input the model never trained on, not a neutral "missing" signal; its learned weights may treat them as strong evidence. Modality dropout during training, or a late-fusion fallback, prepares for this.
      - id: multimodal-alignment-and-fusion.base.v2.4
        prompt: A vision model gives "boiling" a score of 0.2 and an audio model gives 0.9. Engineers weight audio at 0.7 and vision at 0.3. What does weighted late fusion output, and what can't it tell?
        options:
          - id: b
            text: 0.55, and it can't tell which model is more reliable
          - id: a
            text: 0.69, and it can't tell whether the sound comes from the pictured kettle
          - id: c
            text: 0.90, and it can't tell whether the vision model saw steam
        answer: a
        feedback: 0.3 × 0.2 + 0.7 × 0.9 = 0.06 + 0.63 = 0.69. The weights already encode which model is trusted more; what late fusion loses is any link between the two inputs, such as whether the whistle comes from the object in view. 0.55 is the unweighted average.
  - id: multimodal-alignment-and-fusion.transfer.v2
    objective_ref: objective.multimodal-alignment-and-fusion
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name the failure first (a timing mismatch, a missing modality, or a model leaning on one modality), then pick the test or fix aimed at it.
    remediation_scene: multimodal-alignment-and-fusion.s4
    variants:
      - id: multimodal-alignment-and-fusion.transfer.v2.1
        prompt: A lecture-video model learns to link the professor's words with the slides. In the training videos, the audio track was accidentally shifted 3 seconds early. What will the model most likely learn?
        options:
          - id: b
            text: Nothing at all, because the shifted audio acts as random noise
          - id: a
            text: To link each spoken phrase with the slide shown before it was said
          - id: c
            text: The correct pairing, because the words and slides still overlap
        answer: a
        feedback: A consistent shift isn't random; it's a systematic false pairing, so the model learns it. Over a long lecture the shifted words and slides overlap only partly, and the model is rewarded for the wrong match on every clip.
        retired: true
      - id: multimodal-alignment-and-fusion.transfer.v2.2
        prompt: A doorbell camera model answers "Is someone at the door?" with 91% accuracy. With the video replaced by a blank frame and only the audio and time of day kept, it still scores 88%. What should the team conclude?
        options:
          - id: c
            text: The video encoder is the strongest part and should be kept as is
          - id: b
            text: The blank-frame test is broken, since the video must matter
          - id: a
            text: The model barely uses the video and leans on sound and time cues
        answer: a
        feedback: Removing the video costs only 3 points, so most of the accuracy comes from other cues (footsteps, a doorbell, common visiting times). That's what an ablation reveals; it isn't a broken test. Cases where the cues mislead, like a quiet visitor at night, need their own checks.
      - id: multimodal-alignment-and-fusion.transfer.v2.3
        prompt: A car's driver-monitoring system fuses a cabin camera and a steering-wheel sensor. The camera sometimes fails in tunnels. Which design choice best keeps the system working then?
        options:
          - id: a
            text: Train with the camera input randomly blanked, and keep a sensor-only fallback
          - id: b
            text: Feed the camera features and sensor readings together into one early-fusion network
          - id: c
            text: Increase the camera resolution so that it captures more detail in tunnels
        answer: a
        feedback: Modality dropout teaches the model to cope with a missing input, and a late-fusion-style fallback answers from whatever arrived. A plain early-fusion network trained with both inputs is the design most likely to break when one disappears; resolution doesn't help a camera that returns nothing.
      - id: multimodal-alignment-and-fusion.transfer.v2.4
        prompt: A recipe-video model must answer "Was the onion added before the garlic?" A team compares averaging an image-classifier score with a transcript score against a model where transcript tokens attend to frame features. Why is the second more promising?
        options:
          - id: c
            text: It uses fewer parameters, so it overfits the recipe videos less
          - id: a
            text: The answer depends on relating what is said to what happens when
          - id: b
            text: Averaging scores makes the output probabilities badly calibrated
        answer: a
        feedback: Ordering two events that appear in speech and in frames is a relation between modalities, which averaged scores can't represent. Cross-attention usually costs more parameters, not fewer, and calibration isn't the core problem here.
      - id: multimodal-alignment-and-fusion.transfer.v2.5
        prompt: A lip-reading model learns to link mouth shapes with speech sounds. In its training videos, the audio track was accidentally shifted 0.5 seconds early. What will the model most likely learn?
        options:
          - id: c
            text: Nothing useful, because the shifted audio acts like random noise
          - id: b
            text: The correct pairing, because half a second is too short to matter
          - id: a
            text: To link each sound with the mouth shape from half a second earlier
        answer: a
        feedback: A consistent shift is a systematic false pairing, not noise, so the model learns it. Half a second spans several syllables, so almost every sound is paired with the wrong mouth shape.
  - id: multimodal-alignment-and-fusion.calculate
    objective_ref: objective.multimodal-alignment-and-fusion
    task: base
    response_type: numeric
    points: 1
    hint: Turn the frame number into seconds (divide by its rate), correct the time for any delay, then multiply by the other stream's rate.
    remediation_scene: multimodal-alignment-and-fusion.s3
    absolute_tolerance: 0.01
    variants:
      - id: multimodal-alignment-and-fusion.calculate.1
        prompt: Video runs at 30 frames per second and audio features at 100 frames per second. Which audio frame lines up with video frame 60?
        answer: 200
        feedback: Video frame 60 is at 60 ÷ 30 = 2 seconds, and 2 × 100 = 200.
      - id: multimodal-alignment-and-fusion.calculate.2
        prompt: Audio features run at 100 frames per second and video at 25 frames per second. A door slam appears at audio frame 300, and there is no delay. Which video frame shows the slam?
        answer: 75
        feedback: Audio frame 300 is at 300 ÷ 100 = 3 seconds, and 3 × 25 = 75.
      - id: multimodal-alignment-and-fusion.calculate.3
        prompt: A click is heard at audio frame 450 (100 frames per second), but the recording delays audio by 0.4 seconds. At 30 frames per second, which video frame shows the click actually happening?
        answer: 123
        feedback: The click is heard at 4.5 s, so it happened at 4.5 − 0.4 = 4.1 s, and 4.1 × 30 = 123. Forgetting the delay gives frame 135.
      - id: multimodal-alignment-and-fusion.calculate.4
        prompt: Speech features run at 50 frames per second and video at 30 frames per second. The audio lags the video by 0.2 seconds. A word is heard at speech frame 100. Which video frame matches when it was actually spoken?
        answer: 54
        feedback: Frame 100 is heard at 100 ÷ 50 = 2.0 s, so it was spoken at 2.0 − 0.2 = 1.8 s, and 1.8 × 30 = 54.
      - id: multimodal-alignment-and-fusion.calculate.5
        prompt: Video runs at 24 frames per second. The audio track is shifted 0.5 seconds late relative to the picture. By how many video frames is each sound misplaced?
        answer: 12
        feedback: 0.5 seconds × 24 frames per second = 12 frames.
