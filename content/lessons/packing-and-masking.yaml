assessment_families:
- id: packing-and-masking.base
  objective_ref: objective.packing-and-masking
  task: base
  response_type: single_choice
  points: 1
  hint: 'Separate two kinds of mask: trace the inputs, operation, and result before choosing.'
  remediation_scene: packing-and-masking.s2
  variants:
  - id: packing-and-masking.base.1
    prompt: What does a loss mask control?
    options:
    - id: c
      text: Only the output vocabulary size
    - id: a
      text: Which predictions contribute to the objective
    - id: b
      text: Every attention connection automatically
    answer: a
    feedback: Loss inclusion and attention visibility are separate controls.
  - id: packing-and-masking.base.2
    prompt: Does inserting an end-of-document token automatically enforce a block-diagonal attention mask?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if the token ID is large
    answer: a
    feedback: A marker and an attention rule are distinct parts of the computation.
- id: packing-and-masking.transfer
  objective_ref: objective.packing-and-masking
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Weight the actual prediction units: trace the inputs, operation, and result before choosing.'
  remediation_scene: packing-and-masking.s4
  variants:
  - id: packing-and-masking.transfer.1
    prompt: One sequence has 2 valid tokens and another has 10. Are equal sequence-mean weighting and equal token
      weighting identical?
    options:
    - id: a
      text: Not generally
    - id: b
      text: Always
    - id: c
      text: Only if stored in one file
    answer: a
    feedback: Equal sequence weights assign different total weight per valid token across lengths.
  - id: packing-and-masking.transfer.2
    prompt: A causal target is included among the keys it predicts from. What failure can result?
    options:
    - id: b
      text: Only slower tokenization
    - id: c
      text: A guaranteed improvement in legitimate forecasting
    - id: a
      text: Target leakage and misleading training loss
    answer: a
    feedback: The predictive input must respect the intended information boundary.
