schema_version: 0.2-draft
lesson:
  id: packing-and-masking
  version: 0.4.0-draft
  title: Assemble token batches without leaking targets
  state: draft
  summary: Pad every document to 2,048 tokens and most of each batch is blank. Pack them end to end instead, then decide which tokens may look at one another.
  slot: M16.4
  category: learning
  sources:
    - title: Brown et al. — Language Models are Few-Shot Learners (GPT-3, 2020), section 2.3 and appendix B
      url: https://arxiv.org/abs/2005.14165
    - title: The Llama 3 Herd of Models (2024), section 3.4
      url: https://arxiv.org/abs/2407.21783
    - title: Groeneveld et al. — OLMo, an open language-model framework
      url: https://arxiv.org/abs/2402.00838
    - title: Dive into Deep Learning — computational graphs and backpropagation
      url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html
  archetype: mechanism
objectives:
  - id: objective.packing-and-masking
    version: 3-draft
    statement: Distinguish padding, attention masks, and loss masks using shifted next-token targets and document boundaries.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - packing-and-masking.base.v2
      - packing-and-masking.base.v3
      - packing-and-masking.transfer.v3
    prerequisites:
      - anyOf:
          - objective.training-loop
      - anyOf:
          - objective.splits-and-leakage
scenes:
  - id: packing-and-masking.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.packing-and-masking
    title: Padding wastes most of the batch
    markdown: |-
      Every row Kestrel trains on is exactly 2,048 tokens long, because GPUs work on rectangular blocks of numbers. But web pages aren't 2,048 tokens long. Suppose a typical page is about 600.

      The simple fix is **padding**: put one document in each row and fill the leftover slots with a placeholder token. At 600 real tokens per row, $1 - 600/2{,}048 \approx 71\%$ of every row is padding, and the GPUs spend most of their time multiplying placeholders.

      The better fix is **packing**: join documents end to end into one long stream, with an **end-of-sequence (EOS) token** after each document to mark where it stops, then cut the stream into 2,048-token rows. No slot is wasted.

      Shrink it to see the arithmetic. Take a context of 8 and four documents that are 3, 5, 2, and 6 tokens long, counting each one's EOS.

      :::predict How many of the 32 slots are wasted if each document gets its own padded row? How many rows does packing need?
      Padding: $4 \times 8 = 32$ slots hold $3 + 5 + 2 + 6 = 16$ real tokens, so 16 slots (50%) are wasted. Packing: the 16 tokens fill exactly 2 rows of 8, with nothing wasted. Half the compute saved.
      :::

      GPT-3 (2020) trained this way: its paper says it always used full 2,048-token rows, packing several documents into one when they were shorter, separated by a special end-of-text token.
    bridges: []
  - id: packing-and-masking.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.packing-and-masking
    title: Shift the answers one place left
    markdown: |-
      Next-token training needs a question and an answer at every position. Both come from the same tokens. For the document [kestrels, hover, EOS]:

      | Position | 0 | 1 |
      | --- | --- | --- |
      | Input | kestrels | hover |
      | **Target** | hover | EOS |

      A **target** is the token a position is scored against: the *next* token. So the targets are the inputs shifted one place left, and a document of $n$ tokens gives $n - 1$ targets. In practice, the loader cuts rows of 2,049 tokens: the first 2,048 are inputs and the last 2,048 are targets.

      Forget the shift and every position's target is its own input. The model learns to copy, the loss plunges toward zero within minutes, and nothing useful is learned. That's the bug behind the too-good first loss in this module's first lesson.
    bridges: []
  - id: packing-and-masking.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.packing-and-masking
    title: The causal mask hides the answer
    markdown: |-
      The shifted targets sit in the same row as the inputs, so something must stop position 0 from simply looking at position 1, which *is* its answer. That's the job of the **attention mask**: a grid saying which positions each position may attend to. In a decoder it is the **causal mask** from the transformer module: position $i$ may attend to positions $0$ through $i$, and nothing later.

      With that mask, all 2,048 predictions in a row are computed in one parallel pass, and none of them can peek. Training a decoder is fast precisely because the mask lets every position be a separate, honest example at the same time.
    bridges: []
  - id: packing-and-masking.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.packing-and-masking
    title: Where one document ends, should attention stop?
    markdown: |-
      Packing creates a new question. In the row [a₁, a₂, EOS, b₁, b₂, b₃, b₄, EOS], the causal mask lets b₁ attend to a₁ and a₂, text from an unrelated web page.

      Two recipes are common:

      - **Plain causal mask.** Let attention cross the boundary, and trust the EOS token to tell the model a new document started. GPT-3's paper says its packed sequences were "not masked in any special way".
      - **Document mask.** Allow attention only within the same document *and* not into the future. The grid becomes a staircase of separate triangles, one per document. Llama 3 (2024) used this and reported that it made little difference in standard pretraining but mattered when training on very long sequences.

      Run the packer and look at the mask for the first row. Each `x` is a position the row's token may attend to.

      ```python run
      import numpy as np

      EOS, ctx = 0, 8
      docs = [[11, 12], [21, 22, 23, 24], [31], [41, 42, 43, 44, 45]]  # token IDs

      stream, doc_id = [], []
      for i, d in enumerate(docs):
          stream += d + [EOS]                 # an EOS token ends every document
          doc_id += [i] * (len(d) + 1)

      slots = ctx * len(docs)                 # one padded row per document
      print(f"padding: {slots} slots, {slots - len(stream)} wasted ({1 - len(stream)/slots:.0%})")
      rows = len(stream) // ctx
      print(f"packing: {rows * ctx} slots, 0 wasted")

      row = np.array(stream[:ctx])
      did = np.array(doc_id[:ctx])
      causal = np.tril(np.ones((ctx, ctx), dtype=int))
      doc_mask = causal * (did[:, None] == did[None, :])   # same document AND not in the future

      print("row 0 tokens:", row.tolist())
      for q in range(ctx):
          print(f"  pos {q} (doc {did[q]}) may attend to:", " ".join("x" if m else "." for m in doc_mask[q]))
      print("allowed pairs: causal only", causal.sum(), "| document mask", doc_mask.sum())
      ```

      The plain causal mask allows 36 pairs in this row; the document mask allows 21. Change `doc_mask` to `causal` in the print loop to see the full triangle, where position 3 (the first token of document 1) can see all of document 0.

      :::mixup "The EOS token stops attention from crossing into the previous document."
      EOS is just another token in the row. It *tells* the model a boundary is there, but only the attention mask decides what each position can see. With a plain causal mask, every position after EOS can still attend to everything before it.
      :::
    bridges: []
    diagram:
      caption: Packing documents into one row, then building its document mask.
      description: Documents A and B each get an EOS token appended and are joined into one packed row. The row's tokens get document IDs (0 for A, 1 for B). The causal mask and the document IDs combine into the document mask, which lets each position attend only to earlier positions in its own document.
      nodes:
        - id: docs
          label: Documents A and B
          note: 2 and 4 tokens long
          col: 0
          row: 0
          tone: data
        - id: eos
          label: Append EOS to each
          note: 3 and 5 tokens
          col: 1
          row: 0
        - id: row
          label: Packed row of 8
          note: a₁ a₂ EOS b₁ b₂ b₃ b₄ EOS
          col: 2
          row: 0
          tone: accent
        - id: ids
          label: Document IDs
          note: 0 0 0 1 1 1 1 1
          col: 3
          row: 0
        - id: causal
          label: Causal mask
          note: no attending to later positions
          col: 2
          row: 1
          tone: muted
        - id: docmask
          label: Document mask
          note: same document and not later
          col: 3
          row: 1
          tone: warn
      edges:
        - from: docs
          to: eos
        - from: eos
          to: row
        - from: row
          to: ids
        - from: ids
          to: docmask
        - from: causal
          to: docmask
          label: combine
  - id: packing-and-masking.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.packing-and-masking
    title: The loss mask decides what gets scored
    markdown: |-
      A second, separate mask decides which targets count toward the loss. The **loss mask** marks each target as scored or ignored, and the mean loss divides by the number of scored targets only.

      - **Padding targets** are always ignored. If you divide by every slot instead, rows with more padding report a lower loss for no real reason.
      - **The boundary target** (EOS → the next document's first token) is a guess with no useful context. Kestrel ignores it, so each document is scored only on its own $n - 1$ targets.
      - **Prompt tokens** in chat fine-tuning, a later module, are usually ignored so the model is scored only on the assistant's reply.

      Attention masks and loss masks do different jobs. Ignoring a prompt's targets doesn't hide the prompt: the reply still attends to it. And hiding a document from attention doesn't stop its tokens being scored.
    bridges: []
  - id: packing-and-masking.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.packing-and-masking
    title: Check one row by hand before a long run
    markdown: |-
      Before the long run, the Kestrel team prints one row as four lines and checks them by eye:

      | Position | 0 | 1 | 2 | 3 | 4 | 5 | 6 | 7 |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | Input | a₁ | a₂ | EOS | b₁ | b₂ | b₃ | b₄ | EOS |
      | Target | a₂ | EOS | b₁ | b₂ | b₃ | b₄ | EOS | c₁ |
      | Document | 0 | 0 | 0 | 1 | 1 | 1 | 1 | 1 |
      | Scored? | yes | yes | no | yes | yes | yes | yes | no |

      Positions 2 and 7 are the boundary targets, so 6 of the 8 targets are scored: $(3-1) + (5-1) = 6$. If the printout showed a target equal to its input, the shift is missing. If it showed "yes" under a padding slot, the loss is diluted. Five minutes of reading rows catches bugs that a smooth loss curve hides for weeks.
    bridges: []
  - id: packing-and-masking.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.packing-and-masking
    markdown: Padding and target counts, a packed row to score, a chat model that can't see its question, and a sensor-log model test whether you can tell padding, attention masks, and loss masks apart.
    takeaway: |-
      Packing fills every slot; targets are the inputs shifted one place; the attention mask decides what each position can see; the loss mask decides which targets are scored. EOS marks a boundary but blocks nothing.
  - id: packing-and-masking.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.packing-and-masking
    markdown: |-
      Sequence packing, padding, document boundaries, attention masks, and loss masks jointly define which context predicts which targets and how the batch loss is weighted.
  - id: packing-and-masking.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.packing-and-masking
    title: A visible prompt can be unscored
    markdown: |-
      Apply the two masks to chat fine-tuning. A recipe leaves the prompt's targets out of the loss, but lets every reply token attend to the prompt. What role does the prompt play?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: It supplies context without being a scored target in this recipe.
        - id: b
          text: It is removed from the input entirely.
        - id: c
          text: It must receive the same loss as every response token.
      answer: a
      reveal_markdown: |-
        The attention mask lets the reply read the prompt; the loss mask simply doesn't score the prompt's targets. Visibility and scoring are separate switches.
      hint: Ask two separate questions. Can the reply attend to the prompt? Are the prompt's own targets scored?
      id: packing-and-masking.practice.v2.7
