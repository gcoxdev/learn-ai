schema_version: 0.2-draft
lesson:
  id: packing-and-masking
  version: 0.1.0-draft
  title: Assemble token batches without leaking targets
  state: draft
  summary: Sequence packing, padding, document boundaries, attention masks, and loss masks jointly define which
    context predicts which targets and how the batch loss is weighted.
  slot: M16.4
  category: learning
  minutes: 12
  sources:
  - title: The Llama 3 Herd of Models
    url: https://arxiv.org/abs/2407.21783
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.packing-and-masking
  version: 1-draft
  statement: Sequence packing, padding, document boundaries, attention masks, and loss masks jointly define which
    context predicts which targets and how the batch loss is weighted.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - packing-and-masking.base
  - packing-and-masking.transfer
  prerequisites:
  - anyOf:
    - objective.training-loop
  - anyOf:
    - objective.splits-and-leakage
scenes:
- id: packing-and-masking.s1
  title: Use available sequence space efficiently
  type: explanation
  depth: intuition
  objective_refs:
  - objective.packing-and-masking
  markdown: A fixed-length batch can waste space when documents are short. Packing places multiple token sequences
    into a training example or batch layout. Padding fills unused positions under a convention. Efficiency gains
    are useful only if the intended attention and prediction boundaries remain correct.
  text_mode: A fixed-length batch can waste space when documents are short. Packing places multiple token sequences
    into a training example or batch layout. Padding fills unused positions under a convention. Efficiency gains
    are useful only if the intended attention and prediction boundaries remain correct.
  bridges: []
- id: packing-and-masking.s2
  title: Separate two kinds of mask
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.packing-and-masking
  markdown: An attention mask controls which positions can supply information to a query. A loss mask controls which
    output positions contribute to the objective. Ignoring a padding target in the loss does not automatically stop
    attention from reading padding or another document. Conversely, hiding a key does not remove every loss term.
  text_mode: An attention mask controls which positions can supply information to a query. A loss mask controls
    which output positions contribute to the objective. Ignoring a padding target in the loss does not automatically
    stop attention from reading padding or another document. Conversely, hiding a key does not remove every loss
    term.
  bridges: []
- id: packing-and-masking.s3
  title: Trace a packed boundary
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.packing-and-masking
  markdown: Pack document A with three tokens and document B with two. A block-diagonal attention policy can let
    B read only B’s prefix, while a concatenated policy may deliberately allow earlier-document context. An end-of-document
    token marks a boundary but does not itself implement every desired attention restriction. State the recipe explicitly.
  text_mode: Pack document A with three tokens and document B with two. A block-diagonal attention policy can let
    B read only B’s prefix, while a concatenated policy may deliberately allow earlier-document context. An end-of-document
    token marks a boundary but does not itself implement every desired attention restriction. State the recipe explicitly.
  bridges: []
- id: packing-and-masking.s4
  title: Weight the actual prediction units
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.packing-and-masking
  markdown: If sequences have different valid-token counts, averaging sequence means equally differs from averaging
    all valid tokens. Check shifted labels, ignored positions, reset position indices, and boundary tokens. A model
    can obtain misleadingly low loss by accidentally seeing future or target information.
  text_mode: If sequences have different valid-token counts, averaging sequence means equally differs from averaging
    all valid tokens. Check shifted labels, ignored positions, reset position indices, and boundary tokens. A model
    can obtain misleadingly low loss by accidentally seeing future or target information.
  bridges: []
- id: packing-and-masking.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.packing-and-masking
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: packing-and-masking.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.packing-and-masking
  markdown: Sequence packing, padding, document boundaries, attention masks, and loss masks jointly define which
    context predicts which targets and how the batch loss is weighted.
  text_mode: Sequence packing, padding, document boundaries, attention masks, and loss masks jointly define which
    context predicts which targets and how the batch loss is weighted.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - packing-and-masking.s1
    - packing-and-masking.s2
    - packing-and-masking.s3
    - packing-and-masking.s4
    - packing-and-masking.check
