schema_version: 0.2-draft
lesson:
  id: packing-and-masking
  version: 0.3.0-draft
  title: Assemble token batches without leaking targets
  state: draft
  summary: Fill a small sequence box, then decide which tokens may look at one another and which answers count
    toward the score.
  slot: M16.4
  category: learning
  sources:
  - title: Groeneveld et al. — OLMo, an open language-model framework
    url: https://arxiv.org/abs/2402.00838
  - title: Dive into Deep Learning — computational graphs and backpropagation
    url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html
  archetype: mechanism
objectives:
- id: objective.packing-and-masking
  version: 2-draft
  statement: Distinguish padding, attention masks, and loss masks using shifted next-token targets and document
    boundaries.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - packing-and-masking.base.v2
  - packing-and-masking.transfer.v2
  prerequisites:
  - anyOf:
    - objective.training-loop
  - anyOf:
    - objective.splits-and-leakage
scenes:
- id: packing-and-masking.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.packing-and-masking
  title: The sequence box has a fixed capacity
  markdown: A batch often uses rectangular arrays, even when sentences have different lengths. **Padding**
    adds placeholder positions so examples fit the chosen shape. If the maximum length is five and an example
    has three tokens, it needs two padding positions. **Packing** can place shorter examples into one longer
    sequence to use capacity efficiently. Neither operation is a learning objective by itself. We must still
    specify where examples begin and end and what the model is asked to predict.
  text_mode: A batch often uses rectangular arrays, even when sentences have different lengths. **Padding**
    adds placeholder positions so examples fit the chosen shape. If the maximum length is five and an example
    has three tokens, it needs two padding positions. **Packing** can place shorter examples into one longer
    sequence to use capacity efficiently. Neither operation is a learning objective by itself. We must still
    specify where examples begin and end and what the model is asked to predict.
  bridges: []
- id: packing-and-masking.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.packing-and-masking
  title: Shift the answer one place ahead
  markdown: For a causal next-token task, the sequence [red,cat,END] supplies prediction pairs red→cat and
    cat→END. With no extra start marker in this toy setup, three tokens produce two next-token targets. A longer
    sequence of length n similarly supplies n−1 adjacent targets. A **target** is the answer compared with
    a prediction at a given position. Forgetting the shift can accidentally train a system to copy its current
    token rather than predict the next one.
  text_mode: For a causal next-token task, the sequence [red,cat,END] supplies prediction pairs red→cat and
    cat→END. With no extra start marker in this toy setup, three tokens produce two next-token targets. A longer
    sequence of length n similarly supplies n−1 adjacent targets. A **target** is the answer compared with
    a prediction at a given position. Forgetting the shift can accidentally train a system to copy its current
    token rather than predict the next one.
  bridges: []
- id: packing-and-masking.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.packing-and-masking
  title: Control what each prediction can inspect
  markdown: An **attention mask** determines which positions may supply information to a query. A causal mask
    permits earlier positions and the current input position but blocks later tokens that would reveal the
    answer. For [red,cat,END], the prediction after red cannot inspect cat or END. During training, several
    positions can still be processed in parallel because the mask enforces this information boundary. Parallel
    calculation does not mean future answers are allowed into each prediction.
  text_mode: An **attention mask** determines which positions may supply information to a query. A causal mask
    permits earlier positions and the current input position but blocks later tokens that would reveal the
    answer. For [red,cat,END], the prediction after red cannot inspect cat or END. During training, several
    positions can still be processed in parallel because the mask enforces this information boundary. Parallel
    calculation does not mean future answers are allowed into each prediction.
  bridges: []
- id: packing-and-masking.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.packing-and-masking
  title: Control which predictions are scored
  markdown: 'A **loss mask** chooses which target positions contribute to the loss. Padding targets are commonly
    excluded. In instruction tuning, a recipe may score assistant-response tokens while excluding prompt tokens.
    An unscored prompt can still be visible as context. Attention masks and loss masks therefore do different
    jobs: one governs information flow, the other governs scored predictions. Excluding a target from the loss
    does not itself prevent the model from reading that position.'
  text_mode: 'A **loss mask** chooses which target positions contribute to the loss. Padding targets are commonly
    excluded. In instruction tuning, a recipe may score assistant-response tokens while excluding prompt tokens.
    An unscored prompt can still be visible as context. Attention masks and loss masks therefore do different
    jobs: one governs information flow, the other governs scored predictions. Excluding a target from the loss
    does not itself prevent the model from reading that position.'
  bridges: []
- id: packing-and-masking.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.packing-and-masking
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Packing arranges positions; attention masks control information; loss masks choose scored targets.
    These are three separate decisions.
- id: packing-and-masking.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.packing-and-masking
  markdown: Sequence packing, padding, document boundaries, attention masks, and loss masks jointly define
    which context predicts which targets and how the batch loss is weighted.
  text_mode: Sequence packing, padding, document boundaries, attention masks, and loss masks jointly define
    which context predicts which targets and how the batch loss is weighted.
- id: packing-and-masking.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.packing-and-masking
  title: Packing documents requires a boundary policy
  markdown: Pack document A=[red,cat,END] and B=[blue,dog,END]. Naively treating all six tokens as one stream
    creates five adjacent prediction targets, including END→blue. A recipe that keeps documents independent
    excludes that cross-boundary target and restricts cross-document attention, leaving four within-document
    targets. Another recipe may deliberately train on concatenated streams. State the convention. A loss mask
    by itself does not block attention across the boundary, and an END token by itself is not a permission
    rule.
  text_mode: Pack document A=[red,cat,END] and B=[blue,dog,END]. Naively treating all six tokens as one stream
    creates five adjacent prediction targets, including END→blue. A recipe that keeps documents independent
    excludes that cross-boundary target and restricts cross-document attention, leaving four within-document
    targets. Another recipe may deliberately train on concatenated streams. State the convention. A loss mask
    by itself does not block attention across the boundary, and an END token by itself is not a permission
    rule.
  bridges: []
- id: packing-and-masking.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.packing-and-masking
  title: Inspect a tiny batch before a large run
  markdown: 'Write four rows: input tokens, shifted targets, allowed attention, and included loss positions.
    Check a short example, a padded example, and a packed pair by hand. Verify that the reported mean loss
    divides by the intended number of included targets rather than all padded positions. These tiny checks
    catch mistakes that a smooth training curve can hide. Remember “arrange, allow, score” before interpreting
    a batching or masking optimization.'
  text_mode: 'Write four rows: input tokens, shifted targets, allowed attention, and included loss positions.
    Check a short example, a padded example, and a packed pair by hand. Verify that the reported mean loss
    divides by the intended number of included targets rather than all padded positions. These tiny checks
    catch mistakes that a smooth training curve can hide. Remember “arrange, allow, score” before interpreting
    a batching or masking optimization.'
  bridges: []
- id: packing-and-masking.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.packing-and-masking
  title: A visible prompt can be unscored
  markdown: An instruction-tuning recipe excludes prompt targets from loss but allows the response to attend
    to the prompt. What is the prompt’s role?
  text_mode: An instruction-tuning recipe excludes prompt targets from loss but allows the response to attend
    to the prompt. What is the prompt’s role?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: It supplies context without being a scored target in this recipe.
    - id: b
      text: It is removed from the input entirely.
    - id: c
      text: It must receive the same loss as every response token.
    answer: a
    reveal_markdown: Information visibility and target scoring are separate. A loss mask can leave the prompt
      available as context.
    hint: Trace the example using the rule from the preceding pages.
    id: packing-and-masking.practice.v2.7
