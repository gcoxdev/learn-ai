assessment_families:
  - id: packing-and-masking.base
    objective_ref: objective.packing-and-masking
    task: base
    response_type: single_choice
    points: 1
    hint: 'Separate two kinds of mask: trace the inputs, operation, and result before choosing.'
    remediation_scene: packing-and-masking.s2
    variants:
      - id: packing-and-masking.base.1
        prompt: What does a loss mask control?
        options:
          - id: c
            text: Only the output vocabulary size
          - id: a
            text: Which predictions contribute to the objective
          - id: b
            text: Every attention connection automatically
        answer: a
        feedback: Loss inclusion and attention visibility are separate controls.
        retired: true
      - id: packing-and-masking.base.2
        prompt: Does inserting an end-of-document token automatically enforce a block-diagonal attention mask?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if the token ID is large
        answer: a
        feedback: A marker and an attention rule are distinct parts of the computation.
        retired: true
  - id: packing-and-masking.transfer
    objective_ref: objective.packing-and-masking
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Weight the actual prediction units: trace the inputs, operation, and result before choosing.'
    remediation_scene: packing-and-masking.s4
    variants:
      - id: packing-and-masking.transfer.1
        prompt: One sequence has 2 valid tokens and another has 10. Are equal sequence-mean weighting and equal token weighting identical?
        options:
          - id: a
            text: Not generally
          - id: b
            text: Always
          - id: c
            text: Only if stored in one file
        answer: a
        feedback: Equal sequence weights assign different total weight per valid token across lengths.
        retired: true
      - id: packing-and-masking.transfer.2
        prompt: A causal target is included among the keys it predicts from. What failure can result?
        options:
          - id: b
            text: Only slower tokenization
          - id: c
            text: A guaranteed improvement in legitimate forecasting
          - id: a
            text: Target leakage and misleading training loss
        answer: a
        feedback: The predictive input must respect the intended information boundary.
        retired: true
  - id: packing-and-masking.base.v2
    objective_ref: objective.packing-and-masking
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Padding is capacity minus real tokens. Targets are the inputs shifted one place, so a sequence of n tokens has n − 1 of them.
    remediation_scene: packing-and-masking.s2
    variants:
      - prompt: A batch has padded length 6. One independent sequence contains 4 tokens including END, with no extra start token. Record padding positions and within-sequence next-token targets.
        answers:
          padding: 2
          targets: 3
        reason_answer: a
        reason_options:
          - id: a
            text: Padding fills the shape; adjacent prediction targets number n−1.
          - id: b
            text: Every padded position must be a scored next-token target.
          - id: c
            text: Each real sequence token supplies a target even without a following token.
        feedback: Padding is 6 − 4 = 2 slots. Targets are the tokens shifted one place, so 4 tokens give 3; the last token, END (the EOS token), has no next token to predict. Scoring padding slots as targets would only teach the model to predict placeholders.
        id: packing-and-masking.base.v2.1
      - prompt: A batch has padded length 8. One independent sequence contains 5 tokens including END, with no extra start token. Record padding positions and within-sequence next-token targets.
        answers:
          padding: 3
          targets: 4
        reason_answer: a
        reason_options:
          - id: b
            text: Every padded position must be a scored next-token target.
          - id: a
            text: Padding fills the shape; adjacent prediction targets number n−1.
          - id: c
            text: Each real sequence token supplies a target even without a following token.
        feedback: Padding is 8 − 5 = 3 slots. Targets are the tokens shifted one place, so 5 tokens give 4; the last token, END (the EOS token), has no next token to predict. Scoring padding slots as targets would only teach the model to predict placeholders.
        id: packing-and-masking.base.v2.2
      - prompt: A batch has padded length 5. One independent sequence contains 3 tokens including END, with no extra start token. Record padding positions and within-sequence next-token targets.
        answers:
          padding: 2
          targets: 2
        reason_answer: a
        reason_options:
          - id: c
            text: Each real sequence token supplies a target even without a following token.
          - id: b
            text: Every padded position must be a scored next-token target.
          - id: a
            text: Padding fills the shape; adjacent prediction targets number n−1.
        feedback: Padding is 5 − 3 = 2 slots. Targets are the tokens shifted one place, so 3 tokens give 2; the last token, END (the EOS token), has no next token to predict. Scoring padding slots as targets would only teach the model to predict placeholders.
        id: packing-and-masking.base.v2.3
      - prompt: A batch has padded length 7. One independent sequence contains 6 tokens including END, with no extra start token. Record padding positions and within-sequence next-token targets.
        answers:
          padding: 1
          targets: 5
        reason_answer: a
        reason_options:
          - id: a
            text: Padding fills the shape; adjacent prediction targets number n−1.
          - id: b
            text: Every padded position must be a scored next-token target.
          - id: c
            text: Each real sequence token supplies a target even without a following token.
        feedback: Padding is 7 − 6 = 1 slot. Targets are the tokens shifted one place, so 6 tokens give 5; the last token, END (the EOS token), has no next token to predict. Scoring padding slots as targets would only teach the model to predict placeholders.
        id: packing-and-masking.base.v2.4
    numeric_fields:
      - id: padding
        label: Padding positions
      - id: targets
        label: Within-sequence targets
    absolute_tolerance: 1e-6
  - id: packing-and-masking.transfer.v2
    objective_ref: objective.packing-and-masking
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: packing-and-masking.s3
    variants:
      - prompt: Which mask blocks future-token information from a causal prediction?
        answer: a
        options:
          - id: a
            text: An attention mask
          - id: c
            text: A display mask that hides text in the interface
          - id: b
            text: A loss mask that only drops prompt targets
        feedback: Attention masking constrains information flow inside the computation.
        id: packing-and-masking.transfer.v2.1
        retired: true
      - prompt: A packed batch uses an END marker but unrestricted cross-document attention. What does END alone establish?
        answer: a
        options:
          - id: b
            text: A guaranteed block on cross-document information
          - id: a
            text: A token boundary cue, without enforcing attention independence
          - id: c
            text: A rule that automatically removes all cross-boundary losses
        feedback: An end marker is data; attention permissions need an explicit rule.
        id: packing-and-masking.transfer.v2.2
        retired: true
      - prompt: Two independent sequences of lengths 3 and 4 include END and no start token. How many within-sequence next-token targets are there?
        answer: a
        options:
          - id: c
            text: '7'
          - id: b
            text: '6'
          - id: a
            text: '5'
        feedback: They contribute (3−1)+(4−1)=5 targets; the join is not scored.
        id: packing-and-masking.transfer.v2.3
        retired: true
      - prompt: A mean loss divides by all padded positions although padding targets were excluded. What should be checked?
        answer: a
        options:
          - id: c
            text: The attention mask should be removed to compensate
          - id: a
            text: The denominator should match the included target positions
          - id: b
            text: The tokenizer must merge every padding token with END
        feedback: Loss masking and reduction must agree; otherwise padding changes the effective loss scale.
        id: packing-and-masking.transfer.v2.4
        retired: true
  - id: packing-and-masking.base.v3
    objective_ref: objective.packing-and-masking
    task: base
    response_type: single_choice
    points: 1
    hint: Keep three things apart. EOS is a token that marks a boundary, the attention mask decides what each position can see, and the loss mask decides which targets are scored.
    remediation_scene: packing-and-masking.s5
    variants:
      - id: packing-and-masking.base.v3.1
        prompt: In a packed row, which setting stops a token in the second document from attending to the first document?
        options:
          - id: c
            text: Appending an EOS token to the end of the first document
          - id: a
            text: An attention mask that allows only earlier positions in the same document
          - id: b
            text: A loss mask that ignores the target just after the boundary
        answer: a
        feedback: Only the attention mask controls what each position can see. EOS is a token the model reads, and the loss mask changes which targets are scored, not what is visible.
      - id: packing-and-masking.base.v3.2
        prompt: Documents average 500 tokens, and each is padded to its own 2,048-token row. Roughly what share of all slots is padding?
        options:
          - id: b
            text: About 24%, the share of each row filled with real text
          - id: a
            text: About 76%, since 1 − 500/2,048 ≈ 0.76
          - id: c
            text: About 4%, since padding fills only the gap after EOS
        answer: a
        feedback: Each row holds 500 real tokens and 1,548 placeholders, and 1,548/2,048 ≈ 76%. 24% is the real-text share, the complement of the answer. Packing would remove nearly all of that waste.
      - id: packing-and-masking.base.v3.3
        prompt: A packed row of 8 holds document A (3 tokens including EOS) and document B (5 tokens including EOS). The recipe ignores the target that crosses from A into B and the one after B's EOS. How many targets are scored?
        options:
          - id: a
            text: 6, since each document gives its length minus one
          - id: b
            text: 8, since each of the 8 positions predicts a token
          - id: c
            text: 7, since just the join between A and B is ignored
        answer: a
        feedback: A gives 3 − 1 = 2 targets and B gives 5 − 1 = 4, for 6. Every position has a target, but two of them cross a boundary, and this recipe ignores both.
      - id: packing-and-masking.base.v3.4
        prompt: A recipe packs documents with EOS tokens between them and uses only the plain causal mask. What can the first token of the second document attend to?
        options:
          - id: b
            text: Itself alone, because the EOS token resets attention
          - id: c
            text: The EOS token, which summarizes the previous document
          - id: a
            text: Itself plus the whole first document and its EOS token
        answer: a
        feedback: A plain causal mask allows every earlier position in the row, whatever document it came from. EOS doesn't reset anything; it's just a signal the model can learn to use, which is how GPT-3 was trained.
  - id: packing-and-masking.transfer.v3
    objective_ref: objective.packing-and-masking
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask which mask the bug or mismatch lives in. Is the problem what a position can see, or what gets scored and averaged?
    remediation_scene: packing-and-masking.s4
    variants:
      - id: packing-and-masking.transfer.v3.1
        prompt: A chat model is fine-tuned to score only its replies. After training, its answers ignore what the user asked. A bug report says the prompt mask was applied in the wrong place. What most likely happened?
        options:
          - id: c
            text: The prompt's targets were scored along with the reply's targets
          - id: b
            text: The EOS token after the prompt was removed from the input row
          - id: a
            text: The prompt was hidden from attention instead of only from the loss
        answer: a
        feedback: If the reply can't attend to the prompt, it has to answer without seeing the question. Scoring the prompt's targets would waste some training but leave the question visible, and a missing EOS would blur a boundary rather than hide the question.
      - id: packing-and-masking.transfer.v3.2
        prompt: A team extends a model to 64,000-token rows packed with short web pages and a plain causal mask. Late tokens in each row start drawing on unrelated pages. Which change targets this?
        options:
          - id: a
            text: Switch to a document mask so attention stays inside each page
          - id: b
            text: Ignore the loss on every target that falls after an EOS token
          - id: c
            text: Pad each page to its own 64,000-token row instead of packing
        answer: a
        feedback: A document mask stops attention crossing page boundaries while keeping the rows full. Llama 3 reported this mattered most for very long sequences. Ignoring those targets would throw away most of the data, and padding would waste nearly every slot.
      - id: packing-and-masking.transfer.v3.3
        prompt: Two runs of the same model report different average losses. The run on shorter documents, with far more padding, reports the lower loss. What should be checked first?
        options:
          - id: b
            text: Whether short documents are easier to predict than long ones
          - id: a
            text: Whether the average divides by all slots rather than scored targets
          - id: c
            text: Whether the causal mask lets padding positions see the future
        answer: a
        feedback: Padding targets add zero loss. Dividing by every slot lets extra padding pull the average down. Short documents might differ in difficulty, but the padding-heavy run is the red flag to check first.
      - id: packing-and-masking.transfer.v3.4
        prompt: A model predicts each factory machine's next sensor reading. Training rows pack logs from many machines under a plain causal mask, but in use it sees one machine's log at a time. What mismatch does this create?
        options:
          - id: c
            text: Training rows are shorter than the logs seen in use, so context runs out
          - id: b
            text: The loss in training includes readings that won't exist in use
          - id: a
            text: Training predictions can lean on other machines' logs that use never supplies
        answer: a
