schema_version: 0.2-draft
lesson:
  id: tokenizer-training
  version: 0.1.0-draft
  title: Learn the units used by a language model
  state: draft
  summary: BPE and unigram tokenizers construct subword vocabularies with different learning procedures; normalization,
    merge rules, special tokens, and model compatibility determine the encoded sequence.
  slot: M14.6
  category: learning
  minutes: 12
  sources:
  - title: Speech and Language Processing — authors’ draft
    url: https://web.stanford.edu/~jurafsky/slp3/
  - title: Neural Machine Translation of Rare Words with Subword Units
    url: https://aclanthology.org/P16-1162/
  - title: Subword Regularization
    url: https://aclanthology.org/P18-1007/
objectives:
- id: objective.tokenizer-training
  version: 1-draft
  statement: BPE and unigram tokenizers construct subword vocabularies with different learning procedures; normalization,
    merge rules, special tokens, and model compatibility determine the encoded sequence.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - tokenizer-training.base
  - tokenizer-training.transfer
  prerequisites:
  - anyOf:
    - objective.tokenization
  - anyOf:
    - objective.count-based-language
scenes:
- id: tokenizer-training.s1
  title: A tokenizer has learned or configured rules
  type: explanation
  depth: intuition
  objective_refs:
  - objective.tokenizer-training
  markdown: A tokenizer turns text into token IDs using normalization, pretokenization, vocabulary, and segmentation
    rules. Its training process is separate from training the language model’s weights. Reusing a model with an
    incompatible tokenizer can map text to the wrong IDs or meanings.
  text_mode: A tokenizer turns text into token IDs using normalization, pretokenization, vocabulary, and segmentation
    rules. Its training process is separate from training the language model’s weights. Reusing a model with an
    incompatible tokenizer can map text to the wrong IDs or meanings.
  bridges: []
- id: tokenizer-training.s2
  title: Follow a BPE merge
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tokenizer-training
  markdown: Begin with smaller symbols and count adjacent pairs in the training corpus under a specified pretokenization.
    If the pair “a b” is selected for merging, occurrences become the new symbol “ab.” Repeating selected merges
    builds larger subwords. Encoding must apply the learned convention consistently; a merge table is not simply
    a dictionary of whole words.
  text_mode: Begin with smaller symbols and count adjacent pairs in the training corpus under a specified pretokenization.
    If the pair “a b” is selected for merging, occurrences become the new symbol “ab.” Repeating selected merges
    builds larger subwords. Encoding must apply the learned convention consistently; a merge table is not simply
    a dictionary of whole words.
  bridges: []
- id: tokenizer-training.s3
  title: Contrast a unigram model
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tokenizer-training
  markdown: A unigram tokenizer starts with candidate pieces and estimates a probabilistic segmentation model, pruning
    pieces while maintaining useful coverage. A string can admit several segmentations. The objective and search
    differ from greedy pair merging. Both methods can represent rare words through smaller units when the vocabulary
    allows them.
  text_mode: A unigram tokenizer starts with candidate pieces and estimates a probabilistic segmentation model,
    pruning pieces while maintaining useful coverage. A string can admit several segmentations. The objective and
    search differ from greedy pair merging. Both methods can represent rare words through smaller units when the
    vocabulary allows them.
  bridges: []
- id: tokenizer-training.s4
  title: Preserve the surrounding conventions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tokenizer-training
  markdown: Special IDs may delimit messages, mark sequence ends, or represent unknown pieces. Byte fallback and
    normalization choices affect coverage and exact reconstruction. Save tokenizer files and chat-template conventions
    with the model artifact. Tokenization is part of the executable interface, not a cosmetic preprocessing label.
  text_mode: Special IDs may delimit messages, mark sequence ends, or represent unknown pieces. Byte fallback and
    normalization choices affect coverage and exact reconstruction. Save tokenizer files and chat-template conventions
    with the model artifact. Tokenization is part of the executable interface, not a cosmetic preprocessing label.
  bridges: []
- id: tokenizer-training.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.tokenizer-training
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: BPE and unigram tokenizers construct subword vocabularies with different learning procedures; normalization,
    merge rules, special tokens, and model compatibility determine the encoded sequence.
- id: tokenizer-training.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.tokenizer-training
  markdown: BPE and unigram tokenizers construct subword vocabularies with different learning procedures; normalization,
