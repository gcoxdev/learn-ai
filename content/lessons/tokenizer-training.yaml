  - id: tokenizer-training.transfer.v2
    objective_ref: objective.tokenizer-training
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: tokenizer-training.s3
    variants:
      - prompt: A new tokenizer assigns different pieces to the same IDs. What should happen before using it with old weights?
        answer: a
        options:
          - id: b
            text: Keep the weights and assume ID numbers preserve meaning
          - id: a
            text: Check and adapt tokenizer/model compatibility
          - id: c
            text: Sort the input IDs into numerical order
        feedback: Embedding rows were trained for the old token assignments; a compatibility plan is required.
        id: tokenizer-training.transfer.v2.1
        retired: true
      - prompt: What changes when a frozen BPE tokenizer encodes a new sentence?
        answer: a
        options:
          - id: b
            text: The saved merge list after every sentence
          - id: c
            text: The language model’s weights during splitting
          - id: a
            text: The output sequence for that sentence
        feedback: Encoding applies existing rules and produces a sequence.
        id: tokenizer-training.transfer.v2.2
        retired: true
      - prompt: One language needs twice as many tokens for comparable messages. What is a useful next check?
        answer: a
        options:
          - id: a
            text: Measure coverage and sequence-cost differences on representative text
          - id: c
            text: Treat the higher count as a reasoning benchmark
          - id: b
            text: Conclude speakers express twice as many ideas
        feedback: Tokenization efficiency and semantic or reasoning quality are distinct measurements.
        id: tokenizer-training.transfer.v2.3
        retired: true
      - prompt: Two pairs tie for the highest count. What makes the training procedure reproducible?
        answer: a
        options:
          - id: a
            text: A documented tie-breaking rule
          - id: b
            text: Choosing whichever pair happens to appear in memory first
          - id: c
            text: Changing the winner whenever a test score falls
        feedback: A defined tie rule avoids hidden implementation-dependent vocabulary changes.
        id: tokenizer-training.transfer.v2.4
        retired: true
  - id: tokenizer-training.base.v3
    objective_ref: objective.tokenizer-training
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Count the pair once for every place it occurs, multiplied by how often each word appears. After the merge, each occurrence of the pair becomes one token instead of two.
    remediation_scene: tokenizer-training.s3
    absolute_tolerance: 0.1
    numeric_fields:
      - id: pairs
        label: Count of the pair before merging
      - id: tokens
        label: Total tokens after the merge
    variants:
      - id: tokenizer-training.base.v3.1
        prompt: A corpus has "hug" 4 times, "pug" 2 times, and "hugs" 1 time, split into single letters. Merge u + g everywhere. Give the u + g count before merging and the total tokens after.
        answers:
          pairs: 7
          tokens: 15
        reason_answer: a
        reason_options:
          - id: a
            text: Weight pairs by word frequency; each merged pair saves one token.
          - id: b
            text: Count each distinct word once, however often it appears.
          - id: c
            text: A merge turns each word that contains the pair into one token.
        feedback: u + g appears once in each word, so 4 + 2 + 1 = 7. Before merging there are 12 + 6 + 4 = 22 tokens; each of the 7 merges saves one, leaving 15 (h·ug ×4, p·ug ×2, h·ug·s).
      - id: tokenizer-training.base.v3.2
        prompt: A corpus has "low" 3 times and "slow" 2 times, split into single letters. Merge l + o everywhere. Give the l + o count before merging and the total tokens after.
        answers:
          pairs: 5
          tokens: 12
        reason_answer: c
        reason_options:
          - id: a
            text: Count each distinct word once, however often it appears.
          - id: b
            text: A merge turns each word that contains the pair into one token.
          - id: c
            text: Weight pairs by word frequency; each merged pair saves one token.
        feedback: l + o appears in every copy of both words, 3 + 2 = 5 times. Before merging there are 9 + 8 = 17 tokens, so 17 − 5 = 12 remain (lo·w ×3, s·lo·w ×2).
      - id: tokenizer-training.base.v3.3
        prompt: A corpus has "tree" 2 times, "free" 3 times, and "reef" 1 time, split into single letters. Merge e + e everywhere. Give the e + e count before merging and the total tokens after.
        answers:
          pairs: 6
          tokens: 18
        reason_answer: b
        reason_options:
          - id: a
            text: A merge turns each word that contains the pair into one token.
          - id: b
            text: Weight pairs by word frequency; each merged pair saves one token.
          - id: c
            text: Count each distinct word once, however often it appears.
        feedback: Each word contains one e + e, so the count is 2 + 3 + 1 = 6. The 24 starting tokens drop by 6 to 18 (t·r·ee, f·r·ee, r·ee·f).
      - id: tokenizer-training.base.v3.4
        prompt: A corpus has "banana" 2 times and "can" 1 time, split into single letters. Merge a + n everywhere. Give the a + n count before merging and the total tokens after.
        answers:
          pairs: 5
          tokens: 10
        reason_answer: a
        reason_options:
          - id: a
            text: Weight pairs by word frequency; each merged pair saves one token.
          - id: b
            text: A merge turns each word that contains the pair into one token.
          - id: c
            text: Count each distinct word once, however often it appears.
        feedback: '"banana" contains a + n twice, so it contributes 2 × 2 = 4, and "can" adds 1, for 5. Each "banana" becomes b·an·an·a (4 tokens) and "can" becomes c·an (2), so 8 + 2 = 10.'
  - id: tokenizer-training.transfer.v3
    objective_ref: objective.tokenizer-training
    task: transfer
    response_type: single_choice
    points: 1
    hint: Training learns the merge list once; encoding replays it, in order, without changing it. Every vocabulary entry costs a row of parameters.
    remediation_scene: tokenizer-training.s4
    variants:
      - id: tokenizer-training.transfer.v3.1
        prompt: A BPE tokenizer learned three merges, in this order, e + r, then l + o, then lo + w. How does it encode the new word "lower"?
        options:
          - id: b
            text: As one token, "lower"
          - id: c
            text: As l | o | w | er
          - id: a
            text: As low | er
        answer: a
        feedback: Replaying the rules in order gives l·o·w·er, then lo·w·er, then low·er. No rule ever joins low with er, so "lower" can't become one token, and skipping the later rules would leave l, o, and w apart.
      - id: tokenizer-training.transfer.v3.2
        prompt: A chatbot's BPE tokenizer and model were trained last year. Today a user types a brand-new slang word. What changes when it's encoded?
        options:
          - id: a
            text: Only the tokens produced for that text; the merge list is unchanged
          - id: b
            text: The merge list gains a new rule so the word becomes one token
          - id: c
            text: The model's weights update so that it can learn the new word
        answer: a
        feedback: Encoding only applies the saved rules, so the new word is split into existing pieces. Adding merges or updating weights would require retraining, which never happens during ordinary use.
      - id: tokenizer-training.transfer.v3.3
        prompt: A team grows its vocabulary from 32,000 to 64,000 tokens, with 4,096 numbers per embedding row. What is a direct cost?
        options:
          - id: c
            text: English sentences roughly double in length
          - id: a
            text: About 131 million more embedding parameters
          - id: b
            text: Rare words can no longer be represented
        answer: a
        feedback: 32,000 extra rows × 4,096 = 131,072,000 more parameters, plus as many again in the output layer if it isn't tied. A bigger vocabulary makes sequences shorter, not longer, and rare words can still be spelled from pieces.
      - id: tokenizer-training.transfer.v3.4
        prompt: Which description fits a unigram tokenizer (Kudo, 2018) rather than BPE?
        options:
          - id: b
            text: It repeatedly merges the most frequent pair of neighboring pieces
          - id: a
            text: It starts with many candidate pieces and prunes the least useful
          - id: c
            text: It stops at single characters and never builds larger pieces
        answer: a
        feedback: Unigram training goes top-down, dropping pieces whose removal hurts the text's likelihood least. Merging frequent pairs bottom-up is BPE, and both methods end up with multi-character pieces.
      - id: tokenizer-training.transfer.v3.5
        prompt: Two pairs tie for the highest count during BPE training. What keeps two training runs on the same data from producing different vocabularies?
        options:
          - id: a
            text: A fixed, documented rule for breaking ties
          - id: b
            text: Picking whichever pair a hash table lists first
          - id: c
            text: Picking the pair that gives the best test score
        answer: a
