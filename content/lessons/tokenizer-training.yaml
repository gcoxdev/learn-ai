schema_version: 0.2-draft
lesson:
  id: tokenizer-training
  version: 0.4.0-draft
  title: Learn the units used by a language model
  state: draft
  summary: A 1994 file-compression trick now decides how every chatbot reads text. Learn byte-pair encoding by hand, run it on the original paper's example, and see what vocabulary size costs.
  slot: M14.6
  category: learning
  sources:
    - title: Neural Machine Translation of Rare Words with Subword Units (Sennrich, Haddow & Birch, 2016)
      url: https://aclanthology.org/P16-1162/
    - title: "Subword Regularization: Improving Neural Network Translation Models with Multiple Subword Candidates (Kudo, 2018)"
      url: https://aclanthology.org/P18-1007/
    - title: "SentencePiece: A simple and language independent subword tokenizer and detokenizer (Kudo & Richardson, 2018)"
      url: https://aclanthology.org/D18-2012/
    - title: Language Models are Unsupervised Multitask Learners (Radford et al., 2019), the GPT-2 paper, section 2.2
      url: https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf
    - title: Hugging Face LLM course, chapter 6 — byte-pair encoding tokenization (WordPiece and Unigram follow in sections 6 and 7)
      url: https://huggingface.co/learn/llm-course/chapter6/5
  archetype: mechanism
objectives:
  - id: objective.tokenizer-training
    version: 3-draft
    statement: Trace one byte-pair merge and distinguish tokenizer training from later text encoding and model training.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - tokenizer-training.base.v3
      - tokenizer-training.transfer.v3
    prerequisites:
      - anyOf:
          - objective.tokenization
      - anyOf:
          - objective.count-based-language
scenes:
  - id: tokenizer-training.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.tokenizer-training
    title: A compression trick learns to read
    markdown: |-
      Rico Sennrich, Barry Haddow, and Alexandra Birch had a problem: their translation system had a fixed word list, so rare names and long compound words became "unknown." Their fix (published 2016) borrowed a 1994 file-compression method by Philip Gage, **byte-pair encoding (BPE)**, which repeatedly replaced the most common pair of neighboring bytes with a new byte. They applied it to letters: start from single characters and keep gluing together the most frequent neighboring pair. Frequent words become one token; rare words are spelled from common pieces. BPE now builds the vocabularies of GPT-2, the Llama models, and many others.

      **Training a tokenizer** means choosing those pieces from a sample of text. It's a counting job done once, before the language model is trained, with no neural network involved.
    bridges: []
  - id: tokenizer-training.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.tokenizer-training
    title: Make the first merge by hand
    markdown: |-
      Take a tiny training set: *cat* twice and *cap* once. Start with single letters, so the vocabulary is {c, a, t, p}, and count every neighboring pair, once for each time its word occurs:

      | Pair | Where | Count |
      | --- | --- | ---: |
      | c + a | cat, cat, cap | 3 |
      | a + t | cat, cat | 2 |
      | a + p | cap | 1 |

      The winner is c + a, so BPE adds the new token *ca* to the vocabulary and records the **merge rule** "c + a → ca." Every word is rewritten: [ca, t], [ca, t], [ca, p].

      Try it in the lab: pick the pair to merge and watch the boundaries and the token count change.
    bridges: []
    figure:
      kind: tokenizer
      caption: The small corpus is cat twice and cap once. Pair counts include both occurrences of cat.
      description: Inspect adjacent character pairs, choose a merge, and watch token boundaries and counts change. These operations fit a toy tokenizer rule; applying an already chosen rule is a separate encoding operation.
  - id: tokenizer-training.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tokenizer-training
    title: Count, merge, recount
    markdown: |-
      Before the merge, the three words took 9 tokens; after it, 6. Now recount in the *new* pieces: ca + t appears twice and ca + p once, so the second merge is "ca + t → cat." That leaves [cat], [cat], [ca, p]: 4 tokens and a vocabulary of {c, a, t, p, ca, cat}.

      :::papers The BPE training loop (Sennrich et al., 2016)
      1. Split every word in the training text into characters, adding an end-of-word marker `</w>`.
      2. Count every neighboring pair of symbols, weighted by how often each word occurs.
      3. Merge the most frequent pair everywhere it appears, and append that merge to the rule list.
      4. Repeat steps 2–3 until you've done the chosen number of merges.

      The vocabulary is the starting characters plus one entry per merge. The end marker lets word-final "est" differ from "est" mid-word.
      :::

      The code runs this loop on the word counts from the paper's own Python example: *low* 5 times, *lower* 2, *newest* 6, *widest* 3.

      :::predict Which pair gets merged first?
      e + s appears in *newest* (6) and *widest* (3): 9. So do s + t and t + `</w>`, a three-way tie. The code takes the pair it counted first, e + s.
      :::

      ```python run
      from collections import Counter

      # word counts from the toy corpus in Sennrich et al. (2016); </w> marks a word's end
      corpus = {"low": 5, "lower": 2, "newest": 6, "widest": 3}
      words = {tuple(w) + ("</w>",): n for w, n in corpus.items()}

      def merge(symbols, pair):
          out, i = [], 0
          while i < len(symbols):
              if symbols[i:i + 2] == pair:
                  out.append(symbols[i] + symbols[i + 1]); i += 2
              else:
                  out.append(symbols[i]); i += 1
          return tuple(out)

      merges = []
      for step in range(1, 9):
          pairs = Counter()
          for symbols, n in words.items():
              for pair in zip(symbols, symbols[1:]):
                  pairs[pair] += n                  # weight each pair by word frequency
          best, count = pairs.most_common(1)[0]     # ties: the pair counted first wins
          merges.append(best)
          words = {merge(s, best): n for s, n in words.items()}
          print(f"merge {step}: {best[0]} + {best[1]}  (count {count})")

      new = tuple("lowest") + ("</w>",)             # a word the corpus never contained
      for pair in merges:                           # encoding: replay merges in order
          new = merge(new, pair)
      print("lowest ->", new)
      ```

      Eight merges build *est`</w>`*, *low*, and *new* + *est`</w>`*. Change `range(1, 9)` to `range(1, 4)` and see how "lowest" splits with only three merges learned.
    bridges:
      - arithmetic
  - id: tokenizer-training.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tokenizer-training
    title: Encoding replays the merges in order
    markdown: |-
      The program's last lines show the other half of a tokenizer. *Lowest* never appeared in training, but encoding it is easy: split it into characters, then replay the saved merges **in the order they were learned**:

      | Rule applied | Pieces |
      | --- | --- |
      | start | l · o · w · e · s · t · `</w>` |
      | e + s, es + t, est + `</w>` | l · o · w · est`</w>` |
      | l + o, lo + w | low · est`</w>` |

      Two familiar tokens. Likewise *cap*, with the rules "c + a → ca" and "ca + t → cat," becomes [ca, p], because no rule builds *cap*. Encoding never changes the rules: a million new sentences leave the merge list exactly as it was.

      Any cleanup done before splitting, such as converting to a standard Unicode form or lowercasing, is called **normalization**. It's part of the tokenizer too: the same rules must run at training time and at use time.
    bridges: []
  - id: tokenizer-training.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tokenizer-training
    title: How many merges?
    markdown: |-
      Each merge adds one vocabulary entry. More merges mean more whole words and shorter sequences, but every entry also needs a row in the embedding table and a score in the output layer:

      | Model | Tokenizer | Vocabulary |
      | --- | --- | ---: |
      | BERT (2018) | WordPiece | 30,522 |
      | GPT-2 (2019) | byte-level BPE | 50,257 |
      | Llama 2 (2023) | SentencePiece BPE | 32,000 |

      GPT-2's number is 256 byte tokens, plus 50,000 merges, plus one special end-of-text token. With 768 numbers per row, its embedding table alone holds 50,257 × 768 ≈ 38.6 million parameters.

      :::mixup "A bigger vocabulary is always better, because sequences get shorter."
      The extra tokens are mostly rare pieces seen only a few times in training, so their rows are poorly learned, and each one adds a row to the embedding table and a score to the output layer. Past some size, shorter sequences stop paying for that.
      :::

      And remember the tokenization lesson: retraining the tokenizer renumbers the pieces, so it must ship with a model trained on it.
    bridges: []
  - type: explanation
    depth: mechanics
    objective_refs:
      - objective.tokenizer-training
    id: tokenizer-training.compare-unigram
    title: "Two cousins: WordPiece and Unigram"
    markdown: |-
      - **WordPiece**, used by BERT, also merges pairs, but picks the merge that most increases the training text's likelihood, favoring pairs whose parts rarely appear apart. BERT marks word-continuing pieces with `##`: "playing" might be `play` + `##ing`.
      - A **unigram tokenizer** (Kudo, 2018) works in the opposite direction. It starts from many candidate pieces, each with a probability, and repeatedly drops those whose removal hurts the training text's likelihood least. To encode, it picks the most probable split. During training it can also *sample* different splits, a trick Kudo called **subword regularization**: the model sees the same word split several ways and becomes more robust to odd splits.

      The **SentencePiece** library (Kudo & Richardson, 2018) runs BPE or unigram directly on raw text, treating the space as an ordinary symbol (written ▁), so it also works for languages written without spaces, like Japanese.
  - id: tokenizer-training.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tokenizer-training
    title: Start from bytes, never meet an unknown
    markdown: |-
      Starting from characters leaves a hole: a character missing from the training text, say a new emoji, can't be encoded. GPT-2 closed it by running BPE on **bytes**. The starting vocabulary is all 256 byte values, so any text can fall back to bytes, and merges build common byte sequences into bigger tokens.

      But merges follow the training text, so a language that was rare there stays split into many small pieces. The next lesson measures that gap.
    bridges: []
  - id: tokenizer-training.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.tokenizer-training
    markdown: Count pairs and tokens for four small corpora, then encode a new word, size a vocabulary, and break a tie.
    takeaway: |-
      BPE training counts neighboring pairs, merges the most frequent, and repeats; encoding replays the saved merges in order on new text. Every merge adds a vocabulary row, so vocabulary size trades shorter sequences for bigger tables.
  - id: tokenizer-training.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.tokenizer-training
    markdown: |-
      BPE and unigram tokenizers construct subword vocabularies with different learning procedures; normalization, merge rules, special tokens, and model compatibility determine the encoded sequence.
  - id: tokenizer-training.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.tokenizer-training
    title: Do the next merge
    markdown: After the ca merge, the list is [ca,t], [ca,t], [ca,p]. Which pair is now most frequent?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: ca+t
        - id: b
          text: c+a
        - id: c
          text: a+t
      answer: a
      reveal_markdown: The current sequences contain ca+t twice and ca+p once. The letters c and a are already glued into ca, so c+a and a+t no longer appear as neighboring pairs.
      hint: Recount using the current pieces, not the original letters. Which two pieces sit side by side most often?
      id: tokenizer-training.practice.v2.7
