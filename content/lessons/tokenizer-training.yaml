schema_version: 0.2-draft
lesson:
  id: tokenizer-training
  version: 0.2.0-draft
  title: Learn the units used by a language model
  state: draft
  summary: Invent reusable text pieces by counting pairs, then see why changing the dictionary also changes
    the model’s input language.
  slot: M14.6
  category: learning
  sources:
  - title: Sennrich, Haddow, Birch — subword units
    url: https://arxiv.org/abs/1508.07909
  - title: Kudo — Subword Regularization, unigram model (2018)
    url: https://aclanthology.org/P18-1007/
  archetype: mechanism
objectives:
- id: objective.tokenizer-training
  version: 2-draft
  statement: Trace one byte-pair merge and distinguish tokenizer training from later text encoding and model
    training.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - tokenizer-training.base.v2
  - tokenizer-training.transfer.v2
  prerequisites:
  - anyOf:
    - objective.tokenization
  - anyOf:
    - objective.count-based-language
scenes:
- id: tokenizer-training.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.tokenizer-training
  title: The machine needs a reusable alphabet
  markdown: 'A **tokenizer** turns text into stored pieces and their IDs. A word-level dictionary is easy to
    imagine, but it grows large and struggles with new names. A character-level dictionary handles more spellings
    but creates longer sequences. **Subword** pieces sit between these choices: familiar chunks can be reused
    inside unfamiliar words. Training a tokenizer means choosing a reusable vocabulary and splitting rules
    from examples. This is a different job from fitting the language model’s prediction weights.'
  text_mode: 'A **tokenizer** turns text into stored pieces and their IDs. A word-level dictionary is easy
    to imagine, but it grows large and struggles with new names. A character-level dictionary handles more
    spellings but creates longer sequences. **Subword** pieces sit between these choices: familiar chunks can
    be reused inside unfamiliar words. Training a tokenizer means choosing a reusable vocabulary and splitting
    rules from examples. This is a different job from fitting the language model’s prediction weights.'
  bridges: []
- id: tokenizer-training.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.tokenizer-training
  title: Make the first merge by hand
  markdown: Use a simplified byte-pair encoding exercise, or **BPE**. The training list contains “cat” twice
    and “cap” once. Start with c, a, t, and p as separate pieces and count neighboring pairs within each word.
    The pair c+a occurs three times; a+t occurs twice; a+p occurs once. Merge the most frequent pair, c+a,
    into a new piece ca. The token sequences become [ca,t], [ca,t], and [ca,p]. We deliberately omit real systems’
    whitespace and byte handling so one merge is visible.
  text_mode: Use a simplified byte-pair encoding exercise, or **BPE**. The training list contains “cat” twice
    and “cap” once. Start with c, a, t, and p as separate pieces and count neighboring pairs within each word.
    The pair c+a occurs three times; a+t occurs twice; a+p occurs once. Merge the most frequent pair, c+a,
    into a new piece ca. The token sequences become [ca,t], [ca,t], and [ca,p]. We deliberately omit real systems’
    whitespace and byte handling so one merge is visible.
  bridges: []
  figure:
    kind: tokenizer
    caption: The small corpus is cat twice and cap once. Pair counts include both occurrences of cat.
    description: Inspect adjacent character pairs, choose a merge, and watch token boundaries and counts change.
      These operations fit a toy tokenizer rule; applying an already chosen rule is a separate encoding operation.
- id: tokenizer-training.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tokenizer-training
  title: Count the changed sequence lengths
  markdown: Before the merge, the three examples contain 3+3+3=9 pieces. Afterward they contain 2+2+2=6. We
    added one vocabulary entry but shortened these sequences by three positions. Next we recount neighboring
    pairs; their frequencies can change after a merge. A tie needs a specified rule so separate runs agree.
    A larger vocabulary can reduce sequence length but also increases the size of vocabulary-dependent model
    tables. “Fewer tokens” is one tradeoff, not a universal winner.
  text_mode: Before the merge, the three examples contain 3+3+3=9 pieces. Afterward they contain 2+2+2=6. We
    added one vocabulary entry but shortened these sequences by three positions. Next we recount neighboring
    pairs; their frequencies can change after a merge. A tie needs a specified rule so separate runs agree.
    A larger vocabulary can reduce sequence length but also increases the size of vocabulary-dependent model
    tables. “Fewer tokens” is one tradeoff, not a universal winner.
  bridges:
  - arithmetic
- id: tokenizer-training.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tokenizer-training
  title: Apply the learned rules without relearning
  markdown: At use time, the tokenizer applies its saved merge rules to new text. With just the ca merge, “cap”
    becomes [ca,p]; it does not become one cap token unless that piece has been learned and selected by the
    rules. Encoding one new sentence does not normally update the vocabulary. **Normalization** is any specified
    text cleanup before splitting, such as a particular treatment of spaces or letter forms. It must be recorded
    because it can change the exact text representation.
  text_mode: At use time, the tokenizer applies its saved merge rules to new text. With just the ca merge,
    “cap” becomes [ca,p]; it does not become one cap token unless that piece has been learned and selected
    by the rules. Encoding one new sentence does not normally update the vocabulary. **Normalization** is any
    specified text cleanup before splitting, such as a particular treatment of spaces or letter forms. It must
    be recorded because it can change the exact text representation.
  bridges: []
- id: tokenizer-training.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.tokenizer-training
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Learn the splitting rules, freeze their version, then apply them consistently. Token IDs name entries;
    they do not carry numerical meaning.
- id: tokenizer-training.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.tokenizer-training
  markdown: BPE and unigram tokenizers construct subword vocabularies with different learning procedures; normalization,
    merge rules, special tokens, and model compatibility determine the encoded sequence.
  text_mode: BPE and unigram tokenizers construct subword vocabularies with different learning procedures;
    normalization, merge rules, special tokens, and model compatibility determine the encoded sequence.
- id: tokenizer-training.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tokenizer-training
  title: Keep the dictionary and model together
  markdown: Suppose token ID 17 means ca in one vocabulary and dog in another. Feeding the second tokenizer’s
    IDs into a model trained with the first vocabulary selects the wrong embedding rows. The number 17 is an
    address, not a measurement of meaning. Store tokenizer files, special-token conventions, and model weights
    as compatible versions. Changing splitting or ID assignment requires a deliberate compatibility strategy,
    potentially including model updates; switching a filename is not enough.
  text_mode: Suppose token ID 17 means ca in one vocabulary and dog in another. Feeding the second tokenizer’s
    IDs into a model trained with the first vocabulary selects the wrong embedding rows. The number 17 is an
    address, not a measurement of meaning. Store tokenizer files, special-token conventions, and model weights
    as compatible versions. Changing splitting or ID assignment requires a deliberate compatibility strategy,
    potentially including model updates; switching a filename is not enough.
  bridges: []
- id: tokenizer-training.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tokenizer-training
  title: Check whose text becomes expensive
  markdown: 'A tokenizer trained mostly on one kind of text may split other languages, scripts, or specialist
    names into many more pieces. Compare representative samples, reconstruction where supported, and special-token
    behavior before choosing a vocabulary. Do not infer reasoning ability from token count alone. Our toy merge
    is a learning microscope: production implementations also specify bytes, boundary markers, reserved tokens,
    and decoding rules. Remember “collect pairs, merge, recount” for training and “apply the saved rules” for
    encoding.


    A different approach is a **unigram tokenizer**. It starts with a candidate vocabulary and fits probabilities
    for its pieces. A possible segmentation receives a score from the probabilities of its pieces; several
    segmentations of the same text can compete. Training can remove pieces that contribute little under its
    objective until a target vocabulary size is reached. Encoding can then choose a high-probability segmentation,
    or deliberately sample one when the training setup calls for it.


    BPE builds pieces through saved merges; unigram tokenization evaluates candidate pieces through a probability
    model. Neither is the language model''s own next-token predictor. Both require their saved rules and vocabulary
    to stay compatible with the model.'
  text_mode: 'A tokenizer trained mostly on one kind of text may split other languages, scripts, or specialist
    names into many more pieces. Compare representative samples, reconstruction where supported, and special-token
    behavior before choosing a vocabulary. Do not infer reasoning ability from token count alone. Our toy merge
    is a learning microscope: production implementations also specify bytes, boundary markers, reserved tokens,
    and decoding rules. Remember “collect pairs, merge, recount” for training and “apply the saved rules” for
    encoding.


    A different approach is a **unigram tokenizer**. It starts with a candidate vocabulary and fits probabilities
    for its pieces. A possible segmentation receives a score from the probabilities of its pieces; several
    segmentations of the same text can compete. Training can remove pieces that contribute little under its
    objective until a target vocabulary size is reached. Encoding can then choose a high-probability segmentation,
    or deliberately sample one when the training setup calls for it.


    BPE builds pieces through saved merges; unigram tokenization evaluates candidate pieces through a probability
    model. Neither is the language model''s own next-token predictor. Both require their saved rules and vocabulary
    to stay compatible with the model.'
  bridges: []
- id: tokenizer-training.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.tokenizer-training
  title: Do the next merge
  markdown: After the ca merge, the list is [ca,t], [ca,t], [ca,p]. Which pair is now most frequent?
  text_mode: After the ca merge, the list is [ca,t], [ca,t], [ca,p]. Which pair is now most frequent?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: ca+t
    - id: b
      text: c+a
    - id: c
      text: a+t
    answer: a
    reveal_markdown: The current sequences contain ca+t twice and ca+p once. The old c+a pieces have already
      been merged.
    hint: Trace the example using the rule from the preceding pages.
    id: tokenizer-training.practice.v2.7
