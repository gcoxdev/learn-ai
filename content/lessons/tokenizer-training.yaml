assessment_families:
  - id: tokenizer-training.base
    objective_ref: objective.tokenizer-training
    task: base
    response_type: single_choice
    points: 1
    hint: 'Follow a BPE merge: trace the inputs, operation, and result before choosing.'
    remediation_scene: tokenizer-training.s2
    variants:
      - id: tokenizer-training.base.1
        prompt: What operation characterizes BPE vocabulary construction?
        options:
          - id: a
            text: Merging selected adjacent symbol pairs
          - id: b
            text: Assigning one token to every possible sentence
          - id: c
            text: Updating the language model’s gradients only
        answer: a
        feedback: BPE repeatedly builds larger pieces from smaller adjacent units.
        retired: true
      - id: tokenizer-training.base.2
        prompt: Is tokenizer training identical to language-model weight training?
        options:
          - id: b
            text: Yes; every tokenizer is the full model
          - id: c
            text: Only when text is English
          - id: a
            text: No; they are distinct procedures
        answer: a
        feedback: The segmentation vocabulary and neural prediction parameters play different roles.
        retired: true
  - id: tokenizer-training.transfer
    objective_ref: objective.tokenizer-training
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Preserve the surrounding conventions: trace the inputs, operation, and result before choosing.'
    remediation_scene: tokenizer-training.s4
    variants:
      - id: tokenizer-training.transfer.1
        prompt: A model is paired with a different ID mapping. What is a risk?
        options:
          - id: b
            text: Only the displayed text color changes
          - id: c
            text: The model automatically remaps every weight correctly
          - id: a
            text: Embeddings receive IDs with incompatible meanings
        answer: a
        feedback: Token IDs must match the model’s learned vocabulary interface.
        retired: true
      - id: tokenizer-training.transfer.2
        prompt: Why preserve special-token and template configuration?
        options:
          - id: c
            text: They have no effect after pretraining
          - id: a
            text: They affect how inputs are interpreted and outputs stop
          - id: b
            text: Only to increase file count
        answer: a
        feedback: Boundary and control conventions are part of the model input format.
        retired: true
  - id: tokenizer-training.base.v2
    objective_ref: objective.tokenizer-training
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: tokenizer-training.s3
    variants:
      - prompt: A toy corpus contains “cat” 3 times and “cap” 1 times. Starting from characters, merge c+a in every word. Record the count of c+a before merging and total tokens after merging.
        answers:
          pairs: 4
          tokens: 8
        reason_answer: a
        reason_options:
          - id: c
            text: The merge changes the vocabulary but no sequence lengths.
          - id: a
            text: Each three-character word becomes two pieces.
          - id: b
            text: Each word becomes one piece after the pair merge.
        feedback: Each word contributes one c+a pair and then two pieces, ca plus its last character.
        id: tokenizer-training.base.v2.1
        retired: true
      - prompt: A toy corpus contains “cat” 2 times and “cap” 2 times. Starting from characters, merge c+a in every word. Record the count of c+a before merging and total tokens after merging.
        answers:
          pairs: 4
          tokens: 8
        reason_answer: a
        reason_options:
          - id: a
            text: Each three-character word becomes two pieces.
          - id: c
            text: The merge changes the vocabulary but no sequence lengths.
          - id: b
            text: Each word becomes one piece after the pair merge.
        feedback: Each word contributes one c+a pair and then two pieces, ca plus its last character.
        id: tokenizer-training.base.v2.2
        retired: true
      - prompt: A toy corpus contains “cat” 1 times and “cap” 4 times. Starting from characters, merge c+a in every word. Record the count of c+a before merging and total tokens after merging.
        answers:
          pairs: 5
          tokens: 10
        reason_answer: a
        reason_options:
          - id: c
            text: The merge changes the vocabulary but no sequence lengths.
          - id: b
            text: Each word becomes one piece after the pair merge.
          - id: a
            text: Each three-character word becomes two pieces.
        feedback: Each word contributes one c+a pair and then two pieces, ca plus its last character.
        id: tokenizer-training.base.v2.3
        retired: true
      - prompt: A toy corpus contains “cat” 4 times and “cap” 2 times. Starting from characters, merge c+a in every word. Record the count of c+a before merging and total tokens after merging.
        answers:
          pairs: 6
