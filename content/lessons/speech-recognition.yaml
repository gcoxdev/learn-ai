schema_version: 0.2-draft
lesson:
  id: speech-recognition
  version: 0.1.0-draft
  title: Map sound into words with an alignment model
  state: draft
  summary: Speech recognition combines acoustic evidence with sequence modeling and decoding; alignment assumptions,
    text normalization, and error metrics affect what performance means.
  slot: M13.6
  category: learning
  sources:
  - title: Speech and Language Processing — authors’ draft
    url: https://web.stanford.edu/~jurafsky/slp3/
  - title: Robust Speech Recognition via Large-Scale Weak Supervision
    url: https://arxiv.org/abs/2212.04356
objectives:
- id: objective.speech-recognition
  version: 1-draft
  statement: Speech recognition combines acoustic evidence with sequence modeling and decoding; alignment assumptions,
    text normalization, and error metrics affect what performance means.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - speech-recognition.base
  - speech-recognition.transfer
  prerequisites:
  - anyOf:
    - objective.audio-representations
  - anyOf:
    - objective.sequence-to-sequence
scenes:
- id: speech-recognition.s1
  title: Speech is not already divided into words
  type: explanation
  depth: intuition
  objective_refs:
  - objective.speech-recognition
  markdown: A waveform contains overlapping acoustic cues, pauses, noise, and variable speaking rates. A recognizer
    must connect that signal to a text sequence. Traditional systems separated acoustic and language models; modern
    systems can learn more of the mapping jointly while still requiring a defined output representation.
  text_mode: A waveform contains overlapping acoustic cues, pauses, noise, and variable speaking rates. A recognizer
    must connect that signal to a text sequence. Traditional systems separated acoustic and language models; modern
    systems can learn more of the mapping jointly while still requiring a defined output representation.
  bridges: []
- id: speech-recognition.s2
  title: Handle unknown alignment
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.speech-recognition
  markdown: CTC-style objectives sum over permitted frame-to-label alignments using a blank symbol and a collapse
    rule. Encoder-decoder approaches generate text conditioned on audio representations. These methods impose different
    alignment and dependence assumptions. A transcript target is not a label for every audio frame unless an alignment
    process provides one.
  text_mode: CTC-style objectives sum over permitted frame-to-label alignments using a blank symbol and a collapse
    rule. Encoder-decoder approaches generate text conditioned on audio representations. These methods impose different
    alignment and dependence assumptions. A transcript target is not a label for every audio frame unless an alignment
    process provides one.
  bridges:
  - arithmetic
- id: speech-recognition.s3
  title: Calculate word error rate
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.speech-recognition
  markdown: Word error rate is (substitutions + deletions + insertions) divided by the number of reference words.
    With 10 reference words, 1 substitution, 1 deletion, and 1 insertion give WER 0.3. Insertions mean WER can exceed
    1. Tokenization and text normalization conventions affect the counts.
  text_mode: Word error rate is (substitutions + deletions + insertions) divided by the number of reference words.
    With 10 reference words, 1 substitution, 1 deletion, and 1 insertion give WER 0.3. Insertions mean WER can exceed
    1. Tokenization and text normalization conventions affect the counts.
  bridges: []
- id: speech-recognition.s4
  title: Evaluate beyond an average transcript score
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.speech-recognition
  markdown: Check accents, languages, noise conditions, speaker overlap, and rare names. A fluent transcript can
    contain invented words when audio is unclear. Streaming systems also need latency and partial-result stability
    measures. Separate transcription, translation, diarization, and speaker identification when stating capabilities.
  text_mode: Check accents, languages, noise conditions, speaker overlap, and rare names. A fluent transcript can
    contain invented words when audio is unclear. Streaming systems also need latency and partial-result stability
    measures. Separate transcription, translation, diarization, and speaker identification when stating capabilities.
  bridges: []
- id: speech-recognition.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.speech-recognition
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Speech recognition combines acoustic evidence with sequence modeling and decoding; alignment assumptions,
    text normalization, and error metrics affect what performance means.
- id: speech-recognition.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.speech-recognition
  markdown: Speech recognition combines acoustic evidence with sequence modeling and decoding; alignment assumptions,
    text normalization, and error metrics affect what performance means.
  text_mode: Speech recognition combines acoustic evidence with sequence modeling and decoding; alignment assumptions,
    text normalization, and error metrics affect what performance means.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - speech-recognition.s1
    - speech-recognition.s2
    - speech-recognition.s3
    - speech-recognition.s4
    - speech-recognition.check
    gate_refs:
