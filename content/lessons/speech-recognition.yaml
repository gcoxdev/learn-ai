assessment_families:
- id: speech-recognition.base
  objective_ref: objective.speech-recognition
  task: base
  response_type: single_choice
  points: 1
  hint: 'Handle unknown alignment: trace the inputs, operation, and result before choosing.'
  remediation_scene: speech-recognition.s2
  variants:
  - id: speech-recognition.base.1
    prompt: Reference length 20 with 2 substitutions and 1 deletion gives what WER?
    options:
    - id: a
      text: '0.15'
    - id: b
      text: '0.3'
    - id: c
      text: '0.85'
    answer: a
    feedback: Three word errors divided by twenty reference words equals 0.15.
  - id: speech-recognition.base.2
    prompt: Can WER exceed 100%?
    options:
    - id: b
      text: No, by definition
    - id: c
      text: Only if the audio is stereo
    - id: a
      text: Yes, with enough insertions
    answer: a
    feedback: The numerator is not bounded by reference length when insertions occur.
- id: speech-recognition.transfer
  objective_ref: objective.speech-recognition
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate beyond an average transcript score: trace the inputs, operation, and result before choosing.'
  remediation_scene: speech-recognition.s4
  variants:
  - id: speech-recognition.transfer.1
    prompt: A transcript is fluent during a noisy segment. What should be checked?
    options:
    - id: b
      text: Only grammatical style
    - id: c
      text: A claim that noise cannot matter
    - id: a
      text: Whether its words are actually supported by the audio
    answer: a
    feedback: Fluency does not establish acoustic fidelity.
  - id: speech-recognition.transfer.2
    prompt: Two recognizers use different text normalization before scoring. What is needed for fair comparison?
    options:
    - id: c
      text: An assumption that all transcripts tokenize identically
    - id: a
      text: A matched or explicitly documented scoring convention
    - id: b
      text: Only their model sizes
    answer: a
    feedback: Normalization changes alignment and error counts.
