assessment_families:
  - id: evaluation-metrics-and-uncertainty.base
    objective_ref: objective.evaluation-metrics-and-uncertainty
    task: base
    response_type: single_choice
    points: 1
    hint: 'Separate accuracy from calibration: trace the inputs, operation, and result before choosing.'
    remediation_scene: evaluation-metrics-and-uncertainty.s2
    variants:
      - id: evaluation-metrics-and-uncertainty.base.1
        prompt: What does 0.8 calibration mean across comparable cases?
        options:
          - id: c
            text: Every individual prediction is guaranteed
          - id: a
            text: About 80 percent correctness among those predictions
          - id: b
            text: Exactly 80 percent confidence on every task
        answer: a
        feedback: Calibration is a frequency relationship under defined conditions.
        retired: true
      - id: evaluation-metrics-and-uncertainty.base.2
        prompt: Can accuracy improve while confidence calibration worsens?
        options:
          - id: a
            text: 'Yes'
          - id: b
            text: 'No'
          - id: c
            text: Only if labels are missing
        answer: a
        feedback: Different metrics capture different properties.
        retired: true
  - id: evaluation-metrics-and-uncertainty.transfer
    objective_ref: objective.evaluation-metrics-and-uncertainty
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Report a useful profile: trace the inputs, operation, and result before choosing.'
    remediation_scene: evaluation-metrics-and-uncertainty.s4
    variants:
      - id: evaluation-metrics-and-uncertainty.transfer.1
        prompt: Why account for many test examples from one document?
        options:
          - id: a
            text: Their errors may be correlated
          - id: b
            text: They automatically count as unrelated samples
          - id: c
            text: Document identity never matters
        answer: a
        feedback: Dependence changes uncertainty estimates.
        retired: true
      - id: evaluation-metrics-and-uncertainty.transfer.2
        prompt: What makes a baseline useful?
        options:
          - id: b
            text: It must always be the largest model
          - id: c
            text: It replaces all uncertainty estimates
          - id: a
            text: It shows whether added complexity improves the relevant task
        answer: a
        feedback: A baseline anchors practical value.

        retired: true
  - id: evaluation-metrics-and-uncertainty.base.v2
    objective_ref: objective.evaluation-metrics-and-uncertainty
    task: base
    response_type: single_choice
    points: 1
    hint: Ask what could make this score different on a fresh draw of items, prompts, or seeds, and whether the metric can tell a right answer from a wrong one that shares its words.
    remediation_scene: evaluation-metrics-and-uncertainty.s2
    variants:
      - id: evaluation-metrics-and-uncertainty.base.v2.1
        prompt: A support bot must reply with a plan code such as "TRV10", which is pasted straight into a billing system. Which scoring method fits best?
        options:
          - id: b
            text: Token F1, so that a near-miss code still earns partial credit
          - id: a
            text: Exact match after normalization, since only the precise code works
          - id: c
            text: A judge model, so that reworded versions of the code are accepted
        answer: a
        feedback: A billing field accepts one exact string, so exact match measures what matters. Partial credit from F1 would reward codes that fail in the billing system, and a judge's tolerance for rewording is a liability here.
      - id: evaluation-metrics-and-uncertainty.base.v2.2
        prompt: Against the reference "$10 per month", token F1 gives 0.67 to the wrong reply "$15 per month" and 0.57 to the correct reply "It costs $10 a month". What does this show?
        options:
          - id: c
            text: The reference is too short and should list every acceptable wording
          - id: b
            text: F1 penalizes longer replies, so the correct reply was too wordy
          - id: a
            text: Word overlap rewards shared wording, not whether the fact is right
        answer: a
        feedback: F1 counts shared words, and the wrong price shares more of them. Length plays a part, but the real problem is that overlap can't see that "15" is a wrong number, so fact-bearing free text needs a judge or a stricter check.
      - id: evaluation-metrics-and-uncertainty.base.v2.3
        prompt: A model answers 156 of 200 independent test questions correctly. Roughly what is the 95% confidence interval for its accuracy?
        options:
          - id: a
            text: About 72% to 84%, from ±1.96 standard errors
          - id: c
            text: About 77.5% to 78.5%, since one item is 0.5 points
          - id: b
            text: Exactly 78%, since every question was scored
        answer: a
        feedback: "SE = √(0.78 × 0.22 / 200) ≈ 0.029, and 1.96 × 0.029 ≈ 5.7 points. One item's weight (0.5 points) is the resolution of the score, not its uncertainty: a fresh set of 200 questions could easily land 5 points away."
      - id: evaluation-metrics-and-uncertainty.base.v2.4
        prompt: A model is run with three prompt templates and three seeds each. Template means are 77.8, 75.0, and 79.5, and seeds move the score by under a point within a template. What is the largest source of variation?
        options:
          - id: b
            text: The sampling seed, since generation is random each time
          - id: c
            text: The item sample, since only 200 questions were used
          - id: a
            text: The prompt template, which moves the mean by 4.5 points
        answer: a
        feedback: The template means span 75.0 to 79.5, far more than the one-point seed spread. The item sample adds uncertainty too, but all nine runs used the same 200 items, so it can't explain the differences between them.
  - id: evaluation-metrics-and-uncertainty.transfer.v2
    objective_ref: objective.evaluation-metrics-and-uncertainty
    task: transfer
    response_type: single_choice
    points: 1
    hint: Before trusting a comparison, check the size of the gap against its error bar, whether the items are independent, and whether both systems ran under the same prompts and settings.
    remediation_scene: evaluation-metrics-and-uncertainty.s3
    variants:
      - id: evaluation-metrics-and-uncertainty.transfer.v2.1
        prompt: A new legal-research model scores 64% and the old one 61%, each on its own 150 independent questions. A colleague wants to announce the improvement. What is the best response?
        options:
          - id: c
            text: Announce it, since 3 points exceeds each model's standard error
          - id: a
            text: Hold off, since the gap's error bar is about ±11 points here
          - id: b
            text: Rerun both models with a new seed and announce if the gap holds
        answer: a
        feedback: "Each score has SE ≈ 0.039, so the gap's SE is about √2 × 0.039 ≈ 0.055, or ±11 points at 95%. Comparing the gap to a single model's SE understates the noise, and a new seed doesn't change which 150 questions were drawn."
      - id: evaluation-metrics-and-uncertainty.transfer.v2.2
        prompt: A tutoring bot is tested on 300 questions from 30 worksheets, 10 per worksheet, and questions on one worksheet tend to be all right or all wrong. How does this affect a confidence interval computed as if the 300 were independent?
        options:
          - id: a
            text: It is too narrow; the evidence is closer to 30 items than 300
          - id: b
            text: It is too wide; related questions confirm one another's results
          - id: c
            text: It is unaffected; the formula depends only on n and accuracy
        answer: a
        feedback: Questions that succeed or fail together carry less independent evidence, so the true uncertainty is larger than the naive formula says. The formula only uses n and accuracy because it assumes independence, and that assumption fails here.
      - id: evaluation-metrics-and-uncertainty.transfer.v2.3
        prompt: A math benchmark's reference answers are integers. A model replies "So the total is 42." and the reference is "42". How should the scorer handle it?
        options:
          - id: b
            text: Use token F1, giving partial credit for the matching number
          - id: c
            text: Ask a judge model whether the reasoning sounds convincing
          - id: a
            text: Extract the final number, then apply exact match to it
        answer: a
        feedback: The answer has a precise format, so pulling out the final number and checking it exactly is reliable and cheap. F1 would give a wrong number partial credit for shared words, and a judge that grades persuasive reasoning can pass wrong answers.
      - id: evaluation-metrics-and-uncertainty.transfer.v2.4
        prompt: Two vendors report scores of 71.2 and 70.4 on the same multiple-choice benchmark, each using its own prompt template. What should you do before comparing them?
        options:
          - id: c
            text: Compare the numbers directly, since the questions were identical
          - id: a
            text: Rerun both under the same templates and settings, over several seeds
          - id: b
            text: Ask each vendor for more decimal places to separate the scores
        answer: a
        feedback: Prompt format alone can move scores by several points, more than this 0.8-point gap. The same questions don't make the conditions equal, and extra decimal places add no precision to a noisy measurement.
  - id: evaluation-metrics-and-uncertainty.calculate
    objective_ref: objective.evaluation-metrics-and-uncertainty
    task: base
    response_type: numeric
    points: 1
    hint: "Standard error = √(p(1 − p)/n) with p as a decimal. Multiply by 1.96, then by 100 to get percentage points."
    remediation_scene: evaluation-metrics-and-uncertainty.s2
    absolute_tolerance: 0.15
    variants:
      - id: evaluation-metrics-and-uncertainty.calculate.1
        prompt: A model scores 80% on 100 independent questions. What is the half-width of the 95% confidence interval, in percentage points?
        answer: 7.8
        feedback: "SE = √(0.8 × 0.2 / 100) = √0.0016 = 0.04, and 1.96 × 0.04 = 0.078, or ±7.8 points."
      - id: evaluation-metrics-and-uncertainty.calculate.2
        prompt: A model scores 90% on 400 independent questions. What is the half-width of the 95% confidence interval, in percentage points?
        answer: 2.9
        feedback: "SE = √(0.9 × 0.1 / 400) = √0.000225 = 0.015, and 1.96 × 0.015 = 0.0294, or ±2.9 points."
      - id: evaluation-metrics-and-uncertainty.calculate.3
        prompt: A model scores 60% on 200 independent questions. What is the half-width of the 95% confidence interval, in percentage points?
        answer: 6.8
        feedback: "SE = √(0.6 × 0.4 / 200) = √0.0012 ≈ 0.0346, and 1.96 × 0.0346 ≈ 0.068, or ±6.8 points."
      - id: evaluation-metrics-and-uncertainty.calculate.4
        prompt: A model scores 50% on 1,000 independent questions. What is the half-width of the 95% confidence interval, in percentage points?
        answer: 3.1
        feedback: "SE = √(0.5 × 0.5 / 1000) = √0.00025 ≈ 0.0158, and 1.96 × 0.0158 ≈ 0.031, or ±3.1 points. Accuracies near 50% have the widest intervals for a given n."
      - id: evaluation-metrics-and-uncertainty.calculate.5
        prompt: A model scores 70% on 50 independent questions. What is the half-width of the 95% confidence interval, in percentage points?
        answer: 12.7
        feedback: "SE = √(0.7 × 0.3 / 50) = √0.0042 ≈ 0.0648, and 1.96 × 0.0648 ≈ 0.127, or ±12.7 points. Fifty items can barely tell 60% from 80%."
