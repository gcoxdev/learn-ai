schema_version: 0.2-draft
lesson:
  id: evaluation-metrics-and-uncertainty
  version: 0.4.0-draft
  title: Measure the behavior that the task actually needs
  state: draft
  summary: The new support bot beats the old one 78% to 75% on 200 questions. Is it better? Learn to score free-text answers and put honest error bars on the result.
  slot: M28.1
  category: learning
  sources:
    - title: "SQuAD: 100,000+ Questions for Machine Comprehension of Text (Rajpurkar et al., 2016), source of the exact-match and token-F1 conventions"
      url: https://arxiv.org/abs/1606.05250
    - title: "Adding Error Bars to Evals: A Statistical Approach to Language Model Evaluations (Miller, 2024)"
      url: https://arxiv.org/abs/2411.00640
    - title: "Quantifying Language Models' Sensitivity to Spurious Features in Prompt Design (Sclar et al., 2023)"
      url: https://arxiv.org/abs/2310.11324
    - title: "Holistic Evaluation of Language Models (HELM) (Liang et al., 2022)"
      url: https://arxiv.org/abs/2211.09110
    - title: "On Calibration of Modern Neural Networks (Guo et al., 2017)"
      url: https://arxiv.org/abs/1706.04599
objectives:
  - id: objective.evaluation-metrics-and-uncertainty
    version: 2-draft
    statement: Evaluation connects task goals to metrics, baselines, and uncertainty; accuracy, calibration, coverage, and cost answer different questions and can move in different directions.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - evaluation-metrics-and-uncertainty.base.v2
      - evaluation-metrics-and-uncertainty.transfer.v2
      - evaluation-metrics-and-uncertainty.calculate
    prerequisites:
      - anyOf:
          - objective.classification-metrics
      - anyOf:
          - objective.calibrated-decisions
      - anyOf:
          - objective.research-reporting
scenes:
  - id: evaluation-metrics-and-uncertainty.s1
    title: Three scorers, three verdicts on one answer
    type: explanation
    depth: intuition
    objective_refs:
      - objective.evaluation-metrics-and-uncertainty
    markdown: |-
      Kestrel Mobile, a phone carrier, wants a new model behind its support assistant. On a test set of 200 real customer questions, the current model, **A**, answers 150 correctly (75%). The candidate, **B**, answers 156 (78%). This module follows Kestrel's evaluation team as they decide whether B should ship. Their first question: what counts as "correct" in a free-text answer?

      Take one question: "How much is the Travel Pass?" The reference answer is "\$10 per month." B replies, "It costs \$10 a month." Here are three ways to score that reply:

      | Metric | How it scores | Score for B's reply |
      | --- | --- | --- |
      | **Exact match (EM)** | 1 if the normalized reply equals the reference, else 0 | 0 |
      | **Token F1** | Word overlap between reply and reference | 0.57 |
      | **Model-graded** | A judge model reads reply, reference, and a rubric | correct |

      *Normalized* means lowercased, with punctuation and the words "a", "an", and "the" removed. That's the convention from the SQuAD reading benchmark (Rajpurkar et al., 2016). Token F1 is the harmonic mean of precision (shared words ÷ reply words) and recall (shared words ÷ reference words). "10" and "month" are shared, so precision is 2/4, recall is 2/3, and F1 = 0.57.

      ```python run
      import re
      from collections import Counter

      def normalize(text):
          text = re.sub(r"[^\w\s]", " ", text.lower())          # drop punctuation
          return [w for w in text.split() if w not in {"a", "an", "the"}]

      def exact_match(pred, ref):
          return int(normalize(pred) == normalize(ref))

      def token_f1(pred, ref):
          p, r = normalize(pred), normalize(ref)
          common = sum((Counter(p) & Counter(r)).values())
          if common == 0:
              return 0.0
          precision, recall = common / len(p), common / len(r)
          return 2 * precision * recall / (precision + recall)

      ref = "$10 per month"
      for pred in ["$10 per month.", "It costs $10 a month", "$15 per month"]:
          print(f"{pred!r:24} EM = {exact_match(pred, ref)}   F1 = {token_f1(pred, ref):.2f}")
      ```

      :::predict Which reply gets the higher token F1: the correct "It costs \$10 a month" or the wrong "\$15 per month"?
      The wrong one, 0.67 against 0.57. "\$15 per month" shares two of the reference's three words ("per" and "month"), while the correct reply spends half its words on "it costs". Word overlap can't tell a wrong price from a right one. So LLM evaluations usually keep EM for short, fixed-format answers (a plan code, a number) and use a judge with a rubric for the rest. Judges make their own mistakes; the lesson on human and model judges measures them.
      :::

      When the output is a decision, such as handing a chat to a human, the precision and recall from module 7 still apply.
    bridges: []
  - id: evaluation-metrics-and-uncertainty.s2
    title: 78% on 200 questions, give or take what?
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.evaluation-metrics-and-uncertainty
    markdown: |-
      The lesson on controlled experiments showed that an accuracy measured on $n$ independent items has a **standard error** (the typical wobble from which items happened to be drawn) of $\sqrt{\hat p(1-\hat p)/n}$. A 95% confidence interval reaches about 1.96 standard errors either side. For B:

      $$\text{SE} = \sqrt{\frac{0.78 \times 0.22}{200}} = \sqrt{0.000858} = 0.0293, \qquad 1.96 \times 0.0293 = 0.057$$

      So B scores 78% ± 5.7 points, roughly 72% to 84%. A's 75% carries ± 6.0.

      ```python run
      import math

      def ci95(correct, n):
          p = correct / n
          se = math.sqrt(p * (1 - p) / n)          # binomial standard error
          return p, se, 1.96 * se

      for name, correct, n in [("Model A", 150, 200), ("Model B", 156, 200), ("Model B", 624, 800)]:
          p, se, half = ci95(correct, n)
          print(f"{name}: {correct}/{n} = {p:.1%}  SE {se:.4f}  95% CI {p - half:.1%} to {p + half:.1%} (±{half * 100:.1f} pts)")

      # The gap between two independent scores has its own, larger wobble
      pa, pb, n = 0.75, 0.78, 200
      se_gap = math.sqrt(pa * (1 - pa) / n + pb * (1 - pb) / n)
      print(f"gap {pb - pa:+.1%}, 95% CI ±{1.96 * se_gap * 100:.1f} pts")

      # Items needed for the gap's half-width to shrink to 3 points
      n_needed = 1.96**2 * (pa * (1 - pa) + pb * (1 - pb)) / 0.03**2
      print(f"items per model for ±3 pts: {math.ceil(n_needed)}")
      ```

      :::predict Kestrel grows the test set to 800 questions and B still scores 78%. How wide is the interval now?
      ±2.9 points, half as wide. Four times the items halve the error, because $n$ sits under a square root. The program's third line shows it.
      :::

      :::papers Error bars for an eval score
      $$\hat p = \frac{1}{n}\sum_{i=1}^{n} s_i, \qquad \text{SE}(\hat p) = \sqrt{\frac{\hat p\,(1-\hat p)}{n}}, \qquad \text{CI}_{95} = \hat p \pm 1.96\,\text{SE}$$

      Here $s_i$ is 1 if item $i$ is correct and 0 if not: $n = 200$, $\hat p = 0.78$. For scores between 0 and 1, such as token F1, replace $\hat p(1-\hat p)$ with the sample variance of the $s_i$. Miller (2024), "Adding Error Bars to Evals," argues that every LLM eval score should carry this standard error.
      :::
    bridges: []
  - id: evaluation-metrics-and-uncertainty.s3
    title: Three points apart, and no winner
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.evaluation-metrics-and-uncertainty
    markdown: |-
      B leads by 3 points, but both scores wobble, and the wobbles add. The standard error of the gap is $\sqrt{\text{SE}_A^2 + \text{SE}_B^2} = \sqrt{0.0306^2 + 0.0293^2} = 0.042$, so the gap is 3 ± 8.3 points. Anything from B being 5 points worse to 11 points better fits the data.

      To pin a 3-point gap down to ± 3, the program says Kestrel would need about 1,500 questions per model. That's why a benchmark of a few hundred items can't separate models that are a few points apart. The next lesson shows a cheaper fix: score both models on the *same* questions and compare them item by item.

      Check independence too. Kestrel's 200 questions come from 200 different conversations. Ten questions from each of 20 chats would tend to succeed or fail together, and the honest interval would be closer to one built from 20 items.

      :::mixup "B scored 78.0 and A scored 75.0, so B is the better model."
      The decimal point implies a precision the test doesn't have. On 200 items, any gap well inside ± 8 points is a tie until more evidence arrives.
      :::
    bridges: []
  - id: evaluation-metrics-and-uncertainty.variance
    title: Change the prompt wording, lose four points
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.evaluation-metrics-and-uncertainty
    markdown: |-
      The item sample isn't the only source of wobble. Kestrel runs B nine times on the same 200 questions: three prompt templates (the same instructions, worded and formatted differently) crossed with three random seeds for sampling.

      | Template | Seed 1 | Seed 2 | Seed 3 | Mean |
      | --- | ---: | ---: | ---: | ---: |
      | T1: plain instructions | 78.0 | 77.0 | 78.5 | 77.8 |
      | T2: bulleted rules | 74.5 | 75.5 | 75.0 | 75.0 |
      | T3: rules plus one example | 80.0 | 79.0 | 79.5 | 79.5 |

      Seeds move the score by about a point. The template moves it by 4.5 points, more than B's whole lead over A. Had the team tested B only with T3 and A only with T2, they would have reported a gap that is mostly prompt formatting.

      This is common. Sclar et al. (2023) changed only formatting details, such as separators, capitalization, and spacing, in few-shot prompts. With LLaMA-2-13B, accuracy differed by as much as 76 points between formats.

      Kestrel's rule: both models get the same templates and sampling settings, at least three seeds, and a reported mean and spread across templates. The templates are fixed before any scores are seen, because picking the best one afterwards brings back the winner's curse from module 9.
    bridges: []
  - id: evaluation-metrics-and-uncertainty.s4
    title: A release scorecard, not one number
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.evaluation-metrics-and-uncertainty
    markdown: |-
      Accuracy answers one question. A release decision needs several, and they can point in different directions. Kestrel's scorecard:

      | Measure | A (current) | B (candidate) |
      | --- | ---: | ---: |
      | Accuracy, 200 questions | 75% ± 6.0 | 78% ± 5.7 |
      | Calibration error (ECE) | 0.04 | 0.11 |
      | Recall on chats needing a human | 0.90 | 0.82 |
      | Median reply time | 1.2 s | 2.1 s |
      | Cost per 1,000 chats | \$0.80 | \$1.40 |

      **Expected calibration error (ECE)**, from the lesson on calibrated decisions, averages the gap between how confident a model says it is and how often it's right. B's confidence is less honest, and it misses more chats that need a person.

      :::key The decision
      The team keeps A for now. B's accuracy lead is inside the noise, and it is worse on calibration, hand-offs, speed, and cost. Their next step is 600 more test questions, scored on both models. The next lesson shows why comparing the models question by question makes 800 enough to see a real 3-point gain.
      :::
    bridges: []
  - id: evaluation-metrics-and-uncertainty.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.evaluation-metrics-and-uncertainty
    markdown: Compute a few error bars by hand, then judge a legal-research model, a worksheet-based tutor, a math grader, and two vendors' leaderboard claims.
    takeaway: |-
      Score free text with a metric that matches the answer format, and put a standard error on every score. On a few hundred items, a gap of a few points is usually noise.
  - id: evaluation-metrics-and-uncertainty.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.evaluation-metrics-and-uncertainty
    markdown: |-
      Choose measurements that match the task. Report uncertainty and a profile of quality, confidence, coverage, and cost rather than relying on one score.
