assessment_families:
- id: evaluation-metrics-and-uncertainty.base
  objective_ref: objective.evaluation-metrics-and-uncertainty
  task: base
  response_type: single_choice
  points: 1
  hint: 'Separate accuracy from calibration: trace the inputs, operation, and result before choosing.'
  remediation_scene: evaluation-metrics-and-uncertainty.s2
  variants:
  - id: evaluation-metrics-and-uncertainty.base.1
    prompt: What does 0.8 calibration mean across comparable cases?
    options:
    - id: c
      text: Every individual prediction is guaranteed
    - id: a
      text: About 80 percent correctness among those predictions
    - id: b
      text: Exactly 80 percent confidence on every task
    answer: a
    feedback: Calibration is a frequency relationship under defined conditions.
  - id: evaluation-metrics-and-uncertainty.base.2
    prompt: Can accuracy improve while confidence calibration worsens?
    options:
    - id: a
      text: 'Yes'
    - id: b
      text: 'No'
    - id: c
      text: Only if labels are missing
    answer: a
    feedback: Different metrics capture different properties.
- id: evaluation-metrics-and-uncertainty.transfer
  objective_ref: objective.evaluation-metrics-and-uncertainty
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Report a useful profile: trace the inputs, operation, and result before choosing.'
  remediation_scene: evaluation-metrics-and-uncertainty.s4
  variants:
  - id: evaluation-metrics-and-uncertainty.transfer.1
    prompt: Why account for many test examples from one document?
    options:
    - id: a
      text: Their errors may be correlated
    - id: b
      text: They automatically count as unrelated samples
    - id: c
      text: Document identity never matters
    answer: a
    feedback: Dependence changes uncertainty estimates.
  - id: evaluation-metrics-and-uncertainty.transfer.2
    prompt: What makes a baseline useful?
    options:
    - id: b
      text: It must always be the largest model
    - id: c
      text: It replaces all uncertainty estimates
    - id: a
      text: It shows whether added complexity improves the relevant task
    answer: a
    feedback: A baseline anchors practical value.
