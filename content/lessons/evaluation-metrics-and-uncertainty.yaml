schema_version: 0.2-draft
lesson:
  id: evaluation-metrics-and-uncertainty
  version: 0.3.0-draft
  title: Measure the behavior that the task actually needs
  state: draft
  summary: Choose useful measurements and show how uncertain they are.
  slot: M28.1
  category: learning
  sources:
  - title: HELM
    url: https://arxiv.org/abs/2211.09110
  - title: Calibration of Modern Neural Networks
    url: https://arxiv.org/abs/1706.04599
objectives:
- id: objective.evaluation-metrics-and-uncertainty
  version: 1-draft
  statement: Evaluation connects task goals to metrics, baselines, and uncertainty; accuracy, calibration,
    coverage, and cost answer different questions and can move in different directions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - evaluation-metrics-and-uncertainty.base
  - evaluation-metrics-and-uncertainty.transfer
  prerequisites:
  - anyOf:
    - objective.classification-metrics
  - anyOf:
    - objective.calibrated-decisions
  - anyOf:
    - objective.research-reporting
scenes:
- id: evaluation-metrics-and-uncertainty.s1
  title: Start with a decision-relevant metric
  type: explanation
  depth: intuition
  objective_refs:
  - objective.evaluation-metrics-and-uncertainty
  markdown: Classification may need precision and recall, forecasting may need absolute error, and generation
    may need verified task success. A metric is a chosen measurement, not the goal itself. Include a simple
    baseline and identify which errors matter most for the application.
  text_mode: Classification may need precision and recall, forecasting may need absolute error, and generation
    may need verified task success. A metric is a chosen measurement, not the goal itself. Include a simple
    baseline and identify which errors matter most for the application.
  bridges: []
- id: evaluation-metrics-and-uncertainty.s2
  title: Separate accuracy from calibration
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.evaluation-metrics-and-uncertainty
  markdown: Among cases assigned probability 0.8, calibration asks whether roughly 80 percent are correct under
    the evaluation conditions. A model can rank cases well but overstate confidence. Calibration can vary by
    subgroup and distribution, and a small bucket gives an uncertain estimate.
  text_mode: Among cases assigned probability 0.8, calibration asks whether roughly 80 percent are correct
    under the evaluation conditions. A model can rank cases well but overstate confidence. Calibration can
    vary by subgroup and distribution, and a small bucket gives an uncertain estimate.
  bridges: []
- id: evaluation-metrics-and-uncertainty.s3
  title: Quantify sampling uncertainty
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.evaluation-metrics-and-uncertainty
  markdown: 'A score from 20 examples is generally less precise than one from a representative larger sample.
    Confidence intervals or bootstrap comparisons need assumptions about independence and sampling. If many
    examples come from one document or user, account for clustering rather than treating every item as independent.


    With 16 correct answers out of 20, observed accuracy is 80%; changing one result moves it by five percentage
    points. With 160 out of 200, observed accuracy is still 80%, but one result moves it by only half a point.
    More independent, representative cases usually give a steadier estimate. Two hundred paraphrases of one
    question do not supply the same evidence as two hundred independently chosen questions.'
  text_mode: 'A score from 20 examples is generally less precise than one from a representative larger sample.
    Confidence intervals or bootstrap comparisons need assumptions about independence and sampling. If many
    examples come from one document or user, account for clustering rather than treating every item as independent.


    With 16 correct answers out of 20, observed accuracy is 80%; changing one result moves it by five percentage
    points. With 160 out of 200, observed accuracy is still 80%, but one result moves it by only half a point.
    More independent, representative cases usually give a steadier estimate. Two hundred paraphrases of one
    question do not supply the same evidence as two hundred independently chosen questions.'
  bridges: []
- id: evaluation-metrics-and-uncertainty.s4
  title: Report a useful profile
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.evaluation-metrics-and-uncertainty
  markdown: Show relevant quality metrics with latency, cost, and coverage or abstention behavior. Include
    failures and uncertainty instead of selecting only favorable numbers. A single aggregate ranking can hide
    tradeoffs that change which model is appropriate for a particular task.
  text_mode: Show relevant quality metrics with latency, cost, and coverage or abstention behavior. Include
    failures and uncertainty instead of selecting only favorable numbers. A single aggregate ranking can hide
    tradeoffs that change which model is appropriate for a particular task.
  bridges: []
- id: evaluation-metrics-and-uncertainty.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.evaluation-metrics-and-uncertainty
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Choose measurements that match the task. Report uncertainty and a profile of quality, confidence,
    coverage, and cost rather than relying on one score.
- id: evaluation-metrics-and-uncertainty.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.evaluation-metrics-and-uncertainty
  markdown: Choose measurements that match the task. Report uncertainty and a profile of quality, confidence,
    coverage, and cost rather than relying on one score.
  text_mode: Choose measurements that match the task. Report uncertainty and a profile of quality, confidence,
    coverage, and cost rather than relying on one score.
navigation:
