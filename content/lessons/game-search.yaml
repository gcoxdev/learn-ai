assessment_families:
- id: game-search.base
  objective_ref: objective.game-search
  task: base
  response_type: single_choice
  points: 1
  hint: 'Work backward through a tiny tree: trace the inputs, operation, and result before choosing.'
  remediation_scene: game-search.s2
  variants:
  - id: game-search.base.1
    prompt: A has opponent replies [4, 7]; B has [3, 10]. Which action does minimax prefer?
    options:
    - id: a
      text: A
    - id: b
      text: B
    - id: c
      text: Always the action with leaf 10
    answer: a
    feedback: Worst-case values are 4 and 3, so A is preferred.
  - id: game-search.base.2
    prompt: What does alpha-beta pruning aim to remove?
    options:
    - id: b
      text: All losing positions from the actual game
    - id: c
      text: The opponent’s legal actions permanently
    - id: a
      text: Branches unable to change the current minimax decision
    answer: a
    feedback: Pruning reduces computation without changing the evaluated minimax result.
- id: game-search.transfer
  objective_ref: objective.game-search
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Allocate trials with Monte Carlo tree search: trace the inputs, operation, and result before choosing.'
  remediation_scene: game-search.s4
  variants:
  - id: game-search.transfer.1
    prompt: A depth-limited minimax agent has a poor leaf evaluator. Does alpha-beta fix that evaluator?
    options:
    - id: b
      text: Yes; pruning learns perfect values
    - id: c
      text: Only if the tree has an even depth
    - id: a
      text: No; pruning preserves the same evaluation assumptions
    answer: a
    feedback: Search efficiency and evaluation accuracy are separate.
  - id: game-search.transfer.2
    prompt: MCTS visits one action only twice and another a thousand times. What should interpretation consider?
    options:
    - id: c
      text: A guarantee that the twice-visited action is worst
    - id: a
      text: Unequal uncertainty and the exploration policy
    - id: b
      text: Only which action has the larger name
    answer: a
    feedback: Finite sampling and allocation affect confidence in estimated values.
