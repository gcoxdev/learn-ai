schema_version: 0.2-draft
lesson:
  id: game-search
  version: 0.3.0-draft
  title: Plan while another player chooses the reply
  state: draft
  summary: Choose a game move by considering the opponent’s reply, then see how pruning and sampled play can
    save work.
  slot: M05.5
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.game-search
  version: 1-draft
  statement: Minimax, alpha-beta pruning, and Monte Carlo tree search evaluate actions under different opponent
    and sampling assumptions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - game-search.base
  - game-search.transfer
  prerequisites:
  - anyOf:
    - objective.search-problems
  - anyOf:
    - objective.decisions-and-games
scenes:
- id: game-search.s1
  title: Your best move depends on the reply
  type: explanation
  depth: intuition
  objective_refs:
  - objective.game-search
  markdown: In a two-player zero-sum game, one player’s gain is the other’s loss. Minimax chooses an action
    by assuming the opponent will choose the least favorable reply. The game state, legal actions, terminal
    conditions, and payoff must be specified. Other game structures require different reasoning.
  text_mode: In a two-player zero-sum game, one player’s gain is the other’s loss. Minimax chooses an action
    by assuming the opponent will choose the least favorable reply. The game state, legal actions, terminal
    conditions, and payoff must be specified. Other game structures require different reasoning.
  bridges: []
- id: game-search.s2
  title: Work backward through a tiny tree
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.game-search
  markdown: Action A allows opponent replies with payoffs 3 and 5 for us, so its minimax value is 3. Action
    B allows payoffs 2 and 9, so its value is 2. We choose A because its worst available reply is better. Choosing
    the largest leaf 9 would ignore the opponent’s control.
  text_mode: Action A allows opponent replies with payoffs 3 and 5 for us, so its minimax value is 3. Action
    B allows payoffs 2 and 9, so its value is 2. We choose A because its worst available reply is better. Choosing
    the largest leaf 9 would ignore the opponent’s control.
  bridges:
  - decisions-and-games
- id: game-search.s3
  title: Prune without changing the minimax result
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.game-search
  markdown: 'Alpha-beta pruning stops exploring branches that cannot affect the current minimax decision, using
    bounds from already examined alternatives. Good move ordering can increase pruning. With the same tree
    and evaluation assumptions, pruning preserves the minimax result; a depth-limited heuristic evaluation
    still limits the quality of that result.


    In the tiny tree, you already know A guarantees 3. When examining B, you first find the opponent can leave
    you 2. You can stop examining B''s other reply: the opponent can choose 2, so B cannot improve your guaranteed
    3. Skipping the unseen 9 changes neither the comparison nor the result.'
  text_mode: 'Alpha-beta pruning stops exploring branches that cannot affect the current minimax decision,
    using bounds from already examined alternatives. Good move ordering can increase pruning. With the same
    tree and evaluation assumptions, pruning preserves the minimax result; a depth-limited heuristic evaluation
    still limits the quality of that result.


    In the tiny tree, you already know A guarantees 3. When examining B, you first find the opponent can leave
    you 2. You can stop examining B''s other reply: the opponent can choose 2, so B cannot improve your guaranteed
    3. Skipping the unseen 9 changes neither the comparison nor the result.'
  bridges: []
- id: game-search.s4
  title: Spend more trials on promising moves
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.game-search
  markdown: '**Monte Carlo tree search (MCTS)** repeatedly selects a path, extends it, evaluates the result,
    and updates the statistics along that path. The selection rule balances promising moves with less-explored
    alternatives.


    A **rollout** plays a possible continuation to estimate an outcome. A learned **policy** can suggest moves,
    and a **value estimate** can score a position without playing to the end. **Backing up** the result means
    updating the statistics of the earlier choices that led there.


    One good rollout and one bad rollout give evidence about those trials. Their average does not prove what
    every possible opponent response will do.'
  text_mode: '**Monte Carlo tree search (MCTS)** repeatedly selects a path, extends it, evaluates the result,
    and updates the statistics along that path. The selection rule balances promising moves with less-explored
    alternatives.


    A **rollout** plays a possible continuation to estimate an outcome. A learned **policy** can suggest moves,
    and a **value estimate** can score a position without playing to the end. **Backing up** the result means
    updating the statistics of the earlier choices that led there.


    One good rollout and one bad rollout give evidence about those trials. Their average does not prove what
    every possible opponent response will do.'
  bridges: []
- id: game-search.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.game-search
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: In minimax, choose the move with the best worst-case reply. Pruning skips branches that cannot
    change that decision; sampled tree search uses trials to estimate promising moves.
- id: game-search.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.game-search
  markdown: In minimax, choose the move with the best worst-case reply. Pruning skips branches that cannot
    change that decision; sampled tree search uses trials to estimate promising moves.
  text_mode: In minimax, choose the move with the best worst-case reply. Pruning skips branches that cannot
    change that decision; sampled tree search uses trials to estimate promising moves.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - game-search.s1
    - game-search.s2
