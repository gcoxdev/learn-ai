schema_version: 0.2-draft
lesson:
  id: game-search
  version: 0.1.0-draft
  title: Plan while another player chooses the reply
  state: draft
  summary: Minimax, alpha-beta pruning, and Monte Carlo tree search evaluate actions under different opponent and
    sampling assumptions.
  slot: M05.5
  category: learning
  minutes: 12
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.game-search
  version: 1-draft
  statement: Minimax, alpha-beta pruning, and Monte Carlo tree search evaluate actions under different opponent
    and sampling assumptions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - game-search.base
  - game-search.transfer
  prerequisites:
  - anyOf:
    - objective.search-problems
  - anyOf:
    - objective.decisions-and-games
scenes:
- id: game-search.s1
  title: Your best move depends on the reply
  type: explanation
  depth: intuition
  objective_refs:
  - objective.game-search
  markdown: In a two-player zero-sum game, one player’s gain is the other’s loss. Minimax chooses an action by assuming
    the opponent will choose the least favorable reply. The game state, legal actions, terminal conditions, and
    payoff must be specified. Other game structures require different reasoning.
  text_mode: In a two-player zero-sum game, one player’s gain is the other’s loss. Minimax chooses an action by
    assuming the opponent will choose the least favorable reply. The game state, legal actions, terminal conditions,
    and payoff must be specified. Other game structures require different reasoning.
  bridges: []
- id: game-search.s2
  title: Work backward through a tiny tree
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.game-search
  markdown: Action A allows opponent replies with payoffs 3 and 5 for us, so its minimax value is 3. Action B allows
    payoffs 2 and 9, so its value is 2. We choose A because its worst available reply is better. Choosing the largest
    leaf 9 would ignore the opponent’s control.
  text_mode: Action A allows opponent replies with payoffs 3 and 5 for us, so its minimax value is 3. Action B allows
    payoffs 2 and 9, so its value is 2. We choose A because its worst available reply is better. Choosing the largest
    leaf 9 would ignore the opponent’s control.
  bridges:
  - decisions-and-games
- id: game-search.s3
  title: Prune without changing the minimax result
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.game-search
  markdown: Alpha-beta pruning stops exploring branches that cannot affect the current minimax decision, using bounds
    from already examined alternatives. Good move ordering can increase pruning. With the same tree and evaluation
    assumptions, pruning preserves the minimax result; a depth-limited heuristic evaluation still limits the quality
    of that result.
  text_mode: Alpha-beta pruning stops exploring branches that cannot affect the current minimax decision, using
    bounds from already examined alternatives. Good move ordering can increase pruning. With the same tree and evaluation
    assumptions, pruning preserves the minimax result; a depth-limited heuristic evaluation still limits the quality
    of that result.
  bridges: []
- id: game-search.s4
  title: Allocate trials with Monte Carlo tree search
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.game-search
  markdown: MCTS repeatedly selects a path, expands, evaluates or simulates, and backs results up the tree. Its
    selection rule balances promising choices with less-explored ones. A learned policy or value model can guide
    it. Finite simulations give estimates, not a universal proof of the optimal move, and the rollout assumptions
    matter.
  text_mode: MCTS repeatedly selects a path, expands, evaluates or simulates, and backs results up the tree. Its
    selection rule balances promising choices with less-explored ones. A learned policy or value model can guide
    it. Finite simulations give estimates, not a universal proof of the optimal move, and the rollout assumptions
    matter.
  bridges: []
- id: game-search.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.game-search
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Minimax, alpha-beta pruning, and Monte Carlo tree search evaluate actions under different opponent and
    sampling assumptions.
- id: game-search.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.game-search
  markdown: Minimax, alpha-beta pruning, and Monte Carlo tree search evaluate actions under different opponent and
    sampling assumptions.
  text_mode: Minimax, alpha-beta pruning, and Monte Carlo tree search evaluate actions under different opponent
    and sampling assumptions.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - game-search.s1
