assessment_families:
  - id: game-search.base
    objective_ref: objective.game-search
    task: base
    response_type: single_choice
    points: 1
    hint: 'Work backward through a tiny tree: trace the inputs, operation, and result before choosing.'
    remediation_scene: game-search.s2
    variants:
      - id: game-search.base.1
        prompt: A has opponent replies [4, 7]; B has [3, 10]. Which action does minimax prefer?
        options:
          - id: a
            text: A
          - id: b
            text: B
          - id: c
            text: Always the action with leaf 10
        answer: a
        feedback: Worst-case values are 4 and 3, so A is preferred.
        retired: true
      - id: game-search.base.2
        prompt: What does alpha-beta pruning aim to remove?
        options:
          - id: b
            text: All losing positions from the actual game
          - id: c
            text: The opponent’s legal actions permanently
          - id: a
            text: Branches unable to change the current minimax decision
        answer: a
        feedback: Pruning reduces computation without changing the evaluated minimax result.
        retired: true
  - id: game-search.transfer
    objective_ref: objective.game-search
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Allocate trials with Monte Carlo tree search: trace the inputs, operation, and result before choosing.'
    remediation_scene: game-search.s4
    variants:
      - id: game-search.transfer.1
        prompt: A depth-limited minimax agent has a poor leaf evaluator. Does alpha-beta fix that evaluator?
        options:
          - id: b
            text: Yes; pruning learns perfect values
          - id: c
            text: Only if the tree has an even depth
          - id: a
            text: No; pruning preserves the same evaluation assumptions
        answer: a
        feedback: Search efficiency and evaluation accuracy are separate.
        retired: true
      - id: game-search.transfer.2
        prompt: MCTS visits one action only twice and another a thousand times. What should interpretation consider?
        options:
          - id: c
            text: A guarantee that the twice-visited action is worst
          - id: a
            text: Unequal uncertainty and the exploration policy
          - id: b
            text: Only which action has the larger name
        answer: a
        feedback: Finite sampling and allocation affect confidence in estimated values.
        retired: true
  - id: game-search.base.v2
    objective_ref: objective.game-search
    task: base
    response_type: single_choice
    points: 1
    hint: A MIN node takes its smallest child and a MAX node its largest. Alpha-beta stops a MIN node as soon as its value drops to α (what MAX already has) or below.
    remediation_scene: game-search.s3
    variants:
      - id: game-search.base.v2.1
        prompt: You (MAX) can play A, after which MIN's replies score 4 or 7, or B, after which MIN's replies score 3 or 10. Which move does minimax choose?
        options:
          - id: b
            text: B, since it's the only way to reach 10
          - id: c
            text: B, since its average of 6.5 beats 5.5
          - id: a
            text: A, since its worst reply still leaves 4
        answer: a
        feedback: MIN picks the reply, so A is worth 4 and B is worth 3. The 10 and the averages only count if MIN helps you, and minimax assumes it won't.
      - id: game-search.base.v2.2
        prompt: Your first move is already worth 5. Your second move's MIN node has leaves 7, 2, and 9, checked left to right. Which leaves does alpha-beta skip?
        options:
          - id: a
            text: Just the 9
          - id: b
            text: Both the 2 and the 9
          - id: c
            text: None of the three
        answer: a
        feedback: After 7 the node is worth at most 7, which could still beat 5, so the search goes on. After 2 it's worth at most 2 ≤ 5, so the 9 can't matter. The 2 had to be checked to learn that.
      - id: game-search.base.v2.3
        prompt: Plain minimax and alpha-beta search the same game tree to the same depth. How do their results compare?
        options:
          - id: c
            text: Alpha-beta may pick a slightly worse move to save time
          - id: a
            text: Same move and value; alpha-beta looks at fewer leaves
          - id: b
            text: Alpha-beta picks better moves, since it cuts weak lines
        answer: a
        feedback: Pruning skips only leaves that can't change the decision, so the answer is identical. It saves time without changing, improving, or worsening the result.
      - id: game-search.base.v2.4
        prompt: You search the same tree twice with alpha-beta, once with the best moves first and once with the worst moves first. What differs between the two runs?
        options:
          - id: b
            text: The minimax value found at the root
          - id: a
            text: How many leaves get pruned
          - id: c
            text: Which move is finally chosen
        answer: a
        feedback: Ordering changes only the work. Best-first ordering gives α a good value early, so more leaves fall at or below it. The value and the chosen move stay the same, as the "LMR" and "RML" runs showed.
      - id: game-search.base.v2.5
        prompt: 'An MCTS node has N = 50 visits. Child X has won 30 of 40, and child Y has won 2 of 5. Using UCB1 with c = √2, X scores about 1.19 and Y about 1.65. Which child does selection follow, and why?'
        options:
          - id: c
            text: X, because its win rate of 0.75 is higher
          - id: b
            text: X, because it has been visited far more often
          - id: a
            text: Y, because its exploration bonus is large
        answer: a
        feedback: UCB1 follows the highest score, and Y's bonus for being rarely tried lifts it to 1.65. Win rate alone would pick X, but that would stop MCTS from checking whether Y is better than it looks.
  - id: game-search.transfer.v2
    objective_ref: objective.game-search
    task: transfer
    response_type: single_choice
    points: 1
    hint: Minimax assumes the opponent finds its best reply. Pruning saves time but never changes the answer. MCTS estimates are shaky where visits are few.
    remediation_scene: game-search.s4
    variants:
      - id: game-search.transfer.v2.1
        prompt: A depth-limited chess engine has a weak evaluation function. You add alpha-beta pruning. What improves?
        options:
          - id: a
            text: It can search deeper in the same time
          - id: b
            text: Its position scores become more accurate
          - id: c
            text: It no longer needs an evaluation function
        answer: a
        feedback: Pruning cuts wasted work, so the same time buys a deeper search. The scores at the cutoff still come from the same weak evaluation function.
      - id: game-search.transfer.v2.2
        prompt: A Connect Four bot using minimax refuses to set a trap that would beat most beginners, because a strong player could escape it. Why does minimax behave this way?
        options:
          - id: c
            text: Pruning removed the trap line from its tree
          - id: a
            text: It assumes the opponent finds the best reply
          - id: b
            text: Its evaluation function scores traps as losses
        answer: a
        feedback: Minimax values each move by the opponent's best reply, so a trap that fails against good play looks bad. Pruning never removes a line that could change the decision.
      - id: game-search.transfer.v2.3
        prompt: After 1,000 MCTS rounds, move P has been visited 900 times with a win rate of 0.55, and move Q 12 times with a win rate of 0.67. Which should the program play?
        options:
          - id: b
            text: Q, because its win rate is the higher one
          - id: a
            text: P, because its estimate rests on far more games
          - id: c
            text: Q, because fewer visits leave less room for error
        answer: a
        feedback: MCTS usually plays the most-visited move. Q's 0.67 comes from only 12 games and could easily be luck, while P's 0.55 is backed by 900.
      - id: game-search.transfer.v2.4
        prompt: For decades Go programs lagged far behind chess programs, which used alpha-beta with hand-written evaluation functions. Why did Go programs switch to MCTS?
        options:
          - id: a
            text: Go positions are hard to score with written rules
          - id: b
            text: Alpha-beta can't be used in a two-player game
          - id: c
            text: Go has fewer legal moves per turn than chess
        answer: a
        feedback: MCTS scores positions by playing games out, which doesn't need a hand-written evaluation. Alpha-beta is built for two-player games, and Go has far more moves per turn (around 250 against chess's 35 or so), not fewer.
      - id: game-search.transfer.v2.5
        prompt: An MCTS game bot is given ten times more thinking time per move. What does it do with the extra time?
        options:
          - id: c
            text: Switches over to alpha-beta for the extra time
          - id: b
            text: Searches the full tree to the end of the game
          - id: a
            text: Runs more rounds, sharpening its win estimates
        answer: a
        feedback: MCTS improves by running more rounds, so more time means more games behind each estimate. Ten times the time is still nowhere near enough to search a Go or chess tree completely.
  - id: game-search.calc.v2
    objective_ref: objective.game-search
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Work left to right. A MIN node takes its smallest leaf; once its value falls to α (the best MAX already has) or below, skip its remaining leaves. The root takes the largest MIN value.
    remediation_scene: game-search.s3
    numeric_fields:
      - id: value
        label: Minimax value of the root
      - id: pruned
        label: Leaves alpha-beta skips
    variants:
      - id: game-search.calc.v2.1
        prompt: 'You (MAX) have three moves, searched left to right. After each, MIN chooses among these leaves, in order: A: 3, 5. B: 2, 9. C: 6, 4. Record the root''s minimax value and the number of leaves alpha-beta skips.'
        feedback: A = min(3, 5) = 3, so α = 3. In B the first leaf, 2, is ≤ 3, so the 9 is skipped. C needs both leaves, min(6, 4) = 4. Root = max(3, 2 or less, 4) = 4, with 1 leaf skipped.
        answers:
          value: 4
          pruned: 1
        reason_answer: rule
        reason_options:
          - id: rule
            text: MIN takes the smallest, MAX the largest; stop a MIN node once it's at or below α.
          - id: avg
            text: Average each MIN node's leaves, then take the largest average.
          - id: max
            text: Take the largest leaf anywhere, since MAX moves first.
      - id: game-search.calc.v2.2
        prompt: 'You (MAX) have three moves, searched left to right. After each, MIN chooses among these leaves, in order: A: 8, 6, 7. B: 5, 9, 1. C: 4, 3, 2. Record the root''s minimax value and the number of leaves alpha-beta skips.'
        feedback: A = 6, so α = 6. B's first leaf, 5, is ≤ 6, so 9 and 1 are skipped. C's first leaf, 4, is ≤ 6, so 3 and 2 are skipped. The root is 6, with 4 leaves skipped.
        answers:
          value: 6
          pruned: 4
        reason_answer: rule
        reason_options:
          - id: avg
            text: Average each MIN node's leaves, then take the largest average.
          - id: rule
            text: MIN takes the smallest, MAX the largest; stop a MIN node once it's at or below α.
          - id: max
            text: Take the largest leaf anywhere, since MAX moves first.
      - id: game-search.calc.v2.3
        prompt: 'You (MAX) have three moves, searched left to right. After each, MIN chooses among these leaves, in order: A: 2, 4. B: 7, 5. C: 1, 8. Record the root''s minimax value and the number of leaves alpha-beta skips.'
        feedback: A = 2, so α = 2. B's leaves 7 and 5 both beat 2, so both are checked; B = 5 and α becomes 5. C's first leaf, 1, is ≤ 5, so the 8 is skipped. The root is 5, with 1 leaf skipped.
        answers:
          value: 5
          pruned: 1
        reason_answer: rule
        reason_options:
          - id: max
            text: Take the largest leaf anywhere, since MAX moves first.
          - id: avg
            text: Average each MIN node's leaves, then take the largest average.
          - id: rule
            text: MIN takes the smallest, MAX the largest; stop a MIN node once it's at or below α.
      - id: game-search.calc.v2.4
        prompt: 'You (MAX) have three moves, searched left to right. After each, MIN chooses among these leaves, in order: A: 1, 6, 2. B: 3, 4, 8. C: 9, 7, 5. Record the root''s minimax value and the number of leaves alpha-beta skips.'
        feedback: A = 1, B = 3, and C = 5. Each MIN node's leaves stay above the α set before it, so every leaf must be checked. The root is 5, with 0 leaves skipped; the best move came last.
        answers:
