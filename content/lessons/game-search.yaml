          pruned: 0
        reason_answer: rule
        reason_options:
          - id: rule
            text: MIN takes the smallest, MAX the largest; stop a MIN node once it's at or below α.
          - id: max
            text: Take the largest leaf anywhere, since MAX moves first.
          - id: avg
            text: Average each MIN node's leaves, then take the largest average.
      - id: game-search.calc.v2.5
        prompt: 'You (MAX) have three moves, searched left to right. After each, MIN chooses among these leaves, in order: A: 7, 2. B: 8, 6. C: 1, 9. Record the root''s minimax value and the number of leaves alpha-beta skips.'
        feedback: A = 2, so α = 2. B's leaves 8 and 6 both beat 2; B = 6 and α becomes 6. C's first leaf, 1, is ≤ 6, so the 9 is skipped. The root is 6, with 1 leaf skipped.
        answers:
          value: 6
          pruned: 1
        reason_answer: rule
        reason_options:
          - id: avg
            text: Average each MIN node's leaves, then take the largest average.
          - id: max
            text: Take the largest leaf anywhere, since MAX moves first.
          - id: rule
            text: MIN takes the smallest, MAX the largest; stop a MIN node once it's at or below α.
