scenes:
  - id: game-search.s1
    title: Your best move depends on the reply
    type: explanation
    depth: intuition
    objective_refs:
      - objective.game-search
    markdown: |-
      In tic-tac-toe, a move that sets up two ways to win is brilliant, unless your opponent's very next move completes *their* row. Roads never fought back; in a game, every plan has to survive the other player's best reply.

      This lesson covers **two-player zero-sum games**, where one player's gain is exactly the other's loss, like tic-tac-toe, chess, and Go. (Games with dice or hidden cards need extra tools.) Call the two players **MAX**, who wants the score high, and **MIN**, who wants it low. A finished game gets a score, such as +1 for a MAX win, 0 for a draw, and −1 for a loss.

      Laying out every move and every reply gives a **game tree**. Tic-tac-toe's is small: fewer than 9! = 362,880 ways a game can unfold, easy to search completely. Chess is another matter: in 1950 Claude Shannon estimated about 10¹²⁰ possible chess games. Game programs need ways to search less of the tree.
    bridges: []
  - id: game-search.s2
    title: Work backward through a tiny tree
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.game-search
    markdown: |-
      You're MAX with three moves, L, M, and R. After each one, MIN picks one of three replies, and the game ends with the score shown (higher is better for you).

      :::predict The biggest score in the tree, 9, sits under M. Should you play M?
      No. After M, MIN chooses, and MIN will pick 3, the worst reply for you. Judge each move by what the opponent will let you have:

      | Your move | Scores after MIN's replies | MIN picks | Value of the move |
      | --- | --- | ---: | ---: |
      | L | 4, 7, 5 | 4 | **4** |
      | M | 6, 3, 9 | 3 | 3 |
      | R | 2, 8, 1 | 1 | 1 |

      You play L, the move with the best worst case. Its value, 4, is the **minimax value** of the game: the score you can guarantee if both sides play perfectly.
      :::

      Backing values up from the leaves this way is the minimax algorithm: MIN nodes take the smallest child, MAX nodes the largest, alternating level by level up to the root.

      :::papers The minimax recursion
      $$\text{MINIMAX}(s) = \begin{cases} \text{UTILITY}(s) & \text{if the game is over at } s \\ \max_a \text{MINIMAX}(\text{RESULT}(s, a)) & \text{if MAX moves at } s \\ \min_a \text{MINIMAX}(\text{RESULT}(s, a)) & \text{if MIN moves at } s \end{cases}$$
      UTILITY is the final score and RESULT is the transition model from the search problems lesson. In our tree, MINIMAX(after L) = min(4, 7, 5) = 4, and MINIMAX(root) = max(4, 3, 1) = 4.
      :::
    diagram:
      caption: The tiny game tree. You (MAX) choose a move; MIN then chooses the reply that leaves you the lowest score.
      description: The root, your move as MAX, has three branches. Move L leads to a MIN node whose replies score 4, 7, and 5, so it is worth 4. Move M leads to a MIN node with replies 6, 3, and 9, worth 3. Move R leads to a MIN node with replies 2, 8, and 1, worth 1. MAX picks L, worth 4.
      nodes:
        - id: root
          label: Your move (MAX)
          note: value 4, play L
          col: 1
          row: 0
          tone: accent
        - id: l
          label: After L (MIN)
          note: replies 4, 7, 5 → 4
          col: 0
          row: 1
          tone: data
        - id: m
          label: After M (MIN)
          note: replies 6, 3, 9 → 3
          col: 1
          row: 1
        - id: r
          label: After R (MIN)
          note: replies 2, 8, 1 → 1
          col: 2
          row: 1
      edges:
        - from: root
          to: l
          label: L
        - from: root
          to: m
          label: M
        - from: root
          to: r
          label: R
    bridges:
      - decisions-and-games
  - id: game-search.s3
    title: Skip leaves that can't change the answer
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.game-search
    markdown: |-
      Do you really need all nine scores? Walk through them left to right and keep one number, **α (alpha)**: the best value MAX is already sure of.

      | Leaf | Score | What we now know | Decision |
      | --- | ---: | --- | --- |
      | L, 1st | 4 | L is worth at most 4 | keep going |
      | L, 2nd | 7 | still at most 4 | keep going |
      | L, 3rd | 5 | L is worth exactly 4, so α = 4 | move on to M |
      | M, 1st | 6 | M is worth at most 6 | keep going: 6 > 4 |
      | M, 2nd | 3 | M is worth at most 3 | **stop: 3 ≤ α** |
      | M, 3rd | 9 | *never looked at* | pruned |
      | R, 1st | 2 | R is worth at most 2 | **stop: 2 ≤ α** |
      | R, 2nd and 3rd | 8, 1 | *never looked at* | pruned |

      Once MIN can hold M down to 3, you'd never choose M: L already guarantees 4. Whether the hidden leaf is 9 or 900, MIN would still pick 3. This is **alpha-beta pruning**, and it skipped 3 of 9 leaves. In deeper trees a partner bound, **β (beta)**, does the same job for MIN.

      :::mixup "Pruning is a shortcut that might miss the best move."
      Alpha-beta returns exactly the same move and value as full minimax. It skips only leaves that provably can't change the decision.
      :::

      The order of moves decides how much gets skipped. Run it, then change the order to `"RML"`:

      ```python run
      import math

      def leaves(node):
          return 1 if isinstance(node, int) else sum(leaves(c) for c in node)

      def alphabeta(node, alpha, beta, maximizing, stats):
          if isinstance(node, int):                      # a finished game: its score
              stats["evaluated"] += 1
              return node
          best = -math.inf if maximizing else math.inf
          for i, child in enumerate(node):
              value = alphabeta(child, alpha, beta, not maximizing, stats)
              if maximizing:
                  best, alpha = max(best, value), max(alpha, value)
              else:
                  best, beta = min(best, value), min(beta, value)
              if alpha >= beta:                          # the other player won't allow this line
                  stats["pruned"] += sum(leaves(c) for c in node[i + 1:])
                  break
          return best

      moves = {"L": [4, 7, 5], "M": [6, 3, 9], "R": [2, 8, 1]}
      order = "LMR"                                      # try "RML"
      stats = {"evaluated": 0, "pruned": 0}
      value = alphabeta([moves[m] for m in order], -math.inf, math.inf, True, stats)
      print(f"order {order}: value {value}, leaves evaluated {stats['evaluated']}, pruned {stats['pruned']}")
      ```

      Best move first: 6 leaves evaluated, 3 pruned. Worst first: all 9 evaluated, same value 4. With perfect ordering, alpha-beta examines roughly $b^{d/2}$ positions instead of $b^d$, so the same time buys about twice the depth.

      :::story Deep Blue, 1997
      Real games are too deep to search to the end, so programs stop at a fixed depth and score positions with an **evaluation function**, a hand-written estimate such as "material plus king safety." In May 1997, IBM's Deep Blue beat world champion Garry Kasparov 3½–2½ over six games. At its core was alpha-beta search at enormous scale, on custom chess chips that examined well over 100 million positions per second.
      :::
    bridges: []
  - id: game-search.s4
    title: Spend more trials on promising moves
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.game-search
    markdown: |-
      Go defeated this recipe for decades. It has around 250 legal moves per turn against chess's 35 or so, and nobody could write a good evaluation function for it. **Monte Carlo tree search (MCTS)** sidesteps both problems by playing many quick games from a move and counting wins. Each round has four steps:

      1. **Select**: walk down the tree, at each step choosing a child by the rule below.
      2. **Expand**: add one new position to the tree.
      3. **Simulate**: play a quick game (a **rollout**) from there to the end, often with random moves.
      4. **Back up**: add the win or loss to the counts of every node on the path.

      The selection rule balances *exploiting* moves that have won often with *exploring* moves tried only a few times. The standard choice is **UCB1** (on trees, UCT: Kocsis and Szepesvári, 2006). Pick the child with the highest

      $$\frac{w_i}{n_i} + c\sqrt{\frac{\ln N}{n_i}}$$

      where $w_i$ is the child's wins, $n_i$ its visits, $N$ the parent's visits, and $c$ a constant, often $\sqrt{2}$.

      :::predict The root has N = 30 visits. L has won 12 of 20, M 5 of 8, and R 0 of 2. With c = √2, which does UCB1 try next?
      R, the one that has never won! Its bonus is huge because it's barely been tried:

      | Move | Win rate $w/n$ | Bonus $\sqrt{2}\sqrt{\ln 30 / n}$ | Score |
      | --- | ---: | ---: | ---: |
      | L | 12/20 = 0.600 | 0.583 | 1.183 |
      | M | 5/8 = 0.625 | 0.922 | 1.547 |
      | R | 0/2 = 0.000 | 1.844 | 1.844 (highest) |

      If R loses once more (0 of 3, with N = 31), its score drops to 1.513 and M (1.552) takes over. R isn't abandoned, though: its bonus creeps back up as N grows, so it gets tried again later. Two losses aren't enough evidence to give up on a move.
      :::

      When time runs out, MCTS usually plays the move it visited most, since those estimates rest on the most games.

      :::story AlphaGo, 2016
      In March 2016, DeepMind's AlphaGo beat Lee Sedol, one of the world's strongest Go players, 4–1. It ran MCTS with two neural networks: a **policy network** suggested promising moves, steering selection toward them, and a **value network** judged positions, combined with fast rollouts to score new positions.
      :::
    diagram:
      caption: One round of Monte Carlo tree search. Rounds repeat until time runs out.
      description: Select walks down the tree using UCB1 and hands the chosen position to Expand, which adds a new node. Simulate plays a quick game from that node to the end. Back up adds the result to every node on the path, and then the next round begins with Select again.
      nodes:
        - id: select
          label: Select
          note: pick children by UCB1
          col: 0
          row: 0
          tone: accent
        - id: expand
          label: Expand
          note: add one new position
          col: 1
          row: 0
        - id: simulate
          label: Simulate
          note: quick game to the end
          col: 1
          row: 1
          tone: data
        - id: backup
          label: Back up
          note: update wins and visits
          col: 0
          row: 1
      edges:
        - from: select
          to: expand
        - from: expand
          to: simulate
        - from: simulate
          to: backup
          label: result
        - from: backup
          to: select
          label: next round
          dashed: true
    bridges: []
  - id: game-search.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.game-search
    markdown: New game trees, chess and Connect Four bots, and MCTS statistics ask you to back up minimax values, count pruned leaves, and read what the numbers really say.
    takeaway: |-
      Minimax picks the move with the best worst case. Alpha-beta gets the same answer while skipping leaves that can't matter, and MCTS spends its game simulations where the win counts are promising or still uncertain.
  - id: game-search.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.game-search
    markdown: |-
      In minimax, choose the move with the best worst-case reply. Pruning skips branches that cannot change that decision; sampled tree search uses trials to estimate promising moves.
