assessment_families:
- id: selective-state-spaces.base
  objective_ref: objective.selective-state-spaces
  task: base
  response_type: single_choice
  points: 1
  hint: 'Understand the gate-like effect: trace the inputs, operation, and result before choosing.'
  remediation_scene: selective-state-spaces.s2
  variants:
  - id: selective-state-spaces.base.1
    prompt: What makes a state-space model selective here?
    options:
    - id: b
      text: Its weights are manually chosen after every token
    - id: c
      text: It stores all tokens without compression
    - id: a
      text: Some update quantities depend on the input
    answer: a
    feedback: Content can influence retention and processing.
  - id: selective-state-spaces.base.2
    prompt: In the toy update, a_t near zero does what to previous state?
    options:
    - id: c
      text: Doubles it
    - id: a
      text: Suppresses its contribution
    - id: b
      text: Always preserves it exactly
    answer: a
    feedback: The previous state is multiplied by a_t.
- id: selective-state-spaces.transfer
  objective_ref: objective.selective-state-spaces
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Measure memory and retrieval separately: trace the inputs, operation, and result before choosing.'
  remediation_scene: selective-state-spaces.s4
  variants:
  - id: selective-state-spaces.transfer.1
    prompt: Why does input dependence complicate a fixed convolution implementation?
    options:
    - id: c
      text: It removes every parallel algorithm
    - id: a
      text: The effective dynamics vary with the sequence content
    - id: b
      text: Convolution cannot multiply numbers
    answer: a
    feedback: A single time-invariant kernel no longer describes all updates.
  - id: selective-state-spaces.transfer.2
    prompt: Does fixed-size recurrent memory guarantee exact unlimited recall?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only with a long prompt
    answer: a
    feedback: Finite learned summaries can lose information.
