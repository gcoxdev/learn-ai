schema_version: 0.2-draft
lesson:
  id: selective-state-spaces
  version: 0.4.0-draft
  title: Let the current input control what the state retains
  state: draft
  summary: Ask a model to remember the colors and ignore every "um", and a fixed filter fails. Mamba lets each token set its own step size, which turns a state-space model into a learned gate.
  slot: M19.5
  category: learning
  sources:
    - title: "Mamba: Linear-Time Sequence Modeling with Selective State Spaces (Gu & Dao, 2023)"
      url: https://arxiv.org/abs/2312.00752
    - title: "Transformers are SSMs: Generalized Models and Efficient Algorithms Through Structured State Space Duality (Dao & Gu, 2024)"
      url: https://arxiv.org/abs/2405.21060
    - title: "An Empirical Study of Mamba-based Language Models (Waleffe et al., 2024)"
      url: https://arxiv.org/abs/2406.07887
objectives:
  - id: objective.selective-state-spaces
    version: 2-draft
    statement: Selective state-space models make selected dynamics input-dependent, enabling content-sensitive state updates; hardware-aware scans and fixed-size recurrent state create a different tradeoff from attention.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - selective-state-spaces.base.v2
      - selective-state-spaces.transfer.v2
      - selective-state-spaces.step
    prerequisites:
      - anyOf:
          - objective.state-space-sequences
scenes:
  - id: selective-state-spaces.s1
    title: Keep the colors, skip the ums
    type: explanation
    depth: intuition
    objective_refs:
      - objective.selective-state-spaces
    markdown: |-
      Someone reads you a list: "red, um, um, blue, um, um, um, green." Later you're asked for the colors. You kept three words and threw away five, and you decided *as each word arrived*.

      A time-invariant SSM from the last lesson can't do that. Its kernel gives the word three steps back the same weight whether it was "blue" or "um". Gu and Dao (2023) built a benchmark on exactly this, the **selective copying** task: remember the content tokens scattered at random positions among filler tokens. A network built on a plain S4 layer scored 18% on it; the same network with the S4 layer swapped for a selective one scored 97%.

      Their fix, the core of **Mamba** (December 2023), is to let the current input change the update itself. The model computes, from each token, how much of the old state to keep, how strongly to write the new token, and what to read out. That is a **selective state-space model**. Nobody labels which words matter; training on ordinary text teaches the model which inputs should push the update toward "keep" and which toward "overwrite".
    bridges: []
  - id: selective-state-spaces.s2
    title: A gate hidden in the step size
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.selective-state-spaces
    markdown: |-
      Recall discretization: the step size $\Delta$ turns a continuous $A$ into $\bar{A} = e^{\Delta A}$. In S4, $\Delta$ was one learned number. Mamba computes it from each token.

      :::papers The selective SSM ("S6") in Mamba
      For each token $x_t$:

      $$\Delta_t = \text{softplus}(\text{Linear}(x_t)), \quad B_t = \text{Linear}(x_t), \quad C_t = \text{Linear}(x_t)$$

      $$\bar{A}_t = e^{\Delta_t A}, \qquad h_t = \bar{A}_t\, h_{t-1} + \bar{B}_t\, x_t, \qquad y_t = C_t\, h_t$$

      $A$ itself stays a fixed learned (diagonal, negative) matrix, but $\bar{A}_t$ changes with every token because $\Delta_t$ does. Softplus, $\ln(1 + e^z)$, keeps $\Delta$ positive. The paper proves that with one state number, $A = -1$ and $B = 1$, this becomes exactly a gated RNN:

      $$h_t = (1 - g_t)\, h_{t-1} + g_t\, x_t, \qquad g_t = \sigma(\text{Linear}(x_t))$$
      :::

      Work it through. Call the learned score $z_t = \text{Linear}(x_t)$. Then $\bar{A}_t = e^{-\text{softplus}(z_t)} = 1/(1 + e^{z_t})$, and the write weight is $g_t = 1 - \bar{A}_t$:

      | Score $z_t$ | $\Delta_t$ | Keep $\bar{A}_t$ | Write $g_t$ | Effect |
      | ---: | ---: | ---: | ---: | --- |
      | −3 | 0.049 | 0.953 | 0.047 | ignore this token |
      | 0 | 0.693 | 0.500 | 0.500 | blend old and new |
      | 3 | 3.049 | 0.047 | 0.953 | overwrite with this token |

      A tiny step barely moves the state; a big step lets the state jump to the new input. The program runs the list, with colors scored 3 and "um" scored −3, against a fixed step that always keeps half:

      ```python run
      import numpy as np

      words  = ["red", "um", "um", "blue", "um", "um", "um"]
      values = [5.0,   1.0,  1.0,  8.0,    1.0,  1.0,  1.0]    # what each word would write
      z      = [3.0,  -3.0, -3.0,  3.0,   -3.0, -3.0, -3.0]    # learned score: "keep this?"

      def selective_step(h, x, z_t):
          delta = np.log1p(np.exp(z_t))    # softplus: step size chosen by the input
          a_bar = np.exp(-delta)           # zero-order hold with A = -1
          return a_bar * h + (1 - a_bar) * x

      h_sel = h_lti = 0.0
      for w, x, z_t in zip(words, values, z):
          h_sel = selective_step(h_sel, x, z_t)
          h_lti = 0.5 * h_lti + 0.5 * x    # time-invariant: same step for every word
          print(f"{w:5s} selective state {h_sel:5.2f}   fixed-step state {h_lti:5.2f}")
      ```

      After "blue" the selective state is 7.83 and still 6.90 three ums later. The fixed-step state has slid to 1.46, most of the way to "um".

      :::predict What happens if "um" gets a score of 0 instead of −3?
      Each "um" now writes with weight 0.5, so the state halves its distance to 1 every time. Three ums after "blue", it would be about 1.8. Try it: change the −3.0s to 0.0.
      :::
    bridges: []
  - id: selective-state-spaces.s3
    title: No fixed kernel, so scan instead
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.selective-state-spaces
    markdown: |-
      Selection costs something. In the last lesson, input $j$ reached output $t$ with weight $CA^{t-j}B$, which depends only on the distance. Now that weight is $C_t\,\bar{A}_t \bar{A}_{t-1} \cdots \bar{A}_{j+1}\,\bar{B}_j$: it depends on *which tokens came in between*. There is no single kernel, so the fast convolution view is gone.

      The recurrence still has a useful property. Doing step $(a_1, b_1)$ and then step $(a_2, b_2)$, where each step means $h \mapsto a h + b$, is the same as one combined step $(a_2 a_1,\; a_2 b_1 + b_2)$. Combining is associative, so a **parallel scan** can merge neighboring steps in rounds: 8 steps take 3 rounds, and a million take 20.

      ```python run
      import numpy as np

      rng = np.random.default_rng(1)
      n = 8
      a = rng.uniform(0.1, 1.0, n)       # per-step keep factor, chosen by each input
      b = rng.uniform(-1.0, 1.0, n)      # per-step write term (B-bar times x)

      h, sequential = 0.0, []            # one step after another: n dependent steps
      for t in range(n):
          h = a[t] * h + b[t]
          sequential.append(h)

      def combine(first, then):          # doing step (a1, b1), then (a2, b2) ...
          a1, b1 = first
          a2, b2 = then
          return (a2 * a1, a2 * b1 + b2)  # ... is one step (a2*a1, a2*b1 + b2)

      steps, span, rounds = list(zip(a, b)), 1, 0
      while span < n:                    # each round's combines are independent: run them in parallel
          steps = [steps[i] if i < span else combine(steps[i - span], steps[i]) for i in range(n)]
          span, rounds = span * 2, rounds + 1

      print("sequential:", np.round(sequential, 4))
      print("scan      :", np.round([s[1] for s in steps], 4))
      print("parallel rounds:", rounds, "instead of", n, "dependent steps")
      ```

      Mamba's scan is also **hardware-aware**, in the same spirit as FlashAttention from module 17. The full set of states is $N$ times bigger than the input (Mamba's benchmarks used $N = 16$ numbers per channel), so writing it to the GPU's large, slow main memory would be the bottleneck. Instead the kernel loads $\Delta$, $A$, $B$, $C$ into the small, fast on-chip memory, discretizes and scans there, and writes back only the outputs. For training, it recomputes the states during the backward pass instead of storing them.
    bridges: []
  - id: selective-state-spaces.s4
    title: What selection buys, and where it still falls short
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.selective-state-spaces
    markdown: |-
      The Mamba paper reported about 5× higher generation throughput than transformers of similar size, and a 3-billion-parameter Mamba that beat same-size transformers and matched transformers twice its size in language modeling. On the synthetic induction-heads task it extrapolated perfectly to million-token sequences, 4,000 times longer than it was trained on.

      Its generation memory is also flat. Each layer carries a fixed state of (channels × $N$) numbers, the same at token 100 as at token 100,000, where a transformer's KV cache keeps growing.

      :::mixup "A selective state can remember anything the model decides is important."
      Selection chooses *what to write*, but the state still has a fixed size. Hand it a phone book in the prompt and ask for one number: every entry looked equally worth keeping when it arrived. In a controlled NVIDIA study (Waleffe et al., 2024), 8B-parameter pure Mamba-style models matched or beat an equal transformer on many tasks but lagged on tasks that need copying or in-context lookup, such as five-shot MMLU and phone-book lookup.
      :::

      **Mamba-2** (Dao & Gu, 2024) simplified $A$ to a single number per head (a scalar times the identity). With that restriction, the selective SSM turns out to equal a form of masked linear attention, where the mask applies the products of $\bar{A}$ decays. The authors named this **state space duality (SSD)**. The payoff is practical: the layer can be computed mostly with matrix multiplications, which GPUs run fastest. They reported a core layer 2–8× faster than Mamba's scan, with room for states 8× larger or more.

      So if your coding assistant must quote exact identifiers from far back, run lookup tests before choosing a pure SSM. The next lesson shows the usual answer: keep a few attention layers.
    bridges: []
  - id: selective-state-spaces.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.selective-state-spaces
    markdown: Compute selective updates from step sizes, then decide what selection does for a filler-filled transcript, a long-context chatbot, and a phone-book lookup.
    takeaway: |-
      Mamba computes Δ, B, and C from each token, so a small step keeps the state and a large step overwrites it, like an RNN gate. That breaks the convolution view, so it trains with a hardware-aware parallel scan, and it keeps a fixed-size state.
  - id: selective-state-spaces.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.selective-state-spaces
    markdown: |-
      Selective state updates let the current input influence what is kept. A fixed-size memory avoids a growing token cache, but its ability to recall details must be tested.
