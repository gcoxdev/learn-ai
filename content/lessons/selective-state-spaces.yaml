assessment_families:
  - id: selective-state-spaces.base
    objective_ref: objective.selective-state-spaces
    task: base
    response_type: single_choice
    points: 1
    hint: A keep factor near 1 preserves the old state; near 0 it wipes it.
    remediation_scene: selective-state-spaces.s2
    variants:
      - id: selective-state-spaces.base.1
        prompt: What makes a state-space model selective here?
        options:
          - id: b
            text: Its weights are manually chosen after every token
          - id: c
            text: It stores all tokens without compression
          - id: a
            text: Some update quantities depend on the input
        answer: a
        feedback: Content can influence retention and processing.
        retired: true
      - id: selective-state-spaces.base.2
        prompt: In the toy update, a_t near zero does what to previous state?
        options:
          - id: c
            text: Doubles it
          - id: a
            text: Suppresses its contribution
          - id: b
            text: Always preserves it exactly
        answer: a
        feedback: The previous state is multiplied by a_t.
        retired: true
  - id: selective-state-spaces.transfer
    objective_ref: objective.selective-state-spaces
    task: transfer
    response_type: single_choice
    points: 1
    hint: Selection decides what to write, but the state's size stays fixed.
    remediation_scene: selective-state-spaces.s4
    variants:
      - id: selective-state-spaces.transfer.1
        prompt: Why does input dependence complicate a fixed convolution implementation?
        options:
          - id: c
            text: It removes every parallel algorithm
          - id: a
            text: The effective dynamics vary with the sequence content
          - id: b
            text: Convolution cannot multiply numbers
        answer: a
        feedback: A single time-invariant kernel no longer describes all updates.
        retired: true
      - id: selective-state-spaces.transfer.2
        prompt: Does fixed-size recurrent memory guarantee exact unlimited recall?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only with a long prompt
        answer: a
        feedback: Finite learned summaries can lose information.
        retired: true
  - id: selective-state-spaces.base.v2
    objective_ref: objective.selective-state-spaces
    task: base
    response_type: single_choice
    points: 1
    hint: "Trace Δ: the token sets Δ, Δ sets Ā = e^(ΔA), and Ā near 1 keeps the state while Ā near 0 overwrites it. Then ask what that does to the convolution kernel."
    remediation_scene: selective-state-spaces.s2
    variants:
      - id: selective-state-spaces.base.v2.1
        prompt: In Mamba's selective SSM, which quantities are computed from the current token?
        options:
          - id: b
            text: A fresh matrix A per token, while B and C stay fixed
          - id: a
            text: The step size Δ and the matrices B and C, while A stays fixed
          - id: c
            text: The readout C alone, so the state update matches S4's
        answer: a
        feedback: Δ, B, and C come from linear projections of the token. A is a fixed learned matrix, but its discretized form e^(ΔA) still changes per token because Δ does. If only C changed, the state couldn't choose what to keep.
      - id: selective-state-spaces.base.v2.2
        prompt: A token produces a very large step size Δ, with A = −1. What happens to the state?
        options:
          - id: a
            text: Ā is near 0, so the state is mostly replaced by this token
          - id: c
            text: Ā is near 1, so the state is kept and this token is ignored
          - id: b
            text: Ā is above 1, so the state grows larger with every token
        answer: a
        feedback: Ā = e^(−Δ) shrinks toward 0 as Δ grows, and the write weight 1 − Ā approaches 1. A tiny Δ is what keeps the state. Because A is negative, Ā stays between 0 and 1.
      - id: selective-state-spaces.base.v2.3
        prompt: Why can't a selective SSM be computed as one convolution the way S4 can?
        options:
          - id: c
            text: Its state grows with every token, so the kernel length has no fixed limit
          - id: b
            text: Softplus is nonlinear, so none of the computation can run in parallel
          - id: a
            text: An input's effect depends on the tokens in between, not just the distance
        answer: a
        feedback: The weight from input j to output t is a product of the Ā's of every token in between, which changes with content, so no single kernel exists. The state stays fixed-size, and the parallel scan still runs in parallel.
      - id: selective-state-spaces.base.v2.4
        prompt: What makes Mamba's scan "hardware-aware"?
        options:
          - id: b
            text: It saves every intermediate state to GPU main memory so the backward pass can reuse it
          - id: a
            text: It keeps the expanded states in fast on-chip memory and writes back only the outputs
          - id: c
            text: It replaces the recurrence with an FFT convolution that GPUs are designed to run
        answer: a
        feedback: The states are N times larger than the input, so the kernel avoids writing them to slow main memory and recomputes them in the backward pass instead. There is no FFT convolution for a selective SSM.
  - id: selective-state-spaces.transfer.v2
    objective_ref: objective.selective-state-spaces
    task: transfer
    response_type: single_choice
    points: 1
    hint: Selection controls what enters a fixed-size state. Ask whether the task needs a choice about what to keep, or exact recall of many items.
    remediation_scene: selective-state-spaces.s4
    variants:
      - id: selective-state-spaces.transfer.v2.1
        prompt: A transcription model reads speech full of fillers ("um", "you know"). Which mechanism lets a selective SSM keep the content words in its state?
        options:
          - id: a
            text: Filler tokens produce a small Δ, so they barely change the state
          - id: b
            text: Filler tokens produce a large Δ, so the state skips past them
          - id: c
            text: Filler tokens are masked out by the tokenizer before they arrive
        answer: a
        feedback: A small step keeps Ā near 1, so the filler hardly writes. A large step would do the opposite and overwrite the state with the filler. Nothing removes the fillers before the model sees them.
      - id: selective-state-spaces.transfer.v2.2
        prompt: A chatbot built on a pure Mamba model serves conversations of 2,000 and of 100,000 tokens. How does its per-conversation generation memory compare?
        options:
          - id: c
            text: It grows about 50 times, like a transformer's KV cache
          - id: a
            text: It is about the same, since each layer keeps a fixed state
          - id: b
            text: It grows about 7 times, since the state grows with log n
        answer: a
        feedback: Each layer carries a state of fixed size, so a longer conversation costs more time but not more state. A KV cache grows in proportion to the tokens. The log n in a parallel scan is its number of rounds, not the state's size.
      - id: selective-state-spaces.transfer.v2.3
        prompt: A team plans to replace its transformer with an equal-size pure Mamba model for a support bot that must quote exact order numbers from long pasted histories. What should they do first?
        options:
          - id: b
            text: Switch right away, since selection lets Mamba keep whichever details matter
          - id: c
            text: Rule Mamba out, since state-space models do poorly on language overall
          - id: a
            text: Run copying and lookup tests, where pure SSMs have lagged transformers
        answer: a
        feedback: Controlled studies found pure Mamba models match transformers on many language tasks but lag on copying and in-context lookup, exactly this bot's job. Selection chooses what to write, not how much fits, and Mamba is competitive on language in general.
      - id: selective-state-spaces.transfer.v2.4
        prompt: Mamba-2's layer runs 2–8× faster than Mamba's scan and allows larger states. Which change made that possible?
        options:
          - id: a
            text: Restricting A to one number per head, so the layer maps to matrix multiplications
          - id: b
            text: Making A depend on the input as well, so the model no longer needs a scan
          - id: c
            text: Removing selection from Δ, so the layer becomes a fixed convolution again
        answer: a
        feedback: With A a scalar times the identity, the selective SSM equals a masked form of linear attention (state space duality), which GPUs compute well with matrix multiplications. Mamba-2 keeps selection; it doesn't return to a fixed kernel.
  - id: selective-state-spaces.step
    objective_ref: objective.selective-state-spaces
    task: base
    response_type: numeric
    points: 1
    hint: "With A = −1, the keep factor is Ā = e^(−Δ). The new state is Ā × (old state) + (1 − Ā) × (input)."
    remediation_scene: selective-state-spaces.s2
    absolute_tolerance: 0.01
    variants:
      - id: selective-state-spaces.step.1
        prompt: "A selective SSM with A = −1 uses Ā = e^(−Δ) and h_new = Ā·h + (1 − Ā)·x. The token gives Δ = 0.693 (so e^(−Δ) = 0.5). With h = 6 and x = 2, what is h_new?"
        answer: 4
        feedback: "Ā = 0.5, so h_new = 0.5 × 6 + 0.5 × 2 = 3 + 1 = 4."
      - id: selective-state-spaces.step.2
        prompt: "A selective SSM with A = −1 uses Ā = e^(−Δ) and h_new = Ā·h + (1 − Ā)·x. A filler token gives Δ = 0.01. With h = 6 and x = 2, what is h_new? Give two decimal places."
        answer: 5.96
        feedback: "Ā = e^(−0.01) ≈ 0.990, so h_new ≈ 0.990 × 6 + 0.010 × 2 ≈ 5.96. The state barely moves."
      - id: selective-state-spaces.step.3
        prompt: "A selective SSM with A = −1 uses Ā = e^(−Δ) and h_new = Ā·h + (1 − Ā)·x. An important token gives Δ = 3. With h = 6 and x = 2, what is h_new? Give two decimal places."
        answer: 2.2
        feedback: "Ā = e^(−3) ≈ 0.0498, so h_new ≈ 0.0498 × 6 + 0.9502 × 2 ≈ 0.30 + 1.90 = 2.20. The state jumps most of the way to the new input."
      - id: selective-state-spaces.step.4
        prompt: "A selective SSM with A = −1 uses Ā = e^(−Δ) and h_new = Ā·h + (1 − Ā)·x. A token gives Δ = 1 and x = 0, with h = 10. What is h_new? Give two decimal places."
        answer: 3.68
        feedback: "Ā = e^(−1) ≈ 0.368, so h_new ≈ 3.68 + 0 = 3.68."
