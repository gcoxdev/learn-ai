schema_version: 0.2-draft
lesson:
  id: selective-state-spaces
  version: 0.1.0-draft
  title: Let the current input control what the state retains
  state: draft
  summary: Selective state-space models make selected dynamics input-dependent, enabling content-sensitive state
    updates; hardware-aware scans and fixed-size recurrent state create a different tradeoff from attention.
  slot: M19.5
  category: learning
  sources:
  - title: 'Mamba: Linear-Time Sequence Modeling with Selective State Spaces'
    url: https://arxiv.org/abs/2312.00752
objectives:
- id: objective.selective-state-spaces
  version: 1-draft
  statement: Selective state-space models make selected dynamics input-dependent, enabling content-sensitive state
    updates; hardware-aware scans and fixed-size recurrent state create a different tradeoff from attention.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - selective-state-spaces.base
  - selective-state-spaces.transfer
  prerequisites:
  - anyOf:
    - objective.state-space-sequences
scenes:
- id: selective-state-spaces.s1
  title: A fixed filter treats content uniformly
  type: explanation
  depth: intuition
  objective_refs:
  - objective.selective-state-spaces
  markdown: In a time-invariant recurrence, the same update rule applies regardless of whether an input is important.
    Selective models let input-derived quantities control parts of the state update or readout. This supports retaining
    some information and discarding other information based on content.
  text_mode: In a time-invariant recurrence, the same update rule applies regardless of whether an input is important.
    Selective models let input-derived quantities control parts of the state update or readout. This supports retaining
    some information and discarding other information based on content.
  bridges: []
- id: selective-state-spaces.s2
  title: Understand the gate-like effect
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.selective-state-spaces
  markdown: Consider a toy update h_t = a_t h_previous + b_t x_t. A value a_t near one retains more past state;
    near zero suppresses it. This illustrates selection intuitively but is not a complete Mamba block or a claim
    that every learned coefficient has this simple scalar interpretation.
  text_mode: Consider a toy update h_t = a_t h_previous + b_t x_t. A value a_t near one retains more past state;
    near zero suppresses it. This illustrates selection intuitively but is not a complete Mamba block or a claim
    that every learned coefficient has this simple scalar interpretation.
  bridges: []
- id: selective-state-spaces.s3
  title: Selection changes the execution options
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.selective-state-spaces
  markdown: Input-dependent dynamics prevent directly reusing one fixed convolution kernel for every sequence. Structured
    scan algorithms can parallelize compatible recurrences during training, while decoding updates recurrent state
    incrementally. Implementation details determine which intermediate tensors are materialized and how data move
    through hardware.
  text_mode: Input-dependent dynamics prevent directly reusing one fixed convolution kernel for every sequence.
    Structured scan algorithms can parallelize compatible recurrences during training, while decoding updates recurrent
    state incrementally. Implementation details determine which intermediate tensors are materialized and how data
    move through hardware.
  bridges: []
- id: selective-state-spaces.s4
  title: Measure memory and retrieval separately
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.selective-state-spaces
  markdown: A fixed-size recurrent state avoids a token-by-token cache growing with context at inference, but compresses
    history. Test exact recall, selective copying, language quality, and runtime. Strong performance on long sequences
    does not establish that every detail remains recoverable indefinitely.
  text_mode: A fixed-size recurrent state avoids a token-by-token cache growing with context at inference, but compresses
    history. Test exact recall, selective copying, language quality, and runtime. Strong performance on long sequences
    does not establish that every detail remains recoverable indefinitely.
  bridges: []
- id: selective-state-spaces.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.selective-state-spaces
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Selective state-space models make selected dynamics input-dependent, enabling content-sensitive state
    updates; hardware-aware scans and fixed-size recurrent state create a different tradeoff from attention.
