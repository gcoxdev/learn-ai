  version: 0.1.0-draft
  title: Transfer reasoning behavior and compare its operating cost
  state: draft
  summary: Reasoning distillation trains students on selected teacher behavior; compare accuracy, explanation quality,
    output length, latency, and training provenance at matched budgets.
  slot: M21.8
  category: learning
  minutes: 12
  sources:
