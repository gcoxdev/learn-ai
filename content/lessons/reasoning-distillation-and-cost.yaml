    url: https://arxiv.org/abs/2501.12948
  - title: Distilling Step-by-Step
    url: https://arxiv.org/abs/2305.02301
objectives:
- id: objective.reasoning-distillation-and-cost
  version: 1-draft
  statement: Reasoning distillation trains students on selected teacher behavior; compare accuracy, explanation
    quality, output length, latency, and training provenance at matched budgets.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - reasoning-distillation-and-cost.base
  - reasoning-distillation-and-cost.transfer
  prerequisites:
