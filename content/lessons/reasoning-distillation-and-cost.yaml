scenes:
- id: reasoning-distillation-and-cost.s1
  title: Build a supervised transfer dataset
  type: explanation
  depth: intuition
  objective_refs:
  - objective.reasoning-distillation-and-cost
  markdown: A teacher can generate problem solutions that are filtered for correctness and presentation before student
    training. Record whether targets contain full traces, concise answers, tool results, or probability distributions.
    These choices transfer different signals and can change how much the student generates at inference.
  text_mode: A teacher can generate problem solutions that are filtered for correctness and presentation before
    student training. Record whether targets contain full traces, concise answers, tool results, or probability
    distributions. These choices transfer different signals and can change how much the student generates at inference.
  bridges: []
- id: reasoning-distillation-and-cost.s2
  title: Capacity and architecture still matter
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reasoning-distillation-and-cost
  markdown: A smaller student does not become a copy of every teacher capability. It may learn frequent solution
    patterns yet fail on novel compositions, rare knowledge, or very long contexts. Different tokenizers and architectures
    also change the cost of reproducing a teacher’s response style.
  text_mode: A smaller student does not become a copy of every teacher capability. It may learn frequent solution
    patterns yet fail on novel compositions, rare knowledge, or very long contexts. Different tokenizers and architectures
    also change the cost of reproducing a teacher’s response style.
  bridges: []
- id: reasoning-distillation-and-cost.s3
  title: Compare equal useful budgets
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reasoning-distillation-and-cost
  markdown: Suppose a student answers correctly more often only when allowed ten times as many generated tokens.
    That may still be useful, but it is a different operating point. Measure accuracy against total latency or cost,
    including verification and discarded samples, rather than reporting quality without its resource conditions.
  text_mode: Suppose a student answers correctly more often only when allowed ten times as many generated tokens.
    That may still be useful, but it is a different operating point. Measure accuracy against total latency or cost,
    including verification and discarded samples, rather than reporting quality without its resource conditions.
  bridges: []
- id: reasoning-distillation-and-cost.s4
  title: Preserve independent evidence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reasoning-distillation-and-cost
  markdown: Avoid evaluating on the teacher-generated training problems or close variants. Inspect explanation validity,
    unnecessary verbosity, and failures under new tasks. Distillation can improve deployment options while inheriting
    teacher errors and selection biases; report which capabilities were actually tested.
  text_mode: Avoid evaluating on the teacher-generated training problems or close variants. Inspect explanation
    validity, unnecessary verbosity, and failures under new tasks. Distillation can improve deployment options while
    inheriting teacher errors and selection biases; report which capabilities were actually tested.
  bridges: []
- id: reasoning-distillation-and-cost.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.reasoning-distillation-and-cost
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: reasoning-distillation-and-cost.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.reasoning-distillation-and-cost
  markdown: Reasoning distillation trains students on selected teacher behavior; compare accuracy, explanation quality,
    output length, latency, and training provenance at matched budgets.
  text_mode: Reasoning distillation trains students on selected teacher behavior; compare accuracy, explanation
    quality, output length, latency, and training provenance at matched budgets.
