assessment_families:
- id: reasoning-distillation-and-cost.base
  objective_ref: objective.reasoning-distillation-and-cost
  task: base
  response_type: single_choice
  points: 1
  hint: 'Capacity and architecture still matter: trace the inputs, operation, and result before choosing.'
  remediation_scene: reasoning-distillation-and-cost.s2
  variants:
  - id: reasoning-distillation-and-cost.base.1
    prompt: Does sequence distillation copy every teacher capability?
    options:
    - id: c
      text: Only if the teacher generated many words
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: The student learns from a limited training signal under its own capacity.
  - id: reasoning-distillation-and-cost.base.2
    prompt: Why record whether targets contain traces or only answers?
    options:
    - id: a
      text: They supervise different output behavior and costs
    - id: b
      text: They always produce identical training
    - id: c
      text: Only file compression changes
    answer: a
    feedback: Target format changes what the student is asked to predict.
- id: reasoning-distillation-and-cost.transfer
  objective_ref: objective.reasoning-distillation-and-cost
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Preserve independent evidence: trace the inputs, operation, and result before choosing.'
  remediation_scene: reasoning-distillation-and-cost.s4
  variants:
  - id: reasoning-distillation-and-cost.transfer.1
    prompt: Higher accuracy requires ten times more tokens. How should it be reported?
    options:
    - id: a
      text: As a quality-cost operating point with the full budget
    - id: b
      text: As a free accuracy improvement
    - id: c
      text: Without mentioning generation length
    answer: a
    feedback: Resource conditions are part of the result.
  - id: reasoning-distillation-and-cost.transfer.2
    prompt: What should independent evaluation avoid?
    options:
    - id: b
      text: All fresh problems
    - id: c
      text: Every concise answer
    - id: a
      text: Teacher-generated training problems and close leakage variants
    answer: a
    feedback: Evaluation needs evidence beyond fitting the transfer dataset.
