assessment_families:
  - id: agi-consciousness-and-uncertainty.base
    objective_ref: objective.agi-consciousness-and-uncertainty
    task: base
    response_type: single_choice
    points: 1
    hint: 'Separate competence from experience: trace the inputs, operation, and result before choosing.'
    remediation_scene: agi-consciousness-and-uncertainty.s2
    variants:
      - id: agi-consciousness-and-uncertainty.base.1
        prompt: Why define AGI explicitly?
        options:
          - id: c
            text: Definitions replace all evaluation
          - id: a
            text: The term is used for different capability claims
          - id: b
            text: Every speaker already means the same thing
        answer: a
        feedback: Clear criteria make evidence assessable.
        retired: true
      - id: agi-consciousness-and-uncertainty.base.2
        prompt: Does fluent self-report settle subjective experience?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if the statement is repeated
        answer: a
        feedback: Behavioral reports alone are not a decisive consciousness test.
        retired: true
  - id: agi-consciousness-and-uncertainty.transfer
    objective_ref: objective.agi-consciousness-and-uncertainty
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Communicate uncertainty constructively: trace the inputs, operation, and result before choosing.'
    remediation_scene: agi-consciousness-and-uncertainty.s4
    variants:
      - id: agi-consciousness-and-uncertainty.transfer.1
        prompt: Are capability and moral status identical questions?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only for digital systems
        answer: a
        feedback: They concern different properties and judgments.
        retired: true
      - id: agi-consciousness-and-uncertainty.transfer.2
        prompt: What makes an uncertain claim scientifically useful?
        options:
          - id: b
            text: Absolute certainty without a test
          - id: c
            text: A more dramatic label
          - id: a
            text: Stated evidence, assumptions, limits, and possible disconfirming observations
        answer: a
        feedback: Explicit uncertainty supports better investigation.
        retired: true
  - id: agi-consciousness-and-uncertainty.base.v2
    objective_ref: objective.agi-consciousness-and-uncertainty
    task: base
    response_type: single_choice
    points: 1
    hint: 'Name the question the evidence bears on: behavior (capability), how it computes (mechanism), felt experience (consciousness), or how it should be treated (moral status).'
    remediation_scene: agi-consciousness-and-uncertainty.room
    variants:
      - id: agi-consciousness-and-uncertainty.base.v2.1
        prompt: In five-minute text chats, judges pick a chatbot as the human 73% of the time. What does this most directly show?
        options:
          - id: b
            text: It understands its conversations in the way people do
          - id: a
            text: Its short text replies are hard to tell from a person's
          - id: c
            text: It meets most definitions of artificial general intelligence
        answer: a
        feedback: The test measures whether judges can tell the replies apart, and in this setup they couldn't. Whether that implies understanding is exactly what the Chinese Room disputes, and most AGI definitions ask about far more than chat.
      - id: agi-consciousness-and-uncertainty.base.v2.2
        prompt: 'A critic of Searle says: "The man doesn''t understand Chinese, but the whole room (man, rulebook, and paper) does." Which reply is this?'
        options:
          - id: a
            text: The systems reply
          - id: b
            text: The robot reply
          - id: c
            text: The other minds reply
        answer: a
        feedback: Crediting the whole system rather than the man is the systems reply; Searle answered by having the man memorize the rulebook. The robot reply adds sensors, and the other minds reply appeals to how we judge other people.
      - id: agi-consciousness-and-uncertainty.base.v2.3
        prompt: A chatbot writes, "I feel lonely when no one talks to me." Why does this statement settle little about whether it feels anything?
        options:
          - id: c
            text: A report of loneliness would need a matching emotion benchmark score
          - id: b
            text: Consciousness requires a biological brain, so the report must be false
          - id: a
            text: Trained on human writing, it would produce such sentences either way
        answer: a
        feedback: A model trained on human text describes feelings fluently whether or not anything is felt, so the words can't separate the two cases. The biological view is one contested theory, not a settled fact, and no benchmark measures experience.
      - id: agi-consciousness-and-uncertainty.base.v2.4
        prompt: In the Levels of AGI framework, what is a general system that performs at or above the 90th percentile of skilled adults called?
        options:
          - id: b
            text: Competent AGI
          - id: a
            text: Expert AGI
          - id: c
            text: Superhuman AGI
        answer: a
        feedback: Expert is the 90th percentile. Competent starts at the 50th, and Superhuman means outperforming all humans.
  - id: agi-consciousness-and-uncertainty.transfer.v2
    objective_ref: objective.agi-consciousness-and-uncertainty
    task: transfer
    response_type: single_choice
    points: 1
    hint: Pin down the definition or theory a claim relies on before judging it, and separate what was observed from what was inferred.
    remediation_scene: agi-consciousness-and-uncertainty.s2
    variants:
      - id: agi-consciousness-and-uncertainty.transfer.v2.1
        prompt: A company announces it has "achieved AGI" because its model passed a bar exam and a medical licensing exam. What should you ask first?
        options:
          - id: a
            text: Which definition of AGI it uses, and what those exams leave out
          - id: b
            text: How many parameters the model has compared with its rivals
          - id: c
            text: Whether the model took the exams under standard time limits
        answer: a
        feedback: Two exams show narrow expert performance; whether that counts as AGI depends on the definition (breadth, economic value, or learning new skills). Size and exam conditions don't answer that.
      - id: agi-consciousness-and-uncertainty.transfer.v2.2
        prompt: A 2023 survey of AI researchers gives 50% odds of machines outperforming humans at every task by 2047; the 2022 survey said 2060. How should you use these numbers?
        options:
          - id: c
            text: As evidence that progress sped up by exactly 13 years
          - id: a
            text: As a snapshot of experts' uncertain beliefs, which shift
          - id: b
            text: As a measured estimate, like a census count, good to a few years
        answer: a
        feedback: A survey reports what researchers believe, with a wide spread between individuals and sensitivity to wording. The 13-year shift shows opinion moved, not that the true timeline moved by that amount.
      - id: agi-consciousness-and-uncertainty.transfer.v2.3
        prompt: A report checks AI systems against indicator properties drawn from theories such as global workspace theory. What assumption makes this approach possible?
        options:
          - id: b
            text: That only living brains can be conscious, whatever they compute
          - id: a
            text: That the right kind of computation could suffice for consciousness
          - id: c
            text: That any system which behaves consciously is thereby conscious
        answer: a
        feedback: Butlin, Long and colleagues assumed computational functionalism, so computational features could count as evidence. A biological view would rule the method out, and they looked at internal architecture, not behavior alone.
      - id: agi-consciousness-and-uncertainty.transfer.v2.4
        prompt: 'A debate jumps from "It can do most of my job" to "So switching it off would be wrong." Which two questions are being blurred?'
        options:
          - id: c
            text: Consciousness and mechanism
          - id: b
            text: Mechanism and capability
          - id: a
            text: Capability and moral status
        answer: a
        feedback: Doing a job is capability; whether switching it off wrongs it is moral status. Getting from one to the other needs claims about consciousness and a moral theory, and neither is settled.
