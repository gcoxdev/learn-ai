schema_version: 0.2-draft
lesson:
  id: agi-consciousness-and-uncertainty
  version: 0.4.0-draft
  title: Discuss broad intelligence and experience without overstating evidence
  state: draft
  summary: In 2025, people judged a chatbot to be the human more often than the actual humans. Does that make it intelligent, general, or conscious? Meet the arguments on every side.
  slot: M29.8
  category: learning
  sources:
    - title: Computing Machinery and Intelligence (Turing, 1950)
      url: https://academic.oup.com/mind/article/LIX/236/433/986238
    - title: Large Language Models Pass the Turing Test (Jones & Bergen, 2025)
      url: https://arxiv.org/abs/2503.23674
    - title: Minds, Brains, and Programs (Searle, 1980)
      url: https://doi.org/10.1017/S0140525X00005756
    - title: The Chinese Room Argument (Stanford Encyclopedia of Philosophy)
      url: https://plato.stanford.edu/entries/chinese-room/
    - title: "Universal Intelligence: A Definition of Machine Intelligence (Legg & Hutter, 2007)"
      url: https://arxiv.org/abs/0712.3329
    - title: On the Measure of Intelligence (Chollet, 2019)
      url: https://arxiv.org/abs/1911.01547
    - title: "Levels of AGI: Operationalizing Progress on the Path to AGI (Morris et al., 2023)"
      url: https://arxiv.org/abs/2311.02462
    - title: OpenAI Charter (2018)
      url: https://openai.com/charter/
    - title: Thousands of AI Authors on the Future of AI (Grace et al., 2024)
      url: https://arxiv.org/abs/2401.02843
    - title: "Consciousness in Artificial Intelligence: Insights from the Science of Consciousness (Butlin, Long et al., 2023)"
      url: https://arxiv.org/abs/2308.08708
objectives:
  - id: objective.agi-consciousness-and-uncertainty
    version: 2-draft
    statement: AGI and consciousness claims require explicit definitions and carefully bounded evidence; broad task competence, self-reports, subjective experience, and moral status are distinct questions.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - agi-consciousness-and-uncertainty.base.v2
      - agi-consciousness-and-uncertainty.transfer.v2
    prerequisites:
      - anyOf:
          - objective.reasoning-and-explanations
      - anyOf:
          - objective.causal-evaluation-and-negative-results
scenes:
  - id: agi-consciousness-and-uncertainty.s1
    title: More human than the humans
    type: explanation
    depth: intuition
    objective_refs:
      - objective.agi-consciousness-and-uncertainty
    markdown: |-
      You met Alan Turing's 1950 imitation game in module 1: a judge exchanges typed messages with a hidden human and a hidden machine, then says which is which. For decades no program came close under careful conditions.

      In 2025, Cameron Jones and Benjamin Bergen at UC San Diego ran the three-way version: each judge chatted for five minutes with a person and a machine at once, then picked the human.

      | Machine witness | Judged to be the human |
      | --- | ---: |
      | GPT-4.5, told to adopt a shy, slang-using young persona | 73% |
      | LLaMa-3.1-405B, with the same persona | 56% |
      | ELIZA, the 1966 pattern-matching program | 23% |
      | GPT-4o, with no persona | 21% |

      At 73%, judges picked GPT-4.5 *more* often than the real person it was paired with.

      :::predict So has AI passed the Turing test, and does that mean it thinks?
      By Turing's own criterion (judges can't reliably tell), this setup was passed. What that *means* is where people disagree. Some say behavior is the best evidence we ever have of a mind. Others note that success depended on a carefully written persona prompt, that five minutes is short, and that fooling people isn't understanding.
      :::
    bridges: []
  - id: agi-consciousness-and-uncertainty.room
    title: The man in the Chinese room
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.agi-consciousness-and-uncertainty
    markdown: |-
      In 1980 the philosopher John Searle published the most famous argument that passing such a test wouldn't be enough. Imagine a man who knows no Chinese locked in a room with a huge rulebook written in English. Chinese questions are slipped under the door. Following the rules, he slips out replies that native speakers find perfect. He understands nothing. The view Searle attacked, that the right program is enough for a mind, he called **strong AI**. His conclusion: running a program, however good its outputs, isn't enough for understanding, because a program only shuffles symbols by their shapes.

      The argument drew dozens of replies. The main ones, with Searle's answers:

      | Reply | The claim | Searle's response |
      | --- | --- | --- |
      | **Systems reply** | The man doesn't understand, but the whole system (man, rulebook, paper) does | Let him memorize the rulebook and work outdoors: he *is* the system, and still understands nothing |
      | **Robot reply** | Put the program in a robot with cameras, so symbols connect to the world | Camera input is just more symbols under the door |
      | **Brain simulator reply** | Make the program simulate a Chinese speaker's neurons | Simulating the brain's formal structure misses its causal powers |
      | **Other minds reply** | We credit other people with understanding from behavior alone | The question is what understanding *is*, not how we detect it |

      After four decades there is no consensus: many philosophers think some reply succeeds, and many side with Searle. A language model, mapping input tokens to output tokens by learned rules, is a close cousin of the room, which makes the argument newly pressing.
    bridges: []
  - id: agi-consciousness-and-uncertainty.s2
    title: Four definitions of AGI
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.agi-consciousness-and-uncertainty
    markdown: |-
      **Artificial general intelligence** (AGI) usually means AI as capable as people across a wide range of tasks. The trouble is "capable" and "wide," and serious definitions measure different things:

      | Source | Definition | What it measures |
      | --- | --- | --- |
      | Legg & Hutter (2007) | An agent's ability to achieve goals in a wide range of environments | Breadth of success |
      | OpenAI Charter (2018) | Highly autonomous systems that outperform humans at most economically valuable work | Economic substitution |
      | Chollet (2019) | Efficiency at acquiring new skills from limited experience | Learning speed; tested with his ARC puzzles |
      | Morris et al., Google DeepMind (2023), "Levels of AGI" | A grid of performance × generality | Percentile against skilled adults |

      The Levels of AGI paper grades performance as Emerging (equal to or somewhat better than an unskilled human), Competent (at least the 50th percentile of skilled adults), Expert (90th), Virtuoso (99th), and Superhuman (better than all humans), each for narrow or general task sets. Its authors rated 2023 chatbots such as ChatGPT as "Emerging AGI."

      :::predict A system beats 90% of skilled adults at a wide range of office tasks, but can't learn a new board game from its rulebook any faster than a model trained from scratch. Is it AGI?
      Under Morris et al., it's close to Expert AGI on those tasks. Under the OpenAI Charter, it might qualify if those tasks cover most valuable work. Under Chollet's definition it scores poorly, because it learns new skills slowly. Same system, three verdicts: ask which definition a headline uses before arguing about it.
      :::
    bridges: []
  - id: agi-consciousness-and-uncertainty.s4
    title: Forecasts with honest error bars
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.agi-consciousness-and-uncertainty
    markdown: |-
      "Machines will be capable, within twenty years, of doing any work a man can do." Herbert Simon, a founder of AI and later a Nobel laureate in economics, wrote that in 1965. Confident AI forecasts have a long, humbling history.

      The largest survey of AI researchers so far (Grace et al., 2024) asked 2,778 authors of papers at top AI conferences, in late 2023, when machines would be able to do every task better and more cheaply than human workers. The aggregate forecast gave a 10% chance by 2027 and a 50% chance by 2047; the same question in 2022 had given 50% by 2060. Individual answers ranged enormously, and wording mattered: full automation of every *occupation* reached 50% only by 2116.

      To read any forecast well, look for the spread (the 10% and 90% dates), not just the median; check the exact wording; and remember it measures what experts *believe*, with no track record to score it against. A median moving 13 years earlier tells you opinion shifted, not that the future did.
    bridges: []
  - id: agi-consciousness-and-uncertainty.s3
    title: Could a machine feel anything?
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.agi-consciousness-and-uncertainty
    markdown: |-
      In June 2022, Google engineer Blake Lemoine said publicly that LaMDA, a Google chatbot, was sentient, citing conversations in which it described its feelings. Google disagreed and later fired him. The episode showed why **self-reports** settle little: a model trained on vast amounts of human writing will describe feelings fluently whether or not anything is felt.

      **Consciousness** here means subjective experience: there is *something it is like* to be the system. In 2023, researchers led by Patrick Butlin and Robert Long took a different route. They assumed, as a working hypothesis, **computational functionalism**: the view that the right kind of computation would be enough for consciousness. They drew indicator properties from scientific theories of consciousness, such as global workspace theory, and checked AI systems against them. Their conclusion: no current system was a strong candidate, but there were no obvious technical barriers to building systems that satisfy many of the indicators.

      Serious views still diverge:

      | View | Machine consciousness is... |
      | --- | --- |
      | Computational functionalism | Possible, if the system computes in the right way |
      | Biological views (Searle; Anil Seth, among others) | Unlikely without the right biology, such as a living body regulating itself |
      | Integrated information theory (Giulio Tononi) | A matter of physical causal structure, so software on conventional chips would have very little, however it behaves |

      :::mixup "If it's intelligent enough, it must be conscious, and if it's conscious, it must deserve rights."
      These are four separate questions. **Capability**: what can it do? **Mechanism**: how does it compute? **Consciousness**: does it experience anything? **Moral status**: how should it be treated? Evidence about one bears on the others only through a theory, and the theories disagree. Some labs now research "model welfare" because the last two questions can't yet be answered or safely ignored.
      :::
    bridges: []
  - id: agi-consciousness-and-uncertainty.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.agi-consciousness-and-uncertainty
    markdown: A Turing-test headline, a reply to Searle, a lonely chatbot, an AGI press release, a researcher survey, and a debate about switching a model off test whether you can tell which question each piece of evidence answers.
    takeaway: |-
      Passing for human, being generally capable, and having experiences are different claims. Ask which definition or theory a claim assumes, separate what was observed from what was inferred, and read forecasts by their spread and wording.
  - id: agi-consciousness-and-uncertainty.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.agi-consciousness-and-uncertainty
    markdown: |-
      Broad capability, internal computation, subjective experience, and moral status are different questions. Define each claim and distinguish observations from uncertain inferences.
