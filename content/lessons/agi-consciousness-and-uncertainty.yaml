schema_version: 0.2-draft
lesson:
  id: agi-consciousness-and-uncertainty
  version: 0.1.0-draft
  title: Discuss broad intelligence and experience without overstating evidence
  state: draft
  summary: AGI and consciousness claims require explicit definitions and carefully bounded evidence; broad task
    competence, self-reports, subjective experience, and moral status are distinct questions.
  slot: M29.8
  category: learning
  sources:
  - title: Consciousness in Artificial Intelligence
    url: https://arxiv.org/abs/2308.08708
  - title: Levels of AGI
    url: https://arxiv.org/abs/2311.02462
objectives:
- id: objective.agi-consciousness-and-uncertainty
  version: 1-draft
  statement: AGI and consciousness claims require explicit definitions and carefully bounded evidence; broad task
    competence, self-reports, subjective experience, and moral status are distinct questions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - agi-consciousness-and-uncertainty.base
  - agi-consciousness-and-uncertainty.transfer
  prerequisites:
  - anyOf:
    - objective.reasoning-and-explanations
  - anyOf:
    - objective.causal-evaluation-and-negative-results
scenes:
- id: agi-consciousness-and-uncertainty.s1
  title: Define generality before measuring it
  type: explanation
  depth: intuition
  objective_refs:
  - objective.agi-consciousness-and-uncertainty
  markdown: AGI is used for different ideas, from broad human-level task performance to economically significant
    autonomy or flexible learning. A benchmark result cannot resolve a claim whose definition shifts during discussion.
    State task coverage, adaptation demands, resources, and failure conditions.
  text_mode: AGI is used for different ideas, from broad human-level task performance to economically significant
    autonomy or flexible learning. A benchmark result cannot resolve a claim whose definition shifts during discussion.
    State task coverage, adaptation demands, resources, and failure conditions.
  bridges: []
- id: agi-consciousness-and-uncertainty.s2
  title: Separate competence from experience
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agi-consciousness-and-uncertainty
  markdown: A system can produce fluent self-descriptions or solve difficult problems without those observations
    settling whether it has subjective experience. Consciousness research includes competing theories and proposed
    indicators. Neither conversational style nor one architectural feature currently provides a universally accepted
    decisive test.
  text_mode: A system can produce fluent self-descriptions or solve difficult problems without those observations
    settling whether it has subjective experience. Consciousness research includes competing theories and proposed
    indicators. Neither conversational style nor one architectural feature currently provides a universally accepted
    decisive test.
  bridges: []
- id: agi-consciousness-and-uncertainty.s3
  title: Keep distinct questions distinct
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agi-consciousness-and-uncertainty
  markdown: Capability concerns what the system can do. Mechanistic explanation concerns how it computes. Consciousness
    concerns experience, while moral status concerns how an entity should be treated. Evidence may inform several
    questions without making them logically equivalent.
  text_mode: Capability concerns what the system can do. Mechanistic explanation concerns how it computes. Consciousness
    concerns experience, while moral status concerns how an entity should be treated. Evidence may inform several
    questions without making them logically equivalent.
  bridges: []
- id: agi-consciousness-and-uncertainty.s4
  title: Communicate uncertainty constructively
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agi-consciousness-and-uncertainty
  markdown: Identify observations, theory-dependent inferences, unknowns, and what evidence could change a conclusion.
    Avoid presenting forecasts or marketing labels as settled facts. A careful discussion can acknowledge meaningful
    progress and unresolved questions without requiring either certainty of experience or certainty of its absence.
  text_mode: Identify observations, theory-dependent inferences, unknowns, and what evidence could change a conclusion.
    Avoid presenting forecasts or marketing labels as settled facts. A careful discussion can acknowledge meaningful
    progress and unresolved questions without requiring either certainty of experience or certainty of its absence.
  bridges: []
- id: agi-consciousness-and-uncertainty.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.agi-consciousness-and-uncertainty
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: AGI and consciousness claims require explicit definitions and carefully bounded evidence; broad task
    competence, self-reports, subjective experience, and moral status are distinct questions.
- id: agi-consciousness-and-uncertainty.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.agi-consciousness-and-uncertainty
  markdown: AGI and consciousness claims require explicit definitions and carefully bounded evidence; broad task
    competence, self-reports, subjective experience, and moral status are distinct questions.
  text_mode: AGI and consciousness claims require explicit definitions and carefully bounded evidence; broad task
    competence, self-reports, subjective experience, and moral status are distinct questions.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - agi-consciousness-and-uncertainty.s1
    - agi-consciousness-and-uncertainty.s2
    - agi-consciousness-and-uncertainty.s3
    - agi-consciousness-and-uncertainty.s4
    - agi-consciousness-and-uncertainty.check
    gate_refs:
