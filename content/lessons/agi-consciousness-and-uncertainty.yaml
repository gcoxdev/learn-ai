assessment_families:
- id: agi-consciousness-and-uncertainty.base
  objective_ref: objective.agi-consciousness-and-uncertainty
  task: base
  response_type: single_choice
  points: 1
  hint: 'Separate competence from experience: trace the inputs, operation, and result before choosing.'
  remediation_scene: agi-consciousness-and-uncertainty.s2
  variants:
  - id: agi-consciousness-and-uncertainty.base.1
    prompt: Why define AGI explicitly?
    options:
    - id: c
      text: Definitions replace all evaluation
    - id: a
      text: The term is used for different capability claims
    - id: b
      text: Every speaker already means the same thing
    answer: a
    feedback: Clear criteria make evidence assessable.
  - id: agi-consciousness-and-uncertainty.base.2
    prompt: Does fluent self-report settle subjective experience?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if the statement is repeated
    answer: a
    feedback: Behavioral reports alone are not a decisive consciousness test.
- id: agi-consciousness-and-uncertainty.transfer
  objective_ref: objective.agi-consciousness-and-uncertainty
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Communicate uncertainty constructively: trace the inputs, operation, and result before choosing.'
  remediation_scene: agi-consciousness-and-uncertainty.s4
  variants:
  - id: agi-consciousness-and-uncertainty.transfer.1
    prompt: Are capability and moral status identical questions?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only for digital systems
    answer: a
    feedback: They concern different properties and judgments.
  - id: agi-consciousness-and-uncertainty.transfer.2
    prompt: What makes an uncertain claim scientifically useful?
    options:
    - id: b
      text: Absolute certainty without a test
    - id: c
      text: A more dramatic label
    - id: a
      text: Stated evidence, assumptions, limits, and possible disconfirming observations
    answer: a
    feedback: Explicit uncertainty supports better investigation.
