schema_version: 0.2-draft
lesson:
  id: attention
  version: 0.1.0-draft
  title: 'Attention: queries, keys, and values'
  state: draft
  summary: Distinguish query/key scoring from the weighted combination of value vectors.
  slot: M15.2
  category: learning
  minutes: 14
  sources:
  - title: Dive into Deep Learning — queries, keys, and values
    url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/queries-keys-values.html
  - title: Attention Is All You Need
    url: https://arxiv.org/abs/1706.03762
objectives:
- id: objective.attention
  version: 1-draft
  statement: Distinguish query/key scoring from the weighted combination of value vectors.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - attention.base
  - attention.transfer
  prerequisites:
  - anyOf:
    - objective.embeddings
  - anyOf:
    - objective.vectors
scenes:
- title: Ask what information this position needs
  markdown: 'Consider “the bird rested because it was tired”. To update the representation at “it”, the model can
    combine information from other positions. Attention provides a learned mechanism for that combination.


    A query represents the current position for scoring. Keys represent candidate positions for comparison. Values
    provide the information to be combined. These names describe computational roles, not literal questions and
    answers in English.'
  id: attention.s1
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attention
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Make one score for each candidate
  markdown: 'In a small dot-product example, let the query be [1, 0]. Candidate keys [2, 0] and [0, 2] produce scores
    2 and 0. Changing the query to [0, 1] reverses which key scores higher.


    Real attention usually learns projections that construct queries, keys, and values from representations. The
    example starts after those projections and uses invented numbers so you can inspect the operation.'
  bridges:
  - vectors
  id: attention.s2
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attention
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Scores decide how much; values decide what
  markdown: 'Suppose scoring and normalization produce weights 0.75 and 0.25. Let the corresponding values be [4,
    0] and [0, 8]. The attention output is 0.75 × [4, 0] + 0.25 × [0, 8] = [3, 2].


    The weighted sum uses values, not keys. If the first value changes while queries and keys stay fixed, the output
    can change even though the weights stay the same.'
  type: table
  columns:
  - Candidate
  - Weight
  - Value
  - Contribution
  rows:
  - - A
    - 0.75
    - '[4, 0]'
    - '[3, 0]'
  - - B
    - 0.25
    - '[0, 8]'
    - '[0, 2]'
  id: attention.s3
  depth: mechanics
  objective_refs:
  - objective.attention
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Self-attention and cross-attention
  markdown: 'In self-attention, queries, keys, and values are constructed from the same sequence of representations.
    Different projections still give them different roles. In cross-attention, queries come from one source while
    keys and values come from another.


    For example, an image-generating system can condition visual representations on representations of a text prompt.
    That introduces information from another source; it does not turn the attention output directly into vocabulary
    probabilities.'
  id: attention.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attention
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Avoid two tempting shortcuts
  markdown: 'First, attention is generally a weighted combination, not necessarily a hard choice of exactly one
    token. Second, a weight is not a complete explanation of why a model made a decision. Other heads, layers, residual
    paths, and nonlinear transformations also contribute.


    You now know the roles of Q, K, and V. The next lesson supplies the missing scoring details: scaling, softmax
    normalization, and which positions are allowed to participate.'
  id: attention.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attention
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- id: attention.extension-roles-before-arithmetic
  title: Rehearse the three roles before calculating
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attention
  markdown: 'An embedding is a list of numbers representing an item. Attention starts with such lists and makes
    three kinds of vectors through learned transformations. A query is used to ask which candidates match the current
    position; keys are the candidates used for scoring; values are the information that will be mixed. These are
    numerical roles, not English questions and answers. For a book analogy, compare a search request with catalog
    descriptions to choose which book contents to read. The analogy stops at the computation: actual attention combines
    numerical vectors rather than opening literal books.'
  text_mode: 'An embedding is a list of numbers representing an item. Attention starts with such lists and makes
    three kinds of vectors through learned transformations. A query is used to ask which candidates match the current
    position; keys are the candidates used for scoring; values are the information that will be mixed. These are
    numerical roles, not English questions and answers. For a book analogy, compare a search request with catalog
    descriptions to choose which book contents to read. The analogy stops at the computation: actual attention combines
    numerical vectors rather than opening literal books.'
  bridges:
  - vectors
  - matrices-tensors
- id: attention.extension-changed-values
  title: Change what is carried without changing the scores
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attention
  markdown: 'Suppose the scoring step has already produced mixing weights 0.75 and 0.25. Use value vectors [4,0]
    and [0,8]. Multiply each vector by its weight, entry by entry: 0.75 × [4,0] = [3,0], and 0.25 × [0,8] = [0,2].
    Add corresponding entries to get [3,2]. Now replace the second value with [0,4] while keeping the scores fixed.
    The output becomes [3,1]. The choice of how much to mix stayed the same; the information being mixed changed.
    This separates the role of keys from the role of values.'
  text_mode: 'Suppose the scoring step has already produced mixing weights 0.75 and 0.25. Use value vectors [4,0]
    and [0,8]. Multiply each vector by its weight, entry by entry: 0.75 × [4,0] = [3,0], and 0.25 × [0,8] = [0,2].
    Add corresponding entries to get [3,2]. Now replace the second value with [0,4] while keeping the scores fixed.
    The output becomes [3,1]. The choice of how much to mix stayed the same; the information being mixed changed.
    This separates the role of keys from the role of values.'
  bridges:
  - arithmetic
  - vectors
- id: attention.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.attention
  markdown: Use a fresh example to check what you can explain. Hints remain available for practice.
  text_mode: Labeled controls and untimed feedback.
  takeaway: Queries and keys help compute how strongly to weight candidates. Values supply the vectors that are
    mixed. Keep “how much” separate from “what information”.
- id: attention.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.attention
  markdown: Queries and keys help compute how strongly to weight candidates. Values supply the vectors that are
    mixed. Keep “how much” separate from “what information”.
  text_mode: Queries and keys help compute how strongly to weight candidates. Values supply the vectors that are
    mixed. Keep “how much” separate from “what information”.
