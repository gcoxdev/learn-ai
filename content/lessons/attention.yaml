assessment_families:
- response_type: single_choice
  hint: Queries and keys produce compatibility scores. The final mixture uses the value vectors.
  variants:
  - prompt: In an attention head, which objects are combined using the normalized attention weights?
    options:
    - id: a
      text: Vocabulary IDs interpreted as probabilities.
    - id: b
      text: The attention weights alone, without any values.
    - id: answer
      text: Value vectors.
    answer: answer
    feedback: The weights specify a weighted sum of value vectors. Token IDs and vocabulary probabilities belong
      to other parts of the model.
    id: attention.base.1
  - prompt: A query [1, 0] is compared by dot product with keys [3, 1] and [0, 2]. Which raw score is higher?
    options:
    - id: b
      text: Both scores are automatically 0.5.
    - id: answer
      text: The first key’s score, 3.
    - id: a
      text: The second key’s score, 2.
    answer: answer
    feedback: The dot products are 1 × 3 + 0 × 1 = 3 and 1 × 0 + 0 × 2 = 0. These raw scores still need the
      chosen normalization.
    id: attention.base.2
  id: attention.base
  objective_ref: objective.attention
  task: base
  points: 1
  remediation_scene: attention.s1
- response_type: single_choice
  hint: Hold queries and keys fixed, then consider what changing the values does to their weighted sum.
  variants:
  - prompt: Attention weights stay [0.5, 0.5]. Values change from [2, 0] and [0, 2] to [4, 0] and [0, 2]. What
      happens?
    options:
    - id: b
      text: The token IDs are necessarily retrained.
    - id: answer
      text: The output changes from [1, 1] to [2, 1].
    - id: a
      text: The output must stay [1, 1] because the weights are unchanged.
    answer: answer
    feedback: Fixed weights do not imply a fixed output when the values change. Half of [4, 0] plus half of
      [0, 2] is [2, 1].
    id: attention.transfer.1
  - prompt: An image representation supplies queries while text representations supply keys and values. What
      kind of attention is this?
    options:
    - id: answer
      text: Cross-attention between different representation sources.
    - id: a
      text: Self-attention over one source by definition.
    - id: b
      text: A guarantee that every generated object matches the prompt.
    answer: answer
    feedback: The source of queries differs from the source of keys and values, which makes this cross-attention.
      Conditioning is a mechanism, not a guarantee of perfect output.
    id: attention.transfer.2
  id: attention.transfer
  objective_ref: objective.attention
  task: transfer
  points: 1
  remediation_scene: attention.s1
