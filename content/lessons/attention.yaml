schema_version: 0.2-draft
lesson:
  id: attention
  version: 0.2.0-draft
  title: 'Attention: queries, keys, and values'
  state: draft
  summary: Distinguish query/key scoring from the weighted combination of value vectors.
  slot: M15.2
  category: learning
  sources:
  - title: Dive into Deep Learning — queries, keys, and values
    url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/queries-keys-values.html
  - title: Attention Is All You Need
    url: https://arxiv.org/abs/1706.03762
objectives:
- id: objective.attention
  version: 1-draft
  statement: Distinguish query/key scoring from the weighted combination of value vectors.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - attention.base
  - attention.transfer
  prerequisites:
  - anyOf:
    - objective.embeddings
