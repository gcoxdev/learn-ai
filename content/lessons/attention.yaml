scenes:
- title: Ask what information this position needs
  markdown: 'Consider “the bird rested because it was tired”. To update the representation at “it”, the model
    can combine information from other positions. Attention provides a learned mechanism for that combination.


    A query represents the current position for scoring. Keys represent candidate positions for comparison.
    Values provide the information to be combined. These names describe computational roles, not literal questions
    and answers in English.'
  id: attention.s1
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attention
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Make one score for each candidate
  markdown: 'In a small dot-product example, let the query be [1, 0]. Candidate keys [2, 0] and [0, 2] produce
    scores 2 and 0. Changing the query to [0, 1] reverses which key scores higher.


    Real attention usually learns projections that construct queries, keys, and values from representations.
    The example starts after those projections and uses invented numbers so you can inspect the operation.'
  bridges:
  - vectors
  id: attention.s2
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attention
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Scores decide how much; values decide what
  markdown: 'Suppose scoring and normalization produce weights 0.75 and 0.25. Let the corresponding values
    be [4, 0] and [0, 8]. The attention output is 0.75 × [4, 0] + 0.25 × [0, 8] = [3, 2].


    The weighted sum uses values, not keys. If the first value changes while queries and keys stay fixed, the
    output can change even though the weights stay the same.'
  type: table
  columns:
  - Candidate
  - Weight
  - Value
  - Contribution
  rows:
  - - A
    - 0.75
    - '[4, 0]'
    - '[3, 0]'
  - - B
    - 0.25
    - '[0, 8]'
    - '[0, 2]'
  id: attention.s3
  depth: mechanics
  objective_refs:
  - objective.attention
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Self-attention and cross-attention
  markdown: 'In self-attention, queries, keys, and values are constructed from the same sequence of representations.
    Different projections still give them different roles. In cross-attention, queries come from one source
    while keys and values come from another.


    For example, an image-generating system can condition visual representations on representations of a text
    prompt. That introduces information from another source; it does not turn the attention output directly
    into vocabulary probabilities.'
  id: attention.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attention
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Avoid two tempting shortcuts
  markdown: 'First, attention is generally a weighted combination, not necessarily a hard choice of exactly
    one token. Second, a weight is not a complete explanation of why a model made a decision. Other heads,
    layers, residual paths, and nonlinear transformations also contribute.


    You now know the roles of Q, K, and V. The next lesson supplies the missing scoring details: scaling, softmax
    normalization, and which positions are allowed to participate.'
  id: attention.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attention
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- id: attention.extension-roles-before-arithmetic
  title: Rehearse the three roles before calculating
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attention
  markdown: 'Keep three labels beside your example: query, key, and value. The **query** describes the position
    being updated for comparison. Each **key** participates in a match score with that query. Each **value**
    is information that may be carried into the result.


    As a loose analogy, a library request is compared with catalog descriptions before choosing content to
    read. In actual attention, learned numerical transformations make all three vectors. A high match score
    does not prove that the content is true or relevant to the real-world question.'
  text_mode: 'Keep three labels beside your example: query, key, and value. The **query** describes the position
    being updated for comparison. Each **key** participates in a match score with that query. Each **value**
    is information that may be carried into the result.


    As a loose analogy, a library request is compared with catalog descriptions before choosing content to
    read. In actual attention, learned numerical transformations make all three vectors. A high match score
    does not prove that the content is true or relevant to the real-world question.'
  bridges:
  - vectors
  - matrices-tensors
- id: attention.extension-changed-values
  title: Change what is carried without changing the scores
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attention
  markdown: 'Keep the mixing weights from the previous page: 0.75 and 0.25. The original values [4, 0] and
    [0, 8] produced [3, 2]. Now predict what happens when only the second value becomes [0, 4].


    Its contribution halves from [0, 2] to [0, 1], so the new output is [3, 1]. No query or key changed, so
    the mixing weights stay fixed. This isolates the distinction: changing what is carried can change the answer
    without changing how much each candidate contributes.'
  text_mode: 'Keep the mixing weights from the previous page: 0.75 and 0.25. The original values [4, 0] and
    [0, 8] produced [3, 2]. Now predict what happens when only the second value becomes [0, 4].


    Its contribution halves from [0, 2] to [0, 1], so the new output is [3, 1]. No query or key changed, so
    the mixing weights stay fixed. This isolates the distinction: changing what is carried can change the answer
    without changing how much each candidate contributes.'
  bridges:
  - arithmetic
  - vectors
- id: attention.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.attention
  markdown: Use a fresh example to check what you can explain. Hints remain available for practice.
  text_mode: Labeled controls and untimed feedback.
  takeaway: Queries and keys help compute how strongly to weight candidates. Values supply the vectors that
    are mixed. Keep “how much” separate from “what information”.
- id: attention.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.attention
  markdown: Queries and keys help compute how strongly to weight candidates. Values supply the vectors that
    are mixed. Keep “how much” separate from “what information”.
  text_mode: Queries and keys help compute how strongly to weight candidates. Values supply the vectors that
    are mixed. Keep “how much” separate from “what information”.
