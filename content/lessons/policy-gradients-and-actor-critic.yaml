schema_version: 0.2-draft
lesson:
  id: policy-gradients-and-actor-critic
  version: 0.4.0-draft
  title: Learn a policy directly from its outcomes
  state: draft
  summary: Skip the value table and tune the odds of each move directly. Meet REINFORCE, actor-critic, and PPO, the algorithm that helped turn language models into chat assistants.
  slot: M24.6
  category: learning
  sources:
    - title: "Simple statistical gradient-following algorithms for connectionist reinforcement learning (Williams, 1992)"
      url: https://doi.org/10.1007/BF00992696
    - title: "Policy Gradient Methods for Reinforcement Learning with Function Approximation (Sutton et al., 1999)"
      url: https://papers.nips.cc/paper_files/paper/1999/hash/464d828b85b0bed98e80ade0a5c43b0f-Abstract.html
    - title: "Proximal Policy Optimization Algorithms (Schulman et al., 2017)"
      url: https://arxiv.org/abs/1707.06347
    - title: "Training language models to follow instructions with human feedback (Ouyang et al., 2022)"
      url: https://arxiv.org/abs/2203.02155
objectives:
  - id: objective.policy-gradients-and-actor-critic
    version: 2-draft
    statement: Policy-gradient methods adjust action probabilities using return-related signals; actor-critic methods learn value baselines, and PPO-style objectives control update incentives rather than guaranteeing optimality.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - policy-gradients-and-actor-critic.base.v2
      - policy-gradients-and-actor-critic.transfer.v2
      - policy-gradients-and-actor-critic.calculate
    prerequisites:
      - anyOf:
          - objective.temporal-difference-and-q-learning
      - anyOf:
          - objective.stochastic-gradients
scenes:
  - id: policy-gradients-and-actor-critic.s1
    title: Tune the odds of each move directly
    type: explanation
    depth: intuition
    objective_refs:
      - objective.policy-gradients-and-actor-critic
    markdown: |-
      Every method so far learned values first and read the policy off them: pick the action with the biggest $Q$. That works for four buttons. It gets awkward when Pip's action is a steering angle anywhere between −30° and +30°, because "take the max over all angles" is now a hard search problem at every step.

      **Policy-gradient** methods skip the middleman. The policy itself is a model with weights $\theta$ that outputs action probabilities, $\pi_\theta(a \mid s)$, and learning adjusts $\theta$ to make high-return actions more likely.

      At the hallway junction Pip can head through the Kitchen or along the Hallway. Its policy keeps one preference number per route and turns them into probabilities with a softmax:

      $$\pi(\text{Hallway}) = \frac{e^{\theta_\text{Hallway}}}{e^{\theta_\text{Kitchen}} + e^{\theta_\text{Hallway}}}$$

      With both preferences at 0, each route has probability 0.5. For a steering angle, the network would instead output the mean and spread of a bell curve over angles, and Pip would sample from it. Either way, the policy is *stochastic*: it explores by itself, with no epsilon needed.
    bridges: []
  - id: policy-gradients-and-actor-critic.s2
    title: "REINFORCE: push up whatever paid off"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.policy-gradients-and-actor-critic
    markdown: |-
      The simplest policy-gradient algorithm is **REINFORCE** (Ronald Williams, 1992). Run an episode, then for each action taken, nudge $\theta$ in the direction that makes that action more likely, scaled by the return that followed.

      :::papers The REINFORCE update
      $$\nabla_\theta J(\theta) \approx \big(G_t - b\big)\,\nabla_\theta \log \pi_\theta(a_t \mid s_t) \qquad \theta \leftarrow \theta + \alpha\,(G_t - b)\,\nabla_\theta \log \pi_\theta(a_t \mid s_t)$$

      $J(\theta)$ is the expected return of the policy. $\nabla_\theta \log \pi_\theta(a_t \mid s_t)$ points in the direction that raises the probability of the action actually taken. $G_t$ is the return that followed it, and $b$ is a **baseline**, a reference return that the next scene explains. For a softmax, the gradient of $\log \pi(a)$ with respect to preference $\theta_k$ is simply $\mathbf{1}[k = a] - \pi(k)$: +0.5 for the chosen route and −0.5 for the other, when both start at 0.5.
      :::

      Pip takes the Hallway and gets return $G = 8$. Using baseline $b = 5$ and $\alpha = 0.1$:

      1. **Advantage over the baseline:** $8 - 5 = 3$.
      2. **Gradient of log-probability:** $[\text{Kitchen}, \text{Hallway}] = [-0.5, +0.5]$.
      3. **Update:** $\theta \leftarrow [0, 0] + 0.1 \times 3 \times [-0.5, 0.5] = [-0.15, +0.15]$.
      4. **New policy:** $\pi(\text{Hallway}) = 1 / (1 + e^{-0.3}) \approx 0.574$.

      :::predict Same trip along the Hallway, but the return is only 3. What happens to π(Hallway)?
      The advantage is $3 - 5 = -2$, so $\theta$ moves to $[+0.1, -0.1]$ and $\pi(\text{Hallway})$ falls to $1/(1 + e^{0.2}) \approx 0.450$. The trip still earned a positive return, but it did worse than the baseline expected, so REINFORCE makes it *less* likely.
      :::
    bridges:
      - derivatives
  - id: policy-gradients-and-actor-critic.s3
    title: Judge each move against what you expected
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.policy-gradients-and-actor-critic
    markdown: |-
      Without a baseline ($b = 0$), almost all of Pip's returns are positive, so nearly *every* trip gets pushed up; the better route just gets pushed a little harder. With noisy returns, a lucky Kitchen trip can outweigh several Hallway trips, and learning wobbles. Subtracting a baseline keeps the average push the same (the baseline doesn't depend on the action, so its contribution averages to zero) while making each push much less noisy.

      ```python run
      import numpy as np

      def softmax(z):
          e = np.exp(z - z.max())
          return e / e.sum()

      def train(use_baseline, episodes=300, alpha=0.02, seed=0):
          rng = np.random.default_rng(seed)
          theta = np.zeros(2)                  # preferences for [kitchen, hallway]
          mean_return = np.array([6.0, 8.0])   # hidden: the hallway route is better
          baseline = 0.0
          for t in range(episodes):
              pi = softmax(theta)
              a = rng.choice(2, p=pi)
              G = mean_return[a] + rng.normal(0, 3)       # noisy return for this trip
              b = baseline if use_baseline else 0.0
              grad_log_pi = -pi.copy()
              grad_log_pi[a] += 1                          # d log pi(a) / d theta
              theta += alpha * (G - b) * grad_log_pi       # REINFORCE step
              baseline += 0.1 * (G - baseline)             # running average of returns
          return softmax(theta)[1]

      for use_baseline in [False, True]:
          finals = [train(use_baseline, seed=s) for s in range(100)]
          print(f"baseline={use_baseline!s:5}: P(hallway) after 300 trips "
                f"averages {np.mean(finals):.2f}, worst run {np.min(finals):.2f}")
      ```

      The averages look similar (0.92 against 0.94), but the worst of 100 runs tells the story: 0.17 without a baseline, 0.87 with one. Try `alpha=0.05`: the worst no-baseline run collapses to 0.01, while the worst baseline run stays at 0.89.

      The best baseline is the value of the state, $V(s)$. Learn it with a second model, the **critic**, while the policy, the **actor**, chooses actions. The actor is then pushed by the **advantage**, how much better an action did than the critic expected: $A(s, a) = Q(s, a) - V(s)$. In practice the TD error from the TD lesson stands in for it: $\delta = r + \gamma V(s') - V(s)$. With the critic at $V(\text{Door}) = 5$ and $V(\text{Rug}) = 8$, moving forward for −1 gives $\delta = -1 + 7.2 - 5 = 1.2$. The actor makes "forward at the Door" more likely, and the critic nudges $V(\text{Door})$ toward 6.2. One number trains both.
    diagram:
      caption: The actor-critic loop. One TD error trains both the actor and the critic.
      description: The actor, the policy, sends an action to the environment. The environment returns a new state to the actor and sends the reward and next state to the critic. The critic, which estimates V(s), computes the TD error delta. The TD error goes to the actor, where it scales the push on the action's log-probability, and back to the critic, where it improves V.
      nodes:
        - id: actor
          label: Actor π_θ(a | s)
          note: chooses actions
          col: 0
          row: 0
          tone: accent
        - id: env
          label: Environment
          note: the flat
          col: 2
          row: 0
          tone: data
        - id: critic
          label: Critic V(s)
          note: predicts the return
          col: 2
          row: 2
          tone: warn
        - id: delta
          label: TD error δ
          note: r + γV(s′) − V(s)
          col: 0
          row: 2
          tone: muted
      edges:
        - from: actor
          to: env
          label: action a
        - from: env
          to: actor
          label: new state s′
          bend: 2
        - from: env
          to: critic
          label: reward r, next state s′
        - from: critic
          to: delta
          label: compute δ
        - from: delta
          to: actor
          label: raise π(a|s) if δ > 0
        - from: delta
          to: critic
          label: improve V
          bend: 2
    bridges: []
  - id: policy-gradients-and-actor-critic.s4
    title: "PPO: improve the policy in small, safe steps"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.policy-gradients-and-actor-critic
    markdown: |-
      Policy gradients have one dangerous habit. A single large step can wreck a good policy, and then the bad policy collects bad data, and there's no way back. **PPO (Proximal Policy Optimization)** (Schulman et al., 2017) limits how much one batch of experience can change the policy.

      PPO compares the new policy with the old one that collected the data, using the **probability ratio** $r_t(\theta) = \pi_\theta(a_t \mid s_t)\,/\,\pi_{\theta_\text{old}}(a_t \mid s_t)$:

      :::papers PPO's clipped objective
      $$L^{\text{CLIP}}(\theta) = \mathbb{E}_t\Big[\min\big(r_t(\theta)\,A_t,\ \operatorname{clip}(r_t(\theta),\,1 - \epsilon,\,1 + \epsilon)\,A_t\big)\Big]$$

      With $\epsilon = 0.2$, suppose the old policy chose Hallway with probability 0.5, and after a few gradient steps the new one gives it 0.7, so $r = 1.4$. The advantage is $A = +2$. Unclipped, $1.4 \times 2 = 2.8$. Clipped, $1.2 \times 2 = 2.4$. The min is 2.4, a flat value that stops changing as $r$ grows, so there's no reward for pushing Hallway any higher on this batch.
      :::

      :::predict Same ratio, 1.4, but the advantage is −2. Does clipping stop the update?
      No. Unclipped gives $1.4 \times (-2) = -2.8$; clipped gives $1.2 \times (-2) = -2.4$. The min picks −2.8, the unclipped term, so the gradient still pulls Hallway's probability back down. PPO's min is pessimistic: it caps the *gain* from moving too far, never the penalty for having moved too far in a bad direction.
      :::

      :::mixup "Clipping guarantees the policy never moves more than 20%."
      Clipping only removes the incentive to go further on each sample. Shared weights, several epochs, and a large learning rate can still carry the policy past the boundary. That's why PPO users also watch the KL divergence between old and new policies and stop early when it jumps.
      :::

      Policy gradients sit behind two of RL's most famous results. AlphaGo (2016) trained its policy network first on human expert moves, then improved it with policy-gradient self-play. InstructGPT (OpenAI, 2022) used PPO with the language model as the policy: each token is an action, and a reward model trained on human preferences scores the finished answer. OpenAI said ChatGPT (November 2022) was trained with similar methods. The RLHF lesson follows that thread.
    bridges: []
  - id: policy-gradients-and-actor-critic.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.policy-gradients-and-actor-critic
    markdown: Work out a few PPO clipped values, then apply advantages and baselines to a robot arm, a language model, and a game where every reward is positive.
    takeaway: |-
      Policy gradients raise the probability of actions that did better than expected and lower the rest. A critic supplies "expected", and PPO's clip stops one batch from pushing the policy too far.
  - id: policy-gradients-and-actor-critic.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.policy-gradients-and-actor-critic
    markdown: |-
      The actor chooses actions; the critic estimates how well things are going. Policy-gradient updates use outcome comparisons to adjust action probabilities.
