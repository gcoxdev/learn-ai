schema_version: 0.2-draft
lesson:
  id: policy-gradients-and-actor-critic
  version: 0.3.0-draft
  title: Learn a policy directly from its outcomes
  state: draft
  summary: Let one network choose actions and another help judge their outcomes.
  slot: M24.6
  category: learning
  sources:
  - title: Policy Gradient Methods for Reinforcement Learning with Function Approximation
    url: https://papers.nips.cc/paper/1713-policy-gradient-methods-for-reinforcement-learning-with-function-approximation
  - title: PPO
    url: https://arxiv.org/abs/1707.06347
objectives:
- id: objective.policy-gradients-and-actor-critic
  version: 1-draft
  statement: Policy-gradient methods adjust action probabilities using return-related signals; actor-critic
    methods learn value baselines, and PPO-style objectives control update incentives rather than guaranteeing
    optimality.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - policy-gradients-and-actor-critic.base
  - policy-gradients-and-actor-critic.transfer
  prerequisites:
  - anyOf:
    - objective.temporal-difference-and-q-learning
  - anyOf:
    - objective.stochastic-gradients
scenes:
- id: policy-gradients-and-actor-critic.s1
  title: Parameterize the action distribution
  type: explanation
  depth: intuition
  objective_refs:
  - objective.policy-gradients-and-actor-critic
  markdown: A policy network can output probabilities for discrete actions or parameters of a continuous action
    distribution. Policy-gradient learning uses sampled actions and return-related signals to change their
    log probabilities. It can handle action spaces where enumerating every action-value is impractical.
  text_mode: A policy network can output probabilities for discrete actions or parameters of a continuous action
    distribution. Policy-gradient learning uses sampled actions and return-related signals to change their
    log probabilities. It can handle action spaces where enumerating every action-value is impractical.
  bridges: []
- id: policy-gradients-and-actor-critic.s2
  title: Reduce variance with a critic
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.policy-gradients-and-actor-critic
  markdown: 'An actor chooses actions; a critic estimates value or another baseline. Subtracting an appropriate
    action-independent baseline can reduce policy-gradient variance without changing its expected direction
    under the relevant assumptions. A learned critic can still be inaccurate and affect practical updates.


    If a critic expects return 5 and an action leads to sampled return 7, the simple return-minus-baseline
    advantage is +2. A return of 3 gives −2. “Advantage” means better or worse than the reference expectation,
    not simply whether the raw reward is positive. The critic learns from prediction error; the actor uses
    the advantage to adjust its action distribution. A positive advantage supplies a direction of encouragement,
    not a command to set a probability to a particular value.'
  text_mode: 'An actor chooses actions; a critic estimates value or another baseline. Subtracting an appropriate
    action-independent baseline can reduce policy-gradient variance without changing its expected direction
    under the relevant assumptions. A learned critic can still be inaccurate and affect practical updates.


    If a critic expects return 5 and an action leads to sampled return 7, the simple return-minus-baseline
    advantage is +2. A return of 3 gives −2. “Advantage” means better or worse than the reference expectation,
    not simply whether the raw reward is positive. The critic learns from prediction error; the actor uses
    the advantage to adjust its action distribution. A positive advantage supplies a direction of encouragement,
    not a command to set a probability to a particular value.'
  bridges:
  - derivatives
- id: policy-gradients-and-actor-critic.s3
  title: Interpret a local signal
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.policy-gradients-and-actor-critic
  markdown: If an action’s estimated advantage is positive, a simple policy-gradient term encourages its sampled
    log probability. If negative, it discourages it. Other samples, shared parameters, clipping, and regularization
    jointly determine the actual update, so this local interpretation is not a guarantee for every action probability.
  text_mode: If an action’s estimated advantage is positive, a simple policy-gradient term encourages its sampled
    log probability. If negative, it discourages it. Other samples, shared parameters, clipping, and regularization
    jointly determine the actual update, so this local interpretation is not a guarantee for every action probability.
  bridges: []
- id: policy-gradients-and-actor-critic.s4
  title: Control and measure policy change
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.policy-gradients-and-actor-critic
  markdown: PPO compares current and rollout-policy probabilities and clips a surrogate objective to limit
    incentives for excessive changes. It does not impose a universal hard bound on every policy difference.
    Monitor return, KL, entropy, value error, and held-out conditions alongside optimizer diagnostics.
  text_mode: PPO compares current and rollout-policy probabilities and clips a surrogate objective to limit
    incentives for excessive changes. It does not impose a universal hard bound on every policy difference.
    Monitor return, KL, entropy, value error, and held-out conditions alongside optimizer diagnostics.
  bridges: []
- id: policy-gradients-and-actor-critic.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.policy-gradients-and-actor-critic
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: The actor chooses actions; the critic estimates how well things are going. Policy-gradient updates
    use outcome comparisons to adjust action probabilities.
