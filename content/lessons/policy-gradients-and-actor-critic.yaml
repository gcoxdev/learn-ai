assessment_families:
  - id: policy-gradients-and-actor-critic.base
    objective_ref: objective.policy-gradients-and-actor-critic
    task: base
    response_type: single_choice
    points: 1
    hint: 'Reduce variance with a critic: trace the inputs, operation, and result before choosing.'
    remediation_scene: policy-gradients-and-actor-critic.s2
    variants:
      - id: policy-gradients-and-actor-critic.base.1
        prompt: What does the actor represent?
        options:
          - id: b
            text: Only the replay storage format
          - id: c
            text: An exact reward oracle
          - id: a
            text: The policy that selects actions
        answer: a
        feedback: Actor parameters define decision behavior.
        retired: true
      - id: policy-gradients-and-actor-critic.base.2
        prompt: Why subtract a suitable baseline?
        options:
          - id: c
            text: To guarantee zero model error
          - id: a
            text: To reduce gradient-estimator variance
          - id: b
            text: To make rewards disappear from the task
        answer: a
        feedback: A baseline centers the learning signal.
        retired: true
  - id: policy-gradients-and-actor-critic.transfer
    objective_ref: objective.policy-gradients-and-actor-critic
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Control and measure policy change: trace the inputs, operation, and result before choosing.'
    remediation_scene: policy-gradients-and-actor-critic.s4
    variants:
      - id: policy-gradients-and-actor-critic.transfer.1
        prompt: Positive advantage locally encourages what in a basic policy-gradient term?
        options:
          - id: c
            text: Always lowering every probability
          - id: a
            text: Higher log probability of the sampled action
          - id: b
            text: Deleting the action space
        answer: a
        feedback: The sign indicates better-than-baseline sampled behavior.
        retired: true
      - id: policy-gradients-and-actor-critic.transfer.2
        prompt: Does PPO clipping guarantee every policy change stays inside a strict bound?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if a critic is used
        answer: a
        feedback: Clipping controls a surrogate incentive rather than all resulting changes.
        retired: true
  - id: policy-gradients-and-actor-critic.base.v2
    objective_ref: objective.policy-gradients-and-actor-critic
    task: base
    response_type: single_choice
    points: 1
    hint: The sign of (return − baseline), or of the advantage, decides the direction of the push. The raw return's sign doesn't.
    remediation_scene: policy-gradients-and-actor-critic.s3
    variants:
      - id: policy-gradients-and-actor-critic.base.v2.1
        prompt: A critic expects a return of 5 from a state. The actor takes an action and the return is 3. How does an advantage-based update change that action's probability?
        options:
          - id: b
            text: It raises it, because the return of 3 is still positive
          - id: a
            text: It lowers it, because 3 is below the expected 5
          - id: c
            text: It leaves it alone until the critic's estimate is exact
        answer: a
        feedback: The advantage is 3 − 5 = −2, so the update lowers the action's probability. A positive raw return doesn't matter; only doing better or worse than expected does. Updates don't wait for a perfect critic.
      - id: policy-gradients-and-actor-critic.base.v2.2
        prompt: Why does subtracting a baseline that depends only on the state not bias the policy gradient?
        options:
          - id: a
            text: Its contribution averages to zero over the policy's actions
          - id: b
            text: It is recomputed after the update, so it cancels itself out
          - id: c
            text: It is small compared with the returns, so its effect is minor
        answer: a
        feedback: Because b doesn't depend on the action, the expected value of b × ∇log π(a|s) over actions is zero. So the average direction is unchanged and only the noise drops. Baselines can be large; the argument doesn't rely on size.
      - id: policy-gradients-and-actor-critic.base.v2.3
        prompt: In an actor-critic agent, what does the critic's TD error δ = r + γV(s′) − V(s) do?
        options:
          - id: c
            text: It picks the next action by choosing the highest-value state
          - id: a
            text: It scales the actor's push and also corrects the critic's V(s)
          - id: b
            text: It replaces the reward so the environment is no longer needed
        answer: a
        feedback: One δ serves both. It estimates the advantage for the actor and is the critic's own TD correction. The actor, not the critic, chooses actions, and δ is built from the real reward r.
      - id: policy-gradients-and-actor-critic.base.v2.4
        prompt: Under PPO with ε = 0.2, an action with positive advantage already has probability ratio 1.3. What does the clipped objective do for this sample?
        options:
          - id: a
            text: It gives no further incentive to raise that action's probability
          - id: b
            text: It pushes the probability back down until the ratio is 1.2
          - id: c
            text: It doubles the push, since the advantage has been confirmed
        answer: a
        feedback: For positive advantage, the min selects the clipped term 1.2 × A, which is flat in θ, so this sample stops contributing gradient. PPO doesn't actively pull the ratio back to 1.2, and it never amplifies the push.
  - id: policy-gradients-and-actor-critic.transfer.v2
    objective_ref: objective.policy-gradients-and-actor-critic
    task: transfer
    response_type: single_choice
    points: 1
    hint: Identify the policy, the action, and what counts as "better than expected" in the new setting before choosing.
    remediation_scene: policy-gradients-and-actor-critic.s4
    variants:
      - id: policy-gradients-and-actor-critic.transfer.v2.1
        prompt: A robot arm must choose a joint torque anywhere in a continuous range. Why is a policy-gradient method a natural fit?
        options:
          - id: b
            text: Policy gradients need no reward signal to learn torques
          - id: c
            text: Q-learning cannot represent values for robot arms at all
          - id: a
            text: The policy can output a distribution over torques directly
        answer: a
        feedback: A policy network can output, say, the mean and spread of a bell curve over torques and sample from it. Q-learning would need a max over infinitely many torques at every step. Policy gradients still learn from rewards.
      - id: policy-gradients-and-actor-critic.transfer.v2.2
        prompt: In RLHF training of a chat model with PPO, what plays the role of the policy's action?
        options:
          - id: a
            text: Each next token the language model generates
          - id: b
            text: The score the reward model gives an answer
          - id: c
            text: Each human comparison between two answers
        answer: a
        feedback: The language model is the policy, and generating a token is one action. The reward model's score is the reward, and human comparisons are the data used to train that reward model.
      - id: policy-gradients-and-actor-critic.transfer.v2.3
        prompt: In a game, every episode's return is between 90 and 100 points. A REINFORCE agent without a baseline learns very slowly and erratically. What is the most useful change?
        options:
          - id: c
            text: Multiply all rewards by 10 so the gradients are larger
          - id: a
            text: Subtract a baseline such as the average recent return
          - id: b
            text: Switch to a greedy policy so that exploration noise stops
        answer: a
        feedback: With every return large and positive, every action gets pushed up, and only small differences separate good from bad. Subtracting about 95 makes better-than-average actions positive and worse ones negative. Scaling rewards makes the noise bigger too.
      - id: policy-gradients-and-actor-critic.transfer.v2.4
        prompt: During PPO training, the KL divergence between the old and new policies jumps sharply within one batch, and returns drop. What is the most sensible response?
        options:
          - id: a
            text: Lower the learning rate or stop that batch's epochs early
          - id: b
            text: Widen the clip range so the policy can recover faster
          - id: c
            text: Remove the critic so that the advantages stop changing
        answer: a
        feedback: A KL jump means the policy moved much further than clipping alone was meant to allow. Smaller steps or early stopping keep updates close to the data-collecting policy. Widening the clip allows even bigger moves.
  - id: policy-gradients-and-actor-critic.calculate
    objective_ref: objective.policy-gradients-and-actor-critic
    task: base
    response_type: numeric
    points: 1
    hint: "Compute r = new probability ÷ old probability, clip it to [1 − ε, 1 + ε], multiply each version by A, and keep the smaller of the two products."
    remediation_scene: policy-gradients-and-actor-critic.s4
    absolute_tolerance: 0.01
    variants:
      - id: policy-gradients-and-actor-critic.calculate.1
        prompt: PPO with ε = 0.2. The old policy chose the action with probability 0.5; the new policy gives it 0.7. The advantage is +2. What is this sample's clipped objective value, min(rA, clip(r)A)?
        answer: 2.4
        feedback: r = 1.4. Unclipped 1.4 × 2 = 2.8; clipped 1.2 × 2 = 2.4. The min is 2.4.
      - id: policy-gradients-and-actor-critic.calculate.2
        prompt: PPO with ε = 0.2. The old policy chose the action with probability 0.5; the new policy gives it 0.7. The advantage is −2. What is this sample's clipped objective value, min(rA, clip(r)A)?
        answer: -2.8
        feedback: r = 1.4. Unclipped 1.4 × (−2) = −2.8; clipped 1.2 × (−2) = −2.4. The min is −2.8, so the penalty is not capped.
      - id: policy-gradients-and-actor-critic.calculate.3
        prompt: PPO with ε = 0.2. The old policy chose the action with probability 0.4; the new policy gives it 0.3. The advantage is +1. What is this sample's clipped objective value, min(rA, clip(r)A)?
        answer: 0.75
        feedback: r = 0.75. Unclipped 0.75 × 1 = 0.75; clipped 0.8 × 1 = 0.8. The min is 0.75.
      - id: policy-gradients-and-actor-critic.calculate.4
        prompt: PPO with ε = 0.2. The old policy chose the action with probability 0.4; the new policy gives it 0.3. The advantage is −3. What is this sample's clipped objective value, min(rA, clip(r)A)?
        answer: -2.4
        feedback: r = 0.75. Unclipped 0.75 × (−3) = −2.25; clipped 0.8 × (−3) = −2.4. The min is −2.4, the clipped term.
      - id: policy-gradients-and-actor-critic.calculate.5
        prompt: PPO with ε = 0.2. The old policy chose the action with probability 0.2; the new policy gives it 0.22. The advantage is +5. What is this sample's clipped objective value, min(rA, clip(r)A)?
        answer: 5.5
        feedback: r = 1.1, which is inside [0.8, 1.2], so both terms equal 1.1 × 5 = 5.5.
