simulation:
  id: simulation.scalar-descent
  engine_id: scalar-squared-error-descent
  engine_version: 1-proposed
  implementation_status: planned
  formula_policy: Formulas below are display/reference strings, never executable expressions.
  definitions:
    prediction: w*x
    loss: (w*x-y)^2
    gradient: 2*x*(w*x-y)
    update: w_next = w - rate*gradient
    update_convention: Compute the gradient at the old weight, then calculate the next prediction and loss.
  initial_parameters:
    x: 2
    y: 6
    initial_weight: 0
    rate: 0.1
  controls:
    initial_weight:
      min: -6
      max: 12
      step: 0.1
    rate:
      min: 0
      max: 0.3
      step: 0.01
    max_steps: 12
    actions:
      - predict
      - step
      - pause
      - reset
      - select_trace_row
      - compare_reference_runs
    guard: Stop and explain if a value becomes nonfinite or its magnitude exceeds 1000000; never silently clamp an update.
  accessibility:
    keyboard: Labeled numeric inputs and native buttons; no dragging or timed reaction required.
    status: Announce the result of one requested step concisely; do not read the entire growing table automatically.
    reduced_motion: Update numbers and table rows without animated movement.
    columns:
      - step
      - weight
      - prediction
      - loss
      - gradient_at_this_weight
    comparison: Name each learning rate in text; do not distinguish curves by color alone.
  reference_cases:
    - id: trace.decreasing
      parameters:
        x: 2
        y: 6
        initial_weight: 0
        rate: 0.1
      rows:
        - step: 0
          weight: 0
          prediction: 0
          loss: 36
          gradient: -24
        - step: 1
          weight: 2.4
          prediction: 4.8
          loss: 1.44
          gradient: -4.8
        - step: 2
          weight: 2.88
          prediction: 5.76
          loss: 0.0576
          gradient: -0.96
        - step: 3
          weight: 2.976
          prediction: 5.952
          loss: 0.002304
          gradient: -0.192
    - id: trace.overshoot-decreasing
      parameters:
        x: 2
        y: 6
        initial_weight: 0
        rate: 0.2
      rows:
        - step: 0
          weight: 0
          prediction: 0
          loss: 36
          gradient: -24
        - step: 1
          weight: 4.8
          prediction: 9.6
          loss: 12.96
          gradient: 14.4
        - step: 2
          weight: 1.92
          prediction: 3.84
          loss: 4.6656
          gradient: -8.64
        - step: 3
          weight: 3.648
          prediction: 7.296
          loss: 1.679616
          gradient: 5.184
    - id: trace.diverging
      parameters:
        x: 2
        y: 6
        initial_weight: 0
        rate: 0.3
      rows:
        - step: 0
          weight: 0
          prediction: 0
          loss: 36
          gradient: -24
        - step: 1
          weight: 7.2
          prediction: 14.4
          loss: 70.56
          gradient: 33.6
        - step: 2
          weight: -2.88
          prediction: -5.76
          loss: 138.2976
          gradient: -47.04
        - step: 3
          weight: 11.232
          prediction: 22.464
          loss: 271.063296
          gradient: 65.856
  absolute_reference_tolerance: 1e-6
scenes:
  - id: s01-rule
    type: explanation
    title: A rule with one adjustable number
    depth: intuition
    objective_refs:
      - objective.loss-meaning
      - objective.update-consequence
    entry_check_ref: check.core-preparation
    markdown: |
      A bakery charges the same price for every box of muffins. You buy 2 boxes and pay \$6. What does one box cost?

      You probably said \$3 before finishing the sentence. A neural network can't do that. It can't look at the problem and see the answer. It has one move: make a guess, measure how wrong it is, and nudge its numbers so the next guess is a little less wrong. Neural networks, from photo taggers to ChatGPT, learn by repeating that move over and over. This lesson shows it with a single number.

      Our model has one number it is allowed to change, its **weight**, which plays the role of the price per box. Its rule is *prediction = weight × input*. The training example says input 2 (boxes) should give **target** 6 (dollars), the answer we want the model to produce.

      A weight of 3 fits perfectly, but the model doesn't know that. We'll start it at weight 0 and watch it find its way to 3 using only its mistakes.
    source_refs:
      - source.toy-algebra
  - id: s02-explore
    type: simulation
    title: Predict before changing the weight
    depth: intuition
    objective_refs:
      - objective.update-consequence
    simulation_ref: simulation.scalar-descent
    mode: manual_weight
    markdown: |
      The input stays at 2 boxes and the target stays at \$6. Before you look, predict what the model outputs with weight 0, weight 1, and weight 3. Afterwards, try a few other weights of your own, then reset to 0.
    prediction_activity:
      id: practice.weight-predictions
      response_type: numeric_fields
      fields:
        - id: at_zero
          label: Prediction with weight 0
          answer: 0
        - id: at_one
          label: Prediction with weight 1
          answer: 2
        - id: at_three
          label: Prediction with weight 3
          answer: 6
      reveal_after: submit_or_show_worked_example
      result_controls: Hide computed predictions until the activity is committed or explicitly skipped to the worked example.
      reveal_markdown: |
        The outputs are 0, 2 and 6. Each is the selected weight multiplied
        by input 2. Changing a weight changes the prediction; changing
        the target changes the task instead.
      evidence_scope: practice_only
    source_refs:
      - source.toy-algebra
  - id: s03-error
    type: table
    title: Measure the mistake
    depth: mechanics
    objective_refs:
      - objective.loss-meaning
    markdown: |
      To improve, the model needs one number that says how wrong it is. Subtract the target from the prediction to get the **error**, then multiply the error by itself. The result is the **squared error**, and it is our **loss**: the score training tries to push down.

      $$\text{loss} = (\text{prediction} - \text{target})^2$$

      Squaring does two useful jobs. First, it makes every miss count as a cost. At weight 0 the error is 0 − 6 = −6, and the loss is (−6)² = 36, not −36. Guessing too low is just as wrong as guessing too high. Second, it punishes big misses much more than small ones. Missing by 2 costs 4, but missing by 4 costs 16. Two small misses of 1 each cost 1 + 1 = 2 in total, while one miss of 2 costs 4 on its own.

      Loss 0 means the prediction matches this example exactly. The table shows three weights.
    columns:
      - weight
      - prediction
      - prediction_minus_target
      - squared_error
    rows:
      - - 0
        - 0
        - -6
        - 36
      - - 1
        - 2
        - -4
        - 16
      - - 3
        - 6
        - 0
        - 0
    bridge_refs:
      - requirement.arithmetic
    source_refs:
      - source.toy-algebra
  - id: s04-predict
    type: question
    title: Which direction looks useful?
    depth: intuition
    objective_refs:
      - objective.update-consequence
    markdown: |-
      At weight 0 the model predicts \$0 for 2 boxes that cost \$6. Which small change to the weight brings the prediction closer to the target?
    question:
      id: practice.direction
      response_type: single_choice
      options:
        - id: increase
          text: Increase the weight slightly.
        - id: decrease
          text: Decrease the weight slightly.
      answer: increase
      hint: The prediction is currently 0 and needs to move toward 6.
      feedback: Increasing the weight raises the prediction from 0 toward 6. Keep the change small, though; later you'll see a jump that goes too far.
      evidence_scope: practice_only
    source_refs:
      - source.toy-algebra
  - id: s05-slope
    type: explanation
    title: A local slope suggests a direction
    depth: intuition
    objective_refs:
      - objective.update-consequence
    markdown: |
      Plot the loss for every possible weight and you get a valley, shaped like a bowl, with its lowest point at weight 3. The model can't see the whole valley. It stands at one spot and feels which way the ground tilts under its feet, like a hiker in thick fog.

      That tilt is the **gradient**: how fast the loss changes when the weight increases a little. For our rule it has a short formula:

      $$\text{gradient} = 2 \times \text{input} \times (\text{prediction} - \text{target})$$

      At weight 0 that is 2 × 2 × (0 − 6) = **−24**. The minus sign says "downhill is to the right": raising the weight lowers the loss. The size, 24, says the slope is steep here, because the model is far from the bottom. At weight 3 the gradient is 2 × 2 × 0 = 0, and the ground is flat.

      So the rule for walking downhill is to step *against* the gradient. The **learning rate** sets how big a step to take. It's a setting you choose, not something the model learns. (The optional math scene shows where the formula comes from.)
    visual:
      id: visual.loss-curve
      kind: curve_with_current_point_and_local_slope
      engine_ref: simulation.scalar-descent
      implementation_status: planned_declarative_visual
      horizontal_axis:
        label: Weight w
        initial_domain:
          - -1
          - 7
      vertical_axis:
        label: Squared error on this example
        initial_domain:
          - 0
          - 70
      bindings:
        curve: Registered engine loss at candidate weights with the current fixed x and y
        current_point: Current selected trace row's weight and loss, or current manual initial weight and its loss
        local_slope: Registered engine gradient at that same weight; show only when requested
      outside_domain: Expand and relabel axes to include the selected finite point; do not clip it silently.
      reference_parameters:
        x: 2
        y: 6
      reference_points:
        - - -1
          - 64
        - - 0
          - 36
        - - 1
          - 16
        - - 2
          - 4
        - - 3
          - 0
        - - 4
          - 4
        - - 5
          - 16
        - - 6
          - 36
        - - 7
          - 64
      text_equivalent: Use a labeled weight/loss table containing the reference points and selected live point. At weight 0, nearby increases lower loss; at weight 3 the toy loss is zero. Announce the requested local slope in words as well as a number.
      controls: Labeled weight input, select-current-row button and optional show-slope button; no pointer-only interaction.
    bridge_refs:
      - requirement.function
      - requirement.derivative
    source_refs:
      - source.toy-algebra
  - id: s06-derivative
    type: equation
    title: Where does minus twenty-four come from?
    depth: mathematics
    objective_refs:
      - objective.scalar-gradient
    requirement_refs:
      - requirement.derivative
      - requirement.chain-rule
    markdown: |
      First, measure the slope without any calculus. Nudge the weight a tiny amount h = 0.001 each way and compare the losses:

      - At w = 0.001, the prediction is 0.002 and the loss is (0.002 − 6)² = 35.976004.
      - At w = −0.001, the prediction is −0.002 and the loss is (−0.002 − 6)² = 36.024004.

      The slope is the rise over the run: (35.976004 − 36.024004) / 0.002 = −0.048 / 0.002 = −24. This is a **central difference**. The next lesson turns it into a tool for checking gradient code.

      Now derive it. The loss is L = (wx − y)², a square wrapped around the error wx − y. The **chain rule** says to multiply the outer derivative by the inner one. The square contributes 2 × (wx − y). The inner error changes by x for each unit of w. So dL/dw = 2x(wx − y). At x = 2, y = 6, and w = 0, that gives 2 × 2 × (−6) = −24, matching the measured slope. In the update formula shown with this scene, η (the Greek letter eta) is the learning rate and t counts updates.
    latex: \frac{dL}{dw}=2x(wx-y),\qquad w_{t+1}=w_t-\eta\,2x(w_tx-y)
    spoken_reading: The loss derivative is twice the input, multiplied by the difference between prediction and target. The next weight is the old weight minus the product of learning rate and its gradient.
    symbols:
      L: Squared error on this one example
      w: Adjustable scalar weight
      x: Fixed example input
      y: Fixed example target
      eta: Learning rate, shown as the Greek letter eta
      t: Update count, not elapsed time
      h: Small weight perturbation for the numerical check
    bridge_refs:
      - requirement.derivative
      - requirement.chain-rule
    source_refs:
      - source.toy-algebra
  - id: s07-update
    type: explanation
    title: Take one measured step
    depth: mechanics
    objective_refs:
      - objective.loss-meaning
      - objective.update-consequence
    markdown: |
      Here is the whole learning rule, called **gradient descent**:

      $$\text{new weight} = \text{old weight} - \text{learning rate} \times \text{gradient}$$

      Take one step with learning rate 0.1, starting from weight 0:

      | Step | Calculation | Result |
      | --- | --- | ---: |
      | Gradient at the old weight | 2 × 2 × (0 − 6) | −24 |
      | Size of the step | 0.1 × (−24) | −2.4 |
      | New weight | 0 − (−2.4) | 2.4 |
      | New prediction | 2.4 × 2 | 4.8 |
      | New loss | (4.8 − 6)² | 1.44 |

      Subtracting a negative number moves the weight *up*, which is exactly the downhill direction the gradient pointed to. One step cut the loss from 36 to 1.44.

      :::predict Start again from weight 0, but use learning rate 0.2. Where does the weight land, and is the loss better or worse than 36?
      The step is 0.2 × (−24) = −4.8, so the new weight is 0 − (−4.8) = 4.8. That's past the answer of 3: the model now predicts 4.8 × 2 = 9.6, too high. But the loss is (9.6 − 6)² = 12.96, still far better than 36. Jumping past the target isn't automatically a failure. What matters is whether you land closer than you started.
      :::

      Before the next step, the model must work out the gradient again at the new weight. At 2.4 it is 2 × 2 × (4.8 − 6) = −4.8, not −24.
    source_refs:
      - source.toy-algebra
  - id: s08-repeat
    type: simulation
    title: Watch several updates
    depth: mechanics
    objective_refs:
      - objective.update-consequence
    simulation_ref: simulation.scalar-descent
    mode: step_and_compare
    markdown: |
      The first step at rate 0.1 moved the weight by 2.4, from 0 to 2.4. The rate stays at 0.1. Will the second step move the weight by the same amount, less, or more? Commit to a guess, then step through the run. Afterwards, compare rates 0.2 and 0.3, starting each run from weight 0.
    prediction_activity:
      id: practice.next-step-size
      initial_reference:
        case_ref: trace.decreasing
        visible_through_step: 1
      initialization: Initialize this activity's reference run on first entry only; preserve committed answers, revealed rows and cursor when resuming from a detour.
      response_type: single_choice
      options:
        - id: same
          text: The next change will be the same size.
        - id: smaller
          text: The next change will be smaller.
        - id: larger
          text: The next change will be larger.
      answer: smaller
      reveal_after: submit_or_show_worked_example
      result_controls: Initially show only steps 0 and 1 at rate 0.1; unlock further rows, the full reference trace and comparison after submit/show-example.
      reveal_markdown: |
        The next change is smaller. The first three learned weights are
        2.4, 2.88 and 2.976: the gradient changes as the weight changes.
        Inspect the row-by-row loss and gradient to see this connection.
      evidence_scope: practice_only
    reference_case_refs:
      - trace.decreasing
      - trace.overshoot-decreasing
      - trace.diverging
    source_refs:
      - source.toy-algebra
  - id: s09-compare
    type: table
    title: Overshooting and divergence are different
    depth: mechanics
    objective_refs:
      - objective.loss-meaning
      - objective.update-consequence
    markdown: |
      The three rates behave in three different ways. Run this to watch five steps of each:

      ```python run
      x, y = 2, 6                      # 2 boxes cost $6

      for rate in [0.1, 0.2, 0.3]:
          w = 0.0
          weights, losses = [], []
          for step in range(5):
              grad = 2 * x * (w * x - y)   # slope of the loss (w*x - y)**2
              w = w - rate * grad          # the update rule
              weights.append(round(w, 3))
              losses.append(round((w * x - y) ** 2, 3))
          print(f"rate {rate}")
          print("  weights:", weights)
          print("  losses: ", losses)
      ```

      - **Rate 0.1 converges.** The weights 2.4, 2.88, 2.976… creep up to 3 from one side, and the loss shrinks toward 0.
      - **Rate 0.2 oscillates.** The weights 4.8, 1.92, 3.648, 2.611… hop back and forth across 3, but each hop lands closer, so the loss still falls: 12.96, 4.666, 1.68…
      - **Rate 0.3 diverges.** Each hop lands *farther* away than the last, and the loss explodes: 70.56, 138.298, 271.063…

      Why? Each step multiplies the error by the same number, 1 − 8 × rate. At rate 0.1 that's 0.2, so the error shrinks fivefold with no sign flip. At 0.2 it's −0.6: the error flips sign and shrinks. At 0.3 it's −1.4: the error flips sign and *grows*. Any rate above 0.25 makes that multiplier bigger than 1 in size, and training blows up.

      :::mixup "The weight jumped past the answer, so the learning rate is too big."
      Jumping past the target is overshooting, and it isn't the same as diverging. Rate 0.2 overshoots on every step and still gets there. The test is whether the loss keeps falling. If it rises step after step, the rate is too big.
      :::

      :::try Find the edge
      Change the rates to `[0.25]` and run it. The multiplier is exactly −1, so the weight bounces between 6 and 0 forever and the loss sits at 36. Then try 0.125, where the multiplier is 0 and one step lands exactly on 3.
      :::
    columns:
      - rate
      - initial_loss
      - loss_after_one_step
      - loss_after_three_steps
    rows:
      - - 0.1
        - 36
        - 1.44
        - 0.002304
      - - 0.2
        - 36
        - 12.96
        - 1.679616
      - - 0.3
        - 36
        - 70.56
        - 271.063296
    source_refs:
      - source.toy-algebra
  - id: s10-limits
    type: explanation
    title: What this example leaves out
    depth: intuition
    objective_refs:
      - objective.loss-meaning
      - objective.update-consequence
    markdown: |
      A real network has millions or billions of weights and learns from millions of examples. Surprisingly little changes.

      - **Many weights.** Each weight gets its own slope: how much the loss changes if *that* weight moves and the others stay put. The list of these slopes is still called the gradient, written ∇L ("grad L"), and every weight steps against its own slope at once.
      - **Many examples.** The loss becomes the *average* loss over the examples, so the gradient becomes the average of the examples' gradients. If a second order says 3 boxes cost \$9, its gradient at weight 0 is 2 × 3 × (0 − 9) = −54, and the average of −24 and −54 is −39.
      - **Finding the slopes.** With a billion weights you can't nudge each one separately. **Backpropagation** computes every slope in one backward pass through the network, using the chain rule.

      :::papers Gradient descent in standard notation
      Papers and textbooks write the update as

      $$w \leftarrow w - \eta\, \nabla_w L(w), \qquad L(w) = \frac{1}{n}\sum_{i=1}^{n} \ell_i(w)$$

      Here $w$ is the weight (or the whole list of weights), $\eta$ ("eta") is the learning rate (0.1 in our first run), $\nabla_w L$ is the gradient (−24 at $w = 0$), and $\ell_i$ is the loss on example $i$. With our single example, $n = 1$ and $\ell_1 = (2w - 6)^2$. The arrow means "replace $w$ with": $0 - 0.1 \times (-24) = 2.4$.
      :::

      The rest of this module keeps this rule and improves each part: checking gradients, using a small random batch per step, adding momentum and Adam, keeping steps from blowing up, and debugging a run that goes wrong.
    source_refs:
      - source.toy-algebra
      - source.design
  - id: s11-check
    type: assessment
    title: Review and check your understanding
    depth: mechanics
    objective_refs:
      - objective.loss-meaning
      - objective.update-consequence
      - objective.scalar-gradient
    markdown: |-
      New price rules, thermostats, and steps that go too far: work out a loss, take an update by hand, and tell overshooting from diverging. The optional math questions ask you to find and check a gradient yourself.
    assessment_refs:
      - gate.core
      - gate.mathematics
    gate_binding: Use navigation.gate_visibility and the active credit scope; the mathematics gate is absent from core credit and preview attempts award no evidence.
    source_refs:
      - source.design
    takeaway: |-
      Gradient descent changes a weight by subtracting the learning rate times the gradient. Recalculate the gradient after each step, and check what happened to the loss: a larger step is not always better.
  - id: s12-recap
    type: recap
    title: Prediction, error, update, repeat
    depth: intuition
    objective_refs:
      - objective.loss-meaning
      - objective.update-consequence
    markdown: |-
      Gradient descent changes a weight by subtracting the learning rate times the gradient. Recalculate the gradient after each step, and check what happened to the loss: a larger step is not always better.
    next_action: Resume the current path at its next unsatisfied objective.
    source_refs:
      - source.toy-algebra
      - source.design
assessment_policy:
  status: draft_only_no_credit
  selection: Select one unused variant from each required family; version and record the selection.
  hinted_attempt: Practice only; use an unused variant for later independent evidence.
  exhausted_pool: Keep practice available and mark independent reassessment unavailable until a reviewed new variant exists; do not relabel a repeat as fresh evidence.
  limitations: Each family holds four reviewed variants; add more before retakes run out for heavy users.
  numeric_scoring: Reject nonnumeric/nonfinite input and use the declared absolute tolerance.
  structured_scoring: A numeric_fields_with_reason item passes only if every declared numeric field meets its tolerance and the selected reason matches its key. Field feedback can diagnose gaps, but partial fields do not establish the family evidence.
  prediction_scoring: Formative prediction and entry-check answers never count as gate evidence; worked-example/solution exposure is recorded and is not an independent attempt.
  option_scoring: Compare stable option IDs, not rendered answer positions.
  gates:
    - id: gate.core
      depths:
        - intuition
        - mechanics
      objective_refs:
        - objective.loss-meaning
        - objective.update-consequence
      family_refs:
        - loss.calculate.v2
        - loss.compare.v2
        - update.trace.v2
        - update.diagnose.v2
      minimum_overall_fraction: 0.8
      minimum_correct_per_objective: 2
      note: With four one-point items covering two critical objectives, the two-check rule requires four correct answers; 80% cannot mask a missing objective.
    - id: gate.mathematics
      depths:
        - mathematics
      objective_refs:
        - objective.scalar-gradient
      family_refs:
        - gradient.calculate.v2
        - gradient.check.v2
      minimum_overall_fraction: 0.8
      minimum_correct_per_objective: 2
      note: Adds formal evidence; never erases existing conceptual credit or awards implementation/research competence.
assessment_families:
  - id: loss.calculate
    objective_ref: objective.loss-meaning
    task: base
    response_type: numeric
    points: 1
    absolute_tolerance: 1e-6
    hint: Subtract target from prediction, then multiply the difference by itself.
    remediation_scene: s03-error
    variants:
      - id: loss.calculate.a
        retired: true
        prompt: A predictor outputs 3 and the target is 5. What is the squared error?
        answer: 4
        feedback: The difference is -2; (-2)*(-2) = 4.
      - id: loss.calculate.b
        retired: true
        prompt: A predictor outputs 7 and the target is 4. What is the squared error?
        answer: 9
        feedback: The difference is 3; 3*3 = 9.
  - id: loss.compare
    objective_ref: objective.loss-meaning
    task: transfer
    response_type: single_choice
    points: 1
    hint: Errors on opposite sides of the target can have the same magnitude.
    remediation_scene: s03-error
    variants:
      - id: loss.compare.a
        retired: true
        prompt: Predictor A outputs 2 and B outputs 6 for target 4. Which statement about their squared errors is correct?
        options:
          - id: equal
            text: Both have loss 4; being below the target does not make squared loss negative.
          - id: a_negative
            text: A has negative squared loss and B has positive squared loss.
          - id: b_better
            text: B has lower loss because its prediction is larger.
        answer: equal
        feedback: Differences -2 and 2 both square to 4; magnitude matters here, not the side of the target.
      - id: loss.compare.b
        retired: true
        prompt: Predictor A outputs 1 and B outputs 7 for target 4. Which statement about their squared errors is correct?
        options:
          - id: a_better
            text: A has lower squared error because 1 is the smaller prediction.
          - id: equal
            text: Both have loss 9; they miss by the same distance on opposite sides.
          - id: negative
            text: Both losses are negative because neither prediction is correct.
        answer: equal
        feedback: Differences -3 and 3 both square to 9. A prediction's size alone does not rank its error.
  - id: update.trace
    objective_ref: objective.update-consequence
    task: base
    response_type: numeric
    points: 1
    absolute_tolerance: 1e-6
    hint: Multiply the supplied gradient by the rate, then subtract that product from the old weight.
    remediation_scene: s07-update
    variants:
      - id: update.trace.a
        retired: true
        prompt: Old weight is 1, learning rate 0.1 and gradient -4. Using new = old - rate*gradient, what is the new weight?
        answer: 1.4
        feedback: 1 - 0.1*(-4) = 1.4; subtracting the negative product increases the weight.
      - id: update.trace.b
        retired: true
        prompt: Old weight is 3, learning rate 0.2 and gradient 5. Using new = old - rate*gradient, what is the new weight?
        answer: 2
        feedback: 3 - 0.2*5 = 2; a positive gradient makes this update decrease the weight.
  - id: update.diagnose
    objective_ref: objective.update-consequence
    task: transfer
    response_type: numeric_fields_with_reason
    points: 1
    absolute_tolerance: 1e-6
    numeric_fields:
      - id: weight
        label: New weight
      - id: prediction
        label: New prediction
      - id: loss
        label: New squared error
    reason_label: Why is this update worse on the example?
    evidence_boundary: Establishes a numerical mechanism trace and structured causal diagnosis; independently produced prose is assessed separately by the pilot rubric.
    hint: Calculate old weight minus rate times gradient, substitute into the prediction rule, and square prediction minus target. Compare the new distance from target with the initial distance.
    remediation_scene: s09-compare
    variants:
      - id: update.diagnose.a
        retired: true
        prompt: Prediction is 2*w, target is 4, old weight is 1 and its gradient is -8. Initial squared error is 4. Rate 0.1 would give weight 1.8, prediction 3.6 and loss 0.16. Instead use rate 0.3. Enter its new weight, prediction and squared error, then choose the reason for the result.
        parameters:
          x: 2
          y: 4
          old_weight: 1
          gradient: -8
          rate: 0.3
        answers:
          weight: 3.4
          prediction: 6.8
          loss: 7.84
        reason_options:
          - id: farther
            text: The step sends the prediction past the target and farther away than it started.
          - id: any_crossing
            text: Any step past the target must worsen error
            even if its final distance is smaller.: null
          - id: positive_rate
            text: Using a positive learning rate always increases error
            regardless of the prediction and target.: null
        reason_answer: farther
        feedback: The new weight is 1-0.3*(-8)=3.4, prediction 6.8, and squared error (6.8-4)^2=7.84. Distance from the target grows from 2 to 2.8. The direction initially helped, but this step went too far. Crossing the target alone does not imply worsening; the final error matters.
      - id: update.diagnose.b
        retired: true
        prompt: Prediction is 1*w, target is 3, old weight is 1 and its gradient is -4. Initial squared error is 4. Rate 0.5 would give weight 3 and loss 0. Instead use rate 1.5. Enter its new weight, prediction and squared error, then choose the reason for the result.
        parameters:
          x: 1
          y: 3
          old_weight: 1
          gradient: -4
          rate: 1.5
        answers:
          weight: 7
          prediction: 7
          loss: 16
        reason_options:
          - id: negative_gradient
            text: Every negative gradient raises error because subtracting a negative changes the weight upward.
          - id: farther
            text: The step passes the target and ends farther from it
            so the squared error grows.: null
          - id: any_crossing
            text: Crossing the target always worsens error even when the final prediction is closer.
        reason_answer: farther
        feedback: Weight 1-1.5*(-4)=7 gives prediction 7 and loss (7-3)^2=16. The initial prediction missed by 2; the new prediction misses by 4. The chosen step size worsened this example despite a useful local direction. This does not prove one rate works for all models.
  - id: gradient.calculate
    objective_ref: objective.scalar-gradient
    task: base
    response_type: numeric
    points: 1
    absolute_tolerance: 1e-6
    hint: Differentiate the outer square and multiply by the derivative of the inner prediction error.
    remediation_scene: s06-derivative
    variants:
      - id: gradient.calculate.a
        retired: true
        prompt: For L=(w*x-y)^2, evaluate dL/dw at x=1, y=4 and w=2. The gradient formula is not supplied in this assessment.
        answer: -4
        feedback: dL/dw = 2*x*(w*x-y) = 2*1*(2-4) = -4.
      - id: gradient.calculate.b
        retired: true
        prompt: For L=(w*x-y)^2, evaluate dL/dw at x=2, y=4 and w=1. The gradient formula is not supplied in this assessment.
        answer: -8
        feedback: dL/dw = 2*x*(w*x-y) = 2*2*(2-4) = -8.
  - id: gradient.check
    objective_ref: objective.scalar-gradient
    task: transfer
    response_type: single_choice
    points: 1
    hint: Check both the numerical difference and the scope of what checking a single parameter can establish.
    remediation_scene: s06-derivative
    variants:
      - id: gradient.check.a
        retired: true
        prompt: At w=0, x=1, y=3 and h=0.001, L(w+h)=8.994001 and L(w-h)=9.006001. What does [L(w+h)-L(w-h)]/(2*h) tell you?
        options:
          - id: agrees
            text: It is approximately -6 and supports this local check; it does not prove an entire implementation correct.
          - id: positive
            text: It is approximately +6 and therefore shows the loss increases locally with the weight.
          - id: all_correct
            text: It is approximately -6 and therefore proves all gradients in the training implementation are correct.
        answer: agrees
        feedback: (-0.012)/0.002 = -6, agreeing with 2*1*(0-3). This is a local cross-check with finite-precision limits and no global guarantee.
      - id: gradient.check.b
        retired: true
        prompt: At w=1, x=2, y=6 and h=0.001, L(w+h)=15.984004 and L(w-h)=16.016004. A program reports gradient -8. Which conclusion is justified?
        options:
          - id: agrees
            text: The numerical check gives -8
            so the report agrees.: null
          - id: mismatch
            text: The numerical check gives approximately -16; investigate the formula or implementation before relying on -8.
          - id: wrong_input
            text: Any difference proves the training data must be wrong.
        answer: mismatch
        feedback: (-0.032)/0.002 = -16, matching 2*2*(2-6). The reported -8 disagrees; the cause still needs investigation.
  - id: loss.calculate.v2
    objective_ref: objective.loss-meaning
    task: base
    response_type: numeric
    points: 1
    absolute_tolerance: 0.001
    hint: Multiply weight by input to get the prediction, subtract the target, then square the result. A miss below the target still gives a positive loss.
    remediation_scene: s03-error
    variants:
      - id: loss.calculate.v2.1
        prompt: A rule predicts prediction = weight × input. With weight 2 and input 4, the target is 5. What is the squared error?
        answer: 9
        feedback: The prediction is 2 × 4 = 8, the error is 8 − 5 = 3, and 3² = 9. Forgetting to square gives 3.
      - id: loss.calculate.v2.2
        prompt: A rule predicts prediction = weight × input. With weight 0.5 and input 6, the target is 4. What is the squared error?
        answer: 1
        feedback: The prediction is 0.5 × 6 = 3, the error is 3 − 4 = −1, and (−1)² = 1. The minus sign disappears when you square, so the loss is not −1.
      - id: loss.calculate.v2.3
        prompt: A rule predicts prediction = weight × input. With weight 1.5 and input 2, the target is 5. What is the squared error?
        answer: 4
        feedback: The prediction is 1.5 × 2 = 3, the error is 3 − 5 = −2, and (−2)² = 4. A too-low guess costs the same as a too-high guess of the same size.
      - id: loss.calculate.v2.4
        prompt: A rule predicts prediction = weight × input. With weight 3 and input 1.5, the target is 3. What is the squared error?
        answer: 2.25
        feedback: The prediction is 3 × 1.5 = 4.5, the error is 4.5 − 3 = 1.5, and 1.5² = 2.25. Squaring a number between 1 and 2 gives a larger number, not a smaller one.
  - id: loss.compare.v2
    objective_ref: objective.loss-meaning
    task: transfer
    response_type: single_choice
    points: 1
    hint: Square each miss before you compare. The sign of an error tells you which side of the target you landed on, not how costly the miss was.
    remediation_scene: s03-error
    variants:
      - id: loss.compare.v2.1
        prompt: A thermostat model predicts 68 °F on Monday and 72 °F on Tuesday. The real temperature was 70 °F both days. How do the two squared errors compare?
        options:
          - id: b
            text: Monday's is −4 and Tuesday's is +4, so they cancel out
          - id: a
            text: Both are 4, because each day missed by 2 degrees
          - id: c
            text: Tuesday's is larger, since guessing too high costs more
        answer: a
        feedback: The errors are −2 and +2, and both square to 4. Squared error never goes negative, so the two days can't cancel, and it treats too-high and too-low misses of the same size equally.
      - id: loss.compare.v2.2
        prompt: On two examples, model A misses by 1 each time. Model B gets one exactly right and misses the other by 2. Which has the lower total squared error?
        options:
          - id: c
            text: They tie, because each model is off by 2 in total
          - id: b
            text: Model B, because it gets one example exactly right
          - id: a
            text: Model A, with a total of 2 compared with B's 4
        answer: a
        feedback: A's total is 1² + 1² = 2, and B's is 0² + 2² = 4. Squaring punishes one big miss more than two small ones, so counting the total distance (2 each) would wrongly call it a tie.
      - id: loss.compare.v2.3
        prompt: A price model predicts $10 for an order that cost $7. A second model predicts $4 for the same order. A classmate says the second is better because its error, −3, is smaller. What is the best reply?
        options:
          - id: a
            text: Its loss is −9, which is lower, so the classmate is right
          - id: c
            text: The first is better, since overshooting beats undershooting
          - id: b
            text: Both losses are 9, since each misses the price by $3
        answer: b
        feedback: The errors are +3 and −3, and each squares to 9. A negative error means the guess was too low; it doesn't make the loss smaller, and neither direction is favored.
      - id: loss.compare.v2.4
        prompt: After training on one example, a model with weight 3 reaches loss 0 on that example. What does the 0 tell you?
        options:
          - id: c
            text: The model will price every new order exactly right
          - id: a
            text: The prediction exactly matches this example's target
          - id: b
            text: The learning rate was set to its best possible value
        answer: a
        feedback: Loss 0 means prediction equals target on this example. It says nothing about new orders, which you'd have to test, and many different learning rates could have reached the same weight.
  - id: update.trace.v2
    objective_ref: objective.update-consequence
    task: base
    response_type: numeric
    points: 1
    absolute_tolerance: 0.001
    hint: Multiply the learning rate by the gradient first, then subtract that product from the old weight. Subtracting a negative number moves the weight up.
    remediation_scene: s07-update
    variants:
      - id: update.trace.v2.1
        prompt: Using new weight = old weight − learning rate × gradient, the old weight is 2, the learning rate is 0.05, and the gradient is −8. What is the new weight?
        answer: 2.4
        feedback: The step is 0.05 × (−8) = −0.4, and 2 − (−0.4) = 2.4. Adding the product instead of subtracting would give 1.6, the uphill direction.
      - id: update.trace.v2.2
        prompt: Using new weight = old weight − learning rate × gradient, the old weight is 5, the learning rate is 0.1, and the gradient is 12. What is the new weight?
        answer: 3.8
        feedback: The step is 0.1 × 12 = 1.2, and 5 − 1.2 = 3.8. A positive gradient means the loss rises as the weight rises, so the update lowers the weight.
      - id: update.trace.v2.3
        prompt: Using new weight = old weight − learning rate × gradient, the old weight is −1, the learning rate is 0.2, and the gradient is −3. What is the new weight?
        answer: -0.4
        feedback: The step is 0.2 × (−3) = −0.6, and −1 − (−0.6) = −0.4. The negative gradient pushes the weight up, from −1 toward zero.
      - id: update.trace.v2.4
        prompt: Using new weight = old weight − learning rate × gradient, the old weight is 0.5, the learning rate is 0.01, and the gradient is 30. What is the new weight?
        answer: 0.2
        feedback: The step is 0.01 × 30 = 0.3, and 0.5 − 0.3 = 0.2. Forgetting the learning rate would subtract the whole gradient and give −29.5.
  - id: update.diagnose.v2
    objective_ref: objective.update-consequence
    task: transfer
    response_type: numeric_fields_with_reason
    points: 1
    absolute_tolerance: 0.001
    numeric_fields:
      - id: weight
        label: New weight
      - id: prediction
        label: New prediction
      - id: loss
        label: New squared error
    reason_label: What did this step do to the prediction?
    hint: Compute old weight − rate × gradient, multiply by the input, and square prediction − target. Then compare the new miss with the old one, and check whether the prediction crossed the target.
    remediation_scene: s09-compare
    variants:
      - id: update.diagnose.v2.1
        prompt: A model predicts weight × 2 with target 4. The old weight is 1 (prediction 2, squared error 4) and the gradient there is −8. Take one step with learning rate 0.2. Enter the new weight, prediction, and squared error, then choose what the step did.
        answers:
          weight: 2.6
          prediction: 5.2
          loss: 1.44
        reason_options:
          - id: crossed_farther
            text: It jumped past the target and ended farther away
          - id: same_side
            text: It stayed below the target and moved closer
          - id: crossed_closer
            text: It jumped past the target but ended closer
        reason_answer: crossed_closer
        feedback: The weight is 1 − 0.2 × (−8) = 2.6, the prediction is 5.2, and the loss is (5.2 − 4)² = 1.44. The prediction passed 4, but it now misses by 1.2 instead of 2, so this is overshooting while still improving, not diverging.
      - id: update.diagnose.v2.2
        prompt: A model predicts weight × 1 with target 3. The old weight is 1 (prediction 1, squared error 4) and the gradient there is −4. Take one step with learning rate 1.25. Enter the new weight, prediction, and squared error, then choose what the step did.
        answers:
          weight: 6
          prediction: 6
          loss: 9
        reason_options:
          - id: crossed_closer
            text: It jumped past the target but ended closer
          - id: crossed_farther
            text: It jumped past the target and ended farther away
          - id: same_side
            text: It stayed below the target and moved closer
        reason_answer: crossed_farther
        feedback: The weight is 1 − 1.25 × (−4) = 6, the prediction is 6, and the loss is (6 − 3)² = 9. The miss grew from 2 to 3, so the loss rose. The direction was right but the step was too big; repeating it would diverge.
      - id: update.diagnose.v2.3
        prompt: A model predicts weight × 2 with target 6. The old weight is 4 (prediction 8, squared error 4) and the gradient there is 8. Take one step with learning rate 0.05. Enter the new weight, prediction, and squared error, then choose what the step did.
        answers:
          weight: 3.6
          prediction: 7.2
          loss: 1.44
        reason_options:
          - id: same_side
            text: It stayed above the target and moved closer
          - id: crossed_closer
            text: It jumped past the target but ended closer
          - id: crossed_farther
            text: It jumped past the target and ended farther away
        reason_answer: same_side
        feedback: The weight is 4 − 0.05 × 8 = 3.6, the prediction is 7.2, and the loss is (7.2 − 6)² = 1.44. The prediction is still above 6, now by 1.2 instead of 2. A small step like this approaches the target from one side without crossing it.
      - id: update.diagnose.v2.4
        prompt: A model predicts weight × 3 with target 6. The old weight is 0 (prediction 0, squared error 36) and the gradient there is −36. Take one step with learning rate 0.15. Enter the new weight, prediction, and squared error, then choose what the step did.
        answers:
          weight: 5.4
          prediction: 16.2
          loss: 104.04
        reason_options:
          - id: crossed_closer
            text: It jumped past the target but ended closer
          - id: same_side
            text: It stayed below the target and moved closer
          - id: crossed_farther
            text: It jumped past the target and ended farther away
        reason_answer: crossed_farther
        feedback: The weight is 0 − 0.15 × (−36) = 5.4, the prediction is 16.2, and the loss is (16.2 − 6)² = 104.04. The miss grew from 6 to 10.2. Crossing the target isn't the problem by itself; ending farther away is.
  - id: gradient.calculate.v2
    objective_ref: objective.scalar-gradient
    task: base
    response_type: numeric
    points: 1
    absolute_tolerance: 0.001
    hint: For L = (wx − y)², the chain rule gives dL/dw = 2x(wx − y). Find the error wx − y first, then multiply by 2 and by x.
    remediation_scene: s06-derivative
    variants:
      - id: gradient.calculate.v2.1
        prompt: For L = (wx − y)², find dL/dw at x = 3, y = 6, and w = 1.
        answer: -18
        feedback: The error is 3 − 6 = −3, so dL/dw = 2 × 3 × (−3) = −18. Leaving out the factor x (the inner derivative) would give −6.
      - id: gradient.calculate.v2.2
        prompt: For L = (wx − y)², find dL/dw at x = 2, y = 6, and w = 4.
        answer: 8
        feedback: The error is 8 − 6 = 2, so dL/dw = 2 × 2 × 2 = 8. The positive sign says the loss rises if w rises, so descent would lower w.
      - id: gradient.calculate.v2.3
        prompt: For L = (wx − y)², find dL/dw at x = 1, y = 5, and w = 2.
        answer: -6
        feedback: The error is 2 − 5 = −3, so dL/dw = 2 × 1 × (−3) = −6. Squaring the error instead of doubling it would give 9, which is the loss, not its slope.
      - id: gradient.calculate.v2.4
        prompt: For L = (wx − y)², find dL/dw at x = 0.5, y = 1, and w = 4.
        answer: 1
        feedback: The error is 2 − 1 = 1, so dL/dw = 2 × 0.5 × 1 = 1. Forgetting the inner factor x = 0.5 would double the answer to 2.
  - id: gradient.check.v2
    objective_ref: objective.scalar-gradient
    task: transfer
    response_type: single_choice
    points: 1
    hint: Divide the difference of the two losses by the gap between the two weights, which is 2h. Then compare that estimate with the reported gradient, sign included.
    remediation_scene: s06-derivative
    variants:
      - id: gradient.check.v2.1
        prompt: For L = (wx − y)² at w = 0, x = 1, y = 3, and h = 0.001, the losses are L(w + h) = 8.994001 and L(w − h) = 9.006001. A program reports gradient −6. What does the check show?
        options:
          - id: b
            text: The estimate is +6, so the program has the sign flipped
          - id: c
            text: The estimate is −12, so the program is off by a factor of 2
          - id: a
            text: The estimate is −6, which matches the program at this point
        answer: a
        feedback: (8.994001 − 9.006001) / 0.002 = −0.012 / 0.002 = −6, matching 2 × 1 × (0 − 3). Dividing by h instead of 2h gives the tempting −12.
      - id: gradient.check.v2.2
        prompt: For L = (wx − y)² at w = 1, x = 2, y = 6, and h = 0.001, the losses are L(w + h) = 15.984004 and L(w − h) = 16.016004. A program reports gradient −8. What does the check show?
        options:
          - id: b
            text: The estimate is −16, so the program's −8 is too small
          - id: a
            text: The estimate is −8, so the program's result is right
          - id: c
            text: The estimate is −32, so the program is off by a factor of 4
        answer: b
        feedback: (15.984004 − 16.016004) / 0.002 = −0.032 / 0.002 = −16, which equals 2 × 2 × (2 − 6). The program's −8 is half that, a sign that its formula is missing a factor of 2. The −32 comes from dividing by h instead of 2h.
      - id: gradient.check.v2.3
        prompt: For L = (wx − y)² at w = 2, x = 1, y = 4, and h = 0.01, the losses are L(w + h) = 3.9601 and L(w − h) = 4.0401. A program reports gradient +4. What does the check show?
        options:
          - id: c
            text: The estimate is −8, so the program is off by a factor of 2
          - id: b
            text: The estimate is −4, so the program has the sign flipped
          - id: a
            text: The estimate has size 4, so the program's result is right
        answer: b
        feedback: (3.9601 − 4.0401) / 0.02 = −0.08 / 0.02 = −4, and 2 × 1 × (2 − 4) = −4 agrees. The program's +4 has the right size but the wrong sign, which would send training uphill. That can happen if the code computes y − wx instead of wx − y.
      - id: gradient.check.v2.4
        prompt: For L = (wx − y)² at w = 0.5, x = 2, y = 3, and h = 0.001, the losses are L(w + h) = 3.992004 and L(w − h) = 4.008004. A program reports gradient −8. What does the check show?
        options:
          - id: a
            text: The estimate is +8, so the program has the sign flipped
          - id: c
            text: The estimate is −8, which matches the program at this point
          - id: b
            text: The estimate is −16, so the program's −8 is too small
        answer: c
        feedback: (3.992004 − 4.008004) / 0.002 = −0.016 / 0.002 = −8, matching 2 × 2 × (1 − 3). Subtracting the losses in the wrong order gives +8, and dividing by h gives −16.
