entry_check:
  id: check.core-preparation
  placement: s01-rule
  purpose: Identify a missing operation and offer its bridge before it is used.
  evidence_scope: diagnostic_practice_only
  skip_rule: Skip an item when compatible evidence already establishes its referenced prerequisite; this brief
    check does not award prerequisite mastery.
  feedback_reveal: After an answer or an explicit show-worked-example action, never beside the unanswered prompt.
  on_gap: Offer the referenced bridge and preserve the lesson return point; unavailable bridge content is an
    explicit draft/publication gap.
  items:
  - id: entry.multiply
    requirement_ref: requirement.arithmetic
    response_type: numeric
    prompt: What is 0.1 multiplied by 2?
    answer: 0.2
    absolute_tolerance: 1.0e-06
    feedback: One tenth of two is two tenths, or 0.2.
  - id: entry.square
    requirement_ref: requirement.arithmetic
    response_type: numeric
    prompt: Subtract 4 from 2, then multiply the result by itself. What do you get?
    answer: 4
    absolute_tolerance: 1.0e-06
    feedback: 2-4 is -2; (-2)*(-2) is 4.
  - id: entry.function
    requirement_ref: requirement.function
    response_type: numeric
    prompt: The rule is prediction = weight times input. What does weight 2 predict for input 3?
    answer: 6
    absolute_tolerance: 1.0e-06
    feedback: Substitute the two numbers into the rule; 2 times 3 is 6.
