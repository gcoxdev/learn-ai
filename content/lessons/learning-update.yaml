simulation:
  id: simulation.scalar-descent
  engine_id: scalar-squared-error-descent
  engine_version: 1-proposed
  implementation_status: planned
  formula_policy: Formulas below are display/reference strings, never executable expressions.
  definitions:
    prediction: w*x
    loss: (w*x-y)^2
    gradient: 2*x*(w*x-y)
    update: w_next = w - rate*gradient
    update_convention: Compute the gradient at the old weight, then calculate the next prediction and loss.
  initial_parameters:
    x: 2
    y: 6
    initial_weight: 0
    rate: 0.1
  controls:
    initial_weight:
      min: -6
      max: 12
      step: 0.1
    rate:
      min: 0
      max: 0.3
      step: 0.01
    max_steps: 12
    actions:
    - predict
    - step
    - pause
    - reset
    - select_trace_row
    - compare_reference_runs
    guard: Stop and explain if a value becomes nonfinite or its magnitude exceeds 1000000; never silently clamp
      an update.
  accessibility:
    keyboard: Labeled numeric inputs and native buttons; no dragging or timed reaction required.
    text_mode: Present the same parameters, step controls and results as a table with labeled column headers.
    status: Announce the result of one requested step concisely; do not read the entire growing table automatically.
    reduced_motion: Update numbers and table rows without animated movement.
    columns:
    - step
    - weight
    - prediction
    - loss
    - gradient_at_this_weight
    comparison: Name each learning rate in text; do not distinguish curves by color alone.
  reference_cases:
  - id: trace.decreasing
    parameters:
      x: 2
      y: 6
      initial_weight: 0
      rate: 0.1
    rows:
    - step: 0
      weight: 0
      prediction: 0
      loss: 36
      gradient: -24
    - step: 1
      weight: 2.4
      prediction: 4.8
      loss: 1.44
      gradient: -4.8
    - step: 2
      weight: 2.88
      prediction: 5.76
      loss: 0.0576
      gradient: -0.96
    - step: 3
      weight: 2.976
      prediction: 5.952
      loss: 0.002304
      gradient: -0.192
  - id: trace.overshoot-decreasing
    parameters:
      x: 2
      y: 6
      initial_weight: 0
      rate: 0.2
    rows:
    - step: 0
      weight: 0
      prediction: 0
      loss: 36
      gradient: -24
    - step: 1
      weight: 4.8
      prediction: 9.6
      loss: 12.96
      gradient: 14.4
    - step: 2
      weight: 1.92
      prediction: 3.84
      loss: 4.6656
      gradient: -8.64
    - step: 3
      weight: 3.648
      prediction: 7.296
      loss: 1.679616
      gradient: 5.184
  - id: trace.diverging
    parameters:
      x: 2
      y: 6
      initial_weight: 0
      rate: 0.3
    rows:
    - step: 0
      weight: 0
      prediction: 0
      loss: 36
      gradient: -24
    - step: 1
      weight: 7.2
      prediction: 14.4
      loss: 70.56
      gradient: 33.6
    - step: 2
      weight: -2.88
      prediction: -5.76
      loss: 138.2976
      gradient: -47.04
    - step: 3
      weight: 11.232
      prediction: 22.464
      loss: 271.063296
      gradient: 65.856
  absolute_reference_tolerance: 1.0e-06
scenes:
- id: s01-rule
  type: explanation
  title: A rule with one adjustable number
  depth: intuition
  objective_refs:
  - objective.loss-meaning
  - objective.update-consequence
  entry_check_ref: check.core-preparation
  markdown: 'Imagine a toy predictor that doubles its input when its weight is 2.

    Its rule is **prediction = weight × input**. The weight is the number

    we can change. We are given one example: input 2 should produce target 6.

    A weight of 3 would fit this one example exactly. We will start at 0

    to see how a learning rule can move toward a better prediction.

    A model does not have to know the right answer in advance: training

    uses example targets to measure mistakes and adjust parameters.

    '
  text_mode: Same complete prose; no diagram carries additional meaning.
  source_refs:
  - source.toy-algebra
- id: s02-explore
  type: simulation
  title: Predict before changing the weight
  depth: intuition
  objective_refs:
  - objective.update-consequence
  simulation_ref: simulation.scalar-descent
  mode: manual_weight
  markdown: 'Keep input 2 and target 6 fixed. Predict the output for weights 0, 1 and 3.

    Commit your predictions, or choose the worked example, before opening

    the results. Then explore other initial weights and reset to 0.

    '
  prediction_activity:
    id: practice.weight-predictions
    response_type: numeric_fields
    fields:
    - id: at_zero
      label: Prediction with weight 0
      answer: 0
    - id: at_one
      label: Prediction with weight 1
      answer: 2
    - id: at_three
      label: Prediction with weight 3
      answer: 6
    reveal_after: submit_or_show_worked_example
    result_controls: Hide computed predictions until the activity is committed or explicitly skipped to the
      worked example.
    reveal_markdown: 'The outputs are 0, 2 and 6. Each is the selected weight multiplied

      by input 2. Changing a weight changes the prediction; changing

      the target changes the task instead.

      '
    evidence_scope: practice_only
  text_mode: Present labeled prediction fields before a submit/show-example button; reveal the same result
    prose and accessible simulation table afterward.
  source_refs:
  - source.toy-algebra
- id: s03-error
  type: table
  title: Measure the mistake
  depth: mechanics
  objective_refs:
  - objective.loss-meaning
  markdown: 'First subtract target from prediction. Then multiply that difference

    by itself. This is squared error, our **loss** for this example.

    A negative difference is allowed; squaring it makes a nonnegative loss.

    Loss 0 means an exact fit to this example, not proof about unseen inputs.

    '
  columns:
  - weight
  - prediction
  - prediction_minus_target
  - squared_error
  rows:
  - - 0
    - 0
    - -6
    - 36
  - - 1
    - 2
    - -4
    - 16
  - - 3
    - 6
    - 0
    - 0
  text_mode: Weight 0 predicts 0 with difference -6 and loss 36; weight 1 predicts 2 with loss 16; weight 3
    predicts 6 with loss 0.
  bridge_refs:
  - requirement.arithmetic
  source_refs:
  - source.toy-algebra
- id: s04-predict
  type: question
  title: Which direction looks useful?
  depth: intuition
  objective_refs:
  - objective.update-consequence
  markdown: With weight 0, input 2 and target 6, which small change could bring the prediction closer to the
    target?
  question:
    id: practice.direction
    response_type: single_choice
    options:
    - id: increase
      text: Increase the weight slightly.
    - id: decrease
      text: Decrease the weight slightly.
    answer: increase
    hint: The prediction is currently 0 and needs to move toward 6.
    feedback: Increasing the weight slightly raises the prediction toward 6. This does not mean any size increase
      is helpful.
    evidence_scope: practice_only
  text_mode: Native labeled radio options and a submit button; feedback follows the prompt in reading order.
  source_refs:
  - source.toy-algebra
- id: s05-slope
  type: explanation
  title: A local slope suggests a direction
  depth: intuition
  objective_refs:
  - objective.update-consequence
  markdown: 'Near weight 0, increasing the weight a little lowers loss. The local

    slope is negative: loss goes down as weight goes up. The **gradient**

    is the slope with respect to the weight in this one-number example.

    The **learning rate** controls how large a step we take opposite it.

    You can use a supplied gradient without calculating a derivative.

    The optional mathematics scene explains where the gradient comes from.

    '
  text_mode: Same prose; the direction is explained without a graph.
  visual:
    id: visual.loss-curve
    kind: curve_with_current_point_and_local_slope
    engine_ref: simulation.scalar-descent
    implementation_status: planned_declarative_visual
    horizontal_axis:
      label: Weight w
      initial_domain:
      - -1
      - 7
    vertical_axis:
      label: Squared error on this example
      initial_domain:
      - 0
      - 70
    bindings:
      curve: Registered engine loss at candidate weights with the current fixed x and y
      current_point: Current selected trace row's weight and loss, or current manual initial weight and its
        loss
      local_slope: Registered engine gradient at that same weight; show only when requested
    outside_domain: Expand and relabel axes to include the selected finite point; do not clip it silently.
    reference_parameters:
      x: 2
      y: 6
    reference_points:
    - - -1
      - 64
    - - 0
      - 36
    - - 1
      - 16
    - - 2
      - 4
    - - 3
      - 0
    - - 4
      - 4
    - - 5
      - 16
    - - 6
      - 36
    - - 7
      - 64
    text_equivalent: Use a labeled weight/loss table containing the reference points and selected live point.
      At weight 0, nearby increases lower loss; at weight 3 the toy loss is zero. Announce the requested local
      slope in words as well as a number.
    controls: Labeled weight input, select-current-row button and optional show-slope button; no pointer-only
      interaction.
  bridge_refs:
  - requirement.function
  - requirement.derivative
  source_refs:
  - source.toy-algebra
- id: s06-derivative
  type: equation
  title: Where does minus twenty-four come from?
  depth: mathematics
  objective_refs:
  - objective.scalar-gradient
  requirement_refs:
  - requirement.derivative
  - requirement.chain-rule
  markdown: 'Start with a numerical slope: compare losses at w+h and w-h,

    subtract, and divide by 2h. Here h is a small change in weight.

    At w=0 with h=0.001, the centered finite difference is -24 up to

    numerical rounding. This quadratic makes the centered check exact in

    exact arithmetic; general functions have approximation error too.

    Now derive it. Write the inner error as w*x-y. The outer square has

    derivative twice its input, and the inner expression has derivative x

    with respect to w. The chain rule multiplies these: dL/dw = 2*(w*x-y)*x.

    At x=2, y=6 and w=0, that is 2*(-6)*2 = -24, agreeing with the check.

    '
  latex: \frac{dL}{dw}=2x(wx-y),\qquad w_{t+1}=w_t-\eta\,2x(w_tx-y)
  spoken_reading: The loss derivative is twice the input, multiplied by the difference between prediction and
    target. The next weight is the old weight minus the product of learning rate and its gradient.
  symbols:
    L: Squared error on this one example
    w: Adjustable scalar weight
    x: Fixed example input
    y: Fixed example target
    eta: Learning rate, shown as the Greek letter eta
    t: Update count, not elapsed time
    h: Small weight perturbation for the numerical check
  text_mode: The prose contains the full derivation and defines each operation.
  bridge_refs:
  - requirement.derivative
  - requirement.chain-rule
  source_refs:
  - source.toy-algebra
- id: s07-update
  type: explanation
  title: Take one measured step
  depth: mechanics
  objective_refs:
  - objective.loss-meaning
  - objective.update-consequence
  markdown: 'Use **new weight = old weight - learning rate × gradient**.

    With old weight 0, rate 0.1 and gradient -24, the new weight is

    0 - 0.1*(-24) = 2.4. Subtracting a negative increases the weight.

    The new prediction is 2.4*2 = 4.8. The new loss is (4.8-6)^2 = 1.44.

    We improved this example''s fit from loss 36 to 1.44. On the next step

    we must calculate the gradient at the new weight; it is no longer -24.

    '
  text_mode: All intermediate values are present in reading order.
  source_refs:
  - source.toy-algebra
- id: s08-repeat
  type: simulation
  title: Watch several updates
  depth: mechanics
  objective_refs:
  - objective.update-consequence
  simulation_ref: simulation.scalar-descent
  mode: step_and_compare
  markdown: 'After the first step at rate 0.1, will the next weight change be the

    same size, smaller or larger? Commit a prediction before revealing

    the remaining trace. Then pause, inspect rows and compare other rates,

    always resetting to the same starting example and weight.

    '
  prediction_activity:
    id: practice.next-step-size
    initial_reference:
      case_ref: trace.decreasing
      visible_through_step: 1
    initialization: Initialize this activity's reference run on first entry only; preserve committed answers,
      revealed rows and cursor when resuming from a detour.
    response_type: single_choice
    options:
    - id: same
      text: The next change will be the same size.
    - id: smaller
      text: The next change will be smaller.
    - id: larger
      text: The next change will be larger.
    answer: smaller
    reveal_after: submit_or_show_worked_example
    result_controls: Initially show only steps 0 and 1 at rate 0.1; unlock further rows, the full reference
      trace and comparison after submit/show-example.
    reveal_markdown: 'The next change is smaller. The first three learned weights are

      2.4, 2.88 and 2.976: the gradient changes as the weight changes.

      Inspect the row-by-row loss and gradient to see this connection.

      '
    evidence_scope: practice_only
  reference_case_refs:
  - trace.decreasing
  - trace.overshoot-decreasing
  - trace.diverging
  text_mode: Read the prompt and labeled choices before the result. The same reveal rule, step/pause/reset
    buttons and result table apply without animation.
  source_refs:
  - source.toy-algebra
- id: s09-compare
  type: table
  title: Overshooting and divergence are different
  depth: mechanics
  objective_refs:
  - objective.loss-meaning
  - objective.update-consequence
  markdown: 'Rate 0.2 jumps beyond the ideal weight 3, but its errors shrink across

    this trace. Rate 0.3 produces errors that grow. Crossing the optimum

    once does not by itself prove divergence. A step that helped in one

    example does not establish that a rate works for every model or task.

    '
  columns:
  - rate
  - initial_loss
  - loss_after_one_step
  - loss_after_three_steps
  rows:
  - - 0.1
    - 36
    - 1.44
    - 0.002304
  - - 0.2
    - 36
    - 12.96
    - 1.679616
  - - 0.3
    - 36
    - 70.56
    - 271.063296
  text_mode: All runs start at loss 36. After three steps, rates 0.1 and 0.2 have lower loss, while rate 0.3
    has higher loss. The exact values are in the table.
  source_refs:
  - source.toy-algebra
- id: s10-limits
  type: explanation
  title: What this example leaves out
  depth: intuition
  objective_refs:
  - objective.loss-meaning
  - objective.update-consequence
  markdown: 'We fitted one point using one weight, with no intercept. Real training

    can combine errors over many examples and adjust many parameters.

    Improving training loss alone does not establish performance on new

    data. This lesson does not yet teach mini-batch sampling, noisy gradients,

    multiple-weight derivatives or neural-network backpropagation.

    The toy trace lets us inspect one update rule without those extra parts.

    '
  text_mode: Same complete prose; no additional meaning depends on a visual.
  source_refs:
  - source.toy-algebra
  - source.design
- id: s11-check
  type: assessment
  title: Apply the ideas to new examples
  depth: mechanics
  objective_refs:
  - objective.loss-meaning
  - objective.update-consequence
  - objective.scalar-gradient
  markdown: 'Try fresh examples without hints for independent evidence. If a check

    reveals a gap, use the explanation or bridge, then attempt an unused

    equivalent variant. Mathematics checks appear only on that prepared path.

    This draft cannot award course credit before its content and keys are reviewed.

    '
  assessment_refs:
  - gate.core
  - gate.mathematics
  gate_binding: Use navigation.gate_visibility and the active credit scope; the mathematics gate is absent
    from core credit and preview attempts award no evidence.
  text_mode: Use labeled number fields or radio options; no timed or drag-only response.
  source_refs:
  - source.design
- id: s12-recap
  type: recap
  title: Prediction, error, update, repeat
  depth: intuition
  objective_refs:
  - objective.loss-meaning
  - objective.update-consequence
  markdown: 'A weight changes a prediction. A loss measures a chosen kind of error.

    A gradient describes local change, and the learning rate scales an

    update opposite that gradient. Recompute the gradient after each step.

    Compare actual errors to decide what happened; larger steps are not

    always better, and training error is not the whole evaluation story.

    Continue in your syllabus or choose the optional derivative preparation.

    '
  next_action: Resume the current path at its next unsatisfied objective.
  text_mode: Same recap and standard syllabus navigation.
  source_refs:
  - source.toy-algebra
  - source.design
assessment_policy:
  status: draft_only_no_credit
  selection: Select one unused variant from each required family; version and record the selection.
  hinted_attempt: Practice only; use an unused variant for later independent evidence.
  exhausted_pool: Keep practice available and mark independent reassessment unavailable until a reviewed new
    variant exists; do not relabel a repeat as fresh evidence.
  limitations: Two variants per family demonstrate syntax only; expand and review the bank before a course
    release.
  numeric_scoring: Reject nonnumeric/nonfinite input and use the declared absolute tolerance.
  structured_scoring: A numeric_fields_with_reason item passes only if every declared numeric field meets its
    tolerance and the selected reason matches its key. Field feedback can diagnose gaps, but partial fields
    do not establish the family evidence.
  prediction_scoring: Formative prediction and entry-check answers never count as gate evidence; worked-example/solution
    exposure is recorded and is not an independent attempt.
  option_scoring: Compare stable option IDs, not rendered answer positions.
  gates:
  - id: gate.core
    depths:
    - intuition
    - mechanics
    objective_refs:
    - objective.loss-meaning
    - objective.update-consequence
    family_refs:
    - loss.calculate
    - loss.compare
    - update.trace
    - update.diagnose
    minimum_overall_fraction: 0.8
    minimum_correct_per_objective: 2
    note: With four one-point items covering two critical objectives, the two-check rule requires four correct
      answers; 80% cannot mask a missing objective.
  - id: gate.mathematics
    depths:
    - mathematics
    objective_refs:
    - objective.scalar-gradient
    family_refs:
    - gradient.calculate
    - gradient.check
    minimum_overall_fraction: 0.8
    minimum_correct_per_objective: 2
    note: Adds formal evidence; never erases existing conceptual credit or awards implementation/research competence.
assessment_families:
- id: loss.calculate
  objective_ref: objective.loss-meaning
  task: base
  response_type: numeric
  points: 1
  absolute_tolerance: 1.0e-06
  hint: Subtract target from prediction, then multiply the difference by itself.
  remediation_scene: s03-error
  variants:
  - id: loss.calculate.a
    prompt: A predictor outputs 3 and the target is 5. What is the squared error?
    answer: 4
    feedback: The difference is -2; (-2)*(-2) = 4.
  - id: loss.calculate.b
    prompt: A predictor outputs 7 and the target is 4. What is the squared error?
    answer: 9
    feedback: The difference is 3; 3*3 = 9.
- id: loss.compare
  objective_ref: objective.loss-meaning
  task: transfer
  response_type: single_choice
  points: 1
  hint: Errors on opposite sides of the target can have the same magnitude.
  remediation_scene: s03-error
  variants:
  - id: loss.compare.a
    prompt: Predictor A outputs 2 and B outputs 6 for target 4. Which statement about their squared errors
      is correct?
    options:
    - id: equal
      text: Both have loss 4; being below the target does not make squared loss negative.
    - id: a_negative
      text: A has negative squared loss and B has positive squared loss.
    - id: b_better
      text: B has lower loss because its prediction is larger.
    answer: equal
    feedback: Differences -2 and 2 both square to 4; magnitude matters here, not the side of the target.
  - id: loss.compare.b
    prompt: Predictor A outputs 1 and B outputs 7 for target 4. Which statement about their squared errors
      is correct?
    options:
    - id: a_better
      text: A has lower squared error because 1 is the smaller prediction.
    - id: equal
      text: Both have loss 9; they miss by the same distance on opposite sides.
    - id: negative
      text: Both losses are negative because neither prediction is correct.
    answer: equal
    feedback: Differences -3 and 3 both square to 9. A prediction's size alone does not rank its error.
- id: update.trace
  objective_ref: objective.update-consequence
  task: base
  response_type: numeric
  points: 1
  absolute_tolerance: 1.0e-06
  hint: Multiply the supplied gradient by the rate, then subtract that product from the old weight.
  remediation_scene: s07-update
  variants:
  - id: update.trace.a
    prompt: Old weight is 1, learning rate 0.1 and gradient -4. Using new = old - rate*gradient, what is the
      new weight?
    answer: 1.4
    feedback: 1 - 0.1*(-4) = 1.4; subtracting the negative product increases the weight.
  - id: update.trace.b
    prompt: Old weight is 3, learning rate 0.2 and gradient 5. Using new = old - rate*gradient, what is the
      new weight?
    answer: 2
    feedback: 3 - 0.2*5 = 2; a positive gradient makes this update decrease the weight.
- id: update.diagnose
  objective_ref: objective.update-consequence
  task: transfer
  response_type: numeric_fields_with_reason
  points: 1
  absolute_tolerance: 1.0e-06
  numeric_fields:
  - id: weight
    label: New weight
  - id: prediction
    label: New prediction
  - id: loss
    label: New squared error
  reason_label: Why is this update worse on the example?
  evidence_boundary: Establishes a numerical mechanism trace and structured causal diagnosis; independently
    produced prose is assessed separately by the pilot rubric.
  hint: Calculate old weight minus rate times gradient, substitute into the prediction rule, and square prediction
    minus target. Compare the new distance from target with the initial distance.
  remediation_scene: s09-compare
  variants:
  - id: update.diagnose.a
    prompt: Prediction is 2*w, target is 4, old weight is 1 and its gradient is -8. Initial squared error is
      4. Rate 0.1 would give weight 1.8, prediction 3.6 and loss 0.16. Instead use rate 0.3. Enter its new
      weight, prediction and squared error, then choose the reason for the result.
    parameters:
      x: 2
      y: 4
      old_weight: 1
      gradient: -8
      rate: 0.3
    answers:
      weight: 3.4
      prediction: 6.8
      loss: 7.84
    reason_options:
    - id: farther
      text: The step sends the prediction past the target and farther away than it started.
    - id: any_crossing
      text: Any step past the target must worsen error
      even if its final distance is smaller.: null
    - id: positive_rate
      text: Using a positive learning rate always increases error
      regardless of the prediction and target.: null
    reason_answer: farther
    feedback: The new weight is 1-0.3*(-8)=3.4, prediction 6.8, and squared error (6.8-4)^2=7.84. Distance
      from the target grows from 2 to 2.8. The direction initially helped, but this step went too far. Crossing
      the target alone does not imply worsening; the final error matters.
  - id: update.diagnose.b
    prompt: Prediction is 1*w, target is 3, old weight is 1 and its gradient is -4. Initial squared error is
      4. Rate 0.5 would give weight 3 and loss 0. Instead use rate 1.5. Enter its new weight, prediction and
      squared error, then choose the reason for the result.
    parameters:
      x: 1
      y: 3
      old_weight: 1
      gradient: -4
      rate: 1.5
    answers:
      weight: 7
      prediction: 7
      loss: 16
    reason_options:
    - id: negative_gradient
      text: Every negative gradient raises error because subtracting a negative changes the weight upward.
    - id: farther
      text: The step passes the target and ends farther from it
      so the squared error grows.: null
    - id: any_crossing
      text: Crossing the target always worsens error even when the final prediction is closer.
    reason_answer: farther
    feedback: Weight 1-1.5*(-4)=7 gives prediction 7 and loss (7-3)^2=16. The initial prediction missed by
      2; the new prediction misses by 4. The chosen step size worsened this example despite a useful local
      direction. This does not prove one rate works for all models.
- id: gradient.calculate
  objective_ref: objective.scalar-gradient
  task: base
  response_type: numeric
  points: 1
  absolute_tolerance: 1.0e-06
  hint: Differentiate the outer square and multiply by the derivative of the inner prediction error.
  remediation_scene: s06-derivative
  variants:
  - id: gradient.calculate.a
    prompt: For L=(w*x-y)^2, evaluate dL/dw at x=1, y=4 and w=2. The gradient formula is not supplied in this
      assessment.
    answer: -4
    feedback: dL/dw = 2*x*(w*x-y) = 2*1*(2-4) = -4.
  - id: gradient.calculate.b
    prompt: For L=(w*x-y)^2, evaluate dL/dw at x=2, y=4 and w=1. The gradient formula is not supplied in this
      assessment.
    answer: -8
    feedback: dL/dw = 2*x*(w*x-y) = 2*2*(2-4) = -8.
- id: gradient.check
  objective_ref: objective.scalar-gradient
  task: transfer
  response_type: single_choice
  points: 1
  hint: Check both the numerical difference and the scope of what checking a single parameter can establish.
  remediation_scene: s06-derivative
  variants:
  - id: gradient.check.a
    prompt: At w=0, x=1, y=3 and h=0.001, L(w+h)=8.994001 and L(w-h)=9.006001. What does [L(w+h)-L(w-h)]/(2*h)
      tell you?
    options:
    - id: agrees
      text: It is approximately -6 and supports this local check; it does not prove an entire implementation
        correct.
    - id: positive
      text: It is approximately +6 and therefore shows the loss increases locally with the weight.
    - id: all_correct
      text: It is approximately -6 and therefore proves all gradients in the training implementation are correct.
    answer: agrees
    feedback: (-0.012)/0.002 = -6, agreeing with 2*1*(0-3). This is a local cross-check with finite-precision
      limits and no global guarantee.
  - id: gradient.check.b
    prompt: At w=1, x=2, y=6 and h=0.001, L(w+h)=15.984004 and L(w-h)=16.016004. A program reports gradient
      -8. Which conclusion is justified?
    options:
    - id: agrees
      text: The numerical check gives -8
      so the report agrees.: null
    - id: mismatch
      text: The numerical check gives approximately -16; investigate the formula or implementation before relying
        on -8.
    - id: wrong_input
      text: Any difference proves the training data must be wrong.
    answer: mismatch
    feedback: (-0.032)/0.002 = -16, matching 2*2*(2-6). The reported -8 disagrees; the cause still needs investigation.
runtime:
  slug: learning-update
  objective_prerequisites:
    objective.loss-meaning:
    - anyOf:
      - objective.prediction
    objective.update-consequence:
    - anyOf:
      - objective.loss-meaning
    objective.scalar-gradient:
    - anyOf:
      - objective.derivatives
    - anyOf:
      - objective.chain-rule
  bridge_map:
    requirement.arithmetic: arithmetic
    requirement.function: functions
    requirement.derivative: derivatives
    requirement.chain-rule: chain-rule
