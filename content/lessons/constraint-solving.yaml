lesson:
  id: constraint-solving
  version: 0.4.0-draft
  title: Remove impossible choices before searching further
  state: draft
  summary: Colour a map of Australia so no neighbours match. Watch two choices and a chain of forced moves finish the job, and see the same trick schedule your exams.
  slot: M05.4
  category: learning
  sources:
