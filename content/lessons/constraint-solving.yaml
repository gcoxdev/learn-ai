assessment_families:
- id: constraint-solving.base
  objective_ref: objective.constraint-solving
  task: base
  response_type: single_choice
  points: 1
  hint: 'Propagate a consequence: trace the inputs, operation, and result before choosing.'
  remediation_scene: constraint-solving.s2
  variants:
  - id: constraint-solving.base.1
    prompt: What is a variable’s domain?
    options:
    - id: b
      text: Only its name
    - id: c
      text: Every value in every programming language
    - id: a
      text: Its allowed candidate values
    answer: a
    feedback: Domains specify the alternatives considered for each variable.
  - id: constraint-solving.base.2
    prompt: A and B must differ, both allow red or blue, and A is red. What remains for B?
    options:
    - id: c
      text: No restriction
    - id: a
      text: Blue
    - id: b
      text: Red only
    answer: a
    feedback: Constraint propagation removes the conflicting red assignment.
- id: constraint-solving.transfer
  objective_ref: objective.constraint-solving
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Choose a suitable formal language: trace the inputs, operation, and result before choosing.'
  remediation_scene: constraint-solving.s4
  variants:
  - id: constraint-solving.transfer.1
    prompt: Every local constraint looks consistent. Is global satisfiability guaranteed in general?
    options:
    - id: c
      text: Only if variables have short names
    - id: a
      text: No; combined constraints may still conflict
    - id: b
      text: Yes; local checks always solve every problem
    answer: a
    feedback: Local consistency can prune without fully deciding the global problem.
  - id: constraint-solving.transfer.2
    prompt: A solver finds a satisfying schedule that violates an omitted requirement. Where is the problem?
    options:
    - id: a
      text: The model of the constraints was incomplete
    - id: b
      text: Satisfiability must mean the solver crashed
    - id: c
      text: All formal reasoning is impossible
    answer: a
    feedback: A solver checks encoded requirements, not unstated intentions.
