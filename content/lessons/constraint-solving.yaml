  - id: constraint-solving.s2
    title: One choice forces the next
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.constraint-solving
    markdown: |-
      Make just two choices, SA = red and then NT = green, and after each one cross out every value that can no longer work. Letters are colours (R, G, B), and a bold letter marks a choice:

      | After | WA | NT | SA | Q | NSW | V | T |
      | --- | --- | --- | --- | --- | --- | --- | --- |
      | Start | RGB | RGB | RGB | RGB | RGB | RGB | RGB |
      | SA = red, cross out neighbours' red | GB | GB | **R** | GB | GB | GB | RGB |
      | NT = green, cross out neighbours' green | B | **G** | R | B | GB | GB | RGB |
      | Q is blue, so NSW loses blue | B | G | R | B | G | GB | RGB |
      | NSW is green, so V loses green | B | G | R | B | G | B | RGB |

      Two choices, and every mainland region is forced. Tasmania can take any colour.

      The first two crossings-out are **forward checking**: after a choice, remove that value from the chosen variable's neighbours. The last two rows go further. Nobody chose Q; it was *forced* to blue, and that knock-on effect then forced NSW and V. Following such chains is **constraint propagation**.

      The standard propagation method is **arc consistency**. An arc is one direction of a constraint, such as NSW → Q. It is consistent when every value left for NSW has at least one value of Q that works with it. NSW = blue has no partner once Q is blue, so blue goes.

      :::papers AC-3 (Mackworth, 1977)
      Put every arc $X \to Y$ in a queue. Take one off, and delete each value $x$ from $X$'s domain that has no $y$ in $Y$'s domain satisfying the constraint. If $X$'s domain shrank, put every arc $Z \to X$ back in the queue, since $Z$'s values may have lost their support. Stop when the queue is empty, or report failure if some domain becomes empty. In our table, shrinking Q to {B} re-queued NSW → Q, which removed B from NSW; that re-queued V → NSW, which removed G from V. With $c$ constraints and domains of size $d$, AC-3 takes at most about $c \cdot d^3$ steps.
      :::
    bridges: []
  - id: constraint-solving.s3
    title: Back up when a choice fails, and choose the tightest spot first
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.constraint-solving
    markdown: |-
      Propagation alone rarely finishes the job, so a solver combines it with **backtracking search**: pick a variable, try a value, propagate, and if some domain becomes empty, undo that choice and try the next value.

      The order of choices matters enormously. Suppose the solver works through WA, NSW, Q, NT, SA… in that fixed order. It makes WA and NSW both red (legal, since they don't touch), Q green, and NT is then forced to blue. Now South Australia touches red, red, green, and blue neighbours: its domain is empty. The solver must back up and undo.

      The **minimum-remaining-values (MRV)** rule avoids this: always choose the variable with the fewest values left. It reaches South Australia while SA still has one colour left. Run both:

      ```python run
      neighbours = {
          "WA": ["NT", "SA"], "NT": ["WA", "SA", "Q"], "SA": ["WA", "NT", "Q", "NSW", "V"],
          "Q": ["NT", "SA", "NSW"], "NSW": ["Q", "SA", "V"], "V": ["SA", "NSW"], "T": [],
      }
      ORDER = ["WA", "NSW", "Q", "NT", "SA", "V", "T"]   # used when MRV is off

      def solve(assigned, domains, use_mrv, stats):
          if len(assigned) == len(neighbours):
              return assigned
          unassigned = [v for v in ORDER if v not in assigned]
          var = min(unassigned, key=lambda v: len(domains[v])) if use_mrv else unassigned[0]
          for colour in domains[var]:
              stats["tried"] += 1
              new = dict(domains, **{var: [colour]})
              for n in neighbours[var]:                     # forward checking
                  if n not in assigned:
                      new[n] = [c for c in new[n] if c != colour]
              if all(new[n] for n in neighbours[var]):      # nobody left without a colour
                  result = solve({**assigned, var: colour}, new, use_mrv, stats)
                  if result:
                      return result
              stats["backtracks"] += 1                      # undo and try the next colour
          return None

      colours = ["red", "green", "blue"]
      for use_mrv in [False, True]:
          stats = {"tried": 0, "backtracks": 0}
          answer = solve({}, {v: colours for v in neighbours}, use_mrv, stats)
          print("MRV:" if use_mrv else "fixed order:", stats)
          print("  ", answer)
      ```

      The fixed order tries 12 colours and hits 5 dead ends. MRV tries 7, one per region, and never backs up. Now set `colours = ["red", "green"]`. Both versions return `None`: two colours can't do it, because WA, NT, and SA all touch each other.

      :::mixup "If propagation empties no domain, a solution must exist."
      Take three regions that all touch each other, with only red and green allowed. Every arc is consistent: whatever colour one region takes, each neighbour still has the other. Yet no colouring works, because three mutual neighbours need three colours. Arc consistency checks pairs, one at a time, so it can't see this three-way clash. Only search discovers that every option fails.
      :::
    bridges: []
  - id: constraint-solving.s4
    title: The same puzzle schedules your exams
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.constraint-solving
    markdown: |-
      A school must fit five exams into three time slots, and two exams that share a student can't share a slot. Swap "region" for "exam" and "colour" for "time slot": it's map colouring again. Sudoku is a CSP too: 81 cells, digits 1–9, and no repeats in any row, column, or box.

      Many real constraints need more than "must differ," and two families of solvers cover most of them:

      - **SAT** (Boolean satisfiability) asks whether true/false variables can make a logical formula true. Modern SAT solvers learn from each conflict to avoid repeating it, and they routinely check chip designs with a very large number of variables.
      - **SMT** (satisfiability modulo theories) adds arithmetic and other data types to SAT. The rule "the painters start at least 2 hours after the plasterers" can be written directly as $s_{\text{paint}} \ge s_{\text{plaster}} + 2$. Solvers such as Microsoft's Z3 handle rules like this.

      A **feasible** timetable breaks no **hard constraint**, a rule that must hold. An **optimal** one is the best feasible timetable under some score, such as fewest exams on Friday afternoon.

      A solver respects exactly the constraints you write down. If nobody encodes "the hall seats 60," it may happily put 70 students there. When a solution looks wrong, look first for the missing constraint.
    bridges: []
  - id: constraint-solving.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.constraint-solving
    markdown: New maps, exam timetables, work crews, and puzzles ask you to propagate a choice, pick the next variable, count the possibilities, and spot a missing constraint.
    takeaway: |-
      After each choice, cross out the values it rules out and follow the chain of forced moves. When a domain empties, back up; choosing the most constrained variable first keeps dead ends rare.
  - id: constraint-solving.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.constraint-solving
    markdown: |-
      Constraints rule out forbidden combinations. Propagation removes impossible choices, and backtracking tries alternatives when a choice leads to a conflict.
navigation:
  routes:
