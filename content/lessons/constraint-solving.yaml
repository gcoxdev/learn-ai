schema_version: 0.2-draft
lesson:
  id: constraint-solving
  version: 0.1.0-draft
  title: Remove impossible choices before searching further
  state: draft
  summary: Constraint satisfaction combines variables, domains, and relations; propagation and backtracking reduce
    search, while SAT and SMT supply specialized logical formulations.
  slot: M05.4
  category: learning
  minutes: 12
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.constraint-solving
  version: 1-draft
  statement: Constraint satisfaction combines variables, domains, and relations; propagation and backtracking reduce
    search, while SAT and SMT supply specialized logical formulations.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - constraint-solving.base
  - constraint-solving.transfer
  prerequisites:
  - anyOf:
    - objective.search-problems
  - anyOf:
    - objective.propositional-logic
scenes:
- id: constraint-solving.s1
  title: Describe the allowed combinations
  type: explanation
  depth: intuition
  objective_refs:
  - objective.constraint-solving
  markdown: A constraint problem has variables with possible values and relations restricting their joint assignments.
    In map coloring, each region is a variable, colors are its domain, and neighboring regions must differ. The
    goal is usually a satisfying assignment, though an objective can also rank feasible assignments.
  text_mode: A constraint problem has variables with possible values and relations restricting their joint assignments.
    In map coloring, each region is a variable, colors are its domain, and neighboring regions must differ. The
    goal is usually a satisfying assignment, though an objective can also rank feasible assignments.
  bridges: []
- id: constraint-solving.s2
  title: Propagate a consequence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.constraint-solving
  markdown: Let adjacent regions A and B each allow red or blue. If A becomes red, B’s red option is removed. Propagation
    repeats local implications and can reveal an empty domain early. Local consistency does not generally prove
    that the entire problem is solvable; remaining choices may still interact globally.
  text_mode: Let adjacent regions A and B each allow red or blue. If A becomes red, B’s red option is removed. Propagation
    repeats local implications and can reveal an empty domain early. Local consistency does not generally prove
    that the entire problem is solvable; remaining choices may still interact globally.
  bridges: []
- id: constraint-solving.s3
  title: Backtrack when a choice fails
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.constraint-solving
  markdown: A solver chooses a variable and value, propagates, and retreats if contradiction appears. Choosing the
    most constrained variable can expose failure early. Learned conflict information can prevent repeating the same
    failed combination. These strategies change efficiency while preserving the defined set of allowed solutions.
  text_mode: A solver chooses a variable and value, propagates, and retreats if contradiction appears. Choosing
    the most constrained variable can expose failure early. Learned conflict information can prevent repeating the
    same failed combination. These strategies change efficiency while preserving the defined set of allowed solutions.
  bridges: []
- id: constraint-solving.s4
  title: Choose a suitable formal language
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.constraint-solving
  markdown: SAT uses propositional variables and formulas. SMT extends satisfiability with supported theories such
    as arithmetic or arrays. A scheduling problem with time inequalities may be clearer in a theory-aware formulation.
    Solver success validates the encoded constraints, so missing or incorrect requirements remain a modeling risk.
  text_mode: SAT uses propositional variables and formulas. SMT extends satisfiability with supported theories such
    as arithmetic or arrays. A scheduling problem with time inequalities may be clearer in a theory-aware formulation.
    Solver success validates the encoded constraints, so missing or incorrect requirements remain a modeling risk.
  bridges: []
- id: constraint-solving.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.constraint-solving
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Constraint satisfaction combines variables, domains, and relations; propagation and backtracking reduce
    search, while SAT and SMT supply specialized logical formulations.
