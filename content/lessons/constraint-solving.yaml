schema_version: 0.2-draft
lesson:
  id: constraint-solving
  version: 0.3.0-draft
  title: Remove impossible choices before searching further
  state: draft
  summary: Color a small map to see how eliminating impossible choices can help—and why local checks sometimes
    miss a global conflict.
  slot: M05.4
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.constraint-solving
  version: 1-draft
  statement: Constraint satisfaction combines variables, domains, and relations; propagation and backtracking
    reduce search, while SAT and SMT supply specialized logical formulations.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - constraint-solving.base
  - constraint-solving.transfer
  prerequisites:
  - anyOf:
    - objective.search-problems
  - anyOf:
    - objective.propositional-logic
scenes:
- id: constraint-solving.s1
  title: Describe the allowed combinations
  type: explanation
  depth: intuition
  objective_refs:
  - objective.constraint-solving
  markdown: A constraint problem has variables with possible values and relations restricting their joint assignments.
    In map coloring, each region is a variable, colors are its domain, and neighboring regions must differ.
    The goal is usually a satisfying assignment, though an objective can also rank feasible assignments.
  text_mode: A constraint problem has variables with possible values and relations restricting their joint
    assignments. In map coloring, each region is a variable, colors are its domain, and neighboring regions
    must differ. The goal is usually a satisfying assignment, though an objective can also rank feasible assignments.
  bridges: []
- id: constraint-solving.s2
  title: Propagate a consequence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.constraint-solving
  markdown: Let adjacent regions A and B each allow red or blue. If A becomes red, B’s red option is removed.
    Propagation repeats local implications and can reveal an empty domain early. Local consistency does not
    generally prove that the entire problem is solvable; remaining choices may still interact globally.
  text_mode: Let adjacent regions A and B each allow red or blue. If A becomes red, B’s red option is removed.
    Propagation repeats local implications and can reveal an empty domain early. Local consistency does not
    generally prove that the entire problem is solvable; remaining choices may still interact globally.
  bridges: []
- id: constraint-solving.s3
  title: Backtrack when a choice fails
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.constraint-solving
  markdown: 'A solver chooses a variable and value, propagates, and retreats if contradiction appears. Choosing
    the most constrained variable can expose failure early. Learned conflict information can prevent repeating
    the same failed combination. These strategies change efficiency while preserving the defined set of allowed
    solutions.


    Try coloring three regions arranged in a triangle with only red and blue, with every touching pair required
    to differ. Each pair can be colored on its own. But choosing A red forces B blue and C blue, which breaks
    the B–C rule. The whole problem has no solution even though each individual pair looks possible. This is
    why propagation and a search over choices work together.'
  text_mode: 'A solver chooses a variable and value, propagates, and retreats if contradiction appears. Choosing
    the most constrained variable can expose failure early. Learned conflict information can prevent repeating
    the same failed combination. These strategies change efficiency while preserving the defined set of allowed
    solutions.


