  scene_aliases:
    constraint-solving.recap: constraint-solving.check
assessment_families:
  - id: constraint-solving.base
    objective_ref: objective.constraint-solving
    task: base
    response_type: single_choice
    points: 1
    hint: 'Propagate a consequence: trace the inputs, operation, and result before choosing.'
    remediation_scene: constraint-solving.s2
    variants:
      - id: constraint-solving.base.1
        prompt: What is a variable’s domain?
        options:
          - id: b
            text: Only its name
          - id: c
            text: Every value in every programming language
          - id: a
            text: Its allowed candidate values
        answer: a
        feedback: Domains specify the alternatives considered for each variable.
        retired: true
      - id: constraint-solving.base.2
        prompt: A and B must differ, both allow red or blue, and A is red. What remains for B?
        options:
          - id: c
            text: No restriction
          - id: a
            text: Blue
          - id: b
            text: Red only
        answer: a
        feedback: Constraint propagation removes the conflicting red assignment.
        retired: true
  - id: constraint-solving.transfer
    objective_ref: objective.constraint-solving
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Choose a suitable formal language: trace the inputs, operation, and result before choosing.'
    remediation_scene: constraint-solving.s4
    variants:
      - id: constraint-solving.transfer.1
        prompt: Every local constraint looks consistent. Is global satisfiability guaranteed in general?
        options:
          - id: c
            text: Only if variables have short names
          - id: a
            text: No; combined constraints may still conflict
          - id: b
            text: Yes; local checks always solve every problem
        answer: a
        feedback: Local consistency can prune without fully deciding the global problem.
        retired: true
      - id: constraint-solving.transfer.2
        prompt: A solver finds a satisfying schedule that violates an omitted requirement. Where is the problem?
        options:
          - id: a
            text: The model of the constraints was incomplete
          - id: b
            text: Satisfiability must mean the solver crashed
          - id: c
            text: All formal reasoning is impossible
        answer: a
        feedback: A solver checks encoded requirements, not unstated intentions.
        retired: true
  - id: constraint-solving.base.v2
    objective_ref: objective.constraint-solving
    task: base
    response_type: single_choice
    points: 1
    hint: After each choice, cross the chosen value out of the neighbours' domains and follow any forced moves. An empty domain means back up. MRV picks the variable with the fewest values left.
    remediation_scene: constraint-solving.s2
    variants:
      - id: constraint-solving.base.v2.1
        prompt: 'Three regions form a chain: P touches Q, and Q touches R. The colours are red and green. You set P = red. After full propagation (arc consistency), what are the domains of Q and R?'
        options:
          - id: b
            text: 'Q: green. R: red or green'
          - id: a
            text: 'Q: green. R: red'
          - id: c
            text: 'Q: red or green. R: green'
        answer: a
        feedback: P = red removes red from Q, leaving green. Q forced to green then removes green from R, leaving red. Stopping after Q is forward checking; propagation follows the chain.
      - id: constraint-solving.base.v2.2
        prompt: 'Domains left: A {red, blue}, B {green}, C {red, green, blue}. Which variable does the minimum-remaining-values rule choose next?'
        options:
          - id: c
            text: C, which has the most options to try
          - id: a
            text: B, which has only one value left
          - id: b
            text: A, which comes first in the list
        answer: a
        feedback: MRV picks the variable with the fewest values left, B. Tight spots are where failure shows up first, so dealing with them early avoids wasted work further down.
      - id: constraint-solving.base.v2.3
        prompt: A solver sets X = red, and forward checking leaves X's neighbour Y with an empty domain. What does backtracking search do next?
        options:
          - id: a
            text: Undo X = red and try X's next colour
          - id: b
            text: Colour Y anyway and repair the clash later
          - id: c
            text: Report that the whole problem has no solution
        answer: a
        feedback: An empty domain means this choice can't lead to a solution, so the solver undoes it and tries X's next value. The problem is unsolvable only once every option has failed.
      - id: constraint-solving.base.v2.4
        prompt: Three regions all touch each other, and only red and green are allowed. Arc consistency removes nothing. What does that tell you?
        options:
          - id: b
            text: A solution exists, since no domain was emptied
          - id: c
            text: Arc consistency must have made a mistake here
          - id: a
            text: Little; pairwise checks miss this three-way clash
        answer: a
        feedback: Each pair on its own can always differ, so every arc is consistent, yet three mutual neighbours need three colours. Propagation missing it is expected; search then finds that every option fails.
      - id: constraint-solving.base.v2.5
        prompt: 'The constraint says Y must differ from X. X''s domain is {red}, and Y''s is {red, blue}. What does making the arc Y → X consistent remove?'
        options:
          - id: c
            text: Nothing, since Y still has two values to use
          - id: b
            text: Blue from Y's domain
          - id: a
            text: Red from Y's domain
        answer: a
        feedback: Y = red has no partner in X's domain (X can only be red), so red goes. Y = blue works with X = red, so blue stays.
  - id: constraint-solving.transfer.v2
    objective_ref: objective.constraint-solving
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name the variables, their domains, and the constraints. A solver respects exactly the constraints you write down.
    remediation_scene: constraint-solving.s4
    variants:
      - id: constraint-solving.transfer.v2.1
        prompt: Five exams must go into three time slots, and exams sharing a student can't share a slot. Viewed as map colouring, what plays the role of the colours?
        options:
          - id: b
            text: The exams
          - id: a
            text: The time slots
          - id: c
            text: The students
        answer: a
        feedback: Exams are the variables (the regions), and time slots are the values (the colours). Students create the constraints, like shared borders.
      - id: constraint-solving.transfer.v2.2
        prompt: A solver returns a timetable that satisfies every rule it was given, but it puts 70 students in a hall with 60 seats. What went wrong?
        options:
          - id: a
            text: Hall capacity was never written as a constraint
          - id: b
            text: The solver skipped some of its constraints
          - id: c
            text: Backtracking stopped before it checked halls
        answer: a
        feedback: A solver can only respect rules it has been given. If capacity isn't encoded, 70 in a 60-seat hall is a perfectly valid answer to the problem as written.
      - id: constraint-solving.transfer.v2.3
        prompt: 'A building schedule has the rule "the painters start at least 2 hours after the plasterers start." Which tool expresses this rule most directly?'
        options:
          - id: c
            text: Map colouring, with the hours as colours
          - id: b
            text: Plain SAT, with each hour a true/false variable
          - id: a
            text: SMT, which adds arithmetic to logic
        answer: a
        feedback: SMT lets you write start times as numbers and the rule as an inequality. Plain SAT could encode it with many true/false variables, one per hour, but far less directly.
      - id: constraint-solving.transfer.v2.4
        prompt: How do you write Sudoku as a constraint satisfaction problem?
        options:
          - id: b
            text: Variables are the digits; domains are cells
          - id: a
            text: Variables are the cells; domains are 1–9
          - id: c
            text: Variables are the rows; domains are 1–9
        answer: a
        feedback: Each empty cell takes one digit from 1 to 9, with no repeats in any row, column, or box. A row can't take a single digit, and the digits aren't the things being decided.
      - id: constraint-solving.transfer.v2.5
        prompt: Timetable A breaks no hard rule. Timetable B puts more exams in slots students like, but gives one student two exams at once. Which is feasible?
        options:
          - id: c
            text: B, because it scores better on preferences
          - id: b
            text: Both, since each assigns every exam a slot
          - id: a
            text: A, because it breaks no hard constraint
        answer: a
        feedback: Feasible means every hard constraint holds, so only A qualifies. A better preference score can't make up for a broken hard rule.
  - id: constraint-solving.calc.v2
    objective_ref: objective.constraint-solving
    task: base
    response_type: numeric
    points: 1
    hint: Each variable picks one of d values independently, so n variables give d × d × … × d = dⁿ complete assignments.
    remediation_scene: constraint-solving.s1
    absolute_tolerance: 0.001
    variants:
      - id: constraint-solving.calc.v2.1
        prompt: A map has 4 regions and 3 colours. How many complete colourings are there before any constraint is checked?
        answer: 81
        feedback: 3⁴ = 3 × 3 × 3 × 3 = 81. Multiplying 4 × 3 = 12 counts single choices, not combinations.
      - id: constraint-solving.calc.v2.2
        prompt: Five exams each go into one of 4 time slots. How many complete timetables are there before any constraint is checked?
        answer: 1024
        feedback: 4⁵ = 1,024. Watch the direction. The slots (4) are the values and the exams (5) are the variables, so it isn't 5⁴ = 625.
      - id: constraint-solving.calc.v2.3
        prompt: A map has 6 regions and 2 colours. How many complete colourings are there before any constraint is checked?
        answer: 64
        feedback: 2⁶ = 64. Each region doubles the count.
      - id: constraint-solving.calc.v2.4
        prompt: A Sudoku has 3 empty cells, each allowed digits 1–9. How many ways are there to fill them before any rule is checked?
        answer: 729
        feedback: 9³ = 729. The constraints then cut this down, often to a single answer.
      - id: constraint-solving.calc.v2.5
        prompt: A map has 5 regions and 3 colours. How many complete colourings are there before any constraint is checked?
        answer: 243
        feedback: 3⁵ = 243. Adding one region multiplies the count by 3 again.
