  bridges: []
- id: constraint-solving.s4
  title: Choose a language for the constraints
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.constraint-solving
  markdown: '**SAT** asks whether true-or-false choices can satisfy a formula. **SMT**, short for satisfiability
    modulo theories, adds rules for objects such as numbers or arrays. A requirement like “job B starts at
    least two hours after A” can then use arithmetic directly.


    A **feasible** schedule satisfies the constraints. An **optimal** schedule is the best feasible one under
    an additional score. A solver checks the requirements you encoded, so an omitted crane-capacity limit can
    still produce an unusable schedule.'
  text_mode: '**SAT** asks whether true-or-false choices can satisfy a formula. **SMT**, short for satisfiability
    modulo theories, adds rules for objects such as numbers or arrays. A requirement like “job B starts at
    least two hours after A” can then use arithmetic directly.


    A **feasible** schedule satisfies the constraints. An **optimal** schedule is the best feasible one under
    an additional score. A solver checks the requirements you encoded, so an omitted crane-capacity limit can
    still produce an unusable schedule.'
  bridges: []
- id: constraint-solving.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.constraint-solving
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Constraints rule out forbidden combinations. Propagation removes impossible choices, and backtracking
    tries alternatives when a choice leads to a conflict.
- id: constraint-solving.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.constraint-solving
  markdown: Constraints rule out forbidden combinations. Propagation removes impossible choices, and backtracking
    tries alternatives when a choice leads to a conflict.
