objectives:
  - id: objective.constraint-solving
    version: 2-draft
    statement: Constraint satisfaction combines variables, domains, and relations; propagation and backtracking reduce search, while SAT and SMT supply specialized logical formulations.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - constraint-solving.base.v2
      - constraint-solving.transfer.v2
      - constraint-solving.calc.v2
    prerequisites:
      - anyOf:
          - objective.search-problems
      - anyOf:
          - objective.propositional-logic
scenes:
  - id: constraint-solving.s1
    title: Colour the map, no neighbours alike
    type: explanation
    depth: intuition
    objective_refs:
      - objective.constraint-solving
    markdown: |-
      Colour the seven states and territories of Australia with red, green, and blue so that no two neighbours share a colour. Try it in your head before reading on. You'll probably start with South Australia, the one that touches almost everything.

      This puzzle is a **constraint satisfaction problem (CSP)**. It has three parts:

      - **Variables**, the things to decide: WA, NT, SA, Q, NSW, V, and T.
      - A **domain** for each variable, the values it may take: {red, green, blue}.
      - **Constraints**, rules about which combinations are allowed: each of the 9 neighbouring pairs must differ.

      A **solution** gives every variable a value from its domain and breaks no constraint. Unlike route finding, the path doesn't matter here; only the finished colouring does.

      Blind guessing is hopeless on bigger problems. Seven variables with three values each already make 3⁷ = 2,187 complete colourings. A CSP solver beats that by noticing, after each choice, which values have just become impossible.
    diagram:
