assessment_families:
  - id: contrastive-image-text-learning.base
    objective_ref: objective.contrastive-image-text-learning
    task: base
    response_type: single_choice
    points: 1
    hint: 'Read a small similarity table: trace the inputs, operation, and result before choosing.'
    remediation_scene: contrastive-image-text-learning.s2
    variants:
      - id: contrastive-image-text-learning.base.1
        prompt: Three images and three captions create how many pairwise similarities?
        options:
          - id: b
            text: Three
          - id: c
            text: Six
          - id: a
            text: Nine
        answer: a
        feedback: Every image is compared with every caption.
        retired: true
      - id: contrastive-image-text-learning.base.2
        prompt: What are the positive pairs in the basic training setup?
        options:
          - id: c
            text: Only captions of the same length
          - id: a
            text: The associated image-caption pairs
          - id: b
            text: Every pair equally
        answer: a
        feedback: Pairing defines the contrastive target.
        retired: true
  - id: contrastive-image-text-learning.transfer
    objective_ref: objective.contrastive-image-text-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Recognize the limits of similarity: trace the inputs, operation, and result before choosing.'
    remediation_scene: contrastive-image-text-learning.s4
    variants:
      - id: contrastive-image-text-learning.transfer.1
        prompt: Why can prompt wording alter zero-shot classification?
        options:
          - id: c
            text: It retrains all weights immediately
          - id: a
            text: It changes the text representation used for comparison
          - id: b
            text: The image file is necessarily rewritten
        answer: a
        feedback: The classification interface depends on encoded candidate text.
        retired: true
      - id: contrastive-image-text-learning.transfer.2
        prompt: Does high similarity certify every caption detail?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if similarity is positive
        answer: a
        feedback: Embedding proximity is an imperfect task-dependent signal.
        retired: true
  - id: contrastive-image-text-learning.base.v2
    objective_ref: objective.contrastive-image-text-learning
    task: base
    response_type: single_choice
    points: 1
    hint: Picture the N × N table. Each row is a softmax over captions, each column a softmax over photos, and the temperature sets how sharply small gaps count.
    remediation_scene: contrastive-image-text-learning.s5
    variants:
      - id: contrastive-image-text-learning.base.v2.1
        prompt: A CLIP-style batch holds 5 photo–caption pairs. In the image-to-text direction, how many negatives does each photo's softmax compare its caption against?
        options:
          - id: b
            text: 20, the off-diagonal cells of the whole table
          - id: a
            text: 4, the other captions in its row
          - id: c
            text: 5, the captions in the batch
        answer: a
        feedback: A photo's row has 5 captions, one of them its own, so 4 negatives. The table has 20 off-diagonal cells in total, but each row's softmax sees only its own row.
      - id: contrastive-image-text-learning.base.v2.2
        prompt: After training, a matching photo and caption have cosine similarity 0.31. What does that tell you?
        options:
          - id: c
            text: The pair matches poorly, since a good match should score near 1
          - id: b
            text: The temperature was set too high for the model to learn well
          - id: a
            text: Little on its own; what matters is how 0.31 ranks against other captions
        answer: a
        feedback: The loss rewards the positive beating its row and column, not reaching 1. CLIP's small learned temperature turns modest cosine gaps into confident choices, so 0.31 can be a strong match.
      - id: contrastive-image-text-learning.base.v2.3
        prompt: CLIP averages an image-to-text loss with a text-to-image loss. What does the second direction add?
        options:
          - id: a
            text: Each caption must also pick out its own photo from the other photos
          - id: b
            text: The text encoder gets trained, which the first direction leaves frozen
          - id: c
            text: It doubles the batch size by adding captions from other batches
        answer: a
        feedback: The column softmax asks "which photo is mine?" for each caption. Both directions send gradients into both encoders, and neither adds new examples; they score the same table two ways.
      - id: contrastive-image-text-learning.base.v2.4
        prompt: Training switches from temperature 1.0 to 0.07 on the same similarity table. What happens?
        options:
          - id: b
            text: The similarities shrink, so the loss falls toward zero for every row
          - id: c
            text: Fewer negatives are included, so each softmax becomes easier
          - id: a
            text: Small similarity gaps become large logit gaps, so hard negatives dominate
        answer: a
        feedback: Dividing by 0.07 multiplies every similarity by about 14, so a 0.1 gap becomes a 1.4 logit gap. Rows with a clear winner then cost almost nothing, and the loss concentrates on near-miss negatives. The similarities and the set of negatives don't change.
  - id: contrastive-image-text-learning.transfer.v2
    objective_ref: objective.contrastive-image-text-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: Remember what CLIP learned from web captions (which things appear, and printed text) and what captions rarely give it (counts, positions, and "none of these").
    remediation_scene: contrastive-image-text-learning.s4
    variants:
      - id: contrastive-image-text-learning.transfer.v2.1
        prompt: A shoe shop has a CLIP-style model and 50,000 product photos with no tags. A shopper types "red trail-running shoes". What is the simplest way to find matches?
        options:
          - id: c
            text: Train a new classifier with one output for each shoe style in stock
          - id: a
            text: Encode the text once and rank the stored photo vectors by cosine similarity
          - id: b
            text: Generate captions for all photos, then search the captions for the words
        answer: a
        feedback: Text and photos share one embedding space, so a text query can rank photo vectors directly, and the photo vectors can be computed once in advance. A new classifier needs labels the shop doesn't have; captioning first adds a lossy extra step.
      - id: contrastive-image-text-learning.transfer.v2.2
        prompt: A bird-guide team uses zero-shot CLIP with prompts "a photo of a {label}." Photos of cranes are often labeled as construction sites. What is the best first fix?
        options:
          - id: a
            text: Add context to the template, such as "a photo of a {label}, a type of bird."
          - id: b
            text: Lower the temperature so the crane prompt wins by a wider margin
          - id: c
            text: Remove "crane" from the label list, since the model cannot learn it
        answer: a
        feedback: The word "crane" has two meanings, and the bare template lets the machine sense win. Context in the prompt moves the text vector toward the bird. A lower temperature sharpens whatever ranking already exists, including the wrong one.
      - id: contrastive-image-text-learning.transfer.v2.3
        prompt: A product dataset has many near-identical photos of the same mug, each captioned "white ceramic mug". Several land in one training batch. What goes wrong?
        options:
          - id: b
            text: The batch becomes too small for the softmax to work at all
          - id: c
            text: The text encoder learns to ignore the word "mug" in later captions
          - id: a
            text: True matches are treated as negatives and pushed apart
        answer: a
        feedback: Each photo is trained to prefer only its own copy of the caption, so identical captions from other photos count as negatives even though they describe it perfectly. Deduplicating, or spreading duplicates across batches, avoids this false-negative problem.
      - id: contrastive-image-text-learning.transfer.v2.4
        prompt: A warehouse uses zero-shot CLIP to sort boxes by photographing them. Boxes reused from another product are sorted by their old printed brand name. Why?
        options:
          - id: c
            text: The image encoder's resolution is too low to see the contents
          - id: a
            text: CLIP learned to rely heavily on printed text, since web images often contain it
          - id: b
            text: The temperature is too high, so every box gets a similar score
        answer: a
        feedback: This is the typographic effect behind the apple labeled "iPod". Printed words strongly steer CLIP's image vector. Higher resolution would make the print even easier to read, and temperature only rescales the ranking the model already produced.
  - id: contrastive-image-text-learning.calculate
    objective_ref: objective.contrastive-image-text-learning
    task: base
    response_type: numeric
    points: 1
    hint: Divide each similarity by τ, then take e to each result. The matching caption's probability is its exponential divided by the sum of all of them.
    remediation_scene: contrastive-image-text-learning.s5
    absolute_tolerance: 0.005
    variants:
      - id: contrastive-image-text-learning.calculate.1
        prompt: A photo's similarities with the three captions in its batch are 0.30 (its own), 0.20, and 0.10. With τ = 0.1, what probability does the softmax give its own caption? Answer to three decimals.
        answer: 0.665
        feedback: The logits are 3, 2, 1. The probability is e³ / (e³ + e² + e¹) = 20.09 / (20.09 + 7.39 + 2.72) = 20.09 / 30.19 = 0.665.
      - id: contrastive-image-text-learning.calculate.2
        prompt: In a batch of two pairs, a photo scores 0.30 with its own caption and 0.10 with the other. With τ = 0.1, what probability does the softmax give its own caption? Answer to three decimals.
        answer: 0.881
        feedback: The logits are 3 and 1, so the probability is 1 / (1 + e⁻²) = 1 / 1.135 = 0.881.
      - id: contrastive-image-text-learning.calculate.3
        prompt: A photo scores 0.25 with its own caption and 0.20 with each of two other captions. With τ = 0.05, what probability goes to its own caption? Answer to three decimals.
        answer: 0.576
        feedback: The logits are 5, 4, 4. The probability is 1 / (1 + 2e⁻¹) = 1 / (1 + 0.736) = 0.576.
      - id: contrastive-image-text-learning.calculate.4
        prompt: A caption scores 0.30 with its own photo and 0.25, 0.20, and 0.10 with three other photos. With τ = 0.05, what probability does the text-to-image softmax give its own photo? Answer to three decimals.
        answer: 0.657
        feedback: The logits are 6, 5, 4, 2. The probability is 1 / (1 + e⁻¹ + e⁻² + e⁻⁴) = 1 / (1 + 0.368 + 0.135 + 0.018) = 1 / 1.521 = 0.657.
  - id: contrastive-image-text-learning.zeroshot
    objective_ref: objective.contrastive-image-text-learning
    task: base
    response_type: numeric
    points: 1
    hint: Multiply each prompt's cosine by 100, subtract the largest so the numbers stay small, exponentiate, and divide the asked-about label's value by the total.
    remediation_scene: contrastive-image-text-learning.s3
    absolute_tolerance: 0.005
    variants:
      - id: contrastive-image-text-learning.zeroshot.1
        prompt: A photo's cosine similarities with "a photo of a cat." and "a photo of a dog." are 0.22 and 0.21. With CLIP's scale of 100, what probability does zero-shot classification give "cat"? Answer to three decimals.
        answer: 0.731
        feedback: The logits are 22 and 21, a gap of 1, so the probability is 1 / (1 + e⁻¹) = 0.731. A 0.01 cosine gap becomes a clear preference.
      - id: contrastive-image-text-learning.zeroshot.2
        prompt: Three room prompts score cosines 0.25 (living room), 0.23 (office), and 0.23 (bedroom). With scale 100, what probability goes to "living room"? Answer to three decimals.
        answer: 0.787
        feedback: The logits are 25, 23, 23, so the probability is 1 / (1 + 2e⁻²) = 1 / (1 + 0.271) = 0.787.
      - id: contrastive-image-text-learning.zeroshot.3
        prompt: Prompts for kitchen, bathroom, and bedroom score 0.28, 0.24, and 0.19. A fourth prompt, garage, scores 0.27. With scale 100, what probability goes to "kitchen" once the garage is added? Answer to three decimals.
        answer: 0.721
        feedback: Relative to 28, the logits give 1, e⁻⁴, e⁻⁹, e⁻¹, so the probability is 1 / (1 + 0.018 + 0.0001 + 0.368) = 0.721. Adding one close option cut the kitchen from 0.982.
      - id: contrastive-image-text-learning.zeroshot.4
        prompt: A medicine photo scores 0.30 with "a photo of ibuprofen tablets.", 0.27 with "a photo of vitamin tablets.", and 0.22 with "a photo of cough syrup.". With scale 100, what probability goes to ibuprofen? Answer to three decimals.
        answer: 0.952
        feedback: Relative to 30, the logits give 1, e⁻³, e⁻⁸, so the probability is 1 / (1 + 0.0498 + 0.0003) = 0.952.
