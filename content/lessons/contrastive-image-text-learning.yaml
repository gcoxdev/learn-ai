schema_version: 0.2-draft
lesson:
  id: contrastive-image-text-learning
  version: 0.1.0-draft
  title: Bring matching images and descriptions closer in representation space
  state: draft
  summary: CLIP-style contrastive training learns image and text representations by comparing paired and unpaired
    examples; similarity supports retrieval and prompted classification but is not calibrated truth.
  slot: M23.2
  category: learning
  minutes: 12
  sources:
  - title: Learning Transferable Visual Models From Natural Language Supervision
    url: https://arxiv.org/abs/2103.00020
objectives:
- id: objective.contrastive-image-text-learning
  version: 1-draft
  statement: CLIP-style contrastive training learns image and text representations by comparing paired and unpaired
    examples; similarity supports retrieval and prompted classification but is not calibrated truth.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - contrastive-image-text-learning.base
  - contrastive-image-text-learning.transfer
  prerequisites:
  - anyOf:
    - objective.multimodal-alignment-and-fusion
  - anyOf:
    - objective.self-supervised-representations
scenes:
- id: contrastive-image-text-learning.s1
  title: Encode both sides of a pair
  type: explanation
  depth: intuition
  objective_refs:
  - objective.contrastive-image-text-learning
  markdown: An image encoder and a text encoder produce vectors with compatible dimensions. Training compares similarities
    across a batch, rewarding the associated image-caption pairs relative to other pairings. The model learns from
    the data’s descriptions and omissions, not from complete labels for every visual fact.
  text_mode: An image encoder and a text encoder produce vectors with compatible dimensions. Training compares similarities
    across a batch, rewarding the associated image-caption pairs relative to other pairings. The model learns from
    the data’s descriptions and omissions, not from complete labels for every visual fact.
  bridges: []
- id: contrastive-image-text-learning.s2
  title: Read a small similarity table
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.contrastive-image-text-learning
  markdown: For three images and their three matched captions, a similarity matrix has nine entries. The intended
    pairs lie at corresponding row-column positions. A symmetric contrastive objective can ask each image to select
    its caption and each caption to select its image among the batch candidates.
  text_mode: For three images and their three matched captions, a similarity matrix has nine entries. The intended
    pairs lie at corresponding row-column positions. A symmetric contrastive objective can ask each image to select
    its caption and each caption to select its image among the batch candidates.
  bridges: []
- id: contrastive-image-text-learning.s3
  title: Use text as a classification interface
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.contrastive-image-text-learning
  markdown: Encode prompts such as “a photo of a bicycle” and compare them with the image embedding. This allows
    a classifier defined by candidate text rather than a fixed learned output head for those labels. Prompt wording
    and candidate set affect the result.
  text_mode: Encode prompts such as “a photo of a bicycle” and compare them with the image embedding. This allows
    a classifier defined by candidate text rather than a fixed learned output head for those labels. Prompt wording
    and candidate set affect the result.
  bridges: []
- id: contrastive-image-text-learning.s4
  title: Recognize the limits of similarity
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.contrastive-image-text-learning
  markdown: A high similarity is relative to the representation and alternatives; it is not automatically a probability
    that every statement in a caption is true. Counting, negation, spatial relationships, and rare concepts can
    fail. Evaluate the exact task and inspect errors rather than treating proximity as complete visual understanding.
  text_mode: A high similarity is relative to the representation and alternatives; it is not automatically a probability
    that every statement in a caption is true. Counting, negation, spatial relationships, and rare concepts can
    fail. Evaluate the exact task and inspect errors rather than treating proximity as complete visual understanding.
  bridges: []
- id: contrastive-image-text-learning.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.contrastive-image-text-learning
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: CLIP-style contrastive training learns image and text representations by comparing paired and unpaired
    examples; similarity supports retrieval and prompted classification but is not calibrated truth.
- id: contrastive-image-text-learning.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.contrastive-image-text-learning
  markdown: CLIP-style contrastive training learns image and text representations by comparing paired and unpaired
    examples; similarity supports retrieval and prompted classification but is not calibrated truth.
  text_mode: CLIP-style contrastive training learns image and text representations by comparing paired and unpaired
    examples; similarity supports retrieval and prompted classification but is not calibrated truth.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - contrastive-image-text-learning.s1
    - contrastive-image-text-learning.s2
    - contrastive-image-text-learning.s3
    - contrastive-image-text-learning.s4
