schema_version: 0.2-draft
lesson:
  id: contrastive-image-text-learning
  version: 0.4.0-draft
  title: Bring matching images and descriptions closer in representation space
  state: draft
  summary: In 2021, a model trained on 400 million captioned web images learned to recognize things it was never given a label for. Build its loss by hand from a 3 × 3 table.
  slot: M23.2
  category: learning
  sources:
    - title: "Learning Transferable Visual Models From Natural Language Supervision (CLIP; Radford et al., 2021)"
      url: https://arxiv.org/abs/2103.00020
    - title: "Multimodal Neurons in Artificial Neural Networks (Goh et al., Distill, 2021)"
      url: https://distill.pub/2021/multimodal-neurons/
    - title: "Sigmoid Loss for Language Image Pre-Training (SigLIP; Zhai et al., 2023)"
      url: https://arxiv.org/abs/2303.15343
    - title: "Scaling Up Visual and Vision-Language Representation Learning With Noisy Text Supervision (ALIGN; Jia et al., 2021)"
      url: https://arxiv.org/abs/2102.05918
objectives:
  - id: objective.contrastive-image-text-learning
    version: 2-draft
    statement: CLIP-style contrastive training learns image and text representations by comparing paired and unpaired examples; similarity supports retrieval and prompted classification but is not calibrated truth.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - contrastive-image-text-learning.base.v2
      - contrastive-image-text-learning.transfer.v2
      - contrastive-image-text-learning.calculate
      - contrastive-image-text-learning.zeroshot
    prerequisites:
      - anyOf:
          - objective.multimodal-alignment-and-fusion
      - anyOf:
          - objective.self-supervised-representations
scenes:
  - id: contrastive-image-text-learning.s1
    title: Captions as a free teacher
    type: explanation
    depth: intuition
    objective_refs:
      - objective.contrastive-image-text-learning
    markdown: |-
      Amara photographs her pantry shelf and asks Lumen, "Is this the oat milk?" A classic image classifier can't help unless "oat milk" was one of its training labels. ImageNet classifiers know exactly 1,000 labels, and "oat milk carton" isn't one of them.

      The web, though, is full of images with their own descriptions: product titles, news captions, alt text. In 2021 OpenAI's **CLIP** (Contrastive Language–Image Pre-training; Radford et al.) learned from 400 million such image–text pairs. The visual pretraining lesson met it briefly; here we build it.

      CLIP has two separate networks, often called **two towers**:

      - An **image encoder** (a ResNet or a Vision Transformer) turns a photo into a vector.
      - A **text encoder** (a transformer) turns a caption into a vector of the same length.

      Training pulls each photo's vector toward its own caption's vector and pushes it away from every other caption in the batch. Afterwards "a photo of oat milk" and a photo of an oat-milk carton land close together in this shared **joint embedding space**, though no one ever labeled a carton "oat milk".
    diagram:
      caption: CLIP's two towers. Photos and captions meet only in the similarity table.
      description: A batch of photos goes into the image encoder, which outputs one vector per photo. The matching batch of captions goes into the text encoder, which outputs one vector per caption. Both sets of vectors are normalized and compared in an N by N table of cosine similarities. The table feeds the contrastive loss, which rewards the diagonal where each photo meets its own caption.
      nodes:
        - id: photos
          label: N photos
          col: 0
          row: 0
          tone: data
        - id: captions
          label: N captions
          col: 0
          row: 2
          tone: data
        - id: ienc
          label: Image encoder
          note: ResNet or ViT
          col: 1
          row: 0
        - id: tenc
          label: Text encoder
          note: transformer
          col: 1
          row: 2
        - id: table
          label: N × N similarity table
          note: cosine of every photo with every caption
          col: 2
          row: 1
          tone: accent
        - id: loss
          label: Symmetric contrastive loss
          note: reward the diagonal
          col: 3
          row: 1
          tone: warn
      edges:
        - from: photos
          to: ienc
        - from: captions
          to: tenc
        - from: ienc
          to: table
          label: image vectors
        - from: tenc
          to: table
          label: text vectors
        - from: table
          to: loss
  - id: contrastive-image-text-learning.s2
    title: Build the similarity table
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.contrastive-image-text-learning
    markdown: |-
      Take a batch of three pairs: a mug photo with "a mug of coffee", a dog photo with "a dog on a sofa", and a sign photo with "a bus stop sign". Each vector is scaled to length 1, so an image vector's dot product with a text vector is their **cosine similarity**: 1 when they point the same way, 0 when they're unrelated. Compare every photo with every caption:

      | | "a mug of coffee" | "a dog on a sofa" | "a bus stop sign" |
      | --- | ---: | ---: | ---: |
      | mug photo | **0.30** | 0.10 | 0.00 |
      | dog photo | 0.10 | **0.25** | 0.15 |
      | sign photo | 0.05 | 0.10 | **0.20** |

      The bold diagonal holds the true pairs, the **positives**. The six other cells are **negatives**: pairings that merely share a batch. $N$ pairs give $N^2$ cells, $N$ positives and $N^2 - N$ negatives. CLIP used batches of 32,768, so each photo met 32,767 wrong captions at every step.

      Notice two things. The best match scores only 0.30, far from 1. That's fine: the loss cares whether 0.30 beats its row and column, not how big it is. And the dog photo scores 0.15 with the bus-stop caption; maybe the dog sat near a sign. A "negative" isn't necessarily false, just not the caption that came with this photo.
  - id: contrastive-image-text-learning.s5
    title: Score the table in both directions
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.contrastive-image-text-learning
    markdown: |-
      Treat each row as a multiple-choice question: "Which caption is mine?" Divide the similarities by a **temperature** $\tau$ and apply softmax, exactly as in SimCLR's loss from the visual pretraining lesson. With $\tau = 0.1$, the mug row becomes logits 3, 1, 0:

      $$p(\text{mug caption}) = \frac{e^{3}}{e^{3} + e^{1} + e^{0}} = \frac{20.09}{20.09 + 2.72 + 1} = \frac{20.09}{23.80} = 0.844$$

      and that row's loss is $-\ln 0.844 = 0.170$. Do the same for every row (image → text) and every *column* (text → image: "which photo is mine?"), and average the two. That's CLIP's **symmetric** contrastive loss.

      :::papers The CLIP loss (a symmetric InfoNCE)
      With normalized image vectors $I_i$, text vectors $T_j$, and batch size $N$:

      $$\mathcal{L} = \frac{1}{2N}\sum_{i=1}^{N}\left[-\ln\frac{e^{I_i\cdot T_i/\tau}}{\sum_{j} e^{I_i\cdot T_j/\tau}} \;-\; \ln\frac{e^{I_i\cdot T_i/\tau}}{\sum_{j} e^{I_j\cdot T_i/\tau}}\right]$$

      The first term is our row softmax (0.170 for the mug), the second the column softmax. CLIP *learns* $\tau$ along with the weights, starting at 0.07 and capped so that $1/\tau$ never exceeds 100.
      :::

      ```python run
      import numpy as np

      S = np.array([[0.30, 0.10, 0.00],    # mug photo vs the three captions
                    [0.10, 0.25, 0.15],    # dog photo
                    [0.05, 0.10, 0.20]])   # bus-stop-sign photo

      def diag_probs(logits):
          """Softmax along each row; return the probability on the diagonal."""
          e = np.exp(logits - logits.max(axis=1, keepdims=True))
          return np.diag(e / e.sum(axis=1, keepdims=True))

      def clip_loss(S, tau):
          p_img = diag_probs(S / tau)      # each photo picks a caption
          p_txt = diag_probs(S.T / tau)    # each caption picks a photo
          return (-np.log(p_img).mean() - np.log(p_txt).mean()) / 2, p_img, p_txt

      loss, p_img, p_txt = clip_loss(S, tau=0.1)
      print("photo -> caption:", p_img.round(3))
      print("caption -> photo:", p_txt.round(3))
      print(f"symmetric loss at tau=0.1: {loss:.3f}")
      for tau in [1.0, 0.07, 0.01]:
          print(f"tau={tau:<5} loss={clip_loss(S, tau)[0]:.3f}")
      ```

      The mug row is easy (0.844). The dog and sign rows are harder (0.629 each), because their positives beat the runner-up by only 0.10. The whole batch costs 0.370.

      :::predict At τ = 1, the logits are just the raw similarities (0.30, 0.10, 0.00). Is the loss closer to 0 or to ln 3 ≈ 1.10?
      Close to ln 3: the program prints 0.991. Gaps of 0.1 barely move a softmax, so every row is nearly a three-way coin toss. At $\tau = 0.07$ the loss falls to 0.235, and at 0.01 to 0.001. A small temperature turns small cosine gaps into confident choices and focuses the gradient on the negatives closest to winning, like the dog photo's 0.15.
      :::

      Try raising the dog photo's similarity with the sign caption from 0.15 to 0.25, a tie with its own caption. The loss at τ = 0.1 rises from 0.370 to 0.504.
  - id: contrastive-image-text-learning.s3
    title: Classify with a sentence
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.contrastive-image-text-learning
    markdown: |-
      Trained CLIP can sort images into labels it never trained on: **zero-shot classification**, with zero labeled examples.

      Write one prompt per label from a template such as "a photo of a {label}.", and encode each with the text encoder. Then take the photo vector's cosine with each prompt vector, multiply by CLIP's learned scale of 100 (that's $1/\tau$), and apply softmax. Amara asks, "What room am I in?"

      | Prompt | Cosine | × 100 | Softmax |
      | --- | ---: | ---: | ---: |
      | "a photo of a kitchen." | 0.28 | 28 | 0.982 |
      | "a photo of a bathroom." | 0.24 | 24 | 0.018 |
      | "a photo of a bedroom." | 0.19 | 19 | 0.000 |

      The kitchen's share is $1 / (1 + e^{-4} + e^{-9}) = 0.982$.

      :::mixup "0.982 means CLIP is 98% sure this is a kitchen."
      The softmax only splits belief among the prompts you wrote. Add "a photo of a garage." at cosine 0.27, and the kitchen drops to 0.721 while the garage takes 0.265. A laundry-room photo would still spread 1.0 across your list, because "none of these" isn't a choice. Offer an "other" option, or require a minimum cosine.
      :::

      Web captions are rarely a bare word, so the template matters. In the CLIP paper, "a photo of a {label}." beat the bare label on ImageNet, and context fixed words with two meanings: "boxer" is a dog breed or an athlete, so pet photos got "a photo of a {label}, a type of pet." Averaging many templates' text vectors (**prompt ensembling**) helped further. Zero-shot, CLIP's largest model matched the original ResNet-50 on ImageNet without seeing any of its 1.28 million labeled images.
  - id: contrastive-image-text-learning.s4
    title: Where similarity misleads
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.contrastive-image-text-learning
    markdown: |-
      Captions rarely count objects, give exact positions, or mention what's absent, so CLIP rarely learned to. Its text vector for "a mug to the left of a laptop" often lands very close to "a laptop to the left of a mug": it knows *which things* are present far better than *how they're arranged*. The CLIP paper itself reports weak zero-shot counting.

      :::story The apple labeled "iPod"
      In 2021, researchers studying CLIP's neurons (Goh et al., *Multimodal Neurons*) stuck a handwritten note reading "iPod" on a Granny Smith apple, and CLIP classified the photo as an iPod. Web images often contain text, so reading words became one of CLIP's strongest cues. The researchers called these **typographic attacks**.
      :::

      For Amara this cuts both ways: CLIP-style models read cans and bottles well, but name a reused cereal box by its print, not its contents. So Lumen's team tests relabeled containers, left/right swaps, and counts.

      :::deeper Losses after CLIP
      ALIGN (Google, 2021) trained the same way on over a billion noisier alt-text pairs. SigLIP (Zhai et al., 2023) swapped the softmax for an independent yes/no sigmoid per cell, so each cell asks "is this pair a match?" without normalizing over the batch.
      :::
  - id: contrastive-image-text-learning.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.contrastive-image-text-learning
    markdown: A few softmax calculations by hand, then a shoe shop, a bird guide, and a batch with duplicate captions test whether you can train and use a CLIP-style model.
    takeaway: |-
      CLIP fills an N × N table of photo–caption similarities and trains each photo to pick its caption, and each caption its photo, with a temperature-scaled softmax. Then any list of written labels becomes a classifier, but its scores only compare the options you offered.
  - id: contrastive-image-text-learning.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.contrastive-image-text-learning
    markdown: |-
      Contrastive training brings paired images and text closer relative to alternatives. Similarity can support search and classification without proving every claim in a caption.
