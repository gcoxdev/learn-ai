schema_version: 0.2-draft
lesson:
  id: contrastive-image-text-learning
  version: 0.3.0-draft
  title: Bring matching images and descriptions closer in representation space
  state: draft
  summary: Match pictures with words, then test what the match really tells you.
  slot: M23.2
  category: learning
  sources:
  - title: Learning Transferable Visual Models From Natural Language Supervision
    url: https://arxiv.org/abs/2103.00020
objectives:
- id: objective.contrastive-image-text-learning
  version: 1-draft
  statement: CLIP-style contrastive training learns image and text representations by comparing paired and
    unpaired examples; similarity supports retrieval and prompted classification but is not calibrated truth.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - contrastive-image-text-learning.base
  - contrastive-image-text-learning.transfer
  prerequisites:
  - anyOf:
    - objective.multimodal-alignment-and-fusion
  - anyOf:
    - objective.self-supervised-representations
scenes:
- id: contrastive-image-text-learning.s1
  title: Encode both sides of a pair
  type: explanation
  depth: intuition
  objective_refs:
  - objective.contrastive-image-text-learning
  markdown: An image encoder and a text encoder produce vectors with compatible dimensions. Training compares
    similarities across a batch, rewarding the associated image-caption pairs relative to other pairings. The
    model learns from the data’s descriptions and omissions, not from complete labels for every visual fact.
  text_mode: An image encoder and a text encoder produce vectors with compatible dimensions. Training compares
    similarities across a batch, rewarding the associated image-caption pairs relative to other pairings. The
    model learns from the data’s descriptions and omissions, not from complete labels for every visual fact.
  bridges: []
- id: contrastive-image-text-learning.s2
  title: Read a small similarity table
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.contrastive-image-text-learning
  markdown: 'Imagine two images, a dog and a bicycle, paired with captions “dog” and “bicycle.” Comparing every
    image with every caption gives four similarity scores.


    Suppose the dog image scores 3 with “dog” and 1 with “bicycle.” The bicycle image scores 0 with “dog” and
    4 with “bicycle.” Each intended pair has the larger score in both its row and its column.


    A symmetric contrastive objective encourages each image to select its paired caption and each caption to
    select its paired image. It encourages relative scores like these; it does not require matching scores
    to equal 1. Also, an unpaired caption is not necessarily false: another caption in a larger batch could
    genuinely describe something in the same image.'
  text_mode: 'Imagine two images, a dog and a bicycle, paired with captions “dog” and “bicycle.” Comparing
    every image with every caption gives four similarity scores.


    Suppose the dog image scores 3 with “dog” and 1 with “bicycle.” The bicycle image scores 0 with “dog” and
    4 with “bicycle.” Each intended pair has the larger score in both its row and its column.


    A symmetric contrastive objective encourages each image to select its paired caption and each caption to
    select its paired image. It encourages relative scores like these; it does not require matching scores
    to equal 1. Also, an unpaired caption is not necessarily false: another caption in a larger batch could
    genuinely describe something in the same image.'
  bridges: []
- id: contrastive-image-text-learning.s3
  title: Use text as a classification interface
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.contrastive-image-text-learning
  markdown: Encode prompts such as “a photo of a bicycle” and compare them with the image embedding. This allows
    a classifier defined by candidate text rather than a fixed learned output head for those labels. Prompt
    wording and candidate set affect the result.
  text_mode: Encode prompts such as “a photo of a bicycle” and compare them with the image embedding. This
    allows a classifier defined by candidate text rather than a fixed learned output head for those labels.
    Prompt wording and candidate set affect the result.
  bridges: []
- id: contrastive-image-text-learning.s4
  title: Recognize the limits of similarity
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.contrastive-image-text-learning
  markdown: A high similarity is relative to the representation and alternatives; it is not automatically a
    probability that every statement in a caption is true. Counting, negation, spatial relationships, and rare
    concepts can fail. Evaluate the exact task and inspect errors rather than treating proximity as complete
    visual understanding.
  text_mode: A high similarity is relative to the representation and alternatives; it is not automatically
    a probability that every statement in a caption is true. Counting, negation, spatial relationships, and
    rare concepts can fail. Evaluate the exact task and inspect errors rather than treating proximity as complete
    visual understanding.
  bridges: []
- id: contrastive-image-text-learning.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.contrastive-image-text-learning
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Contrastive training brings paired images and text closer relative to alternatives. Similarity
    can support search and classification without proving every claim in a caption.
- id: contrastive-image-text-learning.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.contrastive-image-text-learning
  markdown: Contrastive training brings paired images and text closer relative to alternatives. Similarity
    can support search and classification without proving every claim in a caption.
  text_mode: Contrastive training brings paired images and text closer relative to alternatives. Similarity
    can support search and classification without proving every claim in a caption.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - contrastive-image-text-learning.s1
    - contrastive-image-text-learning.s2
    - contrastive-image-text-learning.s3
