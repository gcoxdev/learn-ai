schema_version: 0.2-draft
lesson:
  id: training-data-mixtures
  version: 0.1.0-draft
  title: Choose how much the model sees of each source
  state: draft
  summary: Data mixtures control sampling across sources and stages; token accounting, repetition, quality, and
    held-out performance determine the effect of those choices.
  slot: M16.3
  category: learning
  minutes: 12
  sources:
  - title: The Llama 3 Herd of Models
    url: https://arxiv.org/abs/2407.21783
  - title: Qwen3 Technical Report
    url: https://arxiv.org/abs/2505.09388
objectives:
- id: objective.training-data-mixtures
  version: 1-draft
  statement: Data mixtures control sampling across sources and stages; token accounting, repetition, quality, and
    held-out performance determine the effect of those choices.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - training-data-mixtures.base
  - training-data-mixtures.transfer
  prerequisites:
  - anyOf:
    - objective.pretraining-data-pipeline
  - anyOf:
    - objective.stochastic-gradients
scenes:
- id: training-data-mixtures.s1
  title: A mixture defines exposure
  type: explanation
  depth: intuition
  objective_refs:
  - objective.training-data-mixtures
  markdown: 'A pretraining dataset can combine web text, books, code, multilingual material, and synthetic examples.
    Sampling weights determine how often each source contributes. Raw collection size and training exposure are
    different: a small source can be repeatedly sampled, while a large source may be downweighted.'
  text_mode: 'A pretraining dataset can combine web text, books, code, multilingual material, and synthetic examples.
    Sampling weights determine how often each source contributes. Raw collection size and training exposure are
    different: a small source can be repeatedly sampled, while a large source may be downweighted.'
  bridges: []
- id: training-data-mixtures.s2
  title: Calculate a simple allocation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-data-mixtures
  markdown: For a budget of 10,000 sampled tokens with target weights 0.6 and 0.4, expected source contributions
    are 6,000 and 4,000 tokens. If sampling is by document rather than token, variable document lengths can change
    token proportions. Record the unit of weighting and the actual observed counts.
  text_mode: For a budget of 10,000 sampled tokens with target weights 0.6 and 0.4, expected source contributions
    are 6,000 and 4,000 tokens. If sampling is by document rather than token, variable document lengths can change
    token proportions. Record the unit of weighting and the actual observed counts.
  bridges:
  - probability
- id: training-data-mixtures.s3
  title: Repetition has benefits and limits
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-data-mixtures
  markdown: Repeating a high-quality source can strengthen a desired skill, but can also overfit or increase memorization.
    Synthetic data reflects its generator and selection rules. Multilingual or domain mixtures can improve one capability
    while reducing another under a fixed budget. Mixture schedules can change during training.
  text_mode: Repeating a high-quality source can strengthen a desired skill, but can also overfit or increase memorization.
    Synthetic data reflects its generator and selection rules. Multilingual or domain mixtures can improve one capability
    while reducing another under a fixed budget. Mixture schedules can change during training.
  bridges: []
- id: training-data-mixtures.s4
  title: Evaluate the recipe as an intervention
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-data-mixtures
  markdown: Compare held-out losses and target tasks across sources, not only a single overall average. Keep evaluation
    data independent of mixture tuning where possible. Report sampling rules, repetitions, and stage boundaries.
    A model’s expert routing is a separate mechanism from choosing which training documents it sees.
  text_mode: Compare held-out losses and target tasks across sources, not only a single overall average. Keep evaluation
    data independent of mixture tuning where possible. Report sampling rules, repetitions, and stage boundaries.
    A model’s expert routing is a separate mechanism from choosing which training documents it sees.
  bridges: []
- id: training-data-mixtures.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.training-data-mixtures
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Data mixtures control sampling across sources and stages; token accounting, repetition, quality, and
    held-out performance determine the effect of those choices.
- id: training-data-mixtures.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.training-data-mixtures
  markdown: Data mixtures control sampling across sources and stages; token accounting, repetition, quality, and
