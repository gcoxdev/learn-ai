schema_version: 0.2-draft
lesson:
  id: training-data-mixtures
  version: 0.4.0-draft
  title: Choose how much the model sees of each source
  state: draft
  summary: Kestrel's encyclopedia is 1% of its data on disk but gets 5% of its training. Work out how many times each source is read, and when repetition stops helping.
  slot: M16.3
  category: learning
  sources:
    - title: Brown et al. — Language Models are Few-Shot Learners (GPT-3, 2020), Table 2.2
      url: https://arxiv.org/abs/2005.14165
    - title: Muennighoff et al. — Scaling Data-Constrained Language Models (2023)
      url: https://arxiv.org/abs/2305.16264
    - title: 'Xie et al. — DoReMi: Optimizing Data Mixtures Speeds Up Language Model Pretraining (2023)'
      url: https://arxiv.org/abs/2305.10429
    - title: The Llama 3 Herd of Models (2024)
      url: https://arxiv.org/abs/2407.21783
    - title: Groeneveld et al. — OLMo, an open language-model framework
      url: https://arxiv.org/abs/2402.00838
  archetype: mechanism
objectives:
  - id: objective.training-data-mixtures
    version: 3-draft
    statement: Calculate expected token exposure from mixture weights and distinguish source size, sampling share, oversampling, and validation-based selection.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - training-data-mixtures.base.v3
      - training-data-mixtures.transfer.v3
      - training-data-mixtures.calculate
    prerequisites:
      - anyOf:
          - objective.pretraining-data-pipeline
      - anyOf:
          - objective.stochastic-gradients
scenes:
  - id: training-data-mixtures.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.training-data-mixtures
    title: What's on disk isn't what gets read
    markdown: |-
      Kestrel's pipeline produced five cleaned sources, 364 billion tokens in all. The training budget is 100 billion tokens. If the team drew tokens at random from the whole pile, web text would fill 82% of every batch, and the 4-billion-token encyclopedia, probably the most carefully written text they have, would fill about 1%.

      So they write a reading schedule instead. A **mixture** assigns each source a **sampling weight**: the share of training tokens drawn from it. The weights must add up to 1. One full pass through a source is an **epoch**, so the number of epochs tells you how many times, on average, the model reads each document.

      | Source | On disk | Weight | Tokens read | Epochs |
      | --- | ---: | ---: | ---: | ---: |
      | Web (filtered) | 300B | 0.60 | 60B | 0.20 |
      | Code | 30B | 0.15 | 15B | 0.50 |
      | Books | 20B | 0.10 | 10B | 0.50 |
      | Science papers | 10B | 0.10 | 10B | 1.00 |
      | Encyclopedia | 4B | 0.05 | 5B | 1.25 |

      Most of the web is never read at all. The encyclopedia is read one and a quarter times. Raising a source's weight above its natural share is called **upsampling**.
    bridges: []
  - id: training-data-mixtures.s2
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.training-data-mixtures
    title: From weights to epochs
    markdown: |-
      Every row of that table comes from one formula:

      :::papers Epochs per source
      $$\text{epochs}_i = \frac{w_i \, D}{S_i}$$

      $w_i$ is source $i$'s sampling weight, $D$ is the total training tokens, and $S_i$ is the source's size in tokens. For the encyclopedia: $0.05 \times 100\text{B} / 4\text{B} = 1.25$. For the web: $0.60 \times 100\text{B} / 300\text{B} = 0.2$. Size-proportional weights would be $w_i = S_i / \sum_j S_j$, which gives every source the same number of epochs.
      :::

      :::predict The team moves 10 points of weight from web to encyclopedia (web 0.50, encyclopedia 0.15). How many times is the encyclopedia now read?
      $0.15 \times 100\text{B} / 4\text{B} = 3.75$ epochs. The web drops to $0.50 \times 100 / 300 \approx 0.17$ epochs. A small change in weight is a large change in repetition for a small source.
      :::

      ```python run
      total = 100e9  # Kestrel's training budget in tokens
      sources = {    # name: (tokens on disk, sampling weight)
          "web":          (300e9, 0.60),
          "code":         (30e9,  0.15),
          "books":        (20e9,  0.10),
          "science":      (10e9,  0.10),
          "encyclopedia": (4e9,   0.05),
      }
      assert abs(sum(w for _, w in sources.values()) - 1) < 1e-9, "weights must sum to 1"

      disk = sum(size for size, _ in sources.values())
      for name, (size, w) in sources.items():
          seen = w * total
          epochs = seen / size
          note = "  <- repeated" if epochs > 1 else ""
          print(f"{name:12s} w={w:.2f}  seen {seen/1e9:5.1f}B of {size/1e9:5.1f}B"
                f"  epochs {epochs:4.2f}  (by size: w={size/disk:.3f}){note}")
      ```

      Change the weights to test the prediction above, or set `total = 1000e9` to see what a ten-times-longer run would do to every source.

      :::story GPT-3's reading schedule
      GPT-3 (2020) trained on 300 billion tokens. Its paper reported that the filtered Common Crawl, 410 billion tokens and 60% of the mix, was read about 0.44 times, while English Wikipedia, only 3 billion tokens, was read about 3.4 times. The authors chose weights "intentionally" out of proportion to size, trading a little repetition for more high-quality text.
      :::
    bridges:
      - probability
      - arithmetic
  - id: training-data-mixtures.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.training-data-mixtures
    title: The fifth reading teaches less than the first
    markdown: |-
      Why not read the encyclopedia 20 times? Because repeated tokens are worth less than new ones. Muennighoff et al. (2023) trained hundreds of models on repeated data and found that up to about 4 epochs, repeated tokens were almost as good as fresh ones. Beyond that, each extra pass helped less and less, and with many repetitions extra compute was nearly wasted.

      :::mixup "Upsampling a small source gives the model more of it."
      It gives the model *more readings* of the same text, not more information. Twenty passes over 4 billion tokens still contain 4 billion tokens' worth of facts and phrasing, and heavily repeated passages are more likely to be memorized and recited word for word.
      :::

      The Kestrel team adopts a working rule: no source above about 4 epochs unless they have tested it. If a source matters that much, they look for more of it rather than repeating it harder.
    bridges: []
  - id: training-data-mixtures.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.training-data-mixtures
    title: Weight tokens, not documents
    markdown: |-
      A colleague suggests "equal weight for code and forum posts". Equal what? Suppose each training batch takes 1,000 documents from each. Code files here average 2,000 tokens and forum posts average 200. The batch then holds 2,000,000 code tokens and 200,000 forum tokens: a 10-to-1 split, not 1-to-1.

      So Kestrel's weights, like most published mixtures, are shares of *tokens*. When you read someone else's mixture, check the unit first: tokens, documents, or bytes.
    bridges: []
  - id: training-data-mixtures.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.training-data-mixtures
    title: Pick the weights with small runs
    markdown: |-
      No formula tells you the best weights. Teams run experiments. The Kestrel team trains six 150-million-parameter models for 3 billion tokens each, one per candidate mixture, and scores them on held-out text from every domain plus a few benchmarks. More code helps coding tasks and slightly hurts general writing, because in a fixed budget every token given to one source is taken from another.

      Choosing a mixture by its validation scores is tuning, just like choosing a learning rate. The team keeps a separate test set untouched until the final model is done.

      Some methods search automatically. DoReMi (Xie et al., 2023) trained a small 280-million-parameter proxy model to find domain weights for The Pile, then used them to train an 8-billion-parameter model that reached the baseline's accuracy in 2.6 times fewer steps.
    bridges: []
  - id: training-data-mixtures.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.training-data-mixtures
    title: The mix can change as training goes
    markdown: |-
      Weights don't have to stay fixed. A common pattern is to save the best data for the end: in the final stretch of training, while the learning rate falls to its lowest values, upsample the highest-quality sources. The Llama 3 report (2024) describes this kind of change, upsampling very high-quality sources at the end of pretraining as the learning rate was annealed to zero. A schedule like this is sometimes called a data **curriculum**, a plan for what the model sees when.

      Kestrel's plan: the table's weights for the first 90 billion tokens, then encyclopedia and science raised to 0.15 each for the last 10 billion. That last phase alone reads the encyclopedia $0.15 \times 10\text{B} / 4\text{B} = 0.375$ more times, on top of $0.05 \times 90\text{B} / 4\text{B} = 1.125$ in the first phase: 1.5 epochs in all. The team logs tokens actually consumed from each source per phase, because a run described only by its final weights can't be reproduced.
    bridges: []
  - id: training-data-mixtures.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.training-data-mixtures
    markdown: Epoch counts to compute, plus a code-heavy assistant, a low-resource language, and a mixture chosen by validation scores, test whether you can set weights and see what they cost.
    takeaway: |-
      A mixture decides how many times each source is read: epochs = weight × total tokens ÷ source size. Upsampling adds readings, not information, and repeats beyond about 4 epochs help less and less.
  - id: training-data-mixtures.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.training-data-mixtures
    markdown: |-
      The material stored on disk and the material seen during training are different quantities. Sampling shares determine exposure; independent evaluation shows what the mixture helped or harmed.
  - id: training-data-mixtures.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.training-data-mixtures
    title: Does repetition create new evidence?
    markdown: |-
      Try it on a tiny source. A schedule reads 300 tokens from a source that holds only 100 distinct tokens, so some text is read more than once. What should the training report keep separate?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: Total exposures and unique data coverage
        - id: b
          text: Token exposures and the file’s display color
        - id: c
          text: The source’s name and the alphabetic order of that name
      answer: a
      reveal_markdown: |-
        300 exposures of a 100-token source is 3 epochs: the model reads the same text three times. That's three readings of one source's worth of information, so report both numbers.
      hint: Work out the epochs (exposures ÷ source size), then ask whether a second reading adds new text.
      id: training-data-mixtures.practice.v2.7
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - training-data-mixtures.s1
