assessment_families:
  - id: training-data-mixtures.base
    objective_ref: objective.training-data-mixtures
    task: base
    response_type: single_choice
    points: 1
    hint: 'Calculate a simple allocation: trace the inputs, operation, and result before choosing.'
    remediation_scene: training-data-mixtures.s2
    variants:
      - id: training-data-mixtures.base.1
        prompt: A 20,000-token budget assigns weight 0.25 to code. Expected code tokens?
        options:
          - id: c
            text: '250'
          - id: a
            text: 5,000
          - id: b
            text: 20,000
        answer: a
        feedback: Multiply the token budget by the intended token proportion.
        retired: true
      - id: training-data-mixtures.base.2
        prompt: Do equal document sampling weights guarantee equal token counts?
        options:
          - id: a
            text: No; document lengths can differ
          - id: b
            text: 'Yes'
          - id: c
            text: Only if a model is dense
        answer: a
        feedback: The sampling unit determines how source exposure accumulates.
        retired: true
  - id: training-data-mixtures.transfer
    objective_ref: objective.training-data-mixtures
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate the recipe as an intervention: trace the inputs, operation, and result before choosing.'
    remediation_scene: training-data-mixtures.s4
    variants:
      - id: training-data-mixtures.transfer.1
        prompt: A small corpus is repeated many times. What should evaluation inspect?
        options:
          - id: a
            text: Overfitting, memorization, and target-skill tradeoffs
          - id: b
            text: Only the raw unique file count
          - id: c
            text: A guarantee of unlimited new information
        answer: a
        feedback: Repeated exposure changes emphasis without creating equivalent new independent data.
        retired: true
      - id: training-data-mixtures.transfer.2
        prompt: One mixture improves code but hurts another language. What does this illustrate?
        options:
          - id: b
            text: An impossible measurement
          - id: c
            text: That sampling weights have no effect
          - id: a
            text: A capability tradeoff under the chosen budget and data recipe
        answer: a
        feedback: Mixture choices can redistribute finite training effort.
        retired: true
  - id: training-data-mixtures.base.v2
    objective_ref: objective.training-data-mixtures
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: training-data-mixtures.s3
    variants:
      - prompt: A token-level mixture allocates 30% of an expected 1000-token budget to code. Record expected code tokens and expected non-code tokens.
        answers:
          code: 300.0
          other: 700.0
        reason_answer: a
        reason_options:
          - id: a
            text: Multiply the budget by the specified token share.
          - id: c
            text: Treat the percentage as a fixed number of tokens.
          - id: b
            text: Use the source’s file count instead of its sampling share.
        feedback: Expected exposure equals budget times share; the remaining share goes to other sources.
        id: training-data-mixtures.base.v2.1
        retired: true
      - prompt: A token-level mixture allocates 25% of an expected 800-token budget to code. Record expected code tokens and expected non-code tokens.
        answers:
          code: 200.0
          other: 600.0
        reason_answer: a
        reason_options:
          - id: c
            text: Treat the percentage as a fixed number of tokens.
          - id: a
            text: Multiply the budget by the specified token share.
          - id: b
            text: Use the source’s file count instead of its sampling share.
        feedback: Expected exposure equals budget times share; the remaining share goes to other sources.
        id: training-data-mixtures.base.v2.2
        retired: true
      - prompt: A token-level mixture allocates 50% of an expected 600-token budget to code. Record expected code tokens and expected non-code tokens.
        answers:
          code: 300.0
          other: 300.0
        reason_answer: a
        reason_options:
          - id: b
            text: Use the source’s file count instead of its sampling share.
          - id: c
            text: Treat the percentage as a fixed number of tokens.
          - id: a
            text: Multiply the budget by the specified token share.
        feedback: Expected exposure equals budget times share; the remaining share goes to other sources.
        id: training-data-mixtures.base.v2.3
        retired: true
      - prompt: A token-level mixture allocates 20% of an expected 500-token budget to code. Record expected code tokens and expected non-code tokens.
        answers:
          code: 100.0
          other: 400.0
        reason_answer: a
        reason_options:
          - id: b
            text: Use the source’s file count instead of its sampling share.
          - id: c
            text: Treat the percentage as a fixed number of tokens.
          - id: a
            text: Multiply the budget by the specified token share.
        feedback: Expected exposure equals budget times share; the remaining share goes to other sources.
        id: training-data-mixtures.base.v2.4
        retired: true
    numeric_fields:
      - id: code
        label: Expected code-token exposures
      - id: other
        label: Expected other-token exposures
    absolute_tolerance: 1e-6
  - id: training-data-mixtures.transfer.v2
    objective_ref: objective.training-data-mixtures
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: training-data-mixtures.s3
    variants:
      - prompt: A source has 100 unique examples and is sampled 300 times. What has increased?
        answer: a
        options:
          - id: b
            text: The count of distinct examples necessarily increased to 300
          - id: a
            text: Exposure, with possible repetition of the same evidence
          - id: c
            text: The source’s factual correctness tripled
        feedback: Sampling more often does not create additional distinct examples.
        id: training-data-mixtures.transfer.v2.1
        retired: true
      - prompt: A recipe says “equal source weights” but not the sampling unit. What needs clarification?
        answer: a
        options:
          - id: a
            text: Whether weights apply to tokens, documents, or batches
          - id: b
            text: Whether equal document shares imply equal token shares
          - id: c
            text: Whether a final overall loss can recover the undisclosed sampling unit
        feedback: Different sampling units produce different token exposures.
        id: training-data-mixtures.transfer.v2.2
        retired: true
      - prompt: A new mixture improves code validation but harms general writing. What is the decision about?
        answer: a
        options:
          - id: b
            text: A proof that mixture choice never matters
          - id: c
            text: A tokenizer error established by the scores alone
          - id: a
            text: A task-dependent tradeoff across the intended use distribution
        feedback: Evaluate the intended capability mix rather than declaring a universal winner.
        id: training-data-mixtures.transfer.v2.3
        retired: true
      - prompt: A run changes mixture shares halfway through. What should its record include?
        answer: a
        options:
          - id: a
            text: The schedule and actual consumed counts
          - id: c
            text: Only the total number of source files
          - id: b
            text: Only the final mixture settings
        feedback: The full exposure history matters; final weights alone do not describe the run.
        id: training-data-mixtures.transfer.v2.4
        retired: true
  - id: training-data-mixtures.base.v3
    objective_ref: objective.training-data-mixtures
    task: base
    response_type: single_choice
    points: 1
    hint: A weight is a share of the training tokens, not of the source. Epochs = weight × total tokens ÷ source size, and extra epochs repeat the same text.
    remediation_scene: training-data-mixtures.s2
    variants:
      - id: training-data-mixtures.base.v3.1
        prompt: A 5-billion-token source gets a sampling weight of 0.10 in a 100-billion-token run. How is it treated?
        options:
          - id: c
            text: One-tenth of it is read once, and the rest is skipped
          - id: a
            text: It is read about twice, so it is upsampled
          - id: b
            text: It is read once, since the weight only sets its batch position
        answer: a
        feedback: 0.10 × 100B = 10B tokens drawn from a 5B source is 2 epochs. Reading the weight as the fraction of the source that is used confuses a share of the run with a share of the source.
      - id: training-data-mixtures.base.v3.2
        prompt: Why do teams hesitate to read a small, high-quality source more than about four times?
        options:
          - id: a
            text: Later passes add little new learning and raise the risk of memorization
          - id: b
            text: The tokenizer must be retrained after a source has been read four times
          - id: c
            text: The training loss on that source rises as soon as it is repeated
        answer: a
        feedback: Muennighoff et al. found repeats up to about 4 epochs are nearly as good as fresh data, with fading value after that, and heavy repetition encourages word-for-word recall. Nothing about repetition breaks the tokenizer, and training loss on repeated text usually keeps falling.
      - id: training-data-mixtures.base.v3.3
        prompt: A recipe samples equal numbers of documents from legal contracts (5,000 tokens each) and tweets (50 tokens each). What does that do to token exposure?
        options:
          - id: b
            text: Tokens split evenly, since each source gets the same number of picks
          - id: c
            text: Tweets get more tokens, since short documents fit more easily into batches
          - id: a
            text: Contracts get about 100 times as many tokens as tweets
        answer: a
        feedback: Each pick of a contract brings 5,000 tokens and each tweet 50, a 100-to-1 split. Equal document counts give equal tokens only when documents are the same length.
      - id: training-data-mixtures.base.v3.4
        prompt: A team sets every source's weight to its share of the tokens on disk. What happens to a small, carefully edited source?
        options:
          - id: a
            text: It gets a tiny share of training, the same epochs as the huge web crawl
          - id: c
            text: It gets read many more times than the web, because it is small
          - id: b
            text: It gets an equal share with every other source, whatever its size
        answer: a
        feedback: Size-proportional weights give every source the same number of epochs, so a 1% source fills 1% of training. Upsampling is what makes small sources count; equal shares would be a different rule.
  - id: training-data-mixtures.transfer.v3
    objective_ref: objective.training-data-mixtures
    task: transfer
    response_type: single_choice
    points: 1
    hint: In a fixed budget, raising one weight lowers others. Work out what the change does to epochs, then ask what that costs.
    remediation_scene: training-data-mixtures.s4
    variants:
      - id: training-data-mixtures.transfer.v3.1
        prompt: A team building a coding assistant raises code from 15% to 60% of a fixed 100-billion-token run. What should they check before committing?
        options:
          - id: c
            text: Whether the code source is big enough to fill a single epoch
          - id: a
            text: How general writing and reasoning scores change, since other sources shrink
          - id: b
            text: Whether the tokenizer now needs a larger context length for code
        answer: a
        feedback: In a fixed budget, 45 extra points of code come out of every other source, so general skills can drop. A code source only needs to be big enough to avoid heavy repetition, and the context length is set on the config card, not by the mixture.
      - id: training-data-mixtures.transfer.v3.2
        prompt: A lab has 2 billion tokens of Icelandic and proposes a weight of 0.20 in a 100-billion-token run. What is the main concern?
        options:
          - id: b
            text: The Icelandic text would be read less than once, wasting most of it
          - id: c
            text: Mixing languages in one run stops the model from learning either
          - id: a
            text: The Icelandic text would be read 10 times, well past useful repetition
        answer: a
        feedback: 0.20 × 100B ÷ 2B = 10 epochs, beyond the roughly 4 where repeats keep most of their value. Better options are a lower weight or more Icelandic data. Multilingual models learn many languages in one run.
      - id: training-data-mixtures.transfer.v3.3
        prompt: A team trains six small models on six candidate mixtures and picks the one with the best validation scores. How should they report the final model's performance?
        options:
          - id: a
            text: On a test set that played no part in choosing the mixture
          - id: b
            text: On the same validation set, since it picked the winning mixture
          - id: c
            text: On the six small models' average, since they share the data
        answer: a
        feedback: Picking the mixture by validation scores is tuning, so those scores are optimistic. An untouched test set gives an honest number. The small models' average measures different models.
      - id: training-data-mixtures.transfer.v3.4
        prompt: A run uses one mixture for 900 billion tokens, then upsamples math and code for its last 100 billion. What must its training record include to be reproducible?
        options:
          - id: c
            text: The final weights, since those are the ones the finished model saw last
          - id: a
            text: Both phases' weights and the tokens actually read from each source
          - id: b
            text: The first phase's weights, since that phase covers 90% of training
        answer: a
        feedback: Either phase alone describes a different run. Logging the schedule and the consumed tokens per source lets someone rebuild what the model actually read.
  - id: training-data-mixtures.calculate
    objective_ref: objective.training-data-mixtures
    task: base
    response_type: numeric
    points: 1
    hint: Epochs = sampling weight × total training tokens ÷ tokens in the source. Keep both token counts in the same units.
    remediation_scene: training-data-mixtures.s2
    absolute_tolerance: 0.01
    variants:
      - id: training-data-mixtures.calculate.1
        prompt: A source holds 5 billion tokens and has sampling weight 0.20 in a 50-billion-token run. How many epochs of it does the model read?
        answer: 2
        feedback: 0.20 × 50B = 10B tokens drawn from a 5B source, so 10 ÷ 5 = 2 epochs.
      - id: training-data-mixtures.calculate.2
        prompt: A 3-billion-token encyclopedia has weight 0.05 in a 300-billion-token run. How many epochs?
        answer: 5
        feedback: 0.05 × 300B = 15B tokens from a 3B source, so 15 ÷ 3 = 5 epochs, past the roughly 4 where repeats keep most of their value.
      - id: training-data-mixtures.calculate.3
        prompt: A 2-trillion-token web crawl has weight 0.60 in a 1-trillion-token run. How many epochs?
        answer: 0.3
        feedback: 0.60 × 1T = 0.6T tokens from a 2T source, so 0.6 ÷ 2 = 0.3 epochs. Most of the crawl is never read.
      - id: training-data-mixtures.calculate.4
        prompt: A 12-billion-token book collection has weight 0.08 in a 300-billion-token run. How many epochs?
        answer: 2
        feedback: 0.08 × 300B = 24B tokens from a 12B source, so 24 ÷ 12 = 2 epochs.
