schema_version: 0.2-draft
lesson:
  id: training-data-mixtures
  version: 0.2.0-draft
  title: Choose how much the model sees of each source
  state: draft
  summary: Plan a reading diet for a model, then calculate how sampling changes the examples it actually practices.
  slot: M16.3
  category: learning
  sources:
  - title: Groeneveld et al. — OLMo, an open language-model framework
    url: https://arxiv.org/abs/2402.00838
  - title: Biderman et al. — Pythia, a suite for analyzing language-model training
    url: https://arxiv.org/abs/2304.01373
  - title: Hoffmann et al. — Training Compute-Optimal Large Language Models
    url: https://arxiv.org/abs/2203.15556
  archetype: mechanism
objectives:
- id: objective.training-data-mixtures
  version: 2-draft
  statement: Calculate expected token exposure from mixture weights and distinguish source size, sampling share,
    oversampling, and validation-based selection.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - training-data-mixtures.base.v2
  - training-data-mixtures.transfer.v2
  prerequisites:
  - anyOf:
    - objective.pretraining-data-pipeline
  - anyOf:
    - objective.stochastic-gradients
scenes:
- id: training-data-mixtures.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.training-data-mixtures
  title: A library and a reading schedule are different
  markdown: Suppose a training collection contains stories, code, and science explanations. Having ten times more
    story tokens on disk does not require reading ten times more stories during training. A **mixture** specifies
    how often sources are sampled. A **sampling weight** controls a source’s share under a stated scheme. The learning
    signal depends on the examples actually consumed, their order, and their targets. Inventory size and training
    exposure answer different questions.
  text_mode: Suppose a training collection contains stories, code, and science explanations. Having ten times more
    story tokens on disk does not require reading ten times more stories during training. A **mixture** specifies
    how often sources are sampled. A **sampling weight** controls a source’s share under a stated scheme. The learning
    signal depends on the examples actually consumed, their order, and their targets. Inventory size and training
    exposure answer different questions.
  bridges: []
- id: training-data-mixtures.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.training-data-mixtures
  title: Turn weights into an exposure budget
  markdown: 'Choose token-level mixture shares of 50% stories, 30% code, and 20% science. For an expected budget
    of 1,000 sampled tokens, those shares correspond to 500, 300, and 200 tokens. They sum to the total. These are
    expected counts under random sampling unless a schedule enforces exact quotas. Check whether a recipe weights
    tokens, documents, or batches: equally weighting long and short documents can create unequal token exposure.'
  text_mode: 'Choose token-level mixture shares of 50% stories, 30% code, and 20% science. For an expected budget
    of 1,000 sampled tokens, those shares correspond to 500, 300, and 200 tokens. They sum to the total. These are
    expected counts under random sampling unless a schedule enforces exact quotas. Check whether a recipe weights
    tokens, documents, or batches: equally weighting long and short documents can create unequal token exposure.'
  bridges:
  - probability
  - arithmetic
- id: training-data-mixtures.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-data-mixtures
  title: Oversampling means meeting examples again
  markdown: Suppose the science source contains only 100 distinct tokens in our toy inventory, while the schedule
    requests 200 science-token exposures. The model must revisit material under a repeatable sampling scheme. This
    is **oversampling** relative to available unique data. Repetition may emphasize a useful domain, but it does
    not create 200 distinct tokens of new evidence. Excess repetition can encourage memorization or reduce diversity.
    Record both total exposures and unique-source coverage.
  text_mode: Suppose the science source contains only 100 distinct tokens in our toy inventory, while the schedule
    requests 200 science-token exposures. The model must revisit material under a repeatable sampling scheme. This
    is **oversampling** relative to available unique data. Repetition may emphasize a useful domain, but it does
    not create 200 distinct tokens of new evidence. Excess repetition can encourage memorization or reduce diversity.
    Record both total exposures and unique-source coverage.
  bridges: []
- id: training-data-mixtures.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-data-mixtures
  title: Evaluate the diet on more than one dish
  markdown: A code-heavy mixture might improve code tasks while changing general writing or other domains. Evaluate
    the intended range using protected source-separated examples and comparable budgets. If you try several mixture
    settings and choose one using validation scores, that choice is part of development. Preserve a final evaluation
    for the selected recipe. “Best mixture” is incomplete without a task distribution, data constraints, compute
    budget, and quality criteria.
  text_mode: A code-heavy mixture might improve code tasks while changing general writing or other domains. Evaluate
    the intended range using protected source-separated examples and comparable budgets. If you try several mixture
    settings and choose one using validation scores, that choice is part of development. Preserve a final evaluation
    for the selected recipe. “Best mixture” is incomplete without a task distribution, data constraints, compute
    budget, and quality criteria.
  bridges: []
- id: training-data-mixtures.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.training-data-mixtures
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Stored size is not training exposure. Mixture weights choose the practice diet; validate the resulting
    capabilities and tradeoffs.
- id: training-data-mixtures.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.training-data-mixtures
  markdown: Data mixtures control sampling across sources and stages; token accounting, repetition, quality, and
    held-out performance determine the effect of those choices.
  text_mode: Data mixtures control sampling across sources and stages; token accounting, repetition, quality, and
    held-out performance determine the effect of those choices.
- id: training-data-mixtures.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-data-mixtures
  title: A changing schedule needs a record
  markdown: Some training runs change source shares over time. A **curriculum** in this context is a schedule for
    which examples or difficulty levels are emphasized during learning; it is separate from our human course chapters.
    A run that uses 80% stories early and 20% later cannot be fully described by its final weights. Save schedule
    versions, sampling state when needed for resumption, and actual consumed counts. Expected shares are a plan;
    realized exposure is a measurement.
  text_mode: Some training runs change source shares over time. A **curriculum** in this context is a schedule for
    which examples or difficulty levels are emphasized during learning; it is separate from our human course chapters.
    A run that uses 80% stories early and 20% later cannot be fully described by its final weights. Save schedule
    versions, sampling state when needed for resumption, and actual consumed counts. Expected shares are a plan;
    realized exposure is a measurement.
  bridges: []
- id: training-data-mixtures.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-data-mixtures
  title: Separate data quality from its volume
  markdown: A larger source can contain duplicates, errors, or examples outside the intended use. A small carefully
    chosen source can be useful, but its influence and limits still need evaluation. Inspect provenance, filtering,
    representation, and coverage alongside sampling weights. The memory cue is “inventory, diet, exposure, results.”
    It helps distinguish what was available, what was requested, what the model consumed, and which changes were
    demonstrated on held-out tasks.
  text_mode: A larger source can contain duplicates, errors, or examples outside the intended use. A small carefully
    chosen source can be useful, but its influence and limits still need evaluation. Inspect provenance, filtering,
    representation, and coverage alongside sampling weights. The memory cue is “inventory, diet, exposure, results.”
    It helps distinguish what was available, what was requested, what the model consumed, and which changes were
    demonstrated on held-out tasks.
  bridges: []
- id: training-data-mixtures.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.training-data-mixtures
  title: Does repetition create new evidence?
  markdown: A schedule consumes 300 token exposures from a source containing 100 distinct tokens. What should the
    report keep separate?
  text_mode: A schedule consumes 300 token exposures from a source containing 100 distinct tokens. What should the
    report keep separate?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: Total exposures and unique data coverage
    - id: b
      text: Token exposures and the file’s display color
    - id: c
      text: The source’s name and the alphabetic order of that name
    answer: a
    reveal_markdown: Repeated exposure can influence learning but does not multiply the amount of distinct source
      evidence.
    hint: Trace the example using the rule from the preceding pages.
    id: training-data-mixtures.practice.v2.7
