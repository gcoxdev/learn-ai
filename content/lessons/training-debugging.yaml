  bridges: []
- id: training-debugging.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.training-debugging
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Follow one small batch from input to loss, gradient, and updated weight. Fix the first mismatch
    with your expected calculation before trying a larger run.
- id: training-debugging.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.training-debugging
  markdown: Follow one small batch from input to loss, gradient, and updated weight. Fix the first mismatch
    with your expected calculation before trying a larger run.
  text_mode: Follow one small batch from input to loss, gradient, and updated weight. Fix the first mismatch
    with your expected calculation before trying a larger run.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - training-debugging.s1
