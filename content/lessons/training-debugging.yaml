schema_version: 0.2-draft
lesson:
  id: training-debugging
  version: 0.1.0-draft
  title: Find the first broken assumption in a training run
  state: draft
  summary: Training diagnosis checks data, shapes, loss, gradients, updates, and evaluation in order; divergence,
    plateaus, and noisy metrics can have different causes.
  slot: M10.8
  category: learning
  minutes: 12
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.training-debugging
  version: 1-draft
  statement: Training diagnosis checks data, shapes, loss, gradients, updates, and evaluation in order; divergence,
    plateaus, and noisy metrics can have different causes.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - training-debugging.base
  - training-debugging.transfer
  prerequisites:
  - anyOf:
    - objective.stochastic-gradients
  - anyOf:
    - objective.stable-training
  - anyOf:
    - objective.splits-and-leakage
scenes:
- id: training-debugging.s1
  title: Start with a tiny inspectable batch
  type: explanation
  depth: intuition
  objective_refs:
  - objective.training-debugging
  markdown: Print or inspect a few inputs, targets, predictions, and loss terms with their shapes and units. Confirm
    that targets correspond to the intended examples. A network can optimize a perfectly implemented loss for the
    wrong labels, so a falling curve is not sufficient evidence.
  text_mode: Print or inspect a few inputs, targets, predictions, and loss terms with their shapes and units. Confirm
    that targets correspond to the intended examples. A network can optimize a perfectly implemented loss for the
    wrong labels, so a falling curve is not sufficient evidence.
  bridges: []
- id: training-debugging.s2
  title: Check that parameters actually change
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-debugging
  markdown: Trace whether gradients exist, have sensible scale, and reach the intended parameters. Verify the optimizer
    contains those parameters and that an update occurs. Accidentally detached tensors, frozen weights, missing
    optimizer steps, or repeated gradient accumulation can make a run behave very differently from its diagram.
  text_mode: Trace whether gradients exist, have sensible scale, and reach the intended parameters. Verify the optimizer
    contains those parameters and that an update occurs. Accidentally detached tensors, frozen weights, missing
    optimizer steps, or repeated gradient accumulation can make a run behave very differently from its diagram.
  bridges: []
- id: training-debugging.s3
  title: Interpret common curve patterns
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-debugging
  markdown: Exploding loss suggests examining step scale, invalid arithmetic, data spikes, or target errors. A plateau
    may reflect weak signal, poor learning rate, saturation, or an already limited objective. Noisy validation can
    come from a small sample or stochastic evaluation. These are hypotheses to test, not diagnoses supplied by curve
    shape alone.
  text_mode: Exploding loss suggests examining step scale, invalid arithmetic, data spikes, or target errors. A
    plateau may reflect weak signal, poor learning rate, saturation, or an already limited objective. Noisy validation
    can come from a small sample or stochastic evaluation. These are hypotheses to test, not diagnoses supplied
    by curve shape alone.
  bridges: []
- id: training-debugging.s4
  title: Change one factor and preserve evidence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-debugging
  markdown: Try overfitting a tiny clean sample, compare with a baseline, or run a numerical gradient check. Record
    the change and expected consequence before rerunning. Keep failed-run logs and checkpoints when useful. If validation
    seems implausibly strong, inspect leakage before celebrating an architectural breakthrough.
  text_mode: Try overfitting a tiny clean sample, compare with a baseline, or run a numerical gradient check. Record
    the change and expected consequence before rerunning. Keep failed-run logs and checkpoints when useful. If validation
    seems implausibly strong, inspect leakage before celebrating an architectural breakthrough.
  bridges: []
- id: training-debugging.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.training-debugging
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: training-debugging.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.training-debugging
  markdown: Training diagnosis checks data, shapes, loss, gradients, updates, and evaluation in order; divergence,
    plateaus, and noisy metrics can have different causes.
  text_mode: Training diagnosis checks data, shapes, loss, gradients, updates, and evaluation in order; divergence,
    plateaus, and noisy metrics can have different causes.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - training-debugging.s1
    - training-debugging.s2
    - training-debugging.s3
    - training-debugging.s4
    - training-debugging.check
    - training-debugging.recap
    gate_refs:
    - gate.core
assessment_families:
- id: training-debugging.base
  objective_ref: objective.training-debugging
  task: base
  response_type: single_choice
  points: 1
  hint: 'Check that parameters actually change: trace the inputs, operation, and result before choosing.'
  remediation_scene: training-debugging.s2
  variants:
  - id: training-debugging.base.1
    prompt: Loss decreases on misaligned labels. Has the intended task been validated?
    options:
    - id: b
      text: Yes; decreasing loss proves correctness
    - id: c
      text: Only if the model is large
    - id: a
      text: No; the optimized target is wrong
    answer: a
    feedback: Optimization can faithfully fit an incorrectly constructed task.
  - id: training-debugging.base.2
    prompt: Gradients exist but weights never change. What should be checked?
    options:
    - id: c
      text: Only token decoding temperature
    - id: a
      text: Optimizer parameter membership and update execution
    - id: b
      text: Only the chart color
    answer: a
    feedback: Gradient computation and parameter updates are separate steps.
- id: training-debugging.transfer
  objective_ref: objective.training-debugging
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Change one factor and preserve evidence: trace the inputs, operation, and result before choosing.'
  remediation_scene: training-debugging.s4
  variants:
  - id: training-debugging.transfer.1
    prompt: Validation accuracy is suspiciously perfect. What should be investigated?
    options:
    - id: c
      text: A proof of general intelligence
    - id: a
      text: Leakage and evaluation construction
    - id: b
      text: Only making the model smaller
    answer: a
    feedback: Unexpectedly strong results can reveal information boundary failures.
  - id: training-debugging.transfer.2
    prompt: A curve plateaus. Is a larger learning rate always the fix?
    options:
    - id: a
      text: No; several data, model, objective, or optimization causes are possible
    - id: b
      text: Yes; every plateau has one cause
    - id: c
      text: Only if the loss is positive
    answer: a
    feedback: A plateau is an observation that needs targeted diagnosis.
