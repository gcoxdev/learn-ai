schema_version: 0.2-draft
lesson:
  id: training-debugging
  version: 0.3.0-draft
  title: Find the first broken assumption in a training run
  state: draft
  summary: Follow one tiny training step and find the first point where the calculation differs from what you
    expected.
  slot: M10.8
  category: learning
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.training-debugging
  version: 1-draft
  statement: Training diagnosis checks data, shapes, loss, gradients, updates, and evaluation in order; divergence,
    plateaus, and noisy metrics can have different causes.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - training-debugging.base
  - training-debugging.transfer
  prerequisites:
  - anyOf:
    - objective.stochastic-gradients
  - anyOf:
    - objective.stable-training
  - anyOf:
    - objective.splits-and-leakage
scenes:
- id: training-debugging.s1
  title: Start with a tiny inspectable batch
  type: explanation
  depth: intuition
  objective_refs:
  - objective.training-debugging
  markdown: 'Print or inspect a few inputs, targets, predictions, and loss terms with their shapes and units.
    Confirm that targets correspond to the intended examples. A network can optimize a perfectly implemented
    loss for the wrong labels, so a falling curve is not sufficient evidence.


    A tensor''s **shape** gives the size of each axis. Four predictions and four labels are not enough: prediction
    1 must correspond to label 1. Deliberately inspect one pair and compute its loss by hand. If the program
    reports a different result, fix that discrepancy before running a larger training job.'
  text_mode: 'Print or inspect a few inputs, targets, predictions, and loss terms with their shapes and units.
    Confirm that targets correspond to the intended examples. A network can optimize a perfectly implemented
    loss for the wrong labels, so a falling curve is not sufficient evidence.


    A tensor''s **shape** gives the size of each axis. Four predictions and four labels are not enough: prediction
    1 must correspond to label 1. Deliberately inspect one pair and compute its loss by hand. If the program
    reports a different result, fix that discrepancy before running a larger training job.'
  bridges: []
- id: training-debugging.s2
  title: Check that parameters actually change
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-debugging
  markdown: 'Trace whether gradients exist, have sensible scale, and reach the intended parameters. Verify
    the optimizer contains those parameters and that an update occurs. Accidentally detached tensors, frozen
    weights, missing optimizer steps, or repeated gradient accumulation can make a run behave very differently
    from its diagram.


    A **frozen** weight is intentionally excluded from learning. A **detached** calculation no longer passes
    derivatives back through that connection. Try the one-weight rule at input 2 and target 6: from weight
    0 and gradient −24, rate 0.1 should give weight 2.4. If the stored weight remains 0, investigate whether
    the update ran and whether it targeted the correct parameter.'
  text_mode: 'Trace whether gradients exist, have sensible scale, and reach the intended parameters. Verify
    the optimizer contains those parameters and that an update occurs. Accidentally detached tensors, frozen
    weights, missing optimizer steps, or repeated gradient accumulation can make a run behave very differently
    from its diagram.


    A **frozen** weight is intentionally excluded from learning. A **detached** calculation no longer passes
    derivatives back through that connection. Try the one-weight rule at input 2 and target 6: from weight
    0 and gradient −24, rate 0.1 should give weight 2.4. If the stored weight remains 0, investigate whether
    the update ran and whether it targeted the correct parameter.'
  bridges: []
- id: training-debugging.s3
  title: Interpret common curve patterns
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-debugging
  markdown: Exploding loss suggests examining step scale, invalid arithmetic, data spikes, or target errors.
    A plateau may reflect weak signal, poor learning rate, saturation, or an already limited objective. Noisy
    validation can come from a small sample or stochastic evaluation. These are hypotheses to test, not diagnoses
    supplied by curve shape alone.
  text_mode: Exploding loss suggests examining step scale, invalid arithmetic, data spikes, or target errors.
    A plateau may reflect weak signal, poor learning rate, saturation, or an already limited objective. Noisy
    validation can come from a small sample or stochastic evaluation. These are hypotheses to test, not diagnoses
    supplied by curve shape alone.
  bridges: []
- id: training-debugging.s4
  title: Change one factor and preserve evidence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-debugging
  markdown: 'Try overfitting a tiny clean sample, compare with a baseline, or run a numerical gradient check.
    Record the change and expected consequence before rerunning. Keep failed-run logs and checkpoints when
    useful. If validation seems implausibly strong, inspect leakage before celebrating an architectural breakthrough.


    To **overfit a tiny sample** deliberately is a diagnostic experiment: check whether the training machinery
    can learn a few clean examples at all. Success is not a final model-quality result. Failure can point to
    wrong labels, missing updates or an unsuitable model; it does not identify which one without further checks.'
  text_mode: 'Try overfitting a tiny clean sample, compare with a baseline, or run a numerical gradient check.
    Record the change and expected consequence before rerunning. Keep failed-run logs and checkpoints when
    useful. If validation seems implausibly strong, inspect leakage before celebrating an architectural breakthrough.


