scenes:
- id: pretraining-budget-and-checkpoints.s1
  title: A budget is a set of constraints
  type: explanation
  depth: intuition
  objective_refs:
  - objective.pretraining-budget-and-checkpoints
  markdown: A training proposal needs parameter count, token budget, sequence lengths, hardware time, memory, and
    evaluation cost. Approximate compute formulas can support planning, but architecture, attention length, recomputation,
    and utilization change real cost. Training FLOPs and paid accelerator hours are different accounting units.
  text_mode: A training proposal needs parameter count, token budget, sequence lengths, hardware time, memory, and
    evaluation cost. Approximate compute formulas can support planning, but architecture, attention length, recomputation,
    and utilization change real cost. Training FLOPs and paid accelerator hours are different accounting units.
  bridges: []
- id: pretraining-budget-and-checkpoints.s2
  title: Use scaling as an empirical fit
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.pretraining-budget-and-checkpoints
  markdown: Scaling laws summarize measured relationships among loss, size, data, and compute over tested ranges.
    Under a fixed training budget, an excessively large model can leave too little compute for useful token exposure.
    The preferred balance also changes when repeated inference cost matters.
  text_mode: Scaling laws summarize measured relationships among loss, size, data, and compute over tested ranges.
    Under a fixed training budget, an excessively large model can leave too little compute for useful token exposure.
    The preferred balance also changes when repeated inference cost matters.
  bridges: []
- id: pretraining-budget-and-checkpoints.s3
  title: Evaluate intermediate states
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.pretraining-budget-and-checkpoints
  markdown: Save checkpoints and evaluate independent held-out loss plus selected capability and reliability tasks.
    For example, falling average loss alongside worsening minority-language performance is a reason to inspect data
    balance. Avoid repeatedly tuning against an untouched final test and then presenting it as independent.
  text_mode: Save checkpoints and evaluate independent held-out loss plus selected capability and reliability tasks.
    For example, falling average loss alongside worsening minority-language performance is a reason to inspect data
    balance. Avoid repeatedly tuning against an untouched final test and then presenting it as independent.
  bridges: []
- id: pretraining-budget-and-checkpoints.s4
  title: Make a checkpoint recoverable
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.pretraining-budget-and-checkpoints
  markdown: Weights alone support some inference uses, but faithful training continuation may also need optimizer
    state, scheduler position, random states, and data-loader progress. Record versions and integrity checks. A
    checkpoint policy balances recovery time, storage cost, and the ability to study learning over time.
  text_mode: Weights alone support some inference uses, but faithful training continuation may also need optimizer
    state, scheduler position, random states, and data-loader progress. Record versions and integrity checks. A
    checkpoint policy balances recovery time, storage cost, and the ability to study learning over time.
  bridges: []
