schema_version: 0.2-draft
lesson:
  id: pretraining-budget-and-checkpoints
  version: 0.1.0-draft
  title: Allocate compute and preserve useful checkpoints
  state: draft
  summary: Pretraining budgets trade model size, token exposure, and runtime; scaling trends guide experiments while
    checkpoint evaluation detects capability changes and failures.
  slot: M16.7
  category: learning
  minutes: 12
  sources:
  - title: Training Compute-Optimal Large Language Models
    url: https://arxiv.org/abs/2203.15556
  - title: The Llama 3 Herd of Models
    url: https://arxiv.org/abs/2407.21783
objectives:
- id: objective.pretraining-budget-and-checkpoints
  version: 1-draft
  statement: Pretraining budgets trade model size, token exposure, and runtime; scaling trends guide experiments
    while checkpoint evaluation detects capability changes and failures.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - pretraining-budget-and-checkpoints.base
  - pretraining-budget-and-checkpoints.transfer
  prerequisites:
