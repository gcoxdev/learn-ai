assessment_families:
- id: pretraining-budget-and-checkpoints.base
  objective_ref: objective.pretraining-budget-and-checkpoints
  task: base
  response_type: single_choice
  points: 1
  hint: 'Use scaling as an empirical fit: trace the inputs, operation, and result before choosing.'
  remediation_scene: pretraining-budget-and-checkpoints.s2
  variants:
  - id: pretraining-budget-and-checkpoints.base.1
    prompt: Do equal theoretical FLOPs guarantee equal training time?
    options:
    - id: a
      text: No; utilization, communication, and hardware differ
    - id: b
      text: 'Yes'
    - id: c
      text: Only for models with equal names
    answer: a
    feedback: Compute counts omit execution bottlenecks.
  - id: pretraining-budget-and-checkpoints.base.2
    prompt: Why can the largest possible model be a poor fixed-budget choice?
    options:
    - id: b
      text: Large models cannot learn
    - id: c
      text: Token counts never matter
    - id: a
      text: It can leave too little budget for data exposure
    answer: a
    feedback: Size and training exposure share a finite compute budget.
- id: pretraining-budget-and-checkpoints.transfer
  objective_ref: objective.pretraining-budget-and-checkpoints
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Make a checkpoint recoverable: trace the inputs, operation, and result before choosing.'
  remediation_scene: pretraining-budget-and-checkpoints.s4
  variants:
  - id: pretraining-budget-and-checkpoints.transfer.1
    prompt: Average loss improves but one language regresses. What next?
    options:
    - id: b
      text: Discard subgroup measurements automatically
    - id: c
      text: Declare all capabilities improved
    - id: a
      text: Inspect disaggregated results and the mixture
    answer: a
    feedback: An average can hide capability regressions.
  - id: pretraining-budget-and-checkpoints.transfer.2
    prompt: What may be needed beyond weights to resume the same training trajectory?
    options:
    - id: c
      text: Only generated examples
    - id: a
      text: Optimizer, scheduler, random, and data-position state
    - id: b
      text: Only a new model title
    answer: a
    feedback: Training continuation depends on state beyond learned parameters.
