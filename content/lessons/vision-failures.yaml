schema_version: 0.2-draft
lesson:
  id: vision-failures
  version: 0.3.0-draft
  title: Test what the visual model is actually using
  state: draft
  summary: Challenge a picture model with missing evidence and controlled changes, then inspect which clues
    it relied on.
  slot: M12.8
  category: learning
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.vision-failures
  version: 1-draft
  statement: Occlusion, background shortcuts, adversarial perturbations, and distribution shift challenge different
    visual assumptions; evaluation should identify conditions and consequences, not just an average score.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - vision-failures.base
  - vision-failures.transfer
  prerequisites:
  - anyOf:
    - objective.robustness-and-shift
  - anyOf:
    - objective.detection-and-segmentation
scenes:
- id: vision-failures.s1
  title: What can you tell from a partly hidden object?
  type: explanation
  depth: intuition
  objective_refs:
  - objective.vision-failures
  markdown: 'Imagine a mug behind a book, with only its handle visible. The book causes **occlusion**: it blocks
    part of the view. Predicting a mug may be a useful inference from the handle and context, but reporting
    its exact hidden shape requires more evidence.


    A model may also report an object that the image does not support; this is a visual **hallucination**.
    Test partial visibility explicitly, and distinguish a useful guess from a supported measurement. Locating
    an object and labeling all its pixels can fail in different ways.'
  text_mode: 'Imagine a mug behind a book, with only its handle visible. The book causes **occlusion**: it
    blocks part of the view. Predicting a mug may be a useful inference from the handle and context, but reporting
    its exact hidden shape requires more evidence.


    A model may also report an object that the image does not support; this is a visual **hallucination**.
    Test partial visibility explicitly, and distinguish a useful guess from a supported measurement. Locating
    an object and labeling all its pixels can fail in different ways.'
  bridges: []
- id: vision-failures.s2
  title: Break a background correlation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vision-failures
  markdown: If training images associate snow with one animal class, test that class on grass and other classes
    on snow. This intervention on context probes reliance on the background. It does not by itself establish
    a complete causal model of recognition, but can reveal a specific shortcut.
  text_mode: If training images associate snow with one animal class, test that class on grass and other classes
    on snow. This intervention on context probes reliance on the background. It does not by itself establish
    a complete causal model of recognition, but can reveal a specific shortcut.
  bridges: []
- id: vision-failures.s3
  title: Specify a perturbation test
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vision-failures
  markdown: 'Adversarial evaluation searches for input changes that cause errors under a defined constraint
    and access model. A small pixel-norm change is a mathematical condition, not necessarily a realistic physical
    change. Conversely, lighting or viewpoint changes can be physically ordinary yet numerically large.


    An **adversarial** test deliberately searches for a change that triggers a wrong answer. The **access model**
    states what the tester can inspect, such as only returned labels or also model gradients. A pixel-distance
    budget limits numerical changes under a chosen norm. Rotating a camera can exceed that budget while remaining
    an entirely ordinary real-world event.'
  text_mode: 'Adversarial evaluation searches for input changes that cause errors under a defined constraint
    and access model. A small pixel-norm change is a mathematical condition, not necessarily a realistic physical
    change. Conversely, lighting or viewpoint changes can be physically ordinary yet numerically large.


    An **adversarial** test deliberately searches for a change that triggers a wrong answer. The **access model**
    states what the tester can inspect, such as only returned labels or also model gradients. A pixel-distance
    budget limits numerical changes under a chosen norm. Rotating a camera can exceed that budget while remaining
    an entirely ordinary real-world event.'
  bridges: []
- id: vision-failures.s4
  title: Plan for unfamiliar conditions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vision-failures
  markdown: 'Inspect performance by camera, location, weather, object size, and subgroup where relevant. Calibration
    and abstention can fail under shift too. Robust training should be tested on fresh stress cases, and the
    response to uncertain or unsupported observations should match the application’s consequences.


    Try a small test card: same object, different lighting; same lighting, different background; partly hidden
    object; no object at all. Record both the prediction and the appropriate fallback. A model that says “uncertain”
    on every image avoids some confident errors but also fails to serve many users, so measure coverage alongside
    mistakes.'
  text_mode: 'Inspect performance by camera, location, weather, object size, and subgroup where relevant. Calibration
    and abstention can fail under shift too. Robust training should be tested on fresh stress cases, and the
    response to uncertain or unsupported observations should match the application’s consequences.


    Try a small test card: same object, different lighting; same lighting, different background; partly hidden
    object; no object at all. Record both the prediction and the appropriate fallback. A model that says “uncertain”
    on every image avoids some confident errors but also fails to serve many users, so measure coverage alongside
    mistakes.'
  bridges: []
- id: vision-failures.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.vision-failures
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Change the lighting, background, visibility, or other stated condition and inspect the errors.
    A useful visual model also needs a sensible response when the picture lacks enough evidence.
- id: vision-failures.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.vision-failures
  markdown: Change the lighting, background, visibility, or other stated condition and inspect the errors.
    A useful visual model also needs a sensible response when the picture lacks enough evidence.
  text_mode: Change the lighting, background, visibility, or other stated condition and inspect the errors.
    A useful visual model also needs a sensible response when the picture lacks enough evidence.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - vision-failures.s1
    - vision-failures.s2
