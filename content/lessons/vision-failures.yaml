schema_version: 0.2-draft
lesson:
  id: vision-failures
  version: 0.1.0-draft
  title: Test what the visual model is actually using
  state: draft
  summary: Occlusion, background shortcuts, adversarial perturbations, and distribution shift challenge different
    visual assumptions; evaluation should identify conditions and consequences, not just an average score.
  slot: M12.8
  category: learning
  minutes: 12
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.vision-failures
  version: 1-draft
  statement: Occlusion, background shortcuts, adversarial perturbations, and distribution shift challenge different
    visual assumptions; evaluation should identify conditions and consequences, not just an average score.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - vision-failures.base
  - vision-failures.transfer
  prerequisites:
  - anyOf:
    - objective.robustness-and-shift
  - anyOf:
    - objective.detection-and-segmentation
scenes:
- id: vision-failures.s1
  title: An object can be only partly visible
  type: explanation
  depth: intuition
  objective_refs:
  - objective.vision-failures
  markdown: Occlusion hides some evidence while leaving other cues. A model may infer a familiar object from context,
    but can also hallucinate one. Evaluate partial visibility explicitly and distinguish a confident guess from
    a directly supported measurement. Detection and segmentation have different failure patterns.
  text_mode: Occlusion hides some evidence while leaving other cues. A model may infer a familiar object from context,
    but can also hallucinate one. Evaluate partial visibility explicitly and distinguish a confident guess from
    a directly supported measurement. Detection and segmentation have different failure patterns.
  bridges: []
- id: vision-failures.s2
  title: Break a background correlation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vision-failures
  markdown: If training images associate snow with one animal class, test that class on grass and other classes
    on snow. This intervention on context probes reliance on the background. It does not by itself establish a complete
    causal model of recognition, but can reveal a specific shortcut.
  text_mode: If training images associate snow with one animal class, test that class on grass and other classes
    on snow. This intervention on context probes reliance on the background. It does not by itself establish a complete
    causal model of recognition, but can reveal a specific shortcut.
  bridges: []
- id: vision-failures.s3
  title: Specify a perturbation test
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vision-failures
  markdown: Adversarial evaluation searches for input changes that cause errors under a defined constraint and access
    model. A small pixel-norm change is a mathematical condition, not necessarily a realistic physical change. Conversely,
    lighting or viewpoint changes can be physically ordinary yet numerically large.
  text_mode: Adversarial evaluation searches for input changes that cause errors under a defined constraint and
    access model. A small pixel-norm change is a mathematical condition, not necessarily a realistic physical change.
    Conversely, lighting or viewpoint changes can be physically ordinary yet numerically large.
  bridges: []
- id: vision-failures.s4
  title: Plan for unfamiliar conditions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vision-failures
  markdown: Inspect performance by camera, location, weather, object size, and subgroup where relevant. Calibration
    and abstention can fail under shift too. Robust training should be tested on fresh stress cases, and the response
    to uncertain or unsupported observations should match the application’s consequences.
  text_mode: Inspect performance by camera, location, weather, object size, and subgroup where relevant. Calibration
    and abstention can fail under shift too. Robust training should be tested on fresh stress cases, and the response
    to uncertain or unsupported observations should match the application’s consequences.
  bridges: []
- id: vision-failures.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.vision-failures
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Occlusion, background shortcuts, adversarial perturbations, and distribution shift challenge different
    visual assumptions; evaluation should identify conditions and consequences, not just an average score.
- id: vision-failures.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.vision-failures
  markdown: Occlusion, background shortcuts, adversarial perturbations, and distribution shift challenge different
    visual assumptions; evaluation should identify conditions and consequences, not just an average score.
  text_mode: Occlusion, background shortcuts, adversarial perturbations, and distribution shift challenge different
    visual assumptions; evaluation should identify conditions and consequences, not just an average score.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - vision-failures.s1
    - vision-failures.s2
    - vision-failures.s3
    - vision-failures.s4
    - vision-failures.check
    gate_refs:
    - gate.core
  scene_aliases:
    vision-failures.recap: vision-failures.check
assessment_families:
- id: vision-failures.base
  objective_ref: objective.vision-failures
  task: base
  response_type: single_choice
  points: 1
  hint: 'Break a background correlation: trace the inputs, operation, and result before choosing.'
  remediation_scene: vision-failures.s2
  variants:
  - id: vision-failures.base.1
    prompt: What does occlusion remove?
    options:
    - id: a
      text: Some visual evidence about a scene or object
    - id: b
      text: All possible context in every case
    - id: c
      text: Only the label file
    answer: a
    feedback: Hidden regions create incomplete observations and ambiguity.
  - id: vision-failures.base.2
    prompt: Why test an animal on backgrounds unlike its training backgrounds?
    options:
    - id: b
      text: To prove every causal property of the model
    - id: c
      text: To eliminate the need for labels
    - id: a
      text: To probe a learned contextual shortcut
    answer: a
    feedback: Changing the correlation can expose reliance on the background.
- id: vision-failures.transfer
  objective_ref: objective.vision-failures
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Plan for unfamiliar conditions: trace the inputs, operation, and result before choosing.'
  remediation_scene: vision-failures.s4
  variants:
  - id: vision-failures.transfer.1
    prompt: Is a tiny pixel-norm perturbation automatically a realistic physical scenario?
    options:
    - id: b
      text: Yes; every norm ball is a camera process
    - id: c
      text: Only in grayscale
    - id: a
      text: No; mathematical and physical threat models differ
    answer: a
    feedback: The perturbation constraint must match the claim being tested.
  - id: vision-failures.transfer.2
    prompt: A model is calibrated on clear images. Is calibration guaranteed under heavy fog?
    options:
    - id: c
      text: Only if the architecture is convolutional
    - id: a
      text: No; shift needs separate evaluation
    - id: b
      text: Yes; calibration is permanent
    answer: a
    feedback: Probability quality depends on the evaluation distribution.
