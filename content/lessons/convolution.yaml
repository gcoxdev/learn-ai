assessment_families:
- id: convolution.base
  objective_ref: objective.convolution
  task: base
  response_type: single_choice
  points: 1
  hint: 'Calculate a one-dimensional filter: trace the inputs, operation, and result before choosing.'
  remediation_scene: convolution.s2
  variants:
  - id: convolution.base.1
    prompt: Filter [1, 1] on [2, 3, 5], stride 1 and no padding, gives what?
    options:
    - id: c
      text: '[10]'
    - id: a
      text: '[5, 8]'
    - id: b
      text: '[2, 3, 5]'
    answer: a
    feedback: The filter sums each adjacent pair.
  - id: convolution.base.2
    prompt: What does stride control?
    options:
    - id: a
      text: The spacing between filter application positions
    - id: b
      text: Only the learning rate
    - id: c
      text: The number of training epochs
    answer: a
    feedback: Stride changes output sampling and often its spatial size.
- id: convolution.transfer
  objective_ref: objective.convolution
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'State the useful limits: trace the inputs, operation, and result before choosing.'
  remediation_scene: convolution.s4
  variants:
  - id: convolution.transfer.1
    prompt: A model downsamples aggressively and misses tiny objects. What tradeoff matters?
    options:
    - id: a
      text: Reduced spatial detail versus compute and coverage
    - id: b
      text: Only the model’s name
    - id: c
      text: A guarantee that pooling preserves every feature
    answer: a
    feedback: Downsampling can discard information needed for small targets.
  - id: convolution.transfer.2
    prompt: Does ordinary convolution automatically guarantee rotation invariance?
    options:
    - id: b
      text: Yes, every shared filter is rotation-invariant
    - id: c
      text: Only when channels are three
    - id: a
      text: 'No'
    answer: a
    feedback: The built-in spatial assumption is not a universal transformation guarantee.
