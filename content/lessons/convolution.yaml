scenes:
- id: convolution.s1
  title: Reuse the same local operation
  type: explanation
  depth: intuition
  objective_refs:
  - objective.convolution
  markdown: A convolutional layer applies a small learned filter across input positions. Many deep-learning libraries
    implement cross-correlation without reversing the filter, while using the name convolution. Weight sharing reduces
    independent parameters and encodes a locality assumption. Boundary handling still affects the result.
  text_mode: A convolutional layer applies a small learned filter across input positions. Many deep-learning libraries
    implement cross-correlation without reversing the filter, while using the name convolution. Weight sharing reduces
    independent parameters and encodes a locality assumption. Boundary handling still affects the result.
  bridges: []
- id: convolution.s2
  title: Calculate a one-dimensional filter
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.convolution
  markdown: Apply filter [1, −1] to input [2, 5, 4] with stride 1 and no padding. The two outputs are 2 − 5 = −3
    and 5 − 4 = 1. This detects local differences. A two-dimensional image filter similarly combines a patch, summing
    over spatial positions and input channels.
  text_mode: Apply filter [1, −1] to input [2, 5, 4] with stride 1 and no padding. The two outputs are 2 − 5 = −3
    and 5 − 4 = 1. This detects local differences. A two-dimensional image filter similarly combines a patch, summing
    over spatial positions and input channels.
  bridges:
  - matrices-tensors
- id: convolution.s3
  title: Trace size and coverage
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.convolution
  markdown: 'Stride controls how far the filter moves; padding adds boundary values under a convention. Pooling
    summarizes a neighborhood using operations such as maximum or average. Stacked layers expand the receptive field:
    the region of original input that can influence an output. Actual influence still depends on learned weights
    and nonlinearities.'
  text_mode: 'Stride controls how far the filter moves; padding adds boundary values under a convention. Pooling
    summarizes a neighborhood using operations such as maximum or average. Stacked layers expand the receptive field:
    the region of original input that can influence an output. Actual influence still depends on learned weights
    and nonlinearities.'
  bridges: []
- id: convolution.s4
  title: State the useful limits
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.convolution
  markdown: Convolution can support translation-related behavior, but finite boundaries, stride, pooling, and later
    layers affect exact equivariance. Shared filters do not automatically provide rotation invariance or global
    reasoning. Check the required output geometry and preserve small details when choosing downsampling.
  text_mode: Convolution can support translation-related behavior, but finite boundaries, stride, pooling, and later
    layers affect exact equivariance. Shared filters do not automatically provide rotation invariance or global
    reasoning. Check the required output geometry and preserve small details when choosing downsampling.
  bridges: []
