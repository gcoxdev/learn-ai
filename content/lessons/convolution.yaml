  id: convolution
  version: 0.1.0-draft
  title: Slide a shared filter across an input
  state: draft
  summary: Convolutional layers combine local values with shared weights; channels, stride, padding, pooling, and
    receptive fields determine what information each output can use.
  slot: M12.2
  category: learning
  sources:
