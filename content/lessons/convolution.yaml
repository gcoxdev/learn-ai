assessment_families:
  - id: convolution.base
    objective_ref: objective.convolution
    task: base
    response_type: single_choice
    points: 1
    hint: 'Calculate a one-dimensional filter: trace the inputs, operation, and result before choosing.'
    remediation_scene: convolution.s2
    variants:
      - id: convolution.base.1
        prompt: Filter [1, 1] on [2, 3, 5], stride 1 and no padding, gives what?
        options:
          - id: c
            text: '[10]'
          - id: a
            text: '[5, 8]'
          - id: b
            text: '[2, 3, 5]'
        answer: a
        feedback: The filter sums each adjacent pair.
        retired: true
      - id: convolution.base.2
        prompt: What does stride control?
        options:
          - id: a
            text: The spacing between filter application positions
          - id: b
            text: Only the learning rate
          - id: c
            text: The number of training epochs
        answer: a
        feedback: Stride changes output sampling and often its spatial size.
        retired: true
  - id: convolution.transfer
    objective_ref: objective.convolution
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'State the useful limits: trace the inputs, operation, and result before choosing.'
    remediation_scene: convolution.s4
    variants:
      - id: convolution.transfer.1
        prompt: A model downsamples aggressively and misses tiny objects. What tradeoff matters?
        options:
          - id: a
            text: Reduced spatial detail versus compute and coverage
          - id: b
            text: Only the model’s name
          - id: c
            text: A guarantee that pooling preserves every feature
        answer: a
        feedback: Downsampling can discard information needed for small targets.
        retired: true
      - id: convolution.transfer.2
        prompt: Does ordinary convolution automatically guarantee rotation invariance?
        options:
          - id: b
            text: Yes, every shared filter is rotation-invariant
          - id: c
            text: Only when channels are three
          - id: a
            text: 'No'
        answer: a
        feedback: The built-in spatial assumption is not a universal transformation guarantee.
        retired: true
  - id: convolution.base.v2
    objective_ref: objective.convolution
    task: base
    response_type: single_choice
    points: 1
    hint: Place the filter over one window, multiply matching numbers, add them up, then slide by the stride and reuse the same weights.
    remediation_scene: convolution.s2
    variants:
      - id: convolution.base.v2.1
        prompt: The filter [1, −1] slides along [1, 4, 2, 7] with stride 1 and no padding. What is the output?
        options:
          - id: c
            text: "[3, −2, 5], from each right value minus its left neighbor"
          - id: a
            text: "[−3, 2, −5], from each left value minus its right neighbor"
          - id: b
            text: "[−3, −5], from the pairs (1, 4) and (2, 7)"
        answer: a
        feedback: Each window multiplies its first value by 1 and its second by −1, giving 1 − 4, 4 − 2, and 2 − 7. Reversing the subtraction is the flipped-filter mistake, and skipping the pair (4, 2) moves the filter by 2 instead of 1.
      - id: convolution.base.v2.2
        prompt: Why does a convolutional layer need far fewer weights than a layer with a separate detector for every image position?
        options:
          - id: b
            text: It only looks at the brightest pixels in each image
          - id: a
            text: It reuses one small set of weights at every position
          - id: c
            text: It shrinks every image to a few pixels before looking
        answer: a
        feedback: Weight sharing means one 3 × 3 filter's 9 weights (27 for RGB) serve every position. Looking only at bright pixels isn't how filters work, and shrinking is what pooling or stride does, not the source of the savings.
      - id: convolution.base.v2.3
        prompt: A 2 × 2 max-pooling window with stride 2 covers the values 3, 8, 5, and 0. What does it output, and what does it forget?
        options:
          - id: c
            text: 4, the average, and it forgets which values were large
          - id: b
            text: 16, the sum, and it forgets how many values there were
          - id: a
            text: 8, the largest, and it forgets where in the window it was
        answer: a
        feedback: Max pooling keeps the largest value and throws away its exact position inside the window. The average (4) is what average pooling would return; pooling doesn't sum.
      - id: convolution.base.v2.4
        prompt: Three 3 × 3 convolutions with stride 1 are stacked. How wide is the patch of the original image that one final output can see?
        options:
          - id: a
            text: 7 pixels, since each layer adds 2 to the field
          - id: b
            text: 9 pixels, since three layers times 3 pixels each is 9
          - id: c
            text: 27 pixels, since the field multiplies by 3 per layer
        answer: a
        feedback: Each extra 3 × 3 layer with stride 1 adds K − 1 = 2 pixels, so the field grows 3 → 5 → 7. The windows overlap, which is why simply adding or multiplying the filter sizes overcounts.
  - id: convolution.transfer.v2
    objective_ref: objective.convolution
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what the task needs (fine detail, a wide view, or tolerance to movement) and which setting (stride, padding, pooling, depth) buys it.
    remediation_scene: convolution.s4
    variants:
      - id: convolution.transfer.v2.1
        prompt: A drone camera model downsamples by 32 early on and keeps missing people who are only 10 pixels tall. Which change most directly helps?
        options:
          - id: b
            text: Add more filters to each layer while keeping the same early strides
          - id: a
            text: Downsample less before the layers that must find small people
          - id: c
            text: Switch every max-pooling layer to average pooling instead
        answer: a
        feedback: After a stride of 32, one map position stands for a 32 × 32 block, so a 10-pixel person can vanish into a single value. More filters still see the same coarse grid, and average pooling blurs small details just as much.
      - id: convolution.transfer.v2.2
        prompt: A microscope model is trained on cells in upright images, but slides are scanned at random angles. Accuracy drops on rotated scans. What explains this?
        options:
          - id: c
            text: Padding adds zeros that confuse the model on rotated slides
          - id: b
            text: Convolution ignores position, so rotation is all that is left to vary
          - id: a
            text: Shared filters follow shifts, but a rotated cell needs different filters
        answer: a
        feedback: Weight sharing makes convolution equivariant to shifts, not rotations; a filter tuned to one orientation won't fire the same way on a turned cell. The usual fix is rotating the training images. Convolution doesn't ignore position, it moves its output with it.
      - id: convolution.transfer.v2.3
        prompt: A document scanner's edge detector fires strongly along the outer border of every page, even on blank margins. Which setting most likely causes this?
        options:
          - id: a
            text: Zero padding makes the border look like a jump to black
          - id: b
            text: Stride 1 makes the filter visit the border too many times
          - id: c
            text: Max pooling copies the largest values out to the edges
        answer: a
        feedback: The zeros added outside a bright page form a sharp step, so an edge filter responds there. Stride controls spacing, not what the filter sees, and pooling doesn't move values to the border.
      - id: convolution.transfer.v2.4
        prompt: A satellite model must decide whether a whole 50-pixel-wide field is flooded, but its outputs only see 7-pixel patches. Which change fits best?
        options:
          - id: b
            text: Use a larger stride in the final layer so it sees fewer positions
          - id: c
            text: Add padding so each 3 × 3 filter covers the image border
          - id: a
            text: Stack more layers with pooling so the receptive field grows
        answer: a
        feedback: A 7-pixel receptive field can't judge a 50-pixel field. More layers, especially after downsampling, widen what each output sees. A stride in the last layer only thins its outputs, and padding just lets filters reach the border.
  - id: convolution.calculate
    objective_ref: objective.convolution
    task: base
    response_type: numeric
    points: 1
    hint: Use output = ⌊(W − K + 2P) / S⌋ + 1. Add both paddings, subtract the filter width, divide by the stride and round down, then add 1.
    remediation_scene: convolution.s3
    absolute_tolerance: 0.01
    variants:
      - id: convolution.calculate.1
        prompt: A 32 × 32 image goes through a 5 × 5 filter with stride 1 and no padding. How wide is the output?
        answer: 28
        feedback: (32 − 5 + 0) / 1 + 1 = 28. Without padding, the filter can't center on the two outermost pixels on each side.
      - id: convolution.calculate.2
        prompt: A 64 × 64 feature map goes through a 3 × 3 filter with padding 1 and stride 2. How wide is the output?
        answer: 32
        feedback: ⌊(64 − 3 + 2) / 2⌋ + 1 = ⌊31.5⌋ + 1 = 32. Stride 2 halves the width.
      - id: convolution.calculate.3
        prompt: A 227 × 227 image goes through an 11 × 11 filter with stride 4 and no padding. How wide is the output?
        answer: 55
        feedback: (227 − 11 + 0) / 4 + 1 = 216 / 4 + 1 = 55.
      - id: convolution.calculate.4
        prompt: A 28 × 28 image goes through a 5 × 5 filter with padding 2 and stride 1. How wide is the output?
        answer: 28
        feedback: (28 − 5 + 4) / 1 + 1 = 28. Padding of (K − 1)/2 = 2 keeps the size the same.
      - id: convolution.calculate.5
        prompt: A 100-pixel-wide map goes through a 3-wide filter with stride 1 and no padding. How wide is the output?
        answer: 98
        feedback: (100 − 3 + 0) / 1 + 1 = 98. Each unpadded 3-wide filter trims one position from each side.
