schema_version: 0.2-draft
lesson:
  id: convolution
  version: 0.4.0-draft
  title: Slide a shared filter across an input
  state: draft
  summary: How does a phone find a letter anywhere in a photo without learning each spot separately? Slide one tiny grid of nine weights across it, and count exactly what comes out.
  slot: M12.2
  category: learning
  sources:
    - title: Dive into Deep Learning — convolutions for images
      url: https://d2l.ai/chapter_convolutional-neural-networks/conv-layer.html
    - title: Dive into Deep Learning — padding and stride
      url: https://d2l.ai/chapter_convolutional-neural-networks/padding-and-strides.html
    - title: Dive into Deep Learning — pooling
      url: https://d2l.ai/chapter_convolutional-neural-networks/pooling.html
    - title: "A guide to convolution arithmetic for deep learning (Dumoulin & Visin, 2016)"
      url: https://arxiv.org/abs/1603.07285
objectives:
  - id: objective.convolution
    version: 2-draft
    statement: Convolutional layers combine local values with shared weights; channels, stride, padding, pooling, and receptive fields determine what information each output can use.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - convolution.base.v2
      - convolution.transfer.v2
      - convolution.calculate
    prerequisites:
      - anyOf:
          - objective.image-geometry
      - anyOf:
          - objective.neural-forward-pass
scenes:
  - id: convolution.s1
    title: One small filter, reused everywhere
    type: explanation
    depth: intuition
    objective_refs:
      - objective.convolution
    markdown: |-
      The photo app's sign reader has to spot a letter's edge wherever it appears. An edge looks the same in every corner of a photo, so why learn a separate detector for each spot? Use one, and slide it around.

      That detector is a **filter** (or **kernel**): a small grid of weights. Place it over part of the input, multiply each value by the weight on top of it, and add the products. Then slide it along and repeat with the *same* weights.

      Take the filter [1, −1] and the row [2, 5, 4]:

      - First position covers 2 and 5: $1 \times 2 + (-1) \times 5 = -3$.
      - Second position covers 5 and 4: $1 \times 5 + (-1) \times 4 = 1$.

      The output [−3, 1] measures change between neighbors, like the edge differences in the previous lesson. Reusing one set of weights everywhere is **weight sharing**, the core of a **convolutional layer**.

      Strictly, this is **cross-correlation**; textbook convolution flips the filter first. Deep-learning libraries skip the flip but keep the name, which is harmless because the weights are learned anyway.
    bridges: []
  - id: convolution.s2
    title: A 3 × 3 filter finds a letter's edge
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.convolution
    markdown: |-
      Here is a gray patch of a street sign, 4 rows by 5 columns: bright sign (9) on the left, a dark letter stroke (1) on the right, leaning one step left in the bottom row. The filter responds to "bright left, dark right":

      $$\text{patch} = \begin{bmatrix} 9&9&9&1&1\\ 9&9&9&1&1\\ 9&9&9&1&1\\ 9&9&1&1&1 \end{bmatrix} \qquad \text{filter} = \begin{bmatrix} 1&0&-1\\ 1&0&-1\\ 1&0&-1 \end{bmatrix}$$

      Over the top-left 3 × 3 window, the left column adds $9 + 9 + 9 = 27$, the middle column counts 0, and the right column subtracts 27. The output is 0: flat sign, no edge.

      :::predict Slide the window down one row (rows 2–4, columns 1–3). What does the filter output?
      The left column still adds 27; the right column now holds 9, 9, and 1, so it subtracts 19. The output is 8, a weak response, because the stroke only reaches the window's corner.
      :::

      All six positions give the output grid, called a **feature map**:

      $$\begin{bmatrix} 0&24&24\\ 8&24&16 \end{bmatrix}$$

      The large values mark windows that straddle the bright-to-dark boundary.

      On a color photo, a 3 × 3 filter has $3 \times 3 \times 3 = 27$ weights and sums over all three channels. A layer learns many filters, each producing its own output channel.
    bridges:
      - matrices-tensors
  - id: convolution.s3
    title: Stride and padding decide the output size
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.convolution
    markdown: |-
      **Stride** is how many places the filter moves each step. **Padding** adds values (usually zeros) around the border so the filter can sit over the edges.

      Back to [2, 5, 4] and a two-weight filter. Stride 1, no padding: 2 positions. One zero at each end, [0, 2, 5, 4, 0]: 4 positions. Stride 2, no padding: 1. Check each case in the figure, predicting every output before you reveal it.

      :::papers The output-size formula
      For an input of width $W$, a filter of width $K$, padding $P$ on each side, and stride $S$:

      $$\text{output width} = \left\lfloor \frac{W - K + 2P}{S} \right\rfloor + 1$$

      $\lfloor \cdot \rfloor$ means round down. For the row, $W = 3$ and $K = 2$: no padding gives $(3 - 2 + 0)/1 + 1 = 2$; padding 1 gives $(3 - 2 + 2)/1 + 1 = 4$; stride 2 gives $\lfloor (3 - 2 + 0)/2 \rfloor + 1 = 1$, or $\lfloor (3 - 2 + 2)/2 \rfloor + 1 = 2$ with padding 1. Height works the same way.
      :::

      On photos, a 3 × 3 filter with padding 1 and stride 1 keeps the size: $(224 - 3 + 2)/1 + 1 = 224$. ResNet's first layer, 7 × 7 with padding 3 and stride 2, halves it: $\lfloor (224 - 7 + 6)/2 \rfloor + 1 = 112$.

      :::predict A 3 × 3 filter with padding 1 and stride 2 runs on a 224 × 224 photo. How wide is the output?
      $\lfloor (224 - 3 + 2)/2 \rfloor + 1 = \lfloor 111.5 \rfloor + 1 = 112$. Stride 2 halves each side, leaving a quarter as many positions.
      :::

      Here is the same arithmetic in code, run on the street-sign patch from the previous page:

      ```python run
      import numpy as np

      def conv2d(img, k, stride=1, pad=0):
          """Cross-correlation, as deep-learning libraries compute it."""
          img = np.pad(img, pad)                      # zeros around the border
          K = k.shape[0]
          H = (img.shape[0] - K) // stride + 1
          W = (img.shape[1] - K) // stride + 1
          out = np.zeros((H, W), dtype=int)
          for i in range(H):
              for j in range(W):
                  window = img[i*stride:i*stride+K, j*stride:j*stride+K]
                  out[i, j] = np.sum(window * k)      # multiply, then add up
          return out

      sign = np.array([[9, 9, 9, 1, 1],               # bright sign, dark letter stroke
                       [9, 9, 9, 1, 1],
                       [9, 9, 9, 1, 1],
                       [9, 9, 1, 1, 1]])
      edge = np.array([[1, 0, -1],
                       [1, 0, -1],
                       [1, 0, -1]])

      print("output:\n", conv2d(sign, edge))
      print("padding 1, output shape:", conv2d(sign, edge, pad=1).shape)
      print("stride 2, padding 1:\n", conv2d(sign, edge, stride=2, pad=1))

      def out_size(W, K, P, S):
          return (W - K + 2 * P) // S + 1

      print("224 photo, 3x3, P=1, S=1 ->", out_size(224, 3, 1, 1))
      print("224 photo, 7x7, P=3, S=2 ->", out_size(224, 7, 3, 2))
      ```

      Padding 1 keeps the patch's 4 × 5 size, and stride 2 with padding 1 gives 2 × 3, as the formula predicts. In the stride-2 output, the −18 and −27 on the left come from the added zeros, which look like a dark edge that isn't there. Try `edge.T`, a horizontal-edge filter, in the first `print`: this patch has almost no horizontal edges, so the outputs drop to 0 and 8.
    bridges: []
    figure:
      kind: convolution
      caption: Select a filter position and predict its output before revealing the sum.
      description: A shared two-value filter slides across [2, 5, 4]. Controls change one weight, stride, and zero padding; the highlighted input pair, products, and sum explain each output.
  - id: convolution.s5
    title: Pooling and the growing field of view
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.convolution
    markdown: |-
      **Pooling** shrinks a feature map by summarizing each small window with one number: **max pooling** keeps the largest, **average pooling** the mean. Here is 2 × 2 pooling, stride 2, on a 4 × 4 map:

      | Window | Values | Max | Average |
      | --- | --- | ---: | ---: |
      | top-left | 1, 3, 4, 6 | 6 | 3.5 |
      | top-right | 0, 2, 1, 0 | 2 | 0.75 |
      | bottom-left | 0, 2, 1, 1 | 2 | 1 |
      | bottom-right | 5, 7, 3, 2 | 7 | 4.25 |

      Sixteen numbers became four. Max pooling says "an edge is somewhere in this window" and forgets exactly where, which tolerates small shifts.

      The **receptive field** of an output is the patch of the original image that can affect it. One 3 × 3 layer sees 3 × 3 pixels; a second one combines 3 × 3 of *those* outputs, covering 5 × 5 pixels. Downsampling makes the field grow faster:

      | Layer | Receptive field | Step between outputs (pixels) |
      | --- | ---: | ---: |
      | 3 × 3 conv, stride 1 | 3 | 1 |
      | 2 × 2 max pool, stride 2 | 4 | 2 |
      | 3 × 3 conv, stride 1 | 8 | 2 |
      | 2 × 2 max pool, stride 2 | 10 | 4 |
      | 3 × 3 conv, stride 1 | 18 | 4 |

      Each layer adds $(K - 1) \times \text{step}$, where the step is the product of all earlier strides: the last conv adds $2 \times 4 = 8$.

      :::predict Without the pooling layers, how wide is the receptive field after three stacked 3 × 3 convolutions with stride 1?
      Each adds $2 \times 1 = 2$: $3 \to 5 \to 7$. With pooling, the same three convolutions reach 18.
      :::
    bridges: []
  - id: convolution.s4
    title: A shared filter follows the object
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.convolution
    markdown: |-
      Slide [1, −1] along [0, 0, 9, 0, 0] and you get [0, −9, 9, 0]. Move the bright pixel one place right and the output becomes [0, 0, −9, 9]: the same response, one place later. Convolution is **equivariant to shifts**, so a letter's edge gives the same feature wherever it sits.

      :::mixup "Convolution makes a network ignore where things are, and turn, and grow."
      Convolution *moves* its output with the input; it keeps position. Pooling adds tolerance to small shifts, but nothing here handles rotation or size: a filter tuned to vertical strokes won't fire on a sign tilted 45°. That tolerance has to come from training on tilted and resized examples.
      :::

      Downsampling has a price. After two stride-2 steps, the map keeps one position per 4 × 4 block of pixels, so a 4-pixel letter shrinks to a single value. When small details matter, downsample later or use a higher-resolution crop.
    bridges: []
  - id: convolution.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.convolution
    markdown: Compute some filter outputs and output sizes by hand, then decide how a drone camera, a microscope, and a document scanner should set stride, padding, and pooling.
    takeaway: |-
      A convolutional layer slides one small set of weights across the whole image. Stride and padding set the output size, ⌊(W − K + 2P)/S⌋ + 1, and stacking and pooling widen what each output can see while dropping fine detail.
  - id: convolution.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.convolution
    markdown: |-
      A convolutional layer reuses a local filter across the input. Stride and padding choose where it operates; stacking and pooling change the detail and region available to later outputs.
navigation:
