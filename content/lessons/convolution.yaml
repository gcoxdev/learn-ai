schema_version: 0.2-draft
lesson:
  id: convolution
  version: 0.3.0-draft
  title: Slide a shared filter across an input
  state: draft
  summary: Slide the same small weight pattern across three numbers, then change stride and padding to see
    what each output can use.
  slot: M12.2
  category: learning
  sources:
  - title: Dive into Deep Learning — convolutions for images
    url: https://d2l.ai/chapter_convolutional-neural-networks/conv-layer.html
  - title: Dive into Deep Learning — padding and stride
    url: https://d2l.ai/chapter_convolutional-neural-networks/padding-and-strides.html
objectives:
- id: objective.convolution
  version: 1-draft
  statement: Convolutional layers combine local values with shared weights; channels, stride, padding, pooling,
    and receptive fields determine what information each output can use.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - convolution.base
  - convolution.transfer
  prerequisites:
  - anyOf:
    - objective.image-geometry
  - anyOf:
    - objective.neural-forward-pass
scenes:
- id: convolution.s1
  title: Use the same filter at each position
  type: explanation
  depth: intuition
  objective_refs:
  - objective.convolution
  markdown: 'A **filter**, also called a kernel here, is a small table of weights. Place it over part of the
    input, multiply matching values and weights, and add the products. Then move it and reuse the same weights.
    Different input values can give different outputs.


    This **weight sharing** lets a convolutional layer look for local patterns using fewer independent parameters.
    Many deep-learning libraries use the name convolution for an unflipped operation technically called **cross-correlation**.
    Our worked example uses that convention. How the filter handles the boundaries also affects the result.'
  text_mode: 'A **filter**, also called a kernel here, is a small table of weights. Place it over part of the
    input, multiply matching values and weights, and add the products. Then move it and reuse the same weights.
    Different input values can give different outputs.


    This **weight sharing** lets a convolutional layer look for local patterns using fewer independent parameters.
    Many deep-learning libraries use the name convolution for an unflipped operation technically called **cross-correlation**.
    Our worked example uses that convention. How the filter handles the boundaries also affects the result.'
  bridges: []
- id: convolution.s2
  title: Calculate a one-dimensional filter
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.convolution
  markdown: Apply filter [1, −1] to input [2, 5, 4] with stride 1 (move one place at a time) and no padding
    (add no boundary values). The two outputs are 2 − 5 = −3 and 5 − 4 = 1. This detects local differences.
    A two-dimensional image filter similarly combines a patch, summing over spatial positions and input channels.
  text_mode: Apply filter [1, −1] to input [2, 5, 4] with stride 1 (move one place at a time) and no padding
    (add no boundary values). The two outputs are 2 − 5 = −3 and 5 − 4 = 1. This detects local differences.
    A two-dimensional image filter similarly combines a patch, summing over spatial positions and input channels.
  bridges:
  - matrices-tensors
- id: convolution.s3
  title: Choose the positions the filter visits
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.convolution
  markdown: '**Stride** is how far the filter moves each time. **Padding** adds values at the boundaries. With
    three input values, a two-value filter, stride 1, and no padding, there are two valid starting positions.
    Adding one zero at each end creates five padded input positions and four valid starts.


    **Pooling** summarizes a neighborhood. A max-pooling window over [2, 5] returns 5; average pooling returns
    3.5. These operations reduce detail. When layers are stacked, their **receptive field** grows: a later
    output can depend on a wider region of the original input. That describes possible influence, not equal
    influence from every value.'
  text_mode: '**Stride** is how far the filter moves each time. **Padding** adds values at the boundaries.
    With three input values, a two-value filter, stride 1, and no padding, there are two valid starting positions.
    Adding one zero at each end creates five padded input positions and four valid starts.


    **Pooling** summarizes a neighborhood. A max-pooling window over [2, 5] returns 5; average pooling returns
    3.5. These operations reduce detail. When layers are stacked, their **receptive field** grows: a later
    output can depend on a wider region of the original input. That describes possible influence, not equal
    influence from every value.'
  bridges: []
  figure:
    kind: convolution
    caption: Select a filter position and predict its output before revealing the sum.
    description: A shared two-value filter slides across [2, 5, 4]. Controls change one weight, stride, and
      zero padding; the highlighted input pair, products, and sum explain each output.
- id: convolution.s4
  title: Check what the shared filter preserves
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.convolution
  markdown: 'Convolution supports useful responses to translations, but boundaries, stride, pooling, and later
    layers affect exact equivariance. Shared filters do not automatically make a model invariant to rotation
    or give it information from the whole image.


    **Downsampling** reduces the number of positions. It saves work but can lose small visual features. Choose
    it with the required detail and output geometry in mind.'
  text_mode: 'Convolution supports useful responses to translations, but boundaries, stride, pooling, and later
    layers affect exact equivariance. Shared filters do not automatically make a model invariant to rotation
    or give it information from the whole image.


    **Downsampling** reduces the number of positions. It saves work but can lose small visual features. Choose
    it with the required detail and output geometry in mind.'
  bridges: []
- id: convolution.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.convolution
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A convolutional layer reuses a local filter across the input. Stride and padding choose where it
    operates; stacking and pooling change the detail and region available to later outputs.
- id: convolution.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.convolution
  markdown: A convolutional layer reuses a local filter across the input. Stride and padding choose where it
    operates; stacking and pooling change the detail and region available to later outputs.
  text_mode: A convolutional layer reuses a local filter across the input. Stride and padding choose where
    it operates; stacking and pooling change the detail and region available to later outputs.
