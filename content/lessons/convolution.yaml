- id: objective.convolution
  version: 1-draft
  statement: Convolutional layers combine local values with shared weights; channels, stride, padding, pooling,
    and receptive fields determine what information each output can use.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - convolution.base
