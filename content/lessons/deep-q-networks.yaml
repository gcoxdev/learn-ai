schema_version: 0.2-draft
lesson:
  id: deep-q-networks
  version: 0.1.0-draft
  title: Approximate action values with a neural network
  state: draft
  summary: DQN combines neural action-value prediction with replay and delayed target networks; these mechanisms
    reduce some instability while leaving exploration, distribution shift, and approximation errors to evaluate.
  slot: M24.5
  category: learning
  minutes: 12
  sources:
  - title: Playing Atari with Deep Reinforcement Learning
    url: https://arxiv.org/abs/1312.5602
  - title: Deep Reinforcement Learning with Double Q-learning
    url: https://arxiv.org/abs/1509.06461
objectives:
- id: objective.deep-q-networks
  version: 1-draft
  statement: DQN combines neural action-value prediction with replay and delayed target networks; these mechanisms
    reduce some instability while leaving exploration, distribution shift, and approximation errors to evaluate.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - deep-q-networks.base
  - deep-q-networks.transfer
  prerequisites:
  - anyOf:
    - objective.temporal-difference-and-q-learning
  - anyOf:
    - objective.neural-training-loop
scenes:
- id: deep-q-networks.s1
  title: Replace a table with a function
  type: explanation
  depth: intuition
  objective_refs:
  - objective.deep-q-networks
  markdown: A Q-network maps a state representation to action-value estimates for a defined action set. Shared parameters
    let updates generalize across states, but can also interfere with earlier predictions. The network’s input preprocessing
    determines which information it can use.
  text_mode: A Q-network maps a state representation to action-value estimates for a defined action set. Shared
    parameters let updates generalize across states, but can also interfere with earlier predictions. The network’s
    input preprocessing determines which information it can use.
  bridges: []
- id: deep-q-networks.s2
  title: Replay stored experience
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.deep-q-networks
  markdown: A replay buffer stores transitions and samples minibatches for updates. This reuses experience and reduces
    the strong temporal correlation of consecutive observations. The buffer distribution can become stale or imbalanced;
    prioritized replay changes sampling and needs its own correction and evaluation choices.
  text_mode: A replay buffer stores transitions and samples minibatches for updates. This reuses experience and
    reduces the strong temporal correlation of consecutive observations. The buffer distribution can become stale
    or imbalanced; prioritized replay changes sampling and needs its own correction and evaluation choices.
  bridges: []
- id: deep-q-networks.s3
  title: Slow the moving target
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.deep-q-networks
  markdown: A target network provides next-state values and is updated less frequently or more smoothly than the
    online network. This reduces rapid feedback between the prediction being fitted and its target. It is a stabilizing
    mechanism, not a proof that every neural Q-learning run will converge.
  text_mode: A target network provides next-state values and is updated less frequently or more smoothly than the
    online network. This reduces rapid feedback between the prediction being fitted and its target. It is a stabilizing
    mechanism, not a proof that every neural Q-learning run will converge.
  bridges: []
- id: deep-q-networks.s4
  title: Evaluate beyond one successful seed
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.deep-q-networks
  markdown: Track environment steps, update count, return distributions, exploration, and sensitivity to seeds.
    Overestimated action values or replay shortcuts can mislead. Test fresh environments and inspect terminal versus
    truncated transitions, because incorrect bootstrapping changes the learning target.
  text_mode: Track environment steps, update count, return distributions, exploration, and sensitivity to seeds.
    Overestimated action values or replay shortcuts can mislead. Test fresh environments and inspect terminal versus
    truncated transitions, because incorrect bootstrapping changes the learning target.
  bridges: []
- id: deep-q-networks.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.deep-q-networks
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: DQN combines neural action-value prediction with replay and delayed target networks; these mechanisms
    reduce some instability while leaving exploration, distribution shift, and approximation errors to evaluate.
