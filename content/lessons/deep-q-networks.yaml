assessment_families:
- id: deep-q-networks.base
  objective_ref: objective.deep-q-networks
  task: base
  response_type: single_choice
  points: 1
  hint: 'Replay stored experience: trace the inputs, operation, and result before choosing.'
  remediation_scene: deep-q-networks.s2
  variants:
  - id: deep-q-networks.base.1
    prompt: What does a Q-network predict?
    options:
    - id: c
      text: The exact optimal policy without training
    - id: a
      text: Action-value estimates
    - id: b
      text: Only the next raw image necessarily
    answer: a
    feedback: Its outputs estimate expected returns for actions.
  - id: deep-q-networks.base.2
    prompt: Why sample replay minibatches?
    options:
    - id: a
      text: To reuse transitions and reduce temporal correlation
    - id: b
      text: To make all observations independent by proof
    - id: c
      text: To remove every distribution issue
    answer: a
    feedback: Replay changes the update data distribution.
- id: deep-q-networks.transfer
  objective_ref: objective.deep-q-networks
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate beyond one successful seed: trace the inputs, operation, and result before choosing.'
  remediation_scene: deep-q-networks.s4
  variants:
  - id: deep-q-networks.transfer.1
    prompt: What is the target network’s role?
    options:
    - id: a
      text: Provide a more slowly changing bootstrap target
    - id: b
      text: Choose the dataset license
    - id: c
      text: Replace every reward
    answer: a
    feedback: A delayed target reduces one source of feedback instability.
  - id: deep-q-networks.transfer.2
    prompt: Does one high-return seed establish robust DQN performance?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only with replay enabled
    - id: a
      text: 'No'
    answer: a
    feedback: RL results can vary with initialization and experience.
