assessment_families:
  - id: deep-q-networks.base
    objective_ref: objective.deep-q-networks
    task: base
    response_type: single_choice
    points: 1
    hint: 'Replay stored experience: trace the inputs, operation, and result before choosing.'
    remediation_scene: deep-q-networks.s2
    variants:
      - id: deep-q-networks.base.1
        prompt: What does a Q-network predict?
        options:
          - id: c
            text: The exact optimal policy without training
          - id: a
            text: Action-value estimates
          - id: b
            text: Only the next raw image necessarily
        answer: a
        feedback: Its outputs estimate expected returns for actions.
        retired: true
      - id: deep-q-networks.base.2
        prompt: Why sample replay minibatches?
        options:
          - id: a
            text: To reuse transitions and reduce temporal correlation
          - id: b
            text: To make all observations independent by proof
          - id: c
            text: To remove every distribution issue
        answer: a
        feedback: Replay changes the update data distribution.
        retired: true
  - id: deep-q-networks.transfer
    objective_ref: objective.deep-q-networks
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate beyond one successful seed: trace the inputs, operation, and result before choosing.'
    remediation_scene: deep-q-networks.s4
    variants:
      - id: deep-q-networks.transfer.1
        prompt: What is the target network’s role?
        options:
          - id: a
            text: Provide a more slowly changing bootstrap target
          - id: b
            text: Choose the dataset license
          - id: c
            text: Replace every reward
        answer: a
        feedback: A delayed target reduces one source of feedback instability.
        retired: true
      - id: deep-q-networks.transfer.2
        prompt: Does one high-return seed establish robust DQN performance?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only with replay enabled
          - id: a
            text: 'No'
        answer: a
        feedback: RL results can vary with initialization and experience.
        retired: true
  - id: deep-q-networks.base.v2
    objective_ref: objective.deep-q-networks
    task: base
    response_type: single_choice
    points: 1
    hint: Match each trick to the problem it solves. Replay breaks up correlated data, the target network stops the target from moving every step, and Double DQN separates choosing from scoring.
    remediation_scene: deep-q-networks.s3
    variants:
      - id: deep-q-networks.base.v2.1
        prompt: A DQN is trained on each transition the moment it happens. After a long stretch in one room, its values for other rooms get worse. Which DQN component addresses this?
        options:
          - id: b
            text: The target network, which freezes the weights for other rooms
          - id: a
            text: The replay buffer, which mixes old and new transitions in each batch
          - id: c
            text: Double DQN, which uses a second network to choose actions
        answer: a
        feedback: Long streaks of similar, correlated updates drag the shared weights toward one room. Random minibatches from a replay buffer mix rooms and times. The target network freezes targets, not the weights being trained.
      - id: deep-q-networks.base.v2.2
        prompt: In DQN, which network's weights are updated by gradient descent at every training step?
        options:
          - id: a
            text: The online network θ; the target network is only copied from it
          - id: b
            text: The target network θ⁻; the online network is only copied from it
          - id: c
            text: Both networks, each with its own separate loss function
        answer: a
        feedback: Only θ is trained. The target network θ⁻ supplies targets and is refreshed by copying θ every so often, which keeps targets still between copies.
      - id: deep-q-networks.base.v2.3
        prompt: Why does a DQN target that uses the max over noisy Q-estimates tend to be too high?
        options:
          - id: c
            text: The discount factor inflates values that lie far in the future
          - id: b
            text: Rewards are added twice, once in r and once inside Q(s′, a′)
          - id: a
            text: The max tends to select whichever estimate has noise pushing it up
        answer: a
        feedback: Among several noisy estimates, the largest is usually one whose noise happens to be positive, so the max is biased upward. Discounting shrinks future values, and Q(s′, a′) covers later rewards, not r again.
      - id: deep-q-networks.base.v2.4
        prompt: Why can DQN learn from transitions collected by a much older version of its policy?
        options:
          - id: a
            text: Its Q-learning target doesn't depend on which policy chose the action
          - id: b
            text: The target network remembers what the old policy would have done
          - id: c
            text: Old transitions are relabeled with the current policy's rewards
        answer: a
        feedback: Q-learning is off-policy. Its target uses the reward and the max over next actions, so it doesn't matter which Pip chose the action. The target network doesn't store old policies, and rewards come from the environment, not the policy.
  - id: deep-q-networks.transfer.v2
    objective_ref: objective.deep-q-networks
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name the symptom first (correlated data, a chasing target, optimistic values, or a wrong ending), then pick the fix aimed at it.
    remediation_scene: deep-q-networks.s4
    variants:
      - id: deep-q-networks.transfer.v2.1
        prompt: A game agent's predicted Q-values keep climbing to around 500, although no episode in the game can return more than 50. What is the most likely cause and fix?
        options:
          - id: b
            text: The rewards are too sparse; add small bonus rewards for movement
          - id: a
            text: Max-based targets are overestimating; switch to Double DQN targets
          - id: c
            text: The replay buffer is too small; store every transition ever seen
        answer: a
        feedback: Values far above any achievable return point to overestimation, which bootstrapping compounds. Double DQN decouples choosing and scoring. Bonus rewards would raise values further, and buffer size doesn't cause optimism.
      - id: deep-q-networks.transfer.v2.2
        prompt: A traffic-light controller uses DQN. Every simulated day is cut off at midnight, and the code treats the cutoff exactly like a crash that ends the episode. What goes wrong?
        options:
          - id: a
            text: States near midnight learn artificially low values
          - id: b
            text: The replay buffer fills up with midnight traffic
          - id: c
            text: The target network is copied too often near midnight
        answer: a
        feedback: Treating a time-limit cutoff as a true ending drops the bootstrap term, so states just before midnight look as if nothing good can follow. Only true endings should skip the bootstrap.
      - id: deep-q-networks.transfer.v2.3
        prompt: A team's DQN learning curve rises, collapses, and rises again every few thousand steps. They find the target network is being copied from the online network after every single update. What should they try?
        options:
          - id: c
            text: Remove the replay buffer so each update uses fresh data
          - id: b
            text: Raise γ so that the targets rely more on future values
          - id: a
            text: Copy the weights far less often, or blend them in slowly
        answer: a
        feedback: Copying every step makes the target network identical to the online one, so the target chases the prediction again. Infrequent copies or a slow blend keep targets steady. Removing replay or raising γ would make training less stable, not more.
      - id: deep-q-networks.transfer.v2.4
        prompt: A paper reports a DQN variant that beats the baseline, showing one training run for each method. What should you ask for before believing the comparison?
        options:
          - id: a
            text: Several seeds per method, with the spread of their results
          - id: b
            text: A longer run of the same seed to see if the gap grows
          - id: c
            text: The single best episode reached by each of the two methods
        answer: a
        feedback: DQN results vary a lot between seeds, so one run per method can't separate a real improvement from luck. Longer runs or best episodes still come from a single draw.
  - id: deep-q-networks.calculate
    objective_ref: objective.deep-q-networks
    task: base
    response_type: numeric
    points: 1
    hint: "The target is r + γ × (the target network's value for the chosen next action). Plain DQN chooses with the target network's max; Double DQN chooses with the online network. At a true ending, the target is just r."
    remediation_scene: deep-q-networks.s3
    absolute_tolerance: 0.01
    variants:
      - id: deep-q-networks.calculate.1
        prompt: A transition has reward 1 and γ = 0.5. The target network rates the next state's two actions at 2 and 4. What is the plain DQN target y?
        answer: 3
        feedback: y = 1 + 0.5 × max(2, 4) = 1 + 2 = 3.
      - id: deep-q-networks.calculate.2
        prompt: A transition has reward 0 and γ = 0.9. For the next state, the online network rates actions A and B at 3 and 6; the target network rates them at 5 and 4. What is the Double DQN target y?
        answer: 3.6
        feedback: The online network chooses B (6). The target network scores B at 4. y = 0 + 0.9 × 4 = 3.6. Plain DQN would have used max(5, 4) = 5 and given 4.5.
      - id: deep-q-networks.calculate.3
        prompt: Pip docks on this transition, earning reward 10, and the episode ends. The target network would rate the next image at 7 for its best action, and γ = 0.9. What is the DQN target y?
        answer: 10
        feedback: Docking is a true ending, so nothing is bootstrapped. y = r = 10; the 7 is ignored.
      - id: deep-q-networks.calculate.4
        prompt: The DQN target for a transition is y = 3, and the online network predicts Q(s, a; θ) = 2. What is the squared loss for this transition?
        answer: 1
        feedback: (3 − 2)² = 1.
      - id: deep-q-networks.calculate.5
        prompt: A transition has reward −1 and γ = 0.9. For the next state, the online network rates forward and back at 7 and 9; the target network rates them at 8 and 5. What is the Double DQN target y?
        answer: 3.5
        feedback: The online network chooses back (9); the target network scores back at 5. y = −1 + 0.9 × 5 = 3.5, compared with 6.2 for plain DQN.
