lesson:
  id: deep-q-networks
  version: 0.4.0-draft
  title: Approximate action values with a neural network
  state: draft
  summary: Give Pip a camera and its Q-table explodes. Swap the table for a neural network, and learn the three tricks that let DQN master Atari games from pixels.
  slot: M24.5
  category: learning
  sources:
    - title: "Human-level control through deep reinforcement learning (Mnih et al., Nature 2015)"
      url: https://www.nature.com/articles/nature14236
    - title: Playing Atari with Deep Reinforcement Learning
      url: https://arxiv.org/abs/1312.5602
    - title: Deep Reinforcement Learning with Double Q-learning
      url: https://arxiv.org/abs/1509.06461
objectives:
  - id: objective.deep-q-networks
    version: 2-draft
    statement: DQN combines neural action-value prediction with replay and delayed target networks; these mechanisms reduce some instability while leaving exploration, distribution shift, and approximation errors to evaluate.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - deep-q-networks.base.v2
      - deep-q-networks.transfer.v2
      - deep-q-networks.calculate
    prerequisites:
      - anyOf:
          - objective.temporal-difference-and-q-learning
      - anyOf:
          - objective.neural-training-loop
scenes:
  - id: deep-q-networks.s1
    title: Too many rooms for a table
    type: explanation
    depth: intuition
    objective_refs:
      - objective.deep-q-networks
    markdown: |-
      Pip's new model has a camera. Its state is now an image, and no two images are quite the same: the light shifts, a sock appears, the cat walks past. A Q-table would need a row for every possible image, and Pip would never visit the same row twice.

      The fix is to replace the table with a function that *generalizes*: a neural network that takes the image and outputs one Q-value per action.

      $$Q(s, \cdot\,; \theta) \;\to\; [\,Q(s, \text{forward}),\ Q(s, \text{back}),\ Q(s, \text{left}),\ Q(s, \text{right})\,]$$

      Here $\theta$ (theta) stands for all the network's weights. Pip picks the action with the largest output, just as it picked the largest entry in a table row. This is a **deep Q-network (DQN)**.

      Generalization is the point: learning that the hallway image leads to the dock also raises the values of *similar* hallway images Pip has never seen. It's also the danger. One update to $\theta$ changes the outputs for every state at once, including states that were already right.

      :::story Atari from pixels
      In 2013 Volodymyr Mnih and colleagues at DeepMind showed a DQN learning seven Atari 2600 games from pixels. Their 2015 *Nature* paper scaled that up to 49 games. The input was the last four screen frames, and the only feedback was the game score. With the same network architecture and settings for every game, it reached at least 75% of a professional human games tester's score on 29 of the 49. Two tricks made that training stable; they're the next two scenes.
      :::
    bridges: []
  - id: deep-q-networks.s2
    title: Replay stored experience
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.deep-q-networks
    markdown: |-
      Pip spends its first 300 steps of the evening in the kitchen. If the network trained on each step as it happened, 300 updates in a row would all be kitchen images. The network would get very good at kitchens and, through its shared weights, quietly forget the hallway. Consecutive steps are highly correlated, and gradient descent assumes something closer to independent samples.

      An **experience replay buffer** fixes this. Every transition $(s, a, r, s')$ goes into a large memory. Each training step draws a random **minibatch** (a small batch, say 32 transitions) from the whole buffer, so one batch mixes kitchen, hallway, bedroom, last week and five minutes ago.

      Replay does two jobs:

      | Problem | How replay helps |
      | --- | --- |
      | Consecutive steps are correlated | Random sampling breaks up the streaks |
      | Experience is expensive to collect | Each transition is reused in many updates |

      Replay works because Q-learning is off-policy: old transitions came from an older, clumsier Pip, but the Q-learning target doesn't care which policy chose the action. A later refinement, **prioritized replay**, samples transitions with large TD errors more often, since those are the ones Pip has the most to learn from.
    bridges: []
  - id: deep-q-networks.s3
    title: Slow the moving target
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.deep-q-networks
    markdown: |-
      Q-learning's target uses $\max_{a'} Q(s', a')$. With a network, that max comes from the same weights $\theta$ you're updating. Each step nudges $Q(s, a)$ toward the target, which moves the target too, like a dog chasing its own tail. Values can oscillate or spiral.

      DQN keeps a second copy of the network, the **target network**, with frozen weights $\theta^-$. The target network supplies the targets; only the online network $\theta$ is trained. Every so often (every 10,000 updates in the 2015 paper), the weights are copied across: $\theta^- \leftarrow \theta$. Some later versions instead blend a small fraction of $\theta$ into $\theta^-$ at every step, which keeps the target just as steady.

      :::papers The DQN loss
      $$L(\theta) = \mathbb{E}_{(s,a,r,s') \sim \mathcal{D}} \Big[\big(\underbrace{r + \gamma \max_{a'} Q(s', a'; \theta^-)}_{\text{target } y} - Q(s, a; \theta)\big)^2\Big]$$

      $\mathcal{D}$ is the replay buffer. Pip's transition: forward in the hallway, $r = -1$, $\gamma = 0.9$. The target network rates the next image at forward 8, back 5, so $y = -1 + 0.9 \times 8 = 6.2$. The online network currently predicts $Q(s, \text{forward}; \theta) = 6$. The loss is $(6.2 - 6)^2 = 0.04$, and gradient descent nudges the 6 upward. If Pip had just docked, the target would be $y = r = 10$, with nothing bootstrapped.
      :::

      :::predict After a few updates, the online network predicts 6.1 for this transition. The target network hasn't been copied yet. What is the loss now?
      The target is still 6.2, because $\theta^-$ hasn't changed. So the loss is $(6.2 - 6.1)^2 = 0.01$. The target stood still while the prediction moved toward it, which is exactly the point. Without the frozen copy, the 8 would have drifted too.
      :::
    bridges: []
  - id: deep-q-networks.s5
    title: "Double DQN: don't let one network grade its own homework"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.deep-q-networks
    markdown: |-
      The max in the target has a hidden bias. Every Q-estimate is noisy. Taking the max of several noisy estimates tends to pick whichever one happens to be too high, so the target is systematically optimistic. The program shows it: four actions, all truly worth 5, estimated with a little noise.

      ```python run
      import numpy as np

      rng = np.random.default_rng(1)
      true_q = np.array([5.0, 5.0, 5.0, 5.0])   # four actions, all truly worth 5
      trials = 10_000

      # Two independent noisy estimates of the same four values (noise std 1)
      online = true_q + rng.normal(0, 1, size=(trials, 4))
      target = true_q + rng.normal(0, 1, size=(trials, 4))

      single = online.max(axis=1)                              # DQN-style: max of one estimate
      pick = online.argmax(axis=1)                             # Double: online network picks...
      double = target[np.arange(trials), pick]                 # ...target network scores it

      print(f"true value of the best action: {true_q.max():.2f}")
      print(f"max of one noisy estimate:     {single.mean():.2f}")
      print(f"double estimate:               {double.mean():.2f}")
      ```

      The single max averages 6.01, a full point too high; the double estimate averages 4.99. Set `true_q = np.full(10, 5.0)` and change both `4`s to `10`: with ten actions the single max climbs to 6.54.

      **Double DQN** (van Hasselt, Guez & Silver, 2015) separates choosing from scoring. The online network *chooses* the next action; the target network *scores* it:

      $$y = r + \gamma\, Q\big(s', \arg\max_{a'} Q(s', a'; \theta);\ \theta^-\big)$$

      Say the online network rates Pip's next image at forward 7, back 9, while the target network says forward 8, back 5. Plain DQN takes the target network's max: $-1 + 0.9 \times 8 = 6.2$. Double DQN lets the online network choose back, then uses the target network's score for back: $-1 + 0.9 \times 5 = 3.5$. Because a different set of weights does the scoring, an action that looks best only through the online network's noise usually gets an ordinary score, so the optimism doesn't pass into the target.

      :::mixup "The max of the estimates is a fair estimate of the max."
      It's biased upward whenever the estimates are noisy, and bootstrapping passes that optimism back to earlier states. That's how DQN's values can creep above any return Pip could really earn.
      :::
    bridges: []
  - id: deep-q-networks.s4
    title: Read a DQN learning curve like a skeptic
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.deep-q-networks
    markdown: |-
      DQN results swing between runs. Two habits catch most problems.

      **Train several seeds and plot them all.** One lucky run can look brilliant while three others collapse. Report the spread, not the best curve.

      **Separate "episode ended" from "time ran out".** Pip's training episodes are cut off after 200 steps. Suppose the code treats that cutoff like docking and uses the target $y = r = -1$, with no bootstrap. Then rooms Pip often reaches around step 200 learn a value near −1, when their true value is about 6. Pip learns to fear the far bedroom for no reason. The fix is one line: skip the bootstrap only for true endings (docking); after a time-limit cutoff, keep $\gamma \max_{a'} Q(s', a'; \theta^-)$ in the target.
    bridges: []
  - id: deep-q-networks.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.deep-q-networks
    markdown: Compute a few DQN and Double DQN targets, then diagnose a traffic-light controller, a game agent with runaway values, and a robot whose episodes hit a time limit.
    takeaway: |-
      DQN replaces the Q-table with a network and trains it on random minibatches from a replay buffer, against targets from a slowly updated target network. Double DQN lets one network choose the next action and the other score it.
  - id: deep-q-networks.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.deep-q-networks
    markdown: |-
      DQN estimates action values with a neural network. Replay reuses experience, and a delayed target network makes the values being fitted change less rapidly.
