schema_version: 0.2-draft
lesson:
  id: low-rank-adaptation
  version: 0.1.0-draft
  title: Adapt a model by learning a smaller parameter update
  state: draft
  summary: LoRA parameterizes selected weight updates as low-rank products; QLoRA combines adapter training with
    a quantized frozen base, trading memory and flexibility under specific numerical rules.
  slot: M20.3
  category: learning
  minutes: 12
  sources:
  - title: LoRA
    url: https://arxiv.org/abs/2106.09685
  - title: QLoRA
    url: https://arxiv.org/abs/2305.14314
objectives:
- id: objective.low-rank-adaptation
  version: 1-draft
  statement: LoRA parameterizes selected weight updates as low-rank products; QLoRA combines adapter training with
    a quantized frozen base, trading memory and flexibility under specific numerical rules.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - low-rank-adaptation.base
  - low-rank-adaptation.transfer
  prerequisites:
  - anyOf:
    - objective.supervised-fine-tuning
  - anyOf:
    - objective.matrices-tensors
  - anyOf:
    - objective.mixed-precision-training
scenes:
- id: low-rank-adaptation.s1
  title: Learn an update beside frozen weights
  type: explanation
  depth: intuition
  objective_refs:
  - objective.low-rank-adaptation
  markdown: For a selected matrix W, LoRA uses an effective weight W plus a scaled product BA. W can stay frozen
    while A and B learn. If W has shape d_out by d_in, B can be d_out by r and A r by d_in. The rank r limits this
    update’s parameterization.
  text_mode: For a selected matrix W, LoRA uses an effective weight W plus a scaled product BA. W can stay frozen
    while A and B learn. If W has shape d_out by d_in, B can be d_out by r and A r by d_in. The rank r limits this
    update’s parameterization.
  bridges: []
- id: low-rank-adaptation.s2
  title: Count a toy saving
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.low-rank-adaptation
  markdown: A 100 by 100 matrix has 10,000 entries. Rank-four factors contain 100×4 + 4×100 = 800 entries, before
    any additional trainable components. This reduces adapter parameters, but the base matrix still exists and forward/backward
    computation still requires the surrounding network.
  text_mode: A 100 by 100 matrix has 10,000 entries. Rank-four factors contain 100×4 + 4×100 = 800 entries, before
    any additional trainable components. This reduces adapter parameters, but the base matrix still exists and forward/backward
    computation still requires the surrounding network.
  bridges:
  - matrices-tensors
- id: low-rank-adaptation.s3
  title: Add quantization carefully
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.low-rank-adaptation
  markdown: QLoRA uses a quantized frozen base with trainable low-rank adapters and specific memory/numerical techniques.
    Computation can dequantize values into a suitable compute format. Training adapters on a quantized model does
    not imply directly updating all base weights in four-bit arithmetic.
  text_mode: QLoRA uses a quantized frozen base with trainable low-rank adapters and specific memory/numerical techniques.
    Computation can dequantize values into a suitable compute format. Training adapters on a quantized model does
    not imply directly updating all base weights in four-bit arithmetic.
  bridges: []
- id: low-rank-adaptation.s4
  title: Choose targets and evaluate merging
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.low-rank-adaptation
  markdown: Which layers receive adapters, the rank, scale, optimizer, and data all matter. Merging updates into
    a base or re-quantizing can affect numerical behavior. Compare quality, memory, and deployment compatibility;
    fewer trainable parameters do not guarantee equal quality or proportional total runtime savings.
  text_mode: Which layers receive adapters, the rank, scale, optimizer, and data all matter. Merging updates into
    a base or re-quantizing can affect numerical behavior. Compare quality, memory, and deployment compatibility;
    fewer trainable parameters do not guarantee equal quality or proportional total runtime savings.
  bridges: []
- id: low-rank-adaptation.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.low-rank-adaptation
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: LoRA parameterizes selected weight updates as low-rank products; QLoRA combines adapter training with
    a quantized frozen base, trading memory and flexibility under specific numerical rules.
- id: low-rank-adaptation.recap
  title: One idea to take with you
  type: recap
