assessment_families:
  - id: low-rank-adaptation.base
    objective_ref: objective.low-rank-adaptation
    task: base
    response_type: single_choice
    points: 1
    hint: 'Count a toy saving: trace the inputs, operation, and result before choosing.'
    remediation_scene: low-rank-adaptation.s2
    variants:
      - id: low-rank-adaptation.base.1
        prompt: What is trained in the simplest frozen-base LoRA setup?
        options:
          - id: b
            text: Every base matrix by definition
          - id: c
            text: Only tokenizer token IDs
          - id: a
            text: The low-rank factors
        answer: a
        feedback: The learned product supplies an update to selected weights.
        retired: true
      - id: low-rank-adaptation.base.2
        prompt: 100 by 4 plus 4 by 100 factors contain how many entries?
        options:
          - id: c
            text: 400 total
          - id: a
            text: '800'
          - id: b
            text: 10,000
        answer: a
        feedback: Both factor matrices contribute 400 entries.
        retired: true
  - id: low-rank-adaptation.transfer
    objective_ref: objective.low-rank-adaptation
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Choose targets and evaluate merging: trace the inputs, operation, and result before choosing.'
    remediation_scene: low-rank-adaptation.s4
    variants:
      - id: low-rank-adaptation.transfer.1
        prompt: Does QLoRA mean all base weights are directly updated in four-bit arithmetic?
        options:
          - id: c
            text: Only for all attention layers
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: The quantized base is frozen while adapters learn under the specified recipe.
        retired: true
      - id: low-rank-adaptation.transfer.2
        prompt: Does reducing trainable parameter count remove base-model memory?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if rank is four
        answer: a
        feedback: The frozen base remains part of execution.
        retired: true
  - id: low-rank-adaptation.base.v2
    objective_ref: objective.low-rank-adaptation
    task: base
    response_type: single_choice
    points: 1
    hint: "Picture the side path: A squeezes the input to r numbers, B expands it back, and the frozen W never changes. Ask what that shape allows and what it costs."
    remediation_scene: low-rank-adaptation.s1
    variants:
      - id: low-rank-adaptation.base.v2.1
        prompt: "LoRA initializes A with small random values and B with zeros. What does this choice accomplish?"
        options:
          - id: b
            text: It makes the update's rank start at r and shrink during training
          - id: a
            text: The adapted model starts out exactly equal to the base model
          - id: c
            text: It keeps the adapter's gradients at zero for the first steps
        answer: a
        feedback: With B = 0 the product BA is zero, so the first forward pass matches the base model exactly. The gradient for B isn't zero (it depends on A and the input), so training starts moving right away; the rank starts at 0, not r.
      - id: low-rank-adaptation.base.v2.2
        prompt: "A LoRA adapter with r = 8 is trained on a 4096 × 4096 matrix. What is the largest possible rank of the learned update BA?"
        options:
          - id: c
            text: 4096, the same as the matrix it is added to
          - id: b
            text: 16, because two factor matrices each add rank 8
          - id: a
            text: 8, because everything passes through r numbers
        answer: a
        feedback: A product can't have higher rank than its narrowest middle dimension, which is r = 8. The ranks of A and B don't add; they cap each other. The full 4096 would need a full-rank update, which LoRA can't express.
      - id: low-rank-adaptation.base.v2.3
        prompt: "After training, a team merges the adapter by computing W + (α/r)BA and saving it in place of W. How does the merged model's speed compare with the base model's?"
        options:
          - id: a
            text: Same speed, since the merged matrix has the original shape
          - id: b
            text: Slightly slower, since the adapter still runs as an extra step
          - id: c
            text: Faster, since the merged weights are lower rank than W
        answer: a
        feedback: Merging folds the update into one matrix of the same size, so no extra work is done at inference. The side path only costs extra time when adapters are kept separate, and W plus a low-rank update is generally still full rank.
      - id: low-rank-adaptation.base.v2.4
        prompt: "A team uses α = 32 with r = 16. What does the α/r factor do to the side path's output?"
        options:
          - id: c
            text: It divides BAx by 2 to keep the update small
          - id: a
            text: It multiplies BAx by 2 before adding it to Wx
          - id: b
            text: It multiplies the rank by 2, giving an effective rank of 32
        answer: a
        feedback: α/r = 32/16 = 2 scales the side path's output. It doesn't change the rank, which is set by the shapes of A and B; the scale just keeps the update's size steady when r changes.
  - id: low-rank-adaptation.transfer.v2
    objective_ref: objective.low-rank-adaptation
    task: transfer
    response_type: single_choice
    points: 1
    hint: Separate the three costs, frozen base in memory, trainable adapter, and inference speed, and ask which one the situation is really about.
    remediation_scene: low-rank-adaptation.s3
    variants:
      - id: low-rank-adaptation.transfer.v2.1
        prompt: "A researcher wants to fine-tune a 13-billion-parameter model on a laptop GPU with 12 GB of memory. The 16-bit weights alone take 26 GB. Which approach fits?"
        options:
          - id: b
            text: LoRA on the 16-bit base, since it trains only a tiny fraction of weights
          - id: a
            text: QLoRA, storing the frozen base in 4 bits and training 16-bit adapters
          - id: c
            text: Full fine-tuning with a smaller learning rate to save memory
        answer: a
        feedback: LoRA cuts the trainable numbers, but the 26 GB frozen base still has to fit. In 4 bits it takes about 6.5 GB, leaving room for adapters and activations. The learning rate has no effect on memory.
      - id: low-rank-adaptation.transfer.v2.2
        prompt: "A law firm serves one base model to 40 client teams, each wanting its own writing style. Which deployment keeps memory lowest?"
        options:
          - id: c
            text: Merge each team's adapter and keep 40 merged copies of the model
          - id: b
            text: Fully fine-tune one model on all 40 styles mixed together
          - id: a
            text: Keep one base copy and load each team's small adapter per request
        answer: a
        feedback: Adapters take megabytes and share one base copy, so 40 of them add little memory. Forty merged copies means forty full models, and one mixed model can't give each team its own style on request.
      - id: low-rank-adaptation.transfer.v2.3
        prompt: "A team adapts an English model to write Icelandic with rank-4 LoRA on two attention matrices. It improves a little, then stalls well below a full fine-tune. What should they try first?"
        options:
          - id: a
            text: Raise the rank and add adapters to more matrices
          - id: b
            text: Lower the rank to 2 so the update generalizes better
          - id: c
            text: Merge the adapter into the base, then keep training it
        answer: a
        feedback: A new language is a big change, and rank 4 on two matrices can only move the weights in a few directions. More rank and more target matrices give the update room. Lower rank restricts it further, and merging doesn't change what the adapter can express.
      - id: low-rank-adaptation.transfer.v2.4
        prompt: "A team trained a QLoRA adapter on a 4-bit base and wants one merged model for serving. What is the safer way to merge?"
        options:
          - id: b
            text: Add the update into the 4-bit codes so the file stays small
          - id: a
            text: Add the update to a 16-bit copy of the base weights
          - id: c
            text: Skip merging, since QLoRA adapters can't be merged at all
        answer: a
        feedback: The update is small, so rounding it into 4-bit codes can erase much of it; merging into 16-bit weights keeps it intact, and you can quantize again afterwards and test. QLoRA adapters can be merged; they just need a precise base to merge into.
  - id: low-rank-adaptation.calculate
    objective_ref: objective.low-rank-adaptation
    task: base
    response_type: numeric
    points: 1
    hint: "A matrix with d_out rows and d_in columns gets B (d_out × r) and A (r × d_in), so one adapter trains r × (d_out + d_in) numbers. Multiply by the number of adapted matrices."
    remediation_scene: low-rank-adaptation.s2
    absolute_tolerance: 0.5
    variants:
      - id: low-rank-adaptation.calculate.1
        prompt: A LoRA adapter with rank r = 8 is added to one 1024 × 1024 weight matrix. How many numbers does it train?
        answer: 16384
        feedback: 2 × 1024 × 8 = 16,384, compared with 1,048,576 for the full matrix (1.6%).
      - id: low-rank-adaptation.calculate.2
        prompt: A feed-forward matrix maps 11,008 inputs to 4,096 outputs. A rank-16 LoRA adapter is added to it. How many numbers does the adapter train?
        answer: 241664
        feedback: B is 4096 × 16 and A is 16 × 11008, so 16 × (4096 + 11008) = 16 × 15,104 = 241,664.
      - id: low-rank-adaptation.calculate.3
        prompt: A rank-32 LoRA adapter is added to one 2048 × 2048 matrix. How many numbers does it train?
        answer: 131072
        feedback: 2 × 2048 × 32 = 131,072, which is 3.1% of the 4,194,304 entries in the full matrix.
      - id: low-rank-adaptation.calculate.4
        prompt: A 32-layer model has d = 4096. A rank-8 adapter is added to the query and value matrices (each 4096 × 4096) in every layer. How many numbers are trained in total?
        answer: 4194304
        feedback: One adapter trains 2 × 4096 × 8 = 65,536. Two per layer across 32 layers gives 64 × 65,536 = 4,194,304.
      - id: low-rank-adaptation.calculate.5
        prompt: A rank-8 LoRA adapter is added to one 5120 × 5120 matrix. How many numbers does it train?
        answer: 81920
        feedback: 2 × 5120 × 8 = 81,920, against 26,214,400 for the full matrix.
