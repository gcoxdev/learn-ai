schema_version: 0.2-draft
lesson:
  id: low-rank-adaptation
  version: 0.4.0-draft
  title: Adapt a model by learning a smaller parameter update
  state: draft
  summary: Full fine-tuning of a 7-billion-parameter model needs over 100 GB of memory. LoRA trains 0.06% of the numbers instead, and QLoRA squeezes the rest onto one GPU.
  slot: M20.3
  category: learning
  sources:
    - title: "LoRA: Low-Rank Adaptation of Large Language Models (Hu et al., 2021)"
      url: https://arxiv.org/abs/2106.09685
    - title: "QLoRA: Efficient Finetuning of Quantized LLMs (Dettmers et al., 2023)"
      url: https://arxiv.org/abs/2305.14314
    - title: Hugging Face PEFT documentation — LoRA
      url: https://huggingface.co/docs/peft/main/en/conceptual_guides/lora
objectives:
  - id: objective.low-rank-adaptation
    version: 2-draft
    statement: LoRA trains a small low-rank update instead of full weight matrices; QLoRA does the same on top of a 4-bit frozen base to save memory.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - low-rank-adaptation.base.v2
      - low-rank-adaptation.transfer.v2
      - low-rank-adaptation.calculate
    prerequisites:
      - anyOf:
          - objective.supervised-fine-tuning
      - anyOf:
          - objective.matrices-tensors
      - anyOf:
          - objective.mixed-precision-training
scenes:
  - id: low-rank-adaptation.s1
    title: Freeze the model, train a thin side path
    type: explanation
    depth: intuition
    objective_refs:
      - objective.low-rank-adaptation
    markdown: |-
      Ferncliff Cycles has its 860 demonstrations and a 7-billion-parameter model. Full fine-tuning updates every weight, and training with Adam needs about 16 bytes per parameter (weights, gradients, and optimizer states, as the infrastructure module worked out): $7 \times 10^9 \times 16 \approx 112$ GB before activations. Ferncliff has one 24 GB graphics card.

      **LoRA** (Hu et al., 2021) keeps every original weight **frozen**, meaning training never changes it. Next to a chosen weight matrix $W$ it adds a thin side path made of two small matrices, $A$ and $B$, and trains only those:

      $$h = Wx + \frac{\alpha}{r}\,BAx$$

      $x$ is the layer's input and $h$ its output. For a $d \times d$ matrix $W$, $A$ is $r \times d$: it squeezes the input down to just $r$ numbers. $B$ is $d \times r$: it spreads those $r$ numbers back out to full size. The bottleneck size $r$ is the **rank**, which is where the name *low-rank adaptation* comes from. It is small, often 8 or 16, and $\alpha$ is a fixed scale you choose.

      The side path starts silent. $A$ begins with small random values and $B$ begins at zero, so $BA = 0$ and the model on step one is exactly the base model. Training then grows $B$ and $A$ into a useful update. The learned change to the weights is $\Delta W = \frac{\alpha}{r}BA$.
    diagram:
      caption: A LoRA layer. The frozen weight and the trainable low-rank side path both read the input, and their outputs add.
      description: The input x goes two ways. One path goes through the frozen weight matrix W. The other goes through A, which squeezes it to r numbers, then B, which expands it back to full size, scaled by alpha over r. The two results are added to give the output h. Only A and B are trained.
      nodes:
        - id: x
          label: Input x
          note: d numbers
          col: 0
          row: 1
        - id: w
          label: Frozen W
          note: d × d, never updated
          col: 2
          row: 0
          tone: muted
        - id: a
          label: A (trainable)
          note: r × d, squeezes to r numbers
          col: 1
          row: 2
          tone: accent
        - id: b
          label: B (trainable)
          note: d × r, starts at zero
          col: 2
          row: 2
          tone: accent
        - id: add
          label: Add
          col: 3
          row: 1
        - id: h
          label: Output h
          note: d numbers
          col: 4
          row: 1
      edges:
        - from: x
          to: w
        - from: x
          to: a
        - from: a
          to: b
          label: r numbers
        - from: w
          to: add
          label: Wx
        - from: b
          to: add
          label: × α/r
        - from: add
          to: h
    bridges: []
  - id: low-rank-adaptation.s2
    title: Count what you train
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.low-rank-adaptation
    markdown: |-
      Take one attention matrix in Ferncliff's model, with $d = 4096$ and $r = 8$.

      | | Numbers trained |
      | --- | ---: |
      | Full update, $d \times d$ | $4096^2 = 16{,}777{,}216$ |
      | LoRA, $B$ plus $A$: $2dr$ | $2 \times 4096 \times 8 = 65{,}536$ |

      That's 0.39% of the full matrix, 256 times fewer. The LoRA paper put adapters on two attention matrices per layer, the query and value projections. For a 32-layer model: $2 \times 32 \times 65{,}536 = 4{,}194{,}304$ trainable numbers, about 0.06% of 7 billion.

      Why can so few numbers work? A product $BA$ passes through only $r$ numbers in the middle, so its rank, the number of independent directions it can change, is at most $r$. The LoRA authors' bet was that fine-tuning needs only a few such directions: teaching "answer like Ferncliff" is a small adjustment to a model that already knows language. The code checks both the count and the rank limit.

      ```python run
      import numpy as np

      d, r, alpha = 4096, 8, 16
      full, lora = d * d, d * r + r * d
      print(f"full {d} x {d} update: {full:,} numbers")
      print(f"LoRA B ({d} x {r}) + A ({r} x {d}): {lora:,} numbers = {100 * lora / full:.2f}%")

      rng = np.random.default_rng(0)
      d = 64                                    # a small matrix so the checks run fast
      W = rng.normal(size=(d, d))               # frozen base weights
      B = rng.normal(size=(d, r))               # (real LoRA starts B at zero; these are
      A = rng.normal(size=(r, d))               #  stand-ins for trained values)
      delta = (alpha / r) * B @ A
      print("rank of W:", np.linalg.matrix_rank(W), "| rank of update:", np.linalg.matrix_rank(delta))

      x = rng.normal(size=d)
      side_path = W @ x + (alpha / r) * (B @ (A @ x))   # adapter kept separate
      merged = (W + delta) @ x                           # adapter folded into W
      print(f"largest difference, separate vs merged: {np.abs(side_path - merged).max():.1e}")
      ```

      The update's rank prints as 8, even though the random base matrix has full rank 64. Change `r` to 3 and it prints 3. The last line is a tiny rounding error, around $10^{-13}$: the next scene explains why that matters.

      :::predict Ferncliff raises r to 16. How many numbers does one 4096 × 4096 adapter train now?
      $2 \times 4096 \times 16 = 131{,}072$, double the rank-8 count and still only 0.78% of the full matrix. LoRA's cost grows in a straight line with $r$.
      :::
    bridges:
      - matrices-tensors
  - id: low-rank-adaptation.s3
    title: Squeeze the frozen base to 4 bits
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.low-rank-adaptation
    markdown: |-
      LoRA shrinks what you *train*, but the frozen base still has to sit in memory. In 16-bit numbers, 7 billion weights take $7 \times 10^9 \times 2 = 14$ GB.

      **QLoRA** (Dettmers et al., 2023) stores the frozen base with **quantization**: each weight is replaced by a 4-bit code plus a shared scale for each small block of weights. At half a byte per weight, the base shrinks to about 3.5 GB, plus a little for the scales.

      | Setup | Rough memory before activations |
      | --- | ---: |
      | Full fine-tuning with Adam (16 bytes per weight) | 112 GB |
      | LoRA on a 16-bit base (2 bytes per frozen weight) | 14 GB + about 0.07 GB for the adapters |
      | QLoRA: LoRA on a 4-bit base (half a byte per frozen weight) | 3.5 GB + adapters |

      The adapter figure counts the 4.2 million adapter numbers on the query and value matrices at the full 16 bytes each, since they do get gradients and Adam states: about 67 MB.

      QLoRA's 4-bit code is **NF4** (4-bit NormalFloat), whose 16 levels are spaced to suit weights that follow a bell curve. The paper added two memory savers: quantizing the scales themselves ("double quantization") and paging optimizer states out to CPU memory during spikes. With all three, the authors fine-tuned a 65-billion-parameter model on a single 48 GB GPU.

      :::mixup "QLoRA trains a 4-bit model."
      The 4-bit weights are frozen and are never trained. For each matrix multiply, the needed weights are converted back to 16-bit (BF16) numbers, the arithmetic runs in 16 bits, and gradients flow through to the LoRA adapters, which are kept in 16-bit precision throughout.
      :::
    bridges: []
  - id: low-rank-adaptation.s4
    title: Merge it, or keep it on the side
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.low-rank-adaptation
    markdown: |-
      After training, Ferncliff has two choices.

      **Merge.** Compute $W' = W + \frac{\alpha}{r}BA$ once and replace $W$. The merged model has exactly the original shapes, so it runs at the original speed. The code above showed the separate and merged paths agree to rounding error. If the base was 4-bit, merge into a 16-bit copy of the weights; folding the update into 4-bit codes would round much of it away.

      **Keep adapters separate.** Ferncliff builds a second adapter for its mechanics, trained on repair manuals. The two adapters are about 8 MB each in 16-bit, and one copy of the base can serve both, swapping the adapter per request.

      Two knobs need care. The $\frac{\alpha}{r}$ scale keeps the update's size roughly steady when you change $r$, so you retune the learning rate less often. With $\alpha = 16$ and $r = 8$, the side path is multiplied by 2. And a small $r$ is a real limit: rank 8 can make many small adjustments, but a big change, such as teaching the model a new language, may need a higher rank, more target matrices, or full fine-tuning. Compare against a full fine-tune on a held-out set before you trust the smaller run.
    bridges: []
  - id: low-rank-adaptation.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.low-rank-adaptation
    markdown: Count LoRA parameters for a few matrix shapes, then decide how to fit, merge, and serve adapters for a translation app, a law firm, and a laptop GPU.
    takeaway: |-
      LoRA freezes the model and trains a side path BA of rank r, which costs 2dr numbers instead of d². QLoRA stores the frozen base in 4 bits, and a trained adapter can be merged in at no speed cost or kept separate to swap.
  - id: low-rank-adaptation.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.low-rank-adaptation
    markdown: |-
      LoRA learns a small factored update beside frozen base weights. QLoRA also compresses the stored base weights; the rest of training still needs memory and computation.
