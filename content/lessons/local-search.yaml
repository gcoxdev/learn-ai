assessment_families:
- id: local-search.base
  objective_ref: objective.local-search
  task: base
  response_type: single_choice
  points: 1
  hint: 'A local optimum can be misleading: trace the inputs, operation, and result before choosing.'
  remediation_scene: local-search.s2
  variants:
  - id: local-search.base.1
    prompt: What defines a local-search neighborhood?
    options:
    - id: c
      text: Only the processor architecture
    - id: a
      text: The allowed small changes to a candidate
    - id: b
      text: Every possible dataset in the world
    answer: a
    feedback: Neighborhood moves determine which alternatives are examined locally.
  - id: local-search.base.2
    prompt: A candidate is best among one-swap neighbors. Is it necessarily globally best?
    options:
    - id: a
      text: 'No'
    - id: b
      text: Yes, by definition
    - id: c
      text: Only if its score is an integer
    answer: a
    feedback: A local optimum need not be optimal across all feasible candidates.
- id: local-search.transfer
  objective_ref: objective.local-search
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Keep feasibility and value separate: trace the inputs, operation, and result before choosing.'
  remediation_scene: local-search.s4
  variants:
  - id: local-search.transfer.1
    prompt: Why might simulated annealing accept a worse move?
    options:
    - id: a
      text: To explore beyond a local trap under its schedule
    - id: b
      text: Because the objective is never used
    - id: c
      text: To guarantee every next step improves
    answer: a
    feedback: Controlled acceptance can expand exploration but costs computation.
  - id: local-search.transfer.2
    prompt: A high-scoring schedule double-books a room. What distinction matters?
    options:
    - id: b
      text: Only the random seed
    - id: c
      text: Only whether the score is positive
    - id: a
      text: Objective value versus feasibility
    answer: a
    feedback: A good objective score does not replace required constraints.
