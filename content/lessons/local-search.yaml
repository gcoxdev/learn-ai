schema_version: 0.2-draft
lesson:
  id: local-search
  version: 0.1.0-draft
  title: Improve a candidate without exploring every path
  state: draft
  summary: Local search changes a current candidate using an objective and neighborhood; restarts, annealing, and
    constraint handling trade search effort against solution quality.
  slot: M05.8
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.local-search
  version: 1-draft
  statement: Local search changes a current candidate using an objective and neighborhood; restarts, annealing,
    and constraint handling trade search effort against solution quality.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - local-search.base
  - local-search.transfer
  prerequisites:
  - anyOf:
    - objective.search-problems
  - anyOf:
    - objective.optimization-math
scenes:
- id: local-search.s1
  title: Search over complete candidates
  type: explanation
  depth: intuition
  objective_refs:
  - objective.local-search
  markdown: For a timetable, a candidate may be a full assignment of classes to rooms and times. A neighbor changes
    one assignment or swaps two. Local search asks whether nearby candidates improve an objective. It often cares
    about the final assignment, not the sequence of steps used to reach it.
  text_mode: For a timetable, a candidate may be a full assignment of classes to rooms and times. A neighbor changes
    one assignment or swaps two. Local search asks whether nearby candidates improve an objective. It often cares
    about the final assignment, not the sequence of steps used to reach it.
  bridges: []
- id: local-search.s2
  title: A local optimum can be misleading
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.local-search
  markdown: Suppose every single swap worsens a schedule, but changing three assignments together improves it. A
    greedy hill-climbing method can stop at the single-swap local optimum. The neighborhood definition determines
    what counts as local. A global optimum is best across all feasible candidates, not only neighboring ones.
  text_mode: Suppose every single swap worsens a schedule, but changing three assignments together improves it.
    A greedy hill-climbing method can stop at the single-swap local optimum. The neighborhood definition determines
    what counts as local. A global optimum is best across all feasible candidates, not only neighboring ones.
  bridges:
  - optimization-math
- id: local-search.s3
  title: Explore beyond the first basin
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.local-search
  markdown: Random restarts try different initial candidates. Simulated annealing sometimes accepts worse moves,
    with an acceptance schedule that becomes more selective over time. These methods can help escape local traps,
    but finite practical runs do not automatically deliver the global optimum. Record the schedule and budget.
  text_mode: Random restarts try different initial candidates. Simulated annealing sometimes accepts worse moves,
    with an acceptance schedule that becomes more selective over time. These methods can help escape local traps,
    but finite practical runs do not automatically deliver the global optimum. Record the schedule and budget.
  bridges: []
- id: local-search.s4
  title: Keep feasibility and value separate
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.local-search
  markdown: A schedule with excellent preference scores can still double-book a room. Hard constraints can be enforced
    during candidate construction or repair; penalties express violations through a cost but need calibration. Compare
    feasible quality, runtime, robustness across starts, and the cost of constraint violations.
  text_mode: A schedule with excellent preference scores can still double-book a room. Hard constraints can be enforced
    during candidate construction or repair; penalties express violations through a cost but need calibration. Compare
    feasible quality, runtime, robustness across starts, and the cost of constraint violations.
  bridges: []
- id: local-search.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.local-search
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Local search changes a current candidate using an objective and neighborhood; restarts, annealing, and
    constraint handling trade search effort against solution quality.
- id: local-search.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.local-search
  markdown: Local search changes a current candidate using an objective and neighborhood; restarts, annealing, and
    constraint handling trade search effort against solution quality.
  text_mode: Local search changes a current candidate using an objective and neighborhood; restarts, annealing,
