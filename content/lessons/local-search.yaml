schema_version: 0.2-draft
lesson:
  id: local-search
  version: 0.3.0-draft
  title: Improve a candidate without exploring every path
  state: draft
  summary: Improve a timetable through small edits, while keeping a good score separate from a valid solution.
  slot: M05.8
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.local-search
  version: 1-draft
  statement: Local search changes a current candidate using an objective and neighborhood; restarts, annealing,
    and constraint handling trade search effort against solution quality.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - local-search.base
  - local-search.transfer
  prerequisites:
  - anyOf:
    - objective.search-problems
  - anyOf:
    - objective.optimization-math
scenes:
- id: local-search.s1
  title: Improve one proposed timetable
  type: explanation
  depth: intuition
  objective_refs:
  - objective.local-search
  markdown: 'A **candidate** is a complete proposed solution, such as a timetable assigning every class a room
    and time. An **objective** is the score to improve, such as the number of clashes to reduce.


    **Local search** starts with a candidate and tries nearby alternatives. Here, “nearby” means reachable
    through an allowed edit, such as moving one class or swapping two. The aim is a useful final timetable;
    the sequence of edits usually matters less than the resulting assignment.'
  text_mode: 'A **candidate** is a complete proposed solution, such as a timetable assigning every class a
    room and time. An **objective** is the score to improve, such as the number of clashes to reduce.


    **Local search** starts with a candidate and tries nearby alternatives. Here, “nearby” means reachable
    through an allowed edit, such as moving one class or swapping two. The aim is a useful final timetable;
    the sequence of edits usually matters less than the resulting assignment.'
  bridges: []
- id: local-search.s2
  title: A local optimum can be misleading
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.local-search
  markdown: Suppose every single swap worsens a schedule, but changing three assignments together improves
    it. A greedy hill-climbing method can stop at the single-swap local optimum. The neighborhood definition
    determines what counts as local. A global optimum is best across all feasible candidates, not only neighboring
    ones.
  text_mode: Suppose every single swap worsens a schedule, but changing three assignments together improves
    it. A greedy hill-climbing method can stop at the single-swap local optimum. The neighborhood definition
    determines what counts as local. A global optimum is best across all feasible candidates, not only neighboring
    ones.
  bridges:
  - optimization-math
- id: local-search.s3
  title: Try another starting point
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.local-search
  markdown: Random restarts try different initial candidates. Simulated annealing sometimes accepts worse moves,
    with an acceptance schedule that becomes more selective over time. These methods can help escape local
    traps, but finite practical runs do not automatically deliver the global optimum. Record the schedule and
    budget.
  text_mode: Random restarts try different initial candidates. Simulated annealing sometimes accepts worse
    moves, with an acceptance schedule that becomes more selective over time. These methods can help escape
    local traps, but finite practical runs do not automatically deliver the global optimum. Record the schedule
    and budget.
  bridges: []
- id: local-search.s4
  title: Keep feasibility and value separate
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.local-search
  markdown: 'A schedule with excellent preference scores can still double-book a room. Hard constraints can
    be enforced during candidate construction or repair; penalties express violations through a cost but need
    calibration. Compare feasible quality, runtime, robustness across starts, and the cost of constraint violations.


    Suppose schedule A earns 10 preference points but books one room twice; B earns 8 and has no clashes. If
    room availability is a hard requirement, B is acceptable and A is not. Subtracting only 1 point per clash
    would still favor A with score 9. That penalty is too weak to express the requirement. Try changing the
    penalty, then distinguish discouraging a violation from forbidding it.'
  text_mode: 'A schedule with excellent preference scores can still double-book a room. Hard constraints can
    be enforced during candidate construction or repair; penalties express violations through a cost but need
    calibration. Compare feasible quality, runtime, robustness across starts, and the cost of constraint violations.


    Suppose schedule A earns 10 preference points but books one room twice; B earns 8 and has no clashes. If
    room availability is a hard requirement, B is acceptable and A is not. Subtracting only 1 point per clash
    would still favor A with score 9. That penalty is too weak to express the requirement. Try changing the
    penalty, then distinguish discouraging a violation from forbidding it.'
  bridges: []
- id: local-search.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.local-search
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Local search improves a solution through small edits. A stopping point may be best only among those
    nearby edits, and a good score does not excuse breaking a hard requirement.
- id: local-search.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.local-search
  markdown: Local search improves a solution through small edits. A stopping point may be best only among those
    nearby edits, and a good score does not excuse breaking a hard requirement.
