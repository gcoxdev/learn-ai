assessment_families:
- id: neuromorphic-scientific-applications.base
  objective_ref: objective.neuromorphic-scientific-applications
  task: base
  response_type: single_choice
  points: 1
  hint: 'Connect representation to the task: trace the inputs, operation, and result before choosing.'
  remediation_scene: neuromorphic-scientific-applications.s2
  variants:
  - id: neuromorphic-scientific-applications.base.1
    prompt: What does an event camera primarily report?
    options:
    - id: b
      text: A complete fixed-rate RGB frame necessarily
    - id: c
      text: Only object labels
    - id: a
      text: Local brightness changes over time
    answer: a
    feedback: Its output is an asynchronous event representation.
  - id: neuromorphic-scientific-applications.base.2
    prompt: Does biological inspiration prove biological fidelity?
    options:
    - id: c
      text: Only if spikes are used
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: The implemented mechanisms must be specified.
- id: neuromorphic-scientific-applications.transfer
  objective_ref: objective.neuromorphic-scientific-applications
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Keep mechanisms inspectable: trace the inputs, operation, and result before choosing.'
  remediation_scene: neuromorphic-scientific-applications.s4
  variants:
  - id: neuromorphic-scientific-applications.transfer.1
    prompt: Why include encoding and communication in energy measurements?
    options:
    - id: c
      text: They are always free
    - id: a
      text: They can dominate savings in the compute core
    - id: b
      text: Only neuron operations consume energy
    answer: a
    feedback: System-level cost exceeds isolated arithmetic cost.
  - id: neuromorphic-scientific-applications.transfer.2
    prompt: Is simulating spikes on a GPU the same hardware claim as running on a neuromorphic chip?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if the equations match
    answer: a
    feedback: Algorithm and hardware implementation are separate variables.
