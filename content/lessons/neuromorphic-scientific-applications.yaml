assessment_families:
  - id: neuromorphic-scientific-applications.base
    objective_ref: objective.neuromorphic-scientific-applications
    task: base
    response_type: single_choice
    points: 1
    hint: 'Connect representation to the task: trace the inputs, operation, and result before choosing.'
    remediation_scene: neuromorphic-scientific-applications.s2
    variants:
      - id: neuromorphic-scientific-applications.base.1
        prompt: What does an event camera primarily report?
        options:
          - id: b
            text: A complete fixed-rate RGB frame necessarily
          - id: c
            text: Only object labels
          - id: a
            text: Local brightness changes over time
        answer: a
        feedback: Its output is an asynchronous event representation.
        retired: true
      - id: neuromorphic-scientific-applications.base.2
        prompt: Does biological inspiration prove biological fidelity?
        options:
          - id: c
            text: Only if spikes are used
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: The implemented mechanisms must be specified.
        retired: true
  - id: neuromorphic-scientific-applications.transfer
    objective_ref: objective.neuromorphic-scientific-applications
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Keep mechanisms inspectable: trace the inputs, operation, and result before choosing.'
    remediation_scene: neuromorphic-scientific-applications.s4
    variants:
      - id: neuromorphic-scientific-applications.transfer.1
        prompt: Why include encoding and communication in energy measurements?
        options:
          - id: c
            text: They are always free
          - id: a
            text: They can dominate savings in the compute core
          - id: b
            text: Only neuron operations consume energy
        answer: a
        feedback: System-level cost exceeds isolated arithmetic cost.
        retired: true
      - id: neuromorphic-scientific-applications.transfer.2
        prompt: Is simulating spikes on a GPU the same hardware claim as running on a neuromorphic chip?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if the equations match
        answer: a
        feedback: Algorithm and hardware implementation are separate variables.
        retired: true
  - id: neuromorphic-scientific-applications.base.v2
    objective_ref: objective.neuromorphic-scientific-applications
    task: base
    response_type: single_choice
    points: 1
    hint: Run the three LIF rules in your head (leak, add the input, fire and reset), and remember that work happens only when an event or spike arrives.
    remediation_scene: neuromorphic-scientific-applications.lif-neuron
    variants:
      - id: neuromorphic-scientific-applications.base.v2.1
        prompt: A LIF neuron with β = 0.5 and threshold 1 receives a steady input of 0.4 and never fires. Why?
        options:
          - id: b
            text: Its potential is reset to 0 after every step, so it can't build up
          - id: a
            text: Its potential levels off at 0.8, where the leak cancels the input
          - id: c
            text: The input is below the threshold, and inputs must exceed it to fire
        answer: a
        feedback: The potential rises 0.4, 0.6, 0.7… toward the level where 0.5v + 0.4 = v, which is 0.8, below the threshold. Resets happen only after spikes, and an input smaller than the threshold can still cause firing if the leak is weak enough.
      - id: neuromorphic-scientific-applications.base.v2.2
        prompt: An event camera watches a lab bench. Which scene will generate the most events per second?
        options:
          - id: c
            text: A brightly lit bench where no object moves
          - id: a
            text: A bench under a flickering fluorescent tube
          - id: b
            text: A dimly lit bench where no object moves
        answer: a
        feedback: Pixels report changes in brightness, so flicker makes many pixels fire over and over. Brightness level alone doesn't create events; a still scene, bright or dim, stays mostly quiet.
      - id: neuromorphic-scientific-applications.base.v2.3
        prompt: A spiking layer has 1,000 inputs and 100 neurons and runs 10 time steps per frame. How does its work compare with a conventional layer's 100,000 multiply-adds if 10% of inputs spike each step?
        options:
          - id: a
            text: About the same, 100,000 additions, so sparsity gives no saving
          - id: b
            text: About a tenth, 10,000 additions, since only 10% of inputs spike
          - id: c
            text: About ten times more, since it runs ten time steps per frame
        answer: a
        feedback: 1,000 × 0.10 × 10 × 100 = 100,000 additions. The 10% sparsity is cancelled by the 10 time steps. Counting only the sparsity or only the steps gives one half of the calculation.
      - id: neuromorphic-scientific-applications.base.v2.4
        prompt: Why can't plain backpropagation train a spiking network directly?
        options:
          - id: b
            text: Spiking networks have no weights, only thresholds and leaks
          - id: c
            text: The leak erases the potential before gradients can be stored
          - id: a
            text: A spike's jump from 0 to 1 has a zero derivative almost everywhere
        answer: a
        feedback: The fire step is a step function, so its gradient gives no learning signal. Surrogate gradients replace it with a smooth stand-in during the backward pass. Spiking networks do have weights, and the leak doesn't block gradient storage.
      - id: neuromorphic-scientific-applications.base.v2.5
        prompt: According to Intel's 2021 survey of Loihi results, which kind of network showed the least benefit on the chip?
        options:
          - id: a
            text: Conventional feedforward deep networks converted to run on it
          - id: c
            text: Recurrent networks that rely on precise spike timing
          - id: b
            text: Sparse networks that process event-camera streams
        answer: a
        feedback: The survey found "modest if any benefit" for conventional feedforward deep networks, and large latency and energy gains for certain recurrent, timing-based, sparse computations.
  - id: neuromorphic-scientific-applications.transfer.v2
    objective_ref: objective.neuromorphic-scientific-applications
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask whether the input is sparse and bursty, whether low latency or low power matters, and whether the energy figure was measured on the device with a fair baseline.
    remediation_scene: neuromorphic-scientific-applications.s4
    variants:
      - id: neuromorphic-scientific-applications.transfer.v2.1
        prompt: A paper reports a spiking model's energy by multiplying its synaptic operation count by a picojoule figure from a chip datasheet. The model ran on a GPU. What kind of claim is this?
        options:
          - id: b
            text: A measured energy result for the neuromorphic chip itself
          - id: a
            text: An estimate from operation counts, not a measurement on the chip
          - id: c
            text: A GPU energy measurement, since that's where the model ran
        answer: a
        feedback: No chip was run and nothing was measured; the figure multiplies counts by a datasheet number. It also leaves out memory traffic, the sensor, and idle power, which real measurements include.
      - id: neuromorphic-scientific-applications.transfer.v2.2
        prompt: Which project is the strongest fit for an event camera plus a spiking processor?
        options:
          - id: c
            text: Classifying a million archived museum photos overnight
          - id: b
            text: Transcribing hour-long lecture videos into text in batches
          - id: a
            text: Tracking a fast-moving insect on a battery-powered field rig
        answer: a
        feedback: Fast motion against a still background makes sparse events, and battery power rewards doing work only when something happens. Archived photos and batch video are dense, offline jobs that GPUs handle well.
      - id: neuromorphic-scientific-applications.transfer.v2.3
        prompt: A factory monitor uses an event camera on a conveyor belt. Energy use is low at night but triples during the day shift. What's the most likely cause?
        options:
          - id: a
            text: Moving products and workers generate many more events
          - id: b
            text: The chip's leak parameter changes as the room warms up
          - id: c
            text: The camera switches to full frames when lights are on
        answer: a
        feedback: Event-driven workload follows activity in the scene, so a busy shift means more events and more work. Parameters don't drift with the shift, and event cameras don't switch to frames.
      - id: neuromorphic-scientific-applications.transfer.v2.4
        prompt: A team claims its spiking keyword detector beats a conventional one on energy. Their baseline is a large 2016-era network on a desktop GPU; theirs runs on a neuromorphic chip. What comparison should a reviewer ask for?
        options:
          - id: c
            text: The same spiking model rerun on the desktop GPU instead
          - id: a
            text: A small, modern network on a low-power chip at matched accuracy
          - id: b
            text: The energy for a single synaptic operation on each chip
        answer: a
        feedback: A fair baseline is the best conventional option for the same job, a compact model on efficient edge hardware, at the same accuracy. Per-operation energy ignores the rest of the system, and moving the spiking model to a GPU tests a different question.
      - id: neuromorphic-scientific-applications.transfer.v2.5
        prompt: A neuroscientist wants a sensor neuron that ignores a steady background hum but fires when a sudden loud click arrives. How should she set a LIF neuron's leak and threshold?
        options:
          - id: a
            text: Strong leak and a threshold above the hum's steady level
          - id: b
            text: No leak, so every sound adds up until it fires
          - id: c
            text: A threshold below the hum's level, so it fires early
        answer: a
        feedback: With strong leak, a steady input levels off at I/(1 − β). Put the threshold above that level and the hum never fires the neuron, while a sudden large input crosses it. Without leak the hum would accumulate and fire anyway.
  - id: neuromorphic-scientific-applications.calculate
    objective_ref: objective.neuromorphic-scientific-applications
    task: base
    response_type: numeric
    points: 1
    hint: Start at v = 0. Each step, multiply v by β, add the input, and check whether v has reached the threshold. Count steps until the first time it does.
    remediation_scene: neuromorphic-scientific-applications.lif-neuron
    absolute_tolerance: 0.01
    variants:
      - id: neuromorphic-scientific-applications.calculate.1
        prompt: A LIF neuron starts at v = 0 with β = 0.5, threshold 1, and a steady input of 0.8 each step. On which step does it first spike?
        answer: 2
        feedback: Step 1 gives 0.8. Step 2 gives 0.5 × 0.8 + 0.8 = 1.2, which reaches the threshold.
      - id: neuromorphic-scientific-applications.calculate.2
        prompt: A LIF neuron starts at v = 0 with β = 0.9, threshold 1, and a steady input of 0.3. On which step does it first spike?
        answer: 4
        feedback: The potential goes 0.3, 0.57, 0.813, then 0.9 × 0.813 + 0.3 ≈ 1.032 at step 4.
      - id: neuromorphic-scientific-applications.calculate.3
        prompt: An integrate-and-fire neuron with no leak (β = 1) starts at 0, has threshold 1, and receives 0.3 each step. On which step does it first spike?
        answer: 4
        feedback: Without leak it simply adds up, 0.3, 0.6, 0.9, 1.2, so it crosses at step 4.
      - id: neuromorphic-scientific-applications.calculate.4
        prompt: A LIF neuron with β = 0.5 and threshold 1 receives 0.6 every step, resetting to 0 after each spike. How many spikes does it fire in the first 12 steps?
        answer: 4
        feedback: It fires at steps 3, 6, 9, and 12, since each cycle goes 0.6, 0.9, 1.05.
      - id: neuromorphic-scientific-applications.calculate.5
        prompt: A LIF neuron starts at v = 0 with β = 0.8, threshold 1, and a steady input of 0.25. On which step does it first spike?
        answer: 8
        feedback: The potential climbs 0.25, 0.45, 0.61, 0.738, 0.840, 0.922, 0.988, then about 1.040 at step 8. It only just makes it, because its ceiling is 0.25/(1 − 0.8) = 1.25.
