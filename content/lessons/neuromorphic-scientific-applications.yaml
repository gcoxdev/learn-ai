lesson:
  id: neuromorphic-scientific-applications
  version: 0.4.0-draft
  title: Match event-driven computation to a scientific workload
  state: draft
  summary: Some cameras report only what changes, and some chips compute only when a neuron fires. Simulate a spiking neuron by hand and learn when that saves energy and when it doesn't.
  slot: M34.5
  category: learning
  sources:
