schema_version: 0.2-draft
lesson:
  id: neuromorphic-scientific-applications
  version: 0.3.0-draft
  title: Match event-driven computation to a scientific workload
  state: draft
  summary: Ask when processing changes as events fits a sensing task.
  slot: M34.5
  category: learning
  sources:
  - title: Neuronal Dynamics — authors’ textbook
    url: https://neuronaldynamics.epfl.ch/online/
  - title: 'Event-based Vision: A Survey'
    url: https://arxiv.org/abs/1904.08405
objectives:
- id: objective.neuromorphic-scientific-applications
  version: 1-draft
  statement: Neuromorphic approaches use event-driven or biologically inspired computation for selected tasks;
    sensor encoding, hardware, learning method, and measured system energy determine their practical value.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - neuromorphic-scientific-applications.base
  - neuromorphic-scientific-applications.transfer
  prerequisites:
  - anyOf:
    - objective.neural-forward-pass
  - anyOf:
    - objective.dynamics-and-noise
  - anyOf:
    - objective.compute-and-bandwidth
scenes:
- id: neuromorphic-scientific-applications.s1
  title: Process changes as events
  type: explanation
  depth: intuition
  objective_refs:
  - objective.neuromorphic-scientific-applications
  markdown: 'An event camera reports local brightness changes rather than complete frames at a fixed rate.
    A spiking system can process temporally sparse events through stateful neurons. This can suit fast dynamic
    scenes, but event density and sensor noise determine the actual workload.


    A typical event records a pixel location, a timestamp, and whether brightness increased or decreased beyond
    a threshold. A stationary scene with steady lighting may create few events; a flickering light can create
    many. This makes workload depend on changes in the scene rather than simply on a fixed number of frames
    per second. A spike is a discrete signal event processed by the model.'
  text_mode: 'An event camera reports local brightness changes rather than complete frames at a fixed rate.
    A spiking system can process temporally sparse events through stateful neurons. This can suit fast dynamic
    scenes, but event density and sensor noise determine the actual workload.


    A typical event records a pixel location, a timestamp, and whether brightness increased or decreased beyond
    a threshold. A stationary scene with steady lighting may create few events; a flickering light can create
    many. This makes workload depend on changes in the scene rather than simply on a fixed number of frames
    per second. A spike is a discrete signal event processed by the model.'
  bridges: []
- id: neuromorphic-scientific-applications.s2
  title: Connect representation to the task
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neuromorphic-scientific-applications
  markdown: A scientific sensing system may need timing, motion, or low-power continuous monitoring. Converting
    ordinary frames into artificial spikes adds encoding choices and cost. Biological inspiration does not
    imply that a model reproduces biological learning or gains every benefit of a biological nervous system.
  text_mode: A scientific sensing system may need timing, motion, or low-power continuous monitoring. Converting
    ordinary frames into artificial spikes adds encoding choices and cost. Biological inspiration does not
    imply that a model reproduces biological learning or gains every benefit of a biological nervous system.
  bridges: []
- id: neuromorphic-scientific-applications.s3
  title: Compare the full energy boundary
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neuromorphic-scientific-applications
  markdown: Measure sensor, data conversion, communication, processor, and idle energy where relevant. A low-energy
    neuron operation can coexist with expensive memory movement. Compare equivalent accuracy, latency, and
    event rates against a suitable conventional implementation.
  text_mode: Measure sensor, data conversion, communication, processor, and idle energy where relevant. A low-energy
    neuron operation can coexist with expensive memory movement. Compare equivalent accuracy, latency, and
    event rates against a suitable conventional implementation.
  bridges: []
- id: neuromorphic-scientific-applications.s4
  title: Keep mechanisms inspectable
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neuromorphic-scientific-applications
  markdown: 'For an application study, identify how the model represents events, updates its state, and learns.
    A spiking neuron may accumulate input until it fires; learning may use local rules or gradients, depending
    on the design.


    Also identify where training and inference run. Simulating these mechanisms on an ordinary processor and
    deploying them on specialized neuromorphic hardware are different operating setups. An energy or latency
    claim must describe the setup actually measured.'
  text_mode: 'For an application study, identify how the model represents events, updates its state, and learns.
    A spiking neuron may accumulate input until it fires; learning may use local rules or gradients, depending
    on the design.


    Also identify where training and inference run. Simulating these mechanisms on an ordinary processor and
    deploying them on specialized neuromorphic hardware are different operating setups. An energy or latency
    claim must describe the setup actually measured.'
  bridges: []
- id: neuromorphic-scientific-applications.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.neuromorphic-scientific-applications
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Event-based sensing and computation fit some workloads well. Measure the whole system, including
    encoding, communication, hardware, and the actual event rate.
