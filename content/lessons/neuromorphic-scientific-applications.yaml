      url: https://neuronaldynamics.epfl.ch/online/
    - title: 'Event-based Vision: A Survey (Gallego et al., 2020)'
      url: https://arxiv.org/abs/1904.08405
    - title: A 128×128 120 dB 15 μs Latency Asynchronous Temporal Contrast Vision Sensor (Lichtsteiner, Posch & Delbruck, 2008)
      url: https://doi.org/10.1109/JSSC.2007.914337
    - title: "Loihi: A Neuromorphic Manycore Processor with On-Chip Learning (Davies et al., IEEE Micro 2018)"
      url: https://doi.org/10.1109/MM.2018.112130359
    - title: "Advancing Neuromorphic Computing With Loihi: A Survey of Results and Outlook (Davies et al., Proceedings of the IEEE 2021)"
      url: https://doi.org/10.1109/JPROC.2021.3067593
    - title: A million spiking-neuron integrated circuit with a scalable communication network and interface (Merolla et al., Science 2014)
      url: https://doi.org/10.1126/science.1254642
objectives:
  - id: objective.neuromorphic-scientific-applications
    version: 2-draft
    statement: Neuromorphic approaches use event-driven or biologically inspired computation for selected tasks; sensor encoding, hardware, learning method, and measured system energy determine their practical value.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - neuromorphic-scientific-applications.base.v2
      - neuromorphic-scientific-applications.transfer.v2
      - neuromorphic-scientific-applications.calculate
    prerequisites:
      - anyOf:
          - objective.neural-forward-pass
      - anyOf:
          - objective.dynamics-and-noise
      - anyOf:
          - objective.compute-and-bandwidth
scenes:
  - id: neuromorphic-scientific-applications.s1
    title: A camera that only reports change
    type: explanation
    depth: intuition
    objective_refs:
      - objective.neuromorphic-scientific-applications
    markdown: |-
      A biologist films a bee's wingbeat, hundreds of beats a second, against a still background of flowers. An ordinary camera at 1,000 frames per second sends every pixel of every frame, even though almost nothing but the wings moves. Most of that data says "same as before."

      An **event camera** works differently. Each pixel watches its own brightness and speaks only when it changes by more than a set amount. The output is a stream of **events**, each a tiny record:

      | Field | Example | Meaning |
      | --- | --- | --- |
      | $x, y$ | 212, 87 | which pixel |
      | $t$ | 1,204,331 μs | when, to about a microsecond |
      | polarity | + | brighter (+) or darker (−) |

      An influential early sensor of this kind, a 128×128-pixel design from Lichtsteiner, Posch, and Delbruck (2008), responded in about 15 microseconds. The still flowers produce almost no events and the wings produce a dense burst, so the data rate follows the motion, not a clock.

      That's the idea behind **neuromorphic** computing, hardware and models loosely inspired by the brain: do work only when something happens. The catch: point the same camera at a flickering fluorescent light or a shaking tree and it floods you with events. Workload depends on the scene.
    bridges: []
  - id: neuromorphic-scientific-applications.lif-neuron
    title: A neuron that leaks, fills, and fires
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neuromorphic-scientific-applications
    markdown: |-
      Event streams pair naturally with **spiking neurons**, which also communicate in brief all-or-nothing events called **spikes**. The workhorse model is the **leaky integrate-and-fire (LIF)** neuron. It keeps one number, its membrane potential $v$, and follows three rules each time step:

      1. **Leak:** keep a fraction $\beta$ of the old potential.
      2. **Integrate:** add the input current $I$.
      3. **Fire:** if $v$ reaches the threshold $\theta$, emit a spike and reset $v$ to 0.

      So $v_t = \beta\,v_{t-1} + I_t$. Take $\beta = 0.5$, $\theta = 1$, and a steady input of 0.6:

      | Step | Calculation | $v$ | Spike? |
      | ---: | --- | ---: | --- |
      | 1 | $0.5 \times 0 + 0.6$ | 0.6 | no |
      | 2 | $0.5 \times 0.6 + 0.6$ | 0.9 | no |
      | 3 | $0.5 \times 0.9 + 0.6$ | 1.05 | yes, reset to 0 |
      | 4 | $0.5 \times 0 + 0.6$ | 0.6 | no |

      The neuron fires every third step. A stronger input fires it sooner and more often, so the input's size is carried in spike *timing and rate*, as in module 37's lesson on spiking neurons.

      :::predict Lower the input to 0.4. When does the neuron first fire?
      Never. The potential climbs 0.4, 0.6, 0.7, 0.75… toward a ceiling where leak and input balance: $v = 0.5v + 0.4$, so $v = 0.8$. That's below the threshold of 1. A leaky neuron ignores weak, steady input, which is exactly why it responds to *changes* and bursts.
      :::

      ```python run
      beta = 0.5        # leak: fraction of the potential kept each step
      threshold = 1.0
      inputs = [0.6] * 12   # the same input current at every step

      v, spikes = 0.0, []
      for t, current in enumerate(inputs, start=1):
          v = beta * v + current            # leak, then integrate
          if v >= threshold:                # fire
              spikes.append(t)
              print(f"step {t:2d}: v = {v:.3f}  SPIKE -> reset to 0")
              v = 0.0
          else:
              print(f"step {t:2d}: v = {v:.3f}")

      print("spike steps:", spikes)
      print("steady level without firing =", round(inputs[0] / (1 - beta), 3))
      ```

      Try `inputs = [0.4] * 12`, then `beta = 0.9` with the same 0.4. With less leak, the ceiling rises to 4 and the neuron fires every third step again.

      :::papers The leaky integrate-and-fire equation
      In continuous time, usually credited to Lapicque (1907):

      $$\tau_m \frac{dv}{dt} = -(v - v_{\text{rest}}) + R\,I(t)$$

      $\tau_m$ is the membrane time constant, $v_{\text{rest}}$ the resting potential (our 0), and $R$ the membrane resistance. Stepping forward by $\Delta t$ gives our update with $\beta = e^{-\Delta t/\tau_m}$; $\beta = 0.5$ means $\Delta t \approx 0.69\,\tau_m$.
      :::
    diagram:
      caption: One leaky integrate-and-fire neuron. The dashed arrow is the reset after a spike.
      description: Input spikes are weighted and summed into an input current, which is added to the membrane potential. The potential also loops back to itself through the leak, keeping a fraction beta each step. The potential feeds a threshold check. If the potential reaches the threshold, the neuron emits an output spike, and a dashed reset arrow sets the potential back to zero.
      nodes:
        - id: inputs
          label: Incoming spikes × weights
          col: 0
          row: 1
          tone: data
        - id: potential
          label: Membrane potential v
          note: v = β·v + I
          col: 2
          row: 1
          tone: accent
        - id: leak
          label: Leak
          note: keep a fraction β
          col: 2
          row: 3
          tone: muted
        - id: check
          label: v ≥ θ ?
          col: 4
          row: 1
          tone: warn
        - id: spike
          label: Output spike
          col: 4
          row: 3
          tone: data
      edges:
        - from: inputs
          to: potential
          label: input current I
        - from: potential
          to: leak
          bend: 1
        - from: leak
          to: potential
          bend: 1
        - from: potential
          to: check
        - from: check
          to: spike
          label: "yes"
        - from: spike
          to: potential
          label: reset to 0
          dashed: true
    bridges: []
  - id: neuromorphic-scientific-applications.s3
    title: Count the work, then count the whole system
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neuromorphic-scientific-applications
    markdown: |-
      Where might energy be saved? Take a layer with 1,000 inputs and 100 neurons.

      - **Conventional network:** every input is multiplied by every weight on every frame: $1{,}000 \times 100 = 100{,}000$ multiply-adds.
      - **Spiking network:** only inputs that spike cause work, and each spike just adds its weight to 100 potentials. If 2% of inputs spike per step and the network runs 10 steps per frame: $1{,}000 \times 0.02 \times 10 \times 100 = 20{,}000$ additions.

      Five times fewer operations, and an addition is cheaper than a multiply. But you now need 10 time steps instead of one pass, and if activity rises to 10% the count is back to 100,000.

      **Neuromorphic chips** are built to exploit this sparsity. Intel's **Loihi** (Davies et al., 2018) packs 128 neuron cores, up to about 130,000 neurons and 130 million synapses, onto one chip. Neurons keep their state beside their weights, and cores exchange spikes as small messages only when they fire. IBM's TrueNorth (2014) held a million neurons.

      What happened when researchers measured? Intel's own 2021 survey of Loihi results (Davies et al.) reported that conventional feedforward deep networks showed "modest if any benefit," while networks using recurrence, precise spike timing, and sparsity achieved orders of magnitude lower latency and energy on certain computations.

      :::mixup "Spikes are cheap, so a spiking network always saves energy."
      Savings come from sparse activity and from avoiding memory traffic, not from spikes as such. Busy inputs, many time steps, and moving data on and off the chip can erase them. An energy figure for "one synaptic operation" leaves out the sensor, the data conversion, and the idle power of the board.
      :::
    bridges: []
  - id: neuromorphic-scientific-applications.s2
    title: Where spikes earn their keep
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neuromorphic-scientific-applications
    markdown: |-
      The strongest cases share three features: input arrives as sparse events, answers are needed with low latency, and power is scarce.

      | Workload | Why it fits |
      | --- | --- |
      | High-speed tracking with event cameras (drones, flying insects, lab experiments) | microsecond timing; still backgrounds cost almost nothing |
      | Always-on sensing at the edge, such as spotting a keyword or a vibration | long silence, rare events, battery power |
      | Brain-scale simulation in neuroscience | the model *is* spiking neurons |
      | Scientific instruments producing bursty data | work tracks events, not a fixed clock |

      A standard image classifier on a server, fed dense frames in big batches, is the opposite case: GPUs are built for that.

      Training is its own problem. A spike is a jump from 0 to 1, whose derivative is zero almost everywhere, so ordinary backpropagation gets no signal. Two common workarounds are to train a normal network and convert it to spikes, or to use a smooth stand-in derivative during the backward pass, called a surrogate gradient. Module 37's lesson on spike timing and surrogate gradients covers both.
    bridges: []
  - id: neuromorphic-scientific-applications.s4
    title: Read an energy claim like a referee
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neuromorphic-scientific-applications
    markdown: |-
      A paper headline says: "Our spiking network uses 100× less energy than a CNN for gesture recognition." Here's how a careful reader unpacks it.

      | Question | What the paper says | Verdict |
      | --- | --- | --- |
      | Measured or estimated? | Estimated: synaptic operations × 0.9 pJ each | not a measurement |
      | On what hardware? | Simulated on a GPU; the pJ figure comes from a chip datasheet | no chip was run |
      | Compared with what? | A 2015-era CNN on a desktop GPU, batch size 1 | weak baseline |
      | Same accuracy? | 92% vs 96% | not matched |
      | Whole system? | Sensor and data transfer excluded | incomplete |

      The fair experiment runs both models on real hardware at matched accuracy, against a modern, efficient baseline such as a small network on a low-power chip, and measures power at the board, sensor included. The spiking design might still win. Know which claim you're reading: an estimate from operation counts, a simulation, or a measurement on the device.
    bridges: []
  - id: neuromorphic-scientific-applications.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.neuromorphic-scientific-applications
    markdown: Step a leaky neuron to its first spike by hand, then judge event cameras, keyword spotters, and energy claims in new settings.
    takeaway: |-
      A leaky integrate-and-fire neuron leaks, adds its input, and fires when it crosses a threshold, so it responds to change and works only when events arrive. That saves energy when activity is sparse and the whole system is measured, not just the neuron.
  - id: neuromorphic-scientific-applications.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.neuromorphic-scientific-applications
    markdown: |-
      Event-based sensing and computation fit some workloads well. Measure the whole system, including encoding, communication, hardware, and the actual event rate.
