schema_version: 0.2-draft
lesson:
  id: first-order-logic
  version: 0.3.0-draft
  title: Talk about objects and relationships
  state: draft
  summary: Describe who is related to whom, then follow a family-tree rule one name at a time.
  slot: M04.2
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.first-order-logic
  version: 1-draft
  statement: Predicates, variables, quantifiers, and unification let logic express relationships among objects
    while making the scope of each statement explicit.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - first-order-logic.base
  - first-order-logic.transfer
  prerequisites:
  - anyOf:
    - objective.propositional-logic
scenes:
- id: first-order-logic.s1
  title: Name the objects and their relationship
  type: explanation
  depth: intuition
  objective_refs:
  - objective.first-order-logic
  markdown: 'Read Parent(Ada, Ben) as “Ada is a parent of Ben.” **Parent** is a predicate: a named relationship
    between objects. The parentheses contain the objects in order, so Parent(Ben, Ada) makes a different claim.


    A **domain** is the collection of objects we are discussing, such as people in a family record. Variables
    such as x and y stand for objects from that domain. First-order logic combines predicates, variables, functions,
    and words such as “every” or “some” to express patterns across those objects.'
  text_mode: 'Read Parent(Ada, Ben) as “Ada is a parent of Ben.” **Parent** is a predicate: a named relationship
    between objects. The parentheses contain the objects in order, so Parent(Ben, Ada) makes a different claim.


    A **domain** is the collection of objects we are discussing, such as people in a family record. Variables
    such as x and y stand for objects from that domain. First-order logic combines predicates, variables, functions,
    and words such as “every” or “some” to express patterns across those objects.'
  bridges: []
- id: first-order-logic.s2
  title: Quantifier order matters
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.first-order-logic
  markdown: “Every student reads some book” permits different students to read different books. “There is a
    book every student reads” requires one shared book. Universal quantification means for every object in
    the stated domain; existential quantification means at least one. The domain and scope of each variable
    are part of the claim.
  text_mode: “Every student reads some book” permits different students to read different books. “There is
    a book every student reads” requires one shared book. Universal quantification means for every object in
    the stated domain; existential quantification means at least one. The domain and scope of each variable
    are part of the claim.
  bridges:
  - discrete-math
- id: first-order-logic.s3
  title: Match the names in a rule
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.first-order-logic
  markdown: 'The rule Parent(x, y) AND Parent(y, z) implies Grandparent(x, z) describes two linked parent relationships.
    **Unification** finds substitutions that make the expressions match.


    Start with Parent(Ada, Ben): x becomes Ada and y becomes Ben. The next fact must therefore start with Ben.
    Parent(Ben, Cy) fits and sets z to Cy, giving Grandparent(Ada, Cy).


    Parent(Dan, Cy) would not complete this match because y already means Ben. Drawing Ada → Ben → Cy makes
    the shared middle person easy to see.'
  text_mode: 'The rule Parent(x, y) AND Parent(y, z) implies Grandparent(x, z) describes two linked parent
    relationships. **Unification** finds substitutions that make the expressions match.


    Start with Parent(Ada, Ben): x becomes Ada and y becomes Ben. The next fact must therefore start with Ben.
    Parent(Ben, Cy) fits and sets z to Cy, giving Grandparent(Ada, Cy).


    Parent(Dan, Cy) would not complete this match because y already means Ben. Drawing Ada → Ben → Cy makes
    the shared middle person easy to see.'
  bridges: []
- id: first-order-logic.s4
  title: Watch the representation boundary
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.first-order-logic
  markdown: If a predicate called Owns lacks a time argument, it may confuse past and present ownership. A
    name can refer to different objects unless identity rules are clear. Formal expressivity helps state relations
    precisely, but inference can become difficult and world knowledge still needs to be supplied or learned.
  text_mode: If a predicate called Owns lacks a time argument, it may confuse past and present ownership. A
    name can refer to different objects unless identity rules are clear. Formal expressivity helps state relations
    precisely, but inference can become difficult and world knowledge still needs to be supplied or learned.
  bridges: []
- id: first-order-logic.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.first-order-logic
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Logic can describe named objects and relationships. Keep track of the order of the objects, the
    scope of “every” and “some,” and the names substituted into a rule.
- id: first-order-logic.recap
  title: One idea to take with you
  type: recap
