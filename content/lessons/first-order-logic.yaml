schema_version: 0.2-draft
lesson:
  id: first-order-logic
  version: 0.4.0-draft
  title: Talk about objects and relationships
  state: draft
  summary: Teaching a computer "a parent's parent is a grandparent" takes 216 rules in plain true/false logic. With variables it takes one. See how, and watch a family tree answer questions.
  slot: M04.2
  category: learning
  sources:
    - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
      url: https://aima.cs.berkeley.edu/
objectives:
  - id: objective.first-order-logic
    version: 2-draft
    statement: Predicates, variables, quantifiers, and unification let logic express relationships among objects while making the scope of each statement explicit.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - first-order-logic.base.v2
      - first-order-logic.transfer.v2
      - first-order-logic.calc
    prerequisites:
      - anyOf:
          - objective.propositional-logic
scenes:
  - id: first-order-logic.s1
    title: One rule instead of 216
    type: explanation
    depth: intuition
    objective_refs:
      - objective.first-order-logic
    markdown: |-
      Here's a small family. Rosa has two children, Ben and Cleo. Ben has a son, Dev. Cleo has two daughters, Eli and Fay.

      Now teach a computer that "a parent's parent is a grandparent" using the true/false letters from the last lesson. Every fact needs its own letter, and the rule needs a separate copy for every trio of people: "if Rosa is Ben's parent and Ben is Dev's parent, Rosa is Dev's grandparent," and so on. Six people make $6 \times 6 \times 6 = 216$ copies.

      **First-order logic** fixes this by talking about objects and their relationships directly:

      | Piece | What it is | Example |
      | --- | --- | --- |
      | **Constant** | A name for one specific object | Rosa, Ben |
      | **Predicate** | A relationship that is true or false of objects | Parent(Rosa, Ben): "Rosa is a parent of Ben" |
      | **Variable** | A placeholder for any object | x, y, z |
      | **Domain** | The collection of objects variables range over | the six family members |

      Argument order matters: Parent(Ben, Rosa) is a different claim, and here a false one. With variables, the 216 rules shrink to one:

      $$\forall x\,\forall y\,\forall z\;\big(\text{Parent}(x, y) \land \text{Parent}(y, z) \to \text{Grandparent}(x, z)\big)$$

      Read $\forall x$ as "for every x." The whole line says: for any three people, if the first is a parent of the second and the second a parent of the third, the first is a grandparent of the third.
    diagram:
      caption: The running family tree. Each arrow is one Parent fact.
      description: Rosa is at the top with arrows to her two children, Ben and Cleo. Ben has an arrow to his son Dev. Cleo has arrows to her daughters Eli and Fay. Each arrow stands for a fact Parent(parent, child).
      nodes:
        - id: rosa
          label: Rosa
          col: 2
          row: 0
          tone: accent
        - id: ben
          label: Ben
          col: 1
          row: 1
        - id: cleo
          label: Cleo
          col: 3
          row: 1
        - id: dev
          label: Dev
          col: 1
          row: 2
          tone: data
        - id: eli
          label: Eli
          col: 3
          row: 2
          tone: data
        - id: fay
          label: Fay
          col: 4
          row: 2
          tone: data
      edges:
        - from: rosa
          to: ben
          label: parent of
        - from: rosa
          to: cleo
          label: parent of
        - from: ben
          to: dev
        - from: cleo
          to: eli
        - from: cleo
          to: fay
    bridges: []
  - id: first-order-logic.s2
    title: '"Every" and "some," and the order they come in'
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.first-order-logic
    markdown: |-
      Two symbols let you talk about many objects at once. A **quantifier** says how many objects a statement covers: $\forall x$ ("for every x") and $\exists y$ ("there exists a y," meaning at least one).

      The three grandchildren pick favorite desserts: Dev likes pie, Eli likes cake, and Fay likes pie. Compare two sentences that use the same words in a different order:

      | Formula | In words | True here? |
      | --- | --- | --- |
      | $\forall x\,\exists y\;\text{Likes}(x, y)$ | Every grandchild likes some dessert | Yes: each has one |
      | $\exists y\,\forall x\;\text{Likes}(x, y)$ | Some dessert is liked by every grandchild | No: pie misses Eli, cake misses Dev and Fay |

      :::predict Which single new fact would make the second sentence true?
      Likes(Eli, pie). Then pie is liked by all three grandchildren, so one dessert works for everyone. Adding Likes(Dev, cake) wouldn't be enough, because Fay still doesn't like cake.
      :::

      The domain is part of the claim, too. Here $x$ ranges over the three grandchildren and $y$ over desserts. If one domain held every person and every dessert, you'd spell both out: $\forall x\,\big(\text{Grandchild}(x) \to \exists y\,(\text{Dessert}(y) \land \text{Likes}(x, y))\big)$. That keeps Rosa and her children out of the claim.

      :::mixup "'Everyone has a mother' and 'someone is everyone's mother' say the same thing."
      Same words, different order, very different claims. $\forall x\,\exists m\,\text{Mother}(m, x)$ lets each person have their own mother. $\exists m\,\forall x\,\text{Mother}(m, x)$ needs one woman who is the mother of everybody. When "every" comes first, the "some" can change from object to object.
      :::
    bridges:
      - discrete-math
  - id: first-order-logic.s3
    title: Unification, one substitution at a time
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.first-order-logic
    markdown: |-
      Ask the family tree: "Who are Rosa's grandchildren?" That's the query Grandparent(Rosa, w). To use the rule, the computer must make expressions match by choosing values for variables. **Unification** is that step: finding a substitution (a list like "x = Rosa, y = Ben") that makes two expressions identical.

      | Step | Goal to match | Matches | Substitution so far |
      | --- | --- | --- | --- |
      | 1 | Grandparent(Rosa, w) | rule's Grandparent(x, z) | x = Rosa, z = w |
      | 2 | Parent(Rosa, y) | Parent(Rosa, Ben) | + y = Ben |
      | 3 | Parent(Ben, w) | Parent(Ben, Dev) | + w = Dev: **answer Dev** |
      | 4 | back up to step 2 | Parent(Rosa, Cleo) | y = Cleo instead |
      | 5 | Parent(Cleo, w) | Parent(Cleo, Eli), then Parent(Cleo, Fay) | **answers Eli, Fay** |

      Two rules keep it honest. A constant only matches itself, so Parent(Ben, w) can't match Parent(Cleo, Eli). And a variable keeps its value everywhere it appears: once y = Ben, the second condition must start with Ben.

      ```python run
      parent = [("Rosa", "Ben"), ("Rosa", "Cleo"), ("Ben", "Dev"),
                ("Cleo", "Eli"), ("Cleo", "Fay")]

      # Rule: Parent(x, y) and Parent(y, z)  ->  Grandparent(x, z)
      found = []
      for x, y in parent:            # first condition binds x and y
          for y2, z in parent:       # second condition must start with the same y
              if y2 == y:
                  print(f"x={x}, y={y}, z={z}  ->  Grandparent({x}, {z})")
                  found.append((x, z))
      print(len(found), "grandparent facts")
      ```

      Add `("Dev", "Gus")` to the list and rerun: one new fact appears, Grandparent(Ben, Gus). Then remove Gus again and change `if y2 == y:` to `if True:`. You get 25 "grandparent facts," one for every pair of Parent facts, because nothing forces the shared y to match.

      :::story Programming in logic, 1972
      Alain Colmerauer and Philippe Roussel in Marseille built **Prolog** ("programming in logic") around exactly this loop: unify, and back up to try the next fact. The whole family tree is a Prolog program:

      ```prolog
      parent(rosa, ben).   parent(rosa, cleo).   parent(ben, dev).
      parent(cleo, eli).   parent(cleo, fay).
      grandparent(X, Z) :- parent(X, Y), parent(Y, Z).

      ?- grandparent(rosa, W).    % W = dev ; W = eli ; W = fay
      ```

      Capitalized words are variables, and `:-` reads "if." Unification itself comes from J. A. Robinson's 1965 paper on automated proof.
      :::
    bridges: []
  - id: first-order-logic.s4
    title: What your predicates leave out
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.first-order-logic
    markdown: |-
      Logic can only reason about what your predicates say. Two common gaps:

      - **Time.** LivesIn(Ben, Lisbon) has no date. If Ben moved in 2024, the knowledge base now holds a stale fact that looks exactly like a current one. LivesIn(Ben, Lisbon, 2019) makes the time explicit.
      - **Identity.** If two cousins are both entered as the constant Ben, every rule treats them as one person, and one Ben's children get credited to the other. Give each real object its own constant, such as Ben1 and Ben2.

      Choosing the predicates, their arguments, and what each constant names is called the **representation**. Get it right and one rule does the work of hundreds. Get it wrong and the reasoning is flawless and the answers are still off.
    bridges: []
  - id: first-order-logic.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.first-order-logic
    markdown: School timetables, streaming promises, and a few family trees to count test whether you can match variables and keep quantifiers in order.
    takeaway: |-
      First-order logic states one rule for many objects using predicates, variables, and quantifiers. Unification fills in the variables consistently, and swapping "every" and "some" changes what a sentence claims.
  - id: first-order-logic.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.first-order-logic
    markdown: |-
      Logic can describe named objects and relationships. Keep track of the order of the objects, the scope of “every” and “some,” and the names substituted into a rule.
