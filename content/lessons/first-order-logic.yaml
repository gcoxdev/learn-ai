assessment_families:
  - id: first-order-logic.base
    objective_ref: objective.first-order-logic
    task: base
    response_type: single_choice
    points: 1
    hint: 'Quantifier order matters: trace the inputs, operation, and result before choosing.'
    remediation_scene: first-order-logic.s2
    variants:
      - id: first-order-logic.base.1
        prompt: What does an existential quantifier claim?
        options:
          - id: c
            text: No object can satisfy it
          - id: a
            text: At least one object in the domain satisfies the condition
          - id: b
            text: Every object satisfies it
        answer: a
        feedback: Existence is weaker than universal satisfaction.
        retired: true
      - id: first-order-logic.base.2
        prompt: Parent(A, B) and Parent(B, C) fit the grandparent rule. What follows?
        options:
          - id: a
            text: Grandparent(A, C)
          - id: b
            text: Parent(C, A)
          - id: c
            text: Grandparent(B, A)
        answer: a
        feedback: The intermediate object B matches the shared variable.
        retired: true
  - id: first-order-logic.transfer
    objective_ref: objective.first-order-logic
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Watch the representation boundary: trace the inputs, operation, and result before choosing.'
    remediation_scene: first-order-logic.s4
    variants:
      - id: first-order-logic.transfer.1
        prompt: Does “everyone chose some tool” imply one tool was chosen by everyone?
        options:
          - id: a
            text: No; quantifier order changes the claim
          - id: b
            text: Yes; some always means the same one
          - id: c
            text: Only when tools have names
        answer: a
        feedback: Each person may choose a different tool.
        retired: true
      - id: first-order-logic.transfer.2
        prompt: A rule repeats variable x in two places. Can unification assign unrelated objects to those occurrences?
        options:
          - id: b
            text: Yes; each occurrence is independent
          - id: c
            text: Only if the rule is long
          - id: a
            text: No; the substitution must be consistent
        answer: a
        feedback: Repeated occurrences of a variable refer to the same substituted object.
        retired: true
  - id: first-order-logic.base.v2
    objective_ref: objective.first-order-logic
    task: base
    response_type: single_choice
    points: 1
    hint: Write out the substitution as you go (x = …, y = …). A variable keeps one value everywhere it appears, and a constant only matches itself.
    remediation_scene: first-order-logic.s3
    variants:
      - id: first-order-logic.base.v2.1
        prompt: 'Rule: Parent(x, y) ∧ Parent(y, z) → Grandparent(x, z). Facts: Parent(Ana, Bo), Parent(Bo, Cy), Parent(Di, Ed). Which conclusion does the rule support?'
        options:
          - id: b
            text: Grandparent(Ana, Ed)
          - id: a
            text: Grandparent(Ana, Cy)
          - id: c
            text: Grandparent(Cy, Ana)
        answer: a
        feedback: With x = Ana and y = Bo, the second condition needs Parent(Bo, z), which gives z = Cy. Ana–Ed ignores the shared y, and Cy–Ana puts the arguments in the wrong order.
      - id: first-order-logic.base.v2.2
        prompt: While matching the grandparent rule, y has been set to Bo. Which fact can match the second condition, Parent(y, z)?
        options:
          - id: c
            text: Parent(Cy, Bo)
          - id: b
            text: Parent(Di, Cy)
          - id: a
            text: Parent(Bo, Cy)
        answer: a
        feedback: With y = Bo, the condition reads Parent(Bo, z), so the fact must have Bo first. Parent(Di, Cy) starts with the wrong person, and Parent(Cy, Bo) has Bo in the second position.
      - id: first-order-logic.base.v2.3
        prompt: In a class, each student has a lunch buddy, but no single student is everybody's buddy. Which formula is true of this class?
        options:
          - id: a
            text: ∀x ∃y Buddy(x, y)
          - id: b
            text: ∃y ∀x Buddy(x, y)
          - id: c
            text: ∀x ∀y Buddy(x, y)
        answer: a
        feedback: '"For every student there is a buddy" lets each student have their own. Putting ∃y first would require one buddy shared by the whole class, which the scenario rules out.'
      - id: first-order-logic.base.v2.4
        prompt: What substitution unifies Likes(x, Pie) with Likes(Dev, y)?
        options:
          - id: b
            text: x = Pie and y = Dev
          - id: a
            text: x = Dev and y = Pie
          - id: c
            text: None, since the constants sit in different places
        answer: a
        feedback: Match position by position. The first arguments give x = Dev, and the second give y = Pie. Constants in different positions are fine as long as a variable sits opposite each one.
      - id: first-order-logic.base.v2.5
        prompt: The knowledge base contains Parent(Rosa, Ben). What does Parent(Ben, Rosa) claim?
        options:
          - id: c
            text: The same fact, since it names the same two people
          - id: b
            text: That Rosa and Ben are each other's parents
          - id: a
            text: That Ben is a parent of Rosa, a different claim
        answer: a
        feedback: Argument order carries meaning, so swapping the arguments makes a different claim. It doesn't combine with the original into a two-way relationship either.
  - id: first-order-logic.transfer.v2
    objective_ref: objective.first-order-logic
    task: transfer
    response_type: single_choice
    points: 1
    hint: Check which quantifier comes first, which variables are shared between conditions, and whether each constant names exactly one real thing.
    remediation_scene: first-order-logic.s4
    variants:
      - id: first-order-logic.transfer.v2.1
        prompt: A streaming service promises "every user will find some show they love." A critic reads it as "there's one show every user loves." What is the critic's mistake?
        options:
          - id: b
            text: Reading "some show" as exactly one show instead of at least one
          - id: a
            text: Swapping the order of "every" and "some," which changes the claim
          - id: c
            text: Treating "user" as a constant rather than as a variable
        answer: a
        feedback: The promise is ∀u ∃s Loves(u, s), which lets each user have a different show. The critic read ∃s ∀u Loves(u, s). The "exactly one" issue is a different mistake that doesn't appear here.
      - id: first-order-logic.transfer.v2.2
        prompt: 'Rule: Teaches(t, s) ∧ Enrolled(p, s) → Knows(p, t). Facts: Teaches(Kim, Math), Enrolled(Lee, Math), Enrolled(Max, Art). Which conclusion follows?'
        options:
          - id: c
            text: Knows(Kim, Lee)
          - id: a
            text: Knows(Lee, Kim)
          - id: b
            text: Knows(Max, Kim)
        answer: a
        feedback: The shared variable s must be Math in both conditions, so p = Lee and t = Kim give Knows(Lee, Kim). Max is enrolled in Art, which doesn't match, and Knows(Kim, Lee) reverses the arguments.
      - id: first-order-logic.transfer.v2.3
        prompt: A database records Owns(Priya, Car42). Priya sold the car last year, and queries still say she owns it. Which change to the representation fixes this?
        options:
          - id: a
            text: Add a time argument, such as Owns(Priya, Car42, 2023)
          - id: b
            text: Replace Car42 with a variable so it matches any car
          - id: c
            text: Add the rule ∀x ∃y Owns(x, y) to cover every owner
        answer: a
        feedback: The predicate has no way to say when ownership held, so an old fact looks current. A variable would make the claim vaguer, and a quantified rule adds a claim instead of dating the existing one.
      - id: first-order-logic.transfer.v2.4
        prompt: Two different employees named Sam are both entered as the constant Sam. A rule then concludes that Sam manages Sam's own manager. What went wrong?
        options:
          - id: c
            text: The rule's quantifiers were written in the wrong order
          - id: b
            text: The rule needs extra variables to keep the two apart
          - id: a
            text: One constant was used to name two different people
        answer: a
        feedback: A constant names exactly one object, so the rules correctly treat "Sam" as one person, and the strange result follows. Separate constants such as Sam1 and Sam2 fix it; changing the rule doesn't.
      - id: first-order-logic.transfer.v2.5
        prompt: A travel site claims "some flight to Oslo is cheap on every date." Which reading matches that wording?
        options:
          - id: b
            text: On each date, at least one flight is cheap
          - id: a
            text: One particular flight is cheap on all the dates
          - id: c
            text: Each flight is cheap on at least one date
        answer: a
        feedback: '"Some flight" comes first: ∃f ∀d Cheap(f, d), one flight that works for every date. "On each date, at least one flight" is the weaker ∀d ∃f reading, where the cheap flight can change from date to date.'
  - id: first-order-logic.calc
    objective_ref: objective.first-order-logic
    task: base
    response_type: numeric
    points: 1
    hint: Draw the facts as arrows. Each Grandparent fact is a path of exactly two arrows, where the middle person is the child in one fact and the parent in the next.
    remediation_scene: first-order-logic.s3
    absolute_tolerance: 0.01
    variants:
      - id: first-order-logic.calc.1
        prompt: 'Facts: Parent(A, B), Parent(B, C), Parent(B, D), Parent(C, E). How many different Grandparent facts does the rule Parent(x, y) ∧ Parent(y, z) → Grandparent(x, z) derive?'
        answer: 3
        feedback: 'Two-step paths: A→B→C, A→B→D, and B→C→E. That gives Grandparent(A, C), Grandparent(A, D), and Grandparent(B, E).'
      - id: first-order-logic.calc.2
        prompt: 'Facts: Parent(A, B), Parent(C, D), Parent(B, E), Parent(D, F). How many different Grandparent facts does the rule Parent(x, y) ∧ Parent(y, z) → Grandparent(x, z) derive?'
        answer: 2
        feedback: 'The shared middle person links A→B→E and C→D→F, giving Grandparent(A, E) and Grandparent(C, F). No other pair of facts shares a middle person.'
      - id: first-order-logic.calc.3
        prompt: 'Facts: Parent(A, B), Parent(B, C), Parent(C, D), Parent(D, E), Parent(E, F). How many different Grandparent facts does the rule Parent(x, y) ∧ Parent(y, z) → Grandparent(x, z) derive?'
        answer: 4
        feedback: 'A chain of five arrows has four two-step paths: A→C, B→D, C→E, and D→F.'
      - id: first-order-logic.calc.4
        prompt: 'Facts: Parent(A, B), Parent(A, C), Parent(B, D), Parent(B, E), Parent(C, F), Parent(C, G). How many different Grandparent facts does the rule Parent(x, y) ∧ Parent(y, z) → Grandparent(x, z) derive?'
        answer: 4
        feedback: 'A is the grandparent of D and E (through B) and of F and G (through C): 4 facts. B and C have no grandchildren here.'
      - id: first-order-logic.calc.5
        prompt: 'Facts: Parent(A, B), Parent(C, B), Parent(B, D). How many different Grandparent facts does the rule Parent(x, y) ∧ Parent(y, z) → Grandparent(x, z) derive?'
        answer: 2
        feedback: 'B has two parents, A and C, and one child, D. Both paths go through B: Grandparent(A, D) and Grandparent(C, D).'
