schema_version: 0.2-draft
lesson:
  id: first-order-logic
  version: 0.1.0-draft
  title: Talk about objects and relationships
  state: draft
  summary: Predicates, variables, quantifiers, and unification let logic express relationships among objects while
    making the scope of each statement explicit.
  slot: M04.2
  category: learning
  minutes: 12
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.first-order-logic
  version: 1-draft
  statement: Predicates, variables, quantifiers, and unification let logic express relationships among objects while
    making the scope of each statement explicit.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - first-order-logic.base
  - first-order-logic.transfer
  prerequisites:
  - anyOf:
    - objective.propositional-logic
scenes:
- id: first-order-logic.s1
  title: Move beyond one letter per fact
  type: explanation
  depth: intuition
  objective_refs:
  - objective.first-order-logic
  markdown: A predicate such as Parent(Ada, Ben) expresses a relationship between named objects. A variable stands
    for an object that can be substituted. First-order logic uses predicates, functions, variables, and quantifiers
    to state patterns across a domain instead of listing an unrelated proposition for every fact.
  text_mode: A predicate such as Parent(Ada, Ben) expresses a relationship between named objects. A variable stands
    for an object that can be substituted. First-order logic uses predicates, functions, variables, and quantifiers
    to state patterns across a domain instead of listing an unrelated proposition for every fact.
  bridges: []
- id: first-order-logic.s2
  title: Quantifier order matters
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.first-order-logic
  markdown: “Every student reads some book” permits different students to read different books. “There is a book
    every student reads” requires one shared book. Universal quantification means for every object in the stated
    domain; existential quantification means at least one. The domain and scope of each variable are part of the
    claim.
  text_mode: “Every student reads some book” permits different students to read different books. “There is a book
    every student reads” requires one shared book. Universal quantification means for every object in the stated
    domain; existential quantification means at least one. The domain and scope of each variable are part of the
    claim.
  bridges:
  - discrete-math
- id: first-order-logic.s3
  title: Match a rule with a substitution
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.first-order-logic
  markdown: A rule says Parent(x, y) and Parent(y, z) imply Grandparent(x, z). Facts Parent(Ada, Ben) and Parent(Ben,
    Cy) fit with x = Ada, y = Ben, z = Cy. Unification finds substitutions that make expressions match, preserving
    repeated-variable consistency.
  text_mode: A rule says Parent(x, y) and Parent(y, z) imply Grandparent(x, z). Facts Parent(Ada, Ben) and Parent(Ben,
    Cy) fit with x = Ada, y = Ben, z = Cy. Unification finds substitutions that make expressions match, preserving
    repeated-variable consistency.
  bridges: []
- id: first-order-logic.s4
  title: Watch the representation boundary
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.first-order-logic
  markdown: If a predicate called Owns lacks a time argument, it may confuse past and present ownership. A name
    can refer to different objects unless identity rules are clear. Formal expressivity helps state relations precisely,
    but inference can become difficult and world knowledge still needs to be supplied or learned.
  text_mode: If a predicate called Owns lacks a time argument, it may confuse past and present ownership. A name
    can refer to different objects unless identity rules are clear. Formal expressivity helps state relations precisely,
    but inference can become difficult and world knowledge still needs to be supplied or learned.
  bridges: []
- id: first-order-logic.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.first-order-logic
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: first-order-logic.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.first-order-logic
  markdown: Predicates, variables, quantifiers, and unification let logic express relationships among objects while
    making the scope of each statement explicit.
  text_mode: Predicates, variables, quantifiers, and unification let logic express relationships among objects while
    making the scope of each statement explicit.
navigation:
  routes:
  - id: route.core
    scene_sequence:
