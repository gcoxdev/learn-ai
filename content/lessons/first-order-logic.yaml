assessment_families:
- id: first-order-logic.base
  objective_ref: objective.first-order-logic
  task: base
  response_type: single_choice
  points: 1
  hint: 'Quantifier order matters: trace the inputs, operation, and result before choosing.'
  remediation_scene: first-order-logic.s2
  variants:
  - id: first-order-logic.base.1
    prompt: What does an existential quantifier claim?
    options:
    - id: c
      text: No object can satisfy it
    - id: a
      text: At least one object in the domain satisfies the condition
    - id: b
      text: Every object satisfies it
    answer: a
    feedback: Existence is weaker than universal satisfaction.
  - id: first-order-logic.base.2
    prompt: Parent(A, B) and Parent(B, C) fit the grandparent rule. What follows?
    options:
    - id: a
      text: Grandparent(A, C)
    - id: b
      text: Parent(C, A)
    - id: c
      text: Grandparent(B, A)
    answer: a
    feedback: The intermediate object B matches the shared variable.
- id: first-order-logic.transfer
  objective_ref: objective.first-order-logic
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Watch the representation boundary: trace the inputs, operation, and result before choosing.'
  remediation_scene: first-order-logic.s4
  variants:
  - id: first-order-logic.transfer.1
    prompt: Does “everyone chose some tool” imply one tool was chosen by everyone?
    options:
    - id: a
      text: No; quantifier order changes the claim
    - id: b
      text: Yes; some always means the same one
    - id: c
      text: Only when tools have names
    answer: a
    feedback: Each person may choose a different tool.
  - id: first-order-logic.transfer.2
    prompt: A rule repeats variable x in two places. Can unification assign unrelated objects to those occurrences?
    options:
    - id: b
      text: Yes; each occurrence is independent
    - id: c
      text: Only if the rule is long
    - id: a
      text: No; the substitution must be consistent
    answer: a
    feedback: Repeated occurrences of a variable refer to the same substituted object.
