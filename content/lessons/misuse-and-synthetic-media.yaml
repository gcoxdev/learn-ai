  version: 0.1.0-draft
  title: "Misuse in practice: jailbreaks, deepfakes, and provenance"
  state: draft
  summary: A finance worker joined a video call with his CFO and colleagues, then sent $25 million. None of them were real. See how AI misuse works, and how to check what you see and hear.
