objectives:
  - id: objective.misuse-and-synthetic-media
    version: 1-draft
    statement: Misuse of generative AI works through jailbreaks, impersonation, and synthetic media. Detectors, content credentials, and watermarks help but can be evaded or stripped, so disclosure rules and verification through independent channels carry much of the protection.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - misuse-and-synthetic-media.base
      - misuse-and-synthetic-media.transfer
    prerequisites:
      - anyOf:
          - objective.application-security-boundaries
      - anyOf:
          - objective.alignment-and-oversight
scenes:
  - id: misuse-and-synthetic-media.s1
    title: Twenty-five million dollars, and nobody on the call was real
    type: explanation
    depth: intuition
    objective_refs:
      - objective.misuse-and-synthetic-media
    markdown: |-
      :::story The Arup video call, 2024
      In January 2024, a finance employee in the Hong Kong office of Arup, the British engineering firm, got a message from the company's UK-based chief financial officer about a confidential transaction. He was suspicious until he joined a video call and saw the CFO and several colleagues he recognized. On their instructions he made transfers totalling HK\$200 million, about US\$25 million. Every other person on the call was an AI-generated fake. Arup confirmed in May that it was the victim.
      :::

      A **deepfake** is synthetic audio, video, or imagery that realistically imitates a real person. Most AI-generated media is harmless (film effects, dubbing, accessibility voices), but misuse follows a few recurring patterns:

      | Pattern | Example |
      | --- | --- |
      | Impersonation fraud | Fake executives, fake relatives in distress |
      | Election deception | Fake audio or robocalls of candidates |
      | Non-consensual intimate imagery | Sexual images of real people made without consent |
      | Getting models to help with harm | Jailbreaks that pull out dangerous instructions |
    bridges: []
  - id: misuse-and-synthetic-media.s2
    title: How jailbreaks work, in principle
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.misuse-and-synthetic-media
    markdown: |-
      As the lesson on application security boundaries showed, a **jailbreak** is a user talking a model out of its own safety training. Alexander Wei, Nika Haghtalab, and Jacob Steinhardt (2023) traced most jailbreaks to two failure modes:

      - **Competing objectives.** The model was trained both to be helpful and to refuse harm. Framing such as role-play in which refusing would "break character" makes helpfulness win.
      - **Mismatched generalization.** Safety training covered fewer kinds of input than pretraining did. A request in an encoding, a cipher, or a language with little safety data can slip past refusals the model would give in plain English; Yong and colleagues (2023) showed this with low-resource languages.

      Two more patterns exploit scale. **Many-shot jailbreaking** (Anthropic, 2024) became possible once context windows grew long: it fills the context with hundreds of fake dialogues in which an assistant complies, and success rises with their number. Automated attacks (Zou et al., 2023) search for odd character strings that do the same job, much as adversarial examples are found for images. Defenders train on known attacks and screen inputs and outputs with classifiers; attackers adapt.

      :::mixup "If models were jailbreak-proof, AI misuse would stop."
      The Arup call needed no jailbreak: face-swapping and voice-cloning tools did what they were built to do. Refusals matter for dangerous knowledge, but impersonation is fought mostly outside the model.
      :::
    bridges: []
  - id: misuse-and-synthetic-media.s3
    title: Three seconds of your voice
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.misuse-and-synthetic-media
    markdown: |-
      In January 2023, Microsoft researchers described VALL-E, a speech model that could imitate a speaker from a three-second recording. By March the US Federal Trade Commission was warning about "family emergency" scams using relatives' cloned voices. That June, Jennifer DeStefano told a US Senate hearing how a voice exactly like her teenage daughter's sobbed down the phone while a man demanded ransom. Her daughter was safe on a ski trip.

      Public figures, with hours of speech online, are easier still:

      - **Slovakia, September 2023.** Two days before a national election, during the legal pre-election silence period, an audio clip spread in which a party leader appeared to discuss rigging the vote. He denied it and fact-checkers found signs of AI manipulation, but the timing left little room for either to be heard.
      - **New Hampshire, January 2024.** Robocalls in a voice imitating President Biden told Democrats not to vote in the state's primary. The US Federal Communications Commission then ruled that AI-generated voices count as "artificial" under robocall law, and later fined the political consultant behind the calls \$6 million.

      These scams share a shape: a trusted voice, an emergency, secrecy, and a demand to act *now*.
    bridges: []
  - id: misuse-and-synthetic-media.s4
    title: Why detection is an arms race
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.misuse-and-synthetic-media
    markdown: |-
      Couldn't a detector spot the fakes? Detectors learn the traces left by the generators they trained on; new generators leave different traces, and compression and re-recording blur the old ones.

      :::story Two detection results
      In the 2020 Deepfake Detection Challenge, run by Facebook with partners, the winning model scored about 82% accuracy on the public test set but about 65% on a hidden set of new videos. In January 2023 OpenAI released a classifier for AI-written text that caught 26% of AI-written text and wrongly flagged 9% of human text; OpenAI withdrew it that July for low accuracy.
      :::

      Even a good detector struggles when fakes are rare, because of the base rate you met in the fairness lesson.

      :::predict A detector flags 95% of deepfake videos and 5% of real ones. On a platform where 1 in 100 videos is a deepfake, what share of flagged videos are actually fake?
      Out of 10,000 videos, 100 are fake and 95 get flagged. Of the 9,900 real ones, 5%, or 495, get flagged too. So 95 of 590 flagged videos are fake: about 16%. A flag should prompt a check, not a verdict.
      :::

      Another layer flips the question: instead of proving something fake, prove where it came from.
    bridges: []
  - id: misuse-and-synthetic-media.s5
    title: Content credentials and watermarks
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.misuse-and-synthetic-media
    markdown: |-
      **Provenance** means a verifiable record of where content came from. Two tools dominate: **Content Credentials**, the standard of the C2PA coalition founded in 2021 by Adobe, Arm, BBC, Intel, Microsoft, and Truepic, and **watermarks** such as Google DeepMind's SynthID.

      | | Content Credentials | Watermarks |
      | --- | --- | --- |
      | What it is | A signed record attached to a file: which device or tool made it, and what edits followed | A hidden signal woven into the content itself |
      | Strength | A valid signature shows who signed and that the file hasn't changed since | Survives some cropping and compression |
      | Weakness | A screenshot or re-upload drops it | Heavy editing weakens it; only cooperating providers add one |

      A missing credential means little, since most genuine photos have none, and a valid one shows who signed, not that the scene was true.

      Text watermarks work statistically. In the scheme of Kirchenbauer et al. (2023), the previous token secretly splits the vocabulary into a "green" list (a fraction $\gamma$) and a "red" list, and the generator nudges its choices toward green. A detector that knows the secret counts green tokens. Run it, and watch paraphrasing erase the signal:

      ```python run
      import numpy as np

      rng = np.random.default_rng(7)
      gamma, T = 0.25, 200          # share of the vocabulary on the green list; tokens checked

      def z_score(green, T, gamma):
          """How many standard deviations above chance the green count is."""
          return (green - gamma * T) / np.sqrt(T * gamma * (1 - gamma))

      human = rng.random(T) < gamma          # ordinary text: each token green by chance
      marked = rng.random(T) < 0.55          # watermarked: generator nudged toward green tokens
      print(f"human text:       {human.sum():3d} green, z = {z_score(human.sum(), T, gamma):5.1f}")
      print(f"watermarked text: {marked.sum():3d} green, z = {z_score(marked.sum(), T, gamma):5.1f}")

      # A paraphrase replaces some tokens with fresh ones that are green only by chance.
      for share in [0.25, 0.50, 0.75]:
          text = marked.copy()
          swap = rng.random(T) < share
          text[swap] = rng.random(swap.sum()) < gamma
          z = z_score(text.sum(), T, gamma)
          print(f"paraphrase {share:.0%}:   {text.sum():3d} green, z = {z:5.1f}  "
                f"{'detected' if z > 4 else 'missed'} (threshold z > 4)")
      ```

      :::papers The detection test (Kirchenbauer et al., 2023)
      With $T$ tokens, of which $|s|_G$ are green, the detector computes
      $$z = \frac{|s|_G - \gamma T}{\sqrt{T\,\gamma(1-\gamma)}}.$$
      Human text has about $\gamma T = 50$ green tokens of 200, so $z \approx 0$. The watermarked text's 106 gives $z = 56/6.12 = 9.1$. After a 75% paraphrase, 62 green gives $z = 2.0$, below the threshold of 4. Google's SynthID-Text (Dathathri et al., *Nature*, 2024) samples differently but also weakens under thorough rewriting.
      :::
    bridges: []
  - id: misuse-and-synthetic-media.s6
    title: Rules, labels, and the habits that protect you
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.misuse-and-synthetic-media
    markdown: |-
      Rules are catching up. The US TAKE IT DOWN Act (2025) criminalizes publishing non-consensual intimate images, AI-generated ones included, and requires platforms to remove them within 48 hours of a valid request. The EU AI Act requires deepfakes to be disclosed, and YouTube makes creators label realistic synthetic content.

      Still, the protection that works against every generator is a habit. Priya handles payments at a small design studio. On Friday afternoon a voice message from the founder says a supplier must be paid £38,000 today, the founder is boarding a flight, and she shouldn't tell anyone.

      1. **Notice the pattern.** Urgency, secrecy, and money together are the signal, however real the voice sounds.
      2. **Verify through a channel you already have.** Priya calls the founder's number from the staff directory, not the one in the message. (For families, the FBI recommended in December 2024 agreeing on a secret word.)
      3. **Make the process do the work.** Any new payee needs two people's approval, so no single call can move money.

      For images and videos, the equivalent is **lateral reading**: leave the post, search what other sources say, run a reverse image search, and check Content Credentials if present. Don't hunt for six-fingered hands; newer generators rarely make those mistakes.
    diagram:
      caption: Priya's check. The deciding step uses a channel the caller doesn't control.
      description: An urgent request arrives. Priya checks for red flags (urgency, secrecy, payment). She then calls back on a number she already has. If the person confirms, the payment goes to the two-person approval step. If she can't confirm, she stops and reports the attempt.
      nodes:
        - id: request
          label: Urgent request
          note: voice, video, or message
          col: 0
          row: 1
          tone: warn
        - id: flags
          label: Check red flags
          note: urgency + secrecy + money
          col: 1
          row: 1
        - id: callback
          label: Call back on a known number
          col: 2
          row: 1
          tone: accent
        - id: approve
          label: Two-person approval
          col: 3
          row: 0
          tone: data
        - id: stop
          label: Stop and report
          col: 3
          row: 2
          tone: muted
      edges:
        - from: request
          to: flags
        - from: flags
          to: callback
        - from: callback
          to: approve
          label: confirmed
        - from: callback
          to: stop
          label: can't confirm
    bridges: []
  - id: misuse-and-synthetic-media.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.misuse-and-synthetic-media
    markdown: Name the jailbreak failure mode, work a detector's base-rate problem, read a watermark count, and then handle a crying "grandson," a fake CFO, a viral flood photo, and an election-eve audio clip.
    takeaway: |-
      Jailbreaks exploit competing goals and gaps in safety training; deepfakes exploit trust in familiar faces and voices. Detectors and watermarks help but can be evaded, so verify through a channel you already control.
  - id: misuse-and-synthetic-media.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.misuse-and-synthetic-media
    markdown: |-
      A convincing face or voice is no longer proof of who is speaking. When a message asks for urgency, secrecy, and money, confirm it through a channel you already trust.
