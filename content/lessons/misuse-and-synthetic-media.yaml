assessment_families:
  - id: misuse-and-synthetic-media.base
    objective_ref: objective.misuse-and-synthetic-media
    task: base
    response_type: single_choice
    points: 1
    hint: Name the mechanism first. For jailbreaks, which goal won or which input training missed; for detectors, how rare the fakes are; for provenance, what a signature or watermark can and can't survive.
    remediation_scene: misuse-and-synthetic-media.s4
    variants:
      - id: misuse-and-synthetic-media.base.1
        prompt: A model refuses an unsafe request in English but answers it when the same request is written in a language with little safety training data. Which failure mode is this?
        options:
          - id: b
            text: Competing objectives, since helpfulness outweighed refusal
          - id: a
            text: Mismatched generalization, since safety training missed that input
          - id: c
            text: Prompt injection, since the text came from a third party
        answer: a
        feedback: The model can read the language but its safety training didn't cover it, which is mismatched generalization. Competing objectives is about framing that pits helpfulness against refusal, and prompt injection needs a third party's text, not the user's own request.
      - id: misuse-and-synthetic-media.base.2
        prompt: A user builds an elaborate role-play in which refusing would "break character," and the model complies. Which failure mode is this?
        options:
          - id: a
            text: Competing objectives, since staying helpful won out over refusing
          - id: b
            text: Mismatched generalization, since role-play is an unseen language
          - id: c
            text: Many-shot jailbreaking, since the story adds context to the prompt
        answer: a
        feedback: Role-play framing makes the helpful, in-character answer compete with the trained refusal, and here helpfulness won. Role-play is ordinary text, not an untrained input form, and many-shot attacks rely on hundreds of fake dialogues rather than one story.
      - id: misuse-and-synthetic-media.base.3
        prompt: Why did many-shot jailbreaking become a practical attack only around 2024?
        options:
          - id: c
            text: Voice cloning made fake dialogue audio cheap to produce
          - id: b
            text: Models first learned to read encodings such as Base64
          - id: a
            text: Context windows grew long enough for hundreds of fake dialogues
        answer: a
        feedback: The attack fills the context with many faked compliant exchanges, and its success grows with their number, so it needed long context windows. Encodings belong to mismatched generalization, and voice cloning is unrelated.
      - id: misuse-and-synthetic-media.base.4
        prompt: A deepfake detector flags 95% of fakes and 5% of real videos. If 1 in 100 videos is fake, roughly what share of flagged videos are fake?
        options:
          - id: a
            text: About 16%
          - id: b
            text: About 95%
          - id: c
            text: About 50%
        answer: a
        feedback: Per 10,000 videos, 95 fakes and 495 real videos get flagged, so 95 of 590 flags, about 16%, are fakes. 95% is the detector's catch rate among fakes, not the chance a flag is right.
      - id: misuse-and-synthetic-media.base.5
        prompt: A news photo reaches you with no Content Credentials attached. What can you conclude from that alone?
        options:
          - id: b
            text: It is AI-generated, since real cameras sign their photos
          - id: c
            text: It was edited, since any editing removes the signed record
          - id: a
            text: Very little, since most genuine photos carry no credentials
        answer: a
        feedback: Few cameras and apps attach credentials, and screenshots or uploads strip them, so absence is weak evidence either way. Credentials record edits rather than vanishing on every edit.
      - id: misuse-and-synthetic-media.base.6
        prompt: A watermark detector counts 106 green tokens out of 200 (chance would give 50). After a heavy paraphrase of the text, it counts 62. What happened?
        options:
          - id: a
            text: Replaced tokens were green only by chance, pulling the count down
          - id: b
            text: The paraphrase added a second watermark that cancels the first
          - id: c
            text: The detector's secret green list changed between the two checks
        answer: a
        feedback: Each rewritten token is green with probability γ, so heavy paraphrasing drags the count toward γT and z below the threshold. The secret key stayed the same, and the paraphraser added no watermark of its own.
  - id: misuse-and-synthetic-media.transfer
    objective_ref: objective.misuse-and-synthetic-media
    task: transfer
    response_type: single_choice
    points: 1
    hint: Look for urgency, secrecy, and a demand to act now. Then choose the check that uses a channel, record, or source the sender doesn't control.
    remediation_scene: misuse-and-synthetic-media.s6
    variants:
      - id: misuse-and-synthetic-media.transfer.1
        prompt: Your "grandson" calls in tears, asking for bail money by gift card and begging you not to tell his parents. What is the best first move?
        options:
          - id: b
            text: Ask him something only he would know, then pay if he gets it right
          - id: a
            text: Hang up and call him or his parents on a number you already have
          - id: c
            text: Listen closely for robotic sounds, since cloned voices sound flat
        answer: a
        feedback: Calling back on a known number takes the conversation away from the scammer. Personal details are often findable online, and good voice clones don't sound robotic.
      - id: misuse-and-synthetic-media.transfer.2
        prompt: On a video call, your company's "CFO" and two familiar colleagues ask you to make an urgent, confidential transfer. What does the Arup case suggest?
        options:
          - id: a
            text: Confirm through a separate, known channel before any transfer
          - id: b
            text: Ask everyone to turn their heads, since deepfakes fail at angles
          - id: c
            text: Proceed if the faces and voices match the people you know
        answer: a
        feedback: At Arup, the faces and voices matched people the employee recognized. Only an out-of-band check, such as calling the CFO's known number, breaks the illusion. Head-turning tests are unreliable against current tools.
      - id: misuse-and-synthetic-media.transfer.3
        prompt: A dramatic photo of a flooded landmark spreads on social media with no source. Which habit is lateral reading?
        options:
          - id: c
            text: Check how many followers the posting account has
          - id: b
            text: Zoom in and look for extra fingers or warped text
          - id: a
            text: Search other outlets for the event and reverse-search the image
        answer: a
        feedback: Lateral reading means leaving the post to see what independent sources say, and a reverse image search can reveal an earlier or different origin. Newer generators rarely make obvious visual errors, and follower counts can be bought.
      - id: misuse-and-synthetic-media.transfer.4
        prompt: Two days before an election, during the legal campaign silence period, a clip spreads of a candidate apparently discussing vote-rigging. Why is this timing so effective?
        options:
          - id: a
            text: It leaves little time for fact-checks or replies before voting
          - id: b
            text: Detectors are switched off by platforms during silence periods
          - id: c
            text: Audio clips are easier to verify in the final days of a race
        answer: a
        feedback: As in Slovakia in 2023, a late fake can reach voters before any correction does. Detectors aren't switched off, and late timing makes verification harder, not easier.
      - id: misuse-and-synthetic-media.transfer.5
        prompt: A creator uploads a realistic AI-generated video of a real city under water. Under YouTube's disclosure rules, what should they do?
        options:
          - id: b
            text: Nothing, as long as the video is not being monetized
          - id: c
            text: Blur any real buildings before uploading the video
          - id: a
            text: Label it as realistic altered or synthetic content
        answer: a
        feedback: YouTube requires creators to disclose realistic synthetic or altered content so viewers see a label. The rule doesn't depend on monetization, and blurring doesn't stop the clip from misleading.
      - id: misuse-and-synthetic-media.transfer.6
        prompt: You run an image-generation service. Which step most helps other people verify your images later?
        options:
          - id: a
            text: Attach signed Content Credentials and embed an invisible watermark
          - id: b
            text: Publish your model's score on a deepfake detection benchmark
          - id: c
            text: Add a line to your terms of service asking users not to deceive
        answer: a
        feedback: Credentials and a watermark travel with the image, giving others two independent signals, and the watermark can survive when metadata is stripped. A benchmark score and a terms-of-service line don't mark any particular image.
