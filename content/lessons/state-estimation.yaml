schema_version: 0.2-draft
lesson:
  id: state-estimation
  version: 0.1.0-draft
  title: Track a hidden state from noisy observations
  state: draft
  summary: Hidden Markov models and Kalman filters alternate prediction and evidence updates; their state, transition,
    and observation assumptions determine what they can estimate.
  slot: M06.5
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.state-estimation
  version: 1-draft
  statement: Hidden Markov models and Kalman filters alternate prediction and evidence updates; their state, transition,
    and observation assumptions determine what they can estimate.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - state-estimation.base
  - state-estimation.transfer
  prerequisites:
  - anyOf:
    - objective.graphical-models
  - anyOf:
    - objective.random-variables
scenes:
- id: state-estimation.s1
  title: The observation is not the state
  type: explanation
  depth: intuition
  objective_refs:
  - objective.state-estimation
  markdown: A location sensor reports a noisy reading while a vehicle has an underlying position. A state-space
    model separates hidden state, transitions over time, and observations. A Markov assumption says the current
    state summarizes the history relevant to the next state under the model.
  text_mode: A location sensor reports a noisy reading while a vehicle has an underlying position. A state-space
    model separates hidden state, transitions over time, and observations. A Markov assumption says the current
    state summarizes the history relevant to the next state under the model.
  bridges: []
- id: state-estimation.s2
  title: Predict, then update
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.state-estimation
  markdown: 'An HMM often has a finite hidden-state set. First propagate probabilities through the transition model,
    then multiply by observation likelihoods and normalize. If two states have equal prior probability and a signal
    is four times as likely in the first, their posterior ratio becomes four to one: probabilities 0.8 and 0.2.'
  text_mode: 'An HMM often has a finite hidden-state set. First propagate probabilities through the transition model,
    then multiply by observation likelihoods and normalize. If two states have equal prior probability and a signal
    is four times as likely in the first, their posterior ratio becomes four to one: probabilities 0.8 and 0.2.'
  bridges:
  - random-variables
- id: state-estimation.s3
  title: A continuous linear-Gaussian case
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.state-estimation
  markdown: A Kalman filter tracks a mean and covariance under linear transitions and observations with Gaussian
    noise. Suppose predicted position is 10, measured position is 14, and the scalar gain is 0.5. The corrected
    mean is 10 + 0.5 × (14 − 10) = 12. The gain reflects modeled uncertainties, not an arbitrary vote.
  text_mode: A Kalman filter tracks a mean and covariance under linear transitions and observations with Gaussian
    noise. Suppose predicted position is 10, measured position is 14, and the scalar gain is 0.5. The corrected
    mean is 10 + 0.5 × (14 − 10) = 12. The gain reflects modeled uncertainties, not an arbitrary vote.
  bridges: []
- id: state-estimation.s4
  title: Know when the model is strained
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.state-estimation
  markdown: Nonlinear motion, outliers, wrong noise assumptions, and ambiguous observations can challenge these
    filters. Extended, unscented, and particle methods make different approximations. A smooth estimated trajectory
    is not proof of accurate tracking. Test with known trajectories and inspect uncertainty as well as point estimates.
  text_mode: Nonlinear motion, outliers, wrong noise assumptions, and ambiguous observations can challenge these
    filters. Extended, unscented, and particle methods make different approximations. A smooth estimated trajectory
    is not proof of accurate tracking. Test with known trajectories and inspect uncertainty as well as point estimates.
  bridges: []
- id: state-estimation.check
