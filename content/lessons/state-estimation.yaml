schema_version: 0.2-draft
lesson:
  id: state-estimation
  version: 0.3.0-draft
  title: Track a hidden state from noisy observations
  state: draft
  summary: Combine an imperfect motion prediction with a noisy sensor reading to improve a position estimate.
  slot: M06.5
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.state-estimation
  version: 1-draft
  statement: Hidden Markov models and Kalman filters alternate prediction and evidence updates; their state,
    transition, and observation assumptions determine what they can estimate.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - state-estimation.base
  - state-estimation.transfer
  prerequisites:
  - anyOf:
    - objective.graphical-models
  - anyOf:
    - objective.random-variables
scenes:
- id: state-estimation.s1
  title: Track the position behind the reading
  type: explanation
  depth: intuition
  objective_refs:
  - objective.state-estimation
  markdown: 'A vehicle has a position, but its sensor reports an imperfect measurement. The true position is
    the **hidden state** we want to track; the reading is an **observation** that gives us evidence about it.


    A **state-space model** describes how the state changes and how observations arise from it. Under a **Markov**
    assumption, the current state contains the past information needed to predict the next step. Choosing what
    belongs in that state is therefore part of the model.'
  text_mode: 'A vehicle has a position, but its sensor reports an imperfect measurement. The true position
    is the **hidden state** we want to track; the reading is an **observation** that gives us evidence about
    it.


    A **state-space model** describes how the state changes and how observations arise from it. Under a **Markov**
    assumption, the current state contains the past information needed to predict the next step. Choosing what
    belongs in that state is therefore part of the model.'
  bridges: []
- id: state-estimation.s2
  title: Predict, then update
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.state-estimation
  markdown: 'A **hidden Markov model (HMM)** often uses a finite set of hidden states, such as “left room”
    and “right room.” First use the transition model to predict their probabilities. Then update those probabilities
    using the new observation.


    Suppose the two rooms begin with equal probabilities, 0.5 and 0.5. A signal has likelihood 0.8 in the left
    room and 0.2 in the right. Multiply to get weights 0.4 and 0.1, then divide by their total, 0.5. The updated
    probabilities are 0.8 and 0.2. We have changed our belief about the room, not the transition rules.'
  text_mode: 'A **hidden Markov model (HMM)** often uses a finite set of hidden states, such as “left room”
    and “right room.” First use the transition model to predict their probabilities. Then update those probabilities
    using the new observation.


    Suppose the two rooms begin with equal probabilities, 0.5 and 0.5. A signal has likelihood 0.8 in the left
    room and 0.2 in the right. Multiply to get weights 0.4 and 0.1, then divide by their total, 0.5. The updated
    probabilities are 0.8 and 0.2. We have changed our belief about the room, not the transition rules.'
  bridges:
  - random-variables
- id: state-estimation.s3
  title: Combine a predicted position with a measurement
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.state-estimation
  markdown: 'A **Kalman filter** handles a continuous state under linear transition and observation rules with
    Gaussian noise. A **Gaussian** is a bell-shaped distribution. The filter tracks its **mean**, or center,
    and **covariance**, which describes spread and how uncertainties vary together.


    Suppose the predicted position is 10 and the sensor reports 14. The **residual** is measurement minus prediction:
    14 − 10 = 4. With a **gain** of 0.5, the updated mean is 10 + 0.5 × 4 = 12.


    The gain determines how much of the discrepancy to use. It comes from the modeled uncertainties; a noisier
    measurement generally deserves less influence.'
  text_mode: 'A **Kalman filter** handles a continuous state under linear transition and observation rules
    with Gaussian noise. A **Gaussian** is a bell-shaped distribution. The filter tracks its **mean**, or center,
    and **covariance**, which describes spread and how uncertainties vary together.


    Suppose the predicted position is 10 and the sensor reports 14. The **residual** is measurement minus prediction:
    14 − 10 = 4. With a **gain** of 0.5, the updated mean is 10 + 0.5 × 4 = 12.


    The gain determines how much of the discrepancy to use. It comes from the modeled uncertainties; a noisier
    measurement generally deserves less influence.'
  bridges: []
- id: state-estimation.s4
  title: Know when the model is strained
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.state-estimation
  markdown: Nonlinear motion, outliers, wrong noise assumptions, and ambiguous observations can challenge these
    filters. Extended, unscented, and particle methods make different approximations. A smooth estimated trajectory
    is not proof of accurate tracking. Test with known trajectories and inspect uncertainty as well as point
    estimates.
  text_mode: Nonlinear motion, outliers, wrong noise assumptions, and ambiguous observations can challenge
    these filters. Extended, unscented, and particle methods make different approximations. A smooth estimated
    trajectory is not proof of accurate tracking. Test with known trajectories and inspect uncertainty as well
    as point estimates.
  bridges: []
- id: state-estimation.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.state-estimation
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Estimate the next state, then update that estimate with a new observation. The result depends on
    how well the motion and sensor models describe the situation.
- id: state-estimation.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.state-estimation
  markdown: Estimate the next state, then update that estimate with a new observation. The result depends on
    how well the motion and sensor models describe the situation.
  text_mode: Estimate the next state, then update that estimate with a new observation. The result depends
