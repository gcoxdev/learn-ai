assessment_families:
- id: state-estimation.base
  objective_ref: objective.state-estimation
  task: base
  response_type: single_choice
  points: 1
  hint: 'Predict, then update: trace the inputs, operation, and result before choosing.'
  remediation_scene: state-estimation.s2
  variants:
  - id: state-estimation.base.1
    prompt: What happens before the observation update in a filtering step?
    options:
    - id: c
      text: Discard all previous information
    - id: a
      text: Predict the next-state distribution using the transition model
    - id: b
      text: Assume the hidden state was observed exactly
    answer: a
    feedback: Filtering combines model-based prediction with new evidence.
  - id: state-estimation.base.2
    prompt: 'Prior position 8, measurement 12, scalar gain 0.25: corrected position?'
    options:
    - id: a
      text: '9'
    - id: b
      text: '10'
    - id: c
      text: '11'
    answer: a
    feedback: Add one quarter of the residual 4 to 8.
- id: state-estimation.transfer
  objective_ref: objective.state-estimation
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Know when the model is strained: trace the inputs, operation, and result before choosing.'
  remediation_scene: state-estimation.s4
  variants:
  - id: state-estimation.transfer.1
    prompt: A sensor becomes much noisier but its modeled uncertainty is unchanged. What can happen?
    options:
    - id: a
      text: The filter may trust bad measurements too strongly
    - id: b
      text: The filter becomes automatically optimal
    - id: c
      text: The true trajectory becomes linear
    answer: a
    feedback: The update weights depend on the assumed uncertainty model.
  - id: state-estimation.transfer.2
    prompt: Does a standard Kalman filter provide exact Bayesian filtering for every nonlinear model?
    options:
    - id: b
      text: Yes; covariance handles every distribution exactly
    - id: c
      text: Only if the state has a name
    - id: a
      text: No; its exact case uses linear-Gaussian assumptions
    answer: a
    feedback: Different nonlinear or non-Gaussian settings need other methods or approximations.
