assessment_families:
- id: graphical-models.base
  objective_ref: objective.graphical-models
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace a three-variable model: trace the inputs, operation, and result before choosing.'
  remediation_scene: graphical-models.s2
  variants:
  - id: graphical-models.base.1
    prompt: What defines a Bayesian network’s joint distribution?
    options:
    - id: a
      text: The product of each node’s distribution conditioned on its parents
    - id: b
      text: Only the positions of drawn nodes
    - id: c
      text: An unnormalized list of every edge label
    answer: a
    feedback: Local conditional distributions and a DAG define the factorization.
  - id: graphical-models.base.2
    prompt: Does a directed edge automatically prove a causal effect?
    options:
    - id: b
      text: Yes, every directed graph is causal
    - id: c
      text: Only if it is colored red
    - id: a
      text: No; causal interpretation requires additional assumptions
    answer: a
    feedback: Probabilistic dependence and causal meaning are different claims.
- id: graphical-models.transfer
  objective_ref: objective.graphical-models
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Observation can create dependencies: trace the inputs, operation, and result before choosing.'
  remediation_scene: graphical-models.s4
  variants:
  - id: graphical-models.transfer.1
    prompt: A query includes an unobserved variable. What is generally needed?
    options:
    - id: b
      text: Set it to zero without explanation
    - id: c
      text: Delete every factor containing it
    - id: a
      text: Sum or integrate over its possible values
    answer: a
    feedback: Marginalization accounts for unknown variables rather than ignoring them.
  - id: graphical-models.transfer.2
    prompt: A loopy factor graph is solved by approximate messages. What should results report?
    options:
    - id: c
      text: Only the number of nodes
    - id: a
      text: The approximation and its limitations
    - id: b
      text: A universal exactness guarantee
    answer: a
    feedback: Message passing is not automatically exact on arbitrary graphs.
