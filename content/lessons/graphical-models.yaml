scenes:
- id: graphical-models.s1
  title: A probability graph is more than a picture
  type: explanation
  depth: intuition
  objective_refs:
  - objective.graphical-models
  markdown: 'A Bayesian network is a directed acyclic graph with a conditional probability distribution for
    each variable given its parents. Multiplying those local distributions defines a joint distribution. The
    graph expresses conditional-independence assumptions. It is not automatically a causal graph unless additional
    causal meaning is justified.


    A **distribution** lists probabilities of possible values. A **joint distribution** describes combinations
    of values. “Directed” means arrows have direction; “acyclic” means following arrows cannot loop back to
    the starting node. A node''s **parents** are the nodes pointing into it. A **factor** is one of the smaller
    numerical pieces multiplied together.'
  text_mode: 'A Bayesian network is a directed acyclic graph with a conditional probability distribution for
    each variable given its parents. Multiplying those local distributions defines a joint distribution. The
    graph expresses conditional-independence assumptions. It is not automatically a causal graph unless additional
    causal meaning is justified.


