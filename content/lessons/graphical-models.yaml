lesson:
  id: graphical-models
  version: 0.3.0-draft
  title: Factor a joint distribution into smaller pieces
  state: draft
  summary: Break a probability calculation into smaller pieces and include the possibilities you cannot observe.
  slot: M06.4
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
  - title: Deep Learning — probability and information theory
    url: https://www.deeplearningbook.org/contents/prob.html
objectives:
- id: objective.graphical-models
  version: 1-draft
  statement: Bayesian networks and factor graphs encode a probability factorization; inference combines local
    factors to answer conditional questions while respecting hidden dependencies.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - graphical-models.base
  - graphical-models.transfer
  prerequisites:
  - anyOf:
    - objective.bayes-rule
  - anyOf:
    - objective.discrete-math
scenes:
- id: graphical-models.s1
  title: Use a graph to organize probabilities
  type: explanation
  depth: intuition
  objective_refs:
  - objective.graphical-models
  markdown: 'A **joint distribution** assigns probabilities to combinations of values, such as whether it rains,
    whether a sprinkler runs, and whether the ground is wet. A graph can help break that large description
    into smaller parts.


    In a **Bayesian network**, arrows point from a node’s **parents** into that node, and no directed path
    loops back to its start. Each node has probabilities conditioned on its parents. Multiplying these local
    pieces, or **factors**, gives the joint distribution.


    The graph encodes assumptions about which variables become independent when others are known. Arrows do
    not automatically establish cause and effect; that requires additional assumptions and evidence.'
  text_mode: 'A **joint distribution** assigns probabilities to combinations of values, such as whether it
    rains, whether a sprinkler runs, and whether the ground is wet. A graph can help break that large description
    into smaller parts.


