scenes:
- id: graphical-models.s1
  title: A probability graph is more than a picture
  type: explanation
  depth: intuition
  objective_refs:
  - objective.graphical-models
  markdown: A Bayesian network is a directed acyclic graph with a conditional probability distribution for each
    variable given its parents. Multiplying those local distributions defines a joint distribution. The graph expresses
    conditional-independence assumptions. It is not automatically a causal graph unless additional causal meaning
    is justified.
  text_mode: A Bayesian network is a directed acyclic graph with a conditional probability distribution for each
    variable given its parents. Multiplying those local distributions defines a joint distribution. The graph expresses
    conditional-independence assumptions. It is not automatically a causal graph unless additional causal meaning
    is justified.
  bridges: []
- id: graphical-models.s2
  title: Trace a three-variable model
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.graphical-models
  markdown: Suppose Rain influences Sprinkler choice and WetGround depends on both. The joint probability factors
    into P(Rain), P(Sprinkler given Rain), and P(WetGround given Rain, Sprinkler). To answer a query, condition
    on observations and sum over unknown variables. A hidden variable does not simply vanish from the calculation.
  text_mode: Suppose Rain influences Sprinkler choice and WetGround depends on both. The joint probability factors
    into P(Rain), P(Sprinkler given Rain), and P(WetGround given Rain, Sprinkler). To answer a query, condition
    on observations and sum over unknown variables. A hidden variable does not simply vanish from the calculation.
  bridges:
  - probability
- id: graphical-models.s3
  title: Factor graphs make the pieces explicit
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.graphical-models
  markdown: A factor graph has variable nodes and factor nodes representing functions over subsets of variables.
    Message-passing algorithms combine local information. On certain tree structures exact inference is efficient;
    loops or large intermediate factors can make computation harder or require approximation.
  text_mode: A factor graph has variable nodes and factor nodes representing functions over subsets of variables.
    Message-passing algorithms combine local information. On certain tree structures exact inference is efficient;
    loops or large intermediate factors can make computation harder or require approximation.
  bridges: []
- id: graphical-models.s4
  title: Observation can create dependencies
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.graphical-models
  markdown: If either a sprinkler or rain can explain wet ground, learning that the sprinkler was on can reduce
    the need to infer rain after observing wetness. This is a form of explaining away. Intuitive independence claims
    should be checked against the graph’s conditioning structure rather than visual distance between nodes.
  text_mode: If either a sprinkler or rain can explain wet ground, learning that the sprinkler was on can reduce
    the need to infer rain after observing wetness. This is a form of explaining away. Intuitive independence claims
    should be checked against the graph’s conditioning structure rather than visual distance between nodes.
  bridges: []
