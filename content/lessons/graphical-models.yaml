    Unknown rain still contributes to the answer.'
  bridges:
  - probability
- id: graphical-models.s3
  title: Factor graphs make the pieces explicit
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.graphical-models
  markdown: A factor graph has variable nodes and factor nodes representing functions over subsets of variables.
    Message-passing algorithms combine local information. On certain tree structures exact inference is efficient;
    loops or large intermediate factors can make computation harder or require approximation.
  text_mode: A factor graph has variable nodes and factor nodes representing functions over subsets of variables.
    Message-passing algorithms combine local information. On certain tree structures exact inference is efficient;
    loops or large intermediate factors can make computation harder or require approximation.
  bridges: []
- id: graphical-models.s4
  title: Observation can create dependencies
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.graphical-models
  markdown: 'If either a sprinkler or rain can explain wet ground, learning that the sprinkler was on can reduce
    the need to infer rain after observing wetness. This is a form of explaining away. Intuitive independence
    claims should be checked against the graph’s conditioning structure rather than visual distance between
    nodes.


    The explaining-away pattern is clearest when rain and the sprinkler are initially independent possible
    causes of wet ground. After seeing wetness, evidence for one can reduce the probability of the other. The
    amount and even direction of change depend on the actual probability tables; arrows alone do not supply
    those numbers.'
