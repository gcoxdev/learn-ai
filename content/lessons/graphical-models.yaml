    Unknown rain still contributes to the answer.'
  bridges:
  - probability
- id: graphical-models.s3
  title: Factor graphs make the pieces explicit
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.graphical-models
  markdown: A factor graph has variable nodes and factor nodes representing functions over subsets of variables.
    Message-passing algorithms combine local information. On certain tree structures exact inference is efficient;
    loops or large intermediate factors can make computation harder or require approximation.
  text_mode: A factor graph has variable nodes and factor nodes representing functions over subsets of variables.
    Message-passing algorithms combine local information. On certain tree structures exact inference is efficient;
    loops or large intermediate factors can make computation harder or require approximation.
  bridges: []
- id: graphical-models.s4
  title: An observation can link two explanations
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.graphical-models
  markdown: 'Consider a version where rain and the sprinkler are initially independent possible causes of wet
    ground. After you see wet ground, either could explain it. Learning that the sprinkler was on can reduce
    the need to infer rain. This pattern is called **explaining away**.


    The size and even the direction of a probability change depend on the numerical tables, not just the arrows.
    Check what has been observed and what has been conditioned on before assuming two variables remain independent.'
  text_mode: 'Consider a version where rain and the sprinkler are initially independent possible causes of
