  version: 0.1.0-draft
  title: Factor a joint distribution into smaller pieces
  state: draft
  summary: Bayesian networks and factor graphs encode a probability factorization; inference combines local factors
    to answer conditional questions while respecting hidden dependencies.
  slot: M06.4
  category: learning
  minutes: 12
