schema_version: 0.2-draft
lesson:
  id: graphical-models
  version: 0.4.0-draft
  title: Factor a joint distribution into smaller pieces
  state: draft
  summary: The lawn is wet at dawn. Did it rain? Learn how a few arrows tame a billion-row probability table, and why spotting the sprinkler makes rain less likely.
  slot: M06.4
  category: learning
  sources:
    - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
      url: https://aima.cs.berkeley.edu/
    - title: Deep Learning — probability and information theory
      url: https://www.deeplearningbook.org/contents/prob.html
objectives:
  - id: objective.graphical-models
    version: 2-draft
    statement: Bayesian networks and factor graphs encode a probability factorization; inference combines local factors to answer conditional questions while respecting hidden dependencies.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - graphical-models.base.v2
      - graphical-models.transfer.v2
    prerequisites:
      - anyOf:
          - objective.bayes-rule
      - anyOf:
          - objective.discrete-math
scenes:
  - id: graphical-models.s1
    title: Wet grass at 7 a.m.
    type: explanation
    depth: intuition
    objective_refs:
      - objective.graphical-models
    markdown: |-
      You step outside and the lawn is soaking wet. Did it rain overnight, or did the sprinkler run? Three yes/no facts are tangled together here: Rain, Sprinkler, and Wet.

      A **joint distribution** gives a probability to every combination of values: rain and sprinkler and wet, rain and no sprinkler and wet, and so on. Three yes/no variables make 2³ = 8 combinations. Thirty make 2³⁰, over a billion, far too many to fill in or learn.

      The way out is to write down what depends on what. Rain and the sprinkler don't affect each other (the sprinkler runs on a timer), but both can wet the lawn. Draw an arrow from each to Wet:
    diagram:
      caption: A three-node Bayesian network. Each node stores a small table given its parents.
      description: Two nodes with no parents, Rain (probability 0.2) and Sprinkler (probability 0.3), each have an arrow into Wet grass. Wet grass stores the probability of being wet for each of the four combinations of rain and sprinkler.
      nodes:
        - id: rain
          label: Rain
          note: P(rain) = 0.2
          col: 0
          row: 0
          tone: data
        - id: sprinkler
          label: Sprinkler
          note: P(sprinkler) = 0.3
          col: 2
          row: 0
          tone: data
        - id: wet
          label: Wet grass
          note: P(wet | rain, sprinkler), 4 rows
          col: 1
          row: 1
          tone: accent
      edges:
        - from: rain
          to: wet
        - from: sprinkler
          to: wet
    bridges: []
  - id: graphical-models.s1b
    title: A few small tables replace one giant one
    type: explanation
    depth: intuition
    objective_refs:
      - objective.graphical-models
    markdown: |-
      That picture is a **Bayesian network**: a graph whose arrows never loop back to where they started. The nodes an arrow comes from are a node's **parents**. Each node stores only a small table, its probability given its parents:

      | Node | Parents | Numbers to store |
      | --- | --- | ---: |
      | Rain | none | 1 (0.2) |
      | Sprinkler | none | 1 (0.3) |
      | Wet | Rain, Sprinkler | 4 (0.99, 0.90, 0.80, 0.05) |

      The four Wet numbers cover both causes, rain only, sprinkler only, and neither. Multiplying the right entries gives any row of the full joint table. For thirty yes/no variables with at most three parents each, the network needs at most 30 × 2³ = 240 numbers instead of over a billion. Each small table is called a **factor**.

      :::story Judea Pearl's arrows
      In the 1980s, Judea Pearl showed how networks like this let machines reason with probabilities efficiently, when many AI researchers thought probability was too expensive to use. His 1988 book *Probabilistic Reasoning in Intelligent Systems* made Bayesian networks a standard tool, and he won the 2011 Turing Award for this and his later work on causality.
      :::

      :::mixup "An arrow in a Bayesian network means one thing causes the other."
      Arrows only say which small tables you store; the same joint distribution can often be drawn with arrows reversed. Drawing them from causes to effects is a good habit because it gives small, readable tables, but proving a cause takes more evidence than a graph. The causality module covers how.
      :::
    bridges: []
  - id: graphical-models.s2
    title: Sum out what you can't see
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.graphical-models
    markdown: |-
      Start small and forget the sprinkler for a moment. Say rain has probability 0.2, and the lawn is wet 90% of the time after rain and 10% otherwise. You didn't see whether it rained, so count both possibilities: 0.2 × 0.9 + 0.8 × 0.1 = 0.18 + 0.08 = 0.26. Adding up over the values of a variable you didn't observe is called **marginalization**, or "summing out" that variable. An unobserved variable doesn't vanish; each of its values contributes.

      Now the full network. The chance the lawn is wet sums four rows, one per combination of rain and sprinkler:

      | Rain | Sprinkler | P(rain) × P(sprinkler) × P(wet \| both) | Contribution |
      | --- | --- | --- | ---: |
      | yes | yes | 0.2 × 0.3 × 0.99 | 0.0594 |
      | yes | no | 0.2 × 0.7 × 0.90 | 0.1260 |
      | no | yes | 0.8 × 0.3 × 0.80 | 0.1920 |
      | no | no | 0.8 × 0.7 × 0.05 | 0.0280 |
      | | | **Total: P(wet)** | **0.4054** |

      To get P(rain | wet), keep only the rain rows and divide by the total: (0.0594 + 0.1260) / 0.4054 ≈ 0.457. Seeing the wet lawn raised the chance of rain from 20% to about 46%. That's Bayes' rule again, with marginalization doing the bookkeeping.

      :::papers The factorization
      A Bayesian network over variables $x_1, \dots, x_n$ says

      $$P(x_1, \dots, x_n) = \prod_{i=1}^{n} P\big(x_i \mid \text{parents}(x_i)\big)$$

      For this lawn, $P(R, S, W) = P(R)\,P(S)\,P(W \mid R, S)$, so the first row is $0.2 \times 0.3 \times 0.99 = 0.0594$. Marginalizing out $R$ and $S$ gives $P(W) = \sum_{r}\sum_{s} P(r)\,P(s)\,P(W \mid r, s) = 0.4054$.
      :::
    bridges:
      - probability
  - id: graphical-models.s3
    title: Pass messages instead of listing every row
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.graphical-models
    markdown: |-
      Listing every row works for three variables, but for thirty it's a billion rows again. The trick is to sum out variables locally, a few at a time, and pass the partial sums along.

      A **factor graph** makes this visible: a circle for each variable, a square for each factor, and a line from each square to the variables its table mentions. Our lawn has three squares, P(R), P(S), and P(W | R, S), the last one linked to all three circles.

      In **belief propagation** (from Pearl's work), each node sends its neighbors a short message: "here's how likely each of your values is, from my side of the graph." When the graph has no loops, one sweep in and one sweep out gives every exact answer, with work that grows with the size of the graph instead of exponentially. With loops, running the messages anyway ("loopy" belief propagation) gives approximate answers that are often good. Versions of it decode LDPC (low-density parity-check) codes, the error-correcting codes that protect data in 5G and recent Wi-Fi standards.
    bridges: []
  - id: graphical-models.s4
    title: The sprinkler explains away the rain
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.graphical-models
    markdown: |-
      The lawn is wet, and rain is now 46% likely. Then your neighbor mentions that your sprinkler ran last night.

      :::predict Does learning about the sprinkler make rain more likely, less likely, or leave it unchanged?
      Less likely. Only the two sprinkler-on rows of the table still fit: rain 0.2 × 0.3 × 0.99 = 0.0594, and no rain 0.8 × 0.3 × 0.80 = 0.192. So P(rain | wet, sprinkler) = 0.0594 / (0.0594 + 0.192) ≈ 0.236. The sprinkler already explains the wet lawn, so rain drops back almost to its original 20%.
      :::

      This is **explaining away**: when two causes compete to explain one observed effect, confirming one makes the other less likely. The odd part: rain and the sprinkler were independent until you saw the lawn. Observing their shared effect is what links them.

      This program sums the joint table exactly as above:

      ```python run
      from itertools import product

      p_rain, p_sprinkler = 0.2, 0.3
      p_wet = {(1, 1): 0.99, (1, 0): 0.90, (0, 1): 0.80, (0, 0): 0.05}  # P(wet | rain, sprinkler)

      def joint(r, s, w):
          """P(r, s, w) = P(r) * P(s) * P(w | r, s): one factor per node."""
          pr = p_rain if r else 1 - p_rain
          ps = p_sprinkler if s else 1 - p_sprinkler
          pw = p_wet[(r, s)] if w else 1 - p_wet[(r, s)]
          return pr * ps * pw

      def prob_rain(**seen):
          """P(rain = 1 | seen), summing the joint over everything not observed."""
          match = lambda r, s, w: all(dict(r=r, s=s, w=w)[k] == v for k, v in seen.items())
          rows = [(r, s, w) for r, s, w in product([0, 1], repeat=3) if match(r, s, w)]
          total = sum(joint(*row) for row in rows)
          return sum(joint(*row) for row in rows if row[0] == 1) / total

      print(f"P(rain)                    = {prob_rain():.3f}")
      print(f"P(rain | wet)              = {prob_rain(w=1):.3f}")
      print(f"P(rain | wet, sprinkler)   = {prob_rain(w=1, s=1):.3f}")
      print(f"P(rain | wet, no sprinkler)= {prob_rain(w=1, s=0):.3f}")
      print(f"P(rain | sprinkler)        = {prob_rain(s=1):.3f}")
      ```

      The last line prints 0.200: without the wet lawn, the sprinkler says nothing about rain. If the sprinkler did *not* run, rain jumps to 0.818, since something wet the grass. Try setting the `(0, 0)` entry to 0.5, as if heavy dew were common, and watch the wet lawn tell you less.
    bridges: []
  - id: graphical-models.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.graphical-models
    markdown: Sum out hidden causes for trains, fevers, and power cuts, then reason about car trouble, burglar alarms, and suspicious arrows.
    takeaway: |-
      A Bayesian network replaces one giant probability table with a small table per node. To answer a question, multiply the factors and sum over whatever you didn't observe; and remember that seeing a shared effect can make independent causes compete.
  - id: graphical-models.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.graphical-models
    markdown: |-
      A probability graph breaks a joint distribution into smaller factors. To answer a question, combine those factors and include the possible values of unobserved variables.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - graphical-models.s1
        - graphical-models.s1b
        - graphical-models.s2
        - graphical-models.s3
        - graphical-models.s4
        - graphical-models.check
      gate_refs:
        - gate.core
  scene_aliases:
    graphical-models.recap: graphical-models.check
assessment_families:
  - id: graphical-models.base
    objective_ref: objective.graphical-models
    task: base
    response_type: single_choice
    points: 1
    hint: 'Trace a three-variable model: trace the inputs, operation, and result before choosing.'
    remediation_scene: graphical-models.s2
    variants:
      - id: graphical-models.base.1
        prompt: What defines a Bayesian network’s joint distribution?
        options:
          - id: a
            text: The product of each node’s distribution conditioned on its parents
          - id: b
            text: Only the positions of drawn nodes
          - id: c
            text: An unnormalized list of every edge label
        answer: a
        feedback: Local conditional distributions and a DAG define the factorization.
        retired: true
      - id: graphical-models.base.2
        prompt: Does a directed edge automatically prove a causal effect?
        options:
          - id: b
            text: Yes, every directed graph is causal
          - id: c
            text: Only if it is colored red
          - id: a
            text: No; causal interpretation requires additional assumptions
        answer: a
        feedback: Probabilistic dependence and causal meaning are different claims.
        retired: true
  - id: graphical-models.transfer
    objective_ref: objective.graphical-models
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Observation can create dependencies: trace the inputs, operation, and result before choosing.'
    remediation_scene: graphical-models.s4
    variants:
      - id: graphical-models.transfer.1
        prompt: A query includes an unobserved variable. What is generally needed?
        options:
          - id: b
            text: Set it to zero without explanation
          - id: c
            text: Delete every factor containing it
          - id: a
            text: Sum or integrate over its possible values
        answer: a
        feedback: Marginalization accounts for unknown variables rather than ignoring them.
        retired: true
      - id: graphical-models.transfer.2
        prompt: A loopy factor graph is solved by approximate messages. What should results report?
        options:
          - id: c
            text: Only the number of nodes
          - id: a
            text: The approximation and its limitations
          - id: b
            text: A universal exactness guarantee
        answer: a
        feedback: Message passing is not automatically exact on arbitrary graphs.
        retired: true
  - id: graphical-models.base.v2
    objective_ref: objective.graphical-models
    task: base
    response_type: numeric
    points: 1
    hint: You didn't observe the hidden cause, so add up both possibilities, P(cause) × P(effect | cause) + P(no cause) × P(effect | no cause).
    remediation_scene: graphical-models.s2
    absolute_tolerance: 0.01
    variants:
      - id: graphical-models.base.v2.1
        prompt: It rains on 30% of days. The lawn is wet on 80% of rainy mornings and 10% of dry ones. You haven't looked outside. What is the probability the lawn is wet? Use a decimal to two places.
        answer: 0.31
        feedback: Sum out rain, 0.3 × 0.8 + 0.7 × 0.1 = 0.24 + 0.07 = 0.31. Using only the rainy case (0.24) forgets that a dry night can also leave a wet lawn.
      - id: graphical-models.base.v2.2
        prompt: A power cut happens on 10% of nights. A server alarm fires on 95% of nights with a power cut and 2% of nights without one. What is the probability the alarm fires tonight? Use a decimal to two places.
        answer: 0.11
        feedback: Sum out the power cut, 0.1 × 0.95 + 0.9 × 0.02 = 0.095 + 0.018 = 0.113, about 0.11. Stopping at 0.095 drops the false alarms on normal nights.
      - id: graphical-models.base.v2.3
        prompt: During flu season, 5% of students have flu. A fever appears in 90% of students with flu and 4% of students without it. What is the probability a randomly chosen student has a fever? Use a decimal to two places.
        answer: 0.08
        feedback: Sum out flu, 0.05 × 0.9 + 0.95 × 0.04 = 0.045 + 0.038 = 0.083, about 0.08. Almost half of all fevers come from the much larger group without flu.
      - id: graphical-models.base.v2.4
        prompt: A train runs late 25% of the time. You miss your meeting 60% of the time when it's late and 4% of the time when it's on time. What is the probability you miss the meeting? Use a decimal to two places.
        answer: 0.18
        feedback: Sum out the train, 0.25 × 0.6 + 0.75 × 0.04 = 0.15 + 0.03 = 0.18. Averaging 60% and 4% without weighting them by how often each case happens would give the wrong 0.32.
  - id: graphical-models.transfer.v2
    objective_ref: objective.graphical-models
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what has been observed. Two independent causes stay independent until you observe an effect they share; then confirming one cause lowers the other.
    remediation_scene: graphical-models.s4
    variants:
      - id: graphical-models.transfer.v2.1
        prompt: A car won't start. Two independent causes could explain it, a dead battery or an empty fuel tank. You check and find the tank is empty. What happens to the probability of a dead battery?
        options:
          - id: b
            text: It rises, because car problems tend to come together
          - id: c
            text: It stays the same, because the two causes are independent
          - id: a
            text: It falls, because the empty tank already explains the car
        answer: a
        feedback: This is explaining away. The causes were independent before, but once you observe their shared effect, confirming one cause lowers the need for the other. They stop being independent the moment you condition on the car not starting.
      - id: graphical-models.transfer.v2.2
        prompt: Either a burglary or an earthquake can set off a house alarm, and the two happen independently. You haven't heard anything about the alarm. How does learning that an earthquake just happened change the probability of a burglary?
        options:
          - id: c
            text: It lowers it, because the earthquake explains things away
          - id: a
            text: It leaves it unchanged, since no shared effect was observed
          - id: b
            text: It raises it, because alarms are more likely to be ringing
        answer: a
        feedback: Explaining away only happens once you observe the shared effect (the alarm). Without that, the two independent causes tell you nothing about each other, just like P(rain | sprinkler) = 0.2 in the lesson.
      - id: graphical-models.transfer.v2.3
        prompt: A diagnosis network has 20 yes/no variables, and each one has at most 2 parents. Why is it far easier to build than a full joint table?
        options:
          - id: a
            text: It stores just a small table per node, not all 2²⁰ combinations
          - id: b
            text: It treats the variables as independent, so it needs 20 numbers
          - id: c
            text: It drops rarely observed variables until the table fits in memory
        answer: a
        feedback: Each node needs at most 2² = 4 rows given its parents, so at most 80 numbers in all, versus over a million for the full table. The network doesn't assume everything is independent; the arrows keep the dependencies that matter.
      - id: graphical-models.transfer.v2.4
        prompt: A network learned from hospital records has an arrow from "carries a lighter" to "lung disease." A colleague says this shows lighters cause lung disease. What is the best reply?
        options:
          - id: b
            text: The arrow is simply backward, since the disease came first
          - id: a
            text: The arrow records a dependence; smoking could drive both
          - id: c
            text: Arrows in a Bayesian network show cause, so the claim holds
        answer: a
        feedback: An arrow only says which conditional table is stored. A hidden common cause such as smoking makes lighters and lung disease go together, so causal claims need evidence beyond the graph. Reversing the arrow wouldn't fix that.
