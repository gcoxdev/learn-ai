    loops back to its start. Each node has probabilities conditioned on its parents. Multiplying these local
    pieces, or **factors**, gives the joint distribution.


    The graph encodes assumptions about which variables become independent when others are known. Arrows do
    not automatically establish cause and effect; that requires additional assumptions and evidence.'
  bridges: []
- id: graphical-models.s2
  title: Trace a three-variable model
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.graphical-models
  markdown: 'Suppose Rain influences Sprinkler choice and WetGround depends on both. The joint probability
    factors into P(Rain), P(Sprinkler given Rain), and P(WetGround given Rain, Sprinkler). To answer a query,
    condition on observations and sum over unknown variables. A hidden variable does not simply vanish from
    the calculation.


    Read P(Rain) as “the probability of rain.” To find the probability of wet ground when rain is unknown,
    count both possibilities: rain and no rain. For a smaller model with rain chance 0.2, wet chance 0.9 in
    rain and 0.1 otherwise, the answer is 0.2 × 0.9 + 0.8 × 0.1 = 0.26. This adding-out operation is **marginalization**.
    Unknown rain still contributes to the answer.'
  text_mode: 'Suppose Rain influences Sprinkler choice and WetGround depends on both. The joint probability
    factors into P(Rain), P(Sprinkler given Rain), and P(WetGround given Rain, Sprinkler). To answer a query,
    condition on observations and sum over unknown variables. A hidden variable does not simply vanish from
    the calculation.


    Read P(Rain) as “the probability of rain.” To find the probability of wet ground when rain is unknown,
