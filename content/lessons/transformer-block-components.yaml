          - id: b
            text: The MLP has a d × 4d and a 4d × d matrix, so it has 8d², twice attention's 4d².
          - id: a
            text: The MLP is one d × 4d matrix, so it has 4d² weights, the same as attention.
        feedback: Attention is 4 × 256² = 262,144 and the MLP is 8 × 256² = 524,288. The block totals 12 × 65,536 = 786,432.
      - id: transformer-block-components.calculate.5
        prompt: GPT-2 large has d = 1280 and a classic 4× MLP. Record the attention weights (Q, K, V, O) and the MLP weights in one block, ignoring biases and norms.
        answers:
          attn: 6553600
          mlp: 13107200
        reason_answer: c
        reason_options:
          - id: b
