assessment_families:
- id: transformer-block-components.base
  objective_ref: objective.transformer-block-components
  task: base
  response_type: single_choice
  points: 1
  hint: 'Follow a gated feed-forward path: trace the inputs, operation, and result before choosing.'
  remediation_scene: transformer-block-components.s2
  variants:
  - id: transformer-block-components.base.1
    prompt: Which standard sublayer directly mixes information across token positions?
    options:
    - id: b
      text: A purely position-wise feed-forward map
    - id: c
      text: Only a learned scalar gain
    - id: a
      text: Attention
    answer: a
    feedback: Attention combines values from permitted positions.
  - id: transformer-block-components.base.2
    prompt: What does a gated feed-forward design multiply?
    options:
    - id: c
      text: Every output probability by zero
    - id: a
      text: Two transformed feature paths coordinate by coordinate
    - id: b
      text: Only token IDs as vocabulary labels
    answer: a
    feedback: The gate modulates features within the position-wise computation.
- id: transformer-block-components.transfer
  objective_ref: objective.transformer-block-components
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Inspect a real block before tracing it: trace the inputs, operation, and result before choosing.'
  remediation_scene: transformer-block-components.s4
  variants:
  - id: transformer-block-components.transfer.1
    prompt: Is a SwiGLU gate automatically a softmax probability over experts?
    options:
    - id: c
      text: Only if the hidden width is large
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Feature gating and expert routing are different mechanisms.
  - id: transformer-block-components.transfer.2
    prompt: Two blocks have identical outer shapes. Does that imply identical normalization order?
    options:
    - id: a
      text: No; inspect the architecture
    - id: b
      text: Yes; shapes determine every operation
    - id: c
      text: Only in a decoder
    answer: a
    feedback: Shape compatibility does not specify the computation graph.
