scenes:
- id: transformer-block-components.s1
  title: Two kinds of transformation cooperate
  type: explanation
  depth: intuition
  objective_refs:
  - objective.transformer-block-components
  markdown: Attention mixes information across permitted positions. A standard dense feed-forward sublayer applies
    learned transformations separately at each position, sharing its parameters across positions. The feed-forward
    input already contains contextual information from earlier operations, but the sublayer does not itself form
    a new attention matrix.
  text_mode: Attention mixes information across permitted positions. A standard dense feed-forward sublayer applies
    learned transformations separately at each position, sharing its parameters across positions. The feed-forward
    input already contains contextual information from earlier operations, but the sublayer does not itself form
    a new attention matrix.
  bridges: []
- id: transformer-block-components.s2
  title: Follow a gated feed-forward path
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.transformer-block-components
  markdown: A gated design projects the same input along two paths, transforms one with an activation, multiplies
    them coordinate by coordinate, and projects the result back. SwiGLU uses a SiLU-based gate in this pattern.
    The gate is not generally a probability distribution over experts or tokens.
  text_mode: A gated design projects the same input along two paths, transforms one with an activation, multiplies
    them coordinate by coordinate, and projects the result back. SwiGLU uses a SiLU-based gate in this pattern.
    The gate is not generally a probability distribution over experts or tokens.
  bridges:
  - matrices-tensors
- id: transformer-block-components.s3
  title: Track the residual stream
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.transformer-block-components
  markdown: A residual addition combines an incoming representation with a computed update. Normalization can occur
    before or after a sublayer depending on the architecture. Layer normalization subtracts a mean and rescales
    under its convention; common RMSNorm rescales by root mean square without mean subtraction. Learned gains and
    stabilizers are part of the exact formula.
  text_mode: A residual addition combines an incoming representation with a computed update. Normalization can occur
    before or after a sublayer depending on the architecture. Layer normalization subtracts a mean and rescales
    under its convention; common RMSNorm rescales by root mean square without mean subtraction. Learned gains and
    stabilizers are part of the exact formula.
  bridges: []
- id: transformer-block-components.s4
  title: Inspect a real block before tracing it
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.transformer-block-components
  markdown: Draw the order of normalization, projection, activation, gating, attention, and residual addition from
    the implementation or report. Check widths and data types. Architecture labels alone do not settle these details.
    A whole block can preserve input-output shape while doing substantially different internal computation.
  text_mode: Draw the order of normalization, projection, activation, gating, attention, and residual addition from
    the implementation or report. Check widths and data types. Architecture labels alone do not settle these details.
    A whole block can preserve input-output shape while doing substantially different internal computation.
  bridges: []
