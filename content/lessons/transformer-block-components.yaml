        answers:
          attn: 4194304
          mlp: 8388608
        reason_answer: c
        reason_options:
          - id: a
            text: The MLP works on one token at a time, so it has only d² weights.
          - id: b
            text: The MLP is one d × 4d matrix, so it has 4d² weights, the same as attention.
          - id: c
            text: The MLP has a d × 4d and a 4d × d matrix, so it has 8d², twice attention's 4d².
        feedback: Attention is 4 × 1024² = 4,194,304 and the MLP is 8 × 1024² = 8,388,608. Working per token affects which inputs the MLP sees, not how many weights it has.
      - id: transformer-block-components.calculate.3
        prompt: A block has d = 2048 and a classic 4× MLP. Record the attention weights (Q, K, V, O) and the MLP weights, ignoring biases and norms.
        answers:
          attn: 16777216
          mlp: 33554432
        reason_answer: a
        reason_options:
          - id: a
