lesson:
  id: transformer-block-components
  version: 0.4.0-draft
  title: Separate mixing across tokens from transforming one token
  state: draft
  summary: "Every transformer layer repeats one small recipe: normalize, attend, add; normalize, MLP, add. Trace it with real numbers and count the 7 million weights in each GPT-2 layer."
  slot: M15.6
  category: learning
  sources:
    - title: "Attention Is All You Need, sections 3.1 and 3.3 (Vaswani et al., 2017)"
      url: https://arxiv.org/abs/1706.03762
    - title: "Language Models are Unsupervised Multitask Learners (GPT-2; Radford et al., 2019)"
      url: https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf
    - title: "On Layer Normalization in the Transformer Architecture (Xiong et al., 2020)"
      url: https://arxiv.org/abs/2002.04745
    - title: "Root Mean Square Layer Normalization (Zhang & Sennrich, 2019)"
      url: https://arxiv.org/abs/1910.07467
    - title: "GLU Variants Improve Transformer (Shazeer, 2020)"
      url: https://arxiv.org/abs/2002.05202
    - title: "A Mathematical Framework for Transformer Circuits (Elhage et al., 2021)"
      url: https://transformer-circuits.pub/2021/framework/index.html
    - title: "LLaMA: Open and Efficient Foundation Language Models (Touvron et al., 2023)"
      url: https://arxiv.org/abs/2302.13971
    - title: The Llama 3 Herd of Models
      url: https://arxiv.org/abs/2407.21783
objectives:
  - id: objective.transformer-block-components
    version: 2-draft
    statement: Transformer blocks combine attention, position-wise feed-forward computation, residual additions, and normalization; gated activations and placement conventions change the exact computation.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - transformer-block-components.base.v2
      - transformer-block-components.transfer.v2
      - transformer-block-components.calculate
    prerequisites:
      - anyOf:
          - objective.multi-head-attention
      - anyOf:
          - objective.residuals-normalization-dropout
scenes:
  - id: transformer-block-components.s1
    title: A shared scratchpad called the residual stream
    type: explanation
    depth: intuition
    objective_refs:
      - objective.transformer-block-components
    markdown: |-
      In GPT-2 small, each token is a vector of 768 numbers that passes through 12 identical blocks. No block ever replaces that vector. Each one reads it, computes an update, and *adds* the update back, the residual connection $y = x + F(x)$ from the residuals lesson. Researchers call this running vector the **residual stream**: a shared scratchpad that every block reads from and writes to.

      Each block makes two additions, from two different sublayers:

      1. **Attention** moves information *between* positions: "are" pulls in facts about "keys".
      2. The **MLP** (multilayer perceptron, also called the feed-forward sublayer) then works on each position *by itself*, applying the same small network to every token's vector. It can't see other tokens; whatever it knows about them arrived through attention.

      Modern models normalize the stream just before each sublayer. This is the **pre-norm** block, used by GPT-2 and most later models:

      $$x \leftarrow x + \text{Attention}(\text{Norm}(x)), \qquad x \leftarrow x + \text{MLP}(\text{Norm}(x))$$

      :::mixup "The MLP mixes information between tokens too."
      It doesn't. The MLP sees one token's vector at a time. Only attention moves information across positions. Remove attention and every token would be processed in isolation, however many MLPs you stacked.
      :::
    diagram:
      caption: A pre-norm transformer block. The residual stream runs straight through; each sublayer reads a normalized copy and adds its update.
      description: The residual stream x enters on the left. One copy goes through a norm and then multi-head attention; the attention output is added back to the stream at the first add. The stream continues to a second norm and the MLP, whose output is added back at the second add. The stream then leaves the block, unchanged in shape. The skip arrows carry x directly to each add.
      nodes:
        - id: xin
          label: Residual stream in
          note: T × d_model
          col: 0
          row: 1
          tone: data
        - id: ln1
          label: Norm
          col: 1
          row: 0
          tone: muted
        - id: attn
          label: Multi-head attention
          note: mixes across positions
          col: 2
          row: 0
          tone: accent
        - id: add1
          label: Add
          col: 2
          row: 1
        - id: ln2
          label: Norm
          col: 3
          row: 0
          tone: muted
        - id: mlp
          label: MLP
          note: each position alone, 4× wide
          col: 4
          row: 0
          tone: accent
        - id: add2
          label: Add
          col: 4
          row: 1
        - id: xout
          label: Residual stream out
          note: same shape
          col: 5
          row: 1
          tone: data
      edges:
        - from: xin
          to: ln1
        - from: ln1
          to: attn
        - from: attn
          to: add1
        - from: xin
          to: add1
          label: skip
        - from: add1
          to: ln2
        - from: ln2
          to: mlp
        - from: mlp
          to: add2
        - from: add1
          to: add2
          label: skip
        - from: add2
          to: xout
    bridges:
      - residuals-normalization-dropout
  - id: transformer-block-components.s3
    title: Where the norm goes, and which norm
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.transformer-block-components
    markdown: |-
      The 2017 transformer normalized *after* each addition, $x \leftarrow \text{Norm}(x + F(x))$, called **post-norm**. GPT-2 moved the norm to the start of each branch and added one final norm after the last block. Xiong and colleagues (2020) showed why this matters: with pre-norm the untouched stream gives gradients a clean path, so deep models train stably, often without the careful learning-rate warm-up post-norm needs.

      Which norm? The residuals lesson's **LayerNorm** subtracts the mean and divides by the standard deviation. **RMSNorm** (Zhang and Sennrich, 2019) skips the mean and divides by the root mean square:

      $$\text{LayerNorm}(x) = \gamma \odot \frac{x - \mu}{\sqrt{\sigma^2 + \epsilon}} + \beta \qquad\qquad \text{RMSNorm}(x) = \gamma \odot \frac{x}{\sqrt{\tfrac{1}{d}\sum_i x_i^2 + \epsilon}}$$

      Take $x = [1, 3]$ with $\gamma = 1$, $\beta = 0$, and tiny $\epsilon$:

      | | Step | Result |
      | --- | --- | --- |
      | LayerNorm | mean 2, variance 1: $([1, 3] - 2) / 1$ | $[-1,\ 1]$ |
      | RMSNorm | $\sqrt{(1 + 9)/2} = \sqrt{5} \approx 2.236$: $[1, 3] / 2.236$ | $[0.447,\ 1.342]$ |

      RMSNorm keeps the vector's direction and only fixes its size. It's a little cheaper and works about as well; LLaMA and many later models use it.
  - id: transformer-block-components.s2
    title: "The MLP: widen, bend, narrow"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.transformer-block-components
    markdown: |-
      The classic MLP widens each token's vector to 4 times its size, applies a nonlinearity, and narrows it back:

      $$\text{MLP}(x) = \text{GELU}(x W_1 + b_1)\, W_2 + b_2 \qquad W_1: d \times 4d, \quad W_2: 4d \times d$$

      In GPT-2 small that's 768 → 3,072 → 768. The original transformer used ReLU; GPT-2 uses GELU, a smooth cousin of ReLU.

      Many recent models use **SwiGLU** instead (Shazeer, 2020). It computes two widened copies of $x$ and lets one *gate* the other, entry by entry:

      $$\text{SwiGLU}(x) = \big(\text{SiLU}(x W) \odot x V\big)\, W_2, \qquad \text{SiLU}(z) = z \cdot \sigma(z)$$

      $\sigma$ is the sigmoid, which squeezes any number into 0 to 1, and $\odot$ means multiply matching entries. Suppose the gate branch $xW$ gives $[2, -1]$ and the other branch $xV$ gives $[1, 3]$:

      - $\text{SiLU}(2) = 2 \times 0.881 = 1.762$, and $\text{SiLU}(-1) = -1 \times 0.269 = -0.269$.
      - Gate times branch: $[1.762 \times 1,\ -0.269 \times 3] = [1.762,\ -0.807]$.

      The positive gate lets its entry through almost at full strength; the negative one nearly shuts its entry off. Then $W_2$ narrows the result back to $d$. SwiGLU has three matrices instead of two, so models shrink its hidden width to about $\tfrac{8}{3}d$ to keep the same number of weights. LLaMA-7B, with $d = 4096$, uses 11,008.
    bridges:
      - matrices-tensors
      - nonlinearity
  - id: transformer-block-components.params
    title: Count the weights, about 12·d² per block
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.transformer-block-components
    markdown: |-
      Add up one block, ignoring the small biases and norm gains:

      | Part | Matrices | Weights |
      | --- | --- | --- |
      | Attention | $W_Q, W_K, W_V, W_O$, each $d \times d$ | $4d^2$ |
      | MLP | $W_1$: $d \times 4d$, and $W_2$: $4d \times d$ | $8d^2$ |
      | Whole block | | $12d^2$ |

      For GPT-2 small, $12 \times 768^2 = 7{,}077{,}888$. Two-thirds of every block is MLP.

      :::predict GPT-2 small is called a "124M" model, but 12 blocks × 7.08M is only about 85M. Where's the rest?
      Mostly in the token embedding table: 50,257 tokens × 768 = 38.6M. GPT-2 reuses the same table to turn the final vectors back into vocabulary scores, so it's counted once. Add 786K for the 1,024 learned positions and the small biases and norms, and you land on 124,439,808.
      :::

      ```python run
      n_layer, d, vocab, n_ctx = 12, 768, 50257, 1024     # GPT-2 small

      attn = 4 * d * d + 4 * d            # W_Q, W_K, W_V, W_O and their biases
      mlp = 2 * d * (4 * d) + 4 * d + d   # d -> 4d -> d, with biases
      norms = 2 * (2 * d)                 # two LayerNorms: gain and shift each
      block = attn + mlp + norms
      print(f"one block:        {block:>12,}   (12·d² = {12 * d * d:,})")

      tokens = vocab * d                  # token embeddings, reused as the unembedding
      positions = n_ctx * d               # learned position vectors
      final_norm = 2 * d
      total = tokens + positions + n_layer * block + final_norm
      print(f"token embeddings: {tokens:>12,}")
      print(f"position table:   {positions:>12,}")
      print(f"{n_layer} blocks:        {n_layer * block:>12,}")
      print(f"total:            {total:>12,}")
      ```

      Try GPT-2 medium: 24 layers with $d = 1024$ gives about 355M. Notice how fast the blocks overtake the embedding table as $d$ grows, since blocks scale with $d^2$ and the table only with $d$.
  - id: transformer-block-components.s4
    title: Read a real model's recipe
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.transformer-block-components
    markdown: |-
      Two models can both be "decoder-only transformers" and still differ inside every block. Compare GPT-2 (2019) with LLaMA (2023):

      | Choice | GPT-2 | LLaMA |
      | --- | --- | --- |
      | Norm placement | Pre-norm, plus a final norm | Pre-norm, plus a final norm |
      | Norm type | LayerNorm | RMSNorm |
      | MLP | GELU, $4d$ wide | SwiGLU, about $\tfrac{8}{3}d$ wide |
      | Positions | Learned table | RoPE |

      Both blocks take a $T \times d$ stream in and put a $T \times d$ stream out, so a diagram of shapes alone can't tell them apart. When you trace a model, read its config file or code for these four choices first. Then every number you compute will match the real thing.
  - id: transformer-block-components.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.transformer-block-components
    markdown: Weight counts for new model sizes, an RMSNorm to compute, and a few training runs where a block choice made the difference.
    takeaway: |-
      A block adds two updates to the residual stream: attention, which mixes across positions, then a per-token MLP, each reading a normalized copy of the stream. Together they hold about 12·d² weights.
  - id: transformer-block-components.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.transformer-block-components
    markdown: |-
      Attention mixes across tokens; the feed-forward sublayer transforms each token’s current features. Residual and normalization rules connect these operations, and their exact order depends on the design.
