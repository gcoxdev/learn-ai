          - id: c
            text: The MLP has a d × 4d and a 4d × d matrix, so it has 8d², twice attention's 4d².
        feedback: d² = 1,638,400, so attention is 4d² = 6,553,600 and the MLP is 8d² = 13,107,200.
    numeric_fields:
      - id: attn
        label: Attention weights
      - id: mlp
        label: MLP weights
    absolute_tolerance: 0.5
