schema_version: 0.2-draft
lesson:
  id: transformer-block-components
  version: 0.1.0-draft
  title: Separate mixing across tokens from transforming one token
  state: draft
  summary: Transformer blocks combine attention, position-wise feed-forward computation, residual additions, and
    normalization; gated activations and placement conventions change the exact computation.
  slot: M15.6
  category: learning
  minutes: 12
  sources:
  - title: The Llama 3 Herd of Models
    url: https://arxiv.org/abs/2407.21783
  - title: GLU Variants Improve Transformer
    url: https://arxiv.org/abs/2002.05202
objectives:
- id: objective.transformer-block-components
  version: 1-draft
  statement: Transformer blocks combine attention, position-wise feed-forward computation, residual additions, and
    normalization; gated activations and placement conventions change the exact computation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - transformer-block-components.base
  - transformer-block-components.transfer
  prerequisites:
  - anyOf:
    - objective.multi-head-attention
  - anyOf:
