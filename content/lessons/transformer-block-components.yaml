assessment_families:
  - id: transformer-block-components.base
    objective_ref: objective.transformer-block-components
    task: base
    response_type: single_choice
    points: 1
    hint: 'Follow a gated feed-forward path: trace the inputs, operation, and result before choosing.'
    remediation_scene: transformer-block-components.s2
    variants:
      - id: transformer-block-components.base.1
        prompt: Which standard sublayer directly mixes information across token positions?
        options:
          - id: b
            text: A purely position-wise feed-forward map
          - id: c
            text: Only a learned scalar gain
          - id: a
            text: Attention
        answer: a
        feedback: Attention combines values from permitted positions.
        retired: true
      - id: transformer-block-components.base.2
        prompt: What does a gated feed-forward design multiply?
        options:
          - id: c
            text: Every output probability by zero
          - id: a
            text: Two transformed feature paths coordinate by coordinate
          - id: b
            text: Only token IDs as vocabulary labels
        answer: a
        feedback: The gate modulates features within the position-wise computation.
        retired: true
  - id: transformer-block-components.transfer
    objective_ref: objective.transformer-block-components
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Inspect a real block before tracing it: trace the inputs, operation, and result before choosing.'
    remediation_scene: transformer-block-components.s4
    variants:
      - id: transformer-block-components.transfer.1
        prompt: Is a SwiGLU gate automatically a softmax probability over experts?
        options:
          - id: c
            text: Only if the hidden width is large
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Feature gating and expert routing are different mechanisms.
        retired: true
      - id: transformer-block-components.transfer.2
        prompt: Two blocks have identical outer shapes. Does that imply identical normalization order?
        options:
          - id: a
            text: No; inspect the architecture
          - id: b
            text: Yes; shapes determine every operation
          - id: c
            text: Only in a decoder
        answer: a
        feedback: Shape compatibility does not specify the computation graph.
        retired: true
  - id: transformer-block-components.base.v2
    objective_ref: objective.transformer-block-components
    task: base
    response_type: single_choice
    points: 1
    hint: 'Write out the pre-norm block, x ← x + Attention(Norm(x)) then x ← x + MLP(Norm(x)), and ask which piece does the job in the question.'
    remediation_scene: transformer-block-components.s1
    variants:
      - id: transformer-block-components.base.v2.1
        prompt: In "the keys to the cabinet are rusty", the vector for "are" needs to learn that its subject is plural. Which part of a block can carry that information over from "keys"?
        options:
          - id: b
            text: The MLP, since it is the widest part of the block
          - id: c
            text: The norm, since it rescales every position together
          - id: a
            text: Attention, since it mixes values across positions
        answer: a
        feedback: Only attention moves information between positions. The MLP is wide but sees one token at a time, and each norm works on one token's vector alone.
      - id: transformer-block-components.base.v2.2
        prompt: Which line describes one pre-norm attention sublayer?
        options:
          - id: a
            text: x ← x + Attention(Norm(x))
          - id: b
            text: x ← Norm(x + Attention(x))
          - id: c
            text: x ← x + Norm(Attention(x))
        answer: a
        feedback: Pre-norm normalizes the copy that goes into the sublayer and leaves the stream itself untouched. Norm(x + Attention(x)) is the 2017 post-norm layout.
      - id: transformer-block-components.base.v2.3
        prompt: What does RMSNorm (with gain 1) output for the vector [3, 4]?
        options:
          - id: c
            text: '[0.6, 0.8]'
          - id: a
            text: '[0.849, 1.131]'
          - id: b
            text: '[−1, 1]'
        answer: a
        feedback: The root mean square is √((9 + 16)/2) = √12.5 ≈ 3.536, and [3, 4] / 3.536 ≈ [0.849, 1.131]. [−1, 1] is LayerNorm, which subtracts the mean, and [0.6, 0.8] divides by the length 5 instead of the root mean square.
      - id: transformer-block-components.base.v2.4
        prompt: In a SwiGLU MLP, the gate branch gives [2, −1] and the other branch gives [1, 3]. What is multiplied, entry by entry, before W_2?
        options:
          - id: b
            text: '[2, −1] times [1, 3], giving [2, −3]'
          - id: a
            text: SiLU of [2, −1] times [1, 3], giving [1.762, −0.807]
          - id: c
            text: SiLU of both branches, giving [1.288, −0.769]
        answer: a
        feedback: Only the gate branch goes through SiLU, and then it multiplies the other branch entry by entry. Skipping SiLU loses the gating, and applying it to both branches changes the second one too.
  - id: transformer-block-components.transfer.v2
    objective_ref: objective.transformer-block-components
    task: transfer
    response_type: single_choice
    points: 1
    hint: Think about the residual stream as a highway that every block adds to. Ask what keeps flowing when one sublayer changes, and where the norm sits relative to the addition.
    remediation_scene: transformer-block-components.s3
    variants:
      - id: transformer-block-components.transfer.v2.1
        prompt: A team training a 48-layer post-norm transformer sees the loss blow up in the first few hundred steps unless they use a long learning-rate warm-up. Which architecture change most directly targets this?
        options:
          - id: a
            text: Move each norm to the start of its branch (pre-norm) and add a final norm
          - id: b
            text: Remove the residual connections so the norms control every layer's scale
          - id: c
            text: Switch the MLP from GELU to SwiGLU so the updates are gated
        answer: a
        feedback: Pre-norm leaves a clean residual path for gradients, which is what made deep transformers train stably with little or no warm-up. Removing residuals makes depth harder, and SwiGLU changes the MLP, not stability of the stack.
      - id: transformer-block-components.transfer.v2.2
        prompt: A researcher zeroes out the MLP output of block 7 in a 12-block model. The text gets somewhat worse but stays fluent. What best explains why it doesn't collapse?
        options:
          - id: c
            text: Attention in block 7 recomputes whatever the MLP would have added
          - id: b
            text: The norm after block 7 rescales the stream back to its old values
          - id: a
            text: The residual stream still carries everything written before block 7
        answer: a
        feedback: Each block only adds an update, so removing one update leaves the rest of the stream intact for later blocks. Attention doesn't imitate the MLP, and a norm can't restore information that was never added.
      - id: transformer-block-components.transfer.v2.3
        prompt: A model with d = 3072 has a GELU MLP of hidden width 12,288. You switch to SwiGLU and want the same number of MLP weights. What hidden width should you use?
        options:
          - id: b
            text: 12,288, the same width as before
          - id: a
            text: 8,192, about 8/3 of d
          - id: c
            text: 6,144, twice d
        answer: a
        feedback: The GELU MLP has 2 × 3072 × 12288 = 8d² weights. SwiGLU has three d × h matrices, so 3dh = 8d² gives h = 8d/3 = 8,192. Keeping 12,288 would add 50% more weights.
      - id: transformer-block-components.transfer.v2.4
        prompt: A model card lists "RMSNorm, pre-norm, SwiGLU, RoPE". Another lists "LayerNorm, pre-norm, GELU, learned positions". Both map a T × 4096 stream to a T × 4096 stream. What can you conclude?
        options:
          - id: c
            text: Their blocks compute the same function, since the shapes match
          - id: a
            text: Their blocks compute different things despite identical shapes
          - id: b
            text: The first model must be larger, since SwiGLU adds a third matrix
        answer: a
        feedback: Shapes say nothing about which norm, activation, or position method runs inside. SwiGLU does add a matrix, but its hidden width is usually shrunk to keep the weight count the same.
  - id: transformer-block-components.calculate
    objective_ref: objective.transformer-block-components
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Attention has four d × d matrices (4d²). The classic MLP has one d × 4d matrix and one 4d × d matrix (8d²). Ignore biases and norms.
    remediation_scene: transformer-block-components.params
    variants:
      - id: transformer-block-components.calculate.1
        prompt: A transformer block has d = 512 and a classic 4× MLP. Record the attention weights (Q, K, V, O) and the MLP weights, ignoring biases and norms.
        answers:
          attn: 1048576
          mlp: 2097152
        reason_answer: b
        reason_options:
          - id: a
            text: The MLP is one d × 4d matrix, so it has 4d² weights, the same as attention.
          - id: b
            text: The MLP has a d × 4d and a 4d × d matrix, so it has 8d², twice attention's 4d².
          - id: c
            text: The MLP works on one token at a time, so it has only d² weights.
        feedback: Attention is 4 × 512² = 1,048,576 and the MLP is 8 × 512² = 2,097,152, for 12d² = 3,145,728 in the block. Forgetting the narrowing matrix W_2 halves the MLP count.
      - id: transformer-block-components.calculate.2
