schema_version: 0.2-draft
lesson:
  id: transformer-block-components
  version: 0.3.0-draft
  title: Separate mixing across tokens from transforming one token
  state: draft
  summary: Separate attention’s mixing across positions from the per-position calculations and shortcuts inside
    a transformer block.
  slot: M15.6
  category: learning
  sources:
  - title: The Llama 3 Herd of Models
    url: https://arxiv.org/abs/2407.21783
  - title: GLU Variants Improve Transformer
    url: https://arxiv.org/abs/2002.05202
objectives:
- id: objective.transformer-block-components
  version: 1-draft
  statement: Transformer blocks combine attention, position-wise feed-forward computation, residual additions,
    and normalization; gated activations and placement conventions change the exact computation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - transformer-block-components.base
  - transformer-block-components.transfer
  prerequisites:
  - anyOf:
    - objective.multi-head-attention
  - anyOf:
    - objective.residuals-normalization-dropout
scenes:
- id: transformer-block-components.s1
  title: Mix across positions, then transform each one
  type: explanation
  depth: intuition
  objective_refs:
  - objective.transformer-block-components
  markdown: 'Attention mixes information across the positions it may use. A **position-wise feed-forward**
    sublayer then applies the same learned rule separately to each token’s current vector. **Feed-forward**
    means the calculation follows its transformations without carrying a recurrent state between positions.


    The token’s vector already contains context from earlier mixing. The sublayer can transform that context,
    but does not directly read another position or create a new attention matrix. These two kinds of operation
    therefore do different jobs in the block.'
  text_mode: 'Attention mixes information across the positions it may use. A **position-wise feed-forward**
    sublayer then applies the same learned rule separately to each token’s current vector. **Feed-forward**
    means the calculation follows its transformations without carrying a recurrent state between positions.


    The token’s vector already contains context from earlier mixing. The sublayer can transform that context,
    but does not directly read another position or create a new attention matrix. These two kinds of operation
    therefore do different jobs in the block.'
  bridges: []
- id: transformer-block-components.s2
  title: Follow two branches through a gate
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.transformer-block-components
  markdown: 'A gated feed-forward design projects one input along two branches, applies an activation to one,
    multiplies matching coordinates across the branches, and projects the result back.


    **SiLU** is the activation z × sigmoid(z), where sigmoid maps a score to the range 0 to 1. **SwiGLU** uses
    SiLU on one branch before the multiplication. If the transformed gate is [0.5, 2] and the other branch
    is [4, −1], their elementwise product is [2, −2].


    This gate scales features; it is not a normalized probability distribution over tokens or experts.'
  text_mode: 'A gated feed-forward design projects one input along two branches, applies an activation to one,
    multiplies matching coordinates across the branches, and projects the result back.


    **SiLU** is the activation z × sigmoid(z), where sigmoid maps a score to the range 0 to 1. **SwiGLU** uses
    SiLU on one branch before the multiplication. If the transformed gate is [0.5, 2] and the other branch
    is [4, −1], their elementwise product is [2, −2].


    This gate scales features; it is not a normalized probability distribution over tokens or experts.'
  bridges:
  - matrices-tensors
- id: transformer-block-components.s3
  title: Add the update and check the normalization rule
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.transformer-block-components
  markdown: 'A **residual addition** combines an incoming representation with a computed update. Normalization
    may occur before or after a sublayer, depending on the design.


    **Layer normalization** subtracts a mean and rescales. Common **RMSNorm** rescales without subtracting
    the mean. RMS means **root mean square**: square the entries, average them, and take the square root. For
    [1, 3], the RMS is √5, giving [1/√5, 3/√5] after division. Both entries remain positive.


    The practical formula also includes learned gains and a small **stabilizer** to avoid problematic division
    near zero. Check that exact formula and the order of operations when tracing a real block.'
  text_mode: 'A **residual addition** combines an incoming representation with a computed update. Normalization
    may occur before or after a sublayer, depending on the design.


    **Layer normalization** subtracts a mean and rescales. Common **RMSNorm** rescales without subtracting
    the mean. RMS means **root mean square**: square the entries, average them, and take the square root. For
    [1, 3], the RMS is √5, giving [1/√5, 3/√5] after division. Both entries remain positive.


    The practical formula also includes learned gains and a small **stabilizer** to avoid problematic division
    near zero. Check that exact formula and the order of operations when tracing a real block.'
  bridges: []
- id: transformer-block-components.s4
  title: Inspect a real block before tracing it
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.transformer-block-components
  markdown: Draw the order of normalization, projection, activation, gating, attention, and residual addition
    from the implementation or report. Check widths and data types. Architecture labels alone do not settle
    these details. A whole block can preserve input-output shape while doing substantially different internal
    computation.
  text_mode: Draw the order of normalization, projection, activation, gating, attention, and residual addition
    from the implementation or report. Check widths and data types. Architecture labels alone do not settle
    these details. A whole block can preserve input-output shape while doing substantially different internal
    computation.
  bridges: []
- id: transformer-block-components.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.transformer-block-components
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Attention mixes across tokens; the feed-forward sublayer transforms each token’s current features.
    Residual and normalization rules connect these operations, and their exact order depends on the design.
