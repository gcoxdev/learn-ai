schema_version: 0.2-draft
lesson:
  id: attribution-and-counterfactual-explanations
  version: 0.1.0-draft
  title: Ask what an explanation method actually measures
  state: draft
  summary: Feature attributions and counterfactual explanations summarize model behavior under specified baselines
    or perturbations; they do not automatically identify real-world causes or feasible interventions.
  slot: M28.6
  category: learning
  minutes: 12
  sources:
  - title: Integrated Gradients
    url: https://arxiv.org/abs/1703.01365
  - title: LIME
    url: https://arxiv.org/abs/1602.04938
  - title: Counterfactual Explanations
    url: https://arxiv.org/abs/1711.00399
objectives:
- id: objective.attribution-and-counterfactual-explanations
  version: 1-draft
  statement: Feature attributions and counterfactual explanations summarize model behavior under specified baselines
    or perturbations; they do not automatically identify real-world causes or feasible interventions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - attribution-and-counterfactual-explanations.base
  - attribution-and-counterfactual-explanations.transfer
  prerequisites:
  - anyOf:
    - objective.automatic-differentiation
  - anyOf:
    - objective.controlled-experiments
scenes:
- id: attribution-and-counterfactual-explanations.s1
  title: Attribute a prediction relative to a reference
  type: explanation
  depth: intuition
  objective_refs:
  - objective.attribution-and-counterfactual-explanations
  markdown: Gradient-based methods examine local sensitivity, while integrated gradients accumulate sensitivity
    along a path from a baseline input. Perturbation methods fit or compare outputs around selected changes. The
    baseline, path, and neighborhood define the question being answered.
  text_mode: Gradient-based methods examine local sensitivity, while integrated gradients accumulate sensitivity
    along a path from a baseline input. Perturbation methods fit or compare outputs around selected changes. The
    baseline, path, and neighborhood define the question being answered.
  bridges: []
- id: attribution-and-counterfactual-explanations.s2
  title: Trace a sensitivity example
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attribution-and-counterfactual-explanations
  markdown: If a model’s output changes sharply when one pixel value changes slightly, that pixel has high local
    sensitivity under the chosen point. This does not prove the pixel represents the human concept most responsible
    for the decision. Saturation and correlated features can complicate interpretation.
  text_mode: If a model’s output changes sharply when one pixel value changes slightly, that pixel has high local
    sensitivity under the chosen point. This does not prove the pixel represents the human concept most responsible
    for the decision. Saturation and correlated features can complicate interpretation.
  bridges:
  - derivatives
  - integrals-density
- id: attribution-and-counterfactual-explanations.s3
  title: Construct a model counterfactual
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attribution-and-counterfactual-explanations
  markdown: A counterfactual explanation might find an input change that flips the model’s output. It must respect
    feasible, meaningful, and permitted changes to be actionable. Changing an immutable attribute or creating an
    impossible feature combination may explain a decision boundary without offering a valid real-world action.
  text_mode: A counterfactual explanation might find an input change that flips the model’s output. It must respect
    feasible, meaningful, and permitted changes to be actionable. Changing an immutable attribute or creating an
    impossible feature combination may explain a decision boundary without offering a valid real-world action.
  bridges: []
- id: attribution-and-counterfactual-explanations.s4
  title: Validate explanation stability and scope
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attribution-and-counterfactual-explanations
  markdown: Compare plausible baselines and perturbations, test whether important-feature removal affects behavior,
    and inspect artifacts. An explanation of the model’s function is distinct from a causal explanation of the world
    that produced its data. State which claim the method and evidence support.
  text_mode: Compare plausible baselines and perturbations, test whether important-feature removal affects behavior,
    and inspect artifacts. An explanation of the model’s function is distinct from a causal explanation of the world
    that produced its data. State which claim the method and evidence support.
  bridges: []
- id: attribution-and-counterfactual-explanations.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.attribution-and-counterfactual-explanations
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: attribution-and-counterfactual-explanations.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.attribution-and-counterfactual-explanations
  markdown: Feature attributions and counterfactual explanations summarize model behavior under specified baselines
    or perturbations; they do not automatically identify real-world causes or feasible interventions.
  text_mode: Feature attributions and counterfactual explanations summarize model behavior under specified baselines
    or perturbations; they do not automatically identify real-world causes or feasible interventions.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - attribution-and-counterfactual-explanations.s1
    - attribution-and-counterfactual-explanations.s2
    - attribution-and-counterfactual-explanations.s3
    - attribution-and-counterfactual-explanations.s4
    - attribution-and-counterfactual-explanations.check
    - attribution-and-counterfactual-explanations.recap
    gate_refs:
    - gate.core
assessment_families:
- id: attribution-and-counterfactual-explanations.base
  objective_ref: objective.attribution-and-counterfactual-explanations
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace a sensitivity example: trace the inputs, operation, and result before choosing.'
  remediation_scene: attribution-and-counterfactual-explanations.s2
  variants:
  - id: attribution-and-counterfactual-explanations.base.1
    prompt: What affects integrated-gradient attribution?
    options:
    - id: c
      text: Only output formatting
    - id: a
      text: The baseline and integration path as well as the model
    - id: b
      text: Only the feature names
    answer: a
    feedback: Attribution is relative to a specified computation.
  - id: attribution-and-counterfactual-explanations.base.2
    prompt: Does high pixel sensitivity identify a human-interpretable cause automatically?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if the gradient is positive
    answer: a
    feedback: Local numerical sensitivity and semantic causality differ.
- id: attribution-and-counterfactual-explanations.transfer
  objective_ref: objective.attribution-and-counterfactual-explanations
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Validate explanation stability and scope: trace the inputs, operation, and result before choosing.'
  remediation_scene: attribution-and-counterfactual-explanations.s4
  variants:
  - id: attribution-and-counterfactual-explanations.transfer.1
    prompt: Why can a model-flipping counterfactual be unusable?
    options:
    - id: a
      text: It may require infeasible or impermissible feature changes
    - id: b
      text: Every input change is actionable
    - id: c
      text: It always identifies a real intervention
    answer: a
    feedback: Actionability needs constraints beyond flipping a prediction.
  - id: attribution-and-counterfactual-explanations.transfer.2
    prompt: Is explaining a model’s decision boundary identical to explaining real-world causation?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only for neural networks
    - id: a
      text: 'No'
    answer: a
    feedback: The model can encode correlations rather than causal mechanisms.
