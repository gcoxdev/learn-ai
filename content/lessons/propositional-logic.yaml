schema_version: 0.2-draft
lesson:
  id: propositional-logic
  version: 0.3.0-draft
  title: Reason with statements that are true or false
  state: draft
  summary: Use a rain-and-wet-path example to see which conclusions follow from a rule, and which are guesses.
  slot: M04.1
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.propositional-logic
  version: 1-draft
  statement: Propositional logic combines statements with precise connectives; truth tables and valid inference
    distinguish what follows from what merely sounds plausible.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - propositional-logic.base
  - propositional-logic.transfer
  prerequisites:
  - anyOf:
    - objective.discrete-math
  - anyOf:
    - objective.ai-traditions
scenes:
- id: propositional-logic.s1
  title: Give each statement a clear meaning
  type: explanation
  depth: intuition
  objective_refs:
  - objective.propositional-logic
  markdown: Let R mean “it is raining” and W mean “the path is wet.” A proposition is a statement treated as
    true or false within an interpretation. AND requires both inputs true. OR in ordinary propositional logic
    includes the case where both are true. NOT reverses a truth value.
  text_mode: Let R mean “it is raining” and W mean “the path is wet.” A proposition is a statement treated
    as true or false within an interpretation. AND requires both inputs true. OR in ordinary propositional
    logic includes the case where both are true. NOT reverses a truth value.
  bridges: []
- id: propositional-logic.s2
  title: What an if–then rule allows
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.propositional-logic
  markdown: 'Consider the rule “If it is raining, the path is wet.” Try all four possibilities: rain with a
    wet path, rain with a dry path, no rain with a wet path, and no rain with a dry path. Only rain with a
    dry path breaks the rule.


    We write this as “R implies W.” When R is false, the rule does not tell us whether W is true or false.
    A sprinkler could wet the path too. A **truth table** records these combinations so we can check the rule
    systematically.'
  text_mode: 'Consider the rule “If it is raining, the path is wet.” Try all four possibilities: rain with
    a wet path, rain with a dry path, no rain with a wet path, and no rain with a dry path. Only rain with
    a dry path breaks the rule.


    We write this as “R implies W.” When R is false, the rule does not tell us whether W is true or false.
    A sprinkler could wet the path too. A **truth table** records these combinations so we can check the rule
    systematically.'
  bridges:
  - discrete-math
- id: propositional-logic.s3
  title: Follow the rule forward
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.propositional-logic
  markdown: 'Suppose we accept two statements: it is raining, and rain implies a wet path. We can then conclude
    that the path is wet. This inference rule is called **modus ponens**.


    The reverse does not follow. Seeing a wet path alone cannot tell us whether it rained or a sprinkler ran.
    Logic tells us which conclusions follow from the supplied statements; we still need observations to check
    those starting statements.'
  text_mode: 'Suppose we accept two statements: it is raining, and rain implies a wet path. We can then conclude
    that the path is wet. This inference rule is called **modus ponens**.


    The reverse does not follow. Seeing a wet path alone cannot tell us whether it rained or a sprinkler ran.
    Logic tells us which conclusions follow from the supplied statements; we still need observations to check
    those starting statements.'
  bridges: []
- id: propositional-logic.s4
  title: From one rule to a knowledge base
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.propositional-logic
  markdown: 'The **premises** are the statements we start by accepting. A **knowledge base** collects such
    statements and rules. It **entails** a conclusion when that conclusion holds in every situation where all
    its premises hold.


    For example, an eligibility checker can combine recorded facts with rules about who qualifies. The rules
    need precise meanings: “older than 18” and “18 or older” produce different results for an 18-year-old.
    Clear language is part of building the formal representation.'
