assessment_families:
- id: propositional-logic.base
  objective_ref: objective.propositional-logic
  task: base
  response_type: single_choice
  points: 1
  hint: 'Read implication as a constraint: trace the inputs, operation, and result before choosing.'
  remediation_scene: propositional-logic.s2
  variants:
  - id: propositional-logic.base.1
    prompt: Given P and P implies Q, what follows?
    options:
    - id: b
      text: Not Q
    - id: c
      text: Every unrelated statement
    - id: a
      text: Q
    answer: a
    feedback: Modus ponens licenses Q from the premise and implication.
  - id: propositional-logic.base.2
    prompt: When is inclusive P OR Q false?
    options:
    - id: c
      text: Whenever exactly one is true
    - id: a
      text: When both are false
    - id: b
      text: When both are true
    answer: a
    feedback: Inclusive OR is true if at least one input is true.
- id: propositional-logic.transfer
  objective_ref: objective.propositional-logic
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Connect logic to a system: trace the inputs, operation, and result before choosing.'
  remediation_scene: propositional-logic.s4
  variants:
  - id: propositional-logic.transfer.1
    prompt: A rule says rain implies wet ground. You observe wet ground. Is rain logically forced?
    options:
    - id: c
      text: Only if the word rain appears twice
    - id: a
      text: No; other causes are compatible
    - id: b
      text: Yes; implication is always reversible
    answer: a
    feedback: Affirming the consequent is not a valid inference.
  - id: propositional-logic.transfer.2
    prompt: A valid proof uses an inaccurate factual premise. What does validity establish?
    options:
    - id: a
      text: The conclusion follows from the premises, not that the premises are true
    - id: b
      text: That every premise matches reality
    - id: c
      text: That the data collection was unbiased
    answer: a
    feedback: Logical validity and factual accuracy are distinct.
