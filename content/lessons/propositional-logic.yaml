schema_version: 0.2-draft
lesson:
  id: propositional-logic
  version: 0.4.0-draft
  title: Reason with statements that are true or false
  state: draft
  summary: Your smart home switches the hallway light on at 3 a.m. Was that the rule working or breaking? Learn to read if–then rules exactly, with truth tables you generate yourself.
  slot: M04.1
  category: learning
  sources:
    - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
      url: https://aima.cs.berkeley.edu/
objectives:
  - id: objective.propositional-logic
    version: 2-draft
    statement: Propositional logic combines statements with precise connectives; truth tables and valid inference distinguish what follows from what merely sounds plausible.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - propositional-logic.base.v2
      - propositional-logic.transfer.v2
      - propositional-logic.calc
    prerequisites:
      - anyOf:
          - objective.discrete-math
      - anyOf:
          - objective.ai-traditions
scenes:
  - id: propositional-logic.s1
    title: A smart home that only knows true and false
    type: explanation
    depth: intuition
    objective_refs:
      - objective.propositional-logic
    markdown: |-
      You give your smart home one rule: *"If there's motion in the hallway and it's night, turn the hallway light on."* At 3 a.m. the cat wanders past and the light clicks on. At noon you walk by and it stays off. The system isn't thinking about cats. It checks a few true-or-false statements and combines them.

      A **proposition** is a statement that is either true or false, like "there's motion in the hallway." Logic gives each one a letter:

      | Letter | Proposition |
      | --- | --- |
      | M | There's motion in the hallway |
      | N | It's night |
      | L | The hallway light is on |

      **Connectives** join propositions into bigger statements:

      | Connective | Written | True when… |
      | --- | --- | --- |
      | AND | $M \land N$ | both parts are true |
      | OR | $M \lor N$ | at least one part is true |
      | NOT | $\lnot N$ | the part is false (it's daytime) |
      | IF…THEN | $M \to L$ | every case except "M true, L false" |

      Your rule is $(M \land N) \to L$. **Propositional logic** studies statements built this way, and which conclusions they force.

      :::mixup "OR means one or the other, but not both."
      "Tea or coffee?" usually means pick one. In logic, OR is *inclusive*: $M \lor N$ is true when both parts are true. The pick-one version is called *exclusive or* (XOR).
      :::
    bridges: []
  - id: propositional-logic.s2
    title: The only way to break an if–then rule
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.propositional-logic
    markdown: |-
      Start with a simpler rule, $M \to L$: "if there's motion, the light is on." A **truth table** lists every combination of true (T) and false (F), with the rule's value in the last column.

      | M (motion) | L (light on) | $M \to L$ |
      | --- | --- | --- |
      | T | T | T |
      | T | F | **F** |
      | F | T | T |
      | F | F | T |

      Only one row breaks the rule: motion with the light off.

      :::predict You come home to find the hallway light on, and the motion log is empty. Was the rule broken?
      No. That's row three. The rule only promises what happens *when there's motion*; maybe you flipped the switch. A rule whose condition is false counts as true, because nothing it promised has failed.
      :::

      An if–then statement like $M \to L$ is called an **implication**. M is its *condition* and L its *consequence*. Counting "condition false" rows as true feels odd, but it's how we judge promises: if a friend says "If it rains, I'll bring an umbrella" and it stays sunny, they haven't broken their word.
    bridges:
      - discrete-math
  - id: propositional-logic.truth-tables
    title: Let Python write the truth table
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.propositional-logic
    markdown: |-
      Back to the full rule, $(M \land N) \to L$. Three letters give $2 \times 2 \times 2 = 8$ rows, and each extra letter doubles the count. A computer lists them instantly:

      ```python run
      from itertools import product

      def implies(a, b):
          return (not a) or b      # false only when a is true and b is false

      def rule(m, n, l):
          return implies(m and n, l)   # (M and N) -> L

      print("M      N      L      rule holds?")
      count = 0
      for m, n, l in product([True, False], repeat=3):
          ok = rule(m, n, l)
          count += ok
          print(f"{m!s:6} {n!s:6} {l!s:6} {ok}")
      print("rule holds in", count, "of 8 rows")
      ```

      The rule fails in exactly one row: motion at night with the light off.

      :::try Loosen the rule
      Change the rule line to `implies(m or n, l)`, meaning "motion *or* night turns the light on." Predict how many rows satisfy it, then run it. (You should get 5: it now fails in the three rows where the light is off and M or N is true.)
      :::
    bridges: []
  - id: propositional-logic.s3
    title: Run the rule forward, never backward
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.propositional-logic
    markdown: |-
      Now use $M \to L$ to draw conclusions. Suppose the motion log shows motion (M is true). In the truth table, the only row where both the rule and M are true has L true. So L follows. This pattern is called **modus ponens**: from "if M then L" and "M," conclude "L."

      Or suppose the light is off ($\lnot L$). The only row where the rule holds and L is false has M false, so nobody walked by. This is **modus tollens**: from "if M then L" and "not L," conclude "not M."

      | You know | Tempting conclusion | Valid? |
      | --- | --- | --- |
      | $M \to L$ and $M$ | $L$ | Yes (modus ponens) |
      | $M \to L$ and $\lnot L$ | $\lnot M$ | Yes (modus tollens) |
      | $M \to L$ and $L$ | $M$ | No (affirming the consequent) |
      | $M \to L$ and $\lnot M$ | $\lnot L$ | No (denying the antecedent) |

      :::mixup "The light is on, so there must have been motion."
      This runs the rule backward: row three has the light on with no motion, because you flipped the switch. Engineers make the same slip: "the server crashes when memory runs out; it crashed; so memory ran out."
      :::

      A valid pattern carries truth forward from the premises, and it carries mistakes forward too. "If an animal is a mammal, it doesn't lay eggs; the platypus is a mammal; so the platypus doesn't lay eggs" is flawless modus ponens, yet platypuses do lay eggs: the first premise was wrong. So when a conclusion turns out false, check the premises as well as the steps.
    bridges: []
  - id: propositional-logic.s4
    title: Entailment means true in every row that fits
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.propositional-logic
    markdown: |-
      A **knowledge base** is the collection of statements a system accepts; each one is a **premise**. The knowledge base **entails** a conclusion when the conclusion is true in every truth-table row where all the premises are true.

      *Knowledge base 1:* $(M \land N) \to L$, $M$, $N$. Only one of the 8 rows makes all three premises true: M, N, L all true. L is true there, so KB 1 entails L.

      *Knowledge base 2:* $(M \land N) \to L$, $L$. Four rows make both premises true (L true, any M and N). M is false in two of them, so KB 2 does *not* entail M: affirming the consequent, caught mechanically.

      :::papers Entailment in textbook notation
      Each row is called a **model**, one possible world. Textbooks write "KB entails $\alpha$" as $KB \models \alpha$:

      $$KB \models \alpha \quad\text{if and only if}\quad \text{models}(KB) \subseteq \text{models}(\alpha)$$

      For KB 1, models(KB) is the single row (T, T, T), inside models(L). For KB 2, two of its four rows fall outside models(M).
      :::

      Checking rows this way is called **model checking**. Two practical notes. Pin down what each letter means before writing rules: does "night" start at sunset or at 10 p.m.? And $n$ letters need $2^n$ rows, so a home with 40 sensors and switches has over a trillion. The proof search lesson shows how solvers avoid listing them all.
    bridges: []
  - id: propositional-logic.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.propositional-logic
    markdown: Sprinklers, thermostats, parking signs, and a few truth tables to count test whether you can run a rule in the right direction.
    takeaway: |-
      An if–then rule is broken only when its condition is true and its consequence is false. A conclusion follows when it's true in every row where all the premises are true, so run rules forward, never backward.
  - id: propositional-logic.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.propositional-logic
    markdown: |-
      An if–then rule tells you what follows when its condition holds. A truth table helps you check the cases without accidentally reversing the rule.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - propositional-logic.s1
        - propositional-logic.s2
        - propositional-logic.truth-tables
        - propositional-logic.s3
        - propositional-logic.s4
        - propositional-logic.check
      gate_refs:
        - gate.core
  scene_aliases:
    propositional-logic.recap: propositional-logic.check
assessment_families:
  - id: propositional-logic.base
    objective_ref: objective.propositional-logic
    task: base
    response_type: single_choice
    points: 1
    hint: 'Read implication as a constraint: trace the inputs, operation, and result before choosing.'
    remediation_scene: propositional-logic.s2
    variants:
      - id: propositional-logic.base.1
        prompt: Given P and P implies Q, what follows?
        options:
          - id: b
            text: Not Q
          - id: c
            text: Every unrelated statement
          - id: a
            text: Q
        answer: a
        feedback: Modus ponens licenses Q from the premise and implication.
        retired: true
      - id: propositional-logic.base.2
        prompt: When is inclusive P OR Q false?
        options:
          - id: c
            text: Whenever exactly one is true
          - id: a
            text: When both are false
          - id: b
            text: When both are true
        answer: a
        feedback: Inclusive OR is true if at least one input is true.
        retired: true
  - id: propositional-logic.transfer
    objective_ref: objective.propositional-logic
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Connect logic to a system: trace the inputs, operation, and result before choosing.'
    remediation_scene: propositional-logic.s4
    variants:
      - id: propositional-logic.transfer.1
        prompt: A rule says rain implies wet ground. You observe wet ground. Is rain logically forced?
        options:
          - id: c
            text: Only if the word rain appears twice
          - id: a
            text: No; other causes are compatible
          - id: b
            text: Yes; implication is always reversible
        answer: a
        feedback: Affirming the consequent is not a valid inference.
        retired: true
      - id: propositional-logic.transfer.2
        prompt: A valid proof uses an inaccurate factual premise. What does validity establish?
        options:
          - id: a
            text: The conclusion follows from the premises, not that the premises are true
          - id: b
            text: That every premise matches reality
          - id: c
            text: That the data collection was unbiased
        answer: a
        feedback: Logical validity and factual accuracy are distinct.
        retired: true
  - id: propositional-logic.base.v2
    objective_ref: objective.propositional-logic
    task: base
    response_type: single_choice
    points: 1
    hint: Find the truth-table rows where everything you know is true. A conclusion follows only if it holds in every one of those rows.
    remediation_scene: propositional-logic.s3
    variants:
      - id: propositional-logic.base.v2.1
        prompt: 'A garden rule says: if the soil is dry (D), the sprinkler runs (S). The log shows the sprinkler ran. What can you conclude about the soil?'
        options:
          - id: b
            text: It was dry, since dry soil is what triggers the sprinkler
          - id: a
            text: It may or may not have been dry; something else could start it
          - id: c
            text: It was wet, since the rule only describes dry soil
        answer: a
        feedback: Knowing S only rules out the row "D true, S false," which leaves rows with D true and D false. Concluding "dry" runs the rule backward, the mistake called affirming the consequent.
      - id: propositional-logic.base.v2.2
        prompt: The rule is D → S (dry soil means the sprinkler runs), and the rule is working. The log shows the sprinkler did not run. What follows?
        options:
          - id: c
            text: The soil was dry, but the sprinkler must have failed
          - id: b
            text: Nothing, unless we also know whether D is true
          - id: a
            text: The soil was not dry
        answer: a
        feedback: This is modus tollens. The only row where D → S holds and S is false has D false. "Dry, but the sprinkler failed" is exactly the row the working rule forbids.
      - id: propositional-logic.base.v2.3
        prompt: Which situation breaks the rule "if there's motion, the light is on"?
        options:
          - id: b
            text: The light is on though nobody walked by
          - id: a
            text: Someone walks by and the light stays off
          - id: c
            text: Nobody walks by and the light stays off
        answer: a
        feedback: An implication is false only when its condition is true and its consequence false. With no motion, the rule promises nothing, so the light may be on or off.
      - id: propositional-logic.base.v2.4
        prompt: An alarm rule says it sounds if the door opens OR the window opens. Both open at the same moment. What does the rule say?
        options:
          - id: a
            text: The alarm sounds, because OR is true when both parts are true
          - id: c
            text: The alarm stays silent, because OR means exactly one of the two
          - id: b
            text: The rule is silent, because it only lists the two events separately
        answer: a
        feedback: Logical OR is inclusive, so "door or window" is true when both open. The exactly-one reading is a different connective, exclusive or (XOR).
      - id: propositional-logic.base.v2.5
        prompt: A knowledge base holds (M ∧ N) → L and L. Why doesn't it entail M?
        options:
          - id: c
            text: M isn't listed as a premise, so it can't appear in a conclusion
          - id: b
            text: A true L makes the rule's condition false in every row
          - id: a
            text: M is false in some rows where both premises are true
        answer: a
        feedback: Four rows make both premises true (L true, any M and N), and M is false in two of them. Entailment needs the conclusion true in all such rows. Conclusions can mention letters that aren't premises, as L in KB 1 shows.
  - id: propositional-logic.transfer.v2
    objective_ref: objective.propositional-logic
    task: transfer
    response_type: single_choice
    points: 1
    hint: Translate the situation into a condition and a consequence. Then ask whether you are reasoning forward from the condition or backward from the consequence.
    remediation_scene: propositional-logic.s3
    variants:
      - id: propositional-logic.transfer.v2.1
        prompt: 'A class rule says: "If you score above 90, you get a gold star." Mia got a gold star. Her friend says, "So she scored above 90." What is wrong with that?'
        options:
          - id: b
            text: The rule is broken whenever someone scores 90 or below
          - id: a
            text: The rule allows gold stars to be given for other reasons
          - id: c
            text: The friend used modus tollens where modus ponens was needed
        answer: a
        feedback: The friend reasoned from the consequence back to the condition (affirming the consequent). The rule says nothing about students scoring 90 or below, so it's not broken by them either.
      - id: propositional-logic.transfer.v2.2
        prompt: 'A parking sign says: "If it''s a weekday and before 6 p.m., you must pay." It''s Saturday at 3 p.m. What does the sign tell you?'
        options:
          - id: c
            text: You must pay, because it's still before 6 p.m.
          - id: a
            text: The sign is silent about today, since its condition is false
          - id: b
            text: Parking is free, since the sign's condition isn't met
        answer: a
        feedback: The condition "weekday and before 6 p.m." is false on Saturday, so the rule promises nothing either way. Concluding "free" is denying the antecedent; the city might have a separate weekend rule.
      - id: propositional-logic.transfer.v2.3
        prompt: 'A thermostat rule says: "If the room is below 18°C, the heater is on." The rule is working, and you find the heater off. What can you conclude?'
        options:
          - id: a
            text: The room is at 18°C or warmer
          - id: b
            text: The room is below 18°C and the heater has a fault
          - id: c
            text: Nothing, since the rule describes cold rooms only
        answer: a
        feedback: This is modus tollens. If the room were below 18°C, the working rule would have the heater on. "Cold room, heater off" is exactly the row the rule forbids.
      - id: propositional-logic.transfer.v2.4
        prompt: 'An argument runs: "If a bird is a swan, it is white. This bird is a swan. So it is white." The bird turns out to be a black swan. What went wrong?'
        options:
          - id: b
            text: Modus ponens was applied in the wrong direction
          - id: c
            text: The reasoning was invalid, because its conclusion is false
          - id: a
            text: The premise "if swan, then white" was false
        answer: a
        feedback: The step is valid modus ponens, so a premise must be false, and black swans exist. Valid reasoning from a wrong premise can still reach a wrong conclusion, which is why you check premises as well as steps.
      - id: propositional-logic.transfer.v2.5
        prompt: 'A spam rule says: "If the sender is unknown and the message has a link, flag it." A message from your boss contains a link. What does the rule say about it?'
        options:
          - id: c
            text: Flag it, because it contains a link
          - id: b
            text: Don't flag it, because the sender is known
          - id: a
            text: Nothing; the rule's condition isn't met
        answer: a
        feedback: The condition needs both parts, and "sender unknown" is false, so the rule promises nothing. "Don't flag it" is a sensible policy, but it comes from a different rule, not from this one (that would be denying the antecedent).
  - id: propositional-logic.calc
    objective_ref: objective.propositional-logic
    task: base
    response_type: numeric
    points: 1
    hint: List the 8 rows from TTT down to FFF. It's often faster to count the rows that make the formula false and subtract from 8.
    remediation_scene: propositional-logic.truth-tables
    absolute_tolerance: 0.01
    variants:
      - id: propositional-logic.calc.1
        prompt: With three letters A, B, C there are 8 truth-table rows. In how many rows is A ∧ (B ∨ C) true?
        answer: 3
        feedback: A must be true (4 rows), and among those, B ∨ C fails only when both are false. That leaves 4 − 1 = 3 rows.
      - id: propositional-logic.calc.2
        prompt: With three letters A, B, C there are 8 truth-table rows. In how many rows is ¬A ∨ (B ∧ C) true?
        answer: 5
        feedback: ¬A is true in the 4 rows where A is false. When A is true, you also need B ∧ C, which adds 1 row (A, B, C all true). Total 4 + 1 = 5.
      - id: propositional-logic.calc.3
        prompt: With three letters A, B, C there are 8 truth-table rows. In how many rows is (A → B) ∧ (B → C) true?
        answer: 4
        feedback: 'The rows that survive both implications are TTT, FTT, FFT, and FFF: 4 rows. Every other row has a true condition with a false consequence in one of the two parts.'
      - id: propositional-logic.calc.4
        prompt: With three letters A, B, C there are 8 truth-table rows. In how many rows is A → (B ∨ C) true?
        answer: 7
        feedback: An implication fails only when its condition is true and its consequence false. That needs A true with B and C both false, which is 1 row, so 8 − 1 = 7.
      - id: propositional-logic.calc.5
        prompt: With three letters A, B, C there are 8 truth-table rows. In how many rows is (A ∨ B) ∧ ¬C true?
        answer: 3
        feedback: ¬C keeps the 4 rows with C false. Among them, A ∨ B fails only when A and B are both false, leaving 4 − 1 = 3.
