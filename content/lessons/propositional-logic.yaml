schema_version: 0.2-draft
lesson:
  id: propositional-logic
  version: 0.1.0-draft
  title: Reason with statements that are true or false
  state: draft
  summary: Propositional logic combines statements with precise connectives; truth tables and valid inference distinguish
    what follows from what merely sounds plausible.
  slot: M04.1
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.propositional-logic
  version: 1-draft
  statement: Propositional logic combines statements with precise connectives; truth tables and valid inference
    distinguish what follows from what merely sounds plausible.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - propositional-logic.base
  - propositional-logic.transfer
  prerequisites:
  - anyOf:
    - objective.discrete-math
  - anyOf:
    - objective.ai-traditions
scenes:
- id: propositional-logic.s1
  title: Give each statement a clear meaning
  type: explanation
  depth: intuition
  objective_refs:
  - objective.propositional-logic
  markdown: Let R mean “it is raining” and W mean “the path is wet.” A proposition is a statement treated as true
    or false within an interpretation. AND requires both inputs true. OR in ordinary propositional logic includes
    the case where both are true. NOT reverses a truth value.
  text_mode: Let R mean “it is raining” and W mean “the path is wet.” A proposition is a statement treated as true
    or false within an interpretation. AND requires both inputs true. OR in ordinary propositional logic includes
    the case where both are true. NOT reverses a truth value.
  bridges: []
- id: propositional-logic.s2
  title: Read implication as a constraint
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.propositional-logic
  markdown: R implies W rules out the case R true and W false. It does not assert that rain is the only way the
    path becomes wet, or that rain caused the wetness. A truth table lists the possible assignments and evaluates
    the compound statement under each one.
  text_mode: R implies W rules out the case R true and W false. It does not assert that rain is the only way the
    path becomes wet, or that rain caused the wetness. A truth table lists the possible assignments and evaluates
    the compound statement under each one.
  bridges:
  - discrete-math
- id: propositional-logic.s3
  title: Use a valid inference
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.propositional-logic
  markdown: 'Given R and “R implies W,” infer W by modus ponens. Given W alone, inferring R is not valid: a sprinkler
    might also wet the path. Logic checks what follows under the supplied statements. Whether those statements accurately
    describe the world is a separate question.'
  text_mode: 'Given R and “R implies W,” infer W by modus ponens. Given W alone, inferring R is not valid: a sprinkler
    might also wet the path. Logic checks what follows under the supplied statements. Whether those statements accurately
    describe the world is a separate question.'
  bridges: []
- id: propositional-logic.s4
  title: Connect logic to a system
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.propositional-logic
  markdown: An eligibility checker can encode explicit conditions and inspect inconsistent assignments. A knowledge
    base entails a conclusion if every interpretation satisfying the premises also satisfies the conclusion. This
    semantic guarantee concerns the formal representation, so ambiguous natural-language inputs must be translated
    carefully.
  text_mode: An eligibility checker can encode explicit conditions and inspect inconsistent assignments. A knowledge
    base entails a conclusion if every interpretation satisfying the premises also satisfies the conclusion. This
    semantic guarantee concerns the formal representation, so ambiguous natural-language inputs must be translated
    carefully.
  bridges: []
- id: propositional-logic.check
