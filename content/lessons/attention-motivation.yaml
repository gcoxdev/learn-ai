schema_version: 0.2-draft
lesson:
  id: attention-motivation
  version: 0.3.0-draft
  title: Look back at the information needed for this step
  state: draft
  summary: Let each output step consult the source information it needs instead of relying on one fixed summary.
  slot: M15.1
  category: learning
  sources:
  - title: Attention Is All You Need
    url: https://arxiv.org/abs/1706.03762
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.attention-motivation
  version: 1-draft
  statement: Attention replaces a fixed summary bottleneck with context-dependent access to representations;
    its mixtures are learned computations rather than guaranteed explanations of importance.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - attention-motivation.base
  - attention-motivation.transfer
  prerequisites:
  - anyOf:
    - objective.sequence-to-sequence
  - anyOf:
    - objective.vectors
scenes:
- id: attention-motivation.s1
  title: Keep more of the source available
  type: explanation
  depth: intuition
  objective_refs:
  - objective.attention-motivation
  markdown: 'An **encoder** turns source information into numerical representations. A **decoder** uses that
    information to produce an output. If the encoder compresses a long source into one fixed vector, that list
    of numbers must carry every detail the decoder will need.


    This is a **bottleneck**, like trying to fit a long set of directions on one small card. **Attention**
    keeps several prepared source representations available so each later step can combine the information
    it needs.'
  text_mode: 'An **encoder** turns source information into numerical representations. A **decoder** uses that
    information to produce an output. If the encoder compresses a long source into one fixed vector, that list
    of numbers must carry every detail the decoder will need.


    This is a **bottleneck**, like trying to fit a long set of directions on one small card. **Attention**
    keeps several prepared source representations available so each later step can combine the information
    it needs.'
  bridges: []
- id: attention-motivation.s2
  title: Ask a different question at each step
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attention-motivation
  markdown: A translation decoder generating a name may need different source information from when it generates
    a verb. A query summarizes what the current step seeks. Keys support comparison with candidate positions,
    and values supply the information to combine. Learned transformations determine these numerical roles.
  text_mode: A translation decoder generating a name may need different source information from when it generates
    a verb. A query summarizes what the current step seeks. Keys support comparison with candidate positions,
    and values supply the information to combine. Learned transformations determine these numerical roles.
  bridges:
  - vectors
- id: attention-motivation.s3
  title: Combine the selected information
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attention-motivation
  markdown: 'Take value vectors [2, 0] and [0, 4], with weights 0.75 and 0.25. Multiply first: 0.75 × [2, 0]
    = [1.5, 0], and 0.25 × [0, 4] = [0, 1]. Then add them to obtain [1.5, 1].


    The weights control how much each candidate contributes. The values determine what information it contributes.
    This is a mixture, rather than a vote for one entire input. Later layers can transform and mix the result
    again, producing features that depend on the current context.'
  text_mode: 'Take value vectors [2, 0] and [0, 4], with weights 0.75 and 0.25. Multiply first: 0.75 × [2,
    0] = [1.5, 0], and 0.25 × [0, 4] = [0, 1]. Then add them to obtain [1.5, 1].


    The weights control how much each candidate contributes. The values determine what information it contributes.
    This is a mixture, rather than a vote for one entire input. Later layers can transform and mix the result
    again, producing features that depend on the current context.'
  bridges: []
- id: attention-motivation.s4
  title: Keep the interpretation modest
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attention-motivation
  markdown: An attention weight describes one internal mixing operation under a model and input. It does not
    automatically measure causal importance or factual truth. Compare self-attention within one sequence with
    cross-attention between representation sets. The mask and objective determine which information is permitted.
  text_mode: An attention weight describes one internal mixing operation under a model and input. It does not
    automatically measure causal importance or factual truth. Compare self-attention within one sequence with
    cross-attention between representation sets. The mask and objective determine which information is permitted.
  bridges: []
- id: attention-motivation.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.attention-motivation
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Attention lets a step combine information from several available representations. The mixture changes
    with context, but its weights alone do not explain the model’s whole decision.
- id: attention-motivation.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.attention-motivation
  markdown: Attention lets a step combine information from several available representations. The mixture changes
    with context, but its weights alone do not explain the model’s whole decision.
  text_mode: Attention lets a step combine information from several available representations. The mixture
    changes with context, but its weights alone do not explain the model’s whole decision.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - attention-motivation.s1
    - attention-motivation.s2
    - attention-motivation.s3
    - attention-motivation.s4
    - attention-motivation.check
    gate_refs:
    - gate.core
  scene_aliases:
    attention-motivation.recap: attention-motivation.check
assessment_families:
- id: attention-motivation.base
  objective_ref: objective.attention-motivation
  task: base
  response_type: single_choice
  points: 1
  hint: 'Ask a different question at each step: trace the inputs, operation, and result before choosing.'
  remediation_scene: attention-motivation.s2
  variants:
  - id: attention-motivation.base.1
    prompt: What bottleneck can attention reduce in an encoder-decoder model?
    options:
    - id: c
      text: The need for any training objective
    - id: a
      text: Dependence on one fixed source summary
    - id: b
      text: All computational cost
    answer: a
    feedback: It supplies context-dependent access to multiple source representations.
  - id: attention-motivation.base.2
    prompt: Values [4, 0] and [0, 2] with equal weights mix to what?
    options:
    - id: a
      text: '[2, 1]'
    - id: b
      text: '[4, 2]'
    - id: c
      text: '[1, 2]'
    answer: a
    feedback: Multiply each vector by 0.5 and add corresponding coordinates.
- id: attention-motivation.transfer
  objective_ref: objective.attention-motivation
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Keep the interpretation modest: trace the inputs, operation, and result before choosing.'
  remediation_scene: attention-motivation.s4
  variants:
  - id: attention-motivation.transfer.1
    prompt: A high attention weight is observed. What is not automatically established?
    options:
    - id: a
      text: Causal importance to the final answer
    - id: b
      text: That a mixing coefficient was computed
    - id: c
      text: That the model had an input
    answer: a
    feedback: Internal weights need further evidence for explanatory or causal claims.
  - id: attention-motivation.transfer.2
    prompt: A decoder attends to encoder outputs from another sequence. What kind of attention is this?
    options:
    - id: b
      text: Only self-attention by definition
    - id: c
      text: A parameter update
    - id: a
      text: Cross-attention
    answer: a
    feedback: Queries and key/value representations come from different sets.
