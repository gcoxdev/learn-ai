schema_version: 0.2-draft
lesson:
  id: attention-motivation
  version: 0.1.0-draft
  title: Look back at the information needed for this step
  state: draft
  summary: Attention replaces a fixed summary bottleneck with context-dependent access to representations; its mixtures
    are learned computations rather than guaranteed explanations of importance.
  slot: M15.1
  category: learning
  minutes: 12
  sources:
  - title: Attention Is All You Need
    url: https://arxiv.org/abs/1706.03762
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.attention-motivation
  version: 1-draft
  statement: Attention replaces a fixed summary bottleneck with context-dependent access to representations; its
    mixtures are learned computations rather than guaranteed explanations of importance.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - attention-motivation.base
  - attention-motivation.transfer
  prerequisites:
  - anyOf:
    - objective.sequence-to-sequence
  - anyOf:
    - objective.vectors
scenes:
- id: attention-motivation.s1
  title: One summary can be asked to hold too much
  type: explanation
  depth: intuition
  objective_refs:
  - objective.attention-motivation
  markdown: An encoder-decoder model that places a whole source sentence into one fixed vector must preserve every
    detail needed later. Long or complex inputs can strain that bottleneck. Attention lets a later computation consult
    several source representations instead of relying only on that one summary.
  text_mode: An encoder-decoder model that places a whole source sentence into one fixed vector must preserve every
    detail needed later. Long or complex inputs can strain that bottleneck. Attention lets a later computation consult
    several source representations instead of relying only on that one summary.
  bridges: []
- id: attention-motivation.s2
  title: Ask a different question at each step
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attention-motivation
  markdown: A translation decoder generating a name may need different source information from when it generates
    a verb. A query summarizes what the current step seeks. Keys support comparison with candidate positions, and
    values supply the information to combine. Learned transformations determine these numerical roles.
  text_mode: A translation decoder generating a name may need different source information from when it generates
    a verb. A query summarizes what the current step seeks. Keys support comparison with candidate positions, and
    values supply the information to combine. Learned transformations determine these numerical roles.
  bridges:
  - vectors
- id: attention-motivation.s3
  title: Follow a weighted mixture
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attention-motivation
  markdown: For value vectors [2, 0] and [0, 4] with weights 0.75 and 0.25, the mixture is [1.5, 1]. The operation
    combines information rather than copying a single whole input. Multiple layers can transform and mix these representations
    repeatedly, creating context-dependent features.
  text_mode: For value vectors [2, 0] and [0, 4] with weights 0.75 and 0.25, the mixture is [1.5, 1]. The operation
    combines information rather than copying a single whole input. Multiple layers can transform and mix these representations
    repeatedly, creating context-dependent features.
  bridges: []
- id: attention-motivation.s4
  title: Keep the interpretation modest
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attention-motivation
  markdown: An attention weight describes one internal mixing operation under a model and input. It does not automatically
    measure causal importance or factual truth. Compare self-attention within one sequence with cross-attention
    between representation sets. The mask and objective determine which information is permitted.
  text_mode: An attention weight describes one internal mixing operation under a model and input. It does not automatically
    measure causal importance or factual truth. Compare self-attention within one sequence with cross-attention
    between representation sets. The mask and objective determine which information is permitted.
  bridges: []
- id: attention-motivation.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.attention-motivation
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: attention-motivation.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.attention-motivation
  markdown: Attention replaces a fixed summary bottleneck with context-dependent access to representations; its
    mixtures are learned computations rather than guaranteed explanations of importance.
  text_mode: Attention replaces a fixed summary bottleneck with context-dependent access to representations; its
    mixtures are learned computations rather than guaranteed explanations of importance.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - attention-motivation.s1
    - attention-motivation.s2
    - attention-motivation.s3
    - attention-motivation.s4
    - attention-motivation.check
    - attention-motivation.recap
    gate_refs:
    - gate.core
assessment_families:
- id: attention-motivation.base
  objective_ref: objective.attention-motivation
  task: base
  response_type: single_choice
  points: 1
  hint: 'Ask a different question at each step: trace the inputs, operation, and result before choosing.'
  remediation_scene: attention-motivation.s2
  variants:
  - id: attention-motivation.base.1
    prompt: What bottleneck can attention reduce in an encoder-decoder model?
    options:
    - id: c
      text: The need for any training objective
    - id: a
      text: Dependence on one fixed source summary
    - id: b
      text: All computational cost
    answer: a
    feedback: It supplies context-dependent access to multiple source representations.
  - id: attention-motivation.base.2
    prompt: Values [4, 0] and [0, 2] with equal weights mix to what?
    options:
    - id: a
      text: '[2, 1]'
    - id: b
      text: '[4, 2]'
    - id: c
      text: '[1, 2]'
    answer: a
    feedback: Multiply each vector by 0.5 and add corresponding coordinates.
- id: attention-motivation.transfer
  objective_ref: objective.attention-motivation
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Keep the interpretation modest: trace the inputs, operation, and result before choosing.'
  remediation_scene: attention-motivation.s4
  variants:
  - id: attention-motivation.transfer.1
    prompt: A high attention weight is observed. What is not automatically established?
    options:
    - id: a
      text: Causal importance to the final answer
    - id: b
      text: That a mixing coefficient was computed
    - id: c
      text: That the model had an input
    answer: a
    feedback: Internal weights need further evidence for explanatory or causal claims.
  - id: attention-motivation.transfer.2
    prompt: A decoder attends to encoder outputs from another sequence. What kind of attention is this?
    options:
    - id: b
      text: Only self-attention by definition
    - id: c
      text: A parameter update
    - id: a
      text: Cross-attention
    answer: a
    feedback: Queries and key/value representations come from different sets.
