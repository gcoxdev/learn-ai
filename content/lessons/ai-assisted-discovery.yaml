assessment_families:
  - id: ai-assisted-discovery.base
    objective_ref: objective.ai-assisted-discovery
    task: base
    response_type: single_choice
    points: 1
    hint: 'Select informative experiments: trace the inputs, operation, and result before choosing.'
    remediation_scene: ai-assisted-discovery.s2
    variants:
      - id: ai-assisted-discovery.base.1
        prompt: Is a model-generated hypothesis already a confirmed discovery?
        options:
          - id: c
            text: Only if it has equations
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Proposal and evidence are different stages.
        retired: true
      - id: ai-assisted-discovery.base.2
        prompt: Why choose experiments that distinguish competing hypotheses?
        options:
          - id: a
            text: They can reduce uncertainty about the mechanism
          - id: b
            text: They guarantee every hypothesis is true
          - id: c
            text: Only to increase sample count
        answer: a
        feedback: Information value can guide limited measurements.
        retired: true
  - id: ai-assisted-discovery.transfer
    objective_ref: objective.ai-assisted-discovery
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Audit novelty and reproducibility: trace the inputs, operation, and result before choosing.'
    remediation_scene: ai-assisted-discovery.s4
    variants:
      - id: ai-assisted-discovery.transfer.1
        prompt: What can happen if an instrument has exploitable bias?
        options:
          - id: a
            text: Optimization may improve the measurement artifact
          - id: b
            text: The physical property always improves equally
          - id: c
            text: All experimental noise disappears
        answer: a
        feedback: The measured objective can diverge from the real target.
        retired: true
      - id: ai-assisted-discovery.transfer.2
        prompt: Why check prior literature?
        options:
          - id: b
            text: To replace all experiments
          - id: c
            text: Only to collect citations
          - id: a
            text: To distinguish novelty from rediscovery
        answer: a
        feedback: A new proposal to the model may already be known.
        retired: true
  - id: ai-assisted-discovery.base.v2
    objective_ref: objective.ai-assisted-discovery
    task: base
    response_type: single_choice
    points: 1
    hint: Locate the claim on the pipeline (prediction, computation, synthesis, measurement, property, replication) and ask what the next stage would add.
    remediation_scene: ai-assisted-discovery.pipeline
    variants:
      - id: ai-assisted-discovery.base.v2.1
        prompt: A paper reports 50,000 new crystals that DFT calculations place on the convex hull. What has been shown about them?
        options:
          - id: b
            text: They have been made in the lab and their structures confirmed
          - id: a
            text: A trusted calculation says they could be stable, before any synthesis
          - id: c
            text: They are useful materials, since stable crystals are useful
        answer: a
        feedback: Being on the computed hull is a calculation for an ideal crystal at absolute zero. Nobody has made or measured them yet, and stability says nothing about whether a material is useful.
      - id: ai-assisted-discovery.base.v2.2
        prompt: A screen flags 575 of 10,000 candidates, and 80 of the flagged are real. The base rate is 1%. Which pair of numbers describes the model fairly?
        options:
          - id: a
            text: A hit rate near 14% and about 14-fold enrichment over random picks
          - id: c
            text: A hit rate near 80%, since the model catches 80% of real ones
          - id: b
            text: A hit rate near 1%, since that is how many candidates are real
        answer: a
        feedback: Hit rate is 80/575 ≈ 14%, and random picks hit 1%, so enrichment is about 14×. 80% is the catch rate, a different quantity, and 1% is the base rate before screening.
      - id: ai-assisted-discovery.base.v2.3
        prompt: Why are FunSearch's cap-set results easier to trust than a claim of thousands of new materials?
        options:
          - id: c
            text: Because a language model wrote the programs rather than a chemist
          - id: b
            text: Because mathematics problems have fewer candidate answers to check
          - id: a
            text: Because anyone can check the cap set exactly by testing every triple
        answer: a
        feedback: An exact, cheap check means a proposed cap set is simply right or wrong. Materials need synthesis and measurement, where errors creep in. The search space in math is often huge, and who wrote the program doesn't matter.
      - id: ai-assisted-discovery.base.v2.4
        prompt: Two hypotheses predict a yield of y = 2x and y = x². You can run one experiment. Which setting teaches you the most?
        options:
          - id: b
            text: x = 2, since both hypotheses are well supported there
          - id: a
            text: x = 5, where the predictions are 10 and 25
          - id: c
            text: x = 0, since both predictions are exactly zero there
        answer: a
        feedback: The best experiment separates the hypotheses. At x = 5 they differ by 15. At x = 2 and x = 0 they agree, so any result fits both.
      - id: ai-assisted-discovery.base.v2.5
        prompt: Holding the model's catch and false-alarm rates fixed, what happens to its hit rate when the targets become ten times rarer?
        options:
          - id: a
            text: It falls sharply, because false alarms from the many duds dominate
          - id: b
            text: It stays the same, because the model itself has not changed
          - id: c
            text: It rises, because the model's enrichment over random picks goes up
        answer: a
        feedback: With fewer real candidates, the same false-alarm rate produces a larger share of duds, so precision drops (13.9% to 1.6% in the lesson). Enrichment can rise even while the hit rate falls, which is why both numbers matter.
  - id: ai-assisted-discovery.transfer.v2
    objective_ref: objective.ai-assisted-discovery
    task: transfer
    response_type: single_choice
    points: 1
    hint: Check novelty against the literature, compare with a baseline, and ask whether an independent measurement, not the model, confirmed the result.
    remediation_scene: ai-assisted-discovery.s4
    variants:
      - id: ai-assisted-discovery.transfer.v2.1
        prompt: An antibiotic-discovery model's top 100 picks yield 6 compounds that kill the bacteria in a lab test. What else is needed to judge the model's value?
        options:
          - id: b
            text: The model's confidence scores for the 6 compounds that worked
          - id: c
            text: The number of molecules the model screened before choosing
          - id: a
            text: The hit rate of 100 compounds chosen by a simpler method
        answer: a
        feedback: Six hits means little until you know what a simpler selection achieves on the same test. If a similarity search also yields 6, the model added nothing. Confidence scores and library size don't answer that.
      - id: ai-assisted-discovery.transfer.v2.2
        prompt: An autonomous lab reports making 20 new compounds. A reviewer finds that X-ray patterns of several match known, disordered compounds equally well. Which stage of the pipeline is in question?
        options:
          - id: a
            text: Measurement, since the product may not be the predicted compound
          - id: c
            text: Prediction, since the model should not have proposed them
          - id: b
            text: Replication, since no other laboratory has made them yet
        answer: a
        feedback: The dispute is whether the measurement identifies the predicted structure or a known relative. The predictions might be fine, and replication comes after the measurement question is settled.
      - id: ai-assisted-discovery.transfer.v2.3
        prompt: A closed-loop system optimizing a solar-cell coating reports steady efficiency gains. Then the team notices the light meter drifts upward as the room warms through the day. What should they do first?
        options:
          - id: b
            text: Run the loop longer, since the drift will average out over time
          - id: a
            text: Recalibrate and remeasure a reference cell to check for drift
          - id: c
            text: Trust the trend, since the optimizer chose each coating itself
        answer: a
        feedback: If the meter drifts, the loop may be chasing the time of day rather than better coatings. A reference sample exposes the drift. Running longer adds more biased data, and the optimizer can't tell drift from real gains.
      - id: ai-assisted-discovery.transfer.v2.4
        prompt: A math team says an AI system found a new proof of a known theorem, checked by a proof assistant. How should you describe the result?
        options:
          - id: a
            text: A verified new proof, though of a theorem already known to be true
          - id: b
            text: An unverified claim until mathematicians repeat it by hand
          - id: c
            text: A new theorem, since the proof itself had never been seen before
        answer: a
        feedback: A proof assistant checks each step exactly, so the proof is verified. The theorem was already known, so the novelty is the proof, not the result.
      - id: ai-assisted-discovery.transfer.v2.5
        prompt: An alloy model reports 30 predicted high-strength alloys. A literature search finds 11 already published. What is the fair description of those 11?
        options:
          - id: c
            text: New discoveries, since the model found them on its own
          - id: a
            text: Rediscoveries that support the model but aren't new
          - id: b
            text: Failures, since the model should only propose unknown alloys
        answer: a
        feedback: Finding known good alloys is evidence the model works, a useful check, but they aren't discoveries. Calling them failures throws away that evidence.
  - id: ai-assisted-discovery.calculate
    objective_ref: objective.ai-assisted-discovery
    task: base
    response_type: numeric
    points: 1
    hint: Count real candidates flagged (catch rate × real ones) and duds flagged (false-alarm rate × duds). The hit rate is real flagged ÷ all flagged.
    remediation_scene: ai-assisted-discovery.s2
    absolute_tolerance: 0.2
    variants:
      - id: ai-assisted-discovery.calculate.1
        prompt: Of 1,000 candidates, 5% are real. A model catches 80% of the real ones and flags 10% of the duds. What is its hit rate, in percent?
        answer: 29.6
        feedback: Real flagged 0.8 × 50 = 40; duds flagged 0.1 × 950 = 95. Hit rate 40/135 ≈ 29.6%.
      - id: ai-assisted-discovery.calculate.2
        prompt: Of 10,000 candidates, 1% are real. A model catches 90% of the real ones and flags 1% of the duds. What is its hit rate, in percent?
        answer: 47.6
        feedback: Real flagged 0.9 × 100 = 90; duds flagged 0.01 × 9,900 = 99. Hit rate 90/189 ≈ 47.6%.
      - id: ai-assisted-discovery.calculate.3
        prompt: Of 100,000 candidates, 0.1% are real. A model catches 80% of the real ones and flags 5% of the duds. What is its hit rate, in percent?
        answer: 1.58
        feedback: Real flagged 0.8 × 100 = 80; duds flagged 0.05 × 99,900 = 4,995. Hit rate 80/5,075 ≈ 1.58%.
      - id: ai-assisted-discovery.calculate.4
        prompt: A lab tests 200 model-picked compounds and confirms 24. Random picks from the same library confirm at 2%. What is the enrichment factor?
        answer: 6
        feedback: The model's hit rate is 24/200 = 12%, and 12% ÷ 2% = 6.
      - id: ai-assisted-discovery.calculate.5
        prompt: A screen's hit rate is 15%. If the lab can afford to test the top 40 flagged candidates, how many hits should it expect?
        answer: 6
        feedback: 40 × 0.15 = 6 expected hits.
