schema_version: 0.2-draft
lesson:
  id: ai-assisted-discovery
  version: 0.4.0-draft
  title: Use models to propose experiments and test hypotheses
  state: draft
  summary: An AI system predicted 2.2 million new crystals. How many are new, real, useful materials? Work out hit rates and base rates, and follow a prediction all the way to the lab.
  slot: M34.6
  category: learning
  sources:
    - title: Scaling deep learning for materials discovery (GNoME; Merchant et al., Nature 2023)
      url: https://doi.org/10.1038/s41586-023-06735-9
    - title: An autonomous laboratory for the accelerated synthesis of inorganic materials (A-Lab; Szymanski et al., Nature 2023)
      url: https://doi.org/10.1038/s41586-023-06734-w
    - title: "Artificial Intelligence Driving Materials Discovery? Perspective on the Article: Scaling Deep Learning for Materials Discovery (Cheetham & Seshadri, Chemistry of Materials 2024)"
      url: https://doi.org/10.1021/acs.chemmater.4c00643
    - title: Challenges in High-Throughput Inorganic Materials Prediction and Autonomous Synthesis (Leeman et al., PRX Energy 2024)
      url: https://doi.org/10.1103/PRXEnergy.3.011002
    - title: Mathematical discoveries from program search with large language models (FunSearch; Romera-Paredes et al., Nature 2023)
      url: https://doi.org/10.1038/s41586-023-06924-6
    - title: A Tutorial on Bayesian Optimization
      url: https://arxiv.org/abs/1807.02811
    - title: AI Feynman
      url: https://arxiv.org/abs/1905.11481
objectives:
  - id: objective.ai-assisted-discovery
    version: 2-draft
    statement: AI-assisted discovery combines hypothesis generation, experiment selection, measurement, and revision; novelty, causal evidence, reproducibility, and domain validation determine what has been discovered.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - ai-assisted-discovery.base.v2
      - ai-assisted-discovery.transfer.v2
      - ai-assisted-discovery.calculate
    prerequisites:
      - anyOf:
          - objective.bayesian-optimization-and-automl
      - anyOf:
          - objective.biological-and-molecular-modeling
      - anyOf:
          - objective.causal-graphs-and-interventions
scenes:
  - id: ai-assisted-discovery.s1
    title: 2.2 million crystals, and how many materials?
    type: explanation
    depth: intuition
    objective_refs:
      - objective.ai-assisted-discovery
    markdown: |-
      In November 2023, Google DeepMind announced GNoME, a set of graph neural networks (the kind from this module's first lesson) trained to predict whether a proposed crystal would be stable. The Nature paper (Merchant et al., 2023) reported 2.2 million new crystal structures, about 381,000 of them on the updated "convex hull," meaning no mix of other known compounds had lower computed energy. Outside labs had independently made 736 of them.

      Read the claim closely. "Stable" here is a *calculation*: an energy computed with density functional theory (DFT), a standard but approximate quantum-chemistry method, for a perfect crystal at absolute zero. A crystal on the hull is a candidate that might exist. It isn't yet a material someone has made, measured, and used.

      That gap is where the argument started. A companion paper described the A-Lab, a robotic lab that reported making 41 of 58 target compounds in 17 days. In 2024, two groups of solid-state chemists looked closely. Cheetham and Seshadri examined a random sample of GNoME's predictions and found little evidence of compounds that were at once new, credible, and useful; many were close variants of known materials. Leeman and colleagues argued that many of the A-Lab's products were more likely known, disordered versions of the predicted ordered crystals.

      Both sides can be right about different things. GNoME's database is a large, useful map of computed candidates. Whether it contains *discoveries* depends on steps the model can't take by itself.
    bridges: []
  - id: ai-assisted-discovery.pipeline
    title: From prediction to measurement
    type: explanation
    depth: intuition
    objective_refs:
      - objective.ai-assisted-discovery
    markdown: |-
      Every AI discovery claim sits somewhere along one pipeline. Each stage answers a different question, and most candidates drop out on the way.

      | Stage | Question it answers | Typical evidence |
      | --- | --- | --- |
      | Prediction | Is this worth a closer look? | model score |
      | Computational check | Does a slower, trusted calculation agree? | DFT energy, simulation |
      | Synthesis | Can anyone make it? | a recipe that works |
      | Measurement | Is the product what was predicted? | X-ray diffraction, spectra |
      | Property test | Does it do the useful thing? | conductivity, catalysis, binding |
      | Replication | Does another lab get the same result? | independent report |

      When you read a headline, find the last stage it reached. "2.2 million new crystals" is a claim from the first two rows. The A-Lab dispute was about the fourth: whether measurement showed the predicted structure or a known, disordered relative.
    diagram:
      caption: The discovery pipeline. Candidates thin out at each stage, and lab results flow back to improve the model.
      description: The model's top-scoring candidates go to a computational check. Those that pass go to synthesis, then to measurement. Confirmed products go to a property test, then to independent replication. A dashed arrow runs from measurement back to the model, labeled results retrain the model.
      nodes:
        - id: model
          label: Model proposes candidates
          note: 10,000 scored
          col: 0
          row: 0
          tone: accent
        - id: compute
          label: Computational check
          note: DFT or simulation
          col: 2
          row: 0
        - id: synth
          label: Synthesis
          note: can it be made?
          col: 4
          row: 0
        - id: measure
          label: Measurement
          note: is it what was predicted?
          col: 4
          row: 2
          tone: data
        - id: property
          label: Property test
          note: is it useful?
          col: 2
          row: 2
          tone: data
        - id: replicate
          label: Independent replication
          col: 0
          row: 2
          tone: warn
      edges:
        - from: model
          to: compute
          label: top-scoring
        - from: compute
          to: synth
          label: passes
        - from: synth
          to: measure
        - from: measure
          to: property
          label: confirmed
        - from: property
          to: replicate
        - from: measure
          to: model
          label: results retrain the model
          dashed: true
          bend: 1
    bridges: []
  - id: ai-assisted-discovery.s2
    title: Hit rates live and die by base rates
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-assisted-discovery
    markdown: |-
      Suppose you screen 10,000 candidate battery materials. Only 1% of them, 100, would really work. Your model catches 80% of the real ones and wrongly flags 5% of the duds.

      - Real ones flagged: $0.80 \times 100 = 80$
      - Duds flagged: $0.05 \times 9{,}900 = 495$
      - **Hit rate** (the share of flagged candidates that are real): $80 / (80 + 495) \approx 13.9\%$

      Most of what the model flags is wrong. Yet random picks would hit only 1%, so the model **enriches** hits about 14-fold. A fair report gives both numbers. If you can afford 50 lab experiments, expect about $50 \times 0.139 \approx 7$ hits.

      :::predict Same model, but now only 0.1% of candidates are real (10 of 10,000). What's the hit rate?
      Real ones flagged: 8. Duds flagged: $0.05 \times 9{,}990 = 499.5$. Hit rate $8 / 507.5 \approx 1.6\%$. The model hasn't changed, but rarer targets drown in false alarms. Genuinely new materials are rare, so this is the usual situation.
      :::

      ```python run
      def screen(n, base_rate, catch_rate, false_alarm_rate):
          real = n * base_rate                           # truly good candidates
          true_flags = real * catch_rate                 # good ones the model flags
          false_flags = (n - real) * false_alarm_rate    # duds the model flags anyway
          return true_flags, false_flags, true_flags / (true_flags + false_flags)

      n = 10_000
      for base in (0.10, 0.01, 0.001):
          t, f, hit = screen(n, base, catch_rate=0.80, false_alarm_rate=0.05)
          print(f"base rate {base:6.1%}: flagged {t + f:6.0f} "
                f"({t:4.0f} real + {f:4.0f} duds)  hit rate {hit:5.1%}  "
                f"enrichment {hit / base:4.1f}x")

      t, f, hit = screen(n, 0.01, 0.80, 0.05)
      print(f"order the top 50 flagged at base rate 1%: expect about {50 * hit:.0f} hits")
      ```

      Try `false_alarm_rate = 0.005`. At a 0.1% base rate the hit rate jumps from 1.6% to about 14%. For rare targets, cutting false alarms matters more than catching every real one.

      :::papers Hit rate is precision, and Bayes explains it
      $$\text{hit rate} = P(\text{real} \mid \text{flagged}) = \frac{s\,\pi}{s\,\pi + f\,(1 - \pi)}$$

      $\pi$ is the base rate (0.01), $s$ the catch rate, or sensitivity (0.80), and $f$ the false-alarm rate (0.05): $\frac{0.008}{0.008 + 0.0495} \approx 0.139$. It's Bayes' rule from module 6, and the same quantity as precision in classification.
      :::
    bridges: []
  - id: ai-assisted-discovery.funsearch
    title: When a checker can score every guess
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-assisted-discovery
    markdown: |-
      Discovery is easiest to trust when checking a proposal is cheap and exact. Mathematics and computer science often offer that.

      **FunSearch** (Romera-Paredes et al., 2023) paired a large language model with an automatic evaluator. The model wrote small programs that construct a mathematical object; the evaluator ran each program and scored the result; the best programs were fed back as examples for the next round, an evolutionary loop. On the **cap set problem** (find the largest set of points in an $n$-dimensional grid over $\{0, 1, 2\}$ with no three on a line), it found a cap set of size 512 in dimension 8, beating the previous best known, 496. It also found better heuristics for packing items into bins.

      Anyone can verify a cap set by checking every triple of points: no synthesis, no instrument, no disorder. That's why such claims are much easier to accept than "we discovered 381,000 materials." Before believing an AI discovery claim, ask how cheap and how exact the checker was.
    bridges: []
  - id: ai-assisted-discovery.s3
    title: Choose the experiment that can change your mind
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-assisted-discovery
    markdown: |-
      In a closed loop, the model also picks the next experiment, often with Bayesian optimization (module 32). The most useful experiment isn't always the one with the best predicted result; it's the one that best separates your explanations.

      Two candidate rules describe how a catalyst's yield $y$ depends on temperature setting $x$: $y = 2x$ or $y = x^2$. At $x = 2$ both predict 4, so measuring there teaches nothing. At $x = 3$ they predict 6 and 9. If your measurement error is ±0.5, one run at $x = 3$ settles it.

      Loops can also fool themselves. If a sensor reads high when a sample is hot, an optimizer will "discover" hot samples. Recalibrate the instrument, and occasionally measure a known reference sample, so the loop chases the material and not the measurement error.
    bridges: []
  - id: ai-assisted-discovery.s4
    title: Audit the claim before you celebrate
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-assisted-discovery
    markdown: |-
      A lab reports: "Our model discovered 12 new superconductors." Here's the audit, row by row.

      1. **Novelty.** A database search finds 5 of the 12 already reported, some decades ago. Rediscovery shows the model works; it isn't a discovery. 7 remain.
      2. **Measurement.** Only 3 of the 7 were made and measured superconducting; the other 4 are still predictions.
      3. **Baseline.** Those 3 came from 20 model picks the lab made and tested (15%). A chemist's shortlist of 20, tested the same way, gave 1 (5%).
      4. **Replication.** No other lab has made them yet.

      A fair headline: "Model-guided search found 3 new superconductors, a three-times higher hit rate than a chemist's shortlist, awaiting replication." Smaller, and far more useful to the next team.

      :::mixup "The model scored it highly, so it's a discovery."
      A score is where the pipeline starts. Only independent measurement shows that nature agrees, and a literature search shows whether it's new.
      :::
    bridges: []
  - id: ai-assisted-discovery.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.ai-assisted-discovery
    markdown: Compute hit rates and enrichment from screening numbers, then judge discovery claims about catalysts, antibiotics, proofs, and alloys.
    takeaway: |-
      A model's prediction starts the discovery pipeline; synthesis, measurement, and replication finish it. Judge a screen by its hit rate against the base rate and a baseline, and ask how exact and independent the final check was.
  - id: ai-assisted-discovery.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.ai-assisted-discovery
    markdown: |-
      A model can propose a hypothesis or a useful experiment. Measurements, comparison with alternatives, and independent confirmation determine what the result establishes.
