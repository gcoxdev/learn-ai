schema_version: 0.2-draft
lesson:
  id: ai-assisted-discovery
  version: 0.1.0-draft
  title: Use models to propose experiments and test hypotheses
  state: draft
  summary: AI-assisted discovery combines hypothesis generation, experiment selection, measurement, and revision;
    novelty, causal evidence, reproducibility, and domain validation determine what has been discovered.
  slot: M34.6
  category: learning
  sources:
  - title: AI Feynman
    url: https://arxiv.org/abs/1905.11481
  - title: A Tutorial on Bayesian Optimization
    url: https://arxiv.org/abs/1807.02811
objectives:
- id: objective.ai-assisted-discovery
  version: 1-draft
  statement: AI-assisted discovery combines hypothesis generation, experiment selection, measurement, and revision;
    novelty, causal evidence, reproducibility, and domain validation determine what has been discovered.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - ai-assisted-discovery.base
  - ai-assisted-discovery.transfer
  prerequisites:
  - anyOf:
    - objective.bayesian-optimization-and-automl
  - anyOf:
    - objective.biological-and-molecular-modeling
  - anyOf:
    - objective.causal-graphs-and-interventions
scenes:
- id: ai-assisted-discovery.s1
  title: Distinguish proposal from confirmation
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ai-assisted-discovery
  markdown: A model can suggest a material composition, symbolic relationship, or experimental condition. This is
    a candidate hypothesis. Confirmation requires evidence under the scientific domain’s standards; a fluent explanation
    or high surrogate score does not establish that nature behaves as proposed.
  text_mode: A model can suggest a material composition, symbolic relationship, or experimental condition. This
    is a candidate hypothesis. Confirmation requires evidence under the scientific domain’s standards; a fluent
    explanation or high surrogate score does not establish that nature behaves as proposed.
  bridges: []
- id: ai-assisted-discovery.s2
  title: Select informative experiments
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-assisted-discovery
  markdown: An automated loop can choose experiments for expected improvement, uncertainty reduction, or discrimination
    between hypotheses. With a budget of five measurements, testing five nearly identical candidates may reveal
    less than deliberately covering alternatives. Feasibility, measurement noise, and laboratory constraints shape
    the selection.
  text_mode: An automated loop can choose experiments for expected improvement, uncertainty reduction, or discrimination
    between hypotheses. With a budget of five measurements, testing five nearly identical candidates may reveal
    less than deliberately covering alternatives. Feasibility, measurement noise, and laboratory constraints shape
    the selection.
  bridges: []
- id: ai-assisted-discovery.s3
  title: Close the loop with real outcomes
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-assisted-discovery
  markdown: Record executed conditions, observations, failures, and calibration, then update the model. Failed experiments
    are informative if their cause is understood. If the instrument is biased, an optimizer may exploit its measurement
    artifact rather than improve the physical system.
  text_mode: Record executed conditions, observations, failures, and calibration, then update the model. Failed
    experiments are informative if their cause is understood. If the instrument is biased, an optimizer may exploit
    its measurement artifact rather than improve the physical system.
  bridges: []
- id: ai-assisted-discovery.s4
  title: Audit novelty and reproducibility
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-assisted-discovery
  markdown: Search prior literature, preserve data and analysis, compare baselines, and seek independent confirmation.
    Separate rediscovering a known relation from proposing a new one and from experimentally validating it. Human
    domain expertise remains necessary to interpret mechanisms and appropriate claims.
  text_mode: Search prior literature, preserve data and analysis, compare baselines, and seek independent confirmation.
    Separate rediscovering a known relation from proposing a new one and from experimentally validating it. Human
    domain expertise remains necessary to interpret mechanisms and appropriate claims.
  bridges: []
- id: ai-assisted-discovery.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.ai-assisted-discovery
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: AI-assisted discovery combines hypothesis generation, experiment selection, measurement, and revision;
    novelty, causal evidence, reproducibility, and domain validation determine what has been discovered.
- id: ai-assisted-discovery.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.ai-assisted-discovery
  markdown: AI-assisted discovery combines hypothesis generation, experiment selection, measurement, and revision;
    novelty, causal evidence, reproducibility, and domain validation determine what has been discovered.
  text_mode: AI-assisted discovery combines hypothesis generation, experiment selection, measurement, and revision;
    novelty, causal evidence, reproducibility, and domain validation determine what has been discovered.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - ai-assisted-discovery.s1
    - ai-assisted-discovery.s2
    - ai-assisted-discovery.s3
    - ai-assisted-discovery.s4
    - ai-assisted-discovery.check
    gate_refs:
    - gate.core
  scene_aliases:
    ai-assisted-discovery.recap: ai-assisted-discovery.check
assessment_families:
- id: ai-assisted-discovery.base
  objective_ref: objective.ai-assisted-discovery
  task: base
  response_type: single_choice
  points: 1
  hint: 'Select informative experiments: trace the inputs, operation, and result before choosing.'
  remediation_scene: ai-assisted-discovery.s2
  variants:
  - id: ai-assisted-discovery.base.1
    prompt: Is a model-generated hypothesis already a confirmed discovery?
    options:
    - id: c
      text: Only if it has equations
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Proposal and evidence are different stages.
  - id: ai-assisted-discovery.base.2
    prompt: Why choose experiments that distinguish competing hypotheses?
    options:
    - id: a
      text: They can reduce uncertainty about the mechanism
    - id: b
      text: They guarantee every hypothesis is true
    - id: c
      text: Only to increase sample count
    answer: a
    feedback: Information value can guide limited measurements.
- id: ai-assisted-discovery.transfer
  objective_ref: objective.ai-assisted-discovery
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Audit novelty and reproducibility: trace the inputs, operation, and result before choosing.'
  remediation_scene: ai-assisted-discovery.s4
  variants:
  - id: ai-assisted-discovery.transfer.1
    prompt: What can happen if an instrument has exploitable bias?
    options:
    - id: a
      text: Optimization may improve the measurement artifact
    - id: b
      text: The physical property always improves equally
    - id: c
      text: All experimental noise disappears
    answer: a
    feedback: The measured objective can diverge from the real target.
  - id: ai-assisted-discovery.transfer.2
    prompt: Why check prior literature?
    options:
    - id: b
      text: To replace all experiments
    - id: c
      text: Only to collect citations
    - id: a
      text: To distinguish novelty from rediscovery
    answer: a
    feedback: A new proposal to the model may already be known.
