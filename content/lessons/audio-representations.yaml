lesson:
  id: audio-representations
  version: 0.4.0-draft
  title: From a waveform to time-frequency features
  state: draft
  summary: Say "buy oat milk" into your phone and it records 16,000 numbers a second. Follow them into the picture of sound that speech models actually read.
  slot: M13.5
  category: learning
  sources:
