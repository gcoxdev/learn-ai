objectives:
  - id: objective.audio-representations
    version: 2-draft
    statement: Waveforms sample amplitude over time; frequency transforms and spectrograms reveal complementary structure, with resolution and sampling assumptions that affect audio learning.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - audio-representations.base.v2
      - audio-representations.transfer.v2
      - audio-representations.calc.v2
    prerequisites:
      - anyOf:
          - objective.digital-representations
      - anyOf:
          - objective.functions
scenes:
  - id: audio-representations.s1
    title: Sixteen thousand numbers a second
    type: explanation
    depth: intuition
    objective_refs:
      - objective.audio-representations
    markdown: |-
      You hold down the record button in Jot, a voice-notes app, and say "buy oat milk." Sound is a wave of tiny air-pressure changes, and your phone's microphone turns it into a voltage that rises and falls with the pressure. To store it, the phone measures that voltage at regular instants and keeps each measurement as a number. The list of numbers is the **waveform**, and each number is a **sample**. How many samples it takes per second is the **sample rate**, measured in hertz (Hz).

      | Where you meet it | Sample rate |
      | --- | ---: |
      | Most speech-recognition models | 16,000 Hz |
      | Music CDs | 44,100 Hz |
      | Video soundtracks and many phone recorders | 48,000 Hz |

      Counting is multiplication. A three-minute note at 16,000 Hz in one channel (**mono**) is $180 \times 16{,}000 = 2{,}880{,}000$ samples. Stored at 2 bytes per sample, that's 5.76 MB before any compression. A stereo recording has two channels and doubles it.

      The waveform is exact but hard to read. A vowel looks like a fast, wiggly repeating shape, and two people saying the same word produce completely different wiggles. The rest of this lesson turns the wiggles into something more useful: how much of each **frequency** (repetitions per second, also in Hz) is present, moment by moment.
    bridges: []
  - id: audio-representations.s2
    title: Nyquist, and the tone that changed its pitch
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.audio-representations
    markdown: |-
      Sampling has a hard limit. To capture a wave you need at least two samples per cycle, one near each peak and one near each trough. So a sample rate of $f_s$ can represent frequencies only up to $f_s / 2$, called the **Nyquist frequency**:

      - 16,000 Hz sampling → up to 8,000 Hz, which covers the sounds that make speech intelligible.
      - 44,100 Hz sampling → up to 22,050 Hz, enough to cover the roughly 20,000 Hz upper limit of human hearing.

      What happens to a frequency above the limit? It doesn't vanish. It shows up disguised as a lower one, which is called **aliasing**. A 9,000 Hz whistle sampled at 16,000 Hz produces exactly the same samples as a 7,000 Hz tone ($16{,}000 - 9{,}000$). Once sampled, no program can tell them apart. That's why recorders run the signal through a low-pass filter, which removes everything above the Nyquist frequency, *before* sampling, and why good resampling code filters before it throws samples away.

      :::predict Old landline phone calls were sampled at 8,000 Hz. Which sounds suffer most?
      The Nyquist frequency is 4,000 Hz, so everything above it is filtered out. Much of the energy of "s" and "f" sits above 4 kHz, which is why "sun" and "fun" are easy to confuse on a phone call, and why you spell your name out loud: "S as in Sam."
      :::

      :::mixup "Jot records at 48 kHz, so just hand those samples to the 16 kHz speech model. More detail can only help."
      The model assumes 16,000 samples per second. Handed 48,000, it reads one second of speech as three seconds of slow, low-pitched speech, since every frequency looks three times lower than it is. Always **resample**: filter out everything above 8 kHz, then keep one sample in three. Simply changing the sample-rate label in the file header does neither.
      :::
    bridges:
      - functions
  - id: audio-representations.s3
    title: "Slice, transform, stack: the spectrogram"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.audio-representations
    markdown: |-
      A **Fourier transform** takes a stretch of waveform and reports how strongly each frequency is present in it. The fast algorithm for computing it is the **FFT** (fast Fourier transform). A whole note, though, mixes "buy", "oat", and "milk" into one answer, so speech systems analyze short slices instead:

      1. Cut the waveform into **frames**: windows of 25 ms (400 samples at 16 kHz).
      2. Start a new frame every 10 ms, the **hop** (160 samples). Frames overlap.
      3. Run an FFT on each frame. A 400-sample window gives frequency **bins** $16{,}000 / 400 = 40$ Hz apart, 201 bins from 0 to 8,000 Hz.
      4. Stack the results side by side. Time runs across, frequency runs up, and brightness shows strength: that's a **spectrogram**.

      The hop sets the frame rate: $16{,}000 / 160 = 100$ frames per second. The program builds a spectrogram of a pure 440 Hz tone and finds its loudest bin.

      ```python run
      import numpy as np

      sr = 16000                         # samples per second
      tone = 440                         # Hz: try 3000, then 9000
      t = np.arange(sr) / sr             # one second of sample times
      wave = np.sin(2 * np.pi * tone * t)

      win, hop = 400, 160                # 25 ms windows, moved 10 ms at a time
      frames = np.array([wave[s:s + win] * np.hanning(win)
                         for s in range(0, len(wave) - win + 1, hop)])
      spec = np.abs(np.fft.rfft(frames, axis=1))   # one spectrum per frame

      print("spectrogram shape (frames, bins):", spec.shape)
      print("frames per second:", sr // hop)
      print("bin spacing:", sr / win, "Hz")
      peak = spec.mean(axis=0).argmax()
      print(f"loudest bin: {peak} -> {peak * sr / win:.0f} Hz")
      ```

      Bin 11 × 40 Hz = 440 Hz: found. (One second yields 98 full frames rather than 100, because the last windows would run past the end.) Now set `tone = 9000`. The loudest bin reports 7,000 Hz: aliasing, caught in the act.

      Window length is a trade. A longer window gives narrower bins, so finer pitch detail, but blurs *when* things happen; a shorter one pins down timing and blurs frequency. The 25 ms window is short enough to catch a quick "t" and long enough to separate the resonances of vowels.
    bridges: []
    diagram:
      caption: From microphone to model input. Each stage turns the previous one into something easier to learn from.
      description: The waveform, at 16,000 samples per second, is cut into overlapping 25 millisecond frames with a 10 millisecond hop. Each frame goes through an FFT, giving 201 frequency bins. A mel filterbank groups the bins into 80 bands, and a log compresses loudness. The resulting log-mel spectrogram, 100 frames per second by 80 bands, feeds the speech model.
      nodes:
        - id: wave
          label: Waveform
          note: 16,000 samples/s
          col: 0
          row: 0
          tone: data
        - id: frames
          label: Frames
          note: 25 ms window, 10 ms hop
          col: 1
          row: 0
        - id: fft
          label: FFT per frame
          note: 201 bins, 40 Hz apart
          col: 2
          row: 0
        - id: mel
          label: Mel filterbank + log
          note: 80 bands
          col: 3
          row: 0
        - id: logmel
          label: Log-mel spectrogram
          note: 100 frames/s × 80
          col: 4
          row: 0
          tone: data
        - id: model
          label: Speech model
          col: 5
          row: 0
          tone: accent
      edges:
        - from: wave
          to: frames
        - from: frames
          to: fft
        - from: fft
          to: mel
        - from: mel
          to: logmel
        - from: logmel
          to: model
  - id: audio-representations.s4
    title: Space the frequencies the way ears do
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.audio-representations
    markdown: |-
      Your ears hear the step from 500 Hz to 1,000 Hz as a big change in pitch, and the step from 7,500 Hz to 8,000 Hz as barely anything. The FFT's bins are evenly spaced, so they spend most of their detail on high frequencies that matter less for speech. The **mel scale** re-spaces frequencies to match perceived pitch. A common formula is

      $$m = 2595 \log_{10}\!\left(1 + \frac{f}{700}\right)$$

      so 1,000 Hz is 1,000 mels, 4,000 Hz is about 2,146 mels, and 8,000 Hz is about 2,840 mels. A **mel filterbank** groups the FFT bins into bands evenly spaced in mels, usually 80 of them. Then a log compresses loudness, the way hearing does. The result is a **log-mel spectrogram**, the standard input for speech models.

      :::predict With 80 bands evenly spaced in mels from 0 to 8,000 Hz, about what share of them cover 4,000 to 8,000 Hz, the top half of the frequencies?
      That range spans $2{,}840 - 2{,}146 = 694$ of the 2,840 mels, about 24%, so roughly 20 of the 80 bands. The other 60 go to the lower half, where vowels and voicing carry most of the speech information.
      :::

      :::papers What Whisper reads
      OpenAI's Whisper (Radford et al., 2022) resamples all audio to 16,000 Hz and computes an 80-channel log-mel spectrogram with 25 ms windows and a 10 ms stride, exactly the pipeline above. It reads 30-second chunks: $30 \times 100 = 3{,}000$ frames of 80 numbers each, compared with $30 \times 16{,}000 = 480{,}000$ raw samples.
      :::

      Choose features by task. Transcription wants the log-mel spectrogram, and so, usually, does telling *who* is speaking. Music models usually need the higher sample rates of the table in the first scene, since cymbals and strings go well past 8 kHz. Many newer systems learn their own features straight from the waveform. The next lesson feeds Jot's log-mel frames into a recognizer.
    bridges: []
  - id: audio-representations.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.audio-representations
    markdown: A podcast recorder, a bird-song detector, a call-center system, and some sample-rate arithmetic test whether you can predict what a representation keeps and loses.
    takeaway: |-
      A waveform samples pressure thousands of times a second and can hold frequencies only up to half the sample rate. Framing, an FFT, and mel bands turn it into a log-mel spectrogram, about 100 frames a second, that speech models read.
  - id: audio-representations.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.audio-representations
    markdown: |-
      Waveforms record amplitude over time; spectrograms show how frequency content changes. Sample rate and analysis-window length affect which details the representation can preserve.
