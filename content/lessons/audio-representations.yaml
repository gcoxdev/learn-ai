assessment_families:
  - id: audio-representations.base
    objective_ref: objective.audio-representations
    task: base
    response_type: single_choice
    points: 1
    hint: 'Count a short recording: trace the inputs, operation, and result before choosing.'
    remediation_scene: audio-representations.s2
    variants:
      - id: audio-representations.base.1
        prompt: Two seconds of mono audio at 8,000 samples per second contain how many samples?
        options:
          - id: a
            text: 16,000
          - id: b
            text: 8,000
          - id: c
            text: 4,000
        answer: a
        feedback: Multiply duration by sample rate.
        retired: true
      - id: audio-representations.base.2
        prompt: What does a spectrogram show?
        options:
          - id: b
            text: Only a transcript of words
          - id: c
            text: Every sound source’s true identity
          - id: a
            text: Frequency-related content across time windows
        answer: a
        feedback: It represents how spectral content varies over time.
        retired: true
  - id: audio-representations.transfer
    objective_ref: objective.audio-representations
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Connect the features to the task: trace the inputs, operation, and result before choosing.'
    remediation_scene: audio-representations.s4
    variants:
      - id: audio-representations.transfer.1
        prompt: A window is made much shorter. What time-frequency tradeoff should be expected?
        options:
          - id: b
            text: Perfect resolution in both dimensions
          - id: c
            text: No change under any conditions
          - id: a
            text: Better time localization with coarser frequency resolution
        answer: a
        feedback: Window length controls the granularity of the representation.
        retired: true
      - id: audio-representations.transfer.2
        prompt: A file’s sample-rate label is changed without resampling. What can happen?
        options:
          - id: c
            text: The signal becomes a transcript
          - id: a
            text: Playback duration and pitch interpretation change
          - id: b
            text: New accurate samples appear automatically
        answer: a
        feedback: The values are interpreted on a different time grid.
        retired: true
  - id: audio-representations.base.v2
    objective_ref: objective.audio-representations
    task: base
    response_type: single_choice
    points: 1
    hint: "Half the sample rate is the highest frequency a recording can hold; anything above it folds down below it. Window length trades timing detail against frequency detail."
    remediation_scene: audio-representations.s2
    variants:
      - id: audio-representations.base.v2.1
        prompt: A video camera records audio at 48,000 samples per second. What is the highest frequency the recording can represent?
        options:
          - id: b
            text: 48,000 Hz, the sample rate itself
          - id: a
            text: 24,000 Hz, half the sample rate
          - id: c
            text: 96,000 Hz, twice the sample rate
        answer: a
        feedback: Each cycle needs at least two samples, so the limit is the Nyquist frequency, 48,000 ÷ 2 = 24,000 Hz. Doubling is the rule for choosing a sample rate, not for reading off the limit.
      - id: audio-representations.base.v2.2
        prompt: A 12,000 Hz tone is sampled at 16,000 Hz with no filter first. Where does it show up in the spectrogram?
        options:
          - id: c
            text: At 8,000 Hz, clipped to the Nyquist frequency
          - id: b
            text: At 12,000 Hz, where it really is
          - id: a
            text: At 4,000 Hz, disguised as a lower tone
        answer: a
        feedback: Above the 8,000 Hz Nyquist limit, the tone aliases to 16,000 − 12,000 = 4,000 Hz. A 16 kHz recording has no 12,000 Hz bin at all, and aliasing folds frequencies down rather than stacking them at the limit.
      - id: audio-representations.base.v2.3
        prompt: You shorten a spectrogram's window from 25 ms to 10 ms. What changes?
        options:
          - id: a
            text: Timing gets sharper and the frequency bins get wider
          - id: b
            text: Timing and frequency both become sharper
          - id: c
            text: The frequency bins get narrower and timing blurs
        answer: a
        feedback: A shorter window pins down when a sound happens, but with fewer samples per window its bins are further apart (100 Hz instead of 40 Hz at 16 kHz). You can't sharpen both at once; the third option describes lengthening the window.
      - id: audio-representations.base.v2.4
        prompt: Why do speech systems group FFT bins into mel bands instead of using them directly?
        options:
          - id: b
            text: Mel bands remove background noise before the model sees it
          - id: a
            text: Mel bands follow perceived pitch, giving low frequencies more bands
          - id: c
            text: Mel bands raise the sample rate so higher frequencies fit
        answer: a
        feedback: FFT bins are evenly spaced in Hz, but hearing (and much of speech's information) is concentrated at lower frequencies, so mel bands are narrow there and wide at the top. They don't remove noise, and nothing after sampling can add frequencies above Nyquist.
  - id: audio-representations.transfer.v2
    objective_ref: objective.audio-representations
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work out which frequencies the task needs, then check whether the sample rate and features along the pipeline keep them.
    remediation_scene: audio-representations.s4
    variants:
      - id: audio-representations.transfer.v2.1
        prompt: A podcast app changes the header of its 44,100 Hz recordings to say 16,000 Hz and sends them to a 16 kHz speech recognizer. The transcripts are nonsense. What is the fix?
        options:
          - id: c
            text: Normalize the loudness of each recording before sending it
          - id: a
            text: Low-pass filter and resample the audio to 16,000 Hz
          - id: b
            text: Trim the silences so the recognizer sees only speech
        answer: a
        feedback: Relabeling makes the model read every second as about 2.8 seconds of slow, low speech. Real resampling (filter, then compute new samples) keeps time and pitch intact. Loudness and silence aren't the problem.
      - id: audio-representations.transfer.v2.2
        prompt: A bird-song detector must hear calls that reach 10,000 Hz, but the field recorders sample at 16,000 Hz. What is the core problem?
        options:
          - id: a
            text: Calls above 8 kHz are lost or aliased, so record at a higher sample rate
          - id: b
            text: The mel scale has too few bands, so use 128 bands instead of 80
          - id: c
            text: The frames are too short, so use a 100 ms window instead of 25 ms
        answer: a
        feedback: A 16 kHz recording can't hold anything above 8 kHz, and no later feature can recover it. Record at 44.1 or 48 kHz instead. More mel bands or longer windows only rearrange what was captured.
      - id: audio-representations.transfer.v2.3
        prompt: A call center sends 8 kHz phone audio to a recognizer trained on 16 kHz audio, first upsampling it to 16 kHz. Accuracy is noticeably worse than in testing. Why?
        options:
          - id: b
            text: Upsampling adds noise above 4 kHz that the model mistakes for speech
          - id: c
            text: The model can't read 16 kHz input that began as an 8 kHz recording
          - id: a
            text: The upsampled audio has nothing above 4 kHz, which the model never saw
        answer: a
        feedback: Upsampling creates a 16 kHz grid but can't restore the frequencies above 4 kHz that the phone line removed, so "s" and "f" sounds lack cues the model learned to use. Fine-tuning on phone-band audio helps. Proper upsampling leaves the top band empty, not noisy.
      - id: audio-representations.transfer.v2.4
        prompt: A music tagger reuses a speech pipeline (16 kHz, 80 mel bands up to 8 kHz) and keeps confusing tracks that differ mainly in their cymbals. What should change first?
        options:
          - id: c
            text: Use a smaller hop so the model sees more frames per second
          - id: b
            text: Use a longer window so each frequency bin gets narrower
          - id: a
            text: Use a higher sample rate and mel bands that extend past 8 kHz
        answer: a
        feedback: Cymbals carry much of their energy above 8 kHz, which a 16 kHz pipeline removes. A smaller hop or longer window only reshapes the frequencies that survived.
  - id: audio-representations.calc.v2
    objective_ref: objective.audio-representations
    task: base
    response_type: numeric
    points: 1
    hint: Samples = seconds × sample rate. Nyquist = sample rate ÷ 2. Frames per second = sample rate ÷ hop in samples (or 1,000 ÷ hop in ms). A tone above Nyquist appears at sample rate − tone.
    remediation_scene: audio-representations.s3
    absolute_tolerance: 0.5
    variants:
      - id: audio-representations.calc.v2.1
        prompt: A 16,000 Hz spectrogram uses a hop of 320 samples. How many frames does it produce per second?
        answer: 50
        feedback: 16,000 ÷ 320 = 50 frames per second, one every 20 ms. Halving the hop to 160 would give 100.
      - id: audio-representations.calc.v2.2
        prompt: How many samples does 2.5 seconds of mono audio at 44,100 Hz contain?
        answer: 110250
        feedback: 2.5 × 44,100 = 110,250 samples. Stereo would double it.
      - id: audio-representations.calc.v2.3
        prompt: A 10,000 Hz tone is sampled at 16,000 Hz with no filter. At what frequency, in Hz, does it appear?
        answer: 6000
        feedback: The Nyquist limit is 8,000 Hz, and 10,000 Hz aliases to 16,000 − 10,000 = 6,000 Hz.
      - id: audio-representations.calc.v2.4
        prompt: An old sound card samples at 22,050 Hz. What is its Nyquist frequency in Hz?
        answer: 11025
        feedback: 22,050 ÷ 2 = 11,025 Hz, half of the CD's 22,050 Hz limit.
      - id: audio-representations.calc.v2.5
        prompt: Whisper reads 30-second chunks with a 10 ms hop. How many frames are in one chunk?
        answer: 3000
        feedback: A 10 ms hop gives 100 frames per second, and 30 × 100 = 3,000 frames.
