  version: 0.1.0-draft
  title: From a waveform to time-frequency features
  state: draft
  summary: Waveforms sample amplitude over time; frequency transforms and spectrograms reveal complementary structure,
    with resolution and sampling assumptions that affect audio learning.
  slot: M13.5
  category: learning
  sources:
  - title: Speech and Language Processing — authors’ draft
    url: https://web.stanford.edu/~jurafsky/slp3/
