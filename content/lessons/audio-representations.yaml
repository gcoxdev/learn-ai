scenes:
- id: audio-representations.s1
  title: A waveform records changing amplitude
  type: explanation
  depth: intuition
  objective_refs:
  - objective.audio-representations
  markdown: A sampled waveform stores amplitude values at regular time intervals. Sample rate is samples per second,
    not the number of speakers or words. Under suitable band-limited sampling assumptions, frequencies above half
    the sample rate cannot be represented without aliasing unless removed before sampling.
  text_mode: A sampled waveform stores amplitude values at regular time intervals. Sample rate is samples per second,
    not the number of speakers or words. Under suitable band-limited sampling assumptions, frequencies above half
    the sample rate cannot be represented without aliasing unless removed before sampling.
  bridges: []
- id: audio-representations.s2
  title: Count a short recording
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.audio-representations
  markdown: One second of mono audio at 16,000 samples per second contains 16,000 sample values. Stereo has two
    channels. Storage also depends on numeric format and compression. Resampling changes the grid and requires appropriate
    filtering; merely relabeling the sample rate changes playback interpretation.
  text_mode: One second of mono audio at 16,000 samples per second contains 16,000 sample values. Stereo has two
    channels. Storage also depends on numeric format and compression. Resampling changes the grid and requires appropriate
    filtering; merely relabeling the sample rate changes playback interpretation.
  bridges:
  - functions
- id: audio-representations.s3
  title: Inspect frequency over time
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.audio-representations
  markdown: A Fourier transform describes frequency components. A spectrogram applies transforms to short overlapping
    windows so their strengths can be tracked through time. Short windows locate rapid changes better but give coarser
    frequency resolution; longer windows trade time localization for frequency detail.
  text_mode: A Fourier transform describes frequency components. A spectrogram applies transforms to short overlapping
    windows so their strengths can be tracked through time. Short windows locate rapid changes better but give coarser
    frequency resolution; longer windows trade time localization for frequency detail.
  bridges: []
- id: audio-representations.s4
  title: Connect the features to the task
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.audio-representations
  markdown: Mel-scale features summarize frequency information with a perceptually motivated spacing. Learned audio
    encoders or codecs can produce other representations. Speech recognition, speaker identification, and music
    generation need different information. A preprocessing choice that helps one can discard cues another task requires.
  text_mode: Mel-scale features summarize frequency information with a perceptually motivated spacing. Learned audio
    encoders or codecs can produce other representations. Speech recognition, speaker identification, and music
    generation need different information. A preprocessing choice that helps one can discard cues another task requires.
  bridges: []
- id: audio-representations.check
