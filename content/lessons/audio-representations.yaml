lesson:
  id: audio-representations
  version: 0.3.0-draft
  title: From a waveform to time-frequency features
  state: draft
  summary: Count audio samples and inspect how a waveform becomes a picture of frequency changing over time.
  slot: M13.5
  category: learning
  sources:
  - title: Speech and Language Processing — authors’ draft
    url: https://web.stanford.edu/~jurafsky/slp3/
objectives:
- id: objective.audio-representations
  version: 1-draft
  statement: Waveforms sample amplitude over time; frequency transforms and spectrograms reveal complementary
    structure, with resolution and sampling assumptions that affect audio learning.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - audio-representations.base
  - audio-representations.transfer
  prerequisites:
  - anyOf:
    - objective.digital-representations
  - anyOf:
    - objective.functions
scenes:
- id: audio-representations.s1
  title: Measure a sound over time
  type: explanation
  depth: intuition
  objective_refs:
  - objective.audio-representations
  markdown: 'A sampled **waveform** records a signal’s **amplitude**, its measured value at each instant, at
    regular intervals. The **sample rate** is the number of measurements per second. **Frequency** counts repetitions
    per second, measured in hertz (Hz).


    Different continuous signals can produce the same sampled values, a problem called **aliasing**. Under
    suitable band-limited sampling assumptions, frequencies above half the sample rate cannot be resolved without
    aliasing. Recording and resampling therefore use filtering to remove frequencies the new sample rate cannot
    represent. These measurements describe sound; identifying words is another task.'
  text_mode: 'A sampled **waveform** records a signal’s **amplitude**, its measured value at each instant,
    at regular intervals. The **sample rate** is the number of measurements per second. **Frequency** counts
    repetitions per second, measured in hertz (Hz).


    Different continuous signals can produce the same sampled values, a problem called **aliasing**. Under
    suitable band-limited sampling assumptions, frequencies above half the sample rate cannot be resolved without
    aliasing. Recording and resampling therefore use filtering to remove frequencies the new sample rate cannot
    represent. These measurements describe sound; identifying words is another task.'
  bridges: []
- id: audio-representations.s2
  title: Count a short recording
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.audio-representations
  markdown: 'One second of mono audio at 16,000 samples per second contains 16,000 sample values. Stereo has
    two channels. Storage also depends on numeric format and compression. Resampling changes the grid and requires
    appropriate filtering; merely relabeling the sample rate changes playback interpretation.


    Two seconds of stereo at 16,000 samples per second has 2 × 2 × 16,000 = 64,000 stored sample values. At
    two bytes per value, the raw payload is 128,000 bytes before file headers or compression. Seconds, channels,
    sample rate and bytes per value each contribute a separate factor.'
  text_mode: 'One second of mono audio at 16,000 samples per second contains 16,000 sample values. Stereo has
    two channels. Storage also depends on numeric format and compression. Resampling changes the grid and requires
    appropriate filtering; merely relabeling the sample rate changes playback interpretation.


    Two seconds of stereo at 16,000 samples per second has 2 × 2 × 16,000 = 64,000 stored sample values. At
    two bytes per value, the raw payload is 128,000 bytes before file headers or compression. Seconds, channels,
    sample rate and bytes per value each contribute a separate factor.'
  bridges:
  - functions
- id: audio-representations.s3
  title: Show frequency content across time
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.audio-representations
  markdown: 'A **Fourier transform** breaks a signal into frequency components. A **spectrogram** applies this
    analysis to short overlapping windows: time runs along one axis, frequency along the other, and each entry
    shows the strength of a frequency component in that window.


    Short windows locate rapid changes more precisely but give coarser frequency detail. Longer windows give
    finer frequency detail while blurring when a change occurred. A spectrogram exposes useful structure, but
    does not identify words or instruments by itself. The dynamics-and-noise side lesson introduces the wave
    picture.'
  text_mode: 'A **Fourier transform** breaks a signal into frequency components. A **spectrogram** applies
    this analysis to short overlapping windows: time runs along one axis, frequency along the other, and each
    entry shows the strength of a frequency component in that window.


    Short windows locate rapid changes more precisely but give coarser frequency detail. Longer windows give
    finer frequency detail while blurring when a change occurred. A spectrogram exposes useful structure, but
    does not identify words or instruments by itself. The dynamics-and-noise side lesson introduces the wave
    picture.'
  bridges: []
- id: audio-representations.s4
  title: Connect the features to the task
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.audio-representations
  markdown: Mel-scale features summarize frequency information with a perceptually motivated spacing. Learned
    audio encoders or codecs can produce other representations. Speech recognition, speaker identification,
    and music generation need different information. A preprocessing choice that helps one can discard cues
    another task requires.
  text_mode: Mel-scale features summarize frequency information with a perceptually motivated spacing. Learned
    audio encoders or codecs can produce other representations. Speech recognition, speaker identification,
    and music generation need different information. A preprocessing choice that helps one can discard cues
    another task requires.
  bridges: []
