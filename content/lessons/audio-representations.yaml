- id: objective.audio-representations
  version: 1-draft
  statement: Waveforms sample amplitude over time; frequency transforms and spectrograms reveal complementary structure,
    with resolution and sampling assumptions that affect audio learning.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
