scenes:
- id: next-token.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.next-token
  text_mode: The complete explanation is available as readable text.
  title: Words become pieces
  markdown: 'A tokenizer represents text as a sequence of token IDs. A token can be a word, part of a word, punctuation,
    or another text unit. The exact pieces depend on the tokenizer.


    A model looks up learned representations of these IDs and computes from them. It does not directly manipulate
    a human concept attached to every token.'
- id: next-token.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.next-token
  text_mode: The complete explanation is available as readable text.
  title: A distribution, not a single inevitable word
  markdown: 'Given earlier tokens, an autoregressive model computes scores for possible next tokens. A normalization
    such as softmax turns scores into a probability distribution: nonnegative values summing to one.


    The probabilities are about continuation under the model, not a direct certificate that a statement is true.'
  simulation: tokens
- id: next-token.s3
  type: explanation
  depth: intuition
  objective_refs:
  - objective.next-token
  text_mode: The complete explanation is available as readable text.
  title: Append, then repeat
  markdown: 'The system selects a token, appends it to the context, and computes again. Sampling can produce different
    continuations; always taking the highest-probability token follows a different selection policy.


    This repeated computation is inference. The current model weights can remain fixed throughout the response.'
- id: next-token.s4
  type: explanation
  depth: intuition
  objective_refs:
  - objective.next-token
  text_mode: The complete explanation is available as readable text.
  title: Training gives the task an answer
  markdown: 'For a next-token training example, earlier tokens are the input and a following token from the data
    is the target. A loss penalizes inadequate probability on the target, and training updates parameters.


    Later adaptation can change behavior using demonstrations or other signals. This introductory route does not
    yet explain transformer attention, full-scale pretraining, post-training alternatives, or serving.'
- id: next-token.s5
  type: explanation
  depth: intuition
  objective_refs:
  - objective.next-token
  text_mode: The complete explanation is available as readable text.
  title: What you can now explain
  markdown: 'Trace **text → tokens → representations → model scores → a distribution → selected token → longer context**.
    Then distinguish that request from a training update.


    A model can generate unsupported statements because producing likely text and verifying truth are different
    tasks. Deeper architecture and lifecycle units remain part of the full-school plan.'
- id: next-token.extension-perplexity
  title: Summarize prediction with perplexity
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.next-token
  markdown: 'For each observed target token, negative log probability measures how surprised the model was. Average
    this over the evaluated tokens. With base-two logarithms, perplexity is 2 raised to that average loss: an average
    of 2 bits gives perplexity 4. With natural logarithms, use the exponential of the average instead.


    Perplexity summarizes predictive uncertainty under the specified dataset and context. It is not the number of
    words the model understands or a factuality score. Compare it only with compatible tokenization, preprocessing,
    masking, and averaging conventions. A model can improve next-token prediction while still failing a particular
    reasoning or safety task.'
  text_mode: 'For each observed target token, negative log probability measures how surprised the model was. Average
