assessment_families:
- id: next-token.base
  objective_ref: objective.next-token
  task: base
  response_type: single_choice
  points: 1
  hint: An autoregressive language model predicts a distribution over the next token from context and generates
    by repeatedly selecting and appending tokens.
  variants:
  - id: next-token.base.1
    prompt: What does an autoregressive language model predict at one generation step?
    options:
    - id: a
      text: One guaranteed true sentence.
    - id: b
      text: A newly trained set of weights for every word.
    - id: correct
      text: A distribution over possible next tokens given context.
    answer: correct
    feedback: A distribution over possible next tokens given context.
  - id: next-token.base.2
    prompt: What is a token?
    options:
    - id: b
      text: Always a complete factual statement.
    - id: correct
      text: A unit in a particular text representation, which may be part of a word.
    - id: a
      text: Always exactly one English word.
    answer: correct
    feedback: A unit in a particular text representation, which may be part of a word.
- id: next-token.transfer
  objective_ref: objective.next-token
  task: transfer
  response_type: single_choice
  points: 1
  hint: An autoregressive language model predicts a distribution over the next token from context and generates
    by repeatedly selecting and appending tokens.
  variants:
  - id: next-token.transfer.1
    prompt: The system selects a token and appends it. What happens next in ordinary autoregressive generation?
    options:
    - id: b
      text: It must end the response immediately.
    - id: correct
      text: It computes another next-token distribution from the extended context.
    - id: a
      text: It necessarily retrains on the user’s message.
    answer: correct
    feedback: It computes another next-token distribution from the extended context.
  - id: next-token.transfer.2
    prompt: A token has high model probability. Does that certify a factual statement?
    options:
    - id: correct
      text: No. Continuation probability is not factual verification.
    - id: a
      text: Yes. Softmax is a fact-checking algorithm.
    - id: b
      text: Yes. Sampling eliminates unsupported claims.
    answer: correct
    feedback: No. Continuation probability is not factual verification.
