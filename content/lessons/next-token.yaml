scenes:
- id: next-token.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.next-token
  text_mode: 'A tokenizer represents text as a sequence of token IDs. A token can be a word, part of a word,
    punctuation, or another text unit. The exact pieces depend on the tokenizer.


    A model looks up learned representations of these IDs and computes from them. Those representations are
    the numerical inputs to the prediction calculation.'
  title: Words become pieces
  markdown: 'A tokenizer represents text as a sequence of token IDs. A token can be a word, part of a word,
    punctuation, or another text unit. The exact pieces depend on the tokenizer.


    A model looks up learned representations of these IDs and computes from them. Those representations are
    the numerical inputs to the prediction calculation.'
- id: next-token.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.next-token
  text_mode: 'An **autoregressive** model predicts the next piece using pieces already available. Given earlier
    tokens, it computes a score for every candidate next token. **Softmax** turns those scores into nonnegative
    numbers that sum to one: a probability distribution.


    If a toy distribution gives “cat” 0.6, “dog” 0.3 and an ending marker 0.1, those are alternative next choices.
    They describe continuation under this model, not the truth of an entire sentence.'
  title: A distribution, not a single inevitable word
  markdown: 'An **autoregressive** model predicts the next piece using pieces already available. Given earlier
    tokens, it computes a score for every candidate next token. **Softmax** turns those scores into nonnegative
    numbers that sum to one: a probability distribution.


    If a toy distribution gives “cat” 0.6, “dog” 0.3 and an ending marker 0.1, those are alternative next choices.
    They describe continuation under this model, not the truth of an entire sentence.'
  simulation: tokens
- id: next-token.s3
  type: explanation
  depth: intuition
  objective_refs:
  - objective.next-token
  text_mode: 'The system selects a token, appends it to the context, and computes the next distribution. Sampling
    can choose different continuations; choosing the largest probability each time is called greedy decoding.


    Generation stops under a stated rule, such as selecting an end token, reaching a length limit, or receiving
    a stop request. The current model weights can remain fixed throughout. This repeated use of the model is
    inference, not another training update.'
  title: Append, then repeat
  markdown: 'The system selects a token, appends it to the context, and computes the next distribution. Sampling
    can choose different continuations; choosing the largest probability each time is called greedy decoding.


    Generation stops under a stated rule, such as selecting an end token, reaching a length limit, or receiving
    a stop request. The current model weights can remain fixed throughout. This repeated use of the model is
    inference, not another training update.'
- id: next-token.s4
  type: explanation
  depth: intuition
  objective_refs:
  - objective.next-token
  text_mode: 'For a next-token training example, earlier tokens are the input and a following token from the
    data is the target. A loss penalizes inadequate probability on the target, and training updates parameters.


    Later adaptation can change behavior using demonstrations or other signals. The core distinction remains:
    inference uses the stored parameters, while training adjusts them.'
  title: Training gives the task an answer
  markdown: 'For a next-token training example, earlier tokens are the input and a following token from the
    data is the target. A loss penalizes inadequate probability on the target, and training updates parameters.


    Later adaptation can change behavior using demonstrations or other signals. The core distinction remains:
    inference uses the stored parameters, while training adjusts them.'
- id: next-token.s5
  type: explanation
  depth: intuition
  objective_refs:
  - objective.next-token
  text_mode: 'Trace **text → tokens → representations → scores → probabilities → selected token → longer context**.
    Then distinguish this request from training, which changes model settings using examples and a loss.


    A fluent continuation can contain an unsupported claim because predicting text and checking evidence are
    different jobs. The later transformer, pretraining, post-training, retrieval and serving lessons open each
    part of this sequence in more detail.'
  title: What you can now explain
  markdown: 'Trace **text → tokens → representations → scores → probabilities → selected token → longer context**.
    Then distinguish this request from training, which changes model settings using examples and a loss.


    A fluent continuation can contain an unsupported claim because predicting text and checking evidence are
    different jobs. The later transformer, pretraining, post-training, retrieval and serving lessons open each
    part of this sequence in more detail.'
- id: next-token.extension-perplexity
  title: Summarize prediction with perplexity
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.next-token
  markdown: 'For each observed target token, negative log probability measures how surprised the model was.
    Average this over the evaluated tokens. With base-two logarithms, perplexity is 2 raised to that average
    loss: an average of 2 bits gives perplexity 4. With natural logarithms, use the exponential of the average
    instead.


    Perplexity summarizes predictive uncertainty under the specified dataset and context. It is not the number
    of words the model understands or a factuality score. Compare it only with compatible tokenization, preprocessing,
    masking, and averaging conventions. A model can improve next-token prediction while still failing a particular
    reasoning or safety task.'
