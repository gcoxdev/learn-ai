assessment_families:
- id: decoding-and-sampling.base
  objective_ref: objective.decoding-and-sampling
  task: base
  response_type: single_choice
  points: 1
  hint: 'Restrict candidates explicitly: trace the inputs, operation, and result before choosing.'
  remediation_scene: decoding-and-sampling.s2
  variants:
  - id: decoding-and-sampling.base.1
    prompt: What does lower positive temperature generally do before sampling?
    options:
    - id: b
      text: Updates model weights
    - id: c
      text: Always increases diversity
    - id: a
      text: Concentrates probability on higher logits
    answer: a
    feedback: Scaling logits changes relative probability concentration.
  - id: decoding-and-sampling.base.2
    prompt: How does top-p differ from top-k?
    options:
    - id: c
      text: It removes the need for normalization
    - id: a
      text: It chooses candidates by cumulative probability mass rather than a fixed count
    - id: b
      text: It always keeps exactly p tokens
    answer: a
    feedback: The retained count can vary with the distribution.
- id: decoding-and-sampling.transfer
  objective_ref: objective.decoding-and-sampling
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Stop for a defined reason: trace the inputs, operation, and result before choosing.'
  remediation_scene: decoding-and-sampling.s4
  variants:
  - id: decoding-and-sampling.transfer.1
    prompt: Does grammar-constrained JSON guarantee factual correctness?
    options:
    - id: c
      text: Only if keys are sorted
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Syntax constraints do not validate content.
  - id: decoding-and-sampling.transfer.2
    prompt: Why record the stopping reason?
    options:
    - id: a
      text: A budget-truncated result differs from a completed response
    - id: b
      text: It changes the training corpus automatically
    - id: c
      text: It guarantees no error
    answer: a
    feedback: Completion semantics depend on why generation ended.
