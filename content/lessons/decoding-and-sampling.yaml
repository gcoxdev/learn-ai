schema_version: 0.2-draft
lesson:
  id: decoding-and-sampling
  version: 0.2.0-draft
  title: Turn logits into a controlled generation procedure
  state: draft
  summary: Keep the model fixed and change how one next token is chosen. Predict the result, then test it in a small
    probability playground.
  slot: M27.3
  category: learning
  sources:
  - title: Holtzman et al. — The Curious Case of Neural Text Degeneration
    url: https://arxiv.org/abs/1904.09751
  archetype: mechanism
objectives:
- id: objective.decoding-and-sampling
  version: 2-draft
  statement: Distinguish scores, normalized probabilities, top-k filtering, temperature, and sampled draws while
    tracing one selection.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - decoding-and-sampling.base.v2
  - decoding-and-sampling.transfer.v2
  prerequisites:
  - anyOf:
    - objective.next-token
  - anyOf:
    - objective.softmax-attention
scenes:
- id: decoding-and-sampling.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.decoding-and-sampling
  title: The model gives scores; something must choose
  markdown: A language model produces one numerical **score**, often called a logit, for each candidate next token.
    A **decoding** procedure turns those scores into an output sequence. **Greedy decoding** chooses the highest-scoring
    candidate at each step. **Sampling** draws a candidate according to a probability distribution. Two systems
    can use identical model weights and still produce different text because these procedures differ. Keep the learned
    scores separate from the rule used to choose an output.
  text_mode: A language model produces one numerical **score**, often called a logit, for each candidate next token.
    A **decoding** procedure turns those scores into an output sequence. **Greedy decoding** chooses the highest-scoring
    candidate at each step. **Sampling** draws a candidate according to a probability distribution. Two systems
    can use identical model weights and still produce different text because these procedures differ. Keep the learned
    scores separate from the rule used to choose an output.
  bridges: []
- id: decoding-and-sampling.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.decoding-and-sampling
  title: Give scores a probability meaning
  markdown: '**Softmax** converts scores to nonnegative probabilities that sum to one: exponentiate the scores,
    then divide each result by the sum. For scores [2,1,0], the probabilities are approximately [0.665,0.245,0.090].
    Implementations commonly subtract the largest score before exponentiation for numerical stability; the ratios
    stay the same. Scores themselves are not percentages. A model score of two does not mean a 200% chance or twice
    the probability of a score of one.'
  text_mode: '**Softmax** converts scores to nonnegative probabilities that sum to one: exponentiate the scores,
    then divide each result by the sum. For scores [2,1,0], the probabilities are approximately [0.665,0.245,0.090].
    Implementations commonly subtract the largest score before exponentiation for numerical stability; the ratios
    stay the same. Scores themselves are not percentages. A model score of two does not mean a 200% chance or twice
    the probability of a score of one.'
  bridges:
  - softmax-attention
  - powers-logs
- id: decoding-and-sampling.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.decoding-and-sampling
  title: Temperature changes the spread
  markdown: For positive **temperature** T, divide scores by T before softmax. T below one usually concentrates
    probability on higher scores; T above one flattens the distribution. At T=0.5, our scores become [4,2,0], producing
    approximately [0.867,0.117,0.016]. The candidate ranking stays the same for positive T, but the chances change.
    “Temperature zero” often names a greedy mode in an interface; it is not literal division by zero in this formula.
  text_mode: For positive **temperature** T, divide scores by T before softmax. T below one usually concentrates
    probability on higher scores; T above one flattens the distribution. At T=0.5, our scores become [4,2,0], producing
    approximately [0.867,0.117,0.016]. The candidate ranking stays the same for positive T, but the chances change.
    “Temperature zero” often names a greedy mode in an interface; it is not literal division by zero in this formula.
  bridges: []
- id: decoding-and-sampling.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.decoding-and-sampling
  title: Choose which candidates remain eligible
  markdown: '**Top-k** keeps the k highest-scoring candidates and excludes the rest, then normalizes the retained
    probabilities. From [0.6,0.3,0.1], top-two gives [2/3,1/3,0]. **Top-p**, or nucleus sampling, instead keeps
    a smallest high-probability prefix whose cumulative mass reaches the chosen threshold under a specified convention.
    For this distribution and threshold 0.8, the first two total 0.9. These controls can interact; report the order
    and settings instead of assuming every sampler is identical.'
  text_mode: '**Top-k** keeps the k highest-scoring candidates and excludes the rest, then normalizes the retained
    probabilities. From [0.6,0.3,0.1], top-two gives [2/3,1/3,0]. **Top-p**, or nucleus sampling, instead keeps
    a smallest high-probability prefix whose cumulative mass reaches the chosen threshold under a specified convention.
    For this distribution and threshold 0.8, the first two total 0.9. These controls can interact; report the order
    and settings instead of assuming every sampler is identical.'
  bridges: []
- id: decoding-and-sampling.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.decoding-and-sampling
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Scores become chances; a decoding rule turns chances into a choice. Changing the choice rule does not
    retrain the model or guarantee truth.
- id: decoding-and-sampling.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.decoding-and-sampling
  markdown: Decoding transforms model scores into token choices using temperature, candidate restrictions, search,
    and stopping rules; these choices change output behavior without necessarily changing weights.
  text_mode: Decoding transforms model scores into token choices using temperature, candidate restrictions, search,
    and stopping rules; these choices change output behavior without necessarily changing weights.
- id: decoding-and-sampling.s5
  type: simulation
  depth: mechanics
  objective_refs:
  - objective.decoding-and-sampling
  title: Try a probability steering wheel
  markdown: 'Before touching a control, predict what will change. First move the draw while keeping scores, temperature,
    and top-k fixed: only the selected candidate should change. Then hold the draw still and change temperature:
    the intervals move. Top-k=1 leaves the highest-scoring candidate with probability one. The playground uses invented
    scores and repeatable draw positions so the mechanism stays visible. It does not run a trained model. The hundred-draw
    table is a deterministic comparison, not independent random sampling.'
  text_mode: 'Before touching a control, predict what will change. First move the draw while keeping scores, temperature,
    and top-k fixed: only the selected candidate should change. Then hold the draw still and change temperature:
    the intervals move. Top-k=1 leaves the highest-scoring candidate with probability one. The playground uses invented
    scores and repeatable draw positions so the mechanism stays visible. It does not run a trained model. The hundred-draw
    table is a deterministic comparison, not independent random sampling.'
  bridges:
  - probability
  simulation: sampling
- id: decoding-and-sampling.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.decoding-and-sampling
  title: One sampled token is not the whole answer
  markdown: Imagine probability intervals [0,0.6), [0.6,0.9), and [0.9,1). A draw of 0.75 chooses the second candidate.
    Append that token, then compute a new distribution from the longer context for the next step. A random seed
    can help reproduce draws under matching conditions, but runtime differences may still affect results. Sampling
    is useful for diverse outputs; it does not verify facts. Evaluate generated sequences for the intended task
    instead of treating randomness as either knowledge or a guaranteed mistake.
  text_mode: Imagine probability intervals [0,0.6), [0.6,0.9), and [0.9,1). A draw of 0.75 chooses the second candidate.
    Append that token, then compute a new distribution from the longer context for the next step. A random seed
    can help reproduce draws under matching conditions, but runtime differences may still affect results. Sampling
    is useful for diverse outputs; it does not verify facts. Evaluate generated sequences for the intended task
    instead of treating randomness as either knowledge or a guaranteed mistake.
  bridges: []
- id: decoding-and-sampling.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.decoding-and-sampling
  title: Move the draw, keep the chances
  markdown: With probabilities [0.6,0.3,0.1] in candidate order A,B,C, which candidate does draw 0.85 select?
  text_mode: With probabilities [0.6,0.3,0.1] in candidate order A,B,C, which candidate does draw 0.85 select?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: B
    - id: b
      text: A
    - id: c
      text: C
    answer: a
    reveal_markdown: A occupies [0,0.6), B occupies [0.6,0.9), and C occupies [0.9,1). The draw 0.85 lies in B’s
      interval.
    hint: Trace the example using the rule from the preceding pages.
    id: decoding-and-sampling.practice.v2.7
