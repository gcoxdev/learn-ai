schema_version: 0.2-draft
lesson:
  id: decoding-and-sampling
  version: 0.1.0-draft
  title: Turn logits into a controlled generation procedure
  state: draft
  summary: Decoding transforms model scores into token choices using temperature, candidate restrictions, search,
    and stopping rules; these choices change output behavior without necessarily changing weights.
  slot: M27.3
  category: learning
  minutes: 12
  sources:
  - title: The Curious Case of Neural Text Degeneration
    url: https://arxiv.org/abs/1904.09751
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.decoding-and-sampling
  version: 1-draft
  statement: Decoding transforms model scores into token choices using temperature, candidate restrictions, search,
    and stopping rules; these choices change output behavior without necessarily changing weights.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - decoding-and-sampling.base
  - decoding-and-sampling.transfer
  prerequisites:
  - anyOf:
    - objective.cached-inference
  - anyOf:
    - objective.softmax-attention
scenes:
- id: decoding-and-sampling.s1
  title: From logits to a distribution
  type: explanation
  depth: intuition
  objective_refs:
  - objective.decoding-and-sampling
  markdown: 'Logits are unnormalized output scores. Dividing them by a positive temperature before softmax changes
    concentration: lower temperature sharpens relative preferences, higher temperature flattens them. Greedy selection
    chooses the largest score directly; temperature zero is usually an interface convention for a limiting or greedy
    procedure, not literal division by zero.'
  text_mode: 'Logits are unnormalized output scores. Dividing them by a positive temperature before softmax changes
    concentration: lower temperature sharpens relative preferences, higher temperature flattens them. Greedy selection
    chooses the largest score directly; temperature zero is usually an interface convention for a limiting or greedy
    procedure, not literal division by zero.'
  bridges: []
- id: decoding-and-sampling.s2
  title: Restrict candidates explicitly
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.decoding-and-sampling
  markdown: Top-k keeps a fixed number of highest-ranked candidates. Top-p keeps a smallest high-probability prefix
    whose cumulative mass reaches a threshold under the implementation’s rule. Renormalize retained probabilities
    before sampling. The order of penalties, temperature, and filtering can change the result.
  text_mode: Top-k keeps a fixed number of highest-ranked candidates. Top-p keeps a smallest high-probability prefix
    whose cumulative mass reaches a threshold under the implementation’s rule. Renormalize retained probabilities
    before sampling. The order of penalties, temperature, and filtering can change the result.
  bridges: []
- id: decoding-and-sampling.s3
  title: Search and constrain sequences
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.decoding-and-sampling
  markdown: Beam search retains several high-scoring partial sequences and expands them, often with length-related
    adjustments. Grammar-constrained decoding can restrict tokens to syntactically valid structures. A valid JSON
    output can still contain wrong facts; sequence likelihood and task correctness are distinct objectives.
  text_mode: Beam search retains several high-scoring partial sequences and expands them, often with length-related
    adjustments. Grammar-constrained decoding can restrict tokens to syntactically valid structures. A valid JSON
    output can still contain wrong facts; sequence likelihood and task correctness are distinct objectives.
  bridges: []
- id: decoding-and-sampling.s4
  title: Stop for a defined reason
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.decoding-and-sampling
  markdown: Generation may stop at an end token, matched stop sequence, output limit, or application condition.
    Handle truncated structured outputs and partial tool calls. Evaluate diversity, correctness, latency, and repetition
    under matched settings rather than assuming one decoding method is best for every task.
  text_mode: Generation may stop at an end token, matched stop sequence, output limit, or application condition.
    Handle truncated structured outputs and partial tool calls. Evaluate diversity, correctness, latency, and repetition
    under matched settings rather than assuming one decoding method is best for every task.
  bridges: []
