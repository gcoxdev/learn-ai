schema_version: 0.2-draft
lesson:
  id: decoding-and-sampling
  version: 0.4.0-draft
  title: Turn logits into a controlled generation procedure
  state: draft
  summary: A bot stuck repeating itself, JSON that won't parse, and a bug that won't reproduce with the same seed. All three are fixed after the model, where scores become tokens.
  slot: M27.3
  category: learning
  sources:
    - title: The Curious Case of Neural Text Degeneration (Holtzman et al., 2019)
      url: https://arxiv.org/abs/1904.09751
    - title: "CTRL: A Conditional Transformer Language Model for Controllable Generation (Keskar et al., 2019), penalized sampling"
      url: https://arxiv.org/abs/1909.05858
    - title: Efficient Guided Generation for Large Language Models (Willard & Louf, 2023), the Outlines method
      url: https://arxiv.org/abs/2307.09702
    - title: Hugging Face Transformers documentation, generation strategies
      url: https://huggingface.co/docs/transformers/generation_strategies
    - title: Defeating Nondeterminism in LLM Inference (Horace He and Thinking Machines Lab, 2025)
      url: https://thinkingmachines.ai/blog/defeating-nondeterminism-in-llm-inference/
  archetype: mechanism
objectives:
  - id: objective.decoding-and-sampling
    version: 3-draft
    statement: Explain how serving-time decoding controls (repetition penalties, logit bias, stop sequences, constraint masks, beam search, and seeded sampling) change which tokens are chosen without changing the model, and why the same seed can still give different outputs.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - decoding-and-sampling.base.v3
      - decoding-and-sampling.transfer.v3
      - decoding-and-sampling.penalty
    prerequisites:
      - anyOf:
          - objective.next-token
      - anyOf:
          - objective.softmax-attention
scenes:
  - id: decoding-and-sampling.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.decoding-and-sampling
    title: Three bug reports, zero new weights
    markdown: |-
      Fern's support team files three bug reports in one week:

      1. Asked for watering tips, Fern wrote "Water deeply. Water deeply. Water deeply." until it hit the length limit.
      2. The order-lookup feature expects a reply like `{"order_id": "F-20931"}`, and about one reply in fifty isn't valid JSON.
      3. QA saved a bad answer together with its random seed, reran it with the same seed, and got a different answer.

      None needs retraining. Each is fixed where logits become a token. Recall the core of that step from the next-token prediction lesson: the model gives a **logit** (a raw score) for every vocabulary token, softmax turns logits into probabilities, **temperature** below 1 sharpens them, and **top-k** or **top-p** trims the tail before a random draw picks one. A serving engine wraps more steps around that core, usually in this order.
    diagram:
      caption: What a serving engine does between the model's logits and the next token.
      description: The model produces a logit for every vocabulary token. Penalties and logit bias add to or subtract from chosen logits. A constraint mask sets tokens that would break the required format to minus infinity. Temperature and top-k or top-p reshape and trim what remains. A seeded random draw picks one token. A stop check either ends the reply or appends the token and sends the longer context back to the model.
      nodes:
        - id: model
          label: Model
          note: one logit per token
          col: 0
          row: 0
          tone: accent
        - id: adjust
          label: Penalties + bias
          note: add or subtract
          col: 1
          row: 0
        - id: mask
          label: Constraint mask
          note: −∞ for invalid tokens
          col: 2
          row: 0
          tone: warn
        - id: shape
          label: Temperature, top-k/p
          note: reshape and trim
          col: 2
          row: 1
        - id: draw
          label: Seeded draw
          note: pick one token
          col: 1
          row: 1
          tone: data
        - id: stop
          label: Stop check
          note: stop string, end token, limit
          col: 0
          row: 1
        - id: reply
          label: Finished reply
          col: 0
          row: 2
          tone: muted
      edges:
        - from: model
          to: adjust
        - from: adjust
          to: mask
        - from: mask
          to: shape
        - from: shape
          to: draw
        - from: draw
          to: stop
        - from: stop
          to: model
          label: append, continue
        - from: stop
          to: reply
          label: stop
    bridges: []
  - id: decoding-and-sampling.s5
    type: simulation
    depth: mechanics
    objective_refs:
      - objective.decoding-and-sampling
    title: Intervals and a draw
    markdown: |-
      Watch the **draw**: sampling picks a random number from 0 up to 1 and finds which candidate's interval contains it. The playground gives candidates A, B, and C the invented scores 2, 1, and 0. At temperature 1 their probabilities are 0.665, 0.245, and 0.090, so A owns 0 up to 0.665, B owns 0.665 up to 0.910, and C owns the rest. A draw of 0.75 lands in B.

      Move the draw across 0.665 and the choice jumps from A to B while the chances stay put. Then hold the draw at 0.75 and set the temperature to 0.5: A's share grows to 0.867 and swallows the draw. Penalties, bias, and masks below all move the intervals; a seed fixes the draw.
    bridges:
      - probability
    simulation: sampling
  - id: decoding-and-sampling.s2
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.decoding-and-sampling
    title: Make repeats cost something
    markdown: |-
      Bug 1 is a loop: after "Water deeply. Water deeply.", the logit for "Water" is 3.0, ahead of "Check" at 2.6. Penalties lower the logits of tokens already in the output. For a token that has appeared $c$ times:

      | Penalty | Rule | Where it's from |
      | --- | --- | --- |
      | Repetition, $\theta$ | If $c > 0$: divide a positive logit by $\theta$, multiply a negative one by $\theta$ | CTRL (Keskar et al., 2019) suggested $\theta \approx 1.2$; the negative case is Hugging Face's |
      | Frequency, $\alpha_f$ | Subtract $\alpha_f \times c$ | OpenAI-style APIs |
      | Presence, $\alpha_p$ | Subtract $\alpha_p$ once if $c > 0$ | OpenAI-style APIs |

      With $\theta = 1.2$, "Water" drops to $3.0 / 1.2 = 2.5$, and "Check" now leads.

      ```python run
      import numpy as np

      words  = ["Water", "Check", "Let", "Your"]
      logits = np.array([3.0, 2.6, 1.8, 1.0])   # scores after "Water deeply. Water deeply."
      counts = np.array([2, 0, 0, 0])           # times each word already appears in the reply

      def softmax(z):
          e = np.exp(z - z.max())
          return e / e.sum()

      def repetition(z, theta):                 # CTRL / Hugging Face style
          seen = counts > 0
          return np.where(seen & (z > 0), z / theta, np.where(seen, z * theta, z))

      def freq_presence(z, freq, pres):         # OpenAI-style penalties
          return z - freq * counts - pres * (counts > 0)

      for name, z in [("no penalty", logits),
                      ("repetition 1.2", repetition(logits, 1.2)),
                      ("frequency 0.3", freq_presence(logits, 0.3, 0.0)),
                      ("presence 0.6", freq_presence(logits, 0.0, 0.6))]:
          p = softmax(z)
          print(f"{name:15} Water logit {z[0]:.2f}  probs:",
                "  ".join(f"{w} {q:.2f}" for w, q in zip(words, p)))
      ```

      Each penalty cuts "Water" from 0.47 to 0.35 or less. Try `counts = [5, 0, 0, 0]`: only the frequency penalty keeps growing.

      :::mixup "A stronger penalty always gives better text."
      Penalties can't tell a loop from a repeat the reply needs. A strong frequency penalty pushes a model to stop using the customer's plant name, and in JSON or code it punishes the quotes, braces, and variable names that must repeat.
      :::
    bridges:
      - softmax-attention
      - powers-logs
  - id: decoding-and-sampling.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.decoding-and-sampling
    title: Ban a token, or stop at a string
    markdown: |-
      **Logit bias** adds a fixed number to the logits of chosen token IDs. OpenAI's API, for example, accepts −100 to 100, and −100 effectively bans a token. Fernly biases a competitor's name by −100. But bias works on token IDs, not words: " Leafy", "Leafy", and "LEAFY" tokenize differently, and a long name may span several tokens, so list every variant and test the result.

      A **stop sequence** is a string that ends the reply, such as `\nCustomer:`, which Fern would otherwise use to start writing the customer's next line. The server checks the decoded text after each token, because a stop string can straddle two tokens. While streaming, it holds back any tail that might begin a stop string, such as `\nCust`, until it knows.

      Every reply also gets a **finish reason**: "stop" for an end-of-turn token or a stop string, "length" for hitting the maximum reply length.

      :::predict Fern's maximum reply length is 300 tokens. A reply ends at token 300 in the middle of a sentence. What should the log say, and what should Fern do?
      The finish reason is "length", so the reply was cut off, not finished. Fern shouldn't present it as complete. It can offer "continue" or retry with a higher limit, and the team should check whether 300 is too low.
      :::
    bridges: []
  - id: decoding-and-sampling.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.decoding-and-sampling
    title: Valid JSON, one token at a time
    markdown: |-
      Bug 2: a prompt that says "reply in JSON" is a request, and one time in fifty the model opens with "Sorry". **Constrained decoding** makes the format a rule. Before each draw, the server checks every candidate token: would appending it still leave a valid start of something the grammar accepts? Every token that fails gets a logit of $-\infty$: probability exactly 0.

      ```python run
      import numpy as np

      TEMPLATE = '{"order_id": "F-#####"}'      # '#' stands for any digit

      def fits(text):                           # could text still grow into a valid reply?
          return len(text) <= len(TEMPLATE) and all(
              t == c or (t == "#" and c.isdigit()) for t, c in zip(TEMPLATE, text))

      vocab  = ['Sorry', '{"order_id": "F-', '209', '31', '4', '"}', 'F-']
      logits = np.array([2.3, 2.0, 0.5, 0.4, 0.3, 0.1, 0.2])   # same scores each step, for simplicity

      print("unconstrained first pick:", vocab[int(np.argmax(logits))])
      text = ""
      while text != TEMPLATE.replace("#", "0") and len(text) < len(TEMPLATE):
          ok = np.array([fits(text + tok) for tok in vocab])
          masked = np.where(ok, logits, -np.inf)            # ban every token that breaks the format
          p = np.exp(masked - masked.max()); p /= p.sum()
          pick = int(np.argmax(p))                          # greedy, to keep the demo repeatable
          print(f"allowed {[t for t, k in zip(vocab, ok) if k]} -> {vocab[pick]!r} (p = {p[pick]:.2f})")
          text += vocab[pick]
      print("reply:", text)
      ```

      Unconstrained, the favorite first token is "Sorry". Masked, only the opening piece is allowed. After "209", another "209" is banned (six digits would break the template), so "31" completes the number. Change `'31'` to `'3'` and watch the mask force a different path.

      Checking all 128,256 tokens at every step is slow. The Outlines method (Willard & Louf, 2023) compiles a regular expression or JSON schema into a finite-state machine once and precomputes the allowed tokens for each state, so each step is a lookup. Servers such as vLLM and llama.cpp offer such constraints. A mask fixes the format, not the facts: F-20931 can still be the wrong order, so validate the content too.
    bridges: []
  - id: decoding-and-sampling.beam
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.decoding-and-sampling
    title: Why chat servers rarely use beams
    markdown: |-
      The sequence-to-sequence lesson taught **beam search**: keep the $B$ partial replies with the highest total log-probability, extend each, and keep the best $B$ again. It's still standard in machine translation and speech recognition, where outputs are short and there's roughly one right answer.

      Chat servers mostly sample instead:

      - **Quality.** For open-ended text, the likeliest sequences tend to be bland and repetitive.
      - **Memory.** Four beams need four sets of KV cache for the tokens they generate. For Fern's 300-token replies at 128 KiB per token, that's 150 MiB instead of 37.5 MiB per request.
      - **Streaming.** The leading beam can change at any step, so nothing is safe to show until the search settles.

      For Fern's order lookup, greedy decoding under the JSON mask gives short, repeatable output.
    bridges: []
  - id: decoding-and-sampling.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.decoding-and-sampling
    title: Same seed, different answer
    markdown: |-
      Bug 3. A **seed** fixes the sequence of random draws, so identical probabilities give identical tokens. The catch is *identical*. Floating-point addition isn't associative: $(a + b) + c$ can differ from $a + (b + c)$ in the last bits, and GPU kernels sum in different orders depending on the hardware and the batch size (how many other requests share the step). So Fern's logits in production and in QA's rerun can differ slightly.

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      x = rng.standard_normal(4096).astype(np.float32)   # one row of products inside a matmul

      one_pass = np.float32(0)
      for v in x:                                      # add left to right
          one_pass += v
      chunked = x.reshape(64, 64).sum(axis=1).sum()    # add in 64 chunks, then combine

      print(f"left to right: {one_pass:.7f}")
      print(f"in chunks:     {chunked:.7f}")
      print("identical?", one_pass == chunked)

      # A tiny change near an interval boundary flips the sampled token
      draw = 0.5999
      for p_a in [0.6000, 0.5998]:
          print(f"P(A) = {p_a:.4f}, draw {draw}: picks", "A" if draw < p_a else "B")
      ```

      The two sums differ by about 0.00003. Usually that changes nothing, but a draw within a hair of an interval boundary flips the token, and the rest of the reply follows a new context. Greedy decoding flips the same way when two logits nearly tie.

      So to reproduce a reply, log the token IDs it actually generated, not just the seed. In 2025, Horace He and colleagues at Thinking Machines Lab traced most run-to-run differences in LLM servers to this batch-size dependence and wrote batch-invariant kernels that avoid it, at some cost in speed.
    bridges: []
  - id: decoding-and-sampling.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.decoding-and-sampling
    title: Move the draw, keep the chances
    markdown: With probabilities [0.6,0.3,0.1] in candidate order A,B,C, which candidate does draw 0.85 select?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: B
        - id: b
          text: A
        - id: c
          text: C
      answer: a
      reveal_markdown: |-
        A occupies [0, 0.6), B occupies [0.6, 0.9), and C occupies [0.9, 1). The draw 0.85 lies in B's interval. Had A's probability been 0.86 instead, the same draw would have picked A: the intervals move, the draw doesn't.
      hint: Lay the probabilities end to end on a line from 0 to 1. A covers 0 up to 0.6, and B covers the next 0.3.
      id: decoding-and-sampling.practice.v2.7
  - id: decoding-and-sampling.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.decoding-and-sampling
    markdown: Penalized logits to compute, plus a translation service, a banned word that slips through, a code tool, and a flickering stop string, test whether you can pick the right control after the model.
    takeaway: |-
      Penalties and bias edit the scores, masks ban tokens outright, stop sequences end the reply, and a seeded draw picks the token. None of them changes the model, and tiny numerical differences can still flip a draw.
  - id: decoding-and-sampling.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.decoding-and-sampling
    markdown: |-
      Decoding transforms model scores into token choices using temperature, candidate restrictions, search, and stopping rules; these choices change output behavior without necessarily changing weights.
