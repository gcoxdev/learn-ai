assessment_families:
  - id: decoding-and-sampling.base
    objective_ref: objective.decoding-and-sampling
    task: base
    response_type: single_choice
    points: 1
    hint: 'Restrict candidates explicitly: trace the inputs, operation, and result before choosing.'
    remediation_scene: decoding-and-sampling.s2
    variants:
      - id: decoding-and-sampling.base.1
        prompt: What does lower positive temperature generally do before sampling?
        options:
          - id: b
            text: Updates model weights
          - id: c
            text: Always increases diversity
          - id: a
            text: Concentrates probability on higher logits
        answer: a
        feedback: Scaling logits changes relative probability concentration.
        retired: true
      - id: decoding-and-sampling.base.2
        prompt: How does top-p differ from top-k?
        options:
          - id: c
            text: It removes the need for normalization
          - id: a
            text: It chooses candidates by cumulative probability mass rather than a fixed count
          - id: b
            text: It always keeps exactly p tokens
        answer: a
        feedback: The retained count can vary with the distribution.
        retired: true
  - id: decoding-and-sampling.transfer
    objective_ref: objective.decoding-and-sampling
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Stop for a defined reason: trace the inputs, operation, and result before choosing.'
    remediation_scene: decoding-and-sampling.s4
    variants:
      - id: decoding-and-sampling.transfer.1
        prompt: Does grammar-constrained JSON guarantee factual correctness?
        options:
          - id: c
            text: Only if keys are sorted
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Syntax constraints do not validate content.
        retired: true
      - id: decoding-and-sampling.transfer.2
        prompt: Why record the stopping reason?
        options:
          - id: a
            text: A budget-truncated result differs from a completed response
          - id: b
            text: It changes the training corpus automatically
          - id: c
            text: It guarantees no error
        answer: a
        feedback: Completion semantics depend on why generation ended.
        retired: true
  - id: decoding-and-sampling.base.v2
    objective_ref: objective.decoding-and-sampling
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: decoding-and-sampling.s3
    variants:
      - prompt: At fixed model scores, temperature, and top-k, what changes when only the random draw changes?
        answer: a
        options:
          - id: a
            text: The sampled candidate, while probabilities stay fixed
          - id: b
            text: The trained model parameters
          - id: c
            text: The original next-token scores
        feedback: The draw selects within a fixed distribution.
        id: decoding-and-sampling.base.v2.1
        retired: true
      - prompt: For positive temperature, what happens when [2,1,0] is divided by 0.5 before softmax?
        answer: a
        options:
          - id: b
            text: The candidate ranking reverses
          - id: a
            text: The top candidate receives a larger share
          - id: c
            text: All candidates receive equal probability
        feedback: Dividing by a smaller positive temperature increases score gaps before softmax.
        id: decoding-and-sampling.base.v2.2
        retired: true
      - prompt: Top-k=1 retains a uniquely highest-scoring candidate. What distribution remains?
        answer: a
        options:
          - id: c
            text: Equal probability across the old vocabulary
          - id: a
            text: Probability one on that candidate
          - id: b
            text: The original full distribution
        feedback: After excluding every other candidate and normalizing, the retained candidate has all the mass.
        id: decoding-and-sampling.base.v2.3
        retired: true
      - prompt: What distinguishes a logit from a probability?
        answer: a
        options:
          - id: b
            text: A logit is a token ID; a probability is the character count
          - id: c
            text: They are interchangeable percentages
          - id: a
            text: A logit is an unnormalized score; a probability belongs to a normalized distribution
        feedback: Softmax gives scores their normalized probability interpretation.
        id: decoding-and-sampling.base.v2.4
        retired: true
  - id: decoding-and-sampling.transfer.v2
    objective_ref: objective.decoding-and-sampling
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: decoding-and-sampling.s3
    variants:
      - prompt: Probabilities are [0.5,0.3,0.2] for A,B,C. Draw 0.65 selects which candidate?
        answer: a
        options:
          - id: a
            text: B
          - id: c
            text: C
          - id: b
            text: A
        feedback: B occupies the interval from 0.5 up to 0.8.
        id: decoding-and-sampling.transfer.v2.1
        retired: true
      - prompt: Probabilities [0.6,0.3,0.1] are filtered to top-two. What is A’s new probability?
        answer: a
        options:
          - id: c
            text: '0.9'
          - id: a
            text: 2/3
          - id: b
            text: '0.6'
        feedback: The retained total is 0.9; normalize A as 0.6/0.9=2/3.
        id: decoding-and-sampling.transfer.v2.2
        retired: true
      - prompt: A greedy answer contains an incorrect claim. What does greediness establish?
        answer: a
        options:
          - id: b
            text: Verification that each claim matches external evidence
          - id: c
            text: A guarantee that the whole sequence is globally most probable
          - id: a
            text: Highest-scoring local choices under the stated rule
        feedback: Greedy selection is a decoding rule, not a truth test or general global sequence optimizer.
        id: decoding-and-sampling.transfer.v2.3
        retired: true
      - prompt: Top-p uses [0.5,0.3,0.2] and keeps a smallest descending prefix reaching mass 0.7. Which candidates remain?
        answer: a
        options:
          - id: a
            text: A and B
          - id: c
            text: B and C
          - id: b
            text: A alone
        feedback: A alone has mass 0.5; adding B reaches 0.8, which meets the threshold.
        id: decoding-and-sampling.transfer.v2.4
        retired: true
  - id: decoding-and-sampling.base.v3
    objective_ref: objective.decoding-and-sampling
    task: base
    response_type: single_choice
    points: 1
    hint: Place each control in the pipeline. Penalties and bias edit scores, a mask bans tokens, the draw picks one, and the stop check ends the reply.
    remediation_scene: decoding-and-sampling.s1
    variants:
      - id: decoding-and-sampling.base.v3.1
        prompt: After "Water deeply. Water deeply.", the model's top logit is for "Water" again. Which setting lowers that token's score because of what the reply already contains?
        options:
          - id: b
            text: A lower temperature, which sharpens the distribution
          - id: c
            text: A top-k of 1, which keeps just the single best token
          - id: a
            text: A repetition or frequency penalty on tokens already used
        answer: a
        feedback: Penalties look at the output so far and lower the scores of tokens that already appear. A lower temperature or top-k of 1 does the opposite here, because "Water" is already the top token and would win even more often.
      - id: decoding-and-sampling.base.v3.2
        prompt: How does a JSON-schema constraint stop a model from writing "Sorry" where an opening brace is required?
        options:
          - id: a
            text: It gives every token that would break the format a logit of −∞
          - id: b
            text: It samples freely, then retries until the whole reply parses
          - id: c
            text: It adds the schema to the system prompt so the model knows it
        answer: a
        feedback: Constrained decoding masks invalid tokens before each draw, so their probability is exactly 0. Retrying and prompting are real alternatives, but neither makes invalid output impossible.
      - id: decoding-and-sampling.base.v3.3
        prompt: QA reruns a sampled reply with the same seed while 30 other requests share the batch instead of 2. The reply matches for 40 tokens, then differs. What most likely happened?
        options:
          - id: c
            text: Tokens from the other requests leaked into this request's context
          - id: b
            text: The seed makes different draws when more requests share a batch
          - id: a
            text: Tiny logit differences flipped a draw that landed near a boundary
        answer: a
        feedback: A different batch size can change the order in which kernels add numbers, so the logits differ in the last bits. The seed's draws are the same, but one draw close to an interval edge picked a different token, and the context diverged from there. Requests in a batch don't see each other's tokens.
      - id: decoding-and-sampling.base.v3.4
        prompt: A reply's log shows the finish reason "length" instead of "stop". What does that tell you?
        options:
          - id: b
            text: The model produced its end-of-turn token and finished normally
          - id: a
            text: The reply hit the maximum length and may be cut off mid-thought
          - id: c
            text: The decoded text matched one of the configured stop strings
        answer: a
        feedback: '"Length" means the server stopped because of the token limit, not because the reply was done. An end-of-turn token or a stop string both give "stop".'
  - id: decoding-and-sampling.transfer.v3
    objective_ref: objective.decoding-and-sampling
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name the failure first (a loop, a banned word, a broken format, a flickering stop, or a need for one best answer), then pick the control that acts on it.
    remediation_scene: decoding-and-sampling.s3
    variants:
      - id: decoding-and-sampling.transfer.v3.1
        prompt: A shop translates short product titles and returns one best translation, without streaming. Which decoding choice fits?
        options:
          - id: a
            text: Beam search, which looks for a likely whole sequence
          - id: b
            text: Sampling at temperature 1.2, for more varied wording
          - id: c
            text: A frequency penalty of 1.5, to avoid repeated words
        answer: a
        feedback: Short outputs with roughly one right answer are where beam search still shines, and without streaming its unsettled lead doesn't matter. Higher temperature adds variety the shop doesn't want, and a strong penalty would distort titles that legitimately repeat words.
      - id: decoding-and-sampling.transfer.v3.2
        prompt: A children's story app bans a word by giving its token ID a logit bias of −100. The word still appears, capitalized, at the start of sentences. Why?
        options:
          - id: c
            text: The bias is applied after the draw, too late to stop the word
          - id: a
            text: The capitalized form is a different token ID with no bias on it
          - id: b
            text: Logit bias works only when the temperature is set below 1
        answer: a
        feedback: Bias acts on token IDs, and "Dragon" and " dragon" are different IDs. List every variant the tokenizer produces. Bias is added before softmax at any temperature.
      - id: decoding-and-sampling.transfer.v3.3
        prompt: A code-completion tool adds a frequency penalty of 1.0 to stop loops. Now its Python often renames variables halfway through a function. What went wrong?
        options:
          - id: b
            text: The penalty raised the temperature and added randomness to each token
          - id: c
            text: The penalty removed the end token, so functions run on too long
          - id: a
            text: The penalty also punished names that correct code has to repeat
        answer: a
        feedback: A frequency penalty grows with every use of a token, so a variable name used five times gets pushed down hard. The penalty changes scores, not the temperature, and it doesn't remove the end token.
      - id: decoding-and-sampling.transfer.v3.4
        prompt: 'A chat product streams replies and uses the stop sequence "\nUser:". Customers sometimes see "\nUs" flash at the end of a reply and vanish. What should the server change?'
        options:
          - id: a
            text: Hold back any text that could begin a stop string until it's resolved
          - id: b
            text: Match stop sequences on token IDs rather than on decoded text
          - id: c
            text: Drop the stop sequence and rely on the maximum reply length
        answer: a
        feedback: The server streamed the start of the stop string before it knew the rest would follow. Buffering a possible prefix fixes that. Matching on IDs would miss stop strings that straddle tokens, and relying on the length limit would let the model write the user's lines.
  - id: decoding-and-sampling.penalty
    objective_ref: objective.decoding-and-sampling
    task: base
    response_type: numeric
    points: 1
    hint: 'Repetition penalty θ: divide a positive logit by θ, multiply a negative one by θ. Frequency and presence: subtract α_f × count, and α_p once if the token has appeared.'
    remediation_scene: decoding-and-sampling.s2
    absolute_tolerance: 0.01
    variants:
      - id: decoding-and-sampling.penalty.1
        prompt: A token already in the reply has logit 3.0. With a repetition penalty of θ = 1.2, what is its new logit?
        answer: 2.5
        feedback: The logit is positive, so divide by θ. 3.0 ÷ 1.2 = 2.5.
      - id: decoding-and-sampling.penalty.2
        prompt: A token already in the reply has logit −2.0. With a repetition penalty of θ = 1.25, what is its new logit?
        answer: -2.5
        feedback: For a negative logit, multiply by θ so the score still goes down. −2.0 × 1.25 = −2.5. Dividing would have raised it to −1.6.
      - id: decoding-and-sampling.penalty.3
        prompt: A token has appeared 3 times in the reply and has logit 4.0. With a frequency penalty of 0.4 and a presence penalty of 0.5, what is its new logit?
        answer: 2.3
        feedback: Frequency subtracts 0.4 × 3 = 1.2 and presence subtracts 0.5 once, so 4.0 − 1.2 − 0.5 = 2.3.
      - id: decoding-and-sampling.penalty.4
        prompt: A token has appeared twice in the reply and has logit 3.0. With a frequency penalty of 0.3 and no presence penalty, what is its new logit?
        answer: 2.4
        feedback: 3.0 − 0.3 × 2 = 2.4.
      - id: decoding-and-sampling.penalty.5
        prompt: A token has never appeared in the reply and has logit 1.8. With a repetition penalty of 1.2, a frequency penalty of 0.3, and a presence penalty of 0.6, what is its logit after penalties?
        answer: 1.8
        feedback: All three penalties apply only to tokens that already appear, so an unused token keeps its logit of 1.8. That's why "Check" rises relative to "Water" in the lesson.
