schema_version: 0.2-draft
lesson:
  id: distributed-and-edge-serving
  version: 0.1.0-draft
  title: Place model computation where memory and latency allow it
  state: draft
  summary: Distributed, offloaded, and edge inference trade memory capacity, communication, privacy boundaries,
    and latency; model placement must match the hardware topology and request workload.
  slot: M27.7
  category: learning
  minutes: 12
  sources:
  - title: The Llama 3 Herd of Models
    url: https://arxiv.org/abs/2407.21783
  - title: DeepSeek-V3 Technical Report
    url: https://arxiv.org/abs/2412.19437
  - title: FlexGen
    url: https://arxiv.org/abs/2303.06865
objectives:
- id: objective.distributed-and-edge-serving
  version: 1-draft
  statement: Distributed, offloaded, and edge inference trade memory capacity, communication, privacy boundaries,
    and latency; model placement must match the hardware topology and request workload.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - distributed-and-edge-serving.base
  - distributed-and-edge-serving.transfer
  prerequisites:
