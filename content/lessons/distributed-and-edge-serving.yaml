assessment_families:
  - id: distributed-and-edge-serving.base
    objective_ref: objective.distributed-and-edge-serving
    task: base
    response_type: single_choice
    points: 1
    hint: 'Count communication on the request path: trace the inputs, operation, and result before choosing.'
    remediation_scene: distributed-and-edge-serving.s2
    variants:
      - id: distributed-and-edge-serving.base.1
        retired: true
        prompt: Do more service replicas necessarily accelerate one request?
        options:
          - id: c
            text: Only if weights are identical
          - id: a
            text: No; they often increase concurrent capacity
          - id: b
            text: 'Yes'
        answer: a
        feedback: Replication and splitting a request solve different scaling problems.
      - id: distributed-and-edge-serving.base.2
        retired: true
        prompt: Why can decode be sensitive to interconnect latency?
        options:
          - id: a
            text: Small sequential steps may repeatedly wait on communication
          - id: b
            text: No data ever move during decode
          - id: c
            text: Only pretraining uses communication
        answer: a
        feedback: Dependencies can put transfers on the critical path.
  - id: distributed-and-edge-serving.transfer
    objective_ref: objective.distributed-and-edge-serving
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Compare a complete operating scenario: trace the inputs, operation, and result before choosing.'
    remediation_scene: distributed-and-edge-serving.s4
    variants:
      - id: distributed-and-edge-serving.transfer.1
        retired: true
        prompt: Does local inference alone prove complete application privacy?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if the model is quantized
        answer: a
        feedback: Other data flows and logs still matter.
      - id: distributed-and-edge-serving.transfer.2
        retired: true
        prompt: Why test sustained edge performance?
        options:
          - id: b
            text: One cold request proves every workload
          - id: c
            text: Only file size matters
          - id: a
            text: Thermal and power limits can change runtime over time
        answer: a
        feedback: Device operating conditions affect repeated execution.
  - id: distributed-and-edge-serving.base.v2
    objective_ref: objective.distributed-and-edge-serving
    task: base
    response_type: single_choice
    points: 1
    hint: Replicas multiply customers; tensor parallelism makes every GPU read a slice at once but adds all-reduces; pipeline stages let a model fit but pass each token through them in turn.
    remediation_scene: distributed-and-edge-serving.s2
    variants:
      - id: distributed-and-edge-serving.base.v2.1
        prompt: Fernly copies its 8B model onto four GPUs as four separate replicas. What improves?
        options:
          - id: b
            text: Each customer's token speed, by about four times
          - id: a
            text: How many customers it can serve at the same time
          - id: c
            text: The size of the largest model it can now run
        answer: a
        feedback: Each request still runs on one GPU at one GPU's speed, so replicas add capacity, not per-token speed. Since every GPU must hold a whole copy, the largest runnable model doesn't change either.
      - id: distributed-and-edge-serving.base.v2.2
        prompt: Why does tensor parallelism make each decode step faster for a single user?
        options:
          - id: a
            text: Each GPU reads only its slice of the weights, and they all read at once
          - id: b
            text: Each GPU generates a different token of the reply at the same moment
          - id: c
            text: The all-reduces supply the weights, so less is read from memory
        answer: a
        feedback: Decode time is set by bytes read, and splitting every matrix divides the bytes each GPU reads per step. Tokens are still made one after another, and all-reduces move small activation vectors, not weights.
      - id: distributed-and-edge-serving.base.v2.3
        prompt: Why do teams keep tensor parallelism inside one machine whose GPUs are linked by NVLink?
        options:
          - id: c
            text: Tensor-parallel GPUs must share a single pool of memory to work
          - id: b
            text: Pipeline stages can't run on GPUs that sit in the same machine
          - id: a
            text: Every token needs two all-reduces per layer, so slow links pile up delay
        answer: a
        feedback: With 160 all-reduces per token for an 80-layer model, even a small delay on each one adds up to most of the step. Each GPU keeps its own memory, and pipelines can run inside one machine too.
      - id: distributed-and-edge-serving.base.v2.4
        prompt: A 405B model runs as two pipeline stages on two machines. For a single user, how does its time per token compare with one imaginary machine big enough to hold the whole model?
        options:
          - id: b
            text: About half, since two machines work on each token at once
          - id: a
            text: About the same, plus a short hop between the machines
          - id: c
            text: About double, since each token must cross the network twice
        answer: a
        feedback: A token passes through stage 1 and then stage 2, so the per-token work is the same as on one machine, plus one small transfer of the boundary activations. Pipelining helps a model fit, and keeps stages busy with several requests, but doesn't split one token's work.
  - id: distributed-and-edge-serving.transfer.v2
    objective_ref: objective.distributed-and-edge-serving
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask whether the problem is fitting the model, serving more users, speeding up each token, or living within a device's heat, battery, and privacy limits.
    remediation_scene: distributed-and-edge-serving.s4
    variants:
      - id: distributed-and-edge-serving.transfer.v2.1
        prompt: A hospital runs a speech-to-text model on tablets so audio never leaves the building. The model fits and runs fast in a two-minute demo. What should the team test next?
        options:
          - id: a
            text: Its speed after 20 minutes of steady use, once the tablet warms up
          - id: b
            text: Whether its speed matches the same model on a cooled server GPU
          - id: c
            text: Whether the model file is the same size as the server version
        answer: a
        feedback: Sustained work heats a mobile chip, and the device slows itself down, so a short demo overstates real speed. A server benchmark says nothing about the tablet, and file size was already known to fit.
      - id: distributed-and-edge-serving.transfer.v2.2
        prompt: A translation company's 70B model runs tensor-parallel on 8 GPUs to meet its latency target. Traffic doubles. Which change keeps latency and doubles capacity?
        options:
          - id: b
            text: Split the same single copy across 16 GPUs with tensor parallelism
          - id: c
            text: Rearrange the 8 GPUs into a pipeline of 8 stages, one per GPU
          - id: a
            text: Add a second 8-GPU copy of the model and balance traffic between them
        answer: a
        feedback: A second replica serves twice the requests at the same per-token speed. Going to 16-way tensor parallelism mostly adds all-reduce time, and an 8-stage pipeline would make each token visit the GPUs one after another.
      - id: distributed-and-edge-serving.transfer.v2.3
        prompt: A journaling app moves its model onto the phone so that entries stay private. What still needs a privacy review?
        options:
          - id: c
            text: The quantization method, which could leak entries into the scales
          - id: a
            text: Logs, crash reports, and sync that could carry entries off the phone
          - id: b
            text: The model's weights, which could absorb entries as they are typed
        answer: a
        feedback: Local inference keeps the computation on the device, but the rest of the app can still send text away. Weights and scales are fixed during use and don't store what users type.
      - id: distributed-and-edge-serving.transfer.v2.4
        prompt: A startup splits a 70B model with tensor parallelism across GPUs in two separate cloud machines connected by ordinary networking. Tokens come out slowly. What is a better layout?
        options:
          - id: a
            text: Tensor parallelism inside each machine, and pipeline stages between them
          - id: b
            text: A higher tensor-parallel degree, to spread the traffic more thinly
          - id: c
            text: Fewer all-reduces, by giving each GPU a bigger share of the KV cache
        answer: a
        feedback: Each of the many per-token all-reduces pays the slow network's latency. Pipelining across machines sends one small activation per boundary per token instead. More tensor-parallel GPUs would add even more waiting, and cache size doesn't change how many all-reduces a layer needs.
  - id: distributed-and-edge-serving.placement
    objective_ref: objective.distributed-and-edge-serving
    task: base
    response_type: numeric
    points: 1
    hint: Weight bytes = parameters × bytes per weight; tensor parallelism divides them by the number of GPUs. Time per token ≈ bytes per GPU ÷ bandwidth, plus two all-reduces per layer.
    remediation_scene: distributed-and-edge-serving.s2
    absolute_tolerance: 0.05
    variants:
      - id: distributed-and-edge-serving.placement.1
        prompt: A 70-billion-parameter model in 16-bit is split four ways with tensor parallelism. How many GB of weights does each GPU hold?
        answer: 35
        feedback: 70 billion × 2 bytes = 140 GB, and 140 ÷ 4 = 35 GB per GPU.
      - id: distributed-and-edge-serving.placement.2
        prompt: A 70B model in 16-bit is split eight ways, and each GPU reads its slice at 2 TB/s. Ignoring communication, how many milliseconds does each decode step take?
        answer: 8.75
        feedback: 140 GB ÷ 8 = 17.5 GB per GPU, and 17.5 GB ÷ 2,000 GB/s = 8.75 ms.
      - id: distributed-and-edge-serving.placement.3
        prompt: A tensor-parallel model has 80 layers, needs two all-reduces per layer for each token, and each all-reduce takes 10 µs. How many milliseconds of communication does each token add?
        answer: 1.6
        feedback: 80 × 2 = 160 all-reduces, and 160 × 10 µs = 1,600 µs = 1.6 ms.
      - id: distributed-and-edge-serving.placement.4
        prompt: A 405-billion-parameter model is stored in 16-bit. How many GB do its weights take?
        answer: 810
        feedback: 405 billion × 2 bytes = 810 GB, more than a machine of eight 80 GB GPUs holds.
      - id: distributed-and-edge-serving.placement.5
        prompt: A 3-billion-parameter model is stored at exactly 4 bits per weight on a phone. How many GB does it take?
        answer: 1.5
        feedback: 3 billion × 0.5 bytes = 1.5 GB. Group-wise scales would add a little more.
