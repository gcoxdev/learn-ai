schema_version: 0.2-draft
lesson:
  id: distributed-and-edge-serving
  version: 0.4.0-draft
  title: Place model computation where memory and latency allow it
  state: draft
  summary: A 70B model won't fit on one GPU, and a phone has a few gigabytes to spare. Decide when to split a model, when to copy it, and when to shrink it onto the device.
  slot: M27.7
  category: learning
  sources:
    - title: The Llama 3 Herd of Models (Llama Team, Meta, 2024), section on inference
      url: https://arxiv.org/abs/2407.21783
    - title: "Megatron-LM: Training Multi-Billion Parameter Language Models Using Model Parallelism (Shoeybi et al., 2019)"
      url: https://arxiv.org/abs/1909.08053
    - title: Efficiently Scaling Transformer Inference (Pope et al., 2022)
      url: https://arxiv.org/abs/2211.05102
    - title: "FlexGen: High-Throughput Generative Inference of Large Language Models with a Single GPU (Sheng et al., 2023)"
      url: https://arxiv.org/abs/2303.06865
objectives:
  - id: objective.distributed-and-edge-serving
    version: 2-draft
    statement: Distributed, offloaded, and edge inference trade memory capacity, communication, privacy boundaries, and latency; model placement must match the hardware topology and request workload.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - distributed-and-edge-serving.base.v2
      - distributed-and-edge-serving.transfer.v2
      - distributed-and-edge-serving.placement
    prerequisites:
      - anyOf:
          - objective.serving-expert-models
      - anyOf:
          - objective.model-parallel-training
      - anyOf:
          - objective.quantization-pruning-and-compression
scenes:
  - id: distributed-and-edge-serving.s1
    title: Split to fit, copy to scale
    type: explanation
    depth: intuition
    objective_refs:
      - objective.distributed-and-edge-serving
    markdown: |-
      Fern is a hit, and two teams want more. The plant-doctor team wants a bigger model, Llama 3.1 70B, for tricky diagnoses. The mobile team wants Fern to spot leaf problems from photos in the greenhouse, *without* an internet connection.

      The 70B model needs 70 billion × 2 bytes = 140 GB in 16-bit, and an A100 holds 80 GB. There are two ways to use more GPUs, and they solve different problems:

      | | **Replicas** | **Model parallelism** |
      | --- | --- | --- |
      | What each GPU holds | A full copy of the model | A slice of one copy |
      | Each request uses | One GPU | Several GPUs at once |
      | Helps with | More customers at a time | A model too big for one GPU, and faster tokens |
      | Costs | Nothing extra per request | Communication between GPUs on every token |

      The 70B model must be split. An **edge device**, such as a phone or a laptop, is the opposite problem: one small device, one user, and a model that must shrink to fit.

      :::mixup "Four GPUs make every reply four times faster."
      Four replicas of the 8B model make no reply faster: each customer still gets one GPU's 125 tokens per second, and four times as many customers get it. Splitting one copy does speed up each token, but communication takes a cut, as the next scene measures.
      :::
    bridges: []
  - id: distributed-and-edge-serving.s2
    title: Tensor parallelism splits every layer
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.distributed-and-edge-serving
    markdown: |-
      The lesson on splitting models across devices showed Megatron-LM's **tensor parallelism**: each GPU holds a slice of every weight matrix, computes its part of each layer, and an **all-reduce** (every GPU sends its partial result and receives the sum) combines the parts. For decoding this has a bonus: each GPU reads only *its* slice of the weights, and all of them read at once. Four GPUs read 140 GB as four 35 GB reads in parallel.

      The price is two all-reduces per layer for every token: one after attention and one after the MLP. Llama 3.1 70B has 80 layers, so that's 160 all-reduces per token. Each moves just one 8,192-number vector per token, 16 KB in 16-bit, so bandwidth barely matters. What matters is latency: each all-reduce makes every GPU wait for the others. Assume 10 µs each over **NVLink**, NVIDIA's fast GPU-to-GPU link inside one machine:

      ```python run
      GPU_GB, BW = 80, 2.0e12        # A100 80 GB: memory and bandwidth
      ALLREDUCE = 10e-6              # assumed time for one small all-reduce over NVLink

      def plan(name, params, layers, gpus, bytes_per_weight=2):
          per_gpu = params * bytes_per_weight / gpus / 1e9          # GB of weights per GPU
          if per_gpu >= GPU_GB:
              print(f"{name:9} on {gpus} GPU(s): {per_gpu:5.1f} GB each, does not fit")
              return
          read = per_gpu * 1e9 / BW                                 # every GPU reads its slice at once
          comm = 2 * layers * ALLREDUCE if gpus > 1 else 0          # two all-reduces per layer
          step = read + comm
          print(f"{name:9} on {gpus} GPU(s): {per_gpu:5.1f} GB each, {GPU_GB - per_gpu:4.1f} GB left,"
                f" {step * 1e3:5.2f} ms/token ({comm * 1e3:.1f} comm) = {1 / step:4.0f} tokens/s")

      plan("Llama 8B", 8e9, 32, 1)
      for n in [1, 2, 4, 8]:
          plan("Llama 70B", 70e9, 80, n)
      ```

      Two GPUs fit the weights but leave only 10 GB each for KV caches. Four GPUs give 52 tokens per second with 45 GB each to spare, a sensible choice for Fern. Eight reach 97 tokens per second, and communication is now 1.6 of 10.35 ms, a sixth of every step. Change `ALLREDUCE` to `100e-6`, closer to a hop between machines over an ordinary network: the eight-GPU plan drops to 40 tokens per second, with communication taking two-thirds of every step. That's why tensor parallelism stays inside one NVLink-connected machine.
    diagram:
      caption: Tensor-parallel decoding on four GPUs. Each GPU reads a quarter of the weights; all-reduces join the parts.
      description: The new token's vector is sent to four GPUs. Each GPU holds a quarter of every layer's weights, 35 GB, and computes its part of the layer. An all-reduce over NVLink sums the four partial results and gives every GPU the full output, which feeds the next layer. This happens twice per layer, 160 times per token for an 80-layer model.
