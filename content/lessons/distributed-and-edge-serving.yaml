    bridges: []
  - id: distributed-and-edge-serving.pipeline
    title: Pipeline stages for models that outgrow a machine
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.distributed-and-edge-serving
    markdown: |-
      Llama 3.1 405B needs 810 GB in 16-bit, more than a whole machine of eight 80 GB GPUs. Meta's Llama 3 paper describes how they served it in BF16: 16 GPUs on two machines, with tensor parallelism *inside* each machine over NVLink and **pipeline parallelism** *between* them. Machine 1 holds the first half of the layers, machine 2 the second half, and only the activations at the boundary cross the slower network: one 16,384-number vector per token, 32 KB.

      Pipelining lets a model fit, but it doesn't make one request faster: each token still passes through every layer in turn. Servers keep both stages busy with several requests in flight, like the microbatches of a training pipeline. The same paper also describes FP8 quantization of the 405B model, which, at about 1 byte per weight, lets it fit on one machine.

      :::predict Why not use pipeline parallelism across Fern's four GPUs instead of tensor parallelism, since it needs so little communication?
      Because Fern needs speed per customer. With four pipeline stages, each token visits the four GPUs one after another, and each reads its 35 GB in turn, so a token takes about as long as on one giant GPU: roughly 70 ms, about 14 tokens per second. Tensor parallelism has all four read at once, which is how it reaches 52.
      :::
    bridges: []
  - id: distributed-and-edge-serving.s3
    title: Fit a model into a phone
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.distributed-and-edge-serving
    markdown: |-
      The greenhouse feature runs on the customer's phone. A phone with 8 GB of RAM shares it with the operating system and every other app, so the model gets perhaps 2–3 GB. Meta released Llama 3.2 1B and 3B in 2024 with this use in mind. The 3B model in int4 with group-wise scales needs about 3.2 billion × 4.125 bits ≈ 1.65 GB, a little more if its embedding table stays in 16 bits.

      The GPU arithmetic still applies. If the phone's memory delivers around 50 GB/s (a rough figure; phones vary), each decode step takes about 1.65 GB ÷ 50 GB/s ≈ 33 ms: about 30 tokens per second, fine for reading. Prefill is where phones struggle, since their compute is far below a data-center GPU's, so keep on-device prompts short.

      Two limits don't show up in a quick demo:

      - **Battery.** Every token reads the whole model from memory, and moving bytes costs energy, so long answers take a visible bite out of the battery.
      - **Heat.** Sustained generation warms the chip, and the phone lowers its clock speed to cool down. A model that runs at 30 tokens per second for the first minute may run noticeably slower after five.

      Running on the device keeps photos off Fernly's servers, but check its logs, crash reports, and cloud sync too: any of them can carry the same data away.
    bridges: []
  - id: distributed-and-edge-serving.s4
    title: Put each feature where it fits
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.distributed-and-edge-serving
    markdown: |-
      Fernly's team lays out the three placements side by side:

      | | Phone, 3B int4 | One GPU, 8B bf16 | Four GPUs, 70B, tensor parallel |
      | --- | --- | --- | --- |
      | Works offline | Yes | No | No |
      | Photos leave the phone | No | Yes | Yes |
      | Tokens per second, one user | about 30, falling as it heats | 125 | 52 |
      | Hardware per copy | the customer's phone | 1 GPU | 4 GPUs |
      | Quality on their test set | lowest | good | best on hard diagnoses |

      They ship all three. Offline leaf checks run on the phone and hand off to the server when a connection returns. Everyday chat stays on 8B replicas, one more per GPU as traffic grows. Questions the 8B model marks as uncertain go to one 70B copy split across four GPUs. Copy a model to serve more people, split it when it doesn't fit, and shrink it when it has to travel.
    bridges: []
  - id: distributed-and-edge-serving.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.distributed-and-edge-serving
    markdown: Per-GPU memory and per-token timings to compute, then a hospital tablet, a traffic spike, a private journal app, and a cross-machine split test whether you can place a model on the right hardware.
    takeaway: |-
      Copy a model to serve more users; split it with tensor parallelism inside a machine to fit it and speed up each token; add pipeline stages across machines for the largest models; shrink it to run on a device, and test there for heat and battery.
  - id: distributed-and-edge-serving.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.distributed-and-edge-serving
    markdown: |-
      Splitting a model can make it fit; replicating a model can serve more requests. Count communication, extra memory, and device limits when choosing where to run it.
