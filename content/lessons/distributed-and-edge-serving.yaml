scenes:
- id: distributed-and-edge-serving.s1
  title: Split a model or replicate a service
  type: explanation
  depth: intuition
  objective_refs:
  - objective.distributed-and-edge-serving
  markdown: Model parallelism divides one request’s computation across devices; replicas serve different requests
    with copies of the model. Combining both can improve capacity and throughput. The distinction matters when interpreting
    whether additional devices accelerate one user or support more concurrent users.
  text_mode: Model parallelism divides one request’s computation across devices; replicas serve different requests
    with copies of the model. Combining both can improve capacity and throughput. The distinction matters when interpreting
    whether additional devices accelerate one user or support more concurrent users.
  bridges: []
- id: distributed-and-edge-serving.s2
  title: Count communication on the request path
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.distributed-and-edge-serving
  markdown: Tensor-parallel layers may communicate repeatedly; pipeline stages transfer activations; experts dispatch
    tokens. Slow links can dominate small decode steps. Placement near fast interconnects and suitable batching
    helps only when it matches the actual transfer pattern.
  text_mode: Tensor-parallel layers may communicate repeatedly; pipeline stages transfer activations; experts dispatch
    tokens. Slow links can dominate small decode steps. Placement near fast interconnects and suitable batching
    helps only when it matches the actual transfer pattern.
  bridges: []
- id: distributed-and-edge-serving.s3
  title: Move computation to constrained devices
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.distributed-and-edge-serving
  markdown: Edge devices have limits on memory, power, thermal behavior, and supported kernels. Quantization and
    smaller models can help, while offloading to CPU or storage adds transfer costs. Local execution can keep some
    data on device, but privacy still depends on logging, synchronization, and the surrounding application.
  text_mode: Edge devices have limits on memory, power, thermal behavior, and supported kernels. Quantization and
    smaller models can help, while offloading to CPU or storage adds transfer costs. Local execution can keep some
    data on device, but privacy still depends on logging, synchronization, and the surrounding application.
  bridges: []
- id: distributed-and-edge-serving.s4
  title: Compare a complete operating scenario
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.distributed-and-edge-serving
  markdown: Evaluate cold load, warm latency, sustained throughput, battery or power behavior where relevant, network
    failure, and model quality. A benchmark from a cooled server does not predict a phone’s sustained performance.
    Document what remains local and what crosses a service boundary.
  text_mode: Evaluate cold load, warm latency, sustained throughput, battery or power behavior where relevant, network
    failure, and model quality. A benchmark from a cooled server does not predict a phone’s sustained performance.
    Document what remains local and what crosses a service boundary.
  bridges: []
