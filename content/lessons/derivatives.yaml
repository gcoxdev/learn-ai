schema_version: 0.2-draft
lesson:
  id: derivatives
  version: 0.3.0-draft
  title: A derivative is a local change
  state: draft
  summary: Measure how an output responds to a small input change, starting with a straight-line rule and then
    a curve.
  slot: B12
  category: bridge
  sources:
  - title: Dive into Deep Learning — calculus
    url: https://d2l.ai/chapter_preliminaries/calculus.html
  - title: OpenStax — use the language of algebra
    url: https://openstax.org/books/elementary-algebra-2e/pages/1-2-use-the-language-of-algebra
  archetype: foundation
objectives:
- id: objective.derivatives
  version: 2-draft
  statement: Distinguish a finite-step average rate from a derivative, calculate both for a square, and use
    a loss slope to choose a small update direction.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - derivatives.base.v2
  - derivatives.transfer.v2
  prerequisites:
  - anyOf:
    - objective.functions
  - anyOf:
    - objective.algebra-notation
scenes:
- id: derivatives.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.derivatives
  title: Start with a rate you can picture
  markdown: 'Suppose a toy delivery estimate is f(x) = 3x minutes, where x is distance in kilometers. Increasing
    x from 2 to 3 increases the estimate from 6 to 9 minutes: three extra minutes for one extra kilometer.
    Increasing x by half a kilometer adds one and a half minutes. A **rate of change** compares the output
    change with the input change. Here that rate is 3 minutes per kilometer wherever you start. The notation
    f(x) simply names the output of the rule at input x.'
  text_mode: 'Suppose a toy delivery estimate is f(x) = 3x minutes, where x is distance in kilometers. Increasing
    x from 2 to 3 increases the estimate from 6 to 9 minutes: three extra minutes for one extra kilometer.
    Increasing x by half a kilometer adds one and a half minutes. A **rate of change** compares the output
    change with the input change. Here that rate is 3 minutes per kilometer wherever you start. The notation
    f(x) simply names the output of the rule at input x.'
  bridges:
  - functions
  - arithmetic
- id: derivatives.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.derivatives
  title: Calculate a finite-step average
  markdown: For a curved rule f(x) = x², the rate depends on where you look. Start at x = 2, where f(2) = 4.
    Move to 3, where f(3) = 9. The output changes by 5 over an input change of 1, so the average rate on that
    interval is 5. We can write it as [f(3) − f(2)] / (3 − 2). The slash means divide. This is an average across
    a real interval, not the exact rate at its starting point.
  text_mode: For a curved rule f(x) = x², the rate depends on where you look. Start at x = 2, where f(2) =
    4. Move to 3, where f(3) = 9. The output changes by 5 over an input change of 1, so the average rate on
    that interval is 5. We can write it as [f(3) − f(2)] / (3 − 2). The slash means divide. This is an average
    across a real interval, not the exact rate at its starting point.
  bridges: []
- id: derivatives.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.derivatives
  title: Look closer to one point
  markdown: Keep starting at 2 but shrink the step. A step of 0.1 reaches 2.1, whose square is 4.41. The average
    rate is (4.41 − 4) / 0.1 = 4.1. A step of 0.01 gives (4.0401 − 4) / 0.01 = 4.01. These averages approach
    4 as the step approaches zero. The **derivative** is this limiting rate when a consistent limit exists.
    We do not substitute a zero step into the fraction, which would require dividing zero by zero.
  text_mode: Keep starting at 2 but shrink the step. A step of 0.1 reaches 2.1, whose square is 4.41. The average
    rate is (4.41 − 4) / 0.1 = 4.1. A step of 0.01 gives (4.0401 − 4) / 0.01 = 4.01. These averages approach
    4 as the step approaches zero. The **derivative** is this limiting rate when a consistent limit exists.
    We do not substitute a zero step into the fraction, which would require dividing zero by zero.
  bridges: []
  figure:
    kind: derivative
    caption: A secant measures an average over a finite interval; the tangent gives the local slope at one
      point.
    description: For f(x)=x², compare the slope from x to x+h with the local derivative 2x. Decreasing positive
      h brings the finite-interval slope closer to the derivative, including at negative x and at zero.
- id: derivatives.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.derivatives
  title: Derive the rule for a square
  markdown: 'Let the starting point be x and the small nonzero step be h. Expanding (x+h)² gives x² + 2xh +
    h². Subtract x², then divide by h: the average rate becomes 2x + h. As h approaches zero, the remaining
    value is 2x. Thus the derivative of x² is 2x. The notation f′(x), read “f prime of x,” names the derivative;
    df/dx names the same rate here. At x = −2 it is −4, so increasing x slightly decreases its square.'
  text_mode: 'Let the starting point be x and the small nonzero step be h. Expanding (x+h)² gives x² + 2xh
    + h². Subtract x², then divide by h: the average rate becomes 2x + h. As h approaches zero, the remaining
    value is 2x. Thus the derivative of x² is 2x. The notation f′(x), read “f prime of x,” names the derivative;
    df/dx names the same rate here. At x = −2 it is −4, so increasing x slightly decreases its square.'
  bridges: []
- id: derivatives.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.derivatives
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A derivative describes local sensitivity. Its sign suggests which small direction changes the output,
    while its size connects input units to output units.
- id: derivatives.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.derivatives
  markdown: 'A derivative measures local sensitivity: how an output changes when an input changes by a small
    amount.'
  text_mode: 'A derivative measures local sensitivity: how an output changes when an input changes by a small
    amount.'
- id: derivatives.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.derivatives
  title: Connect a derivative to a loss
  markdown: 'A **loss** is a score for how badly a prediction misses its target. Suppose a toy loss is L(w)
    = (w − 3)². Its derivative is 2(w − 3). At w = 1, loss is 4 and derivative is −4. A small increase in w
    reduces the loss: w = 1.1 gives 3.61. At w = 4, derivative is +2, so a small decrease helps instead. This
    concerns the loss as a function of a setting, not time passing and not the accuracy of every possible example.'
  text_mode: 'A **loss** is a score for how badly a prediction misses its target. Suppose a toy loss is L(w)
    = (w − 3)². Its derivative is 2(w − 3). At w = 1, loss is 4 and derivative is −4. A small increase in w
    reduces the loss: w = 1.1 gives 3.61. At w = 4, derivative is +2, so a small decrease helps instead. This
    concerns the loss as a function of a setting, not time passing and not the accuracy of every possible example.'
  bridges: []
- id: derivatives.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.derivatives
  title: Use the direction with a controlled step
  markdown: Gradient descent updates a setting by subtracting a small positive step size times its derivative.
    With w = 1, derivative −4, and step size 0.1, the next setting is 1 − 0.1 × (−4) = 1.4. The double minus
    makes an increase. A large step can jump past a good region, and a derivative of zero does not by itself
    prove a global minimum. A function can also have a corner where no derivative exists. Derivatives are precise
    local information; the update procedure must use them carefully.
  text_mode: Gradient descent updates a setting by subtracting a small positive step size times its derivative.
    With w = 1, derivative −4, and step size 0.1, the next setting is 1 − 0.1 × (−4) = 1.4. The double minus
    makes an increase. A large step can jump past a good region, and a derivative of zero does not by itself
    prove a global minimum. A function can also have a corner where no derivative exists. Derivatives are precise
    local information; the update procedure must use them carefully.
  bridges: []
