scenes:
- id: derivatives.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.derivatives
  text_mode: The complete explanation is available as readable text.
  title: Compare two nearby points
  markdown: 'If a journey gains 20 meters over 10 horizontal meters, its average slope is 2. A curved path can have
    different slopes at different positions.


    For a function, compare the change in output with the change in input. A derivative captures the limiting local
    slope where that limit exists.'
- id: derivatives.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.derivatives
  text_mode: The complete explanation is available as readable text.
  title: Use small changes first
  markdown: 'For f(w)=w² near w=2, compare f(2.01)=4.0401 with f(2)=4. The difference divided by 0.01 is 4.01. Smaller
    changes approach slope 4.


    A centered finite difference compares values on both sides. This is a numerical check; finite precision and
    approximation error matter.'
- id: derivatives.s3
  type: explanation
  depth: intuition
  objective_refs:
  - objective.derivatives
  text_mode: The complete explanation is available as readable text.
  title: The sign suggests a direction
  markdown: 'On a loss-versus-weight curve, a positive derivative says a tiny increase in weight raises loss locally;
    a negative derivative says it lowers loss locally.


    A large step can leave this local region. The sign alone does not guarantee that a step of any size improves
    the result.'
- id: derivatives.s4
  type: explanation
  depth: intuition
  objective_refs:
  - objective.derivatives
  text_mode: The complete explanation is available as readable text.
  title: Connect words and symbols
  markdown: 'For f(w)=w², the derivative is 2w. At w=2 it is 4; at w=−2 it is −4.


    A derivative is a local rate of change, not the function value itself. At w=3, the value is 9 but the derivative
    is 6.'
- id: derivatives.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
