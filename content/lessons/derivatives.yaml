schema_version: 0.2-draft
lesson:
  id: derivatives
  version: 0.4.0-draft
  title: A derivative is a local change
  state: draft
  summary: Every training step asks "if I nudge this weight, how fast does the loss change?" Zoom in on a curve until two-point slopes settle on one number, the derivative.
  slot: B12
  category: bridge
  sources:
    - title: Dive into Deep Learning — calculus
      url: https://d2l.ai/chapter_preliminaries/calculus.html
    - title: OpenStax — use the language of algebra
      url: https://openstax.org/books/elementary-algebra-2e/pages/1-2-use-the-language-of-algebra
  archetype: foundation
objectives:
  - id: objective.derivatives
    version: 2-draft
    statement: Distinguish a finite-step average rate from a derivative, calculate both for a square, and use a loss slope to choose a small update direction.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - derivatives.base.v2
      - derivatives.transfer.v2
    prerequisites:
      - anyOf:
          - objective.functions
      - anyOf:
          - objective.algebra-notation
scenes:
  - id: derivatives.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.derivatives
    title: Start with a rate you can picture
    markdown: |-
      Gradient descent, the method that trains nearly every neural network, asks one question over and over: if I nudge this weight, does the loss go up or down, and how fast? That "how fast" is a derivative.

      Start with something steady. A kettle warms the water 3 °F every second, so after x seconds it is f(x) = 3x degrees warmer. (f(x) just names the rule's output at input x.) From 2 to 3 seconds the warming goes from 6 to 9 degrees: 3 degrees per second. From 2 to 2.5 seconds it's 1.5 degrees in half a second: again 3 per second.

      That ratio, output change divided by input change, is the **rate of change**. For a straight-line rule it's the same wherever you start and whatever step you take.
    bridges:
      - functions
      - arithmetic
  - id: derivatives.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.derivatives
    title: On a curve, the rate depends on where you look
    markdown: |-
      Now take a curved rule, f(x) = x², and measure its rate over two one-step intervals:

      | Interval | Output change | Rate |
      | --- | ---: | ---: |
      | 1 to 2 | 4 − 1 = 3 | 3 |
      | 2 to 3 | 9 − 4 = 5 | 5 |

      The curve steepens as x grows, so each interval gives a different answer. Each is an **average rate** over a step of size h starting at x:

      $$\frac{f(x + h) - f(x)}{h}$$

      The 5 describes the whole stretch from 2 to 3, not the steepness right at x = 2. To get that, shrink the interval.
    bridges: []
  - id: derivatives.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.derivatives
    title: Shrink the step until the rate settles
    markdown: |-
      Keep the start at x = 2 and make the step smaller:

      | Step h | f(2 + h) | Average rate |
      | ---: | ---: | ---: |
      | 1 | 9 | 5 |
      | 0.1 | 4.41 | 4.1 |
      | 0.01 | 4.0401 | 4.01 |
      | 0.001 | 4.004001 | 4.001 |

      The averages close in on 4. That limit is the **derivative** at x = 2: the steepness at that single point. You can't just set h = 0, since the fraction would become 0 ÷ 0; you watch what the averages approach instead.

      In the lab, the ochre line, called a secant, joins two points (its slope is the average rate) and the green line, the tangent, touches the curve at one point (its slope is the derivative). At the start, x = 1 and h = 1, the two slopes are 3 and 2. Slide h down to 0.01 and the ochre slope becomes 2.01.

      :::mixup "The slope at x = 2 is 5, because that's the slope from 2 to 3."
      5 averages over a stretch where the curve keeps steepening. The slope *at* 2 is the limit as the stretch shrinks: 4.
      :::
    bridges: []
    figure:
      kind: derivative
      caption: A secant measures an average over a finite interval; the tangent gives the local slope at one point.
      description: For f(x)=x², compare the slope from x to x+h with the local derivative 2x. Decreasing positive h brings the finite-interval slope closer to the derivative, including at negative x and at zero.
  - id: derivatives.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.derivatives
    title: 'A shortcut: the derivative of x² is 2x'
    markdown: |-
      Let algebra do the shrinking once, for every x. Take a small nonzero step h:

      1. Expand: (x + h)² = x² + 2xh + h².
      2. Subtract x²: the output change is 2xh + h².
      3. Divide by h: the average rate is 2x + h.
      4. Let h shrink to 0: the derivative is 2x.

      We write f′(x) = 2x ("f prime of x") or df/dx = 2x. At x = 2 that's 4, and step 3 explains the table: each average is 4 plus h.

      :::predict What is the derivative of x² at x = −2, and what does its sign mean?
      2 × (−2) = −4. Increasing x slightly makes x² *smaller*: (−1.9)² = 3.61, less than 4.
      :::

      ```python run
      def f(x):
          return x ** 2

      x = 2.0
      print("     h    average rate over [x, x + h]")
      for h in [1, 0.1, 0.01, 0.001]:
          print(f"{h:>6}    {(f(x + h) - f(x)) / h:.4f}")
      print("derivative 2x at x =", x, "is", 2 * x)
      ```

      Set `x = -2.0` and the averages run −3, −3.9, −3.99, −3.999 toward −4. Then change the rule to `x ** 3`: the averages head for 12, not 4, because the derivative of x³ is 3x².
    bridges: []
  - id: derivatives.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.derivatives
    markdown: Fresh points on the x² curve and new starting weights for a loss ask you to separate an average rate from a derivative and take a signed step.
    takeaway: |-
      A derivative is the rate of change at a single point: the limit of two-point slopes as the step shrinks. Its sign tells a training step which way is downhill.
  - id: derivatives.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.derivatives
    markdown: |-
      A derivative measures local sensitivity: how an output changes when an input changes by a small amount.
  - id: derivatives.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.derivatives
    title: A loss has a slope too
    markdown: |-
      A **loss** scores how badly a prediction misses its target; training pushes it down. Take L(w) = (w − 3)² for one adjustable weight w. It's smallest, 0, at w = 3.

      Expanded, L(w) = w² − 6w + 9. The w² term changes at rate 2w, the −6w term at a steady −6, and the 9 not at all, so L′(w) = 2w − 6 = 2(w − 3).

      | w | Loss | Slope 2(w − 3) | Nudging w up… |
      | ---: | ---: | ---: | --- |
      | 1 | 4 | −4 | lowers the loss |
      | 4 | 1 | +2 | raises the loss |
      | 3 | 0 | 0 | changes nothing: the bottom |

      Check the first row: (1.1 − 3)² = 3.61, lower than 4. The sign says which way is downhill; the size says how steep.
    bridges: []
  - id: derivatives.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.derivatives
    title: Step downhill, one small move at a time
    markdown: |-
      **Gradient descent** turns the slope into an update, scaled by a small positive **learning rate**:

      $$w_{\text{new}} = w - \text{learning rate} \times L'(w)$$

      At w = 1, with slope −4 and learning rate 0.1: w_new = 1 − 0.1 × (−4) = 1.4. The two minus signs make an increase, as the slope said they should. The loss falls from 4 to (1.4 − 3)² = 2.56.

      Step again. At 1.4 the slope is 2(1.4 − 3) = −3.2, so w_new = 1.4 + 0.32 = 1.72 and the loss is 1.6384. Steps shrink as the ground flattens.

      Keep the rate small: the derivative only describes the curve near where you stand. The lessons on how a model improves a prediction and on gradient checks use this same update and these same nudges.
    bridges: []
