schema_version: 0.2-draft
lesson:
  id: derivatives
  version: 0.1.0-draft
  title: A derivative is a local change
  state: draft
  summary: 'A derivative measures local sensitivity: how an output changes when an input changes by a small amount.'
  slot: B12
  category: bridge
  minutes: 8
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — topic overview'
    url: https://aima.cs.berkeley.edu/contents.html
objectives:
- id: objective.derivatives
  version: 1-draft
  statement: 'A derivative measures local sensitivity: how an output changes when an input changes by a small amount.'
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - derivatives.base
  - derivatives.transfer
  prerequisites:
