assessment_families:
- id: derivatives.base
  objective_ref: objective.derivatives
  task: base
  response_type: single_choice
  points: 1
  hint: 'A derivative measures local sensitivity: how an output changes when an input changes by a small amount.'
  variants:
  - id: derivatives.base.1
    prompt: For f(w)=w², what is the derivative 2w at w=3?
    options:
    - id: b
      text: '3'
    - id: correct
      text: '6'
    - id: a
      text: '9'
    answer: correct
    feedback: The derivative is 2w, so at w=3 it is 6. The function value 9 is different.
  - id: derivatives.base.2
    prompt: What does a negative loss derivative indicate locally?
    options:
    - id: correct
      text: A small increase in weight lowers loss.
    - id: a
      text: Every possible positive step improves loss.
    - id: b
      text: The loss itself must be negative.
    answer: correct
    feedback: A small increase in weight lowers loss.
- id: derivatives.transfer
  objective_ref: objective.derivatives
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'A derivative measures local sensitivity: how an output changes when an input changes by a small amount.'
  variants:
  - id: derivatives.transfer.1
    prompt: At w=3, f(w)=9 and its derivative is 6. What does 6 describe?
    options:
    - id: correct
      text: Local output change per small input change.
    - id: a
      text: The function’s output value.
    - id: b
      text: The total number of weights.
    answer: correct
    feedback: Local output change per small input change.
  - id: derivatives.transfer.2
    prompt: A finite-difference check agrees at one point. What follows?
    options:
    - id: a
      text: Every derivative in any network is proven correct.
    - id: b
      text: The model must generalize perfectly.
    - id: correct
      text: It supports that local calculation, with numerical limitations.
    answer: correct
    feedback: It supports that local calculation, with numerical limitations.
