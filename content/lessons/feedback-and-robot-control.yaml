scenes:
  - id: feedback-and-robot-control.s1
    title: The lift that worked until the mug was full
    type: explanation
    depth: intuition
    objective_refs:
      - objective.feedback-and-robot-control
    markdown: |-
      Tidy, our kitchen robot, has a lift: a carriage that slides the arm up its column to reach the shelf at 0.30 ft above its starting position. In testing, "run the motor at half power for 1.2 seconds" landed the empty gripper exactly on 0.30 ft. Then Tidy picked up a full mug, and the same command stopped 0.04 ft low. On a cold morning, with stiffer grease, it stopped 0.06 ft low.

      That command was **open loop**: it runs without checking the result. It works only as long as the world matches the test.

      The fix is to measure and correct. A **closed-loop** (feedback) controller reads the lift's height from the joint encoder, compares it with the target, and sets the motor from the difference, the **error**, many times a second. A full mug or stiff grease now just means the error stays bigger for longer, and the controller keeps pushing.

      The physical system being controlled is called the **plant**; here, the carriage, its motor, and whatever it carries. Anything that pushes the plant off course, like the mug's weight, is a **disturbance**.
    diagram:
      caption: A feedback loop. The controller sees only the error; the sensor closes the loop.
      description: The target height and the measured height meet at a comparison, which produces the error. The error goes to the controller, which sends a motor force to the lift (the plant). A disturbance, the mug's weight, also acts on the lift. The joint encoder measures the lift's height and feeds it back to the comparison.
      nodes:
        - id: target
          label: Target height
          note: 0.30 ft
          col: 0
          row: 0
          tone: muted
        - id: compare
          label: Compare
          note: error = target − measured
          col: 1
          row: 0
          tone: accent
        - id: controller
          label: Controller (PID)
          col: 2
          row: 0
        - id: plant
          label: Lift (the plant)
          col: 3
          row: 0
        - id: disturb
          label: Disturbance
          note: mug weight, stiff grease
          col: 3
          row: 1
          tone: warn
        - id: sensor
          label: Joint encoder
          note: measures height
          col: 2
          row: 1
          tone: data
      edges:
        - from: target
          to: compare
        - from: compare
          to: controller
          label: error
        - from: controller
          to: plant
          label: motor force
        - from: disturb
          to: plant
          dashed: true
        - from: plant
          to: sensor
        - from: sensor
          to: compare
          label: measured height
    bridges: []
  - id: feedback-and-robot-control.s2
    title: Three reasons to push
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.feedback-and-robot-control
    markdown: |-
      The workhorse of robot control is **PID**, short for **proportional–integral–derivative**. It adds three reasons to push:

      | Term | Reacts to | Plain meaning |
      | --- | --- | --- |
      | P, proportional | The error now | Far from the target? Push harder. |
      | I, integral | Error added up over time | Been short for a while? Push harder still. |
      | D, derivative | How fast the error is changing | Closing in fast? Brake. |

      Measure position in feet and force in pounds of force (lbf). Work one update of Tidy's lift, 100 times a second ($\Delta t = 0.01$ s). The target is 0.30 ft and the carriage is at 0.26 ft, so the error is $e = 0.04$ ft. The gains are $K_p = 25$, $K_i = 30$, $K_d = 0.5$.

      - **P:** $25 \times 0.04 = 1.0$ lbf.
      - **I:** the errors so far add up to 0.05 ft·s, so $30 \times 0.05 = 1.5$ lbf.
      - **D:** a step ago the error was 0.05, so it's shrinking at $(0.04 - 0.05)/0.01 = -1.0$ ft/s, and $0.5 \times (-1.0) = -0.5$ lbf.

      The motor force is $1.0 + 1.5 - 0.5 = 2.0$ lbf. The D term is negative: the carriage is rising fast, so the controller eases off before it arrives.

      :::papers The PID law
      $$u(t) = K_p\, e(t) + K_i \int_0^t e(\tau)\, d\tau + K_d \frac{de(t)}{dt}$$

      $u$ is the command (our 2.0 lbf), and $e$ is target minus measured. A computer uses sums and differences: $\int e \approx \sum e_k \Delta t$ (our 0.05 ft·s) and $de/dt \approx (e_k - e_{k-1})/\Delta t$ (our −1.0 ft/s).
      :::
    bridges:
      - dynamics-and-noise
      - integrals-density
      - derivatives
  - id: feedback-and-robot-control.s3
    title: Short, bouncy, or wound up
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.feedback-and-robot-control
    markdown: |-
      The mug and arm pull down on the carriage with a steady 2 lbf. Try P alone with $K_p = 25$. When the lift comes to rest, the motor must push exactly 2 lbf to hold it, and P only pushes when there is error: $25 \times e = 2$, so $e = 0.08$ ft. The lift settles at 0.22 ft, forever 0.08 ft short. That leftover gap is called **steady-state error**.

      :::predict Raise the gain to K_p = 400. Where does the lift settle, and what happens on the way?
      At rest, $400 \times e = 2$ gives $e = 0.005$ ft, so it settles at 0.295 ft. But the big push builds up speed, and the carriage shoots past the target to 0.421 ft before coming back: **overshoot**. High gain trades error for bounce.
      :::

      The I term fixes the gap properly: while any error remains, the integral keeps growing until it alone supplies the 2 lbf. Now suppose the motor can push at most 4 lbf. On the long, slow climb it's pinned at 4 lbf, yet the integral keeps piling up error it can't act on. By the time the lift arrives, the integral is huge and shoves the carriage far past the target. That's **integral windup**. The standard fix, **anti-windup**, freezes the integral while the motor is at its limit.

      ```python run
      def simulate(kp, ki=0.0, u_max=100.0, anti_windup=False, target=0.30):
          """Tidy's lift: Toy lift: each 1 lbf net force gives 1 ft/s² acceleration; load 2 lbf, friction 10 lbf per ft/s."""
          x, v, integral, dt, peak = 0.0, 0.0, 0.0, 0.01, 0.0
          for _ in range(600):                          # 6 seconds, 100 updates per second
              err = target - x
              u_raw = kp * err + ki * integral
              u = max(-u_max, min(u_max, u_raw))        # the motor's force limit
              if not (anti_windup and u != u_raw):      # anti-windup: freeze the integral while saturated
                  integral += err * dt
              v += (u - 2.0 - 10.0 * v) * dt            # net force = mass x acceleration
              x += v * dt
              peak = max(peak, x)
          return x, peak

      runs = [("P, gain 25          ", dict(kp=25)),
              ("P, gain 400         ", dict(kp=400)),
              ("PI (25, 30)         ", dict(kp=25, ki=30)),
              ("PI, 4 lbf motor       ", dict(kp=25, ki=30, u_max=4)),
              ("PI, 4 lbf, anti-windup", dict(kp=25, ki=30, u_max=4, anti_windup=True))]
      for name, settings in runs:
          final, peak = simulate(**settings)
          print(f"{name}  final {final:.3f} ft   peak {peak:.3f} ft")
      ```

      The PI controller ends at exactly 0.300 ft. With the 4 lbf motor the peak jumps from 0.345 ft to 0.450 ft; anti-windup brings it back to 0.309 ft. Try `u_max=3`, or raise `ki` to 100 and watch the bounce grow.

      :::mixup "If it's slow, turn the gains up; more gain is always more accurate."
      More gain shrinks the P-only gap but brings overshoot, and on a real robot the sensor delay makes very high gains oscillate or go unstable. D helps brake, but it differentiates noise too: a 0.001 ft encoder jitter between readings 10 ms apart looks like 0.1 ft/s. Tune gains on the real plant, in small steps.
      :::
    bridges: []
  - id: feedback-and-robot-control.s4
    title: "Plan ahead, take one step, plan again"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.feedback-and-robot-control
    markdown: |-
      PID reacts to the error it has now. Tidy's base, driving up to the table, needs to think ahead: it must stop 0.05 ft from the edge, never exceed 0.5 ft/s, and never brake harder than its wheels can grip.

      **Model predictive control (MPC)** handles this with a loop:

      1. Use a model of the base to predict where each possible sequence of the next, say, 20 commands would take it, over the next 2 seconds (the **horizon**).
      2. Pick the sequence with the lowest cost (distance from the stopping point, plus jerky commands) that obeys every limit.
      3. Apply only the *first* command. Throw the rest away.
      4. Measure the new state 0.1 s later and solve again.

      Because it re-solves every step, MPC is still feedback: if someone steps in front of Tidy, the next plan accounts for them. The price is computation: an optimization must finish every 0.1 s, and plans are only as good as the model.

      :::papers The MPC problem, solved at every step
      $$\min_{u_0,\dots,u_{N-1}} \sum_{k=0}^{N-1} \big( \|x_k - x^*\|_Q^2 + \|u_k\|_R^2 \big) \quad \text{s.t.} \quad x_{k+1} = f(x_k, u_k),\;\; u_{\min} \le u_k \le u_{\max}$$

      $x_k$ is the predicted state (position, speed), $x^*$ the target, $u_k$ the commands, and $N = 20$ the horizon. $Q$ and $R$ weigh "get there" against "go gently". Only $u_0$ is sent to the motors. With linear dynamics, a quadratic cost, no limits, and an endless horizon, the answer reduces to a fixed feedback gain: the **linear–quadratic regulator (LQR)**.
      :::
    bridges: []
  - id: feedback-and-robot-control.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.feedback-and-robot-control
    markdown: Compute a few PID outputs by hand, then tune a car's cruise control, a climbing drone, a conveyor pusher, and a shuttle stopping at a crosswalk.
    takeaway: |-
      Feedback pushes on the measured error: P on how far off, I on how long, D on how fast it's changing. Too little I leaves a gap, too much gain bounces, and a saturated motor needs anti-windup; MPC plans ahead and replans each step.
  - id: feedback-and-robot-control.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.feedback-and-robot-control
    markdown: |-
      Feedback compares intended and measured behavior, then adjusts the command. The controller must account for dynamics, delay, noise, and actuator limits.
