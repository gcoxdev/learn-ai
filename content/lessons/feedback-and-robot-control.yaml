  version: 0.4.0-draft
  title: Correct motion using measured error
  state: draft
  summary: Tidy's lift stops 0.08 ft short of the shelf every time, and turning up the gain makes it bounce. Three small terms, P, I, and D, explain both.
  slot: M30.2
