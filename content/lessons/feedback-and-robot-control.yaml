assessment_families:
  - id: feedback-and-robot-control.base
    objective_ref: objective.feedback-and-robot-control
    task: base
    response_type: single_choice
    points: 1
    hint: 'Interpret the PID terms: trace the inputs, operation, and result before choosing.'
    remediation_scene: feedback-and-robot-control.s2
    variants:
      - id: feedback-and-robot-control.base.1
        prompt: Target 5, measured 3, proportional gain 0.5 gives proportional contribution what?
        options:
          - id: c
            text: '2.5'
          - id: a
            text: '1'
          - id: b
            text: '4'
        answer: a
        feedback: Error two is multiplied by one-half.
        retired: true
      - id: feedback-and-robot-control.base.2
        prompt: Which PID term accumulates past error?
        options:
          - id: a
            text: Integral
          - id: b
            text: Proportional
          - id: c
            text: Derivative
        answer: a
        feedback: The integral term sums error over time.
        retired: true
  - id: feedback-and-robot-control.transfer
    objective_ref: objective.feedback-and-robot-control
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Optimize future motion: trace the inputs, operation, and result before choosing.'
    remediation_scene: feedback-and-robot-control.s4
    variants:
      - id: feedback-and-robot-control.transfer.1
        prompt: Can increasing controller gain harm stability?
        options:
          - id: a
            text: 'Yes'
          - id: b
            text: 'No'
          - id: c
            text: Only if there are no sensors
        answer: a
        feedback: Aggressive feedback interacts with delay and dynamics.
        retired: true
      - id: feedback-and-robot-control.transfer.2
        prompt: What does model predictive control repeatedly do?
        options:
          - id: b
            text: Ignore new observations forever
          - id: c
            text: Guarantee exact dynamics
          - id: a
            text: Plan over a horizon, act partially, then replan
        answer: a
        feedback: Receding-horizon feedback incorporates updated state.
        retired: true
  - id: feedback-and-robot-control.base.v2
    objective_ref: objective.feedback-and-robot-control
    task: base
    response_type: single_choice
    points: 1
    hint: "Ask what each term needs in order to push: P needs error now, I needs error that has lasted, D needs error that is changing."
    remediation_scene: feedback-and-robot-control.s3
    variants:
      - id: feedback-and-robot-control.base.v2.1
        prompt: A P-only controller with K_p = 50 holds a lift against a steady 3 lbf load. It always settles 0.06 ft below the target. Why?
        options:
          - id: b
            text: The gain is so high that the lift overshoots and then sags back
          - id: a
            text: At rest the motor must give 3 lbf, and P gives that only at 0.06 ft error
          - id: c
            text: The encoder is miscalibrated and reads 0.06 ft higher than the truth
        answer: a
        feedback: "Holding still takes 3 lbf, and a P controller pushes only in proportion to error: 50 × e = 3 gives e = 0.06 ft. It's the steady-state error of P control, not overshoot or a sensor fault; a higher gain would shrink it but not remove it."
      - id: feedback-and-robot-control.base.v2.2
        prompt: Tidy's lift settles 0.08 ft short under P control. Which change removes the gap entirely rather than just shrinking it?
        options:
          - id: c
            text: Raise K_p tenfold so that the proportional push gets stronger
          - id: b
            text: Add a D term so the controller reacts to the error's speed
          - id: a
            text: Add an I term that grows as long as any error remains
        answer: a
        feedback: The integral keeps growing while any error remains, until it alone supplies the holding force and the error reaches zero. A tenfold P gain only cuts the gap tenfold and invites overshoot; D is zero once the lift is still.
      - id: feedback-and-robot-control.base.v2.3
        prompt: A PI-controlled arm joint is held still by a person's hand for 3 seconds while its motor sits at maximum. When released, it swings well past its target. What happened?
        options:
          - id: a
            text: The integral kept growing while the motor was maxed out and must unwind
          - id: b
            text: The sudden release produced a large derivative spike in the controller
          - id: c
            text: The proportional term jumped because the error was measured wrongly
        answer: a
        feedback: This is integral windup. The error sat there for 3 seconds, piling up in the integral, even though the motor couldn't push any harder; on release all that stored push drives the overshoot. A PI controller has no D term, and the P term only reflects the current error.
      - id: feedback-and-robot-control.base.v2.4
        prompt: Adding a D term makes a robot joint buzz and jitter, although P and I alone were smooth. The encoder reading wobbles by about 0.001 ft between samples. What is the likely cause?
        options:
          - id: b
            text: The D term adds up past errors, so the wobble builds up over time
          - id: a
            text: The D term divides each wobble by the short time between samples
          - id: c
            text: The D term raises the steady-state error of the whole controller
        answer: a
        feedback: D uses (change in error) / Δt. A 0.001 ft wobble over 10 ms looks like 0.1 ft/s, so noise becomes large, rapid commands. Adding up past errors is the I term's job, and D doesn't create steady-state error.
  - id: feedback-and-robot-control.transfer.v2
    objective_ref: objective.feedback-and-robot-control
    task: transfer
    response_type: single_choice
    points: 1
    hint: "Name the symptom first (a leftover gap, a bounce, a lunge after saturation, or a command that ignores results), then pick the fix aimed at that symptom."
    remediation_scene: feedback-and-robot-control.s3
    variants:
      - id: feedback-and-robot-control.transfer.v2.1
        prompt: A car's cruise control uses only a proportional term. On a long uphill it settles 3 mph below the set speed. What is the best fix?
        options:
          - id: a
            text: Add an integral term so it keeps pushing until the gap closes
          - id: c
            text: Raise the proportional gain until the gap is too small to notice
          - id: b
            text: Add a derivative term to respond faster to the change in slope
        answer: a
        feedback: The hill is a steady disturbance, like the mug's weight, and P can only hold against it with some error. An integral term removes the gap. A much higher P gain shrinks it but makes the car surge and overshoot; D does nothing once speed is steady.
      - id: feedback-and-robot-control.transfer.v2.2
        prompt: A camera drone climbs to 50 ft with its motors at full power for 5 seconds, then overshoots to 53 ft. Below that limit its altitude control is smooth. What should you change?
        options:
          - id: c
            text: Raise the integral gain so the controller corrects the overshoot faster
          - id: a
            text: Freeze the integral term whenever the motors are at their limit
          - id: b
            text: Filter the altimeter so the derivative term reacts more gently
        answer: a
        feedback: Overshoot only after a long saturated climb is the signature of integral windup; anti-windup stops the integral from storing push the motors couldn't deliver. A bigger integral gain winds up faster, and derivative filtering targets noise, not saturation.
      - id: feedback-and-robot-control.transfer.v2.3
        prompt: A warehouse pusher runs its motor for a fixed 0.8 s to shove boxes onto a belt. That worked in testing, but heavy boxes now stop short of the belt. Which change fixes the cause?
        options:
          - id: b
            text: Lengthen the fixed run to 1.0 s to suit the heaviest boxes
          - id: c
            text: Re-measure the ideal run time for every box weight each week
          - id: a
            text: Measure the pusher's position and drive it until it reaches the belt
        answer: a
        feedback: A fixed timing is open loop, so any change in load changes the result. Measuring position and correcting against the target (closed loop) handles every weight. A longer fixed time over-shoves light boxes, and weekly tables are still open loop.
      - id: feedback-and-robot-control.transfer.v2.4
        prompt: A campus shuttle must stop smoothly at a crosswalk, respecting limits on speed and braking, while a pedestrian may step out. Why is model predictive control a good fit?
        options:
          - id: a
            text: It plans ahead within the limits, applies the first step, then replans
          - id: b
            text: It computes one full stopping plan at the start and follows it exactly
          - id: c
            text: It drives from the error alone, so it needs no model of the shuttle
        answer: a
        feedback: MPC predicts over a horizon with the speed and braking limits built into the optimization, uses only the first command, and re-solves with fresh measurements, so a pedestrian changes the next plan. It does need a model; that's what the predictions use.
  - id: feedback-and-robot-control.calculate
    objective_ref: objective.feedback-and-robot-control
    task: base
    response_type: numeric
    points: 1
    hint: "Compute each term separately: K_p × error, K_i × (summed error × time), and K_d × (change in error ÷ time step). Then add them, keeping the signs."
    remediation_scene: feedback-and-robot-control.s2
    absolute_tolerance: 0.01
    variants:
      - id: feedback-and-robot-control.calculate.1
        prompt: A P controller has K_p = 20. The target is 0.50 ft and the measured position is 0.45 ft. What command does it output, in pounds of force?
        answer: 1
        feedback: "The error is 0.50 − 0.45 = 0.05 ft, and 20 × 0.05 = 1.0 lbf."
      - id: feedback-and-robot-control.calculate.2
        prompt: A PI controller has K_p = 10 and K_i = 5. The current error is 0.2 ft and the accumulated error is 0.4 ft·s. What command does it output, in pounds of force?
        answer: 4
        feedback: "P gives 10 × 0.2 = 2 lbf and I gives 5 × 0.4 = 2 lbf, for 4 lbf in total."
      - id: feedback-and-robot-control.calculate.3
        prompt: "A PID controller has K_p = 40, K_i = 10, K_d = 1, and a time step of 0.02 s. The error is 0.10 ft, the previous error was 0.12 ft, and the accumulated error is 0.2 ft·s. What command does it output, in pounds of force?"
        answer: 5
        feedback: "P = 40 × 0.10 = 4. I = 10 × 0.2 = 2. The error changes at (0.10 − 0.12)/0.02 = −1 ft/s, so D = 1 × (−1) = −1. Total: 4 + 2 − 1 = 5 lbf."
      - id: feedback-and-robot-control.calculate.4
        prompt: A PI controller has K_p = 30 and K_i = 20. The joint has overshot, so the error is −0.1 ft, while the accumulated error is still 0.25 ft·s. What command does it output, in pounds of force?
        answer: 2
        feedback: "P = 30 × (−0.1) = −3 lbf, pulling back. I = 20 × 0.25 = 5 lbf, still pushing forward from earlier. The total is +2 lbf, which is why stored integral keeps the overshoot going."
      - id: feedback-and-robot-control.calculate.5
        prompt: A P-only controller with K_p = 50 holds a lift against a steady 3 lbf load. At rest, how large is the steady-state error, in feet?
        answer: 0.06
        feedback: "At rest the motor must supply the 3 lbf load, so 50 × e = 3 and e = 0.06 ft."
