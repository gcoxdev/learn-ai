schema_version: 0.2-draft
lesson:
  id: feedback-and-robot-control
  version: 0.1.0-draft
  title: Correct motion using measured error
  state: draft
  summary: Feedback control adjusts actions from state error; PID, optimal control, and model predictive control
    make different assumptions about dynamics, costs, constraints, and prediction.
  slot: M30.2
  category: learning
  minutes: 12
  sources:
  - title: Modern Robotics — authors’ textbook and resources
    url: https://modernrobotics.northwestern.edu/nu-gm-book-resource/
objectives:
- id: objective.feedback-and-robot-control
  version: 1-draft
  statement: Feedback control adjusts actions from state error; PID, optimal control, and model predictive control
    make different assumptions about dynamics, costs, constraints, and prediction.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - feedback-and-robot-control.base
  - feedback-and-robot-control.transfer
  prerequisites:
  - anyOf:
    - objective.robot-sensors-and-frames
  - anyOf:
    - objective.dynamics-and-noise
scenes:
- id: feedback-and-robot-control.s1
  title: Close the feedback loop
  type: explanation
  depth: intuition
  objective_refs:
  - objective.feedback-and-robot-control
  markdown: An open-loop command runs without checking the resulting state. Feedback compares a desired state with
    measured or estimated state and adjusts control. Disturbances, delay, noise, and actuator saturation influence
    whether the loop tracks its target stably.
  text_mode: An open-loop command runs without checking the resulting state. Feedback compares a desired state with
    measured or estimated state and adjusts control. Disturbances, delay, noise, and actuator saturation influence
    whether the loop tracks its target stably.
  bridges: []
- id: feedback-and-robot-control.s2
  title: Interpret the PID terms
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.feedback-and-robot-control
  markdown: Proportional control responds to current error, integral control accumulates past error, and derivative
    control responds to error change. With target position five and measured position three, error is two; a proportional
    gain of one-half contributes a control value of one under this toy convention.
  text_mode: Proportional control responds to current error, integral control accumulates past error, and derivative
    control responds to error change. With target position five and measured position three, error is two; a proportional
    gain of one-half contributes a control value of one under this toy convention.
  bridges:
  - dynamics-and-noise
  - integrals-density
- id: feedback-and-robot-control.s3
  title: Understand stability and limits
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.feedback-and-robot-control
  markdown: High gains can react quickly but overshoot or amplify noise. Integral accumulation during actuator saturation
    can cause windup. Derivative estimates from noisy measurements need care. Controller tuning depends on the plant
    and timing; a toy gain is not a transferable hardware instruction.
  text_mode: High gains can react quickly but overshoot or amplify noise. Integral accumulation during actuator
    saturation can cause windup. Derivative estimates from noisy measurements need care. Controller tuning depends
    on the plant and timing; a toy gain is not a transferable hardware instruction.
  bridges: []
- id: feedback-and-robot-control.s4
  title: Optimize future motion
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.feedback-and-robot-control
  markdown: Optimal control selects actions using a dynamics model and cost. Model predictive control solves a finite-horizon
    constrained problem, executes part, and replans. It can express motion and actuator constraints, but performance
    depends on model accuracy, optimization time, and state estimates.
  text_mode: Optimal control selects actions using a dynamics model and cost. Model predictive control solves a
    finite-horizon constrained problem, executes part, and replans. It can express motion and actuator constraints,
    but performance depends on model accuracy, optimization time, and state estimates.
  bridges: []
- id: feedback-and-robot-control.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.feedback-and-robot-control
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: feedback-and-robot-control.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.feedback-and-robot-control
  markdown: Feedback control adjusts actions from state error; PID, optimal control, and model predictive control
    make different assumptions about dynamics, costs, constraints, and prediction.
  text_mode: Feedback control adjusts actions from state error; PID, optimal control, and model predictive control
    make different assumptions about dynamics, costs, constraints, and prediction.
