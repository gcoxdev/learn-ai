objectives:
  - id: objective.feedback-and-robot-control
    version: 2-draft
    statement: Contrast open- and closed-loop control, compute a PID output by hand, explain steady-state error, overshoot, and integral windup, and describe how model predictive control plans over a horizon and replans.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - feedback-and-robot-control.base.v2
      - feedback-and-robot-control.transfer.v2
