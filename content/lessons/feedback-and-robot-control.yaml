assessment_families:
- id: feedback-and-robot-control.base
  objective_ref: objective.feedback-and-robot-control
  task: base
  response_type: single_choice
  points: 1
  hint: 'Interpret the PID terms: trace the inputs, operation, and result before choosing.'
  remediation_scene: feedback-and-robot-control.s2
  variants:
  - id: feedback-and-robot-control.base.1
    prompt: Target 5, measured 3, proportional gain 0.5 gives proportional contribution what?
    options:
    - id: c
      text: '2.5'
    - id: a
      text: '1'
    - id: b
      text: '4'
    answer: a
    feedback: Error two is multiplied by one-half.
  - id: feedback-and-robot-control.base.2
    prompt: Which PID term accumulates past error?
    options:
    - id: a
      text: Integral
    - id: b
      text: Proportional
    - id: c
      text: Derivative
    answer: a
    feedback: The integral term sums error over time.
- id: feedback-and-robot-control.transfer
  objective_ref: objective.feedback-and-robot-control
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Optimize future motion: trace the inputs, operation, and result before choosing.'
  remediation_scene: feedback-and-robot-control.s4
  variants:
  - id: feedback-and-robot-control.transfer.1
    prompt: Can increasing controller gain harm stability?
    options:
    - id: a
      text: 'Yes'
    - id: b
      text: 'No'
    - id: c
      text: Only if there are no sensors
    answer: a
    feedback: Aggressive feedback interacts with delay and dynamics.
  - id: feedback-and-robot-control.transfer.2
    prompt: What does model predictive control repeatedly do?
    options:
    - id: b
      text: Ignore new observations forever
    - id: c
      text: Guarantee exact dynamics
    - id: a
      text: Plan over a horizon, act partially, then replan
    answer: a
    feedback: Receding-horizon feedback incorporates updated state.
