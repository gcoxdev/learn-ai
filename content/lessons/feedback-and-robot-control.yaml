schema_version: 0.2-draft
lesson:
  id: feedback-and-robot-control
  version: 0.3.0-draft
  title: Correct motion using measured error
  state: draft
  summary: Correct a robot’s motion by comparing what happened with what was intended.
  slot: M30.2
  category: learning
  sources:
  - title: Modern Robotics — authors’ textbook and resources
    url: https://modernrobotics.northwestern.edu/nu-gm-book-resource/
objectives:
- id: objective.feedback-and-robot-control
  version: 1-draft
  statement: Feedback control adjusts actions from state error; PID, optimal control, and model predictive
    control make different assumptions about dynamics, costs, constraints, and prediction.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - feedback-and-robot-control.base
  - feedback-and-robot-control.transfer
  prerequisites:
  - anyOf:
    - objective.robot-sensors-and-frames
  - anyOf:
    - objective.dynamics-and-noise
scenes:
- id: feedback-and-robot-control.s1
  title: Close the feedback loop
  type: explanation
  depth: intuition
  objective_refs:
  - objective.feedback-and-robot-control
  markdown: An open-loop command runs without checking the resulting state. Feedback compares a desired state
    with measured or estimated state and adjusts control. Disturbances, delay, noise, and actuator saturation
    influence whether the loop tracks its target stably.
  text_mode: An open-loop command runs without checking the resulting state. Feedback compares a desired state
    with measured or estimated state and adjusts control. Disturbances, delay, noise, and actuator saturation
    influence whether the loop tracks its target stably.
  bridges: []
- id: feedback-and-robot-control.s2
  title: Interpret the PID terms
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.feedback-and-robot-control
  markdown: '**PID** stands for **proportional–integral–derivative** control. Its three terms respond to current
    error, accumulated error, and the rate at which error changes.


    If the target position is 5 and the measured position is 3, the error is 2. With proportional gain 0.5,
    the proportional contribution is 1 under this toy convention.


    Now consider errors [2, 1, 1] measured one second apart. A simple accumulated-error estimate is (2 + 1
    + 1) × 1 second = 4 error-seconds. The latest rate estimate is (1 − 1)/1 second = 0. Separate gains multiply
    the three quantities. Integrals and derivatives describe accumulation and change in continuous time; the
    side lessons explain those ideas.'
  text_mode: '**PID** stands for **proportional–integral–derivative** control. Its three terms respond to current
    error, accumulated error, and the rate at which error changes.


    If the target position is 5 and the measured position is 3, the error is 2. With proportional gain 0.5,
    the proportional contribution is 1 under this toy convention.


    Now consider errors [2, 1, 1] measured one second apart. A simple accumulated-error estimate is (2 + 1
    + 1) × 1 second = 4 error-seconds. The latest rate estimate is (1 − 1)/1 second = 0. Separate gains multiply
    the three quantities. Integrals and derivatives describe accumulation and change in continuous time; the
    side lessons explain those ideas.'
  bridges:
  - dynamics-and-noise
  - integrals-density
  - derivatives
- id: feedback-and-robot-control.s3
  title: Understand stability and limits
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.feedback-and-robot-control
  markdown: 'The **plant** is the physical system being controlled. Useful gains depend on its dynamics and
    the loop''s timing.


    High gains can react quickly but cause overshoot or amplify noise. If an actuator reaches its output limit
    while the integral term continues accumulating, **integral windup** can cause a large overshoot later.
    Derivative estimates are also sensitive to noisy measurements.


    These examples explain the roles of the terms. They do not provide gain settings that can be transferred
    directly to hardware.'
  text_mode: 'The **plant** is the physical system being controlled. Useful gains depend on its dynamics and
    the loop''s timing.


    High gains can react quickly but cause overshoot or amplify noise. If an actuator reaches its output limit
    while the integral term continues accumulating, **integral windup** can cause a large overshoot later.
    Derivative estimates are also sensitive to noisy measurements.


    These examples explain the roles of the terms. They do not provide gain settings that can be transferred
    directly to hardware.'
  bridges: []
- id: feedback-and-robot-control.s4
  title: Optimize future motion
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.feedback-and-robot-control
  markdown: Optimal control selects actions using a dynamics model and cost. Model predictive control solves
    a finite-horizon constrained problem, executes part, and replans. It can express motion and actuator constraints,
    but performance depends on model accuracy, optimization time, and state estimates.
  text_mode: Optimal control selects actions using a dynamics model and cost. Model predictive control solves
    a finite-horizon constrained problem, executes part, and replans. It can express motion and actuator constraints,
    but performance depends on model accuracy, optimization time, and state estimates.
  bridges: []
- id: feedback-and-robot-control.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.feedback-and-robot-control
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Feedback compares intended and measured behavior, then adjusts the command. The controller must
    account for dynamics, delay, noise, and actuator limits.
