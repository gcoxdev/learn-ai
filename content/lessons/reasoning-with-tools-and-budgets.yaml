schema_version: 0.2-draft
lesson:
  id: reasoning-with-tools-and-budgets
  version: 0.4.0-draft
  title: Use tools to check work within an explicit stopping policy
  state: draft
  summary: Why grind through 84 months of compound interest token by token when one line of Python gets it exactly? Learn when a reasoning model should call a tool, and when it should stop.
  slot: M21.7
  category: learning
  sources:
    - title: "PAL: Program-aided Language Models (Gao et al., 2022)"
      url: https://arxiv.org/abs/2211.10435
    - title: "ReAct: Synergizing Reasoning and Acting in Language Models (Yao et al., 2022)"
      url: https://arxiv.org/abs/2210.03629
    - title: "Toolformer: Language Models Can Teach Themselves to Use Tools (Schick et al., 2023)"
      url: https://arxiv.org/abs/2302.04761
    - title: "s1: Simple test-time scaling (Muennighoff et al., 2025)"
      url: https://arxiv.org/abs/2501.19393
objectives:
  - id: objective.reasoning-with-tools-and-budgets
    version: 2-draft
    statement: Tool-assisted reasoning alternates model decisions with external results; task-specific checks, permissions, budget tracking, and stopping rules determine useful and reliable behavior.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - reasoning-with-tools-and-budgets.base.v2
      - reasoning-with-tools-and-budgets.transfer.v2
      - reasoning-with-tools-and-budgets.calculate
    prerequisites:
      - anyOf:
          - objective.inference-time-search
      - anyOf:
          - objective.algorithms-and-programs
scenes:
  - id: reasoning-with-tools-and-budgets.s1
    title: Let the interpreter do the arithmetic
    type: explanation
    depth: intuition
    objective_refs:
      - objective.reasoning-with-tools-and-budgets
    markdown: |-
      *What will \$5,000 grow to at 4.5% a year, compounded monthly, for 7 years?*

      A reasoning model can set this up perfectly, $5000 \times (1 + 0.045/12)^{84}$, and still stumble on the arithmetic. As the first lesson of this module showed, it computes one token at a time, and raising 1.00375 to the 84th power digit by digit is exactly the kind of long calculation where one slip ruins everything. A Python interpreter gets it exactly: **\$6,847.26**.

      So let the model write the calculation and hand it to a tool. **PAL** (program-aided language models, Gao et al., 2022) did exactly this: the model writes a short program for the problem, and an interpreter runs it. **Toolformer** (Schick et al., 2023) trained a model to decide for itself when to insert calls to a calculator, a search engine, and other tools.

      The general pattern is the **ReAct** loop (Yao et al., 2022): the model writes a thought, takes an action such as a tool call, and the result comes back as an **observation**, added to its context. Then it thinks again with that result in view, and repeats until it can answer. Some recent reasoning models, such as OpenAI's o3, do the same thing inside their long chains of thought.
    diagram:
      caption: A reasoning loop with a tool. Every observation goes back into the context, and a budget check decides whether to go around again.
      description: The question goes to the model, which thinks and either answers or writes a tool call. The tool, such as a Python interpreter, runs the call and returns an observation to the model's context. Before each new round, a budget check compares tokens, tool calls, and time used against the limits; if the budget is spent or the answer is verified, the loop stops and returns the answer.
      nodes:
        - id: question
          label: Question
          col: 0
          row: 0
          tone: data
        - id: think
          label: Model thinks
          note: reads everything in context
          col: 1
          row: 0
          tone: accent
        - id: call
          label: Tool call
          note: e.g. 5000*(1+0.045/12)**84
          col: 2
          row: 0
        - id: tool
          label: Python interpreter
          col: 3
          row: 0
        - id: obs
          label: "Observation: 6847.26"
          col: 3
          row: 1
          tone: data
        - id: budget
          label: Budget check
          note: tokens, calls, seconds left?
          col: 1
          row: 1
          tone: warn
        - id: answer
          label: Answer
          col: 1
          row: 2
      edges:
        - from: question
          to: think
        - from: think
          to: call
        - from: call
          to: tool
        - from: tool
          to: obs
        - from: obs
          to: budget
          label: add to context
        - from: budget
          to: think
          label: continue
        - from: budget
          to: answer
          label: verified or out of budget
    bridges: []
  - id: reasoning-with-tools-and-budgets.s2
    title: A correct tool can still give a wrong answer
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.reasoning-with-tools-and-budgets
    markdown: |-
      The interpreter never gets arithmetic wrong, but the model chooses what to send it. Every tool has a **contract**: the inputs it expects and what its output means. Mistakes happen at that boundary:

      | Model's call | Result | What went wrong |
      | --- | ---: | --- |
      | `5000 * (1 + 0.045/12) ** 84` | 6,847.26 | Nothing |
      | `5000 * 1.045 ** 7` | 6,804.31 | Compounded yearly, not monthly |
      | `5000 * (1 + 4.5/12) ** 84` | astronomically large | Percent passed as 4.5 instead of 0.045 |
      | `convert(5, "inches")` | error: unknown unit | Argument outside the contract |

      The second row is the dangerous one. It runs cleanly, returns a believable number, and is wrong by \$42.95. So a good loop reads each observation against the question: *Is this the quantity asked for, in the right units, at a plausible size?* The third row fails that check at a glance.

      Treat tool output as *data*, never as instructions. If a web page the model fetched says "ignore your previous instructions," that's text to evaluate, not a command. The lesson on agent permissions covers this in depth.
    bridges: []
  - id: reasoning-with-tools-and-budgets.s3
    title: Price the attempt, not the answer
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.reasoning-with-tools-and-budgets
    markdown: |-
      Tools cost time and tokens too. Compare two ways to answer a batch of finance questions. Plan A thinks through the arithmetic in 1,800 reasoning tokens and is right 70% of the time. Plan B writes 660 tokens, including two short programs, and makes two interpreter calls of 1.2 seconds each; it's right 95% of the time. The model generates 50 tokens per second, and output costs a made-up \$10 per million tokens.

      ```python run
      speed = 50            # tokens generated per second
      price = 10 / 1e6      # dollars per generated token ($10 per million)

      plans = {
          # name: (generated tokens, tool calls, seconds per call, accuracy)
          "think only":  (1800, 0, 0.0, 0.70),
          "code tool":   (660, 2, 1.2, 0.95),
      }
      for name, (tokens, calls, secs, acc) in plans.items():
          seconds = tokens / speed + calls * secs
          cost = tokens * price
          print(f"{name:11}: {seconds:4.1f} s, ${cost:.4f} per attempt, "
                f"accuracy {acc:.0%}, ${cost / acc:.4f} per solved problem")
      ```

      The tool plan is faster (15.6 s against 36 s) *and* much cheaper per solved problem. The number that matters is **cost per solved problem**, the cost of an attempt divided by its accuracy, because a cheap wrong answer still has to be done again. Try a slow tool: set the seconds per call to `12.0`. Plan B takes 37.2 s, now slower than thinking, though still far cheaper.
    bridges: []
  - id: reasoning-with-tools-and-budgets.s4
    title: Retry only when something changed
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.reasoning-with-tools-and-budgets
    markdown: |-
      A **budget** caps what one attempt may spend: tokens, tool calls, seconds, or money. A **stopping rule** says what happens at each decision point: answer, retry, or give up and report what you have.

      Retries are where budgets leak. Suppose each attempt costs 1,000 tokens and succeeds half the time, and you stop at the first success. Then compare retries that are genuinely fresh with retries that tend to repeat the first mistake:

      ```python run
      cost = 1000   # tokens per attempt

      def run(p_first, p_retry, max_tries):
          """Stop on the first success. Returns P(success) and expected tokens."""
          p_fail_so_far, success, tokens = 1.0, 0.0, 0.0
          for i in range(max_tries):
              tokens += p_fail_so_far * cost          # we pay for this try if still failing
              p = p_first if i == 0 else p_retry
              success += p_fail_so_far * p
              p_fail_so_far *= 1 - p
          return success, tokens

      for label, p_retry in [("fresh retries", 0.5), ("same mistake again", 0.1)]:
          for k in [1, 3, 6]:
              s, t = run(0.5, p_retry, k)
              print(f"{label:18} max {k} tries: success {s:.3f}, tokens {t:6.0f}, per solved {t / s:6.0f}")
      ```

      :::predict With fresh retries, how does the cost per solved problem change as you allow more tries?
      It doesn't. It stays at 2,000 tokens (1,000 ÷ 0.5), while success climbs to 0.984. Independent retries are fair value. But when a retry repeats the same mistake, six tries cost 4,324 tokens per solved problem and still fail almost 30% of the time. Resending an identical failed call is the extreme case: its chance of working is about zero.
      :::

      So a good stopping rule looks like this: stop when an answer passes its check. Retry only after changing something, such as a fixed argument, a new query, or a different method. Stop and report your best answer, with its uncertainty, when the budget runs out or two rounds in a row add no new information.

      :::deeper Budgets inside the chain of thought
      Reasoning length itself can be budgeted. The s1 paper (Muennighoff et al., 2025) introduced **budget forcing**: when the thinking budget runs out, force the end-of-thinking marker so the model must answer. To make it think longer, suppress that marker and append "Wait", which often prompts the model to re-check its work. Several commercial APIs expose similar controls, as a maximum number of thinking tokens or a low/medium/high effort setting.
      :::
    bridges: []
  - id: reasoning-with-tools-and-budgets.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.reasoning-with-tools-and-budgets
    markdown: A flight-search agent stuck in a loop, a spreadsheet sum, a suspicious web page, and some cost-per-solved-problem sums test whether you can budget a tool-using model.
    takeaway: |-
      Hand exact work to tools, then read each result against the question. Judge a plan by its cost per solved problem, and retry only when something has changed.
  - id: reasoning-with-tools-and-budgets.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.reasoning-with-tools-and-budgets
    markdown: |-
      Use a tool for a specific operation, check what its result means, and stop when the task is complete or further work is unlikely to help.
