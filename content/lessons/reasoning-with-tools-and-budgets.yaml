schema_version: 0.2-draft
lesson:
  id: reasoning-with-tools-and-budgets
  version: 0.2.0-draft
  title: Use tools to check work within an explicit stopping policy
  state: draft
  summary: Use external tools for a specific check, validate the result, and stop when the task or useful budget
    is exhausted.
  slot: M21.7
  category: learning
  sources:
  - title: ReAct
    url: https://arxiv.org/abs/2210.03629
  - title: Toolformer
    url: https://arxiv.org/abs/2302.04761
objectives:
- id: objective.reasoning-with-tools-and-budgets
  version: 1-draft
  statement: Tool-assisted reasoning alternates model decisions with external results; task-specific checks,
    permissions, budget tracking, and stopping rules determine useful and reliable behavior.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - reasoning-with-tools-and-budgets.base
  - reasoning-with-tools-and-budgets.transfer
  prerequisites:
  - anyOf:
    - objective.inference-time-search
  - anyOf:
    - objective.algorithms-and-programs
scenes:
- id: reasoning-with-tools-and-budgets.s1
  title: Delegate a concrete operation
  type: explanation
  depth: intuition
  objective_refs:
  - objective.reasoning-with-tools-and-budgets
  markdown: A model can ask a calculator for arithmetic, a search system for evidence, or an execution environment
    for test results. The returned observation becomes input to later decisions. Tool use can reduce some model
    limitations, but choosing the wrong operation or misreading its output still causes errors.
  text_mode: A model can ask a calculator for arithmetic, a search system for evidence, or an execution environment
    for test results. The returned observation becomes input to later decisions. Tool use can reduce some model
    limitations, but choosing the wrong operation or misreading its output still causes errors.
  bridges: []
- id: reasoning-with-tools-and-budgets.s2
  title: Validate the boundary
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reasoning-with-tools-and-budgets
  markdown: 'A tool call needs a named operation and arguments matching its contract. For example, a unit converter
    needs both value and units; the number alone is ambiguous. Validate inputs and outputs, handle errors,
    and distinguish untrusted retrieved text from instructions authorized to control the system.


    A **contract** states what inputs an operation accepts and what its output means. To convert 3 kilometers
    to meters, pass value 3, source unit kilometers and target unit meters; the expected result is 3,000 meters.
    Passing just “3” leaves the task unspecified. A tool can run successfully on the wrong units and still
    return the wrong answer for the user''s question.'
  text_mode: 'A tool call needs a named operation and arguments matching its contract. For example, a unit
    converter needs both value and units; the number alone is ambiguous. Validate inputs and outputs, handle
    errors, and distinguish untrusted retrieved text from instructions authorized to control the system.


    A **contract** states what inputs an operation accepts and what its output means. To convert 3 kilometers
    to meters, pass value 3, source unit kilometers and target unit meters; the expected result is 3,000 meters.
    Passing just “3” leaves the task unspecified. A tool can run successfully on the wrong units and still
    return the wrong answer for the user''s question.'
  bridges: []
- id: reasoning-with-tools-and-budgets.s3
  title: Budget the entire attempt
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reasoning-with-tools-and-budgets
  markdown: 'Set limits on model tokens, tool calls, runtime, and external cost appropriate to the task. A
    loop that repeatedly retries the same failing check may consume resources without improving evidence. Track
    what has changed before retrying, and stop or escalate when further work is unlikely to resolve the issue.


    A **stopping policy** states when to finish, retry or ask for help. If the converter reports an unknown
    unit, correct that argument before retrying. Sending the identical invalid call again adds no evidence.
    If two sources disagree, a useful next call should investigate date or scope rather than merely repeat
    whichever answer sounds better.'
  text_mode: 'Set limits on model tokens, tool calls, runtime, and external cost appropriate to the task. A
    loop that repeatedly retries the same failing check may consume resources without improving evidence. Track
    what has changed before retrying, and stop or escalate when further work is unlikely to resolve the issue.


    A **stopping policy** states when to finish, retry or ask for help. If the converter reports an unknown
    unit, correct that argument before retrying. Sending the identical invalid call again adds no evidence.
    If two sources disagree, a useful next call should investigate date or scope rather than merely repeat
    whichever answer sounds better.'
  bridges: []
- id: reasoning-with-tools-and-budgets.s4
  title: Finish with supported conclusions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reasoning-with-tools-and-budgets
  markdown: A tool result can be stale, incomplete, or wrong for the question. Preserve relevant evidence and
    uncertainty, check whether the original task is actually satisfied, and present the result at the user’s
    needed level. Successful tool execution is not automatically successful problem completion.
  text_mode: A tool result can be stale, incomplete, or wrong for the question. Preserve relevant evidence
    and uncertainty, check whether the original task is actually satisfied, and present the result at the user’s
    needed level. Successful tool execution is not automatically successful problem completion.
  bridges: []
- id: reasoning-with-tools-and-budgets.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.reasoning-with-tools-and-budgets
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Tool-assisted reasoning alternates model decisions with external results; task-specific checks,
    permissions, budget tracking, and stopping rules determine useful and reliable behavior.
