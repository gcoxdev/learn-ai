  bridges:
  - arithmetic
- id: algorithm-cost.s3
  title: Memory traffic can dominate arithmetic
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.algorithm-cost
  markdown: Suppose a computation needs 1 gigabyte of data and sustains 10 gigabytes per second of memory transfer.
    Moving that data alone takes about 0.1 seconds under those simplified assumptions. Extra cache reuse can
    reduce traffic. A device with more arithmetic units may not help if those units wait for data.
  text_mode: Suppose a computation needs 1 gigabyte of data and sustains 10 gigabytes per second of memory
    transfer. Moving that data alone takes about 0.1 seconds under those simplified assumptions. Extra cache
    reuse can reduce traffic. A device with more arithmetic units may not help if those units wait for data.
  bridges: []
- id: algorithm-cost.s4
  title: Parallelism has dependencies
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.algorithm-cost
  markdown: Independent examples can often be processed together, but a later layer needs earlier outputs.
    If half a program is strictly serial, infinitely speeding the other half gives at most a twofold speedup
    in that simplified model. Include scheduling, communication, working memory, and synchronization when comparing
    actual systems.
