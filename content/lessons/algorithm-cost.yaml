assessment_families:
- id: algorithm-cost.base
  objective_ref: objective.algorithm-cost
  task: base
  response_type: single_choice
  points: 1
  hint: 'Compare growth rates: trace the inputs, operation, and result before choosing.'
  remediation_scene: algorithm-cost.s2
  variants:
  - id: algorithm-cost.base.1
    prompt: If pairwise work scales as n², what happens when n triples?
    options:
    - id: c
      text: It becomes constant
    - id: a
      text: It grows by a factor of 9
    - id: b
      text: It grows by 3
    answer: a
    feedback: Squaring 3n introduces a factor of 9.
  - id: algorithm-cost.base.2
    prompt: A scan keeps only the best value so far. How much extra state is needed as n grows?
    options:
    - id: a
      text: Constant extra state for the running best
    - id: b
      text: A second full copy of every item
    - id: c
      text: A matrix of all pairs
    answer: a
    feedback: The running-best algorithm need not retain previous items beyond its summary.
- id: algorithm-cost.transfer
  objective_ref: objective.algorithm-cost
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Parallelism has dependencies: trace the inputs, operation, and result before choosing.'
  remediation_scene: algorithm-cost.s4
  variants:
  - id: algorithm-cost.transfer.1
    prompt: Arithmetic units spend most time waiting for memory. What should an optimization investigate?
    options:
    - id: a
      text: Data movement and reuse
    - id: b
      text: Only adding more multipliers
    - id: c
      text: Only renaming variables
    answer: a
    feedback: The measured bottleneck determines which improvement can help.
  - id: algorithm-cost.transfer.2
    prompt: Twenty percent of a program remains serial. What is the ideal maximum speedup if the rest becomes
      instantaneous?
    options:
    - id: b
      text: 20 times
    - id: c
      text: Unlimited
    - id: a
      text: 5 times
    answer: a
    feedback: The remaining execution time is one fifth of the original.
