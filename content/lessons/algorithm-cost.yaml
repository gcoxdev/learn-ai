assessment_families:
  - id: algorithm-cost.base
    objective_ref: objective.algorithm-cost
    task: base
    response_type: single_choice
    points: 1
    hint: Scale n by a factor and ask what happens to n² (the factor squared) or to a running best (nothing).
    remediation_scene: algorithm-cost.s2
    variants:
      - id: algorithm-cost.base.1
        prompt: If pairwise work scales as n², what happens when n triples?
        options:
          - id: c
            text: It becomes constant
          - id: a
            text: It grows by a factor of 9
          - id: b
            text: It grows by 3
        answer: a
        feedback: Squaring 3n introduces a factor of 9.
        retired: true
      - id: algorithm-cost.base.2
        prompt: A scan keeps only the best value so far. How much extra state is needed as n grows?
        options:
          - id: a
            text: Constant extra state for the running best
          - id: b
            text: A second full copy of every item
          - id: c
            text: A matrix of all pairs
        answer: a
        feedback: The running-best algorithm need not retain previous items beyond its summary.
        retired: true
  - id: algorithm-cost.transfer
    objective_ref: objective.algorithm-cost
    task: transfer
    response_type: single_choice
    points: 1
    hint: Find what the job is waiting on, arithmetic, memory, or a serial step, before choosing a fix.
    remediation_scene: algorithm-cost.s4
    variants:
      - id: algorithm-cost.transfer.1
        prompt: Arithmetic units spend most time waiting for memory. What should an optimization investigate?
        options:
          - id: a
            text: Data movement and reuse
          - id: b
            text: Only adding more multipliers
          - id: c
            text: Only renaming variables
        answer: a
        feedback: The measured bottleneck determines which improvement can help.
        retired: true
      - id: algorithm-cost.transfer.2
        prompt: Twenty percent of a program remains serial. What is the ideal maximum speedup if the rest becomes instantaneous?
        options:
          - id: b
            text: 20 times
          - id: c
            text: Unlimited
          - id: a
            text: 5 times
        answer: a
        feedback: The remaining execution time is one fifth of the original.
        retired: true
  - id: algorithm-cost.base.v2
    objective_ref: objective.algorithm-cost
    task: base
    response_type: single_choice
    points: 1
    hint: "Double (or triple) n and see what each growth rate does: O(log n) adds a step, O(n) doubles, O(n²) quadruples. Big-O keeps only the fastest-growing term."
    remediation_scene: algorithm-cost.s2
    variants:
      - id: algorithm-cost.base.v2.1
        prompt: Computing attention scores for a 4,000-token prompt takes 0.5 seconds. Roughly how long for an 8,000-token prompt?
        options:
          - id: b
            text: About 1 second, twice as long for twice the tokens
          - id: a
            text: About 2 seconds, since the n² scores grow 4 times
          - id: c
            text: About 0.5 seconds, since each token is processed alike
        answer: a
        feedback: Every token is scored against every other, so doubling n multiplies the scores by 2² = 4, and 0.5 × 4 = 2 seconds. Doubling the time would be linear growth.
      - id: algorithm-cost.base.v2.2
        prompt: An algorithm takes 3n² + 100n + 7 steps. How would you describe it in big-O notation?
        options:
          - id: a
            text: O(n²), because that term dominates for large n
          - id: c
            text: O(3n² + 100n), keeping every term that grows
          - id: b
            text: O(n), because 100n is bigger when n is small
        answer: a
        feedback: Big-O describes growth for large n and drops constants and smaller terms, leaving O(n²). It's true that 100n is larger below n ≈ 33, but that's exactly the small-n detail big-O ignores.
      - id: algorithm-cost.base.v2.3
        prompt: A program finds the highest temperature in a stream of 10 million sensor readings, keeping only the highest so far. How much extra memory does it need as the stream grows?
        options:
          - id: c
            text: Enough to hold a copy of the readings seen so far
          - id: b
            text: A table comparing each pair of readings
          - id: a
            text: A fixed amount, for the one running maximum
        answer: a
        feedback: Each reading is compared with the running maximum and then forgotten, so extra memory stays constant, O(1). A copy would be O(n) and a pair table O(n²), and the scan needs neither.
      - id: algorithm-cost.base.v2.4
        prompt: For 20 items, a simple O(n²) method runs faster than a clever O(n log n) one. What explains this?
        options:
          - id: b
            text: The measurement must be wrong, since O(n log n) grows more slowly
          - id: a
            text: Big-O ignores constant factors, which dominate at small n
          - id: c
            text: O(n²) methods are faster than O(n log n) whenever n is under 100
        answer: a
        feedback: Big-O describes growth for large n. With few items, the clever method's extra overhead per step can outweigh its better growth. No fixed cutoff like 100 exists; it depends on the constants, so measure.
      - id: algorithm-cost.base.v2.5
        prompt: A binary search over a sorted list takes 20 steps. The list doubles in length. How many steps does it take now?
        options:
          - id: a
            text: 21, since one extra halving covers the doubling
          - id: b
            text: 40, since twice the items means twice the steps
          - id: c
            text: 80, since the steps grow with the square of n
        answer: a
        feedback: "Binary search is O(log n): each step halves the candidates, so doubling the list adds just one step. Doubling the steps would be O(n) growth."
  - id: algorithm-cost.transfer.v2
    objective_ref: objective.algorithm-cost
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask which cost is growing or limiting here, steps, stored memory, data movement, or serial waiting, and pick the fix aimed at that one.
    remediation_scene: algorithm-cost.s3
    variants:
      - id: algorithm-cost.transfer.v2.1
        prompt: A team raises its model's context from 8,000 to 32,000 tokens. The weights are unchanged, but a naive attention layer now runs out of GPU memory. Why?
        options:
          - id: b
            text: The weights must grow in size along with the context length
          - id: a
            text: The full score table grows with n², so 16 times the memory
          - id: c
            text: The stored keys and values grow with n², so they fill memory
        answer: a
        feedback: Four times the tokens means 4² = 16 times the scores to store. Weights don't depend on context length, and the stored keys and values grow only linearly, 4 times. Tiled attention like FlashAttention avoids storing the table.
      - id: algorithm-cost.transfer.v2.2
        prompt: Finding duplicates among 1 million photos by comparing every pair would take about 5 × 10¹¹ comparisons. What is the best improvement?
        options:
          - id: c
            text: Buy a computer twice as fast to halve the waiting time
          - id: a
            text: Sort the photos by a fingerprint so duplicates sit side by side
          - id: b
            text: Compare only the first 1,000 photos to save a lot of time
        answer: a
        feedback: Sorting is O(n log n), about 2 × 10⁷ steps here, and then one pass finds neighbors that match. A 2× faster computer barely dents an O(n²) job, and checking only 1,000 photos misses most duplicates.
      - id: algorithm-cost.transfer.v2.3
        prompt: A normalization kernel does a few additions per number it loads. A profile shows the GPU's arithmetic units idle 90% of the time. What should an optimization target?
        options:
          - id: a
            text: Reading and writing less memory, or reusing data already loaded
          - id: b
            text: A GPU with twice as many arithmetic units and the same memory
          - id: c
            text: Rewriting each addition as a faster multiplication
        answer: a
        feedback: Idle arithmetic units are waiting for data, so the kernel is memory-bound. More arithmetic units would wait just as long; the fix is fewer bytes moved, for example by fusing steps so data is loaded once.
      - id: algorithm-cost.transfer.v2.4
        prompt: A chatbot answers with 500 new tokens, and adding more GPUs barely speeds up a single answer. What is the main reason?
        options:
          - id: b
            text: The prompt is too short to keep so many GPUs busy
          - id: c
            text: Attention over the prompt grows with the square of its length
          - id: a
            text: Each new token depends on the one before, so tokens come out one by one
        answer: a
        feedback: Generation is serial across tokens, and serial steps can't be split among GPUs. Extra hardware can serve more users at once, or make each step faster, but it can't produce token 300 before token 299.
      - id: algorithm-cost.transfer.v2.5
        prompt: A job spends 30 seconds loading data one file at a time, then 70 seconds on work that can be split across any number of GPUs. With unlimited GPUs, what is the best possible speedup?
        options:
          - id: a
            text: About 3.3 times, from 100 seconds down to 30
          - id: c
            text: About 1.4 times, from removing the 30 seconds of loading
          - id: b
            text: Unlimited, since the GPU work shrinks toward zero
        answer: a
        feedback: "The serial 30 seconds stay, so the time can't drop below 30 seconds: 100 ÷ 30 ≈ 3.3. Parallel hardware only shrinks the 70 seconds, not the loading."
  - id: algorithm-cost.calculate
    objective_ref: objective.algorithm-cost
    task: base
    response_type: numeric
    points: 1
    hint: "Find the growth rule first. For O(n²), square the factor n grew by; for O(n), use the factor itself; for all pairs, use n × (n − 1) ÷ 2; for halving, count how many times you can divide by 2."
    remediation_scene: algorithm-cost.s2
    absolute_tolerance: 0.01
    variants:
      - id: algorithm-cost.calculate.1
        prompt: Attention scoring grows with n². A prompt grows from 1,000 to 4,000 tokens. How many times more scores are there?
        answer: 16
        feedback: The length grew 4 times, so the scores grow 4² = 16 times.
      - id: algorithm-cost.calculate.2
        prompt: A full attention score table takes 1 GB at 8,000 tokens. How many GB does it take at 24,000 tokens?
        answer: 9
        feedback: 24,000 is 3 times 8,000, and the table grows with n², so 3² × 1 GB = 9 GB.
      - id: algorithm-cost.calculate.3
        prompt: A linear scan of 1 million items takes 2 milliseconds. About how many milliseconds for 5 million items?
        answer: 10
        feedback: "A scan is O(n): 5 times the items take 5 times as long, 5 × 2 = 10 milliseconds."
      - id: algorithm-cost.calculate.4
        prompt: How many comparisons does it take to compare every pair among 50 photos, each pair once?
        answer: 1225
        feedback: n × (n − 1) ÷ 2 = 50 × 49 ÷ 2 = 1,225 pairs.
      - id: algorithm-cost.calculate.5
        prompt: Binary search halves the candidates at each step. How many halvings take 1,024 candidates down to 1?
        answer: 10
        feedback: "1,024 = 2¹⁰, so 10 halvings: 512, 256, 128, 64, 32, 16, 8, 4, 2, 1."
