schema_version: 0.2-draft
lesson:
  id: algorithm-cost
  version: 0.4.0-draft
  title: Count work, memory, and parallel limits
  state: draft
  summary: Why does a prompt eight times longer make attention 64 times the work? Count steps and memory as inputs grow, and learn when big-O matters and when it doesn't.
  slot: B21
  category: bridge
  sources:
    - title: Dive into Deep Learning — authors’ open textbook
      url: https://d2l.ai/
objectives:
  - id: objective.algorithm-cost
    version: 2-draft
    statement: Count the steps and memory an algorithm needs as its input grows, compare growth rates with big-O, and explain why memory traffic and serial steps can limit speed.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - algorithm-cost.base.v2
      - algorithm-cost.transfer.v2
      - algorithm-cost.calculate
    prerequisites:
      - anyOf:
          - objective.arithmetic
scenes:
  - id: algorithm-cost.s1
    title: The brightest photo versus every matching pair
    type: explanation
    depth: intuition
    objective_refs:
      - objective.algorithm-cost
    markdown: |-
      Your phone holds 1,000 photos. Finding the single brightest one is instant. Finding every pair of near-duplicates takes noticeably longer. Both jobs look at the same photos, so why the difference?

      **Why AI needs this:** attention compares every token with every other token. That's why a prompt eight times longer costs about 64 times the attention work, and why long context needs special tricks like FlashAttention.

      Count the steps before you reach for a stopwatch:

      - **Brightest photo.** Keep the best so far and compare each new photo with it: 1,000 photos take 999 comparisons.
      - **Near-duplicates.** Compare every photo with every other: n × (n − 1) ÷ 2 pairs, which for 1,000 photos is 499,500 comparisons.

      ```python run
      def brightest(photos):
          steps, best = 0, photos[0]
          for p in photos[1:]:
              steps += 1                  # compare one photo with the best so far
              if p > best:
                  best = p
          return steps

      def all_pairs(photos):
          steps = 0
          for i in range(len(photos)):
              for j in range(i + 1, len(photos)):
                  steps += 1              # compare photo i with photo j
          return steps

      for n in [10, 100, 1000, 2000]:
          photos = list(range(n))         # stand-in brightness values
          print(f"n = {n:5d}: scan {brightest(photos):6,d} steps   all pairs {all_pairs(photos):10,d} steps")
      ```

      Going from 1,000 to 2,000 photos doubles the scan (999 to 1,999) but multiplies the pair count by 4 (499,500 to 1,999,000). Add 3000 to the list of sizes, and predict its pair count first.
    bridges: []
  - id: algorithm-cost.s2
    title: Big-O keeps only how fast the cost grows
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.algorithm-cost
    markdown: |-
      **Big-O notation** describes how the step count grows for large n, ignoring constant factors and smaller terms. The scan is O(n), read "order n." The pairs job, about ½n² steps, is O(n²). An algorithm taking 3n² + 100n steps is also O(n²), because for large n the n² term swamps the rest.

      | n | log₂ n | n log₂ n | n² |
      | ---: | ---: | ---: | ---: |
      | 16 | 4 | 64 | 256 |
      | 1,000 | about 10 | about 10,000 | 1,000,000 |
      | 1,000,000 | about 20 | about 20 million | 10¹² |

      A handy test is to double n. O(n) doubles; O(n²) quadruples; O(log n) adds just one step, since binary search halves its candidates each time (16 → 8 → 4 → 2 → 1 is 4 halvings). Good sorting algorithms take O(n log n).

      :::predict A prompt grows from 4,000 to 32,000 tokens. How much does the number of attention scores grow?
      The length grows 8 times, so the n² scores grow 8² = 64 times: from 16 million to about a billion per head, per layer.
      :::

      :::mixup "An O(n log n) method always beats an O(n²) one."
      Big-O hides constants. If the first takes 100 × n log₂ n steps and the second n², then at n = 16 the "slow" one needs 256 steps against 6,400. The O(n log n) method only wins beyond about n = 1,000. For small inputs, measure.
      :::
    bridges:
      - arithmetic
  - id: algorithm-cost.s3
    title: Memory grows too, and moving it takes time
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.algorithm-cost
    markdown: |-
      Steps aren't the only cost. The scan needs one extra number, the best so far, however many photos there are: O(1) extra memory. Storing every pair's similarity needs O(n²).

      Attention hits exactly this. For 32,768 tokens, the full table of scores has 32,768² ≈ 1.07 billion entries. At 2 bytes each (16-bit numbers), that's about 2.1 GB, for a single head in a single layer. FlashAttention, from the lesson on efficient attention kernels, computes attention in small tiles and never stores the whole table.

      Moving data costs time as well. As in the lesson on processors and parallelism, a chip that can move 10 GB per second needs at least 0.1 seconds to read 1 GB, however fast its arithmetic. When the arithmetic units sit idle waiting for data, the job is **memory-bound**, and the fix is to move less data or reuse it, not to add arithmetic.
    bridges: []
  - id: algorithm-cost.s4
    title: Parallel hardware cuts time, not work
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.algorithm-cost
    markdown: |-
      A GPU can compute thousands of the pair comparisons at once, because none depends on another. The total work stays n² ÷ 2; only the waiting shrinks.

      Steps that depend on earlier results can't be spread out. A language model reads your whole prompt in parallel, but it writes its answer one token at a time, because each new token depends on the one before. If 20% of a job is strictly serial, then even infinitely fast help with the other 80% leaves 20% of the time: at most a 5× speedup.

      So when someone claims a speedup, ask three questions: How does the work grow with n? How much memory does it need, and how often is that memory moved? Which steps must wait for others?
    bridges: []
  - id: algorithm-cost.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.algorithm-cost
    markdown: Scale up a context window, a duplicate finder, a streaming maximum, and a serial pipeline, and decide what really limits each one.
    takeaway: |-
      Count how steps and memory grow with the input: doubling n doubles O(n) work and quadruples O(n²). Big-O hides constants, and memory traffic and serial steps can set the speed instead.
  - id: algorithm-cost.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.algorithm-cost
    markdown: |-
      Algorithms specify operations; runtime growth, working memory, bandwidth, and serial dependencies help explain their practical cost.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - algorithm-cost.s1
        - algorithm-cost.s2
        - algorithm-cost.s3
        - algorithm-cost.s4
        - algorithm-cost.check
      gate_refs:
        - gate.core
  scene_aliases:
