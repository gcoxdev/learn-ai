scenes:
- id: algorithm-cost.s1
  title: Write a procedure before timing it
  type: explanation
  depth: intuition
  objective_refs:
  - objective.algorithm-cost
  markdown: An algorithm is a sequence of steps that solves a specified problem. Pseudocode describes these
    steps without committing to a programming language. To find the largest of n values, keep the largest seen
    so far and compare each new value with it. Correctness and computational cost are separate questions.
  text_mode: An algorithm is a sequence of steps that solves a specified problem. Pseudocode describes these
    steps without committing to a programming language. To find the largest of n values, keep the largest seen
    so far and compare each new value with it. Correctness and computational cost are separate questions.
  bridges: []
- id: algorithm-cost.s2
  title: Compare growth rates
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.algorithm-cost
  markdown: 'A scan over n items takes work proportional to n. Comparing every item with every other can require
    work proportional to n². At n = 100, these scales are 100 and 10,000; doubling n multiplies the second
    scale by four. Big-O notation describes an asymptotic bound, not an exact stopwatch measurement.


    Finding the largest of n values uses n − 1 comparisons after initializing from the first value, when n
    is positive. The scan is O(n), read “big O of n”: its work has a linear upper bound for large n. It needs
    only one running maximum in extra working storage, even though the input itself contains n values. An O(log
    n) search has different growth: repeatedly halving 16 candidates reaches one after four halvings.'
  text_mode: 'A scan over n items takes work proportional to n. Comparing every item with every other can require
    work proportional to n². At n = 100, these scales are 100 and 10,000; doubling n multiplies the second
    scale by four. Big-O notation describes an asymptotic bound, not an exact stopwatch measurement.


    Finding the largest of n values uses n − 1 comparisons after initializing from the first value, when n
