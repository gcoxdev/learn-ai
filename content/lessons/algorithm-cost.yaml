objectives:
- id: objective.algorithm-cost
  version: 1-draft
  statement: Algorithms specify operations; runtime growth, working memory, bandwidth, and serial dependencies
    help explain their practical cost.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - algorithm-cost.base
  - algorithm-cost.transfer
  prerequisites:
  - anyOf:
