schema_version: 0.2-draft
lesson:
  id: architecture-tradeoff-study
  version: 0.3.0-draft
  title: Compare sequence architectures with an honest budget
  state: draft
  summary: Choose an architecture against a stated quality and resource budget using comparable measurements.
  slot: M19.8
  category: learning
  sources:
  - title: 'Mamba: Linear-Time Sequence Modeling with Selective State Spaces'
    url: https://arxiv.org/abs/2312.00752
  - title: The Llama 3 Herd of Models
    url: https://arxiv.org/abs/2407.21783
  - title: The Hardware Lottery
    url: https://arxiv.org/abs/2009.06489
objectives:
- id: objective.architecture-tradeoff-study
  version: 1-draft
  statement: Architecture comparisons should match relevant budgets and measure quality, state, training, prefill,
    decoding, and workload sensitivity; no single asymptotic label ranks every system.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - architecture-tradeoff-study.base
  - architecture-tradeoff-study.transfer
  prerequisites:
  - anyOf:
    - objective.long-context-capability
  - anyOf:
    - objective.research-reporting
  - anyOf:
    - objective.compute-and-bandwidth
scenes:
- id: architecture-tradeoff-study.s1
  title: Choose the decision first
  type: explanation
  depth: intuition
  objective_refs:
  - objective.architecture-tradeoff-study
  markdown: A phone assistant, a long-document analyst, and a high-throughput batch service have different
    constraints. Specify quality thresholds, latency, memory, context, and hardware. The preferred architecture
    is conditional on those requirements; a research benchmark winner may fail a deployment constraint.
  text_mode: A phone assistant, a long-document analyst, and a high-throughput batch service have different
    constraints. Specify quality thresholds, latency, memory, context, and hardware. The preferred architecture
    is conditional on those requirements; a research benchmark winner may fail a deployment constraint.
  bridges: []
- id: architecture-tradeoff-study.s2
  title: Use several matched views
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.architecture-tradeoff-study
  markdown: 'Equal parameter count, equal active FLOPs, equal training compute, and equal serving cost are
    different comparisons. Present the relevant ones explicitly. A toy table might compare quality at a fixed
    memory limit and then latency at a fixed quality threshold, rather than compressing everything into one
    score.


    Suppose a device has an 8 GB memory limit. Model A passes 90 of 100 matched cases using 6 GB; B passes
    94 but needs 12 GB. A meets the capacity condition and B does not under this configuration. A different
    server budget could change the decision. These invented numbers demonstrate a comparison rule, not a benchmark
    result.'
  text_mode: 'Equal parameter count, equal active FLOPs, equal training compute, and equal serving cost are
    different comparisons. Present the relevant ones explicitly. A toy table might compare quality at a fixed
    memory limit and then latency at a fixed quality threshold, rather than compressing everything into one
    score.


    Suppose a device has an 8 GB memory limit. Model A passes 90 of 100 matched cases using 6 GB; B passes
    94 but needs 12 GB. A meets the capacity condition and B does not under this configuration. A different
    server budget could change the decision. These invented numbers demonstrate a comparison rule, not a benchmark
    result.'
  bridges: []
- id: architecture-tradeoff-study.s3
  title: Separate phases and distributions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.architecture-tradeoff-study
  markdown: 'Training can exploit parallel scans or large batches that do not resemble incremental decoding.
    Prefill processes known prompt tokens; decoding repeatedly produces new ones. Test short and long inputs,
    concurrency, retrieval-sensitive tasks, and shifted domains. Report the full operating conditions.


    **Prefill** processes the supplied prompt. **Decode** generates new outputs incrementally. **Concurrency**
    counts requests served at once. A method can be fast at a large parallel prefill and slow for one user
    waiting on each next token. Record all three conditions before comparing a speed claim.'
  text_mode: 'Training can exploit parallel scans or large batches that do not resemble incremental decoding.
    Prefill processes known prompt tokens; decoding repeatedly produces new ones. Test short and long inputs,
    concurrency, retrieval-sensitive tasks, and shifted domains. Report the full operating conditions.


    **Prefill** processes the supplied prompt. **Decode** generates new outputs incrementally. **Concurrency**
    counts requests served at once. A method can be fast at a large parallel prefill and slow for one user
    waiting on each next token. Record all three conditions before comparing a speed claim.'
  bridges: []
- id: architecture-tradeoff-study.s4
  title: Make uncertainty visible
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.architecture-tradeoff-study
  markdown: Measure repeated runs where useful, identify unavailable training details, and preserve configurations.
    Explain which differences are controlled and which are confounded by data or scale. State the conclusion
    at the level measured—for example, faster on this workload with these quality and memory limits.
  text_mode: Measure repeated runs where useful, identify unavailable training details, and preserve configurations.
    Explain which differences are controlled and which are confounded by data or scale. State the conclusion
    at the level measured—for example, faster on this workload with these quality and memory limits.
  bridges: []
- id: architecture-tradeoff-study.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.architecture-tradeoff-study
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Choose the task and resource limits before comparing architectures. Measure training, prompt processing,
    and decoding under the conditions that matter for that decision.
- id: architecture-tradeoff-study.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.architecture-tradeoff-study
  markdown: Choose the task and resource limits before comparing architectures. Measure training, prompt processing,
    and decoding under the conditions that matter for that decision.
  text_mode: Choose the task and resource limits before comparing architectures. Measure training, prompt processing,
    and decoding under the conditions that matter for that decision.
navigation:
