assessment_families:
- id: production-data-and-model-artifacts.base
  objective_ref: objective.production-data-and-model-artifacts
  task: base
  response_type: single_choice
  points: 1
  hint: 'Prevent training-serving skew: trace the inputs, operation, and result before choosing.'
  remediation_scene: production-data-and-model-artifacts.s2
  variants:
  - id: production-data-and-model-artifacts.base.1
    prompt: Why version preprocessing with weights?
    options:
    - id: a
      text: It determines the input representation the model expects
    - id: b
      text: Only model file size matters
    - id: c
      text: Preprocessing never affects predictions
    answer: a
    feedback: The artifact set defines behavior.
    retired: true
  - id: production-data-and-model-artifacts.base.2
    prompt: Using a future event in a historical feature creates what?
    options:
    - id: b
      text: Perfect real-time prediction
    - id: c
      text: Only a storage optimization
    - id: a
      text: Temporal leakage
    answer: a
    feedback: Training must respect information available at prediction time.
    retired: true
- id: production-data-and-model-artifacts.transfer
  objective_ref: objective.production-data-and-model-artifacts
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Test updates across dependencies: trace the inputs, operation, and result before choosing.'
  remediation_scene: production-data-and-model-artifacts.s4
  variants:
  - id: production-data-and-model-artifacts.transfer.1
    prompt: Does a registry entry certify model quality?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if it has a version number
    - id: a
      text: 'No'
    answer: a
    feedback: Quality requires evidence and release criteria.
    retired: true
  - id: production-data-and-model-artifacts.transfer.2
    prompt: What can an encoder change invalidate?
    options:
    - id: c
      text: No existing artifact ever
    - id: a
      text: Stored embeddings and dependent caches
    - id: b
      text: Only the product logo
    answer: a
    feedback: Representation compatibility must be preserved or rebuilt.
    retired: true
- id: production-data-and-model-artifacts.base.v2
  objective_ref: objective.production-data-and-model-artifacts
  task: base
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: production-data-and-model-artifacts.s3
  variants:
  - prompt: What is a release manifest for?
    answer: a
    options:
    - id: c
      text: Replacing evaluation with a version label
    - id: b
      text: Summarizing only the model’s architecture name
    - id: a
      text: Identifying the exact artifacts used together
    feedback: A manifest names the parts of a reproducible system.
    id: production-data-and-model-artifacts.base.v2.1
  - prompt: Training and serving give different meanings to the same input field. What is the issue?
    answer: a
    options:
    - id: a
      text: Training-serving skew
    - id: c
      text: A larger context window
    - id: b
      text: Ordinary sampling variation in outputs
    feedback: The input contract differs between stages.
    id: production-data-and-model-artifacts.base.v2.2
  - prompt: A tokenizer changes ID meanings but the weights stay fixed. What needs checking?
    answer: a
    options:
    - id: b
      text: Only whether the tokenizer file loads
    - id: a
      text: Compatibility with the learned token interfaces
    - id: c
      text: Only whether the vocabulary has the same size
    feedback: Equal sizes do not imply equal ID meanings.
    id: production-data-and-model-artifacts.base.v2.3
  - prompt: What does artifact lineage record?
    answer: a
    options:
    - id: b
      text: Only its latest public name
    - id: c
      text: Only its evaluation score
    - id: a
      text: Sources and transformations that produced an artifact
    feedback: Lineage connects a result to its production history.
    id: production-data-and-model-artifacts.base.v2.4
- id: production-data-and-model-artifacts.transfer.v2
  objective_ref: objective.production-data-and-model-artifacts
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: production-data-and-model-artifacts.s3
  variants:
  - prompt: A historical prediction uses a field recorded only after its outcome. What is wrong?
    answer: a
    options:
    - id: a
      text: Information from the future leaked into the example
    - id: b
      text: The training set is too small to be reproducible
    - id: c
      text: The output was sampled rather than chosen greedily
    feedback: Inputs must respect what was available at prediction time.
    id: production-data-and-model-artifacts.transfer.v2.1
  - prompt: Answers changed after a prompt update with identical weights. What must the release record include?
    answer: a
    options:
    - id: a
      text: The prompt version and its evaluation
    - id: c
      text: Only the number of generated tokens
    - id: b
      text: Only the unchanged weight checksum
    feedback: Behavior depends on configuration as well as weights.
    id: production-data-and-model-artifacts.transfer.v2.2
  - prompt: A new encoder changes stored-vector meaning. What should happen before switching search to it?
    answer: a
    options:
    - id: c
      text: Keep the index name fixed to preserve compatibility
    - id: a
      text: Check compatibility and rebuild dependent vectors where needed
    - id: b
      text: Use new query vectors against old vectors without testing
    feedback: A label does not preserve a changed representation contract.
    id: production-data-and-model-artifacts.transfer.v2.3
  - prompt: A model appears in a registry. What additional evidence is needed for release?
    answer: a
    options:
    - id: b
      text: Its registry status without the underlying evaluation evidence
    - id: c
      text: Only the date when it was uploaded
    - id: a
      text: Tests of its actual compatible operating setup
    feedback: Registration records identity, not quality.
    id: production-data-and-model-artifacts.transfer.v2.4
