schema_version: 0.2-draft
lesson:
  id: production-data-and-model-artifacts
  version: 0.3.0-draft
  title: Keep training and serving connected to the same definitions
  state: draft
  summary: 'Pack a release like a board game: the pieces need the matching rules.'
  slot: M33.2
  category: learning
  sources:
  - title: Sculley et al. — Hidden Technical Debt in Machine Learning Systems
    url: https://research.google/pubs/hidden-technical-debt-in-machine-learning-systems/
  - title: Breck et al. — The ML Test Score
    url: https://research.google/pubs/the-ml-test-score-a-rubric-for-ml-production-readiness-and-technical-debt-reduction/
  archetype: mechanism
objectives:
- id: objective.production-data-and-model-artifacts
  version: 2-draft
  statement: Trace an output to a versioned artifact set and diagnose training-serving mismatches in input
    definitions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - production-data-and-model-artifacts.base.v2
  - production-data-and-model-artifacts.transfer.v2
  prerequisites:
  - anyOf:
    - objective.ai-product-framing
  - anyOf:
    - objective.data-provenance
  - anyOf:
    - objective.splits-and-leakage
scenes:
- id: production-data-and-model-artifacts.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.production-data-and-model-artifacts
  title: The model file is one piece
  markdown: 'An **artifact** is a saved item needed to build, run, or inspect a system: a model file, tokenizer,
    cleaning script, prompt, or evaluation report. Think of packing a board game. The pieces need the matching
    rulebook. A language model’s weights are useful only with compatible input and output definitions. A **manifest**
    is a list identifying the exact versions used together. It lets another person reconstruct what a release
    contained.'
  text_mode: 'An **artifact** is a saved item needed to build, run, or inspect a system: a model file, tokenizer,
    cleaning script, prompt, or evaluation report. Think of packing a board game. The pieces need the matching
    rulebook. A language model’s weights are useful only with compatible input and output definitions. A **manifest**
    is a list identifying the exact versions used together. It lets another person reconstruct what a release
    contained.'
  bridges: []
- id: production-data-and-model-artifacts.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.production-data-and-model-artifacts
  title: Follow a unit mismatch
  markdown: 'Imagine a model trained to estimate a journey using distance measured in kilometers. During training,
    a trip of two kilometers is represented as 2. During live use, a new input service supplies meters, so
    the same trip arrives as 2000. The model file has not changed, but its input meaning has. This is **training-serving
    skew**: training and live prediction use inconsistent definitions. Replacing the model without fixing the
    unit contract misses the cause.'
  text_mode: 'Imagine a model trained to estimate a journey using distance measured in kilometers. During training,
    a trip of two kilometers is represented as 2. During live use, a new input service supplies meters, so
    the same trip arrives as 2000. The model file has not changed, but its input meaning has. This is **training-serving
    skew**: training and live prediction use inconsistent definitions. Replacing the model without fixing the
    unit contract misses the cause.'
  bridges: []
- id: production-data-and-model-artifacts.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.production-data-and-model-artifacts
  title: Write down the input contract
  markdown: A **schema** describes expected fields and their forms. A useful contract also records units, missing-value
    rules, categories, and the time at which information is available. Test representative records through
    both training and serving transformations. Historical examples must use information available at their
    prediction time. A later outcome, such as whether a visitor eventually returned a book, cannot secretly
    become an input to an earlier prediction about that return.
  text_mode: A **schema** describes expected fields and their forms. A useful contract also records units,
    missing-value rules, categories, and the time at which information is available. Test representative records
    through both training and serving transformations. Historical examples must use information available at
    their prediction time. A later outcome, such as whether a visitor eventually returned a book, cannot secretly
    become an input to an earlier prediction about that return.
  bridges: []
- id: production-data-and-model-artifacts.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.production-data-and-model-artifacts
  title: Keep text tools matched too
  markdown: Suppose tokenizer T1 maps token ID 7 to “cat,” but tokenizer T2 maps 7 to “dog.” Pairing T2 with
    weights trained for T1 changes what those numbers mean, even if the files load successfully. A prompt template
    or retrieval index can also change an assistant’s answers. An **index** is an organized structure for finding
    stored information. Preserve the relevant versions alongside the model so a release identifies the full
    operating setup.
  text_mode: Suppose tokenizer T1 maps token ID 7 to “cat,” but tokenizer T2 maps 7 to “dog.” Pairing T2 with
    weights trained for T1 changes what those numbers mean, even if the files load successfully. A prompt template
    or retrieval index can also change an assistant’s answers. An **index** is an organized structure for finding
    stored information. Preserve the relevant versions alongside the model so a release identifies the full
    operating setup.
  bridges: []
- id: production-data-and-model-artifacts.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.production-data-and-model-artifacts
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: 'Keep the pieces together: data definitions, transformations, model, configuration, and evidence
    must describe the same system.'
- id: production-data-and-model-artifacts.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.production-data-and-model-artifacts
  markdown: Production AI needs versioned data transformations, feature definitions, model artifacts, and lineage;
    training-serving skew and inconsistent dependencies can break an otherwise valid model.
  text_mode: Production AI needs versioned data transformations, feature definitions, model artifacts, and
    lineage; training-serving skew and inconsistent dependencies can break an otherwise valid model.
- id: production-data-and-model-artifacts.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.production-data-and-model-artifacts
  title: Keep a trail from source to result
  markdown: '**Lineage** is the record of where an artifact came from and how it was produced. A release manifest
    might name data D3, cleaner C2, tokenizer T1, weights W4, prompt P2, and evaluation E6. A registry is a
    catalog of these saved versions and their status. Cataloging helps diagnosis, but a “registered” label
    does not prove that the system works. Keep compatibility tests and evaluation evidence linked to the actual
    artifact set.'
  text_mode: '**Lineage** is the record of where an artifact came from and how it was produced. A release manifest
    might name data D3, cleaner C2, tokenizer T1, weights W4, prompt P2, and evaluation E6. A registry is a
    catalog of these saved versions and their status. Cataloging helps diagnosis, but a “registered” label
    does not prove that the system works. Keep compatibility tests and evaluation evidence linked to the actual
    artifact set.'
  bridges: []
- id: production-data-and-model-artifacts.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.production-data-and-model-artifacts
  title: Test the old and new combinations
  markdown: Before replacing one component, run known examples through the old and proposed combinations. Inspect
    what changed and preserve the previous compatible set. A new tokenizer or document index may require rebuilding
    dependent data. Check that component versions remain compatible and that inputs still have the same meaning.
    These checks often catch failures that a test of model weights alone would miss.
  text_mode: Before replacing one component, run known examples through the old and proposed combinations.
    Inspect what changed and preserve the previous compatible set. A new tokenizer or document index may require
    rebuilding dependent data. Check that component versions remain compatible and that inputs still have the
    same meaning. These checks often catch failures that a test of model weights alone would miss.
  bridges: []
- id: production-data-and-model-artifacts.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.production-data-and-model-artifacts
  title: Find the broken contract
  markdown: Training represents two kilometers as 2. Serving represents the same trip as 2000. What should
    be checked first?
  text_mode: Training represents two kilometers as 2. Serving represents the same trip as 2000. What should
    be checked first?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: The unit conversion at the input boundary.
    - id: b
      text: Whether the model needs more layers.
    - id: c
      text: Whether the test set should contain more trips.
    answer: a
    reveal_markdown: The two stages disagree about the meaning of one input. Fix and test the units before
      treating this as a learning problem.
    hint: Trace the example using the rule from the preceding pages.
    id: production-data-and-model-artifacts.practice.v2.7
