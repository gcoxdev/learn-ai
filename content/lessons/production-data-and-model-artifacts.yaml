schema_version: 0.2-draft
lesson:
  id: production-data-and-model-artifacts
  version: 0.1.0-draft
  title: Keep training and serving connected to the same definitions
  state: draft
  summary: Production AI needs versioned data transformations, feature definitions, model artifacts, and lineage;
    training-serving skew and inconsistent dependencies can break an otherwise valid model.
  slot: M33.2
  category: learning
  minutes: 12
  sources:
  - title: Hidden Technical Debt in ML Systems
    url: https://research.google/pubs/hidden-technical-debt-in-machine-learning-systems/
  - title: TFX
    url: https://research.google/pubs/tfx-a-tensorflow-based-production-scale-machine-learning-platform/
objectives:
- id: objective.production-data-and-model-artifacts
  version: 1-draft
  statement: Production AI needs versioned data transformations, feature definitions, model artifacts, and lineage;
    training-serving skew and inconsistent dependencies can break an otherwise valid model.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - production-data-and-model-artifacts.base
  - production-data-and-model-artifacts.transfer
  prerequisites:
  - anyOf:
    - objective.ai-product-framing
  - anyOf:
    - objective.retrieval-ingestion-and-chunking
  - anyOf:
    - objective.reliable-training-operations
scenes:
- id: production-data-and-model-artifacts.s1
  title: Version the pipeline as well as weights
  type: explanation
  depth: intuition
  objective_refs:
  - objective.production-data-and-model-artifacts
  markdown: A model depends on data schemas, cleaning, feature computation, encoders, tokenizers, and configuration.
    Store enough lineage to connect an output to its artifact set. Reproducing weights without the preprocessing
    that produced their inputs may reproduce neither predictions nor evaluation.
  text_mode: A model depends on data schemas, cleaning, feature computation, encoders, tokenizers, and configuration.
    Store enough lineage to connect an output to its artifact set. Reproducing weights without the preprocessing
    that produced their inputs may reproduce neither predictions nor evaluation.
  bridges: []
- id: production-data-and-model-artifacts.s2
  title: Prevent training-serving skew
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.production-data-and-model-artifacts
  markdown: 'If training normalizes a feature using one definition and serving uses another, the model receives
    a changed distribution. Time-sensitive features also require point-in-time correctness: a historical training
    example must not use information that became available only later.'
  text_mode: 'If training normalizes a feature using one definition and serving uses another, the model receives
    a changed distribution. Time-sensitive features also require point-in-time correctness: a historical training
    example must not use information that became available only later.'
  bridges: []
- id: production-data-and-model-artifacts.s3
  title: Use registries as controlled inventories
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.production-data-and-model-artifacts
  markdown: A model registry can record versions, evaluations, lineage, and release status. A feature system can
    centralize definitions and retrieval interfaces. These tools help only when contracts, ownership, and validation
    are maintained; a registry entry is not itself proof of quality.
  text_mode: A model registry can record versions, evaluations, lineage, and release status. A feature system can
    centralize definitions and retrieval interfaces. These tools help only when contracts, ownership, and validation
    are maintained; a registry entry is not itself proof of quality.
  bridges: []
- id: production-data-and-model-artifacts.s4
  title: Test updates across dependencies
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.production-data-and-model-artifacts
  markdown: Changing an encoder, schema, or feature definition can invalidate caches and stored vectors. Validate
    compatibility and migration with representative records before switching consumers. Preserve prior artifacts
    and clear version identities to support diagnosis and rollback.
  text_mode: Changing an encoder, schema, or feature definition can invalidate caches and stored vectors. Validate
    compatibility and migration with representative records before switching consumers. Preserve prior artifacts
    and clear version identities to support diagnosis and rollback.
  bridges: []
- id: production-data-and-model-artifacts.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.production-data-and-model-artifacts
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Production AI needs versioned data transformations, feature definitions, model artifacts, and lineage;
    training-serving skew and inconsistent dependencies can break an otherwise valid model.
- id: production-data-and-model-artifacts.recap
  title: One idea to take with you
  type: recap
