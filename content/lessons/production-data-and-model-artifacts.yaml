schema_version: 0.2-draft
lesson:
  id: production-data-and-model-artifacts
  version: 0.3.0-draft
  title: Keep training and serving connected to the same definitions
  state: draft
  summary: A visitor was told a branch was open on a holiday. Which prompt, index, and model gave that answer? Learn to pack a release so you can always tell.
  slot: M33.2
  category: learning
  sources:
    - title: Hidden Technical Debt in Machine Learning Systems (Sculley et al., NeurIPS 2015)
      url: https://papers.nips.cc/paper/5656-hidden-technical-debt-in-machine-learning-systems
    - title: The ML Test Score (Breck et al., 2017)
      url: https://research.google/pubs/the-ml-test-score-a-rubric-for-ml-production-readiness-and-technical-debt-reduction/
    - title: Model Cards for Model Reporting (Mitchell et al., FAT* 2019)
      url: https://arxiv.org/abs/1810.03993
    - title: MLflow Model Registry documentation
      url: https://mlflow.org/docs/latest/ml/model-registry/
  archetype: mechanism
objectives:
  - id: objective.production-data-and-model-artifacts
    version: 3-draft
    statement: Version the model, prompt, data, index, and configuration together as one release, trace any answer back to it, and catch training-serving mismatches in what inputs mean.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - production-data-and-model-artifacts.base.v3
      - production-data-and-model-artifacts.transfer.v3
    prerequisites:
      - anyOf:
          - objective.ai-product-framing
      - anyOf:
          - objective.data-provenance
      - anyOf:
          - objective.splits-and-leakage
scenes:
  - id: production-data-and-model-artifacts.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.production-data-and-model-artifacts
    title: Which assistant answered on 12 March?
    markdown: |-
      On 12 March, Linden Library's assistant told a visitor the Eastside branch was open on a holiday. Sam, the team's engineer, wants to rerun that exact question. But since launch the team has changed the prompt, rebuilt the retrieval index, and switched models.

      :::predict The team has used 5 prompt versions, 4 builds of the index, and 2 models. How many combinations could have answered on 12 March?
      Up to 5 × 4 × 2 = 40, since each piece changed on its own schedule. Sam can't reproduce the bug until he knows which one.
      :::

      The model is only one piece. An **artifact** is any saved piece needed to run or check the system. A **release manifest** lists the exact version of every artifact that went live together, under one release name:

      | Artifact | Release r14 |
      | --- | --- |
      | Model | vendor-model-2026-02-15, a dated snapshot |
      | Prompt | v7 |
      | Retrieval index | built 10 March from the closures page |
      | Embedding model | e2 |
      | Config | temperature 0.2, top 5 chunks, 3 s timeout |
      | Evaluation | eval 41: 196 of 200 test questions right |

      Pin a dated model snapshot, not an alias like `latest` that the vendor can repoint. Log every answer with its release name, and the 40 candidates shrink to one.
    bridges: []
  - id: production-data-and-model-artifacts.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.production-data-and-model-artifacts
    title: Same model, different units
    markdown: |-
      The library's website also estimates "when will my hold arrive?" with a small model trained on past transfers between branches. It learned roughly *days = 1 + 0.05 × distance in km*, so a 2 km transfer takes about 1.1 days.

      In May, a new routing service starts sending distances in meters. The same 2 km trip now arrives as 2000, and the model predicts 1 + 0.05 × 2000 = 101 days. The model file didn't change; the meaning of its input did. This is **training-serving skew**: training and live prediction feed the model inconsistent data. Retraining won't fix it. Fixing the units will.
    bridges: []
  - id: production-data-and-model-artifacts.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.production-data-and-model-artifacts
    title: Write the input contract
    markdown: |-
      To prevent skew, write down what each input means and check it on both sides. A **data contract** records what each field must look like in training and in serving:

      | Field | Unit or values | If missing | Known when |
      | --- | --- | --- | --- |
      | distance | km, 0 to 60 | reject | when the hold is placed |
      | from_branch | one of 14 branches | reject | when the hold is placed |
      | day_placed | Mon to Sun | use today | when the hold is placed |

      A check at the serving boundary ("distance over 60? reject and alert") would have caught the meters bug on the first request.

      The last column stops a subtler bug. *Days until pickup* is recorded only after the hold arrives; as a training input it would leak the future (see "Protect the examples used to judge a model"). Training rows may use only what was known at prediction time.
    bridges: []
  - id: production-data-and-model-artifacts.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.production-data-and-model-artifacts
    title: Text tools must match too
    markdown: |-
      Language systems hide the same trap. A tokenizer maps text to ID numbers. If a new tokenizer maps ID 7 to "dog" where the model was trained on 7 meaning "cat," every file loads and the output is nonsense.

      Retrieval has its own version. The index stores document vectors made by embedding model e2. Switch the query side to e3, and every similarity compares numbers from two different vector spaces, as the dense retrieval lesson warned. The fix is to rebuild the index with e3 and ship both in the same release.

      So artifacts depend on each other: the index on its embedding model and source snapshot, the model on its tokenizer. Change one, and rebuild everything made from it.
    bridges: []
  - id: production-data-and-model-artifacts.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.production-data-and-model-artifacts
    markdown: A café's weather feed, a vendor's model alias, a hospital's mislabeled scans, and a city's pothole detector test whether you can trace and package a release.
    takeaway: "A release is the whole bundle: model, prompt, index, data, and config, pinned in one manifest with fingerprints and lineage. Log every answer with its release, and check that each input still means what it meant in training."
  - id: production-data-and-model-artifacts.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.production-data-and-model-artifacts
    markdown: |-
      Production AI needs versioned data transformations, feature definitions, model artifacts, and lineage; training-serving skew and inconsistent dependencies can break an otherwise valid model.
  - id: production-data-and-model-artifacts.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.production-data-and-model-artifacts
    title: Lineage, a trail you can query
    markdown: |-
      **Lineage** records what each artifact was made from. Suppose the 1 March closures snapshot had a typo, "Eastside: open 17 March." Which releases are affected? Lineage answers in one lookup: r12, r13, and r14 all used indexes built from that snapshot.

      A **model registry** is the catalog that stores these versions with their lineage and status (candidate, production, archived); MLflow's Model Registry is one widely used example. To make its records trustworthy, fingerprint each artifact with a **hash**, a short code computed from a file's contents that changes if even one character changes:

      ```python run
      import hashlib, json

      def fp(text):
          return hashlib.sha256(text.encode()).hexdigest()[:10]

      def manifest(prompt, index_text, config):
          parts = {
              "prompt": fp(prompt),
              "index": fp(index_text),
              "config": fp(json.dumps(config, sort_keys=True)),
          }
          parts["release"] = fp(json.dumps(parts, sort_keys=True))
          return parts

      prompt = "Answer questions about Linden Library hours. Cite the closures page."
      index_text = "Eastside: closed 17 March (holiday). Main: open 9 to 5."
      config = {"model": "vendor-model-2026-02-15", "temperature": 0.2, "chunks": 5}

      r14 = manifest(prompt, index_text, config)
      r15 = manifest(prompt.replace("Cite", "Always cite"), index_text, config)
      for part in r14:
          status = "same" if r14[part] == r15[part] else "CHANGED"
          print(f"{part:8} r14 {r14[part]}   r15 {r15[part]}   {status}")
      ```

      Only the prompt was edited, yet the release fingerprint changed too, so r15 can't be mistaken for r14. Try changing the temperature to 0.3 instead and see which lines change.

      :::mixup "Our code is in git, so everything is versioned."
      Git tracks code. It doesn't hold the closures page as it stood on 1 March, the index built from it, or which model a vendor alias pointed at that day. Snapshot and fingerprint those too.
      :::
    bridges: []
    diagram:
      caption: Lineage for release r14. Every arrow is a recorded "made from" link.
      description: The closures page snapshot from 1 March and embedding model e2 both feed the retrieval index built on 10 March. The index, prompt v7, and the dated model snapshot all feed release r14, whose manifest holds their fingerprints. Release r14 is tested by evaluation report 41 and serves live answers, each logged with the release name.
      nodes:
        - id: snap
          label: Closures page snapshot
          note: 1 March
          col: 0
          row: 0
          tone: data
        - id: embed
          label: Embedding model e2
          col: 0
          row: 1
        - id: index
          label: Retrieval index
          note: built 10 March
          col: 1
          row: 0
          tone: data
        - id: prompt
          label: Prompt v7
          col: 1
          row: 1
        - id: model
          label: Model snapshot
          note: 2026-02-15
          col: 1
          row: 2
        - id: release
          label: Release r14
          note: manifest of fingerprints
          col: 2
          row: 1
          tone: accent
        - id: live
          label: Live answers
          note: each logged with r14
          col: 3
          row: 0
        - id: eval
          label: Eval report 41
          note: 196 of 200 right
          col: 3
          row: 2
          tone: muted
      edges:
        - from: snap
          to: index
          label: chunked
        - from: embed
          to: index
          label: embedded
        - from: index
          to: release
        - from: prompt
          to: release
        - from: model
          to: release
        - from: release
          to: live
          label: serves
        - from: release
          to: eval
          label: tested by
  - id: production-data-and-model-artifacts.card
    title: Ship a model card with it
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.production-data-and-model-artifacts
    markdown: |-
      The manifest tells engineers what went live. A **model card** tells everyone else what it's for. Mitchell et al. (2019) proposed this short document covering a model's intended use, uses it isn't meant for, how it was evaluated, and results broken down by groups and conditions. Linden's card for r14:

      | | |
      | --- | --- |
      | Intended use | Visitors' hours and closures questions, answered from the closures page |
      | Not for | Holds, fines, or anything needing a visitor's account |
      | Evaluation | 196 of 200 test questions right; holiday questions 38 of 40 |
      | Known weakness | Only as current as the closures page |
      | Release | r14, eval report 41 |

      A new staff member can read it in a minute and know what the assistant should and shouldn't be asked.
  - id: production-data-and-model-artifacts.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.production-data-and-model-artifacts
    title: Rebuild it before you trust it
    markdown: |-
      A **reproducible build** means anyone can recreate a release from its manifest and get the same artifacts. Sam tests it: he rebuilds r14's index from the 1 March snapshot, checks that its fingerprint matches, and replays the 200 test questions. Hosted models can word answers slightly differently even at temperature 0, so he compares the facts given (the hours and the cited page), not the exact wording.

      The same replay guards every change. Before r15 replaces r14, run the test questions through both and read every answer that changed. Keep r14's manifest ready: the next lesson rolls releases back, and you can only roll back to something you can rebuild.
    bridges: []
  - id: production-data-and-model-artifacts.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.production-data-and-model-artifacts
    title: Find the broken contract
    markdown: |-
      Training represents two kilometers as 2. Serving represents the same trip as 2000. What should be checked first?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: The unit conversion at the input boundary.
        - id: b
          text: Whether the model needs more layers.
        - id: c
          text: Whether the test set should contain more trips.
      answer: a
      reveal_markdown: "The number changed meaning, not the model's skill: 2 in kilometers became 2000 in meters. Fix and test the unit at the input boundary first. More layers or more test trips would only train around a broken contract."
      hint: Before touching the model, compare what the input meant in training with what it means now.
      id: production-data-and-model-artifacts.practice.v2.7
