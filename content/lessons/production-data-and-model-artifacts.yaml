assessment_families:
  - id: production-data-and-model-artifacts.base
    objective_ref: objective.production-data-and-model-artifacts
    task: base
    response_type: single_choice
    points: 1
    hint: 'Prevent training-serving skew: trace the inputs, operation, and result before choosing.'
    remediation_scene: production-data-and-model-artifacts.s2
    variants:
      - id: production-data-and-model-artifacts.base.1
        prompt: Why version preprocessing with weights?
        options:
          - id: a
            text: It determines the input representation the model expects
          - id: b
            text: Only model file size matters
          - id: c
            text: Preprocessing never affects predictions
        answer: a
        feedback: The artifact set defines behavior.
        retired: true
      - id: production-data-and-model-artifacts.base.2
        prompt: Using a future event in a historical feature creates what?
        options:
          - id: b
            text: Perfect real-time prediction
          - id: c
            text: Only a storage optimization
          - id: a
            text: Temporal leakage
        answer: a
        feedback: Training must respect information available at prediction time.
        retired: true
  - id: production-data-and-model-artifacts.transfer
    objective_ref: objective.production-data-and-model-artifacts
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Test updates across dependencies: trace the inputs, operation, and result before choosing.'
    remediation_scene: production-data-and-model-artifacts.s4
    variants:
      - id: production-data-and-model-artifacts.transfer.1
        prompt: Does a registry entry certify model quality?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if it has a version number
          - id: a
            text: 'No'
        answer: a
        feedback: Quality requires evidence and release criteria.
        retired: true
      - id: production-data-and-model-artifacts.transfer.2
        prompt: What can an encoder change invalidate?
        options:
          - id: c
            text: No existing artifact ever
          - id: a
            text: Stored embeddings and dependent caches
          - id: b
            text: Only the product logo
        answer: a
        feedback: Representation compatibility must be preserved or rebuilt.
        retired: true
  - id: production-data-and-model-artifacts.base.v2
    objective_ref: objective.production-data-and-model-artifacts
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: production-data-and-model-artifacts.s3
    variants:
      - prompt: What is a release manifest for?
        answer: a
        options:
          - id: c
            text: Replacing evaluation with a version label
          - id: b
            text: Summarizing only the model’s architecture name
          - id: a
            text: Identifying the exact artifacts used together
        feedback: A manifest names the parts of a reproducible system.
        id: production-data-and-model-artifacts.base.v2.1
        retired: true
      - prompt: Training and serving give different meanings to the same input field. What is the issue?
        answer: a
        options:
          - id: a
            text: Training-serving skew
          - id: c
            text: A larger context window
          - id: b
            text: Ordinary sampling variation in outputs
        feedback: The input contract differs between stages.
        id: production-data-and-model-artifacts.base.v2.2
        retired: true
      - prompt: A tokenizer changes ID meanings but the weights stay fixed. What needs checking?
        answer: a
        options:
          - id: b
            text: Only whether the tokenizer file loads
          - id: a
            text: Compatibility with the learned token interfaces
          - id: c
            text: Only whether the vocabulary has the same size
        feedback: Equal sizes do not imply equal ID meanings.
        id: production-data-and-model-artifacts.base.v2.3
        retired: true
      - prompt: What does artifact lineage record?
        answer: a
        options:
          - id: b
            text: Only its latest public name
          - id: c
            text: Only its evaluation score
          - id: a
            text: Sources and transformations that produced an artifact
        feedback: Lineage connects a result to its production history.
        id: production-data-and-model-artifacts.base.v2.4
        retired: true
  - id: production-data-and-model-artifacts.transfer.v2
    objective_ref: objective.production-data-and-model-artifacts
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: production-data-and-model-artifacts.s3
    variants:
      - prompt: A historical prediction uses a field recorded only after its outcome. What is wrong?
        answer: a
        options:
          - id: a
            text: Information from the future leaked into the example
          - id: b
            text: The training set is too small to be reproducible
          - id: c
            text: The output was sampled rather than chosen greedily
        feedback: Inputs must respect what was available at prediction time.
        id: production-data-and-model-artifacts.transfer.v2.1
        retired: true
      - prompt: Answers changed after a prompt update with identical weights. What must the release record include?
        answer: a
        options:
          - id: a
            text: The prompt version and its evaluation
          - id: c
            text: Only the number of generated tokens
          - id: b
            text: Only the unchanged weight checksum
        feedback: Behavior depends on configuration as well as weights.
        id: production-data-and-model-artifacts.transfer.v2.2
        retired: true
      - prompt: A new encoder changes stored-vector meaning. What should happen before switching search to it?
        answer: a
        options:
          - id: c
            text: Keep the index name fixed to preserve compatibility
          - id: a
            text: Check compatibility and rebuild dependent vectors where needed
          - id: b
            text: Use new query vectors against old vectors without testing
        feedback: A label does not preserve a changed representation contract.
        id: production-data-and-model-artifacts.transfer.v2.3
        retired: true
      - prompt: A model appears in a registry. What additional evidence is needed for release?
        answer: a
        options:
          - id: b
            text: Its registry status without the underlying evaluation evidence
          - id: c
            text: Only the date when it was uploaded
          - id: a
            text: Tests of its actual compatible operating setup
        feedback: Registration records identity, not quality.
        id: production-data-and-model-artifacts.transfer.v2.4
        retired: true
  - id: production-data-and-model-artifacts.base.v3
    objective_ref: objective.production-data-and-model-artifacts
    task: base
    response_type: single_choice
    points: 1
    hint: Ask which artifacts had to change together, and whether each input still means what it meant in training.
    remediation_scene: production-data-and-model-artifacts.s1
    variants:
      - id: production-data-and-model-artifacts.base.v3.1
        prompt: Since launch, a team has used 4 prompt versions, 3 index builds, and 2 models, each changed independently. Its logs carry no release name. How many combinations could have produced last Tuesday's bad answer?
        options:
          - id: b
            text: 9, one for each version of any piece
          - id: a
            text: 24, one for each prompt, index, and model mix
          - id: c
            text: 6, one for each change made since launch
        answer: a
        feedback: Independent choices multiply, 4 × 3 × 2 = 24. Adding them (9) counts the versions but not the ways they can be combined, which is why a release name on every logged answer is so valuable.
      - id: production-data-and-model-artifacts.base.v3.2
        prompt: What does a release manifest let a team do that the model file alone can't?
        options:
          - id: c
            text: Show that the release passed its evaluation, since it is listed there
          - id: b
            text: Make the model give identical wording each time it answers
          - id: a
            text: Recreate the exact prompt, index, model, and config behind an answer
        answer: a
        feedback: The manifest names every artifact that went live together, so the exact setup can be rebuilt. Being listed says what shipped, not that it passed; and pinning versions doesn't make a hosted model's wording identical.
      - id: production-data-and-model-artifacts.base.v3.3
        prompt: A team upgrades its query encoder from embedding model e2 to e3 but keeps the index built with e2. Search results become nearly random. Why?
        options:
          - id: a
            text: Query and document vectors now come from different vector spaces
          - id: b
            text: Model e3 must be weaker than e2 on this library's documents
          - id: c
            text: The index needs more chunks per query to suit the new encoder
        answer: a
        feedback: Similarity only means something when both vectors come from the same encoder. The index depends on e2, so it must be rebuilt with e3 and shipped together. Blaming e3's quality misses the mismatch.
      - id: production-data-and-model-artifacts.base.v3.4
        prompt: A training table for a hold-arrival model includes "days until pickup," which is recorded after the book arrives. What is wrong with using it as an input?
        options:
          - id: b
            text: It uses days while distance uses kilometers, so the units clash
          - id: a
            text: It isn't known at prediction time, so it leaks the future
          - id: c
            text: It's missing for holds not yet collected, so rows are lost
        answer: a
        feedback: The contract's "known when" column exists for this. A field recorded after the outcome makes training look better than serving can ever be. Different units across fields are normal, and missing rows are a smaller problem than leaked answers.
  - id: production-data-and-model-artifacts.transfer.v3
    objective_ref: objective.production-data-and-model-artifacts
    task: transfer
    response_type: single_choice
    points: 1
    hint: Find the artifact whose meaning or version changed while the model file stayed the same, then name the record or check that would have caught it.
    remediation_scene: production-data-and-model-artifacts.s3
    variants:
      - id: production-data-and-model-artifacts.transfer.v3.1
        prompt: A café's demand model was trained with temperature in °C. A new weather feed sends °F, and on a mild 20 °C day the model predicts record sales. What would have caught this on day one?
        options:
          - id: c
            text: Retraining each week on the newest data from the weather feed
          - id: a
            text: A contract check on the temperature field's unit and range
          - id: b
            text: A larger model that depends less heavily on temperature
        answer: a
        feedback: A serving-side check ("temperature above 45? reject and alert") flags the unit change at once. Retraining on the new feed would learn around the bug and mix two units in the training data.
      - id: production-data-and-model-artifacts.transfer.v3.2
        prompt: A support bot calls its model by the alias "latest." One morning its answer format changes, though nobody deployed anything. What should the release have pinned?
        options:
          - id: a
            text: A dated model snapshot, not an alias the vendor can repoint
          - id: b
            text: The prompt text, because prompts slowly drift over time
          - id: c
            text: The temperature, since sampling explains format changes
        answer: a
        feedback: An alias can move to a new model without any change on your side, so the release silently changed. Prompts and temperature matter too, but neither changed here; the model behind the alias did.
      - id: production-data-and-model-artifacts.transfer.v3.3
        prompt: A hospital finds that a batch of training scans from June was mislabeled. Which record tells it which deployed models are affected?
        options:
          - id: b
            text: The registry's list of models now in production and their status
          - id: c
            text: The evaluation report for the current production model
          - id: a
            text: Lineage linking each model to the data snapshots it was trained on
        answer: a
        feedback: Lineage records what each model was made from, so one lookup finds every model built from the June batch. A list of production models says what is live, not what data went into it, and an evaluation report may never mention its training data.
      - id: production-data-and-model-artifacts.transfer.v3.4
        prompt: A city buys a pothole detector trained only on daytime photos of dry roads. Where should that limit be written so buyers and operators see it?
        options:
          - id: c
            text: In the training code comments that produced the model
          - id: b
            text: In the release manifest beside the weights fingerprint
          - id: a
            text: In the model card's intended use and evaluation section
        answer: a
        feedback: A model card exists to tell people outside the engineering team what the model is for and how it was tested. The manifest pins versions for engineers, and code comments never reach the people deciding where to use it.
