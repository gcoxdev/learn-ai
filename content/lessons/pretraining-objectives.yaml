schema_version: 0.2-draft
lesson:
  id: pretraining-objectives
  version: 0.1.0-draft
  title: Choose what a pretraining prediction means
  state: draft
  summary: Autoregressive, masked, denoising, and multi-token objectives expose different information and targets;
    the loss and mask must implement the chosen task.
  slot: M16.5
  category: learning
  minutes: 12
  sources:
  - title: Attention Is All You Need
    url: https://arxiv.org/abs/1706.03762
  - title: BERT
    url: https://arxiv.org/abs/1810.04805
  - title: DeepSeek-V3 Technical Report
    url: https://arxiv.org/abs/2412.19437
objectives:
- id: objective.pretraining-objectives
  version: 1-draft
  statement: Autoregressive, masked, denoising, and multi-token objectives expose different information and targets;
    the loss and mask must implement the chosen task.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - pretraining-objectives.base
  - pretraining-objectives.transfer
  prerequisites:
  - anyOf:
    - objective.packing-and-masking
  - anyOf:
