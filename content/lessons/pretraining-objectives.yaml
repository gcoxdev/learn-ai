schema_version: 0.2-draft
lesson:
  id: pretraining-objectives
  version: 0.4.0-draft
  title: Choose what a pretraining prediction means
  state: draft
  summary: GPT guesses the next word, BERT fills in blanks, and T5 rebuilds missing phrases. Work out Kestrel's loss by hand and see why one game won.
  slot: M16.5
  category: learning
  sources:
    - title: 'Devlin et al. — BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding (2018)'
      url: https://arxiv.org/abs/1810.04805
    - title: Raffel et al. — Exploring the Limits of Transfer Learning with a Unified Text-to-Text Transformer (T5, 2019)
      url: https://arxiv.org/abs/1910.10683
    - title: Brown et al. — Language Models are Few-Shot Learners (GPT-3, 2020)
      url: https://arxiv.org/abs/2005.14165
    - title: Biderman et al. — Pythia, a suite for analyzing language-model training
      url: https://arxiv.org/abs/2304.01373
  archetype: mechanism
objectives:
  - id: objective.pretraining-objectives
    version: 3-draft
    statement: Trace causal next-token targets and distinguish them from masked-token and reconstruction objectives, including loss masking and reduction.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - pretraining-objectives.base.v3
      - pretraining-objectives.transfer.v3
      - pretraining-objectives.calculate
    prerequisites:
      - anyOf:
          - objective.packing-and-masking
      - anyOf:
          - objective.next-token
scenes:
  - id: pretraining-objectives.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.pretraining-objectives
    title: Three guessing games on the same sentence
    markdown: |-
      Nobody labels pretraining data. The text itself supplies the answers: hide part of it and ask the model to guess. How you hide it is the **training objective**, and the three famous choices look like this:

      | Objective | Used by | The model sees | It must produce |
      | --- | --- | --- | --- |
      | **Causal language modeling** | GPT family, Llama, Kestrel | "the kestrel hovers" | "over" (the next token) |
      | **Masked language modeling** | BERT (2018) | "the kestrel [MASK] over the field" | "hovers" |
      | **Span corruption** | T5 (2019) | "the kestrel ⟨X⟩ the field" | "⟨X⟩ hovers over ⟨Y⟩" |

      The first uses only the words before the gap. The second and third use words on both sides. That difference decides what the model is good at afterwards: a causal model is already a text generator, while BERT learned rich representations for reading, but can't write a paragraph one token at a time.
    bridges: []
  - id: pretraining-objectives.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.pretraining-objectives
    title: Every position is a test question
    markdown: |-
      In causal language modeling, one sentence contains many questions. For "the kestrel hovers over the field":

      - given "the", predict "kestrel"
      - given "the kestrel", predict "hovers"
      - … and so on, until given "the kestrel hovers over the", predict "field"

      Six tokens give five questions, and the causal mask from the packing lesson lets all five be answered in one parallel pass. During training the context always holds the *true* earlier tokens, a setup called **teacher forcing**. When the model generates, the context holds its *own* earlier choices instead, so one early mistake can steer everything after it.
    bridges: []
  - id: pretraining-objectives.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.pretraining-objectives
    title: Score each guess with −ln p, then average
    markdown: |-
      For each question, the model outputs a probability for every token in its vocabulary. The loss looks only at the probability $p$ it gave the *correct* next token and charges $-\ln p$: nearly 0 when $p$ is close to 1, and large when $p$ is small. Here are Kestrel's five scores midway through training:

      ```python run
      import math

      text = ["the", "kestrel", "hovers", "over", "the", "field"]
      p_next = [0.02, 0.30, 0.60, 0.70, 0.10]   # model's probability for each actual next token

      losses = [-math.log(p) for p in p_next]
      for i, (p, loss) in enumerate(zip(p_next, losses), start=1):
          context = " ".join(text[:i])
          print(f"{context:>27} -> {text[i]:8s} p = {p:.2f}   -ln p = {loss:.3f}")

      mean = sum(losses) / len(losses)
      print(f"mean loss  = {mean:.3f}")
      print(f"perplexity = e^{mean:.3f} = {math.exp(mean):.2f}")
      print(f"untrained model (uniform over 50,304): loss {math.log(50_304):.2f}, perplexity 50,304")
      ```

      The five losses sum to 8.287, so the mean is 1.657. The hardest guess, "kestrel" after "the", costs the most (3.912): almost any noun could follow "the". Try raising that 0.02 to 0.2 and watch the mean fall.

      :::papers The causal language modeling loss
      $$\mathcal{L} = -\frac{1}{T}\sum_{t=1}^{T} \ln p_\theta\big(x_t \mid x_{<t}\big), \qquad \text{perplexity} = e^{\mathcal{L}}$$

      $x_t$ is the token at position $t$, $x_{<t}$ is everything before it, and $p_\theta$ is the model's predicted probability with weights $\theta$. Here $T = 5$ scored targets and $\mathcal{L} = 8.287 / 5 = 1.657$. This is the **cross-entropy** between the text and the model's predictions, averaged per token.
      :::
    bridges:
      - powers-logs
  - id: pretraining-objectives.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.pretraining-objectives
    title: Perplexity is the number of choices you're torn between
    markdown: |-
      **Perplexity**, $e^{\mathcal{L}}$, which you met in the lesson on next-token prediction, turns the loss into something you can picture. Kestrel's 1.657 gives $e^{1.657} \approx 5.24$: on average, the model is as unsure as if it were choosing evenly among about 5 tokens. An untrained Kestrel spreads probability evenly over all 50,304 tokens, so its loss is $\ln 50{,}304 \approx 10.83$ and its perplexity is 50,304.

      :::predict Kestrel's validation loss falls from 3.0 to 2.7. What happens to its perplexity?
      $e^{3.0} \approx 20.1$ and $e^{2.7} \approx 14.9$. A drop of 0.3 in loss cuts the effective number of choices by about a quarter. Late in training, small loss improvements are big ones.
      :::

      :::mixup "Model A has perplexity 12 and model B has 18, so A is the better model."
      Only if they use the same tokenizer on the same text. Perplexity is *per token*. A tokenizer with bigger tokens has fewer, harder guesses per sentence, so its perplexity is higher even when it predicts the text just as well. To compare across tokenizers, divide the total loss by the number of bytes of text instead; measured in bits, that's **bits per byte**.
      :::

      Keep in mind what the number measures: how well the model predicts text like its validation set. It doesn't directly tell you whether the model's facts are true or whether it follows instructions.
    bridges: []
  - id: pretraining-objectives.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.pretraining-objectives
    title: How BERT and T5 hide their answers
    markdown: |-
      **Masked language modeling** (BERT, 2018) picks 15% of the tokens in each sequence as prediction targets. Of those, 80% are replaced by [MASK], 10% by a random token, and 10% are left unchanged, so the model can't just learn to wait for the [MASK] symbol, which never appears in real inputs. The loss is the same $-\ln p$, averaged over the chosen 15% only.

      **Span corruption** (T5, 2019) drops out 15% of the tokens, in spans averaging 3 tokens. Each span becomes one sentinel token, and the target lists the missing spans. The T5 paper's own example:

      - original: "Thank you for inviting me to your party last week."
      - input: "Thank you ⟨X⟩ me to your party ⟨Y⟩ week."
      - target: "⟨X⟩ for inviting ⟨Y⟩ last ⟨Z⟩"

      :::predict In a 2,048-token sequence, how many positions does each objective score?
      Causal: 2,047, every position but the last. BERT: about 15%, roughly 307. From the same text, the causal model gets nearly seven times as many graded answers per pass.
      :::

      That efficiency, plus the ability to generate text directly, is a big part of why GPT-3 (2020) and most large language models since use the causal objective.
    bridges: []
  - id: pretraining-objectives.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.pretraining-objectives
    title: Divide by the targets you scored
    markdown: |-
      The average in the loss is over *scored* targets, the ones the loss mask from the packing lesson kept. Suppose a batch has two scored targets with losses 1 and 3, and one padding slot. The mean is $(1 + 3)/2 = 2$. Dividing by 3 would report 1.33, and a batch with more padding would look better for no reason.

      Whenever you meet a new objective, ask three questions: what can the model see, what must it predict, and how is each prediction scored and averaged? Those three answers tell you what the model will be good at, and which loss numbers can be compared.
    bridges: []
  - id: pretraining-objectives.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.pretraining-objectives
    markdown: Perplexities to compute from losses, plus a code-infilling tool, two tokenizers, and a masked model with a suspiciously low loss, test whether you can read an objective and its numbers.
    takeaway: |-
      Causal pretraining scores every position with −ln p of the true next token and averages; perplexity is e raised to that average. BERT and T5 hide tokens in the middle instead, see both sides, and score fewer positions.
  - id: pretraining-objectives.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.pretraining-objectives
    markdown: |-
      Ask three questions about a training objective: what can the model see, what must it predict, and how is that prediction scored?
  - id: pretraining-objectives.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.pretraining-objectives
    title: Which denominator belongs here?
    markdown: |-
      Three positions have loss terms 1, 3, and a masked-out padding term. What is the mean over the two included targets?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: '2'
        - id: b
          text: 4/3
        - id: c
          text: '4'
      answer: a
      reveal_markdown: "Only the two scored targets count: (1 + 3) / 2 = 2. Dividing by 3 would let the padding slot drag the average down to 4/3."
      hint: Add the losses of the scored targets, then divide by how many targets were scored, not by how many slots the row has.
      id: pretraining-objectives.practice.v2.7
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - pretraining-objectives.s1
        - pretraining-objectives.s2
        - pretraining-objectives.s3
        - pretraining-objectives.s4
        - pretraining-objectives.s5
        - pretraining-objectives.s6
        - pretraining-objectives.s7
        - pretraining-objectives.check
      gate_refs:
        - gate.core
  scene_aliases:
    pretraining-objectives.recap: pretraining-objectives.check
assessment_families:
  - id: pretraining-objectives.base
    objective_ref: objective.pretraining-objectives
    task: base
    response_type: single_choice
    points: 1
    hint: 'Recover hidden information: trace the inputs, operation, and result before choosing.'
    remediation_scene: pretraining-objectives.s2
    variants:
      - id: pretraining-objectives.base.1
        prompt: A masked token can attend to later unmasked words. Is that necessarily leakage?
        options:
          - id: c
            text: No mask is needed for any task
          - id: a
            text: No, if bidirectional context is part of the defined task
          - id: b
            text: Yes, every language task must be causal
        answer: a
        feedback: Leakage depends on the intended information boundary.
        retired: true
      - id: pretraining-objectives.base.2
        prompt: What does the 0.2 coefficient in L_next + 0.2 L_aux do?
        options:
          - id: a
            text: Weights the auxiliary loss contribution
          - id: b
            text: Keeps exactly 20 percent of tokens
          - id: c
            text: Sets vocabulary size
        answer: a
        feedback: The coefficient controls a loss term’s relative contribution.
        retired: true
  - id: pretraining-objectives.transfer
    objective_ref: objective.pretraining-objectives
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Audit input and supervision together: trace the inputs, operation, and result before choosing.'
    remediation_scene: pretraining-objectives.s4
    variants:
      - id: pretraining-objectives.transfer.1
        prompt: Does a multi-token training objective alone prove faster decoding?
        options:
          - id: a
            text: No, inference needs a compatible algorithm and measurement
          - id: b
            text: Yes, training targets directly equal runtime speed
          - id: c
            text: Only if the corpus is English
        answer: a
        feedback: Training supervision and decoding execution are separate choices.
        retired: true
      - id: pretraining-objectives.transfer.2
        prompt: Two objectives predict different units. How should their raw losses be compared?
        options:
          - id: b
            text: As automatically equivalent quality scores
          - id: c
            text: By choosing the smaller number alone
          - id: a
            text: With their definitions and normalization made explicit
        answer: a
        feedback: Loss scale depends on prediction task and normalization.
        retired: true
  - id: pretraining-objectives.base.v2
    objective_ref: objective.pretraining-objectives
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: pretraining-objectives.s3
    variants:
      - prompt: A causal model predicts the third token. Which information is allowed in the stated next-token setup?
        answer: a
        options:
          - id: a
            text: The first two tokens
          - id: c
            text: Every later token in the same sentence
          - id: b
            text: The third token itself as visible future evidence
        feedback: The target must not be available through a future-information route.
        id: pretraining-objectives.base.v2.1
        retired: true
      - prompt: What does masked-token prediction change relative to causal next-token prediction?
        answer: a
        options:
          - id: b
            text: It removes the need to specify targets
          - id: a
            text: It may expose context on both sides of the missing token
          - id: c
            text: It requires the target token to remain visible
        feedback: Masked objectives can use surrounding context unavailable in a causal prefix.
        id: pretraining-objectives.base.v2.2
        retired: true
      - prompt: A target’s probability increases from 0.2 to 0.4. What happens to −ln(p)?
        answer: a
        options:
          - id: b
            text: It doubles
          - id: a
            text: It decreases
          - id: c
            text: It becomes the target’s token ID
        feedback: The negative logarithm decreases as a positive probability increases.
        id: pretraining-objectives.base.v2.3
        retired: true
      - prompt: Two models use different tokenizers. Why compare token-loss numbers cautiously?
        answer: a
        options:
          - id: c
            text: A larger vocabulary always has lower loss
          - id: b
            text: Logarithms cannot be computed for different vocabularies
          - id: a
            text: Their prediction units and sequence decompositions differ
        feedback: Token units affect the interpretation and comparability of averaged losses.
        id: pretraining-objectives.base.v2.4
        retired: true
  - id: pretraining-objectives.transfer.v2
    objective_ref: objective.pretraining-objectives
    task: transfer
    response_type: numeric_fields_with_reason
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: pretraining-objectives.s3
    variants:
      - prompt: Included loss terms sum to 6 across 3 scored targets; 2 extra padding positions are excluded. Record the denominator and mean scored-target loss.
        answers:
          count: 3
          mean: 2.0
        reason_answer: a
        reason_options:
          - id: a
            text: Average over included targets rather than all stored positions.
          - id: c
            text: Divide by the number of padding positions.
          - id: b
            text: Include excluded padding in the denominator.
        feedback: Use the explicitly scored targets for both the summed loss and its denominator.
        id: pretraining-objectives.transfer.v2.1
        retired: true
      - prompt: Included loss terms sum to 10 across 5 scored targets; 3 extra padding positions are excluded. Record the denominator and mean scored-target loss.
        answers:
          count: 5
          mean: 2.0
        reason_answer: a
        reason_options:
          - id: b
            text: Include excluded padding in the denominator.
          - id: c
            text: Divide by the number of padding positions.
          - id: a
            text: Average over included targets rather than all stored positions.
        feedback: Use the explicitly scored targets for both the summed loss and its denominator.
        id: pretraining-objectives.transfer.v2.2
        retired: true
      - prompt: Included loss terms sum to 8 across 4 scored targets; 1 extra padding positions are excluded. Record the denominator and mean scored-target loss.
        answers:
          count: 4
          mean: 2.0
        reason_answer: a
        reason_options:
          - id: c
            text: Divide by the number of padding positions.
          - id: b
            text: Include excluded padding in the denominator.
          - id: a
            text: Average over included targets rather than all stored positions.
        feedback: Use the explicitly scored targets for both the summed loss and its denominator.
        id: pretraining-objectives.transfer.v2.3
        retired: true
      - prompt: Included loss terms sum to 3 across 2 scored targets; 4 extra padding positions are excluded. Record the denominator and mean scored-target loss.
        answers:
          count: 2
          mean: 1.5
        reason_answer: a
        reason_options:
          - id: c
            text: Divide by the number of padding positions.
          - id: a
            text: Average over included targets rather than all stored positions.
          - id: b
            text: Include excluded padding in the denominator.
        feedback: Use the explicitly scored targets for both the summed loss and its denominator.
        id: pretraining-objectives.transfer.v2.4
        retired: true
    numeric_fields:
      - id: count
        label: Scored-target denominator
      - id: mean
        label: Mean loss
    absolute_tolerance: 1e-6
  - id: pretraining-objectives.base.v3
    objective_ref: objective.pretraining-objectives
    task: base
    response_type: single_choice
    points: 1
    hint: For each objective, ask what the model can see (only earlier tokens, or both sides) and which positions are scored. The loss at each scored position is −ln p of the right answer.
    remediation_scene: pretraining-objectives.s3
    variants:
      - id: pretraining-objectives.base.v3.1
        prompt: A causal language model is predicting the 4th token of a sentence during training. Which tokens may it use?
        options:
          - id: b
            text: Tokens 1–3 and 5 onward, everything except the 4th itself
          - id: a
            text: Tokens 1–3, the true earlier tokens from the text
          - id: c
            text: Token 3 alone, since each guess depends on the last token
        answer: a
        feedback: The causal mask allows every earlier position and nothing later. Using both sides is what BERT's masked objective does. A transformer attends to the whole prefix, not just the last token.
      - id: pretraining-objectives.base.v3.2
        prompt: The model's probability for the correct next token rises from 0.1 to 0.2. How does the loss at that position change?
        options:
          - id: c
            text: It falls by 0.1, the same amount the probability rose
          - id: b
            text: It halves, since the probability doubled
          - id: a
            text: It falls by ln 2 ≈ 0.69, from about 2.30 to about 1.61
        answer: a
        feedback: −ln 0.1 ≈ 2.303 and −ln 0.2 ≈ 1.609, so the loss drops by ln 2. Doubling p always subtracts ln 2 from the loss, whatever p started at; it doesn't halve the loss or move it by the change in p.
      - id: pretraining-objectives.base.v3.3
        prompt: Why does BERT replace only 80% of its chosen tokens with [MASK], leaving 10% unchanged and swapping 10% for random tokens?
        options:
          - id: a
            text: '[MASK] never appears in real inputs, so the model must handle ordinary tokens too'
          - id: b
            text: Fewer [MASK] symbols make the loss lower, which speeds up training
          - id: c
            text: Random swaps let the model see more of each sentence at once
        answer: a
        feedback: If only [MASK] positions were ever predicted, the model could learn to do useful work only where [MASK] appears, and fine-tuning inputs contain none. A lower loss isn't the goal, and the model sees the whole sentence either way.
      - id: pretraining-objectives.base.v3.4
        prompt: 'In T5-style span corruption, the original is "The kestrel hovers over the open field at dawn." and the input is "The kestrel ⟨X⟩ the open field at ⟨Y⟩." What is the target?'
        options:
          - id: b
            text: '"The kestrel hovers over the open field at dawn."'
          - id: a
            text: '"⟨X⟩ hovers over ⟨Y⟩ dawn ⟨Z⟩"'
          - id: c
            text: '"hovers over dawn"'
        answer: a
        feedback: The target lists only the missing spans, each introduced by its sentinel, plus a final sentinel. Rewriting the whole sentence wastes computation, and without sentinels the model couldn't tell which gap each span fills.
  - id: pretraining-objectives.transfer.v3
    objective_ref: objective.pretraining-objectives
    task: transfer
    response_type: single_choice
    points: 1
    hint: Before comparing or choosing, check that the objectives, tokenizers, and scored positions match. A loss number only means something next to its setup.
    remediation_scene: pretraining-objectives.s4
    variants:
      - id: pretraining-objectives.transfer.v3.1
        prompt: Model A reports perplexity 12 and model B reports 18 on the same book, but they use different tokenizers. What can you conclude?
        options:
          - id: c
            text: A is better, since lower perplexity means fewer effective choices
          - id: a
            text: Nothing yet; compare loss per byte or character instead
          - id: b
            text: B is better, since its tokenizer must use bigger tokens
        answer: a
        feedback: Perplexity is per token, and the two models split the text into different numbers of tokens. Normalizing by bytes or characters puts both on the same scale. Token size alone doesn't tell you which model predicts better.
      - id: pretraining-objectives.transfer.v3.2
        prompt: A code editor needs a model that fills in missing lines in the middle of a file, using the code both above and below. Which pretraining game fits best?
        options:
          - id: a
            text: Span corruption, where spans are rebuilt using text on both sides
          - id: b
            text: Plain causal modeling, which reads the file from top to bottom
          - id: c
            text: Masked modeling with each missing token predicted on its own
        answer: a
        feedback: Filling a multi-token gap from both sides is exactly the span task. A plain causal model can't see the code below the gap, and predicting masked tokens independently struggles with gaps of unknown length.
      - id: pretraining-objectives.transfer.v3.3
        prompt: A masked (BERT-style) model reports a loss of 1.8 on some text, and a causal model reports 2.6 on the same text. Which will write better paragraphs?
        options:
          - id: b
            text: The masked model, because its loss is lower on the same text
          - id: c
            text: The causal model, because a higher loss shows it learned more
          - id: a
            text: The losses can't decide it, since the two games differ in difficulty
        answer: a
        feedback: Guessing a word with both sides visible is easier than guessing the next word, so masked losses run lower. A higher loss isn't a sign of learning either. The causal model can generate directly, but that comes from its objective, not its loss number.
      - id: pretraining-objectives.transfer.v3.4
        prompt: A team's validation loss improves from 2.9 to 2.6, but its score on a factual quiz barely moves. What is the best explanation?
        options:
          - id: c
            text: The validation loss must have been computed incorrectly
          - id: b
            text: Lower loss means higher perplexity, so the model got worse
          - id: a
            text: The loss averages over all tokens, and most aren't facts
        answer: a
        feedback: Loss rewards predicting every token, including grammar and common phrasing, so it can improve without the model learning particular facts. Lower loss means lower perplexity, not higher, and nothing here suggests a bug.
  - id: pretraining-objectives.calculate
    objective_ref: objective.pretraining-objectives
    task: base
    response_type: numeric
    points: 1
    hint: Perplexity is e raised to the mean loss. If you're given probabilities, first average −ln p over the targets.
    remediation_scene: pretraining-objectives.s4
    absolute_tolerance: 0.05
    variants:
      - id: pretraining-objectives.calculate.1
        prompt: A model's mean next-token loss on a validation set is 2.0 (natural log). What is its perplexity?
        answer: 7.39
        feedback: e^2.0 ≈ 7.39. The model is about as unsure as choosing evenly among 7 or 8 tokens.
      - id: pretraining-objectives.calculate.2
        prompt: A model's mean next-token loss is 1.5 (natural log). What is its perplexity?
        answer: 4.48
        feedback: e^1.5 ≈ 4.48.
      - id: pretraining-objectives.calculate.3
        prompt: A model gives the correct next token probabilities 0.5, 0.25, and 0.125 at three positions. What is its perplexity on these three targets?
        answer: 4
        feedback: The losses are ln 2, ln 4, and ln 8 (0.693, 1.386, 2.079), with mean 1.386 = ln 4. So the perplexity is e^1.386 = 4.
      - id: pretraining-objectives.calculate.4
        prompt: A model's mean loss is 3.0 (natural log). What is its perplexity?
        answer: 20.09
        feedback: e^3.0 ≈ 20.09. Getting the loss down to 2.7 would bring it to about 14.9.
