scenes:
- id: pretraining-objectives.s1
  title: Predict a prefix continuation
  type: explanation
  depth: intuition
  objective_refs:
  - objective.pretraining-objectives
  markdown: Autoregressive language training predicts each next token from an allowed prefix. In “birds can fly”,
    the prediction of fly sees earlier tokens, not fly itself. Summing negative log probabilities turns many such
    predictions into the training loss. Parallel training evaluates many positions even though generation is sequential.
  text_mode: Autoregressive language training predicts each next token from an allowed prefix. In “birds can fly”,
    the prediction of fly sees earlier tokens, not fly itself. Summing negative log probabilities turns many such
    predictions into the training loss. Parallel training evaluates many positions even though generation is sequential.
  bridges: []
- id: pretraining-objectives.s2
  title: Recover hidden information
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.pretraining-objectives
  markdown: Masked language modeling hides selected tokens and predicts them from permitted surrounding context.
    Denoising objectives reconstruct clean text from corrupted input, sometimes through an encoder-decoder model.
    These tasks train useful representations but do not automatically provide the same left-to-right generation
    interface as a causal decoder.
  text_mode: Masked language modeling hides selected tokens and predicts them from permitted surrounding context.
    Denoising objectives reconstruct clean text from corrupted input, sometimes through an encoder-decoder model.
    These tasks train useful representations but do not automatically provide the same left-to-right generation
    interface as a causal decoder.
  bridges: []
- id: pretraining-objectives.s3
  title: Predict more than one future target
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.pretraining-objectives
  markdown: Multi-token objectives add predictions at additional future offsets, with a recipe defining modules,
    conditioning, and weighting. A toy loss L = L_next + 0.2 L_two-ahead gives the auxiliary target a smaller contribution.
    More targets can shape representations; their existence does not guarantee fewer inference steps.
  text_mode: Multi-token objectives add predictions at additional future offsets, with a recipe defining modules,
    conditioning, and weighting. A toy loss L = L_next + 0.2 L_two-ahead gives the auxiliary target a smaller contribution.
    More targets can shape representations; their existence does not guarantee fewer inference steps.
  bridges: []
- id: pretraining-objectives.s4
  title: Audit input and supervision together
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.pretraining-objectives
  markdown: 'For each target, write exactly what information can reach its prediction. Identify corrupted inputs,
    target shifts, ignored positions, and auxiliary weights. Compare downstream evaluations as well as training
    loss: two different objectives can have losses on different prediction units and therefore incomparable raw
    scales.'
  text_mode: 'For each target, write exactly what information can reach its prediction. Identify corrupted inputs,
    target shifts, ignored positions, and auxiliary weights. Compare downstream evaluations as well as training
    loss: two different objectives can have losses on different prediction units and therefore incomparable raw
    scales.'
  bridges: []
- id: pretraining-objectives.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.pretraining-objectives
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Autoregressive, masked, denoising, and multi-token objectives expose different information and targets;
    the loss and mask must implement the chosen task.
