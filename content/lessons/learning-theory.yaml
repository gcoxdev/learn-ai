schema_version: 0.2-draft
lesson:
  id: learning-theory
  version: 0.4.0-draft
  title: What can a learning guarantee actually guarantee?
  state: draft
  summary: How many frosty nights must a vineyard record before its frost alarm can be trusted? Learning theory gives a real answer, and shows why it goes quiet for deep networks.
  slot: M09.3
  category: learning
  sources:
    - title: An Introduction to Statistical Learning — authors’ materials
      url: https://www.statlearning.com/
    - title: "Understanding Machine Learning: From Theory to Algorithms (Shalev-Shwartz & Ben-David, 2014)"
      url: https://www.cs.huji.ac.il/~shais/UnderstandingMachineLearning/
    - title: "Understanding deep learning requires rethinking generalization (Zhang et al., 2017)"
      url: https://arxiv.org/abs/1611.03530
objectives:
  - id: objective.learning-theory
    version: 2-draft
    statement: Learning theory links model capacity, sample size, error, and confidence; its bounds guide intuition but don't certify a deployed network.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - learning-theory.base.v2
      - learning-theory.transfer.v2
      - learning-theory.calculate
    prerequisites:
      - anyOf:
          - objective.generalization
      - anyOf:
          - objective.discrete-math
      - anyOf:
          - objective.probability
scenes:
  - id: learning-theory.s1
    title: Five cold nights, endless rules
    type: explanation
    depth: intuition
    objective_refs:
      - objective.learning-theory
    markdown: |-
      A vineyard wants an alarm that predicts frost damage from the night's lowest temperature. It has five nights of records:

      | Night's low (°F) | 29 | 31 | 32.5 | 34 | 36 |
      | --- | --- | --- | --- | --- | --- |
      | Frost damage? | yes | yes | yes | no | no |

      "Damage when the low is at or below 33°F" fits all five nights. So does "at or below 33.9°F." So does "damage on exactly the three dates in the records." All of these agree on the five records and disagree about tomorrow. Five examples can't choose among every possible rule.

      So every learner narrows the choice in advance, by fixing a **hypothesis class**: the set of rules it is allowed to pick from. Here, a sensible class is the thresholds, "damage if the low is at or below c," for some cutoff c. The **no-free-lunch theorems** make the point formally: averaged over every conceivable pattern, no learning method beats any other on unseen cases. Learning works because we bet on a class of plausible rules, and learning theory asks how much data that bet needs.
    bridges: []
  - id: learning-theory.s2
    title: Probably approximately correct, in nights
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.learning-theory
    markdown: |-
      Say the alarm may use thresholds at every 0.1°F from 22 to 42: 201 candidate rules, and assume one of them is exactly right. The learner picks any rule that fits every recorded night. How many nights before you can trust its pick?

      Leslie Valiant's 1984 framework, **probably approximately correct (PAC)** learning, answers with two numbers. The error tolerance ε says how wrong the chosen rule may be on future nights ("approximately"). The failure probability δ says how often you accept being fooled by an unlucky set of training nights ("probably").

      Call a rule *bad* if its true error is above ε. The argument takes three steps.

      1. A bad rule gets a random night right with probability below 1 − ε, so it survives m independent nights with probability below $(1-\varepsilon)^m \le e^{-\varepsilon m}$.
      2. There are at most $|\mathcal H|$ bad rules, so the chance that *any* of them survives is below $|\mathcal H|\,e^{-\varepsilon m}$.
      3. Make that at most δ and solve for m:

      $$m \;\ge\; \frac{1}{\varepsilon}\Big(\ln|\mathcal H| + \ln\frac{1}{\delta}\Big)$$

      With ε = 0.05 and δ = 0.05: ln 201 = 5.30 and ln 20 = 3.00, so m ≥ 8.30 / 0.05 ≈ 166 nights. After 166 nights, in at least 95% of possible training histories, the chosen threshold is wrong on at most 5% of future nights. The 95% is about the luck of the training sample; the 5% is about predictions.

      :::predict You switch to thresholds every 0.001°F, about 100 times as many rules (20,001). How many nights do you need now?
      258, only 92 more. The class size enters through its logarithm, and ln 100 ≈ 4.6, so m grows by about 4.6 / 0.05 ≈ 92. Accuracy is expensive by comparison: halving ε to 0.025 doubles the answer to 332.
      :::

      The one assumption to check first: the math treats every night as an independent draw from the same weather as future nights. A week-long cold snap gives seven nearly identical nights, which is closer to one example than seven.
    bridges:
      - discrete-math
      - probability
      - statistics-evidence
  - id: learning-theory.s3
    title: Count patterns, not rules
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.learning-theory
    markdown: |-
      If the cutoff can be *any* real number, there are infinitely many rules and ln |H| is infinite. Yet thresholds are obviously learnable. **Vapnik–Chervonenkis (VC) theory**, developed by Vladimir Vapnik and Alexey Chervonenkis from the late 1960s, fixes this by counting what a class can *do* to a set of points instead of how many rules it has.

      A class **shatters** a set of points if it can produce every yes/no labeling of them. Its **VC dimension** is the size of the largest set it can shatter. The program checks two classes on 1, 2, and 3 temperatures (0 is the coldest).

      ```python run
      from itertools import product
      from math import log, ceil

      def threshold_labels(points):
          """Every labeling 'frost (1) at or below cutoff c' can make."""
          cuts = [min(points) - 1] + list(points)
          return {tuple(int(p <= c) for p in points) for c in cuts}

      def interval_labels(points):
          """Every labeling 'frost (1) between a and b' can make."""
          ends = [min(points) - 1] + list(points)
          return {tuple(int(a < p <= b) for p in points) for a in ends for b in ends}

      for name, family in [("threshold", threshold_labels), ("interval", interval_labels)]:
          for k in [1, 2, 3]:
              points = list(range(k))
              made = family(points)
              missing = [lab for lab in product([0, 1], repeat=k) if lab not in made]
              print(f"{name:9s} on {k} points: shatters = {not missing}  missing {missing}")

      H, eps, delta = 201, 0.05, 0.05
      m = (log(H) + log(1 / delta)) / eps
      print(f"\nnights needed for |H|={H}, eps={eps}, delta={delta}: {ceil(m)}")
      ```

      Thresholds can't label a colder night "no frost" and a warmer one "frost," the missing `(0, 1)`, so their VC dimension is 1. Intervals can't make yes–no–yes, the missing `(1, 0, 1)`, so theirs is 2.

      | Class | VC dimension | A labeling it can't make |
      | --- | ---: | --- |
      | Thresholds on a line | 1 | no, yes (on two points) |
      | Intervals on a line | 2 | yes, no, yes |
      | Straight lines in a plane (a perceptron) | 3 | XOR on four corners |
      | Linear classifiers on d inputs | d + 1 | |

      The XOR row is the pattern Minsky and Papert used in *Perceptrons* (1969). VC theory's payoff: for yes/no classification, the data needed grows roughly in proportion to the VC dimension, which replaces ln |H|, and a class can be PAC-learned exactly when its VC dimension is finite. Change `eps` or `H` in the program to feel the bound's shape.
  - id: learning-theory.s4
    title: Why the bounds go quiet for deep networks
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.learning-theory
    markdown: |-
      In 2017, Chiyuan Zhang and colleagues trained standard image networks on CIFAR-10, a set of 50,000 small training photos in ten classes, after shuffling the labels at random. The networks still reached zero training error, memorizing pure noise. With the real labels, the same networks generalized well.

      That's a puzzle for capacity-based theory. The network's capacity was identical in both runs, so capacity alone can't explain why it generalizes on real data. For networks with millions of parameters, VC-style bounds promise only that test error is below 100%, which you already knew. Researchers are still working out the explanation, studying the preferences built into gradient descent, margins, and how compressible a trained network is.

      :::mixup "A loose bound means the theory is wrong."
      A bound is a ceiling. "Error is at most 140%" is true and useless, like a weather forecast of "between −50 and +50 degrees." The theory is correct; its guarantee is just too broad for this model. Use theory for the shape of the answer (log of class size, 1/ε) and a held-out test for the number.
      :::

      :::deeper When no rule is perfect: the Hoeffding bound
      If no rule in the class fits every night, combine Hoeffding's inequality with the same union bound over rules. With probability at least 1 − δ, every rule h in a finite class satisfies

      $$R(h) \;\le\; \hat R(h) + \sqrt{\frac{\ln|\mathcal H| + \ln(2/\delta)}{2m}}$$

      where $\hat R$ is training error and $R$ is true error. For 201 thresholds, δ = 0.05, and m = 1,000 nights: $\sqrt{(5.30 + 3.69)/2000} = 0.067$. A rule with 4% training error has true error below about 10.7%. Because of the square root, halving that 6.7-point slack takes four times as many nights.
      :::
    bridges: []
  - id: learning-theory.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.learning-theory
    markdown: Sensor streams, shuffled labels, finer thresholds, and a 140% bound ask you to read ε and δ, count a VC dimension, and compute how much data a guarantee needs.
    takeaway: |-
      A learning guarantee names a class of rules, an error tolerance ε, and a confidence 1 − δ, and it assumes independent examples. The data needed grows with the log of the class size (or its VC dimension) and with 1/ε.
  - id: learning-theory.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.learning-theory
    markdown: |-
      A learning guarantee specifies the predictors, sampling assumptions, allowed error, and confidence level. Check those conditions before applying it to a real system.
