assessment_families:
  - id: learning-theory.base
    objective_ref: objective.learning-theory
    task: base
    response_type: single_choice
    points: 1
    hint: 'Read PAC in ordinary language: trace the inputs, operation, and result before choosing.'
    remediation_scene: learning-theory.s2
    variants:
      - id: learning-theory.base.1
        prompt: What does shattering require?
        options:
          - id: b
            text: Correctly classifying only one labeling
          - id: c
            text: Memorizing one example twice
          - id: a
            text: Realizing every binary labeling of a chosen finite set
        answer: a
        feedback: Shattering is a capacity property across all label assignments on that set.
        retired: true
      - id: learning-theory.base.2
        prompt: In a PAC-style statement, high probability is commonly over what?
        options:
          - id: c
            text: Only the displayed confidence of one answer
          - id: a
            text: The sampled training data under the assumptions
          - id: b
            text: A guarantee of consciousness
        answer: a
        feedback: The probability quantifies the learning experiment’s random sample.
        retired: true
  - id: learning-theory.transfer
    objective_ref: objective.learning-theory
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Use bounds as conditional tools: trace the inputs, operation, and result before choosing.'
    remediation_scene: learning-theory.s4
    variants:
      - id: learning-theory.transfer.1
        prompt: A theorem assumes independent samples, but training rows are correlated copies. Can its conclusion be applied without checking?
        options:
          - id: c
            text: Only if the file is large
          - id: a
            text: No; the sampling assumption may fail
          - id: b
            text: Yes; row count alone is sufficient
        answer: a
        feedback: Formal conclusions depend on satisfying their hypotheses.
        retired: true
      - id: learning-theory.transfer.2
        prompt: A bound is too loose to explain observed neural performance. What is a sound conclusion?
        options:
          - id: a
            text: The bound may be uninformative here, not that the measurements are impossible
          - id: b
            text: The model must violate mathematics
          - id: c
            text: Every theorem is useless
        answer: a
        feedback: A valid upper bound can still be too broad for practical prediction.
        retired: true
  - id: learning-theory.base.v2
    objective_ref: objective.learning-theory
    task: base
    response_type: single_choice
    points: 1
    hint: Keep ε and δ apart. ε is how wrong the chosen rule may be on future cases; δ is the chance that the training sample itself was unlucky. Class size enters through its logarithm.
    remediation_scene: learning-theory.s2
    variants:
      - id: learning-theory.base.v2.1
        prompt: A PAC guarantee uses ε = 0.05 and δ = 0.01. What does the 0.01 describe?
        options:
          - id: b
            text: The share of future predictions that may be wrong
          - id: a
            text: The chance the training sample misleads the learner
          - id: c
            text: The share of rules in the class that are bad
        answer: a
        feedback: δ is the probability, over random training samples, that the learner ends up with a rule worse than ε. The share of wrong future predictions is what ε bounds.
      - id: learning-theory.base.v2.2
        prompt: Using m ≥ (ln|H| + ln(1/δ))/ε, a class grows from 1,000 rules to 1,000,000. How does the number of examples needed change?
        options:
          - id: c
            text: It grows about 1,000-fold, like the class size
          - id: b
            text: It stays the same, since only ε and δ matter
          - id: a
            text: It grows by about ln(1,000) ≈ 6.9, divided by ε
        answer: a
        feedback: ln|H| rises from ln 1,000 ≈ 6.9 to ln 1,000,000 ≈ 13.8, adding 6.9/ε examples. Class size matters, but only through its logarithm.
      - id: learning-theory.base.v2.3
        prompt: A class can produce every yes/no labeling of some set of 4 points, but of no set of 5 points. What is its VC dimension?
        options:
          - id: b
            text: '5'
          - id: a
            text: '4'
          - id: c
            text: '16'
        answer: a
        feedback: The VC dimension is the size of the largest set the class can shatter, which is 4. Sixteen is the number of labelings of 4 points, and 5 is the first size it fails on.
      - id: learning-theory.base.v2.4
        prompt: '"Frost if the low is between a and b" can''t label three increasing temperatures yes, no, yes. What does that show about this class of intervals?'
        options:
          - id: a
            text: It can't shatter those three points, so its VC dimension is below 3
          - id: c
            text: It has VC dimension 7, one for each labeling it can make
          - id: b
            text: It can't be learned from data, since one labeling is missing
        answer: a
        feedback: Any three temperatures on a line can be put in order, so no set of three is shattered, while intervals can shatter two points; their VC dimension is 2. A finite VC dimension is exactly what makes a class learnable, not a sign that it isn't.
      - id: learning-theory.base.v2.5
        prompt: In the derivation of the finite-class bound, why does |H| appear?
        options:
          - id: c
            text: Each extra rule adds one example to the training set
          - id: a
            text: The chances of each bad rule surviving are added together
          - id: b
            text: The error tolerance is divided among all the rules
        answer: a
        feedback: Each bad rule survives m examples with probability below e^(−εm); adding that up over at most |H| bad rules gives |H|e^(−εm). ε is the same for every rule, not divided among them.
  - id: learning-theory.transfer.v2
    objective_ref: objective.learning-theory
    task: transfer
    response_type: single_choice
    points: 1
    hint: Check the theorem's assumptions against how the data were really collected, and read a loose bound as a ceiling rather than a prediction.
    remediation_scene: learning-theory.s4
    variants:
      - id: learning-theory.transfer.v2.1
        prompt: A theorem assumes independent examples. The training data are 10,000 readings taken one second apart from 5 machines. What is the main problem with applying it?
        options:
          - id: b
            text: The theorem needs a larger hypothesis class than this
          - id: a
            text: Neighboring readings are nearly copies, so there's far less evidence
          - id: c
            text: Nothing, since 10,000 readings make the bound tighter
        answer: a
        feedback: Readings a second apart from the same machine are strongly correlated, so the effective number of independent examples is much smaller than 10,000. Plugging in m = 10,000 overstates the guarantee.
      - id: learning-theory.transfer.v2.2
        prompt: A VC-style bound says a network's test error is at most 140%. Its measured test error on a large held-out set is 6%. What is the sound conclusion?
        options:
          - id: c
            text: The held-out measurement must contain a mistake
          - id: b
            text: The network somehow escapes what the theory allows
          - id: a
            text: The bound is true but too loose to say anything here
        answer: a
        feedback: 6% is below 140%, so nothing contradicts anything; the bound is just vacuous for this model. Trust the held-out test for the actual number.
      - id: learning-theory.transfer.v2.3
        prompt: A network reaches 0% training error with real labels, and also with labels shuffled at random. What does this tell you?
        options:
          - id: a
            text: Its capacity alone can't explain why it generalizes on real labels
          - id: b
            text: It will generalize equally well in both cases
          - id: c
            text: The shuffled run reveals a bug in the training code
        answer: a
        feedback: This is the Zhang et al. result. With shuffled labels, test accuracy is at chance, yet the capacity was the same, so something beyond capacity (the data and the training method) explains good generalization on real labels.
      - id: learning-theory.transfer.v2.4
        prompt: An engineer moves from 1,000 candidate thresholds to 100,000 and worries she'll need 100 times more data. Using the finite-class bound, what is the better estimate?
        options:
          - id: b
            text: About 10 times more, the square root of 100
          - id: a
            text: About ln(100) ≈ 4.6, divided by ε, more examples
          - id: c
            text: About 100 times more, matching the larger class
        answer: a
        feedback: ln|H| grows from ln 1,000 to ln 100,000, an increase of ln 100 ≈ 4.6, so the bound adds about 4.6/ε examples. Square roots appear in the Hoeffding bound's slack, not in how class size enters.
  - id: learning-theory.calculate
    objective_ref: objective.learning-theory
    task: base
    response_type: numeric
    points: 1
    hint: Compute ln|H| + ln(1/δ), divide by ε, and round up to the next whole number of examples.
    remediation_scene: learning-theory.s2
    absolute_tolerance: 0.5
    variants:
      - id: learning-theory.calculate.1
        prompt: A learner picks a rule consistent with its data from a class of 1,000 rules, one of which is exactly right. Using m ≥ (ln|H| + ln(1/δ))/ε with ε = 0.1 and δ = 0.05, how many examples are needed? Round up.
        answer: 100
        feedback: ln 1,000 = 6.91 and ln 20 = 3.00, so m ≥ 9.90/0.1 = 99.03, which rounds up to 100.
      - id: learning-theory.calculate.2
        prompt: With |H| = 100 rules, ε = 0.05, and δ = 0.01, how many examples does the finite-class bound m ≥ (ln|H| + ln(1/δ))/ε require? Round up.
        answer: 185
        feedback: ln 100 = 4.61 and ln 100 = 4.61, so m ≥ 9.21/0.05 = 184.2, which rounds up to 185.
      - id: learning-theory.calculate.3
        prompt: With |H| = 20 rules, ε = 0.1, and δ = 0.05, how many examples does the finite-class bound m ≥ (ln|H| + ln(1/δ))/ε require? Round up.
        answer: 60
        feedback: ln 20 = 3.00 and ln 20 = 3.00, so m ≥ 5.99/0.1 = 59.9, which rounds up to 60.
      - id: learning-theory.calculate.4
        prompt: With |H| = 10,000 rules, ε = 0.02, and δ = 0.1, how many examples does the finite-class bound m ≥ (ln|H| + ln(1/δ))/ε require? Round up.
        answer: 576
        feedback: ln 10,000 = 9.21 and ln 10 = 2.30, so m ≥ 11.51/0.02 = 575.6, which rounds up to 576.
      - id: learning-theory.calculate.5
        prompt: The vineyard keeps 201 thresholds and ε = 0.05 but wants δ = 0.01. How many nights does m ≥ (ln|H| + ln(1/δ))/ε require? Round up.
        answer: 199
        feedback: ln 201 = 5.30 and ln 100 = 4.61, so m ≥ 9.91/0.05 = 198.2, which rounds up to 199.
