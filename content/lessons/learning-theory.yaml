assessment_families:
- id: learning-theory.base
  objective_ref: objective.learning-theory
  task: base
  response_type: single_choice
  points: 1
  hint: 'Read PAC in ordinary language: trace the inputs, operation, and result before choosing.'
  remediation_scene: learning-theory.s2
  variants:
  - id: learning-theory.base.1
    prompt: What does shattering require?
    options:
    - id: b
      text: Correctly classifying only one labeling
    - id: c
      text: Memorizing one example twice
    - id: a
      text: Realizing every binary labeling of a chosen finite set
    answer: a
    feedback: Shattering is a capacity property across all label assignments on that set.
  - id: learning-theory.base.2
    prompt: In a PAC-style statement, high probability is commonly over what?
    options:
    - id: c
      text: Only the displayed confidence of one answer
    - id: a
      text: The sampled training data under the assumptions
    - id: b
      text: A guarantee of consciousness
    answer: a
    feedback: The probability quantifies the learning experiment’s random sample.
- id: learning-theory.transfer
  objective_ref: objective.learning-theory
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Use bounds as conditional tools: trace the inputs, operation, and result before choosing.'
  remediation_scene: learning-theory.s4
  variants:
  - id: learning-theory.transfer.1
    prompt: A theorem assumes independent samples, but training rows are correlated copies. Can its conclusion be
      applied without checking?
    options:
    - id: c
      text: Only if the file is large
    - id: a
      text: No; the sampling assumption may fail
    - id: b
      text: Yes; row count alone is sufficient
    answer: a
    feedback: Formal conclusions depend on satisfying their hypotheses.
  - id: learning-theory.transfer.2
    prompt: A bound is too loose to explain observed neural performance. What is a sound conclusion?
    options:
    - id: a
      text: The bound may be uninformative here, not that the measurements are impossible
    - id: b
      text: The model must violate mathematics
    - id: c
      text: Every theorem is useless
    answer: a
    feedback: A valid upper bound can still be too broad for practical prediction.
