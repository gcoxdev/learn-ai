schema_version: 0.2-draft
lesson:
  id: learning-theory
  version: 0.1.0-draft
  title: What can a learning guarantee actually guarantee?
  state: draft
  summary: Learning theory relates hypothesis capacity, sample size, error tolerance, and confidence under stated
    assumptions; formal bounds do not automatically certify a deployed neural system.
  slot: M09.3
  category: learning
  minutes: 12
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.learning-theory
  version: 1-draft
  statement: Learning theory relates hypothesis capacity, sample size, error tolerance, and confidence under stated
    assumptions; formal bounds do not automatically certify a deployed neural system.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - learning-theory.base
  - learning-theory.transfer
  prerequisites:
  - anyOf:
    - objective.generalization
  - anyOf:
    - objective.discrete-math
  - anyOf:
    - objective.probability
scenes:
- id: learning-theory.s1
  title: Define the hypothesis class
  type: explanation
  depth: intuition
  objective_refs:
  - objective.learning-theory
  markdown: 'A hypothesis class is the set of predictors a learner can choose from. A guarantee usually specifies
    a data-sampling model, loss, class, and selection procedure. Without restrictions, finite examples cannot determine
    behavior on every unobserved input: many rules can agree with the sample and disagree elsewhere.'
  text_mode: 'A hypothesis class is the set of predictors a learner can choose from. A guarantee usually specifies
    a data-sampling model, loss, class, and selection procedure. Without restrictions, finite examples cannot determine
    behavior on every unobserved input: many rules can agree with the sample and disagree elsewhere.'
  bridges: []
- id: learning-theory.s2
  title: Read PAC in ordinary language
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.learning-theory
  markdown: Probably approximately correct learning asks for a predictor whose error is at most a chosen tolerance
    with high probability over sampled training data, under the framework’s assumptions. “Probably” concerns the
    sampling experiment; “approximately” concerns the allowed error. It does not promise every individual prediction
    is correct.
  text_mode: Probably approximately correct learning asks for a predictor whose error is at most a chosen tolerance
    with high probability over sampled training data, under the framework’s assumptions. “Probably” concerns the
    sampling experiment; “approximately” concerns the allowed error. It does not promise every individual prediction
    is correct.
  bridges:
  - discrete-math
  - probability
- id: learning-theory.s3
  title: Understand shattering
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.learning-theory
  markdown: A class shatters a finite set if it can realize every binary labeling of that set. VC dimension is the
    largest size of a set it can shatter, when finite. Thresholds on a line can shatter one point but cannot realize
    every labeling of two ordered points. Capacity is more specific than just counting stored bytes.
  text_mode: A class shatters a finite set if it can realize every binary labeling of that set. VC dimension is
    the largest size of a set it can shatter, when finite. Thresholds on a line can shatter one point but cannot
    realize every labeling of two ordered points. Capacity is more specific than just counting stored bytes.
  bridges: []
- id: learning-theory.s4
  title: Use bounds as conditional tools
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.learning-theory
  markdown: Sample-complexity bounds relate data needs to capacity, confidence, and error tolerance. Bounds can
    be loose for practical systems, and modern generalization depends on optimization and data structure too. Check
    whether the assumptions describe the actual pipeline before using a theorem as a reliability claim.
  text_mode: Sample-complexity bounds relate data needs to capacity, confidence, and error tolerance. Bounds can
    be loose for practical systems, and modern generalization depends on optimization and data structure too. Check
    whether the assumptions describe the actual pipeline before using a theorem as a reliability claim.
  bridges: []
- id: learning-theory.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.learning-theory
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: learning-theory.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.learning-theory
  markdown: Learning theory relates hypothesis capacity, sample size, error tolerance, and confidence under stated
    assumptions; formal bounds do not automatically certify a deployed neural system.
  text_mode: Learning theory relates hypothesis capacity, sample size, error tolerance, and confidence under stated
    assumptions; formal bounds do not automatically certify a deployed neural system.
navigation:
  routes:
  - id: route.core
    scene_sequence:
