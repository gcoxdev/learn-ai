schema_version: 0.2-draft
lesson:
  id: classification-metrics
  version: 0.3.0-draft
  title: Look inside the average score
  state: draft
  summary: Count false alarms and missed cases, then see why a high overall score can hide the mistakes that
    matter.
  slot: M07.8
  category: learning
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.classification-metrics
  version: 1-draft
  statement: Confusion matrices, precision, recall, threshold curves, and error analysis reveal different aspects
    of prediction quality and should be interpreted with class prevalence and costs.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - classification-metrics.base
  - classification-metrics.transfer
  prerequisites:
  - anyOf:
    - objective.logistic-regression
  - anyOf:
    - objective.baselines-and-success
scenes:
- id: classification-metrics.s1
  title: Give each kind of mistake a name
  type: explanation
  depth: intuition
  objective_refs:
  - objective.classification-metrics
  markdown: 'Choose the category you want to flag, such as defective parts. This is the **positive class**;
    “positive” does not mean “good.” Then separate four outcomes:


    - **True positive:** a defect correctly flagged.

    - **False positive:** a good part wrongly flagged—a false alarm.

    - **False negative:** a defect missed.

    - **True negative:** a good part correctly left alone.


    A **confusion matrix** puts these counts in a table of predicted versus observed categories. Keeping them
    separate reveals errors that an overall score can hide.'
  text_mode: 'Choose the category you want to flag, such as defective parts. This is the **positive class**;
    “positive” does not mean “good.” Then separate four outcomes:


    - **True positive:** a defect correctly flagged.

    - **False positive:** a good part wrongly flagged—a false alarm.

    - **False negative:** a defect missed.

    - **True negative:** a good part correctly left alone.


    A **confusion matrix** puts these counts in a table of predicted versus observed categories. Keeping them
    separate reveals errors that an overall score can hide.'
  bridges: []
- id: classification-metrics.s2
  title: Compute precision and recall
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.classification-metrics
  markdown: 'Suppose a detector flags 10 cases, of which 6 are real positives, and there are 12 positives overall.
    Precision is 6/10 = 0.6: how many flags are right. Recall is 6/12 = 0.5: how many positives were found.
    Neither alone reports the full pattern of errors.


    Complete the example with 100 cases: 6 true positives, 4 false positives, 6 false negatives, and 84 true
    negatives. Accuracy is (6 + 84)/100 = 90%, while recall remains 50%. The high total hides half the defects
    being missed. Remember: precision starts from the flags; recall starts from the actual positives.'
  text_mode: 'Suppose a detector flags 10 cases, of which 6 are real positives, and there are 12 positives
    overall. Precision is 6/10 = 0.6: how many flags are right. Recall is 6/12 = 0.5: how many positives were
    found. Neither alone reports the full pattern of errors.


    Complete the example with 100 cases: 6 true positives, 4 false positives, 6 false negatives, and 84 true
    negatives. Accuracy is (6 + 84)/100 = 90%, while recall remains 50%. The high total hides half the defects
    being missed. Remember: precision starts from the flags; recall starts from the actual positives.'
  bridges:
  - arithmetic
  - statistics-evidence
- id: classification-metrics.s3
  title: Move the cutoff and compare the mistakes
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.classification-metrics
  markdown: 'Lowering the score cutoff flags more cases. It can catch more defects while also creating more
    false alarms. Curves let us inspect this tradeoff across many cutoffs.


    An **ROC curve**—receiver operating characteristic—plots recall against the false-positive rate. In our
    100-case example, that rate is 4 false alarms divided by 88 actual negatives, about 4.5%. A **precision–recall
    curve** compares the fraction of correct flags with the fraction of defects found; its interpretation depends
    on how common defects are.


    **AUC**, or area under the specified curve, summarizes performance across thresholds. It does not choose
    a cutoff for a team that can inspect only ten cases. That still requires a decision about costs and capacity.


    The activity below switches to eight cases so you can inspect every decision. Their scores stay fixed while
    you move the cutoff. These scores are not calibrated probabilities: a score of 80 need not mean an 80%
    chance of a defect.'
  text_mode: 'Lowering the score cutoff flags more cases. It can catch more defects while also creating more
    false alarms. Curves let us inspect this tradeoff across many cutoffs.


    An **ROC curve**—receiver operating characteristic—plots recall against the false-positive rate. In our
    100-case example, that rate is 4 false alarms divided by 88 actual negatives, about 4.5%. A **precision–recall
    curve** compares the fraction of correct flags with the fraction of defects found; its interpretation depends
    on how common defects are.


    **AUC**, or area under the specified curve, summarizes performance across thresholds. It does not choose
    a cutoff for a team that can inspect only ten cases. That still requires a decision about costs and capacity.


    The activity below switches to eight cases so you can inspect every decision. Their scores stay fixed while
    you move the cutoff. These scores are not calibrated probabilities: a score of 80 need not mean an 80%
    chance of a defect.'
  bridges: []
  figure:
    kind: threshold
    caption: Move the score cutoff to see which defects are caught and which good parts are flagged.
    description: Eight fixed scores and known conditions are plotted against a threshold. Predict missed defects,
      reveal counts and metrics, or read the same scores in a table.
- id: classification-metrics.s4
  title: Explain failures with examples
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.classification-metrics
  markdown: Group errors by conditions such as lighting, length, source, or subgroup. Inspect labeling mistakes
    and ambiguous cases. Use confidence intervals when comparing models and keep the analysis separate from
    an untouched final test where possible. Choose a model for the intended decision, not a single flattering
    metric.
  text_mode: Group errors by conditions such as lighting, length, source, or subgroup. Inspect labeling mistakes
    and ambiguous cases. Use confidence intervals when comparing models and keep the analysis separate from
    an untouched final test where possible. Choose a model for the intended decision, not a single flattering
    metric.
  bridges: []
- id: classification-metrics.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.classification-metrics
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Precision asks how many flags are correct. Recall asks how many real positives were found. Compare
    both, along with false alarms and the consequences of each mistake.
- id: classification-metrics.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.classification-metrics
  markdown: Precision asks how many flags are correct. Recall asks how many real positives were found. Compare
    both, along with false alarms and the consequences of each mistake.
  text_mode: Precision asks how many flags are correct. Recall asks how many real positives were found. Compare
    both, along with false alarms and the consequences of each mistake.
