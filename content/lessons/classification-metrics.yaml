lesson:
  id: classification-metrics
  version: 0.4.0-draft
  title: Look inside the average score
  state: draft
  summary: A defect detector is 90% accurate and still misses half the defects. Count the four kinds of outcome, then choose a cutoff your inspectors can live with.
  slot: M07.8
  category: learning
  sources:
    - title: An Introduction to Statistical Learning — authors’ materials
      url: https://www.statlearning.com/
objectives:
  - id: objective.classification-metrics
    version: 2-draft
    statement: Use a confusion matrix, precision, recall, and threshold curves to judge a classifier, taking class balance and error costs into account.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - classification-metrics.base.v2
      - classification-metrics.transfer.v2
    prerequisites:
      - anyOf:
          - objective.logistic-regression
      - anyOf:
          - objective.baselines-and-success
scenes:
  - id: classification-metrics.s1
    title: Ninety percent accurate, half the defects missed
    type: explanation
    depth: intuition
    objective_refs:
      - objective.classification-metrics
    markdown: |-
      A factory camera checks 100 parts for defects, and the vendor proudly reports 90% accuracy. Then the quality manager counts: 12 parts were actually defective, and the camera caught only 6 of them. Half the defects went out the door.

      How can both be true? Because 88 of the 100 parts were fine, a camera that says "fine" to everything would already score 88% accuracy while catching nothing. Accuracy mixes every kind of mistake into one number, so split it up. First name the **positive class**, the thing you're trying to flag (here, defects; "positive" doesn't mean "good"). Then every part falls into one of four boxes:

      | | Actually defective | Actually fine |
      | --- | ---: | ---: |
      | **Flagged** | 6 true positives (TP) | 4 false positives (FP) |
      | **Not flagged** | 6 false negatives (FN) | 84 true negatives (TN) |

      This table is a **confusion matrix**. A false positive is a false alarm: a good part sent to an inspector. A false negative is a miss: a defect shipped to a customer. Accuracy is (6 + 84) / 100 = 90%, and it hides the six misses completely.
    bridges: []
  - id: classification-metrics.s2
    title: Precision and recall start from different places
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.classification-metrics
    markdown: |-
      Two questions pull the table apart:

      - **Precision**: of the parts we flagged, how many were really defective? $\text{TP} / (\text{TP} + \text{FP}) = 6/10 = 0.6$.
      - **Recall** (also called sensitivity or true positive rate): of the parts that were really defective, how many did we flag? $\text{TP} / (\text{TP} + \text{FN}) = 6/12 = 0.5$.

      Precision starts from the flags; recall starts from the real defects. An inspector who hates wasted checks cares about precision; a customer who receives the parts cares about recall.

      To summarize both in one number, use the **F1 score**, their harmonic mean:

      $$F_1 = \frac{2 \cdot \text{precision} \cdot \text{recall}}{\text{precision} + \text{recall}} = \frac{2 \times 0.6 \times 0.5}{0.6 + 0.5} \approx 0.55$$

      :::predict A lazy detector flags just one part, and it's a real defect. What are its precision, recall, and F1, and how does F1 compare with the plain average?
      Precision is 1/1 = 1.0, and recall is 1/12 ≈ 0.08. F1 = 2 × 1.0 × 0.08 / 1.08 ≈ 0.15, while the plain average would be about 0.54. The harmonic mean stays low unless *both* numbers are decent, so a detector can't score well by flagging almost nothing.
      :::

      :::mixup "Precision and recall are just two names for accuracy on the positive class."
      They divide the same TP by different totals. With 1,000 good parts and 10 defects, a detector could catch all 10 (recall 1.0) while raising 90 false alarms (precision 0.1). Always ask which denominator a number uses.
      :::
    bridges:
      - arithmetic
      - statistics-evidence
  - id: classification-metrics.s3
    title: Move the cutoff and watch the trade
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.classification-metrics
    markdown: |-
      The camera doesn't really say "defect" or "fine." It gives each part a score and flags scores above a **cutoff** (or threshold). Lower the cutoff and you catch more defects but raise more false alarms; raise it and the reverse happens. So every cutoff gives its own confusion matrix.

      An **ROC curve** (receiver operating characteristic, a name from radar engineering, where the idea began during the Second World War) plots recall against the **false positive rate**, the share of good parts wrongly flagged, FP / (FP + TN), as the cutoff sweeps from high to low. In the 100-part example, the false positive rate is 4/88 ≈ 4.5%. The area under that curve, **AUC**, has a neat meaning: the chance that a randomly chosen defect scores higher than a randomly chosen good part. An AUC of 0.5 is coin-flipping; 1.0 is a perfect ranking.

      A **precision–recall curve** plots precision against recall instead. When defects are rare, it's the more honest picture, because precision reacts to the flood of good parts that a small false positive rate still lets through.

      Now try it. The activity below uses eight parts so you can see every decision: four defects and four good parts, with fixed scores. Before you move the cutoff, predict how many defects will be missed. Treat the scores as a ranking, not as probabilities: a score of 80 doesn't mean an 80% chance of a defect.
    bridges: []
    figure:
      kind: threshold
      caption: Move the score cutoff to see which defects are caught and which good parts are flagged.
      description: Eight fixed scores and known conditions are plotted against a threshold. Predict missed defects, reveal counts and metrics, or read the same scores in a table.
  - id: classification-metrics.s5
    title: Pick the cutoff your team can live with
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.classification-metrics
    markdown: |-
      Here are the same eight parts in code, with precision, recall, and F1 at five cutoffs, plus the AUC:

      ```python run
      import numpy as np

      # The eight parts from the activity above: score, and whether each is defective
      scores = np.array([95, 85, 75, 60, 45, 30, 20, 5])
      defect = np.array([ 1,  0,  1,  1,  0,  1,  0, 0])

      print("cutoff  TP FP FN  precision  recall    F1")
      for cutoff in [90, 70, 50, 25, 0]:
          flag = scores >= cutoff
          tp = np.sum(flag & (defect == 1))
          fp = np.sum(flag & (defect == 0))
          fn = np.sum(~flag & (defect == 1))
          precision = tp / (tp + fp)
          recall = tp / (tp + fn)
          f1 = 2 * precision * recall / (precision + recall)
          print(f"{cutoff:6d}  {tp:2d} {fp:2d} {fn:2d}  {precision:9.2f}  {recall:6.2f}  {f1:5.2f}")

      # AUC: the chance a random defect outscores a random good part
      pairs = [(d, g) for d in scores[defect == 1] for g in scores[defect == 0]]
      print("AUC =", np.mean([d > g for d, g in pairs]))
      ```

      F1 peaks at cutoff 25 (0.80): every defect caught, at the price of two false alarms. The AUC is 0.75 because 12 of the 16 defect–good pairs are ranked correctly.

      But the best cutoff depends on the job, not on F1. Say the inspector can check only three parts per batch: cutoff 70 flags exactly three and catches two defects. If a shipped defect costs 20 times as much as an inspection, cutoff 25 is worth its extra false alarm. Same scores, same AUC, different decisions. Add your own cutoffs to the list, such as 80 or 40, and check them against the activity.
    bridges: []
  - id: classification-metrics.s4
    title: Read the mistakes, not just the score
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.classification-metrics
    markdown: |-
      Numbers tell you how many mistakes; looking at them tells you why. Back at the factory, the manager pulls the six missed defects and sorts them by what they have in common:

      | Group | Missed defects |
      | --- | ---: |
      | Night shift, with glare on the part | 4 |
      | Hairline cracks under 1 mm | 1 |
      | Label was wrong: part was actually fine | 1 |

      Four of the six misses share one cause, and it isn't the model's math: it's the lighting. Fix the lamp, or collect night-shift training images, and recall could jump. The mislabeled part is a reminder to check labels too. This habit is called **error analysis**: group the mistakes, find the largest group, and fix that first.

      Keep sample size in mind while you do it: recall measured on 12 defects can swing a lot from week to week, so gather more defects before trusting a small change.
    bridges: []
  - id: classification-metrics.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.classification-metrics
    markdown: Compute precision, recall, and F1 from counts, then pick metrics and cutoffs for fraud alerts, cancer screening, review queues, and rare events.
    takeaway: |-
      Precision asks how many flags were right; recall asks how many real positives were caught. Choose the cutoff from the costs of each mistake and the team's capacity, and look at the mistakes themselves.
  - id: classification-metrics.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.classification-metrics
    markdown: |-
      Precision asks how many flags are correct. Recall asks how many real positives were found. Compare both, along with false alarms and the consequences of each mistake.
