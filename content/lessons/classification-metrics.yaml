schema_version: 0.2-draft
lesson:
  id: classification-metrics
  version: 0.1.0-draft
  title: Look inside the average score
  state: draft
  summary: Confusion matrices, precision, recall, threshold curves, and error analysis reveal different aspects
    of prediction quality and should be interpreted with class prevalence and costs.
  slot: M07.8
  category: learning
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.classification-metrics
  version: 1-draft
  statement: Confusion matrices, precision, recall, threshold curves, and error analysis reveal different aspects
    of prediction quality and should be interpreted with class prevalence and costs.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - classification-metrics.base
  - classification-metrics.transfer
  prerequisites:
  - anyOf:
    - objective.logistic-regression
  - anyOf:
    - objective.baselines-and-success
scenes:
- id: classification-metrics.s1
  title: Count the error types
  type: explanation
  depth: intuition
  objective_refs:
  - objective.classification-metrics
  markdown: For a positive class, a true positive is correctly flagged and a false positive is incorrectly flagged.
    A false negative misses a positive; a true negative correctly rejects a negative. The confusion matrix keeps
    these counts separate. Decide which class is positive before interpreting a metric.
  text_mode: For a positive class, a true positive is correctly flagged and a false positive is incorrectly flagged.
    A false negative misses a positive; a true negative correctly rejects a negative. The confusion matrix keeps
    these counts separate. Decide which class is positive before interpreting a metric.
  bridges: []
- id: classification-metrics.s2
  title: Compute precision and recall
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.classification-metrics
  markdown: 'Suppose a detector flags 10 cases, of which 6 are real positives, and there are 12 positives overall.
    Precision is 6/10 = 0.6: how many flags are right. Recall is 6/12 = 0.5: how many positives were found. Neither
    alone reports the full pattern of errors.'
  text_mode: 'Suppose a detector flags 10 cases, of which 6 are real positives, and there are 12 positives overall.
    Precision is 6/10 = 0.6: how many flags are right. Recall is 6/12 = 0.5: how many positives were found. Neither
    alone reports the full pattern of errors.'
  bridges:
  - arithmetic
  - statistics-evidence
- id: classification-metrics.s3
  title: Move a threshold and inspect the tradeoff
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.classification-metrics
  markdown: Lowering a score threshold often increases both true and false positives. ROC curves compare true-positive
    and false-positive rates; precision-recall curves focus on positive retrieval and depend on prevalence. AUC
    summarizes a curve but does not choose an operating threshold for a particular cost or capacity.
  text_mode: Lowering a score threshold often increases both true and false positives. ROC curves compare true-positive
    and false-positive rates; precision-recall curves focus on positive retrieval and depend on prevalence. AUC
    summarizes a curve but does not choose an operating threshold for a particular cost or capacity.
  bridges: []
- id: classification-metrics.s4
  title: Explain failures with examples
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.classification-metrics
  markdown: Group errors by conditions such as lighting, length, source, or subgroup. Inspect labeling mistakes
    and ambiguous cases. Use confidence intervals when comparing models and keep the analysis separate from an untouched
    final test where possible. Choose a model for the intended decision, not a single flattering metric.
  text_mode: Group errors by conditions such as lighting, length, source, or subgroup. Inspect labeling mistakes
    and ambiguous cases. Use confidence intervals when comparing models and keep the analysis separate from an untouched
    final test where possible. Choose a model for the intended decision, not a single flattering metric.
  bridges: []
- id: classification-metrics.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.classification-metrics
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Confusion matrices, precision, recall, threshold curves, and error analysis reveal different aspects
    of prediction quality and should be interpreted with class prevalence and costs.
- id: classification-metrics.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.classification-metrics
  markdown: Confusion matrices, precision, recall, threshold curves, and error analysis reveal different aspects
