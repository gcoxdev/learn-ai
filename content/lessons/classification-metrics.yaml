assessment_families:
  - id: classification-metrics.base
    objective_ref: objective.classification-metrics
    task: base
    response_type: single_choice
    points: 1
    hint: 'Compute precision and recall: trace the inputs, operation, and result before choosing.'
    remediation_scene: classification-metrics.s2
    variants:
      - id: classification-metrics.base.1
        prompt: Of 20 flagged cases, 15 are real positives. What is precision?
        options:
          - id: a
            text: '0.75'
          - id: b
            text: '0.2'
          - id: c
            text: '15'
        answer: a
        feedback: Precision divides true positives by all flagged positives.
        retired: true
      - id: classification-metrics.base.2
        prompt: There are 30 actual positives and 12 are found. What is recall?
        options:
          - id: b
            text: '0.6'
          - id: c
            text: '2.5'
          - id: a
            text: '0.4'
        answer: a
        feedback: Recall divides detected positives by all actual positives.
        retired: true
  - id: classification-metrics.transfer
    objective_ref: objective.classification-metrics
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Explain failures with examples: trace the inputs, operation, and result before choosing.'
    remediation_scene: classification-metrics.s4
    variants:
      - id: classification-metrics.transfer.1
        prompt: A model has high ROC AUC. Does that choose the best threshold for a limited review team?
        options:
          - id: b
            text: Yes; AUC is a threshold
          - id: c
            text: Only if the dataset is large
          - id: a
            text: No; capacity and costs still determine an operating choice
        answer: a
        feedback: A ranking summary does not specify a deployment decision rule.
        retired: true
      - id: classification-metrics.transfer.2
        prompt: Two models have the same accuracy but different missed-positive counts. What should comparison include?
        options:
          - id: c
            text: Only model size
          - id: a
            text: The full error pattern and consequences
          - id: b
            text: Only accuracy again
        answer: a
        feedback: Equal overall accuracy can hide materially different failures.
        retired: true
  - id: classification-metrics.base.v2
    objective_ref: objective.classification-metrics
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Precision divides TP by everything flagged (TP + FP). Recall divides TP by everything truly positive (TP + FN). F1 = 2 × precision × recall ÷ (precision + recall).
    remediation_scene: classification-metrics.s2
    variants:
      - id: classification-metrics.base.v2.1
        prompt: 'A spam filter''s week: 8 true positives, 2 false positives, 8 false negatives. Find precision, recall, and F1 (two decimals).'
        feedback: Precision = 8/(8 + 2) = 0.8, recall = 8/(8 + 8) = 0.5, and F1 = 2 × 0.8 × 0.5 / 1.3 ≈ 0.62. The filter's flags are mostly right, but it lets half the spam through.
        answers:
          precision: 0.8
          recall: 0.5
          f1: 0.615
        reason_answer: denominators
        reason_options:
          - id: denominators
            text: Precision divides TP by all flagged cases; recall divides TP by all real positives.
          - id: swapped
            text: Precision divides TP by all real positives; recall divides TP by all flagged cases.
          - id: accuracy
            text: Both divide the correct predictions by the total number of cases.
      - id: classification-metrics.base.v2.2
        prompt: 'A screening test''s month: 9 true positives, 3 false positives, 1 false negative. Find precision, recall, and F1 (two decimals).'
        feedback: Precision = 9/12 = 0.75, recall = 9/10 = 0.9, and F1 = 2 × 0.75 × 0.9 / 1.65 ≈ 0.82.
        answers:
          precision: 0.75
          recall: 0.9
          f1: 0.818
        reason_answer: denominators
        reason_options:
          - id: swapped
            text: Precision divides TP by all real positives; recall divides TP by all flagged cases.
          - id: denominators
            text: Precision divides TP by all flagged cases; recall divides TP by all real positives.
          - id: accuracy
            text: Both divide the correct predictions by the total number of cases.
      - id: classification-metrics.base.v2.3
        prompt: 'A fraud model''s day: 3 true positives, 1 false positive, 3 false negatives. Find precision, recall, and F1 (two decimals).'
        feedback: Precision = 3/4 = 0.75, recall = 3/6 = 0.5, and F1 = 2 × 0.75 × 0.5 / 1.25 = 0.6.
        answers:
          precision: 0.75
          recall: 0.5
          f1: 0.6
        reason_answer: denominators
        reason_options:
          - id: accuracy
            text: Both divide the correct predictions by the total number of cases.
          - id: swapped
            text: Precision divides TP by all real positives; recall divides TP by all flagged cases.
          - id: denominators
            text: Precision divides TP by all flagged cases; recall divides TP by all real positives.
      - id: classification-metrics.base.v2.4
        prompt: 'A cautious defect camera: 20 true positives, 30 false positives, 0 false negatives. Find precision, recall, and F1 (two decimals).'
        feedback: Precision = 20/50 = 0.4, recall = 20/20 = 1.0, and F1 = 2 × 0.4 × 1.0 / 1.4 ≈ 0.57. Catching every defect doesn't make up for three false alarms in every five flags.
        answers:
          precision: 0.4
          recall: 1
          f1: 0.571
        reason_answer: denominators
        reason_options:
          - id: denominators
            text: Precision divides TP by all flagged cases; recall divides TP by all real positives.
          - id: accuracy
            text: Both divide the correct predictions by the total number of cases.
          - id: swapped
            text: Precision divides TP by all real positives; recall divides TP by all flagged cases.
    absolute_tolerance: 0.01
    numeric_fields:
      - id: precision
        label: Precision
      - id: recall
        label: Recall
      - id: f1
        label: F1 score
  - id: classification-metrics.transfer.v2
    objective_ref: objective.classification-metrics
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name the costly mistake and the team's capacity first. Then pick the metric or cutoff that tracks that mistake, rather than overall accuracy.
    remediation_scene: classification-metrics.s5
    variants:
      - id: classification-metrics.transfer.v2.1
        prompt: About 1 in 200 card payments is fraudulent. A new model reports 99.5% accuracy on a month of payments. What should you check before celebrating?
        options:
          - id: a
            text: Its precision, since accuracy already covers the missed frauds
          - id: b
            text: Its recall, since flagging nothing would also score 99.5%
          - id: c
            text: Its AUC, since accuracy can't be computed on imbalanced data
        answer: b
        feedback: A model that never flags fraud is right on 199 of every 200 payments, which is exactly 99.5%. Recall shows how many frauds it actually caught. Accuracy doesn't reveal the misses, and it can be computed on any data; it just says little here.
      - id: classification-metrics.transfer.v2.2
        prompt: A support team can review 50 flagged accounts a day. The abuse model has an AUC of 0.92. How should the team set its cutoff?
        options:
          - id: c
            text: Choose the cutoff that flags about 50 accounts on a typical day
          - id: b
            text: Set the cutoff at 0.92, matching the model's AUC value
          - id: a
            text: Keep the default of 0.5, since a high AUC means it's calibrated
        answer: c
        feedback: AUC summarizes how well the model ranks accounts across every cutoff; it doesn't pick one. Capacity does, so rank by score and flag about as many as the team can review. A high AUC says nothing about calibration, and 0.92 isn't a score threshold.
      - id: classification-metrics.transfer.v2.3
        prompt: A clinic chooses between two cutoffs for a cheap first-round cancer screen, after which positives get a more careful test. Which metric should matter most for the first round?
        options:
          - id: c
            text: Precision, so that few healthy people are sent for the second test
          - id: b
            text: Accuracy, since it balances both kinds of mistake together
          - id: a
            text: Recall, so that few real cancers are missed by the first screen
        answer: a
        feedback: A cancer missed at the first round never reaches the careful test, while a false alarm only costs a second test. So the first round should favor recall. Accuracy would let the many healthy patients dominate the score.
      - id: classification-metrics.transfer.v2.4
        prompt: 'Two defect models both score 96% accuracy on 1,000 parts. Model A has 10 misses and 30 false alarms; model B has 30 misses and 10 false alarms. A miss costs $50 and a false alarm $2. Which is better?'
        options:
          - id: b
            text: B, since it raises fewer false alarms for inspectors to check
          - id: c
            text: A, whose mistakes cost $560 against B's $1,520
          - id: a
            text: They tie, since both make 40 mistakes out of 1,000
        answer: c
        feedback: A costs 10 × 50 + 30 × 2 = $560 and B costs 30 × 50 + 10 × 2 = $1,520. Equal accuracy hides very different mistakes; weight each kind by what it costs.
      - id: classification-metrics.transfer.v2.5
        prompt: A churn model has an AUC of 0.80. What does that number mean?
        options:
          - id: a
            text: At its best cutoff, the model classifies 80% of customers correctly
          - id: c
            text: Of the customers it flags, 80% really do go on to leave
          - id: b
            text: A random leaver outscores a random stayer 80% of the time
        answer: b
        feedback: AUC is a ranking measure across all cutoffs. It's the chance that a randomly chosen positive gets a higher score than a randomly chosen negative. "80% correct at the best cutoff" is an accuracy, and "80% of flags are right" is a precision.
      - id: classification-metrics.transfer.v2.6
        prompt: A model is tested on a balanced set (half positives), then deployed where only 1% of cases are positive. Its scores for each class behave the same in both places. Which number drops sharply after deployment?
        options:
          - id: c
            text: Recall, since there are now far fewer positives left to catch
          - id: a
            text: Precision, since false alarms now greatly outnumber real hits
          - id: b
            text: The false positive rate, since negative cases now dominate the data
        answer: a
        feedback: Recall and the false positive rate are each computed within one class, so they stay the same. But with 99 negatives per positive, even a small false positive rate produces many false alarms per real hit, so precision falls. That's why precision–recall curves matter for rare events.
