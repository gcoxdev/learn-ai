lesson:
  id: mixed-precision-training
  version: 0.4.0-draft
  title: Spend numerical precision where it is needed
  state: draft
  summary: Store a gradient of 1 × 10⁻⁹ in fp16 and it becomes exactly zero. See how bits split between range and precision, and how loss scaling rescues small gradients.
  slot: M17.6
  category: learning
  sources:
    - title: "Mixed Precision Training (Micikevicius et al., 2017)"
      url: https://arxiv.org/abs/1710.03740
    - title: "A Study of BFLOAT16 for Deep Learning Training (Kalamkar et al., 2019)"
      url: https://arxiv.org/abs/1905.12322
    - title: "FP8 Formats for Deep Learning (Micikevicius et al., 2022)"
      url: https://arxiv.org/abs/2209.05433
    - title: PyTorch automatic mixed precision and GradScaler documentation
      url: https://docs.pytorch.org/docs/stable/amp.html
    - title: DeepSeek-V3 Technical Report
      url: https://arxiv.org/abs/2412.19437
objectives:
  - id: objective.mixed-precision-training
    version: 3-draft
    statement: Mixed precision uses different number formats for selected tensors and operations; scaling, accumulation, and stability checks protect training while reducing storage or increasing throughput.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - mixed-precision-training.base.v2
      - mixed-precision-training.transfer.v2
      - mixed-precision-training.calculate
    prerequisites:
      - anyOf:
          - objective.numerical-computing
      - anyOf:
          - objective.stable-training
scenes:
  - id: mixed-precision-training.s1
    title: Bits for range, bits for precision
    type: explanation
    depth: intuition
    objective_refs:
      - objective.mixed-precision-training
    markdown: |-
      Late in training, many of the team's gradients are tiny. A gradient of 4 × 10⁻⁸ is small but meaningful. Store it in fp16, a 16-bit format, and it comes back as 6 × 10⁻⁸, 50% too big. A gradient of 1 × 10⁻⁹ comes back as exactly 0. Yet a 16-bit format is what makes the A100 reach 312 TFLOP/s. Which 16 bits you pick matters.

      A floating-point number is scientific notation in binary: a sign, an **exponent** that sets the scale (the "× 2⁻²⁰" part), and a **mantissa** that holds the significant digits. Exponent bits buy **range**, how large and how small a number can be. Mantissa bits buy **precision**, how close two neighboring numbers are. Here are the formats training uses, including **BF16** ("brain float", a 16-bit format from Google Brain) and two 8-bit FP8 formats:

      | Format | Exponent bits | Mantissa bits | Largest value | Smallest normal value | Gap just above 1 |
      | --- | ---: | ---: | ---: | ---: | ---: |
      | FP32 | 8 | 23 | 3.4 × 10³⁸ | 1.2 × 10⁻³⁸ | 1.2 × 10⁻⁷ |
      | FP16 | 5 | 10 | 65,504 | 6.1 × 10⁻⁵ | 9.8 × 10⁻⁴ |
      | BF16 | 8 | 7 | 3.4 × 10³⁸ | 1.2 × 10⁻³⁸ | 7.8 × 10⁻³ |
      | FP8 E4M3 | 4 | 3 | 448 | 1.6 × 10⁻² | 0.125 |
      | FP8 E5M2 | 5 | 2 | 57,344 | 6.1 × 10⁻⁵ | 0.25 |

      Each has one sign bit too. FP16 can go a little below its smallest normal value using reduced-precision *subnormal* numbers, down to about 6 × 10⁻⁸. That's why 4 × 10⁻⁸ became 6 × 10⁻⁸ and 1 × 10⁻⁹ vanished. BF16 keeps FP32's 8 exponent bits and so its full range, but has only 7 mantissa bits. The number-format table in the lesson on stable training showed the same trade.

      :::mixup "BF16 is a more precise version of FP16."
      It's the other way round. BF16 has fewer mantissa bits (7 vs 10), so it's *less* precise, but its range is vastly wider. Large-model training mostly picked BF16 because running out of range is fatal, while losing a few digits usually isn't.
      :::
    bridges: []
  - id: mixed-precision-training.s2
    title: Mix formats across the computation
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.mixed-precision-training
    markdown: |-
      "Mixed" means each tensor gets the format its job needs:

      | Data | Format | Why |
      | --- | --- | --- |
      | Matmul inputs (weights, activations) | BF16 or FP16 | Half the bytes and fast tensor cores |
      | Sums inside each matmul | FP32 | Adding thousands of products loses digits in 16 bits |
      | Master weights, Adam $m$ and $v$ | FP32 | Updates are tiny compared with the weights |
      | Softmax, normalization, loss | Often FP32 | Exponentials and sums over many values |

      The master copy exists because of the "gap just above 1" column. A weight of 1.0 in FP16 has neighbors about 0.001 apart. Add an update of 0.0001 and the result rounds straight back to 1.0. Do that a thousand times and the weight never moves, though it should have reached 1.1. In FP32 the gap is about 10⁻⁷, so every update counts. This is why the budget in the lesson on training memory includes a 4-byte master copy.
    bridges:
      - numerical-computing
  - id: mixed-precision-training.s3
    title: Scale the loss up, then scale the gradients down
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.mixed-precision-training
    markdown: |-
      FP16's tiny range is the problem, but gradients are linear in the loss. Multiply the loss by a **loss scale** $S$ before the backward pass, and every gradient comes out $S$ times larger, lifted clear of the underflow zone. Before the optimizer step, divide by $S$ in FP32 to get the true gradients back.

      :::papers Mixed Precision Training (Micikevicius et al., 2017)
      The recipe had three parts: keep an FP32 master copy of the weights, accumulate FP16 products into FP32, and scale the loss:

      $$\nabla_\theta (S \cdot \mathcal{L}) = S \cdot \nabla_\theta \mathcal{L}, \qquad g_{\text{true}} = \frac{g_{\text{fp16}}}{S}$$

      With $S = 2^{16} = 65{,}536$, a gradient of 1 × 10⁻⁹ becomes 6.6 × 10⁻⁵, just above FP16's smallest normal value.
      :::

      ```python run
      import numpy as np

      grads = np.array([3e-3, 2e-5, 4e-8, 1e-9])      # true gradients (fp32)
      print("fp16 as-is:    ", grads.astype(np.float16))  # small ones distort or vanish

      S = np.float32(2**16)                            # loss scale 65,536
      scaled = (grads * S).astype(np.float16)          # backward pass in fp16
      print("scaled in fp16:", scaled)
      print("unscaled fp32: ", scaled.astype(np.float32) / S)   # unscale in fp32

      with np.errstate(over="ignore"):                 # fp16 tops out at 65,504
          print("3e-3 x 2**25 in fp16:", np.float16(3e-3 * 2**25))

      # Why an fp32 master copy: tiny updates vanish next to a weight of 1.0
      w16, w32 = np.float16(1.0), np.float32(1.0)
      for _ in range(1000):
          w16 = np.float16(w16 + np.float16(1e-4))
          w32 = np.float32(w32 + np.float32(1e-4))
      print("1.0 + 1000 updates of 1e-4:  fp16 ->", w16, "  fp32 ->", w32)
      ```

      All four gradients survive the round trip within 0.1%. Try `S = np.float32(2**4)` and watch 1 × 10⁻⁹ vanish again: scaled, it is only 1.6 × 10⁻⁸, less than half of FP16's smallest subnormal (about 6 × 10⁻⁸), so it rounds to 0.

      :::predict What goes wrong if the scale is too big?
      The largest gradients overflow. 0.003 × 2²⁵ ≈ 100,000, beyond FP16's 65,504, so it becomes infinity, as the program shows. **Dynamic loss scaling** handles both ends: if any gradient is infinite or NaN, skip this update and halve $S$; after a long run of clean steps, double it. PyTorch's `GradScaler` starts at 65,536 and tries doubling after 2,000 clean steps.
      :::

      BF16 has FP32's range, so BF16 training usually needs no loss scaling at all. That's the main reason the team trains in BF16.
    bridges: []
  - id: mixed-precision-training.s4
    title: FP8, and checking against a reference
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.mixed-precision-training
    markdown: |-
      NVIDIA's H100 added FP8 tensor cores, which double the matmul rate again and halve the bytes once more. With just 8 bits, one format can't serve everything, so the FP8 proposal (Micikevicius et al., 2022) defined two: **E4M3** (more precision, maximum 448) for weights and activations, and **E5M2** (more range) for gradients.

      Even E5M2's range is narrow, so every FP8 tensor carries its own scale factor, chosen from the tensor's recent largest values. DeepSeek-V3 (2024) went further and trained largely in FP8, with a separate scale for each small block of each tensor, so one outlier can't ruin the scale for its neighbors. Sums still accumulate at higher precision.

      Before trusting a lower-precision recipe on a long run, compare it with a trusted one. Run a few thousand steps in both BF16 and the new format, then compare loss curves, gradient norms, and counts of infinite or NaN values step by step. If the curves separate, find the first layer whose values overflow or underflow.
    bridges: []
  - id: mixed-precision-training.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.mixed-precision-training
    markdown: Loss scales to pick, spacing to compute, a BF16 switch, a forgotten unscale, and an FP8 gradient problem test whether you can tell which bits a calculation is short of.
    takeaway: |-
      Exponent bits give range and mantissa bits give precision. Run the matmuls in 16 or 8 bits, keep master weights and sums in FP32, and scale the loss when FP16's narrow range would flush small gradients to zero.
  - id: mixed-precision-training.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.mixed-precision-training
    markdown: |-
      Mixed precision uses different number formats where they are useful. Track storage, accumulation, and gradient scaling separately, and compare training behavior against a stable reference.
