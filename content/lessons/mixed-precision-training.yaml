assessment_families:
  - id: mixed-precision-training.base
    objective_ref: objective.mixed-precision-training
    task: base
    response_type: single_choice
    points: 1
    hint: 'Mix formats across the computation: trace the inputs, operation, and result before choosing.'
    remediation_scene: mixed-precision-training.s2
    variants:
      - id: mixed-precision-training.base.1
        prompt: What does exponent capacity mainly affect?
        options:
          - id: b
            text: Dataset language count
          - id: c
            text: The number of neural layers
          - id: a
            text: Representable magnitude range
        answer: a
        feedback: Range differs from significand precision.
        retired: true
      - id: mixed-precision-training.base.2
        prompt: Must low-precision multiplication use low-precision accumulation?
        options:
          - id: c
            text: Only in inference
          - id: a
            text: No; accumulation may use a higher precision
          - id: b
            text: 'Yes'
        answer: a
        feedback: Mixed precision assigns formats to distinct operations.
        retired: true
  - id: mixed-precision-training.transfer
    objective_ref: objective.mixed-precision-training
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Compare against a stable reference: trace the inputs, operation, and result before choosing.'
    remediation_scene: mixed-precision-training.s4
    variants:
      - id: mixed-precision-training.transfer.1
        prompt: Why unscale gradients before updating parameters?
        options:
          - id: c
            text: To increase the vocabulary
          - id: a
            text: To restore the intended update magnitude
          - id: b
            text: To erase every rounding error
        answer: a
        feedback: Loss scaling changes gradient scale and must be accounted for.
        retired: true
      - id: mixed-precision-training.transfer.2
        prompt: One batch runs without NaNs. Does that validate a long mixed-precision run?
        options:
          - id: a
            text: No; monitor sustained stability and quality
          - id: b
            text: 'Yes'
          - id: c
            text: Only if loss is below one
        answer: a
        feedback: Numerical behavior can change across training conditions.
        retired: true
  - id: mixed-precision-training.base.v2
    objective_ref: objective.mixed-precision-training
    task: base
    response_type: single_choice
    points: 1
    hint: Ask whether the value is too big or too small for the format (an exponent problem) or too close to its neighbors to tell apart (a mantissa problem).
    remediation_scene: mixed-precision-training.s1
    variants:
      - id: mixed-precision-training.base.v2.1
        prompt: Which 16-bit format keeps FP32's full exponent range but has only 7 mantissa bits?
        options:
          - id: b
            text: FP16
          - id: a
            text: BF16
          - id: c
            text: FP8 E5M2
        answer: a
        feedback: BF16 keeps FP32's 8 exponent bits and trims the mantissa to 7. FP16 has 5 exponent and 10 mantissa bits; E5M2 is an 8-bit format.
      - id: mixed-precision-training.base.v2.2
        prompt: A gradient of 1 × 10⁻⁹ becomes exactly 0 when stored in FP16. Which limit of FP16 causes this?
        options:
          - id: a
            text: Its 5 exponent bits can't reach numbers that small
          - id: b
            text: Its 10 mantissa bits can't hold that many digits
          - id: c
            text: Its single sign bit rounds tiny values toward zero
        answer: a
        feedback: How small a number can get is set by the exponent. FP16 bottoms out near 6 × 10⁻⁸ even with subnormals, so 10⁻⁹ underflows. The mantissa controls spacing between neighbors, not the smallest magnitude.
      - id: mixed-precision-training.base.v2.3
        prompt: Why keep an FP32 master copy of the weights when the forward and backward passes run in BF16?
        options:
          - id: c
            text: BF16 can't represent weights with an absolute value above 1
          - id: b
            text: GPUs can't run an optimizer update on BF16 tensors at all
          - id: a
            text: Small updates round away when added to much larger BF16 weights
        answer: a
        feedback: Near 1.0, BF16 values are about 0.008 apart, so an update of 0.0001 rounds straight back to the old weight. FP32's spacing, about 10⁻⁷, lets every update land. BF16 handles large values fine.
      - id: mixed-precision-training.base.v2.4
        prompt: With dynamic loss scaling at a scale of 65,536, the FP16 gradients contain an infinity. What does the scaler do?
        options:
          - id: b
            text: Clip the infinite values to 65,504 and apply the update
          - id: a
            text: Skip this update and halve the scale for the next step
          - id: c
            text: Double the scale so the small gradients stay representable
        answer: a
        feedback: An infinity means the scale is too high and this step's gradients are unusable, so the step is skipped and the scale halved. Clipping would apply a corrupted gradient, and doubling makes the overflow worse.
  - id: mixed-precision-training.transfer.v2
    objective_ref: objective.mixed-precision-training
    task: transfer
    response_type: single_choice
    points: 1
    hint: Place the numbers involved on the format's range (largest and smallest values) and spacing, then ask which step of the recipe protects that end.
    remediation_scene: mixed-precision-training.s3
    variants:
      - id: mixed-precision-training.transfer.v2.1
        prompt: A team moves from FP16 with loss scaling to BF16 and removes the loss scaler entirely. Why is that usually safe?
        options:
          - id: a
            text: BF16 shares FP32's exponent range, so small gradients don't underflow
          - id: b
            text: BF16 has more mantissa bits, so gradients are stored more precisely
          - id: c
            text: BF16 kernels scale the loss internally without needing any settings
        answer: a
        feedback: Loss scaling exists to lift gradients out of FP16's underflow zone. BF16's 8 exponent bits reach about 10⁻³⁸, so that zone isn't a problem. BF16 actually has fewer mantissa bits than FP16.
      - id: mixed-precision-training.transfer.v2.2
        prompt: In an FP16 model, some activations briefly reach 80,000 during a loss spike. What happens to them?
        options:
          - id: c
            text: They keep their size but lose a few digits of precision
          - id: b
            text: They are clamped to 65,504 and training carries on normally
          - id: a
            text: They overflow to infinity, which soon produces NaNs downstream
        answer: a
        feedback: FP16's largest value is 65,504; anything larger rounds to infinity, and infinity minus infinity or zero times infinity gives NaN. Standard casts don't clamp.
      - id: mixed-precision-training.transfer.v2.3
        prompt: A team using plain SGD scales the loss by 1,024 but forgets to unscale the gradients before the update. What happens?
        options:
          - id: b
            text: Nothing, since the scale cancels out during the backward pass
          - id: a
            text: Every update is 1,024 times too large, likely causing divergence
          - id: c
            text: Every update is 1,024 times too small, so training barely moves
        answer: a
        feedback: Scaling the loss scales every gradient by 1,024, and SGD's step is proportional to the gradient, so the effective learning rate jumps 1,024-fold. The scale only disappears if you divide it out.
      - id: mixed-precision-training.transfer.v2.4
        prompt: A team stores gradients in FP8 E4M3 with one scale factor per tensor. Values span 10⁻⁷ to 10⁻¹, and the tiny ones vanish. Which change follows standard FP8 practice?
        options:
          - id: c
            text: Raise the learning rate so the tiny gradients have a larger effect
          - id: b
            text: Lower the scale factor so the largest gradients are never clipped
          - id: a
            text: Use the wider-range E5M2 for gradients, with finer-grained scales
        answer: a
        feedback: E5M2 trades a mantissa bit for range, which is why the FP8 proposal assigns it to gradients, and per-block scales keep one large value from setting the scale for everything. Lowering the scale pushes small values further into underflow.
  - id: mixed-precision-training.calculate
    objective_ref: objective.mixed-precision-training
    task: base
    response_type: numeric
    points: 1
    hint: "A format with m mantissa bits has neighbors 2⁻ᵐ apart just above 1, and that gap doubles each time the value doubles. Unscaling divides by the loss scale; FP16 overflows above 65,504."
    remediation_scene: mixed-precision-training.s3
    absolute_tolerance: 0.0001
    variants:
      - id: mixed-precision-training.calculate.1
        prompt: The largest gradient in a model is 0.5, and FP16's largest value is 65,504. What is the largest power-of-two exponent k such that a loss scale of 2ᵏ doesn't overflow that gradient?
        answer: 17
        feedback: 0.5 × 2¹⁶ = 32,768 fits, but 0.5 × 2¹⁷ = 65,536 is just above 65,504 and overflows, so the largest safe k is 16.
        retired: true
      - id: mixed-precision-training.calculate.2
        prompt: With a loss scale of 1,024, a gradient reads 5.12 in FP16. What is the true gradient?
        answer: 0.005
        feedback: Divide by the scale in FP32, 5.12 ÷ 1,024 = 0.005.
      - id: mixed-precision-training.calculate.3
        prompt: BF16 has 7 mantissa bits, so neighboring values just above 1 are 2⁻⁷ apart. How far apart are neighboring BF16 values just above 256?
        answer: 2
        feedback: "256 = 2⁸, so the gap grows by a factor of 2⁸, giving 2⁻⁷ × 2⁸ = 2. In BF16, 256 + 1 rounds back to 256."
      - id: mixed-precision-training.calculate.4
        prompt: FP16 neighbors just above 1 are about 0.000977 apart. You add an update of 0.0003 to a weight of 1.0 in FP16. What value is stored?
        answer: 1
        feedback: 1.0003 is closer to 1.0 than to the next FP16 value, 1.000977, so it rounds back to 1.0. The update is lost, which is why master weights stay in FP32.
      - id: mixed-precision-training.calculate.5
        prompt: FP8 E4M3 has 3 mantissa bits. How far apart are its neighboring values just above 1?
        answer: 0.125
        feedback: 2⁻³ = 0.125, so E4M3 can represent 1, 1.125, 1.25, and so on, but nothing in between.
      - id: mixed-precision-training.calculate.6
        prompt: How many GB of memory does storing a 7-billion-parameter model's weights in FP8 instead of BF16 save?
        answer: 7
        feedback: BF16 is 2 bytes per weight (14 GB) and FP8 is 1 byte (7 GB), a saving of 7 GB.
      - id: mixed-precision-training.calculate.7
        prompt: The largest gradient in a model is about 3, and FP16's largest value is 65,504. What is the largest whole number k for which a loss scale of 2ᵏ keeps that gradient finite in FP16?
        answer: 14
        feedback: 3 × 2¹⁴ = 49,152 fits under 65,504, but 3 × 2¹⁵ = 98,304 overflows to infinity. So k = 14; one doubling more and the scaler would have to skip the step and halve the scale.
