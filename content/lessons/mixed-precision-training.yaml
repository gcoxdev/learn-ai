scenes:
- id: mixed-precision-training.s1
  title: A format has range and resolution
  type: explanation
  depth: intuition
  objective_refs:
  - objective.mixed-precision-training
  markdown: Floating-point formats allocate bits to sign, exponent, and significand. Exponent capacity affects the
    range of magnitudes; significand capacity affects precision within that range. Two formats with the same total
    bits can fail differently through overflow, underflow, or rounding.
  text_mode: Floating-point formats allocate bits to sign, exponent, and significand. Exponent capacity affects
    the range of magnitudes; significand capacity affects precision within that range. Two formats with the same
    total bits can fail differently through overflow, underflow, or rounding.
  bridges: []
- id: mixed-precision-training.s2
  title: Mix formats across the computation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mixed-precision-training
  markdown: A recipe may store some weights and activations in a lower precision while accumulating sums or maintaining
    optimizer state in higher precision. Multiplying low-precision inputs does not imply that every intermediate
    and update uses that same format. Hardware support and kernel design determine actual throughput.
  text_mode: A recipe may store some weights and activations in a lower precision while accumulating sums or maintaining
    optimizer state in higher precision. Multiplying low-precision inputs does not imply that every intermediate
    and update uses that same format. Hardware support and kernel design determine actual throughput.
  bridges:
  - numerical-computing
- id: mixed-precision-training.s3
  title: Scale carefully, then undo it
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mixed-precision-training
  markdown: Loss scaling multiplies a loss before backward computation to keep some small gradients representable,
    then unscales gradients before the optimizer update. Dynamic schemes detect nonfinite values and adjust scale.
    Scaling does not cure every instability or restore information already lost through quantization.
  text_mode: Loss scaling multiplies a loss before backward computation to keep some small gradients representable,
    then unscales gradients before the optimizer update. Dynamic schemes detect nonfinite values and adjust scale.
    Scaling does not cure every instability or restore information already lost through quantization.
  bridges: []
- id: mixed-precision-training.s4
  title: Compare against a stable reference
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mixed-precision-training
  markdown: Monitor nonfinite values, gradient distributions, loss trajectories, and held-out quality. Low-bit formats
    such as FP8 require recipe-specific scaling and accumulation choices. A single successful forward pass does
    not establish stable long-run training, especially after a distribution or learning-rate change.
  text_mode: Monitor nonfinite values, gradient distributions, loss trajectories, and held-out quality. Low-bit
    formats such as FP8 require recipe-specific scaling and accumulation choices. A single successful forward pass
    does not establish stable long-run training, especially after a distribution or learning-rate change.
  bridges: []
- id: mixed-precision-training.check
