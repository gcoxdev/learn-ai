assessment_families:
- id: mixed-precision-training.base
  objective_ref: objective.mixed-precision-training
  task: base
  response_type: single_choice
  points: 1
  hint: 'Mix formats across the computation: trace the inputs, operation, and result before choosing.'
  remediation_scene: mixed-precision-training.s2
  variants:
  - id: mixed-precision-training.base.1
    prompt: What does exponent capacity mainly affect?
    options:
    - id: b
      text: Dataset language count
    - id: c
      text: The number of neural layers
    - id: a
      text: Representable magnitude range
    answer: a
    feedback: Range differs from significand precision.
  - id: mixed-precision-training.base.2
    prompt: Must low-precision multiplication use low-precision accumulation?
    options:
    - id: c
      text: Only in inference
    - id: a
      text: No; accumulation may use a higher precision
    - id: b
      text: 'Yes'
    answer: a
    feedback: Mixed precision assigns formats to distinct operations.
- id: mixed-precision-training.transfer
  objective_ref: objective.mixed-precision-training
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Compare against a stable reference: trace the inputs, operation, and result before choosing.'
  remediation_scene: mixed-precision-training.s4
  variants:
  - id: mixed-precision-training.transfer.1
    prompt: Why unscale gradients before updating parameters?
    options:
    - id: c
      text: To increase the vocabulary
    - id: a
      text: To restore the intended update magnitude
    - id: b
      text: To erase every rounding error
    answer: a
    feedback: Loss scaling changes gradient scale and must be accounted for.
  - id: mixed-precision-training.transfer.2
    prompt: One batch runs without NaNs. Does that validate a long mixed-precision run?
    options:
    - id: a
      text: No; monitor sustained stability and quality
    - id: b
      text: 'Yes'
    - id: c
      text: Only if loss is below one
    answer: a
    feedback: Numerical behavior can change across training conditions.
