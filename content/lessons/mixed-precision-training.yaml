lesson:
  id: mixed-precision-training
  version: 0.3.0-draft
  title: Spend numerical precision where it is needed
  state: draft
  summary: Use different number formats deliberately, and trace why a scaled gradient must be unscaled before
    an update.
  slot: M17.6
  category: learning
  sources:
  - title: Mixed Precision Training
    url: https://arxiv.org/abs/1710.03740
  - title: DeepSeek-V3 Technical Report
    url: https://arxiv.org/abs/2412.19437
objectives:
- id: objective.mixed-precision-training
  version: 1-draft
  statement: Mixed precision uses different number formats for selected tensors and operations; scaling, accumulation,
    and stability checks protect training while reducing storage or increasing throughput.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - mixed-precision-training.base
  - mixed-precision-training.transfer
  prerequisites:
  - anyOf:
    - objective.numerical-computing
  - anyOf:
    - objective.stable-training
scenes:
- id: mixed-precision-training.s1
  title: Separate numerical range from precision
  type: explanation
  depth: intuition
  objective_refs:
  - objective.mixed-precision-training
  markdown: 'A floating-point number resembles scientific notation: a sign, an exponent setting its magnitude,
    and significant digits stored in the **significand**. **Range** asks how large or small a number can be;
    **precision** asks how finely nearby numbers can be distinguished.


    Formats divide their bits among these parts differently. Even two formats with the same bit count can behave
    differently under overflow, underflow, or rounding. Fewer bits can save memory, but we need to decide which
    calculations can tolerate the change.'
  text_mode: 'A floating-point number resembles scientific notation: a sign, an exponent setting its magnitude,
    and significant digits stored in the **significand**. **Range** asks how large or small a number can be;
    **precision** asks how finely nearby numbers can be distinguished.


    Formats divide their bits among these parts differently. Even two formats with the same bit count can behave
    differently under overflow, underflow, or rounding. Fewer bits can save memory, but we need to decide which
    calculations can tolerate the change.'
  bridges: []
- id: mixed-precision-training.s2
  title: Mix formats across the computation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mixed-precision-training
  markdown: A recipe may store some weights and activations in a lower precision while accumulating sums or
    maintaining optimizer state in higher precision. Multiplying low-precision inputs does not imply that every
    intermediate and update uses that same format. Hardware support and kernel design determine actual throughput.
  text_mode: A recipe may store some weights and activations in a lower precision while accumulating sums or
    maintaining optimizer state in higher precision. Multiplying low-precision inputs does not imply that every
    intermediate and update uses that same format. Hardware support and kernel design determine actual throughput.
  bridges:
  - numerical-computing
- id: mixed-precision-training.s3
  title: Scale carefully, then undo it
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mixed-precision-training
  markdown: 'Loss scaling multiplies a loss before backward computation to keep some small gradients representable,
    then unscales gradients before the optimizer update. Dynamic schemes detect nonfinite values and adjust
    scale. Scaling does not cure every instability or restore information already lost through quantization.


    Suppose a true gradient is 0.0001 and the loss is scaled by 1,000. The backward result becomes 0.1 under
    the corresponding arithmetic. Divide by 1,000 before the optimizer uses it to recover 0.0001. Forgetting
    this **unscaling** multiplies the intended update by 1,000. If a result became infinity, division afterward
    cannot recover the lost finite value.'
  text_mode: 'Loss scaling multiplies a loss before backward computation to keep some small gradients representable,
    then unscales gradients before the optimizer update. Dynamic schemes detect nonfinite values and adjust
    scale. Scaling does not cure every instability or restore information already lost through quantization.


    Suppose a true gradient is 0.0001 and the loss is scaled by 1,000. The backward result becomes 0.1 under
    the corresponding arithmetic. Divide by 1,000 before the optimizer uses it to recover 0.0001. Forgetting
    this **unscaling** multiplies the intended update by 1,000. If a result became infinity, division afterward
    cannot recover the lost finite value.'
  bridges: []
- id: mixed-precision-training.s4
  title: Compare against a stable reference
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mixed-precision-training
  markdown: 'Monitor nonfinite values, gradient distributions, loss trajectories, and held-out quality. Low-bit
    formats such as FP8 require recipe-specific scaling and accumulation choices. A single successful forward
    pass does not establish stable long-run training, especially after a distribution or learning-rate change.


    FP8 names eight-bit floating-point formats, not one universal recipe. FP16 and BF16 are both sixteen-bit
    formats with different range/precision tradeoffs. State the actual formats, accumulators and scale handling
    before comparing quality or speed.'
  text_mode: 'Monitor nonfinite values, gradient distributions, loss trajectories, and held-out quality. Low-bit
    formats such as FP8 require recipe-specific scaling and accumulation choices. A single successful forward
    pass does not establish stable long-run training, especially after a distribution or learning-rate change.


    FP8 names eight-bit floating-point formats, not one universal recipe. FP16 and BF16 are both sixteen-bit
    formats with different range/precision tradeoffs. State the actual formats, accumulators and scale handling
