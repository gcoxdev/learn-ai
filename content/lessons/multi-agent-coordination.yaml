schema_version: 0.2-draft
lesson:
  id: multi-agent-coordination
  version: 0.4.0-draft
  title: Coordinate several decision-makers without assuming independent judgment
  state: draft
  summary: Wayfarer splits a four-city trip across five agents. It finishes in less than half the time, uses 31% more tokens, and three agents "confirm" the same wrong fact. When is a team worth it?
  slot: M25.5
  category: learning
  sources:
    - title: 'AutoGen: Enabling Next-Gen LLM Applications via Multi-Agent Conversation (Wu et al., 2023)'
      url: https://arxiv.org/abs/2308.08155
    - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
      url: https://aima.cs.berkeley.edu/
    - title: How we built our multi-agent research system (Anthropic, June 2025)
      url: https://www.anthropic.com/engineering/multi-agent-research-system
    - title: Don't Build Multi-Agents (Walden Yan, Cognition, June 2025)
      url: https://cognition.com/blog/dont-build-multi-agents
objectives:
  - id: objective.multi-agent-coordination
    version: 2-draft
    statement: Multi-agent systems divide work and exchange information under a coordination protocol; communication cost, shared errors, conflict resolution, and ownership determine whether the group helps.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - multi-agent-coordination.base.v2
      - multi-agent-coordination.transfer.v2
      - multi-agent-coordination.calculate
    prerequisites:
      - anyOf:
          - objective.agent-planning-and-recovery
      - anyOf:
          - objective.decisions-and-games
scenes:
  - id: multi-agent-coordination.s1
    title: One trip, four cities, five agents
    type: explanation
    depth: intuition
    objective_refs:
      - objective.multi-agent-coordination
    markdown: |-
      A traveler asks Wayfarer: *"Two weeks by train: Lisbon, Madrid, Barcelona, Paris. Central hotels, under \$150 a night."* A single agent loop would plod through four cities of hotel searches in order, its context swelling with every city's results.

      So Wayfarer splits the work. In an **orchestrator–worker** design, a lead agent (the orchestrator) breaks the task into pieces, hands each piece to a **subagent** (a separate model instance with its own fresh context, instructions, and tools), and combines the short summaries that come back. Anthropic's multi-agent research system, described in 2025, is built this way.

      The alternative is a **peer** design: agents message each other directly, or read and write a shared workspace, with no lead. Frameworks such as AutoGen (Wu et al., 2023) support both styles.

      | | Orchestrator–worker | Peers |
      | --- | --- | --- |
      | Who splits the work | The orchestrator | Agents negotiate, or a fixed script |
      | Who combines results | The orchestrator | Whoever reads the shared workspace |
      | Easy to trace | Yes: one agent owns the plan | Harder: decisions spread across messages |
      | Good fit | Independent pieces, like four cities | Back-and-forth, like critics debating an answer |

      Either way, write down for each agent what it can see, what it can do, and what it may change.
    diagram:
