schema_version: 0.2-draft
lesson:
  id: multi-agent-coordination
  version: 0.3.0-draft
  title: Coordinate several decision-makers without assuming independent judgment
  state: draft
  summary: Decide whether several cooperating agents improve a task enough to justify their cost.
  slot: M25.5
  category: learning
  sources:
  - title: AutoGen
    url: https://arxiv.org/abs/2308.08155
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.multi-agent-coordination
  version: 1-draft
  statement: Multi-agent systems divide work and exchange information under a coordination protocol; communication
    cost, shared errors, conflict resolution, and ownership determine whether the group helps.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - multi-agent-coordination.base
  - multi-agent-coordination.transfer
  prerequisites:
  - anyOf:
    - objective.agent-planning-and-recovery
  - anyOf:
    - objective.decisions-and-games
scenes:
- id: multi-agent-coordination.s1
  title: Specify roles and shared resources
  type: explanation
  depth: intuition
  objective_refs:
  - objective.multi-agent-coordination
  markdown: Several agents can gather evidence, solve subproblems, critique outputs, or control separate parts
    of an environment. Define each agent’s information, actions, objective, and authority. Different role names
    do not ensure different knowledge or independent errors when agents share models and inputs.
  text_mode: Several agents can gather evidence, solve subproblems, critique outputs, or control separate parts
    of an environment. Define each agent’s information, actions, objective, and authority. Different role names
    do not ensure different knowledge or independent errors when agents share models and inputs.
  bridges: []
- id: multi-agent-coordination.s2
  title: Choose a communication pattern
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multi-agent-coordination
  markdown: 'A coordinator can assign work and combine results, or peers can negotiate directly. Messages need
    enough context and evidence to be actionable. Too little communication causes inconsistency; too much increases
    latency, context use, and opportunities for confusion.


    Two independent searches taking four seconds each could finish in about four seconds if run together. If
    combining their results takes another two seconds, the total becomes six seconds, compared with ten seconds
    for two sequential searches plus the same combining step. This is only a timing estimate: shared rate limits,
    retries, or conflicting evidence can remove the benefit.'
  text_mode: 'A coordinator can assign work and combine results, or peers can negotiate directly. Messages
    need enough context and evidence to be actionable. Too little communication causes inconsistency; too much
    increases latency, context use, and opportunities for confusion.


    Two independent searches taking four seconds each could finish in about four seconds if run together. If
    combining their results takes another two seconds, the total becomes six seconds, compared with ten seconds
    for two sequential searches plus the same combining step. This is only a timing estimate: shared rate limits,
    retries, or conflicting evidence can remove the benefit.'
  bridges: []
- id: multi-agent-coordination.s3
  title: Resolve conflicting results
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multi-agent-coordination
  markdown: If two agents report different totals, inspect their data versions and calculations instead of
    automatically voting. Three agents copying one mistaken source do not supply three independent confirmations.
    Shared-state writes need ownership or concurrency controls to avoid overwriting correct work.
  text_mode: If two agents report different totals, inspect their data versions and calculations instead of
    automatically voting. Three agents copying one mistaken source do not supply three independent confirmations.
    Shared-state writes need ownership or concurrency controls to avoid overwriting correct work.
  bridges: []
- id: multi-agent-coordination.s4
  title: Compare against a simpler baseline
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multi-agent-coordination
  markdown: Measure task success, total model calls, time, and recovery. Some tasks benefit from independent
    specialized work; others gain little from repeated discussion. An effective team needs a verifiable integration
    step and a clear stopping condition, not just many plausible messages.
  text_mode: Measure task success, total model calls, time, and recovery. Some tasks benefit from independent
    specialized work; others gain little from repeated discussion. An effective team needs a verifiable integration
    step and a clear stopping condition, not just many plausible messages.
  bridges: []
- id: multi-agent-coordination.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.multi-agent-coordination
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Several agents help when their work combines into a better result. Check communication costs, shared
    mistakes, conflicting writes, and the final integration.
- id: multi-agent-coordination.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.multi-agent-coordination
  markdown: Several agents help when their work combines into a better result. Check communication costs, shared
    mistakes, conflicting writes, and the final integration.
  text_mode: Several agents help when their work combines into a better result. Check communication costs,
    shared mistakes, conflicting writes, and the final integration.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - multi-agent-coordination.s1
    - multi-agent-coordination.s2
    - multi-agent-coordination.s3
    - multi-agent-coordination.s4
    - multi-agent-coordination.check
    gate_refs:
    - gate.core
  scene_aliases:
    multi-agent-coordination.recap: multi-agent-coordination.check
assessment_families:
- id: multi-agent-coordination.base
  objective_ref: objective.multi-agent-coordination
  task: base
  response_type: single_choice
  points: 1
  hint: 'Choose a communication pattern: trace the inputs, operation, and result before choosing.'
  remediation_scene: multi-agent-coordination.s2
  variants:
  - id: multi-agent-coordination.base.1
    prompt: Do different agent role names guarantee independent errors?
    options:
    - id: c
      text: Only if roles sound specialized
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Shared models and sources can create correlated mistakes.
  - id: multi-agent-coordination.base.2
    prompt: What can excessive communication cost?
    options:
    - id: a
      text: Latency, context, and coordination effort
    - id: b
      text: Only the number of stored model weights
    - id: c
      text: Nothing if messages are text
    answer: a
    feedback: Messages consume resources and can introduce confusion.
- id: multi-agent-coordination.transfer
  objective_ref: objective.multi-agent-coordination
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Compare against a simpler baseline: trace the inputs, operation, and result before choosing.'
  remediation_scene: multi-agent-coordination.s4
  variants:
  - id: multi-agent-coordination.transfer.1
    prompt: Three agents copy one wrong source. How many independent sources is that?
    options:
    - id: a
      text: One
    - id: b
      text: Three
    - id: c
      text: Zero agents exist
    answer: a
    feedback: Repeated reporting does not create independent evidence.
  - id: multi-agent-coordination.transfer.2
    prompt: What establishes that a multi-agent design helps?
    options:
    - id: b
      text: The number of agents alone
    - id: c
      text: Longer conversations alone
    - id: a
      text: Measured improvement against a suitable simpler baseline
    answer: a
    feedback: Coordination benefits must outweigh its costs.
