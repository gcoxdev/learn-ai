  - id: multi-agent-coordination.s2
    title: Parallel is faster, not cheaper
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multi-agent-coordination
    markdown: |-
      Let's price both designs. Every search call takes about 6 s and reads about 4,000 tokens.

      | | One agent | Orchestrator + 4 subagents |
      | --- | ---: | ---: |
      | Planning | none | 1 call: 3,000 tokens, 6 s |
      | Searching | 20 calls, one after another | 4 subagents × 6 calls, side by side |
      | Combining | none | 1 call: 6,000 tokens, 8 s |
      | Total tokens | 20 × 4,000 = 80,000 | 3,000 + 24 × 4,000 + 6,000 = 105,000 |
      | Total time | 20 × 6 = 120 s | 6 + (6 × 6) + 8 = 50 s |

      Why 6 calls per subagent when the single agent needs 5 per city? Each subagent starts fresh, so it spends a call re-establishing what the single agent already knew: the budget, the dates, what "central" means. Tokens add up across every agent, but time doesn't: side by side, the search phase lasts as long as one subagent, 36 s.

      The team finishes in less than half the time and uses 31% more tokens. At an illustrative \$10 per million tokens, that's \$0.80 versus \$1.05 per trip.

      :::predict The traveler adds a fifth city, Rome. What happens to each design's tokens and time?
      The single agent needs 5 more calls: 100,000 tokens and 150 s. The team adds one subagent alongside the others: 105,000 + 24,000 = 129,000 tokens, while the time stays about 50 s. Splitting pays more as independent pieces multiply.
      :::

      Real systems show the same trade. Anthropic reported in June 2025 that its agents used about 4 times as many tokens as chat, and its multi-agent systems about 15 times as many.
    bridges: []
  - id: multi-agent-coordination.s3
    title: Three agents, one listing
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multi-agent-coordination
    markdown: |-
      To be sure its Barcelona pick, Casa Mar, is a short walk from the station, the orchestrator asks three subagents to check independently. All three report "5-minute walk." But all three found the same booking-site listing, which measured from an entrance that closed last year. That's three copies of one claim.

      The simulation compares agents that each check a *different* source with agents that all read *one* shared listing. Each source is wrong 10% of the time.

      ```python run
      import random
      random.seed(4)
      P_WRONG, TRIALS = 0.10, 100_000   # each listing (or each agent) is wrong 10% of the time

      def run(shared_source):
          all_wrong = majority_wrong = 0
          for _ in range(TRIALS):
              if shared_source:                        # all three agents read the same listing
                  listing_wrong = random.random() < P_WRONG
                  wrong = [listing_wrong] * 3
              else:                                    # each agent checks a different source
                  wrong = [random.random() < P_WRONG for _ in range(3)]
              all_wrong += all(wrong)
              majority_wrong += sum(wrong) >= 2
          return all_wrong / TRIALS, majority_wrong / TRIALS

      for label, shared in [("independent sources", False), ("one shared listing ", True)]:
          a, m = run(shared)
          print(f"{label}: all three wrong {a:.1%}, majority vote wrong {m:.1%}")
      ```

      With independent sources, all three are wrong together only 0.1% of the time (0.1³), and a majority vote is wrong 2.8% of the time. With one shared listing, they're wrong together 10% of the time, exactly as often as the listing is, and voting doesn't help at all. Try `P_WRONG = 0.3`. Subtler versions happen when agents share a model, a prompt, and a search engine: their mistakes line up even without a shared page.

      :::mixup "Three agents agree, so the answer is three times as reliable."
      Agreement is worth only as much as the independence behind it. Have each claim carry its source, as in the memory lesson, and count distinct sources, not agents. Better still, check against an authoritative source: here, a map service that computes the walking route.
      :::
    bridges: []
  - id: multi-agent-coordination.ownership
    title: Two agents, one date
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multi-agent-coordination
    markdown: |-
      The team shares one itinerary file, and two subagents both edit the day the traveler leaves Madrid:

      | Step | Madrid subagent | Barcelona subagent | "Leave Madrid" in the file |
      | --- | --- | --- | --- |
      | 1 | Reads the 16th | Reads the 16th | 16th |
      | 2 | Cheaper to stay on; writes the 17th | | 17th |
      | 3 | Books the Madrid hotel for the night of the 16th | Finds a deal from the 16th; writes the 16th | 16th |

      Each write made sense alone. Together, the traveler pays for two hotels on the night of the 16th, and nothing in the file shows it: the later write silently replaced the earlier one. As Walden Yan of Cognition put it in 2025, *actions carry implicit decisions*, and subagents that can't see each other's decisions make conflicting ones. Two standard fixes:

      - **Ownership.** Each shared field has one agent allowed to change it. Travel dates belong to the orchestrator; a city subagent that wants another date sends a request with its reason ("saves \$40 if we leave Madrid on the 17th"), and the orchestrator decides with the whole trip in view.
      - **Version checks.** Every write states which version of the file it was based on. The Barcelona write in step 3 is based on step 1's version, but the file changed in step 2, so it's rejected and the subagent must re-read and reconsider. Databases call this *optimistic concurrency control*.
    bridges: []
  - id: multi-agent-coordination.s4
    title: When one agent beats a team
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multi-agent-coordination
    markdown: |-
      Teams help when the work splits into independent pieces, and hurt when every piece depends on the others:

      | Request | Design | Why |
      | --- | --- | --- |
      | Hotels in four cities | Orchestrator + city subagents | Independent pieces; speed matters |
      | A Lisbon weekend: one flight, one hotel | One agent | Too small; a team just adds cost |
      | A day-by-day plan where train times shift hotel nights | One agent | Every decision depends on the others |

      Practitioners argue about where the line falls. Cognition (2025) argued for single-threaded agents that share full context: two subagents building parts of one game can produce a background and a character that don't match. Anthropic's post, published the same week, draws a similar line: research splits into independent threads, while tasks where every agent needs the same context, like most coding, fit poorly.

      :::key When to build a team
      Split only where the pieces are independent, give every decision that ties them together a single owner, and compare the team against one agent on the same tasks: success, time, and tokens.
      :::
    bridges: []
  - id: multi-agent-coordination.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.multi-agent-coordination
    markdown: Wayfarer's city team, then a law firm, a code change, a fact-checker, and a support desk test whether you can price a team, spot correlated errors, and decide who owns a decision.
    takeaway: |-
      A team of agents buys speed with extra tokens and helps only when the work splits into independent pieces. Count distinct sources rather than agreeing agents, and give every shared decision one owner.
  - id: multi-agent-coordination.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.multi-agent-coordination
    markdown: |-
      Several agents help when their work combines into a better result. Check communication costs, shared mistakes, conflicting writes, and the final integration.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - multi-agent-coordination.s1
        - multi-agent-coordination.s2
        - multi-agent-coordination.s3
        - multi-agent-coordination.ownership
        - multi-agent-coordination.s4
        - multi-agent-coordination.check
      gate_refs:
        - gate.core
  scene_aliases:
    multi-agent-coordination.recap: multi-agent-coordination.check
assessment_families:
  - id: multi-agent-coordination.base
    objective_ref: objective.multi-agent-coordination
    task: base
    response_type: single_choice
    points: 1
    hint: 'Choose a communication pattern: trace the inputs, operation, and result before choosing.'
    remediation_scene: multi-agent-coordination.s2
    variants:
      - id: multi-agent-coordination.base.1
        prompt: Do different agent role names guarantee independent errors?
        options:
          - id: c
            text: Only if roles sound specialized
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Shared models and sources can create correlated mistakes.
        retired: true
      - id: multi-agent-coordination.base.2
        prompt: What can excessive communication cost?
        options:
          - id: a
            text: Latency, context, and coordination effort
          - id: b
            text: Only the number of stored model weights
          - id: c
            text: Nothing if messages are text
        answer: a
        feedback: Messages consume resources and can introduce confusion.
        retired: true
  - id: multi-agent-coordination.transfer
    objective_ref: objective.multi-agent-coordination
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Compare against a simpler baseline: trace the inputs, operation, and result before choosing.'
    remediation_scene: multi-agent-coordination.s4
    variants:
      - id: multi-agent-coordination.transfer.1
        prompt: Three agents copy one wrong source. How many independent sources is that?
        options:
          - id: a
            text: One
          - id: b
            text: Three
          - id: c
            text: Zero agents exist
        answer: a
        feedback: Repeated reporting does not create independent evidence.
        retired: true
      - id: multi-agent-coordination.transfer.2
        prompt: What establishes that a multi-agent design helps?
        options:
          - id: b
            text: The number of agents alone
          - id: c
            text: Longer conversations alone
          - id: a
            text: Measured improvement against a suitable simpler baseline
        answer: a
        feedback: Coordination benefits must outweigh its costs.
        retired: true
  - id: multi-agent-coordination.base.v2
    objective_ref: objective.multi-agent-coordination
    task: base
    response_type: single_choice
    points: 1
    hint: Ask three things. Which work truly runs side by side? What does every agent pay for separately? And how many independent sources stand behind a claim?
    remediation_scene: multi-agent-coordination.s3
    variants:
      - id: multi-agent-coordination.base.v2.1
        prompt: Three Wayfarer subagents each report that Casa Mar is a 5-minute walk from the station. All three cite the same booking-site listing. How much independent evidence is that?
        options:
          - id: b
            text: Three confirmations, since three separate agents checked
          - id: a
            text: One source, repeated three times
          - id: c
            text: Strong evidence, since each agent had its own prompt
        answer: a
        feedback: All three read the same listing, so if it's wrong they're all wrong together. Count distinct sources, not agents. Different prompts don't make the underlying evidence independent.
      - id: multi-agent-coordination.base.v2.2
        prompt: Which description matches an orchestrator–worker design?
        options:
          - id: c
            text: Agents message each other directly and settle answers by vote
          - id: b
            text: Every agent edits one shared itinerary, with no lead agent
          - id: a
            text: A lead agent splits the task and combines the subagents' summaries
        answer: a
        feedback: The orchestrator owns the plan, hands out pieces, and merges the results. Direct messaging and a shared workspace without a lead are peer designs.
      - id: multi-agent-coordination.base.v2.3
        prompt: Wayfarer's Madrid and Barcelona subagents both write the "leave Madrid" date in a shared file, and the later write silently replaces the earlier one. Which fix addresses the cause?
        options:
          - id: a
            text: Let only the orchestrator change dates; subagents send requests
          - id: b
            text: Have both subagents write to the file more often, to stay current
          - id: c
            text: Add a third subagent that rereads the file at the very end
        answer: a
        feedback: The problem is two writers for one field. Giving the field one owner means conflicting wishes arrive as requests that someone with the whole trip in view decides. Writing more often just makes overwrites more frequent, and a final reread finds the damage after the booking.
      - id: multi-agent-coordination.base.v2.4
        prompt: Each Wayfarer subagent reads a smaller context than the single agent did, yet the team uses more tokens overall. What is the main reason?
        options:
          - id: b
            text: Tokens used by parallel calls are charged at a higher rate
          - id: a
            text: Each subagent re-reads shared background, plus planning and combining
          - id: c
            text: Subagents must repeat each other's searches to confirm them
        answer: a
        feedback: Every subagent starts fresh and spends calls re-establishing the budget and dates, and the orchestrator adds planning and combining calls. Parallel calls don't cost more per token, and the subagents in the lesson search different cities rather than repeating each other.
  - id: multi-agent-coordination.transfer.v2
    objective_ref: objective.multi-agent-coordination
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask whether the pieces are truly independent, and whether a decision that ties them together has a single owner.
    remediation_scene: multi-agent-coordination.s4
    variants:
      - id: multi-agent-coordination.transfer.v2.1
        prompt: A law firm's question splits into five jurisdictions that can be researched separately. One agent takes 10 minutes; a team takes 3 minutes and uses 1.5 times the tokens. Clients are waiting on the answer. Which choice fits the lesson?
        options:
          - id: c
            text: One agent, since spending fewer tokens should come first
          - id: a
            text: The team, since the pieces are independent and speed matters
          - id: b
            text: The team, since more agents make every answer more accurate
        answer: a
        feedback: Independent pieces and a real need for speed are exactly where a team earns its extra tokens. It doesn't follow that more agents are more accurate, and token cost is only one side of the trade.
      - id: multi-agent-coordination.transfer.v2.2
        prompt: A developer wants to rename a function's argument and update all 30 places that call it. The plan gives 5 subagents 6 callers each, working separately. What is the main risk?
        options:
          - id: a
            text: The subagents choose inconsistent names, since each piece depends on one decision
          - id: b
            text: The task runs slower, since parallel subagents must wait for each other to finish
          - id: c
            text: The token cost is lower, but the subagents will skip some of the callers
        answer: a
        feedback: Every caller must match one shared choice, so the pieces aren't independent. Without one owner for that decision, subagents can drift apart. A single agent, or an orchestrator that fixes the name first, avoids it. Parallel subagents don't make the task slower.
      - id: multi-agent-coordination.transfer.v2.3
        prompt: A fact-checking pipeline runs three copies of the same model with the same search tool. They agree on 95% of claims. What does that agreement show?
        options:
          - id: b
            text: That at least 95% of the claims they agree on are correct
          - id: c
            text: That the three copies have become well calibrated together
          - id: a
            text: Little about accuracy, since their mistakes are likely to line up
        answer: a
        feedback: Same model, same tool, and likely the same pages mean correlated errors, so they can agree on a wrong answer. To learn accuracy, compare against checked answers or independent sources.
      - id: multi-agent-coordination.transfer.v2.4
        prompt: A support system has a billing agent and a shipping agent, and both can issue refunds. A customer with a lost parcel is refunded twice. Which design fix fits the lesson?
        options:
          - id: c
            text: Tell both agents in their prompts to take extra care with refunds
          - id: b
            text: Make the shipping agent wait ten minutes before any refund
          - id: a
            text: Let only billing issue refunds; shipping sends it a request
        answer: a
        feedback: Two agents with the power to make the same change will eventually both make it. One owner turns the second agent's action into a request that can be checked against what's already been refunded. Prompts and delays only make the collision less likely.
  - id: multi-agent-coordination.calculate
    objective_ref: objective.multi-agent-coordination
    task: base
    response_type: numeric
    points: 1
    hint: 'Tokens add up across every agent. Time adds up only along the chain: planning, then the slowest subagent, then combining.'
    remediation_scene: multi-agent-coordination.s2
    absolute_tolerance: 0.01
    variants:
      - id: multi-agent-coordination.calculate.1
        prompt: An orchestrator's planning call reads 2,000 tokens. Three subagents each make 5 calls of 4,000 tokens. The combining call reads 5,000 tokens. How many tokens does the team use in total?
        answer: 67000
        feedback: The subagents use 3 × 5 × 4,000 = 60,000 tokens. Add 2,000 for planning and 5,000 for combining to get 67,000.
      - id: multi-agent-coordination.calculate.2
        prompt: Planning takes 5 s. Three subagents then run side by side, finishing in 20 s, 32 s, and 25 s. Combining takes 7 s. How many seconds does the whole team take?
        answer: 44
        feedback: The side-by-side phase lasts as long as the slowest subagent, 32 s. Then 5 + 32 + 7 = 44 seconds.
      - id: multi-agent-coordination.calculate.3
        prompt: A single agent makes 18 calls of 5 s each. A team plans for 6 s, runs subagents side by side that each make 6 calls of 5 s, then combines for 9 s. How many seconds faster is the team?
        answer: 45
        feedback: The single agent takes 18 × 5 = 90 s. The team takes 6 + 6 × 5 + 9 = 45 s. The difference is 45 seconds.
      - id: multi-agent-coordination.calculate.4
        prompt: A single agent uses 72,000 tokens on a task. A team uses 90,000 tokens on the same task. How many times as many tokens does the team use?
        answer: 1.25
        feedback: 90,000 ÷ 72,000 = 1.25, so the team uses 25% more tokens.
      - id: multi-agent-coordination.calculate.5
        prompt: Wayfarer's orchestrator plans with 3,000 tokens, five city subagents each make 6 calls of 4,000 tokens, and combining reads 8,000 tokens. How many tokens does the trip use in total?
        answer: 131000
        feedback: The subagents use 5 × 6 × 4,000 = 120,000 tokens. Add 3,000 for planning and 8,000 for combining to get 131,000.
