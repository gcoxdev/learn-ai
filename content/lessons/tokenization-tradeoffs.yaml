schema_version: 0.2-draft
lesson:
  id: tokenization-tradeoffs
  version: 0.3.0-draft
  title: One vocabulary does not divide every language equally
  state: draft
  summary: Compare how different text rules divide names, languages, numbers, and code before interpreting
    token counts or scores.
  slot: M14.7
  category: learning
  sources:
  - title: Speech and Language Processing — authors’ draft
    url: https://web.stanford.edu/~jurafsky/slp3/
objectives:
- id: objective.tokenization-tradeoffs
  version: 1-draft
  statement: Tokenization affects sequence length, rare strings, multilingual coverage, code, and cost; compare
    the encoded units and normalization before comparing model metrics.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - tokenization-tradeoffs.base
  - tokenization-tradeoffs.transfer
  prerequisites:
  - anyOf:
    - objective.tokenizer-training
scenes:
- id: tokenization-tradeoffs.s1
  title: The same amount of text can use different token counts
  type: explanation
  depth: intuition
  objective_refs:
  - objective.tokenization-tradeoffs
  markdown: A vocabulary shaped mainly by one writing system can segment another into many smaller pieces.
    Token count therefore does not map to a fixed number of words or characters across languages. Longer encoded
    sequences use more context space and can change computational cost.
  text_mode: A vocabulary shaped mainly by one writing system can segment another into many smaller pieces.
    Token count therefore does not map to a fixed number of words or characters across languages. Longer encoded
    sequences use more context space and can change computational cost.
  bridges: []
- id: tokenization-tradeoffs.s2
  title: Rare strings expose the segmentation rules
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tokenization-tradeoffs
  markdown: Names, identifiers, numbers, and code can split in unintuitive ways. Two numbers with similar numerical
    value may have unrelated token sequences. A language model sees the resulting IDs, so exact copying or
    arithmetic can be affected by representation as well as training. Tokenization alone does not explain every
    such failure.
  text_mode: Names, identifiers, numbers, and code can split in unintuitive ways. Two numbers with similar
    numerical value may have unrelated token sequences. A language model sees the resulting IDs, so exact copying
    or arithmetic can be affected by representation as well as training. Tokenization alone does not explain
    every such failure.
  bridges:
  - information-theory
- id: tokenization-tradeoffs.s3
  title: Normalization can remove distinctions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tokenization-tradeoffs
  markdown: 'Case folding, whitespace handling, Unicode normalization, or byte-level processing can change
    the input representation. For ordinary search some changes are useful; for source code or exact identifiers
    they may destroy relevant distinctions. State whether decoding can reconstruct the original bytes exactly
    under the chosen convention.


    **Case folding** treats forms such as A and a as equivalent. **Unicode** is a standard for representing
    text characters; its normalization rules can make some different character sequences use a common form.
    This may help search but change exact text. The code names “Rate” and “rate” can be distinct, so test the
    intended round trip rather than assuming cleanup is harmless.'
  text_mode: 'Case folding, whitespace handling, Unicode normalization, or byte-level processing can change
    the input representation. For ordinary search some changes are useful; for source code or exact identifiers
    they may destroy relevant distinctions. State whether decoding can reconstruct the original bytes exactly
    under the chosen convention.


    **Case folding** treats forms such as A and a as equivalent. **Unicode** is a standard for representing
    text characters; its normalization rules can make some different character sequences use a common form.
    This may help search but change exact text. The code names “Rate” and “rate” can be distinct, so test the
    intended round trip rather than assuming cleanup is harmless.'
  bridges: []
- id: tokenization-tradeoffs.s4
  title: Compare under meaningful units
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tokenization-tradeoffs
  markdown: 'Report bytes, characters, words under a definition, and tokens where relevant. Per-token perplexity
    and context limits are tokenizer-dependent. Evaluate multilingual tasks and rare strings directly, including
    successful reconstruction and application behavior. A larger vocabulary trades shorter sequences against
    parameter, training, and coverage considerations.


    **Perplexity** summarizes how much probability a language model gives the actual next tokens. If one tokenizer
    represents a word with one token and another with three, the per-token averages concern different units.
    Compare the same underlying text with an explicitly compatible normalization, such as likelihood per byte
    where appropriate, and inspect real task performance too.'
  text_mode: 'Report bytes, characters, words under a definition, and tokens where relevant. Per-token perplexity
    and context limits are tokenizer-dependent. Evaluate multilingual tasks and rare strings directly, including
    successful reconstruction and application behavior. A larger vocabulary trades shorter sequences against
    parameter, training, and coverage considerations.


    **Perplexity** summarizes how much probability a language model gives the actual next tokens. If one tokenizer
    represents a word with one token and another with three, the per-token averages concern different units.
    Compare the same underlying text with an explicitly compatible normalization, such as likelihood per byte
    where appropriate, and inspect real task performance too.'
  bridges: []
- id: tokenization-tradeoffs.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.tokenization-tradeoffs
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Token counts depend on the vocabulary, splitting rules, and text being encoded. Use compatible
    units and test real tasks before comparing context limits or prediction scores.
- id: tokenization-tradeoffs.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.tokenization-tradeoffs
  markdown: Token counts depend on the vocabulary, splitting rules, and text being encoded. Use compatible
    units and test real tasks before comparing context limits or prediction scores.
  text_mode: Token counts depend on the vocabulary, splitting rules, and text being encoded. Use compatible
    units and test real tasks before comparing context limits or prediction scores.
