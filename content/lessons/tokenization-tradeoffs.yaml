assessment_families:
- id: tokenization-tradeoffs.base
  objective_ref: objective.tokenization-tradeoffs
  task: base
  response_type: single_choice
  points: 1
  hint: 'Rare strings expose the segmentation rules: trace the inputs, operation, and result before choosing.'
  remediation_scene: tokenization-tradeoffs.s2
  variants:
  - id: tokenization-tradeoffs.base.1
    prompt: Does one token always equal one word?
    options:
    - id: c
      text: Only if the vocabulary is large
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Tokens can be characters, bytes, subwords, words, or other units depending on the tokenizer.
  - id: tokenization-tradeoffs.base.2
    prompt: Why can multilingual token counts differ for similarly sized messages?
    options:
    - id: a
      text: The vocabulary and segmentation fit languages differently
    - id: b
      text: All languages have identical segmentation by definition
    - id: c
      text: Only the network depth changes
    answer: a
    feedback: Training distribution and writing-system structure affect tokenization.
- id: tokenization-tradeoffs.transfer
  objective_ref: objective.tokenization-tradeoffs
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Compare under meaningful units: trace the inputs, operation, and result before choosing.'
  remediation_scene: tokenization-tradeoffs.s4
  variants:
  - id: tokenization-tradeoffs.transfer.1
    prompt: Case normalization is applied to case-sensitive code identifiers. What is a risk?
    options:
    - id: a
      text: Distinct identifiers can become indistinguishable
    - id: b
      text: The code necessarily becomes more correct
    - id: c
      text: Only token colors change
    answer: a
    feedback: Normalization must preserve distinctions required by the task.
  - id: tokenization-tradeoffs.transfer.2
    prompt: Two models have the same token context limit but different tokenizers. Do they necessarily fit
      the same amount of text?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only for long documents
    - id: a
      text: 'No'
    answer: a
    feedback: Context measured in tokens depends on the segmentation convention.
