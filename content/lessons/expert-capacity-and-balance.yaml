schema_version: 0.2-draft
lesson:
  id: expert-capacity-and-balance
  version: 0.3.0-draft
  title: Keep expert loads from overwhelming the execution plan
  state: draft
  summary: Fourteen tokens want an expert with room for ten. Decide what happens to the other four, and meet the one-line loss that keeps routers from piling onto favorites.
  slot: M18.5
  category: learning
  sources:
    - title: "Outrageously Large Neural Networks: The Sparsely-Gated Mixture-of-Experts Layer (Shazeer et al., 2017)"
      url: https://arxiv.org/abs/1701.06538
    - title: "GShard (Lepikhin et al., 2020)"
      url: https://arxiv.org/abs/2006.16668
    - title: "Switch Transformers (Fedus, Zoph & Shazeer, 2021)"
      url: https://arxiv.org/abs/2101.03961
    - title: "Mixture-of-Experts with Expert Choice Routing (Zhou et al., 2022)"
      url: https://arxiv.org/abs/2202.09368
    - title: "MegaBlocks: Efficient Sparse Training with Mixture-of-Experts (Gale et al., 2022)"
      url: https://arxiv.org/abs/2211.15841
    - title: "Auxiliary-Loss-Free Load Balancing Strategy for Mixture-of-Experts (Wang et al., 2024)"
      url: https://arxiv.org/abs/2408.15664
objectives:
  - id: objective.expert-capacity-and-balance
    version: 2-draft
    statement: Expert capacity and load balancing manage uneven assignments; auxiliary losses, routing adjustments, and dropless execution make different quality and systems tradeoffs.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - expert-capacity-and-balance.base.v2
      - expert-capacity-and-balance.transfer.v2
      - expert-capacity-and-balance.capacity
      - expert-capacity-and-balance.balance-loss
    prerequisites:
      - anyOf:
          - objective.expert-dispatch-and-combine
      - anyOf:
          - objective.data-parallel-training
scenes:
  - id: expert-capacity-and-balance.s1
    title: The busiest expert sets the pace
    type: explanation
    depth: intuition
    objective_refs:
      - objective.expert-capacity-and-balance
    markdown: |-
      A batch of 16 tokens goes through an MoE layer with 4 experts and top-2 routing. That's 32 assignments, so a perfectly even router would give each expert 8. This router doesn't:

      | Expert | E1 | E2 | E3 | E4 |
      | --- | ---: | ---: | ---: | ---: |
      | Assignments received | 14 | 9 | 6 | 3 |

      An expert's number of assignments is its **load**. The average load is still 8, but averages don't finish work. When each expert runs on its own GPU, as in the dispatch lesson, the layer is done only when the slowest expert is done. E1 has 14 rows to process where 8 was planned, so the whole step takes about 14/8 = 1.75 times as long as a balanced one, while E4 sits idle most of the time.

      There's a second problem. Many systems, especially on TPUs, need every tensor shape fixed before the run starts. They can't make E1's batch "whatever size turns up." They need a rule for how much room each expert gets, and what happens to the rest.
    bridges: []
  - id: expert-capacity-and-balance.s2
    title: Capacity is a fixed number of slots
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.expert-capacity-and-balance
    markdown: |-
      GShard and Switch Transformer give every expert the same number of slots, its **expert capacity**:

      $$\text{capacity} = c \times \frac{T \times k}{N}$$

      $T$ is tokens in the batch, $k$ is experts per token, and $N$ is the number of experts. The **capacity factor** $c$ is the headroom above a perfectly even share. With a factor of 1.25, capacity is $1.25 \times 16 \times 2 / 4 = 10$.

      E1 received 14, so 4 assignments **overflow**. In Switch Transformer an overflowing token skips that expert: its expert term is missing, and its vector carries on through the residual connection unchanged by this layer's experts. A top-2 token that loses one expert still gets the other.

      ```python run
      T, k, N = 16, 2, 4                 # tokens, experts per token, experts
      loads = [14, 9, 6, 3]              # assignments the router sent to E1..E4

      for cf in [1.0, 1.25, 1.5, 2.0]:
          cap = int(cf * T * k / N)      # slots per expert
          kept = [min(n, cap) for n in loads]
          dropped = sum(loads) - sum(kept)
          empty = cap * N - sum(kept)    # padded slots that compute nothing
          print(f"cf {cf:4}: capacity {cap:2}  dropped {dropped}  empty slots {empty}")
      ```

      :::predict What does a capacity factor of 2.0 buy, and what does it cost?
      No drops, since capacity 16 exceeds even E1's 14. But the four experts now reserve 64 slots for 32 assignments, so 32 slots compute padding. A bigger factor trades dropped tokens for wasted compute and memory. Switch Transformer reported that with its balance loss, typically under 1% of tokens were dropped.
      :::

      A different answer is to have no fixed slots at all. **Dropless** MoE runs each expert on exactly the rows it received. MegaBlocks (2022) does this with block-sparse matrix multiplication, and DeepSeek-V3 reports dropping no tokens in training or inference. The busiest expert still sets the pace, though, so dropless systems need balance just as much.
    bridges: []
  - id: expert-capacity-and-balance.s3
    title: A one-line loss against favorites
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.expert-capacity-and-balance
    markdown: |-
      Why would a router pile onto E1 in the first place? Shazeer et al. (2017) spotted a feedback loop they called **self-reinforcing**. Early in training, a few experts happen to be chosen more; they get more gradient updates, so they improve faster, so the router chooses them even more. Left alone, this ends in **routing collapse**: a handful of experts do all the work while the rest never learn.

      The standard fix is an **auxiliary loss**: an extra term added to the training loss that is small when load is even.

      :::papers The Switch Transformer load-balancing loss
      $$\mathcal{L}_{\text{balance}} = \alpha \cdot N \cdot \sum_{i=1}^{N} f_i \, P_i$$

      $f_i$ is the fraction of tokens whose top choice is expert $i$, and $P_i$ is the average router probability given to expert $i$ over the batch. Switch used $\alpha = 10^{-2}$. If routing is perfectly even, every $f_i = P_i = 1/N$, so the sum is $N \times 1/N^2 = 1/N$ and the loss is exactly $\alpha$.
      :::

      Work it for 8 tokens and 4 experts with top-1 routing. Half the tokens pick E1:

      ```python run
      import numpy as np

      # Router probabilities for 8 tokens over 4 experts (each row sums to 1)
      p = np.array([[0.7, 0.1, 0.1, 0.1]] * 4 +
                   [[0.1, 0.6, 0.2, 0.1]] * 2 +
                   [[0.1, 0.2, 0.6, 0.1],
                    [0.1, 0.2, 0.1, 0.6]])
      T, N = p.shape
      alpha = 0.01

      f = np.bincount(p.argmax(axis=1), minlength=N) / T   # share of tokens (top-1)
      P = p.mean(axis=0)                                     # share of probability
      loss = alpha * N * np.sum(f * P)

      print("f (tokens):     ", f)
      print("P (probability):", P.round(4))
      print(f"balance loss: {loss:.5f}   (perfectly even routing gives {alpha})")
      ```

      By hand: $\sum f_i P_i = 0.5(0.4) + 0.25(0.25) + 0.125(0.1875) + 0.125(0.1625) = 0.30625$. Times $N = 4$ gives 1.225, and times $\alpha$ gives 0.01225, above the even-routing value of 0.01. Whenever the busiest experts also get the most probability, the sum is at least $1/N$, so that kind of lopsided routing never scores below $\alpha$.

      Why multiply two shares? Counting tokens ($f$) involves an argmax, which has no gradient. The probabilities ($P$) do. So the gradient pushes down each expert's probability in proportion to its $f_i$: the busiest experts are pushed hardest. Try changing the first four rows to `[0.4, 0.2, 0.2, 0.2]` and watch the loss fall.
    bridges: []
  - id: expert-capacity-and-balance.s4
    title: Balance is a dial, not a goal
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.expert-capacity-and-balance
    markdown: |-
      Push $\alpha$ too high and the router spreads tokens evenly whether or not that helps; the DeepSeek-V3 report notes that too large an auxiliary loss hurts model quality. Push it too low and you're back to collapse and drops. Teams tune $\alpha$ by watching both the task loss and the per-expert loads.

      Two other designs attack the problem differently:

      | Approach | Idea | Balance by construction? |
      | --- | --- | --- |
      | Auxiliary loss (Switch, GShard) | Penalize lopsided routing during training | No, encouraged |
      | Expert choice (Zhou et al., 2022) | Each *expert* picks its top tokens, instead of each token picking experts | Yes; a token may get several experts or none |
      | Bias adjustment (DeepSeek-V3) | Nudge per-expert scores up or down after each step based on observed load | No, steered; next lesson |

      Balance measured during training is balance on huge, mixed batches. A deployed model may see a morning of nothing but Python, and a few experts can run hot. Log per-expert load on real traffic, not just on the training mix.
    bridges: []
  - id: expert-capacity-and-balance.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.expert-capacity-and-balance
    markdown: Compute capacities, dropped assignments, and balance losses for new batches, then pick fixes for a collapsing router and a hot expert in production.
    takeaway: |-
      Capacity is capacity factor × T × k / N; assignments past it are dropped and ride the residual. A balance loss like α·N·Σ fᵢPᵢ keeps the router from piling onto favorites.
  - id: expert-capacity-and-balance.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.expert-capacity-and-balance
    markdown: |-
      The busiest expert can limit the whole step even when average load is low. State how overflow is handled and check whether balancing improves execution without harming the task.
