schema_version: 0.2-draft
lesson:
  id: expert-capacity-and-balance
  version: 0.1.0-draft
  title: Keep expert loads from overwhelming the execution plan
  state: draft
  summary: Expert capacity and load balancing manage uneven assignments; auxiliary losses, routing adjustments,
    and dropless execution make different quality and systems tradeoffs.
  slot: M18.5
  category: learning
  minutes: 12
  sources:
  - title: Sparsely-Gated Mixture-of-Experts
    url: https://arxiv.org/abs/1701.06538
  - title: Switch Transformers
    url: https://arxiv.org/abs/2101.03961
  - title: Auxiliary-Loss-Free Load Balancing
    url: https://arxiv.org/abs/2408.15664
objectives:
- id: objective.expert-capacity-and-balance
  version: 1-draft
  statement: Expert capacity and load balancing manage uneven assignments; auxiliary losses, routing adjustments,
    and dropless execution make different quality and systems tradeoffs.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - expert-capacity-and-balance.base
  - expert-capacity-and-balance.transfer
  prerequisites:
  - anyOf:
    - objective.expert-dispatch-and-combine
  - anyOf:
    - objective.data-parallel-training
scenes:
- id: expert-capacity-and-balance.s1
  title: An overloaded expert becomes a bottleneck
  type: explanation
  depth: intuition
  objective_refs:
  - objective.expert-capacity-and-balance
  markdown: With eight tokens routed top-one across four experts, balanced expected load is two assignments per
    expert. If six choose one expert, that device may work longer or exceed an allocated buffer. The average load
    does not describe the busiest expert.
  text_mode: With eight tokens routed top-one across four experts, balanced expected load is two assignments per
    expert. If six choose one expert, that device may work longer or exceed an allocated buffer. The average load
    does not describe the busiest expert.
  bridges: []
- id: expert-capacity-and-balance.s2
  title: Capacity is an explicit policy
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.expert-capacity-and-balance
  markdown: Some implementations allocate capacity relative to average assignments and drop or reroute overflow.
    Others support variable-sized, dropless expert batches. Dropping an expert assignment does not necessarily delete
    the token from the entire model because a residual path may remain; exact handling belongs to the recipe.
  text_mode: Some implementations allocate capacity relative to average assignments and drop or reroute overflow.
    Others support variable-sized, dropless expert batches. Dropping an expert assignment does not necessarily delete
    the token from the entire model because a residual path may remain; exact handling belongs to the recipe.
  bridges: []
- id: expert-capacity-and-balance.s3
  title: Balance through training or routing
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.expert-capacity-and-balance
  markdown: An auxiliary loss can encourage spread across experts alongside the task loss. Other methods adjust
    routing biases from observed load. Strong balancing pressure can interfere with useful specialization, while
    weak pressure can leave expert resources idle. Balance across a batch differs from requiring balance within
    every sequence.
  text_mode: An auxiliary loss can encourage spread across experts alongside the task loss. Other methods adjust
    routing biases from observed load. Strong balancing pressure can interfere with useful specialization, while
    weak pressure can leave expert resources idle. Balance across a batch differs from requiring balance within
    every sequence.
  bridges: []
- id: expert-capacity-and-balance.s4
  title: Inspect tails and distribution changes
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.expert-capacity-and-balance
  markdown: Record assignment histograms, overflow rates, per-device time, and task quality. A balanced training
    mixture may encounter concentrated domain traffic at inference. Test realistic small batches and shifted workloads,
    where average training statistics may not predict the hottest expert.
  text_mode: Record assignment histograms, overflow rates, per-device time, and task quality. A balanced training
    mixture may encounter concentrated domain traffic at inference. Test realistic small batches and shifted workloads,
    where average training statistics may not predict the hottest expert.
  bridges: []
- id: expert-capacity-and-balance.check
