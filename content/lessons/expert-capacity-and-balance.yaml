assessment_families:
  - id: expert-capacity-and-balance.base
    objective_ref: objective.expert-capacity-and-balance
    task: base
    response_type: single_choice
    points: 1
    hint: 'Capacity is an explicit policy: trace the inputs, operation, and result before choosing.'
    remediation_scene: expert-capacity-and-balance.s2
    variants:
      - id: expert-capacity-and-balance.base.1
        prompt: Eight top-one assignments across four experts have average load what?
        options:
          - id: c
            text: Eight per expert
          - id: a
            text: Two
          - id: b
            text: Four
        answer: a
        feedback: Divide assignments by expert count.
        retired: true
      - id: expert-capacity-and-balance.base.2
        prompt: Does dropping an expert assignment always remove the whole token?
        options:
          - id: a
            text: No; the architecture and overflow policy determine the effect
          - id: b
            text: 'Yes'
          - id: c
            text: Only if the token is punctuation
        answer: a
        feedback: The expert branch is only part of the computation.
        retired: true
  - id: expert-capacity-and-balance.transfer
    objective_ref: objective.expert-capacity-and-balance
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Inspect tails and distribution changes: trace the inputs, operation, and result before choosing.'
    remediation_scene: expert-capacity-and-balance.s4
    variants:
      - id: expert-capacity-and-balance.transfer.1
        prompt: Can overly strong balancing harm task learning?
        options:
          - id: a
            text: Yes; the balancing objective can conflict with useful routing
          - id: b
            text: 'No'
          - id: c
            text: Only if experts are untrained forever
        answer: a
        feedback: The combined training objective creates a tradeoff.
        retired: true
      - id: expert-capacity-and-balance.transfer.2
        prompt: Balanced training loads guarantee balanced specialist inference traffic?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only when top-one is used
          - id: a
            text: 'No'
        answer: a
        feedback: Input distribution and batch composition affect assignments.
        retired: true
  - id: expert-capacity-and-balance.base.v2
    objective_ref: objective.expert-capacity-and-balance
    task: base
    response_type: single_choice
    points: 1
    hint: Separate three things. Capacity is how many slots each expert has, overflow is what happens past it, and the balance loss is how training discourages overflow in the first place.
    remediation_scene: expert-capacity-and-balance.s2
    variants:
      - id: expert-capacity-and-balance.base.v2.1
        prompt: In a Switch Transformer layer, a token's assignment overflows its expert's capacity. What happens to that token in this layer?
        options:
          - id: b
            text: It is removed from the sequence, and later layers never see it
          - id: a
            text: It skips the expert and continues through the residual connection
          - id: c
            text: It waits in a queue until the next batch frees up an expert slot
        answer: a
        feedback: The dropped token's expert term is missing, but its vector passes on through the residual connection, so later layers still see it. Switch uses fixed shapes, so there's no queue into the next batch.
      - id: expert-capacity-and-balance.base.v2.2
        prompt: Raising the capacity factor from 1.25 to 2.0 cuts dropped tokens to zero in a test batch. What is the main cost?
        options:
          - id: c
            text: The router must now pick two experts for each token instead of one
          - id: b
            text: The balance loss can no longer be computed for that layer
          - id: a
            text: Each expert reserves more slots, and many hold padding that wastes compute
        answer: a
        feedback: Capacity is reserved in advance, so with a factor of 2.0 about half the slots compute padding when routing is even. The factor changes slot counts, not k, and the balance loss is computed from router outputs regardless.
      - id: expert-capacity-and-balance.base.v2.3
        prompt: Why does the Switch load-balancing loss multiply the token share fᵢ by the probability share Pᵢ, instead of using fᵢ by itself?
        options:
          - id: a
            text: fᵢ comes from an argmax and has no gradient, but Pᵢ does
          - id: b
            text: Pᵢ is needed to convert the loss into the same units as fᵢ
          - id: c
            text: fᵢ can exceed 1 in a large batch, so Pᵢ scales it back down
        answer: a
        feedback: Counting which expert won is a step function with zero gradient. Multiplying by Pᵢ, the average router probability, gives the loss a smooth path back to the router, weighted by how busy each expert is. Both are fractions between 0 and 1.
      - id: expert-capacity-and-balance.base.v2.4
        prompt: Early in training, experts 1 and 2 receive most tokens and the other experts barely change. What name fits, and why does it tend to get worse?
        options:
          - id: b
            text: Overflow; the capacity factor is set too low for the batch size
          - id: c
            text: Overfitting; experts 1 and 2 memorize the training batches
          - id: a
            text: Routing collapse; favored experts train more, so they get picked more
        answer: a
        feedback: Shazeer et al. (2017) called the loop self-reinforcing. Experts that get more tokens get more updates, improve, and win more tokens. Overflow is a symptom at a given step, not the feedback loop that causes it.
  - id: expert-capacity-and-balance.transfer.v2
    objective_ref: objective.expert-capacity-and-balance
    task: transfer
    response_type: single_choice
    points: 1
    hint: Decide whether the problem is too little balance (collapse, drops, hot experts) or too much (forced spreading that hurts quality), and whether it shows up in training or in real traffic.
    remediation_scene: expert-capacity-and-balance.s4
    variants:
      - id: expert-capacity-and-balance.transfer.v2.1
        prompt: A team raises the balance-loss weight α from 0.01 to 1.0. Expert loads become nearly perfectly even, but validation loss gets worse. What is the most likely explanation?
        options:
          - id: a
            text: The router now spreads tokens evenly even when that doesn't help the task
          - id: b
            text: Balanced loads hurt quality, so α should be set to zero
          - id: c
            text: The capacity factor is now too small, so tokens are being dropped
        answer: a
        feedback: A huge α makes even routing matter more than the task, so the router stops sending tokens where they help. Setting α to zero risks collapse, and with nearly even loads few tokens overflow.
      - id: expert-capacity-and-balance.transfer.v2.2
        prompt: A code-assistant deployment of an MoE model shows three experts running at twice their share while others idle, though training loads were even. What should the team do first?
        options:
          - id: c
            text: Retrain the router from scratch with a much larger α
          - id: a
            text: Log per-expert load on real traffic and plan for the hot experts
          - id: b
            text: Raise k so that each token spreads over more experts
        answer: a
        feedback: Training balance was measured on large mixed batches; code-heavy traffic can favor a few experts. Measuring real load comes first, then fixes like placing or copying hot experts. Raising k adds work to every token and still sends more to the same favorites.
      - id: expert-capacity-and-balance.transfer.v2.3
        prompt: A team wants every expert to process exactly the same number of tokens in each batch, and accepts that some tokens may get no expert at all. Which routing design fits?
        options:
          - id: b
            text: Top-1 routing with a larger capacity factor
          - id: c
            text: Top-2 routing with a stronger balance loss
          - id: a
            text: Expert choice, where each expert picks its top tokens
        answer: a
        feedback: In expert choice routing, each expert takes a fixed number of tokens, so loads are equal by construction; a token may be picked by several experts or none. Capacity factors and balance losses only encourage balance.
      - id: expert-capacity-and-balance.transfer.v2.4
        prompt: A dropless MoE never drops tokens, yet its training steps are slow whenever one expert receives three times its share. Why?
        options:
          - id: a
            text: The layer still waits for the busiest expert to finish its rows
          - id: c
            text: Dropless systems re-run the busiest expert once for each extra token
          - id: b
            text: Dropless systems pad every expert to the busiest expert's size
        answer: a
        feedback: Dropless means each expert processes every row it received, so the busiest expert does three times the work while the others wait. Systems like MegaBlocks avoid padding, which is their point, but they can't avoid the imbalance itself.
  - id: expert-capacity-and-balance.capacity
    objective_ref: objective.expert-capacity-and-balance
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Capacity = capacity factor × T × k ÷ N. Then, for each expert, anything past capacity overflows; add up the overflows.
    remediation_scene: expert-capacity-and-balance.s2
    variants:
      - id: expert-capacity-and-balance.capacity.1
        prompt: A batch of 32 tokens uses top-2 routing over 8 experts with a capacity factor of 1.0. The busiest expert receives 11 assignments; every other expert receives 8 or fewer. Find the capacity and the number of dropped assignments.
        answers:
          capacity: 8
          dropped: 3
        reason_answer: b
        reason_options:
          - id: a
            text: Capacity is T ÷ N, and overflow moves to the least-busy expert
          - id: b
            text: Capacity is factor × T × k ÷ N, and assignments past it are dropped
          - id: c
            text: Capacity is factor × T ÷ N, since k doesn't change the load
        feedback: 1.0 × 32 × 2 ÷ 8 = 8 slots. The busiest expert has 11, so 3 assignments overflow and skip that expert. Leaving out k would give 4 slots and count far too many drops.
      - id: expert-capacity-and-balance.capacity.2
        prompt: A batch of 64 tokens uses top-1 routing over 4 experts with a capacity factor of 1.25. The experts receive 26, 18, 12, and 8 tokens. Find the capacity and the number of dropped tokens.
        answers:
          capacity: 20
          dropped: 6
        reason_answer: a
        reason_options:
          - id: a
            text: Capacity is factor × T × k ÷ N, and assignments past it are dropped
          - id: b
            text: Capacity is factor × T ÷ N, since k doesn't change the load
          - id: c
            text: Capacity is T ÷ N, and overflow moves to the least-busy expert
        feedback: 1.25 × 64 × 1 ÷ 4 = 20 slots. Only the first expert overflows, by 26 − 20 = 6. The spare slots on the other experts don't absorb them in a Switch-style layer.
      - id: expert-capacity-and-balance.capacity.3
        prompt: A batch of 24 tokens uses top-2 routing over 4 experts with a capacity factor of 1.5. The experts receive 20, 14, 9, and 5 assignments. Find the capacity and the number of dropped assignments.
        answers:
          capacity: 18
          dropped: 2
        reason_answer: c
        reason_options:
          - id: b
            text: Capacity is T ÷ N, and overflow moves to the least-busy expert
          - id: a
            text: Capacity is factor × T ÷ N, since k doesn't change the load
          - id: c
            text: Capacity is factor × T × k ÷ N, and assignments past it are dropped
        feedback: 1.5 × 24 × 2 ÷ 4 = 18 slots. Only the first expert exceeds it, by 20 − 18 = 2.
      - id: expert-capacity-and-balance.capacity.4
        prompt: A batch of 40 tokens uses top-1 routing over 8 experts with a capacity factor of 2.0. The experts receive 13, 11, 6, 4, 2, 2, 1, and 1 tokens. Find the capacity and the number of dropped tokens.
        answers:
          capacity: 10
          dropped: 4
        reason_answer: b
        reason_options:
          - id: c
            text: Capacity is factor × T ÷ N, since k doesn't change the load
          - id: b
            text: Capacity is factor × T × k ÷ N, and assignments past it are dropped
          - id: a
            text: Capacity is T ÷ N, and overflow moves to the least-busy expert
        feedback: 2.0 × 40 × 1 ÷ 8 = 10 slots. Two experts overflow, by 3 and by 1, so 4 tokens are dropped even with double headroom.
    numeric_fields:
      - id: capacity
        label: Capacity per expert
      - id: dropped
        label: Dropped assignments
    absolute_tolerance: 0.001
  - id: expert-capacity-and-balance.balance-loss
    objective_ref: objective.expert-capacity-and-balance
    task: base
    response_type: numeric
    points: 1
    hint: Multiply each expert's token share fᵢ by its probability share Pᵢ, add the products, then multiply by N and by α.
    remediation_scene: expert-capacity-and-balance.s3
    absolute_tolerance: 0.0002
    variants:
      - id: expert-capacity-and-balance.balance-loss.1
        prompt: A Switch layer has N = 2 experts and α = 0.01. The token shares are f = [0.75, 0.25] and the probability shares are P = [0.6, 0.4]. What is the balance loss?
        answer: 0.011
        feedback: Σ fᵢPᵢ = 0.75 × 0.6 + 0.25 × 0.4 = 0.55. Then 0.01 × 2 × 0.55 = 0.011, a bit above the even-routing value of 0.01.
      - id: expert-capacity-and-balance.balance-loss.2
        prompt: A Switch layer has N = 4 experts and α = 0.01. Routing is perfectly even, so every fᵢ and Pᵢ equals 0.25. What is the balance loss?
        answer: 0.01
        feedback: Σ fᵢPᵢ = 4 × 0.25 × 0.25 = 0.25 = 1/N. Then 0.01 × 4 × 0.25 = 0.01, exactly α.
      - id: expert-capacity-and-balance.balance-loss.3
        prompt: A Switch layer has N = 4 experts and α = 0.01. The token shares are f = [0.5, 0.25, 0.125, 0.125] and the probability shares are P = [0.4, 0.3, 0.2, 0.1]. What is the balance loss?
        answer: 0.0125
        feedback: Σ fᵢPᵢ = 0.2 + 0.075 + 0.025 + 0.0125 = 0.3125. Then 0.01 × 4 × 0.3125 = 0.0125, which is 1.25 times the even-routing value.
      - id: expert-capacity-and-balance.balance-loss.4
        prompt: A layer has N = 2 experts and α = 0.1. Every token picks expert 1, so f = [1, 0], and P = [0.9, 0.1]. What is the balance loss?
        answer: 0.18
        feedback: Σ fᵢPᵢ = 1 × 0.9 + 0 × 0.1 = 0.9. Then 0.1 × 2 × 0.9 = 0.18, compared with 0.1 for even routing.
