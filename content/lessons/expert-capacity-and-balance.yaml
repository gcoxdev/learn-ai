assessment_families:
- id: expert-capacity-and-balance.base
  objective_ref: objective.expert-capacity-and-balance
  task: base
  response_type: single_choice
  points: 1
  hint: 'Capacity is an explicit policy: trace the inputs, operation, and result before choosing.'
  remediation_scene: expert-capacity-and-balance.s2
  variants:
  - id: expert-capacity-and-balance.base.1
    prompt: Eight top-one assignments across four experts have average load what?
    options:
    - id: c
      text: Eight per expert
    - id: a
      text: Two
    - id: b
      text: Four
    answer: a
    feedback: Divide assignments by expert count.
  - id: expert-capacity-and-balance.base.2
    prompt: Does dropping an expert assignment always remove the whole token?
    options:
    - id: a
      text: No; the architecture and overflow policy determine the effect
    - id: b
      text: 'Yes'
    - id: c
      text: Only if the token is punctuation
    answer: a
    feedback: The expert branch is only part of the computation.
- id: expert-capacity-and-balance.transfer
  objective_ref: objective.expert-capacity-and-balance
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Inspect tails and distribution changes: trace the inputs, operation, and result before choosing.'
  remediation_scene: expert-capacity-and-balance.s4
  variants:
  - id: expert-capacity-and-balance.transfer.1
    prompt: Can overly strong balancing harm task learning?
    options:
    - id: a
      text: Yes; the balancing objective can conflict with useful routing
    - id: b
      text: 'No'
    - id: c
      text: Only if experts are untrained forever
    answer: a
    feedback: The combined training objective creates a tradeoff.
  - id: expert-capacity-and-balance.transfer.2
    prompt: Balanced training loads guarantee balanced specialist inference traffic?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only when top-one is used
    - id: a
      text: 'No'
    answer: a
    feedback: Input distribution and batch composition affect assignments.
