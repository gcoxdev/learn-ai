schema_version: 0.2-draft
lesson:
  id: retrieval-context-and-fine-tuning
  version: 0.4.0-draft
  title: Choose how information should reach the model
  state: draft
  summary: '"Just paste the whole help center in." "No, fine-tune it." "No, keep RAG." Settle the argument with a decision table and some token arithmetic.'
  slot: M26.7
  category: learning
  sources:
    - title: Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks (Lewis et al., 2020)
      url: https://arxiv.org/abs/2005.11401
    - title: "Lost in the Middle: How Language Models Use Long Contexts (Liu et al., 2023)"
      url: https://arxiv.org/abs/2307.03172
objectives:
  - id: objective.retrieval-context-and-fine-tuning
    version: 2-draft
    statement: Retrieval, long context, fine-tuning, and learned model memory solve different information-access or behavior problems; choose and combine them using freshness, provenance, quality, and cost evidence.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - retrieval-context-and-fine-tuning.base.v2
      - retrieval-context-and-fine-tuning.transfer.v2
    prerequisites:
      - anyOf:
          - objective.citations-and-evidence-fidelity
      - anyOf:
          - objective.long-context-capability
      - anyOf:
          - objective.supervised-fine-tuning
scenes:
  - id: retrieval-context-and-fine-tuning.s1
    title: Three proposals for one help center
    type: explanation
    depth: intuition
    objective_refs:
      - objective.retrieval-context-and-fine-tuning
    markdown: |-
      Sprocket's team is arguing. Its core policy pages (returns, refunds, shipping, warranty, chargers, and about 35 more) come to roughly 30,000 tokens, and many current models accept prompts far longer than that. Three people, three proposals:

      - **Priya**: "Keep the RAG pipeline. Retrieve the three best chunks for each question."
      - **Tom**: "Retrieval is fragile. Paste all 30,000 tokens into every prompt. Nothing can be missed."
      - **Ana**: "Fine-tune a model on our pages so it simply *knows* the policies. No search at all."

      Each proposal puts the same facts in a different place. With retrieval, the facts live in an index and a few reach the prompt per question. With **long context**, all the facts sit in every prompt. With **fine-tuning**, which continues training a model on new examples (as in the supervised fine-tuning lesson), the facts are spread through the model's weights. Where a fact lives decides how you update it, cite it, restrict it, and delete it. That's what settles the argument.
    bridges: []
  - id: retrieval-context-and-fine-tuning.s2
    title: The decision table
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.retrieval-context-and-fine-tuning
    markdown: |-
      Score each option against what Sprocket actually needs:

      | Need | Retrieval | Long context | Fine-tuning |
      | --- | --- | --- | --- |
      | Policy changes this week | Good: re-index one page | Good: swap the text | Poor: retrain for every change |
      | Cite the exact source | Good: chunk IDs | Good, if pages are labeled | Poor: weights don't record sources |
      | Delete a fact on request | Good: delete its chunks | Good: drop it from the prompt | Poor: no reliable way to remove one fact |
      | Staff-only pages hidden from customers | Good: filter before ranking | Possible: build a prompt per audience | Poor: one model has seen everything |
      | Collection far bigger than the prompt | Good | Poor: it won't fit | Possible, but facts blur |
      | Same tone and format every time | Partly, via instructions | Partly, via instructions | Good |
      | Input tokens per question | Low (a few chunks) | High (everything, every time) | Low (question only) |

      Retrieval and long context both keep facts as text you can see, change, cite, and remove. Fine-tuning is poor on every row about facts and strongest on the row about behavior. The pattern: retrieve or paste the facts; fine-tune the behavior.

      :::mixup "Fine-tuning on our documents will teach the model our facts."
      Some facts do stick, but you can't point to where one is stored, cite it, or remove it, and the model can blend an old policy with a new one. When the return window changes from 30 days to 45, retrieval needs one re-indexed page; a fine-tuned model needs a new training run and a check that it forgot "30".
      :::
    bridges: []
  - id: retrieval-context-and-fine-tuning.cost
    title: Price out "paste everything"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.retrieval-context-and-fine-tuning
    markdown: |-
      Tom's plan is the simplest to build, so check what it costs to run. Sprocket expects 10,000 questions a day.

      | | Tokens per question | Input tokens per day |
      | --- | ---: | ---: |
      | Long context: all policies | 30,000 | 10,000 × 30,000 = 300 million |
      | Retrieval: 3 chunks plus instructions | 2,000 | 10,000 × 2,000 = 20 million |

      Long context reads 15 times as many input tokens, and a longer prompt also takes longer before the first word of the answer appears. Many providers now offer **prompt caching**, which charges less for a prompt prefix that repeats exactly across requests, and the 30,000 policy tokens are just such a prefix. That narrows the cost gap, though it doesn't remove it.

      Quality is the other question. Liu et al. (2023) found models use facts in the middle of a long prompt less reliably than facts near the start or end, and the long-context lesson showed how to test this on your own documents.

      :::predict Sprocket's warehouse team wants an assistant for a single 3,000-token packing guide that changes once a year and gets 50 questions a day. Which option fits?
      Paste it in. At 3,000 tokens × 50 questions, cost is trivial, nothing can be missed by a retriever, and yearly updates are a text swap. Building a retrieval pipeline here adds parts that can fail without buying anything.
      :::
    bridges: []
  - id: retrieval-context-and-fine-tuning.s3
    title: Fine-tune for how, retrieve for what
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.retrieval-context-and-fine-tuning
    markdown: |-
      Ana's instinct isn't wrong, just aimed at the wrong target. Sprocket's support leads want every reply to follow house style: greet by name, answer in two sentences, cite sources as [S1], and hand off to a person when the sources don't cover the question. Instructions in the prompt get most of the way. But the model drifts on long conversations and forgets the hand-off rule about one time in ten.

      That's a behavior problem, and behavior is what fine-tuning is good at. Train on a few thousand example conversations where the model receives retrieved sources and replies in house style, including cases where the right move is "I'll connect you with a colleague." The facts still arrive through retrieval, fresh every time. The fine-tuned model has simply learned how to use them.

      So the three options aren't rivals. Many production systems combine them: retrieval to find current, permitted evidence; a moderately long context so several chunks and the conversation fit; and light fine-tuning so the model uses that evidence the same careful way every time.
    bridges: []
  - id: retrieval-context-and-fine-tuning.s4
    title: Settle it with a test, not a debate
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.retrieval-context-and-fine-tuning
    markdown: |-
      The table narrows the choice; a test makes it. Sprocket builds 100 questions from real support tickets (including 10 with no answer in the policies and 10 about pages that changed last month) and runs Priya's and Tom's designs:

      | | Retrieval | Long context |
      | --- | ---: | ---: |
      | Correct replies (of 100) | 88 | 90 |
      | Changed-policy questions right (of 10) | 10 | 10 |
      | Correct "I don't know" (of the 10 unanswerable) | 8 | 6 |
      | Input tokens per question | 2,000 | 30,000 |

      Long context wins by 2 questions at 15 times the input. Priya reads the 12 retrieval misses: 7 are chunks that ranked just outside the top 3. Retrieving 5 chunks instead is a cheap fix to test next. Ana's model sits this test out, since each month's policy changes would need a new training run. Her idea comes back for tone.

      Pick by the needs in the table, confirm with a test on real questions, and read the failures before choosing.
    bridges: []
  - id: retrieval-context-and-fine-tuning.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.retrieval-context-and-fine-tuning
    markdown: A law firm's archive, a hospital's access rules, a product launch, and a small rulebook test whether you can pick the right way to get information to a model.
    takeaway: |-
      Retrieval and long context keep facts as text you can update, cite, restrict, and delete; fine-tuning changes behavior and is a poor store for facts. Choose with a needs table, then confirm with a test on real questions.
  - id: retrieval-context-and-fine-tuning.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.retrieval-context-and-fine-tuning
    markdown: |-
      Retrieval finds evidence, long context carries supplied information, and fine-tuning changes learned behavior. Choose a combination that meets the task’s freshness, quality, and cost needs.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - retrieval-context-and-fine-tuning.s1
        - retrieval-context-and-fine-tuning.s2
        - retrieval-context-and-fine-tuning.cost
        - retrieval-context-and-fine-tuning.s3
        - retrieval-context-and-fine-tuning.s4
        - retrieval-context-and-fine-tuning.check
      gate_refs:
        - gate.core
  scene_aliases:
    retrieval-context-and-fine-tuning.recap: retrieval-context-and-fine-tuning.check
assessment_families:
  - id: retrieval-context-and-fine-tuning.base
    objective_ref: objective.retrieval-context-and-fine-tuning
    task: base
    response_type: single_choice
    points: 1
    hint: 'Work through a changing handbook: trace the inputs, operation, and result before choosing.'
    remediation_scene: retrieval-context-and-fine-tuning.s2
    variants:
      - id: retrieval-context-and-fine-tuning.base.1
        prompt: Which mechanism directly supplies selected current documents at inference?
        options:
          - id: c
            text: Only changing the optimizer
          - id: a
            text: Retrieval
          - id: b
            text: Only pretraining from years earlier
        answer: a
        feedback: Retrieval is an external information-access mechanism.
        retired: true
      - id: retrieval-context-and-fine-tuning.base.2
        prompt: What can fine-tuning usefully complement in RAG?
        options:
          - id: a
            text: Learning how to respond using supplied evidence
          - id: b
            text: A guarantee every source remains current forever
          - id: c
            text: Automatic exact deletion of all old facts
        answer: a
        feedback: Adaptation can target behavior while retrieval supplies information.
        retired: true
  - id: retrieval-context-and-fine-tuning.transfer
    objective_ref: objective.retrieval-context-and-fine-tuning
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Compare end-to-end alternatives: trace the inputs, operation, and result before choosing.'
    remediation_scene: retrieval-context-and-fine-tuning.s4
    variants:
      - id: retrieval-context-and-fine-tuning.transfer.1
        prompt: Does fitting a handbook guarantee exact reliable recall of every sentence?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if training loss is small
        answer: a
        feedback: Parameter learning is not a perfect document lookup interface.
        retired: true
      - id: retrieval-context-and-fine-tuning.transfer.2
        prompt: What should guide retrieval versus full-context choice?
        options:
          - id: b
            text: One universal slogan
          - id: c
            text: Only maximum model size
          - id: a
            text: Measured task quality, freshness, provenance, and resource costs
        answer: a
        feedback: The tradeoff depends on the application and workload.
        retired: true
  - id: retrieval-context-and-fine-tuning.base.v2
    objective_ref: objective.retrieval-context-and-fine-tuning
    task: base
    response_type: single_choice
    points: 1
    hint: Ask where the fact will live (an index, the prompt, or the weights), then ask how you would update, cite, or delete it there.
    remediation_scene: retrieval-context-and-fine-tuning.s2
    variants:
      - id: retrieval-context-and-fine-tuning.base.v2.1
        prompt: A bank's fee schedule changes most weeks, and every answer must cite the current schedule. The full set of fee pages is 400,000 tokens. Which approach fits best?
        options:
          - id: b
            text: Fine-tune a model on the fee pages after each weekly change
          - id: a
            text: Retrieve the relevant fee pages for each question and cite them
          - id: c
            text: Paste all of the fee pages into every prompt so nothing is missed
        answer: a
        feedback: Weekly changes, citations, and a collection too big for one prompt all point to retrieval. Weekly retraining is slow and can't cite, and 400,000 tokens per question is far too large to paste in.
      - id: retrieval-context-and-fine-tuning.base.v2.2
        prompt: A support assistant already retrieves the right policies, but its replies ignore the company's three-part reply format about one time in ten, despite instructions. What is fine-tuning best suited to fix here?
        options:
          - id: a
            text: Teaching it to follow the reply format consistently when given sources
          - id: c
            text: Storing the policies in its weights so retrieval can be dropped
          - id: b
            text: Keeping it up to date whenever one of the policies changes
        answer: a
        feedback: A consistent format is a behavior, which fine-tuning handles well. Storing or updating facts in weights is exactly where fine-tuning is weakest, so retrieval should keep supplying the policies.
      - id: retrieval-context-and-fine-tuning.base.v2.3
        prompt: A customer asks a company to remove their complaint letter from everything its assistant uses. The letter was in a fine-tuning dataset and also in the retrieval index. What can the company do reliably?
        options:
          - id: c
            text: Remove it from both by deleting the file from the training dataset
          - id: b
            text: Remove it from the weights by fine-tuning on a note saying to ignore it
          - id: a
            text: Delete its chunks from the index; the weights have no single copy to delete
        answer: a
        feedback: Index chunks can be found by document ID and deleted. Whatever the model absorbed in training is spread through its weights; deleting the training file changes nothing until a new model is trained, and a "please ignore" note doesn't remove it.
      - id: retrieval-context-and-fine-tuning.base.v2.4
        prompt: A team puts 30,000 tokens of policy into every prompt for 10,000 questions a day. A retrieval design would use 2,000 tokens per question. How many times more input tokens does the long-context design read?
        options:
          - id: b
            text: About 2 times more, since both read the policy text
          - id: c
            text: About 1.5 times more, once instructions are included
          - id: a
            text: 15 times more, 300 million tokens a day against 20 million
        answer: a
        feedback: 30,000 ÷ 2,000 = 15, so 300 million input tokens a day against 20 million. The question count multiplies both designs equally, so it doesn't change the ratio.
  - id: retrieval-context-and-fine-tuning.transfer.v2
    objective_ref: objective.retrieval-context-and-fine-tuning
    task: transfer
    response_type: single_choice
    points: 1
    hint: Check the size of the collection, how often it changes, who may see what, and whether the problem is missing facts or inconsistent behavior.
    remediation_scene: retrieval-context-and-fine-tuning.s4
    variants:
      - id: retrieval-context-and-fine-tuning.transfer.v2.1
        prompt: A law firm wants an assistant over 2 million archived contracts, with every answer citing the contract and clause. Which approach fits?
        options:
          - id: a
            text: Retrieval over the archive, returning the clauses with their IDs
          - id: b
            text: A long-context model given as many contracts as the prompt holds
          - id: c
            text: A model fine-tuned on the archive so it can answer from memory
        answer: a
        feedback: Two million contracts won't fit in any prompt, and a fine-tuned model can't cite which clause it learned from. Retrieval scales to the archive and keeps each clause's ID for citation.
      - id: retrieval-context-and-fine-tuning.transfer.v2.2
        prompt: A hospital assistant must never show one department's internal protocols to staff from another department. Which approach makes this easiest to enforce?
        options:
          - id: c
            text: Fine-tune one model per department on that department's protocols
          - id: a
            text: Retrieval that filters by the user's department before ranking
          - id: b
            text: One long prompt holding all protocols, told to respect departments
        answer: a
        feedback: Filtering before ranking means other departments' protocols never reach the model at all. An instruction inside a shared prompt can be ignored or talked around, and a model per department is costly and still can't cite or delete individual protocols.
      - id: retrieval-context-and-fine-tuning.transfer.v2.3
        prompt: A company fine-tuned its assistant on product manuals in January. In March it launches a new scooter, and the assistant describes it with a discontinued model's specs. What is the underlying problem?
        options:
          - id: b
            text: The fine-tuning run used too few examples of scooter manuals
          - id: c
            text: The assistant's context window is too short for the new manual
          - id: a
            text: Its facts are frozen at training time, and nothing supplies new ones
        answer: a
        feedback: Knowledge learned into weights stops at the training run; the model fills gaps with the closest thing it knows. Retrieval over current manuals would supply the new specs. More old examples wouldn't mention a product that didn't exist yet.
      - id: retrieval-context-and-fine-tuning.transfer.v2.4
        prompt: For a 20,000-token employee handbook that changes twice a year, a test shows retrieval answers 80% correctly while pasting the whole handbook answers 95%, at a cost the team can afford. What should they do?
        options:
          - id: a
            text: Use the long-context design, since it wins on quality at acceptable cost
          - id: b
            text: Keep retrieval, because pasting documents into prompts doesn't scale
          - id: c
            text: Fine-tune on the handbook so that neither retrieval nor pasting is needed
        answer: a
        feedback: The handbook is small and stable, and the test shows a clear quality gain at an affordable cost. Scaling worries apply to large collections, not this one, and fine-tuning would make updates and citations harder.
