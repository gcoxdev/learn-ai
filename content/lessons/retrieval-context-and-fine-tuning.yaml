schema_version: 0.2-draft
lesson:
  id: retrieval-context-and-fine-tuning
  version: 0.1.0-draft
  title: Choose how information should reach the model
  state: draft
  summary: Retrieval, long context, fine-tuning, and learned model memory solve different information-access or
    behavior problems; choose and combine them using freshness, provenance, quality, and cost evidence.
  slot: M26.7
  category: learning
  minutes: 12
  sources:
  - title: Retrieval-Augmented Generation
    url: https://arxiv.org/abs/2005.11401
  - title: Lost in the Middle
    url: https://arxiv.org/abs/2307.03172
objectives:
- id: objective.retrieval-context-and-fine-tuning
  version: 1-draft
  statement: Retrieval, long context, fine-tuning, and learned model memory solve different information-access or
    behavior problems; choose and combine them using freshness, provenance, quality, and cost evidence.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - retrieval-context-and-fine-tuning.base
  - retrieval-context-and-fine-tuning.transfer
  prerequisites:
  - anyOf:
    - objective.citations-and-evidence-fidelity
  - anyOf:
    - objective.long-context-capability
  - anyOf:
    - objective.supervised-fine-tuning
scenes:
- id: retrieval-context-and-fine-tuning.s1
  title: Match the mechanism to the need
  type: explanation
  depth: intuition
  objective_refs:
  - objective.retrieval-context-and-fine-tuning
  markdown: Retrieval selects external evidence. Long context lets more supplied material enter one request. Fine-tuning
    changes behavior or representations through parameter updates. Learned model memory provides statistical knowledge
    from training but may not expose sources or current versions reliably.
  text_mode: Retrieval selects external evidence. Long context lets more supplied material enter one request. Fine-tuning
    changes behavior or representations through parameter updates. Learned model memory provides statistical knowledge
    from training but may not expose sources or current versions reliably.
  bridges: []
- id: retrieval-context-and-fine-tuning.s2
  title: Work through a changing handbook
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.retrieval-context-and-fine-tuning
  markdown: If a handbook changes weekly and answers need exact citations, a maintained retrieval pipeline can expose
    current passages. Passing the entire handbook may be feasible at some lengths and costs. Fine-tuning alone is
    a poor substitute for a reliable, immediately updated record interface.
  text_mode: If a handbook changes weekly and answers need exact citations, a maintained retrieval pipeline can
    expose current passages. Passing the entire handbook may be feasible at some lengths and costs. Fine-tuning
    alone is a poor substitute for a reliable, immediately updated record interface.
  bridges: []
- id: retrieval-context-and-fine-tuning.s3
  title: Use adaptation for behavior
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.retrieval-context-and-fine-tuning
  markdown: Fine-tuning can teach domain style, structured response formats, or better use of supplied evidence.
    It can complement retrieval rather than compete with it. Training on documents does not guarantee exact recall
    or dependable deletion of individual facts later.
  text_mode: Fine-tuning can teach domain style, structured response formats, or better use of supplied evidence.
    It can complement retrieval rather than compete with it. Training on documents does not guarantee exact recall
    or dependable deletion of individual facts later.
  bridges: []
- id: retrieval-context-and-fine-tuning.s4
  title: Compare end-to-end alternatives
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.retrieval-context-and-fine-tuning
  markdown: Measure quality, missed evidence, latency, context cost, update effort, and provenance needs. Retrieval
    can miss key passages; long context can dilute attention; tuning can forget or overfit. A hybrid is useful when
    its measured gains justify additional maintenance and failure paths.
  text_mode: Measure quality, missed evidence, latency, context cost, update effort, and provenance needs. Retrieval
    can miss key passages; long context can dilute attention; tuning can forget or overfit. A hybrid is useful when
    its measured gains justify additional maintenance and failure paths.
  bridges: []
- id: retrieval-context-and-fine-tuning.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.retrieval-context-and-fine-tuning
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: retrieval-context-and-fine-tuning.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.retrieval-context-and-fine-tuning
  markdown: Retrieval, long context, fine-tuning, and learned model memory solve different information-access or
    behavior problems; choose and combine them using freshness, provenance, quality, and cost evidence.
  text_mode: Retrieval, long context, fine-tuning, and learned model memory solve different information-access or
    behavior problems; choose and combine them using freshness, provenance, quality, and cost evidence.
