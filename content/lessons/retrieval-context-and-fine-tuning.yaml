assessment_families:
- id: retrieval-context-and-fine-tuning.base
  objective_ref: objective.retrieval-context-and-fine-tuning
  task: base
  response_type: single_choice
  points: 1
  hint: 'Work through a changing handbook: trace the inputs, operation, and result before choosing.'
  remediation_scene: retrieval-context-and-fine-tuning.s2
  variants:
  - id: retrieval-context-and-fine-tuning.base.1
    prompt: Which mechanism directly supplies selected current documents at inference?
    options:
    - id: c
      text: Only changing the optimizer
    - id: a
      text: Retrieval
    - id: b
      text: Only pretraining from years earlier
    answer: a
    feedback: Retrieval is an external information-access mechanism.
  - id: retrieval-context-and-fine-tuning.base.2
    prompt: What can fine-tuning usefully complement in RAG?
    options:
    - id: a
      text: Learning how to respond using supplied evidence
    - id: b
      text: A guarantee every source remains current forever
    - id: c
      text: Automatic exact deletion of all old facts
    answer: a
    feedback: Adaptation can target behavior while retrieval supplies information.
- id: retrieval-context-and-fine-tuning.transfer
  objective_ref: objective.retrieval-context-and-fine-tuning
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Compare end-to-end alternatives: trace the inputs, operation, and result before choosing.'
  remediation_scene: retrieval-context-and-fine-tuning.s4
  variants:
  - id: retrieval-context-and-fine-tuning.transfer.1
    prompt: Does fitting a handbook guarantee exact reliable recall of every sentence?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if training loss is small
    answer: a
    feedback: Parameter learning is not a perfect document lookup interface.
  - id: retrieval-context-and-fine-tuning.transfer.2
    prompt: What should guide retrieval versus full-context choice?
    options:
    - id: b
      text: One universal slogan
    - id: c
      text: Only maximum model size
    - id: a
      text: Measured task quality, freshness, provenance, and resource costs
    answer: a
    feedback: The tradeoff depends on the application and workload.
