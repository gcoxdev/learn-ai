schema_version: 0.2-draft
lesson:
  id: modality-tokenization
  version: 0.1.0-draft
  title: Turn images, sound, and video into manageable model inputs
  state: draft
  summary: Modality-specific encoders and codecs trade detail, sequence length, and reconstruction quality; continuous
    features and discrete code tokens are distinct representation choices.
  slot: M23.4
  category: learning
  minutes: 12
  sources:
  - title: Vision Transformer
    url: https://arxiv.org/abs/2010.11929
  - title: EnCodec
    url: https://arxiv.org/abs/2210.13438
  - title: VQ-VAE
    url: https://arxiv.org/abs/1711.00937
objectives:
- id: objective.modality-tokenization
  version: 1-draft
  statement: Modality-specific encoders and codecs trade detail, sequence length, and reconstruction quality; continuous
    features and discrete code tokens are distinct representation choices.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - modality-tokenization.base
  - modality-tokenization.transfer
  prerequisites:
  - anyOf:
    - objective.vision-language-interfaces
  - anyOf:
    - objective.autoregressive-modalities
scenes:
- id: modality-tokenization.s1
  title: Token does not always mean a text vocabulary ID
  type: explanation
  depth: intuition
  objective_refs:
  - objective.modality-tokenization
  markdown: A visual token can be a continuous projected patch vector, while a codec token can be a discrete index
    into a learned codebook. Both may be processed in sequences, but their training objectives and decoding interfaces
    differ. State the representation instead of assuming every token is a word-like symbol.
  text_mode: A visual token can be a continuous projected patch vector, while a codec token can be a discrete index
    into a learned codebook. Both may be processed in sequences, but their training objectives and decoding interfaces
    differ. State the representation instead of assuming every token is a word-like symbol.
  bridges: []
- id: modality-tokenization.s2
  title: Count patches before choosing resolution
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.modality-tokenization
  markdown: A 224 by 224 image divided into nonoverlapping 16 by 16 patches yields 14×14 = 196 patches. Higher resolution
    increases token count rapidly. Cropping, adaptive tiling, or pooling can change detail coverage and compute,
    with consequences for small text and spatial tasks.
  text_mode: A 224 by 224 image divided into nonoverlapping 16 by 16 patches yields 14×14 = 196 patches. Higher
    resolution increases token count rapidly. Cropping, adaptive tiling, or pooling can change detail coverage and
    compute, with consequences for small text and spatial tasks.
  bridges: []
- id: modality-tokenization.s3
  title: Represent audio and time
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.modality-tokenization
  markdown: An audio codec can quantize frames into one or more codebook IDs, then reconstruct sound through a decoder.
    Frame rate and number of codebooks affect sequence length and fidelity. Video adds temporal sampling and spatial
    patches, so even short clips can produce many input units.
  text_mode: An audio codec can quantize frames into one or more codebook IDs, then reconstruct sound through a
    decoder. Frame rate and number of codebooks affect sequence length and fidelity. Video adds temporal sampling
    and spatial patches, so even short clips can produce many input units.
  bridges: []
- id: modality-tokenization.s4
  title: Evaluate compression in context
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.modality-tokenization
  markdown: A representation that preserves perceptual quality may still discard a feature needed for a downstream
    decision. Test reconstruction, timing, fine detail, and task performance. Missing frames or audio frequencies
    cannot be assumed recoverable merely because later generated output looks or sounds plausible.
  text_mode: A representation that preserves perceptual quality may still discard a feature needed for a downstream
    decision. Test reconstruction, timing, fine detail, and task performance. Missing frames or audio frequencies
    cannot be assumed recoverable merely because later generated output looks or sounds plausible.
  bridges: []
- id: modality-tokenization.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.modality-tokenization
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: modality-tokenization.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.modality-tokenization
  markdown: Modality-specific encoders and codecs trade detail, sequence length, and reconstruction quality; continuous
    features and discrete code tokens are distinct representation choices.
  text_mode: Modality-specific encoders and codecs trade detail, sequence length, and reconstruction quality; continuous
    features and discrete code tokens are distinct representation choices.
navigation:
  routes:
  - id: route.core
    scene_sequence:
