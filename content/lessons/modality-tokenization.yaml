assessment_families:
- id: modality-tokenization.base
  objective_ref: objective.modality-tokenization
  task: base
  response_type: single_choice
  points: 1
  hint: 'Count patches before choosing resolution: trace the inputs, operation, and result before choosing.'
  remediation_scene: modality-tokenization.s2
  variants:
  - id: modality-tokenization.base.1
    prompt: 224 by 224 pixels with 16 by 16 patches produce how many patches?
    options:
    - id: b
      text: '14'
    - id: c
      text: '224'
    - id: a
      text: '196'
    answer: a
    feedback: There are 14 patches per side, so 14 squared.
  - id: modality-tokenization.base.2
    prompt: Must every visual token be a discrete vocabulary ID?
    options:
    - id: c
      text: Only if it is called a token
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Continuous patch embeddings are also commonly called tokens.
- id: modality-tokenization.transfer
  objective_ref: objective.modality-tokenization
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate compression in context: trace the inputs, operation, and result before choosing.'
  remediation_scene: modality-tokenization.s4
  variants:
  - id: modality-tokenization.transfer.1
    prompt: What can more audio codebooks per frame change?
    options:
    - id: c
      text: The existence of time itself
    - id: a
      text: Representation rate and reconstruction fidelity
    - id: b
      text: Only the text font
    answer: a
    feedback: Multiple codes trade bandwidth and capacity against quality.
  - id: modality-tokenization.transfer.2
    prompt: Does pleasant reconstruction prove all task-relevant details survived?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only for compressed video
    answer: a
    feedback: Perceptual quality and decision-relevant fidelity differ.
