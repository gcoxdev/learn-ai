schema_version: 0.2-draft
lesson:
  id: agent-evaluation
  version: 0.3.0-draft
  title: Evaluate the completed task and the trajectory that produced it
  state: draft
  summary: Check what an agent actually accomplished and what it cost.
  slot: M25.8
  category: learning
  sources:
  - title: AgentBench
    url: https://arxiv.org/abs/2308.03688
  - title: SWE-bench
    url: https://arxiv.org/abs/2310.06770
objectives:
- id: objective.agent-evaluation
  version: 1-draft
  statement: Agent evaluation needs reproducible environments, task-level success criteria, action traces,
    and resource accounting; final text alone cannot establish that external work was completed correctly.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - agent-evaluation.base
  - agent-evaluation.transfer
  prerequisites:
  - anyOf:
    - objective.agent-permissions-and-untrusted-input
  - anyOf:
    - objective.agent-planning-and-recovery
  - anyOf:
    - objective.research-reporting
scenes:
- id: agent-evaluation.s1
  title: Define observable success
  type: explanation
  depth: intuition
  objective_refs:
  - objective.agent-evaluation
  markdown: A file-editing task might require a specific resulting file and passing behavior checks. A retrieval
    task needs supported answers from permitted sources. Scoring only the agent’s final statement allows false
    completion claims to pass. Inspect the relevant environment state.
  text_mode: A file-editing task might require a specific resulting file and passing behavior checks. A retrieval
    task needs supported answers from permitted sources. Scoring only the agent’s final statement allows false
    completion claims to pass. Inspect the relevant environment state.
  bridges: []
- id: agent-evaluation.s2
  title: Record the trajectory
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agent-evaluation
  markdown: Capture inputs, tool calls, returned observations, state changes, failures, retries, and stopping
    reasons within privacy limits. This helps distinguish planning mistakes, interface errors, poor perception,
    and execution failures. Keep model, prompt, tool, and environment versions linked to the run.
  text_mode: Capture inputs, tool calls, returned observations, state changes, failures, retries, and stopping
    reasons within privacy limits. This helps distinguish planning mistakes, interface errors, poor perception,
    and execution failures. Keep model, prompt, tool, and environment versions linked to the run.
  bridges: []
- id: agent-evaluation.s3
  title: Control the evaluation environment
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agent-evaluation
  markdown: Reset task state, account for nondeterministic services, and separate training examples from evaluation
    tasks. Repeated trials reveal variance. Tests should include missing information, tool failures, adversarial
    content, and tasks that should stop or ask for required clarification.
  text_mode: Reset task state, account for nondeterministic services, and separate training examples from evaluation
    tasks. Repeated trials reveal variance. Tests should include missing information, tool failures, adversarial
    content, and tasks that should stop or ask for required clarification.
  bridges: []
- id: agent-evaluation.s4
  title: Measure complexity and cost
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agent-evaluation
  markdown: 'Report success rate alongside total tokens, tool calls, elapsed time, and human interventions.
    Compare single-agent and workflow baselines when relevant. A long successful trace can conceal inefficient
    looping; a short answer can conceal unfinished work. The task outcome and process evidence belong together.


    Suppose system A completes 8 of 10 tasks using 100 total tool calls; B completes 9 using 300 calls. B has
    the higher observed success rate, but it also uses three times as many calls. Count failed runs in resource
    totals rather than reporting only the cheap successes. Ten tasks are too few to establish a precise general
    advantage; repeat on a larger representative set before drawing that conclusion.'
  text_mode: 'Report success rate alongside total tokens, tool calls, elapsed time, and human interventions.
    Compare single-agent and workflow baselines when relevant. A long successful trace can conceal inefficient
    looping; a short answer can conceal unfinished work. The task outcome and process evidence belong together.


    Suppose system A completes 8 of 10 tasks using 100 total tool calls; B completes 9 using 300 calls. B has
    the higher observed success rate, but it also uses three times as many calls. Count failed runs in resource
    totals rather than reporting only the cheap successes. Ten tasks are too few to establish a precise general
    advantage; repeat on a larger representative set before drawing that conclusion.'
  bridges: []
- id: agent-evaluation.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.agent-evaluation
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Check the completed task in the environment, then inspect the actions and resources used to get
    there. A claim of completion is not evidence that the work happened.
- id: agent-evaluation.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.agent-evaluation
  markdown: Check the completed task in the environment, then inspect the actions and resources used to get
    there. A claim of completion is not evidence that the work happened.
  text_mode: Check the completed task in the environment, then inspect the actions and resources used to get
    there. A claim of completion is not evidence that the work happened.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - agent-evaluation.s1
    - agent-evaluation.s2
    - agent-evaluation.s3
    - agent-evaluation.s4
    - agent-evaluation.check
    gate_refs:
    - gate.core
  scene_aliases:
    agent-evaluation.recap: agent-evaluation.check
assessment_families:
- id: agent-evaluation.base
  objective_ref: objective.agent-evaluation
  task: base
  response_type: single_choice
  points: 1
  hint: 'Record the trajectory: trace the inputs, operation, and result before choosing.'
  remediation_scene: agent-evaluation.s2
  variants:
  - id: agent-evaluation.base.1
    prompt: An agent says a file was updated. What verifies completion?
    options:
    - id: a
      text: Inspecting the resulting file and required behavior
    - id: b
      text: The statement alone
    - id: c
      text: Only response confidence
    answer: a
    feedback: External work needs external-state evidence.
  - id: agent-evaluation.base.2
    prompt: Why reset environment state between trials?
    options:
    - id: b
      text: To guarantee every run succeeds
    - id: c
      text: To remove all model variability
    - id: a
      text: To make task conditions comparable
    answer: a
    feedback: Residual changes can contaminate later evaluations.
- id: agent-evaluation.transfer
  objective_ref: objective.agent-evaluation
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Measure complexity and cost: trace the inputs, operation, and result before choosing.'
  remediation_scene: agent-evaluation.s4
  variants:
  - id: agent-evaluation.transfer.1
    prompt: What can action traces help diagnose?
    options:
    - id: b
      text: Every hidden neural cause with certainty
    - id: c
      text: Only spelling mistakes
    - id: a
      text: Where planning, tools, or execution failed
    answer: a
    feedback: Observable transitions locate many system-level failures.
  - id: agent-evaluation.transfer.2
    prompt: Should success rate be reported without resource use in a cost-sensitive comparison?
    options:
    - id: c
      text: Only model names are needed
    - id: a
      text: No; include the relevant operating costs
    - id: b
      text: Yes, costs never affect usefulness
    answer: a
    feedback: Efficiency is part of the deployment decision.
