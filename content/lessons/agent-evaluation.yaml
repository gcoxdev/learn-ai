schema_version: 0.2-draft
lesson:
  id: agent-evaluation
  version: 0.1.0-draft
  title: Evaluate the completed task and the trajectory that produced it
  state: draft
  summary: Agent evaluation needs reproducible environments, task-level success criteria, action traces, and resource
    accounting; final text alone cannot establish that external work was completed correctly.
  slot: M25.8
  category: learning
  minutes: 12
  sources:
  - title: AgentBench
    url: https://arxiv.org/abs/2308.03688
  - title: SWE-bench
    url: https://arxiv.org/abs/2310.06770
objectives:
- id: objective.agent-evaluation
  version: 1-draft
  statement: Agent evaluation needs reproducible environments, task-level success criteria, action traces, and resource
    accounting; final text alone cannot establish that external work was completed correctly.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - agent-evaluation.base
  - agent-evaluation.transfer
  prerequisites:
  - anyOf:
    - objective.agent-permissions-and-untrusted-input
  - anyOf:
    - objective.multi-agent-learning-and-games
  - anyOf:
    - objective.research-reporting
scenes:
- id: agent-evaluation.s1
  title: Define observable success
  type: explanation
  depth: intuition
  objective_refs:
  - objective.agent-evaluation
  markdown: A file-editing task might require a specific resulting file and passing behavior checks. A retrieval
    task needs supported answers from permitted sources. Scoring only the agent’s final statement allows false completion
    claims to pass. Inspect the relevant environment state.
  text_mode: A file-editing task might require a specific resulting file and passing behavior checks. A retrieval
    task needs supported answers from permitted sources. Scoring only the agent’s final statement allows false completion
    claims to pass. Inspect the relevant environment state.
  bridges: []
- id: agent-evaluation.s2
  title: Record the trajectory
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agent-evaluation
  markdown: Capture inputs, tool calls, returned observations, state changes, failures, retries, and stopping reasons
    within privacy limits. This helps distinguish planning mistakes, interface errors, poor perception, and execution
    failures. Keep model, prompt, tool, and environment versions linked to the run.
  text_mode: Capture inputs, tool calls, returned observations, state changes, failures, retries, and stopping reasons
    within privacy limits. This helps distinguish planning mistakes, interface errors, poor perception, and execution
    failures. Keep model, prompt, tool, and environment versions linked to the run.
  bridges: []
- id: agent-evaluation.s3
  title: Control the evaluation environment
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agent-evaluation
  markdown: Reset task state, account for nondeterministic services, and separate training examples from evaluation
    tasks. Repeated trials reveal variance. Tests should include missing information, tool failures, adversarial
    content, and tasks that should stop or ask for required clarification.
  text_mode: Reset task state, account for nondeterministic services, and separate training examples from evaluation
    tasks. Repeated trials reveal variance. Tests should include missing information, tool failures, adversarial
    content, and tasks that should stop or ask for required clarification.
  bridges: []
- id: agent-evaluation.s4
  title: Measure complexity and cost
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agent-evaluation
  markdown: Report success rate alongside total tokens, tool calls, elapsed time, and human interventions. Compare
    single-agent and workflow baselines when relevant. A long successful trace can conceal inefficient looping;
    a short answer can conceal unfinished work. The task outcome and process evidence belong together.
  text_mode: Report success rate alongside total tokens, tool calls, elapsed time, and human interventions. Compare
    single-agent and workflow baselines when relevant. A long successful trace can conceal inefficient looping;
    a short answer can conceal unfinished work. The task outcome and process evidence belong together.
  bridges: []
- id: agent-evaluation.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.agent-evaluation
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Agent evaluation needs reproducible environments, task-level success criteria, action traces, and resource
    accounting; final text alone cannot establish that external work was completed correctly.
- id: agent-evaluation.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.agent-evaluation
  markdown: Agent evaluation needs reproducible environments, task-level success criteria, action traces, and resource
    accounting; final text alone cannot establish that external work was completed correctly.
  text_mode: Agent evaluation needs reproducible environments, task-level success criteria, action traces, and resource
    accounting; final text alone cannot establish that external work was completed correctly.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - agent-evaluation.s1
    - agent-evaluation.s2
    - agent-evaluation.s3
    - agent-evaluation.s4
    - agent-evaluation.check
    gate_refs:
    - gate.core
  scene_aliases:
    agent-evaluation.recap: agent-evaluation.check
assessment_families:
- id: agent-evaluation.base
  objective_ref: objective.agent-evaluation
  task: base
  response_type: single_choice
  points: 1
  hint: 'Record the trajectory: trace the inputs, operation, and result before choosing.'
  remediation_scene: agent-evaluation.s2
  variants:
  - id: agent-evaluation.base.1
    prompt: An agent says a file was updated. What verifies completion?
    options:
    - id: a
      text: Inspecting the resulting file and required behavior
    - id: b
      text: The statement alone
    - id: c
      text: Only response confidence
    answer: a
    feedback: External work needs external-state evidence.
  - id: agent-evaluation.base.2
    prompt: Why reset environment state between trials?
    options:
    - id: b
      text: To guarantee every run succeeds
    - id: c
      text: To remove all model variability
    - id: a
      text: To make task conditions comparable
    answer: a
    feedback: Residual changes can contaminate later evaluations.
- id: agent-evaluation.transfer
  objective_ref: objective.agent-evaluation
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Measure complexity and cost: trace the inputs, operation, and result before choosing.'
  remediation_scene: agent-evaluation.s4
  variants:
  - id: agent-evaluation.transfer.1
    prompt: What can action traces help diagnose?
    options:
    - id: b
      text: Every hidden neural cause with certainty
    - id: c
      text: Only spelling mistakes
    - id: a
      text: Where planning, tools, or execution failed
    answer: a
    feedback: Observable transitions locate many system-level failures.
  - id: agent-evaluation.transfer.2
    prompt: Should success rate be reported without resource use in a cost-sensitive comparison?
    options:
    - id: c
      text: Only model names are needed
    - id: a
      text: No; include the relevant operating costs
    - id: b
      text: Yes, costs never affect usefulness
    answer: a
    feedback: Efficiency is part of the deployment decision.
