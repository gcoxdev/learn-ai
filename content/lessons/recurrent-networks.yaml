      url: https://arxiv.org/abs/1704.04110
objectives:
  - id: objective.recurrent-networks
    version: 2-draft
    statement: Recurrent networks update a hidden state using new input and prior state; shared parameters process sequences, while backpropagation through time handles their repeated use.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - recurrent-networks.base.v2
      - recurrent-networks.transfer.v2
      - recurrent-networks.calc.v2
    prerequisites:
      - anyOf:
          - objective.neural-forward-pass
      - anyOf:
          - objective.automatic-differentiation
scenes:
  - id: recurrent-networks.s1
    title: A running hunch about the day
    type: explanation
    depth: intuition
    objective_refs:
      - objective.recurrent-networks
    markdown: |-
      The seasonal naive forecast from the last lesson has no sense of *today*. If a tour bus unloads at Pebble Café at 7 a.m. and sales run 10 cups above normal, "same hour last week" still predicts a normal 8 a.m.

      Ana wants a model that reads the day as it happens, one hour at a time, and keeps a running hunch: "today is busier than usual." That's what a **recurrent neural network (RNN)** does. At each step it takes two things, the new input and its own previous hunch, and combines them into an updated hunch. The hunch is a short list of numbers called the **hidden state**, written $h_t$ for step $t$.

      Two features make it recurrent:

      - **The same rule at every step.** The 8 a.m. update and the 2 p.m. update use the same weights. Those shared weights are what training learns, so a model trained on 8-hour days can read a 12-hour day.
      - **The state is the only memory.** Nothing else is carried forward. Whatever the model will need from 7 a.m. at noon has to survive, squeezed into $h_t$, through every update in between.

      An **output head**, a small layer on top, turns the state into an answer: here, a forecast for the next hour. Drawing the loop once per step, as below, is called **unrolling** the network.
    bridges: []
    diagram:
      caption: An RNN unrolled over three hours. The same weights update the state at every step, and the last state feeds the forecast.
      description: The starting state h0 and the first input x1 both feed state h1. State h1 and input x2 feed state h2. State h2 and input x3 feed state h3. Every state-to-state arrow uses the same weight W_h, and every input arrow uses the same weight W_x. State h3 feeds an output head that produces the next-hour forecast.
      nodes:
        - id: h0
          label: h0 = 0
          note: start of day
          col: 0
          row: 1
          tone: muted
        - id: h1
          label: h1
          col: 1
          row: 1
          tone: accent
        - id: h2
          label: h2
          col: 2
          row: 1
          tone: accent
        - id: h3
          label: h3
          col: 3
          row: 1
          tone: accent
        - id: x1
          label: x1, 7 a.m.
          col: 1
          row: 2
          tone: data
        - id: x2
          label: x2, 8 a.m.
          col: 2
          row: 2
          tone: data
        - id: x3
          label: x3, 9 a.m.
          col: 3
          row: 2
          tone: data
        - id: yhat
          label: 10 a.m. forecast
          note: output head
          col: 4
          row: 1
      edges:
        - from: h0
          to: h1
          label: W_h
        - from: x1
          to: h1
          label: W_x
        - from: h1
          to: h2
          label: same W_h
        - from: x2
          to: h2
          label: same W_x
        - from: h2
          to: h3
          label: same W_h
        - from: x3
          to: h3
          label: same W_x
        - from: h3
          to: yhat
  - id: recurrent-networks.s2
    title: One hour of the recurrence, by hand
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.recurrent-networks
    markdown: |-
      The standard update is

      $$h_t = \tanh(W_h\, h_{t-1} + W_x\, x_t + b)$$

      Multiply the old state by one weight, the new input by another, add a bias, and squash the result with $\tanh$, which keeps every value between −1 and 1.

      Shrink everything to single numbers so you can follow it: $W_h = 0.5$, $W_x = 1.0$, $b = 0$, starting from $h_0 = 0$. The input $x_t$ is how far sales ran above normal that hour, in units of 10 cups: $+1.0$ at 7 a.m., $+0.5$ at 8 a.m., and $0$ at 9 a.m.

      | Hour | Inside the tanh | $h_t$ |
      | --- | --- | ---: |
      | 7 a.m. | $0.5 \times 0 + 1.0 \times 1.0 = 1.000$ | 0.762 |
      | 8 a.m. | $0.5 \times 0.762 + 1.0 \times 0.5 = 0.881$ | 0.707 |
      | 9 a.m. | $0.5 \times 0.707 + 1.0 \times 0 = 0.353$ | 0.339 |

      At 9 a.m. nothing unusual happened, yet the state is still positive. The morning's surprise is carried forward, shrinking by roughly half each hour because $W_h = 0.5$.

      :::predict Suppose 9 a.m. is another busy hour, x = +1.0. What is the new h?
      Inside the tanh: $0.5 \times 0.707 + 1.0 = 1.353$, and $\tanh(1.353) \approx 0.875$. The state climbs instead of fading: "today really is busy." The weights didn't change at all; only the input did.
      :::

      :::papers The Elman network
      This is the simple RNN of Jeffrey Elman's 1990 paper *Finding Structure in Time*. In a real model $h_t$ is a vector, say 64 numbers, so $W_h$ is a 64 × 64 matrix, $W_x$ is 64 × (number of input features), and $b$ has 64 entries. Our 0.5, 1.0, and 0 are the one-number versions. The output head is usually one more layer, $\hat{y}_{t+1} = W_y h_t + c$.
      :::
    bridges:
      - chain-rule
  - id: recurrent-networks.s3
    title: Backpropagation through time, and the fading gradient
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.recurrent-networks
    markdown: |-
      To train an RNN, compute the loss on its forecasts, then run backpropagation on the unrolled diagram, exactly as in the backpropagation lesson of module 11. This is called **backpropagation through time (BPTT)**. Because $W_h$ appears at every step, its gradient is the *sum* of the contributions from every step where it was used.

      To learn that a 7 a.m. surprise matters at 9 a.m., the gradient has to travel from $h_3$ back to $h_1$. By the chain rule, each step back multiplies by one factor, $\partial h_t / \partial h_{t-1} = W_h\,(1 - h_t^2)$, because the derivative of tanh is $1 - \tanh^2$:

      - 9 a.m. → 8 a.m.: $0.5 \times (1 - 0.339^2) = 0.442$
      - 8 a.m. → 7 a.m.: $0.5 \times (1 - 0.707^2) = 0.250$

      Their product is $0.111$. Two steps back, the signal is already down to a ninth. The program repeats the calculation:

      ```python run
      import numpy as np

      w_h, w_x, b = 0.5, 1.0, 0.0          # the same three numbers are used at every hour
      surprise = [1.0, 0.5, 0.0]           # sales above normal, in units of 10 cups

      h, states = 0.0, []
      for t, x in enumerate(surprise, start=1):
          h = np.tanh(w_h * h + w_x * x + b)
          states.append(h)
          print(f"hour {t}: x = {x:+.1f}  ->  h = {h:.3f}")

      # Backpropagation through time: how much does h_1 still move the last state?
      factors = [w_h * (1 - h**2) for h in states[1:]]   # dh_t/dh_(t-1) = w_h * tanh'
      print("factors:", [round(float(f), 3) for f in factors])
      print(f"dh_{len(states)} / dh_1 = {np.prod(factors):.3g}")
      ```

      Change `surprise` to `[1.0] + [0.0] * 23`, a surprise followed by 23 ordinary hours (three days of opening hours). The last line drops to about $10^{-7}$. With `w_h = 0.9` it's about 0.02: better, but still faint.

      This is the **vanishing gradient** problem from the lesson on stable training, stretched across time steps instead of layers. Sepp Hochreiter analyzed it for RNNs in 1991, and Bengio, Simard, and Frasconi described it in 1994. A long product of factors below 1 shrinks toward zero, so events many steps back barely affect learning. Factors above 1 do the opposite: 24 factors of 1.5 multiply to about 16,800, an **exploding gradient**. The standard fix for explosions is the **gradient clipping** you met in module 10: if the gradient's length exceeds a threshold, scale it down. Pascanu, Mikolov, and Bengio (2013) analyzed exploding gradients in RNNs and made this norm clipping standard practice. Vanishing needed a new architecture, the subject of the next lesson.

      For long series, training usually uses **truncated BPTT**: run the state forward through the whole series, but send gradients back only, say, 24 steps. It's cheaper, and the model can't learn dependencies longer than the window.
    bridges: []
  - id: recurrent-networks.s4
    title: Reading changes the state, not the weights
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.recurrent-networks
    markdown: |-
      Once Ana's RNN is trained, its weights are frozen. Every hour, the new sales figure updates $h_t$, and the forecast changes, but $W_h$, $W_x$, and $b$ stay exactly as they were.

      :::mixup "The RNN learns about today as it reads today's sales."
      It *adapts*, but it doesn't *learn* in the training sense. The hidden state is scratch memory that's rebuilt from $h_0$ every sequence; the weights change only when you run training with a loss and gradients. That's why the 7 a.m. surprise can raise the 10 a.m. forecast today and leave no trace tomorrow.
      :::

      The state does raise one practical question: when should it reset? Suppose Ana's company runs two cafés, and one model reads both, hour by hour, without resetting between them. The Harbor café's lunch rush would bleed into the first forecasts for Pebble. The fix is a design decision: start each café's day from $h_0 = 0$, or keep one state per café and never mix them.

      RNNs are real forecasting tools, not only history. Amazon's DeepAR (Salinas et al., 2017) trains one recurrent network across many related series, such as the sales of many products, and forecasts each one from its own recent history. Whatever the model, the backtest from the last lesson is still the judge: it has to beat the weekly seasonal naive forecast, 3.29 cups, on the same days.
    bridges: []
  - id: recurrent-networks.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.recurrent-networks
    markdown: A parking-garage sensor, a keyboard that predicts the next word, and a few gradient chains test whether you can trace a hidden state forward and a gradient backward.
    takeaway: |-
      An RNN applies one update rule at every step, folding each new input into a hidden state. Training sends gradients back through that chain, and a long product of small factors makes early steps fade.
  - id: recurrent-networks.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.recurrent-networks
    markdown: |-
      An RNN passes a temporary state through a sequence while reusing the same parameters. Updating the state during use is different from changing the parameters during training.
