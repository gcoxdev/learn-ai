assessment_families:
- id: recurrent-networks.base
  objective_ref: objective.recurrent-networks
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace a simple recurrence: trace the inputs, operation, and result before choosing.'
  remediation_scene: recurrent-networks.s2
  variants:
  - id: recurrent-networks.base.1
    prompt: For h_next = 0.5h + x, h = 2 and x = 3, what is next state?
    options:
    - id: c
      text: '2.5'
    - id: a
      text: '4'
    - id: b
      text: '5'
    answer: a
    feedback: Half of 2 plus 3 equals 4.
  - id: recurrent-networks.base.2
    prompt: What is shared across time in a standard RNN?
    options:
    - id: a
      text: The recurrent transformation parameters
    - id: b
      text: Every input value
    - id: c
      text: Every target label
    answer: a
    feedback: The same parameterized operation is reused at successive steps.
- id: recurrent-networks.transfer
  objective_ref: objective.recurrent-networks
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Separate sequence state from training state: trace the inputs, operation, and result before choosing.'
  remediation_scene: recurrent-networks.s4
  variants:
  - id: recurrent-networks.transfer.1
    prompt: Does updating hidden state at inference necessarily train model weights?
    options:
    - id: a
      text: 'No'
    - id: b
      text: Yes; every state change is optimization
    - id: c
      text: Only for long sequences
    answer: a
    feedback: Request state and persistent learned parameters are different objects.
  - id: recurrent-networks.transfer.2
    prompt: What can truncated backpropagation through time limit?
    options:
    - id: b
      text: The number of possible text characters only
    - id: c
      text: The existence of forward state updates
    - id: a
      text: The temporal distance over which gradients assign credit
    answer: a
    feedback: Truncation cuts the differentiated history while recurrence may still continue.
