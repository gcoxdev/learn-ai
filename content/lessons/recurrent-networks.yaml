schema_version: 0.2-draft
lesson:
  id: recurrent-networks
  version: 0.1.0-draft
  title: Carry a state from one step to the next
  state: draft
  summary: Recurrent networks update a hidden state using new input and prior state; shared parameters process sequences,
    while backpropagation through time handles their repeated use.
  slot: M13.2
  category: learning
  minutes: 12
  sources:
  - title: Dive into Deep Learning — recurrent neural networks
    url: https://d2l.ai/chapter_recurrent-neural-networks/rnn.html
objectives:
- id: objective.recurrent-networks
  version: 1-draft
  statement: Recurrent networks update a hidden state using new input and prior state; shared parameters process
    sequences, while backpropagation through time handles their repeated use.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - recurrent-networks.base
  - recurrent-networks.transfer
  prerequisites:
  - anyOf:
    - objective.neural-forward-pass
  - anyOf:
    - objective.automatic-differentiation
scenes:
- id: recurrent-networks.s1
  title: A hidden state summarizes the past
  type: explanation
  depth: intuition
  objective_refs:
  - objective.recurrent-networks
  markdown: An RNN computes a new hidden state from the current input and previous hidden state using shared parameters.
    The state is a numerical representation, not a verbatim archive of every earlier input. An output head can predict
    at each step or from a final state.
  text_mode: An RNN computes a new hidden state from the current input and previous hidden state using shared parameters.
    The state is a numerical representation, not a verbatim archive of every earlier input. An output head can predict
    at each step or from a final state.
  bridges: []
- id: recurrent-networks.s2
  title: Trace a simple recurrence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.recurrent-networks
  markdown: For an illustrative scalar update h_next = 0.5h + x, begin h = 0 and inputs [2, 4]. The first state
    is 2; the second is 0.5 × 2 + 4 = 5. Changing the first input affects later states through the recurrence. Real
    RNNs commonly add learned matrices and nonlinearities.
  text_mode: For an illustrative scalar update h_next = 0.5h + x, begin h = 0 and inputs [2, 4]. The first state
    is 2; the second is 0.5 × 2 + 4 = 5. Changing the first input affects later states through the recurrence. Real
    RNNs commonly add learned matrices and nonlinearities.
  bridges:
  - chain-rule
- id: recurrent-networks.s3
  title: Unroll to compute gradients
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.recurrent-networks
  markdown: Backpropagation through time views repeated steps as a larger computation graph with shared weights.
    Derivative contributions from different times accumulate into those weights. Long products can shrink or amplify
    gradients. Truncating the graph saves resources but limits how far training credit is assigned through time.
  text_mode: Backpropagation through time views repeated steps as a larger computation graph with shared weights.
    Derivative contributions from different times accumulate into those weights. Long products can shrink or amplify
    gradients. Truncating the graph saves resources but limits how far training credit is assigned through time.
  bridges: []
- id: recurrent-networks.s4
  title: Separate sequence state from training state
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.recurrent-networks
  markdown: At inference, a state can be updated as new inputs arrive while model parameters stay fixed. Decide
    when to reset state between unrelated sequences. Accidentally carrying one user’s or series’ state into another
    changes the task and can leak information. Evaluate sequence lengths and temporal conditions relevant to deployment.
  text_mode: At inference, a state can be updated as new inputs arrive while model parameters stay fixed. Decide
    when to reset state between unrelated sequences. Accidentally carrying one user’s or series’ state into another
    changes the task and can leak information. Evaluate sequence lengths and temporal conditions relevant to deployment.
  bridges: []
- id: recurrent-networks.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.recurrent-networks
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Recurrent networks update a hidden state using new input and prior state; shared parameters process
    sequences, while backpropagation through time handles their repeated use.
- id: recurrent-networks.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.recurrent-networks
  markdown: Recurrent networks update a hidden state using new input and prior state; shared parameters process
    sequences, while backpropagation through time handles their repeated use.
  text_mode: Recurrent networks update a hidden state using new input and prior state; shared parameters process
    sequences, while backpropagation through time handles their repeated use.
navigation:
