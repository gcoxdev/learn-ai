schema_version: 0.2-draft
lesson:
  id: recurrent-networks
  version: 0.3.0-draft
  title: Carry a state from one step to the next
  state: draft
  summary: Reuse a small update rule across a sequence while distinguishing temporary memory from learned weights.
  slot: M13.2
  category: learning
  sources:
  - title: Dive into Deep Learning — recurrent neural networks
    url: https://d2l.ai/chapter_recurrent-neural-networks/rnn.html
objectives:
- id: objective.recurrent-networks
  version: 1-draft
  statement: Recurrent networks update a hidden state using new input and prior state; shared parameters process
    sequences, while backpropagation through time handles their repeated use.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - recurrent-networks.base
  - recurrent-networks.transfer
  prerequisites:
  - anyOf:
    - objective.neural-forward-pass
  - anyOf:
    - objective.automatic-differentiation
scenes:
- id: recurrent-networks.s1
  title: Carry useful information to the next step
  type: explanation
  depth: intuition
  objective_refs:
  - objective.recurrent-networks
  markdown: 'A **recurrent neural network (RNN)** reuses an update rule across a sequence. At each position
    it combines the current input with the previous **hidden state**, a temporary list of values carrying information
    from earlier positions. The parameters of that rule are shared.


    The state summarizes what the model retains; it is not necessarily a copy of the earlier inputs. An **output
    head** converts it into a task answer, either at every step or after the sequence ends.'
  text_mode: 'A **recurrent neural network (RNN)** reuses an update rule across a sequence. At each position
    it combines the current input with the previous **hidden state**, a temporary list of values carrying information
    from earlier positions. The parameters of that rule are shared.


    The state summarizes what the model retains; it is not necessarily a copy of the earlier inputs. An **output
    head** converts it into a task answer, either at every step or after the sequence ends.'
  bridges: []
- id: recurrent-networks.s2
  title: Trace a simple recurrence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.recurrent-networks
  markdown: 'For an illustrative scalar update h_next = 0.5h + x, begin h = 0 and inputs [2, 4]. The first
    state is 2; the second is 0.5 × 2 + 4 = 5. Changing the first input affects later states through the recurrence.
    Real RNNs commonly add learned matrices and nonlinearities.


    If the next input is 0, the third state is 0.5 × 5 + 0 = 2.5. The state changed even though the stored
    multiplier stayed 0.5. This is a new calculation with memory, not a training step. Earlier input information
    fades in this toy because it is repeatedly multiplied by one-half.'
  text_mode: 'For an illustrative scalar update h_next = 0.5h + x, begin h = 0 and inputs [2, 4]. The first
    state is 2; the second is 0.5 × 2 + 4 = 5. Changing the first input affects later states through the recurrence.
    Real RNNs commonly add learned matrices and nonlinearities.


    If the next input is 0, the third state is 0.5 × 5 + 0 = 2.5. The state changed even though the stored
    multiplier stayed 0.5. This is a new calculation with memory, not a training step. Earlier input information
    fades in this toy because it is repeatedly multiplied by one-half.'
  bridges:
  - chain-rule
- id: recurrent-networks.s3
  title: Draw repeated steps to calculate gradients
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.recurrent-networks
  markdown: '**Unrolling** draws a copy of the computation for each time step. The copies use the same stored
    weights. **Backpropagation through time** follows this expanded graph and adds the contributions from each
    use of a shared weight.


    Long chains of derivatives can shrink or grow. **Truncated backpropagation** stops the backward calculation
    after a chosen number of steps to save resources, even if the forward state continues. Keeping a long-running
    state therefore does not mean training assigns credit through its entire history.'
  text_mode: '**Unrolling** draws a copy of the computation for each time step. The copies use the same stored
    weights. **Backpropagation through time** follows this expanded graph and adds the contributions from each
    use of a shared weight.


    Long chains of derivatives can shrink or grow. **Truncated backpropagation** stops the backward calculation
    after a chosen number of steps to save resources, even if the forward state continues. Keeping a long-running
    state therefore does not mean training assigns credit through its entire history.'
  bridges: []
- id: recurrent-networks.s4
  title: Separate sequence state from training state
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.recurrent-networks
  markdown: At inference, a state can be updated as new inputs arrive while model parameters stay fixed. Decide
    when to reset state between unrelated sequences. Accidentally carrying one user’s or series’ state into
    another changes the task and can leak information. Evaluate sequence lengths and temporal conditions relevant
    to deployment.
  text_mode: At inference, a state can be updated as new inputs arrive while model parameters stay fixed. Decide
    when to reset state between unrelated sequences. Accidentally carrying one user’s or series’ state into
    another changes the task and can leak information. Evaluate sequence lengths and temporal conditions relevant
    to deployment.
  bridges: []
- id: recurrent-networks.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.recurrent-networks
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: An RNN passes a temporary state through a sequence while reusing the same parameters. Updating
    the state during use is different from changing the parameters during training.
