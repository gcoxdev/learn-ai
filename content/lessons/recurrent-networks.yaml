lesson:
  id: recurrent-networks
  version: 0.4.0-draft
  title: Carry a state from one step to the next
  state: draft
  summary: A network that reads the café's day one hour at a time and keeps a running hunch about it. Then watch why its memory of 7 a.m. fades by noon.
  slot: M13.2
  category: learning
  sources:
    - title: Dive into Deep Learning — recurrent neural networks
      url: https://d2l.ai/chapter_recurrent-neural-networks/rnn.html
    - title: Dive into Deep Learning — backpropagation through time
      url: https://d2l.ai/chapter_recurrent-neural-networks/bptt.html
    - title: "Finding Structure in Time (Elman, 1990)"
      url: https://doi.org/10.1207/s15516709cog1402_1
    - title: "Learning Long-Term Dependencies with Gradient Descent is Difficult (Bengio, Simard & Frasconi, 1994)"
