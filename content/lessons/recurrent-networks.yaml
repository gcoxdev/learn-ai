assessment_families:
  - id: recurrent-networks.base
    objective_ref: objective.recurrent-networks
    task: base
    response_type: single_choice
    points: 1
    hint: 'Trace a simple recurrence: trace the inputs, operation, and result before choosing.'
    remediation_scene: recurrent-networks.s2
    variants:
      - id: recurrent-networks.base.1
        prompt: For h_next = 0.5h + x, h = 2 and x = 3, what is next state?
        options:
          - id: c
            text: '2.5'
          - id: a
            text: '4'
          - id: b
            text: '5'
        answer: a
        feedback: Half of 2 plus 3 equals 4.
        retired: true
      - id: recurrent-networks.base.2
        prompt: What is shared across time in a standard RNN?
        options:
          - id: a
            text: The recurrent transformation parameters
          - id: b
            text: Every input value
          - id: c
            text: Every target label
        answer: a
        feedback: The same parameterized operation is reused at successive steps.
        retired: true
  - id: recurrent-networks.transfer
    objective_ref: objective.recurrent-networks
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Separate sequence state from training state: trace the inputs, operation, and result before choosing.'
    remediation_scene: recurrent-networks.s4
    variants:
      - id: recurrent-networks.transfer.1
        prompt: Does updating hidden state at inference necessarily train model weights?
        options:
          - id: a
            text: 'No'
          - id: b
            text: Yes; every state change is optimization
          - id: c
            text: Only for long sequences
        answer: a
        feedback: Request state and persistent learned parameters are different objects.
        retired: true
      - id: recurrent-networks.transfer.2
        prompt: What can truncated backpropagation through time limit?
        options:
          - id: b
            text: The number of possible text characters only
          - id: c
            text: The existence of forward state updates
          - id: a
            text: The temporal distance over which gradients assign credit
        answer: a
        feedback: Truncation cuts the differentiated history while recurrence may still continue.
        retired: true
  - id: recurrent-networks.base.v2
    objective_ref: objective.recurrent-networks
    task: base
    response_type: single_choice
    points: 1
    hint: "Separate what is fixed from what flows: the weights W_h, W_x, and b are reused at every step, while h_t is recomputed from h_(t−1) and the new input."
    remediation_scene: recurrent-networks.s2
    variants:
      - id: recurrent-networks.base.v2.1
        prompt: An RNN reads a parking garage's occupancy every hour and forecasts the next hour. Which of these is the same at 6 a.m. and at 6 p.m.?
        options:
          - id: b
            text: The hidden state the model carries forward
          - id: c
            text: The forecast produced by the output head
          - id: a
            text: The weights used to update the hidden state
        answer: a
        feedback: One set of weights is reused at every step; that sharing is what makes the network recurrent. The hidden state and the forecast change every hour as new occupancy readings arrive.
      - id: recurrent-networks.base.v2.2
        prompt: 'An RNN has W_h = 0.5, W_x = 1.0, and b = 0. The previous state is 0.8 and the new input is 0.2. What goes inside the tanh?'
        options:
          - id: a
            text: '0.6, from 0.5 × 0.8 + 1.0 × 0.2'
          - id: b
            text: '1.0, from 0.8 + 0.2'
          - id: c
            text: '0.5, from 0.5 × (0.8 + 0.2)'
        answer: a
        feedback: Each term gets its own weight, so 0.5 × 0.8 + 1.0 × 0.2 + 0 = 0.6. Adding the raw values skips both weights, and multiplying the sum by 0.5 applies W_h to the input as well.
      - id: recurrent-networks.base.v2.3
        prompt: In the café example, a +1.0 surprise at 7 a.m. gives h = 0.762, but with an ordinary 9 a.m. the state has fallen to 0.339. Why does it fade?
        options:
          - id: c
            text: The weights are nudged after every hour, weakening the memory
          - id: a
            text: W_h = 0.5 shrinks the carried state before each new input is added
          - id: b
            text: The tanh resets the hidden state to zero whenever the input is 0
        answer: a
        feedback: Each step multiplies the old state by W_h = 0.5 before adding the new input, so an old surprise shrinks unless new inputs refresh it. The weights stay fixed while reading, and tanh squashes values rather than resetting them.
      - id: recurrent-networks.base.v2.4
        prompt: During backpropagation through time, why is the gradient for W_h a sum of contributions from many steps?
        options:
          - id: b
            text: Each step keeps its own copy of W_h, and the copies are added together after training
          - id: a
            text: The same W_h is used at every step, so each use adds its share of the gradient
          - id: c
            text: The loss is added up over steps, even though W_h only affects the final step
        answer: a
        feedback: Unrolling draws W_h once per step, but it is one shared weight, so its total gradient adds up every place it was used. There are no separate per-step copies, and W_h affects every state, not just the last.
  - id: recurrent-networks.transfer.v2
    objective_ref: objective.recurrent-networks
    task: transfer
    response_type: single_choice
    points: 1
    hint: Decide which part is involved (the hidden state, the weights, or the gradient chain), then pick the fix that acts on that part.
    remediation_scene: recurrent-networks.s4
    variants:
      - id: recurrent-networks.transfer.v2.1
        prompt: A phone keyboard uses a trained RNN to suggest the next word. Halfway through a message about hiking, it starts suggesting "trail" and "summit", and by the next message it's back to normal. What changed during that message?
        options:
          - id: a
            text: The hidden state, which carried the message's topic forward
          - id: b
            text: The weights, which were fine-tuned on the message and then reset
          - id: c
            text: The vocabulary, which gained hiking words for that message
        answer: a
        feedback: Reading the message updates the hidden state, which shifts the suggestions; a new message starts from a fresh state. The weights only change during training, which doesn't happen while you type.
      - id: recurrent-networks.transfer.v2.2
        prompt: A traffic model reads sensor streams from 50 intersections back to back, carrying one hidden state through all of them. Its first few forecasts at each new intersection are poor. What is the best fix?
        options:
          - id: c
            text: Make the hidden state larger so it can hold every intersection
          - id: b
            text: Clip the gradients so the early forecasts can't dominate
          - id: a
            text: Reset the state, or keep one per intersection, when streams change
        answer: a
        feedback: The state from the previous intersection leaks into the next one's first forecasts. Resetting or separating states removes the mix-up. A larger state still starts each stream with the wrong context, and clipping only affects training.
      - id: recurrent-networks.transfer.v2.3
        prompt: A model trained with truncated backpropagation through time (20 steps) never learns a pattern where an event predicts something 50 steps later. What's the most likely reason?
        options:
          - id: b
            text: The forward hidden state is also cut off after 20 steps
          - id: a
            text: Gradients never reach 50 steps back, so no training signal links the two events
          - id: c
            text: The learning rate is too low for patterns that are more than 20 steps long
        answer: a
        feedback: Truncation stops the backward pass after 20 steps, so the weights never get credit for the long dependency. The forward state still runs through the whole sequence; a higher learning rate can't create a gradient that was never computed.
      - id: recurrent-networks.transfer.v2.4
        prompt: While training an RNN on sensor data, the loss suddenly jumps to "NaN" and the logged gradient length was over a million just before. What is the standard fix?
        options:
          - id: c
            text: Reset the hidden state more often between training batches
          - id: b
            text: Replace tanh in the recurrence with a function that has no limit
          - id: a
            text: Rescale any gradient whose length is above a set threshold
        answer: a
        feedback: A huge gradient is an exploding gradient, from a long product of factors above 1, and gradient clipping scales it back. Resetting the state doesn't bound the gradient, and removing tanh's squashing makes growth more likely.
  - id: recurrent-networks.calc.v2
    objective_ref: objective.recurrent-networks
    task: base
    response_type: numeric
    points: 1
    hint: Each step back multiplies the gradient by one factor, W_h × (1 − h_t²) for a tanh RNN. Multiply all the factors along the path.
    remediation_scene: recurrent-networks.s3
    absolute_tolerance: 0.005
    variants:
      - id: recurrent-networks.calc.v2.1
        prompt: The gradient travels back three steps, and the step factors are 0.5, 0.4, and 0.5. By what number is it multiplied in total?
        answer: 0.1
        feedback: 0.5 × 0.4 × 0.5 = 0.1, so the signal arriving three steps back is a tenth of its starting size.
      - id: recurrent-networks.calc.v2.2
        prompt: 'A scalar tanh RNN has W_h = 0.5. The states are h_2 = 0.6 and h_3 = 0. Compute ∂h_3/∂h_1, the product of the factors W_h × (1 − h_t²) for t = 3 and t = 2.'
        answer: 0.16
        feedback: For t = 3, 0.5 × (1 − 0) = 0.5. For t = 2, 0.5 × (1 − 0.36) = 0.32. The product is 0.5 × 0.32 = 0.16.
      - id: recurrent-networks.calc.v2.3
        prompt: Every step back multiplies the gradient by 0.8. How much of it is left five steps back? Give three decimal places.
        answer: 0.328
        feedback: 0.8⁵ = 0.32768 ≈ 0.328. Multiplying 0.8 by 5 instead of raising it to the fifth power is the common slip.
      - id: recurrent-networks.calc.v2.4
        prompt: In a stretch where the states stay near 0, each step factor is about W_h = 1.2. By what number is the gradient multiplied over four steps? Give two decimal places.
        answer: 2.07
        feedback: 1.2⁴ = 2.0736 ≈ 2.07. Factors above 1 make the gradient grow with distance, the start of an exploding gradient.
