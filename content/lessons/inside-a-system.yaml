schema_version: 0.2-draft
lesson:
  id: inside-a-system
  version: 0.4.0-draft
  title: Follow one small AI system from start to finish
  state: draft
  summary: '"Arriving in 18 minutes." Build your own delivery-time estimator from scratch: collect trips, train it, test it on trips it has never seen, then put it to work.'
  slot: M00.7
  category: common
  sources:
    - title: Dive into Deep Learning — linear regression
      url: https://d2l.ai/chapter_linear-regression/linear-regression.html
  archetype: foundation
objectives:
  - id: objective.inside-a-system
    version: 3-draft
    statement: Follow data, representation, model, objective, training, evaluation, and inference as distinct parts of a system’s lifecycle.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - inside-a-system.base
      - inside-a-system.transfer.v3
    prerequisites:
      - anyOf:
          - objective.training-and-inference
scenes:
  - id: inside-a-system.s1
    title: Start by naming the job
    type: explanation
    depth: intuition
    objective_refs:
      - objective.inside-a-system
    markdown: |-
      Order food on your phone and the delivery app promises: "Arriving in 18 minutes." Somewhere behind that number is a model that turns information about the trip into a time.

      Let's build a tiny version, using every idea from this module so far. A bike courier wants an estimate before each delivery.

      - *Task:* estimate how long a delivery will take.
      - *Input:* the distance, in miles.
      - *Output:* a predicted number of minutes.

      Our model will use distance alone. It ignores hills, traffic lights, and waiting at the door. Naming what it leaves out now tells us what to watch for when we test it.
  - id: inside-a-system.s2
    title: Collect trips and write them down clearly
    type: explanation
    depth: intuition
    objective_refs:
      - objective.inside-a-system
    markdown: |-
      The courier records some past trips:

      | Trip | Distance (miles) | Actual time (min) |
      | --- | ---: | ---: |
      | A | 2 | 8 |
      | B | 3 | 12 |

      To **represent** something means to put it in a form a program can work with. "A couple of miles, across the park" becomes the number 2, with the unit written in the column heading so nobody mistakes it for feet.

      A **feature** is one piece of input information chosen for the model. Distance is our only feature. The actual time is the target, the answer we want to predict. Keeping features and target in separate columns keeps the answer from leaking into the input, just like the file names in the data lesson.
  - id: inside-a-system.s3
    title: Choose a model and train it
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.inside-a-system
    markdown: |-
      We'll use the same kind of rule as the snack model:

      $$\text{minutes} = \text{weight} \times \text{miles}$$

      Training means finding the weight whose predictions miss the recorded trips by the least. Weight 4 predicts 4 × 2 = 8 and 4 × 3 = 12 minutes, matching trips A and B exactly, so its loss is 0.

      :::predict What is the total miss (loss) for weight 5 on trips A and B?
      Weight 5 predicts 10 and 15 minutes. The misses are 10 − 8 = 2 and 15 − 12 = 3, so the loss is 5. Weight 4 wins.
      :::

      The training trips tell us what happened. The model turns distance into a prediction. Training picks the weight that makes the two agree.
  - id: inside-a-system.s4
    title: Test on trips the model has never seen
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.inside-a-system
    markdown: |-
      **Evaluation** means measuring how well a system does its job. The honest way is to use a **test set**: a group of examples you put aside at the start and only use at the end, to check the finished model. The courier kept three trips out of training:

      | Test trip | Distance | Actual | Predicted (4 × miles) | Miss |
      | --- | ---: | ---: | ---: | ---: |
      | C | 4 miles | 16 min | 16 min | 0 |
      | D (steep hill) | 2 miles | 11 min | 8 min | 3 short |
      | E | 5 miles | 21 min | 20 min | 1 short |

      The average miss is (0 + 3 + 1) ÷ 3 ≈ 1.3 minutes. The test also found something training never showed: the hill trip is 3 minutes off.

      :::mixup "It matched the training trips perfectly, so it's ready."
      Matching the trips you trained on is like acing a quiz after studying the answer key. Only trips the model has never seen show how it will do on tomorrow's deliveries.
      :::
  - id: inside-a-system.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.inside-a-system
    markdown: Reading quizzes, running routes, weather forecasts, and plant apps ask you to name each stage of a system and spot when a test stops being fair.
    takeaway: |-
      Collect examples, train a model on some of them, test it on examples it has never seen, then use it on new inputs. Each stage answers a different question, and a test can send you back to collect better examples.
  - id: inside-a-system.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.inside-a-system
    markdown: |-
      Follow data, representation, model, objective, training, evaluation, and inference as distinct parts of a system’s lifecycle.
  - id: inside-a-system.s5
    title: Put it to work, and check every step
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.inside-a-system
    markdown: |-
      A new order comes in: 5 miles. Weight 4 predicts 20 minutes. That's inference, the model being used.

      The model is only one step, though. The delivery app must read the distance, run the model, and show the result with the right unit.

      :::predict A customer's address is 15,840 feet away, but the number 15,840 is sent to the model as if it were miles. What goes wrong?
      The model predicts 4 × 15,840 = 63,360 minutes. But 15,840 feet is 3 miles, so the ride really needs 12 minutes. The model did its math correctly; the mistake happened before it ran, when the input was given the wrong unit.
      :::

      And if the courier's route has a steep hill, the problem is different: the model itself is too simple. Knowing which step failed tells you what to fix.
  - id: inside-a-system.s6
    title: The stages form a loop
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.inside-a-system
    markdown: |-
      The stages you've followed are the system's **lifecycle**: the stages it goes through as it's built and used. They rarely run just once. The hill trip in the test sends the courier back to collect more hill trips, and maybe to add a second feature, like how much climbing a route has. Once the model is in use, every finished delivery becomes a new record to learn from.

      Here's the whole thing for the delivery estimator. For each box, ask: what does this stage receive, and what decision does it help you make?
    diagram:
      caption: The lifecycle of the delivery estimator. Testing and daily use both feed back into collecting examples.
      description: The task leads to collecting trips, which leads to training, which leads to testing on held-aside trips. Testing leads to using the model for new orders. Testing also sends you back to collect more trips when it finds a weakness, such as hills. Using the model produces new trip records that go back to collecting.
      nodes:
        - id: task
          label: Name the task
          note: minutes from distance
          col: 0
          row: 0
        - id: collect
          label: Collect trips
          note: distance + actual time
          col: 1
          row: 0
          tone: data
        - id: train
          label: Train
          note: pick the weight
          col: 2
          row: 0
          tone: accent
        - id: test
          label: Test
          note: trips kept aside
          col: 3
          row: 0
          tone: warn
        - id: use
          label: Use for new orders
          note: inference
          col: 3
          row: 1
      edges:
        - from: task
          to: collect
        - from: collect
          to: train
        - from: train
          to: test
        - from: test
          to: use
          label: good enough
        - from: test
          to: collect
          label: add hill trips
          dashed: true
          bend: 2
        - from: use
          to: collect
          label: new trip records
          dashed: true
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - inside-a-system.s1
        - inside-a-system.s2
        - inside-a-system.s3
        - inside-a-system.s4
        - inside-a-system.s5
        - inside-a-system.s6
        - inside-a-system.check
      gate_refs:
        - gate.core
  scene_aliases:
    inside-a-system.recap: inside-a-system.check
assessment_families:
  - id: inside-a-system.base
    objective_ref: objective.inside-a-system
    task: base
    response_type: single_choice
    points: 1
    hint: "Place each item in the delivery estimator's pipeline: a feature goes in, the target is the recorded answer, the weight is set by training, and trips kept aside are for testing."
    variants:
      - id: inside-a-system.base.1
        prompt: What usually changes during a gradient-based training update?
        options:
          - id: correct
            text: Selected model parameters.
          - id: a
            text: The definition of the observed past examples.
          - id: b
            text: Every deployment request at once.
        answer: correct
        feedback: Selected model parameters.
        retired: true
      - id: inside-a-system.base.2
        prompt: What is inference?
        options:
          - id: a
            text: Always adjusting model weights.
          - id: b
            text: Only collecting a training dataset.
          - id: correct
            text: Using a model to compute outputs for inputs.
        answer: correct
        feedback: Using a model to compute outputs for inputs.
        retired: true
      - id: inside-a-system.base.v2.1
        prompt: Which value is the target for a recorded delivery example?
        options:
          - id: b
            text: The distance entered for the trip
          - id: c
            text: The chosen minutes-per-mile weight
          - id: a
            text: The observed trip duration
        answer: a
        feedback: "The target is the answer you want to predict: the trip's actual, recorded time. The distance is the input feature, and the weight is a setting chosen by training."
      - id: inside-a-system.base.v2.2
        prompt: A trip’s distance is chosen as an input to the predictor. What is it called?
        options:
          - id: c
            text: An optimizer
          - id: a
            text: A feature
          - id: b
            text: A loss
        answer: a
        feedback: "A feature is one piece of input information chosen for the model, like distance. A loss measures the misses, and an optimizer uses it to pick the weights."
      - id: inside-a-system.base.v2.3
        prompt: Weight 4 is used for a 5-mile trip. What is the prediction?
        options:
          - id: a
            text: 20 minutes
          - id: b
            text: 9 minutes
          - id: c
            text: 4 minutes
        answer: a
        feedback: "Multiply the weight by the distance: 4 × 5 = 20 minutes. Adding them gives 9, which is the most common slip."
      - id: inside-a-system.base.v2.4
        prompt: Why keep some trips aside while choosing the weight?
        options:
          - id: b
            text: To choose the best weight using the testing trips
          - id: c
            text: To use the same trips for fitting and final checking
          - id: a
            text: To check behavior on examples not used for fitting
        answer: a
        feedback: "Trips kept aside show how the model does on examples it never saw while fitting. Using those trips to choose the weight would quietly turn them into training trips."
      - id: inside-a-system.base.v2.5
        prompt: A delivery model multiplies distance by 3 minutes per mile. What does it predict for 4 miles?
        options:
          - id: a
            text: 7 minutes
          - id: b
            text: 3 minutes
          - id: c
            text: 12 minutes
        answer: c
        feedback: The distance is the input and 3 is the weight. Four groups of three minutes give 12.
      - id: inside-a-system.base.v2.6
        prompt: You choose a weight using one set of trips. Why check it on trips kept outside that fitting process?
        options:
          - id: a
            text: To see how it behaves beyond the fitting examples
          - id: b
            text: To guarantee that every future trip is predicted exactly
          - id: c
            text: To convert the checking trips into new input units
        answer: a
        feedback: Held-aside examples help test whether the learned rule extends beyond the examples used to choose it.
    remediation_scene: inside-a-system.s3
  - id: inside-a-system.transfer
    objective_ref: objective.inside-a-system
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
    variants:
      - id: inside-a-system.transfer.1
        prompt: A chat model generates fifty tokens using fixed weights. Which stage is this?
        options:
          - id: a
            text: Fifty rounds of full model retraining.
          - id: b
            text: A guarantee that evaluation has passed.
          - id: correct
            text: Inference, repeated over the growing context.
        answer: correct
        feedback: Inference, repeated over the growing context.
        retired: true
      - id: inside-a-system.transfer.2
        prompt: Training error is low. What should happen before claiming good performance on new data?
        options:
          - id: b
            text: Reuse the training examples as the only test.
          - id: correct
            text: Evaluate on appropriate held-out examples and tasks.
          - id: a
            text: Assume the low error proves general reliability.
        answer: correct
        feedback: Evaluate on appropriate held-out examples and tasks.
        retired: true
      - id: inside-a-system.transfer.v2.1
        prompt: A 2-mile hill trip took 11 minutes, but the rule predicted 8. What did evaluation reveal?
        options:
          - id: c
            text: An exact fit to that trip
          - id: a
            text: A three-minute underestimate on that trip
          - id: b
            text: A three-minute overestimate on that trip
        answer: a
        feedback: Eleven exceeds eight by three, so the predicted time is too short.
        retired: true
      - id: inside-a-system.transfer.v2.2
        prompt: Feet are entered but interpreted as miles. Which boundary failed?
        options:
          - id: a
            text: The meaning assigned to the input number
          - id: b
            text: The weight changed while the number kept its meaning
          - id: c
            text: The observed travel time was used as an input
        answer: a
        feedback: The number has been interpreted with the wrong unit.
        retired: true
      - id: inside-a-system.transfer.v2.3
        prompt: Testing reveals errors on hills. Which next step responds to that finding?
        options:
          - id: b
            text: Report the average across all trips without inspecting hills
          - id: c
            text: Choose a new weight using the same final test repeatedly
          - id: a
            text: Collect hill examples and reconsider the rule
        answer: a
        feedback: New relevant information can guide a better representation or model.
        retired: true
      - id: inside-a-system.transfer.v2.4
        prompt: What does lifecycle mean here?
        options:
          - id: c
            text: Changes in one trip’s distance over time
          - id: a
            text: Stages of developing and using the system
          - id: b
            text: Steps within one calculation of a prediction
        answer: a
        feedback: It describes the development and use process rather than a hardware duration.
        retired: true
      - id: inside-a-system.transfer.v2.5
        prompt: A delivery rule predicts 15 minutes for a trip that takes 18. What does this observation show?
        options:
          - id: a
            text: A three-minute underestimate on that trip
          - id: b
            text: A three-minute overestimate on that trip
          - id: c
            text: A correct prediction because both times refer to one trip
        answer: a
        feedback: 'Compare the proposed and observed times: 18 − 15 = 3. One error describes this case; other cases still need checking.'
        retired: true
      - id: inside-a-system.transfer.v2.6
        prompt: A distance input changes from miles to feet, but the app still treats the number as miles. What should be fixed?
        options:
          - id: a
            text: The display color while keeping the same interpretation
          - id: b
            text: The unit conversion or the meaning assigned to the input
          - id: c
            text: The test report’s title while keeping the same interpretation
        answer: b
        feedback: A number needs the right meaning. An input-unit mismatch can break the system even when the multiplication is correct.
        retired: true
    remediation_scene: inside-a-system.s3
  - id: inside-a-system.transfer.v3
    objective_ref: objective.inside-a-system
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name the stage first (collecting and representing examples, training, testing on held-aside examples, or using the model), then ask whether that stage is doing its own job.
    remediation_scene: inside-a-system.s4
    variants:
      - id: inside-a-system.transfer.v3.1
        prompt: A school fits a model that predicts reading level from a short quiz. Checked on the same students it was fitted to, it scores perfectly. What should the school do next?
        options:
          - id: a
            text: Report the perfect score, since the fit is exactly right
          - id: c
            text: Fit it again to those same students, just to double-check
          - id: b
            text: Check it on students who were kept aside at the start
        answer: b
        feedback: A perfect score on the fitting examples is like acing a quiz after studying the answer key. Only students the model never saw show how it will do on new ones; refitting to the same students tells you nothing new.
      - id: inside-a-system.transfer.v3.2
        prompt: In a plant app's records, pot size is written in inches for some plants and feet for others, with no unit noted. Which stage needs fixing first?
        options:
          - id: c
            text: How the examples are represented
          - id: b
            text: The weight picked during training
          - id: a
            text: The way the final test is scored
        answer: c
        feedback: The same number means different sizes in different rows, so the representation is broken. Any weight trained on these rows would be learning from a mix-up.
      - id: inside-a-system.transfer.v3.3
        prompt: A running-time predictor was tested only on flat routes. Runners say it is badly off on hilly routes. What is the best next step?
        options:
          - id: c
            text: Raise the weight so that every prediction gets longer
          - id: a
            text: Collect hilly routes and rethink the model's inputs
          - id: b
            text: Test it again on the same flat routes to confirm them
        answer: a
        feedback: The test revealed a missing kind of example, so the lifecycle loops back to collecting data and maybe adding a feature such as climb. Raising the weight would make flat routes wrong too.
      - id: inside-a-system.transfer.v3.4
        prompt: A model is checked on three test trips. It misses by 0, 3, and 1 minutes. What is its average miss on the test set?
        options:
          - id: a
            text: 3 minutes, the largest miss
          - id: c
            text: About 1.3 minutes
          - id: b
            text: 4 minutes, the total miss
        answer: c
        feedback: The average is the total divided by the number of trips, (0 + 3 + 1) ÷ 3 ≈ 1.3. The total is 4 and the largest miss is 3, but neither is the average.
      - id: inside-a-system.transfer.v3.5
        prompt: A weather model has been trained and tested, and it is now in use. Which of these is inference?
        options:
          - id: b
            text: Adjusting its weights to fit last year's weather records
          - id: c
            text: Scoring its forecasts on days that were set aside earlier
          - id: a
            text: Making tomorrow's forecast from this morning's readings
        answer: a
        feedback: Inference means using the finished model on a new input. Adjusting weights is training, and scoring on held-aside days is testing.
      - id: inside-a-system.transfer.v3.6
        prompt: A team tries many weights, checks each one on the test set, and keeps whichever scores best there. What is the problem?
        options:
          - id: b
            text: The test set is now being used to pick the model
          - id: a
            text: The test set must be too small to hold enough trips
          - id: c
            text: Weights shouldn't change once the first training ends
        answer: b
        feedback: A test set only gives an honest check if it plays no part in choosing the model. Picking the weight by test score quietly turns the test set into training data.
