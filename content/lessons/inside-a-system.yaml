schema_version: 0.2-draft
lesson:
  id: inside-a-system
  version: 0.1.0-draft
  title: The life of an AI system
  state: draft
  summary: Follow data, representation, model, objective, training, evaluation, and inference as distinct parts
    of a system’s lifecycle.
  slot: M00.4
  category: common
  minutes: 9
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — topic overview'
    url: https://aima.cs.berkeley.edu/contents.html
objectives:
- id: objective.inside-a-system
  version: 1-draft
  statement: Follow data, representation, model, objective, training, evaluation, and inference as distinct
    parts of a system’s lifecycle.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - inside-a-system.base
  - inside-a-system.transfer
  prerequisites:
  - anyOf:
    - objective.models-and-products
  - anyOf:
    - objective.ways-to-learn
scenes:
- id: inside-a-system.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.inside-a-system
  text_mode: The complete explanation is available as readable text.
  title: A lifecycle, not a magic box
  markdown: 'Begin with a task: estimate the time a delivery will take. Collect examples, represent each delivery
    as numbers, choose a model, define an error measure, and train.


    Then evaluate on data kept apart from training. Finally, run the chosen model on a new delivery request.
    This last use is **inference**.'
- id: inside-a-system.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.inside-a-system
  text_mode: The complete explanation is available as readable text.
  title: What changes during training?
  markdown: 'For a trainable model, parameters change according to an update rule informed by a loss or reward.
    Data, a model, and an optimizer have different roles.


    A low training loss tells you how well the model fits that training objective on those examples. It is
    not enough to establish useful behavior on new requests.'
- id: inside-a-system.s3
  type: explanation
  depth: intuition
  objective_refs:
  - objective.inside-a-system
  text_mode: The complete explanation is available as readable text.
  title: What happens during inference?
  markdown: 'A request is represented in a form the model accepts. The model computes outputs using its current
    parameters. The system interprets those outputs and may take further steps.


    A language system may compute many successive next-token predictions for one answer. Generating many tokens
    is still inference; it is not necessarily retraining.'
- id: inside-a-system.s4
  type: explanation
  depth: intuition
  objective_refs:
  - objective.inside-a-system
  text_mode: The complete explanation is available as readable text.
  title: Keep the checkpoints distinct
  markdown: 'Ask: what data enters this stage, what operation happens, what changes, what remains fixed, and
    what artifact comes out?


    Some systems add continued training, adaptation, compression, tools, and monitoring. There is no universal
    sequence that every AI system must follow.'
- id: inside-a-system.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.inside-a-system
  markdown: Use two different examples to check your understanding. Hints are available for practice. A later,
    fresh answer without hints can demonstrate personal-study mastery.
  text_mode: Labeled radio options and a submit button; no timing requirement.
- id: inside-a-system.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.inside-a-system
  markdown: Follow data, representation, model, objective, training, evaluation, and inference as distinct
    parts of a system’s lifecycle.
  text_mode: Follow data, representation, model, objective, training, evaluation, and inference as distinct
    parts of a system’s lifecycle.
