schema_version: 0.2-draft
lesson:
  id: inside-a-system
  version: 0.3.0-draft
  title: Follow one small AI system from start to finish
  state: draft
  summary: Put the words you have learned into a complete delivery-time example, from collected notes to a
    new prediction.
  slot: M00.7
  category: common
  sources:
  - title: Dive into Deep Learning — linear regression
    url: https://d2l.ai/chapter_linear-regression/linear-regression.html
  archetype: foundation
objectives:
- id: objective.inside-a-system
  version: 2-draft
  statement: Follow data, representation, model, objective, training, evaluation, and inference as distinct
    parts of a system’s lifecycle.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - inside-a-system.base
  - inside-a-system.transfer
  prerequisites:
  - anyOf:
    - objective.training-and-inference
scenes:
- id: inside-a-system.s1
  title: Start by naming the promise
  type: explanation
  depth: intuition
  objective_refs:
  - objective.inside-a-system
  markdown: 'Imagine a delivery helper that estimates how many minutes a bicycle trip will take. Its task is
    to estimate time, its input is information about a trip, and its output is a predicted number of minutes.
    Start with one input: distance in kilometers. This deliberately simple model leaves out hills, traffic,
    and stops. Naming those omissions helps us judge the rule fairly and decide what information a better version
    might need.'
  text_mode: 'Imagine a delivery helper that estimates how many minutes a bicycle trip will take. Its task
    is to estimate time, its input is information about a trip, and its output is a predicted number of minutes.
    Start with one input: distance in kilometers. This deliberately simple model leaves out hills, traffic,
    and stops. Naming those omissions helps us judge the rule fairly and decide what information a better version
    might need.'
- id: inside-a-system.s2
  title: Collect and represent examples
  type: explanation
  depth: intuition
  objective_refs:
  - objective.inside-a-system
  markdown: Record a few past trips, with distance and actual duration. To **represent** something means to
    put it into a form the program can work with. Here a distance such as two kilometers is written as the
    number 2, with a note saying which unit it uses. A **feature** is one piece of input information chosen
    for a model, such as distance. The observed duration is the target. Keep them in separate columns so the
    answer does not become a shortcut input.
  text_mode: Record a few past trips, with distance and actual duration. To **represent** something means to
    put it into a form the program can work with. Here a distance such as two kilometers is written as the
    number 2, with a note saying which unit it uses. A **feature** is one piece of input information chosen
    for a model, such as distance. The observed duration is the target. Keep them in separate columns so the
    answer does not become a shortcut input.
- id: inside-a-system.s3
  title: Choose a model and train it
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.inside-a-system
  markdown: 'Try a simple rule: minutes = minutes-per-kilometer × distance. The minutes-per-kilometer value
    is its weight. Suppose training notes show a 2-kilometer trip took 8 minutes and a 3-kilometer trip took
    12. Weight 4 matches both. We could choose that weight by comparing prediction mistakes. The trip records
    tell us what happened. The model turns distance into a prediction, and training chooses its weight by comparing
    those predictions with the records.'
  text_mode: 'Try a simple rule: minutes = minutes-per-kilometer × distance. The minutes-per-kilometer value
    is its weight. Suppose training notes show a 2-kilometer trip took 8 minutes and a 3-kilometer trip took
    12. Weight 4 matches both. We could choose that weight by comparing prediction mistakes. The trip records
    tell us what happened. The model turns distance into a prediction, and training chooses its weight by comparing
    those predictions with the records.'
- id: inside-a-system.s4
  title: Test on examples kept aside
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.inside-a-system
  markdown: '**Evaluation** means checking how well a system performs a chosen task. Keep some trips aside
    while choosing the weight. Suppose a different 2-kilometer trip took 11 minutes because of a hill. Our
    rule predicts 8, so it is 3 minutes short. This test reveals a limitation that the easy training examples
    did not show. A **test set** is a collection used for such checking after model choices, rather than for
    fitting those same choices.'
  text_mode: '**Evaluation** means checking how well a system performs a chosen task. Keep some trips aside
    while choosing the weight. Suppose a different 2-kilometer trip took 11 minutes because of a hill. Our
    rule predicts 8, so it is 3 minutes short. This test reveals a limitation that the easy training examples
    did not show. A **test set** is a collection used for such checking after model choices, rather than for
    fitting those same choices.'
- id: inside-a-system.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.inside-a-system
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Collect examples, choose and adjust a model, test it on different examples, then use it on new
    inputs. Each step answers a different question.
- id: inside-a-system.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.inside-a-system
  markdown: Follow data, representation, model, objective, training, evaluation, and inference as distinct
    parts of a system’s lifecycle.
  text_mode: Follow data, representation, model, objective, training, evaluation, and inference as distinct
    parts of a system’s lifecycle.
- id: inside-a-system.s5
  title: Use it and inspect the whole trip
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.inside-a-system
  markdown: For a new 5-kilometer request, weight 4 predicts 20 minutes. That is inference. The app must read
    the distance, call the calculation, and show the result with the correct unit. If someone enters miles
    but the app treats the number as kilometers, the system can fail before the model even runs. If the rule
    ignores hills, the model itself can be too simple. Check each step to find where the mistake arose.
  text_mode: For a new 5-kilometer request, weight 4 predicts 20 minutes. That is inference. The app must read
    the distance, call the calculation, and show the result with the correct unit. If someone enters miles
    but the app treats the number as kilometers, the system can fail before the model even runs. If the rule
    ignores hills, the model itself can be too simple. Check each step to find where the mistake arose.
- id: inside-a-system.s6
  title: The stages are a map, not a guarantee
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.inside-a-system
  markdown: 'Draw your own row of boxes: task → examples → model choice → training → evaluation → use. A **lifecycle**
    is the set of stages through which something is developed and used. Real systems can revisit earlier stages
    when new evidence arrives. Testing may send you back to collect hill examples or choose a different rule.
    For each box, ask what information it receives and what decision it helps you make.'
  text_mode: 'Draw your own row of boxes: task → examples → model choice → training → evaluation → use. A **lifecycle**
    is the set of stages through which something is developed and used. Real systems can revisit earlier stages
    when new evidence arrives. Testing may send you back to collect hill examples or choose a different rule.
    For each box, ask what information it receives and what decision it helps you make.'
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - inside-a-system.s1
    - inside-a-system.s2
    - inside-a-system.s3
    - inside-a-system.s4
    - inside-a-system.s5
    - inside-a-system.s6
    - inside-a-system.check
    gate_refs:
    - gate.core
  scene_aliases:
    inside-a-system.recap: inside-a-system.check
assessment_families:
- id: inside-a-system.base
  objective_ref: objective.inside-a-system
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
  variants:
  - id: inside-a-system.base.1
    prompt: What usually changes during a gradient-based training update?
    options:
    - id: correct
      text: Selected model parameters.
    - id: a
      text: The definition of the observed past examples.
    - id: b
      text: Every deployment request at once.
    answer: correct
    feedback: Selected model parameters.
    retired: true
  - id: inside-a-system.base.2
    prompt: What is inference?
    options:
    - id: a
      text: Always adjusting model weights.
    - id: b
      text: Only collecting a training dataset.
    - id: correct
      text: Using a model to compute outputs for inputs.
    answer: correct
    feedback: Using a model to compute outputs for inputs.
    retired: true
  - id: inside-a-system.base.v2.1
    prompt: Which value is the target for a recorded delivery example?
    options:
    - id: b
      text: The distance entered for the trip
    - id: c
      text: The chosen minutes-per-kilometer weight
    - id: a
      text: The observed trip duration
    answer: a
    feedback: The target is the observed answer, not an input or stored setting.
  - id: inside-a-system.base.v2.2
    prompt: A trip’s distance is chosen as an input to the predictor. What is it called?
    options:
    - id: c
      text: An optimizer
    - id: a
      text: A feature
    - id: b
      text: A loss
    answer: a
    feedback: A feature is a selected piece of input information.
  - id: inside-a-system.base.v2.3
    prompt: Weight 4 is used for a 5-kilometer trip. What is the prediction?
    options:
    - id: a
      text: 20 minutes
    - id: b
      text: 9 minutes
    - id: c
      text: 4 minutes
    answer: a
    feedback: Five groups of four minutes give twenty minutes.
  - id: inside-a-system.base.v2.4
    prompt: Why keep some trips aside while choosing the weight?
    options:
    - id: b
      text: To choose the best weight using the testing trips
    - id: c
      text: To use the same trips for fitting and final checking
    - id: a
      text: To check behavior on examples not used for fitting
    answer: a
    feedback: Held-aside examples help reveal whether fitting carries to different examples.
  - id: inside-a-system.base.v2.5
    prompt: A delivery model multiplies distance by 3 minutes per kilometer. What does it predict for 4 kilometers?
    options:
    - id: a
      text: 7 minutes
    - id: b
      text: 3 minutes
    - id: c
      text: 12 minutes
    answer: c
    feedback: The distance is the input and 3 is the weight. Four groups of three minutes give 12.
  - id: inside-a-system.base.v2.6
    prompt: You choose a weight using one set of trips. Why check it on trips kept outside that fitting process?
    options:
    - id: a
      text: To see how it behaves beyond the fitting examples
    - id: b
      text: To guarantee that every future trip is predicted exactly
    - id: c
      text: To convert the checking trips into new input units
    answer: a
    feedback: Held-aside examples help test whether the learned rule extends beyond the examples used to choose
      it.
  remediation_scene: inside-a-system.s3
- id: inside-a-system.transfer
  objective_ref: objective.inside-a-system
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
  variants:
  - id: inside-a-system.transfer.1
    prompt: A chat model generates fifty tokens using fixed weights. Which stage is this?
    options:
    - id: a
      text: Fifty rounds of full model retraining.
    - id: b
      text: A guarantee that evaluation has passed.
    - id: correct
      text: Inference, repeated over the growing context.
    answer: correct
    feedback: Inference, repeated over the growing context.
    retired: true
  - id: inside-a-system.transfer.2
    prompt: Training error is low. What should happen before claiming good performance on new data?
    options:
    - id: b
      text: Reuse the training examples as the only test.
    - id: correct
      text: Evaluate on appropriate held-out examples and tasks.
    - id: a
      text: Assume the low error proves general reliability.
    answer: correct
    feedback: Evaluate on appropriate held-out examples and tasks.
    retired: true
  - id: inside-a-system.transfer.v2.1
    prompt: A 2-kilometer hill trip took 11 minutes, but the rule predicted 8. What did evaluation reveal?
    options:
    - id: c
      text: An exact fit to that trip
    - id: a
      text: A three-minute underestimate on that trip
    - id: b
      text: A three-minute overestimate on that trip
    answer: a
    feedback: Eleven exceeds eight by three, so the predicted time is too short.
  - id: inside-a-system.transfer.v2.2
    prompt: Miles are entered but interpreted as kilometers. Which boundary failed?
    options:
    - id: a
      text: The meaning assigned to the input number
    - id: b
      text: The weight changed while the number kept its meaning
    - id: c
      text: The observed travel time was used as an input
    answer: a
    feedback: The number has been interpreted with the wrong unit.
  - id: inside-a-system.transfer.v2.3
    prompt: Testing reveals errors on hills. Which next step responds to that finding?
    options:
    - id: b
      text: Report the average across all trips without inspecting hills
    - id: c
      text: Choose a new weight using the same final test repeatedly
    - id: a
      text: Collect hill examples and reconsider the rule
    answer: a
    feedback: New relevant information can guide a better representation or model.
  - id: inside-a-system.transfer.v2.4
    prompt: What does lifecycle mean here?
    options:
    - id: c
      text: Changes in one trip’s distance over time
    - id: a
      text: Stages of developing and using the system
    - id: b
      text: Steps within one calculation of a prediction
    answer: a
    feedback: It describes the development and use process rather than a hardware duration.
  - id: inside-a-system.transfer.v2.5
    prompt: A delivery rule predicts 15 minutes for a trip that takes 18. What does this observation show?
    options:
    - id: a
      text: A three-minute underestimate on that trip
    - id: b
      text: A three-minute overestimate on that trip
    - id: c
      text: A correct prediction because both times refer to one trip
    answer: a
    feedback: 'Compare the proposed and observed times: 18 − 15 = 3. One error describes this case; other cases
      still need checking.'
  - id: inside-a-system.transfer.v2.6
    prompt: A distance input changes from kilometers to miles, but the app still treats the number as kilometers.
      What should be fixed?
    options:
    - id: a
      text: The display color while keeping the same interpretation
    - id: b
      text: The unit conversion or the meaning assigned to the input
    - id: c
      text: The test report’s title while keeping the same interpretation
    answer: b
    feedback: A number needs the right meaning. An input-unit mismatch can break the system even when the multiplication
      is correct.
  remediation_scene: inside-a-system.s3
