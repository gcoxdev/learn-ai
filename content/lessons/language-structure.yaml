schema_version: 0.2-draft
lesson:
  id: language-structure
  version: 0.4.0-draft
  title: Words, structure, meaning, and context
  state: draft
  summary: '"Dog bites man" and "man bites dog" use the same three words. See why order, ambiguity, and context make language hard for machines, and how to test for it.'
  slot: M14.1
  category: learning
  sources:
    - title: Speech and Language Processing, 3rd edition draft (Jurafsky & Martin)
      url: https://web.stanford.edu/~jurafsky/slp3/
    - title: "A collection of Winograd schemas (Ernest Davis, NYU), from the challenge proposed by Levesque, Davis & Morgenstern (2012)"
      url: https://cs.nyu.edu/~davise/papers/WinogradSchemas/WS.html
    - title: Dive into Deep Learning — language models
      url: https://d2l.ai/chapter_recurrent-neural-networks/language-model.html
  archetype: mechanism
objectives:
  - id: objective.language-structure
    version: 3-draft
    statement: Distinguish order, reference, ambiguity, and prediction in a concrete language example.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - language-structure.base.v3
      - language-structure.transfer.v3
    prerequisites:
      - anyOf:
          - objective.digital-representations
      - anyOf:
          - objective.ai-traditions
scenes:
  - id: language-structure.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.language-structure
    title: Same three words, different news
    markdown: |-
      An old newsroom saying goes: "Dog bites man" isn't news, but "man bites dog" is. Same three words; only the order tells you who got bitten. Count the words the way a simple program might:

      | Word | "dog bites man" | "man bites dog" |
      | --- | ---: | ---: |
      | dog | 1 | 1 |
      | bites | 1 | 1 |
      | man | 1 | 1 |

      Keeping only word counts gives a **bag of words**: tip the words into a bag, shake, and count. It's good for guessing a topic but can't tell these headlines apart.

      **Syntax** is the set of patterns that arrange words into sentences. In English, the noun before the verb usually does the action (the *subject*) and the noun after it receives it (the *object*). Swap positions and you swap roles.

      ```python run
      from collections import Counter

      a = "dog bites man".split()
      b = "man bites dog".split()
      print("same bag of words?", Counter(a) == Counter(b))

      pairs_a = list(zip(a, a[1:]))   # neighboring word pairs keep some order
      pairs_b = list(zip(b, b[1:]))
      print("pairs in a:", pairs_a)
      print("pairs in b:", pairs_b)
      print("same word pairs?  ", pairs_a == pairs_b)
      ```

      Counting neighboring *pairs* tells them apart; the counting models two lessons from now start here. Try "the dog saw the man" against "the man saw the dog."
    bridges: []
  - id: language-structure.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.language-structure
    title: Four words, two pictures
    markdown: |-
      Read "I saw her duck." Did you picture a woman ducking, or her pet duck? **Ambiguity** means one piece of text allows more than one interpretation. It comes in two kinds:

      | Sentence | Kind | Reading 1 | Reading 2 |
      | --- | --- | --- | --- |
      | "The bat was damaged." | **Lexical**: one word has two meanings | the animal | the baseball bat |
      | "I saw the man with the telescope." | **Structural**: the words group in two ways | I used the telescope | the man had the telescope |
      | "I saw her duck." | Both at once | *duck* is a verb: she ducked | *duck* is a noun: her bird |

      The diagram shows the telescope case: "with the telescope" can hang from the verb or from the noun.

      :::predict Read this sentence once, quickly: "The old man the boats." What goes wrong, and what does it mean?
      Most readers take "the old man" as a noun phrase and then find no verb. But *man* is the verb (to staff, as in "man the lifeboats"), and "the old" means old people. A sentence that leads you into the wrong structure first is a **garden-path sentence**.
      :::
    diagram:
      caption: One sentence, two attachments. Where "with the telescope" hangs decides who has it.
      description: The verb "saw" connects to its subject "I" and its object "the man". The phrase "with the telescope" can attach to "saw" (reading 1, I used the telescope to see) or, shown dashed, to "the man" (reading 2, the man was holding the telescope).
      nodes:
        - id: saw
          label: saw
          note: verb
          col: 1
          row: 0
          tone: accent
        - id: i
          label: I
          note: who saw
          col: 0
          row: 1
        - id: man
          label: the man
          note: who was seen
          col: 2
          row: 1
        - id: telescope
          label: with the telescope
          note: attaches where?
          col: 1
          row: 2
          tone: warn
      edges:
        - from: saw
          to: i
          label: subject
        - from: saw
          to: man
          label: object
        - from: saw
          to: telescope
          label: "reading 1: how I saw"
        - from: man
          to: telescope
          label: "reading 2: which man"
          dashed: true
    bridges: []
  - id: language-structure.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.language-structure
    title: Different words, same request
    markdown: |-
      Compare three sentences:

      1. "Please close the window."
      2. "Could you shut the window?"
      3. "Don't close the window."

      Sentences 1 and 2 share two words and ask for the same thing. Sentences 1 and 3 share most words and ask for opposite things. Linguists split language into levels, and each example so far lives at one:

      | Level | What it studies | Example |
      | --- | --- | --- |
      | **Morphology** | how words are built from parts | *un + believ + able* |
      | **Syntax** | how words combine into sentences | dog bites man vs man bites dog |
      | **Semantics** | what an expression literally means | "close" vs "don't close" |
      | **Pragmatics** | what a speaker means in context | "Could you shut the window?" is a request |

      Sentence 2 is literally a question about your abilities. Nobody answers "Yes, I could" and stays seated.

      :::mixup "Two sentences mean the same thing if they share most of their words."
      "Close the window" and "Don't close the window" share three words and mean opposite things. A system that drops short, common words to save space can drop exactly the word that matters: *not*.
      :::
    bridges: []
  - id: language-structure.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.language-structure
    title: Who was cold? Look further back
    markdown: |-
      "Alex handed Sam the coat because they were cold." Who was cold? Probably Sam, but the sentence doesn't say. Working out what a word like *they* or *it* points to is called **coreference resolution**. Often the answer comes from knowing how the world works:

      - "The trophy doesn't fit in the suitcase because *it* is too big." (*it* = the trophy)
      - "The trophy doesn't fit in the suitcase because *it* is too small." (*it* = the suitcase)

      :::story A test built from pronouns
      In 2011, Hector Levesque proposed the **Winograd Schema Challenge**, and in 2012 he, Ernest Davis, and Leora Morgenstern set out the full test: pairs like the trophy one, where one changed word flips what the pronoun means, chosen so that word statistics alone wouldn't help. Within a decade, large language models got most of them right; what that shows is still debated.
      :::

      The clue can also sit earlier in the text. The **context** is everything the system can see when it computes an answer: earlier sentences, instructions, a pasted document. If "Sam was shivering" came three pages back and the system sees only the last page, the clue is gone.
    bridges: []
  - id: language-structure.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.language-structure
    title: Language as a guessing game
    markdown: |-
      Finish this: "peanut butter and ___." You probably said *jelly* or *jam*, predicting from language you've heard. A **language model** does the same with numbers: it gives each possible next piece of text a probability, given the text so far. It might give *jelly* 0.6, *jam* 0.3, and everything else 0.1.

      Ambiguity is why the output is a spread of bets. After "I saw her," both *duck* and *dog* fit. After "She took bread to the pond for the birds. I saw her," *duck* becomes far more likely.

      These probabilities describe language, not the world. A model can rate "The capital of Australia is Sydney" as likely, because that mistake is common in writing. (It's Canberra.) To check a claim, look it up in a source.
    bridges:
      - probability
  - id: language-structure.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.language-structure
    title: Build a four-item stress test
    markdown: |-
      To test a language system on these ideas, pair each test item with a twin that changes one thing:

      | Idea | Test item | Twin |
      | --- | --- | --- |
      | Roles | "Pat gave Ali a book. Who has it?" | Swap Pat and Ali |
      | Negation | "Do not water the fern. Should I water it?" | Remove "not" |
      | Paraphrase | "Shut the door" vs "Could you close the door?" | "Open the door" |
      | Reference | "Kim called Jo because she was late. Who was late?" | none |

      The twins do the real work. A model might pass the roles item by assuming the first name is the giver; the swapped twin catches that. For the reference item, the best answer is "It's unclear," and a fair test gives it credit. Try one yourself next.
    bridges: []
  - id: language-structure.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.language-structure
    markdown: Headlines, smart-home commands, a support chat, and a grading rule test whether you can spot word order, ambiguity, negation, and missing context.
    takeaway: |-
      Word order sets the roles, context settles ambiguity, and a small word like "not" can flip a meaning. A language model predicts likely words; checking a fact needs a source.
  - id: language-structure.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.language-structure
    markdown: |-
      Language modeling must contend with morphology, syntax, semantics, and pragmatics; ambiguity means the same surface text can support several interpretations.
  - id: language-structure.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.language-structure
    title: Try the role-swap puzzle
    markdown: “Mina borrowed a bicycle from Lee.” A rewrite says “Lee borrowed a bicycle from Mina.” What changed?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: The borrower and lender roles changed.
        - id: b
          text: Only the spelling of the names changed.
        - id: c
          text: The two sentences describe the same borrowing event.
      answer: a
      reveal_markdown: |-
        The same words can assign different roles when their positions change. Here Mina and Lee swap roles: in the rewrite, Lee is the borrower and Mina the lender, so it describes a different event.
      hint: Ask who ends up holding the bicycle in each sentence. Position before "borrowed" marks the borrower.
      id: language-structure.practice.v2.7
navigation:
