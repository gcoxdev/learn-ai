assessment_families:
  - id: language-structure.base
    objective_ref: objective.language-structure
    task: base
    response_type: single_choice
    points: 1
    hint: 'Inspect an ambiguous sentence: trace the inputs, operation, and result before choosing.'
    remediation_scene: language-structure.s2
    variants:
      - id: language-structure.base.1
        prompt: Which area concerns how words combine into sentence structure?
        options:
          - id: b
            text: Only audio sampling
          - id: c
            text: Only file compression
          - id: a
            text: Syntax
        answer: a
        feedback: Syntax addresses structural relationships among words.
        retired: true
      - id: language-structure.base.2
        prompt: What does the telescope sentence illustrate?
        options:
          - id: c
            text: A failure of arithmetic
          - id: a
            text: Multiple plausible structural interpretations
          - id: b
            text: A unique meaning under every context
        answer: a
        feedback: Attachment ambiguity can change who has or uses the telescope.
        retired: true
  - id: language-structure.transfer
    objective_ref: objective.language-structure
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Connect language structure to model evaluation: trace the inputs, operation, and result before choosing.'
    remediation_scene: language-structure.s4
    variants:
      - id: language-structure.transfer.1
        prompt: A sentence is grammatical but factually false. What distinction matters?
        options:
          - id: c
            text: Only the number of words
          - id: a
            text: Syntactic well-formedness versus truth
          - id: b
            text: All grammatical sentences are true
        answer: a
        feedback: Different language properties require different evidence.
        retired: true
      - id: language-structure.transfer.2
        prompt: “Can you pass the salt?” is interpreted as a request. Which level helps explain that use?
        options:
          - id: a
            text: Pragmatics
          - id: b
            text: Only character encoding
          - id: c
            text: Only matrix shape
        answer: a
        feedback: Context and conversational convention affect the intended action.
        retired: true
  - id: language-structure.base.v2
    objective_ref: objective.language-structure
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: language-structure.s3
    variants:
      - prompt: Which pair changes the requested action through negation?
        answer: a
        options:
          - id: a
            text: “Close the gate” / “Do not close the gate”
          - id: c
            text: “Close the gate” / “Please close the gate”
          - id: b
            text: “Close the gate” / “Shut the gate”
        feedback: Negation reverses the requested action; the other pairs preserve it.
        id: language-structure.base.v2.1
        retired: true
      - prompt: “Jo greeted Kim” becomes “Kim greeted Jo.” What information must be preserved to distinguish them?
        answer: a
        options:
          - id: b
            text: The unordered list of the two names
          - id: a
            text: The order assigning who greeted whom
          - id: c
            text: The total number of letters
        feedback: Order determines the roles, even when the names and verb stay the same.
        id: language-structure.base.v2.2
        retired: true
      - prompt: “The bat was damaged” appears without more context. What can remain unresolved?
        answer: a
        options:
          - id: c
            text: Whether the letters can be stored as numbers
          - id: b
            text: Whether the sentence contains a noun
          - id: a
            text: Whether bat refers to an animal or an object
        feedback: More context is needed to resolve the intended sense.
        id: language-structure.base.v2.3
        retired: true
      - prompt: Which describes context for a language system?
        answer: a
        options:
          - id: c
            text: The future answer before it is generated
          - id: a
            text: The supplied material available for this computation
          - id: b
            text: The complete contents of every training example
        feedback: Current context and past training examples have different roles.
        id: language-structure.base.v2.4
        retired: true
  - id: language-structure.transfer.v2
    objective_ref: objective.language-structure
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: language-structure.s3
    variants:
      - prompt: A predictor favors “sunny” after “Tomorrow will be.” What evidence would justify a weather claim?
        answer: a
        options:
          - id: a
            text: A relevant forecast or observation source
          - id: c
            text: More repetitions of the same generated sentence
          - id: b
            text: A higher next-word probability by itself
        feedback: A likely continuation is evidence about language patterns, not tomorrow’s weather.
        id: language-structure.transfer.v2.1
        retired: true
      - prompt: A system cannot resolve who “she” refers to in a note. Which test design is most appropriate?
        answer: a
        options:
          - id: c
            text: Score whichever name is more common
          - id: a
            text: Accept a justified request for clarification
          - id: b
            text: Require one name despite unresolved ambiguity
        feedback: A fair task distinguishes resolvable references from genuinely missing information.
        id: language-structure.transfer.v2.2
        retired: true
      - prompt: A test says “push” and a second says “do not push.” A model treats them alike. What should you investigate?
        answer: a
        options:
          - id: b
            text: Whether both have a similar number of letters
          - id: a
            text: Whether the negation changes the represented instruction
          - id: c
            text: Whether matching the shared verb alone is enough to encode the command
        feedback: The important difference is the requested action, not superficial formatting.
        id: language-structure.transfer.v2.3
        retired: true
      - prompt: A model succeeds on “Pat gave Ali a book” but fails after names are swapped. What does the changed test probe?
        answer: a
        options:
          - id: b
            text: Whether it can recall the first exact sentence
          - id: c
            text: Whether its training data contains more books
          - id: a
            text: Whether it follows roles beyond the original wording
        feedback: Changing names while retaining structure tests transfer of the relationship.
        id: language-structure.transfer.v2.4
        retired: true
  - id: language-structure.base.v3
    objective_ref: objective.language-structure
    task: base
    response_type: single_choice
    points: 1
    hint: "Ask where the difference lives: in word order (who does what), in one word's two meanings, in how the words group, or in what the speaker intends."
    remediation_scene: language-structure.s2
    variants:
      - id: language-structure.base.v3.1
        prompt: A spam filter counts the words in each message and ignores their order. Which pair of messages can it not tell apart?
        options:
          - id: b
            text: "“Refund the customer today” / “Please refund the customer today”"
          - id: a
            text: "“Refund the buyer, not the seller” / “Refund the seller, not the buyer”"
          - id: c
            text: "“Refund the customer in full” / “Refund the customers in full”"
        answer: a
        feedback: Both messages in that pair contain exactly the same words once each, so their counts match; only the order says who gets the money. The other pairs differ by a whole word ("please") or a word form ("customers"), which a word counter does see.
      - id: language-structure.base.v3.2
        prompt: '"The chicken is ready to eat." Which kind of ambiguity is this?'
        options:
          - id: c
            text: 'Lexical: "ready" has two unrelated dictionary meanings'
          - id: b
            text: "Pragmatic: the speaker might be asking a question"
          - id: a
            text: "Structural: the chicken could be the eater or the food"
        answer: a
        feedback: Every word keeps its usual meaning; what changes is the chicken's role, doing the eating or being eaten. That's a difference in structure. "Ready" means the same thing in both readings.
      - id: language-structure.base.v3.3
        prompt: A smart-home log shows pairs of commands. Which pair asks for opposite actions?
        options:
          - id: a
            text: "“Turn the heater off” / “Don't turn the heater off”"
          - id: b
            text: "“Turn the heater off” / “Switch the heater off”"
          - id: c
            text: "“Turn the heater off” / “Could you turn off the heater?”"
        answer: a
        feedback: One short word, "don't," reverses the request even though the pair shares almost every word. The other pairs use different wording for the same action, which is a paraphrase, not a reversal.
      - id: language-structure.base.v3.4
        prompt: At dinner someone asks, "Can you reach the pepper?" You say "Yes" and keep eating. Which level of language did you miss?
        options:
          - id: b
            text: "Syntax: the words came in an unusual order"
          - id: a
            text: "Pragmatics: the question was really a request"
          - id: c
            text: 'Semantics: "reach" has a second, hidden meaning'
        answer: a
        feedback: You understood the literal meaning, a question about your ability, but missed what the speaker meant in context, which is "please pass it." That gap between literal meaning and intended meaning is pragmatics. The word order and word meanings were ordinary.
      - id: language-structure.base.v3.5
        prompt: 'Most readers stall at the last word of "The horse raced past the barn fell." Why?'
        options:
          - id: c
            text: 'They read "fell" as a noun, so the sentence seems to have no verb'
          - id: a
            text: 'They read "raced" as the main verb, but it means "that was raced"'
          - id: b
            text: "The sentence breaks English grammar and has no correct reading"
        answer: a
        feedback: It's a garden-path sentence. It means "The horse that was raced past the barn fell," so "fell" is the main verb. Readers commit early to "raced" as the main verb and have to back up. The sentence is grammatical, just hard to parse.
  - id: language-structure.transfer.v3
    objective_ref: objective.language-structure
    task: transfer
    response_type: single_choice
    points: 1
    hint: Before blaming the model, ask where the missing information is. Is it in the words, earlier in the text, in knowledge about the world, or nowhere at all?
    remediation_scene: language-structure.s5
    variants:
      - id: language-structure.transfer.v3.1
        prompt: 'A support bot sees only the customer''s latest message: "It still won''t turn on." It replies, "What won''t turn on?", although the customer named the printer two messages earlier. What went wrong?'
        options:
          - id: a
            text: The earlier message wasn't in the context the bot could see
          - id: b
            text: 'The word "it" has two dictionary meanings in this sentence'
          - id: c
            text: The bot's parser failed to find the verb in the sentence
        answer: a
        feedback: The clue that settles "it" was written down, but outside what the bot was shown, so the reference can't be resolved. "It" isn't lexically ambiguous here, and the verb "turn on" is easy to find.
      - id: language-structure.transfer.v3.2
        prompt: 'A writing assistant rates "The Great Wall of China is visible from the Moon" as a very likely sentence. What does the high probability tell you?'
        options:
          - id: c
            text: The claim is probably true, since likely sentences tend to be facts
          - id: a
            text: The sentence resembles text people often write, true or not
          - id: b
            text: The model checked the claim against a source before scoring it
        answer: a
        feedback: A language model scores how typical a piece of text is. Popular myths are typical text, so they can score high. The claim is false, and no source was consulted; checking it needs evidence about the world.
      - id: language-structure.transfer.v3.3
        prompt: 'You''re scoring a model on "Mia texted Ana because she was lost. Who was lost?" Which scoring rule is fairest?'
        options:
          - id: b
            text: Accept "Mia" alone, since the first name is usually the subject
          - id: c
            text: Accept "Ana" alone, since the person texted usually needs help
          - id: a
            text: Give credit for saying it could be either, with a reason
        answer: a
        feedback: Either reading makes sense (Mia texts because she's lost, or texts Ana to help her), so the text doesn't settle it. Forcing one answer rewards a lucky guess and punishes a model that correctly notices the ambiguity.
      - id: language-structure.transfer.v3.4
        prompt: 'A model answers "Pat gave Ali a book. Who has the book?" correctly with "Ali." What should you test next to see whether it really tracks roles?'
        options:
          - id: b
            text: Ask the same question again, word for word
          - id: a
            text: "Swap the names: “Ali gave Pat a book”"
          - id: c
            text: Replace "book" with a longer word, like "encyclopedia"
        answer: a
        feedback: The swapped twin changes who holds the book while keeping every word, so only a model that follows the order will flip its answer. Repeating the question or changing the object leaves the roles untouched.
