schema_version: 0.2-draft
lesson:
  id: language-structure
  version: 0.1.0-draft
  title: Words, structure, meaning, and context
  state: draft
  summary: Language modeling must contend with morphology, syntax, semantics, and pragmatics; ambiguity means the
    same surface text can support several interpretations.
  slot: M14.1
  category: learning
  minutes: 12
  sources:
  - title: Speech and Language Processing — authors’ draft
    url: https://web.stanford.edu/~jurafsky/slp3/
objectives:
- id: objective.language-structure
  version: 1-draft
  statement: Language modeling must contend with morphology, syntax, semantics, and pragmatics; ambiguity means
    the same surface text can support several interpretations.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - language-structure.base
  - language-structure.transfer
  prerequisites:
  - anyOf:
    - objective.digital-representations
  - anyOf:
    - objective.ai-traditions
scenes:
- id: language-structure.s1
  title: Different levels answer different questions
  type: explanation
  depth: intuition
  objective_refs:
  - objective.language-structure
  markdown: Morphology concerns word structure, such as a plural ending. Syntax concerns how words combine. Semantics
    concerns meaning, and pragmatics concerns interpretation in context and use. These levels interact. A grammatically
    well-formed sentence can still be false, ambiguous, or inappropriate for the situation.
  text_mode: Morphology concerns word structure, such as a plural ending. Syntax concerns how words combine. Semantics
    concerns meaning, and pragmatics concerns interpretation in context and use. These levels interact. A grammatically
    well-formed sentence can still be false, ambiguous, or inappropriate for the situation.
  bridges: []
- id: language-structure.s2
  title: Inspect an ambiguous sentence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.language-structure
  markdown: “I saw the person with the telescope” can mean the telescope was used for seeing or that the person
    had it. Different structural attachments support different meanings. More context can favor one interpretation,
    but a single isolated sentence need not uniquely determine the intended scene.
  text_mode: “I saw the person with the telescope” can mean the telescope was used for seeing or that the person
    had it. Different structural attachments support different meanings. More context can favor one interpretation,
    but a single isolated sentence need not uniquely determine the intended scene.
  bridges: []
- id: language-structure.s3
  title: Words change meaning with use
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.language-structure
  markdown: The word bank can refer to a financial institution or a river edge. A request such as “Can you open
    the window?” usually asks for an action rather than only a capability report. Surface form alone is therefore
    insufficient for every language task. Context, reference, and social convention contribute information.
  text_mode: The word bank can refer to a financial institution or a river edge. A request such as “Can you open
    the window?” usually asks for an action rather than only a capability report. Surface form alone is therefore
    insufficient for every language task. Context, reference, and social convention contribute information.
  bridges: []
- id: language-structure.s4
  title: Connect language structure to model evaluation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.language-structure
  markdown: Tagging, parsing, translation, question answering, and dialogue test different abilities. A next-token
    objective can learn patterns useful for several tasks without explicitly representing every linguistic theory.
    Evaluate ambiguous examples and context changes instead of using fluent grammar as proof of correct understanding.
  text_mode: Tagging, parsing, translation, question answering, and dialogue test different abilities. A next-token
    objective can learn patterns useful for several tasks without explicitly representing every linguistic theory.
    Evaluate ambiguous examples and context changes instead of using fluent grammar as proof of correct understanding.
  bridges: []
- id: language-structure.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.language-structure
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: language-structure.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.language-structure
  markdown: Language modeling must contend with morphology, syntax, semantics, and pragmatics; ambiguity means the
    same surface text can support several interpretations.
  text_mode: Language modeling must contend with morphology, syntax, semantics, and pragmatics; ambiguity means
    the same surface text can support several interpretations.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - language-structure.s1
    - language-structure.s2
    - language-structure.s3
    - language-structure.s4
    - language-structure.check
    - language-structure.recap
    gate_refs:
    - gate.core
assessment_families:
- id: language-structure.base
  objective_ref: objective.language-structure
  task: base
  response_type: single_choice
  points: 1
  hint: 'Inspect an ambiguous sentence: trace the inputs, operation, and result before choosing.'
  remediation_scene: language-structure.s2
  variants:
  - id: language-structure.base.1
    prompt: Which area concerns how words combine into sentence structure?
    options:
    - id: b
      text: Only audio sampling
    - id: c
      text: Only file compression
    - id: a
      text: Syntax
    answer: a
    feedback: Syntax addresses structural relationships among words.
  - id: language-structure.base.2
    prompt: What does the telescope sentence illustrate?
    options:
    - id: c
      text: A failure of arithmetic
    - id: a
      text: Multiple plausible structural interpretations
    - id: b
      text: A unique meaning under every context
    answer: a
    feedback: Attachment ambiguity can change who has or uses the telescope.
- id: language-structure.transfer
  objective_ref: objective.language-structure
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Connect language structure to model evaluation: trace the inputs, operation, and result before choosing.'
  remediation_scene: language-structure.s4
  variants:
  - id: language-structure.transfer.1
    prompt: A sentence is grammatical but factually false. What distinction matters?
    options:
    - id: c
      text: Only the number of words
    - id: a
      text: Syntactic well-formedness versus truth
    - id: b
      text: All grammatical sentences are true
    answer: a
    feedback: Different language properties require different evidence.
  - id: language-structure.transfer.2
    prompt: “Can you pass the salt?” is interpreted as a request. Which level helps explain that use?
    options:
    - id: a
      text: Pragmatics
    - id: b
      text: Only character encoding
    - id: c
      text: Only matrix shape
    answer: a
    feedback: Context and conversational convention affect the intended action.
