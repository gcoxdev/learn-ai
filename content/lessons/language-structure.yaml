schema_version: 0.2-draft
lesson:
  id: language-structure
  version: 0.3.0-draft
  title: Words, structure, meaning, and context
  state: draft
  summary: 'Play detective with a short sentence: the same words can carry different instructions when their
    order or context changes.'
  slot: M14.1
  category: learning
  sources:
  - title: Dive into Deep Learning — language models
    url: https://d2l.ai/chapter_recurrent-neural-networks/language-model.html
  archetype: mechanism
objectives:
- id: objective.language-structure
  version: 2-draft
  statement: Distinguish order, reference, ambiguity, and prediction in a concrete language example.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - language-structure.base.v2
  - language-structure.transfer.v2
  prerequisites:
  - anyOf:
    - objective.digital-representations
  - anyOf:
    - objective.ai-traditions
scenes:
- id: language-structure.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.language-structure
  title: The dog chased the cat; now swap them
  markdown: Read “the dog chased the cat.” Who did the chasing? Now read “the cat chased the dog.” The word
    inventory is the same, but the roles changed. **Syntax** means the patterns used to arrange words into
    phrases and sentences. An AI system that keeps only a bag of word counts loses some of this structure.
    A **sequence** keeps items in order. This is why a language model needs more than a list of which words
    appeared.
  text_mode: Read “the dog chased the cat.” Who did the chasing? Now read “the cat chased the dog.” The word
    inventory is the same, but the roles changed. **Syntax** means the patterns used to arrange words into
    phrases and sentences. An AI system that keeps only a bag of word counts loses some of this structure.
    A **sequence** keeps items in order. This is why a language model needs more than a list of which words
    appeared.
  bridges: []
- id: language-structure.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.language-structure
  title: One sentence can leave a mystery
  markdown: “Alex handed Sam the coat because they were cold.” Who was cold? The sentence allows more than
    one reading without further context. **Reference** connects an expression such as “they” to the person
    or thing it describes. **Ambiguity** means that multiple interpretations remain possible. Adding “Sam was
    shivering” gives a useful clue. It does not change the letters in the original sentence; it changes the
    information available to interpret them.
  text_mode: “Alex handed Sam the coat because they were cold.” Who was cold? The sentence allows more than
    one reading without further context. **Reference** connects an expression such as “they” to the person
    or thing it describes. **Ambiguity** means that multiple interpretations remain possible. Adding “Sam was
    shivering” gives a useful clue. It does not change the letters in the original sentence; it changes the
    information available to interpret them.
  bridges: []
- id: language-structure.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.language-structure
  title: Separate wording from what is meant
  markdown: '**Meaning**, or semantics, concerns what an expression says about a situation. “Please close the
    window” and “Could you shut the window?” can request the same action despite different words. Meanwhile,
    “Do not close the window” reverses the instruction with a small addition. Exact string matching can miss
    paraphrases; ignoring small words can miss a negation. Write the intended action in your own words before
    deciding whether two sentences ask for the same thing.'
  text_mode: '**Meaning**, or semantics, concerns what an expression says about a situation. “Please close
    the window” and “Could you shut the window?” can request the same action despite different words. Meanwhile,
    “Do not close the window” reverses the instruction with a small addition. Exact string matching can miss
    paraphrases; ignoring small words can miss a negation. Write the intended action in your own words before
    deciding whether two sentences ask for the same thing.'
  bridges: []
- id: language-structure.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.language-structure
  title: A game of likely next words
  markdown: Imagine a notebook containing many examples of “peanut butter and jam.” After “peanut butter and,”
    a predictor might favor “jam.” That is a statement about patterns in its examples and current context.
    It does not establish what is on your actual sandwich. A **language model** assigns probabilities to language
    sequences or their next parts. These probabilities describe possible continuations. We still need evidence
    to check the claims in the resulting sentence.
  text_mode: Imagine a notebook containing many examples of “peanut butter and jam.” After “peanut butter and,”
    a predictor might favor “jam.” That is a statement about patterns in its examples and current context.
    It does not establish what is on your actual sandwich. A **language model** assigns probabilities to language
    sequences or their next parts. These probabilities describe possible continuations. We still need evidence
    to check the claims in the resulting sentence.
  bridges:
  - probability
- id: language-structure.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.language-structure
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Words are clues; order and context connect them. Predicting a likely continuation is not the same
    as establishing a fact.
- id: language-structure.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.language-structure
  markdown: Language modeling must contend with morphology, syntax, semantics, and pragmatics; ambiguity means
    the same surface text can support several interpretations.
  text_mode: Language modeling must contend with morphology, syntax, semantics, and pragmatics; ambiguity means
    the same surface text can support several interpretations.
- id: language-structure.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.language-structure
  title: What information can the system see?
  markdown: 'The **context** is the supplied material available for the current computation, such as earlier
    words, an instruction, or a quoted document. A short-context system might see “bank” without the earlier
    mention of a river. A longer context can help, but availability does not guarantee the system uses the
    right clue. Ask three questions when an answer fails: was the evidence supplied, could it fit in the allowed
    context, and did the system actually follow it?'
  text_mode: 'The **context** is the supplied material available for the current computation, such as earlier
    words, an instruction, or a quoted document. A short-context system might see “bank” without the earlier
    mention of a river. A longer context can help, but availability does not guarantee the system uses the
    right clue. Ask three questions when an answer fails: was the evidence supplied, could it fit in the allowed
    context, and did the system actually follow it?'
  bridges: []
- id: language-structure.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.language-structure
  title: Turn the puzzle into a fair test
  markdown: 'Build a tiny challenge set: a role swap, a negation, a paraphrase, and an ambiguous reference.
    For the ambiguous item, allow an answer that asks for clarification. A single forced answer would punish
    appropriate uncertainty. Change names or objects in a second set so the learner or model must use the relationship
    rather than remember the first wording. Remember the sequence “words, order, context, meaning.” These are
    different parts of understanding language, and different tests reveal failures in each.'
  text_mode: 'Build a tiny challenge set: a role swap, a negation, a paraphrase, and an ambiguous reference.
    For the ambiguous item, allow an answer that asks for clarification. A single forced answer would punish
    appropriate uncertainty. Change names or objects in a second set so the learner or model must use the relationship
    rather than remember the first wording. Remember the sequence “words, order, context, meaning.” These are
    different parts of understanding language, and different tests reveal failures in each.'
  bridges: []
- id: language-structure.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.language-structure
  title: Try the role-swap puzzle
  markdown: “Mina borrowed a bicycle from Lee.” A rewrite says “Lee borrowed a bicycle from Mina.” What changed?
  text_mode: “Mina borrowed a bicycle from Lee.” A rewrite says “Lee borrowed a bicycle from Mina.” What changed?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: The borrower and lender roles changed.
    - id: b
      text: Only the spelling of the names changed.
    - id: c
      text: The two sentences describe the same borrowing event.
    answer: a
    reveal_markdown: The same words can assign different roles when their positions change. Here Mina and Lee
      switch borrower/lender roles.
    hint: Trace the example using the rule from the preceding pages.
    id: language-structure.practice.v2.7
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - language-structure.s1
    - language-structure.s2
    - language-structure.s3
    - language-structure.s4
    - language-structure.s5
    - language-structure.s6
    - language-structure.s7
    - language-structure.check
    gate_refs:
    - gate.core
  scene_aliases:
