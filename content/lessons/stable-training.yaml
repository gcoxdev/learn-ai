assessment_families:
- id: stable-training.base
  objective_ref: objective.stable-training
  task: base
  response_type: single_choice
  points: 1
  hint: 'Watch repeated multiplication: trace the inputs, operation, and result before choosing.'
  remediation_scene: stable-training.s2
  variants:
  - id: stable-training.base.1
    prompt: Ten repeated factors of 2 amplify a sensitivity by what?
    options:
    - id: c
      text: '100'
    - id: a
      text: '1024'
    - id: b
      text: '20'
    answer: a
    feedback: The product is 2¹⁰.
  - id: stable-training.base.2
    prompt: Why can identical initialization be problematic for symmetric hidden units?
    options:
    - id: a
      text: They can keep receiving identical updates
    - id: b
      text: It guarantees independent features
    - id: c
      text: It removes every optimization issue
    answer: a
    feedback: Symmetry can prevent units from learning different roles.
- id: stable-training.transfer
  objective_ref: objective.stable-training
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Inspect finite values and distributions: trace the inputs, operation, and result before choosing.'
  remediation_scene: stable-training.s4
  variants:
  - id: stable-training.transfer.1
    prompt: A batch-normalized model behaves differently after switching to evaluation mode. Is that necessarily
      a bug?
    options:
    - id: a
      text: No; the statistic convention can change between modes
    - id: b
      text: Yes; modes can never affect outputs
    - id: c
      text: Only if it has one layer
    answer: a
    feedback: Batch normalization commonly uses different statistics in training and evaluation.
  - id: stable-training.transfer.2
    prompt: Loss becomes nonfinite. What is a useful diagnostic target?
    options:
    - id: b
      text: Only the final printed number
    - id: c
      text: A larger output vocabulary immediately
    - id: a
      text: The first invalid intermediate and its inputs
    answer: a
    feedback: Tracing the earliest failure helps identify numerical or modeling causes.
