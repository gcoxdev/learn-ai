schema_version: 0.2-draft
lesson:
  id: stable-training
  version: 0.3.0-draft
  title: Keep signals and gradients in a usable range
  state: draft
  summary: Keep the numbers flowing through a network large enough to be useful and small enough to remain
    stable.
  slot: M10.7
  category: learning
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: Deep Learning — numerical computation
    url: https://www.deeplearningbook.org/contents/numerical.html
objectives:
- id: objective.stable-training
  version: 1-draft
  statement: Initialization, normalization, activation choice, and numerical precision influence signal scale
    and optimization; stability requires inspecting their interaction rather than relying on one default.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - stable-training.base
  - stable-training.transfer
  prerequisites:
  - anyOf:
    - objective.penalties-and-clipping
  - anyOf:
    - objective.numerical-computing
  - anyOf:
    - objective.neurons
scenes:
- id: stable-training.s1
  title: Choose useful starting weights
  type: explanation
  depth: intuition
  objective_refs:
  - objective.stable-training
  markdown: 'An **activation** is the value produced by a unit. **Fan-in** counts its inputs; **fan-out** counts
    where its output goes next. The scale of starting weights affects how these activations and their gradients
    grow or shrink through the network.


    If hidden units begin identically in a symmetric calculation, they may keep receiving identical updates.
    Random initialization can break that symmetry. Initialization schemes also account for connection counts
    and activation behavior so the starting signals are neither too small nor too large.'
  text_mode: 'An **activation** is the value produced by a unit. **Fan-in** counts its inputs; **fan-out**
    counts where its output goes next. The scale of starting weights affects how these activations and their
    gradients grow or shrink through the network.


    If hidden units begin identically in a symmetric calculation, they may keep receiving identical updates.
    Random initialization can break that symmetry. Initialization schemes also account for connection counts
    and activation behavior so the starting signals are neither too small nor too large.'
  bridges: []
- id: stable-training.s2
  title: Watch repeated multiplication
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.stable-training
  markdown: 'A chain that repeatedly multiplies sensitivity by 0.5 shrinks it: after ten factors the multiplier
    is about 0.001. Repeated factors of 2 amplify it to 1024. Real networks are more complex, but this illustrates
    vanishing and exploding gradients. Nonlinear activation derivatives and normalization influence the chain.'
  text_mode: 'A chain that repeatedly multiplies sensitivity by 0.5 shrinks it: after ten factors the multiplier
    is about 0.001. Repeated factors of 2 amplify it to 1024. Real networks are more complex, but this illustrates
    vanishing and exploding gradients. Nonlinear activation derivatives and normalization influence the chain.'
  bridges:
  - numerical-computing
- id: stable-training.s3
  title: Be clear about what gets normalized
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.stable-training
  markdown: '**Normalization** adjusts values using statistics such as their center and spread. **Batch normalization**
    usually calculates these across examples in a training batch, including relevant spatial positions. It
    typically uses stored running estimates during evaluation.


    **Layer normalization** instead calculates statistics across selected features within one example. The
    methods therefore differ in which values influence one another and what state they store. Check the axes
    and training/evaluation mode when tracing the calculation.'
  text_mode: '**Normalization** adjusts values using statistics such as their center and spread. **Batch normalization**
    usually calculates these across examples in a training batch, including relevant spatial positions. It
    typically uses stored running estimates during evaluation.


    **Layer normalization** instead calculates statistics across selected features within one example. The
    methods therefore differ in which values influence one another and what state they store. Check the axes
    and training/evaluation mode when tracing the calculation.'
  bridges: []
- id: stable-training.s4
  title: Inspect finite values and distributions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.stable-training
  markdown: 'Monitor activation ranges, gradient norms, optimizer state, and the first nonfinite operation.
    Lower precision saves resources but can overflow or underflow. Residual paths, sensible initialization,
    clipping, and stable formulas can help. They do not remove the need to verify shapes, targets, and loss
    reductions.


    **Overflow** means a result exceeds the number format''s range. **Underflow** means a very small value
    loses precision or becomes zero. A **nonfinite** result is infinity or “not a number,” often displayed
    as NaN. If the first nonfinite result appears while taking a logarithm of zero, changing the network''s
    size is not the first repair; inspect that operation and the values entering it.'
  text_mode: 'Monitor activation ranges, gradient norms, optimizer state, and the first nonfinite operation.
    Lower precision saves resources but can overflow or underflow. Residual paths, sensible initialization,
    clipping, and stable formulas can help. They do not remove the need to verify shapes, targets, and loss
    reductions.


    **Overflow** means a result exceeds the number format''s range. **Underflow** means a very small value
    loses precision or becomes zero. A **nonfinite** result is infinity or “not a number,” often displayed
    as NaN. If the first nonfinite result appears while taking a logarithm of zero, changing the network''s
    size is not the first repair; inspect that operation and the values entering it.'
