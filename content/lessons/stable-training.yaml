schema_version: 0.2-draft
lesson:
  id: stable-training
  version: 0.3.0-draft
  title: Keep signals and gradients in a usable range
  state: draft
  summary: Stack fifty layers and the signal fades to nothing or explodes into the tens of thousands. See how initialization, normalization, and number formats keep a deep network's numbers usable.
  slot: M10.7
  category: learning
  sources:
    - title: Dive into Deep Learning — authors’ open textbook
      url: https://d2l.ai/
    - title: Deep Learning — numerical computation
      url: https://www.deeplearningbook.org/contents/numerical.html
    - title: Delving Deep into Rectifiers (He et al., 2015)
      url: https://arxiv.org/abs/1502.01852
    - title: Batch Normalization (Ioffe & Szegedy, 2015)
      url: https://arxiv.org/abs/1502.03167
    - title: Layer Normalization (Ba, Kiros & Hinton, 2016)
      url: https://arxiv.org/abs/1607.06450
objectives:
  - id: objective.stable-training
    version: 3-draft
    statement: Initialization, normalization, activation choice, and numerical precision influence signal scale and optimization; stability requires inspecting their interaction rather than relying on one default.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - stable-training.base.v2
      - stable-training.transfer.v2
    prerequisites:
      - anyOf:
          - objective.penalties-and-clipping
      - anyOf:
          - objective.numerical-computing
      - anyOf:
          - objective.neurons
scenes:
  - id: stable-training.s1
    title: Fifty layers of photocopies
    type: explanation
    depth: intuition
    objective_refs:
      - objective.stable-training
    markdown: |-
      Photocopy a photo, then copy the copy, fifty times over. If each copy comes out a little lighter, the last one is blank; a little darker, and it's solid black. A deep network does the same to its numbers: every layer multiplies them by its weights, so a small error in each layer's scale compounds with depth.

      Each layer passes on **activations**, the numbers its units output. During training, gradients travel back through the same layers in reverse. If each layer shrinks its input by a factor of 0.5, then after 10 layers the signal is 0.5¹⁰ ≈ 0.001 of its original size. If each layer doubles it, 10 layers give 2¹⁰ = 1,024. Gradients that shrink to nearly nothing are **vanishing gradients**, and the early layers barely learn. Gradients that blow up are **exploding gradients**, and training breaks.

      Run a 50-layer ReLU network with random weights, drawn at three different scales, and watch the typical activation size every 10 layers:

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      width, depth = 256, 50
      x0 = rng.normal(size=(100, width))          # 100 examples, 256 features each

      for name, var in [("too small (1/n)", 1 / width),
                        ("He (2/n)       ", 2 / width),
                        ("too big (3/n)  ", 3 / width)]:
          x, sizes = x0, []
          for layer in range(1, depth + 1):
              W = rng.normal(0, np.sqrt(var), size=(width, width))
              x = np.maximum(0, x @ W)            # linear layer, then ReLU
              if layer % 10 == 0:
                  sizes.append(f"{np.sqrt(np.mean(x**2)):.1e}")
          print(name, "activation size at layers 10..50:", sizes)
      ```

      With weight variance 1/n, where n is the number of inputs to each unit, the signal fades to about 2 × 10⁻⁸ by layer 50. With 3/n it grows to about 18,000. With 2/n it holds steady near 0.6. The per-layer factors are mild, roughly 0.71 and 1.22, but fifty layers turn them into silence and overflow. Try 2.2/n or 1.8/n to see how narrow the safe band is.
    bridges: []
  - id: stable-training.s2
    title: Pick the starting scale on purpose
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.stable-training
    markdown: |-
      Why 2/n? A unit adds up n inputs, each multiplied by a random weight. Adding n random terms multiplies the variance by n, so weights with variance 1/n cancel that growth. ReLU then zeroes about half its inputs, halving the average squared size, and the extra factor of 2 cancels that.

      A unit's number of inputs is its **fan-in**; the number of units its output feeds is its **fan-out**. Two standard recipes set the starting weights from them:

      :::papers Xavier and He initialization
      Draw each weight at random with mean 0 and variance

      $$\text{Xavier (Glorot \& Bengio, 2010):}\;\; \operatorname{Var}(W) = \frac{2}{n_{\text{in}} + n_{\text{out}}} \qquad \text{He (He et al., 2015):}\;\; \operatorname{Var}(W) = \frac{2}{n_{\text{in}}}$$

      Xavier balances the forward and backward passes for activations like tanh, which are roughly linear near zero. He initialization is built for ReLU, and it's the 2/n setting that held steady above. For our layers with $n_{\text{in}} = 256$, He gives variance 2/256 ≈ 0.0078, a standard deviation of about 0.088.
      :::

      Why random, and not every weight set to 0.088? Two hidden units that start with identical weights compute identical outputs and receive identical gradients, so they stay identical forever, and the layer acts like one unit. Random starting values break that **symmetry**.

      Very deep networks add a second safeguard. A **residual connection**, the key idea in ResNet (He et al., 2015), adds each block's input straight to its output: $x + f(x)$. The gradient then has a path back through the "+ x" that isn't multiplied by the block's weights, a big part of why networks with a hundred or more layers became trainable.

      :::mixup "If early layers' gradients vanish, just raise the learning rate."
      The learning rate scales every layer's step equally. If the first layer's gradient is a million times smaller than the last layer's, any rate big enough to move the first layer blows up the last. Fix the scale where it goes wrong: initialization, normalization, or residual connections.
      :::
  - id: stable-training.s3
    title: Batch norm and layer norm rescale different things
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.stable-training
    markdown: |-
      Good initialization sets the right scale at step 0, but the weights keep changing. **Normalization** layers reset the scale throughout training: subtract the average, divide by the spread, then let the network re-stretch the result with two learned numbers.

      $$y = \gamma\,\frac{x - \mu}{\sqrt{\sigma^2 + \epsilon}} + \beta$$

      Here $\mu$ is the mean, $\sigma^2$ the variance, $\epsilon$ a tiny number that prevents division by zero, and $\gamma$, $\beta$ the learned scale and shift. For one example with features $x = [2, 4, 6, 8]$: $\mu = 5$, $\sigma^2 = (9 + 1 + 1 + 9)/4 = 5$, and the normalized values are $(x - 5)/\sqrt{5} \approx [-1.34, -0.45, 0.45, 1.34]$. Their mean is 0 and their spread is 1, whatever scale they arrived at.

      The two famous variants differ only in *which numbers* go into $\mu$ and $\sigma^2$:

      | | **Batch normalization** (Ioffe & Szegedy, 2015) | **Layer normalization** (Ba, Kiros & Hinton, 2016) |
      | --- | --- | --- |
      | Averages over | One feature, across all examples in the batch | All features, within one example |
      | During evaluation | Uses running averages saved during training | Same calculation as in training |
      | Batch of 1 | Breaks: a single example has no spread | Works fine |
      | Typical home | Convolutional image networks | Transformers and recurrent networks |

      Our [2, 4, 6, 8] calculation was layer norm: four features of one example. Batch norm would instead take feature 1 from every example in the batch and normalize those together.

      :::predict A batch-norm model scores well in training, but gives strange predictions when you evaluate it one example at a time. What's the likely cause?
      It's probably still in training mode, normalizing with statistics from the current batch. With one example, a feature's "batch mean" is its own value, so it normalizes to 0 and its information is gone. Evaluation mode uses the running averages saved during training instead. Forgetting the switch (`model.eval()` in PyTorch) is a classic bug.
      :::
  - id: stable-training.s4
    title: Find the first number that broke
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.stable-training
    markdown: |-
      Computers store numbers in fixed-size formats with limits. **Overflow** is a result too big for the format; it becomes infinity. **Underflow** is a result too close to zero; it becomes exactly 0. Once an infinity appears, operations like ∞ − ∞ or 0 × ∞ produce **NaN** ("not a number"), and NaN spreads through every calculation it touches.

      | Format | Bits | Largest value | Digits of precision | Used for |
      | --- | ---: | --- | --- | --- |
      | float32 | 32 | about 3 × 10³⁸ | about 7 | The safe default |
      | float16 | 16 | 65,504 | about 3 | Fast training, with care |
      | bfloat16 | 16 | about 3 × 10³⁸ | about 2–3 | Fast training with float32's range |

      A 16-bit number takes half the memory of a 32-bit one and computes much faster on modern accelerators, so large models usually train with 16-bit formats. But in float16, $e^{12} \approx 163{,}000$ is already infinity, and a gradient of 10⁻⁸ becomes 0. **Mixed-precision training** keeps a float32 master copy of the weights and multiplies the loss by a large factor before the backward pass (*loss scaling*), so small gradients don't underflow. bfloat16 keeps float32's range and gives up digits instead, which is why many large language models are trained in it.

      When the loss turns into NaN, find the *first* operation that produced a non-finite value, and look at its inputs. Common culprits:

      - log(0) = −∞, from a probability that rounded to exactly 0. Compute log-probabilities directly instead.
      - A softmax of large scores such as 1,000, which overflows. Subtract the largest score first; the result is mathematically identical.
      - Dividing by a variance of 0. That's what the $\epsilon$ in the normalization formula is for.
    bridges: []
  - id: stable-training.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.stable-training
    markdown: Compute He initialization scales for new layers, then diagnose fading signals, a batch-norm evaluation bug, a float16 overflow, and a NaN hunt.
    takeaway: |-
      Check the scale of activations and gradients throughout training. Initialization, normalization, and numerical precision interact; find where the values first become unusable.
  - id: stable-training.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.stable-training
    markdown: |-
      Check the scale of activations and gradients throughout training. Initialization, normalization, and numerical precision interact; find where the values first become unusable.
