assessment_families:
  - id: stable-training.base
    objective_ref: objective.stable-training
    task: base
    response_type: single_choice
    points: 1
    hint: Multiply the per-layer factor by itself once for every layer.
    remediation_scene: stable-training.s2
    variants:
      - id: stable-training.base.1
        retired: true
        prompt: Ten repeated factors of 2 amplify a sensitivity by what?
        options:
          - id: c
            text: '100'
          - id: a
            text: '1024'
          - id: b
            text: '20'
        answer: a
        feedback: The product is 2¹⁰.
      - id: stable-training.base.2
        retired: true
        prompt: Why can identical initialization be problematic for symmetric hidden units?
        options:
          - id: a
            text: They can keep receiving identical updates
          - id: b
            text: It guarantees independent features
          - id: c
            text: It removes every optimization issue
        answer: a
        feedback: Symmetry can prevent units from learning different roles.
  - id: stable-training.transfer
    objective_ref: objective.stable-training
    task: transfer
    response_type: single_choice
    points: 1
    hint: Trace the numbers back to the first place they became too big, too small, or not a number.
    remediation_scene: stable-training.s4
    variants:
      - id: stable-training.transfer.1
        retired: true
        prompt: A batch-normalized model behaves differently after switching to evaluation mode. Is that necessarily a bug?
        options:
          - id: a
            text: No; the statistic convention can change between modes
          - id: b
            text: Yes; modes can never affect outputs
          - id: c
            text: Only if it has one layer
        answer: a
        feedback: Batch normalization commonly uses different statistics in training and evaluation.
      - id: stable-training.transfer.2
        retired: true
        prompt: Loss becomes nonfinite. What is a useful diagnostic target?
        options:
          - id: b
            text: Only the final printed number
          - id: c
            text: A larger output vocabulary immediately
          - id: a
            text: The first invalid intermediate and its inputs
        answer: a
        feedback: Tracing the earliest failure helps identify numerical or modeling causes.
  - id: stable-training.base.v2
    objective_ref: objective.stable-training
    task: base
    response_type: numeric
    points: 1
    absolute_tolerance: 0.001
    hint: He initialization sets the weight variance to 2 ÷ fan-in. The standard deviation is the square root of that variance.
    remediation_scene: stable-training.s2
    variants:
      - id: stable-training.base.v2.1
        prompt: A ReLU layer has 512 inputs per unit. Using He initialization, what standard deviation should its starting weights have?
        answer: 0.0625
        feedback: The variance is 2/512 = 0.00390625, and its square root is 0.0625. Reporting the variance itself instead of its square root would give a scale 16 times too small.
      - id: stable-training.base.v2.2
        prompt: A ReLU layer has 200 inputs per unit. Using He initialization, what standard deviation should its starting weights have?
        answer: 0.1
        feedback: The variance is 2/200 = 0.01, and its square root is 0.1. Using 1/200 (dropping ReLU's factor of 2) gives about 0.071, which makes the signal shrink layer by layer.
      - id: stable-training.base.v2.3
        prompt: A ReLU layer has 50 inputs per unit. Using He initialization, what standard deviation should its starting weights have?
        answer: 0.2
        feedback: The variance is 2/50 = 0.04, and its square root is 0.2. Fewer inputs mean each weight can be larger without the sum growing.
      - id: stable-training.base.v2.4
        prompt: A ReLU layer has 8 inputs per unit. Using He initialization, what standard deviation should its starting weights have?
        answer: 0.5
        feedback: The variance is 2/8 = 0.25, and its square root is 0.5. Stopping at the variance, 0.25, would halve the scale.
  - id: stable-training.transfer.v2
    objective_ref: objective.stable-training
    task: transfer
    response_type: single_choice
    points: 1
    hint: Find where the scale went wrong (the starting weights, the normalization statistics, or the number format), and fix it at that point rather than downstream.
    remediation_scene: stable-training.s4
    variants:
      - id: stable-training.transfer.v2.1
        retired: true
        prompt: In a 40-layer ReLU network, the gradient reaching the first layer is about 10⁻⁹ of the gradient at the last layer. The weights were drawn with variance 1/fan-in. Which change targets the cause?
        options:
          - id: b
            text: Raise the learning rate so the first layers move faster
          - id: a
            text: Switch to He initialization, with variance 2 ÷ fan-in
          - id: c
            text: Clip the gradient norm so the last layers can't dominate
        answer: a
        feedback: Variance 1/n loses about half the squared signal at every ReLU layer, which compounds over 40 layers. He initialization cancels that loss. A higher learning rate would blow up the later layers, and clipping shrinks gradients rather than restoring small ones.
      - id: stable-training.transfer.v2.2
        prompt: A batch-norm image classifier gives sensible results on batches of 64, but nonsense when a web service feeds it one photo at a time. What is the most likely cause?
        options:
          - id: c
            text: Single photos are harder to classify than full batches
          - id: a
            text: It's still normalizing with batch statistics, not saved averages
          - id: b
            text: Batch norm must be replaced by layer norm before any serving
        answer: a
        feedback: In training mode, each photo is normalized with statistics from that one photo instead of the training data, which distorts or wipes out its features. Evaluation mode uses the saved running averages. Layer norm would also avoid this, but it isn't required; the mode switch is the fix.
      - id: stable-training.transfer.v2.3
        prompt: A model trains fine in float32 but its loss becomes infinite within minutes in float16. The first infinity appears inside a softmax whose scores reach about 20. What is the best fix?
        options:
          - id: a
            text: Subtract the largest score before taking exponentials
          - id: b
            text: Lower the learning rate so the scores stay smaller
          - id: c
            text: Add more layers so the network can spread out its scores
        answer: a
        feedback: e²⁰ is about 485 million, far beyond float16's maximum of 65,504. Subtracting the largest score makes the biggest exponential e⁰ = 1 and gives the identical softmax. A smaller learning rate might delay the overflow but wouldn't remove it.
      - id: stable-training.transfer.v2.4
        prompt: A training loss suddenly prints NaN at step 8,000. What should you look at first?
        options:
          - id: c
            text: The final loss value and how it changed over the last steps
          - id: b
            text: The first operation in that step to produce a non-finite value
          - id: a
            text: The model's width, since wider layers are more likely to fail
        answer: b
        feedback: NaN spreads through everything after it, so the final loss only tells you something broke. The first non-finite value, and the inputs to that operation (a log of 0, an overflow, a division by zero), point at the cause.
      - id: stable-training.transfer.v2.5
        prompt: Someone initializes every weight in a hidden layer to exactly 0.05. After training, all 128 units in that layer have identical weights. Why?
        options:
          - id: a
            text: Identical units get identical gradients, so they never diverge
          - id: b
            text: The value 0.05 is too small, so the gradients vanished
          - id: c
            text: The learning rate was too low for the units to separate
        answer: a
        feedback: With equal starting weights, every unit computes the same output and receives the same update, so the symmetry is never broken. Random initialization fixes it. A different constant or learning rate would still keep the units identical.
      - id: stable-training.transfer.v2.6
        prompt: In a 40-layer ReLU network whose weights were drawn with variance 1/fan-in, the gradient reaching the first layer is about a millionth of the gradient at the last layer. Which change targets the cause?
        options:
          - id: b
            text: Raise the learning rate so the first layers move faster
          - id: c
            text: Clip the gradient norm so the last layers can't dominate
          - id: a
            text: Switch to He initialization, with variance 2 ÷ fan-in
        answer: a
        feedback: With variance 1/fan-in, each ReLU layer keeps only about half the squared signal, so the gradient shrinks by about 0.707 per layer; 0.707⁴⁰ is roughly a millionth. He initialization doubles the variance to cancel that loss. A higher learning rate would blow up the later layers, and clipping only shrinks gradients.
