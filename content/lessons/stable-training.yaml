schema_version: 0.2-draft
lesson:
  id: stable-training
  version: 0.1.0-draft
  title: Keep signals and gradients in a usable range
  state: draft
  summary: Initialization, normalization, activation choice, and numerical precision influence signal scale and
    optimization; stability requires inspecting their interaction rather than relying on one default.
  slot: M10.7
  category: learning
  minutes: 12
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: Deep Learning — numerical computation
    url: https://www.deeplearningbook.org/contents/numerical.html
objectives:
- id: objective.stable-training
  version: 1-draft
  statement: Initialization, normalization, activation choice, and numerical precision influence signal scale and
    optimization; stability requires inspecting their interaction rather than relying on one default.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - stable-training.base
  - stable-training.transfer
  prerequisites:
  - anyOf:
    - objective.penalties-and-clipping
  - anyOf:
    - objective.numerical-computing
  - anyOf:
    - objective.neurons
scenes:
- id: stable-training.s1
  title: A network begins from an initial state
  type: explanation
  depth: intuition
  objective_refs:
  - objective.stable-training
  markdown: If every hidden unit starts identically under a symmetric computation, they may receive identical updates
    and fail to diversify. Random initialization breaks some symmetries. Its scale affects how activations and gradients
    grow or shrink through layers. Suitable schemes depend on fan-in, fan-out, and activation behavior.
  text_mode: If every hidden unit starts identically under a symmetric computation, they may receive identical updates
    and fail to diversify. Random initialization breaks some symmetries. Its scale affects how activations and gradients
    grow or shrink through layers. Suitable schemes depend on fan-in, fan-out, and activation behavior.
  bridges: []
- id: stable-training.s2
  title: Watch repeated multiplication
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.stable-training
  markdown: 'A chain that repeatedly multiplies sensitivity by 0.5 shrinks it: after ten factors the multiplier
    is about 0.001. Repeated factors of 2 amplify it to 1024. Real networks are more complex, but this illustrates
    vanishing and exploding gradients. Nonlinear activation derivatives and normalization influence the chain.'
  text_mode: 'A chain that repeatedly multiplies sensitivity by 0.5 shrinks it: after ten factors the multiplier
    is about 0.001. Repeated factors of 2 amplify it to 1024. Real networks are more complex, but this illustrates
    vanishing and exploding gradients. Nonlinear activation derivatives and normalization influence the chain.'
  bridges:
  - numerical-computing
- id: stable-training.s3
  title: Normalize with the right semantics
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.stable-training
  markdown: Batch normalization uses batch-related statistics during training and typically running estimates for
    evaluation. Layer normalization operates across selected features within an example. These differ in axes, state,
    and dependence on batch composition. Switching training and evaluation modes can materially change behavior.
  text_mode: Batch normalization uses batch-related statistics during training and typically running estimates for
    evaluation. Layer normalization operates across selected features within an example. These differ in axes, state,
    and dependence on batch composition. Switching training and evaluation modes can materially change behavior.
  bridges: []
- id: stable-training.s4
  title: Inspect finite values and distributions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.stable-training
  markdown: Monitor activation ranges, gradient norms, optimizer state, and the first nonfinite operation. Lower
    precision saves resources but can overflow or underflow. Residual paths, sensible initialization, clipping,
    and stable formulas can help. They do not remove the need to verify shapes, targets, and loss reductions.
  text_mode: Monitor activation ranges, gradient norms, optimizer state, and the first nonfinite operation. Lower
    precision saves resources but can overflow or underflow. Residual paths, sensible initialization, clipping,
    and stable formulas can help. They do not remove the need to verify shapes, targets, and loss reductions.
  bridges: []
- id: stable-training.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.stable-training
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: stable-training.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.stable-training
  markdown: Initialization, normalization, activation choice, and numerical precision influence signal scale and
    optimization; stability requires inspecting their interaction rather than relying on one default.
  text_mode: Initialization, normalization, activation choice, and numerical precision influence signal scale and
    optimization; stability requires inspecting their interaction rather than relying on one default.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - stable-training.s1
