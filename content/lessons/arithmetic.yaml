  text_mode: Read signed numbers, multiply a weight by an input, and square a prediction error.
- id: arithmetic.s5
  title: Square the difference as one number
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.arithmetic
  markdown: 'To square a number means multiply it by itself: 2 squared is 2 × 2 = 4. We write it as 2². For signed
    multiplication, equal signs give a positive product, so (−2) × (−2) = 4. Parentheses group the whole negative
    number. Squared error uses this rule to turn either a two-too-high or two-too-low miss into 4. It also makes
    a four-unit miss count as 16 rather than 4.'
  text_mode: 'To square a number means multiply it by itself: 2 squared is 2 × 2 = 4. We write it as 2². For signed
    multiplication, equal signs give a positive product, so (−2) × (−2) = 4. Parentheses group the whole negative
    number. Squared error uses this rule to turn either a two-too-high or two-too-low miss into 4. It also makes
    a four-unit miss count as 16 rather than 4.'
  bridges: []
- id: arithmetic.s6
  title: Work the steps in order
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.arithmetic
  markdown: 'Prediction 3 and target 5 give (3 − 5)². First do the subtraction inside parentheses: −2. Then square
    the result: 4. Squaring the two starting values separately would give 3² − 5² = 9 − 25 = −16, a different calculation.
    Try prediction 7 and target 4: the difference is 3, and its square is 9. Write each intermediate answer on a
    separate line so you can locate a mistake without starting again.'
  text_mode: 'Prediction 3 and target 5 give (3 − 5)². First do the subtraction inside parentheses: −2. Then square
    the result: 4. Squaring the two starting values separately would give 3² − 5² = 9 − 25 = −16, a different calculation.
    Try prediction 7 and target 4: the difference is 3, and its square is 9. Write each intermediate answer on a
    separate line so you can locate a mistake without starting again.'
  bridges: []
