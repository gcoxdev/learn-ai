assessment_families:
- id: arithmetic.base
  objective_ref: objective.arithmetic
  task: base
  response_type: single_choice
  points: 1
  hint: Read signed numbers, multiply a weight by an input, and square a prediction error.
  variants:
  - id: arithmetic.base.1
    prompt: What is 0.1 × 20?
    options:
    - id: a
      text: '20'
    - id: b
      text: '0.02'
    - id: correct
      text: '2'
    answer: correct
    feedback: 0.1 is one tenth, so 0.1 × 20 = 2.
  - id: arithmetic.base.2
    prompt: What is 4 − (−2)?
    options:
    - id: b
      text: −6
    - id: correct
      text: '6'
    - id: a
      text: '2'
    answer: correct
    feedback: 'Subtracting a negative adds its magnitude: 4 − (−2) = 6.'
- id: arithmetic.transfer
  objective_ref: objective.arithmetic
  task: transfer
  response_type: single_choice
  points: 1
  hint: Read signed numbers, multiply a weight by an input, and square a prediction error.
  variants:
  - id: arithmetic.transfer.1
    prompt: Prediction is 3 and target is 5. What is squared error?
    options:
    - id: b
      text: −16
    - id: correct
      text: '4'
    - id: a
      text: −2
    answer: correct
    feedback: The difference is 3 − 5 = −2. Squaring gives (−2)² = 4.
  - id: arithmetic.transfer.2
    prompt: Prediction is 7 and target is 4. What is squared error?
    options:
    - id: correct
      text: '9'
    - id: a
      text: '3'
    - id: b
      text: '33'
    answer: correct
    feedback: The difference is 7 − 4 = 3. Squaring gives 3² = 9.
