schema_version: 0.2-draft
lesson:
  id: arithmetic
  version: 0.3.0-draft
  title: The numbers you actually need
  state: draft
  summary: A café's model said bake 3 muffins, and 5 sold. Refresh the few arithmetic moves (multiply, decimals, minus signs, squares) that turn that miss into a training signal.
  slot: B01
  category: bridge
  sources:
    - title: OpenStax — real numbers and algebraic expressions
      url: https://openstax.org/books/elementary-algebra-2e/pages/1-introduction
  archetype: foundation
objectives:
  - id: objective.arithmetic
    version: 3-draft
    statement: Multiply a weight by an input, work with decimals and negative numbers, and compute a squared error in the right order.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - arithmetic.base.v3
      - arithmetic.transfer.v3
    prerequisites: []
scenes:
  - id: arithmetic.s1
    title: A muffin model runs on four moves
    type: explanation
    depth: intuition
    objective_refs:
      - objective.arithmetic
    markdown: |-
      A café's tiny model says: bake 2 muffins for every booked table. Tonight 3 tables are booked. How many muffins?

      **Why AI needs this:** every model, from this one to chat assistants with billions of weights, spends nearly all its time multiplying, adding, subtracting, and squaring.

      Multiplication counts equal groups: 3 tables with 2 muffins each is 3 × 2 = 6. The 2 is the model's **weight** (the number that multiplies the input), 3 is the input, and 6 is the prediction.

      | Symbol | Read it as | Example |
      | --- | --- | --- |
      | × or `*` | times (`*` is how code writes it) | 3 × 2 = 6 |
      | ÷ or `/` | divided by | 6 / 2 = 3 |
      | = | has the same value as | 3 × 2 = 6 |
      | − | minus; in front of a number, "negative" | 3 − 5 = −2 |
      | ² | squared: the number times itself (code writes `**2`) | 4² = 4 × 4 = 16 |
      | ( ) | work this part out first | (3 − 5)² = 4 |
    bridges: []
  - id: arithmetic.s2
    title: A fraction names part of a whole
    type: explanation
    depth: intuition
    objective_refs:
      - objective.arithmetic
    markdown: |-
      Half of the 6 muffins should be blueberry. A **fraction** such as 1/2 names part of a whole: the bottom number says how many equal parts to cut it into, and the top says how many parts you take. So 1/2 × 6 = 3.

      One more: 3/4 of 8. Cut 8 into 4 parts of 2, then take 3 of them: 3 × 2 = 6.
    bridges: []
  - id: arithmetic.s3
    title: Multiplying by 0.1 makes a step smaller
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.arithmetic
    markdown: |-
      A **decimal** is another way to write a fraction: the first digit after the point counts tenths, so 0.5 is one half and 0.1 is one tenth.

      Training changes a weight in small steps. If the arithmetic suggests a change of 20, training first multiplies it by a small number called the **learning rate**, such as 0.1:

      - 0.1 × 20 = 2 (one tenth of 20)
      - 0.25 × 8 = 2 (a quarter of 8)
      - 0.1 × (−24) = −2.4 (smaller, but the minus sign stays, so it points the same way)

      :::mixup "Multiplying always makes a number bigger."
      Only when you multiply by something larger than 1. Multiplying by a number between 0 and 1 takes *part* of the original, so a small learning rate makes small steps.
      :::
    bridges: []
  - id: arithmetic.s4
    title: A minus sign tells you which way you missed
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.arithmetic
    markdown: |-
      On a number line, numbers left of zero are **negative**, written with a minus sign. To work out 3 − 5, start at 3 and step 5 places left: you land on −2.

      On Monday the model predicted 3 blueberry muffins and the café sold 5. The **error** is prediction minus target (the true answer): 3 − 5 = −2. The minus sign says the guess was 2 *too low*; a positive error means too high.

      Subtracting a negative moves you right: 4 − (−2) = 4 + 2 = 6, like cancelling a debt of 2.

      :::predict On Tuesday the model predicts 9 and the café sells 6. What is prediction − target, and what does its sign tell you?
      9 − 6 = +3: the model guessed 3 too high. Target − prediction would give −3, so always say which order you used.
      :::
    bridges: []
  - id: arithmetic.s5
    title: Square the whole miss
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.arithmetic
    markdown: |-
      To **square** a number, multiply it by itself: 2² = 2 × 2 = 4. A negative times a negative is positive, so (−2)² = (−2) × (−2) = 4 too.

      Training squares each error to get the **squared error**. Now misses in either direction cost the same (2 too low and 2 too high both cost 4), and big misses cost far more: a miss of 4 costs 16.

      :::predict Which costs more in squared error: two small misses of 1 each, or one miss of 2?
      Two misses of 1 cost 1 + 1 = 2. One miss of 2 costs 2² = 4. Squaring pushes a model hardest to avoid large mistakes.
      :::

      Keep the parentheses when you square a negative number. Written without them, −2² means −(2²) = −4, and Python's `-2**2` also gives −4. Write (−2)², or `(-2)**2` in code.
    bridges: []
  - id: arithmetic.s6
    title: Work the steps in order
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.arithmetic
    markdown: |-
      Work in this order: parentheses, then squares, then × and ÷, then + and −. So 2 × 4 + 3 = 11, while 2 × (4 + 3) = 14. Three worked examples, each a little harder:

      1. **One miss.** Prediction 3, target 5: (3 − 5)² = (−2)² = 4.
      2. **Model first.** Weight 1.5, input 4 tables, target 5 sold. Prediction = 1.5 × 4 = 6. Error = 6 − 5 = 1. Squared error = 1² = 1.
      3. **Several evenings.** Errors of −2, 1, and 1 give squared errors 4, 1, and 1, with average (4 + 1 + 1) ÷ 3 = 2. This average is the **mean squared error**, the number training tries to push down.

      :::mixup "(3 − 5)² is the same as 3² − 5²."
      Squaring separately gives 9 − 25 = −16, a negative "squared" error. Subtract inside the parentheses first (−2), then square: 4.
      :::

      Press Run, then change `weight` to 2 and run again. Which evening's miss grows most?

      ```python run
      weight = 1.5                 # muffins per booked table
      tables = [2, 4, 6]           # input: tables booked on three evenings
      sold   = [5, 5, 8]           # target: muffins actually sold

      total = 0
      for x, y in zip(tables, sold):
          prediction = weight * x
          error = prediction - y
          squared = error ** 2
          total = total + squared
          print(f"{x} tables: predict {prediction}, sold {y}, error {error}, squared {squared}")

      print("average squared error:", total / len(tables))
      ```

      With weight 2 the average jumps from 2.0 to about 8.67, mostly because the 6-table evening now misses by 4, costing 16. In the lesson "How does a model improve a prediction?" training adjusts the weight to shrink exactly this number.
    bridges: []
  - id: arithmetic.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.arithmetic
    markdown: Evaluate short expressions with decimals and minus signs, then score new predictions (a thermostat, a bus arrival, a price guess) with squared error.
    takeaway: |-
      A model's arithmetic is mostly multiply, subtract, and square. Keep the minus sign when you subtract, and square the whole difference, not the two numbers separately.
  - id: arithmetic.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.arithmetic
    markdown: Read signed numbers, multiply a weight by an input, and square a prediction error.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - arithmetic.s1
        - arithmetic.s2
        - arithmetic.s3
        - arithmetic.s4
        - arithmetic.s5
        - arithmetic.s6
        - arithmetic.check
      gate_refs:
