scenes:
- id: arithmetic.s1
  title: Equal groups before symbols
  type: explanation
  depth: intuition
  objective_refs:
  - objective.arithmetic
  markdown: 'Place two counters in each of three piles. There are six counters. Multiplication is a short way to
    count equal groups: 3 × 2 = 6. The symbol × means multiply, and = says the two sides have the same value. You
    may also see 3*2 in computer code. That means the same multiplication. Start with counters or a drawing if the
    symbols feel unfamiliar; the symbols are labels for the operation you just did.'
  text_mode: 'Place two counters in each of three piles. There are six counters. Multiplication is a short way to
    count equal groups: 3 × 2 = 6. The symbol × means multiply, and = says the two sides have the same value. You
    may also see 3*2 in computer code. That means the same multiplication. Start with counters or a drawing if the
    symbols feel unfamiliar; the symbols are labels for the operation you just did.'
  bridges: []
- id: arithmetic.s2
  title: A fraction names part of a whole
  type: explanation
  depth: intuition
  objective_refs:
  - objective.arithmetic
  markdown: Cut a sandwich into four equal pieces. One piece is one quarter, written 1/4. Two pieces are 2/4, the
    same amount as one half, 1/2. The number below the line says how many equal pieces make a whole; the number
    above says how many pieces we take. Half of six counters is three. You can write that as 1/2 × 6 = 3. It is
    still a multiplication, but now we take part of a group.
  text_mode: Cut a sandwich into four equal pieces. One piece is one quarter, written 1/4. Two pieces are 2/4, the
    same amount as one half, 1/2. The number below the line says how many equal pieces make a whole; the number
    above says how many pieces we take. Half of six counters is three. You can write that as 1/2 × 6 = 3. It is
    still a multiplication, but now we take part of a group.
  bridges: []
- id: arithmetic.s3
  title: Decimals are another way to write parts
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.arithmetic
  markdown: 'The decimal 0.5 means five tenths, the same amount as one half. The decimal 0.1 means one tenth. Picture
    ten equal cups holding one full jug; one cup is 0.1 jug. Thus 0.1 × 20 = 2, because one tenth of twenty is two.
    Read the decimal point carefully: 0.1 is smaller than 1. These scale factors will later make a model adjustment
    smaller without changing the direction of the adjustment.'
  text_mode: 'The decimal 0.5 means five tenths, the same amount as one half. The decimal 0.1 means one tenth. Picture
    ten equal cups holding one full jug; one cup is 0.1 jug. Thus 0.1 × 20 = 2, because one tenth of twenty is two.
    Read the decimal point carefully: 0.1 is smaller than 1. These scale factors will later make a model adjustment
    smaller without changing the direction of the adjustment.'
  bridges: []
- id: arithmetic.s4
  title: A minus sign can tell a direction
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.arithmetic
  markdown: On a number line, positive numbers lie to the right of zero and negative numbers to the left. To calculate
    3 − 5, begin at three and move five steps left. You arrive at −2. That minus sign tells us the first quantity
    was two below the second. If a model predicts 3 and the observed answer is 5, prediction minus target is −2.
    Reversing the subtraction gives +2, so state which convention you are using.
  text_mode: On a number line, positive numbers lie to the right of zero and negative numbers to the left. To calculate
    3 − 5, begin at three and move five steps left. You arrive at −2. That minus sign tells us the first quantity
    was two below the second. If a model predicts 3 and the observed answer is 5, prediction minus target is −2.
    Reversing the subtraction gives +2, so state which convention you are using.
  bridges: []
- id: arithmetic.check
  title: Review and check your understanding
  type: assessment
