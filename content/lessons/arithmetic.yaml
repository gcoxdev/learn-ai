scenes:
- id: arithmetic.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.arithmetic
  text_mode: The complete explanation is available as readable text.
  title: Numbers are descriptions
  markdown: 'A positive number can mean a position to the right of zero; a negative one a position to the left.
    The meaning depends on the quantity.


    Subtracting 6 from 4 gives −2. Subtracting −2 from 4 gives 6: subtracting a negative moves upward on the
    number line.'
- id: arithmetic.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.arithmetic
  text_mode: The complete explanation is available as readable text.
  title: Small parts of a number
  markdown: 'A decimal such as 0.1 is one tenth. Multiplying 0.1 by 24 gives 2.4. Multiplying 2.4 by 2 gives
    4.8.


    A learning rate often appears as a decimal because it scales the size of an update.'
- id: arithmetic.s3
  type: explanation
  depth: intuition
  objective_refs:
  - objective.arithmetic
  text_mode: The complete explanation is available as readable text.
  title: Squaring a difference
  markdown: 'To square a number, multiply it by itself. If prediction is 4 and target is 6, the difference
    is −2 and squared error is (−2) × (−2) = 4.


    The square removes the sign and makes larger distances count more. A loss function is a choice about how
    to measure error.'
- id: arithmetic.s4
  type: explanation
  depth: intuition
  objective_refs:
  - objective.arithmetic
  text_mode: The complete explanation is available as readable text.
  title: Try one full calculation
  markdown: 'With prediction 3 and target 5, first calculate 3 − 5 = −2. Then square: (−2)² = 4.


    Do not square prediction and target separately and subtract. That would be a different expression.'
