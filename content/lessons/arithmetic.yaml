assessment_families:
  - id: arithmetic.base
    objective_ref: objective.arithmetic
    task: base
    response_type: single_choice
    points: 1
    hint: Read signed numbers, multiply a weight by an input, and square a prediction error.
    variants:
      - id: arithmetic.base.1
        prompt: What is 0.1 × 20?
        options:
          - id: a
            text: '20'
          - id: b
            text: '0.02'
          - id: correct
            text: '2'
        answer: correct
        feedback: 0.1 is one tenth, so 0.1 × 20 = 2.
        retired: true
      - id: arithmetic.base.2
        prompt: What is 4 − (−2)?
        options:
          - id: b
            text: −6
          - id: correct
            text: '6'
          - id: a
            text: '2'
        answer: correct
        feedback: 'Subtracting a negative adds its magnitude: 4 − (−2) = 6.'
        retired: true
  - id: arithmetic.transfer
    objective_ref: objective.arithmetic
    task: transfer
    response_type: single_choice
    points: 1
    hint: Read signed numbers, multiply a weight by an input, and square a prediction error.
    variants:
      - id: arithmetic.transfer.1
        prompt: Prediction is 3 and target is 5. What is squared error?
        options:
          - id: b
            text: −16
          - id: correct
            text: '4'
          - id: a
            text: −2
        answer: correct
        feedback: The difference is 3 − 5 = −2. Squaring gives (−2)² = 4.
        retired: true
      - id: arithmetic.transfer.2
        prompt: Prediction is 7 and target is 4. What is squared error?
        options:
          - id: correct
            text: '9'
          - id: a
            text: '3'
          - id: b
            text: '33'
        answer: correct
        feedback: The difference is 7 − 4 = 3. Squaring gives 3² = 9.
        retired: true
  - id: arithmetic.base.v2
    objective_ref: objective.arithmetic
    task: base
    response_type: numeric
    points: 1
    hint: Do the multiplication before the addition or subtraction, and keep any minus sign you get.
    remediation_scene: arithmetic.s3
    variants:
      - id: arithmetic.base.v2.1
        prompt: Calculate 4 × 3.
        answer: 12
        feedback: Four groups of three contain twelve.
        retired: true
      - id: arithmetic.base.v2.2
        prompt: Calculate 0.5 × 8.
        answer: 4
        feedback: One half of eight is four.
        retired: true
      - id: arithmetic.base.v2.3
        prompt: Calculate 5 − 9, keeping the sign.
        answer: -4
        feedback: Five is four below nine, giving −4.
        retired: true
      - id: arithmetic.base.v2.4
        prompt: Calculate 0.1 × 30.
        answer: 3
        feedback: One tenth of thirty is three.
        retired: true
    absolute_tolerance: 1e-6
  - id: arithmetic.transfer.v2
    objective_ref: objective.arithmetic
    task: transfer
    response_type: numeric
    points: 1
    hint: Subtract inside the parentheses first, then square that one result.
    remediation_scene: arithmetic.s3
    variants:
      - id: arithmetic.transfer.v2.1
        prompt: Prediction is 2 and target is 5. Calculate (prediction − target)².
        answer: 9
        feedback: 'Subtract first: 2−5=−3, then square to get 9.'
        retired: true
      - id: arithmetic.transfer.v2.2
        prompt: Prediction is 8 and target is 6. Calculate their squared error.
        answer: 4
        feedback: The signed difference is 2; its square is 4.
        retired: true
      - id: arithmetic.transfer.v2.3
        prompt: Prediction is 1 and target is 5. Calculate their squared error.
        answer: 16
        feedback: The difference is −4, whose square is 16.
        retired: true
      - id: arithmetic.transfer.v2.4
        prompt: Prediction is 7 and target is 4. Calculate their squared error.
        answer: 9
        feedback: The difference is 3, whose square is 9.
        retired: true
    absolute_tolerance: 1e-6
  - id: arithmetic.base.v3
    objective_ref: objective.arithmetic
    task: base
    response_type: numeric
    points: 1
    hint: Multiply before you add or subtract, keep the minus sign, and remember that multiplying by a decimal below 1 takes part of the number.
    remediation_scene: arithmetic.s6
    absolute_tolerance: 1e-6
    variants:
      - id: arithmetic.base.v3.1
        prompt: A model uses prediction = 2 × input + 3. Calculate the prediction for an input of 4.
        answer: 11
        feedback: Multiply first, 2 × 4 = 8, then add 3 to get 11. Adding first, 2 × (4 + 3), would give 14, which is a different calculation.
      - id: arithmetic.base.v3.2
        prompt: Calculate 0.5 × 12 − 2.
        answer: 4
        feedback: Half of 12 is 6, and 6 − 2 = 4. Subtracting first, 0.5 × 10, gives 5, which breaks the multiply-first order.
      - id: arithmetic.base.v3.3
        prompt: Calculate 3 − 8 + 1, keeping any minus sign.
        answer: -4
        feedback: Start at 3 and step 8 left to reach −5, then 1 right to reach −4. Dropping the sign after the first step gives 6, which loses the direction.
      - id: arithmetic.base.v3.4
        prompt: Calculate 4 − (−2) + 1.
        answer: 7
        feedback: Subtracting −2 is the same as adding 2, so 4 + 2 + 1 = 7. Treating it as 4 − 2 + 1 gives 3.
      - id: arithmetic.base.v3.5
        prompt: A learning rate of 0.1 scales a suggested change of −20, and the result is added to a weight of 5. Calculate 5 + 0.1 × (−20).
        answer: 3
        feedback: 0.1 × (−20) = −2, a smaller step in the same direction, and 5 + (−2) = 3. Adding before multiplying would give 0.1 × (−15) = −1.5.
      - id: arithmetic.base.v3.6
        prompt: Calculate 10 − 0.25 × 8.
        answer: 8
        feedback: A quarter of 8 is 2, and 10 − 2 = 8. Working left to right, (10 − 0.25) × 8, gives 78, which ignores multiply-first.
  - id: arithmetic.transfer.v3
    objective_ref: objective.arithmetic
    task: transfer
    response_type: numeric
    points: 1
    hint: 'Find the prediction first if you need to, then compute error = prediction − target, then square that one number: (prediction − target)².'
    remediation_scene: arithmetic.s5
    absolute_tolerance: 1e-6
    variants:
      - id: arithmetic.transfer.v3.1
        prompt: A smart thermostat predicted the room would be 21 degrees. It was actually 18. What is the squared error?
        answer: 9
        feedback: The error is 21 − 18 = 3, and 3² = 9. Squaring each number first, 441 − 324, gives 117, which isn't the squared error.
      - id: arithmetic.transfer.v3.2
        prompt: A transit app predicted a bus in 25 minutes. It arrived in 30. What is the squared error, in squared minutes?
        answer: 25
        feedback: The error is 25 − 30 = −5 (the guess was 5 minutes too low), and (−5)² = 25. The minus sign disappears when you square, so guessing 5 minutes too low costs the same as 5 minutes too high.
      - id: arithmetic.transfer.v3.3
        prompt: A bakery's model predicted 40 loaves would sell. 36 sold. What is the squared error?
        answer: 16
        feedback: The error is 40 − 36 = 4, and 4² = 16. Stopping at the error (4) forgets the squaring step.
      - id: arithmetic.transfer.v3.4
        prompt: A price model guessed 12 dollars for a used book that sold for 9.5 dollars. What is the squared error?
        answer: 6.25
        feedback: The error is 12 − 9.5 = 2.5, and 2.5 × 2.5 = 6.25. Doubling 2.5 instead of squaring it gives 5.
      - id: arithmetic.transfer.v3.5
        prompt: A reading model predicts minutes = 1.5 × pages. A 4-page article actually took 7 minutes. What is the squared error?
        answer: 1
        feedback: The prediction is 1.5 × 4 = 6 minutes, the error is 6 − 7 = −1, and (−1)² = 1. Squaring gives a positive cost even though the guess was too low.
      - id: arithmetic.transfer.v3.6
        prompt: A plant model predicts cups of water = 3 × days since watering. After 2 days the plant actually needed 3 cups. What is the squared error?
        answer: 9
        feedback: The prediction is 3 × 2 = 6 cups, the error is 6 − 3 = 3, and 3² = 9. Forgetting to multiply by the weight gives (2 − 3)² = 1, which scores the input instead of the prediction.
