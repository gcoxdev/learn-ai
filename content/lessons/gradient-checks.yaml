schema_version: 0.2-draft
lesson:
  id: gradient-checks
  version: 0.1.0-draft
  title: Check a derivative against a small change
  state: draft
  summary: Finite differences approximate local sensitivity and can check analytic or automatic gradients, with
    tradeoffs from step size, rounding, and nondifferentiable points.
  slot: M10.2
  category: learning
  minutes: 12
  sources:
  - title: Deep Learning — numerical computation
    url: https://www.deeplearningbook.org/contents/numerical.html
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.gradient-checks
  version: 1-draft
  statement: Finite differences approximate local sensitivity and can check analytic or automatic gradients, with
    tradeoffs from step size, rounding, and nondifferentiable points.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - gradient-checks.base
  - gradient-checks.transfer
  prerequisites:
  - anyOf:
    - objective.derivatives
  - anyOf:
    - objective.numerical-computing
  - anyOf:
    - objective.loss-meaning
scenes:
- id: gradient-checks.s1
  title: A derivative predicts a local change
  type: explanation
  depth: intuition
  objective_refs:
  - objective.gradient-checks
  markdown: 'A derivative says how a scalar output responds to a small input change near a point. For a loss with
    many parameters, each partial derivative holds the other parameters fixed. The resulting gradient is local:
    a large step can leave the region where its linear prediction is accurate.'
  text_mode: 'A derivative says how a scalar output responds to a small input change near a point. For a loss with
    many parameters, each partial derivative holds the other parameters fixed. The resulting gradient is local:
    a large step can leave the region where its linear prediction is accurate.'
  bridges: []
- id: gradient-checks.s2
  title: Use two nearby evaluations
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.gradient-checks
  markdown: A central finite difference estimates the derivative using [L(w + h) − L(w − h)] divided by 2h. For
    L(w) = w², w = 3, and h = 0.1, use (9.61 − 8.41)/0.2 = 6. This agrees with the analytic derivative 2w = 6.
  text_mode: A central finite difference estimates the derivative using [L(w + h) − L(w − h)] divided by 2h. For
    L(w) = w², w = 3, and h = 0.1, use (9.61 − 8.41)/0.2 = 6. This agrees with the analytic derivative 2w = 6.
  bridges:
  - derivatives
  - numerical-computing
- id: gradient-checks.s3
  title: Choose the step carefully
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.gradient-checks
  markdown: A very large h averages behavior over too wide a region. A very small h can suffer cancellation and
    rounding because nearly equal computed losses are subtracted. Try a range of sensible scales and compare relative
    as well as absolute error. A nondifferentiable point may not have one unique derivative to match.
  text_mode: A very large h averages behavior over too wide a region. A very small h can suffer cancellation and
    rounding because nearly equal computed losses are subtracted. Try a range of sensible scales and compare relative
    as well as absolute error. A nondifferentiable point may not have one unique derivative to match.
  bridges: []
- id: gradient-checks.s4
  title: Make the check diagnostic
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.gradient-checks
  markdown: Use a tiny deterministic example with dropout or stochastic sampling controlled. Check selected coordinates
    or directions when the model is large. A mismatch can reveal a formula error, a detached computation, wrong
    reduction, or numerical issue. Agreement on a few cases is evidence for those cases, not proof of every gradient
    path.
  text_mode: Use a tiny deterministic example with dropout or stochastic sampling controlled. Check selected coordinates
    or directions when the model is large. A mismatch can reveal a formula error, a detached computation, wrong
    reduction, or numerical issue. Agreement on a few cases is evidence for those cases, not proof of every gradient
    path.
  bridges: []
- id: gradient-checks.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.gradient-checks
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Finite differences approximate local sensitivity and can check analytic or automatic gradients, with
    tradeoffs from step size, rounding, and nondifferentiable points.
- id: gradient-checks.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.gradient-checks
  markdown: Finite differences approximate local sensitivity and can check analytic or automatic gradients, with
    tradeoffs from step size, rounding, and nondifferentiable points.
  text_mode: Finite differences approximate local sensitivity and can check analytic or automatic gradients, with
    tradeoffs from step size, rounding, and nondifferentiable points.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - gradient-checks.s1
    - gradient-checks.s2
    - gradient-checks.s3
    - gradient-checks.s4
    - gradient-checks.check
    gate_refs:
    - gate.core
  scene_aliases:
    gradient-checks.recap: gradient-checks.check
assessment_families:
- id: gradient-checks.base
  objective_ref: objective.gradient-checks
  task: base
  response_type: single_choice
  points: 1
  hint: 'Use two nearby evaluations: trace the inputs, operation, and result before choosing.'
  remediation_scene: gradient-checks.s2
  variants:
  - id: gradient-checks.base.1
    prompt: For L(w) = w² at w = 2, what is the analytic derivative?
    options:
    - id: c
      text: '8'
    - id: a
      text: '4'
    - id: b
      text: '2'
    answer: a
    feedback: The derivative is 2w.
  - id: gradient-checks.base.2
    prompt: A central difference divides L(w+h) − L(w−h) by what?
    options:
    - id: a
      text: 2h
    - id: b
      text: h²
    - id: c
      text: w
    answer: a
    feedback: The two evaluations are separated by 2h.
- id: gradient-checks.transfer
  objective_ref: objective.gradient-checks
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Make the check diagnostic: trace the inputs, operation, and result before choosing.'
  remediation_scene: gradient-checks.s4
  variants:
  - id: gradient-checks.transfer.1
    prompt: Making h extremely tiny makes a numerical check worse. What is a plausible cause?
    options:
    - id: a
      text: Cancellation and floating-point rounding
    - id: b
      text: A proof derivatives do not exist anywhere
    - id: c
      text: A necessary increase in model capacity
    answer: a
    feedback: Subtraction of nearly equal approximate values can lose significant precision.
  - id: gradient-checks.transfer.2
    prompt: Dropout changes masks between the two loss evaluations. What should a gradient check control?
    options:
    - id: b
      text: Only the file extension
    - id: c
      text: The order of the answer options
    - id: a
      text: Randomness so the same function is being compared
    answer: a
    feedback: Finite differences should compare controlled evaluations of the intended function.
