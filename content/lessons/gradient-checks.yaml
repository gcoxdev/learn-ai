schema_version: 0.2-draft
lesson:
  id: gradient-checks
  version: 0.3.0-draft
  title: Check a derivative against a small change
  state: draft
  summary: Check a calculated slope by nudging a weight in both directions and comparing the two losses.
  slot: M10.2
  category: learning
  sources:
  - title: Deep Learning — numerical computation
    url: https://www.deeplearningbook.org/contents/numerical.html
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.gradient-checks
  version: 1-draft
  statement: Finite differences approximate local sensitivity and can check analytic or automatic gradients,
    with tradeoffs from step size, rounding, and nondifferentiable points.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - gradient-checks.base
  - gradient-checks.transfer
  prerequisites:
  - anyOf:
    - objective.derivatives
  - anyOf:
    - objective.numerical-computing
  - anyOf:
    - objective.loss-meaning
scenes:
- id: gradient-checks.s1
  title: A derivative predicts a local change
  type: explanation
  depth: intuition
  objective_refs:
  - objective.gradient-checks
  markdown: 'A derivative says how a scalar output responds to a small input change near a point. For a loss
    with many parameters, each partial derivative holds the other parameters fixed. The resulting gradient
    is local: a large step can leave the region where its linear prediction is accurate.'
  text_mode: 'A derivative says how a scalar output responds to a small input change near a point. For a loss
    with many parameters, each partial derivative holds the other parameters fixed. The resulting gradient
    is local: a large step can leave the region where its linear prediction is accurate.'
  bridges: []
- id: gradient-checks.s2
  title: Compare the losses on either side
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.gradient-checks
  markdown: 'Let L be the loss, w the weight, and h a small change. Evaluate the loss at w + h and w − h, then
    divide their difference by the weight gap, 2h. This is a **central finite-difference** estimate of the
    derivative.


    For L(w) = w², choose w = 3 and h = 0.1. The test weights are 3.1 and 2.9, with losses 9.61 and 8.41. The
    slope estimate is (9.61 − 8.41) / 0.2 = 6.


    The **analytic derivative**, obtained from a formula, is 2w and also gives 6. We have checked it by running
    the loss calculation at two nearby values.'
  text_mode: 'Let L be the loss, w the weight, and h a small change. Evaluate the loss at w + h and w − h,
    then divide their difference by the weight gap, 2h. This is a **central finite-difference** estimate of
    the derivative.


    For L(w) = w², choose w = 3 and h = 0.1. The test weights are 3.1 and 2.9, with losses 9.61 and 8.41. The
    slope estimate is (9.61 − 8.41) / 0.2 = 6.


    The **analytic derivative**, obtained from a formula, is 2w and also gives 6. We have checked it by running
    the loss calculation at two nearby values.'
  bridges:
  - derivatives
  - numerical-computing
- id: gradient-checks.s3
  title: Choose the step carefully
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.gradient-checks
  markdown: A very large h averages behavior over too wide a region. A very small h can suffer cancellation
    and rounding because nearly equal computed losses are subtracted. Try a range of sensible scales and compare
    relative as well as absolute error. A nondifferentiable point may not have one unique derivative to match.
  text_mode: A very large h averages behavior over too wide a region. A very small h can suffer cancellation
    and rounding because nearly equal computed losses are subtracted. Try a range of sensible scales and compare
    relative as well as absolute error. A nondifferentiable point may not have one unique derivative to match.
  bridges: []
- id: gradient-checks.s4
  title: Use a mismatch to find the problem
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.gradient-checks
  markdown: 'Start with a small repeatable example and control any random sampling or dropout. Compare the
    numerical estimate with an analytic derivative or with **automatic differentiation**, which applies derivative
    rules through the recorded computation.


    Check the whole loss calculation. A **reduction** combines losses by, for example, summing or averaging
    them. If one version sums ten examples and another averages them, their gradients differ by a factor of
    ten even when the local derivatives are right.


    For large models, check selected coordinates or directions. A mismatch can reveal a broken connection,
    formula error, or numerical problem. Agreement supports the cases tested without proving every possible
    calculation correct.'
  text_mode: 'Start with a small repeatable example and control any random sampling or dropout. Compare the
    numerical estimate with an analytic derivative or with **automatic differentiation**, which applies derivative
    rules through the recorded computation.


    Check the whole loss calculation. A **reduction** combines losses by, for example, summing or averaging
    them. If one version sums ten examples and another averages them, their gradients differ by a factor of
    ten even when the local derivatives are right.


    For large models, check selected coordinates or directions. A mismatch can reveal a broken connection,
    formula error, or numerical problem. Agreement supports the cases tested without proving every possible
    calculation correct.'
  bridges: []
- id: gradient-checks.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.gradient-checks
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Nudge a weight in both directions and compare the losses. This numerical slope can catch derivative
    errors, provided the nudge is neither too large nor too small.
- id: gradient-checks.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.gradient-checks
  markdown: Nudge a weight in both directions and compare the losses. This numerical slope can catch derivative
    errors, provided the nudge is neither too large nor too small.
  text_mode: Nudge a weight in both directions and compare the losses. This numerical slope can catch derivative
    errors, provided the nudge is neither too large nor too small.
navigation:
