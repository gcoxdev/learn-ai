schema_version: 0.2-draft
lesson:
  id: gradient-checks
  version: 0.3.0-draft
  title: Check a derivative against a small change
  state: draft
  summary: Your model trains, nothing crashes, and the loss still won't fall. Learn the ten-line test that catches a wrong gradient before it wastes a week.
  slot: M10.2
  category: learning
  sources:
    - title: Deep Learning — numerical computation
      url: https://www.deeplearningbook.org/contents/numerical.html
    - title: Dive into Deep Learning — authors’ open textbook
      url: https://d2l.ai/
objectives:
  - id: objective.gradient-checks
    version: 2-draft
    statement: Finite differences approximate local sensitivity and can check analytic or automatic gradients, with tradeoffs from step size, rounding, and nondifferentiable points.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - gradient-checks.base.v2
      - gradient-checks.transfer.v2
    prerequisites:
      - anyOf:
          - objective.derivatives
      - anyOf:
          - objective.numerical-computing
      - anyOf:
          - objective.loss-meaning
scenes:
  - id: gradient-checks.s1
    title: A gradient is a prediction you can test
    type: explanation
    depth: intuition
    objective_refs:
      - objective.gradient-checks
    markdown: |-
      You add a delivery fee to the bakery model from the last lesson and write out its gradient by hand. Training runs. Nothing crashes. The loss falls a little, then stalls far above zero. Is the model too simple, is the learning rate wrong, or did you make a mistake in the gradient? A single wrong factor in a formula produces no error message. It just quietly sends every update in a slightly wrong direction.

      Luckily, a gradient makes a claim you can test. If dL/dw = 6 at some weight, it predicts that nudging the weight up by 0.01 raises the loss by about 6 × 0.01 = 0.06. So nudge it and see. You don't need to trust your algebra; you only need to be able to compute the loss.

      A model with many weights has one slope per weight, called a **partial derivative**: how the loss changes when *that* weight moves and every other weight stays put. To test the slope for one weight, nudge only that weight.
  - id: gradient-checks.s2
    title: Nudge both ways and compare
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.gradient-checks
    markdown: |-
      Take a loss L(w) = w² at w = 3, and a small nudge h = 0.1. Evaluate the loss on either side:

      | Weight | Loss |
      | --- | ---: |
      | w + h = 3.1 | 9.61 |
      | w = 3 | 9.00 |
      | w − h = 2.9 | 8.41 |

      The rise over the run is (9.61 − 8.41) / 0.2 = **6**. This is a **central finite difference**: the loss difference across a gap of 2h, divided by 2h. The **analytic derivative**, the one you get from a formula, is 2w = 6. They match, so the formula passes.

      :::predict What if you only nudge one way, and compute (L(w + h) − L(w)) / h?
      You get (9.61 − 9.00) / 0.1 = 6.1, which is off by 0.1. This one-sided version is called a **forward difference**, and its error shrinks in step with h. The central version cancels the leading error term, so its error shrinks with h², which is why it's the standard choice. (For a pure quadratic like w² the central difference is exact, as you just saw.)
      :::

      :::papers The gradient check in standard notation
      For weight $i$, nudge only that coordinate ($e_i$ is 1 in position $i$ and 0 elsewhere):

      $$\frac{\partial L}{\partial w_i} \approx \frac{L(w + h e_i) - L(w - h e_i)}{2h}$$

      Then compare your analytic value $g_a$ with the numerical one $g_n$ using the **relative error**

      $$\frac{|g_a - g_n|}{\max(|g_a|, |g_n|)}$$

      so that big and small gradients are judged on the same scale. In double precision a correct gradient usually gives a relative error around $10^{-7}$ or smaller. A value around $10^{-2}$ or larger almost always means a real mistake. With $g_a = 6$ and $g_n = 6$ above, it's 0.
      :::
  - id: gradient-checks.s3
    title: Too big a nudge blurs, too small a nudge rounds
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.gradient-checks
    markdown: |-
      Choosing h is a tug-of-war between two errors:

      - **h too large:** the loss curves between w − h and w + h, and the difference averages over that curve. You're measuring the slope of a wide region, not of the point.
      - **h too small:** L(w + h) and L(w − h) become nearly equal, and a computer stores each one with only about 16 significant digits. Subtracting two nearly equal numbers cancels the digits they share and leaves mostly rounding noise. This is called **cancellation**.

      Run this on L(w) = eʷ at w = 1, whose true slope is e ≈ 2.718:

      ```python run
      import numpy as np

      f = np.exp            # a smooth test function; its true slope at w = 1 is e
      w, true = 1.0, np.exp(1.0)

      for h in [1e-1, 1e-3, 1e-5, 1e-7, 1e-9, 1e-11, 1e-13]:
          central = (f(w + h) - f(w - h)) / (2 * h)
          forward = (f(w + h) - f(w)) / h
          print(f"h={h:.0e}   central error {abs(central - true):.1e}"
                f"   forward error {abs(forward - true):.1e}")
      ```

      The central error drops from about 5 × 10⁻³ at h = 0.1 to below 10⁻¹⁰ around h = 10⁻⁵, then climbs again as rounding takes over. By h = 10⁻¹³ it is back up to several times 10⁻⁴, worse than a nudge of 10⁻³. The forward difference is worse at every sensible h. In 32-bit floats, which keep only about 7 digits, the sweet spot moves to much larger h, around 10⁻³ to 10⁻², so run gradient checks in 64-bit precision when you can.

      One more trap: a **kink**, such as ReLU's corner at 0, has no single slope. If w + h and w − h land on opposite sides of a kink, the check can disagree with a perfectly good gradient. Check at points away from the corners.
  - id: gradient-checks.s4
    title: Let the mismatch point at the bug
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.gradient-checks
    markdown: |-
      Back to the bakery. The model is now price = a × boxes + b, where a is the price per box and b is the delivery fee. One order says 2 boxes cost \$8. With error e = 2a + b − 8, the correct slopes are ∂L/∂a = 2 × 2 × e and ∂L/∂b = 2e. The hand-written code below forgot the factor of 2 boxes in the first one. Run the check:

      ```python run
      import numpy as np

      # Bakery model: price = a * boxes + b  (a = price per box, b = delivery fee)
      x, y = 2.0, 8.0                  # 2 boxes, delivered, cost $8

      def loss(a, b):
          return (a * x + b - y) ** 2

      def analytic_grad(a, b):
          err = a * x + b - y
          return np.array([2 * err, 2 * err])     # is this right? the check will tell

      def numeric_grad(a, b, h=1e-5):
          da = (loss(a + h, b) - loss(a - h, b)) / (2 * h)
          db = (loss(a, b + h) - loss(a, b - h)) / (2 * h)
          return np.array([da, db])

      a, b = 1.0, 1.0
      g_a, g_n = analytic_grad(a, b), numeric_grad(a, b)
      rel = np.abs(g_a - g_n) / np.maximum(np.abs(g_a), np.abs(g_n))
      for name, ga, gn, r in zip(["a", "b"], g_a, g_n, rel):
          print(f"d/d{name}: analytic {ga:7.3f}  numeric {gn:7.3f}  rel. error {r:.1e}")
      ```

      The slope for b passes, with a relative error near 10⁻¹¹. The slope for a is −10 where it should be −20, a relative error of 0.5. The check doesn't just say "something's wrong"; it says *which weight* and *by what factor*. A clean factor of 2 points to a dropped term. Fix the code to `2 * x * err` and rerun.

      :::mixup "The loss went down, so my gradient must be right."
      The buggy gradient above still points downhill. It has the right sign and only the wrong size, so training limps along. Many gradient bugs look like this: slow or stalled learning, not a crash. Only a direct check catches them.
      :::

      A few habits make the check trustworthy:

      - **Freeze the randomness.** If dropout or data sampling changes between the two evaluations, you're comparing two different functions. Fix the seed or turn randomness off.
      - **Match the reduction.** If the loss *sums* over 10 examples but your gradient assumes the *mean*, every coordinate is off by exactly 10×.
      - **Sample a few coordinates.** A model with a billion weights needs two loss evaluations per weight checked, so check a random handful.

      Libraries that compute gradients for you by **automatic differentiation** (tracing the calculation and applying the chain rule to each operation) get them right far more often than hand algebra. Checks still matter when you write a custom operation. PyTorch ships this exact test as `torch.autograd.gradcheck`.
  - id: gradient-checks.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.gradient-checks
    markdown: Estimate slopes from pairs of losses, then read the result of a check on a buggy delivery model, a dropout layer, and a ReLU corner.
    takeaway: |-
      Nudge a weight in both directions and compare the losses. This numerical slope can catch derivative errors, provided the nudge is neither too large nor too small.
  - id: gradient-checks.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.gradient-checks
    markdown: |-
      Nudge a weight in both directions and compare the losses. This numerical slope can catch derivative errors, provided the nudge is neither too large nor too small.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - gradient-checks.s1
        - gradient-checks.s2
        - gradient-checks.s3
        - gradient-checks.s4
        - gradient-checks.check
      gate_refs:
        - gate.core
  scene_aliases:
    gradient-checks.recap: gradient-checks.check
assessment_families:
  - id: gradient-checks.base
    objective_ref: objective.gradient-checks
    task: base
    response_type: single_choice
    points: 1
    hint: Divide the difference between the two losses by the gap between the two weights, which is 2h.
    remediation_scene: gradient-checks.s2
    variants:
      - id: gradient-checks.base.1
        retired: true
        prompt: For L(w) = w² at w = 2, what is the analytic derivative?
        options:
          - id: c
            text: '8'
          - id: a
            text: '4'
          - id: b
            text: '2'
        answer: a
        feedback: The derivative is 2w.
      - id: gradient-checks.base.2
        retired: true
        prompt: A central difference divides L(w+h) − L(w−h) by what?
        options:
          - id: a
            text: 2h
          - id: b
            text: h²
          - id: c
            text: w
        answer: a
        feedback: The two evaluations are separated by 2h.
  - id: gradient-checks.transfer
    objective_ref: objective.gradient-checks
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what could make the numerical and analytic slopes disagree even when the formula is right.
    remediation_scene: gradient-checks.s4
    variants:
      - id: gradient-checks.transfer.1
        retired: true
        prompt: Making h extremely tiny makes a numerical check worse. What is a plausible cause?
        options:
          - id: a
            text: Cancellation and floating-point rounding
          - id: b
            text: A proof derivatives do not exist anywhere
          - id: c
            text: A necessary increase in model capacity
        answer: a
        feedback: Subtraction of nearly equal approximate values can lose significant precision.
      - id: gradient-checks.transfer.2
        retired: true
        prompt: Dropout changes masks between the two loss evaluations. What should a gradient check control?
        options:
          - id: b
            text: Only the file extension
          - id: c
            text: The order of the answer options
          - id: a
            text: Randomness so the same function is being compared
        answer: a
        feedback: Finite differences should compare controlled evaluations of the intended function.
  - id: gradient-checks.base.v2
    objective_ref: objective.gradient-checks
    task: base
    response_type: numeric
    points: 1
    absolute_tolerance: 0.001
    hint: Subtract the lower-side loss L(w − h) from the upper-side loss L(w + h), then divide by 2h, the full gap between the two test weights.
    remediation_scene: gradient-checks.s2
    variants:
      - id: gradient-checks.base.v2.1
        prompt: For L(w) = w³ at w = 2 with h = 0.1, the losses are L(2.1) = 9.261 and L(1.9) = 6.859. What slope does the central difference give?
        answer: 12.01
        feedback: (9.261 − 6.859) / 0.2 = 2.402 / 0.2 = 12.01, close to the true slope 3w² = 12. Dividing by h instead of 2h would give 24.02.
      - id: gradient-checks.base.v2.2
        prompt: A loss is evaluated at w − h and w + h with h = 0.1, giving L(w − h) = 3.61 and L(w + h) = 4.41. What slope does the central difference give?
        answer: 4
        feedback: (4.41 − 3.61) / 0.2 = 0.8 / 0.2 = 4. Using a divisor of 0.1 would double the estimate to 8.
      - id: gradient-checks.base.v2.3
        prompt: For L(w) = (3w − 6)² at w = 1 with h = 0.01, the losses are L(1.01) = 8.8209 and L(0.99) = 9.1809. What slope does the central difference give?
        answer: -18
        feedback: (8.8209 − 9.1809) / 0.02 = −0.36 / 0.02 = −18, matching 2 × 3 × (3 − 6). The loss is lower on the upper side, so the slope is negative; subtracting in the other order would flip the sign.
      - id: gradient-checks.base.v2.4
        prompt: For L(w) = w² at w = −1 with h = 0.5, the losses are L(−0.5) = 0.25 and L(−1.5) = 2.25. What slope does the central difference give?
        answer: -2
        feedback: (0.25 − 2.25) / 1 = −2, matching 2w = −2. Here w + h = −0.5 is the upper side, even though it's closer to zero.
  - id: gradient-checks.transfer.v2
    objective_ref: objective.gradient-checks
    task: transfer
    response_type: single_choice
    points: 1
    hint: Before blaming the formula, ask whether the two loss evaluations computed the same smooth function, and whether h was sensible for the number format.
    remediation_scene: gradient-checks.s4
    variants:
      - id: gradient-checks.transfer.v2.1
        prompt: A check on a two-weight model reports a relative error of 0.5 for weight a and 3 × 10⁻¹¹ for weight b. What should you conclude?
        options:
          - id: b
            text: The slope for b is broken, since its error is suspiciously tiny
          - id: a
            text: The code for a's slope is wrong, likely by a factor of 2
          - id: c
            text: Both look fine, since the two errors average out below 1
        answer: a
        feedback: A relative error of 0.5 means one value is double the other, a classic dropped-factor bug. An error near 10⁻¹¹ is exactly what a correct gradient looks like in double precision, not a sign of trouble.
      - id: gradient-checks.transfer.v2.2
        prompt: A check agrees to 10⁻⁹ at h = 10⁻⁵. Shrinking h to 10⁻¹³ makes the disagreement jump to about 10⁻³. What is the most likely cause?
        options:
          - id: c
            text: The analytic gradient formula contains a small error
          - id: a
            text: The loss has a kink somewhere between the two points
          - id: b
            text: Rounding noise from subtracting nearly equal losses
        answer: b
        feedback: At tiny h, the two losses share almost all their digits, so subtracting them leaves mostly rounding noise (cancellation). A formula error would show up at h = 10⁻⁵ too, and a kink would not appear only when h shrinks.
      - id: gradient-checks.transfer.v2.3
        prompt: A network with dropout fails its gradient check badly, with a different wrong answer each time you rerun it. Which change should come first?
        options:
          - id: a
            text: Turn dropout off or fix its random seed during the check
          - id: c
            text: Make h smaller so the two evaluations are closer together
          - id: b
            text: Rewrite the backward pass, since the numbers keep changing
        answer: a
        feedback: If the dropout mask changes between L(w + h) and L(w − h), you're subtracting losses from two different functions. Freeze the randomness first. A smaller h would not help, and rewriting code before that is premature.
      - id: gradient-checks.transfer.v2.4
        prompt: On a batch of 10 examples, every coordinate of your hand-written gradient is exactly 10 times the numerical estimate. What is the most likely cause?
        options:
          - id: b
            text: The value of h was ten times too large for this check
          - id: c
            text: The sign of the error term is flipped in one place
          - id: a
            text: The loss and the gradient code use different reductions
        answer: a
        feedback: A uniform factor equal to the batch size means one side sums over examples and the other averages. An h problem would not give an exact, uniform factor of 10, and a sign flip would make the values negative, not ten times larger.
      - id: gradient-checks.transfer.v2.5
        prompt: A ReLU layer passes its gradient check at every tested point except one pre-activation that is exactly 0. What is the best next step?
        options:
          - id: c
            text: Conclude the ReLU backward pass is wrong and rewrite it
          - id: b
            text: Recheck at points away from 0, where ReLU has one slope
          - id: a
            text: Shrink h until the numerical estimate matches there too
        answer: b
        feedback: ReLU has a corner at 0, so the slopes on its two sides differ and the central difference averages them. Passing everywhere else suggests the code is fine; no h can fix a point with no single slope.
