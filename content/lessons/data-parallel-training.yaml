schema_version: 0.2-draft
lesson:
  id: data-parallel-training
  version: 0.4.0-draft
  title: Train replicas on different examples and combine their gradients
  state: draft
  summary: One GPU would need 21 years to train the team's model; 256 GPUs need a month. See how they pool gradients with a ring all-reduce and hide it inside the backward pass.
  slot: M17.3
  category: learning
  sources:
    - title: "Bandwidth Optimal All-reduce Algorithms for Clusters of Workstations (Patarasuk & Yuan, Journal of Parallel and Distributed Computing, 2009)"
      url: https://doi.org/10.1016/j.jpdc.2008.09.002
    - title: "PyTorch Distributed: Experiences on Accelerating Data Parallel Training (Li et al., 2020)"
      url: https://arxiv.org/abs/2006.15704
    - title: PyTorch DistributedDataParallel documentation
      url: https://docs.pytorch.org/docs/stable/generated/torch.nn.parallel.DistributedDataParallel.html
    - title: "Accurate, Large Minibatch SGD: Training ImageNet in 1 Hour (Goyal et al., 2017)"
      url: https://arxiv.org/abs/1706.02677
objectives:
  - id: objective.data-parallel-training
    version: 2-draft
    statement: Data parallel training splits examples across model replicas and aggregates gradients; weighting, synchronization, and accumulation must preserve the intended global objective.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - data-parallel-training.base.v2
      - data-parallel-training.transfer.v2
      - data-parallel-training.calculate
    prerequisites:
      - anyOf:
          - objective.stochastic-gradients
      - anyOf:
          - objective.training-memory
scenes:
  - id: data-parallel-training.s1
    title: Twenty-one years on one GPU, one month on 256
    type: explanation
    depth: intuition
    objective_refs:
      - objective.data-parallel-training
    markdown: |-
      The team plans to train their 7B model on 2 trillion tokens. One A100 processes about 3,000 tokens per second, so a single GPU would need 2 trillion ÷ 3,000 ≈ 670 million seconds: 21 years. They have 256 GPUs. The simplest way to use them all is **data parallelism**: every GPU holds a complete copy of the model and works on different examples.

      (Their 130 GB budget doesn't fit on one GPU, so in practice they also split up the model states, as the sharding lesson later in this module shows. The gradients are still pooled across workers the way this lesson describes.)

      Each GPU is a **worker**, and its copy of the model is a **replica**. One training step goes like this:

      1. Every replica starts the step with identical weights.
      2. Each worker takes its own slice of the batch, say 4 sequences of 4,096 tokens, and runs forward and backward to get a gradient.
      3. The workers average their gradients, so every worker ends up with the same average.
      4. Every worker applies the same optimizer update to its copy, so the replicas stay identical.

      The **global batch** is everything processed in one step across all workers: 256 × 4 × 4,096 ≈ 4.2 million tokens, close to the 4-million-token batch Meta used for Llama 2. The averaged gradient is exactly what one giant GPU would compute on the whole batch: same training, only faster.
    bridges: []
  - id: data-parallel-training.s2
    title: Average the intended units
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.data-parallel-training
    markdown: |-
      "Average the gradients" hides a trap. The loss is usually a mean over tokens, and different workers can hold different numbers of real tokens once padding and masked positions are removed.

      Suppose worker A has 2 valid tokens with mean gradient 3, and worker B has 10 valid tokens with mean gradient 9. The true per-token mean over all 12 tokens is

      $$\frac{2 \times 3 + 10 \times 9}{12} = \frac{96}{12} = 8.$$

      Averaging the two means gives (3 + 9) ÷ 2 = 6, quietly giving each of A's tokens five times the weight of each of B's. The fix is to have every worker send its gradient *sum* and its token count, add both across workers, and divide once at the end.

      :::mixup "Averaging each worker's mean gradient is the same as the global mean."
      Only when every worker has the same number of counted units (examples or valid tokens). With uneven counts, combine sums and counts, then divide.
      :::
    bridges: []
  - id: data-parallel-training.s3
    title: Accumulate before updating
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.data-parallel-training
    markdown: |-
      Suppose each GPU has room for the activations of just one 4,096-token sequence at a time. To reach 4 sequences per worker, they use **gradient accumulation**: run forward and backward on one sequence (a **microbatch**), add its gradient into a running total, repeat for the next three, then do a single optimizer step.

      Four microbatches, one optimizer step, and one gradient exchange. Scale each microbatch's loss by 1/4 (or divide the total at the end) so the result is a mean, not a sum four times too large. The gradient matches one batch of 4 up to rounding, as long as nothing in the model mixes examples within a batch, the way batch normalization does.
    bridges: []
  - id: data-parallel-training.s4
    title: Ring all-reduce sends about twice the gradient
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.data-parallel-training
    markdown: |-
      The averaging step is a collective operation called an **all-reduce**: every worker contributes a vector, the vectors are combined (here, summed), and every worker receives the result. The team's gradients are 7 billion bf16 numbers, 14 GB. Sending all of that to one leader GPU and back would jam the leader's link. The standard fix is the **ring all-reduce**, which arranges the workers in a circle and cuts each gradient into N chunks.

      - **Reduce-scatter** (N − 1 steps): each worker passes one chunk to its neighbor, which adds its own copy of that chunk and passes it on. Afterwards, each worker owns the finished sum of one chunk.
      - **All-gather** (N − 1 steps): the finished chunks travel around the ring until everyone has all of them.

      Each step sends one chunk of size S/N, so each worker sends 2(N − 1) chunks in total:

      :::papers Bandwidth of ring all-reduce (Patarasuk & Yuan, 2009)
      $$\text{bytes sent per worker} = 2\,\frac{N-1}{N}\,S$$

      For the team, S = 14 GB and N = 256: 2 × 255/256 × 14 ≈ 27.9 GB per GPU per step. If each GPU can push 25 GB/s into the network, that takes about 1.1 s. Patarasuk and Yuan showed that no all-reduce can send less per worker than this.
      :::

      :::predict The team grows from 256 to 2,048 GPUs. How much does each GPU send now?
      2 × 2,047/2,048 × 14 ≈ 27.99 GB, almost exactly the same. The factor 2(N − 1)/N creeps toward 2 but never passes it. That's why ring all-reduce scales: more workers don't mean more bytes per worker. (They do mean more steps, each with a fixed start-up delay, so very large clusters use hierarchies of rings or trees.)
      :::

      Run the ring on 4 simulated GPUs and check that every GPU ends with the true sum:

      ```python run
      import numpy as np

      N = 4                                    # GPUs in the ring
      rng = np.random.default_rng(0)
      grads = [rng.integers(0, 10, size=8).astype(float) for _ in range(N)]
      chunks = [np.array_split(g.copy(), N) for g in grads]   # N chunks per GPU
      sent = 0

      # Reduce-scatter: at each step GPU i passes one chunk to GPU i+1, which adds it in.
      for step in range(N - 1):
          msgs = [(i, (i - step) % N, chunks[i][(i - step) % N].copy()) for i in range(N)]
          for i, c, data in msgs:
              chunks[(i + 1) % N][c] += data
              sent += data.size
      # Now GPU i holds the finished sum of chunk (i + 1) % N.

      # All-gather: pass the finished chunks around the ring.
      for step in range(N - 1):
          msgs = [(i, (i + 1 - step) % N, chunks[i][(i + 1 - step) % N].copy()) for i in range(N)]
          for i, c, data in msgs:
              chunks[(i + 1) % N][c] = data
              sent += data.size

      result = np.concatenate(chunks[0])
      print("true sum:      ", sum(grads))
      print("ring result:   ", result)
      print("all GPUs agree:", all(np.array_equal(np.concatenate(ch), result) for ch in chunks))
      S = grads[0].size
      print(f"sent per GPU: {sent / N / S:.2f} x gradient size; 2(N-1)/N = {2 * (N - 1) / N:.2f}")
      ```

      Change `N` to 8 and `size=8` to `size=16`. The sum still matches, and the bytes sent per GPU rise only from 1.50 to 1.75 times the gradient.
    diagram:
      caption: A ring all-reduce on four GPUs. Each arrow carries one chunk per step, first adding (reduce-scatter), then copying (all-gather).
      description: Four GPUs sit in a ring. GPU 0 sends to GPU 1, GPU 1 to GPU 2, GPU 2 to GPU 3, and GPU 3 back to GPU 0. Each holds a full gradient cut into four chunks. During reduce-scatter each GPU passes one chunk per step to its neighbor, which adds it; during all-gather the finished chunks are passed on and copied. Each GPU sends 2 × 3/4 of its gradient in total.
