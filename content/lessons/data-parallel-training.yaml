schema_version: 0.2-draft
lesson:
  id: data-parallel-training
  version: 0.1.0-draft
  title: Train replicas on different examples and combine their gradients
  state: draft
  summary: Data parallel training splits examples across model replicas and aggregates gradients; weighting, synchronization,
    and accumulation must preserve the intended global objective.
  slot: M17.3
  category: learning
  minutes: 12
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: PyTorch DistributedDataParallel documentation
    url: https://docs.pytorch.org/docs/stable/generated/torch.nn.parallel.DistributedDataParallel.html
objectives:
- id: objective.data-parallel-training
  version: 1-draft
  statement: Data parallel training splits examples across model replicas and aggregates gradients; weighting, synchronization,
    and accumulation must preserve the intended global objective.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - data-parallel-training.base
  - data-parallel-training.transfer
  prerequisites:
  - anyOf:
    - objective.stochastic-gradients
  - anyOf:
    - objective.training-memory
scenes:
- id: data-parallel-training.s1
  title: Replicate the model, divide the batch
  type: explanation
  depth: intuition
  objective_refs:
  - objective.data-parallel-training
  markdown: Each data-parallel worker starts from compatible model state and processes a local batch. After backward
    computation, workers aggregate gradients so their optimizer updates stay aligned. The model is replicated; this
    differs from splitting one model’s layers or tensor dimensions across devices.
  text_mode: Each data-parallel worker starts from compatible model state and processes a local batch. After backward
    computation, workers aggregate gradients so their optimizer updates stay aligned. The model is replicated; this
    differs from splitting one model’s layers or tensor dimensions across devices.
  bridges: []
- id: data-parallel-training.s2
  title: Average the intended units
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data-parallel-training
  markdown: With equally weighted examples and equal local batch sizes, averaging workers’ mean gradients matches
    the global batch mean. If one worker has two valid tokens and another has ten, equally averaging their token
    means gives the small group too much weight. Aggregate sums and counts consistently.
  text_mode: With equally weighted examples and equal local batch sizes, averaging workers’ mean gradients matches
    the global batch mean. If one worker has two valid tokens and another has ten, equally averaging their token
    means gives the small group too much weight. Aggregate sums and counts consistently.
  bridges: []
- id: data-parallel-training.s3
  title: Accumulate before updating
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data-parallel-training
  markdown: Gradient accumulation processes several microbatches before one optimizer update. It can approximate
    a larger effective batch with less activation memory, provided losses are scaled correctly. Batch-dependent
    operations, random behavior, and numerical reduction order can prevent exact equivalence to one physically large
    batch.
  text_mode: Gradient accumulation processes several microbatches before one optimizer update. It can approximate
    a larger effective batch with less activation memory, provided losses are scaled correctly. Batch-dependent
    operations, random behavior, and numerical reduction order can prevent exact equivalence to one physically large
    batch.
  bridges: []
- id: data-parallel-training.s4
  title: Communication is part of the step
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data-parallel-training
  markdown: All-reduce combines distributed gradient contributions and returns the result to participating workers.
    Communication can overlap some backward computation, but late gradients and slow workers can delay the update.
    Report global batch size and optimizer-step count when comparing distributed training runs.
  text_mode: All-reduce combines distributed gradient contributions and returns the result to participating workers.
    Communication can overlap some backward computation, but late gradients and slow workers can delay the update.
    Report global batch size and optimizer-step count when comparing distributed training runs.
  bridges: []
- id: data-parallel-training.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.data-parallel-training
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: data-parallel-training.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.data-parallel-training
  markdown: Data parallel training splits examples across model replicas and aggregates gradients; weighting, synchronization,
