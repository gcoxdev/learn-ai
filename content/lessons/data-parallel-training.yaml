    bridges: []
  - id: data-parallel-training.overlap
    title: Hide the exchange inside the backward pass
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.data-parallel-training
    markdown: |-
      A step for the team takes about 4.2 million tokens ÷ (256 GPUs × 3,000 tokens/s) ≈ 5.5 s, and the all-reduce about 1.1 s. Done one after the other, communication would add 20% to every step. It doesn't have to.

      Backward runs from the last layer to the first, so the last layer's gradients are finished long before the first layer's. PyTorch's DistributedDataParallel groups gradients into **buckets** (25 MB each by default) and starts all-reducing a bucket the moment all its gradients are ready, while backward keeps computing earlier layers. By the time backward finishes, most buckets are already summed; only the last one or two are still in flight.

      Two things break the overlap. A **straggler**, one worker that runs slower than the rest (a hot GPU, a busy host, a slow network link), makes everyone wait, because no worker can finish the all-reduce without its contribution. On 256 GPUs, if 255 finish backward in 3.6 s and one takes 4.5 s, the whole step waits the extra 0.9 s. And a gradient exchange that's much slower than backward can't be hidden at all, which is one reason teams place the chattiest traffic inside a machine, over **NVLink** (NVIDIA's direct GPU-to-GPU links, more than ten times faster than the network here), and the rest across the network.
    bridges: []
  - id: data-parallel-training.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.data-parallel-training
    markdown: All-reduce volumes to compute, uneven token counts, a straggling GPU, and a speech team's padded batches test whether a data-parallel step still computes the gradient you intended.
    takeaway: |-
      Data-parallel workers compute gradients on different examples and all-reduce them into one shared update. A ring all-reduce sends about 2(N − 1)/N times the gradient per worker, and overlapping it with backward hides most of that time.
  - id: data-parallel-training.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.data-parallel-training
    markdown: |-
      Data-parallel workers process different examples and combine their gradients. Weight the contributions by the intended examples or tokens so the shared update still optimizes the right objective.
