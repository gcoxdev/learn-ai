assessment_families:
  - id: data-parallel-training.base
    objective_ref: objective.data-parallel-training
    task: base
    response_type: single_choice
    points: 1
    hint: 'Average the intended units: trace the inputs, operation, and result before choosing.'
    remediation_scene: data-parallel-training.s2
    variants:
      - id: data-parallel-training.base.1
        prompt: What is divided in ordinary data parallelism?
        options:
          - id: b
            text: The vocabulary meaning across workers
          - id: c
            text: Each layer necessarily
          - id: a
            text: The examples in the batch
        answer: a
        feedback: Workers typically hold replicas and process distinct data.
        retired: true
      - id: data-parallel-training.base.2
        prompt: Unequal valid-token counts require what weighting?
        options:
          - id: c
            text: Ignore the larger local batch
          - id: a
            text: Weight by the intended global valid-token contribution
          - id: b
            text: Always average local means equally
        answer: a
        feedback: The global loss defines aggregation weights.
        retired: true
  - id: data-parallel-training.transfer
    objective_ref: objective.data-parallel-training
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Communication is part of the step: trace the inputs, operation, and result before choosing.'
    remediation_scene: data-parallel-training.s4
    variants:
      - id: data-parallel-training.transfer.1
        prompt: Four microbatches are accumulated before one update. How many optimizer steps occurred?
        options:
          - id: c
            text: Zero by definition
          - id: a
            text: One
          - id: b
            text: Four
        answer: a
        feedback: Forward/backward passes and optimizer steps are different counts.
        retired: true
      - id: data-parallel-training.transfer.2
        prompt: Why can a slow worker delay synchronous training?
        options:
          - id: a
            text: The update depends on its gradient contribution
          - id: b
            text: Every worker has an unrelated model
          - id: c
            text: Synchronization eliminates waiting
        answer: a
        feedback: Synchronous aggregation follows the participating workers’ progress.
        retired: true
  - id: data-parallel-training.base.v2
    objective_ref: objective.data-parallel-training
    task: base
    response_type: single_choice
    points: 1
    hint: Replicas start and end each step identical; only their data and local gradients differ. Combine sums and counts, and remember a ring sends about 2(N − 1)/N of the gradient per worker.
    remediation_scene: data-parallel-training.s1
    variants:
      - id: data-parallel-training.base.v2.1
        prompt: In synchronous data parallelism on 8 GPUs, what is identical on every GPU right after an optimizer step?
        options:
          - id: b
            text: The minibatch of examples each GPU just processed
          - id: a
            text: The model weights held by each GPU's replica
          - id: c
            text: The local gradient each GPU computed before all-reduce
        answer: a
        feedback: Every worker applies the same averaged gradient to the same starting weights, so the replicas stay identical. Their data slices and pre-exchange gradients differ; that's the point of splitting the batch.
      - id: data-parallel-training.base.v2.2
        prompt: GPU A has 100 valid tokens with mean gradient 2.0; GPU B has 300 valid tokens with mean gradient 4.0. The loss is a mean over all tokens. What combined gradient is correct?
        options:
          - id: c
            text: 6.0, the sum of the two workers' gradients
          - id: b
            text: 3.0, the average of the two workers' means
          - id: a
            text: 3.5, each mean weighted by its token count
        answer: a
        feedback: (100 × 2.0 + 300 × 4.0) ÷ 400 = 3.5. Averaging the means (3.0) over-weights GPU A's tokens, and adding them (6.0) forgets to divide by anything.
      - id: data-parallel-training.base.v2.3
        prompt: On 256 GPUs, each GPU accumulates 4 microbatches of one sequence before updating. Per optimizer step, how many sequences are processed and how many updates happen?
        options:
          - id: a
            text: 1,024 sequences and one update
          - id: b
            text: 256 sequences and four updates
          - id: c
            text: 1,024 sequences and four updates
        answer: a
        feedback: 256 GPUs × 4 microbatches = 1,024 sequences, all feeding one averaged gradient and one optimizer step. Accumulation runs several forward/backward passes but only one update.
      - id: data-parallel-training.base.v2.4
        prompt: A ring all-reduce grows from 8 GPUs to 1,024. What happens to the number of bytes each GPU sends per all-reduce?
        options:
          - id: c
            text: It shrinks roughly as 1/N, since each GPU's chunk gets smaller
          - id: a
            text: It stays just under twice the gradient size
          - id: b
            text: It grows roughly in proportion to the number of GPUs
        answer: a
        feedback: Per-worker volume is 2(N − 1)/N × S, which goes from 1.75 S to about 2 S. Chunks do get smaller, but there are proportionally more steps, so the total per worker barely changes.
  - id: data-parallel-training.transfer.v2
    objective_ref: objective.data-parallel-training
    task: transfer
    response_type: single_choice
    points: 1
    hint: A synchronous step waits for the slowest contribution and must reproduce the intended global mean. Ask what the workers are waiting for, or what the exchange is actually summing.
    remediation_scene: data-parallel-training.overlap
    variants:
      - id: data-parallel-training.transfer.v2.1
        prompt: A profile shows every GPU finishing backward and then sitting idle for 1.1 s while all gradients are all-reduced together. Which change hides most of that time?
        options:
          - id: a
            text: All-reduce each bucket of gradients as soon as backward produces it
          - id: b
            text: Move the all-reduce so it runs after the optimizer step instead
          - id: c
            text: Add more GPUs so that each one's share of the gradient is smaller
        answer: a
        feedback: Late layers' gradients are ready early in backward, so bucketed all-reduce overlaps communication with the rest of backward. The update needs the summed gradient, so it can't come after; and more GPUs don't shrink per-worker ring traffic.
      - id: data-parallel-training.transfer.v2.2
        prompt: On 64 GPUs, 63 finish their backward pass in 2.0 s, but one with a failing fan throttles and takes 2.6 s. About how long does each synchronous step take?
        options:
          - id: b
            text: About 2.0 s, because the fast GPUs carry on without it
          - id: c
            text: About 2.01 s, the average time across all 64 GPUs
          - id: a
            text: About 2.6 s, because everyone waits for its gradient
        answer: a
        feedback: The all-reduce can't finish without every worker's contribution, so the slowest GPU sets the pace for all 64. That one straggler slows the whole job by 30%.
      - id: data-parallel-training.transfer.v2.3
        prompt: A speech team trains on 8 GPUs whose batches contain very different amounts of padding, so valid audio frames per GPU vary widely. Their loss is a mean over frames. What should the gradient exchange combine?
        options:
          - id: c
            text: Each GPU's mean gradient, weighted by the number of utterances it holds
          - id: a
            text: Each GPU's summed gradient and frame count, dividing once at the end
          - id: b
            text: Each GPU's mean gradient, averaged equally across all eight GPUs
        answer: a
        feedback: The intended objective weights every valid frame equally, so add gradient sums and frame counts, then divide. Utterance counts ignore how many frames each utterance has, and equal averaging over-weights lightly filled GPUs.
      - id: data-parallel-training.transfer.v2.4
        prompt: A team scales from 8 to 64 GPUs, keeping 4 sequences per GPU and the same total token budget. What changes that they must plan for?
        options:
          - id: b
            text: Nothing about the optimization changes, since the gradients are averaged
          - id: a
            text: The global batch is 8× larger, so there are 8× fewer steps to tune for
          - id: c
            text: Each GPU now sees 8× fewer sequences per step, which adds noise
        answer: a
        feedback: Global batch = GPUs × per-GPU batch, so it grows 8× and the same tokens take 8× fewer updates; the learning rate and warmup often need retuning (Goyal et al., 2017, scaled the learning rate with the batch). Each GPU's own batch is unchanged.
  - id: data-parallel-training.calculate
    objective_ref: objective.data-parallel-training
    task: base
    response_type: numeric
    points: 1
    hint: "Ring all-reduce: each worker sends 2 × (N − 1)/N × S. Time = bytes ÷ bandwidth. For uneven token counts, weight each mean by its count and divide by the total."
    remediation_scene: data-parallel-training.s4
    absolute_tolerance: 0.1
    variants:
      - id: data-parallel-training.calculate.1
        prompt: Four GPUs ring-all-reduce a 10 GB gradient. How many GB does each GPU send?
        answer: 15
        feedback: 2 × 3/4 × 10 = 15 GB. Each GPU sends 3 chunks of 2.5 GB in reduce-scatter and 3 more in all-gather.
      - id: data-parallel-training.calculate.2
        prompt: Eight GPUs in one machine ring-all-reduce the 7B model's 14 GB of bf16 gradients. How many GB does each GPU send?
        answer: 24.5
        feedback: 2 × 7/8 × 14 = 24.5 GB.
      - id: data-parallel-training.calculate.3
        prompt: 256 GPUs ring-all-reduce a 14 GB gradient. How many GB does each GPU send, to one decimal place?
        answer: 27.9
        feedback: 2 × 255/256 × 14 ≈ 27.9 GB, just under twice the gradient.
      - id: data-parallel-training.calculate.4
        prompt: Sixteen GPUs ring-all-reduce a 2 GB gradient, and each GPU can send at 25 GB/s. How many milliseconds does the transfer take at best?
        answer: 150
        feedback: Each GPU sends 2 × 15/16 × 2 = 3.75 GB, and 3.75 ÷ 25 = 0.15 s = 150 ms.
      - id: data-parallel-training.calculate.5
        prompt: Worker A has 200 valid tokens with mean gradient 1.0; worker B has 600 valid tokens with mean gradient 3.0. What is the correct per-token mean gradient across both?
        answer: 2.5
        feedback: (200 × 1.0 + 600 × 3.0) ÷ 800 = 2,000 ÷ 800 = 2.5. Averaging the two means would give 2.0.
      - id: data-parallel-training.calculate.6
        prompt: 64 GPUs each accumulate 2 microbatches of 4 sequences before every update. How many sequences are in the global batch?
        answer: 512
        feedback: 64 × 2 × 4 = 512 sequences per optimizer step.
