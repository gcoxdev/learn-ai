assessment_families:
  - response_type: single_choice
    hint: Exponentiate eligible scores, zero excluded contributions, and normalize over the remaining total.
    variants:
      - prompt: Scaled scores are [ln 3, 0, 0]. With no mask, what are their softmax weights?
        options:
          - id: answer
            text: '[0.6, 0.2, 0.2]'
          - id: a
            text: '[3, 0, 0]'
          - id: b
            text: '[1/3, 1/3, 1/3]'
        answer: answer
        feedback: The exponentials are [3, 1, 1], whose total is 5. Dividing by 5 gives [0.6, 0.2, 0.2].
        id: softmax-attention.base.1
        retired: true
      - prompt: Scaled scores are [ln 3, 0, 0], but the third position is excluded. What are the weights?
        options:
          - id: a
            text: '[0.6, 0.2, 0.2]'
          - id: b
            text: '[0.75, 0, 0.25]'
          - id: answer
            text: '[0.75, 0.25, 0]'
        answer: answer
        feedback: The eligible exponential weights are [3, 1, 0]. The total is 4, so the excluded future position receives exactly zero.
        id: softmax-attention.base.2
        retired: true
    id: softmax-attention.base
    objective_ref: objective.softmax-attention
    task: base
    points: 1
    remediation_scene: softmax-attention.s1
  - response_type: single_choice
    hint: Separate the entire sequence stored by the program from the positions available to one query.
    variants:
      - prompt: To hide a future position, an implementation changes its finite score to 0 before softmax. Is that sufficient?
        options:
          - id: a
            text: Yes; a zero score always produces a zero softmax weight.
          - id: b
            text: Yes; masks are unnecessary when the target sequence is stored in memory.
          - id: answer
            text: No; exp(0) is 1, so the future position can still receive weight.
        answer: answer
        feedback: Zero is a valid finite score. Exclusion needs a proper mask, equivalent to a zero exponential contribution before normalization.
        id: softmax-attention.transfer.1
        retired: true
      - prompt: A decoder’s training batch contains full sentences. How can many positions be processed together without reading future targets?
        options:
          - id: b
            text: Replace every training label with the first token.
          - id: answer
            text: Apply a causal mask separately to each position’s attention row.
          - id: a
            text: Permit every position to copy its target from the next position.
        answer: answer
        feedback: The program may hold all positions while restricting each row to its permitted prefix. Parallel execution and causal information flow are compatible.
        id: softmax-attention.transfer.2
        retired: true
    id: softmax-attention.transfer
    objective_ref: objective.softmax-attention
    task: transfer
    points: 1
    remediation_scene: softmax-attention.s1
  - id: softmax-attention.base.v2
    objective_ref: objective.softmax-attention
    task: base
    response_type: single_choice
    points: 1
    hint: Place each step in the equation softmax(QKᵀ/√d_k + M)V. Scaling happens before softmax, and so does the mask; softmax itself is what makes each row sum to 1.
    remediation_scene: softmax-attention.equation
    variants:
      - id: softmax-attention.base.v2.1
        prompt: Why does scaled dot-product attention divide the scores by √d_k before softmax?
        options:
          - id: b
            text: So that each row of attention weights adds up to exactly 1
          - id: c
            text: So that longer sentences don't get larger total attention
          - id: a
            text: So that large head sizes don't push softmax into saturation
        answer: a
        feedback: Dot products grow like √d_k, and large scores make softmax put nearly all weight on one token, with tiny gradients. Summing to 1 is softmax's own job, and d_k is the vector size, not the sentence length.
      - id: softmax-attention.base.v2.2
        prompt: Which way of applying a causal mask gives future positions zero weight while the allowed weights still sum to 1?
        options:
          - id: a
            text: Set future scores to −∞ before softmax
          - id: c
            text: Set future scores to 0 before softmax
          - id: b
            text: Set future weights to 0 after softmax
        answer: a
        feedback: e^(−∞) = 0, and softmax then normalizes over the allowed positions. A score of 0 still gives e^0 = 1, and zeroing weights after softmax leaves a row that sums to less than 1.
      - id: softmax-attention.base.v2.3
        prompt: A head uses queries and keys with 256 entries each. By what number should its raw scores be divided before softmax?
        options:
          - id: c
            text: '256'
          - id: a
            text: '16'
          - id: b
            text: '128'
        answer: a
        feedback: The divisor is √d_k = √256 = 16, the typical size of a dot product of 256 random entries. Dividing by 256 would shrink scores too far, and 128 is half of d_k, not its square root.
      - id: softmax-attention.base.v2.4
        prompt: A batch pads "cats nap" to "cats nap [PAD]". Which scores does the padding mask set to −∞?
        options:
          - id: b
            text: Every score in the [PAD] row, so the pad token attends to nothing
          - id: a
            text: The [PAD] column in every row, so no token mixes in the pad
          - id: c
            text: None; instead the value vector of [PAD] is set to all zeros
        answer: a
        feedback: Masking the [PAD] column keeps padding out of every real token's mix. Masking the whole [PAD] row would leave a row with nothing allowed, which produces NaN, and zeroing the value would still let the pad soak up weight.
  - id: softmax-attention.transfer.v2
    objective_ref: objective.softmax-attention
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what each position is allowed to see for this task, and what a missing mask or missing scale would do to the weights during training.
    remediation_scene: softmax-attention.s5
    variants:
      - id: softmax-attention.transfer.v2.1
        prompt: A new language model's training loss drops almost to zero within minutes, but its generated text is gibberish. Which bug best explains both symptoms?
        options:
          - id: c
            text: The √d_k scaling was left out, so softmax saturated
          - id: a
            text: The causal mask is missing, so each position can see its target
          - id: b
            text: The padding mask is missing, so pad tokens are mixed in
        answer: a
        feedback: Without the causal mask, every position can copy the next token, so training looks perfect, but at generation time there is no next token to copy. A missing scale would slow learning, not make it suspiciously easy.
      - id: softmax-attention.transfer.v2.2
        prompt: An encoder reads whole product reviews, padded to 128 tokens, and outputs a star rating. Which masks should its attention use?
        options:
          - id: a
            text: A padding mask only, since every real token may see the whole review
          - id: b
            text: A causal mask and a padding mask, as in a language model
          - id: c
            text: A causal mask only, since the pad tokens come at the end anyway
        answer: a
        feedback: Classifying a complete review has no "future" to hide, so a causal mask would only throw away useful context. Padding still has to be masked out; appearing at the end doesn't stop earlier tokens from attending to it.
      - id: softmax-attention.transfer.v2.3
        prompt: An engineer removes the division by √d_k from a model with d_k = 128. Training slows to a crawl. What is the most likely reason?
        options:
          - id: b
            text: The weights in each row no longer sum to 1, so outputs grow
          - id: c
            text: The model can now see future tokens, which confuses it
          - id: a
            text: Scores around ±11 saturate softmax, so gradients become tiny
        answer: a
        feedback: Typical scores grow to about √128 ≈ 11, softmax puts nearly all weight on one token, and p(1 − p) is close to 0. Softmax still normalizes each row, and the scale has nothing to do with the mask.
      - id: softmax-attention.transfer.v2.4
        prompt: To train on a 1,000-token document, a GPU computes the full 1,000 × 1,000 grid of scores in one step. A reviewer worries this lets tokens read ahead. Which reply is right?
        options:
          - id: c
            text: Right to worry; training should process the tokens one at a time
          - id: a
            text: Each row is masked, so row i only mixes in positions 1 to i
          - id: b
            text: Softmax spreads weight thinly over 1,000 tokens, so leaks are tiny
        answer: a
        feedback: Computing the whole grid at once is fine because the causal mask gives each row its own allowed columns. Processing one token at a time would give the same answer much more slowly, and thin weights are still a leak.
  - id: softmax-attention.calculate
    objective_ref: objective.softmax-attention
    task: base
    response_type: numeric
    points: 1
    hint: Divide the raw scores by √d_k, give masked positions weight 0, then raise e to each remaining score and divide by their total.
    remediation_scene: softmax-attention.equation
    absolute_tolerance: 0.005
    variants:
      - id: softmax-attention.calculate.1
        prompt: A query has raw scores [4, 0] against two keys, with d_k = 4 and no mask. What attention weight does the first key get? (Give 3 decimal places.)
        answer: 0.881
        feedback: Scaled scores are [4, 0] / 2 = [2, 0]. e² ≈ 7.389, so the weight is 7.389 / (7.389 + 1) ≈ 0.881.
      - id: softmax-attention.calculate.2
        prompt: Scaled scores are [ln 3, 0, 0], and a causal mask hides the third position. What weight does the first position get?
        answer: 0.75
        feedback: The exponentials are [3, 1, 0] after masking, the total is 4, and the first weight is 3/4 = 0.75.
      - id: softmax-attention.calculate.3
        prompt: A query has raw scores [3, 0] against two keys, with d_k = 9 and no mask. What attention weight does the first key get? (Give 3 decimal places.)
        answer: 0.731
        feedback: Scaled scores are [3, 0] / 3 = [1, 0]. e ≈ 2.718, so the weight is 2.718 / (2.718 + 1) ≈ 0.731.
      - id: softmax-attention.calculate.4
        prompt: A query has raw scores [0, 8, 0] against three keys, with d_k = 16 and no mask. What weight does the middle key get? (Give 3 decimal places.)
        answer: 0.787
        feedback: Scaled scores are [0, 2, 0]. The exponentials are [1, 7.389, 1], total 9.389, so the middle weight is 7.389 / 9.389 ≈ 0.787.
      - id: softmax-attention.calculate.5
        prompt: Position 2 of a decoder has raw scores [2, 2, 6] against positions 1–3, with d_k = 4 and a causal mask. What weight does position 1 get?
        answer: 0.5
        feedback: The mask hides position 3, so only [2, 2] / 2 = [1, 1] remain. Equal scores give equal weights, 0.5 each. The large score of 6 belongs to the future and doesn't count.
