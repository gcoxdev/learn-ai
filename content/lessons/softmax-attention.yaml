assessment_families:
- response_type: single_choice
  hint: Exponentiate eligible scores, zero excluded contributions, and normalize over the remaining total.
  variants:
  - prompt: Scaled scores are [ln 3, 0, 0]. With no mask, what are their softmax weights?
    options:
    - id: answer
      text: '[0.6, 0.2, 0.2]'
    - id: a
      text: '[3, 0, 0]'
    - id: b
      text: '[1/3, 1/3, 1/3]'
    answer: answer
    feedback: The exponentials are [3, 1, 1], whose total is 5. Dividing by 5 gives [0.6, 0.2, 0.2].
    id: softmax-attention.base.1
  - prompt: Scaled scores are [ln 3, 0, 0], but the third position is excluded. What are the weights?
    options:
    - id: a
      text: '[0.6, 0.2, 0.2]'
    - id: b
      text: '[0.75, 0, 0.25]'
    - id: answer
      text: '[0.75, 0.25, 0]'
    answer: answer
    feedback: The eligible exponential weights are [3, 1, 0]. The total is 4, so the excluded future position
      receives exactly zero.
    id: softmax-attention.base.2
  id: softmax-attention.base
  objective_ref: objective.softmax-attention
  task: base
  points: 1
  remediation_scene: softmax-attention.s1
- response_type: single_choice
  hint: Separate the entire sequence stored by the program from the positions available to one query.
  variants:
  - prompt: To hide a future position, an implementation changes its finite score to 0 before softmax. Is that
      sufficient?
    options:
    - id: a
      text: Yes; a zero score always produces a zero softmax weight.
    - id: b
      text: Yes; masks are unnecessary when the target sequence is stored in memory.
    - id: answer
      text: No; exp(0) is 1, so the future position can still receive weight.
    answer: answer
    feedback: Zero is a valid finite score. Exclusion needs a proper mask, equivalent to a zero exponential
      contribution before normalization.
    id: softmax-attention.transfer.1
  - prompt: A decoder’s training batch contains full sentences. How can many positions be processed together
      without reading future targets?
    options:
    - id: b
      text: Replace every training label with the first token.
    - id: answer
      text: Apply a causal mask separately to each position’s attention row.
    - id: a
      text: Permit every position to copy its target from the next position.
    answer: answer
    feedback: The program may hold all positions while restricting each row to its permitted prefix. Parallel
      execution and causal information flow are compatible.
    id: softmax-attention.transfer.2
  id: softmax-attention.transfer
  objective_ref: objective.softmax-attention
  task: transfer
  points: 1
  remediation_scene: softmax-attention.s1
