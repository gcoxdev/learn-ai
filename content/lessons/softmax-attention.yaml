- title: Parallel computation can still respect causal order
  markdown: 'During training, the full recorded sequence is available to the program. The program can calculate
    many positions together while masking each position’s future. Having the tensor in memory does not mean
    every attention row may use every column.


    Each row has its own eligible positions and normalization. The mask prevents information leakage within
    the forward computation; shifting labels so each position predicts its successor supplies the corresponding
    training task.


    The example assumes each query has at least one allowed key. Masking every key leaves no valid set of probabilities
    to normalize in the usual formula. Real implementations need a defined way to handle padding and empty
    rows rather than treating “all excluded” as an ordinary distribution.'
  id: softmax-attention.s5
