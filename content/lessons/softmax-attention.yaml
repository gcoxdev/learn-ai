    Masking the third candidate above leaves exponentials [2, 1, 0]. Renormalizing gives [2/3, 1/3, 0]. Merely
    replacing its score by zero would leave exp(0) = 1 and would not exclude it.'
- title: Change the query; switch the mask
  markdown: 'The experiment uses invented two-coordinate queries, keys, and values. We inspect the query at
    position two, so a causal mask allows positions one and two. Change the query direction and observe the
    score, weight, and output changes.


    Then allow the future position for comparison. An encoder may legitimately see an entire input sequence,
    but an autoregressive next-token training position may not read its future target. The same unmasked arithmetic
    has different validity under different tasks.'
  simulation: attention
