scenes:
- title: First compare; then scale
  markdown: 'A dot-product attention head compares a query with each key. If the query and key have d coordinates,
    standard scaled dot-product attention divides the dot product by the square root of d before normalization.


    The square root of 4 is 2 because 2 × 2 = 4. So a dot product of 6 in a four-coordinate head becomes a
    scaled score of 3. Scaling helps control score magnitudes; it does not decide which token is factually
    correct.'
  bridges:
  - vectors
  - powers-logs
  id: softmax-attention.s1
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.softmax-attention
  text_mode: 'A dot-product attention head compares a query with each key. If the query and key have d coordinates,
    standard scaled dot-product attention divides the dot product by the square root of d before normalization.


    The square root of 4 is 2 because 2 × 2 = 4. So a dot product of 6 in a four-coordinate head becomes a
    scaled score of 3. Scaling helps control score magnitudes; it does not decide which token is factually
    correct.'
- title: Calculate three attention weights
  markdown: 'Softmax exponentiates each eligible score and divides by the sum of those exponentials. The notation
    **ln 2** means the natural logarithm of 2; exponentiation reverses it, so exp(ln 2) = 2. Also, exp(0) =
    1.


    For scaled scores [ln 2, 0, 0], the exponentials are [2, 1, 1]. Their total is 4, giving attention weights
    [0.5, 0.25, 0.25]. You can follow the calculation using these supplied values, or visit the powers-and-logs
    side lesson for the inverse relationship.


    These weights mix the value vectors at candidate input positions. They are not probabilities over the model’s
    output vocabulary; the rest of the network still has work to do.'
  bridges:
  - powers-logs
  - probability
  type: table
  columns:
  - Candidate
  - Scaled score
  - Exponential
  - Unmasked weight
  rows:
  - - First
    - ln 2
    - 2
    - 0.5
  - - Second
    - 0
    - 1
    - 0.25
  - - Third
    - 0
    - 1
    - 0.25
  id: softmax-attention.s2
  depth: mechanics
  objective_refs:
