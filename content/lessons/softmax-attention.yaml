    [0.5, 0.25, 0.25]. You can follow the calculation using these supplied values, or visit the powers-and-logs
    side lesson for the inverse relationship.


    These weights mix the value vectors at candidate input positions. They are not probabilities over the model’s
    output vocabulary; the rest of the network still has work to do.'
- title: The future cannot supply the training answer
  markdown: 'An autoregressive decoder at position two must not use position three to predict the next token.
    A causal mask excludes future positions from attention. Conceptually, disallowed scores become negative
    infinity, giving those positions zero weight after softmax.


    Masking the third candidate above leaves exponentials [2, 1, 0]. Renormalizing gives [2/3, 1/3, 0]. Merely
    replacing its score by zero would leave exp(0) = 1 and would not exclude it.'
  id: softmax-attention.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.softmax-attention
  text_mode: 'An autoregressive decoder at position two must not use position three to predict the next token.
    A causal mask excludes future positions from attention. Conceptually, disallowed scores become negative
