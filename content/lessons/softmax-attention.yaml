schema_version: 0.2-draft
lesson:
  id: softmax-attention
  version: 0.4.0-draft
  title: From attention scores to a causal mask
  state: draft
  summary: One line of math, softmax(QKᵀ/√d_k)V, runs inside every transformer. Work it by hand on three tokens, and see why one missing mask lets a model cheat.
  slot: M15.3
  category: learning
  sources:
    - title: "Attention Is All You Need, section 3.2.1 and footnote 4 (Vaswani et al., 2017)"
      url: https://arxiv.org/abs/1706.03762
    - title: Dive into Deep Learning — attention scoring functions
      url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/attention-scoring-functions.html
    - title: "The Annotated Transformer (Harvard NLP)"
      url: https://nlp.seas.harvard.edu/annotated-transformer/
objectives:
  - id: objective.softmax-attention
    version: 2-draft
    statement: Compute normalized attention weights and explain how a causal mask prevents future-token leakage.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - softmax-attention.base.v2
      - softmax-attention.transfer.v2
      - softmax-attention.calculate
    prerequisites:
      - anyOf:
          - objective.attention
      - anyOf:
