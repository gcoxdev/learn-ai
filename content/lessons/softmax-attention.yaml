scenes:
  - title: Softmax turns scores into weights
    markdown: |-
      The last lesson left "make" in "bees make honey" with raw scores [2, 0, 2]. You can't mix values with those directly: they don't add up to 1, and scores can be negative. **Softmax** fixes both. Raise $e$ to each score, which makes everything positive, then divide by the total, which makes the results sum to 1.

      Warm up with friendly numbers, treated as already scaled (the next scene explains the scaling). $\ln 2$ is the natural logarithm of 2, the power of $e$ that gives 2, so $e^{\ln 2} = 2$; and $e^0 = 1$. For scores $[\ln 2, 0, 0]$ the exponentials are [2, 1, 1], their total is 4, and the weights are [0.5, 0.25, 0.25]. A score that's bigger by $\ln 2 \approx 0.69$ gets twice the weight.

      These weights mix the value vectors of input positions. They are not probabilities over the vocabulary; that softmax comes much later, at the model's output.
    bridges:
      - powers-logs
      - probability
    type: table
    columns:
      - Candidate
      - Scaled score
      - Exponential
      - Unmasked weight
    rows:
      - - First
        - ln 2
        - 2
        - 0.5
      - - Second
        - 0
        - 1
        - 0.25
      - - Third
        - 0
        - 1
        - 0.25
    id: softmax-attention.s2
    depth: mechanics
    objective_refs:
      - objective.softmax-attention
  - title: Divide by √d_k, or softmax freezes
    markdown: |-
      Before softmax, every score is divided by $\sqrt{d_k}$, where $d_k$ is the number of entries in each query and key. Our toy has $d_k = 2$, so the scores of "make" become $[2, 0, 2] / \sqrt{2} = [1.41, 0, 1.41]$.

      Why? Real heads use $d_k = 64$ or 128. If the entries of a query and a key are roughly random, with average 0 and variance 1, their dot product adds up $d_k$ such products. Its variance is then $d_k$, so its typical size is $\sqrt{d_k}$: about 8 when $d_k = 64$. Scores like [16, 8, 0] are routine.

      :::predict What does softmax do to [16, 8, 0]? And to [16, 8, 0] / 8 = [2, 1, 0]?
      $e^{16} \approx 8{,}886{,}000$ and $e^8 \approx 2{,}981$, so the weights are about [0.99966, 0.00034, 0.0000001]: all on one token. After dividing by 8, the weights are [0.665, 0.245, 0.090], a real blend.
      :::

      A softmax pinned at almost exactly 1 and 0 is **saturated**, and it barely responds to changes in its scores. The rate at which a weight $p$ changes with its own score is $p(1-p)$: $0.99966 \times 0.00034 \approx 0.0003$ when saturated, versus $0.665 \times 0.335 \approx 0.22$ after scaling. Gradients through a saturated softmax are tiny, and $W_Q$ and $W_K$ stop learning. Dividing by $\sqrt{d_k}$ keeps typical scores near 1 whatever the head size.

      ```python run
      import numpy as np

      np.set_printoptions(suppress=True)
      rng = np.random.default_rng(0)
      d_k = 64
      q = rng.standard_normal((10000, d_k))      # 10,000 random queries
      k = rng.standard_normal((10000, d_k))      # and keys, entries with variance 1
      dots = (q * k).sum(axis=1)
      print("typical size of q·k:", dots.std().round(2), " sqrt(d_k) =", np.sqrt(d_k))

      def softmax(s):
          e = np.exp(s - s.max())
          return e / e.sum()

      scores = np.array([16.0, 8.0, 0.0])
      print("softmax(raw):   ", softmax(scores).round(5))
      print("softmax(raw/8): ", softmax(scores / np.sqrt(d_k)).round(5))
      ```

      Try `d_k = 256`: the typical dot product grows to about 16, and you'd divide by 16.
    bridges:
      - vectors
      - powers-logs
    id: softmax-attention.s1
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.softmax-attention
  - title: The future can't supply the answer
    markdown: |-
      A language model, as in the next-token prediction lesson, learns by predicting the next token at every position. At "make", the right answer is "honey". If "make" could attend to "honey", it could simply copy the answer, and the model would learn nothing useful for real generation, where the next word doesn't exist yet.

      A **causal mask** blocks this. Before softmax, every score from a position to a *later* position is set to $-\infty$. Since $e^{-\infty} = 0$, those positions get exactly zero weight, and softmax renormalizes over the rest automatically.

      Back to the warm-up scores $[\ln 2, 0, 0]$ with the third position hidden: the exponentials become [2, 1, 0], the total is 3, and the weights are [2/3, 1/3, 0].

      :::mixup "To hide a position, set its score to 0."
      A score of 0 isn't "nothing": $e^0 = 1$, so the hidden position would still get weight 1/4 here. Zeroing the *weight* after softmax is also wrong, because the remaining weights would no longer sum to 1. Use $-\infty$ before softmax (in code, a very large negative number or `-inf`).
      :::
    id: softmax-attention.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.softmax-attention
  - id: softmax-attention.equation
    title: The whole equation on three tokens
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.softmax-attention
    markdown: |-
      :::papers Scaled dot-product attention
      $$\text{Attention}(Q, K, V) = \text{softmax}\!\left(\frac{QK^\top}{\sqrt{d_k}} + M\right) V$$

      $Q$, $K$, $V$ hold one query, key, and value per row. $QK^\top$ is the grid of every query–key score. $\sqrt{d_k}$ is the scaling. $M$ is the mask: 0 where attending is allowed and $-\infty$ where it isn't (the 2017 paper describes the mask in words; code adds it like this). Softmax runs along each row, and multiplying by $V$ mixes the values.
      :::

      For "bees make honey", with the $Q$, $K$, $V$ from the last lesson and $d_k = 2$, row by row:

      | Row (query) | $QK^\top$ | $\div \sqrt{2}$, then mask | Weights | Output |
      | --- | --- | --- | --- | --- |
      | bees | [0, 2, 2] | [0, −∞, −∞] | [1, 0, 0] | [4, 0] |
      | make | [2, 0, 2] | [1.41, 0, −∞] | [0.804, 0.196, 0] | [3.22, 0.78] |
      | honey | [2, 2, 4] | [1.41, 1.41, 2.83] | [0.164, 0.164, 0.673] | [3.35, 3.35] |

      Walk the "make" row: $e^{1.41} \approx 4.11$ and $e^0 = 1$, total 5.11, weights $4.11/5.11 = 0.804$ and $1/5.11 = 0.196$. The output is $0.804 \times [4, 0] + 0.196 \times [0, 4] = [3.22, 0.78]$.

      ```python run
      import numpy as np

      X = np.array([[1.0, 0.0], [0.0, 1.0], [1.0, 1.0]])   # bees, make, honey
      W_Q = np.array([[0.0, 2.0], [2.0, 0.0]])
      W_K = np.eye(2)
      W_V = 4 * np.eye(2)
      Q, K, V = X @ W_Q, X @ W_K, X @ W_V

      def attention(Q, K, V, causal=True):
          d_k = K.shape[1]
          scores = Q @ K.T / np.sqrt(d_k)                  # QKᵀ/√d_k
          if causal:
              future = np.triu(np.ones(scores.shape, dtype=bool), k=1)
              scores = np.where(future, -np.inf, scores)   # add M: −∞ above the diagonal
          e = np.exp(scores - scores.max(axis=1, keepdims=True))
          weights = e / e.sum(axis=1, keepdims=True)       # softmax, row by row
          return weights, weights @ V

      weights, out = attention(Q, K, V, causal=True)
      print("scaled scores:\n", (Q @ K.T / np.sqrt(2)).round(2))
      print("weights:\n", weights.round(3))
      print("outputs:\n", out.round(2))
      ```

      :::predict Change `causal=True` to `causal=False`. What happens to the "make" row?
      Its weights become [0.446, 0.108, 0.446] and its output [3.57, 2.22]. Almost half the mix now comes from "honey", the very word "make" is supposed to predict. The "honey" row doesn't change at all, because it was already allowed to see everything before it.
      :::
    bridges:
      - matrices-tensors
  - title: Change the query; switch the mask
    markdown: |-
      The experiment below is the "make" row, live. Its keys [1, 0], [0, 1], [1, 1] and values [4, 0], [0, 4], [4, 4] are exactly the $K$ and $V$ from our three tokens, and its first query, [2, 0], is the query of "make". With the causal mask on, you should see weights 0.8 and 0.2 and the output [3.22, 0.78].

      Now switch the query to [0, 2]. The scores become [0, 2, 2], so position two now wins the allowed pair, and the output tilts toward [0, 4]. Then turn the mask off and watch position three, the future token, take its share.

      For an encoder classifying a whole review, the unmasked version is fine. In next-token training, it's a leak.
    simulation: attention
    id: softmax-attention.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.softmax-attention
    bridges:
      - vectors
      - powers-logs
  - title: Whole batches at once, with padding
    markdown: |-
      During training the whole sequence is known, so every row of the grid is computed at once, and the mask gives each row its own allowed columns.

      Batches add one more mask. Sentences in a batch must be the same length, so short ones are filled out with a **padding** token. Put "bees make honey" and "cats nap" in one batch, and the second becomes "cats nap [PAD]". A **padding mask** sets the score to $-\infty$ in the [PAD] column of every row, so no real token ever mixes in padding. In a language model, both masks are added to the same grid:

      | Query | cats | nap | [PAD] |
      | --- | --- | --- | --- |
      | cats | allowed | −∞ (future) | −∞ (both) |
      | nap | allowed | allowed | −∞ (padding) |
      | [PAD] | allowed | allowed | −∞ (padding) |

      The [PAD] row still produces an output, which the loss ignores. Watch for a row where *every* entry is masked: softmax would divide 0 by 0 and produce NaN ("not a number"), which spreads through everything it touches. In custom masks, keep at least one allowed position in every row.
    id: softmax-attention.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.softmax-attention
  - id: softmax-attention.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.softmax-attention
    markdown: Softmax weights to compute by hand, plus a cheating language model, a stalled training run, and a padded batch, test the scaling and masking steps.
    takeaway: |-
      Attention is softmax(QKᵀ/√d_k + M)V. Dividing by √d_k keeps softmax from saturating, and setting blocked scores to −∞ before softmax gives future or padding positions exactly zero weight.
  - id: softmax-attention.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.softmax-attention
    markdown: |-
      Scaled scores become normalized mixing weights. A causal mask changes the eligible positions before normalization, keeping future targets out of an autoregressive position’s input.
