schema_version: 0.2-draft
lesson:
  id: knowledge-graphs
  version: 0.1.0-draft
  title: Store relationships so they can be queried
  state: draft
  summary: Knowledge graphs represent entities and typed relations; ontologies define vocabulary and constraints,
    while queries retrieve patterns without guaranteeing that stored claims are true.
  slot: M04.5
  category: learning
  minutes: 12
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.knowledge-graphs
  version: 1-draft
  statement: Knowledge graphs represent entities and typed relations; ontologies define vocabulary and constraints,
    while queries retrieve patterns without guaranteeing that stored claims are true.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - knowledge-graphs.base
  - knowledge-graphs.transfer
  prerequisites:
  - anyOf:
    - objective.first-order-logic
scenes:
- id: knowledge-graphs.s1
  title: Give objects stable identities
  type: explanation
  depth: intuition
  objective_refs:
  - objective.knowledge-graphs
  markdown: A knowledge graph might contain entities for a researcher, a paper, and an institution. Relations such
    as authored and affiliated-with connect them. Stable identifiers help distinguish two people with the same name
    and connect alternative names for the same person. Identity resolution is a substantive data problem.
  text_mode: A knowledge graph might contain entities for a researcher, a paper, and an institution. Relations such
    as authored and affiliated-with connect them. Stable identifiers help distinguish two people with the same name
    and connect alternative names for the same person. Identity resolution is a substantive data problem.
  bridges: []
- id: knowledge-graphs.s2
  title: Specify the vocabulary
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.knowledge-graphs
  markdown: An ontology defines concepts, relation meanings, and sometimes logical constraints. A type called Paper
    differs from a particular paper entity. A relation may carry time, provenance, or confidence. Without these
    qualifications, a historical affiliation can be mistaken for a current one.
  text_mode: An ontology defines concepts, relation meanings, and sometimes logical constraints. A type called Paper
    differs from a particular paper entity. A relation may carry time, provenance, or confidence. Without these
    qualifications, a historical affiliation can be mistaken for a current one.
  bridges: []
- id: knowledge-graphs.s3
  title: Match a graph pattern
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.knowledge-graphs
  markdown: Suppose Ada authored Paper1, and Paper1 studies TopicX. A query can follow those two edges to find authors
    associated with TopicX through papers. This is pattern matching over represented relations. Additional reasoning
    rules may infer new relations, but those rules and their assumptions must be explicit.
  text_mode: Suppose Ada authored Paper1, and Paper1 studies TopicX. A query can follow those two edges to find
    authors associated with TopicX through papers. This is pattern matching over represented relations. Additional
    reasoning rules may infer new relations, but those rules and their assumptions must be explicit.
  bridges: []
- id: knowledge-graphs.s4
  title: Distinguish missing from false
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.knowledge-graphs
  markdown: A missing edge often means the graph lacks a recorded claim, not that the relationship is false. Some
    systems use an open-world interpretation; particular databases may adopt closed-world conventions for defined
    tasks. Graph embeddings can help rank candidate links, but a predicted link needs evidence before being treated
    as a verified fact.
  text_mode: A missing edge often means the graph lacks a recorded claim, not that the relationship is false. Some
    systems use an open-world interpretation; particular databases may adopt closed-world conventions for defined
    tasks. Graph embeddings can help rank candidate links, but a predicted link needs evidence before being treated
    as a verified fact.
  bridges: []
- id: knowledge-graphs.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.knowledge-graphs
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Knowledge graphs represent entities and typed relations; ontologies define vocabulary and constraints,
    while queries retrieve patterns without guaranteeing that stored claims are true.
- id: knowledge-graphs.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.knowledge-graphs
  markdown: Knowledge graphs represent entities and typed relations; ontologies define vocabulary and constraints,
    while queries retrieve patterns without guaranteeing that stored claims are true.
  text_mode: Knowledge graphs represent entities and typed relations; ontologies define vocabulary and constraints,
    while queries retrieve patterns without guaranteeing that stored claims are true.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - knowledge-graphs.s1
    - knowledge-graphs.s2
    - knowledge-graphs.s3
    - knowledge-graphs.s4
    - knowledge-graphs.check
    gate_refs:
    - gate.core
  scene_aliases:
    knowledge-graphs.recap: knowledge-graphs.check
assessment_families:
- id: knowledge-graphs.base
  objective_ref: objective.knowledge-graphs
  task: base
  response_type: single_choice
  points: 1
  hint: 'Specify the vocabulary: trace the inputs, operation, and result before choosing.'
  remediation_scene: knowledge-graphs.s2
  variants:
  - id: knowledge-graphs.base.1
    prompt: What does an ontology primarily specify?
    options:
    - id: b
      text: Only the screen coordinates of nodes
    - id: c
      text: Only a neural network’s learning rate
    - id: a
      text: Concepts, relation meanings, and relevant constraints
    answer: a
    feedback: An ontology defines the conceptual vocabulary and its semantics.
  - id: knowledge-graphs.base.2
    prompt: Ada authored P, and P studies X. Which query pattern finds Ada through X?
    options:
    - id: c
      text: Multiply the names as numbers
    - id: a
      text: Follow authored then studies
    - id: b
      text: Ignore all edges
    answer: a
    feedback: The path connects the author to the topic through the paper.
- id: knowledge-graphs.transfer
  objective_ref: objective.knowledge-graphs
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Distinguish missing from false: trace the inputs, operation, and result before choosing.'
  remediation_scene: knowledge-graphs.s4
  variants:
  - id: knowledge-graphs.transfer.1
    prompt: A graph has no recorded employer for a person. Under an open-world interpretation, what follows?
    options:
    - id: c
      text: Every company employs the person
    - id: a
      text: The information is missing, not necessarily that the person has no employer
    - id: b
      text: The person has never worked
    answer: a
    feedback: Absence of a recorded claim is not automatically a negative fact.
  - id: knowledge-graphs.transfer.2
    prompt: A link predictor assigns high score to a relation. What should it be treated as?
    options:
    - id: a
      text: A candidate claim needing validation
    - id: b
      text: An automatically verified fact
    - id: c
      text: A proof that the ontology is complete
    answer: a
    feedback: Predictive scores and sourced facts have different evidential roles.
