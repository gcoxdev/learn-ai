schema_version: 0.2-draft
lesson:
  id: knowledge-graphs
  version: 0.4.0-draft
  title: Store relationships so they can be queried
  state: draft
  summary: Have Cillian Murphy and Leonardo DiCaprio ever shared a film? Store movies as a graph of things and links, query it in a few lines, and learn why a missing link isn't a "no."
  slot: M04.5
  category: learning
  sources:
    - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
      url: https://aima.cs.berkeley.edu/
    - title: Wikidata
      url: https://www.wikidata.org/
objectives:
  - id: objective.knowledge-graphs
    version: 2-draft
    statement: Knowledge graphs represent entities and typed relations; ontologies define vocabulary and constraints, while queries retrieve patterns without guaranteeing that stored claims are true.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - knowledge-graphs.base.v2
      - knowledge-graphs.transfer.v2
      - knowledge-graphs.calc
    prerequisites:
      - anyOf:
          - objective.first-order-logic
scenes:
  - id: knowledge-graphs.s1
    title: Settle a film-night argument with a graph
    type: explanation
    depth: intuition
    objective_refs:
      - objective.knowledge-graphs
    markdown: |-
      Movie night. Someone asks, "Which actors have worked with Christopher Nolan more than once?" You could scroll through cast lists for ten minutes, or you could store what you know as a graph and ask it.

      A **knowledge graph** stores facts as things and the links between them. Each thing (a person, a film) is a **node**. Each link is an **edge** with a label saying what the relationship is. One fact is a **triple**: subject, relation, object.

      | Subject | Relation | Object |
      | --- | --- | --- |
      | Christopher Nolan | directed | Inception |
      | Christopher Nolan | directed | Oppenheimer |
      | Cillian Murphy | acted_in | Inception |
      | Cillian Murphy | acted_in | Oppenheimer |
      | Leonardo DiCaprio | acted_in | Inception |

      A triple is just a first-order fact, Directed(Nolan, Inception), written as a row. Following two edges from Nolan answers the movie-night question: Cillian Murphy shows up through both films.

      Names cause trouble fast. "Chris Evans" is both a Marvel actor and a British radio presenter. So real graphs give every node an ID. **Wikidata**, the free, community-edited graph that many Wikipedia pages draw on (launched 2012), calls Douglas Adams Q42, and every Chris Evans gets his own number. Google's Knowledge Graph, introduced the same year under the slogan "things, not strings," uses the same idea.
    diagram:
      caption: A tiny film graph. Nodes are people and films; each labeled arrow is one triple.
      description: Christopher Nolan has "directed" arrows to Inception and Oppenheimer. Leonardo DiCaprio has an "acted in" arrow to Inception. Cillian Murphy has "acted in" arrows to both Inception and Oppenheimer. Emily Blunt has an "acted in" arrow to Oppenheimer.
      nodes:
        - id: nolan
          label: Christopher Nolan
          col: 0
          row: 1
          tone: accent
        - id: inception
          label: Inception
          note: film, 2010
          col: 2
