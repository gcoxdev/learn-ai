schema_version: 0.2-draft
lesson:
  id: knowledge-graphs
  version: 0.3.0-draft
  title: Store relationships so they can be queried
  state: draft
  summary: Draw a few named things and relationships, then ask what the stored links do—and do not—tell you.
  slot: M04.5
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.knowledge-graphs
  version: 1-draft
  statement: Knowledge graphs represent entities and typed relations; ontologies define vocabulary and constraints,
    while queries retrieve patterns without guaranteeing that stored claims are true.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - knowledge-graphs.base
  - knowledge-graphs.transfer
  prerequisites:
  - anyOf:
    - objective.first-order-logic
scenes:
- id: knowledge-graphs.s1
  title: Draw the things and their relationships
  type: explanation
  depth: intuition
  objective_refs:
  - objective.knowledge-graphs
  markdown: 'Draw three labeled circles: Ada, Paper1, and TopicX. Each circle is a **node**, representing an
    entity or thing. Add an arrow labeled “authored” from Ada to Paper1 and another labeled “studies” from
    Paper1 to TopicX. Each arrow is an **edge**, a recorded relationship.


    A knowledge graph stores these relationships in a form a program can query. Stable identifiers help it
    distinguish two people with the same name or recognize two names for the same person. Deciding when records
    refer to the same entity is called **identity resolution**.'
  text_mode: 'Draw three labeled circles: Ada, Paper1, and TopicX. Each circle is a **node**, representing
    an entity or thing. Add an arrow labeled “authored” from Ada to Paper1 and another labeled “studies” from
    Paper1 to TopicX. Each arrow is an **edge**, a recorded relationship.


    A knowledge graph stores these relationships in a form a program can query. Stable identifiers help it
    distinguish two people with the same name or recognize two names for the same person. Deciding when records
    refer to the same entity is called **identity resolution**.'
  bridges: []
- id: knowledge-graphs.s2
  title: Agree on what the labels mean
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.knowledge-graphs
  markdown: 'An **ontology** defines the concepts and relationships used in a graph, sometimes with rules about
    how they fit together. “Paper” names a type of thing; Paper1 names a particular thing of that type.


    Relationships may need extra information. An affiliation should say when it applied, and a disputed claim
    may need a source or confidence value. Otherwise a past employer could be mistaken for a current one.'
  text_mode: 'An **ontology** defines the concepts and relationships used in a graph, sometimes with rules
    about how they fit together. “Paper” names a type of thing; Paper1 names a particular thing of that type.


    Relationships may need extra information. An affiliation should say when it applied, and a disputed claim
    may need a source or confidence value. Otherwise a past employer could be mistaken for a current one.'
  bridges: []
- id: knowledge-graphs.s3
  title: Match a graph pattern
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.knowledge-graphs
  markdown: Suppose Ada authored Paper1, and Paper1 studies TopicX. A query can follow those two edges to find
    authors associated with TopicX through papers. This is pattern matching over represented relations. Additional
    reasoning rules may infer new relations, but those rules and their assumptions must be explicit.
  text_mode: Suppose Ada authored Paper1, and Paper1 studies TopicX. A query can follow those two edges to
    find authors associated with TopicX through papers. This is pattern matching over represented relations.
    Additional reasoning rules may infer new relations, but those rules and their assumptions must be explicit.
  bridges: []
- id: knowledge-graphs.s4
  title: What does a missing link mean?
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.knowledge-graphs
  markdown: 'Suppose the graph has no employer recorded for Ada. Under an **open-world** interpretation, that
    means the graph does not tell us her employer. It does not establish that she has none.


    A **closed-world** convention treats missing entries as false for a specified task. In a complete staff
    register, no membership entry can mean “not on this register.” The convention depends on the task and the
    completeness of its records.


    A learned model can suggest likely missing links, but its prediction still needs evidence. Similarly, a
    missing opening-time record cannot tell us that a museum is closed.'
  text_mode: 'Suppose the graph has no employer recorded for Ada. Under an **open-world** interpretation, that
    means the graph does not tell us her employer. It does not establish that she has none.


    A **closed-world** convention treats missing entries as false for a specified task. In a complete staff
