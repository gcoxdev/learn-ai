    bridges: []
  - id: knowledge-graphs.s2
    title: An ontology says what the labels mean
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.knowledge-graphs
    markdown: |-
      Nothing stops someone from adding (Inception, directed, Christopher Nolan), backward. An **ontology** prevents that kind of mess by defining the graph's vocabulary: which *classes* of thing exist, and what each relation connects.

      | Ontology statement | What it lets the system do |
      | --- | --- |
      | `directed` goes from a Person to a Film | Reject the backward triple above |
      | Documentary is a subclass of Film | Treat *March of the Penguins*, typed Documentary, as a Film too |
      | `acted_in` has an optional *role* | Record that Cillian Murphy played J. Robert Oppenheimer |

      The subclass row is a rule, like the ones from the rule engine lesson: if X is a Documentary and every Documentary is a Film, then X is a Film. The standard web languages for writing ontologies, RDF Schema and OWL (the Web Ontology Language), support rules like this.

      Extra details on a single edge are called **qualifiers**. Wikidata uses them for start and end dates and for roles, and it attaches a source to each statement as a *reference*. They matter: "Ada works at Acme" with no dates can't tell a current job from one she left five years ago.
    bridges: []
  - id: knowledge-graphs.s3
    title: Ask the graph a question
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.knowledge-graphs
    markdown: |-
      A graph query is a pattern with variables, and the database finds every way to fill them in. That's unification again, run over millions of triples. Here is "actors who worked with Nolan" in **SPARQL**, the standard query language for triple stores (Wikidata's public query service speaks it):

      ```sparql
      SELECT DISTINCT ?actor WHERE {
        :ChristopherNolan  :directed  ?film .
        ?actor             :actedIn   ?film .
      }
      ```

      The shared variable `?film` joins the two patterns, exactly like the shared y in the grandparent rule. Graph databases such as Neo4j use **Cypher**, which draws the path with arrows:

      ```cypher
      MATCH (:Person {name: "Christopher Nolan"})-[:DIRECTED]->(f:Film)<-[:ACTED_IN]-(a:Person)
      RETURN DISTINCT a.name
      ```

      Under the hood it's the same idea as this Python version:

      ```python run
      triples = [
          ("Christopher Nolan", "directed", "Inception"),
          ("Christopher Nolan", "directed", "Oppenheimer"),
          ("Martin Scorsese", "directed", "The Wolf of Wall Street"),
          ("Greta Gerwig", "directed", "Barbie"),
          ("Leonardo DiCaprio", "acted_in", "Inception"),
          ("Leonardo DiCaprio", "acted_in", "The Wolf of Wall Street"),
          ("Cillian Murphy", "acted_in", "Inception"),
          ("Cillian Murphy", "acted_in", "Oppenheimer"),
          ("Emily Blunt", "acted_in", "Oppenheimer"),
          ("Margot Robbie", "acted_in", "The Wolf of Wall Street"),
          ("Margot Robbie", "acted_in", "Barbie"),
      ]

      def match(s=None, p=None, o=None):
          """Return every triple that fits the pattern; None is a wildcard."""
          return [t for t in triples
                  if (s is None or t[0] == s) and (p is None or t[1] == p)
                  and (o is None or t[2] == o)]

      director = "Christopher Nolan"     # which actors have worked with this director?
      answer = set()
      for _, _, film in match(director, "directed"):
          for actor, _, _ in match(None, "acted_in", film):
              answer.add(actor)
      print("Worked with", director + ":", sorted(answer))
      ```

      Change `director` to `"Martin Scorsese"` and predict the answer before running. (DiCaprio and Robbie.)
    bridges: []
  - id: knowledge-graphs.s4
    title: A missing link isn't a "no"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.knowledge-graphs
    markdown: |-
      :::predict Our 11-triple graph lists Emily Blunt in exactly one film. Has she acted in only one film?
      No. She starred in *The Devil Wears Prada* and many others; our graph just doesn't record them. The graph tells you what it knows, not everything that's true.
      :::

      What a missing fact means is a design choice, and it has two standard names:

      | | **Closed-world assumption** | **Open-world assumption** |
      | --- | --- | --- |
      | A fact that isn't recorded is… | false | unknown |
      | Fits data that is… | complete by design | partial, still growing |
      | Example | a cinema's showtimes: not listed means not showing | Wikidata: no award recorded doesn't mean no award |
      | Typical systems | SQL databases, Prolog | Wikidata, OWL ontologies |

      :::mixup "The query found no award for her, so she has never won one."
      On an open-world graph, "no result" means "none recorded." Before answering "no," ask whether the data was meant to be complete. A company's staff directory is; a community-edited encyclopedia of every actor on Earth is not.
      :::

      Machine-learning models can help fill gaps: *link prediction* models learn from a graph's patterns and score likely missing edges, such as an actor probably appearing in a film. Store their output as a candidate, marked "predicted," until a source confirms it.
    bridges: []
  - id: knowledge-graphs.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.knowledge-graphs
    markdown: Staff directories, recipe allergens, research papers, and cinema schedules test whether you can write a graph pattern and tell "not recorded" from "false."
    takeaway: |-
      A knowledge graph stores facts as labeled links between things with stable IDs, and a query finds every way to fill in a pattern's variables. Before reading a missing link as "no," check whether the data is meant to be complete.
  - id: knowledge-graphs.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.knowledge-graphs
    markdown: |-
      A knowledge graph connects named things through defined relationships. Queries follow those links; the quality of the answer still depends on the stored claims and what missing links mean.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - knowledge-graphs.s1
        - knowledge-graphs.s2
        - knowledge-graphs.s3
        - knowledge-graphs.s4
        - knowledge-graphs.check
      gate_refs:
        - gate.core
  scene_aliases:
    knowledge-graphs.recap: knowledge-graphs.check
assessment_families:
  - id: knowledge-graphs.base
    objective_ref: objective.knowledge-graphs
    task: base
    response_type: single_choice
    points: 1
    hint: 'Specify the vocabulary: trace the inputs, operation, and result before choosing.'
    remediation_scene: knowledge-graphs.s2
    variants:
      - id: knowledge-graphs.base.1
        prompt: What does an ontology primarily specify?
        options:
          - id: b
            text: Only the screen coordinates of nodes
          - id: c
            text: Only a neural network’s learning rate
          - id: a
            text: Concepts, relation meanings, and relevant constraints
        answer: a
        feedback: An ontology defines the conceptual vocabulary and its semantics.
        retired: true
      - id: knowledge-graphs.base.2
        prompt: Ada authored P, and P studies X. Which query pattern finds Ada through X?
        options:
          - id: c
            text: Multiply the names as numbers
          - id: a
            text: Follow authored then studies
          - id: b
            text: Ignore all edges
        answer: a
        feedback: The path connects the author to the topic through the paper.
        retired: true
  - id: knowledge-graphs.transfer
    objective_ref: objective.knowledge-graphs
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Distinguish missing from false: trace the inputs, operation, and result before choosing.'
    remediation_scene: knowledge-graphs.s4
    variants:
      - id: knowledge-graphs.transfer.1
        prompt: A graph has no recorded employer for a person. Under an open-world interpretation, what follows?
        options:
          - id: c
            text: Every company employs the person
          - id: a
            text: The information is missing, not necessarily that the person has no employer
          - id: b
            text: The person has never worked
        answer: a
        feedback: Absence of a recorded claim is not automatically a negative fact.
        retired: true
      - id: knowledge-graphs.transfer.2
        prompt: A link predictor assigns high score to a relation. What should it be treated as?
        options:
          - id: a
            text: A candidate claim needing validation
          - id: b
            text: An automatically verified fact
          - id: c
            text: A proof that the ontology is complete
        answer: a
        feedback: Predictive scores and sourced facts have different evidential roles.
        retired: true
  - id: knowledge-graphs.base.v2
    objective_ref: objective.knowledge-graphs
    task: base
    response_type: single_choice
    points: 1
    hint: Write each fact as (subject, relation, object) and check the direction of every edge. Shared variables must join the patterns.
    remediation_scene: knowledge-graphs.s3
    variants:
      - id: knowledge-graphs.base.v2.1
        prompt: The graph stores facts like (Cillian Murphy, acted_in, Oppenheimer). Which pattern finds every film Murphy acted in?
        options:
          - id: b
            text: (?film, acted_in, Cillian Murphy)
          - id: a
            text: (Cillian Murphy, acted_in, ?film)
          - id: c
            text: (Cillian Murphy, ?relation, Oppenheimer)
        answer: a
        feedback: The actor is the subject and the film is the object, so the variable goes in the object slot. Reversing the pattern matches nothing, and the third pattern finds relations between Murphy and one known film.
      - id: knowledge-graphs.base.v2.2
        prompt: Which pair of patterns finds actors who have worked with Greta Gerwig as director?
        options:
          - id: c
            text: (Gerwig, acted_in, ?film) and (?actor, directed, ?film)
          - id: b
            text: (?actor, directed, ?film) and (?actor, acted_in, ?film)
          - id: a
            text: (Gerwig, directed, ?film) and (?actor, acted_in, ?film)
        answer: a
        feedback: Gerwig directs the film and the actor acts in it, joined by the shared ?film. Swapping the relations asks about films Gerwig acted in, and reusing ?actor in both patterns finds people who directed their own film.
      - id: knowledge-graphs.base.v2.3
        prompt: The graph states (March of the Penguins, type, Documentary). The ontology says Documentary is a subclass of Film. A query asks for every Film. What happens?
        options:
          - id: a
            text: It's returned, because the system can infer it's a Film
          - id: c
            text: It's skipped, because no triple says its type is Film
          - id: b
            text: The query fails, because the film has two conflicting types
        answer: a
        feedback: A system that applies the ontology treats the subclass statement as a rule, so Documentary implies Film. Being a Documentary and a Film at once is no conflict; every documentary is a film.
      - id: knowledge-graphs.base.v2.4
        prompt: A graph has two nodes both labeled "Chris Evans," the actor and the radio presenter, but a query matches by label. It lists radio shows among the actor's films. What is the fix?
        options:
          - id: b
            text: Merge the two nodes, since their names are the same
          - id: a
            text: Give each person a separate ID and query by that ID
          - id: c
            text: Add more film triples so they outweigh the radio ones
        answer: a
        feedback: Names aren't unique, so graphs identify things by ID, as Wikidata does with Q-numbers. Merging would make the mix-up permanent, and extra triples don't separate two people.
      - id: knowledge-graphs.base.v2.5
        prompt: An open-world graph records Emily Blunt in one film. How should a system answer "How many films has she acted in?"
        options:
          - id: c
            text: Zero, since the count isn't stored as a fact
          - id: b
            text: Exactly one, since that's what the graph holds
          - id: a
            text: At least one is recorded, and there may be more
        answer: a
        feedback: Under the open-world assumption, unrecorded films are unknown, not absent. "Exactly one" is the closed-world reading, which only fits data that is complete by design.
  - id: knowledge-graphs.transfer.v2
    objective_ref: objective.knowledge-graphs
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask whether this data was meant to be complete. Then decide whether a missing or predicted link is a fact, a candidate, or simply unknown.
    remediation_scene: knowledge-graphs.s4
    variants:
      - id: knowledge-graphs.transfer.v2.1
        prompt: A company's HR system is kept as the complete list of current employees. A search for "Jo Park" returns nothing. What is reasonable to conclude?
        options:
          - id: a
            text: Jo isn't a current employee, since the list is meant to be complete
          - id: b
            text: Nothing, since missing records never tell you anything
          - id: c
            text: Jo is an employee whose record simply hasn't been added
        answer: a
        feedback: A register that is complete by design justifies the closed-world assumption, so missing means "not an employee." Treating every gap as unknown throws away what a complete list is for.
      - id: knowledge-graphs.transfer.v2.2
        prompt: A query on a community-edited graph lists 300 scientists with no "award received" statement. A blog headline reads "300 scientists who never won an award." What is wrong?
        options:
          - id: b
            text: The graph needs an ontology rule saying who can win awards
          - id: c
            text: Nothing is wrong, as long as the query itself ran correctly
          - id: a
            text: The graph is open-world, so those awards may just be unrecorded
        answer: a
        feedback: A community-edited graph is partial, so no statement means no record, not no award. A correct query over incomplete data still answers "none recorded."
      - id: knowledge-graphs.transfer.v2.3
        prompt: A model trained on a medical knowledge graph gives a high score to the link "Drug X treats Disease Y." How should the graph store it?
        options:
          - id: c
            text: As a fact, since the model's score is high
          - id: a
            text: As a candidate marked "predicted," pending a source
          - id: b
            text: Not at all, since a model can't suggest links
        answer: a
        feedback: Link prediction finds likely gaps, which is useful, but a score isn't a source. Keeping it as a labeled candidate preserves the suggestion without mixing it into confirmed facts.
      - id: knowledge-graphs.transfer.v2.4
        prompt: A graph says (Ada, employer, Acme). Ada left Acme in 2021 for Beta, and a recruiter's query still lists her at Acme. What is the best fix?
        options:
          - id: a
            text: Add start and end dates as qualifiers on employer edges
          - id: b
            text: Delete the Acme edge so that only current jobs remain
          - id: c
            text: Add (Ada, employer, Beta) and leave both edges as they are
        answer: a
        feedback: Dates let one graph answer both "where does she work now?" and "where has she worked?" Deleting loses her history, and two undated employer edges leave the recruiter guessing which is current.
      - id: knowledge-graphs.transfer.v2.5
        prompt: A recipe graph has (dish, contains, ingredient) and (ingredient, allergen, nut) edges. Which patterns find dishes that contain a nut allergen?
        options:
          - id: b
            text: (?dish, allergen, nut) on its own
          - id: a
            text: (?dish, contains, ?i) and (?i, allergen, nut)
          - id: c
            text: (?i, contains, ?dish) and (?dish, allergen, nut)
        answer: a
        feedback: Allergens attach to ingredients, so the query must hop from dish to ingredient to allergen, joined by ?i. The one-step pattern looks for allergen edges on dishes, which this graph doesn't have, and the third reverses both edges.
  - id: knowledge-graphs.calc
    objective_ref: objective.knowledge-graphs
    task: base
    response_type: numeric
    points: 1
    hint: Follow the first pattern to collect the middle nodes, then follow the second pattern from each one. Count distinct answers only once.
    remediation_scene: knowledge-graphs.s3
    absolute_tolerance: 0.01
    variants:
      - id: knowledge-graphs.calc.1
        prompt: 'Triples: (Ana, authored, P1), (Ben, authored, P1), (Ben, authored, P2), (Cy, authored, P3), (P1, studies, Bees), (P2, studies, Bees), (P3, studies, Ants). How many distinct authors wrote a paper that studies Bees?'
        answer: 2
        feedback: P1 and P2 study Bees. Their authors are Ana and Ben (Ben wrote both), so 2 distinct authors.
      - id: knowledge-graphs.calc.2
        prompt: 'Triples: (Ana, authored, P1), (Ben, authored, P1), (Ben, authored, P2), (Cy, authored, P3), (P1, studies, Bees), (P2, studies, Bees), (P3, studies, Ants). How many distinct topics has Ben written about?'
        answer: 1
        feedback: Ben wrote P1 and P2, and both study Bees. Two papers, but only 1 distinct topic.
      - id: knowledge-graphs.calc.3
        prompt: 'Triples: (Kim, acted_in, F1), (Lou, acted_in, F1), (Lou, acted_in, F2), (Max, acted_in, F2), (Ned, acted_in, F3). How many distinct people have acted in a film with Lou, not counting Lou?'
        answer: 2
        feedback: Lou's films are F1 and F2. Kim was in F1 and Max in F2. Ned's F3 doesn't connect, so 2 co-stars.
      - id: knowledge-graphs.calc.4
        prompt: 'Triples: (Rae, directed, F1), (Rae, directed, F2), (Sol, acted_in, F1), (Tia, acted_in, F1), (Tia, acted_in, F2), (Uma, acted_in, F2), (Vic, acted_in, F3). How many distinct actors have worked with Rae as director?'
        answer: 3
        feedback: Rae directed F1 and F2. Their actors are Sol, Tia, and Uma; Tia appears twice but counts once. Vic's F3 isn't Rae's.
      - id: knowledge-graphs.calc.5
        prompt: 'A cinema''s complete schedule lists (Film A, shows_at, 6pm), (Film A, shows_at, 9pm), (Film B, shows_at, 6pm), (Film C, shows_at, 9pm). Using the closed-world assumption, how many of the three films are not showing at 9pm?'
        answer: 1
        feedback: Films A and C have a 9pm triple. Film B has none, and because the schedule is complete, missing means "not showing." That's 1 film.
