        - id: oppenheimer
          label: Oppenheimer
          note: film, 2023
          col: 2
          row: 2
          tone: data
        - id: dicaprio
          label: Leonardo DiCaprio
          col: 4
          row: 0
        - id: murphy
          label: Cillian Murphy
          col: 4
          row: 1
        - id: blunt
          label: Emily Blunt
          col: 4
          row: 2
      edges:
        - from: nolan
          to: inception
