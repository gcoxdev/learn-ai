lesson:
  id: bandits-and-exploration
  version: 0.4.0-draft
  title: Choose between known rewards and learning about alternatives
  state: draft
  summary: Pip has three charging docks and one guess a night. Stick with the dock that worked, or give the one that failed another chance? Meet the dilemma at the heart of learning by trial.
  slot: M24.2
  category: learning
