objectives:
  - id: objective.bandits-and-exploration
    version: 2-draft
    statement: Bandit methods balance exploration and exploitation for repeated choices; contextual features, uncertainty, and changing reward distributions determine suitable decision rules.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - bandits-and-exploration.base.v2
      - bandits-and-exploration.transfer.v2
      - bandits-and-exploration.calculate
    prerequisites:
      - anyOf:
          - objective.reinforcement-learning-loop
      - anyOf:
