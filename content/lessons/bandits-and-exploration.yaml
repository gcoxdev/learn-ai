scenes:
  - id: bandits-and-exploration.s1
    title: Three docks, one choice a night
    type: explanation
    depth: intuition
    objective_refs:
      - objective.bandits-and-exploration
    markdown: |-
      Pip's owners bought three charging docks: one in the Hall, one in the Kitchen, one in the Study. Each night Pip picks one. If it charges, Pip gets reward 1; if the finicky contacts slip, reward 0. Each dock has a fixed success rate that Pip doesn't know. (We do: Hall 0.4, Kitchen 0.6, Study 0.75.)

      There's no route here: tonight's choice doesn't change where Pip starts tomorrow. This stripped-down problem, a repeated choice among options with unknown average rewards, is called a **multi-armed bandit**. The name comes from slot machines, once nicknamed "one-armed bandits", each paying out at its own hidden rate. Each option is an **arm**.

      Suppose Pip tries each dock once. The Hall and Study docks slip (0); the Kitchen dock works (1). A purely **greedy** rule, always pick the best average so far, now sends Pip to the Kitchen forever. The Study dock, actually the best, never gets a second chance.

      That's the tension in every bandit:

      - **Exploit**: use the arm that looks best now, and collect reward tonight.
      - **Explore**: try an arm you're unsure about, and collect information for later.

      Too little exploration locks in early bad luck. Too much wastes nights on docks already known to be poor.
    bridges: []
  - id: bandits-and-exploration.s2
    title: "Epsilon-greedy: usually the best, sometimes a dice roll"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.bandits-and-exploration
    markdown: |-
      The simplest fix is **epsilon-greedy**: with a small probability $\varepsilon$ (epsilon), choose a dock uniformly at random; otherwise choose the best average so far.

      Say Pip's current averages are Hall 0.5, Kitchen 0.6, Study 0.3, and $\varepsilon = 0.1$.

      :::predict How often does Pip pick the Kitchen dock tonight?
      Not 90%. The random 10% can also land on the Kitchen:

      $$P(\text{Kitchen}) = (1 - \varepsilon) + \frac{\varepsilon}{k} = 0.9 + \frac{0.1}{3} \approx 0.933$$

      where $k = 3$ is the number of arms. Hall and Study each get $0.1/3 \approx 0.033$.
      :::

      The program runs 200 simulated Pips for 1,000 nights each and compares three values of $\varepsilon$.

      ```python run
      import numpy as np

      true_rates = np.array([0.4, 0.6, 0.75])   # Hall, Kitchen, Study (hidden from Pip)

      def run(epsilon, nights=1000, seed=0):
          rng = np.random.default_rng(seed)
          counts = np.zeros(3)
          estimates = np.zeros(3)
          total = 0
          for night in range(nights):
              if night < 3:
                  dock = night                           # try each dock once
              elif rng.random() < epsilon:
                  dock = rng.integers(3)                 # explore: any dock at random
              else:
                  dock = int(np.argmax(estimates))       # exploit: best estimate so far
              reward = int(rng.random() < true_rates[dock])
              counts[dock] += 1
              estimates[dock] += (reward - estimates[dock]) / counts[dock]
              total += reward
          return total / nights, counts[2] / nights

      for eps in [0.0, 0.1, 0.3]:
          results = [run(eps, seed=s) for s in range(200)]
          avg_reward = np.mean([r for r, _ in results])
          study_share = np.mean([s for _, s in results])
          print(f"epsilon = {eps}: average charge rate {avg_reward:.3f}, "
                f"picks the Study dock {study_share:.0%} of nights")
      ```

      Greedy charges 67.6% of nights: many runs lock onto the wrong dock. With ε = 0.1 the rate rises to 71.9%. At ε = 0.3 it falls back to 69.5%, because Pip keeps retrying docks it knows are worse. Try ε = 0.05.
    bridges: []
  - id: bandits-and-exploration.s3
    title: Explore where you're unsure, not at random
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.bandits-and-exploration
    markdown: |-
      Epsilon-greedy explores blindly. Two smarter ideas aim exploration where Pip knows least. After 100 nights, Pip's record is: Kitchen 80 tries, average 0.6; Hall 15 tries, average 0.5; Study 5 tries, average 0.4.

      **Optimism under uncertainty (UCB).** Score each arm by its average plus a bonus that is large for rarely tried arms. The classic **UCB1** rule (Auer, Cesa-Bianchi & Fischer, 2002) picks

      $$a_t = \arg\max_a \left[\hat{\mu}_a + \sqrt{\frac{2 \ln t}{N_a}}\right]$$

      where $\hat{\mu}_a$ is arm $a$'s average reward, $N_a$ is how often it has been tried, and $t$ is the number of nights so far. With $t = 100$, $\ln 100 \approx 4.61$:

      | Dock | Average | Tries | Bonus | Score |
      | --- | ---: | ---: | ---: | ---: |
      | Kitchen | 0.6 | 80 | 0.34 | 0.94 |
      | Hall | 0.5 | 15 | 0.78 | 1.28 |
      | Study | 0.4 | 5 | 1.36 | **1.76** |

      UCB tries the Study dock: so little is known that it *could* be best. Each try shrinks its bonus, so a truly poor arm soon drops out.

      **Thompson sampling** (proposed by William R. Thompson in 1933) keeps a probability distribution over each arm's success rate, usually $\text{Beta}(1 + \text{successes},\ 1 + \text{failures})$. Each night it draws one plausible rate per arm and picks the highest draw. The Kitchen's Beta(49, 33) is narrow around 0.6. The Study's Beta(3, 4) is wide, so its draw beats the Kitchen's about one night in five. Arms get explored in proportion to their chance of being best.
    bridges: []
  - id: bandits-and-exploration.s4
    title: Count the cost of learning with regret
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.bandits-and-exploration
    markdown: |-
      To compare strategies, measure the reward they gave up compared with always choosing the best arm. That shortfall is **regret**.

      :::papers Expected regret after T rounds
      $$\text{Regret}(T) = T\mu^* - \sum_{t=1}^{T} \mu_{a_t}$$

      $\mu^*$ is the best arm's true average (Study, 0.75) and $\mu_{a_t}$ is the true average of the arm chosen on night $t$.
      :::

      Over 100 nights, a greedy Pip that locked onto the Kitchen earns an expected $100 \times 0.6 = 60$ charges. The best possible is $100 \times 0.75 = 75$, so its regret is 15. A Pip that chose Study 80 times, Kitchen 14 and Hall 6 earns $60 + 8.4 + 2.4 = 70.8$, a regret of 4.2.

      What matters most is how regret *grows*. Greedy stuck on the Kitchen loses 0.15 every night: a straight line. Fixed-ε exploration never stops, so it also grows in a straight line, just more slowly. UCB1 and Thompson sampling grow like $\log T$, because their exploration fades as evidence piles up. Lai and Robbins showed in 1985 that logarithmic growth is the best any strategy can manage in general.

      :::mixup "Exploration is wasted nights."
      Each exploring night costs a little now, but a bandit that never explores can pay forever for one unlucky sample. Aim for low total regret, not zero exploration.
      :::
    bridges: []
  - id: bandits-and-exploration.s5
    title: When the best dock depends on the night
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.bandits-and-exploration
    markdown: |-
      **Context.** On nights after the floors are mopped, the Kitchen dock's contacts are damp and fail more often. A **contextual bandit** sees the situation (mopped today or not) before choosing and learns the best arm *for each context*. A 2010 Yahoo! study (Li et al.) chose front-page news stories this way. Pip only learns how its chosen dock did, never what the others would have done, so each night log the probability it had of picking the dock it chose. That later lets you estimate how a different strategy would have performed.

      **Drift.** Suppose the Study dock breaks after 400 nights and now succeeds only 20% of the time. A plain average barely notices: after 400 nights at 0.75, ten failures move it only to $300/410 \approx 0.73$. A constant step size forgets faster:

      $$Q \leftarrow Q + \alpha\,(R - Q)$$

      With $\alpha = 0.1$, each failure multiplies the estimate by 0.9, so ten failures drop 0.75 to $0.75 \times 0.9^{10} \approx 0.26$. Pip switches docks within days; the plain average would need about 150 more nights. The price is noisier estimates, so match $\alpha$ to how fast your world really changes.
    bridges: []
  - id: bandits-and-exploration.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.bandits-and-exploration
    markdown: Headline tests, coffee shops, ad slots, and a few epsilon-greedy calculations test whether you can tell smart exploration from wasted exploration.
    takeaway: |-
      Exploit to earn reward now, explore to learn which arm is really best. Aim exploration at uncertain arms, as UCB and Thompson sampling do, and your total regret grows only slowly.
  - id: bandits-and-exploration.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.bandits-and-exploration
    markdown: |-
      Exploit an option to use what you know; explore to learn about alternatives. A good balance depends on uncertainty, context, and how rewards change.
