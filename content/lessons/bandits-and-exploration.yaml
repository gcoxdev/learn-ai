schema_version: 0.2-draft
lesson:
  id: bandits-and-exploration
  version: 0.1.0-draft
  title: Choose between known rewards and learning about alternatives
  state: draft
  summary: Bandit methods balance exploration and exploitation for repeated choices; contextual features, uncertainty,
    and changing reward distributions determine suitable decision rules.
  slot: M24.2
  category: learning
  minutes: 12
  sources:
  - title: Bandit Algorithms — authors’ open book
    url: https://tor-lattimore.com/downloads/book/book.pdf
  - title: Dive into Deep Learning — reinforcement learning
    url: https://d2l.ai/chapter_reinforcement-learning/index.html
objectives:
- id: objective.bandits-and-exploration
  version: 1-draft
  statement: Bandit methods balance exploration and exploitation for repeated choices; contextual features, uncertainty,
    and changing reward distributions determine suitable decision rules.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - bandits-and-exploration.base
  - bandits-and-exploration.transfer
  prerequisites:
  - anyOf:
    - objective.reinforcement-learning-loop
  - anyOf:
    - objective.statistics-evidence
scenes:
- id: bandits-and-exploration.s1
  title: Simplify away state transitions
  type: explanation
  depth: intuition
  objective_refs:
  - objective.bandits-and-exploration
  markdown: A basic bandit chooses an arm and observes its reward, without modeling action-dependent future states.
    Exploitation chooses what currently appears best; exploration gathers information about alternatives. An unlucky
    early sample can make a good option look poor.
  text_mode: A basic bandit chooses an arm and observes its reward, without modeling action-dependent future states.
    Exploitation chooses what currently appears best; exploration gathers information about alternatives. An unlucky
    early sample can make a good option look poor.
  bridges: []
- id: bandits-and-exploration.s2
  title: Compare simple strategies
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bandits-and-exploration
  markdown: Epsilon-greedy chooses a random action some fraction of the time and otherwise uses the estimated best.
    Upper-confidence methods add an uncertainty bonus; Thompson sampling samples from a reward model’s posterior
    and acts on that draw. Each depends on assumptions about rewards and uncertainty.
  text_mode: Epsilon-greedy chooses a random action some fraction of the time and otherwise uses the estimated best.
    Upper-confidence methods add an uncertainty bonus; Thompson sampling samples from a reward model’s posterior
    and acts on that draw. Each depends on assumptions about rewards and uncertainty.
  bridges: []
- id: bandits-and-exploration.s3
  title: Use context when choices differ by situation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bandits-and-exploration
  markdown: A contextual bandit conditions decisions on observed features such as device type or request category.
    It receives feedback for the selected action, not automatically every alternative. A recommendation experiment
    therefore needs logging and evaluation that acknowledge selective observation.
  text_mode: A contextual bandit conditions decisions on observed features such as device type or request category.
    It receives feedback for the selected action, not automatically every alternative. A recommendation experiment
    therefore needs logging and evaluation that acknowledge selective observation.
  bridges: []
- id: bandits-and-exploration.s4
  title: Watch changing environments
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bandits-and-exploration
  markdown: If rewards change over time, an estimate averaging all past outcomes can adapt slowly. Windowing or
    discounting data may help while increasing uncertainty. Measure regret or task utility under stated assumptions,
    and constrain exploration when bad actions have meaningful costs.
  text_mode: If rewards change over time, an estimate averaging all past outcomes can adapt slowly. Windowing or
    discounting data may help while increasing uncertainty. Measure regret or task utility under stated assumptions,
    and constrain exploration when bad actions have meaningful costs.
  bridges: []
- id: bandits-and-exploration.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.bandits-and-exploration
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: bandits-and-exploration.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.bandits-and-exploration
  markdown: Bandit methods balance exploration and exploitation for repeated choices; contextual features, uncertainty,
    and changing reward distributions determine suitable decision rules.
  text_mode: Bandit methods balance exploration and exploitation for repeated choices; contextual features, uncertainty,
    and changing reward distributions determine suitable decision rules.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - bandits-and-exploration.s1
