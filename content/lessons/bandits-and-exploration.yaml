assessment_families:
  - id: bandits-and-exploration.base
    objective_ref: objective.bandits-and-exploration
    task: base
    response_type: single_choice
    points: 1
    hint: 'Compare simple strategies: trace the inputs, operation, and result before choosing.'
    remediation_scene: bandits-and-exploration.s2
    variants:
      - id: bandits-and-exploration.base.1
        prompt: What does exploitation select?
        options:
          - id: b
            text: An action chosen solely to gain information
          - id: c
            text: Every action simultaneously
          - id: a
            text: The action currently estimated best
        answer: a
        feedback: Exploitation uses current reward estimates.
        retired: true
      - id: bandits-and-exploration.base.2
        prompt: Why can an early unlucky sample be harmful?
        options:
          - id: c
            text: It reveals every counterfactual reward
          - id: a
            text: It can discourage further trials of a good arm
          - id: b
            text: It proves the arm is always bad
        answer: a
        feedback: Sparse evidence can mislead estimates.
        retired: true
  - id: bandits-and-exploration.transfer
    objective_ref: objective.bandits-and-exploration
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Watch changing environments: trace the inputs, operation, and result before choosing.'
    remediation_scene: bandits-and-exploration.s4
    variants:
      - id: bandits-and-exploration.transfer.1
        prompt: Does selecting one recommendation reveal rewards for all unshown items?
        options:
          - id: c
            text: Only in contextual bandits
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Feedback is usually selective.
        retired: true
      - id: bandits-and-exploration.transfer.2
        prompt: Why discount old outcomes in a changing environment?
        options:
          - id: a
            text: To adapt estimates toward recent reward conditions
          - id: b
            text: To guarantee zero uncertainty
          - id: c
            text: To remove the need for exploration
        answer: a
        feedback: Recency can matter when reward distributions shift.
        retired: true
  - id: bandits-and-exploration.base.v2
    objective_ref: objective.bandits-and-exploration
    task: base
    response_type: single_choice
    points: 1
    hint: Ask how much each strategy knows about each arm. Good exploration goes where the estimate is least certain, not where it is lowest.
    remediation_scene: bandits-and-exploration.s3
    variants:
      - id: bandits-and-exploration.base.v2.1
        prompt: A greedy learner tries arm X once (reward 0) and arm Y once (reward 1), then picks Y every round afterwards. Arm X is actually better. What went wrong?
        options:
          - id: b
            text: Arm Y's single success was counted twice in its average
          - id: a
            text: One unlucky sample made X look worse, and it was never retried
          - id: c
            text: The learner explored too much and diluted Y's average
        answer: a
        feedback: A greedy rule never revisits an arm whose early estimate is low, so one bad draw becomes permanent. Nothing was double-counted, and this learner explored too little, not too much.
      - id: bandits-and-exploration.base.v2.2
        prompt: 'Under UCB1, arm P has average 0.7 after 200 tries and arm Q has average 0.5 after 4 tries. Why might UCB1 pick Q next?'
        options:
          - id: c
            text: UCB1 picks the arm with the lower average to keep things fair
          - id: b
            text: Q's reward is likely to rise because it is due for a success
          - id: a
            text: Q's few tries give it a large uncertainty bonus on top of 0.5
        answer: a
        feedback: The bonus √(2 ln t / N) is large when N is small, so Q's optimistic score can exceed P's. UCB1 doesn't favor low averages as such, and past failures don't make a success "due".
      - id: bandits-and-exploration.base.v2.3
        prompt: In Thompson sampling, arm A has a narrow distribution around 0.6 and arm B a wide one around 0.45. What happens over many rounds?
        options:
          - id: a
            text: B is chosen sometimes, whenever its random draw beats A's
          - id: b
            text: B is never chosen, because its center is below A's center
          - id: c
            text: A and B are chosen equally often until their centers match
        answer: a
        feedback: Each round draws one plausible rate per arm. B's wide distribution sometimes produces a draw above A's, so B gets explored in proportion to its chance of being best. Comparing centers alone would be greedy.
      - id: bandits-and-exploration.base.v2.4
        prompt: Two strategies each ran for 10,000 rounds. Strategy F's regret keeps growing by the same amount every 1,000 rounds; strategy G's regret grows more and more slowly. Which description fits?
        options:
          - id: b
            text: F is UCB1 and G is epsilon-greedy with a fixed epsilon
          - id: a
            text: F is epsilon-greedy with a fixed epsilon and G is UCB1
          - id: c
            text: Both are greedy, and G happened to start on the best arm
        answer: a
        feedback: Fixed-epsilon exploration never stops, so it pays a steady cost each round and regret grows in a straight line. UCB1's bonuses shrink as evidence accumulates, giving logarithmic growth. A lucky greedy start would give flat regret, not slowing growth.
  - id: bandits-and-exploration.transfer.v2
    objective_ref: objective.bandits-and-exploration
    task: transfer
    response_type: single_choice
    points: 1
    hint: Decide first whether the problem is uncertainty, context, or change over time, then pick the strategy that targets it.
    remediation_scene: bandits-and-exploration.s5
    variants:
      - id: bandits-and-exploration.transfer.v2.1
        prompt: A news site tests four headlines for one story. After 50 visitors, headline C leads with 6 clicks from 20 views; headline D has 0 clicks from 2 views. What should a bandit strategy do next?
        options:
          - id: c
            text: Show C to every visitor, since it has the most clicks
          - id: a
            text: Keep showing D sometimes, since two views say little
          - id: b
            text: Drop D, since its measured click rate is zero
        answer: a
        feedback: D's zero rests on only two views, so its true rate is highly uncertain and worth more tries. Dropping D or committing to C is the greedy mistake of trusting a tiny early sample.
      - id: bandits-and-exploration.transfer.v2.2
        prompt: A coffee chain uses a bandit to choose which pastry to promote. Sales patterns are very different on weekday mornings and weekend afternoons. What is the best change?
        options:
          - id: a
            text: Use a contextual bandit that sees the day and time
          - id: b
            text: Raise epsilon so that every pastry is tried more often
          - id: c
            text: Average sales over both periods to smooth out the noise
        answer: a
        feedback: The best arm depends on the situation, so the learner needs that situation as input. More random exploration or pooled averages would still pick one pastry for both periods.
      - id: bandits-and-exploration.transfer.v2.3
        prompt: An ad system's best-performing ad starts losing clicks after a competitor launches, but its long-run average barely moves. Which update rule adapts fastest?
        options:
          - id: b
            text: A sample average over every click since the ad launched
          - id: c
            text: A greedy rule that keeps the ad with the highest total clicks
          - id: a
            text: A constant step size that weights recent clicks more
        answer: a
        feedback: With a constant step size α, old results fade geometrically, so the estimate tracks the new, lower rate. A full-history average moves by less each week, and total clicks favor the old leader even more.
      - id: bandits-and-exploration.transfer.v2.4
        prompt: A recommender logs only the song it played and whether the user skipped it. An analyst wants to know how a new strategy would have done on last month's traffic. What should the system have logged as well?
        options:
          - id: a
            text: The probability it had of choosing each song it played
          - id: b
            text: The user's rating for the songs it chose not to play
          - id: c
            text: The average skip rate across the whole catalog
        answer: a
        feedback: Only the chosen arm's outcome is seen, so estimating another strategy means reweighting those outcomes by how likely each choice was. Ratings for unplayed songs don't exist, and a global skip rate ignores which song was chosen.
  - id: bandits-and-exploration.calculate
    objective_ref: objective.bandits-and-exploration
    task: base
    response_type: numeric
    points: 1
    hint: The best-looking arm is picked on every exploiting round and also when the random pick happens to land on it, so add (1 − ε) and ε/k.
    remediation_scene: bandits-and-exploration.s2
    absolute_tolerance: 0.002
    variants:
      - id: bandits-and-exploration.calculate.1
        prompt: Epsilon-greedy with ε = 0.1 chooses among 3 arms, exploring uniformly at random. What is the probability it picks the arm with the highest current estimate? Give three decimal places.
        answer: 0.9333
        feedback: 0.9 + 0.1/3 = 0.9 + 0.0333 = 0.9333. The random 10% can also land on the best arm.
      - id: bandits-and-exploration.calculate.2
        prompt: Epsilon-greedy with ε = 0.2 chooses among 4 arms, exploring uniformly at random. What is the probability it picks one particular arm that is not the current best? Give a decimal.
        answer: 0.05
        feedback: A non-best arm is picked only when exploring and the random pick lands on it, 0.2 × 1/4 = 0.05.
      - id: bandits-and-exploration.calculate.3
        prompt: Epsilon-greedy with ε = 0.3 chooses among 3 arms, exploring uniformly at random. What is the probability it picks the arm with the highest current estimate? Give a decimal.
        answer: 0.8
        feedback: 0.7 + 0.3/3 = 0.7 + 0.1 = 0.8.
      - id: bandits-and-exploration.calculate.4
        prompt: Epsilon-greedy with ε = 0.1 chooses between 2 arms, exploring uniformly at random. What is the probability it picks the arm with the highest current estimate? Give a decimal.
        answer: 0.95
        feedback: 0.9 + 0.1/2 = 0.95. Half of the exploring rounds also choose the best arm.
      - id: bandits-and-exploration.calculate.5
        prompt: Epsilon-greedy with ε = 0.05 chooses among 5 arms, exploring uniformly at random. What is the probability it picks one particular arm that is not the current best? Give a decimal.
        answer: 0.01
        feedback: 0.05 × 1/5 = 0.01.
