schema_version: 0.2-draft
lesson:
  id: speculative-decoding
  version: 0.1.0-draft
  title: Let a cheap draft propose tokens for a target model to verify
  state: draft
  summary: Speculative decoding proposes several tokens and verifies them with a target model; distribution-preserving
    variants require an exact acceptance/correction rule, while speed depends on acceptance and execution cost.
  slot: M27.6
  category: learning
  minutes: 12
  sources:
  - title: Fast Inference from Transformers via Speculative Decoding
    url: https://arxiv.org/abs/2211.17192
objectives:
- id: objective.speculative-decoding
  version: 1-draft
  statement: Speculative decoding proposes several tokens and verifies them with a target model; distribution-preserving
    variants require an exact acceptance/correction rule, while speed depends on acceptance and execution cost.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - speculative-decoding.base
  - speculative-decoding.transfer
  prerequisites:
  - anyOf:
    - objective.decoding-and-sampling
  - anyOf:
    - objective.probability
scenes:
- id: speculative-decoding.s1
  title: Propose more than one step cheaply
  type: explanation
  depth: intuition
  objective_refs:
  - objective.speculative-decoding
  markdown: A draft model or other proposal mechanism generates candidate tokens. The target evaluates candidates
    in a parallelizable verification computation. If enough proposals are accepted, the system can emit several
    tokens while paying fewer sequential target steps than ordinary decoding.
  text_mode: A draft model or other proposal mechanism generates candidate tokens. The target evaluates candidates
    in a parallelizable verification computation. If enough proposals are accepted, the system can emit several
    tokens while paying fewer sequential target steps than ordinary decoding.
  bridges: []
- id: speculative-decoding.s2
  title: Acceptance must match the stated guarantee
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.speculative-decoding
  markdown: A distribution-preserving sampling method compares target and proposal probabilities with a defined
    acceptance rule and correction distribution after rejection. Simply accepting tokens that look plausible can
    change the target distribution. Greedy-equivalence variants have their own exact matching conditions.
  text_mode: A distribution-preserving sampling method compares target and proposal probabilities with a defined
    acceptance rule and correction distribution after rejection. Simply accepting tokens that look plausible can
    change the target distribution. Greedy-equivalence variants have their own exact matching conditions.
  bridges:
  - probability
- id: speculative-decoding.s3
  title: Trace the cost tradeoff
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.speculative-decoding
  markdown: Suppose drafting and verification together cost the equivalent of two ordinary target steps and yield
    four accepted output tokens on average. That suggests a benefit under those assumptions. If only one token is
    accepted, overhead can dominate. Batch size, model placement, and memory traffic change the calculation.
  text_mode: Suppose drafting and verification together cost the equivalent of two ordinary target steps and yield
    four accepted output tokens on average. That suggests a benefit under those assumptions. If only one token is
    accepted, overhead can dominate. Batch size, model placement, and memory traffic change the calculation.
  bridges: []
- id: speculative-decoding.s4
  title: Evaluate correctness and speed separately
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.speculative-decoding
  markdown: Check output-distribution or greedy-equivalence claims against a reference implementation, including
    filtering and stopping rules. Then benchmark acceptance, latency, throughput, and memory. A fast approximate
    method may be useful, but should not inherit an exactness claim from a different algorithm.
  text_mode: Check output-distribution or greedy-equivalence claims against a reference implementation, including
    filtering and stopping rules. Then benchmark acceptance, latency, throughput, and memory. A fast approximate
    method may be useful, but should not inherit an exactness claim from a different algorithm.
  bridges: []
- id: speculative-decoding.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.speculative-decoding
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Speculative decoding proposes several tokens and verifies them with a target model; distribution-preserving
    variants require an exact acceptance/correction rule, while speed depends on acceptance and execution cost.
- id: speculative-decoding.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.speculative-decoding
  markdown: Speculative decoding proposes several tokens and verifies them with a target model; distribution-preserving
    variants require an exact acceptance/correction rule, while speed depends on acceptance and execution cost.
  text_mode: Speculative decoding proposes several tokens and verifies them with a target model; distribution-preserving
    variants require an exact acceptance/correction rule, while speed depends on acceptance and execution cost.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - speculative-decoding.s1
    - speculative-decoding.s2
