schema_version: 0.2-draft
lesson:
  id: speculative-decoding
  version: 0.3.0-draft
  title: Let a cheap draft propose tokens for a target model to verify
  state: draft
  summary: Use cheap proposals to reduce sequential work without changing the intended sampling distribution.
  slot: M27.6
  category: learning
  sources:
  - title: Fast Inference from Transformers via Speculative Decoding
    url: https://arxiv.org/abs/2211.17192
objectives:
- id: objective.speculative-decoding
  version: 1-draft
  statement: Speculative decoding proposes several tokens and verifies them with a target model; distribution-preserving
    variants require an exact acceptance/correction rule, while speed depends on acceptance and execution cost.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - speculative-decoding.base
  - speculative-decoding.transfer
  prerequisites:
  - anyOf:
    - objective.decoding-and-sampling
  - anyOf:
    - objective.probability
scenes:
- id: speculative-decoding.s1
  title: Propose more than one step cheaply
  type: explanation
  depth: intuition
  objective_refs:
  - objective.speculative-decoding
  markdown: A draft model or other proposal mechanism generates candidate tokens. The target evaluates candidates
    in a parallelizable verification computation. If enough proposals are accepted, the system can emit several
    tokens while paying fewer sequential target steps than ordinary decoding.
  text_mode: A draft model or other proposal mechanism generates candidate tokens. The target evaluates candidates
    in a parallelizable verification computation. If enough proposals are accepted, the system can emit several
    tokens while paying fewer sequential target steps than ordinary decoding.
  bridges: []
- id: speculative-decoding.s2
  title: Acceptance must match the stated guarantee
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.speculative-decoding
  markdown: 'A distribution-preserving sampling method compares target and proposal probabilities with a defined
    acceptance rule and correction distribution after rejection. Simply accepting tokens that look plausible
    can change the target distribution. Greedy-equivalence variants have their own exact matching conditions.


    For a tiny example, let the draft probabilities for [A, B] be [0.8, 0.2] and the target probabilities be
    [0.6, 0.4]. Accept a proposed token with probability min(1, target/draft): A is accepted with 0.75 and
    B with 1. Rejections therefore occur only for A. The correction distribution is proportional to the positive
    part of target minus draft: [0, 0.2], so rejection produces B. Final probabilities are A: 0.8 × 0.75 =
    0.6; B: 0.2 + 0.8 × 0.25 = 0.4. This illustrates the rule at one position; a full algorithm also handles
    accepted prefixes, stopping, and the next target token.'
  text_mode: 'A distribution-preserving sampling method compares target and proposal probabilities with a defined
    acceptance rule and correction distribution after rejection. Simply accepting tokens that look plausible
    can change the target distribution. Greedy-equivalence variants have their own exact matching conditions.


    For a tiny example, let the draft probabilities for [A, B] be [0.8, 0.2] and the target probabilities be
    [0.6, 0.4]. Accept a proposed token with probability min(1, target/draft): A is accepted with 0.75 and
    B with 1. Rejections therefore occur only for A. The correction distribution is proportional to the positive
    part of target minus draft: [0, 0.2], so rejection produces B. Final probabilities are A: 0.8 × 0.75 =
    0.6; B: 0.2 + 0.8 × 0.25 = 0.4. This illustrates the rule at one position; a full algorithm also handles
    accepted prefixes, stopping, and the next target token.'
  bridges:
  - probability
- id: speculative-decoding.s3
  title: Trace the cost tradeoff
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.speculative-decoding
  markdown: Suppose drafting and verification together cost the equivalent of two ordinary target steps and
    yield four accepted output tokens on average. That suggests a benefit under those assumptions. If only
    one token is accepted, overhead can dominate. Batch size, model placement, and memory traffic change the
    calculation.
  text_mode: Suppose drafting and verification together cost the equivalent of two ordinary target steps and
    yield four accepted output tokens on average. That suggests a benefit under those assumptions. If only
    one token is accepted, overhead can dominate. Batch size, model placement, and memory traffic change the
    calculation.
  bridges: []
- id: speculative-decoding.s4
  title: Evaluate correctness and speed separately
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.speculative-decoding
  markdown: Check output-distribution or greedy-equivalence claims against a reference implementation, including
    filtering and stopping rules. Then benchmark acceptance, latency, throughput, and memory. A fast approximate
    method may be useful, but should not inherit an exactness claim from a different algorithm.
  text_mode: Check output-distribution or greedy-equivalence claims against a reference implementation, including
    filtering and stopping rules. Then benchmark acceptance, latency, throughput, and memory. A fast approximate
    method may be useful, but should not inherit an exactness claim from a different algorithm.
  bridges: []
- id: speculative-decoding.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.speculative-decoding
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A draft proposes tokens and a target verifies them. Preserving the target distribution requires
    the specified acceptance and correction rules; speed depends on how much work those rules save.
- id: speculative-decoding.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.speculative-decoding
