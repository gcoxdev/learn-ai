assessment_families:
- id: speculative-decoding.base
  objective_ref: objective.speculative-decoding
  task: base
  response_type: single_choice
  points: 1
  hint: 'Acceptance must match the stated guarantee: trace the inputs, operation, and result before choosing.'
  remediation_scene: speculative-decoding.s2
  variants:
  - id: speculative-decoding.base.1
    prompt: What is the draft’s role?
    options:
    - id: a
      text: Propose candidate tokens cheaply
    - id: b
      text: Replace all target verification by definition
    - id: c
      text: Provide human-written labels live
    answer: a
    feedback: The target then checks proposals under the algorithm.
  - id: speculative-decoding.base.2
    prompt: Does accepting merely plausible tokens preserve the target distribution automatically?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if the draft is smaller
    - id: a
      text: 'No'
    answer: a
    feedback: Exact preservation needs the specified acceptance and correction math.
- id: speculative-decoding.transfer
  objective_ref: objective.speculative-decoding
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate correctness and speed separately: trace the inputs, operation, and result before choosing.'
  remediation_scene: speculative-decoding.s4
  variants:
  - id: speculative-decoding.transfer.1
    prompt: Draft plus verification cost two target steps and yield one token. Is speedup guaranteed?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only output count matters
    - id: a
      text: No; overhead may dominate
    answer: a
    feedback: Benefit depends on accepted progress per total cost.
  - id: speculative-decoding.transfer.2
    prompt: Why test correctness independently from speed?
    options:
    - id: c
      text: Only model names affect correctness
    - id: a
      text: A fast implementation can violate the claimed sampling contract
    - id: b
      text: Runtime proves distribution equality
    answer: a
    feedback: Execution efficiency and algorithmic equivalence are different properties.
