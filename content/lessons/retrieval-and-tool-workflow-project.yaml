lesson:
  id: retrieval-and-tool-workflow-project
  version: 0.4.0-draft
  title: 'Project: trace a grounded answer and a controlled tool action'
  state: draft
  summary: A museum assistant must answer from 20 help pages, admit when they're silent, book visits without booking twice, and ignore a review that tells it to book ten. Build and test every step.
  slot: M36.6
