schema_version: 0.2-draft
lesson:
  id: dynamics-and-noise
  version: 0.4.0-draft
  title: Follow a changing state through time
  state: draft
  summary: A cup of tea cools, a diffusion model turns noise into a picture. Step either one forward with Euler's method, learn why too big a step explodes, and add noise the right size.
  slot: B19
  category: bridge
  sources:
    - title: Deep Learning — numerical computation
      url: https://www.deeplearningbook.org/contents/numerical.html
    - title: Flow Matching for Generative Modeling
      url: https://arxiv.org/abs/2210.02747
objectives:
  - id: objective.dynamics-and-noise
    version: 2-draft
    statement: Read a differential equation as a rule for change, take Euler steps and spot when a step is too large, and add Brownian noise that scales with the square root of the step.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - dynamics-and-noise.base.v2
      - dynamics-and-noise.transfer.v2
      - dynamics-and-noise.calculate
    prerequisites:
      - anyOf:
          - objective.derivatives
      - anyOf:
          - objective.functions
scenes:
  - id: dynamics-and-noise.s1
    title: Describe the change, not every moment
    type: explanation
    depth: intuition
    objective_refs:
      - objective.dynamics-and-noise
    markdown: |-
      A cup of tea starts 60 °C hotter than the room. The hotter it is, the faster it cools: each minute it loses about a tenth of its extra heat. You could list its temperature at every moment, or you could just write down that rule for change.

      **Why AI needs this:** a diffusion model turns noise into an image through hundreds of small steps, flow matching follows a learned "velocity" one step at a time, and a recurrent network updates its running memory one token at a time. All of them follow a rule for change.

      Let x be how many degrees the tea is above the room. The rule is a **differential equation**, an equation for a rate of change:

      $$\frac{dx}{dt} = -0.1\,x$$

      Read it aloud: "the rate of change of x, per minute, is minus a tenth of x." At x = 60 the tea cools at 6 degrees per minute; at x = 10, only 1. The **state** x is what you track, and t is time in minutes. The equation alone fits every cup, hot or lukewarm. Adding a starting value, the **initial condition** x(0) = 60, picks out this cup's path, its **trajectory**. (This one has an exact answer, x = 60e^(−0.1t), but most equations in AI don't, so we step.)
    bridges:
      - derivatives
  - id: dynamics-and-noise.s2
    title: Take an Euler step
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.dynamics-and-noise
    markdown: |-
      **Euler's method** pretends the rate stays fixed for a short step of length h:

      $$x_{\text{next}} = x + h \times \text{rate}(x)$$

      With h = 1 minute:

      | Minute | x | Rate −0.1x | Next x = x + 1 × rate |
      | ---: | ---: | ---: | ---: |
      | 0 | 60 | −6 | 54 |
      | 1 | 54 | −5.4 | 48.6 |

      The exact answer at 2 minutes is 60e^(−0.2) ≈ 49.12. Euler's 48.6 is a little low, because the real cooling slows down during each minute while Euler kept the faster starting rate. Halve the step and the error roughly halves too, at the cost of twice as many steps.

      :::predict What does one Euler step of h = 10 minutes give?
      60 + 10 × (−6) = 0: the tea hits room temperature in one step. The real tea is still 60e^(−1) ≈ 22 degrees above room. The step was too long to trust a rate measured at the start.
      :::
    bridges:
      - derivatives
  - id: dynamics-and-noise.s3
    title: Too big a step can explode
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.dynamics-and-noise
    markdown: |-
      Push further. With h = 20, each step multiplies x by 1 − 20 × 0.1 = −1: the tea goes 60, −60, 60, −60, flipping between hot and ice-cold forever. With h = 30 the factor is −2, and it goes 60, −120, 240… A cooling cup has become an explosion. For this equation, Euler is only stable when h < 2 ÷ 0.1 = 20.

      ```python run
      import numpy as np

      k, x0, T = 0.1, 60.0, 20.0     # cooling rate per minute, 60 degrees above room, 20 minutes

      for h in [1.0, 2.0, 5.0, 10.0, 20.0]:
          x = x0
          for _ in range(round(T / h)):
              x = x + h * (-k * x)    # Euler: new = old + step × rate
          print(f"step {h:4.0f} min: after {T:.0f} min, {x:7.2f} degrees above room")
      print(f"exact answer:          {x0 * np.exp(-k * T):7.2f}")
      ```

      Small steps land near the exact 8.12 (7.29 with 1-minute steps). Then change `T` to `60.0` and the list to `[1.0, 30.0]`: the 30-minute steps end 240 degrees *above* room.

      So the solver is part of the model. Adaptive solvers, which neural ODEs often use, estimate their own error and shrink the step where the trajectory curves sharply. In flow matching, fewer Euler steps mean faster image generation but a rougher path, which is the trade-off the lesson on flow matching measures.
    bridges: []
  - id: dynamics-and-noise.s4
    title: Random kicks grow with the square root of time
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.dynamics-and-noise
    markdown: |-
      Now put the tea by a leaky window: on top of the steady cooling, random gusts nudge it up and down. A **stochastic differential equation** (SDE) adds random kicks to the rate rule. The steady part is the **drift**; the kicks come from **Brownian motion**, whose change over a time h is a normal draw with mean 0 and variance h, so standard deviation √h.

      The **Euler–Maruyama step** adds one such kick per step, with noise scale σ and a standard-normal draw z (a random number with mean 0 and variance 1):

      $$x_{\text{next}} = x + h \times \text{drift}(x) + \sigma\sqrt{h}\, z$$

      With x = 60, drift −0.1x, σ = 2, h = 0.25, and a draw of z = +1: 60 − 0.25 × 6 + 2 × 0.5 × 1 = 58.5 + 1 = **59.5**. Another draw gives another path, so a single run is one possible story, not the average. Papers write the whole rule as $dx = \text{drift}(x)\,dt + \sigma\,dW$, where $dW$ is the Brownian kick over a tiny time $dt$.

      :::mixup "Scale the noise by h, just like the drift."
      Split one minute into four quarter-minute steps. Independent kicks add their variances: 4 × (σ² × 0.25) = σ², the same spread as one full-minute step, as it should be. Scaling by h instead gives 4 × σ² × 0.25² = σ²/4, and the finer your steps, the less noise survives. With 100 steps it's nearly gone.
      :::

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      sigma, paths = 2.0, 20_000        # noise scale; number of simulated runs

      for n_steps in [1, 4, 100]:       # split one minute into n equal steps
          h = 1.0 / n_steps
          right = np.zeros(paths)
          wrong = np.zeros(paths)
          for _ in range(n_steps):
              z = rng.standard_normal(paths)
              right += sigma * np.sqrt(h) * z   # Euler–Maruyama: noise grows like sqrt(h)
              wrong += sigma * h * z            # the mistake: noise scaled like drift
          print(f"{n_steps:3d} steps: spread after 1 min = {right.std():.2f} with sqrt(h), "
                f"{wrong.std():.2f} with h")
      ```

      With √h the spread stays near 2.00 however finely you slice the minute; with h it falls to 1.01, then 0.20. Diffusion models rely on the same bookkeeping. Each forward step adds noise with a set variance, and the lesson on denoising shows how those variances combine.
    bridges:
      - random-variables
  - id: dynamics-and-noise.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.dynamics-and-noise
    markdown: Step new systems forward (a leaky neuron, a flow-matching sampler, a noisy simulation) and decide when the step size, not the model, is to blame.
    takeaway: |-
      A differential equation is a rule for change; Euler's method follows it in small steps, and a step that's too big can blow up. Random kicks grow with the square root of the step, not the step itself.
  - id: dynamics-and-noise.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.dynamics-and-noise
    markdown: |-
      Differential equations describe local change; numerical solvers approximate trajectories, and stochastic terms introduce uncertainty into the dynamics.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - dynamics-and-noise.s1
        - dynamics-and-noise.s2
        - dynamics-and-noise.s3
        - dynamics-and-noise.s4
        - dynamics-and-noise.check
      gate_refs:
        - gate.core
  scene_aliases:
    dynamics-and-noise.recap: dynamics-and-noise.check
assessment_families:
  - id: dynamics-and-noise.base
    objective_ref: objective.dynamics-and-noise
    task: base
    response_type: single_choice
    points: 1
    hint: 'One Euler step: new state = old state + step size × rate at the old state.'
    remediation_scene: dynamics-and-noise.s2
    variants:
      - id: dynamics-and-noise.base.1
        prompt: For rate dx/dt = −x, x = 4, step 0.1, what is one Euler update?
        options:
          - id: c
            text: '0.4'
          - id: a
            text: '3.6'
          - id: b
            text: '4.4'
        answer: a
        feedback: Add 0.1 × (−4) to 4.
        retired: true
      - id: dynamics-and-noise.base.2
        prompt: What selects one trajectory among solutions of an ODE?
        options:
          - id: a
            text: An initial condition with the equation and assumptions
          - id: b
            text: Only the file name
          - id: c
            text: Only the number of model parameters
        answer: a
        feedback: A starting state is required to trace a specific trajectory.
        retired: true
  - id: dynamics-and-noise.transfer
    objective_ref: objective.dynamics-and-noise
    task: transfer
    response_type: single_choice
    points: 1
    hint: Brownian noise over a step of length h has standard deviation √h, not h.
    remediation_scene: dynamics-and-noise.s4
    variants:
      - id: dynamics-and-noise.transfer.1
        prompt: Halving a solver step makes a simulation slower. Why can it still be useful?
        options:
          - id: a
            text: It may reduce numerical approximation error
          - id: b
            text: It automatically doubles physical accuracy in every system
          - id: c
            text: It eliminates all model error
        answer: a
        feedback: Solver error and model error differ; smaller steps can help the former.
        retired: true
      - id: dynamics-and-noise.transfer.2
        prompt: A Brownian time step changes from h to 4h. How does its increment standard deviation scale?
        options:
          - id: b
            text: It quadruples
          - id: c
            text: It stays zero
          - id: a
            text: It doubles
        answer: a
        feedback: Standard deviation scales with the square root of elapsed time.
        retired: true
  - id: dynamics-and-noise.base.v2
    objective_ref: objective.dynamics-and-noise
    task: base
    response_type: single_choice
    points: 1
    hint: "Separate the three ingredients: the rule for change (the equation), where you start (the initial condition), and how you follow it (the step size and, for SDEs, noise that grows like √h)."
    remediation_scene: dynamics-and-noise.s4
    variants:
      - id: dynamics-and-noise.base.v2.1
        prompt: A sampler's step size grows from 0.01 to 0.04. By what factor should the standard deviation of each step's Brownian noise change?
        options:
          - id: b
            text: It grows 4 times, in step with the step size
          - id: a
            text: It grows 2 times, the square root of 4
          - id: c
            text: It stays the same, since the noise scale σ is fixed
        answer: a
        feedback: Brownian noise over a step h has variance h, so its standard deviation grows like √h, and √4 = 2. Growing it 4 times treats noise like drift; keeping it fixed ignores how long the step is.
      - id: dynamics-and-noise.base.v2.2
        prompt: Two cups of tea both follow dx/dt = −0.1x, yet after 10 minutes one is 22 degrees above room and the other 11. What most likely differs?
        options:
          - id: a
            text: Their initial conditions, the temperatures they started at
          - id: c
            text: Their cooling rules, since the rates must be different
          - id: b
            text: Their clocks, since one cup has had more time
        answer: a
        feedback: The same rule gives a different trajectory from each start. Starting at 60 gives about 22 after 10 minutes; starting at 30 gives about 11. The rule and the elapsed time are the same for both.
      - id: dynamics-and-noise.base.v2.3
        prompt: Euler's method on dx/dt = −0.1x with a 20-minute step sends the tea 60, −60, 60, −60. What is the best explanation?
        options:
          - id: b
            text: The equation itself makes the temperature swing back and forth
          - id: c
            text: Rounding errors pile up over the steps until the values flip
          - id: a
            text: The step is so long that each update overshoots past zero
        answer: a
        feedback: Each step multiplies x by 1 − 20 × 0.1 = −1, a full overshoot. The real equation decays smoothly, and the flip happens on the very first step, long before rounding could matter. Steps under 20 minutes (much smaller, for accuracy) fix it.
      - id: dynamics-and-noise.base.v2.4
        prompt: One Euler–Maruyama run of a noisy system ends at 1.93. What is that number?
        options:
          - id: c
            text: The expected value of the system at that time
          - id: a
            text: One possible outcome, from one set of random draws
          - id: b
            text: The exact solution that smaller steps would reach
        answer: a
        feedback: Each run uses its own random kicks, so 1.93 is one sample. To learn the average or the spread, run many seeds and summarize them. Smaller steps make each path more accurate, but it stays random.
      - id: dynamics-and-noise.base.v2.5
        prompt: In the rule dx = −x dt + 0.5 dW, which part steadily pulls the state toward 0?
        options:
          - id: b
            text: The noise term, 0.5 dW, which averages out to zero
          - id: a
            text: The drift term, −x dt, whose sign opposes x
          - id: c
            text: Both terms equally, since each scales with the step
        answer: a
        feedback: The drift −x points toward 0 from either side, so it pulls steadily. The noise term has mean zero; it spreads paths out rather than pulling them anywhere, and it scales with √dt, not dt.
  - id: dynamics-and-noise.transfer.v2
    objective_ref: objective.dynamics-and-noise
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask whether the trouble comes from the solver (step size, number of steps), the randomness (one seed versus many), or the model itself.
    remediation_scene: dynamics-and-noise.s3
    variants:
      - id: dynamics-and-noise.transfer.v2.1
        prompt: A flow-matching image generator makes sharp images with 100 Euler steps and smeared ones with 4. The trained network is the same. What explains the difference?
        options:
          - id: b
            text: The network's weights are tuned for exactly 100 steps
          - id: a
            text: Long steps follow the curved path to an image poorly
          - id: c
            text: Fewer steps add more random noise to each image
        answer: a
        feedback: Each Euler step assumes the velocity stays fixed; over a long step the real path curves away, so 4 steps land off target. The weights are the same in both runs, and plain Euler sampling of a flow adds no noise.
      - id: dynamics-and-noise.transfer.v2.2
        prompt: A leaky neuron's voltage follows dV/dt = −V/τ with τ = 10 ms. Simulated with 25 ms Euler steps, the voltage swings wildly and grows. What should you change?
        options:
          - id: a
            text: Use a much smaller step, well under 20 ms
          - id: c
            text: Raise τ to 30 ms so the swings calm down
          - id: b
            text: Add noise to damp the swings
        answer: a
        feedback: Each step multiplies V by 1 − 25/10 = −1.5, so it flips and grows. Euler is stable here only for steps under 2τ = 20 ms, and accuracy needs far smaller ones. Changing τ changes the neuron you are modeling, and noise doesn't cure an unstable step.
      - id: dynamics-and-noise.transfer.v2.3
        prompt: A team halves its solver step, and the simulated trajectory barely changes, yet it still misses the lab measurements. What does that suggest?
        options:
          - id: c
            text: Halving the step again should close the remaining gap
          - id: b
            text: The solver is still too coarse to show the true path
          - id: a
            text: Solver error is small; the equation itself needs work
        answer: a
        feedback: If halving the step barely moves the answer, the solver is already following the equation closely. The remaining miss comes from the equation (the model), so smaller steps won't fix it.
      - id: dynamics-and-noise.transfer.v2.4
        prompt: A noisy traffic simulation run with seed 7 matches last week's data almost perfectly. What should you do before trusting the model?
        options:
          - id: b
            text: Fix seed 7 for all future runs so the match stays
          - id: a
            text: Run many seeds and compare their spread with the data
          - id: c
            text: Halve the step size and rerun seed 7 to confirm
        answer: a
        feedback: One seed is one random path; a good match could be luck. Many seeds show whether the data sits inside the model's typical range. Fixing the seed only replays the same lucky path.
  - id: dynamics-and-noise.calculate
    objective_ref: objective.dynamics-and-noise
    task: base
    response_type: numeric
    points: 1
    hint: "New x = x + h × rate(x). For a noisy step, also add σ × √h × z."
    remediation_scene: dynamics-and-noise.s2
    absolute_tolerance: 0.01
    variants:
      - id: dynamics-and-noise.calculate.1
        prompt: For dx/dt = −0.1x, start at x = 60 and take one Euler step of h = 1. What is the new x?
        answer: 54
        feedback: The rate is −0.1 × 60 = −6, so x becomes 60 + 1 × (−6) = 54.
      - id: dynamics-and-noise.calculate.2
        prompt: For dx/dt = −0.5x, start at x = 8 and take one Euler step of h = 0.5. What is the new x?
        answer: 6
        feedback: The rate is −0.5 × 8 = −4, so x becomes 8 + 0.5 × (−4) = 6.
      - id: dynamics-and-noise.calculate.3
        prompt: For dx/dt = −x, start at x = 4 and take two Euler steps of h = 0.1. What is x after the second step?
        answer: 3.24
        feedback: First step 4 + 0.1 × (−4) = 3.6. Second step 3.6 + 0.1 × (−3.6) = 3.24. Each step uses the rate at the current x.
      - id: dynamics-and-noise.calculate.4
        prompt: For dx/dt = 2 − x, start at x = 10 and take one Euler step of h = 0.25. What is the new x?
        answer: 8
        feedback: The rate is 2 − 10 = −8, so x becomes 10 + 0.25 × (−8) = 8, moving toward 2.
      - id: dynamics-and-noise.calculate.5
        prompt: 'An Euler–Maruyama step for drift −x and noise scale σ = 0.5: start at x = 2, step h = 0.01, random draw z = −1. What is the new x?'
        answer: 1.93
        feedback: Drift adds 0.01 × (−2) = −0.02. Noise adds 0.5 × √0.01 × (−1) = 0.5 × 0.1 × (−1) = −0.05. So x = 2 − 0.02 − 0.05 = 1.93.
      - id: dynamics-and-noise.calculate.6
        prompt: 'An Euler–Maruyama step for drift −0.1x and noise scale σ = 2: start at x = 60, step h = 0.25, random draw z = +1. What is the new x?'
        answer: 59.5
        feedback: Drift adds 0.25 × (−6) = −1.5. Noise adds 2 × √0.25 × 1 = 2 × 0.5 = 1. So x = 60 − 1.5 + 1 = 59.5.
