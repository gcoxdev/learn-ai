assessment_families:
- id: dynamics-and-noise.base
  objective_ref: objective.dynamics-and-noise
  task: base
  response_type: single_choice
  points: 1
  hint: 'Take an Euler step: trace the inputs, operation, and result before choosing.'
  remediation_scene: dynamics-and-noise.s2
  variants:
  - id: dynamics-and-noise.base.1
    prompt: For rate dx/dt = −x, x = 4, step 0.1, what is one Euler update?
    options:
    - id: c
      text: '0.4'
    - id: a
      text: '3.6'
    - id: b
      text: '4.4'
    answer: a
    feedback: Add 0.1 × (−4) to 4.
  - id: dynamics-and-noise.base.2
    prompt: What selects one trajectory among solutions of an ODE?
    options:
    - id: a
      text: An initial condition with the equation and assumptions
    - id: b
      text: Only the file name
    - id: c
      text: Only the number of model parameters
    answer: a
    feedback: A starting state is required to trace a specific trajectory.
- id: dynamics-and-noise.transfer
  objective_ref: objective.dynamics-and-noise
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Add a random contribution carefully: trace the inputs, operation, and result before choosing.'
  remediation_scene: dynamics-and-noise.s4
  variants:
  - id: dynamics-and-noise.transfer.1
    prompt: Halving a solver step makes a simulation slower. Why can it still be useful?
    options:
    - id: a
      text: It may reduce numerical approximation error
    - id: b
      text: It automatically doubles physical accuracy in every system
    - id: c
      text: It eliminates all model error
    answer: a
    feedback: Solver error and model error differ; smaller steps can help the former.
  - id: dynamics-and-noise.transfer.2
    prompt: A Brownian time step changes from h to 4h. How does its increment standard deviation scale?
    options:
    - id: b
      text: It quadruples
    - id: c
      text: It stays zero
    - id: a
      text: It doubles
    answer: a
    feedback: Standard deviation scales with the square root of elapsed time.
