scenes:
- id: dynamics-and-noise.s1
  title: Describe change instead of listing every state
  type: explanation
  depth: intuition
  objective_refs:
  - objective.dynamics-and-noise
  markdown: A differential equation relates a state to its rate of change. In dx/dt = −x, x is the current scalar
    state and t is time. Read it as “the state decreases at a rate equal to its current value.” An initial condition,
    such as x(0) = 2, identifies a particular trajectory.
  text_mode: A differential equation relates a state to its rate of change. In dx/dt = −x, x is the current scalar
    state and t is time. Read it as “the state decreases at a rate equal to its current value.” An initial condition,
    such as x(0) = 2, identifies a particular trajectory.
  bridges: []
- id: dynamics-and-noise.s2
  title: Take an Euler step
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.dynamics-and-noise
  markdown: Euler’s method uses next state = current state + step size × current rate. With x = 2 and step size
    0.1, the rate is −2 and the next state is 1.8. Repeating this approximates the continuous solution. A smaller
    step often improves accuracy but requires more function evaluations.
  text_mode: Euler’s method uses next state = current state + step size × current rate. With x = 2 and step size
    0.1, the rate is −2 and the next state is 1.8. Repeating this approximates the continuous solution. A smaller
    step often improves accuracy but requires more function evaluations.
  bridges:
  - derivatives
- id: dynamics-and-noise.s3
  title: A solver is part of the computation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.dynamics-and-noise
  markdown: Large steps can miss rapid changes or destabilize a trajectory. Adaptive solvers choose step sizes using
    error estimates. A vector field supplies a change vector at each state and time. In a neural ODE, a network
    can parameterize that field; evaluating the field and learning its parameters are distinct operations.
  text_mode: Large steps can miss rapid changes or destabilize a trajectory. Adaptive solvers choose step sizes
    using error estimates. A vector field supplies a change vector at each state and time. In a neural ODE, a network
    can parameterize that field; evaluating the field and learning its parameters are distinct operations.
  bridges: []
- id: dynamics-and-noise.s4
  title: Add a random contribution carefully
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.dynamics-and-noise
  markdown: A stochastic differential equation adds a noise-driven term to deterministic drift. Brownian increments
    over time step h have standard deviation proportional to √h, not h. A diffusion sampler or stochastic simulation
    needs a specified noise convention and solver. A random seed aids repetition but does not establish that the
    modeled dynamics match the real system.
  text_mode: A stochastic differential equation adds a noise-driven term to deterministic drift. Brownian increments
    over time step h have standard deviation proportional to √h, not h. A diffusion sampler or stochastic simulation
    needs a specified noise convention and solver. A random seed aids repetition but does not establish that the
    modeled dynamics match the real system.
  bridges: []
