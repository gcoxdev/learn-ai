schema_version: 0.2-draft
lesson:
  id: verifiable-rewards
  version: 0.1.0-draft
  title: Turn checkable outcomes into a learning signal
  state: draft
  summary: Verifiable rewards score outputs with explicit checks such as mathematical equivalence or program tests;
    verifier coverage and isolation determine how closely reward tracks the intended task.
  slot: M21.3
  category: learning
  minutes: 12
  sources:
  - title: Training Verifiers to Solve Math Word Problems
    url: https://arxiv.org/abs/2110.14168
  - title: DeepSeek-R1
    url: https://arxiv.org/abs/2501.12948
objectives:
- id: objective.verifiable-rewards
  version: 1-draft
  statement: Verifiable rewards score outputs with explicit checks such as mathematical equivalence or program tests;
    verifier coverage and isolation determine how closely reward tracks the intended task.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - verifiable-rewards.base
  - verifiable-rewards.transfer
  prerequisites:
  - anyOf:
    - objective.rlhf-and-kl-control
  - anyOf:
    - objective.reasoning-demonstrations
scenes:
- id: verifiable-rewards.s1
  title: Use an external check
  type: explanation
  depth: intuition
  objective_refs:
  - objective.verifiable-rewards
  markdown: A task with a known numeric answer can score a parsed result for mathematical equivalence. A programming
    task can execute tests under controlled resource and permission limits. This provides a repeatable reward signal
    without requiring a human to rate every sampled solution.
  text_mode: A task with a known numeric answer can score a parsed result for mathematical equivalence. A programming
    task can execute tests under controlled resource and permission limits. This provides a repeatable reward signal
    without requiring a human to rate every sampled solution.
  bridges: []
- id: verifiable-rewards.s2
  title: Define what counts as success
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.verifiable-rewards
  markdown: Exact string comparison can reject equivalent fractions, while overly permissive parsing can accept
    malformed or irrelevant text. Unit tests cover selected behavior rather than every possible input. State the
    answer extraction, tolerance, test coverage, timeout, and failure handling that define the reward.
  text_mode: Exact string comparison can reject equivalent fractions, while overly permissive parsing can accept
    malformed or irrelevant text. Unit tests cover selected behavior rather than every possible input. State the
    answer extraction, tolerance, test coverage, timeout, and failure handling that define the reward.
  bridges: []
- id: verifiable-rewards.s3
  title: Separate the answer from the evaluator
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.verifiable-rewards
  markdown: Untrusted generated code or text must not modify the tests, access hidden answers, or control the scoring
    environment. Otherwise the policy can improve reward by exploiting the evaluator. Safe isolation is part of
    the experiment’s validity as well as its operational design.
  text_mode: Untrusted generated code or text must not modify the tests, access hidden answers, or control the scoring
    environment. Otherwise the policy can improve reward by exploiting the evaluator. Safe isolation is part of
    the experiment’s validity as well as its operational design.
  bridges: []
- id: verifiable-rewards.s4
  title: Audit generalization beyond the verifier
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.verifiable-rewards
  markdown: Keep independent tests and fresh problem families. A model can overfit recurring tasks, formatting,
    or verifier quirks. Report the reward’s limits and inspect high-reward failures; a deterministic scoring function
    can be consistently wrong about an incompletely specified goal.
  text_mode: Keep independent tests and fresh problem families. A model can overfit recurring tasks, formatting,
    or verifier quirks. Report the reward’s limits and inspect high-reward failures; a deterministic scoring function
    can be consistently wrong about an incompletely specified goal.
  bridges: []
- id: verifiable-rewards.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.verifiable-rewards
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: verifiable-rewards.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.verifiable-rewards
  markdown: Verifiable rewards score outputs with explicit checks such as mathematical equivalence or program tests;
    verifier coverage and isolation determine how closely reward tracks the intended task.
  text_mode: Verifiable rewards score outputs with explicit checks such as mathematical equivalence or program tests;
    verifier coverage and isolation determine how closely reward tracks the intended task.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - verifiable-rewards.s1
    - verifiable-rewards.s2
    - verifiable-rewards.s3
    - verifiable-rewards.s4
    - verifiable-rewards.check
    - verifiable-rewards.recap
    gate_refs:
    - gate.core
assessment_families:
- id: verifiable-rewards.base
  objective_ref: objective.verifiable-rewards
  task: base
  response_type: single_choice
  points: 1
  hint: 'Define what counts as success: trace the inputs, operation, and result before choosing.'
  remediation_scene: verifiable-rewards.s2
  variants:
  - id: verifiable-rewards.base.1
    prompt: Why can 1/2 and 0.5 challenge exact string scoring?
    options:
    - id: b
      text: They must always represent different quantities
    - id: c
      text: Only one can be tokenized
    - id: a
      text: They are mathematically equivalent but textually different
    answer: a
    feedback: Text identity and answer equivalence differ.
  - id: verifiable-rewards.base.2
    prompt: Passing a finite test suite proves what?
    options:
    - id: c
      text: Absence of every evaluator exploit
    - id: a
      text: Success on those checks under their conditions
    - id: b
      text: Correctness on every possible input
    answer: a
    feedback: Test coverage limits the conclusion.
- id: verifiable-rewards.transfer
  objective_ref: objective.verifiable-rewards
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Audit generalization beyond the verifier: trace the inputs, operation, and result before choosing.'
  remediation_scene: verifiable-rewards.s4
  variants:
  - id: verifiable-rewards.transfer.1
    prompt: Generated code can modify hidden tests. What is compromised?
    options:
    - id: c
      text: Only parameter count
    - id: a
      text: The independence and validity of the reward
    - id: b
      text: Only response style
    answer: a
    feedback: The evaluated output must not control its evaluator.
  - id: verifiable-rewards.transfer.2
    prompt: What helps detect verifier overfitting?
    options:
    - id: a
      text: Independent checks and fresh problem families
    - id: b
      text: Reusing only the same reward score
    - id: c
      text: Removing all failure records
    answer: a
    feedback: Separate evidence tests whether reward gains transfer.
