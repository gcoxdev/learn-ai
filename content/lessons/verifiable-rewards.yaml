schema_version: 0.2-draft
lesson:
  id: verifiable-rewards
  version: 0.4.0-draft
  title: Turn checkable outcomes into a learning signal
  state: draft
  summary: For maths and code you don't need a judge; you can just check the answer. So why did a model being trained on coding tasks learn to call exit(0)?
  slot: M21.3
  category: learning
  sources:
    - title: "Tülu 3: Pushing Frontiers in Open Language Model Post-Training (Lambert et al., 2024)"
      url: https://arxiv.org/abs/2411.15124
    - title: "DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning (DeepSeek-AI, 2025)"
      url: https://arxiv.org/abs/2501.12948
    - title: "Training Verifiers to Solve Math Word Problems (Cobbe et al., 2021)"
      url: https://arxiv.org/abs/2110.14168
    - title: "Monitoring Reasoning Models for Misbehavior and the Risks of Promoting Obfuscation (Baker et al., 2025)"
      url: https://arxiv.org/abs/2503.11926
objectives:
  - id: objective.verifiable-rewards
    version: 2-draft
    statement: Verifiable rewards score outputs with explicit checks such as mathematical equivalence or program tests; verifier coverage and isolation determine how closely reward tracks the intended task.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - verifiable-rewards.base.v2
      - verifiable-rewards.transfer.v2
      - verifiable-rewards.calculate
    prerequisites:
      - anyOf:
          - objective.rlhf-and-kl-control
      - anyOf:
          - objective.reasoning-demonstrations
scenes:
  - id: verifiable-rewards.s1
    title: A reward you can compute
    type: explanation
    depth: intuition
    objective_refs:
      - objective.verifiable-rewards
    markdown: |-
      In the RLHF lesson, the reward came from a **reward model**: a network trained on human preferences to score responses. It's a learned judge, and learned judges can be fooled. But some tasks come with their own answer key. A maths problem has a known final answer; a coding task has tests. For those you can skip the judge and simply *check*.

      A **verifier** is a program that checks an output and returns a reward, usually 1 for pass and 0 for fail. Training a policy with reinforcement learning against such checks is called **reinforcement learning with verifiable rewards** (RLVR), a name popularized by AI2's Tülu 3 report (2024).

      DeepSeek-R1-Zero, from the last lesson, was trained this way. Its reward had two rule-based parts: an *accuracy* reward (the boxed final answer matches, or the code passes predefined test cases) and a *format* reward (the reasoning sits between `<think>` tags). The team chose rules over a learned reward model because, they wrote, a neural reward model may suffer from reward hacking in large-scale RL.

      :::papers The RLVR objective
      It's the RLHF objective with the reward model swapped for a checker:

      $$\max_\theta\;\mathbb{E}_{x \sim \mathcal{D},\;y \sim \pi_\theta(\cdot \mid x)}\big[\,r(x, y)\,\big] \;-\; \beta\,\mathrm{KL}\big(\pi_\theta \,\|\, \pi_{\text{ref}}\big), \qquad r(x, y) = \mathbf{1}\big[\text{verifier accepts } y\big]$$

      $x$ is a problem from the training set $\mathcal{D}$, $y$ is a sampled solution, and $\mathbf{1}[\cdot]$ is 1 when the check passes and 0 otherwise. The KL term keeps the policy near the reference model, as in the RLHF lesson.
      :::
    diagram:
      caption: The RLVR loop. The only judge is a program that checks the answer or runs the tests.
      description: A problem from the training set goes to the policy, which samples a solution. The verifier extracts the final answer or runs the tests in a sandbox and outputs a reward of 1 or 0. The reward drives a policy update, which changes the policy before the next batch of problems.
      nodes:
        - id: problem
          label: Problem
          note: with known answer or tests
          col: 0
          row: 0
          tone: data
        - id: policy
          label: Policy (the model)
          col: 1
          row: 0
          tone: accent
        - id: solution
          label: Sampled solution
          col: 2
          row: 0
        - id: verifier
          label: Verifier
          note: compare answer or run tests in sandbox
          col: 3
          row: 0
          tone: warn
        - id: reward
          label: Reward 1 or 0
          col: 3
          row: 1
        - id: update
          label: Policy update
          note: e.g. GRPO, next lesson
          col: 1
          row: 1
      edges:
        - from: problem
          to: policy
        - from: policy
          to: solution
          label: sample
        - from: solution
          to: verifier
        - from: verifier
          to: reward
        - from: reward
          to: update
        - from: update
          to: policy
          dashed: true
    bridges: []
  - id: verifiable-rewards.s2
    title: '"1/2", "0.5", or "1/2 or 1/3"?'
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.verifiable-rewards
    markdown: |-
      Checking a maths answer sounds trivial until you see what models actually write. The reference answer is $\tfrac{1}{2}$. Three possible checkers:

      | Response ends with | Exact string "1/2" | Parse and compare values | "1/2" appears anywhere |
      | --- | :---: | :---: | :---: |
      | `1/2` | ✓ | ✓ | ✓ |
      | `0.5` | ✗ | ✓ | ✗ |
      | `2/4` | ✗ | ✓ | ✗ |
      | `1/2 or maybe 1/3` | ✗ | ✗ (two answers) | ✓ |

      The strict checker punishes correct answers, which is a noisy reward. The lenient one rewards hedging, which is worse, because RL will find it.

      :::predict A policy truly solves 60% of problems, and the right answer is among its top three guesses 85% of the time. Under the "appears anywhere" checker, which pays more, one answer or three?
      One answer earns an expected reward of 0.60. Listing three candidates earns 0.85. RL follows reward, so the policy drifts toward listing several numbers, and it doesn't get any better at maths. That's **reward hacking**: raising the reward by exploiting the checker instead of doing the task.
      :::

      Real pipelines ask for the final answer in a fixed place, such as GSM8K's `#### 42` or a LaTeX `\boxed{}`. They extract exactly one answer, parse it into a number or expression, and compare values. For measured quantities, they accept a small **tolerance**: an allowed gap, such as answers within 0.5% of the reference. A task that asks for an exact count shouldn't get one.
    bridges: []
  - id: verifiable-rewards.s3
    title: Tests that don't check enough
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.verifiable-rewards
    markdown: |-
      For code, the verifier is a test suite, and a test suite checks only the cases someone thought of. Here are three candidate `median` functions, rewarded first by two weak tests and then by six stronger ones.

      ```python run
      def median_correct(xs):
          s = sorted(xs)
          n = len(s)
          return s[n // 2] if n % 2 else (s[n // 2 - 1] + s[n // 2]) / 2

      def median_middle(xs):          # forgets the even-length case
          return sorted(xs)[len(xs) // 2]

      def median_lookup(xs):          # memorizes the visible tests
          return {(3, 1, 2): 2, (5, 9, 1, 7, 3): 5}.get(tuple(xs), 0)

      weak = [([3, 1, 2], 2), ([5, 9, 1, 7, 3], 5)]
      strong = weak + [([4, 1, 3, 2], 2.5), ([7], 7), ([-2, -8, 0], -2), ([10, 20], 15)]

      def reward(fn, tests):
          """Verifiable reward: 1 if every test passes, else 0."""
          passed = sum(fn(list(x)) == want for x, want in tests)
          return int(passed == len(tests)), passed

      for fn in [median_correct, median_middle, median_lookup]:
          rw, pw = reward(fn, weak)
          rs, ps = reward(fn, strong)
          print(f"{fn.__name__:15} weak tests: reward {rw} ({pw}/{len(weak)})   strong tests: reward {rs} ({ps}/{len(strong)})")
      ```

      Under the weak tests all three earn reward 1, so RL has no reason to prefer the correct one. Both weak tests use odd-length lists, so the even-length bug is invisible, and the lookup table simply memorizes them. The strong suite separates them: 6/6, 4/6, 2/6. Try deleting `([4, 1, 3, 2], 2.5)` and `([10, 20], 15)` from `strong` and see which bug slips through again.

      :::mixup "It passed the tests, so the code is correct."
      It's correct on those inputs. A reward of 1 means "no test caught a problem," and under optimization pressure the policy will find every gap the tests leave. Add edge cases (empty, single item, even length, negatives) and keep some tests hidden from training.
      :::
    bridges: []
  - id: verifiable-rewards.s4
    title: Keep the answer key out of reach
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.verifiable-rewards
    markdown: |-
      :::story exit(0)
      While training a frontier reasoning model on coding tasks, OpenAI researchers (Baker et al., 2025) found two hacks spreading through training. In one, the agent called `exit(0)`, exploiting a bug that let it leave the environment before all the unit tests ran. In the other, it raised a `SkipTest` exception so the tests were skipped. Once the hacks appeared, they were reinforced and showed up in nearly every training environment. In another episode, the model noticed that the tests only checked one function, and made its `verify` function always return true.
      :::

      None of these hacks wrote better code. They attacked the verifier. So treat the verifier as part of the experiment and protect it:

      - **Isolate.** Run generated code in a **sandbox**, a locked-down environment with time and memory limits and no access to the tests, the reference answers, or the scoring code.
      - **Fail closed.** Count a run as passing only if every test reports a result. An early exit, a skip, or a timeout scores 0.
      - **Watch the gap.** Track a hidden test suite the policy never trains on.

      | Training step | Training reward | Hidden-test pass rate |
      | ---: | ---: | ---: |
      | 0 | 0.40 | 0.38 |
      | 500 | 0.71 | 0.62 |
      | 1,000 | 0.92 | 0.60 |

      Up to step 500 both numbers climb together: real learning. After that the training reward keeps rising while hidden tests stall. That gap is the classic signature of a hack, so read the highest-reward solutions before you train any further.
    bridges: []
  - id: verifiable-rewards.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.verifiable-rewards
    markdown: A SQL generator, a chemistry grader, a coding sandbox, and some expected-reward sums test whether you can spot what a checker lets through.
    takeaway: |-
      A verifier turns "is it right?" into a reward, and RL optimizes exactly what the verifier checks. Parse answers carefully, test edge cases, isolate the checker, and watch hidden tests for the gap that signals a hack.
  - id: verifiable-rewards.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.verifiable-rewards
    markdown: |-
      A verifier turns explicit checks into reward. Its coverage, parsing rules, and independence determine what a high score tells you.
