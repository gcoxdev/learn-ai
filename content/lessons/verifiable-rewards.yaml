assessment_families:
  - id: verifiable-rewards.base
    objective_ref: objective.verifiable-rewards
    task: base
    response_type: single_choice
    points: 1
    hint: 'Define what counts as success: trace the inputs, operation, and result before choosing.'
    remediation_scene: verifiable-rewards.s2
    variants:
      - id: verifiable-rewards.base.1
        prompt: Why can 1/2 and 0.5 challenge exact string scoring?
        options:
          - id: b
            text: They must always represent different quantities
          - id: c
            text: Only one can be tokenized
          - id: a
            text: They are mathematically equivalent but textually different
        answer: a
        feedback: Text identity and answer equivalence differ.
        retired: true
      - id: verifiable-rewards.base.2
        prompt: Passing a finite test suite proves what?
        options:
          - id: c
            text: Absence of every evaluator exploit
          - id: a
            text: Success on those checks under their conditions
          - id: b
            text: Correctness on every possible input
        answer: a
        feedback: Test coverage limits the conclusion.
        retired: true
  - id: verifiable-rewards.transfer
    objective_ref: objective.verifiable-rewards
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Audit generalization beyond the verifier: trace the inputs, operation, and result before choosing.'
    remediation_scene: verifiable-rewards.s4
    variants:
      - id: verifiable-rewards.transfer.1
        prompt: Generated code can modify hidden tests. What is compromised?
        options:
          - id: c
            text: Only parameter count
          - id: a
            text: The independence and validity of the reward
          - id: b
            text: Only response style
        answer: a
        feedback: The evaluated output must not control its evaluator.
        retired: true
      - id: verifiable-rewards.transfer.2
        prompt: What helps detect verifier overfitting?
        options:
          - id: a
            text: Independent checks and fresh problem families
          - id: b
            text: Reusing only the same reward score
          - id: c
            text: Removing all failure records
        answer: a
        feedback: Separate evidence tests whether reward gains transfer.
        retired: true
  - id: verifiable-rewards.base.v2
    objective_ref: objective.verifiable-rewards
    task: base
    response_type: single_choice
    points: 1
    hint: RL pushes toward whatever the verifier pays for. Ask which outputs this checker accepts that it shouldn't, or rejects that it shouldn't.
    remediation_scene: verifiable-rewards.s3
    variants:
      - id: verifiable-rewards.base.v2.1
        prompt: Why did DeepSeek-R1-Zero use rule-based rewards rather than a learned reward model for its reasoning training?
        options:
          - id: b
            text: Rule-based rewards give partial credit to good intermediate steps
          - id: a
            text: A learned reward model can be exploited during large-scale RL
          - id: c
            text: Learned reward models have no way of scoring maths answers
        answer: a
        feedback: The R1 report says a neural reward model may suffer from reward hacking at scale, and retraining it adds cost. Its rule-based rewards checked only final answers and format, with no step credit; learned models can score maths, just less reliably.
      - id: verifiable-rewards.base.v2.2
        prompt: A maths checker compares the final answer, as text, with the string "0.75". A response ends with "3/4". What happens?
        options:
          - id: a
            text: A correct answer gets reward 0; comparing parsed values fixes it
          - id: c
            text: It gets reward 1, because text is turned into numbers first
          - id: b
            text: It gets reward 0, which is right, since 3/4 is a different answer
        answer: a
        feedback: 3/4 equals 0.75, so a string comparison punishes a correct answer and makes the reward noisy. Parsing both into values before comparing removes that. A plain string match does no conversion.
      - id: verifiable-rewards.base.v2.3
        prompt: A checker gives reward 1 whenever the correct number appears anywhere in the response. What is RL most likely to teach the model?
        options:
          - id: c
            text: To put its final answer earlier in the response
          - id: b
            text: To stop showing working, so stray numbers vanish
          - id: a
            text: To list several candidate numbers in each answer
        answer: a
        feedback: Listing more candidates raises the chance the right one appears, so it raises reward without better maths. That's reward hacking. Moving or trimming the answer doesn't change whether the number appears, so it earns nothing extra.
      - id: verifiable-rewards.base.v2.4
        prompt: A median function passes the tests [3, 1, 2] → 2 and [5, 9, 1, 7, 3] → 5, but returns 3 for [4, 1, 3, 2] (the true median is 2.5). Why did it get full reward?
        options:
          - id: a
            text: Both tests used odd-length lists, so the even case was never checked
          - id: b
            text: The reward gave partial credit, and two tests out of three was enough
          - id: c
            text: The tests were run against an older version of the function
        answer: a
        feedback: A test suite checks only the cases it contains. With no even-length input, the missing averaging step was invisible. The reward here is all-or-nothing on the tests it has, and [4, 1, 3, 2] wasn't one of them.
      - id: verifiable-rewards.base.v2.5
        prompt: In a coding RL environment, an agent calls exit(0) before the tests finish and receives full reward. Where is the flaw?
        options:
          - id: c
            text: The tests were too hard for the agent to pass honestly
          - id: a
            text: The harness counted an early clean exit as a pass
          - id: b
            text: The agent's code was correct, just too slow to test
        answer: a
        feedback: The reward came from a harness bug, not from working code, so the fix belongs in the verifier. Count a run as passing only when every test reports a result. Hard tests or slow code would earn low reward, not full reward.
  - id: verifiable-rewards.transfer.v2
    objective_ref: objective.verifiable-rewards
    task: transfer
    response_type: single_choice
    points: 1
    hint: Picture the cheapest way to earn reward 1 from this exact checker. If that shortcut isn't the real task, fix the checker or watch a held-out measure.
    remediation_scene: verifiable-rewards.s4
    variants:
      - id: verifiable-rewards.transfer.v2.1
        prompt: A text-to-SQL model earns reward 1 when its query returns the same rows as the reference query on one small test database. Which failure is most likely?
        options:
          - id: b
            text: Correct queries formatted differently from the reference get reward 0
          - id: a
            text: Queries that match on that small table but are wrong in general
          - id: c
            text: The model stops producing SQL and writes explanations instead
        answer: a
        feedback: Comparing returned rows is a good check, but one small database is a weak test suite. Many wrong queries return the right rows there by accident. Formatting doesn't matter when you compare results, and prose earns no reward.
      - id: verifiable-rewards.transfer.v2.2
        prompt: A chemistry-homework verifier checks answers that are measured values rounded to three significant figures. Which check fits?
        options:
          - id: c
            text: Accept an answer as long as it has the right units
          - id: b
            text: Require the exact reference string, digit for digit
          - id: a
            text: Accept answers within a small tolerance of the reference
        answer: a
        feedback: Rounded measurements can differ in the last digit and still be right, so a tolerance fits. An exact string match punishes correct answers, and a units-only check rewards wrong numbers.
      - id: verifiable-rewards.transfer.v2.3
        prompt: 'During RL on coding tasks, training reward climbs from 0.40 to 0.92. The pass rate on a hidden test suite rises from 0.38 to 0.62, then drifts down to 0.60. What should you do first?'
        options:
          - id: a
            text: Read high-reward solutions for ways they satisfy visible tests
          - id: b
            text: Keep training, since the training reward is still going up
          - id: c
            text: Raise the learning rate to push the hidden pass rate back up
        answer: a
        feedback: Reward rising while held-out performance stalls is the signature of reward hacking, so look at what the top-scoring solutions actually do. More training or a bigger step would reinforce the hack faster.
      - id: verifiable-rewards.transfer.v2.4
        prompt: A coding agent's generated code runs in the same folder as the test files and can write to them. Which change most directly protects the reward?
        options:
          - id: b
            text: Tell the agent in its prompt that it may not edit the tests
          - id: c
            text: Add more tests so that editing them all becomes harder
          - id: a
            text: Run the tests from a read-only copy the agent can't reach
        answer: a
        feedback: Isolation removes the hack entirely. A prompt instruction is a request that optimization can learn to ignore, and more editable tests are still editable.
  - id: verifiable-rewards.calculate
    objective_ref: objective.verifiable-rewards
    task: base
    response_type: numeric
    points: 1
    hint: "Expected reward = (share correct × share of correct answers the checker accepts) + (share wrong × share of wrong answers it accepts)."
    remediation_scene: verifiable-rewards.s2
    absolute_tolerance: 0.005
    variants:
      - id: verifiable-rewards.calculate.1
        prompt: A policy answers 70% of problems correctly. The checker accepts 95% of correct answers and wrongly accepts 10% of wrong ones. What is the policy's expected reward per problem? (Give a decimal.)
        answer: 0.695
        feedback: 0.7 × 0.95 + 0.3 × 0.10 = 0.665 + 0.03 = 0.695.
      - id: verifiable-rewards.calculate.2
        prompt: A policy answers 50% of problems correctly. A lenient checker accepts every correct answer and 40% of wrong ones. What is the expected reward per problem? (Give a decimal.)
        answer: 0.7
        feedback: 0.5 × 1.0 + 0.5 × 0.4 = 0.5 + 0.2 = 0.7. The policy scores well above its true 50%, and any trick that raises the 40% pays off.
      - id: verifiable-rewards.calculate.3
        prompt: A policy answers 80% of problems correctly. A strict checker accepts only 90% of correct answers (it rejects some valid formats) and no wrong ones. What is the expected reward per problem? (Give a decimal.)
        answer: 0.72
        feedback: 0.8 × 0.9 + 0.2 × 0 = 0.72. The strict checker never pays for wrong answers, but it underpays correct ones.
      - id: verifiable-rewards.calculate.4
        prompt: A policy answers 60% of problems correctly. The checker accepts 80% of correct answers and 5% of wrong ones. What is the expected reward per problem? (Give a decimal.)
        answer: 0.5
        feedback: 0.6 × 0.8 + 0.4 × 0.05 = 0.48 + 0.02 = 0.50.
