schema_version: 0.2-draft
lesson:
  id: anomaly-detection
  version: 0.1.0-draft
  title: Find unusual cases without assuming unusual means wrong
  state: draft
  summary: Anomaly detection ranks departures from a reference pattern; density, distance, reconstruction, and isolation
    methods encode different notions of unusualness.
  slot: M08.5
  category: learning
  minutes: 12
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.anomaly-detection
  version: 1-draft
  statement: Anomaly detection ranks departures from a reference pattern; density, distance, reconstruction, and
    isolation methods encode different notions of unusualness.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - anomaly-detection.base
  - anomaly-detection.transfer
  prerequisites:
  - anyOf:
    - objective.clustering
  - anyOf:
    - objective.uncertainty-models
scenes:
- id: anomaly-detection.s1
  title: Define the reference behavior
  type: explanation
  depth: intuition
  objective_refs:
  - objective.anomaly-detection
  markdown: 'An anomaly is unusual relative to a reference population and representation. A sudden machine vibration
    may indicate failure, a new operating mode, or a sensor problem. Choose what the detector should support: inspection,
    warning, or automatic action. The meaning of an alert is not supplied by unusualness alone.'
  text_mode: 'An anomaly is unusual relative to a reference population and representation. A sudden machine vibration
    may indicate failure, a new operating mode, or a sensor problem. Choose what the detector should support: inspection,
    warning, or automatic action. The meaning of an alert is not supplied by unusualness alone.'
  bridges: []
- id: anomaly-detection.s2
  title: Compare detection mechanisms
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.anomaly-detection
  markdown: Distance methods look for examples far from neighbors. Density methods look for poorly supported regions.
    Reconstruction methods flag inputs a model reconstructs badly. Isolation methods measure how easily random partitions
    separate a point. These scores can disagree because they define normality differently.
  text_mode: Distance methods look for examples far from neighbors. Density methods look for poorly supported regions.
    Reconstruction methods flag inputs a model reconstructs badly. Isolation methods measure how easily random partitions
    separate a point. These scores can disagree because they define normality differently.
  bridges: []
- id: anomaly-detection.s3
  title: Set an operational threshold
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.anomaly-detection
  markdown: Suppose 1000 daily events are scored and only 20 can be reviewed. A top-20 policy respects capacity
    but can still miss serious events or include harmless ones. A fixed threshold may produce more alerts when the
    environment shifts. Evaluate detection, false alarms, and review workload together.
  text_mode: Suppose 1000 daily events are scored and only 20 can be reviewed. A top-20 policy respects capacity
    but can still miss serious events or include harmless ones. A fixed threshold may produce more alerts when the
    environment shifts. Evaluate detection, false alarms, and review workload together.
  bridges: []
- id: anomaly-detection.s4
  title: Use labels and context when available
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.anomaly-detection
  markdown: Rare labeled failures can help evaluate whether anomaly scores identify useful targets. Low density
    is not always the right criterion, especially in high-dimensional spaces where typical regions and highest-density
    points differ. Monitor reference drift, inspect alert explanations, and avoid treating every unusual individual
    as suspicious.
  text_mode: Rare labeled failures can help evaluate whether anomaly scores identify useful targets. Low density
    is not always the right criterion, especially in high-dimensional spaces where typical regions and highest-density
    points differ. Monitor reference drift, inspect alert explanations, and avoid treating every unusual individual
    as suspicious.
  bridges: []
- id: anomaly-detection.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.anomaly-detection
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: anomaly-detection.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.anomaly-detection
  markdown: Anomaly detection ranks departures from a reference pattern; density, distance, reconstruction, and
    isolation methods encode different notions of unusualness.
  text_mode: Anomaly detection ranks departures from a reference pattern; density, distance, reconstruction, and
    isolation methods encode different notions of unusualness.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - anomaly-detection.s1
    - anomaly-detection.s2
    - anomaly-detection.s3
    - anomaly-detection.s4
    - anomaly-detection.check
    - anomaly-detection.recap
    gate_refs:
