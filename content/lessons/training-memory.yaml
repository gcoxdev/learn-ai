assessment_families:
  - id: training-memory.base
    objective_ref: objective.training-memory
    task: base
    response_type: single_choice
    points: 1
    hint: 'Calculate a toy state total: trace the inputs, operation, and result before choosing.'
    remediation_scene: training-memory.s2
    variants:
      - id: training-memory.base.1
        prompt: Are weights the entire training memory budget?
        options:
          - id: c
            text: Only for every transformer
          - id: a
            text: No; gradients, optimizer state, activations, and buffers also matter
          - id: b
            text: 'Yes'
        answer: a
        feedback: Training retains multiple kinds of state.
        retired: true
      - id: training-memory.base.2
        prompt: One million parameters use 12 bytes each in a simplified estimate. Total?
        options:
          - id: a
            text: 12 million bytes
          - id: b
            text: 12 bytes
          - id: c
            text: One million bits
        answer: a
        feedback: Multiply count by bytes per parameter under the stated assumptions.
        retired: true
  - id: training-memory.transfer
    objective_ref: objective.training-memory
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Separate capacity from speed: trace the inputs, operation, and result before choosing.'
    remediation_scene: training-memory.s4
    variants:
      - id: training-memory.transfer.1
        prompt: What does activation recomputation trade?
        options:
          - id: a
            text: Extra computation for less saved activation memory
          - id: b
            text: More labels for fewer parameters
          - id: c
            text: All gradients for higher accuracy
        answer: a
        feedback: Intermediate values are recreated during backward execution.
        retired: true
      - id: training-memory.transfer.2
        prompt: What inference allocation can grow with active sequence lengths?
        options:
          - id: b
            text: Adam moments that are always required at inference
          - id: c
            text: The fixed tokenizer vocabulary file alone
          - id: a
            text: The key/value cache
        answer: a
        feedback: Cached attention states accumulate across retained tokens.
        retired: true
  - id: training-memory.base.v2
    objective_ref: objective.training-memory
    task: base
    response_type: single_choice
    points: 1
    hint: Sort each item into model states (grow with parameter count) or activations (grow with batch, sequence, layers, and width). Mixed-precision Adam's model states are 2 + 2 + 4 + 4 + 4 bytes per parameter.
    remediation_scene: training-memory.s2
    variants:
      - id: training-memory.base.v2.1
        prompt: In a mixed-precision Adam budget, which line takes the most bytes per parameter?
        options:
          - id: b
            text: The bf16 weights used in the forward and backward passes
          - id: c
            text: The fp32 master copy of the weights
          - id: a
            text: Adam's two fp32 moment estimates, m and v, together
        answer: a
        feedback: m and v are 4 bytes each, 8 together. The master weights are 4 bytes and the bf16 weights only 2, so the optimizer's moments outweigh either copy of the weights.
      - id: training-memory.base.v2.2
        prompt: A 7B model's bf16 weights take 14 GB, yet Adam training runs out of memory on an 80 GB GPU. What accounts for most of the gap?
        options:
          - id: a
            text: Gradients, fp32 master weights, and Adam moments raise model states to about 112 GB
          - id: c
            text: The optimizer keeps copies of the weights from each earlier step it has taken
          - id: b
            text: Training stores the weights in fp32, which takes 28 GB, plus a few activations
        answer: a
        feedback: Mixed-precision Adam needs about 16 bytes per parameter, 112 GB for 7B, before activations. Adam keeps running averages, not a history of past weights, and 28 GB plus a few activations would still fit in 80 GB.
      - id: training-memory.base.v2.3
        prompt: A model trains with attention matrices stored. The sequence length doubles from 4,096 to 8,192 tokens. How does its memory change?
        options:
          - id: c
            text: Every activation grows 4×, because attention is quadratic in length
          - id: a
            text: Attention-score memory grows 4×, other activations 2×, model states not at all
          - id: b
            text: All activations double, and the optimizer states double along with them
        answer: a
        feedback: The 5·a·s²·b term is quadratic in s, so it quadruples; the 34·s·b·h term is linear, so it doubles. Model states depend only on parameter count. Only the attention scores are quadratic.
      - id: training-memory.base.v2.4
        prompt: An engineer doubles the number of sequences each GPU processes per step. Which part of training memory grows?
        options:
          - id: b
            text: The gradients, because each sequence adds its own gradient copy
          - id: c
            text: The Adam moments, because they average over more examples
          - id: a
            text: The activations saved for the backward pass
        answer: a
        feedback: Activations scale with b, the number of sequences. Gradients are summed into one value per parameter, and Adam's m and v are one value each per parameter, so neither depends on batch size.
  - id: training-memory.transfer.v2
    objective_ref: objective.training-memory
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask which line of the budget is biggest in this situation, and whether the change in question touches that line at all.
    remediation_scene: training-memory.s4
    variants:
      - id: training-memory.transfer.v2.1
        prompt: A company serves the finished 7B model for chat in bf16, with many long conversations at once. Beyond the 14 GB of weights, what fills the GPU?
        options:
          - id: a
            text: The KV cache, which grows with every token of every active conversation
          - id: b
            text: Adam's moment estimates, which are kept so that the model can keep learning
          - id: c
            text: fp32 master weights, which are needed to keep the replies numerically stable
        answer: a
        feedback: Serving runs no backward pass and no optimizer, so there are no gradients, moments, or master weights. The KV cache, about 0.5 MB per token for this model, grows with conversation length and concurrency.
      - id: training-memory.transfer.v2.2
        prompt: A team halves the batch size of a 2B-parameter model, but training still runs out of memory at exactly the same point. What's the most likely reason?
        options:
          - id: c
            text: Gradients scale with batch size, and they didn't shrink by enough
          - id: a
            text: Model states, which don't depend on batch size, fill most of the memory
          - id: b
            text: A smaller batch means more steps, and each step adds to memory use
        answer: a
        feedback: At 16 bytes per parameter a 2B model needs 32 GB of model states whatever the batch. Halving the batch shrinks only activations. Gradients are one value per parameter, and memory doesn't accumulate across steps.
      - id: training-memory.transfer.v2.3
        prompt: A lab moves its training from pure fp32 with Adam to bf16 mixed precision with fp32 master weights. What happens to model-state memory per parameter?
        options:
          - id: b
            text: It halves, from 16 bytes to 8, since every tensor is now half the size
          - id: c
            text: It quarters, from 16 bytes to about 4, since bf16 is so compact
          - id: a
            text: It stays about 16 bytes; the savings show up mainly in activations
        answer: a
        feedback: fp32 Adam needs 4 + 4 + 4 + 4 = 16 bytes; mixed precision needs 2 + 2 + 4 + 4 + 4 = 16. The master weights and moments stay fp32. Activations do halve, and the math runs faster.
      - id: training-memory.transfer.v2.4
        prompt: A profiler shows peak memory about 6 GB higher than the sum of the weights, gradients, optimizer state, and activations in your budget. What is the likeliest explanation?
        options:
          - id: a
            text: Temporary kernel buffers and memory the allocator reserved but hasn't filled
          - id: b
            text: Weights are compressed on disk and expand to twice their size in memory
          - id: c
            text: Each layer keeps its own private copy of the whole optimizer state
        answer: a
        feedback: Kernels need scratch space, and the allocator holds reserved blocks that can fragment, so real peaks run a few gigabytes above the tensor total. Weights aren't stored compressed, and optimizer state isn't duplicated per layer.
  - id: training-memory.calculate
    objective_ref: objective.training-memory
    task: base
    response_type: numeric
    points: 1
    hint: "Multiply parameters by bytes per parameter (16 for mixed-precision Adam). For activations use 34 × s × b × h bytes per layer, times L. Give answers in GB, where 1 GB = 10⁹ bytes."
    remediation_scene: training-memory.s3
    absolute_tolerance: 0.5
    variants:
      - id: training-memory.calculate.1
        prompt: A 13-billion-parameter model trains with mixed-precision Adam at 16 bytes per parameter. How many GB do its model states need?
        answer: 208
        feedback: 13 billion × 16 bytes = 208 billion bytes = 208 GB, before any activations.
      - id: training-memory.calculate.2
        prompt: GPT-2's largest version has 1.5 billion parameters. With mixed-precision Adam (16 bytes per parameter), how many GB do its model states need?
        answer: 24
        feedback: 1.5 billion × 16 = 24 billion bytes = 24 GB, the figure the ZeRO paper uses to show that even a 1.5B model strains a 32 GB GPU.
      - id: training-memory.calculate.3
        prompt: How many GB do Adam's two fp32 moment estimates alone take for a 7-billion-parameter model?
        answer: 56
        feedback: Two 4-byte values per parameter is 8 bytes; 7 billion × 8 = 56 GB, half of the 112 GB model-state total.
      - id: training-memory.calculate.4
        prompt: Using 34 × s × b × h bytes per layer (attention scores not stored), how many GB of activations does a 32-layer model with h = 4,096 need for b = 2 sequences of s = 2,048 tokens?
        answer: 18.3
        feedback: 34 × 2,048 × 2 × 4,096 ≈ 570 million bytes per layer; × 32 layers ≈ 18.3 GB. It matches one 4,096-token sequence, because only the product s × b matters in this term.
      - id: training-memory.calculate.5
        prompt: Serving the 7B model (32 layers, width 4,096, bf16), each token's KV cache takes 2 × 32 × 4,096 × 2 bytes. How many GB does the cache need for 16 conversations of 4,096 tokens each?
        answer: 34.4
        feedback: Per token, 2 × 32 × 4,096 × 2 = 524,288 bytes. Times 16 × 4,096 = 65,536 tokens gives about 34.4 GB, far more than the 14 GB of weights.
