schema_version: 0.2-draft
lesson:
  id: training-memory
  version: 0.4.0-draft
  title: Account for everything that occupies accelerator memory
  state: draft
  summary: A 7B model's weights fill just 14 GB, yet training it won't fit on an 80 GB GPU. Find the other 100+ gigabytes, line by line.
  slot: M17.2
  category: learning
  sources:
    - title: "ZeRO: Memory Optimizations Toward Training Trillion Parameter Models (Rajbhandari et al., 2019)"
      url: https://arxiv.org/abs/1910.02054
    - title: "Reducing Activation Recomputation in Large Transformer Models (Korthikanti et al., 2022), section 4.1"
      url: https://arxiv.org/abs/2205.05198
    - title: "Mixed Precision Training (Micikevicius et al., 2017)"
      url: https://arxiv.org/abs/1710.03740
objectives:
  - id: objective.training-memory
    version: 2-draft
    statement: Training memory includes parameters, gradients, optimizer state, activations, buffers, and allocator overhead; inference has a different budget including its key/value cache.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - training-memory.base.v2
      - training-memory.transfer.v2
      - training-memory.calculate
    prerequisites:
      - anyOf:
          - objective.neural-training-loop
      - anyOf:
          - objective.compute-and-bandwidth
scenes:
  - id: training-memory.s1
    title: 14 GB of weights, out of memory on 80 GB
    type: explanation
    depth: intuition
    objective_refs:
      - objective.training-memory
    markdown: |-
      The team's 7B model stores each weight in bf16, a 2-byte number format, so the weights take 7 billion × 2 bytes = 14 GB. Each A100 has 80 GB. An engineer loads the model on one GPU, starts training with Adam, and gets an out-of-memory error before the first step finishes. The weights left 66 GB free. What filled it, and then some?

      A running training step holds four kinds of data in GPU memory:

      | Kind | What it is | Depends on |
      | --- | --- | --- |
      | Weights | The model's parameters, sometimes in two formats | Parameter count |
      | Gradients | One slope per parameter, from the backward pass | Parameter count |
      | Optimizer state | Adam's running averages, two per parameter | Parameter count |
      | Activations | Intermediate values from the forward pass, kept for the backward pass | Batch, sequence length, layers, width |

      The first three together are called the **model states**. They grow with the number of parameters and don't care how much data you feed in. Activations are the opposite: they grow with the batch and the sequence and don't care about the optimizer.

      On top of these sit temporary **buffers** (scratch space a kernel needs for a moment) and memory the **allocator**, the code that hands out GPU memory, has reserved but not yet filled. Those typically add a few gigabytes.
    bridges: []
  - id: training-memory.s2
    title: Sixteen bytes per parameter
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.training-memory
    markdown: |-
      The usual recipe is mixed-precision training with Adam, from the optimization module. The forward and backward passes use bf16 copies of the weights for speed, but updates are applied to an fp32 **master copy**, because an update of 0.0001 added to a weight of 1.0 in bf16 simply rounds away (the mixed-precision lesson shows this). Adam then keeps two fp32 numbers per parameter: the running average of gradients, $m$, and of squared gradients, $v$.

      | Item | Bytes per parameter | For 7 billion parameters |
      | --- | ---: | ---: |
      | bf16 weights | 2 | 14 GB |
      | bf16 gradients | 2 | 14 GB |
      | fp32 master weights | 4 | 28 GB |
      | Adam $m$ (fp32) | 4 | 28 GB |
      | Adam $v$ (fp32) | 4 | 28 GB |
      | **Total model states** | **16** | **112 GB** |

      So the model states alone need 112 GB, well over one GPU's 80 GB, before a single activation is stored. The weights everyone quotes are 1/8 of the bill.

      :::papers The ZeRO paper's memory count (Rajbhandari et al., 2019)
      For a model with $\Psi$ parameters trained with mixed-precision Adam, model states need $2\Psi + 2\Psi + K\Psi$ bytes, with $K = 12$ for the fp32 master weights, $m$, and $v$. That's $16\Psi$: for our $\Psi$ = 7 billion, 112 GB. The paper's own example is GPT-2 with 1.5 billion parameters, which needs at least 24 GB just for model states.
      :::

      :::predict Before mixed precision, people trained entirely in fp32 with Adam. How many bytes per parameter did that need?
      fp32 weights (4) + fp32 gradients (4) + $m$ (4) + $v$ (4) = 16 bytes, the same total. Mixed precision swaps a 4-byte weight for a 2-byte copy plus a 4-byte master, and halves the gradients. It pays off in speed and in activation memory, not in model states.
      :::

      :::mixup "Mixed precision halves training memory."
      It halves the size of activations and of the weights and gradients used in the math, but the fp32 master weights and Adam moments stay. Model states stay at about 16 bytes per parameter either way.
      :::
    bridges: []
  - id: training-memory.s3
    title: Activations grow with batch, sequence, layers, and width
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.training-memory
    markdown: |-
      The backward pass needs values computed during the forward pass: to get the gradient of $y = Wx$ with respect to $W$, you need $x$. So every layer saves its inputs and a few intermediate results until backward reaches it. These saved values are the activations, and they scale with sequence length $s$, sequences per GPU $b$, width $h$ (the model dimension, $d_{\text{model}}$), and number of layers $L$.

      :::papers Activation memory per transformer layer (Korthikanti et al., 2022)
      For a GPT-style layer with $a$ attention heads, a GELU MLP four times as wide as the model, dropout, and 16-bit activations (1-byte dropout masks), the bytes saved per layer are

      $$\text{activations per layer} = s\,b\,h\left(34 + \frac{5\,a\,s}{h}\right)$$

      The $34\,sbh$ part covers the saved inputs to every matrix multiply, norm, and GELU, plus the dropout masks. The $5\,a\,s^2 b$ part is one $s \times s$ matrix per head saved three ways: the softmax output (2 bytes per entry), its dropout mask (1 byte), and the dropped-out copy (2 bytes). It grows with the square of the sequence length.
      :::

      For the team's model, $L$ = 32, $h$ = 4,096, $a$ = 32, with one 4,096-token sequence ($b$ = 1):

      - $34\,sbh$ = 34 × 4,096 × 4,096 ≈ 0.57 GB per layer, or 18.3 GB across 32 layers.
      - $5\,a\,s^2 b$ = 5 × 32 × 4,096² ≈ 2.7 GB per layer, or 85.9 GB across 32 layers.

      Storing the attention matrices would need 104 GB of activations for one sequence. Fused attention kernels, covered in the lesson on efficient attention later in this module, never store them, leaving 18.3 GB. Either way, the total is at least 112 + 18.3 ≈ 130 GB.

      ```python run
      P = 7e9                  # parameters
      L, h, a = 32, 4096, 32   # layers, width (d_model), attention heads
      s, b = 4096, 1           # sequence length, sequences per GPU

      states = {"bf16 weights": 2, "bf16 gradients": 2, "fp32 master weights": 4,
                "Adam m (fp32)": 4, "Adam v (fp32)": 4}
      total = 0
      for name, nbytes in states.items():
          print(f"{name:21s} {P * nbytes / 1e9:6.1f} GB")
          total += P * nbytes
      print(f"{'model states':21s} {total / 1e9:6.1f} GB")

      # Activations saved for backward (Korthikanti et al. 2022, 16-bit, GPT-style layer)
      per_layer = 34 * s * b * h      # layer inputs, norms, MLP, dropout masks
      scores = 5 * a * s * s * b      # attention score and softmax matrices
      for label, act in [("activations, scores kept", L * (per_layer + scores)),
                         ("activations, fused attn", L * per_layer)]:
          print(f"{label:24s} {act / 1e9:6.1f} GB -> total {(total + act) / 1e9:6.1f} GB")
      ```

      Set `s = 8192`. The fused-attention activations double to 36.5 GB, while the scores-kept line jumps to 380 GB, because its attention part quadruples from 86 GB to 344 GB. Then set `b = 4` and notice that the model states don't move at all.
    bridges: []
  - id: training-memory.s4
    title: Four ways out, and a different budget for serving
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.training-memory
    markdown: |-
      The team needs about 130 GB and has 80 GB per GPU. The rest of this module is really a list of ways out, each aimed at a different line of the budget:

      | Lever | Line it shrinks | What it costs | Lesson |
      | --- | --- | --- | --- |
      | Split the model across GPUs | Everything, per GPU | Communication and idle time | Model parallelism |
      | Shard model states across GPUs | Master weights, $m$, $v$, gradients | Communication | Sharding |
      | Recompute activations | Activations | About a third more compute | Sharding |
      | Offload to CPU memory | Whatever you move | Slow PCIe transfers | Sharding |

      **Offloading** means parking tensors in the CPU's larger, slower memory and copying them back when needed. **Recomputation** means discarding activations after the forward pass and computing them again during backward. Pick the lever that matches your biggest line: if activations dominate, sharding the optimizer barely helps.

      Serving the finished model has a different budget. There are no gradients or optimizer state: 14 GB of bf16 weights plus the **KV cache**, the keys and values that attention stores for every token already processed. For this model (32 layers, width 4,096), each token needs 2 × 32 × 4,096 × 2 bytes ≈ 0.5 MB. One 4,096-token conversation takes 2.1 GB, so 16 of them at once take 34 GB, more than twice the weights.
    bridges: []
  - id: training-memory.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.training-memory
    markdown: Memory budgets for models from 1.5 to 13 billion parameters, a longer context, a chat server, and a stubborn out-of-memory error test whether you can find the line that fills the GPU.
    takeaway: |-
      Mixed-precision Adam needs about 16 bytes per parameter before any activations: 112 GB for a 7B model. Activations add memory that grows with batch × sequence × layers × width, so find the biggest line before choosing a fix.
  - id: training-memory.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.training-memory
    markdown: |-
      A weight file is only part of the training memory budget. Count gradients, optimizer state, activations, and working storage, then identify which part causes the peak.
