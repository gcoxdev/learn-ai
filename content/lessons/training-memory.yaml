schema_version: 0.2-draft
lesson:
  id: training-memory
  version: 0.1.0-draft
  title: Account for everything that occupies accelerator memory
  state: draft
  summary: Training memory includes parameters, gradients, optimizer state, activations, buffers, and allocator
    overhead; inference has a different budget including its key/value cache.
  slot: M17.2
  category: learning
  minutes: 12
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: ZeRO
    url: https://arxiv.org/abs/1910.02054
objectives:
- id: objective.training-memory
  version: 1-draft
  statement: Training memory includes parameters, gradients, optimizer state, activations, buffers, and allocator
    overhead; inference has a different budget including its key/value cache.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - training-memory.base
  - training-memory.transfer
  prerequisites:
  - anyOf:
    - objective.neural-training-loop
  - anyOf:
    - objective.compute-and-bandwidth
scenes:
- id: training-memory.s1
  title: Weights are one line in the budget
  type: explanation
  depth: intuition
  objective_refs:
  - objective.training-memory
  markdown: A parameter is a learned number. Training also produces gradients and may keep momentum or second-moment
    estimates for the optimizer. Mixed-precision recipes can keep master weights or selected state at higher precision.
    Count each actual tensor, rather than multiplying parameters by one assumed universal factor.
  text_mode: A parameter is a learned number. Training also produces gradients and may keep momentum or second-moment
    estimates for the optimizer. Mixed-precision recipes can keep master weights or selected state at higher precision.
    Count each actual tensor, rather than multiplying parameters by one assumed universal factor.
  bridges: []
- id: training-memory.s2
  title: Calculate a toy state total
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-memory
  markdown: For one million parameters, a simplified budget with two-byte weights, two-byte gradients, and two four-byte
    moment arrays is 12 million bytes. This excludes activations, temporary buffers, master copies, and framework
    overhead. State which components and precision assumptions a reported estimate includes.
  text_mode: For one million parameters, a simplified budget with two-byte weights, two-byte gradients, and two
    four-byte moment arrays is 12 million bytes. This excludes activations, temporary buffers, master copies, and
    framework overhead. State which components and precision assumptions a reported estimate includes.
  bridges: []
- id: training-memory.s3
  title: Activations depend on the workload
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-memory
  markdown: Backward differentiation needs intermediate information from the forward pass, unless it is recomputed.
    Batch size, sequence length, hidden width, and layer count affect activation memory. Attention implementations
    can avoid materializing some large intermediate matrices, but they do not remove every long-sequence cost.
  text_mode: Backward differentiation needs intermediate information from the forward pass, unless it is recomputed.
    Batch size, sequence length, hidden width, and layer count affect activation memory. Attention implementations
    can avoid materializing some large intermediate matrices, but they do not remove every long-sequence cost.
  bridges: []
- id: training-memory.s4
  title: Separate capacity from speed
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-memory
  markdown: A configuration fitting in memory may still be slow. Offloading state saves accelerator capacity but
    transfers data; recomputation trades extra arithmetic for storage. During inference, optimizer state disappears,
    while caches, concurrent requests, and temporary computation can become major memory consumers.
  text_mode: A configuration fitting in memory may still be slow. Offloading state saves accelerator capacity but
    transfers data; recomputation trades extra arithmetic for storage. During inference, optimizer state disappears,
    while caches, concurrent requests, and temporary computation can become major memory consumers.
  bridges: []
- id: training-memory.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.training-memory
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: training-memory.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.training-memory
  markdown: Training memory includes parameters, gradients, optimizer state, activations, buffers, and allocator
    overhead; inference has a different budget including its key/value cache.
  text_mode: Training memory includes parameters, gradients, optimizer state, activations, buffers, and allocator
    overhead; inference has a different budget including its key/value cache.
