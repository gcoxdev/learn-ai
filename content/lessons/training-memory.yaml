schema_version: 0.2-draft
lesson:
  id: training-memory
  version: 0.3.0-draft
  title: Account for everything that occupies accelerator memory
  state: draft
  summary: Build a memory budget that includes the temporary and optimizer values as well as the model’s weights.
  slot: M17.2
  category: learning
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: ZeRO
    url: https://arxiv.org/abs/1910.02054
objectives:
- id: objective.training-memory
  version: 1-draft
  statement: Training memory includes parameters, gradients, optimizer state, activations, buffers, and allocator
    overhead; inference has a different budget including its key/value cache.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - training-memory.base
  - training-memory.transfer
  prerequisites:
  - anyOf:
    - objective.neural-training-loop
  - anyOf:
    - objective.compute-and-bandwidth
scenes:
- id: training-memory.s1
  title: Weights are one line in the budget
  type: explanation
  depth: intuition
  objective_refs:
  - objective.training-memory
  markdown: A parameter is a learned number. Training also produces gradients and may keep momentum or second-moment
    estimates for the optimizer. Mixed-precision recipes can keep master weights or selected state at higher
    precision. Count each actual tensor, rather than multiplying parameters by one assumed universal factor.
  text_mode: A parameter is a learned number. Training also produces gradients and may keep momentum or second-moment
    estimates for the optimizer. Mixed-precision recipes can keep master weights or selected state at higher
    precision. Count each actual tensor, rather than multiplying parameters by one assumed universal factor.
  bridges: []
- id: training-memory.s2
  title: Add the state arrays one at a time
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-memory
  markdown: 'Take a model with one million parameters. Suppose each has two-byte weights, two-byte gradients,
    and two four-byte optimizer moment values. These **moments** store gradient direction and squared-gradient
    scale, as in Adam.


    The total per parameter is 2 + 2 + 4 + 4 = 12 bytes, giving 12 million bytes. A four-byte master-weight
    copy would add another four million.


    This is only a partial budget. Activations, temporary buffers, framework overhead, and any other stored
    copies must be counted separately. State the formats and components rather than treating this factor as
    universal.'
  text_mode: 'Take a model with one million parameters. Suppose each has two-byte weights, two-byte gradients,
    and two four-byte optimizer moment values. These **moments** store gradient direction and squared-gradient
    scale, as in Adam.


    The total per parameter is 2 + 2 + 4 + 4 = 12 bytes, giving 12 million bytes. A four-byte master-weight
    copy would add another four million.


    This is only a partial budget. Activations, temporary buffers, framework overhead, and any other stored
    copies must be counted separately. State the formats and components rather than treating this factor as
    universal.'
  bridges: []
- id: training-memory.s3
  title: Activations depend on the workload
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-memory
  markdown: 'Backward differentiation needs intermediate information from the forward pass, unless it is recomputed.
    Batch size, sequence length, hidden width, and layer count affect activation memory. Attention implementations
    can avoid materializing some large intermediate matrices, but they do not remove every long-sequence cost.


    **Activations** are temporary values calculated for examples; parameters are stored model settings. A **buffer**
    is temporary working storage. The **allocator** manages memory blocks and can reserve space beyond the
    tensors currently holding useful values. This is why summing weight-file sizes can underestimate peak device
    memory.'
  text_mode: 'Backward differentiation needs intermediate information from the forward pass, unless it is recomputed.
    Batch size, sequence length, hidden width, and layer count affect activation memory. Attention implementations
    can avoid materializing some large intermediate matrices, but they do not remove every long-sequence cost.


    **Activations** are temporary values calculated for examples; parameters are stored model settings. A **buffer**
    is temporary working storage. The **allocator** manages memory blocks and can reserve space beyond the
    tensors currently holding useful values. This is why summing weight-file sizes can underestimate peak device
    memory.'
  bridges: []
- id: training-memory.s4
  title: Separate capacity from speed
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-memory
  markdown: 'A configuration fitting in memory may still be slow. Offloading state saves accelerator capacity
    but transfers data; recomputation trades extra arithmetic for storage. During inference, optimizer state
    disappears, while caches, concurrent requests, and temporary computation can become major memory consumers.


    **Offloading** moves selected values to another memory tier, such as CPU memory. **Recomputation** recalculates
    a value instead of retaining it. One trades transfers for capacity; the other trades additional arithmetic.
    Ask which allocation caused the memory shortage before choosing either.'
  text_mode: 'A configuration fitting in memory may still be slow. Offloading state saves accelerator capacity
    but transfers data; recomputation trades extra arithmetic for storage. During inference, optimizer state
    disappears, while caches, concurrent requests, and temporary computation can become major memory consumers.


    **Offloading** moves selected values to another memory tier, such as CPU memory. **Recomputation** recalculates
    a value instead of retaining it. One trades transfers for capacity; the other trades additional arithmetic.
    Ask which allocation caused the memory shortage before choosing either.'
  bridges: []
- id: training-memory.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.training-memory
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A weight file is only part of the training memory budget. Count gradients, optimizer state, activations,
    and working storage, then identify which part causes the peak.
- id: training-memory.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
