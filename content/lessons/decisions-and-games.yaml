schema_version: 0.2-draft
lesson:
  id: decisions-and-games
  version: 0.1.0-draft
  title: Value a choice and its later consequences
  state: draft
  summary: Expected utility and discounted return turn outcomes into decision criteria; Bellman recursion and game
    models make assumptions about future actions explicit.
  slot: B20
  category: bridge
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.decisions-and-games
  version: 1-draft
  statement: Expected utility and discounted return turn outcomes into decision criteria; Bellman recursion and
    game models make assumptions about future actions explicit.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - decisions-and-games.base
  - decisions-and-games.transfer
  prerequisites:
  - anyOf:
    - objective.probability
  - anyOf:
