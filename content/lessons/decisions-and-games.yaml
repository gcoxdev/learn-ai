assessment_families:
  - id: decisions-and-games.base
    objective_ref: objective.decisions-and-games
    task: base
    response_type: single_choice
    points: 1
    hint: Multiply each payoff by its probability and add; discount each later reward by one more factor of γ.
    remediation_scene: decisions-and-games.s2
    variants:
      - id: decisions-and-games.base.1
        prompt: An action pays 6 with probability 0.5 and 0 otherwise. What is expected payoff?
        options:
          - id: a
            text: '3'
          - id: b
            text: '6'
          - id: c
            text: '0.5'
        answer: a
        feedback: Average the payoffs using their probabilities.
        retired: true
      - id: decisions-and-games.base.2
        prompt: Rewards are 1 now and 6 next, with discount 0.5. What is return?
        options:
          - id: b
            text: '7'
          - id: c
            text: '3.5'
          - id: a
            text: '4'
        answer: a
        feedback: The later reward contributes 3, so total return is 4.
        retired: true
  - id: decisions-and-games.transfer
    objective_ref: objective.decisions-and-games
    task: transfer
    response_type: single_choice
    points: 1
    hint: Hold the other player's choice fixed and ask whether you could do better by changing yours alone.
    remediation_scene: decisions-and-games.s4
    variants:
      - id: decisions-and-games.transfer.1
        prompt: A policy is best against one fixed opponent. Is it necessarily best against an adaptive opponent?
        options:
          - id: b
            text: Yes; best response means universally best
          - id: c
            text: Yes; games contain no uncertainty
          - id: a
            text: No; the opponent changes the outcome distribution
        answer: a
        feedback: The opponent policy is part of the decision model.
        retired: true
      - id: decisions-and-games.transfer.2
        prompt: Does a Nash equilibrium guarantee the highest total welfare?
        options:
          - id: c
            text: Only when written as a matrix
          - id: a
            text: No; equilibrium and social efficiency are different properties
          - id: b
            text: Yes, by definition
        answer: a
        feedback: No unilateral incentive to change does not imply a collective optimum.
        retired: true
  - id: decisions-and-games.base.v2
    objective_ref: objective.decisions-and-games
    task: base
    response_type: single_choice
    points: 1
    hint: "Expected value weights each outcome by its probability; γ shrinks each later reward; an equilibrium is a cell where neither player gains by switching alone."
    remediation_scene: decisions-and-games.s1
    variants:
      - id: decisions-and-games.base.v2.1
        prompt: A delivery robot's back road takes 10 minutes with probability 0.7 and 40 minutes with probability 0.3. What is its expected travel time?
        options:
          - id: b
            text: 25 minutes, halfway between the two times
          - id: c
            text: 10 minutes, the time it usually takes
          - id: a
            text: 19 minutes, the probability-weighted average
        answer: a
        feedback: 0.7 × 10 + 0.3 × 40 = 7 + 12 = 19 minutes. The plain midpoint ignores that 10 minutes is more likely, and the most likely time ignores the slow trips entirely.
      - id: decisions-and-games.base.v2.2
        prompt: A raffle ticket pays $100 with probability 0.05 and nothing otherwise. Its expected value is $5. What does that $5 tell you?
        options:
          - id: a
            text: Over many tickets, the average payout per ticket is about $5
          - id: c
            text: A typical ticket pays out about $5 when the draw is held
          - id: b
            text: About 5% of tickets pay out the full $5 each
        answer: a
        feedback: Each ticket pays $100 or $0, never $5; the $5 is a long-run average. 5% is the chance of winning, and a winner gets $100.
      - id: decisions-and-games.base.v2.3
        prompt: An agent uses discount factor γ = 0. Which rewards count toward its return?
        options:
          - id: c
            text: All future rewards, each counted equally
          - id: a
            text: Only the reward from the very next step
          - id: b
            text: Only the reward at the end of the episode
        answer: a
        feedback: Every later reward is multiplied by a power of γ, and any power of 0 is 0, so only the first reward survives. Counting all rewards equally is γ = 1.
      - id: decisions-and-games.base.v2.4
        prompt: 'Two phone makers each pick charger type A or B. Both A: each earns 3. Both B: each earns 2. Different types: each earns 0. Which outcomes are Nash equilibria?'
        options:
          - id: b
            text: Only both-A, because it pays more than both-B
          - id: a
            text: Both-A and both-B, since switching alone drops to 0
          - id: c
            text: Neither one, since no type is best whatever the rival does
        answer: a
        feedback: At both-B, switching alone to A pays 0, less than 2, so both-B is stable too. Higher payoffs make both-A better for everyone, not the only equilibrium. A game can have equilibria without any choice that's always best.
      - id: decisions-and-games.base.v2.5
        prompt: In Rosa's price game, High/High pays each truck 500 and Low/Low pays each 300. Why is High/High not a Nash equilibrium?
        options:
          - id: c
            text: Because Low/Low gives the two trucks a lower total
          - id: b
            text: Because a Nash equilibrium must give the highest total
          - id: a
            text: Because either truck can switch alone to Low and earn 700
        answer: a
        feedback: An equilibrium only needs no profitable solo switch. From High/High, switching to Low raises the switcher from 500 to 700, so it isn't stable. Totals don't enter the definition, which is why the stable Low/Low can be worse for both.
  - id: decisions-and-games.transfer.v2
    objective_ref: objective.decisions-and-games
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name what's really being valued (utility, discounted reward, or a reply to another player), then redo the calculation with that.
    remediation_scene: decisions-and-games.s4
    variants:
      - id: decisions-and-games.transfer.v2.1
        prompt: A cleaning robot with γ = 0.5 grabs a crumb worth 5 right now instead of heading for a charger worth 100 that it would reach in 5 steps. Why?
        options:
          - id: a
            text: 100 × 0.5⁵ ≈ 3.1, which is less than 5
          - id: b
            text: Its reward function must be counting the charger wrong
          - id: c
            text: Discounting treats the charger as a negative reward
        answer: a
        feedback: Five steps of discounting shrink 100 to about 3.1, so the crumb really is worth more to this agent. A γ closer to 1 would make it patient; nothing about the reward itself is broken.
      - id: decisions-and-games.transfer.v2.2
        prompt: Two pricing agents both settle on low prices. Neither gains by raising its price alone, but both would earn more if both raised. How should you describe this outcome?
        options:
          - id: b
            text: Not an equilibrium, since a better outcome for both exists
          - id: a
            text: A Nash equilibrium that is worse for both than another outcome
          - id: c
            text: A sign that the agents' learning code is malfunctioning
        answer: a
        feedback: No profitable solo switch is the definition of a Nash equilibrium, and this one is a prisoner's dilemma. A better joint outcome doesn't remove the equilibrium, and self-interested agents reach it without any bug.
      - id: decisions-and-games.transfer.v2.3
        prompt: 'A hospital scheduler compares plan A (always 8 nurses per shift) and plan B (10 or 6 nurses, 50% each). Any shift below 7 nurses is unsafe. Both average 8 nurses. Which should it choose?'
        options:
          - id: c
            text: Either plan, since their expected staffing is equal
          - id: b
            text: Plan B, since it matches A on average and sometimes has 10
          - id: a
            text: Plan A, since B's unsafe shifts should carry a heavy penalty
        answer: a
        feedback: Equal expected nurse counts hide that B is unsafe half the time. Scoring outcomes by utility, with a large penalty for unsafe shifts, makes A clearly better. Averaging raw counts treats 6 nurses as if it were just a little worse than 8.
      - id: decisions-and-games.transfer.v2.4
        prompt: A chess program picks each move by assuming the opponent will reply at random. It keeps walking into simple traps. What should it assume instead?
        options:
          - id: a
            text: That the opponent picks the reply that is best for the opponent
          - id: c
            text: That the opponent repeats whatever it played the last time
          - id: b
            text: That the opponent picks the reply that is best for the program
        answer: a
        feedback: A trap works because the opponent picks its best reply, so a sound plan assumes that. This is minimax, from the lesson on game search. Assuming random or friendly replies overrates moves that a good opponent punishes.
  - id: decisions-and-games.calculate
    objective_ref: objective.decisions-and-games
    task: base
    response_type: numeric
    points: 1
    hint: "Multiply the first reward by 1, the second by γ, the third by γ², and so on, then add. Working backward, value = reward + γ × next value."
    remediation_scene: decisions-and-games.s3
    absolute_tolerance: 0.01
    variants:
      - id: decisions-and-games.calculate.1
        prompt: An agent receives rewards 10, 10, 10 on three steps, with γ = 0.5. What is its discounted return?
        answer: 17.5
        feedback: 10 + 0.5 × 10 + 0.25 × 10 = 10 + 5 + 2.5 = 17.5.
      - id: decisions-and-games.calculate.2
        prompt: An agent receives rewards 0, 0, 100 on three steps, with γ = 0.9. What is its discounted return?
        answer: 81
        feedback: Only the third reward is nonzero, and it is two steps away, so it's multiplied by 0.9² = 0.81, giving 81.
      - id: decisions-and-games.calculate.3
        prompt: An agent receives rewards 5, −2, 8 on three steps, with γ = 0.5. What is its discounted return?
        answer: 6
        feedback: 5 + 0.5 × (−2) + 0.25 × 8 = 5 − 1 + 2 = 6. A negative reward is discounted the same way.
      - id: decisions-and-games.calculate.4
        prompt: An agent earns reward 4 now, and the state it lands in is worth 50. With γ = 0.9, what is the value of acting this way now?
        answer: 49
        feedback: One Bellman step, value = reward + γ × next value = 4 + 0.9 × 50 = 4 + 45 = 49.
      - id: decisions-and-games.calculate.5
        prompt: An agent receives reward 3 on each of four steps, with γ = 0.5. What is its discounted return?
        answer: 5.625
        feedback: 3 + 1.5 + 0.75 + 0.375 = 5.625. Each step's reward is worth half the one before.
