lesson:
  id: decisions-and-games
  version: 0.4.0-draft
  title: Value a choice and its later consequences
  state: draft
  summary: A food truck can play it safe or gamble on a festival crowd, and a rival truck is choosing too. Weigh uncertain payoffs, value future days, and find where a price war settles.
  slot: B20
  category: bridge
  sources:
    - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
      url: https://aima.cs.berkeley.edu/
objectives:
  - id: objective.decisions-and-games
    version: 2-draft
    statement: Compute expected values and discounted returns, work a value backward one step at a time, and find the Nash equilibria of a small payoff table.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - decisions-and-games.base.v2
      - decisions-and-games.transfer.v2
      - decisions-and-games.calculate
    prerequisites:
      - anyOf:
          - objective.probability
      - anyOf:
          - objective.arithmetic
scenes:
  - id: decisions-and-games.s1
    title: Park safe, or gamble on the festival?
    type: explanation
    depth: intuition
    objective_refs:
      - objective.decisions-and-games
    markdown: |-
      Rosa runs a taco truck. Tomorrow she can park at the office park, where she reliably sells \$400, or at a music festival. If the crowd shows up (a 30% chance) she sells \$1,000; if it rains, just \$100. Where should she go?

      **Why AI needs this:** a reinforcement-learning agent chooses actions by their expected future reward, a chess engine assumes its opponent will reply well, and agents that share a world must predict each other. This bridge covers the three calculations behind all of that.

      A decision has actions (park or festival), **outcomes** with probabilities, and a value for each outcome. The **expected value** of an action is its probability-weighted average payoff, the same average you met in the probability lessons:

      | Action | Calculation | Expected value |
      | --- | --- | ---: |
      | Office park | 1.0 × \$400 | \$400 |
      | Festival | 0.3 × \$1,000 + 0.7 × \$100 | \$370 |

      By expected money, Rosa should take the office park.

      :::predict How likely would a crowd have to be for the festival to match the office park?
      Set p × 1,000 + (1 − p) × 100 = 400. That's 100 + 900p = 400, so p = 1/3. Above a 1-in-3 chance of a crowd, the festival wins on expected value.
      :::
    bridges:
      - probability
  - id: decisions-and-games.s2
    title: The expected value is rarely what you get
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.decisions-and-games
    markdown: |-
      :::mixup "The festival's expected value is \$370, so Rosa expects to make about \$370 there."
      She never makes \$370 at the festival. She makes \$1,000 or \$100. The expected value is the average over many such days: over 100 festival days, about 30 good and 70 rainy ones, she'd total about \$37,000.
      :::

      That's also why money isn't always the right thing to average. Suppose Rosa owes her supplier \$300 tomorrow, and missing it loses her the truck. Now the \$100 outcome is a disaster, not just a smaller number. Decision theory handles this with **utility**, a score for how much each outcome is actually worth to the decider. Give "lose the truck" a utility of −10,000 and the festival's expected utility sinks far below the office park's, even though its expected money is only \$30 less.

      In AI, the reward you write for an agent plays the role of utility. If the reward treats every dollar the same, the agent will happily take risks you'd never take yourself.
    bridges:
      - probability
  - id: decisions-and-games.s3
    title: Value tomorrow less than today
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.decisions-and-games
    markdown: |-
      Rosa's plan covers three days: \$100, then \$100, then a big \$400 catering job. RL agents add future rewards with a **discount factor** γ (gamma) between 0 and 1: each step into the future multiplies a reward by one more γ. The total is the **discounted return**:

      $$G = r_1 + \gamma\, r_2 + \gamma^2 r_3 + \cdots$$

      With γ = 0.9: G = 100 + 0.9 × 100 + 0.81 × 400 = 100 + 90 + 324 = **514**.

      You can also work backward, one step at a time. Each day's value is its reward plus γ times the next day's value:

      | Day | Reward | Value = reward + 0.9 × next value |
      | ---: | ---: | --- |
      | 3 | 400 | 400 |
      | 2 | 100 | 100 + 0.9 × 400 = 460 |
      | 1 | 100 | 100 + 0.9 × 460 = 514 |

      Same answer. That one-step rule, $V = r + \gamma V_{\text{next}}$, is the heart of the **Bellman equation**, which the lesson on MDPs builds on. With γ = 0, only today counts; with γ near 1, the agent is patient.
    bridges: []
  - id: decisions-and-games.s4
    title: When the rival truck chooses too
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.decisions-and-games
    markdown: |-
      A second truck parks next to Rosa. Each chooses a High or Low price, and each one's sales depend on both choices:

      | | Rival: High | Rival: Low |
      | --- | --- | --- |
      | **Rosa: High** | 500, 500 | 200, 700 |
      | **Rosa: Low** | 700, 200 | 300, 300 |

      (Rosa's sales first, the rival's second.) Now there's no single best action; Rosa's best choice depends on the rival's. Her **best response** to each column:

      - If the rival goes High: Low pays 700, High pays 500. Go Low.
      - If the rival goes Low: Low pays 300, High pays 200. Go Low.

      The rival reasons the same way. A **Nash equilibrium** is a pair of choices where neither player can do better by changing only their own. Here that's Low/Low.

      :::predict Both trucks would earn 500 at High/High. Is that an equilibrium?
      No. If the rival stays High, Rosa can switch to Low and earn 700 instead of 500, and so can the rival. The stable outcome, 300 each, is worse for both. This is the classic prisoner's dilemma: an equilibrium is stable, not necessarily good.
      :::

      ```python run
      import numpy as np

      actions = ["High", "Low"]
      # mine[i, j] = my sales when I charge actions[i] and my rival charges actions[j]
      mine = np.array([[500, 200],
                       [700, 300]])
      rival = mine.T                    # same game from the rival's side

      for i, a in enumerate(actions):
          for j, b in enumerate(actions):
              i_cant_improve = mine[i, j] == mine[:, j].max()       # best reply to their price
              they_cant_improve = rival[i, j] == rival[i, :].max()  # their best reply to mine
              tag = "  <- Nash equilibrium" if i_cant_improve and they_cant_improve else ""
              print(f"me {a:4s}, rival {b:4s}: me {mine[i, j]}, rival {rival[i, j]}{tag}")
      ```

      Try a ruinous price war: change the 300 to 150. Now the equilibria are High/Low and Low/High, where one truck undercuts and the other doesn't. The lessons on game search and multi-agent learning build on exactly this reasoning.
    bridges: []
  - id: decisions-and-games.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.decisions-and-games
    markdown: Weigh a delivery robot's routes, a patient cleaning robot, two phone makers choosing a charger, and pricing agents stuck in a price war.
    takeaway: |-
      Expected value averages payoffs by probability, and discounting makes later rewards count less. When others choose too, look for a Nash equilibrium: stable for everyone, but not always best for anyone.
  - id: decisions-and-games.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.decisions-and-games
    markdown: |-
      Expected utility values uncertain choices; discounted return includes later rewards. In a game, a good choice also depends on what other players do.
