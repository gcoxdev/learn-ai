assessment_families:
- id: decisions-and-games.base
  objective_ref: objective.decisions-and-games
  task: base
  response_type: single_choice
  points: 1
  hint: 'Calculate a small choice: trace the inputs, operation, and result before choosing.'
  remediation_scene: decisions-and-games.s2
  variants:
  - id: decisions-and-games.base.1
    prompt: An action pays 6 with probability 0.5 and 0 otherwise. What is expected payoff?
    options:
    - id: a
      text: '3'
    - id: b
      text: '6'
    - id: c
      text: '0.5'
    answer: a
    feedback: Average the payoffs using their probabilities.
  - id: decisions-and-games.base.2
    prompt: Rewards are 1 now and 6 next, with discount 0.5. What is return?
    options:
    - id: b
      text: '7'
    - id: c
      text: '3.5'
    - id: a
      text: '4'
    answer: a
    feedback: The later reward contributes 3, so total return is 4.
- id: decisions-and-games.transfer
  objective_ref: objective.decisions-and-games
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Other decision makers can adapt: trace the inputs, operation, and result before choosing.'
  remediation_scene: decisions-and-games.s4
  variants:
  - id: decisions-and-games.transfer.1
    prompt: A policy is best against one fixed opponent. Is it necessarily best against an adaptive opponent?
    options:
    - id: b
      text: Yes; best response means universally best
    - id: c
      text: Yes; games contain no uncertainty
    - id: a
      text: No; the opponent changes the outcome distribution
    answer: a
    feedback: The opponent policy is part of the decision model.
  - id: decisions-and-games.transfer.2
    prompt: Does a Nash equilibrium guarantee the highest total welfare?
    options:
    - id: c
      text: Only when written as a matrix
    - id: a
      text: No; equilibrium and social efficiency are different properties
    - id: b
      text: Yes, by definition
    answer: a
    feedback: No unilateral incentive to change does not imply a collective optimum.
