scenes:
- id: decisions-and-games.s1
  title: An outcome needs a value rule
  type: explanation
  depth: intuition
  objective_refs:
  - objective.decisions-and-games
  markdown: A decision needs available actions, uncertain outcomes, and a way to value those outcomes. Utility represents
    preferences within a model; it need not be money. Expected utility averages values using outcome probabilities.
    Two people can agree on probabilities yet choose differently because their preferences differ.
  text_mode: A decision needs available actions, uncertain outcomes, and a way to value those outcomes. Utility
    represents preferences within a model; it need not be money. Expected utility averages values using outcome
    probabilities. Two people can agree on probabilities yet choose differently because their preferences differ.
  bridges: []
- id: decisions-and-games.s2
  title: Calculate a small choice
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.decisions-and-games
  markdown: Action A pays 4 for certain. Action B pays 10 with probability 0.3 and 0 otherwise, so its expected
    monetary payoff is 3. A person maximizing expected money chooses A. A different utility function or additional
    constraints can change that decision; the calculation alone does not define what everyone ought to want.
  text_mode: Action A pays 4 for certain. Action B pays 10 with probability 0.3 and 0 otherwise, so its expected
    monetary payoff is 3. A person maximizing expected money chooses A. A different utility function or additional
    constraints can change that decision; the calculation alone does not define what everyone ought to want.
  bridges:
  - probability
- id: decisions-and-games.s3
  title: Value a sequence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.decisions-and-games
  markdown: A discounted return adds rewards with later ones multiplied by powers of discount γ. For rewards 2 now
    and 4 next, with γ = 0.5, return is 2 + 0.5 × 4 = 4. Bellman recursion separates immediate reward from discounted
    future value, letting repeated subproblems share the same value estimates.
  text_mode: A discounted return adds rewards with later ones multiplied by powers of discount γ. For rewards 2
    now and 4 next, with γ = 0.5, return is 2 + 0.5 × 4 = 4. Bellman recursion separates immediate reward from discounted
    future value, letting repeated subproblems share the same value estimates.
  bridges: []
- id: decisions-and-games.s4
  title: Other decision makers can adapt
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.decisions-and-games
  markdown: In a game, your outcome can depend on another player’s strategy. A best response is best against a specified
    opponent policy, not against every possible opponent. A Nash equilibrium is a set of strategies with no profitable
    unilateral deviation under the model; it need not maximize collective welfare or describe how learning will
    converge.
  text_mode: In a game, your outcome can depend on another player’s strategy. A best response is best against a
    specified opponent policy, not against every possible opponent. A Nash equilibrium is a set of strategies with
    no profitable unilateral deviation under the model; it need not maximize collective welfare or describe how
    learning will converge.
  bridges: []
- id: decisions-and-games.check
