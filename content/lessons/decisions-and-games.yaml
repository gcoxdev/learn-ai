schema_version: 0.2-draft
lesson:
  id: decisions-and-games
  version: 0.3.0-draft
  title: Value a choice and its later consequences
  state: draft
  summary: Value uncertain choices and notice how another decision maker changes the problem.
  slot: B20
  category: bridge
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.decisions-and-games
  version: 1-draft
  statement: Expected utility and discounted return turn outcomes into decision criteria; Bellman recursion
    and game models make assumptions about future actions explicit.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - decisions-and-games.base
  - decisions-and-games.transfer
  prerequisites:
  - anyOf:
    - objective.probability
  - anyOf:
    - objective.arithmetic
scenes:
- id: decisions-and-games.s1
  title: An outcome needs a value rule
  type: explanation
  depth: intuition
  objective_refs:
  - objective.decisions-and-games
  markdown: A decision needs available actions, uncertain outcomes, and a way to value those outcomes. Utility
    represents preferences within a model; it need not be money. Expected utility averages values using outcome
    probabilities. Two people can agree on probabilities yet choose differently because their preferences differ.
  text_mode: A decision needs available actions, uncertain outcomes, and a way to value those outcomes. Utility
    represents preferences within a model; it need not be money. Expected utility averages values using outcome
    probabilities. Two people can agree on probabilities yet choose differently because their preferences differ.
  bridges: []
- id: decisions-and-games.s2
  title: Calculate a small choice
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.decisions-and-games
  markdown: Action A pays 4 for certain. Action B pays 10 with probability 0.3 and 0 otherwise, so its expected
    monetary payoff is 3. A person maximizing expected money chooses A. A different utility function or additional
    constraints can change that decision; the calculation alone does not define what everyone ought to want.
  text_mode: Action A pays 4 for certain. Action B pays 10 with probability 0.3 and 0 otherwise, so its expected
    monetary payoff is 3. A person maximizing expected money chooses A. A different utility function or additional
    constraints can change that decision; the calculation alone does not define what everyone ought to want.
  bridges:
  - probability
- id: decisions-and-games.s3
  title: Value a sequence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.decisions-and-games
  markdown: A discounted return adds rewards with later ones multiplied by powers of discount γ. For rewards
    2 now and 4 next, with γ = 0.5, return is 2 + 0.5 × 4 = 4. Bellman recursion separates immediate reward
    from discounted future value, letting repeated subproblems share the same value estimates.
  text_mode: A discounted return adds rewards with later ones multiplied by powers of discount γ. For rewards
    2 now and 4 next, with γ = 0.5, return is 2 + 0.5 × 4 = 4. Bellman recursion separates immediate reward
    from discounted future value, letting repeated subproblems share the same value estimates.
  bridges: []
- id: decisions-and-games.s4
  title: Other decision makers can adapt
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.decisions-and-games
  markdown: 'In a game, your outcome can depend on another player’s strategy. A best response is best against
    a specified opponent policy, not against every possible opponent. A **Nash equilibrium** is a set of strategies
    where no player gains by changing only their own strategy while the others stay fixed. It need not give
    the best collective outcome or explain how learning will converge.


    In a two-player toy coordination game, each chooses A or B. Both receive 2 if both choose A, both receive
    1 if both choose B, and both receive 0 if their choices differ. Both-A and both-B are each Nash equilibria:
    changing only your own choice lowers your payoff. Yet both-A pays everyone more.'
  text_mode: 'In a game, your outcome can depend on another player’s strategy. A best response is best against
    a specified opponent policy, not against every possible opponent. A **Nash equilibrium** is a set of strategies
    where no player gains by changing only their own strategy while the others stay fixed. It need not give
    the best collective outcome or explain how learning will converge.


    In a two-player toy coordination game, each chooses A or B. Both receive 2 if both choose A, both receive
    1 if both choose B, and both receive 0 if their choices differ. Both-A and both-B are each Nash equilibria:
    changing only your own choice lowers your payoff. Yet both-A pays everyone more.'
  bridges: []
- id: decisions-and-games.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.decisions-and-games
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Expected utility values uncertain choices; discounted return includes later rewards. In a game,
    a good choice also depends on what other players do.
- id: decisions-and-games.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
