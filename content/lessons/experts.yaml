- id: experts.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.experts
  text_mode: 'Suppose a router assigns probabilities [0.55, 0.25, 0.15, 0.05] to four experts. **Top-two selection**
    chooses the first two.


    For this example, normalize only their selected weights. Their total is 0.80, giving shares 0.55/0.80 =
    0.6875 and 0.25/0.80 = 0.3125.


    If the selected expert outputs are [2, 0] and [0, 4], combine matching coordinates:


    - First: 0.6875 × 2 + 0.3125 × 0 = 1.375.

    - Second: 0.6875 × 0 + 0.3125 × 4 = 1.25.


    The result is [1.375, 1.25]. This is a constructed example; real routing conventions vary.'
  title: Trace four experts and a top-two router
  markdown: 'Suppose a router assigns probabilities [0.55, 0.25, 0.15, 0.05] to four experts. **Top-two selection**
    chooses the first two.


    For this example, normalize only their selected weights. Their total is 0.80, giving shares 0.55/0.80 =
