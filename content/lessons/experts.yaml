scenes:
- id: experts.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.experts
  text_mode: The complete explanation is available as readable text.
  title: Sparse computation inside a network
  markdown: 'An MoE layer can replace a feed-forward sublayer inside a transformer block. A router uses a token
    representation to select expert subnetworks. Other shared parts of the block still run.


    This is not the same as an app sending entire user requests to separate chat models. It is routing computation
    within the chosen network architecture.'
- id: experts.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.experts
  text_mode: The complete explanation is available as readable text.
  title: Trace four experts and a top-two router
  markdown: 'Suppose illustrative router probabilities are 0.55, 0.25, 0.15 and 0.05. Top-two selection picks the
    first two experts. In this example we renormalize their weights to 0.6875 and 0.3125.


    If their output vectors are [2,0] and [0,4], the weighted combination is [1.375,1.25]. Routing conventions vary;
    this is a constructed teaching case.'
  simulation: moe
- id: experts.s3
  type: explanation
  depth: intuition
  objective_refs:
  - objective.experts
  text_mode: The complete explanation is available as readable text.
  title: Active is not the same as stored
  markdown: 'Only selected experts may compute for a token, but the other expert weights still need to exist somewhere.
    Memory use, data movement and shared layers all affect cost.


    More total parameters do not directly tell you the work performed for one token or the response latency on a
    particular machine.'
- id: experts.s4
  type: explanation
  depth: intuition
  objective_refs:
  - objective.experts
  text_mode: The complete explanation is available as readable text.
  title: Routing creates systems work
  markdown: 'A batch can send many tokens to one expert and few to another. Implementations address load balance,
    capacity, communication and placement in different ways. Shared experts and routing policies further change
    the calculation.


    Do not assume every expert develops a clear human-named specialty. That is a hypothesis to investigate, not
    a property guaranteed by the architecture.'
- id: experts.s5
  type: explanation
  depth: intuition
  objective_refs:
  - objective.experts
  text_mode: The complete explanation is available as readable text.
  title: A focused advanced preview
  markdown: 'You have traced sparse selection and weighted outputs. This preview does not establish competence in
    router gradients, balancing losses, expert parallelism, or full training/inference engineering.


    Those remain part of the advanced MoE curriculum. Here, the checks are practice only and do not award route
    completion.'
- id: experts.check
