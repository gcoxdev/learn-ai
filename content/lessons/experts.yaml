    The result is [1.375, 1.25]. This is a constructed example; real routing conventions vary.'
  simulation: moe
  bridges:
  - vectors
  - probability
- id: experts.s3
  type: explanation
  depth: intuition
  objective_refs:
  - objective.experts
  text_mode: 'Only selected experts may compute for a token, but the other expert weights still need to exist
    somewhere. Memory use, data movement and shared layers all affect cost.


    More total parameters do not directly tell you the work performed for one token or the response latency
    on a particular machine.'
  title: Active is not the same as stored
  markdown: 'Only selected experts may compute for a token, but the other expert weights still need to exist
    somewhere. Memory use, data movement and shared layers all affect cost.


    More total parameters do not directly tell you the work performed for one token or the response latency
    on a particular machine.'
- id: experts.s4
  type: explanation
  depth: intuition
  objective_refs:
  - objective.experts
  text_mode: 'A batch can send many tokens to one expert and few to another. Implementations address load balance,
    capacity, communication and placement in different ways. Shared experts and routing policies further change
    the calculation.


    Do not assume every expert develops a clear human-named specialty. That is a hypothesis to investigate,
    not a property guaranteed by the architecture.'
  title: Routing creates systems work
  markdown: 'A batch can send many tokens to one expert and few to another. Implementations address load balance,
