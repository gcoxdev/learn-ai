scenes:
- id: experts.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.experts
  text_mode: 'A **mixture-of-experts layer**, or **MoE layer**, selects among learned subnetworks called **experts**.
    An expert is a numerical computation, not a person or a guaranteed subject specialist.


    A **router** scores which experts should process a token''s current vector. In a transformer, an MoE layer
    can replace a feed-forward sublayer, the part that transforms each token vector through learned operations.
    Other shared parts of the block still run.


    This routes work inside a network. An application sending whole requests to separate chat models is a different
    kind of routing.'
  title: Sparse computation inside a network
  markdown: 'A **mixture-of-experts layer**, or **MoE layer**, selects among learned subnetworks called **experts**.
    An expert is a numerical computation, not a person or a guaranteed subject specialist.


