assessment_families:
  - id: calibrated-decision-training.base
    objective_ref: objective.calibrated-decision-training
    task: base
    response_type: single_choice
    points: 1
    hint: Ask whether reporting your true belief gives the highest expected reward. If a different report scores higher, the rule is improper and rewards exaggeration.
    remediation_scene: calibrated-decision-training.s2
    variants:
      - id: calibrated-decision-training.base.1
        prompt: Tally trains a model with the reward "the probability it gave the true option" (a linear score). The model believes a message is a refund with probability 0.7. What will training push it to report?
        options:
          - id: c
            text: 0.5, so it hedges between the two possible answers
          - id: b
            text: 0.7, since that matches its own belief about the message
          - id: a
            text: Near 1.0, since higher reports score more
        answer: a
        feedback: With a linear reward, the expected score is 0.7q + 0.3(1 − q), which rises all the way to q = 1. Proper rules such as log and Brier peak at the true belief instead.
      - id: calibrated-decision-training.base.2
        prompt: A team rewards a decision model with 1 point when its top option is correct and 0 otherwise. Why does that give poor probabilities?
        options:
          - id: b
            text: It pays the same whether the model says 0.51 or 0.99 on a correct pick
          - id: c
            text: It cannot be computed when there are more than two options
          - id: a
            text: It punishes the model for ever reporting a probability below 0.5
        answer: b
        feedback: Accuracy looks only at which option is on top, so confidence is never rewarded or punished. A proper score also looks at how much probability the truth got.
      - id: calibrated-decision-training.base.3
        prompt: Why does the ranked probability score suit Tally's 0 to 3 urgency answer better than Brier does?
        options:
          - id: c
            text: It gives its best score to the most confident forecasts
          - id: a
            text: It counts a one-level miss as smaller than a three-level miss
          - id: b
            text: It ignores the probabilities and scores the top level
        answer: a
        feedback: RPS compares running totals, so probability placed far from the truth costs more than probability placed nearby. Brier treats every wrong level alike.
      - id: calibrated-decision-training.base.4
        prompt: A team trains a model by minimizing −ln(q), where q is the probability it gave the labeled option. Which scoring rule is that the same as?
        options:
          - id: c
            text: Accuracy of the top pick, since the label is what counts
          - id: b
            text: The linear score, since both look at q alone
          - id: a
            text: The log score, with the sign flipped so lower is better
        answer: a
        feedback: Cross-entropy on the labeled option is −ln q, the negative of the log score ln q. So supervised training is already training on a strictly proper rule. The linear score uses q itself, and accuracy ignores how much probability the truth received.
      - id: calibrated-decision-training.base.5
        prompt: Tally refits a temperature T on held-out messages and divides all logits by it. What changes?
        options:
          - id: a
            text: The confidence values change, while the top pick and accuracy stay the same
          - id: b
            text: Accuracy changes, because the winning option may now differ
          - id: c
            text: Nothing changes, because every logit is divided by the same number
        answer: a
        feedback: Dividing by one number keeps the logits in order, so the top pick is unchanged, but softmax gives different probabilities. That is exactly the effect a calibration repair wants.
      - id: calibrated-decision-training.base.6
        prompt: What does it mean for a scoring rule to be strictly proper?
        options:
          - id: c
            text: It gives the maximum score whenever the top pick is correct
          - id: b
            text: It gives similar scores to any report close to the truth
          - id: a
            text: Reporting your true belief is the single best choice on average
        answer: a
        feedback: Strictly proper means the unique expected-score maximizer is the true belief. Rules that reward only the top pick, or that tie across many reports, don't push toward honesty.
      - id: calibrated-decision-training.base.7
        prompt: On the brake-lever example, the temperature slider goes from 1.0 down to 0.25 while the top answer stays bookings. What happened?
        options:
          - id: b
            text: The model learned the right answer, so its probability for bookings rose
          - id: a
            text: The ranking stayed put, and the wrong top answer looked more confident
          - id: c
            text: The model became less sure of bookings, so it flipped to safety
        answer: a
        feedback: Dividing every score by the same T keeps the order, so bookings stays on top. A smaller T spreads the probabilities further apart, so the wrong answer's probability rose from 0.366 to 0.694.
  - id: calibrated-decision-training.transfer
    objective_ref: objective.calibrated-decision-training
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name the problem first (an improper reward, a missing order between answers, or a leaky evaluation), then pick the fix that targets it.
    remediation_scene: calibrated-decision-training.s5
    variants:
      - id: calibrated-decision-training.transfer.1
        prompt: A hospital trains its triage model with a reward of 1 for a correct top pick. Accuracy is good, but a "95% sure" label is right only 70% of the time. What change targets the problem?
        options:
          - id: b
            text: Collect more correct picks so the model has more rewards to learn from
          - id: a
            text: Reward a strictly proper score such as log or Brier, then refit a temperature
          - id: c
            text: Lower the confidence threshold so more cases are handled automatically
        answer: a
        feedback: Accuracy rewards the winner and says nothing about confidence, so confidence drifts. A proper score pays for honest probabilities. Lowering the threshold only changes which wrong answers get through.
      - id: calibrated-decision-training.transfer.2
        prompt: A review site predicts a 1 to 5 star rating and scores forecasts with Brier. A forecast of 4 stars is penalized the same as a forecast of 1 star when the truth is 5. What is the best fix?
        options:
          - id: c
            text: Switch to a linear score, which is simpler to compute and explain
          - id: b
            text: Treat each star level as its own separate yes/no question
          - id: a
            text: Switch to a ranked probability score (RPS)
        answer: a
        feedback: Ordered answers need a rule that sees distance, which RPS does through running totals. Brier counts all wrong levels the same, and a linear score would reward exaggeration on top.
      - id: calibrated-decision-training.transfer.3
        prompt: A bank's model has ECE 0.30. The team fits a temperature on its test set, measures ECE on that same set, and reports 0.03. What is the problem?
        options:
          - id: b
            text: The temperature should have been fit before the model was trained
          - id: a
            text: The same data chose T and scored it, so the result looks too good
          - id: c
            text: A temperature cannot reduce the ECE of a trained model
        answer: a
        feedback: Choosing T on the test data fits it to that data, so the 0.03 flatters the model. Fit T on a validation split and report ECE on separate, untouched data.
      - id: calibrated-decision-training.transfer.4
        prompt: A vendor says, "We train with RLCD, so our probabilities are honest." What should a buyer do?
        options:
          - id: c
            text: Accept it, since proper scoring rules guarantee honest probabilities
          - id: a
            text: Compute ECE and a reliability table on the buyer's own labeled data
          - id: b
            text: Ask for the vendor's reward formula and trust the model if it's proper
        answer: a
        feedback: A training recipe is a claim about method, not a measurement on your data. Laya says its own model shipped over-confident, and TypeSafe hasn't published its formula, so measure calibration yourself.
      - id: calibrated-decision-training.transfer.5
        prompt: Under the log score, why does reporting 0.99 on an option that is true only 90% of the time cost a model on average?
        options:
          - id: b
            text: Log scores stop rewarding confidence once a report passes 0.9
          - id: c
            text: The log score subtracts a fixed penalty whenever q is above the true rate
          - id: a
            text: The 10% misses give ln(0.01) = −4.6 each, which outweighs the small gain on hits
        answer: a
        feedback: A confident miss is punished heavily by the log, so over-reporting loses more on the misses than it gains on the hits. The expected score peaks at the true rate, 0.9.
      - id: calibrated-decision-training.transfer.6
        prompt: A bank's model has ECE 0.02 on a held-out set, and safety-related messages are a small slice of it. What should the team do before automating safety decisions?
        options:
          - id: c
            text: Treat ECE 0.02 as proof that each automated decision is safe
          - id: b
            text: Refit the temperature on the test set until the slice looks better
          - id: a
            text: Measure the errors among the safety messages its policy would automate
        answer: a
        feedback: ECE is an average over all messages, so a bad slice or a weak high-confidence tail can hide inside it. Measure the errors on the cases the policy will actually automate. Refitting on the test set would spoil the test.
      - id: calibrated-decision-training.transfer.7
        prompt: Tally's high-confidence answers were well calibrated for months. After a new Spanish-language campaign, many 0.95 answers are wrong. What is the best first step?
        options:
          - id: c
            text: Refit the temperature on the new messages and resume automation
          - id: a
            text: Find out what changed, such as the language, before choosing a fix
          - id: b
            text: Raise the threshold to 0.99 and assume the problem is solved
        answer: a
        feedback: One temperature can adjust confidence, but it cannot restore distinctions the model never learned for an unsupported language. Diagnose first, and pause automation on the affected messages while you do.
