lesson:
  id: bayesian-optimization-and-automl
  version: 0.4.0-draft
  title: Choose expensive experiments using a surrogate model
  state: draft
  summary: Each training run costs six GPU-hours and you can afford twenty. Learn to pick the next run with expected improvement, cut losers early, and see why architecture search went from 2,000 GPU-days to four.
  slot: M32.7
  category: learning
  sources:
    - title: A Tutorial on Bayesian Optimization (Frazier, 2018)
      url: https://arxiv.org/abs/1807.02811
    - title: "Practical Bayesian Optimization of Machine Learning Algorithms (Snoek, Larochelle & Adams, 2012)"
      url: https://arxiv.org/abs/1206.2944
    - title: "Non-stochastic Best Arm Identification and Hyperparameter Optimization (Jamieson & Talwalkar, 2016)"
      url: https://arxiv.org/abs/1502.07943
    - title: "Hyperband: A Novel Bandit-Based Approach to Hyperparameter Optimization (Li et al., 2018)"
      url: https://arxiv.org/abs/1603.06560
    - title: "Neural Architecture Search with Reinforcement Learning (Zoph & Le, 2017)"
      url: https://arxiv.org/abs/1611.01578
    - title: "DARTS: Differentiable Architecture Search (Liu, Simonyan & Yang, 2019)"
      url: https://arxiv.org/abs/1806.09055
