schema_version: 0.2-draft
lesson:
  id: bayesian-optimization-and-automl
  version: 0.1.0-draft
  title: Choose expensive experiments using a surrogate model
  state: draft
  summary: Bayesian optimization models an expensive objective and selects evaluations with an acquisition rule;
    AutoML adds search spaces, resource allocation, and validation procedures around model selection.
  slot: M32.7
  category: learning
  minutes: 12
  sources:
  - title: A Tutorial on Bayesian Optimization
    url: https://arxiv.org/abs/1807.02811
  - title: Hyperband
    url: https://arxiv.org/abs/1603.06560
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.bayesian-optimization-and-automl
  version: 1-draft
  statement: Bayesian optimization models an expensive objective and selects evaluations with an acquisition rule;
    AutoML adds search spaces, resource allocation, and validation procedures around model selection.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - bayesian-optimization-and-automl.base
  - bayesian-optimization-and-automl.transfer
  prerequisites:
  - anyOf:
    - objective.bayesian-learning
  - anyOf:
    - objective.regularization-and-tuning
scenes:
- id: bayesian-optimization-and-automl.s1
  title: Model the unknown score function
  type: explanation
  depth: intuition
  objective_refs:
  - objective.bayesian-optimization-and-automl
  markdown: When one training run is expensive, fit a surrogate that predicts performance and uncertainty across
    hyperparameter choices. Gaussian processes are one option. The surrogate estimates the objective from observed
    trials, so its uncertainty and smoothness assumptions influence search.
  text_mode: When one training run is expensive, fit a surrogate that predicts performance and uncertainty across
    hyperparameter choices. Gaussian processes are one option. The surrogate estimates the objective from observed
    trials, so its uncertainty and smoothness assumptions influence search.
  bridges: []
- id: bayesian-optimization-and-automl.s2
  title: Choose the next evaluation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bayesian-optimization-and-automl
  markdown: An acquisition function balances promising predicted values with information value or uncertainty. Expected
    improvement and upper-confidence-style rules are examples. A candidate with slightly worse predicted mean but
    high uncertainty can be worth trying when it may reveal a better region.
  text_mode: An acquisition function balances promising predicted values with information value or uncertainty.
    Expected improvement and upper-confidence-style rules are examples. A candidate with slightly worse predicted
    mean but high uncertainty can be worth trying when it may reveal a better region.
  bridges: []
- id: bayesian-optimization-and-automl.s3
  title: Allocate partial budgets
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bayesian-optimization-and-automl
  markdown: Multi-fidelity methods evaluate candidates with fewer epochs or smaller datasets before assigning larger
    resources. Early performance can be a useful proxy or can misrank slow-starting configurations. AutoML also
    needs conditional search spaces and valid pipeline choices, including preprocessing.
  text_mode: Multi-fidelity methods evaluate candidates with fewer epochs or smaller datasets before assigning larger
    resources. Early performance can be a useful proxy or can misrank slow-starting configurations. AutoML also
    needs conditional search spaces and valid pipeline choices, including preprocessing.
  bridges: []
- id: bayesian-optimization-and-automl.s4
  title: Keep search honest and recoverable
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bayesian-optimization-and-automl
  markdown: Record trials, failures, seeds, budgets, and the validation procedure. Compare with random search under
    equal resources. Selection does not eliminate overfitting to validation, and the final selected pipeline still
    needs an untouched test and reproducible artifact definition.
  text_mode: Record trials, failures, seeds, budgets, and the validation procedure. Compare with random search under
    equal resources. Selection does not eliminate overfitting to validation, and the final selected pipeline still
    needs an untouched test and reproducible artifact definition.
  bridges: []
