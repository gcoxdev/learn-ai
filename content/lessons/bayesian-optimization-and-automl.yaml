assessment_families:
  - id: bayesian-optimization-and-automl.base
    objective_ref: objective.bayesian-optimization-and-automl
    task: base
    response_type: single_choice
    points: 1
    hint: 'Choose the next evaluation: trace the inputs, operation, and result before choosing.'
    remediation_scene: bayesian-optimization-and-automl.s2
    variants:
      - id: bayesian-optimization-and-automl.base.1
        prompt: What does a surrogate model estimate?
        options:
          - id: a
            text: The expensive objective across candidate settings
          - id: b
            text: Only training file paths
          - id: c
            text: The exact optimum without data
        answer: a
        feedback: Observed trials support predictions and uncertainty.
        retired: true
      - id: bayesian-optimization-and-automl.base.2
        prompt: Why evaluate an uncertain candidate with a lower predicted mean?
        options:
          - id: b
            text: Uncertainty always means failure
          - id: c
            text: Only the best mean may ever be chosen
          - id: a
            text: It may reveal useful information or an unexpectedly good region
        answer: a
        feedback: Acquisition trades exploitation and exploration.
        retired: true
  - id: bayesian-optimization-and-automl.transfer
    objective_ref: objective.bayesian-optimization-and-automl
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Keep search honest and recoverable: trace the inputs, operation, and result before choosing.'
    remediation_scene: bayesian-optimization-and-automl.s4
    variants:
      - id: bayesian-optimization-and-automl.transfer.1
        prompt: Can early low-budget performance misrank final candidates?
        options:
          - id: b
            text: 'No'
          - id: c
            text: Only if training is deterministic
          - id: a
            text: 'Yes'
        answer: a
        feedback: Learning curves can cross or develop at different rates.
        retired: true
      - id: bayesian-optimization-and-automl.transfer.2
        prompt: Does AutoML remove the need for independent final evaluation?
        options:
          - id: c
            text: Only when Bayesian optimization is used
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Automated selection still uses validation feedback.
        retired: true
  - id: bayesian-optimization-and-automl.base.v2
    objective_ref: objective.bayesian-optimization-and-automl
    task: base
    response_type: single_choice
    points: 1
    hint: Split expected improvement into its two terms, the mean's lead over the best so far (exploit) and the uncertainty's upside (explore), and remember that successive halving judges configurations by their early scores.
    remediation_scene: bayesian-optimization-and-automl.s2
    variants:
      - id: bayesian-optimization-and-automl.base.v2.1
        prompt: The best result so far is 0.80. Candidate P has μ = 0.79 and σ = 0.06; candidate Q has μ = 0.80 and σ = 0.001. Why can P have higher expected improvement than Q?
        options:
          - id: b
            text: EI prefers lower means, since they leave more room to improve
          - id: a
            text: P's large uncertainty gives a real chance of beating 0.80 by a lot
          - id: c
            text: Q's mean equals the best so far, which makes its EI undefined
        answer: a
        feedback: EI counts only the upside, so a wide prediction with a mean just below the best can expect more improvement than a near-certain tie. EI doesn't prefer low means as such, and at μ = f* it's well defined, σ·φ(0), just small when σ is tiny.
      - id: bayesian-optimization-and-automl.base.v2.2
        prompt: Why does Bayesian optimization pick the next run by maximizing an acquisition function on the surrogate, rather than running the setting with the highest predicted mean?
        options:
          - id: c
            text: The predicted mean is biased upward, so the acquisition corrects it
          - id: b
            text: Surrogates can't predict means at unexplored settings
          - id: a
            text: Pure mean-chasing never explores, so it can stay stuck near early runs
        answer: a
        feedback: Choosing the highest mean is pure exploitation, which keeps sampling near what's already known. An acquisition like EI adds credit for uncertainty. Gaussian processes do predict means everywhere, and the issue is exploration, not bias.
      - id: bayesian-optimization-and-automl.base.v2.3
        prompt: In successive halving, which configuration is most at risk of being wrongly cut?
        options:
          - id: a
            text: One that learns slowly at first but ends with the best accuracy
          - id: b
            text: One that learns quickly at first and ends with average accuracy
          - id: c
            text: One whose accuracy is the same after every number of epochs
        answer: a
        feedback: Successive halving ranks configurations by early scores, so a slow starter can look bad in round 1 and be dropped before it shines. Hyperband's brackets with larger starting budgets hedge against exactly this.
      - id: bayesian-optimization-and-automl.base.v2.4
        prompt: How does DARTS make architecture search differentiable?
        options:
          - id: b
            text: It trains a controller network with REINFORCE to write architectures
          - id: c
            text: It evolves a population of architectures with tournament selection
          - id: a
            text: It mixes all candidate operations with softmax weights tuned by gradients
        answer: a
        feedback: DARTS relaxes the discrete choice of operation into a softmax-weighted mix, so the mixing weights can be tuned by gradient descent on validation loss. The REINFORCE controller was Zoph and Le's approach, and tournament evolution is AmoebaNet's.
  - id: bayesian-optimization-and-automl.transfer.v2
    objective_ref: objective.bayesian-optimization-and-automl
    task: transfer
    response_type: single_choice
    points: 1
    hint: Match the method to the cost of one evaluation and to whether early results predict final ones, then ask what a fair comparison and an honest final score would need.
    remediation_scene: bayesian-optimization-and-automl.s4
    variants:
      - id: bayesian-optimization-and-automl.transfer.v2.1
        prompt: A drug-screening lab can run 30 experiments on a new compound mixture, each taking two days, over 4 continuous settings. Which search strategy fits best?
        options:
          - id: b
            text: A particle swarm of 20 particles run for 10 steps
          - id: a
            text: Bayesian optimization with a Gaussian-process surrogate
          - id: c
            text: Grid search with 5 values per setting
        answer: a
        feedback: Few, expensive evaluations in a low-dimensional continuous space are BO's home ground. A 20-particle swarm run for 10 steps needs over 200 experiments, and a 5-value grid over 4 settings needs 625.
      - id: bayesian-optimization-and-automl.transfer.v2.2
        prompt: A recommender team trains models whose validation scores after one hour predict their scores after a day quite well. They have 200 configurations to try. Which approach saves the most budget?
        options:
          - id: a
            text: Successive halving, starting all 200 on short budgets
          - id: b
            text: Train all 200 fully and pick the best one afterward
          - id: c
            text: Bayesian optimization run one full-length training at a time
        answer: a
        feedback: When early scores predict final ones, cutting weak configurations early saves most of the budget. Training everything fully is the costly baseline, and one-at-a-time BO would get through only a few of the 200 in the same time.
      - id: bayesian-optimization-and-automl.transfer.v2.3
        prompt: An architecture-search paper reports 0.3% lower error than a hand-designed network, using a new search space and new training tricks. What comparison is most needed?
        options:
          - id: c
            text: The same method run with twice as many GPU-days of search
          - id: b
            text: A comparison with the largest published hand-designed network
          - id: a
            text: Random search over the same space with the same training tricks
        answer: a
        feedback: Li and Talwalkar found random search competitive when the search space and training setup were held equal, so this baseline shows what the search method itself adds. More GPU-days or a different hand-designed network don't isolate that.
      - id: bayesian-optimization-and-automl.transfer.v2.4
        prompt: An AutoML tool tried 500 pipelines and reports its winner's validation accuracy of 91.2%. What should the team do before quoting that number?
        options:
          - id: a
            text: Score the winner once on a held-out test set the search never saw
          - id: b
            text: Average the validation accuracy of the top 10 pipelines found
          - id: c
            text: Retrain the winner on the validation set and score it there again
        answer: a
        feedback: With 500 tries, the winner's validation score is optimistically biased. A single untouched test score is honest. Averaging the top 10 still reuses the same validation data, and scoring on data it trained on is worse still.
  - id: bayesian-optimization-and-automl.calculate
    objective_ref: objective.bayesian-optimization-and-automl
    task: base
    response_type: numeric
    points: 1
    hint: For EI, compute z = (μ − best)/σ, then (μ − best)·Φ(z) + σ·φ(z) using the values given. For successive halving, multiply configs by epochs in each round and add the rounds.
    remediation_scene: bayesian-optimization-and-automl.s2
    absolute_tolerance: 0.0005
    variants:
      - id: bayesian-optimization-and-automl.calculate.1
        prompt: The best accuracy so far is 0.80. A candidate has μ = 0.82 and σ = 0.02. Using Φ(1) = 0.8413 and φ(1) = 0.2420, what is its expected improvement?
        answer: 0.0217
        feedback: z = (0.82 − 0.80)/0.02 = 1. EI = 0.02 × 0.8413 + 0.02 × 0.2420 = 0.0168 + 0.0048 ≈ 0.0217.
      - id: bayesian-optimization-and-automl.calculate.2
        prompt: A candidate's mean exactly equals the best so far (z = 0) and σ = 0.05. Using φ(0) = 0.3989, what is its expected improvement?
        answer: 0.0199
        feedback: The first term is 0 because μ − best = 0. EI = σ·φ(0) = 0.05 × 0.3989 ≈ 0.0199, all from exploration.
      - id: bayesian-optimization-and-automl.calculate.3
        prompt: The best so far is 0.80. A candidate has μ = 0.79 and σ = 0.01. Using Φ(−1) = 0.1587 and φ(−1) = 0.2420, what is its expected improvement?
        answer: 0.0008
        feedback: z = −1. EI = −0.01 × 0.1587 + 0.01 × 0.2420 = −0.00159 + 0.00242 ≈ 0.0008. A slightly worse mean with little uncertainty offers little upside.
      - id: bayesian-optimization-and-automl.calculate.4
        prompt: Successive halving starts 81 configurations at 1 epoch each and keeps one third each round (η = 3) until one configuration has trained for 81 epochs. How many epochs does it spend in total?
        answer: 405
        feedback: "The rounds are 81 × 1, 27 × 3, 9 × 9, 3 × 27, and 1 × 81, each 81 epochs, so 5 × 81 = 405. Training all 81 fully would take 6,561."
      - id: bayesian-optimization-and-automl.calculate.5
        prompt: Successive halving starts 16 configurations at 1 epoch each and keeps half each round (η = 2) until one configuration has trained for 16 epochs. How many epochs does it spend in total?
        answer: 80
        feedback: "The rounds are 16 × 1, 8 × 2, 4 × 4, 2 × 8, and 1 × 16, each 16 epochs, so 5 × 16 = 80, against 256 to train all 16 fully."
