      url: https://arxiv.org/abs/1902.07638
    - title: Dive into Deep Learning — hyperparameter optimization
      url: https://d2l.ai/chapter_hyperparameter-optimization/index.html
objectives:
  - id: objective.bayesian-optimization-and-automl
    version: 2-draft
    statement: Bayesian optimization models an expensive objective and selects evaluations with an acquisition rule; AutoML adds search spaces, resource allocation, and validation procedures around model selection.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - bayesian-optimization-and-automl.base.v2
      - bayesian-optimization-and-automl.transfer.v2
      - bayesian-optimization-and-automl.calculate
    prerequisites:
      - anyOf:
          - objective.bayesian-learning
      - anyOf:
          - objective.regularization-and-tuning
scenes:
  - id: bayesian-optimization-and-automl.s1
    title: Twenty runs to spend
    type: explanation
    depth: intuition
    objective_refs:
      - objective.bayesian-optimization-and-automl
    markdown: |-
      You're tuning a speech recognizer's learning rate and dropout. Each training run takes 6 GPU-hours, and the budget allows 20 runs. A particle swarm would burn through that before its first few moves. You need to choose every run carefully.

      **Bayesian optimization (BO)** does that in a loop. After each run, fit a **surrogate model**: a cheap model of the expensive function, which predicts validation accuracy for any setting *and* says how unsure it is. The usual surrogate is the Gaussian process from the Bayesian learning lesson. Its prediction at each setting is a mean $\mu$ and a standard deviation $\sigma$: $\sigma$ is small near settings you've tried and grows in regions you haven't.

      An **acquisition function** then scores every candidate setting using $\mu$ and $\sigma$, and the next run goes to the top scorer. Scoring thousands of candidates on the surrogate takes seconds; one real run takes hours. Jasper Snoek and colleagues (2012) showed that this loop could match or beat expert hand-tuning of models including convolutional networks, and it became a standard tool.
    diagram:
      caption: The Bayesian optimization loop. Only the dashed step is expensive.
      description: The table of finished runs is used to fit the Gaussian-process surrogate, which gives a mean and uncertainty at every setting. The acquisition function scores candidate settings from those. The top candidate goes to a real training run, which is the expensive step. Its result is added to the table of finished runs, and the loop repeats.
      nodes:
        - id: runs
          label: Finished runs
          note: settings and accuracies
          col: 0
          row: 1
          tone: data
        - id: gp
          label: Fit surrogate
          note: Gaussian process gives μ and σ
          col: 0
          row: 0
          tone: accent
        - id: acq
          label: Score candidates
          note: expected improvement
          col: 1
          row: 0
        - id: train
          label: Real training run
          note: 6 GPU-hours
          col: 1
          row: 1
          tone: warn
      edges:
        - from: runs
          to: gp
        - from: gp
          to: acq
          label: μ and σ everywhere
        - from: acq
          to: train
          label: best candidate
          dashed: true
        - from: train
          to: runs
          label: add the result
  - id: bayesian-optimization-and-automl.s2
    title: Expected improvement, worked
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.bayesian-optimization-and-automl
    markdown: |-
      After 8 runs, your best validation accuracy is $f^* = 0.80$. The surrogate describes two candidates:

      - **A**, near your best run: $\mu = 0.81$, $\sigma = 0.01$. Almost surely a little better.
      - **B**, in an unexplored corner: $\mu = 0.78$, $\sigma = 0.05$. Probably worse, but could be much better.

      **Expected improvement (EI)** asks: on average, how much will this run beat 0.80? Losing counts as zero improvement, not negative. For a normal prediction there's a closed form, with $z = (\mu - f^*)/\sigma$:

      | | $z$ | $(\mu - f^*)\,\Phi(z)$ | $\sigma\,\phi(z)$ | EI |
      | --- | ---: | ---: | ---: | ---: |
      | A | 1 | 0.01 × 0.8413 = 0.00841 | 0.01 × 0.2420 = 0.00242 | 0.01083 |
      | B | −0.4 | −0.02 × 0.3446 = −0.00689 | 0.05 × 0.3683 = 0.01841 | 0.01152 |

      B wins, narrowly. The first term rewards a high mean (**exploitation**); the second rewards uncertainty (**exploration**). EI trades them off automatically.

      ```python run
      from math import erf, exp, pi, sqrt

      def Phi(z): return 0.5 * (1 + erf(z / sqrt(2)))      # standard normal CDF
      def phi(z): return exp(-z * z / 2) / sqrt(2 * pi)     # standard normal density

      def expected_improvement(mu, sigma, best):
          z = (mu - best) / sigma
          return (mu - best) * Phi(z) + sigma * phi(z)

      best = 0.80                                           # best validation accuracy so far
      candidates = {"A (safe)": (0.81, 0.01), "B (uncertain)": (0.78, 0.05),
                    "C (poor)": (0.74, 0.02), "D (wild)": (0.70, 0.10)}
      for name, (mu, sigma) in candidates.items():
          exploit = (mu - best) * Phi((mu - best) / sigma)
          explore = sigma * phi((mu - best) / sigma)
          print(f"{name:14} mu {mu:.2f} sigma {sigma:.2f}  EI = {exploit:+.5f} + {explore:.5f}"
                f" = {expected_improvement(mu, sigma, best):.5f}")
      ```

      C is confidently mediocre, so its EI is almost 0. D has the worst mean of all but so much uncertainty that its EI, 0.00833, isn't far behind A's.

      :::predict You run a cheap pilot near B, and the surrogate's σ at B shrinks from 0.05 to 0.02, with μ still 0.78. Which candidate wins now?
      Now $z = -1$, so EI(B) = −0.02 × 0.1587 + 0.02 × 0.2420 ≈ 0.00167. A's 0.01083 wins easily. Less uncertainty means less upside, and the search turns back to exploiting.
      :::

      :::papers Expected improvement (Jones, Schonlau & Welch, 1998)
      $$\text{EI}(x) = \mathbb{E}\big[\max(f(x) - f^*, 0)\big] = (\mu(x) - f^*)\,\Phi(z) + \sigma(x)\,\phi(z), \quad z = \frac{\mu(x) - f^*}{\sigma(x)}$$

      $\Phi$ and $\phi$ are the standard normal CDF and density. For candidate B, $\mu(x) = 0.78$, $\sigma(x) = 0.05$, $f^* = 0.80$, and $z = -0.4$.
      :::
  - id: bayesian-optimization-and-automl.s3
    title: "Successive halving: cut the losers early"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.bayesian-optimization-and-automl
    markdown: |-
      A different saving: most bad settings look bad early. **Successive halving** (Jamieson and Talwalkar, 2016) starts many configurations on a small budget, keeps the best fraction, and gives the survivors more. With 27 configurations and a keep-one-third rule ($\eta = 3$):

      | Round | Configs | Epochs each | Epochs spent |
      | ---: | ---: | ---: | ---: |
      | 1 | 27 | 1 | 27 |
      | 2 | 9 | 3 | 27 |
      | 3 | 3 | 9 | 27 |
      | 4 | 1 | 27 | 27 |

      That's 108 epochs, against 27 × 27 = 729 to train everything fully: under a sixth of the cost.

      ```python run
      import numpy as np

      rng = np.random.default_rng(4)
      n, eta, max_epochs = 27, 3, 27
      final = rng.uniform(0.60, 0.90, n)     # each config's accuracy if fully trained
      speed = rng.uniform(1, 5, n)           # epochs it needs to get going (bigger = slower start)

      def val_acc(i, epochs):                # a simulated learning curve
          return final[i] * (1 - np.exp(-epochs / speed[i]))

      alive, epochs, spent = list(range(n)), 1, 0
      while True:
          scores = {i: val_acc(i, epochs) for i in alive}
          spent += len(alive) * epochs
          print(f"{len(alive):2} configs x {epochs:2} epochs = {len(alive) * epochs:3} epochs;"
                f" leader: config {max(scores, key=scores.get):2} at {max(scores.values()):.3f}")
          if epochs == max_epochs:
              break
          alive = sorted(alive, key=scores.get, reverse=True)[:len(alive) // eta]
          epochs *= eta

      full = [val_acc(i, max_epochs) for i in range(n)]      # what training everything would show
      best = int(np.argmax(full))
      print(f"total {spent} epochs; training all {n} for {max_epochs} epochs would cost {n * max_epochs}")
      print(f"picked config {alive[0]} ({full[alive[0]]:.3f}); true best is config {best} ({full[best]:.3f}),"
            f" whose accuracy after 1 epoch ranked {sorted(range(n), key=lambda i: -val_acc(i, 1)).index(best) + 1} of {n}")
      ```

      The winner reaches 0.893. The true best, 0.894, was a slow starter ranked 18th after one epoch and was cut in round 1. Losing 0.001 for a sixth of the cost is a good trade. Now try seed 5: the true best (0.898) is cut early again, and this time the winner reaches only 0.853.

      **Hyperband** (Lisha Li and colleagues, 2018) hedges against slow starters by running several successive-halving brackets, from "many configs, tiny budgets" to "few configs, full budgets," and keeping the best overall. Methods such as BOHB then replace Hyperband's random configurations with Bayesian optimization's suggestions.
  - id: bayesian-optimization-and-automl.nas
    title: "Architecture search: from 800 GPUs to one"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.bayesian-optimization-and-automl
    markdown: |-
      Tuning can extend to the network's design itself. In **neural architecture search (NAS)**, Barret Zoph and Quoc Le (2017) trained a recurrent "controller" network with the REINFORCE policy gradient from the RL module. It wrote out architectures layer by layer, each child network was trained for 50 epochs, and its validation accuracy became the reward. The CIFAR-10 search trained 12,800 architectures, 800 at a time on 800 GPUs. A follow-up (NASNet, 2018) needed about 2,000 GPU-days; evolution-based AmoebaNet about 3,150.

      **DARTS** (Hanxiao Liu, Karen Simonyan, and Yiming Yang, 2019) made the search differentiable. Instead of picking one operation per connection, it runs *all* candidates (3×3 convolution, 5×5 convolution, pooling, skip…) and mixes their outputs with softmax weights. Gradient descent tunes those mixing weights on validation data while the network's ordinary weights train on training data. At the end, each connection keeps its highest-weighted operation. The search took 1.5 to 4 GPU-days, hundreds to thousands of times less, for similar CIFAR-10 accuracy.

      :::mixup "The architecture search found a better network, so the method is what worked."
      Check the baseline. Liam Li and Ameet Talwalkar (2019) found that random search, given the same search space and training tricks, was competitive with leading NAS methods. Much of the gain came from a well-designed search space.
      :::
  - id: bayesian-optimization-and-automl.s4
    title: Keep the search honest
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.bayesian-optimization-and-automl
    markdown: |-
      **AutoML** packages all of this: tools like Auto-WEKA (2013) and auto-sklearn (2015) search over preprocessing steps, model families, and hyperparameters together, with BO or successive halving choosing what to try.

      More search means more chances to get lucky on the validation set, the winner's curse from the lesson on evaluating the procedure that chose the model. Here's a team doing it right. They give BO and plain random search the same 20-run budget and three seeds each. BO's best validation accuracy averages 0.842 against random search's 0.835. They then score only BO's final pick on the untouched test set: 0.836. They report the test score, the search cost (20 runs × 6 GPU-hours = 120 GPU-hours per search), and the random-search comparison, so a reader can tell how much the clever search actually bought.
  - id: bayesian-optimization-and-automl.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.bayesian-optimization-and-automl
    markdown: Compute expected improvement and successive-halving budgets by hand, then choose search strategies for a drug-screening lab, a recommender team, and an architecture-search paper.
    takeaway: |-
      Bayesian optimization fits a surrogate with a mean and an uncertainty, then runs the setting with the highest expected improvement, trading exploitation against exploration. Successive halving and Hyperband save budget by cutting weak configurations early.
  - id: bayesian-optimization-and-automl.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.bayesian-optimization-and-automl
    markdown: |-
      Bayesian optimization uses a surrogate and an acquisition rule to choose expensive experiments. Evaluate the selected pipeline independently and include the search cost.
