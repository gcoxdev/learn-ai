assessment_families:
- response_type: numeric
  hint: Multiply corresponding coordinates, then add those products.
  variants:
  - prompt: Compute [2, 3] · [4, 2]. Enter the scalar result.
    answer: 14
    feedback: The two products are 8 and 6. Their sum is 14; adding coordinates first would be a different
      operation.
    id: vectors.base.1
  - prompt: Compute [1, −2] · [5, 3]. Enter the scalar result.
    answer: -1
    feedback: The products are 5 and −6. Adding them gives −1. Dot products can be negative.
    id: vectors.base.2
  id: vectors.base
  objective_ref: objective.vectors
  task: base
  points: 1
  remediation_scene: vectors.s1
- response_type: single_choice
  hint: Multiply every coordinate by its mixing weight before adding matching coordinates.
  variants:
  - prompt: Mix [6, 0] and [0, 4] with weights 0.5 and 0.5. What is the output?
    options:
    - id: a
      text: The scalar 5
    - id: b
      text: '[6, 4]'
    - id: answer
      text: '[3, 2]'
    answer: answer
    feedback: Half of each vector is [3, 0] and [0, 2]. Their sum is [3, 2]. Mixing values preserves the value-vector
      dimension.
    id: vectors.transfer.1
  - prompt: Mix [8, 0] and [0, 8] with weights 0.25 and 0.75. What is the output?
    options:
    - id: b
      text: The scalar 8
    - id: answer
      text: '[2, 6]'
    - id: a
      text: '[6, 2]'
    answer: answer
    feedback: The first value contributes [2, 0] and the second [0, 6]. The weights attach to whole vectors,
      not to arbitrary coordinate positions.
    id: vectors.transfer.2
  id: vectors.transfer
  objective_ref: objective.vectors
  task: transfer
  points: 1
  remediation_scene: vectors.s1
