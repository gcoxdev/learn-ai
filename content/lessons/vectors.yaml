scenes:
- title: Keep the coordinates in order
  markdown: 'A vector is an ordered list of numbers. Imagine a shop tracking apples and pears: [3, 2] means three
    apples and two pears. [2, 3] records a different basket. The positions give the numbers their roles.


    A single number is a scalar. This basket has two coordinates, so it is a two-dimensional vector. The dimension
    counts coordinates, not objects: [300, 200] is still two-dimensional. A neural representation might have hundreds
    of coordinates without each one having a neat everyday label.'
  id: vectors.s1
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vectors
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Add and scale a basket
  markdown: 'Two deliveries, [3, 2] and [1, 4], combine as [4, 6]. Add matching coordinates: apples to apples, pears
    to pears. Doubling [3, 2] gives [6, 4]; multiply each coordinate by the scalar 2.


    This is why shape matters. Adding a two-coordinate basket to a three-coordinate weather reading is not an ordinary
    vector sum. First specify a mapping that gives the coordinates compatible roles.'
  id: vectors.s2
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vectors
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: A dot product makes one score
  markdown: 'Suppose prices are [2, 5]. The basket [3, 2] costs 3 × 2 + 2 × 5 = 16. Multiply matching coordinates
    and add the products: this is a dot product. Two input vectors produce one scalar.


    For a signed example, [1, −2] dotted with [3, 4] gives 3 − 8 = −5. In attention, this arithmetic produces a
    compatibility score from a query and a key. The score is not automatically a probability.'
  type: table
  columns:
  - Operation
  - Result
  rows:
  - - '[3, 2] + [1, 4]'
    - '[4, 6]'
  - - 2 × [3, 2]
    - '[6, 4]'
  - - '[3, 2] · [2, 5]'
    - 16
  id: vectors.s3
  depth: mechanics
  objective_refs:
  - objective.vectors
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Mix vectors without shrinking the list
  markdown: 'Let two value vectors be [4, 0] and [0, 8]. Giving them weights 0.75 and 0.25 produces [3, 2]: the
    first contributes [3, 0] and the second [0, 2]. The output still has two coordinates.


    Nonnegative weights that add to one make a weighted average. Attention uses such weighted combinations of value
    vectors. Do not confuse the mixing weight, which is a scalar, with the model parameters that learned how to
    construct those values.'
  id: vectors.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vectors
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Geometry has limits as an explanation
  markdown: 'A dot product is influenced by direction and magnitude. [2, 0] dotted with [1, 0] is 2, while [20,
    0] dotted with [1, 0] is 20, despite both pointing the same way. Cosine similarity removes the magnitudes for
    nonzero vectors.


    This lesson checks dot products and weighted combinations. Length, angles, projections, and matrix operations
    can be studied more deeply later. A large dot product alone is not a certificate of semantic truth.'
  id: vectors.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vectors
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- id: vectors.check
  title: Review and check your understanding
  type: assessment
