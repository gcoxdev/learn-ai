schema_version: 0.2-draft
lesson:
  id: vectors
  version: 0.3.0-draft
  title: 'Vectors: lists that work together'
  state: draft
  summary: To a language model, "cat" is a list of hundreds of numbers. Learn to add, mix, and compare such lists, and see why search engines use cosine similarity rather than raw scores.
  slot: B06
  category: bridge
  sources:
    - title: Deep Learning — linear algebra
      url: https://www.deeplearningbook.org/contents/linear_algebra.html
objectives:
  - id: objective.vectors
    version: 2-draft
    statement: Add and scale vectors, compute a dot product, mix vectors with weights, and use cosine similarity to compare directions.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - vectors.base.v2
      - vectors.transfer.v2
    prerequisites:
      - anyOf:
          - objective.arithmetic
scenes:
  - title: Keep the coordinates in order
    markdown: |-
      Inside a language model, the word "cat" isn't stored as letters. It's a list of a few hundred numbers, and "kitten" is a list that points in almost the same direction. Search engines, recommenders, and attention all work by combining and comparing lists like these.

      **Why AI needs this:** the next few pages cover the operations on these lists that the course relies on: add, scale, dot product, weighted mix, and cosine similarity.

      A **vector** is an ordered list of numbers. A fruit basket [3, 2] means 3 apples and 2 pears; [2, 3] is a different basket, because each position has its own meaning. Each number is a **coordinate**, and the count of coordinates is the vector's **dimension**. [3, 2] and [300, 200] are both two-dimensional. A single ordinary number is called a **scalar**.

      In a model, the coordinates rarely have tidy names like "apples." They're learned, and what they mean shows up only in how vectors relate to each other.
    id: vectors.s1
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.vectors
  - title: Add and scale, coordinate by coordinate
    markdown: |-
      Two deliveries, [3, 2] and [1, 4], add to [4, 6]: apples with apples, pears with pears. Doubling [3, 2] multiplies every coordinate by the scalar 2, giving [6, 4].

      Both operations need matching positions. You can't add a two-coordinate basket to a three-coordinate weather reading, because there's no sensible partner for the third number. In code, this shows up as a **shape mismatch** error, one of the most common bugs in machine learning, and the matrices lesson shows how to catch it by checking sizes first.
    id: vectors.s2
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.vectors
  - title: A dot product makes one score
    markdown: |-
      Apples cost 2 and pears cost 5, so the price vector is [2, 5]. The basket [3, 2] costs 3 × 2 + 2 × 5 = 6 + 10 = 16. Multiply matching coordinates, then add: that's the **dot product**, written [3, 2] · [2, 5] = 16. Two vectors go in; one scalar comes out. The table below collects the three operations so far.

      Two more worked examples:

      1. **With a negative.** [1, −2] · [3, 4] = 3 + (−8) = −5. Dot products can be negative.
      2. **Three coordinates.** [2, 0, 1] · [1, 3, 4] = 2 + 0 + 4 = 6. Any dimension works, as long as both vectors have the same one.

      A neuron's weighted sum, from the lesson "Inside an artificial neuron," is a dot product between the weights and the inputs.
    type: table
    columns:
      - Operation
      - Result
    rows:
      - - '[3, 2] + [1, 4]'
        - '[4, 6]'
      - - 2 × [3, 2]
        - '[6, 4]'
      - - '[3, 2] · [2, 5]'
        - 16
    id: vectors.s3
    depth: mechanics
    objective_refs:
      - objective.vectors
  - title: Mix vectors without shrinking the list
    markdown: |-
      Sometimes you want a blend. Take two vectors, [4, 0] and [0, 8], and give them weights 0.75 and 0.25:

      - 0.75 × [4, 0] = [3, 0]
      - 0.25 × [0, 8] = [0, 2]
      - Sum: [3, 2]

      The result is still a two-coordinate vector, not a single number. When the weights are at least 0 and add to 1, this is a **weighted average**. It's exactly what attention does: it computes weights like 0.75 and 0.25 with softmax, then blends "value" vectors this way (see "Attention: queries, keys, and values").
    id: vectors.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.vectors
  - title: Compare directions with cosine similarity
    markdown: |-
      A vector's **length** comes from Pythagoras: square the coordinates, add, take the square root. For [3, 4], that's √(9 + 16) = √25 = 5.

      To ask "do these two vectors point the same way?", divide the dot product by both lengths. That's **cosine similarity**:

      $$\cos(a, b) = \frac{a \cdot b}{\lVert a \rVert\,\lVert b \rVert}$$

      where ‖a‖ means the length of a. It runs from 1 (same direction) through 0 (at right angles) to −1 (opposite). Worked: a = [3, 4] and b = [4, 3] have a · b = 24 and lengths 5 and 5, so cos = 24 / 25 = 0.96, very similar.

      :::predict Which is more similar to a = [3, 4]: b = [4, 3] or e = [30, 0]? Decide by dot product, then by cosine.
      By dot product, e wins: 90 versus 24. By cosine, b wins: 0.96 versus 0.60. The dot product grew just because e is long. Cosine ignores length and compares only direction.
      :::

      :::mixup "A bigger dot product always means more similar."
      A dot product mixes direction with length, so a long vector can score high while pointing somewhere else. When only direction should count, as in most embedding search, use cosine similarity, or scale every vector to length 1 first.
      :::

      Run this, then add a vector of your own to `docs`:

      ```python run
      import numpy as np

      def cosine(a, b):
          return a @ b / (np.linalg.norm(a) * np.linalg.norm(b))

      query = np.array([3, 4])
      docs = {"b": np.array([4, 3]), "c": np.array([6, 8]),
              "d": np.array([4, -3]), "e": np.array([30, 0])}

      for name, v in docs.items():
          print(f"{name} = {v}: dot {query @ v:3d}, cosine {cosine(query, v):.2f}")
      ```

      c = [6, 8] is just a stretched copy of a, so its cosine is exactly 1.00; d is at right angles, so 0.00. You'll use this in "From token IDs to learned vectors" and in "Search learned representations with approximate neighbors."
    id: vectors.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.vectors
  - id: vectors.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.vectors
    markdown: Compute dot products (including negatives and three coordinates), then score search queries, songs, and product listings with cosine similarity.
    takeaway: |-
      A dot product multiplies matching coordinates and adds them into one number. Divide it by both lengths to get cosine similarity, which compares direction and ignores size.
  - id: vectors.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.vectors
    markdown: |-
      A dot product turns two equal-sized vectors into one number. A weighted sum combines vectors into another vector of the same size.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - vectors.s1
        - vectors.s2
        - vectors.s3
        - vectors.s4
        - vectors.s5
        - vectors.check
      gate_refs:
        - gate.core
  scene_aliases:
    vectors.recap: vectors.check
assessment_families:
  - response_type: numeric
    hint: Multiply corresponding coordinates, then add those products.
    variants:
      - prompt: Compute [2, 3] · [4, 2]. Enter the scalar result.
        answer: 14
        feedback: The two products are 8 and 6. Their sum is 14; adding coordinates first would be a different operation.
        id: vectors.base.1
        retired: true
      - prompt: Compute [1, −2] · [5, 3]. Enter the scalar result.
        answer: -1
        feedback: The products are 5 and −6. Adding them gives −1. Dot products can be negative.
        id: vectors.base.2
        retired: true
    id: vectors.base
    objective_ref: objective.vectors
    task: base
    points: 1
    remediation_scene: vectors.s1
  - response_type: single_choice
    hint: Multiply every coordinate by its mixing weight before adding matching coordinates.
    variants:
      - prompt: Mix [6, 0] and [0, 4] with weights 0.5 and 0.5. What is the output?
        options:
          - id: a
            text: The scalar 5
          - id: b
            text: '[6, 4]'
          - id: answer
            text: '[3, 2]'
        answer: answer
        feedback: Half of each vector is [3, 0] and [0, 2]. Their sum is [3, 2]. Mixing values preserves the value-vector dimension.
        id: vectors.transfer.1
        retired: true
      - prompt: Mix [8, 0] and [0, 8] with weights 0.25 and 0.75. What is the output?
        options:
          - id: b
            text: The scalar 8
          - id: answer
            text: '[2, 6]'
          - id: a
            text: '[6, 2]'
        answer: answer
        feedback: The first value contributes [2, 0] and the second [0, 6]. The weights attach to whole vectors, not to arbitrary coordinate positions.
        id: vectors.transfer.2
        retired: true
    id: vectors.transfer
    objective_ref: objective.vectors
    task: transfer
    points: 1
    remediation_scene: vectors.s1
  - id: vectors.base.v2
    objective_ref: objective.vectors
    task: base
    response_type: numeric
    points: 1
    hint: Multiply each coordinate by its partner in the same position, then add those products into one number. Keep the minus signs.
    remediation_scene: vectors.s3
    absolute_tolerance: 1e-6
    variants:
      - id: vectors.base.v2.1
        prompt: Calculate [4, 1] · [2, 3].
        answer: 11
        feedback: 4 × 2 + 1 × 3 = 8 + 3 = 11. Adding the coordinates first, (4 + 1) × (2 + 3) = 25, is a different operation.
      - id: vectors.base.v2.2
        prompt: Calculate [2, −3] · [5, 1].
        answer: 7
        feedback: 2 × 5 + (−3) × 1 = 10 − 3 = 7. Dropping the minus sign gives 13.
      - id: vectors.base.v2.3
        prompt: Calculate [1, 2, 3] · [4, 0, 2].
        answer: 10
        feedback: 1 × 4 + 2 × 0 + 3 × 2 = 4 + 0 + 6 = 10. The zero coordinate contributes nothing, but it still has to be paired.
      - id: vectors.base.v2.4
        prompt: A shopping basket is [2, 3, 1] (loaves, jars, cartons), and the prices are [3, 2, 4]. What does the basket cost?
        answer: 16
        feedback: The cost is the dot product, 2 × 3 + 3 × 2 + 1 × 4 = 6 + 6 + 4 = 16. Multiplying matching coordinates without adding gives the list [6, 6, 4], not a total.
      - id: vectors.base.v2.5
        prompt: Calculate [−1, 4] · [3, −2].
        answer: -11
        feedback: (−1) × 3 + 4 × (−2) = −3 − 8 = −11. Both products are negative, so the total is too.
      - id: vectors.base.v2.6
        prompt: A neuron has weights [0.5, 2, −1] and receives inputs [4, 1, 3]. What is its weighted sum, the dot product?
        answer: 1
        feedback: 0.5 × 4 + 2 × 1 + (−1) × 3 = 2 + 2 − 3 = 1. Forgetting the negative weight gives 7.
  - id: vectors.transfer.v2
    objective_ref: objective.vectors
    task: transfer
    response_type: numeric
    points: 1
    hint: Cosine similarity is the dot product divided by both lengths. A length is √(sum of squared coordinates).
    remediation_scene: vectors.s5
    absolute_tolerance: 0.01
    variants:
      - id: vectors.transfer.v2.1
        prompt: A search engine embeds a query as [1, 2, 2] and a document as [2, 1, 2]. What is their cosine similarity? Give two decimal places.
        answer: 0.89
        feedback: The dot product is 2 + 2 + 4 = 8, and both lengths are √9 = 3, so 8 / 9 ≈ 0.89. Stopping at the dot product, 8, skips dividing by the lengths.
      - id: vectors.transfer.v2.2
        prompt: A music app describes two songs by [energy, calm] as [5, 12] and [12, 5]. What is their cosine similarity? Give two decimal places.
        answer: 0.71
        feedback: The dot product is 60 + 60 = 120, and both lengths are √169 = 13, so 120 / 169 ≈ 0.71. Dividing by 13 only once gives 9.23, which isn't between −1 and 1.
      - id: vectors.transfer.v2.3
        prompt: Two product listings have embeddings [0, 3] and [4, 3]. What is their cosine similarity? Give two decimal places.
        answer: 0.6
        feedback: The dot product is 0 + 9 = 9, and the lengths are 3 and 5, so 9 / 15 = 0.60. The dot product alone, 9, can't tell you how aligned they are.
      - id: vectors.transfer.v2.4
        prompt: A recommender stores user taste as [2, 1] and a new show as [−1, 2]. What is their cosine similarity?
        answer: 0
        feedback: The dot product is −2 + 2 = 0, so the cosine is 0 whatever the lengths. The vectors are at right angles, unrelated in direction.
      - id: vectors.transfer.v2.5
        prompt: Two sentence embeddings are [1, 2] and [−2, −4]. What is their cosine similarity?
        answer: -1
        feedback: The dot product is −2 − 8 = −10, and the lengths are √5 and √20 = 2√5, whose product is 10. So −10 / 10 = −1. The second vector points exactly the opposite way.
      - id: vectors.transfer.v2.6
        prompt: A photo search compares embeddings [2, 2, 1] and [4, 4, 2]. What is their cosine similarity?
        answer: 1
        feedback: The second vector is exactly twice the first, so they point the same way and the cosine is 1. The dot product, 18, is large only because of length.
