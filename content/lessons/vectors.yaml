schema_version: 0.2-draft
lesson:
  id: vectors
  version: 0.3.0-draft
  title: 'Vectors: lists that work together'
  state: draft
  summary: Use ordered lists to add quantities, calculate a dot product, and mix several vectors.
  slot: B06
  category: bridge
  sources:
  - title: Deep Learning — linear algebra
    url: https://www.deeplearningbook.org/contents/linear_algebra.html
objectives:
- id: objective.vectors
  version: 1-draft
  statement: Compute a dot product and combine equal-sized vectors using stated mixing weights.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - vectors.base
  - vectors.transfer
  prerequisites:
  - anyOf:
    - objective.arithmetic
scenes:
- title: Keep the coordinates in order
  markdown: 'A vector is an ordered list of numbers. Imagine a shop tracking apples and pears: [3, 2] means
    three apples and two pears. [2, 3] records a different basket. The positions give the numbers their roles.


    A single number is a scalar. This basket has two coordinates, so it is a two-dimensional vector. The dimension
    counts coordinates, not objects: [300, 200] is still two-dimensional. A neural representation might have
    hundreds of coordinates without each one having a neat everyday label.'
  id: vectors.s1
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vectors
  text_mode: 'A vector is an ordered list of numbers. Imagine a shop tracking apples and pears: [3, 2] means
    three apples and two pears. [2, 3] records a different basket. The positions give the numbers their roles.


    A single number is a scalar. This basket has two coordinates, so it is a two-dimensional vector. The dimension
    counts coordinates, not objects: [300, 200] is still two-dimensional. A neural representation might have
    hundreds of coordinates without each one having a neat everyday label.'
- title: Add and scale a basket
  markdown: 'Two deliveries, [3, 2] and [1, 4], combine as [4, 6]. Add matching coordinates: apples to apples,
    pears to pears. Doubling [3, 2] gives [6, 4]; multiply each coordinate by the scalar 2.


    This is why shape matters. Adding a two-coordinate basket to a three-coordinate weather reading is not
    an ordinary vector sum. First specify a mapping that gives the coordinates compatible roles.'
  id: vectors.s2
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vectors
  text_mode: 'Two deliveries, [3, 2] and [1, 4], combine as [4, 6]. Add matching coordinates: apples to apples,
    pears to pears. Doubling [3, 2] gives [6, 4]; multiply each coordinate by the scalar 2.


    This is why shape matters. Adding a two-coordinate basket to a three-coordinate weather reading is not
    an ordinary vector sum. First specify a mapping that gives the coordinates compatible roles.'
- title: A dot product makes one score
  markdown: 'Suppose prices are [2, 5]. The basket [3, 2] costs 3 × 2 + 2 × 5 = 16. Multiply matching coordinates
    and add the products: this is a dot product. Two input vectors produce one scalar.


    For a signed example, [1, −2] dotted with [3, 4] gives 3 − 8 = −5. AI models can use this arithmetic to
    compare two numerical representations. The score is not automatically a probability.'
  type: table
  columns:
  - Operation
  - Result
  rows:
  - - '[3, 2] + [1, 4]'
    - '[4, 6]'
  - - 2 × [3, 2]
    - '[6, 4]'
  - - '[3, 2] · [2, 5]'
    - 16
  id: vectors.s3
  depth: mechanics
  objective_refs:
  - objective.vectors
  text_mode: 'Suppose prices are [2, 5]. The basket [3, 2] costs 3 × 2 + 2 × 5 = 16. Multiply matching coordinates
    and add the products: this is a dot product. Two input vectors produce one scalar.


    For a signed example, [1, −2] dotted with [3, 4] gives 3 − 8 = −5. AI models can use this arithmetic to
    compare two numerical representations. The score is not automatically a probability.'
- title: Mix vectors without shrinking the list
  markdown: 'Let two value vectors be [4, 0] and [0, 8]. Giving them weights 0.75 and 0.25 produces [3, 2]:
    the first contributes [3, 0] and the second [0, 2]. The output still has two coordinates.


    Nonnegative weights that add to one make a weighted average. Attention uses such weighted combinations
    of value vectors. A mixing weight is a scalar used in this particular combination. A learned model parameter
    is a stored setting adjusted during training; these are different roles.'
  id: vectors.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vectors
  text_mode: 'Let two value vectors be [4, 0] and [0, 8]. Giving them weights 0.75 and 0.25 produces [3, 2]:
    the first contributes [3, 0] and the second [0, 2]. The output still has two coordinates.


    Nonnegative weights that add to one make a weighted average. Attention uses such weighted combinations
    of value vectors. A mixing weight is a scalar used in this particular combination. A learned model parameter
    is a stored setting adjusted during training; these are different roles.'
- title: Geometry has limits as an explanation
  markdown: 'A dot product depends on both direction and magnitude. [2, 0] dotted with [1, 0] gives 2, while
    [20, 0] dotted with [1, 0] gives 20, even though the first vector points in the same direction in both
    cases.


    **Cosine similarity** removes vector magnitudes for nonzero vectors so the comparison focuses on direction.
    Which measure is useful depends on what the coordinates represent. A high similarity score alone does not
    establish that a statement is true.'
  id: vectors.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.vectors
  text_mode: 'A dot product depends on both direction and magnitude. [2, 0] dotted with [1, 0] gives 2, while
    [20, 0] dotted with [1, 0] gives 20, even though the first vector points in the same direction in both
