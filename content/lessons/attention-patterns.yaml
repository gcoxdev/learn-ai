  scene_aliases:
    attention-patterns.recap: attention-patterns.check
assessment_families:
  - id: attention-patterns.base
    objective_ref: objective.attention-patterns
    task: base
    response_type: single_choice
    points: 1
    hint: Count the window from the current token backwards, then add one window's reach per layer.
    remediation_scene: attention-patterns.s2
    variants:
      - id: attention-patterns.base.1
        prompt: A causal window of three at position six directly includes which positions?
        options:
          - id: b
            text: One through six
          - id: c
            text: Only position one
          - id: a
            text: Four, five, and six
        answer: a
        feedback: The specified window includes the current position and two predecessors.
        retired: true
      - id: attention-patterns.base.2
        prompt: Can information travel beyond one local window across layers?
        options:
          - id: c
            text: Only through changing the tokenizer
          - id: a
            text: Yes, through intermediate representations
          - id: b
            text: Never
        answer: a
        feedback: Multi-layer paths can extend effective connectivity.
        retired: true
  - id: attention-patterns.transfer
    objective_ref: objective.attention-patterns
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask whether the change removes pairs from the mask or only changes how the same pairs are computed.
    remediation_scene: attention-patterns.s4
    variants:
      - id: attention-patterns.transfer.1
        prompt: Does a global summary token guarantee lossless long-term storage?
        options:
          - id: c
            text: Only if named global
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: A finite representation can lose details.
        retired: true
      - id: attention-patterns.transfer.2
        prompt: 'Which changes connectivity: tiled exact dense attention or a local mask?'
        options:
          - id: a
            text: The local mask
          - id: b
            text: Only tiling
          - id: c
            text: Neither
        answer: a
        feedback: Tiling changes execution; masking changes allowed pairs.
        retired: true
  - id: attention-patterns.base.v2
    objective_ref: objective.attention-patterns
    task: base
    response_type: single_choice
    points: 1
    hint: "A causal window of w covers the token itself plus the w − 1 tokens before it. Each extra layer pushes the reach back by another w − 1."
    remediation_scene: attention-patterns.s2
    variants:
      - id: attention-patterns.base.v2.1
        prompt: A causal sliding window has w = 4 (the token itself plus three before it). Which tokens can token 10 read directly in one layer?
        options:
          - id: b
            text: Tokens 6, 7, 8, 9, and 10
          - id: a
            text: Tokens 7, 8, 9, and 10
          - id: c
            text: Tokens 10, 11, 12, and 13
        answer: a
        feedback: The window holds four tokens counting token 10 itself, so it reaches back three places, to token 7. Tokens 6 to 10 would be five tokens, and a causal model never reads the tokens after 10.
      - id: attention-patterns.base.v2.2
        prompt: A model stacks two layers, each with a causal window of w = 3. What is the earliest input token that can influence token 20 at the output of layer 2?
        options:
          - id: c
            text: Token 18
          - id: b
            text: Token 14
          - id: a
            text: Token 16
        answer: a
        feedback: Each layer reaches back w − 1 = 2 positions, so two layers reach back 4, to token 16. Token 18 is the reach of a single layer; token 14 comes from subtracting L·w = 6, which counts the current token twice.
      - id: attention-patterns.base.v2.3
        prompt: One team replaces standard attention with a FlashAttention kernel. Another team replaces full attention with a 1,024-token sliding window. Which change can alter the model's answer to a question about page 1 of a 50-page document?
        options:
          - id: a
            text: The sliding window, because it removes query-key pairs
          - id: b
            text: The FlashAttention kernel, because it computes in tiles
          - id: c
            text: Both equally, because both of them reduce memory use
        answer: a
        feedback: FlashAttention computes exactly the same pairs in a different order, so its outputs match (up to rounding). The window blocks pairs, so tokens far from page 1 can no longer read it directly.
      - id: attention-patterns.base.v2.4
        prompt: In Longformer's question-answering setup, every question token gets symmetric global attention while document tokens use a sliding window. What does that give a document token 3,000 positions away from the question?
        options:
          - id: c
            text: A window twice as wide, so it can reach the question in fewer layers
          - id: a
            text: A direct link to every question token in each layer, whatever the distance
          - id: b
            text: A copy of the question stored in the cache, which it reads after the last layer
        answer: a
        feedback: A global token attends to every token and every token attends to it, so distance stops mattering for that link. Global attention doesn't widen anyone's window, and it works inside each layer's attention, not as a separate cache read at the end.
  - id: attention-patterns.transfer.v2
    objective_ref: objective.attention-patterns
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work out whether the needed evidence is inside one window, reachable only through many hops, or out of reach. Then pick the shortcut that connects it directly.
    remediation_scene: attention-patterns.s4
    variants:
      - id: attention-patterns.transfer.v2.1
        prompt: A DNA model uses a 512-token window in 12 layers. Biologists need it to link a gene to a control region about 50,000 bases upstream. Which change targets that need?
        options:
          - id: b
            text: Swap in a faster attention kernel so that each layer runs quicker
          - id: a
            text: Add dilated heads, global tokens, or a few full-attention layers
          - id: c
            text: Increase the batch size so the model sees more genes per step
        answer: a
        feedback: The receptive field is only about 12 × 511 + 1 ≈ 6,100 tokens, far short of 50,000. Dilation, global tokens, or full layers create longer paths. A faster kernel or bigger batch leaves the pattern, and so the reach, unchanged.
      - id: attention-patterns.transfer.v2.2
        prompt: A chat model uses only sliding-window attention. Deep into a 30,000-token conversation, it stops following the formatting rules from the system prompt at the very start. Which fix fits the pattern problem?
        options:
          - id: a
            text: Let every token attend directly to the system-prompt tokens
          - id: c
            text: Shrink the window so that the model can afford more layers
          - id: b
            text: Swap in FlashAttention so that the long prompt runs faster
        answer: a
        feedback: Making the system prompt global (every later token may read it) gives the rules a direct link from every position. A smaller window reaches less per layer, and FlashAttention doesn't change which pairs exist.
      - id: attention-patterns.transfer.v2.3
        prompt: A classifier reads 10,000-token contracts using a 512-token window and predicts the label from one summary token at the start. Accuracy is poor. Which change follows Longformer's recipe?
        options:
          - id: c
            text: Dilate every head so no head spends its window on nearby text
          - id: b
            text: Move the summary token to the end so it sits closer to the text
          - id: a
            text: Give the summary token global attention over the whole contract
        answer: a
        feedback: Longformer made [CLS] global so the classification token reads every token and every token reads it. Moving it only changes which 512 tokens it sees, and dilating every head throws away the local detail that some heads should keep.
      - id: attention-patterns.transfer.v2.4
        prompt: A team switches to a 4,096-token sliding window and reports "no quality loss" on a benchmark of 2,000-token news articles. What is the right reading of that result?
        options:
          - id: b
            text: The window is lossless, so it is safe to deploy for long documents
          - id: a
            text: Every article fit inside one window, so the test couldn't reveal a loss
          - id: c
            text: The window must be hurting quality in ways the benchmark hides
        answer: a
        feedback: With 2,000-token inputs and a 4,096 window, the mask is identical to full causal attention, so the test couldn't show a difference. It doesn't prove harm either; you need long inputs with distant evidence to find out.
  - id: attention-patterns.reach
    objective_ref: objective.attention-patterns
    task: base
    response_type: numeric
    points: 1
    hint: "Each layer reaches back w − 1 tokens, so after L layers the span is L × (w − 1) + 1, counting the token itself."
    remediation_scene: attention-patterns.s2
    absolute_tolerance: 0.5
    variants:
      - id: attention-patterns.reach.1
        prompt: A causal window covers w = 3 tokens (the token plus two before it). After L = 4 stacked layers, how many input tokens wide is the span that can influence the last token?
        answer: 9
        feedback: "Each layer adds w − 1 = 2 positions: 4 × 2 + 1 = 9."
      - id: attention-patterns.reach.2
        prompt: A causal window covers w = 5 tokens. After L = 6 stacked layers, how many input tokens wide is the span that can influence the last token?
        answer: 25
        feedback: "6 × (5 − 1) + 1 = 25. The shortcut L × w = 30 overcounts by counting the current token in every layer."
      - id: attention-patterns.reach.3
        prompt: A model uses a causal window of w = 4,096 tokens in each of L = 32 layers. How many tokens wide is its theoretical receptive field at the top layer?
        answer: 131041
        feedback: "32 × 4,095 + 1 = 131,041, the 'about 131K' span reported for Mistral 7B."
      - id: attention-patterns.reach.4
        prompt: A causal window covers w = 129 tokens. After L = 8 stacked layers, how many input tokens wide is the span that can influence the last token?
        answer: 1025
        feedback: "8 × 128 + 1 = 1,025."
  - id: attention-patterns.cost
    objective_ref: objective.attention-patterns
    task: base
    response_type: numeric
    points: 1
    hint: "Use n²/2 pairs for full causal attention and n × w pairs for a sliding window. Their ratio simplifies to n / (2w)."
    remediation_scene: attention-patterns.s4
    absolute_tolerance: 0.1
    variants:
      - id: attention-patterns.cost.1
        prompt: A causal model reads n = 8,192 tokens. Using n²/2 pairs for full attention and n × w for a window of w = 1,024, how many times more pairs does full attention compute?
        answer: 4
        feedback: "n / (2w) = 8,192 / 2,048 = 4."
      - id: attention-patterns.cost.2
        prompt: A causal model reads n = 100,000 tokens. Using n²/2 pairs for full attention and n × w for a window of w = 4,096, how many times more pairs does full attention compute? Give one decimal place.
        answer: 12.2
        feedback: "n / (2w) = 100,000 / 8,192 ≈ 12.2."
      - id: attention-patterns.cost.3
        prompt: A causal model reads n = 32,768 tokens. Using n²/2 pairs for full attention and n × w for a window of w = 512, how many times more pairs does full attention compute?
        answer: 32
        feedback: "n / (2w) = 32,768 / 1,024 = 32."
      - id: attention-patterns.cost.4
        prompt: A causal model reads n = 131,072 tokens. Using n²/2 pairs for full attention and n × w for a window of w = 4,096, how many times more pairs does full attention compute?
        answer: 16
        feedback: "n / (2w) = 131,072 / 8,192 = 16. At 4× the length it would be 64."
