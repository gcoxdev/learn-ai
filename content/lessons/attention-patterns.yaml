schema_version: 0.2-draft
lesson:
  id: attention-patterns
  version: 0.1.0-draft
  title: Choose which token pairs may communicate
  state: draft
  summary: Local, sliding-window, sparse, and global attention patterns change direct token connectivity; trace
    multi-layer information paths and measure quality alongside reduced pair counts.
  slot: M19.1
  category: learning
  minutes: 12
  sources:
  - title: Longformer
    url: https://arxiv.org/abs/2004.05150
  - title: Big Bird
    url: https://arxiv.org/abs/2007.14062
objectives:
- id: objective.attention-patterns
  version: 1-draft
  statement: Local, sliding-window, sparse, and global attention patterns change direct token connectivity; trace
    multi-layer information paths and measure quality alongside reduced pair counts.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - attention-patterns.base
  - attention-patterns.transfer
  prerequisites:
  - anyOf:
    - objective.transformer-trace
  - anyOf:
    - objective.algorithm-cost
scenes:
- id: attention-patterns.s1
  title: Dense connectivity has a cost
  type: explanation
  depth: intuition
  objective_refs:
  - objective.attention-patterns
  markdown: In causal dense attention, each position can read its allowed prefix. Restricting that set reduces direct
    query-key pairs. A sliding window permits only a recent neighborhood; a sparse pattern selects other connections.
    The pattern is part of the model’s information pathway, not just a storage setting.
  text_mode: In causal dense attention, each position can read its allowed prefix. Restricting that set reduces
    direct query-key pairs. A sliding window permits only a recent neighborhood; a sparse pattern selects other
    connections. The pattern is part of the model’s information pathway, not just a storage setting.
  bridges: []
- id: attention-patterns.s2
  title: Trace a small window
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attention-patterns
  markdown: With a causal window of three positions including the current one, position six directly reads positions
    four, five, and six. Information from earlier positions may arrive indirectly through representations built
    by earlier layers. Whether a useful detail survives that chain depends on training and representation capacity.
  text_mode: With a causal window of three positions including the current one, position six directly reads positions
    four, five, and six. Information from earlier positions may arrive indirectly through representations built
    by earlier layers. Whether a useful detail survives that chain depends on training and representation capacity.
  bridges: []
- id: attention-patterns.s3
  title: Add global or structured links
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attention-patterns
  markdown: Some architectures combine local windows with selected global tokens, dilated connections, or periodic
    dense layers. These links shorten paths between distant positions but add work. A globally connected summary
    token can become an information bottleneck rather than a perfect store of the full sequence.
  text_mode: Some architectures combine local windows with selected global tokens, dilated connections, or periodic
    dense layers. These links shorten paths between distant positions but add work. A globally connected summary
    token can become an information bottleneck rather than a perfect store of the full sequence.
  bridges: []
- id: attention-patterns.s4
  title: Separate pattern changes from kernel changes
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.attention-patterns
  markdown: A tiled exact dense kernel preserves the dense permitted pairs; a local attention model changes them.
    Compare task accuracy, long-range retrieval, memory, and latency at matched lengths. A cheaper pattern can lose
    needed connections even if its implementation is highly efficient.
  text_mode: A tiled exact dense kernel preserves the dense permitted pairs; a local attention model changes them.
    Compare task accuracy, long-range retrieval, memory, and latency at matched lengths. A cheaper pattern can lose
    needed connections even if its implementation is highly efficient.
  bridges: []
- id: attention-patterns.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
