schema_version: 0.2-draft
lesson:
  id: attention-patterns
  version: 0.4.0-draft
  title: Choose which token pairs may communicate
  state: draft
  summary: A 100,000-token codebase means five billion token pairs per head, per layer. See how sliding windows, dilation, and global tokens cut that bill, and what each cut gives up.
  slot: M19.1
  category: learning
  sources:
    - title: "Longformer: The Long-Document Transformer (Beltagy, Peters & Cohan, 2020)"
      url: https://arxiv.org/abs/2004.05150
    - title: "Big Bird: Transformers for Longer Sequences (Zaheer et al., 2020)"
      url: https://arxiv.org/abs/2007.14062
    - title: "Generating Long Sequences with Sparse Transformers (Child et al., 2019)"
      url: https://arxiv.org/abs/1904.10509
    - title: "Mistral 7B (Jiang et al., 2023)"
      url: https://arxiv.org/abs/2310.06825
    - title: "Gemma 2: Improving Open Language Models at a Practical Size (Gemma Team, 2024)"
      url: https://arxiv.org/abs/2408.00118
objectives:
  - id: objective.attention-patterns
    version: 2-draft
    statement: Local, sliding-window, sparse, and global attention patterns change direct token connectivity; trace multi-layer information paths and measure quality alongside reduced pair counts.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - attention-patterns.base.v2
      - attention-patterns.transfer.v2
      - attention-patterns.reach
      - attention-patterns.cost
    prerequisites:
      - anyOf:
          - objective.transformer-trace
      - anyOf:
          - objective.algorithm-cost
scenes:
  - id: attention-patterns.s1
    title: Five billion pairs per head
    type: explanation
    depth: intuition
    objective_refs:
      - objective.attention-patterns
    markdown: |-
      You want a coding assistant to read a whole repository, about 100,000 tokens, and then answer "where is `parse_invoice` defined?" In full causal attention, every token compares its query with the key of every earlier token. That is $n(n+1)/2 \approx 5$ billion query-key pairs for $n = 100{,}000$, in *every head of every layer*. As the end-to-end token trace in module 15 showed, doubling $n$ quadruples that count.

      An **attention pattern** (also called an attention mask) is the rule for which pairs are allowed to be computed at all. Draw it as a grid: one row per query position, one column per key position, ■ where a pair is allowed and · where it is blocked. Here are two patterns for 8 tokens:

      ```text
      Full causal                 Window, w = 3
      keys:  1 2 3 4 5 6 7 8      keys:  1 2 3 4 5 6 7 8
      q1     ■ · · · · · · ·      q1     ■ · · · · · · ·
      q2     ■ ■ · · · · · ·      q2     ■ ■ · · · · · ·
      q3     ■ ■ ■ · · · · ·      q3     ■ ■ ■ · · · · ·
      q4     ■ ■ ■ ■ · · · ·      q4     · ■ ■ ■ · · · ·
      q5     ■ ■ ■ ■ ■ · · ·      q5     · · ■ ■ ■ · · ·
      q6     ■ ■ ■ ■ ■ ■ · ·      q6     · · · ■ ■ ■ · ·
      q7     ■ ■ ■ ■ ■ ■ ■ ·      q7     · · · · ■ ■ ■ ·
      q8     ■ ■ ■ ■ ■ ■ ■ ■      q8     · · · · · ■ ■ ■
      36 pairs                    21 pairs
      ```

      The full triangle grows with the sequence. A **sliding window** of width $w$ lets each token read only itself and the $w - 1$ tokens just before it, so it stays a band of constant width no matter how long the sequence gets.

      :::papers Masked attention
      Every pattern in this lesson is the same attention formula with a different mask $M$:

      $$\text{Attention}(Q, K, V) = \text{softmax}\!\left(\frac{QK^\top}{\sqrt{d_k}} + M\right)V, \qquad M_{ij} = \begin{cases} 0 & \text{pair allowed} \\ -\infty & \text{pair blocked} \end{cases}$$

      A $-\infty$ score becomes a softmax weight of exactly 0. The ■ cells in the grid are the zeros of $M$. Efficient kernels skip blocked pairs entirely, and that is where the savings come from.
      :::
    bridges: []
  - id: attention-patterns.s2
    title: Stacked windows see further than one window
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.attention-patterns
    markdown: |-
      A window of 3 looks tiny, but a transformer stacks layers. Follow token 6:

      - **Layer 1.** Token 6 reads tokens 4, 5, and 6. Token 4, meanwhile, reads tokens 2, 3, and 4.
      - **Layer 2.** Token 6 reads the layer-1 outputs of tokens 4, 5, and 6. The layer-1 output of token 4 already carries information about token 2, so token 2 now reaches token 6 in two hops.

      Each layer extends the reach back by another $w - 1$ positions. After $L$ layers, the span of input tokens that can influence one position, its **receptive field**, is

      $$\text{span} = L\,(w - 1) + 1 \;\approx\; L \cdot w$$

      Longformer's paper states the same result as "$\ell \times w$". Mistral 7B (2023) used a 4,096-token window in 32 layers and noted a theoretical span of about 131K tokens: $32 \times 4{,}095 + 1 = 131{,}041$.

      :::predict With w = 3, how many layers until token 1 can influence token 9?
      You need a span of 9 tokens: $L \times 2 + 1 = 9$, so $L = 4$. After three layers the span is only 7 (tokens 3 through 9).
      :::

      The code below tracks reach exactly: it multiplies the mask by itself once per layer, the way information hops.

      ```python run
      import numpy as np

      n, w = 16, 3                       # 16 tokens, causal window of 3 (itself + 2 back)
      i, j = np.indices((n, n))
      mask = (j <= i) & (j > i - w)      # mask[i, j]: may token i read token j directly?

      reach = np.eye(n, dtype=int)       # before layer 1, each position holds only its own token
      for layer in range(1, 6):
          reach = ((mask @ reach) > 0).astype(int)   # one more hop through the window
          first = np.argmax(reach[-1]) + 1           # earliest token that reaches token 16
          span = n - first + 1
          print(f"layer {layer}: token 16 carries tokens {first:2d}..16  span {span:2d}"
                f"  formula L*(w-1)+1 = {layer * (w - 1) + 1}")

      print("pairs computed:", mask.sum(), "window vs", n * (n + 1) // 2, "full causal")
      ```

      The span grows 3, 5, 7, 9, 11 while the pair count stays at 45 instead of 136. Change `w` to 5 and watch the span grow by 4 per layer.

      :::mixup "A 131K receptive field means the model remembers 131K tokens."
      It means a *path* exists. Information from token 1 must survive 32 hops, each squeezed into a fixed-width vector shared with everything else that token carries. When exact recall of a distant token matters, test it directly.
      :::
    diagram:
      caption: Two layers of a window-3 pattern carry token 2 to token 6 in two hops.
      description: "Inputs sit on the bottom row: token 2, token 4, and token 6 (tokens 3 and 5 are left out to keep the drawing simple). In layer 1, token 4 reads token 2 and token 4 (its window covers tokens 2 to 4), and token 6 reads token 4 and token 6 (its window covers 4 to 6). In layer 2, token 6 reads the layer-1 outputs of tokens 4 and 6. Token 2 has no direct arrow to token 6 in any single layer; it arrives through token 4."
      nodes:
        - id: in2
          label: Token 2 input
          col: 0
          row: 2
          tone: data
        - id: in4
          label: Token 4 input
          col: 2
          row: 2
          tone: data
        - id: in6
          label: Token 6 input
          col: 4
          row: 2
          tone: data
        - id: l1t4
          label: Token 4, layer 1
          note: window covers 2..4
          col: 2
          row: 1
        - id: l1t6
          label: Token 6, layer 1
          note: window covers 4..6
          col: 4
          row: 1
        - id: l2t6
          label: Token 6, layer 2
          note: now carries tokens 2..6
          col: 4
          row: 0
          tone: accent
      edges:
        - from: in2
          to: l1t4
        - from: in4
          to: l1t4
        - from: in4
          to: l1t6
        - from: in6
          to: l1t6
        - from: l1t4
          to: l2t6
          label: hop 2
        - from: l1t6
          to: l2t6
    bridges: []
  - id: attention-patterns.s3
    title: "Shortcuts: dilated windows and global tokens"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.attention-patterns
    markdown: |-
      Stacking windows reaches far slowly. Two tricks add shortcuts.

      A **dilated window** keeps $w$ keys per query but spaces them $d$ positions apart, the way a dilated convolution skips pixels. With $d = 2$ and $w = 3$, token 8 reads tokens 4, 6, and 8. The span per layer grows to about $d \cdot w$, so Longformer gives the stacked reach as $\ell \times d \times w$. Longformer (Beltagy, Peters & Cohan, 2020) worked best with some heads undilated, for local detail, and others dilated. OpenAI's Sparse Transformer (Child et al., 2019) did something similar a year earlier, splitting heads between a local window and a strided pattern that reads every $k$-th earlier token.

      A **global token** is a position exempt from the window. In Longformer the rule is symmetric: a global token attends to every token, and every token attends to it. Longformer made the classifier's `[CLS]` token global, and for question answering it made every question token global. Now any two tokens are at most two hops apart: token → global token → token. In a causal (left-to-right) model, the version you can build is one-sided: every token may read a few designated early tokens, such as the instructions at the top.

      ```text
      Dilated, d = 2, w = 3       Window 3 + global token 1 (causal)
      keys:  1 2 3 4 5 6 7 8      keys:  1 2 3 4 5 6 7 8
      q5     ■ · ■ · ■ · · ·      q5     ■ · ■ ■ ■ · · ·
      q6     · ■ · ■ · ■ · ·      q6     ■ · · ■ ■ ■ · ·
      q7     · · ■ · ■ · ■ ·      q7     ■ · · · ■ ■ ■ ·
      q8     · · · ■ · ■ · ■      q8     ■ · · · · ■ ■ ■
      ```

      Global tokens are cheap because there are few of them: $g$ symmetric global tokens add about $2gn$ pairs (a full row and column each), still linear in $n$.

      **BigBird** (Zaheer et al., 2020) combined a sliding window, a few global tokens, and a few random keys per query; the random links act as shortcuts that keep paths short. The authors proved that this sparse pattern keeps full attention's main theoretical guarantees (it can still approximate any sequence-to-sequence function), and ran on sequences up to 8 times longer than before on similar hardware.
    bridges: []
  - id: attention-patterns.s4
    title: Count the savings, then check what was cut
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.attention-patterns
    markdown: |-
      Back to the repository. For a causal model, count pairs with two approximations:

      | Pattern | Pairs per head per layer | $n = 100{,}000$, $w = 4{,}096$ |
      | --- | --- | ---: |
      | Full causal | $\approx n^2 / 2$ | $5.0 \times 10^9$ |
      | Sliding window | $\approx n \cdot w$ | $4.1 \times 10^8$ |
      | Ratio | $\approx n / (2w)$ | about 12× |

      Full attention grows as $O(n^2)$ and the window as $O(n \cdot w)$: linear in $n$ for a fixed window. The ratio itself grows with $n$. At 1 million tokens the same window saves about 122×.

      :::predict You keep w = 4,096 and double n to 200,000. What happens to each cost, and to the ratio?
      Full attention quadruples to $2 \times 10^{10}$ pairs. The window only doubles, to about $8.2 \times 10^8$. The ratio doubles to about 24×.
      :::

      :::mixup "FlashAttention and a sliding window are two ways of doing the same thing."
      FlashAttention (from module 17's lesson on efficient attention kernels) computes *exactly the same* pairs as plain attention while moving less data, so its outputs match. A sliding window removes pairs, so it changes what the model computes, and a model usually needs training with the pattern it will use.
      :::

      Now decide for the coding assistant. With a 4,096 window and 32 layers, `parse_invoice`'s definition 80,000 tokens back is inside the receptive field, but only through about 20 hops. That is a weak path for recalling an exact name. Three practical fixes:

      - make the user's question and the file index **global**, so every token can read them directly;
      - interleave some **full-attention layers** among the windowed ones (Gemma 2, for example, alternates local sliding-window layers with global-attention layers);
      - retrieve the relevant file first and show the model a shorter context.

      Then test on questions whose evidence sits far outside one window: a benchmark of 2,000-token articles can't tell a 4,096-token window from full attention.
    bridges: []
  - id: attention-patterns.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.attention-patterns
    markdown: Trace windows through layers, count the pairs a pattern saves, and choose shortcuts for a genome model, a chat system prompt, and a contract classifier.
    takeaway: |-
      An attention pattern decides which token pairs are computed. A window of w over L layers reaches about L·w tokens at a cost near n·w instead of n²/2, and global or dilated links add shortcuts for the pairs that matter.
  - id: attention-patterns.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.attention-patterns
    markdown: |-
      An attention pattern determines which positions can exchange information directly. Trace several layers to see indirect paths, then test whether the needed detail survives.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - attention-patterns.s1
        - attention-patterns.s2
        - attention-patterns.s3
        - attention-patterns.s4
        - attention-patterns.check
      gate_refs:
