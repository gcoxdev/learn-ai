assessment_families:
  - id: rlhf-and-kl-control.base
    objective_ref: objective.rlhf-and-kl-control
    task: base
    response_type: single_choice
    points: 1
    hint: 'Measure improvement relative to expectation: trace the inputs, operation, and result before choosing.'
    remediation_scene: rlhf-and-kl-control.s2
    variants:
      - id: rlhf-and-kl-control.base.1
        prompt: Reward three minus baseline two gives advantage what?
        options:
          - id: b
            text: Five
          - id: c
            text: Negative one
          - id: a
            text: One
        answer: a
        feedback: Advantage compares outcome to an expectation.
        retired: true
      - id: rlhf-and-kl-control.base.2
        prompt: What does the policy assign probabilities to?
        options:
          - id: c
            text: Only training hardware types
          - id: a
            text: Generated actions such as tokens
          - id: b
            text: Only optimizer file names
        answer: a
        feedback: Language generation can be treated as a sequential policy.
        retired: true
  - id: rlhf-and-kl-control.transfer
    objective_ref: objective.rlhf-and-kl-control
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Audit the complete loop: trace the inputs, operation, and result before choosing.'
    remediation_scene: rlhf-and-kl-control.s4
    variants:
      - id: rlhf-and-kl-control.transfer.1
        prompt: Are PPO clipping and reference KL penalties the same mechanism?
        options:
          - id: c
            text: Only if both are written in one loss
          - id: a
            text: No; they constrain different comparisons
          - id: b
            text: 'Yes'
        answer: a
        feedback: The rollout policy and reference model serve different roles.
        retired: true
      - id: rlhf-and-kl-control.transfer.2
        prompt: Does RLHF require a human to score every rollout live?
        options:
          - id: a
            text: No; learned reward models or other feedback signals can score rollouts
          - id: b
            text: 'Yes'
          - id: c
            text: Only if no value function exists
        answer: a
        feedback: Human feedback can be mediated through trained scoring systems.
        retired: true
  - id: rlhf-and-kl-control.base.v2
    objective_ref: objective.rlhf-and-kl-control
    task: base
    response_type: single_choice
    points: 1
    hint: "Name the four models first (policy, reward model, reference model, value model) and say which ones change during training and what each one compares."
    remediation_scene: rlhf-and-kl-control.s1
    variants:
      - id: rlhf-and-kl-control.base.v2.1
        prompt: "In RLHF, the 'policy' is the language model being trained. What does it assign probabilities to?"
        options:
          - id: b
            text: Which of two answers a human would prefer
          - id: a
            text: The next token it might write
          - id: c
            text: How far it has drifted from its starting point
        answer: a
        feedback: The policy is the assistant itself, choosing one token at a time. Judging which of two answers people prefer is the reward model's job, and drift from the start is what the KL penalty measures against the reference model.
      - id: rlhf-and-kl-control.base.v2.2
        prompt: "During RLHF, the policy makes the token 'Absolutely' 50 times more likely than the reference model does. What does the KL penalty do to an answer that uses it?"
        options:
          - id: c
            text: It blocks the token, since its probability ratio is outside the clip range
          - id: b
            text: Nothing, since the reward model already scored the answer
          - id: a
            text: It subtracts β × ln 50 ≈ β × 3.9 from that answer's reward
        answer: a
        feedback: Each token adds its log ratio to the penalty, so this one costs β × ln 50 ≈ 3.9β. Clipping is PPO's separate control against the previous policy, and it limits the update's incentive rather than blocking tokens; the reward model's score is reduced by the penalty, not replaced.
      - id: rlhf-and-kl-control.base.v2.3
        prompt: "Why is the reference model frozen instead of being updated along with the policy?"
        options:
          - id: a
            text: So drift is always measured from the SFT model, where the reward model is reliable
          - id: b
            text: So the reference can score answers in place of the reward model
          - id: c
            text: Because updating two models at once would make PPO clipping unstable
        answer: a
        feedback: A fixed anchor means the penalty grows with total drift from where the reward model's judgments were trained. A reference that moved with the policy would measure nothing. The reference doesn't score answers, and clipping compares against the previous policy, not the reference.
      - id: rlhf-and-kl-control.base.v2.4
        prompt: "A team runs RLHF with β = 0. What pattern should they expect over a long run?"
        options:
          - id: b
            text: Scores and quality rise together, only more slowly than with a penalty
          - id: c
            text: The policy stays close to the SFT model, since PPO clipping limits change
          - id: a
            text: The reward model's score keeps rising while real quality peaks and falls
        answer: a
        feedback: With no penalty, the policy is free to exploit the reward model's blind spots, so the proxy score rises while real quality turns down. PPO limits each step, but many small steps still add up to large drift.
  - id: rlhf-and-kl-control.transfer.v2
    objective_ref: objective.rlhf-and-kl-control
    task: transfer
    response_type: single_choice
    points: 1
    hint: When the reward-model score and human judgment disagree, suspect reward hacking. Then ask whether the fix is more KL control, a better reward model, or both.
    remediation_scene: rlhf-and-kl-control.s3
    variants:
      - id: rlhf-and-kl-control.transfer.v2.1
        prompt: "A news summarizer is trained with RLHF. After 2,000 steps, its reward-model score is up 40%, but editors say summaries now copy long quotes word for word. The KL to the reference has grown steadily. What is the most likely diagnosis?"
        options:
          - id: a
            text: The policy found a quirk the reward model likes and drifted to exploit it
          - id: b
            text: The reward model is correct and the editors' taste is out of date
          - id: c
            text: PPO's clipping range is too narrow for the policy to learn well
        answer: a
        feedback: A rising proxy score, falling human judgment, and growing KL are the signature of reward hacking. Editors are the ground truth here, and a too-narrow clip would slow learning rather than produce a specific bad habit.
      - id: rlhf-and-kl-control.transfer.v2.2
        prompt: "A tutoring bot's RLHF run barely changes anything: after training, its answers are nearly identical to the SFT model's and the KL stays close to zero. What should the team try?"
        options:
          - id: c
            text: Remove the reference model so that the policy is free to move
          - id: a
            text: Lower β somewhat and watch the KL and human ratings together
          - id: b
            text: Raise β so that the reward model's signal counts for more
        answer: a
        feedback: A penalty that's too strong pins the policy to the SFT model, so lowering β lets it move; watching KL and human ratings catches the point where hacking starts. Removing the reference invites hacking, and raising β makes the problem worse.
      - id: rlhf-and-kl-control.transfer.v2.3
        prompt: "A travel assistant's RLHF logs show that every single update passed PPO's clip check, yet after 10,000 steps it answers in a strange, repetitive style. How can both be true?"
        options:
          - id: b
            text: They can't; PPO clipping would have stopped any large change
          - id: c
            text: The reward model must have been retrained halfway through
          - id: a
            text: Clipping limits each step, but thousands of small steps add up
        answer: a
        feedback: PPO compares the policy only with the version that wrote the current batch, so each step can be small while total drift is large. That total drift is what the KL penalty to the frozen reference catches. No reward-model change is needed to explain it.
      - id: rlhf-and-kl-control.transfer.v2.4
        prompt: "A team wants human feedback in its RLHF run but can't afford people to rate 200,000 generated answers. How does standard RLHF handle this?"
        options:
          - id: a
            text: People label a smaller set of pairs once, and a reward model scores every rollout
          - id: b
            text: People rate a random 1% of rollouts, and the other 99% get no reward
          - id: c
            text: The reference model scores rollouts, since it was trained on human data
        answer: a
        feedback: Human judgment enters through the reward model, which is trained once on comparisons and then scores every generated answer. Rollouts without a reward teach nothing, and the reference model only measures drift; it doesn't score quality.
  - id: rlhf-and-kl-control.calculate
    objective_ref: objective.rlhf-and-kl-control
    task: base
    response_type: numeric
    points: 1
    hint: "Add up ln(π / π_ref) over the answer's tokens, multiply by β, and subtract that from the reward-model score."
    remediation_scene: rlhf-and-kl-control.s3
    absolute_tolerance: 0.01
    variants:
      - id: rlhf-and-kl-control.calculate.1
        prompt: An answer gets reward-model score 3.0. Its tokens' log ratios ln(π / π_ref) add up to 5.0, and β = 0.1. What is the KL-penalized reward?
        answer: 2.5
        feedback: 3.0 − 0.1 × 5.0 = 3.0 − 0.5 = 2.5.
      - id: rlhf-and-kl-control.calculate.2
        prompt: An answer gets reward-model score 1.5. Its four tokens have log ratios 0.4, 0.2, 0.9, and 0.5, and β = 0.05. What is the KL-penalized reward?
        answer: 1.4
        feedback: The log ratios add to 2.0, so the penalty is 0.05 × 2.0 = 0.1 and the reward is 1.5 − 0.1 = 1.4.
      - id: rlhf-and-kl-control.calculate.3
        prompt: "A two-token answer gets reward-model score 2.2, with β = 0.2. Token 1 has π = 0.8 and π_ref = 0.4; token 2 has π = 0.5 and π_ref = 0.5. What is the KL-penalized reward?"
        answer: 2.061
        feedback: The log ratios are ln 2 ≈ 0.693 and ln 1 = 0, so the penalty is 0.2 × 0.693 ≈ 0.139 and the reward is 2.2 − 0.139 ≈ 2.061.
      - id: rlhf-and-kl-control.calculate.4
        prompt: "An answer gets reward-model score 4.0 with β = 0.1. It has three tokens, and for each one π = 0.9 while π_ref = 0.03. What is the KL-penalized reward?"
        answer: 2.98
        feedback: Each token's log ratio is ln 30 ≈ 3.401, so the three add to 10.20. The penalty is 0.1 × 10.20 ≈ 1.02, leaving 4.0 − 1.02 ≈ 2.98.
      - id: rlhf-and-kl-control.calculate.5
        prompt: "An answer gets reward-model score 0.8 with β = 0.1. Its tokens' log ratios add up to −1.0, because the policy made these particular tokens less likely than the reference did. What is the KL-penalized reward?"
        answer: 0.9
        feedback: 0.8 − 0.1 × (−1.0) = 0.8 + 0.1 = 0.9. One sampled answer's log-ratio sum can be negative, even though its average over many answers, the KL, can't be.
