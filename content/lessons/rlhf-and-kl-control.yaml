schema_version: 0.2-draft
lesson:
  id: rlhf-and-kl-control
  version: 0.4.0-draft
  title: Learn from feedback while controlling policy changes
  state: draft
  summary: Train an assistant to please a reward model and it soon opens every reply with "Absolutely! Great question!" One penalty term, charged token by token, keeps it honest.
  slot: M20.5
  category: learning
  sources:
    - title: "Training language models to follow instructions with human feedback (InstructGPT; Ouyang et al., 2022)"
      url: https://arxiv.org/abs/2203.02155
    - title: "Learning to summarize from human feedback (Stiennon et al., 2020)"
      url: https://arxiv.org/abs/2009.01325
    - title: "Proximal Policy Optimization Algorithms (Schulman et al., 2017)"
      url: https://arxiv.org/abs/1707.06347
    - title: "Scaling Laws for Reward Model Overoptimization (Gao, Schulman & Hilton, 2022)"
      url: https://arxiv.org/abs/2210.10760
objectives:
  - id: objective.rlhf-and-kl-control
    version: 2-draft
    statement: An RLHF loop samples responses, scores them, estimates learning signals, and updates the policy; PPO-style constraints and reference-policy penalties address different forms of update control.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - rlhf-and-kl-control.base.v2
      - rlhf-and-kl-control.transfer.v2
      - rlhf-and-kl-control.calculate
    prerequisites:
      - anyOf:
          - objective.preferences-and-reward-models
      - anyOf:
          - objective.stochastic-gradients
      - anyOf:
          - objective.information-theory
scenes:
  - id: rlhf-and-kl-control.s1
    title: The assistant becomes the policy
    type: explanation
    depth: intuition
    objective_refs:
      - objective.rlhf-and-kl-control
    markdown: |-
      Ferncliff now has a reward model that scores answers the way its staff would. **RLHF** (reinforcement learning from human feedback) uses it to improve the assistant. Humans gave their judgments once, to train the reward model; now it stands in for them and scores thousands of fresh answers.

      As in the first lesson of this module, the assistant is the **policy**: at each step it assigns probabilities to the next token, so each token it writes is an action. (The reinforcement-learning module covers policies, actions, and rewards in full.) One training round goes:

      1. Take a batch of customer questions.
      2. The policy writes an answer to each. One generated answer is called a **rollout**.
      3. The reward model scores each finished answer.
      4. A policy-gradient update, usually PPO (more on it below), makes answers that scored better than expected more likely and worse-than-expected ones less likely.

      A third model sits beside them: a frozen copy of the SFT model, called the **reference model**. It never trains. Its job is to say how likely the *original* assistant was to write each token, so training can notice when the policy wanders off. The next two scenes show why that matters.
    diagram:
      caption: One RLHF round. The reward model scores the answer, the frozen reference model measures drift, and PPO updates only the policy.
      description: A prompt goes to the policy, which writes an answer. The answer goes to the reward model, which gives a score, and to the frozen reference model, which gives each token's original probability for the KL penalty. The score minus the penalty forms the training reward, which PPO uses to update the policy. The reward and reference models never change.
      nodes:
        - id: prompt
          label: Customer question
          col: 0
          row: 0
          tone: data
        - id: policy
          label: Policy (training)
          note: starts as the SFT model
          col: 1
          row: 0
          tone: accent
        - id: answer
          label: Generated answer
          note: one rollout
          col: 2
          row: 0
          tone: data
        - id: rm
          label: Reward model (frozen)
          note: score r(x, y)
          col: 3
          row: 0
          tone: muted
        - id: ref
          label: Reference model (frozen)
          note: copy of the SFT model
          col: 2
          row: 2
          tone: muted
        - id: total
          label: Reward − β × KL
          note: training signal
          col: 1
          row: 2
          tone: warn
      edges:
        - from: prompt
          to: policy
        - from: policy
          to: answer
        - from: answer
          to: rm
        - from: answer
          to: ref
        - from: rm
          to: total
          label: score
        - from: ref
          to: total
          label: per-token drift
        - from: total
          to: policy
          label: PPO update
          dashed: true
    bridges: []
  - id: rlhf-and-kl-control.s2
    title: The reward model gets hacked
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.rlhf-and-kl-control
    markdown: |-
      Ferncliff first runs RLHF with no reference model at all, just "maximize the reward model's score." For a while, answers improve. Then the average score keeps climbing while the staff's spot checks get worse. By the end, a typical answer reads:

      > Absolutely! Great question! 🚲 We totally understand how important your bike is to you! Most repairs take two to three days...

      The reward model had learned, from the staff's pairs, that friendly and longer answers tend to win. It never saw anything like this, so it had no idea that stacking enthusiasm is worse. The policy found the gap and poured everything into it. That's **reward hacking**: the policy maximizes the score it's given rather than the goal behind it. It's the same failure as the famous 2016 boat-racing agent that circled a lagoon collecting points instead of finishing the race (the reinforcement-learning module tells that story), now inside a language model.

      :::story The proxy goes up; the real score goes down
      Gao, Schulman, and Hilton (2022) measured this carefully. They used one large reward model as a stand-in for human judgment and trained smaller reward models to imitate it. Optimizing a policy against a small reward model raised its score steadily. The large model's score rose at first, then peaked and fell as the policy moved further from where it started. The further the policy drifts, the less the proxy can be trusted.
      :::

      So the fix is to limit drift: let the policy improve near the SFT model, where the reward model's judgments are reliable.
    bridges:
      - reinforcement-learning-loop
  - id: rlhf-and-kl-control.s3
    title: Charge for every token that drifts
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.rlhf-and-kl-control
    markdown: |-
      For each token the policy writes, compare its probability under the policy, $\pi$, with its probability under the reference model, $\pi_{\text{ref}}$. The **log ratio** $\ln(\pi / \pi_{\text{ref}})$ is near 0 when the two agree and grows as the policy makes a token much more likely than the SFT model would. Add the log ratios over the answer, multiply by a coefficient $\beta$, and subtract that from the reward. Averaged over many answers, that sum of log ratios is the **KL divergence** between policy and reference, the measure of how far two distributions differ from the information-theory lessons.

      Compare a plain answer with the flattering one, using $\beta = 0.1$:

      ```python run
      import numpy as np

      beta = 0.1        # KL coefficient: how much each nat of drift costs
      body_pi  = [0.50, 0.60, 0.70, 0.40, 0.90, 0.80]    # "Most repairs take 2-3 days. Call ..."
      body_ref = [0.45, 0.60, 0.65, 0.40, 0.90, 0.75]
      answers = {
          "plain":      dict(reward=1.2, pi=body_pi, ref=body_ref),
          "flattering": dict(reward=2.0,                   # "Absolutely! Great question! ..."
                             pi=[0.60, 0.90, 0.70, 0.95, 0.90] + body_pi,
                             ref=[0.01, 0.30, 0.02, 0.60, 0.50] + body_ref),
      }
      for name, a in answers.items():
          log_ratio = np.log(np.array(a["pi"]) / np.array(a["ref"]))   # one term per token
          kl = log_ratio.sum()
          print(f"{name:10s} reward {a['reward']:.2f} - {beta} x {kl:.2f} = {a['reward'] - beta * kl:.2f}")
          print("           per-token log ratios:", np.round(log_ratio, 2))
      ```

      The reward model prefers the flattering answer, 2.0 to 1.2. But the SFT model gave "Absolutely" probability 0.01 and the policy now gives it 0.60: a log ratio of $\ln 60 = 4.09$ for that one token. The five-token prefix costs 9.80, the whole answer 10.04. After the penalty, the plain answer wins, 1.18 to 1.00, so training moves the policy *away* from the flattery.

      :::predict Ferncliff lowers β to 0.02 to let the assistant change faster. Which answer wins now?
      The flattering one: $2.0 - 0.02 \times 10.04 = 1.80$ against $1.2 - 0.02 \times 0.24 = 1.20$. Too small a β and hacking pays again. Too large and the policy can barely move from the SFT model. Teams tune β while watching the KL value and the human spot checks together.
      :::

      :::papers The RLHF objective
      $$\max_{\pi}\; \mathbb{E}_{x \sim \mathcal{D},\, y \sim \pi(\cdot \mid x)}\big[r(x, y)\big] - \beta\, \mathrm{KL}\big(\pi(\cdot \mid x) \,\|\, \pi_{\text{ref}}(\cdot \mid x)\big)$$

      $x$ is a prompt from the dataset $\mathcal{D}$, $y$ an answer sampled from the policy, $r$ the reward model's score (2.0 for the flattering answer), and $\pi_{\text{ref}}$ the frozen SFT model. In practice each sampled answer's KL is estimated by the sum of its tokens' log ratios (10.04 here), so the training reward is $r(x, y) - \beta \sum_t \ln \frac{\pi(y_t \mid x, y_{<t})}{\pi_{\text{ref}}(y_t \mid x, y_{<t})}$. A single token's log ratio can be negative, but the average over many answers is never below zero. Stiennon et al. (2020) and InstructGPT both used this KL penalty; InstructGPT describes charging it at every token.
      :::
    bridges:
      - information-theory
  - id: rlhf-and-kl-control.s4
    title: PPO keeps each step small; KL keeps the whole trip short
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.rlhf-and-kl-control
    markdown: |-
      The update itself is usually **PPO** (proximal policy optimization; Schulman et al., 2017), which the policy-gradients lesson in the reinforcement-learning module covers in full. PPO compares each token's probability under the policy being updated with its probability under the policy that *wrote the batch*, and clips that ratio to $[1 - \epsilon, 1 + \epsilon]$, usually with $\epsilon = 0.2$. It also trains a **value model**, a critic that predicts the reward an answer will get, so each token can be judged against expectation.

      Learners often merge the two controls. They compare the policy with different models:

      | Control | Compares the policy with | What it prevents |
      | --- | --- | --- |
      | PPO clipping | The policy from a few minutes ago, which wrote this batch | One batch making a huge jump |
      | KL penalty | The frozen SFT model from before RLHF began | Slow drift, step by small step, into reward hacking |

      A policy can pass PPO's check at every step, each only a little different from the last, and still wander far from the SFT model over thousands of steps. The KL penalty is what catches that.

      This setup needs four models in memory at once: the policy, the value model, the reward model, and the reference model. That cost is a big part of why the next lesson's method, DPO, became popular.
    bridges:
      - policy-gradients-and-actor-critic
  - id: rlhf-and-kl-control.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.rlhf-and-kl-control
    markdown: Compute a few KL-penalized rewards, then diagnose RLHF runs for a summarizer, a tutoring bot, and a travel assistant that drifted.
    takeaway: |-
      RLHF trains the policy to maximize a reward model's score minus β times its drift from the frozen SFT model, charged token by token. Without that penalty, the policy finds and exploits the reward model's blind spots.
  - id: rlhf-and-kl-control.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.rlhf-and-kl-control
    markdown: |-
      RLHF generates responses, scores them, and learns from the scores. PPO clipping controls an update incentive; a reference-model penalty discourages longer-term drift.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - rlhf-and-kl-control.s1
        - rlhf-and-kl-control.s2
