schema_version: 0.2-draft
lesson:
  id: rlhf-and-kl-control
  version: 0.1.0-draft
  title: Optimize a language policy against feedback while limiting drift
  state: draft
  summary: An RLHF loop samples responses, scores them, estimates learning signals, and updates the policy; PPO-style
    constraints and reference-policy penalties address different forms of update control.
  slot: M20.5
  category: learning
  sources:
  - title: InstructGPT
    url: https://arxiv.org/abs/2203.02155
  - title: PPO
    url: https://arxiv.org/abs/1707.06347
objectives:
- id: objective.rlhf-and-kl-control
  version: 1-draft
  statement: An RLHF loop samples responses, scores them, estimates learning signals, and updates the policy; PPO-style
    constraints and reference-policy penalties address different forms of update control.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - rlhf-and-kl-control.base
  - rlhf-and-kl-control.transfer
