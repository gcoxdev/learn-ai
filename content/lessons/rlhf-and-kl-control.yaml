  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: An RLHF loop samples responses, scores them, estimates learning signals, and updates the policy; PPO-style
    constraints and reference-policy penalties address different forms of update control.
