assessment_families:
- id: rlhf-and-kl-control.base
  objective_ref: objective.rlhf-and-kl-control
  task: base
  response_type: single_choice
  points: 1
  hint: 'Measure improvement relative to expectation: trace the inputs, operation, and result before choosing.'
  remediation_scene: rlhf-and-kl-control.s2
  variants:
  - id: rlhf-and-kl-control.base.1
    prompt: Reward three minus baseline two gives advantage what?
    options:
    - id: b
      text: Five
    - id: c
      text: Negative one
    - id: a
      text: One
    answer: a
    feedback: Advantage compares outcome to an expectation.
  - id: rlhf-and-kl-control.base.2
    prompt: What does the policy assign probabilities to?
    options:
    - id: c
      text: Only training hardware types
    - id: a
      text: Generated actions such as tokens
    - id: b
      text: Only optimizer file names
    answer: a
    feedback: Language generation can be treated as a sequential policy.
- id: rlhf-and-kl-control.transfer
  objective_ref: objective.rlhf-and-kl-control
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Audit the complete loop: trace the inputs, operation, and result before choosing.'
  remediation_scene: rlhf-and-kl-control.s4
  variants:
  - id: rlhf-and-kl-control.transfer.1
    prompt: Are PPO clipping and reference KL penalties the same mechanism?
    options:
    - id: c
      text: Only if both are written in one loss
    - id: a
      text: No; they constrain different comparisons
    - id: b
      text: 'Yes'
    answer: a
    feedback: The rollout policy and reference model serve different roles.
  - id: rlhf-and-kl-control.transfer.2
    prompt: Does RLHF require a human to score every rollout live?
    options:
    - id: a
      text: No; learned reward models or other feedback signals can score rollouts
    - id: b
      text: 'Yes'
    - id: c
      text: Only if no value function exists
    answer: a
    feedback: Human feedback can be mediated through trained scoring systems.
