scenes:
- id: rlhf-and-kl-control.s1
  title: Treat generated tokens as actions
  type: explanation
  depth: intuition
  objective_refs:
  - objective.rlhf-and-kl-control
  markdown: Given a prompt, a language policy assigns probabilities to token sequences. Sample responses, obtain
    reward, and update parameters to make better-scoring behavior more likely. A value estimator or baseline can
    reduce variance by estimating expected outcomes, rather than changing the definition of the reward itself.
  text_mode: Given a prompt, a language policy assigns probabilities to token sequences. Sample responses, obtain
    reward, and update parameters to make better-scoring behavior more likely. A value estimator or baseline can
    reduce variance by estimating expected outcomes, rather than changing the definition of the reward itself.
  bridges: []
- id: rlhf-and-kl-control.s2
  title: Measure improvement relative to expectation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.rlhf-and-kl-control
  markdown: An advantage asks whether an outcome was better than an estimated baseline. In a toy example, reward
    three minus baseline two gives advantage one. Policy-gradient updates use such signals with log-probability
    derivatives; a positive signal encourages the sampled actions locally, subject to the chosen objective.
  text_mode: An advantage asks whether an outcome was better than an estimated baseline. In a toy example, reward
    three minus baseline two gives advantage one. Policy-gradient updates use such signals with log-probability
    derivatives; a positive signal encourages the sampled actions locally, subject to the chosen objective.
  bridges:
  - information-theory
- id: rlhf-and-kl-control.s3
  title: Separate two controls
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.rlhf-and-kl-control
  markdown: 'PPO-style clipping limits the surrogate incentive for large probability-ratio changes relative to the
    rollout policy. A KL penalty can discourage drifting from a reference model. These are distinct comparisons:
    the recent behavior policy and the reference checkpoint need not be the same artifact. Neither is a universal
    safety guarantee.'
  text_mode: 'PPO-style clipping limits the surrogate incentive for large probability-ratio changes relative to
    the rollout policy. A KL penalty can discourage drifting from a reference model. These are distinct comparisons:
    the recent behavior policy and the reference checkpoint need not be the same artifact. Neither is a universal
    safety guarantee.'
  bridges: []
- id: rlhf-and-kl-control.s4
  title: Audit the complete loop
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.rlhf-and-kl-control
  markdown: Rollout generation, reward scoring, value fitting, and policy updates consume resources and can become
    stale relative to each other. Monitor actual quality, reward exploitation, KL, response length, and retained
    skills. Human feedback may enter through a learned scorer rather than a human rating every training response
    live.
  text_mode: Rollout generation, reward scoring, value fitting, and policy updates consume resources and can become
    stale relative to each other. Monitor actual quality, reward exploitation, KL, response length, and retained
    skills. Human feedback may enter through a learned scorer rather than a human rating every training response
    live.
  bridges: []
- id: rlhf-and-kl-control.check
  title: Review and check your understanding
  type: assessment
