schema_version: 0.2-draft
lesson:
  id: recommendation-models
  version: 0.4.0-draft
  title: Estimate what a person may find useful
  state: draft
  summary: In 2006 Netflix offered a million dollars for better movie predictions. Learn the idea that helped win it, giving every person and every item a short taste vector, and how to judge the lists it makes.
  slot: M08.7
  category: learning
  sources:
    - title: Dive into Deep Learning — authors’ open textbook
      url: https://d2l.ai/
    - title: "Matrix Factorization Techniques for Recommender Systems (Koren, Bell & Volinsky, 2009)"
      url: https://doi.org/10.1109/MC.2009.263
    - title: "Cumulated Gain-Based Evaluation of IR Techniques (Järvelin & Kekäläinen, 2002)"
      url: https://doi.org/10.1145/582415.582418
objectives:
  - id: objective.recommendation-models
    version: 2-draft
    statement: Collaborative filtering and ranking models use interaction patterns or item content; sparse observations, cold starts, and the chosen objective shape recommendations.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - recommendation-models.base.v2
      - recommendation-models.transfer.v2
      - recommendation-models.calc.v2
    prerequisites:
      - anyOf:
          - objective.pca-and-factorization
      - anyOf:
          - objective.classification-metrics
scenes:
  - id: recommendation-models.s1
    title: A table that is 99% empty
    type: explanation
    depth: intuition
    objective_refs:
      - objective.recommendation-models
    markdown: |-
      In October 2006, Netflix released about 100 million movie ratings from roughly 480,000 customers and offered \$1 million to anyone who could predict ratings 10% more accurately than its own system. Picture those ratings as one giant table, a row per customer and a column per movie. About 99% of the cells are blank, because nobody rates more than a sliver of a catalog.

      A blank is not a dislike. It usually means the person never saw the movie. Treat blanks as one-star ratings and the model learns that everyone hates everything they haven't found yet.

      There are two broad ways to fill in blanks:

      - **Collaborative filtering** uses patterns across people. If Ben rates books much like Ana does, Ben's other favorites are good bets for Ana, even if the system knows nothing about the books themselves.
      - **Content-based** methods use descriptions of the items, such as genre, author, or cast, to find things like what you already liked.

      We'll follow a tiny version: four readers in a book club, two mysteries, two romances, and one blank. Ana has never rated *Romance 2*. Should the club recommend it to her?

      | | Mystery 1 | Mystery 2 | Romance 1 | Romance 2 |
      | --- | ---: | ---: | ---: | ---: |
      | Ana | 5 | 4 | 1 | ? |
      | Ben | 4 | 5 | 1 | 2 |
      | Cho | 1 | 2 | 5 | 4 |
      | Dev | 2 | 1 | 4 | 5 |
    bridges: []
  - id: recommendation-models.s2
    title: A taste vector for every reader and every book
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.recommendation-models
    markdown: |-
      **Matrix factorization** gives each reader a short list of numbers, a **user vector**, and each book one too, an **item vector**. The predicted rating is their dot product: multiply matching entries and add. It's the same trick as the PCA lesson, a big table rewritten as the product of two thin ones, except now most of the table is missing.

      Suppose the two numbers happened to mean "likes mysteries" and "likes romance." Ana's vector might be [2, 0.5], and *Romance 2*'s [0.2, 2]. The prediction is 2 × 0.2 + 0.5 × 2 = 1.4: a weak match, because the book scores high on the one taste Ana lacks.

      In practice nobody names the factors. The model learns whatever numbers best reproduce the ratings it has, and the factors often line up only loosely with genres. Real systems also add **bias terms**: an overall average, a per-user offset for people who rate everything high, and a per-item offset for books everyone loves.

      $$\hat r_{ui} = \mu + b_u + b_i + p_u \cdot q_i$$

      With average $\mu = 3.5$, Ana's offset $b_u = 0.2$ (she rates a little high), and the book's offset $b_i = -0.3$, the baseline guess is 3.4. With biases in the model, the vectors learn only each person's departure from that baseline, so a poor match shows up as a negative dot product: $p_u \cdot q_i = -1.5$ gives 3.4 − 1.5 = 1.9.
    bridges:
      - vectors
  - id: recommendation-models.learn
    title: Learn the vectors from the ratings you have
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.recommendation-models
    markdown: |-
      Start every vector at small random numbers. For each rated cell, compute the error $e = r - p_u \cdot q_i$, then nudge both vectors to shrink it, the gradient-descent step from earlier lessons. Blank cells contribute nothing. A small penalty keeps the vectors from growing just to memorize a few ratings.

      ```python run
      import numpy as np

      # Ratings (1-5) from four readers for two mysteries and two romances; 0 = not rated
      R = np.array([[5, 4, 1, 0],    # Ana hasn't rated Romance 2
                    [4, 5, 1, 2],    # Ben
                    [1, 2, 5, 4],    # Cho
                    [2, 1, 4, 5]],   # Dev
                   dtype=float)
      rated = R > 0

      rng = np.random.default_rng(0)
      U = rng.normal(0, 0.5, (4, 2))    # one 2-number taste vector per reader
      V = rng.normal(0, 0.5, (4, 2))    # one 2-number vector per book
      lr, lam = 0.05, 0.02              # learning rate and regularization strength

      for step in range(301):
          E = np.where(rated, R - U @ V.T, 0)          # errors on rated cells only
          if step % 100 == 0:
              loss = (E ** 2).sum() + lam * ((U ** 2).sum() + (V ** 2).sum())
              print(f"step {step:3d}: loss {loss:.3f}")
          U, V = U + lr * (E @ V - lam * U), V + lr * (E.T @ U - lam * V)

      print("predicted table:\n", np.round(U @ V.T, 1))
      print("Ana's predicted rating for Romance 2:", round(float(U[0] @ V[3]), 2))
      ```

      Ana's predicted rating for *Romance 2* is 2.03: don't recommend it. The model never compared genres. It noticed that Ana rates like Ben, and Ben gave the book a 2.

      :::predict Change Ben's rating of Romance 2 from 2 to 5. What happens to Ana's prediction?
      It jumps to 5.09 (a little past the scale, since nothing clips it). Ben is Ana's taste twin, so his opinion carries straight over. That's collaborative filtering in one number. Setting `lam` to 1.0 instead shrinks every vector, pulling all the predictions toward the middle: Ana's falls to 1.83.
      :::

      :::papers Regularized matrix factorization
      Koren, Bell, and Volinsky (2009) summarize the method as minimizing, over the set $\kappa$ of rated cells,

      $$\sum_{(u,i) \in \kappa} \left(r_{ui} - p_u \cdot q_i\right)^2 + \lambda \left(\lVert p_u \rVert^2 + \lVert q_i \rVert^2\right)$$

      with updates $p_u \leftarrow p_u + \eta\,(e_{ui}\,q_i - \lambda\,p_u)$ and $q_i \leftarrow q_i + \eta\,(e_{ui}\,p_u - \lambda\,q_i)$. In the code, $\eta$ is `lr` = 0.05 and $\lambda$ is `lam` = 0.02.
      :::

      :::story The Netflix Prize
      The prize ran from 2006 to 2009. Early on, a blogger writing as Simon Funk explained how he used this kind of factorization to climb the leaderboard, and factorization became a core ingredient for the leading teams. In 2009 the team BellKor's Pragmatic Chaos passed the 10% mark and won, with a blend of many models.
      :::
    bridges: []
  - id: recommendation-models.s3
    title: The reader with no ratings yet
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.recommendation-models
    markdown: |-
      A new member joins the club with an empty row. Factorization has no ratings to fit her vector to, so it stays meaningless noise. That's the **cold-start problem**, and new books have it too. Common fixes:

      - **Ask.** Have her rate five books at sign-up, and fit her vector to those.
      - **Use content.** Place a new book using its genre, author, and blurb until ratings arrive.
      - **Start with popular items**, then switch to personal picks as her first ratings come in.

      Popular picks are a safe start but a poor habit. Lean on them too long and the already-popular books collect all the new ratings, a loop the next lesson follows closely.
    bridges: []
  - id: recommendation-models.s4
    title: Judge the list, not the rating
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.recommendation-models
    markdown: |-
      People see a short ranked list, not predicted ratings. So hide some of each person's later ratings, recommend from earlier data only, and score the list.

      Say Ana later loved four books: B, E, F, and H. The system's top five was B, C, E, X, Y.

      - **Recall@k** is the fraction of the loved books that appear in the top k. Two of the four made the top five, so recall@5 = 2 / 4 = 0.5.
      - **nDCG** (normalized discounted cumulative gain) also rewards putting hits near the top. Each hit at position $i$ earns $1/\log_2(i+1)$: B at position 1 earns 1, and E at position 3 earns 0.5, so DCG = 1.5. The best possible list would put all four at the top, earning 1 + 0.63 + 0.5 + 0.43 = 2.56. So nDCG = 1.5 / 2.56 = 0.59.

      :::predict Swap C and E, so the list is B, E, C, X, Y. What happens to recall@5 and nDCG?
      Recall@5 stays 0.5, since the same two books are in the list. nDCG rises to 0.64, because E moved from position 3 (worth 0.5) to position 2 (worth 0.63). Recall asks what made the list; nDCG also asks how high.
      :::

      Split the data by time, training on ratings before a date and testing on those after. A random split lets next month's ratings help predict last month's, and scores look better than they will after launch.
    bridges: []
  - id: recommendation-models.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.recommendation-models
    markdown: A music app's new users, a bookshop's new titles, a leaky offline test, and several dot products and ranking scores test whether you can build a recommender and judge its lists.
    takeaway: |-
      Matrix factorization gives every user and item a short vector, learned from the ratings that exist, and predicts a blank as their dot product. Blanks aren't dislikes, new users need a fallback, and the ranked list is what you should measure.
  - id: recommendation-models.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.recommendation-models
    markdown: |-
      Recommendations can use patterns in people’s interactions or features of the items. Remember that an unobserved interaction may mean the item was never shown, not that it was disliked.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - recommendation-models.s1
        - recommendation-models.s2
        - recommendation-models.learn
        - recommendation-models.s3
        - recommendation-models.s4
        - recommendation-models.check
      gate_refs:
