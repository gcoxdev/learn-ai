  scene_aliases:
    recommendation-models.recap: recommendation-models.check
assessment_families:
  - id: recommendation-models.base
    objective_ref: objective.recommendation-models
    task: base
    response_type: single_choice
    points: 1
    hint: 'Factor a sparse preference table: trace the inputs, operation, and result before choosing.'
    remediation_scene: recommendation-models.s2
    variants:
      - id: recommendation-models.base.1
        prompt: User vector [2, 1] and item vector [1, 3] give what dot-product score?
        options:
          - id: c
            text: '3'
          - id: a
            text: '5'
          - id: b
            text: '6'
        answer: a
        feedback: 'Multiply matching coordinates and sum: 2 + 3.'
        retired: true
      - id: recommendation-models.base.2
        prompt: What is a cold-start problem?
        options:
          - id: a
            text: Limited interaction evidence for a new user or item
          - id: b
            text: Only a computer boot delay
          - id: c
            text: An absence of any possible baseline
        answer: a
        feedback: Collaborative patterns need observations that may not yet exist.
        retired: true
  - id: recommendation-models.transfer
    objective_ref: objective.recommendation-models
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate the ranking that users receive: trace the inputs, operation, and result before choosing.'
    remediation_scene: recommendation-models.s4
    variants:
      - id: recommendation-models.transfer.1
        prompt: An item has no clicks because it was never shown. Is that evidence of dislike?
        options:
          - id: a
            text: Not by itself; exposure is missing
          - id: b
            text: Yes; all unobserved pairs are negative preferences
          - id: c
            text: Only if the item is expensive
        answer: a
        feedback: Observation depends on the recommendation and exposure process.
        retired: true
      - id: recommendation-models.transfer.2
        prompt: A recommender predicts ratings well but ranks useful items poorly. What distinction matters?
        options:
          - id: b
            text: Every metric measures the same thing
          - id: c
            text: Only the number of parameters matters
          - id: a
            text: The training target and actual ranking objective differ
        answer: a
        feedback: A useful recommender must be evaluated on its delivered task.
        retired: true
  - id: recommendation-models.base.v2
    objective_ref: objective.recommendation-models
    task: base
    response_type: single_choice
    points: 1
    hint: Matrix factorization predicts a blank as the dot product of a user vector and an item vector, learned only from the cells that were actually rated.
    remediation_scene: recommendation-models.learn
    variants:
      - id: recommendation-models.base.v2.1
        prompt: When training matrix factorization, why does the loss add up errors only over the cells that have ratings?
        options:
          - id: a
            text: Adding up the blank cells would make each step too slow
          - id: c
            text: A blank means "not rated," not a rating of zero
          - id: b
            text: Blank cells already count as one-star ratings elsewhere
        answer: c
        feedback: Most blanks are items the person never saw, so scoring them as zeros would teach the model that people dislike everything new. Speed is a side benefit, not the reason.
      - id: recommendation-models.base.v2.2
        prompt: What does the regularization term λ(‖p‖² + ‖q‖²) do in matrix factorization?
        options:
          - id: a
            text: It keeps vectors small so they can't memorize a few ratings
          - id: b
            text: It rounds each prediction to the nearest whole star
          - id: c
            text: It fills each blank cell with that column's average
        answer: a
        feedback: The penalty makes large vectors costly, so the model prefers broad patterns over fitting every rating exactly. Raising λ pulls all predictions toward the middle, as the code showed.
      - id: recommendation-models.base.v2.3
        prompt: A user's vector is [2, 0], and a book's vector is [0, 3]. Their dot product is 0. What does that say?
        options:
          - id: c
            text: The user gave the book a rating of zero stars
          - id: a
            text: No one in the data has rated this book yet
          - id: b
            text: The book scores only on a factor this user doesn't weigh
        answer: b
        feedback: 2 × 0 + 0 × 3 = 0, so the book's strength lies on the second factor, which this user ignores. A dot product is a predicted match, not an observed rating.
      - id: recommendation-models.base.v2.4
        prompt: A site suggests a cookbook to you because readers whose past ratings match yours loved it, though you've never read a cookbook. Which approach is this?
        options:
          - id: b
            text: A content-based recommender that matches genres
          - id: c
            text: Collaborative filtering based on similar readers
          - id: a
            text: A popularity list showing the site's best sellers
        answer: c
        feedback: The link comes from people with similar ratings, not from the book's genre, which is what collaborative filtering uses. A content-based method would stick to genres you've read, and a popularity list ignores your ratings.
      - id: recommendation-models.base.v2.5
        prompt: Some users rate almost everything 4 or 5 stars, and others rarely give more than 3. Which part of the model handles that?
        options:
          - id: a
            text: A per-user bias term added to every prediction
          - id: c
            text: A larger λ, so every vector shrinks toward zero
          - id: b
            text: More factors in each user and item vector
        answer: a
        feedback: A user bias b_u shifts all of that user's predictions up or down, leaving the vectors free to model taste. Shrinking vectors or adding factors doesn't target a person's overall rating habit.
  - id: recommendation-models.transfer.v2
    objective_ref: objective.recommendation-models
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what evidence the model actually has. Blanks are unseen rather than disliked, new users and items need another source, and what users see is a ranked list.
    remediation_scene: recommendation-models.s4
    variants:
      - id: recommendation-models.transfer.v2.1
        prompt: A new user signs up for a music app and hasn't played anything yet. What should the app recommend first?
        options:
          - id: c
            text: Songs picked from a random starting vector for the user
          - id: b
            text: Nothing personal until the user has rated 50 songs
          - id: a
            text: Popular songs plus a quick "pick a few artists" step
        answer: a
        feedback: With no interactions, factorization has nothing to fit. Asking for a few preferences and starting from popular picks gives useful evidence quickly. A random vector gives random picks, and waiting for 50 ratings loses the user.
      - id: recommendation-models.transfer.v2.2
        prompt: A bookshop adds a new novel that nobody has rated. How can it start recommending the book sensibly?
        options:
          - id: a
            text: Hold it back from lists until ratings come in
          - id: b
            text: Use its genre, author, and blurb to find its likely readers
          - id: c
            text: Give it the mean of the book vectors so it scores middling
        answer: b
        feedback: Content features give the new book a starting place until ratings arrive. Holding it back means it never collects ratings, and an average vector recommends it weakly to everyone rather than strongly to the right readers.
      - id: recommendation-models.transfer.v2.3
        prompt: A recommender tested on a random 10% of ratings scores well offline but disappoints after launch. Which change to the evaluation would most likely have warned the team?
        options:
          - id: a
            text: Test on a larger random sample of ratings
          - id: b
            text: Report RMSE instead of recall@10
          - id: c
            text: Train on earlier ratings and test on later ones
        answer: c
        feedback: A random split lets future ratings help predict past ones, which live systems can't do. A time split mimics launch. A bigger random sample keeps the leak, and switching metrics doesn't remove it.
      - id: recommendation-models.transfer.v2.4
        prompt: A new model cuts rating error (RMSE) by 3%, but recall@10 on the same users doesn't change. What is the best reading?
        options:
          - id: c
            text: The recall calculation must contain a bug
          - id: a
            text: Better ratings on average needn't change the top ten
          - id: b
            text: Recall will catch up once the model runs longer
        answer: a
        feedback: RMSE averages over all rated cells, most of which never reach anyone's top ten. Users see the ranked list, so recall and nDCG are the measures that matter here.
      - id: recommendation-models.transfer.v2.5
        prompt: A streaming service's data show that one user has never watched a horror film. How should training treat those blank cells?
        options:
          - id: c
            text: As one-star ratings, since the user avoided horror
          - id: b
            text: As unknown, since the user may never have been shown horror
          - id: a
            text: As average ratings, so horror is neither pushed nor hidden
        answer: b
        feedback: A blank usually means "not seen," which may reflect what was shown rather than taste. Filling blanks with one star or with averages invents ratings the user never gave.
  - id: recommendation-models.calc.v2
    objective_ref: objective.recommendation-models
    task: base
    response_type: numeric
    points: 1
    hint: A dot product multiplies matching entries and adds them. Recall@k is hits in the top k over all relevant items; in nDCG a hit at position i earns 1 / log₂(i + 1).
    remediation_scene: recommendation-models.s4
    variants:
      - id: recommendation-models.calc.v2.1
        prompt: A user vector is [2, 1] and an item vector is [1.5, 3]. What is the predicted score, their dot product?
        answer: 6
        feedback: 2 × 1.5 + 1 × 3 = 3 + 3 = 6.
      - id: recommendation-models.calc.v2.2
        prompt: A model has overall average 3.5, user bias +0.5, item bias −0.3, and a dot product of 0.4. What rating does it predict? Give one decimal place.
        answer: 4.1
        feedback: 3.5 + 0.5 − 0.3 + 0.4 = 4.1.
      - id: recommendation-models.calc.v2.3
        prompt: A user later liked 4 items. Three of them appear in the system's top 5. What is recall@5? Give two decimal places.
        answer: 0.75
        feedback: Recall@5 = hits in the top 5 over all liked items = 3 / 4 = 0.75.
      - id: recommendation-models.calc.v2.4
        prompt: A user liked exactly 2 items. The top-3 list has them at positions 2 and 3, with a miss at position 1. What is nDCG@3? Give two decimal places.
        answer: 0.69
        feedback: DCG = 1/log₂3 + 1/log₂4 = 0.631 + 0.5 = 1.131. The ideal list puts both hits first, 1 + 0.631 = 1.631. nDCG = 1.131 / 1.631 ≈ 0.69.
      - id: recommendation-models.calc.v2.5
        prompt: 'One gradient step with λ = 0: the rating is 4, the user vector is [1, 1], the item vector is [1, 2], and the learning rate is 0.1. After p ← p + 0.1 × e × q, what is the user vector''s second entry? Give one decimal place.'
        answer: 1.2
        feedback: The prediction is 1 + 2 = 3, so e = 4 − 3 = 1. The second entry becomes 1 + 0.1 × 1 × 2 = 1.2.
    absolute_tolerance: 0.01
