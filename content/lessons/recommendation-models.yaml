schema_version: 0.2-draft
lesson:
  id: recommendation-models
  version: 0.1.0-draft
  title: Estimate what a person may find useful
  state: draft
  summary: Collaborative filtering and ranking models use interaction patterns or item content; sparse observations,
    cold starts, and the chosen objective shape recommendations.
  slot: M08.7
  category: learning
  minutes: 12
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.recommendation-models
  version: 1-draft
  statement: Collaborative filtering and ranking models use interaction patterns or item content; sparse observations,
    cold starts, and the chosen objective shape recommendations.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - recommendation-models.base
  - recommendation-models.transfer
  prerequisites:
  - anyOf:
    - objective.pca-and-factorization
  - anyOf:
    - objective.classification-metrics
scenes:
- id: recommendation-models.s1
  title: The observations are interactions
  type: explanation
  depth: intuition
  objective_refs:
  - objective.recommendation-models
  markdown: A recommendation table can record users, items, and ratings or clicks. Most user-item pairs are unobserved.
    An absent click may mean lack of exposure rather than dislike. The task could be rating prediction, click ranking,
    discovery, or long-term usefulness; these are different objectives.
  text_mode: A recommendation table can record users, items, and ratings or clicks. Most user-item pairs are unobserved.
    An absent click may mean lack of exposure rather than dislike. The task could be rating prediction, click ranking,
    discovery, or long-term usefulness; these are different objectives.
  bridges: []
- id: recommendation-models.s2
  title: Factor a sparse preference table
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.recommendation-models
  markdown: Matrix factorization represents a user and an item with vectors and uses their dot product as part of
    a score. User [1, 2] and item [3, 1] give score 5 before any biases. Shared factors can generalize across observed
    interactions, but the coordinate meanings are learned rather than guaranteed named interests.
  text_mode: Matrix factorization represents a user and an item with vectors and uses their dot product as part
    of a score. User [1, 2] and item [3, 1] give score 5 before any biases. Shared factors can generalize across
    observed interactions, but the coordinate meanings are learned rather than guaranteed named interests.
  bridges:
  - vectors
- id: recommendation-models.s3
  title: Handle a new user or item
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.recommendation-models
  markdown: 'Collaborative signals are weak for a new user or item: the cold-start problem. Content features, declared
    preferences, exploration, or popularity baselines can supply initial evidence. Each fallback has tradeoffs.
    Popularity can be useful while reinforcing exposure concentration.'
  text_mode: 'Collaborative signals are weak for a new user or item: the cold-start problem. Content features, declared
    preferences, exploration, or popularity baselines can supply initial evidence. Each fallback has tradeoffs.
    Popularity can be useful while reinforcing exposure concentration.'
  bridges: []
- id: recommendation-models.s4
  title: Evaluate the ranking that users receive
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.recommendation-models
  markdown: Metrics such as recall at k or discounted gain examine ranked lists, but candidate generation and exposure
    policy affect the task. Split data by time where appropriate and avoid future interactions leaking into features.
    Evaluate novelty, coverage, and user outcomes alongside immediate clicks.
  text_mode: Metrics such as recall at k or discounted gain examine ranked lists, but candidate generation and exposure
    policy affect the task. Split data by time where appropriate and avoid future interactions leaking into features.
    Evaluate novelty, coverage, and user outcomes alongside immediate clicks.
  bridges: []
- id: recommendation-models.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.recommendation-models
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Collaborative filtering and ranking models use interaction patterns or item content; sparse observations,
    cold starts, and the chosen objective shape recommendations.
- id: recommendation-models.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.recommendation-models
  markdown: Collaborative filtering and ranking models use interaction patterns or item content; sparse observations,
    cold starts, and the chosen objective shape recommendations.
  text_mode: Collaborative filtering and ranking models use interaction patterns or item content; sparse observations,
    cold starts, and the chosen objective shape recommendations.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - recommendation-models.s1
    - recommendation-models.s2
    - recommendation-models.s3
