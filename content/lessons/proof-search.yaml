schema_version: 0.2-draft
lesson:
  id: proof-search
  version: 0.3.0-draft
  title: Search for a proof or a satisfying assignment
  state: draft
  summary: Try true/false settings to satisfy some rules, then see how a proof differs from an unfinished search.
  slot: M04.4
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.proof-search
  version: 1-draft
  statement: Proof search applies formal rules, while satisfiability asks whether any interpretation meets
    the constraints; computational limits depend on the language and procedure.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - proof-search.base
  - proof-search.transfer
  prerequisites:
  - anyOf:
    - objective.first-order-logic
  - anyOf:
    - objective.search-growth
scenes:
- id: proof-search.s1
  title: A proof is a checkable sequence
  type: explanation
  depth: intuition
  objective_refs:
  - objective.proof-search
  markdown: A formal proof derives a conclusion from premises using permitted rules. Searching for a proof
    can be much harder than checking a supplied proof. Automated theorem proving separates the representation
    language, inference rules, and strategy for choosing which inference to try next.
  text_mode: A formal proof derives a conclusion from premises using permitted rules. Searching for a proof
    can be much harder than checking a supplied proof. Automated theorem proving separates the representation
    language, inference rules, and strategy for choosing which inference to try next.
  bridges: []
- id: proof-search.s2
  title: Can all the requirements hold together?
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.proof-search
  markdown: 'An **assignment** gives each letter a value of true or false. A **clause** here joins alternatives
    with OR. The **satisfiability** problem, or SAT, asks whether some assignment makes all the requirements
    true.


    Try the clauses “A OR B” and “NOT A.” Set A to false and B to true: B satisfies the first clause, and false
    A satisfies the second. Add “NOT B,” however, and there is no assignment that satisfies all three. Any
    proposed solution can be checked clause by clause.'
  text_mode: 'An **assignment** gives each letter a value of true or false. A **clause** here joins alternatives
    with OR. The **satisfiability** problem, or SAT, asks whether some assignment makes all the requirements
    true.


    Try the clauses “A OR B” and “NOT A.” Set A to false and B to true: B satisfies the first clause, and false
    A satisfies the second. Add “NOT B,” however, and there is no assignment that satisfies all three. Any
    proposed solution can be checked clause by clause.'
  bridges:
  - discrete-math
- id: proof-search.s3
  title: Resolution combines clauses
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.proof-search
  markdown: 'From “A OR B” and “NOT A OR C,” resolution can derive “B OR C.” A proof by contradiction adds
    the negation of the desired conclusion and seeks inconsistency. The empty clause represents a contradiction.
    In first-order settings, variable substitution and quantifiers make the process more involved.


    Why can we remove A in this example? If A is false, the first clause requires B. If A is true, the second
    requires C. Either way, at least one of B and C must hold. This two-case explanation is the reason for
    the resolution step; the rule is more than a symbol-shuffling trick.'
  text_mode: 'From “A OR B” and “NOT A OR C,” resolution can derive “B OR C.” A proof by contradiction adds
    the negation of the desired conclusion and seeks inconsistency. The empty clause represents a contradiction.
    In first-order settings, variable substitution and quantifiers make the process more involved.


    Why can we remove A in this example? If A is false, the first clause requires B. If A is true, the second
    requires C. Either way, at least one of B and C must hold. This two-case explanation is the reason for
    the resolution step; the rule is more than a symbol-shuffling trick.'
  bridges: []
- id: proof-search.s4
  title: An unfinished search leaves the answer open
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.proof-search
  markdown: 'A solver that runs out of time may simply need longer; it has not proved that no solution exists.
    Report “unknown” separately from a proof, a counterexample, or evidence that the requirements cannot all
    hold.


    A **decision procedure** is guaranteed to finish with the correct yes/no answer for its stated class of
    problems. Propositional satisfiability has such procedures. Unrestricted first-order validity does not
    have one that handles every possible input. This is what “undecidable in general” means; many individual
    cases can still be solved. Practical provers use specialized methods and search strategies within a resource
    budget.'
  text_mode: 'A solver that runs out of time may simply need longer; it has not proved that no solution exists.
    Report “unknown” separately from a proof, a counterexample, or evidence that the requirements cannot all
    hold.


    A **decision procedure** is guaranteed to finish with the correct yes/no answer for its stated class of
    problems. Propositional satisfiability has such procedures. Unrestricted first-order validity does not
    have one that handles every possible input. This is what “undecidable in general” means; many individual
    cases can still be solved. Practical provers use specialized methods and search strategies within a resource
    budget.'
  bridges: []
- id: proof-search.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.proof-search
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A proof shows why a conclusion follows. A satisfying assignment shows how requirements can hold
    together. Running out of search time establishes neither.
- id: proof-search.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.proof-search
  markdown: A proof shows why a conclusion follows. A satisfying assignment shows how requirements can hold
    together. Running out of search time establishes neither.
  text_mode: A proof shows why a conclusion follows. A satisfying assignment shows how requirements can hold
    together. Running out of search time establishes neither.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - proof-search.s1
    - proof-search.s2
    - proof-search.s3
    - proof-search.s4
    - proof-search.check
    gate_refs:
    - gate.core
  scene_aliases:
