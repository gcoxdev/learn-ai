schema_version: 0.2-draft
lesson:
  id: proof-search
  version: 0.1.0-draft
  title: Search for a proof or a satisfying assignment
  state: draft
  summary: Proof search applies formal rules, while satisfiability asks whether any interpretation meets the constraints;
    computational limits depend on the language and procedure.
  slot: M04.4
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.proof-search
  version: 1-draft
  statement: Proof search applies formal rules, while satisfiability asks whether any interpretation meets the constraints;
    computational limits depend on the language and procedure.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - proof-search.base
  - proof-search.transfer
  prerequisites:
  - anyOf:
    - objective.first-order-logic
  - anyOf:
    - objective.search-growth
scenes:
- id: proof-search.s1
  title: A proof is a checkable sequence
  type: explanation
  depth: intuition
  objective_refs:
  - objective.proof-search
  markdown: A formal proof derives a conclusion from premises using permitted rules. Searching for a proof can be
    much harder than checking a supplied proof. Automated theorem proving separates the representation language,
    inference rules, and strategy for choosing which inference to try next.
  text_mode: A formal proof derives a conclusion from premises using permitted rules. Searching for a proof can
    be much harder than checking a supplied proof. Automated theorem proving separates the representation language,
    inference rules, and strategy for choosing which inference to try next.
  bridges: []
- id: proof-search.s2
  title: Try a satisfiability example
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.proof-search
  markdown: The clauses “A OR B” and “NOT A” can both hold if B is true. Add “NOT B” and no assignment satisfies
    all three. SAT asks whether a propositional formula has a satisfying assignment. A returned assignment can be
    checked against every clause.
  text_mode: The clauses “A OR B” and “NOT A” can both hold if B is true. Add “NOT B” and no assignment satisfies
    all three. SAT asks whether a propositional formula has a satisfying assignment. A returned assignment can be
    checked against every clause.
  bridges:
  - discrete-math
- id: proof-search.s3
  title: Resolution combines clauses
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.proof-search
  markdown: From “A OR B” and “NOT A OR C,” resolution can derive “B OR C.” A proof by contradiction adds the negation
    of the desired conclusion and seeks inconsistency. The empty clause represents a contradiction. In first-order
    settings, variable substitution and quantifiers make the process more involved.
  text_mode: From “A OR B” and “NOT A OR C,” resolution can derive “B OR C.” A proof by contradiction adds the negation
    of the desired conclusion and seeks inconsistency. The empty clause represents a contradiction. In first-order
    settings, variable substitution and quantifiers make the process more involved.
  bridges: []
- id: proof-search.s4
  title: A timeout is not a theorem
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.proof-search
  markdown: If a solver runs out of time, it has not necessarily shown that no solution exists. Some languages admit
    decision procedures, while unrestricted first-order validity is not decidable in general. Practical provers
    use heuristics, specialized theories, and resource limits. Report proof, counterexample, unsatisfiability evidence,
    or unknown distinctly.
  text_mode: If a solver runs out of time, it has not necessarily shown that no solution exists. Some languages
    admit decision procedures, while unrestricted first-order validity is not decidable in general. Practical provers
    use heuristics, specialized theories, and resource limits. Report proof, counterexample, unsatisfiability evidence,
    or unknown distinctly.
  bridges: []
- id: proof-search.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.proof-search
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Proof search applies formal rules, while satisfiability asks whether any interpretation meets the constraints;
    computational limits depend on the language and procedure.
- id: proof-search.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.proof-search
  markdown: Proof search applies formal rules, while satisfiability asks whether any interpretation meets the constraints;
    computational limits depend on the language and procedure.
  text_mode: Proof search applies formal rules, while satisfiability asks whether any interpretation meets the constraints;
    computational limits depend on the language and procedure.
