assessment_families:
- id: features-and-bias.base
  objective_ref: objective.features-and-bias
  task: base
  response_type: single_choice
  points: 1
  hint: 'A useful assumption can narrow the search: trace the inputs, operation, and result before choosing.'
  remediation_scene: features-and-bias.s2
  variants:
  - id: features-and-bias.base.1
    prompt: What is an inductive bias?
    options:
    - id: c
      text: The test score itself
    - id: a
      text: A preference or assumption in the model or learning procedure
    - id: b
      text: Only an error caused by a malicious user
    answer: a
    feedback: Bias here describes which solutions the method favors.
    retired: true
  - id: features-and-bias.base.2
    prompt: Can rounding away detail be reversed reliably without other information?
    options:
    - id: a
      text: No; distinct inputs may become indistinguishable
    - id: b
      text: Yes; every embedding restores all details
    - id: c
      text: Only by increasing the output font
    answer: a
    feedback: Information lost by a many-to-one representation cannot be uniquely recovered.
    retired: true
- id: features-and-bias.transfer
  objective_ref: objective.features-and-bias
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Look for the shortcut: trace the inputs, operation, and result before choosing.'
  remediation_scene: features-and-bias.s4
  variants:
  - id: features-and-bias.transfer.1
    prompt: A classifier relies on a hospital watermark. What should evaluation test?
    options:
    - id: a
      text: Images where watermark and label correlations change
    - id: b
      text: Only more copies with the same watermark
    - id: c
      text: Only training loss
    answer: a
    feedback: A shifted correlation helps test whether the shortcut drives predictions.
    retired: true
  - id: features-and-bias.transfer.2
    prompt: A linear predictor receives x and x² as features. Can its output curve with respect to original x?
    options:
    - id: b
      text: No; the word linear forbids all curves
    - id: c
      text: Only if the labels are strings
    - id: a
      text: Yes; linearity in features differs from linearity in raw x
    answer: a
    feedback: Feature transformations change the function class in the original coordinates.
    retired: true
- id: features-and-bias.base.v2
  objective_ref: objective.features-and-bias
  task: base
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: features-and-bias.s3
  variants:
  - prompt: Two stripe pictures have different orientations but identical average brightness. A model sees only
      that average. Why can it not consistently distinguish this pair?
    answer: a
    options:
    - id: a
      text: Their supplied inputs are identical.
    - id: b
      text: Their images contain too few color channels to be stored.
    - id: c
      text: The model must add a larger numerical bias.
    feedback: The representation erased orientation before the model received the inputs.
    id: features-and-bias.base.v2.1
  - prompt: A delivery model receives distance in miles after being trained on kilometers. What changed?
    answer: a
    options:
    - id: b
      text: The number of entries in the training table.
    - id: c
      text: The definition of the output target from minutes to parcels.
    - id: a
      text: The interpretation and scale of an input feature.
    feedback: The distance field now uses a different unit, even if its position in the table is unchanged.
    id: features-and-bias.base.v2.2
  - prompt: Which example describes an inductive bias?
    answer: a
    options:
    - id: c
      text: Reporting a systematic disparity between social groups.
    - id: a
      text: Restricting predictions to a straight-line relationship.
    - id: b
      text: Adding 2 as a stored offset in one calculation.
    feedback: The restriction expresses a preference over possible relationships; the other examples refer to different
      meanings of bias.
    id: features-and-bias.base.v2.3
  - prompt: Does removing the +2 from a formula establish that a delivery service is fair?
    answer: a
    options:
    - id: a
      text: No; changing an offset does not evaluate treatment of people.
    - id: b
      text: Yes; the only source of unfairness is the added number.
    - id: c
      text: Yes; multiplication cannot produce unequal outcomes.
    feedback: Numerical bias and social bias name different concerns.
    id: features-and-bias.base.v2.4
- id: features-and-bias.transfer.v2
  objective_ref: objective.features-and-bias
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: features-and-bias.s5
  variants:
  - prompt: A pre-delivery predictor uses a timestamp created after arrival. Why is its evaluation misleading?
    answer: a
    options:
    - id: a
      text: The feature would not exist at the promised prediction time.
    - id: b
      text: The timestamp must be converted into a larger integer.
    - id: c
      text: Its units are more precise than distance measurements.
    feedback: This is leakage of information from after the event being predicted.
    id: features-and-bias.transfer.v2.1
  - prompt: You need to tell a horizontal stripe from a vertical stripe. Which feature change preserves the missing
      distinction?
    answer: a
    options:
    - id: b
      text: Round the average brightness to more decimal places.
    - id: c
      text: Copy the average into four identical input fields.
    - id: a
      text: Keep the position of each pixel.
    feedback: Repeated or more precise copies of the same average do not recover spatial arrangement.
    id: features-and-bias.transfer.v2.2
  - prompt: A position-based stripe classifier succeeds on its training pictures. What is a useful next test?
    answer: a
    options:
    - id: c
      text: Infer that keeping positions proves generalization.
    - id: a
      text: Evaluate new shifted stripes it did not train on.
    - id: b
      text: Show the same training pictures in a different display window.
    feedback: An informative representation still needs evidence on new cases.
    id: features-and-bias.transfer.v2.3
  - prompt: Which comparison better isolates the effect of a new input representation?
    answer: a
    options:
    - id: a
      text: Change the representation while keeping training and evaluation examples fixed.
    - id: b
      text: Change representation, examples, and scoring rule together.
    - id: c
      text: Compare scores from different targets without recording those targets.
    feedback: Controlling the examples and evaluation narrows the possible explanation for a score change.
    id: features-and-bias.transfer.v2.4
