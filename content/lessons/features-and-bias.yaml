schema_version: 0.2-draft
lesson:
  id: features-and-bias
  version: 0.4.0-draft
  title: What a representation makes easy to learn
  state: draft
  summary: A horizontal stripe and a vertical stripe look identical to a model that only sees their average brightness. See how the inputs you choose decide what a model can ever learn.
  slot: M02.3
  category: learning
  sources:
    - title: 'Dive into Deep Learning: generalization'
      url: https://d2l.ai/chapter_linear-regression/generalization.html
    - title: 'Dive into Deep Learning: linear algebra'
      url: https://d2l.ai/chapter_preliminaries/linear-algebra.html
  archetype: mechanism
objectives:
  - id: objective.features-and-bias
    version: 3-draft
    statement: Identify information removed by a feature choice and distinguish inductive assumptions, numerical bias, and evidence leakage in concrete examples.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - features-and-bias.base.v3
      - features-and-bias.transfer.v3
    prerequisites:
      - anyOf:
          - objective.digital-representations
      - anyOf:
          - objective.ai-traditions
scenes:
  - id: features-and-bias.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.features-and-bias
    title: A model only knows what you hand it
    markdown: |-
      Say you want to predict how many minutes a parcel delivery will take. The model can't look at the street or feel the parcel. It gets a short list of numbers, perhaps the distance and the parcel's weight, and nothing else.

      Each of those input numbers is a **feature**: a measured or calculated property of an example that the model receives. The answer you want predicted, here the delivery minutes, is the **target**. Choosing features is choosing what the model is allowed to know.

      Features also carry hidden agreements, like units. If a model learned from distances in feet and later receives yards, every trip looks about two-thirds shorter than it is, and its time estimates shrink to match. Nothing crashes; the answers are just quietly wrong.

      :::story A spacecraft lost to units
      In 1999, NASA lost the Mars Climate Orbiter. One team's software reported thruster data in imperial units (pound-force seconds), while the navigation software expected metric units (newton-seconds). The numbers looked perfectly reasonable, and the spacecraft flew too close to Mars. Write the unit next to every feature.
      :::
    bridges: []
  - id: features-and-bias.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.features-and-bias
    title: One number that erases the stripe
    markdown: |-
      Back to the tiny 2-by-2 pictures from the storage lesson, with 1 for white and 0 for black. Picture A has a white top row: [1, 1] over [0, 0], a horizontal stripe. Picture B has a white left column: [1, 0] over [1, 0], a vertical stripe.

      Suppose, to keep things simple, you give the model just one feature per picture: its average brightness.

      :::predict Could any model, however clever, tell A from B using only average brightness?
      No. Both pictures have two white pixels out of four, so both averages are 0.5. The model receives exactly the same input for both, so whatever it answers for A it must also answer for B. No amount of training fixes this: the difference was erased before the model saw anything.
      :::

      Run the code to compare three possible features:

      ```python run
      import numpy as np

      A = np.array([[1, 1],
                    [0, 0]])            # horizontal stripe: white top row
      B = np.array([[1, 0],
                    [1, 0]])            # vertical stripe: white left column

      # Feature 1: average brightness (one number per picture)
      print("average   A:", A.mean(), "  B:", B.mean())

      # Feature 2: white pixels in each row (two numbers per picture)
      print("row sums  A:", A.sum(axis=1), "  B:", B.sum(axis=1))

      # Feature 3: all four pixels, read row by row
      print("pixels    A:", A.flatten(), "  B:", B.flatten())
      ```

      `np.array` builds each picture as a grid of numbers. `.mean()` averages all four pixels, `.sum(axis=1)` adds across each row, and `.flatten()` lists the pixels in reading order. The averages match (0.5 and 0.5), but the row sums differ ([2 0] versus [1 1]), and so do the raw pixels. Try a third picture, a diagonal [[1, 0], [0, 1]]: which features can tell it apart from A and B?
    bridges: []
  - id: features-and-bias.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.features-and-bias
    title: Every learner comes with assumptions
    markdown: |-
      A handful of examples fits countless possible rules. To pick one, every learning method leans on built-in assumptions. That built-in preference is its **inductive bias**.

      A straight-line model, for example, assumes the target changes steadily as a feature changes: each extra mile adds the same number of minutes. That's a helpful assumption for delivery times on open roads, and a harmful one for ice cream sales, which climb with temperature and then fall off on scorching days when people stay indoors.

      You can loosen that assumption by changing the features. Give the straight-line model both the temperature and the temperature squared, and its predictions can curve up and back down.

      Features make assumptions too. Averaging the pixels assumes *where* the white pixels sit doesn't matter. That's fine for "how bright is this picture?" and fatal for "which way does the stripe run?" Convolutional networks, such as Yann LeCun's LeNet digit readers of the late 1980s and 1990s, build in the opposite assumption: the same small pattern means the same thing wherever it appears in the picture. Good assumptions let a model learn from fewer examples; wrong ones stop it learning at all.
    bridges: []
  - id: features-and-bias.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.features-and-bias
    title: Three different things called "bias"
    markdown: |-
      The word *bias* shows up in AI with three unrelated meanings, and mixing them up causes real confusion:

      | Name | What it is | Example |
      | --- | --- | --- |
      | **Bias term** | An added number in a model's formula | The +2 in y = 3x + 2, which shifts every output up by 2 |
      | **Inductive bias** | A learner's built-in assumption | "The relationship is a straight line" |
      | **Social bias** | Unfair treatment of groups of people | A loan model that turns down one neighborhood far more often |

      :::mixup "Remove the bias term and the model becomes fair."
      The +2 is just an offset, like setting a kitchen scale to start at 2 ounces. Deleting it changes every prediction by the same amount and says nothing about how different groups of people are treated. To check social bias, compare the model's actual decisions and errors across groups.
      :::
    bridges: []
  - id: features-and-bias.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.features-and-bias
    markdown: Pick features that keep the answer, spot which "bias" is meant, and catch sneaky leaks in X-ray, taxi, and subscription models.
    takeaway: |-
      A model can only learn from the information its features keep. Check what each feature erases, what assumptions come built in, and whether it would really exist at prediction time.
  - id: features-and-bias.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.features-and-bias
    markdown: |-
      Features and embeddings determine which information a model can use; inductive bias favors some patterns before the data has settled every possibility.
  - id: features-and-bias.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.features-and-bias
    title: A feature from the future
    markdown: |-
      Your delivery table has one more column: *invoice sent at*. The invoice goes out the moment a parcel is delivered. You add it as a feature, and the model's predictions become astonishingly accurate.

      :::predict Why is that accuracy too good to be true?
      The invoice time practically *is* the delivery time, and it doesn't exist yet when you need the prediction, before the parcel arrives. In testing, the model had a peek at the answer. In real use, the column is empty and the model falls apart.
      :::

      This is **data leakage**: information that wouldn't be available at prediction time sneaks into training or testing, so the test score looks better than real use will be. For every feature, ask one question: *would I actually have this value at the moment I need the prediction?*
    bridges: []
  - id: features-and-bias.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.features-and-bias
    title: Test the features, not your luck
    markdown: |-
      Jamal wants to know whether giving a stripe classifier all four pixels beats giving it only the average. He sets up a fair comparison:

      1. **Same training pictures** for both versions.
      2. **Same test pictures** for both, kept aside from training.
      3. **One change:** the input features. Everything else stays fixed.

      | Features | Test accuracy |
      | --- | ---: |
      | Average brightness only | 50% (a coin flip) |
      | All four pixels | 100% |

      Because only the features changed, the gap must come from them. Then he tries something harder: stripes in noisy, slightly gray pictures. That's the sensible next step whenever a small test looks perfect, because a representation that keeps the information gives a model the chance to learn, and new test pictures show whether it did.

      Before trusting a feature list in your own project, run the same three checks you've now seen: *What does each feature erase? What unit is it in? Would it exist at prediction time?*
    bridges: []
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - features-and-bias.s1
        - features-and-bias.s2
        - features-and-bias.s3
        - features-and-bias.s4
        - features-and-bias.s5
        - features-and-bias.s6
        - features-and-bias.check
      gate_refs:
        - gate.core
  scene_aliases:
    features-and-bias.recap: features-and-bias.check
assessment_families:
  - id: features-and-bias.base
    objective_ref: objective.features-and-bias
    task: base
    response_type: single_choice
    points: 1
    hint: 'A useful assumption can narrow the search: trace the inputs, operation, and result before choosing.'
    remediation_scene: features-and-bias.s2
    variants:
      - id: features-and-bias.base.1
        prompt: What is an inductive bias?
        options:
          - id: c
            text: The test score itself
          - id: a
            text: A preference or assumption in the model or learning procedure
          - id: b
            text: Only an error caused by a malicious user
        answer: a
        feedback: Bias here describes which solutions the method favors.
        retired: true
      - id: features-and-bias.base.2
        prompt: Can rounding away detail be reversed reliably without other information?
        options:
          - id: a
            text: No; distinct inputs may become indistinguishable
          - id: b
            text: Yes; every embedding restores all details
          - id: c
            text: Only by increasing the output font
        answer: a
        feedback: Information lost by a many-to-one representation cannot be uniquely recovered.
        retired: true
  - id: features-and-bias.transfer
    objective_ref: objective.features-and-bias
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Look for the shortcut: trace the inputs, operation, and result before choosing.'
    remediation_scene: features-and-bias.s4
    variants:
      - id: features-and-bias.transfer.1
        prompt: A classifier relies on a hospital watermark. What should evaluation test?
        options:
          - id: a
            text: Images where watermark and label correlations change
          - id: b
            text: Only more copies with the same watermark
          - id: c
            text: Only training loss
        answer: a
        feedback: A shifted correlation helps test whether the shortcut drives predictions.
        retired: true
      - id: features-and-bias.transfer.2
        prompt: A linear predictor receives x and x² as features. Can its output curve with respect to original x?
        options:
          - id: b
            text: No; the word linear forbids all curves
          - id: c
            text: Only if the labels are strings
          - id: a
            text: Yes; linearity in features differs from linearity in raw x
        answer: a
        feedback: Feature transformations change the function class in the original coordinates.
        retired: true
  - id: features-and-bias.base.v2
    objective_ref: objective.features-and-bias
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: features-and-bias.s3
    variants:
      - prompt: Two stripe pictures have different orientations but identical average brightness. A model sees only that average. Why can it not consistently distinguish this pair?
        answer: a
        options:
          - id: a
            text: Their supplied inputs are identical.
          - id: b
            text: Their images contain too few color channels to be stored.
          - id: c
            text: The model must add a larger numerical bias.
        feedback: The representation erased orientation before the model received the inputs.
        id: features-and-bias.base.v2.1
        retired: true
      - prompt: A delivery model receives distance in yards after being trained on feet. What changed?
        answer: a
        options:
          - id: b
            text: The number of entries in the training table.
          - id: c
            text: The definition of the output target from minutes to parcels.
          - id: a
            text: The interpretation and scale of an input feature.
        feedback: The distance field now uses a different unit, even if its position in the table is unchanged.
        id: features-and-bias.base.v2.2
        retired: true
      - prompt: Which example describes an inductive bias?
        answer: a
        options:
          - id: c
            text: Reporting a systematic disparity between social groups.
          - id: a
            text: Restricting predictions to a straight-line relationship.
          - id: b
            text: Adding 2 as a stored offset in one calculation.
        feedback: The restriction expresses a preference over possible relationships; the other examples refer to different meanings of bias.
        id: features-and-bias.base.v2.3
        retired: true
      - prompt: Does removing the +2 from a formula establish that a delivery service is fair?
        answer: a
        options:
          - id: a
            text: No; changing an offset does not evaluate treatment of people.
          - id: b
            text: Yes; the only source of unfairness is the added number.
          - id: c
            text: Yes; multiplication cannot produce unequal outcomes.
        feedback: Numerical bias and social bias name different concerns.
        id: features-and-bias.base.v2.4
        retired: true
  - id: features-and-bias.transfer.v2
    objective_ref: objective.features-and-bias
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: features-and-bias.s5
    variants:
      - prompt: A pre-delivery predictor uses a timestamp created after arrival. Why is its evaluation misleading?
        answer: a
        options:
          - id: a
            text: The feature would not exist at the promised prediction time.
          - id: b
            text: The timestamp must be converted into a larger integer.
          - id: c
            text: Its units are more precise than distance measurements.
        feedback: This is leakage of information from after the event being predicted.
        id: features-and-bias.transfer.v2.1
        retired: true
      - prompt: You need to tell a horizontal stripe from a vertical stripe. Which feature change preserves the missing distinction?
        answer: a
        options:
          - id: b
            text: Round the average brightness to more decimal places.
          - id: c
            text: Copy the average into four identical input fields.
          - id: a
            text: Keep the position of each pixel.
        feedback: Repeated or more precise copies of the same average do not recover spatial arrangement.
        id: features-and-bias.transfer.v2.2
        retired: true
      - prompt: A position-based stripe classifier succeeds on its training pictures. What is a useful next test?
        answer: a
        options:
          - id: c
            text: Infer that keeping positions proves generalization.
          - id: a
            text: Evaluate new shifted stripes it did not train on.
          - id: b
            text: Show the same training pictures in a different display window.
        feedback: An informative representation still needs evidence on new cases.
        id: features-and-bias.transfer.v2.3
        retired: true
      - prompt: Which comparison better isolates the effect of a new input representation?
        answer: a
        options:
          - id: a
            text: Change the representation while keeping training and evaluation examples fixed.
          - id: b
            text: Change representation, examples, and scoring rule together.
          - id: c
            text: Compare scores from different targets without recording those targets.
        feedback: Controlling the examples and evaluation narrows the possible explanation for a score change.
        id: features-and-bias.transfer.v2.4
        retired: true
  - id: features-and-bias.base.v3
    objective_ref: objective.features-and-bias
    task: base
    response_type: single_choice
    points: 1
    hint: Compare the actual numbers each example hands the model. If two different examples produce identical features, no model can separate them. And ask which of the three meanings of "bias" is in play.
    remediation_scene: features-and-bias.s2
    variants:
      - id: features-and-bias.base.v3.1
        prompt: A stripe classifier receives only each picture's average brightness. It keeps confusing the horizontal stripe [1, 1, 0, 0] with the vertical stripe [1, 0, 1, 0]. Why?
        options:
          - id: a
            text: It needs many more training pictures of each stripe
          - id: b
            text: Both pictures give it exactly the same input, 0.5
          - id: c
            text: Its bias term is too small to push the two apart
        answer: b
        feedback: Both pictures average 0.5, so the model receives identical inputs and must give identical outputs. More training can't recover a difference the feature already erased, and the bias term shifts both outputs equally.
      - id: features-and-bias.base.v3.2
        prompt: Which single feature still tells the horizontal stripe [1, 1, 0, 0] apart from the vertical stripe [1, 0, 1, 0]?
        options:
          - id: a
            text: The total number of white pixels in the picture
          - id: b
            text: The average brightness, kept to four decimal places
          - id: c
            text: The number of white pixels in the top row
        answer: c
        feedback: The top row holds 2 white pixels in the horizontal stripe and 1 in the vertical one, so this feature differs. The total (2 and 2) and the average (0.5 and 0.5) are the same for both, however precisely you record them.
      - id: features-and-bias.base.v3.3
        prompt: Which of these is an example of inductive bias?
        options:
          - id: a
            text: Assuming the target rises steadily, in a straight line
          - id: b
            text: The +2 added to every output in y = 3x + 2
          - id: c
            text: A loan model that turns down one group more often
        answer: a
        feedback: An inductive bias is a learner's built-in assumption, like "the relationship is a straight line." The +2 is a bias term (an offset), and unequal loan decisions are social bias.
      - id: features-and-bias.base.v3.4
        prompt: To make a hiring model fair, a student deletes the +2 from its formula y = 3x + 2. What has the student mixed up?
        options:
          - id: b
            text: Nothing; the +2 was the model's unfairness, now removed
          - id: c
            text: The +2 is the inductive bias, which should be kept
          - id: a
            text: The +2 is a bias term, which is not the same as unfairness
        answer: a
        feedback: The +2 is an offset that shifts every prediction equally, so removing it tells you nothing about how groups of people are treated. It isn't an inductive bias either; that's a built-in assumption such as "straight line." Fairness is checked by comparing decisions across groups.
      - id: features-and-bias.base.v3.5
        prompt: A delivery-time model learned from distances in feet. A new app sends it distances in yards. What happens to its predictions?
        options:
          - id: c
            text: They come out too short, since every trip looks shorter
          - id: a
            text: They stay correct, since a distance is a distance
          - id: b
            text: They stop, since the input no longer has the right shape
        answer: c
        feedback: A 300-foot trip arrives as 100, so the model treats it as a shorter trip and predicts fewer minutes. The input still has the right shape, so nothing crashes; the answers are just quietly wrong.
  - id: features-and-bias.transfer.v3
    objective_ref: objective.features-and-bias
    task: transfer
    response_type: single_choice
    points: 1
    hint: For each feature, ask whether you would really have it at the moment of prediction, and whether it carries the information that matters or a shortcut that happens to go along with it.
    remediation_scene: features-and-bias.s5
    variants:
      - id: features-and-bias.transfer.v3.1
        prompt: A model predicts which customers will cancel a subscription next month. Its best feature is "cancellation reason," a field filled in when a customer cancels. What is wrong?
        options:
          - id: a
            text: The field is text, so it must be turned into numbers first
          - id: b
            text: The field only exists after the event being predicted
          - id: c
            text: The field is empty for most customers, so it's too sparse
        answer: b
        feedback: This is data leakage. A cancellation reason only appears once someone has cancelled, so it gives away the answer in testing and is missing in real use. Converting text or handling empty values doesn't fix a feature from the future.
      - id: features-and-bias.transfer.v3.2
        prompt: A taxi app must quote a fare before the ride starts. Which feature is safe to use?
        options:
          - id: a
            text: The ride's actual duration in minutes
          - id: b
            text: The tip the passenger left afterward
          - id: c
            text: The map distance from pickup to drop-off
        answer: c
        feedback: The map distance is known before the ride. The actual duration and the tip only exist afterward, so training on them would leak the answer and make test scores look better than real quotes will be.
      - id: features-and-bias.transfer.v3.3
        prompt: A pneumonia detector scores very well on chest X-rays. Most of the sick patients' scans came from one hospital whose scanner stamps a logo in the corner. Which test tells you the most?
        options:
          - id: b
            text: Check it on X-rays from other hospitals, without that logo
          - id: a
            text: Check it on more X-rays from that same hospital's scanner
          - id: c
            text: Check its accuracy on the training X-rays a second time
        answer: b
        feedback: The model might be spotting the logo rather than the illness. On scans from other hospitals, the logo no longer goes along with pneumonia, so a shortcut would be exposed. More scans from the same source keep the shortcut working.
      - id: features-and-bias.transfer.v3.4
        prompt: A straight-line model predicts ice cream sales from temperature, but sales actually rise and then fall on very hot days. Which change lets its predictions curve?
        options:
          - id: a
            text: Add temperature squared as a second feature
          - id: b
            text: Train the same straight-line model for longer
          - id: c
            text: Increase the added number in its formula
        answer: a
        feedback: A straight line can't bend however long it trains; that's its inductive bias. Adding temperature squared as a feature lets the weighted sum trace a curve. A bigger added number just shifts the line up.
      - id: features-and-bias.transfer.v3.5
        prompt: A song-mood model receives only each song's average loudness. One song builds from quiet to loud; another starts loud and fades away. Both have the same average. What follows?
        options:
          - id: c
            text: It can separate them once it has enough examples
          - id: b
            text: It can separate them if its bias term is adjusted
          - id: a
            text: It gets identical inputs, so it can't separate them
        answer: a
        feedback: Averaging erased the order of loud and quiet, just as averaging pixels erased the stripe's direction. Identical inputs force identical outputs, whatever the training or offset. Keeping loudness over time would preserve the difference.
      - id: features-and-bias.transfer.v3.6
        prompt: You want to know whether giving a model every pixel, instead of an average, really helps. Which experiment answers that?
        options:
          - id: b
            text: Switch to every pixel and a bigger model, then test on new pictures
          - id: c
            text: Compare the new score with last year's score on a different test
          - id: a
            text: Keep the pictures and test set fixed, and change only the features
        answer: a
        feedback: Changing one thing at a time means any difference in score comes from the features. Changing the model size too, or comparing against a different test set, mixes several causes together.
