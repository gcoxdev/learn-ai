schema_version: 0.2-draft
lesson:
  id: features-and-bias
  version: 0.2.0-draft
  title: What a representation makes easy to learn
  state: draft
  summary: Choose what a model can see, discover information lost by a representation, and distinguish useful assumptions
    from misleading shortcuts.
  slot: M02.3
  category: learning
  minutes: 12
  sources:
  - title: 'Dive into Deep Learning: generalization'
    url: https://d2l.ai/chapter_linear-regression/generalization.html
  - title: 'Dive into Deep Learning: linear algebra'
    url: https://d2l.ai/chapter_preliminaries/linear-algebra.html
  archetype: mechanism
objectives:
- id: objective.features-and-bias
  version: 2-draft
  statement: Identify information removed by a feature choice and distinguish inductive assumptions, numerical bias,
    and evidence leakage in concrete examples.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - features-and-bias.base.v2
  - features-and-bias.transfer.v2
  prerequisites:
  - anyOf:
    - objective.digital-representations
  - anyOf:
    - objective.ai-traditions
scenes:
- id: features-and-bias.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.features-and-bias
  title: Choose what the model gets to see
  markdown: 'A **feature** is a recorded or computed property supplied to a model. To predict parcel delivery time,
    we might supply distance and parcel weight. The answer we want to predict is the **target**, here the number
    of delivery minutes.


    Feature design asks what information to provide and how to express it. Distance in kilometers and distance in
    miles describe the same quantity using different numbers. A model trained for one convention can receive misleading
    inputs under the other. Write down units and what is available at the moment of prediction, before selecting
    a complicated model.'
  text_mode: 'A **feature** is a recorded or computed property supplied to a model. To predict parcel delivery time,
    we might supply distance and parcel weight. The answer we want to predict is the **target**, here the number
    of delivery minutes.


    Feature design asks what information to provide and how to express it. Distance in kilometers and distance in
    miles describe the same quantity using different numbers. A model trained for one convention can receive misleading
    inputs under the other. Write down units and what is available at the moment of prediction, before selecting
    a complicated model.'
  bridges: []
- id: features-and-bias.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.features-and-bias
  title: A useful summary can erase the answer
  markdown: 'Imagine two tiny black-and-white pictures. Picture A has top row [1, 1] and bottom row [0, 0]. Picture
    B has top row [1, 0] and bottom row [1, 0]. Let 1 mean white and 0 mean black.


    Both have two white pixels out of four, so both have average brightness 0.5. But A contains a horizontal white
    stripe and B a vertical one. If the model receives only average brightness, it receives exactly the same input
    for both pictures. No choice of weights can reliably distinguish these two cases from that feature alone.'
  text_mode: 'Imagine two tiny black-and-white pictures. Picture A has top row [1, 1] and bottom row [0, 0]. Picture
    B has top row [1, 0] and bottom row [1, 0]. Let 1 mean white and 0 mean black.


    Both have two white pixels out of four, so both have average brightness 0.5. But A contains a horizontal white
    stripe and B a vertical one. If the model receives only average brightness, it receives exactly the same input
    for both pictures. No choice of weights can reliably distinguish these two cases from that feature alone.'
  bridges: []
- id: features-and-bias.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.features-and-bias
  title: The assumptions that make learning possible
  markdown: 'An **inductive bias** is an assumption or preference that helps a learning method choose among explanations
    compatible with its examples. A straight-line predictor prefers relationships expressible as a weighted sum.
    That is useful when a roughly straight trend is reasonable, and restrictive when the task requires a different
    shape.


    Keeping pixel positions allows the stripe task to remain possible. Discarding positions assumes they are irrelevant.
    That assumption can be useful for estimating overall brightness but harmful for recognizing orientation. Features
    and model design both influence which patterns are easy to learn.'
  text_mode: 'An **inductive bias** is an assumption or preference that helps a learning method choose among explanations
    compatible with its examples. A straight-line predictor prefers relationships expressible as a weighted sum.
    That is useful when a roughly straight trend is reasonable, and restrictive when the task requires a different
    shape.


    Keeping pixel positions allows the stripe task to remain possible. Discarding positions assumes they are irrelevant.
    That assumption can be useful for estimating overall brightness but harmful for recognizing orientation. Features
    and model design both influence which patterns are easy to learn.'
  bridges: []
- id: features-and-bias.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.features-and-bias
  title: Three meanings that share the word bias
  markdown: 'A model’s **numerical bias** can mean an adjustable added number, such as the +2 in y = 3x + 2. It
    shifts an output even when the input is zero.


    An **inductive bias** is a preference in how a learner searches for patterns, such as favoring a straight line.
    **Social bias** concerns systematic unfairness affecting people. These are related topics in some applications,
    but the words are not interchangeable. Removing a numerical bias term does not establish fairness; adding more
    varied data does not remove every assumption made by the model’s architecture.'
  text_mode: 'A model’s **numerical bias** can mean an adjustable added number, such as the +2 in y = 3x + 2. It
    shifts an output even when the input is zero.


    An **inductive bias** is a preference in how a learner searches for patterns, such as favoring a straight line.
    **Social bias** concerns systematic unfairness affecting people. These are related topics in some applications,
    but the words are not interchangeable. Removing a numerical bias term does not establish fairness; adding more
    varied data does not remove every assumption made by the model’s architecture.'
  bridges: []
- id: features-and-bias.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.features-and-bias
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: A representation decides what information reaches a model. Learning cannot recover a distinction that
    the supplied features have erased.
- id: features-and-bias.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.features-and-bias
  markdown: Features and embeddings determine which information a model can use; inductive bias favors some patterns
    before the data has settled every possibility.
  text_mode: Features and embeddings determine which information a model can use; inductive bias favors some patterns
    before the data has settled every possibility.
- id: features-and-bias.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.features-and-bias
  title: A shortcut that disappears at prediction time
  markdown: 'Suppose our delivery table includes “final invoice issued at,” which is recorded after a parcel arrives.
    During training, it may reveal when delivery finished. During a real prediction before arrival, it does not
    exist yet. Supplying it in an evaluation gives the model information it would not have when used.


    This is **data leakage**: information improperly crosses the boundary separating what the learner may know from
    what the evaluation is supposed to test. A seemingly excellent score can then reflect the shortcut. A feature
    can be numerically valid and still be inappropriate for the prediction task.'
  text_mode: 'Suppose our delivery table includes “final invoice issued at,” which is recorded after a parcel arrives.
    During training, it may reveal when delivery finished. During a real prediction before arrival, it does not
    exist yet. Supplying it in an evaluation gives the model information it would not have when used.


    This is **data leakage**: information improperly crosses the boundary separating what the learner may know from
    what the evaluation is supposed to test. A seemingly excellent score can then reflect the shortcut. A feature
    can be numerically valid and still be inappropriate for the prediction task.'
  bridges: []
- id: features-and-bias.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.features-and-bias
  title: Design a comparison that tests the representation
  markdown: 'To investigate the stripe task, compare two input designs: average brightness alone versus all four
    pixel positions. Use the same training examples and evaluation cases so the comparison focuses on the changed
    representation.


    Then test new pictures, including shifted or noisy stripes. Preserving positions makes a distinction possible;
    it does not guarantee the model learns a rule that works on every new arrangement. Record both what information
    was available and what the tests establish. For deliveries, also check units, missing measurements, and whether
    each feature existed before the promised prediction time.'
  text_mode: 'To investigate the stripe task, compare two input designs: average brightness alone versus all four
    pixel positions. Use the same training examples and evaluation cases so the comparison focuses on the changed
    representation.


    Then test new pictures, including shifted or noisy stripes. Preserving positions makes a distinction possible;
    it does not guarantee the model learns a rule that works on every new arrangement. Record both what information
    was available and what the tests establish. For deliveries, also check units, missing measurements, and whether
    each feature existed before the promised prediction time.'
  bridges: []
