assessment_families:
- id: features-and-bias.base
  objective_ref: objective.features-and-bias
  task: base
  response_type: single_choice
  points: 1
  hint: 'A useful assumption can narrow the search: trace the inputs, operation, and result before choosing.'
  remediation_scene: features-and-bias.s2
  variants:
  - id: features-and-bias.base.1
    prompt: What is an inductive bias?
    options:
    - id: c
      text: The test score itself
    - id: a
      text: A preference or assumption in the model or learning procedure
    - id: b
      text: Only an error caused by a malicious user
    answer: a
    feedback: Bias here describes which solutions the method favors.
  - id: features-and-bias.base.2
    prompt: Can rounding away detail be reversed reliably without other information?
    options:
    - id: a
      text: No; distinct inputs may become indistinguishable
    - id: b
      text: Yes; every embedding restores all details
    - id: c
      text: Only by increasing the output font
    answer: a
    feedback: Information lost by a many-to-one representation cannot be uniquely recovered.
- id: features-and-bias.transfer
  objective_ref: objective.features-and-bias
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Look for the shortcut: trace the inputs, operation, and result before choosing.'
  remediation_scene: features-and-bias.s4
  variants:
  - id: features-and-bias.transfer.1
    prompt: A classifier relies on a hospital watermark. What should evaluation test?
    options:
    - id: a
      text: Images where watermark and label correlations change
    - id: b
      text: Only more copies with the same watermark
    - id: c
      text: Only training loss
    answer: a
    feedback: A shifted correlation helps test whether the shortcut drives predictions.
  - id: features-and-bias.transfer.2
    prompt: A linear predictor receives x and x² as features. Can its output curve with respect to original x?
    options:
    - id: b
      text: No; the word linear forbids all curves
    - id: c
      text: Only if the labels are strings
    - id: a
      text: Yes; linearity in features differs from linearity in raw x
    answer: a
    feedback: Feature transformations change the function class in the original coordinates.
