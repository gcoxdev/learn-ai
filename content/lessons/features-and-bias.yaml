schema_version: 0.2-draft
lesson:
  id: features-and-bias
  version: 0.1.0-draft
  title: What a representation makes easy to learn
  state: draft
  summary: Features and embeddings determine which information a model can use; inductive bias favors some patterns
    before the data has settled every possibility.
  slot: M02.3
  category: learning
  minutes: 12
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.features-and-bias
  version: 1-draft
  statement: Features and embeddings determine which information a model can use; inductive bias favors some patterns
    before the data has settled every possibility.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - features-and-bias.base
  - features-and-bias.transfer
  prerequisites:
  - anyOf:
    - objective.digital-representations
  - anyOf:
    - objective.ai-traditions
scenes:
- id: features-and-bias.s1
  title: A feature is a chosen view
  type: explanation
  depth: intuition
  objective_refs:
  - objective.features-and-bias
  markdown: A housing predictor might receive floor area, age, and location. Those features summarize a property
    but omit many details. An embedding is a learned numerical representation, often dense. Representations can
    be designed by people or learned from an objective; either way, they influence what distinctions remain available.
  text_mode: A housing predictor might receive floor area, age, and location. Those features summarize a property
    but omit many details. An embedding is a learned numerical representation, often dense. Representations can
    be designed by people or learned from an objective; either way, they influence what distinctions remain available.
  bridges: []
- id: features-and-bias.s2
  title: A useful assumption can narrow the search
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.features-and-bias
  markdown: Inductive bias is a preference built into a model or learning procedure. A linear predictor favors additive
    relationships. A convolution reuses local filters across positions. These assumptions can improve learning when
    they fit the task, but can make other relationships harder to capture.
  text_mode: Inductive bias is a preference built into a model or learning procedure. A linear predictor favors
    additive relationships. A convolution reuses local filters across positions. These assumptions can improve learning
    when they fit the task, but can make other relationships harder to capture.
  bridges: []
- id: features-and-bias.s3
  title: A small feature change alters the task
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.features-and-bias
  markdown: Suppose a classifier sees only a person’s rounded age. Ages 20.1 and 20.9 both become 20, so no later
    deterministic computation can recover which exact value was supplied. Conversely, adding a squared input feature
    lets a linear model in feature space express a curved relationship in the original input.
  text_mode: Suppose a classifier sees only a person’s rounded age. Ages 20.1 and 20.9 both become 20, so no later
    deterministic computation can recover which exact value was supplied. Conversely, adding a squared input feature
    lets a linear model in feature space express a curved relationship in the original input.
  bridges: []
- id: features-and-bias.s4
  title: Look for the shortcut
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.features-and-bias
  markdown: A model may use a watermark correlated with labels instead of the object itself. High accuracy on similarly
    collected data does not show the intended representation was learned. Compare counterexamples and changed environments.
    Better features are task-dependent; a lower-dimensional vector is not automatically more meaningful or fair.
  text_mode: A model may use a watermark correlated with labels instead of the object itself. High accuracy on similarly
    collected data does not show the intended representation was learned. Compare counterexamples and changed environments.
    Better features are task-dependent; a lower-dimensional vector is not automatically more meaningful or fair.
  bridges: []
- id: features-and-bias.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.features-and-bias
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: features-and-bias.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.features-and-bias
  markdown: Features and embeddings determine which information a model can use; inductive bias favors some patterns
    before the data has settled every possibility.
  text_mode: Features and embeddings determine which information a model can use; inductive bias favors some patterns
