schema_version: 0.2-draft
lesson:
  id: symbolic-neural-boundaries
  version: 0.4.0-draft
  title: Combine explicit knowledge with learned perception
  state: draft
  summary: '"Keep the hall lit at night, but don''t wake the baby." A language model writes the rules, a checker vets them, a camera feeds them facts. See where this partnership shines, and where it breaks.'
  slot: M04.8
  category: learning
  sources:
    - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
      url: https://aima.cs.berkeley.edu/
objectives:
  - id: objective.symbolic-neural-boundaries
    version: 2-draft
    statement: Symbolic and neural components can complement each other when interfaces preserve uncertainty, grounding, constraints, and the limits of each representation.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - symbolic-neural-boundaries.base.v2
      - symbolic-neural-boundaries.transfer.v2
      - symbolic-neural-boundaries.calc
    prerequisites:
      - anyOf:
          - objective.knowledge-graphs
      - anyOf:
          - objective.defaults-and-exceptions
      - anyOf:
          - objective.features-and-bias
scenes:
  - id: symbolic-neural-boundaries.s1
    title: Two kinds of smart in one house
    type: explanation
    depth: intuition
    objective_refs:
      - objective.symbolic-neural-boundaries
    markdown: |-
      Back to the smart home from the start of this module. This time you don't write rules. You just say: *"Keep the hallway lit at night, but don't wake the baby."* A language model turns that into candidate rules. A checker makes sure they're well-formed and safe. The rule engine runs them, fed by facts from a camera whose detector is a neural network.

      Each part does what it's good at:

      | | Learned (neural) parts | Symbolic parts |
      | --- | --- | --- |
      | Strong at | messy input: speech, photos, vague requests | exact rules, proofs, checkable steps |
      | Weak at | guarantees; they can be confidently wrong | anything nobody wrote down |
      | Fixing a mistake | retrain on more examples | edit one rule |
      | In this house | language model, camera detector | checker, rule engine |

      A system that combines the two is often called **neurosymbolic**. The interesting part is the boundary: each arrow below that crosses from one kind of part to the other is a place where meaning can be lost.
    diagram:
      caption: A neurosymbolic smart home. Learned parts propose and perceive; symbolic parts check and act.
      description: Your spoken request goes to a language model, which proposes rules to a checker. The checker sends rejected rules back to the model with a reason, and passes accepted rules to the rule engine. Separately, the camera detector sends detections to a grounding check, which applies a confidence threshold and records the source and time before passing facts to the rule engine. The rule engine controls the lights.
      nodes:
        - id: voice
          label: Your request
          note: don't wake the baby
          col: 0
          row: 0
        - id: llm
          label: Language model
          note: proposes rules
          col: 1
          row: 0
          tone: accent
        - id: checker
          label: Rule checker
          note: form, names, safety
          col: 2
          row: 0
          tone: warn
        - id: engine
          label: Rule engine
          col: 3
          row: 1
        - id: lights
          label: Lights
          col: 4
          row: 1
        - id: camera
          label: Camera detector
          note: neural network
          col: 0
          row: 2
          tone: accent
        - id: ground
          label: Grounding check
          note: threshold, source, time
          col: 2
          row: 2
          tone: warn
      edges:
        - from: voice
          to: llm
        - from: llm
          to: checker
          label: proposed rule
          bend: 1
        - from: checker
          to: llm
          label: rejected, with reason
          dashed: true
          bend: 1
        - from: checker
          to: engine
          label: accepted rule
        - from: camera
          to: ground
          label: detection
        - from: ground
          to: engine
          label: fact
        - from: engine
          to: lights
    bridges: []
  - id: symbolic-neural-boundaries.s2
    title: 'Grounding: where does "motion" come from?'
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.symbolic-neural-boundaries
    markdown: |-
      The rule engine reasons about the symbol `motion(hallway)`, but the camera doesn't output symbols. Its detector outputs something like "person, confidence 0.62." Connecting a symbol to the evidence that makes it true or false is called **grounding**. (Stevan Harnad named the general puzzle, how symbols get their meaning, the *symbol grounding problem* in 1990.)

      The simplest grounding step is a threshold. Say the house asserts `motion(hallway)` only when the confidence is at or above 0.8:

      | Time | Detector output | Confidence | Asserted as a fact? |
      | --- | --- | ---: | --- |
      | 22:14 | person | 0.97 | yes |
      | 01:40 | person | 0.62 | no: kept as a *possible* sighting |
      | 03:12 | cat | 0.88 | yes, if cats count as motion |

      :::predict You lower the threshold to 0.6. What changes, and what's the risk?
      The 01:40 sighting becomes a fact, so the light turns on. If it was a real person, good. If it was a shadow, the baby wakes. A lower threshold trades missed motion for false alarms.
      :::

      Store each fact with its **provenance**, the record of where it came from: `{fact: motion(hallway), source: camera_2, time: 01:40, confidence: 0.62}`. Then a later step can weigh it, trace it, or ask a second sensor before acting.
    bridges: []
  - id: symbolic-neural-boundaries.s3
    title: Trace a failure across the boundary
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.symbolic-neural-boundaries
    markdown: |-
      At 03:00 a car's headlights sweep across the hall mirror. The hallway light snaps on and your phone buzzes: *"Motion while everyone is asleep."* Walk the chain:

      | Step | Input | Output | Correct? |
      | --- | --- | --- | --- |
      | Detector | photo with a bright reflection | person, 0.85 | **no** |
      | Grounding | 0.85 ≥ 0.8 | motion(hallway) | followed its rule, got a false fact |
      | Rule engine | motion, night | light on, alert | yes, given its facts |

      The rules did exactly what they said. The error entered at the detector and passed through grounding unchallenged. So fix it there: require the camera *and* the motion sensor to agree, or retrain the detector on reflections.

      :::mixup "The decisions come from logic rules, so they're certain."
      The rules are certain *about their inputs*. When a learned component supplies those inputs, its mistakes flow straight through the logic. Diagnose from the first step of the chain, not the last.
      :::
    bridges: []
  - id: symbolic-neural-boundaries.s4
    title: The model proposes, the checker verifies
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.symbolic-neural-boundaries
    markdown: |-
      Now the other boundary. The language model is good at turning "don't wake the baby" into something rule-shaped, but it can misspell a name or propose something unsafe. A symbolic checker catches those:

      ```python run
      proposals = [                      # pretend a language model wrote these
          "IF motion AND night THEN hall_light_on",
          "IF night THEN front_door_unlock",
          "IF motion AND night THEN hall_ligth_on",
          "IF baby_asleep AND night THEN hall_light_dim",
          "turn the lights on when it gets dark",
      ]
      known = {"motion", "night", "baby_asleep", "hall_light_on",
               "hall_light_dim", "front_door_unlock"}
      forbidden = {"front_door_unlock"}  # safety policy: never automate this

      def check(rule):
          if not rule.startswith("IF ") or " THEN " not in rule:
              return "rejected: not in IF ... THEN ... form"
          cond, action = rule[3:].split(" THEN ")
          for name in cond.split(" AND ") + [action]:
              if name not in known:
                  return f"rejected: unknown name '{name}'"
          if action in forbidden:
              return "rejected: breaks the safety policy"
          return "accepted"

      for rule in proposals:
          print(f"{check(rule):40} {rule}")
      ```

      Two of five pass, and each rejection gives the model a reason to try again. The checker covers form, names, and one safety policy. Both accepted rules can fire together (full light *and* dimmed light while the baby sleeps), and nothing here checks that. A checker verifies exactly what you wrote into it, so add a check for each property you care about, such as "no two accepted rules act on the same light."

      The same pattern drives some of the most striking recent results:

      | System | The learned part proposes | The symbolic part checks |
      | --- | --- | --- |
      | AlphaCode (DeepMind, 2022) | candidate programs | running them on example tests |
      | FunSearch (DeepMind, 2023) | small programs for math problems | an evaluator that scores each one |
      | AlphaGeometry (DeepMind, 2024) | helpful extra points and lines | a deduction engine that finishes the proof |
      | AlphaProof (DeepMind, 2024) | proof steps | the Lean proof checker |

      AlphaGeometry solved 25 of 30 olympiad geometry problems in its test set, and AlphaProof with AlphaGeometry 2 reached silver-medal standard at the 2024 International Mathematical Olympiad.
    bridges: []
  - id: symbolic-neural-boundaries.module-map
    title: What this module gave you
    type: explanation
    depth: intuition
    objective_refs:
      - objective.symbolic-neural-boundaries
    markdown: |-
      Every idea in this module is still at work, often next to a neural network:

      | Lesson idea | Where it lives today |
      | --- | --- |
      | Truth tables and SAT | chip verification, package installers |
      | Rules and chaining | tax, insurance, and smart-home engines |
      | Knowledge graphs | Wikidata, search-engine fact panels |
      | Proof checking | Lean checking AI-written proofs |
      | Program synthesis | Flash Fill, code assistants plus tests |

      When you meet a new AI system, ask the question this lesson practiced: which parts learn, which parts check, and what exactly crosses the boundary between them?
    bridges: []
  - id: symbolic-neural-boundaries.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.symbolic-neural-boundaries
    markdown: Proof checkers, warehouse robots, form readers, and a few detector thresholds test whether you can find where an error crossed the boundary and what a check really covers.
    takeaway: |-
      Learned parts perceive and propose; symbolic parts check and act on exact rules. Ground each symbol in evidence with its source and confidence, and remember that a checker verifies only the properties you wrote into it.
  - id: symbolic-neural-boundaries.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.symbolic-neural-boundaries
    markdown: |-
      A learned detector and a rule-based planner can work together. Keep the observations, uncertainty, and meaning of each symbol clear as information passes between them.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - symbolic-neural-boundaries.s1
        - symbolic-neural-boundaries.s2
        - symbolic-neural-boundaries.s3
        - symbolic-neural-boundaries.s4
        - symbolic-neural-boundaries.module-map
