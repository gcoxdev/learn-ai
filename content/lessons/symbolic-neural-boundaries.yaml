schema_version: 0.2-draft
lesson:
  id: symbolic-neural-boundaries
  version: 0.1.0-draft
  title: Combine explicit knowledge with learned perception
  state: draft
  summary: Symbolic and neural components can complement each other when interfaces preserve uncertainty, grounding,
    constraints, and the limits of each representation.
  slot: M04.8
  category: learning
  minutes: 12
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.symbolic-neural-boundaries
  version: 1-draft
  statement: Symbolic and neural components can complement each other when interfaces preserve uncertainty, grounding,
    constraints, and the limits of each representation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - symbolic-neural-boundaries.base
  - symbolic-neural-boundaries.transfer
  prerequisites:
  - anyOf:
    - objective.knowledge-graphs
  - anyOf:
    - objective.defaults-and-exceptions
  - anyOf:
    - objective.features-and-bias
scenes:
- id: symbolic-neural-boundaries.s1
  title: Different components can answer different questions
  type: explanation
  depth: intuition
  objective_refs:
  - objective.symbolic-neural-boundaries
  markdown: A vision model estimates which objects are present. A rule system checks whether a represented arrangement
    satisfies a requirement. A planner searches possible actions. Combining them can make a useful system, but a
    correct rule cannot compensate automatically for a mistaken object label.
  text_mode: A vision model estimates which objects are present. A rule system checks whether a represented arrangement
    satisfies a requirement. A planner searches possible actions. Combining them can make a useful system, but a
    correct rule cannot compensate automatically for a mistaken object label.
  bridges: []
- id: symbolic-neural-boundaries.s2
  title: Ground a symbol in observations
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.symbolic-neural-boundaries
  markdown: Suppose a detector outputs “cup on table” with uncertainty. Turning that into an unconditional symbolic
    fact throws away uncertainty. Keep confidence, provenance, or alternative interpretations when they matter.
    A symbol such as On must have a defined relation to the measurements used to assert it.
  text_mode: Suppose a detector outputs “cup on table” with uncertainty. Turning that into an unconditional symbolic
    fact throws away uncertainty. Keep confidence, provenance, or alternative interpretations when they matter.
    A symbol such as On must have a defined relation to the measurements used to assert it.
  bridges: []
- id: symbolic-neural-boundaries.s3
  title: Trace a failure across the boundary
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.symbolic-neural-boundaries
  markdown: A robot plans to pick up a cup because a perception system misidentified a reflection. The planner may
    be logically correct relative to its supplied facts. Diagnosis should inspect sensing and grounding before blaming
    the search procedure. End-to-end success requires all relevant component assumptions to hold.
  text_mode: A robot plans to pick up a cup because a perception system misidentified a reflection. The planner
    may be logically correct relative to its supplied facts. Diagnosis should inspect sensing and grounding before
    blaming the search procedure. End-to-end success requires all relevant component assumptions to hold.
  bridges: []
- id: symbolic-neural-boundaries.s4
  title: Use constraints with clear scope
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.symbolic-neural-boundaries
  markdown: A symbolic checker can reject outputs violating a precise format or consistency rule. It cannot certify
    every unstated real-world property. A learned model can propose candidates for a prover or planner, while the
    formal component checks a defined subset of claims. Report which properties are learned, estimated, constrained,
    or verified.
  text_mode: A symbolic checker can reject outputs violating a precise format or consistency rule. It cannot certify
    every unstated real-world property. A learned model can propose candidates for a prover or planner, while the
    formal component checks a defined subset of claims. Report which properties are learned, estimated, constrained,
    or verified.
  bridges: []
- id: symbolic-neural-boundaries.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.symbolic-neural-boundaries
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: symbolic-neural-boundaries.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.symbolic-neural-boundaries
  markdown: Symbolic and neural components can complement each other when interfaces preserve uncertainty, grounding,
    constraints, and the limits of each representation.
  text_mode: Symbolic and neural components can complement each other when interfaces preserve uncertainty, grounding,
    constraints, and the limits of each representation.
