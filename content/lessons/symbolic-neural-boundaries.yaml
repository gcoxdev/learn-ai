      gate_refs:
        - gate.core
  scene_aliases:
    symbolic-neural-boundaries.recap: symbolic-neural-boundaries.check
assessment_families:
  - id: symbolic-neural-boundaries.base
    objective_ref: objective.symbolic-neural-boundaries
    task: base
    response_type: single_choice
    points: 1
    hint: 'Ground a symbol in observations: trace the inputs, operation, and result before choosing.'
    remediation_scene: symbolic-neural-boundaries.s2
    variants:
      - id: symbolic-neural-boundaries.base.1
        prompt: A planner is correct relative to a false object detection. Can the full system still fail?
        options:
          - id: c
            text: Only if the planner is slow
          - id: a
            text: Yes; perception errors can invalidate supplied facts
          - id: b
            text: No; logical correctness repairs every sensor
        answer: a
        feedback: Component correctness is conditional on its inputs and assumptions.
        retired: true
      - id: symbolic-neural-boundaries.base.2
        prompt: What is grounding in this context?
        options:
          - id: a
            text: Connecting symbols to observations and their interpretation
          - id: b
            text: Only storing a graph on disk
          - id: c
            text: Only lowering an electrical voltage
        answer: a
        feedback: A symbolic fact needs a defined relationship to measured or interpreted evidence.
        retired: true
  - id: symbolic-neural-boundaries.transfer
    objective_ref: objective.symbolic-neural-boundaries
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Use constraints with clear scope: trace the inputs, operation, and result before choosing.'
    remediation_scene: symbolic-neural-boundaries.s4
    variants:
      - id: symbolic-neural-boundaries.transfer.1
        prompt: A checker verifies JSON syntax. Has it verified factual truth?
        options:
          - id: a
            text: No; its formal property is only part of correctness
          - id: b
            text: Yes; valid syntax implies true content
          - id: c
            text: Only when keys are short
        answer: a
        feedback: A checker guarantees only the property it actually checks.
        retired: true
      - id: symbolic-neural-boundaries.transfer.2
        prompt: What should a hybrid-system diagram show at component boundaries?
        options:
          - id: b
            text: Only brand names
          - id: c
            text: Only the newest model
          - id: a
            text: Data meaning, uncertainty, and checked assumptions
        answer: a
        feedback: Explicit interfaces help trace both strengths and failures.
        retired: true
  - id: symbolic-neural-boundaries.base.v2
    objective_ref: objective.symbolic-neural-boundaries
    task: base
    response_type: single_choice
    points: 1
    hint: Follow the information across each boundary. Where did a learned part hand a symbol to a rule, and what did each check actually test?
    remediation_scene: symbolic-neural-boundaries.s3
    variants:
      - id: symbolic-neural-boundaries.base.v2.1
        prompt: In the smart home, what does grounding mean for the symbol motion(hallway)?
        options:
          - id: b
            text: Storing it in the rule base so that rules can use it
          - id: a
            text: Tying it to the sensor evidence that makes it true or false
          - id: c
            text: Declaring its type and allowed values in an ontology
        answer: a
        feedback: Grounding connects the symbol to what was observed, such as a detection above a threshold. Storing or typing a symbol says nothing about when it is actually true in the house.
      - id: symbolic-neural-boundaries.base.v2.2
        prompt: Headlights reflect off the hall mirror. The detector reports "person, 0.85," and the rule engine turns on the light and sends an alert. Which part should you fix first?
        options:
          - id: c
            text: The alert rule, because intruders are rare at night
          - id: b
            text: The rule engine, because it fired on a false fact
          - id: a
            text: The detector or its grounding, because the fact was wrong
        answer: a
        feedback: The rule engine behaved correctly given motion(hallway); the error entered at the detector and passed the threshold. Fix the first wrong step, for example by requiring a second sensor to agree.
      - id: symbolic-neural-boundaries.base.v2.3
        prompt: The lesson's checker accepted "IF baby_asleep AND night THEN hall_light_dim." What has been verified?
        options:
          - id: a
            text: Its form, its names, and the one safety policy
          - id: b
            text: That dimming is what the user wanted at night
          - id: c
            text: That it can't clash with another accepted rule
        answer: a
        feedback: The checker tests exactly three things. Intent and conflicts with other rules weren't checked, and in fact it can fire together with the full-light rule.
      - id: symbolic-neural-boundaries.base.v2.4
        prompt: Why store a detection as {fact, source, time, confidence} rather than as the fact alone?
        options:
          - id: b
            text: So the rule engine runs faster on compact facts
          - id: c
            text: So the fact counts as proved once it is stored
          - id: a
            text: So later steps can weigh it, trace it, or recheck it
        answer: a
        feedback: Provenance lets a planner ask a second sensor, discount a weak detection, or trace a failure back to camera_2 at 01:40. Extra fields make a record bigger, not faster, and storing a fact doesn't make it true.
      - id: symbolic-neural-boundaries.base.v2.5
        prompt: Which job in the smart home suits the language model rather than the rule engine?
        options:
          - id: a
            text: Turning "don't wake the baby" into candidate rules
          - id: c
            text: Making sure the front door is never unlocked by a rule
          - id: b
            text: Firing each rule whose conditions hold as facts change
        answer: a
        feedback: Interpreting a vague request is the learned part's strength. Enforcing a hard safety policy and firing rules exactly are symbolic jobs, where you want checkable, predictable behavior.
  - id: symbolic-neural-boundaries.transfer.v2
    objective_ref: objective.symbolic-neural-boundaries
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name what the learned part produced and what the symbolic part checked. Anything outside that check is still unverified.
    remediation_scene: symbolic-neural-boundaries.s4
    variants:
      - id: symbolic-neural-boundaries.transfer.v2.1
        prompt: An AI system proposes a proof, and the Lean proof checker accepts it. What does acceptance show?
        options:
          - id: b
            text: The stated theorem captures what the mathematician meant
          - id: a
            text: The proof is valid for the theorem exactly as written
          - id: c
            text: The model understands why the theorem is true
        answer: a
        feedback: A proof checker verifies each step against the formal statement. Whether that statement matches the intended idea is a separate question, and passing the check says nothing about understanding.
      - id: symbolic-neural-boundaries.transfer.v2.2
        prompt: A language model writes a function, and it passes the 4 unit tests you have. What is the most accurate description?
        options:
          - id: c
            text: Correct, since an automatic checker ran it
          - id: b
            text: Unreliable, since a language model wrote it
          - id: a
            text: It handles those 4 cases; other inputs are untested
        answer: a
        feedback: Tests verify exactly the cases they cover. Being checked by a program doesn't extend to other inputs, and who wrote the code matters less than what has been tested.
      - id: symbolic-neural-boundaries.transfer.v2.3
        prompt: A model reads scanned forms from a US clinic into JSON, and a validator checks that each date is in YYYY-MM-DD format. A form says 03/04/2024 (March 4), and the model writes 2024-04-03. What check is missing?
        options:
          - id: a
            text: That each value matches the source document
          - id: b
            text: A stricter pattern for the date format
          - id: c
            text: A second model that rewrites the JSON
        answer: a
        feedback: The validator checks form, and the wrong date has perfect form. Catching it needs a comparison with the source, such as spot checks or a rule about the clinic's date style.
      - id: symbolic-neural-boundaries.transfer.v2.4
        prompt: A warehouse robot's planner is proven never to plan a route through a marked no-go zone. It still drives into a fresh spill. Why?
        options:
          - id: c
            text: The planner's proof must contain a hidden error
          - id: a
            text: The spill was never grounded as a no-go zone
          - id: b
            text: Planners can only track a few zones at once
        answer: a
        feedback: The proof holds for the zones the planner is given. Perception never turned the spill into a no-go symbol, so the guarantee didn't cover it; the failure is at the boundary.
      - id: symbolic-neural-boundaries.transfer.v2.5
        prompt: A team has a language model propose thousands of timetabling heuristics and an evaluator score each on real school timetables. What does the evaluator contribute?
        options:
          - id: b
            text: New ideas the language model couldn't produce
          - id: a
            text: A dependable score, so weak proposals are dropped
          - id: c
            text: Training data that makes each proposal correct
        answer: a
        feedback: As in FunSearch, the model supplies variety and the evaluator supplies judgment. The evaluator doesn't invent heuristics, and a score filters proposals rather than fixing them.
  - id: symbolic-neural-boundaries.calc
    objective_ref: objective.symbolic-neural-boundaries
    task: base
    response_type: numeric
    points: 1
    hint: Compare each confidence with the threshold. "At or above" means a value equal to the threshold counts.
    remediation_scene: symbolic-neural-boundaries.s2
    absolute_tolerance: 0.01
    variants:
      - id: symbolic-neural-boundaries.calc.1
        prompt: 'The house asserts motion(hallway) when a person detection has confidence at or above 0.8. Tonight''s detections: 0.91, 0.55, 0.78, 0.83. How many become facts?'
        answer: 2
        feedback: 0.91 and 0.83 pass. 0.78 is close but below 0.8, and 0.55 is well below.
      - id: symbolic-neural-boundaries.calc.2
        prompt: 'The house asserts motion(hallway) when a person detection has confidence at or above 0.7. Tonight''s detections: 0.62, 0.70, 0.95, 0.69. How many become facts?'
        answer: 2
        feedback: 0.70 counts because it equals the threshold, and 0.95 passes easily. 0.69 and 0.62 fall short.
      - id: symbolic-neural-boundaries.calc.3
        prompt: 'The house asserts motion(hallway) when a person detection has confidence at or above 0.9. Tonight''s detections: 0.88, 0.93, 0.97, 0.91, 0.40. How many become facts?'
        answer: 3
        feedback: 0.93, 0.97, and 0.91 pass. 0.88 and 0.40 are kept only as possible sightings.
      - id: symbolic-neural-boundaries.calc.4
        prompt: 'The house asserts motion(hallway) when a person detection has confidence at or above 0.5. Tonight''s detections: 0.45, 0.30. How many become facts?'
        answer: 0
        feedback: Both are below 0.5, so no fact is asserted and the rules never see motion, even though something may have moved.
      - id: symbolic-neural-boundaries.calc.5
        prompt: 'The house asserts motion(hallway) when a person detection has confidence at or above 0.6. Tonight''s detections: 0.61, 0.59, 0.60, 0.99. How many become facts?'
        answer: 3
        feedback: 0.61, 0.60 (equal to the threshold), and 0.99 pass. Only 0.59 falls short.
