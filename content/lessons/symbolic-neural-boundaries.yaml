schema_version: 0.2-draft
lesson:
  id: symbolic-neural-boundaries
  version: 0.3.0-draft
  title: Combine explicit knowledge with learned perception
  state: draft
  summary: Connect a picture recognizer to a rule checker, and follow what happens when an uncertain observation
    becomes a fact.
  slot: M04.8
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.symbolic-neural-boundaries
  version: 1-draft
  statement: Symbolic and neural components can complement each other when interfaces preserve uncertainty,
    grounding, constraints, and the limits of each representation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - symbolic-neural-boundaries.base
  - symbolic-neural-boundaries.transfer
  prerequisites:
  - anyOf:
    - objective.knowledge-graphs
  - anyOf:
    - objective.defaults-and-exceptions
  - anyOf:
    - objective.features-and-bias
scenes:
- id: symbolic-neural-boundaries.s1
  title: Different components can answer different questions
  type: explanation
  depth: intuition
  objective_refs:
  - objective.symbolic-neural-boundaries
  markdown: A vision model estimates which objects are present. A rule system checks whether a represented
    arrangement satisfies a requirement. A planner searches possible actions. Combining them can make a useful
    system, but a correct rule cannot compensate automatically for a mistaken object label.
  text_mode: A vision model estimates which objects are present. A rule system checks whether a represented
    arrangement satisfies a requirement. A planner searches possible actions. Combining them can make a useful
    system, but a correct rule cannot compensate automatically for a mistaken object label.
  bridges: []
- id: symbolic-neural-boundaries.s2
  title: Connect a symbol to an observation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.symbolic-neural-boundaries
  markdown: '**Grounding** connects a symbol to what was observed. Suppose a camera-based detector reports
    “cup on table.” Before a planner treats this as a fact, it may need to know which camera supplied it, when
    it was seen, and how uncertain the detection was.


    That source history is **provenance**. A confidence score can record the detector’s estimate, though it
    needs testing before we interpret it as a reliable probability. Preserving this information lets another
    component request a clearer view instead of acting on an uncertain label.'
  text_mode: '**Grounding** connects a symbol to what was observed. Suppose a camera-based detector reports
    “cup on table.” Before a planner treats this as a fact, it may need to know which camera supplied it, when
    it was seen, and how uncertain the detection was.


    That source history is **provenance**. A confidence score can record the detector’s estimate, though it
    needs testing before we interpret it as a reliable probability. Preserving this information lets another
    component request a clearer view instead of acting on an uncertain label.'
  bridges: []
- id: symbolic-neural-boundaries.s3
  title: Trace a failure across the boundary
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.symbolic-neural-boundaries
  markdown: A robot plans to pick up a cup because a perception system misidentified a reflection. The planner
    may be logically correct relative to its supplied facts. Diagnosis should inspect sensing and grounding
    before blaming the search procedure. End-to-end success requires all relevant component assumptions to
    hold.
  text_mode: A robot plans to pick up a cup because a perception system misidentified a reflection. The planner
    may be logically correct relative to its supplied facts. Diagnosis should inspect sensing and grounding
    before blaming the search procedure. End-to-end success requires all relevant component assumptions to
    hold.
  bridges: []
- id: symbolic-neural-boundaries.s4
  title: Be clear about what the checker checks
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.symbolic-neural-boundaries
  markdown: 'JSON is a text format for named values. A checker might accept {"cups": 2} because it contains
    the expected field and a number. If the table holds one cup, the record has the right format but the wrong
    count. We need another observation to check the count.


    Symbolic checkers can enforce specified formats, constraints, or proof rules. Learned models can propose
    candidates for them to inspect. Together they can check more than either component alone, provided we state
    exactly which properties the checks cover.'
  text_mode: 'JSON is a text format for named values. A checker might accept {"cups": 2} because it contains
    the expected field and a number. If the table holds one cup, the record has the right format but the wrong
    count. We need another observation to check the count.


    Symbolic checkers can enforce specified formats, constraints, or proof rules. Learned models can propose
    candidates for them to inspect. Together they can check more than either component alone, provided we state
    exactly which properties the checks cover.'
  bridges: []
- id: symbolic-neural-boundaries.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.symbolic-neural-boundaries
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A learned detector and a rule-based planner can work together. Keep the observations, uncertainty,
    and meaning of each symbol clear as information passes between them.
- id: symbolic-neural-boundaries.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.symbolic-neural-boundaries
  markdown: A learned detector and a rule-based planner can work together. Keep the observations, uncertainty,
    and meaning of each symbol clear as information passes between them.
  text_mode: A learned detector and a rule-based planner can work together. Keep the observations, uncertainty,
