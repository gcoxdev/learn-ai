    markdown: Count assignments and batch rows, combine a token by hand, and track down a batch whose results landed on the wrong tokens.
    takeaway: |-
      Dispatch sorts each token's assignments into per-expert batches, each expert runs once, and combine adds the gate-weighted outputs back to each token's own row.
