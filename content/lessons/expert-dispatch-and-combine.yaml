assessment_families:
  - id: expert-dispatch-and-combine.base
    objective_ref: objective.expert-dispatch-and-combine
    task: base
    response_type: single_choice
    points: 1
    hint: 'Execute grouped expert batches: trace the inputs, operation, and result before choosing.'
    remediation_scene: expert-dispatch-and-combine.s2
    variants:
      - id: expert-dispatch-and-combine.base.1
        prompt: Why retain original token positions during dispatch?
        options:
          - id: a
            text: To restore outputs to the right positions
          - id: b
            text: To replace the tokenizer
          - id: c
            text: To make every expert identical
        answer: a
        feedback: Expert grouping reorders assignments temporarily.
        retired: true
      - id: expert-dispatch-and-combine.base.2
        prompt: Outputs 2 and 6 weighted 0.75 and 0.25 combine to what?
        options:
          - id: b
            text: '8'
          - id: c
            text: 4 regardless of weights
          - id: a
            text: '3'
        answer: a
        feedback: Multiply each output by its weight and add.
        retired: true
  - id: expert-dispatch-and-combine.transfer
    objective_ref: objective.expert-dispatch-and-combine
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Restore the surrounding layer: trace the inputs, operation, and result before choosing.'
    remediation_scene: expert-dispatch-and-combine.s4
    variants:
      - id: expert-dispatch-and-combine.transfer.1
        prompt: Two tokens select the same expert. Can it batch them?
        options:
          - id: b
            text: No, experts accept only one token ever
          - id: c
            text: Only by merging their meanings into one token
          - id: a
            text: Yes, while keeping their assignment identities
        answer: a
        feedback: Batching shares execution without losing the separate outputs.
        retired: true
      - id: expert-dispatch-and-combine.transfer.2
        prompt: One assignment is dropped. What must the implementation define?
        options:
          - id: c
            text: That all original outputs are unchanged automatically
          - id: a
            text: How the missing contribution affects output and weighting
          - id: b
            text: Only a new lesson title
        answer: a
        feedback: Capacity handling changes the computation unless accounted for.
        retired: true
  - id: expert-dispatch-and-combine.base.v2
    objective_ref: objective.expert-dispatch-and-combine
    task: base
    response_type: single_choice
    points: 1
    hint: Follow one assignment, a (token index, expert, gate) triple, from dispatch through the expert and back to its home row.
    remediation_scene: expert-dispatch-and-combine.s2
    variants:
      - id: expert-dispatch-and-combine.base.v2.1
        prompt: During dispatch, each assignment keeps the index of the token it came from. What is that index used for?
        options:
          - id: b
            text: Letting the expert look up which word the token was
          - id: a
            text: Adding the expert's output back into the right token's row
          - id: c
            text: Letting the router recompute the gate weights afterward
        answer: a
        feedback: Sorting by expert scrambles the order, and combine uses the stored index to write each output back to its token. Experts only see vectors, not words, and the gates were already computed before dispatch.
      - id: expert-dispatch-and-combine.base.v2.2
        prompt: In one MoE layer, expert 3's input batch has shape [37, 4096]. What does the 37 count?
        options:
          - id: c
            text: The number of tokens in the whole batch sent to the layer
          - id: b
            text: The number of experts chosen by token 37 in the batch
          - id: a
            text: The number of assignments routed to expert 3 in this batch
        answer: a
        feedback: Each expert's batch holds one row per assignment it received; 4,096 is the vector width. The whole batch has T tokens, split unevenly across experts, so any one expert usually gets far fewer.
      - id: expert-dispatch-and-combine.base.v2.3
        prompt: Why do MoE layers group assignments by expert instead of looping over tokens one at a time?
        options:
          - id: a
            text: One big matrix multiply per expert uses the GPU far better
          - id: c
            text: Grouping lets each expert see the whole sentence's context
          - id: b
            text: Grouping is needed so that each token's gates add up to 1
        answer: a
        feedback: GPUs are built for large matrix multiplications, so one [n_e, d] batch per expert beats many tiny vector products. Experts still treat each row separately, with no sentence context, and the gates were normalized before dispatch.
      - id: expert-dispatch-and-combine.base.v2.4
        prompt: Token 4 was routed to experts 1 and 4 with gates g₁ and g₄. After combine, what does row 4 of the MoE output hold?
        options:
          - id: b
            text: The average of every expert output computed in the batch
          - id: a
            text: g₁ times expert 1's output plus g₄ times expert 4's output
          - id: c
            text: The output of whichever of its two experts had the larger gate
        answer: a
        feedback: Combine adds each of the token's own weighted expert outputs into its row. Other tokens' results go to their own rows, and keeping only the larger gate would throw away the second expert's work.
  - id: expert-dispatch-and-combine.transfer.v2
    objective_ref: objective.expert-dispatch-and-combine
    task: transfer
    response_type: single_choice
    points: 1
    hint: Check the bookkeeping. Batch sizes must add up to T × k, each output must return to its stored token index, and each must be scaled by its own gate.
    remediation_scene: expert-dispatch-and-combine.s3
    variants:
      - id: expert-dispatch-and-combine.transfer.v2.1
        prompt: After a refactor, an MoE layer's outputs look shuffled; token 2 ends up with a result computed from token 5's vector. What is the most likely bug?
        options:
          - id: c
            text: The router picked the wrong experts for tokens 2 and 5
          - id: a
            text: Combine wrote outputs by batch position, not stored token index
          - id: b
            text: The gate weights were not renormalized after top-k selection
        answer: a
        feedback: Within an expert's batch, row order differs from token order, so writing back by position swaps results between tokens. Wrong experts or unnormalized gates would change the values, but each token would still get a result computed from its own vector.
      - id: expert-dispatch-and-combine.transfer.v2.2
        prompt: A translation server batches tokens from three users' sentences into one MoE layer. Expert 2's batch contains tokens from all three sentences. Is anything wrong?
        options:
          - id: b
            text: Yes, the expert would mix information between the users' sentences
          - id: c
            text: Yes, each sentence needs its own pass through the MoE layer
          - id: a
            text: No, the expert handles each row on its own and combine returns it
        answer: a
        feedback: An expert is a feed-forward network applied row by row, so rows from different sentences never interact inside it. Mixing information across tokens is attention's job, and attention keeps sentences apart with its mask.
      - id: expert-dispatch-and-combine.transfer.v2.3
        prompt: An engineer logs expert batch sizes of 5, 3, 2, and 1 for a batch of 6 tokens with top-2 routing over 4 experts. What does this tell you?
        options:
          - id: a
            text: One assignment is missing, since the sizes should add up to 12
          - id: b
            text: The routing is fine, since expert batch sizes can be unequal
          - id: c
            text: One token must have been routed to three experts instead of two
        answer: a
        feedback: Six tokens × 2 = 12 assignments, but 5 + 3 + 2 + 1 = 11, so one was lost or refused. Unequal sizes are normal; a missing total is not. A token picking three experts would make the total 13, not 11.
      - id: expert-dispatch-and-combine.transfer.v2.4
        prompt: A new MoE implementation adds each token's two expert outputs back into its row but forgets to multiply by the gates. What happens to that token's output?
        options:
          - id: c
            text: Nothing changes, because the two gates add up to 1 anyway
          - id: b
            text: The router picks different experts on the next forward pass
          - id: a
            text: It becomes a plain sum that ignores the router's preference
        answer: a
        feedback: Without gates, a token with gates 0.9 and 0.1 gets both outputs at full strength, roughly doubling the scale and ignoring the router. The gates summing to 1 is exactly why they must be applied, and selection is unaffected by combine.
  - id: expert-dispatch-and-combine.calculate
    objective_ref: objective.expert-dispatch-and-combine
    task: base
    response_type: numeric
    points: 1
    hint: Every token makes k assignments, so the expert batches hold T × k rows in total. To combine, multiply each expert output by its gate and add.
    remediation_scene: expert-dispatch-and-combine.s2
    absolute_tolerance: 0.001
    variants:
      - id: expert-dispatch-and-combine.calculate.1
        prompt: A batch of 512 tokens goes through an MoE layer with top-2 routing over 8 experts. How many rows do the 8 expert batches hold in total?
        answer: 1024
        feedback: Each of the 512 tokens makes 2 assignments, so 512 × 2 = 1,024 rows, however unevenly they spread over the 8 experts.
      - id: expert-dispatch-and-combine.calculate.2
        prompt: A token's two experts return the numbers 4 and −2, with gates 0.6 and 0.4. What value does combine write into the token's row?
        answer: 1.6
        feedback: 0.6 × 4 + 0.4 × (−2) = 2.4 − 0.8 = 1.6.
      - id: expert-dispatch-and-combine.calculate.3
        prompt: Six tokens use top-2 routing over 4 experts. Three of the expert batches hold 4, 3, and 3 rows. How many rows does the fourth batch hold?
        answer: 2
        feedback: The batches must hold 6 × 2 = 12 rows in total, and 12 − (4 + 3 + 3) = 2.
      - id: expert-dispatch-and-combine.calculate.4
        prompt: A batch of 4,096 tokens uses top-2 routing over 8 experts. If the router spread the work perfectly evenly, how many rows would each expert's batch hold?
        answer: 1024
        feedback: 4,096 × 2 = 8,192 assignments, divided among 8 experts, gives 1,024 rows each. Real batches are rarely this even.
      - id: expert-dispatch-and-combine.calculate.5
        prompt: A token's two experts return the numbers 10 and 2, with gates 0.3 and 0.7. What value does combine write into the token's row?
        answer: 4.4
        feedback: 0.3 × 10 + 0.7 × 2 = 3 + 1.4 = 4.4. The larger gate pulls the result toward 2.
