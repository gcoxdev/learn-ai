schema_version: 0.2-draft
lesson:
  id: expert-dispatch-and-combine
  version: 0.1.0-draft
  title: Follow a token through dispatch, experts, and combination
  state: draft
  summary: Follow one token as the router selects experts, the system sends work to them, and their outputs are
    mixed.
  slot: M18.3
  category: learning
  sources:
  - title: Sparsely-Gated Mixture-of-Experts
    url: https://arxiv.org/abs/1701.06538
  - title: Switch Transformers
    url: https://arxiv.org/abs/2101.03961
objectives:
- id: objective.expert-dispatch-and-combine
  version: 1-draft
  statement: Dispatch groups token representations by selected expert, executes each expert, and combines returned
    outputs in the original token order using routing weights.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - expert-dispatch-and-combine.base
  - expert-dispatch-and-combine.transfer
  prerequisites:
  - anyOf:
    - objective.routers-and-top-k
  - anyOf:
    - objective.tensor-shape-tracing
scenes:
- id: expert-dispatch-and-combine.s1
  title: Build assignment records
  type: explanation
  depth: intuition
  objective_refs:
  - objective.expert-dispatch-and-combine
  markdown: For each token, retain its original position, selected expert IDs, and combination weights. Top-two
    routing creates two assignments per token before capacity policies. Grouping assignments by expert allows efficient
    matrix operations, but the final output must return to the correct original token position.
  text_mode: For each token, retain its original position, selected expert IDs, and combination weights. Top-two
    routing creates two assignments per token before capacity policies. Grouping assignments by expert allows efficient
    matrix operations, but the final output must return to the correct original token position.
  bridges: []
- id: expert-dispatch-and-combine.s2
  title: Execute grouped expert batches
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.expert-dispatch-and-combine
  markdown: 'Consider tokens A and B: A selects experts one and three; B selects expert three and four. Expert three
    processes a batch containing both representations. Each expert applies its learned network independently to
    assigned vectors. Assignment order can change for efficiency without changing the intended token identities.'
  text_mode: 'Consider tokens A and B: A selects experts one and three; B selects expert three and four. Expert
    three processes a batch containing both representations. Each expert applies its learned network independently
    to assigned vectors. Assignment order can change for efficiency without changing the intended token identities.'
  bridges: []
- id: expert-dispatch-and-combine.s3
  title: Combine a concrete result
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.expert-dispatch-and-combine
  markdown: For a scalar toy output, A’s selected experts return 2 and 6 with weights 0.75 and 0.25. The combined
    expert output is 0.75×2 + 0.25×6 = 3. In a real layer the outputs are vectors with compatible widths; the weighted
    sum is computed coordinate by coordinate.
  text_mode: For a scalar toy output, A’s selected experts return 2 and 6 with weights 0.75 and 0.25. The combined
    expert output is 0.75×2 + 0.25×6 = 3. In a real layer the outputs are vectors with compatible widths; the weighted
    sum is computed coordinate by coordinate.
  bridges: []
- id: expert-dispatch-and-combine.s4
  title: Restore the surrounding layer
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.expert-dispatch-and-combine
  markdown: The combined vector returns to the shared residual pathway in the order defined by the architecture.
    If an assignment was dropped or rerouted, the policy must specify its effect on weights and output. Dispatch
    is a tensor movement and bookkeeping problem as well as a mathematical mixture.
  text_mode: The combined vector returns to the shared residual pathway in the order defined by the architecture.
    If an assignment was dropped or rerouted, the policy must specify its effect on weights and output. Dispatch
    is a tensor movement and bookkeeping problem as well as a mathematical mixture.
  bridges: []
- id: expert-dispatch-and-combine.extension-routing-lab
  title: Follow dispatch, execution, and combination
  type: simulation
  depth: mechanics
  objective_refs:
  - objective.expert-dispatch-and-combine
  markdown: The toy below starts with four routing probabilities. Select top 2 to retain 0.55 and 0.25; their sum
    is 0.80. Renormalizing gives weights 0.6875 and 0.3125. The selected expert output vectors are constructed examples,
    [2,0] and [0,4], so the combined output is [1.375,1.25]. Change how many experts are selected and trace which
    contributions enter the sum. A real dispatcher groups token work by expert before execution; this small display
    exposes the arithmetic, not a distributed implementation. Some architectures use different score normalization
    conventions.
  text_mode: The toy below starts with four routing probabilities. Select top 2 to retain 0.55 and 0.25; their sum
    is 0.80. Renormalizing gives weights 0.6875 and 0.3125. The selected expert output vectors are constructed examples,
    [2,0] and [0,4], so the combined output is [1.375,1.25]. Change how many experts are selected and trace which
    contributions enter the sum. A real dispatcher groups token work by expert before execution; this small display
    exposes the arithmetic, not a distributed implementation. Some architectures use different score normalization
    conventions.
  bridges:
  - vectors
  - arithmetic
  simulation: moe
- id: expert-dispatch-and-combine.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.expert-dispatch-and-combine
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Routing chooses the computation; dispatch sends the work; combination mixes the selected outputs. Count
    each step when reasoning about a sparse model.
- id: expert-dispatch-and-combine.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.expert-dispatch-and-combine
  markdown: Dispatch groups token representations by selected expert, executes each expert, and combines returned
    outputs in the original token order using routing weights.
  text_mode: Dispatch groups token representations by selected expert, executes each expert, and combines returned
    outputs in the original token order using routing weights.
