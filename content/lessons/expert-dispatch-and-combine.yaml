  - id: expert-dispatch-and-combine.s2
    title: Follow the shapes
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.expert-dispatch-and-combine
    markdown: |-
      Here are the tensors a real implementation passes along, with $T$ tokens of width $d$, $N$ experts, and top-$k$:

      | Step | Tensor | Shape | In our batch |
      | --- | --- | --- | --- |
      | Token vectors | $X$ | $[T, d]$ | $[6, 3]$ |
      | Router logits | $X W_r$ | $[T, N]$ | $[6, 4]$ |
      | Chosen experts and gates | `top`, `gates` | $[T, k]$ | $[6, 2]$ |
      | Flattened assignments | token index, expert id, gate | $[T k]$ | 12 of each |
      | Expert $e$'s batch | rows of $X$ | $[n_e, d]$ | $[4, 3]$ for E1 |
      | Layer output | $Y$ | $[T, d]$ | $[6, 3]$ |

      The batch sizes $n_e$ always add up to $T k$: here $4 + 4 + 2 + 2 = 12$. They are rarely equal, which is the whole subject of the capacity lesson.

      The code builds exactly this batch, runs each expert once on its group, and combines. Then it checks the answer against the slow token-by-token loop.

      ```python run
      import numpy as np

      rng = np.random.default_rng(1)
      T, d, N, k = 6, 3, 4, 2                         # tokens, width, experts, top-k
      X = rng.normal(size=(T, d))                     # one row per token
      W_r = rng.normal(size=(d, N))                   # router
      experts = rng.normal(size=(N, d, d))            # each expert maps d -> d

      logits = X @ W_r                                # [T, N]
      top = np.argsort(-logits, axis=1)[:, :k]        # [T, k] chosen expert ids
      kept = np.take_along_axis(logits, top, axis=1)
      gates = np.exp(kept) / np.exp(kept).sum(axis=1, keepdims=True)  # [T, k]

      tok = np.repeat(np.arange(T), k)                # home token of each assignment
      exp_id, gate = top.ravel(), gates.ravel()       # T*k = 12 assignments
      Y = np.zeros((T, d))
      for e in range(N):
          rows = np.where(exp_id == e)[0]             # dispatch: this expert's rows
          batch = X[tok[rows]]                        # [n_e, d]
          out = batch @ experts[e]                    # one matrix multiply per expert
          np.add.at(Y, tok[rows], gate[rows, None] * out)  # combine: add back home
          print(f"E{e+1}: tokens {tok[rows].tolist()}  batch shape {batch.shape}")

      slow = np.array([sum(g * (X[t] @ experts[e]) for e, g in zip(top[t], gates[t]))
                       for t in range(T)])            # token-by-token reference
      print("output shape:", Y.shape, " matches token loop:", np.allclose(Y, slow))
      ```

      :::predict Set k = 1 and rerun. How many rows will the four expert batches hold in total?
      Six: each token now makes one assignment, so the batch sizes add up to $T k = 6 \times 1$. Each token's output is then its one expert's result times its gate. Try it, and try `T = 60` to see how uneven the batches get.
      :::
    bridges: []
  - id: expert-dispatch-and-combine.s3
    title: Combine one token by hand
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.expert-dispatch-and-combine
    markdown: |-
      Zoom in on token 4, which went to experts 1 and 4. Suppose its gates are 0.75 and 0.25, and (to keep the numbers small) each expert returns a single number: expert 1 gives 2 and expert 4 gives 6. Combine adds both contributions into row 4:

      $$y_4 = 0.75 \times 2 + 0.25 \times 6 = 1.5 + 1.5 = 3$$

      With real vectors, the same sum happens coordinate by coordinate, exactly as in the routers lesson. In the code, `np.add.at(Y, tok[rows], ...)` does it: it adds each output into the row named by its home address. PyTorch calls the same operation `index_add_` or scatter-add.

      :::mixup "Sorting tokens by expert scrambles the sentence, so the output comes out in a different order."
      The sort is temporary. Each output travels with its token index, and combine writes it back to that row. The layer's output has the same shape and order as its input, $[T, d]$, so the next attention layer never knows a sort happened.
      :::
    bridges: []
  - id: expert-dispatch-and-combine.s4
    title: Rejoin the residual stream
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.expert-dispatch-and-combine
    markdown: |-
      After combine, the MoE output is added to the residual stream, just as a dense feed-forward output would be. For a token vector $h$:

      $$h_{\text{next}} = h + \sum_{i \in \mathcal{T}} g_i\, E_i(\text{norm}(h))$$

      Two consequences are worth knowing now. First, if an assignment never runs (the capacity lesson shows how a full expert can refuse it), its term is simply missing from the sum. The token still carries $h$ forward, so it isn't lost, just less processed. Second, because each expert treats every row independently, a batch can freely mix tokens from different sentences and different users. Only attention needs to know which tokens belong together.

      Production systems avoid the Python loop. Libraries such as MegaBlocks (Gale et al., 2022) run all the uneven expert batches as one block-sparse matrix multiplication, so no expert has to pad its batch to a fixed size.
    bridges: []
  - id: expert-dispatch-and-combine.extension-routing-lab
    title: Follow dispatch, execution, and combination
    type: simulation
    depth: mechanics
    objective_refs:
      - objective.expert-dispatch-and-combine
    markdown: |-
      This is the one-token view of what the code did for six. The token's probabilities are 0.55, 0.25, 0.15, and 0.05. At top-2, it's dispatched to experts 1 and 2 with gates 0.6875 and 0.3125, and combine returns $[1.375, 1.25]$ to its row. Switch to top-3 and one more assignment appears: in a real batch, that token would join a third expert's group, and the batch sizes would add up to $3T$ instead of $2T$.
    bridges:
      - vectors
      - arithmetic
    simulation: moe
  - id: expert-dispatch-and-combine.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
