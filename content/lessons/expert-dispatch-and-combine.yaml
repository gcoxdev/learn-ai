scenes:
  - id: expert-dispatch-and-combine.s1
    title: Six tokens, twelve assignments
    type: explanation
    depth: intuition
    objective_refs:
      - objective.expert-dispatch-and-combine
    markdown: |-
      The last lesson routed one token. Real layers route thousands at once. Take a small batch: six tokens, four experts, top-2 routing. The router's choices look like this:

      | Token | 0 | 1 | 2 | 3 | 4 | 5 |
      | --- | --- | --- | --- | --- | --- | --- |
      | Chosen experts | E1, E2 | E1, E2 | E1, E2 | E3, E4 | E1, E4 | E2, E3 |

      That's 6 × 2 = 12 **assignments**, each a (token, expert, gate weight) triple. You could run them one at a time: twelve small vector-times-matrix products. GPUs are far faster at a few big matrix multiplications than at many tiny ones, so MoE layers turn the work around. They sort the assignments by expert, and each expert processes all its tokens in one batch.

      **Dispatch** is that step: gathering each expert's token vectors into one batch (and, on multiple GPUs, sending them to the device that holds the expert). **Combine** is the return trip: scaling each expert's outputs by their gates and adding them back into the right token's row.

      The one rule that makes this work: every assignment carries its **home address**, the index of the token it came from. Sorting scrambles the order; the address puts it back.
