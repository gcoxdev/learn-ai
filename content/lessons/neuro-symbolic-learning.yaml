    coefficient adds pressure to satisfy the hierarchy. It still competes with the rest of the training loss.
    A hard output constraint could enforce child ≤ parent, but cannot establish that the picture actually contains
    a sparrow.'
  bridges: []
- id: neuro-symbolic-learning.s3
  title: Verify or constrain explicitly
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neuro-symbolic-learning
  markdown: A hard constraint solver can reject invalid candidate assignments or search only feasible ones.
    This offers stronger guarantees about the encoded constraints when the solver and inputs meet their assumptions.
    If the perception layer supplies wrong facts, a valid symbolic solution may still be wrong for the real
    scene.
  text_mode: A hard constraint solver can reject invalid candidate assignments or search only feasible ones.
    This offers stronger guarantees about the encoded constraints when the solver and inputs meet their assumptions.
    If the perception layer supplies wrong facts, a valid symbolic solution may still be wrong for the real
    scene.
  bridges: []
- id: neuro-symbolic-learning.s4
  title: Evaluate the interface and the claim
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neuro-symbolic-learning
  markdown: Compare learned-only, symbolic-only, and combined baselines where meaningful. Measure constraint
    satisfaction, task quality, computational cost, and robustness to uncertain symbols. A readable rule or
    differentiable operator does not by itself establish human-like reasoning or complete interpretability.
  text_mode: Compare learned-only, symbolic-only, and combined baselines where meaningful. Measure constraint
    satisfaction, task quality, computational cost, and robustness to uncertain symbols. A readable rule or
    differentiable operator does not by itself establish human-like reasoning or complete interpretability.
  bridges: []
