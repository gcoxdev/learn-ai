lesson:
  id: neuro-symbolic-learning
  version: 0.2.0-draft
  title: Connect learned representations with explicit reasoning constraints
  state: draft
  summary: Combine learned predictions with rules while checking what each part guarantees.
  slot: M32.6
  category: learning
  sources:
  - title: DeepProbLog
    url: https://arxiv.org/abs/1805.10872
  - title: Logic Tensor Networks
    url: https://arxiv.org/abs/1606.04422
