    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.neuro-symbolic-learning
  version: 1-draft
  statement: Neuro-symbolic methods combine neural learning with symbolic structures or constraints; soft penalties,
    differentiable reasoning, and hard verification provide different guarantees and failure modes.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - neuro-symbolic-learning.base
  - neuro-symbolic-learning.transfer
  prerequisites:
  - anyOf:
    - objective.symbolic-neural-boundaries
  - anyOf:
    - objective.automatic-differentiation
  - anyOf:
    - objective.constraint-solving
scenes:
- id: neuro-symbolic-learning.s1
  title: Choose the connection point
  type: explanation
  depth: intuition
  objective_refs:
  - objective.neuro-symbolic-learning
  markdown: A neural model can identify objects while a symbolic planner operates on their relations. Another
    design embeds logical constraints into a learning objective or makes parts of inference differentiable.
    The term neuro-symbolic covers many interfaces, so specify the data and computation crossing each boundary.
  text_mode: A neural model can identify objects while a symbolic planner operates on their relations. Another
    design embeds logical constraints into a learning objective or makes parts of inference differentiable.
    The term neuro-symbolic covers many interfaces, so specify the data and computation crossing each boundary.
  bridges: []
- id: neuro-symbolic-learning.s2
  title: Penalize violations softly
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neuro-symbolic-learning
  markdown: 'A loss term can discourage predictions that violate a rule. For example, a hierarchy may penalize
    child-category probability exceeding its parent under a chosen formulation. A finite penalty competes with
    other loss terms and does not automatically guarantee zero violations after training.


    Suppose a model assigns probability 0.8 to “sparrow” and 0.6 to “bird,” even though every sparrow is a
    bird. A toy penalty max(0, child − parent) is max(0, 0.8 − 0.6) = 0.2. Multiplying this penalty by a chosen
    coefficient adds pressure to satisfy the hierarchy. It still competes with the rest of the training loss.
    A hard output constraint could enforce child ≤ parent, but cannot establish that the picture actually contains
    a sparrow.'
  text_mode: 'A loss term can discourage predictions that violate a rule. For example, a hierarchy may penalize
    child-category probability exceeding its parent under a chosen formulation. A finite penalty competes with
    other loss terms and does not automatically guarantee zero violations after training.


    Suppose a model assigns probability 0.8 to “sparrow” and 0.6 to “bird,” even though every sparrow is a
