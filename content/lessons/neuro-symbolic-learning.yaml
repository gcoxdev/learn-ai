schema_version: 0.2-draft
lesson:
  id: neuro-symbolic-learning
  version: 0.4.0-draft
  title: Connect learned representations with explicit reasoning constraints
  state: draft
  summary: A network learns to read handwritten digits without ever seeing a digit label, only their sums. Logic supplies the missing step and sends gradients back through it.
  slot: M32.6
  category: learning
  sources:
    - title: "DeepProbLog: Neural Probabilistic Logic Programming (Manhaeve et al., 2018)"
      url: https://arxiv.org/abs/1805.10872
    - title: "A Semantic Loss Function for Deep Learning with Symbolic Knowledge (Xu et al., 2018)"
      url: https://arxiv.org/abs/1711.11157
    - title: "Logic Tensor Networks (Serafini & d'Avila Garcez, 2016)"
      url: https://arxiv.org/abs/1606.04422
    - title: "DreamCoder: Growing generalizable, interpretable knowledge with wake-sleep Bayesian program learning (Ellis et al., 2020)"
      url: https://arxiv.org/abs/2006.08381
    - title: "Solving olympiad geometry without human demonstrations (AlphaGeometry; Trinh et al., 2024)"
      url: https://doi.org/10.1038/s41586-023-06747-5
    - title: "Wu's Method can Boost Symbolic AI to Rival Silver Medalists and AlphaGeometry to Outperform Gold Medalists at IMO Geometry (Sinha et al., 2024)"
      url: https://arxiv.org/abs/2404.06405
objectives:
  - id: objective.neuro-symbolic-learning
    version: 2-draft
    statement: Neuro-symbolic methods combine neural learning with symbolic structures or constraints; soft penalties, differentiable reasoning, and hard verification provide different guarantees and failure modes.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - neuro-symbolic-learning.base.v2
      - neuro-symbolic-learning.transfer.v2
      - neuro-symbolic-learning.calculate
    prerequisites:
      - anyOf:
          - objective.symbolic-neural-boundaries
      - anyOf:
          - objective.automatic-differentiation
      - anyOf:
          - objective.constraint-solving
scenes:
  - id: neuro-symbolic-learning.s1
    title: Learning digits from sums alone
    type: explanation
    depth: intuition
    objective_refs:
      - objective.neuro-symbolic-learning
    markdown: |-
      Here's a strange training set. Each example is two handwritten digits and one label: their sum. Nobody ever says "this image is a 3." Can a network still learn to read digits?

      It can, if logic fills the gap. In **DeepProbLog** (Robin Manhaeve and colleagues, 2018), a neural network looks at each image and outputs probabilities for each digit. A small logic program states the one fact we know: the label is the first digit plus the second. The program then computes the probability of the observed sum from the network's outputs.

      Keep the digits to 0, 1, and 2 so we can work it by hand. The network currently says:

      | | P(0) | P(1) | P(2) |
      | --- | ---: | ---: | ---: |
      | Image 1 | 0.2 | 0.7 | 0.1 |
      | Image 2 | 0.6 | 0.3 | 0.1 |

      The label is 2. Three digit pairs make 2: (0, 2), (1, 1), and (2, 0). So

      $$P(\text{sum} = 2) = 0.2 \times 0.1 + 0.7 \times 0.3 + 0.1 \times 0.6 = 0.02 + 0.21 + 0.06 = 0.29$$

      The training loss is $-\ln 0.29 \approx 1.238$, just like cross-entropy. Every step of that calculation is multiplication and addition, so gradients flow back through the logic into the network's weights.

      In the lesson on combining symbolic and neural parts, the two halves sat side by side and passed facts across a boundary. Here the logic sits *inside* training and shapes what the network learns.
  - id: neuro-symbolic-learning.s2
    title: Logic as a loss
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neuro-symbolic-learning
    markdown: |-
      The program below starts from those probabilities and runs 20 gradient steps on the sum loss. The gradients are estimated by central differences, the same check as in the lesson on gradient checks.

      ```python run
      import numpy as np

      def softmax(z):
          e = np.exp(z - z.max())
          return e / e.sum()

      # A network's logits for two handwritten digits (classes 0, 1, 2). Only the SUM is labeled.
      z1 = np.log(np.array([0.2, 0.7, 0.1]))
      z2 = np.log(np.array([0.6, 0.3, 0.1]))
      label = 2

      def p_sum(z1, z2, s):       # logic: sum is s  <=>  digit1 = a and digit2 = s - a
          p, q = softmax(z1), softmax(z2)
          return sum(p[a] * q[s - a] for a in range(3) if 0 <= s - a <= 2)

      def loss(z1, z2):
          return -np.log(p_sum(z1, z2, label))

      def grad(f, z, h=1e-5):     # central differences, as in the gradient checks lesson
          return np.array([(f(z + h * e) - f(z - h * e)) / (2 * h) for e in np.eye(len(z))])

      print(f"P(sum = {label}) = {p_sum(z1, z2, label):.3f}   loss = {loss(z1, z2):.3f}")
      for step in range(20):
          g1, g2 = grad(lambda z: loss(z, z2), z1), grad(lambda z: loss(z1, z), z2)
          z1, z2 = z1 - 0.5 * g1, z2 - 0.5 * g2
      print(f"after 20 steps: P(sum = {label}) = {p_sum(z1, z2, label):.3f}")
      print("digit 1 probs:", softmax(z1).round(2), "  digit 2 probs:", softmax(z2).round(2))
      ```

      P(sum = 2) rises from 0.290 to 0.858, and both images move toward "1," the explanation the network already favored. One example can't tell 1 + 1 from 0 + 2; across thousands of pairs with different sums, only the true digit meanings fit them all.

      :::predict Change the label to 4. What must both digits become?
      Only 2 + 2 makes 4, so the logic pushes both images toward "2." P(sum = 4) starts at just 0.1 × 0.1 = 0.010 (loss 4.605) and reaches 0.848, with each image at 0.92 for "2." An unambiguous label teaches much faster.
      :::

      The same trick works for any rule you can write as a probability. The **semantic loss** (Jingyi Xu and colleagues, 2018) is $-\ln P(\text{outputs satisfy the constraint})$. For a bird classifier that must respect "every sparrow is a bird," it penalizes outputs like P(sparrow) = 0.8 with P(bird) = 0.6.

      :::mixup "Train with a logic loss and the model will obey the rule."
      A loss term trades off against the other terms, so the trained model usually violates the rule less often, not never. If the rule must hold on every output, enforce it at prediction time too, for example by raising P(bird) to at least P(sparrow), or by filtering outputs through a solver.
      :::
  - id: neuro-symbolic-learning.s3
    title: AND and OR you can differentiate
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neuro-symbolic-learning
    markdown: |-
      Exact probabilistic logic gets expensive as rules pile up, because it must add up every combination of facts. A cheaper route is **differentiable logic**: treat truth values as numbers between 0 and 1 and replace each connective with a smooth formula. The fuzzy control lesson did the same with min for AND and mentioned the product as an alternative. Here AND can be the product $a \times b$; OR can be $a + b - ab$; and "a implies b" can be $1 - a + ab$. **Logic Tensor Networks** (Luciano Serafini and Artur d'Avila Garcez, 2016) build whole formulas this way, averaging over examples for "for all."

      Take "sparrow implies bird" with sparrow = 0.8 and bird = 0.6. Its truth is $1 - 0.8 + 0.8 \times 0.6 = 0.68$, so the loss $1 - \text{truth}$ is 0.32. The derivative of the truth with respect to bird is $a = 0.8$, so training pushes bird up. With respect to sparrow it's $b - 1 = -0.4$, so training also pushes sparrow down. The rule can be satisfied either way, and the data decides which.
  - id: neuro-symbolic-learning.s4
    title: Learn the program, not just the weights
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neuro-symbolic-learning
    markdown: |-
      So far the rules were given. **Program induction** learns the symbolic part itself: from examples, find a program that explains them. The lesson on program synthesis searched a fixed little language by brute force. Neural program induction trains a network to guide that search, predicting which building blocks a solution probably uses.

      **DreamCoder** (Kevin Ellis and colleagues, 2020) adds a third trick. It alternates between solving tasks, studying recurring pieces of its own solutions and adding them to its language as new building blocks, and retraining its neural guide. Over time its language grows, and later tasks need shorter programs.

      **AlphaGeometry** (DeepMind, 2024), from the lesson on combining symbolic and neural parts, is a proposer-plus-checker hybrid of this kind. A language model, trained on 100 million synthetic proofs, suggests an extra point or line; a symbolic deduction engine derives everything that follows. It solved 25 of 30 olympiad geometry problems in its benchmark.
  - id: neuro-symbolic-learning.s5
    title: When a hybrid is worth it
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neuro-symbolic-learning
    markdown: |-
      Hybrids help when you have knowledge that is **reliable and crisp**, and something the network can't get from data alone:

      | Situation | Why logic helps | Example |
      | --- | --- | --- |
      | Labels are indirect or scarce | Rules turn weak labels into training signal | Digits learned from sums |
      | Outputs must obey hard rules | Constraints rule out impossible answers | Schedules, hierarchies, chemistry |
      | Answers need long exact reasoning | A symbolic engine never tires or guesses | Geometry proofs |

      They hurt when the rules are wrong or incomplete (the network is forced to fit a false rule), when symbols can't be read reliably from raw input, or when exact inference blows up with many rules.

      And always test against a strong symbolic baseline. A 2024 follow-up to AlphaGeometry showed that classical methods alone, Wu's algebraic method combined with standard deduction, solved 21 of the 30 problems on a laptop, and that adding Wu's method to AlphaGeometry reached 27. The neural part mattered, but less than the headline suggested.
  - id: neuro-symbolic-learning.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.neuro-symbolic-learning
    markdown: Compute sum probabilities and fuzzy-logic truth values by hand, then decide whether logic belongs in the loss, at the output, or not at all for a pharmacy checker, a map reader, and a legal classifier.
    takeaway: |-
      Logic can sit inside training (a sum rule or semantic loss that sends gradients through the reasoning), as a differentiable formula, or as a hard check at the output. A loss makes violations rarer; only a hard check rules them out.
  - id: neuro-symbolic-learning.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.neuro-symbolic-learning
    markdown: |-
      Neural and symbolic components can share a task. A soft penalty encourages a rule; a hard constraint enforces its encoded form, while input facts can still be wrong.
