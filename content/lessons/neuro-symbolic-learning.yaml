assessment_families:
- id: neuro-symbolic-learning.base
  objective_ref: objective.neuro-symbolic-learning
  task: base
  response_type: single_choice
  points: 1
  hint: 'Penalize violations softly: trace the inputs, operation, and result before choosing.'
  remediation_scene: neuro-symbolic-learning.s2
  variants:
  - id: neuro-symbolic-learning.base.1
    prompt: Does a soft rule penalty guarantee zero violations?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if the rule is written in logic
    answer: a
    feedback: Finite penalties trade off against other objectives.
  - id: neuro-symbolic-learning.base.2
    prompt: Can a logically valid plan fail if perceived facts are wrong?
    options:
    - id: b
      text: 'No'
    - id: c
      text: Only if the solver is neural
    - id: a
      text: 'Yes'
    answer: a
    feedback: Reasoning correctness depends on its premises.
- id: neuro-symbolic-learning.transfer
  objective_ref: objective.neuro-symbolic-learning
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate the interface and the claim: trace the inputs, operation, and result before choosing.'
  remediation_scene: neuro-symbolic-learning.s4
  variants:
  - id: neuro-symbolic-learning.transfer.1
    prompt: What should a neuro-symbolic description specify?
    options:
    - id: b
      text: Only the label hybrid
    - id: c
      text: Only total parameters
    - id: a
      text: The interface between learned and symbolic computation
    answer: a
    feedback: The connection determines behavior and guarantees.
  - id: neuro-symbolic-learning.transfer.2
    prompt: Why compare component-only baselines?
    options:
    - id: c
      text: Only to fill a benchmark table
    - id: a
      text: To measure what the combination contributes
    - id: b
      text: To assume both components are unnecessary
    answer: a
    feedback: Ablations test the claimed benefit.
