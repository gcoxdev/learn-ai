assessment_families:
  - id: neuro-symbolic-learning.base
    objective_ref: objective.neuro-symbolic-learning
    task: base
    response_type: single_choice
    points: 1
    hint: 'Penalize violations softly: trace the inputs, operation, and result before choosing.'
    remediation_scene: neuro-symbolic-learning.s2
    variants:
      - id: neuro-symbolic-learning.base.1
        prompt: Does a soft rule penalty guarantee zero violations?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if the rule is written in logic
        answer: a
        feedback: Finite penalties trade off against other objectives.
        retired: true
      - id: neuro-symbolic-learning.base.2
        prompt: Can a logically valid plan fail if perceived facts are wrong?
        options:
          - id: b
            text: 'No'
          - id: c
            text: Only if the solver is neural
          - id: a
            text: 'Yes'
        answer: a
        feedback: Reasoning correctness depends on its premises.
        retired: true
  - id: neuro-symbolic-learning.transfer
    objective_ref: objective.neuro-symbolic-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate the interface and the claim: trace the inputs, operation, and result before choosing.'
    remediation_scene: neuro-symbolic-learning.s4
    variants:
      - id: neuro-symbolic-learning.transfer.1
        prompt: What should a neuro-symbolic description specify?
        options:
          - id: b
            text: Only the label hybrid
          - id: c
            text: Only total parameters
          - id: a
            text: The interface between learned and symbolic computation
        answer: a
        feedback: The connection determines behavior and guarantees.
        retired: true
      - id: neuro-symbolic-learning.transfer.2
        prompt: Why compare component-only baselines?
        options:
          - id: c
            text: Only to fill a benchmark table
          - id: a
            text: To measure what the combination contributes
          - id: b
            text: To assume both components are unnecessary
        answer: a
        feedback: Ablations test the claimed benefit.
        retired: true
  - id: neuro-symbolic-learning.base.v2
    objective_ref: objective.neuro-symbolic-learning
    task: base
    response_type: single_choice
    points: 1
    hint: Ask where the logic sits. Inside the loss, it shapes training and makes violations rarer; at the output, it enforces the rule on every prediction; as a proposer-checker, it verifies what the network suggests.
    remediation_scene: neuro-symbolic-learning.s2
    variants:
      - id: neuro-symbolic-learning.base.v2.1
        prompt: In the digit-sum setup, how does the network get a training signal for each image when only the sum is labeled?
        options:
          - id: b
            text: The logic program guesses a digit for each image and uses it as a hard label
          - id: a
            text: The loss is the probability of the sum, and its gradient flows back through the logic
          - id: c
            text: The images are clustered first, and the sums name the clusters afterward
        answer: a
        feedback: The program computes P(sum) from the network's digit probabilities with sums and products, which are differentiable, so the gradient reaches each image's outputs. No hard guess is made; all consistent digit pairs share the credit in proportion to their probability.
      - id: neuro-symbolic-learning.base.v2.2
        prompt: A classifier is trained with a semantic loss for "every sparrow is a bird." On test photos, 3% of outputs still give P(sparrow) above P(bird). What explains this?
        options:
          - id: a
            text: The loss term trades off against other terms, so it reduces violations
          - id: c
            text: The semantic loss was computed wrong, since it rules out violations
          - id: b
            text: Test photos bypass the loss, so the rule has no effect on them
        answer: a
        feedback: A penalty makes violations rarer during training, but it competes with the rest of the loss and doesn't bind at test time. The rule did affect the learned weights; to rule out violations on every output, enforce the constraint when predicting.
      - id: neuro-symbolic-learning.base.v2.3
        prompt: Using the product for AND and 1 − a + ab for "a implies b," what happens during training to a rule "sparrow implies bird" whose truth is below 1?
        options:
          - id: c
            text: P(bird) rises and P(sparrow) stays, since the rule concludes bird
          - id: b
            text: P(sparrow) falls and P(bird) stays, since sparrow is the premise
          - id: a
            text: P(bird) is pushed up and P(sparrow) is pushed down
        answer: a
        feedback: The truth value's derivative is a with respect to bird and b − 1 with respect to sparrow, so gradients push on both. The rule can be satisfied by raising the conclusion or lowering the premise, and the data decides which wins.
      - id: neuro-symbolic-learning.base.v2.4
        prompt: What does DreamCoder do that a fixed-language program synthesizer does not?
        options:
          - id: b
            text: It replaces the program search with a neural network's direct answer
          - id: a
            text: It adds recurring pieces of its solutions to its language as new blocks
          - id: c
            text: It checks every candidate program with a formal proof assistant
        answer: a
        feedback: DreamCoder grows its own library of building blocks from its solutions, so later tasks need shorter programs. It still searches for programs, with a neural network guiding the search rather than replacing it.
  - id: neuro-symbolic-learning.transfer.v2
    objective_ref: objective.neuro-symbolic-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: Check whether the rule is reliable, whether it must hold on every output, and whether a strong symbolic-only baseline was tried.
    remediation_scene: neuro-symbolic-learning.s5
    variants:
      - id: neuro-symbolic-learning.transfer.v2.1
        prompt: A pharmacy app's model suggests drug doses, and a regulation sets a hard maximum dose for each drug. Where should the maximum be enforced?
        options:
          - id: b
            text: As a penalty term in the training loss, so the model learns the limit
          - id: a
            text: As a hard check on every output, with training penalties as a bonus
          - id: c
            text: Nowhere, since the model can learn the limit from past prescriptions
        answer: a
        feedback: A rule that must hold on every output belongs in a hard check at prediction time. A training penalty can help the model learn it too, but penalties only make violations rarer, and past data may contain errors.
      - id: neuro-symbolic-learning.transfer.v2.2
        prompt: A team adds the rule "roads never cross rivers without a bridge" to a map-reading network's loss. Accuracy drops, and they discover many real fords where roads cross rivers. What went wrong?
        options:
          - id: c
            text: The penalty weight was too small to make the rule stick well
          - id: a
            text: The rule is false for real maps, so it taught wrong answers
          - id: b
            text: Logic losses work only with probabilistic logic programs
        answer: a
        feedback: Hybrids pay off when the knowledge is reliable. A rule with real exceptions forces the network to fit something false. A larger weight would make things worse, and logic losses work with ordinary networks.
      - id: neuro-symbolic-learning.transfer.v2.3
        prompt: A paper reports that its neuro-symbolic legal classifier beats a plain neural network. Which comparison would most strengthen the claim?
        options:
          - id: a
            text: A strong rules-only baseline built from the same legal knowledge
          - id: b
            text: A larger plain neural network trained for twice as long
          - id: c
            text: A survey of lawyers rating how readable the rules look
        answer: a
        feedback: As with AlphaGeometry and Wu's method, the symbolic part alone may explain much of the gain. Comparing against rules-only and neural-only baselines shows what the combination adds. Readability ratings don't measure accuracy.
      - id: neuro-symbolic-learning.transfer.v2.4
        prompt: A factory has few labeled photos of assembled parts but a reliable rulebook, such as "a bracket always has exactly four bolts." Why might a logic loss help here?
        options:
          - id: b
            text: It replaces the need for any photos of the parts at all
          - id: c
            text: It makes the network's decisions fully explainable
          - id: a
            text: It turns the rulebook into training signal on unlabeled photos
        answer: a
        feedback: A constraint like "exactly four bolts" can be scored on any photo, labeled or not, so it adds signal where labels are scarce. The network still needs images to learn from, and a loss term doesn't explain its internal reasoning.
  - id: neuro-symbolic-learning.calculate
    objective_ref: objective.neuro-symbolic-learning
    task: base
    response_type: numeric
    points: 1
    hint: For a sum, list every digit pair that makes it, multiply each pair's probabilities, and add. For a fuzzy implication, use 1 − a + ab.
    remediation_scene: neuro-symbolic-learning.s1
    absolute_tolerance: 0.005
    variants:
      - id: neuro-symbolic-learning.calculate.1
        prompt: Image 1 has P(0) = 0.5, P(1) = 0.5; image 2 has P(0) = 0.2, P(1) = 0.8 (digits 0 and 1 only). What is P(sum = 1)?
        answer: 0.5
        feedback: Sum 1 comes from (0, 1) or (1, 0) = 0.5 × 0.8 + 0.5 × 0.2 = 0.4 + 0.1 = 0.5.
      - id: neuro-symbolic-learning.calculate.2
        prompt: Using the lesson's table (image 1 is 0.2, 0.7, 0.1 for digits 0, 1, 2; image 2 is 0.6, 0.3, 0.1), what is P(sum = 1)?
        answer: 0.48
        feedback: Sum 1 comes from (0, 1) or (1, 0) = 0.2 × 0.3 + 0.7 × 0.6 = 0.06 + 0.42 = 0.48.
      - id: neuro-symbolic-learning.calculate.3
        prompt: With the implication formula 1 − a + ab, what is the truth of "sparrow implies bird" when sparrow = 0.9 and bird = 0.5?
        answer: 0.55
        feedback: 1 − 0.9 + 0.9 × 0.5 = 0.1 + 0.45 = 0.55.
      - id: neuro-symbolic-learning.calculate.4
        prompt: Using the lesson's table, what is P(sum = 4), which needs both digits to be 2?
        answer: 0.01
        feedback: Only (2, 2) makes 4, so P = 0.1 × 0.1 = 0.01, and the loss −ln 0.01 ≈ 4.6 is large.
      - id: neuro-symbolic-learning.calculate.5
        prompt: A model gives P(sum = label) = 0.5. What is the training loss −ln P? Give a decimal.
        answer: 0.693
        feedback: −ln 0.5 ≈ 0.693. Pushing P toward 1 drives the loss toward 0.
