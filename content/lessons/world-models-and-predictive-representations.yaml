objectives:
- id: objective.world-models-and-predictive-representations
  version: 1-draft
  statement: World models learn predictive representations or dynamics for observations and actions; latent
    prediction can support planning without requiring pixel generation or proving a complete causal model.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - world-models-and-predictive-representations.base
  - world-models-and-predictive-representations.transfer
