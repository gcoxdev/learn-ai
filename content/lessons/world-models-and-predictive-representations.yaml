assessment_families:
  - id: world-models-and-predictive-representations.base
    objective_ref: objective.world-models-and-predictive-representations
    task: base
    response_type: single_choice
    points: 1
    hint: 'Predict representations instead of every pixel: trace the inputs, operation, and result before choosing.'
    remediation_scene: world-models-and-predictive-representations.s2
    variants:
      - id: world-models-and-predictive-representations.base.1
        prompt: What additional input defines action-conditioned dynamics?
        options:
          - id: b
            text: Only a longer model name
          - id: c
            text: A random caption necessarily
          - id: a
            text: The action being evaluated
        answer: a
        feedback: The model predicts consequences conditional on a chosen action.
        retired: true
      - id: world-models-and-predictive-representations.base.2
        prompt: Must a useful world model reconstruct every pixel?
        options:
          - id: c
            text: Only in all planning tasks
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Latent predictions can support decisions.
        retired: true
  - id: world-models-and-predictive-representations.transfer
    objective_ref: objective.world-models-and-predictive-representations
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Validate planning use independently: trace the inputs, operation, and result before choosing.'
    remediation_scene: world-models-and-predictive-representations.s4
    variants:
      - id: world-models-and-predictive-representations.transfer.1
        prompt: Why is a constant predicted representation undesirable?
        options:
          - id: c
            text: It preserves all visual details
          - id: a
            text: It is predictable but carries little useful distinction
          - id: b
            text: It guarantees perfect planning
        answer: a
        feedback: Predictive objectives need safeguards against trivial collapse.
        retired: true
      - id: world-models-and-predictive-representations.transfer.2
        prompt: Why evaluate multi-step rollouts separately?
        options:
          - id: a
            text: Prediction errors can compound over imagined steps
          - id: b
            text: One-step accuracy proves every horizon
          - id: c
            text: Actions cannot change uncertainty
        answer: a
        feedback: Long-horizon use introduces additional failure modes.
        retired: true
  - id: world-models-and-predictive-representations.base.v2
    objective_ref: objective.world-models-and-predictive-representations
    task: base
    response_type: single_choice
    points: 1
    hint: Ask what the model is asked to predict (pixels or representations), what it's fed during a rollout (real states or its own guesses), and what stops the targets from collapsing.
    remediation_scene: world-models-and-predictive-representations.s2
    variants:
      - id: world-models-and-predictive-representations.base.v2.1
        prompt: A pixel-predicting video model must forecast a flag that will flap left or right with equal chance. Trained with squared error, what does it tend to predict?
        options:
          - id: b
            text: One of the two directions, picked at random each time
          - id: a
            text: A blurry average of the two possible positions
          - id: c
            text: The flag's current position, since it can't know which way
        answer: a
        feedback: Squared error is minimized by the average of the possible outcomes, so each uncertain pixel becomes a blend, which looks like blur. Predicting a representation lets the model say "flapping" without choosing pixels.
      - id: world-models-and-predictive-representations.base.v2.2
        prompt: During JEPA-style training, the loss suddenly falls to almost zero, and every image gets nearly the same representation. What happened?
        options:
          - id: a
            text: Representation collapse, a trivial solution where every prediction is right
          - id: c
            text: The predictor has learned the images well enough to stop improving
          - id: b
            text: The target encoder has fully caught up with the context encoder
        answer: a
        feedback: If every input maps to one vector, predicting it is trivial and useless. A falling loss with identical representations is the signature. JEPA-style methods guard against it with an EMA target encoder that gets no gradients.
      - id: world-models-and-predictive-representations.base.v2.3
        prompt: A world model is 0.1 ft off on every single step when started from the true state, but 2.7 ft off after an 8-step rollout. Why the difference?
        options:
          - id: c
            text: The rollout used a larger step size than the one-step test
          - id: b
            text: The one-step test was measured on the training data by mistake
          - id: a
            text: In a rollout each step starts from the model's own earlier errors
        answer: a
        feedback: Fed its own predictions, the model carries every past mistake forward, and a wrong speed estimate makes later steps worse still. That's compounding error, and only a rollout test at the planning horizon measures it.
      - id: world-models-and-predictive-representations.base.v2.4
        prompt: In I-JEPA, the target encoder's weights follow an exponential moving average of the context encoder's weights with m = 0.996. What does that mean?
        options:
          - id: b
            text: The target encoder copies the context encoder exactly every 996 steps
          - id: a
            text: Each step, the target weights move 0.4% of the way toward the context weights
          - id: c
            text: The target encoder gets 99.6% of the gradient of the context encoder
        answer: a
        feedback: θ̄ ← 0.996 θ̄ + 0.004 θ moves the target a small fraction of the gap each step, making it a slow, smoothed copy. It gets no gradient at all, which is part of what prevents collapse.
  - id: world-models-and-predictive-representations.transfer.v2
    objective_ref: objective.world-models-and-predictive-representations
    task: transfer
    response_type: single_choice
    points: 1
    hint: Check whether the data contains the actions the plan will take, and whether the test covers the horizon and the rare cases the plan will face.
    remediation_scene: world-models-and-predictive-representations.s3
    variants:
      - id: world-models-and-predictive-representations.transfer.v2.1
        prompt: A warehouse robot's world model was trained on hours of video of human workers, with no record of the robot's own commands. It must now choose between "push" and "lift". What is missing?
        options:
          - id: b
            text: Higher-resolution video so the boxes are easier to see
          - id: a
            text: Data linking the robot's actions to what happened next
          - id: c
            text: A pixel decoder so the predicted futures can be viewed
        answer: a
        feedback: Passive video teaches how scenes usually change, not the consequences of the robot's own choices. Action-labeled data, or inferred latent actions, supply that link. Resolution and a decoder don't.
      - id: world-models-and-predictive-representations.transfer.v2.2
        prompt: A game studio wants a playable world model from thousands of hours of gameplay videos that have no controller logs. Which approach fits?
        options:
          - id: a
            text: Learn a small set of latent actions that explain frame-to-frame changes
          - id: c
            text: Train a next-frame predictor with no action input and let players steer it
          - id: b
            text: Label every frame's button presses by hand before any training starts
        answer: a
        feedback: This is Genie's approach. A latent action model infers a few discrete actions from consecutive frames, which players can then choose. A model without action input can't be steered, and hand-labeling thousands of hours is impractical.
      - id: world-models-and-predictive-representations.transfer.v2.3
        prompt: A weather model is very accurate 6 hours ahead. A shipping company wants to plan 5-day routes with it. What should they check first?
        options:
          - id: c
            text: Whether the 6-hour accuracy holds for the ports on their routes
          - id: a
            text: How accurate its 5-day rollouts are, fed its own forecasts
          - id: b
            text: Whether its forecast maps look realistic to experienced sailors
        answer: a
        feedback: Errors compound over a rollout, so short-range accuracy says little about day 5. Realistic-looking maps can hide large errors, and checking 6-hour accuracy at the ports repeats the short-horizon test.
      - id: world-models-and-predictive-representations.transfer.v2.4
        prompt: A self-driving team's world model predicts ordinary traffic very well, but its forecasts are poor when a car ahead brakes hard. What is the most likely reason?
        options:
          - id: a
            text: Hard braking is rare in the training video, so its dynamics are poorly learned
          - id: b
            text: The model predicts representations, which can't describe sudden events
          - id: c
            text: The model's rollouts are too short to cover a braking event
        answer: a
        feedback: A world model is weakest where its data is thin, and emergencies are rare. Representations can describe sudden change fine, and hard braking unfolds within a second or two, well inside a short rollout.
  - id: world-models-and-predictive-representations.calculate
    objective_ref: objective.world-models-and-predictive-representations
    task: base
    response_type: numeric
    points: 1
    hint: Step the model forward using its own previous prediction each time, step the truth forward separately, then subtract the final positions.
    remediation_scene: world-models-and-predictive-representations.s5
    absolute_tolerance: 0.01
    variants:
      - id: world-models-and-predictive-representations.calculate.1
        prompt: A cyclist rides at a steady 4 ft/s. A learned model predicts 4.5 ft/s. Starting from the same position, what is the position error after a 4-step rollout of 1-second steps?
        answer: 2
        feedback: The model gains 0.5 ft on the truth every step, so after 4 steps it is 4 × 0.5 = 2 ft ahead (18 ft versus 16 ft).
      - id: world-models-and-predictive-representations.calculate.2
        prompt: A robot arm really moves 2.0 inches per command. Its world model predicts 2.2 inches. After a 10-command rollout from the same start, how many inches off is the prediction?
        answer: 2
        feedback: 0.2 inches extra per command, times 10 commands, is 2 inches (22 inches predicted versus 20 inches real).
      - id: world-models-and-predictive-representations.calculate.3
        prompt: A cart starts at position 0 with speed 5 and truly keeps that speed. A model updates position = position + speed, then speed = 1.1 × speed, each step. After 3 steps, how far is the model's position from the truth?
        answer: 1.55
        feedback: The model's positions are 5, 5 + 5.5 = 10.5, then 10.5 + 6.05 = 16.55. The truth is 15, so the error is 1.55. The error grows each step because the speed error compounds.
      - id: world-models-and-predictive-representations.calculate.4
        prompt: A ball starts at 0 with speed 2 and keeps it. A model updates position = position + speed, then speed = 1.2 × speed, each step. After 2 steps, how far is the model's position from the truth?
        answer: 0.4
        feedback: The model goes to 2 (speed becomes 2.4), then to 4.4. The truth is 4, so the error is 0.4.
