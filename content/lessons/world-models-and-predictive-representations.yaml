scenes:
- id: world-models-and-predictive-representations.s1
  title: Predict consequences from a state
  type: explanation
  depth: intuition
  objective_refs:
  - objective.world-models-and-predictive-representations
  markdown: 'A learned dynamics model can estimate a next state or observation from the current representation
    and action. A planner can roll it forward to compare possible action sequences. Errors compound across
    imagined steps, especially outside the data distribution used to learn the model.


    Imagine a toy cart at position 2. A learned rule predicts that a “move right” action adds 1, so two imagined
    moves predict positions 3 and 4. If the real cart moves only 0.8 per action, it reaches 3.6 instead. A
    rollout is this chain of predictions. A latent state is a compact internal description, such as estimated
    position and speed, rather than a complete picture of the cart.'
  text_mode: 'A learned dynamics model can estimate a next state or observation from the current representation
    and action. A planner can roll it forward to compare possible action sequences. Errors compound across
    imagined steps, especially outside the data distribution used to learn the model.


    Imagine a toy cart at position 2. A learned rule predicts that a “move right” action adds 1, so two imagined
    moves predict positions 3 and 4. If the real cart moves only 0.8 per action, it reaches 3.6 instead. A
    rollout is this chain of predictions. A latent state is a compact internal description, such as estimated
    position and speed, rather than a complete picture of the cart.'
  bridges: []
- id: world-models-and-predictive-representations.s2
  title: Predict representations instead of every pixel
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.world-models-and-predictive-representations
  markdown: A joint-embedding predictive architecture predicts target representations from context representations
    under a defined training scheme. Avoiding full pixel reconstruction can focus learning on useful structure.
    The learned target and collapse-prevention mechanisms matter; a constant representation would be easy to
    predict but uninformative.
  text_mode: A joint-embedding predictive architecture predicts target representations from context representations
    under a defined training scheme. Avoiding full pixel reconstruction can focus learning on useful structure.
    The learned target and collapse-prevention mechanisms matter; a constant representation would be easy to
    predict but uninformative.
  bridges: []
- id: world-models-and-predictive-representations.s3
  title: Separate passive observation from intervention
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.world-models-and-predictive-representations
  markdown: Video observation can teach correlations about how scenes evolve. Action-conditioned data adds
    evidence about consequences of particular actions, but confounding and coverage still matter. A model that
    predicts normal driving video may fail when asked to evaluate an unusual control sequence.
  text_mode: Video observation can teach correlations about how scenes evolve. Action-conditioned data adds
    evidence about consequences of particular actions, but confounding and coverage still matter. A model that
    predicts normal driving video may fail when asked to evaluate an unusual control sequence.
  bridges: []
- id: world-models-and-predictive-representations.s4
  title: Validate planning use independently
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.world-models-and-predictive-representations
  markdown: Test one-step prediction, multi-step rollout, task success, uncertainty, and behavior under changed
    conditions. A useful latent model need not generate photorealistic images. Conversely, convincing generated
    scenes do not establish reliable control, causal identification, or safe transfer to the physical world.
  text_mode: Test one-step prediction, multi-step rollout, task success, uncertainty, and behavior under changed
    conditions. A useful latent model need not generate photorealistic images. Conversely, convincing generated
    scenes do not establish reliable control, causal identification, or safe transfer to the physical world.
  bridges: []
