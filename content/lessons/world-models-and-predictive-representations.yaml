schema_version: 0.2-draft
lesson:
  id: world-models-and-predictive-representations
  version: 0.4.0-draft
  title: Predict what may happen next, with or without actions
  state: draft
  summary: A model that's only 0.1 feet off per step can be nearly 3 feet off four seconds later. Meet world models, and the idea of predicting meaning instead of pixels.
  slot: M23.7
  category: learning
  sources:
    - title: "World Models (Ha & Schmidhuber, 2018)"
      url: https://arxiv.org/abs/1803.10122
    - title: "A Path Towards Autonomous Machine Intelligence (LeCun, 2022)"
      url: https://openreview.net/forum?id=BZ5a1r-kVsf
    - title: "Self-Supervised Learning from Images with a Joint-Embedding Predictive Architecture (I-JEPA; Assran et al., 2023)"
      url: https://arxiv.org/abs/2301.08243
    - title: "Revisiting Feature Prediction for Learning Visual Representations from Video (V-JEPA; Bardes et al., 2024)"
      url: https://arxiv.org/abs/2404.08471
    - title: "Genie: Generative Interactive Environments (Bruce et al., 2024)"
      url: https://arxiv.org/abs/2402.15391
    - title: "V-JEPA 2: Self-Supervised Video Models Enable Understanding, Prediction and Planning (Assran et al., 2025)"
      url: https://arxiv.org/abs/2506.09985
objectives:
  - id: objective.world-models-and-predictive-representations
    version: 2-draft
    statement: World models learn predictive representations or dynamics for observations and actions; latent prediction can support planning without requiring pixel generation or proving a complete causal model.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - world-models-and-predictive-representations.base.v2
      - world-models-and-predictive-representations.transfer.v2
      - world-models-and-predictive-representations.calculate
    prerequisites:
      - anyOf:
          - objective.state-space-sequences
      - anyOf:
          - objective.planning-under-uncertainty
scenes:
  - id: world-models-and-predictive-representations.s1
    title: Where will the cyclist be in two seconds?
    type: explanation
    depth: intuition
    objective_refs:
      - objective.world-models-and-predictive-representations
    markdown: |-
      Amara stands at a crossing. Lumen's camera sees a cyclist 8 feet away, riding toward her path at about 4 feet per second. The useful question isn't "what's in this frame?" but "what will the next frames show if Amara steps out now?"

      A **world model** predicts how a situation will change, often given an action. It usually works on a compact summary of the scene, the **latent state** $z_t$, such as "cyclist at 8 ft, moving at 4 ft/s toward the crossing", and learns a **dynamics** function:

      $$z_{t+1} = f(z_t, a_t)$$

      where $a_t$ is the action, here "step forward" or "wait". Chaining predictions, $z_{t+1}$ then $z_{t+2}$ and so on, is a **rollout**: an imagined future. A planner can roll out each action and pick the best imagined future without trying risky ones for real.

      :::story The agent that trained in its dream
      Ha and Schmidhuber's 2018 paper *World Models* paired a variational autoencoder, which squeezed each game frame into a small latent vector, with a recurrent network that predicted the next vector given an action. In the first-person game VizDoom, they trained a tiny controller entirely inside the model's rollouts, its "dream", and it still worked in the real game.
      :::

      The next module's lesson on model-based reinforcement learning builds on this: Dreamer trains policies on imagined rollouts, and MuZero plans with a learned model.
    bridges: []
  - id: world-models-and-predictive-representations.s5
    title: Small errors, long rollouts
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.world-models-and-predictive-representations
    markdown: |-
      Suppose Lumen's learned dynamics are slightly off: they move the cyclist 5% too far each half-second step, and they think its steady speed creeps up 3% per step. How bad is that?

      ```python run
      dt = 0.5                                   # seconds per step

      def true_step(pos, speed):                 # the cyclist holds a steady speed
          return pos + speed * dt, speed

      def model_step(pos, speed):                # learned model: 5% fast, and thinks speed creeps up 3%
          return pos + 1.05 * speed * dt, speed * 1.03

      true_state = (0.0, 4.0)                    # (feet travelled, feet per second)
      imagined = true_state
      for step in range(1, 9):
          one_step = model_step(*true_state)     # predict one step from the REAL current state
          true_state = true_step(*true_state)
          imagined = model_step(*imagined)       # keep feeding the model its own predictions
          print(f"t={step * dt:.1f}s  true {true_state[0]:5.2f} ft | "
                f"one-step error {abs(one_step[0] - true_state[0]):.2f} ft | "
                f"rollout error {abs(imagined[0] - true_state[0]):.2f} ft")
      ```

      Judged one step at a time, from the real current state, the model is off by just 0.10 ft every step. Fed its own predictions for eight steps, it's off by 2.67 ft, because each step starts from the previous step's mistakes. This is **compounding error**, and it's the central weakness of long rollouts.

      :::predict What happens to the 4-second rollout error if you remove the speed creep (change `1.03` to `1.00`) but keep the 5% overshoot?
      The error grows in a straight line instead of curving upward: 0.10 ft per step, so 0.80 ft after 8 steps. A wrong *position* rule adds a fixed error each step; a wrong *speed* rule makes each step's error bigger than the last.
      :::

      So test a world model on rollouts as long as the plans that use it, and plan over short horizons that re-check reality often. Lumen re-reads the camera every half-second rather than trusting a 4-second forecast.
    bridges: []
  - id: world-models-and-predictive-representations.s2
    title: Predict meaning, not pixels
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.world-models-and-predictive-representations
    markdown: |-
      The obvious way to learn dynamics from video is to predict the next frame's pixels, and it has a revealing flaw. Suppose a leaf behind the cyclist will flutter left or right, equally likely, so a pixel on the left will be bright (1) or dark (0). The prediction that minimizes squared error is the average, 0.5: gray. Every uncertain detail turns to blur, and capacity goes to leaves when what matters is the cyclist.

      In a 2022 position paper, *A Path Towards Autonomous Machine Intelligence*, Yann LeCun proposed predicting representations instead: the **joint-embedding predictive architecture (JEPA)**. Its image version, I-JEPA (Assran et al., 2023), hides a few blocks of an image and has three parts:

      1. A **context encoder** reads the visible part.
      2. A **target encoder** reads the whole image; its outputs for the hidden blocks are the targets.
      3. A **predictor** takes the context representation plus the hidden blocks' positions and guesses those targets.

      The loss never touches pixels, so the model can represent "a leaf that moves" without committing to which way.

      :::papers The I-JEPA objective
      $$\mathcal{L} = \frac{1}{M}\sum_{i=1}^{M} \sum_{j \in B_i} \big\lVert \hat{s}_{y_j} - s_{y_j} \big\rVert_2^2 \qquad \bar{\theta} \leftarrow m\,\bar{\theta} + (1 - m)\,\theta$$

      $s_{y_j}$ is the target encoder's representation of patch $j$ in hidden block $B_i$ (one of $M$ blocks); $\hat{s}_{y_j}$ is the guess. The target weights $\bar\theta$ get no gradients; they trail the context encoder's weights $\theta$ as an exponential moving average (EMA). With $m = 0.996$, a target weight at 1.000 whose partner is 2.000 moves to $0.996 \times 1 + 0.004 \times 2 = 1.004$.
      :::

      :::mixup "The easiest way to lower a representation-prediction loss is to predict really well."
      The *easiest* way is **representation collapse**: if both encoders output one vector for every input, the prediction is perfect and useless. Pixel targets can't collapse, since the pixels are fixed. Representation targets can, which is why JEPA's target encoder is a slow EMA copy with no gradients of its own.
      :::

      V-JEPA (Bardes et al., 2024) did the same for video, hiding regions across space *and* time, and learned from video alone: no text, labels, or pixel reconstruction.
    bridges: []
  - id: world-models-and-predictive-representations.s3
    title: Watching isn't the same as acting
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.world-models-and-predictive-representations
    markdown: |-
      Most internet video has no action labels. Watch a million cyclists and you learn how they usually move, but not what happens when *you* step into their path. Passive video teaches $z_{t+1}$ from $z_t$; planning needs $z_{t+1}$ from $z_t$ *and* $a_t$.

      **Genie** (Bruce et al., DeepMind, 2024) found a way around missing labels. It trained on internet videos of 2D platform games, with no record of the buttons pressed. Besides a video tokenizer and a dynamics model, it learned a **latent action model**: given two consecutive frames, infer which of just 8 discrete "actions" best explains the change. Nobody labeled the codes, yet they came to mean consistent moves, such as "left". At play time a person picks one of the 8 each step, and the 11-billion-parameter model generates the next frame: a playable world from a single image.

      Meta's V-JEPA 2 (Assran et al., 2025) took the other route. After pretraining on passive video, it added an action-conditioned predictor trained on a small amount of robot-arm video that did record actions. The robot then planned by rolling out candidate actions in representation space and picking those whose predicted outcome was closest to a goal image.

      For Lumen, street video shows people *waiting* at crossings far more often than stepping out in front of a bike, so its predictions are weakest exactly where the stakes are highest.
    bridges: []
  - id: world-models-and-predictive-representations.s4
    title: Check the forecast before trusting the plan
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.world-models-and-predictive-representations
    markdown: |-
      Before Lumen says "safe to cross", its world model must pass tests at the length it will actually be used, on the situations that matter:

      | Test | Question | Lumen example |
      | --- | --- | --- |
      | One-step accuracy | Is each single prediction close? | Cyclist position 0.5 s ahead |
      | Rollout accuracy | Does error stay small over the planning horizon? | Position 2 s ahead, fed its own predictions |
      | Rare actions | Is it right when the action is unusual in the training data? | Predictions when a pedestrian steps out |
      | Task success | Do plans made with it work? | Crossing advice checked against what really happened |

      A world model that paints beautiful future frames can still fail the last row, and one that never draws a pixel can pass it. What counts is whether predicted consequences match real ones over the planner's horizon. The next lesson turns this habit into a full evaluation of the whole assistant.
    bridges: []
  - id: world-models-and-predictive-representations.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.world-models-and-predictive-representations
    markdown: Rollouts to step through by hand, plus a warehouse robot, a weather forecaster, and a game studio, test whether you can reason about latent prediction, collapse, and compounding error.
    takeaway: |-
      A world model predicts the next latent state from the current one and an action, so a planner can try actions in imagination. Predict representations rather than pixels to skip unpredictable detail, prevent collapse with an EMA target, and test rollouts at the length you'll plan over.
  - id: world-models-and-predictive-representations.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.world-models-and-predictive-representations
    markdown: |-
      A world model predicts observations or action consequences. It can help a planner compare possibilities, but errors can grow as predictions are rolled forward.
