schema_version: 0.2-draft
lesson:
  id: search-growth
  version: 0.2.0-draft
  title: Why a small choice can create a huge search
  state: draft
  summary: Draw a tree of choices, count the work at successive depths, and explain what a search budget can and
    cannot establish.
  slot: M02.5
  category: learning
  sources:
  - title: 'Poole and Mackworth: graph searching'
    url: https://artint.info/3e/html/ArtInt3e.Ch3.S3.html
  archetype: mechanism
objectives:
- id: objective.search-growth
  version: 2-draft
  statement: Distinguish last-level paths from all visited tree nodes, calculate their growth, and interpret a stopped
    or pruned search under its assumptions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - search-growth.base.v2
  - search-growth.transfer.v2
  prerequisites:
  - anyOf:
    - objective.discrete-math
  - anyOf:
    - objective.algorithm-cost
scenes:
- id: search-growth.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.search-growth
  title: Turn a sequence of choices into a tree
  markdown: 'Imagine a robot choosing left or right at each of three intersections. A **search tree** records possible
    choice sequences. Its starting point is the **root**, at depth zero. Each connection, called an edge, represents
    one choice; each node records the position reached in that hypothetical sequence.


    The **depth** counts choices made from the root. The **branching factor** is the number of next choices. Our
    simplified tree has branching factor 2 everywhere, no early endings, and no repeated states merged together.
    Those assumptions make the count easy enough to draw by hand.'
  text_mode: 'Imagine a robot choosing left or right at each of three intersections. A **search tree** records possible
    choice sequences. Its starting point is the **root**, at depth zero. Each connection, called an edge, represents
    one choice; each node records the position reached in that hypothetical sequence.


    The **depth** counts choices made from the root. The **branching factor** is the number of next choices. Our
    simplified tree has branching factor 2 everywhere, no early endings, and no repeated states merged together.
    Those assumptions make the count easy enough to draw by hand.'
  bridges:
  - discrete-math
- id: search-growth.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.search-growth
  title: Count one level at a time
  markdown: 'At depth zero there is one starting node. One choice produces two nodes. Each of those produces two
    more, giving four nodes at depth two. A third choice gives eight nodes at depth three.


    Writing 2³ means 2 × 2 × 2, which is 8. In this full tree, eight distinct three-choice paths reach the last
    level. They are not the total number of nodes considered along the way. The earlier levels still existed. Draw
    them or list the level sizes before deciding what a question asks you to count.'
  text_mode: 'At depth zero there is one starting node. One choice produces two nodes. Each of those produces two
    more, giving four nodes at depth two. A third choice gives eight nodes at depth three.


    Writing 2³ means 2 × 2 × 2, which is 8. In this full tree, eight distinct three-choice paths reach the last
    level. They are not the total number of nodes considered along the way. The earlier levels still existed. Draw
    them or list the level sizes before deciding what a question asks you to count.'
  bridges:
  - arithmetic
- id: search-growth.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.search-growth
  title: Last level and whole tree are different counts
  markdown: 'For our binary tree through depth three, the level sizes are 1, 2, 4, and 8. Adding them gives 15 nodes
    in the whole tree. If generating or visiting each node costs one unit in our toy accounting, reaching all levels
    through depth three costs 15 units.


    With three choices at each step, depths zero through three contain 1, 3, 9, and 27 nodes: 40 total. The deepest
    level alone has 27. We are counting a complete tree, not predicting an exact runtime for a real search algorithm,
    which may stop early or avoid repeats.'
  text_mode: 'For our binary tree through depth three, the level sizes are 1, 2, 4, and 8. Adding them gives 15
    nodes in the whole tree. If generating or visiting each node costs one unit in our toy accounting, reaching
    all levels through depth three costs 15 units.


    With three choices at each step, depths zero through three contain 1, 3, 9, and 27 nodes: 40 total. The deepest
    level alone has 27. We are counting a complete tree, not predicting an exact runtime for a real search algorithm,
    which may stop early or avoid repeats.'
  bridges: []
- id: search-growth.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.search-growth
  title: Watch another step multiply the possibilities
  markdown: 'For constant branching factor b and depth d, a complete last level has b multiplied by itself d times,
    written bᵈ. Extending the tree by one level multiplies the last-level count by b. That is **exponential growth**
    with depth when b is greater than 1.


    At branching factor 2, depth ten has 1,024 last-level paths; depth eleven has 2,048. One extra decision doubles
    this count. Faster hardware may let us explore more paths, but repeated doubling can quickly consume the extra
    capacity. The cost bridge compares this pattern with a simple scan through a list.'
  text_mode: 'For constant branching factor b and depth d, a complete last level has b multiplied by itself d times,
    written bᵈ. Extending the tree by one level multiplies the last-level count by b. That is **exponential growth**
    with depth when b is greater than 1.


    At branching factor 2, depth ten has 1,024 last-level paths; depth eleven has 2,048. One extra decision doubles
    this count. Faster hardware may let us explore more paths, but repeated doubling can quickly consume the extra
    capacity. The cost bridge compares this pattern with a simple scan through a list.'
  bridges:
  - algorithm-cost
- id: search-growth.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.search-growth
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: More choices at each step multiply the number of possible paths. A search result must be interpreted
    together with its budget and pruning rules.
- id: search-growth.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.search-growth
  markdown: Branching, depth, runtime, and working memory determine whether a search procedure is practical even
    when every individual step is simple.
  text_mode: Branching, depth, runtime, and working memory determine whether a search procedure is practical even
    when every individual step is simple.
- id: search-growth.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.search-growth
  title: A budget is a stopping rule, not a proof
  markdown: 'Suppose a program can generate at most ten nodes. It cannot generate our entire fifteen-node tree.
    If it stops without finding a goal, the unexplored part may still contain a solution.


    **Pruning** removes branches from consideration. Some pruning is justified by a rule proving that a branch cannot
    contain an acceptable solution. Other pruning keeps only promising candidates according to a **heuristic**,
    an estimate used to guide search. An estimate can be wrong. Record which branches were excluded and why before
    interpreting a missing answer as evidence that no answer exists.'
  text_mode: 'Suppose a program can generate at most ten nodes. It cannot generate our entire fifteen-node tree.
    If it stops without finding a goal, the unexplored part may still contain a solution.


    **Pruning** removes branches from consideration. Some pruning is justified by a rule proving that a branch cannot
    contain an acceptable solution. Other pruning keeps only promising candidates according to a **heuristic**,
    an estimate used to guide search. An estimate can be wrong. Record which branches were excluded and why before
    interpreting a missing answer as evidence that no answer exists.'
  bridges: []
- id: search-growth.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.search-growth
  title: Connect the tree to an AI system
  markdown: 'Planning a route and choosing a sequence of words can both involve exploring alternatives, though their
    states, scoring rules, and valid actions differ. A learned model might score possible next steps while a search
    procedure chooses which ones to inspect.


    A real problem can return to the same state by different routes. A graph records those shared states; an unmerged
    tree may count them repeatedly. Search methods differ in how they handle this, how much memory they retain,
    and whether they preserve guarantees. Our tree calculation isolates growth in possible choice sequences, not
    the complete behavior of every AI search system.'
  text_mode: 'Planning a route and choosing a sequence of words can both involve exploring alternatives, though
