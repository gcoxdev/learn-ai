assessment_families:
- id: search-growth.base
  objective_ref: objective.search-growth
  task: base
  response_type: single_choice
  points: 1
  hint: 'Count the frontier: trace the inputs, operation, and result before choosing.'
  remediation_scene: search-growth.s2
  variants:
  - id: search-growth.base.1
    prompt: Four independent choices at each of three steps yield how many action sequences?
    options:
    - id: c
      text: '16'
    - id: a
      text: '64'
    - id: b
      text: '12'
    answer: a
    feedback: The product is 4 × 4 × 4.
    retired: true
  - id: search-growth.base.2
    prompt: What can make breadth-first search memory-intensive?
    options:
    - id: a
      text: The large frontier at deeper levels
    - id: b
      text: Its refusal to store any candidates
    - id: c
      text: Only the length of variable names
    answer: a
    feedback: The frontier can contain exponentially many candidates in depth.
    retired: true
- id: search-growth.transfer
  objective_ref: objective.search-growth
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Measure the right resource: trace the inputs, operation, and result before choosing.'
  remediation_scene: search-growth.s4
  variants:
  - id: search-growth.transfer.1
    prompt: A solver evaluates 2 million candidates at 1 millisecond each. Approximate serial evaluation time?
    options:
    - id: a
      text: 2000 seconds
    - id: b
      text: 2 seconds
    - id: c
      text: 2000 milliseconds
    answer: a
    feedback: Two million milliseconds equals two thousand seconds.
    retired: true
  - id: search-growth.transfer.2
    prompt: Two paths lead to the same state. What optimization may help?
    options:
    - id: b
      text: Count them as different physical worlds always
    - id: c
      text: Disable the goal test
    - id: a
      text: Detect and reuse already explored states
    answer: a
    feedback: State reuse can avoid repeated work, subject to cost and path-history requirements.
    retired: true
- id: search-growth.base.v2
  objective_ref: objective.search-growth
  task: base
  response_type: numeric_fields_with_reason
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: search-growth.s3
  variants:
  - prompt: A complete tree has 2 children per node and extends through depth 4; the root is at depth 0. Count nodes
      at the last level and nodes across all levels including the root.
    answers:
      last: 16
      total: 31
    reason_answer: a
    reason_options:
    - id: c
      text: Multiply branching factor by depth to count the last level.
    - id: a
      text: Multiply by the branching factor at each level, then add all levels for the total.
    - id: b
      text: Use the last level as the total number of nodes.
    feedback: Level sizes are 1, 2, 4, 8, 16. The last level has 16; their sum is 31.
    id: search-growth.base.v2.1
  - prompt: A complete tree has 3 children per node and extends through depth 2; the root is at depth 0. Count nodes
      at the last level and nodes across all levels including the root.
    answers:
      last: 9
      total: 13
    reason_answer: a
    reason_options:
    - id: a
      text: Multiply by the branching factor at each level, then add all levels for the total.
    - id: b
      text: Use the last level as the total number of nodes.
    - id: c
      text: Multiply branching factor by depth to count the last level.
    feedback: Level sizes are 1, 3, 9. The last level has 9; their sum is 13.
    id: search-growth.base.v2.2
  - prompt: A complete tree has 4 children per node and extends through depth 2; the root is at depth 0. Count nodes
      at the last level and nodes across all levels including the root.
    answers:
      last: 16
      total: 21
    reason_answer: a
    reason_options:
    - id: b
      text: Use the last level as the total number of nodes.
    - id: c
      text: Multiply branching factor by depth to count the last level.
    - id: a
      text: Multiply by the branching factor at each level, then add all levels for the total.
    feedback: Level sizes are 1, 4, 16. The last level has 16; their sum is 21.
    id: search-growth.base.v2.3
  - prompt: A complete tree has 2 children per node and extends through depth 2; the root is at depth 0. Count nodes
      at the last level and nodes across all levels including the root.
    answers:
      last: 4
      total: 7
    reason_answer: a
    reason_options:
    - id: c
      text: Multiply branching factor by depth to count the last level.
    - id: a
      text: Multiply by the branching factor at each level, then add all levels for the total.
    - id: b
      text: Use the last level as the total number of nodes.
    feedback: Level sizes are 1, 2, 4. The last level has 4; their sum is 7.
    id: search-growth.base.v2.4
  numeric_fields:
  - id: last
    label: Last-level nodes
  - id: total
    label: Total nodes including root
  absolute_tolerance: 1.0e-06
- id: search-growth.transfer.v2
  objective_ref: objective.search-growth
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: search-growth.s5
  variants:
  - prompt: A search reaches its node budget without finding a goal and leaves branches unexplored. What follows?
    answer: a
    options:
    - id: c
      text: The goal must lie in the first branch examined.
    - id: a
      text: No goal was found within that search budget.
    - id: b
      text: The problem has no valid solution.
    feedback: Unexplored branches may still contain a goal.
    id: search-growth.transfer.v2.1
  - prompt: A full tree has three choices at each step. Adding one depth level multiplies the last-level count by
      what?
    answer: a
    options:
    - id: a
      text: '3'
    - id: b
      text: '2'
    - id: c
      text: The new depth number
    feedback: Each existing last-level node generates three children.
    id: search-growth.transfer.v2.2
  - prompt: A heuristic removes a branch because its score looks poor. What extra evidence would justify calling
      this pruning solution-preserving?
    answer: a
    options:
    - id: b
      text: A demonstration that the heuristic is fast to compute.
    - id: c
      text: A larger number of possible branches.
    - id: a
      text: A proof that the removed branch cannot contain an acceptable solution.
    feedback: A low estimate alone is not a proof that the branch cannot solve the task.
    id: search-growth.transfer.v2.3
  - prompt: Two different action sequences reach the same room. What can a plain unmerged search tree do?
    answer: a
    options:
    - id: c
      text: Reduce the branching factor to zero at the root.
    - id: a
      text: Represent that room more than once along different paths.
    - id: b
      text: Prove that the two action sequences are identical.
    feedback: A tree of paths can duplicate states that a graph represents once.
    id: search-growth.transfer.v2.4
