        prompt: A complete tree has branching factor 2 and goes down to depth 4 (the root is depth 0). How many nodes are at the deepest level, and how many are in the whole tree?
        answers:
          last: 16
          total: 31
        reason_answer: c
        reason_options:
          - id: a
            text: Multiply the branching factor by the depth to get the deepest level.
          - id: b
            text: Use the deepest level as the total, since the others lead to it.
          - id: c
            text: Multiply by 2 at each level, then add every level, root included.
        feedback: The levels are 1, 2, 4, 8, 16, so the deepest has 16 and the tree has 31. Multiplying 2 × 4 = 8 treats growth as adding, not multiplying.
      - id: search-growth.base.v3.2
        prompt: A complete tree has branching factor 3 and goes down to depth 2 (the root is depth 0). How many nodes are at the deepest level, and how many are in the whole tree?
        answers:
          last: 9
          total: 13
        reason_answer: a
        reason_options:
          - id: a
            text: Multiply by 3 at each level, then add every level, root included.
          - id: b
            text: Leave out the root, since no choice has been made there yet.
          - id: c
            text: Multiply the branching factor by the depth to get the deepest level.
        feedback: The levels are 1, 3, 9, so the deepest has 9 and the tree has 13. Leaving out the root would give 12, but the search starts by visiting the root.
      - id: search-growth.base.v3.3
        prompt: A complete tree has branching factor 4 and goes down to depth 2 (the root is depth 0). How many nodes are at the deepest level, and how many are in the whole tree?
        answers:
          last: 16
          total: 21
        reason_answer: b
        reason_options:
          - id: a
            text: Use the deepest level as the total, since the others lead to it.
          - id: b
            text: Multiply by 4 at each level, then add every level, root included.
          - id: c
            text: Multiply the branching factor by the depth to get the deepest level.
        feedback: The levels are 1, 4, 16, so the deepest has 16 and the tree has 21. Reporting 16 for both forgets the 5 nodes the search passes on the way down.
      - id: search-growth.base.v3.4
        prompt: A complete tree has branching factor 5 and goes down to depth 2 (the root is depth 0). How many nodes are at the deepest level, and how many are in the whole tree?
        answers:
          last: 25
          total: 31
        reason_answer: c
        reason_options:
          - id: a
            text: Multiply the branching factor by the depth to get the deepest level.
          - id: b
            text: Leave out the root, since no choice has been made there yet.
          - id: c
            text: Multiply by 5 at each level, then add every level, root included.
        feedback: The levels are 1, 5, 25, so the deepest has 25 and the tree has 31. Multiplying 5 × 2 = 10 would badly undercount the deepest level.
      - id: search-growth.base.v3.5
        prompt: A complete tree has branching factor 2 and goes down to depth 5 (the root is depth 0). How many nodes are at the deepest level, and how many are in the whole tree?
        answers:
          last: 32
          total: 63
        reason_answer: a
        reason_options:
          - id: a
            text: Multiply by 2 at each level, then add every level, root included.
          - id: b
            text: Use the deepest level as the total, since the others lead to it.
          - id: c
            text: Leave out the root, since no choice has been made there yet.
        feedback: The levels are 1, 2, 4, 8, 16, 32, so the deepest has 32 and the tree has 63. With 2 choices, the whole tree is always one less than twice the deepest level.
      - id: search-growth.base.v3.6
        prompt: A complete tree has branching factor 10 and goes down to depth 3 (the root is depth 0). How many nodes are at the deepest level, and how many are in the whole tree?
        answers:
          last: 1000
          total: 1111
        reason_answer: b
        reason_options:
          - id: a
            text: Multiply the branching factor by the depth to get the deepest level.
          - id: b
            text: Multiply by 10 at each level, then add every level, root included.
          - id: c
            text: Use the deepest level as the total, since the others lead to it.
        feedback: The levels are 1, 10, 100, 1,000, so the deepest has 1,000 and the tree has 1,111. With many choices per step, the deepest level holds most of the tree, but the total is still larger.
  - id: search-growth.transfer.v3
    objective_ref: objective.search-growth
    task: transfer
    response_type: single_choice
    points: 1
    hint: Each extra level multiplies the count by the branching factor. And when a search stops or skips branches, ask what lies in the part it never looked at.
    remediation_scene: search-growth.s5
    variants:
      - id: search-growth.transfer.v3.1
        prompt: A puzzle solver stops after its budget of 10,000 nodes without finding a solution. Many branches were never explored. What can you conclude?
        options:
          - id: a
            text: The puzzle has no solution at all
          - id: b
            text: Any solution must take more than 10,000 moves
          - id: c
            text: No solution was found within 10,000 nodes
        answer: c
        feedback: The unexplored branches might hold a solution, so the honest claim is limited to what was searched. The budget counts nodes visited, not moves in a solution, so a short solution could sit in a skipped branch.
      - id: search-growth.transfer.v3.2
        prompt: A board game offers 30 legal moves in each position. Looking one more move ahead multiplies the number of positions at the deepest level by what?
        options:
          - id: b
            text: '2'
          - id: a
            text: '30'
          - id: c
            text: 'The new depth'
        answer: a
        feedback: Every position at the current deepest level has 30 possible next moves, so the count is multiplied by 30. Doubling would only be right with 2 choices per move.
      - id: search-growth.transfer.v3.3
        prompt: A route search has 2 choices at every step. You switch to a computer that is 1,000 times faster. In the same time, about how much deeper can it search?
        options:
          - id: a
            text: About 1,000 levels deeper
          - id: b
            text: About 10 levels deeper
          - id: c
            text: About 500 levels deeper
        answer: b
        feedback: Each level doubles the work, and 2¹⁰ = 1,024, so a thousandfold speedup buys about 10 levels. Speed divides the time, but depth multiplies the work.
      - id: search-growth.transfer.v3.4
        prompt: A trip planner skips every route whose first leg looks slow, using a traffic estimate. It reports no route under 30 minutes. What is worth checking?
        options:
          - id: c
            text: Whether a skipped route that started slowly ended up fastest
          - id: a
            text: Whether the kept routes were checked in the best order
          - id: b
            text: Whether the computer would be faster with more memory
        answer: c
        feedback: Skipping by a rule of thumb can throw away the best answer, for instance a route with a slow first leg and a clear highway after. The order of the kept routes and the computer's speed don't change which routes were never considered.
      - id: search-growth.transfer.v3.5
        prompt: A delivery robot can reach the same room by going left-then-right or right-then-left. What does a search that remembers visited places gain over a plain tree?
        options:
          - id: a
            text: It explores that room once instead of once per route to it
          - id: b
            text: It finds rooms that a plain tree search could never reach
          - id: c
            text: It saves memory, since it can skip the repeated rooms
        answer: a
        feedback: Remembering visited places avoids redoing the same work, which can cut a search enormously. It costs memory rather than saving it, and a plain tree reaches the same rooms, just repeatedly.
      - id: search-growth.transfer.v3.6
        prompt: A game program with 3 moves per turn searches every position to depth 4. Its log says it "examined 81 positions." What is wrong with that number?
        options:
          - id: b
            text: It should be 3 × 4 = 12, since there are 4 levels of 3 moves
          - id: c
            text: It counts the starting position twice, so it should be 80
          - id: a
            text: It counts only the deepest level; the full tree has 121 positions
        answer: a
        feedback: The levels are 1, 3, 9, 27, 81, so 81 is only the deepest level and the search visited 121 positions in total. 3 × 4 treats each level as adding 3 rather than multiplying by 3.
