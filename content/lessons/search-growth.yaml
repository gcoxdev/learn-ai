    task: base
    response_type: single_choice
    points: 1
    hint: 'Count the frontier: trace the inputs, operation, and result before choosing.'
    remediation_scene: search-growth.s2
    variants:
      - id: search-growth.base.1
        prompt: Four independent choices at each of three steps yield how many action sequences?
        options:
          - id: c
            text: '16'
          - id: a
            text: '64'
          - id: b
            text: '12'
        answer: a
        feedback: The product is 4 × 4 × 4.
        retired: true
      - id: search-growth.base.2
        prompt: What can make breadth-first search memory-intensive?
        options:
          - id: a
            text: The large frontier at deeper levels
          - id: b
            text: Its refusal to store any candidates
          - id: c
            text: Only the length of variable names
        answer: a
        feedback: The frontier can contain exponentially many candidates in depth.
        retired: true
  - id: search-growth.transfer
    objective_ref: objective.search-growth
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Measure the right resource: trace the inputs, operation, and result before choosing.'
    remediation_scene: search-growth.s4
    variants:
