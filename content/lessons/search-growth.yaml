assessment_families:
- id: search-growth.base
  objective_ref: objective.search-growth
  task: base
  response_type: single_choice
  points: 1
  hint: 'Count the frontier: trace the inputs, operation, and result before choosing.'
  remediation_scene: search-growth.s2
  variants:
  - id: search-growth.base.1
    prompt: Four independent choices at each of three steps yield how many action sequences?
    options:
    - id: c
      text: '16'
    - id: a
      text: '64'
    - id: b
      text: '12'
    answer: a
    feedback: The product is 4 × 4 × 4.
  - id: search-growth.base.2
    prompt: What can make breadth-first search memory-intensive?
    options:
    - id: a
      text: The large frontier at deeper levels
    - id: b
      text: Its refusal to store any candidates
    - id: c
      text: Only the length of variable names
    answer: a
    feedback: The frontier can contain exponentially many candidates in depth.
- id: search-growth.transfer
  objective_ref: objective.search-growth
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Measure the right resource: trace the inputs, operation, and result before choosing.'
  remediation_scene: search-growth.s4
  variants:
  - id: search-growth.transfer.1
    prompt: A solver evaluates 2 million candidates at 1 millisecond each. Approximate serial evaluation time?
    options:
    - id: a
      text: 2000 seconds
    - id: b
      text: 2 seconds
    - id: c
      text: 2000 milliseconds
    answer: a
    feedback: Two million milliseconds equals two thousand seconds.
  - id: search-growth.transfer.2
    prompt: Two paths lead to the same state. What optimization may help?
    options:
    - id: b
      text: Count them as different physical worlds always
    - id: c
      text: Disable the goal test
    - id: a
      text: Detect and reuse already explored states
    answer: a
    feedback: State reuse can avoid repeated work, subject to cost and path-history requirements.
