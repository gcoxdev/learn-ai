schema_version: 0.2-draft
lesson:
  id: search-growth
  version: 0.4.0-draft
  title: Why a small choice can create a huge search
  state: draft
  summary: Twenty left-or-right choices already make over a million routes. Count a search tree by hand and in code, and see why a computer 1,000 times faster barely helps.
  slot: M02.5
  category: learning
  sources:
    - title: 'Poole and Mackworth: graph searching'
      url: https://artint.info/3e/html/ArtInt3e.Ch3.S3.html
  archetype: mechanism
objectives:
  - id: objective.search-growth
    version: 3-draft
    statement: Distinguish last-level paths from all visited tree nodes, calculate their growth, and interpret a stopped or pruned search under its assumptions.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - search-growth.base.v3
      - search-growth.transfer.v3
    prerequisites:
      - anyOf:
          - objective.discrete-math
      - anyOf:
          - objective.algorithm-cost
scenes:
  - id: search-growth.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.search-growth
    title: Every fork splits the future
    markdown: |-
      A robot explores a maze. At the first fork it can go left or right. At the next fork, left or right again. And again. Each choice seems tiny. But how many different routes are there after 20 forks?

      To keep track, draw a **search tree**. The starting point is the **root**. Each possible choice is a line, called an **edge**, leading to a new **node**: the place the robot would reach after that choice. The number of choices made so far is the **depth**, so the root sits at depth 0. The number of choices available at each node is the **branching factor**.

      Our robot's tree has branching factor 2 everywhere. We'll also keep things simple: no dead ends, and no two routes ever reach the same spot. (Real mazes break both rules; we'll come back to that.)
    bridges:
      - discrete-math
  - id: search-growth.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.search-growth
    title: Count one level at a time
    markdown: |-
      At depth 0 there's one node, the root. After one choice there are 2 nodes. Each of those splits in two, giving 4 at depth 2, then 8 at depth 3.

      Each level is the one before it times 2. So depth 3 has 2 × 2 × 2 = 2³ = 8 nodes, and each of those 8 nodes is the end of a different three-choice route.

      :::predict So how many routes does the robot have after 20 forks?
      2²⁰ = 1,048,576: more than a million routes, from twenty coin-flip-sized choices. That's the surprise at the heart of this lesson. Each step *multiplies* the count instead of adding to it.
      :::
    bridges:
      - arithmetic
  - id: search-growth.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.search-growth
    title: The last level versus the whole tree
    markdown: |-
      Careful: "how many routes reach depth 3?" and "how many nodes does a search visit on the way?" are different questions. To reach depth 3, a search must also pass through every earlier level:

      | Depth | Nodes at this level | Whole tree so far |
      | ---: | ---: | ---: |
      | 0 | 1 | 1 |
      | 1 | 2 | 3 |
      | 2 | 4 | 7 |
      | 3 | 8 | 15 |

      The last level has 8 nodes, but the whole tree has 15. Here's the same count in Python:

      ```python run
      b = 2                  # branching factor: choices at every step
      d = 3                  # depth: how many choices deep we go
      level = 1              # nodes at depth 0: just the root
      total = 1              # nodes counted so far in the whole tree
      print(f"depth 0: {level} node at this level, {total} in the tree so far")
      for depth in range(1, d + 1):
          level = level * b                  # every node on the last level gets b children
          total = total + level              # add the new level to the running total
          print(f"depth {depth}: {level} nodes at this level, {total} in the tree so far")
      ```

      :::predict Change b to 3. How many nodes are at depth 3, and how many in the whole tree?
      The levels are 1, 3, 9, and 27, so 27 at the last level and 1 + 3 + 9 + 27 = 40 in all. Run it to check, then try d = 10 with b = 2: 1,024 at the last level, 2,047 in all.
      :::
    bridges: []
  - id: search-growth.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.search-growth
    title: Why faster computers barely help
    markdown: |-
      With branching factor b and depth d, the last level has b multiplied by itself d times: $b^d$. Going one level deeper multiplies the count by b again. Growth like this, where each step multiplies, is called **exponential growth**.

      :::predict Your search has 2 choices per step. You buy a computer 1,000 times faster. How much deeper can you search in the same time?
      Only about 10 levels, because 2¹⁰ = 1,024. A thousandfold speedup pays for ten more choices. With 35 choices per step, the same speedup buys about 2 extra levels (35² = 1,225).
      :::

      Chess is the classic example. A typical position has roughly 30 to 35 legal moves, so looking a few moves ahead explodes quickly. In 1950 Claude Shannon estimated that the full tree of possible chess games has on the order of $10^{120}$ paths, far more than any computer could ever list. Chess programs succeed by searching cleverly, not by searching everything.
    bridges:
      - algorithm-cost
  - id: search-growth.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.search-growth
    markdown: Count new trees level by level, then judge what puzzle solvers, game programs, and route planners can claim when they stop.
    takeaway: |-
      Each extra choice multiplies the number of routes, so search grows exponentially with depth. When a search stops early, it has found nothing in the part it explored, which is not the same as there being nothing to find.
  - id: search-growth.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.search-growth
    markdown: |-
      Branching, depth, runtime, and working memory determine whether a search procedure is practical even when every individual step is simple.
  - id: search-growth.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.search-growth
    title: '"Not found" is not "doesn''t exist"'
    markdown: |-
      Since full trees are hopeless, real searches cut corners in two ways.

      A **budget** stops the search after a set number of nodes. Give our robot a budget of 10 nodes and it can't finish the 15-node tree. If it stops without finding the exit, the exit might sit in the 5 nodes it never visited.

      **Pruning** means skipping whole branches. Some pruning is safe: if the robot's battery can't possibly reach the end of a branch, nothing down there is usable. Other pruning follows a **heuristic**, a rule of thumb for which branches look promising, such as "prefer corridors heading toward the exit." Heuristics are often right and sometimes wrong, and a branch skipped by mistake is never seen again.

      :::mixup "The search didn't find a route, so there isn't one."
      A search that stopped at its budget, or pruned by a rule of thumb, can only say "no route in the part I explored." Report it that way: *"No exit found within 10 nodes; branches heading away from the exit were skipped."*
      :::
    bridges: []
  - id: search-growth.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.search-growth
    title: How real AI systems tame the tree
    markdown: |-
      Real problems break our two simplifications. Mazes have dead ends, and different routes often reach the same spot: left-then-right and right-then-left may land in the same room. A plain tree explores that room twice. A **graph search** remembers the places it has already visited and skips repeats, trading memory for time.

      The biggest wins come from pairing search with good judgment about where to look. Route planners use distance-to-goal estimates to try promising roads first. In 2016, DeepMind's AlphaGo beat Lee Sedol, one of the world's strongest Go players. Go has even more moves per turn than chess, and AlphaGo used neural networks, trained from example games and self-play, to suggest which moves to explore and to judge positions, so its search could ignore most of the tree.

      Next time you see an AI system "plan" or "look ahead," ask three questions: What is the branching factor? How deep does it look? And what decides which branches it skips?
    bridges: []
