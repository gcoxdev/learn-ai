        prompt: A solver evaluates 2 million candidates at 1 millisecond each. Approximate serial evaluation time?
        options:
          - id: a
            text: 2000 seconds
          - id: b
            text: 2 seconds
          - id: c
            text: 2000 milliseconds
        answer: a
        feedback: Two million milliseconds equals two thousand seconds.
        retired: true
      - id: search-growth.transfer.2
        prompt: Two paths lead to the same state. What optimization may help?
        options:
          - id: b
            text: Count them as different physical worlds always
          - id: c
            text: Disable the goal test
          - id: a
            text: Detect and reuse already explored states
        answer: a
        feedback: State reuse can avoid repeated work, subject to cost and path-history requirements.
        retired: true
  - id: search-growth.base.v2
    objective_ref: objective.search-growth
    task: base
