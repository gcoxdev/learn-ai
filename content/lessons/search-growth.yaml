    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: search-growth.s5
    variants:
      - prompt: A search reaches its node budget without finding a goal and leaves branches unexplored. What follows?
        answer: a
        options:
          - id: c
            text: The goal must lie in the first branch examined.
          - id: a
            text: No goal was found within that search budget.
          - id: b
            text: The problem has no valid solution.
        feedback: Unexplored branches may still contain a goal.
        id: search-growth.transfer.v2.1
        retired: true
      - prompt: A full tree has three choices at each step. Adding one depth level multiplies the last-level count by what?
        answer: a
        options:
          - id: a
            text: '3'
          - id: b
            text: '2'
          - id: c
            text: The new depth number
        feedback: Each existing last-level node generates three children.
        id: search-growth.transfer.v2.2
        retired: true
      - prompt: A heuristic removes a branch because its score looks poor. What extra evidence would justify calling this pruning solution-preserving?
        answer: a
        options:
          - id: b
            text: A demonstration that the heuristic is fast to compute.
          - id: c
            text: A larger number of possible branches.
          - id: a
            text: A proof that the removed branch cannot contain an acceptable solution.
        feedback: A low estimate alone is not a proof that the branch cannot solve the task.
        id: search-growth.transfer.v2.3
        retired: true
      - prompt: Two different action sequences reach the same room. What can a plain unmerged search tree do?
        answer: a
        options:
          - id: c
            text: Reduce the branching factor to zero at the root.
          - id: a
            text: Represent that room more than once along different paths.
          - id: b
            text: Prove that the two action sequences are identical.
        feedback: A tree of paths can duplicate states that a graph represents once.
        id: search-growth.transfer.v2.4
        retired: true
  - id: search-growth.base.v3
    objective_ref: objective.search-growth
    task: base
    response_type: numeric_fields_with_reason
