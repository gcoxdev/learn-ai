schema_version: 0.2-draft
lesson:
  id: search-growth
  version: 0.1.0-draft
  title: Why a small choice can create a huge search
  state: draft
  summary: Branching, depth, runtime, and working memory determine whether a search procedure is practical even
    when every individual step is simple.
  slot: M02.5
  category: learning
  minutes: 12
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.search-growth
  version: 1-draft
  statement: Branching, depth, runtime, and working memory determine whether a search procedure is practical even
    when every individual step is simple.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - search-growth.base
  - search-growth.transfer
  prerequisites:
  - anyOf:
    - objective.discrete-math
  - anyOf:
    - objective.algorithm-cost
scenes:
- id: search-growth.s1
  title: Local choices create a tree
  type: explanation
  depth: intuition
  objective_refs:
  - objective.search-growth
  markdown: A search starts at a state and considers possible next actions. If each state offers three actions,
    two steps allow up to nine action sequences and four steps up to eighty-one. Repeated states and constraints
    can change the number of distinct states, so distinguish paths from states.
  text_mode: A search starts at a state and considers possible next actions. If each state offers three actions,
    two steps allow up to nine action sequences and four steps up to eighty-one. Repeated states and constraints
    can change the number of distinct states, so distinguish paths from states.
  bridges: []
- id: search-growth.s2
  title: Count the frontier
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.search-growth
  markdown: Breadth-first search retains a frontier of candidates at the current depth. With branching b and depth
    d, the frontier can grow on the scale of b to the power d. Depth-first search can use much less frontier memory,
    but may follow a long unproductive branch before discovering a short solution.
  text_mode: Breadth-first search retains a frontier of candidates at the current depth. With branching b and depth
    d, the frontier can grow on the scale of b to the power d. Depth-first search can use much less frontier memory,
    but may follow a long unproductive branch before discovering a short solution.
  bridges:
  - algorithm-cost
- id: search-growth.s3
  title: Work through a budget
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.search-growth
  markdown: If evaluating a candidate takes one millisecond, a million evaluations take roughly one thousand seconds
    before overhead or parallelism. A method that is excellent on a ten-state example may become impractical on
    a larger problem. Heuristics, pruning, and reuse aim to spend effort on more promising or distinct candidates.
  text_mode: If evaluating a candidate takes one millisecond, a million evaluations take roughly one thousand seconds
    before overhead or parallelism. A method that is excellent on a ten-state example may become impractical on
    a larger problem. Heuristics, pruning, and reuse aim to spend effort on more promising or distinct candidates.
  bridges: []
- id: search-growth.s4
  title: Measure the right resource
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.search-growth
  markdown: Runtime includes evaluation cost, bookkeeping, and communication; memory includes the frontier and stored
    states. A learned heuristic can guide search but may introduce errors or distribution assumptions. State the
    solution quality required and the available budget before declaring one search algorithm best.
  text_mode: Runtime includes evaluation cost, bookkeeping, and communication; memory includes the frontier and
    stored states. A learned heuristic can guide search but may introduce errors or distribution assumptions. State
    the solution quality required and the available budget before declaring one search algorithm best.
  bridges: []
- id: search-growth.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.search-growth
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Branching, depth, runtime, and working memory determine whether a search procedure is practical even
    when every individual step is simple.
- id: search-growth.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.search-growth
  markdown: Branching, depth, runtime, and working memory determine whether a search procedure is practical even
    when every individual step is simple.
  text_mode: Branching, depth, runtime, and working memory determine whether a search procedure is practical even
    when every individual step is simple.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - search-growth.s1
    - search-growth.s2
    - search-growth.s3
    - search-growth.s4
    - search-growth.check
    gate_refs:
    - gate.core
