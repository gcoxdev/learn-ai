scenes:
- id: reservoir-computing.s1
  title: Keep a rich dynamical core
  type: explanation
  depth: intuition
  objective_refs:
  - objective.reservoir-computing
  markdown: An echo-state network commonly uses a fixed recurrent reservoir whose states respond to the input history.
    A trained readout maps those states to predictions. Liquid-state approaches use related ideas with spiking dynamics.
    The reservoir can be simulated or implemented in a physical substrate.
  text_mode: An echo-state network commonly uses a fixed recurrent reservoir whose states respond to the input history.
    A trained readout maps those states to predictions. Liquid-state approaches use related ideas with spiking dynamics.
    The reservoir can be simulated or implemented in a physical substrate.
  bridges: []
- id: reservoir-computing.s2
  title: Fit the output mapping
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reservoir-computing
  markdown: Collect reservoir states for training inputs and fit a readout, often using regularized linear regression.
    This can avoid training every recurrent weight through time. The readout can only extract information represented
    in the reservoir; a simple output fit cannot recover distinctions already lost.
  text_mode: Collect reservoir states for training inputs and fit a readout, often using regularized linear regression.
    This can avoid training every recurrent weight through time. The readout can only extract information represented
    in the reservoir; a simple output fit cannot recover distinctions already lost.
  bridges: []
- id: reservoir-computing.s3
  title: Balance fading memory and instability
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reservoir-computing
  markdown: If dynamics decay too quickly, useful history disappears. If they are excessively unstable or dominated
    by initial conditions, predictions can become unreliable. Spectral-radius heuristics help tune some reservoirs
    but are not a universal sufficient guarantee for every nonlinear input-driven system.
  text_mode: If dynamics decay too quickly, useful history disappears. If they are excessively unstable or dominated
    by initial conditions, predictions can become unreliable. Spectral-radius heuristics help tune some reservoirs
    but are not a universal sufficient guarantee for every nonlinear input-driven system.
  bridges: []
- id: reservoir-computing.s4
  title: Evaluate the complete temporal task
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reservoir-computing
  markdown: Specify initialization, washout, input scaling, feedback, and train-test time boundaries. Compare forecasting,
    classification, or control at matched resources. Fixed internal weights reduce one training burden but do not
    eliminate hyperparameter search, state computation, or the need for robust evaluation.
  text_mode: Specify initialization, washout, input scaling, feedback, and train-test time boundaries. Compare forecasting,
    classification, or control at matched resources. Fixed internal weights reduce one training burden but do not
    eliminate hyperparameter search, state computation, or the need for robust evaluation.
  bridges: []
