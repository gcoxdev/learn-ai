  version: 0.1.0-draft
  title: Use fixed recurrent dynamics and train a readout
  state: draft
  summary: Reservoir computing drives a dynamical system with inputs and learns an output mapping; memory, stability,
    observability, and readout training determine useful sequence processing.
  slot: M37.6
  category: learning
  minutes: 12
  sources:
  - title: A Practical Guide to Applying Echo State Networks
