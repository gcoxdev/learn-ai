lesson:
  id: reservoir-computing
  version: 0.4.0-draft
  title: Use fixed recurrent dynamics and train a readout
  state: draft
  summary: Build a recurrent network with random weights, never train them, and fit only the final layer. It forecasts a chaotic signal, and the whole training step is one line of linear algebra.
  slot: M37.6
  category: learning
  sources:
    - title: "A Practical Guide to Applying Echo State Networks (Lukoševičius, 2012)"
      url: https://www.ai.rug.nl/minds/uploads/PracticalESN.pdf
    - title: "Harnessing Nonlinearity: Predicting Chaotic Systems and Saving Energy in Wireless Communication (Jaeger & Haas, 2004)"
      url: https://doi.org/10.1126/science.1091277
    - title: Neuronal Dynamics
      url: https://neuronaldynamics.epfl.ch/online/
objectives:
  - id: objective.reservoir-computing
    version: 2-draft
    statement: Reservoir computing drives a dynamical system with inputs and learns an output mapping; memory, stability, observability, and readout training determine useful sequence processing.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - reservoir-computing.base.v2
      - reservoir-computing.transfer.v2
      - reservoir-computing.calculate
    prerequisites:
      - anyOf:
          - objective.recurrent-networks
      - anyOf:
          - objective.regularization-and-tuning
      - anyOf:
          - objective.dynamics-and-noise
scenes:
  - id: reservoir-computing.s1
    title: Don't train the pond, read the ripples
    type: explanation
    depth: intuition
    objective_refs:
      - objective.reservoir-computing
    markdown: |-
      Drop pebbles into a pond, one after another. The ripples at any moment mix traces of every recent pebble: where it fell, how hard, how long ago. You can't train the water. But a camera over the pond, plus a simple formula applied to the ripple pattern, could learn to tell you when the last pebble fell.

      That's **reservoir computing**. In 2001 Herbert Jaeger proposed the **echo state network (ESN)**: a recurrent network, like the one in the lesson on carrying a state from one step to the next, except that its recurrent weights $W$ and input weights $W_\text{in}$ are drawn at random and **never trained**. At each time step the input $u(t)$ stirs this reservoir of hidden units:

      $$h(t) = \tanh\big(W\,h(t-1) + W_\text{in}\,u(t)\big)$$

      Only the **readout** is trained, a linear layer $y(t) = W_\text{out}\,h(t)$ that turns the reservoir's state into a prediction. Around the same time, Wolfgang Maass, Thomas Natschläger, and Henry Markram proposed the same idea with spiking neurons, calling it a **liquid state machine**.

      Why would random weights help? Because a large random recurrent network turns the recent history of the input into a rich, high-dimensional state, a mix of many echoes at different delays. A linear readout can then pick out whichever combination predicts the target.
    diagram:
