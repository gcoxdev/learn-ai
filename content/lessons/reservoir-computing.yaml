  - id: reservoir-computing.s2
    title: A one-unit reservoir and its readout
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.reservoir-computing
    markdown: |-
      Shrink the reservoir to one linear unit, $h(t) = 0.5\,h(t-1) + u(t)$, starting at 0. Feed it a single pulse, inputs 2, 0, 0:

      | Step | Input | State $h$ |
      | ---: | ---: | ---: |
      | 1 | 2 | $0.5 \times 0 + 2 = 2$ |
      | 2 | 0 | $0.5 \times 2 + 0 = 1$ |
      | 3 | 0 | $0.5 \times 1 + 0 = 0.5$ |

      The pulse leaves a fading echo. Now train a readout $y = w\,h$ to hit targets 4, 2, 1. **Ridge regression**, least squares with a penalty $\lambda w^2$ on large weights, has a closed form. For one weight:

      $$w = \frac{\sum_t h_t\,y_t}{\sum_t h_t^2 + \lambda} = \frac{2 \cdot 4 + 1 \cdot 2 + 0.5 \cdot 1}{4 + 1 + 0.25 + \lambda} = \frac{10.5}{5.25 + \lambda}$$

      With $\lambda = 0$, $w = 2$ fits exactly. With $\lambda = 0.25$, $w = 1.909$: a slightly worse fit on training data in exchange for a smaller weight, which usually generalizes better when the states are noisy. That's the whole of training.

      :::papers The readout in matrix form
      Stack the reservoir states as rows of a matrix $H$ (one row per time step, after a **washout**, a few hundred starting steps discarded so the arbitrary initial state is forgotten) and the targets in $Y$. Then

      $$W_\text{out} = (H^\top H + \lambda I)^{-1} H^\top Y$$

      This is the ridge regression from the lesson on regularization and tuning, applied to reservoir states. With one unit, $H^\top H = 5.25$ and $H^\top Y = 10.5$, the numbers above. No gradients flow through time, so there's no vanishing gradient to fight.
      :::
    bridges:
      - regularization-and-tuning
  - id: reservoir-computing.s3
    title: "The echo state property: forget the start"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.reservoir-computing
    markdown: |-
      A reservoir is only useful if its state depends on the *input history*, not on where it started. Run the one-unit reservoir twice with the same inputs, once from $h = 0$ and once from $h = 4$. The gap between the runs halves each step: 4, 2, 1, 0.5. The start fades and only the input's echo remains. Jaeger called this the **echo state property**.

      For a big reservoir, the number that plays the role of 0.5 is the **spectral radius** of $W$: the largest absolute value among its eigenvalues. It measures how much the recurrent weights stretch a state per step. The standard recipe is to draw $W$ at random, then rescale it so the spectral radius is just below 1, often 0.8 to 0.99.

      :::predict With a one-unit reservoir of weight 0.9, how many steps until a difference in starting state shrinks below 10% of its size?
      22 steps, since $0.9^{21} \approx 0.109$ and $0.9^{22} \approx 0.098$. With weight 0.5 it takes only 4 steps ($0.5^4 = 0.0625$). A radius near 1 forgets slowly, which is exactly what gives the reservoir a long memory. At 1.5 the difference *grows*, and the state reflects the start more than the input.
      :::

      So the spectral radius is a dial between two failures. Too small, and the reservoir forgets the input before the readout can use it. Too large, and it echoes its own start, or its own chaos, instead of the input. Treat "below 1" as a rule of thumb: the tanh and the input damp the dynamics, so radii slightly above 1 sometimes work, but far above 1 they fail.
  - id: reservoir-computing.s5
    title: Forecast a chaotic signal
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.reservoir-computing
    markdown: |-
      The **Mackey–Glass** series comes from a 1977 model of blood-cell production in which the change now depends on the level a fixed delay earlier. With a delay of 17 steps it's chaotic, and it's a standard forecasting test. The program builds a 200-unit reservoir, trains the readout on 1,400 steps to predict the value 10 steps ahead, tests on the remaining 690 steps, and repeats for four spectral radii. It reports the **NRMSE**: root-mean-square error divided by the signal's standard deviation, so 1.0 is about as bad as always guessing the average.

      ```python run
      import numpy as np

      x = [1.2] * 18                                   # Mackey-Glass-like chaotic series (delay 17)
      for t in range(2200):
          x.append(x[-1] + 0.2 * x[-18] / (1 + x[-18] ** 10) - 0.1 * x[-1])
      u = np.array(x[18:])
      k = 10                                           # predict 10 steps ahead

      def esn_error(rho, N=200, washout=100, lam=1e-6):
          rng = np.random.default_rng(0)
          W = rng.normal(size=(N, N))
          W *= rho / max(abs(np.linalg.eigvals(W)))    # fixed random reservoir, spectral radius rho
          W_in = rng.uniform(-0.5, 0.5, size=N)        # fixed random input weights
          h, H = np.zeros(N), []
          for value in u:                              # drive the reservoir; never train it
              h = np.tanh(W @ h + W_in * value)
              H.append(h)
          H, Y = np.array(H[:-k]), u[k:]               # state now -> value k steps later
          tr, te = slice(washout, 1500), slice(1500, None)
          A = H[tr]
          W_out = np.linalg.solve(A.T @ A + lam * np.eye(N), A.T @ Y[tr])   # ridge readout
          return np.sqrt(np.mean((H[te] @ W_out - Y[te]) ** 2)) / np.std(Y[te])

      for rho in (0.1, 0.5, 0.9, 1.5):
          print(f"spectral radius {rho}: test error (NRMSE) {esn_error(rho):.3f}")
      print(f"baseline 'in 10 steps = now': {np.sqrt(np.mean((u[1500:-k] - u[1500 + k:]) ** 2)) / np.std(u[1500 + k:]):.3f}")
      ```

      The baseline, guessing no change, scores 1.242. At radius 0.1 the reservoir forgets too fast (0.595); at 0.5 it does better (0.270); at 0.9 the error drops to 0.063. At 1.5 the echo state property breaks and the error jumps to 0.883. Try `k = 1`: one step ahead is easy, and even radius 0.5 does well.
  - id: reservoir-computing.s4
    title: When a fixed reservoir is the right call
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.reservoir-computing
    markdown: |-
      Compare this with training every weight of a recurrent network by backpropagation through time:

      | | Echo state network | Fully trained RNN or LSTM |
      | --- | --- | --- |
      | Trained weights | Readout only | All of them |
      | Training | One ridge-regression solve, seconds | Many gradient steps through time |
      | Vanishing gradients | None, no gradient through time | A central problem |
      | Best at | Small data, low-dimensional signals, chaotic dynamics | Large data, complex inputs such as language |

      In 2004 Jaeger and Harald Haas used an ESN to forecast the Mackey–Glass series far more accurately than earlier methods, and in 2018 Jaideep Pathak and colleagues used reservoirs to forecast large chaotic systems from data alone. Because the reservoir needs no training, it can even be a physical system. In 2003 Chrisantha Fernando and Sirko Sojakka used a real bucket of water, stirred by motors and filmed from above, with a trained linear readout that told apart recordings of the spoken words "zero" and "one."

      :::mixup "Since the reservoir is random, a better readout can make up for a bad one."
      The readout is linear and sees only the current state. If the reservoir has already forgotten an input, or never separated two histories, no readout can recover the difference. Tune the reservoir's spectral radius and input scaling first, then fit the readout.
      :::

      So reach for an ESN when data are scarce, training must be fast or run on a tiny device, or the reservoir is a physical system you can't backpropagate through. For language or images at scale, a fully trained network wins.
  - id: reservoir-computing.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.reservoir-computing
    markdown: Ridge readouts, fading echoes, and state updates to compute, plus a heart monitor, an optical chip, and a reservoir that won't forget, test whether you can build and tune a reservoir.
    takeaway: |-
      An echo state network drives a fixed random recurrent reservoir with the input and trains only a linear readout, by ridge regression. A spectral radius just below 1 lets the reservoir forget its starting state while remembering the recent input.
  - id: reservoir-computing.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.reservoir-computing
    markdown: |-
      A reservoir turns input history into evolving states while its internal weights stay fixed. A trained readout can use only the information those states preserve.
