lesson:
  id: reservoir-computing
  version: 0.3.0-draft
  title: Use fixed recurrent dynamics and train a readout
  state: draft
  summary: Keep a recurrent memory system fixed and train the part that reads it.
  slot: M37.6
  category: learning
  sources:
  - title: A Practical Guide to Applying Echo State Networks
    url: https://www.ai.rug.nl/minds/uploads/PracticalESN.pdf
  - title: Neuronal Dynamics
    url: https://neuronaldynamics.epfl.ch/online/
objectives:
- id: objective.reservoir-computing
  version: 1-draft
  statement: Reservoir computing drives a dynamical system with inputs and learns an output mapping; memory,
    stability, observability, and readout training determine useful sequence processing.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - reservoir-computing.base
  - reservoir-computing.transfer
  prerequisites:
  - anyOf:
    - objective.recurrent-networks
  - anyOf:
    - objective.regularization-and-tuning
  - anyOf:
    - objective.dynamics-and-noise
scenes:
- id: reservoir-computing.s1
  title: Keep a rich dynamical core
  type: explanation
  depth: intuition
  objective_refs:
  - objective.reservoir-computing
  markdown: An echo-state network commonly uses a fixed recurrent reservoir whose states respond to the input
    history. A trained readout maps those states to predictions. Liquid-state approaches use related ideas
    with spiking dynamics. The reservoir can be simulated or implemented in a physical substrate.
  text_mode: An echo-state network commonly uses a fixed recurrent reservoir whose states respond to the input
    history. A trained readout maps those states to predictions. Liquid-state approaches use related ideas
    with spiking dynamics. The reservoir can be simulated or implemented in a physical substrate.
  bridges: []
- id: reservoir-computing.s2
  title: Fit the output mapping
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reservoir-computing
  markdown: 'Collect reservoir states for training inputs and fit a readout, often using regularized linear
    regression. This can avoid training every recurrent weight through time. The readout can only extract information
    represented in the reservoir; a simple output fit cannot recover distinctions already lost.


    Take a toy fixed reservoir h_next = 0.5h + x. Starting at zero, inputs 2 then 0 give states 2 then 1: a
    trace of the first input remains. A readout might predict y = wh + b, with only w and b fitted to targets.
    Washout means discarding an initial period so arbitrary starting conditions have less influence. Spectral
    radius is the largest eigenvalue magnitude of the recurrent matrix; in this one-number example it is 0.5,
    so an initial-state difference halves each step.'
  text_mode: 'Collect reservoir states for training inputs and fit a readout, often using regularized linear
    regression. This can avoid training every recurrent weight through time. The readout can only extract information
    represented in the reservoir; a simple output fit cannot recover distinctions already lost.


    Take a toy fixed reservoir h_next = 0.5h + x. Starting at zero, inputs 2 then 0 give states 2 then 1: a
    trace of the first input remains. A readout might predict y = wh + b, with only w and b fitted to targets.
    Washout means discarding an initial period so arbitrary starting conditions have less influence. Spectral
    radius is the largest eigenvalue magnitude of the recurrent matrix; in this one-number example it is 0.5,
    so an initial-state difference halves each step.'
  bridges: []
- id: reservoir-computing.s3
  title: Balance fading memory and instability
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reservoir-computing
  markdown: If dynamics decay too quickly, useful history disappears. If they are excessively unstable or dominated
    by initial conditions, predictions can become unreliable. Spectral-radius heuristics help tune some reservoirs
    but are not a universal sufficient guarantee for every nonlinear input-driven system.
  text_mode: If dynamics decay too quickly, useful history disappears. If they are excessively unstable or
    dominated by initial conditions, predictions can become unreliable. Spectral-radius heuristics help tune
    some reservoirs but are not a universal sufficient guarantee for every nonlinear input-driven system.
  bridges: []
- id: reservoir-computing.s4
  title: Evaluate the complete temporal task
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reservoir-computing
  markdown: Specify initialization, washout, input scaling, feedback, and train-test time boundaries. Compare
    forecasting, classification, or control at matched resources. Fixed internal weights reduce one training
    burden but do not eliminate hyperparameter search, state computation, or the need for robust evaluation.
  text_mode: Specify initialization, washout, input scaling, feedback, and train-test time boundaries. Compare
    forecasting, classification, or control at matched resources. Fixed internal weights reduce one training
    burden but do not eliminate hyperparameter search, state computation, or the need for robust evaluation.
  bridges: []
- id: reservoir-computing.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.reservoir-computing
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A reservoir turns input history into evolving states while its internal weights stay fixed. A trained
    readout can use only the information those states preserve.
- id: reservoir-computing.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.reservoir-computing
  markdown: A reservoir turns input history into evolving states while its internal weights stay fixed. A trained
    readout can use only the information those states preserve.
  text_mode: A reservoir turns input history into evolving states while its internal weights stay fixed. A
