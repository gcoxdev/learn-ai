assessment_families:
- id: reservoir-computing.base
  objective_ref: objective.reservoir-computing
  task: base
  response_type: single_choice
  points: 1
  hint: 'Fit the output mapping: trace the inputs, operation, and result before choosing.'
  remediation_scene: reservoir-computing.s2
  variants:
  - id: reservoir-computing.base.1
    prompt: What is commonly trained in a basic echo-state setup?
    options:
    - id: c
      text: Only the input file name
    - id: a
      text: The readout from reservoir states
    - id: b
      text: Every recurrent weight necessarily
    answer: a
    feedback: The recurrent core can remain fixed.
  - id: reservoir-computing.base.2
    prompt: Can a readout recover information absent from the reservoir state?
    options:
    - id: a
      text: Not generally
    - id: b
      text: Always
    - id: c
      text: Only with linear regression
    answer: a
    feedback: The output mapping is limited by its input representation.
- id: reservoir-computing.transfer
  objective_ref: objective.reservoir-computing
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate the complete temporal task: trace the inputs, operation, and result before choosing.'
  remediation_scene: reservoir-computing.s4
  variants:
  - id: reservoir-computing.transfer.1
    prompt: Why can overly fast state decay hurt?
    options:
    - id: a
      text: It removes useful temporal information
    - id: b
      text: It guarantees perfect long memory
    - id: c
      text: It increases every past signal forever
    answer: a
    feedback: Fading memory has a task-dependent timescale.
  - id: reservoir-computing.transfer.2
    prompt: Do fixed recurrent weights eliminate all model-selection cost?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only for physical reservoirs
    - id: a
      text: 'No'
    answer: a
    feedback: Reservoir and readout hyperparameters still need selection.
