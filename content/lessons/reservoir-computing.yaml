assessment_families:
  - id: reservoir-computing.base
    objective_ref: objective.reservoir-computing
    task: base
    response_type: single_choice
    points: 1
    hint: 'Fit the output mapping: trace the inputs, operation, and result before choosing.'
    remediation_scene: reservoir-computing.s2
    variants:
      - id: reservoir-computing.base.1
        prompt: What is commonly trained in a basic echo-state setup?
        options:
          - id: c
            text: Only the input file name
          - id: a
            text: The readout from reservoir states
          - id: b
            text: Every recurrent weight necessarily
        answer: a
        feedback: The recurrent core can remain fixed.
        retired: true
      - id: reservoir-computing.base.2
        prompt: Can a readout recover information absent from the reservoir state?
        options:
          - id: a
            text: Not generally
          - id: b
            text: Always
          - id: c
            text: Only with linear regression
        answer: a
        feedback: The output mapping is limited by its input representation.
        retired: true
  - id: reservoir-computing.transfer
    objective_ref: objective.reservoir-computing
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate the complete temporal task: trace the inputs, operation, and result before choosing.'
    remediation_scene: reservoir-computing.s4
    variants:
      - id: reservoir-computing.transfer.1
        prompt: Why can overly fast state decay hurt?
        options:
          - id: a
            text: It removes useful temporal information
          - id: b
            text: It guarantees perfect long memory
          - id: c
            text: It increases every past signal forever
        answer: a
        feedback: Fading memory has a task-dependent timescale.
        retired: true
      - id: reservoir-computing.transfer.2
        prompt: Do fixed recurrent weights eliminate all model-selection cost?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only for physical reservoirs
          - id: a
            text: 'No'
        answer: a
        feedback: Reservoir and readout hyperparameters still need selection.
        retired: true
  - id: reservoir-computing.base.v2
    objective_ref: objective.reservoir-computing
    task: base
    response_type: single_choice
    points: 1
    hint: "Only W_out is trained, by one ridge-regression solve. The spectral radius of the fixed W sets how fast differences fade: below 1 they shrink, above 1 they tend to grow."
    remediation_scene: reservoir-computing.s3
    variants:
      - id: reservoir-computing.base.v2.1
        prompt: In an echo state network, which weights change during training?
        options:
          - id: b
            text: The recurrent weights W, tuned by backpropagation through time
          - id: a
            text: The readout weights W_out, fitted by ridge regression
          - id: c
            text: The input weights W_in, fitted to scale each input well
        answer: a
        feedback: W and W_in are drawn at random and kept fixed; you may rescale them by hand, but they aren't trained. Only the linear readout is fitted, in one solve.
      - id: reservoir-computing.base.v2.2
        prompt: Two copies of the same reservoir start from different states and receive identical inputs. Their states converge after a while. What property does this show?
        options:
          - id: a
            text: The echo state property, since the start is forgotten
          - id: b
            text: Overfitting, since both copies memorized the input
          - id: c
            text: A vanishing gradient, since the difference shrinks
        answer: a
        feedback: When the state depends only on the input history, differences in the starting state fade away; that's the echo state property. No training happened, so it isn't overfitting, and no gradient is involved.
      - id: reservoir-computing.base.v2.3
        prompt: A reservoir is rescaled from spectral radius 0.9 to 0.1. A task needs the input from 15 steps ago. What happens to performance?
        options:
          - id: c
            text: It improves, since a smaller radius makes the reservoir more stable
          - id: a
            text: It worsens, since the reservoir now forgets inputs within a few steps
          - id: b
            text: It stays the same, since the readout adapts to any reservoir
        answer: a
        feedback: With radius 0.1, echoes shrink roughly tenfold each step, so the input from 15 steps ago is gone. Stability isn't the issue at 0.9, and a readout can't recover forgotten information.
      - id: reservoir-computing.base.v2.4
        prompt: Why doesn't an echo state network suffer from vanishing gradients during training?
        options:
          - id: b
            text: Its tanh units keep gradients between −1 and 1 at every step
          - id: c
            text: Its spectral radius below 1 keeps gradients from shrinking
          - id: a
            text: No gradient is sent back through time, since only the readout is fit
        answer: a
        feedback: Training solves a linear system on the collected states, so there is no backpropagation through time at all. A radius below 1 would actually make gradients through time shrink.
  - id: reservoir-computing.transfer.v2
    objective_ref: objective.reservoir-computing
    task: transfer
    response_type: single_choice
    points: 1
    hint: "Check the memory the task needs against how fast the reservoir forgets, remember that a linear readout can't recover lost information, and ask whether the data and hardware favor a one-shot linear fit."
    remediation_scene: reservoir-computing.s4
    variants:
      - id: reservoir-computing.transfer.v2.1
        prompt: A wearable heart monitor must learn to predict each user's next few heartbeats from a few minutes of data, on a tiny chip. Why might an echo state network suit it?
        options:
          - id: a
            text: Training is one small linear solve, fast enough to run on the chip
          - id: b
            text: Its random reservoir is already pretrained on heart signals
          - id: c
            text: It learns every weight, so it can model any user exactly
        answer: a
        feedback: Only the readout is fitted, with one ridge-regression solve, which suits small data and weak hardware. The reservoir is random, not pretrained, and it isn't trained at all.
      - id: reservoir-computing.transfer.v2.2
        prompt: An engineer's reservoir predicts well on short tests, but its outputs depend on how it was initialized, even after long runs. What should she try?
        options:
          - id: c
            text: Increase λ in the ridge regression to shrink the readout weights
          - id: b
            text: Add more reservoir units while keeping the same weight scale
          - id: a
            text: Rescale W to a smaller spectral radius so the start fades
        answer: a
        feedback: Lasting dependence on the starting state means the echo state property is failing, usually because the spectral radius is too large. The readout's λ can't change what the reservoir remembers.
      - id: reservoir-computing.transfer.v2.3
        prompt: A photonics lab uses a laser loop as a physical reservoir to classify signals. What does training involve?
        options:
          - id: b
            text: Adjusting the laser's physical parameters by backpropagation
          - id: a
            text: Recording the reservoir's states and fitting a linear readout
          - id: c
            text: Replacing the laser with a simulated reservoir for training
        answer: a
        feedback: A physical reservoir can't be backpropagated through, which is exactly why reservoir computing fits it. Measure its responses and fit W_out; the physics does the rest.
      - id: reservoir-computing.transfer.v2.4
        prompt: A team wants to model long documents in many languages with millions of training examples. Should they use an echo state network?
        options:
          - id: a
            text: Probably not, since fully trained networks win at this scale
          - id: b
            text: Probably, since a bigger reservoir captures any structure
          - id: c
            text: Probably, since fixed weights can't overfit large data
        answer: a
        feedback: With abundant data and complex inputs, training every weight pays off, as transformers show. A random reservoir's features aren't tuned to language, however large it is.
  - id: reservoir-computing.calculate
    objective_ref: objective.reservoir-computing
    task: base
    response_type: numeric
    points: 1
    hint: "State update: h = a × (previous h) + u. Ridge for one weight: w = Σhy / (Σh² + λ). A starting difference is multiplied by the weight a each step."
    remediation_scene: reservoir-computing.s2
    absolute_tolerance: 0.01
    variants:
      - id: reservoir-computing.calculate.1
        prompt: A one-unit linear reservoir h(t) = 0.5 h(t−1) + u(t) starts at 0 and receives inputs 4, 0, 0. What is h after the third step?
        answer: 1
        feedback: The states are 4, then 2, then 1. Each step halves the echo.
      - id: reservoir-computing.calculate.2
        prompt: A one-unit reservoir has states 2, 1, 0.5 and targets 4, 2, 1. With ridge penalty λ = 0.25, what readout weight w = Σhy / (Σh² + λ) results?
        answer: 1.91
        feedback: Σhy = 8 + 2 + 0.5 = 10.5 and Σh² = 5.25, so w = 10.5 / 5.5 ≈ 1.91.
      - id: reservoir-computing.calculate.3
        prompt: States 1, 2, 3 and targets 2, 4, 6 are fitted with a ridge readout, λ = 0. What is w?
        answer: 2
        feedback: Σhy = 2 + 8 + 18 = 28 and Σh² = 1 + 4 + 9 = 14, so w = 28 / 14 = 2.
      - id: reservoir-computing.calculate.4
        prompt: Two runs of a one-unit linear reservoir with weight 0.5 start 8 apart and get the same inputs. How far apart are they after 3 steps?
        answer: 1
        feedback: The difference is multiplied by 0.5 each step, so 8 × 0.5³ = 1.
      - id: reservoir-computing.calculate.5
        prompt: A one-unit linear reservoir h(t) = 0.8 h(t−1) + u(t) is at h = 5 and receives input 1. What is the new state?
        answer: 5
        feedback: 0.8 × 5 + 1 = 4 + 1 = 5.
