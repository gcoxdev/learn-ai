schema_version: 0.2-draft
lesson:
  id: learning-routes
  version: 0.1.0-draft
  title: Choose a destination and follow its foundations
  state: draft
  summary: A learning path orders the prerequisites for a chosen outcome; depth views and math detours let you investigate
    unfamiliar ideas without losing your place.
  slot: M00.7
  category: common
  minutes: 12
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.learning-routes
  version: 1-draft
  statement: A learning path orders the prerequisites for a chosen outcome; depth views and math detours let you
    investigate unfamiliar ideas without losing your place.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - learning-routes.base
  - learning-routes.transfer
  prerequisites:
  - anyOf:
    - objective.ai-systems
scenes:
- id: learning-routes.s1
  title: Start with something you want to explain
  type: explanation
  depth: intuition
  objective_refs:
  - objective.learning-routes
  markdown: Choose a question such as how text becomes a response or how noise becomes an image. The destination
    gives the foundations a purpose. A path is a proposed sequence of learning objectives, not a claim that every
    topic in AI is required for every system.
  text_mode: Choose a question such as how text becomes a response or how noise becomes an image. The destination
    gives the foundations a purpose. A path is a proposed sequence of learning objectives, not a claim that every
    topic in AI is required for every system.
  bridges: []
- id: learning-routes.s2
  title: Read a prerequisite as a reason
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.learning-routes
  markdown: Attention mixes vectors, so vector addition and weighting prepare you for the mechanism. A transformer
    trace builds on attention and token representations. A historical survey supplies context but does not replace
    the numerical skill. Distinguish preparation needed to do a task from interesting background that can be read
    alongside it.
  text_mode: Attention mixes vectors, so vector addition and weighting prepare you for the mechanism. A transformer
    trace builds on attention and token representations. A historical survey supplies context but does not replace
    the numerical skill. Distinguish preparation needed to do a task from interesting background that can be read
    alongside it.
  bridges: []
- id: learning-routes.s3
  title: Take a small detour
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.learning-routes
  markdown: Suppose a lesson uses a derivative and the word is unfamiliar. Open the derivative side lesson, work
    through a local change example, and return to the original scene. You can also read the core explanation first
    and revisit formal mathematics later. Reading mode presents the same lesson in continuous order.
  text_mode: Suppose a lesson uses a derivative and the word is unfamiliar. Open the derivative side lesson, work
    through a local change example, and return to the original scene. You can also read the core explanation first
    and revisit formal mathematics later. Reading mode presents the same lesson in continuous order.
  bridges: []
- id: learning-routes.s4
  title: Use the map without becoming trapped by it
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.learning-routes
  markdown: Browse freely when comparing topics, but use the recommended path when prerequisites feel difficult.
    A connection on a diagram does not prove a strict dependency. Ask what specific explanation or calculation becomes
    possible after preparation. Draft paths and time estimates are starting points and should improve with evidence
    from learners.
  text_mode: Browse freely when comparing topics, but use the recommended path when prerequisites feel difficult.
    A connection on a diagram does not prove a strict dependency. Ask what specific explanation or calculation becomes
    possible after preparation. Draft paths and time estimates are starting points and should improve with evidence
    from learners.
  bridges: []
- id: learning-routes.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.learning-routes
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: learning-routes.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.learning-routes
  markdown: A learning path orders the prerequisites for a chosen outcome; depth views and math detours let you
    investigate unfamiliar ideas without losing your place.
  text_mode: A learning path orders the prerequisites for a chosen outcome; depth views and math detours let you
    investigate unfamiliar ideas without losing your place.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - learning-routes.s1
    - learning-routes.s2
    - learning-routes.s3
    - learning-routes.s4
    - learning-routes.check
    - learning-routes.recap
    gate_refs:
    - gate.core
assessment_families:
- id: learning-routes.base
  objective_ref: objective.learning-routes
  task: base
  response_type: single_choice
  points: 1
  hint: 'Read a prerequisite as a reason: trace the inputs, operation, and result before choosing.'
  remediation_scene: learning-routes.s2
  variants:
  - id: learning-routes.base.1
    prompt: Why learn vector weighting before attention value mixing?
    options:
    - id: c
      text: It proves that every attention weight is truthful
    - id: a
      text: It supplies the operation used by the mechanism
    - id: b
      text: All AI history depends on vectors
    answer: a
    feedback: A prerequisite should name an ability used in the target task.
  - id: learning-routes.base.2
    prompt: What is the purpose of a math detour?
    options:
    - id: a
      text: Learn a needed operation and return to its original use
    - id: b
      text: Erase the parent lesson’s progress
    - id: c
      text: Require a full degree before any explanation
    answer: a
    feedback: Short preparation keeps the original learning question visible.
- id: learning-routes.transfer
  objective_ref: objective.learning-routes
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Use the map without becoming trapped by it: trace the inputs, operation, and result before choosing.'
  remediation_scene: learning-routes.s4
  variants:
  - id: learning-routes.transfer.1
    prompt: An advanced learner can already explain attention. Must every background topic be repeated first?
    options:
    - id: a
      text: Use relevant evidence and check only unmet prerequisites
    - id: b
      text: Yes, viewing history is the only allowed evidence
    - id: c
      text: No assessment can ever be useful
    answer: a
    feedback: Preparation is objective-specific; demonstrated understanding can carry forward.
  - id: learning-routes.transfer.2
    prompt: A graph links robotics and language models. Does that make robotics a prerequisite for tokenization?
    options:
    - id: b
      text: Yes, every link is mandatory
    - id: c
      text: Yes, all nodes must be studied in alphabetical order
    - id: a
      text: No; a strict dependency needs a concrete instructional reason
    answer: a
    feedback: Conceptual association and necessary preparation are different edge meanings.
