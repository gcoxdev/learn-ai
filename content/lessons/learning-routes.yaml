schema_version: 0.2-draft
lesson:
  id: learning-routes
  version: 0.4.0-draft
  title: How to use this school without getting lost
  state: draft
  summary: Rereading feels like learning, but often isn't. Find your way around the course, and pick up the study habits that make ideas stick.
  slot: M00.10
  category: common
  sources:
    - title: Dive into Deep Learning — introduction
      url: https://d2l.ai/chapter_introduction/index.html
    - title: "Test-Enhanced Learning: Taking Memory Tests Improves Long-Term Retention (Roediger & Karpicke, 2006)"
      url: https://doi.org/10.1111/j.1467-9280.2006.01693.x
  archetype: foundation
objectives:
  - id: objective.learning-routes
    version: 3-draft
    statement: A learning path orders the prerequisites for a chosen outcome; depth views and math detours let you investigate unfamiliar ideas without losing your place.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - learning-routes.base.v3
      - learning-routes.transfer.v3
    prerequisites:
      - anyOf:
          - objective.thinking-critically
scenes:
  - id: learning-routes.s1
    title: Start with a question you care about
    type: explanation
    depth: intuition
    objective_refs:
      - objective.learning-routes
    markdown: |-
      Maybe you want to know how a chat assistant writes its replies. Maybe it's how an image generator turns a sentence into a picture, or how a robot vacuum finds its way around. Each of those questions has a learning path in this course: an ordered set of lessons that leads to an answer.

      Every path starts with the lessons you've just finished, because inputs, examples, models, weights, and testing show up everywhere. After that, the paths split. You don't need the whole catalog to understand your question. You need the right lessons in the right order.

      A path isn't a cage, either. You can wander into any lesson that catches your eye and come back.
  - id: learning-routes.s2
    title: Prerequisites are the step before
    type: explanation
    depth: intuition
    objective_refs:
      - objective.learning-routes
    markdown: |-
      A **prerequisite** is an idea a later lesson builds on. You've already felt this chain in action:

      | To follow… | You first needed… |
      | --- | --- |
      | Training (fitting a weight) | What a weight is |
      | What a weight is | Multiplying equal groups |
      | Testing a model | Why examples need labels |

      Here's a useful rule of thumb. If a lesson suddenly feels impossible, the missing piece is usually one step back, not a problem with you. Find the idea the lesson assumes, and the hard part often turns easy.
  - id: learning-routes.s3
    title: Side lessons fill a gap and bring you back
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.learning-routes
    markdown: |-
      A **bridge** is a short side lesson that fills in one missing skill, often a bit of math. The weights lesson linked to an arithmetic bridge for anyone whose multiplication felt rusty. When you open a bridge, the course remembers where you were and gives you a button to return.

      Use bridges when a specific step blocks you, not "just in case." If you can follow the snack calculation, you don't need a refresher first. Later bridges cover things like vectors and probability, right before the lessons that use them. They're there to help, not a sign that you were supposed to know it already.

      You can also read a lesson one part at a time, or all on one page if you like to scroll back and forth.
  - id: learning-routes.s4
    title: Why rereading fools you
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.learning-routes
    markdown: |-
      Read a lesson three times and it starts to feel easy. Every sentence looks familiar. But recognizing an idea on the page is much easier than pulling it out of your own head. Mistaking that familiar feeling for understanding is called the **illusion of fluency**.

      :::predict Two students have 30 minutes. One rereads a lesson three times. The other reads it once, then closes it and writes down everything they remember, twice. Who remembers more a week later?
      Usually the second student, even though the first one feels more confident right afterward.
      :::

      :::story Test-enhanced learning
      In a 2006 study, psychologists Henry Roediger and Jeffrey Karpicke had students either reread a short passage or practice recalling it. After five minutes, rereading looked slightly better. After a week, the students who had practiced recalling remembered much more.
      :::

      Pulling an idea out of memory, instead of looking at it again, is called **retrieval practice**. It feels harder. That effort is what makes it work.
  - id: learning-routes.s5
    title: End each lesson in your own words
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.learning-routes
    markdown: |-
      Each lesson ends with a takeaway (the one idea worth keeping after the details fade) and a few practice questions set in new situations.

      Before you read the takeaway, try this: close your eyes and say the lesson's main idea out loud, as if to a friend who missed it. For the training lesson, you might say: "Training changes the weight to fit examples. Inference just uses it. Chatting changes the input, not the weight."

      If you get stuck halfway, that's useful, not embarrassing. The exact spot where your explanation breaks down is the part to review. Then try the questions: they use examples you haven't seen, which is the real test of whether an idea has stuck.
  - id: learning-routes.s6
    title: Space it out and keep a question list
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.learning-routes
    markdown: |-
      Memory fades fast at first. Coming back to an idea after a gap, once it has started to fade, makes it last much longer. This is called **spaced practice**. A simple plan:

      | When | What to do (5 minutes) |
      | --- | --- |
      | Day 1 | Finish the lesson and explain it aloud |
      | Day 2 | Without looking, write down its three key ideas |
      | Day 5 | Work one fresh example, like a new snack party |

      Keep a short question list too. Instead of "I don't get weights," write a specific question: "When the answer changed, did I change the input or the weight?" A specific question tells you exactly which example to go back to, and changing one number at a time usually answers it.
  - id: learning-routes.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.learning-routes
    markdown: Vocabulary lists, week-long study plans, and confusing lessons ask you to choose the move that actually builds understanding.
    takeaway: |-
      Follow a path toward a question you care about, step back to a prerequisite or bridge when you're stuck, and study by recalling and explaining ideas, spaced over several days, rather than rereading.
  - id: learning-routes.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.learning-routes
    markdown: |-
      A learning path orders the prerequisites for a chosen outcome; depth views and math detours let you investigate unfamiliar ideas without losing your place.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - learning-routes.s1
        - learning-routes.s2
        - learning-routes.s3
        - learning-routes.s4
        - learning-routes.s5
        - learning-routes.s6
        - learning-routes.check
      gate_refs:
        - gate.core
  scene_aliases:
    learning-routes.recap: learning-routes.check
assessment_families:
  - id: learning-routes.base
    objective_ref: objective.learning-routes
    task: base
    response_type: single_choice
    points: 1
    hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
    remediation_scene: learning-routes.s3
    variants:
      - id: learning-routes.base.1
        prompt: Why learn vector weighting before attention value mixing?
        options:
          - id: c
            text: It proves that every attention weight is truthful
          - id: a
            text: It supplies the operation used by the mechanism
          - id: b
            text: All AI history depends on vectors
        answer: a
        feedback: A prerequisite should name an ability used in the target task.
        retired: true
      - id: learning-routes.base.2
        prompt: What is the purpose of a math detour?
        options:
          - id: a
            text: Learn a needed operation and return to its original use
          - id: b
            text: Erase the parent lesson’s progress
          - id: c
            text: Require a full degree before any explanation
        answer: a
        feedback: Short preparation keeps the original learning question visible.
        retired: true
      - id: learning-routes.base.v2.1
        prompt: What is the purpose of a prerequisite?
        options:
          - id: b
            text: Measure how quickly a learner reads
          - id: c
            text: Require every catalog lesson before starting
          - id: a
            text: Prepare an idea needed by a later lesson
        answer: a
        feedback: A prerequisite should make a particular next explanation understandable.
        retired: true
      - id: learning-routes.base.v2.2
        prompt: A calculation uses multiplication you have not practiced. Which action fits the school’s design?
        options:
          - id: c
            text: Change to an unrelated advanced chapter
          - id: a
            text: Open the arithmetic side lesson
          - id: b
            text: Memorize the final number without the steps
        answer: a
        feedback: A bridge supplies the missing step and lets you return.
        retired: true
      - id: learning-routes.base.v2.3
        prompt: Which mode puts the lesson into one scrollable page?
        options:
          - id: a
            text: Read as a page
          - id: b
            text: Presentation
          - id: c
            text: Save lesson
        answer: a
        feedback: The reading mode changes the format, not the learning objective.
        retired: true
      - id: learning-routes.base.v2.4
        prompt: What is a takeaway?
        options:
          - id: b
            text: A question used to check your understanding
          - id: c
            text: A list of abilities required before the lesson
          - id: a
            text: The central idea to remember later
        answer: a
        feedback: It restates the useful idea rather than certifying performance.
        retired: true
      - id: learning-routes.base.v2.5
        prompt: A lesson’s formula is hard to follow because a symbol is unfamiliar. What is a useful way to continue?
        options:
          - id: a
            text: Treat the unfamiliar symbol as decoration
          - id: b
            text: Skip to an unrelated final project
          - id: c
            text: Open the relevant explanation or side lesson
        answer: c
        feedback: A side lesson supplies preparation so the original explanation becomes easier to follow.
        retired: true
      - id: learning-routes.base.v2.6
        prompt: You want to compare the beginning and ending of a lesson on one page. Which mode helps?
        options:
          - id: a
            text: Read as a page
          - id: b
            text: Save lesson
          - id: c
            text: Export progress
        answer: a
        feedback: Continuous reading puts the lesson in one scrollable page. Saving and exporting have different purposes.
        retired: true
  - id: learning-routes.transfer
    objective_ref: objective.learning-routes
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
    remediation_scene: learning-routes.s3
    variants:
      - id: learning-routes.transfer.1
        prompt: An advanced learner can already explain attention. Must every background topic be repeated first?
        options:
          - id: a
            text: Use relevant evidence and check only unmet prerequisites
          - id: b
            text: Yes, viewing history is the only allowed evidence
          - id: c
            text: No assessment can ever be useful
        answer: a
        feedback: Preparation is objective-specific; demonstrated understanding can carry forward.
        retired: true
      - id: learning-routes.transfer.2
        prompt: A graph links robotics and language models. Does that make robotics a prerequisite for tokenization?
        options:
          - id: b
            text: Yes, every link is mandatory
          - id: c
            text: Yes, all nodes must be studied in alphabetical order
          - id: a
            text: No; a strict dependency needs a concrete instructional reason
        answer: a
        feedback: Conceptual association and necessary preparation are different edge meanings.
        retired: true
      - id: learning-routes.transfer.v2.1
        prompt: Which note best identifies a specific confusion?
        options:
          - id: c
            text: I need a different learning path
          - id: a
            text: Did the input change or the weight?
          - id: b
            text: I want to learn all the examples again
        answer: a
        feedback: A focused question points to a relationship you can investigate.
        retired: true
      - id: learning-routes.transfer.v2.2
        prompt: Two paths both use the same input/output idea. What is useful about shared foundations?
        options:
          - id: a
            text: Evidence of that understanding can carry over
          - id: b
            text: Shared ideas need a new pass every time they appear
          - id: c
            text: Choosing another path removes the earlier evidence
        answer: a
        feedback: The same concept need not be treated as entirely new on another path.
        retired: true
      - id: learning-routes.transfer.v2.3
        prompt: You can name a term but cannot explain the example. What is a useful next step?
        options:
          - id: b
            text: Reread just the term until it sounds familiar
          - id: c
            text: Take recognition of the term as evidence for the example
          - id: a
            text: Work through the example one change at a time
        answer: a
        feedback: Applying the idea exposes which relationship remains unclear.
        retired: true
      - id: learning-routes.transfer.v2.4
        prompt: What should you expect at the end of a lesson?
        options:
          - id: c
            text: An automatic grade for any outside project
          - id: a
            text: A takeaway, a check, and return links together
          - id: b
            text: A separate final-thought screen after leaving
        answer: a
        feedback: The combined closing page keeps the stopping and continuation choices together.
        retired: true
      - id: learning-routes.transfer.v2.5
        prompt: You understand an example until its weight changes. Which note would make revisiting it easier?
        options:
          - id: a
            text: Why did changing the weight change this output?
          - id: b
            text: Study every path from the beginning
          - id: c
            text: This entire subject is unclear
        answer: a
        feedback: A precise question identifies the missing connection and gives you a concrete step to investigate.
        retired: true
      - id: learning-routes.transfer.v2.6
        prompt: A later path uses an idea you already demonstrated under the same standard. What should you expect?
        options:
          - id: a
            text: The earlier record is deleted on changing paths
          - id: b
            text: Compatible evidence can count on the later path
          - id: c
            text: Every new topic on the later path is automatically complete
        answer: b
        feedback: Shared evidence travels with the idea. It does not demonstrate the new topics added by another path.
        retired: true
  - id: learning-routes.base.v3
    objective_ref: objective.learning-routes
    task: base
    response_type: single_choice
    points: 1
    hint: Ask whether each option makes you pull the idea out of your own memory, or only look at it again. When you're stuck, look one step back for the idea the lesson assumes.
    remediation_scene: learning-routes.s4
    variants:
      - id: learning-routes.base.v3.1
        prompt: The training lesson assumes you know what a weight is. In this course, what is the weights lesson to the training lesson?
        options:
          - id: a
            text: A harder version of the same lesson
          - id: b
            text: A prerequisite it builds on
          - id: c
            text: A side lesson you can safely ignore
        answer: b
        feedback: A prerequisite is an idea a later lesson builds on. You can't follow fitting a weight until you know what a weight does.
      - id: learning-routes.base.v3.2
        prompt: Halfway through a lesson, you realize multiplying equal groups feels shaky. What is the most useful move?
        options:
          - id: a
            text: Keep going and hope it becomes clear later on
          - id: b
            text: Restart the whole path from its very first lesson
          - id: c
            text: Open the arithmetic bridge, then come back here
        answer: c
        feedback: A bridge fills the one missing skill and returns you to your place. Restarting everything wastes time on parts you already know.
      - id: learning-routes.base.v3.3
        prompt: After reading a lesson three times, it feels easy. Why can that feeling mislead you?
        options:
          - id: c
            text: Rereading tends to erase what you learned the first time
          - id: b
            text: A lesson that feels easy is probably too short to matter
          - id: a
            text: Recognizing ideas is easier than recalling them
        answer: a
        feedback: That's the illusion of fluency. Familiar-looking sentences feel understood, but recalling or using the idea without the page is much harder, and it's what you'll need later.
      - id: learning-routes.base.v3.4
        prompt: Which of these study moves is retrieval practice?
        options:
          - id: c
            text: Closing the lesson and writing the steps from memory
          - id: b
            text: Highlighting all the key sentences while you read them
          - id: a
            text: Reading the lesson summary one more time before bed
        answer: c
        feedback: Retrieval practice means pulling the idea out of your own memory. Highlighting and rereading both keep the answer in front of you.
      - id: learning-routes.base.v3.5
        prompt: Which review plan is spaced practice?
        options:
          - id: b
            text: Three reviews in a row on the same evening
          - id: a
            text: Short recall sessions on days 1, 2, and 5
          - id: c
            text: One long review the night before you need it
        answer: a
        feedback: Spacing means coming back after gaps, as memory starts to fade. Reviews bunched into one evening feel productive but fade faster.
      - id: learning-routes.base.v3.6
        prompt: Which note to yourself will be most useful when you come back to the weights lesson?
        options:
          - id: a
            text: '"I honestly don''t get any part of this lesson at all."'
          - id: b
            text: '"When the answer changed, was it input or weight?"'
          - id: c
            text: '"Weights: very important, remember them for later!"'
        answer: b
        feedback: A specific question points straight to the example to redo. A vague note or a reminder that something matters gives you nowhere to start.
  - id: learning-routes.transfer.v3
    objective_ref: objective.learning-routes
    task: transfer
    response_type: single_choice
    points: 1
    hint: Pick the option that makes you recall, explain, or apply the idea, spread over time, or that fills the one missing step, rather than looking at the same material again.
    remediation_scene: learning-routes.s5
    variants:
      - id: learning-routes.transfer.v3.1
        prompt: Sam is learning Spanish words by reading his list over and over. Which change would help him most?
        options:
          - id: c
            text: Copy the whole list out again, neatly, by hand, twice
          - id: a
            text: Read the list aloud each time instead of silently
          - id: b
            text: Cover the English side and try to recall each word
        answer: b
        feedback: Covering the answers turns reading into retrieval practice. Copying and reading aloud still keep the answers in view, so they build the feeling of knowing more than the knowing.
      - id: learning-routes.transfer.v3.2
        prompt: Priya wants to understand how chatbots write replies, but a lesson on her path keeps using the word "vector," which she doesn't know. What is her best move?
        options:
          - id: c
            text: Take the short side lesson on vectors, then return
          - id: b
            text: Memorize the lesson's sentences that mention vectors
          - id: a
            text: Skip to the end of the path and try the final project
        answer: c
        feedback: The blocker is one missing prerequisite, so fill that gap and come back. Memorized sentences about an unknown word won't help her use it.
      - id: learning-routes.transfer.v3.3
        prompt: A test is one week away. Which plan usually leads to the best memory on test day and after?
        options:
          - id: b
            text: One four-hour session of rereading the night before
          - id: c
            text: Rereading all your notes every night, without quizzing
          - id: a
            text: Short sessions all week, recalling without notes
        answer: a
        feedback: This plan combines spacing with retrieval practice. Nightly rereading is spaced but never tests recall, and one long session is neither.
      - id: learning-routes.transfer.v3.4
        prompt: You can recite the definition of "weight" word for word, but you can't work out a new snack prediction. What does this suggest?
        options:
          - id: a
            text: You've mastered it, since the definition is word-perfect
          - id: c
            text: You recognize the term but can't use it yet
          - id: b
            text: The lesson's definition must have been worded wrong
        answer: c
        feedback: Reciting a definition is recognition. Being able to use the idea on a fresh example is the goal, so practice with new numbers.
      - id: learning-routes.transfer.v3.5
        prompt: You try to explain to a friend how a spam filter learns, and you get stuck halfway through. What is that moment most useful for?
        options:
          - id: c
            text: Deciding to switch to an easier topic for now
          - id: a
            text: Showing you exactly which step to go back to
          - id: b
            text: Showing that you need to reread the whole course
        answer: a
        feedback: The spot where an explanation breaks down marks the one idea that isn't solid yet. Review that step, not everything.
      - id: learning-routes.transfer.v3.6
        prompt: A lesson on image generators feels impossible, even after two careful readings. What should you try first?
        options:
          - id: a
            text: Read it a third time, much more slowly and carefully
          - id: c
            text: Decide that image generators just aren't for you
          - id: b
            text: Find the earlier idea the lesson takes for granted
        answer: b
        feedback: When a lesson feels impossible, the missing piece is usually a prerequisite one step back. A third reading of the same page rarely supplies it.
