lesson:
  id: efficient-attention-kernels
  version: 0.2.0-draft
  title: Compute attention with less memory traffic
  state: draft
  summary: Compute the same attention result in smaller pieces and see which memory movement the implementation
    saves.
  slot: M17.7
  category: learning
  sources:
  - title: FlashAttention
    url: https://arxiv.org/abs/2205.14135
objectives:
- id: objective.efficient-attention-kernels
  version: 1-draft
  statement: Tiled attention kernels can preserve dense attention mathematics while avoiding a fully stored
    score matrix; kernel fusion and overlap improve execution without automatically changing asymptotic arithmetic.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - efficient-attention-kernels.base
  - efficient-attention-kernels.transfer
  prerequisites:
  - anyOf:
    - objective.transformer-trace
  - anyOf:
    - objective.compute-and-bandwidth
scenes:
- id: efficient-attention-kernels.s1
  title: The equation and its implementation differ
  type: explanation
  depth: intuition
  objective_refs:
  - objective.efficient-attention-kernels
  markdown: 'Dense attention forms scaled query-key scores, applies a mask and softmax, and mixes values. A
    straightforward implementation stores large intermediate score and probability arrays. Another implementation
    can calculate the same result, up to floating-point differences, while arranging work in smaller tiles.


    A **tile** is a small block of an array processed together. Fast on-device working memory is limited, so
    tiling tries to reuse data there instead of repeatedly reading and writing larger memory. The attention
    equation can stay the same while the order and location of its calculations change.'
  text_mode: 'Dense attention forms scaled query-key scores, applies a mask and softmax, and mixes values.
    A straightforward implementation stores large intermediate score and probability arrays. Another implementation
    can calculate the same result, up to floating-point differences, while arranging work in smaller tiles.


    A **tile** is a small block of an array processed together. Fast on-device working memory is limited, so
    tiling tries to reuse data there instead of repeatedly reading and writing larger memory. The attention
    equation can stay the same while the order and location of its calculations change.'
  bridges: []
- id: efficient-attention-kernels.s2
  title: Normalize across tiles
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.efficient-attention-kernels
  markdown: 'An online softmax maintains a running maximum, normalization sum, and rescaled value accumulator
    as key tiles arrive. When a new maximum appears, previous totals are rescaled before combining. This allows
    a query’s normalized weighted sum without keeping every attention probability in expensive external memory.


    Stable softmax subtracts the largest score before exponentiating. Suppose the first score is 1: its running
    maximum is 1 and exponential total is 1. A new score of 3 raises the maximum to 3. Rescale the old total
    by exp(1 − 3) = exp(−2), then add the new contribution 1. The total now represents both scores under the
    same reference maximum. The value accumulator needs the corresponding rescaling too.'
  text_mode: 'An online softmax maintains a running maximum, normalization sum, and rescaled value accumulator
    as key tiles arrive. When a new maximum appears, previous totals are rescaled before combining. This allows
    a query’s normalized weighted sum without keeping every attention probability in expensive external memory.


    Stable softmax subtracts the largest score before exponentiating. Suppose the first score is 1: its running
    maximum is 1 and exponential total is 1. A new score of 3 raises the maximum to 3. Rescale the old total
    by exp(1 − 3) = exp(−2), then add the new contribution 1. The total now represents both scores under the
    same reference maximum. The value accumulator needs the corresponding rescaling too.'
  bridges: []
- id: efficient-attention-kernels.s3
  title: Save traffic, retain the dense pairs
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.efficient-attention-kernels
  markdown: FlashAttention-style methods reduce input/output traffic and intermediate storage through tiling
    and recomputation. Exact dense attention still considers the permitted query-key pairs, so reducing memory
    movement does not by itself turn quadratic dense arithmetic into linear attention. Masks and supported
    shapes constrain kernels.
  text_mode: FlashAttention-style methods reduce input/output traffic and intermediate storage through tiling
    and recomputation. Exact dense attention still considers the permitted query-key pairs, so reducing memory
    movement does not by itself turn quadratic dense arithmetic into linear attention. Masks and supported
    shapes constrain kernels.
  bridges: []
- id: efficient-attention-kernels.s4
  title: Fuse and overlap with measurements
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.efficient-attention-kernels
  markdown: 'Fusing small operations can avoid launches and temporary writes. Overlapping communication with
    useful computation can hide some transfer time. Both depend on resource availability and scheduling; benchmark
    numerical agreement, peak memory, and end-to-end runtime rather than extrapolating one kernel’s speedup
    to the whole model.


    **Fusion** combines operations in one routine so intermediate values can stay local. **Asymptotic** growth
    describes how work scales as the problem grows, such as roughly with context length squared. A smaller
    memory footprint and lower practical runtime can be major gains even when that pair-count scaling remains
    quadratic.'
  text_mode: 'Fusing small operations can avoid launches and temporary writes. Overlapping communication with
    useful computation can hide some transfer time. Both depend on resource availability and scheduling; benchmark
    numerical agreement, peak memory, and end-to-end runtime rather than extrapolating one kernel’s speedup
    to the whole model.


