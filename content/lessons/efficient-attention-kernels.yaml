assessment_families:
  - id: efficient-attention-kernels.base
    objective_ref: objective.efficient-attention-kernels
    task: base
    response_type: single_choice
    points: 1
    hint: 'Normalize across tiles: trace the inputs, operation, and result before choosing.'
    remediation_scene: efficient-attention-kernels.s2
    variants:
      - id: efficient-attention-kernels.base.1
        prompt: Does avoiding a stored score matrix necessarily approximate attention?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if no mask is used
          - id: a
            text: No; tiled algorithms can compute exact dense attention up to rounding
        answer: a
        feedback: The execution schedule can change without changing the intended equation.
        retired: true
      - id: efficient-attention-kernels.base.2
        prompt: What does online softmax maintain across tiles?
        options:
          - id: c
            text: A new training corpus
          - id: a
            text: A running normalization and appropriately rescaled weighted sum
          - id: b
            text: Only the largest token ID
        answer: a
        feedback: Stable normalization combines contributions without retaining all scores.
        retired: true
  - id: efficient-attention-kernels.transfer
    objective_ref: objective.efficient-attention-kernels
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Fuse and overlap with measurements: trace the inputs, operation, and result before choosing.'
    remediation_scene: efficient-attention-kernels.s4
    variants:
      - id: efficient-attention-kernels.transfer.1
        prompt: Does lower attention memory traffic prove linear dense-attention FLOPs?
        options:
          - id: c
            text: Only for long sequences
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Memory traffic and pairwise arithmetic are different costs.
        retired: true
      - id: efficient-attention-kernels.transfer.2
        prompt: Why measure full-step speed after kernel fusion?
        options:
          - id: a
            text: Other operations or communication may dominate
          - id: b
            text: Kernel speedups always multiply overall speed equally
          - id: c
            text: Fusion removes all bottlenecks
        answer: a
        feedback: The critical path determines total runtime.
        retired: true
  - id: efficient-attention-kernels.base.v2
    objective_ref: objective.efficient-attention-kernels
    task: base
    response_type: single_choice
    points: 1
    hint: FlashAttention changes where the numbers live (on-chip tiles instead of n × n matrices in HBM), not which query-key pairs are computed. When the running max rises, the old sum and output are multiplied by e^(old max − new max).
    remediation_scene: efficient-attention-kernels.s2
    variants:
      - id: efficient-attention-kernels.base.v2.1
        prompt: What does FlashAttention avoid writing to HBM?
        options:
          - id: b
            text: The Q, K, and V matrices for each head
          - id: a
            text: The n × n score and probability matrices
          - id: c
            text: The attention output for each query
        answer: a
        feedback: Q, K, and V are read from HBM and the output is written there; what never leaves the chip are the n × n scores and probabilities, which are built and used one tile at a time.
      - id: efficient-attention-kernels.base.v2.2
        prompt: An online softmax has running max 2 and running sum 1.5. The next tile's largest score is 5. Before adding the new tile, what is the old sum multiplied by?
        options:
          - id: a
            text: e^(2 − 5) = e^(−3), to measure it against the new max
          - id: c
            text: e^(5 − 2) = e³, to catch up with the larger score
          - id: b
            text: Nothing, since the new terms can simply be added on
        answer: a
        feedback: The old terms were computed as e^(s − 2); against the new max they should be e^(s − 5), which is e^(−3) times smaller. Adding without rescaling would mix two different reference points.
      - id: efficient-attention-kernels.base.v2.3
        prompt: Compared with standard attention, how does FlashAttention's training step change the work done?
        options:
          - id: c
            text: Fewer FLOPs, since it skips most query-key pairs
          - id: b
            text: Same FLOPs and bytes, but in a better order
          - id: a
            text: Somewhat more FLOPs, but many fewer bytes moved
        answer: a
        feedback: Recomputing scores in the backward pass adds FLOPs, but not writing or reading the n × n matrices cuts HBM traffic sharply. Attention is memory-bound, so the trade makes it faster. Every allowed pair is still computed.
      - id: efficient-attention-kernels.base.v2.4
        prompt: During the backward pass, how does FlashAttention get the attention probabilities it needs?
        options:
          - id: b
            text: It reads them back from HBM, where the forward pass saved them
          - id: a
            text: It recomputes them block by block from Q, K, and saved row statistics
          - id: c
            text: It approximates them from the forward output, without exact scores
        answer: a
        feedback: Forward saves only the output and each row's softmax statistics. Backward rebuilds each block of scores from Q and K and uses the statistics to normalize them exactly. Nothing n × n was stored.
  - id: efficient-attention-kernels.transfer.v2
    objective_ref: objective.efficient-attention-kernels
    task: transfer
    response_type: single_choice
    points: 1
    hint: Separate three costs, arithmetic (still quadratic), stored memory (now linear), and bytes moved, then ask which one the situation is about.
    remediation_scene: efficient-attention-kernels.s4
    variants:
      - id: efficient-attention-kernels.transfer.v2.1
        prompt: A team using FlashAttention doubles its context length from 4,096 to 8,192 tokens. Roughly how do attention FLOPs and attention memory change?
        options:
          - id: a
            text: FLOPs grow about 4×, while attention memory grows about 2×
          - id: b
            text: FLOPs and attention memory both grow about 2×
          - id: c
            text: FLOPs and attention memory both grow about 4×
        answer: a
        feedback: Every query still meets every allowed key, so pair count and FLOPs grow with n². FlashAttention stores nothing n × n, so its memory grows with n. Standard attention would have been 4× on both.
      - id: efficient-attention-kernels.transfer.v2.2
        prompt: A genomics model reads 32,000-token DNA sequences, and its standard attention runs out of memory even at batch size 1. The team wants to keep exact attention. What fits best?
        options:
          - id: c
            text: Store the score matrix in FP8 so it takes half the space
          - id: b
            text: Switch to sliding-window attention over nearby positions
          - id: a
            text: Use a fused, tiled attention kernel such as FlashAttention
        answer: a
        feedback: A tiled kernel computes exact attention without storing any 32,000 × 32,000 matrix. FP8 only halves a quadratic cost, and a sliding window changes which pairs are computed, so it's no longer the same attention.
      - id: efficient-attention-kernels.transfer.v2.3
        prompt: After switching to a fused attention kernel, a team measures the attention kernel running 3× faster, but the whole training step only 10% faster. What is the likeliest explanation?
        options:
          - id: a
            text: Attention was a small share of the step; other matmuls and communication dominate
          - id: b
            text: The fused kernel's backward pass is slower, which cancels most of the gain
          - id: c
            text: GPU clock speeds vary between runs, so the step timing is unreliable
        answer: a
        feedback: A step's time is the sum over its critical path. If attention took about 15% of the step, making it 3× faster saves about 10%. The MLP and projection matmuls and gradient exchange are untouched.
      - id: efficient-attention-kernels.transfer.v2.4
        prompt: A research model adds a position-dependent bias to each attention score before the softmax. What must be true for a tiled kernel to include it exactly?
        options:
          - id: b
            text: The bias must be zero for most query-key pairs in each row
          - id: a
            text: Each tile's bias values can be computed or loaded as that tile is processed
          - id: c
            text: The kernel must first compute the full softmax row to apply the bias
        answer: a
        feedback: The online softmax works on any scores, as long as each tile's scores, bias included, are available when that tile is processed. Masks work the same way. Needing the full row first would defeat the tiling, and the bias needn't be sparse.
  - id: efficient-attention-kernels.calculate
    objective_ref: objective.efficient-attention-kernels
    task: base
    response_type: numeric
    points: 1
    hint: "An n × n bf16 matrix takes 2n² bytes per head. For online softmax, multiply the old sum by e^(old max − new max), then add e^(score − new max) for each new score."
    remediation_scene: efficient-attention-kernels.s2
    absolute_tolerance: 0.05
    variants:
      - id: efficient-attention-kernels.calculate.1
        prompt: For one head with an 8,192-token sequence, how many MB (10⁶ bytes) does the full bf16 score matrix take?
        answer: 134.2
        feedback: 8,192² × 2 bytes = 134,217,728 bytes ≈ 134.2 MB, for one head in one layer.
      - id: efficient-attention-kernels.calculate.2
        prompt: For 32 heads and a 4,096-token sequence, how many GB (10⁹ bytes) do one layer's bf16 score matrices take in total?
        answer: 1.07
        feedback: 4,096² × 2 bytes ≈ 33.6 MB per head, × 32 heads ≈ 1.07 GB per layer.
      - id: efficient-attention-kernels.calculate.3
        prompt: An online softmax has seen one score, 1, so its running max is 1 and its running sum is 1. A new score of 3 arrives. What is the new running sum, to two decimal places?
        answer: 1.14
        feedback: The old sum is rescaled by e^(1 − 3) = e^(−2) ≈ 0.135, and the new score adds e^(3 − 3) = 1, giving about 1.14.
      - id: efficient-attention-kernels.calculate.4
        prompt: A query has two keys in separate tiles, with scores 0 and ln 3 (about 1.0986) and scalar values 2 and 6. What attention output does the online softmax produce?
        answer: 5
        feedback: The weights are proportional to e⁰ = 1 and e^(ln 3) = 3, so the output is (1 × 2 + 3 × 6) ÷ 4 = 5. The online and standard softmax agree.
      - id: efficient-attention-kernels.calculate.5
        prompt: Context length goes from 2,048 to 8,192 tokens. By what factor do dense attention's score FLOPs grow?
        answer: 16
        feedback: The pair count grows with n², and (8,192 ÷ 2,048)² = 4² = 16. Tiling doesn't change this.
      - id: efficient-attention-kernels.calculate.6
        prompt: FlashAttention saves one fp32 softmax statistic (4 bytes) per query per head. For a 4,096-token sequence and 32 heads, how many MB is that per layer?
        answer: 0.52
        feedback: 4,096 × 32 × 4 bytes = 524,288 bytes ≈ 0.52 MB, against about 1 GB for the probability matrices it replaces.
