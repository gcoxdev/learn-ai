schema_version: 0.2-draft
lesson:
  id: efficient-attention-kernels
  version: 0.4.0-draft
  title: Compute attention with less memory traffic
  state: draft
  summary: Standard attention writes a gigabyte-sized score matrix to memory just to read it back. FlashAttention never writes it, and still gets exactly the same answer. Here's the trick.
  slot: M17.7
  category: learning
  sources:
    - title: "FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness (Dao et al., 2022)"
      url: https://arxiv.org/abs/2205.14135
    - title: "Online normalizer calculation for softmax (Milakov & Gimelshein, 2018)"
      url: https://arxiv.org/abs/1805.02867
    - title: "FlashAttention-2: Faster Attention with Better Parallelism and Work Partitioning (Dao, 2023)"
      url: https://arxiv.org/abs/2307.08691
    - title: "FlashAttention-3: Fast and Accurate Attention with Asynchrony and Low-precision (Shah et al., 2024)"
      url: https://arxiv.org/abs/2407.08608
objectives:
  - id: objective.efficient-attention-kernels
    version: 2-draft
    statement: Tiled attention kernels can preserve dense attention mathematics while avoiding a fully stored score matrix; kernel fusion and overlap improve execution without automatically changing asymptotic arithmetic.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - efficient-attention-kernels.base.v2
      - efficient-attention-kernels.transfer.v2
      - efficient-attention-kernels.calculate
    prerequisites:
      - anyOf:
          - objective.transformer-trace
      - anyOf:
          - objective.compute-and-bandwidth
scenes:
  - id: efficient-attention-kernels.s1
    title: A gigabyte nobody needs to keep
    type: explanation
    depth: intuition
    objective_refs:
      - objective.efficient-attention-kernels
    markdown: |-
      In each of the team's layers, attention computes $\text{softmax}(QK^\top/\sqrt{d})\,V$ for 32 heads over a 4,096-token sequence. A straightforward implementation does it in separate steps, each a round trip through HBM:

      1. Compute the scores $S = QK^\top/\sqrt{d}$ and write them to HBM: 4,096 × 4,096 numbers per head.
      2. Read $S$ back, apply the mask and softmax, and write the probabilities $P$.
      3. Read $P$ back and multiply by $V$ to get the output.

      Each head's $S$ is 4,096² × 2 bytes ≈ 33.6 MB; across 32 heads that's 1.07 GB per layer, written and read twice, while $Q$, $K$, $V$, and the output together are only about 134 MB. Softmax does a few FLOPs per number, so steps 1–2 sit far down the bandwidth slope of the roofline. For training, $P$ (plus its dropout mask and dropped-out copy) must also be kept for the backward pass. That's the 86 GB attention term from the lesson on training memory.

      The GPU has a much faster memory than HBM: each of the A100's 108 streaming multiprocessors has 192 KB of on-chip **SRAM**, which the FlashAttention paper estimates at around 19 TB/s against HBM's 1.5–2 TB/s. It's far too small to hold a 33.6 MB matrix. But it can hold a **tile**, a small block such as 128 queries by 128 keys. If each tile's scores could be used and thrown away while still in SRAM, the big matrix would never touch HBM. The obstacle is softmax: every probability divides by a sum over *all* keys in the row, which you don't have until you've seen every tile.
    diagram:
      caption: Two routes to the same attention output. The standard route writes the n × n matrices to HBM; the tiled route keeps each block on chip.
      description: Q, K, and V start in HBM. On the standard route, scores S are written to HBM, read back for softmax, written as probabilities P, and read again to multiply by V. On the tiled route, blocks of Q, K, and V are loaded into on-chip SRAM, where the kernel computes the block's scores, updates an online softmax, and accumulates the output; only the final output and small per-row statistics are written back to HBM.
      nodes:
        - id: qkv
          label: Q, K, V in HBM
          col: 0
          row: 1
          tone: data
        - id: s
          label: S = QKᵀ
          note: in HBM, n × n per head
          col: 2
          row: 0
          tone: warn
        - id: p
          label: P = softmax(S)
          note: in HBM, n × n per head
          col: 4
          row: 0
          tone: warn
        - id: sram
          label: Tiles in SRAM
          note: online softmax, sums
          col: 2
          row: 2
          tone: accent
        - id: out
          label: Output O in HBM
          note: plus row statistics
          col: 5
          row: 1
          tone: data
      edges:
        - from: qkv
          to: s
          label: standard route
          dashed: true
        - from: s
          to: p
          label: read, softmax, write
          dashed: true
        - from: p
          to: out
          label: read, multiply by V
          dashed: true
        - from: qkv
          to: sram
          label: load blocks
        - from: sram
          to: out
          label: write once
    bridges: []
  - id: efficient-attention-kernels.s2
    title: A softmax you can compute one tile at a time
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.efficient-attention-kernels
    markdown: |-
      The fix is an **online softmax**: carry three running values per query and correct them whenever a larger score shows up. Take one query with four keys in two tiles. Tile 1 has scores 1 and 2 (values 10 and 20); tile 2 has scores 3 and 0 (values 30 and 40).

      | Step | Running max $m$ | Running sum $\ell$ | Running output $o$ |
      | --- | ---: | ---: | ---: |
      | Tile 1 | 2 | $e^{-1} + e^{0}$ = 1.368 | 0.368 × 10 + 1 × 20 = 23.68 |
      | New max 3: multiply both by $e^{2-3}$ = 0.368 | 3 | 0.503 | 8.71 |
      | Add tile 2 | 3 | 0.503 + $e^{0}$ + $e^{-3}$ = 1.553 | 8.71 + 30 + 0.050 × 40 = 40.70 |

      The answer is $o / \ell$ = 40.70 ÷ 1.553 = 26.21, exactly what an ordinary softmax over all four scores gives. Subtracting the running max keeps every exponential at 1 or below, the same subtract-the-largest-score trick you saw in the lesson on stable training. When the max rises, everything accumulated so far was measured against the old max, and multiplying by $e^{m_\text{old} - m_\text{new}}$ puts it on the new footing.

      :::papers Online softmax update (Milakov & Gimelshein, 2018; used by FlashAttention)
      For each new tile with scores $s_j$ and values $v_j$:

      $$m' = \max\!\big(m, \max_j s_j\big), \quad \ell' = e^{m - m'}\,\ell + \sum_j e^{s_j - m'}, \quad o' = e^{m - m'}\,o + \sum_j e^{s_j - m'}\,v_j$$

      After the last tile, the output is $o / \ell$. In our example, $m$ went 2 → 3, $\ell$ went 1.368 → 1.553, and $o$ went 23.68 → 40.70.
      :::

      :::predict A third tile arrives with a single score of 5 and value 50. What multiplies the old ℓ and o?
      $e^{3-5} = e^{-2} \approx 0.135$. The new sum is 1.553 × 0.135 + 1 ≈ 1.210 and the new output 40.70 × 0.135 + 50 ≈ 55.51, so the answer becomes 55.51 ÷ 1.210 ≈ 45.9. The score of 5 dominates, as it should.
      :::
    bridges: []
  - id: efficient-attention-kernels.s3
    title: Tiling plus recomputation, with the same answer
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.efficient-attention-kernels
    markdown: |-
      **FlashAttention** (Dao et al., Stanford, 2022) combines the online softmax with two more ideas:

      - **Tiling.** Load a block of queries into SRAM, stream blocks of keys and values past it, and update $m$, $\ell$, and $o$ for every row. Write only the finished output and each row's softmax statistics to HBM.
      - **Recomputation.** The backward pass needs $P$. Instead of storing it, FlashAttention recomputes each block of scores from $Q$, $K$, and the saved statistics. That's more FLOPs but far fewer HBM bytes, and since attention was memory-bound, it runs faster. The paper reports GPT-2 training about 3× faster end to end than standard implementations, with 1,024-token sequences.

      Here is the online softmax on random data, checked against the standard version:

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      n, d, tile = 12, 4, 4                     # keys, head size, keys per tile
      q = rng.standard_normal(d)                # one query
      K = rng.standard_normal((n, d))
      V = rng.standard_normal((n, d))

      # Standard: build every score, softmax, then mix the values
      s = K @ q / np.sqrt(d)
      p = np.exp(s - s.max()); p /= p.sum()
      standard = p @ V

      # Online: one tile at a time, keeping only m (max), l (sum), and o (output)
      m, l, o = -np.inf, 0.0, np.zeros(d)
      for start in range(0, n, tile):
          s_t = K[start:start + tile] @ q / np.sqrt(d)
          m_new = max(m, s_t.max())
          fix = np.exp(m - m_new)               # rescale what we already have
          w = np.exp(s_t - m_new)
          l = l * fix + w.sum()
          o = o * fix + w @ V[start:start + tile]
          m = m_new
          print(f"after keys {start:2d}-{start + tile - 1:2d}: running max {m:.3f}, sum {l:.3f}")
      online = o / l

      print("standard:", np.round(standard, 6))
      print("online:  ", np.round(online, 6))
      print("max difference:", np.abs(standard - online).max())
      ```

      Change `tile` to 1, 3, or 12. The running values change, but the final output never does; the difference stays at rounding level.

      :::mixup "FlashAttention is a faster, approximate attention that makes the cost linear."
      It's exact: it computes every allowed query-key pair, so FLOPs still grow with the square of sequence length. What becomes linear is the *memory*: no n × n matrix is stored. It's faster because it moves fewer bytes, not because it does less arithmetic.
      :::
    bridges: []
  - id: efficient-attention-kernels.s4
    title: Fuse, then measure the whole step
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.efficient-attention-kernels
    markdown: |-
      FlashAttention is a case of **kernel fusion**: the score matmul, mask, softmax, dropout, and value matmul run in one GPU routine, so intermediate values never leave the chip. The same idea, applied to the elementwise chains from the compute lesson, is a standard first step when a profile shows memory-bound kernels.

      Later versions kept the algorithm and reworked the scheduling. FlashAttention-2 (Dao, 2023) divided the work across the GPU's threads better and ran about twice as fast as the original. FlashAttention-3 (Shah et al., 2024) targets H100 GPUs, overlapping the matmuls with the softmax using the chip's asynchronous hardware, and adds FP8 support.

      For the team, the gain shows up twice: activation memory for a 4,096-token sequence falls from about 104 GB to 18 GB, and the attention kernels run faster. But attention is only part of a step. Per layer, attention's two matmuls cost about $4s^2h$ FLOPs against $24sh^2$ for the projections and MLP, a ratio of $s/6h$. For the team that's 4,096 ÷ 24,576 = 1/6, so attention is about 14% of the arithmetic; the rest was already compute-bound. GPT-2, only 768 wide, spends a much larger share of its step on attention, which is why its whole run sped up so much. If attention takes 15% of the team's step and gets 3× faster, the step gets only 10% shorter, so measure the end-to-end step time and MFU, not the kernel alone.
    bridges: []
  - id: efficient-attention-kernels.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.efficient-attention-kernels
    markdown: Online-softmax updates to compute by hand, score-matrix sizes, a DNA model with 32,000-token inputs, and a fused kernel that barely moved the step time test whether you can say what tiling saves and what it doesn't.
    takeaway: |-
      FlashAttention computes exact attention tile by tile in on-chip memory, using an online softmax that rescales its running sum when a larger score appears. It never stores the n × n matrix, so memory grows linearly with length, though FLOPs still grow quadratically.
  - id: efficient-attention-kernels.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.efficient-attention-kernels
    markdown: |-
      Tiling can compute dense attention without storing the full score matrix. It reduces memory traffic while still considering the permitted query–key pairs.
