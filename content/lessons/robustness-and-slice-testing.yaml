schema_version: 0.2-draft
lesson:
  id: robustness-and-slice-testing
  version: 0.1.0-draft
  title: Find failures hidden by an overall score
  state: draft
  summary: Robustness evaluation tests meaningful perturbations, subgroups, and distribution changes under a defined
    threat or use model; preserve labels only when the transformation justifies it.
  slot: M28.4
  category: learning
  sources:
  - title: HELM
    url: https://arxiv.org/abs/2211.09110
  - title: Explaining and Harnessing Adversarial Examples
    url: https://arxiv.org/abs/1412.6572
objectives:
- id: objective.robustness-and-slice-testing
  version: 1-draft
  statement: Robustness evaluation tests meaningful perturbations, subgroups, and distribution changes under a defined
    threat or use model; preserve labels only when the transformation justifies it.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - robustness-and-slice-testing.base
  - robustness-and-slice-testing.transfer
  prerequisites:
  - anyOf:
    - objective.robustness-and-shift
  - anyOf:
    - objective.benchmark-design-and-comparison
scenes:
- id: robustness-and-slice-testing.s1
  title: Define the change being tested
  type: explanation
  depth: intuition
  objective_refs:
  - objective.robustness-and-slice-testing
  markdown: Noise, paraphrases, camera changes, missing fields, and adversarial perturbations test different properties.
    State what can change and what should remain invariant. A transformation that changes the correct label is not
    a valid label-preserving robustness test.
  text_mode: Noise, paraphrases, camera changes, missing fields, and adversarial perturbations test different properties.
    State what can change and what should remain invariant. A transformation that changes the correct label is not
    a valid label-preserving robustness test.
  bridges: []
- id: robustness-and-slice-testing.s2
  title: Construct a minimal example
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.robustness-and-slice-testing
  markdown: Changing “the door is open” to “the door is not open” preserves most words but reverses the meaning.
    A sentiment or fact classifier should not be required to keep its original answer. By contrast, a harmless spelling
    variant may preserve the intended task label.
  text_mode: Changing “the door is open” to “the door is not open” preserves most words but reverses the meaning.
    A sentiment or fact classifier should not be required to keep its original answer. By contrast, a harmless spelling
    variant may preserve the intended task label.
  bridges: []
- id: robustness-and-slice-testing.s3
  title: Inspect slices with enough evidence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.robustness-and-slice-testing
  markdown: Break down performance by relevant language, domain, input quality, and stakeholder groups. Small slices
    have wide uncertainty and can reveal issues worth targeted collection. Avoid interpreting every noisy difference
    as a stable property or hiding all variation in one mean.
  text_mode: Break down performance by relevant language, domain, input quality, and stakeholder groups. Small slices
    have wide uncertainty and can reveal issues worth targeted collection. Avoid interpreting every noisy difference
    as a stable property or hiding all variation in one mean.
  bridges: []
- id: robustness-and-slice-testing.s4
  title: Test adaptive failure discovery
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.robustness-and-slice-testing
  markdown: Adversarial evaluation deliberately searches for weaknesses under specified access and effort. Report
    attack success conditions, budgets, and held-out confirmation. Failure to find an example under one search is
    evidence about that search, not proof of robustness against every possible input.
  text_mode: Adversarial evaluation deliberately searches for weaknesses under specified access and effort. Report
    attack success conditions, budgets, and held-out confirmation. Failure to find an example under one search is
    evidence about that search, not proof of robustness against every possible input.
  bridges: []
- id: robustness-and-slice-testing.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.robustness-and-slice-testing
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Robustness evaluation tests meaningful perturbations, subgroups, and distribution changes under a defined
    threat or use model; preserve labels only when the transformation justifies it.
- id: robustness-and-slice-testing.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.robustness-and-slice-testing
  markdown: Robustness evaluation tests meaningful perturbations, subgroups, and distribution changes under a defined
    threat or use model; preserve labels only when the transformation justifies it.
  text_mode: Robustness evaluation tests meaningful perturbations, subgroups, and distribution changes under a defined
    threat or use model; preserve labels only when the transformation justifies it.
