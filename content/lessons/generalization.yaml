schema_version: 0.2-draft
lesson:
  id: generalization
  version: 0.4.0-draft
  title: Will the model work on new examples?
  state: draft
  summary: A leaf-disease app gets all 2,000 of its training photos right, then misses one fresh leaf in five. Which number should you believe, and why do the two disagree?
  slot: M09.1
  category: learning
  sources:
    - title: An Introduction to Statistical Learning — authors’ materials
      url: https://www.statlearning.com/
    - title: Dive into Deep Learning — authors’ open textbook
      url: https://d2l.ai/
    - title: "Do ImageNet Classifiers Generalize to ImageNet? (Recht et al., 2019)"
      url: https://arxiv.org/abs/1902.10811
objectives:
  - id: objective.generalization
    version: 2-draft
    statement: Empirical error measures observed examples, while expected error refers to a target distribution; generalization claims depend on sampling, selection, and task assumptions.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - generalization.base.v2
      - generalization.transfer.v2
      - generalization.calculate
    prerequisites:
      - anyOf:
          - objective.regularization-and-tuning
      - anyOf:
          - objective.statistics-evidence
scenes:
  - id: generalization.s1
    title: Perfect on practice, 78% on new leaves
    type: explanation
    depth: intuition
    objective_refs:
      - objective.generalization
    markdown: |-
      Your team builds a phone app that spots blight on tomato leaves. Trained on 2,000 labeled leaf photos, it labels every one of them correctly. Then the same farmers photograph 500 fresh leaves, and the spotter gets 390 right: 78%.

      Tell the farmers 78%, because they'll point their phones at leaves the model has never seen. A model that does well on new examples from the same source as its training data is said to **generalize**.

      | | Photos | Mistakes | Error rate |
      | --- | ---: | ---: | ---: |
      | Training photos (used to fit the model) | 2,000 | 0 | 0% |
      | Fresh photos (never used in training) | 500 | 110 | 22% |

      The difference, 22% − 0% = 22 percentage points, is the **generalization gap**: how much worse the model does on new data than on the data it learned from. A small gap means the training score is a fair preview. A large one means it flatters the model.
    bridges: []
  - id: generalization.s2
    title: The error you can measure and the error you care about
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.generalization
    markdown: |-
      To talk about this precisely, give each prediction a **loss**: a number for how wrong it was. For "blight or healthy," the simplest loss is 1 for a wrong label and 0 for a right one.

      **Empirical risk** is the average loss on the examples you actually have. If the spotter labels eight fresh leaves and gets the 3rd and 7th wrong, its losses are 0, 0, 1, 0, 0, 0, 1, 0, and its empirical risk is 2/8 = 0.25.

      **Expected risk** is the average loss over *every* leaf the spotter could ever meet, weighted by how often each kind turns up. It's the number you care about, and you can never compute it exactly. You estimate it with the empirical risk on a **test set**: examples put aside at the start and never used for training or for choosing between models.

      :::papers Empirical risk and expected risk
      $$\hat R_S(f) = \frac{1}{n}\sum_{i=1}^{n} \ell\big(f(x_i),\, y_i\big) \qquad\qquad R(f) = \mathbb{E}_{(x,y)\sim \mathcal{D}}\big[\ell(f(x),\, y)\big]$$

      $f$ is the model, $S$ is a sample of $n$ examples $(x_i, y_i)$ (a photo and its true label), $\ell$ is the loss, and $\mathcal D$ is the data distribution: all leaves, with how common each kind is. For the eight leaves, $n = 8$ and $\hat R_S(f) = 0.25$. Training looks for an $f$ with small $\hat R$ on the training sample. With 10 million test leaves, $\hat R$ would sit very close to $R$. The generalization gap is $R(f) - \hat R_{\text{train}}(f)$, with $R(f)$ estimated by test error.
      :::
    diagram:
      caption: Both samples come from the same population, but only one of them is used to fit the model.
      description: All the leaves the spotter will meet (the data distribution) are sampled twice, into a training sample and a separate test sample. The training sample goes into fitting, which produces the model f. The model's predictions and the test sample's true labels both feed the test error, which estimates the expected risk R(f).
      nodes:
        - id: pop
          label: All leaves the spotter will meet
          note: the distribution D, never fully seen
          col: 0
          row: 1
          tone: data
        - id: train
          label: Training sample
          note: 2,000 photos
          col: 1
          row: 0
          tone: data
        - id: test
          label: Test sample
          note: 500 photos, set aside
          col: 1
          row: 2
          tone: data
        - id: fit
          label: Fit the model
          note: make training error small
          col: 2
          row: 0
          tone: accent
        - id: model
          label: Model f
          col: 3
          row: 1
        - id: score
          label: Test error
          note: estimates expected risk R(f)
          col: 4
          row: 2
          tone: accent
      edges:
        - from: pop
          to: train
          label: sample
        - from: pop
          to: test
          label: sample
        - from: train
          to: fit
        - from: fit
          to: model
        - from: model
          to: score
          label: predict
        - from: test
          to: score
          label: true labels
  - id: generalization.s3
    title: A lookup table can score 100%
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.generalization
    markdown: |-
      The easiest way to get zero training error is to memorize. Picture a "model" that stores every training photo and, shown a leaf, copies the label of the most similar stored photo. On its training photos it's always right: each photo's closest match is itself.

      But some training labels are wrong (a blurry photo, a tired labeler), and the memorizer copies those mistakes too. A simple rule, "blight if more than 40% of the leaf is spotted," can't bend to fit each mistake. The program compares the two on 200 training and 1,000 test leaves, with 15% of labels wrong.

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)

      def make_leaves(n):
          """Spot coverage (0 to 1) and label: 1 = blight. 15% of labels are wrong."""
          spots = rng.uniform(0, 1, n)
          label = (spots > 0.4).astype(int)
          flip = rng.uniform(0, 1, n) < 0.15
          return spots, np.where(flip, 1 - label, label)

      train_x, train_y = make_leaves(200)
      test_x, test_y = make_leaves(1000)

      def memorizer(x):
          """Copy the label of the most similar training leaf."""
          nearest = np.abs(train_x[None, :] - x[:, None]).argmin(axis=1)
          return train_y[nearest]

      def rule(x):
          return (x > 0.4).astype(int)

      for name, model in [("memorizer", memorizer), ("simple rule", rule)]:
          train_err = np.mean(model(train_x) != train_y)
          test_err = np.mean(model(test_x) != test_y)
          print(f"{name:12s} train error {train_err:.3f}  test error {test_err:.3f}"
                f"  gap {test_err - train_err:+.3f}")
      ```

      The memorizer is perfect on training leaves but misses 27.6% of test leaves. The rule's 14% training errors are exactly the mislabeled leaves, and it misses 16.5% of test leaves, a gap of 2.5 points. You can predict the memorizer's error: it's wrong when exactly one of two labels (the test leaf's or its stored neighbor's) was flipped, with probability 2 × 0.15 × 0.85 = 0.255, close to the measured 27.6%.

      :::try Change one number at a time
      In `make_leaves`, change `< 0.15` to `< 0.0`. With no wrong labels, both models become perfect: memorizing hurt only because it memorized noise. Then restore `0.15` and change `make_leaves(200)` to `make_leaves(2000)`. The memorizer still misses about a quarter of test leaves.
      :::

      :::mixup "Zero training error means the model has learned the task."
      It means the model can reproduce its training labels, wrong ones included. Error on unseen examples shows whether it learned the pattern. Large neural networks can even fit completely random labels perfectly, as the learning theory lesson shows.
      :::
  - id: generalization.s4
    title: Choose by test error, then check the count
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.generalization
    markdown: |-
      Two candidate apps are scored on the same 100 held-out photos:

      | App | Training error | Test error | Generalization gap |
      | --- | ---: | ---: | ---: |
      | A | 0% | 20% | 20 points |
      | B | 5% | 8% | 3 points |

      :::predict Which app should the farmers get?
      B. On the same 100 new photos, B made 8 mistakes and A made 20. B fits its training photos less closely but does far better on unseen leaves, which is the job. A perfect training score with a big gap is the memorizer's signature.
      :::

      Two checks before you trust a test error:

      - **Count the mistakes.** 20% and 8% of 100 photos are 20 and 8 mistakes. With only 5 test photos, each mistake moves the rate by 20 points, and "8%" is impossible. The controlled experiments lesson puts error bars on numbers like these.
      - **Make sure the test photos are new.** If 30 "fresh" photos are near-copies of training photos (the same leaf shot twice), the memorizer gets them free and its test error looks too good. Test information slipping into training like this is called **leakage**.
    bridges: []
  - id: generalization.s5
    title: A test set speaks for the leaves it came from
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.generalization
    markdown: |-
      A test error estimates expected risk for the distribution the test set was drawn from. The 500 fresh photos came from the same farms, phones, and July sunshine as the training photos, so state the result with its scope: "78% correct on fresh leaves from our partner farms in July." A new tomato variety or grey October light is a different distribution, and the robustness lesson tests changes like those on purpose.

      :::story ImageNet, photographed again
      ImageNet is a benchmark of over a million labeled photos that vision researchers competed on for years. In 2019, Benjamin Recht and colleagues built a new test set, ImageNet-v2, following the original collection process as closely as they could. The models they tested lost roughly 11 to 14 percentage points of accuracy on it, though their rankings mostly held. The authors found that years of reusing the old test set didn't explain the drop. Instead, small differences in how the new photos were gathered had made them slightly harder.
      :::

      So when you build a test set, draw it the way real inputs will arrive, and write down where it came from.
    bridges: []
  - id: generalization.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.generalization
    markdown: A house-price model, a spam filter, a speech app, and a student cramming last year's exam ask you to read a generalization gap, compute an empirical risk, and spot a memorizer.
    takeaway: |-
      Training error shows how well a model fits what it has already seen; error on untouched test examples estimates how it will do on new ones. The difference is the generalization gap, and a big one is a warning sign.
  - id: generalization.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.generalization
    markdown: |-
      Fitting the examples you trained on is only the first step. Use appropriately chosen new examples to check whether the learned rule carries over to the intended task.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - generalization.s1
        - generalization.s2
        - generalization.s3
        - generalization.s4
        - generalization.s5
        - generalization.check
      gate_refs:
        - gate.core
  scene_aliases:
