schema_version: 0.2-draft
lesson:
  id: generalization
  version: 0.1.0-draft
  title: Distinguish fitting the sample from learning a useful rule
  state: draft
  summary: Empirical error measures observed examples, while expected error refers to a target distribution; generalization
    claims depend on sampling, selection, and task assumptions.
  slot: M09.1
  category: learning
  minutes: 12
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.generalization
  version: 1-draft
  statement: Empirical error measures observed examples, while expected error refers to a target distribution; generalization
    claims depend on sampling, selection, and task assumptions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - generalization.base
  - generalization.transfer
  prerequisites:
  - anyOf:
    - objective.regularization-and-tuning
  - anyOf:
    - objective.statistics-evidence
scenes:
- id: generalization.s1
  title: Name the two quantities
  type: explanation
  depth: intuition
  objective_refs:
  - objective.generalization
  markdown: Empirical error is the average loss on a particular sample. Expected error is the average loss under
    a specified population distribution. Training minimizes a version of empirical error, often with regularization.
    The population quantity is usually unknown and must be estimated using appropriate held-out evidence.
  text_mode: Empirical error is the average loss on a particular sample. Expected error is the average loss under
    a specified population distribution. Training minimizes a version of empirical error, often with regularization.
    The population quantity is usually unknown and must be estimated using appropriate held-out evidence.
  bridges: []
- id: generalization.s2
  title: A memorizer can fit perfectly
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.generalization
  markdown: A lookup table can return the correct label for every training example and still have no useful answer
    for an unfamiliar one. Zero training error therefore does not establish a good general rule. The relevant question
    is how the learned procedure behaves on the intended future inputs.
  text_mode: A lookup table can return the correct label for every training example and still have no useful answer
    for an unfamiliar one. Zero training error therefore does not establish a good general rule. The relevant question
    is how the learned procedure behaves on the intended future inputs.
  bridges: []
- id: generalization.s3
  title: Inspect a small comparison
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.generalization
  markdown: Model A has training error 0% and held-out error 20%; model B has training error 5% and held-out error
    8%. Under the same credible held-out protocol, B has better observed transfer despite worse training fit. The
    sample size and uncertainty still matter before treating the difference as stable.
  text_mode: Model A has training error 0% and held-out error 20%; model B has training error 5% and held-out error
    8%. Under the same credible held-out protocol, B has better observed transfer despite worse training fit. The
    sample size and uncertainty still matter before treating the difference as stable.
  bridges: []
- id: generalization.s4
  title: Keep the distribution in the claim
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.generalization
  markdown: A generalization estimate from randomly sampled examples does not automatically cover a new hospital,
    language, season, or adversarial input. State the population and evaluation procedure. Model selection can bias
    a reported estimate, so protect the final test and distinguish development feedback from confirmation.
  text_mode: A generalization estimate from randomly sampled examples does not automatically cover a new hospital,
    language, season, or adversarial input. State the population and evaluation procedure. Model selection can bias
    a reported estimate, so protect the final test and distinguish development feedback from confirmation.
  bridges: []
- id: generalization.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.generalization
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Empirical error measures observed examples, while expected error refers to a target distribution; generalization
    claims depend on sampling, selection, and task assumptions.
- id: generalization.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.generalization
  markdown: Empirical error measures observed examples, while expected error refers to a target distribution; generalization
    claims depend on sampling, selection, and task assumptions.
  text_mode: Empirical error measures observed examples, while expected error refers to a target distribution; generalization
    claims depend on sampling, selection, and task assumptions.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - generalization.s1
    - generalization.s2
    - generalization.s3
    - generalization.s4
    - generalization.check
    gate_refs:
    - gate.core
  scene_aliases:
    generalization.recap: generalization.check
assessment_families:
- id: generalization.base
  objective_ref: objective.generalization
  task: base
  response_type: single_choice
  points: 1
  hint: 'A memorizer can fit perfectly: trace the inputs, operation, and result before choosing.'
  remediation_scene: generalization.s2
  variants:
  - id: generalization.base.1
    prompt: What does empirical error average over?
    options:
    - id: b
      text: Every possible future world exactly
    - id: c
      text: Only model parameters
    - id: a
      text: A particular observed sample
    answer: a
    feedback: Empirical quantities are calculated from observed data.
  - id: generalization.base.2
    prompt: Does zero training error prove low expected error?
    options:
    - id: c
      text: Only when the model is large
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: A model can memorize a sample without transferring usefully.
- id: generalization.transfer
  objective_ref: objective.generalization
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Keep the distribution in the claim: trace the inputs, operation, and result before choosing.'
  remediation_scene: generalization.s4
  variants:
  - id: generalization.transfer.1
    prompt: Model A has lower training loss but higher credible held-out loss than B. Which has better observed
      generalization on that holdout?
    options:
    - id: c
      text: Neither metric can ever be used
    - id: a
      text: B
    - id: b
      text: A automatically
    answer: a
    feedback: Held-out loss estimates transfer under its sampling conditions.
  - id: generalization.transfer.2
    prompt: A test sample comes from one region. What limits a worldwide claim?
    options:
    - id: a
      text: Representativeness and distribution assumptions
    - id: b
      text: Only the test file name
    - id: c
      text: The use of averages itself
    answer: a
    feedback: The target distribution must match the scope of the evidence.
