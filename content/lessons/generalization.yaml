assessment_families:
  - id: generalization.base
    objective_ref: objective.generalization
    task: base
    response_type: single_choice
    points: 1
    hint: 'A memorizer can fit perfectly: trace the inputs, operation, and result before choosing.'
    remediation_scene: generalization.s2
    variants:
      - id: generalization.base.1
        prompt: What does empirical error average over?
        options:
          - id: b
            text: Every possible future world exactly
          - id: c
            text: Only model parameters
          - id: a
            text: A particular observed sample
        answer: a
        feedback: Empirical quantities are calculated from observed data.
        retired: true
      - id: generalization.base.2
        prompt: Does zero training error prove low expected error?
        options:
          - id: c
            text: Only when the model is large
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: A model can memorize a sample without transferring usefully.
        retired: true
  - id: generalization.transfer
    objective_ref: objective.generalization
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Keep the distribution in the claim: trace the inputs, operation, and result before choosing.'
    remediation_scene: generalization.s4
    variants:
      - id: generalization.transfer.1
        prompt: Model A has lower training loss but higher credible held-out loss than B. Which has better observed generalization on that holdout?
        options:
          - id: c
            text: Neither metric can ever be used
          - id: a
            text: B
          - id: b
            text: A automatically
        answer: a
        feedback: Held-out loss estimates transfer under its sampling conditions.
        retired: true
      - id: generalization.transfer.2
        prompt: A test sample comes from one region. What limits a worldwide claim?
        options:
          - id: a
            text: Representativeness and distribution assumptions
          - id: b
            text: Only the test file name
          - id: c
            text: The use of averages itself
        answer: a
        feedback: The target distribution must match the scope of the evidence.
        retired: true
  - id: generalization.base.v2
    objective_ref: objective.generalization
    task: base
    response_type: single_choice
    points: 1
    hint: Ask which examples each number was computed on. Only examples the model never trained on or was chosen with estimate its error on new inputs.
    remediation_scene: generalization.s2
    variants:
      - id: generalization.base.v2.1
        prompt: A text classifier is scored on the 5,000 emails it was trained on and gets 99% of them right. What does that 99% tell you?
        options:
          - id: b
            text: Its expected accuracy on the emails it will receive next month
          - id: c
            text: Its generalization gap, since 99% is compared with 100%
          - id: a
            text: How closely it fits its training sample, which can flatter it
        answer: a
        feedback: A score on the training emails is an empirical risk on the training sample, and a model can fit that sample far better than it handles new mail. The generalization gap needs a second number, the error on untouched emails.
      - id: generalization.base.v2.2
        prompt: Which quantity would you need every possible input, weighted by how often it occurs, to compute exactly?
        options:
          - id: a
            text: The error on a large, untouched test set
          - id: c
            text: The expected risk over the data distribution
          - id: b
            text: The average loss on the training sample
        answer: c
        feedback: Expected risk averages the loss over the whole distribution, which you never have in full. Test-set error is the tempting choice, but it is an empirical risk on a sample, used as an estimate of expected risk.
      - id: generalization.base.v2.3
        prompt: A model stores every training example and labels a new input by copying the label of the most similar stored example. One in five of its training labels is wrong. What should you expect?
        options:
          - id: b
            text: About 20% training error, matching the share of wrong labels
          - id: a
            text: Zero training error, with wrong labels copied onto new inputs
          - id: c
            text: Test error falling to zero once enough examples are stored
        answer: a
        feedback: Each stored example's nearest match is itself, so training error is zero, and the wrong labels get copied onto similar new inputs. A simple rule, not a memorizer, would show training error near the 20% noise level, and more stored examples don't remove the noise.
      - id: generalization.base.v2.4
        prompt: Model A has 1% training error and 15% test error; model B has 6% training error and 9% test error, on the same untouched test set of 2,000 cases. Which reading is right?
        options:
          - id: c
            text: A learned more, since its training error is the lower one
          - id: a
            text: They are about equal, since their average errors are close
          - id: b
            text: B is the better choice, because test error predicts new cases
        answer: b
        feedback: Test error on untouched cases is the estimate of performance on new inputs, and B's is 6 points lower. A's low training error with a 14-point gap suggests it fit its training sample too closely; averaging training and test error mixes in a number that doesn't predict new cases.
      - id: generalization.base.v2.5
        prompt: A team trains on 10,000 product photos and reports 97% accuracy on those same photos as the expected accuracy for customers. What is the most important correction?
        options:
          - id: a
            text: Report accuracy on photos set aside before training began
          - id: b
            text: Round the reported figure to 95% to allow for chance
          - id: c
            text: Train for longer so the figure moves closer to 100%
        answer: a
        feedback: Training accuracy measures fit, not performance on new photos, so the estimate has to come from photos the model never saw. Rounding down is a guess, and training longer usually widens the gap rather than closing it.
  - id: generalization.transfer.v2
    objective_ref: objective.generalization
    task: transfer
    response_type: single_choice
    points: 1
    hint: Picture where the model will actually be used. The trustworthy number comes from untouched examples drawn the way those real inputs arrive.
    remediation_scene: generalization.s5
    variants:
      - id: generalization.transfer.v2.1
        prompt: A house-price model is off by $8,000 on average for the houses it trained on and by $31,000 for houses sold last month in the same city. What does this pattern show?
        options:
          - id: b
            text: It underfits, since an error of $31,000 is large
          - id: a
            text: A large generalization gap between fit and new houses
          - id: c
            text: Last month's sale prices must have been recorded wrongly
        answer: a
        feedback: The model fits its training houses far better than new ones, which is a large generalization gap. Underfitting would show high error on the training houses too, and blaming the new labels ignores the simplest explanation.
      - id: generalization.transfer.v2.2
        prompt: A student memorizes the answers to last year's exam, scores 100% on it at home, then scores 55% on this year's exam. In machine-learning terms, what was the 100%?
        options:
          - id: c
            text: Test error on questions held out from study
          - id: b
            text: Expected risk over every exam the course could set
          - id: a
            text: Training error on examples already seen
        answer: a
        feedback: The student practiced on those exact questions, so the home score measures fit to the training examples. This year's exam plays the role of the test set; expected risk would need every possible exam.
      - id: generalization.transfer.v2.3
        prompt: A speech app is tested on 300 clips. Later you learn that 40 of them are re-recordings of training sentences by the same speakers. What does this do to the reported test error?
        options:
          - id: a
            text: It likely makes the test error look lower than it really is
          - id: c
            text: It likely makes the test error look higher than it really is
          - id: b
            text: It has no effect, since the recordings are technically new files
        answer: a
        feedback: Near-copies of training data leak information into the test, so a model that memorized those sentences gets them right for free. That flatters the test error; being new files doesn't make them new examples.
      - id: generalization.transfer.v2.4
        prompt: A spam filter was trained and tested on emails from 2023 and scored 95% on the untouched test emails. Which claim does that evidence support best?
        options:
          - id: b
            text: 95% accuracy on email in general, as the test was untouched
          - id: a
            text: 95% accuracy on email like the 2023 mail it was tested on
          - id: c
            text: 95% minus the training accuracy, the size of the gap
        answer: a
        feedback: A test error estimates expected risk for the distribution the test set came from, here 2023 email. Being untouched keeps the estimate honest for that distribution; it doesn't extend it to next year's spam tricks.
  - id: generalization.calculate
    objective_ref: objective.generalization
    task: base
    response_type: numeric
    points: 1
    hint: Empirical risk is an average, so add the losses and divide by the number of examples. The generalization gap is test error minus training error.
    remediation_scene: generalization.s2
    absolute_tolerance: 0.01
    variants:
      - id: generalization.calculate.1
        prompt: With 0–1 loss, a model makes 12 mistakes on its 400 training images and 30 mistakes on 200 test images. What is its generalization gap in percentage points (test error minus training error)?
        answer: 12
        feedback: Training error is 12/400 = 3%, test error is 30/200 = 15%, so the gap is 15 − 3 = 12 points.
      - id: generalization.calculate.2
        prompt: On six test sentences a model's losses are 0, 1, 0, 0, 1, 1. What is its empirical risk on these sentences? Give a decimal.
        answer: 0.5
        feedback: The losses add to 3, and 3/6 = 0.5.
      - id: generalization.calculate.3
        prompt: A model has 2% training error and a generalization gap of 9 percentage points. How many mistakes would you expect it to have made on a test set of 500 examples?
        answer: 55
        feedback: Test error is 2% + 9 points = 11%, and 11% of 500 is 55.
      - id: generalization.calculate.4
        prompt: A classifier gets 950 of 1,000 training emails right and 410 of 500 test emails right. What is its generalization gap in percentage points?
        answer: 13
        feedback: Training error is 50/1,000 = 5%, test error is 90/500 = 18%, so the gap is 18 − 5 = 13 points.
      - id: generalization.calculate.5
        prompt: A memorizer copies the label of its nearest training example, and 10% of all labels are wrong, independently. Using the lesson's reasoning, what test error rate do you expect? Give a decimal.
        answer: 0.18
        feedback: It's wrong when exactly one of the two labels is flipped, 2 × 0.1 × 0.9 = 0.18.
