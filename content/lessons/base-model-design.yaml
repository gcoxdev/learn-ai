schema_version: 0.2-draft
lesson:
  id: base-model-design
  version: 0.1.0-draft
  title: Choose the model that pretraining will fit
  state: draft
  summary: A base-model recipe specifies architecture, tokenizer, initialization, context, objective, and resource
    budget before weights are learned; later behavior depends on their interaction.
  slot: M16.1
  category: learning
  minutes: 12
  sources:
  - title: The Llama 3 Herd of Models
    url: https://arxiv.org/abs/2407.21783
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.base-model-design
  version: 1-draft
  statement: A base-model recipe specifies architecture, tokenizer, initialization, context, objective, and resource
    budget before weights are learned; later behavior depends on their interaction.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - base-model-design.base
  - base-model-design.transfer
  prerequisites:
  - anyOf:
    - objective.transformer-families
  - anyOf:
    - objective.tokenizer-training
  - anyOf:
    - objective.neural-training-loop
scenes:
- id: base-model-design.s1
  title: A base model is a training-stage description
  type: explanation
  depth: intuition
  objective_refs:
  - objective.base-model-design
  markdown: A base language model is commonly produced by broad pretraining before instruction or preference adaptation.
    It learns the chosen prediction task, which may support many later uses. The label base does not specify one
    architecture size, dataset, license, or guaranteed set of behaviors.
  text_mode: A base language model is commonly produced by broad pretraining before instruction or preference adaptation.
    It learns the chosen prediction task, which may support many later uses. The label base does not specify one
    architecture size, dataset, license, or guaranteed set of behaviors.
  bridges: []
- id: base-model-design.s2
  title: Specify the executable dimensions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.base-model-design
  markdown: Record vocabulary size, model width, layers, attention heads, key/value heads, feed-forward width, normalization,
    position method, and context settings. These choices determine parameter and activation shapes. A tokenizer’s
    ID mapping must match the embedding and output interfaces. A shape-valid configuration can still be a poor use
    of a fixed budget.
  text_mode: Record vocabulary size, model width, layers, attention heads, key/value heads, feed-forward width,
    normalization, position method, and context settings. These choices determine parameter and activation shapes.
    A tokenizer’s ID mapping must match the embedding and output interfaces. A shape-valid configuration can still
    be a poor use of a fixed budget.
  bridges: []
- id: base-model-design.s3
  title: Initialize and test the smallest path
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.base-model-design
  markdown: Before a long run, verify a tiny forward/backward/update cycle with the intended mask and loss. Check
    numerical ranges and reproducible configuration. Random initialization starts a model from parameters chosen
    by a rule; loading a checkpoint instead imports an already learned state and changes the experiment.
  text_mode: Before a long run, verify a tiny forward/backward/update cycle with the intended mask and loss. Check
    numerical ranges and reproducible configuration. Random initialization starts a model from parameters chosen
    by a rule; loading a checkpoint instead imports an already learned state and changes the experiment.
  bridges: []
- id: base-model-design.s4
  title: Tie design to evidence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.base-model-design
  markdown: Choose a task and budget, then compare controlled small runs or documented scaling evidence. A larger
    vocabulary shortens some sequences but expands token interfaces; longer context changes attention cost. Preserve
    configuration and tokenizer with checkpoints so later evaluation identifies exactly which model was trained.
  text_mode: Choose a task and budget, then compare controlled small runs or documented scaling evidence. A larger
    vocabulary shortens some sequences but expands token interfaces; longer context changes attention cost. Preserve
    configuration and tokenizer with checkpoints so later evaluation identifies exactly which model was trained.
  bridges: []
- id: base-model-design.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.base-model-design
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: base-model-design.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.base-model-design
  markdown: A base-model recipe specifies architecture, tokenizer, initialization, context, objective, and resource
    budget before weights are learned; later behavior depends on their interaction.
  text_mode: A base-model recipe specifies architecture, tokenizer, initialization, context, objective, and resource
    budget before weights are learned; later behavior depends on their interaction.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - base-model-design.s1
    - base-model-design.s2
    - base-model-design.s3
    - base-model-design.s4
    - base-model-design.check
    - base-model-design.recap
    gate_refs:
    - gate.core
assessment_families:
- id: base-model-design.base
  objective_ref: objective.base-model-design
  task: base
  response_type: single_choice
  points: 1
  hint: 'Specify the executable dimensions: trace the inputs, operation, and result before choosing.'
  remediation_scene: base-model-design.s2
  variants:
  - id: base-model-design.base.1
    prompt: What does the label base model usually describe?
    options:
    - id: a
      text: A model before some later adaptation stages
    - id: b
      text: One universal parameter count
    - id: c
      text: A guarantee that no training data were used
    answer: a
    feedback: Base describes a stage in a recipe, not a complete specification.
  - id: base-model-design.base.2
    prompt: Which artifacts must agree on token IDs?
    options:
    - id: b
      text: Only the README title
    - id: c
      text: Only the optimizer’s learning rate
    - id: a
      text: Tokenizer, embeddings, and vocabulary output interface
    answer: a
    feedback: The same integer must refer to the intended vocabulary entry throughout the model.
- id: base-model-design.transfer
  objective_ref: objective.base-model-design
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Tie design to evidence: trace the inputs, operation, and result before choosing.'
  remediation_scene: base-model-design.s4
  variants:
  - id: base-model-design.transfer.1
    prompt: A run loads pretrained weights instead of random initialization. What changed?
    options:
    - id: b
      text: Only the file path spelling
    - id: c
      text: Nothing if the tensor shapes match
    - id: a
      text: The starting learned state and training experiment
    answer: a
    feedback: Matching shapes do not imply identical initialization or prior learning.
  - id: base-model-design.transfer.2
    prompt: A configuration passes shape checks. Does that establish good model quality?
    options:
    - id: c
      text: Only if the width is large
    - id: a
      text: No; training and evaluation evidence are still needed
    - id: b
      text: Yes; tensor compatibility proves capability
    answer: a
    feedback: Executable dimensions are necessary but not sufficient for useful learning.
