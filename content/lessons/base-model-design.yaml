schema_version: 0.2-draft
lesson:
  id: base-model-design
  version: 0.3.0-draft
  title: Choose the model that pretraining will fit
  state: draft
  summary: Fill in a model recipe card before paying for a long training run.
  slot: M16.1
  category: learning
  sources:
  - title: Vaswani et al. — Attention Is All You Need
    url: https://arxiv.org/abs/1706.03762
  - title: 'Groeneveld et al. — OLMo: Accelerating the Science of Language Models'
    url: https://arxiv.org/abs/2402.00838
  archetype: mechanism
objectives:
- id: objective.base-model-design
  version: 2-draft
  statement: Explain how architecture, tokenizer, initialization, objective, and budget jointly define a base-model
    training experiment.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - base-model-design.base.v2
  - base-model-design.transfer.v2
  prerequisites:
  - anyOf:
    - objective.transformer-families
  - anyOf:
    - objective.tokenizer-training
  - anyOf:
    - objective.neural-training-loop
scenes:
- id: base-model-design.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.base-model-design
  title: A recipe before a trained model
  markdown: 'A **base model** is a model after broad pretraining, before any particular later adaptation we
    are discussing. The term does not specify its size, license, dataset, or quality. Before training begins,
    a team chooses a recipe: the computation to run, the input format, the prediction task, and a resource
    budget. These choices define the model’s structure and task. Training then adjusts its numerical parameters.'
  text_mode: 'A **base model** is a model after broad pretraining, before any particular later adaptation we
    are discussing. The term does not specify its size, license, dataset, or quality. Before training begins,
    a team chooses a recipe: the computation to run, the input format, the prediction task, and a resource
    budget. These choices define the model’s structure and task. Training then adjusts its numerical parameters.'
  bridges: []
- id: base-model-design.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.base-model-design
  title: Match the architecture to the information flow
  markdown: An **architecture** defines how the model’s computations connect. A causal decoder predicts successive
    tokens using earlier context. A bidirectional encoder lets representations use context on both sides when
    the task permits it. An encoder-decoder reads a source and generates a target using separate connected
    stacks. These are different information-flow designs, not a ranking from weak to strong. The task and its
    permitted context determine which comparison is useful.
  text_mode: An **architecture** defines how the model’s computations connect. A causal decoder predicts successive
    tokens using earlier context. A bidirectional encoder lets representations use context on both sides when
    the task permits it. An encoder-decoder reads a source and generates a target using separate connected
    stacks. These are different information-flow designs, not a ranking from weak to strong. The task and its
    permitted context determine which comparison is useful.
  bridges: []
- id: base-model-design.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.base-model-design
  title: Match the number labels to the interfaces
  markdown: Suppose the vocabulary has eight token IDs and each token is represented by four numbers. The embedding
    table has 8 × 4 = 32 entries. An output projection from width four to eight token scores also has 32 weights,
    excluding bias; some designs share these weights with embeddings. Changing vocabulary or width changes
    these interfaces. A tokenizer must preserve the intended mapping from pieces of text to IDs. Matching array
    sizes alone does not establish matching meaning.
  text_mode: Suppose the vocabulary has eight token IDs and each token is represented by four numbers. The
    embedding table has 8 × 4 = 32 entries. An output projection from width four to eight token scores also
    has 32 weights, excluding bias; some designs share these weights with embeddings. Changing vocabulary or
    width changes these interfaces. A tokenizer must preserve the intended mapping from pieces of text to IDs.
    Matching array sizes alone does not establish matching meaning.
  bridges: []
- id: base-model-design.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.base-model-design
  title: Spend the budget deliberately
  markdown: '**Width** is the size of a hidden representation; **depth** is the number of successive layers.
    More width, layers, context positions, or training tokens can require more memory and computation, in different
    ways. A dense feed-forward layer uses the same weight set for each token. A mixture-of-experts design routes
    tokens through selected expert networks, adding routing and capacity choices. These alternatives deserve
    separate experiments; parameter count alone is not a complete cost or quality comparison.'
  text_mode: '**Width** is the size of a hidden representation; **depth** is the number of successive layers.
    More width, layers, context positions, or training tokens can require more memory and computation, in different
    ways. A dense feed-forward layer uses the same weight set for each token. A mixture-of-experts design routes
    tokens through selected expert networks, adding routing and capacity choices. These alternatives deserve
    separate experiments; parameter count alone is not a complete cost or quality comparison.'
  bridges: []
- id: base-model-design.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.base-model-design
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A recipe chooses what can be learned and what the run costs. A checkpoint records the particular
    state that was learned.
- id: base-model-design.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.base-model-design
  markdown: A base-model recipe specifies architecture, tokenizer, initialization, context, objective, and
    resource budget before weights are learned; later behavior depends on their interaction.
  text_mode: A base-model recipe specifies architecture, tokenizer, initialization, context, objective, and
    resource budget before weights are learned; later behavior depends on their interaction.
- id: base-model-design.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.base-model-design
  title: Start the numbers and test one update
  markdown: '**Initialization** chooses starting parameter values by a specified rule. Loading existing weights
    instead begins from a saved learned state. Before a large run, use a tiny batch to check token IDs, allowed
    attention, prediction targets, forward values, gradients, and one update. Confirm that masks and loss match
    the intended task. A program that runs without crashing can still be learning from the wrong target positions.'
  text_mode: '**Initialization** chooses starting parameter values by a specified rule. Loading existing weights
    instead begins from a saved learned state. Before a large run, use a tiny batch to check token IDs, allowed
    attention, prediction targets, forward values, gradients, and one update. Confirm that masks and loss match
    the intended task. A program that runs without crashing can still be learning from the wrong target positions.'
  bridges: []
- id: base-model-design.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.base-model-design
  title: Save the recipe beside the checkpoint
  markdown: Record architecture dimensions, tokenizer version, position method, context settings, prediction
    objective, initialization, and training budget. A **checkpoint** stores a particular training state; resuming
    a run can also require optimizer and data-order state. Compare small controlled runs or relevant scaling
    evidence before expanding the budget. Keeping these choices together makes later comparisons easier to
    explain. Later instruction tuning changes learned behavior, but it does not make this original recipe irrelevant.
  text_mode: Record architecture dimensions, tokenizer version, position method, context settings, prediction
    objective, initialization, and training budget. A **checkpoint** stores a particular training state; resuming
    a run can also require optimizer and data-order state. Compare small controlled runs or relevant scaling
    evidence before expanding the budget. Keeping these choices together makes later comparisons easier to
    explain. Later instruction tuning changes learned behavior, but it does not make this original recipe irrelevant.
  bridges: []
- id: base-model-design.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.base-model-design
  title: Count the input table
  markdown: A vocabulary has six tokens and embedding width three. How many entries are in its embedding table?
  text_mode: A vocabulary has six tokens and embedding width three. How many entries are in its embedding table?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: '18'
    - id: b
      text: '9'
    - id: c
      text: '36'
    answer: a
    reveal_markdown: 'There are six rows, each containing three values: 6 × 3 = 18. This counts the embedding
      table, not every parameter in the model.'
    hint: Trace the example using the rule from the preceding pages.
    id: base-model-design.practice.v2.7
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - base-model-design.s1
    - base-model-design.s2
    - base-model-design.s3
    - base-model-design.s4
    - base-model-design.s5
    - base-model-design.s6
    - base-model-design.s7
    - base-model-design.check
    gate_refs:
    - gate.core
  scene_aliases:
    base-model-design.recap: base-model-design.check
assessment_families:
- id: base-model-design.base
  objective_ref: objective.base-model-design
  task: base
  response_type: single_choice
  points: 1
  hint: 'Specify the executable dimensions: trace the inputs, operation, and result before choosing.'
  remediation_scene: base-model-design.s2
  variants:
  - id: base-model-design.base.1
    prompt: What does the label base model usually describe?
    options:
    - id: a
      text: A model before some later adaptation stages
    - id: b
      text: One universal parameter count
    - id: c
      text: A guarantee that no training data were used
    answer: a
    feedback: Base describes a stage in a recipe, not a complete specification.
    retired: true
  - id: base-model-design.base.2
    prompt: Which artifacts must agree on token IDs?
    options:
    - id: b
      text: Only the README title
    - id: c
      text: Only the optimizer’s learning rate
    - id: a
      text: Tokenizer, embeddings, and vocabulary output interface
    answer: a
    feedback: The same integer must refer to the intended vocabulary entry throughout the model.
    retired: true
- id: base-model-design.transfer
  objective_ref: objective.base-model-design
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Tie design to evidence: trace the inputs, operation, and result before choosing.'
  remediation_scene: base-model-design.s4
  variants:
  - id: base-model-design.transfer.1
    prompt: A run loads pretrained weights instead of random initialization. What changed?
    options:
    - id: b
      text: Only the file path spelling
    - id: c
      text: Nothing if the tensor shapes match
    - id: a
      text: The starting learned state and training experiment
    answer: a
    feedback: Matching shapes do not imply identical initialization or prior learning.
    retired: true
  - id: base-model-design.transfer.2
    prompt: A configuration passes shape checks. Does that establish good model quality?
    options:
    - id: c
      text: Only if the width is large
    - id: a
      text: No; training and evaluation evidence are still needed
    - id: b
      text: Yes; tensor compatibility proves capability
    answer: a
    feedback: Executable dimensions are necessary but not sufficient for useful learning.
    retired: true
- id: base-model-design.base.v2
  objective_ref: objective.base-model-design
  task: base
  response_type: numeric_fields_with_reason
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: base-model-design.s3
  variants:
  - prompt: A vocabulary has 5 IDs and width 3. Count embedding entries and weights in an untied width-to-vocabulary
      output projection, excluding bias.
    answers:
      embedding: 15
      output: 15
    reason_answer: a
    reason_options:
    - id: c
      text: The two arrays together require only vocabulary + width entries
    - id: a
      text: Both interfaces contain vocabulary × width entries
    - id: b
      text: The output has only one weight per vocabulary item
    feedback: Each token row has one entry per representation coordinate.
    id: base-model-design.base.v2.1
  - prompt: A vocabulary has 6 IDs and width 4. Count embedding entries and weights in an untied width-to-vocabulary
      output projection, excluding bias.
    answers:
      embedding: 24
      output: 24
    reason_answer: a
    reason_options:
    - id: c
      text: The two arrays together require only vocabulary + width entries
    - id: b
      text: The output has only one weight per vocabulary item
    - id: a
      text: Both interfaces contain vocabulary × width entries
    feedback: Each token row has one entry per representation coordinate.
    id: base-model-design.base.v2.2
  - prompt: A vocabulary has 8 IDs and width 2. Count embedding entries and weights in an untied width-to-vocabulary
      output projection, excluding bias.
    answers:
      embedding: 16
      output: 16
    reason_answer: a
    reason_options:
    - id: a
      text: Both interfaces contain vocabulary × width entries
    - id: c
      text: The two arrays together require only vocabulary + width entries
    - id: b
      text: The output has only one weight per vocabulary item
    feedback: Each token row has one entry per representation coordinate.
    id: base-model-design.base.v2.3
  - prompt: A vocabulary has 7 IDs and width 3. Count embedding entries and weights in an untied width-to-vocabulary
      output projection, excluding bias.
    answers:
      embedding: 21
      output: 21
    reason_answer: a
    reason_options:
    - id: b
      text: The output has only one weight per vocabulary item
    - id: a
      text: Both interfaces contain vocabulary × width entries
    - id: c
      text: The two arrays together require only vocabulary + width entries
    feedback: Each token row has one entry per representation coordinate.
    id: base-model-design.base.v2.4
  numeric_fields:
  - id: embedding
    label: Embedding entries
  - id: output
    label: Output projection weights
  absolute_tolerance: 1.0e-06
- id: base-model-design.transfer.v2
  objective_ref: objective.base-model-design
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: base-model-design.s3
  variants:
  - prompt: A tokenizer keeps the vocabulary size but swaps two token IDs. What must be checked?
    answer: a
    options:
    - id: a
      text: Whether embeddings and outputs still use the intended meanings
    - id: c
      text: Only whether training has the same number of steps
    - id: b
      text: Only whether the model can allocate the same shapes
    feedback: Shape compatibility does not establish semantic compatibility.
    id: base-model-design.transfer.v2.1
  - prompt: A bidirectional encoder sees both sides of a word. What determines whether this is allowed?
    answer: a
    options:
    - id: a
      text: The prediction task and its information rules
    - id: c
      text: Whether the tokenizer uses subwords
    - id: b
      text: Whether its parameter count exceeds a decoder’s
    feedback: Information access must match the task being evaluated.
    id: base-model-design.transfer.v2.2
  - prompt: A team loads learned weights instead of drawing initial weights. What changed?
    answer: a
    options:
    - id: b
      text: The architecture necessarily becomes a mixture of experts
    - id: c
      text: The optimizer no longer needs a loss
    - id: a
      text: The experiment starts from a learned state
    feedback: Starting state is part of the experiment recipe.
    id: base-model-design.transfer.v2.3
  - prompt: A tiny run finishes without crashing but uses incorrect target positions. What does it establish?
    answer: a
    options:
    - id: c
      text: The loss can be compared without checking its definition
    - id: a
      text: Execution worked, but the intended learning task was not validated
    - id: b
      text: The full run is ready because shapes were accepted
    feedback: Check the actual masks and targets, not only successful execution.
    id: base-model-design.transfer.v2.4
