  - id: base-model-design.base.v3
    objective_ref: objective.base-model-design
    task: base
    response_type: single_choice
    points: 1
    hint: Each block holds about 12·d² weights (4d² attention, 8d² MLP), the embeddings hold V·d per table, and RoPE holds none. A fresh model's loss is about ln V.
    remediation_scene: base-model-design.s3
    variants:
      - id: base-model-design.base.v3.1
        prompt: A team keeps 16 layers but doubles the width of its model from 1,024 to 2,048. Roughly what happens to the weights inside the transformer blocks?
        options:
          - id: b
            text: They double, because width is doubled
          - id: c
            text: They grow eightfold, since each layer has three dimensions
          - id: a
            text: They quadruple, because block weights grow with width squared
        answer: a
        feedback: Each block holds about 12·d² weights, so doubling d multiplies them by 4. Doubling would be right for the depth (layer count) or the embedding tables, which grow linearly, and eightfold would need width cubed.
      - id: base-model-design.base.v3.2
        prompt: Kestrel-1B uses RoPE and its context length is raised from 2,048 to 8,192 tokens. How does its parameter count change?
        options:
          - id: a
            text: It stays the same; the cost appears in attention compute and memory
          - id: c
            text: It grows by one learned row of 2,048 numbers per new position
          - id: b
            text: It roughly quadruples, matching the fourfold longer context
        answer: a
        feedback: RoPE rotates queries and keys with a fixed formula, so it has no weights. Extra rows per position would be right for a learned position table like GPT-2's, and the fourfold growth describes nothing about the weight count.
      - id: base-model-design.base.v3.3
        prompt: In a standard transformer block with a 4× wide MLP, which part holds about two-thirds of the block's weights?
        options:
          - id: c
            text: The attention part, because it has four separate matrices
          - id: a
            text: The MLP, with about 8d² of the block's roughly 12d² weights
          - id: b
            text: The layer normalization, which scales every number in the block
        answer: a
        feedback: The MLP's up and down projections are d × 4d each, so 8d². Attention's four matrices are only d × d each, so 4d². Normalization adds just a few thousand weights.
      - id: base-model-design.base.v3.4
        prompt: A freshly initialized model with a 32,000-token vocabulary reports a loss of 1.9 on its first training step. What is the most likely explanation?
        options:
          - id: b
            text: The random initialization happened to land near a good solution
          - id: a
            text: A bug lets it see the answer, such as targets that weren't shifted
          - id: c
            text: The vocabulary is too small for a loss above 2 to occur
        answer: a
        feedback: A model that knows nothing should score about ln 32,000 ≈ 10.4. A loss of 1.9 on step 1 almost always means the target is visible in the input. A random start can't be that lucky, and ln V is well above 2 for any real vocabulary.
  - id: base-model-design.transfer.v3
    objective_ref: objective.base-model-design
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask which line of the config card changed, and whether it changes what the numbers mean, how many there are, or what the model is allowed to see.
    remediation_scene: base-model-design.s6
    variants:
      - id: base-model-design.transfer.v3.1
        prompt: A lab loads a released base model with a tokenizer that has the same vocabulary size but was trained on different text. Nothing crashes, but the output is nonsense. What went wrong?
        options:
          - id: c
            text: The two tokenizers needed different vocabulary sizes to load properly
          - id: b
            text: The model's context length is shorter than the new tokenizer expects
          - id: a
            text: Each token ID now names a different piece of text than in training
        answer: a
        feedback: The embedding rows were learned for what each ID meant under the original tokenizer. Equal sizes let the arrays load, which is exactly why the mismatch is silent. Context length doesn't depend on which tokenizer made the IDs.
      - id: base-model-design.transfer.v3.2
        prompt: A 125-million-parameter model with width 768 is being made multilingual, and someone proposes a 256,000-token vocabulary. What is the main cost to check first?
        options:
          - id: a
            text: The embedding tables would hold more weights than the blocks
          - id: b
            text: Each block's attention would need four times as many weights
          - id: c
            text: The context window would have to shrink to make room for it
        answer: a
        feedback: One table alone is 256,000 × 768 ≈ 197 million weights, more than the whole model today. Vocabulary size doesn't change the block matrices, which depend only on width, or the context length.
      - id: base-model-design.transfer.v3.3
        prompt: A company wants a model that fills in missing fields of scanned forms, using the text both before and after each blank. Which architecture fits that task best?
        options:
          - id: b
            text: A decoder, since causal masks make it the stronger design overall
          - id: a
            text: An encoder, since each blank can use context on both sides
          - id: c
            text: A decoder with a longer context, so it can see the later fields
        answer: a
        feedback: Filling a blank from both sides is what BERT-style encoders are built for. A decoder's causal mask hides everything after the blank, and a longer context doesn't change that. The families suit different tasks rather than ranking from weak to strong.
      - id: base-model-design.transfer.v3.4
        prompt: A new run with a 32,000-token vocabulary has been training for 2,000 steps, and its loss is still flat at about 10.4. What should the team suspect?
        options:
          - id: c
            text: The model has already reached the best loss this data allows
          - id: b
            text: The vocabulary is too large for the model to learn anything
          - id: a
            text: The updates aren't reaching the weights, such as a zero learning rate
        answer: a
        feedback: ln 32,000 ≈ 10.4 is the loss of pure guessing, so nothing has been learned. Real text allows far lower losses, and much larger vocabularies train fine. Check the learning rate, the warmup, and whether gradients flow.
  - id: base-model-design.calculate
    objective_ref: objective.base-model-design
    task: base
    response_type: numeric
    points: 1
    hint: Block weights are 12 × layers × width². Each embedding table is vocabulary × width; count it twice if the input and output tables are untied. Answer in millions.
    remediation_scene: base-model-design.s3
    absolute_tolerance: 1
    variants:
      - id: base-model-design.calculate.1
        prompt: A decoder has 12 layers, width 768, and a vocabulary of 50,257 with tied input and output embeddings. Using N ≈ 12·L·d² + V·d, estimate its parameter count in millions.
        answer: 123.5
        feedback: 12 × 12 × 768² = 84,934,656 block weights, plus 50,257 × 768 = 38,597,376 in the shared table, gives 123,532,032, about 123.5 million. That's the shape of GPT-2 small, usually quoted as 124M.
      - id: base-model-design.calculate.2
        prompt: A decoder has 24 layers, width 1,024, and a vocabulary of 50,000 with untied input and output tables. Estimate its parameter count in millions.
        answer: 404.4
        feedback: 12 × 24 × 1,024² = 301,989,888, plus 2 × 50,000 × 1,024 = 102,400,000, gives 404,389,888, about 404.4 million.
      - id: base-model-design.calculate.3
        prompt: A decoder has 16 layers, width 2,048, and a vocabulary of 32,000 with tied input and output embeddings. Estimate its parameter count in millions.
        answer: 870.8
        feedback: 12 × 16 × 2,048² = 805,306,368, plus one shared table of 32,000 × 2,048 = 65,536,000, gives 870,842,368, about 870.8 million.
      - id: base-model-design.calculate.4
        prompt: A decoder has 32 layers, width 4,096, and a vocabulary of 32,000 with untied input and output tables. Estimate its parameter count in millions.
        answer: 6704.6
        feedback: 12 × 32 × 4,096² = 6,442,450,944, plus 2 × 32,000 × 4,096 = 262,144,000, gives 6,704,594,944, about 6,704.6 million (6.7 billion). That's the depth, width, and vocabulary of the 7B Llama models.
