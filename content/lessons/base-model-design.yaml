scenes:
  - id: base-model-design.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.base-model-design
    title: Kestrel-1B begins as a config card
    markdown: |-
      A four-person team has rented 32 GPUs for a few weeks to build a small open language model called **Kestrel-1B**. Before they download a single web page, they fill in a card like this one. Almost every number on it is locked once training starts:

      | Setting | Kestrel-1B | What it fixes |
      | --- | --- | --- |
      | Layers $L$ | 16 | Transformer blocks per token |
      | Width $d_{\text{model}}$ | 2,048 | Numbers that represent each token |
      | Attention heads | 16, of size 128 | Attention patterns per layer |
      | Vocabulary $V$ | 50,304 | Rows in the input and output tables |
      | Context length | 2,048 tokens | Longest text read at once |
      | Positions | RoPE | How word order enters attention |
      | Objective | Next-token prediction | What every step asks |
      | Training tokens | 100 billion | How much text the run reads |

      The result will be a **base model**: a model trained only to continue text, before any instruction tuning or chat training. Ask one "What is the capital of France?" and it may reply with three more quiz questions, because that's how such text often continues on the web. Later modules turn base models into assistants. This module builds one, and Kestrel-1B follows us through every lesson.
    bridges: []
  - id: base-model-design.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.base-model-design
    title: Why Kestrel is a decoder, not a BERT
    markdown: |-
      The transformer module met three families. A **decoder** uses a causal mask, so each position sees only earlier tokens: ideal for writing text one token at a time. An **encoder** such as BERT (2018) lets every token see both sides, which suits filling in blanks. An encoder–decoder such as T5 (2019) reads with one stack and writes with another, which suits translation.

      Kestrel should generate text, so the team picks decoder-only, the design behind GPT-3 (2020), Llama (2023), and most large open base models since. It has a bonus in pretraining: one 2,048-token sequence gives 2,047 next-token predictions from a single forward pass, while BERT's objective scores only about 15% of positions.
    bridges: []
  - id: base-model-design.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.base-model-design
    title: Where a billion parameters live
    markdown: |-
      Count Kestrel's weights one piece at a time, with $d = 2{,}048$.

      - **Attention** has four $d \times d$ matrices (query, key, value, output): $4d^2 = 16{,}777{,}216$.
      - The **MLP** (the feed-forward part of the block) widens each token to $4d = 8{,}192$ numbers and back down: $2 \times 2{,}048 \times 8{,}192 = 33{,}554{,}432$.
      - One block is therefore $12d^2 = 50{,}331{,}648$, and 16 blocks hold $805{,}306{,}368$.
      - The **embedding table** gives each of the 50,304 token IDs a row of 2,048 numbers: $103{,}022{,}592$. Kestrel keeps a separate output layer of the same size (the embeddings are *untied*), so the two together hold $206{,}045{,}184$.

      The total is $1{,}011{,}351{,}552$, about 1.01 billion. Biases and normalization weights add less than 0.1%. EleutherAI's Pythia-1B (2023) used this same depth and width: 16 layers of 2,048.

      :::papers The standard parameter estimate
      $$N \approx 12\,L\,d_{\text{model}}^2 \;+\; 2\,V d_{\text{model}}$$

      $L = 16$ and $d_{\text{model}} = 2{,}048$ give the 805 million block weights; $V = 50{,}304$ gives the 206 million embedding weights (drop the 2 if the tables are tied). Kaplan et al. (2020) used $12\,L\,d_{\text{model}}^2$ as the non-embedding count. Llama's gated MLP (SwiGLU) uses three matrices with hidden size about $\tfrac{8}{3}d$, which keeps it near $8d^2$.
      :::

      :::predict The team doubles the width to 4,096 but keeps 16 layers. What happens to the block parameters?
      They quadruple, to $12 \times 16 \times 4{,}096^2 = 3{,}221{,}225{,}472$, because width appears squared. Doubling the depth to 32 layers instead only doubles them, to $1{,}610{,}612{,}736$. The embedding tables grow in line with width, so they double either way.
      :::

      Run the card as code. Then set `tied = True` and watch 103 million weights disappear, or set `vocab = 256_000` and see the embedding tables outweigh all 16 blocks.

      ```python run
      # Kestrel-1B config card
      layers, d_model, heads, vocab, context = 16, 2048, 16, 50_304, 2048
      tied = False          # separate input embedding and output head

      attn_per_layer = 4 * d_model**2              # W_Q, W_K, W_V, W_O
      mlp_per_layer = 2 * d_model * (4 * d_model)  # up to 4d, back down to d
      blocks = layers * (attn_per_layer + mlp_per_layer)
      embeddings = vocab * d_model * (1 if tied else 2)

      print(f"head size:         {d_model // heads}")
      print(f"attention / layer: {attn_per_layer:>13,}")
      print(f"MLP / layer:       {mlp_per_layer:>13,}")
      print(f"all {layers} blocks:     {blocks:>13,}")
      print(f"embeddings:        {embeddings:>13,}")
      print(f"total:             {blocks + embeddings:>13,}  (~{(blocks + embeddings) / 1e9:.2f}B)")
      print(f"embedding share:   {embeddings / (blocks + embeddings):.0%}")
      ```

      At this size the embeddings are 20% of the model, so small models feel vocabulary size far more than large ones.
    bridges: []
    diagram:
      caption: Where Kestrel-1B's 1.01 billion weights sit, from token IDs to next-token scores.
      description: Token IDs enter the embedding table (50,304 rows of 2,048 numbers, 103 million weights). The vectors pass through 16 transformer blocks; each block has an attention part with 4d² weights and an MLP part with 8d² weights, 805 million in total. The output head (another 103 million weights) turns each final vector into 50,304 scores, one per possible next token.
      nodes:
        - id: ids
          label: Token IDs
          note: 2,048 per sequence
          col: 0
          row: 0
          tone: data
        - id: embed
          label: Embedding table
          note: 50,304 × 2,048 = 103M
          col: 1
          row: 0
        - id: attn
          label: Attention, 4d² per block
          note: 16.8M × 16 blocks
          col: 2
          row: 0
          tone: accent
        - id: mlp
          label: MLP, 8d² per block
          note: 33.6M × 16 blocks
          col: 2
          row: 1
          tone: accent
        - id: head
          label: Output head
          note: 2,048 × 50,304 = 103M
          col: 3
          row: 1
        - id: scores
          label: Next-token scores
          note: one per vocabulary entry
          col: 4
          row: 1
          tone: data
      edges:
        - from: ids
          to: embed
        - from: embed
          to: attn
        - from: attn
          to: mlp
          label: repeat 16 times
        - from: mlp
          to: head
        - from: head
          to: scores
  - id: base-model-design.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.base-model-design
    title: Longer context costs compute, not weights
    markdown: |-
      The team is tempted to raise the context length from 2,048 to 8,192 tokens. How many parameters does that add?

      With RoPE, none. RoPE rotates each query and key by a position-dependent angle from a fixed formula, not learned weights (the lesson on positional encodings showed the rotation). The cost shows up elsewhere. Each token attends to every earlier token, so query–key pairs grow with the square of the length: 4 times the context means about 16 times the attention scores. Memory grows too. While generating, the model keeps a key and a value for every earlier token in every layer: $2 \times 16 \times 2{,}048 \times 2{,}048 \approx 134$ million numbers, about 268 MB per sequence in 16-bit numbers, or 1.07 GB at 8,192 tokens.

      :::mixup "A longer context window means a bigger model."
      Kestrel at 2,048 and at 8,192 tokens has exactly the same 1,011,351,552 weights. The work per sequence and the key–value memory are what grow. (Models with learned position tables, like GPT-2, add one row per position, but even 8,192 × 2,048 is only 17 million weights.)
      :::

      Kestrel is also **dense**: every token uses every weight. A **mixture of experts (MoE)** instead gives each block several MLPs and a router that sends each token to one or two, adding weights without adding much compute per token.
    bridges: []
  - id: base-model-design.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.base-model-design
    title: The first loss should be about 10.8
    markdown: |-
      **Initialization** sets every weight to a small random starting value before training, commonly drawn from a normal distribution with a standard deviation around 0.02. (The lesson on stable training showed why that scale matters.) Such a model knows nothing, so its predictions are close to uniform: roughly $1/50{,}304$ for every token.

      :::predict What loss should Kestrel report on its very first step?
      The next-token loss is $-\ln p$ of the correct token, so with $p \approx 1/50{,}304$ it's $\ln 50{,}304 \approx 10.83$. A first loss near 10.8 means the plumbing is probably right. A first loss of 0.5 means the model can see the answer, usually because the targets weren't shifted or the causal mask is missing. A loss still at 10.8 after a thousand steps means updates aren't reaching the weights.
      :::

      A second cheap test: train on one batch of 8 sequences for a few hundred steps and check that the loss falls close to zero. A model that can't memorize eight sequences has a bug. Both checks take minutes and protect weeks of GPU time.
    bridges: []
  - id: base-model-design.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.base-model-design
    title: A checkpoint is useless without its card
    markdown: |-
      Six months after release, a colleague loads Kestrel's weights with a retrained tokenizer that also has 50,304 entries. Every array loads without an error, and the output is gibberish: token ID 3,117 used to mean " falcon" and now means " fal". The weights learned what each *ID* meant, not what text it stood for.

      So the team saves the card next to every **checkpoint** (a saved copy of the model's weights at some point in training):

      ```json
      {"model": "kestrel-1b", "layers": 16, "d_model": 2048, "heads": 16,
       "vocab_size": 50304, "tokenizer": "kestrel-bpe-v3 (sha256 9f2c…)",
       "context": 2048, "positions": "rope, base 10000", "tied_embeddings": false,
       "objective": "causal next-token", "init_std": 0.02, "train_tokens": 1.0e11}
      ```

      Before you load any base model, check three lines of its card against your setup: the tokenizer (by name *and* hash), the context length, and the position method. Those are the mismatches that fail silently.
    bridges: []
  - id: base-model-design.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.base-model-design
    markdown: Parameter counts to work by hand, plus a swapped tokenizer, a stuck loss, and a form-filling task, test whether you can read and write a config card.
    takeaway: |-
      A config card fixes a model's shape before training: about 12·L·d² weights in the blocks plus the embedding tables. Check that the first loss is near ln V, and keep the card with every checkpoint.
  - id: base-model-design.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.base-model-design
    markdown: |-
      A base-model recipe specifies architecture, tokenizer, initialization, context, objective, and resource budget before weights are learned; later behavior depends on their interaction.
  - id: base-model-design.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.base-model-design
    title: Count the input table
    markdown: The embedding table has one row per token ID. Try it on a toy vocabulary. A vocabulary has six tokens and embedding width three. How many entries are in its embedding table?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: '18'
        - id: b
          text: '9'
        - id: c
          text: '36'
      answer: a
      reveal_markdown: |-
        There are six rows, one per token, each holding three numbers: 6 × 3 = 18. Kestrel's table works the same way at scale: 50,304 × 2,048 = 103,022,592.
      hint: Each token ID gets one row, and each row holds one number per unit of width. Multiply rows by width.
      id: base-model-design.practice.v2.7
