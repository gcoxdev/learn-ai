lesson:
  id: base-model-design
  version: 0.4.0-draft
  title: Choose the model that pretraining will fit
  state: draft
  summary: Sixteen layers, width 2,048, a 50,304-token vocabulary. See how a few numbers on a card fix a model's billion parameters before it reads a single word.
