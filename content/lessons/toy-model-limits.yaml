schema_version: 0.2-draft
lesson:
  id: toy-model-limits
  version: 0.3.0-draft
  title: What a demonstration proves—and what it leaves open
  state: draft
  summary: Audit a tiny stripe classifier from stored pixels to evidence, then identify which conclusions survive
    outside its teaching example.
  slot: M02.8
  category: learning
  sources:
  - title: 'Dive into Deep Learning: generalization'
    url: https://d2l.ai/chapter_linear-regression/generalization.html
  - title: 'PyTorch documentation: reproducibility'
    url: https://docs.pytorch.org/docs/main/notes/randomness.html
  archetype: mechanism
objectives:
- id: objective.toy-model-limits
  version: 2-draft
  statement: Use a counterexample to distinguish an implemented toy mechanism from an unsupported performance
    claim, and specify an appropriate next evaluation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - toy-model-limits.base.v2
  - toy-model-limits.transfer.v2
  prerequisites:
  - anyOf:
    - objective.algorithms-and-programs
  - anyOf:
    - objective.features-and-bias
  - anyOf:
    - objective.randomness-reproducibility
scenes:
- id: toy-model-limits.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.toy-model-limits
  title: Build a complete miniature investigation
  markdown: 'A **toy model** or toy experiment deliberately simplifies a problem so that we can inspect its
    steps. It may be a hand-written rule, a tiny learned predictor, or a simplified physical simulation. The
    word toy does not tell us which.


    Our task is to distinguish horizontal from vertical white stripes in a two-by-two black-and-white picture.
    Inputs are four pixel values, with 1 for white and 0 for black, read across the top row and then the bottom
    row. The output is a label. We will write the rule ourselves; no training procedure is involved.'
  text_mode: 'A **toy model** or toy experiment deliberately simplifies a problem so that we can inspect its
    steps. It may be a hand-written rule, a tiny learned predictor, or a simplified physical simulation. The
    word toy does not tell us which.


    Our task is to distinguish horizontal from vertical white stripes in a two-by-two black-and-white picture.
    Inputs are four pixel values, with 1 for white and 0 for black, read across the top row and then the bottom
    row. The output is a label. We will write the rule ourselves; no training procedure is involved.'
  bridges: []
- id: toy-model-limits.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.toy-model-limits
  title: Trace the rule before judging it
  markdown: 'Our invented rule says: “If the top two pixel values are both 1, output horizontal; otherwise
    output vertical.”


    For [1, 1, 0, 0], the top row is white and the rule outputs horizontal. For [1, 0, 1, 0], the white pixels
    form a left column and the rule outputs vertical. Both match our intended labels. These examples show how
    the condition operates and demonstrate two correct outcomes.


    They do not establish that the rule recognizes orientation in general. Two examples may leave important
    variations completely untested. Keep the mechanism trace and the performance claim separate.'
  text_mode: 'Our invented rule says: “If the top two pixel values are both 1, output horizontal; otherwise
    output vertical.”


    For [1, 1, 0, 0], the top row is white and the rule outputs horizontal. For [1, 0, 1, 0], the white pixels
    form a left column and the rule outputs vertical. Both match our intended labels. These examples show how
    the condition operates and demonstrate two correct outcomes.


    They do not establish that the rule recognizes orientation in general. Two examples may leave important
    variations completely untested. Keep the mechanism trace and the performance claim separate.'
  bridges: []
- id: toy-model-limits.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.toy-model-limits
  title: Find a counterexample
  markdown: 'Move the horizontal stripe to the bottom row: [0, 0, 1, 1]. It is still horizontal, but the rule
    outputs vertical because its top two values are not both 1. This **counterexample** disproves the claim
    that the rule handles every two-by-two horizontal stripe under our convention.


    We could revise the condition to check either row. That repair addresses this failure, but we must still
    define what to do with a blank picture, a fully white picture, or a diagonal pair of white pixels. Some
    inputs do not belong to either promised class. The task specification needs an explicit boundary.'
  text_mode: 'Move the horizontal stripe to the bottom row: [0, 0, 1, 1]. It is still horizontal, but the rule
    outputs vertical because its top two values are not both 1. This **counterexample** disproves the claim
    that the rule handles every two-by-two horizontal stripe under our convention.


    We could revise the condition to check either row. That repair addresses this failure, but we must still
    define what to do with a blank picture, a fully white picture, or a diagonal pair of white pixels. Some
    inputs do not belong to either promised class. The task specification needs an explicit boundary.'
  bridges: []
- id: toy-model-limits.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.toy-model-limits
  title: Name what the example leaves out
  markdown: 'Our four-value representation excludes shades of gray, noise, larger shapes, and natural photographs.
    Our hand-written decision rule also leaves out learning from examples. A label appearing on screen is evidence
    that the program ran; it is not evidence that weights were trained.


    The earlier image-storage calculation similarly counted raw channel bytes while leaving out file metadata
    and compression. The seeded generator lesson exposed state changes without claiming to provide realistic
    random sampling. Each simplification serves a particular explanation. The important question is whether
    an omitted detail matters to the conclusion you want to draw.'
  text_mode: 'Our four-value representation excludes shades of gray, noise, larger shapes, and natural photographs.
    Our hand-written decision rule also leaves out learning from examples. A label appearing on screen is evidence
    that the program ran; it is not evidence that weights were trained.


    The earlier image-storage calculation similarly counted raw channel bytes while leaving out file metadata
    and compression. The seeded generator lesson exposed state changes without claiming to provide realistic
    random sampling. Each simplification serves a particular explanation. The important question is whether
    an omitted detail matters to the conclusion you want to draw.'
  bridges: []
- id: toy-model-limits.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.toy-model-limits
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A small example can make a mechanism visible. State its assumptions and test new cases before extending
    its conclusions to a real system.
- id: toy-model-limits.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.toy-model-limits
  markdown: A toy experiment isolates a mechanism; transferring its result to a full system requires checking
    data, scale, assumptions, and evaluation conditions.
  text_mode: A toy experiment isolates a mechanism; transferring its result to a full system requires checking
    data, scale, assumptions, and evaluation conditions.
- id: toy-model-limits.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.toy-model-limits
  title: Plan a fair next evaluation
  markdown: 'First specify which inputs count as valid stripes and what an acceptable response is for other
    pictures. Collect new examples covering both orientations, both positions, and any noise you intend the
    system to tolerate.


    If you repeatedly inspect the same test set and adjust your rule to fix it, that set becomes part of your
    development process. Keep a separate final evaluation set unused during those choices. **Held-out** means
    deliberately reserved from the relevant fitting or selection step. Report failures by kind as well as an
    overall score, so a frequent easy case does not hide a systematic weakness.'
  text_mode: 'First specify which inputs count as valid stripes and what an acceptable response is for other
    pictures. Collect new examples covering both orientations, both positions, and any noise you intend the
    system to tolerate.


    If you repeatedly inspect the same test set and adjust your rule to fix it, that set becomes part of your
    development process. Keep a separate final evaluation set unused during those choices. **Held-out** means
    deliberately reserved from the relevant fitting or selection step. Report failures by kind as well as an
    overall score, so a frequent easy case does not hide a systematic weakness.'
  bridges: []
- id: toy-model-limits.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.toy-model-limits
  title: Use the small example as a stepping stone
  markdown: 'An experiment note can be short and precise: “This hand-written condition labels these two examples
    correctly, fails on a bottom-row stripe, and has not been evaluated on noisy images.” It states the mechanism,
    observed evidence, and limits without dismissing what the example taught.


    For a learned replacement, record the training examples, adjustable parameters, update procedure, and evaluation
    design. If randomness is involved, record seeds and variation across runs. Then compare both approaches
    on the same stated task. Moving to a bigger model does not remove the need to check representation, assumptions,
    or evidence.'
  text_mode: 'An experiment note can be short and precise: “This hand-written condition labels these two examples
    correctly, fails on a bottom-row stripe, and has not been evaluated on noisy images.” It states the mechanism,
    observed evidence, and limits without dismissing what the example taught.


    For a learned replacement, record the training examples, adjustable parameters, update procedure, and evaluation
    design. If randomness is involved, record seeds and variation across runs. Then compare both approaches
    on the same stated task. Moving to a bigger model does not remove the need to check representation, assumptions,
    or evidence.'
  bridges: []
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - toy-model-limits.s1
    - toy-model-limits.s2
    - toy-model-limits.s3
    - toy-model-limits.s4
    - toy-model-limits.s5
    - toy-model-limits.s6
    - toy-model-limits.check
    gate_refs:
    - gate.core
  scene_aliases:
    toy-model-limits.recap: toy-model-limits.check
assessment_families:
- id: toy-model-limits.base
  objective_ref: objective.toy-model-limits
  task: base
  response_type: single_choice
  points: 1
  hint: 'Distinguish a simulation from a trained model: trace the inputs, operation, and result before choosing.'
  remediation_scene: toy-model-limits.s2
  variants:
  - id: toy-model-limits.base.1
    prompt: A scripted token animation contains no trained weights. What should it be called?
    options:
    - id: a
      text: An illustration or simulation
    - id: b
      text: A verified live model benchmark
    - id: c
      text: A full pretraining run
    answer: a
    feedback: The label should describe the computation actually performed.
    retired: true
  - id: toy-model-limits.base.2
    prompt: Why use a tiny hand-calculated example?
    options:
    - id: b
      text: To prove all large models behave identically
    - id: c
      text: To replace every empirical test
    - id: a
      text: To expose the mechanism and check intermediate values
    answer: a
    feedback: Transparency makes a limited operation easier to understand and verify.
    retired: true
- id: toy-model-limits.transfer
  objective_ref: objective.toy-model-limits
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Report the boundary of the claim: trace the inputs, operation, and result before choosing.'
  remediation_scene: toy-model-limits.s4
  variants:
  - id: toy-model-limits.transfer.1
    prompt: A toy gradient update is correct. What remains to test for a large training run?
    options:
    - id: b
      text: Nothing; one scalar example proves the whole pipeline
    - id: c
      text: Only the chart title
    - id: a
      text: Data, optimization, numerical, and system behavior at scale
    answer: a
    feedback: Correctness of one mechanism does not establish the full system.
    retired: true
  - id: toy-model-limits.transfer.2
    prompt: An animation and a live model output look alike. Are their evidential meanings identical?
    options:
    - id: c
      text: Only if both use color
    - id: a
      text: No; their generation procedures differ
    - id: b
      text: Yes; appearance is the only evidence
    answer: a
    feedback: Interpret a demonstration using its underlying procedure and scope.
    retired: true
- id: toy-model-limits.base.v2
  objective_ref: objective.toy-model-limits
  task: base
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: toy-model-limits.s3
  variants:
  - prompt: The rule outputs horizontal only when the top two pixels are both 1. What does it output for [0,
      0, 1, 1]?
    answer: a
    options:
    - id: c
      text: No output, because the rule contains a training step.
    - id: a
      text: Vertical, incorrectly labeling a bottom-row horizontal stripe.
    - id: b
      text: Horizontal, because it inspects the bottom row first.
    feedback: The top-row condition fails, so its else branch says vertical.
    id: toy-model-limits.base.v2.1
  - prompt: Which observation directly refutes “the rule handles all valid horizontal stripes”?
    answer: a
    options:
    - id: a
      text: It labels a bottom-row horizontal stripe as vertical.
    - id: b
      text: It labels a top-row horizontal stripe as horizontal.
    - id: c
      text: It executes the same condition twice with the same result.
    feedback: One valid counterexample disproves that universal claim.
    id: toy-model-limits.base.v2.2
  - prompt: The developer wrote the stripe condition manually. What evidence would be needed to call its settings
      learned?
    answer: a
    options:
    - id: b
      text: A screenshot showing an output label.
    - id: c
      text: A second run with the same input.
    - id: a
      text: A training procedure that adjusted them using examples.
    feedback: Execution and learning are different processes.
    id: toy-model-limits.base.v2.3
  - prompt: The rule succeeds on two displayed examples. What claim does that directly support?
    answer: a
    options:
    - id: c
      text: It has learned every orientation from experience.
    - id: a
      text: It produced the expected labels on those two examples.
    - id: b
      text: It will recognize noisy photographs at the same accuracy.
    feedback: Keep the demonstrated result distinct from untested extensions.
    id: toy-model-limits.base.v2.4
- id: toy-model-limits.transfer.v2
  objective_ref: objective.toy-model-limits
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: toy-model-limits.s5
  variants:
  - prompt: You repeatedly change a rule after inspecting its test cases. How should you evaluate the resulting
      choices?
    answer: a
    options:
    - id: c
      text: Measure only the cases that motivated the last repair.
    - id: a
      text: Use a separate final set not used to make those changes.
    - id: b
      text: Call the inspected cases unseen because no weight optimizer ran.
    feedback: Manual selection can also adapt to evaluation examples.
    id: toy-model-limits.transfer.v2.1
  - prompt: A blank image is neither a horizontal nor a vertical stripe. What should be settled before scoring
      the rule on it?
    answer: a
    options:
    - id: a
      text: The task’s expected behavior for inputs outside the two stripe classes.
    - id: b
      text: Which seed makes the existing two-class answer appear random.
    - id: c
      text: How to relabel the blank image after seeing the output.
    feedback: Specify valid inputs and desired handling before judging the response.
    id: toy-model-limits.transfer.v2.2
  - prompt: An ideal four-worker calculation omits communication. Can it establish actual GPU runtime?
    answer: a
    options:
    - id: b
      text: Yes; an ideal estimate is a measurement of every device.
    - id: c
      text: Yes; worker count specifies all data-transfer costs.
    - id: a
      text: No; it isolates a mechanism and omits costs that affect runtime.
    feedback: An informative simplification is not a measurement of the omitted system.
    id: toy-model-limits.transfer.v2.3
  - prompt: You replace the hand-written rule with a trained model. Which comparison better tests whether it
      improved?
    answer: a
    options:
    - id: c
      text: Compare the old rule’s hard cases with the new model’s training examples.
    - id: a
      text: Evaluate both on the same stated task and reserved cases.
    - id: b
      text: Count only the number of adjustable parameters in each system.
    feedback: A shared evaluation supports a performance comparison; size alone does not.
    id: toy-model-limits.transfer.v2.4
