schema_version: 0.2-draft
lesson:
  id: toy-model-limits
  version: 0.4.0-draft
  title: Be a good scientist with a small example
  state: draft
  summary: Your stripe detector gets both test pictures right. Now try to break it. Hunt for a counterexample, test every picture there is, and write a lab note you'd trust.
  slot: M02.8
  category: learning
  sources:
    - title: 'Dive into Deep Learning: generalization'
      url: https://d2l.ai/chapter_linear-regression/generalization.html
    - title: 'PyTorch documentation: reproducibility'
      url: https://docs.pytorch.org/docs/main/notes/randomness.html
  archetype: mechanism
objectives:
  - id: objective.toy-model-limits
    version: 3-draft
    statement: Use a counterexample to separate what a toy model actually does from a claim it can't support, and choose the next test.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - toy-model-limits.base.v3
      - toy-model-limits.transfer.v3
    prerequisites:
      - anyOf:
          - objective.algorithms-and-programs
      - anyOf:
          - objective.features-and-bias
      - anyOf:
          - objective.randomness-reproducibility
scenes:
  - id: toy-model-limits.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.toy-model-limits
    title: Small on purpose
    markdown: |-
      Biologists study fruit flies. Physicists roll balls down frictionless slopes. Scientists love tiny examples because you can see every moving part, and AI is no different.

      A **toy model** is a deliberately tiny version of a problem, small enough to check completely by hand. It might be a hand-written rule, a model with three weights, or a two-by-two picture. Its size is its superpower.

      :::story Two tiny examples that changed AI
      In 1969, Marvin Minsky and Seymour Papert published *Perceptrons*. Using small, carefully chosen examples, such as the XOR pattern ("one or the other, but not both"), they proved that a single-layer perceptron, a popular learning machine of the day, can't learn certain simple patterns at all. Small examples, examined carefully, can show things no amount of hopeful testing would.
      :::

      This lesson is your first lab. The task: tell horizontal stripes from vertical stripes in the 2-by-2 black-and-white pictures you've been using all module (1 = white, 0 = black). Each picture arrives as four values, top row first: [top-left, top-right, bottom-left, bottom-right]. You'll build a detector, try hard to break it, and write up what you found like a scientist.
    bridges: []
  - id: toy-model-limits.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.toy-model-limits
    title: A rule that passes its first tests
    markdown: |-
      Here's a first attempt, written by hand: *"If both top pixels are white, say horizontal. Otherwise say vertical."*

      Trace it, as you did the parcel loop:

      | Picture | Top two both 1? | Rule says | Correct? |
      | --- | --- | --- | --- |
      | [1, 1, 0, 0], white top row | Yes | horizontal | ✓ |
      | [1, 0, 1, 0], white left column | No | vertical | ✓ |

      Two for two. It's tempting to declare victory. A good scientist does the opposite and asks: *where would this rule break, if it were going to?* Notice the rule only ever looks at the top row. That's a clue.

      Also notice what kind of thing this is. Nobody trained it; we wrote the condition ourselves, so there are no learned weights. Its correct answers show the rule running as designed, which is exactly what we want to test next.
    bridges: []
  - id: toy-model-limits.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.toy-model-limits
    title: Try to break it
    markdown: |-
      :::predict Can you find a horizontal stripe that the rule gets wrong?
      Move the stripe to the bottom: [0, 0, 1, 1]. It's plainly horizontal, but the top two pixels aren't both white, so the rule says vertical. Wrong.
      :::

      A single input that breaks a general claim is a **counterexample**. The claim "this rule labels every horizontal stripe correctly" had two successes behind it, and one counterexample knocks it down for good.

      :::story The black swan
      For centuries, Europeans used "a black swan" as a figure of speech for something impossible; every swan anyone had seen was white. Then in 1697, Dutch explorers led by Willem de Vlamingh saw black swans in Western Australia. Thousands of white swans had never proved the rule. One black swan disproved it.
      :::

      In a toy world, you can hunt for counterexamples systematically. There are only four stripes, so test them all:

      ```python run
      def first_rule(p):                     # p = [top-left, top-right, bottom-left, bottom-right]
          if p[0] == 1 and p[1] == 1:        # both top pixels white?
              return "horizontal"
          return "vertical"                  # anything else

      stripes = {                            # every possible stripe, with the right answer
          (1, 1, 0, 0): "horizontal",        # white top row
          (0, 0, 1, 1): "horizontal",        # white bottom row
          (1, 0, 1, 0): "vertical",          # white left column
          (0, 1, 0, 1): "vertical",          # white right column
      }
      for picture, truth in stripes.items():
          guess = first_rule(picture)
          verdict = "ok" if guess == truth else "WRONG (should be " + truth + ")"
          print(picture, "->", guess, verdict)
      ```

      Three right, one wrong: exactly the bottom-row stripe. Before running it, try predicting each line yourself.
    bridges: []
  - id: toy-model-limits.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.toy-model-limits
    title: Test every picture there is
    markdown: |-
      Fixing the rule raises a better question: what should it say about pictures that aren't stripes at all? A blank picture, an all-white one, a diagonal pair, a single white dot. Our task never said. So we decide, and write it down: *horizontal* if exactly two whites fill a row, *vertical* if exactly two fill a column, and *neither* for everything else.

      :::predict How many different 2-by-2 black-and-white pictures are there?
      Each of the 4 pixels has 2 choices, so 2 × 2 × 2 × 2 = 16, the same doubling you counted in the search-tree lesson. Only 4 of them are stripes.
      :::

      Sixteen is few enough to test every single one. That's something you can never do with real photos, and it's the toy's greatest gift:

      ```python run
      from itertools import product

      def fixed_rule(p):
          rows = [p[0] + p[1], p[2] + p[3]]     # white pixels in each row
          cols = [p[0] + p[2], p[1] + p[3]]     # white pixels in each column
          if sum(p) == 2 and 2 in rows:         # exactly two whites, filling a row
              return "horizontal"
          if sum(p) == 2 and 2 in cols:         # exactly two whites, filling a column
              return "vertical"
          return "neither"                      # blank, all white, diagonal, single dots...

      tally = {}
      for p in product([0, 1], repeat=4):       # every possible 2x2 picture, one by one
          label = fixed_rule(p)
          tally[label] = tally.get(label, 0) + 1
          if label != "neither":
              print(p, label)
      print("totals:", tally)
      ```

      `product([0, 1], repeat=4)` lists all 16 pictures. The fixed rule finds 2 horizontal stripes, 2 vertical stripes, and 12 pictures that are neither. Within this tiny world, you now *know* the rule is right on every possible input.
    bridges: []
  - id: toy-model-limits.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.toy-model-limits
    markdown: Trace the stripe rules on new pictures, then play scientist with a spam filter, a route planner, a pet classifier, and a speedup estimate.
    takeaway: |-
      Try to break your own idea: hunt for counterexamples, test every case you can, and keep a fresh test set for the final check. Then say exactly what you showed, and on which inputs.
  - id: toy-model-limits.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.toy-model-limits
    markdown: |-
      A toy experiment isolates a mechanism; transferring its result to a full system requires checking data, scale, assumptions, and evaluation conditions.
  - id: toy-model-limits.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.toy-model-limits
    title: Keep a test you haven't peeked at
    markdown: |-
      Real pictures are bigger and messier, so Kai upgrades the lab to 8-by-8 grayscale pictures with a little noise. There are far too many possible pictures to test them all, so he collects 40 examples and uses 20 as a test set.

      His rule scores 15 out of 20. He looks at the 5 misses, tweaks a threshold, reruns: 18. Tweaks again: 20 out of 20!

      :::predict Kai then tries 20 brand-new pictures he has never looked at. What do you expect?
      Probably noticeably worse than 20 out of 20. Every tweak was chosen to fix those particular test pictures, so the test set quietly became part of the design. On the fresh 20, Kai scores 16.
      :::

      The fix is a habit, not a formula. Set aside a **held-out** test set at the very start, pictures you never look at while building or tweaking, and use it once, at the end. Use the other examples as freely as you like while you work.
    bridges: []
  - id: toy-model-limits.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.toy-model-limits
    title: Write the lab note
    markdown: |-
      A good lab note says what you did, what happened, and exactly which inputs it covers. Compare three notes on our stripe detector:

      | Note | Verdict |
      | --- | --- |
      | "Stripe detection works!" | Too big: says nothing about which pictures |
      | "It's just a toy, so it shows nothing." | Too small: throws away real findings |
      | "First rule failed on the bottom-row stripe. Fixed rule labels all 16 possible 2×2 pictures correctly. Noisy grayscale pictures not tested yet." | Just right |

      :::mixup "Toy examples are too simple to teach you anything real."
      The habits you practiced here, hunting for counterexamples, deciding what to do with inputs outside the task, testing every case you can, and holding a test set back, are exactly how researchers probe huge models. Toys are where you learn to see clearly.
      :::

      Your module toolkit now fits together: representations decide what the numbers mean, features decide what the model can see, shapes keep the axes straight, seeds make runs repeatable, and a scientist's habits tell you what your results really show. Next time a small demo impresses you, yours or anyone's, do what you did here: try to break it.
    bridges: []
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - toy-model-limits.s1
        - toy-model-limits.s2
        - toy-model-limits.s3
        - toy-model-limits.s4
        - toy-model-limits.s5
        - toy-model-limits.s6
        - toy-model-limits.check
      gate_refs:
        - gate.core
  scene_aliases:
    toy-model-limits.recap: toy-model-limits.check
assessment_families:
  - id: toy-model-limits.base
    objective_ref: objective.toy-model-limits
    task: base
    response_type: single_choice
    points: 1
    hint: 'Distinguish a simulation from a trained model: trace the inputs, operation, and result before choosing.'
    remediation_scene: toy-model-limits.s2
    variants:
      - id: toy-model-limits.base.1
        prompt: A scripted token animation contains no trained weights. What should it be called?
        options:
          - id: a
            text: An illustration or simulation
          - id: b
            text: A verified live model benchmark
          - id: c
            text: A full pretraining run
        answer: a
        feedback: The label should describe the computation actually performed.
        retired: true
      - id: toy-model-limits.base.2
        prompt: Why use a tiny hand-calculated example?
        options:
          - id: b
            text: To prove all large models behave identically
          - id: c
            text: To replace every empirical test
          - id: a
            text: To expose the mechanism and check intermediate values
        answer: a
        feedback: Transparency makes a limited operation easier to understand and verify.
        retired: true
  - id: toy-model-limits.transfer
    objective_ref: objective.toy-model-limits
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Report the boundary of the claim: trace the inputs, operation, and result before choosing.'
    remediation_scene: toy-model-limits.s4
    variants:
      - id: toy-model-limits.transfer.1
        prompt: A toy gradient update is correct. What remains to test for a large training run?
        options:
          - id: b
            text: Nothing; one scalar example proves the whole pipeline
          - id: c
            text: Only the chart title
          - id: a
            text: Data, optimization, numerical, and system behavior at scale
        answer: a
        feedback: Correctness of one mechanism does not establish the full system.
        retired: true
      - id: toy-model-limits.transfer.2
        prompt: An animation and a live model output look alike. Are their evidential meanings identical?
        options:
          - id: c
            text: Only if both use color
          - id: a
            text: No; their generation procedures differ
          - id: b
            text: Yes; appearance is the only evidence
        answer: a
        feedback: Interpret a demonstration using its underlying procedure and scope.
        retired: true
  - id: toy-model-limits.base.v2
    objective_ref: objective.toy-model-limits
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: toy-model-limits.s3
    variants:
      - prompt: The rule outputs horizontal only when the top two pixels are both 1. What does it output for [0, 0, 1, 1]?
        answer: a
        options:
          - id: c
            text: No output, because the rule contains a training step.
          - id: a
            text: Vertical, incorrectly labeling a bottom-row horizontal stripe.
          - id: b
            text: Horizontal, because it inspects the bottom row first.
        feedback: The top-row condition fails, so its else branch says vertical.
        id: toy-model-limits.base.v2.1
        retired: true
      - prompt: Which observation directly refutes “the rule handles all valid horizontal stripes”?
        answer: a
        options:
          - id: a
            text: It labels a bottom-row horizontal stripe as vertical.
          - id: b
            text: It labels a top-row horizontal stripe as horizontal.
          - id: c
            text: It executes the same condition twice with the same result.
        feedback: One valid counterexample disproves that universal claim.
        id: toy-model-limits.base.v2.2
        retired: true
      - prompt: The developer wrote the stripe condition manually. What evidence would be needed to call its settings learned?
        answer: a
        options:
          - id: b
            text: A screenshot showing an output label.
          - id: c
            text: A second run with the same input.
          - id: a
            text: A training procedure that adjusted them using examples.
        feedback: Execution and learning are different processes.
        id: toy-model-limits.base.v2.3
        retired: true
      - prompt: The rule succeeds on two displayed examples. What claim does that directly support?
        answer: a
        options:
          - id: c
            text: It has learned every orientation from experience.
          - id: a
            text: It produced the expected labels on those two examples.
          - id: b
            text: It will recognize noisy photographs at the same accuracy.
        feedback: Keep the demonstrated result distinct from untested extensions.
        id: toy-model-limits.base.v2.4
        retired: true
  - id: toy-model-limits.transfer.v2
    objective_ref: objective.toy-model-limits
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: toy-model-limits.s5
    variants:
      - prompt: You repeatedly change a rule after inspecting its test cases. How should you evaluate the resulting choices?
        answer: a
        options:
          - id: c
            text: Measure only the cases that motivated the last repair.
          - id: a
            text: Use a separate final set not used to make those changes.
          - id: b
            text: Call the inspected cases unseen because no weight optimizer ran.
        feedback: Manual selection can also adapt to evaluation examples.
        id: toy-model-limits.transfer.v2.1
        retired: true
      - prompt: A blank image is neither a horizontal nor a vertical stripe. What should be settled before scoring the rule on it?
        answer: a
        options:
          - id: a
            text: The task’s expected behavior for inputs outside the two stripe classes.
          - id: b
            text: Which seed makes the existing two-class answer appear random.
          - id: c
            text: How to relabel the blank image after seeing the output.
        feedback: Specify valid inputs and desired handling before judging the response.
        id: toy-model-limits.transfer.v2.2
        retired: true
      - prompt: An ideal four-worker calculation omits communication. Can it establish actual GPU runtime?
        answer: a
        options:
          - id: b
            text: Yes; an ideal estimate is a measurement of every device.
          - id: c
            text: Yes; worker count specifies all data-transfer costs.
          - id: a
            text: No; it isolates a mechanism and omits costs that affect runtime.
        feedback: An informative simplification is not a measurement of the omitted system.
        id: toy-model-limits.transfer.v2.3
        retired: true
      - prompt: You replace the hand-written rule with a trained model. Which comparison better tests whether it improved?
        answer: a
        options:
          - id: c
            text: Compare the old rule’s hard cases with the new model’s training examples.
          - id: a
            text: Evaluate both on the same stated task and reserved cases.
          - id: b
            text: Count only the number of adjustable parameters in each system.
        feedback: A shared evaluation supports a performance comparison; size alone does not.
        id: toy-model-limits.transfer.v2.4
        retired: true
  - id: toy-model-limits.base.v3
    objective_ref: objective.toy-model-limits
    task: base
    response_type: single_choice
    points: 1
    hint: Trace the rule on the exact picture, reading the four values as [top-left, top-right, bottom-left, bottom-right]. One input that breaks a claim outweighs any number that fit it.
    remediation_scene: toy-model-limits.s3
    variants:
      - id: toy-model-limits.base.v3.1
        prompt: 'The first rule says: "If both top pixels are white, say horizontal; otherwise say vertical." What does it say for [0, 0, 1, 1]?'
        options:
          - id: a
            text: Horizontal, since the picture has a full white row
          - id: b
            text: Vertical, which is wrong for this bottom-row stripe
          - id: c
            text: Neither, since the rule finds no white pixels on top
        answer: b
        feedback: The top two values are 0 and 0, so the condition fails and the rule falls through to "vertical." A person sees a full white row, but the rule only ever checks the top one, and it has no "neither" option.
      - id: toy-model-limits.base.v3.2
        prompt: Which observation disproves the claim "the first rule labels every horizontal stripe correctly"?
        options:
          - id: a
            text: It calls the top-row stripe horizontal every time it runs
          - id: b
            text: It calls the blank picture vertical, which isn't a stripe
          - id: c
            text: It calls the bottom-row stripe vertical instead of horizontal
        answer: c
        feedback: The bottom-row stripe is a horizontal stripe that the rule gets wrong, a counterexample to the claim. Repeated successes on the top-row stripe can't prove it, and the blank picture isn't a horizontal stripe, so it doesn't bear on this claim.
      - id: toy-model-limits.base.v3.3
        prompt: How many different 2-by-2 black-and-white pictures are there in total?
        options:
          - id: a
            text: '16'
          - id: b
            text: '8'
          - id: c
            text: '4'
        answer: a
        feedback: Each of the 4 pixels is black or white, so 2 × 2 × 2 × 2 = 16. Four is the number of stripes among them, and 8 comes from 2 × 4, adding choices instead of multiplying.
      - id: toy-model-limits.base.v3.4
        prompt: What does the first rule say for the right-column stripe [0, 1, 0, 1]?
        options:
          - id: b
            text: Horizontal, since the top-right pixel is white
          - id: c
            text: Vertical, which is the wrong label for this stripe
          - id: a
            text: Vertical, which happens to be the right label
        answer: a
        feedback: The top two values are 0 and 1, not both 1, so the rule says vertical, and a white right column really is vertical. The rule reaches the right answer here without ever checking the columns.
      - id: toy-model-limits.base.v3.5
        prompt: The fixed rule has been run on all 16 possible 2-by-2 pictures and labels every one as intended. Which statement is accurate?
        options:
          - id: c
            text: It has learned what stripes look like from these examples
          - id: a
            text: It is correct on every possible 2-by-2 black-and-white picture
          - id: b
            text: It will label stripes in noisy photos just as accurately
        answer: a
        feedback: Testing all 16 inputs covers the whole tiny world, so the claim is fully checked there. The rule was written by hand, so nothing was learned, and noisy photos are a different set of inputs that still need their own test.
  - id: toy-model-limits.transfer.v3
    objective_ref: objective.toy-model-limits
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what was actually tested. Was the test set used to make changes? Did anyone look for a counterexample? And does the claim stay inside the inputs that were checked?
    remediation_scene: toy-model-limits.s5
    variants:
      - id: toy-model-limits.transfer.v3.1
        prompt: You tweak a spam rule, over and over, until it catches all 50 emails in your test set. What should you do before telling anyone it works?
        options:
          - id: a
            text: Run it on the same 50 again to confirm the perfect score
          - id: b
            text: Try it on fresh emails you never looked at while tweaking
          - id: c
            text: Add words from the 50 emails to its list of spam words
        answer: b
        feedback: Each tweak was chosen to fix those 50, so they became part of the design. Only emails held back from the tweaking show how the rule does on mail it hasn't been fitted to. Rerunning the same 50 will just repeat the same score.
      - id: toy-model-limits.transfer.v3.2
        prompt: A classmate claims "every prime number is odd." Which single example settles the question?
        options:
          - id: c
            text: 3, 5, and 7, which are all prime and all odd
          - id: a
            text: 2, which is prime and even
          - id: b
            text: 9, which is odd but not prime
        answer: a
        feedback: One counterexample, 2, disproves the claim for good. Any number of odd primes only fit it, and 9 isn't prime, so it says nothing about primes.
      - id: toy-model-limits.transfer.v3.3
        prompt: A route planner finds the shortest trip through 3 cities by trying every possible order. A teammate wants to use the same method for 30 cities. What is the main concern?
        options:
          - id: b
            text: None, since the method gave the right answer on 3 cities
          - id: c
            text: The method stays equally fast, since each order is quick
          - id: a
            text: The number of orders grows far too fast to try them all
        answer: a
        feedback: Each extra city multiplies the orders to check, just as each level multiplied the search tree, so 30 cities is hopeless by brute force. The toy showed the method is correct, not that it is affordable at scale.
      - id: toy-model-limits.transfer.v3.4
        prompt: A cat-or-dog photo classifier is shown a photo of a toaster. Before scoring its answer, what should be settled?
        options:
          - id: a
            text: What the task says to do with pictures that are neither
          - id: b
            text: Whether a toaster looks more like a cat or like a dog
          - id: c
            text: How to relabel the toaster after seeing the model's answer
        answer: a
        feedback: The task has to say how to handle inputs outside its classes, as the stripe lab added "neither," before any answer can be called right or wrong. Deciding afterward, from the model's answer, bends the test to fit the result.
      - id: toy-model-limits.transfer.v3.5
        prompt: Which lab note about the stripe detector is most useful?
        options:
          - id: c
            text: '"Stripe detection works! Ready for photos."'
          - id: b
            text: '"Just a toy example, so it shows us nothing."'
          - id: a
            text: '"Right on all 16 clean 2×2 pictures; noisy ones untested."'
        answer: a
        feedback: A useful note says what was shown and on which inputs, and names the next test. "Ready for photos" claims far more than was tested, while "shows nothing" throws away a result that was fully checked.
      - id: toy-model-limits.transfer.v3.6
        prompt: The ideal serial-plus-parallel calculation predicts a 2.5 times speedup with 4 workers. Measured on a real machine, it's 2.1 times. What is the best reading?
        options:
          - id: b
            text: The calculation was wrong, so it should be thrown out
          - id: a
            text: The calculation explains most of it; measure what's missing
          - id: c
            text: The machine must be faulty, since it should reach 2.5
        answer: a
        feedback: The simple model left out costs like communication and waiting, so real results fall a little short. It still predicted most of the speedup; the gap tells you what to profile next.
