schema_version: 0.2-draft
lesson:
  id: toy-model-limits
  version: 0.1.0-draft
  title: What a demonstration proves—and what it leaves open
  state: draft
  summary: A toy experiment isolates a mechanism; transferring its result to a full system requires checking data,
    scale, assumptions, and evaluation conditions.
  slot: M02.8
  category: learning
  minutes: 12
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.toy-model-limits
  version: 1-draft
  statement: A toy experiment isolates a mechanism; transferring its result to a full system requires checking data,
    scale, assumptions, and evaluation conditions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - toy-model-limits.base
  - toy-model-limits.transfer
  prerequisites:
  - anyOf:
    - objective.algorithms-and-programs
  - anyOf:
    - objective.randomness-reproducibility
scenes:
- id: toy-model-limits.s1
  title: Simplify to make a mechanism visible
  type: explanation
  depth: intuition
  objective_refs:
  - objective.toy-model-limits
  markdown: A two-weight network lets you calculate a forward pass by hand. A three-token attention example lets
    you inspect every score and mixture. These simplifications are valuable because the computation is transparent.
    They omit aspects such as realistic data diversity, large-model optimization, and production scheduling.
  text_mode: A two-weight network lets you calculate a forward pass by hand. A three-token attention example lets
    you inspect every score and mixture. These simplifications are valuable because the computation is transparent.
    They omit aspects such as realistic data diversity, large-model optimization, and production scheduling.
  bridges: []
- id: toy-model-limits.s2
  title: Distinguish a simulation from a trained model
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.toy-model-limits
  markdown: A scripted image gradually clearing noise can illustrate denoising without containing a learned denoiser.
    A recorded model output shows one actual run, while a live model call performs inference now. Label these cases
    explicitly. Similar-looking animations can represent very different evidence.
  text_mode: A scripted image gradually clearing noise can illustrate denoising without containing a learned denoiser.
    A recorded model output shows one actual run, while a live model call performs inference now. Label these cases
    explicitly. Similar-looking animations can represent very different evidence.
  bridges: []
- id: toy-model-limits.s3
  title: Design a transfer check
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.toy-model-limits
  markdown: After observing scalar gradient descent, try a new input and learning rate, then predict the update
    before running it. After inspecting attention, change the mask and explain the new weights. These checks test
    the taught operation. They still do not establish performance on all real models.
  text_mode: After observing scalar gradient descent, try a new input and learning rate, then predict the update
    before running it. After inspecting attention, change the mask and explain the new weights. These checks test
    the taught operation. They still do not establish performance on all real models.
  bridges: []
- id: toy-model-limits.s4
  title: Report the boundary of the claim
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.toy-model-limits
  markdown: A numerical demonstration can validate an equation implementation within tested inputs. A benchmark
    can estimate task performance under a data and evaluation protocol. A deployment trial adds operational conditions.
    Say which level your evidence addresses and what additional observations would be needed for a broader claim.
  text_mode: A numerical demonstration can validate an equation implementation within tested inputs. A benchmark
    can estimate task performance under a data and evaluation protocol. A deployment trial adds operational conditions.
    Say which level your evidence addresses and what additional observations would be needed for a broader claim.
  bridges: []
- id: toy-model-limits.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.toy-model-limits
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: toy-model-limits.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.toy-model-limits
  markdown: A toy experiment isolates a mechanism; transferring its result to a full system requires checking data,
    scale, assumptions, and evaluation conditions.
  text_mode: A toy experiment isolates a mechanism; transferring its result to a full system requires checking data,
    scale, assumptions, and evaluation conditions.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - toy-model-limits.s1
    - toy-model-limits.s2
    - toy-model-limits.s3
    - toy-model-limits.s4
    - toy-model-limits.check
    - toy-model-limits.recap
    gate_refs:
    - gate.core
assessment_families:
- id: toy-model-limits.base
  objective_ref: objective.toy-model-limits
  task: base
  response_type: single_choice
  points: 1
  hint: 'Distinguish a simulation from a trained model: trace the inputs, operation, and result before choosing.'
  remediation_scene: toy-model-limits.s2
  variants:
  - id: toy-model-limits.base.1
    prompt: A scripted token animation contains no trained weights. What should it be called?
    options:
    - id: a
      text: An illustration or simulation
    - id: b
      text: A verified live model benchmark
    - id: c
      text: A full pretraining run
    answer: a
    feedback: The label should describe the computation actually performed.
  - id: toy-model-limits.base.2
    prompt: Why use a tiny hand-calculated example?
    options:
    - id: b
      text: To prove all large models behave identically
    - id: c
      text: To replace every empirical test
    - id: a
      text: To expose the mechanism and check intermediate values
    answer: a
    feedback: Transparency makes a limited operation easier to understand and verify.
- id: toy-model-limits.transfer
  objective_ref: objective.toy-model-limits
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Report the boundary of the claim: trace the inputs, operation, and result before choosing.'
  remediation_scene: toy-model-limits.s4
  variants:
  - id: toy-model-limits.transfer.1
    prompt: A toy gradient update is correct. What remains to test for a large training run?
    options:
    - id: b
      text: Nothing; one scalar example proves the whole pipeline
    - id: c
      text: Only the chart title
    - id: a
      text: Data, optimization, numerical, and system behavior at scale
    answer: a
    feedback: Correctness of one mechanism does not establish the full system.
  - id: toy-model-limits.transfer.2
    prompt: An animation and a live model output look alike. Are their evidential meanings identical?
    options:
    - id: c
      text: Only if both use color
    - id: a
      text: No; their generation procedures differ
    - id: b
      text: Yes; appearance is the only evidence
    answer: a
    feedback: Interpret a demonstration using its underlying procedure and scope.
