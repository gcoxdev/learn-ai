          - id: a
            text: Compute each weighted mixture before the output projection.
          - id: c
            text: Use the weights themselves as head outputs.
        feedback: 'Head A: 0.75 × 0 + 0.25 × 4 = 1. Head B: 0.25 × 0 + 0.75 × 4 = 3. Then y = 2 × 1 − 3 = −1. Averaging the heads first would throw away the separate slots that the projection reads.'
