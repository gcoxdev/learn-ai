assessment_families:
- id: multi-head-attention.base
  objective_ref: objective.multi-head-attention
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace the score dimensions: trace the inputs, operation, and result before choosing.'
  remediation_scene: multi-head-attention.s2
  variants:
  - id: multi-head-attention.base.1
    prompt: B = 1, H = 4, T = 5. Standard self-attention scores have which shape?
    options:
    - id: c
      text: '[4, 4]'
    - id: a
      text: '[1, 4, 5, 5]'
    - id: b
      text: '[1, 5, 4]'
    answer: a
    feedback: Each head has one score for every query-key position pair.
    retired: true
  - id: multi-head-attention.base.2
    prompt: Three heads each output two value coordinates. Concatenated width?
    options:
    - id: a
      text: '6'
    - id: b
      text: '3'
    - id: c
      text: '2'
    answer: a
    feedback: Head outputs are joined across the feature dimension.
    retired: true
- id: multi-head-attention.transfer
  objective_ref: objective.multi-head-attention
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'State which design is being traced: trace the inputs, operation, and result before choosing.'
  remediation_scene: multi-head-attention.s4
  variants:
  - id: multi-head-attention.transfer.1
    prompt: Does one head necessarily mean one stable human-interpretable specialty?
    options:
    - id: a
      text: 'No'
    - id: b
      text: Yes; every head is assigned a named task
    - id: c
      text: Only in a decoder
    answer: a
    feedback: Head roles emerge from learning and can be distributed or context-dependent.
    retired: true
  - id: multi-head-attention.transfer.2
    prompt: Why inspect the output projection after concatenation?
    options:
    - id: b
      text: It is always the final vocabulary probability
    - id: c
      text: It deletes every query token
    - id: a
      text: It mixes head contributions into the model representation
    answer: a
    feedback: The attention result still passes through a learned transformation.
    retired: true
- id: multi-head-attention.base.v2
  objective_ref: objective.multi-head-attention
  task: base
  response_type: numeric_fields_with_reason
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: multi-head-attention.s3
  variants:
  - prompt: Two scalar values are 4 and 8. Head A uses weights [0.75,0.25]; head B uses [0.25,0.75]. Record hA,
      hB, and y=2hA−hB.
    answers:
      a: 5.0
      b: 7.0
      y: 3.0
    reason_answer: a
    reason_options:
    - id: c
      text: Use the weights themselves as head outputs.
    - id: b
      text: Average both head outputs before applying the projection.
    - id: a
      text: Compute each weighted mixture before the output projection.
    feedback: Heads mix values separately; the output rule then combines the resulting two entries.
    id: multi-head-attention.base.v2.1
  - prompt: Two scalar values are 0 and 4. Head A uses weights [0.75,0.25]; head B uses [0.25,0.75]. Record hA,
      hB, and y=2hA−hB.
    answers:
      a: 1.0
      b: 3.0
      y: -1.0
    reason_answer: a
    reason_options:
    - id: b
      text: Average both head outputs before applying the projection.
    - id: a
      text: Compute each weighted mixture before the output projection.
    - id: c
      text: Use the weights themselves as head outputs.
    feedback: Heads mix values separately; the output rule then combines the resulting two entries.
    id: multi-head-attention.base.v2.2
  - prompt: Two scalar values are 2 and 10. Head A uses weights [0.75,0.25]; head B uses [0.25,0.75]. Record hA,
      hB, and y=2hA−hB.
    answers:
      a: 4.0
      b: 8.0
      y: 0.0
    reason_answer: a
    reason_options:
    - id: b
      text: Average both head outputs before applying the projection.
    - id: a
      text: Compute each weighted mixture before the output projection.
    - id: c
      text: Use the weights themselves as head outputs.
    feedback: Heads mix values separately; the output rule then combines the resulting two entries.
    id: multi-head-attention.base.v2.3
  - prompt: Two scalar values are 6 and 2. Head A uses weights [0.75,0.25]; head B uses [0.25,0.75]. Record hA,
      hB, and y=2hA−hB.
    answers:
      a: 5.0
      b: 3.0
      y: 7.0
    reason_answer: a
    reason_options:
    - id: a
      text: Compute each weighted mixture before the output projection.
    - id: b
      text: Average both head outputs before applying the projection.
    - id: c
      text: Use the weights themselves as head outputs.
    feedback: Heads mix values separately; the output rule then combines the resulting two entries.
    id: multi-head-attention.base.v2.4
  numeric_fields:
  - id: a
    label: Head A output
  - id: b
    label: Head B output
  - id: y
    label: Projected output
  absolute_tolerance: 1.0e-06
- id: multi-head-attention.transfer.v2
  objective_ref: objective.multi-head-attention
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: multi-head-attention.s3
  variants:
  - prompt: Four heads each produce a two-entry vector. How long is the concatenated vector?
    answer: a
    options:
    - id: a
      text: 8 entries
    - id: c
      text: 2 entries
    - id: b
      text: 4 entries
    feedback: 'Concatenation keeps all entries: four times two equals eight.'
    id: multi-head-attention.transfer.v2.1
  - prompt: One head favors nearby words on one sentence. What does this observation establish?
    answer: a
    options:
    - id: c
      text: A complete causal explanation of the output
    - id: a
      text: Its attention pattern on that example
    - id: b
      text: A permanent grammar-only role for that head
    feedback: A stable functional claim needs broader evidence and controlled investigation.
    id: multi-head-attention.transfer.v2.2
  - prompt: A causal model masks future positions in three heads but not the fourth. What should be checked?
    answer: a
    options:
    - id: c
      text: Whether reducing the unmasked head’s output weight removes leakage
    - id: a
      text: Whether the fourth head leaks future-token information
    - id: b
      text: Whether averaging the four masks would preserve the causal rule
    feedback: Every information route must respect the intended causal boundary.
    id: multi-head-attention.transfer.v2.3
  - prompt: Why include a learned output projection after concatenation?
    answer: a
    options:
    - id: c
      text: To normalize every head’s attention weights using one shared softmax
    - id: b
      text: To turn each head into a separate full language model
    - id: a
      text: To combine the separate head representations into the next representation
    feedback: The projection mixes head information numerically; semantic roles are not prescribed.
    id: multi-head-attention.transfer.v2.4
