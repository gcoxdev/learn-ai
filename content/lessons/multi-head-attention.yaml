schema_version: 0.2-draft
lesson:
  id: multi-head-attention
  version: 0.4.0-draft
  title: Run several learned comparisons in parallel
  state: draft
  summary: GPT-2 small splits every attention layer into 12 heads of 64 numbers each. Trace the split, the concat, and the output projection, and count the 2.4 million weights involved.
  slot: M15.4
  category: learning
  sources:
    - title: "Attention Is All You Need, section 3.2.2 (Vaswani et al., 2017)"
      url: https://arxiv.org/abs/1706.03762
    - title: "Language Models are Unsupervised Multitask Learners (GPT-2; Radford et al., 2019)"
      url: https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf
    - title: "What Does BERT Look At? An Analysis of BERT's Attention (Clark et al., 2019)"
      url: https://arxiv.org/abs/1906.04341
    - title: "Are Sixteen Heads Really Better than One? (Michel, Levy & Neubig, 2019)"
      url: https://arxiv.org/abs/1905.10650
  archetype: mechanism
objectives:
  - id: objective.multi-head-attention
    version: 3-draft
    statement: Compute per-head attention outputs, concatenate them, and apply the output projection; track head width (d_model = h·d_head) and projection parameters (4·d_model²) without treating heads as guaranteed named specialists.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - multi-head-attention.base.v2
      - multi-head-attention.transfer.v3
    prerequisites:
      - anyOf:
          - objective.attention
      - anyOf:
          - objective.softmax-attention
      - anyOf:
          - objective.matrices-tensors
scenes:
  - id: multi-head-attention.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.multi-head-attention
    title: One blend can't look two ways at once
    markdown: |-
      In "The keys to the old cabinet are on the table", the verb "are" has to agree with "keys", five words back, not with the nearer "cabinet". It would also help "are" to know what comes right before it.

      One attention layer, as you've built it so far, gives each token exactly one row of weights: one blend. If "are" puts 0.9 on "keys", only 0.1 is left for everything else. Looking for the subject and looking at the neighbor compete for the same weights.

      The fix is to run several attention computations side by side. Each one is called a **head**, and each has its own $W_Q$, $W_K$, and $W_V$, so it makes its own queries, keys, values, scores, and blend. Together they form **multi-head attention**. One head can put most of its weight on "keys" while another looks at "cabinet". The transformer paper used 8 heads per layer; GPT-2 small uses 12.
    bridges: []
  - id: multi-head-attention.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.multi-head-attention
    title: Two heads, two blends
    markdown: |-
      Shrink it to numbers. Two earlier positions offer values 2 and 6 (single numbers, to keep the arithmetic visible). Each head has already turned its scores into softmax weights:

      | | Weights | Blend | Output |
      | --- | --- | --- | --- |
      | Head A | [0.75, 0.25] | $0.75 \times 2 + 0.25 \times 6$ | $h_A = 3$ |
      | Head B | [0.25, 0.75] | $0.25 \times 2 + 0.75 \times 6$ | $h_B = 5$ |

      Same inputs, two different answers, because each head scored the positions its own way. In a real model the heads would also have different value vectors, since each head has its own $W_V$; sharing them here isolates the effect of the weights.
    bridges:
      - attention
      - softmax-attention
  - id: multi-head-attention.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multi-head-attention
    title: Split the width, don't multiply it
    markdown: |-
      Doesn't running 12 heads cost 12 times as much? No, because the heads *share out* the model's width. If each token's vector has $d_{\text{model}}$ numbers and there are $h$ heads, each head works in $d_{\text{head}} = d_{\text{model}} / h$ dimensions:

      $$d_{\text{model}} = h \cdot d_{\text{head}} \qquad \text{GPT-2 small: } 768 = 12 \times 64$$

      In practice the model multiplies by one $768 \times 768$ matrix $W_Q$ and cuts the result into 12 slices of 64 columns, one per head. Follow 5 tokens through a GPT-2-small-sized layer:

      | Step | Shape |
      | --- | --- |
      | Token vectors $X$ | (5, 768) |
      | $Q = XW_Q$, cut into heads (same for $K$, $V$) | (12, 5, 64) |
      | Scores, one $5 \times 5$ grid per head | (12, 5, 5) |
      | Weights times values | (12, 5, 64) |
      | Concatenate the heads | (5, 768) |
      | Multiply by $W_O$ | (5, 768) |

      ```python run
      import numpy as np

      T, d_model, h = 5, 768, 12             # 5 tokens, GPT-2-small width, 12 heads
      d_head = d_model // h                  # 64 numbers per head
      rng = np.random.default_rng(0)
      X = rng.standard_normal((T, d_model))
      W_Q, W_K, W_V, W_O = (0.02 * rng.standard_normal((d_model, d_model)) for _ in range(4))

      def split(M):                          # (T, d_model) -> (h, T, d_head)
          return M.reshape(T, h, d_head).transpose(1, 0, 2)

      Q, K, V = split(X @ W_Q), split(X @ W_K), split(X @ W_V)
      print("X", X.shape, "-> Q split into heads", Q.shape)
      scores = Q @ K.transpose(0, 2, 1) / np.sqrt(d_head)
      print("scores, one T x T grid per head", scores.shape)
      scores[:, np.triu(np.ones((T, T), dtype=bool), k=1)] = -np.inf   # causal mask
      w = np.exp(scores - scores.max(axis=-1, keepdims=True))
      w /= w.sum(axis=-1, keepdims=True)
      heads = w @ V
      print("head outputs", heads.shape)
      concat = heads.transpose(1, 0, 2).reshape(T, d_model)
      print("concatenated", concat.shape, "-> after W_O", (concat @ W_O).shape)
      print("Q/K/V/O weights:", 4 * d_model * d_model)
      ```

      Change `h` to 24 or 6 and rerun. The head width changes (32 or 128), but the input and output shapes don't. Notice that the scaling now uses $\sqrt{d_{\text{head}}} = 8$, and that every head gets the same causal mask.
    diagram:
      caption: Multi-head attention splits the width into heads, runs them in parallel, then joins and mixes them.
      description: Token vectors of shape T by 768 are split into 12 heads, each with its own query, key, and value slices of width 64. Head 1, head 2, and so on through head 12 each produce a T by 64 output. The outputs are concatenated back to T by 768, then multiplied by the 768 by 768 output projection W_O to give the layer's output, also T by 768.
      nodes:
