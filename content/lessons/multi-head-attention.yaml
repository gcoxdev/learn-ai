schema_version: 0.2-draft
lesson:
  id: multi-head-attention
  version: 0.2.0-draft
  title: Run several learned comparisons in parallel
  state: draft
  summary: Let two small attention heads inspect the same context, then trace how their different mixtures meet.
  slot: M15.4
  category: learning
  sources:
  - title: Vaswani et al. — Attention Is All You Need
    url: https://arxiv.org/abs/1706.03762
  archetype: mechanism
objectives:
- id: objective.multi-head-attention
  version: 2-draft
  statement: Compute two attention-head outputs, concatenate them, and apply a stated output projection without
    treating heads as guaranteed named specialists.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - multi-head-attention.base.v2
  - multi-head-attention.transfer.v2
  prerequisites:
  - anyOf:
    - objective.attention
  - anyOf:
    - objective.softmax-attention
  - anyOf:
    - objective.matrices-tensors
scenes:
- id: multi-head-attention.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.multi-head-attention
  title: One question can need several kinds of clues
  markdown: In “The key beside the boxes is rusty,” choosing “is” involves the singular key, while interpreting
    rusty concerns a property of the described object. An attention layer can form several learned views of the
    same token representations. A **head** has its own query, key, and value projections. A projection here is a
    learned numerical transformation. Multiple heads allow different mixtures of information, but the architecture
    does not label one head “grammar” and another “meaning.”
  text_mode: In “The key beside the boxes is rusty,” choosing “is” involves the singular key, while interpreting
    rusty concerns a property of the described object. An attention layer can form several learned views of the
    same token representations. A **head** has its own query, key, and value projections. A projection here is a
    learned numerical transformation. Multiple heads allow different mixtures of information, but the architecture
    does not label one head “grammar” and another “meaning.”
  bridges: []
- id: multi-head-attention.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.multi-head-attention
  title: Rehearse one mixture before adding another
  markdown: An attention head compares a query with keys, turns allowed scores into weights, and takes a weighted
    sum of value vectors. For two positions with scalar values 2 and 6, weights [0.75,0.25] give 0.75×2+0.25×6=3.
    The weights sum to one in this softmax example. The values being mixed are transformed representations, not
    raw word IDs. Keep the distinction between the match scores, normalized weights, and the content vectors.
  text_mode: An attention head compares a query with keys, turns allowed scores into weights, and takes a weighted
    sum of value vectors. For two positions with scalar values 2 and 6, weights [0.75,0.25] give 0.75×2+0.25×6=3.
    The weights sum to one in this softmax example. The values being mixed are transformed representations, not
    raw word IDs. Keep the distinction between the match scores, normalized weights, and the content vectors.
  bridges:
  - attention
  - softmax-attention
- id: multi-head-attention.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multi-head-attention
  title: A second head can form a different view
  markdown: For a transparent fixture, give head B the same scalar values 2 and 6 but weights [0.25,0.75]. Its output
    is 0.25×2+0.75×6=5. Real heads generally also have different value projections; sharing the values here isolates
    the effect of different weights. The two outputs are 3 and 5. They need not agree because they are distinct
    learned calculations. Inspecting one example is not enough to assign either head a permanent semantic role.
  text_mode: For a transparent fixture, give head B the same scalar values 2 and 6 but weights [0.25,0.75]. Its
    output is 0.25×2+0.75×6=5. Real heads generally also have different value projections; sharing the values here
    isolates the effect of different weights. The two outputs are 3 and 5. They need not agree because they are
    distinct learned calculations. Inspecting one example is not enough to assign either head a permanent semantic
    role.
  bridges: []
- id: multi-head-attention.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multi-head-attention
  title: Join first, then mix across heads
  markdown: '**Concatenation** places outputs next to one another: [3] joined with [5] becomes [3,5]. It is not
    their sum or average. An **output projection** then combines this joined representation. If its stated toy rule
    is y=2hA−hB, the output is 2×3−5=1. In a transformer this projection usually produces a vector of the model’s
    chosen width. Its learned weights determine how head information contributes to the next stage.'
  text_mode: '**Concatenation** places outputs next to one another: [3] joined with [5] becomes [3,5]. It is not
    their sum or average. An **output projection** then combines this joined representation. If its stated toy rule
    is y=2hA−hB, the output is 2×3−5=1. In a transformer this projection usually produces a vector of the model’s
    chosen width. Its learned weights determine how head information contributes to the next stage.'
  bridges:
  - vectors
  - matrices-tensors
- id: multi-head-attention.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.multi-head-attention
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Each head makes its own weighted mixture. Join the results and project them; different views are learned,
    not assigned job titles.
- id: multi-head-attention.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.multi-head-attention
  markdown: Multi-head attention uses separate projections to create several attention mixtures, then combines their
    outputs; explicit tensor shapes prevent confusing heads, positions, and features.
  text_mode: Multi-head attention uses separate projections to create several attention mixtures, then combines
    their outputs; explicit tensor shapes prevent confusing heads, positions, and features.
- id: multi-head-attention.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multi-head-attention
  title: Keep track of sizes and masks
  markdown: Suppose four heads each output a length-two vector. Concatenating them gives eight entries before output
    projection. Four heads do not mean four independently generated answer tokens. Each head must also obey the
    allowed attention pattern. In causal language modeling, a position cannot use future-token information through
    any head. A mask that restricts one head while leaving another unrestricted can undermine the intended prediction
    task.
  text_mode: Suppose four heads each output a length-two vector. Concatenating them gives eight entries before output
    projection. Four heads do not mean four independently generated answer tokens. Each head must also obey the
    allowed attention pattern. In causal language modeling, a position cannot use future-token information through
    any head. A mask that restricts one head while leaving another unrestricted can undermine the intended prediction
    task.
  bridges: []
- id: multi-head-attention.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multi-head-attention
  title: Test a claim about a head rather than naming it
  markdown: You might observe that one head often attends to nearby words. To investigate its role, inspect varied
    examples and compare behavior when changing or removing it under a controlled procedure. Attention weights alone
    are not a complete explanation of the model’s decision; other heads, values, projections, and later layers also
    contribute. Remember “separate views, join, mix.” The calculation is precise even when a neat human story about
    each head is not justified.
  text_mode: You might observe that one head often attends to nearby words. To investigate its role, inspect varied
    examples and compare behavior when changing or removing it under a controlled procedure. Attention weights alone
    are not a complete explanation of the model’s decision; other heads, values, projections, and later layers also
    contribute. Remember “separate views, join, mix.” The calculation is precise even when a neat human story about
    each head is not justified.
  bridges: []
- id: multi-head-attention.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.multi-head-attention
  title: Joining is not averaging
  markdown: Head A outputs [3] and head B outputs [5]. What is their concatenation before the output projection?
  text_mode: Head A outputs [3] and head B outputs [5]. What is their concatenation before the output projection?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: '[3,5]'
    - id: b
      text: '[4]'
    - id: c
      text: '[8]'
    answer: a
    reveal_markdown: Concatenation preserves both entries in a longer vector. Averaging or summing is a different
      operation.
    hint: Trace the example using the rule from the preceding pages.
    id: multi-head-attention.practice.v2.7
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - multi-head-attention.s1
    - multi-head-attention.s2
    - multi-head-attention.s3
    - multi-head-attention.s4
    - multi-head-attention.s5
    - multi-head-attention.s6
    - multi-head-attention.s7
    - multi-head-attention.check
    gate_refs:
    - gate.core
  scene_aliases:
