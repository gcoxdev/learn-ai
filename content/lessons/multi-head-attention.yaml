        - id: h2
          label: Head 2
          note: T × 64 out
          col: 2
          row: 1
        - id: hn
          label: … Head 12
          note: T × 64 out
          col: 2
          row: 2
        - id: concat
          label: Concatenate
          note: T × 768
          col: 3
          row: 1
          tone: accent
        - id: wo
          label: Output projection W_O
          note: 768 × 768, mixes across heads
          col: 4
          row: 1
          tone: accent
        - id: out
          label: Output
          note: T × 768
          col: 5
          row: 1
          tone: data
      edges:
        - from: x
          to: h1
          label: 64 dims
        - from: x
          to: h2
          label: 64 dims
        - from: x
          to: hn
          label: 64 dims
        - from: h1
          to: concat
        - from: h2
          to: concat
        - from: hn
          to: concat
        - from: concat
          to: wo
        - from: wo
          to: out
    bridges:
      - matrices-tensors
  - id: multi-head-attention.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multi-head-attention
    title: Join first, then mix across heads
    markdown: |-
      Back to heads A and B. **Concatenation** places their outputs side by side: $[3]$ joined with $[5]$ is $[3, 5]$, a longer vector, not a sum or an average. After concatenation, each head's numbers still sit in their own slots, untouched by the others.

      The **output projection** $W_O$ is a learned matrix that mixes those slots, so information from different heads finally combines. Give it a toy rule, $y = 2h_A - h_B$: the output is $2 \times 3 - 5 = 1$.

      :::papers Multi-head attention
      $$\text{MultiHead}(X) = \text{Concat}(\text{head}_1, \dots, \text{head}_h)\, W_O, \qquad \text{head}_i = \text{Attention}(X W_Q^{(i)},\ X W_K^{(i)},\ X W_V^{(i)})$$

      $W_Q^{(i)}$ is the $i$-th 64-column slice of the big $W_Q$. Each $\text{head}_i$ is the full scaled, masked softmax from the last lesson. In our toy, $\text{head}_1 = 3$, $\text{head}_2 = 5$, the concat is $[3, 5]$, and $W_O = \begin{bmatrix} 2 \\ -1 \end{bmatrix}$ gives 1.
      :::

      :::predict Head A's weights change to [0.5, 0.5]. What is y?
      $h_A = 0.5 \times 2 + 0.5 \times 6 = 4$, so $y = 2 \times 4 - 5 = 3$. Head B didn't change, but the final output did, because $W_O$ reads both slots.
      :::
    bridges:
      - vectors
      - matrices-tensors
  - id: multi-head-attention.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multi-head-attention
    title: Count the weights
    markdown: |-
      An attention layer has four square matrices: $W_Q$, $W_K$, $W_V$, and $W_O$, each $d_{\text{model}} \times d_{\text{model}}$. So it holds

      $$4 \cdot d_{\text{model}}^2 \text{ weights} \qquad \text{GPT-2 small: } 4 \times 768^2 = 4 \times 589{,}824 = 2{,}359{,}296$$

      plus small bias vectors if the model uses them (GPT-2 does: $4 \times 768 = 3{,}072$ more). Across 12 layers that's about 28 million weights, a bit under a quarter of GPT-2 small's 124 million. The lesson on the full transformer block accounts for the rest.

      :::predict Keep d_model = 768 but use 24 heads of 32 instead of 12 heads of 64. How many Q/K/V/O weights now?
      Still 2,359,296. The heads split the same matrices into thinner slices, so $h$ doesn't appear in the count. What changes is the attention grid: 24 score grids per layer instead of 12.
      :::
  - id: multi-head-attention.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multi-head-attention
    title: What are the heads doing?
    markdown: |-
      Nobody assigns heads their jobs; each one learns whatever helps reduce the loss. Some heads do end up with readable habits. Clark and colleagues (2019) found heads in BERT that attend to the previous token, to the next token, or from a direct object back to its verb with striking accuracy.

      :::mixup "Each head is a specialist: one for grammar, one for meaning, one for names."
      Many heads have no tidy label. Michel, Levy, and Neubig (2019) removed heads from trained models and found that many could go with only a small drop in accuracy. A head's pattern on one sentence is a clue, not a job title. To test a claim like "head 5 tracks subjects", check many sentences, then switch the head off and see which outputs change.
      :::

      So picture multi-head attention as "several blends, then a mix": split the width into heads, let each blend its own way, concatenate, and let $W_O$ combine them.
    bridges: []
  - id: multi-head-attention.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.multi-head-attention
    title: Joining is not averaging
    markdown: Head A outputs [3] and head B outputs [5]. What is their concatenation before the output projection?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: '[3,5]'
        - id: b
          text: '[4]'
        - id: c
          text: '[8]'
      answer: a
      reveal_markdown: |-
        Concatenation sets the two outputs side by side, so both numbers survive: [3, 5]. [4] would be their average and [8] their sum. Mixing across heads is the output projection's job, which comes next.
      hint: Concatenation doesn't add or average. Count how many numbers the joined vector should hold.
      id: multi-head-attention.practice.v2.7
  - id: multi-head-attention.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.multi-head-attention
    markdown: Two-head blends to compute by hand, then head widths and weight counts for model sizes you haven't seen yet.
    takeaway: |-
      Multi-head attention splits d_model into h heads of d_head = d_model / h, lets each head blend with its own weights, concatenates the results, and mixes them with W_O. The four projections hold 4·d_model² weights, whatever h is.
  - id: multi-head-attention.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.multi-head-attention
    markdown: |-
      Each attention head makes its own mixture using learned projections. Concatenate those outputs, then use an output projection to combine information across heads.
