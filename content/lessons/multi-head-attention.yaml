        feedback: d_head = 768 / 24 = 32, and 4 × 768² = 2,359,296, exactly the same as with 12 heads. More heads means thinner slices of the same matrices, not more weights.
      - id: multi-head-attention.transfer.v3.5
        prompt: A tiny on-device model has d_model = 256 and 4 heads. Record d_head and the number of Q/K/V/O projection weights in one attention layer (ignore biases).
        answers:
          head: 64
          params: 262144
        reason_answer: c
        reason_options:
          - id: b
            text: Each head has its own full d_model × d_model matrices, so the count grows with the number of heads.
          - id: a
            text: Only W_Q, W_K, and W_V belong to attention, so the count is 3 · d_model².
          - id: c
            text: The heads split d_model between them, so the count is 4 · d_model² whatever the number of heads.
        feedback: d_head = 256 / 4 = 64, and 4 × 256² = 4 × 65,536 = 262,144. Counting a full matrix per head would give four times too many.
