schema_version: 0.2-draft
lesson:
  id: multi-head-attention
  version: 0.1.0-draft
  title: Run several learned comparisons in parallel
  state: draft
  summary: Multi-head attention uses separate projections to create several attention mixtures, then combines their
    outputs; explicit tensor shapes prevent confusing heads, positions, and features.
  slot: M15.4
  category: learning
  minutes: 12
  sources:
  - title: Attention Is All You Need
    url: https://arxiv.org/abs/1706.03762
objectives:
- id: objective.multi-head-attention
  version: 1-draft
  statement: Multi-head attention uses separate projections to create several attention mixtures, then combines
    their outputs; explicit tensor shapes prevent confusing heads, positions, and features.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - multi-head-attention.base
  - multi-head-attention.transfer
  prerequisites:
  - anyOf:
    - objective.softmax-attention
  - anyOf:
    - objective.matrices-tensors
scenes:
- id: multi-head-attention.s1
  title: Different projections expose different comparisons
  type: explanation
  depth: intuition
  objective_refs:
  - objective.multi-head-attention
  markdown: A head forms queries, keys, and values with its learned projections. Multiple heads can attend through
    different representation subspaces. Heads need not correspond to fixed human concepts such as syntax or facts.
    Their useful behavior is learned under the training objective.
  text_mode: A head forms queries, keys, and values with its learned projections. Multiple heads can attend through
    different representation subspaces. Heads need not correspond to fixed human concepts such as syntax or facts.
    Their useful behavior is learned under the training objective.
  bridges: []
- id: multi-head-attention.s2
  title: Trace the score dimensions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multi-head-attention
  markdown: Take batch size B = 2, sequence length T = 3, H = 2 heads, and per-head query/key width d = 4. One convention
    stores Q and K as [2, 2, 3, 4]. Comparing every query position with key positions gives scores [2, 2, 3, 3].
    Softmax runs over the permitted key positions in each row.
  text_mode: Take batch size B = 2, sequence length T = 3, H = 2 heads, and per-head query/key width d = 4. One
    convention stores Q and K as [2, 2, 3, 4]. Comparing every query position with key positions gives scores [2,
    2, 3, 3]. Softmax runs over the permitted key positions in each row.
  bridges:
  - matrices-tensors
- id: multi-head-attention.s3
  title: Combine value outputs
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multi-head-attention
  markdown: If each head also outputs four value coordinates, the two head outputs concatenate into eight coordinates
    per position. A learned output projection maps that concatenation back to the model width. It can mix contributions
    from all heads; concatenation alone is not the final block computation.
  text_mode: If each head also outputs four value coordinates, the two head outputs concatenate into eight coordinates
    per position. A learned output projection maps that concatenation back to the model width. It can mix contributions
    from all heads; concatenation alone is not the final block computation.
  bridges: []
- id: multi-head-attention.s4
  title: State which design is being traced
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multi-head-attention
  markdown: The example uses the same number of query, key, and value heads. Multi-query and grouped-query variants
    share keys and values differently and change cache accounting. Parameter shapes, masks, positional operations,
    and implementation layouts must be specified before comparing numerical traces.
  text_mode: The example uses the same number of query, key, and value heads. Multi-query and grouped-query variants
    share keys and values differently and change cache accounting. Parameter shapes, masks, positional operations,
    and implementation layouts must be specified before comparing numerical traces.
  bridges: []
- id: multi-head-attention.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.multi-head-attention
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: multi-head-attention.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.multi-head-attention
  markdown: Multi-head attention uses separate projections to create several attention mixtures, then combines their
    outputs; explicit tensor shapes prevent confusing heads, positions, and features.
  text_mode: Multi-head attention uses separate projections to create several attention mixtures, then combines
    their outputs; explicit tensor shapes prevent confusing heads, positions, and features.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - multi-head-attention.s1
    - multi-head-attention.s2
    - multi-head-attention.s3
    - multi-head-attention.s4
    - multi-head-attention.check
    - multi-head-attention.recap
    gate_refs:
    - gate.core
assessment_families:
- id: multi-head-attention.base
  objective_ref: objective.multi-head-attention
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace the score dimensions: trace the inputs, operation, and result before choosing.'
  remediation_scene: multi-head-attention.s2
  variants:
  - id: multi-head-attention.base.1
    prompt: B = 1, H = 4, T = 5. Standard self-attention scores have which shape?
    options:
    - id: c
      text: '[4, 4]'
    - id: a
      text: '[1, 4, 5, 5]'
    - id: b
      text: '[1, 5, 4]'
    answer: a
    feedback: Each head has one score for every query-key position pair.
  - id: multi-head-attention.base.2
    prompt: Three heads each output two value coordinates. Concatenated width?
    options:
    - id: a
      text: '6'
    - id: b
      text: '3'
    - id: c
      text: '2'
    answer: a
    feedback: Head outputs are joined across the feature dimension.
- id: multi-head-attention.transfer
  objective_ref: objective.multi-head-attention
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'State which design is being traced: trace the inputs, operation, and result before choosing.'
  remediation_scene: multi-head-attention.s4
  variants:
  - id: multi-head-attention.transfer.1
    prompt: Does one head necessarily mean one stable human-interpretable specialty?
    options:
    - id: a
      text: 'No'
    - id: b
      text: Yes; every head is assigned a named task
    - id: c
      text: Only in a decoder
    answer: a
    feedback: Head roles emerge from learning and can be distributed or context-dependent.
  - id: multi-head-attention.transfer.2
    prompt: Why inspect the output projection after concatenation?
    options:
    - id: b
      text: It is always the final vocabulary probability
    - id: c
      text: It deletes every query token
    - id: a
      text: It mixes head contributions into the model representation
    answer: a
    feedback: The attention result still passes through a learned transformation.
