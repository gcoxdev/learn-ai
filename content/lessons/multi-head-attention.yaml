          b: 7.0
          y: 3.0
        reason_answer: a
        reason_options:
          - id: c
            text: Use the weights themselves as head outputs.
          - id: b
            text: Average both head outputs before applying the projection.
          - id: a
            text: Compute each weighted mixture before the output projection.
        feedback: 'Head A: 0.75 × 4 + 0.25 × 8 = 5. Head B: 0.25 × 4 + 0.75 × 8 = 7. Then y = 2 × 5 − 7 = 3. Averaging the heads first would throw away the separate slots that the projection reads.'
        id: multi-head-attention.base.v2.1
      - prompt: Two scalar values are 0 and 4. Head A uses weights [0.75,0.25]; head B uses [0.25,0.75]. Record hA, hB, and y=2hA−hB.
