assessment_families:
  - id: system-one-decisions.base
    objective_ref: objective.system-one-decisions
    task: base
    response_type: single_choice
    points: 1
    hint: Ask what the job needs to produce. A fixed list of answers can be scored in one pass; free text must be generated one token at a time.
    remediation_scene: system-one-decisions.s2
    variants:
      - id: system-one-decisions.base.1
        prompt: Tally's chat model takes about 2 seconds to answer a message with a roughly 30-token JSON reply. Which part of that work is the main source of the delay?
        options:
          - id: c
            text: Reading the customer's message, which has to happen one word at a time
          - id: a
            text: Writing the reply, since each token needs another pass through the model
          - id: b
            text: Looking up the routes, which the model keeps stored in a database
        answer: a
        feedback: Decoding produces tokens in sequence, and each step waits for the one before. Reading the prompt (prefill) happens in one parallel pass, and nothing is looked up in a database.
      - id: system-one-decisions.base.2
        prompt: Tally asks a decision model for a route. What does it return for that question?
        options:
          - id: b
            text: One route name and a short sentence explaining why it was chosen
          - id: a
            text: A probability for each allowed route, plus the best route and a confidence
          - id: c
            text: A brand-new route name whenever none of the listed routes fits well
        answer: a
        feedback: A decision model scores the closed list it was given, so every option gets a probability. It doesn't write explanations, and it can't invent a new route name.
      - id: system-one-decisions.base.3
        prompt: A decision model returns "bookings, 0.9" for the brake-cable message that a person would send to safety. What does this show?
        options:
          - id: c
            text: The model failed to follow Tally's schema, so the output is invalid
          - id: b
            text: The model made up a route that was not on Tally's list
          - id: a
            text: The output is valid, but the answer is wrong and confidently so
        answer: a
        feedback: 'Bookings is on the list, so the format is fine. A guaranteed schema says nothing about correctness, which is why Tally measures accuracy on labeled messages.'
      - id: system-one-decisions.base.4
        prompt: Which of these Tally jobs should stay with a chat model?
        options:
          - id: a
            text: Writing an apology to the brake-cable customer
          - id: b
            text: Flagging whether a message looks like phishing or a scam
          - id: c
            text: Scoring how urgent a message is, from 0 to 3
        answer: a
        feedback: A personal reply is open-ended text, with no list of acceptable answers. Phishing flags and urgency scores both come from fixed answer sets, which a decision model scores in one pass.
      - id: system-one-decisions.base.5
        prompt: A decision model costs far less per message than a chat model on Tally's routing. What explains most of the saving?
        options:
          - id: b
            text: It reads fewer words because it ignores the end of each message
          - id: c
            text: It uses simpler messages that customers wrote on purpose
          - id: a
            text: It pays for reading the input but not for generating an answer
        answer: a
        feedback: Decode steps are the main cost of a chat reply, and a decision model skips them. It still reads the whole message, and it doesn't need simpler input.
      - id: system-one-decisions.base.6
        prompt: Which setup can a decision model answer?
        options:
          - id: c
            text: A message plus "work out what categories exist and why each fits"
          - id: b
            text: A message plus "write the best reply for this customer"
          - id: a
            text: A message plus four routes and four urgency levels written in advance
        answer: a
        feedback: A decision model needs the answer list before the message arrives, because it scores those options. Discovering categories or writing replies has no fixed list.
  - id: system-one-decisions.transfer
    objective_ref: objective.system-one-decisions
    task: transfer
    response_type: single_choice
    points: 1
    hint: "Check two things: can every acceptable answer be listed in advance, and does anyone need an explanation or a written reply? Then pick the tool for each part."
    remediation_scene: system-one-decisions.s5
    variants:
      - id: system-one-decisions.transfer.1
        prompt: An insurance team must sort 2 million claims a month into auto, home, health, or other, and also email each customer a plain-language explanation. What is the best split?
        options:
          - id: b
            text: A chat model for both, since it can already handle both jobs well enough
          - id: a
            text: A decision model for the sorting and a chat model for the emails
          - id: c
            text: A decision model for both, asking it to explain each claim it sorts
        answer: a
        feedback: Sorting uses a closed list and suits a one-pass scorer. The email is open-ended text, which needs generation. A decision model returns probabilities, not explanations.
      - id: system-one-decisions.transfer.2
        prompt: A newsroom wants to find the themes in 5,000 reader comments, but nobody has written a list of themes yet. Why is a decision model a poor fit?
        options:
          - id: c
            text: Reader comments are too short for it to read
          - id: b
            text: Decision models cannot handle more than a few hundred inputs
          - id: a
            text: It scores a list of answers, and this job has no list yet
        answer: a
        feedback: A decision model needs the options in advance. Finding unknown themes means producing them, which is a job for a chat model, or for a decision model only after the themes are named.
      - id: system-one-decisions.transfer.3
        prompt: A pharmacy vendor says, "Our model can't hallucinate, so we skip accuracy testing on prescription routing." What is the flaw?
        options:
          - id: a
            text: The guarantee covers the format, so correctness still needs testing
          - id: b
            text: The guarantee only applies to messages written in English
          - id: c
            text: Accuracy testing is only needed for models that write text
        answer: a
        feedback: A fixed schema means the model can't invent a ward or a malformed answer, not that it picks the right one. A wrong prescription route is still wrong, so test on labeled examples.
      - id: system-one-decisions.transfer.4
        prompt: A nurse line must route 100,000 messages a day to one of four departments, and each routing should be back in well under a second. Which approach fits best?
        options:
          - id: c
            text: Ask a chat model for a one-word answer, which skips the decoding
          - id: b
            text: Write keyword rules and leave any message that matches nothing unrouted
          - id: a
            text: Score the four departments with a decision model and check its accuracy
        answer: a
        feedback: A closed list and a tight latency budget are the sweet spot for a one-pass scorer. Even a one-word chat reply still decodes at least one token, and keyword rules miss messages phrased in new ways.
      - id: system-one-decisions.transfer.5
        prompt: A vendor page says its decision model answers in 70 to 500 ms and calls this a "10x speedup." How should a buyer treat the claim?
        options:
          - id: b
            text: As settled, since the vendor measured it on real workloads
          - id: a
            text: As a vendor claim to re-measure on the buyer's own messages
          - id: c
            text: As meaningless, since no decision model can be that fast
        answer: a
        feedback: Vendor-built evaluations may favor the vendor's own workloads, and TypeSafe itself says gains shrink on some tasks. Test your own data before relying on the number, but don't discard it either.
      - id: system-one-decisions.transfer.6
        prompt: A library already trains a classifier for each question it asks of patron emails, and every new question means collecting labels and retraining. What is new about a decision model?
        options:
          - id: c
            text: It is the first kind of model that returns probabilities
          - id: a
            text: You can describe the question and options in text and try them at once
          - id: b
            text: It removes the need to measure accuracy on the library's emails
        answer: a
        feedback: Classic classifiers already return probabilities. The change is that the question and options are given at runtime in plain language, though the library should still test the new question on labeled emails.
  - id: system-one-decisions.calculate
    objective_ref: objective.system-one-decisions
    task: base
    response_type: numeric
    points: 1
    hint: "Cost for a decision model is tokens ÷ 1,000,000 × the price per million. For a chat reply, time is prefill plus one decode step per output token."
    remediation_scene: system-one-decisions.s4
    absolute_tolerance: 0.01
    variants:
      - id: system-one-decisions.calculate.1
        prompt: A desk gets 30,000 messages a day, and a chat model costs 0.004 dollars per message. What does it cost per day, in dollars?
        answer: 120
        feedback: 30,000 × 0.004 = 120 dollars a day.
      - id: system-one-decisions.calculate.2
        prompt: Each message plus its questions is 500 tokens, a decision model charges 0.042 dollars per million input tokens (output free), and the desk sends 10,000 messages a day. What is the daily cost, in dollars?
        answer: 0.21
        feedback: 500 × 10,000 = 5,000,000 tokens, which is 5 million, and 5 × 0.042 = 0.21 dollars.
      - id: system-one-decisions.calculate.3
        prompt: A chat model reads a prompt in 0.3 seconds (prefill), then writes a 36-token answer at 25 ms per token. How many seconds does one answer take?
        answer: 1.2
        feedback: Decoding takes 36 × 0.025 = 0.9 seconds, and adding the 0.3 seconds of prefill gives 1.2 seconds.
      - id: system-one-decisions.calculate.4
        prompt: Each message plus its questions is 250 tokens, and a decision model charges 0.042 dollars per million input tokens. For 40,000 messages in a day, what is the cost, in dollars?
        answer: 0.42
        feedback: 250 × 40,000 = 10,000,000 tokens, which is 10 million, and 10 × 0.042 = 0.42 dollars.
      - id: system-one-decisions.calculate.5
        prompt: Tally's chat model takes 2 seconds per message, one message after another, and 20,000 messages arrive. How many hours of model time is that? (Answer to two decimals.)
        answer: 11.11
        feedback: 20,000 × 2 = 40,000 seconds, and 40,000 ÷ 3,600 ≈ 11.11 hours. Running requests in parallel changes the wall-clock time but not the work.
