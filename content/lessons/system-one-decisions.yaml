objectives:
  - id: objective.system-one-decisions
    version: 1-draft
    statement: A decision model scores a supplied set of answers for a given situation and returns probabilities, and separate software chooses what to do with them. A valid answer from the list can still be wrong, a probability is not permission to act, and open-ended work needs a different tool.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - system-one-decisions.base
      - system-one-decisions.transfer
      - system-one-decisions.calculate
    prerequisites:
      - anyOf:
          - objective.next-token
scenes:
  - id: system-one-decisions.s1
    title: Labeled trays, 20,000 times a day
    type: explanation
    depth: intuition
    objective_refs:
      - objective.system-one-decisions
    markdown: |-
      Imagine five labeled trays at a help desk. A customer sends a message, and the software needs to choose a tray. A **decision model** scores the choices you give it. Your software then checks the result and decides whether to route the message or ask a person for help. The model can still choose the wrong tray.

      A few words to keep straight:

      - The **state** is the information available for this decision, such as the customer's message.
      - A **candidate** is one possible answer, such as one tray.
      - A **score** is a number used to compare candidates. A higher score means a better fit.
      - A **probability estimate** is a set of scores turned into numbers that add up to 1. How reliable those numbers are still has to be checked.

      Tally is the support desk of a small bike-rental company. About 20,000 messages arrive every day, and each one needs the same four small answers:

      - **Route:** billing, bookings, repairs, safety, or other?
      - **Urgency:** 0 (whenever) up to 3 (right now).
      - **Refund request?** yes or no.
      - **Phishing?** yes or no.

      Take this message: *"The brake cable on my rental snapped on the hill. I'm fine, but I want my deposit back."* A sensible desk answers: safety, urgency 3, refund request yes, phishing no.

      Today a frontier chat model does this job. It takes about 2 seconds per message and costs about \$0.004. (Those numbers are invented for this module; real figures depend on the model, the prompt, and the provider.) At 20,000 messages that's \$80 a day, about \$29,200 a year. The desk doesn't need the model to *write* anything. It needs to *choose* from lists.
  - id: system-one-decisions.s2
    title: Fast thinking, slow thinking, and where the seconds go
    type: explanation
    depth: intuition
    objective_refs:
      - objective.system-one-decisions
    markdown: |-
      In *Thinking, Fast and Slow* (2011), the psychologist Daniel Kahneman described two modes of thought. **System 1** is fast and automatic: you know a face is angry without working it out. **System 2** is slow and deliberate: you carry the 1 while multiplying 47 by 13. TypeSafe AI borrowed the name "System One" for its models. Treat it as an analogy, not as a scientific split between two kinds of machine thinking.

      A chat model writes its reply one token (a small piece of text) at a time, and each new token after the first needs another step through the model, as the lesson on how a language model takes its next step showed. Serving a model splits into two phases: **prefill** reads your whole prompt at once, and **decode** produces the reply one token after another (the lesson on prefill and decode covers both). The prefill pass already yields the first token, so a reply of $N$ tokens needs about $N - 1$ more sequential steps.

      Say Tally's JSON answer is about 30 tokens (an invented figure). Counting about 30 steps in a row is a simplification, and a good enough one here: each step waits for the one before. Writing the answer one piece at a time is a big part of the wait in this kind of job. It is not the only part. Prompt length, model size, caching, hardware, queueing, and network time all count too.

      :::predict If a model could read Tally's message and the five answer options, then pick from the options right after reading, how many decode steps would it need?
      None for the answer itself. Reading already leaves the model with a score for each option (how it gets them depends on the design, as the lesson on how the model scores your choices shows), and picking the best one is arithmetic, not writing. A **decision model** avoids writing an answer one token at a time. It does not skip reading, and it is not always cheaper overall.
      :::

      A decision model is not the only fast option. A short rule list, or an ordinary classifier trained on Tally's labeled messages, can also be fast and cheap. A chat model told to answer in a fixed format (OpenAI's Structured Outputs guide documents this) can return a short, valid answer too. Validity of the format, quality of the decision, honesty of the confidence, and cost are separate things to compare.

      One more distinction. Reinforcement learning also uses the phrase "decision policy", for a system that learns from long-term consequences. Here the model only scores the choices handed to it. It does not learn from what happens afterward.
  - id: system-one-decisions.s3
    title: State and options in, probabilities out
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.system-one-decisions
    markdown: |-
      A decision model takes the **state** (the customer's message) and one or more **typed questions**. Each question has a closed answer set: the candidates it may choose from. The list must exist at the moment of scoring. It does not have to exist before the message arrives, because an agent can look up or propose candidates after reading a request and then ask a scorer to rank them.

      They're called "typed" because each question has a kind: pick one option, rate on an ordered scale, or answer yes/no (the next lesson covers all three). A model scores every allowed option. Some systems return all the probabilities, and some also return a best answer and a **confidence** value. The exact fields differ from one provider to the next, so check the documentation. For Tally's route question, a model might return:

      | Option | Probability |
      | --- | ---: |
      | billing | 0.05 |
      | bookings | 0.05 |
      | repairs | 0.10 |
      | safety | 0.74 |
      | other topic | 0.06 |

      The probabilities sum to 1, so the model can say "probably safety, but repairs isn't impossible". A chat model's one-word answer hides that doubt. The word "probability" is a promise only if the numbers have been checked against real outcomes, and a later lesson shows how.

      The general shape of the work is:

      `information + question + candidates → scores → probabilities → Tally's policy → action or review`

      This is a teaching pattern, not a wire format that every vendor shares. A finite answer set does not make a decision easy, either: choosing between two proposed mathematical proofs can take a lot of reasoning.

      You may wonder whether spam filters and other classifiers already did this. They did. What's new is that a model can be handed the question and its candidates at runtime, in plain language, rather than a fresh classifier being trained for each fixed list.
    diagram:
      caption: The decision model scores every supplied candidate. Tally's code decides what happens next.
      description: The state, which is Tally's customer message, goes into the decision model, and so do the typed questions with their candidate answers. The model scores each candidate and outputs a probability for every option. Depending on the provider, the output may also include a best answer and a confidence value. All of that goes to Tally's code, which applies its own policy and either acts or asks a person.
      nodes:
        - id: state
          label: State
          note: the customer's message
          col: 0
          row: 0
          tone: data
        - id: questions
          label: Typed questions
          note: each with a closed answer set
          col: 0
          row: 1
        - id: model
          label: Decision model
          note: scores each candidate
          col: 2
          row: 0
          tone: accent
        - id: out
          label: Probabilities
          note: one per allowed option
          col: 3
          row: 0
        - id: conf
          label: Answer + confidence
          note: fields vary by provider
          col: 3
          row: 1
        - id: code
          label: Tally's code
          note: acts, or asks a person
          col: 4
          row: 1
          tone: warn
      edges:
        - from: state
          to: model
        - from: questions
          to: model
        - from: model
          to: out
        - from: out
          to: conf
        - from: conf
          to: code
          label: policy decides
  - id: system-one-decisions.s4
    title: Tally's bill, worked out
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.system-one-decisions
    markdown: |-
      TypeSafe AI's Jev, a decision model announced in September 2026, is priced at \$0.042 per million input tokens, with output free, and TypeSafe reports 70 to 500 ms end to end. (These are the vendor's published claims as of October 2026, and they were not re-measured here.) Suppose each Tally message plus its question lists is 400 tokens (our invented figure).

      - Cost per message: 400 ÷ 1,000,000 × \$0.042 = \$0.0000168.
      - Per day: 20,000 × \$0.0000168 = \$0.336.
      - Per year: about \$123, against about \$29,200 for the chat model.

      | | Chat model (invented) | Decision model (vendor claim) |
      | --- | ---: | ---: |
      | Latency per message | about 2 s | 0.07 to 0.5 s |
      | Cost per day (20,000 messages) | \$80 | \$0.34 |

      Latency improves by 2 ÷ 0.5 = 4 times at the slow end and 2 ÷ 0.07 ≈ 29 times at the fast end.

      This is arithmetic under chosen assumptions, not an experiment that proves what any vendor saves. Your own numbers depend on input length, how many questions you ask, caching, hardware, and queueing. Cost per message is also only part of the bill: a decision that goes wrong has a cost of its own, and Tally still needs people for the cases the model cannot settle.

      :::predict Tally's volume doubles to 40,000 messages a day. What does each option cost per day?
      The chat model: 40,000 × \$0.004 = \$160. The decision model: 40,000 × \$0.0000168 = \$0.672. Both costs grow in proportion to messages, so doubling volume doubles both bills.
      :::
  - id: system-one-decisions.s5
    title: '"Can''t hallucinate" is not "can''t be wrong"'
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.system-one-decisions
    markdown: |-
      TypeSafe markets Jev as a model that can't hallucinate. Here's what that precisely means. The output always fits the schema: the model can't invent a sixth route called "money stuff" or return broken JSON. TypeSafe's own blog puts it this way: "Schema matching is guaranteed, thus we can confidently add 0% into the plots."

      It does not mean the answer is right. If the brake-cable message came back as *bookings* with probability 0.9, that's a valid, confident, wrong answer. So you still measure accuracy on your own labeled messages, and the later lessons in this module show how to check whether the stated probabilities can be trusted.

      :::mixup "A model that can't hallucinate gives correct answers."
      A guaranteed format is not a guaranteed answer. A decision model can only pick from your list, so it can't invent an option. It can still pick the wrong one.
      :::

      A second step also separates a model's output from an action. "The customer asks for a refund" is a classification. "The customer qualifies for a refund" depends on identity, policy limits, and what was actually paid, and those need their own checks in Tally's code. The model's job ends at a probability. A decision to refund money belongs to the software and to people.

      **When not to use one.** Ask whether you can list the acceptable answers at the moment of scoring.

      - *Yes:* routing, urgency, flags, choosing among candidate tools an agent has proposed. A decision model is worth testing.
      - *No:* writing a reply, explaining why a message is urgent, or finding topics nobody has named yet. Use a chat model.

      Many desks use both. The decision model routes the message and the chat model writes the apology for the brake-cable customer.
  - id: system-one-decisions.s6
    title: Who's building these, as of October 2026
    type: explanation
    depth: intuition
    objective_refs:
      - objective.system-one-decisions
    markdown: |-
      Five systems fit the "supplied answers in, scores out" idea. They're weeks old, and nearly every number about them is a vendor claim, so treat this table as a map, not a ranking. They do not share one interface or one design, and the next lesson shows that even their question types and confidence fields differ.

      | System | Who | Access | How it scores options |
      | --- | --- | --- | --- |
      | Jev | TypeSafe AI | Hosted, early access | Not disclosed |
      | Laya | Convai Innovations | Open weights (Apache 2.0) | Encoder with one marker slot per option |
      | CLM | Researchers at Stanford and NVIDIA | Open weights (Apache 2.0) | Similarity between separate state and option embeddings |
      | Nimble | Bespoke Labs | Open adapter (Apache 2.0), documented in its own repository | Reads the model's scores for single-token answer codes |
      | Decisions API | OpenAI, announced Sept 29, 2026 | Limited preview at announcement | Not announced |

      For the OpenAI row, the recap confirms user-defined questions with finite answer choices, text or image context, and uses such as classifying, routing, and choosing an agent's next action. A broader release was planned, and this module has not confirmed that it has happened. The request format, whether every option's probability is returned, the mechanism, pricing, limits, and latency are not verified in the public sources reviewed, so a quoted latency figure from the press should not be used here.

      The next lessons open up the first four mechanisms with numbers, then show how to train and check probabilities and how to compare the systems fairly.
  - id: system-one-decisions.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.system-one-decisions
    markdown: Tally's desk, an insurance claims team, a newsroom, a hospital line, and a library test whether you can say what a decision model is good for, where its time goes, and what its guarantee covers.
    takeaway: |-
      A decision model scores the candidates you give it and returns probabilities, and your software decides what to do with them. Its answers always fit your list, but they can still be wrong, and a high probability is not permission to act.
  - id: system-one-decisions.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.system-one-decisions
    markdown: |-
      If you can list every acceptable answer when the question is asked, a decision model can score the list. Check its accuracy yourself; a valid format is not a correct answer, and a probability is not permission to act.
