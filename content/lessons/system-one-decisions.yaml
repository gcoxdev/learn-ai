objectives:
  - id: objective.system-one-decisions
    version: 1-draft
    statement: A System One decision model takes a state and a closed set of typed questions and returns a probability for every allowed answer in one pass, with no token-by-token decoding. Its output always fits the schema, but the chosen answer can still be wrong, and open-ended work needs a chat model.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - system-one-decisions.base
      - system-one-decisions.transfer
      - system-one-decisions.calculate
    prerequisites:
      - anyOf:
          - objective.next-token
scenes:
  - id: system-one-decisions.s1
    title: Four tiny answers, 20,000 times a day
    type: explanation
    depth: intuition
    objective_refs:
      - objective.system-one-decisions
    markdown: |-
      Tally is the support desk of a small bike-rental company. About 20,000 messages arrive every day, and each one needs the same four small answers:

      - **Route:** billing, bookings, repairs, safety, or other?
      - **Urgency:** 0 (whenever) up to 3 (right now).
      - **Refund request?** yes or no.
      - **Phishing?** yes or no.

      Take this message: *"The brake cable on my rental snapped on the hill. I'm fine, but I want my deposit back."* A sensible desk answers: safety, urgency 3, refund yes, phishing no.

      Today a frontier chat model does this job. It takes about 2 seconds per message and costs about \$0.004. (Those numbers are invented for this module; real figures depend on the model, the prompt, and the provider.) At 20,000 messages that's \$80 a day, nearly \$29,200 a year, and a human can't see a safety message until the model finishes typing a block of JSON just to say "safety".

      The desk doesn't need the model to *write* anything. It needs to *choose* from lists it already knows.
  - id: system-one-decisions.s2
    title: Fast thinking, slow thinking, and where the seconds go
    type: explanation
    depth: intuition
    objective_refs:
      - objective.system-one-decisions
    markdown: |-
      In *Thinking, Fast and Slow* (2011), the psychologist Daniel Kahneman described two modes of thought. **System 1** is fast and automatic: you know a face is angry without working it out. **System 2** is slow and deliberate: you carry the 1 while multiplying 47 by 13.

      A chat model behaves like System 2. As the lesson on how a language model takes its next step showed, it writes one token at a time, and each new token needs another pass through the whole model. Serving a model splits into two phases: **prefill** reads your whole prompt at once, and **decode** produces the reply one token after another (the lesson on prefill and decode covers both).

      Say Tally's JSON answer is about 30 tokens (an invented figure). That's about 30 decode steps in a row, each waiting for the one before. The decode steps, not the reading, are where most of the 2 seconds and most of the bill go.

      :::predict If a model could read Tally's message and the four answer lists, then pick from the lists right at the end of reading, how many decode steps would it need?
      None. Reading (a prefill-style pass) already leaves the model with a score for each option. Picking the best one is arithmetic, not generation. That's the whole idea behind a **System One model**, the name TypeSafe AI uses for models that decide in one pass instead of writing an answer.
      :::
  - id: system-one-decisions.s3
    title: State and options in, probabilities out
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.system-one-decisions
    markdown: |-
      A **decision model** takes two things. The **state** is text or JSON describing the situation (here, the customer's message). Alongside it come **typed questions**, each with a **closed answer set**: a list of allowed answers written down before the message arrives.

      They're called "typed" because each question has a kind: pick one option, rate on an ordered scale, or answer yes/no (the next lesson covers all three). For every question, the model returns a probability for each allowed option, the best answer, and a **confidence**, a number saying how far to trust that best answer. For Tally's route question:

      | Option | Probability |
      | --- | ---: |
      | billing | 0.05 |
      | bookings | 0.05 |
      | repairs | 0.10 |
      | safety | 0.74 |
      | other | 0.06 |

      The probabilities sum to 1, so the model can say "probably safety, but repairs isn't impossible". A chat model's one-word answer hides that doubt.

      You may wonder whether spam filters and other classifiers already did this. They did. What's new is that you write the question and its options at runtime in plain language, instead of collecting labeled data and training a fresh classifier for each question.
    diagram:
      caption: The decision model reads once and scores every allowed option. Nothing is generated.
      description: The state, which is Tally's customer message, goes into the decision model, and so do the typed questions with their closed answer sets. The model makes one pass and outputs a probability for every option. The probabilities lead to an answer plus a confidence. That answer and confidence go to Tally's code, which reads the confidence and decides whether to act or ask a person.
      nodes:
        - id: state
          label: State
          note: the customer's message
          col: 0
          row: 0
          tone: data
        - id: questions
          label: Typed questions
          note: each with a closed answer set
          col: 0
          row: 1
        - id: model
          label: Decision model
          note: one pass, no decoding
          col: 2
          row: 0
          tone: accent
        - id: out
          label: Probabilities
          note: one per allowed option
          col: 3
          row: 0
        - id: conf
          label: Answer + confidence
          col: 3
          row: 1
        - id: code
          label: Tally's code
          note: acts, or asks a person
          col: 4
          row: 1
          tone: warn
      edges:
        - from: state
          to: model
        - from: questions
          to: model
        - from: model
          to: out
        - from: out
          to: conf
        - from: conf
          to: code
          label: act or escalate
  - id: system-one-decisions.s4
    title: Tally's bill, worked out
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.system-one-decisions
    markdown: |-
      TypeSafe AI's Jev, a decision model announced in September 2026, is priced at \$0.042 per million input tokens, with output free, and TypeSafe reports 70 to 500 ms end to end. (These are the vendor's published claims as of October 2026.) Suppose each Tally message plus its question lists is 400 tokens (our invented figure).

      - Cost per message: 400 ÷ 1,000,000 × \$0.042 = \$0.0000168.
      - Per day: 20,000 × \$0.0000168 = \$0.336.
      - Per year: about \$123, against about \$29,200 for the chat model.

      | | Chat model (invented) | Decision model (vendor claim) |
      | --- | ---: | ---: |
      | Latency per message | about 2 s | 0.07 to 0.5 s |
      | Cost per day (20,000 messages) | \$80 | \$0.34 |

      Latency improves by 2 ÷ 0.5 = 4 times at the slow end and 2 ÷ 0.07 ≈ 29 times at the fast end.

      :::predict Tally's volume doubles to 40,000 messages a day. What does each option cost per day?
      The chat model: 40,000 × \$0.004 = \$160. The decision model: 40,000 × \$0.0000168 = \$0.672. Both costs grow in proportion to messages, so doubling volume doubles both bills.
      :::
  - id: system-one-decisions.s5
    title: '"Can''t hallucinate" is not "can''t be wrong"'
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.system-one-decisions
    markdown: |-
      TypeSafe markets Jev as a model that can't hallucinate. Here's what that precisely means. The output always fits the schema: the model can't invent a fifth route called "money stuff" or return broken JSON. TypeSafe's own blog puts it this way: "Schema matching is guaranteed, thus we can confidently add 0% into the plots."

      It does not mean the answer is right. If the brake-cable message came back as *bookings* with probability 0.9, that's a valid, confident, wrong answer. So you still measure accuracy on your own labeled messages, and the later lessons in this module show how to check whether the stated probabilities can be trusted.

      :::mixup "A model that can't hallucinate gives correct answers."
      A guaranteed format is not a guaranteed answer. A decision model can only pick from your list, so it can't invent an option. It can still pick the wrong one.
      :::

      **When not to use one.** Ask whether you can list every acceptable answer before the message arrives.

      - *Yes:* routing, urgency, flags, choosing an agent's next action. Use a decision model.
      - *No:* writing a reply, explaining why a message is urgent, or finding topics nobody has named yet. Use a chat model.

      Many desks use both. The decision model routes the message and the chat model writes the apology for the brake-cable customer.
  - id: system-one-decisions.s6
    title: Who's building these, as of October 2026
    type: explanation
    depth: intuition
    objective_refs:
      - objective.system-one-decisions
    markdown: |-
      Five systems share the same interface (state and closed answer set in, probabilities out). They're weeks old, and nearly every number about them is a vendor claim, so treat this table as a map, not a ranking. The Nimble row comes from press coverage, not from Bespoke Labs' own post, and the Decisions API row from OpenAI's DevDay recap (links under Sources).

      | System | Who | Access | How it scores options |
      | --- | --- | --- | --- |
      | Jev | TypeSafe AI | Hosted, early access | Not disclosed |
      | Laya | Convai Innovations | Open weights (Apache 2.0) | Encoder with one slot per option |
      | CLM | Researchers at Stanford and NVIDIA | Open weights (Apache 2.0) | Similarity between state and option embeddings |
      | Nimble | Bespoke Labs | Open weights (Apache 2.0), per secondary reports | Reads the model's scores for allowed tokens |
      | Decisions API | OpenAI, announced Sept 29, 2026 | Limited preview | Not announced |

      The next lessons open up the first three mechanisms with numbers, then show how to train for honest probabilities and how to compare the systems fairly.
  - id: system-one-decisions.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.system-one-decisions
    markdown: Tally's desk, an insurance claims team, a newsroom, a hospital line, and a library test whether you can say what a decision model is good for, where its time goes, and what its guarantee covers.
    takeaway: |-
      A decision model reads a state and a closed list of options once and returns a probability for each, with no decoding, so it is fast and cheap for routing. Its answers always fit your list, but they can still be wrong.
  - id: system-one-decisions.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.system-one-decisions
    markdown: |-
      If you can list every acceptable answer in advance, ask a decision model to score the list in one pass. Check its accuracy yourself; a valid format is not a correct answer.
