lesson:
  id: system-one-decisions
  version: 0.4.0-draft
  title: "Decisions, not strings: what a System One model is"
  state: draft
  summary: Tally's support desk gets 20,000 messages a day and needs four tiny answers from each. A chat model writes paragraphs to give them. A decision model reads once and returns probabilities instead.
  slot: M38.1
  category: learning
  archetype: foundation
  sources:
