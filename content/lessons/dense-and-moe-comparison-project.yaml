objectives:
  - id: objective.dense-and-moe-comparison-project
    version: 2-draft
    statement: Account for a dense and a mixture-of-experts model's total and active parameters, memory, compute, and cache; measure routing load and batching effects with a toy router; and name the confounds in a quality comparison.
    depths:
