schema_version: 0.2-draft
lesson:
  id: dense-and-moe-comparison-project
  version: 0.3.0-draft
  title: 'Project: compare dense and sparse model lifecycles'
  state: draft
  summary: Compare dense and expert systems using evidence and a transparent memory worksheet.
  slot: M36.5
  category: learning
  minutes: 50
  sources:
  - title: Llama 3 report v3
    url: https://arxiv.org/abs/2407.21783v3
  - title: DeepSeek-V3 report v2
    url: https://arxiv.org/abs/2412.19437v2
objectives:
- id: objective.dense-and-moe-comparison-project
  version: 1-draft
  statement: Build a sourced dense-versus-MoE comparison that accounts for training stages, resident and activated
    parameters, cache state, workload, and confounding differences.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - dense-and-moe-comparison-project.base
  - dense-and-moe-comparison-project.transfer
  prerequisites:
  - anyOf:
    - objective.llama-three-case-study
  - anyOf:
    - objective.deepseek-v3-case-study
  - anyOf:
    - objective.serving-metrics-and-cost
scenes:
- id: dense-and-moe-comparison-project.s1
  title: Choose bounded artifacts
  type: explanation
  depth: intuition
  objective_refs:
  - objective.dense-and-moe-comparison-project
  markdown: Compare the dated Llama 3.1 and original DeepSeek-V3 cases from the atlas, without downloading
    either model. Make a table with checkpoint, architecture, pretraining objective/data, post-training stages,
    tokenizer/template, cache representation, weight terms, and missing details. Each nontrivial fact needs
    a primary-source reference. Keep reported measurements separate from calculations you make.
  text_mode: Compare the dated Llama 3.1 and original DeepSeek-V3 cases from the atlas, without downloading
    either model. Make a table with checkpoint, architecture, pretraining objective/data, post-training stages,
    tokenizer/template, cache representation, weight terms, and missing details. Each nontrivial fact needs
    a primary-source reference. Keep reported measurements separate from calculations you make.
  bridges: []
- id: dense-and-moe-comparison-project.s2
  title: Do a synthetic memory worksheet
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.dense-and-moe-comparison-project
  markdown: For arithmetic practice only, suppose dense D stores and activates 10B parameters. Sparse S stores
    40B and activates 8B per token. At two bytes per parameter, ideal raw weights occupy 20GB and 80GB in decimal
    units. These invented models are not Llama or V3. Activating 8B does not reduce S’s full raw resident weight
    set to 16GB.
  text_mode: For arithmetic practice only, suppose dense D stores and activates 10B parameters. Sparse S stores
    40B and activates 8B per token. At two bytes per parameter, ideal raw weights occupy 20GB and 80GB in decimal
    units. These invented models are not Llama or V3. Activating 8B does not reduce S’s full raw resident weight
    set to 16GB.
  bridges:
  - arithmetic
  - algorithm-cost
- id: dense-and-moe-comparison-project.s3
  title: Extend beyond parameter totals
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.dense-and-moe-comparison-project
  markdown: Add cache, activations, runtime buffers, and communication to the comparison. State batch size,
    prompt/output lengths, hardware, precision, and expert placement before estimating throughput. A sparse
    model may activate fewer parameters yet incur routing or memory costs. Report absent measurements as unknown
    instead of turning the worksheet into a claimed speed benchmark.
  text_mode: Add cache, activations, runtime buffers, and communication to the comparison. State batch size,
    prompt/output lengths, hardware, precision, and expert placement before estimating throughput. A sparse
    model may activate fewer parameters yet incur routing or memory costs. Report absent measurements as unknown
    instead of turning the worksheet into a claimed speed benchmark.
  bridges: []
- id: dense-and-moe-comparison-project.s4
  title: Deliver and defend
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.dense-and-moe-comparison-project
  markdown: Save the evidence table, arithmetic worksheet, one inference trace per architecture, and three
    confounds in any reported quality comparison. Review source fidelity, lifecycle completeness, resource
    accounting, and bounded conclusions on a 0–2 scale. Revise every zero. The quiz checks accounting concepts;
    it does not inspect the table or award independent project completion.
  text_mode: Save the evidence table, arithmetic worksheet, one inference trace per architecture, and three
    confounds in any reported quality comparison. Review source fidelity, lifecycle completeness, resource
    accounting, and bounded conclusions on a 0–2 scale. Revise every zero. The quiz checks accounting concepts;
    it does not inspect the table or award independent project completion.
  bridges: []
- id: dense-and-moe-comparison-project.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.dense-and-moe-comparison-project
  markdown: Try these questions to check the ideas behind your project. Use the lesson’s rubric for self or
    peer review of your work; the app does not grade the project artifact.
  text_mode: Try these questions to check the ideas behind your project. Use the lesson’s rubric for self or
    peer review of your work; the app does not grade the project artifact.
  takeaway: Compare complete model lifecycles and operating costs. Separate total from activated parameters,
    and mark missing measurements as unknown.
- id: dense-and-moe-comparison-project.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.dense-and-moe-comparison-project
  markdown: Compare complete model lifecycles and operating costs. Separate total from activated parameters,
    and mark missing measurements as unknown.
  text_mode: Compare complete model lifecycles and operating costs. Separate total from activated parameters,
    and mark missing measurements as unknown.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - dense-and-moe-comparison-project.s1
    - dense-and-moe-comparison-project.s2
    - dense-and-moe-comparison-project.s3
    - dense-and-moe-comparison-project.s4
    - dense-and-moe-comparison-project.check
    gate_refs:
