assessment_families:
- id: dense-and-moe-comparison-project.base
  objective_ref: objective.dense-and-moe-comparison-project
  task: base
  response_type: single_choice
  points: 1
  hint: 'Do a synthetic memory worksheet: trace the inputs, operation, and result before choosing.'
  remediation_scene: dense-and-moe-comparison-project.s2
  variants:
  - id: dense-and-moe-comparison-project.base.1
    prompt: How much raw storage does synthetic S need at two bytes per parameter?
    options:
    - id: b
      text: 16GB
    - id: c
      text: 8GB
    - id: a
      text: 80GB
    answer: a
    feedback: 40 billion stored parameters times two bytes is 80 billion bytes.
  - id: dense-and-moe-comparison-project.base.2
    prompt: Does the activated count alone determine resident weight memory?
    options:
    - id: c
      text: Only for top-2 routing
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Unselected experts still need a storage strategy.
- id: dense-and-moe-comparison-project.transfer
  objective_ref: objective.dense-and-moe-comparison-project
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Deliver and defend: trace the inputs, operation, and result before choosing.'
  remediation_scene: dense-and-moe-comparison-project.s4
  variants:
  - id: dense-and-moe-comparison-project.transfer.1
    prompt: Can different data and post-training confound a dense-versus-sparse quality comparison?
    options:
    - id: c
      text: Only if vocabulary sizes match
    - id: a
      text: 'Yes'
    - id: b
      text: 'No'
    answer: a
    feedback: Architecture may not be the only changed variable.
  - id: dense-and-moe-comparison-project.transfer.2
    prompt: What makes a throughput comparison interpretable?
    options:
    - id: a
      text: Matched or clearly reported workloads and hardware settings
    - id: b
      text: Parameter labels alone
    - id: c
      text: Only a family name
    answer: a
    feedback: Runtime depends on workload, placement, kernels, and precision.
