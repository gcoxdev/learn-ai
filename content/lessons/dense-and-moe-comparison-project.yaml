  - id: dense-and-moe-comparison-project.base.v2
    objective_ref: objective.dense-and-moe-comparison-project
    task: base
    response_type: single_choice
    points: 1
    hint: 'Match each budget to its count: memory follows total parameters, arithmetic and training compute follow active parameters, and the KV cache follows the attention layout.'
    remediation_scene: dense-and-moe-comparison-project.s3
    variants:
      - id: dense-and-moe-comparison-project.base.v2.1
        prompt: Model M stores 7.18B parameters and uses 1.37B per token. How much memory do its weights need at 2 bytes each?
        options:
          - id: b
            text: About 2.7 GB, twice the active count
          - id: a
            text: About 14.4 GB, twice the total count
          - id: c
            text: About 8.5 GB, total plus active
        answer: a
        feedback: Every expert must be resident, because any token might pick it, so memory follows the total, 7.18B × 2 bytes ≈ 14.4 GB. The 2.7 GB figure is what one token's weights would need, not the model's.
      - id: dense-and-moe-comparison-project.base.v2.2
        prompt: Which parameter count goes into C ≈ 6ND when you estimate an MoE's training compute?
        options:
          - id: a
            text: The active count, the weights each token actually uses
          - id: b
            text: The total count, the weights stored in memory
          - id: c
            text: The average of the total and the active counts
        answer: a
        feedback: Training compute is arithmetic, about 6 FLOPs per weight used per token, so it follows the active count. That's why D and M cost the same to train despite M's 5 times larger total.
      - id: dense-and-moe-comparison-project.base.v2.3
        prompt: D and M have identical attention layers. How do their KV caches per token compare?
        options:
          - id: c
            text: M's is smaller, since only 2 of 16 experts run
          - id: b
            text: M's is about 5 times larger, like its total
          - id: a
            text: They are the same, since the cache comes from attention
        answer: a
        feedback: The KV cache stores keys and values from the attention layers, and experts live only in the feed-forward blocks. Same attention, same cache, 0.197 MB per token here.
      - id: dense-and-moe-comparison-project.base.v2.4
        prompt: At batch 1, M reads about the same weight bytes per step as D. At batch 16 it reads about 12.8 GB against D's 2.7 GB. Why?
        options:
          - id: b
            text: The router's weights grow with the batch size
          - id: a
            text: Different tokens pick different experts, so most get read
          - id: c
            text: The KV cache is copied once for each chosen expert
        answer: a
        feedback: Each token uses 2 of 16 experts, but 16 tokens together touch about 88% of them, so nearly all expert weights are read each step. The router is tiny and fixed in size, and the cache doesn't depend on experts.
      - id: dense-and-moe-comparison-project.base.v2.5
        prompt: In the toy experiment, the balancing bias is added to the router's scores only when choosing experts. What does it change?
        options:
          - id: a
            text: Which experts each token goes to, spreading the load
          - id: c
            text: How many experts each token uses per layer
          - id: b
            text: The gate weights used to mix the experts' outputs
        answer: a
        feedback: The bias shifts the ranking, so busy experts lose some tokens to idle ones. The gates still come from the original scores, and the number of experts per token stays at 2.
  - id: dense-and-moe-comparison-project.calculate
    objective_ref: objective.dense-and-moe-comparison-project
    task: base
    response_type: numeric
    points: 1
    hint: 'Total = shared + (experts per layer × expert size × layers). Active = shared + (k × expert size × layers). Memory = total × bytes per weight. Share of experts touched by B tokens = 1 − (1 − k/N)^B.'
    remediation_scene: dense-and-moe-comparison-project.s2
    absolute_tolerance: 0.01
    variants:
      - id: dense-and-moe-comparison-project.calculate.1
        prompt: An MoE has 10 layers, each with 8 experts of 100 million weights, plus 500 million shared weights. What is its total parameter count, in billions?
        answer: 8.5
        feedback: 'Experts: 10 × 8 × 100M = 8.0B. Add the shared 0.5B: 8.5B in total.'
      - id: dense-and-moe-comparison-project.calculate.2
        prompt: An MoE has 10 layers, each with 8 experts of 100 million weights and top-2 routing, plus 500 million shared weights. What is its active parameter count per token, in billions?
        answer: 2.5
        feedback: 'Each token uses 2 experts in each of 10 layers: 2 × 10 × 100M = 2.0B, plus the shared 0.5B = 2.5B. Taking 2/8 of the total (2.125B) would drop part of the shared weights.'
      - id: dense-and-moe-comparison-project.calculate.3
        prompt: An MoE has 8.5 billion parameters in total and 2.5 billion active. How many gigabytes do its weights take at 2 bytes each?
        answer: 17
        feedback: Memory follows the total, 8.5B × 2 bytes = 17 GB. Using the active count would give 5 GB, which is only one token's share.
      - id: dense-and-moe-comparison-project.calculate.4
        prompt: A router sends each token to 2 of 8 experts, spread evenly. What share of the experts does a batch of 4 tokens touch, as a decimal?
        answer: 0.68
        feedback: 'Each expert is missed by one token with probability 6/8, and by all 4 with 0.75⁴ ≈ 0.316. So about 1 − 0.316 = 0.684 of the experts are touched.'
      - id: dense-and-moe-comparison-project.calculate.5
        prompt: A batch of 512 tokens goes to 32 experts with top-2 routing and a capacity factor of 1.5. How many slots does each expert get?
        answer: 48
        feedback: 'Capacity = 1.5 × 512 × 2 / 32 = 48. An even share would be 32; the extra 16 slots are headroom for uneven routing.'
  - id: dense-and-moe-comparison-project.transfer.v2
    objective_ref: objective.dense-and-moe-comparison-project
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Before comparing two models, list everything that differs besides the architecture, and check which budget (memory, compute, batch, hardware) each number depends on.'
    remediation_scene: dense-and-moe-comparison-project.s4
    variants:
      - id: dense-and-moe-comparison-project.transfer.v2.1
        prompt: 'A headline says MoE X beats dense model Y by 5 points. X was trained on 3 times as many tokens and with a newer post-training recipe. What can you conclude about MoE designs?'
        options:
          - id: b
            text: MoE designs add about 5 points at a model of this size
          - id: a
            text: Little, since data and recipe changed with the design
          - id: c
            text: Dense designs would come out ahead once data is matched
        answer: a
        feedback: Three things changed at once, so the 5 points can't be split between them. Crediting the architecture, or concluding the reverse, both claim knowledge the comparison doesn't have. A matched experiment would change only the architecture.
      - id: dense-and-moe-comparison-project.transfer.v2.2
        prompt: 'A team has a 12 GB GPU and one user. Which of D (2.7 GB of weights) and M (14.4 GB of weights, same compute per token) can they serve?'
        options:
          - id: a
            text: D, because M's weights don't fit in 12 GB
          - id: b
            text: M, because its compute per token matches D's
          - id: c
            text: M, because only its 1.4B active weights must fit
        answer: a
        feedback: Every expert must be resident, so M needs 14.4 GB before any cache. Equal compute doesn't help if the weights don't fit; M would need quantization or expert offloading.
      - id: dense-and-moe-comparison-project.transfer.v2.3
        prompt: 'Vendor A reports 900 tokens per second for an MoE at batch 64 on 8 GPUs. Vendor B reports 120 tokens per second for a dense model at batch 1 on 1 GPU. What follows?'
        options:
          - id: c
            text: The dense model is faster per GPU, 120 against about 112
          - id: b
            text: The MoE is about 7.5 times faster than the dense model
          - id: a
            text: Nothing yet; batch size and hardware differ between them
        answer: a
        feedback: Throughput depends on batch size, GPU count, precision, and sequence lengths. Dividing by GPUs still leaves batch 64 against batch 1, where an MoE touches nearly every expert. Ask for both models at the same operating point.
      - id: dense-and-moe-comparison-project.transfer.v2.4
        prompt: A deployed MoE is well balanced on normal traffic, but a burst of code requests sends one expert 77 assignments when it has 40 slots. What is a sensible serving fix?
        options:
          - id: b
            text: Lower the capacity factor so the burst is dropped sooner
          - id: a
            text: Hold an extra copy of the busy expert to split its traffic
          - id: c
            text: Switch to top-1 routing, so each token uses one expert
        answer: a
        feedback: A redundant copy of a hot expert splits its load, which is what DeepSeek-V3's deployment does. Lowering capacity drops even more work, and top-1 routing halves total assignments but leaves the same expert the favorite.
      - id: dense-and-moe-comparison-project.transfer.v2.5
        prompt: A paper compares an MoE and a dense model "of the same size." What should you check first?
        options:
          - id: a
            text: Whether "size" means total or active parameters
          - id: c
            text: Whether both models used the same number of experts
          - id: b
            text: Which of the two has the larger vocabulary
        answer: a
        feedback: Same total means the MoE does far less arithmetic per token; same active means it stores far more weights. The two comparisons answer different questions. A dense model has no experts to count.
