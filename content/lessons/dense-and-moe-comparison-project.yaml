scenes:
  - id: dense-and-moe-comparison-project.s1
    title: 'Your brief: pick an architecture for one GPU'
    type: explanation
    depth: intuition
    objective_refs:
      - objective.dense-and-moe-comparison-project
    markdown: |-
      A small team is about to pretrain an in-house assistant and has narrowed it to two designs with the same width, depth, and attention. Model **D** is dense: every token uses its whole feed-forward block. Model **M** is a **mixture of experts (MoE)**: each layer has 16 smaller feed-forward "experts," and a router sends each token to 2 of them. The team lead, Priya, has one question: *"Which one do we build, given that we'll serve it on a single 24 GB GPU?"*

      | Brief | |
      | --- | --- |
      | Goal | Compare D and M on parameters, memory, compute, cache, and routing behavior, then recommend one |
      | Reader | Priya, who knows what a GPU is but hasn't read the MoE papers |
      | Data | Two model configurations (next page) and a toy router you'll run |
      | Time | About an hour; the spreadsheet version takes about the same |

      **Done looks like:**

      - an accounting table with total and active parameters, weight memory, forward and training compute, and KV cache for both models;
      - the weight bytes read per decoding step at batch 1 and batch 16;
      - a toy router run showing load, dropped tokens, and experts touched per batch;
      - a half-page memo with a recommendation, the budget you held fixed, and three things a quality comparison would also have to control.

      Everything you need is in module 18, on mixture-of-experts systems, especially "Count total capacity and active work separately" and "Serve sparse models under real traffic."
    bridges: []
  - id: dense-and-moe-comparison-project.s2
    title: 'Milestone 1: count total and active parameters'
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.dense-and-moe-comparison-project
    markdown: |-
      Both models share this blueprint:

      | Setting | D (dense) | M (MoE) |
      | --- | ---: | ---: |
      | Width $d$ | 2,048 | 2,048 |
      | Layers | 24 | 24 |
      | Vocabulary | 32,000 | 32,000 |
      | Attention per layer | $4d^2$ | $4d^2$ |
      | Feed-forward | 1 block, inner width 5,632 | 16 experts, inner width 2,816 each, top-2 |
      | Router per layer | none | $d \times 16$ |

      Each feed-forward block or expert is a SwiGLU with three matrices, so it holds $3 \times d \times \text{inner width}$ weights. The embedding table and output head hold $2 \times 32{,}000 \times d$.

      Notice the design choice: two experts of width 2,816 add up to exactly one dense block of width 5,632. M was built to do the **same feed-forward work per token** as D, the way the lesson "Separate always-on experts from routed specialists" matches active width before comparing.

      :::predict Before you calculate: roughly how many times larger is M's total than D's, and how do their active counts compare?
      About 5 times larger in total, with nearly equal active counts. The feed-forward weights are most of each model, and M stores 8 times D's feed-forward weights (16 half-size experts against one full block), while every token still uses the equivalent of one full block.
      :::

      This calculator does the whole table. Change the configurations to test your own designs.

      ```python run
      # Two invented models with the same width, depth, attention, and vocabulary
      d, layers, vocab = 2048, 24, 32000
      attn = 4 * d * d                        # Wq, Wk, Wv, Wo
      embed = 2 * vocab * d                   # input table + output head

      def count(n_experts, top_k, d_ff):
          expert = 3 * d * d_ff               # SwiGLU feed-forward: 3 matrices
          router = d * n_experts if n_experts > 1 else 0
          total = embed + layers * (attn + router + n_experts * expert)
          active = embed + layers * (attn + router + top_k * expert)
          return total, active

      tokens = 100e9                          # training tokens for both models
      for name, cfg in [("dense  D", (1, 1, 5632)), ("MoE    M", (16, 2, 2816))]:
          total, active = count(*cfg)
          print(f"{name}: total {total / 1e9:6.3f} B  active {active / 1e9:5.3f} B  "
                f"weights {2 * total / 1e9:5.1f} GB  forward {2 * active / 1e9:4.2f} GFLOP/token  "
                f"training {6 * active * tokens:.2e} FLOPs")

      kv_per_token = 2 * layers * d * 2       # K and V, every layer, 2 bytes each
      print(f"KV cache: {kv_per_token / 1e6:.3f} MB per token, same for both; "
            f"8 users x 4,096 tokens = {kv_per_token * 8 * 4096 / 1e9:.1f} GB")
      ```

      **What you should see:**

      ```text
      dense  D: total  1.364 B  active 1.364 B  weights   2.7 GB  forward 2.73 GFLOP/token  training 8.19e+20 FLOPs
      MoE    M: total  7.178 B  active 1.365 B  weights  14.4 GB  forward 2.73 GFLOP/token  training 8.19e+20 FLOPs
      KV cache: 0.197 MB per token, same for both; 8 users x 4,096 tokens = 6.4 GB
      ```

      The only difference in active parameters is M's 24 small routers, 0.8 million weights in all.
    bridges:
      - arithmetic
      - algorithm-cost
  - id: dense-and-moe-comparison-project.s3
    title: 'Milestone 2: memory, compute, and the cache'
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.dense-and-moe-comparison-project
    markdown: |-
      Read the accounting one row at a time. Each row answers a different budget question:

      | Question | Which count sets it | D | M |
      | --- | --- | ---: | ---: |
      | Weight memory at 2 bytes | Total | 2.7 GB | 14.4 GB |
      | Forward compute per token | Active, ≈ 2 FLOPs per weight | 2.73 GFLOP | 2.73 GFLOP |
      | Training compute for 100B tokens | Active, $C \approx 6ND$ | $8.2 \times 10^{20}$ | $8.2 \times 10^{20}$ |
      | KV cache per token | Attention layout | 0.197 MB | 0.197 MB |

      The training cost uses the active count, as "Count total capacity and active work separately" showed. The KV cache, the saved keys and values from earlier tokens, is identical, because the two models have the same attention; experts live only in the feed-forward blocks. On Priya's 24 GB GPU, M's weights plus 6.4 GB of cache for 8 users take 20.8 GB. It fits, with little room to spare.

      **Bytes read per decoding step.** Generating one token at a time is usually limited by how fast the GPU reads weights, so count bytes per step. D reads all 2.73 GB every step, whatever the batch. For M, treat the 1.07 GB of shared weights (attention, embeddings, routers) as read every step, plus 0.83 GB for each expert slot touched across the 24 layers. With routing spread evenly, the expected share of experts touched by a batch of $B$ tokens is $1 - (1 - 2/16)^B$.

      :::predict At batch 1, M reads the same 2.73 GB as D. What does it read at batch 16?
      At batch 16, $1 - (14/16)^{16} \approx 88\%$ of expert slots are touched, so M reads $1.07 + 16 \times 0.83 \times 0.88 \approx 12.8$ GB per step, against D's 2.73 GB. Per token, that's 0.80 GB for M against 0.17 GB for D. Equal arithmetic, but nearly five times the memory traffic at this batch size, which is the batching effect from "Serve sparse models under real traffic."
      :::

      :::mixup "M activates only 1.4B parameters per token, so it needs about 2.7 GB of memory."
      Every expert has to be resident, because the next token might pick any of them. Budget memory from the total (14.4 GB) and arithmetic from the active count. Mixtral 8x7B makes the same point at scale: about 12.9B active, but about 93 GB of weights at 2 bytes.
      :::
    bridges: []
  - id: dense-and-moe-comparison-project.router
    title: 'Milestone 3: run a toy router'
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.dense-and-moe-comparison-project
    markdown: |-
      The accounting assumed routing is even. Real routers aren't, at least not before something balances them. This experiment gives M's router a toy 8-number hidden vector per token, drawn from four topics (think code, chat, maths, and news), and measures three things you met in module 18:

      - **Load and drops.** With a capacity factor of 1.25 (room for 25% more than an even share), each expert has $1.25 \times 256 \times 2 / 16 = 40$ slots per batch of 256 tokens; assignments past that are dropped, as in "Keep expert loads from overwhelming the execution plan."
      - **Balancing.** A selection-only bias per expert, nudged down when the expert is overloaded and up when it's underloaded: the auxiliary-loss-free method DeepSeek-V3 uses.
      - **Experts touched per batch,** compared with the even-routing formula from milestone 2.

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      N, k, dim, T = 16, 2, 8, 256                     # experts, top-k, toy width, tokens/batch
      W_r = rng.normal(0, 1, (dim, N))                 # an untrained router
      topics = rng.normal(0, 1, (4, dim))              # 4 topics: code, chat, maths, news
      b = np.zeros(N)                                  # selection-only bias per expert

      def batch(B, mix=(0.25, 0.25, 0.25, 0.25)):
          return topics[rng.choice(4, size=B, p=mix)] + 0.7 * rng.normal(0, 1, (B, dim))

      def route(x):
          return np.argsort(-(x @ W_r + b), axis=1)[:, :k]   # top-k of score + bias

      def report(label, mix=(0.25,) * 4):
          load = np.bincount(route(batch(T, mix)).ravel(), minlength=N)
          cap = int(1.25 * T * k / N)                  # capacity factor 1.25 -> 40 slots
          print(f"{label:24} busiest {load.max():3}  idle {np.sum(load == 0):2}  "
                f"dropped {np.maximum(load - cap, 0).sum():3} of {T * k}")

      report("untrained, even topics")
      for step in range(200):                          # auxiliary-loss-free balancing
          load = np.bincount(route(batch(T)).ravel(), minlength=N)
          b -= 0.02 * np.sign(load - T * k / N)        # busy experts down, idle ones up
      report("balanced, even topics")
      report("balanced, code burst", (0.7, 0.1, 0.1, 0.1))

      print("batch  experts touched  if routing were random")
      for B in (1, 4, 16, 64):
          touched = np.mean([len(np.unique(route(batch(B)))) / N for _ in range(200)])
          print(f"{B:5}  {touched:15.0%}  {1 - (1 - k / N) ** B:21.0%}")
      ```

      **What you should see:**

      ```text
      untrained, even topics   busiest  68  idle  1  dropped 110 of 512
      balanced, even topics    busiest  40  idle  0  dropped   0 of 512
      balanced, code burst     busiest  77  idle  0  dropped  83 of 512
      batch  experts touched  if routing were random
          1              12%                    12%
          4              40%                    41%
         16              89%                    88%
         64             100%                   100%
      ```

      The untrained router piles 68 assignments on one expert and drops 110 of 512, about a fifth of the work. Two hundred rounds of bias nudging bring the busiest expert down to its 40 slots with nothing dropped. But balance is learned for the traffic it saw: when 70% of requests turn out to be code, one expert gets 77 assignments and 83 are dropped again. That's the **hot expert** problem, which deployments handle by holding extra copies of busy experts. Once balanced, the router touches experts at almost exactly the even-routing rate, so milestone 2's 12.8 GB estimate holds.

      :::try Two experiments
      In `report`, change the capacity factor from 1.25 to 2.0 and rerun: the code burst now drops 24 assignments instead of 83, but every expert reserves 64 slots, many of them padding. Then put 1.25 back and change `0.02` in the bias update to `0.002`: after 200 rounds the busiest expert still has 70 assignments and 81 are dropped, because each nudge is ten times smaller.
      :::
    bridges: []
  - id: dense-and-moe-comparison-project.s4
    title: 'Milestone 4: write the memo, and name the confounds'
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.dense-and-moe-comparison-project
    markdown: |-
      Priya will ask one more thing: *"But which one is smarter?"* Your accounting can't answer that. Only training both and evaluating them can, and then only if the comparison changes one thing at a time, as in "Change one thing and measure what follows."

      Published comparisons rarely manage that. Llama 3.1 405B (dense) and DeepSeek-V3 (MoE, 671B total, 37B active) differ in much more than architecture: their training data and token counts, their tokenizers, their training precision (DeepSeek-V3 used FP8 mixed-precision training), and their post-training recipes. The case-study lessons on each model trace those stages. A benchmark gap between them can't be credited to "dense versus MoE."

      A strong memo for Priya sounds like this:

      > D and M do the same arithmetic per token (2.73 GFLOP) and cost the same to train (about $8.2 \times 10^{20}$ FLOPs for 100B tokens). M stores 5.3 times as many weights, 14.4 GB against 2.7 GB. On our 24 GB GPU, M plus cache for 8 users uses 20.8 GB; D uses 9.2 GB. At batch 1 both read 2.7 GB of weights per step; at batch 16, M reads about 12.8 GB, so it will decode more slowly per step. A toy router needed balancing to avoid dropping a fifth of its work, and a burst of one topic brought drops back. M's extra capacity may improve quality, but we can only know by training both on the same data, tokenizer, and post-training recipe and comparing them on the same tests. Recommendation: build D for the single-GPU launch, and run a small matched M experiment before the next hardware purchase.

      Notice what it holds fixed (compute per token), what it measured, and what it leaves as unknown.
    bridges: []
  - id: dense-and-moe-comparison-project.mistakes
    title: Six accounting mistakes and their fingerprints
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.dense-and-moe-comparison-project
    markdown: |-
      | Mistake | How to spot it | Fix |
      | --- | --- | --- |
      | Memory from active parameters | M "fits in 2.7 GB" | Memory follows the total: every expert is resident |
      | Training compute from total parameters | M "costs 5 times as much to train" | $6ND$ uses the active count |
      | Counting a "top-2 of 16" model as 2/16 of the total | The shared weights vanish from your active count | Active = shared + $k$ experts per layer |
      | Different cache for the MoE | M's KV cache comes out larger | The cache follows the attention layout, identical here |
      | Batch-1 speed quoted for every workload | "M decodes as fast as D" with no batch size | Report bytes per step at the batch sizes you'll serve |
      | Architecture credited for a quality gap | Two published models compared with different data and recipes | List what else differs; call the architecture effect unknown |
    bridges: []
  - id: dense-and-moe-comparison-project.rubric
    title: The no-code path and the rubric
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.dense-and-moe-comparison-project
    markdown: |-
      **No code?** Milestones 1 and 2 are spreadsheet arithmetic: one row per model, one column per quantity, with the formulas from milestone 1. Check your cells against the expected output. For milestone 3, work the capacity and experts-touched formulas by hand ($1.25 \times 256 \times 2/16 = 40$ slots; $1 - 0.875^{B}$ for $B = 1, 4, 16$) and read the router experiment's printed results in place of running it.

      **Rubric.** Score each row 0, 1, or 2:

      | Criterion | 0: missing or wrong | 1: partly there | 2: solid |
      | --- | --- | --- | --- |
      | Parameter counts | Total and active confused | Both computed, one slip | Both right, with the router and shared weights included |
      | Memory, compute, cache | One number for everything | Memory and compute separated | Memory, forward, training, and cache each from the right count |
      | Batching | Not considered | Batch 1 only | Bytes per step at batch 1 and 16, read aloud |
      | Router experiment | Not done | Results reported | Drops, balance, and the hot-expert case explained |
      | Confounds | Architecture credited for quality | One confound named | Three confounds, and quality stated as unknown |
      | Memo | No recommendation | Recommendation without a fixed budget | Recommendation, budget held fixed, and a next step |

      The quiz below checks the ideas; this rubric, used by you or a colleague, judges your worksheet and memo.
    bridges: []
  - id: dense-and-moe-comparison-project.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.dense-and-moe-comparison-project
    markdown: |-
      Parameter counts and expert shares to compute, then a benchmark headline, a small GPU, two speed claims, and a hot expert test your accounting.
    takeaway: |-
      Total parameters set an MoE's memory; active parameters set its arithmetic and training cost. Say which budget you held fixed, check how batching and routing change the bytes read, and treat any quality gap between differently trained models as unexplained.
  - id: dense-and-moe-comparison-project.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.dense-and-moe-comparison-project
    markdown: |-
      Compare complete model lifecycles and operating costs. Separate total from activated parameters, and mark missing measurements as unknown.
