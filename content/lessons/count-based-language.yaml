assessment_families:
- id: count-based-language.base
  objective_ref: objective.count-based-language
  task: base
  response_type: single_choice
  points: 1
  hint: 'Downweight common collection terms: trace the inputs, operation, and result before choosing.'
  remediation_scene: count-based-language.s2
  variants:
  - id: count-based-language.base.1
    prompt: Which information does a basic bag-of-words representation discard?
    options:
    - id: c
      text: The vocabulary entirely
    - id: a
      text: Word order
    - id: b
      text: All word counts
    answer: a
    feedback: Counts alone do not retain the sequence arrangement.
    retired: true
  - id: count-based-language.base.2
    prompt: A continuation occurs 2 times among 8 observed contexts. What is its unsmoothed conditional estimate?
    options:
    - id: a
      text: '0.25'
    - id: b
      text: '0.5'
    - id: c
      text: '4'
    answer: a
    feedback: Divide the matching count by the total context count.
    retired: true
- id: count-based-language.transfer
  objective_ref: objective.count-based-language
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Compare the useful boundaries: trace the inputs, operation, and result before choosing.'
  remediation_scene: count-based-language.s4
  variants:
  - id: count-based-language.transfer.1
    prompt: A term occurs in every document. Under log(N/df), what is its IDF?
    options:
    - id: a
      text: '0'
    - id: b
      text: '1'
    - id: c
      text: N
    answer: a
    feedback: N/df is 1 and log(1) is zero.
    retired: true
  - id: count-based-language.transfer.2
    prompt: A new n-gram never occurred in training. What modeling choice can avoid an automatic zero probability?
    options:
    - id: b
      text: Only a larger font
    - id: c
      text: A rule that all new text is impossible
    - id: a
      text: Smoothing or backoff
    answer: a
    feedback: Sparse counts require a method for sharing or allocating probability to unseen events.
    retired: true
- id: count-based-language.base.v2
  objective_ref: objective.count-based-language
  task: base
  response_type: numeric_fields_with_reason
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: count-based-language.s3
  variants:
  - prompt: After one context, token A appears 3 times and B appears 1 times. No other continuation was observed.
      Without smoothing, record the total and probability of A as a decimal.
    answers:
      total: 4
      probability: 0.75
    reason_answer: a
    reason_options:
    - id: a
      text: Divide A’s count by this context’s total.
    - id: c
      text: Add one to A without changing the denominator.
    - id: b
      text: Divide A’s count by B’s count.
    feedback: Use observed continuation counts for this context; no smoothing was requested.
    id: count-based-language.base.v2.1
  - prompt: After one context, token A appears 2 times and B appears 3 times. No other continuation was observed.
      Without smoothing, record the total and probability of A as a decimal.
    answers:
      total: 5
      probability: 0.4
    reason_answer: a
    reason_options:
    - id: a
      text: Divide A’s count by this context’s total.
    - id: c
      text: Add one to A without changing the denominator.
    - id: b
      text: Divide A’s count by B’s count.
    feedback: Use observed continuation counts for this context; no smoothing was requested.
    id: count-based-language.base.v2.2
  - prompt: After one context, token A appears 1 times and B appears 4 times. No other continuation was observed.
      Without smoothing, record the total and probability of A as a decimal.
    answers:
      total: 5
      probability: 0.2
    reason_answer: a
    reason_options:
    - id: c
      text: Add one to A without changing the denominator.
    - id: b
      text: Divide A’s count by B’s count.
    - id: a
      text: Divide A’s count by this context’s total.
    feedback: Use observed continuation counts for this context; no smoothing was requested.
    id: count-based-language.base.v2.3
  - prompt: After one context, token A appears 6 times and B appears 2 times. No other continuation was observed.
      Without smoothing, record the total and probability of A as a decimal.
    answers:
      total: 8
      probability: 0.75
    reason_answer: a
    reason_options:
    - id: b
      text: Divide A’s count by B’s count.
    - id: a
      text: Divide A’s count by this context’s total.
    - id: c
      text: Add one to A without changing the denominator.
    feedback: Use observed continuation counts for this context; no smoothing was requested.
    id: count-based-language.base.v2.4
  numeric_fields:
  - id: total
    label: Observed continuation total
  - id: probability
    label: Probability of A
  absolute_tolerance: 1.0e-06
- id: count-based-language.transfer.v2
  objective_ref: objective.count-based-language
  task: transfer
  response_type: numeric_fields_with_reason
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: count-based-language.s3
  variants:
  - prompt: A context has 4 total observations; token A occurs 2 times. There are 4 allowed continuation tokens.
      With add-one smoothing, record A’s new numerator and the new denominator.
    answers:
      numerator: 3
      denominator: 8
    reason_answer: a
    reason_options:
    - id: b
      text: Add one to the total regardless of vocabulary size.
    - id: c
      text: Add the vocabulary size to A’s count.
    - id: a
      text: Add one per vocabulary entry to the total.
    feedback: The smoothed probability is (count(A)+1)/(context total+vocabulary size).
