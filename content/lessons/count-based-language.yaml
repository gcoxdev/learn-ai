schema_version: 0.2-draft
lesson:
  id: count-based-language
  version: 0.1.0-draft
  title: Represent text with counts and short contexts
  state: draft
  summary: Bag-of-words, TF-IDF, and n-gram models use frequency statistics with different context assumptions;
    smoothing and vocabulary choices determine how they handle unseen text.
  slot: M14.3
  category: learning
  minutes: 12
  sources:
  - title: Speech and Language Processing — authors’ draft
    url: https://web.stanford.edu/~jurafsky/slp3/
  - title: Introduction to Information Retrieval — authors’ online edition
    url: https://nlp.stanford.edu/IR-book/
objectives:
- id: objective.count-based-language
  version: 1-draft
  statement: Bag-of-words, TF-IDF, and n-gram models use frequency statistics with different context assumptions;
    smoothing and vocabulary choices determine how they handle unseen text.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - count-based-language.base
  - count-based-language.transfer
  prerequisites:
  - anyOf:
    - objective.probability
  - anyOf:
    - objective.language-structure
scenes:
- id: count-based-language.s1
  title: Count words and lose their order
  type: explanation
  depth: intuition
  objective_refs:
  - objective.count-based-language
  markdown: A bag-of-words representation records term counts without sequence order. “Dogs chase cats” and “Cats
    chase dogs” have the same counts in this toy vocabulary despite different meaning. This representation can still
    support useful topic or relevance signals when order is less important.
  text_mode: A bag-of-words representation records term counts without sequence order. “Dogs chase cats” and “Cats
    chase dogs” have the same counts in this toy vocabulary despite different meaning. This representation can still
    support useful topic or relevance signals when order is less important.
  bridges: []
- id: count-based-language.s2
  title: Downweight common collection terms
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.count-based-language
  markdown: TF-IDF combines a term’s within-document frequency with an inverse-document-frequency factor. A common
    factor uses log(N/df), where N is document count and df is the count containing the term. A term appearing everywhere
    receives little weight under this convention. Exact normalization and smoothing variants differ.
  text_mode: TF-IDF combines a term’s within-document frequency with an inverse-document-frequency factor. A common
    factor uses log(N/df), where N is document count and df is the count containing the term. A term appearing everywhere
    receives little weight under this convention. Exact normalization and smoothing variants differ.
  bridges:
  - powers-logs
- id: count-based-language.s3
  title: Estimate a short-context language model
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.count-based-language
  markdown: A bigram model predicts a token from the preceding token. If “the” is followed by “cat” three times
    among twelve observed continuations, a basic count estimate is 3/12 = 0.25. Longer n-grams retain more context
    but create sparse counts. Smoothing or backoff handles unseen combinations.
  text_mode: A bigram model predicts a token from the preceding token. If “the” is followed by “cat” three times
    among twelve observed continuations, a basic count estimate is 3/12 = 0.25. Longer n-grams retain more context
    but create sparse counts. Smoothing or backoff handles unseen combinations.
  bridges: []
- id: count-based-language.s4
  title: Compare the useful boundaries
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.count-based-language
  markdown: Count-based methods are inspectable and often strong baselines. They can struggle with long-distance
    dependencies, ambiguous senses, and rare strings. Changing tokenization changes the counted events. Evaluate
    the actual task and avoid treating a frequency association as a semantic or causal guarantee.
  text_mode: Count-based methods are inspectable and often strong baselines. They can struggle with long-distance
    dependencies, ambiguous senses, and rare strings. Changing tokenization changes the counted events. Evaluate
    the actual task and avoid treating a frequency association as a semantic or causal guarantee.
  bridges: []
- id: count-based-language.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.count-based-language
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Bag-of-words, TF-IDF, and n-gram models use frequency statistics with different context assumptions;
    smoothing and vocabulary choices determine how they handle unseen text.
- id: count-based-language.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.count-based-language
  markdown: Bag-of-words, TF-IDF, and n-gram models use frequency statistics with different context assumptions;
    smoothing and vocabulary choices determine how they handle unseen text.
  text_mode: Bag-of-words, TF-IDF, and n-gram models use frequency statistics with different context assumptions;
