schema_version: 0.2-draft
lesson:
  id: count-based-language
  version: 0.2.0-draft
  title: Represent text with counts and short contexts
  state: draft
  summary: Build a tiny word predictor with tally marks, then catch the mistakes that counting alone cannot solve.
  slot: M14.3
  category: learning
  sources:
  - title: Dive into Deep Learning — language models
    url: https://d2l.ai/chapter_recurrent-neural-networks/language-model.html
  archetype: mechanism
objectives:
- id: objective.count-based-language
  version: 2-draft
  statement: Calculate a conditional next-token distribution with and without add-one smoothing and explain its
    limits.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - count-based-language.base.v2
  - count-based-language.transfer.v2
  prerequisites:
  - anyOf:
    - objective.language-structure
  - anyOf:
    - objective.probability
scenes:
- id: count-based-language.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.count-based-language
  title: A predictor made from tally marks
  markdown: 'Imagine teaching a tiny story machine using the sentences “red cat END,” “red dog END,” and “red cat
    END.” Here each space-separated word is one **token**, a stored text piece. END marks the end of a sentence.
    A **bigram** is a pair of neighboring tokens. For this toy model, the next token depends on just the previous
    token. There are no neurons or gradients here: learning means collecting and storing counts from examples.'
  text_mode: 'Imagine teaching a tiny story machine using the sentences “red cat END,” “red dog END,” and “red cat
    END.” Here each space-separated word is one **token**, a stored text piece. END marks the end of a sentence.
    A **bigram** is a pair of neighboring tokens. For this toy model, the next token depends on just the previous
    token. There are no neurons or gradients here: learning means collecting and storing counts from examples.'
  bridges: []
- id: count-based-language.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.count-based-language
  title: Count only the relevant neighborhood
  markdown: After red, cat appears twice and dog once. There are three observed next-token events for that context.
    The estimated probability of cat after red is 2/3; dog gets 1/3. In words, count this continuation and divide
    by all continuations of red. The denominator is not the number of every word in the notebook. END transitions
    are counted after cat and dog separately. Sentence boundaries stop the last token of one story from accidentally
    joining the first token of another.
  text_mode: After red, cat appears twice and dog once. There are three observed next-token events for that context.
    The estimated probability of cat after red is 2/3; dog gets 1/3. In words, count this continuation and divide
    by all continuations of red. The denominator is not the number of every word in the notebook. END transitions
    are counted after cat and dog separately. Sentence boundaries stop the last token of one story from accidentally
    joining the first token of another.
  bridges:
  - probability
  - arithmetic
- id: count-based-language.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.count-based-language
  title: Read the distribution as a whole
  markdown: A **conditional probability** answers “how likely, given this context?” We can write P(cat | red); the
    vertical bar means “given.” Suppose the allowed vocabulary is red, cat, dog, END. Without smoothing, the red
    row is [0, 2/3, 1/3, 0]. It sums to one. Predicting the most frequent continuation chooses cat, while sampling
    could choose dog. Neither method can generate a new entry that is absent from the allowed vocabulary.
  text_mode: A **conditional probability** answers “how likely, given this context?” We can write P(cat | red);
    the vertical bar means “given.” Suppose the allowed vocabulary is red, cat, dog, END. Without smoothing, the
    red row is [0, 2/3, 1/3, 0]. It sums to one. Predicting the most frequent continuation chooses cat, while sampling
    could choose dog. Neither method can generate a new entry that is absent from the allowed vocabulary.
  bridges: []
- id: count-based-language.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.count-based-language
  title: Give unobserved possibilities a little room
  markdown: With **add-one smoothing**, add one imaginary count to every allowed continuation. The four-token vocabulary
    makes the denominator 3 + 4 = 7. The red row becomes [1/7, 3/7, 2/7, 1/7]. Now even END or red after red is
    possible. Smoothing avoids assigning zero probability merely because a small sample missed an event. It also
    spends probability on awkward continuations. This is an explicit modeling choice, not evidence that those continuations
    occurred.
  text_mode: With **add-one smoothing**, add one imaginary count to every allowed continuation. The four-token vocabulary
    makes the denominator 3 + 4 = 7. The red row becomes [1/7, 3/7, 2/7, 1/7]. Now even END or red after red is
    possible. Smoothing avoids assigning zero probability merely because a small sample missed an event. It also
    spends probability on awkward continuations. This is an explicit modeling choice, not evidence that those continuations
    occurred.
  bridges: []
- id: count-based-language.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.count-based-language
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Count what follows a context, divide by that context’s total, and keep unseen events possible when the
    chosen smoothing rule requires it.
- id: count-based-language.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.count-based-language
  markdown: Bag-of-words, TF-IDF, and n-gram models use frequency statistics with different context assumptions;
    smoothing and vocabulary choices determine how they handle unseen text.
  text_mode: Bag-of-words, TF-IDF, and n-gram models use frequency statistics with different context assumptions;
    smoothing and vocabulary choices determine how they handle unseen text.
- id: count-based-language.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.count-based-language
  title: Test on a story the notebook did not see
  markdown: Save the learned counts, vocabulary order, and smoothing rule before looking at evaluation examples.
    If the held-out continuation is dog after red, its probability is 2/7 under the smoothed model. A model assigning
    greater probability to that observed token gets a lower negative-log loss on that event. One event is too little
    evidence for broad quality. Compare models on the same untouched collection and disclose any choices made using
    those scores.
  text_mode: Save the learned counts, vocabulary order, and smoothing rule before looking at evaluation examples.
    If the held-out continuation is dog after red, its probability is 2/7 under the smoothed model. A model assigning
    greater probability to that observed token gets a lower negative-log loss on that event. One event is too little
    evidence for broad quality. Compare models on the same untouched collection and disclose any choices made using
    those scores.
  bridges:
  - powers-logs
- id: count-based-language.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.count-based-language
  title: Find the limit before adding complexity
  markdown: 'Our machine forgets everything except the preceding token. “The animal near the red” and “Pick a color,
    perhaps red” produce the same red row. A larger context window can distinguish more situations but creates many
    rarer count combinations. Neural language models learn shared numerical patterns to help with this sparsity.
    The counting machine remains useful: it makes context, fitting, probability, generation, and held-out evaluation
    visible without hiding them inside a large model.'
  text_mode: 'Our machine forgets everything except the preceding token. “The animal near the red” and “Pick a color,
    perhaps red” produce the same red row. A larger context window can distinguish more situations but creates many
    rarer count combinations. Neural language models learn shared numerical patterns to help with this sparsity.
    The counting machine remains useful: it makes context, fitting, probability, generation, and held-out evaluation
    visible without hiding them inside a large model.'
  bridges: []
- id: count-based-language.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.count-based-language
  title: Predict before you divide
  markdown: A context has counts cat=3 and dog=1, with four allowed continuation tokens. After add-one smoothing,
    what is P(cat | context)?
  text_mode: A context has counts cat=3 and dog=1, with four allowed continuation tokens. After add-one smoothing,
    what is P(cat | context)?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: 4/8
    - id: b
      text: 3/4
    - id: c
      text: 4/5
    answer: a
    reveal_markdown: 'Add one to the cat count and one to each of the four vocabulary entries: (3+1)/(4+4)=4/8.'
    hint: Trace the example using the rule from the preceding pages.
    id: count-based-language.practice.v2.7
