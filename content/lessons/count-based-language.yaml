          - id: b
            text: Divide by the row total; add-one adds 1 to the count and 1 to the total.
          - id: c
            text: Divide by all tokens in the corpus; add-one adds 1 to both parts.
        feedback: The unseen pair gets 0/6 = 0 without smoothing, which would make any sentence containing it impossible. Add-one gives (0 + 1)/(6 + 6) = 1/12 ≈ 0.083.
  - id: count-based-language.perplexity
    objective_ref: objective.count-based-language
    task: base
    response_type: numeric
    points: 1
    hint: Multiply the step probabilities to get the sentence probability, then take its N-th root and flip it over, where N is the number of predicted tokens (including the end marker).
    remediation_scene: count-based-language.s5
    absolute_tolerance: 0.01
    variants:
      - id: count-based-language.perplexity.1
        prompt: A bigram model gives each of the 4 predicted tokens in a test sentence probability 1/2. What is its perplexity on the sentence?
        answer: 2
        feedback: The sentence probability is (1/2)⁴ = 1/16, and 16^(1/4) = 2. When every step has the same probability p, perplexity is simply 1/p.
      - id: count-based-language.perplexity.2
        prompt: A model predicts 3 tokens of a test sentence with probabilities 1/4, 1/2, and 1/2. What is its perplexity?
        answer: 2.52
        feedback: The product is 1/16, and with N = 3 the perplexity is 16^(1/3) ≈ 2.52. Using N = 4 by mistake would give 2.
      - id: count-based-language.perplexity.3
        prompt: A test sentence has probability 1/81 under a bigram model, and the model predicts 4 tokens in it. What is the perplexity?
        answer: 3
        feedback: 81^(1/4) = 3, since 3⁴ = 81. The model was as unsure as choosing among 3 equally likely words at each step.
      - id: count-based-language.perplexity.4
        prompt: Over a held-out file, a model's average negative natural-log probability per token is 1.5. What is its perplexity?
        answer: 4.48
        feedback: Perplexity is e raised to the average negative log probability, e^1.5 ≈ 4.48. With base-2 logs you'd compute 2 to that power instead.
  - id: count-based-language.transfer.v3
    objective_ref: objective.count-based-language
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask whether the problem is a zero count, a count spread too thin, or a measurement taken on the wrong text.
    remediation_scene: count-based-language.s6
    variants:
      - id: count-based-language.transfer.v3.1
        prompt: A bigram autocomplete trained on recipes gives every word after "vegan" probability 0, because "vegan" never appeared in training. Which change targets this?
        options:
          - id: b
            text: Switch to trigrams so each prediction uses more context
          - id: a
            text: Smooth or back off, so unseen contexts still get probabilities
          - id: c
            text: Delete "vegan" from users' text before predicting
        answer: a
        feedback: The zero comes from missing counts, which smoothing or backing off to a shorter context handles. Trigrams need even more matching history, so they'd have more zeros, and deleting words hides the problem.
      - id: count-based-language.transfer.v3.2
        prompt: Two bigram models are scored on the same held-out emails with the same tokenizer. Model A has perplexity 120 and model B has 95. What can you conclude?
        options:
          - id: c
            text: A is better, since a higher perplexity means it knows more words
          - id: a
            text: B was less surprised by the held-out words, on average
          - id: b
            text: B will write replies that are more accurate than A's
        answer: a
        feedback: Lower perplexity means the model gave higher probability to the words that actually came next. That's a statement about predicting this text, not about vocabulary size or the accuracy of anything it writes.
      - id: count-based-language.transfer.v3.3
        prompt: Moving from a bigram to a 5-gram model trained on the same small corpus, held-out perplexity gets worse. What is the most likely reason?
        options:
          - id: a
            text: Most 5-word contexts in the new text never occurred in training
          - id: b
            text: Longer contexts carry less information than shorter ones do
          - id: c
            text: The 5-gram model memorized fewer pairs than the bigram model
        answer: a
        feedback: Each extra word of context makes exact matches rarer, so the 5-gram model keeps hitting unseen contexts. Longer contexts carry more information in principle; the problem is too few counts to use it.
      - id: count-based-language.transfer.v3.4
        prompt: A student trains a bigram model on 500 sentences and reports a perplexity of 1.7, measured on those same 500 sentences. What is the problem?
        options:
          - id: b
            text: Perplexity should be measured before any smoothing is applied
          - id: c
            text: A perplexity below 2 can't happen for real English text
          - id: a
            text: The training text flatters the model; score it on held-out text
        answer: a
        feedback: A model has seen every pair in its training text, so it's rarely surprised there. Only new sentences show how it handles unseen pairs. Smoothing is part of the model, and low perplexities are possible on easy text.
