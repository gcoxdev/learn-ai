scenes:
  - id: count-based-language.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.count-based-language
    title: A language model made from a book
    markdown: |-
      In 1948, in "A Mathematical Theory of Communication," Claude Shannon generated fake English without a computer. He opened a book at random and picked a word. Then he turned to another page, read until he found that word, and wrote down the word that came *next*. Then he turned the page again, searched for *that* word, and repeated. His result began:

      > THE HEAD AND IN FRONTAL ATTACK ON AN ENGLISH WRITER THAT THE CHARACTER OF THIS POINT IS THEREFORE ANOTHER METHOD FOR THE LETTERS…

      Nonsense, but every neighboring pair of words sounds like English. Shannon had built a **bigram model**: it predicts each word from the one word before it. (A bigram is a pair of neighboring words; an *n*-gram is a run of *n* of them.)

      We'll build one from a tiny training set of three sentences:

      - `<s> cats like milk </s>`
      - `<s> cats like fish </s>`
      - `<s> dogs like fish </s>`

      `<s>` marks a sentence start and `</s>` its end, so the model can learn how sentences begin and when to stop. Each word or marker is one **token**. Training this model means nothing more than counting.
    bridges: []
  - id: count-based-language.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.count-based-language
    title: Count what follows each word
    markdown: |-
      Go through the three sentences and tally every neighboring pair:

      | After… | cats | dogs | like | milk | fish | `</s>` | Total |
      | --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
      | `<s>` | 2 | 1 | | | | | 3 |
      | cats | | | 2 | | | | 2 |
      | dogs | | | 1 | | | | 1 |
      | like | | | | 1 | 2 | | 3 |
      | milk | | | | | | 1 | 1 |
      | fish | | | | | | 2 | 2 |

      To estimate the chance of *fish* after *like*, divide that pair's count by the row total: $P(\text{fish} \mid \text{like}) = 2/3$. The bar means "given." Using raw counts this way is called the **maximum likelihood estimate (MLE)**, because these are the probabilities that make the training text as likely as possible.

      :::predict What is P(like | dogs)? And P(milk | cats)?
      *Dogs* was followed once, by *like*, so $P(\text{like} \mid \text{dogs}) = 1/1 = 1$. *Cats* was never directly followed by *milk* (*like* sits in between), so $P(\text{milk} \mid \text{cats}) = 0/2 = 0$. Always divide by the total for *that* row, not by the number of words in the corpus.
      :::
    diagram:
      caption: The bigram model as a map. Each arrow is a possible next word, labeled with its MLE probability.
      description: From the start marker, the model goes to "cats" with probability 2/3 or "dogs" with 1/3. Both "cats" and "dogs" go to "like" with probability 1. From "like" it goes to "milk" with 1/3 or "fish" with 2/3. Both "milk" and "fish" go to the end marker with probability 1.
      nodes:
        - id: start
          label: <s>
          col: 0
          row: 1
          tone: muted
        - id: cats
          label: cats
          col: 1
          row: 0
        - id: dogs
          label: dogs
          col: 1
          row: 2
        - id: like
          label: like
          col: 2
          row: 1
          tone: accent
        - id: milk
          label: milk
          col: 3
          row: 0
        - id: fish
          label: fish
          col: 3
          row: 2
        - id: end
          label: </s>
          col: 4
          row: 1
          tone: muted
      edges:
        - from: start
          to: cats
          label: 2/3
        - from: start
          to: dogs
          label: 1/3
        - from: cats
          to: like
          label: "1"
        - from: dogs
          to: like
          label: "1"
        - from: like
          to: milk
          label: 1/3
        - from: like
          to: fish
          label: 2/3
        - from: milk
          to: end
          label: "1"
        - from: fish
          to: end
          label: "1"
    bridges:
      - probability
      - arithmetic
  - id: count-based-language.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.count-based-language
    title: Multiply along the sentence
    markdown: |-
      To score a whole sentence, multiply the probability of each step. For "dogs like milk":

      $$P(\text{dogs like milk}) = P(\text{dogs} \mid \langle s\rangle)\, P(\text{like} \mid \text{dogs})\, P(\text{milk} \mid \text{like})\, P(\langle /s\rangle \mid \text{milk}) = \tfrac{1}{3} \times 1 \times \tfrac{1}{3} \times 1 = \tfrac{1}{9}$$

      The model never saw this sentence, but it has seen each of its pairs.

      Now try "dogs like cats." The step $P(\text{cats} \mid \text{like})$ is $0/3 = 0$, so the whole product is 0. One unseen pair makes a perfectly reasonable sentence *impossible*. With real text this happens constantly.
    bridges: []
  - id: count-based-language.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.count-based-language
    title: Add one to everything
    markdown: |-
      The simplest fix is **add-one smoothing** (also called Laplace smoothing): pretend every possible pair occurred one extra time. Six tokens can follow a word here (cats, dogs, like, milk, fish, `</s>`), so the vocabulary size is $V = 6$.

      :::papers Add-one (Laplace) smoothing
      $$P_{\text{add-1}}(w \mid w_{\text{prev}}) = \frac{c(w_{\text{prev}}\, w) + 1}{c(w_{\text{prev}}) + V}$$

      $c(w_{\text{prev}}\,w)$ is the pair count, $c(w_{\text{prev}})$ is the row total, and adding $V$ to the denominator keeps each row summing to 1. For the *like* row: $c(\text{like}) = 3$, so every entry has denominator $3 + 6 = 9$.
      :::

      | After *like* | cats | dogs | like | milk | fish | `</s>` |
      | --- | ---: | ---: | ---: | ---: | ---: | ---: |
      | MLE | 0 | 0 | 0 | 1/3 | 2/3 | 0 |
      | Add-one | 1/9 | 1/9 | 1/9 | 2/9 | 3/9 | 1/9 |

      "Dogs like cats" is now possible. But look at *fish*: it fell from 2/3 to 1/3.

      :::mixup "Smoothing only gives probability to unseen words; the seen ones keep theirs."
      Every row must still add up to 1, so the probability given to unseen words is taken from the seen ones. With small counts and a large vocabulary, add-one takes a lot: with 50,000 possible words, a context seen 10 times would give its most common continuation (seen 8 times) only $9 / 50{,}010 \approx 0.0002$. That's why practical n-gram systems used gentler methods, such as backoff (fall back to a shorter context when a pair is unseen) and Kneser–Ney smoothing.
      :::
    bridges: []
  - id: count-based-language.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.count-based-language
    title: Measure surprise on new sentences
    markdown: |-
      Which model is better? Test each on sentences it didn't train on, and measure how surprised it is. **Perplexity** is the standard measure: take the probability of the test text, then undo the fact that longer texts get smaller probabilities by taking the $N$-th root, where $N$ is the number of predicted tokens.

      :::papers Perplexity
      $$\text{PP} = P(w_1 \dots w_N)^{-1/N} = \exp\!\Big(-\frac{1}{N}\sum_{i=1}^{N} \ln P(w_i \mid w_{i-1})\Big)$$

      For "dogs like milk" there are $N = 4$ predictions (dogs, like, milk, `</s>`), and the MLE probability is $1/9$, so $\text{PP} = 9^{1/4} \approx 1.732$.
      :::

      A perplexity of 1.732 means the model was, on average, about as unsure as if it were choosing among 1.7 equally likely words at each step. Lower is better. The code below computes perplexity both ways.

      ```python run
      from collections import Counter
      import math

      train = ["cats like milk", "cats like fish", "dogs like fish"]
      pairs, context = Counter(), Counter()
      for s in train:
          w = ["<s>"] + s.split() + ["</s>"]
          for a, b in zip(w, w[1:]):
              pairs[(a, b)] += 1                 # count each neighboring pair
              context[a] += 1                    # and how often a is followed by anything
      V = 6                                      # next-word choices: cats dogs like milk fish </s>

      def prob(a, b, add_one):
          if add_one:
              return (pairs[(a, b)] + 1) / (context[a] + V)
          return pairs[(a, b)] / context[a]

      def perplexity(sentence, add_one):
          w = ["<s>"] + sentence.split() + ["</s>"]
          ps = [prob(a, b, add_one) for a, b in zip(w, w[1:])]
          if 0 in ps:
              return math.inf                    # one impossible step sinks the sentence
          return math.exp(-sum(math.log(p) for p in ps) / len(ps))

      print("P(fish | like) =", round(prob("like", "fish", False), 3),
            " add-one:", round(prob("like", "fish", True), 3))
      for test in ["dogs like milk", "dogs like cats"]:
          print(f"{test:15} MLE perplexity {perplexity(test, False):6.3f}"
                f"   add-one perplexity {perplexity(test, True):6.3f}")
      ```

      The output shows the trade. On "dogs like milk," smoothing *raises* perplexity from 1.732 to 3.969, because it moved probability away from pairs the model had seen. On "dogs like cats," MLE's perplexity is infinite and add-one's is 5.803. Try adding "dogs like milk" to `train`, and predict which numbers fall.
    bridges:
      - powers-logs
  - id: count-based-language.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.count-based-language
    title: Why counting hit a wall
    markdown: |-
      A bigram model forgets everything but the last word. After "The keys to the cabinet," it can't tell whether the next word should be *is* or *are*, because it sees only "cabinet." Longer n-grams remember more, but each extra word makes contexts rarer: most 5-word runs in a new paragraph never appeared in training, so their counts are zero.

      Counting also can't share what it learns. Seeing "cats like fish" teaches this model nothing about "kittens like fish," because *cats* and *kittens* are just different rows. In 2003, Yoshua Bengio and colleagues trained a neural network to predict the next word from learned word vectors, so similar words could share evidence. Those vectors, called embeddings, are two lessons ahead.

      Counts still power many tools. Drop order altogether and you get the bag of words from the lesson on words and structure. Weight each word's count by how rare it is across documents (**TF-IDF**, term frequency times inverse document frequency) and you have the classic scoring behind keyword search.
    bridges: []
  - id: count-based-language.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.count-based-language
    markdown: A few bigram probabilities and perplexities to compute by hand, then an autocomplete, a 5-gram, and a model graded on its own training text.
    takeaway: |-
      A bigram model divides each pair's count by its row total; add-one smoothing adds 1 to every count and V to every total. Perplexity measures how surprised a model is by new text, and lower is better.
  - id: count-based-language.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.count-based-language
    markdown: |-
      Bag-of-words, TF-IDF, and n-gram models use frequency statistics with different context assumptions; smoothing and vocabulary choices determine how they handle unseen text.
  - id: count-based-language.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.count-based-language
    title: Predict before you divide
    markdown: |-
      A context has counts cat=3 and dog=1, with four allowed continuation tokens. After add-one smoothing, what is P(cat | context)?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: 4/8
        - id: b
          text: 3/4
        - id: c
          text: 4/5
      answer: a
      reveal_markdown: "Add one to the cat count, and add one for each of the four possible tokens to the total: (3 + 1) / (4 + 4) = 4/8. Using 3/4 forgets smoothing; 4/5 adds one to the total instead of one per possible token."
      hint: Use the add-one formula from the smoothing step. The numerator gets +1; the denominator gets +V, one for every possible next token.
      id: count-based-language.practice.v2.7
