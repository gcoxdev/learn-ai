        - id: pseudo
          label: Pseudo-label "lamp"
          note: kept only if confidence ≥ 0.95
          col: 3
          row: 0
          tone: warn
        - id: loss
          label: Cross-entropy loss
          note: train strong view to say "lamp"
          col: 3
          row: 2
          tone: accent
      edges:
        - from: photo
          to: weak
        - from: photo
          to: strong
        - from: weak
