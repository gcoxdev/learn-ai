          label: model prediction
        - from: pseudo
          to: loss
          label: target
    bridges: []
  - id: semi-supervised-and-weak-learning.s3
    title: Rules of thumb as noisy voters
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.semi-supervised-and-weak-learning
    markdown: |-
      The marketplace also wants to flag counterfeit listings, and it has no labels for that at all. But the trust-and-safety team knows rules of thumb. In **Snorkel** (Ratner et al., 2017), each rule becomes a **labeling function**: a small program that votes "counterfeit", votes "genuine", or abstains.

      | Labeling function | Votes | Accuracy when it votes |
      | --- | --- | ---: |
      | Text says "replica" or "inspired by" | counterfeit | 0.90 |
      | Price below 30% of retail | counterfeit | 0.70 |
      | Seller is a verified brand store | genuine | 0.95 |

      A plain majority vote treats them as equals. A better combination gives each function a weight of $\log\frac{a}{1-a}$ for accuracy $a$: 2.20, 0.85, and 2.94. If the functions make mistakes independently and both classes are equally common, adding weighted votes is the log-odds addition of naive Bayes, and a sigmoid turns the total into a probability.

      ```python run
      import math

      # Each labeling function: its accuracy when it votes (estimated on 300 hand-checked listings)
      accuracy = {"says_replica": 0.90, "very_cheap": 0.70, "brand_store": 0.95}
      weight = {f: math.log(a / (1 - a)) for f, a in accuracy.items()}   # log-odds weight

      # Votes: 1 = counterfeit, 0 = genuine; a function that abstains is simply missing
      votes = {
          "L1": {"says_replica": 1, "very_cheap": 1},
          "L2": {"very_cheap": 1, "brand_store": 0},
          "L3": {"says_replica": 1, "very_cheap": 1, "brand_store": 0},
      }

      print("weights:", {f: round(w, 2) for f, w in weight.items()})
      for listing, v in votes.items():
          fake = sum(1 for x in v.values() if x == 1)
          real = len(v) - fake
          majority = "counterfeit" if fake > real else "genuine" if real > fake else "tie"
          score = sum(weight[f] if x == 1 else -weight[f] for f, x in v.items())
          p_fake = 1 / (1 + math.exp(-score))
          print(f"{listing}: votes {fake}-{real}  majority {majority:11s}  "
                f"weighted score {score:+.2f}  P(counterfeit) = {p_fake:.2f}")
      ```

      Listing L2 is a 1–1 tie by majority, but the brand-store vote outweighs the cheap-price vote: P(counterfeit) = 0.11. L3 wins 2–1 by majority yet comes out a near coin toss, 0.53. Change `very_cheap` to 0.90 and watch L3 climb to 0.81.

      Snorkel's **label model** goes one step further: it estimates each function's accuracy *without* any ground truth, from how often the functions agree and disagree. Its probabilistic labels then train an ordinary classifier, which can learn from listings that no rule covers.

      :::mixup "Three rules voting 'counterfeit' means three pieces of evidence."
      Only if they err independently. Two rules that both check for the word "replica" are one piece of evidence counted twice. Snorkel can model such correlations; a plain vote can't.
      :::
    bridges: []
  - id: semi-supervised-and-weak-learning.s4
    title: A small gold set keeps everyone honest
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.semi-supervised-and-weak-learning
    markdown: |-
      Pseudo-labels, weak labels, and human labels all end up in the same "label" column. Only one of them was checked. So the team keeps a **gold set**: a few hundred examples labeled carefully by people, drawn at random, and never used for training.

      Here's how they use their 300 gold listings:

      1. **Score each labeling function.** "Price below 30% of retail" votes on 60 gold listings and is right on 42: accuracy 0.70, the number used above.
      2. **Score the pseudo-labels** at each threshold, as in the threshold table.
      3. **Score the final model by category,** so that harps and ukuleles aren't hidden inside an overall average.
      4. **Record where every training label came from:** human, pseudo-label, or which labeling function. When the model fails, that tells them which source to fix.

      Without step 3, the model can look excellent on the common categories while the confirmation-bias loop quietly erases the rare ones.
    bridges: []
  - id: semi-supervised-and-weak-learning.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.semi-supervised-and-weak-learning
    markdown: Weighted votes to add up by hand, then a medical-note classifier, a spam team's keyword rules, bird photos, and a rare-disease screener test when guessed labels help and when they mislead.
    takeaway: |-
      Unlabeled data and rough rules can multiply your labels. Keep only confident pseudo-labels, weight rules by their accuracy, and check every source against a small hand-labeled gold set.
  - id: semi-supervised-and-weak-learning.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.semi-supervised-and-weak-learning
    markdown: |-
      Unlabeled data and imperfect labels can provide useful signals. Keep their origins visible and test against independent trusted labels so mistakes do not reinforce themselves.
