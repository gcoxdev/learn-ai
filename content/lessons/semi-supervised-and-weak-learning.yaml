assessment_families:
- id: semi-supervised-and-weak-learning.base
  objective_ref: objective.semi-supervised-and-weak-learning
  task: base
  response_type: single_choice
  points: 1
  hint: 'Create pseudo-labels cautiously: trace the inputs, operation, and result before choosing.'
  remediation_scene: semi-supervised-and-weak-learning.s2
  variants:
  - id: semi-supervised-and-weak-learning.base.1
    prompt: Can unlabeled target data hurt semi-supervised learning?
    options:
    - id: a
      text: Yes, if assumptions or distributions mismatch
    - id: b
      text: 'No'
    - id: c
      text: Only if labels are complete
    answer: a
    feedback: Unlabeled structure is useful only under appropriate conditions.
  - id: semi-supervised-and-weak-learning.base.2
    prompt: What risk comes from confidently wrong pseudo-labels?
    options:
    - id: b
      text: They automatically correct themselves
    - id: c
      text: They prove ground truth
    - id: a
      text: They can reinforce the model’s existing error
    answer: a
    feedback: Self-training can amplify mistaken targets.
- id: semi-supervised-and-weak-learning.transfer
  objective_ref: objective.semi-supervised-and-weak-learning
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Keep trusted evaluation data: trace the inputs, operation, and result before choosing.'
  remediation_scene: semi-supervised-and-weak-learning.s4
  variants:
  - id: semi-supervised-and-weak-learning.transfer.1
    prompt: Ten correlated heuristics repeat one signal. Are they ten independent votes?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if implemented in separate files
    - id: a
      text: 'No'
    answer: a
    feedback: Source dependence changes evidence strength.
  - id: semi-supervised-and-weak-learning.transfer.2
    prompt: Why retain independently labeled evaluation examples?
    options:
    - id: c
      text: Only to count labels
    - id: a
      text: To measure quality beyond the generated supervision
    - id: b
      text: To replace all training data
    answer: a
    feedback: Evaluation needs a reference not produced by the same feedback loop.
