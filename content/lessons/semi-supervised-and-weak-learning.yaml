          - objective.self-supervised-representations
      - anyOf:
          - objective.active-and-curriculum-learning
scenes:
  - id: semi-supervised-and-weak-learning.s1
    title: Fifty thousand photos, one thousand labels
    type: explanation
    depth: intuition
    objective_refs:
      - objective.semi-supervised-and-weak-learning
    markdown: |-
      An online secondhand marketplace wants to sort listing photos into 20 categories: lamps, bikes, guitars, and so on. Staff have labeled 1,000 photos. Another 50,000 sit unlabeled. The active learning lesson spent a budget on *more* labels. This lesson squeezes value from the photos nobody will label.

      **Semi-supervised learning** trains on a few labeled examples plus many unlabeled ones. How can photos with no labels teach anything? They show where the data cluster. If thousands of unlabeled photos form a tight group around the 40 labeled guitars, the guitar boundary shouldn't cut through that group. Most methods rest on this **cluster assumption**: points in the same dense region usually share a label, so decision boundaries should run through the sparse gaps.

      Its twin for messy labels is **weak supervision**: labels come from cheap, imperfect sources such as keyword rules, old databases, or another model, instead of careful hand labeling. The marketplace uses both, and they fail in the same way: a label source that is wrong with confidence teaches the model to be wrong with confidence.
    bridges: []
  - id: semi-supervised-and-weak-learning.s2
    title: Keep only the confident guesses
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.semi-supervised-and-weak-learning
    markdown: |-
      The simplest method is **pseudo-labeling** (Lee, 2013): train on the 1,000 labels, predict the 50,000 unlabeled photos, and treat each prediction above a confidence **threshold** $\tau$ as if it were a real label. Then retrain on both, and repeat.

      The threshold trades quantity for quality. To choose it, the team checks pseudo-labels against 500 extra hand-labeled photos:

      | Threshold $\tau$ | Unlabeled photos kept | Pseudo-labels correct | Wrong labels added |
      | ---: | ---: | ---: | ---: |
      | 0.99 | 20,000 | 99% | 200 |
      | 0.95 | 31,000 | 97% | 930 |
      | 0.80 | 42,500 | 91% | 3,825 |

      :::predict Rare categories like harps have few labeled examples. What happens to them at τ = 0.99?
      Almost none pass. A model trained on six labeled harps is rarely 99% sure of anything harp-like, so the pseudo-labels pile up in the common categories. Each round, lamps and bikes get more examples and harps fall further behind. Many systems set a lower threshold, or a quota, for rare classes.
      :::

      Errors can also snowball. If the first model calls ukuleles "guitars" with 0.97 confidence, those pseudo-labels teach the next model the same mistake, more firmly. This self-reinforcing loop is called **confirmation bias**.
    bridges: []
  - id: semi-supervised-and-weak-learning.s5
    title: "FixMatch: agree with yourself on a harder view"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.semi-supervised-and-weak-learning
    markdown: |-
      A photo of a lamp is still a lamp when flipped, shifted, or recolored: the label-keeping changes from the data augmentation lesson in module 3. **Consistency regularization** turns that into a training signal: the model should give the same answer for two altered versions of the same unlabeled photo. No label is needed, only agreement.

      **FixMatch** (Sohn et al., 2020) combines this with pseudo-labeling, per unlabeled photo:

      1. Make a *weak* augmentation (a flip and a small shift) and predict. Say it's "lamp, 0.97".
      2. If the top probability is at least $\tau = 0.95$, "lamp" becomes the pseudo-label. Below the threshold, the photo is skipped this step.
      3. Make a *strong* augmentation of the same photo (heavy color distortion, a patch blanked out) and train the model to predict "lamp" on it.

      :::papers The FixMatch unlabeled loss
      $$\ell_u = \frac{1}{\mu B}\sum_{b=1}^{\mu B} \mathbb{1}\big(\max(q_b) \ge \tau\big)\; H\big(\hat q_b,\; p_m(y \mid \mathcal{A}(u_b))\big)$$

      $q_b$ is the prediction on the weak view of unlabeled photo $u_b$, $\hat q_b$ its top class, $\mathcal{A}$ the strong augmentation, and $H$ cross-entropy. The indicator $\mathbb{1}$ is 1 only when confidence passes $\tau$. The full loss adds the ordinary loss on labeled photos, and $\mu B$ is the number of unlabeled photos per batch.
      :::

      The easy view supplies a trustworthy target; the hard view forces the model to recognize lamps under distortion. On the CIFAR-10 image benchmark, FixMatch reached 94.93% accuracy with only 250 labels, and 88.61% with 40, just 4 per class.
    diagram:
      caption: One FixMatch step on an unlabeled photo. The weak view sets the target; the strong view is trained to match it.
      description: An unlabeled photo is augmented two ways. The weak view goes to the model, whose prediction becomes a pseudo-label if its confidence is at least 0.95. The strong view goes to the same model, and the loss pushes its prediction toward the pseudo-label.
      nodes:
        - id: photo
          label: Unlabeled photo
          col: 0
          row: 1
          tone: data
        - id: weak
          label: Weak view
          note: flip, small shift
          col: 1
