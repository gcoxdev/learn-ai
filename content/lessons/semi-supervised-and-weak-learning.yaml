schema_version: 0.2-draft
lesson:
  id: semi-supervised-and-weak-learning
  version: 0.1.0-draft
  title: Use unlabeled data and imperfect label sources carefully
  state: draft
  summary: Semi-supervised methods combine labeled and unlabeled examples, while weak supervision combines imperfect
    signals; pseudo-labels and heuristics can amplify errors unless assumptions and independent labels are checked.
  slot: M31.7
  category: learning
  minutes: 12
  sources:
  - title: FixMatch
    url: https://arxiv.org/abs/2001.07685
  - title: Snorkel
    url: https://arxiv.org/abs/1711.10160
objectives:
- id: objective.semi-supervised-and-weak-learning
  version: 1-draft
  statement: Semi-supervised methods combine labeled and unlabeled examples, while weak supervision combines imperfect
    signals; pseudo-labels and heuristics can amplify errors unless assumptions and independent labels are checked.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - semi-supervised-and-weak-learning.base
  - semi-supervised-and-weak-learning.transfer
  prerequisites:
  - anyOf:
    - objective.self-supervised-representations
  - anyOf:
    - objective.active-and-curriculum-learning
scenes:
- id: semi-supervised-and-weak-learning.s1
  title: Learn from unlabeled structure
  type: explanation
  depth: intuition
  objective_refs:
  - objective.semi-supervised-and-weak-learning
  markdown: Semi-supervised learning uses some labeled examples plus unlabeled data under assumptions about their
    relationship. Consistency methods encourage compatible predictions under suitable perturbations. Unlabeled data
    can hurt when its distribution or class structure conflicts with those assumptions.
  text_mode: Semi-supervised learning uses some labeled examples plus unlabeled data under assumptions about their
    relationship. Consistency methods encourage compatible predictions under suitable perturbations. Unlabeled data
    can hurt when its distribution or class structure conflicts with those assumptions.
  bridges: []
- id: semi-supervised-and-weak-learning.s2
  title: Create pseudo-labels cautiously
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.semi-supervised-and-weak-learning
  markdown: A model can label confident predictions and train on them. Confidence thresholds reduce some noise but
    can exclude difficult groups or preserve confidently wrong beliefs. If an early model mistakes rare class B
    for A, repeated pseudo-labeling can reinforce that error.
  text_mode: A model can label confident predictions and train on them. Confidence thresholds reduce some noise
    but can exclude difficult groups or preserve confidently wrong beliefs. If an early model mistakes rare class
    B for A, repeated pseudo-labeling can reinforce that error.
  bridges: []
- id: semi-supervised-and-weak-learning.s3
  title: Combine weak signals
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.semi-supervised-and-weak-learning
  markdown: Heuristic rules, knowledge bases, and model-generated labels can provide noisy supervision. Label functions
    may abstain or conflict. A label model can estimate relationships among sources, but correlated heuristics should
    not be treated as many independent votes without justification.
  text_mode: Heuristic rules, knowledge bases, and model-generated labels can provide noisy supervision. Label functions
    may abstain or conflict. A label model can estimate relationships among sources, but correlated heuristics should
    not be treated as many independent votes without justification.
  bridges: []
- id: semi-supervised-and-weak-learning.s4
  title: Keep trusted evaluation data
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.semi-supervised-and-weak-learning
  markdown: Use a carefully labeled independent subset to evaluate final quality, subgroup behavior, and source
    errors. Report which labels were human, weak, or pseudo-generated. Increasing the number of labels does not
    create equivalent amounts of independent ground-truth evidence.
  text_mode: Use a carefully labeled independent subset to evaluate final quality, subgroup behavior, and source
    errors. Report which labels were human, weak, or pseudo-generated. Increasing the number of labels does not
    create equivalent amounts of independent ground-truth evidence.
  bridges: []
- id: semi-supervised-and-weak-learning.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.semi-supervised-and-weak-learning
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Semi-supervised methods combine labeled and unlabeled examples, while weak supervision combines imperfect
    signals; pseudo-labels and heuristics can amplify errors unless assumptions and independent labels are checked.
- id: semi-supervised-and-weak-learning.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.semi-supervised-and-weak-learning
  markdown: Semi-supervised methods combine labeled and unlabeled examples, while weak supervision combines imperfect
    signals; pseudo-labels and heuristics can amplify errors unless assumptions and independent labels are checked.
  text_mode: Semi-supervised methods combine labeled and unlabeled examples, while weak supervision combines imperfect
