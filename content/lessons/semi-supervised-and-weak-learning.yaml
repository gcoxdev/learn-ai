lesson:
  id: semi-supervised-and-weak-learning
  version: 0.4.0-draft
  title: Use unlabeled data and imperfect label sources carefully
  state: draft
  summary: A marketplace has 1,000 labeled listings and 50,000 unlabeled ones. Turn confident guesses and rough rules of thumb into training labels, without letting the model believe its own mistakes.
  slot: M31.7
  category: learning
  sources:
    - title: "FixMatch: Simplifying Semi-Supervised Learning with Consistency and Confidence (Sohn et al., 2020)"
      url: https://arxiv.org/abs/2001.07685
    - title: "Snorkel: Rapid Training Data Creation with Weak Supervision (Ratner et al., 2017)"
      url: https://arxiv.org/abs/1711.10160
objectives:
  - id: objective.semi-supervised-and-weak-learning
    version: 2-draft
    statement: Train on confident pseudo-labels with a threshold, explain consistency regularization as in FixMatch, combine noisy labeling-function votes by their accuracies, and check every label source against a hand-labeled gold set.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - semi-supervised-and-weak-learning.base.v2
      - semi-supervised-and-weak-learning.transfer.v2
