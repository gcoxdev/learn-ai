assessment_families:
  - id: semi-supervised-and-weak-learning.base
    objective_ref: objective.semi-supervised-and-weak-learning
    task: base
    response_type: single_choice
    points: 1
    hint: 'Create pseudo-labels cautiously: trace the inputs, operation, and result before choosing.'
    remediation_scene: semi-supervised-and-weak-learning.s2
    variants:
      - id: semi-supervised-and-weak-learning.base.1
        prompt: Can unlabeled target data hurt semi-supervised learning?
        options:
          - id: a
            text: Yes, if assumptions or distributions mismatch
          - id: b
            text: 'No'
          - id: c
            text: Only if labels are complete
        answer: a
        feedback: Unlabeled structure is useful only under appropriate conditions.
        retired: true
      - id: semi-supervised-and-weak-learning.base.2
        prompt: What risk comes from confidently wrong pseudo-labels?
        options:
          - id: b
            text: They automatically correct themselves
          - id: c
            text: They prove ground truth
          - id: a
            text: They can reinforce the model’s existing error
        answer: a
        feedback: Self-training can amplify mistaken targets.
        retired: true
  - id: semi-supervised-and-weak-learning.transfer
    objective_ref: objective.semi-supervised-and-weak-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Keep trusted evaluation data: trace the inputs, operation, and result before choosing.'
    remediation_scene: semi-supervised-and-weak-learning.s4
    variants:
      - id: semi-supervised-and-weak-learning.transfer.1
        prompt: Ten correlated heuristics repeat one signal. Are they ten independent votes?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if implemented in separate files
          - id: a
            text: 'No'
        answer: a
        feedback: Source dependence changes evidence strength.
        retired: true
      - id: semi-supervised-and-weak-learning.transfer.2
        prompt: Why retain independently labeled evaluation examples?
        options:
          - id: c
            text: Only to count labels
          - id: a
            text: To measure quality beyond the generated supervision
          - id: b
            text: To replace all training data
        answer: a
        feedback: Evaluation needs a reference not produced by the same feedback loop.
        retired: true
  - id: semi-supervised-and-weak-learning.base.v2
    objective_ref: objective.semi-supervised-and-weak-learning
    task: base
    response_type: single_choice
    points: 1
    hint: Ask where each label came from and how confident it had to be. A threshold trades how many pseudo-labels you keep against how many are wrong.
    remediation_scene: semi-supervised-and-weak-learning.s2
    variants:
      - id: semi-supervised-and-weak-learning.base.v2.1
        prompt: A team raises its pseudo-labeling threshold from 0.80 to 0.99. What happens to the pseudo-labels?
        options:
          - id: b
            text: More photos pass, since a stricter rule makes the model more confident
          - id: a
            text: Fewer photos pass, but a larger share of those that do are correct
          - id: c
            text: The same photos pass, but each one is weighted more heavily in training
        answer: a
        feedback: A higher threshold keeps only the most confident predictions, so quantity falls and quality rises (in the lesson, 20,000 at 99% correct versus 42,500 at 91%). The threshold filters predictions; it doesn't change the model's confidence or the weights.
      - id: semi-supervised-and-weak-learning.base.v2.2
        prompt: In FixMatch, which view of an unlabeled photo produces the pseudo-label, and which is trained to match it?
        options:
          - id: a
            text: The weak view produces it; the strong view is trained to match it
          - id: b
            text: The strong view produces it; the weak view is trained to match it
          - id: c
            text: Both views produce labels, which are averaged into one soft target
        answer: a
        feedback: The mildly altered photo gives a trustworthy prediction, which becomes the target if it passes τ. The heavily altered photo is harder, so training on it teaches robustness. Reversing the roles would use the least reliable prediction as the target.
      - id: semi-supervised-and-weak-learning.base.v2.3
        prompt: An early model labels ukuleles as "guitar" with 0.97 confidence. After several rounds of pseudo-labeling at τ = 0.95, what is most likely?
        options:
          - id: c
            text: The error fades, because unlabeled data correct the boundary over time
          - id: a
            text: The error grows firmer, because the model trains on its own wrong labels
          - id: b
            text: Ukuleles drop out of training, because they never pass the threshold
        answer: a
        feedback: Confident mistakes pass the threshold and become training labels, so each round reinforces them. That's confirmation bias. The mistakes here are above 0.95, so they don't drop out, and unlabeled data can't correct an error nothing contradicts.
      - id: semi-supervised-and-weak-learning.base.v2.4
        prompt: "Three labeling functions vote on a listing: one with accuracy 0.90 says counterfeit, one with 0.70 says counterfeit, and one with 0.95 says genuine. Why is the weighted result close to 50/50 when the majority says counterfeit 2–1?"
        options:
          - id: b
            text: Majority vote ignores abstentions, while weighting counts them as genuine
          - id: c
            text: Functions that vote counterfeit get lower weights by design, to avoid false alarms
          - id: a
            text: The genuine vote's weight nearly equals the other two weights combined
        answer: a
        feedback: The log-odds weights are 2.20 and 0.85 for counterfeit against 2.94 for genuine, a net +0.10, so P ≈ 0.53. No function abstained here, and weights depend on accuracy, not on which class a function votes for.
      - id: semi-supervised-and-weak-learning.base.v2.5
        prompt: What does Snorkel's label model estimate, and from what?
        options:
          - id: a
            text: Each labeling function's accuracy, from their agreements and disagreements
          - id: b
            text: Each labeling function's accuracy, from a large hand-labeled training set
          - id: c
            text: The final classifier's accuracy, from its predictions on the gold set
        answer: a
        feedback: The point of the label model is to weigh the functions without ground-truth labels, using only how their votes overlap and conflict. A gold set is still wise for checking, but the label model doesn't need one to train.
  - id: semi-supervised-and-weak-learning.transfer.v2
    objective_ref: objective.semi-supervised-and-weak-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: Look for the label source that could be confidently wrong or double-counted, then pick the check that uses independent, hand-labeled examples.
    remediation_scene: semi-supervised-and-weak-learning.s4
    variants:
      - id: semi-supervised-and-weak-learning.transfer.v2.1
        prompt: A rare-disease screener uses pseudo-labeling at τ = 0.99. Overall accuracy rises each round, but recall on the rarest disease falls. What is the likely cause?
        options:
          - id: b
            text: The gold set is too small to measure the rare disease's recall accurately
          - id: a
            text: Rare-disease cases seldom pass the threshold, so pseudo-labels crowd them out
          - id: c
            text: The strong threshold removes too many wrong labels from the common classes
        answer: a
        feedback: A model with few rare examples is rarely 99% sure about them, so the pseudo-labels pile up in common classes and the rare class shrinks in relative terms. A lower threshold or quota for rare classes, and per-class gold scores, address it. Removing wrong labels helps rather than hurts.
      - id: semi-supervised-and-weak-learning.transfer.v2.2
        prompt: A spam team writes five keyword rules, and three of them all check for the word "winner". The label model trusts the "winner" votes heavily. What is wrong?
        options:
          - id: a
            text: The three rules are correlated, so one signal is being counted three times
          - id: c
            text: Keyword rules are too crude to use, so the team should hand-label instead
          - id: b
            text: Five rules are too few for a label model to estimate their accuracies
        answer: a
        feedback: Weighted voting assumes independent errors. Three rules keyed to one word agree because they share a cause, not because they're each right. Merge them or model the correlation. Crude rules are fine when weighted and checked.
      - id: semi-supervised-and-weak-learning.transfer.v2.3
        prompt: A bird-photo classifier has 400 labeled and 100,000 unlabeled photos. Which approach uses the unlabeled photos in the FixMatch way?
        options:
          - id: c
            text: Label the 100,000 photos with the current model and retrain on the lot
          - id: b
            text: Train on just the 400 labels, then use the unlabeled photos for testing
          - id: a
            text: Train each confident weak-view prediction as the target for a strong view
        answer: a
        feedback: FixMatch keeps only confident predictions on weak views and uses them as targets for strongly altered views. Retraining on every prediction adds many wrong labels, and unlabeled photos can't serve as a test set.
      - id: semi-supervised-and-weak-learning.transfer.v2.4
        prompt: A hospital labels clinical notes with keyword rules and trains a classifier on the result. How should it measure the classifier's accuracy?
        options:
          - id: a
            text: On a random set of notes labeled by clinicians and kept out of training
          - id: b
            text: On notes where most of the keyword rules agree, since those labels are reliable
          - id: c
            text: On the rule-labeled training notes, since they reflect what the rules intended
        answer: a
        feedback: Only independent human labels can reveal what the rules get wrong. Notes where the rules agree are the easy cases, and scoring against rule labels measures agreement with the rules, not correctness.
      - id: semi-supervised-and-weak-learning.transfer.v2.5
        prompt: A marketplace's final model fails on vintage lamps. Its training labels came from staff, pseudo-labels, and four labeling functions. What record would help most to find the cause?
        options:
          - id: b
            text: The model's overall accuracy on the gold set before and after the failure
          - id: a
            text: The source of each training label for the lamp examples
          - id: c
            text: The number of unlabeled photos in each category of the dataset
        answer: a
        feedback: Knowing whether the lamp labels came from staff, a threshold, or one particular rule points straight at the source to fix. An overall accuracy hides the lamps, and unlabeled counts say nothing about label quality.
  - id: semi-supervised-and-weak-learning.calculate
    objective_ref: objective.semi-supervised-and-weak-learning
    task: base
    response_type: numeric
    points: 1
    hint: Add the weight of each function voting for the positive class and subtract the weight of each voting against it. Abstaining functions add nothing.
    remediation_scene: semi-supervised-and-weak-learning.s3
    absolute_tolerance: 0.01
    variants:
      - id: semi-supervised-and-weak-learning.calculate.1
        prompt: "Labeling functions with weights 2.2 and 0.8 vote spam; one with weight 2.9 votes not spam. What is the weighted score (spam positive)?"
        answer: 0.1
        feedback: 2.2 + 0.8 − 2.9 = 0.1, a slight lean toward spam despite the strong "not spam" vote.
      - id: semi-supervised-and-weak-learning.calculate.2
        prompt: "Functions with weights 1.4 and 0.6 vote spam; one with weight 1.1 votes not spam; a fourth abstains. What is the weighted score (spam positive)?"
        answer: 0.9
        feedback: 1.4 + 0.6 − 1.1 = 0.9. The abstaining function contributes nothing.
      - id: semi-supervised-and-weak-learning.calculate.3
        prompt: "A function with weight 3.0 votes genuine; two functions with weight 0.5 each vote counterfeit. What is the weighted score (counterfeit positive)?"
        answer: -2
        feedback: 0.5 + 0.5 − 3.0 = −2.0. Two weak votes can't outweigh one strong one.
      - id: semi-supervised-and-weak-learning.calculate.4
        prompt: A labeling function is right 75% of the time when it votes. What is its log-odds weight, ln(a / (1 − a))? (ln 3 ≈ 1.099; two decimals.)
        answer: 1.1
        feedback: 0.75 / 0.25 = 3, and ln 3 ≈ 1.10.
      - id: semi-supervised-and-weak-learning.calculate.5
        prompt: "Two functions with weight 1.5 each disagree on a listing, and a third with weight 0.7 votes genuine. What is the weighted score (counterfeit positive)?"
        answer: -0.7
        feedback: The two 1.5 votes cancel, leaving −0.7 from the genuine vote.
