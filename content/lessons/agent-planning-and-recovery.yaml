schema_version: 0.2-draft
lesson:
  id: agent-planning-and-recovery
  version: 0.3.0-draft
  title: Turn a plan into checked execution with recovery paths
  state: draft
  summary: Build a plan whose steps have evidence of success and a way to recover.
  slot: M25.3
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
  - title: ReAct
    url: https://arxiv.org/abs/2210.03629
objectives:
- id: objective.agent-planning-and-recovery
  version: 1-draft
  statement: Agent planning decomposes objectives into dependent actions, while execution monitoring verifies
    results and revises the plan when assumptions fail.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - agent-planning-and-recovery.base
  - agent-planning-and-recovery.transfer
  prerequisites:
  - anyOf:
    - objective.tool-contracts-and-state
  - anyOf:
    - objective.classical-planning
scenes:
- id: agent-planning-and-recovery.s1
  title: Write preconditions and completion evidence
  type: explanation
  depth: intuition
  objective_refs:
  - objective.agent-planning-and-recovery
  markdown: A step such as compare prices needs identified items, compatible units, and current observations.
    Its completion condition is a supported comparison, not merely a tool call. Explicit prerequisites reveal
    which tasks can run independently and which must wait.
  text_mode: A step such as compare prices needs identified items, compatible units, and current observations.
    Its completion condition is a supported comparison, not merely a tool call. Explicit prerequisites reveal
    which tasks can run independently and which must wait.
  bridges: []
- id: agent-planning-and-recovery.s2
  title: Use a dependency graph
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agent-planning-and-recovery
  markdown: If steps A and B independently gather two records and step C compares them, A and B can overlap
    but C depends on both. Shared mutable resources can introduce additional constraints. Parallel execution
    saves time only when coordination and resource costs remain manageable.
  text_mode: If steps A and B independently gather two records and step C compares them, A and B can overlap
    but C depends on both. Shared mutable resources can introduce additional constraints. Parallel execution
    saves time only when coordination and resource costs remain manageable.
  bridges: []
- id: agent-planning-and-recovery.s3
  title: Detect failures at boundaries
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agent-planning-and-recovery
  markdown: After each consequential step, inspect returned evidence and relevant state. If a lookup fails,
    decide whether another source, corrected identifier, or user information can resolve it. Repeating an unchanged
    action without new evidence can create loops rather than progress.
  text_mode: After each consequential step, inspect returned evidence and relevant state. If a lookup fails,
    decide whether another source, corrected identifier, or user information can resolve it. Repeating an unchanged
    action without new evidence can create loops rather than progress.
  bridges: []
- id: agent-planning-and-recovery.s4
  title: Recover without hiding uncertainty
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agent-planning-and-recovery
  markdown: 'Save **checkpoints**, records of known progress, so recovery can start from what actually happened.
    Where possible, use **idempotent operations**: repeating them has the same intended effect. “Set the label
    to blue” is idempotent; “add one point” is not.


    A **compensating action** tries to counter a completed effect, such as releasing a reservation when a later
    step fails. It may not restore everything: time has passed, and another person may already have seen the
    change.


    Record results that remain unknown. If a necessary assumption fails, stop work that depends on it and revise
    the plan using the current state.'
  text_mode: 'Save **checkpoints**, records of known progress, so recovery can start from what actually happened.
    Where possible, use **idempotent operations**: repeating them has the same intended effect. “Set the label
    to blue” is idempotent; “add one point” is not.


    A **compensating action** tries to counter a completed effect, such as releasing a reservation when a later
    step fails. It may not restore everything: time has passed, and another person may already have seen the
    change.


    Record results that remain unknown. If a necessary assumption fails, stop work that depends on it and revise
    the plan using the current state.'
  bridges: []
- id: agent-planning-and-recovery.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.agent-planning-and-recovery
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A plan sets out dependencies and evidence of completion. Execution checks those results and revises
    the plan when conditions change.
- id: agent-planning-and-recovery.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.agent-planning-and-recovery
  markdown: A plan sets out dependencies and evidence of completion. Execution checks those results and revises
    the plan when conditions change.
  text_mode: A plan sets out dependencies and evidence of completion. Execution checks those results and revises
    the plan when conditions change.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - agent-planning-and-recovery.s1
    - agent-planning-and-recovery.s2
    - agent-planning-and-recovery.s3
