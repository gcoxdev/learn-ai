schema_version: 0.2-draft
lesson:
  id: agent-planning-and-recovery
  version: 0.1.0-draft
  title: Turn a plan into checked execution with recovery paths
  state: draft
  summary: Agent planning decomposes objectives into dependent actions, while execution monitoring verifies results
    and revises the plan when assumptions fail.
  slot: M25.3
  category: learning
  minutes: 12
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
  - title: ReAct
    url: https://arxiv.org/abs/2210.03629
objectives:
- id: objective.agent-planning-and-recovery
  version: 1-draft
  statement: Agent planning decomposes objectives into dependent actions, while execution monitoring verifies results
    and revises the plan when assumptions fail.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - agent-planning-and-recovery.base
  - agent-planning-and-recovery.transfer
  prerequisites:
  - anyOf:
    - objective.tool-contracts-and-state
  - anyOf:
    - objective.classical-planning
scenes:
- id: agent-planning-and-recovery.s1
  title: Write preconditions and completion evidence
  type: explanation
  depth: intuition
  objective_refs:
  - objective.agent-planning-and-recovery
  markdown: A step such as compare prices needs identified items, compatible units, and current observations. Its
    completion condition is a supported comparison, not merely a tool call. Explicit prerequisites reveal which
    tasks can run independently and which must wait.
  text_mode: A step such as compare prices needs identified items, compatible units, and current observations. Its
    completion condition is a supported comparison, not merely a tool call. Explicit prerequisites reveal which
    tasks can run independently and which must wait.
  bridges: []
- id: agent-planning-and-recovery.s2
  title: Use a dependency graph
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agent-planning-and-recovery
  markdown: If steps A and B independently gather two records and step C compares them, A and B can overlap but
    C depends on both. Shared mutable resources can introduce additional constraints. Parallel execution saves time
    only when coordination and resource costs remain manageable.
  text_mode: If steps A and B independently gather two records and step C compares them, A and B can overlap but
    C depends on both. Shared mutable resources can introduce additional constraints. Parallel execution saves time
    only when coordination and resource costs remain manageable.
  bridges: []
- id: agent-planning-and-recovery.s3
  title: Detect failures at boundaries
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agent-planning-and-recovery
  markdown: After each consequential step, inspect returned evidence and relevant state. If a lookup fails, decide
    whether another source, corrected identifier, or user information can resolve it. Repeating an unchanged action
    without new evidence can create loops rather than progress.
  text_mode: After each consequential step, inspect returned evidence and relevant state. If a lookup fails, decide
    whether another source, corrected identifier, or user information can resolve it. Repeating an unchanged action
    without new evidence can create loops rather than progress.
  bridges: []
- id: agent-planning-and-recovery.s4
  title: Recover without hiding uncertainty
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agent-planning-and-recovery
  markdown: Use checkpoints, idempotent operations where possible, and compensating actions for reversible changes.
    Some effects cannot be undone exactly. Record unresolved results and stop dependent work when essential assumptions
    fail; a revised plan should reflect the current world rather than the original optimistic sequence.
  text_mode: Use checkpoints, idempotent operations where possible, and compensating actions for reversible changes.
    Some effects cannot be undone exactly. Record unresolved results and stop dependent work when essential assumptions
    fail; a revised plan should reflect the current world rather than the original optimistic sequence.
  bridges: []
- id: agent-planning-and-recovery.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.agent-planning-and-recovery
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: agent-planning-and-recovery.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.agent-planning-and-recovery
  markdown: Agent planning decomposes objectives into dependent actions, while execution monitoring verifies results
    and revises the plan when assumptions fail.
  text_mode: Agent planning decomposes objectives into dependent actions, while execution monitoring verifies results
    and revises the plan when assumptions fail.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - agent-planning-and-recovery.s1
    - agent-planning-and-recovery.s2
    - agent-planning-and-recovery.s3
    - agent-planning-and-recovery.s4
    - agent-planning-and-recovery.check
    - agent-planning-and-recovery.recap
    gate_refs:
    - gate.core
assessment_families:
- id: agent-planning-and-recovery.base
  objective_ref: objective.agent-planning-and-recovery
  task: base
  response_type: single_choice
  points: 1
  hint: 'Use a dependency graph: trace the inputs, operation, and result before choosing.'
  remediation_scene: agent-planning-and-recovery.s2
  variants:
  - id: agent-planning-and-recovery.base.1
    prompt: A and B gather independent records; C compares both. What can overlap?
    options:
    - id: b
      text: C before either record exists
    - id: c
      text: Every step regardless of dependencies
    - id: a
      text: A and B
    answer: a
    feedback: C requires both inputs.
  - id: agent-planning-and-recovery.base.2
    prompt: What proves a comparison step complete?
    options:
    - id: c
      text: Only that a plan was written
    - id: a
      text: A result supported by the required evidence
    - id: b
      text: Only that a tool was called
    answer: a
    feedback: Completion conditions should match the task outcome.
- id: agent-planning-and-recovery.transfer
  objective_ref: objective.agent-planning-and-recovery
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Recover without hiding uncertainty: trace the inputs, operation, and result before choosing.'
  remediation_scene: agent-planning-and-recovery.s4
  variants:
  - id: agent-planning-and-recovery.transfer.1
    prompt: What makes repeating a failed lookup potentially useful?
    options:
    - id: c
      text: Only increasing the retry counter
    - id: a
      text: A changed input, source, or relevant condition
    - id: b
      text: An unchanged loop with no new evidence
    answer: a
    feedback: Retries should address a plausible failure cause.
  - id: agent-planning-and-recovery.transfer.2
    prompt: Can every external action be undone exactly?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if an agent logs it
    answer: a
    feedback: Recovery capabilities depend on the operation’s actual effects.
