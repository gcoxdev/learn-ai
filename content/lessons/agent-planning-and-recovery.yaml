assessment_families:
- id: agent-planning-and-recovery.base
  objective_ref: objective.agent-planning-and-recovery
  task: base
  response_type: single_choice
  points: 1
  hint: 'Use a dependency graph: trace the inputs, operation, and result before choosing.'
  remediation_scene: agent-planning-and-recovery.s2
  variants:
  - id: agent-planning-and-recovery.base.1
    prompt: A and B gather independent records; C compares both. What can overlap?
    options:
    - id: b
      text: C before either record exists
    - id: c
      text: Every step regardless of dependencies
    - id: a
      text: A and B
    answer: a
    feedback: C requires both inputs.
  - id: agent-planning-and-recovery.base.2
    prompt: What proves a comparison step complete?
    options:
    - id: c
      text: Only that a plan was written
    - id: a
      text: A result supported by the required evidence
    - id: b
      text: Only that a tool was called
    answer: a
    feedback: Completion conditions should match the task outcome.
- id: agent-planning-and-recovery.transfer
  objective_ref: objective.agent-planning-and-recovery
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Recover without hiding uncertainty: trace the inputs, operation, and result before choosing.'
  remediation_scene: agent-planning-and-recovery.s4
  variants:
  - id: agent-planning-and-recovery.transfer.1
    prompt: What makes repeating a failed lookup potentially useful?
    options:
    - id: c
      text: Only increasing the retry counter
    - id: a
      text: A changed input, source, or relevant condition
    - id: b
      text: An unchanged loop with no new evidence
    answer: a
    feedback: Retries should address a plausible failure cause.
  - id: agent-planning-and-recovery.transfer.2
    prompt: Can every external action be undone exactly?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if an agent logs it
    answer: a
    feedback: Recovery capabilities depend on the operation’s actual effects.
