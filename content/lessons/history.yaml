  text_mode: Labeled radio options and a submit button; no timing requirement.
- id: history.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.history
  markdown: AI history includes symbolic reasoning, statistical learning, neural methods, and changing access
