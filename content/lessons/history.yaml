lesson:
  id: history
  version: 0.4.0-draft
  title: The questions that shaped AI
  state: draft
  summary: From a 1950 guessing game to ChatGPT, AI has swung between bold bets, bitter winters, and sudden breakthroughs. Get the whole story, and a map of what you'll build next.
  slot: M01.8
  category: common
  sources:
    - title: Dartmouth research proposal — August 31, 1955
      url: https://www-formal.stanford.edu/jmc/history/dartmouth/dartmouth.html
    - title: McCulloch and Pitts — a logical calculus (1943)
      url: https://doi.org/10.1007/BF02478259
    - title: Turing — Computing Machinery and Intelligence (1950)
      url: https://www.csee.umbc.edu/courses/471/papers/turing.pdf
    - title: SRI — Shakey the Robot
      url: https://www.sri.com/hoi/shakey-the-robot/
    - title: Rumelhart, Hinton, and Williams — back-propagating errors (1986)
      url: https://www.nature.com/articles/323533a0
    - title: Krizhevsky, Sutskever, and Hinton — ImageNet classification (2012)
      url: https://proceedings.neurips.cc/paper/2012/hash/c399862d3b9d6b76c8436e924a68c45b-Abstract.html
    - title: Vaswani and colleagues — Attention Is All You Need (2017)
      url: https://arxiv.org/abs/1706.03762
    - title: Ouyang et al. — Training language models to follow instructions with human feedback (2022)
      url: https://arxiv.org/abs/2203.02155
  archetype: perspective
objectives:
  - id: objective.history
    version: 3-draft
    statement: Compare historical AI approaches and connect milestones to bounded evidence rather than a story of total replacement.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - history.base.v3
      - history.transfer.v3
    prerequisites:
      - anyOf:
          - objective.ai-systems
scenes:
  - id: history.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.history
    title: Five days, eighty years
    markdown: |-
      On November 30, 2022, OpenAI released ChatGPT. Within about five days, a million people had signed up to try it. It seemed to come from nowhere.

      It didn't. Inside it are ideas from every decade since the 1940s: an artificial neuron sketched in 1943, a machine that learned from mistakes in 1958, a training method made famous in 1986, and an architecture published in 2017. AI's history is those pieces being invented, doubted, abandoned, and rediscovered.

      Researchers have made three big bets about how to build intelligence:

      - **Write the rules:** tell the machine what experts know.
      - **Search:** let the machine try possibilities until one works.
      - **Learn from examples:** let the machine find the rules in data.

      Each bet had its boom and hit a wall. Today's systems combine all three.
    bridges: []
  - id: history.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.history
    title: The founders asked big questions
    markdown: |-
      In 1943, Warren McCulloch and Walter Pitts showed that simple on/off "neurons" could compute logic. In 1950, Alan Turing asked "Can machines think?", then proposed a practical test instead: can a judge tell a machine from a person by typed replies alone? In 1955, four researchers proposed a summer workshop at Dartmouth, held in 1956, and named the field **artificial intelligence**. They hoped for a big advance in one summer; some of their problems took over sixty years.

      Learning arrived early too. Frank Rosenblatt's perceptron (1958) adjusted its own weights, the strengths of its connections, after mistakes, and Arthur Samuel's checkers program (1959 paper) learned to play better than Samuel himself.

      As you explore the timeline below, ask of each landmark: is it an idea, a plan, or a measured result?
    bridges: []
    figure:
      kind: history
      caption: 'Inspect a few landmarks by their kind of contribution: abstraction, argument, proposal, or experiment.'
      description: The selected landmarks are 1943 idealized neural units, Turing’s 1950 framing, the 1955 proposal for Dartmouth in 1956, the 2012 AlexNet image-recognition result, and the 2017 Transformer paper. Equal row spacing is not elapsed time.
  - id: history.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.history
    title: Symbols, a chatbot, and two winters
    markdown: |-
      Through the 1960s, the rule-and-search bet looked unstoppable. At SRI, a wobbly robot called Shakey (1966–72) rolled through a few rooms built to suit it, with plain walls, careful lighting, and big painted blocks. It described those rooms in symbols and searched for plans to push the blocks around. At MIT, Joseph Weizenbaum's ELIZA (1966) chatted like a therapist using keyword patterns, and some users confided in it.

      Then came the reckoning. In 1969 Marvin Minsky and Seymour Papert's book *Perceptrons* proved that a single-layer perceptron can't learn XOR ("one or the other, not both"). It's often blamed for the neural-network winter that followed, though historians debate how much it caused. In 1973 Britain's Lighthill report argued that AI's successes came only in small, tidy "toy" problems and wouldn't scale up to real ones, and funding was cut. These cold spells are called **AI winters**.

      A second boom came in the 1980s with **expert systems**, programs built from rules written with human experts, such as MYCIN for antibiotics and XCON for configuring computer orders. But the rules were costly to maintain and broke on unusual cases. Around 1987 the market for specialized Lisp machines collapsed, and a second winter set in.

      :::mixup "Each new approach proved the old one wrong."
      Old ideas keep coming back. A hidden layer fixes XOR, and search methods from Shakey's project still plan routes on your phone.
      :::
    bridges: []
  - id: history.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.history
    title: Learning from examples wins, slowly
    markdown: |-
      In 1986 David Rumelhart, Geoffrey Hinton, and Ronald Williams made **backpropagation** famous: it sends a network's error backward so even hidden layers can learn. Yann LeCun's convolutional networks read handwritten digits by 1989, and in 1997 Hochreiter and Schmidhuber's LSTM gave networks a memory for sequences. That year IBM's Deep Blue beat chess champion Garry Kasparov, mostly by brute-force search.

      :::predict Neural networks could learn by 1990. Why did they take over only after 2012?
      They were starving. In 2009 Fei-Fei Li's team released ImageNet, millions of labeled photos, and gaming chips (GPUs) had become fast enough to train big networks. In 2012 AlexNet, a deep network trained on two GPUs, won the ImageNet challenge. Its five best guesses missed the right label on 15.3% of test photos, against 26.2% for the runner-up.
      :::
    bridges: []
  - id: history.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.history
    markdown: Explain why AlexNet, AlphaGo, and ChatGPT happened when they did, then use AI history to size up a gloomy headline, a showroom robot, a retired expert system, and a Turing-test claim.
    takeaway: |-
      AI moved between writing rules, searching, and learning from examples, with booms and winters along the way. Most breakthroughs came when old ideas finally met enough data and computing power, and today's systems mix all three approaches.
  - id: history.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.history
    markdown: |-
      AI history includes symbolic reasoning, statistical learning, neural methods, and changing access to data and computation—not one straight line of invention.
  - id: history.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.history
    title: One model, many jobs
    markdown: |-
      Then things sped up. In 2013 word2vec turned words into lists of numbers that capture meaning. In 2016 DeepMind's AlphaGo beat Go master Lee Sedol 4–1 with moves, like move 37 in game 2, that experts first called mistakes. It had *learned* to judge positions, first from human games and then from millions of games against itself.

      In 2017 Google researchers introduced the **Transformer**, built on *attention*: each word weighs how much every other word matters to it. Transformers became the engines of **foundation models**, trained once on huge amounts of text and reused for many jobs: BERT (2018), GPT-2 (2019), and GPT-3 (2020), which could pick up a task from a few examples in its prompt. In 2020 AlphaFold 2 predicted the shapes of many proteins nearly as accurately as lab experiments.

      The last step was making models helpful. With **instruction tuning**, people wrote good answers to example requests and the model was trained on them. With **reinforcement learning from human feedback (RLHF)**, people ranked the model's own answers and it was trained toward the ones they preferred. Together, these turned a text predictor into ChatGPT.
    bridges: []
  - id: history.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.history
    title: The whole story on one page
    markdown: |-
      | Year | Milestone | What it showed |
      | --- | --- | --- |
      | 1943 | McCulloch and Pitts's neuron | On/off units can compute logic |
      | 1950 | Turing's imitation game | Judge machines by their replies |
      | 1956 | Dartmouth workshop | AI gets a name and an agenda |
      | 1958 | Rosenblatt's perceptron | A machine can learn from mistakes |
      | 1959 | Samuel's checkers | A program can outplay its author |
      | 1966 | ELIZA | Fluent replies need no understanding |
      | 1966–72 | Shakey | Symbols and search can plan actions |
      | 1969 | *Perceptrons* | One layer can't learn XOR |
      | 1973 | Lighthill report | Toy-world success didn't scale |
      | 1980s | Expert systems | Rules pay off, but upkeep is costly |
      | 1986 | Backpropagation popularized | Hidden layers can learn |
      | 1989–98 | LeNet | Convolution reads handwriting |
      | 1997 | LSTM; Deep Blue | Sequence memory; search wins at chess |
      | 2009–12 | ImageNet, AlexNet | Data plus GPUs make deep networks win |
      | 2013 | word2vec | Meaning as reusable vectors |
      | 2016 | AlphaGo | Learned judgment masters Go |
      | 2017 | Transformer | Attention, computed in parallel |
      | 2018–20 | BERT, GPT-2, GPT-3 | Pretrain once, reuse everywhere |
      | 2020 | AlphaFold 2 | Protein shapes near lab accuracy |
      | 2022 | ChatGPT | Post-training turns a model into an assistant |

      You'll build most of these rows yourself: rules in the logic module, Shakey's search in the search module, perceptrons and backpropagation in the neural-network module, attention in the attention module, and instruction tuning and RLHF in the post-training module.
    bridges: []
