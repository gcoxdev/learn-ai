schema_version: 0.2-draft
lesson:
  id: history
  version: 0.1.0-draft
  title: The questions that shaped AI
  state: draft
  summary: AI history includes symbolic reasoning, statistical learning, neural methods, and changing access
    to data and computation—not one straight line of invention.
  slot: M01.8
  category: common
  minutes: 10
  sources:
  - title: The Dartmouth research proposal
    url: https://www-formal.stanford.edu/jmc/history/dartmouth/dartmouth.html
  - title: 'Artificial Intelligence: A Modern Approach — topic overview'
    url: https://aima.cs.berkeley.edu/contents.html
  - title: Attention Is All You Need
    url: https://arxiv.org/abs/1706.03762
objectives:
- id: objective.history
  version: 1-draft
  statement: AI history includes symbolic reasoning, statistical learning, neural methods, and changing access
    to data and computation—not one straight line of invention.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - history.base
  - history.transfer
  prerequisites:
