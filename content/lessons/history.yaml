assessment_families:
  - id: history.base
    objective_ref: objective.history
    task: base
    response_type: single_choice
    points: 1
    hint: AI history includes symbolic reasoning, statistical learning, neural methods, and changing access to data and computation—not one straight line of invention.
    variants:
      - id: history.base.1
        prompt: What role did the 1956 Dartmouth project play?
        options:
          - id: a
            text: It introduced today’s transformer architecture.
          - id: b
            text: It was the first use of mathematics in computing.
          - id: correct
            text: It helped establish AI as a named research field.
        answer: correct
        feedback: It helped establish AI as a named research field.
        retired: true
      - id: history.base.2
        prompt: Which description fits symbolic AI?
        options:
          - id: b
            text: Eliminating all representations from a program.
          - id: correct
            text: Representing and manipulating explicit facts, rules, or structures.
          - id: a
            text: Only predicting the next token in text.
        answer: correct
        feedback: Representing and manipulating explicit facts, rules, or structures.
        retired: true
  - id: history.transfer
    objective_ref: objective.history
    task: transfer
    response_type: single_choice
    points: 1
    hint: AI history includes symbolic reasoning, statistical learning, neural methods, and changing access to data and computation—not one straight line of invention.
    variants:
      - id: history.transfer.1
        prompt: A modern application combines neural predictions with rules and search. Is that inconsistent with AI history?
        options:
          - id: b
            text: Yes. A system can contain only one algorithm.
          - id: correct
            text: No. Different traditions can contribute to one system.
          - id: a
            text: Yes. Modern systems must discard earlier methods.
        answer: correct
        feedback: No. Different traditions can contribute to one system.
        retired: true
      - id: history.transfer.2
        prompt: Why is “AI began with chatbots” an incomplete account?
        options:
          - id: correct
            text: Many earlier research traditions and mechanisms contributed to current systems.
          - id: a
            text: Because no AI system has ever used language.
          - id: b
            text: Because only robots count as AI.
        answer: correct
        feedback: Many earlier research traditions and mechanisms contributed to current systems.
        retired: true
  - id: history.base.v2
    objective_ref: objective.history
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: history.s3
    variants:
      - prompt: A route application learns travel time but uses a written bridge-height restriction. What historical pattern does this illustrate?
        answer: a
        options:
          - id: c
            text: A product label identifying one exclusive research tradition
          - id: a
            text: Different AI traditions contributing to one system
          - id: b
            text: A learned estimate replacing every explicit constraint
        feedback: Modern systems can combine methods with different origins and roles.
        id: history.base.v2.1
        retired: true
      - prompt: A timeline contains a proposal, a theorem, and an evaluated system. How should these be compared?
        answer: a
        options:
          - id: a
            text: By the kind and scope of evidence each supplies
          - id: b
            text: As three equivalent demonstrations of the same capability
          - id: c
            text: By treating the latest date as the strongest proof
        feedback: Different contributions answer different questions.
        id: history.base.v2.2
        retired: true
      - prompt: An older search method remains useful inside a recent application. What follows?
        answer: a
        options:
          - id: b
            text: The application must have been built in the search method’s era
          - id: c
            text: The earlier idea makes the application’s learned parts unnecessary
          - id: a
            text: A newer application can reuse an earlier idea
        feedback: A timeline does not imply total replacement between traditions.
        id: history.base.v2.3
        retired: true
      - prompt: A model result improves after changes to data, training, and hardware. Which history note is better?
        answer: a
        options:
          - id: c
            text: Treat the new release date as an explanation of the mechanism
          - id: a
            text: Record the interacting changes and the measured task
          - id: b
            text: Credit one named ingredient without a comparison isolating it
        feedback: Causal explanations need more than a chronological association.
        id: history.base.v2.4
        retired: true
  - id: history.transfer.v2
    objective_ref: objective.history
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: history.s3
    variants:
      - prompt: A headline says a benchmark win proves general intelligence. What detail should be restored?
        answer: a
        options:
          - id: c
            text: The age of the company publishing the result
          - id: a
            text: The actual task, conditions, and measured performance
          - id: b
            text: The number of times the headline was repeated
        feedback: A bounded measurement should not be silently expanded into a universal claim.
        id: history.transfer.v2.1
        retired: true
      - prompt: A museum label says a proposal completed all its intended goals. What source distinction should be checked?
        answer: a
        options:
          - id: a
            text: Planned research versus implemented and tested work
          - id: b
            text: The spelling of the researchers’ names alone
          - id: c
            text: Whether the proposal used a familiar modern product term
        feedback: The tense and evidence of the original document matter.
        id: history.transfer.v2.2
        retired: true
      - prompt: A classroom history map links control to a robot’s feedback loop. What makes the arrow useful?
        answer: a
        options:
          - id: b
            text: The assumption that both topics occurred in the same year
          - id: c
            text: A claim that the robot must learn new weights on every loop
          - id: a
            text: An explanation of how observations affect subsequent actions
        feedback: A dependency connection needs a mechanism, not just nearby dates.
        id: history.transfer.v2.3
        retired: true
      - prompt: A system succeeds in one environment but its claim mentions many others. What evidence is missing?
        answer: a
        options:
          - id: c
            text: A longer timeline of unrelated successful systems
          - id: a
            text: Testing that addresses the additional environments
          - id: b
            text: A more recent name for the same demonstrated system
        feedback: Historical and modern claims both need evidence for their stated scope.
        id: history.transfer.v2.4
        retired: true
  - id: history.base.v3
    objective_ref: objective.history
    task: base
    response_type: single_choice
    points: 1
    hint: Ask what each milestone actually showed and what had changed just before it. Breakthroughs often came when an old idea finally met enough data, computing power, or a new way to train.
    remediation_scene: history.s4
    variants:
      - id: history.base.v3.1
        prompt: AlexNet's main ideas, convolution and backpropagation, were in use by 1990. Why did a deep network win the ImageNet challenge only in 2012?
        options:
          - id: a
            text: Backpropagation was first invented in the years just before 2012
          - id: b
            text: Researchers had never tried neural networks on images before
          - id: c
            text: Huge labeled datasets and fast GPUs had only recently arrived
        answer: c
        feedback: ImageNet (2009) supplied millions of labeled photos, and GPUs supplied the speed to train on them. Backpropagation was popularized in 1986, and LeCun's networks were reading handwritten digits by 1989.
      - id: history.base.v3.2
        prompt: Minsky and Papert proved that a single-layer perceptron can't learn XOR. Why was it a mistake to read this as the end of neural networks?
        options:
          - id: a
            text: The proof covered one layer, and adding a hidden layer solves XOR
          - id: b
            text: A flaw in the proof was discovered soon after the book came out
          - id: c
            text: XOR turned out to play no role in any practical problem
        answer: a
        feedback: The result was correct but narrow, covering single-layer networks. Networks with a hidden layer compute XOR, and backpropagation (1986) made such networks trainable.
      - id: history.base.v3.3
        prompt: Deep Blue (1997) and AlphaGo (2016) both beat top human players. What was new about AlphaGo?
        options:
          - id: a
            text: It used search, which Deep Blue had done without
          - id: b
            text: It learned to judge positions instead of using hand-tuned rules
          - id: c
            text: It was the first program to beat people at any board game
        answer: b
        feedback: Deep Blue relied on hand-tuned scoring and huge brute-force search; AlphaGo learned its judgment from human games and self-play. Both used search, and Samuel's checkers program learned to beat its own author decades earlier.
      - id: history.base.v3.4
        prompt: GPT-3 could already write fluent text. What made ChatGPT (2022) behave like a helpful assistant instead of an autocomplete?
        options:
          - id: a
            text: A new architecture that replaced the Transformer
          - id: b
            text: Looking up every answer on the web before replying
          - id: c
            text: Instruction tuning and RLHF on a pretrained model
        answer: c
        feedback: People wrote example answers and ranked the model's answers, and the pretrained model was trained toward what they preferred. ChatGPT was still built on a Transformer and didn't need to search the web to answer.
  - id: history.transfer.v3
    objective_ref: objective.history
    task: transfer
    response_type: single_choice
    points: 1
    hint: Match the new situation to a lesson from history. A narrow result read as a verdict on a field, a demo in a world built for it, costly rule upkeep, and fooled judges have all happened before.
    remediation_scene: history.s3
    variants:
      - id: history.transfer.v3.1
        prompt: 'A 2025 headline says "Study proves AI can''t reason." The study tested one model on one type of puzzle. What does AI history suggest?'
        options:
          - id: a
            text: Studies like this usually mean a new AI winter is coming
          - id: b
            text: Check what was tested; a narrow result is often read too broadly
          - id: c
            text: The claim must be false, since AI keeps improving over time
        answer: b
        feedback: Like *Perceptrons*, a precise result about one design can be misread as a verdict on the whole field. Winters came from many causes together, and steady progress elsewhere doesn't make this result false.
      - id: history.transfer.v3.2
        prompt: A startup demos a home robot in a spotless, brightly lit showroom and says it "works in any home." Which historical system is the best warning?
        options:
          - id: a
            text: Shakey, which planned well in rooms built to suit it
          - id: b
            text: ELIZA, which fooled people with keyword patterns
          - id: c
            text: Deep Blue, which won by searching millions of positions
        answer: a
        feedback: Shakey's plain walls, careful lighting, and painted blocks made its planning work; real homes are messier. ELIZA's lesson is about conversation, and Deep Blue's is about search at scale.
      - id: history.transfer.v3.3
        prompt: A company's 1985 expert system gave excellent advice but was retired in 1990. Based on AI history, what is the most likely reason?
        options:
          - id: a
            text: Keeping its thousands of hand-written rules up to date got too costly
          - id: b
            text: Statistical models had by then been shown better at every such task
          - id: c
            text: Its rules stopped working once the company upgraded its computers
        answer: a
        feedback: Expert systems worked, but writing and maintaining their rules was expensive and they broke on unusual cases. Statistical methods were only starting to spread around 1990, and rules don't stop working on new hardware.
      - id: history.transfer.v3.4
        prompt: A news story says a chatbot "passed the Turing test" because 30% of judges mistook it for a human in five-minute chats. What did the test measure?
        options:
          - id: a
            text: That the chatbot understands and thinks as a person does
          - id: b
            text: That its inner workings resemble those of a human brain
          - id: c
            text: How well its replies fooled those judges in those chats
        answer: c
        feedback: The imitation game measures whether judges can tell by typed replies, under particular conditions. ELIZA showed in the 1960s that fooling people doesn't require understanding.
