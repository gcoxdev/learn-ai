schema_version: 0.2-draft
lesson:
  id: history
  version: 0.2.0-draft
  title: The questions that shaped AI
  state: draft
  summary: Build a map from early questions to modern systems. Use each milestone to ask what changed in methods,
    resources, and evidence.
  slot: M01.8
  category: common
  minutes: 10
  sources:
  - title: Dartmouth research proposal — August 31, 1955
    url: https://www-formal.stanford.edu/jmc/history/dartmouth/dartmouth.html
  - title: McCulloch and Pitts — a logical calculus (1943)
    url: https://doi.org/10.1007/BF02478259
  - title: Turing — Computing Machinery and Intelligence (1950)
    url: https://www.csee.umbc.edu/courses/471/papers/turing.pdf
  - title: SRI — Shakey the Robot
    url: https://www.sri.com/hoi/shakey-the-robot/
  - title: Rumelhart, Hinton, and Williams — back-propagating errors (1986)
    url: https://www.nature.com/articles/323533a0
  - title: Krizhevsky, Sutskever, and Hinton — ImageNet classification (2012)
    url: https://proceedings.neurips.cc/paper/2012/hash/c399862d3b9d6b76c8436e924a68c45b-Abstract.html
  - title: Vaswani and colleagues — Attention Is All You Need (2017)
    url: https://arxiv.org/abs/1706.03762
  archetype: perspective
objectives:
- id: objective.history
  version: 2-draft
  statement: Compare historical AI approaches and connect milestones to bounded evidence rather than a story of
    total replacement.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - history.base.v2
  - history.transfer.v2
  prerequisites:
  - anyOf:
    - objective.ai-systems
scenes:
- id: history.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.history
  title: Make a map with more than dates
  markdown: 'Begin with an ordinary task: deliver a parcel. A rule system can enforce restrictions, search can explore
    routes, a learned model can estimate travel time, and feedback can correct the vehicle’s motion. Those pieces
    point to different historical traditions within AI. A timeline helps locate important publications and demonstrations,
    while a dependency map helps explain which ideas a mechanism needs. Neither is a ladder on which every newer
    method makes the earlier ones irrelevant.'
  text_mode: 'Begin with an ordinary task: deliver a parcel. A rule system can enforce restrictions, search can
    explore routes, a learned model can estimate travel time, and feedback can correct the vehicle’s motion. Those
    pieces point to different historical traditions within AI. A timeline helps locate important publications and
    demonstrations, while a dependency map helps explain which ideas a mechanism needs. Neither is a ladder on which
    every newer method makes the earlier ones irrelevant.'
  bridges: []
- id: history.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.history
  title: Use early landmarks to separate questions
  markdown: 'McCulloch and Pitts’s 1943 work connects idealized neural units with logical computation. Turing’s
    1950 paper examines machine intelligence through arguments and a behavioral framing. The 1955 Dartmouth proposal
    outlines a research agenda for summer 1956. These are different contributions: a mathematical abstraction, a
    way to discuss and test behavior, and an organizing proposal. The important distinction is what each contributes
    and what evidence it provides. A research goal is not a completed capability, and an abstraction is not a whole
    brain.'
  text_mode: 'McCulloch and Pitts’s 1943 work connects idealized neural units with logical computation. Turing’s
    1950 paper examines machine intelligence through arguments and a behavioral framing. The 1955 Dartmouth proposal
    outlines a research agenda for summer 1956. These are different contributions: a mathematical abstraction, a
    way to discuss and test behavior, and an organizing proposal. The important distinction is what each contributes
    and what evidence it provides. A research goal is not a completed capability, and an abstraction is not a whole
    brain.'
  bridges: []
- id: history.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.history
  title: Rules and search make reasoning explicit
  markdown: Symbolic approaches represent facts and possible actions so a program can work through them. SRI’s Shakey
    robot project connected several such capabilities in a controlled physical setting. Expert systems then emphasized
    substantial domain knowledge in specialized tasks. Their strengths included explicit structure and inspectable
    reasoning steps; their challenges included missing knowledge, exceptions, and the work needed to keep representations
    accurate. These methods still help when a task calls for explicit constraints or searching through alternatives.
  text_mode: Symbolic approaches represent facts and possible actions so a program can work through them. SRI’s
    Shakey robot project connected several such capabilities in a controlled physical setting. Expert systems then
    emphasized substantial domain knowledge in specialized tasks. Their strengths included explicit structure and
    inspectable reasoning steps; their challenges included missing knowledge, exceptions, and the work needed to
    keep representations accurate. These methods still help when a task calls for explicit constraints or searching
    through alternatives.
  bridges: []
- id: history.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.history
  title: Learning changes how some of the rules are obtained
  markdown: Statistical learning estimates patterns from examples instead of requiring every predictive relation
    to be written by a person. Neural networks extend this idea through connected learned calculations. Backpropagation
    helps compute how a loss responds to earlier weights, and modern hardware can make larger experiments practical.
    The 2012 ImageNet result associated with AlexNet is one important image-recognition milestone. It belongs to
    an interaction of architecture, data, optimization, and resources, not a story in which a single new word explains
    the whole change.
  text_mode: Statistical learning estimates patterns from examples instead of requiring every predictive relation
    to be written by a person. Neural networks extend this idea through connected learned calculations. Backpropagation
    helps compute how a loss responds to earlier weights, and modern hardware can make larger experiments practical.
    The 2012 ImageNet result associated with AlexNet is one important image-recognition milestone. It belongs to
    an interaction of architecture, data, optimization, and resources, not a story in which a single new word explains
    the whole change.
  bridges: []
- id: history.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.history
  markdown: Use two different examples to check your understanding. Hints are available for practice. A later, fresh
    answer without hints can demonstrate personal-study mastery.
  text_mode: Labeled radio options and a submit button; no timing requirement.
  takeaway: AI history is a set of interacting approaches. A useful timeline records the task, method, evidence,
    and limits of each milestone.
- id: history.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.history
  markdown: AI history includes symbolic reasoning, statistical learning, neural methods, and changing access to
    data and computation—not one straight line of invention.
  text_mode: AI history includes symbolic reasoning, statistical learning, neural methods, and changing access to
    data and computation—not one straight line of invention.
- id: history.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.history
  title: Broad pretraining connects multiple applications
  markdown: 'The 2017 Transformer paper is an important architecture milestone. Broad pretraining, later adaptation,
    and integration with retrieval or tools help turn reusable models into many applications. Those components answer
    different questions: what the calculation looks like, how settings are learned, what information arrives in
    a request, and how the result is checked. A strong result in one application may not establish another. Later
    lessons examine these stages individually so a modern model family name can be unpacked into an actual system.'
  text_mode: 'The 2017 Transformer paper is an important architecture milestone. Broad pretraining, later adaptation,
    and integration with retrieval or tools help turn reusable models into many applications. Those components answer
    different questions: what the calculation looks like, how settings are learned, what information arrives in
    a request, and how the result is checked. A strong result in one application may not establish another. Later
    lessons examine these stages individually so a modern model family name can be unpacked into an actual system.'
  bridges: []
- id: history.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.history
  title: Practice writing one careful historical claim
  markdown: 'Choose a milestone and write four short lines: its task, its method, its evidence, and an unanswered
    question. For a robot demonstration, describe the environment instead of calling it a person. For a benchmark
    gain, name the test rather than saying it solved intelligence. For a proposal, keep the future tense. Then add
    an arrow to a later idea it influenced, explaining the connection in words. This map prepares you to read future
    research without treating popularity, age, or a product label as proof.'
  text_mode: 'Choose a milestone and write four short lines: its task, its method, its evidence, and an unanswered
    question. For a robot demonstration, describe the environment instead of calling it a person. For a benchmark
    gain, name the test rather than saying it solved intelligence. For a proposal, keep the future tense. Then add
    an arrow to a later idea it influenced, explaining the connection in words. This map prepares you to read future
    research without treating popularity, age, or a product label as proof.'
  bridges: []
