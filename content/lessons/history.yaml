scenes:
- id: history.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.history
  text_mode: The complete explanation is available as readable text.
  title: An old question, many approaches
  markdown: 'Could a machine reason, recognize patterns, or learn? These questions predate today’s chat interfaces.
    Early work explored formal reasoning, computation, and simplified mathematical neurons.


    The 1956 Dartmouth summer project helped establish AI as a named research field. Its proposal was written
    in 1955.'
- id: history.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.history
  text_mode: The complete explanation is available as readable text.
  title: Rules, search, and expert knowledge
  markdown: 'Symbolic programs represented facts and rules, explored possible moves, and reasoned over explicit
    structures. Expert systems later encoded specialized knowledge.


    These methods showed that useful behavior could come from carefully structured representations. They also
    exposed the difficulty of specifying enough knowledge and handling messy real situations.'
- id: history.s3
  type: explanation
  depth: intuition
  objective_refs:
  - objective.history
  text_mode: The complete explanation is available as readable text.
  title: Learning from data grows in importance
  markdown: 'Statistical learning models uncertainty and learns patterns from examples. Neural methods learn
    layers of representations. Improvements in data, computation, algorithms, and evaluation supported later
    progress.


    The 2012 AlexNet image-recognition result and the 2017 transformer paper are influential milestones, not
    the beginnings of neural networks or AI.'
- id: history.s4
  type: explanation
  depth: intuition
  objective_refs:
  - objective.history
  text_mode: The complete explanation is available as readable text.
  title: History branches rather than disappears
  markdown: 'Today, a system can combine a neural predictor, symbolic rules, retrieval, search, and optimization.
    Earlier traditions remain useful.


    As you study a system, connect its mechanism to the question it addressed. Avoid treating a recent product
    release as the invention of the underlying idea.'
- id: history.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
