assessment_families:
- id: history.base
  objective_ref: objective.history
  task: base
  response_type: single_choice
  points: 1
  hint: AI history includes symbolic reasoning, statistical learning, neural methods, and changing access to
    data and computation—not one straight line of invention.
  variants:
  - id: history.base.1
    prompt: What role did the 1956 Dartmouth project play?
    options:
    - id: a
      text: It introduced today’s transformer architecture.
    - id: b
      text: It was the first use of mathematics in computing.
    - id: correct
      text: It helped establish AI as a named research field.
    answer: correct
    feedback: It helped establish AI as a named research field.
  - id: history.base.2
    prompt: Which description fits symbolic AI?
    options:
    - id: b
      text: Eliminating all representations from a program.
    - id: correct
      text: Representing and manipulating explicit facts, rules, or structures.
    - id: a
      text: Only predicting the next token in text.
    answer: correct
    feedback: Representing and manipulating explicit facts, rules, or structures.
- id: history.transfer
  objective_ref: objective.history
  task: transfer
  response_type: single_choice
  points: 1
  hint: AI history includes symbolic reasoning, statistical learning, neural methods, and changing access to
    data and computation—not one straight line of invention.
  variants:
  - id: history.transfer.1
    prompt: A modern application combines neural predictions with rules and search. Is that inconsistent with
      AI history?
    options:
    - id: b
      text: Yes. A system can contain only one algorithm.
    - id: correct
      text: No. Different traditions can contribute to one system.
    - id: a
      text: Yes. Modern systems must discard earlier methods.
    answer: correct
    feedback: No. Different traditions can contribute to one system.
  - id: history.transfer.2
    prompt: Why is “AI began with chatbots” an incomplete account?
    options:
    - id: correct
      text: Many earlier research traditions and mechanisms contributed to current systems.
    - id: a
      text: Because no AI system has ever used language.
    - id: b
      text: Because only robots count as AI.
    answer: correct
    feedback: Many earlier research traditions and mechanisms contributed to current systems.
