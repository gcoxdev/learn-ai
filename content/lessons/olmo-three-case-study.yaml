schema_version: 0.2-draft
lesson:
  id: olmo-three-case-study
  version: 0.4.0-draft
  title: Inspect the Olmo 3 model flow
  state: draft
  summary: With Olmo 3 you can download the model from halfway through training, and the exact tokens it read. Use that to size it, cost it, and design an experiment only a fully open model allows.
  slot: M35.6
  category: learning
  sources:
    - title: Olmo 3 report v2
      url: https://arxiv.org/abs/2512.13961v2
    - title: Olmo 3 Think model card
      url: https://huggingface.co/allenai/Olmo-3-7B-Think
    - title: OLMo-core official training code
      url: https://github.com/allenai/OLMo-core
objectives:
  - id: objective.olmo-three-case-study
    version: 2-draft
    statement: Olmo 3 connects released training artifacts with dense architecture, staged base training, and distinct Think, Instruct, and RL-Zero branches; reproducibility requires tracing the exact branch and inputs.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - olmo-three-case-study.base.v2
      - olmo-three-case-study.transfer.v2
      - olmo-three-case-study.calculate
    prerequisites:
      - anyOf:
          - objective.model-report-and-artifact-inventory
      - anyOf:
          - objective.continued-pretraining
      - anyOf:
          - objective.direct-preference-optimization
      - anyOf:
          - objective.verifiable-rewards
scenes:
  - id: olmo-three-case-study.s1
    title: A model you can rewind
    type: explanation
    depth: intuition
    objective_refs:
      - objective.olmo-three-case-study
    markdown: |-
      Maya is a graduate student who wants to know *when* a language model learns to solve word problems. With Llama 3.1 or DeepSeek-V3 she can only test the finished model. With Ai2's Olmo 3 she can load the checkpoint saved at the end of each training stage, read the exact tokens each stage trained on, and rerun a stage with the released code.

      That's what **fully open** means: the inputs and intermediate states are published, not just the result. This lesson follows Olmo 3's **model flow**, Ai2's name for the path from data to released models.

      Pin the objects. We use **Olmo 3 report revision 2 (April 14, 2026)**, which also covers the later **Olmo 3.1** updates. Keep original Olmo 3 checkpoints and 3.1 checkpoints in separate rows, and start from a specific model card, such as `allenai/Olmo-3-7B-Think`, not the family name.
    bridges: []
  - id: olmo-three-case-study.s2
    title: Two sizes, two attention designs
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.olmo-three-case-study
    markdown: |-
      From the report's Table 33 and the released configs:

      | | Olmo 3 7B | Olmo 3 32B |
      | --- | ---: | ---: |
      | Layers / width | 32 / 4,096 | 64 / 5,120 |
      | Query / KV heads | 32 / 32 (full multi-head) | 40 / 8 (grouped-query) |
      | Parameters (computed) | 7.3B | 32.2B |
      | Pretraining tokens | 5.93T | 5.5T |
      | Context | 8K in pretraining, 65K after extension | same |

      Both use a 100,278-entry vocabulary derived from OpenAI's cl100k tokenizer, QK-Norm, and a new **sliding-window attention** pattern: in three of every four layers, each token attends only to the previous 4,096 tokens. The last layer always sees everything.

      :::predict Olmo 3 7B and Llama 3.1 8B are close in size. How do their KV caches per token compare?
      The 7B caches all 32 heads: 2 × 32 × 32 × 128 × 2 bytes = 512 KiB per token, four times Llama 3.1 8B's 128 KiB with 8 KV heads. Copying a Llama cache estimate would be four times too small.
      :::

      The sliding window claws much of that back at long lengths. A windowed layer never keeps more than 4,096 tokens, so in 24 of the 7B's 32 layers the cache stops growing. At 65,536 tokens, the cache is 9.5 GiB instead of 32 GiB, if your serving engine takes advantage of the window.
    bridges: []
  - id: olmo-three-case-study.s3
    title: Three base stages and their bill
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.olmo-three-case-study
    markdown: |-
      The base model goes through three stages, each with its own released data mix:

      1. **Pretraining** on Dolma 3 Mix, about 6T tokens drawn from a 9T-token pool, at 8,192 context.
      2. **Midtraining** on Dolma 3 Dolmino Mix, 100B tokens. **Midtraining** is still next-token prediction, like pretraining, but on a small mix aimed at target skills: math, code, question answering, plus some instruction data and thinking traces to prepare for post-training. The 32B ran it twice with different data orders and averaged the two results.
      3. **Long-context extension** on Dolma 3 Longmino Mix: 50B tokens for the 7B and 100B for the 32B, at 65,536 context, with YaRN applied to the full-attention layers only.

      The report also gives measured training speed, which lets you check its compute:

      ```python run
      # Olmo 3 model sheet: report Table 33 (architecture) and Tables 34-35 (training)
      # name: (layers, width, FFN, q heads, kv heads, pretraining tokens, tokens/s per H100)
      models = {"Olmo 3 7B":  (32, 4096, 11008, 32, 32, 5.93e12, 7700),
                "Olmo 3 32B": (64, 5120, 27648, 40, 8, 5.5e12, 2000)}
      vocab, hd, ctx, window = 100278, 128, 65536, 4096

      for name, (L, d, ffn, q, kvh, D, tps) in models.items():
          N = L * (2 * d * q * hd + 2 * d * kvh * hd + 3 * d * ffn) + 2 * vocab * d
          per_layer = 2 * kvh * hd * 2                     # K and V bytes per token per layer
          full = L * per_layer * ctx                       # every layer keeps all 65,536 tokens
          swa = (L // 4) * per_layer * ctx + (L - L // 4) * per_layer * window
          hours = D / tps / 3600
          print(f"{name}: {N / 1e9:.1f}B, bf16 {2 * N / 1e9:.1f} GB | KV {L * per_layer / 1024:.0f} KiB/token | "
                f"65K cache {full / 2**30:.1f} GiB, with window {swa / 2**30:.1f} GiB")
          print(f"   6ND {6 * N * D:.2e} FLOPs, {hours / 1e3:.0f}K GPU-hours -> "
                f"{6 * N * tps / 989e12:.0%} of H100 bf16 peak")
      ```

      For the 32B, 6ND gives 1.06 × 10²⁴ FLOPs and about 764K H100-hours, running at 39% of peak. The report states roughly 41% utilization for the 32B and 43% for the 7B; 6ND leaves out attention's own arithmetic, and attention is a bigger share of the smaller model's work, so the 7B's 6ND figure (34%) falls further short.

      The 764K is computed from the throughput. The report's own wall-clock breakdown, about 9.5 days on 512 GPUs and then 35 days on 1,024, comes to nearly 980K GPU-hours, because it includes crash restarts. It prices the whole effort, about 56 days on a 1,024-GPU cluster up to Olmo 3 Think 32B, at \$2.75M at \$2 per H100-hour.
    bridges: []
  - id: olmo-three-case-study.s4
    title: Three branches from one base
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.olmo-three-case-study
    markdown: |-
      After the base, the flow splits into three post-trained families, each with its own released Dolci datasets:

      - **Think**: SFT, then DPO, then RL with verifiable rewards (RLVR). It writes long reasoning before answering.
      - **Instruct**: SFT, DPO, and RL tuned for short, direct replies and function calling.
      - **RL-Zero**: RLVR applied directly to the base, with no SFT or DPO, in math, code, instruction-following, general-chat, and mixed versions (7B). It's an open counterpart to DeepSeek's R1-Zero. Because the pretraining and midtraining data are public, the team could remove any RL problems that already appeared there, so RL gains aren't just the model recalling text it had seen.

      The 3.1 updates are later points on these branches. Olmo 3.1 Think 32B, for example, continued the best Think RL run for 21 more days on 224 GPUs. That makes it a different checkpoint from Olmo 3 Think 32B, so it gets its own row.
    diagram:
      caption: The Olmo 3 model flow. Every box has released data and checkpoints.
      description: Pretraining on Dolma 3 Mix feeds midtraining on Dolmino Mix, which feeds long-context extension on Longmino Mix, producing Olmo 3 Base. The base feeds three branches. Think goes through SFT, DPO, and RLVR. Instruct goes through SFT, DPO, and RL for short answers. RL-Zero applies RLVR directly to the base.
      nodes:
        - id: pre
          label: Pretraining
          note: Dolma 3 Mix, ~6T tokens
          col: 0
          row: 0
          tone: data
        - id: mid
          label: Midtraining
          note: Dolmino Mix, 100B tokens
          col: 1
          row: 0
          tone: data
        - id: long
          label: Long-context extension
          note: Longmino Mix, to 65K
          col: 2
          row: 0
          tone: data
        - id: base
          label: Olmo 3 Base
          col: 3
          row: 0
          tone: accent
        - id: think
          label: Think
          note: SFT, DPO, RLVR
          col: 4
          row: 0
        - id: instruct
          label: Instruct
          note: SFT, DPO, RL; short replies
          col: 4
          row: 1
        - id: zero
          label: RL-Zero
          note: RLVR straight from base
          col: 4
          row: 2
      edges:
        - from: pre
          to: mid
        - from: mid
          to: long
        - from: long
          to: base
        - from: base
          to: think
        - from: base
          to: instruct
        - from: base
          to: zero
    bridges: []
  - id: olmo-three-case-study.s5
    title: What "fully open" puts in your hands
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.olmo-three-case-study
    markdown: |-
      Run the inventory from the lesson on reading a release, and nearly every row fills in:

      - weights under Apache 2.0, with checkpoints at the end of every stage and `step_XXXX` revisions during post-training
      - the actual training mixes *and* the larger pools they were drawn from
      - small sample mixes (150B tokens for pretraining, 10B for midtraining) for cheap experiments
      - training code (OLMo-core for the base, Open Instruct for post-training)

      Openness gives you the ingredients, not the kitchen. Rerunning the 32B's pretraining still takes hundreds of thousands of H100-hours, and a different cluster or data order gives a slightly different model. The sample mixes make small, controlled experiments affordable.
    bridges: []
  - id: olmo-three-case-study.s6
    title: Design Maya's checkpoint comparison
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.olmo-three-case-study
    markdown: |-
      Maya compares two 7B checkpoints on the same branch: the end of pretraining and the end of midtraining. She writes 50 fresh word problems, fixes one prompt format and one scoring rule, and records score and answer length for each.

      Suppose the scores come back 31/50 and then 38/50. What can she claim?

      | Claim | Supported? |
      | --- | --- |
      | "Math improved over the midtraining interval" | Yes, with matched settings on the same lineage |
      | "The math data in Dolmino caused it" | Not yet |

      Midtraining changed several things at once: math *and* code *and* QA data, instruction examples, and a learning rate decaying to zero. Only Olmo lets her go further. She can retrain from the pretraining checkpoint on the 10B midtraining sample mix twice, once with the math sources and once without, keeping everything else fixed.

      :::mixup "A jump between two checkpoints tells you which data caused it."
      It tells you *when* the change happened. Everything that changed in that interval is a suspect until an ablation removes one of them.
      :::
    bridges: []
  - id: olmo-three-case-study.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.olmo-three-case-study
    markdown: Size Olmo 3's caches and training compute, then advise a team copying a cache estimate, a researcher testing one data source, and a lab planning a reproduction.
    takeaway: |-
      Olmo 3 releases data, code, and checkpoints for every stage: pretraining, midtraining, long-context extension, then Think, Instruct, and RL-Zero branches. Use its configs for memory, its throughput for compute, and its sample mixes for controlled experiments.
  - id: olmo-three-case-study.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.olmo-three-case-study
    markdown: |-
      Olmo 3 exposes intermediate artifacts and distinct adaptation branches. Trace the exact branch, data, and configuration before comparing checkpoints or attempting reproduction.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - olmo-three-case-study.s1
        - olmo-three-case-study.s2
        - olmo-three-case-study.s3
        - olmo-three-case-study.s4
        - olmo-three-case-study.s5
        - olmo-three-case-study.s6
