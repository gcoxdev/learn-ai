  category: learning
  minutes: 18
  sources:
  - title: Olmo 3 report v2
    url: https://arxiv.org/abs/2512.13961v2
  - title: Olmo 3 Think model card
    url: https://huggingface.co/allenai/Olmo-3-7B-Think
  - title: OLMo-core official training code
    url: https://github.com/allenai/OLMo-core
objectives:
- id: objective.olmo-three-case-study
  version: 1-draft
  statement: Olmo 3 connects released training artifacts with dense architecture, staged base training, and distinct
    Think, Instruct, and RL-Zero branches; reproducibility requires tracing the exact branch and inputs.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - olmo-three-case-study.base
  - olmo-three-case-study.transfer
  prerequisites:
  - anyOf:
