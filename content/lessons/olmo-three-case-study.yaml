      gate_refs:
        - gate.core
  scene_aliases:
    olmo-three-case-study.recap: olmo-three-case-study.check
assessment_families:
  - id: olmo-three-case-study.base
    objective_ref: objective.olmo-three-case-study
    task: base
    response_type: single_choice
    points: 1
    hint: Read the attention design for the exact size you're asking about; the 7B and 32B differ.
    remediation_scene: olmo-three-case-study.s2
    variants:
      - id: olmo-three-case-study.base.1
        prompt: Do the reported 7B and 32B configurations both use GQA?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Neither uses attention
          - id: a
            text: No; 7B uses MHA and 32B uses GQA
        answer: a
        feedback: Inspect architecture at the checkpoint level.
        retired: true
      - id: olmo-three-case-study.base.2
        prompt: What separates the base development stages?
        options:
          - id: c
            text: A change from dense to MoE in every stage
          - id: a
            text: Pretraining, midtraining, and long-context extension
          - id: b
            text: Only a file rename
        answer: a
        feedback: Training stages differ in data and schedule choices.
        retired: true
  - id: olmo-three-case-study.transfer
    objective_ref: objective.olmo-three-case-study
    task: transfer
    response_type: single_choice
    points: 1
    hint: A jump between checkpoints shows when something changed; only an ablation shows which change caused it.
    remediation_scene: olmo-three-case-study.s6
    variants:
      - id: olmo-three-case-study.transfer.1
        prompt: Should a Think recipe automatically be assigned to RL-Zero?
        options:
          - id: c
            text: Only if both are 7B
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Branch initialization and adaptation differ.
        retired: true
      - id: olmo-three-case-study.transfer.2
        prompt: Do released artifacts remove the need to record the execution environment?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if intermediate checkpoints exist
        answer: a
        feedback: Reproduction still depends on versions, hardware, and procedure.
        retired: true
  - id: olmo-three-case-study.base.v2
    objective_ref: objective.olmo-three-case-study
    task: base
    response_type: single_choice
    points: 1
    hint: Place the question on the model flow (base stage, branch, or attention layer), then recall what that step does.
    remediation_scene: olmo-three-case-study.s3
    variants:
      - id: olmo-three-case-study.base.v2.1
        prompt: Olmo 3 7B and Llama 3.1 8B are similar in size, yet the Olmo model caches 512 KiB per token against Llama's 128. Why?
        options:
          - id: b
            text: Olmo's larger vocabulary needs a wider key for each token
          - id: a
            text: Olmo 3 7B keeps all 32 KV heads, while Llama shares 8 across its heads
          - id: c
            text: Sliding-window layers store each token twice, once per window
        answer: a
        feedback: Cache per token is 2 × layers × KV heads × head width × bytes, and 32 KV heads against 8 gives the factor of four. Olmo's vocabulary is actually smaller, and vocabulary doesn't enter the cache; the window limits how many tokens are kept, and doesn't duplicate them.
      - id: olmo-three-case-study.base.v2.2
        prompt: What is Olmo 3's midtraining stage?
        options:
          - id: c
            text: Supervised fine-tuning on chat pairs, with the loss masked on prompts
          - id: b
            text: RL on verifiable problems, inserted between two pretraining runs
          - id: a
            text: Next-token training on a 100B-token mix aimed at target skills
        answer: a
        feedback: Midtraining keeps the pretraining objective but switches to a small, targeted mix (math, code, QA, some instruction data and thinking traces). SFT and RLVR come later, in the post-training branches.
      - id: olmo-three-case-study.base.v2.3
        prompt: How does the Olmo 3 RL-Zero branch differ from the Think branch?
        options:
          - id: a
            text: It applies RLVR straight to the base, skipping SFT and DPO
          - id: b
            text: It runs RLVR after Think's SFT and DPO, but with fewer steps
          - id: c
            text: It distills Think's outputs into the base, without RL at all
        answer: a
        feedback: RL-Zero starts from Olmo 3 Base with no supervised or preference stage, like DeepSeek's R1-Zero. Think goes SFT, DPO, then RLVR.
      - id: olmo-three-case-study.base.v2.4
        prompt: Olmo 3 uses sliding-window attention in three of every four layers. What does that change?
        options:
          - id: b
            text: It shrinks the weights, since windowed layers have fewer parameters
          - id: a
            text: Those layers keep at most 4,096 past tokens, so long-context cache grows slower
          - id: c
            text: It cuts the number of KV heads in those layers from 32 to 8
        answer: a
        feedback: A windowed layer attends to, and needs to cache, only the last 4,096 tokens. For the 7B at 65,536 tokens that's 9.5 GiB instead of 32. The window doesn't change the weights or the head counts.
  - id: olmo-three-case-study.transfer.v2
    objective_ref: objective.olmo-three-case-study
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what the released artifacts make possible (a checkpoint comparison, an ablation, or a rerun) and what each can and can't tell you.
    remediation_scene: olmo-three-case-study.s6
    variants:
      - id: olmo-three-case-study.transfer.v2.1
        prompt: A researcher wants to know whether the olmOCR science PDFs in Dolma 3 improved science question answering. What does Olmo's release let her do?
        options:
          - id: c
            text: Ask the final model which sources it learned its science answers from
          - id: b
            text: Compare the checkpoints before and after pretraining on science questions
          - id: a
            text: Train small models on the sample mix, with and without that source
        answer: a
        feedback: Released data and code allow a controlled ablation that varies one source. Checkpoint comparisons mix every source together, and a model can't report where it learned something.
      - id: olmo-three-case-study.transfer.v2.2
        prompt: After midtraining, a 7B checkpoint solves 7 more of 50 math problems than before. A colleague writes "the math data caused the gain." What's the better claim?
        options:
          - id: a
            text: Math improved over the midtraining interval, whose data and schedule both changed
          - id: b
            text: The math data caused the gain, since the report says midtraining targets math
          - id: c
            text: Nothing can be concluded, since the two checkpoints came from different stages
        answer: a
        feedback: The interval added math, code, QA, and instruction data, and decayed the learning rate. Matched settings on one lineage support "it improved here"; picking one cause needs an ablation. Different stages are exactly what this comparison is for.
      - id: olmo-three-case-study.transfer.v2.3
        prompt: A team sizing GPUs for Olmo 3 7B at 32K-token contexts reuses its Llama 3.1 8B estimate of 128 KiB per token. What have they missed?
        options:
          - id: b
            text: Olmo's larger vocabulary, which raises the cache per token
          - id: c
            text: Olmo's longer 65K context, which doubles the cache per token
          - id: a
            text: Olmo's full multi-head attention, 512 KiB per token before windowing
        answer: a
        feedback: The 7B caches 32 KV heads, four times Llama's 8, so the estimate is 4× too small before any sliding-window savings. Context length changes how many tokens are cached, not the bytes per token, and Olmo's vocabulary is smaller.
      - id: olmo-three-case-study.transfer.v2.4
        prompt: A startup says "Olmo 3 is fully open, so we'll reproduce the 32B next month on our 16 GPUs." What's the realistic response?
        options:
          - id: c
            text: Possible, since the released code resumes from any checkpoint in hours
          - id: a
            text: The inputs are public, but pretraining alone took about 764K H100-hours
          - id: b
            text: Impossible, since the full pretraining data was withheld for licensing reasons
        answer: a
        feedback: At 2,000 tokens per second per GPU, 5.5T tokens is about 764K GPU-hours (computed; the report's wall-clock figures, with restarts, come to nearly 980K), roughly five years on 16 GPUs. The data mixes were released; the sample mixes are the affordable way to experiment.
  - id: olmo-three-case-study.calculate
    objective_ref: objective.olmo-three-case-study
    task: base
    response_type: numeric
    points: 1
    hint: "Cache per token = 2 × layers × KV heads × 128 × 2 bytes. Weights = parameters × 2 bytes. Compute = 6 × parameters × tokens. GPU-hours = tokens ÷ (tokens per second per GPU) ÷ 3,600."
    remediation_scene: olmo-three-case-study.s3
    absolute_tolerance: 1
    variants:
      - id: olmo-three-case-study.calculate.1
        prompt: Olmo 3 7B has 32 layers and 32 KV heads of width 128, with a 2-byte cache. How many KiB does each token add?
        answer: 512
        feedback: 2 × 32 × 32 × 128 × 2 = 524,288 bytes = 512 KiB.
      - id: olmo-three-case-study.calculate.2
        prompt: Olmo 3 32B has about 32.2 billion parameters. How many GB are its weights in bf16?
        answer: 64.4
        feedback: 32.2 × 10⁹ × 2 bytes = 64.4 GB.
      - id: olmo-three-case-study.calculate.3
        prompt: Using 6ND, what is the pretraining compute of Olmo 3 32B (32.2 billion parameters, 5.5 trillion tokens), in units of 10²² FLOPs?
        answer: 106.3
        feedback: 6 × 32.2 × 10⁹ × 5.5 × 10¹² = 1.063 × 10²⁴ = 106.3 × 10²² FLOPs.
      - id: olmo-three-case-study.calculate.4
        prompt: Olmo 3 32B trained at about 2,000 tokens per second per GPU. How many thousand GPU-hours do its 5.5 trillion pretraining tokens take?
        answer: 764
        feedback: 5.5 × 10¹² ÷ 2,000 = 2.75 × 10⁹ GPU-seconds, and ÷ 3,600 ≈ 763.9 thousand GPU-hours.
      - id: olmo-three-case-study.calculate.5
        prompt: Olmo 3 7B stores 16 KiB per token in each layer. At 65,536 tokens, 8 full-attention layers keep every token and 24 windowed layers keep only 4,096. How many GiB is the cache?
        answer: 9.5
        feedback: Full layers take 8 × 16 KiB × 65,536 = 8 GiB, and windowed layers 24 × 16 KiB × 4,096 = 1.5 GiB, for 9.5 GiB in total, against 32 GiB without the window.
      - id: olmo-three-case-study.calculate.6
        prompt: Olmo 3 7B has about 7.3 billion parameters. How many GB are its weights in bf16?
        answer: 14.6
        feedback: 7.3 × 10⁹ × 2 bytes = 14.6 GB.
