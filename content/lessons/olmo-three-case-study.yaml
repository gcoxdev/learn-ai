scenes:
- id: olmo-three-case-study.s1
  title: Pin the report and branch
  type: explanation
  depth: intuition
  objective_refs:
  - objective.olmo-three-case-study
  markdown: 'Anchor: Olmo 3 report revision 2, April 14, 2026, which also discusses Olmo 3.1 updates. Keep original
    Olmo 3 checkpoints separate from later 3.1 adaptations. Sources checked September 13, 2026. Begin with a specific
    model card, not an undifferentiated family name.'
  text_mode: 'Anchor: Olmo 3 report revision 2, April 14, 2026, which also discusses Olmo 3.1 updates. Keep original
    Olmo 3 checkpoints separate from later 3.1 adaptations. Sources checked September 13, 2026. Begin with a specific
    model card, not an undifferentiated family name.'
  bridges: []
- id: olmo-three-case-study.s2
  title: Read the dense configuration
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.olmo-three-case-study
  markdown: The report describes dense 7B and 32B models; the 7B configuration uses multi-head attention while 32B
    uses grouped-query attention. Read dimensions and attention settings from the matching configuration. Even within
    one family, architecture differences affect cache estimates and invalidate a copied memory calculation.
  text_mode: The report describes dense 7B and 32B models; the 7B configuration uses multi-head attention while
    32B uses grouped-query attention. Read dimensions and attention settings from the matching configuration. Even
    within one family, architecture differences affect cache estimates and invalidate a copied memory calculation.
  bridges: []
- id: olmo-three-case-study.s3
  title: Trace the base model flow
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.olmo-three-case-study
  markdown: Base development proceeds through pretraining, midtraining, and long-context extension using the Dolma
    3 data pipeline. These are distinct distribution and schedule choices. Intermediate artifacts make it possible
    to ask when a behavior changed, provided the comparison controls evaluation settings and checkpoint lineage.
  text_mode: Base development proceeds through pretraining, midtraining, and long-context extension using the Dolma
    3 data pipeline. These are distinct distribution and schedule choices. Intermediate artifacts make it possible
    to ask when a behavior changed, provided the comparison controls evaluation settings and checkpoint lineage.
  bridges: []
- id: olmo-three-case-study.s4
  title: Follow the adaptation branch
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.olmo-three-case-study
  markdown: The Think branch uses SFT, DPO, and reinforcement learning with verifiable rewards. Instruct targets
    more direct responses, while RL-Zero explores RL from a base checkpoint. Do not merge all branch histories into
    one universal recipe. The report’s later 3.1 updates need separate rows in a comparison.
  text_mode: The Think branch uses SFT, DPO, and reinforcement learning with verifiable rewards. Instruct targets
    more direct responses, while RL-Zero explores RL from a base checkpoint. Do not merge all branch histories into
    one universal recipe. The report’s later 3.1 updates need separate rows in a comparison.
  bridges: []
- id: olmo-three-case-study.s5
  title: Follow links to executable evidence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.olmo-three-case-study
  markdown: The official Olmo-3-7B-Think card links model, data, and training resources. OLMo-core supplies training
    building blocks. Inventory exact data versions, configurations, checkpoints, and evaluation dependencies before
    attempting reproduction; openness gives inspectable ingredients but does not eliminate hardware cost, preprocessing,
    or environment differences.
  text_mode: The official Olmo-3-7B-Think card links model, data, and training resources. OLMo-core supplies training
    building blocks. Inventory exact data versions, configurations, checkpoints, and evaluation dependencies before
    attempting reproduction; openness gives inspectable ingredients but does not eliminate hardware cost, preprocessing,
    or environment differences.
  bridges: []
- id: olmo-three-case-study.s6
  title: Design a checkpoint comparison
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.olmo-three-case-study
  markdown: Choose two checkpoints on the same documented branch and a small fresh evaluation set. Record changes
    in task quality, formatting, response length, and uncertainty. Attribute differences to the interval as a whole
    unless an ablation isolates one cause. This lesson requires a written comparison, not a large training run.
  text_mode: Choose two checkpoints on the same documented branch and a small fresh evaluation set. Record changes
    in task quality, formatting, response length, and uncertainty. Attribute differences to the interval as a whole
    unless an ablation isolates one cause. This lesson requires a written comparison, not a large training run.
  bridges: []
- id: olmo-three-case-study.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.olmo-three-case-study
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Olmo 3 connects released training artifacts with dense architecture, staged base training, and distinct
    Think, Instruct, and RL-Zero branches; reproducibility requires tracing the exact branch and inputs.
