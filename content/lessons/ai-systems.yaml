schema_version: 0.2-draft
lesson:
  id: ai-systems
  version: 0.4.0-draft
  title: What is AI? Start with an everyday task
  state: draft
  summary: Your phone finds "dog" in your photos, and your inbox hides junk mail. What do these helpers have in common, and what is really going on inside them?
  slot: M00.1
  category: common
  sources:
    - title: Dive into Deep Learning — introduction
      url: https://d2l.ai/chapter_introduction/index.html
  archetype: foundation
objectives:
  - id: objective.ai-systems
    version: 4-draft
    statement: AI is a family of methods for making systems perceive, predict, reason, or act. A useful result doesn't mean the system understands the way a person does.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - ai-systems.base
      - ai-systems.transfer.v3
    prerequisites: []
scenes:
  - id: ai-systems.s1
    title: You already use AI every day
    type: explanation
    depth: intuition
    objective_refs:
      - objective.ai-systems
    markdown: |-
      Type "dog" into your phone's photo search, and pictures of dogs pop up, though you never labeled one. Your map app steers you around a traffic jam. Your email moves a "You've WON a prize!" message into the junk folder.

      Each helper is doing one particular job. That job is its **task**: the thing you want done. Naming the task is the first step to understanding any AI helper.

      | Helper | Its task |
      | --- | --- |
      | Photo search | Find the pictures that show a dog |
      | Map app | Suggest a quick route to where you're going |
      | Spam filter | Decide whether a message is junk |
      | Chat assistant | Write a useful reply to your message |

      Real helpers are big and complicated, so let's start with a job you could do with your hands: sorting a box of buttons, red ones into one pile and blue ones into another. Getting a computer to do this teaches us most of what we need.
  - id: ai-systems.s2
    title: What the letters AI stand for
    type: explanation
    depth: intuition
    objective_refs:
      - objective.ai-systems
    markdown: |-
      **AI** stands for **artificial intelligence**. It's a broad field: building computer programs that can do jobs we'd call smart if a person did them, like recognizing pictures, finding routes, choosing moves in a game, or writing text. *Artificial* just means made by people.

      Calling a program "intelligent" describes the jobs it can do. It doesn't mean the program thinks or feels the way you do.

      :::mixup "The AI is thinking about my question, the way a person would."
      Inside, an AI helper is doing a huge number of small calculations, one after another. Later in this module you'll see those steps for a tiny example. A chat assistant that writes "Hmm, let me think…" is choosing words that sound natural. A friendly tone tells you nothing about whether the answer is right, so judge a helper by its answers, not by how human it sounds.
      :::
  - id: ai-systems.s3
    title: A computer follows steps exactly
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-systems
    markdown: |-
      A **program** is a set of instructions a computer can carry out. An **algorithm** is a step-by-step procedure for getting a job done. Here is one for the buttons:

      1. Pick up the next button.
      2. If it is red, put it in the left pile.
      3. If it is blue, put it in the right pile.
      4. If the box is not empty, go back to step 1.

      It's like a recipe: the steps come in order. But unlike a cook, a computer won't fill in a missing step with common sense.

      :::predict The box contains one green button. What happens when the computer reaches it?
      No step mentions green. Depending on how the program was written, it might skip the button, stop with an error, or drop it in the wrong pile. A person would ask, "What about green?" A computer can't. For a green button, or one that's half red and half blue, someone has to tell the program what to do.
      :::
  - id: ai-systems.s4
    title: Write the rules, or learn from examples
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-systems
    markdown: |-
      There are two very different ways to give a computer its steps.

      You can write a *rule* yourself: "If the button is red, put it on the left." A spam rule might say: "If the subject contains 'You've WON', mark it as junk."

      Or you can show the computer lots of examples, such as hundreds of button photos marked "red" or "blue," and let it adjust how it sorts. Many spam filters learn from messages that people have marked as junk. Using examples to adjust a program's behavior is called **machine learning**.

      | | Write a rule | Learn from examples |
      | --- | --- | --- |
      | Steps come from | A person | Adjusting to fit examples |
      | Works well when | The job is easy to describe | The job is easier to show than describe |

      Machine learning is only one part of AI. Your map app finds a route mainly by *searching*: trying many possible paths and keeping the quickest. Many real helpers mix these approaches, as you'll see later in this module.
  - id: ai-systems.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.ai-systems
    markdown: Garden helpers, puzzle apps, chess programs, and spam filters ask you to name the job, spot the approach, and pick the test that would catch a mistake.
    takeaway: |-
      AI is a family of ways to get computers to do jobs like recognizing, choosing, and writing. Start by naming the job, and judge a helper by how well it does that job, not by how human it sounds.
  - id: ai-systems.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.ai-systems
    markdown: |-
      AI is a family of methods for making systems perceive, predict, reason, or act. A useful result is not proof of human-like understanding.
  - id: ai-systems.s5
    title: One right answer is a starting point
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-systems
    markdown: |-
      Your button sorter looks at a photo of a bright red button and says "red." Hooray! Now try harder cases:

      | Test photo | What it might reveal |
      | --- | --- |
      | A faded, pinkish-red button | Where "red" stops for this sorter |
      | A red button in shadow | Whether dim light fools it |
      | A red bottle cap | Whether it only knows buttons, or anything red |

      Each new case can reveal something the easy one hid, so test shadowed and faded buttons before you rely on the sorter.

      This is why the task needs careful wording. "Sort these buttons, photographed on a white table" is a much smaller job than "find buttons in any photo."
  - id: ai-systems.s6
    title: Describe a helper to a friend
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-systems
    markdown: |-
      You can already describe any AI helper with two questions: *What is its task?* and *What would a mistake look like?* Here's Maya's spam filter.

      - *Task:* "I want it to move junk mail out of my inbox."
      - *Mistakes:* Junk slips into her inbox (annoying), or a real message from her school lands in the junk folder (worse, since she might miss it).

      The two mistakes don't matter equally. Naming them tells Maya what to check: once a week, she glances through the junk folder for real messages.

      :::try Your turn
      Pick a helper you use: a map, photo search, a music app, or a chat assistant. Finish the sentence "I want it to ___." Then name a mistake it could make that would really bother you.
      :::

      Next up: what goes into a computer, and what comes out.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - ai-systems.s1
        - ai-systems.s2
        - ai-systems.s3
        - ai-systems.s4
        - ai-systems.s5
        - ai-systems.s6
        - ai-systems.check
      gate_refs:
        - gate.core
  scene_aliases:
    ai-systems.recap: ai-systems.check
assessment_families:
  - id: ai-systems.base
    objective_ref: objective.ai-systems
    task: base
    response_type: single_choice
    points: 1
    hint: "First name the job the helper is for. Then ask where its steps come from: a rule someone wrote, a search through possibilities, or adjustment from examples."
    variants:
      - id: ai-systems.base.1
        prompt: Which statement best describes the scope of AI?
        options:
          - id: a
            text: Every AI system is a language model.
          - id: b
            text: Every AI system learns by chatting with people.
          - id: correct
            text: It includes learning, search, reasoning, and other methods.
        answer: correct
        feedback: It includes learning, search, reasoning, and other methods.
        retired: true
      - id: ai-systems.base.2
        prompt: A program solves a puzzle by searching possible moves. Must it have learned from examples?
        options:
          - id: b
            text: Yes. Every AI system must update its weights.
          - id: correct
            text: No. Search can use explicitly written rules.
          - id: a
            text: Yes. Any search algorithm must be a neural network.
        answer: correct
        feedback: No. Search can use explicitly written rules.
        retired: true
      - id: ai-systems.base.v2.1
        prompt: A photo app is meant to group pictures of the same person. Which description names its task?
        options:
          - id: c
            text: Follow the written steps inside the app
          - id: a
            text: Group pictures of the same person
          - id: b
            text: Compare each picture with stored examples
        answer: a
        feedback: 'The task names the desired result: grouping pictures of the same person. Written steps and comparisons describe possible ways to achieve it.'
        retired: true
      - id: ai-systems.base.v2.2
        prompt: A route finder tries several streets to reach a park. What does this example show about AI?
        options:
          - id: a
            text: Finding a route can be an AI task
          - id: b
            text: An AI task needs a conversation
          - id: c
            text: Creating a picture defines an AI task
        answer: a
        feedback: AI includes ways of choosing routes as well as ways of creating text or pictures.
        retired: true
      - id: ai-systems.base.v2.3
        prompt: Which description fits an algorithm?
        options:
          - id: b
            text: A collection of examples for a job
          - id: c
            text: The answer produced after doing a job
          - id: a
            text: A sequence of steps for a job
        answer: a
        feedback: An algorithm describes the procedure. A collection of examples supplies information, and an output is the result of running the procedure.
      - id: ai-systems.base.v2.4
        prompt: A program sorts buttons correctly after being adjusted using examples. Which approach is being illustrated?
        options:
          - id: c
            text: Searching a list of street routes
          - id: a
            text: Learning from examples
          - id: b
            text: Following an unchanged color rule
        answer: a
        feedback: "Adjusting a program's behavior to fit examples is machine learning. A color rule that never changes was written by a person, and trying out street routes is search, a different approach."
      - id: ai-systems.base.v2.5
        prompt: A garden helper recommends when to water a plant. Which phrase states the task?
        options:
          - id: a
            text: The soil reading received today
          - id: b
            text: The steps stored in its program
          - id: c
            text: Recommend a watering time
        answer: c
        feedback: The task is the job to do. A soil reading is an input; stored steps describe a procedure.
      - id: ai-systems.base.v2.6
        prompt: A maze solver tries possible turns until it finds a route. Which approach is visible in this description?
        options:
          - id: a
            text: Searching possible routes
          - id: b
            text: Adjusting a rule from labeled pictures
          - id: c
            text: Producing the picture of the maze
        answer: a
        feedback: Trying alternative routes is search. The description does not say that the solver learned from examples.
        retired: true
      - id: ai-systems.base.v3.1
        prompt: 'A button sorter follows steps a person typed in: "If the color is red, go left; if blue, go right." Nobody showed it any examples. Where do its steps come from?'
        options:
          - id: a
            text: Adjusting itself to fit many labeled photos
          - id: c
            text: A rule that a person wrote down directly
          - id: b
            text: Searching through every way to sort the box
        answer: c
        feedback: A person wrote the steps, so this sorter follows a written rule. Learning from examples would need labeled photos, and nothing here tries out possibilities the way search does.
      - id: ai-systems.base.v3.2
        prompt: A puzzle app solves a sliding-tile puzzle by trying sequences of moves and keeping the ones that get closer to the finished picture. Which approach is it using?
        options:
          - id: a
            text: Learning from examples of solved puzzles
          - id: c
            text: Following one fixed rule for each tile
          - id: b
            text: Searching through possible moves
        answer: b
        feedback: Trying possible moves toward a goal is search, like a map app comparing routes. Nothing says it studied solved puzzles, so it isn't learning from examples.
      - id: ai-systems.base.v3.3
        prompt: Which of these describes a task, rather than a way of getting the task done?
        options:
          - id: b
            text: Try many paths and keep the quickest one
          - id: a
            text: Adjust to fit thousands of past trips
          - id: c
            text: Suggest a quick route to the airport
        answer: c
        feedback: A task names the result you want, here a quick route. Trying paths (search) and fitting past trips (learning from examples) are two ways to get that job done, not the job itself.
      - id: ai-systems.base.v3.4
        prompt: 'Your friend says, "It only counts as AI if it learned from examples." A chess program that searches possible moves has no learned parts. Which reply fits best?'
        options:
          - id: a
            text: It isn't AI, since no part of it was learned
          - id: c
            text: It would count as AI once it can also chat
          - id: b
            text: Search is AI too; learning is one approach
        answer: b
        feedback: Machine learning is only one part of AI. Searching through possibilities is another, and so are written rules. Being able to chat has nothing to do with whether a program counts as AI.
    remediation_scene: ai-systems.s3
  - id: ai-systems.transfer
    objective_ref: objective.ai-systems
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
    variants:
      - id: ai-systems.transfer.1
        prompt: A photo classifier recognizes one difficult image. What does that establish?
        options:
          - id: b
            text: Its results will be correct on every new camera.
          - id: correct
            text: It succeeded on that example; broader reliability needs evaluation.
          - id: a
            text: It understands all images as a human would.
        answer: correct
        feedback: It succeeded on that example; broader reliability needs evaluation.
        retired: true
      - id: ai-systems.transfer.2
        prompt: A spam filter and a chatbot both use AI. What should you investigate first?
        options:
          - id: correct
            text: Their tasks, inputs, outputs, and mechanisms.
          - id: a
            text: Which one claims to be more intelligent.
          - id: b
            text: Whether both produce the same kind of output.
        answer: correct
        feedback: Their tasks, inputs, outputs, and mechanisms.
        retired: true
      - id: ai-systems.transfer.v2.1
        prompt: A sorter gets one bright red button right. What would be a useful next check?
        options:
          - id: a
            text: Try faded and shadowed buttons
          - id: b
            text: Try that same button in the same light again
          - id: c
            text: Count that successful result as the whole test
        answer: a
        feedback: Different examples test whether the successful behavior extends beyond the easy case.
        retired: true
      - id: ai-systems.transfer.v2.2
        prompt: A writing helper sounds friendly. What additional evidence would help judge its work?
        options:
          - id: b
            text: Check whether its sentences sound smooth
          - id: c
            text: Check whether it repeats the question politely
          - id: a
            text: Check whether its answer is correct
        answer: a
        feedback: A friendly style is an appearance; correctness must be checked against the task.
        retired: true
      - id: ai-systems.transfer.v2.3
        prompt: Which request gives a computer a more clearly stated task?
        options:
          - id: c
            text: Be clever with these things
          - id: a
            text: Separate red buttons from blue buttons
          - id: b
            text: Make this box better somehow
        answer: a
        feedback: Separating red buttons from blue buttons specifies an observable result, making success and mistakes easier to recognize.
        retired: true
      - id: ai-systems.transfer.v2.4
        prompt: Two programs choose the same route, one with written rules and one using examples. What can you conclude?
        options:
          - id: a
            text: Different procedures can give the same result
          - id: b
            text: The programs used the same procedure
          - id: c
            text: Their matching result explains their internals
        answer: a
        feedback: An observed result does not uniquely tell you the procedure that produced it.
        retired: true
      - id: ai-systems.transfer.v2.5
        prompt: A parcel sorter works on one clearly printed address. Which test would tell you more about its intended job?
        options:
          - id: a
            text: Try other addresses with different print and lighting
          - id: b
            text: Rescan that address without changing the conditions
          - id: c
            text: Ask the sorter to describe its confidence again
        answer: a
        feedback: Varied relevant cases reveal limits that repeating one successful case may hide.
        retired: true
      - id: ai-systems.transfer.v2.6
        prompt: Two assistants give different answers to the same factual question. How can you investigate?
        options:
          - id: a
            text: Prefer whichever answer sounds more certain
          - id: b
            text: Compare both answers with relevant evidence
          - id: c
            text: Prefer whichever answer uses more words
        answer: b
        feedback: Certainty and length do not establish correctness. Check what supports each answer.
        retired: true
    remediation_scene: ai-systems.s3
  - id: ai-systems.transfer.v3
    objective_ref: objective.ai-systems
    task: transfer
    response_type: single_choice
    points: 1
    hint: Judge the helper by its job. Picture what a mistake would look like, and pick the check that could actually reveal one.
    remediation_scene: ai-systems.s5
    variants:
      - id: ai-systems.transfer.v3.1
        prompt: A photo app finds your dog in 50 sunny photos from one park. You want to use it on all your pictures. Which test would tell you the most?
        options:
          - id: a
            text: Try 50 more sunny photos from that same afternoon
          - id: c
            text: Run the same 50 park photos through it a second time
          - id: b
            text: Try indoor, nighttime, and blurry photos of the dog
        answer: b
        feedback: New conditions (indoors, dark, blurry) are where a photo app is most likely to slip, so they tell you the most. More photos from the same sunny afternoon mostly repeat the easy case you already know it handles.
      - id: ai-systems.transfer.v3.2
        prompt: 'A chat assistant replies, "Hmm, let me think… The answer is Paris." Your friend says, "See? It thinks just like us." What is the most accurate response?'
        options:
          - id: c
            text: The friendly wording is style; what matters is whether it's right
          - id: b
            text: It must think like us, since it picked the correct city on its own
          - id: a
            text: It can't be AI, because a real computer would answer instantly
        answer: c
        feedback: Phrases like "let me think" are words chosen to sound natural. They don't tell you what happens inside or whether the answer is correct. Getting Paris right shows the helper can do this job; it doesn't show it thinks the way people do.
      - id: ai-systems.transfer.v3.3
        prompt: A spam filter follows the written rule "junk if the subject contains FREE." A newsletter titled "Free museum day this Sunday" lands in the junk folder. What went wrong?
        options:
          - id: c
            text: The filter decided that it dislikes newsletters in general
          - id: a
            text: The written rule is too simple for the job it was given
          - id: b
            text: The filter picked up a bad habit from earlier examples
        answer: a
        feedback: The rule does exactly what it says, and "Free" appears in the subject, so the rule is too blunt for real mail. The filter has no likes or dislikes, and this one follows a written rule rather than learning from examples.
      - id: ai-systems.transfer.v3.4
        prompt: A homework helper sometimes gets math problems wrong while sounding completely sure. Before relying on it, what is the most useful thing to do?
        options:
          - id: b
            text: Trust the answers that come with long, detailed explanations
          - id: a
            text: Ask each question twice and trust any answers that match
          - id: c
            text: Check a few of its answers against worked solutions
        answer: c
        feedback: Comparing its answers with known-correct solutions shows how often it is actually right. A long explanation or the same answer twice can still be wrong; both check the style, not the correctness.
      - id: ai-systems.transfer.v3.5
        prompt: A music app picks songs for you by studying millions of other listeners' playlists. Nobody wrote a rule for each song. Which approach is this?
        options:
          - id: c
            text: Following a rule that a person wrote for each song
          - id: b
            text: Searching possible moves, the way a maze solver does
          - id: a
            text: Learning from examples of what people listened to
        answer: a
        feedback: The app adjusts its choices using examples (other people's playlists), which is machine learning. No one wrote a rule per song, and it isn't trying out a sequence of moves toward a goal the way a maze solver searches.
      - id: ai-systems.transfer.v3.6
        prompt: A garden robot is told "Pull out the weeds." It pulls up a tomato seedling. Which change is most likely to fix this?
        options:
          - id: a
            text: Give it the very same instruction again, but more firmly
          - id: b
            text: Spell out which plants count as weeds and which don't
          - id: c
            text: Expect it to pick up some common sense from this mistake
        answer: b
        feedback: A computer won't fill in a missing step with common sense, so someone has to say exactly what counts as a weed. Repeating the instruction gives it no new information, and one mistake doesn't teach a program anything unless someone builds in a way to learn from it.
