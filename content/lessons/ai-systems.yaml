schema_version: 0.2-draft
lesson:
  id: ai-systems
  version: 0.2.0-draft
  title: What is AI? Start with an everyday task
  state: draft
  summary: A computer can help sort pictures, suggest a route, or answer a question. Start by asking what you
    want it to do.
  slot: M00.1
  category: common
  sources:
  - title: Dive into Deep Learning — introduction
    url: https://d2l.ai/chapter_introduction/index.html
  archetype: foundation
objectives:
- id: objective.ai-systems
  version: 2-draft
  statement: AI is a family of methods for making systems perceive, predict, reason, or act. A useful result
    is not proof of human-like understanding.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - ai-systems.base
  - ai-systems.transfer
  prerequisites: []
scenes:
- id: ai-systems.s1
  title: Start with a job, not a mysterious machine
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ai-systems
  markdown: 'Imagine a box of mixed buttons. You want the red buttons in one pile and the blue buttons in another.
    That job is a **task**: something you want done. You can do it by looking at each button. A computer needs
    a way to receive information about the buttons and instructions for what to do with it. We will learn those
    parts a little at a time. You do not need to know any computer words before this lesson.'
  text_mode: 'Imagine a box of mixed buttons. You want the red buttons in one pile and the blue buttons in
    another. That job is a **task**: something you want done. You can do it by looking at each button. A computer
    needs a way to receive information about the buttons and instructions for what to do with it. We will learn
    those parts a little at a time. You do not need to know any computer words before this lesson.'
- id: ai-systems.s2
  title: What the two letters stand for
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ai-systems
  markdown: '**AI** stands for **artificial intelligence**. It is a broad name for work on computers that can
    do tasks such as recognizing a picture, finding a route, choosing an action, or creating a sentence. Artificial
    means made by people. The word intelligence here does not tell us that a computer has feelings or thinks
    exactly like a person. It names the area of work. Different AI programs can solve different kinds of problems
    in different ways.'
  text_mode: '**AI** stands for **artificial intelligence**. It is a broad name for work on computers that
    can do tasks such as recognizing a picture, finding a route, choosing an action, or creating a sentence.
    Artificial means made by people. The word intelligence here does not tell us that a computer has feelings
    or thinks exactly like a person. It names the area of work. Different AI programs can solve different kinds
    of problems in different ways.'
- id: ai-systems.s3
  title: A computer follows a procedure
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-systems
  markdown: 'A **program** is a set of instructions a computer can run. An **algorithm** is a step-by-step
    procedure for getting something done. For the buttons, a procedure might be: look at the next button, decide
    which color pile it belongs in, and repeat. A recipe is a useful comparison because its steps have an order.
    Unlike a cook, a computer does not supply everyday common sense when a step is missing or unclear. People
    must arrange how information is handled.'
  text_mode: 'A **program** is a set of instructions a computer can run. An **algorithm** is a step-by-step
    procedure for getting something done. For the buttons, a procedure might be: look at the next button, decide
    which color pile it belongs in, and repeat. A recipe is a useful comparison because its steps have an order.
    Unlike a cook, a computer does not supply everyday common sense when a step is missing or unclear. People
    must arrange how information is handled.'
- id: ai-systems.s4
  title: Writing a rule or learning from examples
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-systems
  markdown: 'A person might write a **rule**: “If this button is red, put it in the red pile.” Another approach
    uses many example pictures of red and blue buttons to adjust how the computer sorts them. Using examples
    or feedback to adjust a computer’s behavior is called **machine learning**. Here, learning means changing
    a computer procedure using examples or feedback; it does not mean the computer has a childhood or wishes.
    The adjustment does not always improve the result, so we still check it. Learning from examples is one
    approach within AI. Searching through possible routes is another approach.'
  text_mode: 'A person might write a **rule**: “If this button is red, put it in the red pile.” Another approach
    uses many example pictures of red and blue buttons to adjust how the computer sorts them. Using examples
    or feedback to adjust a computer’s behavior is called **machine learning**. Here, learning means changing
    a computer procedure using examples or feedback; it does not mean the computer has a childhood or wishes.
    The adjustment does not always improve the result, so we still check it. Learning from examples is one
    approach within AI. Searching through possible routes is another approach.'
- id: ai-systems.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.ai-systems
  markdown: Try a fresh example using the ideas above.
  text_mode: Untimed practice with feedback.
  takeaway: AI is a name for many ways of getting computers to do tasks such as recognizing, choosing, and
    creating. A useful result still needs to be checked.
- id: ai-systems.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.ai-systems
  markdown: AI is a family of methods for making systems perceive, predict, reason, or act. A useful result
    is not proof of human-like understanding.
  text_mode: AI is a family of methods for making systems perceive, predict, reason, or act. A useful result
    is not proof of human-like understanding.
- id: ai-systems.s5
  title: One success is a starting point
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-systems
  markdown: 'Suppose a program correctly calls one picture “a red button.” That is one successful answer. Now
    try a faded button, a button in shadow, and a red bottle cap. You may discover which differences confuse
    it. This is why we need to name the job carefully: sorting buttons already in a box is a different job
    from finding buttons in any photograph. A success on one example is helpful evidence, but it does not settle
    how the program handles the others.'
  text_mode: 'Suppose a program correctly calls one picture “a red button.” That is one successful answer.
    Now try a faded button, a button in shadow, and a red bottle cap. You may discover which differences confuse
    it. This is why we need to name the job carefully: sorting buttons already in a box is a different job
    from finding buttons in any photograph. A success on one example is helpful evidence, but it does not settle
    how the program handles the others.'
- id: ai-systems.s6
  title: Explain it to someone else
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-systems
  markdown: 'Pick one familiar computer helper: a map, a photo organizer, or a writing assistant. Finish this
    sentence in ordinary words: “I want it to ___.” That is the task. Next say what would count as a mistake.
    A map might suggest a closed road; a photo organizer might put a cat picture among dogs. You have begun
    to study AI by naming a job and a way to check it. Next we will name the information that goes into a computer
    and the result that comes out.'
  text_mode: 'Pick one familiar computer helper: a map, a photo organizer, or a writing assistant. Finish this
    sentence in ordinary words: “I want it to ___.” That is the task. Next say what would count as a mistake.
    A map might suggest a closed road; a photo organizer might put a cat picture among dogs. You have begun
    to study AI by naming a job and a way to check it. Next we will name the information that goes into a computer
    and the result that comes out.'
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - ai-systems.s1
    - ai-systems.s2
    - ai-systems.s3
    - ai-systems.s4
    - ai-systems.s5
    - ai-systems.s6
    - ai-systems.check
    gate_refs:
    - gate.core
  scene_aliases:
    ai-systems.recap: ai-systems.check
assessment_families:
- id: ai-systems.base
  objective_ref: objective.ai-systems
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
  variants:
  - id: ai-systems.base.1
    prompt: Which statement best describes the scope of AI?
    options:
    - id: a
      text: Every AI system is a language model.
    - id: b
      text: Every AI system learns by chatting with people.
    - id: correct
      text: It includes learning, search, reasoning, and other methods.
    answer: correct
    feedback: It includes learning, search, reasoning, and other methods.
    retired: true
  - id: ai-systems.base.2
    prompt: A program solves a puzzle by searching possible moves. Must it have learned from examples?
    options:
    - id: b
      text: Yes. Every AI system must update its weights.
    - id: correct
      text: No. Search can use explicitly written rules.
    - id: a
      text: Yes. Any search algorithm must be a neural network.
    answer: correct
    feedback: No. Search can use explicitly written rules.
    retired: true
  - id: ai-systems.base.v2.1
    prompt: A photo app is meant to group pictures of the same person. Which description names its task?
    options:
    - id: c
      text: Follow the written steps inside the app
    - id: a
      text: Group pictures of the same person
    - id: b
      text: Compare each picture with stored examples
    answer: a
    feedback: 'The task names the desired result: grouping pictures of the same person. Written steps and comparisons
      describe possible ways to achieve it.'
  - id: ai-systems.base.v2.2
    prompt: A route finder tries several streets to reach a park. What does this example show about AI?
    options:
    - id: a
      text: Finding a route can be an AI task
    - id: b
      text: An AI task needs a conversation
    - id: c
      text: Creating a picture defines an AI task
    answer: a
    feedback: AI includes ways of choosing routes as well as ways of creating text or pictures.
  - id: ai-systems.base.v2.3
    prompt: Which description fits an algorithm?
    options:
    - id: b
      text: A collection of examples for a job
    - id: c
      text: The answer produced after doing a job
    - id: a
      text: A sequence of steps for a job
    answer: a
    feedback: An algorithm describes the procedure. A collection of examples supplies information, and an output
      is the result of running the procedure.
  - id: ai-systems.base.v2.4
    prompt: A program sorts buttons correctly after being adjusted using examples. Which approach is being
      illustrated?
    options:
    - id: c
      text: Searching a list of street routes
    - id: a
      text: Learning from examples
    - id: b
      text: Following an unchanged color rule
    answer: a
    feedback: Its behavior was adjusted using examples, which is the distinguishing feature here.
  remediation_scene: ai-systems.s3
- id: ai-systems.transfer
  objective_ref: objective.ai-systems
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
  variants:
  - id: ai-systems.transfer.1
    prompt: A photo classifier recognizes one difficult image. What does that establish?
    options:
    - id: b
      text: Its results will be correct on every new camera.
    - id: correct
      text: It succeeded on that example; broader reliability needs evaluation.
    - id: a
      text: It understands all images as a human would.
    answer: correct
    feedback: It succeeded on that example; broader reliability needs evaluation.
    retired: true
  - id: ai-systems.transfer.2
    prompt: A spam filter and a chatbot both use AI. What should you investigate first?
    options:
    - id: correct
      text: Their tasks, inputs, outputs, and mechanisms.
    - id: a
      text: Which one claims to be more intelligent.
    - id: b
      text: Whether both produce the same kind of output.
    answer: correct
    feedback: Their tasks, inputs, outputs, and mechanisms.
    retired: true
  - id: ai-systems.transfer.v2.1
    prompt: A sorter gets one bright red button right. What would be a useful next check?
    options:
    - id: a
      text: Try faded and shadowed buttons
    - id: b
      text: Try that same button in the same light again
    - id: c
      text: Count that successful result as the whole test
    answer: a
    feedback: Different examples test whether the successful behavior extends beyond the easy case.
  - id: ai-systems.transfer.v2.2
    prompt: A writing helper sounds friendly. What additional evidence would help judge its work?
    options:
    - id: b
      text: Check whether its sentences sound smooth
    - id: c
      text: Check whether it repeats the question politely
    - id: a
      text: Check whether its answer is correct
    answer: a
    feedback: A friendly style is an appearance; correctness must be checked against the task.
  - id: ai-systems.transfer.v2.3
    prompt: Which request gives a computer a more clearly stated task?
    options:
    - id: c
      text: Be clever with these things
    - id: a
      text: Separate red buttons from blue buttons
    - id: b
      text: Make this box better somehow
    answer: a
    feedback: Separating red buttons from blue buttons specifies an observable result, making success and mistakes
      easier to recognize.
  - id: ai-systems.transfer.v2.4
    prompt: Two programs choose the same route, one with written rules and one using examples. What can you
      conclude?
    options:
    - id: a
      text: Different procedures can give the same result
    - id: b
      text: The programs used the same procedure
    - id: c
      text: Their matching result explains their internals
    answer: a
    feedback: An observed result does not uniquely tell you the procedure that produced it.
  remediation_scene: ai-systems.s3
