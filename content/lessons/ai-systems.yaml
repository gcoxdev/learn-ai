schema_version: 0.2-draft
lesson:
  id: ai-systems
  version: 0.1.0-draft
  title: What do we mean by AI?
  state: draft
  summary: AI is a family of methods for making systems perceive, predict, reason, or act. A useful result
    is not proof of human-like understanding.
  slot: M00.1
  category: common
  minutes: 8
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — topic overview'
    url: https://aima.cs.berkeley.edu/contents.html
objectives:
- id: objective.ai-systems
  version: 1-draft
  statement: AI is a family of methods for making systems perceive, predict, reason, or act. A useful result
    is not proof of human-like understanding.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - ai-systems.base
  - ai-systems.transfer
  prerequisites: []
scenes:
- id: ai-systems.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ai-systems
  text_mode: The complete explanation is available as readable text.
  title: A familiar starting point
  markdown: 'Your phone groups similar photos. A search engine ranks pages. A chatbot continues a conversation.
    These systems solve different tasks, but each transforms inputs into outputs using an algorithm.


    **Artificial intelligence** is an umbrella for methods that make systems perceive, predict, reason, or
    act. There is no single mechanism hiding behind every AI product.'
- id: ai-systems.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ai-systems
  text_mode: The complete explanation is available as readable text.
  title: Rules and learning are two different tools
  markdown: 'A rule-based system can apply “if the temperature is below freezing, flag an icy-road risk.” A
    learning system can estimate that risk from examples of weather and road conditions.


    The rule is written directly. The learned predictor adjusts a model using data. Both can be useful. Learning
    is one part of AI; AI also includes search, logic, planning, and other approaches.'
- id: ai-systems.s3
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ai-systems
  text_mode: The complete explanation is available as readable text.
  title: Capability is a claim you can test
  markdown: 'Suppose a photo app identifies a dog. That is evidence about one output on one image. To assess
    the capability, try varied images, difficult cases, and a clear success measure.


    Good performance on an observed task does not by itself establish awareness, reliable reasoning on every
    task, or an understanding identical to ours.'
- id: ai-systems.s4
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ai-systems
  text_mode: The complete explanation is available as readable text.
  title: Try separating task from mechanism
  markdown: 'For a spam filter, the **task** is to identify unwanted messages. The **input** is a message.
    The **output** may be a spam score. The **mechanism** could be written rules, a statistical classifier,
    or a neural model.


    Throughout this school, ask all four questions. A product name usually answers none of them.'
- id: ai-systems.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.ai-systems
  markdown: Use two different examples to check your understanding. Hints are available for practice. A later,
    fresh answer without hints can demonstrate personal-study mastery.
  text_mode: Labeled radio options and a submit button; no timing requirement.
- id: ai-systems.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.ai-systems
  markdown: AI is a family of methods for making systems perceive, predict, reason, or act. A useful result
    is not proof of human-like understanding.
  text_mode: AI is a family of methods for making systems perceive, predict, reason, or act. A useful result
    is not proof of human-like understanding.
