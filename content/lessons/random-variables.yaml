schema_version: 0.2-draft
lesson:
  id: random-variables
  version: 0.4.0-draft
  title: Averages over uncertain outcomes
  state: draft
  summary: A button pays 8 points a quarter of the time. What is one press worth? Learn the expected value and spread behind every "average loss" and "expected reward" in AI.
  slot: B10
  category: bridge
  sources:
    - title: Deep Learning — probability and information theory
      url: https://www.deeplearningbook.org/contents/prob.html
objectives:
  - id: objective.random-variables
    version: 2-draft
    statement: Random variables assign numbers to outcomes; expectation, variance, covariance, and sampling describe their distributions rather than promising one particular result.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - random-variables.base.v2
      - random-variables.transfer.v2
    prerequisites:
      - anyOf:
          - objective.probability
      - anyOf:
          - objective.arithmetic
scenes:
  - id: random-variables.s1
    title: Put a number on each outcome
    type: explanation
    depth: intuition
    objective_refs:
      - objective.random-variables
    markdown: |-
      Training a model means pushing down its *average* loss. A game-playing agent chases the *expected* reward. Both phrases name one calculation, and this detour shows it.

      A button in a game pays 8 points a quarter of the time and nothing otherwise. The payout is a **random variable**: a number whose value depends on a chance outcome. Its **distribution** lists every possible value with its probability:

      | Payout | Probability |
      | ---: | ---: |
      | 0 | 0.75 |
      | 8 | 0.25 |

      A few distributions have names you'll meet often:

      - A **Bernoulli** variable is 1 with probability p and 0 otherwise, like "did the model get this question right?"
      - A **binomial** variable counts the 1s across independent tries with the same p. If a model answers each of two questions correctly with probability 0.5, its score is 0, 1, or 2 with probabilities 0.25, 0.5, and 0.25.
      - A **normal** (or Gaussian) variable is continuous, with a bell-shaped curve. For continuous variables, probability is area under a curve called a density, covered in the refresher on integrals and densities.
    bridges:
      - probability
  - id: random-variables.s2
    title: The expected value is a weighted average
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.random-variables
    markdown: |-
      The **expected value**, also called the **mean**, multiplies each value by its probability and adds the results. The symbol Σ means "add up over every possible value x":

      $$E[X] = \sum_x x \, P(X = x)$$

      Three worked cases, each a little harder:

      1. **The button.** 0 × 0.75 + 8 × 0.25 = 2. No single press ever pays 2 points. The expected value is the long-run average per press, not a likely outcome.
      2. **The two-question score.** 0 × 0.25 + 1 × 0.5 + 2 × 0.25 = 1 correct answer on average.
      3. **A model's loss.** A classifier has loss 0.1 on easy examples, which are 70% of the data, and loss 2.0 on hard ones, the other 30%. Its expected loss is 0.1 × 0.7 + 2.0 × 0.3 = 0.07 + 0.60 = 0.67.

      :::predict New data makes hard examples half of the mix. What is the expected loss now?
      0.1 × 0.5 + 2.0 × 0.5 = 0.05 + 1.00 = 1.05. The model didn't change at all; the mix did. That's why a score measured on one mix of data can shift on another.
      :::
    bridges:
      - probability
  - id: random-variables.s3
    title: Same average, different ride
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.random-variables
    markdown: |-
      A second button pays exactly 2 points every time. It has the same expected value as the first, but it feels nothing like it. **Variance** measures that difference: the probability-weighted average of squared distances from the mean.

      For the first button, the mean is 2:

      | Payout | Distance from 2 | Squared | Probability | Contribution |
      | ---: | ---: | ---: | ---: | ---: |
      | 0 | −2 | 4 | 0.75 | 3 |
      | 8 | +6 | 36 | 0.25 | 9 |

      The variance is 3 + 9 = 12. The steady button's variance is 0. Squaring makes the units "points squared," so we usually report the **standard deviation**, the square root of the variance: √12 ≈ 3.46 points.

      When two quantities move together, **covariance** averages the product of their distances from their own means. It's positive when both tend to sit above their means at the same time, and negative when one tends to be high while the other is low.
    bridges:
      - arithmetic
  - id: random-variables.s4
    title: Estimate the average by sampling
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.random-variables
    markdown: |-
      In real problems you rarely know the distribution. You press the button many times and average what you see. A sample average estimates the expected value, and gets closer as the sample grows:

      ```python run
      import numpy as np

      rng = np.random.default_rng(3)
      # Reward 8 with probability 0.25, otherwise 0. Expected value: 2.
      for n in [10, 100, 10_000]:
          rewards = np.where(rng.random(n) < 0.25, 8, 0)
          print(f"{n:>6} presses: average reward = {rewards.mean():.3f}")
      print("expected value:            ", 0 * 0.75 + 8 * 0.25)
      ```

      Ten lucky presses average 4.0, twice the truth. A hundred give 1.76, and 10,000 give 2.058. Change the seed and watch how much the 10-press average moves compared with the 10,000-press one. A training batch works the same way: its average loss is a noisy estimate of the expected loss, which is why the lesson on stochastic gradients gets bumpier steps from smaller batches.

      :::mixup "The average loss tells me the loss of a typical example."
      Five examples have losses 0.1, 0.2, 0.1, 0.2, and 4.4. The mean is 5.0 / 5 = 1.0, but four of the five sit at 0.2 or below. The **median**, the middle value once sorted, is 0.2. One badly wrong (or mislabeled) example can drag the mean far from the typical case, so look at the spread of losses, not just their mean.
      :::
    bridges: []
  - id: random-variables.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.random-variables
    markdown: Game payouts, model losses, robot rewards, and two minibatches ask you to compute an expected value and say what it does and doesn't tell you about a single draw.
    takeaway: |-
      The expected value is a probability-weighted average, and variance measures the spread around it. Neither tells you what one draw will be, and a sample average only estimates them.
  - id: random-variables.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.random-variables
    markdown: |-
      Expectation describes a probability-weighted average; variance describes spread. Neither promises the result of one draw, and sample estimates need representative observations.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - random-variables.s1
        - random-variables.s2
        - random-variables.s3
        - random-variables.s4
        - random-variables.check
      gate_refs:
        - gate.core
  scene_aliases:
    random-variables.recap: random-variables.check
assessment_families:
  - id: random-variables.base
    objective_ref: objective.random-variables
    task: base
    response_type: single_choice
    points: 1
    hint: 'Compute an expected value: trace the inputs, operation, and result before choosing.'
    remediation_scene: random-variables.s2
    variants:
      - id: random-variables.base.1
        prompt: Values 1 and 5 are equally likely. What is their expectation?
        options:
          - id: c
            text: '2'
          - id: a
            text: '3'
          - id: b
            text: '6'
        answer: a
        feedback: The weighted average is 0.5 × 1 + 0.5 × 5 = 3.
        retired: true
      - id: random-variables.base.2
        prompt: Equally likely values 1 and 5 have mean 3. What is the variance?
        options:
          - id: a
            text: '4'
          - id: b
            text: '2'
          - id: c
            text: '8'
        answer: a
        feedback: Both squared deviations are 4, so their average is 4.
        retired: true
  - id: random-variables.transfer
    objective_ref: objective.random-variables
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Use samples to estimate a distribution: trace the inputs, operation, and result before choosing.'
    remediation_scene: random-variables.s4
    variants:
      - id: random-variables.transfer.1
        prompt: A game pays 0 or 10 and has expected reward 3. Must a single play pay 3?
        options:
          - id: a
            text: No; expectation summarizes the distribution
          - id: b
            text: Yes; expectation is the next guaranteed outcome
          - id: c
            text: Only if the game uses a computer
        answer: a
        feedback: A probability-weighted average can lie between possible individual outcomes.
        retired: true
      - id: random-variables.transfer.2
        prompt: A loss estimate uses 100 copies of one example. Is it as informative as 100 representative independent examples?
        options:
          - id: b
            text: Yes; only the record count matters
          - id: c
            text: Yes; variance is always zero in the population
          - id: a
            text: No; duplication does not provide independent coverage
        answer: a
        feedback: Dependence and representativeness affect what sample averages estimate.
        retired: true
  - id: random-variables.base.v2
    objective_ref: objective.random-variables
    task: base
    response_type: numeric
    points: 1
    hint: Multiply each value by its own probability, then add the products. Don't just average the distinct values, because they aren't equally likely.
    remediation_scene: random-variables.s2
    absolute_tolerance: 0.001
    variants:
      - id: random-variables.base.v2.1
        prompt: A prize wheel in a mobile game pays 0 coins with probability 0.6, 5 coins with probability 0.3, and 20 coins with probability 0.1. What is the expected payout in coins?
        answer: 3.5
        feedback: 0 × 0.6 + 5 × 0.3 + 20 × 0.1 = 0 + 1.5 + 2 = 3.5. Averaging the three prizes as if equally likely gives 25/3 ≈ 8.33, which overweights the rare 20.
      - id: random-variables.base.v2.2
        prompt: A model's loss is 0.2 on 80% of examples and 3.0 on the other 20%. What is its expected loss?
        answer: 0.76
        feedback: 0.2 × 0.8 + 3.0 × 0.2 = 0.16 + 0.60 = 0.76. The plain average of the two loss values, 1.6, ignores that low-loss examples are four times as common.
      - id: random-variables.base.v2.3
        prompt: A robot's grasp succeeds with probability 0.7 and earns reward 10. Otherwise it drops the object and earns reward −5. What is the expected reward per grasp?
        answer: 5.5
        feedback: 10 × 0.7 + (−5) × 0.3 = 7 − 1.5 = 5.5. Keep the sign of the penalty; treating it as +5 gives 8.5.
      - id: random-variables.base.v2.4
        prompt: A recommended video gets a click worth 4 points with probability 0.15 and gets nothing otherwise. What is the expected number of points per recommendation?
        answer: 0.6
        feedback: 4 × 0.15 + 0 × 0.85 = 0.6. No single recommendation earns 0.6 points; it's the long-run average per recommendation.
  - id: random-variables.transfer.v2
    objective_ref: objective.random-variables
    task: transfer
    response_type: single_choice
    points: 1
    hint: "Separate three things: the long-run average (expected value), how widely single outcomes scatter (variance), and an estimate computed from a limited sample."
    remediation_scene: random-variables.s4
    variants:
      - id: random-variables.transfer.v2.1
        prompt: Five validation examples have losses 0.1, 0.3, 0.2, 0.1, and 6.3, so the mean loss is 1.4. Which reading fits these numbers best?
        options:
          - id: b
            text: Most examples have a loss somewhere close to 1.4
          - id: a
            text: One example dominates; the median loss is just 0.2
          - id: c
            text: The model does about equally badly on each example
        answer: a
        feedback: Sorted, the losses are 0.1, 0.1, 0.2, 0.3, 6.3, so the median is 0.2. The single 6.3 pulls the mean up to 1.4, a value no example is near.
      - id: random-variables.transfer.v2.2
        prompt: Button A always pays 3 points. Button B pays 0 or 6 points with equal chance. How do the two buttons compare?
        options:
          - id: c
            text: B has the higher expected value, because it can pay 6
          - id: b
            text: They match in variance, because their averages match
          - id: a
            text: They share an expected value of 3; B has more variance
        answer: a
        feedback: B's expected value is 0 × 0.5 + 6 × 0.5 = 3, the same as A's. B's payouts sit 3 points from the mean every time, so its variance is 9, while A's is 0.
      - id: random-variables.transfer.v2.3
        prompt: A game-playing agent's move has expected reward 2.5, and each play of it pays either 0 or 10. What will one play of the move pay?
        options:
          - id: b
            text: About 2.5, give or take a small random error
          - id: a
            text: Either 0 or 10; 2.5 is the average over many plays
          - id: c
            text: Exactly 2.5 once the agent has learned the move well
        answer: a
        feedback: The payouts are only 0 or 10, so 2.5 can never happen on a single play. It's the long-run average, which means 10 comes up about a quarter of the time.
      - id: random-variables.transfer.v2.4
        prompt: With no training in between, you average a model's loss over one random minibatch of 32 examples and get 0.84, then over a second minibatch and get 0.91. What best explains the difference?
        options:
          - id: a
            text: Each batch average is a noisy estimate of one expected loss
          - id: c
            text: The model's weights must have changed between the batches
          - id: b
            text: One of the two batch averages must have been computed wrongly
        answer: a
        feedback: Different random batches contain different examples, so their averages scatter around the expected loss. Bigger batches scatter less. The weights didn't change, and nothing needs to be wrong for two samples to differ.
