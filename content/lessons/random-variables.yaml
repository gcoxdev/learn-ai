schema_version: 0.2-draft
lesson:
  id: random-variables
  version: 0.3.0-draft
  title: Averages over uncertain outcomes
  state: draft
  summary: Calculate a typical value and the variation around it.
  slot: B10
  category: bridge
  sources:
  - title: Deep Learning — probability and information theory
    url: https://www.deeplearningbook.org/contents/prob.html
objectives:
- id: objective.random-variables
  version: 1-draft
  statement: Random variables assign numbers to outcomes; expectation, variance, covariance, and sampling describe
    their distributions rather than promising one particular result.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - random-variables.base
  - random-variables.transfer
  prerequisites:
  - anyOf:
    - objective.probability
  - anyOf:
    - objective.arithmetic
scenes:
- id: random-variables.s1
  title: Separate the outcome from its value
  type: explanation
  depth: intuition
  objective_refs:
  - objective.random-variables
  markdown: 'A **random variable** assigns a number to an uncertain outcome. Let X count successful predictions
    in two trials. Its possible values are 0, 1, and 2, and a **distribution** assigns probabilities to these
    possibilities.


    A **Bernoulli variable** has two values, commonly 0 and 1. A **binomial variable** counts successes across
    independent Bernoulli trials with the same success probability. These are discrete variables, with probability
    assigned to individual values.


    A continuous variable instead uses a **density**, whose area over an interval gives that interval''s probability.
    The **normal**, or **Gaussian**, distribution has a bell-shaped density described by a mean and variance.
    The next pages explain what those two quantities measure.'
  text_mode: 'A **random variable** assigns a number to an uncertain outcome. Let X count successful predictions
    in two trials. Its possible values are 0, 1, and 2, and a **distribution** assigns probabilities to these
    possibilities.


    A **Bernoulli variable** has two values, commonly 0 and 1. A **binomial variable** counts successes across
    independent Bernoulli trials with the same success probability. These are discrete variables, with probability
    assigned to individual values.


    A continuous variable instead uses a **density**, whose area over an interval gives that interval''s probability.
    The **normal**, or **Gaussian**, distribution has a bell-shaped density described by a mean and variance.
    The next pages explain what those two quantities measure.'
  bridges:
  - probability
- id: random-variables.s2
  title: Compute an expected value
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.random-variables
  markdown: 'Suppose a reward is 0 with probability 0.75 and 8 with probability 0.25. Its expectation is 0
    × 0.75 + 8 × 0.25 = 2. Read this as the probability-weighted average. No individual reward in this example
    is 2: an expected value need not be a possible observed outcome.'
  text_mode: 'Suppose a reward is 0 with probability 0.75 and 8 with probability 0.25. Its expectation is 0
    × 0.75 + 8 × 0.25 = 2. Read this as the probability-weighted average. No individual reward in this example
    is 2: an expected value need not be a possible observed outcome.'
  bridges:
  - probability
- id: random-variables.s3
  title: Measure spread and joint movement
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.random-variables
  markdown: '**Variance** is the probability-weighted average of squared distances from the mean. For equally
    likely values 0 and 4, the mean is 2. The deviations are −2 and +2, whose squares are both 4, so variance
    is 4.


    **Standard deviation** is the square root of variance: here, 2. It uses the original units rather than
    squared units.


    **Covariance** measures how two quantities vary together by averaging products of their deviations from
    their means. It can be positive when both tend to be above their means together, or negative when one tends
    to be high as the other is low. That pattern alone does not establish causation.'
  text_mode: '**Variance** is the probability-weighted average of squared distances from the mean. For equally
    likely values 0 and 4, the mean is 2. The deviations are −2 and +2, whose squares are both 4, so variance
    is 4.


