    to be high as the other is low. That pattern alone does not establish causation.'
  bridges:
  - arithmetic
- id: random-variables.s4
  title: Use samples to estimate a distribution
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.random-variables
  markdown: A sample average estimates an expectation from observations. Its reliability depends on sample
    size, dependence, and representativeness. Ten near-duplicate records do not contain the information of
    ten independent cases. In learning, average batch loss estimates a population objective only under assumptions
    about how examples were sampled.
  text_mode: A sample average estimates an expectation from observations. Its reliability depends on sample
    size, dependence, and representativeness. Ten near-duplicate records do not contain the information of
    ten independent cases. In learning, average batch loss estimates a population objective only under assumptions
    about how examples were sampled.
  bridges: []
- id: random-variables.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.random-variables
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Expectation describes a probability-weighted average; variance describes spread. Neither promises
    the result of one draw, and sample estimates need representative observations.
