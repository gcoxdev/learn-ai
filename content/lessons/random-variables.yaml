schema_version: 0.2-draft
lesson:
  id: random-variables
  version: 0.1.0-draft
  title: Averages over uncertain outcomes
  state: draft
  summary: Random variables assign numbers to outcomes; expectation, variance, covariance, and sampling describe
    their distributions rather than promising one particular result.
  slot: B10
  category: bridge
  minutes: 12
  sources:
  - title: Deep Learning — probability and information theory
    url: https://www.deeplearningbook.org/contents/prob.html
objectives:
- id: objective.random-variables
  version: 1-draft
  statement: Random variables assign numbers to outcomes; expectation, variance, covariance, and sampling describe
    their distributions rather than promising one particular result.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - random-variables.base
  - random-variables.transfer
  prerequisites:
  - anyOf:
    - objective.probability
  - anyOf:
    - objective.arithmetic
scenes:
- id: random-variables.s1
  title: Separate the outcome from its value
  type: explanation
  depth: intuition
  objective_refs:
  - objective.random-variables
  markdown: A random variable is a rule that assigns a number to an uncertain outcome. Let X be the number of successful
    predictions in two trials. Possible values are 0, 1, and 2. A distribution assigns probabilities to those possibilities.
    Discrete variables use probability masses; continuous variables use densities whose areas give probabilities.
  text_mode: A random variable is a rule that assigns a number to an uncertain outcome. Let X be the number of successful
    predictions in two trials. Possible values are 0, 1, and 2. A distribution assigns probabilities to those possibilities.
    Discrete variables use probability masses; continuous variables use densities whose areas give probabilities.
  bridges: []
- id: random-variables.s2
  title: Compute an expected value
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.random-variables
  markdown: 'Suppose a reward is 0 with probability 0.75 and 8 with probability 0.25. Its expectation is 0 × 0.75
    + 8 × 0.25 = 2. Read this as the probability-weighted average. No individual reward in this example is 2: an
    expected value need not be a possible observed outcome.'
  text_mode: 'Suppose a reward is 0 with probability 0.75 and 8 with probability 0.25. Its expectation is 0 × 0.75
    + 8 × 0.25 = 2. Read this as the probability-weighted average. No individual reward in this example is 2: an
    expected value need not be a possible observed outcome.'
  bridges:
  - probability
- id: random-variables.s3
  title: Measure spread and joint movement
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.random-variables
  markdown: Variance averages squared distances from the mean. For equally likely values 0 and 4, the mean is 2
    and variance is 4. Standard deviation is the square root of variance, here 2, in the original units. Covariance
    describes whether two quantities tend to be above their means together; covariance alone does not establish
    causation.
  text_mode: Variance averages squared distances from the mean. For equally likely values 0 and 4, the mean is 2
    and variance is 4. Standard deviation is the square root of variance, here 2, in the original units. Covariance
    describes whether two quantities tend to be above their means together; covariance alone does not establish
    causation.
  bridges: []
- id: random-variables.s4
  title: Use samples to estimate a distribution
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.random-variables
  markdown: A sample average estimates an expectation from observations. Its reliability depends on sample size,
    dependence, and representativeness. Ten near-duplicate records do not contain the information of ten independent
    cases. In learning, average batch loss estimates a population objective only under assumptions about how examples
    were sampled.
  text_mode: A sample average estimates an expectation from observations. Its reliability depends on sample size,
    dependence, and representativeness. Ten near-duplicate records do not contain the information of ten independent
    cases. In learning, average batch loss estimates a population objective only under assumptions about how examples
    were sampled.
  bridges: []
- id: random-variables.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.random-variables
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Random variables assign numbers to outcomes; expectation, variance, covariance, and sampling describe
