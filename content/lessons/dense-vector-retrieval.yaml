scenes:
  - id: dense-vector-retrieval.s1
    title: '"Money back" never says "refund"'
    type: explanation
    depth: intuition
    objective_refs:
      - objective.dense-vector-retrieval
    markdown: |-
      In the last lesson, a Sprocket Bikes customer asked *how long until I get my money back?* and BM25 scored every document zero. The refunds page answers it perfectly, in different words.

      **Dense retrieval** compares meanings instead of words. A trained neural network, the **encoder**, turns each document into an embedding, a vector of a few hundred numbers (as in the embeddings lesson), placed so that texts about similar things land near each other. At question time the question is encoded too, and search returns the documents whose vectors are closest. "Money back" and "refund" end up neighbors because the encoder was trained on many examples where they meant the same thing.

      Documents are encoded once, ahead of time; only the short query is encoded per search. Encoding the query and each document separately like this is called a **dual encoder** (or bi-encoder).

      :::papers Dense Passage Retrieval (Karpukhin et al., 2020)
      DPR trained two BERT encoders, one for questions and one for passages, on question–passage pairs, using the other passages in each training batch as wrong answers. The score is a plain dot product, $\text{sim}(q,p) = E_Q(q)^\top E_P(p)$. On several open-domain question-answering benchmarks, DPR found an answer-bearing passage in its top 20 more often than BM25.
      :::
    bridges: []
  - id: dense-vector-retrieval.cosine
    title: Closeness is an angle
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.dense-vector-retrieval
    markdown: |-
      Real embeddings have hundreds of dimensions. To see the arithmetic, pretend ours have three, which we'll label *money back*, *battery*, and *how long*. The question becomes $q = [0.8, 0, 0.6]$ and the refunds page $d = [0.6, 0, 0.8]$.

      **Cosine similarity** measures the angle between two vectors: 1 means same direction, 0 means unrelated.

      $$\cos(q,d) = \frac{q \cdot d}{\lVert q\rVert\,\lVert d\rVert}$$

      The dot product is $0.8 \times 0.6 + 0 \times 0 + 0.6 \times 0.8 = 0.96$. Both vectors have length 1, so the cosine is 0.96.

      ```python run
      import numpy as np

      # Toy 3-number "embeddings". Dimensions: [money back, battery, how long]
      docs = {
          "returns":  [0.6, 0.8, 0.0],
          "battery":  [0.0, 1.0, 0.0],
          "shipping": [0.0, 0.0, 1.0],
          "refunds":  [0.6, 0.0, 0.8],
          "chargers": [0.0, 1.0, 0.0],
      }
      query = np.array([0.8, 0.0, 0.6])  # "how long until I get my money back"

      def cosine(a, b):
          return a @ b / (np.linalg.norm(a) * np.linalg.norm(b))

      ranked = sorted(docs, key=lambda d: -cosine(query, np.array(docs[d])))
      for name in ranked:
          vec = np.array(docs[name])
          print(f"{name:9} cosine = {cosine(query, vec):.2f}   dot = {query @ vec:.2f}")
      ```

      Refunds comes first (0.96), then shipping (0.60), then returns (0.48). The page BM25 couldn't see is now on top.

      :::predict Change the returns vector to [1.2, 1.6, 0.0]: same direction, twice as long. What happens to its cosine and its dot product?
      Its cosine stays 0.48, because the angle hasn't changed. Its dot product doubles to 0.96 and ties the refunds page. A plain dot product rewards long vectors, so many systems normalize every vector to length 1, which makes the dot product equal the cosine.
      :::
    bridges: []
  - id: dense-vector-retrieval.encoders
    title: Read separately or read together
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.dense-vector-retrieval
    markdown: |-
      A dual encoder never sees the question and the document together. That makes it fast, and also limits it. A **cross-encoder** reads the question and one document together and outputs a relevance score, so every word of each can influence the other.

      | | Dual encoder | Cross-encoder |
      | --- | --- | --- |
      | Reads | Query and document separately | Query and document together |
      | Document work at search time | None (vectors precomputed) | One full model run per document |
      | Good for | Searching millions of documents | Carefully ordering a few dozen |
      | Weak at | Fine distinctions, negation | Speed |

      So the two are used in sequence: a dual encoder picks candidates, and a cross-encoder reranks the short list (the hybrid-search lesson builds this).

      :::mixup "A high similarity score means the document says what I asked about."
      Similarity measures topic, not truth. "Opened batteries cannot be returned" and "Opened batteries can be returned" usually land very close together, because one vector for a whole passage captures its topic far more than a small negation. Similarity finds candidates; something else must check what they say.
      :::

      :::deeper Late interaction: ColBERT
      ColBERT (Khattab & Zaharia, 2020) sits between the two designs. It stores one vector per token of every document. At search time, each query token finds its most similar document token, and those maximum similarities are summed. Documents are still encoded ahead of time, but word-level matching survives.
      :::
    bridges: []
  - id: dense-vector-retrieval.s2
    title: Skip most of the collection, on purpose
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.dense-vector-retrieval
    markdown: |-
      **Exact search** compares the query with every stored vector: for 10 million chunks of 768 numbers, about 7.7 billion multiplications per question. **Approximate nearest-neighbor (ANN)** search checks only a small part of the collection and accepts that it will sometimes miss a true neighbor. Two designs dominate:

      - **IVF** (inverted file index): cluster the vectors into, say, 1,000 groups (usually with k-means), each with a center. Like the inverted index in the last lesson, each center keeps a list of the vectors filed under it. Scan only the groups whose centers are closest to the query. The number scanned is the knob, often called `nprobe`.
      - **HNSW** (hierarchical navigable small world, Malkov & Yashunin): link each vector to some near neighbors in a layered graph. A search starts in a sparse top layer, keeps hopping to whichever neighbor is closer to the query, and drops a layer when no hop helps. The knob is how many candidates the walk keeps (often `ef`).

      This simulation builds a small IVF index over 5,000 clustered vectors and measures what fraction of the exact top 10 it finds.

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      topics = rng.normal(size=(20, 16))
      docs = topics[rng.integers(0, 20, 5000)] + rng.normal(size=(5000, 16))
      docs /= np.linalg.norm(docs, axis=1, keepdims=True)   # unit length: dot = cosine

      # IVF index: 50 random documents act as centroids (real IVF runs k-means),
      # and every document is filed under its nearest centroid.
      centroids = docs[rng.choice(5000, 50, replace=False)]
      lists = np.argmax(docs @ centroids.T, axis=1)

      queries = docs[:200] + 0.5 * rng.normal(size=(200, 16))
      for nprobe in (1, 3, 10, 50):
          found, scanned = 0, 0
          for q in queries:
              exact = set(np.argsort(-(docs @ q))[:10])      # true top 10
              near = np.argsort(-(centroids @ q))[:nprobe]    # closest lists
              cand = np.flatnonzero(np.isin(lists, near))     # only search these
              approx = set(cand[np.argsort(-(docs[cand] @ q))[:10]])
              found += len(exact & approx)
              scanned += len(cand)
          print(f"probe {nprobe:2} lists: recall@10 = {found / 2000:.2f}, "
                f"scanned {scanned / 200 / 5000:.0%} of vectors")
      ```

      Probing 1 list scans 2% of the vectors and finds 30% of the true top 10. Probing 10 lists scans 21% and finds 88%. Probing all 50 is exact search again. Try other `nprobe` values and look for the point where extra scanning stops buying much recall.
    bridges: []
  - id: dense-vector-retrieval.s3
    title: Two different recalls
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.dense-vector-retrieval
    markdown: |-
      The recall in that simulation compares the ANN index with exact search. It says nothing about whether the results answer anyone's question. Keep the two apart:

      | Measure | Compares | A low value means |
      | --- | --- | --- |
      | **Index recall@k** | ANN top $k$ vs. exact top $k$ | The index settings are skipping true neighbors |
      | **Task recall@k** | Top $k$ vs. relevance judgments | The encoder or query doesn't put the answer near the question |

      Sprocket's help center has grown to 20,000 chunks. For one question, exact search returns chunks [A, B, C, D, E]; the ANN index returns [A, C, B, F, E]. Four of the five exact neighbors appear, so index recall@5 = 4/5 = 0.8. But chunk D is the one that answers the question, and the index dropped it. That loss is the index's fault: raise `nprobe` or `ef`. If exact search had ranked D 40th, no index setting would help; you'd look at the encoder, the query wording, or the chunking.
    bridges: []
  - id: dense-vector-retrieval.s4
    title: One model for queries and documents
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.dense-vector-retrieval
    markdown: |-
      Vectors from different encoders live in different spaces: coordinate 17 in one model means nothing in another, even when the lengths match. If Sprocket encodes new questions with an upgraded model while stored documents keep their old vectors, the similarities become noise. When the model changes, re-encode every document and rebuild the index. Store the model name beside each vector so a mismatch is easy to catch.
    bridges: []
  - id: dense-vector-retrieval.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.dense-vector-retrieval
    markdown: A law firm's model upgrade, a parts catalog, a music service's index, and a few recall calculations test whether you can tell a similarity problem from an index problem.
    takeaway: |-
      Dense retrieval finds documents whose vectors point the same way as the question's, so it matches meaning even without shared words. Fast ANN indexes skip some true neighbors, so measure index recall against exact search and task recall against real answers.
  - id: dense-vector-retrieval.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.dense-vector-retrieval
    markdown: |-
      Dense retrieval finds nearby vectors. Check both whether the index finds the intended neighbors and whether those neighbors contain useful evidence.
