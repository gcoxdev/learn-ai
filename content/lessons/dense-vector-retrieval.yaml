schema_version: 0.2-draft
lesson:
  id: dense-vector-retrieval
  version: 0.3.0-draft
  title: Search learned representations with approximate neighbors
  state: draft
  summary: Search by learned meaning while checking what faster search misses.
  slot: M26.2
  category: learning
  sources:
  - title: Dense Passage Retrieval
    url: https://arxiv.org/abs/2004.04906
  - title: HNSW
    url: https://arxiv.org/abs/1603.09320
  - title: Introduction to Information Retrieval — authors’ online edition
    url: https://nlp.stanford.edu/IR-book/
objectives:
- id: objective.dense-vector-retrieval
  version: 1-draft
  statement: Dense retrieval compares query and document embeddings, often using approximate nearest-neighbor
    indexes; similarity, index recall, and task relevance must be evaluated separately.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - dense-vector-retrieval.base
  - dense-vector-retrieval.transfer
  prerequisites:
  - anyOf:
    - objective.lexical-information-retrieval
  - anyOf:
    - objective.embeddings
scenes:
- id: dense-vector-retrieval.s1
  title: Encode queries and documents
  type: explanation
  depth: intuition
  objective_refs:
  - objective.dense-vector-retrieval
  markdown: 'A **dual encoder** encodes queries and passages separately into a compatible vector space. The
    two encoders may share weights or use different weights. Dot product or cosine similarity ranks candidates.
    Training pairs shape what nearby means: semantic relatedness, answer usefulness, and exact factual support
    are different targets.'
  text_mode: 'A **dual encoder** encodes queries and passages separately into a compatible vector space. The
    two encoders may share weights or use different weights. Dot product or cosine similarity ranks candidates.
    Training pairs shape what nearby means: semantic relatedness, answer usefulness, and exact factual support
    are different targets.'
  bridges: []
- id: dense-vector-retrieval.s2
  title: Trade exact search for a faster index
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.dense-vector-retrieval
  markdown: Exact search compares against every stored vector. Approximate nearest-neighbor methods use structures
    such as graphs, partitions, or compressed codes to reduce work. They can miss some true nearest neighbors;
    index parameters trade memory, latency, and recall.
  text_mode: Exact search compares against every stored vector. Approximate nearest-neighbor methods use structures
    such as graphs, partitions, or compressed codes to reduce work. They can miss some true nearest neighbors;
    index parameters trade memory, latency, and recall.
  bridges: []
- id: dense-vector-retrieval.s3
  title: Separate two kinds of recall
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.dense-vector-retrieval
  markdown: 'If exact vector search ranks the relevant document poorly, the representation or query may be
    at fault. If approximate search misses a relevant exact neighbor, the index introduces additional error.
    Measure both neighbor recall against an exact reference and task relevance against judgments.


    Imagine exact search returns document IDs [A, B, C] as its top three neighbors. An approximate index returns
    [A, C, D], so neighbor recall at three is 2/3. If only B actually answers the question, this search has
    lost the useful evidence despite retaining two close neighbors.'
  text_mode: 'If exact vector search ranks the relevant document poorly, the representation or query may be
    at fault. If approximate search misses a relevant exact neighbor, the index introduces additional error.
    Measure both neighbor recall against an exact reference and task relevance against judgments.


    Imagine exact search returns document IDs [A, B, C] as its top three neighbors. An approximate index returns
    [A, C, D], so neighbor recall at three is 2/3. If only B actually answers the question, this search has
    lost the useful evidence despite retaining two close neighbors.'
  bridges: []
- id: dense-vector-retrieval.s4
  title: Preserve representation compatibility
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.dense-vector-retrieval
  markdown: Query and document encoders, normalization, dimensions, and distance metric must agree. Changing
    an embedding model usually requires rebuilding affected document vectors and indexes. Similarity alone
    does not verify facts, access permissions, or whether a document is current.
  text_mode: Query and document encoders, normalization, dimensions, and distance metric must agree. Changing
    an embedding model usually requires rebuilding affected document vectors and indexes. Similarity alone
    does not verify facts, access permissions, or whether a document is current.
  bridges: []
- id: dense-vector-retrieval.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.dense-vector-retrieval
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Dense retrieval finds nearby vectors. Check both whether the index finds the intended neighbors
    and whether those neighbors contain useful evidence.
- id: dense-vector-retrieval.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.dense-vector-retrieval
  markdown: Dense retrieval finds nearby vectors. Check both whether the index finds the intended neighbors
    and whether those neighbors contain useful evidence.
  text_mode: Dense retrieval finds nearby vectors. Check both whether the index finds the intended neighbors
    and whether those neighbors contain useful evidence.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - dense-vector-retrieval.s1
    - dense-vector-retrieval.s2
    - dense-vector-retrieval.s3
    - dense-vector-retrieval.s4
