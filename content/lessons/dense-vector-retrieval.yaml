lesson:
  id: dense-vector-retrieval
  version: 0.4.0-draft
  title: Search learned representations with approximate neighbors
  state: draft
  summary: '"When do I get my money back?" shares no words with the refunds page. See how vector search finds it anyway, and what the fast index quietly skips.'
  slot: M26.2
  category: learning
  sources:
    - title: Dense Passage Retrieval for Open-Domain Question Answering (Karpukhin et al., 2020)
      url: https://arxiv.org/abs/2004.04906
    - title: "ColBERT: Efficient and Effective Passage Search via Contextualized Late Interaction over BERT (Khattab & Zaharia, 2020)"
      url: https://arxiv.org/abs/2004.12832
    - title: Efficient and Robust Approximate Nearest Neighbor Search Using Hierarchical Navigable Small World Graphs (Malkov & Yashunin)
      url: https://arxiv.org/abs/1603.09320
    - title: Introduction to Information Retrieval — authors’ online edition
      url: https://nlp.stanford.edu/IR-book/
objectives:
  - id: objective.dense-vector-retrieval
    version: 2-draft
    statement: Dense retrieval compares query and document embeddings, often with an approximate index; check similarity, index recall, and real relevance separately.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - dense-vector-retrieval.base.v2
      - dense-vector-retrieval.transfer.v2
      - dense-vector-retrieval.calc
    prerequisites:
      - anyOf:
          - objective.lexical-information-retrieval
      - anyOf:
