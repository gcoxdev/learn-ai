assessment_families:
  - id: dense-vector-retrieval.base
    objective_ref: objective.dense-vector-retrieval
    task: base
    response_type: single_choice
    points: 1
    hint: 'Trade exact search for a faster index: trace the inputs, operation, and result before choosing.'
    remediation_scene: dense-vector-retrieval.s2
    variants:
      - id: dense-vector-retrieval.base.1
        prompt: What does approximate nearest-neighbor search trade?
        options:
          - id: b
            text: All semantics for exact proof
          - id: c
            text: Only label spelling
          - id: a
            text: Some retrieval exactness for resource savings
        answer: a
        feedback: Approximation can reduce work while missing neighbors.
        retired: true
      - id: dense-vector-retrieval.base.2
        prompt: Exact vector search already misses relevant passages. What should be inspected?
        options:
          - id: c
            text: Only the UI color
          - id: a
            text: Representation quality and query-task fit
          - id: b
            text: Only approximate-index settings
        answer: a
        feedback: An exact search cannot fix a poor similarity geometry.
        retired: true
  - id: dense-vector-retrieval.transfer
    objective_ref: objective.dense-vector-retrieval
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Preserve representation compatibility: trace the inputs, operation, and result before choosing.'
    remediation_scene: dense-vector-retrieval.s4
    variants:
      - id: dense-vector-retrieval.transfer.1
        prompt: Why rebuild document embeddings after an incompatible encoder change?
        options:
          - id: c
            text: Only to change file dates
          - id: a
            text: Old and new vectors may no longer share a meaningful space
          - id: b
            text: Vector dimensions never matter
        answer: a
        feedback: Compatibility is part of the retrieval contract.
        retired: true
      - id: dense-vector-retrieval.transfer.2
        prompt: Does high cosine similarity verify factual support?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if vectors are normalized
        answer: a
        feedback: Similarity is a learned retrieval signal, not a truth proof.
        retired: true
  - id: dense-vector-retrieval.base.v2
    objective_ref: objective.dense-vector-retrieval
    task: base
    response_type: single_choice
    points: 1
    hint: "Keep three things apart: what the encoder places near the question, what the fast index actually checks, and what the document actually says."
    remediation_scene: dense-vector-retrieval.cosine
    variants:
      - id: dense-vector-retrieval.base.v2.1
        prompt: A dual encoder can search 10 million documents quickly, while a cross-encoder can't. What makes the difference?
        options:
          - id: b
            text: The dual encoder uses shorter vectors, so each comparison is cheaper
          - id: a
            text: Document vectors don't depend on the query, so they're computed in advance
          - id: c
            text: The dual encoder skips documents that share no words with the query
        answer: a
        feedback: Because each document is encoded on its own, its vector can be stored before any question arrives; only the query is encoded at search time. A cross-encoder must run the model on every query–document pair. Skipping documents with no shared words is what keyword search does.
      - id: dense-vector-retrieval.base.v2.2
        prompt: A vector index ranks by raw dot product. Long, rambling pages keep outranking short, focused ones, and their vectors turn out to be much longer. What change targets this?
        options:
          - id: c
            text: Switch to a larger embedding model with more dimensions
          - id: b
            text: Probe more IVF lists so that the short pages are found
          - id: a
            text: Normalize every vector to length 1, so the score becomes cosine
        answer: a
        feedback: The dot product grows with vector length, while cosine depends only on direction. Probing more lists changes which vectors are checked, not how they're scored, and a bigger model doesn't remove the length effect.
      - id: dense-vector-retrieval.base.v2.3
        prompt: For a test question, exact vector search ranks the answering passage 40th, and the ANN index doesn't return it at all. Where should you look first?
        options:
          - id: a
            text: The encoder, query wording, or chunking, since exact search misses it too
          - id: b
            text: The ANN settings, since raising nprobe or ef should recover the passage
          - id: c
            text: The passage's length, since cosine favors longer passages
        answer: a
        feedback: Exact search is the best any index can do, and it already ranks the passage 40th, so the problem is where the passage sits relative to the question. Better ANN settings can only get closer to exact search. Cosine ignores vector length.
      - id: dense-vector-retrieval.base.v2.4
        prompt: '"Opened batteries cannot be returned" and "Opened batteries can be returned" get a cosine similarity of 0.97. Why is this expected?'
        options:
          - id: b
            text: Cosine ignores word order, so the encoder never sees the word "not"
          - id: c
            text: The index is approximate, so it blurs sentences that are near each other
          - id: a
            text: A single vector captures the shared topic much more than a small negation
        answer: a
        feedback: Both sentences are about returning opened batteries, and one passage-level vector mostly encodes that. Encoders do read "cannot"; it just moves the vector a little. The index only affects which vectors are compared, not their similarity.
  - id: dense-vector-retrieval.transfer.v2
    objective_ref: objective.dense-vector-retrieval
    task: transfer
    response_type: single_choice
    points: 1
    hint: Decide whether the failure lies in the vectors themselves, in the index that searches them, or in treating similarity as proof.
    remediation_scene: dense-vector-retrieval.s3
    variants:
      - id: dense-vector-retrieval.transfer.v2.1
        prompt: A law firm upgrades its embedding model. New questions are encoded with the new model, but the 2 million stored contracts keep their old vectors. Search results turn nearly random. What fixes it?
        options:
          - id: a
            text: Re-encode all stored contracts with the new model and rebuild the index
          - id: c
            text: Normalize the old vectors so they can be compared with the new ones
          - id: b
            text: Increase the number of lists probed so the right contracts are found
        answer: a
        feedback: Two models produce two unrelated coordinate systems, so comparing across them is meaningless. Normalizing only fixes lengths, not what the coordinates mean, and probing more lists still compares mismatched vectors.
      - id: dense-vector-retrieval.transfer.v2.2
        prompt: A parts catalog uses only vector search. A search for "bearing 6204-2RS" returns "6205-2RS" and "6203-2RS" above the exact part. What is the most likely cause?
        options:
          - id: c
            text: The index is approximate and skipped the exact part number
          - id: a
            text: Embeddings place near-identical codes close together, blurring the digits
          - id: b
            text: The vectors weren't normalized, so longer part pages scored higher
        answer: a
        feedback: To an encoder, 6203, 6204, and 6205 look like nearly the same text, so their vectors sit together. Exact identifiers are where keyword search shines, which is why hybrid search exists. An approximate index would miss the part entirely rather than rank neighbors above it.
      - id: dense-vector-retrieval.transfer.v2.3
        prompt: A vendor reports that its vector database reaches recall@10 of 0.98. Your support bot still misses the right article for a third of questions. How can both be true?
        options:
          - id: b
            text: The 0.98 figure is averaged over many queries, so it hides a third of them
          - id: a
            text: The 0.98 compares the index with exact search, not with which article answers
          - id: c
            text: Recall@10 counts only the first result, so the other nine can be wrong
        answer: a
        feedback: Index recall says the ANN index nearly matches exact search. It says nothing about whether exact search puts the answering article near the question; that needs task recall against relevance judgments.
      - id: dense-vector-retrieval.transfer.v2.4
        prompt: A music service's HNSW index answers in 4 ms but misses about 15% of each song's true nearest neighbors. The team can afford 12 ms. What change fits?
        options:
          - id: a
            text: Let the search keep more candidates (raise ef), trading time for recall
          - id: c
            text: Switch from cosine to dot product to make each comparison cheaper
          - id: b
            text: Re-encode the songs with a smaller model to fit the time budget
        answer: a
        feedback: A wider graph walk checks more vectors, finding more true neighbors at higher latency, which the budget allows. Changing the similarity measure or the model changes what "nearest" means instead of finding the current nearest neighbors more reliably.
  - id: dense-vector-retrieval.calc
    objective_ref: objective.dense-vector-retrieval
    task: base
    response_type: numeric
    points: 1
    hint: Index recall@k = (how many of the exact top k the ANN index also returned) ÷ k. Average over queries when there are several.
    remediation_scene: dense-vector-retrieval.s3
    variants:
      - id: dense-vector-retrieval.calc.1
        prompt: Exact search returns [P, Q, R, S, T, U, V, W, X, Y] as the top 10. The ANN index returns [P, R, Q, Z, T, V, U, K, X, W]. What is the index's recall@10? Give a decimal.
        answer: 0.8
        feedback: The ANN list contains P, Q, R, T, U, V, W, X, which is 8 of the 10 exact neighbors. It missed S and Y. Recall@10 = 8/10 = 0.8. Order doesn't matter for recall.
      - id: dense-vector-retrieval.calc.2
        prompt: Exact top 5 is [A, B, C, D, E]. The ANN index returns [A, C, F, G, E]. What is the index's recall@5? Give a decimal.
        answer: 0.6
        feedback: A, C, and E appear in both lists, so recall@5 = 3/5 = 0.6.
      - id: dense-vector-retrieval.calc.3
        prompt: 'Over three test queries, an ANN index finds 9, 7, and 8 of the exact top 10 neighbors. What is its average recall@10? Give a decimal.'
        answer: 0.8
        feedback: The per-query recalls are 0.9, 0.7, and 0.8. Their average is 2.4/3 = 0.8.
      - id: dense-vector-retrieval.calc.4
        prompt: Exact top 4 is [K1, K2, K3, K4]. The ANN index returns [K2, K9, K1, K7]. What is the index's recall@4? Give a decimal.
        answer: 0.5
        feedback: K1 and K2 appear in both lists, so recall@4 = 2/4 = 0.5.
    absolute_tolerance: 0.01
