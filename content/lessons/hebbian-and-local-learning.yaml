objectives:
  - id: objective.hebbian-and-local-learning
    version: 2-draft
    statement: Hebbian rules change connections using pre- and postsynaptic activity; normalization, competition, and additional signals are needed to manage stability and connect local learning to useful tasks.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
