scenes:
  - id: hebbian-and-local-learning.s1
    title: Wire together what fires together
    type: explanation
    depth: intuition
    objective_refs:
      - objective.hebbian-and-local-learning
    markdown: |-
      Show a single artificial neuron the heights and arm spans of the five people from the PCA lesson, over and over. Give it no labels, no target, and no error signal. Can it learn anything at all?

      In 1949 the psychologist Donald Hebb proposed how real neurons might learn with no teacher:

      > "When an axon of cell A is near enough to excite a cell B and repeatedly or persistently takes part in firing it, some growth process or metabolic change takes place in one or both cells such that A's efficiency, as one of the cells firing B, is increased."

      Later researchers compressed this into a slogan: *cells that fire together wire together*. Call the sending cell **presynaptic** (activity $x$) and the receiving cell **postsynaptic** (activity $y$). The simplest **Hebbian rule** changes the connection weight $w$ between them by

      $$\Delta w = \eta\, x\, y$$

      where $\eta$ is a small **learning rate**. With $\eta = 0.1$, $x = 2$, and $y = 3$, the weight grows by $0.1 \times 2 \times 3 = 0.6$. If either cell is silent ($x = 0$ or $y = 0$), nothing changes.

      The rule uses no correct answer, no loss, and nothing from the rest of the network. Everything it needs is present at the connection itself. That property is called **locality**, and it's why Hebbian rules still interest neuroscientists and chip designers.
    bridges: []
  - id: hebbian-and-local-learning.s2
    title: Plain Hebb never stops growing
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.hebbian-and-local-learning
    markdown: |-
      Wire one input to a linear neuron, so its output is $y = w x$. Start with $w = 0.5$, feed $x = 1$ every step, and use $\eta = 0.1$.

      | Step | $y = wx$ | $\Delta w = \eta x y$ | New $w$ |
      | ---: | ---: | ---: | ---: |
      | 1 | 0.5 | 0.05 | 0.55 |
      | 2 | 0.55 | 0.055 | 0.605 |
      | 3 | 0.605 | 0.0605 | 0.6655 |

      Each step multiplies the weight by 1.1. After 10 steps it's 1.30; after 50 it's 58.7. This is positive feedback: a bigger weight makes a bigger output, which makes a bigger update, which makes a bigger weight.

      :::predict Half the inputs are x = −1 instead of 1. Do the positive and negative updates cancel?
      No. Substitute $y = wx$: the update is $\eta x (w x) = \eta w x^2$. Squaring removes the sign of $x$, so every update pushes $w$ further in the direction it already points. The weight grows exactly as before.
      :::

      With many inputs the same thing happens in every direction at once. Averaged over the data, plain Hebb gives $\Delta \mathbf{w} = \eta\, C \mathbf{w}$, where $C$ is the covariance matrix of the (centered) inputs from the PCA lesson. Repeatedly multiplying by $C$ stretches the weight vector fastest along $C$'s top eigenvector. So plain Hebb finds the right *direction*, the first principal component, while its *length* runs off to infinity.
    bridges:
      - algebra-notation
  - id: hebbian-and-local-learning.s3
    title: "Oja's rule: Hebb plus forgetting"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.hebbian-and-local-learning
    markdown: |-
      Fixes for the runaway include shrinking every weight a little each step (decay), making units compete for a fixed total strength, or **Oja's rule** (Erkki Oja, 1982), which subtracts a forgetting term that grows with the weight:

      $$\Delta w = \eta\, y\,(x - y\,w)$$

      Back in the one-input example ($x = 1$, $\eta = 0.1$): at $w = 0.5$, $y = 0.5$ and $\Delta w = 0.1 \times 0.5 \times (1 - 0.25) = 0.0375$, so the weight still grows. At $w = 2$, $y = 2$ and $\Delta w = 0.1 \times 2 \times (1 - 4) = -0.6$, so it shrinks. The weight settles at $w = 1$, where the two terms balance.

      Now two inputs. Ada, the first person in the PCA table, centered, is $\mathbf{x} = (-3, -3)$. Start with $\mathbf{w} = (1, 0)$ and $\eta = 0.01$. Then $y = -3$, and $\mathbf{x} - y\mathbf{w} = (0, -3)$, so $\Delta\mathbf{w} = 0.01 \times (-3) \times (0, -3) = (0, 0.09)$. Plain Hebb would add $(0.09, 0.09)$ and lengthen $\mathbf{w}$. Oja's version only turns it toward the diagonal. Run all five people for 200 sweeps:

      ```python run
      import numpy as np

      # The five people from the PCA lesson, centered: (height, arm span) in cm
      X = np.array([[-3, -3], [-1, -1], [0, 0], [1, 3], [3, 1]], dtype=float)
      eta = 0.01                         # learning rate
      w_hebb = np.array([1.0, 0.0])      # both neurons start pointing along "height"
      w_oja = np.array([1.0, 0.0])

      for sweep in range(1, 201):
          for x in X:
              y = w_hebb @ x
              w_hebb = w_hebb + eta * y * x                   # plain Hebb
              y = w_oja @ x
              w_oja = w_oja + eta * y * (x - y * w_oja)       # Oja's rule
          if sweep in (1, 5, 20, 200):
              print(f"sweep {sweep:3d}  Hebb length {np.linalg.norm(w_hebb):9.3g}"
                    f"   Oja w = {np.round(w_oja, 3)}, length {np.linalg.norm(w_oja):.3f}")

      C = X.T @ X / len(X)                       # covariance of the inputs
      vals, vecs = np.linalg.eigh(C)
      pc1 = vecs[:, -1] * np.sign(vecs[0, -1])   # eigenvector with the largest eigenvalue
      cos = abs(w_oja @ pc1) / np.linalg.norm(w_oja)
      print("PCA first direction:", np.round(pc1, 3))
      print("angle between Oja's w and PCA:", round(float(np.degrees(np.arccos(cos))), 2), "degrees")
      ```

      The Hebbian weight reaches a length of about $10^{29}$. Oja's weight ends at (0.715, 0.703) with length 1.003, within half a degree of PCA's (0.707, 0.707). Try `eta = 0.001` with 2,000 sweeps: the gap shrinks to 0.04 degrees. One neuron, one local rule, and it computes the first principal component from a stream of examples, never storing the dataset.

      :::papers Oja (1982): a neuron as a principal component analyzer
      Expand the rule: $\Delta\mathbf{w} = \eta\,(y\,\mathbf{x} - y^2\,\mathbf{w})$. The first term is Hebb; the second is a decay scaled by $y^2$. Averaged over centered data with covariance $C$,

      $$\mathbb{E}[\Delta\mathbf{w}] = \eta\,\big(C\mathbf{w} - (\mathbf{w}^\top C\,\mathbf{w})\,\mathbf{w}\big)$$

      This is zero exactly when $\mathbf{w}$ is a unit-length eigenvector of $C$, and the only stable choice is the one with the largest eigenvalue. Here $C = [[4, 3.2], [3.2, 4]]$ (the PCA lesson's matrix divided by $n = 5$ instead of $n - 1 = 4$), whose top eigenvector is $(0.707, 0.707)$.
      :::
    bridges:
      - pca-and-factorization
  - id: hebbian-and-local-learning.s4
    title: Local signals, global signals
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.hebbian-and-local-learning
    markdown: |-
      Oja's neuron found the direction the data vary most, but nothing told it which outputs were good. Compare what each kind of rule needs at one connection:

      | Rule | Information used at the connection | Where it comes from |
      | --- | --- | --- |
      | Hebb, Oja | $x$, $y$, and the weight itself | Right there, at the synapse |
      | **Three-factor rule** | $x$, $y$, plus one broadcast signal $M$ | A reward or "surprise" signal sent to many synapses at once |
      | Backpropagation | $x$ and an error computed at the output | Carried backward through every later layer's weights |

      A three-factor rule multiplies the Hebbian term by a third signal: $\Delta w = \eta\, M\, x\, y$. If $M$ is positive after a good outcome and negative after a bad one, coincidences are kept only when they paid off. Neuroscientists often link $M$ to dopamine, the brain chemical that signals unexpected reward.

      Backpropagation (from the lesson on how an error reaches earlier weights) is **global**: each weight's update depends on an error sent back through all the later weights. A synapse in the brain has no obvious way to know those downstream weights, a puzzle called the **weight transport problem**. In 2016 Lillicrap and colleagues showed that sending errors back through *fixed random* weights, called feedback alignment, still trains useful networks. That weakened a main objection to brains doing something like backpropagation.

      :::mixup "Hebbian learning strengthens the connections that lead to correct answers."
      It strengthens connections between cells that are active *together*, correct or not. A Hebbian spam filter shown emails full of "meeting" and "agenda" would strengthen those words whether the emails were spam or not. To learn a task, you need a third factor or an error signal.
      :::

      So when would you choose a local rule? When no backward pass is available: a chip whose synapse circuits see only their own two neurons, or a sensor tracking its readings' main direction as they stream in. Elsewhere, backpropagation usually learns faster and better.
    diagram:
      caption: What a single synapse can see. Local rules use the solid arrows; a three-factor rule adds the broadcast signal; backpropagation needs the long dashed path.
      description: The presynaptic cell sends activity x to the synapse, and the synapse passes w times x to the postsynaptic cell. The postsynaptic cell's activity y is also available back at the synapse. A broadcast reward signal M reaches the synapse on a dashed arrow, as the third factor. An output-layer error reaches the postsynaptic cell on a long dashed arrow, carried back through every later layer, which is the path backpropagation needs.
      nodes:
        - id: pre
          label: Presynaptic cell
          note: activity x
          col: 0
          row: 0
        - id: syn
          label: Synapse
          note: weight w
          col: 1
          row: 0
          tone: accent
        - id: post
          label: Postsynaptic cell
          note: activity y
          col: 2
          row: 0
        - id: mod
          label: Broadcast signal M
          note: reward or surprise
          col: 1
          row: 1
          tone: data
        - id: err
          label: Output-layer error
          note: several layers away
          col: 4
          row: 0
          tone: warn
      edges:
        - from: pre
          to: syn
          label: x
        - from: syn
          to: post
          label: w·x
        - from: post
          to: syn
          label: y, seen locally
          bend: 1
        - from: mod
          to: syn
          label: third factor
          dashed: true
        - from: err
          to: post
          label: backprop error, via later layers
          dashed: true
    bridges:
      - backpropagation
  - id: hebbian-and-local-learning.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.hebbian-and-local-learning
    markdown: A few Hebbian and Oja updates to compute by hand, plus a sensor chip, a reward-driven robot, and an overflowing weight, test whether you can predict what a local rule will learn.
    takeaway: |-
      Hebb's rule strengthens connections between cells that are active together, using only information at the synapse. On its own it grows without limit; Oja's forgetting term keeps it stable and makes one neuron find the first principal component.
  - id: hebbian-and-local-learning.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.hebbian-and-local-learning
    markdown: |-
      Hebbian learning strengthens connections from local coactivity. Additional controls limit growth and help turn that local rule into useful learning.
