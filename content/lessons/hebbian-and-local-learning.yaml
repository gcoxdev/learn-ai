assessment_families:
- id: hebbian-and-local-learning.base
  objective_ref: objective.hebbian-and-local-learning
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace one update: trace the inputs, operation, and result before choosing.'
  remediation_scene: hebbian-and-local-learning.s2
  variants:
  - id: hebbian-and-local-learning.base.1
    prompt: Rate 0.1, input 2, output 3 give the toy Hebbian change what?
    options:
    - id: b
      text: '6'
    - id: c
      text: '0.1'
    - id: a
      text: '0.6'
    answer: a
    feedback: Multiply the three quantities.
  - id: hebbian-and-local-learning.base.2
    prompt: Does basic coactivity reinforcement require a supervised target error?
    options:
    - id: c
      text: Only if the units are scalar
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: The illustrated rule uses local activities.
- id: hebbian-and-local-learning.transfer
  objective_ref: objective.hebbian-and-local-learning
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Place local rules in context: trace the inputs, operation, and result before choosing.'
  remediation_scene: hebbian-and-local-learning.s4
  variants:
  - id: hebbian-and-local-learning.transfer.1
    prompt: Why add normalization or decay?
    options:
    - id: c
      text: To guarantee universal intelligence
    - id: a
      text: To control growth and stabilize learning
    - id: b
      text: To remove every connection necessarily
    answer: a
    feedback: Naive positive feedback can become unbounded.
  - id: hebbian-and-local-learning.transfer.2
    prompt: Does a Hebbian toy rule fully explain biological learning?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if it uses spikes
    answer: a
    feedback: It models one limited mechanism.
