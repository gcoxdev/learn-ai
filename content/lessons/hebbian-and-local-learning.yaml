schema_version: 0.2-draft
lesson:
  id: hebbian-and-local-learning
  version: 0.3.0-draft
  title: Update connections from local activity
  state: draft
  summary: Change a connection using nearby activity, then control its growth.
  slot: M37.1
  category: learning
  sources:
  - title: Neuronal Dynamics
    url: https://neuronaldynamics.epfl.ch/online/
  - title: 'Oja: A simplified neuron model as a principal component analyzer'
    url: https://doi.org/10.1007/BF00275687
objectives:
- id: objective.hebbian-and-local-learning
  version: 1-draft
  statement: Hebbian rules change connections using pre- and postsynaptic activity; normalization, competition,
    and additional signals are needed to manage stability and connect local learning to useful tasks.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - hebbian-and-local-learning.base
  - hebbian-and-local-learning.transfer
  prerequisites:
  - anyOf:
    - objective.neurons
  - anyOf:
    - objective.history-foundations
scenes:
- id: hebbian-and-local-learning.s1
  title: Learn from coactivity
  type: explanation
  depth: intuition
  objective_refs:
  - objective.hebbian-and-local-learning
  markdown: A simple **Hebbian rule** increases a connection when its input and output units are active together.
    The input side is **presynaptic**; the receiving side is **postsynaptic**. In rate notation, delta w =
    learning_rate×input×output is a basic illustration. This uses local activity quantities rather than the
    complete chain-rule error signal of ordinary backpropagation.
  text_mode: A simple **Hebbian rule** increases a connection when its input and output units are active together.
    The input side is **presynaptic**; the receiving side is **postsynaptic**. In rate notation, delta w =
    learning_rate×input×output is a basic illustration. This uses local activity quantities rather than the
    complete chain-rule error signal of ordinary backpropagation.
  bridges: []
- id: hebbian-and-local-learning.s2
  title: Trace one update
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.hebbian-and-local-learning
  markdown: With learning rate 0.1, input two, and output three, the illustrative weight change is 0.6. The
    rule reinforces coactivity regardless of whether a supervised target was correct. Its usefulness depends
    on the network, data, and constraints.
  text_mode: With learning rate 0.1, input two, and output three, the illustrative weight change is 0.6. The
    rule reinforces coactivity regardless of whether a supervised target was correct. Its usefulness depends
    on the network, data, and constraints.
  bridges: []
- id: hebbian-and-local-learning.s3
  title: Prevent runaway growth
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.hebbian-and-local-learning
  markdown: 'Positive feedback can increase weights without bound in a naive rule. Normalization, decay, competition,
    or Oja-style corrections can limit growth and produce useful representation behavior under assumptions.
    Stability is an algorithmic issue, not automatically supplied by biological inspiration.


    For a linear unit with output y, Oja’s illustrative update is Δw = ηy(x − yw), where η is the learning
    rate. With x = 2, y = 1, w = 0.5, and η = 0.1, the change is 0.1 × (2 − 0.5) = 0.15. The subtraction opposes
    unchecked growth. This example illustrates a particular local rule, not a universal model of biological
    synapses.'
  text_mode: 'Positive feedback can increase weights without bound in a naive rule. Normalization, decay, competition,
    or Oja-style corrections can limit growth and produce useful representation behavior under assumptions.
    Stability is an algorithmic issue, not automatically supplied by biological inspiration.


    For a linear unit with output y, Oja’s illustrative update is Δw = ηy(x − yw), where η is the learning
    rate. With x = 2, y = 1, w = 0.5, and η = 0.1, the change is 0.1 × (2 − 0.5) = 0.15. The subtraction opposes
    unchecked growth. This example illustrates a particular local rule, not a universal model of biological
    synapses.'
  bridges:
  - algebra-notation
- id: hebbian-and-local-learning.s4
  title: Place local rules in context
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.hebbian-and-local-learning
  markdown: Local learning is important historically and in models of neural plasticity. Additional modulatory
    or reward signals can create richer rules. Distinguish a simplified computational mechanism from a complete
    account of brain learning, and compare learned representations or task performance under controlled conditions.
  text_mode: Local learning is important historically and in models of neural plasticity. Additional modulatory
    or reward signals can create richer rules. Distinguish a simplified computational mechanism from a complete
    account of brain learning, and compare learned representations or task performance under controlled conditions.
  bridges: []
- id: hebbian-and-local-learning.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.hebbian-and-local-learning
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Hebbian learning strengthens connections from local coactivity. Additional controls limit growth
    and help turn that local rule into useful learning.
