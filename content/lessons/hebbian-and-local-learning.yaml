  - id: hebbian-and-local-learning.transfer
    objective_ref: objective.hebbian-and-local-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Place local rules in context: trace the inputs, operation, and result before choosing.'
    remediation_scene: hebbian-and-local-learning.s4
    variants:
      - id: hebbian-and-local-learning.transfer.1
        prompt: Why add normalization or decay?
        options:
          - id: c
            text: To guarantee universal intelligence
          - id: a
            text: To control growth and stabilize learning
          - id: b
            text: To remove every connection necessarily
        answer: a
        feedback: Naive positive feedback can become unbounded.
        retired: true
      - id: hebbian-and-local-learning.transfer.2
        prompt: Does a Hebbian toy rule fully explain biological learning?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if it uses spikes
        answer: a
        feedback: It models one limited mechanism.
        retired: true
  - id: hebbian-and-local-learning.base.v2
    objective_ref: objective.hebbian-and-local-learning
    task: base
    response_type: single_choice
    points: 1
    hint: "Substitute y = w·x into the update and look at the sign: plain Hebb's update always points the way w already points, and Oja's extra −y²w term pulls the length back toward 1."
    remediation_scene: hebbian-and-local-learning.s2
    variants:
      - id: hebbian-and-local-learning.base.v2.1
        prompt: A linear neuron (y = wx) learns with plain Hebb. Half its inputs are x = +1 and half are x = −1. What happens to w over many steps?
        options:
          - id: b
            text: It stays roughly constant, since the positive and negative inputs cancel
          - id: c
            text: It shrinks toward zero, since negative inputs reduce the weight
          - id: a
            text: It keeps growing, since each update is ηwx² and x² is always positive
        answer: a
        feedback: Substituting y = wx gives Δw = ηwx², and squaring removes the sign of x. Every update pushes w further the way it already points, so nothing cancels.
      - id: hebbian-and-local-learning.base.v2.2
        prompt: "Oja's rule writes Δw = η(yx − y²w). What job does the −ηy²w part do?"
        options:
          - id: a
            text: It shrinks the weight more as the output grows, holding its length near 1
          - id: b
            text: It reverses the update whenever the neuron's output is incorrect
          - id: c
            text: It subtracts the average input so that the data become centered
        answer: a
        feedback: The term is a decay scaled by y², so a large weight (and output) is pulled back harder, and the length settles at 1. Oja's rule has no notion of a correct output, and centering is something you do to the data beforehand.
      - id: hebbian-and-local-learning.base.v2.3
        prompt: For the plain Hebbian update Δw = ηxy, which information must be available at the connection?
        options:
          - id: c
            text: The error measured at the network's output layer
          - id: a
            text: The activities of the two cells that the connection joins
          - id: b
            text: The correct label for the input being presented
        answer: a
        feedback: Hebb's rule multiplies the sending cell's activity x by the receiving cell's activity y, both present at the synapse. Output errors and labels are what backpropagation and supervised learning need.
      - id: hebbian-and-local-learning.base.v2.4
        prompt: A neuron runs Oja's rule on centered two-dimensional data until its weights stop changing. Where does its weight vector point?
        options:
          - id: b
            text: Along whichever input feature has the largest average value
          - id: c
            text: Along the direction in which the data vary the least
          - id: a
            text: Along the direction in which the data vary the most
        answer: a
        feedback: The stable fixed point is the unit-length eigenvector of the covariance with the largest eigenvalue, the first principal component. Averages play no role once the data are centered, and the least-variance direction is an unstable fixed point.
      - id: hebbian-and-local-learning.base.v2.5
        prompt: Plain Hebb and Oja's rule both run on the same centered data. After many sweeps, how do their weight vectors compare?
        options:
          - id: a
            text: They point the same way, but only Oja's keeps a length near 1
          - id: b
            text: They point at right angles, since Oja's rule finds the second component
          - id: c
            text: They end up identical, since the forgetting term fades out over time
        answer: a
        feedback: Averaged plain Hebb is Δw = ηCw, which stretches w fastest along the top eigenvector, so its direction matches Oja's while its length explodes. The forgetting term never fades; it is what holds Oja's length at 1.
  - id: hebbian-and-local-learning.transfer.v2
    objective_ref: objective.hebbian-and-local-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask two things. Which signals can each connection actually see? And is anything stopping the weights from growing forever?
    remediation_scene: hebbian-and-local-learning.s4
    variants:
      - id: hebbian-and-local-learning.transfer.v2.1
        prompt: A chip designer wants on-chip learning, but each synapse circuit can sense only the activity of the two neurons it connects. Which learning rule fits?
        options:
          - id: b
            text: Backpropagation, run by each synapse circuit on its own
          - id: a
            text: A Hebbian rule with normalization, such as Oja's rule
          - id: c
            text: A supervised rule comparing each neuron with its label
        answer: a
        feedback: Oja's rule needs only x, y, and the synapse's own weight, all present at the circuit. Backpropagation needs errors from later layers, and per-neuron labels aren't available to a synapse either.
      - id: hebbian-and-local-learning.transfer.v2.2
        prompt: A robot arm uses plain Hebbian learning while practicing reaches. It strengthens connections during failed reaches as much as during successful ones. What should be added?
        options:
          - id: c
            text: A larger learning rate, so that successful reaches are learned sooner
          - id: b
            text: Weight decay, so that every connection shrinks a little each step
          - id: a
            text: A broadcast reward signal that scales each Hebbian update
        answer: a
        feedback: A three-factor rule, Δw = ηMxy, keeps coincidences that were followed by reward and weakens ones followed by failure. A larger rate or decay changes how fast or how far weights move, but still ignores whether the reach worked.
      - id: hebbian-and-local-learning.transfer.v2.3
        prompt: A microcontroller reads eight correlated temperature sensors and must learn one summary number. It has no memory to store past readings. What is a good approach?
        options:
          - id: a
            text: Run Oja's rule on each centered reading as it arrives
          - id: b
            text: Run plain Hebb on each reading and use the resulting weights
          - id: c
            text: Store a week of readings and then run PCA on them
        answer: a
        feedback: Oja's rule updates from one example at a time and converges to the first principal component, so no dataset is stored. Plain Hebb finds the same direction but its weights overflow, and storing a week of data breaks the memory limit.
      - id: hebbian-and-local-learning.transfer.v2.4
        prompt: A student's Hebbian simulation prints weights of inf after 1,000 steps. What is the most likely cause?
        options:
          - id: b
            text: The learning rate was too small for the weights to settle
          - id: a
            text: Larger weights give larger outputs, which give larger updates
          - id: c
            text: The inputs had no labels, so the rule had nothing to learn from
        answer: a
        feedback: Plain Hebb is positive feedback, so the weights grow geometrically until they overflow. A smaller rate only slows the explosion, and Hebbian rules never needed labels. Adding normalization, as Oja's rule does, fixes it.
      - id: hebbian-and-local-learning.transfer.v2.5
        prompt: A pressure sensor's readings all sit near 1,000 with small, correlated wiggles. Oja's rule, run on the raw readings, ends up pointing at the average reading instead of the direction of the wiggles. What went wrong?
        options:
          - id: a
            text: The readings weren't centered, so the large mean dominated
          - id: b
            text: The learning rate was too large for Oja's rule to converge
          - id: c
            text: Oja's rule finds the smallest-variance direction by design
        answer: a
        feedback: Oja's rule finds the top eigenvector of the average of x times x-transpose. Without centering, the huge mean dominates that matrix, so the weights point at the mean. Subtract the mean first. A smaller rate wouldn't change where it converges.
  - id: hebbian-and-local-learning.calculate
    objective_ref: objective.hebbian-and-local-learning
    task: base
    response_type: numeric
    points: 1
    hint: "Plain Hebb: multiply η × x × y. Oja: first compute y = w × x, then η × y × (x − y × w). Watch the signs."
    remediation_scene: hebbian-and-local-learning.s3
    absolute_tolerance: 0.001
    variants:
      - id: hebbian-and-local-learning.calculate.1
        prompt: A Hebbian connection has learning rate η = 0.05. The presynaptic activity is 4 and the postsynaptic activity is 3. What is Δw?
        answer: 0.6
        feedback: Δw = ηxy = 0.05 × 4 × 3 = 0.6.
      - id: hebbian-and-local-learning.calculate.2
        prompt: A Hebbian connection has η = 0.05, presynaptic activity x = 4, and postsynaptic activity y = −2. What is Δw?
        answer: -0.4
        feedback: Δw = 0.05 × 4 × (−2) = −0.4. With rate-coded activities that can be negative, Hebb's rule can weaken a connection too.
      - id: hebbian-and-local-learning.calculate.3
        prompt: A linear neuron (y = wx) starts at w = 0.5 and learns with plain Hebb, η = 0.1 and x = 1 every step. What is w after two updates?
        answer: 0.605
        feedback: Each update multiplies w by (1 + ηx²) = 1.1. So 0.5 → 0.55 → 0.605.
      - id: hebbian-and-local-learning.calculate.4
        prompt: "Oja's rule, one input: η = 0.1, x = 2, current weight w = 0.5, and output y = wx = 1. What is Δw = ηy(x − yw)?"
        answer: 0.15
        feedback: x − yw = 2 − 1 × 0.5 = 1.5, so Δw = 0.1 × 1 × 1.5 = 0.15.
      - id: hebbian-and-local-learning.calculate.5
        prompt: "Oja's rule, one input: η = 0.1, x = 1, and the weight has grown to w = 2. What is Δw?"
        answer: -0.6
        feedback: y = 2 × 1 = 2, and x − yw = 1 − 4 = −3, so Δw = 0.1 × 2 × (−3) = −0.6. The forgetting term pulls an oversized weight back toward 1.
