assessment_families:
- id: optimization-math.base
  objective_ref: objective.optimization-math
  task: base
  response_type: single_choice
  points: 1
  hint: 'Take a step you can inspect: trace the inputs, operation, and result before choosing.'
  remediation_scene: optimization-math.s2
  variants:
  - id: optimization-math.base.1
    prompt: 'Gradient −6, current weight 1, rate 0.1: what is the descent update?'
    options:
    - id: a
      text: '1.6'
    - id: b
      text: '0.4'
    - id: c
      text: −0.6
    answer: a
    feedback: 'Subtracting a negative step increases the weight: 1 − 0.1 × (−6).'
  - id: optimization-math.base.2
    prompt: What does a Hessian describe locally?
    options:
    - id: b
      text: The names of training files
    - id: c
      text: Only the number of outputs
    - id: a
      text: Second-derivative curvature
    answer: a
    feedback: Second derivatives describe how first derivatives change.
- id: optimization-math.transfer
  objective_ref: objective.optimization-math
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Distinguish guarantees from heuristics: trace the inputs, operation, and result before choosing.'
  remediation_scene: optimization-math.s4
  variants:
  - id: optimization-math.transfer.1
    prompt: A candidate violates a hard budget but has low loss. Is low loss alone sufficient?
    options:
    - id: b
      text: Yes; objectives erase constraints
    - id: c
      text: Only if its gradient is negative
    - id: a
      text: No; feasibility must also be checked
    answer: a
    feedback: A constrained optimization problem requires feasible solutions.
  - id: optimization-math.transfer.2
    prompt: A neural network reaches zero gradient. Is global optimality established?
    options:
    - id: c
      text: Yes, provided the model is large
    - id: a
      text: No; stationary points need not be global minima
    - id: b
      text: Yes, for every nonconvex objective
    answer: a
    feedback: Zero first derivatives alone do not classify the point or prove global quality.
