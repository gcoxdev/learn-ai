lesson:
  id: optimization-math
  version: 0.3.0-draft
  title: Choose a direction and a step size
  state: draft
  summary: Choose a direction, a step size, and the boundaries the result must respect.
  slot: B16
  category: bridge
  sources:
  - title: Deep Learning — numerical computation
    url: https://www.deeplearningbook.org/contents/numerical.html
objectives:
- id: objective.optimization-math
  version: 1-draft
  statement: Optimization combines an objective, feasible choices, and an update rule; curvature, constraints,
    and momentum affect which steps are useful.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - optimization-math.base
  - optimization-math.transfer
  prerequisites:
  - anyOf:
    - objective.multivariable-calculus
scenes:
- id: optimization-math.s1
  title: Define what counts as better
  type: explanation
  depth: intuition
  objective_refs:
  - objective.optimization-math
  markdown: An objective assigns a number to a candidate solution. Minimizing squared error differs from minimizing
    memory or travel time. Constraints restrict feasible candidates, such as a nonnegative allocation or a
    fixed compute budget. A low objective value is meaningful only if the objective and constraints represent
    the actual problem.
  text_mode: An objective assigns a number to a candidate solution. Minimizing squared error differs from minimizing
    memory or travel time. Constraints restrict feasible candidates, such as a nonnegative allocation or a
    fixed compute budget. A low objective value is meaningful only if the objective and constraints represent
    the actual problem.
  bridges: []
- id: optimization-math.s2
  title: Take a step you can inspect
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.optimization-math
  markdown: For L(w) = (w − 3)², the derivative is 2(w − 3). At w = 1 it is −4. Gradient descent with learning
    rate 0.25 uses new weight = old weight − rate × gradient, giving 1 − 0.25 × (−4) = 2. The loss falls from
    4 to 1.
  text_mode: For L(w) = (w − 3)², the derivative is 2(w − 3). At w = 1 it is −4. Gradient descent with learning
    rate 0.25 uses new weight = old weight − rate × gradient, giving 1 − 0.25 × (−4) = 2. The loss falls from
    4 to 1.
  bridges:
  - multivariable-calculus
  - derivatives
- id: optimization-math.s3
  title: Curvature changes the safe scale
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.optimization-math
  markdown: 'For L(w) = (w − 3)², the derivative 2(w − 3) changes at a constant rate of 2. This is the **second
    derivative**, the rate at which the slope changes. With several inputs, a table called the **Hessian**
    collects these second derivatives.


    This local **curvature** helps explain why one step size can be gentle in a broad direction and too large
    in a narrow, steep one. **Momentum** carries information from earlier gradients into the next update; it
    can reduce zigzagging, but can also carry an update past a useful region.


    A zero gradient alone is inconclusive. It can occur at a minimum, maximum, or saddle, where different directions
    behave differently.'
  text_mode: 'For L(w) = (w − 3)², the derivative 2(w − 3) changes at a constant rate of 2. This is the **second
    derivative**, the rate at which the slope changes. With several inputs, a table called the **Hessian**
    collects these second derivatives.


    This local **curvature** helps explain why one step size can be gentle in a broad direction and too large
    in a narrow, steep one. **Momentum** carries information from earlier gradients into the next update; it
    can reduce zigzagging, but can also carry an update past a useful region.


    A zero gradient alone is inconclusive. It can occur at a minimum, maximum, or saddle, where different directions
    behave differently.'
  bridges:
  - multivariable-calculus
- id: optimization-math.s4
  title: Distinguish guarantees from heuristics
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.optimization-math
  markdown: 'A **convex set** contains the straight segment joining any two of its points. A **convex function**
    lies at or below each chord joining two points on its graph; a bowl is a useful picture. For a convex objective
    over a convex feasible set, a local minimum is also global. Neural objectives are usually nonconvex, so
    that guarantee does not generally apply.


    Constraints can also change the update. If a proposed value is 1.3 but allowed values are [0, 1], **projection**
    moves it to the closest allowed value, 1. A **penalty** instead changes the objective to discourage violations;
    a finite penalty need not make violations impossible.'
  text_mode: 'A **convex set** contains the straight segment joining any two of its points. A **convex function**
    lies at or below each chord joining two points on its graph; a bowl is a useful picture. For a convex objective
    over a convex feasible set, a local minimum is also global. Neural objectives are usually nonconvex, so
    that guarantee does not generally apply.


