lesson:
  id: optimization-math
  version: 0.1.0-draft
  title: Choose a direction and a step size
  state: draft
  summary: Optimization combines an objective, feasible choices, and an update rule; curvature, constraints, and
    momentum affect which steps are useful.
  slot: B16
  category: bridge
  minutes: 12
  sources:
  - title: Deep Learning — numerical computation
    url: https://www.deeplearningbook.org/contents/numerical.html
objectives:
- id: objective.optimization-math
  version: 1-draft
  statement: Optimization combines an objective, feasible choices, and an update rule; curvature, constraints, and
    momentum affect which steps are useful.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - optimization-math.base
  - optimization-math.transfer
  prerequisites:
  - anyOf:
    - objective.multivariable-calculus
scenes:
- id: optimization-math.s1
  title: Define what counts as better
  type: explanation
  depth: intuition
  objective_refs:
  - objective.optimization-math
  markdown: An objective assigns a number to a candidate solution. Minimizing squared error differs from minimizing
    memory or travel time. Constraints restrict feasible candidates, such as a nonnegative allocation or a fixed
    compute budget. A low objective value is meaningful only if the objective and constraints represent the actual
    problem.
  text_mode: An objective assigns a number to a candidate solution. Minimizing squared error differs from minimizing
    memory or travel time. Constraints restrict feasible candidates, such as a nonnegative allocation or a fixed
    compute budget. A low objective value is meaningful only if the objective and constraints represent the actual
    problem.
  bridges: []
- id: optimization-math.s2
  title: Take a step you can inspect
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.optimization-math
  markdown: For L(w) = (w − 3)², the derivative is 2(w − 3). At w = 1 it is −4. Gradient descent with learning rate
    0.25 uses new weight = old weight − rate × gradient, giving 1 − 0.25 × (−4) = 2. The loss falls from 4 to 1.
  text_mode: For L(w) = (w − 3)², the derivative is 2(w − 3). At w = 1 it is −4. Gradient descent with learning
    rate 0.25 uses new weight = old weight − rate × gradient, giving 1 − 0.25 × (−4) = 2. The loss falls from 4
    to 1.
  bridges:
  - multivariable-calculus
- id: optimization-math.s3
  title: Curvature changes the safe scale
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.optimization-math
  markdown: The Hessian collects second derivatives and describes local curvature for a scalar function. A narrow,
    steep direction may require a smaller step than a broad, flat direction. Momentum keeps a running direction
    from previous gradients and can reduce zigzagging, but accumulated motion can also overshoot. A zero gradient
    can occur at a minimum, maximum, or saddle.
  text_mode: The Hessian collects second derivatives and describes local curvature for a scalar function. A narrow,
    steep direction may require a smaller step than a broad, flat direction. Momentum keeps a running direction
    from previous gradients and can reduce zigzagging, but accumulated motion can also overshoot. A zero gradient
    can occur at a minimum, maximum, or saddle.
  bridges: []
- id: optimization-math.s4
  title: Distinguish guarantees from heuristics
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.optimization-math
  markdown: 'A convex objective over a convex feasible set has useful global properties: a local minimum is global.
    Neural objectives are usually nonconvex, so these guarantees do not transfer automatically. Projection can move
    a proposed update back into a feasible set; penalties instead change the objective and may not enforce a hard
    constraint exactly.'
  text_mode: 'A convex objective over a convex feasible set has useful global properties: a local minimum is global.
    Neural objectives are usually nonconvex, so these guarantees do not transfer automatically. Projection can move
    a proposed update back into a feasible set; penalties instead change the objective and may not enforce a hard
    constraint exactly.'
  bridges: []
