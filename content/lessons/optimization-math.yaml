schema_version: 0.2-draft
lesson:
  id: optimization-math
  version: 0.4.0-draft
  title: Choose a direction and a step size
  state: draft
  summary: A learning rate of 0.5 finishes in one step; 1.1 flings the weight off to infinity. See why, using one bowl-shaped loss and a formula you can check by hand.
  slot: B16
  category: bridge
  sources:
    - title: Deep Learning — numerical computation
      url: https://www.deeplearningbook.org/contents/numerical.html
objectives:
  - id: objective.optimization-math
    version: 2-draft
    statement: Optimization combines an objective, feasible choices, and an update rule; curvature, constraints, and momentum affect which steps are useful.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - optimization-math.base.v2
      - optimization-math.transfer.v2
    prerequisites:
      - anyOf:
          - objective.multivariable-calculus
scenes:
  - id: optimization-math.s1
    title: Say what "better" means
    type: explanation
    depth: intuition
    objective_refs:
      - objective.optimization-math
    markdown: |-
      Every training run is an optimization problem: find the weights that make the loss as small as possible. Each training step is a gradient step with a learning rate, and picking that rate is one of the first choices you make. This detour shows what the rate does.

      An optimization problem has two parts. The **objective** is the number you're trying to push down (or up), such as validation loss. **Constraints** are rules every answer must obey, such as "the model must fit in 8 GB of memory." Answers that obey every constraint are called **feasible**. A model with a lower loss that needs 12 GB isn't a better answer to that problem; it isn't an answer at all.

      We'll use one small objective throughout, L(w) = (w − 3)². Its lowest point is at w = 3, and its slope is L′(w) = 2(w − 3).
    bridges: []
  - id: optimization-math.s2
    title: Take one step by hand
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.optimization-math
    markdown: |-
      Gradient descent moves against the slope:

      $$w_{\text{new}} = w - \eta \, L'(w)$$

      The Greek letter η (eta) is the learning rate. Start at w = 1 with η = 0.25. The slope is 2(1 − 3) = −4, so w_new = 1 − 0.25 × (−4) = 2. The loss falls from (1 − 3)² = 4 to (2 − 3)² = 1.

      For this bowl there's a neat shortcut. Subtract 3 from both sides of the update:

      $$w_{\text{new}} - 3 = (w - 3) - \eta \cdot 2(w - 3) = (1 - 2\eta)(w - 3)$$

      Each step multiplies the distance to the bottom by 1 − 2η. With η = 0.25 the factor is 0.5: the distance goes from 2 to 1, as we just found. The next step takes it to 0.5, then 0.25.
    bridges:
      - multivariable-calculus
      - derivatives
  - id: optimization-math.s3
    title: Too small, just right, too big
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.optimization-math
    markdown: |-
      :::predict Using the factor 1 − 2η, what happens with η = 0.5, η = 0.9, and η = 1.1?
      η = 0.5 gives a factor of 0: one step lands exactly on 3. η = 0.9 gives −0.8: the weight hops across the bottom each time, shrinking slowly. η = 1.1 gives −1.2: each hop is 20% bigger than the last, and the weight runs away.
      :::

      Check with five steps from w = 1:

      ```python run
      def grad(w):
          return 2 * (w - 3)            # slope of L(w) = (w - 3)^2

      for rate in [0.1, 0.5, 0.9, 1.1]:
          w = 1.0
          path = [w]
          for step in range(5):
              w = w - rate * grad(w)
              path.append(round(w, 3))
          print(f"rate {rate}: w =", path)
      ```

      Rate 0.1 creeps: 1.4, 1.72, 1.976… Rate 0.5 lands on 3.0. Rate 0.9 bounces from side to side: 4.6, 1.72, 4.024… Rate 1.1 reaches 7.977 after five steps. Try 1.0: the weight flips between 1 and 5 forever.

      :::mixup "A bigger learning rate always trains faster."
      Only up to a point. Rates 0.1 and 0.9 shrink the distance by the same factor, 0.8 in size, so 0.9 is no faster; it just zigzags. Past 1.0 training diverges. In real training, a loss that suddenly shoots up or turns into NaN is often this.
      :::

      The limit comes from **curvature**, how fast the slope itself changes: the **second derivative**. Here L″(w) = 2, and the largest stable rate is 2 ÷ curvature = 1. A bowl four times steeper, with curvature 8, would allow only rates below 0.25. With many weights, the table of all second derivatives is the **Hessian**. Steep and shallow directions then share one learning rate, which is why the lesson on loss landscapes finds the safe rate from the steepest direction, and why **momentum** (a running average of recent gradients, covered in the lesson on momentum and Adam) helps along the shallow ones.
    bridges:
      - multivariable-calculus
  - id: optimization-math.s4
    title: Bowls, bumpy landscapes, and fences
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.optimization-math
    markdown: |-
      Our bowl is **convex**: a straight line between any two points on its graph never dips below the graph. On a convex objective, any bottom you find is the lowest bottom. Neural network losses aren't convex, so a zero slope can mean a local minimum or a saddle point, where some directions go up and others go down. The lesson on loss landscapes explores these.

      Constraints change the step too. Suppose a weight must stay between 0 and 1, and a step proposes 1.3. **Projection** moves it to the nearest allowed value, 1. A **penalty** takes the other route: it adds a cost to the objective, so violations become expensive rather than impossible. The L2 penalty, which charges for large weights, is the classic example; the lesson on penalties and clipping puts it to work.
    bridges: []
  - id: optimization-math.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.optimization-math
    markdown: New bowls and learning rates, an exploding training run, a memory budget, and a clipped weight ask you to take a step, predict whether steps settle, and respect the constraints.
    takeaway: |-
      On the bowl (w − 3)², each gradient step multiplies the distance to the bottom by 1 − 2η, so a rate that is too large for the curvature makes training bounce or blow up.
  - id: optimization-math.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.optimization-math
    markdown: |-
      Optimization combines an objective, feasible choices, and an update rule; curvature, constraints, and momentum affect which steps are useful.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - optimization-math.s1
        - optimization-math.s2
        - optimization-math.s3
        - optimization-math.s4
        - optimization-math.check
      gate_refs:
        - gate.core
  scene_aliases:
    optimization-math.recap: optimization-math.check
assessment_families:
  - id: optimization-math.base
    objective_ref: objective.optimization-math
    task: base
    response_type: single_choice
    points: 1
    hint: 'Take a step you can inspect: trace the inputs, operation, and result before choosing.'
    remediation_scene: optimization-math.s2
    variants:
      - id: optimization-math.base.1
        prompt: 'Gradient −6, current weight 1, rate 0.1: what is the descent update?'
        options:
          - id: a
            text: '1.6'
          - id: b
            text: '0.4'
          - id: c
            text: −0.6
        answer: a
        feedback: 'Subtracting a negative step increases the weight: 1 − 0.1 × (−6).'
        retired: true
      - id: optimization-math.base.2
        prompt: What does a Hessian describe locally?
        options:
          - id: b
            text: The names of training files
          - id: c
            text: Only the number of outputs
          - id: a
            text: Second-derivative curvature
        answer: a
        feedback: Second derivatives describe how first derivatives change.
        retired: true
  - id: optimization-math.transfer
    objective_ref: objective.optimization-math
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Distinguish guarantees from heuristics: trace the inputs, operation, and result before choosing.'
    remediation_scene: optimization-math.s4
    variants:
      - id: optimization-math.transfer.1
        prompt: A candidate violates a hard budget but has low loss. Is low loss alone sufficient?
        options:
          - id: b
            text: Yes; objectives erase constraints
          - id: c
            text: Only if its gradient is negative
          - id: a
            text: No; feasibility must also be checked
        answer: a
        feedback: A constrained optimization problem requires feasible solutions.
        retired: true
      - id: optimization-math.transfer.2
        prompt: A neural network reaches zero gradient. Is global optimality established?
        options:
          - id: c
            text: Yes, provided the model is large
          - id: a
            text: No; stationary points need not be global minima
          - id: b
            text: Yes, for every nonconvex objective
        answer: a
        feedback: Zero first derivatives alone do not classify the point or prove global quality.
        retired: true
  - id: optimization-math.base.v2
    objective_ref: objective.optimization-math
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: The slope of (w − c)² is 2(w − c), and the next weight is w − η × slope. Each step multiplies the distance to c by 1 − 2η; judge the run by the size of that factor.
    remediation_scene: optimization-math.s3
    numeric_fields:
      - id: slope
        label: Slope L′(w) at the start
      - id: next
        label: Weight after one step
      - id: factor
        label: Distance factor 1 − 2η
    absolute_tolerance: 1e-6
    variants:
      - id: optimization-math.base.v2.1
        prompt: Minimize L(w) = (w − 5)² by gradient descent, starting at w = 1 with learning rate η = 0.1. Enter the slope, the weight after one step, and the distance factor, then say how the run behaves.
        answers:
          slope: -8
          next: 1.8
          factor: 0.8
        reason_answer: a
        reason_options:
          - id: b
            text: It diverges, because the distance to the bottom grows each step
          - id: a
            text: It converges, because the distance to the bottom shrinks each step
          - id: c
            text: It lands on the bottom exactly after a single step
        feedback: The slope is 2(1 − 5) = −8, so w becomes 1 − 0.1 × (−8) = 1.8. The factor 1 − 2 × 0.1 = 0.8 is below 1 in size, so the distance shrinks from 4 to 3.2, and so on.
      - id: optimization-math.base.v2.2
        prompt: Minimize L(w) = (w − 2)² by gradient descent, starting at w = 4 with learning rate η = 0.75. Enter the slope, the weight after one step, and the distance factor, then say how the run behaves.
        answers:
          slope: 4
          next: 1
          factor: -0.5
        reason_answer: a
        reason_options:
          - id: c
            text: It lands on the bottom exactly after a single step
          - id: b
            text: It diverges, because the distance to the bottom grows each step
          - id: a
            text: It converges, because the distance to the bottom shrinks each step
        feedback: The slope is 2(4 − 2) = 4, so w becomes 4 − 0.75 × 4 = 1, on the other side of 2. The factor is 1 − 1.5 = −0.5. Its size is below 1, so the weight hops across the bottom while the distance halves each step.
      - id: optimization-math.base.v2.3
        prompt: Minimize L(w) = (w − 3)² by gradient descent, starting at w = 0 with learning rate η = 1.25. Enter the slope, the weight after one step, and the distance factor, then say how the run behaves.
        answers:
          slope: -6
          next: 7.5
          factor: -1.5
        reason_answer: b
        reason_options:
          - id: a
            text: It converges, because the distance to the bottom shrinks each step
          - id: c
            text: It lands on the bottom exactly after a single step
          - id: b
            text: It diverges, because the distance to the bottom grows each step
        feedback: The slope is 2(0 − 3) = −6, so w becomes 0 + 1.25 × 6 = 7.5. The distance went from 3 to 4.5, because the factor 1 − 2.5 = −1.5 is bigger than 1 in size. The rate is past the stable limit of 1.
      - id: optimization-math.base.v2.4
        prompt: Minimize L(w) = (w + 1)² by gradient descent, starting at w = 2 with learning rate η = 0.5. Enter the slope, the weight after one step, and the distance factor, then say how the run behaves.
        answers:
          slope: 6
          next: -1
          factor: 0
        reason_answer: c
        reason_options:
          - id: a
            text: It converges, because the distance to the bottom shrinks each step
          - id: b
            text: It diverges, because the distance to the bottom grows each step
          - id: c
            text: It lands on the bottom exactly after a single step
        feedback: The bottom is at w = −1. The slope is 2(2 + 1) = 6, so w becomes 2 − 0.5 × 6 = −1. The factor 1 − 2 × 0.5 = 0 wipes out the whole distance in one step.
  - id: optimization-math.transfer.v2
    objective_ref: objective.optimization-math
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask three things. Does the step size suit the steepest curvature? Does the answer obey every constraint? Is a flat spot really the bottom?
    remediation_scene: optimization-math.s3
    variants:
      - id: optimization-math.transfer.v2.1
        prompt: A training run's loss shoots up to NaN within a few steps at learning rate 0.3, but falls steadily at 0.03. What is the most likely explanation?
        options:
          - id: b
            text: At 0.3 the steps are too small to get out of a flat region
          - id: a
            text: 0.3 is past the stable limit, so each step overshoots further
          - id: c
            text: The training data must have been shuffled differently
        answer: a
        feedback: A rate beyond 2 ÷ curvature in the steepest direction makes every step overshoot by more than the last, so the loss explodes. A rate that was too small would make progress slow, not explosive.
      - id: optimization-math.transfer.v2.2
        prompt: 'The problem is "lowest validation loss among models that fit in 8 GB." Model X has loss 0.41 and needs 12 GB. Model Y has loss 0.44 and needs 6 GB. Which solves the problem?'
        options:
          - id: c
            text: Neither, until memory is added to the loss as a penalty
          - id: b
            text: X, because the loss is the number being minimized
          - id: a
            text: Y, because X breaks the memory constraint
        answer: a
        feedback: X isn't feasible, so its lower loss doesn't count. Among feasible models, Y has the lowest loss. A penalty is one way to handle constraints, but the problem as stated already has an answer.
      - id: optimization-math.transfer.v2.3
        prompt: During training, the gradient shrinks to nearly zero while the loss is still much higher than other runs reach. Which explanation fits?
        options:
          - id: a
            text: It may sit on a saddle or flat plateau, not the lowest minimum
          - id: b
            text: It has found the lowest possible loss, since the slope is zero
          - id: c
            text: The learning rate is too high, which makes gradients vanish
        answer: a
        feedback: Neural losses aren't convex, so a zero slope can mean a saddle, a plateau, or a poor local minimum. Only on a convex objective is every flat bottom the lowest one.
      - id: optimization-math.transfer.v2.4
        prompt: A mixing weight must stay between 0 and 1. A gradient step proposes 1.3. What does projection do?
        options:
          - id: b
            text: Sets the weight to 0.3, wrapping around past 1
          - id: c
            text: Keeps 1.3 but adds a cost for exceeding 1 to the loss
          - id: a
            text: Sets the weight to 1, the nearest allowed value
        answer: a
        feedback: Projection moves an infeasible value to the closest feasible one, here 1. Adding a cost for violations is the penalty approach, a different method that allows violations but makes them expensive.
