  title: Learn a dictionary or a neighborhood-organized representation
  state: draft
  summary: Represent an input with a few building blocks or organize similar inputs on a map.
  slot: M37.3
  category: learning
  sources:
  - title: Sparse Coding with an Overcomplete Basis Set
    url: https://doi.org/10.1016/S0042-6989(97)00169-7
  - title: Self-Organized Formation of Topologically Correct Feature Maps
    url: https://doi.org/10.1007/BF00337288
objectives:
- id: objective.sparse-coding-and-self-organizing-maps
  version: 1-draft
  statement: Sparse coding reconstructs inputs with few active dictionary coefficients, while self-organizing
    maps update a winning prototype and its neighbors; their objectives and representation meanings differ.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - sparse-coding-and-self-organizing-maps.base
  - sparse-coding-and-self-organizing-maps.transfer
  prerequisites:
  - anyOf:
    - objective.pca-and-factorization
  - anyOf:
    - objective.hebbian-and-local-learning
scenes:
- id: sparse-coding-and-self-organizing-maps.s1
  title: Reconstruct with a sparse dictionary
  type: explanation
  depth: intuition
  objective_refs:
  - objective.sparse-coding-and-self-organizing-maps
  markdown: '**Sparse coding** represents an input as a weighted combination of building blocks called **dictionary
    elements**. Training balances reconstruction with a penalty that favors relatively few active coefficients.


    A dictionary can be **overcomplete**, meaning it has more elements than the input has dimensions. This
    offers alternative descriptions of the same input, unlike ordinary PCA''s orthogonal low-dimensional basis.
    Finding coefficients for one input and learning the dictionary from many inputs are separate optimization
    problems.'
  text_mode: '**Sparse coding** represents an input as a weighted combination of building blocks called **dictionary
    elements**. Training balances reconstruction with a penalty that favors relatively few active coefficients.


    A dictionary can be **overcomplete**, meaning it has more elements than the input has dimensions. This
    offers alternative descriptions of the same input, unlike ordinary PCA''s orthogonal low-dimensional basis.
    Finding coefficients for one input and learning the dictionary from many inputs are separate optimization
    problems.'
  bridges: []
- id: sparse-coding-and-self-organizing-maps.s2
  title: Trace a small representation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sparse-coding-and-self-organizing-maps
  markdown: 'Imagine dictionary elements representing horizontal and vertical strokes. A corner can use both,
    while a horizontal line mainly uses one. Actual learned elements need not correspond to named concepts
    like these.


    For a numerical example, use dictionary vectors [1, 0] and [0, 1]. Input [2, 0] can be reconstructed with
    coefficients [2, 0], so only the first element is active. Input [2, 3] uses both. Reconstruction and sparsity
    penalties determine which description the model prefers.'
  text_mode: 'Imagine dictionary elements representing horizontal and vertical strokes. A corner can use both,
    while a horizontal line mainly uses one. Actual learned elements need not correspond to named concepts
    like these.


    For a numerical example, use dictionary vectors [1, 0] and [0, 1]. Input [2, 0] can be reconstructed with
    coefficients [2, 0], so only the first element is active. Input [2, 3] uses both. Reconstruction and sparsity
    penalties determine which description the model prefers.'
  bridges: []
- id: sparse-coding-and-self-organizing-maps.s3
  title: Organize prototypes on a map
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sparse-coding-and-self-organizing-maps
  markdown: 'A **self-organizing map** arranges representative vectors, or **prototypes**, on a grid. For each
    input, it finds the closest prototype and moves both that winner and nearby map units toward the input.


    If a winning prototype is at 2 and the input is 6, a learning rate of 0.25 moves it to 2 + 0.25 × (6 −
    2) = 3. Neighboring prototypes move according to their neighborhood weights.


    The learning rate and neighborhood radius typically change during training. The map tries to preserve useful
    neighborhood relationships, but its layout can distort the original data.'
  text_mode: 'A **self-organizing map** arranges representative vectors, or **prototypes**, on a grid. For
    each input, it finds the closest prototype and moves both that winner and nearby map units toward the input.


    If a winning prototype is at 2 and the input is 6, a learning rate of 0.25 moves it to 2 + 0.25 × (6 −
    2) = 3. Neighboring prototypes move according to their neighborhood weights.


    The learning rate and neighborhood radius typically change during training. The map tries to preserve useful
    neighborhood relationships, but its layout can distort the original data.'
  bridges: []
- id: sparse-coding-and-self-organizing-maps.s4
  title: Compare what the visualization means
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sparse-coding-and-self-organizing-maps
  markdown: Sparse codes support reconstruction or downstream tasks; a self-organizing map provides an organized
    prototype layout. Neither automatically discovers the true causal categories of the world. Evaluate reconstruction,
    neighborhood preservation, stability, and task usefulness rather than interpreting a visually neat map
    as proof of structure.
  text_mode: Sparse codes support reconstruction or downstream tasks; a self-organizing map provides an organized
    prototype layout. Neither automatically discovers the true causal categories of the world. Evaluate reconstruction,
    neighborhood preservation, stability, and task usefulness rather than interpreting a visually neat map
    as proof of structure.
  bridges: []
