assessment_families:
- id: sparse-coding-and-self-organizing-maps.base
  objective_ref: objective.sparse-coding-and-self-organizing-maps
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace a small representation: trace the inputs, operation, and result before choosing.'
  remediation_scene: sparse-coding-and-self-organizing-maps.s2
  variants:
  - id: sparse-coding-and-self-organizing-maps.base.1
    prompt: What does sparse coding encourage?
    options:
    - id: b
      text: Every coefficient equally active
    - id: c
      text: Only orthogonal bases by definition
    - id: a
      text: Few active coefficients in a dictionary reconstruction
    answer: a
    feedback: Sparsity constrains representation use.
  - id: sparse-coding-and-self-organizing-maps.base.2
    prompt: Are coefficient inference and dictionary learning the same operation?
    options:
    - id: c
      text: Only if inputs are images
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: One fits a representation for an input; the other changes the basis.
- id: sparse-coding-and-self-organizing-maps.transfer
  objective_ref: objective.sparse-coding-and-self-organizing-maps
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Compare what the visualization means: trace the inputs, operation, and result before choosing.'
  remediation_scene: sparse-coding-and-self-organizing-maps.s4
  variants:
  - id: sparse-coding-and-self-organizing-maps.transfer.1
    prompt: Which SOM units move toward an input?
    options:
    - id: c
      text: Only a random output label
    - id: a
      text: The winner and selected map neighbors
    - id: b
      text: Every unit identically under all rules
    answer: a
    feedback: Neighborhood updates organize prototypes.
  - id: sparse-coding-and-self-organizing-maps.transfer.2
    prompt: Does a neat two-dimensional map prove true causal categories?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if colors form clusters
    answer: a
    feedback: Visualization can distort or reflect chosen representation assumptions.
