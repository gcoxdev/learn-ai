objectives:
  - id: objective.sparse-coding-and-self-organizing-maps
    version: 2-draft
    statement: Sparse coding reconstructs inputs with few active dictionary coefficients, while self-organizing maps update a winning prototype and its neighbors; their objectives and representation meanings differ.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
