scenes:
  - id: sparse-coding-and-self-organizing-maps.s1
    title: What is a visual-cortex cell looking for?
    type: explanation
    depth: intuition
    objective_refs:
      - objective.sparse-coding-and-self-organizing-maps
    markdown: |-
      In 1959 David Hubel and Torsten Wiesel found that many cells in the cat's primary visual cortex (V1) fire for a short edge at one particular angle, in one small patch of the visual field, and barely otherwise. The work shared a 1981 Nobel Prize. But *why* edges?

      In 1996 Bruno Olshausen and David Field proposed an answer. Cut thousands of small patches from photos of natural scenes. Ask a model to rebuild each patch as a weighted sum of building blocks, using as **few** blocks as possible per patch. After training, the blocks looked like what V1 cells respond to: small, oriented edges and bars.

      That method is **sparse coding**. The building blocks are **atoms** (columns $d_i$ of a **dictionary** $D$), and the weights for one patch form its **code** $a$. "Sparse" means most entries of $a$ are exactly zero. The dictionary may be **overcomplete**, with more atoms than the patch has pixels. That's unlike PCA from module 8, which keeps *fewer* directions than pixels and uses all of them for every input.

      :::mixup "A sparse code compresses the input into fewer numbers."
      An overcomplete code has *more* numbers than the input, not fewer. What's small is how many of them are active. Think of a large vocabulary: a rich dictionary lets you describe each scene in a few precise words.
      :::
    bridges: []
  - id: sparse-coding-and-self-organizing-maps.s2
    title: Many perfect codes, one sparse one
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.sparse-coding-and-self-organizing-maps
    markdown: |-
      Shrink the photo patches to 2 × 2 pixels, listed as (top-left, top-right, bottom-left, bottom-right). Give the dictionary six atoms, all the same length: top bar $(1,1,0,0)$, bottom bar $(0,0,1,1)$, left bar $(1,0,1,0)$, right bar $(0,1,0,1)$, and two diagonals $(1,0,0,1)$ and $(0,1,1,0)$. Six atoms for four pixels: overcomplete.

      The patch is a bright top edge, $x = (1, 1, 0, 0)$. Three codes rebuild it perfectly:

      | Code | Atoms used | Sum of absolute coefficients |
      | --- | --- | ---: |
      | A: 1 × top | 1 | 1 |
      | B: least squares, no penalty: 0.67 top, −0.33 bottom, 0.17 each for the rest | 6 | 1.67 |
      | C: 1 × left + 1 × right − 1 × bottom | 3 | 3 |

      Sparse coding chooses among them with a cost that adds a penalty on the code's size:

      $$E(a) = \tfrac{1}{2}\,\lVert x - D a \rVert^2 + \lambda \sum_i |a_i|$$

      With $\lambda = 0.1$, all three rebuild perfectly, so only the penalty differs: A costs 0.1, B costs 0.167, and C costs 0.3. Code A wins. The exact minimum actually shrinks A's coefficient a little, to 0.95, because a tiny reconstruction error ($\tfrac12 \times 2 \times 0.05^2 = 0.0025$) buys a larger drop in penalty ($0.1 \times 0.05 = 0.005$).

      :::predict The patch is now a bright corner, (1, 1, 1, 0). Which atoms turn on?
      No single atom fits, so the code needs several. Three work: top + left + the "/" diagonal gives $(2, 2, 2, 0)$, so half of each rebuilds the corner. The program in the next scene finds exactly those three, each shrunk from 0.5 to 0.475.
      :::
  - id: sparse-coding-and-self-organizing-maps.ista
    title: Find the code, then learn the atoms
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.sparse-coding-and-self-organizing-maps
    markdown: |-
      Finding one patch's code is a small optimization. A standard solver, **ISTA** (iterative shrinkage-thresholding), repeats two moves: take a gradient step that improves the fit, then pull every coefficient toward zero by a fixed amount, setting any that cross zero to exactly zero.

      ```python run
      import numpy as np

      # 2 x 2 patches, pixels in order (top-left, top-right, bottom-left, bottom-right)
      atoms = {"top": [1, 1, 0, 0], "bottom": [0, 0, 1, 1], "left": [1, 0, 1, 0],
               "right": [0, 1, 0, 1], "diag \\": [1, 0, 0, 1], "diag /": [0, 1, 1, 0]}
      D = np.array(list(atoms.values()), dtype=float).T     # one atom per column
      lam = 0.1                                             # sparsity penalty
      step = 1 / np.linalg.eigvalsh(D.T @ D).max()          # a safe step size

      def sparse_code(x, iters=500):                        # ISTA
          a = np.zeros(D.shape[1])
          for _ in range(iters):
              a = a + step * D.T @ (x - D @ a)              # move toward a better fit
              a = np.sign(a) * np.maximum(np.abs(a) - step * lam, 0)   # shrink; small ones hit 0
          return a

      for name, x in [("top edge", [1, 1, 0, 0]), ("corner", [1, 1, 1, 0])]:
          x = np.array(x, dtype=float)
          a = sparse_code(x)
          dense = np.linalg.pinv(D) @ x                     # least squares, no penalty
          active = {k: round(float(v), 3) for k, v in zip(atoms, a) if abs(v) > 1e-6}
          print(f"{name}: sparse code {active}, rebuilt {np.round(D @ a, 3)}")
          print(f"   atoms used: sparse {len(active)}, least squares {int((np.abs(dense) > 1e-6).sum())}")
      ```

      The edge uses one atom where least squares used all six. Set `lam = 0.5` and the edge's coefficient drops to 0.75: stronger sparsity costs accuracy.

      Learning the dictionary alternates with this. Code a batch of patches, then nudge each atom to shrink what's left over: $\Delta D = \eta\,(x - D a)\,a^\top$. That's a Hebbian-style product, as in this module's first lesson: the leftover error at each pixel times the atom's activity. Olshausen and Field used this loop on natural images; the edges emerged.

      :::papers Olshausen & Field (1996)
      They minimized, over codes $a$ for each image patch $x$ and over the dictionary $D$,

      $$E = \big\lVert x - D a\big\rVert^2 + \lambda \sum_i S(a_i)$$

      where $S$ is a penalty that grows with each coefficient's size. The absolute value, $S(a) = |a|$, is the version most used today. In our example $x$ is the 2 × 2 patch, $D$ has six columns, and $\lambda = 0.1$.
      :::
  - id: sparse-coding-and-self-organizing-maps.s3
    title: A map that shrinks its neighborhoods
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.sparse-coding-and-self-organizing-maps
    markdown: |-
      Hubel and Wiesel also found that neighboring V1 cells tend to prefer similar angles. Christoph von der Malsburg (1973) and Teuvo Kohonen (1982) showed that simple competitive rules can produce such orderly maps. Kohonen's **self-organizing map (SOM)**, from module 8's lesson on reading data maps, moves the best-matching prototype and its grid neighbors toward each input.

      That lesson used a fixed neighbor rate. In practice, a unit $d$ grid steps from the winner moves by $\alpha\, h(d)\,(x - w)$, where $h$ is a Gaussian:

      $$h(d) = e^{-d^2 / (2\sigma^2)}$$

      Here $\sigma$ is the neighborhood radius, and it **shrinks** during training. Take module 8's neighbor at 5, input 6, and $\alpha = 0.25$, one step from the winner:

      | Radius $\sigma$ | $h(1)$ | $h(2)$ | Neighbor moves to |
      | ---: | ---: | ---: | ---: |
      | 2 (early) | 0.882 | 0.607 | $5 + 0.25 \times 0.882 \times 1 = 5.22$ |
      | 0.5 (late) | 0.135 | 0.0003 | $5 + 0.25 \times 0.135 \times 1 = 5.03$ |

      Early on, big neighborhoods drag whole stretches of the map together, sorting it globally. Later, small neighborhoods let each unit fine-tune. The program trains a 10-unit, one-dimensional map on numbers between 0 and 1, from 20 random starts, with and without shrinking:

      ```python run
      import numpy as np

      def train_som(shrink, seed=0, steps=2000, units=10):
          rng = np.random.default_rng(seed)
          w = rng.random(units)                      # random starting prototypes in [0, 1]
          grid = np.arange(units)                    # each unit's position on the map
          for t in range(steps):
              frac = t / steps
              sigma = 3 * (0.1 / 3) ** frac if shrink else 0.3   # radius 3 -> 0.1, or fixed 0.3
              rate = 0.5 * (0.02 / 0.5) ** frac      # learning rate 0.5 -> 0.02
              x = rng.random()                       # one input between 0 and 1
              win = np.argmin(np.abs(w - x))         # best-matching unit
              h = np.exp(-(grid - win) ** 2 / (2 * sigma ** 2))  # neighborhood weights
              w += rate * h * (x - w)
          return w

      def kinks(w):                                  # places where the map reverses direction
          d = np.sign(np.diff(w))
          return int((d[1:] != d[:-1]).sum())

      for shrink in (True, False):
          label = "shrinking radius" if shrink else "fixed radius 0.3"
          print(f"{label}: {np.round(train_som(shrink), 2)}")
          print(f"   maps with kinks, out of 20 seeds: {sum(kinks(train_som(shrink, s)) > 0 for s in range(20))}")
      ```

      With shrinking, every run ends sorted, from 0.05 to 0.95. With a small fixed radius, all 20 runs end with kinks: stretches that run backward, locked in because no big neighborhood ever pulled them straight. Now change the fixed radius from 0.3 to 3: the map sorts, but the prototypes stay bunched between 0.21 and 0.73, because every update drags all the units together.
  - id: sparse-coding-and-self-organizing-maps.s4
    title: Where these ideas work today
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.sparse-coding-and-self-organizing-maps
    markdown: |-
      The two methods answer different questions:

      | | Sparse coding | Self-organizing map |
      | --- | --- | --- |
      | Each input becomes | A few active atoms out of many | One winning unit on a grid |
      | Trained to | Rebuild inputs cheaply | Keep similar inputs on nearby units |
      | Read the result as | Which parts make up this input? | Which region of the map is it in? |

      Sparse coding has had a striking second life. Language models appear to pack more concepts than they have neurons into each layer's activations. In 2023 researchers at Anthropic trained **sparse autoencoders**, a form of dictionary learning, on a one-layer transformer's activations. Many of the thousands of learned atoms each tracked one recognizable concept, such as Arabic script or DNA sequences. Module 28's lesson on mechanistic interpretability shows how scaled-up versions are used on large models.

      Self-organizing maps are now mostly an exploration tool, handy when you want a fixed grid of prototypes; for plain visualization, most people use t-SNE or UMAP. So to find the few concepts active inside a model's layer, use a sparse dictionary. To lay out a thousand weather stations on a grid where similar climates sit together, use a SOM.
  - id: sparse-coding-and-self-organizing-maps.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.sparse-coding-and-self-organizing-maps
    markdown: Sparsity costs, shrinkage steps, and neighborhood weights to compute, plus an audio dictionary, a language-model probe, and a map with a twist, test whether you can predict what each method learns.
    takeaway: |-
      Sparse coding rebuilds each input from a few atoms of a large dictionary, and on natural images the atoms become edge detectors. A self-organizing map pulls a winner and its neighbors toward each input, shrinking the neighborhood so the map sorts first and fine-tunes later.
  - id: sparse-coding-and-self-organizing-maps.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.sparse-coding-and-self-organizing-maps
    markdown: |-
      Sparse coding reconstructs an input from selected dictionary elements. A self-organizing map moves prototypes and their neighbors to organize similar inputs.
