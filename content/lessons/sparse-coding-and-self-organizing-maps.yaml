  - id: sparse-coding-and-self-organizing-maps.base.v2
    objective_ref: objective.sparse-coding-and-self-organizing-maps
    task: base
    response_type: single_choice
    points: 1
    hint: "For sparse coding, compare codes by reconstruction error plus λ times the sum of absolute coefficients. For a SOM, remember that the neighborhood radius starts large and shrinks."
    remediation_scene: sparse-coding-and-self-organizing-maps.s2
    variants:
      - id: sparse-coding-and-self-organizing-maps.base.v2.1
        prompt: Two codes rebuild a patch perfectly. Code P uses one atom with coefficient 1; code Q uses four atoms with coefficients 0.5 each. With λ = 0.1, which does sparse coding prefer?
        options:
          - id: b
            text: Q, since each of its coefficients is smaller than P's
          - id: a
            text: P, since its penalty is 0.1 while Q's is 0.2
          - id: c
            text: Either one, since both rebuild the patch perfectly
        answer: a
        feedback: The penalty adds up absolute coefficients, so P costs 0.1 × 1 = 0.1 and Q costs 0.1 × 2 = 0.2. Small individual coefficients don't help if there are many of them, and with equal reconstruction the penalty decides.
      - id: sparse-coding-and-self-organizing-maps.base.v2.2
        prompt: A sparse-coding dictionary for 8 × 8 image patches (64 pixels) has 256 atoms. What does sparsity limit?
        options:
          - id: a
            text: How many of the 256 coefficients are nonzero for each patch
          - id: c
            text: How many atoms the dictionary holds, keeping it under 64
          - id: b
            text: How many pixels of each patch the atoms are allowed to use
        answer: a
        feedback: The dictionary is deliberately overcomplete (256 > 64); sparsity means each patch uses only a few of those atoms. Atoms can cover any pixels, and on natural images they learn to be small, localized edges.
      - id: sparse-coding-and-self-organizing-maps.base.v2.3
        prompt: During ISTA, a coefficient is 0.03 after the gradient step, and the shrink amount is 0.05. What happens to it?
        options:
          - id: c
            text: It becomes −0.02, since 0.05 is subtracted from it
          - id: b
            text: It stays 0.03, since shrinking only affects large values
          - id: a
            text: It becomes exactly 0, since it would cross zero
        answer: a
        feedback: Soft thresholding pulls every coefficient toward zero by the shrink amount and stops at zero, so values smaller than 0.05 in size become exactly 0. That's how ISTA produces true zeros rather than small values.
      - id: sparse-coding-and-self-organizing-maps.base.v2.4
        prompt: A SOM is trained with a large neighborhood radius early and a small one late. What does the early phase mainly do?
        options:
          - id: a
            text: It sorts the map globally, dragging whole stretches of units together
          - id: b
            text: It fine-tunes each prototype to sit on its own cluster of inputs
          - id: c
            text: It picks the best-matching unit more accurately for each input
        answer: a
        feedback: Large neighborhoods move many units together, which puts the map in order. Fine-tuning happens later, when the radius is small. The best-matching unit is found the same way in both phases.
  - id: sparse-coding-and-self-organizing-maps.transfer.v2
    objective_ref: objective.sparse-coding-and-self-organizing-maps
    task: transfer
    response_type: single_choice
    points: 1
    hint: "Ask what each output means: a sparse code says which few parts make up this input; a SOM says which region of an ordered grid it falls in."
    remediation_scene: sparse-coding-and-self-organizing-maps.s4
    variants:
      - id: sparse-coding-and-self-organizing-maps.transfer.v2.1
        prompt: An audio researcher runs sparse coding on thousands of short snippets of natural sounds. What would you expect the learned atoms to resemble?
        options:
          - id: b
            text: Whole recordings, since each snippet should use exactly one atom
          - id: a
            text: Brief, localized wiggles at one pitch, the sound version of edges
          - id: c
            text: The average snippet, since atoms are the principal components
        answer: a
        feedback: Sparse coding finds small building blocks that combine into many inputs, so sound atoms become brief, pitch-tuned pieces, much as image atoms became short edges. Whole recordings are too specific to recur, and atoms aren't PCA directions.
      - id: sparse-coding-and-self-organizing-maps.transfer.v2.2
        prompt: A researcher wants to find which few concepts are active in a language model's layer when it reads a sentence. Which approach fits?
        options:
          - id: c
            text: A self-organizing map of the layer's activations
          - id: b
            text: PCA on the activations, keeping the top ten directions
          - id: a
            text: A sparse autoencoder trained on the activations
        answer: a
        feedback: A sparse autoencoder learns a large dictionary where each input activates a few atoms, which can be read as concepts. A SOM gives one grid location per input, and PCA gives a few dense directions that mix many concepts.
      - id: sparse-coding-and-self-organizing-maps.transfer.v2.3
        prompt: A SOM of customer habits, trained with a small fixed radius, shows two separate patches of "weekend shoppers" at opposite corners. What most likely happened?
        options:
          - id: a
            text: The map locked in a twist because no large neighborhood sorted it first
          - id: b
            text: The data contain two unrelated kinds of weekend shopper
          - id: c
            text: The best-matching unit was chosen incorrectly for those inputs
        answer: a
        feedback: Without an early large-radius phase, maps often keep kinks where one region of input space is split across the grid. Retrain with a shrinking radius before concluding that there are two groups.
      - id: sparse-coding-and-self-organizing-maps.transfer.v2.4
        prompt: A camera team learns an overcomplete dictionary on clean photos, then codes noisy photos sparsely and rebuilds them. Why does this reduce noise?
        options:
          - id: b
            text: The dictionary has more atoms than pixels, so it copies noise exactly
          - id: a
            text: Noise isn't built from a few atoms, so a sparse rebuild leaves it out
          - id: c
            text: The penalty adds random noise that cancels the camera's own noise
        answer: a
        feedback: Clean image structure is well described by a few learned atoms; random noise needs many, and the sparsity penalty makes that too expensive. Overcompleteness alone would let the code fit noise, which the penalty prevents.
      - id: sparse-coding-and-self-organizing-maps.transfer.v2.5
        prompt: A geologist wants to lay out 1,000 rock samples on a 20 × 20 grid so similar compositions sit side by side. Which method fits?
        options:
          - id: a
            text: A self-organizing map, whose units form an ordered grid
          - id: c
            text: Sparse coding, since each sample then uses few atoms
          - id: b
            text: Least squares on a dictionary with 400 atoms
        answer: a
        feedback: A SOM gives each sample a place on a fixed grid where neighbors resemble each other. Sparse codes describe what each sample is made of, but they don't arrange samples on a grid.
  - id: sparse-coding-and-self-organizing-maps.calculate
    objective_ref: objective.sparse-coding-and-self-organizing-maps
    task: base
    response_type: numeric
    points: 1
    hint: "Sparse cost: ½ × squared error + λ × sum of |coefficients|. Shrinking: move toward 0 by the shrink amount, stopping at 0. Neighborhood: h(d) = e^(−d²/(2σ²))."
    remediation_scene: sparse-coding-and-self-organizing-maps.s2
    absolute_tolerance: 0.01
    variants:
      - id: sparse-coding-and-self-organizing-maps.calculate.1
        prompt: A code with coefficients (1, −1, 1) rebuilds a patch perfectly. With λ = 0.1, what is its sparse-coding cost?
        answer: 0.3
        feedback: The reconstruction term is 0, and the penalty is 0.1 × (1 + 1 + 1) = 0.3.
      - id: sparse-coding-and-self-organizing-maps.calculate.2
        prompt: A code with a single coefficient 0.9 leaves a squared reconstruction error of 0.02. With λ = 0.1, what is the cost ½ × error + λ × Σ|a|?
        answer: 0.1
        feedback: ½ × 0.02 = 0.01, plus 0.1 × 0.9 = 0.09, gives 0.1.
      - id: sparse-coding-and-self-organizing-maps.calculate.3
        prompt: In ISTA, a coefficient is 0.7 after the gradient step and the shrink amount is 0.2. What is it after shrinking?
        answer: 0.5
        feedback: Pull it 0.2 toward zero, so 0.7 − 0.2 = 0.5. It doesn't cross zero, so it stays positive.
      - id: sparse-coding-and-self-organizing-maps.calculate.4
        prompt: A SOM uses h(d) = e^(−d²/(2σ²)) with radius σ = 2. What is the neighborhood weight for a unit d = 2 grid steps from the winner?
        answer: 0.607
        feedback: d²/(2σ²) = 4/8 = 0.5, and e^(−0.5) ≈ 0.607.
      - id: sparse-coding-and-self-organizing-maps.calculate.5
        prompt: A SOM unit one grid step from the winner has prototype 5 and neighborhood weight h = 0.882. The input is 6 and α = 0.25. Where does the prototype move?
        answer: 5.22
        feedback: 5 + 0.25 × 0.882 × (6 − 5) = 5 + 0.22 = 5.22.
