  id: sparse-coding-and-self-organizing-maps
  version: 0.4.0-draft
  title: Learn a dictionary or a neighborhood-organized representation
  state: draft
  summary: Ask a model to describe photos using as few building blocks as possible, and edge detectors like those in your visual cortex appear on their own. Then make a map that sorts itself.
