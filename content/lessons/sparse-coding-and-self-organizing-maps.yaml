schema_version: 0.2-draft
lesson:
  id: sparse-coding-and-self-organizing-maps
  version: 0.1.0-draft
  title: Learn a dictionary or a neighborhood-organized representation
  state: draft
  summary: Sparse coding reconstructs inputs with few active dictionary coefficients, while self-organizing maps
    update a winning prototype and its neighbors; their objectives and representation meanings differ.
  slot: M37.3
  category: learning
  minutes: 12
  sources:
  - title: Sparse Coding with an Overcomplete Basis Set
    url: https://doi.org/10.1016/S0042-6989(97)00169-7
  - title: Self-Organized Formation of Topologically Correct Feature Maps
    url: https://doi.org/10.1007/BF00337288
objectives:
- id: objective.sparse-coding-and-self-organizing-maps
  version: 1-draft
  statement: Sparse coding reconstructs inputs with few active dictionary coefficients, while self-organizing maps
    update a winning prototype and its neighbors; their objectives and representation meanings differ.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - sparse-coding-and-self-organizing-maps.base
  - sparse-coding-and-self-organizing-maps.transfer
  prerequisites:
  - anyOf:
    - objective.pca-and-factorization
  - anyOf:
    - objective.hebbian-and-local-learning
scenes:
- id: sparse-coding-and-self-organizing-maps.s1
  title: Reconstruct with a sparse dictionary
  type: explanation
  depth: intuition
  objective_refs:
  - objective.sparse-coding-and-self-organizing-maps
  markdown: Sparse coding represents an input as a weighted combination of learned basis elements while penalizing
    many active coefficients. Unlike ordinary PCA’s orthogonal low-dimensional basis, a dictionary can be overcomplete.
    Inferring coefficients for one input and learning the dictionary are separate optimization problems.
  text_mode: Sparse coding represents an input as a weighted combination of learned basis elements while penalizing
    many active coefficients. Unlike ordinary PCA’s orthogonal low-dimensional basis, a dictionary can be overcomplete.
    Inferring coefficients for one input and learning the dictionary are separate optimization problems.
  bridges: []
- id: sparse-coding-and-self-organizing-maps.s2
  title: Trace a small representation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sparse-coding-and-self-organizing-maps
  markdown: If dictionary elements are horizontal and vertical strokes, a simple corner can use both while a horizontal
    line mainly uses one. This is an intuition for selective activation, not a claim that learned atoms always match
    named concepts. Reconstruction and sparsity pressures determine the result.
  text_mode: If dictionary elements are horizontal and vertical strokes, a simple corner can use both while a horizontal
    line mainly uses one. This is an intuition for selective activation, not a claim that learned atoms always match
    named concepts. Reconstruction and sparsity pressures determine the result.
  bridges: []
- id: sparse-coding-and-self-organizing-maps.s3
  title: Organize prototypes on a map
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sparse-coding-and-self-organizing-maps
  markdown: A self-organizing map finds the prototype closest to an input and moves that winner and nearby map units
    toward it. The neighborhood radius and learning rate typically change over training. The map attempts to preserve
    useful neighborhood relationships, with distortions possible.
  text_mode: A self-organizing map finds the prototype closest to an input and moves that winner and nearby map
    units toward it. The neighborhood radius and learning rate typically change over training. The map attempts
    to preserve useful neighborhood relationships, with distortions possible.
  bridges: []
- id: sparse-coding-and-self-organizing-maps.s4
  title: Compare what the visualization means
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sparse-coding-and-self-organizing-maps
  markdown: Sparse codes support reconstruction or downstream tasks; a self-organizing map provides an organized
    prototype layout. Neither automatically discovers the true causal categories of the world. Evaluate reconstruction,
    neighborhood preservation, stability, and task usefulness rather than interpreting a visually neat map as proof
    of structure.
  text_mode: Sparse codes support reconstruction or downstream tasks; a self-organizing map provides an organized
    prototype layout. Neither automatically discovers the true causal categories of the world. Evaluate reconstruction,
    neighborhood preservation, stability, and task usefulness rather than interpreting a visually neat map as proof
    of structure.
  bridges: []
