lesson:
  id: compute-and-bandwidth
  version: 0.2.0-draft
  title: Why arithmetic counts do not tell the whole speed story
  state: draft
  summary: Compare time spent calculating with time spent moving data before deciding what would make a model
    faster.
  slot: M17.1
  category: learning
  sources:
  - title: Roofline model
    url: https://www.osti.gov/biblio/970070
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.compute-and-bandwidth
  version: 1-draft
  statement: Runtime depends on arithmetic throughput, memory traffic, communication, and scheduling; arithmetic
    intensity helps identify which resource limits an operation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - compute-and-bandwidth.base
  - compute-and-bandwidth.transfer
  prerequisites:
  - anyOf:
    - objective.processors-and-parallelism
  - anyOf:
    - objective.algorithm-cost
scenes:
- id: compute-and-bandwidth.s1
  title: Count work and movement
  type: explanation
  depth: intuition
  objective_refs:
  - objective.compute-and-bandwidth
  markdown: 'A matrix multiplication performs many multiply-add operations, while its inputs and outputs move
    through memory. Hardware has limits on both arithmetic throughput and bytes transferred per second. A fast
    arithmetic unit can sit idle while waiting for data or another device.


    **Throughput** is work completed per second; **bandwidth** is data moved per second. A **FLOP** counts
    a floating-point arithmetic operation under a specified convention. Think of a cook who can chop quickly
    but keeps waiting for ingredients: faster chopping alone will not fix the supply delay.'
  text_mode: 'A matrix multiplication performs many multiply-add operations, while its inputs and outputs move
    through memory. Hardware has limits on both arithmetic throughput and bytes transferred per second. A fast
    arithmetic unit can sit idle while waiting for data or another device.


    **Throughput** is work completed per second; **bandwidth** is data moved per second. A **FLOP** counts
    a floating-point arithmetic operation under a specified convention. Think of a cook who can chop quickly
    but keeps waiting for ingredients: faster chopping alone will not fix the supply delay.'
  bridges: []
- id: compute-and-bandwidth.s2
  title: Compare two lower bounds
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.compute-and-bandwidth
  markdown: 'Suppose an operation needs 100 billion FLOPs and transfers 20 billion bytes. At one trillion FLOPs
    per second, arithmetic takes at least 0.1 seconds; at 100 billion bytes per second, transfer takes at least
    0.2 seconds. Ideal overlap cannot beat the larger bound, before other overheads.


    Divide required work by work per second: 100 billion/1 trillion = 0.1 second. Divide bytes by bytes per
    second: 20 billion/100 billion = 0.2 second. If both could overlap perfectly, the operation would still
    need at least 0.2 second. If they happen sequentially, the two times add instead. These are lower bounds,
    not measurements of a real device.'
  text_mode: 'Suppose an operation needs 100 billion FLOPs and transfers 20 billion bytes. At one trillion
    FLOPs per second, arithmetic takes at least 0.1 seconds; at 100 billion bytes per second, transfer takes
    at least 0.2 seconds. Ideal overlap cannot beat the larger bound, before other overheads.


    Divide required work by work per second: 100 billion/1 trillion = 0.1 second. Divide bytes by bytes per
    second: 20 billion/100 billion = 0.2 second. If both could overlap perfectly, the operation would still
    need at least 0.2 second. If they happen sequentially, the two times add instead. These are lower bounds,
    not measurements of a real device.'
  bridges: []
- id: compute-and-bandwidth.s3
  title: Reuse raises arithmetic intensity
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.compute-and-bandwidth
  markdown: Arithmetic intensity is operations per transferred byte. Reusing weights across a batch or keeping
    tiles in fast local memory can increase it. Small decode batches often struggle to reuse weights enough;
    large prefill matrix operations can exploit more arithmetic parallelism. Actual bottlenecks depend on shapes
    and hardware.
  text_mode: Arithmetic intensity is operations per transferred byte. Reusing weights across a batch or keeping
    tiles in fast local memory can increase it. Small decode batches often struggle to reuse weights enough;
    large prefill matrix operations can exploit more arithmetic parallelism. Actual bottlenecks depend on shapes
    and hardware.
  bridges: []
- id: compute-and-bandwidth.s4
  title: Measure the critical path
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.compute-and-bandwidth
  markdown: 'Profile kernels, transfers, synchronization, and idle intervals under the intended workload. Peak
    advertised throughput assumes particular precision and operation shapes. An optimization that reduces FLOPs
    can still slow execution by increasing memory traffic or launching many tiny kernels.


    A **kernel** is a device routine performing an operation. The **critical path** is the dependency chain
    that determines when the complete result can finish. Timing just one fast matrix multiplication misses
    waiting, transfers and other required operations on that path.'
