schema_version: 0.2-draft
lesson:
  id: compute-and-bandwidth
  version: 0.4.0-draft
  title: Why arithmetic counts do not tell the whole speed story
  state: draft
  summary: On a GPU, pushing 64 tokens through a weight matrix takes about as long as pushing one. Learn to count bytes as well as FLOPs, and read the roofline.
  slot: M17.1
  category: learning
  sources:
    - title: "Roofline: An Insightful Visual Performance Model for Multicore Architectures (Williams, Waterman & Patterson, Communications of the ACM, 2009)"
      url: https://doi.org/10.1145/1498765.1498785
    - title: NVIDIA A100 Tensor Core GPU datasheet
      url: https://www.nvidia.com/content/dam/en-zz/Solutions/Data-Center/a100/pdf/nvidia-a100-datasheet-us-nvidia-1758950-r4-web.pdf
    - title: "PaLM: Scaling Language Modeling with Pathways (Chowdhery et al., 2022), which introduced model FLOPs utilization"
      url: https://arxiv.org/abs/2204.02311
    - title: "Llama 2: Open Foundation and Fine-Tuned Chat Models (Touvron et al., 2023)"
      url: https://arxiv.org/abs/2307.09288
objectives:
  - id: objective.compute-and-bandwidth
    version: 2-draft
    statement: Runtime depends on arithmetic throughput, memory traffic, communication, and scheduling; arithmetic intensity helps identify which resource limits an operation.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - compute-and-bandwidth.base.v2
      - compute-and-bandwidth.transfer.v2
      - compute-and-bandwidth.calculate
    prerequisites:
      - anyOf:
          - objective.processors-and-parallelism
      - anyOf:
          - objective.algorithm-cost
scenes:
  - id: compute-and-bandwidth.s1
    title: Sixty-four times the work in the same time
    type: explanation
    depth: intuition
    objective_refs:
      - objective.compute-and-bandwidth
    markdown: |-
      A team is training a 7-billion-parameter language model, the size of Llama 2 7B, on 256 NVIDIA A100 GPUs: 32 machines with 8 GPUs each. We'll follow them through this module, starting with a tiny benchmark.

      One layer of the model multiplies activations by a 4,096 × 4,096 weight matrix. Fed a single token's vector, the multiplication takes about 17 microseconds (µs). Fed 64 tokens at once, which is 64 times the arithmetic, it takes about 17 µs again. How can 64 times the work be free?

      The arithmetic was never the slow part. A **FLOP** is one floating-point addition or multiplication, and a GPU has two separate speed limits:

      | Limit | What it measures | A100 80 GB, bf16 |
      | --- | --- | --- |
      | Peak compute | FLOPs per second the tensor cores can do | about 312 trillion (312 TFLOP/s) |
      | Memory bandwidth | Bytes per second moved between main memory and the cores | about 2 trillion (2 TB/s) |

      The main memory is **HBM** (high-bandwidth memory): the 80 GB that holds weights and activations. The 4,096 × 4,096 matrix is 16.8 million bf16 numbers at 2 bytes each, 33.6 MB, and reading it from HBM takes about 17 µs whatever you do with it next. With one token, the cores finish their math in a tenth of a microsecond, then wait.
    diagram:
      caption: The path every number takes inside one GPU. Arithmetic happens only at the tensor cores; everything else is delivery.
      description: Weights and activations live in HBM, which feeds the small on-chip memory at about 2 TB/s. On-chip memory feeds the tensor cores, which compute at up to 312 TFLOP/s. Results flow back from the cores to on-chip memory and are written back to HBM. HBM also connects over the network to other GPUs, the subject of later lessons.
      nodes:
        - id: hbm
          label: HBM main memory
          note: 80 GB, about 2 TB/s
          col: 0
          row: 0
          tone: data
        - id: sram
          label: On-chip memory
          note: tiny, much faster
          col: 2
          row: 0
        - id: cores
          label: Tensor cores
          note: up to 312 TFLOP/s
          col: 4
          row: 0
          tone: accent
        - id: others
          label: Other GPUs
          note: via NVLink or network
          col: 0
          row: 2
          tone: muted
      edges:
        - from: hbm
          to: sram
          label: read, about 2 TB/s
        - from: sram
          to: cores
          label: operands
        - from: cores
          to: sram
          label: results
          bend: 1
        - from: sram
          to: hbm
          label: write back
          bend: 1
        - from: hbm
          to: others
          label: gradients, activations
          dashed: true
    bridges: []
  - id: compute-and-bandwidth.s2
    title: "Arithmetic intensity: FLOPs per byte moved"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.compute-and-bandwidth
    markdown: |-
      To see which limit applies, count both the work and the traffic of one operation. **Arithmetic intensity** is the FLOPs an operation performs divided by the bytes it moves to and from HBM.

      Multiplying an m × k matrix by a k × n matrix takes 2mkn FLOPs: each of the m × n outputs needs k multiplies and k adds. In bf16 every number is 2 bytes, and at best each matrix crosses HBM once.

      | Case | FLOPs | Bytes moved | Intensity |
      | --- | ---: | ---: | ---: |
      | 1 token × 4,096 × 4,096 weights | 2 × 4,096² ≈ 33.6 million | ≈ 33.6 MB (almost all weights) | ≈ 1 FLOP/byte |
      | 4,096 tokens × the same weights | 2 × 4,096³ ≈ 137 billion | 3 matrices × 33.6 MB ≈ 101 MB | ≈ 1,365 FLOP/byte |

      Now time each case both ways. The slower of the two sets the pace:

      - **1 token:** math takes 33.6 million ÷ 312 trillion ≈ 0.1 µs; memory takes 33.6 MB ÷ 2 TB/s ≈ 16.8 µs.
      - **4,096 tokens:** math takes 137 billion ÷ 312 trillion ≈ 440 µs; memory takes 101 MB ÷ 2 TB/s ≈ 50 µs.

      An operation is **memory-bound** (as in the accelerators lesson) when moving its bytes takes longer than its math, and **compute-bound** when the math takes longer. A matrix-vector product is memory-bound on any modern GPU: each weight is fetched, used once, and discarded. A large matrix multiply reuses each fetched weight thousands of times.

      :::predict The team feeds 64 tokens through the same weights. What's the intensity, and which limit applies?
      FLOPs: 2 × 64 × 4,096² ≈ 2.15 billion. Bytes: the 33.6 MB of weights plus two 0.5 MB activation matrices, about 34.6 MB. Intensity ≈ 62 FLOP/byte. Memory takes 17.3 µs and math 6.9 µs, so it's still memory-bound: that's why it matched the one-token time. When tokens are far fewer than the matrix size, intensity ≈ the token count, because each fetched weight is used once per token.
      :::
    bridges: []
  - id: compute-and-bandwidth.s3
    title: The roofline puts every operation on one chart
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.compute-and-bandwidth
    markdown: |-
      Generalize the two timings. If an operation has intensity $I$, memory can deliver enough bytes for $I \times 2$ TB/s worth of FLOPs, but the cores can never exceed 312 TFLOP/s. Whichever is smaller is the best speed you can hope for.

      :::papers The roofline model (Williams, Waterman & Patterson, 2009)
      $$P_{\text{attainable}} = \min\big(P_{\text{peak}},\; I \times B_{\text{mem}}\big)$$

      Here $P_{\text{peak}}$ = 312 TFLOP/s, $B_{\text{mem}}$ = 2 TB/s, and $I$ is FLOPs per byte. Plotted against $I$ on log axes, this is a sloped line (the bandwidth roof) meeting a flat line (the compute roof) at the **ridge point**, $I = P_{\text{peak}} / B_{\text{mem}} = 156$ FLOP/byte. Our 1-token multiply ($I \approx 1$) sits low on the slope at 2 TFLOP/s; the 64-token one ($I \approx 62$) reaches 124 TFLOP/s; the 4,096-token one ($I \approx 1{,}365$) sits on the flat roof at 312.
      :::

      Here is the calculator. Each row is the same 4,096 × 4,096 weight matrix fed a different number of tokens.

      ```python run
      PEAK = 312e12   # A100 bf16 dense tensor-core FLOP/s
      BW = 2.0e12     # A100 80GB HBM bytes/s (about 2 TB/s)
      BYTES = 2       # bf16

      def matmul(m, k, n):
          """(m x k) @ (k x n): FLOPs and bytes if each matrix crosses HBM once."""
          flops = 2 * m * k * n
          moved = BYTES * (m * k + k * n + m * n)
          return flops, moved

      print(f"ridge point: {PEAK / BW:.0f} FLOP/byte")
      for tokens in [1, 64, 4096]:           # rows of activations hitting one 4096x4096 weight
          flops, moved = matmul(tokens, 4096, 4096)
          intensity = flops / moved
          attainable = min(PEAK, intensity * BW)
          t_math, t_mem = flops / PEAK, moved / BW
          bound = "memory" if t_mem > t_math else "compute"
          print(f"{tokens:5d} tokens: {intensity:7.1f} FLOP/byte, "
                f"{attainable / 1e12:5.1f} TFLOP/s ({attainable / PEAK:5.1%} of peak), "
                f"{max(t_math, t_mem) * 1e6:7.1f} us, {bound}-bound")
      ```

      Add 169 to the token list: it's the smallest count that crosses the ridge. Then halve `BW` and watch the memory-bound rows slow down while the 4,096-token row doesn't budge.

      Elementwise operations sit even lower. Adding two bf16 tensors does 1 FLOP per 6 bytes (read two numbers, write one). That's why GPU libraries **fuse** chains of elementwise steps: one routine reads the data once, does every step, and writes once. The lesson on efficient attention kernels, at the end of this module, applies this trick to attention.
    bridges: []
  - id: compute-and-bandwidth.s4
    title: "Measure the whole step: model FLOPs utilization"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.compute-and-bandwidth
    markdown: |-
      From the pretraining module you know the rule of thumb: training costs about 6 FLOPs per parameter per token (the 6ND rule). For the 7B model that's 6 × 7 billion = 42 billion FLOPs per token.

      Suppose each GPU processes 3,000 tokens per second. Its useful work is 42 billion × 3,000 = 126 TFLOP/s, or 40% of the 312 peak. You met that ratio, useful model FLOPs per second divided by peak, in the lesson on pretraining budgets: it's the **model FLOPs utilization (MFU)**, and that lesson simply assumed 40%. Here's evidence it's realistic: Meta's Llama 2 report lists 184,320 A100 GPU-hours for the 7B model's 2 trillion tokens, about 3,000 tokens per GPU per second. At that rate the team's 256 GPUs need about 30 days.

      Where does the other 60% go? A training step ends only when its **critical path** finishes, meaning the longest chain of work in which each piece must wait for the one before. That chain includes memory-bound kernels (a **kernel** is one routine launched on the GPU), waiting for other GPUs to exchange gradients, idle pipeline stages, and recomputed activations. The rest of this module takes these on one at a time.

      :::mixup "The GPU utilization meter says 98%, so we're using 98% of the GPU."
      The common readout (for example, `nvidia-smi`) reports the fraction of time *some* kernel was running, not the fraction of FLOP/s used. A memory-bound kernel keeps that meter near 100% while the tensor cores sit mostly idle. MFU is the number that tells you how much arithmetic you're actually getting.
      :::

      When a kernel is slow, place it on the roofline first. Below the ridge, cut bytes: feed more tokens per weight read, fuse steps, or use smaller number formats. Above the ridge, only fewer FLOPs or faster cores help.
    bridges: []
  - id: compute-and-bandwidth.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.compute-and-bandwidth
    markdown: Roofline readings for several kernels, a new chip, a slow chain of elementwise ops, and a chatbot test whether you can tell which limit a workload hits.
    takeaway: |-
      Divide an operation's FLOPs by the bytes it moves to get its arithmetic intensity. Below the ridge point (about 156 FLOP/byte on an A100) memory bandwidth sets the speed; above it, compute does.
  - id: compute-and-bandwidth.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.compute-and-bandwidth
    markdown: |-
      Count both the calculations and the data that must move. Speed improves when an optimization addresses the resource that is actually limiting the operation.
