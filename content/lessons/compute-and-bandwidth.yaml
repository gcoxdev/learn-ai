assessment_families:
  - id: compute-and-bandwidth.base
    objective_ref: objective.compute-and-bandwidth
    task: base
    response_type: single_choice
    points: 1
    hint: 'Compare two lower bounds: trace the inputs, operation, and result before choosing.'
    remediation_scene: compute-and-bandwidth.s2
    variants:
      - id: compute-and-bandwidth.base.1
        prompt: What is arithmetic intensity?
        options:
          - id: a
            text: Operations per byte transferred
          - id: b
            text: Bytes per model name
          - id: c
            text: Only accelerator clock frequency
        answer: a
        feedback: It relates computation to data movement.
        retired: true
      - id: compute-and-bandwidth.base.2
        prompt: Compute needs 0.1 s and transfer 0.2 s. Ideal overlapped lower bound?
        options:
          - id: b
            text: 0.1 s
          - id: c
            text: 0 s
          - id: a
            text: 0.2 s
        answer: a
        feedback: The slower resource sets this simplified bound.
        retired: true
  - id: compute-and-bandwidth.transfer
    objective_ref: objective.compute-and-bandwidth
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Measure the critical path: trace the inputs, operation, and result before choosing.'
    remediation_scene: compute-and-bandwidth.s4
    variants:
      - id: compute-and-bandwidth.transfer.1
        prompt: Why can batching improve weight reuse?
        options:
          - id: b
            text: It eliminates all model parameters
          - id: c
            text: It removes every synchronization
          - id: a
            text: Several examples use the same loaded weights
        answer: a
        feedback: Reuse can amortize memory transfers over more arithmetic.
        retired: true
      - id: compute-and-bandwidth.transfer.2
        prompt: A FLOP-reducing change runs slower. Is that possible?
        options:
          - id: c
            text: Only with incorrect arithmetic
          - id: a
            text: Yes; memory traffic or overhead can dominate
          - id: b
            text: 'No'
        answer: a
        feedback: Runtime follows the actual critical path.
        retired: true
  - id: compute-and-bandwidth.base.v2
    objective_ref: objective.compute-and-bandwidth
    task: base
    response_type: single_choice
    points: 1
    hint: Work out FLOPs ÷ bytes moved and compare it with the ridge point (peak FLOP/s ÷ bandwidth). Below the ridge, bytes set the speed; above it, arithmetic does.
    remediation_scene: compute-and-bandwidth.s2
    variants:
      - id: compute-and-bandwidth.base.v2.1
        prompt: On an A100 (ridge point about 156 FLOP/byte), which of these bf16 operations is limited by memory bandwidth rather than arithmetic?
        options:
          - id: b
            text: Multiplying 4,096 tokens' activations by a 4,096 × 4,096 weight matrix
          - id: a
            text: Multiplying a single token's vector by a 4,096 × 4,096 weight matrix
          - id: c
            text: Multiplying two 8,192 × 8,192 matrices together in one kernel
        answer: a
        feedback: A matrix-vector product uses each fetched weight once, so its intensity is about 1 FLOP/byte, far below the ridge. The two large matrix products reuse every weight thousands of times and sit above the ridge.
      - id: compute-and-bandwidth.base.v2.2
        prompt: A kernel performs about 2 FLOPs per byte it moves on an A100. A new GPU doubles peak FLOP/s but keeps the same memory bandwidth. What happens to this kernel's speed?
        options:
          - id: c
            text: It roughly doubles, because peak compute doubled
          - id: b
            text: It halves, because faster cores wait longer for memory
          - id: a
            text: It stays about the same, because memory sets its speed
        answer: a
        feedback: At 2 FLOP/byte the kernel is deep in the memory-bound region, where attainable speed is intensity × bandwidth. Raising the compute roof doesn't move the bandwidth slope it sits on. Faster cores don't slow it down either; they just idle more.
      - id: compute-and-bandwidth.base.v2.3
        prompt: Why does pushing 64 tokens through a 4,096 × 4,096 weight matrix take barely longer than pushing one token?
        options:
          - id: a
            text: Reading the weights dominates the time, and one read serves all 64 tokens
          - id: b
            text: Tensor cores switch on only once at least 64 tokens are present
          - id: c
            text: The 64 tokens share most of their values, so there is less to compute
        answer: a
        feedback: Both cases must read the same 33.6 MB of weights, which takes about 17 µs. The extra math for 64 tokens (about 7 µs) hides under that read. Nothing is skipped; each token is fully computed.
      - id: compute-and-bandwidth.base.v2.4
        prompt: What does the ridge point on a GPU's roofline tell you?
        options:
          - id: c
            text: The peak FLOP/s that the chip reaches on typical real workloads
          - id: a
            text: The intensity at which an operation stops being memory-bound
          - id: b
            text: The data size above which a matrix no longer fits in fast memory
        answer: a
        feedback: The ridge is where the bandwidth slope meets the compute roof, at peak FLOP/s ÷ bandwidth (about 156 FLOP/byte on an A100). It's an intensity, not a speed or a size; real workloads usually run well below peak.
  - id: compute-and-bandwidth.transfer.v2
    objective_ref: objective.compute-and-bandwidth
    task: transfer
    response_type: single_choice
    points: 1
    hint: First decide which side of the ridge the workload is on. Then pick the change that attacks that limit, fewer bytes per FLOP or more FLOP/s.
    remediation_scene: compute-and-bandwidth.s4
    variants:
      - id: compute-and-bandwidth.transfer.v2.1
        prompt: A new accelerator offers 1,000 TFLOP/s and 4 TB/s. A kernel on it has an intensity of 100 FLOP/byte. What limits the kernel, and how fast can it run at best?
        options:
          - id: b
            text: Compute-bound, at up to 1,000 TFLOP/s
          - id: a
            text: Memory-bound, at up to 400 TFLOP/s
          - id: c
            text: Memory-bound, at up to 40 TFLOP/s
        answer: a
        feedback: The ridge is 1,000 ÷ 4 = 250 FLOP/byte, and 100 is below it, so the bound is 100 × 4 TB/s = 400 TFLOP/s. 40 comes from dividing instead of multiplying; the kernel would need 250 FLOP/byte to reach the compute roof.
      - id: compute-and-bandwidth.transfer.v2.2
        prompt: A profile shows a training step spends 20% of its time in three back-to-back elementwise kernels (bias add, GELU, dropout) that do almost no FLOPs. Which change is most likely to speed them up?
        options:
          - id: c
            text: Move to a GPU with twice the peak FLOP/s and the same memory
          - id: b
            text: Split each operation into smaller kernels so more run at once
          - id: a
            text: Fuse the three into one kernel that reads and writes the data once
        answer: a
        feedback: Elementwise kernels are memory-bound, so the fix is fewer bytes moved; fusion cuts three round trips through HBM to one. More FLOP/s doesn't help below the ridge, and more, smaller kernels would add launches and traffic.
      - id: compute-and-bandwidth.transfer.v2.3
        prompt: A team's dashboard shows 98% GPU utilization, yet their MFU is only 18%. What best explains the gap?
        options:
          - id: a
            text: Kernels are running nearly all the time, but many are memory-bound or waiting
          - id: b
            text: MFU is measured in fp32 while the GPU is really running bf16 kernels
          - id: c
            text: The utilization figure averages all 8 GPUs in the machine together
        answer: a
        feedback: The utilization meter counts time when any kernel is running, not FLOPs used. Memory-bound kernels and communication waits keep it high while useful arithmetic stays low. MFU is computed against the peak for the format actually used.
      - id: compute-and-bandwidth.transfer.v2.4
        prompt: A chatbot generates replies one user at a time, one token per step, and uses under 1% of its GPU's peak FLOP/s. Which change raises throughput the most?
        options:
          - id: b
            text: Buy a GPU with more FLOP/s but the same memory bandwidth
          - id: a
            text: Batch many users' requests so each weight read serves many tokens
          - id: c
            text: Give each user a separate GPU stream so they never share weights
        answer: a
        feedback: One token per step is a matrix-vector product with intensity near 1. Batching B users raises intensity roughly to B, so the same weight read does B times the useful work. More FLOP/s doesn't help a memory-bound kernel, and separate streams would read the weights separately for each user.
  - id: compute-and-bandwidth.calculate
    objective_ref: objective.compute-and-bandwidth
    task: base
    response_type: numeric
    points: 1
    hint: "Intensity = FLOPs ÷ bytes. Attainable speed = min(peak, intensity × bandwidth). Time is at least the larger of FLOPs ÷ peak and bytes ÷ bandwidth."
    remediation_scene: compute-and-bandwidth.s3
    absolute_tolerance: 0.5
    variants:
      - id: compute-and-bandwidth.calculate.1
        prompt: A kernel performs 60 billion FLOPs and moves 2 billion bytes to and from memory. What is its arithmetic intensity, in FLOP/byte?
        answer: 30
        feedback: 60 billion ÷ 2 billion = 30 FLOP/byte. On an A100 that is well below the ridge of 156, so it would be memory-bound.
      - id: compute-and-bandwidth.calculate.2
        prompt: On an A100 (312 TFLOP/s peak, 2 TB/s bandwidth), a kernel has an intensity of 40 FLOP/byte. What is its attainable speed under the roofline, in TFLOP/s?
        answer: 80
        feedback: 40 FLOP/byte × 2 TB/s = 80 TFLOP/s, which is less than 312, so the bandwidth roof applies.
      - id: compute-and-bandwidth.calculate.3
        prompt: A chip has 900 TFLOP/s of peak compute and 3 TB/s of memory bandwidth. Where is its ridge point, in FLOP/byte?
        answer: 300
        feedback: Ridge = peak ÷ bandwidth = 900 ÷ 3 = 300 FLOP/byte. Operations below 300 FLOP/byte are memory-bound on this chip.
      - id: compute-and-bandwidth.calculate.4
        prompt: On an A100 (312 TFLOP/s, 2 TB/s), a kernel performs 624 billion FLOPs and moves 1 GB. Assuming math and memory traffic overlap perfectly, what is its minimum run time, in milliseconds?
        answer: 2
        feedback: Math takes 624 billion ÷ 312 trillion = 2 ms; memory takes 1 GB ÷ 2 TB/s = 0.5 ms. With perfect overlap the slower one sets the time, 2 ms, so this kernel is compute-bound.
      - id: compute-and-bandwidth.calculate.5
        prompt: A 7-billion-parameter model needs about 6 × 7 billion FLOPs per training token. One GPU with a 312 TFLOP/s peak processes 2,600 tokens per second. What is its MFU, in percent?
        answer: 35
        feedback: 42 billion × 2,600 = 109.2 TFLOP/s of useful work, and 109.2 ÷ 312 = 0.35, so MFU is 35%.
      - id: compute-and-bandwidth.calculate.6
        prompt: A bf16 layer multiplies 16 tokens' activations (16 × 4,096) by a 4,096 × 4,096 weight matrix. Counting 2mkn FLOPs and 2 bytes for each number of all three matrices, what is its arithmetic intensity, in FLOP/byte (to one decimal place)?
        answer: 15.9
        feedback: FLOPs = 2 × 16 × 4,096² ≈ 537 million. Bytes = 2 × (16 × 4,096 + 4,096² + 16 × 4,096) ≈ 33.8 million. 537 ÷ 33.8 ≈ 15.9, close to the token count, as expected when tokens are far fewer than the matrix size.
