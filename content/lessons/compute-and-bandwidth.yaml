scenes:
- id: compute-and-bandwidth.s1
  title: Count work and movement
  type: explanation
  depth: intuition
  objective_refs:
  - objective.compute-and-bandwidth
  markdown: A matrix multiplication performs many multiply-add operations, while its inputs and outputs move through
    memory. Hardware has limits on both arithmetic throughput and bytes transferred per second. A fast arithmetic
    unit can sit idle while waiting for data or another device.
  text_mode: A matrix multiplication performs many multiply-add operations, while its inputs and outputs move through
    memory. Hardware has limits on both arithmetic throughput and bytes transferred per second. A fast arithmetic
    unit can sit idle while waiting for data or another device.
  bridges: []
- id: compute-and-bandwidth.s2
  title: Compare two lower bounds
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.compute-and-bandwidth
  markdown: Suppose an operation needs 100 billion FLOPs and transfers 20 billion bytes. At one trillion FLOPs per
    second, arithmetic takes at least 0.1 seconds; at 100 billion bytes per second, transfer takes at least 0.2
    seconds. Ideal overlap cannot beat the larger bound, before other overheads.
  text_mode: Suppose an operation needs 100 billion FLOPs and transfers 20 billion bytes. At one trillion FLOPs
    per second, arithmetic takes at least 0.1 seconds; at 100 billion bytes per second, transfer takes at least
    0.2 seconds. Ideal overlap cannot beat the larger bound, before other overheads.
  bridges: []
- id: compute-and-bandwidth.s3
  title: Reuse raises arithmetic intensity
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.compute-and-bandwidth
  markdown: Arithmetic intensity is operations per transferred byte. Reusing weights across a batch or keeping tiles
    in fast local memory can increase it. Small decode batches often struggle to reuse weights enough; large prefill
    matrix operations can exploit more arithmetic parallelism. Actual bottlenecks depend on shapes and hardware.
  text_mode: Arithmetic intensity is operations per transferred byte. Reusing weights across a batch or keeping
    tiles in fast local memory can increase it. Small decode batches often struggle to reuse weights enough; large
    prefill matrix operations can exploit more arithmetic parallelism. Actual bottlenecks depend on shapes and hardware.
  bridges: []
- id: compute-and-bandwidth.s4
  title: Measure the critical path
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.compute-and-bandwidth
  markdown: Profile kernels, transfers, synchronization, and idle intervals under the intended workload. Peak advertised
    throughput assumes particular precision and operation shapes. An optimization that reduces FLOPs can still slow
    execution by increasing memory traffic or launching many tiny kernels.
  text_mode: Profile kernels, transfers, synchronization, and idle intervals under the intended workload. Peak advertised
    throughput assumes particular precision and operation shapes. An optimization that reduces FLOPs can still slow
    execution by increasing memory traffic or launching many tiny kernels.
  bridges: []
