lesson:
  id: compute-and-bandwidth
  version: 0.1.0-draft
  title: Why arithmetic counts do not tell the whole speed story
  state: draft
  summary: Runtime depends on arithmetic throughput, memory traffic, communication, and scheduling; arithmetic intensity
    helps identify which resource limits an operation.
  slot: M17.1
  category: learning
  minutes: 12
  sources:
  - title: Roofline model
    url: https://www.osti.gov/biblio/970070
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.compute-and-bandwidth
  version: 1-draft
  statement: Runtime depends on arithmetic throughput, memory traffic, communication, and scheduling; arithmetic
    intensity helps identify which resource limits an operation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - compute-and-bandwidth.base
  - compute-and-bandwidth.transfer
  prerequisites:
  - anyOf:
