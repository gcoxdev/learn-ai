lesson:
  id: neural-ordinary-differential-equations
  version: 0.4.0-draft
  title: Learn a vector field and let a solver define continuous depth
  state: draft
  summary: A ResNet is secretly Euler's method with a step size of 1. Shrink the step to zero and you get a network with no layers at all, just a learned rule for change and a solver.
  slot: M37.7
  category: learning
  sources:
    - title: "Neural Ordinary Differential Equations (Chen, Rubanova, Bettencourt & Duvenaud, 2018)"
      url: https://arxiv.org/abs/1806.07366
    - title: "FFJORD: Free-form Continuous Dynamics for Scalable Reversible Generative Models (Grathwohl et al., 2019)"
      url: https://arxiv.org/abs/1810.01367
    - title: "Deep Residual Learning for Image Recognition (He, Zhang, Ren & Sun, 2015)"
      url: https://arxiv.org/abs/1512.03385
objectives:
  - id: objective.neural-ordinary-differential-equations
    version: 2-draft
    statement: Neural ODEs parameterize a state derivative and integrate it with a numerical solver; solver tolerance, evaluation count, and gradient method affect accuracy, memory, and training behavior.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - neural-ordinary-differential-equations.base.v2
      - neural-ordinary-differential-equations.transfer.v2
      - neural-ordinary-differential-equations.calculate
    prerequisites:
