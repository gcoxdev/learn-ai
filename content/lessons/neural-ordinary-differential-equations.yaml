  - anyOf:
    - objective.residuals-normalization-dropout
scenes:
- id: neural-ordinary-differential-equations.s1
  title: Move from residual steps to a field
  type: explanation
  depth: intuition
  objective_refs:
  - objective.neural-ordinary-differential-equations
  markdown: A residual block adds a learned change to its input. A neural ODE instead defines dh/dt = f(h,t,parameters)
    and obtains later state by solving the differential equation. This continuous-depth viewpoint still requires
    a discrete numerical algorithm to run on a computer.
  text_mode: A residual block adds a learned change to its input. A neural ODE instead defines dh/dt = f(h,t,parameters)
    and obtains later state by solving the differential equation. This continuous-depth viewpoint still requires
    a discrete numerical algorithm to run on a computer.
  bridges:
  - dynamics-and-noise
- id: neural-ordinary-differential-equations.s2
  title: Trace a simple Euler approximation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neural-ordinary-differential-equations
  markdown: 'For dh/dt = h, initial h = 1, and step size 0.1, one Euler step gives 1.1. A second gives 1.21.
    The exact solution follows an exponential, so numerical step size controls approximation error. A learned
    field adds its own modeling error.


    ODE means ordinary differential equation: a rule for how a state changes along one independent variable,
    here t. The state h starts at 1; dh/dt = h says its current rate of increase equals its current value.
    At t = 0.2 the exact value is exp(0.2), about 1.2214, compared with the two-step Euler estimate 1.21. The
    difference of about 0.0114 comes from numerical approximation in this example, even though the change rule
    itself is known exactly.'
  text_mode: 'For dh/dt = h, initial h = 1, and step size 0.1, one Euler step gives 1.1. A second gives 1.21.
    The exact solution follows an exponential, so numerical step size controls approximation error. A learned
    field adds its own modeling error.


    ODE means ordinary differential equation: a rule for how a state changes along one independent variable,
    here t. The state h starts at 1; dh/dt = h says its current rate of increase equals its current value.
    At t = 0.2 the exact value is exp(0.2), about 1.2214, compared with the two-step Euler estimate 1.21. The
    difference of about 0.0114 comes from numerical approximation in this example, even though the change rule
    itself is known exactly.'
  bridges:
  - dynamics-and-noise
  - derivatives
- id: neural-ordinary-differential-equations.s3
  title: Differentiate through the solution
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neural-ordinary-differential-equations
  markdown: Training can differentiate a discretized solver computation or use sensitivity/adjoint approaches.
    Memory and recomputation tradeoffs depend on the method. Reversing a numerically integrated trajectory
    can be unstable or inaccurate; the continuous adjoint ideal does not remove every practical numerical issue.
  text_mode: Training can differentiate a discretized solver computation or use sensitivity/adjoint approaches.
    Memory and recomputation tradeoffs depend on the method. Reversing a numerically integrated trajectory
    can be unstable or inaccurate; the continuous adjoint ideal does not remove every practical numerical issue.
  bridges:
  - chain-rule
- id: neural-ordinary-differential-equations.s4
  title: Measure adaptive computation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neural-ordinary-differential-equations
  markdown: A solver may use more function evaluations for difficult or stiff dynamics. Report tolerance, solver,
    evaluation count, runtime, and task quality. Continuous depth does not mean unlimited computation at zero
    cost, and changing tolerances can alter both predictions and training gradients.
  text_mode: A solver may use more function evaluations for difficult or stiff dynamics. Report tolerance,
    solver, evaluation count, runtime, and task quality. Continuous depth does not mean unlimited computation
    at zero cost, and changing tolerances can alter both predictions and training gradients.
  bridges: []
