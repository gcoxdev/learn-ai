assessment_families:
  - id: neural-ordinary-differential-equations.base
    objective_ref: objective.neural-ordinary-differential-equations
    task: base
    response_type: single_choice
    points: 1
    hint: 'Trace a simple Euler approximation: trace the inputs, operation, and result before choosing.'
    remediation_scene: neural-ordinary-differential-equations.s2
    variants:
      - id: neural-ordinary-differential-equations.base.1
        prompt: Euler step for dh/dt=h, h=1, step 0.1 gives what?
        options:
          - id: b
            text: '2'
          - id: c
            text: '0.1'
          - id: a
            text: '1.1'
        answer: a
        feedback: Add step size times the derivative.
        retired: true
      - id: neural-ordinary-differential-equations.base.2
        prompt: Does a continuous-depth model run without numerical discretization?
        options:
          - id: c
            text: Only if the network is small
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: A computer uses a concrete solver.
        retired: true
  - id: neural-ordinary-differential-equations.transfer
    objective_ref: objective.neural-ordinary-differential-equations
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Measure adaptive computation: trace the inputs, operation, and result before choosing.'
    remediation_scene: neural-ordinary-differential-equations.s4
    variants:
      - id: neural-ordinary-differential-equations.transfer.1
        prompt: What can tighter solver tolerances change?
        options:
          - id: c
            text: Nothing in execution
          - id: a
            text: Accuracy, function evaluations, runtime, and gradients
          - id: b
            text: Only the model name
        answer: a
        feedback: Numerical settings affect the solution approximation.
        retired: true
      - id: neural-ordinary-differential-equations.transfer.2
        prompt: Does an adjoint method eliminate all numerical or memory tradeoffs?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only for learned dynamics
        answer: a
        feedback: Practical sensitivity calculations have assumptions and costs.
        retired: true
  - id: neural-ordinary-differential-equations.base.v2
    objective_ref: objective.neural-ordinary-differential-equations
    task: base
    response_type: single_choice
    points: 1
    hint: "Match each piece: a residual block is one Euler step of size 1; Euler's error scales with Δt and RK4's with Δt⁴; cost is counted in evaluations of f, not in steps."
    remediation_scene: neural-ordinary-differential-equations.s2
    variants:
      - id: neural-ordinary-differential-equations.base.v2.1
        prompt: A residual block computes h + f(h). Which numerical method does a stack of such blocks match?
        options:
          - id: b
            text: RK4, since each block samples the slope several times
          - id: a
            text: Euler's method with a step size of 1 per block
          - id: c
            text: An adaptive solver, since each block has its own weights
        answer: a
        feedback: h + 1 × f(h) is exactly an Euler step with Δt = 1. Each block evaluates f once, and the number of blocks is fixed rather than chosen by an error estimate.
      - id: neural-ordinary-differential-equations.base.v2.2
        prompt: Going from 20 to 40 steps, Euler's error on an ODE falls from 0.065 to about 0.033. Roughly what happens to RK4's error over the same change?
        options:
          - id: c
            text: It halves too, since both solvers use the same steps
          - id: b
            text: It falls by a factor of 4, since RK4 uses 4 slopes
          - id: a
            text: It falls by a factor of about 16, since RK4 is fourth order
        answer: a
        feedback: A fourth-order method's error scales with Δt⁴, so halving the step divides it by 2⁴ = 16. Using four slopes per step is what achieves that order; the factor isn't 4.
      - id: neural-ordinary-differential-equations.base.v2.3
        prompt: A neural ODE uses an adaptive solver. During training, its forward passes get slower and slower. What is the most likely reason?
        options:
          - id: a
            text: The learned dynamics grew more complex, so the solver needs more evaluations
          - id: b
            text: Training added new layers to the network, making each evaluation slower
          - id: c
            text: The adjoint method stores more states as training goes on
        answer: a
        feedback: An adaptive solver shrinks its steps when f changes quickly, so NFE rises as the learned field gets twistier. The network f itself doesn't grow, and the adjoint's memory doesn't grow with training.
      - id: neural-ordinary-differential-equations.base.v2.4
        prompt: What does the adjoint method trade to train a neural ODE with constant memory?
        options:
          - id: b
            text: It skips the gradient for θ and updates the initial state instead
          - id: a
            text: It solves a second ODE backward, recomputing states instead of storing them
          - id: c
            text: It switches to Euler steps, since those can be reversed exactly
        answer: a
        feedback: The adjoint and the state are integrated backward together, so no forward states need saving. That second solve costs time, and it still gives the full gradient for θ.
  - id: neural-ordinary-differential-equations.transfer.v2
    objective_ref: objective.neural-ordinary-differential-equations
    task: transfer
    response_type: single_choice
    points: 1
    hint: "Ask what the setting needs: arbitrary time points (an ODE integrates to any t), low memory (the adjoint), or accuracy per evaluation (higher-order or adaptive solvers)."
    remediation_scene: neural-ordinary-differential-equations.s4
    variants:
      - id: neural-ordinary-differential-equations.transfer.v2.1
        prompt: A hospital's lab results arrive at irregular times, sometimes 2 hours apart and sometimes 30. Why might a neural ODE model suit this data?
        options:
          - id: a
            text: It can integrate the state forward to whatever time the next result arrives
          - id: b
            text: It needs no training data, since the solver supplies the dynamics
          - id: c
            text: It forces results into equal time steps, which removes the gaps
        answer: a
        feedback: An ODE solver can stop at any time point, so uneven gaps are natural. An RNN expects evenly spaced steps; forcing the data onto a grid means inventing or discarding values. The dynamics are still learned from data.
      - id: neural-ordinary-differential-equations.transfer.v2.2
        prompt: Training a neural ODE by backpropagating through a solver runs out of GPU memory, because the solver takes thousands of steps. What change targets this?
        options:
          - id: c
            text: Switch from RK4 to Euler, since Euler steps are cheaper
          - id: b
            text: Loosen the tolerance until the solver takes a single step
          - id: a
            text: Compute gradients with the adjoint method instead
        answer: a
        feedback: The adjoint method keeps memory constant regardless of step count. Switching to Euler usually needs more steps for the same accuracy, and one huge step would wreck the solution.
      - id: neural-ordinary-differential-equations.transfer.v2.3
        prompt: A team can afford 40 evaluations of f per forward pass. Which solver setup should give the most accurate result on smooth dynamics?
        options:
          - id: b
            text: 40 Euler steps, since more steps means a finer path
          - id: a
            text: 10 RK4 steps, since its error shrinks much faster with step size
          - id: c
            text: 1 Euler step of size T, repeated 40 times to average the result
        answer: a
        feedback: At equal cost, 10 RK4 steps beat 40 Euler steps by orders of magnitude on smooth problems (in the lesson, 0.000002 against 0.033). Repeating an identical step gives an identical answer.
      - id: neural-ordinary-differential-equations.transfer.v2.4
        prompt: A one-dimensional neural ODE fails to learn a map that sends 1 to −1 and −1 to 1. What is the likely reason?
        options:
          - id: a
            text: In one dimension, ODE paths can't cross, so the order can't flip
          - id: b
            text: The solver's tolerance is too loose to reach the targets
          - id: c
            text: The adjoint method can't handle negative numbers
        answer: a
        feedback: Two trajectories of the same ODE can't pass through the same point at the same time, so in 1-D the points can't swap order. Adding extra dimensions to the state lets paths go around each other.
  - id: neural-ordinary-differential-equations.calculate
    objective_ref: objective.neural-ordinary-differential-equations
    task: base
    response_type: numeric
    points: 1
    hint: "One Euler step: h_next = h + Δt × f(h). Do the steps one at a time, using the new h each time."
    remediation_scene: neural-ordinary-differential-equations.s2
    absolute_tolerance: 0.001
    variants:
      - id: neural-ordinary-differential-equations.calculate.1
        prompt: For dh/dt = h, starting at h = 1, take one Euler step with Δt = 0.2. What is h?
        answer: 1.2
        feedback: h = 1 + 0.2 × 1 = 1.2.
      - id: neural-ordinary-differential-equations.calculate.2
        prompt: For dh/dt = h, starting at h = 1, take two Euler steps with Δt = 0.2. What is h?
        answer: 1.44
        feedback: 1 → 1.2 → 1.2 + 0.2 × 1.2 = 1.44. The exact value, e^0.4, is about 1.492.
      - id: neural-ordinary-differential-equations.calculate.3
        prompt: For dh/dt = −2h, starting at h = 3, take one Euler step with Δt = 0.1. What is h?
        answer: 2.4
        feedback: f(3) = −6, so h = 3 + 0.1 × (−6) = 2.4.
      - id: neural-ordinary-differential-equations.calculate.4
        prompt: A residual block computes h + f(h) with f(h) = 0.5h − 1. Starting at h = 4, what does it output?
        answer: 5
        feedback: f(4) = 2 − 1 = 1, so the block outputs 4 + 1 = 5. That's one Euler step with Δt = 1.
      - id: neural-ordinary-differential-equations.calculate.5
        prompt: For dh/dt = h + t, starting at h = 1 when t = 0, take one Euler step with Δt = 0.5, then a second. What is h after both?
        answer: 2.5
        feedback: Step 1 uses f = 1 + 0 = 1, so h = 1.5 at t = 0.5. Step 2 uses f = 1.5 + 0.5 = 2, so h = 1.5 + 0.5 × 2 = 2.5.
