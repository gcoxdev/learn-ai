- id: neural-ordinary-differential-equations.base
  objective_ref: objective.neural-ordinary-differential-equations
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace a simple Euler approximation: trace the inputs, operation, and result before choosing.'
  remediation_scene: neural-ordinary-differential-equations.s2
  variants:
  - id: neural-ordinary-differential-equations.base.1
    prompt: Euler step for dh/dt=h, h=1, step 0.1 gives what?
    options:
    - id: b
      text: '2'
    - id: c
      text: '0.1'
    - id: a
      text: '1.1'
    answer: a
    feedback: Add step size times the derivative.
  - id: neural-ordinary-differential-equations.base.2
    prompt: Does a continuous-depth model run without numerical discretization?
    options:
    - id: c
      text: Only if the network is small
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: A computer uses a concrete solver.
- id: neural-ordinary-differential-equations.transfer
