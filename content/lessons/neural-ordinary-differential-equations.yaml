      - anyOf:
          - objective.residuals-normalization-dropout
scenes:
  - id: neural-ordinary-differential-equations.s1
    title: A ResNet is Euler's method in disguise
    type: explanation
    depth: intuition
    objective_refs:
      - objective.neural-ordinary-differential-equations
    markdown: |-
      Every block of a residual network, from the lesson on helping learning signals travel, computes

      $$h_{k+1} = h_k + f(h_k;\,\theta_k)$$

      Now look at **Euler's method** for an **ordinary differential equation (ODE)**, a rule $dh/dt = f(h, t)$ for how a state changes: $h(t + \Delta t) \approx h(t) + \Delta t\, f(h(t), t)$. Set $\Delta t = 1$ and they're the same formula. A ResNet is Euler's method with one step per block.

      Try it with a toy block that adds 10% each time, $f(h) = 0.1\,h$. Start at $h = 1$; ten blocks give $1.1^{10} = 2.594$. That's also exactly ten Euler steps of size 0.1 for the ODE $dh/dt = h$, whose true answer at $t = 1$ is $e = 2.718$.

      In 2018 Ricky Chen, Yulia Rubanova, Jesse Bettencourt, and David Duvenaud took the idea literally. A **neural ODE** makes the rate of change itself a neural network,

      $$\frac{dh}{dt} = f(h, t;\,\theta)$$

      and computes the output by handing $f$ to an ODE solver, which follows it from $h(0)$, the input, to $h(T)$. There are no layers to count. How many times $f$ gets evaluated, the network's effective depth, is up to the solver. Their paper won a best paper award at NeurIPS 2018.
    bridges:
      - residuals-normalization-dropout
  - id: neural-ordinary-differential-equations.s2
    title: "Euler versus RK4: same budget, different accuracy"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neural-ordinary-differential-equations
    markdown: |-
      As module 22's flow-matching lesson showed, Euler's method is **first order**: halve the step, halve the error. Better solvers look at the slope several times per step. The classic **fourth-order Runge–Kutta method (RK4)** samples it four times:

      $$k_1 = f(h),\ \ k_2 = f\!\big(h + \tfrac{\Delta t}{2}k_1\big),\ \ k_3 = f\!\big(h + \tfrac{\Delta t}{2}k_2\big),\ \ k_4 = f(h + \Delta t\,k_3)$$
      $$h_\text{next} = h + \tfrac{\Delta t}{6}\,(k_1 + 2k_2 + 2k_3 + k_4)$$

      One step of size 0.1 on $dh/dt = h$ from $h = 1$: $k_1 = 1$, $k_2 = 1.05$, $k_3 = 1.0525$, $k_4 = 1.10525$, so $h_\text{next} = 1 + \frac{0.1}{6} \times 6.31025 = 1.1051708$. The exact value is $e^{0.1} = 1.1051709$. Euler's single step gives 1.1, off by 0.005.

      ```python run
      import math

      def f(t, h):                     # the known ODE dh/dt = h, so h(t) = e^t
          return h

      def euler_step(t, h, dt):
          return h + dt * f(t, h)      # 1 evaluation of f per step

      def rk4_step(t, h, dt):          # 4 evaluations of f per step
          k1 = f(t, h)
          k2 = f(t + dt / 2, h + dt / 2 * k1)
          k3 = f(t + dt / 2, h + dt / 2 * k2)
          k4 = f(t + dt, h + dt * k3)
          return h + dt / 6 * (k1 + 2 * k2 + 2 * k3 + k4)

      def solve(step, n):              # integrate from t = 0 to t = 1 in n equal steps
          h, dt = 1.0, 1.0 / n
          for i in range(n):
              h = step(i * dt, h, dt)
          return h

      exact = math.e
      print(" steps   Euler error   RK4 error    (f evaluations: Euler n, RK4 4n)")
      for n in [10, 20, 40, 80]:
          print(f"{n:6d}   {abs(solve(euler_step, n) - exact):.2e}     {abs(solve(rk4_step, n) - exact):.2e}")
      ```

      :::predict Doubling the steps halves Euler's error. What does it do to RK4's?
      It divides it by about 16, since $2^4 = 16$: from $2.08 \times 10^{-6}$ at 10 steps to $1.36 \times 10^{-7}$ at 20. Compare at equal cost: 40 Euler steps (40 evaluations) miss by 0.0332, while 10 RK4 steps (also 40 evaluations) miss by 0.000002, about 16,000 times less.
      :::

      Change `f` to return `-2 * h` and `exact` to `math.exp(-2)`, then rerun: RK4's advantage holds.
    bridges:
      - dynamics-and-noise
  - id: neural-ordinary-differential-equations.s4
    title: Let the solver choose the depth
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neural-ordinary-differential-equations
    markdown: |-
      Neural ODE libraries usually use an **adaptive solver**, such as the Dormand–Prince method. Each step, it estimates its own error by comparing two answers of different accuracy. If the error exceeds a **tolerance** you set, it retries with a smaller step; if the error is tiny, it takes a bigger one next time.

      So the cost of one forward pass is the **number of function evaluations (NFE)**, and it isn't fixed. Smooth dynamics need few evaluations; twisty ones need many. Chen and colleagues saw NFE climb during training as the learned $f$ grew more complicated. That gives you two dials a ResNet doesn't have: tighten the tolerance for accuracy, or loosen it for speed, without retraining.

      :::mixup "Continuous depth means infinitely many layers, so a neural ODE is infinitely expressive."
      The solver still runs a finite number of evaluations of one network $f$, with a single set of weights shared across all of time. In one dimension, ODE trajectories can't even cross each other, so a neural ODE can't learn a map that swaps the order of two inputs, such as $h \mapsto -h$. The usual fix is to add extra dimensions to the state.
      :::

      This is where neural ODEs earn their keep. **Irregularly sampled time series**, such as a patient's lab results taken at random hours, are awkward for an RNN that expects evenly spaced steps. A neural ODE can simply integrate to whatever time the next measurement arrives. Rubanova, Chen, and Duvenaud's latent ODE (2019) was built for exactly that.
  - id: neural-ordinary-differential-equations.s3
    title: "The adjoint: gradients by running time backward"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neural-ordinary-differential-equations
    markdown: |-
      To train, you need $dL/d\theta$. The direct way is to backpropagate through every solver step, as in the automatic differentiation lesson. That works, but it stores every intermediate state, so memory grows with the number of evaluations.

      Chen and colleagues popularized the **adjoint method**, borrowed from optimal control. Define the adjoint $a(t) = \partial L / \partial h(t)$: how much the loss would change if you nudged the state at time $t$. It obeys its own ODE, which you solve *backward* from $t = T$ to 0, recomputing $h(t)$ backward alongside it instead of storing it:

      $$\frac{da}{dt} = -\,a\,\frac{\partial f}{\partial h}, \qquad \frac{dL}{d\theta} = \int_0^T a(t)\,\frac{\partial f}{\partial \theta}\,dt$$

      Check it on a case with an exact answer: $dh/dt = \theta h$, $h(0) = 1$, and $L = h(T)$. Then $h(t) = e^{\theta t}$ and $L = e^{\theta T}$, so directly $dL/d\theta = T e^{\theta T}$. Via the adjoint: $a(T) = 1$ and $da/dt = -\theta a$, so $a(t) = e^{\theta (T - t)}$. With $\partial f / \partial \theta = h$, the integrand is $a(t)\,h(t) = e^{\theta T}$, the same at every moment, and the integral is $T e^{\theta T}$. With $\theta = 0.5$ and $T = 1$, both give $1.6487$.

      The payoff is memory that stays constant however many steps the solver takes. The cost is a second solve, and for dynamics that are hard to run backward, the recomputed $h(t)$ can drift from the forward one. When that happens, fall back to backpropagating through the solver, or save a few checkpoints along the way.
    bridges:
      - automatic-differentiation
  - id: neural-ordinary-differential-equations.s5
    title: "Continuous normalizing flows: density that changes smoothly"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.neural-ordinary-differential-equations
    markdown: |-
      Module 22's lesson on normalizing flows stretched a bell curve and watched its height drop by the stretch factor. A neural ODE is a stretch that happens continuously, and the density follows a simple rule, the **instantaneous change of variables**:

      $$\frac{d \log p(h(t))}{dt} = -\operatorname{tr}\!\left(\frac{\partial f}{\partial h}\right)$$

      Here $\operatorname{tr}$ is the trace, the sum of the diagonal entries of $f$'s derivative matrix. In one dimension with $f(h) = a\,h$, the trace is just $a$, so $\log p$ falls at rate $a$. Run for time $T = 1$ with $a = \ln 2 \approx 0.693$: every point moves to twice its distance from 0, and the density is halved, exactly as the flow lesson's stretch by 2 required.

      A generative model built this way is a **continuous normalizing flow (CNF)**. Ordinary flows need special layers whose determinant is cheap; a CNF needs only a trace. FFJORD (Grathwohl and colleagues, 2019) made that trace cheap for big networks with a random estimate. Training a CNF by solving the ODE at every step is still slow. Flow matching, from module 22, trains the same kind of vector field by plain regression, with no solving during training. Stable Diffusion 3 was trained with a variant of it called rectified flow, and at generation time it's still an ODE solver following a learned field.
    bridges:
      - flows-and-energy-models
  - id: neural-ordinary-differential-equations.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.neural-ordinary-differential-equations
    markdown: Euler and RK4 steps to compute, plus a hospital's irregular lab readings, a memory-starved training run, and a solver budget, test whether you can run and train a learned ODE.
    takeaway: |-
      A neural ODE learns dh/dt = f(h, t; θ), and a solver follows it; a ResNet is the special case of Euler steps of size 1. Higher-order and adaptive solvers buy accuracy per evaluation, and the adjoint method trains with constant memory by solving backward in time.
  - id: neural-ordinary-differential-equations.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.neural-ordinary-differential-equations
    markdown: |-
      A neural ODE learns a rule for continuous change, and a numerical solver follows it. Solver accuracy, evaluation count, and gradient method affect the resulting model.
