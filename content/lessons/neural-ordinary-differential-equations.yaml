  title: Learn a vector field and let a solver define continuous depth
  state: draft
  summary: Learn a rule for continuous change and follow it with a numerical solver.
  slot: M37.7
  category: learning
  sources:
  - title: Neural Ordinary Differential Equations
    url: https://arxiv.org/abs/1806.07366
objectives:
- id: objective.neural-ordinary-differential-equations
  version: 1-draft
  statement: Neural ODEs parameterize a state derivative and integrate it with a numerical solver; solver tolerance,
    evaluation count, and gradient method affect accuracy, memory, and training behavior.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - neural-ordinary-differential-equations.base
  - neural-ordinary-differential-equations.transfer
  prerequisites:
