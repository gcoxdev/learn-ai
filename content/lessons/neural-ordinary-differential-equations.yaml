scenes:
- id: neural-ordinary-differential-equations.s1
  title: Move from residual steps to a field
  type: explanation
  depth: intuition
  objective_refs:
  - objective.neural-ordinary-differential-equations
  markdown: 'An **ordinary differential equation**, or **ODE**, describes how a state changes along one independent
    variable, here t. A neural ODE uses a learned function to describe the rate of change of state h:


    dh/dt = f(h, t, parameters).


    A residual block adds a learned change in one discrete step. A neural ODE instead asks a numerical solver
    to follow this learned rate to a later state. The resulting “continuous depth” still runs through finite
    numerical computations on a computer.'
  text_mode: 'An **ordinary differential equation**, or **ODE**, describes how a state changes along one independent
    variable, here t. A neural ODE uses a learned function to describe the rate of change of state h:


    dh/dt = f(h, t, parameters).


    A residual block adds a learned change in one discrete step. A neural ODE instead asks a numerical solver
    to follow this learned rate to a later state. The resulting “continuous depth” still runs through finite
    numerical computations on a computer.'
  bridges:
  - dynamics-and-noise
- id: neural-ordinary-differential-equations.s2
  title: Trace a simple Euler approximation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neural-ordinary-differential-equations
  markdown: 'Take a known change rule, dh/dt = h, starting from h = 1. Its current rate of increase equals
    its current value.


    With step size 0.1, an **Euler step** gives 1 + 0.1 × 1 = 1.1. The next gives 1.1 + 0.1 × 1.1 = 1.21.


    The exact solution at t = 0.2 is exp(0.2), about 1.2214. The difference, about 0.0114, comes from the numerical
    approximation even though the rule is known exactly. With a learned field, model error adds another possible
    source of discrepancy.'
  text_mode: 'Take a known change rule, dh/dt = h, starting from h = 1. Its current rate of increase equals
    its current value.


    With step size 0.1, an **Euler step** gives 1 + 0.1 × 1 = 1.1. The next gives 1.1 + 0.1 × 1.1 = 1.21.


    The exact solution at t = 0.2 is exp(0.2), about 1.2214. The difference, about 0.0114, comes from the numerical
    approximation even though the rule is known exactly. With a learned field, model error adds another possible
    source of discrepancy.'
  bridges:
  - dynamics-and-noise
  - derivatives
- id: neural-ordinary-differential-equations.s3
  title: Differentiate through the solution
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neural-ordinary-differential-equations
  markdown: Training can differentiate a discretized solver computation or use sensitivity/adjoint approaches.
    Memory and recomputation tradeoffs depend on the method. Reversing a numerically integrated trajectory
    can be unstable or inaccurate; the continuous adjoint ideal does not remove every practical numerical issue.
  text_mode: Training can differentiate a discretized solver computation or use sensitivity/adjoint approaches.
    Memory and recomputation tradeoffs depend on the method. Reversing a numerically integrated trajectory
    can be unstable or inaccurate; the continuous adjoint ideal does not remove every practical numerical issue.
  bridges:
  - chain-rule
- id: neural-ordinary-differential-equations.s4
  title: Measure adaptive computation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.neural-ordinary-differential-equations
  markdown: A solver may use more function evaluations for difficult or stiff dynamics. Report tolerance, solver,
    evaluation count, runtime, and task quality. Continuous depth does not mean unlimited computation at zero
    cost, and changing tolerances can alter both predictions and training gradients.
  text_mode: A solver may use more function evaluations for difficult or stiff dynamics. Report tolerance,
    solver, evaluation count, runtime, and task quality. Continuous depth does not mean unlimited computation
    at zero cost, and changing tolerances can alter both predictions and training gradients.
  bridges: []
