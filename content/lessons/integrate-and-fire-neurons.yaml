scenes:
  - id: integrate-and-fire-neurons.s1
    title: A leaky bucket that clicks when full
    type: explanation
    depth: intuition
    objective_refs:
      - objective.integrate-and-fire-neurons
    markdown: |-
      Press your fingertip lightly on a table, then harder. The touch sensors in your skin don't send bigger signals when you press harder. They send the *same* signal, a brief voltage pulse called a **spike**, more often.

      Picture a bucket with a small hole in the bottom. Water pours in, leaks out through the hole, and whenever the level reaches the rim, the bucket tips, clicks once, and starts again empty. Pour slowly and the leak keeps up, so it never clicks. Pour faster and it clicks faster.

      That's the **leaky integrate-and-fire (LIF)** neuron. The water level is the **membrane voltage** $V$. Without input it leaks back to a **resting voltage**, $V_\text{rest} = -65$ mV. An input current $I$ charges it. When $V$ reaches a **threshold**, $V_\text{th} = -50$ mV, the model records a spike and **resets** $V$ to $-65$ mV:

      $$\tau\,\frac{dV}{dt} = -(V - V_\text{rest}) + R\,I$$

      The first term is the leak: the farther $V$ is above rest, the faster it falls back. The second is the input, where $R$ is the membrane's resistance. The **membrane time constant** $\tau$ (here 10 ms) sets how quickly everything happens. The shape of the spike itself isn't modeled at all; only its timing is.

      Louis Lapicque proposed this kind of model in 1907. In 1952 Alan Hodgkin and Andrew Huxley described the actual ion currents that shape a spike, work that won a Nobel Prize in 1963. Their model is far costlier to simulate, which is why large simulations and neuromorphic chips mostly use LIF neurons.
    diagram:
