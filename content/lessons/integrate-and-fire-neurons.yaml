          label: start again
          bend: 1
    bridges:
      - dynamics-and-noise
  - id: integrate-and-fire-neurons.s2
    title: When will it fire?
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.integrate-and-fire-neurons
    markdown: |-
      Take $R = 10$ MΩ and a steady input of $I = 2$ nA, so $RI = 20$ mV. Start at rest. With a time step of 1 ms, each Euler step (from the lesson on following a changing state) adds $\frac{\Delta t}{\tau}\big(-(V - V_\text{rest}) + RI\big)$:

      | Time | Leak term $-(V + 65)$ | Change $0.1 \times (\text{leak} + 20)$ | New $V$ |
      | ---: | ---: | ---: | ---: |
      | 0 → 1 ms | 0 | +2.0 | −63.0 mV |
      | 1 → 2 ms | −2.0 | +1.8 | −61.2 mV |
      | 2 → 3 ms | −3.8 | +1.62 | −59.58 mV |

      Each step adds less, because the leak grows as $V$ rises. Left alone, $V$ would level off at $V_\text{rest} + RI = -45$ mV. That's above the threshold, so the neuron will fire. For a constant input, the equation has an exact solution:

      $$V(t) = V_\text{rest} + RI\,\big(1 - e^{-t/\tau}\big)$$

      Set $V(t) = -50$: $15 = 20\,(1 - e^{-t/10})$, so $e^{-t/10} = 0.25$ and $t = 10 \ln 4 = 13.86$ ms. In general, with a gap of $\theta = V_\text{th} - V_\text{reset} = 15$ mV to climb,

      $$T = \tau \ln\frac{RI}{RI - \theta}$$

      After each spike the voltage resets and the same climb repeats, so the neuron fires every 13.86 ms, about 72 times a second.

      :::predict What is the weakest current that ever makes this neuron fire?
      $RI$ must exceed the 15 mV gap, or $V$ levels off below threshold and never fires. So $I > 15 / 10 = 1.5$ nA. That minimum is called the **rheobase**. At 1.4 nA the neuron sits silently at −51 mV forever, 1 mV short.
      :::
  - id: integrate-and-fire-neurons.fi-curve
    title: Harder pressing, faster firing
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.integrate-and-fire-neurons
    markdown: |-
      Real neurons can't fire again instantly. For a millisecond or two after a spike, a **refractory period**, they won't respond. Add a 2 ms refractory period and the interval between spikes becomes $t_\text{ref} + T$: at 2 nA that's $2 + 13.86 = 15.86$ ms, or 63.0 spikes per second.

      Plotting firing rate against input current gives the **f–I curve**. The program simulates one second for each current and compares with the formula:

      ```python run
      import math

      tau, R = 10.0, 10.0                    # membrane time constant (ms), resistance (megaohms)
      v_rest, v_th, v_reset = -65.0, -50.0, -65.0   # millivolts
      t_ref, dt = 2.0, 0.1                   # refractory period and time step (ms)

      def spikes_in_one_second(I):           # I in nanoamps, so R * I is in millivolts
          v, t_last, count = v_rest, -1e9, 0
          for step in range(int(1000 / dt)):
              t = step * dt
              if t - t_last < t_ref:          # refractory: hold at reset
                  continue
              v += dt / tau * (-(v - v_rest) + R * I)    # Euler step of the membrane equation
              if v >= v_th:                   # threshold crossed: spike and reset
                  count, v, t_last = count + 1, v_reset, t
          return count

      print(" I (nA)   simulated (Hz)   formula (Hz)")
      for I in [1.0, 1.5, 1.6, 2.0, 3.0, 5.0, 10.0, 50.0]:
          gap = v_th - v_reset
          rate = 0 if R * I <= gap else 1000 / (t_ref + tau * math.log(R * I / (R * I - gap)))
          print(f"{I:6.1f}   {spikes_in_one_second(I):10d}   {rate:12.1f}")
      ```

      Three regions show up. Below 1.5 nA: silence. Just above it: firing starts at a low rate and climbs steeply (33 Hz at 1.6 nA, 63 Hz at 2 nA). At large currents the climb flattens, because no interval can be shorter than the 2 ms refractory period, which caps the rate at 500 Hz. Set `t_ref = 0.0` and rerun: the high-current rates shoot up with no ceiling.

      :::mixup "A stronger input makes the neuron send bigger spikes."
      In this model every spike is the same event, and in real neurons spikes are nearly all-or-none too. Strength is carried by *how often* and *how soon* spikes come, not by their size.
      :::
  - id: integrate-and-fire-neurons.s3
    title: Counting spikes or timing them
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.integrate-and-fire-neurons
    markdown: |-
      The f–I curve suggests one way to read a neuron: count spikes in a time window. That's a **rate code**. With a 100 ms window, 2 nA gives about 6 spikes and 5 nA about 18.

      The same equation offers a faster reading. Starting from rest, the *first* spike comes at $T = \tau\ln\big(RI/(RI - \theta)\big)$: 27.7 ms at 1.6 nA, 13.9 ms at 2 nA, and 4.7 ms at 4 nA. Stronger inputs fire sooner. Reading the input from when the first spike arrives is a **latency code**, one kind of **timing code**. A single spike is enough, which matters when a decision has to happen fast.

      :::predict Two neurons each fire 5 spikes in a 100 ms window. Must they be carrying the same message?
      No. A rate code would read them as identical. But one might fire all 5 in the first 20 ms and the other spread them evenly. Any reader that uses timing, like the first-spike latency, or which spikes from different neurons arrive together, can tell them apart.
      :::

      Real sensory systems appear to use both kinds of code, and the next lesson's learning rule, STDP, depends entirely on spike timing.
  - id: integrate-and-fire-neurons.s4
    title: The time step can move a spike
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.integrate-and-fire-neurons
    markdown: |-
      The program above used a 0.1 ms step, and its rates matched the formula within a few hertz. Coarser steps save computation, which is tempting in a network of a million neurons. Try $\Delta t = 5$ ms at 2 nA, so $\Delta t / \tau = 0.5$:

      - Step 1: $V = -65 + 0.5 \times 20 = -55$ mV.
      - Step 2: $V = -55 + 0.5 \times (-10 + 20) = -50$ mV. Spike at 10 ms.

      The exact spike time is 13.86 ms, so the coarse step fires almost 4 ms early, and the error repeats on every spike. For timing codes and for STDP, a 4 ms error changes the answer. Push further, to $\Delta t > 2\tau$, and each Euler step overshoots the level $V$ is heading for by more than it started away from it, so the simulation blows up.

      So choose the step from the time constant. A safe habit: use at least ten steps per $\tau$, then halve the step and check that spike times barely move. That's the same check you'd use for any numerical solver, and it returns in the lesson on neural ODEs.

      Module 34's lesson on neuromorphic applications covers the chips, such as Intel's Loihi, that run large networks of neurons like these, updating each one only when spikes arrive.
  - id: integrate-and-fire-neurons.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.integrate-and-fire-neurons
    markdown: Spike times, rheobases, and firing rates to compute, plus a pressure sensor, a fast-reacting robot, and a coarse simulation, test whether you can predict when an LIF neuron fires.
    takeaway: |-
      A leaky integrate-and-fire neuron charges toward rest plus RI, fires when it reaches threshold, and resets. The time to fire, τ ln(RI / (RI − θ)), sets both the firing rate and how soon the first spike arrives.
  - id: integrate-and-fire-neurons.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.integrate-and-fire-neurons
    markdown: |-
      A leaky integrate-and-fire neuron accumulates input, leaks toward rest, spikes at a threshold, and resets. The count and timing of spikes can carry different information.
