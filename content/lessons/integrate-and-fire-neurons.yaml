      url: https://doi.org/10.1113/jphysiol.1952.sp004764
objectives:
  - id: objective.integrate-and-fire-neurons
    version: 2-draft
    statement: Leaky integrate-and-fire models accumulate input in a membrane state that decays, emits a spike at a threshold, and resets; rate and timing codes use different properties of spike trains.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - integrate-and-fire-neurons.base.v2
      - integrate-and-fire-neurons.transfer.v2
