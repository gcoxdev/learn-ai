assessment_families:
  - id: integrate-and-fire-neurons.base
    objective_ref: objective.integrate-and-fire-neurons
    task: base
    response_type: single_choice
    points: 1
    hint: 'Trace a discrete toy update: trace the inputs, operation, and result before choosing.'
    remediation_scene: integrate-and-fire-neurons.s2
    variants:
      - id: integrate-and-fire-neurons.base.1
        prompt: After toy voltage 0.9 and input 0.6, what is the pre-reset next voltage?
        options:
          - id: c
            text: '0.45'
          - id: a
            text: '1.05'
          - id: b
            text: '1.5'
        answer: a
        feedback: Compute 0.5×0.9 + 0.6.
        retired: true
      - id: integrate-and-fire-neurons.base.2
        prompt: What does leakage do in the simplified model?
        options:
          - id: a
            text: Relaxes membrane state toward rest without sufficient input
          - id: b
            text: Guarantees voltage only increases
          - id: c
            text: Deletes the threshold
        answer: a
        feedback: Leakage provides decay dynamics.
        retired: true
  - id: integrate-and-fire-neurons.transfer
    objective_ref: objective.integrate-and-fire-neurons
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Simulate with explicit conventions: trace the inputs, operation, and result before choosing.'
    remediation_scene: integrate-and-fire-neurons.s4
    variants:
      - id: integrate-and-fire-neurons.transfer.1
        prompt: Can equal spike counts have different temporal patterns?
        options:
          - id: a
            text: 'Yes'
          - id: b
            text: 'No'
          - id: c
            text: Only if there is no time axis
        answer: a
        feedback: Rate and timing preserve different information.
        retired: true
      - id: integrate-and-fire-neurons.transfer.2
        prompt: Why specify numerical time step?
        options:
          - id: b
            text: Only plot colors depend on it
          - id: c
            text: The model has no dynamics
          - id: a
            text: It can affect integration and spike timing
        answer: a
        feedback: Discretization changes the approximation to continuous evolution.
        retired: true
  - id: integrate-and-fire-neurons.base.v2
    objective_ref: objective.integrate-and-fire-neurons
    task: base
    response_type: single_choice
    points: 1
    hint: "Compare RI with the gap θ = V_th − V_reset. If RI is smaller, the voltage levels off below threshold; if larger, the time to fire is τ ln(RI / (RI − θ)), plus any refractory period."
    remediation_scene: integrate-and-fire-neurons.s2
    variants:
      - id: integrate-and-fire-neurons.base.v2.1
        prompt: An LIF neuron has a 15 mV gap from rest to threshold and receives a steady input with RI = 12 mV. What does it do?
        options:
          - id: b
            text: It fires slowly, since the input keeps adding charge every step
          - id: a
            text: It never fires, since its voltage levels off 3 mV below threshold
          - id: c
            text: It fires once and then stops, since the reset empties its charge
        answer: a
        feedback: The voltage approaches V_rest + RI, which is 12 mV above rest, short of the 15 mV needed. The leak grows until it cancels the input, so charge stops accumulating.
      - id: integrate-and-fire-neurons.base.v2.2
        prompt: Doubling an LIF neuron's input current from 2 nA to 4 nA takes its firing rate from 63 Hz to about 149 Hz. Why isn't the rate simply doubled?
        options:
          - id: a
            text: The time to fire depends on the current through a logarithm, plus a fixed refractory period
          - id: c
            text: The larger input also makes each spike bigger, so fewer are needed
          - id: b
            text: The leak removes a fixed amount of charge per spike, whatever the input
        answer: a
        feedback: The interval is t_ref + τ ln(RI/(RI − θ)), which isn't proportional to 1/I, so the f–I curve bends. Spikes don't change size, and the leak depends on the voltage, not on a fixed amount per spike.
      - id: integrate-and-fire-neurons.base.v2.3
        prompt: An LIF neuron has a 2 ms refractory period. What happens to its firing rate as the input current grows very large?
        options:
          - id: c
            text: It keeps rising in proportion to the current
          - id: b
            text: It falls, because the leak grows with the current
          - id: a
            text: It levels off below 500 spikes per second
        answer: a
        feedback: As the climb to threshold gets very short, the interval approaches the 2 ms refractory period, so the rate approaches 1/(2 ms) = 500 Hz. The leak depends on voltage, not on the input current.
      - id: integrate-and-fire-neurons.base.v2.4
        prompt: In τ dV/dt = −(V − V_rest) + RI, what does the −(V − V_rest) term do?
        options:
          - id: b
            text: It resets the voltage to rest immediately after each spike
          - id: a
            text: It pulls the voltage back toward rest, harder the farther it is
          - id: c
            text: It sets the threshold that the voltage must reach to spike
        answer: a
        feedback: That's the leak. It is proportional to how far V is from rest, which is why each Euler step adds less as V rises. The reset and the threshold are separate rules outside the equation.
  - id: integrate-and-fire-neurons.transfer.v2
    objective_ref: objective.integrate-and-fire-neurons
    task: transfer
    response_type: single_choice
    points: 1
    hint: "Decide what the reader of the spikes needs: a count over a window (rate code) or when spikes arrive (timing code). For simulations, compare the time step with τ."
    remediation_scene: integrate-and-fire-neurons.s3
    variants:
      - id: integrate-and-fire-neurons.transfer.v2.1
        prompt: A robot's collision sensor must trigger a stop within 10 ms of contact, and its LIF neurons fire at most about 60 times per second. Which reading of the spikes fits?
        options:
          - id: b
            text: Count spikes over a 100 ms window and stop if the count is high
          - id: a
            text: Stop as soon as the first spike arrives, since strong contact fires it sooner
          - id: c
            text: Average the firing rate over the last second of sensor activity
        answer: a
        feedback: A latency code needs just one spike, and stronger input makes it arrive sooner. At 60 Hz, a 10 ms window holds less than one spike on average, so any count-based reading is too slow.
      - id: integrate-and-fire-neurons.transfer.v2.2
        prompt: Two neurons in a smell sensor each fire 8 spikes per 200 ms. One fires them all in the first 30 ms; the other spreads them evenly. A downstream reader says they carry identical information. What is it assuming?
        options:
          - id: a
            text: That only the spike count in the window matters
          - id: b
            text: That spikes from both neurons have the same size
          - id: c
            text: That both neurons have the same threshold voltage
        answer: a
        feedback: That's a rate code, which throws away when spikes happen. A timing code would read the early burst differently. Spike size doesn't vary in these models, and thresholds don't enter the reader's decision.
      - id: integrate-and-fire-neurons.transfer.v2.3
        prompt: A student simulates LIF neurons with τ = 10 ms using a 5 ms time step to save time. Spike times come out several milliseconds early. What should she do?
        options:
          - id: c
            text: Raise the threshold slightly to cancel out the early spikes
          - id: a
            text: Shrink the step to about 1 ms or less and check that spike times settle
          - id: b
            text: Add a refractory period so that spikes are spaced correctly
        answer: a
        feedback: The error comes from Euler's big steps, so the fix is a smaller step, confirmed by halving it until spike times stop moving. Tuning the threshold hides the error for one input and breaks others.
      - id: integrate-and-fire-neurons.transfer.v2.4
        prompt: A pressure sensor's neuron is silent for light touches and starts firing only above a certain pressure. In LIF terms, what sets that pressure?
        options:
          - id: b
            text: The refractory period, which blocks weak inputs from firing
          - id: c
            text: The time constant τ, which decides how much charge the input adds
          - id: a
            text: The rheobase, where RI first exceeds the gap from reset to threshold
        answer: a
        feedback: Below the rheobase the voltage levels off under threshold, so there's no spike at all. τ changes how fast the voltage climbs, not where it levels off, and the refractory period only matters after a spike.
  - id: integrate-and-fire-neurons.calculate
    objective_ref: objective.integrate-and-fire-neurons
    task: base
    response_type: numeric
    points: 1
    hint: "Time to fire: T = τ ln(RI / (RI − θ)), where θ is the gap from reset to threshold. Rate = 1000 / (t_ref + T) spikes per second when times are in ms. One Euler step adds (Δt/τ)(−(V − V_rest) + RI)."
    remediation_scene: integrate-and-fire-neurons.s2
    absolute_tolerance: 0.1
    variants:
      - id: integrate-and-fire-neurons.calculate.1
        prompt: An LIF neuron has τ = 10 ms, a 15 mV gap from reset to threshold, and a steady input with RI = 20 mV. How many milliseconds after reset does it fire?
        answer: 13.86
        feedback: T = 10 × ln(20 / 5) = 10 × ln 4 ≈ 13.86 ms.
      - id: integrate-and-fire-neurons.calculate.2
        prompt: An LIF neuron has τ = 20 ms, a 15 mV gap from reset to threshold, and RI = 25 mV. How many milliseconds after reset does it fire?
        answer: 18.33
        feedback: T = 20 × ln(25 / 10) = 20 × ln 2.5 ≈ 18.33 ms.
      - id: integrate-and-fire-neurons.calculate.3
        prompt: An LIF neuron takes 13.86 ms to climb from reset to threshold and has a 2 ms refractory period. What is its firing rate in spikes per second?
        answer: 63.05
        feedback: Each cycle lasts 2 + 13.86 = 15.86 ms, so the rate is 1000 / 15.86 ≈ 63.05 spikes per second.
      - id: integrate-and-fire-neurons.calculate.4
        prompt: An LIF neuron needs a 12 mV climb from rest to threshold, and its membrane resistance is R = 8 MΩ. What is its rheobase current, in nA?
        answer: 1.5
        feedback: It fires only if RI > 12 mV, so I > 12 / 8 = 1.5 nA.
      - id: integrate-and-fire-neurons.calculate.5
        prompt: "An LIF neuron sits at V = −63 mV with V_rest = −65 mV, RI = 20 mV, τ = 10 ms, and Δt = 1 ms. What is V after one Euler step, in mV?"
        answer: -61.2
        feedback: The change is 0.1 × (−2 + 20) = 1.8 mV, so V = −63 + 1.8 = −61.2 mV.
