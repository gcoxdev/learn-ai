schema_version: 0.2-draft
lesson:
  id: integrate-and-fire-neurons
  version: 0.1.0-draft
  title: Follow voltage, leakage, threshold, and reset
  state: draft
  summary: Leaky integrate-and-fire models accumulate input in a membrane state that decays, emits a spike at a
    threshold, and resets; rate and timing codes use different properties of spike trains.
  slot: M37.4
  category: learning
  minutes: 12
  sources:
  - title: Neuronal Dynamics
    url: https://neuronaldynamics.epfl.ch/online/
objectives:
- id: objective.integrate-and-fire-neurons
  version: 1-draft
  statement: Leaky integrate-and-fire models accumulate input in a membrane state that decays, emits a spike at
    a threshold, and resets; rate and timing codes use different properties of spike trains.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - integrate-and-fire-neurons.base
  - integrate-and-fire-neurons.transfer
  prerequisites:
  - anyOf:
    - objective.dynamics-and-noise
  - anyOf:
    - objective.neurons
scenes:
- id: integrate-and-fire-neurons.s1
  title: Track a state over time
  type: explanation
  depth: intuition
  objective_refs:
  - objective.integrate-and-fire-neurons
  markdown: A leaky integrate-and-fire neuron models membrane voltage relaxing toward a resting level while input
    current changes it. When voltage reaches a threshold, the model emits a spike and applies a reset rule, often
    with a refractory interval. This is a simplified dynamical model, not a detailed biological cell.
  text_mode: A leaky integrate-and-fire neuron models membrane voltage relaxing toward a resting level while input
    current changes it. When voltage reaches a threshold, the model emits a spike and applies a reset rule, often
    with a refractory interval. This is a simplified dynamical model, not a detailed biological cell.
  bridges: []
- id: integrate-and-fire-neurons.s2
  title: Trace a discrete toy update
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.integrate-and-fire-neurons
  markdown: Use v_next = 0.5 v_previous + input, threshold one, and reset zero. Starting at zero with input 0.6
    twice, voltages become 0.6 then 0.9, so no spike occurs. A third equal input gives 1.05 before reset, producing
    a spike under the stated rule.
  text_mode: Use v_next = 0.5 v_previous + input, threshold one, and reset zero. Starting at zero with input 0.6
    twice, voltages become 0.6 then 0.9, so no spike occurs. A third equal input gives 1.05 before reset, producing
    a spike under the stated rule.
  bridges:
  - dynamics-and-noise
- id: integrate-and-fire-neurons.s3
  title: Encode rate or precise timing
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.integrate-and-fire-neurons
  markdown: A rate code uses spike counts over a window; a temporal code uses timing relationships such as latency
    or coincidence. The same count can correspond to different spike patterns. Window length, noise, and downstream
    dynamics determine which distinctions are usable.
  text_mode: A rate code uses spike counts over a window; a temporal code uses timing relationships such as latency
    or coincidence. The same count can correspond to different spike patterns. Window length, noise, and downstream
    dynamics determine which distinctions are usable.
  bridges: []
- id: integrate-and-fire-neurons.s4
  title: Simulate with explicit conventions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.integrate-and-fire-neurons
  markdown: Specify time step, integration method, threshold comparison, reset, and input units. Coarse numerical
    steps can change spike timing. Compare model behavior with the intended equations or data, and distinguish simulated
    spikes from claims about actual biological computation or hardware energy.
  text_mode: Specify time step, integration method, threshold comparison, reset, and input units. Coarse numerical
    steps can change spike timing. Compare model behavior with the intended equations or data, and distinguish simulated
    spikes from claims about actual biological computation or hardware energy.
  bridges: []
