  version: 0.4.0-draft
  title: Follow voltage, leakage, threshold, and reset
  state: draft
  summary: A leaky bucket that empties itself with a click every time it overflows. That's most of what a spiking neuron model does, and it explains why pressing harder makes a nerve fire faster, not louder.
  slot: M37.4
  category: learning
