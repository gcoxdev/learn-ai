      description: Input current flows into the membrane voltage. The membrane voltage leaks toward the resting voltage of −65 mV, on a dashed arrow. The voltage is compared with the −50 mV threshold. When it is reached, a spike goes out, and a reset step sends the voltage back to −65 mV and holds it there for a 2 ms refractory period before it can charge again.
      nodes:
        - id: input
          label: Input current I
          col: 0
          row: 0
          tone: data
        - id: membrane
          label: Membrane voltage V
          note: τ = 10 ms
          col: 1
          row: 0
          tone: accent
        - id: rest
          label: Resting voltage
          note: −65 mV
          col: 1
          row: 2
          tone: muted
        - id: threshold
          label: Threshold check
          note: V ≥ −50 mV?
          col: 3
          row: 0
        - id: spike
          label: Spike out
          col: 4
          row: 0
          tone: accent
        - id: reset
          label: Reset to −65 mV
          note: then 2 ms refractory
          col: 3
          row: 2
          tone: warn
      edges:
        - from: input
          to: membrane
          label: R·I charges it
        - from: membrane
          to: rest
          label: leak
          dashed: true
        - from: membrane
          to: threshold
        - from: threshold
          to: spike
          label: yes
        - from: threshold
