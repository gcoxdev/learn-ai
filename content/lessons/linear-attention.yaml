assessment_families:
  - id: linear-attention.base
    objective_ref: objective.linear-attention
    task: base
    response_type: single_choice
    points: 1
    hint: The trick needs a similarity that splits into a query part times a key part.
    remediation_scene: linear-attention.s2
    variants:
      - id: linear-attention.base.1
        prompt: What allows the multiplication order to change in this formulation?
        options:
          - id: b
            text: Deleting every value vector
          - id: c
            text: Sorting token text alphabetically
          - id: a
            text: A factorized feature-map similarity
        answer: a
        feedback: Factorization allows sums to be accumulated before each query reads them.
        retired: true
      - id: linear-attention.base.2
        prompt: Does fixed-size summary state preserve every past item exactly by default?
        options:
          - id: c
            text: Only if the sequence is long
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Compression has representational limits.
        retired: true
  - id: linear-attention.transfer
    objective_ref: objective.linear-attention
    task: transfer
    response_type: single_choice
    points: 1
    hint: Compare the sequence length n with the head width d before expecting a speed-up.
    remediation_scene: linear-attention.s4
    variants:
      - id: linear-attention.transfer.1
        prompt: Does linear sequence-length scaling mean constant total work?
        options:
          - id: c
            text: Only at training time
          - id: a
            text: No; work still grows with tokens and dimensions
          - id: b
            text: 'Yes'
        answer: a
        feedback: Linear growth is still growth.
        retired: true
      - id: linear-attention.transfer.2
        prompt: Why compare short and long inputs?
        options:
          - id: a
            text: Asymptotic advantages may not dominate overhead at short lengths
          - id: b
            text: Complexity is unrelated to runtime
          - id: c
            text: Every method has identical overhead
        answer: a
        feedback: Operating regime affects measured performance.
        retired: true
  - id: linear-attention.base.v2
    objective_ref: objective.linear-attention
    task: base
    response_type: single_choice
    points: 1
    hint: "Follow the two sums: S collects φ(k) times v, z collects φ(k). A query only ever sees those two, never the list of tokens."
    remediation_scene: linear-attention.s2
    variants:
      - id: linear-attention.base.v2.1
        prompt: Linear attention lets the key-side sums be built before any query arrives. Which change to softmax attention makes that possible?
        options:
          - id: b
            text: Dropping the normalizing denominator so the output is a plain sum
          - id: a
            text: Using a similarity φ(q)·φ(k) that splits into a query part and a key part
          - id: c
            text: Sorting the keys by similarity so the query reads only the top few
        answer: a
        feedback: Once the similarity is a dot product of separate features, Σ (φ(q)·φ(k_j)) v_j equals φ(q)ᵀ Σ φ(k_j)v_jᵀ, and the sum no longer depends on q. The normalizer is kept (as z), and nothing is sorted or dropped.
      - id: linear-attention.base.v2.2
        prompt: With 2-D features, keys [1, 0] and [0, 1] let query [1, 0] read token 1's value exactly. After a third key [1, 1] is added, the same query returns a blend. Why?
        options:
          - id: c
            text: The normalizer z overflowed once a third token was added
          - id: b
            text: The model drops the oldest token once the state is full
          - id: a
            text: A 2-D state has room for only two separate keys, so they overlap
        answer: a
        feedback: The new key shares the first feature direction with token 1, so the query now matches both and averages their values. Nothing overflows and nothing is dropped; every token is still in S, just no longer separable.
      - id: linear-attention.base.v2.3
        prompt: A causal linear-attention layer has generated 100,000 tokens. What does each head keep in memory to produce the next token?
        options:
          - id: a
            text: A d × d state matrix and a d-length normalizer, the same size at any length
          - id: b
            text: The keys and values for all 100,000 tokens, stored at reduced precision
          - id: c
            text: The keys and values of the most recent tokens inside a fixed-size window
        answer: a
        feedback: The running state S and normalizer z hold everything the layer keeps, and their size depends only on the feature and value widths. A full or windowed KV cache belongs to softmax attention.
      - id: linear-attention.base.v2.4
        prompt: Katharopoulos et al. titled their paper "Transformers are RNNs." What does the title refer to?
        options:
          - id: c
            text: Every softmax transformer can be run with a fixed-size hidden state
          - id: a
            text: Causal linear attention can be run as a recurrence with state S and z
          - id: b
            text: Transformer layers contain LSTM-style gates hidden inside attention
        answer: a
        feedback: For linear attention, each token updates S and z and then reads them, which is an RNN. Softmax attention can't be folded into a fixed state this way, and no LSTM gates are involved.
  - id: linear-attention.transfer.v2
    objective_ref: objective.linear-attention
    task: transfer
    response_type: single_choice
    points: 1
    hint: "Ask two questions: is n much larger than the head width d, and does the task need one exact item back or the gist of many?"
    remediation_scene: linear-attention.s4
    variants:
      - id: linear-attention.transfer.v2.1
        prompt: A speech model must caption a live stream that never ends, on a device with fixed memory. How should a linear-attention model run while generating?
        options:
          - id: b
            text: In the quadratic order, recomputing the full grid over the stream at each frame
          - id: a
            text: In the recurrent order, updating S and z once per frame and reading them
          - id: c
            text: With a softmax layer that caches every key so no frame is ever forgotten
        answer: a
        feedback: The recurrent form uses constant work and memory per step, which is exactly what an endless stream needs. The quadratic order grows with the stream, and a full softmax cache eventually runs out of memory.
      - id: linear-attention.transfer.v2.2
        prompt: A linear-attention model writes good summaries of 20,000-token logs but can't return an exact order ID that appeared once near the start. What is the most likely cause?
        options:
          - id: a
            text: Its fixed-size state blends many keys, so one exact item is hard to recover
          - id: c
            text: Its feature map produced negative similarities that canceled the order ID
          - id: b
            text: Its normalizer z grew so large that it rounded every output to zero
        answer: a
        feedback: A summary can capture the gist while exact items interfere with each other in the fixed state. The elu+1 feature map is always positive, and dividing by z keeps outputs on the scale of the values.
      - id: linear-attention.transfer.v2.3
        prompt: A team plans to replace softmax attention with linear attention in a classifier for 256-token posts, using head width 128, to save compute. What is the likely outcome?
        options:
          - id: c
            text: A large saving, because linear attention is always faster than softmax
          - id: b
            text: No change, because the model then runs as an RNN over the post
          - id: a
            text: Little saving, because n is only about twice the head width d
        answer: a
        feedback: The saving is roughly n/d, here about 2, and a tuned softmax kernel can erase that. Linear attention pays off when n is much larger than d. Running as an RNN is an option for generation, not a reason for a saving here.
      - id: linear-attention.transfer.v2.4
        prompt: You want to speed up an already trained softmax model without retraining it from scratch. Which feature map was designed for that kind of goal?
        options:
          - id: a
            text: Performer's random features, which approximate the exp(q·k) similarity
          - id: b
            text: The elu(x) + 1 map, which gives the same outputs as softmax attention
          - id: c
            text: The identity map φ(x) = x, which keeps the trained dot products intact
        answer: a
        feedback: Performer chooses random features so φ(q)·φ(k) approximates the softmax kernel on average. elu+1 defines a different attention that needs its own training, and φ(x) = x gives raw dot products that can go negative, with no exponential at all.
  - id: linear-attention.read
    objective_ref: objective.linear-attention
    task: base
    response_type: numeric
    points: 1
    hint: "Build S = Σ v·φ(k) and z = Σ φ(k). Then the output is (φ(q)·S) ÷ (φ(q)·z)."
    remediation_scene: linear-attention.s2
    absolute_tolerance: 0.01
    variants:
      - id: linear-attention.read.1
        prompt: "Past tokens have features φ(k) = [1, 0], [0, 1], [1, 1] with values 2, 4, 9. What does the query φ(q) = [1, 0] read?"
        answer: 5.5
        feedback: "S = [11, 13] and z = [2, 2], so 11 ÷ 2 = 5.5."
      - id: linear-attention.read.2
        prompt: "Past tokens have features φ(k) = [1, 0], [0, 1], [1, 1] with values 2, 4, 9. What does the query φ(q) = [1, 1] read?"
        answer: 6
        feedback: "S = [11, 13] and z = [2, 2], so 24 ÷ 4 = 6. The long way agrees: the query scores 1, 1, and 2 against the three keys, giving (2 + 4 + 2 × 9) ÷ 4 = 6."
      - id: linear-attention.read.3
        prompt: "Past tokens have features φ(k) = [2, 0] and [0, 1] with values 1 and 5. What does the query φ(q) = [1, 1] read? Give two decimal places."
        answer: 2.33
        feedback: "S = 1·[2, 0] + 5·[0, 1] = [2, 5] and z = [2, 1]. φ(q)·S = 7 and φ(q)·z = 3, so 7 ÷ 3 ≈ 2.33."
      - id: linear-attention.read.4
        prompt: "Past tokens have features φ(k) = [1, 1] and [0, 2] with values 3 and 6. What does the query φ(q) = [0, 1] read?"
        answer: 5
        feedback: "S = 3·[1, 1] + 6·[0, 2] = [3, 15] and z = [1, 3]. φ(q)·S = 15 and φ(q)·z = 3, so the output is 5."
