schema_version: 0.2-draft
lesson:
  id: linear-attention
  version: 0.3.0-draft
  title: Rearrange attention around a compressed running summary
  state: draft
  summary: Replace a list of token comparisons with a reusable summary, and inspect the information that compression
    can lose.
  slot: M19.3
  category: learning
  sources:
  - title: 'Transformers are RNNs: Fast Autoregressive Transformers with Linear Attention'
    url: https://arxiv.org/abs/2006.16236
  - title: Performer
    url: https://arxiv.org/abs/2009.14794
objectives:
- id: objective.linear-attention
  version: 1-draft
  statement: Linear-attention methods replace or approximate the attention kernel so sums can be reassociated;
    they reduce sequence-length costs under assumptions while changing the representation and its limits.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - linear-attention.base
  - linear-attention.transfer
  prerequisites:
  - anyOf:
    - objective.attention-motivation
  - anyOf:
    - objective.matrices-tensors
scenes:
- id: linear-attention.s1
  title: Start from weighted comparisons
  type: explanation
  depth: intuition
  objective_refs:
  - objective.linear-attention
  markdown: 'Standard softmax attention compares a query with permitted keys and uses their scores to mix values.
    Some **linear-attention** methods instead define a similarity through transformed queries and keys. The
    transformation is often written φ, read “phi”; it is a function applied to a feature vector.


    This choice lets the computation group past information into reusable sums. It changes or approximates
    the similarity rule; it is not simply skipping part of the same softmax calculation. “Linear” here concerns
    growth with sequence length under fixed dimensions, not a claim that the entire model is a linear function.'
  text_mode: 'Standard softmax attention compares a query with permitted keys and uses their scores to mix
    values. Some **linear-attention** methods instead define a similarity through transformed queries and keys.
    The transformation is often written φ, read “phi”; it is a function applied to a feature vector.


    This choice lets the computation group past information into reusable sums. It changes or approximates
    the similarity rule; it is not simply skipping part of the same softmax calculation. “Linear” here concerns
    growth with sequence length under fixed dimensions, not a claim that the entire model is a linear function.'
  bridges: []
- id: linear-attention.s2
  title: Keep reusable sums
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.linear-attention
  markdown: 'Start with a positive scalar example: transformed keys are 1 and 2, and values are 2 and 4. Store
    S = 1 × 2 + 2 × 4 = 10 and z = 1 + 2 = 3. A transformed query of 3 gives output (3 × 10)/(3 × 3) = 10/3.
    The query cancels in this one-dimensional illustration; richer feature vectors allow different queries
    to use the summary differently.


    In a common vector formulation, S adds outer products φ(k)vᵀ and z adds φ(k). The query reads φ(q)ᵀS divided
    by φ(q)ᵀz, with the method''s numerical safeguards. The superscript T means transpose, changing a column
    to a row. An **outer product** stores every pairwise product between two vectors. The vectors/matrices
    bridges explain that operation.


    Each new token updates the sums; their stored size is set by feature and value widths rather than directly
    by the number of past tokens.'
  text_mode: 'Start with a positive scalar example: transformed keys are 1 and 2, and values are 2 and 4. Store
    S = 1 × 2 + 2 × 4 = 10 and z = 1 + 2 = 3. A transformed query of 3 gives output (3 × 10)/(3 × 3) = 10/3.
    The query cancels in this one-dimensional illustration; richer feature vectors allow different queries
    to use the summary differently.


    In a common vector formulation, S adds outer products φ(k)vᵀ and z adds φ(k). The query reads φ(q)ᵀS divided
    by φ(q)ᵀz, with the method''s numerical safeguards. The superscript T means transpose, changing a column
    to a row. An **outer product** stores every pairwise product between two vectors. The vectors/matrices
    bridges explain that operation.


    Each new token updates the sums; their stored size is set by feature and value widths rather than directly
    by the number of past tokens.'
  bridges:
  - matrices-tensors
- id: linear-attention.s3
  title: Name the approximation or changed kernel
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.linear-attention
  markdown: 'A chosen feature map might define a different attention mechanism or approximate a target kernel.
    Fixed-size summaries compress the past and may struggle with tasks requiring exact item-level retrieval.
    Linear in sequence length does not mean free: feature dimensions and update costs still matter.'
  text_mode: 'A chosen feature map might define a different attention mechanism or approximate a target kernel.
    Fixed-size summaries compress the past and may struggle with tasks requiring exact item-level retrieval.
    Linear in sequence length does not mean free: feature dimensions and update costs still matter.'
  bridges: []
- id: linear-attention.s4
  title: Evaluate the regime that matters
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.linear-attention
  markdown: Compare training, prefill, and decode separately, including numerical stability, quality, and long-context
    behavior. A method with favorable asymptotic growth may lose on small inputs or unsupported hardware. Match
    the actual task and context distribution when judging the tradeoff.
  text_mode: Compare training, prefill, and decode separately, including numerical stability, quality, and
    long-context behavior. A method with favorable asymptotic growth may lose on small inputs or unsupported
    hardware. Match the actual task and context distribution when judging the tradeoff.
  bridges: []
- id: linear-attention.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.linear-attention
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Some attention rules let past information be stored in reusable sums instead of a growing list
    of comparisons. This saves work under stated assumptions, but the compressed history may lose details a
    task needs.
- id: linear-attention.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.linear-attention
  markdown: Some attention rules let past information be stored in reusable sums instead of a growing list
    of comparisons. This saves work under stated assumptions, but the compressed history may lose details a
    task needs.
  text_mode: Some attention rules let past information be stored in reusable sums instead of a growing list
    of comparisons. This saves work under stated assumptions, but the compressed history may lose details a
    task needs.
navigation:
  routes:
  - id: route.core
    scene_sequence:
