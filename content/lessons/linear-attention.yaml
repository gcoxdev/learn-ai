assessment_families:
- id: linear-attention.base
  objective_ref: objective.linear-attention
  task: base
  response_type: single_choice
  points: 1
  hint: 'Accumulate sufficient intermediate sums: trace the inputs, operation, and result before choosing.'
  remediation_scene: linear-attention.s2
  variants:
  - id: linear-attention.base.1
    prompt: What allows the multiplication order to change in this formulation?
    options:
    - id: b
      text: Deleting every value vector
    - id: c
      text: Sorting token text alphabetically
    - id: a
      text: A factorized feature-map similarity
    answer: a
    feedback: Factorization allows sums to be accumulated before each query reads them.
  - id: linear-attention.base.2
    prompt: Does fixed-size summary state preserve every past item exactly by default?
    options:
    - id: c
      text: Only if the sequence is long
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Compression has representational limits.
- id: linear-attention.transfer
  objective_ref: objective.linear-attention
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate the regime that matters: trace the inputs, operation, and result before choosing.'
  remediation_scene: linear-attention.s4
  variants:
  - id: linear-attention.transfer.1
    prompt: Does linear sequence-length scaling mean constant total work?
    options:
    - id: c
      text: Only at training time
    - id: a
      text: No; work still grows with tokens and dimensions
    - id: b
      text: 'Yes'
    answer: a
    feedback: Linear growth is still growth.
  - id: linear-attention.transfer.2
    prompt: Why compare short and long inputs?
    options:
    - id: a
      text: Asymptotic advantages may not dominate overhead at short lengths
    - id: b
      text: Complexity is unrelated to runtime
    - id: c
      text: Every method has identical overhead
    answer: a
    feedback: Operating regime affects measured performance.
