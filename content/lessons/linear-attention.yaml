schema_version: 0.2-draft
lesson:
  id: linear-attention
  version: 0.4.0-draft
  title: Rearrange attention around a compressed running summary
  state: draft
  summary: What if a transformer kept one running total instead of a list of every past token? Move one pair of brackets and attention turns into an RNN, with a catch.
  slot: M19.3
  category: learning
  sources:
    - title: "Transformers are RNNs: Fast Autoregressive Transformers with Linear Attention (Katharopoulos et al., 2020)"
      url: https://arxiv.org/abs/2006.16236
    - title: "Rethinking Attention with Performers (Choromanski et al., 2020)"
      url: https://arxiv.org/abs/2009.14794
    - title: "Repeat After Me: Transformers are Better than State Space Models at Copying (Jelassi et al., 2024)"
      url: https://arxiv.org/abs/2402.01032
objectives:
  - id: objective.linear-attention
    version: 2-draft
    statement: Linear-attention methods replace or approximate the attention kernel so sums can be reassociated; they reduce sequence-length costs under assumptions while changing the representation and its limits.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - linear-attention.base.v2
      - linear-attention.transfer.v2
      - linear-attention.read
    prerequisites:
      - anyOf:
          - objective.attention-motivation
      - anyOf:
          - objective.matrices-tensors
scenes:
  - id: linear-attention.s1
    title: A running total instead of a growing list
    type: explanation
    depth: intuition
    objective_refs:
      - objective.linear-attention
    markdown: |-
      Our coding assistant is generating token 100,001. With softmax attention, its query must be compared with 100,000 stored keys, in every head of every layer, and the next token needs 100,001. The work per token keeps growing, and so does the cache.

      A shop doesn't recompute its takings by rereading every receipt each time a customer pays. It keeps a running total. Could attention keep a running total too?

      Write one query's softmax attention as a weighted average over past tokens $j$:

      $$y = \frac{\sum_j \text{sim}(q, k_j)\, v_j}{\sum_j \text{sim}(q, k_j)}, \qquad \text{sim}(q, k) = \exp\!\big(q \cdot k / \sqrt{d}\big)$$

      The exponential ties $q$ and $k_j$ together inside every term, so nothing can be summed before the query arrives. **Linear attention** swaps in a similarity that splits apart: pass the query and the key each through a **feature map** $\varphi$ (a fixed function that turns a vector into another vector with only positive entries), and use the dot product $\varphi(q) \cdot \varphi(k)$ as the similarity. Katharopoulos et al. (2020) used $\varphi(x) = \text{elu}(x) + 1$, which is $x + 1$ for positive entries and $e^x$ for negative ones.

      Once the similarity splits, the key-side work can be done ahead of time, and the next scene shows how.
    bridges: []
  - id: linear-attention.s2
    title: Three queries, one summary
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.linear-attention
    markdown: |-
      Take two past tokens with 2-D features (already passed through $\varphi$) and single-number values:

      | Token | $\varphi(k)$ | $v$ |
      | --- | --- | ---: |
      | 1 | [1, 0] | 2 |
      | 2 | [0, 1] | 4 |

      Build two sums before any query arrives. The **state** $S$ adds up each feature vector times its value: $S = 2 \cdot [1, 0] + 4 \cdot [0, 1] = [2, 4]$. The **normalizer** $z$ adds up the feature vectors: $z = [1, 1]$. A query reads the state with two dot products, $\varphi(q) \cdot S$ divided by $\varphi(q) \cdot z$:

      | Query $\varphi(q)$ | $\varphi(q) \cdot S$ | $\varphi(q) \cdot z$ | Output |
      | --- | ---: | ---: | ---: |
      | [1, 0] | 2 | 1 | **2** |
      | [0, 1] | 4 | 1 | **4** |
      | [1, 1] | 6 | 2 | **3** |

      One fixed summary, three different answers, and no list of past tokens. Check the last row the long way: query [1, 1] scores 1 against each key, so it averages the values: $(2 + 4)/2 = 3$. Same answer.

      :::predict A third token arrives with φ(k) = [1, 1] and v = 9. Update S and z. What does query [1, 0] read now?
      $S = [2, 4] + 9 \cdot [1, 1] = [11, 13]$ and $z = [1, 1] + [1, 1] = [2, 2]$. Query [1, 0] reads $11 / 2 = 5.5$. The long way agrees: it scores 1 with token 1, 0 with token 2, and 1 with token 3, so it averages 2 and 9.
      :::

      :::papers Linear attention (Katharopoulos et al., 2020)
      With $d$-dimensional vectors, the value becomes a vector and $S$ becomes a matrix of outer products:

      $$y_i = \frac{\varphi(q_i)^\top \sum_{j \le i} \varphi(k_j)\, v_j^\top}{\varphi(q_i)^\top \sum_{j \le i} \varphi(k_j)} = \frac{\varphi(q_i)^\top S_i}{\varphi(q_i)^\top z_i}$$

      In matrix form (ignoring the mask and normalizer) this is $\big(\varphi(Q)\,\varphi(K)^\top\big)V = \varphi(Q)\,\big(\varphi(K)^\top V\big)$. The two orders give identical results because matrix multiplication is associative. The left order builds an $n \times n$ grid and costs about $n^2 d$; the right order builds a $d \times d$ matrix and costs about $n d^2$. For $n = 100{,}000$ and $d = 128$ that is $n/d \approx 780$ times less work.
      :::

      The program runs the hand example, then checks on random data that the quadratic order and the running-state order agree.

      ```python run
      import numpy as np

      # 1. The hand example: two tokens, 2-D features, one summary
      fk = np.array([[1.0, 0.0], [0.0, 1.0]])      # phi(k1), phi(k2)
      v = np.array([2.0, 4.0])                     # v1, v2
      S, z = fk.T @ v, fk.sum(axis=0)              # S = [2, 4], z = [1, 1]
      for q in ([1, 0], [0, 1], [1, 1]):
          print("query", q, "reads", np.dot(q, S) / np.dot(q, z))

      # 2. Random causal check: quadratic order vs running-state order
      rng = np.random.default_rng(0)
      n, d = 6, 4
      Q, K, V = (rng.standard_normal((n, d)) for _ in range(3))
      phi = lambda x: np.where(x > 0, x + 1, np.exp(x))   # elu(x) + 1, always positive
      fQ, fK = phi(Q), phi(K)

      A = np.tril(fQ @ fK.T)                        # n x n grid, future masked
      quad = (A @ V) / A.sum(axis=1, keepdims=True)

      S, z, lin = np.zeros((d, d)), np.zeros(d), []
      for t in range(n):                            # left to right, keep only S and z
          S += np.outer(fK[t], V[t])
          z += fK[t]
          lin.append(fQ[t] @ S / (fQ[t] @ z))
      print(f"largest difference between the two orders: {np.abs(quad - np.array(lin)).max():.1e}")
      print("state kept:", S.size + z.size, "numbers, however long the sequence")
      ```

      The difference is about $10^{-16}$, which is floating-point rounding. Change `n` to 60 or 600: the difference stays tiny and the state stays at 20 numbers.
    bridges:
      - matrices-tensors
  - id: linear-attention.s3
    title: Transformers are RNNs
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.linear-attention
    markdown: |-
      Look at the loop in the program. Each step does two things: fold the new token into the state, then let the query read the state.

      $$S_t = S_{t-1} + \varphi(k_t)\, v_t^\top, \qquad z_t = z_{t-1} + \varphi(k_t), \qquad y_t = \frac{\varphi(q_t)^\top S_t}{\varphi(q_t)^\top z_t}$$

      That is a recurrent neural network, exactly the shape you met in module 13's lesson on recurrent networks: a fixed-size hidden state updated once per token. It is why Katharopoulos et al. titled their paper *Transformers are RNNs*. One model now has two ways to run:

      - **Training**, when all tokens are known: use the parallel form, like a transformer.
      - **Generating**, one token at a time: use the recurrent form, with constant work and memory per token.

      Compare memory per head with head width 128. A softmax KV cache stores $2 \times 128 = 256$ numbers for *every* token, so 25.6 million at 100,000 tokens. The linear-attention state is a $128 \times 128$ matrix plus a 128-number normalizer: 16,512 numbers at 100 tokens or at 100 million. The authors reported generation up to 4,000 times faster than softmax attention on very long sequences.
    diagram:
      caption: Causal linear attention run as a recurrence. The state never grows.
      description: "The previous state S and z feeds an update step. The new token's key feature and value also feed the update step, which adds their outer product to S and the key feature to z. The updated state goes two ways: into the read step, where the new token's query feature computes the output, and back as the previous state for the next token."
      nodes:
        - id: prev
          label: State S, z from token t−1
          note: fixed size, d × d plus d
          col: 0
          row: 1
          tone: data
        - id: kv
          label: New token's φ(k) and v
          col: 1
          row: 0
        - id: update
          label: "Update: add φ(k)vᵀ and φ(k)"
          col: 2
          row: 1
          tone: accent
        - id: query
          label: New token's φ(q)
          col: 3
          row: 0
        - id: read
          label: "Read: φ(q)ᵀS ÷ φ(q)ᵀz"
          col: 4
          row: 1
        - id: out
          label: Output y for token t
          col: 5
          row: 1
      edges:
        - from: prev
          to: update
        - from: kv
          to: update
        - from: update
          to: read
          label: new state
        - from: query
          to: read
        - from: read
          to: out
        - from: update
          to: prev
          label: carried to token t+1
          dashed: true
          bend: -2
    bridges: []
  - id: linear-attention.s4
    title: What the summary forgets
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.linear-attention
    markdown: |-
      Go back to the prediction. With two tokens, query [1, 0] read token 1's value, 2, exactly. After token 3 arrived with features [1, 1], the same query read 5.5, a blend of tokens 1 and 3. With 2-D features there are only two clean "slots"; every further key overlaps them. A $d$-dimensional feature map can keep at most about $d$ keys cleanly apart, and a long document has far more than $d$ tokens. Softmax's exponential, by contrast, can put nearly all the weight on one matching key among thousands.

      That is why fixed-state models struggle with exact lookups. Jelassi et al. (2024) found transformers far better than fixed-state models at copying long strings and looking up entries in a phone book given in the prompt. Our coding assistant, asked to repeat an exact 30-character function name from 80,000 tokens back, would be taking that test.

      :::mixup "Linear attention computes softmax attention faster."
      With $\varphi = \text{elu} + 1$ it computes a *different* attention, so the model must be trained with it; you can't swap it into a trained softmax model and expect the same outputs. Performer (Choromanski et al., 2020) instead uses random features chosen so that $\varphi(q)\cdot\varphi(k)$ *approximates* $\exp(q \cdot k)$ on average. Either way, the running-state trick itself is exact: both orders of multiplication give the same numbers.
      :::

      So when is it worth it? When sequences are long compared with the head width and the task rewards gist over exact recall: streaming audio, long summaries, generation on memory-limited devices. For 500-token inputs with head width 128, $n/d$ is only about 4, and a well-tuned softmax kernel will likely win. Later designs add a decay factor to the update, $S_t = \gamma S_{t-1} + \dots$, so old entries fade and make room. The state-space lessons that follow develop exactly that idea.
    bridges: []
  - id: linear-attention.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.linear-attention
    markdown: Read outputs from a running state by hand, then judge when linear attention suits a streaming speech model, a tweet classifier, and an exact-lookup task.
    takeaway: |-
      Replace exp(q·k) with φ(q)·φ(k) and attention can keep a running state S = Σ φ(k)vᵀ that every query reads in constant time, like an RNN. The fixed-size state is also its limit: keys start to blur together once there are more of them than feature dimensions.
  - id: linear-attention.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.linear-attention
    markdown: |-
      Some attention rules let past information be stored in reusable sums instead of a growing list of comparisons. This saves work under stated assumptions, but the compressed history may lose details a task needs.
