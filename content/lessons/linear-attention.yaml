schema_version: 0.2-draft
lesson:
  id: linear-attention
  version: 0.1.0-draft
  title: Rearrange attention around a compressed running summary
  state: draft
  summary: Linear-attention methods replace or approximate the attention kernel so sums can be reassociated; they
    reduce sequence-length costs under assumptions while changing the representation and its limits.
  slot: M19.3
  category: learning
  minutes: 12
  sources:
  - title: 'Transformers are RNNs: Fast Autoregressive Transformers with Linear Attention'
    url: https://arxiv.org/abs/2006.16236
  - title: Performer
    url: https://arxiv.org/abs/2009.14794
objectives:
- id: objective.linear-attention
  version: 1-draft
  statement: Linear-attention methods replace or approximate the attention kernel so sums can be reassociated; they
    reduce sequence-length costs under assumptions while changing the representation and its limits.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - linear-attention.base
  - linear-attention.transfer
  prerequisites:
  - anyOf:
    - objective.attention-motivation
  - anyOf:
    - objective.matrices-tensors
scenes:
- id: linear-attention.s1
  title: Start from weighted comparisons
  type: explanation
  depth: intuition
  objective_refs:
  - objective.linear-attention
  markdown: Ordinary softmax attention normalizes exponentiated query-key scores across allowed keys. Some linear-attention
    methods use a feature map phi so similarity is represented by a dot product between transformed queries and
    keys. This enables a different order of multiplication instead of storing all pairwise scores.
  text_mode: Ordinary softmax attention normalizes exponentiated query-key scores across allowed keys. Some linear-attention
    methods use a feature map phi so similarity is represented by a dot product between transformed queries and
    keys. This enables a different order of multiplication instead of storing all pairwise scores.
  bridges: []
- id: linear-attention.s2
  title: Accumulate sufficient intermediate sums
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.linear-attention
  markdown: A causal form can retain S = sum phi(k) v-transpose and z = sum phi(k). A query output uses phi(q)-transpose
    S divided by phi(q)-transpose z, with numerical safeguards. Each new token updates the summaries. Their size
    depends on feature and value dimensions rather than directly on token count.
  text_mode: A causal form can retain S = sum phi(k) v-transpose and z = sum phi(k). A query output uses phi(q)-transpose
    S divided by phi(q)-transpose z, with numerical safeguards. Each new token updates the summaries. Their size
    depends on feature and value dimensions rather than directly on token count.
  bridges:
  - matrices-tensors
- id: linear-attention.s3
  title: Name the approximation or changed kernel
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.linear-attention
  markdown: 'A chosen feature map might define a different attention mechanism or approximate a target kernel. Fixed-size
    summaries compress the past and may struggle with tasks requiring exact item-level retrieval. Linear in sequence
    length does not mean free: feature dimensions and update costs still matter.'
  text_mode: 'A chosen feature map might define a different attention mechanism or approximate a target kernel.
    Fixed-size summaries compress the past and may struggle with tasks requiring exact item-level retrieval. Linear
    in sequence length does not mean free: feature dimensions and update costs still matter.'
  bridges: []
- id: linear-attention.s4
  title: Evaluate the regime that matters
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.linear-attention
  markdown: Compare training, prefill, and decode separately, including numerical stability, quality, and long-context
    behavior. A method with favorable asymptotic growth may lose on small inputs or unsupported hardware. Match
    the actual task and context distribution when judging the tradeoff.
  text_mode: Compare training, prefill, and decode separately, including numerical stability, quality, and long-context
    behavior. A method with favorable asymptotic growth may lose on small inputs or unsupported hardware. Match
    the actual task and context distribution when judging the tradeoff.
  bridges: []
- id: linear-attention.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.linear-attention
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: linear-attention.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.linear-attention
  markdown: Linear-attention methods replace or approximate the attention kernel so sums can be reassociated; they
    reduce sequence-length costs under assumptions while changing the representation and its limits.
  text_mode: Linear-attention methods replace or approximate the attention kernel so sums can be reassociated; they
    reduce sequence-length costs under assumptions while changing the representation and its limits.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - linear-attention.s1
    - linear-attention.s2
