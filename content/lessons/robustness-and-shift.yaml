schema_version: 0.2-draft
lesson:
  id: robustness-and-shift
  version: 0.1.0-draft
  title: Test the rule where conditions change
  state: draft
  summary: Robustness and out-of-distribution evaluation ask how predictions change under specified shifts or perturbations;
    success under one change does not imply universal resilience.
  slot: M09.4
  category: learning
  minutes: 12
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.robustness-and-shift
  version: 1-draft
  statement: Robustness and out-of-distribution evaluation ask how predictions change under specified shifts or
    perturbations; success under one change does not imply universal resilience.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - robustness-and-shift.base
  - robustness-and-shift.transfer
  prerequisites:
  - anyOf:
    - objective.sampling-and-shift
  - anyOf:
    - objective.generalization
scenes:
- id: robustness-and-shift.s1
  title: Specify the change being tested
  type: explanation
  depth: intuition
  objective_refs:
  - objective.robustness-and-shift
  markdown: A shift may involve new lighting, altered class frequency, a different language, or a new causal mechanism.
    A perturbation might be a small bounded change to input values. These are different tests. The phrase robust
    model is incomplete without a threat model or distribution-change description.
  text_mode: A shift may involve new lighting, altered class frequency, a different language, or a new causal mechanism.
    A perturbation might be a small bounded change to input values. These are different tests. The phrase robust
    model is incomplete without a threat model or distribution-change description.
  bridges: []
- id: robustness-and-shift.s2
  title: Find a shortcut with a controlled example
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.robustness-and-shift
  markdown: Suppose every training photo of a boat contains blue water. Evaluate boats on dry land and non-boats
    on blue backgrounds. If predictions follow the background, the model has learned a shortcut relevant to the
    training data but unreliable for the intended object concept.
  text_mode: Suppose every training photo of a boat contains blue water. Evaluate boats on dry land and non-boats
    on blue backgrounds. If predictions follow the background, the model has learned a shortcut relevant to the
    training data but unreliable for the intended object concept.
  bridges: []
- id: robustness-and-shift.s3
  title: Separate detection from successful prediction
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.robustness-and-shift
  markdown: An out-of-distribution detector may flag an unfamiliar input, but detecting shift is not the same as
    predicting correctly under it. Abstention can reduce some errors while creating review workload and coverage
    gaps. Evaluate false alarms, missed shifts, and the behavior of the fallback process.
  text_mode: An out-of-distribution detector may flag an unfamiliar input, but detecting shift is not the same as
    predicting correctly under it. Abstention can reduce some errors while creating review workload and coverage
    gaps. Evaluate false alarms, missed shifts, and the behavior of the fallback process.
  bridges: []
- id: robustness-and-shift.s4
  title: Match remedies to causes
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.robustness-and-shift
  markdown: Augmentation, domain adaptation, causal features, recalibration, and robust optimization address different
    assumptions. Repeated testing on one stress set can overfit that benchmark too. Report the tested changes and
    remaining gaps, and collect fresh evidence when the deployment environment changes materially.
  text_mode: Augmentation, domain adaptation, causal features, recalibration, and robust optimization address different
    assumptions. Repeated testing on one stress set can overfit that benchmark too. Report the tested changes and
    remaining gaps, and collect fresh evidence when the deployment environment changes materially.
  bridges: []
- id: robustness-and-shift.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.robustness-and-shift
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: robustness-and-shift.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.robustness-and-shift
  markdown: Robustness and out-of-distribution evaluation ask how predictions change under specified shifts or perturbations;
    success under one change does not imply universal resilience.
  text_mode: Robustness and out-of-distribution evaluation ask how predictions change under specified shifts or
    perturbations; success under one change does not imply universal resilience.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - robustness-and-shift.s1
    - robustness-and-shift.s2
    - robustness-and-shift.s3
    - robustness-and-shift.s4
    - robustness-and-shift.check
    - robustness-and-shift.recap
    gate_refs:
    - gate.core
assessment_families:
- id: robustness-and-shift.base
  objective_ref: objective.robustness-and-shift
  task: base
  response_type: single_choice
  points: 1
  hint: 'Find a shortcut with a controlled example: trace the inputs, operation, and result before choosing.'
  remediation_scene: robustness-and-shift.s2
  variants:
  - id: robustness-and-shift.base.1
    prompt: What must accompany a robustness claim?
    options:
    - id: a
      text: The specified changes or perturbations tested
    - id: b
      text: Only the model’s parameter count
    - id: c
      text: A statement that all inputs are possible
    answer: a
    feedback: Robustness is relative to a defined evaluation scope.
  - id: robustness-and-shift.base.2
    prompt: A classifier follows the background rather than the object. What does this suggest?
    options:
    - id: b
      text: A proof of object-level causal understanding
    - id: c
      text: A guarantee of transfer
    - id: a
      text: A predictive shortcut
    answer: a
    feedback: The learned association may not match the intended concept.
- id: robustness-and-shift.transfer
  objective_ref: objective.robustness-and-shift
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Match remedies to causes: trace the inputs, operation, and result before choosing.'
  remediation_scene: robustness-and-shift.s4
  variants:
  - id: robustness-and-shift.transfer.1
    prompt: A detector flags an unfamiliar case. Has it solved the prediction task on that case?
    options:
    - id: b
      text: Yes; a flag is always a correct answer
    - id: c
      text: Only if the flag is confident
    - id: a
      text: No; detection and correct prediction differ
    answer: a
    feedback: The downstream task and fallback still need evaluation.
  - id: robustness-and-shift.transfer.2
    prompt: A model passes one corruption benchmark. What broader claim remains unsupported?
    options:
    - id: c
      text: That evaluation inputs were supplied
    - id: a
      text: Resistance to every possible distribution shift
    - id: b
      text: Performance on the tested benchmark
    answer: a
    feedback: Different shifts can challenge different mechanisms.
