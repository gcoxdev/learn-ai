schema_version: 0.2-draft
lesson:
  id: robustness-and-shift
  version: 0.3.0-draft
  title: Test the rule where conditions change
  state: draft
  summary: Change one condition in a familiar task and test whether the learned rule still works.
  slot: M09.4
  category: learning
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.robustness-and-shift
  version: 1-draft
  statement: Robustness and out-of-distribution evaluation ask how predictions change under specified shifts
    or perturbations; success under one change does not imply universal resilience.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - robustness-and-shift.base
  - robustness-and-shift.transfer
  prerequisites:
  - anyOf:
    - objective.sampling-and-shift
  - anyOf:
    - objective.generalization
scenes:
- id: robustness-and-shift.s1
  title: Name the change you want to test
  type: explanation
  depth: intuition
  objective_refs:
  - objective.robustness-and-shift
  markdown: '**Distribution shift** means the pattern of inputs or outcomes differs from the development setting.
    It could involve new lighting, a different language, or a change in how common a class is. **Out-of-distribution**
    cases fall outside the familiar pattern.


    A **perturbation** is a specified input change, such as adding bounded image noise. A **threat model**
    states which changes or attacker capabilities a test covers. Calling a model robust is useful only when
    we say which of these changes it has handled.'
  text_mode: '**Distribution shift** means the pattern of inputs or outcomes differs from the development setting.
    It could involve new lighting, a different language, or a change in how common a class is. **Out-of-distribution**
    cases fall outside the familiar pattern.


    A **perturbation** is a specified input change, such as adding bounded image noise. A **threat model**
    states which changes or attacker capabilities a test covers. Calling a model robust is useful only when
    we say which of these changes it has handled.'
  bridges: []
- id: robustness-and-shift.s2
  title: Find a shortcut with a controlled example
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.robustness-and-shift
  markdown: 'Suppose every training photo of a boat contains blue water. Evaluate boats on dry land and non-boats
    on blue backgrounds. If predictions follow the background, the model has learned a shortcut relevant to
    the training data but unreliable for the intended object concept.


    Keep the boat shape fixed and change only its background when possible. Then keep the background and remove
    the boat. This crossed comparison helps separate reliance on object and scenery. Check that the edited
    pictures still make sense: a poor edit can introduce a new clue and spoil the intended comparison.'
  text_mode: 'Suppose every training photo of a boat contains blue water. Evaluate boats on dry land and non-boats
    on blue backgrounds. If predictions follow the background, the model has learned a shortcut relevant to
    the training data but unreliable for the intended object concept.


    Keep the boat shape fixed and change only its background when possible. Then keep the background and remove
    the boat. This crossed comparison helps separate reliance on object and scenery. Check that the edited
    pictures still make sense: a poor edit can introduce a new clue and spoil the intended comparison.'
  bridges: []
- id: robustness-and-shift.s3
  title: Separate detection from successful prediction
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.robustness-and-shift
  markdown: An out-of-distribution detector may flag an unfamiliar input, but detecting shift is not the same
    as predicting correctly under it. Abstention can reduce some errors while creating review workload and
    coverage gaps. Evaluate false alarms, missed shifts, and the behavior of the fallback process.
  text_mode: An out-of-distribution detector may flag an unfamiliar input, but detecting shift is not the same
    as predicting correctly under it. Abstention can reduce some errors while creating review workload and
    coverage gaps. Evaluate false alarms, missed shifts, and the behavior of the fallback process.
  bridges: []
- id: robustness-and-shift.s4
  title: Match remedies to causes
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.robustness-and-shift
  markdown: Augmentation, domain adaptation, causal features, recalibration, and robust optimization address
    different assumptions. Repeated testing on one stress set can overfit that benchmark too. Report the tested
    changes and remaining gaps, and collect fresh evidence when the deployment environment changes materially.
  text_mode: Augmentation, domain adaptation, causal features, recalibration, and robust optimization address
    different assumptions. Repeated testing on one stress set can overfit that benchmark too. Report the tested
    changes and remaining gaps, and collect fresh evidence when the deployment environment changes materially.
  bridges: []
- id: robustness-and-shift.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.robustness-and-shift
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Test a specific change and report what happened. Recognizing an unfamiliar input, predicting correctly
    on it, and handling it through a fallback are different abilities.
- id: robustness-and-shift.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.robustness-and-shift
  markdown: Test a specific change and report what happened. Recognizing an unfamiliar input, predicting correctly
    on it, and handling it through a fallback are different abilities.
  text_mode: Test a specific change and report what happened. Recognizing an unfamiliar input, predicting correctly
    on it, and handling it through a fallback are different abilities.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - robustness-and-shift.s1
    - robustness-and-shift.s2
    - robustness-and-shift.s3
    - robustness-and-shift.s4
    - robustness-and-shift.check
    gate_refs:
