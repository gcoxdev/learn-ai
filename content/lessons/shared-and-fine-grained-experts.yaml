schema_version: 0.2-draft
lesson:
  id: shared-and-fine-grained-experts
  version: 0.3.0-draft
  title: Separate always-on experts from routed specialists
  state: draft
  summary: DeepSeek-V3 gives each token 1 always-on expert plus 8 picked from 256. See why many small experts beat a few big ones, and how a tiny bias keeps them all busy.
  slot: M18.6
  category: learning
  sources:
    - title: "DeepSeekMoE: Towards Ultimate Expert Specialization in Mixture-of-Experts Language Models (Dai et al., 2024)"
      url: https://arxiv.org/abs/2401.06066
    - title: "DeepSeek-V3 Technical Report (DeepSeek-AI, 2024)"
      url: https://arxiv.org/abs/2412.19437
    - title: "Auxiliary-Loss-Free Load Balancing Strategy for Mixture-of-Experts (Wang et al., 2024)"
      url: https://arxiv.org/abs/2408.15664
objectives:
  - id: objective.shared-and-fine-grained-experts
    version: 2-draft
    statement: MoE designs can combine shared experts with routed experts and vary expert granularity; compare their aggregate widths, active selections, and communication instead of expert count alone.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - shared-and-fine-grained-experts.base.v2
      - shared-and-fine-grained-experts.transfer.v2
      - shared-and-fine-grained-experts.calculate
    prerequisites:
      - anyOf:
          - objective.moe-parameter-accounting
      - anyOf:
          - objective.expert-capacity-and-balance
scenes:
  - id: shared-and-fine-grained-experts.s1
    title: One expert that every token uses
    type: explanation
    depth: intuition
    objective_refs:
      - objective.shared-and-fine-grained-experts
    markdown: |-
      Mixtral's layers have 8 experts, and each token uses 2. DeepSeek-V3's layers look very different: 1 **shared expert** that runs on every token, plus 256 **routed experts**, of which the router picks 8. That's 9 experts per token, each far smaller than Mixtral's.

      These two ideas come from DeepSeekMoE (Dai et al., January 2024). The shared expert is a plain feed-forward network with no gate: it always runs and its output is always added. The authors' reasoning: some knowledge is useful to almost every token. Without a shared expert, many routed experts each learn their own copy of it; with one, routed experts can spend their weights on rarer patterns.

      :::papers A layer with shared and routed experts
      $$h' = h + \sum_{i=1}^{N_s} \text{FFN}^{(s)}_i(h) + \sum_{i=1}^{N_r} g_i\, \text{FFN}^{(r)}_i(h)$$

      $N_s$ shared experts are simply added. $N_r$ routed experts are weighted by gates $g_i$, which are zero except for the $K_r$ chosen ones. In DeepSeek-V3, $N_s = 1$, $N_r = 256$, and $K_r = 8$.
      :::

      :::mixup "Each token uses 8 experts, so count 8 when working out active parameters."
      Count the shared expert too: it runs for every token. DeepSeek-V3 tokens use 9 experts per MoE layer, and that ninth one is never skipped.
      :::
    bridges: []
  - id: shared-and-fine-grained-experts.s2
    title: Cut each expert into smaller pieces
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.shared-and-fine-grained-experts
    markdown: |-
      DeepSeekMoE's second idea is **fine-grained experts**: split each expert into $m$ narrower ones and pick $m$ times as many. The expert's **intermediate width** (the number of hidden units inside its feed-forward network) shrinks by $m$, so parameters and compute don't change.

      Start from a Mixtral-sized layer, width 4,096, with 16 experts and top-2. Split each into $m = 4$ pieces:

      | | 16 coarse experts, top-2 | 64 fine experts, top-8 |
      | --- | ---: | ---: |
      | Intermediate width per expert | 14,336 | 3,584 |
      | Parameters per expert ($3 \times 4{,}096 \times$ width) | 176M | 44M |
      | Parameters used per token | 2 × 176M = 352M | 8 × 44M = 352M |
      | Stored expert parameters | 16 × 176M = 2.8B | 64 × 44M = 2.8B |
      | Possible expert combinations | 120 | 4,426,165,368 |

      Same storage, same compute, but 37 million times as many ways to mix experts. The DeepSeekMoE paper uses exactly this 120 versus 4,426,165,368 example. More combinations let each small expert specialize narrowly while a token still assembles what it needs.

      :::predict Why not split every expert into 100 pieces?
      Each piece's matrix multiplication gets smaller, and small matrix multiplications use a GPU poorly. The router also has more scores to compute, and each token's vector is sent to more experts. Real designs stop well short of that: DeepSeekMoE 16B uses quarter-size experts.
      :::

      So expert count alone hides a lot: DeepSeek-V3's 256 experts each have a width of 2,048, a seventh of Mixtral's 14,336.
    bridges: []
  - id: shared-and-fine-grained-experts.bias
    title: Balance by nudging, not by penalty
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.shared-and-fine-grained-experts
    markdown: |-
      The last lesson's auxiliary loss balances load, but a strong one also pulls the router away from the task. DeepSeek-V3 mostly replaced it with **auxiliary-loss-free balancing** (Wang et al., 2024): each expert gets a bias $b_i$ that is added to its score *only to choose the top-k*. The gate values still come from the original scores.

      After each training step, every overloaded expert's bias goes down by a small step $\gamma$ and every underloaded expert's bias goes up by $\gamma$. (DeepSeek-V3 used $\gamma = 0.001$ for most of training, plus a very small sequence-level balance loss as a backstop.)

      Work one token. DeepSeek-V3 scores experts with a sigmoid, so each score lies between 0 and 1:

      | Expert | E1 | E2 | E3 | E4 |
      | --- | ---: | ---: | ---: | ---: |
      | Score $s_i$ | 0.90 | 0.75 | 0.70 | 0.30 |
      | Bias $b_i$ (E1 has been overloaded) | −0.20 | −0.10 | +0.10 | +0.20 |
      | $s_i + b_i$, used to choose top-2 | 0.70 | 0.65 | **0.80** | 0.50 |

      Without biases the token would go to E1 and E2. With them it goes to E3 and E1. The gates use the original scores, normalized over the chosen pair: $0.70 / (0.70 + 0.90) = 0.4375$ for E3 and $0.90 / 1.60 = 0.5625$ for E1.

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      N, k, T, gamma = 4, 2, 400, 0.05
      skew = np.array([1.0, 0.5, 0.0, -0.5])            # router favors E1, neglects E4
      b = np.zeros(N)                                    # one bias per expert

      for step in range(1, 13):
          s = 1 / (1 + np.exp(-(rng.normal(size=(T, N)) + skew)))   # sigmoid scores
          top = np.argsort(-(s + b), axis=1)[:, :k]      # bias used only to SELECT
          load = np.bincount(top.ravel(), minlength=N)
          b -= gamma * np.sign(load - T * k / N)         # overloaded down, underloaded up
          if step in (1, 2, 4, 8, 12):
              print(f"step {step:2}: loads {load}  biases {b.round(2)}")

      g = np.take_along_axis(s, top, axis=1)             # gates use ORIGINAL scores
      g = g / g.sum(axis=1, keepdims=True)
      print("first token's experts:", top[0] + 1, " gates:", g[0].round(3))
      ```

      The loads start at 322 versus 99 (a fair share is 200) By step 4 all four are within 15 of it, and after that they hover nearby, without any extra loss term. Try `gamma = 0.005`: the loads creep toward even far more slowly, because each nudge is ten times smaller.
    bridges: []
  - id: shared-and-fine-grained-experts.s3
    title: Match the active width before comparing
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.shared-and-fine-grained-experts
    markdown: |-
      When you compare two MoE designs, add up the intermediate widths a token actually uses, shared experts included. One routed expert of width 16 and two routed experts of width 8 both give an active width of 16. Put a shared expert of width 8 in the second design and its active width becomes 24, so it now does 50% more feed-forward work per token.

      DeepSeekMoE 16B shows the bookkeeping. Each layer has 2 shared and 64 routed experts, each a quarter the size of a standard feed-forward block, and each token uses the 2 shared plus 6 routed. That's 8 quarter-size experts, or twice a standard block's work. The model has about 16.4B parameters in total, with about 2.8B active.

      Matching the active width makes a comparison fair on compute. It doesn't mean the two designs will behave the same, because the small experts can be combined in many more ways.
    bridges: []
  - id: shared-and-fine-grained-experts.s4
    title: Test the design, don't trust the labels
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.shared-and-fine-grained-experts
    markdown: |-
      "The shared expert holds common knowledge" is a hypothesis, and the DeepSeekMoE authors tested it the way you should: with **ablations**, training matched models with a piece removed or changed and comparing them. They reported that DeepSeekMoE 2B matched GShard 2.9B, a model with 1.5 times its expert parameters and computation, and that DeepSeekMoE 16B roughly matched LLaMA2 7B with about 40% of its computation.

      Suppose your team adds a shared expert and quality improves. Before crediting "common knowledge," train a model with one extra routed expert per token instead, at the same compute. If it does just as well, the gain came from extra width, not the shared design.

      A quick count shows where DeepSeek-V3's size lives. Each expert has $3 \times 7{,}168 \times 2{,}048 \approx 44$M weights, and there are 257 per layer in 58 MoE layers. That's about 657B of the model's 671B. Each token touches 9 × 58 of them, about 23B; attention, embeddings, and three dense layers make up the rest of its 37B active.
    bridges: []
  - id: shared-and-fine-grained-experts.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.shared-and-fine-grained-experts
    markdown: Count active experts with shared ones included, split experts without changing the budget, and pick experts and gates when biases are in play.
    takeaway: |-
      Shared experts run for every token; routed experts are picked. Splitting experts finer keeps the cost but multiplies the combinations, and a selection-only bias keeps many small experts evenly loaded.
  - id: shared-and-fine-grained-experts.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.shared-and-fine-grained-experts
    markdown: |-
      Include always-on experts as well as selected ones. Compare their widths, operations, and routing combinations; more expert names do not by themselves imply more useful computation.
navigation:
  routes:
