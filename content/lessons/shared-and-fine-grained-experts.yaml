assessment_families:
- id: shared-and-fine-grained-experts.base
  objective_ref: objective.shared-and-fine-grained-experts
  task: base
  response_type: single_choice
  points: 1
  hint: 'Split capacity into smaller experts: trace the inputs, operation, and result before choosing.'
  remediation_scene: shared-and-fine-grained-experts.s2
  variants:
  - id: shared-and-fine-grained-experts.base.1
    prompt: Which tokens use a shared expert in its layer?
    options:
    - id: b
      text: Only one permanently chosen word
    - id: c
      text: Only tokens with unknown spelling
    - id: a
      text: Every token under the stated architecture
    answer: a
    feedback: Shared experts are always-on branches.
  - id: shared-and-fine-grained-experts.base.2
    prompt: Does a larger expert count always mean more parameters?
    options:
    - id: c
      text: Only total vocabulary matters
    - id: a
      text: No; expert widths and other components matter
    - id: b
      text: 'Yes'
    answer: a
    feedback: Granularity changes what one expert contains.
- id: shared-and-fine-grained-experts.transfer
  objective_ref: objective.shared-and-fine-grained-experts
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Test the architectural hypothesis: trace the inputs, operation, and result before choosing.'
  remediation_scene: shared-and-fine-grained-experts.s4
  variants:
  - id: shared-and-fine-grained-experts.transfer.1
    prompt: 'Two selected width-8 experts versus one width-16 expert: what is equal in the toy count?'
    options:
    - id: c
      text: Every communication pattern
    - id: a
      text: Summed selected intermediate width
    - id: b
      text: The complete learned function
    answer: a
    feedback: Matching one resource measure does not imply identical models.
  - id: shared-and-fine-grained-experts.transfer.2
    prompt: How should claimed shared-versus-specialized behavior be checked?
    options:
    - id: a
      text: With ablations and measured routing or behavior
    - id: b
      text: By the expert names alone
    - id: c
      text: By parameter file ordering
    answer: a
    feedback: Architectural intent requires empirical evidence.
