schema_version: 0.2-draft
lesson:
  id: shared-and-fine-grained-experts
  version: 0.1.0-draft
  title: Separate always-on experts from routed specialists
  state: draft
  summary: MoE designs can combine shared experts with routed experts and vary expert granularity; compare their
    aggregate widths, active selections, and communication instead of expert count alone.
  slot: M18.6
  category: learning
  minutes: 12
  sources:
  - title: DeepSeekMoE
    url: https://arxiv.org/abs/2401.06066
objectives:
- id: objective.shared-and-fine-grained-experts
  version: 1-draft
  statement: MoE designs can combine shared experts with routed experts and vary expert granularity; compare their
    aggregate widths, active selections, and communication instead of expert count alone.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - shared-and-fine-grained-experts.base
  - shared-and-fine-grained-experts.transfer
  prerequisites:
  - anyOf:
    - objective.moe-parameter-accounting
  - anyOf:
    - objective.expert-capacity-and-balance
scenes:
- id: shared-and-fine-grained-experts.s1
  title: Always-on and selected branches
  type: explanation
  depth: intuition
  objective_refs:
  - objective.shared-and-fine-grained-experts
  markdown: A shared expert processes every token in the relevant layer, while routed experts process selected assignments.
    Their outputs are combined according to the architecture. Shared experts are distinct from the shared attention
    and normalization components that may already exist outside the MoE block.
  text_mode: A shared expert processes every token in the relevant layer, while routed experts process selected
    assignments. Their outputs are combined according to the architecture. Shared experts are distinct from the
    shared attention and normalization components that may already exist outside the MoE block.
  bridges: []
- id: shared-and-fine-grained-experts.s2
  title: Split capacity into smaller experts
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.shared-and-fine-grained-experts
  markdown: Instead of four wide experts, a design might use more narrow experts and select several per token. This
    increases the number of possible combinations. It also changes kernel sizes, routing overhead, and load patterns,
    so expert count alone does not measure capacity or efficiency.
  text_mode: Instead of four wide experts, a design might use more narrow experts and select several per token.
    This increases the number of possible combinations. It also changes kernel sizes, routing overhead, and load
    patterns, so expert count alone does not measure capacity or efficiency.
  bridges: []
- id: shared-and-fine-grained-experts.s3
  title: Compare a toy active-width budget
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.shared-and-fine-grained-experts
  markdown: 'One selected width-16 expert and two selected width-8 experts have the same summed intermediate width
    in a simplified feed-forward count. They are not automatically equivalent functions: their parameters, routing
    combinations, nonlinearities, and shared branches can differ. Count actual matrix shapes and operations.'
  text_mode: 'One selected width-16 expert and two selected width-8 experts have the same summed intermediate width
    in a simplified feed-forward count. They are not automatically equivalent functions: their parameters, routing
    combinations, nonlinearities, and shared branches can differ. Count actual matrix shapes and operations.'
  bridges: []
- id: shared-and-fine-grained-experts.s4
  title: Test the architectural hypothesis
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.shared-and-fine-grained-experts
  markdown: A design may hope shared computation captures recurring features while routing adds differentiated capacity.
    That is a hypothesis to evaluate with ablations, routing statistics, and task results. Human labels such as
    generalist and specialist should not substitute for measurements of learned behavior.
  text_mode: A design may hope shared computation captures recurring features while routing adds differentiated
    capacity. That is a hypothesis to evaluate with ablations, routing statistics, and task results. Human labels
    such as generalist and specialist should not substitute for measurements of learned behavior.
  bridges: []
- id: shared-and-fine-grained-experts.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.shared-and-fine-grained-experts
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: MoE designs can combine shared experts with routed experts and vary expert granularity; compare their
    aggregate widths, active selections, and communication instead of expert count alone.
- id: shared-and-fine-grained-experts.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.shared-and-fine-grained-experts
  markdown: MoE designs can combine shared experts with routed experts and vary expert granularity; compare their
