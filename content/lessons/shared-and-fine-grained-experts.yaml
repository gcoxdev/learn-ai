assessment_families:
  - id: shared-and-fine-grained-experts.base
    objective_ref: objective.shared-and-fine-grained-experts
    task: base
    response_type: single_choice
    points: 1
    hint: 'Split capacity into smaller experts: trace the inputs, operation, and result before choosing.'
    remediation_scene: shared-and-fine-grained-experts.s2
    variants:
      - id: shared-and-fine-grained-experts.base.1
        prompt: Which tokens use a shared expert in its layer?
        options:
          - id: b
            text: Only one permanently chosen word
          - id: c
            text: Only tokens with unknown spelling
          - id: a
            text: Every token under the stated architecture
        answer: a
        feedback: Shared experts are always-on branches.
        retired: true
      - id: shared-and-fine-grained-experts.base.2
        prompt: Does a larger expert count always mean more parameters?
        options:
          - id: c
            text: Only total vocabulary matters
          - id: a
            text: No; expert widths and other components matter
          - id: b
            text: 'Yes'
        answer: a
        feedback: Granularity changes what one expert contains.
        retired: true
  - id: shared-and-fine-grained-experts.transfer
    objective_ref: objective.shared-and-fine-grained-experts
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Test the architectural hypothesis: trace the inputs, operation, and result before choosing.'
    remediation_scene: shared-and-fine-grained-experts.s4
    variants:
      - id: shared-and-fine-grained-experts.transfer.1
        prompt: 'Two selected width-8 experts versus one width-16 expert: what is equal in the toy count?'
        options:
          - id: c
            text: Every communication pattern
          - id: a
            text: Summed selected intermediate width
          - id: b
            text: The complete learned function
        answer: a
        feedback: Matching one resource measure does not imply identical models.
        retired: true
      - id: shared-and-fine-grained-experts.transfer.2
        prompt: How should claimed shared-versus-specialized behavior be checked?
        options:
          - id: a
            text: With ablations and measured routing or behavior
          - id: b
            text: By the expert names alone
          - id: c
            text: By parameter file ordering
        answer: a
        feedback: Architectural intent requires empirical evidence.
        retired: true
  - id: shared-and-fine-grained-experts.base.v2
    objective_ref: objective.shared-and-fine-grained-experts
    task: base
    response_type: single_choice
    points: 1
    hint: Keep three things apart. Shared experts always run, splitting experts changes their number and size but not the budget, and a balancing bias changes only which experts are chosen.
    remediation_scene: shared-and-fine-grained-experts.s1
    variants:
      - id: shared-and-fine-grained-experts.base.v2.1
        prompt: In a DeepSeekMoE-style layer, what distinguishes a shared expert from a routed one?
        options:
          - id: b
            text: It runs when the router scores it highest, and its gate is set to 1
          - id: a
            text: It runs on each token, and its output is added with no router gate
          - id: c
            text: It is one expert's weights reused in each layer to save memory
        answer: a
        feedback: A shared expert bypasses the router entirely; it always runs and is simply added. It isn't chosen by score, and each layer has its own shared expert with its own weights.
      - id: shared-and-fine-grained-experts.base.v2.2
        prompt: A layer's 16 experts are each split into 4 quarter-width experts, and routing changes from top-2 to top-8. What stays the same?
        options:
          - id: c
            text: Stored parameters stay the same, but active ones grow fourfold
          - id: b
            text: Active parameters stay the same, but stored ones grow fourfold
          - id: a
            text: Both the stored and the active expert parameters stay the same
        answer: a
        feedback: 64 quarter-size experts store as much as 16 full ones, and 8 quarter-size experts do as much work as 2 full ones. What changes is the number of possible combinations, from 120 to about 4.4 billion.
      - id: shared-and-fine-grained-experts.base.v2.3
        prompt: In DeepSeek-V3's auxiliary-loss-free balancing, what does an expert's bias bᵢ change?
        options:
          - id: a
            text: Which experts are chosen, while gates use the original scores
          - id: b
            text: The gate weight of that expert whenever the expert is chosen
          - id: c
            text: The size of a penalty term added to the model's training loss
        answer: a
        feedback: The bias is added to scores only for the top-k choice; the gates are then computed from the unbiased scores. That's what makes it loss-free, unlike the Switch balance loss.
      - id: shared-and-fine-grained-experts.base.v2.4
        prompt: According to the DeepSeekMoE authors, what is the main benefit of fine-grained experts?
        options:
          - id: b
            text: They cut the compute per token by using narrower experts
          - id: c
            text: They shrink the total model by removing duplicate experts
          - id: a
            text: Far more expert combinations, so pieces can specialize narrowly
        answer: a
        feedback: Splitting keeps both compute and storage the same; it multiplies the ways a token can combine experts. Removing duplicated knowledge is the shared expert's job, not the split's.
  - id: shared-and-fine-grained-experts.transfer.v2
    objective_ref: objective.shared-and-fine-grained-experts
    task: transfer
    response_type: single_choice
    points: 1
    hint: Compare designs by the widths a token actually uses, shared experts included, and remember that a balancing bias moves selection, not gate values.
    remediation_scene: shared-and-fine-grained-experts.s3
    variants:
      - id: shared-and-fine-grained-experts.transfer.v2.1
        prompt: 'A slide says: "Model B has 32 experts per layer and Model A has 8, so B is 4 times as big." A uses width-16 experts with top-2; B uses width-4 experts with top-8. What is the best correction?'
        options:
          - id: b
            text: B is 4 times as big but does the same work per token as A
          - id: a
            text: The two store and use the same total expert width per token
          - id: c
            text: B is smaller, because each of its experts is a quarter as wide
        answer: a
        feedback: A stores 8 × 16 = 128 units of width and B stores 32 × 4 = 128; per token A uses 2 × 16 = 32 and B uses 8 × 4 = 32. Expert count alone says nothing about size.
      - id: shared-and-fine-grained-experts.transfer.v2.2
        prompt: Under DeepSeek-V3-style balancing, expert 7 is overloaded for several training steps in a row. What happens?
        options:
          - id: c
            text: Expert 7's gate weights are scaled down whenever it is chosen
          - id: a
            text: Its bias drops by γ each step, so it is chosen less often
          - id: b
            text: Its bias rises by γ each step, so its scores are trusted more
        answer: a
        feedback: Overloaded experts have their bias lowered, which pushes them out of more tokens' top-k lists. Gates still use the original scores, so a token that does choose expert 7 weights it as before.
      - id: shared-and-fine-grained-experts.transfer.v2.3
        prompt: An engineer reports the active expert parameters of a layer with 2 shared and 64 routed experts, top-6, by counting 6 experts. What did the count miss?
        options:
          - id: a
            text: The 2 shared experts, which run on each token as well
          - id: b
            text: The 58 routed experts that the router did not choose
          - id: c
            text: The per-expert biases used to balance the expert loads
        answer: a
        feedback: Each token uses 2 shared + 6 routed = 8 experts. Unchosen routed experts do no work for the token, and biases are single numbers, not parameters that multiply the token.
      - id: shared-and-fine-grained-experts.transfer.v2.4
        prompt: A team adds a shared expert and quality improves. They want to know whether the shared design itself helped. Which test answers that?
        options:
          - id: b
            text: Delete the shared expert from the trained model and measure the drop
          - id: c
            text: Check that the shared expert has the largest weights in the layer
          - id: a
            text: Train a matched model with an extra routed expert per token instead
        answer: a
        feedback: A model given the same extra width as routed experts separates "shared design" from "more compute." Deleting a part from a trained model hurts because the rest learned to rely on it, and weight size says nothing about function.
  - id: shared-and-fine-grained-experts.calculate
    objective_ref: objective.shared-and-fine-grained-experts
    task: base
    response_type: numeric
    points: 1
    hint: Count shared experts plus chosen routed experts. When biases are present, add them to the scores to choose, then compute gates from the original scores of the chosen experts.
    remediation_scene: shared-and-fine-grained-experts.bias
    absolute_tolerance: 0.001
    variants:
      - id: shared-and-fine-grained-experts.calculate.1
        prompt: A layer has 2 shared experts and 64 routed experts, and each token uses the top 6 routed experts. Every expert has 44 million parameters. How many million expert parameters does one token use in this layer?
        answer: 352
        feedback: The token uses 2 shared + 6 routed = 8 experts, and 8 × 44M = 352M.
      - id: shared-and-fine-grained-experts.calculate.2
        prompt: A DeepSeek-V3 MoE layer has 1 shared expert and 256 routed experts, with 8 routed experts chosen per token. Each expert has 44 million parameters. How many million expert parameters does one token use in this layer?
        answer: 396
        feedback: 1 shared + 8 routed = 9 experts, and 9 × 44M = 396M. Forgetting the shared expert gives 352M.
      - id: shared-and-fine-grained-experts.calculate.3
        prompt: A token's sigmoid scores for four experts are [0.90, 0.75, 0.70, 0.30] and the biases are [−0.20, −0.10, +0.10, +0.20]. Top-2 is chosen from score + bias, and gates are the chosen experts' original scores normalized to sum to 1. What is expert 1's gate?
        answer: 0.5625
        feedback: Score + bias is [0.70, 0.65, 0.80, 0.50], so experts 3 and 1 are chosen. Expert 1's gate is 0.90 / (0.90 + 0.70) = 0.5625, from the original scores.
      - id: shared-and-fine-grained-experts.calculate.4
        prompt: A token's sigmoid scores for four experts are [0.80, 0.60, 0.50, 0.40] and the biases are [0, 0, +0.20, 0]. Top-2 is chosen from score + bias, and gates are the chosen experts' original scores normalized to sum to 1. What is expert 3's gate?
        answer: 0.3846
        feedback: Score + bias is [0.80, 0.60, 0.70, 0.40], so experts 1 and 3 are chosen. Expert 3's gate is 0.50 / (0.80 + 0.50) ≈ 0.3846, using its original score of 0.50, not 0.70.
      - id: shared-and-fine-grained-experts.calculate.5
        prompt: Each of 16 experts with 200 million parameters is split into 4 equal fine-grained experts. How many million parameters does each new expert have?
        answer: 50
        feedback: 200M ÷ 4 = 50M per piece. There are now 64 experts, still 3.2 billion parameters in total.
