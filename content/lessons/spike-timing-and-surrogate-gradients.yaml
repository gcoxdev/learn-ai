  version: 0.3.0-draft
  title: Learn with spike timing or an approximate backward signal
  state: draft
  summary: Distinguish learning from spike timing from learning with an approximate gradient.
  slot: M37.5
  category: learning
  sources:
  - title: Neuronal Dynamics
    url: https://neuronaldynamics.epfl.ch/online/
  - title: Surrogate Gradient Learning
    url: https://arxiv.org/abs/1901.09948
objectives:
- id: objective.spike-timing-and-surrogate-gradients
  version: 1-draft
  statement: STDP changes synapses using relative spike timing, while surrogate-gradient methods replace an
    unhelpful spike derivative during training; these are distinct learning mechanisms with different biological
    and optimization assumptions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - spike-timing-and-surrogate-gradients.base
  - spike-timing-and-surrogate-gradients.transfer
  prerequisites:
  - anyOf:
    - objective.integrate-and-fire-neurons
  - anyOf:
    - objective.hebbian-and-local-learning
  - anyOf:
    - objective.automatic-differentiation
scenes:
- id: spike-timing-and-surrogate-gradients.s1
  title: Use relative timing as a local signal
  type: explanation
  depth: intuition
  objective_refs:
  - objective.spike-timing-and-surrogate-gradients
  markdown: '**Spike-timing-dependent plasticity**, or **STDP**, changes a connection according to the relative
    timing of input-side and receiving-side spikes. **Plasticity** means the connection can change.


    In one common pair-based rule, an input spike shortly before a receiving-side spike strengthens the connection,
    called **potentiation**. The reverse order weakens it, called **depression**. This basic rule needs spike
    timings rather than a correct-answer label.


    The time window and sign depend on the model and biological conditions. The example illustrates one rule,
    not a universal law of synaptic learning.'
