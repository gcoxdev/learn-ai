- id: spike-timing-and-surrogate-gradients.s4
  title: Compare what signals are available
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.spike-timing-and-surrogate-gradients
  markdown: Local timing rules use nearby activity; surrogate backpropagation can use a global task loss across
    time. Reward-modulated and hybrid methods add other signals. Evaluate task quality, stability, memory,
    and hardware cost, and distinguish computational usefulness from biological plausibility.
  text_mode: Local timing rules use nearby activity; surrogate backpropagation can use a global task loss across
