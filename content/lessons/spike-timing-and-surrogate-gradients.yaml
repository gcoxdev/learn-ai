  remediation_scene: spike-timing-and-surrogate-gradients.s2
  variants:
  - id: spike-timing-and-surrogate-gradients.base.1
    prompt: Pre at 10 ms, post at 12 ms gives post-minus-pre delta t what?
    options:
    - id: b
      text: -2 ms
    - id: c
      text: 22 ms
    - id: a
      text: 2 ms
    answer: a
    feedback: Subtract the pre-spike time from the post-spike time.
  - id: spike-timing-and-surrogate-gradients.base.2
    prompt: Is the common STDP timing window universal across all synapses?
    options:
    - id: c
      text: Only if spikes are binary
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Biological and model rules vary.
