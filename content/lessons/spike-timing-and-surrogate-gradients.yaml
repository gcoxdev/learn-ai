- id: spike-timing-and-surrogate-gradients.s2
  title: Trace the timing convention
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.spike-timing-and-surrogate-gradients
  markdown: Define delta t as post-spike time minus pre-spike time. A pre-spike at 10 ms and post-spike at
    12 ms gives delta t = 2 ms. Under the stated causal-potentiation rule, the change is positive; reversing
    the spike order moves to the other side of the window.
  text_mode: Define delta t as post-spike time minus pre-spike time. A pre-spike at 10 ms and post-spike at
    12 ms gives delta t = 2 ms. Under the stated causal-potentiation rule, the change is positive; reversing
    the spike order moves to the other side of the window.
  bridges:
  - derivatives
- id: spike-timing-and-surrogate-gradients.s3
  title: Train through a discontinuous spike
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.spike-timing-and-surrogate-gradients
  markdown: 'A hard threshold has a derivative that is zero almost everywhere and undefined at the threshold.
    Surrogate-gradient training uses a convenient smooth backward approximation while often retaining discrete
    spikes in the forward pass. This is an optimization choice, not the exact derivative of the original spike
    function.


    For a threshold at 1, voltages 0.8 and 0.9 both produce output zero, while 1.1 produces one. The exact
    output stays flat between crossings, so an ordinary derivative there gives no useful small-change signal.
    A surrogate backward rule supplies one near the threshold so a task error can guide training. It leaves
    the forward spike rule discrete in this example.'
