      - id: spike-timing-and-surrogate-gradients.transfer.1
        prompt: What does a surrogate gradient replace?
        options:
          - id: c
            text: The dataset labels automatically
          - id: a
            text: The problematic backward derivative of the spike operation
          - id: b
            text: Every forward spike necessarily
        answer: a
        feedback: Training uses an approximate differentiable signal.
        retired: true
      - id: spike-timing-and-surrogate-gradients.transfer.2
        prompt: Does surrogate backpropagation use exactly the same learning information as a local pair-based STDP rule?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if both update weights
        answer: a
        feedback: Global losses and local timing provide different signals.
        retired: true
  - id: spike-timing-and-surrogate-gradients.base.v2
    objective_ref: objective.spike-timing-and-surrogate-gradients
    task: base
    response_type: single_choice
    points: 1
    hint: "For STDP, compute Δt = t_post − t_pre first: positive strengthens, negative weakens. For surrogate gradients, the forward pass keeps real spikes and only dS/dV in the backward pass is replaced."
    remediation_scene: spike-timing-and-surrogate-gradients.s3
    variants:
      - id: spike-timing-and-surrogate-gradients.base.v2.1
        prompt: A presynaptic neuron fires at 42 ms and the postsynaptic neuron fires at 35 ms. Under the standard pair-based STDP rule, what happens to their connection?
        options:
          - id: b
            text: It strengthens, since the two spikes are only 7 ms apart
          - id: a
            text: It weakens, since Δt = 35 − 42 = −7 ms means post fired first
          - id: c
            text: It is unchanged, since STDP needs pre to fire before post
        answer: a
        feedback: Δt = t_post − t_pre = −7 ms, the anti-causal order, which gives depression of about A₋e^(−7/τ₋). Closeness alone doesn't decide the sign, and the rule does act on reversed pairs.
      - id: spike-timing-and-surrogate-gradients.base.v2.2
        prompt: Why does ordinary backpropagation fail to train a network of spiking neurons with hard thresholds?
        options:
          - id: c
            text: Spikes are binary numbers, and gradients need real-valued inputs
          - id: b
            text: Spiking networks have no loss function to differentiate
          - id: a
            text: The step's derivative is zero almost everywhere, so gradients vanish
        answer: a
        feedback: dS/dV is 0 except at the threshold, so every chain-rule product through a spike is 0 and the weights never move. Binary values can still be used in a loss, and you can define a loss on a spiking network's output.
      - id: spike-timing-and-surrogate-gradients.base.v2.3
        prompt: During surrogate-gradient training, what does the network compute in the forward pass?
        options:
          - id: a
            text: Real all-or-nothing spikes, exactly as it would after training
          - id: b
            text: Smooth sigmoid outputs, which are rounded into spikes afterward
          - id: c
            text: Voltages only, since spikes are generated during the backward pass
        answer: a
        feedback: Only the backward pass changes; the forward pass is a genuine spiking network, which is why the trained weights can run on spiking hardware. Replacing forward spikes with sigmoids would train a different network.
      - id: spike-timing-and-surrogate-gradients.base.v2.4
        prompt: Two synapses use the same STDP rule with A₊ = 0.010 and τ = 20 ms. One sees pre-before-post pairs 5 ms apart; the other sees pairs 30 ms apart. Which strengthens more per pair?
        options:
          - id: b
            text: The 30 ms pairs, since longer gaps give the synapse more time
          - id: a
            text: The 5 ms pairs, since the change fades exponentially with the gap
          - id: c
            text: Both equally, since both pairs are in the causal order
        answer: a
        feedback: Δw = A₊e^(−Δt/τ₊) gives 0.0078 at 5 ms and 0.0022 at 30 ms. The order sets the sign, and the gap sets the size.
  - id: spike-timing-and-surrogate-gradients.transfer.v2
    objective_ref: objective.spike-timing-and-surrogate-gradients
    task: transfer
    response_type: single_choice
    points: 1
    hint: "Ask what learning signal is available. With labels and a GPU before deployment, surrogate gradients fit; with only local spike times on the device, STDP fits. The surrogate bump is largest near threshold."
    remediation_scene: spike-timing-and-surrogate-gradients.s4
    variants:
      - id: spike-timing-and-surrogate-gradients.transfer.v2.1
        prompt: A spiking vibration sensor on a bridge must keep adapting to its own inputs for years, with no labels and no connection to a server. Which learning rule fits?
        options:
          - id: a
            text: A local STDP-style rule that runs on the sensor chip
          - id: b
            text: Surrogate-gradient training on the sensor's own chip
          - id: c
            text: Surrogate-gradient training on a GPU once a year
        answer: a
        feedback: With no labels and no backward pass available, a local rule that needs only spike times is the practical choice. Surrogate gradients need a task loss, and yearly retraining can't adapt continuously.
      - id: spike-timing-and-surrogate-gradients.transfer.v2.2
        prompt: A team trains a spiking keyword detector with surrogate gradients. Many output neurons have voltages far below threshold for every input, and their weights barely change. What is the likely cause?
        options:
          - id: c
            text: The loss is too small for these neurons to affect it
          - id: a
            text: The surrogate bump is tiny far from threshold, so their gradients are too
          - id: b
            text: The forward pass uses real spikes, which carry no gradient
        answer: a
        feedback: The bump 1/(1 + β|V − θ|)² falls off fast away from threshold, so silent neurons get almost no signal. Better initialization or a wider bump (smaller β) keeps voltages where the surrogate is useful.
      - id: spike-timing-and-surrogate-gradients.transfer.v2.3
        prompt: A lab's code defines Δt = t_pre − t_post, but copies STDP parameters from a paper that uses Δt = t_post − t_pre. What will happen to causal (pre-before-post) pairs?
        options:
          - id: b
            text: They'll strengthen as intended, since the exponential is symmetric
          - id: c
            text: They'll be ignored, since Δt becomes zero for every pair
          - id: a
            text: They'll weaken instead of strengthen, since Δt's sign is flipped
        answer: a
        feedback: Swapping the definition flips the sign of Δt, so causal pairs land on the depression side of the window. Check the convention before reusing parameters.
      - id: spike-timing-and-surrogate-gradients.transfer.v2.4
        prompt: A startup trains a spiking gesture classifier on labeled data and wants to run it on a neuromorphic chip. Which workflow matches common practice?
        options:
          - id: a
            text: Train with surrogate gradients on a GPU, then copy the weights to the chip
          - id: b
            text: Train with STDP on the chip, since gradients can't be used with spikes
          - id: c
            text: Train a standard network with sigmoids and deploy it on the chip as is
        answer: a
        feedback: Surrogate gradients train accurately on labeled data, and the resulting network uses real spikes, so it runs on spiking hardware. Gradients can be used with a surrogate, and a sigmoid network isn't a spiking one.
  - id: spike-timing-and-surrogate-gradients.calculate
    objective_ref: objective.spike-timing-and-surrogate-gradients
    task: base
    response_type: numeric
    points: 1
    hint: "Δt = t_post − t_pre. If positive, Δw = A₊e^(−Δt/τ₊); if negative, Δw = −A₋e^(Δt/τ₋). Surrogate bump: 1/(1 + β|V − θ|)²."
    remediation_scene: spike-timing-and-surrogate-gradients.s1
    absolute_tolerance: 0.01
    variants:
      - id: spike-timing-and-surrogate-gradients.calculate.1
        prompt: With A₊ = 1.0 and τ₊ = 20 ms, a presynaptic spike at 20 ms is followed by a postsynaptic spike at 30 ms. What is Δw?
        answer: 0.61
        feedback: Δt = 30 − 20 = +10 ms, so Δw = 1.0 × e^(−0.5) ≈ 0.61.
      - id: spike-timing-and-surrogate-gradients.calculate.2
        prompt: With A₋ = 1.2 and τ₋ = 20 ms, a presynaptic spike at 30 ms comes after a postsynaptic spike at 20 ms. What is Δw?
        answer: -0.73
        feedback: Δt = 20 − 30 = −10 ms, so Δw = −1.2 × e^(−0.5) ≈ −0.73.
      - id: spike-timing-and-surrogate-gradients.calculate.3
        prompt: With A₊ = 1.0 and τ₊ = 20 ms, a presynaptic spike at 5 ms is followed by a postsynaptic spike at 20 ms. What is Δw?
        answer: 0.47
        feedback: Δt = +15 ms, so Δw = e^(−0.75) ≈ 0.47.
      - id: spike-timing-and-surrogate-gradients.calculate.4
        prompt: A surrogate gradient uses 1/(1 + β|V − θ|)² with β = 5 and θ = 1. What is its value at V = 0.8?
        answer: 0.25
        feedback: 5 × |0.8 − 1| = 1, so the bump is 1 / 2² = 0.25.
      - id: spike-timing-and-surrogate-gradients.calculate.5
        prompt: A neuron should have spiked but didn't, so dL/dS = −1. Its voltage is 0.9, the surrogate bump there is 0.444, and the input on one synapse is x = 2. What is the surrogate estimate of dL/dw for that synapse?
        answer: -0.89
        feedback: dL/dw ≈ (−1) × 0.444 × 2 ≈ −0.89. Gradient descent then raises the weight.
