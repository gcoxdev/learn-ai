assessment_families:
- id: spike-timing-and-surrogate-gradients.base
  objective_ref: objective.spike-timing-and-surrogate-gradients
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace the timing convention: trace the inputs, operation, and result before choosing.'
  remediation_scene: spike-timing-and-surrogate-gradients.s2
  variants:
  - id: spike-timing-and-surrogate-gradients.base.1
    prompt: Pre at 10 ms, post at 12 ms gives post-minus-pre delta t what?
    options:
    - id: b
      text: -2 ms
    - id: c
      text: 22 ms
    - id: a
      text: 2 ms
    answer: a
    feedback: Subtract the pre-spike time from the post-spike time.
  - id: spike-timing-and-surrogate-gradients.base.2
    prompt: Is the common STDP timing window universal across all synapses?
    options:
    - id: c
      text: Only if spikes are binary
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Biological and model rules vary.
- id: spike-timing-and-surrogate-gradients.transfer
  objective_ref: objective.spike-timing-and-surrogate-gradients
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Compare what signals are available: trace the inputs, operation, and result before choosing.'
  remediation_scene: spike-timing-and-surrogate-gradients.s4
  variants:
  - id: spike-timing-and-surrogate-gradients.transfer.1
    prompt: What does a surrogate gradient replace?
    options:
    - id: c
      text: The dataset labels automatically
    - id: a
      text: The problematic backward derivative of the spike operation
    - id: b
      text: Every forward spike necessarily
    answer: a
    feedback: Training uses an approximate differentiable signal.
  - id: spike-timing-and-surrogate-gradients.transfer.2
    prompt: Does surrogate backpropagation use exactly the same learning information as a local pair-based STDP
      rule?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if both update weights
    answer: a
    feedback: Global losses and local timing provide different signals.
