schema_version: 0.2-draft
lesson:
  id: spike-timing-and-surrogate-gradients
  version: 0.1.0-draft
  title: Learn with spike timing or an approximate backward signal
  state: draft
  summary: STDP changes synapses using relative spike timing, while surrogate-gradient methods replace an unhelpful
    spike derivative during training; these are distinct learning mechanisms with different biological and optimization
    assumptions.
  slot: M37.5
  category: learning
  minutes: 12
  sources:
  - title: Neuronal Dynamics
    url: https://neuronaldynamics.epfl.ch/online/
  - title: Surrogate Gradient Learning
    url: https://arxiv.org/abs/1901.09948
objectives:
- id: objective.spike-timing-and-surrogate-gradients
  version: 1-draft
  statement: STDP changes synapses using relative spike timing, while surrogate-gradient methods replace an unhelpful
    spike derivative during training; these are distinct learning mechanisms with different biological and optimization
    assumptions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - spike-timing-and-surrogate-gradients.base
  - spike-timing-and-surrogate-gradients.transfer
  prerequisites:
  - anyOf:
    - objective.integrate-and-fire-neurons
  - anyOf:
    - objective.hebbian-and-local-learning
  - anyOf:
    - objective.automatic-differentiation
scenes:
- id: spike-timing-and-surrogate-gradients.s1
  title: Use relative timing as a local signal
  type: explanation
  depth: intuition
  objective_refs:
  - objective.spike-timing-and-surrogate-gradients
  markdown: A common pair-based STDP model strengthens a connection when a presynaptic spike shortly precedes a
    postsynaptic one and weakens it for the reverse ordering. The timing window and sign vary across models and
    biological conditions. One simplified rule is not a universal law of synaptic plasticity.
  text_mode: A common pair-based STDP model strengthens a connection when a presynaptic spike shortly precedes a
    postsynaptic one and weakens it for the reverse ordering. The timing window and sign vary across models and
    biological conditions. One simplified rule is not a universal law of synaptic plasticity.
  bridges: []
- id: spike-timing-and-surrogate-gradients.s2
  title: Trace the timing convention
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.spike-timing-and-surrogate-gradients
  markdown: Define delta t as post-spike time minus pre-spike time. A pre-spike at 10 ms and post-spike at 12 ms
    gives delta t = 2 ms. Under the stated causal-potentiation rule, the change is positive; reversing the spike
    order moves to the other side of the window.
  text_mode: Define delta t as post-spike time minus pre-spike time. A pre-spike at 10 ms and post-spike at 12 ms
    gives delta t = 2 ms. Under the stated causal-potentiation rule, the change is positive; reversing the spike
    order moves to the other side of the window.
  bridges:
  - derivatives
- id: spike-timing-and-surrogate-gradients.s3
  title: Train through a discontinuous spike
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.spike-timing-and-surrogate-gradients
  markdown: A hard threshold has a derivative that is zero almost everywhere and undefined at the threshold. Surrogate-gradient
    training uses a convenient smooth backward approximation while often retaining discrete spikes in the forward
    pass. This is an optimization choice, not the exact derivative of the original spike function.
  text_mode: A hard threshold has a derivative that is zero almost everywhere and undefined at the threshold. Surrogate-gradient
    training uses a convenient smooth backward approximation while often retaining discrete spikes in the forward
    pass. This is an optimization choice, not the exact derivative of the original spike function.
  bridges: []
- id: spike-timing-and-surrogate-gradients.s4
  title: Compare what signals are available
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.spike-timing-and-surrogate-gradients
  markdown: Local timing rules use nearby activity; surrogate backpropagation can use a global task loss across
    time. Reward-modulated and hybrid methods add other signals. Evaluate task quality, stability, memory, and hardware
    cost, and distinguish computational usefulness from biological plausibility.
  text_mode: Local timing rules use nearby activity; surrogate backpropagation can use a global task loss across
    time. Reward-modulated and hybrid methods add other signals. Evaluate task quality, stability, memory, and hardware
    cost, and distinguish computational usefulness from biological plausibility.
  bridges: []
