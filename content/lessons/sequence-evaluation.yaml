schema_version: 0.2-draft
lesson:
  id: sequence-evaluation
  version: 0.1.0-draft
  title: Judge quality across time, languages, and delay
  state: draft
  summary: Sequence evaluation must consider alignment, meaning, robustness, timing, and subgroup coverage; a single
    aggregate metric rarely captures the full user task.
  slot: M13.8
  category: learning
  minutes: 12
  sources:
  - title: Speech and Language Processing — authors’ draft
    url: https://web.stanford.edu/~jurafsky/slp3/
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.sequence-evaluation
  version: 1-draft
  statement: Sequence evaluation must consider alignment, meaning, robustness, timing, and subgroup coverage; a
    single aggregate metric rarely captures the full user task.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - sequence-evaluation.base
  - sequence-evaluation.transfer
  prerequisites:
  - anyOf:
    - objective.speech-recognition
  - anyOf:
    - objective.speech-and-audio-generation
  - anyOf:
    - objective.time-series
scenes:
- id: sequence-evaluation.s1
  title: A sequence has structure beyond its parts
  type: explanation
  depth: intuition
  objective_refs:
  - objective.sequence-evaluation
  markdown: One incorrect word can reverse meaning while several harmless wording changes produce a large edit distance.
    A forecast can have low average error yet miss a peak that matters operationally. Evaluate the sequence against
    the use case, including how errors accumulate or change later behavior.
  text_mode: One incorrect word can reverse meaning while several harmless wording changes produce a large edit
    distance. A forecast can have low average error yet miss a peak that matters operationally. Evaluate the sequence
    against the use case, including how errors accumulate or change later behavior.
  bridges: []
- id: sequence-evaluation.s2
  title: Pair quality with time
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sequence-evaluation
  markdown: For a streaming recognizer, latency may include capture, buffering, computation, and stabilization of
    partial text. A system can emit an early guess quickly but revise it repeatedly. Report the delay definition
    and whether final accuracy is measured after unlimited future context or under the actual streaming constraint.
  text_mode: For a streaming recognizer, latency may include capture, buffering, computation, and stabilization
    of partial text. A system can emit an early guess quickly but revise it repeatedly. Report the delay definition
    and whether final accuracy is measured after unlimited future context or under the actual streaming constraint.
  bridges: []
- id: sequence-evaluation.s3
  title: Check language and condition coverage
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sequence-evaluation
  markdown: Aggregate multilingual scores can hide languages with sparse data, different writing systems, or inconsistent
    normalization. Audio quality can vary by accent, speaking rate, background noise, and overlapping speakers.
    Compare these conditions with sufficient samples and respect the intended population rather than assuming one
    language stands for all.
  text_mode: Aggregate multilingual scores can hide languages with sparse data, different writing systems, or inconsistent
    normalization. Audio quality can vary by accent, speaking rate, background noise, and overlapping speakers.
    Compare these conditions with sufficient samples and respect the intended population rather than assuming one
    language stands for all.
  bridges: []
- id: sequence-evaluation.s4
  title: Use a portfolio of evidence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sequence-evaluation
  markdown: Combine suitable automatic metrics with targeted human review and failure analysis. Record reference
    ambiguity, normalization, streaming settings, and confidence intervals. A system should also have an appropriate
    response to unsupported inputs, silence, or severe uncertainty instead of being rewarded solely for producing
    output.
  text_mode: Combine suitable automatic metrics with targeted human review and failure analysis. Record reference
    ambiguity, normalization, streaming settings, and confidence intervals. A system should also have an appropriate
    response to unsupported inputs, silence, or severe uncertainty instead of being rewarded solely for producing
    output.
  bridges: []
- id: sequence-evaluation.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.sequence-evaluation
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Sequence evaluation must consider alignment, meaning, robustness, timing, and subgroup coverage; a single
    aggregate metric rarely captures the full user task.
- id: sequence-evaluation.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.sequence-evaluation
  markdown: Sequence evaluation must consider alignment, meaning, robustness, timing, and subgroup coverage; a single
    aggregate metric rarely captures the full user task.
  text_mode: Sequence evaluation must consider alignment, meaning, robustness, timing, and subgroup coverage; a
    single aggregate metric rarely captures the full user task.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - sequence-evaluation.s1
    - sequence-evaluation.s2
    - sequence-evaluation.s3
    - sequence-evaluation.s4
    - sequence-evaluation.check
    gate_refs:
    - gate.core
  scene_aliases:
    sequence-evaluation.recap: sequence-evaluation.check
assessment_families:
- id: sequence-evaluation.base
  objective_ref: objective.sequence-evaluation
  task: base
  response_type: single_choice
  points: 1
  hint: 'Pair quality with time: trace the inputs, operation, and result before choosing.'
  remediation_scene: sequence-evaluation.s2
  variants:
  - id: sequence-evaluation.base.1
    prompt: Does low average forecast error guarantee accurate rare peaks?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if the average is a decimal
    answer: a
    feedback: Averages can hide errors in consequential regimes.
  - id: sequence-evaluation.base.2
    prompt: What can partial-transcript instability add beyond first-output latency?
    options:
    - id: b
      text: A guaranteed improvement in every final score
    - id: c
      text: Only a larger vocabulary
    - id: a
      text: Repeated revisions that affect usability
    answer: a
    feedback: Users experience both delay and the stability of intermediate output.
- id: sequence-evaluation.transfer
  objective_ref: objective.sequence-evaluation
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Use a portfolio of evidence: trace the inputs, operation, and result before choosing.'
  remediation_scene: sequence-evaluation.s4
  variants:
  - id: sequence-evaluation.transfer.1
    prompt: A multilingual average is strong but one language performs poorly. What should reporting include?
    options:
    - id: b
      text: Only the overall average
    - id: c
      text: A claim that all languages are equivalent
    - id: a
      text: Language-level results and uncertainty
    answer: a
    feedback: Aggregate performance can conceal uneven coverage.
  - id: sequence-evaluation.transfer.2
    prompt: A speech system outputs words during silence. What failure should be evaluated?
    options:
    - id: c
      text: Only a formatting issue
    - id: a
      text: Unsupported output or hallucination under no-speech input
    - id: b
      text: A successful transcription by definition
    answer: a
    feedback: The task includes deciding whether there is evidence for speech.
