assessment_families:
  - id: reinforcement-learning-loop.base
    objective_ref: objective.reinforcement-learning-loop
    task: base
    response_type: single_choice
    points: 1
    hint: 'Add future rewards into a return: trace the inputs, operation, and result before choosing.'
    remediation_scene: reinforcement-learning-loop.s2
    variants:
      - id: reinforcement-learning-loop.base.1
        prompt: Rewards 1 then 2 with discount 0.5 give return what?
        options:
          - id: c
            text: '1.5'
          - id: a
            text: '2'
          - id: b
            text: '3'
        answer: a
        feedback: The second reward is weighted by one-half.
        retired: true
      - id: reinforcement-learning-loop.base.2
        prompt: What maps available information to action choices?
        options:
          - id: a
            text: The policy
          - id: b
            text: Only the final dataset hash
          - id: c
            text: The loss plot alone
        answer: a
        feedback: A policy defines decision behavior.
        retired: true
  - id: reinforcement-learning-loop.transfer
    objective_ref: objective.reinforcement-learning-loop
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Define the experiment completely: trace the inputs, operation, and result before choosing.'
    remediation_scene: reinforcement-learning-loop.s4
    variants:
      - id: reinforcement-learning-loop.transfer.1
        prompt: Why does an RL policy affect its training data?
        options:
          - id: a
            text: Its actions influence future visited situations
          - id: b
            text: It always receives a fixed independent label table
          - id: c
            text: Rewards never depend on actions
        answer: a
        feedback: Interaction couples behavior and observations.
        retired: true
      - id: reinforcement-learning-loop.transfer.2
        prompt: Does high simulator reward guarantee real-world success?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if the agent is neural
          - id: a
            text: 'No'
        answer: a
        feedback: Transfer depends on how simulation and real conditions differ.
        retired: true
  - id: reinforcement-learning-loop.base.v2
    objective_ref: objective.reinforcement-learning-loop
    task: base
    response_type: single_choice
    points: 1
    hint: Match each option to one part of the loop (state, action, reward, policy), then ask which part the question is about.
    remediation_scene: reinforcement-learning-loop.s1
    variants:
      - id: reinforcement-learning-loop.base.v2.1
        prompt: A smart thermostat learns when to heat a house. Each hour it chooses "heat" or "wait", and it receives −1 per unit of energy used and −5 whenever someone overrides it by hand. In this setup, what is the reward?
        options:
          - id: b
            text: Its rule for deciding between heat and wait
          - id: a
            text: The −1 per energy unit and −5 per override
          - id: c
            text: The room temperature it reads each hour
        answer: a
        feedback: The reward is the number that scores each step. The rule for choosing is the policy, and the temperature reading is an observation of the state.
      - id: reinforcement-learning-loop.base.v2.2
        prompt: A chess-playing agent gets +1 for a win and −1 for a loss. Which part of this agent is its policy?
        options:
          - id: c
            text: The +1 or −1 it receives when a game ends
          - id: b
            text: The current arrangement of pieces on the board
          - id: a
            text: The rule that picks a move for each board position
        answer: a
        feedback: A policy maps situations to actions. The board arrangement is the state, and the +1 or −1 is the reward that the policy is trying to earn.
      - id: reinforcement-learning-loop.base.v2.3
        prompt: From the doorway, both of Pip's possible first moves cost −1. One leads toward the dock; the other leads into a dead-end bathroom. What lets a learner tell these two moves apart?
        options:
          - id: a
            text: The return, which counts the +10 docking reward later
          - id: b
            text: The immediate reward, averaged over more trials
          - id: c
            text: The observation Pip's sensors make after the move
        answer: a
        feedback: Both moves have the same immediate reward, so averaging it more carefully still gives −1 each. Only the return includes what happens afterwards, where the +10 separates the routes.
      - id: reinforcement-learning-loop.base.v2.4
        prompt: A spam filter learns from emails labeled "spam" or "not spam". A game agent learns from points. What does the game agent's feedback lack that the filter's labels provide?
        options:
          - id: b
            text: A number that scores how well each step went
          - id: c
            text: Examples drawn from the situations it will face
          - id: a
            text: The correct action to take in each situation
        answer: a
        feedback: A reward scores what happened but never says which action would have been best. The game agent does get a score, and its data does come from real play; what's missing is the answer key.
  - id: reinforcement-learning-loop.transfer.v2
    objective_ref: objective.reinforcement-learning-loop
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what the agent is actually rewarded for and what it has actually experienced, not what the designer hoped.
    remediation_scene: reinforcement-learning-loop.s4
    variants:
      - id: reinforcement-learning-loop.transfer.v2.1
        prompt: A warehouse robot earns +1 each time it scans a package. After training, it scans the same package over and over. What is the best explanation?
        options:
          - id: c
            text: Its discount factor is too low to value later packages
          - id: a
            text: The reward counts scans, so rescanning earns reward
          - id: b
            text: It needs more exploration to find other packages
        answer: a
        feedback: This is reward hacking. The robot found the cheapest way to earn exactly what the reward counts. A different discount or more exploration would still leave rescanning as a winning strategy; the fix is to reward packages delivered.
      - id: reinforcement-learning-loop.transfer.v2.2
        prompt: A delivery-drone policy trained in a simulation of one city earns high returns there. What is the most informative next test before trusting it?
        options:
          - id: a
            text: Run it in simulated cities it never trained in, over several seeds
          - id: b
            text: Train it for longer in the same city until returns stop rising
          - id: c
            text: Report the return from the single best training run so far
        answer: a
        feedback: New layouts and repeated seeds show whether the policy learned something general or memorized one map. Training longer or picking the best run tells you more about that one city, not about new ones.
      - id: reinforcement-learning-loop.transfer.v2.3
        prompt: A music service's recommender learns from which songs users skip. Why can't its logs be treated like a fixed supervised dataset?
        options:
          - id: b
            text: Skips are negative, and supervised learning needs positive labels
          - id: a
            text: Its own recommendations decided which songs got any feedback
          - id: c
            text: The logs are too large to fit in memory for one training run
        answer: a
        feedback: The agent's actions shape its data, just as Pip's route decides which rooms it learns about. Songs it never played have no feedback at all. Negative feedback is fine for learning, and log size is an engineering issue, not the core difference.
      - id: reinforcement-learning-loop.transfer.v2.4
        prompt: In a puzzle game, grabbing a coin now gives +1, while carrying a key for five more moves opens a vault worth +20. Which quantity should the agent maximize to choose well?
        options:
          - id: a
            text: The expected discounted return from this point on
          - id: c
            text: The reward it will receive on the very next move
          - id: b
            text: The number of moves before the episode ends
        answer: a
        feedback: The coin wins on the next-step reward, but the return also counts the discounted +20 from the vault. Counting moves ignores rewards entirely.
  - id: reinforcement-learning-loop.calculate
    objective_ref: objective.reinforcement-learning-loop
    task: base
    response_type: numeric
    points: 1
    hint: Multiply each reward by γ raised to how many steps after the first it arrives, then add. The first reward is not discounted.
    remediation_scene: reinforcement-learning-loop.s2
    absolute_tolerance: 0.01
    variants:
      - id: reinforcement-learning-loop.calculate.1
        prompt: Pip receives rewards −1, −1, −1, +10 in that order, with γ = 0.9. What is the return from the first step?
        answer: 4.58
        feedback: −1 − 0.9 − 0.81 + 0.729 × 10 = −2.71 + 7.29 = 4.58.
      - id: reinforcement-learning-loop.calculate.2
        prompt: An agent receives rewards 2, 0, 4 in that order, with γ = 0.5. What is the return from the first step?
        answer: 3
        feedback: 2 + 0.5 × 0 + 0.25 × 4 = 2 + 0 + 1 = 3.
      - id: reinforcement-learning-loop.calculate.3
        prompt: An agent receives rewards −1 then +10, with γ = 0.8. What is the return from the first step?
        answer: 7
        feedback: −1 + 0.8 × 10 = −1 + 8 = 7.
      - id: reinforcement-learning-loop.calculate.4
        prompt: Using G_t = R_t+1 + γ G_t+1, the next reward is −1, the return from the next step is 6.2, and γ = 0.9. What is G_t?
        answer: 4.58
        feedback: −1 + 0.9 × 6.2 = −1 + 5.58 = 4.58. Working backwards like this gives the same answer as adding the discounted rewards forwards.
      - id: reinforcement-learning-loop.calculate.5
        prompt: An agent receives rewards 1, 1, 1 in that order, with γ = 0.5. What is the return from the first step?
        answer: 1.75
        feedback: 1 + 0.5 × 1 + 0.25 × 1 = 1.75.
