schema_version: 0.2-draft
lesson:
  id: reinforcement-learning-loop
  version: 0.1.0-draft
  title: Learn decisions from consequences over time
  state: draft
  summary: Reinforcement learning connects observations, actions, rewards, and future consequences; a policy aims
    to improve expected return under a defined environment and interaction budget.
  slot: M24.1
  category: learning
  minutes: 12
  sources:
  - title: Dive into Deep Learning — reinforcement learning
    url: https://d2l.ai/chapter_reinforcement-learning/index.html
objectives:
- id: objective.reinforcement-learning-loop
  version: 1-draft
  statement: Reinforcement learning connects observations, actions, rewards, and future consequences; a policy aims
    to improve expected return under a defined environment and interaction budget.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - reinforcement-learning-loop.base
  - reinforcement-learning-loop.transfer
  prerequisites:
  - anyOf:
    - objective.ways-to-learn
  - anyOf:
    - objective.decisions-and-games
scenes:
- id: reinforcement-learning-loop.s1
  title: Follow the interaction loop
  type: explanation
  depth: intuition
  objective_refs:
  - objective.reinforcement-learning-loop
  markdown: An agent receives an observation, chooses an action using a policy, and receives a reward and new observation
    from the environment. A state is a description sufficient for the modeled dynamics; an observation can reveal
    only part of it. The reward defines the learning signal, not necessarily the full human goal.
  text_mode: An agent receives an observation, chooses an action using a policy, and receives a reward and new observation
    from the environment. A state is a description sufficient for the modeled dynamics; an observation can reveal
    only part of it. The reward defines the learning signal, not necessarily the full human goal.
  bridges: []
- id: reinforcement-learning-loop.s2
  title: Add future rewards into a return
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reinforcement-learning-loop
  markdown: A discounted return weights later rewards by powers of gamma. Rewards one now and two next step with
    gamma one-half give return 1 + 0.5×2 = 2. Discounting can express horizon preferences and help some infinite-horizon
    mathematical formulations remain well behaved.
  text_mode: A discounted return weights later rewards by powers of gamma. Rewards one now and two next step with
    gamma one-half give return 1 + 0.5×2 = 2. Discounting can express horizon preferences and help some infinite-horizon
    mathematical formulations remain well behaved.
  bridges: []
- id: reinforcement-learning-loop.s3
  title: Actions change future data
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reinforcement-learning-loop
  markdown: Unlike fitting a fixed supervised dataset, an interacting policy influences which situations it encounters.
    An early move can sacrifice immediate reward for a later benefit. Exploration affects both performance and what
    the learner can discover about alternatives.
  text_mode: Unlike fitting a fixed supervised dataset, an interacting policy influences which situations it encounters.
    An early move can sacrifice immediate reward for a later benefit. Exploration affects both performance and what
    the learner can discover about alternatives.
  bridges: []
- id: reinforcement-learning-loop.s4
  title: Define the experiment completely
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reinforcement-learning-loop
  markdown: Record episode boundaries, observations, actions, reward timing, termination, discount, and allowed
    interaction. Evaluate across seeds and fresh conditions. A high return in a simulator establishes performance
    under that simulator and reward, with further evidence needed for transfer.
  text_mode: Record episode boundaries, observations, actions, reward timing, termination, discount, and allowed
    interaction. Evaluate across seeds and fresh conditions. A high return in a simulator establishes performance
    under that simulator and reward, with further evidence needed for transfer.
  bridges: []
- id: reinforcement-learning-loop.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.reinforcement-learning-loop
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: reinforcement-learning-loop.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.reinforcement-learning-loop
  markdown: Reinforcement learning connects observations, actions, rewards, and future consequences; a policy aims
    to improve expected return under a defined environment and interaction budget.
  text_mode: Reinforcement learning connects observations, actions, rewards, and future consequences; a policy aims
    to improve expected return under a defined environment and interaction budget.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - reinforcement-learning-loop.s1
    - reinforcement-learning-loop.s2
    - reinforcement-learning-loop.s3
    - reinforcement-learning-loop.s4
    - reinforcement-learning-loop.check
    - reinforcement-learning-loop.recap
