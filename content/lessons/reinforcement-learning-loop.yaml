schema_version: 0.2-draft
lesson:
  id: reinforcement-learning-loop
  version: 0.3.0-draft
  title: Learn decisions from consequences over time
  state: draft
  summary: Learn the vocabulary of learning through actions and consequences.
  slot: M24.1
  category: learning
  sources:
  - title: Dive into Deep Learning — reinforcement learning
    url: https://d2l.ai/chapter_reinforcement-learning/index.html
objectives:
- id: objective.reinforcement-learning-loop
  version: 1-draft
  statement: Reinforcement learning connects observations, actions, rewards, and future consequences; a policy
    aims to improve expected return under a defined environment and interaction budget.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - reinforcement-learning-loop.base
  - reinforcement-learning-loop.transfer
  prerequisites:
  - anyOf:
    - objective.ways-to-learn
  - anyOf:
    - objective.decisions-and-games
scenes:
- id: reinforcement-learning-loop.s1
  title: Follow the interaction loop
  type: explanation
  depth: intuition
  objective_refs:
  - objective.reinforcement-learning-loop
  markdown: 'Picture a learner trying to escape a small maze. The learner is the **agent** and the maze is
    its **environment**. It receives an **observation**, such as a nearby wall, and uses its **policy**, a
    rule for choosing, to select an **action**, such as moving left.


    After the move, the environment supplies a new observation and a **reward**. Reaching the exit might earn
    one point even though most moves earn none. An **episode** is one run from the start until the run ends.


    A **state** describes enough of the situation to determine the modeled next-step possibilities. An observation
    may reveal only part of that state. The reward is the agent''s learning signal, so choosing it carefully
    matters: earning points should encourage the behavior we actually want.'
  text_mode: 'Picture a learner trying to escape a small maze. The learner is the **agent** and the maze is
    its **environment**. It receives an **observation**, such as a nearby wall, and uses its **policy**, a
    rule for choosing, to select an **action**, such as moving left.


    After the move, the environment supplies a new observation and a **reward**. Reaching the exit might earn
    one point even though most moves earn none. An **episode** is one run from the start until the run ends.


    A **state** describes enough of the situation to determine the modeled next-step possibilities. An observation
    may reveal only part of that state. The reward is the agent''s learning signal, so choosing it carefully
    matters: earning points should encourage the behavior we actually want.'
  bridges: []
- id: reinforcement-learning-loop.s2
  title: Add future rewards into a return
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reinforcement-learning-loop
  markdown: A discounted return weights later rewards by powers of gamma. Rewards one now and two next step
    with gamma one-half give return 1 + 0.5×2 = 2. Discounting can express horizon preferences and help some
    infinite-horizon mathematical formulations remain well behaved.
  text_mode: A discounted return weights later rewards by powers of gamma. Rewards one now and two next step
    with gamma one-half give return 1 + 0.5×2 = 2. Discounting can express horizon preferences and help some
    infinite-horizon mathematical formulations remain well behaved.
  bridges: []
- id: reinforcement-learning-loop.s3
  title: Actions change future data
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reinforcement-learning-loop
  markdown: Unlike fitting a fixed supervised dataset, an interacting policy influences which situations it
    encounters. An early move can sacrifice immediate reward for a later benefit. Exploration affects both
    performance and what the learner can discover about alternatives.
  text_mode: Unlike fitting a fixed supervised dataset, an interacting policy influences which situations it
    encounters. An early move can sacrifice immediate reward for a later benefit. Exploration affects both
    performance and what the learner can discover about alternatives.
  bridges: []
- id: reinforcement-learning-loop.s4
  title: Define the experiment completely
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reinforcement-learning-loop
  markdown: Record episode boundaries, observations, actions, reward timing, termination, discount, and allowed
    interaction. Evaluate across seeds and fresh conditions. A high return in a simulator establishes performance
    under that simulator and reward, with further evidence needed for transfer.
  text_mode: Record episode boundaries, observations, actions, reward timing, termination, discount, and allowed
    interaction. Evaluate across seeds and fresh conditions. A high return in a simulator establishes performance
    under that simulator and reward, with further evidence needed for transfer.
  bridges: []
- id: reinforcement-learning-loop.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.reinforcement-learning-loop
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: An agent learns how actions affect rewards over time. Its policy should improve expected return,
    including consequences that arrive after the current move.
- id: reinforcement-learning-loop.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.reinforcement-learning-loop
  markdown: An agent learns how actions affect rewards over time. Its policy should improve expected return,
    including consequences that arrive after the current move.
  text_mode: An agent learns how actions affect rewards over time. Its policy should improve expected return,
    including consequences that arrive after the current move.
