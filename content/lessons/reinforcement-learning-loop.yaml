schema_version: 0.2-draft
lesson:
  id: reinforcement-learning-loop
  version: 0.4.0-draft
  title: Learn decisions from consequences over time
  state: draft
  summary: A robot vacuum gets no instructions, only a reward when it reaches its dock. Meet the agent, its actions, and its rewards, and see why a good move can pay off only later.
  slot: M24.1
  category: learning
  sources:
    - title: "Reinforcement Learning: An Introduction, 2nd edition (Sutton & Barto, 2018)"
      url: http://incompleteideas.net/book/the-book-2nd.html
    - title: Dive into Deep Learning — reinforcement learning
      url: https://d2l.ai/chapter_reinforcement-learning/index.html
    - title: "Human-level control through deep reinforcement learning (Mnih et al., Nature 2015)"
      url: https://www.nature.com/articles/nature14236
objectives:
  - id: objective.reinforcement-learning-loop
    version: 2-draft
    statement: Reinforcement learning connects observations, actions, rewards, and future consequences; a policy aims to improve expected return under a defined environment and interaction budget.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - reinforcement-learning-loop.base.v2
      - reinforcement-learning-loop.transfer.v2
      - reinforcement-learning-loop.calculate
    prerequisites:
      - anyOf:
          - objective.ways-to-learn
      - anyOf:
          - objective.decisions-and-games
scenes:
  - id: reinforcement-learning-loop.s1
    title: Pip has to find the dock on its own
    type: explanation
    depth: intuition
    objective_refs:
      - objective.reinforcement-learning-loop
    markdown: |-
      Pip is a new robot vacuum in a small flat. It gets one kind of feedback: a number after each move. Every move drains battery, worth −1. Rolling onto the charging dock earns +10 and ends the run. Over many runs, Pip must discover which moves lead home.

      That setup is **reinforcement learning (RL)**: learning what to do from the consequences of doing it. Pip will play every part for the rest of this module.

      | Term | Plain meaning | Pip's version |
      | --- | --- | --- |
      | **Agent** | The learner that chooses | Pip's control program |
      | **Environment** | What the agent acts on | The flat |
      | **State** | The situation right now | Pip's cell and battery level |
      | **Observation** | What the agent can sense of the state | Bump and floor sensors |
      | **Action** | One choice | Forward, back, left, right |
      | **Reward** | A number scoring the last step | −1 per move, +10 for docking |
      | **Policy** | The rule for choosing actions | "On the rug, go forward" |
      | **Episode** | One run from start to finish | Bedroom to dock |

      The loop in the diagram never changes: observe, act, receive a reward and a new state, repeat. Notice that the reward scores the step but never says which action would have been better. That's the big difference from supervised learning, where every example comes with the right answer.
    diagram:
      caption: One turn of the agent–environment loop. The same loop runs every step of every episode.
      description: The agent, Pip's policy, sends an action to the environment, the flat. The environment returns the next state to the agent and also produces a reward. The reward goes to a learning update, which adjusts the policy inside the agent. Then the loop repeats.
      nodes:
        - id: agent
          label: Agent (Pip)
          note: policy picks an action
          col: 1
          row: 0
          tone: accent
        - id: env
          label: Environment (the flat)
          note: moves Pip, scores the step
          col: 3
          row: 0
          tone: data
        - id: update
          label: Learning update
          note: adjusts the policy
          col: 2
          row: 2
          tone: warn
      edges:
        - from: agent
          to: env
          label: action A_t
        - from: env
          to: agent
          label: next state S_t+1
          bend: 2
        - from: env
          to: update
          label: reward R_t+1
        - from: update
          to: agent
          label: better policy
          dashed: true
    bridges: []
  - id: reinforcement-learning-loop.s2
    title: Add up the future into a return
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.reinforcement-learning-loop
    markdown: |-
      Pip's first move costs −1 whether it heads toward the dock or away. What matters is the whole stream of rewards still to come, called the **return**. Future rewards usually count a little less: a **discount factor** $\gamma$ (gamma), a number between 0 and 1, shrinks each reward by one more factor of $\gamma$ for every step it lies ahead.

      :::example Two routes to the dock, with γ = 0.9
      From the doorway, Pip can cross the rug (two moves, then onto the dock) or go round the sofa (four moves, then the dock).

      | Route | Rewards in order | Return |
      | --- | --- | ---: |
      | Across the rug | −1, −1, +10 | $-1 - 0.9 + 0.81 \times 10 = 6.2$ |
      | Round the sofa | −1, −1, −1, −1, +10 | $-1 - 0.9 - 0.81 - 0.729 + 0.6561 \times 10 = 3.122$ |
      :::

      :::papers The discounted return
      $$G_t = R_{t+1} + \gamma R_{t+2} + \gamma^2 R_{t+3} + \dots = \sum_{k=0}^{\infty} \gamma^k R_{t+k+1}$$

      $R_{t+1}$ is the reward that arrives after the action at step $t$. For the rug route, $R_1 = -1$, $R_2 = -1$, $R_3 = 10$, and $G_0 = 6.2$. The recursive form, $G_t = R_{t+1} + \gamma G_{t+1}$, says the return now is this step's reward plus the discounted return from the next step. The rest of this module builds on that line.
      :::

      The code works backwards from the dock using the recursive form.

      ```python run
      def discounted_return(rewards, gamma):
          G = 0.0
          for r in reversed(rewards):      # work backwards: G_t = R_{t+1} + gamma * G_{t+1}
              G = r + gamma * G
          return G

      rug_route  = [-1, -1, 10]            # two moves, then the move onto the dock
      sofa_route = [-1, -1, -1, -1, 10]    # the long way round the sofa

      for gamma in [0.0, 0.5, 0.9, 1.0]:
          rug = discounted_return(rug_route, gamma)
          sofa = discounted_return(sofa_route, gamma)
          print(f"gamma = {gamma}:  rug route {rug:6.3f}   sofa route {sofa:6.3f}")
      ```

      :::predict Before running it, what happens to the sofa route when γ = 0.5?
      It turns negative, −1.25, while the rug route falls to 1.0. A small $\gamma$ makes Pip impatient: the distant +10 shrinks until four moves of battery outweigh it.
      :::

      Discounting also keeps the sum finite when a task never ends.
    bridges: []
  - id: reinforcement-learning-loop.s3
    title: Today's move changes tomorrow's data
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.reinforcement-learning-loop
    markdown: |-
      A spam filter sees the same emails whatever it predicts. Pip's data is different: where it goes decides what it sees next. If Pip always turns left out of the bedroom, it learns about the kitchen and nothing about the hallway, even if the hallway is the shortcut home. That creates two problems supervised learning never faces.

      - **Exploration versus exploitation.** Pip must sometimes try moves that look worse, just to find out where they lead. The next lesson is about this trade-off.
      - **Credit assignment.** The +10 arrives on the last move. On a twelve-move trip home, which of the earlier moves deserve the credit? The reward doesn't say. The MDP lesson answers with value functions, which estimate the return expected from each state.

      :::mixup "A good agent picks whatever earns the most reward on the next step."
      That maximizes the reward, not the return. From the doorway, the move toward the rug and the move into the dead-end bathroom both cost −1. Only the return, which counts the +10 a few moves later, separates them.
      :::
    bridges: []
  - id: reinforcement-learning-loop.s4
    title: The reward is the only instruction
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.reinforcement-learning-loop
    markdown: |-
      An RL agent optimizes the reward you wrote down, not the one you meant. If Pip earned +1 per square cleaned, and a square counted again once dust settled, circling two squares forever could outscore cleaning the flat. An agent exploiting a loophole like this is **reward hacking**.

      :::story The boat that never finished the race
      In 2016, OpenAI researchers trained an agent on the boat-racing game *CoastRunners*, which awards points for hitting targets. The agent found a lagoon where three targets kept reappearing and circled there endlessly, crashing and catching fire, while outscoring players who finished the race.
      :::

      So read the reward like a lawyer: what is the cheapest behavior that scores well? Then test like a skeptic. Pip learned in one flat with one random seed. Run it in a flat with a new layout, and retrain with a few seeds.
    bridges: []
  - id: reinforcement-learning-loop.s5
    title: From backgammon to chatbots
    type: explanation
    depth: intuition
    objective_refs:
      - objective.reinforcement-learning-loop
    markdown: |-
      This loop sits behind some famous results in AI, each adding a mechanism you'll meet in this module.

      | System | What it learned | Mechanism | Lesson |
      | --- | --- | --- | --- |
      | TD-Gammon (Gerald Tesauro, early 1990s) | Backgammon, by playing itself, near top human level | Temporal-difference learning | M24.4 |
      | DQN (Mnih et al., *Nature* 2015) | Dozens of Atari games from pixels and score | Deep Q-networks | M24.5 |
      | AlphaGo (DeepMind, 2016) | Go, beating world champion Lee Sedol 4–1 | Policy and value networks plus tree search | M24.6–M24.7 |
      | InstructGPT and ChatGPT (OpenAI, 2022) | Answers people prefer | PPO on a learned reward | M24.6 |

      Every row follows Pip's recipe: an agent, an environment, a reward, and a policy improved to earn a higher return.
    bridges: []
  - id: reinforcement-learning-loop.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.reinforcement-learning-loop
    markdown: A thermostat, a warehouse robot, a chess program, and a few reward streams test whether you can name the parts of the loop and add up a return.
    takeaway: |-
      An agent acts, the environment answers with a new state and a reward, and the agent learns a policy that earns a high return: all future rewards, discounted by γ per step.
  - id: reinforcement-learning-loop.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.reinforcement-learning-loop
    markdown: |-
      An agent learns how actions affect rewards over time. Its policy should improve expected return, including consequences that arrive after the current move.
