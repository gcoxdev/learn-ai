assessment_families:
- id: reinforcement-learning-loop.base
  objective_ref: objective.reinforcement-learning-loop
  task: base
  response_type: single_choice
  points: 1
  hint: 'Add future rewards into a return: trace the inputs, operation, and result before choosing.'
  remediation_scene: reinforcement-learning-loop.s2
  variants:
  - id: reinforcement-learning-loop.base.1
    prompt: Rewards 1 then 2 with discount 0.5 give return what?
    options:
    - id: c
      text: '1.5'
    - id: a
      text: '2'
    - id: b
      text: '3'
    answer: a
    feedback: The second reward is weighted by one-half.
  - id: reinforcement-learning-loop.base.2
    prompt: What maps available information to action choices?
    options:
    - id: a
      text: The policy
    - id: b
      text: Only the final dataset hash
    - id: c
      text: The loss plot alone
    answer: a
    feedback: A policy defines decision behavior.
- id: reinforcement-learning-loop.transfer
  objective_ref: objective.reinforcement-learning-loop
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Define the experiment completely: trace the inputs, operation, and result before choosing.'
  remediation_scene: reinforcement-learning-loop.s4
  variants:
  - id: reinforcement-learning-loop.transfer.1
    prompt: Why does an RL policy affect its training data?
    options:
    - id: a
      text: Its actions influence future visited situations
    - id: b
      text: It always receives a fixed independent label table
    - id: c
      text: Rewards never depend on actions
    answer: a
    feedback: Interaction couples behavior and observations.
  - id: reinforcement-learning-loop.transfer.2
    prompt: Does high simulator reward guarantee real-world success?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if the agent is neural
    - id: a
      text: 'No'
    answer: a
    feedback: Transfer depends on how simulation and real conditions differ.
