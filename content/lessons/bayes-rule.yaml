schema_version: 0.2-draft
lesson:
  id: bayes-rule
  version: 0.4.0-draft
  title: Update a belief using new evidence
  state: draft
  summary: A detector that catches 90% of bad parts just flagged one. Is it 90% likely to be bad? Try it, then see why the real answer is closer to 15%.
  slot: M06.2
  category: learning
  sources:
    - title: Deep Learning — probability and information theory
      url: https://www.deeplearningbook.org/contents/prob.html
objectives:
  - id: objective.bayes-rule
    version: 2-draft
    statement: Bayes’ rule combines prior prevalence with how likely evidence is under competing explanations, then normalizes the alternatives.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - bayes-rule.base.v2
      - bayes-rule.transfer.v2
    prerequisites:
      - anyOf:
          - objective.uncertainty-models
scenes:
  - id: bayes-rule.s1
    title: The detector beeps. Is the part bad?
    type: explanation
    depth: intuition
    objective_refs:
      - objective.bayes-rule
    markdown: |-
      A factory makes metal brackets, and 1% of them come out cracked. An inspection camera flags 90% of cracked brackets. It also flags 5% of good ones by mistake: a **false alarm**. The camera just beeped. How likely is it that this bracket is really cracked?

      The tempting answer is 90%. The real answer is about 15%.

      Three quantities are in play. The **evidence** is the beep. The **prior** is what you believed before seeing it: 1% of brackets are cracked. The **posterior** is what you should believe after the evidence: the chance of a crack, given a beep.

      The 90% answers a different question. "Of cracked brackets, how many beep?" is not "Of beeping brackets, how many are cracked?" **Bayes' rule** is the recipe that turns the first kind of question into the second, using the prior.

      :::story Doctors fall for it too
      In a 1978 study at Harvard Medical School, doctors and students were told that a disease affects 1 person in 1,000 and a test has a 5% false-positive rate. What is the chance that someone who tests positive has the disease? The most common answer was 95%. The right answer is about 2%: even if the test catches the one true case, the healthy 999 produce about 50 false alarms alongside it. Ignoring the prior like this is called the **base-rate fallacy**.
      :::
    bridges: []
  - id: bayes-rule.s2
    title: Count 10,000 brackets
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.bayes-rule
    markdown: |-
      Counts make the answer obvious. Imagine 10,000 brackets:

      | | Beep | No beep | Total |
      | --- | ---: | ---: | ---: |
      | Cracked (1%) | 90 | 10 | 100 |
      | Good (99%) | 495 | 9,405 | 9,900 |
      | Total | 585 | 9,415 | 10,000 |

      The camera beeps 585 times. Only 90 of those beeps are real cracks, so the posterior is 90 / 585 ≈ 0.154, about 15%. The camera is good, but good brackets outnumber cracked ones 99 to 1, so even a small false-alarm rate on them produces more beeps than the real cracks do.

      :::predict A worse batch has 10% cracked brackets. Same camera. What fraction of beeps are real cracks now?
      Out of 10,000: 1,000 cracked, 900 beep. 9,000 good, 5% of them (450) beep. The posterior is 900 / 1,350 ≈ 0.67. The camera didn't change at all; the prior did, and the posterior jumped from 15% to 67%.
      :::

      Drag the controls below and watch how the share of real cracks among beeps moves with the base rate.
    bridges:
      - probability
      - arithmetic
    figure:
      kind: bayes
      caption: Change the base rate, then count both true flags and false alarms.
      description: Two bars compare the defective share of all parts with the defective share of flagged parts. Controls change prevalence, detection, and false-alarm rates; a count table explains the conditional probability.
  - id: bayes-rule.s3
    title: From counts to Bayes' rule
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.bayes-rule
    markdown: |-
      Now do the same thing with probabilities instead of counts. There are two ways to get a beep:

      - cracked **and** beeps: 0.01 × 0.90 = 0.009
      - good **and** beeps: 0.99 × 0.05 = 0.0495

      All beeps together: 0.009 + 0.0495 = 0.0585. The cracked share of that total is 0.009 / 0.0585 ≈ 0.154, the same as 90 / 585. Dividing each piece by the total so that the shares add to 1 is called **normalizing**.

      :::papers Bayes' rule
      Write $D$ for "cracked" and $F$ for "flagged" (beeped):

      $$P(D \mid F) = \frac{P(F \mid D)\,P(D)}{P(F \mid D)\,P(D) + P(F \mid \neg D)\,P(\neg D)} = \frac{0.90 \times 0.01}{0.90 \times 0.01 + 0.05 \times 0.99} \approx 0.154$$

      $P(D) = 0.01$ is the prior. $P(F \mid D) = 0.90$ and $P(F \mid \neg D) = 0.05$ are the **likelihoods** of the evidence under each explanation (¬ means "not"). The denominator, $P(F) = 0.0585$, is the total chance of a beep. Papers often write the short form $P(D \mid F) \propto P(F \mid D)\,P(D)$: posterior is proportional to likelihood times prior, then normalize.
      :::

      Don't trust the formula? Simulate 10,000 brackets and count, exactly as the table did:

      ```python run
      import random

      random.seed(1)
      prior, hit_rate, false_alarm = 0.01, 0.90, 0.05

      cracked_flagged = good_flagged = 0
      for _ in range(10_000):
          cracked = random.random() < prior
          flag_chance = hit_rate if cracked else false_alarm
          if random.random() < flag_chance:
              if cracked:
                  cracked_flagged += 1
              else:
                  good_flagged += 1

      flagged = cracked_flagged + good_flagged
      print(f"flagged brackets: {flagged} ({cracked_flagged} cracked, {good_flagged} good)")
      print(f"simulated    P(cracked | flag) = {cracked_flagged / flagged:.3f}")

      numerator = hit_rate * prior
      evidence = numerator + false_alarm * (1 - prior)
      print(f"Bayes' rule  P(cracked | flag) = {numerator / evidence:.3f}")
      ```

      This run happens to draw 99 cracked-and-flagged and 540 good-and-flagged brackets, so the simulation gives 0.155 against the formula's 0.154. Change `random.seed(1)` to other numbers: the simulated answer wobbles around 0.15 but never lands near 0.90. Then change the prior from 0.01 to 0.10 to check your prediction.

      :::mixup "The test is 90% accurate, so a positive result means 90% chance."
      The 90% is $P(\text{flag} \mid \text{cracked})$. You want $P(\text{cracked} \mid \text{flag})$. Swapping the two ignores the prior and the false alarms, and it can be off by a factor of six, as here.
      :::
  - id: bayes-rule.s4
    title: Today's posterior is tomorrow's prior
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.bayes-rule
    markdown: |-
      A 15% chance is too high to ship the bracket and too low to scrap it. So send every beeping bracket to a second camera, a different model with the same 90% hit rate and 5% false-alarm rate. It beeps too.

      Run Bayes' rule again, with the old posterior as the new prior:

      | | Prior | × Likelihood of beep | = Weight |
      | --- | ---: | ---: | ---: |
      | Cracked | 0.154 | 0.90 | 0.139 |
      | Good | 0.846 | 0.05 | 0.042 |

      Normalize: 0.139 / (0.139 + 0.042) ≈ 0.77. Two beeps take you from 1% to 15% to 77%. That's how Bayesian reasoning accumulates evidence: each update starts from the belief the last one left behind.

      This works because the second camera makes its mistakes independently of the first. Scanning the same bracket twice with the *same* camera would repeat the same glare and the same false alarm, so it adds almost nothing. When you want a second opinion, get one that can fail in a different way.
    bridges: []
  - id: bayes-rule.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.bayes-rule
    markdown: Medical tests, spam flags, airport scanners, and bank fraud alerts ask you to compute a posterior and to spot where the base rate hides.
    takeaway: |-
      Count every way the evidence could arise. A flag can come from a real defect or a false alarm; Bayes' rule weighs each by its prior and divides by the total, and when the thing is rare, false alarms can win.
  - id: bayes-rule.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.bayes-rule
    markdown: |-
      Count every way the evidence could arise. A detector’s flag can come from a real defect or a false alarm; Bayes’ rule compares those contributions.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - bayes-rule.s1
        - bayes-rule.s2
        - bayes-rule.s3
        - bayes-rule.s4
        - bayes-rule.check
      gate_refs:
