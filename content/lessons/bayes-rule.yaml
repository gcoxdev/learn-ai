assessment_families:
- id: bayes-rule.base
  objective_ref: objective.bayes-rule
  task: base
  response_type: single_choice
  points: 1
  hint: 'Use counts before symbols: trace the inputs, operation, and result before choosing.'
  remediation_scene: bayes-rule.s2
  variants:
  - id: bayes-rule.base.1
    prompt: Does P(flag given defect) equal P(defect given flag) in general?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if the detector is electronic
    - id: a
      text: 'No'
    answer: a
    feedback: Reversing a conditional requires accounting for prior prevalence and alternative sources of evidence.
  - id: bayes-rule.base.2
    prompt: Prior weights are 0.2 and 0.8; evidence likelihoods are 0.5 and 0.25. What is posterior weight
      for the first case?
    options:
    - id: c
      text: '0.5'
    - id: a
      text: 1/3
    - id: b
      text: '0.1'
    answer: a
    feedback: Unnormalized weights are 0.1 and 0.2; normalize by their total 0.3.
- id: bayes-rule.transfer
  objective_ref: objective.bayes-rule
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Update the assumptions as well as the number: trace the inputs, operation, and result before choosing.'
  remediation_scene: bayes-rule.s4
  variants:
  - id: bayes-rule.transfer.1
    prompt: Defects become much rarer while detector sensitivity stays fixed. What may happen to the fraction
      of flags that are real defects?
    options:
    - id: c
      text: It cannot change
    - id: a
      text: It may fall because good parts dominate the flagged pool
    - id: b
      text: It must rise to 100%
    answer: a
    feedback: Predictive value depends on prevalence as well as sensitivity and false-positive rate.
  - id: bayes-rule.transfer.2
    prompt: Observed evidence was assigned zero probability by the model. What should be examined?
    options:
    - id: a
      text: The model and conditioning assumptions
    - id: b
      text: Only a larger numerator
    - id: c
      text: A claim that the posterior is automatically 1
    answer: a
    feedback: Zero-probability conditioning is not resolved by ordinary division.
