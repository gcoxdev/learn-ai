schema_version: 0.2-draft
lesson:
  id: bayes-rule
  version: 0.3.0-draft
  title: Update a belief using new evidence
  state: draft
  summary: Count real defects and false alarms before deciding what a detector’s flag means.
  slot: M06.2
  category: learning
  sources:
  - title: Deep Learning — probability and information theory
    url: https://www.deeplearningbook.org/contents/prob.html
objectives:
- id: objective.bayes-rule
  version: 1-draft
  statement: Bayes’ rule combines prior prevalence with how likely evidence is under competing explanations,
    then normalizes the alternatives.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - bayes-rule.base
  - bayes-rule.transfer
  prerequisites:
  - anyOf:
    - objective.uncertainty-models
scenes:
- id: bayes-rule.s1
  title: What does a detector’s flag tell us?
  type: explanation
  depth: intuition
  objective_refs:
  - objective.bayes-rule
  markdown: 'Suppose 1% of manufactured parts are defective. That starting probability is the **prior**. A
    detector flags 90% of defective parts, but also flags 5% of good parts.


    A flag supplies new **evidence**. We want the **posterior**: the probability of a defect after seeing the
    flag. This asks “Of flagged parts, how many are defective?” The detector’s 90% rate answers a different
    question: “Of defective parts, how many are flagged?” Bayes’ rule connects the two using the starting defect
    rate.'
  text_mode: 'Suppose 1% of manufactured parts are defective. That starting probability is the **prior**. A
    detector flags 90% of defective parts, but also flags 5% of good parts.


    A flag supplies new **evidence**. We want the **posterior**: the probability of a defect after seeing the
    flag. This asks “Of flagged parts, how many are defective?” The detector’s 90% rate answers a different
    question: “Of defective parts, how many are flagged?” Bayes’ rule connects the two using the starting defect
    rate.'
  bridges: []
- id: bayes-rule.s2
  title: Use counts before symbols
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bayes-rule
  markdown: Among 10,000 parts, expect 100 defects and 9,900 good parts under this simplified model. The detector
    flags about 90 defects and 495 good parts. Among 585 flagged parts, the defect fraction is 90/585, about
    15.4%. A seemingly accurate detector can produce many false alarms when defects are rare.
  text_mode: Among 10,000 parts, expect 100 defects and 9,900 good parts under this simplified model. The detector
    flags about 90 defects and 495 good parts. Among 585 flagged parts, the defect fraction is 90/585, about
    15.4%. A seemingly accurate detector can produce many false alarms when defects are rare.
  bridges:
  - probability
  - arithmetic
  figure:
    kind: bayes
    caption: Change the base rate, then count both true flags and false alarms.
    description: Two bars compare the defective share of all parts with the defective share of flagged parts.
      Controls change prevalence, detection, and false-alarm rates; a count table explains the conditional
      probability.
- id: bayes-rule.s3
  title: Turn the counts into probabilities
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bayes-rule
  markdown: 'In the parts example, the probability of being defective and flagged is 0.01 × 0.90 = 0.009. The
    probability of being good and flagged is 0.99 × 0.05 = 0.0495. Together, these give a flag probability
    of 0.0585.


    To **normalize**, divide each contribution by their total. The defective share is 0.009 / 0.0585, the same
    result as 90 / 585. The two normalized shares add to one.


    In compact form, Bayes’ rule says the posterior is proportional to likelihood times prior. The likelihood
    tells us how probable the evidence is under each alternative. If the evidence has zero probability under
    the model, there is no total to divide by and this conditional calculation is undefined.'
  text_mode: 'In the parts example, the probability of being defective and flagged is 0.01 × 0.90 = 0.009.
    The probability of being good and flagged is 0.99 × 0.05 = 0.0495. Together, these give a flag probability
    of 0.0585.


    To **normalize**, divide each contribution by their total. The defective share is 0.009 / 0.0585, the same
    result as 90 / 585. The two normalized shares add to one.


    In compact form, Bayes’ rule says the posterior is proportional to likelihood times prior. The likelihood
    tells us how probable the evidence is under each alternative. If the evidence has zero probability under
    the model, there is no total to divide by and this conditional calculation is undefined.'
  bridges: []
- id: bayes-rule.s4
  title: Update the assumptions as well as the number
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bayes-rule
  markdown: The calculation depends on the stated prevalence and detector behavior. If the factory changes,
    these may change too. New evidence can update a posterior, but an inaccurate likelihood model can still
    mislead. Report both the result and the conditions needed for interpreting it.
  text_mode: The calculation depends on the stated prevalence and detector behavior. If the factory changes,
    these may change too. New evidence can update a posterior, but an inaccurate likelihood model can still
    mislead. Report both the result and the conditions needed for interpreting it.
  bridges: []
- id: bayes-rule.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.bayes-rule
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Count every way the evidence could arise. A detector’s flag can come from a real defect or a false
    alarm; Bayes’ rule compares those contributions.
- id: bayes-rule.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.bayes-rule
  markdown: Count every way the evidence could arise. A detector’s flag can come from a real defect or a false
    alarm; Bayes’ rule compares those contributions.
  text_mode: Count every way the evidence could arise. A detector’s flag can come from a real defect or a false
    alarm; Bayes’ rule compares those contributions.
