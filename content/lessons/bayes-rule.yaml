assessment_families:
  - id: bayes-rule.base
    objective_ref: objective.bayes-rule
    task: base
    response_type: single_choice
    points: 1
    hint: 'Use counts before symbols: trace the inputs, operation, and result before choosing.'
    remediation_scene: bayes-rule.s2
    variants:
      - id: bayes-rule.base.1
        prompt: Does P(flag given defect) equal P(defect given flag) in general?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if the detector is electronic
          - id: a
            text: 'No'
        answer: a
        feedback: Reversing a conditional requires accounting for prior prevalence and alternative sources of evidence.
        retired: true
      - id: bayes-rule.base.2
        prompt: Prior weights are 0.2 and 0.8; evidence likelihoods are 0.5 and 0.25. What is posterior weight for the first case?
        options:
          - id: c
            text: '0.5'
          - id: a
            text: 1/3
          - id: b
            text: '0.1'
        answer: a
        feedback: Unnormalized weights are 0.1 and 0.2; normalize by their total 0.3.
        retired: true
  - id: bayes-rule.transfer
    objective_ref: objective.bayes-rule
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Update the assumptions as well as the number: trace the inputs, operation, and result before choosing.'
    remediation_scene: bayes-rule.s4
    variants:
      - id: bayes-rule.transfer.1
        prompt: Defects become much rarer while detector sensitivity stays fixed. What may happen to the fraction of flags that are real defects?
        options:
          - id: c
            text: It cannot change
          - id: a
            text: It may fall because good parts dominate the flagged pool
          - id: b
            text: It must rise to 100%
        answer: a
        feedback: Predictive value depends on prevalence as well as sensitivity and false-positive rate.
        retired: true
      - id: bayes-rule.transfer.2
        prompt: Observed evidence was assigned zero probability by the model. What should be examined?
        options:
          - id: a
            text: The model and conditioning assumptions
          - id: b
            text: Only a larger numerator
          - id: c
            text: A claim that the posterior is automatically 1
        answer: a
        feedback: Zero-probability conditioning is not resolved by ordinary division.
        retired: true
  - id: bayes-rule.base.v2
    objective_ref: objective.bayes-rule
    task: base
    response_type: numeric
    points: 1
    hint: Work out two weights, prior × hit rate for "really positive" and (1 − prior) × false-alarm rate for "false alarm". The posterior is the first weight divided by their sum.
    remediation_scene: bayes-rule.s3
    absolute_tolerance: 0.01
    variants:
      - id: bayes-rule.base.v2.1
        prompt: 2% of brackets are cracked. A camera flags 90% of cracked brackets and 10% of good ones. A bracket is flagged. What is the probability it is cracked? Give a decimal to two places.
        answer: 0.16
        feedback: 'The weights are 0.02 × 0.90 = 0.018 (cracked and flagged) and 0.98 × 0.10 = 0.098 (good and flagged). The posterior is 0.018 / 0.116 ≈ 0.16. Answering 0.90 swaps the question: that''s the chance a cracked bracket gets flagged.'
      - id: bayes-rule.base.v2.2
        prompt: 30% of the emails reaching an inbox are spam. A filter flags 80% of spam and 5% of normal email. An email is flagged. What is the probability it is spam? Give a decimal to two places.
        answer: 0.87
        feedback: The weights are 0.30 × 0.80 = 0.24 and 0.70 × 0.05 = 0.035. The posterior is 0.24 / 0.275 ≈ 0.87. Here spam is common, so the prior works in the flag's favor and false alarms are a small share.
      - id: bayes-rule.base.v2.3
        prompt: A condition affects 1% of people screened. The test detects 95% of cases and gives a false positive for 2% of healthy people. Someone tests positive. What is the probability they have the condition? Give a decimal to two places.
        answer: 0.32
        feedback: The weights are 0.01 × 0.95 = 0.0095 and 0.99 × 0.02 = 0.0198. The posterior is 0.0095 / 0.0293 ≈ 0.32. Even with a 95% detection rate, two out of three positives are false alarms because healthy people are so numerous.
      - id: bayes-rule.base.v2.4
        prompt: Of 1,000 bags at an airport, 50 hold a banned liquid. The scanner flags 40 of those 50 and 95 of the other 950. What fraction of flagged bags hold a banned liquid? Give a decimal to two places.
        answer: 0.30
        feedback: The scanner flags 40 + 95 = 135 bags, and 40 of them hold a liquid, so the answer is 40 / 135 ≈ 0.30. Answering 0.80 (40 of 50) gives the scanner's hit rate, which answers the reverse question.
  - id: bayes-rule.transfer.v2
    objective_ref: objective.bayes-rule
    task: transfer
    response_type: single_choice
    points: 1
    hint: Before trusting a hit rate, ask how common the thing is (the prior) and how many alarms the far larger "innocent" group will produce.
    remediation_scene: bayes-rule.s2
    variants:
      - id: bayes-rule.transfer.v2.1
        prompt: A bank says its fraud alert "catches 99% of fraud." Fraud is rare, and you just got an alert on a real purchase you made. Which information best tells you how often alerts like yours are real fraud?
        options:
          - id: b
            text: The 99% catch rate, which already describes alert accuracy
          - id: a
            text: How rare fraud is, and how often normal purchases trigger alerts
          - id: c
            text: How many alerts in total the bank sent out last month
        answer: a
        feedback: The chance an alert is real depends on the prior (how rare fraud is) and the false-alarm rate on the huge pool of normal purchases. The 99% catch rate is P(alert | fraud), the reverse question. A raw count of alerts mixes true and false ones together.
      - id: bayes-rule.transfer.v2.2
        prompt: A factory's crack rate falls from 5% to 0.5% after a process fix. The inspection camera is unchanged. What happens to the share of camera flags that are real cracks?
        options:
          - id: c
            text: It stays the same, because the camera hasn't changed
          - id: b
            text: It rises, because fewer cracks are left to be missed
          - id: a
            text: It falls, because false alarms now make up more flags
        answer: a
        feedback: With fewer cracked parts, the false alarms on the growing pool of good parts become a larger share of all flags, so the posterior drops. The camera's hit and false-alarm rates are fixed, but the posterior also depends on the prior.
      - id: bayes-rule.transfer.v2.3
        prompt: After one positive screening test, a patient's probability of having a condition is 15%. A different, independent test is then done. Which number should serve as the prior for this second update?
        options:
          - id: a
            text: The 1% base rate from before any test
          - id: c
            text: The first test's 95% detection rate
          - id: b
            text: The 15% posterior after the first test
        answer: b
        feedback: Today's posterior is tomorrow's prior, so the second update starts from 15%. Restarting at 1% throws away the first result, and 95% is a likelihood, not a belief about this patient.
      - id: bayes-rule.transfer.v2.4
        prompt: 'A headline says: "Most people caught by the new face-matching camera were innocent, so the camera is useless." The camera matches 99% of wanted people and 0.1% of everyone else. What is the headline missing?'
        options:
          - id: b
            text: Wanted people are so rare that even 0.1% of passers-by outnumber them
          - id: c
            text: A 99% match rate means that at most 1% of matches can be innocent
          - id: a
            text: The camera must be faulty, as a 0.1% rate can't yield so many errors
        answer: b
        feedback: When almost everyone walking past is innocent, a tiny false-match rate applied to that huge group can still outnumber the true matches. Reading 99% as "99% of matches are guilty" swaps the conditional, which is the base-rate fallacy.
