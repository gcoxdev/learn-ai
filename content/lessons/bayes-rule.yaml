schema_version: 0.2-draft
lesson:
  id: bayes-rule
  version: 0.1.0-draft
  title: Update a belief using new evidence
  state: draft
  summary: Bayes’ rule combines prior prevalence with how likely evidence is under competing explanations, then
    normalizes the alternatives.
  slot: M06.2
  category: learning
  minutes: 12
  sources:
  - title: Deep Learning — probability and information theory
    url: https://www.deeplearningbook.org/contents/prob.html
objectives:
- id: objective.bayes-rule
  version: 1-draft
  statement: Bayes’ rule combines prior prevalence with how likely evidence is under competing explanations, then
    normalizes the alternatives.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - bayes-rule.base
  - bayes-rule.transfer
  prerequisites:
  - anyOf:
    - objective.uncertainty-models
scenes:
- id: bayes-rule.s1
  title: Begin with the alternatives
  type: explanation
  depth: intuition
  objective_refs:
  - objective.bayes-rule
  markdown: Suppose 1% of manufactured parts are defective. A detector flags 90% of defective parts and 5% of good
    parts. The chance of a flag given a defect differs from the chance of a defect given a flag. Bayes’ rule connects
    these directions using the prior defect rate.
  text_mode: Suppose 1% of manufactured parts are defective. A detector flags 90% of defective parts and 5% of good
    parts. The chance of a flag given a defect differs from the chance of a defect given a flag. Bayes’ rule connects
    these directions using the prior defect rate.
  bridges: []
- id: bayes-rule.s2
  title: Use counts before symbols
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bayes-rule
  markdown: Among 10,000 parts, expect 100 defects and 9,900 good parts under this simplified model. The detector
    flags about 90 defects and 495 good parts. Among 585 flagged parts, the defect fraction is 90/585, about 15.4%.
    A seemingly accurate detector can produce many false alarms when defects are rare.
  text_mode: Among 10,000 parts, expect 100 defects and 9,900 good parts under this simplified model. The detector
    flags about 90 defects and 495 good parts. Among 585 flagged parts, the defect fraction is 90/585, about 15.4%.
    A seemingly accurate detector can produce many false alarms when defects are rare.
  bridges:
  - probability
  - arithmetic
- id: bayes-rule.s3
  title: Read the formula in words
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bayes-rule
  markdown: Posterior probability is proportional to likelihood times prior probability. Normalize across all competing
    cases so their posterior probabilities sum to one. The denominator is the overall probability of the evidence.
    If that evidence has zero probability under the model, the ordinary conditional calculation is not defined.
  text_mode: Posterior probability is proportional to likelihood times prior probability. Normalize across all competing
    cases so their posterior probabilities sum to one. The denominator is the overall probability of the evidence.
    If that evidence has zero probability under the model, the ordinary conditional calculation is not defined.
  bridges: []
- id: bayes-rule.s4
  title: Update the assumptions as well as the number
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bayes-rule
  markdown: The calculation depends on the stated prevalence and detector behavior. If the factory changes, these
    may change too. New evidence can update a posterior, but an inaccurate likelihood model can still mislead. Report
    both the result and the conditions needed for interpreting it.
  text_mode: The calculation depends on the stated prevalence and detector behavior. If the factory changes, these
    may change too. New evidence can update a posterior, but an inaccurate likelihood model can still mislead. Report
    both the result and the conditions needed for interpreting it.
  bridges: []
- id: bayes-rule.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.bayes-rule
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: bayes-rule.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.bayes-rule
  markdown: Bayes’ rule combines prior prevalence with how likely evidence is under competing explanations, then
    normalizes the alternatives.
  text_mode: Bayes’ rule combines prior prevalence with how likely evidence is under competing explanations, then
    normalizes the alternatives.
