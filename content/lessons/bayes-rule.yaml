schema_version: 0.2-draft
lesson:
  id: bayes-rule
  version: 0.2.1-draft
  title: Update a belief using new evidence
  state: draft
  summary: Count real defects and false alarms before deciding what a detector’s flag means.
  slot: M06.2
  category: learning
  sources:
  - title: Deep Learning — probability and information theory
    url: https://www.deeplearningbook.org/contents/prob.html
objectives:
- id: objective.bayes-rule
  version: 1-draft
  statement: Bayes’ rule combines prior prevalence with how likely evidence is under competing explanations,
    then normalizes the alternatives.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - bayes-rule.base
  - bayes-rule.transfer
  prerequisites:
  - anyOf:
    - objective.uncertainty-models
scenes:
- id: bayes-rule.s1
  title: Begin with the alternatives
  type: explanation
  depth: intuition
  objective_refs:
  - objective.bayes-rule
  markdown: 'Suppose 1% of manufactured parts are defective. A detector flags 90% of defective parts and 5%
    of good parts. The chance of a flag given a defect differs from the chance of a defect given a flag. Bayes’
    rule connects these directions using the prior defect rate.


    A **prior** is the probability before using the new detector flag; here it is 1%. The flag is new **evidence**.
    A **posterior** is the probability after taking that evidence into account. Do not reverse the questions:
    “Of defective parts, how many were flagged?” starts with all defects; “Of flagged parts, how many are defective?”
    starts with all flags.'
  text_mode: 'Suppose 1% of manufactured parts are defective. A detector flags 90% of defective parts and 5%
    of good parts. The chance of a flag given a defect differs from the chance of a defect given a flag. Bayes’
    rule connects these directions using the prior defect rate.


    A **prior** is the probability before using the new detector flag; here it is 1%. The flag is new **evidence**.
    A **posterior** is the probability after taking that evidence into account. Do not reverse the questions:
    “Of defective parts, how many were flagged?” starts with all defects; “Of flagged parts, how many are defective?”
    starts with all flags.'
  bridges: []
- id: bayes-rule.s2
  title: Use counts before symbols
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bayes-rule
  markdown: Among 10,000 parts, expect 100 defects and 9,900 good parts under this simplified model. The detector
    flags about 90 defects and 495 good parts. Among 585 flagged parts, the defect fraction is 90/585, about
    15.4%. A seemingly accurate detector can produce many false alarms when defects are rare.
  text_mode: Among 10,000 parts, expect 100 defects and 9,900 good parts under this simplified model. The detector
    flags about 90 defects and 495 good parts. Among 585 flagged parts, the defect fraction is 90/585, about
    15.4%. A seemingly accurate detector can produce many false alarms when defects are rare.
  bridges:
  - probability
  - arithmetic
  figure:
    kind: bayes
    caption: Change the base rate, then count both true flags and false alarms.
    description: Two bars compare the defective share of all parts with the defective share of flagged parts.
      Controls change prevalence, detection, and false-alarm rates; a count table explains the conditional
      probability.
- id: bayes-rule.s3
  title: Read the formula in words
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bayes-rule
  markdown: 'Posterior probability is proportional to likelihood times prior probability. Normalize across
    all competing cases so their posterior probabilities sum to one. The denominator is the overall probability
    of the evidence. If that evidence has zero probability under the model, the ordinary conditional calculation
    is not defined.


    In the parts example, the two unnormalized weights are 0.01 × 0.90 = 0.009 for defective-and-flagged and
    0.99 × 0.05 = 0.0495 for good-and-flagged. **Normalize** means divide each by their total, 0.0585. The
    resulting defect probability is 0.009/0.0585, the same answer as 90/585. The count version and the compact
    rule tell the same story.'
  text_mode: 'Posterior probability is proportional to likelihood times prior probability. Normalize across
    all competing cases so their posterior probabilities sum to one. The denominator is the overall probability
    of the evidence. If that evidence has zero probability under the model, the ordinary conditional calculation
    is not defined.


    In the parts example, the two unnormalized weights are 0.01 × 0.90 = 0.009 for defective-and-flagged and
    0.99 × 0.05 = 0.0495 for good-and-flagged. **Normalize** means divide each by their total, 0.0585. The
    resulting defect probability is 0.009/0.0585, the same answer as 90/585. The count version and the compact
    rule tell the same story.'
  bridges: []
- id: bayes-rule.s4
  title: Update the assumptions as well as the number
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.bayes-rule
  markdown: The calculation depends on the stated prevalence and detector behavior. If the factory changes,
    these may change too. New evidence can update a posterior, but an inaccurate likelihood model can still
    mislead. Report both the result and the conditions needed for interpreting it.
  text_mode: The calculation depends on the stated prevalence and detector behavior. If the factory changes,
    these may change too. New evidence can update a posterior, but an inaccurate likelihood model can still
    mislead. Report both the result and the conditions needed for interpreting it.
  bridges: []
