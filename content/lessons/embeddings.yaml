- id: embeddings.extension-distributional
  title: Learn a vector from neighboring language
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.embeddings
  markdown: 'Distributional word embeddings learn from patterns of occurrence. A word2vec-style task can use
    a word to predict nearby words, or context to predict a word, with objective and approximation choices
    that affect the learned vectors. Words used in similar contexts may acquire related representations, but
    correlation in text does not certify interchangeable meaning or truth.


    A static word embedding supplies one vector for a vocabulary entry, so different senses of “bank” share
    that entry in a basic word-level setup. A contextual model transforms a token’s representation using its
    surrounding input. Compare the initial lookup vector with the later contextual activation: both are vectors,
    but they play different roles and contain different context information.'
  text_mode: 'Distributional word embeddings learn from patterns of occurrence. A word2vec-style task can use
    a word to predict nearby words, or context to predict a word, with objective and approximation choices
    that affect the learned vectors. Words used in similar contexts may acquire related representations, but
    correlation in text does not certify interchangeable meaning or truth.


    A static word embedding supplies one vector for a vocabulary entry, so different senses of “bank” share
    that entry in a basic word-level setup. A contextual model transforms a token’s representation using its
    surrounding input. Compare the initial lookup vector with the later contextual activation: both are vectors,
    but they play different roles and contain different context information.'
