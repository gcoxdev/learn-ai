  markdown: Use a fresh example to check what you can explain. Hints remain available for practice.
  text_mode: Labeled controls and untimed feedback.
- id: embeddings.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.embeddings
  markdown: Token IDs select learned starting vectors. Contextual layers then calculate input-dependent representations.
    Similarity can be useful without being a guarantee of truth.
  text_mode: Token IDs select learned starting vectors. Contextual layers then calculate input-dependent representations.
    Similarity can be useful without being a guarantee of truth.
