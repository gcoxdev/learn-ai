schema_version: 0.2-draft
lesson:
  id: embeddings
  version: 0.1.0-draft
  title: From token IDs to learned vectors
  state: draft
  summary: Distinguish an integer token ID, a learned embedding, and a representation that changes with context.
  slot: M14.4
  category: learning
  minutes: 12
  sources:
  - title: Efficient Estimation of Word Representations in Vector Space
    url: https://arxiv.org/abs/1301.3781
  - title: PyTorch — embedding lookup
    url: https://docs.pytorch.org/docs/2.14/generated/torch.nn.modules.sparse.Embedding.html
objectives:
- id: objective.embeddings
  version: 1-draft
  statement: Distinguish an integer token ID, a learned embedding, and a representation that changes with context.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - embeddings.base
  - embeddings.transfer
  prerequisites:
  - anyOf:
    - objective.vectors
  - anyOf:
    - objective.tokenization
  - anyOf:
    - objective.update-consequence
scenes:
- title: Use the ID to find a row
  markdown: 'Imagine an embedding table with one row per vocabulary token. ID 17 selects row 17, which might be
    [0.2, −0.4, 0.7]. Three numbers now replace one ID as the token’s initial representation.


    These are constructed values. The table’s width fixes the representation size. Selecting row 17 does not mean
    multiplying every coordinate by 17: the ID locates the row, while the row contains learned parameters.'
  id: embeddings.s1
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.embeddings
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Training shapes the table
  markdown: 'Embeddings are numerical parameters that can be adjusted through a training objective. When predictions
    made from a token’s representation contribute to loss, gradients can guide changes to the trainable table. Some
    applications deliberately freeze an embedding table.


    Research on distributional word representations showed how patterns of use can produce useful geometric relationships.
    That does not mean every coordinate has a human-readable concept, or that every relationship is reliable.'
  bridges:
  - vectors
  id: embeddings.s2
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.embeddings
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: A row is not the whole meaning in a sentence
  markdown: 'The word “bank” in “river bank” and “savings bank” may start from the same token embedding when represented
    by the same ID. After contextual processing, its hidden representation can differ between sentences.


    Distinguish the initial lookup from later computation. A learned embedding table is shared model state. A particular
    sentence’s contextual activations are calculated for that input.'
  type: table
  columns:
  - Object
  - Role
  rows:
  - - Token ID
    - Select a vocabulary entry
  - - Embedding row
    - Learned initial vector
  - - Contextual representation
    - Input-dependent vector after processing
  id: embeddings.s3
  depth: mechanics
  objective_refs:
  - objective.embeddings
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Similarity is a tool, not a truth test
  markdown: 'Nearby vectors can be useful for retrieval or comparison, depending on how the representation was trained.
    A neighborhood may also reflect ambiguity, frequency, social bias, or a training objective unrelated to your
    task.


    For a toy example, [1, 0] and [2, 0] point the same way but differ in magnitude. Comparing them with dot product
    versus cosine similarity can produce different numerical behavior. Choose the comparison for a reason; do not
    read arbitrary coordinates as certified facts.'
  id: embeddings.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.embeddings
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Follow the distinction through a language model
  markdown: 'Tokenization produces IDs. Lookup produces initial vectors. Contextual layers transform those vectors.
    A vocabulary projection later produces scores for possible output tokens. Some architectures share input and
    output embedding weights; others do not.


    This lesson’s key distinction survives those choices: an ID, a parameter row, and a contextual activation are
    different objects. Keeping them separate makes attention and caching much easier to understand.'
  id: embeddings.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.embeddings
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- id: embeddings.extension-distributional
  title: Learn a vector from neighboring language
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.embeddings
  markdown: 'Distributional word embeddings learn from patterns of occurrence. A word2vec-style task can use a word
    to predict nearby words, or context to predict a word, with objective and approximation choices that affect
    the learned vectors. Words used in similar contexts may acquire related representations, but correlation in
    text does not certify interchangeable meaning or truth.


    A static word embedding supplies one vector for a vocabulary entry, so different senses of “bank” share that
    entry in a basic word-level setup. A contextual model transforms a token’s representation using its surrounding
    input. Compare the initial lookup vector with the later contextual activation: both are vectors, but they play
    different roles and contain different context information.'
  text_mode: 'Distributional word embeddings learn from patterns of occurrence. A word2vec-style task can use a
    word to predict nearby words, or context to predict a word, with objective and approximation choices that affect
    the learned vectors. Words used in similar contexts may acquire related representations, but correlation in
    text does not certify interchangeable meaning or truth.


    A static word embedding supplies one vector for a vocabulary entry, so different senses of “bank” share that
    entry in a basic word-level setup. A contextual model transforms a token’s representation using its surrounding
    input. Compare the initial lookup vector with the later contextual activation: both are vectors, but they play
    different roles and contain different context information.'
  bridges:
  - vectors
- id: embeddings.check
  title: Make the idea your own
  type: assessment
