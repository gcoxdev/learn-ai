    These example values are invented. An embedding row is not a dictionary definition, and tokens with consecutive
    IDs need not have similar vectors.'
- title: Training shapes the table
  markdown: 'An embedding table contains adjustable numbers, called parameters. Training uses examples to adjust
    those numbers toward a goal, such as predicting a nearby word. **Loss** is a number that measures how far
    a prediction is from the desired answer. A **gradient** describes how small changes to each parameter would
    locally change that loss. These clues can guide changes to a trainable table; you do not need to calculate
    them to understand how looking up a row works. Some applications **freeze** the table: they keep its numbers
    fixed during further training.


    Research on distributional word representations showed how patterns of use can produce useful geometric
    relationships. That does not mean every coordinate has a human-readable concept, or that every relationship
    is reliable.'
  bridges:
  - vectors
  id: embeddings.s2
  type: explanation
