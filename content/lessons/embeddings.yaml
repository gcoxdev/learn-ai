    A particular sentence’s contextual activations are calculated for that input.'
- title: Choose what vector similarity should measure
  markdown: 'Nearby vectors can help with retrieval or comparison, depending on how they were trained. Their
    relationships may also reflect ambiguity, frequency, social bias, or a task different from yours.


    The **dot product** multiplies matching entries and adds them: [1, 0] with [2, 0] gives 2. **Cosine similarity**
    divides that result by both vector lengths: 2 / (1 × 2) = 1. These vectors point the same way but have
    different magnitudes.


    Doubling a candidate vector doubles its dot product while leaving this cosine unchanged. Choose the comparison
    that fits your purpose; proximity alone does not verify a fact.'
  id: embeddings.s4
