- title: Follow the distinction through a language model
  markdown: 'Tokenization produces IDs. Lookup produces initial vectors. Contextual layers transform those
    vectors. A vocabulary projection later produces scores for possible output tokens. Some architectures share
    input and output embedding weights; others do not.


    This lesson’s key distinction survives those choices: an ID, a parameter row, and a contextual activation
    are different objects. Keeping them separate makes attention and caching much easier to understand.'
  id: embeddings.s5
