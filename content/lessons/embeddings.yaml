- title: A row is not the whole meaning in a sentence
  markdown: 'The word “bank” in “river bank” and “savings bank” may start from the same token embedding when
    represented by the same ID. After contextual processing, its hidden representation can differ between sentences.


    Distinguish the initial lookup from later computation. A learned embedding table is shared model state.
    A particular sentence’s contextual activations are calculated for that input.'
  type: table
  columns:
  - Object
  - Role
  rows:
  - - Token ID
    - Select a vocabulary entry
  - - Embedding row
    - Learned initial vector
  - - Contextual representation
    - Input-dependent vector after processing
  id: embeddings.s3
