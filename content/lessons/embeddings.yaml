scenes:
- title: Use the ID to find a row
  markdown: 'An embedding table has one row per vocabulary token. ID 17 selects row 17, which might contain
    [0.2, −0.4, 0.7]. This ordered list is a **vector**; its **dimension** is the number of entries, here three.


    The row supplies the token’s starting representation. Its values are learned parameters, while the ID only
    selects the row—it does not multiply its entries by 17. The table’s width fixes the representation size.


    These example values are invented. An embedding row is not a dictionary definition, and tokens with consecutive
    IDs need not have similar vectors.'
  id: embeddings.s1
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.embeddings
  text_mode: 'An embedding table has one row per vocabulary token. ID 17 selects row 17, which might contain
