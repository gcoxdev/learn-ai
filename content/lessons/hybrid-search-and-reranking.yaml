schema_version: 0.2-draft
lesson:
  id: hybrid-search-and-reranking
  version: 0.1.0-draft
  title: Improve candidate retrieval and rank the useful evidence
  state: draft
  summary: Query rewriting, lexical/dense fusion, and reranking address different retrieval failures; evaluate each
    stage with relevance judgments and resource budgets.
  slot: M26.4
  category: learning
  sources:
  - title: Introduction to Information Retrieval — authors’ online edition
    url: https://nlp.stanford.edu/IR-book/
  - title: Passage Re-ranking with BERT
    url: https://arxiv.org/abs/1901.04085
objectives:
- id: objective.hybrid-search-and-reranking
  version: 1-draft
  statement: Query rewriting, lexical/dense fusion, and reranking address different retrieval failures; evaluate
    each stage with relevance judgments and resource budgets.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - hybrid-search-and-reranking.base
  - hybrid-search-and-reranking.transfer
  prerequisites:
  - anyOf:
    - objective.retrieval-ingestion-and-chunking
scenes:
- id: hybrid-search-and-reranking.s1
  title: Clarify the search intent
  type: explanation
  depth: intuition
  objective_refs:
  - objective.hybrid-search-and-reranking
  markdown: A query rewrite can expand abbreviations, add context, or split a compound question into subqueries.
    It can also introduce assumptions that were absent from the request. Preserve the original need and compare
    retrieved evidence, especially for names, dates, and exact identifiers.
  text_mode: A query rewrite can expand abbreviations, add context, or split a compound question into subqueries.
    It can also introduce assumptions that were absent from the request. Preserve the original need and compare
    retrieved evidence, especially for names, dates, and exact identifiers.
  bridges: []
- id: hybrid-search-and-reranking.s2
  title: Combine complementary candidates
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.hybrid-search-and-reranking
  markdown: Hybrid search combines lexical and dense results through a defined scoring or rank-fusion method. Lexical
    matching can help exact terms while embeddings find related wording. Raw scores from different systems may have
    incompatible scales, so naive addition needs justification or calibration.
  text_mode: Hybrid search combines lexical and dense results through a defined scoring or rank-fusion method. Lexical
    matching can help exact terms while embeddings find related wording. Raw scores from different systems may have
    incompatible scales, so naive addition needs justification or calibration.
  bridges: []
- id: hybrid-search-and-reranking.s3
  title: Rerank a smaller set jointly
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.hybrid-search-and-reranking
  markdown: A cross-encoder can read a query and candidate passage together to score relevance more richly than
    independent embeddings. Applying it only to a candidate set limits cost. It cannot recover a relevant passage
    never supplied to that stage unless the system explicitly performs another retrieval.
  text_mode: A cross-encoder can read a query and candidate passage together to score relevance more richly than
    independent embeddings. Applying it only to a candidate set limits cost. It cannot recover a relevant passage
    never supplied to that stage unless the system explicitly performs another retrieval.
  bridges: []
- id: hybrid-search-and-reranking.s4
  title: Measure stage-level and final quality
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.hybrid-search-and-reranking
  markdown: Recall at k asks whether relevant items appear among k candidates; rank-sensitive measures reward useful
    ordering. Inspect query slices, latency, and downstream answer quality. Better retrieval metrics help only to
    the extent that the selected relevance definition matches the application’s evidence needs.
  text_mode: Recall at k asks whether relevant items appear among k candidates; rank-sensitive measures reward useful
    ordering. Inspect query slices, latency, and downstream answer quality. Better retrieval metrics help only to
    the extent that the selected relevance definition matches the application’s evidence needs.
  bridges: []
- id: hybrid-search-and-reranking.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.hybrid-search-and-reranking
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Query rewriting, lexical/dense fusion, and reranking address different retrieval failures; evaluate
    each stage with relevance judgments and resource budgets.
- id: hybrid-search-and-reranking.recap
