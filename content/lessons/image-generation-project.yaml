assessment_families:
  - id: image-generation-project.base
    objective_ref: objective.image-generation-project
    task: base
    response_type: single_choice
    points: 1
    hint: 'Trace a transparent toy sampler: trace the inputs, operation, and result before choosing.'
    remediation_scene: image-generation-project.s2
    variants:
      - id: image-generation-project.base.1
        prompt: Under the toy top-row rule, fixture value 0.80 selects which image?
        options:
          - id: a
            text: B
          - id: b
            text: A
          - id: c
            text: C
        answer: a
        feedback: 0.80 is not below the 0.75 cutoff, so the rule selects B.
        retired: true
      - id: image-generation-project.base.2
        prompt: Which fraction of the four fixture outputs matches top row exactly?
        options:
          - id: b
            text: 3/4
          - id: c
            text: 4/4
          - id: a
            text: 2/4
        answer: a
        feedback: The fixture A,B,A,B contains two matching A images.
        retired: true
  - id: image-generation-project.transfer
    objective_ref: objective.image-generation-project
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Deliver a small research note: trace the inputs, operation, and result before choosing.'
    remediation_scene: image-generation-project.s6
    variants:
      - id: image-generation-project.transfer.1
        prompt: Which comparison separates adherence from diversity?
        options:
          - id: b
            text: A varied set satisfies the condition because it varies
          - id: c
            text: An adherence score measures the number of distinct outputs
          - id: a
            text: A repeated valid image can satisfy the condition but lack variety
        answer: a
        feedback: Correctness under the condition and variety are different measurements.
        retired: true
      - id: image-generation-project.transfer.2
        prompt: Which description accurately labels the paper sampler?
        options:
          - id: c
            text: A reproduced large-scale image training experiment
          - id: a
            text: A hand-specified toy with an explicit probability rule
          - id: b
            text: A trained latent diffusion model with learned weights
        answer: a
        feedback: The toy does not implement learned denoising or realistic image training.
        retired: true
  - id: image-generation-project.base.v2
    objective_ref: objective.image-generation-project
    task: base
    response_type: single_choice
    points: 1
    hint: The ideal denoiser is a weighted average of training images whose weights sharpen as noise falls. Ask which images it averages and what that does at low noise.
    remediation_scene: image-generation-project.s4
    variants:
      - id: image-generation-project.base.v2.1
        prompt: Every sample from the ideal-denoiser generator is an exact copy of a training image. Why?
        options:
          - id: b
            text: The noise schedule removes all randomness during the final few steps
          - id: a
            text: At low noise its weighted average puts nearly all weight on one image
          - id: c
            text: The sampler starts from a training image instead of from pure noise
        answer: a
        feedback: As $\bar\alpha_t$ nears 1, the weights $\exp(-d^2/2(1-\bar\alpha_t))$ become extremely sharp, so the nearest training image wins outright. Randomness is still added until the last step, and sampling starts from pure noise.
      - id: image-generation-project.base.v2.2
        prompt: How does the condition "square" enter the ideal-denoiser generator?
        options:
          - id: a
            text: The denoiser averages over the six square training images only
          - id: b
            text: A faint square pattern is added to the starting noise image
          - id: c
            text: Finished samples that aren't squares are thrown away and redrawn
        answer: a
        feedback: Conditioning changes which images the denoiser believes in at every step. The starting noise is the same kind for every class, and nothing is filtered after the fact.
      - id: image-generation-project.base.v2.3
        prompt: In the score table, which measure reveals that the ideal generator only copies?
        options:
          - id: c
            text: Distinct outputs, which reach 6 of the 6 possible training squares
          - id: b
            text: On-condition rate, which is a perfect 1.00 for each class
          - id: a
            text: Copy distance, the mean distance to the nearest training image
        answer: a
        feedback: A copy distance of 0.00 means every sample sits exactly on a training image. Perfect adherence and full variety are also what a photocopier with a random page picker would score.
      - id: image-generation-project.base.v2.4
        prompt: The Gaussian denoiser's samples have copy distance about 4.5 and crispness 0.39 to 0.49. What does that describe?
        options:
          - id: a
            text: New images that are blurry blends rather than clean shapes
          - id: b
            text: Training images copied exactly, then given a little extra noise
          - id: c
            text: Sharp new shapes that the training set never contained
        answer: a
        feedback: A large copy distance means the samples are new; low crispness means most pixels sit between off and on. Slightly noisy copies would have a small copy distance, and sharp shapes would score near 1.00 on crispness.
  - id: image-generation-project.transfer.v2
    objective_ref: objective.image-generation-project
    task: transfer
    response_type: single_choice
    points: 1
    hint: Decide which of the four questions (condition, variety, quality, novelty) the evidence answers, and which it leaves open.
    remediation_scene: image-generation-project.s5
    variants:
      - id: image-generation-project.transfer.v2.1
        prompt: A startup's face generator gets an excellent FID against its 5,000 training faces, and it plans to advertise "brand-new faces". What check should come first?
        options:
          - id: b
            text: Recompute FID on a larger batch of generated faces
          - id: a
            text: Find each output's nearest training face and count near-copies
          - id: c
            text: Ask raters whether the generated faces look realistic
        answer: a
        feedback: FID compares statistics, so returning training faces scores well, and raters would find copies realistic too. Only a nearest-neighbor search tests the "brand-new" claim.
      - id: image-generation-project.transfer.v2.2
        prompt: A logo generator asked for "circle" produces 50 varied, crisp logos, and 12 of them are triangles. Which measure captures the problem?
        options:
          - id: a
            text: Condition adherence, since 38 of 50 match the request
          - id: b
            text: Variety, since the 50 logos are all different designs
          - id: c
            text: Quality, since the logos have clean and sharp edges
        answer: a
        feedback: The outputs vary and look good, but a quarter ignore the request. Variety that breaks the condition shouldn't count in the generator's favor.
      - id: image-generation-project.transfer.v2.3
        prompt: A generator trained on 20 icons makes outputs that are all new but smeared, with no crisp edges. What does this project suggest is going on?
        options:
          - id: c
            text: It's memorizing, so the training set should be made smaller
          - id: b
            text: It's a sampler bug, since correct diffusion gives sharp images
          - id: a
            text: It behaves like the Gaussian denoiser, blending training images
        answer: a
        feedback: New but blurry is the Gaussian denoiser's signature. Memorizing produces crisp copies, the opposite symptom, and a correct sampler with a too-smooth denoiser still gives blur.
      - id: image-generation-project.transfer.v2.4
        prompt: A team evaluates its text-to-image model with one number, average image sharpness. What is the most important thing missing?
        options:
          - id: b
            text: A larger test set to narrow the error bars on the sharpness score
          - id: c
            text: A finer sharpness metric computed at a higher image resolution
          - id: a
            text: Separate scores for prompt-following, variety, and copying
        answer: a
        feedback: Sharpness is one of four questions. A generator can be sharp while ignoring prompts, repeating itself, or copying training images, and a more precise sharpness number won't reveal any of those.
  - id: image-generation-project.recover.v2
    objective_ref: objective.image-generation-project
    task: base
    response_type: numeric
    points: 1
    hint: Solve the forward formula for the clean value, x̂₀ = (x_t − √(1 − ᾱ) · ε̂) ÷ √ᾱ, exactly as the sampler does before each reverse step.
    remediation_scene: image-generation-project.denoiser
    absolute_tolerance: 0.01
    variants:
      - id: image-generation-project.recover.v2.1
