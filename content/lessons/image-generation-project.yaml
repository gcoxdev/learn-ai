assessment_families:
- id: image-generation-project.base
  objective_ref: objective.image-generation-project
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace a transparent toy sampler: trace the inputs, operation, and result before choosing.'
  remediation_scene: image-generation-project.s2
  variants:
  - id: image-generation-project.base.1
    prompt: Under the toy top-row rule, fixture value 0.80 selects which image?
    options:
    - id: a
      text: B
    - id: b
      text: A
    - id: c
      text: C
    answer: a
    feedback: 0.80 is not below the 0.75 cutoff, so the rule selects B.
  - id: image-generation-project.base.2
    prompt: Which fraction of the four fixture outputs matches top row exactly?
    options:
    - id: b
      text: 3/4
    - id: c
      text: 4/4
    - id: a
      text: 2/4
    answer: a
    feedback: The fixture A,B,A,B contains two matching A images.
- id: image-generation-project.transfer
  objective_ref: objective.image-generation-project
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Deliver a small research note: trace the inputs, operation, and result before choosing.'
  remediation_scene: image-generation-project.s6
  variants:
  - id: image-generation-project.transfer.1
    prompt: Which comparison separates adherence from diversity?
    options:
    - id: b
      text: A varied set satisfies the condition because it varies
    - id: c
      text: An adherence score measures the number of distinct outputs
    - id: a
      text: A repeated valid image can satisfy the condition but lack variety
    answer: a
    feedback: Correctness under the condition and variety are different measurements.
  - id: image-generation-project.transfer.2
    prompt: Which description accurately labels the paper sampler?
    options:
    - id: c
      text: A reproduced large-scale image training experiment
    - id: a
      text: A hand-specified toy with an explicit probability rule
    - id: b
      text: A trained latent diffusion model with learned weights
    answer: a
    feedback: The toy does not implement learned denoising or realistic image training.
