schema_version: 0.2-draft
lesson:
  id: image-generation-project
  version: 0.2.0-draft
  title: 'Project: specify and test a conditional image generator'
  state: draft
  summary: Design a tiny image generator and test whether it follows the requested condition.
  slot: M36.9
  category: learning
  minutes: 45
  sources:
  - title: Latent Diffusion Models
    url: https://arxiv.org/abs/2112.10752
  - title: Flow Matching
    url: https://arxiv.org/abs/2210.02747
objectives:
- id: objective.image-generation-project
  version: 1-draft
  statement: Design a small conditional generation task, trace a transparent toy sampler, and write tests for
    conditioning, diversity, and failures without mistaking the toy for a trained image model.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - image-generation-project.base
  - image-generation-project.transfer
  prerequisites:
  - anyOf:
    - objective.latent-diffusion
  - anyOf:
    - objective.multimodal-grounding-evaluation
scenes:
- id: image-generation-project.s1
  title: Define a small image world
  type: explanation
  depth: intuition
  objective_refs:
  - objective.image-generation-project
  markdown: Draw 2×2 grids. Each cell is either white (0) or black (1). For the condition “top row,” use image
    A=[1,1;0,0]. For “left column,” use B=[1,0;1,0]. A third image C=[1,0;0,1] is diagonal. A condition is
    information specifying what kind of result is wanted. Save these definitions on paper or in a local file.
    You need no model download or paid service for this project.
  text_mode: Draw 2×2 grids. Each cell is either white (0) or black (1). For the condition “top row,” use image
    A=[1,1;0,0]. For “left column,” use B=[1,0;1,0]. A third image C=[1,0;0,1] is diagonal. A condition is
    information specifying what kind of result is wanted. Save these definitions on paper or in a local file.
    You need no model download or paid service for this project.
  bridges: []
- id: image-generation-project.s2
  title: Trace a transparent toy sampler
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.image-generation-project
  markdown: 'Define a toy generator that, for “top row,” chooses A with probability 0.75 and B with probability
    0.25. To simulate it on paper, use the fixed numbers 0.10, 0.80, 0.30, and 0.95. Choose A for a number
    below 0.75 and B otherwise. The four outputs are A, B, A, B. These numbers are a reproducible fixture,
    not evidence of a random generator’s quality. The procedure is specified by hand and is not a trained diffusion
    model. For “left column,” reverse the rule: choose B below 0.75 and A otherwise. The same four numbers
    give B, A, B, A. For any unsupported condition, return “condition not supported” instead of an image. These
    rules make every requested test reproducible.'
  text_mode: 'Define a toy generator that, for “top row,” chooses A with probability 0.75 and B with probability
    0.25. To simulate it on paper, use the fixed numbers 0.10, 0.80, 0.30, and 0.95. Choose A for a number
    below 0.75 and B otherwise. The four outputs are A, B, A, B. These numbers are a reproducible fixture,
    not evidence of a random generator’s quality. The procedure is specified by hand and is not a trained diffusion
    model. For “left column,” reverse the rule: choose B below 0.75 and A otherwise. The same four numbers
    give B, A, B, A. For any unsupported condition, return “condition not supported” instead of an image. These
    rules make every requested test reproducible.'
  bridges: []
- id: image-generation-project.s3
  title: Separate quality questions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.image-generation-project
  markdown: Two of the four fixture outputs match “top row,” so exact condition adherence on this fixture is
    2/4. There are two distinct outputs, A and B, giving some variety but also incorrect conditioning. A generator
    returning A on every top-row request would have perfect adherence in this tiny world yet no within-condition
    variety. Define a richer world if you want multiple valid top-row images. Do not reward diversity that
    breaks the requested condition.
  text_mode: Two of the four fixture outputs match “top row,” so exact condition adherence on this fixture
    is 2/4. There are two distinct outputs, A and B, giving some variety but also incorrect conditioning. A
    generator returning A on every top-row request would have perfect adherence in this tiny world yet no within-condition
    variety. Define a richer world if you want multiple valid top-row images. Do not reward diversity that
    breaks the requested condition.
  bridges: []
- id: image-generation-project.s4
  title: Connect the toy to a learned pipeline
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.image-generation-project
  markdown: 'Draw a second diagram for a latent image generator: condition encoding, starting noise, repeated
    learned denoising or velocity prediction, and image decoding. Label which pieces would need training data,
    objectives, and checkpoints. State that your paper sampler implements none of those learned components.
    The comparison shows what the toy can test—an output contract—and which architectural claims require separate
    evidence from a real artifact.'
  text_mode: 'Draw a second diagram for a latent image generator: condition encoding, starting noise, repeated
    learned denoising or velocity prediction, and image decoding. Label which pieces would need training data,
    objectives, and checkpoints. State that your paper sampler implements none of those learned components.
    The comparison shows what the toy can test—an output contract—and which architectural claims require separate
    evidence from a real artifact.'
  bridges: []
- id: image-generation-project.s5
  title: Write failure and review cases
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.image-generation-project
  markdown: 'Supply five tests: the two known conditions, an unsupported condition, repeated generation under
    a fixed seed or fixture, and a condition with several valid outputs in an extended image world. Specify
    what to do when a condition is unsupported. Keep training examples separate from any evaluation of a learned
    extension. Review correctness of the fixture, condition adherence, meaningful diversity, reproducibility,
    and stated limitations, scoring each 0–2. The in-app quiz checks concepts, not your unseen project.'
  text_mode: 'Supply five tests: the two known conditions, an unsupported condition, repeated generation under
    a fixed seed or fixture, and a condition with several valid outputs in an extended image world. Specify
    what to do when a condition is unsupported. Keep training examples separate from any evaluation of a learned
    extension. Review correctness of the fixture, condition adherence, meaningful diversity, reproducibility,
    and stated limitations, scoring each 0–2. The in-app quiz checks concepts, not your unseen project.'
  bridges: []
- id: image-generation-project.s6
  title: Deliver a small research note
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.image-generation-project
  markdown: Save your grid definitions, probability rule, four traced outputs, metric calculations, proposed
    learned-system diagram, and review table. Paper work is a complete route; an optional local script can
    reproduce the fixture. Write one paragraph explaining why a high toy score cannot establish realistic image
    quality. Ask a peer to reproduce one calculation and challenge one test criterion. Improve the artifact
    where their interpretation differs from your intention.
  text_mode: Save your grid definitions, probability rule, four traced outputs, metric calculations, proposed
    learned-system diagram, and review table. Paper work is a complete route; an optional local script can
    reproduce the fixture. Write one paragraph explaining why a high toy score cannot establish realistic image
    quality. Ask a peer to reproduce one calculation and challenge one test criterion. Improve the artifact
    where their interpretation differs from your intention.
  bridges: []
- id: image-generation-project.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.image-generation-project
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: A generator must be tested for the condition it was asked to satisfy, meaningful variety, and reproducibility.
    A transparent toy can test those ideas without demonstrating the capabilities of a trained image model.
- id: image-generation-project.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.image-generation-project
  markdown: Design a small conditional generation task, trace a transparent toy sampler, and write tests for
    conditioning, diversity, and failures without mistaking the toy for a trained image model.
  text_mode: Design a small conditional generation task, trace a transparent toy sampler, and write tests for
    conditioning, diversity, and failures without mistaking the toy for a trained image model.
