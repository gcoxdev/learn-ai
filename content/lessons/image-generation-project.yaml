schema_version: 0.2-draft
lesson:
  id: image-generation-project
  version: 0.4.0-draft
  title: 'Project: specify and test a conditional image generator'
  state: draft
  summary: Build a diffusion generator for 8×8 pictures in NumPy, ask it for squares, and watch it earn perfect scores by photocopying its training set. Then catch it.
  slot: M36.9
  category: learning
  minutes: 45
  sources:
    - title: Denoising Diffusion Probabilistic Models (Ho, Jain & Abbeel, 2020)
      url: https://arxiv.org/abs/2006.11239
    - title: Extracting Training Data from Diffusion Models (Carlini et al., 2023)
      url: https://arxiv.org/abs/2301.13188
    - title: High-Resolution Image Synthesis with Latent Diffusion Models (Rombach et al., 2022)
      url: https://arxiv.org/abs/2112.10752
objectives:
  - id: objective.image-generation-project
    version: 2-draft
    statement: Build a tiny class-conditional diffusion generator, and evaluate its outputs separately for following the condition, variety, image quality, and copying of training images.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - image-generation-project.base.v2
      - image-generation-project.transfer.v2
      - image-generation-project.recover.v2
    prerequisites:
      - anyOf:
          - objective.latent-diffusion
      - anyOf:
          - objective.multimodal-grounding-evaluation
scenes:
  - id: image-generation-project.s1
    title: Eighteen tiny pictures and a request
    type: explanation
    depth: intuition
    objective_refs:
      - objective.image-generation-project
    markdown: |-
      A colleague shows you a demo. "Ask it for a square," she says, and it draws a crisp square. Ask again: a different square. Every output is sharp, every one matches the request, and the squares keep changing. "Perfect scores," she says. "Ship it?"

      In this project you'll build that generator yourself, from noise to picture, and find out what those perfect scores were hiding.

      **Your brief**

      | | |
      | --- | --- |
      | Goal | Build a diffusion generator for 8×8 images that takes a condition ("row", "column", or "square"), then evaluate it honestly |
      | Audience | The colleague who's about to ship the demo |
      | Done looks like | Working generator code (or a hand trace), a score table with four separate measures, sample pictures, and one paragraph on what the scores can and can't tell her |
      | Time | About 45 minutes |

      You'll reuse three ideas from module 22, the generative-models module: the forward process that adds noise, the reverse step that removes it (*How an image can emerge from noise*), and conditioning on a prompt (*Why image generators work in latent space*). Everything runs in NumPy on 64-pixel images, so each run takes under a second.
  - id: image-generation-project.s2
    title: The dataset, and one noisy pixel
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.image-generation-project
    markdown: |-
      **The supplied data.** As in the vision module, an image is a grid of numbers, one per pixel. Here each image is an 8×8 grid with pixels at −1 (off) or +1 (on). There are 18 training images, six per class:

      | Class | The six images |
      | --- | --- |
      | row | A full horizontal line in row 1, 2, 3, 4, 5, or 6 |
      | column | A full vertical line in column 1, 2, 3, 4, 5, or 6 |
      | square | A filled 3×3 square with its top-left corner at (row 1 or 4, column 1, 3, or 5) |

      Rows and columns are numbered 0 to 7 from the top left. Sketch all 18 on squared paper; you'll need them to judge the outputs.

      **Milestone 1: the forward process.** Diffusion training adds noise with the closed form from *How an image can emerge from noise*:

      $$x_t = \sqrt{\bar\alpha_t}\,x_0 + \sqrt{1 - \bar\alpha_t}\,\varepsilon$$

      This project uses $T = 50$ steps, with the fresh noise per step $\beta_t$ rising evenly from 0.001 to 0.2, so $\bar\alpha_t$, the fraction of signal left, falls from 0.999 to about 0.005 by step 50: almost pure noise. Work one pixel: an "on" pixel $x_0 = 1$, at a level where $\bar\alpha_t = 0.64$, with a noise draw $\varepsilon = -0.5$. Then $x_t = 0.8 \times 1 + 0.6 \times (-0.5) = 0.5$. The pixel is still brighter than zero, but only just.
  - id: image-generation-project.denoiser
    title: The best possible denoiser, written down
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.image-generation-project
    markdown: |-
      **Milestone 2: the denoiser.** A real generator trains a network to guess the clean image from a noisy one. With only 18 training images, you can skip training and write down the *best possible* guess directly. It's a weighted average of the training images: each one is weighted by how likely it is to have produced the noisy image you see.

      Work it on a one-pixel world with two training "images", $+1$ and $-1$. You observe $x_t = 0.3$ at $\bar\alpha_t = 0.64$.

      1. Where would each training image sit before noise? At $0.8 \times (+1) = 0.8$ and $0.8 \times (-1) = -0.8$.
      2. Squared distances from 0.3: $(0.3 - 0.8)^2 = 0.25$ and $(0.3 + 0.8)^2 = 1.21$.
      3. Weights $\propto \exp(-d^2 / (2(1 - \bar\alpha_t)))$ with $2 \times 0.36 = 0.72$: $e^{-0.347} = 0.707$ and $e^{-1.681} = 0.186$, which normalize to 0.79 and 0.21.
      4. Best guess: $0.79 \times (+1) + 0.21 \times (-1) = 0.58$.

      :::predict Near the end of generation, $\bar\alpha_t$ is about 0.99. With the same $x_t = 0.3$, what does the best guess become?
      Almost exactly +1. The divisor $2(1 - 0.99) = 0.02$ is tiny, so the squared distances 0.48 and 1.68 become $e^{-24}$ against $e^{-84}$: the nearer image takes essentially all the weight. As the noise fades, this denoiser stops averaging and picks one training image. Hold on to that; it's the key to the whole project.
      :::

      **Conditioning** is now one line: to generate a "square", average over the six square images only. The condition changes which images the denoiser believes in, at every step.

      :::papers The ideal denoiser
      For training images $x^{(1)}, \dots, x^{(N)}$ and Gaussian noise, the best guess in squared error is the posterior mean

      $$\hat x_0(x_t) = \sum_{i=1}^{N} w_i\, x^{(i)}, \qquad w_i \propto \exp\!\left(-\frac{\lVert x_t - \sqrt{\bar\alpha_t}\,x^{(i)} \rVert^2}{2(1 - \bar\alpha_t)}\right)$$

      In the one-pixel example, $N = 2$, the weights are 0.79 and 0.21, and $\hat x_0 = 0.58$. The sampler turns this into a noise estimate with $\hat\varepsilon = (x_t - \sqrt{\bar\alpha_t}\,\hat x_0) / \sqrt{1 - \bar\alpha_t}$ and takes a DDPM reverse step, exactly as in the denoising lesson.
      :::
  - id: image-generation-project.s3
    title: Generate, then score four ways
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.image-generation-project
    markdown: |-
      **Milestone 3: generate and measure.** The reference solution draws 30 samples per class from pure noise, with two denoisers: the ideal one, and a smoother one that pretends the training images form a single bell-shaped cloud. That second one is the best guess for a Gaussian fitted to the six images, so it can blend them. It then scores every sample four separate ways:

      | Measure | Question it answers | How it's computed |
      | --- | --- | --- |
      | On-condition | Did it draw what was asked? | Share of samples whose nearest training image has the requested class |
      | Distinct | Does it vary? | How many different training images are nearest, out of 6 |
      | Crisp | Does it look like the data? | Share of pixels within 0.2 of −1 or +1 |
      | Copy distance | Is it new? | Average distance to the nearest training image; 0 means an exact copy |

      ```python run
      import numpy as np

      # 18 training images, 8x8, pixels -1 (off) or +1 (on): six per class
      train = {"row": [], "column": [], "square": []}
      for k in range(1, 7):
          row = -np.ones((8, 8)); row[k, :] = 1
          col = -np.ones((8, 8)); col[:, k] = 1
          r, c = divmod(k - 1, 3)                         # squares sit on a 2 x 3 grid of positions
          sq = -np.ones((8, 8)); sq[1 + 3 * r:4 + 3 * r, 1 + 2 * c:4 + 2 * c] = 1
          for cls, img in [("row", row), ("column", col), ("square", sq)]:
              train[cls].append(img.ravel())
      train = {cls: np.array(v) for cls, v in train.items()}

      T = 50
      betas = np.linspace(1e-3, 0.2, T)                  # noise schedule
      alphas, abar = 1 - betas, np.cumprod(1 - betas)

      def ideal_denoiser(xt, ab, imgs):                   # best guess of x0: weighted average of training images
          d2 = ((xt[:, None] - np.sqrt(ab) * imgs) ** 2).sum(-1)
          w = np.exp(-(d2 - d2.min(1, keepdims=True)) / (2 * (1 - ab)))
          return (w / w.sum(1, keepdims=True)) @ imgs

      def gaussian_denoiser(xt, ab, imgs):                # best guess if images were a smooth bell-shaped cloud
          mu, C = imgs.mean(0), np.cov(imgs.T) + 1e-3 * np.eye(64)
          gain = np.sqrt(ab) * C @ np.linalg.inv(ab * C + (1 - ab) * np.eye(64))
          return mu + (xt - np.sqrt(ab) * mu) @ gain.T

      def generate(cls, n, denoiser, seed):
          rng = np.random.default_rng(seed)
          x = rng.normal(size=(n, 64))                    # start from pure noise
          for t in reversed(range(T)):                    # DDPM reverse steps
              eps = (x - np.sqrt(abar[t]) * denoiser(x, abar[t], train[cls])) / np.sqrt(1 - abar[t])
              x = (x - betas[t] / np.sqrt(1 - abar[t]) * eps) / np.sqrt(alphas[t])
              if t > 0:
                  x += np.sqrt(betas[t]) * rng.normal(size=x.shape)
          return x

      every = np.concatenate(list(train.values()))
      labels = np.repeat(list(train), 6)
      for name, den in [("ideal", ideal_denoiser), ("gaussian", gaussian_denoiser)]:
          for i, cls in enumerate(train):
              x = generate(cls, 30, den, seed=i)
              dist = np.sqrt(((x[:, None] - every) ** 2).sum(-1))       # distance to each training image
              nearest = dist.argmin(1)
              print(f"{name:8s} {cls:6s} on-condition {np.mean(labels[nearest] == cls):.2f}  "
                    f"distinct {len(set(nearest))}/6  crisp {np.mean(abs(abs(x) - 1) < 0.2):.2f}  "
                    f"copy distance {dist.min(1).mean():.2f}")
          for row in x[3].reshape(8, 8):                  # one generated square: # on, . off, + in between
              print("".join("#" if v > 0.6 else "." if v < -0.6 else "+" for v in row))
      ```

      **Expected output:**

      | Denoiser | Class | On-condition | Distinct | Crisp | Copy distance |
      | --- | --- | ---: | ---: | ---: | ---: |
      | Ideal | row | 1.00 | 6/6 | 1.00 | 0.00 |
      | Ideal | column | 1.00 | 6/6 | 1.00 | 0.00 |
      | Ideal | square | 1.00 | 6/6 | 1.00 | 0.00 |
      | Gaussian | row | 1.00 | 6/6 | 0.39 | 4.53 |
      | Gaussian | column | 1.00 | 6/6 | 0.43 | 4.47 |
      | Gaussian | square | 1.00 | 6/6 | 0.49 | 4.53 |

      The sample pictures match too: the ideal denoiser draws a clean 3×3 square in rows 1–3, columns 3–5, which is training square number 2, pixel for pixel. The Gaussian one draws a ghostly blend of several square positions, all in `+` marks, with no pixel fully on.

      :::predict Ask the ideal generator for 300 squares instead of 30 (change `30` to `300`). How many distinct squares will you get?
      Still 6. Its outputs are always one of the six training squares, so no number of samples can produce a seventh. More samples raise your confidence in the scores; they can't create variety the generator doesn't have.
      :::
  - id: image-generation-project.s4
    title: A perfect score from a photocopier
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.image-generation-project
    markdown: |-
      **Milestone 4: interpret.** Look at the ideal row of the table the way your colleague would: perfect adherence, full variety, perfectly crisp. Then look at the last column. Every single sample is an exact copy of a training image. The generator is a photocopier with a random page picker.

      That isn't a bug in your code. It's what the *best possible* denoiser for a finite training set does, as the predict question in the denoiser milestone showed: once noise is low, it snaps to the nearest training image. A trained network never fits this ideal exactly, which is part of why it can make new images; studies of diffusion models trained on small datasets have found they copy much more often. The Gaussian denoiser shows the opposite failure: every sample is new (copy distance about 4.5), but blurry.

      | | Ideal denoiser | Gaussian denoiser | What you want |
      | --- | --- | --- | --- |
      | Follows the condition | Yes | Yes | Yes |
      | Looks like the data | Perfectly | No, blurry blends | Yes |
      | New images | Never | Always | Yes |

      Real systems face the same tension. Carlini and colleagues (2023) showed that Stable Diffusion and Google's Imagen can reproduce some of their training images almost exactly. Standard scores wouldn't catch it: **FID** (Fréchet Inception Distance, from *Predicting a label, generating a possibility*) compares the statistics of generated and real images, so a model that returns real images scores very well.

      :::mixup "If outputs follow the prompt, look sharp, and vary, the generator is good."
      All three are true of a photocopier. Always add a copy check: find each output's nearest training image and count near-duplicates. For real images, compare in a feature space as well as by pixels, since a copy can be shifted or recolored.
      :::

      :::key The evaluation in one sentence
      Score condition, variety, quality, and novelty separately, because a generator can ace any three by failing the fourth.
      :::
  - id: image-generation-project.s5
    title: Mistakes that fake a good result
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.image-generation-project
    markdown: |-
      | Mistake | How to spot it | Fix |
      | --- | --- | --- |
      | No copy check | Your table has no novelty column | Add distance to the nearest training image |
      | Testing adherence with the generator's own training images as the judge, and nothing else | A copy scores a perfect match by construction | Also judge with a rule or classifier that never saw the training set, e.g. "exactly one full row lit" |
      | Averaging classes together | One overall number hides a weak class | Report every measure per condition |
      | Mistaking a lucky threshold for quality | A blurry sample looks clean when printed as just on/off | Print a middle level (`+`) too, as the code does |
      | Too few samples to judge variety | Distinct looks low at n = 5 | Draw enough samples; 30 per class here hits every mode |

      :::try Build an honest judge
      Write `is_row(x)`: true if exactly one row has all 8 pixels above 0 and every other pixel is below 0. Run it on both denoisers' row samples. All 30 ideal samples pass, but only 16 of the 30 Gaussian ones do: in the rest, the blend leaves stray pixels on or part of the row off. This judge knows nothing about the training images, so it checks the shape without trusting the training set; pair it with the copy distance to catch copying.
      :::
  - id: image-generation-project.s6
    title: Write the note, then score it
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.image-generation-project
    markdown: |-
      **Milestone 5: report.** Your note for the colleague has four parts: the score table, two sample pictures (one per denoiser), one paragraph explaining why the ideal generator's perfect scores mean copying, and a test list she can run on her real demo: condition adherence per prompt, variety, quality, and a nearest-training-image search on 100 outputs.

      **No-code option.** Work the one-pixel denoiser by hand at $\bar\alpha_t$ = 0.64 and 0.99 (milestone 2). Then take a 3×3 "image" world with two training squares, draw five outputs that would score perfectly on adherence, variety, and crispness while all being copies, and write the paragraph. The reasoning is the same as the full run.

      **Extension.** Swap diffusion for a tiny autoencoder, as in *Learn a latent representation and a way back to data*: compress each 64-pixel image to 2 numbers with a linear map fitted by least squares, decode points between the training codes, and apply the same four scores.

      **Rubric.** Score your note, or trade with a friend.

      | Criterion | Not yet | Solid | Excellent |
      | --- | --- | --- | --- |
      | Generator | Doesn't run or trace | Generates on-condition samples | Explains why the ideal denoiser snaps to training images |
      | Separate measures | One overall score | Condition, variety, quality reported | Plus a copy check, per class |
      | Evidence | Scores only | Scores and sample pictures | Pictures chosen to show both failure modes |
      | Caveats | "Looks good" | Names memorization | Explains why FID-style scores miss it and what test catches it |
      | Advice | None | A test list | A test list with pass marks the colleague can run this week |

      The questions below check the concepts; judge your note itself with this rubric.
  - id: image-generation-project.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.image-generation-project
    markdown: |-
      Recover a few clean pixels from noisy ones, explain the photocopier, and evaluate a face generator, a logo generator, and a sharpness-only report.
    takeaway: |-
      A generator must follow the condition, vary, look right, and make something new. Measure all four separately, because the best possible denoiser for a small dataset aces the first three by copying.
  - id: image-generation-project.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.image-generation-project
    markdown: |-
      Test whether outputs fit the requested condition, show meaningful variety, and can be reproduced. Keep the hand-written sampler’s results separate from claims about a learned generator.
