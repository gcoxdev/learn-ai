schema_version: 0.2-draft
lesson:
  id: uncertainty-models
  version: 0.1.0-draft
  title: Probability, likelihood, and what is unknown
  state: draft
  summary: Probability models assign uncertainty to outcomes; likelihood evaluates parameter choices against observations,
    while priors and uncertainty sources state what assumptions enter the analysis.
  slot: M06.1
  category: learning
  minutes: 12
  sources:
  - title: Deep Learning — probability and information theory
    url: https://www.deeplearningbook.org/contents/prob.html
objectives:
- id: objective.uncertainty-models
  version: 1-draft
  statement: Probability models assign uncertainty to outcomes; likelihood evaluates parameter choices against observations,
    while priors and uncertainty sources state what assumptions enter the analysis.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - uncertainty-models.base
  - uncertainty-models.transfer
  prerequisites:
  - anyOf:
    - objective.probability
  - anyOf:
    - objective.random-variables
scenes:
- id: uncertainty-models.s1
  title: Probability depends on a model and information
  type: explanation
  depth: intuition
  objective_refs:
  - objective.uncertainty-models
  markdown: A probability of 0.7 is meaningful only with a specified event and conditioning information. It can
    represent long-run frequencies under a process or uncertainty within a model. It is not a guarantee about the
    next individual outcome, nor a universal measure of truth independent of context.
  text_mode: A probability of 0.7 is meaningful only with a specified event and conditioning information. It can
    represent long-run frequencies under a process or uncertainty within a model. It is not a guarantee about the
    next individual outcome, nor a universal measure of truth independent of context.
  bridges: []
- id: uncertainty-models.s2
  title: Turn the same expression around
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.uncertainty-models
  markdown: For a coin with head probability θ, the probability of observing heads then tails is θ × (1 − θ), assuming
    independent tosses. After those outcomes are observed, that expression can be viewed as a likelihood function
    of θ. Likelihood values over parameter choices do not have to sum to one.
  text_mode: For a coin with head probability θ, the probability of observing heads then tails is θ × (1 − θ), assuming
    independent tosses. After those outcomes are observed, that expression can be viewed as a likelihood function
    of θ. Likelihood values over parameter choices do not have to sum to one.
  bridges:
  - probability
- id: uncertainty-models.s3
  title: Separate sources of uncertainty
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.uncertainty-models
  markdown: Noise in observations can remain even with abundant data; uncertainty about model parameters can shrink
    with informative evidence. These are often called aleatoric and epistemic uncertainty, though their separation
    depends on the chosen model. Missing a whole mechanism can create uncertainty that the model’s own confidence
    fails to capture.
  text_mode: Noise in observations can remain even with abundant data; uncertainty about model parameters can shrink
    with informative evidence. These are often called aleatoric and epistemic uncertainty, though their separation
    depends on the chosen model. Missing a whole mechanism can create uncertainty that the model’s own confidence
    fails to capture.
  bridges: []
- id: uncertainty-models.s4
  title: Use uncertainty in a decision
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.uncertainty-models
  markdown: A delivery estimate might report a range, a chance of arriving late, and known unsupported conditions.
    Check calibration on relevant cases and connect the probabilities to action costs. A narrow interval from a
    misspecified model can be misleading even when the arithmetic inside the model is correct.
  text_mode: A delivery estimate might report a range, a chance of arriving late, and known unsupported conditions.
    Check calibration on relevant cases and connect the probabilities to action costs. A narrow interval from a
    misspecified model can be misleading even when the arithmetic inside the model is correct.
  bridges: []
- id: uncertainty-models.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.uncertainty-models
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: uncertainty-models.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.uncertainty-models
  markdown: Probability models assign uncertainty to outcomes; likelihood evaluates parameter choices against observations,
