schema_version: 0.2-draft
lesson:
  id: uncertainty-models
  version: 0.3.0-draft
  title: Probability, likelihood, and what is unknown
  state: draft
  summary: Use counters and coin tosses to distinguish a probability from a comparison of possible model settings.
  slot: M06.1
  category: learning
  sources:
  - title: Deep Learning — probability and information theory
    url: https://www.deeplearningbook.org/contents/prob.html
objectives:
- id: objective.uncertainty-models
  version: 1-draft
  statement: Probability models assign uncertainty to outcomes; likelihood evaluates parameter choices against
    observations, while priors and uncertainty sources state what assumptions enter the analysis.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - uncertainty-models.base
  - uncertainty-models.transfer
  prerequisites:
  - anyOf:
    - objective.probability
  - anyOf:
    - objective.random-variables
scenes:
- id: uncertainty-models.s1
  title: Probability depends on a model and information
  type: explanation
  depth: intuition
  objective_refs:
  - objective.uncertainty-models
  markdown: 'Imagine a bag with seven red counters and three blue ones. If each counter is equally likely to
    be drawn, the **probability** of red is 7 out of 10, or 0.7. Probability is a way to describe uncertainty
    about a stated event. **Conditioning information** is what we already know when making that description,
    such as which bag is used.


    A 0.7 chance does not promise that the next counter will be red. Some probabilities come from a known random
    process; others express uncertainty within a model based on incomplete information. Always ask “probability
    of what, given what?”'
  text_mode: 'Imagine a bag with seven red counters and three blue ones. If each counter is equally likely
    to be drawn, the **probability** of red is 7 out of 10, or 0.7. Probability is a way to describe uncertainty
    about a stated event. **Conditioning information** is what we already know when making that description,
    such as which bag is used.


    A 0.7 chance does not promise that the next counter will be red. Some probabilities come from a known random
    process; others express uncertainty within a model based on incomplete information. Always ask “probability
    of what, given what?”'
  bridges: []
- id: uncertainty-models.s2
  title: Turn the same expression around
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.uncertainty-models
  markdown: 'Let the Greek letter θ, read “theta,” stand for a coin''s head probability. It is a **parameter**:
    a number describing the model. If tosses are independent—one toss does not change the other''s chances—the
    probability of heads then tails is θ × (1 − θ).


    Now keep that observed sequence fixed and compare candidate settings. With θ = 0.5 the expression gives
    0.25; with θ = 0.9 it gives 0.09. As a function of the candidate parameter, this expression is called the
    **likelihood**. It says how well each setting accounts for these observations. Those two numbers need not
    sum to one; they are not probabilities that the settings themselves are true.


    A **prior** expresses uncertainty about settings before using these observations. The next lesson shows
    how to combine it with likelihood.'
  text_mode: 'Let the Greek letter θ, read “theta,” stand for a coin''s head probability. It is a **parameter**:
    a number describing the model. If tosses are independent—one toss does not change the other''s chances—the
    probability of heads then tails is θ × (1 − θ).


    Now keep that observed sequence fixed and compare candidate settings. With θ = 0.5 the expression gives
    0.25; with θ = 0.9 it gives 0.09. As a function of the candidate parameter, this expression is called the
    **likelihood**. It says how well each setting accounts for these observations. Those two numbers need not
    sum to one; they are not probabilities that the settings themselves are true.


    A **prior** expresses uncertainty about settings before using these observations. The next lesson shows
    how to combine it with likelihood.'
  bridges:
  - probability
- id: uncertainty-models.s3
  title: Why might a prediction be uncertain?
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.uncertainty-models
  markdown: 'Some uncertainty comes from variation or noise in the observations. More training examples may
    not remove it. This is often called **aleatoric uncertainty**. Other uncertainty comes from not knowing
    which model settings fit best; informative data can reduce this **epistemic uncertainty**.


    The distinction depends on the model. A delivery predictor that ignores traffic jams may report a confident
    answer while missing a major source of variation. Its confidence describes uncertainty within its assumptions,
    not everything that could happen.'
  text_mode: 'Some uncertainty comes from variation or noise in the observations. More training examples may
