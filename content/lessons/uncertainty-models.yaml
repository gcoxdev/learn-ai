    The distinction depends on the model. A delivery predictor that ignores traffic jams may report a confident
    answer while missing a major source of variation. Its confidence describes uncertainty within its assumptions,
    not everything that could happen.'
  bridges: []
- id: uncertainty-models.s4
  title: Use uncertainty in a decision
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.uncertainty-models
  markdown: 'A delivery model might estimate a 20% chance of being late. **Calibration** asks whether outcomes
    agree with such probabilities across comparable predictions: among many 20% predictions, are roughly one
    in five late?


    A range of plausible arrival times can be useful too. But narrow ranges are misleading if the model ignores
    traffic jams. The arithmetic can be correct while the model leaves out something important. Use the estimate
    to guide a decision, then check it against relevant trips.'
