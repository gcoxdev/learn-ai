schema_version: 0.2-draft
lesson:
  id: uncertainty-models
  version: 0.4.0-draft
  title: Probability, likelihood, and what is unknown
  state: draft
  summary: Everyone agrees a coin lands heads half the time. But a tossed thumbtack? Learn how to score your guesses from data, and which kinds of doubt more data can cure.
  slot: M06.1
  category: learning
  sources:
    - title: Deep Learning — probability and information theory
      url: https://www.deeplearningbook.org/contents/prob.html
objectives:
  - id: objective.uncertainty-models
    version: 2-draft
    statement: Probability models assign uncertainty to outcomes; likelihood evaluates parameter choices against observations, while priors and uncertainty sources state what assumptions enter the analysis.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - uncertainty-models.base.v2
      - uncertainty-models.transfer.v2
    prerequisites:
      - anyOf:
          - objective.probability
      - anyOf:
          - objective.random-variables
scenes:
  - id: uncertainty-models.s1
    title: A coin you understand, a thumbtack you don't
    type: explanation
    depth: intuition
    objective_refs:
      - objective.uncertainty-models
    markdown: |-
      Flip a coin, and everyone agrees that heads has a 50% chance. Now toss a thumbtack onto a table. Will it land point up, or tipped on its side? Nobody can tell you the chance until you've tossed it a few times. The coin's chance is known; the thumbtack's has to be learned from data.

      Call the thumbtack's point-up rate θ (the Greek letter "theta"). θ is a **parameter**: a number that sets how a model behaves. Suppose, for now, someone tells you θ = 0.7. Then the **probability** of "point up" on the next toss is 0.7, a number from 0 to 1 that says how strongly to expect it. If tosses are **independent**, meaning one toss doesn't change the chances of the next, two point-ups in a row have probability 0.7 × 0.7 = 0.49.

      Every probability answers a question shaped like "probability of *what*, given *what*?" We write $P(\text{up} \mid \theta = 0.7) = 0.7$. The bar reads "given": what follows it is the information we rely on. Change that information (a different tack, a carpet) and the probability can change.

      :::predict The forecast said 70% chance of rain, and it stayed dry all day. Was the forecast wrong?
      Not necessarily. A 70% forecast expects about 3 dry days in every 10 such forecasts. You judge a forecaster over many days: of all the days they said 70%, did it rain on roughly 70%? That check, called calibration, closes this module.
      :::
    bridges: []
  - id: uncertainty-models.s2
    title: Turn the formula around
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.uncertainty-models
    markdown: |-
      Now the realistic case: you don't know θ. You toss the tack twice and see **up, then down**. For any candidate θ, that sequence has probability θ × (1 − θ). Now keep the data fixed, and let θ vary:

      | Candidate θ | θ × (1 − θ) |
      | ---: | ---: |
      | 0.1 | 0.09 |
      | 0.3 | 0.21 |
      | 0.5 | 0.25 |
      | 0.7 | 0.21 |
      | 0.9 | 0.09 |

      Read this way, as a score for each candidate setting, the expression is called the **likelihood**. It says how well each θ accounts for what you saw. θ = 0.5 explains "up, down" best; θ = 0.9 explains it poorly, since that tack would almost always land up.

      Notice that the column adds up to 0.85, not 1. That's your clue that likelihoods aren't probabilities *of the candidates*.

      :::mixup "The likelihood of θ = 0.5 is 0.25, so there's a 25% chance that θ is 0.5."
      The 0.25 is the probability of the *data* if θ were 0.5. It isn't the probability that θ *is* 0.5. For that, you also need a **prior**: how plausible each θ seemed before you tossed anything. Combining a prior with a likelihood is exactly what Bayes' rule does, in the next lesson.
      :::
    bridges:
      - probability
  - id: uncertainty-models.more-tosses
    title: More tosses sharpen the picture
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.uncertainty-models
    markdown: |-
      Keep tossing. Suppose 7 of 10 tosses land point up.

      :::predict Which θ gives "7 up in 10 tosses" the highest likelihood?
      θ = 0.7, the fraction you observed. With k successes in n tries, the best-scoring θ is k/n, called the **maximum likelihood estimate**. It's the most common way to fit a parameter to data.
      :::

      :::papers The likelihood for n independent tosses
      For a particular sequence with k ups in n independent tosses:

      $$L(\theta) = P(\text{data} \mid \theta) = \theta^{k}\,(1-\theta)^{\,n-k}, \qquad \hat\theta_{\text{MLE}} = \frac{k}{n}$$

      With k = 7 and n = 10, $L(0.7) = 0.7^7 \times 0.3^3 \approx 0.00222$ and $L(0.5) = 0.5^{10} \approx 0.00098$. Papers usually maximize the **log-likelihood** $\log L(\theta)$, which turns the product into a sum and has the same best θ. Training a classifier by minimizing cross-entropy loss is exactly this, with the sign flipped.
      :::

      This program scores five candidates after 10 and after 100 tosses. "Relative" divides each likelihood by the best one.

      ```python run
      thetas = [0.1, 0.3, 0.5, 0.7, 0.9]

      def likelihood(theta, ups, tosses):
          return theta**ups * (1 - theta)**(tosses - ups)

      for ups, tosses in [(7, 10), (70, 100)]:
          values = [likelihood(t, ups, tosses) for t in thetas]
          best = max(values)
          print(f"{ups} up in {tosses} tosses")
          for t, v in zip(thetas, values):
              bar = "#" * round(20 * v / best)
              print(f"  theta={t}: likelihood={v:.3g}  relative={v / best:.4f} {bar}")
          print(f"  sum over these thetas = {sum(values):.3g}")
      ```

      After 10 tosses, θ = 0.5 still scores 0.4392 of the best: quite believable. After 100 tosses it scores 0.0003, effectively ruled out. Now add 0.6 and 0.8 to `thetas`: after 10 tosses both score above 0.75 of the best, but after 100 tosses they drop to about 0.12 and 0.06.
  - id: uncertainty-models.s3
    title: Two kinds of not knowing
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.uncertainty-models
    markdown: |-
      Even if you knew θ = 0.7 exactly, you still couldn't say what the next toss will do. That leftover randomness in the outcome is **aleatoric uncertainty** (from the Latin *alea*, "dice"). More data doesn't shrink it: a fair die stays unpredictable however many times you roll it.

      Your doubt about θ itself is different. It was large after 10 tosses and tiny after 100. Uncertainty that more data can reduce is **epistemic uncertainty** (uncertainty "about knowledge").

      | | Aleatoric | Epistemic |
      | --- | --- | --- |
      | Comes from | Randomness in the outcome itself | Not knowing the right model settings |
      | Thumbtack | The next toss, even with θ known | Which θ this tack has |
      | AI example | A scrawled digit that even people read as "1 or 7?" | A kind of photo the model never saw in training |
      | More of the same data helps? | No | Yes |

      The difference tells you what to do next. If a scan-reading model is unsure because the scans are blurry, that's aleatoric: get sharper scans. If it saw few scans of children in training, that's epistemic: collect more scans of children.
    bridges: []
  - id: uncertainty-models.s4
    title: Say the "given" out loud
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.uncertainty-models
    markdown: |-
      You've estimated θ ≈ 0.7 from 100 tosses on a wooden table. Should a friend use your number for a game on a thick carpet?

      Only if the carpet doesn't change how the tack lands, and it might. Your likelihood assumed every toss shared one θ, on that table. That assumption is part of the "given" behind your 0.7.

      AI models carry hidden "givens" too. A flight-delay model trained on summer flights says "10% chance of delay," given summer weather. In a January blizzard it still does correct arithmetic, on the wrong "given."

      So before acting on a probability, say its full sentence out loud: "0.7, given this tack on a wooden table." Then check a few cases like yours. Toss the tack on the carpet 20 times before you bet on it.
    bridges: []
  - id: uncertainty-models.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.uncertainty-models
    markdown: Spinners, dice, crackly phone calls, and a blizzard ask you to score candidate settings with a likelihood and to tell randomness apart from missing knowledge.
    takeaway: |-
      A probability is always "of something, given something." A likelihood flips the question: it scores each possible setting by how well it explains the data you saw, and more data narrows which settings still fit.
  - id: uncertainty-models.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.uncertainty-models
    markdown: |-
      A probability describes uncertain outcomes. A likelihood compares possible model settings against observations. In either case, ask what information and assumptions the calculation uses.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - uncertainty-models.s1
        - uncertainty-models.s2
        - uncertainty-models.more-tosses
        - uncertainty-models.s3
        - uncertainty-models.s4
        - uncertainty-models.check
      gate_refs:
        - gate.core
  scene_aliases:
    uncertainty-models.recap: uncertainty-models.check
assessment_families:
  - id: uncertainty-models.base
    objective_ref: objective.uncertainty-models
    task: base
    response_type: single_choice
    points: 1
    hint: 'Turn the same expression around: trace the inputs, operation, and result before choosing.'
    remediation_scene: uncertainty-models.s2
    variants:
      - id: uncertainty-models.base.1
        prompt: Does a probability of 0.8 guarantee the next outcome occurs?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if written to two decimals
        answer: a
        feedback: Probability describes uncertainty under the stated model and information.
        retired: true
      - id: uncertainty-models.base.2
        prompt: Must a likelihood function sum to one over all parameter values?
        options:
          - id: b
            text: Yes, by definition
          - id: c
            text: Only for neural networks
          - id: a
            text: No; it is not automatically a parameter probability distribution
        answer: a
        feedback: Likelihood compares how parameters explain fixed observed data.
        retired: true
  - id: uncertainty-models.transfer
    objective_ref: objective.uncertainty-models
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Use uncertainty in a decision: trace the inputs, operation, and result before choosing.'
    remediation_scene: uncertainty-models.s4
    variants:
      - id: uncertainty-models.transfer.1
        prompt: A sensor has irreducible measurement noise. Which uncertainty source does this illustrate?
        options:
          - id: b
            text: Only uncertainty from choosing a file name
          - id: c
            text: A proof that no model can be useful
          - id: a
            text: Observation or aleatoric uncertainty within the model
        answer: a
        feedback: Some outcome variability persists even with well-estimated parameters.
        retired: true
      - id: uncertainty-models.transfer.2
        prompt: A model gives narrow intervals in an unseen environment. What should be questioned?
        options:
          - id: c
            text: Whether probabilities are written in percentages
          - id: a
            text: Whether its assumptions and calibration transfer
          - id: b
            text: Only whether intervals look tidy
        answer: a
        feedback: Internal confidence is conditional on the model and its domain.
        retired: true
  - id: uncertainty-models.base.v2
    objective_ref: objective.uncertainty-models
    task: base
    response_type: single_choice
    points: 1
    hint: Hold the observed data fixed and work out θ^k × (1 − θ)^(n − k) for each candidate. A likelihood scores settings; it isn't the chance that a setting is true.
    remediation_scene: uncertainty-models.s2
    variants:
      - id: uncertainty-models.base.v2.1
        prompt: A thumbtack lands up, up, then down. Among the candidates θ = 0.3, θ = 0.5, and θ = 0.7, which has the highest likelihood?
        options:
          - id: b
            text: θ = 0.5
          - id: c
            text: θ = 0.3
          - id: a
            text: θ = 0.7
        answer: a
        feedback: 'The likelihoods are 0.7² × 0.3 = 0.147, 0.5³ = 0.125, and 0.3² × 0.7 = 0.063. θ = 0.5 feels like the safe middle guess, but two ups in three tosses fit a tack that favors "up."'
      - id: uncertainty-models.base.v2.2
        prompt: A spinner lands on red in 12 of 20 spins. What is the maximum likelihood estimate of its red-rate θ?
        options:
          - id: a
            text: '0.5'
          - id: b
            text: '0.6'
          - id: c
            text: '0.4'
        answer: b
        feedback: The maximum likelihood estimate is k/n = 12/20 = 0.6. 0.5 is the "fair spinner" default, which the data don't favor, and 0.4 is the fraction of spins that were not red.
      - id: uncertainty-models.base.v2.3
        prompt: For a recorded sequence of tosses, the candidate θ = 0.4 has likelihood 0.03. What does the number 0.03 describe?
        options:
          - id: c
            text: The chance of seeing this exact sequence if θ were 0.4
          - id: a
            text: The chance that θ really is 0.4, given these tosses
          - id: b
            text: The chance that the next toss lands up if θ were 0.4
        answer: c
        feedback: A likelihood is the probability of the observed data under one candidate setting. Turning it into the chance that θ is 0.4 needs a prior and Bayes' rule. The next-toss chance under θ = 0.4 would simply be 0.4.
      - id: uncertainty-models.base.v2.4
        prompt: You compute the likelihood of your data under five candidate settings, and the five numbers add up to 0.85. What should you conclude?
        options:
          - id: b
            text: There's an arithmetic slip, since probabilities must total 1
          - id: c
            text: The missing 0.15 is the chance that no candidate is right
          - id: a
            text: That's expected, because likelihoods of settings needn't total 1
        answer: a
        feedback: Each likelihood is a probability of the data under a different setting, so adding them across settings has no reason to give 1. Reading the gap as "none of them is right" treats likelihoods as probabilities of the candidates, which they aren't.
  - id: uncertainty-models.transfer.v2
    objective_ref: objective.uncertainty-models
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask whether more data of the same kind would shrink the doubt. If yes, it's missing knowledge (epistemic). If no, it's randomness in the outcome itself (aleatoric).
    remediation_scene: uncertainty-models.s3
    variants:
      - id: uncertainty-models.transfer.v2.1
        prompt: A speech recognizer can't tell whether a caller said "fifteen" or "fifty" on a crackly phone line. Human listeners disagree about it too. Which description fits best?
        options:
          - id: b
            text: Epistemic; training on more crackly calls will settle this one
          - id: a
            text: Aleatoric; the audio is ambiguous, so a clearer recording helps
          - id: c
            text: Epistemic; a larger model would hear the word correctly
        answer: a
        feedback: When people can't agree either, the ambiguity is in the recording itself, which is aleatoric uncertainty. More training data or a bigger model can't recover information the audio doesn't contain.
      - id: uncertainty-models.transfer.v2.2
        prompt: A skin-condition classifier was trained almost entirely on photos of light skin. On darker skin its predictions are unsure and often wrong. Which fix targets the main source of its uncertainty?
        options:
          - id: c
            text: Take sharper, better-lit photos of each patient's skin
          - id: a
            text: Lower the decision threshold so it flags more cases
          - id: b
            text: Collect and label many photos of darker skin tones
        answer: b
        feedback: The model lacks knowledge about a group it rarely saw, which is epistemic uncertainty, and more data from that group reduces it. Sharper photos target blur (aleatoric), and a new threshold changes decisions without teaching the model anything.
      - id: uncertainty-models.transfer.v2.3
        prompt: A flight-delay model trained on summer flights reports "delay 10%" for a flight during a January blizzard. What is the most useful first question?
        options:
          - id: a
            text: Is 10% lower than this airline's average delay rate?
          - id: b
            text: Did its training data include winter storms like this?
          - id: c
            text: Would running the model twice give the same 10%?
        answer: b
        feedback: A probability is only as good as its "given." A model built on summer weather is answering a different question in a blizzard. Comparing with the average or rerunning it checks the arithmetic, not whether the model fits this situation.
      - id: uncertainty-models.transfer.v2.4
        prompt: After 10 rolls of a new die you can't tell whether it's loaded. After 1,000 rolls you're sure it's fair, yet you still can't predict the next roll. How would you describe the two kinds of doubt?
        options:
          - id: c
            text: Both were epistemic, and 1,000 rolls should remove both
          - id: b
            text: Both were aleatoric, because dice are random by nature
          - id: a
            text: The loading doubt was epistemic; the next roll is aleatoric
        answer: a
        feedback: More rolls resolved whether the die is loaded, so that doubt was epistemic. The next roll of a fair die stays random however much you've seen, which is aleatoric uncertainty.
