schema_version: 0.2-draft
lesson:
  id: retrieval-boundaries-and-failures
  version: 0.1.0-draft
  title: Keep retrieved evidence current, permitted, and resistant to manipulation
  state: draft
  summary: Retrieval systems must propagate access and version rules through indexing, ranking, caching, and generation;
    poisoning and prompt injection require separate controls and diagnostic tests.
  slot: M26.8
  category: learning
  sources:
  - title: Indirect Prompt Injection
    url: https://arxiv.org/abs/2302.12173
  - title: NIST AI Risk Management Framework
    url: https://www.nist.gov/itl/ai-risk-management-framework
  - title: Retrieval-Augmented Generation
    url: https://arxiv.org/abs/2005.11401
objectives:
- id: objective.retrieval-boundaries-and-failures
  version: 1-draft
  statement: Retrieval systems must propagate access and version rules through indexing, ranking, caching, and generation;
    poisoning and prompt injection require separate controls and diagnostic tests.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - retrieval-boundaries-and-failures.base
  - retrieval-boundaries-and-failures.transfer
  prerequisites:
  - anyOf:
    - objective.rag-evidence-pipeline
  - anyOf:
    - objective.agent-permissions-and-untrusted-input
scenes:
- id: retrieval-boundaries-and-failures.s1
  title: Filter by the actual requester’s access
  type: explanation
  depth: intuition
  objective_refs:
  - objective.retrieval-boundaries-and-failures
  markdown: A document being indexed does not mean every user may retrieve it. Enforce access scope before evidence
    reaches generation and preserve it through reranking and caches. A shared cache keyed only by query text can
    mix answers derived from differently permitted collections.
  text_mode: A document being indexed does not mean every user may retrieve it. Enforce access scope before evidence
    reaches generation and preserve it through reranking and caches. A shared cache keyed only by query text can
    mix answers derived from differently permitted collections.
  bridges: []
- id: retrieval-boundaries-and-failures.s2
  title: Track versions through the pipeline
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.retrieval-boundaries-and-failures
  markdown: An updated source, stale vector entry, and cached old answer can disagree. Attach version identifiers
    and define invalidation rules. Test deletion and permission revocation end to end, including already derived
    artifacts where the application’s data policy requires them to change.
  text_mode: An updated source, stale vector entry, and cached old answer can disagree. Attach version identifiers
    and define invalidation rules. Test deletion and permission revocation end to end, including already derived
    artifacts where the application’s data policy requires them to change.
  bridges: []
- id: retrieval-boundaries-and-failures.s3
  title: Distinguish content corruption from instruction takeover
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.retrieval-boundaries-and-failures
  markdown: Poisoning inserts misleading material that ranking or generation may trust as evidence. Prompt injection
    embeds instructions intended to redirect the system. A document can do both. Source validation and evidence
    corroboration address different concerns from enforcing tool permissions and instruction boundaries.
  text_mode: Poisoning inserts misleading material that ranking or generation may trust as evidence. Prompt injection
    embeds instructions intended to redirect the system. A document can do both. Source validation and evidence
    corroboration address different concerns from enforcing tool permissions and instruction boundaries.
  bridges: []
- id: retrieval-boundaries-and-failures.s4
  title: Diagnose with controlled cases
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.retrieval-boundaries-and-failures
  markdown: Create tests for stale documents, unauthorized requests, conflicting sources, and hostile instructions
    in retrieved passages. Inspect which source entered the context and why. Report residual limits; a relevance
    score and a polite system prompt are not complete access-control or evidence-integrity mechanisms.
  text_mode: Create tests for stale documents, unauthorized requests, conflicting sources, and hostile instructions
    in retrieved passages. Inspect which source entered the context and why. Report residual limits; a relevance
    score and a polite system prompt are not complete access-control or evidence-integrity mechanisms.
  bridges: []
- id: retrieval-boundaries-and-failures.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.retrieval-boundaries-and-failures
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Retrieval systems must propagate access and version rules through indexing, ranking, caching, and generation;
    poisoning and prompt injection require separate controls and diagnostic tests.
