assessment_families:
- id: retrieval-boundaries-and-failures.base
  objective_ref: objective.retrieval-boundaries-and-failures
  task: base
  response_type: single_choice
  points: 1
  hint: 'Track versions through the pipeline: trace the inputs, operation, and result before choosing.'
  remediation_scene: retrieval-boundaries-and-failures.s2
  variants:
  - id: retrieval-boundaries-and-failures.base.1
    prompt: Does indexing a document authorize every user to see it?
    options:
    - id: c
      text: Only if its embedding is public within the server
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Access must follow requester permissions.
  - id: retrieval-boundaries-and-failures.base.2
    prompt: Why is a query-only shared answer cache risky across access scopes?
    options:
    - id: a
      text: It can reuse evidence-derived answers for the wrong requester
    - id: b
      text: It guarantees perfect isolation
    - id: c
      text: It only affects typography
    answer: a
    feedback: Cache identity must account for relevant authorization boundaries.
- id: retrieval-boundaries-and-failures.transfer
  objective_ref: objective.retrieval-boundaries-and-failures
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Diagnose with controlled cases: trace the inputs, operation, and result before choosing.'
  remediation_scene: retrieval-boundaries-and-failures.s4
  variants:
  - id: retrieval-boundaries-and-failures.transfer.1
    prompt: How does poisoning differ from prompt injection in this lesson?
    options:
    - id: a
      text: Misleading evidence versus attempts to redirect instruction-following, though both can coexist
    - id: b
      text: They can never coexist
    - id: c
      text: Poisoning only changes hardware
    answer: a
    feedback: The attack targets can differ.
  - id: retrieval-boundaries-and-failures.transfer.2
    prompt: What verifies that a revoked document no longer influences protected retrieval?
    options:
    - id: b
      text: Only deleting one source filename
    - id: c
      text: Only measuring cosine similarity
    - id: a
      text: An end-to-end test of indexes, filters, caches, and output behavior
    answer: a
    feedback: Derived state and access enforcement must be checked together.
