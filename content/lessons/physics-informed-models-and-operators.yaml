  - id: physics-informed-models-and-operators.base.v2
    objective_ref: objective.physics-informed-models-and-operators
    task: base
    response_type: single_choice
    points: 1
    hint: Separate the three loss terms. The residual checks the equation's shape, the initial or boundary term pins down which solution, and the data term ties it to measurements.
    remediation_scene: physics-informed-models-and-operators.s2
    variants:
      - id: physics-informed-models-and-operators.base.v2.1
        prompt: A PINN for du/dt = −2u is trained with only the equation residual, no initial condition and no data. It converges to u(t) = 0 everywhere. Why?
        options:
          - id: b
            text: The network was too small to represent an exponential curve
          - id: a
            text: Zero satisfies the equation, and nothing asks for u(0) = 1
          - id: c
            text: The collocation points were too close together to see decay
        answer: a
        feedback: Every Ce^(−2t) has zero residual, including C = 0, so the equation alone can't choose the height. The initial-condition term (u(0) − 1)² is what rules zero out. Network size and point spacing aren't the issue when the loss is already zero.
      - id: physics-informed-models-and-operators.base.v2.2
        prompt: How does a PINN get du/dt to compute its equation residual?
        options:
          - id: a
            text: By automatic differentiation of the network with respect to t
          - id: c
            text: By comparing each measurement with the one taken just before
          - id: b
            text: By asking a classical solver for the slope at each point
        answer: a
        feedback: The network is a formula in t, so autodiff gives its exact derivative at any collocation point. Differences between measurements would need dense data, which PINNs are meant to avoid, and calling a solver would defeat the purpose.
      - id: physics-informed-models-and-operators.base.v2.3
        prompt: Training a PINN, the equation loss falls fast while u(0) drifts far from its required value. What does the research on gradient pathologies suggest?
        options:
          - id: c
            text: Remove the initial-condition term so the equation term converges
          - id: b
            text: Add more collocation points so the equation is checked more often
          - id: a
            text: Rebalance the loss weights so the initial term's gradients count
        answer: a
        feedback: The equation term's gradients are swamping the initial-condition term. Raising its weight (or adapting weights during training) fixes the balance. More collocation points check the equation more finely but leave the imbalance in place, and removing the start term lets training settle on u = 0.
      - id: physics-informed-models-and-operators.base.v2.4
        prompt: What is the key difference between a PINN and a neural operator?
        options:
          - id: a
            text: A PINN learns one solution; an operator maps many inputs to solutions
          - id: b
            text: A PINN uses measured data; an operator uses the equation instead
          - id: c
            text: A PINN works on grids; an operator works on single points
        answer: a
        feedback: A trained PINN represents one curve or field for one setup, while an operator learns input-function-to-solution maps and is reused on new inputs. Operators are usually trained on solver-generated pairs, and it is the operator that works on grids.
      - id: physics-informed-models-and-operators.base.v2.5
        prompt: Why can one Fourier neural operator be run on a finer grid than it was trained on?
        options:
          - id: b
            text: Its training data included every grid size it will ever meet
          - id: a
            text: Its learned weights act on frequencies rather than on grid points
          - id: c
            text: It interpolates its coarse output onto the fine grid afterward
        answer: a
        feedback: R multiplies Fourier modes, which exist on any grid, so the same weights apply. It isn't trained on every size, and plain interpolation would be a separate step, not a property of the operator. It still can't add detail above the frequencies it kept.
  - id: physics-informed-models-and-operators.transfer.v2
    objective_ref: objective.physics-informed-models-and-operators
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what's known and what's wanted. Unknown physics with sparse data suggests a PINN; many repeated solves suggest an operator; a single known forward problem suggests a classical solver.
    remediation_scene: physics-informed-models-and-operators.pinn-difficulties
    variants:
      - id: physics-informed-models-and-operators.transfer.v2.1
        prompt: An engineer knows the heat equation for a steel beam but not the steel's thermal conductivity. She has temperatures from six sensors. Which approach fits?
        options:
          - id: a
            text: A PINN with conductivity as a trainable parameter
          - id: b
            text: A Fourier neural operator trained on this one beam
          - id: c
            text: A plain network fitted to the six sensor readings
        answer: a
        feedback: This is an inverse problem. The residual enforces the heat equation, the sensors pull toward the data, and the unknown conductivity is learned along the way. Six readings alone can't constrain a plain network, and an operator needs many solved examples.
      - id: physics-informed-models-and-operators.transfer.v2.2
        prompt: A battery lab must predict temperature fields for 20,000 different charging schedules, and a trusted solver takes an hour per schedule. Which plan fits?
        options:
          - id: c
            text: Train a new PINN from scratch for each of the charging schedules
          - id: a
            text: Solve a few hundred with the solver, then train a neural operator
          - id: b
            text: Run the classical solver on all 20,000 schedules one by one
        answer: a
        feedback: Many repeated solves with new input functions is what operators are for. The solver supplies training pairs, and the trained model handles the rest quickly. A PINN per schedule repeats training 20,000 times; the solver alone costs 20,000 hours.
      - id: physics-informed-models-and-operators.transfer.v2.3
        prompt: A student wants to solve one standard heat-flow problem on a square plate, with all values known, as accurately as possible. What should she use?
        options:
          - id: b
            text: A PINN, since it builds the physics into training
          - id: c
            text: A neural operator, since it's faster at inference
          - id: a
            text: A standard numerical solver such as finite elements
        answer: a
        feedback: For a single forward problem with known physics, mature solvers are usually faster and more accurate; a 2023 study found PINNs didn't beat finite elements on time or accuracy. An operator's speed only pays off across many solves.
      - id: physics-informed-models-and-operators.transfer.v2.4
        prompt: A groundwater PINN has a tiny loss at its 200 collocation points, but the predicted water table dips below the riverbed where the river should keep it high. What's the likely cause?
        options:
          - id: a
            text: The boundary condition at the river is missing or too weakly weighted
          - id: c
            text: 200 collocation points is too many, causing the network to overfit
          - id: b
            text: The residual was computed with autodiff instead of finite differences
        answer: a
        feedback: The equation fixes shape, and boundary terms fix which solution. With the river condition missing or underweighted, a low-residual but wrong solution fits. More collocation points help rather than overfit, and autodiff gives exact derivatives.
      - id: physics-informed-models-and-operators.transfer.v2.5
        prompt: A weather surrogate is accurate for one-day forecasts. The team wants 10-day forecasts by feeding each output back in. What must they check?
        options:
          - id: b
            text: Whether the one-day error is below the solver's own error
          - id: a
            text: Whether errors grow as predictions are fed back repeatedly
          - id: c
            text: Whether the training grid matches the forecast resolution
        answer: a
        feedback: Small one-step errors can compound over repeated rollouts, so long forecasts need their own test. Beating the solver on one day says nothing about day ten, and the grid matters but isn't the new risk here.
  - id: physics-informed-models-and-operators.calculate
    objective_ref: objective.physics-informed-models-and-operators
    task: base
    response_type: numeric
    points: 1
    hint: For du/dt = −ku, the residual is r = du/dt + k·u. Differentiate the candidate, evaluate both pieces at the given time, and add. The initial-condition penalty is (u(0) − 1)².
    remediation_scene: physics-informed-models-and-operators.s2
    absolute_tolerance: 0.01
    variants:
      - id: physics-informed-models-and-operators.calculate.1
        prompt: For du/dt = −2u, what is the residual of the candidate u = 1 − 2t at t = 0.5?
        answer: -2
        feedback: du/dt = −2 and u(0.5) = 0, so r = −2 + 2 × 0 = −2.
      - id: physics-informed-models-and-operators.calculate.2
        prompt: For du/dt = −u (k = 1), what is the residual of u = 1 − t at t = 1?
        answer: -1
        feedback: du/dt = −1 and u(1) = 0, so r = −1 + 1 × 0 = −1.
      - id: physics-informed-models-and-operators.calculate.3
        prompt: For du/dt = −2u, what is the residual of u = e^(−t) at t = 0?
        answer: 1
        feedback: du/dt = −e^(−t) = −1 at t = 0, and u(0) = 1, so r = −1 + 2 × 1 = 1. The candidate decays at the wrong rate.
      - id: physics-informed-models-and-operators.calculate.4
        prompt: For du/dt = −2u, what is the residual of u = 1 − 2t + 2t² at t = 0.5?
        answer: 1
        feedback: du/dt = −2 + 4t = 0 at t = 0.5, and u(0.5) = 1 − 1 + 0.5 = 0.5, so r = 0 + 2 × 0.5 = 1.
      - id: physics-informed-models-and-operators.calculate.5
