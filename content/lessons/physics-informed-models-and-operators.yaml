assessment_families:
- id: physics-informed-models-and-operators.base
  objective_ref: objective.physics-informed-models-and-operators
  task: base
  response_type: single_choice
  points: 1
  hint: 'Residual size is not the whole solution: trace the inputs, operation, and result before choosing.'
  remediation_scene: physics-informed-models-and-operators.s2
  variants:
  - id: physics-informed-models-and-operators.base.1
    prompt: What can a physics-informed loss penalize?
    options:
    - id: c
      text: Every unknown law automatically
    - id: a
      text: Differential-equation and boundary-condition residuals
    - id: b
      text: Only image aesthetics
    answer: a
    feedback: Known structure supplies additional training constraints.
  - id: physics-informed-models-and-operators.base.2
    prompt: Does a small residual at selected points prove small global error?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only with a neural network
    answer: a
    feedback: Sampling and problem conditions limit that inference.
- id: physics-informed-models-and-operators.transfer
  objective_ref: objective.physics-informed-models-and-operators
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate scientific use rather than appearance: trace the inputs, operation, and result before choosing.'
  remediation_scene: physics-informed-models-and-operators.s4
  variants:
  - id: physics-informed-models-and-operators.transfer.1
    prompt: What does a neural operator learn to map?
    options:
    - id: a
      text: Input functions or fields to output functions or fields
    - id: b
      text: Only one scalar label necessarily
    - id: c
      text: File names to URLs
    answer: a
    feedback: It models a family of functional relationships.
  - id: physics-informed-models-and-operators.transfer.2
    prompt: Why compare with a trusted numerical solver?
    options:
    - id: b
      text: To assume the learned model is always worse
    - id: c
      text: Only to draw matching colors
    - id: a
      text: To measure actual solution error and cost
    answer: a
    feedback: Scientific validity requires a suitable reference.
