scenes:
- id: physics-informed-models-and-operators.s1
  title: Use a known equation as a training signal
  type: explanation
  depth: intuition
  objective_refs:
  - objective.physics-informed-models-and-operators
  markdown: A physics-informed neural network can approximate a solution u(x,t) and penalize disagreement with a
    differential equation at selected points. Automatic differentiation supplies derivatives of the network. Data
    fit, equation residuals, initial conditions, and boundary conditions need compatible weighting and units.
  text_mode: A physics-informed neural network can approximate a solution u(x,t) and penalize disagreement with
    a differential equation at selected points. Automatic differentiation supplies derivatives of the network. Data
    fit, equation residuals, initial conditions, and boundary conditions need compatible weighting and units.
  bridges: []
- id: physics-informed-models-and-operators.s2
  title: Residual size is not the whole solution
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.physics-informed-models-and-operators
  markdown: A small residual at sampled points does not automatically bound global solution error. Missing boundary
    conditions, stiffness, sharp features, or poor sampling can undermine results. Compare with analytic solutions
    or trusted numerical methods on controlled cases.
  text_mode: A small residual at sampled points does not automatically bound global solution error. Missing boundary
    conditions, stiffness, sharp features, or poor sampling can undermine results. Compare with analytic solutions
    or trusted numerical methods on controlled cases.
  bridges:
  - multivariable-calculus
  - dynamics-and-noise
- id: physics-informed-models-and-operators.s3
  title: Learn a map between functions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.physics-informed-models-and-operators
  markdown: A neural operator can learn how an input field or coefficient function maps to a solution field across
    a family of problems. Fourier neural operators use learned operations involving frequency representations as
    part of that mapping. This differs from fitting one solution at fixed parameters.
  text_mode: A neural operator can learn how an input field or coefficient function maps to a solution field across
    a family of problems. Fourier neural operators use learned operations involving frequency representations as
    part of that mapping. This differs from fitting one solution at fixed parameters.
  bridges: []
- id: physics-informed-models-and-operators.s4
  title: Evaluate scientific use rather than appearance
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.physics-informed-models-and-operators
  markdown: Check conservation where relevant, boundary behavior, resolution changes, long-horizon stability, and
    unseen parameter regimes. A smooth plot can conceal important numerical errors. Report training cost, inference
    speed, reference-solver settings, and the domain where the learned approximation is supported.
  text_mode: Check conservation where relevant, boundary behavior, resolution changes, long-horizon stability, and
    unseen parameter regimes. A smooth plot can conceal important numerical errors. Report training cost, inference
    speed, reference-solver settings, and the domain where the learned approximation is supported.
  bridges: []
