schema_version: 0.2-draft
lesson:
  id: physics-informed-models-and-operators
  version: 0.4.0-draft
  title: Learn functions while using equations or families of solutions
  state: draft
  summary: You have two blood tests and a decay law. Put the law into the loss, check the residual by hand, and meet networks that learn whole families of solutions.
  slot: M34.3
  category: learning
  sources:
    - title: "Physics-informed neural networks: A deep learning framework for solving forward and inverse problems involving nonlinear partial differential equations (Raissi, Perdikaris & Karniadakis, Journal of Computational Physics, 2019)"
      url: https://doi.org/10.1016/j.jcp.2018.10.045
    - title: Understanding and mitigating gradient pathologies in physics-informed neural networks (Wang, Teng & Perdikaris, 2021)
      url: https://arxiv.org/abs/2001.04536
    - title: Characterizing possible failure modes in physics-informed neural networks (Krishnapriyan et al., NeurIPS 2021)
      url: https://arxiv.org/abs/2109.01050
    - title: Can Physics-Informed Neural Networks beat the Finite Element Method? (Grossmann et al., 2023)
      url: https://arxiv.org/abs/2302.04107
    - title: Fourier Neural Operator for Parametric Partial Differential Equations (Li et al., 2020; ICLR 2021)
      url: https://arxiv.org/abs/2010.08895
objectives:
  - id: objective.physics-informed-models-and-operators
    version: 2-draft
    statement: Physics-informed models add equation and boundary residuals to learning, while neural operators map between function spaces; numerical accuracy, constraints, and extrapolation require independent checks.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - physics-informed-models-and-operators.base.v2
      - physics-informed-models-and-operators.transfer.v2
      - physics-informed-models-and-operators.calculate
    prerequisites:
      - anyOf:
          - objective.neural-forward-pass
      - anyOf:
          - objective.automatic-differentiation
      - anyOf:
          - objective.dynamics-and-noise
scenes:
  - id: physics-informed-models-and-operators.s1
    title: Two blood tests and a law of decay
    type: explanation
    depth: intuition
    objective_refs:
      - objective.physics-informed-models-and-operators
    markdown: |-
      A patient gets a dose of a drug, and a lab measures its concentration twice. You want the whole curve, to know when the level drops below a threshold, but two points can't pin down a curve. Pharmacology gives you more than points: many drugs are cleared at a rate proportional to how much is present:

      $$\frac{du}{dt} = -k\,u, \qquad u(0) = 1$$

      Here $u(t)$ is the concentration (scaled so the starting dose is 1), $t$ is time in days, and $k = 2$ per day is the clearance rate. This is an **ordinary differential equation (ODE)**: it relates a quantity to its own rate of change. Its exact solution is $u = e^{-2t}$.

      A **physics-informed neural network (PINN)**, introduced by Raissi, Perdikaris, and Karniadakis (2019), is a network $u_\theta(t)$ trained so that it fits the measurements *and* obeys the equation. The loss has three parts:

      $$\mathcal{L} = \underbrace{\tfrac{1}{N_d}\sum_i \big(u_\theta(t_i) - u_i\big)^2}_{\text{data}} + \lambda_r \underbrace{\tfrac{1}{N_r}\sum_j r(t_j)^2}_{\text{equation}} + \lambda_0 \underbrace{\big(u_\theta(0) - 1\big)^2}_{\text{initial condition}}$$

      The **residual** $r(t) = \frac{du_\theta}{dt} + k\,u_\theta$ measures how badly the network breaks the equation at time $t$; it is 0 for a perfect solution. The times $t_j$ where you check it are called **collocation points**, and you can choose as many as you like, with no lab work. The derivative $du_\theta/dt$ comes from automatic differentiation (module 11), and the weights $\lambda$ set how much each part counts.
    diagram:
      caption: The three parts of a PINN loss, all computed from the same network.
      description: The network u(t) feeds three loss terms. It sends its value at the measured times to the data term. It sends its value and its automatic derivative at the collocation points to the equation-residual term. It sends its value at time zero to the initial-condition term. All three terms add, with weights, into the total loss. A dashed arrow goes from the total loss to a gradient-step node, and another dashed arrow goes from the gradient step back to the network, which updates its weights.
      nodes:
        - id: net
          label: Network u_θ(t)
          col: 0
          row: 1
          tone: accent
        - id: data
          label: Data term
          note: match the two blood tests
          col: 2
          row: 0
          tone: data
        - id: pde
          label: Equation residual
          note: du/dt + k·u at collocation points
          col: 2
          row: 1
          tone: warn
        - id: ic
          label: Initial condition
          note: u(0) − 1
          col: 2
          row: 2
        - id: total
          label: Total loss
          note: weighted sum
          col: 4
          row: 1
          tone: accent
        - id: step
          label: Gradient step
          note: backpropagate the total loss
          col: 2
          row: 3
          tone: muted
      edges:
        - from: net
          to: data
          label: u at measured times
        - from: net
          to: pde
          label: u and du/dt (autodiff)
        - from: net
          to: ic
          label: u(0)
        - from: data
          to: total
        - from: pde
          to: total
        - from: ic
          to: total
        - from: total
          to: step
          dashed: true
        - from: step
          to: net
          label: update weights
          dashed: true
    bridges:
      - derivatives
  - id: physics-informed-models-and-operators.s2
    title: Check the residual by hand
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.physics-informed-models-and-operators
    markdown: |-
      Score some candidate curves yourself, with collocation points $t = 0, 0.25, 0.5$ and $k = 2$.

      Take the straight line $u = 1 - 2t$. Its slope is $-2$ everywhere, so $r(t) = -2 + 2(1 - 2t) = -4t$. At the three points: 0, −1, −2. The equation loss is the mean square, $(0 + 1 + 4)/3 \approx 1.667$. It starts at 1, so the initial-condition term is 0. The line has the right start and the wrong shape.

      | Candidate | Residuals at 0, 0.25, 0.5 | Equation loss | Initial-condition loss |
      | --- | --- | ---: | ---: |
      | $e^{-2t}$ | 0, 0, 0 | 0 | 0 |
      | $1 - 2t$ | 0, −1, −2 | 1.667 | 0 |
      | $0$ | 0, 0, 0 | 0 | 1 |
      | $3e^{-2t}$ | 0, 0, 0 | 0 | 4 |

      :::predict Why do both u = 0 and u = 3e^(−2t) have zero residual?
      Any $u = Ce^{-2t}$ obeys $du/dt = -2u$, including $C = 0$. The equation fixes the shape, not the height. Only the initial-condition term, $(C - 1)^2$, picks out $C = 1$. Drop that term and training can happily settle on "no drug at all."
      :::

      The code scores the candidates, then does a tiny physics-only fit. It fits a cubic, $u = c_0 + c_1 t + c_2 t^2 + c_3 t^3$, using the equation at 20 collocation points plus the starting value, and no measurements at all.

      ```python run
      import numpy as np

      k = 2.0
      t = np.array([0.0, 0.25, 0.5])              # collocation points

      candidates = {                               # name: (u(t), du/dt)
          "exp(-2t)":   (lambda t: np.exp(-2*t),   lambda t: -2*np.exp(-2*t)),
          "1 - 2t":     (lambda t: 1 - 2*t,        lambda t: -2 + 0*t),
          "0":          (lambda t: 0*t,            lambda t: 0*t),
          "3 exp(-2t)": (lambda t: 3*np.exp(-2*t), lambda t: -6*np.exp(-2*t)),
      }
      for name, (u, du) in candidates.items():
          residual = du(t) + k * u(t)              # zero when du/dt = -k u
          loss_pde = np.mean(residual ** 2)
          loss_ic = (u(0.0) - 1.0) ** 2            # u(0) should be 1
          print(f"{name:11s} residuals={residual.round(3)}  PDE={loss_pde:.3f}  IC={loss_ic:.3f}")

      # Physics-only fit of u(t) = c0 + c1 t + c2 t^2 + c3 t^3 (no measurements used)
      T = np.linspace(0, 1, 20)[:, None]
      n = np.arange(4)
      basis = T ** n                               # rows: [1, t, t^2, t^3]
      dbasis = n * T ** np.maximum(n - 1, 0)       # their derivatives
      A = np.vstack([dbasis + k * basis, basis[0]])    # residual rows, then u(0) row
      b = np.concatenate([np.zeros(len(T)), [1.0]])
      c = np.linalg.lstsq(A, b, rcond=None)[0]
      u_fit = lambda s: np.polyval(c[::-1], s)     # the fitted cubic at time s
      for s in (0.1, 1.0):
          print(f"fitted u({s}) = {u_fit(s):.4f}   exact = {np.exp(-k*s):.4f}")
      ```

      The fit gives $u(1) = 0.1347$ against the exact $0.1353$: the equation alone did the teaching. Now set `k = 20.0`. At $t = 0.1$ the fit says 0.0013 where the truth is 0.1353. A cubic can't follow a decay that sharp, which leads to the next scene.
    bridges:
      - multivariable-calculus
      - dynamics-and-noise
  - id: physics-informed-models-and-operators.pinn-difficulties
    title: Why PINNs are hard to train
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.physics-informed-models-and-operators
    markdown: |-
      On harder problems, researchers keep meeting the same trouble:

      - **The loss terms fight.** Wang, Teng, and Perdikaris (2021) showed that the equation term's gradients can dwarf the boundary terms', so training obeys the equation and ignores where the solution must start. Tuning the $\lambda$ weights, or adapting them during training, helps.
      - **Sharp features come last.** Networks learn smooth shapes first. Fast decays, shocks, and thin boundary layers arrive late or never, as the `k = 20` run hinted.
      - **The optimization is hard.** Krishnapriyan and colleagues (2021) showed PINNs failing on simple-looking convection problems even when the network could represent the answer.

      For a plain **forward problem** (known equation and starting values, find the solution), mature numerical solvers are usually faster and more accurate. Grossmann and colleagues (2023) found PINNs didn't beat the finite element method on time or accuracy for the equations they tested.

      PINNs earn their keep on **inverse problems**, where part of the physics is unknown. Don't know this patient's clearance rate? Make $k$ trainable alongside the weights. The blood tests pull the curve toward the data, the residual keeps it an exponential decay, and training recovers $k$. Raissi and colleagues used this to estimate unknown coefficients in the Navier–Stokes equations for fluid flow.
    bridges: []
  - id: physics-informed-models-and-operators.s3
    title: Learn the solver, not one solution
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.physics-informed-models-and-operators
    markdown: |-
      A PINN learns one curve: this patient, this dose. Change the dosing schedule and you train again. Often you want a model that takes *any* input function (a week's dosing schedule) and returns the matching solution (the concentration curve). A map from functions to functions is an **operator**, and a network that learns one is a **neural operator**. You train it on many input–solution pairs from a trusted solver, then reuse it on new inputs quickly.

      :::papers Fourier neural operator (Li et al., 2020)
      Each layer transforms a function $v(x)$ sampled on a grid:

      $$v'(x) = \sigma\Big(W v(x) + \mathcal{F}^{-1}\big(R \cdot \mathcal{F}(v)\big)(x)\Big)$$

      $\mathcal{F}$ is the Fourier transform, which rewrites the function as a sum of waves of different frequencies. $R$ is a set of learned weights applied to only the lowest few frequencies; higher ones are dropped. $W$ acts on each grid point separately, like a 1×1 convolution. Because $R$ lives on frequencies rather than grid points, the same weights can be applied to a coarser or finer grid.
      :::

      That property drives the **resolution-independence** claim. On turbulent flow, the paper ran a model trained on a 64×64 grid directly on a 256×256 grid ("zero-shot super-resolution") and reported speedups of up to three orders of magnitude over a traditional solver. But the model can't create detail above the frequencies it kept, and later analyses found that switching grids adds errors of its own. Test at the resolution you'll actually use.
    bridges: []
  - id: physics-informed-models-and-operators.s4
    title: A smooth plot isn't a checked answer
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.physics-informed-models-and-operators
    markdown: |-
      Suppose a team shows a neural operator predicting river floods, with beautiful maps. Here's how a careful reviewer checks it:

      | Check | What they did | What they found |
      | --- | --- | --- |
      | Against a trusted solver | Ran a standard numerical solver on 50 held-out storms | 3% average error, 20% on the two biggest storms |
      | Conservation | Summed the water in and out of the map | 4% of the water vanished over a 3-day forecast |
      | Long rollout | Fed each prediction back in, 30 times | Errors grew after day 5 |
      | Cost | Timed both methods, including training | 1,000 times faster per storm, after 2 GPU-days of training |

      Every row changes a decision: add big-storm training cases, add a conservation penalty, keep long forecasts on the solver, and use the model only if they'll run thousands of storms.

      :::mixup "The loss went to nearly zero, so the solution is right."
      A PINN's loss is measured only at the collocation points, with the weights you chose. A candidate with zero residual can still start in the wrong place, like $u = 0$ above, and a network can wiggle between points. Compare against an exact answer or a trusted solver.
      :::
    bridges: []
  - id: physics-informed-models-and-operators.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.physics-informed-models-and-operators
    markdown: Residuals to compute by hand, then heat flow, battery aging, groundwater, and weather surrogates to test when a PINN, a neural operator, or a classical solver fits.
    takeaway: |-
      A PINN adds the equation's residual and the starting or boundary values to its loss, so it learns from physics as well as data. A neural operator learns the map from input functions to solutions. Check either one against a trusted solver before you rely on it.
  - id: physics-informed-models-and-operators.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.physics-informed-models-and-operators
    markdown: |-
      Equation residuals can guide learning, but initial and boundary conditions also matter. Test the learned solution or operator against independent numerical or physical evidence.
