schema_version: 0.2-draft
lesson:
  id: physics-informed-models-and-operators
  version: 0.1.0-draft
  title: Learn functions while using equations or families of solutions
  state: draft
  summary: Physics-informed models add equation and boundary residuals to learning, while neural operators map between
    function spaces; numerical accuracy, constraints, and extrapolation require independent checks.
  slot: M34.3
  category: learning
  minutes: 12
  sources:
  - title: Physics Informed Deep Learning
    url: https://arxiv.org/abs/1711.10561
  - title: Fourier Neural Operator
    url: https://arxiv.org/abs/2010.08895
objectives:
- id: objective.physics-informed-models-and-operators
  version: 1-draft
  statement: Physics-informed models add equation and boundary residuals to learning, while neural operators map
    between function spaces; numerical accuracy, constraints, and extrapolation require independent checks.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - physics-informed-models-and-operators.base
  - physics-informed-models-and-operators.transfer
  prerequisites:
  - anyOf:
    - objective.equivariant-scientific-learning
  - anyOf:
