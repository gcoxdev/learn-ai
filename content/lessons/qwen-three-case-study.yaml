schema_version: 0.2-draft
lesson:
  id: qwen-three-case-study
  version: 0.1.0-draft
  title: Compare Qwen3 dense and MoE models with reasoning modes
  state: draft
  summary: The original Qwen3 release connects dense and MoE architecture choices with staged pretraining, reasoning-oriented
    adaptation, mode fusion, and distillation; compare exact checkpoints and mode-specific inference budgets.
  slot: M35.3
  category: learning
  minutes: 18
  sources:
  - title: Qwen3 report v1
    url: https://arxiv.org/abs/2505.09388v1
  - title: Qwen3 official repository
    url: https://github.com/QwenLM/Qwen3
objectives:
- id: objective.qwen-three-case-study
  version: 1-draft
  statement: The original Qwen3 release connects dense and MoE architecture choices with staged pretraining, reasoning-oriented
    adaptation, mode fusion, and distillation; compare exact checkpoints and mode-specific inference budgets.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - qwen-three-case-study.base
  - qwen-three-case-study.transfer
  prerequisites:
  - anyOf:
    - objective.model-report-and-artifact-inventory
  - anyOf:
