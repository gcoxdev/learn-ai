assessment_families:
  - id: qwen-three-case-study.base
    objective_ref: objective.qwen-three-case-study
    task: base
    response_type: single_choice
    points: 1
    hint: Separate total parameters (memory) from active parameters (compute per token).
    remediation_scene: qwen-three-case-study.s2
    variants:
      - id: qwen-three-case-study.base.1
        prompt: In 30B-A3B, does A3B describe total stored parameters?
        options:
          - id: c
            text: It denotes the vocabulary size
          - id: a
            text: No; it denotes an approximate activated count
          - id: b
            text: 'Yes'
        answer: a
        feedback: Total and activated capacity are different quantities.
        retired: true
      - id: qwen-three-case-study.base.2
        prompt: Do the original MoE blocks activate all 128 experts per token?
        options:
          - id: a
            text: No; the reported selection is eight
          - id: b
            text: 'Yes'
          - id: c
            text: Only when a prompt is English
        answer: a
        feedback: Sparse routing executes a selected subset.
        retired: true
  - id: qwen-three-case-study.transfer
    objective_ref: objective.qwen-three-case-study
    task: transfer
    response_type: single_choice
    points: 1
    hint: List everything that differs between the two models before crediting any single cause.
    remediation_scene: qwen-three-case-study.s6
    variants:
      - id: qwen-three-case-study.transfer.1
        prompt: Should every small model be assigned the flagship post-training recipe without checking?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if model names share Qwen3
        answer: a
        feedback: Distillation can change the stage history.
        retired: true
      - id: qwen-three-case-study.transfer.2
        prompt: Why compare reasoning modes at matched budgets?
        options:
          - id: b
            text: Modes always have identical cost
          - id: c
            text: Only parameter counts affect latency
          - id: a
            text: Longer generated traces consume resources that affect the tradeoff
        answer: a
        feedback: Inference behavior and cost depend on generation length and settings.
        retired: true
  - id: qwen-three-case-study.base.v2
    objective_ref: objective.qwen-three-case-study
    task: base
    response_type: single_choice
    points: 1
    hint: Ask which part of the model each number touches. Experts live in the feed-forward layers, the cache holds only attention keys and values, and the modes live in the chat template.
    remediation_scene: qwen-three-case-study.s5
    variants:
      - id: qwen-three-case-study.base.v2.1
        prompt: What do "30B" and "A3B" in Qwen3-30B-A3B tell you?
        options:
          - id: b
            text: 30B are routed experts, and 3B is a shared expert that runs for every token
          - id: a
            text: About 30B parameters must be stored, and about 3B are used per token
          - id: c
            text: About 30B parameters are used in training, and 3B remain after pruning
        answer: a
        feedback: Total parameters must all be resident, since any token may route to any expert; about 3.3B are active per token. Qwen3's MoEs have no shared expert, and nothing is pruned after training.
      - id: qwen-three-case-study.base.v2.2
        prompt: Qwen3-235B-A22B caches 188 KiB per token, while the dense Qwen3-32B caches 256 KiB. What explains this?
        options:
          - id: c
            text: Its width is smaller, 4,096 against 5,120, and the cache scales with width
          - id: b
            text: Only the 8 chosen experts in each layer store keys and values
          - id: a
            text: It has 4 KV heads instead of 8, which outweighs its extra layers
        answer: a
        feedback: Cache per token is 2 × layers × KV heads × head width × bytes. 94 × 4 = 376 against 64 × 8 = 512, with the same head width. Experts sit in the feed-forward layers and cache nothing, and with GQA the cache depends on KV heads × head width, not on the model width.
      - id: qwen-three-case-study.base.v2.3
        prompt: What happened in Qwen3's "thinking mode fusion" stage?
        options:
          - id: a
            text: SFT on the reasoning-RL model, mixing thinking and non-thinking examples marked with flags
          - id: b
            text: The weights of a separate reasoning model and chat model were averaged into one
          - id: c
            text: RL with a length penalty taught the model to skip reasoning on easy questions
        answer: a
        feedback: Fusion is continued supervised fine-tuning on flagged examples, using the chat template with /think and /no_think. No weights were merged, and no length reward was used to create the direct mode.
      - id: qwen-three-case-study.base.v2.4
        prompt: A Qwen3 deployment sets a 4,000-token thinking budget. What happens when the reasoning reaches it?
        options:
          - id: b
            text: The model has learned from RL to wrap up its reasoning near the limit
          - id: c
            text: Decoding switches to greedy sampling so the answer arrives sooner
          - id: a
            text: The code stops the reasoning, inserts a fixed instruction, and the model answers
        answer: a
        feedback: The serving code halts the thinking, appends the stop-thinking instruction and closes the block, and the model answers from its partial reasoning. The report says this ability emerged from mode fusion; it wasn't trained with a length reward.
  - id: qwen-three-case-study.transfer.v2
    objective_ref: objective.qwen-three-case-study
    task: transfer
    response_type: single_choice
    points: 1
    hint: Decide what the situation needs (memory, compute, a mode, or a fair comparison), then use the Qwen3 fact that governs it.
    remediation_scene: qwen-three-case-study.s4
    variants:
      - id: qwen-three-case-study.transfer.v2.1
        prompt: A tutoring app gets quick formula lookups and long proofs, and can afford only one deployment. How should it use Qwen3?
        options:
          - id: c
            text: Use thinking mode for everything, since reasoning never lowers accuracy
          - id: a
            text: Send /no_think for lookups and a thinking budget for proofs, measuring both
          - id: b
            text: Run a Qwen3 model for proofs next to a separate chat model for lookups
        answer: a
        feedback: One checkpoint serves both modes, so the app chooses per request and checks accuracy and tokens for each setting. Thinking on every lookup spends tokens and waiting time for little gain, and a second model gives up the single deployment.
      - id: qwen-three-case-study.transfer.v2.2
        prompt: A manager says Qwen3-30B-A3B "only needs about 6 GB of GPU memory in bf16, since just 3B parameters are active." What's the correction?
        options:
          - id: a
            text: All 30.5B parameters must be resident, about 61 GB in bf16
          - id: b
            text: It needs 3.3B × 8 experts × 2 bytes, about 53 GB in bf16
          - id: c
            text: 6 GB is right for weights; the KV cache adds the rest
        answer: a
        feedback: Any token can route to any of the 128 experts, so all of them must be loaded; the active count sets compute, not memory. The 3.3B active count already includes the 8 chosen experts.
      - id: qwen-three-case-study.transfer.v2.3
        prompt: A lab wants to improve its 7B maths student and has a strong 70B teacher. It must choose between RL on the student and on-policy distillation from the teacher. What does Qwen3's 8B experiment suggest?
        options:
          - id: b
            text: RL, since learning from its own rewards generalizes better than imitation
          - id: c
            text: Off-policy fine-tuning only, since student-generated samples are too costly
          - id: a
            text: On-policy distillation, which scored higher for about a tenth of the GPU-hours
        answer: a
        feedback: From the same start, on-policy distillation reached 74.4 on AIME'24 in 1,800 GPU-hours, against 67.6 in 17,920 for RL. Qwen3 used off-policy distillation first, then added the on-policy phase because it helped further.
      - id: qwen-three-case-study.transfer.v2.4
        prompt: In thinking mode, Qwen3-32B outscores Qwen3-30B-A3B on a coding benchmark. A colleague concludes that dense beats MoE. What's wrong with that?
        options:
          - id: c
            text: Nothing, since the two models have nearly the same total size
          - id: a
            text: Active size and post-training recipe also differ, so architecture isn't isolated
          - id: b
            text: Thinking-mode scores can't be compared across different Qwen3 models
        answer: a
        feedback: The 32B uses about ten times more parameters per token and went through all four stages, while 30B-A3B was distilled. Similar total size doesn't make it a controlled test, though scores under the same mode and budget can still be compared.
  - id: qwen-three-case-study.calculate
    objective_ref: objective.qwen-three-case-study
    task: base
    response_type: numeric
    points: 1
    hint: "Memory uses total parameters × bytes. The cache uses 2 × layers × KV heads × 128 × 2 bytes. Training compute uses 6 × active parameters × tokens."
    remediation_scene: qwen-three-case-study.s5
    absolute_tolerance: 1
    variants:
      - id: qwen-three-case-study.calculate.1
        prompt: Qwen3-235B-A22B has 235 billion total parameters. How many GB do its weights take in FP8 (1 byte each)?
        answer: 235
        feedback: 235 × 10⁹ × 1 byte = 235 GB. The 22B active count doesn't reduce it, because every expert must be stored.
      - id: qwen-three-case-study.calculate.2
        prompt: Qwen3-235B-A22B has 94 layers and 4 KV heads of width 128. With a 2-byte cache, how many KiB does each token add?
        answer: 188
        feedback: 2 × 94 × 4 × 128 × 2 = 192,512 bytes, and 192,512 ÷ 1,024 = 188 KiB.
      - id: qwen-three-case-study.calculate.3
        prompt: Using 6ND with 22 billion active parameters and 36 trillion tokens, what is Qwen3-235B-A22B's pretraining compute, in units of 10²³ FLOPs?
        answer: 47.5
        feedback: 6 × 22 × 10⁹ × 36 × 10¹² = 4.75 × 10²⁴ = 47.5 × 10²³ FLOPs. For an MoE, use the active count, since each token passes through only the chosen experts.
      - id: qwen-three-case-study.calculate.4
        prompt: Qwen3-30B-A3B has 48 layers and 4 KV heads of width 128. With a 2-byte cache, how many KiB does each token add?
        answer: 96
        feedback: 2 × 48 × 4 × 128 × 2 = 98,304 bytes = 96 KiB.
      - id: qwen-three-case-study.calculate.5
        prompt: Qwen3-30B-A3B has 30.5 billion total parameters. How many GB do its weights take in bf16?
        answer: 61
        feedback: 30.5 × 10⁹ × 2 bytes = 61 GB, even though only about 3.3B parameters work on each token.
