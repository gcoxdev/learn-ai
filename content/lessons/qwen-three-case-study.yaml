scenes:
- id: qwen-three-case-study.s1
  title: Pin the original family
  type: explanation
  depth: intuition
  objective_refs:
  - objective.qwen-three-case-study
  markdown: 'Anchor: Qwen3 Technical Report revision 1, May 14, 2025. This lesson studies the original mixed thinking/non-thinking
    family, not every later Qwen3-branded update. Sources checked September 13, 2026. The official repository points
    to individual model cards and their artifact-specific configurations.'
  text_mode: 'Anchor: Qwen3 Technical Report revision 1, May 14, 2025. This lesson studies the original mixed thinking/non-thinking
    family, not every later Qwen3-branded update. Sources checked September 13, 2026. The official repository points
    to individual model cards and their artifact-specific configurations.'
  bridges: []
- id: qwen-three-case-study.s2
  title: Compare dense and sparse capacity
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.qwen-three-case-study
  markdown: 'The report includes dense models and two MoEs: 30B-A3B and 235B-A22B. Their sparse blocks select eight
    of 128 experts. The A labels distinguish approximate activated counts from total counts; they do not specify
    the entire memory footprint or guarantee a particular serving speed.'
  text_mode: 'The report includes dense models and two MoEs: 30B-A3B and 235B-A22B. Their sparse blocks select eight
    of 128 experts. The A labels distinguish approximate activated counts from total counts; they do not specify
    the entire memory footprint or guarantee a particular serving speed.'
  bridges: []
- id: qwen-three-case-study.s3
  title: Follow data and adaptation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.qwen-three-case-study
  markdown: The report describes a 36T-token multilingual pretraining corpus and staged capability/context development.
    Flagship post-training proceeds through long-reasoning cold start, reasoning RL, thinking-mode fusion, and general
    RL. Smaller-model recipes use strong-to-weak distillation, so the flagship sequence should not be copied onto
    every model without checking.
  text_mode: The report describes a 36T-token multilingual pretraining corpus and staged capability/context development.
    Flagship post-training proceeds through long-reasoning cold start, reasoning RL, thinking-mode fusion, and general
    RL. Smaller-model recipes use strong-to-weak distillation, so the flagship sequence should not be copied onto
    every model without checking.
  bridges: []
- id: qwen-three-case-study.s4
  title: Inspect the inference mode contract
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.qwen-three-case-study
  markdown: The original repository documents thinking controls and matching templates; it states Apache 2.0 for
    its open-weight models, with license files in model repositories. Mode settings alter the generation behavior
    and budget. Inspect the exact checkpoint before applying these instructions to a later release with a different
    interface.
  text_mode: The original repository documents thinking controls and matching templates; it states Apache 2.0 for
    its open-weight models, with license files in model repositories. Mode settings alter the generation behavior
    and budget. Inspect the exact checkpoint before applying these instructions to a later release with a different
    interface.
  bridges: []
- id: qwen-three-case-study.s5
  title: Compare useful operating points
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.qwen-three-case-study
  markdown: Run the same verified tasks in supported modes with explicit total token and latency budgets. A mode
    producing longer intermediate text can improve some answers while costing more. Compare dense and sparse variants
    using both quality and full resident memory, including shared computation and caches.
  text_mode: Run the same verified tasks in supported modes with explicit total token and latency budgets. A mode
    producing longer intermediate text can improve some answers while costing more. Compare dense and sparse variants
    using both quality and full resident memory, including shared computation and caches.
  bridges: []
- id: qwen-three-case-study.s6
  title: Distinguish observations from explanations
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.qwen-three-case-study
  markdown: If one variant performs better, data, distillation, capacity, and training budget may all differ. Use
    documented ablations where available and state remaining confounds. A coherent family offers useful comparisons
    without becoming a controlled experiment in architecture alone.
  text_mode: If one variant performs better, data, distillation, capacity, and training budget may all differ. Use
    documented ablations where available and state remaining confounds. A coherent family offers useful comparisons
    without becoming a controlled experiment in architecture alone.
  bridges: []
- id: qwen-three-case-study.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.qwen-three-case-study
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: The original Qwen3 release connects dense and MoE architecture choices with staged pretraining, reasoning-oriented
    adaptation, mode fusion, and distillation; compare exact checkpoints and mode-specific inference budgets.
