schema_version: 0.2-draft
lesson:
  id: qwen-three-case-study
  version: 0.3.0-draft
  title: Compare Qwen3 dense and MoE models with reasoning modes
  state: draft
  summary: Compare dense and expert models while tracing how their thinking modes were trained.
  slot: M35.3
  category: learning
  sources:
  - title: Qwen3 report v1
    url: https://arxiv.org/abs/2505.09388v1
  - title: Qwen3 official repository
    url: https://github.com/QwenLM/Qwen3
objectives:
- id: objective.qwen-three-case-study
  version: 1-draft
  statement: The original Qwen3 release connects dense and MoE architecture choices with staged pretraining,
    reasoning-oriented adaptation, mode fusion, and distillation; compare exact checkpoints and mode-specific
    inference budgets.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - qwen-three-case-study.base
  - qwen-three-case-study.transfer
  prerequisites:
  - anyOf:
    - objective.model-report-and-artifact-inventory
  - anyOf:
    - objective.moe-parameter-accounting
  - anyOf:
    - objective.reasoning-distillation-and-cost
scenes:
- id: qwen-three-case-study.s1
  title: Pin the original family
  type: explanation
  depth: intuition
  objective_refs:
  - objective.qwen-three-case-study
  markdown: 'Anchor: Qwen3 Technical Report revision 1, May 14, 2025. This lesson studies the original mixed
    thinking/non-thinking family, not every later Qwen3-branded update. Sources checked September 13, 2026.
    The official repository points to individual model cards and their artifact-specific configurations.'
  text_mode: 'Anchor: Qwen3 Technical Report revision 1, May 14, 2025. This lesson studies the original mixed
    thinking/non-thinking family, not every later Qwen3-branded update. Sources checked September 13, 2026.
    The official repository points to individual model cards and their artifact-specific configurations.'
  bridges: []
- id: qwen-three-case-study.s2
  title: Compare dense and sparse capacity
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.qwen-three-case-study
  markdown: 'The report includes dense models and two MoEs: 30B-A3B and 235B-A22B. Their sparse blocks select
    eight of 128 experts. The A labels distinguish approximate activated counts from total counts; they do
    not specify the entire memory footprint or guarantee a particular serving speed.'
  text_mode: 'The report includes dense models and two MoEs: 30B-A3B and 235B-A22B. Their sparse blocks select
    eight of 128 experts. The A labels distinguish approximate activated counts from total counts; they do
    not specify the entire memory footprint or guarantee a particular serving speed.'
  bridges: []
- id: qwen-three-case-study.s3
  title: Follow data and adaptation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.qwen-three-case-study
  markdown: 'The report describes a 36T-token multilingual pretraining corpus. Its three pretraining stages
    build broad knowledge, emphasize knowledge-intensive material, and extend context from 4,096 to 32,768
    tokens.


    Flagship post-training then follows four stages: long-reasoning cold start, reasoning reinforcement learning,
    thinking-mode fusion, and general reinforcement learning. The cold start supplies reasoning demonstrations;
    reasoning RL rewards checked outcomes; mode fusion combines thinking and direct-answer examples; general
    RL broadens the targeted behavior.


    Smaller-model recipes use **strong-to-weak distillation**: transferring behavior through teacher-generated
    examples. This does not copy the teacher''s expert layout. Check the recipe for each model rather than
    assigning the flagship sequence to every family member.'
  text_mode: 'The report describes a 36T-token multilingual pretraining corpus. Its three pretraining stages
    build broad knowledge, emphasize knowledge-intensive material, and extend context from 4,096 to 32,768
    tokens.


    Flagship post-training then follows four stages: long-reasoning cold start, reasoning reinforcement learning,
    thinking-mode fusion, and general reinforcement learning. The cold start supplies reasoning demonstrations;
    reasoning RL rewards checked outcomes; mode fusion combines thinking and direct-answer examples; general
    RL broadens the targeted behavior.


    Smaller-model recipes use **strong-to-weak distillation**: transferring behavior through teacher-generated
    examples. This does not copy the teacher''s expert layout. Check the recipe for each model rather than
    assigning the flagship sequence to every family member.'
  bridges: []
- id: qwen-three-case-study.s4
  title: Inspect the inference mode contract
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.qwen-three-case-study
  markdown: The original repository documents thinking controls and matching templates; it states Apache 2.0
    for its open-weight models, with license files in model repositories. Mode settings alter the generation
    behavior and budget. Inspect the exact checkpoint before applying these instructions to a later release
    with a different interface.
  text_mode: The original repository documents thinking controls and matching templates; it states Apache 2.0
    for its open-weight models, with license files in model repositories. Mode settings alter the generation
    behavior and budget. Inspect the exact checkpoint before applying these instructions to a later release
    with a different interface.
  bridges: []
- id: qwen-three-case-study.s5
  title: Compare useful operating points
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.qwen-three-case-study
  markdown: 'Run the same verified tasks in supported modes with explicit total token and latency budgets.
    A mode producing longer intermediate text can improve some answers while costing more. Compare dense and
    sparse variants using both quality and full resident memory, including shared computation and caches.


    For a toy comparison, record final-answer correctness alongside all generated tokens, including intermediate
    reasoning. Ten correct answers using 1,000 tokens and eleven using 5,000 express a quality–cost tradeoff;
    they do not establish one universally better mode. Keep prompts, attempt counts, and scoring fixed before
    interpreting the difference.'
  text_mode: 'Run the same verified tasks in supported modes with explicit total token and latency budgets.
    A mode producing longer intermediate text can improve some answers while costing more. Compare dense and
    sparse variants using both quality and full resident memory, including shared computation and caches.


    For a toy comparison, record final-answer correctness alongside all generated tokens, including intermediate
    reasoning. Ten correct answers using 1,000 tokens and eleven using 5,000 express a quality–cost tradeoff;
    they do not establish one universally better mode. Keep prompts, attempt counts, and scoring fixed before
    interpreting the difference.'
  bridges: []
- id: qwen-three-case-study.s6
  title: Distinguish observations from explanations
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.qwen-three-case-study
  markdown: If one variant performs better, data, distillation, capacity, and training budget may all differ.
    Use documented ablations where available and state remaining confounds. A coherent family offers useful
    comparisons without becoming a controlled experiment in architecture alone.
  text_mode: If one variant performs better, data, distillation, capacity, and training budget may all differ.
    Use documented ablations where available and state remaining confounds. A coherent family offers useful
    comparisons without becoming a controlled experiment in architecture alone.
  bridges: []
