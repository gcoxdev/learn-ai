schema_version: 0.2-draft
lesson:
  id: qwen-three-case-study
  version: 0.4.0-draft
  title: Compare Qwen3 dense and MoE models with reasoning modes
  state: draft
  summary: Add "/no_think" to a question and Qwen3 answers at once; leave it off and it reasons at length first, with the same weights. See how that switch was trained, and why the huge MoE caches less than the dense 32B.
  slot: M35.3
  category: learning
  sources:
    - title: Qwen3 report v1
      url: https://arxiv.org/abs/2505.09388v1
    - title: Qwen3 official repository
      url: https://github.com/QwenLM/Qwen3
objectives:
  - id: objective.qwen-three-case-study
    version: 2-draft
    statement: The original Qwen3 release connects dense and MoE architecture choices with staged pretraining, reasoning-oriented adaptation, mode fusion, and distillation; compare exact checkpoints and mode-specific inference budgets.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - qwen-three-case-study.base.v2
      - qwen-three-case-study.transfer.v2
      - qwen-three-case-study.calculate
    prerequisites:
      - anyOf:
          - objective.model-report-and-artifact-inventory
      - anyOf:
          - objective.moe-parameter-accounting
      - anyOf:
          - objective.reasoning-distillation-and-cost
scenes:
  - id: qwen-three-case-study.s1
    title: One set of weights, two ways to answer
    type: explanation
    depth: intuition
    objective_refs:
      - objective.qwen-three-case-study
    markdown: |-
      You're building a maths tutor. Some requests are lookups ("What's the formula for a circle's area?"); others are proofs that need careful reasoning. Qwen's own previous lineup split this across two models: Qwen2.5 for chat and QwQ for reasoning.

      Qwen3 put both behaviors in one checkpoint. End a message with `/think` and the model writes its reasoning inside a `<think>` block before answering. End it with `/no_think` and the block comes back empty and the answer starts at once. Thinking is the default.

      Pin the object: the **Qwen3 Technical Report, revision 1 (May 14, 2025)**, describing the original release. Later date-suffixed Qwen3 updates changed the interface, so check their cards separately.
    bridges: []
  - id: qwen-three-case-study.s2
    title: Six dense models, two MoEs
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.qwen-three-case-study
    markdown: |-
      The report lists six dense models (0.6B to 32B) and two mixtures of experts. Four of them, from the report's Tables 1–2 and the released configs:

      | | Qwen3-8B | Qwen3-32B | Qwen3-30B-A3B | Qwen3-235B-A22B |
      | --- | ---: | ---: | ---: | ---: |
      | Layers | 36 | 64 | 48 | 94 |
      | Width | 4,096 | 5,120 | 2,048 | 4,096 |
      | Query / KV heads | 32 / 8 | 64 / 8 | 32 / 4 | 64 / 4 |
      | Experts (total / chosen) | dense | dense | 128 / 8 | 128 / 8 |
      | Parameters (total / active) | 8.2B | 32.8B | 30.5B / 3.3B | 235B / 22B |
      | Context | 128K | 128K | 128K | 128K |

      Every model was pretrained on about **36 trillion tokens** in 119 languages and dialects, in three stages: over 30T general tokens at 4,096 context, about 5T tokens weighted toward STEM, code, and reasoning, then hundreds of billions of tokens at 32,768 context. YaRN, a RoPE rescaling method, stretches that 32K to 128K at inference.

      Notable choices: QK-Norm in attention for stable training, a 151,669-token byte-level BPE vocabulary, and, unlike DeepSeek's MoEs, **no shared expert**. Every expert is routed, and a load-balancing loss computed over the whole global batch, rather than each small batch, keeps load even while letting experts specialize.
    bridges: []
  - id: qwen-three-case-study.s5
    title: The big MoE caches less than the dense 32B
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.qwen-three-case-study
    markdown: |-
      :::predict Which grows its KV cache faster per token, the 235B MoE or the dense 32B?
      The dense 32B: 2 × 64 layers × 8 KV heads × 128 × 2 bytes = 256 KiB, against 2 × 94 × 4 × 128 × 2 = 188 KiB for the 235B. Halving the KV heads outweighs having 47% more layers. Expert count doesn't enter the cache at all: experts live in the feed-forward layers, and only attention is cached.
      :::

      The calculator applies the parameter accounting from the lesson on counting MoE parameters: total parameters set memory, and active parameters set compute per token.

      ```python run
      # Qwen3 model sheet: (layers, width, q heads, kv heads, FFN or expert width, experts, chosen)
      models = {"Qwen3-32B":       (64, 5120, 64, 8, 25600, 1, 1),
                "Qwen3-30B-A3B":   (48, 2048, 32, 4, 768, 128, 8),
                "Qwen3-235B-A22B": (94, 4096, 64, 4, 1536, 128, 8)}
      vocab, hd, D = 151936, 128, 36e12            # head width 128 in every config; 36T tokens

      for name, (L, d, q, kvh, ffn, E, k) in models.items():
          attn = 2 * d * q * hd + 2 * d * kvh * hd
          expert = 3 * d * ffn
          router = d * E if E > 1 else 0
          total = L * (attn + E * expert + router) + 2 * vocab * d
          active = L * (attn + k * expert + router) + 2 * vocab * d
          kv = 2 * L * kvh * hd * 2
          print(f"{name:16s} total {total / 1e9:5.1f}B  active {active / 1e9:5.2f}B | "
                f"bf16 {total * 2 / 1e9:3.0f} GB  fp8 {total / 1e9:3.0f} GB | "
                f"KV {kv / 1024:3.0f} KiB/token | 6ND {6 * active * D:.1e}")
      ```

      Three things to read off. The 30B-A3B needs 61 GB of bf16 weights even though each token touches only 3.35B of them. The flagship's pretraining (6ND with the 22B *active* count) comes to about 4.8 × 10²⁴ FLOPs, less than the dense 32B's 7.1 × 10²⁴. And the report gives no GPU-hours, so unlike Llama 3 or DeepSeek-V3, there's no reported figure to check these against. Label them computed, and the true cost unknown.

      Change the 235B's last number from 8 to 128 to see what running every expert would cost.
    bridges: []
  - id: qwen-three-case-study.s3
    title: Four stages to build the switch
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.qwen-three-case-study
    markdown: |-
      The two flagships, 235B-A22B and 32B, went through four post-training stages:

      1. **Long chain-of-thought cold start.** A small SFT set of verified reasoning traces generated by QwQ-32B, filtered for correct answers and no language mixing. The report keeps it deliberately small.
      2. **Reasoning RL.** GRPO, from the lesson on group-relative policy learning, on 3,995 query–verifier pairs. The 235B's AIME'24 score rose from 70.1 to 85.1 over 170 RL steps.
      3. **Thinking mode fusion.** More SFT on a mix of thinking examples (rejection-sampled from the stage-2 model) and non-thinking examples, each marked `/think` or `/no_think`.
      4. **General RL.** Over 20 tasks scored by rules, by a model comparing against a reference answer, or by a reward model trained on preferences.

      Stages 1–2 build the reasoning; stages 3–4 add the direct mode and general behavior.
    diagram:
      caption: Qwen3 post-training. Flagships take four stages; smaller models are distilled from them.
      description: A base model goes through a long chain-of-thought cold start, then reasoning RL with GRPO, then thinking mode fusion, then general RL, producing the flagship models Qwen3-235B-A22B and Qwen3-32B. The flagships act as teachers for strong-to-weak distillation, which turns smaller base models into the lightweight Qwen3 models from 0.6B to 14B plus 30B-A3B.
      nodes:
        - id: base
          label: Base model
          col: 0
          row: 0
          tone: muted
        - id: cold
          label: 1. Long-CoT cold start
          note: small SFT set
          col: 1
          row: 0
        - id: rl
          label: 2. Reasoning RL
          note: GRPO, 3,995 problems
          col: 2
          row: 0
        - id: fusion
          label: 3. Thinking mode fusion
          note: SFT with /think and /no_think
          col: 3
          row: 0
        - id: general
          label: 4. General RL
          note: 20+ tasks
          col: 4
          row: 0
        - id: flagship
          label: Flagships
          note: 235B-A22B and 32B
          col: 4
          row: 1
          tone: accent
        - id: small
          label: Lightweight models
          note: 0.6B–14B and 30B-A3B
          col: 2
          row: 1
          tone: data
      edges:
        - from: base
          to: cold
        - from: cold
          to: rl
        - from: rl
          to: fusion
        - from: fusion
          to: general
        - from: general
          to: flagship
        - from: flagship
          to: small
          label: strong-to-weak distillation
    bridges: []
  - id: qwen-three-case-study.s4
    title: The mode switch is a template contract
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.qwen-three-case-study
    markdown: |-
      Fusion only works if requests are formatted like the training data. In the released chat template, a non-thinking reply always contains an *empty* `<think></think>` block. Hugging Face's version of the template can insert that empty block for you (`enable_thinking=False`). Drop it and you send the model a format it never saw.

      The report also describes a **thinking budget**: when the reasoning reaches a token limit you set, your code stops it, inserts a fixed instruction ("Considering the limited time by the user, I have to give the solution based on the thinking directly now.") and closes the block, and the model answers from its partial reasoning. The report notes this ability wasn't trained directly; it emerged from fusion.

      For the tutor: `/no_think` for lookups, thinking with a budget for proofs. Measure accuracy *and* tokens per request for each, since thinking tokens cost time and money like any others.

      :::mixup "Thinking mode is a different model, or at least a different set of weights."
      Same checkpoint. Only the flag and the think block's contents differ, so both modes share one deployment and one memory footprint.
      :::
    bridges: []
  - id: qwen-three-case-study.s6
    title: Distilling the small models cost a tenth
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.qwen-three-case-study
    markdown: |-
      The lightweight models skipped the four stages. They used **strong-to-weak distillation** in two phases. First, *off-policy*: fine-tune on teacher outputs in both modes. Then *on-policy*: the student writes its own responses, and training pulls its token probabilities (logits) toward those of Qwen3-32B or 235B-A22B on the same text, minimizing their KL divergence.

      The report tested this against RL, starting both from the same off-policy Qwen3-8B checkpoint:

      | From the same 8B start | AIME'24 | GPU-hours |
      | --- | ---: | ---: |
      | + reinforcement learning | 67.6 | 17,920 |
      | + on-policy distillation | 74.4 | 1,800 |

      Higher score for about a tenth of the compute. That matches what DeepSeek found with R1's students, in the lesson on distilling reasoning.

      This is also why comparing family members needs care. If Qwen3-32B beats 30B-A3B, they differ in active size, architecture, *and* recipe (four stages versus distillation). The table above is a clean comparison because only the method changed.
    bridges: []
  - id: qwen-three-case-study.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.qwen-three-case-study
    markdown: Size Qwen3's dense and MoE models, then advise a tutoring app, a GPU-limited team, and a lab choosing between RL and distillation.
    takeaway: |-
      Qwen3 packs thinking and non-thinking modes into one checkpoint through a four-stage recipe and a chat-template contract. For its MoEs, total parameters set memory, active parameters set compute, and KV heads set the cache.
  - id: qwen-three-case-study.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.qwen-three-case-study
    markdown: |-
      The original Qwen3 family includes different architectures and adaptation recipes. Compare exact checkpoints and supported modes using the full generation and memory budgets.
