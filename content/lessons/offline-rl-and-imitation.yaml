assessment_families:
  - id: offline-rl-and-imitation.base
    objective_ref: objective.offline-rl-and-imitation
    task: base
    response_type: single_choice
    points: 1
    hint: 'Respect missing alternatives: trace the inputs, operation, and result before choosing.'
    remediation_scene: offline-rl-and-imitation.s2
    variants:
      - id: offline-rl-and-imitation.base.1
        prompt: What does behavior cloning directly fit?
        options:
          - id: c
            text: A guaranteed optimal policy
          - id: a
            text: Recorded action choices from observations
          - id: b
            text: Every possible counterfactual reward
        answer: a
        feedback: It is supervised imitation of the data’s behavior.
        retired: true
      - id: offline-rl-and-imitation.base.2
        prompt: Why are rarely observed actions difficult in offline RL?
        options:
          - id: a
            text: Their consequences and values may be unsupported by data
          - id: b
            text: They are mathematically forbidden in every environment
          - id: c
            text: They always have zero reward
        answer: a
        feedback: Coverage limits reliable estimation.
        retired: true
  - id: offline-rl-and-imitation.transfer
    objective_ref: objective.offline-rl-and-imitation
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Constrain real-world learning: trace the inputs, operation, and result before choosing.'
    remediation_scene: offline-rl-and-imitation.s4
    variants:
      - id: offline-rl-and-imitation.transfer.1
        prompt: How can a small imitation error compound?
        options:
          - id: a
            text: It can move the policy into unfamiliar states
          - id: b
            text: It necessarily corrects all later errors
          - id: c
            text: It deletes the environment state
        answer: a
        feedback: Distribution shift changes future decisions.
        retired: true
      - id: offline-rl-and-imitation.transfer.2
        prompt: Does high offline value estimation establish safe unrestricted exploration?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only for a neural policy
          - id: a
            text: 'No'
        answer: a
        feedback: Evaluation evidence and operational constraints remain separate.
        retired: true
  - id: offline-rl-and-imitation.base.v2
    objective_ref: objective.offline-rl-and-imitation
    task: base
    response_type: single_choice
    points: 1
    hint: Ask which states or actions are missing from the data, and which method adds labels for them or refuses to trust them.
    remediation_scene: offline-rl-and-imitation.s3
    variants:
      - id: offline-rl-and-imitation.base.v2.1
        prompt: A cloned driving policy matches the human 99% of the time on held-out demonstration frames, yet it often ends up hugging the wall on real runs. What is the best explanation?
        options:
          - id: b
            text: The held-out frames were too similar, so 99% overstates accuracy
          - id: a
            text: After one slip it meets states the demonstrations never showed
          - id: c
            text: The human driver made mistakes that the clone copied exactly
        answer: a
        feedback: The 99% is measured on states the expert visited. Once the clone drifts, it sees states with no training examples, errs more, and drifts further. That's compounding distribution shift, not a measurement flaw or copied expert errors.
      - id: offline-rl-and-imitation.base.v2.2
        prompt: What does DAgger add to behavior cloning?
        options:
          - id: a
            text: Expert labels for the states the learner itself visits
          - id: b
            text: A reward model that scores the demonstrations
          - id: c
            text: A larger network trained on the same demonstrations
        answer: a
        feedback: DAgger runs the learner, asks the expert what to do in the states it reached, and retrains on the combined data. It needs no rewards, and a bigger network still has no examples of the drifted states.
      - id: offline-rl-and-imitation.base.v2.3
        prompt: In offline Q-learning, an action that never appears in the logs for some state gets a high Q-value. Why is that dangerous?
        options:
          - id: c
            text: Unlogged actions have zero reward, so a high value is a bug
          - id: b
            text: High values slow down training because the targets are larger
          - id: a
            text: The max in the target picks it, and no data can correct the guess
        answer: a
        feedback: The network's number for an unseen action is an extrapolation. The max selects it, and without new interaction nothing ever shows it is wrong. Unlogged actions aren't known to have zero reward; their value is simply unknown.
      - id: offline-rl-and-imitation.base.v2.4
        prompt: What does the CQL penalty do to Q-values during training?
        options:
          - id: a
            text: Pushes down high values overall and pushes up the logged actions' values
          - id: b
            text: Pushes all values toward zero so that no single action can dominate
          - id: c
            text: Raises the values of unlogged actions so that they get explored
        answer: a
        feedback: The soft-max term lowers whichever actions score highest, and subtracting the data's Q raises the logged actions, so unsupported actions stop winning. CQL is about caution, not uniform shrinking or extra exploration.
  - id: offline-rl-and-imitation.transfer.v2
    objective_ref: objective.offline-rl-and-imitation
    task: transfer
    response_type: single_choice
    points: 1
    hint: Check what the data contains (actions only, or rewards too), whether an expert can label new states, and whether a mistake during learning would be costly.
    remediation_scene: offline-rl-and-imitation.s4
    variants:
      - id: offline-rl-and-imitation.transfer.v2.1
        prompt: A hospital has years of records of treatments and patient outcomes, and wants a policy that does better than past practice. Trying random treatments is out of the question. Which approach fits?
        options:
          - id: b
            text: Behavior cloning, to copy what doctors did most often
          - id: a
            text: Conservative offline RL that stays close to logged treatments
          - id: c
            text: Online Q-learning with small ε to limit random treatments
        answer: a
        feedback: The goal is to improve on the logs using outcomes as rewards, without new exploration, and conservatism avoids trusting treatments rarely given. Cloning only matches past practice; any online exploration means experimenting on patients.
      - id: offline-rl-and-imitation.transfer.v2.2
        prompt: A lane-keeping car trained by behavior cloning drifts toward the edge in curves. Instructors are available to sit in the car. What should the team do next?
        options:
          - id: a
            text: Let the car drive and have instructors label the right steering
          - id: b
            text: Record more instructors driving the same routes as before
          - id: c
            text: Add a reward for staying centered and retrain the clone on it
        answer: a
        feedback: That's DAgger. The car's own drifting states get expert labels, which is exactly the missing data. More instructor driving covers the same centered states, and behavior cloning doesn't use rewards.
      - id: offline-rl-and-imitation.transfer.v2.3
        prompt: A chess engine is trained only by behavior cloning on club players' games. What limits how strong it can become?
        options:
          - id: c
            text: Chess positions are too varied for supervised learning to work
          - id: a
            text: It learns to imitate the players, including their weaker moves
          - id: b
            text: Club games contain too few captures for the network to learn
        answer: a
        feedback: Cloning aims to act like the demonstrators, so it inherits their level. Using game results as rewards (offline RL) or self-play is how an engine can surpass its data. Supervised learning handles varied positions well.
      - id: offline-rl-and-imitation.transfer.v2.4
        prompt: A delivery robot's offline-trained policy scores well on logged data. Before it drives near loading docks with real drops, what should stay outside the learned policy?
        options:
          - id: a
            text: A hard stop triggered by the drop sensor that overrides the policy
          - id: b
            text: A reward penalty for drops that the policy can weigh up
          - id: c
            text: A second offline policy that votes on each action
        answer: a
        feedback: Safety limits that must never be traded off belong outside the learner. A reward penalty can still be outweighed by other rewards, and a second learned policy trained on the same logs shares the same blind spots.
  - id: offline-rl-and-imitation.calculate
    objective_ref: objective.offline-rl-and-imitation
    task: base
    response_type: numeric
    points: 1
    hint: Each step is error-free with probability 1 − ε, and a whole run needs every step to be error-free, so raise (1 − ε) to the power T.
    remediation_scene: offline-rl-and-imitation.s3
    absolute_tolerance: 0.005
    variants:
      - id: offline-rl-and-imitation.calculate.1
        prompt: A cloned policy errs independently with probability 0.01 at each of 100 steps. What is the probability that a run has no errors at all? Give three decimal places.
        answer: 0.366
        feedback: 0.99^100 ≈ 0.366. About two runs in three contain at least one slip.
      - id: offline-rl-and-imitation.calculate.2
        prompt: A cloned policy errs independently with probability 0.02 at each of 50 steps. What is the probability that a run has no errors at all? Give three decimal places.
        answer: 0.364
        feedback: 0.98^50 ≈ 0.364. Doubling the error rate and halving the length gives almost the same answer as 1% over 100 steps.
      - id: offline-rl-and-imitation.calculate.3
        prompt: A cloned policy errs independently with probability 0.05 at each of 20 steps. What is the probability that a run has no errors at all? Give three decimal places.
        answer: 0.358
        feedback: 0.95^20 ≈ 0.358.
      - id: offline-rl-and-imitation.calculate.4
        prompt: A cloned policy errs independently with probability 0.01 at each of 50 steps. What is the probability that a run has no errors at all? Give three decimal places.
        answer: 0.605
        feedback: 0.99^50 ≈ 0.605. Shorter episodes give fewer chances to slip.
      - id: offline-rl-and-imitation.calculate.5
        prompt: A cloned policy errs independently with probability 0.001 at each of 1,000 steps. What is the probability that a run has no errors at all? Give three decimal places.
        answer: 0.368
        feedback: 0.999^1000 ≈ 0.368. A tiny error rate still leaves most long runs with a slip.
