schema_version: 0.2-draft
lesson:
  id: offline-rl-and-imitation
  version: 0.3.0-draft
  title: Learn from recorded decisions without assuming safe exploration
  state: draft
  summary: Learn from recorded actions while noticing what the recordings leave out.
  slot: M24.8
  category: learning
  sources:
  - title: Offline Reinforcement Learning
    url: https://arxiv.org/abs/2005.01643
  - title: DAgger
    url: https://arxiv.org/abs/1011.0686
objectives:
- id: objective.offline-rl-and-imitation
  version: 1-draft
  statement: Offline RL and imitation learn from existing behavior data with different objectives; action coverage,
    distribution shift, reward design, and deployment constraints limit what can be inferred or safely improved.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - offline-rl-and-imitation.base
  - offline-rl-and-imitation.transfer
  prerequisites:
  - anyOf:
    - objective.policy-gradients-and-actor-critic
  - anyOf:
    - objective.model-based-and-partially-observed-rl
scenes:
- id: offline-rl-and-imitation.s1
  title: Differentiate imitation from reward optimization
  type: explanation
  depth: intuition
  objective_refs:
  - objective.offline-rl-and-imitation
  markdown: Behavior cloning predicts recorded actions from observations as a supervised task. Offline RL uses
    a fixed dataset to improve a reward-based policy. Demonstrations may not include optimal actions, while
    a reward signal may not fully capture the desired behavior.
  text_mode: Behavior cloning predicts recorded actions from observations as a supervised task. Offline RL
    uses a fixed dataset to improve a reward-based policy. Demonstrations may not include optimal actions,
    while a reward signal may not fully capture the desired behavior.
  bridges: []
- id: offline-rl-and-imitation.s2
  title: Respect missing alternatives
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.offline-rl-and-imitation
  markdown: If a dataset contains almost no examples of action B in a state region, estimated value for B may
    be unreliable. A policy optimized against that estimate can choose unsupported actions. Offline methods
    often constrain policy shift or penalize uncertain values, with assumptions that must be stated.
  text_mode: If a dataset contains almost no examples of action B in a state region, estimated value for B
    may be unreliable. A policy optimized against that estimate can choose unsupported actions. Offline methods
    often constrain policy shift or penalize uncertain values, with assumptions that must be stated.
  bridges: []
- id: offline-rl-and-imitation.s3
  title: Expect compounding distribution shift
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.offline-rl-and-imitation
  markdown: 'A cloned policy’s small mistake can lead to states absent from expert demonstrations, where further
    mistakes become more likely. Interactive data aggregation can address this when additional expert interaction
    is feasible. A fixed offline dataset cannot automatically supply labels for every newly visited state.


    A driving demonstration may contain many centered-lane images and almost no images near the curb. A copied
    steering policy that drifts toward the curb now sees unfamiliar inputs. DAgger, short for dataset aggregation,
    gathers expert action labels for states visited by the learner and adds them to training. This requires
    new interaction and expert help; it is not a method that can create those labels from an unchanged offline
    dataset.'
  text_mode: 'A cloned policy’s small mistake can lead to states absent from expert demonstrations, where further
    mistakes become more likely. Interactive data aggregation can address this when additional expert interaction
    is feasible. A fixed offline dataset cannot automatically supply labels for every newly visited state.


    A driving demonstration may contain many centered-lane images and almost no images near the curb. A copied
    steering policy that drifts toward the curb now sees unfamiliar inputs. DAgger, short for dataset aggregation,
    gathers expert action labels for states visited by the learner and adds them to training. This requires
    new interaction and expert help; it is not a method that can create those labels from an unchanged offline
    dataset.'
  bridges: []
- id: offline-rl-and-imitation.s4
  title: Constrain real-world learning
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.offline-rl-and-imitation
  markdown: Exploration in physical or consequential environments needs appropriate boundaries, monitoring,
    and recovery. Evaluate reward misspecification and simulator-to-real gaps before deployment. A high offline
    estimate or imitation accuracy is evidence under a protocol, not permission to try arbitrary actions in
    the world.
  text_mode: Exploration in physical or consequential environments needs appropriate boundaries, monitoring,
    and recovery. Evaluate reward misspecification and simulator-to-real gaps before deployment. A high offline
    estimate or imitation accuracy is evidence under a protocol, not permission to try arbitrary actions in
    the world.
  bridges: []
- id: offline-rl-and-imitation.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.offline-rl-and-imitation
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Imitation learns recorded actions; offline RL uses recorded experience to improve a reward-based
    policy. Both must account for missing actions and unfamiliar states.
- id: offline-rl-and-imitation.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.offline-rl-and-imitation
  markdown: Imitation learns recorded actions; offline RL uses recorded experience to improve a reward-based
    policy. Both must account for missing actions and unfamiliar states.
  text_mode: Imitation learns recorded actions; offline RL uses recorded experience to improve a reward-based
    policy. Both must account for missing actions and unfamiliar states.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - offline-rl-and-imitation.s1
    - offline-rl-and-imitation.s2
    - offline-rl-and-imitation.s3
