assessment_families:
- id: offline-rl-and-imitation.base
  objective_ref: objective.offline-rl-and-imitation
  task: base
  response_type: single_choice
  points: 1
  hint: 'Respect missing alternatives: trace the inputs, operation, and result before choosing.'
  remediation_scene: offline-rl-and-imitation.s2
  variants:
  - id: offline-rl-and-imitation.base.1
    prompt: What does behavior cloning directly fit?
    options:
    - id: c
      text: A guaranteed optimal policy
    - id: a
      text: Recorded action choices from observations
    - id: b
      text: Every possible counterfactual reward
    answer: a
    feedback: It is supervised imitation of the data’s behavior.
  - id: offline-rl-and-imitation.base.2
    prompt: Why are rarely observed actions difficult in offline RL?
    options:
    - id: a
      text: Their consequences and values may be unsupported by data
    - id: b
      text: They are mathematically forbidden in every environment
    - id: c
      text: They always have zero reward
    answer: a
    feedback: Coverage limits reliable estimation.
- id: offline-rl-and-imitation.transfer
  objective_ref: objective.offline-rl-and-imitation
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Constrain real-world learning: trace the inputs, operation, and result before choosing.'
  remediation_scene: offline-rl-and-imitation.s4
  variants:
  - id: offline-rl-and-imitation.transfer.1
    prompt: How can a small imitation error compound?
    options:
    - id: a
      text: It can move the policy into unfamiliar states
    - id: b
      text: It necessarily corrects all later errors
    - id: c
      text: It deletes the environment state
    answer: a
    feedback: Distribution shift changes future decisions.
  - id: offline-rl-and-imitation.transfer.2
    prompt: Does high offline value estimation establish safe unrestricted exploration?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only for a neural policy
    - id: a
      text: 'No'
    answer: a
    feedback: Evaluation evidence and operational constraints remain separate.
