schema_version: 0.2-draft
lesson:
  id: offline-rl-and-imitation
  version: 0.4.0-draft
  title: Learn from recorded decisions without assuming safe exploration
  state: draft
  summary: You can't let a new robot learn by tumbling down the stairs. Learn from recorded driving instead, and discover why copying an expert drifts and how offline RL stays cautious.
  slot: M24.8
  category: learning
  sources:
    - title: "Offline Reinforcement Learning: Tutorial, Review, and Perspectives on Open Problems (Levine et al., 2020)"
      url: https://arxiv.org/abs/2005.01643
    - title: "A Reduction of Imitation Learning and Structured Prediction to No-Regret Online Learning (DAgger; Ross, Gordon & Bagnell, 2011)"
      url: https://arxiv.org/abs/1011.0686
    - title: "Conservative Q-Learning for Offline Reinforcement Learning (Kumar et al., 2020)"
      url: https://arxiv.org/abs/2006.04779
objectives:
  - id: objective.offline-rl-and-imitation
    version: 2-draft
    statement: Offline RL and imitation learn from logged behavior; gaps in that data and shifts at deployment limit how far you can safely improve on it.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - offline-rl-and-imitation.base.v2
      - offline-rl-and-imitation.transfer.v2
      - offline-rl-and-imitation.calculate
    prerequisites:
      - anyOf:
          - objective.policy-gradients-and-actor-critic
      - anyOf:
          - objective.model-based-and-partially-observed-rl
scenes:
  - id: offline-rl-and-imitation.s1
    title: Learn from the logs, not from falling down the stairs
    type: explanation
    depth: intuition
    objective_refs:
      - objective.offline-rl-and-imitation
    markdown: |-
      Every method so far learned by trying things. That's fine in a simulator, not at the top of real stairs, where one exploratory "forward" breaks the robot. But Pip's maker has a lot of recorded data: thousands of hours of staff steering robots by remote control, plus logs from older robots running a hand-written cleaning rule, with their rewards.

      Two families of methods learn from data like this without new trial and error: **behavior cloning (BC)** and **offline RL**.

      | | Behavior cloning | Offline RL |
      | --- | --- | --- |
      | Learns from | Expert (state, action) pairs | Logged (state, action, reward, next state) |
      | Needs rewards? | No | Yes |
      | Goal | Act like the demonstrator | Do better than the logged behavior |
      | Main risk | Drifting into states the expert never visited | Trusting values for actions the logs never tried |

      Behavior cloning is plain supervised learning: the input is what the robot saw, the label is what the human did. Dean Pomerleau's ALVINN at Carnegie Mellon (first published in 1989) learned to steer a van from camera images, and its later versions learned by watching a human drive.

      Offline RL runs this module's Bellman ideas on a fixed dataset, with no way to go and try an action it is curious about.
    bridges: []
  - id: offline-rl-and-imitation.s3
    title: Small slips compound
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.offline-rl-and-imitation
    markdown: |-
      Pip's cloned policy matches the human driver 99% of the time on states like those in the demonstrations. That sounds like one mistake per 100 steps. It's worse, because of what happens *after* a mistake. The humans always drove down the middle of the hallway, so the data contains almost no images of Pip half a meter from the wall, pointed at it. After one slip, Pip is in exactly that kind of state, where the clone has never been trained and makes mistakes far more often. The errors feed each other.

      :::predict If each of 100 steps has a 1% chance of error, what fraction of runs is completely error-free?
      $0.99^{100} \approx 0.366$, only about 37%. So most runs contain at least one slip, and every slip may push Pip off the familiar path.
      :::

      The simulation gives the clone a 1% error rate on familiar ground and 30% once it has drifted somewhere unfamiliar.

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      T, runs = 100, 2000
      err_familiar = 0.01      # clone's error rate in states like the demonstrations
      err_strange = 0.30       # error rate once it has drifted somewhere unfamiliar

      def clone_run():
          mistakes, drifted = 0, False
          for t in range(T):
              rate = err_strange if drifted else err_familiar
              if rng.random() < rate:
                  mistakes += 1
                  drifted = True       # one slip puts Pip where no demonstrator ever drove
          return mistakes

      results = np.array([clone_run() for _ in range(runs)])
      print(f"if errors stayed independent: {err_familiar * T:.1f} mistakes per run")
      print(f"with compounding drift:       {results.mean():.1f} mistakes per run")
      print(f"runs with no mistakes at all: {np.mean(results == 0):.0%}")
      ```

      Independent errors would mean 1.0 mistake per run; compounding gives 11.7. Set `err_strange = 0.01` and the gap vanishes. The problem isn't the 1%; it's that the clone never learned to *recover*. This is **distribution shift**: the states the learner visits differ from the states it was trained on.

      :::papers Dataset aggregation (Ross, Gordon & Bagnell, 2011)
      **DAgger** (Dataset Aggregation) fixes this by collecting the missing labels:

      1. Train a policy $\pi_1$ on the expert demonstrations.
      2. Let $\pi_i$ drive, and record the states *it* visits.
      3. Ask the expert what they would have done in each of those states.
      4. Add those (state, expert action) pairs to the dataset and retrain to get $\pi_{i+1}$. Repeat.

      Now the data contains "near the wall, pointed at it: turn away". In Ross and Bagnell's analysis, with a per-step error rate $\epsilon$ on the expert's states, a clone's expected mistakes over $T$ steps can grow like $\epsilon T^2$, while DAgger's grow only in proportion to $\epsilon T$. The price: an expert must stay on call to label new states.
      :::
    bridges: []
  - id: offline-rl-and-imitation.s2
    title: Never trust a value nobody measured
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.offline-rl-and-imitation
    markdown: |-
      Offline RL has the mirror-image problem. The old robots' logs at the top of the stairs contain only one action, "turn away", with a well-measured value of about 4. No robot ever drove forward there. But a Q-network outputs a number for *every* action, and for "forward" it might output 7, a guess from similar-looking states elsewhere. Q-learning's target takes the max, so it picks the 7. Nothing in the fixed dataset can correct it, because the only way to learn that forward is terrible is to drive forward. Researchers call this **extrapolation error**.

      The fix is **conservatism**: treat actions the data didn't cover as worse until shown otherwise. **Conservative Q-Learning (CQL)** (Kumar et al., 2020) adds a penalty to the usual TD loss:

      :::papers The CQL penalty
      $$\alpha\; \mathbb{E}_{s \sim \mathcal{D}}\Big[\log \sum_a \exp Q(s, a) \;-\; \mathbb{E}_{a \sim \mathcal{D}}\big[Q(s, a)\big]\Big]$$

      The first term is a soft maximum over *all* actions; the second is the average Q of actions the data actually contains. At the stairs, $\log(e^{4} + e^{7}) \approx 7.05$, and the data's action is worth 4, so the penalty is $7.05 - 4 = 3.05$. Minimizing it pushes Q(forward) down (the soft max puts about 95% of its weight there) and pushes Q(turn away) up. The penalty keeps shrinking as Q(forward) falls below Q(turn away): at forward 1 and turn away 4 it is only $\log(1 + e^{-3}) \approx 0.05$. Meanwhile the usual TD loss holds Q(turn away) near its measured 4.
      :::

      :::mixup "Offline RL can find the best action, even ones the logs never tried."
      It can recombine what the logs contain, for example by stitching the good first half of one route to the good second half of another. It can't learn the value of an action nobody took. Conservative methods deliberately stay near the data for exactly this reason.
      :::
    bridges: []
  - id: offline-rl-and-imitation.s4
    title: Take the new policy out carefully
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.offline-rl-and-imitation
    markdown: |-
      Suppose Pip's offline-trained policy looks excellent on the logged data. The team still does three things before it cleans a real home.

      - **Check the reward.** The logs scored "floor area cleaned per minute." Read the best-scoring logged runs. If they include robots bumping furniture at full speed, the reward is paying for recklessness, and a stronger optimizer will find that faster.
      - **Keep hard limits outside the learner.** A cliff sensor that stops the wheels at the stairs isn't something the policy gets to trade off against reward. It overrides the policy.
      - **Roll out in stages.** First run the policy in the simulator, then in a test flat with staff watching, then in a small share of homes with the old rule as a fallback. Compare each stage with the one before, and collect the new states Pip visits, the ones the logs lacked, for the next round of training.

      Offline data gives a good starting policy without dangerous exploration; earning trust still takes careful, limited real-world experience.
    bridges: []
  - id: offline-rl-and-imitation.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.offline-rl-and-imitation
    markdown: Compute how often small errors stay small, then choose between cloning, DAgger, and conservative offline RL for a lane-keeping car, a hospital's treatment logs, and a chess engine.
    takeaway: |-
      Behavior cloning copies an expert but drifts into states the expert never showed it; DAgger adds expert labels for those states. Offline RL can improve on logged behavior, but only by staying conservative about actions the data never tried.
  - id: offline-rl-and-imitation.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.offline-rl-and-imitation
    markdown: |-
      Imitation learns recorded actions; offline RL uses recorded experience to improve a reward-based policy. Both must account for missing actions and unfamiliar states.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - offline-rl-and-imitation.s1
        - offline-rl-and-imitation.s3
        - offline-rl-and-imitation.s2
