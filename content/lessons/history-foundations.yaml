schema_version: 0.2-draft
lesson:
  id: history-foundations
  version: 0.4.0-draft
  title: AI grew from several older questions
  state: draft
  summary: Long before anyone said "artificial intelligence," people had worked out how to reason with rules, weigh odds, and build machines that correct themselves. Meet the old ideas every AI system still borrows.
  slot: M01.1
  category: learning
  sources:
    - title: Wiener — Cybernetics, first published 1948
      url: https://mitpress.mit.edu/9780262537841/cybernetics-or-control-and-communication-in-the-animal-and-the-machine/
    - title: Buchanan — A (Very) Brief History of Artificial Intelligence
      url: https://ojs.aaai.org/aimagazine/index.php/aimagazine/article/view/1848/0
    - title: Turing — Computing Machinery and Intelligence (1950)
      url: https://www.csee.umbc.edu/courses/471/papers/turing.pdf
  archetype: perspective
objectives:
  - id: objective.history-foundations
    version: 3-draft
    statement: Distinguish logical deduction, uncertainty, feedback control, and learning as contributions to the foundations of AI.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - history-foundations.base.v3
      - history-foundations.transfer.v3
    prerequisites:
      - anyOf:
          - objective.ai-traditions
scenes:
  - id: history-foundations.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.history-foundations
    title: Five questions a greenhouse heater must answer
    markdown: |-
      It's a frosty night, and a greenhouse of tomato seedlings must stay above 50 °F until morning. You wire up a heater, a thermometer, and a little controller. The controller must answer five questions, and each was studied long before computers existed:

      | The controller asks | The idea that answers it | An early landmark |
      | --- | --- | --- |
      | "It's 49 °F. What follows?" | **Logic**: drawing conclusions | George Boole (1854) |
      | "What steps do I run?" | **Algorithms**: exact procedures | Alan Turing (1936) |
      | "Can I trust this reading?" | **Probability**: measuring doubt | Thomas Bayes (published 1763) |
      | "Did that work?" | **Feedback**: measure, then adjust | Norbert Wiener (1948) |
      | "Can I do better tomorrow?" | **Learning**: improve the rule | Donald Hebb (1949) |

      Nobody called this artificial intelligence; that name arrived in 1955. Yet every AI system in this course mixes these five ideas. Let's walk the greenhouse through each.
    bridges: []
  - id: history-foundations.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.history-foundations
    title: Perfect logic, broken thermometer
    markdown: |-
      In 1854 George Boole, a largely self-taught mathematics professor in Cork, Ireland, wrote reasoning with *and*, *or*, and *not* as algebra on two values, 1 and 0. In 1937 a 21-year-old MIT student, Claude Shannon, showed that switching circuits follow that same algebra. Every digital chip since runs on it.

      Here is the greenhouse rule as logic:

      - **Rule:** if the temperature is below 50 °F, switch the heater on.
      - **Fact:** the thermometer reads 44 °F.
      - **Conclusion:** switch the heater on.

      The conclusion follows perfectly. Now suppose it's a sunny afternoon, the greenhouse is really 70 °F, and the thermometer is stuck at 44 °F. The same flawless reasoning cooks the seedlings.

      :::mixup "If the reasoning is logically correct, the conclusion must be true."
      Logic promises only that the conclusion follows *from the facts given*. A **valid** argument fed a false fact reaches a false conclusion. When a rule-based system misbehaves, check the facts going in before blaming the rules.
      :::
    bridges: []
  - id: history-foundations.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.history-foundations
    title: A procedure can exist and still be too slow
    markdown: |-
      The controller's job as a procedure: read the thermometer, compare with 50 °F, switch, wait ten minutes, repeat. An **algorithm** is exactly this: a finite list of unambiguous steps. In 1936 Alan Turing, in his early twenties at Cambridge, defined precisely what such procedures can do, using an imaginary machine that reads and writes symbols on a tape. He also proved that some well-posed questions have no algorithm at all.

      A correct algorithm can still be hopeless in practice. Say you want the cheapest heating schedule for a 12-hour night, choosing *on* or *off* for each half hour: 24 choices, so 2²⁴ = 16,777,216 schedules. Checking a million per second takes about 17 seconds.

      :::predict Now use quarter-hour slots: 48 choices instead of 24. How long does the same check take?
      About 9 years. 2⁴⁸ is about 281 trillion schedules: doubling the choices *squared* the count (2⁴⁸ = 2²⁴ × 2²⁴). This runaway growth is called the **combinatorial explosion**, and it's one of the main reasons AI hit a wall in the 1970s.
      :::
    bridges: []
  - id: history-foundations.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.history-foundations
    title: How far should you trust one thermometer?
    markdown: |-
      Thermometers fail. Suppose this model gives a wildly wrong reading about 1 time in 10. A **probability** is a number from 0 to 1 saying how likely something is; here, 0.1.

      Probability lets you reason about a fix: add a second thermometer, and act only when the two agree.

      :::predict Each thermometer is wrong 1 time in 10, and their failures have nothing to do with each other. How often are both wrong at once?
      0.1 × 0.1 = 0.01, so about 1 time in 100: ten times better than one sensor.
      :::

      The catch is "nothing to do with each other," which statisticians call **independence**. If both thermometers hang in the same patch of sun, they fail *together*, and the second adds little. Many probability mistakes come from assuming independence that isn't there.

      Updating a belief from evidence goes back to Thomas Bayes, whose essay his friend Richard Price published in 1763, two years after Bayes died. You'll use Bayes' rule in the probability module.
    bridges: []
  - id: history-foundations.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.history-foundations
    markdown: Eight situations, from cruise control and a smart sprinkler to a fraud alert and a robot vacuum, ask you to tell logic, algorithms, probability, feedback, and learning apart.
    takeaway: |-
      Logic draws conclusions, algorithms spell out steps, probability measures doubt, feedback corrects the next action, and learning changes the rule itself. Most AI systems use several of these at once.
  - id: history-foundations.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.history-foundations
    markdown: |-
      Logic, computation, statistics, neuroscience, and feedback control contributed different questions and tools to AI; no single tradition explains the whole field.
  - id: history-foundations.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.history-foundations
    title: Feedback steers, but it doesn't improve
    markdown: |-
      Our controller already uses **feedback**: it measures the result of its last action to choose the next one.

      :::story The steersman
      During the Second World War, the MIT mathematician Norbert Wiener worked on aiming anti-aircraft guns at planes whose pilots kept changing course. In 1948 he published *Cybernetics*, named after the Greek word for a ship's steersman. Thermostats, autopilots, and nervous systems, he argued, share one pattern: act, measure the effect, correct.
      :::

      Steering a changing system this way is called **control**. Real heaters are slow, though. Below, the air responds one step *after* each decision, so the greenhouse can dip below 50 °F before the heat arrives.

      ```python run
      COOLING = 0.6   # degrees lost per 10 minutes on this night

      def night(switch_on_at):
          """One cold night in 10-minute steps. Returns the lowest temperature."""
          temp, heater_was_on, lowest = 53.0, False, 53.0
          for step in range(36):
              # Feedback: decide from the latest reading.
              heater_on = temp < switch_on_at or (heater_was_on and temp < switch_on_at + 2)
              # The heater is slow: the air follows the *previous* decision.
              temp = round(temp + (0.8 if heater_was_on else -COOLING), 1)
              heater_was_on = heater_on
              lowest = min(lowest, temp)
          return lowest

      switch_on_at = 50.0
      for n in range(1, 5):
          low = night(switch_on_at)
          print(f"night {n}: heat below {switch_on_at:.1f} °F -> lowest {low:.1f} °F")
          if low < 50:                    # Learning: change the rule itself.
              switch_on_at = round(switch_on_at + (50 - low), 1)
      ```

      Night 1 bottoms out at 48.8 °F. With feedback alone and a fixed rule, every night would repeat that mistake. The last two lines of the loop do something different.
    bridges: []
  - id: history-foundations.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.history-foundations
    title: Learning changes the rule, not just the action
    markdown: |-
      After a night that got too cold, the program *changes its own rule*, raising the switch-on temperature by however far it undershot. Night 1 was 1.2 degrees too cold, so the rule becomes "heat below 51.2 °F," and from night 2 the greenhouse never drops below 50 °F.

      That's the difference between feedback and **learning**. Feedback changes the *action* in response to a reading. Learning changes the *rule* in response to experience. A plain thermostat has plenty of feedback and no learning at all.

      :::try Make the night colder
      Change `COOLING = 0.6` to `0.9`. Night 1 falls to 48.3 °F, and the controller learns to heat below 51.7 °F.
      :::

      In 1949 the Canadian psychologist Donald Hebb proposed that brains learn in a similar spirit: a connection between two neurons strengthens when they are active together. Adjusting connection strengths from experience is still how neural networks learn, as you'll see in the neural-network module.

      Next, meet the people who first tried to put these ideas inside one machine.
    bridges: []
