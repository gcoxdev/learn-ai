assessment_families:
  - id: history-foundations.base
    objective_ref: objective.history-foundations
    task: base
    response_type: single_choice
    points: 1
    hint: 'Uncertainty and adaptation supplied other tools: trace the inputs, operation, and result before choosing.'
    remediation_scene: history-foundations.s2
    variants:
      - id: history-foundations.base.1
        prompt: Which tradition directly studies valid relations between statements?
        options:
          - id: b
            text: Only image compression
          - id: c
            text: Only semiconductor manufacturing
          - id: a
            text: Logic
        answer: a
        feedback: Logic formalizes consequence and consistency.
        retired: true
      - id: history-foundations.base.2
        prompt: What makes a system a feedback loop?
        options:
          - id: c
            text: It never measures the environment
          - id: a
            text: Its observations of outcomes influence subsequent actions
          - id: b
            text: It stores a fixed list of outputs only
        answer: a
        feedback: Feedback closes the loop from action through observation to a later action.
        retired: true
  - id: history-foundations.transfer
    objective_ref: objective.history-foundations
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Read history as interacting traditions: trace the inputs, operation, and result before choosing.'
    remediation_scene: history-foundations.s4
    variants:
      - id: history-foundations.transfer.1
        prompt: A thermostat adjusts heat from measured error. Is that alone proof of neural learning?
        options:
          - id: c
            text: Yes; any sensor is a neuron
          - id: a
            text: No; a fixed controller can do this
          - id: b
            text: Yes; every feedback loop trains a network
        answer: a
        feedback: Control and parameter learning are distinct mechanisms.
        retired: true
      - id: history-foundations.transfer.2
        prompt: Why compare historical contributions by the problems they address?
        options:
          - id: a
            text: Different traditions optimize different explanatory and practical goals
          - id: b
            text: All methods have identical assumptions
          - id: c
            text: Dates alone determine scientific validity
        answer: a
        feedback: Problem-based comparison reveals contributions without forcing one linear origin story.
        retired: true
  - id: history-foundations.base.v2
    objective_ref: objective.history-foundations
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: history-foundations.s5
    variants:
      - prompt: A heater rereads room temperature and switches off after warming the room. Its rule stays fixed. What is this?
        answer: a
        options:
          - id: c
            text: Reasoning from a sensor-free proof
          - id: a
            text: Feedback control without learned rule changes
          - id: b
            text: Learning a new rule from each warm reading
        feedback: The result affects the next action, but the control rule itself has not changed.
        id: history-foundations.base.v2.1
        retired: true
      - prompt: A controller repeats its measurement and corrects its action while keeping the same rule. What changes?
        answer: a
        options:
          - id: a
            text: The action responding to the current situation
          - id: b
            text: The stored rule fitted to new examples
          - id: c
            text: The task the controller was built to perform
        feedback: Feedback changes actions in response to observations; that does not by itself imply training.
        id: history-foundations.base.v2.2
        retired: true
      - prompt: A room controller adjusts a stored heating setting after comparing many past outcomes. What has been added?
        answer: a
        options:
          - id: b
            text: A fixed comparison with no setting changes
          - id: c
            text: A conclusion about the room without observations
          - id: a
            text: Learning from experience
        feedback: Changing a stored setting using past outcomes adds learning to the control process.
        id: history-foundations.base.v2.3
        retired: true
      - prompt: A fan uses the latest sensor reading but its settings never change during use. Which claim is supported?
        answer: a
        options:
          - id: c
            text: Its changing actions imply newly learned settings
          - id: a
            text: Its actions can adapt to conditions under a fixed rule
          - id: b
            text: Each sensor reading is a new training step
        feedback: Changing inputs can change actions without changing the stored procedure.
        id: history-foundations.base.v2.4
        retired: true
  - id: history-foundations.transfer.v2
    objective_ref: objective.history-foundations
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: history-foundations.s3
    variants:
      - prompt: A correct heating rule receives an incorrectly high temperature. What should be inspected?
        answer: a
        options:
          - id: c
            text: The number of times the conclusion was repeated
          - id: a
            text: The observation used by the rule
          - id: b
            text: The rule’s conclusion as proof of the actual temperature
        feedback: Valid reasoning does not repair an inaccurate premise.
        id: history-foundations.transfer.v2.1
        retired: true
      - prompt: A deduction follows from a recorded fact, but the record is outdated. What is established?
        answer: a
        options:
          - id: a
            text: The conclusion follows conditionally from that recorded fact
          - id: b
            text: The conclusion verifies that the fact is current
          - id: c
            text: The conclusion makes the missing observation unnecessary
        feedback: Distinguish a valid inference from the truth and currency of its inputs.
        id: history-foundations.transfer.v2.2
        retired: true
      - prompt: Two faulty readings occurred in ten trials. What additional question matters before reusing that frequency?
        answer: a
        options:
          - id: b
            text: Whether the fraction is a written logical rule
          - id: c
            text: Whether the latest reading equals the target temperature
          - id: a
            text: Whether future conditions resemble the trials
        feedback: Observed frequencies need an interpretation and assumptions about future conditions.
        id: history-foundations.transfer.v2.3
        retired: true
      - prompt: A search procedure is precisely described but explores a huge number of possibilities. What remains unresolved?
        answer: a
        options:
          - id: c
            text: Whether a long runtime changes the task definition
          - id: a
            text: Whether it can finish within the available resources
          - id: b
            text: Whether its written steps count as a procedure
        feedback: Specifying an algorithm and making it practical are different achievements.
        id: history-foundations.transfer.v2.4
        retired: true
  - id: history-foundations.base.v3
    objective_ref: objective.history-foundations
    task: base
    response_type: single_choice
    points: 1
    hint: Ask what is changing. A conclusion drawn from facts is logic, an action chosen from a fresh reading is feedback, and a rule rewritten from past results is learning.
    remediation_scene: history-foundations.s6
    variants:
      - id: history-foundations.base.v3.1
        prompt: A car's cruise control reads the speed ten times a second and eases off the throttle whenever the car is above the set speed. Its settings never change. Which idea is it using?
        options:
          - id: a
            text: 'Learning: each reading rewrites its stored rule'
          - id: b
            text: 'Feedback: each reading shapes the next action'
          - id: c
            text: 'Probability: each reading estimates its own error'
        answer: b
        feedback: The measured speed decides the next throttle change, which is feedback. Nothing is learned, because the rule itself (ease off above the set speed) never changes, however many readings arrive.
      - id: history-foundations.base.v3.2
        prompt: 'A smart sprinkler follows the rule "if rain is forecast, don''t water." During a drought its forecast feed gets stuck on "rain," so it stops watering. What went wrong?'
        options:
          - id: a
            text: The rule's logic is invalid, since it led to a bad result
          - id: b
            text: The sprinkler failed to learn from the dry soil
          - id: c
            text: The reasoning was valid, but it was fed a false fact
        answer: c
        feedback: '"Rain is forecast, so don''t water" follows correctly from the fact it received; the fact was wrong. A bad outcome doesn''t make the reasoning invalid, so check the inputs before rewriting the rule.'
      - id: history-foundations.base.v3.3
        prompt: Each morning, a greenhouse controller raises its switch-on temperature by however far the night fell below 50 °F. Which part of its behavior is learning?
        options:
          - id: a
            text: Raising its switch-on temperature after a cold night
          - id: b
            text: Switching the heater on when the air drops below its setting
          - id: c
            text: Reading the thermometer every ten minutes through the night
        answer: a
        feedback: Raising the switch-on point rewrites the rule using past results, which is learning. Switching on below the setting is feedback, a reaction to the current reading under a rule that stays the same.
      - id: history-foundations.base.v3.4
        prompt: Two door sensors each miss an intruder about 1 time in 20, and their failures are independent. The alarm sounds if either one detects. About how often do both miss at once?
        options:
          - id: a
            text: About 1 time in 40
          - id: b
            text: About 1 time in 400
          - id: c
            text: About 1 time in 20
        answer: b
        feedback: For independent failures you multiply, 1/20 × 1/20 = 1/400. Adding the two chances (1 in 40) is the tempting mistake, but it would mean a second sensor makes a miss more likely, not less.
  - id: history-foundations.transfer.v3
    objective_ref: objective.history-foundations
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name the question the system is answering. What follows from these facts? How sure are we? Did the last action work? Should the rule itself change? Is the procedure fast enough to finish?
    remediation_scene: history-foundations.s4
    variants:
      - id: history-foundations.transfer.v3.1
        prompt: 'A bank flags a card purchase that is far outside the customer''s usual pattern, such as a first-ever purchase abroad at 3 a.m. The flag means "worth checking," not "definitely fraud." Which idea does the main work?'
        options:
          - id: a
            text: 'Logic: deducing fraud from facts known for certain'
          - id: b
            text: 'Feedback: correcting the card after every purchase'
          - id: c
            text: 'Probability: judging how unusual the purchase is'
        answer: c
        feedback: The bank is measuring how unlikely the purchase is for this customer, which is probability. It isn't deducing fraud from certain facts, which is why the flag says "worth checking" rather than "fraud."
      - id: history-foundations.transfer.v3.2
        prompt: A weather app's rain forecasts ran too high all spring. Its makers adjust the forecasting model's settings using the spring's actual rainfall. What does this adjustment add?
        options:
          - id: a
            text: 'Learning: the rule changes using past outcomes'
          - id: b
            text: 'Feedback: the next forecast reacts to a new reading'
          - id: c
            text: 'Logic: each forecast follows from stated facts'
        answer: a
        feedback: The model's settings, and so its rule, are changed using past outcomes, which is learning. Feedback would mean reacting to each new reading under the same rule, and that was already happening before the adjustment.
      - id: history-foundations.transfer.v3.3
        prompt: 'Two smoke detectors run off the same power circuit, so a power cut disables both. A salesperson says two detectors make a missed fire "a hundred times less likely" than one. What is the flaw?'
        options:
          - id: a
            text: The math holds; a shared circuit matters only for false alarms
          - id: b
            text: Their failures aren't independent, so multiplying overstates the gain
          - id: c
            text: Two detectors make the gain double, since there are two of them
        answer: b
        feedback: Multiplying the two failure chances assumes the detectors fail independently. A shared circuit makes them fail together, so the real gain is much smaller than a hundredfold.
      - id: history-foundations.transfer.v3.4
        prompt: A robot vacuum's planner finds the shortest cleaning route by trying every possible order of 30 rooms. Its steps are correct, but it never finishes. What does this show?
        options:
          - id: a
            text: The procedure must contain a hidden logical error
          - id: b
            text: The robot needs more feedback from its bump sensors
          - id: c
            text: A correct procedure can still take far too long to run
        answer: c
        feedback: The algorithm is correct; the trouble is the combinatorial explosion in the number of room orders. Adding sensor feedback doesn't shrink the number of orders the planner insists on checking.
