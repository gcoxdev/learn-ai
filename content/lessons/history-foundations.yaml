schema_version: 0.2-draft
lesson:
  id: history-foundations
  version: 0.1.0-draft
  title: AI grew from several older questions
  state: draft
  summary: Logic, computation, statistics, neuroscience, and feedback control contributed different questions and
    tools to AI; no single tradition explains the whole field.
  slot: M01.1
  category: learning
  minutes: 12
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.history-foundations
  version: 1-draft
  statement: Logic, computation, statistics, neuroscience, and feedback control contributed different questions
    and tools to AI; no single tradition explains the whole field.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - history-foundations.base
  - history-foundations.transfer
  prerequisites:
  - anyOf:
    - objective.ai-traditions
scenes:
- id: history-foundations.s1
  title: Before the field had a name
  type: explanation
  depth: intuition
  objective_refs:
  - objective.history-foundations
  markdown: People asked whether reasoning could follow explicit rules, whether machines could execute general procedures,
    and how organisms learn from experience. Formal logic supplied relations between statements. Computability studied
    what procedures can and cannot do. These questions existed before the phrase artificial intelligence became
    a research label.
  text_mode: People asked whether reasoning could follow explicit rules, whether machines could execute general
    procedures, and how organisms learn from experience. Formal logic supplied relations between statements. Computability
    studied what procedures can and cannot do. These questions existed before the phrase artificial intelligence
    became a research label.
  bridges: []
- id: history-foundations.s2
  title: Uncertainty and adaptation supplied other tools
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.history-foundations
  markdown: 'Statistics offered ways to infer patterns from incomplete observations. Neuroscience inspired simplified
    models of interconnected units. Cybernetics studied communication and control in animals and machines, emphasizing
    feedback: an output changes the environment, new observations return, and a controller adjusts its action.'
  text_mode: 'Statistics offered ways to infer patterns from incomplete observations. Neuroscience inspired simplified
    models of interconnected units. Cybernetics studied communication and control in animals and machines, emphasizing
    feedback: an output changes the environment, new observations return, and a controller adjusts its action.'
  bridges: []
- id: history-foundations.s3
  title: Trace one shared problem
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.history-foundations
  markdown: Consider keeping a room near a target temperature. A rule can switch heating on below a threshold. A
    statistical model can predict heat loss. A feedback controller corrects observed error. A learning system can
    adapt its prediction parameters. Similar behavior can therefore arise from different mechanisms and assumptions.
  text_mode: Consider keeping a room near a target temperature. A rule can switch heating on below a threshold.
    A statistical model can predict heat loss. A feedback controller corrects observed error. A learning system
    can adapt its prediction parameters. Similar behavior can therefore arise from different mechanisms and assumptions.
  bridges: []
- id: history-foundations.s4
  title: Read history as interacting traditions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.history-foundations
  markdown: The useful question is not which discipline owned intelligence first, but which problem a contribution
    made easier to formulate or solve. Logical guarantees, predictive accuracy, biological plausibility, and stable
    control are different success criteria. Modern systems combine these traditions and still inherit their unresolved
    questions.
  text_mode: The useful question is not which discipline owned intelligence first, but which problem a contribution
    made easier to formulate or solve. Logical guarantees, predictive accuracy, biological plausibility, and stable
    control are different success criteria. Modern systems combine these traditions and still inherit their unresolved
    questions.
  bridges: []
- id: history-foundations.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.history-foundations
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: history-foundations.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.history-foundations
  markdown: Logic, computation, statistics, neuroscience, and feedback control contributed different questions and
    tools to AI; no single tradition explains the whole field.
  text_mode: Logic, computation, statistics, neuroscience, and feedback control contributed different questions
    and tools to AI; no single tradition explains the whole field.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - history-foundations.s1
    - history-foundations.s2
    - history-foundations.s3
    - history-foundations.s4
    - history-foundations.check
    - history-foundations.recap
    gate_refs:
    - gate.core
assessment_families:
- id: history-foundations.base
  objective_ref: objective.history-foundations
  task: base
  response_type: single_choice
  points: 1
  hint: 'Uncertainty and adaptation supplied other tools: trace the inputs, operation, and result before choosing.'
  remediation_scene: history-foundations.s2
  variants:
  - id: history-foundations.base.1
    prompt: Which tradition directly studies valid relations between statements?
    options:
    - id: b
      text: Only image compression
    - id: c
      text: Only semiconductor manufacturing
    - id: a
      text: Logic
    answer: a
    feedback: Logic formalizes consequence and consistency.
  - id: history-foundations.base.2
    prompt: What makes a system a feedback loop?
    options:
    - id: c
      text: It never measures the environment
    - id: a
      text: Its observations of outcomes influence subsequent actions
    - id: b
      text: It stores a fixed list of outputs only
    answer: a
    feedback: Feedback closes the loop from action through observation to a later action.
- id: history-foundations.transfer
  objective_ref: objective.history-foundations
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Read history as interacting traditions: trace the inputs, operation, and result before choosing.'
  remediation_scene: history-foundations.s4
  variants:
  - id: history-foundations.transfer.1
    prompt: A thermostat adjusts heat from measured error. Is that alone proof of neural learning?
    options:
    - id: c
      text: Yes; any sensor is a neuron
    - id: a
      text: No; a fixed controller can do this
    - id: b
      text: Yes; every feedback loop trains a network
    answer: a
    feedback: Control and parameter learning are distinct mechanisms.
  - id: history-foundations.transfer.2
    prompt: Why compare historical contributions by the problems they address?
    options:
    - id: a
      text: Different traditions optimize different explanatory and practical goals
    - id: b
      text: All methods have identical assumptions
    - id: c
      text: Dates alone determine scientific validity
    answer: a
    feedback: Problem-based comparison reveals contributions without forcing one linear origin story.
