schema_version: 0.2-draft
lesson:
  id: history-foundations
  version: 0.2.0-draft
  title: AI grew from several older questions
  state: draft
  summary: Before AI had a name, people studied rules, calculation, uncertainty, and feedback. Follow those ideas
    through a simple room-heating example.
  slot: M01.1
  category: learning
  minutes: 12
  sources:
  - title: Wiener — Cybernetics, first published 1948
    url: https://mitpress.mit.edu/9780262537841/cybernetics-or-control-and-communication-in-the-animal-and-the-machine/
  - title: Buchanan — A (Very) Brief History of Artificial Intelligence
    url: https://ojs.aaai.org/aimagazine/index.php/aimagazine/article/view/1848/0
  - title: Turing — Computing Machinery and Intelligence (1950)
    url: https://www.csee.umbc.edu/courses/471/papers/turing.pdf
  archetype: perspective
objectives:
- id: objective.history-foundations
  version: 2-draft
  statement: Distinguish logical deduction, uncertainty, feedback control, and learning as contributions to the
    foundations of AI.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - history-foundations.base.v2
  - history-foundations.transfer.v2
  prerequisites:
  - anyOf:
    - objective.ai-traditions
scenes:
- id: history-foundations.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.history-foundations
  title: Begin with a room that is too cold
  markdown: 'Imagine a room with a heater and a thermometer. You want the room to stay comfortable even as the weather
    changes. This single task raises several questions: how do we describe the situation, decide what to do, handle
    a doubtful measurement, and use the results? Ideas for answering those questions existed before the research
    field acquired the name artificial intelligence. The history begins with several kinds of problem-solving, not
    one machine suddenly becoming intelligent.'
  text_mode: 'Imagine a room with a heater and a thermometer. You want the room to stay comfortable even as the
    weather changes. This single task raises several questions: how do we describe the situation, decide what to
    do, handle a doubtful measurement, and use the results? Ideas for answering those questions existed before the
    research field acquired the name artificial intelligence. The history begins with several kinds of problem-solving,
    not one machine suddenly becoming intelligent.'
  bridges: []
- id: history-foundations.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.history-foundations
  title: Logic makes a conclusion inspectable
  markdown: '**Logic** studies rules for drawing conclusions from stated assumptions. If the room is below the target
    temperature, and the rule says to heat whenever that condition holds, the system can conclude that it should
    switch the heater on. The recorded statements are **facts** within this little representation. A conclusion
    can follow correctly from those facts even if the thermometer is broken. Logical correctness and accurate observations
    are separate questions. This distinction remains important when a modern system combines a prediction with an
    explicit safety rule.'
  text_mode: '**Logic** studies rules for drawing conclusions from stated assumptions. If the room is below the
    target temperature, and the rule says to heat whenever that condition holds, the system can conclude that it
    should switch the heater on. The recorded statements are **facts** within this little representation. A conclusion
    can follow correctly from those facts even if the thermometer is broken. Logical correctness and accurate observations
    are separate questions. This distinction remains important when a modern system combines a prediction with an
    explicit safety rule.'
  bridges: []
- id: history-foundations.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.history-foundations
  title: An algorithm turns an idea into steps
  markdown: 'An **algorithm** is an ordered procedure: read the thermometer, compare the reading with the target,
    choose an action, and repeat. A **computation** carries out such operations on represented information. Work
    on mathematical logic and computation helped make it possible to ask precisely which procedures machines could
    execute. That does not mean every useful task has a short or efficient procedure. A rule can be clearly written
    while still requiring too many steps to finish within a practical budget.'
  text_mode: 'An **algorithm** is an ordered procedure: read the thermometer, compare the reading with the target,
    choose an action, and repeat. A **computation** carries out such operations on represented information. Work
    on mathematical logic and computation helped make it possible to ask precisely which procedures machines could
    execute. That does not mean every useful task has a short or efficient procedure. A rule can be clearly written
    while still requiring too many steps to finish within a practical budget.'
  bridges: []
- id: history-foundations.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.history-foundations
  title: Probability makes uncertainty explicit
  markdown: A **probability** is a numerical way of describing uncertainty under a model. Suppose ten previous readings
    taken under similar conditions included two faulty readings. That frequency could help motivate an uncertain
    sensor model, but it does not prove the next reading has exactly a two-in-ten fault chance. Conditions might
    have changed, and ten cases are a small sample. Probability lets a system compare uncertain possibilities; it
    does not turn a guess into a fact. Later lessons will explain the arithmetic and the assumptions behind such
    calculations.
  text_mode: A **probability** is a numerical way of describing uncertainty under a model. Suppose ten previous
    readings taken under similar conditions included two faulty readings. That frequency could help motivate an
    uncertain sensor model, but it does not prove the next reading has exactly a two-in-ten fault chance. Conditions
    might have changed, and ten cases are a small sample. Probability lets a system compare uncertain possibilities;
    it does not turn a guess into a fact. Later lessons will explain the arithmetic and the assumptions behind such
    calculations.
  bridges: []
- id: history-foundations.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.history-foundations
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Rules, probabilities, and feedback answer different questions. A useful AI system can combine those
    ideas instead of belonging to just one historical tradition.
- id: history-foundations.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.history-foundations
  markdown: Logic, computation, statistics, neuroscience, and feedback control contributed different questions and
    tools to AI; no single tradition explains the whole field.
  text_mode: Logic, computation, statistics, neuroscience, and feedback control contributed different questions
    and tools to AI; no single tradition explains the whole field.
- id: history-foundations.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.history-foundations
  title: Feedback closes the loop
  markdown: '**Feedback** means using information about the result to influence the next action. If heating makes
    the room warmer, the next thermometer reading can tell the controller to reduce heating. **Control** is the
    task of steering a changing system toward desired behavior. Norbert Wiener’s 1948 book Cybernetics helped connect
    the study of communication and feedback across machines and living systems. A fixed thermostat can use feedback
    without learning new rules. Learning would additionally change its settings or procedure using experience.'
  text_mode: '**Feedback** means using information about the result to influence the next action. If heating makes
    the room warmer, the next thermometer reading can tell the controller to reduce heating. **Control** is the
    task of steering a changing system toward desired behavior. Norbert Wiener’s 1948 book Cybernetics helped connect
    the study of communication and feedback across machines and living systems. A fixed thermostat can use feedback
    without learning new rules. Learning would additionally change its settings or procedure using experience.'
  bridges: []
- id: history-foundations.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.history-foundations
  title: Combine the questions without confusing them
  markdown: 'For the room, write four separate lines: a rule describing when heating is allowed; a procedure that
    runs the check; an uncertainty statement about the sensor; and a feedback loop that checks the result. Add a
    fifth line only if something is learned from experience. This exercise gives you a map for later AI systems:
    identify the information, the decisions, the uncertainty, and what changes. Historical connections are useful
    because these questions keep returning, even when the hardware and model names change.'
  text_mode: 'For the room, write four separate lines: a rule describing when heating is allowed; a procedure that
    runs the check; an uncertainty statement about the sensor; and a feedback loop that checks the result. Add a
    fifth line only if something is learned from experience. This exercise gives you a map for later AI systems:
    identify the information, the decisions, the uncertainty, and what changes. Historical connections are useful
    because these questions keep returning, even when the hardware and model names change.'
  bridges: []
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - history-foundations.s1
    - history-foundations.s2
    - history-foundations.s3
    - history-foundations.s4
    - history-foundations.s5
    - history-foundations.s6
    - history-foundations.check
    gate_refs:
    - gate.core
  scene_aliases:
    history-foundations.recap: history-foundations.check
assessment_families:
- id: history-foundations.base
  objective_ref: objective.history-foundations
  task: base
  response_type: single_choice
  points: 1
  hint: 'Uncertainty and adaptation supplied other tools: trace the inputs, operation, and result before choosing.'
  remediation_scene: history-foundations.s2
  variants:
  - id: history-foundations.base.1
    prompt: Which tradition directly studies valid relations between statements?
    options:
    - id: b
      text: Only image compression
    - id: c
      text: Only semiconductor manufacturing
    - id: a
      text: Logic
    answer: a
    feedback: Logic formalizes consequence and consistency.
    retired: true
  - id: history-foundations.base.2
    prompt: What makes a system a feedback loop?
    options:
    - id: c
      text: It never measures the environment
    - id: a
      text: Its observations of outcomes influence subsequent actions
    - id: b
      text: It stores a fixed list of outputs only
    answer: a
    feedback: Feedback closes the loop from action through observation to a later action.
    retired: true
- id: history-foundations.transfer
  objective_ref: objective.history-foundations
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Read history as interacting traditions: trace the inputs, operation, and result before choosing.'
  remediation_scene: history-foundations.s4
  variants:
  - id: history-foundations.transfer.1
    prompt: A thermostat adjusts heat from measured error. Is that alone proof of neural learning?
    options:
    - id: c
      text: Yes; any sensor is a neuron
    - id: a
      text: No; a fixed controller can do this
    - id: b
      text: Yes; every feedback loop trains a network
    answer: a
    feedback: Control and parameter learning are distinct mechanisms.
    retired: true
  - id: history-foundations.transfer.2
    prompt: Why compare historical contributions by the problems they address?
    options:
    - id: a
      text: Different traditions optimize different explanatory and practical goals
    - id: b
      text: All methods have identical assumptions
    - id: c
      text: Dates alone determine scientific validity
    answer: a
    feedback: Problem-based comparison reveals contributions without forcing one linear origin story.
    retired: true
- id: history-foundations.base.v2
  objective_ref: objective.history-foundations
  task: base
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: history-foundations.s5
  variants:
  - prompt: A heater rereads room temperature and switches off after warming the room. Its rule stays fixed. What
      is this?
    answer: a
    options:
    - id: c
      text: Reasoning from a sensor-free proof
    - id: a
      text: Feedback control without learned rule changes
    - id: b
      text: Learning a new rule from each warm reading
    feedback: The result affects the next action, but the control rule itself has not changed.
    id: history-foundations.base.v2.1
  - prompt: A controller repeats its measurement and corrects its action while keeping the same rule. What changes?
    answer: a
    options:
    - id: a
      text: The action responding to the current situation
    - id: b
      text: The stored rule fitted to new examples
    - id: c
      text: The task the controller was built to perform
    feedback: Feedback changes actions in response to observations; that does not by itself imply training.
    id: history-foundations.base.v2.2
  - prompt: A room controller adjusts a stored heating setting after comparing many past outcomes. What has been
      added?
    answer: a
    options:
    - id: b
      text: A fixed comparison with no setting changes
    - id: c
      text: A conclusion about the room without observations
    - id: a
      text: Learning from experience
    feedback: Changing a stored setting using past outcomes adds learning to the control process.
    id: history-foundations.base.v2.3
  - prompt: A fan uses the latest sensor reading but its settings never change during use. Which claim is supported?
    answer: a
    options:
    - id: c
      text: Its changing actions imply newly learned settings
    - id: a
      text: Its actions can adapt to conditions under a fixed rule
    - id: b
      text: Each sensor reading is a new training step
    feedback: Changing inputs can change actions without changing the stored procedure.
    id: history-foundations.base.v2.4
- id: history-foundations.transfer.v2
  objective_ref: objective.history-foundations
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: history-foundations.s3
  variants:
  - prompt: A correct heating rule receives an incorrectly high temperature. What should be inspected?
    answer: a
    options:
    - id: c
      text: The number of times the conclusion was repeated
    - id: a
      text: The observation used by the rule
    - id: b
      text: The rule’s conclusion as proof of the actual temperature
    feedback: Valid reasoning does not repair an inaccurate premise.
    id: history-foundations.transfer.v2.1
  - prompt: A deduction follows from a recorded fact, but the record is outdated. What is established?
    answer: a
    options:
    - id: a
      text: The conclusion follows conditionally from that recorded fact
    - id: b
      text: The conclusion verifies that the fact is current
    - id: c
      text: The conclusion makes the missing observation unnecessary
    feedback: Distinguish a valid inference from the truth and currency of its inputs.
    id: history-foundations.transfer.v2.2
  - prompt: Two faulty readings occurred in ten trials. What additional question matters before reusing that frequency?
    answer: a
    options:
    - id: b
      text: Whether the fraction is a written logical rule
    - id: c
      text: Whether the latest reading equals the target temperature
    - id: a
      text: Whether future conditions resemble the trials
    feedback: Observed frequencies need an interpretation and assumptions about future conditions.
    id: history-foundations.transfer.v2.3
  - prompt: A search procedure is precisely described but explores a huge number of possibilities. What remains
      unresolved?
    answer: a
    options:
    - id: c
      text: Whether a long runtime changes the task definition
    - id: a
      text: Whether it can finish within the available resources
    - id: b
      text: Whether its written steps count as a procedure
    feedback: Specifying an algorithm and making it practical are different achievements.
    id: history-foundations.transfer.v2.4
