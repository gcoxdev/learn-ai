    is too large in magnitude for the format; underflow concerns values too small to retain with normal precision,
    possibly rounding to zero. NaN means “not a number,” a marker used for invalid numerical results such as
    0/0.'
  bridges: []
- id: numerical-computing.s2
  title: Rounding can change an operation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.numerical-computing
  markdown: In decimal arithmetic with only three significant digits, 1000 + 1 may round back to 1000. Adding
    many small values before combining them with a large value can give a different result from another order.
    Real floating-point formats differ, but the example explains why algebraically equivalent evaluation orders
    may disagree numerically.
  text_mode: In decimal arithmetic with only three significant digits, 1000 + 1 may round back to 1000. Adding
    many small values before combining them with a large value can give a different result from another order.
    Real floating-point formats differ, but the example explains why algebraically equivalent evaluation orders
    may disagree numerically.
  bridges:
  - powers-logs
- id: numerical-computing.s3
  title: Keep softmax within a useful range
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.numerical-computing
  markdown: Softmax exponentiates scores and divides by their total. Scores [1000, 1001] can overflow when
    exponentiated directly. Subtract the largest score first, obtaining [−1, 0]. Both numerator and denominator
    are scaled by the same factor, preserving the mathematical distribution while keeping exponentials manageable.
    Related log-sum-exp formulas stabilize log probabilities.
  text_mode: Softmax exponentiates scores and divides by their total. Scores [1000, 1001] can overflow when
    exponentiated directly. Subtract the largest score first, obtaining [−1, 0]. Both numerator and denominator
    are scaled by the same factor, preserving the mathematical distribution while keeping exponentials manageable.
    Related log-sum-exp formulas stabilize log probabilities.
  bridges: []
- id: numerical-computing.s4
  title: Trace where accuracy is needed
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.numerical-computing
  markdown: 'Mixed-precision training may store or multiply some values in a small format while accumulating
    sums or keeping optimizer state in a wider format. Loss scaling can keep some gradients away from underflow,
    but cannot fix a wrong objective. Compare tolerances, reference calculations, gradients, and finite outputs
    rather than demanding exact decimal equality everywhere.


    A tolerance is an allowed numerical difference. If a reference value is 1.0000 and an approximation is
    1.0001, their absolute error is 0.0001. Whether that is acceptable depends on the task and scale. Check
    both small worked values and representative workloads; approximate arithmetic is expected, but missing
    a factor or using the wrong target is a different kind of error.'
  text_mode: 'Mixed-precision training may store or multiply some values in a small format while accumulating
    sums or keeping optimizer state in a wider format. Loss scaling can keep some gradients away from underflow,
    but cannot fix a wrong objective. Compare tolerances, reference calculations, gradients, and finite outputs
    rather than demanding exact decimal equality everywhere.


