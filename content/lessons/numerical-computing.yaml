assessment_families:
  - id: numerical-computing.base
    objective_ref: objective.numerical-computing
    task: base
    response_type: single_choice
    points: 1
    hint: Ask whether the number fits the format's grid of values, and whether a shift or a wider format keeps it there.
    remediation_scene: numerical-computing.s2
    variants:
      - id: numerical-computing.base.1
        prompt: Which property describes the spacing of representable nearby values?
        options:
          - id: c
            text: File size alone
          - id: a
            text: Precision
          - id: b
            text: Only exponent range
        answer: a
        feedback: Precision limits how finely values can be distinguished at a given scale.
        retired: true
      - id: numerical-computing.base.2
        prompt: Why subtract the maximum score before softmax?
        options:
          - id: a
            text: To reduce overflow risk while preserving relative weights
          - id: b
            text: To force all outcomes equally likely
          - id: c
            text: To make every masked score positive
        answer: a
        feedback: A common score shift cancels between the numerator and denominator.
        retired: true
  - id: numerical-computing.transfer
    objective_ref: objective.numerical-computing
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask whether a small value is being lost to rounding or underflow, and where a wider format would keep it.
    remediation_scene: numerical-computing.s4
    variants:
      - id: numerical-computing.transfer.1
        prompt: Two parallel reductions differ in their last digits. What is a plausible cause?
        options:
          - id: a
            text: Different rounding from addition order
          - id: b
            text: Proof that the mathematical sum is undefined
          - id: c
            text: A necessary change in training labels
        answer: a
        feedback: Floating-point addition is not perfectly associative.
        retired: true
      - id: numerical-computing.transfer.2
        prompt: A small gradient becomes zero in a narrow format. What problem may be occurring?
        options:
          - id: b
            text: Guaranteed convergence
          - id: c
            text: A new symbolic rule
          - id: a
            text: Underflow or insufficient representable precision
        answer: a
        feedback: A stored zero can result from numerical representation rather than a true zero derivative.
        retired: true
  - id: numerical-computing.base.v2
    objective_ref: objective.numerical-computing
    task: base
    response_type: single_choice
    points: 1
    hint: "Picture the grid of values the format can hold: how far apart the neighbors are at this size, and where the largest value is."
    remediation_scene: numerical-computing.s2
    variants:
      - id: numerical-computing.base.v2.1
        prompt: In float16, 2048 + 1 gives 2048. What causes this?
        options:
          - id: b
            text: 2049 is larger than the biggest value float16 can hold
          - id: c
            text: The 1 underflows to zero before it is added
          - id: a
            text: Near 2048, neighboring float16 values are 2 apart
        answer: a
        feedback: At this size float16's neighbors are 2048, 2050, 2052…, so 2049 rounds back to 2048. It isn't overflow (float16 goes up to 65,504), and 1 is stored exactly.
      - id: numerical-computing.base.v2.2
        prompt: Why does a stable softmax subtract the largest score from every score first?
        options:
          - id: c
            text: So the largest score's probability becomes exactly 1
          - id: a
            text: So no exponential overflows, with the same probabilities
          - id: b
            text: So the probabilities change a little but stay finite
        answer: a
        feedback: e^(z − m) = e^z ÷ e^m, and the common factor e^m cancels between top and bottom, so the probabilities are unchanged. The largest score becomes 0 and its exponential 1, but its probability is still that 1 divided by the total.
      - id: numerical-computing.base.v2.3
        prompt: A layer's activations sometimes reach 100,000. Which 16-bit format can store that value without overflowing?
        options:
          - id: b
            text: float16, because it has more significand bits
          - id: a
            text: bfloat16, because it keeps float32's exponent range
          - id: c
            text: Either one, because both formats use 16 bits
        answer: a
        feedback: float16's largest value is 65,504, so 100,000 overflows to infinity. bfloat16 spends more bits on the exponent and reaches about 3.4 × 10³⁸. float16's extra significand bits buy precision, not range.
      - id: numerical-computing.base.v2.4
        prompt: A unit test adds 0.1 and 0.2, then checks total == 0.3, and fails. What is the best fix?
        options:
          - id: c
            text: Add them in the other order, 0.2 + 0.1, before comparing
          - id: b
            text: Store both in float16 so there are fewer digits to disagree
          - id: a
            text: Compare with a tolerance, such as math.isclose(total, 0.3)
        answer: a
        feedback: Neither 0.1 nor 0.2 is stored exactly, so exact equality is the wrong test. Changing the order gives the same rounded result here, and float16 rounds even more coarsely.
      - id: numerical-computing.base.v2.5
        prompt: A naive softmax on scores [900, 905] returns [nan, nan]. What happened?
        options:
          - id: a
            text: Both exponentials overflowed to infinity, and ∞ ÷ ∞ is NaN
          - id: b
            text: Both exponentials underflowed to zero, and 0 ÷ 0 is NaN
          - id: c
            text: The scores differ by 5, which is too much for softmax
        answer: a
        feedback: e^900 is far beyond float64's largest value, about 1.8 × 10³⁰⁸, so both terms become ∞, and ∞ ÷ ∞ is undefined. Subtracting 905 first gives scores [−5, 0], which are easy to exponentiate.
  - id: numerical-computing.transfer.v2
    objective_ref: objective.numerical-computing
    task: transfer
    response_type: single_choice
    points: 1
    hint: Find the step where a value leaves the format's grid (too big, too small, or smaller than the gap to its neighbor), then choose the fix aimed at that step.
    remediation_scene: numerical-computing.s4
    variants:
      - id: numerical-computing.transfer.v2.1
        prompt: A float16 model's weights stop changing, although its updates are about 0.0001 and the weights are about 1.0. What is the standard fix?
        options:
          - id: b
            text: Switch the weights to bfloat16 so they can hold a bigger range
          - id: c
            text: Raise the learning rate until the updates show up in float16
          - id: a
            text: Keep a float32 master copy of the weights and apply updates to it
        answer: a
        feedback: Near 1.0, float16's neighbors are about 0.001 apart, so an update of 0.0001 rounds away. A float32 copy has gaps near 10⁻⁷ and keeps every update. bfloat16's gaps are even wider, and a bigger learning rate changes the training itself.
      - id: numerical-computing.transfer.v2.2
        prompt: A program scores a 200-word sentence by multiplying its words' probabilities, each about 0.01, and gets exactly 0.0. What should it do instead?
        options:
          - id: c
            text: Use float16, which is designed for small numbers
          - id: a
            text: Add the words' log probabilities instead
          - id: b
            text: Round each probability up to 0.1 first
        answer: a
        feedback: 0.01²⁰⁰ = 10⁻⁴⁰⁰, which underflows even in float64, whose smallest values are around 10⁻³²⁴. Log probabilities add to about −921 (natural log), which is easy to store. float16 underflows far sooner, and rounding changes the answer.
      - id: numerical-computing.transfer.v2.3
        prompt: Two GPUs sum the same million gradient values and disagree in the seventh significant digit. What is the most likely cause?
        options:
          - id: a
            text: They added the values in different orders, so rounding differed
          - id: b
            text: One GPU has a hardware fault that corrupts its results
          - id: c
            text: One GPU skipped some values that were too small to add
        answer: a
        feedback: Floating-point addition isn't associative, so a different order rounds differently, and float32 keeps only about 7 significant digits. A hardware fault or skipped values would usually cause much larger or random differences.
      - id: numerical-computing.transfer.v2.4
        prompt: A logging script keeps a float16 count of training steps. The dashboard shows the count stuck at 2048 for hours. What is the fix?
        options:
          - id: b
            text: Reset the counter to 0 each time it reaches 2048
          - id: a
            text: Keep the counter as an integer or in float32
          - id: c
            text: Add 2 per step, then divide the count by 2 when printing
        answer: a
        feedback: Past 2048, float16's neighbors are 2 apart, so adding 1 rounds back to 2048. An integer or float32 has room for exact counts. Resetting loses the count, and adding 2 per step stalls at 4096, where the gap is 4 and 4096 + 2 rounds back to 4096. That is still after 2048 steps.
  - id: numerical-computing.calculate
    objective_ref: objective.numerical-computing
    task: base
    response_type: numeric
    points: 1
    hint: Subtract the largest score from every score, exponentiate (e⁰ = 1, e⁻¹ ≈ 0.368, e⁻² ≈ 0.135, e⁻³ ≈ 0.050), then divide by the total.
    remediation_scene: numerical-computing.s3
    absolute_tolerance: 0.005
    variants:
      - id: numerical-computing.calculate.1
        prompt: Scores are [1000, 1001]. Using a stable softmax, what probability goes to the score 1001? (e⁻¹ ≈ 0.368; give three decimals.)
        answer: 0.731
        feedback: Subtract 1001 to get [−1, 0], exponentiate to [0.368, 1], and divide by the total 1.368. The 1001 score gets 1 ÷ 1.368 ≈ 0.731.
      - id: numerical-computing.calculate.2
        prompt: Scores are [500, 502]. Using a stable softmax, what probability goes to the score 502? (e⁻² ≈ 0.135; give three decimals.)
        answer: 0.881
        feedback: Subtract 502 to get [−2, 0], exponentiate to [0.135, 1], and divide by 1.135. The 502 score gets 1 ÷ 1.135 ≈ 0.881.
      - id: numerical-computing.calculate.3
        prompt: Scores are [30, 30, 29]. Using a stable softmax, what probability goes to the score 29? (e⁻¹ ≈ 0.368; give three decimals.)
        answer: 0.155
        feedback: Subtract 30 to get [0, 0, −1], exponentiate to [1, 1, 0.368], and divide by 2.368. The 29 score gets 0.368 ÷ 2.368 ≈ 0.155.
      - id: numerical-computing.calculate.4
        prompt: Scores are [−1000, −1003]. A naive softmax gives NaN, because both exponentials underflow to 0. Using a stable softmax, what probability goes to the score −1000? (e⁻³ ≈ 0.050; give three decimals.)
        answer: 0.953
        feedback: The largest score is −1000, so subtracting it gives [0, −3], which exponentiate to [1, 0.050]. The −1000 score gets 1 ÷ 1.050 ≈ 0.952 (0.953 with an unrounded e⁻³). The naive version fails only because of the format, not the math.
      - id: numerical-computing.calculate.5
        prompt: Scores are [700, 698, 698]. Using a stable softmax, what probability goes to the score 700? (e⁻² ≈ 0.135; give three decimals.)
        answer: 0.787
        feedback: Subtract 700 to get [0, −2, −2], exponentiate to [1, 0.135, 0.135], and divide by 1.27. The 700 score gets 1 ÷ 1.27 ≈ 0.787.
