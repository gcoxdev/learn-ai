scenes:
- id: numerical-computing.s1
  title: Represent a finite approximation
  type: explanation
  depth: intuition
  objective_refs:
  - objective.numerical-computing
  markdown: 'Floating-point numbers store a sign, a significand, and an exponent in a finite number of bits.
    Range describes how large or small representable magnitudes can be; precision describes distinguishable
    values near a scale. More exponent range does not automatically mean more precise nearby numbers.


    The decimal example 3.14 × 10² has significand 3.14 and exponent 2. Computer formats usually use powers
    of two instead of ten. A finite format cannot store every real number exactly. Overflow means a result
    is too large in magnitude for the format; underflow concerns values too small to retain with normal precision,
    possibly rounding to zero. NaN means “not a number,” a marker used for invalid numerical results such as
    0/0.'
  text_mode: 'Floating-point numbers store a sign, a significand, and an exponent in a finite number of bits.
    Range describes how large or small representable magnitudes can be; precision describes distinguishable
    values near a scale. More exponent range does not automatically mean more precise nearby numbers.


    The decimal example 3.14 × 10² has significand 3.14 and exponent 2. Computer formats usually use powers
