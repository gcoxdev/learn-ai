lesson:
  id: numerical-computing
  version: 0.4.0-draft
  title: When the computer cannot store the exact number
  state: draft
  summary: "In Python, 0.1 + 0.2 isn't 0.3, and in 16-bit numbers 2048 + 1 is 2048. See where a computer's numbers run out, and the tricks that keep softmax and training finite."
  slot: B18
  category: bridge
  sources:
    - title: Deep Learning — numerical computation
      url: https://www.deeplearningbook.org/contents/numerical.html
objectives:
  - id: objective.numerical-computing
    version: 2-draft
    statement: Explain rounding, overflow, and underflow in floating-point formats, compute a softmax stably by subtracting the largest score, and compare approximate results with a tolerance.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - numerical-computing.base.v2
      - numerical-computing.transfer.v2
      - numerical-computing.calculate
    prerequisites:
      - anyOf:
