scenes:
  - id: numerical-computing.s1
    title: Why 0.1 + 0.2 isn't 0.3
    type: explanation
    depth: intuition
    objective_refs:
      - objective.numerical-computing
    markdown: |-
      Type `0.1 + 0.2` into Python and it answers `0.30000000000000004`. Nothing is broken. The computer simply can't store 0.1 exactly.

      **Why AI needs this:** models train in 16-bit numbers to save memory and time, softmax exponentiates scores that can be huge, and gradient checks compare numbers that never match exactly. Each one depends on where a computer's numbers run out.

      A **floating-point** number is scientific notation in binary: a sign, a **significand** that holds the digits, and an **exponent** that says where the point goes (3.14 × 10² has significand 3.14 and exponent 2). With a fixed number of bits, only some numbers fit. One tenth in binary repeats forever, the way 1/3 = 0.333… does in decimal, so 0.1 and 0.2 are each stored slightly off, and their sum lands one step above the stored 0.3.

      | Format | Bits | Largest value | Gap just above 1 |
      | --- | ---: | ---: | ---: |
      | float32 | 32 | about 3.4 × 10³⁸ | about 1.2 × 10⁻⁷ |
      | float16 | 16 | 65,504 | about 0.001 |
      | bfloat16 | 16 | about 3.4 × 10³⁸ | about 0.008 |

      Exponent bits buy **range** (how big or tiny a value can be); significand bits buy **precision** (how close neighboring values sit). A result past the largest value **overflows** to infinity. One too close to zero **underflows** to 0. Invalid results like ∞ − ∞ or 0 ÷ 0 become **NaN** ("not a number"), which spreads through every calculation it touches.
    bridges: []
  - id: numerical-computing.s2
    title: Big numbers swallow small ones
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.numerical-computing
    markdown: |-
      The gaps between neighboring floats grow with size. In float16, neighbors near 1 sit about 0.001 apart, but neighbors near 2048 sit 2 apart: 2048, 2050, 2052…

      So 2048 + 1 = 2049 has nowhere to go. It sits exactly halfway between two neighbors and rounds to 2048 (ties go to the "even" neighbor). A float16 counter that adds 1 at every step climbs to 2048 and stops there forever.

      :::predict In float16, what is 2048 + 1 + 1 + 1 + 1, added left to right? And 2048 + (1 + 1 + 1 + 1)?
      Left to right, every + 1 rounds back to 2048, so the answer is 2048. Grouping the small ones first makes 4, which is on the grid: 2052. Same numbers, different order, different answer. Floating-point addition isn't associative.
      :::

      This is why two GPUs summing the same gradients in different orders can disagree in the last digits. It also bites training: in float16 a weight of 1.0 plus an update of 0.0001 is still 1.0, since the update is less than half the gap. Mixed-precision training therefore keeps a float32 master copy of the weights and adds up long sums in float32.

      ```python run
      import numpy as np

      print("0.1 + 0.2 =", 0.1 + 0.2)

      total16, total32 = np.float16(0), np.float32(0)
      for step in range(3000):                  # add 1.0 three thousand times
          total16 += np.float16(1)
          total32 += np.float32(1)
      print("float16 running total:", float(total16))
      print("float32 running total:", float(total32))

      big, one = np.float16(2048), np.float16(1)
      print("2048 + 1 + 1 + 1 + 1, left to right:", float(big + one + one + one + one))
      print("2048 + (1 + 1 + 1 + 1):            ", float(big + (one + one + one + one)))
      print("weight 1.0 + update 0.0001 in float16:", float(np.float16(1) + np.float16(0.0001)))
      ```

      The float16 total stalls at 2048.0 while float32 reaches 3000.0. Change `range(3000)` to `range(1000)` and both agree, because the trouble starts only past 2048.
    bridges:
      - powers-logs
  - id: numerical-computing.s3
    title: Subtract the largest score before softmax
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.numerical-computing
    markdown: |-
      Softmax turns scores into probabilities: exponentiate each score, then divide by the total, $p_i = e^{z_i} / \sum_j e^{z_j}$. Take scores [1000, 1001]:

      1. **Naively**, e^1000 is about 10⁴³⁴, far past even float64's largest value (about 1.8 × 10³⁰⁸). Both exponentials overflow to ∞, and ∞ ÷ ∞ = NaN.
      2. **Stably**, subtract the largest score, 1001, first: the scores become [−1, 0].
      3. e^−1 ≈ 0.368 and e^0 = 1, so the total is 1.368.
      4. The probabilities are 0.368 ÷ 1.368 ≈ **0.269** and 1 ÷ 1.368 ≈ **0.731**.

      :::predict Subtracting 1001 changed the scores. Did it change the probabilities?
      No. e^(z − m) = e^z ÷ e^m, so every term, top and bottom, is divided by the same e^m, and it cancels. The shift changes only which numbers the computer has to hold.
      :::

      Float16 runs out much sooner: e^12 ≈ 163,000 is already past 65,504, so scores of just 10 and 12 break a naive softmax.

      ```python run
      import numpy as np

      def softmax_naive(z):
          e = np.exp(z)
          return e / e.sum()

      def softmax_stable(z):
          e = np.exp(z - z.max())       # the largest score becomes 0, and e**0 = 1
          return e / e.sum()

      for z in [np.array([1000.0, 1001.0]),              # float64 scores
                np.array([10, 12], dtype=np.float16)]:   # float16 scores
          with np.errstate(over="ignore", invalid="ignore"):
              naive = softmax_naive(z)
          print(f"scores {z}  ({z.dtype})")
          print("  naive: ", naive)
          print("  stable:", softmax_stable(z))

      z = np.array([1000.0, 1001.0])
      m = z.max()
      print("log of sum of exp:", m + np.log(np.sum(np.exp(z - m))))
      ```

      The same trick gives the **log-sum-exp**, $\log \sum_j e^{z_j} = m + \log \sum_j e^{z_j - m}$, here 1001 + ln 1.368 ≈ 1001.313. Cross-entropy losses use it, which is why library loss functions take raw scores (logits) rather than probabilities.
    bridges: []
  - id: numerical-computing.s4
    title: Compare with a tolerance, not ==
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.numerical-computing
    markdown: |-
      Since rounding is everywhere, test "close enough," not "equal." A **tolerance** is the difference you're willing to accept.

      :::mixup "0.1 + 0.2 == 0.3 is False, so something is wrong with my code."
      The rounding is correct and expected. Write `abs(a - b) < 1e-9`, or use `math.isclose(a, b)` or NumPy's `np.allclose`.
      :::

      Size matters, so compare the **relative error**, |a − b| ÷ the larger of |a| and |b|:

      | Reference | Your result | Absolute error | Relative error |
      | ---: | ---: | ---: | ---: |
      | 1.0000 | 1.0001 | 0.0001 | 0.0001 |
      | 0.0002 | 0.0003 | 0.0001 | 0.33 |

      The same absolute error is harmless in the first row and a 33% miss in the second. The lesson on gradient checks uses exactly this ratio: a relative error near 10⁻⁷ in float64 is rounding, while something like 0.5 means a real bug, such as a dropped factor of 2. The lessons on stable training and mixed-precision training pick up from here.
    bridges: []
  - id: numerical-computing.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.numerical-computing
    markdown: Round numbers in float16, run stable softmax on new scores, and diagnose a stalled counter, a frozen weight, and two GPUs that disagree.
    takeaway: |-
      Floats are rounded to a grid whose gaps grow with size, and each format has a largest and smallest value. Subtract the largest score before exponentiating, keep long sums in wider formats, and compare results with a tolerance.
  - id: numerical-computing.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.numerical-computing
    markdown: |-
      Floating-point formats trade range and precision; stable formulations, accumulation choices, and error checks keep approximate computation useful.
