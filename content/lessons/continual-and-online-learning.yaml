lesson:
  id: continual-and-online-learning
  version: 0.2.0-draft
  title: Learn new information while measuring what is forgotten
  state: draft
  summary: Learn new tasks while keeping track of what was forgotten.
  slot: M31.5
  category: learning
  sources:
  - title: Overcoming Catastrophic Forgetting
    url: https://arxiv.org/abs/1612.00796
  - title: Gradient Episodic Memory
    url: https://arxiv.org/abs/1706.08840
objectives:
- id: objective.continual-and-online-learning
  version: 1-draft
  statement: Continual and online learning update models as experience arrives; replay, regularization, and
    modularity address retention under explicit memory and task-boundary assumptions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - continual-and-online-learning.base
  - continual-and-online-learning.transfer
  prerequisites:
  - anyOf:
    - objective.transfer-and-domain-adaptation
  - anyOf:
    - objective.neural-training-loop
scenes:
- id: continual-and-online-learning.s1
  title: Define the stream and update schedule
  type: explanation
  depth: intuition
  objective_refs:
  - objective.continual-and-online-learning
  markdown: Online learning updates from arriving examples, while continual-learning studies emphasize learning
    across changing tasks or distributions without losing earlier capabilities. Some setups reveal task boundaries;
    others do not. A chatbot remembering conversation context is not necessarily performing parameter updates
    online.
  text_mode: Online learning updates from arriving examples, while continual-learning studies emphasize learning
    across changing tasks or distributions without losing earlier capabilities. Some setups reveal task boundaries;
    others do not. A chatbot remembering conversation context is not necessarily performing parameter updates
    online.
  bridges: []
- id: continual-and-online-learning.s2
  title: See forgetting through interference
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.continual-and-online-learning
  markdown: 'A model trained on task A can lose A performance after fitting task B because shared parameters
    change. This is catastrophic forgetting when the loss is severe. Measure both current-task learning and
    previous-task retention rather than reporting only the latest score.


    Suppose accuracy on task A is 90% after learning A. After learning B, it falls to 65%, while B reaches
    85%. A has lost 25 percentage points. Reporting only B’s 85% hides that cost. Plasticity means the ability
    to change in response to new experience; retention means keeping earlier capabilities. Freezing every weight
    can protect some earlier behavior but prevents those weights from adapting to B.'
  text_mode: 'A model trained on task A can lose A performance after fitting task B because shared parameters
    change. This is catastrophic forgetting when the loss is severe. Measure both current-task learning and
    previous-task retention rather than reporting only the latest score.


    Suppose accuracy on task A is 90% after learning A. After learning B, it falls to 65%, while B reaches
    85%. A has lost 25 percentage points. Reporting only B’s 85% hides that cost. Plasticity means the ability
    to change in response to new experience; retention means keeping earlier capabilities. Freezing every weight
    can protect some earlier behavior but prevents those weights from adapting to B.'
  bridges: []
- id: continual-and-online-learning.s3
  title: Compare retention mechanisms
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.continual-and-online-learning
  markdown: Replay mixes stored or generated older examples into new training. Regularization can resist changes
    to parameters judged important for earlier tasks. Modular approaches allocate separate or selectively used
    capacity. These strategies trade memory, computation, plasticity, and assumptions about which task is active.
  text_mode: Replay mixes stored or generated older examples into new training. Regularization can resist changes
    to parameters judged important for earlier tasks. Modular approaches allocate separate or selectively used
    capacity. These strategies trade memory, computation, plasticity, and assumptions about which task is active.
  bridges: []
- id: continual-and-online-learning.s4
  title: Evaluate over the whole sequence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.continual-and-online-learning
  markdown: Report task order, memory budget, data access, update frequency, and performance after each stage.
    Test multiple orders and genuinely new tasks. A method that stores every historical example solves a different
    constraint problem from one forbidden to retain prior data.
  text_mode: Report task order, memory budget, data access, update frequency, and performance after each stage.
    Test multiple orders and genuinely new tasks. A method that stores every historical example solves a different
    constraint problem from one forbidden to retain prior data.
  bridges: []
