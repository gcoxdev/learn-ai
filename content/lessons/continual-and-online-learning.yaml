schema_version: 0.2-draft
lesson:
  id: continual-and-online-learning
  version: 0.4.0-draft
  title: Learn new information while measuring what is forgotten
  state: draft
  summary: A trail camera learns spring's birds and forgets autumn's deer. Watch a two-weight model forget, then fix it with replay and with a penalty that guards the weights that mattered.
  slot: M31.5
  category: learning
  sources:
    - title: "Overcoming catastrophic forgetting in neural networks (Kirkpatrick et al., 2017)"
      url: https://arxiv.org/abs/1612.00796
    - title: "Gradient Episodic Memory for Continual Learning (Lopez-Paz & Ranzato, 2017)"
      url: https://arxiv.org/abs/1706.08840
    - title: "Online Learning and Online Convex Optimization (Shalev-Shwartz, 2012)"
      url: https://www.cs.huji.ac.il/~shais/papers/OLsurvey.pdf
objectives:
  - id: objective.continual-and-online-learning
    version: 2-draft
    statement: Measure forgetting across a task sequence, explain why shared weights forget, protect old skills with replay or an EWC penalty, and describe online learning by its regret.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - continual-and-online-learning.base.v2
      - continual-and-online-learning.transfer.v2
      - continual-and-online-learning.calculate
    prerequisites:
      - anyOf:
          - objective.transfer-and-domain-adaptation
      - anyOf:
          - objective.neural-training-loop
scenes:
  - id: continual-and-online-learning.s1
    title: Autumn's model forgets in spring
    type: explanation
    depth: intuition
    objective_refs:
      - objective.continual-and-online-learning
    markdown: |-
      A trail camera's classifier learns deer, foxes, and boar from autumn photos (task A). In spring, birds arrive, so the team trains it on bird photos (task B). The birds come out well, but deer are now often labeled "pigeon".

      This is **catastrophic forgetting**, which you met in the lesson on continued pretraining (module 16): training on new data overwrites what the same weights learned before. **Continual learning** studies how to learn a sequence of tasks without losing the earlier ones.

      The honest way to report it is an accuracy table: one row per training stage, one column per task.

      | After training on | Accuracy on A | Accuracy on B |
      | --- | ---: | ---: |
      | A | 94% | — |
      | B, plain fine-tuning | 52% | 91% |
      | B, with replay | 88% | 90% |

      :::predict How much did plain fine-tuning forget, and which final model would you ship?
      Measure forgetting as a task's best earlier accuracy minus its final accuracy. Plain fine-tuning forgot 94 − 52 = 42 points on A; replay forgot only 94 − 88 = 6. Averaged over both tasks, plain fine-tuning ends at (52 + 91) / 2 = 71.5%, and replay at (88 + 90) / 2 = 89%. Ship replay: it gave up one point on birds to keep 36 points on autumn's animals.
      :::

      Reporting only the latest task's 91% would hide the whole problem.
    bridges: []
  - id: continual-and-online-learning.s2
    title: The smallest model that can forget
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.continual-and-online-learning
    markdown: |-
      Forgetting needs only two weights. In this model, task A's answers depend on $w_1 + w_2$, and task B's depend on $w_1$ alone. Training on A reaches $w = (1, 1)$. Training on B then pushes $w_1$ to 3, but nothing tells it to lower $w_2$ to compensate, so A's prediction $w_1 + w_2$ jumps from 2 to 4.

      Yet a model good at both exists: $w = (3, -1)$. Plain training on B never finds it, because B's data say nothing about A. **Replay** fixes that by keeping a small buffer of old examples and mixing them into new training.

      ```python run
      import numpy as np

      s = np.array([-1.0, -0.5, 0.5, 1.0])
      XA, yA = np.stack([s, s], axis=1), 2 * s        # task A: target depends on w1 + w2
      XB, yB = np.stack([s, 0 * s], axis=1), 3 * s    # task B: target depends on w1 only

      def error(w, X, y):
          return np.mean((X @ w - y) ** 2)

      def train(w, X, y, steps=500, lr=0.2):
          for _ in range(steps):
              w = w - lr * 2 * X.T @ (X @ w - y) / len(y)   # gradient step on mean squared error
          return w

      def report(name, w):
          print(f"{name:14s} w = {np.round(w, 2)}   error on A {error(w, XA, yA):.2f}   on B {error(w, XB, yB):.2f}")

      w_a = train(np.zeros(2), XA, yA)
      report("after A", w_a)
      report("then B only", train(w_a, XB, yB))

      # Replay: keep 2 of task A's 4 examples in a small buffer and mix them into B's training
      X_mix = np.vstack([XB, XA[[0, 3]]])
      y_mix = np.concatenate([yB, yA[[0, 3]]])
      report("B + replay", train(w_a, X_mix, y_mix))
      ```

      Training on B alone takes A's error from 0.00 to 2.50. With just two replayed examples, the model lands on $(3, -1)$ and both errors are 0.00. Try replaying a single example, `XA[[3]]` and `yA[[3]]`: one is enough here, because A has only one direction to protect. Real networks have millions, which is why replay buffers hold thousands of examples.
    bridges: []
  - id: continual-and-online-learning.s3
    title: Guard the weights that mattered
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.continual-and-online-learning
    markdown: |-
      Sometimes you can't keep old data: the photos were deleted for privacy, or storage is tight. **Elastic weight consolidation (EWC)** (Kirkpatrick et al., 2017) keeps no examples. After task A, it records how important each weight was to A, then trains on B with a penalty for moving the important ones.

      Importance comes from the **Fisher information** $F_i$: roughly, how sharply A's loss rises when weight $i$ moves. Suppose after task A a network has two weights with $F_1 = 9$ and $F_2 = 0.1$, and $\lambda = 1$. Task B wants to move $w_1$ by 0.5 and $w_2$ by 2:

      | Weight | $F_i$ | Move $\Delta_i$ | $\tfrac{\lambda}{2} F_i \Delta_i^2$ |
      | --- | ---: | ---: | ---: |
      | $w_1$ | 9 | 0.5 | 0.5 × 9 × 0.25 = 1.125 |
      | $w_2$ | 0.1 | 2 | 0.5 × 0.1 × 4 = 0.2 |

      The small move in the important weight costs more than five times the big move in the unimportant one. So B learns mostly through weights A didn't need.

      :::papers The EWC loss
      $$\mathcal{L}(\theta) = \mathcal{L}_B(\theta) + \sum_i \frac{\lambda}{2}\, F_i\,\big(\theta_i - \theta^*_{A,i}\big)^2$$

      $\theta^*_A$ are the weights at the end of task A, $F_i$ is the diagonal of the Fisher information (the average squared gradient of A's log-likelihood at $\theta^*_A$), and $\lambda$ sets how much A matters relative to B. The name comes from synaptic consolidation in the brain: important connections become harder to change.
      :::

      :::mixup "Just freeze the old weights, or use a tiny learning rate."
      Freezing everything protects A but leaves nothing free to learn B, and a tiny learning rate only slows forgetting down. The goal is to be selective: keep the weights A needs and let the rest move. That balance between keeping old skills and learning new ones is often called the *stability–plasticity* trade-off.
      :::

      A third family keeps separate parts for separate tasks, such as one output head per task. It forgets nothing, but it needs to know which task each input belongs to.
    bridges: []
  - id: continual-and-online-learning.s4
    title: One example at a time, scored by regret
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.continual-and-online-learning
    markdown: |-
      A spam filter sees one email, predicts, learns the true label when the user reacts, updates, and moves on. That's **online learning**: the data arrive as a stream, and the model is scored on every prediction as it goes, with no separate test set. Continual learning cares about keeping old *tasks*; online learning cares about doing well *throughout* the stream.

      How good is "well" when the stream could be anything? Online learning compares you with hindsight. **Regret** is your total loss minus the total loss of the best single fixed model, chosen after seeing the whole stream:

      $$\text{Regret}_T = \sum_{t=1}^{T} \ell_t(w_t) - \min_{w} \sum_{t=1}^{T} \ell_t(w)$$

      Over 10,000 emails, suppose the filter makes 540 mistakes, and the best fixed filter in hindsight would have made 500. Its regret is 40.

      :::predict For convex losses, online gradient descent keeps regret below a constant times √T. What happens to regret per email as the stream grows?
      It shrinks toward zero. √10,000 = 100, so the regret bound per email is proportional to 100 / 10,000 = 0.01; after a million emails, 1,000 / 1,000,000 = 0.001. In the long run the online learner does about as well per example as the best fixed model it could have picked with perfect hindsight.
      :::

      One thing online learning is *not*: an assistant remembering your name mid-conversation. That's memory in its context (the agent memory lesson); its weights never change.
    bridges: []
  - id: continual-and-online-learning.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.continual-and-online-learning
    markdown: EWC penalties to compute by hand, then a medical scanner, a keyboard, a privacy rule, and a news recommender test how to spot, measure, and prevent forgetting.
    takeaway: |-
      Shared weights forget old tasks when trained on new ones. Report accuracy on every task after every stage, and protect old skills with replay or an EWC penalty on the weights that mattered.
  - id: continual-and-online-learning.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.continual-and-online-learning
    markdown: |-
      Track what a model learns and what it forgets over the full sequence. Compare retention methods under the same memory, data-access, and update constraints.
