assessment_families:
  - id: continual-and-online-learning.base
    objective_ref: objective.continual-and-online-learning
    task: base
    response_type: single_choice
    points: 1
    hint: 'See forgetting through interference: trace the inputs, operation, and result before choosing.'
    remediation_scene: continual-and-online-learning.s2
    variants:
      - id: continual-and-online-learning.base.1
        prompt: Does remembering a conversation necessarily mean online weight learning?
        options:
          - id: c
            text: Only if the conversation is long
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Context state and parameter updates are different mechanisms.
        retired: true
      - id: continual-and-online-learning.base.2
        prompt: Task A performance falls after training B. What should be measured?
        options:
          - id: a
            text: Forgetting alongside learning on B
          - id: b
            text: Only the latest B score
          - id: c
            text: Only model file size
        answer: a
        feedback: Retention is central to continual learning.
        retired: true
  - id: continual-and-online-learning.transfer
    objective_ref: objective.continual-and-online-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate over the whole sequence: trace the inputs, operation, and result before choosing.'
    remediation_scene: continual-and-online-learning.s4
    variants:
      - id: continual-and-online-learning.transfer.1
        prompt: What does replay introduce into new updates?
        options:
          - id: a
            text: Selected past examples or generated approximations
          - id: b
            text: Only random task names
          - id: c
            text: A guarantee of no forgetting
        answer: a
        feedback: Replay preserves some earlier training signal.
        retired: true
      - id: continual-and-online-learning.transfer.2
        prompt: Why disclose memory budget?
        options:
          - id: b
            text: Memory never affects the task
          - id: c
            text: Only compute counts matter
          - id: a
            text: Retention methods can rely on very different stored information
        answer: a
        feedback: Storage constraints define the comparison.
        retired: true
  - id: continual-and-online-learning.base.v2
    objective_ref: objective.continual-and-online-learning
    task: base
    response_type: single_choice
    points: 1
    hint: Old skills live in the same weights the new task changes. Ask what each method keeps (old examples, weight importances, or separate parts) and what it measures.
    remediation_scene: continual-and-online-learning.s2
    variants:
      - id: continual-and-online-learning.base.v2.1
        prompt: A model scores 94% on task A, then 52% on A after training on task B. Why did it lose accuracy on A?
        options:
          - id: b
            text: Task B's data overwrote task A's stored examples in memory
          - id: a
            text: Training on B moved shared weights that A's answers depended on
          - id: c
            text: The model ran out of capacity, since two tasks can't fit in one model
        answer: a
        feedback: Gradient steps on B change whatever weights reduce B's loss, including ones A relied on. A network doesn't store examples, and the two-weight demo shows one model can fit both tasks when trained on both.
      - id: continual-and-online-learning.base.v2.2
        prompt: In the two-weight demo, why does training on B alone never find the weights (3, −1) that solve both tasks?
        options:
          - id: c
            text: The learning rate is too small to reach w₂ = −1 in 500 steps
          - id: b
            text: Gradient descent can only reach solutions near its starting point
          - id: a
            text: B's data never involve w₂, so nothing pushes w₂ down to −1
        answer: a
        feedback: B's targets depend on w₁ only, so its gradient never touches w₂, which stays at 1. Replaying A's examples adds the missing pressure on w₁ + w₂. More steps or a bigger learning rate wouldn't change the direction of the updates.
      - id: continual-and-online-learning.base.v2.3
        prompt: What does EWC's penalty do while the model trains on task B?
        options:
          - id: a
            text: It charges more for moving weights that mattered most for task A
          - id: b
            text: It stores a sample of task A's data and mixes it into each batch
          - id: c
            text: It freezes every weight that was changed while learning task A
        answer: a
        feedback: EWC adds (λ/2)·Fᵢ·(θᵢ − θ*ᵢ)², so a weight with high Fisher importance is expensive to move. Storing old data is replay, and freezing everything would leave nothing free to learn B.
      - id: continual-and-online-learning.base.v2.4
        prompt: After three tasks, a model's accuracy on task 1 went from 90% (just after learning it) to 81% (at the end). What is its forgetting on task 1?
        options:
          - id: b
            text: 81 points, its accuracy at the end of the sequence
          - id: c
            text: 10 points, the drop as a share of the 90% starting accuracy
          - id: a
            text: 9 points, its best earlier accuracy minus its final accuracy
        answer: a
        feedback: Forgetting is the best earlier accuracy minus the final one, 90 − 81 = 9 points. The 81% is the final accuracy itself, and 9 / 90 = 10% is a relative drop, not the standard measure.
      - id: continual-and-online-learning.base.v2.5
        prompt: An online spam filter made 540 mistakes over 10,000 emails. The best fixed filter in hindsight would have made 500. What is its regret?
        options:
          - id: a
            text: 40 mistakes, its total minus the best fixed filter's total
          - id: b
            text: 540 mistakes, the total number of mistakes it made
          - id: c
            text: 0.4%, its mistake rate minus the best filter's rate
        answer: a
        feedback: Regret is the learner's total loss minus the best fixed model's total loss in hindsight, 540 − 500 = 40. The raw total ignores the comparison, and 0.4% is the per-email rate (40 / 10,000), not the regret.
  - id: continual-and-online-learning.transfer.v2
    objective_ref: objective.continual-and-online-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: First check whether old data may be kept. If yes, replay is simplest; if not, penalize changes to important weights. Either way, measure every old task after every update.
    remediation_scene: continual-and-online-learning.s3
    variants:
      - id: continual-and-online-learning.transfer.v2.1
        prompt: A hospital updates a scan classifier each quarter with new data, but privacy rules require deleting old scans after each update. Which method fits?
        options:
          - id: b
            text: Replay, with a buffer of scans kept from every earlier quarter
          - id: a
            text: EWC, since it needs only importance values, not old scans
          - id: c
            text: Plain fine-tuning at a much smaller learning rate than before
        answer: a
        feedback: EWC stores per-weight importances and the old weights, not examples, so it respects the deletion rule. Replay needs exactly the stored scans the rule forbids, and a smaller learning rate only slows forgetting.
      - id: continual-and-online-learning.transfer.v2.2
        prompt: A phone keyboard is fine-tuned on a user's new slang each week. A team reports only this week's next-word accuracy, which keeps rising. What else should they measure?
        options:
          - id: c
            text: Training loss on this week's data, to confirm it is still decreasing
          - id: a
            text: Accuracy on earlier weeks' test text, to catch forgetting of old words
          - id: b
            text: How many new words were added to the vocabulary each week
        answer: a
        feedback: Rising accuracy on the newest data can hide falling accuracy on older text. Testing every earlier week after each update is the accuracy-table habit. Training loss and vocabulary growth say nothing about retention.
      - id: continual-and-online-learning.transfer.v2.3
        prompt: A news recommender updates after every click, and topics drift daily. Which evaluation fits how it's used?
        options:
          - id: a
            text: Score every prediction as the stream arrives, and compare with the best fixed model
          - id: b
            text: Hold out last month's clicks and test the final model once on them
          - id: c
            text: Measure accuracy only on the first day's topics, to check for forgetting
        answer: a
        feedback: An online learner is used throughout the stream, so its cumulative loss (and regret against a fixed baseline) is what matters. One test at the end misses how it performed along the way, and old topics may no longer matter when interests drift.
      - id: continual-and-online-learning.transfer.v2.4
        prompt: A robot learns five tools in sequence, and a separate output head is added for each tool. Old tools are never forgotten. What does this design require at test time?
        options:
          - id: b
            text: A buffer of old examples to replay whenever a new tool is added
          - id: c
            text: Fisher importances computed after each tool, stored with the model
          - id: a
            text: Knowing which tool's task each input belongs to, to pick the head
        answer: a
        feedback: Separate heads avoid interference but must be told which head to use, so the task identity is needed at test time. Replay buffers and Fisher values belong to other continual-learning methods.
      - id: continual-and-online-learning.transfer.v2.5
        prompt: A support chatbot correctly uses a customer's name later in the same chat. A manager says it's doing continual learning. What is actually happening?
        options:
          - id: a
            text: The name is in the conversation context; the weights haven't changed
          - id: b
            text: The weights are updated after each message, as in online learning
          - id: c
            text: The model replays earlier chats with the customer to protect memory
        answer: a
        feedback: Within a chat, the model reads its context; no training step runs. Continual and online learning both update weights. Replay is a training technique, not how a chat model recalls earlier messages.
  - id: continual-and-online-learning.calculate
    objective_ref: objective.continual-and-online-learning
    task: base
    response_type: numeric
    points: 1
    hint: For each weight, square its move, multiply by its Fisher value, add the terms, and multiply the sum by λ/2.
    remediation_scene: continual-and-online-learning.s3
    absolute_tolerance: 0.01
    variants:
      - id: continual-and-online-learning.calculate.1
        prompt: Two weights have Fisher values F = (4, 1). Training on task B moves each by 1 from its task-A value, and λ = 2. What is the EWC penalty?
        answer: 5
        feedback: λ/2 = 1, and 4 × 1² + 1 × 1² = 5, so the penalty is 1 × 5 = 5.
      - id: continual-and-online-learning.calculate.2
        prompt: Two weights have Fisher values F = (10, 0.5). They move by 0.2 and 2 from their task-A values, with λ = 1. What is the EWC penalty?
        answer: 1.2
        feedback: 10 × 0.04 + 0.5 × 4 = 0.4 + 2 = 2.4, and λ/2 = 0.5, so the penalty is 1.2.
      - id: continual-and-online-learning.calculate.3
        prompt: With λ = 4, a weight with Fisher value 3 moves by 1 and a weight with Fisher value 0 moves by 5. What is the EWC penalty?
        answer: 6
        feedback: 3 × 1² + 0 × 5² = 3, and λ/2 = 2, so the penalty is 6. The weight with Fisher value 0 moves freely.
      - id: continual-and-online-learning.calculate.4
        prompt: After task A, the weights are (1.0, −0.5) with Fisher values (8, 2). During task B they reach (1.5, 0.5). With λ = 1, what is the EWC penalty?
        answer: 2
        feedback: The moves are 0.5 and 1.0. 8 × 0.25 + 2 × 1 = 4, and λ/2 = 0.5, so the penalty is 2.
      - id: continual-and-online-learning.calculate.5
        prompt: With λ = 10, two weights with Fisher values 0.2 and 0.05 move by 1 and 2. What is the EWC penalty?
        answer: 2
        feedback: 0.2 × 1 + 0.05 × 4 = 0.4, and λ/2 = 5, so the penalty is 2.
