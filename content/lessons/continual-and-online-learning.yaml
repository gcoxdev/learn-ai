  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Continual and online learning update models as experience arrives; replay, regularization, and
    modularity address retention under explicit memory and task-boundary assumptions.
