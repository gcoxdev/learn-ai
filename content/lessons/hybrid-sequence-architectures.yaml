assessment_families:
  - id: hybrid-sequence-architectures.base
    objective_ref: objective.hybrid-sequence-architectures
    task: base
    response_type: single_choice
    points: 1
    hint: Compare what each layer type keeps from the past.
    remediation_scene: hybrid-sequence-architectures.s1
    variants:
      - id: hybrid-sequence-architectures.base.1
        prompt: What does direct attention access differ from?
        options:
          - id: a
            text: Reading only a compressed recurrent summary
          - id: b
            text: Any use of matrix multiplication
          - id: c
            text: All forms of learned representation
        answer: a
        feedback: The memory interface differs even when both learn parameters.
        retired: true
      - id: hybrid-sequence-architectures.base.2
        prompt: Does naming attention and recurrence fully specify a hybrid?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if dimensions are omitted
          - id: a
            text: No; arrangement and interfaces are required
        answer: a
        feedback: Composition determines actual computation.
        retired: true
  - id: hybrid-sequence-architectures.transfer
    objective_ref: objective.hybrid-sequence-architectures
    task: transfer
    response_type: single_choice
    points: 1
    hint: Only attention layers grow a cache; the weights stay the same size.
    remediation_scene: hybrid-sequence-architectures.s4
    variants:
      - id: hybrid-sequence-architectures.transfer.1
        prompt: Two cached-attention layers replace eight. Is total model memory necessarily quartered?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only model name matters
          - id: a
            text: No; other state and weights remain
        answer: a
        feedback: Reducing one allocation does not scale the entire budget equally.
        retired: true
      - id: hybrid-sequence-architectures.transfer.2
        prompt: What helps identify why a hybrid improved?
        options:
          - id: c
            text: Only total download size
          - id: a
            text: Matched ablations of components and placement
          - id: b
            text: Only a larger advertised context limit
        answer: a
        feedback: Controlled comparisons test the proposed mechanism.
        retired: true
  - id: hybrid-sequence-architectures.base.v2
    objective_ref: objective.hybrid-sequence-architectures
    task: base
    response_type: single_choice
    points: 1
    hint: "Attention layers look things up exactly and grow a cache; Mamba layers keep a fixed state cheaply. Ask which property the question is about."
    remediation_scene: hybrid-sequence-architectures.s2
    variants:
      - id: hybrid-sequence-architectures.base.v2.1
        prompt: Jamba is mostly Mamba layers. What did its authors find the few attention layers add?
        options:
          - id: b
            text: Faster processing of long inputs than the Mamba layers give
          - id: a
            text: In-context skills, such as using the label format from few-shot examples
          - id: c
            text: A place for the mixture-of-experts layers, which need attention to route
        answer: a
        feedback: A pure Mamba model often ignored the "Positive"/"Negative" format; the hybrid followed it, and some of its attention heads focused on the example labels. Attention is the slower layer at long lengths, and MoE routing doesn't depend on attention.
      - id: hybrid-sequence-architectures.base.v2.2
        prompt: A 32-layer transformer becomes a hybrid with 4 attention layers and 28 Mamba layers, same KV heads. Which part of its inference memory shrinks about 8×?
        options:
          - id: a
            text: The KV cache, since only attention layers store keys and values
          - id: c
            text: The weights, since Mamba layers need fewer parameters per layer
          - id: b
            text: The total, since the cache and the weights both scale with layers
        answer: a
        feedback: The cache counts attention layers only, so 32 → 4 cuts it 8×. The weights don't shrink 8× (Mamba layers have parameters too), and the Mamba layers add their own small fixed states.
      - id: hybrid-sequence-architectures.base.v2.3
        prompt: Jamba has 52B total parameters but only 12B active per token. Which design choice explains the gap?
        options:
          - id: c
            text: Its Mamba layers skip tokens that the router scores as unimportant
          - id: b
            text: Its attention layers share one set of weights across all four blocks
          - id: a
            text: Its mixture-of-experts layers run 2 of 16 experts for each token
        answer: a
        feedback: Every other layer is an MoE layer, and top-2 routing means most expert weights sit idle for any one token. Mamba's selection changes the state update, not which parameters run, and the attention layers aren't shared.
      - id: hybrid-sequence-architectures.base.v2.4
        prompt: Two teams both describe their model as "Mamba plus attention". One alternates the layers; the other feeds each layer's input to a Mamba branch and an attention branch side by side and adds the results. What follows?
        options:
          - id: a
            text: They compute different functions, so the ingredient list doesn't define the model
          - id: b
            text: They compute the same function, since addition doesn't depend on order
          - id: c
            text: They differ only in speed, since both use each mechanism the same number of times
        answer: a
        feedback: In the stacked design, attention reads the Mamba layer's output; in the parallel one, both read the same input. Those are different computations with different results, which is why a hybrid must specify its arrangement.
  - id: hybrid-sequence-architectures.transfer.v2
    objective_ref: objective.hybrid-sequence-architectures
    task: transfer
    response_type: single_choice
    points: 1
    hint: "First ask whether the task needs exact lookups from far back. Then, to credit the design, change one thing at a time against matched baselines."
    remediation_scene: hybrid-sequence-architectures.s4
    variants:
      - id: hybrid-sequence-architectures.transfer.v2.1
        prompt: A legal-search tool must quote exact clause numbers from 200,000-token contracts on one GPU. The team is choosing a backbone. Which fits best?
        options:
          - id: b
            text: A pure Mamba model, since its memory stays flat at 200,000 tokens
          - id: a
            text: A hybrid with a few attention layers among many Mamba layers
          - id: c
            text: A full-attention transformer with multi-head (not grouped) KV heads
        answer: a
        feedback: Exact quoting is the lookup skill pure SSMs lack, and a full multi-head transformer's cache at 200K tokens is huge. A hybrid keeps a few exact-lookup layers with a much smaller cache.
      - id: hybrid-sequence-architectures.transfer.v2.2
        prompt: A new hybrid beats the team's old transformer, but it was also trained on twice as much data. How can they find out whether the hybrid design helped?
        options:
          - id: c
            text: Report the gain as the hybrid's, since the architecture is the change they care about
          - id: a
            text: Train a transformer and a pure SSM on the same data and budget, and vary the ratio
          - id: b
            text: Compare the two models' KV caches, since a smaller cache shows the design worked
        answer: a
        feedback: With the data doubled, the gain could come from the data alone. Matched baselines and one-change-at-a-time ablations, like Jamba's 1:3 versus 1:7 test, isolate the design's effect. Cache size measures memory, not quality.
      - id: hybrid-sequence-architectures.transfer.v2.3
        prompt: A factory wants a model that watches a live vibration stream and raises an alarm when the pattern drifts. It never needs to quote an old reading. Which backbone is the sensible first choice?
        options:
          - id: a
            text: A pure SSM, since the task rewards cheap tracking of the recent pattern
          - id: b
            text: A hybrid, since a few attention layers make any sequence model better
          - id: c
            text: A full transformer, since long streams need every past reading kept
        answer: a
        feedback: This task needs the gist of a stream at constant cost per step, the SSM's strength. Attention layers pay off when exact lookups matter, and keeping every reading forever would make memory grow without bound.
      - id: hybrid-sequence-architectures.transfer.v2.4
        prompt: "A vendor says: \"Our hybrid supports a 256K context, and its KV cache is only 4 GB.\" What should you test before relying on it for long-document question answering?"
        options:
          - id: b
            text: Whether the 4 GB figure holds at batch size 1 on your own GPU
          - id: c
            text: Whether the model loads a 256K-token prompt without an error
          - id: a
            text: Whether it answers from evidence placed at many positions in long inputs
        answer: a
        feedback: A small cache and an accepted input length say nothing about whether the model can find and use evidence 200K tokens back. The next lesson shows how to test that. Loading without an error is the weakest possible check.
  - id: hybrid-sequence-architectures.cache
    objective_ref: objective.hybrid-sequence-architectures
    task: base
    response_type: numeric
    points: 1
    hint: "Count attention layers only: 2 × attention layers × KV heads × head width × tokens × bytes. 1 GiB = 1,024³ bytes, and 256K = 262,144 tokens."
    remediation_scene: hybrid-sequence-architectures.s3
    absolute_tolerance: 0.01
    variants:
      - id: hybrid-sequence-architectures.cache.1
        prompt: A hybrid has 32 layers, 4 of them attention, each with 8 KV heads of width 128, and a 2-byte cache. How many GiB of KV cache does a 262,144-token context need?
        answer: 4
        feedback: "2 × 4 × 8 × 128 × 262,144 × 2 = 4,294,967,296 bytes = 4 GiB. With all 32 layers as attention it would be 32 GiB."
      - id: hybrid-sequence-architectures.cache.2
        prompt: A 48-layer hybrid uses attention in 1 layer out of every 6. Each attention layer has 8 KV heads of width 128, with a 2-byte cache. How many GiB of KV cache for a 131,072-token context?
        answer: 4
        feedback: "48 ÷ 6 = 8 attention layers. 2 × 8 × 8 × 128 × 131,072 × 2 = 4 GiB."
      - id: hybrid-sequence-architectures.cache.3
        prompt: A 64-layer hybrid uses attention in 1 layer out of every 8. Each attention layer has 4 KV heads of width 128, with a 2-byte cache. How many GiB of KV cache for a 65,536-token context?
        answer: 1
        feedback: "64 ÷ 8 = 8 attention layers. 2 × 8 × 4 × 128 × 65,536 × 2 = 1,073,741,824 bytes = 1 GiB."
      - id: hybrid-sequence-architectures.cache.4
        prompt: A pure transformer has 32 layers, each with 32 KV heads of width 128, and a 2-byte cache. How many GiB of KV cache does a 262,144-token context need?
        answer: 128
        feedback: "2 × 32 × 32 × 128 × 262,144 × 2 = 128 GiB, the Llama-2-7B figure in the Jamba paper's comparison."
      - id: hybrid-sequence-architectures.cache.5
        prompt: A 32-layer hybrid with an attention-to-Mamba ratio of 1:3 has 8 KV heads of width 128 per attention layer and a 2-byte cache. How many GiB of KV cache for a 262,144-token context?
        answer: 8
        feedback: "1:3 means 1 attention layer in every 4, so 8 attention layers. 2 × 8 × 8 × 128 × 262,144 × 2 = 8 GiB."
