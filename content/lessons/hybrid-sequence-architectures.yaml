schema_version: 0.2-draft
lesson:
  id: hybrid-sequence-architectures
  version: 0.1.0-draft
  title: Combine attention, recurrence, and convolution deliberately
  state: draft
  summary: Hybrid sequence models mix mechanisms with different memory and communication properties; the arrangement,
    shared dimensions, and evaluation determine whether the combination helps.
  slot: M19.6
  category: learning
  sources:
  - title: 'Jamba: A Hybrid Transformer-Mamba Language Model'
    url: https://arxiv.org/abs/2403.19887
  - title: Griffin
    url: https://arxiv.org/abs/2402.19427
objectives:
- id: objective.hybrid-sequence-architectures
  version: 1-draft
  statement: Hybrid sequence models mix mechanisms with different memory and communication properties; the arrangement,
    shared dimensions, and evaluation determine whether the combination helps.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - hybrid-sequence-architectures.base
  - hybrid-sequence-architectures.transfer
  prerequisites:
  - anyOf:
    - objective.selective-state-spaces
  - anyOf:
    - objective.attention-patterns
  - anyOf:
    - objective.shared-and-latent-kv
scenes:
- id: hybrid-sequence-architectures.s1
  title: Different mechanisms offer different access
  type: explanation
  depth: intuition
  objective_refs:
  - objective.hybrid-sequence-architectures
  markdown: Attention can directly compare a query against retained token states. Recurrence compresses history
    into evolving state. Convolution emphasizes structured neighborhoods. A hybrid can use several mechanisms to
    balance access, compute, and memory, but adding components also changes training and implementation complexity.
  text_mode: Attention can directly compare a query against retained token states. Recurrence compresses history
    into evolving state. Convolution emphasizes structured neighborhoods. A hybrid can use several mechanisms to
    balance access, compute, and memory, but adding components also changes training and implementation complexity.
  bridges: []
- id: hybrid-sequence-architectures.s2
  title: Specify where the mechanisms meet
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.hybrid-sequence-architectures
  markdown: A design might alternate recurrent and attention blocks, combine their outputs within a block, or reserve
    attention for selected layers. Specify the residual path, normalization, widths, and position handling. A list
    of ingredient names is not an executable architecture description.
  text_mode: A design might alternate recurrent and attention blocks, combine their outputs within a block, or reserve
    attention for selected layers. Specify the residual path, normalization, widths, and position handling. A list
    of ingredient names is not an executable architecture description.
  bridges: []
- id: hybrid-sequence-architectures.s3
  title: Count each kind of state
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.hybrid-sequence-architectures
  markdown: Suppose only two of eight layers use cached attention and six use fixed recurrent states. The attention
    portion of cache growth may shrink compared with eight attention layers, but the recurrent states and all weights
    remain. Exact savings depend on head shapes, precision, and architecture.
  text_mode: Suppose only two of eight layers use cached attention and six use fixed recurrent states. The attention
    portion of cache growth may shrink compared with eight attention layers, but the recurrent states and all weights
    remain. Exact savings depend on head shapes, precision, and architecture.
  bridges: []
- id: hybrid-sequence-architectures.s4
  title: Use ablations to test the combination
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.hybrid-sequence-architectures
  markdown: Compare the hybrid with appropriately matched attention-only and recurrent alternatives. Include retrieval,
    language tasks, context lengths, training budget, and hardware throughput. If the hybrid wins, ablations help
    identify which placement or mechanism matters instead of attributing every improvement to the name hybrid.
  text_mode: Compare the hybrid with appropriately matched attention-only and recurrent alternatives. Include retrieval,
    language tasks, context lengths, training budget, and hardware throughput. If the hybrid wins, ablations help
    identify which placement or mechanism matters instead of attributing every improvement to the name hybrid.
  bridges: []
- id: hybrid-sequence-architectures.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.hybrid-sequence-architectures
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Hybrid sequence models mix mechanisms with different memory and communication properties; the arrangement,
    shared dimensions, and evaluation determine whether the combination helps.
