assessment_families:
- id: hybrid-sequence-architectures.base
  objective_ref: objective.hybrid-sequence-architectures
  task: base
  response_type: single_choice
  points: 1
  hint: 'Specify where the mechanisms meet: trace the inputs, operation, and result before choosing.'
  remediation_scene: hybrid-sequence-architectures.s2
  variants:
  - id: hybrid-sequence-architectures.base.1
    prompt: What does direct attention access differ from?
    options:
    - id: a
      text: Reading only a compressed recurrent summary
    - id: b
      text: Any use of matrix multiplication
    - id: c
      text: All forms of learned representation
    answer: a
    feedback: The memory interface differs even when both learn parameters.
  - id: hybrid-sequence-architectures.base.2
    prompt: Does naming attention and recurrence fully specify a hybrid?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if dimensions are omitted
    - id: a
      text: No; arrangement and interfaces are required
    answer: a
    feedback: Composition determines actual computation.
- id: hybrid-sequence-architectures.transfer
  objective_ref: objective.hybrid-sequence-architectures
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Use ablations to test the combination: trace the inputs, operation, and result before choosing.'
  remediation_scene: hybrid-sequence-architectures.s4
  variants:
  - id: hybrid-sequence-architectures.transfer.1
    prompt: Two cached-attention layers replace eight. Is total model memory necessarily quartered?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only model name matters
    - id: a
      text: No; other state and weights remain
    answer: a
    feedback: Reducing one allocation does not scale the entire budget equally.
  - id: hybrid-sequence-architectures.transfer.2
    prompt: What helps identify why a hybrid improved?
    options:
    - id: c
      text: Only total download size
    - id: a
      text: Matched ablations of components and placement
    - id: b
      text: Only a larger advertised context limit
    answer: a
    feedback: Controlled comparisons test the proposed mechanism.
