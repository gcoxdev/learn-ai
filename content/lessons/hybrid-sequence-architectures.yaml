schema_version: 0.2-draft
lesson:
  id: hybrid-sequence-architectures
  version: 0.4.0-draft
  title: Combine attention, recurrence, and convolution deliberately
  state: draft
  summary: Attention looks things up exactly but its cache keeps growing; Mamba's memory is fixed but blurry. Jamba keeps one attention layer in eight, and here is why that ratio works.
  slot: M19.6
  category: learning
  sources:
    - title: "Jamba: A Hybrid Transformer-Mamba Language Model (Lieber et al., 2024)"
      url: https://arxiv.org/abs/2403.19887
    - title: "An Empirical Study of Mamba-based Language Models (Waleffe et al., 2024)"
      url: https://arxiv.org/abs/2406.07887
    - title: "Repeat After Me: Transformers are Better than State Space Models at Copying (Jelassi et al., 2024)"
      url: https://arxiv.org/abs/2402.01032
    - title: "Griffin: Mixing Gated Linear Recurrences with Local Attention for Efficient Language Models (De et al., 2024)"
      url: https://arxiv.org/abs/2402.19427
objectives:
  - id: objective.hybrid-sequence-architectures
    version: 2-draft
    statement: Hybrid sequence models mix mechanisms with different memory and communication properties; the arrangement, shared dimensions, and evaluation determine whether the combination helps.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - hybrid-sequence-architectures.base.v2
      - hybrid-sequence-architectures.transfer.v2
      - hybrid-sequence-architectures.cache
    prerequisites:
      - anyOf:
          - objective.selective-state-spaces
      - anyOf:
          - objective.attention-patterns
      - anyOf:
          - objective.shared-and-latent-kv
scenes:
  - id: hybrid-sequence-architectures.s1
    title: Two memories, two strengths
    type: explanation
    depth: intuition
    objective_refs:
      - objective.hybrid-sequence-architectures
    markdown: |-
      Our coding assistant has two jobs. Across a 250,000-token repository, it must keep the general drift: what the code is for, which style it uses. And now and then it must quote one exact thing: the name `parse_invoice_v2`, defined 180,000 tokens back.

      The last five lessons gave us two kinds of layer, and each is good at one job:

      | | Attention layer | Selective SSM layer (Mamba) |
      | --- | --- | --- |
      | What it keeps per layer | Keys and values for every past token | One fixed-size state |
      | Memory at 250K tokens | Grows with every token | Same as at 1K tokens |
      | Work per new token | Grows with context length | Constant |
      | Exact lookup of one old token | Direct: compare the query with its key | Only if the state happened to keep it |
      | Gist of a long stream | Yes, at quadratic cost | Yes, cheaply |

      A **hybrid architecture** stacks both kinds of layer in one model, so the cheap layers carry most of the sequence and a few attention layers handle exact lookups. Google DeepMind's Griffin (2024) mixed gated recurrent layers with local attention. AI21's **Jamba** (March 2024) mixed Mamba layers with full attention layers and added mixture-of-experts on top. Before building one, it helps to know exactly what pure SSMs get wrong.
    bridges: []
  - id: hybrid-sequence-architectures.s2
    title: Where pure SSMs stumble
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.hybrid-sequence-architectures
    markdown: |-
      Three lines of evidence point to the same weakness.

      - **Copying.** Jelassi et al. (2024) proved that a two-layer transformer can copy strings whose length is exponential in its number of heads, while any fixed-state model is limited by the size of its state. In their experiments, transformers beat state-space models at copying and at looking up a number in a phone book given in the prompt.
      - **Following a format from examples.** In Jamba's ablations, a pure Mamba model shown few-shot movie-review examples labeled "Positive" or "Negative" often answered "Very Good", "Funny", or "3/10" instead. The hybrid used the labels correctly, and the authors found attention heads in it that focused on the label tokens of the examples.
      - **Controlled scale-up.** NVIDIA trained 8B-parameter transformer, Mamba, Mamba-2, and hybrid models on the same data (Waleffe et al., 2024). The pure SSMs lagged on five-shot MMLU and phone-book lookup. A hybrid with 43% Mamba-2 layers, 7% attention layers, and 50% MLP layers beat the transformer on all 12 of their standard tasks, by 2.65 points on average, and was projected to generate up to 8× faster.

      :::predict In NVIDIA's hybrid, only 7% of the layers are attention. Why might so few be enough?
      Lookup doesn't have to happen in every layer. Once an attention layer has pulled the exact old token into the current position's vector, the Mamba layers after it can carry and process it like any other information. The attention layers act as occasional "look back exactly" steps between long stretches of cheap processing.
      :::

      :::mixup "A hybrid is a pure SSM with attention bolted on for safety."
      In NVIDIA's study the hybrid beat the pure transformer on all 12 standard tasks, and in Jamba's ablations the hybrid beat both the pure transformer and the pure Mamba model on standard benchmarks. The two layer types complement each other, which is why the combination can beat both of its parents.
      :::
    bridges: []
  - id: hybrid-sequence-architectures.s3
    title: Count each kind of state
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.hybrid-sequence-architectures
    markdown: |-
      Only attention layers keep a KV cache, so a hybrid's cache formula is the one from the lesson on sharing keys and values with *attention* layers in place of all layers:

      $$\text{KV bytes} = 2 \times L_{\text{attn}} \times \text{kv\_heads} \times \text{head\_dim} \times T \times \text{bytes per value}$$

      The SSM layers add a fixed amount that doesn't depend on $T$. The Jamba paper compared caches at 256K tokens in 16-bit: 128 GB for Llama-2 7B, 32 GB for Mistral 7B, and 4 GB for Jamba. You can check the first two: Llama-2 7B has 32 layers of 32 heads with width 128, and Mistral 7B shares 8 KV heads. A Jamba-like model keeps 4 attention layers out of 32.

      ```python run
      def kv_gib(attn_layers, kv_heads, head_dim, tokens, bytes_per_value=2):
          return 2 * attn_layers * kv_heads * head_dim * tokens * bytes_per_value / 2**30

      T = 256 * 1024                                   # a 256K-token context
      print(f"32 attention layers, 32 KV heads (Llama-2-7B-like): {kv_gib(32, 32, 128, T):6.1f} GiB")
      print(f"32 attention layers,  8 KV heads (Mistral-7B-like): {kv_gib(32, 8, 128, T):6.1f} GiB")

      for mamba_per_attn in [0, 1, 3, 7]:              # attention : Mamba ratio 1 : m, 32 layers total
          attn = 32 // (1 + mamba_per_attn)
          print(f"ratio 1:{mamba_per_attn}  -> {attn:2d} attention layers, "
                f"{32 - attn:2d} Mamba layers, KV cache {kv_gib(attn, 8, 128, T):5.1f} GiB")
      ```

      At a 1:7 ratio, the cache is 4 GiB, an eighth of the all-attention version with the same KV heads. Try `T = 1024 * 1024` for a million-token context: 16 GiB at 1:7 versus 128 GiB with no Mamba layers.

      Two numbers don't shrink. The weights are all still there, and the Mamba layers' fixed states are small but not zero. So an 8× smaller cache means 8× more room for context or users only when the cache was what filled the GPU.
    bridges: []
  - id: hybrid-sequence-architectures.s4
    title: Jamba, layer by layer
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.hybrid-sequence-architectures
    markdown: |-
      "Mamba plus attention" is not yet a design. You also have to say how many of each, in what order, and what sits between them. Some designs even run an attention branch and an SSM branch side by side on the same input and combine their outputs, which computes something different from stacking them. Jamba's released model specifies:

      - **4 Jamba blocks**, each with 8 layers: 1 attention layer and 7 Mamba layers (the ratio $a{:}m = 1{:}7$).
      - **Mixture-of-experts in every other layer**: 16 experts, of which the router picks 2 per token (the top-k routing from module 18, with k = 2). That gives 52B parameters in total but only 12B active per token.
      - **No explicit positional encoding.** The authors found it unnecessary, since the Mamba layers already see tokens in order.

      It supports contexts up to 256K tokens, and with 8-bit weights it fits on a single 80 GB GPU while processing a 140K-token text.

      How did they pick 1:7? By **ablation**: training otherwise-matched models that differ in one choice. In their experiments, 1:3 and 1:7 performed similarly, and 1:7 was the more compute-efficient. That is the habit to copy. When a hybrid wins, vary one thing at a time (the ratio, where the attention layers sit, whether MoE is on) with the same data and budget, and include the pure transformer and the pure SSM as baselines. Otherwise you can't tell whether the gain came from the mix or from something else that changed.

      A hybrid isn't always the answer, though. A sensor model that flags anomalies in a live stream never has to quote an old reading exactly, so a pure SSM can be the better choice.
    diagram:
      caption: One Jamba block. The released model stacks four of these.
      description: "Tokens enter a block of eight layers. Seven are Mamba layers and one is an attention layer; as in the released model's configuration, the drawing shows four Mamba layers, then the attention layer, then three Mamba layers. Every other layer uses a mixture-of-experts feed-forward (16 experts, top 2) instead of a plain MLP. Only the attention layer writes to the KV cache; each Mamba layer keeps a fixed-size state."
      nodes:
        - id: in
          label: Tokens in
          col: 0
          row: 1
          tone: data
        - id: m1
          label: 4 Mamba layers
          note: fixed-size states
          col: 1
          row: 1
        - id: attn
          label: 1 attention layer
          note: exact lookup
          col: 2
          row: 1
          tone: accent
        - id: m2
          label: 3 Mamba layers
          note: fixed-size states
          col: 3
          row: 1
        - id: out
          label: To next block
          col: 4
          row: 1
          tone: data
        - id: cache
          label: KV cache
          note: grows with context
          col: 2
          row: 2
          tone: warn
        - id: moe
          label: MoE in every other layer
          note: 16 experts, top 2
          col: 2
          row: 0
          tone: muted
      edges:
        - from: in
          to: m1
        - from: m1
          to: attn
        - from: attn
          to: m2
        - from: m2
          to: out
        - from: attn
          to: cache
          label: reads and writes
        - from: moe
          to: m1
          dashed: true
        - from: moe
          to: m2
          dashed: true
    bridges: []
  - id: hybrid-sequence-architectures.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.hybrid-sequence-architectures
    markdown: Size the KV cache of hybrids with different ratios, then design and test hybrids for document search, a streaming sensor, and a 256K-token claim.
    takeaway: |-
      Pure SSMs are cheap but weak at exact copying and lookup; a few attention layers restore that. Only the attention layers grow a KV cache, so a 1:7 attention-to-Mamba ratio cuts it eightfold, and ablations show which part of the mix earns its place.
  - id: hybrid-sequence-architectures.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.hybrid-sequence-architectures
    markdown: |-
      A hybrid can combine direct attention access with compact recurrent memory. Specify how the blocks connect and count both the growing cache and the fixed state.
