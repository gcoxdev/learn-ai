schema_version: 0.2-draft
lesson:
  id: quantization-pruning-and-compression
  version: 0.1.0-draft
  title: Reduce deployment cost while measuring what changes
  state: draft
  summary: Quantization lowers numerical precision, pruning removes selected parameters or structures, and distillation
    trains a different model; each changes costs and can affect quality in workload-dependent ways.
  slot: M27.5
  category: learning
  minutes: 12
  sources:
  - title: GPTQ
    url: https://arxiv.org/abs/2210.17323
  - title: AWQ
    url: https://arxiv.org/abs/2306.00978
  - title: Learning both Weights and Connections
    url: https://arxiv.org/abs/1506.02626
objectives:
- id: objective.quantization-pruning-and-compression
  version: 1-draft
  statement: Quantization lowers numerical precision, pruning removes selected parameters or structures, and distillation
    trains a different model; each changes costs and can affect quality in workload-dependent ways.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - quantization-pruning-and-compression.base
  - quantization-pruning-and-compression.transfer
  prerequisites:
