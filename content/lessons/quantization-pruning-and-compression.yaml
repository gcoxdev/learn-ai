assessment_families:
- id: quantization-pruning-and-compression.base
  objective_ref: objective.quantization-pruning-and-compression
  task: base
  response_type: single_choice
  points: 1
  hint: 'Calibrate representative ranges: trace the inputs, operation, and result before choosing.'
  remediation_scene: quantization-pruning-and-compression.s2
  variants:
  - id: quantization-pruning-and-compression.base.1
    prompt: What error sources can quantization introduce?
    options:
    - id: a
      text: Rounding and clipping
    - id: b
      text: Only new vocabulary words
    - id: c
      text: Guaranteed zero approximation
    answer: a
    feedback: Finite representations approximate real values.
  - id: quantization-pruning-and-compression.base.2
    prompt: Why can unstructured zeros fail to speed up a dense kernel?
    options:
    - id: b
      text: Zero weights always remove hardware work
    - id: c
      text: Only file names determine execution
    - id: a
      text: The kernel may still execute the same dense operations
    answer: a
    feedback: Hardware must exploit the sparsity pattern.
- id: quantization-pruning-and-compression.transfer
  objective_ref: objective.quantization-pruning-and-compression
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Measure the actual deployment: trace the inputs, operation, and result before choosing.'
  remediation_scene: quantization-pruning-and-compression.s4
  variants:
  - id: quantization-pruning-and-compression.transfer.1
    prompt: Calibration misses deployment outliers. What can happen?
    options:
    - id: b
      text: All values become exact
    - id: c
      text: The model necessarily gains accuracy
    - id: a
      text: Important values may clip or lose precision
    answer: a
    feedback: Range estimates can fail under distribution shift.
  - id: quantization-pruning-and-compression.transfer.2
    prompt: Does a smaller model file guarantee faster responses?
    options:
    - id: c
      text: Only if it uses integers
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Runtime depends on kernels, transfers, and workload.
