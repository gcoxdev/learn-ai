assessment_families:
  - id: quantization-pruning-and-compression.base
    objective_ref: objective.quantization-pruning-and-compression
    task: base
    response_type: single_choice
    points: 1
    hint: 'Calibrate representative ranges: trace the inputs, operation, and result before choosing.'
    remediation_scene: quantization-pruning-and-compression.s2
    variants:
      - id: quantization-pruning-and-compression.base.1
        retired: true
        prompt: What error sources can quantization introduce?
        options:
          - id: a
            text: Rounding and clipping
          - id: b
            text: Only new vocabulary words
          - id: c
            text: Guaranteed zero approximation
        answer: a
        feedback: Finite representations approximate real values.
      - id: quantization-pruning-and-compression.base.2
        retired: true
        prompt: Why can unstructured zeros fail to speed up a dense kernel?
        options:
          - id: b
            text: Zero weights always remove hardware work
          - id: c
            text: Only file names determine execution
          - id: a
            text: The kernel may still execute the same dense operations
        answer: a
        feedback: Hardware must exploit the sparsity pattern.
  - id: quantization-pruning-and-compression.transfer
    objective_ref: objective.quantization-pruning-and-compression
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Measure the actual deployment: trace the inputs, operation, and result before choosing.'
    remediation_scene: quantization-pruning-and-compression.s4
    variants:
      - id: quantization-pruning-and-compression.transfer.1
        retired: true
        prompt: Calibration misses deployment outliers. What can happen?
        options:
          - id: b
            text: All values become exact
          - id: c
            text: The model necessarily gains accuracy
          - id: a
            text: Important values may clip or lose precision
        answer: a
        feedback: Range estimates can fail under distribution shift.
      - id: quantization-pruning-and-compression.transfer.2
        retired: true
        prompt: Does a smaller model file guarantee faster responses?
        options:
          - id: c
            text: Only if it uses integers
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Runtime depends on kernels, transfers, and workload.
  - id: quantization-pruning-and-compression.base.v2
    objective_ref: objective.quantization-pruning-and-compression
    task: base
    response_type: single_choice
    points: 1
    hint: Ask what sets the scale (the largest value in the group), what bottleneck each phase hits (bytes for decode, arithmetic for prefill), and what the calibration data is used for.
    remediation_scene: quantization-pruning-and-compression.s2
    variants:
      - id: quantization-pruning-and-compression.base.v2.1
        prompt: One weight in a row of 4,096 is 25 times larger than the others. With a single int4 scale for the whole row, what happens?
        options:
          - id: b
            text: The outlier is clipped to the top code, and the other weights stay precise
          - id: a
            text: The scale stretches to fit the outlier, and most small weights round to 0
          - id: c
            text: Little changes, because rounding errors average out across the row
        answer: a
        feedback: The scale is the largest magnitude divided by 7, so one huge weight makes each step huge and the ordinary weights fall below half a step. Symmetric scaling fits the outlier rather than clipping it, and those zeros are biased errors that don't cancel out.
      - id: quantization-pruning-and-compression.base.v2.2
        prompt: Why does 4-bit weight-only quantization speed up decoding for one user but barely help a long prefill?
        options:
          - id: c
            text: Decode skips dequantizing the weights, while prefill must dequantize each one
          - id: b
            text: Prefill reads the KV cache, which weight-only quantization keeps in 16 bits
          - id: a
            text: Decode is limited by bytes read, while prefill is limited by 16-bit arithmetic
        answer: a
        feedback: Reading a quarter of the bytes speeds up a memory-bound step. Prefill's time goes into matrix math, which still runs in 16 bits after the codes are expanded, so it gains little. Both phases dequantize.
      - id: quantization-pruning-and-compression.base.v2.3
        prompt: What does GPTQ do right after rounding one column of a weight matrix?
        options:
          - id: a
            text: Adjusts the columns not yet rounded to cancel that error in the outputs
          - id: b
            text: Briefly retrains the model with gradients to recover the lost accuracy
          - id: c
            text: Saves the rounding error so it can be added back when the model runs
        answer: a
        feedback: GPTQ minimizes the change in the layer's outputs on calibration inputs, so later columns compensate for earlier rounding. It needs no gradient training, and it stores nothing extra beyond the codes and scales.
      - id: quantization-pruning-and-compression.base.v2.4
        prompt: How does AWQ decide which weight channels to protect before 4-bit quantization?
        options:
          - id: b
            text: It keeps the largest weights, since big weights carry the most signal
          - id: a
            text: It looks for the channels whose input activations are largest
          - id: c
            text: It protects the layers nearest the output, since errors pile up there
        answer: a
        feedback: A weight's rounding error is multiplied by the activation it meets, so AWQ ranks channels by activation size on calibration data. That's the key point of the paper, and it's why the largest weights aren't necessarily the important ones.
      - id: quantization-pruning-and-compression.base.v2.5
        prompt: A team zeros 50% of a model's weights at scattered positions, but inference on its GPU is no faster. Why?
        options:
          - id: c
            text: Pruning speeds up training, but inference ignores which weights are zero
          - id: a
            text: A dense kernel still stores and multiplies every entry, zeros included
          - id: b
            text: The zeroed weights are restored from a backup when the model loads
        answer: a
        feedback: Scattered zeros are still stored and computed by dense kernels. To gain speed, the sparsity needs a pattern the hardware can skip, such as whole channels or the 2-out-of-4 pattern.
  - id: quantization-pruning-and-compression.transfer.v2
    objective_ref: objective.quantization-pruning-and-compression
    task: transfer
    response_type: single_choice
    points: 1
    hint: Match the method to the bottleneck (memory, bytes per step, or arithmetic), and test quality on the inputs the product will really see.
    remediation_scene: quantization-pruning-and-compression.s4
    variants:
      - id: quantization-pruning-and-compression.transfer.v2.1
        prompt: A startup quantizes its model to int4 and reports no quality loss, based on perplexity on Wikipedia text. Its product answers medical-billing questions. What should it check next?
        options:
          - id: a
            text: Accuracy on its own billing questions, including the rare cases
          - id: b
            text: Perplexity on a larger sample of Wikipedia articles
          - id: c
            text: Whether the file size works out to 4 bits per weight
        answer: a
        feedback: Quantization losses are uneven, and they can hide in slices a general benchmark never touches, like exact codes and amounts. More Wikipedia or a size check says nothing about billing answers.
      - id: quantization-pruning-and-compression.transfer.v2.2
        prompt: A note-taking app must run a 3-billion-parameter model on phones with about 2 GB of memory free for it. Which choice fits?
        options:
          - id: b
            text: 8-bit weights with one scale for each tensor
          - id: c
            text: 16-bit weights with half of the layers pruned
          - id: a
            text: 4-bit weights with a scale for each small group
        answer: a
        feedback: 3 billion × 4.125 bits ≈ 1.5 GB fits. Int8 needs about 3 GB, and 16-bit with half the layers still needs about 3 GB, besides hurting quality far more.
      - id: quantization-pruning-and-compression.transfer.v2.3
        prompt: A document-analysis server runs large batches of long files and is compute-bound. Which quantization scheme targets its bottleneck?
        options:
          - id: a
            text: 8-bit weights and activations, so the matrix math runs on int8 cores
          - id: b
            text: 4-bit weights with 16-bit activations, expanded inside the kernel
          - id: c
            text: An 8-bit KV cache, with the weights and the math kept in 16 bits
        answer: a
        feedback: A compute-bound server needs cheaper arithmetic, which W8A8 gives. Weight-only 4-bit and an 8-bit cache both cut bytes read, which helps memory-bound decoding but leaves 16-bit math in place.
      - id: quantization-pruning-and-compression.transfer.v2.4
        prompt: A team calibrates activation ranges on short English chats, then deploys its W8A8 model to a service that reads long code files. Accuracy drops sharply. What is the likely cause?
        options:
          - id: b
            text: Quantized models can't read inputs longer than their calibration prompts
          - id: a
            text: Code inputs produce activations outside the calibrated ranges, so they clip
          - id: c
            text: The quantized tokenizer lost the tokens that code files depend on
        answer: a
        feedback: Activation scales come from the calibration sample, and inputs unlike it can exceed those ranges. Calibrate on data that looks like the real workload. Context length and the tokenizer don't change with quantization.
  - id: quantization-pruning-and-compression.memory
    objective_ref: objective.quantization-pruning-and-compression
    task: base
    response_type: numeric
    points: 1
    hint: Bytes = parameters × bits per weight ÷ 8. A 16-bit scale shared by a group of g weights adds 16 ÷ g bits per weight.
    remediation_scene: quantization-pruning-and-compression.s1
    absolute_tolerance: 0.03
    variants:
      - id: quantization-pruning-and-compression.memory.1
        prompt: An 8-billion-parameter model is stored in int8. How many GB do its weights take, ignoring scales?
        answer: 8
        feedback: 8 billion weights × 1 byte = 8 GB, half the 16-bit size.
      - id: quantization-pruning-and-compression.memory.2
        prompt: A 70-billion-parameter model is stored at exactly 4 bits per weight. How many GB do its weights take?
        answer: 35
        feedback: 70 billion × 4 bits = 280 billion bits = 35 billion bytes = 35 GB.
      - id: quantization-pruning-and-compression.memory.3
        prompt: An 8-billion-parameter model is stored in int4 with one 16-bit scale per group of 128 weights. How many GB do its weights and scales take?
        answer: 4.125
        feedback: Each weight costs 4 + 16/128 = 4.125 bits, so 8 billion × 4.125 ÷ 8 = 4.125 GB.
      - id: quantization-pruning-and-compression.memory.4
        prompt: A 13-billion-parameter model is stored in bf16. How many GB do its weights take?
        answer: 26
        feedback: 13 billion × 2 bytes = 26 GB.
      - id: quantization-pruning-and-compression.memory.5
        prompt: An int4 format uses one 16-bit scale for every 64 weights. How many bits does each weight cost on average?
        answer: 4.25
        feedback: 4 bits for the code plus 16 ÷ 64 = 0.25 bits for its share of the scale, so 4.25.
