scenes:
- id: quantization-pruning-and-compression.s1
  title: Quantize values under a scale
  type: explanation
  depth: intuition
  objective_refs:
  - objective.quantization-pruning-and-compression
  markdown: A simple quantizer maps a real value to a discrete integer using a scale and perhaps a zero point, then
    reconstructs an approximation. Fewer bits reduce storage but introduce rounding and clipping. Weight-only and
    activation quantization target different allocations and operations.
  text_mode: A simple quantizer maps a real value to a discrete integer using a scale and perhaps a zero point,
    then reconstructs an approximation. Fewer bits reduce storage but introduce rounding and clipping. Weight-only
    and activation quantization target different allocations and operations.
  bridges: []
- id: quantization-pruning-and-compression.s2
  title: Calibrate representative ranges
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.quantization-pruning-and-compression
  markdown: If most calibration activations are small but deployment produces large outliers, a chosen range may
    clip important values. Per-tensor, per-channel, and groupwise scales make different tradeoffs. Calibration data
    should reflect relevant workloads without contaminating independent evaluation.
  text_mode: If most calibration activations are small but deployment produces large outliers, a chosen range may
    clip important values. Per-tensor, per-channel, and groupwise scales make different tradeoffs. Calibration data
    should reflect relevant workloads without contaminating independent evaluation.
  bridges: []
- id: quantization-pruning-and-compression.s3
  title: Remove structure or learn a student
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.quantization-pruning-and-compression
  markdown: Unstructured pruning zeros individual weights; structured pruning removes blocks, channels, or other
    units that hardware may exploit more directly. Sparse values do not guarantee faster dense kernels. Distillation
    instead fits a student architecture to teacher-derived signals, creating a new learned artifact.
  text_mode: Unstructured pruning zeros individual weights; structured pruning removes blocks, channels, or other
    units that hardware may exploit more directly. Sparse values do not guarantee faster dense kernels. Distillation
    instead fits a student architecture to teacher-derived signals, creating a new learned artifact.
  bridges: []
- id: quantization-pruning-and-compression.s4
  title: Measure the actual deployment
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.quantization-pruning-and-compression
  markdown: Compare task quality, numerical errors, weight and cache memory, latency, and hardware support. Dequantization
    overhead or unsupported sparse kernels can erase expected speedups. A smaller download is a useful result, but
    it is not automatically lower latency or unchanged behavior.
  text_mode: Compare task quality, numerical errors, weight and cache memory, latency, and hardware support. Dequantization
    overhead or unsupported sparse kernels can erase expected speedups. A smaller download is a useful result, but
    it is not automatically lower latency or unchanged behavior.
  bridges: []
