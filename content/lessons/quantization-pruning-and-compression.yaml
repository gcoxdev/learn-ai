objectives:
- id: objective.quantization-pruning-and-compression
  version: 1-draft
  statement: Quantization lowers numerical precision, pruning removes selected parameters or structures, and
    distillation trains a different model; each changes costs and can affect quality in workload-dependent
    ways.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - quantization-pruning-and-compression.base
  - quantization-pruning-and-compression.transfer
  prerequisites:
  - anyOf:
    - objective.mixed-precision-training
  - anyOf:
    - objective.distillation-and-selection
  - anyOf:
    - objective.training-memory
scenes:
- id: quantization-pruning-and-compression.s1
  title: Quantize values under a scale
  type: explanation
  depth: intuition
  objective_refs:
  - objective.quantization-pruning-and-compression
  markdown: 'A simple quantizer maps a real value to a discrete integer using a scale and perhaps a zero point,
    then reconstructs an approximation. Fewer bits reduce storage but introduce rounding and clipping. Weight-only
    and activation quantization target different allocations and operations.


    Use a toy scale of 0.5 and signed integer codes from −2 through 2. A value of 0.8 rounds to code 2 and
    reconstructs as 2 × 0.5 = 1.0, an error of 0.2. A value of 2.0 would need code 4, so clipping limits it
    to code 2 and reconstruction 1.0. At four bits per weight, 1,000 weights need 500 payload bytes; at sixteen
    bits they need 2,000. Scales, packing, and other metadata add storage.'
  text_mode: 'A simple quantizer maps a real value to a discrete integer using a scale and perhaps a zero point,
    then reconstructs an approximation. Fewer bits reduce storage but introduce rounding and clipping. Weight-only
    and activation quantization target different allocations and operations.


    Use a toy scale of 0.5 and signed integer codes from −2 through 2. A value of 0.8 rounds to code 2 and
    reconstructs as 2 × 0.5 = 1.0, an error of 0.2. A value of 2.0 would need code 4, so clipping limits it
    to code 2 and reconstruction 1.0. At four bits per weight, 1,000 weights need 500 payload bytes; at sixteen
    bits they need 2,000. Scales, packing, and other metadata add storage.'
  bridges: []
- id: quantization-pruning-and-compression.s2
  title: Calibrate representative ranges
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.quantization-pruning-and-compression
  markdown: If most calibration activations are small but deployment produces large outliers, a chosen range
    may clip important values. Per-tensor, per-channel, and groupwise scales make different tradeoffs. Calibration
    data should reflect relevant workloads without contaminating independent evaluation.
  text_mode: If most calibration activations are small but deployment produces large outliers, a chosen range
    may clip important values. Per-tensor, per-channel, and groupwise scales make different tradeoffs. Calibration
    data should reflect relevant workloads without contaminating independent evaluation.
  bridges: []
- id: quantization-pruning-and-compression.s3
  title: Remove structure or learn a student
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.quantization-pruning-and-compression
  markdown: Unstructured pruning zeros individual weights; structured pruning removes blocks, channels, or
    other units that hardware may exploit more directly. Sparse values do not guarantee faster dense kernels.
    Distillation instead fits a student architecture to teacher-derived signals, creating a new learned artifact.
  text_mode: Unstructured pruning zeros individual weights; structured pruning removes blocks, channels, or
    other units that hardware may exploit more directly. Sparse values do not guarantee faster dense kernels.
    Distillation instead fits a student architecture to teacher-derived signals, creating a new learned artifact.
  bridges: []
- id: quantization-pruning-and-compression.s4
  title: Measure the actual deployment
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.quantization-pruning-and-compression
  markdown: Compare task quality, numerical errors, weight and cache memory, latency, and hardware support.
    Dequantization overhead or unsupported sparse kernels can erase expected speedups. A smaller download is
    a useful result, but it is not automatically lower latency or unchanged behavior.
  text_mode: Compare task quality, numerical errors, weight and cache memory, latency, and hardware support.
    Dequantization overhead or unsupported sparse kernels can erase expected speedups. A smaller download is
    a useful result, but it is not automatically lower latency or unchanged behavior.
  bridges: []
