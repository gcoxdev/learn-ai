schema_version: 0.2-draft
lesson:
  id: quantization-pruning-and-compression
  version: 0.4.0-draft
  title: Reduce deployment cost while measuring what changes
  state: draft
  summary: Store each weight in 4 bits instead of 16 and an 8B model drops from 16 GB to about 5. Learn where the rounding error goes, and how GPTQ and AWQ hide it.
  slot: M27.5
  category: learning
  sources:
    - title: "GPTQ: Accurate Post-Training Quantization for Generative Pre-trained Transformers (Frantar et al., 2022)"
      url: https://arxiv.org/abs/2210.17323
    - title: "AWQ: Activation-aware Weight Quantization for LLM Compression and Acceleration (Lin et al., 2023)"
      url: https://arxiv.org/abs/2306.00978
    - title: "LLM.int8(): 8-bit Matrix Multiplication for Transformers at Scale (Dettmers et al., 2022)"
      url: https://arxiv.org/abs/2208.07339
    - title: "SmoothQuant: Accurate and Efficient Post-Training Quantization for Large Language Models (Xiao et al., 2022)"
      url: https://arxiv.org/abs/2211.10438
    - title: Learning both Weights and Connections for Efficient Neural Networks (Han et al., 2015)
      url: https://arxiv.org/abs/1506.02626
    - title: Distilling the Knowledge in a Neural Network (Hinton, Vinyals & Dean, 2015)
      url: https://arxiv.org/abs/1503.02531
    - title: DistilBERT, a distilled version of BERT (Sanh et al., 2019)
      url: https://arxiv.org/abs/1910.01108
objectives:
  - id: objective.quantization-pruning-and-compression
    version: 2-draft
    statement: Quantization lowers numerical precision, pruning removes selected parameters or structures, and distillation trains a different model; each changes costs and can affect quality in workload-dependent ways.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - quantization-pruning-and-compression.base.v2
      - quantization-pruning-and-compression.transfer.v2
      - quantization-pruning-and-compression.memory
    prerequisites:
      - anyOf:
          - objective.mixed-precision-training
      - anyOf:
          - objective.distillation-and-selection
      - anyOf:
          - objective.training-memory
scenes:
  - id: quantization-pruning-and-compression.s1
    title: Sixteen bits, eight bits, four bits
    type: explanation
    depth: intuition
    objective_refs:
      - objective.quantization-pruning-and-compression
    markdown: |-
      Fernly wants a cheap evening server: an NVIDIA L4, with 24 GB of memory but only about 300 GB/s of bandwidth. Fern's 16 GB of weights would barely fit, and each decode step would take 16 GB ÷ 300 GB/s ≈ 53 ms. Both problems shrink with the weights.

      **Quantization** stores each weight as a small integer code plus a shared scale: evenly spaced steps instead of the floating-point formats from the mixed-precision lesson. For Fern's 8 billion weights:

      | Format | Bits per weight | Weights |
      | --- | ---: | ---: |
      | bf16 | 16 | 16 GB |
      | int8 | 8 | 8 GB |
      | int4, one 16-bit scale per 128 weights | 4.125 | 4.1 GB |

      In practice 4-bit files for this model run 4–6 GB, because many formats keep the large embedding and output matrices in 16 bits.

      In **symmetric** quantization, $b$ bits give codes from $-(2^{b-1}-1)$ to $2^{b-1}-1$: −7 to 7 for int4. The scale puts the largest weight on the top code:

      $$s = \frac{\max_i |w_i|}{2^{b-1}-1}, \qquad q_i = \operatorname{round}\!\left(\frac{w_i}{s}\right), \qquad \hat{w}_i = s\, q_i$$

      Take four weights, [0.12, −0.40, 0.90, −0.05], in int4. The scale is 0.90 ÷ 7 ≈ 0.1286. The codes are [1, −3, 7, 0], which reconstruct to [0.129, −0.386, 0.900, 0]. The biggest weight is exact, and the smallest one, −0.05, vanished.

      :::papers Asymmetric (affine) quantization
      For values not centered on zero, a **zero-point** $z$ shifts unsigned codes (0 to $2^b - 1$) to cover the range $[\min, \max]$:

      $$s = \frac{\max - \min}{2^b - 1}, \quad z = \operatorname{round}\!\left(-\frac{\min}{s}\right), \quad q = \operatorname{clamp}\!\big(\operatorname{round}(x/s) + z,\ 0,\ 2^b - 1\big), \quad \hat{x} = s\,(q - z)$$

      For values from −1 to 1.55 in 8 bits: $s = 0.01$ and $z = 100$. The value 0 is stored exactly as code 100, and 1.234 becomes code 223, read back as 1.23.
      :::
    bridges: []
  - id: quantization-pruning-and-compression.s2
    title: One outlier ruins the scale
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.quantization-pruning-and-compression
    markdown: |-
      One scale serves every weight in its group, so the largest weight sets the step size for all of them. The program quantizes a row of 4,096 weights, then adds one weight 25 times larger than usual.

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      w = rng.normal(0, 0.02, size=4096).astype(np.float32)   # one row of a weight matrix

      def fake_quant(x, bits, group):
          """Symmetric quantize, then dequantize, with one scale per group of weights."""
          qmax = 2 ** (bits - 1) - 1                    # 127 for int8, 7 for int4
          g = x.reshape(-1, group)
          scale = np.abs(g).max(axis=1, keepdims=True) / qmax
          q = np.clip(np.round(g / scale), -qmax, qmax)  # the stored integer codes
          return (q * scale).reshape(-1)                 # what the kernel computes with

      def report(x, label):
          for bits, group in [(8, 4096), (4, 4096), (4, 128)]:
              err = np.abs(fake_quant(x, bits, group) - x).mean()
              print(f"{label:13} int{bits}, group {group:4}: mean error {err:.5f} ({err / np.abs(x).mean():.1%} of a typical weight)")

      report(w, "normal row")
      w_out = w.copy(); w_out[7] = 0.5                  # one outlier, 25x the usual size
      report(w_out, "with outlier")
      ```

      Int8 is nearly free: about 1% error. Int4 with one scale for the whole row costs 17.5%. Add the outlier and that single scale stretches so far that most weights round to 0, and the error hits 92%. Give every 128 weights their own scale and the damage stays inside one group: 14.8%. That's why 4-bit formats use **group-wise scales**, at a cost of 16 bits per 128 weights. Try `group` values of 32 and 1024.

      Activations are harder than weights. They change with every input, so their ranges must be estimated from a sample of real prompts, a step called **calibration**. And in large models, a few activation dimensions become huge: Dettmers and colleagues (LLM.int8(), 2022) found these outlier features emerging across layers in models of about 6.7 billion parameters and up. Their fix computes those few dimensions in 16 bits and the rest in int8.
    bridges: []
  - id: quantization-pruning-and-compression.round-smarter
    title: Round smarter with GPTQ and AWQ
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.quantization-pruning-and-compression
    markdown: |-
      Rounding each weight to its nearest code, called round-to-nearest, treats every weight on its own. But what matters is the layer's *output*, where errors can cancel. Both landmark 4-bit methods use calibration prompts to exploit that.

      :::papers GPTQ (Frantar et al., 2022)
      For a layer with weights $W$ and calibration inputs $X$, find integer-coded weights $\hat{W}$ that keep the outputs close:

      $$\hat{W} = \arg\min_{\hat{W}} \big\lVert WX - \hat{W}X \big\rVert_2^2$$

      GPTQ rounds one column at a time. After each column, it adjusts the columns not yet rounded so they cancel the error just introduced, using second-order information computed from $X X^\top$. If weight 1's rounding pushed an output up by 0.03, weight 2 is nudged to pull it back down. The paper quantized 175-billion-parameter models to 3 or 4 bits in about four GPU hours, with no retraining.
      :::

      **AWQ** (Lin et al., 2023) observes that about 1% of weights matter far more than the rest, and that you find them by the *activations* they multiply, not by their own size: a weight that meets inputs of size 10 turns every rounding error into a tenfold output error. AWQ multiplies those salient weight channels by a factor such as 2 before quantizing and divides the matching inputs by 2. The product is unchanged, but each rounding error in those channels now costs half as much in the output.

      :::mixup "Quantization is just rounding, so all 4-bit models of the same network are the same."
      Round-to-nearest, GPTQ, and AWQ produce different codes from the same weights, and they differ in quality, most visibly at 3 and 4 bits. Always note which method made a quantized checkpoint.
      :::
    bridges: []
  - id: quantization-pruning-and-compression.s3
    title: Remove weights, or train a smaller model
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.quantization-pruning-and-compression
    markdown: |-
      Two other ways to shrink a model, briefly.

      **Pruning** removes weights. Han and colleagues (2015) cut AlexNet's parameters ninefold, from 61 million to 6.7 million, with no loss in accuracy, by zeroing small weights and retraining. But scattered zeros (**unstructured** sparsity) don't speed up a dense GPU kernel, which multiplies the zeros anyway. **Structured** pruning removes whole units the hardware can skip: heads, channels, layers, or the 2-out-of-every-4 pattern that NVIDIA's Ampere GPUs can run on sparse tensor cores.

      **Distillation** trains a new, smaller student model to match a large teacher's output probabilities (Hinton, Vinyals & Dean, 2015). DistilBERT (2019) kept 97% of BERT's language-understanding score while being 40% smaller and 60% faster. Unlike quantization and pruning, distillation costs a training run, and the result is a different model that needs its own evaluation.
    bridges: []
  - id: quantization-pruning-and-compression.s4
    title: Which phase gets faster, and what to measure
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.quantization-pruning-and-compression
    markdown: |-
      Quantizing only the weights, written W4A16 (4-bit weights, 16-bit activations), attacks decode's bottleneck: the kernel reads 4-bit codes and turns them back into 16-bit numbers on the fly, so each step reads a quarter of the bytes. The math still runs in 16 bits, so compute-bound prefill gains little. To speed up prefill or very large batches, the multiply itself must use smaller numbers: W8A8, with 8-bit weights *and* activations, runs on int8 tensor cores. SmoothQuant (Xiao et al., 2022) made W8A8 accurate by moving activation outliers into the weights with a per-channel scaling trick, the same one AWQ later used.

      :::predict What decode ceiling should 8 GB of int8 weights reach on the L4's 300 GB/s?
      8 GB ÷ 300 GB/s ≈ 27 ms per step, so about 38 tokens per second, twice the bf16 figure. Speed follows the bytes; accuracy has to be measured.
      :::

      Fern's team tests each option on the L4 against their own 500 held-out support questions:

      | Weights | Size | Decode ceiling on the L4 | Answers judged correct |
      | --- | ---: | ---: | ---: |
      | bf16 | 16 GB | 19 tokens/s | 91.2% |
      | int8 | 8 GB | 38 tokens/s | 91.0% |
      | int4, AWQ | 5.7 GB | 53 tokens/s | 89.6% |

      The int4 accuracy drop sits almost entirely in one slice: questions quoting exact doses of fertilizer. The team ships int4 for evenings, routes dosage questions to the bf16 server, and reruns the test after every model update.
    bridges: []
  - id: quantization-pruning-and-compression.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.quantization-pruning-and-compression
    markdown: Model sizes to compute at different bit widths, then an outlier, a GPTQ step, a phone app, a compute-bound server, and a misleading benchmark test whether you can shrink a model and know what it cost.
    takeaway: |-
      Quantization stores weights as small integers times a scale: 16 GB becomes 8 at int8 and about 4–6 at int4. Group-wise scales and smarter rounding like GPTQ and AWQ keep the error small, and your own test set shows where it isn't.
  - id: quantization-pruning-and-compression.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.quantization-pruning-and-compression
    markdown: |-
      Quantization stores approximate values, pruning removes weights or structures, and distillation trains a student. Measure actual quality, memory, and speed after each change.
