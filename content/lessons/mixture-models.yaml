schema_version: 0.2-draft
lesson:
  id: mixture-models
  version: 0.4.0-draft
  title: Let several hidden sources explain the data
  state: draft
  summary: A 440 g loaf could have come from either oven. Learn how a mixture model splits the credit, and how EM learns both ovens without ever being told which baked what.
  slot: M08.2
  category: learning
  sources:
    - title: An Introduction to Statistical Learning — authors’ materials
      url: https://www.statlearning.com/
    - title: Deep Learning — probability and information theory
      url: https://www.deeplearningbook.org/contents/prob.html
    - title: "Maximum Likelihood from Incomplete Data via the EM Algorithm (Dempster, Laird & Rubin, 1977)"
      url: https://doi.org/10.1111/j.2517-6161.1977.tb01600.x
    - title: scikit-learn — Gaussian mixture models
      url: https://scikit-learn.org/stable/modules/mixture.html
objectives:
  - id: objective.mixture-models
    version: 2-draft
    statement: Mixture models assign observations probabilistically to latent components; expectation-maximization alternates responsibility estimates and parameter updates under a chosen model.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - mixture-models.base.v2
      - mixture-models.transfer.v2
      - mixture-models.calc.v2
    prerequisites:
      - anyOf:
          - objective.bayes-rule
      - anyOf:
          - objective.clustering
scenes:
  - id: mixture-models.s1
    title: Two ovens, one rack of loaves
    type: explanation
    depth: intuition
    objective_refs:
      - objective.mixture-models
    markdown: |-
      The bakery from the clustering lesson has two ovens baking the same rye loaf. The small oven turns out loaves around 400 g. The big oven runs hot, and its loaves come out around 460 g. One morning someone piles every loaf on one rack without noting which oven baked it. You pick up a 440 g loaf. Which oven made it?

      You can't be sure, because both ovens sometimes bake a 440 g loaf. A **mixture model** describes data like this as a blend of several sources, called **components**, each with its own distribution. Here each oven is a bell curve (a Gaussian) with a mean and a spread (its standard deviation), so the whole thing is a two-component **Gaussian mixture**.

      Each component also has a **mixture weight**, the share of the data it produces. If the small oven bakes 60% of the loaves, its mixture weight is 0.6 and the big oven's is 0.4. Mixture weights are never negative and always add to 1.

      The oven behind each loaf is **latent**: real, but never observed. The diagram shows the story the model tells about every loaf.
    diagram:
      caption: The two-step story a Gaussian mixture tells about each loaf. You see the grams, never the oven.
      description: First, pick an oven, oven A with probability 0.6 or oven B with probability 0.4. Oven A draws the loaf's grams from a bell curve with mean 400 g and spread 20 g; oven B from one with mean 460 g and spread 20 g. Either path ends at the loaf on the rack, where only its grams are visible.
      nodes:
        - id: pick
          label: Pick an oven
          note: hidden from you
          col: 0
          row: 1
          tone: muted
        - id: oven-a
          label: Oven A bell curve
          note: mean 400 g, spread 20 g
          col: 2
          row: 0
          tone: data
        - id: oven-b
          label: Oven B bell curve
          note: mean 460 g, spread 20 g
          col: 2
          row: 2
          tone: data
        - id: loaf
          label: Loaf on the rack
          note: you see only its grams
          col: 4
          row: 1
          tone: accent
      edges:
        - from: pick
          to: oven-a
          label: probability 0.6
        - from: pick
          to: oven-b
          label: probability 0.4
        - from: oven-a
          to: loaf
          label: draw grams
        - from: oven-b
          to: loaf
          label: draw grams
    bridges: []
  - id: mixture-models.s2
    title: Which oven owns the 440 g loaf?
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.mixture-models
    markdown: |-
      Bayes' rule, from the Bayes lesson, answers the question. For each oven, multiply how common it is (its mixture weight) by how likely it is to bake a 440 g loaf (the height of its bell curve at 440). Then divide each product by their total.

      Say both spreads are 20 g. Then 440 g sits 2 spreads above oven A's mean and 1 spread below oven B's. A bell curve's height falls off as $e^{-z^2/2}$, where $z$ counts spreads from the mean. Because both ovens have the same spread, the rest of the bell-curve formula cancels, and these relative heights are all we need:

      | | Oven A | Oven B |
      | --- | ---: | ---: |
      | Mixture weight | 0.6 | 0.4 |
      | Spreads from the mean, $z$ | 2 | 1 |
      | Relative height, $e^{-z^2/2}$ | 0.135 | 0.607 |
      | Weight × height | 0.081 | 0.243 |
      | Share of the total, 0.324 | **0.25** | **0.75** |

      These shares are the loaf's **responsibilities**: the probability that each component produced it, given the current settings. K-means would hand the loaf entirely to one oven. A mixture splits it 25/75.

      :::predict A loaf weighs 430 g, exactly halfway between the ovens. What are its responsibilities?
      0.6 for oven A and 0.4 for oven B. At 430 g both ovens are 1.5 spreads away, so their heights tie and cancel out. With no evidence either way, the answer falls back on the mixture weights, the prior: oven A bakes more loaves, so it more likely baked this one too.
      :::
    bridges: []
  - id: mixture-models.s3
    title: "EM: guess the owners, then refit the ovens"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.mixture-models
    markdown: |-
      So far we knew each oven's mean, spread, and mixture weight. Usually you don't; you have only the rack of loaves. **Expectation–maximization (EM)** learns them by alternating two steps:

      - **E-step** (expectation): with the current settings, compute every loaf's responsibilities.
      - **M-step** (maximization): refit each oven, counting each loaf in proportion to its responsibility for that oven.

      Suppose oven A's responsibilities for loaves of 400, 420, and 440 g are 1, 0.75, and 0.25. Its new mean is the weighted average (1 × 400 + 0.75 × 420 + 0.25 × 440) / (1 + 0.75 + 0.25) = 825 / 2 = 412.5 g. Its new mixture weight is its total responsibility divided by the number of loaves. The code below runs four rounds and prints the **log-likelihood**, a score for how well the model explains all seven loaves (higher is better).

      ```python run
      import numpy as np

      loaves = np.array([385, 398, 410, 425, 440, 462, 478], dtype=float)  # grams
      w = np.array([0.6, 0.4])        # mixture weights: share of loaves from ovens A and B
      mu = np.array([400.0, 460.0])   # current guess of each oven's mean weight
      sd = np.array([20.0, 20.0])     # current guess of each oven's spread

      def bell(x, m, s):
          return np.exp(-0.5 * ((x - m) / s) ** 2) / (s * np.sqrt(2 * np.pi))

      for step in range(1, 5):
          # E-step: responsibilities, the share of each loaf each oven "owns".
          joint = w * bell(loaves[:, None], mu, sd)
          r = joint / joint.sum(axis=1, keepdims=True)
          if step == 1:
              print("oven A's share of each loaf:", np.round(r[:, 0], 2))
          # M-step: refit each oven, counting each loaf by its responsibility.
          n_k = r.sum(axis=0)
          mu = (r * loaves[:, None]).sum(axis=0) / n_k
          sd = np.sqrt((r * (loaves[:, None] - mu) ** 2).sum(axis=0) / n_k)
          w = n_k / len(loaves)
          loglik = np.log((w * bell(loaves[:, None], mu, sd)).sum(axis=1)).sum()
          print(f"step {step}: means {np.round(mu, 1)}, spreads {np.round(sd, 1)}, "
                f"weights {np.round(w, 2)}, log-likelihood {loglik:.2f}")
      ```

      Oven A's share of the 440 g loaf starts at 0.25, just as in the table. After four rounds the means sit near 405 and 459 g, and the log-likelihood has climbed to −33.35. Now start both means at 440. The two ovens begin identical, receive identical updates, and stay stuck at a worse −34.05. EM never goes downhill, but it can stall at a poor answer, so run it from several starts.

      :::papers The EM updates for a Gaussian mixture
      EM was set out in general form by Dempster, Laird, and Rubin (1977). For a Gaussian mixture, the E-step computes

      $$r_{ik} = \frac{\pi_k\,\mathcal{N}(x_i \mid \mu_k, \sigma_k^2)}{\sum_j \pi_j\,\mathcal{N}(x_i \mid \mu_j, \sigma_j^2)}$$

      and the M-step sets $N_k = \sum_i r_{ik}$, $\mu_k = \frac{1}{N_k}\sum_i r_{ik}\,x_i$, $\sigma_k^2 = \frac{1}{N_k}\sum_i r_{ik}(x_i-\mu_k)^2$, and $\pi_k = N_k / n$. For the 440 g loaf, $\pi_A = 0.6$ and $\mathcal{N}$ is the bell height, giving $r = 0.25$. The 412.5 g mean is $\mu_k$ with $N_k = 2$. No round can lower the log-likelihood $\sum_i \log \sum_k \pi_k\,\mathcal{N}(x_i \mid \mu_k, \sigma_k^2)$.
      :::
    bridges: []
  - id: mixture-models.s4
    title: A component is a bell curve, not a category
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.mixture-models
    markdown: |-
      K-means is EM's hard-edged cousin. Force every responsibility to 0 or 1 and give every component the same small spread, and the E-step becomes "join the nearest center" while the M-step becomes "move to the mean." The shop at 4 that k-means had to push into one group would, in a mixture, be split between both.

      EM has a failure k-means lacks. If a component parks on a single loaf and shrinks its spread toward zero, its bell curve at that loaf grows without limit, and so does the likelihood. That's a **degenerate** fit, not a great one. The EM code shows a milder version: change `range(1, 5)` to `range(1, 51)`, and oven B narrows to 8 g around the two heaviest loaves while the log-likelihood creeps up to −33.02. With only seven loaves, a component can buy likelihood by hugging a couple of points. Libraries prevent the collapse by adding a small amount to every spread.

      :::mixup "The model found two components, so there are two real kinds of loaf."
      Components are a modeling device. A single lopsided distribution, such as delivery times with a long tail of late trips, is often fitted best by two bells: one for the bulk and one for the tail. No second kind of delivery exists. Karl Pearson fitted the first two-component mixture in 1894, to Walter Weldon's measurements of Naples crabs, to ask whether they came from two forms. The fit alone couldn't settle that biological question.
      :::

      Here's how Priya at the bakery checks her fit. Training likelihood never falls as you add components, the same trap as the k-means total, so she fits one, two, and three components to six days of loaves and scores them on a seventh day she held back. Two beat one clearly; three add almost nothing. Then she weighs 20 loaves as they leave each oven. The fitted means land within a few grams of the real ovens, so she can finally name the components "small oven" and "big oven."
    bridges: []
  - id: mixture-models.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.mixture-models
    markdown: Ambiguous sensor readings, lopsided delivery times, and a few responsibilities and M-step updates by hand test whether you can run EM and read what it found.
    takeaway: |-
      A mixture model lets each data point belong partly to several hidden components. EM alternates computing those shares and refitting the components; it climbs to the nearest hilltop, and its components still need checking against the real world.
  - id: mixture-models.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.mixture-models
    markdown: |-
      Mixture models allow an observation to partly fit several hidden components. EM alternates estimating those memberships and updating the components.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - mixture-models.s1
        - mixture-models.s2
        - mixture-models.s3
        - mixture-models.s4
        - mixture-models.check
      gate_refs:
        - gate.core
  scene_aliases:
    mixture-models.recap: mixture-models.check
assessment_families:
  - id: mixture-models.base
    objective_ref: objective.mixture-models
    task: base
    response_type: single_choice
    points: 1
    hint: 'Compute soft membership: trace the inputs, operation, and result before choosing.'
    remediation_scene: mixture-models.s2
    variants:
      - id: mixture-models.base.1
        prompt: Weighted likelihoods are 0.3 and 0.1. What is the first responsibility?
        options:
          - id: c
            text: '3'
          - id: a
            text: '0.75'
          - id: b
            text: '0.3'
        answer: a
        feedback: Normalize 0.3 by total 0.4.
        retired: true
      - id: mixture-models.base.2
        prompt: What does the E-step estimate?
        options:
          - id: a
            text: Latent responsibilities under current parameters
          - id: b
            text: Only the final test labels
          - id: c
            text: A guaranteed global optimum
        answer: a
        feedback: The E-step computes expectations for hidden assignments or variables.
        retired: true
  - id: mixture-models.transfer
    objective_ref: objective.mixture-models
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Do not force components into human categories: trace the inputs, operation, and result before choosing.'
    remediation_scene: mixture-models.s4
    variants:
      - id: mixture-models.transfer.1
        prompt: EM reaches different solutions from different initializations. Is that necessarily a software bug?
        options:
          - id: a
            text: No; local optima can differ
          - id: b
            text: Yes; EM always finds one global solution
          - id: c
            text: Only if the data are numeric
        answer: a
        feedback: Monotonic improvement does not imply global optimality.
        retired: true
      - id: mixture-models.transfer.2
        prompt: A mixture has three components. Does that prove three natural populations exist?
        options:
          - id: b
            text: Yes, by definition
          - id: c
            text: Only if all weights are positive
          - id: a
            text: No; components reflect a modeling choice
        answer: a
        feedback: Statistical components need independent interpretation and validation.
        retired: true
  - id: mixture-models.base.v2
    objective_ref: objective.mixture-models
    task: base
    response_type: single_choice
    points: 1
    hint: A responsibility is mixture weight × bell height, divided by the total over all components. The E-step computes those shares; the M-step refits each component using them as weights.
    remediation_scene: mixture-models.s2
    variants:
      - id: mixture-models.base.v2.1
        prompt: Oven A bakes 60% of the loaves and oven B 40%, and both have the same spread. A loaf weighs exactly halfway between the two ovens' means. What are its responsibilities?
        options:
          - id: c
            text: 0.5 for A and 0.5 for B, since it is halfway between them
          - id: a
            text: 1 for A and 0 for B, since A bakes more of the loaves
          - id: b
            text: 0.6 for A and 0.4 for B, the same as the mixture weights
        answer: b
        feedback: Halfway with equal spreads means the bell heights tie and cancel, so only the mixture weights remain. Answering 0.5/0.5 forgets the prior, and giving A all of it is k-means-style hard assignment.
      - id: mixture-models.base.v2.2
        prompt: Midway through EM on a three-component mixture, you have current means, spreads, and mixture weights. What does the next E-step produce?
        options:
          - id: c
            text: For each point, its share belonging to each component
          - id: a
            text: New means and spreads computed from the points' shares
          - id: b
            text: A final label naming the one component for each point
        answer: c
        feedback: The E-step turns the current settings into responsibilities, one share per point per component. Refitting the means and spreads is the M-step, and EM keeps soft shares rather than assigning final labels.
      - id: mixture-models.base.v2.3
        prompt: Which change turns EM for a Gaussian mixture into ordinary k-means?
        options:
          - id: b
            text: Let every component's spread grow as large as it needs
          - id: a
            text: Round every responsibility to 0 or 1 and fix equal spreads
          - id: c
            text: Skip the M-step and keep only the responsibilities
        answer: a
        feedback: With hard 0-or-1 shares and equal spreads, the E-step becomes "join the nearest center" and the M-step becomes "move to the mean." Wider spreads make memberships softer, not harder, and without an M-step nothing is learned.
      - id: mixture-models.base.v2.4
        prompt: During EM, one component settles on a single repeated value, its spread shrinks toward zero, and the log-likelihood shoots upward. What is happening?
        options:
          - id: a
            text: EM has found an unusually good fit, so the run should stop here
          - id: c
            text: The E-step has a bug, since EM can never raise the likelihood this much
          - id: b
            text: A degenerate fit; a floor on each spread would prevent it
        answer: b
        feedback: A bell curve squeezed onto one point grows without limit there, inflating the likelihood without describing the data. That's why libraries add a small floor to every spread. EM raising the likelihood is expected, so it doesn't point to a bug.
      - id: mixture-models.base.v2.5
        prompt: A loaf is 1 spread from oven A's mean and 3 spreads from oven B's, and both ovens bake half the loaves. Which oven gets most of the responsibility, and why?
        options:
          - id: c
            text: Oven A, because its bell curve is much higher at this loaf
          - id: b
            text: Oven B, because the loaf is farther out in B's curve
          - id: a
            text: Neither; with equal mixture weights the shares are equal
        answer: c
        feedback: With equal mixture weights, the bell heights decide. At 1 spread the height is e^(−0.5) ≈ 0.61; at 3 spreads it's e^(−4.5) ≈ 0.01, so A gets nearly all of it. Equal mixture weights only matter when the heights tie.
  - id: mixture-models.transfer.v2
    objective_ref: objective.mixture-models
    task: transfer
    response_type: single_choice
    points: 1
    hint: A component is a bell curve the model found useful, not necessarily a real group. Compare fits by likelihood on held-out data, and check names against independent evidence.
    remediation_scene: mixture-models.s4
    variants:
      - id: mixture-models.transfer.v2.1
        prompt: A two-component mixture fitted to delivery times gives one bell for most trips and a wide second bell for the long tail of late ones. A manager asks which drivers make up the "second kind" of delivery. What is the best answer?
        options:
          - id: c
            text: The second bell may just model the tail of one lopsided distribution
          - id: a
            text: It must be a separate group of drivers who follow different routes
          - id: b
            text: It is a fitting error, so the late trips should be removed first
        answer: c
        feedback: Mixtures often use an extra bell to fit a long tail; a component is a modeling device. Before claiming a real group of drivers, you'd need independent evidence. Removing the late trips throws away real data.
      - id: mixture-models.transfer.v2.2
        prompt: A factory fits a mixture to vibration readings with components for "idle" and "running." One reading gets responsibilities 0.5 and 0.5. What does that tell you?
        options:
          - id: b
            text: The model has failed, since each reading comes from exactly one mode
          - id: c
            text: The reading belongs to neither mode, so it should be flagged as a fault
          - id: a
            text: The reading sits where both modes are about equally likely
        answer: a
        feedback: Even responsibilities mean the reading lies in the overlap, so the evidence can't separate the modes. The reading did come from one mode, but the model is correctly unsure which. A point that fits neither mode would have low likelihood under both, which is a different signal.
      - id: mixture-models.transfer.v2.3
        prompt: A shop fits mixtures with 2, 3, 4, and 5 components to customer spending. Training log-likelihood rises every time. How should it choose the number of components?
        options:
          - id: a
            text: Take 5, since it explains the training data best
          - id: b
            text: Compare the fits' log-likelihood on held-out customers
          - id: c
            text: Take 2, since it is the simplest model that runs
        answer: b
        feedback: More components always fit training data at least as well, just as k-means totals always fall with k. Held-out likelihood shows whether the extra components describe new customers too. Picking the simplest model ignores the evidence entirely.
      - id: mixture-models.transfer.v2.4
        prompt: Two EM runs on the same data, from different starting means, end with log-likelihoods of −812 and −790. Which run should you keep?
        options:
          - id: c
            text: The −790 run, since higher log-likelihood means a better fit
          - id: a
            text: The −812 run, since its value is further from zero
          - id: b
            text: Neither; average their parameters to get one model
        answer: c
        feedback: EM climbs the log-likelihood, and −790 is higher than −812, so that run reached a better hilltop. Averaging parameters from two different solutions can produce a model that fits worse than either.
      - id: mixture-models.transfer.v2.5
        prompt: A two-component mixture fitted to adult heights gives bells centered at 163 cm and 177 cm. A colleague wants to label them "women" and "men" in a report. What should come first?
        options:
          - id: c
            text: Label the component with the larger mixture weight as "women"
          - id: b
            text: Nothing; a mixture's components are the real groups by definition
          - id: a
            text: Check the components against recorded sex for a sample of people
        answer: a
        feedback: Components are bell curves that fit the data; naming them needs independent evidence, like the bakery weighing loaves at each oven. The two groups overlap heavily in height, so the components may not line up neatly with them.
  - id: mixture-models.calc.v2
    objective_ref: objective.mixture-models
    task: base
    response_type: numeric
    points: 1
    hint: For a responsibility, multiply each component's mixture weight by its bell height, then divide the one you want by the total. For an M-step mean, take a weighted average using the responsibilities.
    remediation_scene: mixture-models.s3
    variants:
      - id: mixture-models.calc.v2.1
        prompt: Two components have mixture weights 0.5 and 0.5. At a data point, their bell heights are 0.24 and 0.08. What is component 1's responsibility for the point? Give two decimal places.
        answer: 0.75
        feedback: The products are 0.12 and 0.04, with total 0.16. Component 1's share is 0.12 / 0.16 = 0.75.
      - id: mixture-models.calc.v2.2
        prompt: Two components have mixture weights 0.8 and 0.2. At a data point, their bell heights are 0.1 and 0.2. What is component 1's responsibility for the point? Give two decimal places.
        answer: 0.67
        feedback: The products are 0.08 and 0.04, with total 0.12. Component 1's share is 0.08 / 0.12 ≈ 0.67. Its larger mixture weight outweighs its lower bell height.
      - id: mixture-models.calc.v2.3
        prompt: Two components have mixture weights 0.3 and 0.7. At a data point, their bell heights are 0.6 and 0.2. What is component 1's responsibility for the point? Give two decimal places.
        answer: 0.56
        feedback: The products are 0.18 and 0.14, with total 0.32. Component 1's share is 0.18 / 0.32 ≈ 0.56.
      - id: mixture-models.calc.v2.4
        prompt: In an M-step, a component's responsibilities for loaves of 400 g, 420 g, and 460 g are 1, 0.5, and 0.5. What is its new mean, in grams?
        answer: 420
        feedback: (1 × 400 + 0.5 × 420 + 0.5 × 460) / (1 + 0.5 + 0.5) = 840 / 2 = 420 g.
      - id: mixture-models.calc.v2.5
        prompt: Across five loaves, a component's responsibilities are 1, 1, 0.6, 0.3, and 0.1. What is its new mixture weight after the M-step? Give two decimal places.
        answer: 0.6
        feedback: Its total responsibility is 3.0 out of 5 loaves, so its new mixture weight is 3.0 / 5 = 0.60.
    absolute_tolerance: 0.01
