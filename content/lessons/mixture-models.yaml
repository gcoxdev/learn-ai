schema_version: 0.2-draft
lesson:
  id: mixture-models
  version: 0.2.0-draft
  title: Let several hidden sources explain the data
  state: draft
  summary: Let one measurement partly fit more than one possible source, then update those sources from the
    evidence.
  slot: M08.2
  category: learning
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
  - title: Deep Learning — probability and information theory
    url: https://www.deeplearningbook.org/contents/prob.html
objectives:
- id: objective.mixture-models
  version: 1-draft
  statement: Mixture models assign observations probabilistically to latent components; expectation-maximization
    alternates responsibility estimates and parameter updates under a chosen model.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - mixture-models.base
  - mixture-models.transfer
  prerequisites:
  - anyOf:
    - objective.bayes-rule
  - anyOf:
    - objective.clustering
scenes:
- id: mixture-models.s1
  title: Model several possible generating components
  type: explanation
  depth: intuition
  objective_refs:
  - objective.mixture-models
  markdown: 'A mixture combines component distributions with nonnegative weights that sum to one. A two-Gaussian
    mixture might describe measurements from two overlapping machine settings. The component label is latent:
    the model does not directly observe which component generated each data point.


    A **Gaussian** is a bell-shaped distribution. Imagine small and large parcel machines producing overlapping
    weight ranges. The **mixture weight** describes how often each component is used; **latent** means the
    component identity for an individual parcel is hidden. An observation near the overlap can fit either source.'
  text_mode: 'A mixture combines component distributions with nonnegative weights that sum to one. A two-Gaussian
    mixture might describe measurements from two overlapping machine settings. The component label is latent:
    the model does not directly observe which component generated each data point.


    A **Gaussian** is a bell-shaped distribution. Imagine small and large parcel machines producing overlapping
    weight ranges. The **mixture weight** describes how often each component is used; **latent** means the
    component identity for an individual parcel is hidden. An observation near the overlap can fit either source.'
  bridges: []
- id: mixture-models.s2
  title: Compute soft membership
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mixture-models
  markdown: A responsibility is the posterior probability that a component generated an observation under current
    parameters. If weighted likelihoods for two components are 0.12 and 0.08, normalize by 0.20 to obtain responsibilities
    0.6 and 0.4. Unlike a hard cluster label, both components can receive partial responsibility.
  text_mode: A responsibility is the posterior probability that a component generated an observation under
    current parameters. If weighted likelihoods for two components are 0.12 and 0.08, normalize by 0.20 to
    obtain responsibilities 0.6 and 0.4. Unlike a hard cluster label, both components can receive partial responsibility.
  bridges: []
- id: mixture-models.s3
  title: Alternate two steps
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mixture-models
  markdown: 'The E-step estimates responsibilities using current parameters. The M-step updates parameters
    to improve the expected complete-data objective using those responsibilities. Exact EM has a nondecreasing
    likelihood property under its usual setup, but can converge to a local optimum and can encounter degenerate
    solutions without suitable constraints.


    E means **expectation**; M means **maximization**. For a component with responsibilities 0.75 and 0.25
    on measurements 2 and 6, its updated mean is (0.75 × 2 + 0.25 × 6)/(0.75 + 0.25) = 3. Repeat using the
    new means and other parameters. **Degenerate** can mean a component shrinks around one point with an unrealistically
    tiny spread; limits on that spread can prevent this failure.'
  text_mode: 'The E-step estimates responsibilities using current parameters. The M-step updates parameters
    to improve the expected complete-data objective using those responsibilities. Exact EM has a nondecreasing
    likelihood property under its usual setup, but can converge to a local optimum and can encounter degenerate
    solutions without suitable constraints.


    E means **expectation**; M means **maximization**. For a component with responsibilities 0.75 and 0.25
    on measurements 2 and 6, its updated mean is (0.75 × 2 + 0.25 × 6)/(0.75 + 0.25) = 3. Repeat using the
    new means and other parameters. **Degenerate** can mean a component shrinks around one point with an unrealistically
    tiny spread; limits on that spread can prevent this failure.'
  bridges: []
- id: mixture-models.s4
  title: Do not force components into human categories
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mixture-models
  markdown: A component can describe a statistical pattern rather than a distinct real-world population. The
    number and family of components are modeling choices. Check initialization sensitivity, held-out likelihood,
    parameter degeneracy, and whether the intended interpretation is supported independently. A latent component
    is not automatically an expert with a named specialty.
  text_mode: A component can describe a statistical pattern rather than a distinct real-world population. The
    number and family of components are modeling choices. Check initialization sensitivity, held-out likelihood,
    parameter degeneracy, and whether the intended interpretation is supported independently. A latent component
    is not automatically an expert with a named specialty.
  bridges: []
- id: mixture-models.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.mixture-models
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Mixture models assign observations probabilistically to latent components; expectation-maximization
    alternates responsibility estimates and parameter updates under a chosen model.
