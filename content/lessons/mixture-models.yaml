schema_version: 0.2-draft
lesson:
  id: mixture-models
  version: 0.1.0-draft
  title: Let several hidden sources explain the data
  state: draft
  summary: Mixture models assign observations probabilistically to latent components; expectation-maximization alternates
    responsibility estimates and parameter updates under a chosen model.
  slot: M08.2
  category: learning
  minutes: 12
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
  - title: Deep Learning — probability and information theory
    url: https://www.deeplearningbook.org/contents/prob.html
objectives:
- id: objective.mixture-models
  version: 1-draft
  statement: Mixture models assign observations probabilistically to latent components; expectation-maximization
    alternates responsibility estimates and parameter updates under a chosen model.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - mixture-models.base
  - mixture-models.transfer
  prerequisites:
  - anyOf:
    - objective.bayes-rule
  - anyOf:
    - objective.clustering
scenes:
- id: mixture-models.s1
  title: Model several possible generating components
  type: explanation
  depth: intuition
  objective_refs:
  - objective.mixture-models
  markdown: 'A mixture combines component distributions with nonnegative weights that sum to one. A two-Gaussian
    mixture might describe measurements from two overlapping machine settings. The component label is latent: the
    model does not directly observe which component generated each data point.'
  text_mode: 'A mixture combines component distributions with nonnegative weights that sum to one. A two-Gaussian
    mixture might describe measurements from two overlapping machine settings. The component label is latent: the
    model does not directly observe which component generated each data point.'
  bridges: []
- id: mixture-models.s2
  title: Compute soft membership
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mixture-models
  markdown: A responsibility is the posterior probability that a component generated an observation under current
    parameters. If weighted likelihoods for two components are 0.12 and 0.08, normalize by 0.20 to obtain responsibilities
    0.6 and 0.4. Unlike a hard cluster label, both components can receive partial responsibility.
  text_mode: A responsibility is the posterior probability that a component generated an observation under current
    parameters. If weighted likelihoods for two components are 0.12 and 0.08, normalize by 0.20 to obtain responsibilities
    0.6 and 0.4. Unlike a hard cluster label, both components can receive partial responsibility.
  bridges: []
- id: mixture-models.s3
  title: Alternate two steps
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mixture-models
  markdown: The E-step estimates responsibilities using current parameters. The M-step updates parameters to improve
    the expected complete-data objective using those responsibilities. Exact EM has a nondecreasing likelihood property
    under its usual setup, but can converge to a local optimum and can encounter degenerate solutions without suitable
    constraints.
  text_mode: The E-step estimates responsibilities using current parameters. The M-step updates parameters to improve
    the expected complete-data objective using those responsibilities. Exact EM has a nondecreasing likelihood property
    under its usual setup, but can converge to a local optimum and can encounter degenerate solutions without suitable
    constraints.
  bridges: []
- id: mixture-models.s4
  title: Do not force components into human categories
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mixture-models
  markdown: A component can describe a statistical pattern rather than a distinct real-world population. The number
    and family of components are modeling choices. Check initialization sensitivity, held-out likelihood, parameter
    degeneracy, and whether the intended interpretation is supported independently. A latent component is not automatically
    an expert with a named specialty.
  text_mode: A component can describe a statistical pattern rather than a distinct real-world population. The number
    and family of components are modeling choices. Check initialization sensitivity, held-out likelihood, parameter
    degeneracy, and whether the intended interpretation is supported independently. A latent component is not automatically
    an expert with a named specialty.
  bridges: []
- id: mixture-models.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.mixture-models
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: mixture-models.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.mixture-models
  markdown: Mixture models assign observations probabilistically to latent components; expectation-maximization
    alternates responsibility estimates and parameter updates under a chosen model.
  text_mode: Mixture models assign observations probabilistically to latent components; expectation-maximization
    alternates responsibility estimates and parameter updates under a chosen model.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - mixture-models.s1
    - mixture-models.s2
    - mixture-models.s3
    - mixture-models.s4
    - mixture-models.check
    - mixture-models.recap
    gate_refs:
