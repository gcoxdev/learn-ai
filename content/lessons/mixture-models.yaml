assessment_families:
- id: mixture-models.base
  objective_ref: objective.mixture-models
  task: base
  response_type: single_choice
  points: 1
  hint: 'Compute soft membership: trace the inputs, operation, and result before choosing.'
  remediation_scene: mixture-models.s2
  variants:
  - id: mixture-models.base.1
    prompt: Weighted likelihoods are 0.3 and 0.1. What is the first responsibility?
    options:
    - id: c
      text: '3'
    - id: a
      text: '0.75'
    - id: b
      text: '0.3'
    answer: a
    feedback: Normalize 0.3 by total 0.4.
  - id: mixture-models.base.2
    prompt: What does the E-step estimate?
    options:
    - id: a
      text: Latent responsibilities under current parameters
    - id: b
      text: Only the final test labels
    - id: c
      text: A guaranteed global optimum
    answer: a
    feedback: The E-step computes expectations for hidden assignments or variables.
- id: mixture-models.transfer
  objective_ref: objective.mixture-models
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Do not force components into human categories: trace the inputs, operation, and result before choosing.'
  remediation_scene: mixture-models.s4
  variants:
  - id: mixture-models.transfer.1
    prompt: EM reaches different solutions from different initializations. Is that necessarily a software bug?
    options:
    - id: a
      text: No; local optima can differ
    - id: b
      text: Yes; EM always finds one global solution
    - id: c
      text: Only if the data are numeric
    answer: a
    feedback: Monotonic improvement does not imply global optimality.
  - id: mixture-models.transfer.2
    prompt: A mixture has three components. Does that prove three natural populations exist?
    options:
    - id: b
      text: Yes, by definition
    - id: c
      text: Only if all weights are positive
    - id: a
      text: No; components reflect a modeling choice
    answer: a
    feedback: Statistical components need independent interpretation and validation.
