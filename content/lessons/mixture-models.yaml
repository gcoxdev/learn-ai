schema_version: 0.2-draft
lesson:
  id: mixture-models
  version: 0.3.0-draft
  title: Let several hidden sources explain the data
  state: draft
  summary: Let one measurement partly fit more than one possible source, then update those sources from the
    evidence.
  slot: M08.2
  category: learning
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
  - title: Deep Learning — probability and information theory
    url: https://www.deeplearningbook.org/contents/prob.html
objectives:
- id: objective.mixture-models
  version: 1-draft
  statement: Mixture models assign observations probabilistically to latent components; expectation-maximization
    alternates responsibility estimates and parameter updates under a chosen model.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - mixture-models.base
  - mixture-models.transfer
  prerequisites:
  - anyOf:
    - objective.bayes-rule
  - anyOf:
    - objective.clustering
scenes:
- id: mixture-models.s1
  title: One measurement can fit more than one source
  type: explanation
  depth: intuition
  objective_refs:
  - objective.mixture-models
  markdown: 'Imagine two machines producing small and large parcels with overlapping weight ranges. A **mixture
    model** combines a probability distribution for each source. A two-Gaussian mixture uses two bell-shaped
    distributions.


    Each **mixture weight** describes how often its component is used; the weights are nonnegative and add
    to one. For an individual parcel, the source identity is **latent**, meaning unobserved. A weight in the
    overlap can plausibly come from either machine.'
  text_mode: 'Imagine two machines producing small and large parcels with overlapping weight ranges. A **mixture
    model** combines a probability distribution for each source. A two-Gaussian mixture uses two bell-shaped
    distributions.


    Each **mixture weight** describes how often its component is used; the weights are nonnegative and add
    to one. For an individual parcel, the source identity is **latent**, meaning unobserved. A weight in the
    overlap can plausibly come from either machine.'
  bridges: []
- id: mixture-models.s2
  title: Compute soft membership
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mixture-models
  markdown: A responsibility is the posterior probability that a component generated an observation under current
    parameters. If weighted likelihoods for two components are 0.12 and 0.08, normalize by 0.20 to obtain responsibilities
    0.6 and 0.4. Unlike a hard cluster label, both components can receive partial responsibility.
  text_mode: A responsibility is the posterior probability that a component generated an observation under
    current parameters. If weighted likelihoods for two components are 0.12 and 0.08, normalize by 0.20 to
    obtain responsibilities 0.6 and 0.4. Unlike a hard cluster label, both components can receive partial responsibility.
  bridges: []
- id: mixture-models.s3
  title: Alternate membership estimates and model updates
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mixture-models
  markdown: '**Expectation-maximization (EM)** alternates two steps. The **E-step**, for expectation, calculates
    each component’s responsibilities using the current settings. The **M-step**, for maximization, updates
    the settings using those responsibilities.


    Suppose one component has responsibilities 0.75 and 0.25 for measurements 2 and 6. Its new mean is (0.75
    × 2 + 0.25 × 6) / (0.75 + 0.25) = 3. Repeat with the new mean and other updated parameters.


    Exact EM does not decrease the data likelihood under its usual setup, but it can stop at a local optimum.
    It can also reach a **degenerate** solution, such as a component shrinking around one point with an unrealistically
    small spread. Constraints on the spread can prevent that failure.'
  text_mode: '**Expectation-maximization (EM)** alternates two steps. The **E-step**, for expectation, calculates
    each component’s responsibilities using the current settings. The **M-step**, for maximization, updates
    the settings using those responsibilities.


    Suppose one component has responsibilities 0.75 and 0.25 for measurements 2 and 6. Its new mean is (0.75
    × 2 + 0.25 × 6) / (0.75 + 0.25) = 3. Repeat with the new mean and other updated parameters.


    Exact EM does not decrease the data likelihood under its usual setup, but it can stop at a local optimum.
    It can also reach a **degenerate** solution, such as a component shrinking around one point with an unrealistically
    small spread. Constraints on the spread can prevent that failure.'
  bridges: []
- id: mixture-models.s4
  title: Do not force components into human categories
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mixture-models
  markdown: A component can describe a statistical pattern rather than a distinct real-world population. The
    number and family of components are modeling choices. Check initialization sensitivity, held-out likelihood,
    parameter degeneracy, and whether the intended interpretation is supported independently. A latent component
    is not automatically an expert with a named specialty.
  text_mode: A component can describe a statistical pattern rather than a distinct real-world population. The
    number and family of components are modeling choices. Check initialization sensitivity, held-out likelihood,
    parameter degeneracy, and whether the intended interpretation is supported independently. A latent component
    is not automatically an expert with a named specialty.
  bridges: []
- id: mixture-models.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.mixture-models
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Mixture models allow an observation to partly fit several hidden components. EM alternates estimating
    those memberships and updating the components.
- id: mixture-models.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.mixture-models
  markdown: Mixture models allow an observation to partly fit several hidden components. EM alternates estimating
    those memberships and updating the components.
  text_mode: Mixture models allow an observation to partly fit several hidden components. EM alternates estimating
