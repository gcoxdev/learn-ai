        - tokenization.check
      gate_refs:
        - gate.core
  scene_aliases:
    tokenization.recap: tokenization.check
assessment_families:
  - response_type: single_choice
    hint: Token IDs identify vocabulary entries; their numerical sizes do not encode meaning.
    variants:
      - prompt: An invented tokenizer encodes “gardening” as IDs [17, 42]. What are those numbers?
        options:
          - id: answer
            text: Labels for vocabulary units selected by that tokenizer.
          - id: a
            text: The number of letters and the number of meanings.
          - id: b
            text: Two probabilities that should add to one.
        answer: answer
        feedback: The IDs identify entries. The model later looks up learned vectors using them; the ID numbers are not probabilities or semantic magnitudes.
        id: tokenization.base.1
        retired: true
      - prompt: Which statement about token length is reliable?
        options:
          - id: a
            text: Every token contains exactly one word.
          - id: b
            text: Every visible character always occupies exactly one byte.
          - id: answer
            text: A visible word can be represented by more than one token.
        answer: answer
        feedback: The representation depends on the tokenizer and text encoding. Word, subword, character, and byte units have different boundaries.
        id: tokenization.base.2
        retired: true
    id: tokenization.base
    objective_ref: objective.tokenization
    task: base
    points: 1
    remediation_scene: tokenization.s1
  - response_type: single_choice
    hint: Ask whether the same ID still refers to the vocabulary entry the model learned.
    variants:
      - prompt: A replacement tokenizer maps “stone” to ID 17, but the model learned ID 17 for “garden”. What should you conclude?
        options:
          - id: a
            text: The model automatically knows that the mapping changed.
          - id: b
            text: The larger the token ID, the better the answer will be.
          - id: answer
            text: The tokenizer/model mapping is inconsistent and needs a compatible design.
        answer: answer
        feedback: The lookup table is indexed by IDs, not by the intended human meaning. An incompatible tokenizer can feed the model the wrong learned entries.
        id: tokenization.transfer.1
        retired: true
      - prompt: Two tokenizers produce 6 and 11 tokens for the same sentence. Does this alone prove the first model understands the sentence better?
        options:
          - id: b
            text: Yes; token count directly measures factual accuracy.
          - id: answer
            text: No; sequence length describes a representation choice, not a complete quality evaluation.
          - id: a
            text: Yes; fewer tokens always mean better understanding.
        answer: answer
        feedback: Token counts affect resource use and segmentation. Quality requires evaluating the actual model and task, not ranking tokenizer lengths alone.
        id: tokenization.transfer.2
        retired: true
    id: tokenization.transfer
    objective_ref: objective.tokenization
    task: transfer
    points: 1
    remediation_scene: tokenization.s1
  - id: tokenization.base.v2
    objective_ref: objective.tokenization
    task: base
    response_type: single_choice
    points: 1
    hint: "Think about the three simple units: words (huge vocabulary, unknown words), characters (small vocabulary, long sequences), and bytes (256 values, never unknown). An ID is only an address."
    remediation_scene: tokenization.s2
    variants:
      - id: tokenization.base.v2.1
        prompt: A tokenizer maps "sun" to ID 812 and "moon" to ID 813. What do those numbers tell you about the two words?
        options:
          - id: b
            text: They're related in meaning, since their IDs are neighbors
          - id: c
            text: '"Moon" matters slightly more, since its ID is larger'
          - id: a
            text: Nothing about meaning; they're addresses in the vocabulary
        answer: a
        feedback: IDs are positions in a list, often set by the order pieces were added during tokenizer training. What a token means is learned in the vector its ID points to, not in the ID's size or its neighbors.
      - id: tokenization.base.v2.2
        prompt: A word-level tokenizer built from 2010 news articles meets the new word "doomscrolling". What does it produce?
        options:
          - id: a
            text: An unknown-word token, so the word's content is lost
          - id: b
            text: The word's letters, one token per character
          - id: c
            text: The known word with the most similar spelling
        answer: a
        feedback: A pure word-level vocabulary has no smaller pieces to fall back on, so any word it lacks becomes <unk>. Falling back to characters or subwords is exactly what subword and byte tokenizers add.
      - id: tokenization.base.v2.3
        prompt: You switch a model's tokenizer from word-level to character-level, on the same text. What happens?
        options:
          - id: c
            text: The vocabulary grows and each sequence gets shorter
          - id: a
            text: The vocabulary shrinks and each sequence gets longer
          - id: b
            text: Both the vocabulary and each sequence get smaller
        answer: a
        feedback: There are far fewer distinct characters than words, but every word now takes several steps instead of one. That trade, small vocabulary for long sequences, is why subword tokenizers sit in between.
      - id: tokenization.base.v2.4
        prompt: Why can a byte-level tokenizer encode an emoji or a script that never appeared in its training data?
        options:
          - id: b
            text: It keeps one token for each Unicode character that exists
          - id: a
            text: Any text is a sequence of bytes, and all 256 values are tokens
          - id: c
            text: It skips unfamiliar characters and encodes the rest of the text
        answer: a
        feedback: UTF-8 turns every character into one to four bytes, and a byte can only take 256 values, all of which are in the vocabulary. Nothing is ever unknown, though unfamiliar text costs more tokens. A token per Unicode character would need well over 100,000 entries.
  - id: tokenization.transfer.v2
    objective_ref: objective.tokenization
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask whether each ID still points to the row the model learned, and whether a string the user typed could turn into a control token.
    remediation_scene: tokenization.s4
    variants:
      - id: tokenization.transfer.v2.1
        prompt: A team fine-tunes a model, but encodes its data with a newer tokenizer version that renumbered 3,000 vocabulary entries. The outputs turn to nonsense. What happened?
        options:
          - id: a
            text: For renumbered IDs, the model fetched rows learned for other pieces
          - id: b
            text: The newer tokenizer produced too many tokens for the context
          - id: c
            text: Fine-tuning erased what the model knew about those 3,000 words
        answer: a
        feedback: The embedding table is indexed by ID, so a renumbered ID fetches the vector for whatever piece used to have that number. The fix is to use the tokenizer the model was trained with. Sequence length and forgetting don't explain nonsense on every renumbered word.
      - id: tokenization.transfer.v2.2
        prompt: A user pastes the literal text "<|endoftext|>" into a chat app built on a GPT-style model. How should the app encode it?
        options:
          - id: c
            text: As the end-of-text control token, since the characters match it
          - id: b
            text: By deleting it, since user messages can't contain those characters
          - id: a
            text: As ordinary characters that become several normal tokens
        answer: a
        feedback: Typed text should never turn into a control token, or users could fake a document boundary or a new chat turn. Deleting it would change the user's message; encoding it as plain characters keeps it harmless.
      - id: tokenization.transfer.v2.3
        prompt: Two models both accept 8,000 tokens. On English, one tokenizer averages about 4 characters per token and the other about 3. Which model fits more English text?
        options:
          - id: a
            text: The first, since each of its tokens covers more characters
          - id: b
            text: The second, since it produces more tokens for each page
          - id: c
            text: Neither, since both limits are the same number of tokens
        answer: a
        feedback: Roughly 8,000 × 4 = 32,000 characters versus 8,000 × 3 = 24,000. The limit counts tokens, so the tokenizer decides how much text that buys.
      - id: tokenization.transfer.v2.4
        prompt: Tokenizer A turns a paragraph into 60 tokens and tokenizer B turns it into 90. What does this tell you about models that use them?
        options:
          - id: b
            text: A's model understands the paragraph about 50% better
          - id: a
            text: A's model processes it in fewer steps, which costs less
          - id: c
            text: B's model is more accurate, since it sees finer detail
        answer: a
        feedback: Token count sets how many steps and how much context the text uses, which drives cost and speed. It says nothing directly about understanding or accuracy; those have to be measured on the task.
  - id: tokenization.count
    objective_ref: objective.tokenization
    task: base
    response_type: numeric
    points: 1
    hint: Count one token per UTF-8 byte. Plain English letters, digits, and spaces take 1 byte; accented Latin letters take 2; most Chinese and Japanese characters take 3.
    remediation_scene: tokenization.s2
    absolute_tolerance: 0.1
    variants:
      - id: tokenization.count.1
        prompt: A byte-level tokenizer uses one token per UTF-8 byte. How many tokens does "café au lait" become? (The é takes 2 bytes.)
        answer: 13
        feedback: There are 12 characters, including 2 spaces. Eleven take 1 byte each and é takes 2, so 11 + 2 = 13 tokens.
      - id: tokenization.count.2
        prompt: A byte-level tokenizer uses one token per UTF-8 byte. How many tokens does "Grüße" become? (ü and ß each take 2 bytes.)
        answer: 7
        feedback: G, r, and e take 1 byte each, and ü and ß take 2 each, so 3 + 4 = 7 tokens for 5 characters.
      - id: tokenization.count.3
        prompt: A byte-level tokenizer uses one token per UTF-8 byte. How many tokens does "東京タワー" (Tokyo Tower, 5 characters) become, if each character takes 3 bytes?
        answer: 15
        feedback: 5 characters × 3 bytes = 15 tokens. The same phrase in English letters, "Tokyo Tower", would be 11 bytes.
      - id: tokenization.count.4
        prompt: A character-level tokenizer uses one token per character, spaces included. How many tokens does "São Paulo" become?
        answer: 9
        feedback: S, ã, o, space, P, a, u, l, o gives 9 characters. A byte-level tokenizer would give 10, since ã takes 2 bytes.
