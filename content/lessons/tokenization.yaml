schema_version: 0.2-draft
lesson:
  id: tokenization
  version: 0.4.0-draft
  title: How text becomes tokens
  state: draft
  summary: A language model never sees your letters. See how text is chopped into pieces and swapped for numbers, and why "東京" can cost three times as many bytes as it has characters.
  slot: M14.4
  category: learning
  sources:
    - title: Neural Machine Translation of Rare Words with Subword Units (Sennrich, Haddow & Birch, 2016)
      url: https://aclanthology.org/P16-1162/
    - title: "BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding (Devlin et al., 2018)"
      url: https://arxiv.org/abs/1810.04805
    - title: Language Models are Unsupervised Multitask Learners (Radford et al., 2019), the GPT-2 paper, section 2.2 on byte-level BPE
      url: https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf
    - title: "Python documentation: Unicode HOWTO"
      url: https://docs.python.org/3/howto/unicode.html
objectives:
  - id: objective.tokenization
    version: 2-draft
    statement: Distinguish text units from token IDs and diagnose the effects of a tokenizer mismatch.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - tokenization.base.v2
      - tokenization.transfer.v2
      - tokenization.count
    prerequisites:
      - anyOf:
          - objective.inside-a-system
      - anyOf:
          - objective.digital-representations
scenes:
  - title: Your sentence arrives as a list of numbers
    markdown: |-
      Type "unhappy cats" into a chatbot. Before the model does anything, a **tokenizer** chops the text into pieces called **tokens**, perhaps `un`, `happy`, and ` cats` (with its leading space). Then it swaps each piece for its number in a fixed list, the **vocabulary**. Say the IDs are 403, 7291, and 12066. The model receives `[403, 7291, 12066]`. It never sees a letter.

      Each ID is an address, like a locker number. The model uses it to fetch that token's learned vector from a table (the next lesson's topic). ID 12066 isn't "bigger" or "more important" than ID 403, and IDs 812 and 813 needn't be related at all. (These IDs are made up; every tokenizer numbers its vocabulary differently.)

      On the way out, the model scores every ID in the vocabulary, one ID is picked (the lesson on next-token prediction shows how), and the tokenizer turns it back into text. That reverse step is called **decoding** or detokenizing.
    diagram:
      caption: From text to model and back. The model only ever handles IDs and vectors.
      description: The text "unhappy cats" goes to the tokenizer, which produces the tokens un, happy, and " cats". Each token is replaced by its vocabulary ID, giving 403, 7291, 12066. Each ID selects a learned vector from the embedding table. The vectors go into the model, which scores every ID; one is picked as the next token. The tokenizer decodes that ID back into text.
      nodes:
        - id: text
          label: '"unhappy cats"'
          note: text
          col: 0
          row: 0
        - id: tokens
          label: un | happy | ␣cats
          note: tokens
          col: 1
          row: 0
          tone: accent
        - id: ids
          label: 403, 7291, 12066
          note: token IDs
          col: 2
          row: 0
          tone: data
        - id: vectors
          label: Embedding lookup
          note: one vector per ID
          col: 3
          row: 0
        - id: model
          label: Language model
          col: 4
          row: 0
        - id: next
          label: Next-token ID
          col: 4
          row: 1
          tone: data
        - id: decode
          label: Decoded text
          note: ID back to characters
          col: 3
          row: 1
      edges:
        - from: text
          to: tokens
          label: tokenize
        - from: tokens
          to: ids
          label: look up
        - from: ids
          to: vectors
        - from: vectors
          to: model
        - from: model
          to: next
        - from: next
          to: decode
          label: decode
    id: tokenization.s1
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tokenization
  - title: Words, characters, or bytes?
    markdown: |-
      What should the pieces be? Three simple answers each break somewhere:

      | Unit | Vocabulary | Weak spot |
      | --- | --- | --- |
      | Words | hundreds of thousands, and still incomplete | new words, names, typos become `<unk>` ("unknown") |
      | Characters | small (though Unicode defines over 100,000 characters) | sequences get long: every letter is a step |
      | Bytes | exactly 256 values | even longer sequences for most non-English text |

      A byte-level tokenizer can never meet an unknown symbol, because every text is a sequence of bytes. But as you saw in the lesson on how computers store text, UTF-8 uses one byte for each plain English letter and two to four for every other character. Run this to see the cost:

      ```python run
      texts = ["hello", "café", "Привет", "東京", "नमस्ते", "👍🏽"]

      print(f"{'text':8} {'chars':>5} {'bytes':>5}  first bytes")
      for t in texts:
          b = t.encode("utf-8")
          print(f"{t:8} {len(t):5} {len(b):5}  {list(b[:6])}")

      sentence = "I love Tokyo 東京"
      print("\nword tokens:     ", sentence.split())
      print("character tokens:", len(sentence))
      print("byte tokens:     ", len(sentence.encode("utf-8")))
      ```

      "Привет" (Russian for "hi") has 6 characters but 12 bytes; "東京" (Tokyo) has 2 characters and 6 bytes. Python counts *code points*, Unicode's numbered characters, so the thumbs-up with a skin-tone modifier counts as 2, and "नमस्ते" (Hindi) counts as 6, even though each looks shorter on screen. Try adding a word in your own language and predict its byte count first.

      :::mixup "A token is a word."
      A token is whatever unit the tokenizer uses: a word, part of a word, a single character, a byte, or a punctuation mark. "unhappy" might be one token, two, or seven, depending on the tokenizer.
      :::
    id: tokenization.s2
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tokenization
  - title: One phrase, three ways to cut it
    markdown: |-
      Modern language models use **subword** tokens, a middle ground: common words get a single token, and rare words are built from smaller pieces that the tokenizer already has. The table shows the phrase "red bird" cut three ways.

      In the subword row, the space travels with the next piece. Many tokenizers, including GPT-2's, work this way, so "bird" at the start of a text and " bird" after a space can be different tokens. This toy vocabulary happens to lack " bird", so it builds it from " bi" and "rd"; a real vocabulary would almost certainly include such a common word.

      Subwords handle words the tokenizer has never seen. "Unfriendliest" might become `un` + `friend` + `li` + `est`: no `<unk>`, and each piece has been seen in other words. The cost is that a model's "context length" counts tokens, not words. A common rule of thumb for English with GPT-style tokenizers is about four characters, or three-quarters of a word, per token. For other languages the ratio can be much worse, which the lesson on tokenization tradeoffs measures.
    type: table
    columns:
      - Toy representation
      - Units
    rows:
      - - Words
        - red | bird
      - - Characters
        - r | e | d | space | b | i | r | d
      - - Possible subwords
        - red | space+bi | rd
    id: tokenization.s3
    depth: mechanics
    objective_refs:
      - objective.tokenization
  - title: The vocabulary and the weights must agree
    markdown: |-
      A model learns one vector for each ID. If its tokenizer said ID 17 = "garden", row 17 of its table holds what it learned about gardens. Now encode your text with a different tokenizer, where ID 17 = "stone". The model fetches row 17 and reads "garden" wherever you wrote "stone". Nothing crashes; the output just becomes quietly wrong.

      :::predict A tokenizer update adds 500 new tokens at the *end* of the vocabulary and changes nothing else. Can an old model use it as-is?
      Not quite. Old IDs keep their meaning, but the new tokenizer will use the 500 new tokens wherever they fit, even in text the old one handled fine. The model's table has no rows for those IDs, so they point past the end of the table or at untrained rows. The model needs new rows, and training for them, before it can use those tokens.
      :::

      So a tokenizer and a model ship together, like a lock and its key. Save the tokenizer files, the text cleanup rules, and the special tokens with the model weights.
    id: tokenization.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tokenization
  - title: Special tokens are the punctuation of the machine
    markdown: |-
      Some IDs don't stand for text at all. **Special tokens** mark structure: where a document ends, where a new chat turn starts, or which part is a question. BERT (2018) puts `[CLS]` at the start of every input and `[SEP]` after each sentence, so a pair reads `[CLS] A [SEP] B [SEP]`. GPT-2 marks the end of each document with `<|endoftext|>`. Chat models add a **chat template**, a fixed pattern of special tokens that wraps each user and assistant turn.

      A model reacts strongly to these tokens, because it saw them in the same positions millions of times during training. So what happens if a user simply *types* the characters `<|endoftext|>`?

      A careful system encodes typed text as ordinary characters, which become several normal tokens, never the single special ID. Otherwise a user could forge the end of a document or fake a new turn in the conversation. Most tokenizer libraries let you choose whether special tokens are allowed in the input text; for user input, don't allow them.
    id: tokenization.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tokenization
  - id: tokenization.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.tokenization
    markdown: Count some bytes and characters by hand, then diagnose a renumbered vocabulary, a pasted control token, and two context limits.
    takeaway: |-
      A tokenizer turns text into pieces and each piece into an ID that addresses a row in the model's table. The pieces set the sequence length, and the tokenizer and model only work as a matched pair.
  - id: tokenization.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.tokenization
    markdown: |-
      Tokenization specifies the units a model reads and predicts. The text rules, vocabulary IDs, special tokens, and model tables must form a compatible system.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - tokenization.s1
        - tokenization.s2
        - tokenization.s3
        - tokenization.s4
