schema_version: 0.2-draft
lesson:
  id: tokenization
  version: 0.1.0-draft
  title: How text becomes tokens
  state: draft
  summary: Distinguish text units from token IDs and diagnose the effects of a tokenizer mismatch.
  slot: M14.5
  category: learning
  minutes: 12
  sources:
  - title: Neural Machine Translation of Rare Words with Subword Units
    url: https://aclanthology.org/P16-1162/
objectives:
- id: objective.tokenization
  version: 1-draft
  statement: Distinguish text units from token IDs and diagnose the effects of a tokenizer mismatch.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - tokenization.base
  - tokenization.transfer
  prerequisites:
  - anyOf:
    - objective.inside-a-system
scenes:
- title: Text needs a representation
  markdown: 'A model does not receive the word “garden” as a little object with a built-in meaning. A tokenizer
    converts text into a sequence of units and numerical IDs from a vocabulary.


    In a made-up vocabulary, “gardening” might split as “garden” and “ing”. If their IDs are 17 and 42, the
    input contains [17, 42]. Those are lookup labels, not measured amounts. ID 42 is not more meaningful than
    ID 17.'
  id: tokenization.s1
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tokenization
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Words are only one possible unit
  markdown: 'A word-based vocabulary is convenient for familiar words but has difficulty covering every name
    and spelling. Characters give smaller reusable pieces. Byte representations start from encoded bytes, so
    one visible character can occupy multiple units.


    Subword methods sit between those choices: common sequences may be whole tokens while unusual strings split
    into smaller pieces. A tokenizer’s vocabulary and rules determine the actual split. Our examples are deliberately
    invented, not measurements from a specific model.'
  id: tokenization.s2
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tokenization
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: One invented sentence, two valid designs
  markdown: 'Suppose the text is “red bird”. A word tokenizer might emit [“red”, “bird”], while a character
    tokenizer that preserves the space emits eight characters. A subword tokenizer could use a token that includes
    a leading space.


    This changes sequence length and the model’s prediction units. A context capacity measured in tokens does
    not mean the same number of words or visible characters for every tokenizer, language, or string.'
  type: table
  columns:
  - Toy representation
  - Units
  rows:
  - - Words
    - red | bird
  - - Characters
    - r | e | d | space | b | i | r | d
  - - Possible subwords
    - red | space+bi | rd
  id: tokenization.s3
  depth: mechanics
  objective_refs:
  - objective.tokenization
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: The vocabulary and the weights must agree
  markdown: 'Suppose one tokenizer assigns ID 17 to “garden” while another assigns it to “stone”. A model trained
    with the first vocabulary will look up the first meaning of ID 17 even if your input was encoded with the
    second. The resulting computation is inconsistent.


    Changing the tokenizer is not a harmless cosmetic swap. Vocabulary mappings, special tokens, text preparation,
    and the model’s embedding/output tables must agree.'
  id: tokenization.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tokenization
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Special tokens carry structure
  markdown: 'A sequence can include special IDs marking boundaries, roles, or the end of a response. A chat
    template adds the structure a particular model expects around user and assistant turns. Ordinary visible
    text and special control IDs are not automatically interchangeable.


    Next-token training predicts these representation units. More detailed lessons will compare BPE and unigram
    training algorithms, multilingual splits, and template-specific conventions; this lesson establishes what
    the representation does.'
  id: tokenization.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tokenization
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- id: tokenization.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.tokenization
  markdown: Use a fresh example to check what you can explain. Hints remain available for practice.
  text_mode: Labeled controls and untimed feedback.
- id: tokenization.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.tokenization
  markdown: Tokenization specifies the units a model reads and predicts. The text rules, vocabulary IDs, special
    tokens, and model tables must form a compatible system.
  text_mode: Tokenization specifies the units a model reads and predicts. The text rules, vocabulary IDs, special
    tokens, and model tables must form a compatible system.
