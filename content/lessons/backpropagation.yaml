schema_version: 0.2-draft
lesson:
  id: backpropagation
  version: 0.4.0-draft
  title: How an error reaches earlier weights
  state: draft
  summary: A network misses its target by 2. Which of its weights is to blame, and by how much? Trace the backward sweep that answers that for every weight at once.
  slot: M11.4
  category: learning
  sources:
    - title: Dive into Deep Learning — forward/backward computation
      url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html
    - title: Dive into Deep Learning — calculus
      url: https://d2l.ai/chapter_preliminaries/calculus.html
    - title: "Rumelhart, Hinton & Williams — Learning representations by back-propagating errors (Nature, 1986)"
      url: https://doi.org/10.1038/323533a0
  archetype: mechanism
objectives:
  - id: objective.backpropagation
    version: 2-draft
    statement: Trace a forward loss, multiply local derivatives backward, and add contributions when a parameter affects more than one branch.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - backpropagation.base.v2
      - backpropagation.transfer.v2
    prerequisites:
      - anyOf:
          - objective.update-consequence
      - anyOf:
          - objective.chain-rule
scenes:
  - id: backpropagation.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.backpropagation
    title: A wrong answer doesn't name the culprit
    markdown: |-
      Your network predicts 6 and the target is 4. It has dozens of weights, and a real one has billions. Which should move, in which direction, and how much? A single loss number doesn't say.

      What you want for each weight $w$ is its **gradient** entry $\partial L / \partial w$: how fast the loss $L$ changes when that one weight is nudged up. **Backpropagation** computes all of them in one backward sweep through the calculation, using the chain rule you already know. The sweep costs only a small multiple of one forward pass, whether the network has ten weights or ten billion. That efficiency is why every modern network trains this way.

      :::story Invented more than once
      Seppo Linnainmaa described the general method, reverse-mode automatic differentiation, in his 1970 master's thesis. Paul Werbos suggested using it to train neural networks in his 1974 PhD thesis and worked out that application in detail in 1982. It took off after David Rumelhart, Geoffrey Hinton, and Ronald Williams showed in *Nature* in 1986 that it could train hidden layers to learn useful internal features, the missing piece that had stalled the field since the perceptron era.
      :::
    bridges:
      - chain-rule
  - id: backpropagation.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.backpropagation
    title: Leave breadcrumbs on the forward trip
    markdown: |-
      Start with the smallest possible model, a single weight: prediction $p = w \times x$. Use input $x = 3$, weight $w = 2$, and target $t = 4$, and write down every intermediate value:

      | Quantity | Rule | Value |
      | --- | --- | ---: |
      | Prediction $p$ | $w \times x$ | 6 |
      | Residual $r$ | $p - t$ | 2 |
      | Loss $L$ | $r^2$ | 4 |

      Drawn as boxes and arrows, this is a **computational graph**: each node is a value, and each arrow is one simple operation. The backward sweep will need $p$ and $r$, so keep them. Those saved values are the breadcrumbs.
    bridges: []
    diagram:
      caption: The forward trip for one weight. The backward sweep retraces these arrows from right to left.
      description: The weight w and the fixed input x both feed a multiply node that produces the prediction p equals 6. Subtracting the fixed target t equals 4 gives the residual r equals 2. Squaring r gives the loss L equals 4.
      nodes:
        - id: w
          label: w = 2
          note: the weight to blame
          col: 0
          row: 0
          tone: accent
        - id: x
          label: x = 3
          note: fixed input
          col: 0
          row: 1
          tone: data
        - id: p
          label: p = w × x = 6
          col: 1
          row: 0
        - id: t
          label: t = 4
          note: fixed target
          col: 1
          row: 1
          tone: data
        - id: r
          label: r = p − t = 2
          col: 2
          row: 0
        - id: loss
          label: L = r² = 4
          col: 3
          row: 0
          tone: warn
      edges:
        - from: w
          to: p
        - from: x
          to: p
        - from: p
          to: r
        - from: t
          to: r
        - from: r
          to: loss
          label: square
  - id: backpropagation.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.backpropagation
    title: Multiply the local slopes backward
    markdown: |-
      Walk the graph from right to left. At each arrow, ask one small local question: if this node's input rises by a little, how fast does its output rise?

      | Arrow | Local slope | Value |
      | --- | --- | ---: |
      | $r \to L$ (square) | $\partial L / \partial r = 2r$ | 4 |
      | $p \to r$ (subtract $t$) | $\partial r / \partial p = 1$ | 1 |
      | $w \to p$ (multiply by $x$) | $\partial p / \partial w = x$ | 3 |

      The chain rule multiplies them:

      $$\frac{\partial L}{\partial w} = \frac{\partial L}{\partial r} \cdot \frac{\partial r}{\partial p} \cdot \frac{\partial p}{\partial w} = 4 \times 1 \times 3 = 12$$

      Read 12 as: near $w = 2$, raising the weight by 0.001 raises the loss by about 0.012. The gradient is a rate, not the loss itself: here they're 12 and 4.

      :::predict Keep w = 2 and t = 4 but change the input to x = 1. What is ∂L/∂w now?
      Now $p = 2$ and $r = -2$, so $\partial L / \partial r = -4$, and $\partial p / \partial w = x = 1$. The gradient is $-4 \times 1 \times 1 = -4$. The sign flipped because the prediction is now too *low*: raising $w$ would lower the loss.
      :::
    bridges:
      - derivatives
      - chain-rule
  - id: backpropagation.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.backpropagation
    title: The update is a separate step
    markdown: |-
      Backpropagation's job ends at 12. What to *do* with it is the optimizer's job. Plain gradient descent, from the optimization module, steps against the gradient: with step size 0.01, $w$ becomes $2 - 0.01 \times 12 = 1.88$. The new prediction is 5.64 and the new loss is $1.64^2 = 2.6896$, down from 4.

      Keep the two jobs apart in your head and in your code. If training misbehaves, you can then ask separately: is the gradient right, or is the step size wrong? A perfect gradient with a step size of 1 would give $w = 2 - 12 = -10$ and a loss of 1156.
    bridges: []
  - id: backpropagation.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.backpropagation
    markdown: Push fresh numbers backward through a one-weight model, then add up the blame for a weight that reaches the loss by two different routes.
    takeaway: |-
      The forward pass computes values; the backward pass multiplies local slopes along each path and adds across paths to get every gradient; the optimizer then changes the weights. Multiply along, add across.
  - id: backpropagation.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.backpropagation
    markdown: |-
      Backpropagation applies the chain rule through a computation to calculate gradients; an optimizer then uses those gradients to update parameters.
  - id: backpropagation.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.backpropagation
    title: Add the blame when a weight has two routes
    markdown: |-
      Now let one weight reach the loss by two routes: $L = (w - 1)^2 + (w - 3)^2$. At $w = 2$:

      - Route 1 contributes $2(w - 1) = 2$.
      - Route 2 contributes $2(w - 3) = -2$.
      - The total is $2 + (-2) = 0$.

      Following just one route would suggest a step in the wrong direction, when in fact $w = 2$ is the best compromise between the two targets. In a real network this happens constantly: a weight is shared across every example in a batch, and a hidden unit feeds several units in the next layer. Each route's blame is added up.

      :::key Multiply along, add across
      Along one path, multiply the local slopes. Where several paths reach the same value, add their contributions.
      :::
    bridges: []
  - id: backpropagation.s8
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.backpropagation
    title: Backpropagate through the little network
    markdown: |-
      Return to the forward-pass network at $x = 2$: hidden values $h = [3, 1]$, output $y = 6$, target 5, loss $(y - t)^2 = 1$. Sweep backward:

      | Value | Gradient | Why |
      | --- | --- | --- |
      | output $y$ | $2(y - t) = 2$ | slope of the square |
      | output weights $[1, 2]$ | $2 \times h = [6, 2]$ | each weight multiplied its $h$ |
      | hidden values $h$ | $2 \times [1, 2] = [2, 4]$ | each $h$ was multiplied by its weight |
      | hidden pre-activations $z$ | $[2, 4] \times [1, 1] = [2, 4]$ | ReLU's slope is 1 where $z > 0$ |
      | input weights $[2, -1]$ | $[2, 4] \times x = [4, 8]$ | each weight multiplied $x = 2$ |

      Every row is "multiply along": the gradient arriving from the right times one local slope.

      :::predict Now use x = 4 with target 7. The second hidden unit's pre-activation is −1. What gradient reaches its input weight?
      Zero. ReLU's slope is 0 where $z < 0$, so the chain is multiplied by 0 at that unit. A unit that was switched off for this example gets no blame and no update from it. The first unit's input weight gets $2 \times 1 \times 1 \times 4 = 8$.
      :::

      :::papers Backprop in matrix form
      Write $\delta = \partial L / \partial z$ for a layer's pre-activations. For $h = \text{ReLU}(z_1)$, $z_1 = W_1 x + b_1$, $\hat{y} = W_2 h + b_2$:

      $$\delta_1 = \big(W_2^\top \delta_2\big) \odot \text{ReLU}'(z_1), \qquad \frac{\partial L}{\partial W_1} = \delta_1\, x^\top, \qquad \frac{\partial L}{\partial b_1} = \delta_1$$

      where $\odot$ multiplies entry by entry. With our numbers: $\delta_2 = 2$, $W_2^\top \delta_2 = [2, 4]$, $\text{ReLU}'(z_1) = [1, 1]$, so $\delta_1 = [2, 4]$ and $\partial L / \partial W_1 = [4, 8]$, matching the table. $W_2^\top$ sends blame backward along the same arrows the forward pass used.
      :::
    bridges: []
  - id: backpropagation.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.backpropagation
    title: Check your gradients with a nudge
    markdown: |-
      How do you know a backward pass is right? Nudge a weight both ways and measure. For the one-weight model, $L(2.001) = 4.012009$ and $L(1.999) = 3.988009$, so

      $$\frac{L(2.001) - L(1.999)}{0.002} = \frac{0.024}{0.002} = 12$$

      which matches backprop. That's the central-difference check from the gradient-checking lesson: two extra forward passes per weight, far too slow for training but perfect for testing. The program below backpropagates through the little network by hand and checks every gradient with nudges:

      ```python run
      import numpy as np

      def forward(p, x, t):
          z = p["W1"] * x + p["b1"]             # hidden pre-activations
          h = np.maximum(0, z)                  # ReLU
          y = p["W2"] @ h + p["b2"]             # output
          return z, h, y, (y - t) ** 2          # ..., squared-error loss

      def backward(p, x, t):
          z, h, y, L = forward(p, x, t)
          dy = 2 * (y - t)                      # dL/dy
          dz = dy * p["W2"] * (z > 0)           # multiply along: through W2, then ReLU
          return {"W2": dy * h, "b2": dy, "W1": dz * x, "b1": dz}

      p = {"W1": np.array([2.0, -1.0]), "b1": np.array([-1.0, 3.0]),
           "W2": np.array([1.0, 2.0]), "b2": 1.0}
      x, t = 2.0, 5.0
      print("loss:", forward(p, x, t)[3])
      eps = 1e-4
      for name, g in backward(p, x, t).items():
          num = []                              # central differences, one entry at a time
          for i in range(np.size(p[name])):
              up = {k: np.array(v, dtype=float) for k, v in p.items()}
              dn = {k: np.array(v, dtype=float) for k, v in p.items()}
              up[name].flat[i] += eps
              dn[name].flat[i] -= eps
              num.append((forward(up, x, t)[3] - forward(dn, x, t)[3]) / (2 * eps))
          print(f"{name}: backprop {np.atleast_1d(g).tolist()}  numerical {np.round(num, 6).tolist()}")
      ```

      Delete the `* (z > 0)` factor from the `dz` line of `backward` and rerun with `x, t = 4.0, 7.0`: the check catches the bug in the second unit's weights. As the gradient-checking lesson warned, test at points away from ReLU corners, where the two methods can disagree even when the code is right.
    bridges:
      - numerical-computing
  - id: backpropagation.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.backpropagation
    title: Find the missing factor
    markdown: |-
      For p=w×3 and squared loss, the local derivative dL/dp is 4. A learner reports dL/dw=4. What was missed?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: The factor dp/dw=3, giving a full derivative of 12.
        - id: b
          text: The squared loss itself must be added to get 8.
        - id: c
          text: The prediction must be subtracted to get −2.
      answer: a
      reveal_markdown: |-
        The local loss derivative must pass through the prediction rule. Multiply by dp/dw=3; do not substitute the loss value for a rate.
      hint: "The loss reaches w only through p = w × 3. Multiply the local slope dL/dp by dp/dw."
      id: backpropagation.practice.v2.7
