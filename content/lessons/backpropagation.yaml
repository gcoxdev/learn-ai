schema_version: 0.2-draft
lesson:
  id: backpropagation
  version: 0.2.0-draft
  title: How an error reaches earlier weights
  state: draft
  summary: Follow how a small weight change affects the loss through each step of a calculation.
  slot: M11.4
  category: learning
  sources:
  - title: Dive into Deep Learning — forward/backward computation
    url: https://d2l.ai/chapter_multilayer-perceptrons/backprop.html
  - title: Dive into Deep Learning — calculus
    url: https://d2l.ai/chapter_preliminaries/calculus.html
  archetype: mechanism
objectives:
- id: objective.backpropagation
  version: 2-draft
  statement: Trace a forward loss, multiply local derivatives backward, and add contributions when a parameter
    affects more than one branch.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - backpropagation.base.v2
  - backpropagation.transfer.v2
  prerequisites:
  - anyOf:
    - objective.update-consequence
  - anyOf:
    - objective.chain-rule
scenes:
- id: backpropagation.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.backpropagation
  title: A wrong answer does not name the culprit
  markdown: Suppose a toy predictor is p=w×x and its target is t. A large prediction error tells us that this
    example is poorly matched, but not how sensitive the error is to each setting. **Backpropagation** calculates
    these sensitivities efficiently through the operations used in a forward pass. It applies the chain rule
    backward from the loss. The **gradient** collects the derivatives with respect to parameters. Calculating
    the gradient and changing the parameters are separate jobs.
  text_mode: Suppose a toy predictor is p=w×x and its target is t. A large prediction error tells us that this
    example is poorly matched, but not how sensitive the error is to each setting. **Backpropagation** calculates
    these sensitivities efficiently through the operations used in a forward pass. It applies the chain rule
    backward from the loss. The **gradient** collects the derivatives with respect to parameters. Calculating
    the gradient and changing the parameters are separate jobs.
  bridges:
  - chain-rule
- id: backpropagation.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.backpropagation
  title: Leave breadcrumbs on the forward trip
  markdown: Use x=3, w=2, and target t=4. The prediction p is 6. The residual r=p−t is 2, and squared loss
    L=r² is 4. Our computational graph is w → p → r → L, with the fixed input x contributing to p. Record p
    and r because the backward calculation needs these intermediate values. A diagram is useful, but a four-row
    table with quantity, rule, and value tells the same story without relying on a picture.
  text_mode: Use x=3, w=2, and target t=4. The prediction p is 6. The residual r=p−t is 2, and squared loss
    L=r² is 4. Our computational graph is w → p → r → L, with the fixed input x contributing to p. Record p
    and r because the backward calculation needs these intermediate values. A diagram is useful, but a four-row
    table with quantity, rule, and value tells the same story without relying on a picture.
  bridges: []
- id: backpropagation.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.backpropagation
  title: Multiply the local sensitivities backward
  markdown: 'For the square, dL/dr=2r=4. For r=p−t with t fixed, dr/dp=1. For p=w×x with x fixed, dp/dw=x=3.
    The chain rule multiplies them: dL/dw=4×1×3=12. Read the result as “near this point, a small increase in
    w increases loss at roughly twelve loss units per weight unit.” The derivative is not the loss itself;
    here they are 12 and 4, respectively.'
  text_mode: 'For the square, dL/dr=2r=4. For r=p−t with t fixed, dr/dp=1. For p=w×x with x fixed, dp/dw=x=3.
    The chain rule multiplies them: dL/dw=4×1×3=12. Read the result as “near this point, a small increase in
    w increases loss at roughly twelve loss units per weight unit.” The derivative is not the loss itself;
    here they are 12 and 4, respectively.'
  bridges:
  - derivatives
  - chain-rule
- id: backpropagation.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.backpropagation
  title: Use the sign in a separate update
  markdown: An optimizer can subtract a small positive step size times the gradient. With step size 0.01, w
    becomes 2−0.01×12=1.88. The new prediction is 5.64; the new squared loss is 1.64²=2.6896. The decrease
    is consistent with the local direction, though a larger step could overshoot. Backpropagation supplied
    12. The update rule chose how to use it. Mixing those two operations makes it harder to debug a correct
    gradient with a poor step size.
  text_mode: An optimizer can subtract a small positive step size times the gradient. With step size 0.01,
    w becomes 2−0.01×12=1.88. The new prediction is 5.64; the new squared loss is 1.64²=2.6896. The decrease
    is consistent with the local direction, though a larger step could overshoot. Backpropagation supplied
    12. The update rule chose how to use it. Mixing those two operations makes it harder to debug a correct
    gradient with a poor step size.
  bridges: []
- id: backpropagation.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.backpropagation
  markdown: Use two different examples to check your understanding. Hints are available for practice. A later,
    fresh answer without hints can demonstrate personal-study mastery.
  text_mode: Labeled radio options and a submit button; no timing requirement.
  takeaway: Forward finds values; backward finds sensitivities; the optimizer changes weights. Multiply along
    a path and add where paths meet.
- id: backpropagation.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.backpropagation
  markdown: Backpropagation applies the chain rule through a computation to calculate gradients; an optimizer
    then uses those gradients to update parameters.
  text_mode: Backpropagation applies the chain rule through a computation to calculate gradients; an optimizer
    then uses those gradients to update parameters.
- id: backpropagation.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.backpropagation
  title: Add contributions when one setting has two routes
  markdown: Now let L=(w−1)²+(w−3)². The same w influences both terms. At w=2, the first route contributes
    2(w−1)=2; the second contributes 2(w−3)=−2. The total gradient is zero. Taking just one branch would wrongly
    suggest an update. A shared parameter in a large model can affect many positions and examples; their contributions
    must be combined according to the defined loss reduction. “Multiply along, add across” is the compact rule.
  text_mode: Now let L=(w−1)²+(w−3)². The same w influences both terms. At w=2, the first route contributes
    2(w−1)=2; the second contributes 2(w−3)=−2. The total gradient is zero. Taking just one branch would wrongly
    suggest an update. A shared parameter in a large model can affect many positions and examples; their contributions
    must be combined according to the defined loss reduction. “Multiply along, add across” is the compact rule.
  bridges: []
- id: backpropagation.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.backpropagation
  title: Check the gradient without trusting the code
  markdown: 'A small numerical check perturbs a weight slightly and compares the resulting loss changes with
    the derivative. This is a diagnostic, not the usual way to train millions of parameters: it needs extra
    forward evaluations and depends on step size and numerical precision. At nondifferentiable corners, such
    as ReLU at zero, the comparison needs special care. First verify a small smooth toy graph with known numbers,
    then use the same separation of forward, backward, and update in a larger system.'
  text_mode: 'A small numerical check perturbs a weight slightly and compares the resulting loss changes with
    the derivative. This is a diagnostic, not the usual way to train millions of parameters: it needs extra
    forward evaluations and depends on step size and numerical precision. At nondifferentiable corners, such
    as ReLU at zero, the comparison needs special care. First verify a small smooth toy graph with known numbers,
    then use the same separation of forward, backward, and update in a larger system.'
  bridges:
  - numerical-computing
- id: backpropagation.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.backpropagation
  title: Find the missing factor
  markdown: For p=w×3 and squared loss, the local derivative dL/dp is 4. A learner reports dL/dw=4. What was
    missed?
  text_mode: For p=w×3 and squared loss, the local derivative dL/dp is 4. A learner reports dL/dw=4. What was
    missed?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: The factor dp/dw=3, giving a full derivative of 12.
    - id: b
      text: The squared loss itself must be added to get 8.
    - id: c
      text: The prediction must be subtracted to get −2.
    answer: a
    reveal_markdown: The local loss derivative must pass through the prediction rule. Multiply by dp/dw=3;
      do not substitute the loss value for a rate.
    hint: Trace the example using the rule from the preceding pages.
    id: backpropagation.practice.v2.7
