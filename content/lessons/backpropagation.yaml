lesson:
  id: backpropagation
  version: 0.1.0-draft
  title: How an error reaches earlier weights
  state: draft
  summary: Backpropagation applies the chain rule through a computation to calculate gradients; an optimizer
    then uses those gradients to update parameters.
  slot: M11.4
  category: learning
  minutes: 11
