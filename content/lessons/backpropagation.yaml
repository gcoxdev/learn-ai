assessment_families:
  - id: backpropagation.base
    objective_ref: objective.backpropagation
    task: base
    response_type: single_choice
    points: 1
    hint: Backpropagation applies the chain rule through a computation to calculate gradients; an optimizer then uses those gradients to update parameters.
    variants:
      - id: backpropagation.base.1
        prompt: What does backpropagation principally compute?
        options:
          - id: correct
            text: Gradients of an objective through a computation.
          - id: a
            text: Only the displayed wording of a response.
          - id: b
            text: A new set of training examples.
        answer: correct
        feedback: Gradients of an objective through a computation.
        retired: true
      - id: backpropagation.base.2
        prompt: Which component uses gradients and a learning rate to change weights?
        options:
          - id: a
            text: The static test dataset.
          - id: b
            text: The user interface theme.
          - id: correct
            text: The optimizer.
        answer: correct
        feedback: The optimizer.
        retired: true
  - id: backpropagation.transfer
    objective_ref: objective.backpropagation
    task: transfer
    response_type: single_choice
    points: 1
    hint: Backpropagation applies the chain rule through a computation to calculate gradients; an optimizer then uses those gradients to update parameters.
    variants:
      - id: backpropagation.transfer.1
        prompt: Two training runs use the same gradients but different learning rates. Can their updates differ?
        options:
          - id: a
            text: No. A gradient uniquely fixes every update.
          - id: b
            text: No. Learning rate changes only the data labels.
          - id: correct
            text: Yes. The update rule also depends on the learning rate.
        answer: correct
        feedback: Yes. The update rule also depends on the learning rate.
        retired: true
      - id: backpropagation.transfer.2
        prompt: Why are intermediate forward values useful during backpropagation?
        options:
          - id: b
            text: They replace the need for an objective.
          - id: correct
            text: Local derivatives can depend on those values.
          - id: a
            text: They certify that the model is correct.
        answer: correct
        feedback: Local derivatives can depend on those values.
        retired: true
  - id: backpropagation.base.v2
    objective_ref: objective.backpropagation
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: 'Forward first: p = w × x. Then the local slope of the loss, dL/dp = 2(p − t). Finally multiply by dp/dw = x to reach the weight.'
    remediation_scene: backpropagation.s3
    variants:
      - prompt: Use p=w×x and L=(p−t)² with w=1, x=2, t=5. Record p, local derivative dL/dp, and full derivative dL/dw.
        answers:
          prediction: 2
          local: -6
          gradient: -12
        reason_answer: a
        reason_options:
          - id: a
            text: Multiply the local loss derivative by x.
          - id: c
            text: Use squared error as the derivative.
          - id: b
            text: Use the local loss derivative without the prediction factor.
        feedback: "p = 1 × 2 = 2 and dL/dp = 2(2 − 5) = −6. Multiplying by dp/dw = x = 2 gives −12. Stopping at −6 forgets that w reaches p through x."
        id: backpropagation.base.v2.1
      - prompt: Use p=w×x and L=(p−t)² with w=2, x=3, t=4. Record p, local derivative dL/dp, and full derivative dL/dw.
        answers:
          prediction: 6
          local: 4
          gradient: 12
        reason_answer: a
        reason_options:
          - id: a
            text: Multiply the local loss derivative by x.
          - id: c
            text: Use squared error as the derivative.
          - id: b
            text: Use the local loss derivative without the prediction factor.
        feedback: "p = 2 × 3 = 6 and dL/dp = 2(6 − 4) = 4. Multiplying by dp/dw = x = 3 gives 12, the lesson's example. The loss itself (4) is a value, not a rate."
        id: backpropagation.base.v2.2
      - prompt: Use p=w×x and L=(p−t)² with w=3, x=2, t=5. Record p, local derivative dL/dp, and full derivative dL/dw.
        answers:
          prediction: 6
          local: 2
          gradient: 4
        reason_answer: a
        reason_options:
          - id: b
            text: Use the local loss derivative without the prediction factor.
          - id: a
            text: Multiply the local loss derivative by x.
          - id: c
            text: Use squared error as the derivative.
        feedback: "p = 3 × 2 = 6 and dL/dp = 2(6 − 5) = 2. Multiplying by x = 2 gives 4. Here the loss is 1, so using it as the derivative would give the wrong answer."
        id: backpropagation.base.v2.3
      - prompt: Use p=w×x and L=(p−t)² with w=1, x=4, t=2. Record p, local derivative dL/dp, and full derivative dL/dw.
        answers:
          prediction: 4
          local: 4
          gradient: 16
        reason_answer: a
        reason_options:
          - id: c
            text: Use squared error as the derivative.
          - id: b
            text: Use the local loss derivative without the prediction factor.
          - id: a
            text: Multiply the local loss derivative by x.
        feedback: "p = 1 × 4 = 4 and dL/dp = 2(4 − 2) = 4. Multiplying by x = 4 gives 16. Stopping at 4 skips the factor dp/dw."
        id: backpropagation.base.v2.4
    numeric_fields:
      - id: prediction
        label: Prediction p
      - id: local
        label: Local derivative dL/dp
      - id: gradient
        label: Full derivative dL/dw
    absolute_tolerance: 1e-6
  - id: backpropagation.transfer.v2
    objective_ref: objective.backpropagation
    task: transfer
    response_type: numeric_fields_with_reason
    points: 1
    hint: Each squared term sends back its own slope, 2(w − its target). Where the routes meet at w, add them.
    remediation_scene: backpropagation.s5
    variants:
      - prompt: The shared parameter w=2 affects L=(w−1)²+(w−3)². Record each branch derivative and their sum.
        answers:
          first: 2
          second: -2
          total: 0
        reason_answer: a
        reason_options:
          - id: a
            text: Add contributions from the two routes to the shared parameter.
          - id: c
            text: Keep only the branch with larger loss.
          - id: b
            text: Multiply the two branch derivatives.
        feedback: "The routes give 2(2 − 1) = 2 and 2(2 − 3) = −2, which add to 0: w = 2 is already the best compromise. Keeping only one branch would push w the wrong way."
        id: backpropagation.transfer.v2.1
      - prompt: The shared parameter w=1 affects L=(w−2)²+(w−4)². Record each branch derivative and their sum.
        answers:
          first: -2
          second: -6
          total: -8
        reason_answer: a
        reason_options:
          - id: c
            text: Keep only the branch with larger loss.
          - id: a
            text: Add contributions from the two routes to the shared parameter.
          - id: b
            text: Multiply the two branch derivatives.
        feedback: "The routes give 2(1 − 2) = −2 and 2(1 − 4) = −6, which add to −8. Both say raise w; multiplying them would give +12 and even flip the sign."
        id: backpropagation.transfer.v2.2
      - prompt: The shared parameter w=4 affects L=(w−1)²+(w−3)². Record each branch derivative and their sum.
        answers:
          first: 6
          second: 2
          total: 8
        reason_answer: a
        reason_options:
          - id: c
            text: Keep only the branch with larger loss.
          - id: b
            text: Multiply the two branch derivatives.
          - id: a
            text: Add contributions from the two routes to the shared parameter.
        feedback: "The routes give 2(4 − 1) = 6 and 2(4 − 3) = 2, which add to 8. Multiplying (12) or keeping only the larger branch (6) misstates the blame."
        id: backpropagation.transfer.v2.3
      - prompt: The shared parameter w=3 affects L=(w−0)²+(w−2)². Record each branch derivative and their sum.
        answers:
          first: 6
          second: 2
          total: 8
        reason_answer: a
        reason_options:
          - id: b
            text: Multiply the two branch derivatives.
          - id: a
            text: Add contributions from the two routes to the shared parameter.
          - id: c
            text: Keep only the branch with larger loss.
        feedback: "The routes give 2(3 − 0) = 6 and 2(3 − 2) = 2, which add to 8. Every route that reaches w contributes, so none can be dropped."
        id: backpropagation.transfer.v2.4
    numeric_fields:
      - id: first
        label: First branch derivative
      - id: second
        label: Second branch derivative
      - id: total
        label: Total derivative
    absolute_tolerance: 1e-6
