scenes:
- id: backpropagation.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.backpropagation
  text_mode: The complete explanation is available as readable text.
  title: Start with a forward calculation
  markdown: 'A network first transforms inputs through layers to make a prediction. A loss compares that prediction
    with the target. These operations form a computation graph.


    The forward pass supplies intermediate values needed to understand how changing an earlier parameter would
    affect the final loss.'
- id: backpropagation.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.backpropagation
  text_mode: The complete explanation is available as readable text.
  title: Follow the local effects backward
  markdown: 'Backpropagation combines local derivatives using the chain rule. It calculates how the loss changes
    with respect to each trainable parameter.


    Think of a chain of effects: a weight changes an intermediate value, that changes a later value, and eventually
    the loss changes. The derivatives measure local sensitivity; they are not moral blame.'
- id: backpropagation.s3
  type: explanation
  depth: intuition
  objective_refs:
  - objective.backpropagation
  text_mode: The complete explanation is available as readable text.
  title: A derivative is not an update
  markdown: 'Backpropagation computes gradients. An optimizer uses those gradients with a learning rate and
    possibly other state to change parameters.


    Keeping the two separate explains why different optimizers can train the same network using the same gradient
    calculation.'
- id: backpropagation.s4
  type: explanation
  depth: intuition
  objective_refs:
  - objective.backpropagation
  text_mode: The complete explanation is available as readable text.
  title: For deeper mathematics, take a detour
  markdown: 'The chain rule multiplies local changes along a path and sums contributions from multiple paths.
    In a neural network these quantities can be vectors and matrices.


    You can follow the conceptual distinction between gradients and updates before deriving them. The mathematics
    bridges introduce slopes and composition in small scalar examples.'
  bridges:
  - derivatives
  - chain-rule
