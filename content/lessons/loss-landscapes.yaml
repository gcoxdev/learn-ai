assessment_families:
  - id: loss-landscapes.base
    objective_ref: objective.loss-landscapes
    task: base
    response_type: single_choice
    points: 1
    hint: Check how the loss changes in each direction away from the flat point.
    remediation_scene: loss-landscapes.s2
    variants:
      - id: loss-landscapes.base.1
        retired: true
        prompt: At the origin of a² − b², what kind of stationary point occurs?
        options:
          - id: b
            text: A strict minimum
          - id: c
            text: A strict maximum
          - id: a
            text: A saddle
        answer: a
        feedback: Different directions increase and decrease the objective.
      - id: loss-landscapes.base.2
        retired: true
        prompt: What does a two-dimensional loss plot usually show for a large model?
        options:
          - id: c
            text: A direct photograph of intelligence
          - id: a
            text: A selected slice or projection
          - id: b
            text: Every parameter direction completely
        answer: a
        feedback: The plot depends on which directions were chosen.
  - id: loss-landscapes.transfer
    objective_ref: objective.loss-landscapes
    task: transfer
    response_type: single_choice
    points: 1
    hint: A flat gradient only says the ground is level here. Ask what the nearby directions do.
    remediation_scene: loss-landscapes.s4
    variants:
      - id: loss-landscapes.transfer.1
        retired: true
        prompt: A gradient is zero. What extra question matters before calling the point a minimum?
        options:
          - id: c
            text: Whether the dataset is stored in CSV
          - id: a
            text: How the objective behaves in nearby directions
          - id: b
            text: Whether the model has a short name
        answer: a
        feedback: Stationarity alone does not classify local geometry.
      - id: loss-landscapes.transfer.2
        retired: true
        prompt: Two parameter settings produce the same predictions. Must their coordinates be identical?
        options:
          - id: a
            text: No; models can have symmetries or equivalent parameterizations
          - id: b
            text: Yes; predictions uniquely identify every weight
          - id: c
            text: Only if the loss is squared
        answer: a
        feedback: Functional equivalence need not imply parameter identity.
  - id: loss-landscapes.base.v2
    objective_ref: objective.loss-landscapes
    task: base
    response_type: numeric
    points: 1
    absolute_tolerance: 0.001
    hint: Find the curvature (the second derivative) in the steepest direction, then divide 2 by it. The steepest direction sets the limit for every weight.
    remediation_scene: loss-landscapes.s3
    variants:
      - id: loss-landscapes.base.v2.1
        prompt: Gradient descent is stable only if the learning rate is below 2 ÷ curvature. For L(w) = 4w², what is that largest stable learning rate?
        answer: 0.25
        feedback: The gradient is 8w, so the curvature is 8 and the limit is 2/8 = 0.25. Using the coefficient 4 as the curvature would give 0.5, and that rate diverges.
      - id: loss-landscapes.base.v2.2
        retired: true
        prompt: Gradient descent is stable only if the learning rate is below 2 ÷ curvature. For L(w) = (3w − 6)², what is that largest stable learning rate?
        answer: 0.111
        feedback: The gradient is 6(3w − 6) = 18w − 36, so the curvature is 18 and the limit is 2/18 ≈ 0.111. Forgetting the chain-rule factor of 3 would give curvature 6 and a limit three times too large.
      - id: loss-landscapes.base.v2.3
        prompt: Gradient descent is stable only if the learning rate is below 2 ÷ curvature. L(a, b) = 25a² + b² has curvature 50 along a and 2 along b. What is the largest stable learning rate?
        answer: 0.04
        feedback: The steep direction sets the limit, 2/50 = 0.04. Using the shallow direction's curvature would allow a rate of 1, and the a direction would blow up.
      - id: loss-landscapes.base.v2.4
        prompt: Gradient descent is stable only if the learning rate is below 2 ÷ curvature. For L(w) = 0.5w², what is that largest stable learning rate?
        answer: 2
        feedback: The gradient is w, so the curvature is 1 and the limit is 2/1 = 2. Gentle curvature allows large steps; steep curvature forces small ones.
      - id: loss-landscapes.base.v2.5
        prompt: Gradient descent is stable only if the learning rate is below 2 ÷ curvature. For L(w) = 5(w − 2)², what is that largest stable learning rate?
        answer: 0.2
        feedback: The gradient is 10(w − 2), so the curvature is 10 and the limit is 2/10 = 0.2. Using the coefficient 5 as the curvature would give 0.4, where each step multiplies the error by 1 − 0.4 × 10 = −3 and training diverges.
  - id: loss-landscapes.transfer.v2
    objective_ref: objective.loss-landscapes
    task: transfer
    response_type: single_choice
    points: 1
    hint: Zero slope means level ground, not necessarily the bottom. Ask which directions curve up or down, how steep the steepest direction is, and whether the picture shows all directions or a slice.
    remediation_scene: loss-landscapes.s2
    variants:
      - id: loss-landscapes.transfer.v2.1
        prompt: A network's training loss sits flat for 3,000 steps, then drops sharply without any change to the settings. Which landscape feature best explains this?
        options:
          - id: b
            text: A bad local minimum that training eventually climbed out of
          - id: a
            text: A saddle or plateau where the downhill slope was tiny at first
          - id: c
            text: A learning rate that was too small until it drifted upward
        answer: a
        feedback: Near a saddle, the escape direction starts with a tiny slope, so progress is slow until the weights drift far enough along it, then speeds up. Gradient descent can't climb out of a true minimum, and a fixed learning rate doesn't drift.
      - id: loss-landscapes.transfer.v2.2
        prompt: At a point where the gradient is zero, the second derivatives along two directions are +3 and −1. What kind of point is it?
        options:
          - id: c
            text: A minimum, since the larger curvature is positive
          - id: b
            text: A maximum, since one direction curves downward
          - id: a
            text: A saddle, since one direction curves up and one down
        answer: a
        feedback: Mixed signs mean the loss rises one way and falls another, which is a saddle. A minimum needs every direction to curve up, and a maximum needs every direction to curve down.
      - id: loss-landscapes.transfer.v2.3
        prompt: A blog post shows a smooth, bowl-shaped 3D plot labeled "the loss landscape of our 50-million-weight model." What does the plot actually show?
        options:
          - id: b
            text: The complete landscape, flattened to fit into three dimensions
          - id: a
            text: The loss along two chosen directions, with all others held fixed
          - id: c
            text: The path the weights took during training, drawn from above
        answer: a
        feedback: A surface plot can only vary two directions, so it's a slice through a 50-million-dimensional landscape. Other directions could look very different. It isn't the training path either, unless the directions were chosen to follow it.
      - id: loss-landscapes.transfer.v2.4
        prompt: Two networks trained from different random starts reach the same test accuracy, but their weights look completely different. What is the most likely explanation?
        options:
          - id: c
            text: One of them must be stuck in a much worse local minimum
          - id: b
            text: The weights must have been saved in two different formats
          - id: a
            text: Networks have many equally good minima, including reordered copies
        answer: a
        feedback: Swapping hidden units gives an identical function at different weights, and different starts often reach different but equally good valleys. Matching accuracy argues against one being much worse.
      - id: loss-landscapes.transfer.v2.5
        prompt: Plain gradient descent on a model with curvatures 200 and 2 must use a learning rate below 0.01 and crawls along the shallow direction. Which change targets the cause?
        options:
          - id: b
            text: Raise the learning rate so the shallow direction speeds up
          - id: a
            text: Rescale the directions, for example with Adam, so both look alike
          - id: c
            text: Train for longer, since convex problems always converge in the end
        answer: a
        feedback: The trouble is a condition number of 100, and preconditioning (which Adam approximates) evens out the curvatures. Raising the rate past 0.01 makes the steep direction diverge, and training longer just waits out the crawl.
