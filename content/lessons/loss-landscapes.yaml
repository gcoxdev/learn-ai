schema_version: 0.2-draft
lesson:
  id: loss-landscapes
  version: 0.3.0-draft
  title: Read the shape of a loss landscape
  state: draft
  summary: Your loss sits flat for an hour, then suddenly plunges. Learn to picture the terrain training walks across (bowls, ravines, saddles, and plateaus) and what each does to your steps.
  slot: M10.6
  category: learning
  sources:
    - title: Deep Learning — numerical computation
      url: https://www.deeplearningbook.org/contents/numerical.html
    - title: Dive into Deep Learning — authors’ open textbook
      url: https://d2l.ai/
    - title: Identifying and attacking the saddle point problem in high-dimensional non-convex optimization (Dauphin et al., 2014)
      url: https://arxiv.org/abs/1406.2572
    - title: Visualizing the Loss Landscape of Neural Nets (Li et al., 2018)
      url: https://arxiv.org/abs/1712.09913
objectives:
  - id: objective.loss-landscapes
    version: 3-draft
    statement: Convexity, curvature, stationary points, and saddles describe objective geometry; a two-dimensional plot is only a slice through a high-dimensional training problem.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - loss-landscapes.base.v2
      - loss-landscapes.transfer.v2
    prerequisites:
      - anyOf:
          - objective.optimization-math
      - anyOf:
          - objective.gradient-checks
scenes:
  - id: loss-landscapes.s1
    title: Five shapes to picture
    type: explanation
    depth: intuition
    objective_refs:
      - objective.loss-landscapes
    markdown: |-
      You start a training run and watch the loss. It drops fast, then sits almost perfectly flat for an hour. You're about to kill the run when the loss suddenly plunges to a new low. Nothing in your code changed. The *terrain* did.

      Imagine every setting of the weights as a spot on a map, with the loss as the height of the ground there. That picture is the **loss landscape**, and training is a walk downhill in fog, feeling only the slope underfoot. Five shapes explain most of what you'll see:

      | Shape | Picture it as | What gradient descent does |
      | --- | --- | --- |
      | **Bowl** | A round salad bowl | Rolls smoothly to the bottom. The bakery loss (2w − 6)² is one. |
      | **Ravine** | A long, narrow canyon with steep walls | Bounces wall to wall and creeps along the floor (the valley from the momentum lesson) |
      | **Saddle** | A mountain pass: uphill to the peaks on either side, downhill along the trail | Slows to a crawl at the pass, then slides off down the trail |
      | **Plateau** | A wide, nearly flat mesa | Barely moves, because the slope is tiny everywhere |
      | **Many valleys** | A mountain range with many basins | Settles into whichever basin it starts above |

      A real network has millions of weights, so its landscape has millions of directions. Any picture you've seen of one is a slice: someone picked two directions and plotted the loss along them, holding everything else fixed. Li and colleagues (2018) made the well-known images of rugged and smooth landscapes this way, using random directions rescaled filter by filter to match the network's own weights (*filter normalization*). Other directions give other pictures, so treat a slice as one view of the terrain.
    bridges: []
  - id: loss-landscapes.s2
    title: Flat ground isn't always the bottom
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.loss-landscapes
    markdown: |-
      Wherever the gradient is zero, the ground is flat. That's called a **stationary point**, and it comes in three kinds: a **minimum** (every direction goes up), a **maximum** (every direction goes down), and a **saddle point** (some directions go up and others go down).

      Take L(a, b) = a² − b² at the origin. The gradient is (2a, −2b) = (0, 0), so it's flat. Now step a little each way:

      | Point | Loss | |
      | --- | ---: | --- |
      | (0, 0) | 0 | flat |
      | (0.1, 0) | 0.01 | uphill along a |
      | (0, 0.1) | −0.01 | downhill along b |

      One direction rises and another falls, so this is a saddle, not a minimum. The second derivatives say the same thing: ∂²L/∂a² = 2 (curving up) and ∂²L/∂b² = −2 (curving down). The table of all second derivatives is the **Hessian**. At a minimum, every direction curves up (all its eigenvalues are positive). At a saddle, at least one curves down.

      Saddles are one common cause of the flat-then-plunge curve. The program below walks downhill on L = a² + (b² − 1)²/2, which has a saddle at (0, 0) and valleys at b = ±1, starting almost exactly in line with the saddle, at b = 0.000001:

      ```python run
      import numpy as np

      # loss = a**2 + (b**2 - 1)**2 / 2 : a saddle at (0, 0), valleys at b = +1 and b = -1
      def loss(w):
          a, b = w
          return a**2 + (b**2 - 1)**2 / 2

      def grad(w):
          a, b = w
          return np.array([2 * a, 2 * b * (b**2 - 1)])

      w = np.array([1.0, 1e-6])          # start almost exactly in line with the saddle
      for step in range(101):
          if step % 10 == 0:
              print(f"step {step:3d}   a={w[0]:8.5f}   b={w[1]:.2e}   loss={loss(w):.4f}")
          w = w - 0.1 * grad(w)

      H = np.array([[2.0, 0.0], [0.0, -2.0]])   # second derivatives at (0, 0)
      print("curvatures at the saddle:", np.linalg.eigvalsh(H))
      ```

      By step 20 the loss has fallen to 0.5 and stalls: a has slid to the pass, and b is still tiny. But b grows about 20% per step. Around step 60 it's big enough to matter, and the loss plunges to 0 by step 90. Change `1e-6` to `1e-12` and the plateau outlasts all 100 steps: at 20% per step, b needs about 76 extra steps to climb each factor of a million.

      :::mixup "The loss stopped falling, so training is stuck in a bad local minimum."
      In networks with millions of weights, a flat stretch is more often a saddle or plateau than a bad minimum. Dauphin and colleagues (2014) argued that in high dimensions, most flat points with high loss are saddles: to be a minimum, *every one* of millions of directions has to curve up. Noisy minibatch gradients and momentum help push training off a saddle sooner.
      :::
    bridges:
      - multivariable-calculus
  - id: loss-landscapes.s3
    title: Curvature sets the largest safe step
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.loss-landscapes
    markdown: |-
      **Curvature** is how fast the slope itself changes, measured by the second derivative. It explains the learning-rate limits you've met in this module.

      For the bakery loss (2w − 6)², the gradient is 4(2w − 6) = 8w − 24, and its derivative, the curvature, is **8**. In the first lesson, rate 0.25 was exactly the edge between oscillating and diverging. That's no coincidence:

      $$\text{gradient descent is stable only if } \eta < \frac{2}{\text{curvature}}, \qquad \frac{2}{8} = 0.25$$

      :::predict The ravine from the momentum lesson has curvature 100 along a and 1 along b. What's the largest stable learning rate, and what does it do to b?
      The steep direction sets the limit: η < 2/100 = 0.02. At η = 0.02, the shallow direction's error shrinks by a factor of only 1 − 0.02 × 1 = 0.98 per step, 2% at a time. That's why plain descent needed 241 steps there. The ratio of the biggest curvature to the smallest, here 100, is the **condition number**. The bigger it is, the more the steep directions hold the shallow ones back.
      :::

      This is the problem momentum and Adam attack. **Preconditioning** means rescaling directions so they all look equally curved; Adam does a cheap version by dividing each weight's step by its typical gradient size. Newton's method uses the full Hessian and would fix it completely, but for a billion weights the Hessian has a billion times a billion entries, far too many to store.
  - id: loss-landscapes.s4
    title: One bowl, or a mountain range
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.loss-landscapes
    markdown: |-
      A function is **convex** if the straight line between any two points on its graph never dips below the graph. A bowl is convex; a mountain range isn't. On a convex landscape there are no false bottoms: any local minimum is a global minimum, and gradient descent with a small enough step will find one.

      The bakery model is convex. So are linear regression with squared error and logistic regression. That's why those models reach the same best loss no matter where training starts.

      Neural networks are not convex. Here's one reason you can see directly: swap two hidden units in a trained network, along with their incoming and outgoing weights. The network computes exactly the same function, with exactly the same loss, but the weights now sit at a different point on the map. With 100 hidden units there are 100! ways to reorder them, so every good minimum has a vast number of identical twins. Two identical valleys with a ridge between them can't be a single bowl.

      In practice, different random starts land in different valleys that usually reach similar loss. So compare trained networks by their loss and held-out performance, never by whether their weights match.
  - id: loss-landscapes.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.loss-landscapes
    markdown: Find the largest stable learning rate for new curvatures, then diagnose a loss plateau, a flat gradient, a landscape picture, and two networks with different weights.
    takeaway: |-
      The slope tells you about nearby changes, and curvature describes how that slope changes. A zero gradient can occur at a minimum, maximum, or saddle; a small plot shows only selected directions.
  - id: loss-landscapes.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.loss-landscapes
    markdown: |-
      The slope tells you about nearby changes, and curvature describes how that slope changes. A zero gradient can occur at a minimum, maximum, or saddle; a small plot shows only selected directions.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - loss-landscapes.s1
        - loss-landscapes.s2
        - loss-landscapes.s3
        - loss-landscapes.s4
        - loss-landscapes.check
      gate_refs:
