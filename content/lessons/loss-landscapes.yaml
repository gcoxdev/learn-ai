schema_version: 0.2-draft
lesson:
  id: loss-landscapes
  version: 0.3.0-draft
  title: Read the shape of a loss landscape
  state: draft
  summary: Inspect a loss curve, then see why zero gradient and a convincing two-dimensional picture can both
    mislead.
  slot: M10.6
  category: learning
  sources:
  - title: Deep Learning — numerical computation
    url: https://www.deeplearningbook.org/contents/numerical.html
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.loss-landscapes
  version: 1-draft
  statement: Convexity, curvature, stationary points, and saddles describe objective geometry; a two-dimensional
    plot is only a slice through a high-dimensional training problem.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - loss-landscapes.base
  - loss-landscapes.transfer
  prerequisites:
  - anyOf:
    - objective.optimization-math
  - anyOf:
    - objective.gradient-checks
scenes:
- id: loss-landscapes.s1
  title: Picture how loss changes with a weight
  type: explanation
  depth: intuition
  objective_refs:
  - objective.loss-landscapes
  markdown: 'A loss returns a **scalar**, a single number, for each parameter setting. Put one adjustable weight
    on a horizontal axis and its loss on the vertical axis. The resulting curve shows where this model fits
    better or worse under that loss.


    With two weights we can draw a surface. With millions, a plot shows only selected directions, with the
    others fixed or combined. Its appearance depends on those choices. The landscape metaphor is useful, but
    the picture is only a limited view of the full training problem.'
  text_mode: 'A loss returns a **scalar**, a single number, for each parameter setting. Put one adjustable
    weight on a horizontal axis and its loss on the vertical axis. The resulting curve shows where this model
    fits better or worse under that loss.


    With two weights we can draw a surface. With millions, a plot shows only selected directions, with the
    others fixed or combined. Its appearance depends on those choices. The landscape metaphor is useful, but
    the picture is only a limited view of the full training problem.'
  bridges: []
- id: loss-landscapes.s2
  title: Distinguish stationary points
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.loss-landscapes
  markdown: 'At a stationary point the gradient is zero. A minimum is locally no higher than nearby points;
    a maximum is locally no lower. For L(a, b) = a² − b², the origin has zero gradient but increasing a raises
    loss while increasing b lowers it. This is a saddle, not a minimum.


    At (a, b) = (0, 0), the example''s loss is 0. Move to (0.1, 0) and loss becomes 0.01. Move instead to (0,
    0.1) and it becomes −0.01. Because one direction improves and another worsens, zero slope at the center
    does not prove a minimum. This mathematical example permits negative values; it is not the squared-error
    loss used earlier.'
  text_mode: 'At a stationary point the gradient is zero. A minimum is locally no higher than nearby points;
    a maximum is locally no lower. For L(a, b) = a² − b², the origin has zero gradient but increasing a raises
    loss while increasing b lowers it. This is a saddle, not a minimum.


    At (a, b) = (0, 0), the example''s loss is 0. Move to (0.1, 0) and loss becomes 0.01. Move instead to (0,
    0.1) and it becomes −0.01. Because one direction improves and another worsens, zero slope at the center
    does not prove a minimum. This mathematical example permits negative values; it is not the squared-error
    loss used earlier.'
  bridges:
  - multivariable-calculus
- id: loss-landscapes.s3
  title: Why the shape affects the steps
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.loss-landscapes
  markdown: '**Curvature** describes how a slope changes. A loss can curve sharply in one direction and gently
    in another, making fixed-step gradient descent zigzag across a narrow valley. Second derivatives describe
    this local shape.


    **Preconditioning** rescales update directions to make progress easier in the chosen geometry. Exact methods
    using second derivatives can be expensive in large models, so practical optimizers often use approximations.'
  text_mode: '**Curvature** describes how a slope changes. A loss can curve sharply in one direction and gently
    in another, making fixed-step gradient descent zigzag across a narrow valley. Second derivatives describe
    this local shape.


    **Preconditioning** rescales update directions to make progress easier in the chosen geometry. Exact methods
    using second derivatives can be expensive in large models, so practical optimizers often use approximations.'
  bridges: []
- id: loss-landscapes.s4
  title: When is a local minimum also the best overall?
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.loss-landscapes
  markdown: 'A **convex function** lies at or below the straight segment joining any two points on its graph.
    For minimization over a convex set of allowed settings, this gives a useful guarantee: a local minimum
    is also a global minimum.


    Neural-network training is generally nonconvex, so that guarantee does not generally apply. Different parameter
    settings may also produce identical predictions through symmetries in the model. Compare achieved loss
    and held-out behavior rather than assuming one attractive-looking valley identifies a unique best model.'
  text_mode: 'A **convex function** lies at or below the straight segment joining any two points on its graph.
    For minimization over a convex set of allowed settings, this gives a useful guarantee: a local minimum
    is also a global minimum.


    Neural-network training is generally nonconvex, so that guarantee does not generally apply. Different parameter
    settings may also produce identical predictions through symmetries in the model. Compare achieved loss
    and held-out behavior rather than assuming one attractive-looking valley identifies a unique best model.'
  bridges: []
- id: loss-landscapes.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.loss-landscapes
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: The slope tells you about nearby changes, and curvature describes how that slope changes. A zero
    gradient can occur at a minimum, maximum, or saddle; a small plot shows only selected directions.
- id: loss-landscapes.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
