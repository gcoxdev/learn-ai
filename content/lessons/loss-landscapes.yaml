assessment_families:
- id: loss-landscapes.base
  objective_ref: objective.loss-landscapes
  task: base
  response_type: single_choice
  points: 1
  hint: 'Distinguish stationary points: trace the inputs, operation, and result before choosing.'
  remediation_scene: loss-landscapes.s2
  variants:
  - id: loss-landscapes.base.1
    prompt: At the origin of a² − b², what kind of stationary point occurs?
    options:
    - id: b
      text: A strict minimum
    - id: c
      text: A strict maximum
    - id: a
      text: A saddle
    answer: a
    feedback: Different directions increase and decrease the objective.
  - id: loss-landscapes.base.2
    prompt: What does a two-dimensional loss plot usually show for a large model?
    options:
    - id: c
      text: A direct photograph of intelligence
    - id: a
      text: A selected slice or projection
    - id: b
      text: Every parameter direction completely
    answer: a
    feedback: The plot depends on which directions were chosen.
- id: loss-landscapes.transfer
  objective_ref: objective.loss-landscapes
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Use guarantees only in their domain: trace the inputs, operation, and result before choosing.'
  remediation_scene: loss-landscapes.s4
  variants:
  - id: loss-landscapes.transfer.1
    prompt: A gradient is zero. What extra question matters before calling the point a minimum?
    options:
    - id: c
      text: Whether the dataset is stored in CSV
    - id: a
      text: How the objective behaves in nearby directions
    - id: b
      text: Whether the model has a short name
    answer: a
    feedback: Stationarity alone does not classify local geometry.
  - id: loss-landscapes.transfer.2
    prompt: Two parameter settings produce the same predictions. Must their coordinates be identical?
    options:
    - id: a
      text: No; models can have symmetries or equivalent parameterizations
    - id: b
      text: Yes; predictions uniquely identify every weight
    - id: c
      text: Only if the loss is squared
    answer: a
    feedback: Functional equivalence need not imply parameter identity.
