schema_version: 0.2-draft
lesson:
  id: loss-landscapes
  version: 0.1.0-draft
  title: Read local geometry without imagining a visible map of every weight
  state: draft
  summary: Convexity, curvature, stationary points, and saddles describe objective geometry; a two-dimensional plot
    is only a slice through a high-dimensional training problem.
  slot: M10.6
  category: learning
  minutes: 12
  sources:
  - title: Deep Learning — numerical computation
    url: https://www.deeplearningbook.org/contents/numerical.html
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.loss-landscapes
  version: 1-draft
  statement: Convexity, curvature, stationary points, and saddles describe objective geometry; a two-dimensional
    plot is only a slice through a high-dimensional training problem.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - loss-landscapes.base
  - loss-landscapes.transfer
  prerequisites:
  - anyOf:
    - objective.optimization-math
  - anyOf:
    - objective.gradient-checks
scenes:
- id: loss-landscapes.s1
  title: A landscape is a metaphor for a function
  type: explanation
  depth: intuition
  objective_refs:
  - objective.loss-landscapes
  markdown: The loss assigns a scalar to each parameter setting. With one parameter it can be drawn as a curve;
    with millions it cannot be visualized directly. A two-dimensional slice fixes or combines the remaining directions.
    Its appearance depends on the chosen coordinates and slice.
  text_mode: The loss assigns a scalar to each parameter setting. With one parameter it can be drawn as a curve;
    with millions it cannot be visualized directly. A two-dimensional slice fixes or combines the remaining directions.
    Its appearance depends on the chosen coordinates and slice.
  bridges: []
- id: loss-landscapes.s2
  title: Distinguish stationary points
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.loss-landscapes
  markdown: At a stationary point the gradient is zero. A minimum is locally no higher than nearby points; a maximum
    is locally no lower. For L(a, b) = a² − b², the origin has zero gradient but increasing a raises loss while
    increasing b lowers it. This is a saddle, not a minimum.
  text_mode: At a stationary point the gradient is zero. A minimum is locally no higher than nearby points; a maximum
    is locally no lower. For L(a, b) = a² − b², the origin has zero gradient but increasing a raises loss while
    increasing b lowers it. This is a saddle, not a minimum.
  bridges:
  - multivariable-calculus
- id: loss-landscapes.s3
  title: Curvature affects the path
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.loss-landscapes
  markdown: A steep narrow direction and a flat broad direction can make fixed-step descent zigzag. Second-derivative
    information describes this local curvature. Preconditioning changes the scale or geometry of updates to improve
    progress. Exact second-order methods can be expensive in large models, so practical optimizers use approximations.
  text_mode: A steep narrow direction and a flat broad direction can make fixed-step descent zigzag. Second-derivative
    information describes this local curvature. Preconditioning changes the scale or geometry of updates to improve
    progress. Exact second-order methods can be expensive in large models, so practical optimizers use approximations.
  bridges: []
- id: loss-landscapes.s4
  title: Use guarantees only in their domain
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.loss-landscapes
  markdown: Convex optimization offers stronger global conclusions under suitable assumptions. Neural training is
    generally nonconvex and may have many parameter symmetries and equivalent predictions. Compare achieved loss
    and held-out behavior instead of assuming one visually attractive basin is uniquely meaningful or globally best.
  text_mode: Convex optimization offers stronger global conclusions under suitable assumptions. Neural training
    is generally nonconvex and may have many parameter symmetries and equivalent predictions. Compare achieved loss
    and held-out behavior instead of assuming one visually attractive basin is uniquely meaningful or globally best.
  bridges: []
- id: loss-landscapes.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.loss-landscapes
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Convexity, curvature, stationary points, and saddles describe objective geometry; a two-dimensional
    plot is only a slice through a high-dimensional training problem.
- id: loss-landscapes.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.loss-landscapes
  markdown: Convexity, curvature, stationary points, and saddles describe objective geometry; a two-dimensional
    plot is only a slice through a high-dimensional training problem.
  text_mode: Convexity, curvature, stationary points, and saddles describe objective geometry; a two-dimensional
    plot is only a slice through a high-dimensional training problem.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - loss-landscapes.s1
