schema_version: 0.2-draft
lesson:
  id: direct-preference-optimization
  version: 0.1.0-draft
  title: Train on preference pairs without a separate online reward loop
  state: draft
  summary: DPO adjusts chosen-versus-rejected response likelihoods relative to a reference model using a preference
    loss; its assumptions and data coverage still constrain resulting behavior.
  slot: M20.6
  category: learning
  minutes: 12
  sources:
  - title: Direct Preference Optimization
    url: https://arxiv.org/abs/2305.18290
objectives:
- id: objective.direct-preference-optimization
  version: 1-draft
  statement: DPO adjusts chosen-versus-rejected response likelihoods relative to a reference model using a preference
    loss; its assumptions and data coverage still constrain resulting behavior.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - direct-preference-optimization.base
  - direct-preference-optimization.transfer
  prerequisites:
  - anyOf:
    - objective.preferences-and-reward-models
  - anyOf:
    - objective.rlhf-and-kl-control
scenes:
- id: direct-preference-optimization.s1
  title: Start with a pair and a reference
  type: explanation
  depth: intuition
  objective_refs:
  - objective.direct-preference-optimization
  markdown: For one prompt, DPO uses a preferred response and a rejected response. It compares the policy’s log
    likelihood relative to a reference for each response, then encourages a larger relative margin for the preferred
    one. The formulation connects a preference model with a KL-regularized objective.
  text_mode: For one prompt, DPO uses a preferred response and a rejected response. It compares the policy’s log
    likelihood relative to a reference for each response, then encourages a larger relative margin for the preferred
    one. The formulation connects a preference model with a KL-regularized objective.
  bridges: []
- id: direct-preference-optimization.s2
  title: Read the margin direction
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.direct-preference-optimization
  markdown: If the policy has increased the preferred response’s likelihood relative to the reference more than
    the rejected response’s likelihood, the preference margin rises. This is a relative comparison, not simply a
    requirement that every preferred sequence’s absolute probability must rise on every update.
  text_mode: If the policy has increased the preferred response’s likelihood relative to the reference more than
    the rejected response’s likelihood, the preference margin rises. This is a relative comparison, not simply a
    requirement that every preferred sequence’s absolute probability must rise on every update.
  bridges: []
- id: direct-preference-optimization.s3
  title: Understand what the training loop omits
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.direct-preference-optimization
  markdown: The basic offline DPO setup trains directly on stored preference pairs without fitting a separate explicit
    reward model and running PPO rollouts for every update. Variants may refresh data online or change the loss.
    DPO remains parameter training, not a decoding-time choice between two displayed answers.
  text_mode: The basic offline DPO setup trains directly on stored preference pairs without fitting a separate explicit
    reward model and running PPO rollouts for every update. Variants may refresh data online or change the loss.
    DPO remains parameter training, not a decoding-time choice between two displayed answers.
  bridges: []
- id: direct-preference-optimization.s4
  title: Check the preference distribution
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.direct-preference-optimization
  markdown: Biased pairs, weak rejected examples, response-length effects, and out-of-distribution prompts can limit
    results. Tune and report the reference, regularization scale, masking, and evaluation. Easier optimization does
    not establish that preferences perfectly represent truth, safety, or every user’s needs.
  text_mode: Biased pairs, weak rejected examples, response-length effects, and out-of-distribution prompts can
    limit results. Tune and report the reference, regularization scale, masking, and evaluation. Easier optimization
    does not establish that preferences perfectly represent truth, safety, or every user’s needs.
  bridges: []
- id: direct-preference-optimization.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.direct-preference-optimization
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: direct-preference-optimization.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.direct-preference-optimization
  markdown: DPO adjusts chosen-versus-rejected response likelihoods relative to a reference model using a preference
    loss; its assumptions and data coverage still constrain resulting behavior.
  text_mode: DPO adjusts chosen-versus-rejected response likelihoods relative to a reference model using a preference
    loss; its assumptions and data coverage still constrain resulting behavior.
