assessment_families:
- id: direct-preference-optimization.base
  objective_ref: objective.direct-preference-optimization
  task: base
  response_type: single_choice
  points: 1
  hint: 'Read the margin direction: trace the inputs, operation, and result before choosing.'
  remediation_scene: direct-preference-optimization.s2
  variants:
  - id: direct-preference-optimization.base.1
    prompt: What does basic DPO consume?
    options:
    - id: b
      text: Only unscored random token IDs
    - id: c
      text: Only accelerator telemetry
    - id: a
      text: Prompt, preferred/rejected response pairs, and a reference comparison
    answer: a
    feedback: The loss is defined on preference comparisons.
  - id: direct-preference-optimization.base.2
    prompt: Must every preferred sequence’s absolute probability increase at every update?
    options:
    - id: c
      text: Only when the response is short
    - id: a
      text: No; the objective is a relative preference comparison
    - id: b
      text: 'Yes'
    answer: a
    feedback: Relative margins and absolute probabilities are different quantities.
- id: direct-preference-optimization.transfer
  objective_ref: objective.direct-preference-optimization
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Check the preference distribution: trace the inputs, operation, and result before choosing.'
  remediation_scene: direct-preference-optimization.s4
  variants:
  - id: direct-preference-optimization.transfer.1
    prompt: Does basic offline DPO require a separately fitted explicit reward model?
    options:
    - id: c
      text: Only if there are two responses
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: It directly optimizes a preference loss under its formulation.
  - id: direct-preference-optimization.transfer.2
    prompt: Does DPO remove bias from the preference dataset automatically?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if a reference is frozen
    answer: a
    feedback: The training signal retains the data’s coverage and judgment limitations.
