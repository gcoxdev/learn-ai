schema_version: 0.2-draft
lesson:
  id: direct-preference-optimization
  version: 0.4.0-draft
  title: Train on preference pairs without a separate online reward loop
  state: draft
  summary: RLHF juggles four models and a sampling loop. DPO gets the same kind of result from one line of loss and two models, because the assistant turns out to be its own reward model.
  slot: M20.6
  category: learning
  sources:
    - title: "Direct Preference Optimization: Your Language Model is Secretly a Reward Model (Rafailov et al., 2023)"
      url: https://arxiv.org/abs/2305.18290
    - title: "Zephyr: Direct Distillation of LM Alignment (Tunstall et al., 2023)"
      url: https://arxiv.org/abs/2310.16944
    - title: "The Llama 3 Herd of Models (Llama Team, Meta, 2024)"
      url: https://arxiv.org/abs/2407.21783
objectives:
  - id: objective.direct-preference-optimization
    version: 2-draft
    statement: DPO adjusts chosen-versus-rejected response likelihoods relative to a reference model using a preference loss; its assumptions and data coverage still constrain resulting behavior.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - direct-preference-optimization.base.v2
      - direct-preference-optimization.transfer.v2
      - direct-preference-optimization.calculate
    prerequisites:
      - anyOf:
          - objective.preferences-and-reward-models
      - anyOf:
          - objective.rlhf-and-kl-control
scenes:
  - id: direct-preference-optimization.s1
    title: The assistant is secretly a reward model
    type: explanation
    depth: intuition
    objective_refs:
      - objective.direct-preference-optimization
    markdown: |-
      Ferncliff's RLHF run worked, but it was a juggling act: four models in memory, fresh answers generated every round, and a β that needed constant watching. In 2023, Rafailov and colleagues at Stanford showed a shortcut, **direct preference optimization (DPO)**, that trains straight from the preference pairs with just two models: the policy being trained and the frozen reference.

      The key step is a piece of algebra. The RLHF objective from the last lesson, reward minus β times KL, has a known best answer: the ideal policy takes the reference model's probabilities and boosts each answer in proportion to $e^{r/\beta}$. Run that backwards and any policy defines a reward:

      $$\hat r(x, y) = \beta \ln \frac{\pi(y \mid x)}{\pi_{\text{ref}}(y \mid x)}$$

      This **implicit reward** is β times how much more likely the policy makes an answer than the reference did. (The exact formula has one more term, but it depends only on the prompt, and it cancels as soon as you compare two answers to the same prompt.)

      Now plug the implicit reward into the Bradley–Terry loss from the reward-model lesson. You get a loss written entirely in terms of the policy's own probabilities. There's no separate reward model to train, no answers to generate during training, and no PPO. DPO is a supervised-style loss over the stored pairs, run much like SFT, plus one forward pass through the frozen reference for each answer.
    bridges: []
  - id: direct-preference-optimization.s2
    title: Work the DPO loss on one pair
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.direct-preference-optimization
    markdown: |-
      Take one of Ferncliff's pairs. For "Can I get my bike back by Saturday?", the chosen answer $y_w$ says "call your shop to confirm" and the rejected $y_l$ promises Saturday. A sequence's log-probability is the sum of its tokens' log-probabilities, so it's a large negative number.

      | | Policy $\ln \pi$ | Reference $\ln \pi_{\text{ref}}$ | Log ratio | Implicit reward ($\beta = 0.1$) |
      | --- | ---: | ---: | ---: | ---: |
      | Chosen $y_w$ | −12.0 | −13.0 | +1.0 | +0.10 |
      | Rejected $y_l$ | −15.0 | −14.5 | −0.5 | −0.05 |

      The margin between the implicit rewards is $0.10 - (-0.05) = 0.15$. Bradley–Terry turns it into a probability, $\sigma(0.15) = 0.537$, and the loss is $-\ln 0.537 = 0.621$. At the very start of training, the policy *is* the reference, so both log ratios are 0, the margin is 0, and the loss is $-\ln 0.5 = 0.693$. Training has lowered it by making the chosen answer relatively more likely and the rejected one relatively less.

      :::papers The DPO loss
      $$\mathcal{L}_{\text{DPO}} = -\,\mathbb{E}_{(x,\, y_w,\, y_l)}\left[\ln \sigma\!\left(\beta \ln \frac{\pi_\theta(y_w \mid x)}{\pi_{\text{ref}}(y_w \mid x)} - \beta \ln \frac{\pi_\theta(y_l \mid x)}{\pi_{\text{ref}}(y_l \mid x)}\right)\right]$$

      $x$ is the prompt, $y_w$ and $y_l$ the chosen and rejected answers, $\pi_\theta$ the policy, and $\pi_{\text{ref}}$ the frozen SFT model. In our pair, the first term inside $\sigma$ is $0.1 \times 1.0$, the second is $0.1 \times (-0.5)$, and the loss is 0.621. The gradient weights each pair by $\sigma(-\text{margin})$, so pairs the model still gets wrong push hardest. The DPO paper typically used $\beta = 0.1$, and found DPO matched or beat PPO-based RLHF on its sentiment, summarization, and dialogue tests.
      :::

      ```python run
      import numpy as np

      def dpo_loss(logp_w, ref_w, logp_l, ref_l, beta=0.1):
          reward_w = beta * (logp_w - ref_w)       # implicit reward of the chosen answer
          reward_l = beta * (logp_l - ref_l)       # implicit reward of the rejected answer
          margin = reward_w - reward_l
          loss = -np.log(1 / (1 + np.exp(-margin)))
          return reward_w, reward_l, loss

      cases = {
          "start (policy = reference)": (-13.0, -13.0, -14.5, -14.5),
          "after some training":        (-12.0, -13.0, -15.0, -14.5),
          "both answers less likely":   (-13.5, -13.0, -16.5, -14.5),
      }
      for name, logps in cases.items():
          rw, rl, loss = dpo_loss(*logps)
          print(f"{name:27s} rewards {rw:+.2f} / {rl:+.2f}   loss {loss:.3f}")
      ```

      Try `beta=0.5`: the same log ratios now give a margin of 0.75 and a loss of 0.387. A larger β makes each unit of drift from the reference count for more.
    bridges: []
  - id: direct-preference-optimization.s3
    title: The winner can lose probability too
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.direct-preference-optimization
    markdown: |-
      Look at the code's third case. The chosen answer's log-probability *fell*, from −13.0 to −13.5. The rejected answer fell further, from −14.5 to −16.5. The log ratios are −0.5 and −2.0, so the margin is $0.1 \times (-0.5) - 0.1 \times (-2.0) = 0.15$, exactly as before, and the loss is the same 0.621.

      :::predict Which of these changes would lower the loss: raising the chosen answer's log-probability by 1, or lowering the rejected one's by 1?
      Both, equally. Each widens the gap between the log ratios by 1, which raises the margin by $\beta \times 1 = 0.1$. DPO only sees the *difference*, so it doesn't care which answer moves.
      :::

      :::mixup "DPO makes the chosen answers more likely."
      It makes them more likely *relative to the rejected answers*. Practitioners often see both log-probabilities fall during DPO training, with the rejected ones falling faster. The probability that leaves both goes to other answers, which may or may not be good ones. So measure the answers the trained model actually writes, not just the loss.
      :::

      DPO is still training: it changes the weights once, before deployment. It is not a runtime trick that generates two answers and picks the better one; that is best-of-n selection, which is in the next lesson.
    bridges: []
  - id: direct-preference-optimization.s4
    title: What DPO gives up for its simplicity
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.direct-preference-optimization
    markdown: |-
      | | RLHF with PPO | DPO |
      | --- | --- | --- |
      | Models in memory | Policy, reference, reward, value | Policy, reference |
      | Generates new answers while training | Yes, every round | No, uses the stored pairs |
      | Separate reward model | Trained first | None; the reward is implicit |
      | Main knob | β, plus PPO settings | β |

      The second row is both DPO's strength and its weakness. RLHF's policy writes new answers and gets feedback on its *own* current behavior, including its new mistakes. DPO learns only from pairs collected earlier. If Ferncliff's pairs came from the SFT model, then once DPO shifts the assistant's style, it's being judged on answers it no longer writes.

      The common fix is **iterative DPO**: train, generate fresh pairs from the new model, have them judged, and train again. Meta's Llama 3 (2024) post-training ran several rounds of SFT followed by DPO in this spirit. Zephyr-7B (2023) was an early open model trained with DPO, using preference labels produced by GPT-4 (the UltraFeedback dataset) rather than by people.

      For Ferncliff, the practical plan is simple. Run DPO on the 5,000 pairs starting from the SFT model with $\beta = 0.1$, generate new answers to held-out questions, and compare them with the SFT model's answers before switching over.
    bridges: []
  - id: direct-preference-optimization.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.direct-preference-optimization
    markdown: Compute DPO losses from log-probabilities, then decide what DPO needs and what goes wrong for a legal-writing tool, a game studio, and a team with stale pairs.
    takeaway: |-
      DPO turns the policy into its own reward model, β × ln(π/π_ref), and trains with the Bradley–Terry loss on stored pairs: no reward model, no sampling, no PPO. It only cares about the chosen-versus-rejected gap, so check what the trained model actually writes.
  - id: direct-preference-optimization.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.direct-preference-optimization
    markdown: |-
      DPO trains directly on preferred and rejected answers, comparing their likelihoods with a reference model. Its results still depend on the quality and coverage of those preferences.
