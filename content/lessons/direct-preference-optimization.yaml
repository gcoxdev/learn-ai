assessment_families:
  - id: direct-preference-optimization.base
    objective_ref: objective.direct-preference-optimization
    task: base
    response_type: single_choice
    points: 1
    hint: 'Read the margin direction: trace the inputs, operation, and result before choosing.'
    remediation_scene: direct-preference-optimization.s2
    variants:
      - id: direct-preference-optimization.base.1
        prompt: What does basic DPO consume?
        options:
          - id: b
            text: Only unscored random token IDs
          - id: c
            text: Only accelerator telemetry
          - id: a
            text: Prompt, preferred/rejected response pairs, and a reference comparison
        answer: a
        feedback: The loss is defined on preference comparisons.
        retired: true
      - id: direct-preference-optimization.base.2
        prompt: Must every preferred sequence’s absolute probability increase at every update?
        options:
          - id: c
            text: Only when the response is short
          - id: a
            text: No; the objective is a relative preference comparison
          - id: b
            text: 'Yes'
        answer: a
        feedback: Relative margins and absolute probabilities are different quantities.
        retired: true
  - id: direct-preference-optimization.transfer
    objective_ref: objective.direct-preference-optimization
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Check the preference distribution: trace the inputs, operation, and result before choosing.'
    remediation_scene: direct-preference-optimization.s4
    variants:
      - id: direct-preference-optimization.transfer.1
        prompt: Does basic offline DPO require a separately fitted explicit reward model?
        options:
          - id: c
            text: Only if there are two responses
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: It directly optimizes a preference loss under its formulation.
        retired: true
      - id: direct-preference-optimization.transfer.2
        prompt: Does DPO remove bias from the preference dataset automatically?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if a reference is frozen
        answer: a
        feedback: The training signal retains the data’s coverage and judgment limitations.
        retired: true
  - id: direct-preference-optimization.base.v2
    objective_ref: objective.direct-preference-optimization
    task: base
    response_type: single_choice
    points: 1
    hint: "Everything in DPO goes through the implicit reward β × ln(π / π_ref). The loss only sees the chosen answer's implicit reward minus the rejected one's."
    remediation_scene: direct-preference-optimization.s2
    variants:
      - id: direct-preference-optimization.base.v2.1
        prompt: "At the first step of DPO training the policy is an exact copy of the reference model. What is the loss on every pair?"
        options:
          - id: b
            text: 0, since the policy hasn't made any mistakes yet
          - id: c
            text: It depends on how long the chosen answer is
          - id: a
            text: ln 2 ≈ 0.693, since the margin is 0
        answer: a
        feedback: Both log ratios are 0, so the margin is 0, σ(0) = 0.5, and the loss is −ln 0.5 ≈ 0.693 for every pair. Answer length changes the log-probabilities, but they cancel against the identical reference.
      - id: direct-preference-optimization.base.v2.2
        prompt: "Why doesn't DPO need a separately trained reward model?"
        options:
          - id: a
            text: The policy's log ratio to the reference acts as the reward
          - id: c
            text: It reuses the reward model trained during the SFT stage
          - id: b
            text: It asks the reference model to score each of the answers
        answer: a
        feedback: DPO rewrites the reward as β ln(π/π_ref), so the policy is its own reward model. SFT doesn't train a reward model, and the reference model only provides the baseline probabilities, not a score.
      - id: direct-preference-optimization.base.v2.3
        prompt: "During DPO, a pair's chosen answer goes from log-probability −20 to −21 while the rejected answer goes from −22 to −25. The reference is unchanged. What happened to this pair's loss?"
        options:
          - id: c
            text: It rose, since the chosen answer became less likely
          - id: a
            text: It fell, since the gap between the log ratios widened by 2
          - id: b
            text: It stayed the same, since both answers moved the same way
        answer: a
        feedback: The chosen log ratio moved by −1 and the rejected one by −3, so their difference grew by 2 and the margin grew by 2β. DPO rewards the relative gap, even when both answers lose probability.
      - id: direct-preference-optimization.base.v2.4
        prompt: "What does DPO need during training that SFT does not?"
        options:
          - id: b
            text: Fresh answers generated by the policy during training
          - id: a
            text: A rejected answer for each prompt and a frozen reference model
          - id: c
            text: A reward model's score for each stored answer pair
        answer: a
        feedback: DPO's loss compares a chosen and a rejected answer, each measured against the reference model. It uses stored pairs, so it generates nothing during training, and it needs no reward model.
  - id: direct-preference-optimization.transfer.v2
    objective_ref: objective.direct-preference-optimization
    task: transfer
    response_type: single_choice
    points: 1
    hint: DPO learns only from pairs collected earlier. Ask whose answers those pairs contain and whether the trained model still writes answers like them.
    remediation_scene: direct-preference-optimization.s4
    variants:
      - id: direct-preference-optimization.transfer.v2.1
        prompt: "A legal-writing startup has 20,000 judged pairs and a single GPU that can hold only two copies of its model. Which preference method fits?"
        options:
          - id: a
            text: DPO, which needs only the policy and a frozen reference
          - id: b
            text: RLHF with PPO, since pairs must first train a reward model
          - id: c
            text: Neither, since preference tuning always needs four models
        answer: a
        feedback: DPO trains from the pairs with two models in memory. PPO-based RLHF needs the policy, reference, reward, and value models, which won't fit. Not every method needs four.
      - id: direct-preference-optimization.transfer.v2.2
        prompt: "A game studio collected its preference pairs from an early SFT model. After three DPO epochs, the new model's style has changed a lot, and further training stops helping. What is the best next step?"
        options:
          - id: c
            text: Train more epochs on the same pairs with a smaller β
          - id: b
            text: Switch the reference model to the newest checkpoint and continue
          - id: a
            text: Generate answers from the new model, get them judged, and train again
        answer: a
        feedback: The old pairs describe answers the model no longer writes. Fresh pairs from the current model, as in iterative DPO, give feedback on its actual behavior. More epochs on stale pairs mostly overfit them, and swapping the reference alone adds no new judgments.
      - id: direct-preference-optimization.transfer.v2.3
        prompt: "After DPO, a team notices the loss is very low but the model's answers are sometimes worse than the SFT model's, with odd phrasings no one ever wrote. What explains this?"
        options:
          - id: b
            text: The loss must have a bug, since low loss means better answers
          - id: a
            text: DPO widened the gap by pushing both answers down, freeing probability for other text
          - id: c
            text: The reference model drifted along with the policy during training
        answer: a
        feedback: DPO's loss only needs chosen above rejected. If both lose probability, the freed probability goes to other answers, possibly odd ones. The reference is frozen, and a low loss doesn't show the answers themselves are good.
      - id: direct-preference-optimization.transfer.v2.4
        prompt: "A team runs DPO twice on the same pairs, once with β = 0.05 and once with β = 0.5. Which run is likely to stay closer to the SFT model's behavior?"
        options:
          - id: a
            text: β = 0.5, since each unit of drift counts more in the margin
          - id: c
            text: β = 0.05, since a smaller β means smaller updates to the weights
          - id: b
            text: Both the same, since β cancels between the two log ratios
        answer: a
        feedback: β plays the same role as RLHF's KL coefficient. A larger β reaches a given margin with less drift, so the policy moves less; a small β lets it drift further. β scales both log ratios but doesn't cancel, since it multiplies their difference.
  - id: direct-preference-optimization.calculate
    objective_ref: objective.direct-preference-optimization
    task: base
    response_type: numeric
    points: 1
    hint: "For each answer, log ratio = ln π − ln π_ref. Margin = β × (chosen log ratio − rejected log ratio). Loss = −ln σ(margin)."
    remediation_scene: direct-preference-optimization.s2
    absolute_tolerance: 0.01
    variants:
      - id: direct-preference-optimization.calculate.1
        prompt: "With β = 0.1, the chosen answer's log ratio ln(π/π_ref) is +2.0 and the rejected answer's is −1.0. What is the DPO loss for this pair?"
        answer: 0.554
        feedback: The margin is 0.1 × (2.0 − (−1.0)) = 0.3. σ(0.3) ≈ 0.574, and −ln 0.574 ≈ 0.554.
      - id: direct-preference-optimization.calculate.2
        prompt: "With β = 0.1, the policy gives both answers exactly the same log-probabilities as the reference model. What is the DPO loss for this pair?"
        answer: 0.693
        feedback: Both log ratios are 0, so the margin is 0, σ(0) = 0.5, and the loss is −ln 0.5 ≈ 0.693.
      - id: direct-preference-optimization.calculate.3
        prompt: "With β = 0.5, the chosen answer's log ratio is +0.4 and the rejected answer's is +1.2. What is the DPO loss for this pair?"
        answer: 0.913
        feedback: The margin is 0.5 × (0.4 − 1.2) = −0.4, because the rejected answer gained more. σ(−0.4) ≈ 0.401, and −ln 0.401 ≈ 0.913, above ln 2.
      - id: direct-preference-optimization.calculate.4
        prompt: "With β = 0.2: the chosen answer has ln π = −20 and ln π_ref = −22; the rejected answer has ln π = −25 and ln π_ref = −24. What is the DPO loss?"
        answer: 0.437
        feedback: The log ratios are +2 and −1, so the margin is 0.2 × 3 = 0.6. σ(0.6) ≈ 0.646, and −ln 0.646 ≈ 0.437.
      - id: direct-preference-optimization.calculate.5
        prompt: "With β = 0.1: the chosen answer has ln π = −8.0 and ln π_ref = −8.5; the rejected answer has ln π = −9.0 and ln π_ref = −10.0. What is the DPO loss?"
        answer: 0.718
        feedback: The log ratios are +0.5 and +1.0, so the margin is 0.1 × (0.5 − 1.0) = −0.05. σ(−0.05) ≈ 0.4875, and −ln 0.4875 ≈ 0.718.
