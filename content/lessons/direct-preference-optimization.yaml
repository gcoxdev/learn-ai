schema_version: 0.2-draft
lesson:
  id: direct-preference-optimization
  version: 0.3.0-draft
  title: Train on preference pairs without a separate online reward loop
  state: draft
  summary: Use stored preference pairs to train a model relative to a reference, without confusing that training
    with answer selection at runtime.
  slot: M20.6
  category: learning
  sources:
  - title: Direct Preference Optimization
    url: https://arxiv.org/abs/2305.18290
objectives:
- id: objective.direct-preference-optimization
  version: 1-draft
  statement: DPO adjusts chosen-versus-rejected response likelihoods relative to a reference model using a
    preference loss; its assumptions and data coverage still constrain resulting behavior.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - direct-preference-optimization.base
  - direct-preference-optimization.transfer
  prerequisites:
  - anyOf:
    - objective.preferences-and-reward-models
  - anyOf:
    - objective.rlhf-and-kl-control
scenes:
- id: direct-preference-optimization.s1
  title: Start with a pair and a reference
  type: explanation
  depth: intuition
  objective_refs:
  - objective.direct-preference-optimization
  markdown: '**Direct preference optimization**, or **DPO**, trains on pairs of answers to the same prompt:
    one preferred and one rejected. In its basic setup, it also uses a fixed **reference model** for comparison.


    For each answer, DPO measures how the training model''s likelihood compares with the reference''s likelihood.
    **Log likelihood** is the logarithm of the probability assigned to a response under the chosen token-scoring
    rule. The loss encourages a larger difference, or margin, in favor of the preferred answer after accounting
    for the reference.


    This formulation connects a model of preferences with an objective that penalizes departure from the reference
    using KL divergence. The next example makes the relative comparison concrete.'
  text_mode: '**Direct preference optimization**, or **DPO**, trains on pairs of answers to the same prompt:
    one preferred and one rejected. In its basic setup, it also uses a fixed **reference model** for comparison.


    For each answer, DPO measures how the training model''s likelihood compares with the reference''s likelihood.
    **Log likelihood** is the logarithm of the probability assigned to a response under the chosen token-scoring
    rule. The loss encourages a larger difference, or margin, in favor of the preferred answer after accounting
    for the reference.


    This formulation connects a model of preferences with an objective that penalizes departure from the reference
    using KL divergence. The next example makes the relative comparison concrete.'
  bridges: []
- id: direct-preference-optimization.s2
  title: Read the margin direction
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.direct-preference-optimization
  markdown: 'If the policy has increased the preferred response’s likelihood relative to the reference more
    than the rejected response’s likelihood, the preference margin rises. This is a relative comparison, not
    simply a requirement that every preferred sequence’s absolute probability must rise on every update.


    Suppose the policy-to-reference likelihood ratio is 2 for the preferred response and 0.5 for the rejected
    one. Their relative ratio is 2/0.5 = 4, giving log margin ln 4 before the stated scale factor. Ratios 0.8
    and 0.2 give the same margin although both absolute probabilities fell relative to the reference. That
    is why the objective is a relative comparison.'
  text_mode: 'If the policy has increased the preferred response’s likelihood relative to the reference more
    than the rejected response’s likelihood, the preference margin rises. This is a relative comparison, not
    simply a requirement that every preferred sequence’s absolute probability must rise on every update.


    Suppose the policy-to-reference likelihood ratio is 2 for the preferred response and 0.5 for the rejected
    one. Their relative ratio is 2/0.5 = 4, giving log margin ln 4 before the stated scale factor. Ratios 0.8
    and 0.2 give the same margin although both absolute probabilities fell relative to the reference. That
    is why the objective is a relative comparison.'
  bridges: []
- id: direct-preference-optimization.s3
  title: Understand what the training loop omits
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.direct-preference-optimization
  markdown: The basic offline DPO setup trains directly on stored preference pairs without fitting a separate
    explicit reward model and running PPO rollouts for every update. Variants may refresh data online or change
    the loss. DPO remains parameter training, not a decoding-time choice between two displayed answers.
  text_mode: The basic offline DPO setup trains directly on stored preference pairs without fitting a separate
    explicit reward model and running PPO rollouts for every update. Variants may refresh data online or change
    the loss. DPO remains parameter training, not a decoding-time choice between two displayed answers.
  bridges: []
- id: direct-preference-optimization.s4
  title: Check the preference distribution
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.direct-preference-optimization
  markdown: Biased pairs, weak rejected examples, response-length effects, and out-of-distribution prompts
    can limit results. Tune and report the reference, regularization scale, masking, and evaluation. Easier
    optimization does not establish that preferences perfectly represent truth, safety, or every user’s needs.
  text_mode: Biased pairs, weak rejected examples, response-length effects, and out-of-distribution prompts
    can limit results. Tune and report the reference, regularization scale, masking, and evaluation. Easier
    optimization does not establish that preferences perfectly represent truth, safety, or every user’s needs.
  bridges: []
- id: direct-preference-optimization.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.direct-preference-optimization
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: DPO trains directly on preferred and rejected answers, comparing their likelihoods with a reference
    model. Its results still depend on the quality and coverage of those preferences.
- id: direct-preference-optimization.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.direct-preference-optimization
