scenes:
- id: serving-expert-models.s1
  title: Place the complete usable model
  type: explanation
  depth: intuition
  objective_refs:
  - objective.serving-expert-models
  markdown: Experts may be spread across devices, replicated selectively, or loaded through a hierarchy of memory
    tiers. Placement determines which routes require communication. A model with low per-token activation can still
    need substantial total memory and a fast interconnect to serve arbitrary requests efficiently.
  text_mode: Experts may be spread across devices, replicated selectively, or loaded through a hierarchy of memory
    tiers. Placement determines which routes require communication. A model with low per-token activation can still
    need substantial total memory and a fast interconnect to serve arbitrary requests efficiently.
  bridges: []
- id: serving-expert-models.s2
  title: Batch assignments without hiding latency
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.serving-expert-models
  markdown: Combining tokens destined for the same expert creates larger matrix operations. Waiting longer to form
    those batches may improve throughput but delay individual users. Prompt processing and one-token-at-a-time decoding
    produce different assignment volumes, so one batch policy may not suit both phases.
  text_mode: Combining tokens destined for the same expert creates larger matrix operations. Waiting longer to form
    those batches may improve throughput but delay individual users. Prompt processing and one-token-at-a-time decoding
    produce different assignment volumes, so one batch policy may not suit both phases.
  bridges: []
- id: serving-expert-models.s3
  title: Handle a hot expert
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.serving-expert-models
  markdown: Suppose normal traffic spreads evenly, then a specialized workload sends half the assignments to one
    expert. That expert can become a tail-latency bottleneck. Replication, placement changes, or scheduling may
    help, but their memory cost and output-equivalence assumptions must be checked.
  text_mode: Suppose normal traffic spreads evenly, then a specialized workload sends half the assignments to one
    expert. That expert can become a tail-latency bottleneck. Replication, placement changes, or scheduling may
    help, but their memory cost and output-equivalence assumptions must be checked.
  bridges: []
- id: serving-expert-models.s4
  title: Report the operating point
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.serving-expert-models
  markdown: Compare quality, concurrency, prompt/output lengths, time to first token, inter-token latency, throughput,
    memory, and hardware. Include overflow or approximation policies. A sparse model’s attractive active count is
    a starting point for measurement, not a guarantee of inexpensive single-user deployment.
  text_mode: Compare quality, concurrency, prompt/output lengths, time to first token, inter-token latency, throughput,
    memory, and hardware. Include overflow or approximation policies. A sparse model’s attractive active count is
    a starting point for measurement, not a guarantee of inexpensive single-user deployment.
  bridges: []
- id: serving-expert-models.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
