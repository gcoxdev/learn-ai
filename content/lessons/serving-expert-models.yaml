assessment_families:
- id: serving-expert-models.base
  objective_ref: objective.serving-expert-models
  task: base
  response_type: single_choice
  points: 1
  hint: 'Batch assignments without hiding latency: trace the inputs, operation, and result before choosing.'
  remediation_scene: serving-expert-models.s2
  variants:
  - id: serving-expert-models.base.1
    prompt: Why can a low-active-count MoE still need much memory?
    options:
    - id: c
      text: Routing deletes unused weights permanently
    - id: a
      text: Many experts must remain available across routes
    - id: b
      text: Active count includes no computation
    answer: a
    feedback: Total usable capacity differs from per-token execution.
  - id: serving-expert-models.base.2
    prompt: What tradeoff can waiting for larger expert batches create?
    options:
    - id: a
      text: Better throughput but higher request latency
    - id: b
      text: Guaranteed lower latency in every case
    - id: c
      text: No scheduling effect
    answer: a
    feedback: Batch formation time affects users.
- id: serving-expert-models.transfer
  objective_ref: objective.serving-expert-models
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Report the operating point: trace the inputs, operation, and result before choosing.'
  remediation_scene: serving-expert-models.s4
  variants:
  - id: serving-expert-models.transfer.1
    prompt: A domain shift overloads one expert. Which metric can expose the user impact?
    options:
    - id: a
      text: Tail latency alongside expert load
    - id: b
      text: Only average parameter count
    - id: c
      text: Only tokenizer size
    answer: a
    feedback: Concentrated work can delay a subset of requests disproportionately.
  - id: serving-expert-models.transfer.2
    prompt: What makes two serving speed reports comparable?
    options:
    - id: b
      text: Model names alone
    - id: c
      text: One peak tokens-per-second number
    - id: a
      text: Matched workload, hardware, quality, and measurement definitions
    answer: a
    feedback: Serving performance is conditional on its operating point.
