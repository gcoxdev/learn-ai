lesson:
  id: serving-expert-models
  version: 0.1.0-draft
  title: Serve sparse models under real traffic
  state: draft
  summary: MoE serving must manage resident capacity, token routing, load imbalance, expert batching, and transfers;
    measure prompt processing and decoding under realistic traffic and quality constraints.
  slot: M18.8
  category: learning
  minutes: 12
  sources:
  - title: Sparsely-Gated Mixture-of-Experts
    url: https://arxiv.org/abs/1701.06538
  - title: Switch Transformers
    url: https://arxiv.org/abs/2101.03961
  - title: DeepSeek-V3 Technical Report
    url: https://arxiv.org/abs/2412.19437
objectives:
- id: objective.serving-expert-models
  version: 1-draft
  statement: MoE serving must manage resident capacity, token routing, load imbalance, expert batching, and transfers;
    measure prompt processing and decoding under realistic traffic and quality constraints.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - serving-expert-models.base
