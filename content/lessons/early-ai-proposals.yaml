assessment_families:
  - id: early-ai-proposals.base
    objective_ref: objective.early-ai-proposals
    task: base
    response_type: single_choice
    points: 1
    hint: 'Replace a vague question with an experiment: trace the inputs, operation, and result before choosing.'
    remediation_scene: early-ai-proposals.s2
    variants:
      - id: early-ai-proposals.base.1
        prompt: Which year belongs to the Dartmouth proposal, distinct from the summer meeting?
        options:
          - id: c
            text: '2017'
          - id: a
            text: '1955'
          - id: b
            text: 1956 only
        answer: a
        feedback: The proposal dated 1955 planned a 1956 summer research project.
        retired: true
      - id: early-ai-proposals.base.2
        prompt: What does a behavioral imitation test observe directly?
        options:
          - id: a
            text: Interaction under a stated protocol
          - id: b
            text: Every internal parameter
          - id: c
            text: Consciousness as a directly measured quantity
        answer: a
        feedback: The test records behavior; internal mechanisms need other evidence.
        retired: true
  - id: early-ai-proposals.transfer
    objective_ref: objective.early-ai-proposals
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Try the historical distinction: trace the inputs, operation, and result before choosing.'
    remediation_scene: early-ai-proposals.s4
    variants:
      - id: early-ai-proposals.transfer.1
        prompt: A threshold-unit model implements a logical function. Has it reproduced a biological brain?
        options:
          - id: a
            text: No; it demonstrates a limited formal mechanism
          - id: b
            text: Yes; all neural details are irrelevant
          - id: c
            text: Yes; logical correctness implies biological fidelity
        answer: a
        feedback: A useful abstraction should not be confused with a complete biological account.
        retired: true
      - id: early-ai-proposals.transfer.2
        prompt: Two programs give identical answers in one conversation. What is still unknown?
        options:
          - id: b
            text: Whether they produced any observable behavior
          - id: c
            text: Whether the transcript exists
          - id: a
            text: Whether their internal mechanisms are the same
        answer: a
        feedback: Matching outputs do not identify the implementation.
        retired: true
  - id: early-ai-proposals.base.v2
    objective_ref: objective.early-ai-proposals
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: early-ai-proposals.s3
    variants:
      - prompt: The 1955 Dartmouth document lists research aims for summer 1956. What does that establish?
        answer: a
        options:
          - id: b
            text: A completed implementation of every listed aim
          - id: c
            text: Measured performance of the proposed systems
          - id: a
            text: The authors’ intended research agenda
        feedback: A proposal states intentions; completed work needs additional evidence.
        id: early-ai-proposals.base.v2.1
        retired: true
      - prompt: A paper describes a behavioral test but reports no implementation taking it. Which claim is supported?
        answer: a
        options:
          - id: c
            text: The mechanism of successful replies has been measured
          - id: a
            text: A test procedure has been proposed
          - id: b
            text: A machine has passed the described procedure
        feedback: Defining a test is different from observing a system pass it.
        id: early-ai-proposals.base.v2.2
        retired: true
      - prompt: A mathematical unit reproduces a two-input AND rule. What has been shown?
        answer: a
        options:
          - id: a
            text: That the abstraction implements this mapping
          - id: b
            text: That the abstraction reproduces a biological neuron in full
          - id: c
            text: That the abstraction learns every possible logical rule
        feedback: A narrow mapping demonstration has a narrow evidential scope.
        id: early-ai-proposals.base.v2.3
        retired: true
      - prompt: A research agenda lists language and self-improvement. What should a history note preserve?
        answer: a
        options:
          - id: b
            text: That both capabilities were delivered by the agenda itself
          - id: c
            text: That these were the only AI topics investigated later
          - id: a
            text: That these were proposed directions for investigation
        feedback: The list records a research program, not completed capabilities.
        id: early-ai-proposals.base.v2.4
        retired: true
  - id: early-ai-proposals.transfer.v2
    objective_ref: objective.early-ai-proposals
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: early-ai-proposals.s3
    variants:
      - prompt: A machine produces a convincing answer in one hidden-identity exchange. What can be concluded from that exchange alone?
        answer: a
        options:
          - id: b
            text: The response reveals the machine’s subjective experience
          - id: c
            text: The response identifies the algorithm that generated it
          - id: a
            text: The response convinced that observer in those conditions
        feedback: An observation about behavior does not uniquely establish mechanism or experience.
        id: early-ai-proposals.transfer.v2.1
        retired: true
      - prompt: A demonstration reproduces four rows of a logic table. What next test addresses a broader claim?
        answer: a
        options:
          - id: c
            text: Treat the model’s biological inspiration as the additional evidence
          - id: a
            text: Test the additional mappings the broader claim requires
          - id: b
            text: Rename the four tested rows as a general intelligence test
        feedback: Broader claims need observations covering the additional claimed behavior.
        id: early-ai-proposals.transfer.v2.2
        retired: true
      - prompt: A roadmap says a system will learn a new task next year. What evidence would establish that capability?
        answer: a
        options:
          - id: a
            text: A tested implementation performing the task
          - id: b
            text: A more detailed description of the intended task
          - id: c
            text: The date on which the roadmap was published
        feedback: Plans can guide work, but performance requires an implemented and tested system.
        id: early-ai-proposals.transfer.v2.3
        retired: true
      - prompt: A timeline uses 1955 and 1956 for Dartmouth. How should the entries be read?
        answer: a
        options:
          - id: b
            text: 1955 dates the test results; 1956 dates their publication
          - id: c
            text: Both dates describe separate completed general-intelligence systems
          - id: a
            text: 1955 dates the proposal; 1956 dates the planned summer project
        feedback: The original proposal explicitly gives its own date and the intended summer of the project.
        id: early-ai-proposals.transfer.v2.4
        retired: true
  - id: early-ai-proposals.base.v3
    objective_ref: objective.early-ai-proposals
    task: base
    response_type: single_choice
    points: 1
    hint: Sort the claim into its box. A model shows what could work on paper, a test measures whether judges can tell, a proposal states a plan, and a demonstration shows a real system working.
    remediation_scene: early-ai-proposals.s1
    variants:
      - id: early-ai-proposals.base.v3.1
        prompt: McCulloch and Pitts showed that idealized on/off units, wired together, can compute AND, OR, and NOT. What did their 1943 paper actually show?
        options:
          - id: a
            text: That real brain cells work exactly like these units
          - id: b
            text: That brain-like units can, in principle, compute logic
          - id: c
            text: That a network of such units can learn from examples
        answer: b
        feedback: The paper was a mathematical model showing that simple threshold units can compute logical rules. It didn't describe real neurons in detail, and its units had fixed connections, so learning wasn't part of it.
      - id: early-ai-proposals.base.v3.2
        prompt: Why did Turing replace "Can machines think?" with the imitation game?
        options:
          - id: a
            text: '"Think" was too slippery to settle, but a judge''s success rate can be observed'
          - id: b
            text: He had already built a machine that could win the game and wanted to show it
          - id: c
            text: He believed a machine that won the game would thereby be conscious
        answer: a
        feedback: Turing's move was practical, swapping a definition argument for something a judge can try. No machine of his time could play it, and he deliberately set questions of inner experience aside.
      - id: early-ai-proposals.base.v3.3
        prompt: The Dartmouth proposal listed language, neuron nets, and self-improvement as topics for summer 1956. How should a timeline describe those topics?
        options:
          - id: a
            text: Problems the workshop solved that summer
          - id: b
            text: Problems a later workshop was planned to solve
          - id: c
            text: Problems the authors hoped to make progress on
        answer: c
        feedback: A proposal states a plan in the future tense. The summer produced a name and a community, not solutions; the language topic took about 65 years.
      - id: early-ai-proposals.base.v3.4
        prompt: Samuel's checkers program scores a board as 6 × piece advantage + 1 × mobility. It is down 2 pieces with 9 more moves than its opponent. What score does it give, and what makes Samuel's program a learning program?
        options:
          - id: a
            text: Score −3; it adjusts the 6 and the 1 from its own games
          - id: b
            text: Score 21; it adjusts the 6 and the 1 from its own games
          - id: c
            text: Score −3; it looks several moves ahead before choosing
        answer: a
        feedback: 6 × (−2) + 1 × 9 = −12 + 9 = −3. Looking ahead is search, which a fixed program can also do; the learning is the weights changing from experience.
  - id: early-ai-proposals.transfer.v3
    objective_ref: objective.early-ai-proposals
    task: transfer
    response_type: single_choice
    points: 1
    hint: Before deciding what was achieved, ask whether the sentence describes a design on paper, a judge's verdict, a future plan, or a system measured doing a task.
    remediation_scene: early-ai-proposals.s6
    variants:
      - id: early-ai-proposals.transfer.v3.1
        prompt: 'A startup''s press release says: "Our robot will cook any recipe by next spring." What kind of claim is this?'
        options:
          - id: a
            text: A demonstration, since the company built the robot
          - id: b
            text: A proposal, since it describes a plan for the future
          - id: c
            text: A model, since it describes how the robot is designed
        answer: b
        feedback: '"Will cook ... by next spring" is a plan in the future tense, like the Dartmouth proposal. Having built a robot doesn''t turn a promised capability into a demonstrated one.'
      - id: early-ai-proposals.transfer.v3.2
        prompt: In a five-minute contest, 60% of judges mistake a chatbot for a human. What has the contest measured?
        options:
          - id: a
            text: That the chatbot understands its conversations
          - id: b
            text: That the chatbot has been shown to be conscious
          - id: c
            text: How well its replies fool these judges in five minutes
        answer: c
        feedback: An imitation-game result is about the replies, the judges, and the conditions. Longer conversations or expert judges could change the outcome, and the result says nothing direct about understanding or experience.
      - id: early-ai-proposals.transfer.v3.3
        prompt: A chess app's makers publish results of 500 recorded games in which it beat club players, with the settings used. What kind of claim is this?
        options:
          - id: a
            text: A demonstration of a real system under stated conditions
          - id: b
            text: A model showing what could work in principle
          - id: c
            text: A proposal describing what the makers hope to study
        answer: a
        feedback: Recorded games against real opponents, with the settings given, show a working system, like Samuel's checkers program. The result covers club players; stronger opponents would need their own test.
      - id: early-ai-proposals.transfer.v3.4
        prompt: 'A museum label reads: "In 1956 at Dartmouth, scientists built the first thinking machine." Which correction is most accurate?'
        options:
          - id: a
            text: The workshop was held in 1955, when the proposal was written
          - id: b
            text: The workshop named the field and set an agenda; it built no thinking machine
          - id: c
            text: The first thinking machine was built at IBM, not at Dartmouth
        answer: b
        feedback: The 1955 proposal planned the 1956 summer, which produced a name, an agenda, and a community. The best-known working program discussed there, Newell and Simon's Logic Theorist, proved logic theorems; nobody called it a thinking machine.
