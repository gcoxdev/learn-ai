scenes:
- id: early-ai-proposals.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.early-ai-proposals
  title: Researchers can contribute different things
  markdown: Suppose one person sketches a machine, another runs a test, and a third proposes a research program.
    These can all be valuable, but they are not the same achievement. A **model** is a simplified representation
    or calculation. An **experiment** observes behavior under specified conditions. A **research proposal**
    describes work someone intends to investigate. Early AI history contains all three. As we visit each example,
    ask what the researchers built, tested, or proposed.
  text_mode: Suppose one person sketches a machine, another runs a test, and a third proposes a research program.
    These can all be valuable, but they are not the same achievement. A **model** is a simplified representation
    or calculation. An **experiment** observes behavior under specified conditions. A **research proposal**
    describes work someone intends to investigate. Early AI history contains all three. As we visit each example,
    ask what the researchers built, tested, or proposed.
  bridges: []
- id: early-ai-proposals.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.early-ai-proposals
  title: A simple unit can express a logical rule
  markdown: 'In 1943, Warren McCulloch and Walter Pitts published a mathematical account connecting idealized
    nervous activity with logic. To picture the idea, consider a toy unit with two inputs, each either 0 or
    1. Let it output 1 when their sum reaches 2. Inputs [1,1] produce 1; [1,0], [0,1], and [0,0] produce 0.
    This behaves like AND: both conditions must hold. The example is a mathematical abstraction, not a faithful
    biological cell and not an explanation of every modern training method.'
  text_mode: 'In 1943, Warren McCulloch and Walter Pitts published a mathematical account connecting idealized
    nervous activity with logic. To picture the idea, consider a toy unit with two inputs, each either 0 or
