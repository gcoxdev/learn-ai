    This behaves like AND: both conditions must hold. The example is a mathematical abstraction, not a faithful
    biological cell and not an explanation of every modern training method.'
  bridges: []
- id: early-ai-proposals.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.early-ai-proposals
  title: Ask what an observer can test
  markdown: Alan Turing’s 1950 paper Computing Machinery and Intelligence discusses the imitation game and
    questions about machine intelligence. Instead of settling every meaning of “thinking” first, it examines
    behavior in an interaction where identities are hidden. Such a setup directs attention to what an observer
    can distinguish from responses. That is a proposed way to frame an empirical question. A convincing interaction
    does not, by itself, establish a machine’s inner experience or explain the procedure that produced the
    replies.
  text_mode: Alan Turing’s 1950 paper Computing Machinery and Intelligence discusses the imitation game and
    questions about machine intelligence. Instead of settling every meaning of “thinking” first, it examines
    behavior in an interaction where identities are hidden. Such a setup directs attention to what an observer
    can distinguish from responses. That is a proposed way to frame an empirical question. A convincing interaction
    does not, by itself, establish a machine’s inner experience or explain the procedure that produced the
    replies.
  bridges: []
- id: early-ai-proposals.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.early-ai-proposals
  title: Separate the 1955 document from the 1956 meeting
  markdown: The Dartmouth proposal is dated August 31, 1955. John McCarthy, Marvin Minsky, Nathaniel Rochester,
    and Claude Shannon proposed a summer 1956 project using the name artificial intelligence. Its agenda includes
    language, abstraction, neural networks, self-improvement, and the size of computations. Those topics show
    the breadth of the intended field. The proposal records a research ambition, not a report that all those
    problems had been solved. The document date and the planned meeting date refer to different events.
  text_mode: The Dartmouth proposal is dated August 31, 1955. John McCarthy, Marvin Minsky, Nathaniel Rochester,
    and Claude Shannon proposed a summer 1956 project using the name artificial intelligence. Its agenda includes
    language, abstraction, neural networks, self-improvement, and the size of computations. Those topics show
    the breadth of the intended field. The proposal records a research ambition, not a report that all those
    problems had been solved. The document date and the planned meeting date refer to different events.
  bridges: []
- id: early-ai-proposals.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.early-ai-proposals
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A model, an experiment, and a research proposal supply different kinds of evidence. Read what each
    document claims before deciding what it established.
- id: early-ai-proposals.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.early-ai-proposals
  markdown: Early neural abstractions, learning proposals, Turing’s behavioral question, and the Dartmouth
    project helped frame AI without settling what intelligence is.
  text_mode: Early neural abstractions, learning proposals, Turing’s behavioral question, and the Dartmouth
    project helped frame AI without settling what intelligence is.
- id: early-ai-proposals.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.early-ai-proposals
  title: Test a claim at the level it actually makes
  markdown: 'If a two-input unit correctly implements AND, the evidence concerns that mapping. If a conversation
    convinces an observer, the evidence concerns performance under that interaction’s conditions. If a proposal
    names language and learning as goals, it establishes what its authors wanted to study. You can respect
    each contribution without expanding it into a claim about all intelligence. For your own notes, use three
    columns: contribution, demonstrated or proposed behavior, and unanswered question.'
  text_mode: 'If a two-input unit correctly implements AND, the evidence concerns that mapping. If a conversation
    convinces an observer, the evidence concerns performance under that interaction’s conditions. If a proposal
    names language and learning as goals, it establishes what its authors wanted to study. You can respect
    each contribution without expanding it into a claim about all intelligence. For your own notes, use three
    columns: contribution, demonstrated or proposed behavior, and unanswered question.'
  bridges: []
- id: early-ai-proposals.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.early-ai-proposals
  title: Use the distinction when reading modern announcements
  markdown: The same reading habit works today. An architecture diagram describes a design; a benchmark report
    describes measurements; a roadmap describes intended work. A **benchmark** is a defined task or collection
    of tasks used for comparison. Ask whether an announcement includes a working system, what was measured,
    and whether independent people can examine it. The same questions help connect these historical contributions
    to new research. Keep the words “proposed,” “implemented,” and “tested” attached to the right claims.
  text_mode: The same reading habit works today. An architecture diagram describes a design; a benchmark report
