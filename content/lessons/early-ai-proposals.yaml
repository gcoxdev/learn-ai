scenes:
- id: early-ai-proposals.s1
  title: Simple units can represent logical operations
  type: explanation
  depth: intuition
  objective_refs:
  - objective.early-ai-proposals
  markdown: McCulloch and Pitts proposed a formal neural model in 1943 that connected threshold-like units with
    logical computation. Such a model is a mathematical abstraction, not a complete biological neuron. Hebb’s 1949
    learning ideas emphasized changes associated with co-activity, helping motivate later local learning rules.
  text_mode: McCulloch and Pitts proposed a formal neural model in 1943 that connected threshold-like units with
    logical computation. Such a model is a mathematical abstraction, not a complete biological neuron. Hebb’s 1949
    learning ideas emphasized changes associated with co-activity, helping motivate later local learning rules.
  bridges: []
- id: early-ai-proposals.s2
  title: Replace a vague question with an experiment
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.early-ai-proposals
  markdown: Turing’s 1950 paper discussed a text-based imitation game as a way to examine machine behavior. A behavioral
    test provides observations under a protocol; it does not directly inspect consciousness or reveal the machine’s
    implementation. The protocol and the interpretation of success both matter.
  text_mode: Turing’s 1950 paper discussed a text-based imitation game as a way to examine machine behavior. A behavioral
    test provides observations under a protocol; it does not directly inspect consciousness or reveal the machine’s
    implementation. The protocol and the interpretation of success both matter.
  bridges: []
- id: early-ai-proposals.s3
  title: Separate proposal from meeting
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.early-ai-proposals
  markdown: The Dartmouth proposal was written in 1955 for a summer project in 1956. It brought language, abstraction,
    learning, and other questions under the artificial-intelligence label. Its ambitions were research conjectures,
    not experimentally established guarantees that all of intelligence had already been formalized.
  text_mode: The Dartmouth proposal was written in 1955 for a summer project in 1956. It brought language, abstraction,
    learning, and other questions under the artificial-intelligence label. Its ambitions were research conjectures,
    not experimentally established guarantees that all of intelligence had already been formalized.
  bridges: []
- id: early-ai-proposals.s4
  title: Try the historical distinction
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.early-ai-proposals
  markdown: Imagine a rule-based program and a learned model giving the same short answers. An interaction test
    may not distinguish their mechanisms. To explain how they work, inspect representation, update rules, inputs,
    and evaluation. Historical proposals opened lines of inquiry; later results must supply evidence for particular
    claims.
  text_mode: Imagine a rule-based program and a learned model giving the same short answers. An interaction test
    may not distinguish their mechanisms. To explain how they work, inspect representation, update rules, inputs,
    and evaluation. Historical proposals opened lines of inquiry; later results must supply evidence for particular
    claims.
  bridges: []
