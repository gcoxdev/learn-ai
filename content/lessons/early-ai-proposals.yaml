scenes:
  - id: early-ai-proposals.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.early-ai-proposals
    title: Four founding documents, four kinds of claim
    markdown: |-
      In the summer of 1955, four researchers asked the Rockefeller Foundation to fund a workshop. They guessed that "every aspect of learning or any other feature of intelligence can in principle be so precisely described that a machine can be made to simulate it," and they named the idea **artificial intelligence**.

      It's one of four founding moments in this lesson, each a different kind of claim:

      | Year | Who | Kind of claim | What it showed |
      | --- | --- | --- | --- |
      | 1943 | McCulloch and Pitts | Model | On/off units can compute logic |
      | 1950 | Alan Turing | Argument and test | Judge machines by their replies |
      | 1955 | McCarthy, Minsky, Rochester, Shannon | Proposal | A plan for summer 1956 |
      | 1959 | Arthur Samuel | Demonstration | A program that learned checkers |

      A *model* shows what could work on paper; an *argument* reframes a question; a *proposal* states a plan; a *demonstration* shows a real system working under particular conditions. Much confusion about AI comes from mixing these up.
    bridges: []
  - id: early-ai-proposals.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.early-ai-proposals
    title: Logic from on-off units
    markdown: |-
      In 1943 Warren McCulloch, a neurophysiologist in his forties, and Walter Pitts, a self-taught logician barely twenty, published "A Logical Calculus of the Ideas Immanent in Nervous Activity." Their idealized neurons either fire (1) or don't (0).

      In modern notation, a unit adds up its weighted inputs and fires if the total reaches a **threshold**. With two inputs weighted 1 each and a threshold of 2, it fires only for [1, 1]: that's AND. The weights and thresholds were fixed by whoever designed the network; nothing in the 1943 model learned.

      :::predict Keep the weights at 1. Which threshold turns this unit into OR, firing when at least one input is on?
      A threshold of 1. Then [0, 1], [1, 0], and [1, 1] all reach it, and only [0, 0] stays silent.
      :::

      ```python run
      from itertools import product

      def unit(inputs, weights, threshold):
          """Fire (1) if the weighted sum reaches the threshold."""
          total = sum(x * w for x, w in zip(inputs, weights))
          return 1 if total >= threshold else 0

      cases = [(0, 0), (0, 1), (1, 0), (1, 1)]
      for name, threshold in [("AND", 2), ("OR", 1)]:
          outputs = [unit(c, (1, 1), threshold) for c in cases]
          print(name, "threshold", threshold, "->", outputs)

      # Hunt for XOR: outputs should be [0, 1, 1, 0].
      found = []
      for w1, w2, t in product([-2, -1, 0, 1, 2], [-2, -1, 0, 1, 2], [-2, -1, 0, 1, 2, 3]):
          if [unit(c, (w1, w2), t) for c in cases] == [0, 1, 1, 0]:
              found.append((w1, w2, t))
      print("single units that compute XOR:", found)
      ```

      Wire enough units together and you can compute any logical rule. Real neurons are far messier; McCulloch and Pitts were showing that brain-like parts *could* compute logic, not describing biology. But notice the empty list: no single unit computes XOR ("one or the other, not both"). Hold that thought until the AI-winters lesson.
    bridges: []
  - id: early-ai-proposals.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.early-ai-proposals
    title: Turing swaps a hard question for a testable one
    markdown: |-
      "I propose to consider the question, 'Can machines think?'" So begins Alan Turing's 1950 paper "Computing Machinery and Intelligence." Then he sidesteps it, because "think" is too slippery to define.

      Instead he proposes the **imitation game**. A judge swaps typed messages with two hidden players, a human and a machine, and tries to say which is which. If judges can't reliably tell, what grounds do we have to deny that the machine thinks? He forecast that within about fifty years, judges would pick correctly no more than 70% of the time after five minutes.

      :::story Lady Lovelace's objection
      Ada Lovelace wrote in 1843 that Babbage's Analytical Engine could not "originate anything"; it could only do what we knew how to order it to do. Turing's reply: a machine might *learn*. He suggested building a "child machine" and educating it, the bet most of modern AI eventually made.
      :::

      :::mixup "Passing the Turing test would prove a machine is conscious."
      The test measures whether judges can tell the machine from a person by its typed replies. Turing deliberately set inner experience aside, and the next lesson shows a very simple 1960s program fooling people.
      :::
    bridges: []
  - id: early-ai-proposals.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.early-ai-proposals
    title: One summer to crack intelligence
    markdown: |-
      The Dartmouth proposal is dated August 31, 1955. Its authors were John McCarthy (a young Dartmouth mathematician, who coined the name), Marvin Minsky (Harvard), Nathaniel Rochester (IBM), and Claude Shannon (Bell Labs). They asked for "a 2 month, 10 man study" in summer 1956, on seven topics including language, neuron nets, and self-improvement.

      The summer was loose, with people coming and going. The most concrete work on show came from two visitors, Allen Newell and Herbert Simon, whose new Logic Theorist program proved theorems from Whitehead and Russell's *Principia Mathematica*.

      :::predict The authors expected "a significant advance" from a carefully chosen group working "together for a summer." How long did the language topic actually take?
      Decades. Programs that hold fluent, open-ended conversations arrived in the 2020s, about 65 years later.
      :::

      So Dartmouth didn't deliver solutions. It gave the field a name, an agenda, and a community: McCarthy, Minsky, Newell, and Simon went on to lead the first major AI labs at MIT, Stanford, and Carnegie Mellon.
    bridges: []
  - id: early-ai-proposals.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.early-ai-proposals
    markdown: A startup press release, a chess-app demo, a museum label, and a chatbot contest ask you to tell a model, a test, a plan, and a working demonstration apart.
    takeaway: |-
      A model shows what could work, an argument reframes a question, a proposal states a plan, and a demonstration shows a real system working under particular conditions. Ask which one you're reading before deciding what was achieved.
  - id: early-ai-proposals.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.early-ai-proposals
    markdown: |-
      Early neural abstractions, learning proposals, Turing’s behavioral question, and the Dartmouth project helped frame AI without settling what intelligence is.
  - id: early-ai-proposals.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.early-ai-proposals
    title: A program that outplayed its author
    markdown: |-
      Arthur Samuel, an IBM engineer, spent years teaching a computer checkers. His 1959 paper helped popularize the phrase *machine learning*, and in effect it answered Lady Lovelace: a computer can be programmed so that it "will learn to play a better game of checkers than can be played by the person who wrote the program."

      The program scored a board with a weighted sum of features, such as piece advantage and mobility (how many more moves you have than your opponent). With made-up weights:

      $$\text{score} = 6 \times \text{piece advantage} + 1 \times \text{mobility}$$

      Up one piece with 4 more moves: 6 × 1 + 1 × 4 = 10. The program searched several moves ahead and chose the move leading to the best-scoring position.

      :::predict Now you're down one piece but have 8 more moves. What's the score?
      6 × (−1) + 1 × 8 = 2. Slightly good: with these weights, the extra freedom outweighs the lost piece.
      :::

      The weights were learned. The program played against a copy of itself and, after each move, nudged the weights so that its quick score agreed better with what deeper look-ahead found. You'll meet this idea again in the reinforcement-learning module.
    bridges: []
  - id: early-ai-proposals.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.early-ai-proposals
    title: Read today's announcements the same way
    markdown: |-
      The same four boxes sort today's AI news. Suppose a startup's press release says:

      1. "Our architecture could, in principle, reason like a scientist." A *model*: a design on paper.
      2. "Testers couldn't tell our chatbot from a human agent." A *test*: ask who tested it, and for how long.
      3. "By next year it will run a lab on its own." A *proposal*, in the future tense.
      4. "It scored 91% on a public chemistry quiz, and here's the code." A *demonstration*, on that quiz.

      Only the fourth shows what the system can do today. Try sorting the next AI headline you read: many turn out to be proposals written in the present tense.
    bridges: []
