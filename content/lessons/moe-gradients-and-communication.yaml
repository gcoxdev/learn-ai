lesson:
  id: moe-gradients-and-communication
  version: 0.3.0-draft
  title: Understand how sparse routes learn and cross device boundaries
  state: draft
  summary: A token's gradient reaches only the two experts it visited, plus the router through their gates. On eight GPUs, that token also crosses the network four times per layer. Count both.
  slot: M18.7
  category: learning
  sources:
    - title: "Outrageously Large Neural Networks: The Sparsely-Gated Mixture-of-Experts Layer (Shazeer et al., 2017)"
      url: https://arxiv.org/abs/1701.06538
    - title: "GShard (Lepikhin et al., 2020)"
      url: https://arxiv.org/abs/2006.16668
    - title: "Switch Transformers (Fedus, Zoph & Shazeer, 2021)"
      url: https://arxiv.org/abs/2101.03961
    - title: "DeepSeek-V3 Technical Report (DeepSeek-AI, 2024)"
      url: https://arxiv.org/abs/2412.19437
objectives:
  - id: objective.moe-gradients-and-communication
    version: 2-draft
    statement: Selected expert outputs and routing weights provide gradient paths, while discrete selection requires a defined training treatment; expert-parallel execution exchanges activations and their backward gradients.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - moe-gradients-and-communication.base.v2
      - moe-gradients-and-communication.transfer.v2
      - moe-gradients-and-communication.calculate
    prerequisites:
      - anyOf:
          - objective.expert-dispatch-and-combine
      - anyOf:
          - objective.automatic-differentiation
      - anyOf:
          - objective.model-parallel-training
scenes:
  - id: moe-gradients-and-communication.s1
    title: Follow the gradient through the gates
    type: explanation
    depth: intuition
    objective_refs:
      - objective.moe-gradients-and-communication
    markdown: |-
      Go back to the token from the routers lesson: logits [2.40, 1.61, 1.10, 0.00], top-2, gates $g_1 = 0.6875$ and $g_2 = 0.3125$. To keep the numbers small, let each expert output a single number: expert 1 gives 2 and expert 2 gives 6. The layer's output is

      $$y = g_1 E_1 + g_2 E_2 = 0.6875 \times 2 + 0.3125 \times 6 = 3.25$$

      Suppose the loss rises one-for-one with $y$, so $\partial L / \partial y = 1$. Backpropagation, as in the automatic differentiation lesson, sends that signal down two kinds of path:

      | Path | Gradient | Value |
      | --- | --- | ---: |
      | Into expert 1's output | $g_1$ | 0.6875 |
      | Into expert 2's output | $g_2$ | 0.3125 |
      | Into gate $g_1$ | $E_1$ | 2 |
      | Into gate $g_2$ | $E_2$ | 6 |

      Each expert's weights then learn in proportion to its gate. The gates pass their gradients on to the router's logits. For a softmax over the kept logits, the chain rule gives a neat result:

      $$\frac{\partial L}{\partial \ell_i} = g_i\,(E_i - y) \quad\Rightarrow\quad 0.6875 \times (2 - 3.25) = -0.859, \qquad 0.3125 \times (6 - 3.25) = +0.859$$

      Gradient descent moves each logit against its gradient: $\ell_1$ goes up and $\ell_2$ goes down. The router shifts weight toward expert 1, whose smaller output lowers $y$, and so lowers the loss. The code checks the chain rule by nudging each logit.

      ```python run
      import numpy as np

      logits = np.log([11.0, 5.0, 3.0, 1.0])  # 2.40, 1.61, 1.10, 0: the routers lesson
      E = np.array([2.0, 6.0, -1.0, 3.0])             # each expert's (scalar) output
      k = 2

      def forward(l):
          chosen = np.argsort(-l)[:k]
          g = np.exp(l[chosen]) / np.exp(l[chosen]).sum()   # renormalized top-k gates
          return g @ E[chosen], chosen, g

      y, chosen, g = forward(logits)                  # take the loss to be L = y
      dE = np.zeros(4); dE[chosen] = g                # dL/dE_i: the gate, if chosen
      dl = np.zeros(4); dl[chosen] = g * (E[chosen] - y)   # dL/dlogit_i, by the chain rule

      eps = 1e-6                                      # check dl by nudging each logit
      num = [(forward(logits + eps * np.eye(4)[i])[0] - y) / eps for i in range(4)]
      print("y =", round(y, 4), "  gates:", g.round(4))
      print("dL/dE (expert outputs):", dE.round(4))
      print("dL/dlogits, chain rule:", dl.round(4))
      print("dL/dlogits, numerical: ", np.round(num, 4))
      ```

      Experts 3 and 4 get exactly zero, and so do their logits. Try `k = 3`: expert 3 joins in, and its gradient appears.
    bridges: []
  - id: moe-gradients-and-communication.s2
    title: The choice itself has no slope
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.moe-gradients-and-communication
    markdown: |-
      Gradients can tune the gates *among the chosen experts*. They can't say "try expert 3 instead." Choosing the top $k$ is a jump: with top-1 scores 0.51 and 0.49, expert 1 wins; nudge them to 0.49 and 0.51 and the output leaps to a different expert's. A jump has no slope, and expert 3 never ran, so there's no output to compare it with.

      :::mixup "Unchosen experts still learn a little from every token."
      They get nothing from that token. An expert learns only from the tokens routed to it. That is why routing collapse is self-reinforcing: an expert that receives no tokens gets no gradient and never improves enough to win any.
      :::

      Real training gets signal around the jump in a few ways:

      - **Gates that depend on every logit.** Switch Transformer uses $p_i$ from a softmax over *all* experts as its gate, without renormalizing. The softmax's shared denominator then carries gradient to every logit, including the unchosen ones.
      - **Balance terms.** The Switch balance loss sends gradient to every expert's average probability $P_i$.
      - **Noise.** Shazeer et al. (2017) added random noise to the logits during training, so near-ties sometimes flip and other experts get tried.
    bridges: []
  - id: moe-gradients-and-communication.s3
    title: "All-to-all: every GPU sends to every GPU"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.moe-gradients-and-communication
    markdown: |-
      Big MoE models use **expert parallelism** (from the model parallelism lesson in module 17): each GPU holds a different subset of experts, and tokens travel to wherever their experts live. Picture 8 GPUs, each holding one of Mixtral's 8 experts and a slice of the batch.

      In each MoE layer, every GPU splits its assignments by destination and sends each slice to the GPU holding that expert. At the same moment, it receives tokens from every other GPU for its own expert. That pattern is called an **all-to-all**: each GPU sends a *different* piece of data to each of the others. It's not the all-reduce from the data parallelism lesson, where every GPU ends up with the same summed result.

      Each MoE layer needs two all-to-alls going forward: **dispatch** sends token vectors out, and **combine** brings the expert outputs home. Backpropagation runs both in reverse, carrying gradients: four all-to-alls per layer per training step.
