scenes:
- id: moe-gradients-and-communication.s1
  title: Differentiate the weighted mixture
  type: explanation
  depth: intuition
  objective_refs:
  - objective.moe-gradients-and-communication
  markdown: For y = g1 E1(x) + g2 E2(x), the loss gradient reaches the selected expert outputs and, when differentiable,
    their weights g1 and g2. Backward computation also combines contributions to x. This explains local gradient
    paths for a fixed selected set.
  text_mode: For y = g1 E1(x) + g2 E2(x), the loss gradient reaches the selected expert outputs and, when differentiable,
    their weights g1 and g2. Backward computation also combines contributions to x. This explains local gradient
    paths for a fixed selected set.
  bridges: []
- id: moe-gradients-and-communication.s2
  title: Selection is a separate boundary
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.moe-gradients-and-communication
  markdown: A hard top-k membership change is discrete. Ordinary differentiation through the selected values does
    not provide a smooth derivative for every possible membership switch. Router normalization, noise, auxiliary
    objectives, or alternative estimators affect training; do not claim all unselected experts receive the same
    task gradient as selected ones.
  text_mode: A hard top-k membership change is discrete. Ordinary differentiation through the selected values does
    not provide a smooth derivative for every possible membership switch. Router normalization, noise, auxiliary
    objectives, or alternative estimators affect training; do not claim all unselected experts receive the same
    task gradient as selected ones.
  bridges: []
- id: moe-gradients-and-communication.s3
  title: Send activations to expert owners
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.moe-gradients-and-communication
  markdown: In expert parallelism, devices package token assignments for destination devices, exchange them, run
    expert batches, and return outputs. An all-to-all pattern permits different data to move between many device
    pairs. Backward execution exchanges corresponding gradients along the necessary routes.
  text_mode: In expert parallelism, devices package token assignments for destination devices, exchange them, run
    expert batches, and return outputs. An all-to-all pattern permits different data to move between many device
    pairs. Backward execution exchanges corresponding gradients along the necessary routes.
  bridges: []
- id: moe-gradients-and-communication.s4
  title: Co-design learning and execution
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.moe-gradients-and-communication
  markdown: Routing balance, locality constraints, token count, and expert placement influence communication volume
    and waiting. Overlap can hide part of the transfers but cannot remove all dependencies. Validate distributed
    output and gradient agreement against a small reference before optimizing throughput.
  text_mode: Routing balance, locality constraints, token count, and expert placement influence communication volume
    and waiting. Overlap can hide part of the transfers but cannot remove all dependencies. Validate distributed
    output and gradient agreement against a small reference before optimizing throughput.
  bridges: []
