  - id: moe-gradients-and-communication.s4
    title: Count the bytes on the wire
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.moe-gradients-and-communication
    markdown: |-
      Each assignment sends one token vector: $d$ numbers at 2 bytes each in bfloat16. With $T$ tokens per GPU and top-$k$, one all-to-all packs $T \times k \times d \times 2$ bytes. For a Mixtral-sized layer with 8,192 tokens per GPU: $8{,}192 \times 2 \times 4{,}096 \times 2 \approx 134$ MB. If experts are spread evenly over 8 GPUs, 7/8 of that leaves the GPU.

      ```python run
      T, d, k, nbytes = 8192, 4096, 2, 2   # tokens per GPU, width, top-k, bytes (bf16)
      G, layers = 8, 32                    # GPUs (one expert each), MoE layers

      one_a2a = T * k * d * nbytes         # bytes one GPU packs for one all-to-all
      remote = one_a2a * (G - 1) / G       # the part whose expert lives elsewhere
      per_layer = 4 * remote               # dispatch + combine, forward + backward

      print(f"one all-to-all:      {one_a2a / 1e6:7.1f} MB  ({remote / 1e6:.1f} MB leaves the GPU)")
      print(f"per MoE layer, step: {per_layer / 1e6:7.1f} MB")
      print(f"all {layers} layers:       {layers * per_layer / 1e9:7.1f} GB per GPU per step")
      print(f"at 100 GB/s:         {layers * per_layer / 100e9:7.2f} s of pure transfer")
      ```

      About 15 GB per GPU per step. At an assumed 100 GB/s per GPU, that's 0.15 seconds of transfer each step, unless it overlaps with computation.

      :::predict Switch to top-1 routing. What happens to the traffic?
      It halves: each token now sends one copy instead of two, so every all-to-all carries 67 MB and a step moves about 7.5 GB. This is one of Switch Transformer's arguments for $k = 1$. Set `k = 1` and check.
      :::

      Real systems attack this cost directly. DeepSeek-V3 limits each token to experts on at most 4 of its machines (nodes), since traffic between machines is slower than traffic inside one. It also schedules computation so that it overlaps almost fully with communication. When you build or modify such a system, run the same small batch through a single-GPU reference and compare outputs and gradients: a mixed-up return address shows up at once.
    bridges: []
  - id: moe-gradients-and-communication.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.moe-gradients-and-communication
    markdown: Compute gate and logit gradients by hand, count all-to-all bytes for new layer sizes, and debug a distributed MoE that disagrees with its reference.
    takeaway: |-
      A token's gradient reaches only its chosen experts, scaled by their gates, and reaches the router through those gates. Across GPUs, every MoE layer costs two all-to-alls forward and two backward.
  - id: moe-gradients-and-communication.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.moe-gradients-and-communication
    markdown: |-
      Trace the differentiable mixture separately from the discrete choice of experts. In distributed execution, keep token identities intact as activations and gradients travel between devices.
