lesson:
  id: moe-gradients-and-communication
  version: 0.2.0-draft
  title: Understand how sparse routes learn and cross device boundaries
  state: draft
  summary: Trace which selected calculations receive derivatives and which values must travel between expert
    devices.
  slot: M18.7
  category: learning
  sources:
  - title: Sparsely-Gated Mixture-of-Experts
    url: https://arxiv.org/abs/1701.06538
  - title: Switch Transformers
    url: https://arxiv.org/abs/2101.03961
  - title: DeepSeek-V3 Technical Report
    url: https://arxiv.org/abs/2412.19437
objectives:
- id: objective.moe-gradients-and-communication
  version: 1-draft
  statement: Selected expert outputs and routing weights provide gradient paths, while discrete selection requires
    a defined training treatment; expert-parallel execution exchanges activations and their backward gradients.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - moe-gradients-and-communication.base
  - moe-gradients-and-communication.transfer
  prerequisites:
  - anyOf:
    - objective.expert-dispatch-and-combine
  - anyOf:
    - objective.automatic-differentiation
  - anyOf:
    - objective.model-parallel-training
scenes:
- id: moe-gradients-and-communication.s1
  title: Differentiate the weighted mixture
  type: explanation
  depth: intuition
  objective_refs:
  - objective.moe-gradients-and-communication
  markdown: 'For y = g1 E1(x) + g2 E2(x), the loss gradient reaches the selected expert outputs and, when differentiable,
    their weights g1 and g2. Backward computation also combines contributions to x. This explains local gradient
    paths for a fixed selected set.


    For an illustrative scalar mixture, hold expert outputs at 2 and 6 and suppose the incoming derivative
    dL/dy is 1. The derivative reaching the first expert output is g1; the second receives g2. If g1 and g2
    are treated as independent inputs at this local step, their derivatives are 2 and 6. Differentiating the
    router that produced the weights requires its own additional chain-rule steps.'
  text_mode: 'For y = g1 E1(x) + g2 E2(x), the loss gradient reaches the selected expert outputs and, when
    differentiable, their weights g1 and g2. Backward computation also combines contributions to x. This explains
    local gradient paths for a fixed selected set.


    For an illustrative scalar mixture, hold expert outputs at 2 and 6 and suppose the incoming derivative
    dL/dy is 1. The derivative reaching the first expert output is g1; the second receives g2. If g1 and g2
    are treated as independent inputs at this local step, their derivatives are 2 and 6. Differentiating the
    router that produced the weights requires its own additional chain-rule steps.'
  bridges: []
- id: moe-gradients-and-communication.s2
  title: Selection is a separate boundary
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.moe-gradients-and-communication
  markdown: 'A hard top-k membership change is discrete. Ordinary differentiation through the selected values
    does not provide a smooth derivative for every possible membership switch. Router normalization, noise,
    auxiliary objectives, or alternative estimators affect training; do not claim all unselected experts receive
    the same task gradient as selected ones.


    A **discrete** selection jumps between sets: with top-one scores 0.51 and 0.49, expert 1 is chosen; reversing
    those scores chooses expert 2. Differentiating the output while the chosen set stays fixed does not describe
    that jump. The precise router objective and implementation determine which gradient paths remain available.'
  text_mode: 'A hard top-k membership change is discrete. Ordinary differentiation through the selected values
    does not provide a smooth derivative for every possible membership switch. Router normalization, noise,
    auxiliary objectives, or alternative estimators affect training; do not claim all unselected experts receive
    the same task gradient as selected ones.


    A **discrete** selection jumps between sets: with top-one scores 0.51 and 0.49, expert 1 is chosen; reversing
    those scores chooses expert 2. Differentiating the output while the chosen set stays fixed does not describe
    that jump. The precise router objective and implementation determine which gradient paths remain available.'
  bridges: []
- id: moe-gradients-and-communication.s3
  title: Send activations to expert owners
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.moe-gradients-and-communication
  markdown: 'In expert parallelism, devices package token assignments for destination devices, exchange them,
    run expert batches, and return outputs. An all-to-all pattern permits different data to move between many
    device pairs. Backward execution exchanges corresponding gradients along the necessary routes.


    **All-to-all** differs from all-reduce: participants send different assigned data to one another rather
    than everyone receiving the same combined sum. Preserve token identities on the return trip, and reverse
    the necessary routes when gradients are sent backward.'
  text_mode: 'In expert parallelism, devices package token assignments for destination devices, exchange them,
    run expert batches, and return outputs. An all-to-all pattern permits different data to move between many
    device pairs. Backward execution exchanges corresponding gradients along the necessary routes.


    **All-to-all** differs from all-reduce: participants send different assigned data to one another rather
    than everyone receiving the same combined sum. Preserve token identities on the return trip, and reverse
    the necessary routes when gradients are sent backward.'
  bridges: []
- id: moe-gradients-and-communication.s4
  title: Co-design learning and execution
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.moe-gradients-and-communication
  markdown: Routing balance, locality constraints, token count, and expert placement influence communication
    volume and waiting. Overlap can hide part of the transfers but cannot remove all dependencies. Validate
    distributed output and gradient agreement against a small reference before optimizing throughput.
  text_mode: Routing balance, locality constraints, token count, and expert placement influence communication
