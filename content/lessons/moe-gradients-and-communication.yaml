assessment_families:
  - id: moe-gradients-and-communication.base
    objective_ref: objective.moe-gradients-and-communication
    task: base
    response_type: single_choice
    points: 1
    hint: 'Selection is a separate boundary: trace the inputs, operation, and result before choosing.'
    remediation_scene: moe-gradients-and-communication.s2
    variants:
      - id: moe-gradients-and-communication.base.1
        prompt: For a fixed selected set, gradients can reach what?
        options:
          - id: a
            text: Selected expert parameters and differentiable combination weights
          - id: b
            text: Every unselected expert identically through an absent output
          - id: c
            text: Only token IDs
        answer: a
        feedback: The executed weighted computation defines local gradient paths.
        retired: true
      - id: moe-gradients-and-communication.base.2
        prompt: Is hard top-k membership globally smooth?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if k is two
          - id: a
            text: 'No'
        answer: a
        feedback: Selection boundaries are discrete.
        retired: true
  - id: moe-gradients-and-communication.transfer
    objective_ref: objective.moe-gradients-and-communication
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Co-design learning and execution: trace the inputs, operation, and result before choosing.'
    remediation_scene: moe-gradients-and-communication.s4
    variants:
      - id: moe-gradients-and-communication.transfer.1
        prompt: What moves in expert-parallel dispatch?
        options:
          - id: b
            text: The entire original corpus on every token
          - id: c
            text: Only scalar loss values
          - id: a
            text: Assigned token representations and later returned outputs
        answer: a
        feedback: Expert owners need the activations they process.
        retired: true
      - id: moe-gradients-and-communication.transfer.2
        prompt: Why compare distributed gradients to a small reference?
        options:
          - id: c
            text: To remove the need for memory accounting
          - id: a
            text: To catch routing, ordering, and aggregation errors
          - id: b
            text: To prove all future benchmarks
        answer: a
        feedback: Execution optimizations must preserve the intended computation.
        retired: true
  - id: moe-gradients-and-communication.base.v2
    objective_ref: objective.moe-gradients-and-communication
    task: base
    response_type: single_choice
    points: 1
    hint: In y = g₁E₁ + g₂E₂, each expert's output gets its gate as gradient, and each gate gets its expert's output. Experts that never ran have no term in y at all.
    remediation_scene: moe-gradients-and-communication.s1
    variants:
      - id: moe-gradients-and-communication.base.v2.1
        prompt: A token is routed to experts 2 and 5 of 8, with renormalized top-2 gates. Which parameters receive gradient from this token's MoE output?
        options:
          - id: b
            text: All 8 experts, each weighted by the router's probability for it
          - id: a
            text: Experts 2 and 5, plus the router through their two gates
          - id: c
            text: Experts 2 and 5 alone, since top-k selection blocks the router
        answer: a
        feedback: Only the experts that ran appear in y, and the gates are smooth functions of the router's logits, so the router learns through them. Unchosen experts contribute nothing for this token.
      - id: moe-gradients-and-communication.base.v2.2
        prompt: An MoE layer computes y = g₁E₁ + g₂E₂, and the gradient arriving at y is 1. What gradient reaches the gate g₁?
        options:
          - id: c
            text: g₁ itself, the weight given to expert 1
          - id: b
            text: g₁ × E₁, the size of expert 1's contribution
          - id: a
            text: E₁, the output of expert 1
        answer: a
        feedback: y changes by E₁ for each unit change in g₁, so ∂y/∂g₁ = E₁. The gate g₁ is the gradient flowing into expert 1's output, the other direction of the same product.
      - id: moe-gradients-and-communication.base.v2.3
        prompt: Why can't ordinary backpropagation tell a router "you should have tried expert 3"?
        options:
          - id: a
            text: Expert 3 never ran, and the top-k choice is a jump with no slope
          - id: b
            text: Expert 3's gate is negative, so its gradient is clipped to zero
          - id: c
            text: The router's logits are fixed after the first training step
        answer: a
        feedback: With no output from expert 3 there's nothing to compare, and switching the chosen set is a discontinuous jump. Gates come from a softmax or sigmoid, so they're never negative, and routers keep learning throughout training.
      - id: moe-gradients-and-communication.base.v2.4
        prompt: How does the all-to-all used in expert parallelism differ from the all-reduce used in data-parallel training?
        options:
          - id: b
            text: All-to-all sums gradients across GPUs; all-reduce sends token vectors
          - id: a
            text: In all-to-all each GPU gets different data; all-reduce gives all a shared sum
          - id: c
            text: All-to-all runs once per training step; all-reduce runs once per layer
        answer: a
        feedback: In an all-to-all, each GPU sends a different slice to each of the others, such as the tokens bound for each expert. All-reduce combines contributions so that every GPU ends up with the same result. MoE layers need all-to-alls in every layer, forward and backward.
  - id: moe-gradients-and-communication.transfer.v2
    objective_ref: objective.moe-gradients-and-communication
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask which experts actually ran for the tokens involved, and count how many copies of each token vector cross the network per MoE layer.
    remediation_scene: moe-gradients-and-communication.s4
    variants:
      - id: moe-gradients-and-communication.transfer.v2.1
        prompt: In a Switch Transformer layer, the gate is pᵢ from a softmax over all experts, with no renormalization. A token goes to expert 3. Which router logits get gradient from it?
        options:
          - id: c
            text: Expert 3's logit alone, since it's the one that ran
          - id: a
            text: Each expert's logit, through the softmax's shared denominator
          - id: b
            text: No logits, since the top-1 choice has no slope
        answer: a
        feedback: p₃ = e^ℓ₃ / Σ e^ℓⱼ depends on every logit through the denominator, so each gets some gradient. With renormalized top-k gates, unchosen logits would get none. The choice has no slope, but the gate value does.
      - id: moe-gradients-and-communication.transfer.v2.2
        prompt: A team profiles MoE training and finds all-to-all communication takes 40% of each step. They move from top-2 to top-1 routing, with no other changes. What happens to the all-to-all traffic?
        options:
          - id: b
            text: It stays the same, since the token count is unchanged
          - id: c
            text: It drops to a quarter, since dispatch and combine both shrink
          - id: a
            text: It roughly halves, since each token is sent to one expert
        answer: a
        feedback: Traffic is proportional to T × k × d, so halving k halves every all-to-all. Dispatch and combine each halve; they don't compound into a quarter.
      - id: moe-gradients-and-communication.transfer.v2.3
        prompt: A new 8-GPU MoE implementation gives a training loss 5% different from a single-GPU reference on the same small batch. What should the team check first?
        options:
          - id: a
            text: Whether combine returns each output to its original token position
          - id: c
            text: Whether the learning rate was scaled up for the larger GPU count
          - id: b
            text: Whether the balance loss weight α is high enough on the 8 GPUs
        answer: a
        feedback: On one batch the forward pass should match the reference almost exactly, so a 5% gap points to bookkeeping, most often a wrong return address after the all-to-all. Learning rate doesn't affect a single forward loss, and α is the same on both.
      - id: moe-gradients-and-communication.transfer.v2.4
        prompt: During training, the router sends no tokens to expert 6 for thousands of steps. What happens to expert 6's weights?
        options:
          - id: c
            text: They learn from the average gradient of the other experts
          - id: b
            text: They are copied from the busiest expert to rebalance the load
          - id: a
            text: They stay essentially unchanged, since no gradient reaches them
        answer: a
        feedback: An expert learns only from tokens routed to it, so with none it gets no task gradient (apart from effects like weight decay). That's the collapse trap, which balance losses or bias adjustments exist to prevent.
  - id: moe-gradients-and-communication.calculate
    objective_ref: objective.moe-gradients-and-communication
    task: base
    response_type: numeric
    points: 1
    hint: For gates, use ∂L/∂gᵢ = Eᵢ and ∂L/∂ℓᵢ = gᵢ(Eᵢ − y) when ∂L/∂y = 1. For traffic, one all-to-all carries T × k × d × bytes per number.
    remediation_scene: moe-gradients-and-communication.s1
    absolute_tolerance: 0.05
    variants:
      - id: moe-gradients-and-communication.calculate.1
        prompt: An MoE layer computes y = g₁E₁ + g₂E₂ with E₁ = 2 and E₂ = 6, and the gradient arriving at y is 1. What gradient reaches the gate g₂?
        answer: 6
        feedback: ∂y/∂g₂ = E₂ = 6. The gate's gradient is the output of the expert it scales.
      - id: moe-gradients-and-communication.calculate.2
        prompt: Renormalized top-2 gates are g₁ = 0.75 and g₂ = 0.25, with expert outputs E₁ = 2 and E₂ = 6, so y = 3. With ∂L/∂y = 1, what is the gradient on expert 1's logit, g₁(E₁ − y)?
        answer: -0.75
        feedback: 0.75 × (2 − 3) = −0.75. Gradient descent raises this logit, shifting weight toward expert 1, whose smaller output lowers y.
      - id: moe-gradients-and-communication.calculate.3
        prompt: Each GPU holds 4,096 tokens, routing is top-2, and token vectors have 4,096 numbers of 2 bytes each. How many megabytes (1 MB = 1,000,000 bytes) does one GPU pack for one dispatch all-to-all? Give one decimal place.
        answer: 67.108864
        feedback: 4,096 × 2 × 4,096 × 2 = 67,108,864 bytes ≈ 67.1 MB.
      - id: moe-gradients-and-communication.calculate.4
        prompt: Each GPU holds 4,096 tokens, routing is top-1, and token vectors have 2,048 numbers of 2 bytes each. How many megabytes (1 MB = 1,000,000 bytes) does one GPU pack for one dispatch all-to-all? Give one decimal place.
        answer: 16.777216
        feedback: 4,096 × 1 × 2,048 × 2 = 16,777,216 bytes ≈ 16.8 MB.
      - id: moe-gradients-and-communication.calculate.5
        prompt: One all-to-all in an MoE layer moves 67.1 MB per GPU. Counting dispatch and combine, forward and backward, how many megabytes does that layer move per GPU in one training step? Give one decimal place.
        answer: 268.4
        feedback: Four all-to-alls per layer per step, 4 × 67.1 = 268.4 MB. (If some experts are on the same GPU, a little of that stays local.)
