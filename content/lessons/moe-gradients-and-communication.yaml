schema_version: 0.2-draft
lesson:
  id: moe-gradients-and-communication
  version: 0.1.0-draft
  title: Understand how sparse routes learn and cross device boundaries
  state: draft
  summary: Selected expert outputs and routing weights provide gradient paths, while discrete selection requires
    a defined training treatment; expert-parallel execution exchanges activations and their backward gradients.
  slot: M18.7
  category: learning
  minutes: 12
  sources:
  - title: Sparsely-Gated Mixture-of-Experts
    url: https://arxiv.org/abs/1701.06538
  - title: Switch Transformers
    url: https://arxiv.org/abs/2101.03961
  - title: DeepSeek-V3 Technical Report
    url: https://arxiv.org/abs/2412.19437
objectives:
- id: objective.moe-gradients-and-communication
  version: 1-draft
  statement: Selected expert outputs and routing weights provide gradient paths, while discrete selection requires
    a defined training treatment; expert-parallel execution exchanges activations and their backward gradients.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - moe-gradients-and-communication.base
  - moe-gradients-and-communication.transfer
  prerequisites:
