schema_version: 0.2-draft
lesson:
  id: image-geometry
  version: 0.2.0-draft
  title: What changes when an image changes?
  state: draft
  summary: Read an image as a grid of measurements, then distinguish changes in brightness, position, and meaning.
  slot: M12.1
  category: learning
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.image-geometry
  version: 1-draft
  statement: Pixels, color channels, geometry, and local features represent different aspects of an image;
    invariance assumptions should match the visual task.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - image-geometry.base
  - image-geometry.transfer
  prerequisites:
  - anyOf:
    - objective.digital-representations
  - anyOf:
    - objective.geometry-and-symmetry
scenes:
- id: image-geometry.s1
  title: An image is a sampled measurement
  type: explanation
  depth: intuition
  objective_refs:
  - objective.image-geometry
  markdown: 'A digital image stores values on a grid with one or more channels. Lighting, camera response,
    compression, and viewpoint affect those values. A red channel is a numerical measurement under a color
    convention, not a direct label for every red object in the scene.


    A **pixel** is one grid location; a **channel** is one kind of value stored there, such as red, green or
    blue intensity. A 2-by-2 RGB image therefore holds 2 × 2 × 3 = 12 channel values. These values describe
    an image representation; identifying the objects is a further task.'
  text_mode: 'A digital image stores values on a grid with one or more channels. Lighting, camera response,
    compression, and viewpoint affect those values. A red channel is a numerical measurement under a color
    convention, not a direct label for every red object in the scene.


    A **pixel** is one grid location; a **channel** is one kind of value stored there, such as red, green or
    blue intensity. A 2-by-2 RGB image therefore holds 2 × 2 × 3 = 12 channel values. These values describe
    an image representation; identifying the objects is a further task.'
  bridges: []
- id: image-geometry.s2
  title: Separate appearance from geometry
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.image-geometry
  markdown: 'Brightness changes alter pixel values without necessarily moving objects. Translation changes
    positions; rotation changes orientation; perspective can change shape in the image. A classifier may seek
    invariance to some changes, while a detector must move its predicted coordinates correspondingly.


    **Invariant** means the answer stays the same under a stated change: shifting a cat picture should still
    give “cat.” **Equivariant** means the output changes correspondingly: shift the cat ten pixels right and
    its predicted box should shift right too. The right property depends on whether you want a name or a location.'
  text_mode: 'Brightness changes alter pixel values without necessarily moving objects. Translation changes
    positions; rotation changes orientation; perspective can change shape in the image. A classifier may seek
    invariance to some changes, while a detector must move its predicted coordinates correspondingly.


    **Invariant** means the answer stays the same under a stated change: shifting a cat picture should still
    give “cat.” **Equivariant** means the output changes correspondingly: shift the cat ten pixels right and
    its predicted box should shift right too. The right property depends on whether you want a name or a location.'
  bridges:
  - geometry-and-symmetry
- id: image-geometry.s3
  title: Use a local visual cue
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.image-geometry
  markdown: 'A simple horizontal difference compares neighboring pixel intensities. Values [2, 2, 8, 8] have
    a large change between the middle entries, suggesting an edge. Gradients, corners, and texture descriptors
    can support classical vision methods. An intensity edge can also come from a shadow rather than an object
    boundary.


    Neighbor differences for [2, 2, 8, 8] are 0, 6, and 0. The middle change is a local cue. Try adding 3 to
    every input: [5, 5, 11, 11] gives the same differences. This small calculation separates an overall brightness
    change from a change in this particular edge signal.'
  text_mode: 'A simple horizontal difference compares neighboring pixel intensities. Values [2, 2, 8, 8] have
    a large change between the middle entries, suggesting an edge. Gradients, corners, and texture descriptors
    can support classical vision methods. An intensity edge can also come from a shadow rather than an object
    boundary.


    Neighbor differences for [2, 2, 8, 8] are 0, 6, and 0. The middle change is a local cue. Try adding 3 to
    every input: [5, 5, 11, 11] gives the same differences. This small calculation separates an overall brightness
    change from a change in this particular edge signal.'
  bridges: []
- id: image-geometry.s4
  title: Connect representation to the task
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.image-geometry
  markdown: Detection, recognition, tracking, and measurement require different outputs and tolerances. Preserve
    coordinate conventions and transformations in labels when resizing or cropping. A preprocessing choice
    can change the task, especially when small objects or fine texture are essential.
  text_mode: Detection, recognition, tracking, and measurement require different outputs and tolerances. Preserve
    coordinate conventions and transformations in labels when resizing or cropping. A preprocessing choice
    can change the task, especially when small objects or fine texture are essential.
  bridges: []
