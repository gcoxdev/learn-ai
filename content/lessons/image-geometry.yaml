schema_version: 0.2-draft
lesson:
  id: image-geometry
  version: 0.4.0-draft
  title: What changes when an image changes?
  state: draft
  summary: Your phone finds every photo of your dog without knowing the word "dog". See the numbers it actually reads, and which ones should change when the photo moves.
  slot: M12.1
  category: learning
  sources:
    - title: Dive into Deep Learning — authors’ open textbook
      url: https://d2l.ai/
    - title: "Computer Vision: Algorithms and Applications, 2nd edition (Szeliski, 2022)"
      url: https://szeliski.org/Book/
    - title: "Distinctive Image Features from Scale-Invariant Keypoints (Lowe, 2004)"
      url: https://doi.org/10.1023/B:VISI.0000029664.99615.94
objectives:
  - id: objective.image-geometry
    version: 2-draft
    statement: Pixels, color channels, geometry, and local features represent different aspects of an image; invariance assumptions should match the visual task.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - image-geometry.base.v2
      - image-geometry.transfer.v2
      - image-geometry.calculate
    prerequisites:
      - anyOf:
          - objective.digital-representations
      - anyOf:
          - objective.geometry-and-symmetry
scenes:
  - id: image-geometry.s1
    title: A photo is three grids of numbers
    type: explanation
    depth: intuition
    objective_refs:
      - objective.image-geometry
    markdown: |-
      Type "dog" into your phone's photo search and there's every picture of Biscuit, your beagle. Nobody tagged those photos. All the phone had was numbers.

      This module follows one photo app through three jobs: **finding pets**, **reading signs**, and **blurring strangers' faces** before you share. Each job needs a different answer from the same numbers.

      A 12-megapixel phone photo is 4,000 pixels wide and 3,000 tall. A **pixel** is one cell of that grid. Each pixel stores three numbers, one per **color channel** (red, green, blue), usually from 0 (none) to 255 (full). Here are four pixels from the edge of Biscuit's ear:

      | Pixel (row, column) | Red | Green | Blue | Looks like |
      | --- | ---: | ---: | ---: | --- |
      | (1200, 2000) | 150 | 100 | 60 | brown fur |
      | (1200, 2001) | 148 | 97 | 58 | brown fur |
      | (1200, 2002) | 235 | 232 | 225 | white wall |
      | (1200, 2003) | 236 | 233 | 226 | white wall |

      So the whole photo is a block of numbers with shape **height × width × channels**, written H × W × C: 3,000 × 4,000 × 3 = 36,000,000 numbers. A grid of numbers with several axes like this is called a **tensor**.

      :::predict Pet search shrinks each photo to 224 × 224 pixels before looking at it. How many numbers does the model receive?
      224 × 224 × 3 = 150,528, about 240 times fewer than the full photo and plenty to spot a beagle. The next lessons ask how many weights a network needs to read it.
      :::

      These numbers record light, not meaning: the same brown fur can read 150 in the sun and 60 in the shade.
    bridges: []
  - id: image-geometry.s2
    title: Move the photo, and ask which answers move
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.image-geometry
    markdown: |-
      In a 400-pixel-wide photo, Biscuit sits in the box $(x_1, y_1, x_2, y_2) = (100, 80, 220, 200)$: left, top, right, and bottom edges, in pixels from the top-left corner. Shift the whole picture 30 pixels right.

      - The pet search answer should still be "dog". An output that stays the same when the input is transformed is **invariant** to that transformation.
      - The box should move with Biscuit, to $(130, 80, 250, 200)$. An output that changes *in step with* the input is **equivariant**.

      Which one you want depends on the job:

      | Change to the photo | Pet search ("dog?") | Face box for blurring | Sign reading |
      | --- | --- | --- | --- |
      | Shift 30 px right | same | moves 30 px right | same text |
      | Flip left–right | same | mirrors across the photo | mirror writing: wrong |
      | Brighten every pixel | same | same | same text |
      | Rotate 180° | same | rotates with the face | upside-down: harder |

      :::papers Invariance and equivariance as equations
      Write the model as $f$ and an image transformation (shift, flip, rotation) as $T$.

      $$\text{invariant: } f(T(x)) = f(x) \qquad \text{equivariant: } f(T(x)) = T'(f(x))$$

      $T'$ is the matching change to the output: for the 30-pixel shift, it adds 30 to $x_1$ and $x_2$.
      :::

      :::predict The same 400-pixel-wide photo is flipped left to right. Where does the box (100, 80, 220, 200) go?
      A point at $x$ lands at $400 - x$, so the old right edge becomes the new left edge: $400 - 220 = 180$, and $400 - 100 = 300$. The new box is $(180, 80, 300, 200)$; $y$ values don't change.
      :::

      :::mixup "Flipping the training photos is always a free way to get more data."
      Flipping is a fine **augmentation** (a changed copy of a training photo that keeps its label) for pet search, because a mirrored beagle is still a beagle. For sign reading it's harmful: a mirrored "b" becomes "d". Add a change only if your task's answer ignores it, or if you change the label to match, as you would move a box.
      :::
    bridges:
      - geometry-and-symmetry
  - id: image-geometry.s3
    title: An edge is a jump between neighbors
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.image-geometry
    markdown: |-
      The simplest clue to where things begin and end is a jump in brightness between neighbors. Take one row of a gray image where dark fur meets a bright wall: [2, 2, 8, 8]. Subtract each pixel from its right-hand neighbor: 2 − 2 = 0, 8 − 2 = 6, 8 − 8 = 0. The differences [0, 6, 0] point to an **edge** between the second and third pixels.

      Brighten the whole photo by adding 3 to every pixel: [5, 5, 11, 11]. The differences are still [0, 6, 0]. The edge signal is invariant to brightness, because the added 3 cancels in every subtraction. Double the contrast instead and the differences double too, to [0, 12, 0].

      ```python run
      import numpy as np

      photo = np.zeros((300, 400, 3), dtype=np.uint8)   # H x W x C
      print("photo shape:", photo.shape, "->", photo.size, "numbers")

      # A tiny grayscale strip: dark fur on the left, bright wall on the right.
      img = np.array([[2, 2, 8, 8],
                      [2, 2, 8, 8],
                      [2, 2, 8, 8]])

      def edges(a):
          """Difference between each pixel and its right-hand neighbor."""
          return a[:, 1:] - a[:, :-1]

      print("differences:           ", edges(img)[0])
      print("brighter (+3):         ", edges(img + 3)[0])
      print("more contrast (x2):    ", edges(img * 2)[0])

      # Biscuit's box in the 400-wide photo: (x1, y1, x2, y2)
      W = photo.shape[1]
      x1, y1, x2, y2 = 100, 80, 220, 200
      print("box shifted 30 px right:", (x1 + 30, y1, x2 + 30, y2))
      print("box flipped left-right: ", (W - x2, y1, W - x1, y2))
      ```

      Try swapping the 2s and 8s in `img`: the difference turns negative, giving the edge's direction as well as its strength.

      For decades, vision systems were built on hand-designed clues like this. SIFT (Lowe, 2004) used brightness differences at several scales to find distinctive points, so the same building corner could be matched across two photos. From 2012 on, convolutional networks took over by *learning* their own difference patterns; the next lesson shows how. One caution: a shadow on a lawn makes the same jump as a dog's outline, so test edge clues on shadowed photos too.
    bridges: []
  - id: image-geometry.s4
    title: Resize the photo, resize the labels
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.image-geometry
    markdown: |-
      The photo app runs its models on a 400 × 300 copy of the 4,000 × 3,000 photo, which scales every coordinate by 0.1. That one choice affects each job differently.

      - **Faces.** The face finder spots a stranger at $(120, 80, 160, 130)$ in the small copy. To blur the *original*, scale the box back up by 10: $(1200, 800, 1600, 1300)$. Skip that, and the blur lands on a small patch near the top-left corner.
      - **Signs.** Letters 40 pixels tall become 4 pixels tall, too small to read, so the sign reader crops the sign from the full-resolution photo.
      - **Pets.** A beagle is still recognizable at 400 × 300, so pet search can use the small copy directly.

      Decide the input size per job, and move every label (box, point, or mask) through the same resize, crop, or flip you apply to the pixels.
    diagram:
      caption: One photo, three jobs. Each job needs its own input size and its own kind of answer.
      description: The phone photo (3,000 × 4,000 × 3 numbers) is resized by 0.1 into a small copy. The small copy feeds pet search, whose label is invariant to shifts, and the face finder, whose boxes move with each face. The face boxes are scaled back up by 10 so the blur is drawn on the full photo. Separately, the full photo is cropped at full resolution for the sign reader, because text must stay readable and is not invariant to flips.
      nodes:
        - id: photo
          label: Phone photo
          note: 3,000 × 4,000 × 3
          col: 0
          row: 1
          tone: data
        - id: small
          label: Small copy
          note: 300 × 400 × 3
          col: 1
          row: 0
          tone: data
        - id: pets
          label: Pet search
          note: label stays "dog"
          col: 2
          row: 0
          tone: accent
        - id: faces
          label: Face finder
          note: boxes move with faces
          col: 2
          row: 1
          tone: accent
        - id: blur
          label: Blur full photo
          note: boxes scaled back ×10
          col: 3
          row: 1
          tone: warn
        - id: crop
          label: Full-size crop
          note: letters stay readable
          col: 1
          row: 2
          tone: data
        - id: signs
          label: Sign reader
          note: text can't be flipped
          col: 2
          row: 2
          tone: accent
      edges:
        - from: photo
          to: small
          label: resize × 0.1
        - from: small
          to: pets
        - from: small
          to: faces
        - from: faces
          to: blur
          label: × 10
        - from: photo
          to: crop
        - from: crop
          to: signs
  - id: image-geometry.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.image-geometry
    markdown: A receipt scanner, a satellite map, a chest X-ray, and a wildlife camera test whether you can tell which answers should stay put and which should move with the picture.
    takeaway: |-
      An image is a grid of light measurements. Decide which changes your answer should ignore (invariance) and which it should follow (equivariance), and move every label through the same resize, crop, or flip as the pixels.
  - id: image-geometry.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.image-geometry
    markdown: |-
      An image transformation can change measurements, positions, or both. Decide which changes should leave your answer alone and which should move the answer with the object.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - image-geometry.s1
