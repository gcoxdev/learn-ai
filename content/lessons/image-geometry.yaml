schema_version: 0.2-draft
lesson:
  id: image-geometry
  version: 0.1.0-draft
  title: What changes when an image changes?
  state: draft
  summary: Pixels, color channels, geometry, and local features represent different aspects of an image; invariance
    assumptions should match the visual task.
  slot: M12.1
  category: learning
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.image-geometry
  version: 1-draft
  statement: Pixels, color channels, geometry, and local features represent different aspects of an image; invariance
    assumptions should match the visual task.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - image-geometry.base
  - image-geometry.transfer
  prerequisites:
  - anyOf:
    - objective.digital-representations
  - anyOf:
    - objective.geometry-and-symmetry
scenes:
- id: image-geometry.s1
  title: An image is a sampled measurement
  type: explanation
  depth: intuition
  objective_refs:
  - objective.image-geometry
  markdown: A digital image stores values on a grid with one or more channels. Lighting, camera response, compression,
    and viewpoint affect those values. A red channel is a numerical measurement under a color convention, not a
    direct label for every red object in the scene.
  text_mode: A digital image stores values on a grid with one or more channels. Lighting, camera response, compression,
    and viewpoint affect those values. A red channel is a numerical measurement under a color convention, not a
    direct label for every red object in the scene.
  bridges: []
- id: image-geometry.s2
  title: Separate appearance from geometry
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.image-geometry
  markdown: Brightness changes alter pixel values without necessarily moving objects. Translation changes positions;
    rotation changes orientation; perspective can change shape in the image. A classifier may seek invariance to
    some changes, while a detector must move its predicted coordinates correspondingly.
  text_mode: Brightness changes alter pixel values without necessarily moving objects. Translation changes positions;
    rotation changes orientation; perspective can change shape in the image. A classifier may seek invariance to
    some changes, while a detector must move its predicted coordinates correspondingly.
  bridges:
  - geometry-and-symmetry
- id: image-geometry.s3
  title: Use a local visual cue
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.image-geometry
  markdown: A simple horizontal difference compares neighboring pixel intensities. Values [2, 2, 8, 8] have a large
    change between the middle entries, suggesting an edge. Gradients, corners, and texture descriptors can support
    classical vision methods. An intensity edge can also come from a shadow rather than an object boundary.
  text_mode: A simple horizontal difference compares neighboring pixel intensities. Values [2, 2, 8, 8] have a large
    change between the middle entries, suggesting an edge. Gradients, corners, and texture descriptors can support
    classical vision methods. An intensity edge can also come from a shadow rather than an object boundary.
  bridges: []
- id: image-geometry.s4
  title: Connect representation to the task
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.image-geometry
  markdown: Detection, recognition, tracking, and measurement require different outputs and tolerances. Preserve
    coordinate conventions and transformations in labels when resizing or cropping. A preprocessing choice can change
    the task, especially when small objects or fine texture are essential.
  text_mode: Detection, recognition, tracking, and measurement require different outputs and tolerances. Preserve
    coordinate conventions and transformations in labels when resizing or cropping. A preprocessing choice can change
    the task, especially when small objects or fine texture are essential.
  bridges: []
- id: image-geometry.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.image-geometry
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Pixels, color channels, geometry, and local features represent different aspects of an image; invariance
    assumptions should match the visual task.
- id: image-geometry.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.image-geometry
  markdown: Pixels, color channels, geometry, and local features represent different aspects of an image; invariance
    assumptions should match the visual task.
  text_mode: Pixels, color channels, geometry, and local features represent different aspects of an image; invariance
    assumptions should match the visual task.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - image-geometry.s1
    - image-geometry.s2
    - image-geometry.s3
