assessment_families:
  - id: image-geometry.base
    objective_ref: objective.image-geometry
    task: base
    response_type: single_choice
    points: 1
    hint: 'Separate appearance from geometry: trace the inputs, operation, and result before choosing.'
    remediation_scene: image-geometry.s2
    variants:
      - id: image-geometry.base.1
        prompt: A large neighboring intensity change can indicate what?
        options:
          - id: a
            text: An edge-like visual feature
          - id: b
            text: A guaranteed object boundary
          - id: c
            text: A complete semantic description
        answer: a
        feedback: Intensity discontinuities can arise from several physical causes.
        retired: true
      - id: image-geometry.base.2
        prompt: A detector’s coordinates should shift when the image shifts. Which relationship is desired?
        options:
          - id: b
            text: An unchanged coordinate vector
          - id: c
            text: No defined geometry
          - id: a
            text: Equivariance
        answer: a
        feedback: The output location should transform with the input.
        retired: true
  - id: image-geometry.transfer
    objective_ref: objective.image-geometry
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Connect representation to the task: trace the inputs, operation, and result before choosing.'
    remediation_scene: image-geometry.s4
    variants:
      - id: image-geometry.transfer.1
        prompt: A crop removes a small target object but keeps its label. What went wrong?
        options:
          - id: b
            text: The array lost all numeric values
          - id: c
            text: The optimizer must be changed first
          - id: a
            text: The transformation invalidated the target
        answer: a
        feedback: Label validity must be preserved or updated during image transformations.
        retired: true
      - id: image-geometry.transfer.2
        prompt: A shadow creates a strong edge. Does the edge alone prove two objects meet there?
        options:
          - id: c
            text: Only in RGB images
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Local visual features need contextual interpretation.
        retired: true
  - id: image-geometry.base.v2
    objective_ref: objective.image-geometry
    task: base
    response_type: single_choice
    points: 1
    hint: Ask what the job's answer is (a label, a location, or text), then check whether that answer should stay put or move when the picture changes.
    remediation_scene: image-geometry.s2
    variants:
      - id: image-geometry.base.v2.1
        prompt: The photo app shifts a picture 50 pixels to the left before running the face finder. What should happen to the box around a stranger's face?
        options:
          - id: b
            text: It should keep its old coordinates, since it is the same face
          - id: c
            text: It should grow by 50 pixels to cover the old and new positions
          - id: a
            text: It should move 50 pixels to the left along with the face
        answer: a
        feedback: A location output should be equivariant, changing in step with the image. Keeping the old coordinates is the invariance idea applied to the wrong kind of output; the label "face" is what stays the same.
      - id: image-geometry.base.v2.2
        prompt: A gray row reads [10, 10, 40, 40]. Every pixel is brightened by 20. What happens to the neighbor differences?
        options:
          - id: a
            text: They stay [0, 30, 0], because the added 20 cancels
          - id: c
            text: They become [20, 50, 20], because each pixel rose by 20
          - id: b
            text: They become [0, 60, 0], because the image got brighter
        answer: a
        feedback: Each difference subtracts two pixels that both rose by 20, so the 20 cancels. Adding 20 to the differences themselves forgets that subtraction; doubling would come from doubling the contrast, not from adding a constant.
      - id: image-geometry.base.v2.3
        prompt: A NumPy photo has shape (300, 400, 3). What do the three numbers mean?
        options:
          - id: c
            text: 300 pixels wide, 400 pixels tall, and 3 bytes per pixel
          - id: a
            text: 300 rows tall, 400 columns wide, and 3 color channels
          - id: b
            text: 300 red values, 400 green values, and 3 blue values
        answer: a
        feedback: The usual order is height × width × channels, so this photo is 300 rows by 400 columns, with red, green, and blue at each pixel. Reading the first number as width swaps the two spatial axes, a common source of sideways boxes.
      - id: image-geometry.base.v2.4
        prompt: Pet search should answer "dog" whether Biscuit is on the left or the right of the photo. Which property does that describe?
        options:
          - id: b
            text: Equivariance, since the dog's position changes in the photo
          - id: a
            text: Invariance, since the answer stays the same when the dog moves
          - id: c
            text: Calibration, since the model is equally confident on both sides
        answer: a
        feedback: The output (the label) doesn't change when the input shifts, so it is invariant. Equivariance would describe an output, such as a box, that moves along with the dog.
  - id: image-geometry.transfer.v2
    objective_ref: objective.image-geometry
    task: transfer
    response_type: single_choice
    points: 1
    hint: Imagine applying the change to one real example. Would the correct answer stay the same, move with the picture, or become a different answer?
    remediation_scene: image-geometry.s4
    variants:
      - id: image-geometry.transfer.v2.1
        prompt: A receipt-scanning app wants extra training images. Which augmentation keeps the correct answer (the printed text) unchanged?
        options:
          - id: a
            text: Slightly brightening or darkening each receipt photo
          - id: b
            text: Flipping each receipt photo left to right
          - id: c
            text: Rotating each receipt photo upside down, with no label change
        answer: a
        feedback: Reading text is invariant to a modest brightness change. A flip turns the text into mirror writing, and an upside-down receipt no longer matches its label unless the reader is also taught that orientation.
      - id: image-geometry.transfer.v2.2
        prompt: A model labels buildings in satellite photos taken straight down. The team debates rotating training images by 90°. What is the best argument?
        options:
          - id: c
            text: Avoid it, because rotation spoils labels as it does for street signs
          - id: b
            text: Avoid it, because rotated photos change every pixel value
          - id: a
            text: Use it, because an overhead view has no fixed "up" for buildings
        answer: a
        feedback: Seen from above, a building is still a building at any rotation, so the label is invariant to it. Street signs are different because text has an up direction; changing pixel values is what every augmentation does.
      - id: image-geometry.transfer.v2.3
        prompt: A chest X-ray model must report whether a problem is in the left or the right lung. How should the team use left–right flips for augmentation?
        options:
          - id: b
            text: Flip freely, since the lungs and the problem stay visible
          - id: a
            text: Flip, and switch each flipped image's label between left and right
          - id: c
            text: Flip freely, since chest images are symmetric left to right
        answer: a
        feedback: The answer itself is a side, so it changes with the flip and the label must be updated, the way a box would be. Keeping the old label teaches the wrong side, and the chest isn't truly symmetric (the heart sits to one side).
      - id: image-geometry.transfer.v2.4
        prompt: A wildlife camera saves 1920 × 1080 images, and a bird detector runs on a 480 × 270 copy. It finds a bird at (100, 50, 120, 70) in the copy. Where should the app draw the box on the original?
        options:
          - id: c
            text: (100, 50, 120, 70), since the bird is the same bird
          - id: b
            text: (25, 12.5, 30, 17.5), dividing each coordinate by 4
          - id: a
            text: (400, 200, 480, 280), multiplying each coordinate by 4
        answer: a
        feedback: The copy is 4 times smaller in each direction (1920 / 480 = 4), so coordinates grow by 4 on the way back. Dividing applies the resize a second time instead of undoing it.
  - id: image-geometry.calculate
    objective_ref: objective.image-geometry
    task: base
    response_type: numeric
    points: 1
    hint: Write the rule for the change first. A shift adds the same amount to x₁ and x₂, a left–right flip sends x to W − x (and swaps which edge is which), and a resize multiplies by the scale factor.
    remediation_scene: image-geometry.s2
    absolute_tolerance: 0.01
    variants:
      - id: image-geometry.calculate.1
        prompt: A photo is 600 pixels wide. A face box spans x₁ = 150 to x₂ = 250. After a left–right flip, what is the new left edge x₁?
        answer: 350
        feedback: The old right edge becomes the new left edge, 600 − 250 = 350. (The new right edge is 600 − 150 = 450.)
      - id: image-geometry.calculate.2
        prompt: A pet box has x₁ = 40 and x₂ = 140. The whole photo is shifted 25 pixels to the right. What is the new x₂?
        answer: 165
        feedback: A shift adds the same amount to every horizontal coordinate, 140 + 25 = 165.
      - id: image-geometry.calculate.3
        prompt: A 4000 × 3000 photo is shrunk to 500 × 375 for the face finder, which reports a face with x₁ = 90 in the small copy. What is x₁ in the original photo?
        answer: 720
        feedback: The scale factor is 500 / 4000 = 0.125, so going back multiplies by 8, giving 90 × 8 = 720.
      - id: image-geometry.calculate.4
        prompt: A photo is 800 pixels wide. A sign's box spans x₁ = 500 to x₂ = 700. After a left–right flip, what is the new right edge x₂?
        answer: 300
        feedback: The old left edge becomes the new right edge, 800 − 500 = 300. (The new left edge is 800 − 700 = 100.)
      - id: image-geometry.calculate.5
        prompt: How many numbers does one 1080 × 1920 RGB video frame hold (height × width × channels)?
        answer: 6220800
        feedback: 1080 × 1920 = 2,073,600 pixels, times 3 channels = 6,220,800 numbers.
