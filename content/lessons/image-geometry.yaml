assessment_families:
- id: image-geometry.base
  objective_ref: objective.image-geometry
  task: base
  response_type: single_choice
  points: 1
  hint: 'Separate appearance from geometry: trace the inputs, operation, and result before choosing.'
  remediation_scene: image-geometry.s2
  variants:
  - id: image-geometry.base.1
    prompt: A large neighboring intensity change can indicate what?
    options:
    - id: a
      text: An edge-like visual feature
    - id: b
      text: A guaranteed object boundary
    - id: c
      text: A complete semantic description
    answer: a
    feedback: Intensity discontinuities can arise from several physical causes.
  - id: image-geometry.base.2
    prompt: A detector’s coordinates should shift when the image shifts. Which relationship is desired?
    options:
    - id: b
      text: An unchanged coordinate vector
    - id: c
      text: No defined geometry
    - id: a
      text: Equivariance
    answer: a
    feedback: The output location should transform with the input.
- id: image-geometry.transfer
  objective_ref: objective.image-geometry
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Connect representation to the task: trace the inputs, operation, and result before choosing.'
  remediation_scene: image-geometry.s4
  variants:
  - id: image-geometry.transfer.1
    prompt: A crop removes a small target object but keeps its label. What went wrong?
    options:
    - id: b
      text: The array lost all numeric values
    - id: c
      text: The optimizer must be changed first
    - id: a
      text: The transformation invalidated the target
    answer: a
    feedback: Label validity must be preserved or updated during image transformations.
  - id: image-geometry.transfer.2
    prompt: A shadow creates a strong edge. Does the edge alone prove two objects meet there?
    options:
    - id: c
      text: Only in RGB images
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Local visual features need contextual interpretation.
