assessment_families:
  - id: cross-modal-model-case-comparison.base
    objective_ref: objective.cross-modal-model-case-comparison
    task: base
    response_type: single_choice
    points: 1
    hint: Ask what the model outputs (a score, text, a picture, or codes) before judging what it can do.
    remediation_scene: cross-modal-model-case-comparison.s2
    variants:
      - id: cross-modal-model-case-comparison.base.1
        prompt: Is CLIP alone a pixel generator?
        options:
          - id: c
            text: Only for captions
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Contrastive alignment produces comparable representations.
        retired: true
      - id: cross-modal-model-case-comparison.base.2
        prompt: Does a transformer denoiser necessarily generate images one text token at a time?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only when operating in latent space
        answer: a
        feedback: Component architecture and generation procedure are different properties.
        retired: true
  - id: cross-modal-model-case-comparison.transfer
    objective_ref: objective.cross-modal-model-case-comparison
    task: transfer
    response_type: single_choice
    points: 1
    hint: Fill the inference-state column for each candidate, then match it to the workload.
    remediation_scene: cross-modal-model-case-comparison.s5
    variants:
      - id: cross-modal-model-case-comparison.transfer.1
        prompt: Is a learned audio codec identical to an autoregressive audio generator?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if it uses quantization
        answer: a
        feedback: The codec supplies a representation; a generator models its sequences.
        retired: true
      - id: cross-modal-model-case-comparison.transfer.2
        prompt: Why compare persistent inference state?
        options:
          - id: b
            text: It proves all task quality is equal
          - id: c
            text: It replaces evaluation
          - id: a
            text: Caches, recurrence, and iterative denoising create different resource demands
        answer: a
        feedback: Runtime mechanisms matter alongside measured outputs.
        retired: true
  - id: cross-modal-model-case-comparison.base.v2
    objective_ref: objective.cross-modal-model-case-comparison
    task: base
    response_type: single_choice
    points: 1
    hint: Read the mechanism columns. What was the model trained to predict, and what does it hold in memory while it works?
    remediation_scene: cross-modal-model-case-comparison.s2
    variants:
      - id: cross-modal-model-case-comparison.base.v2.1
        prompt: What does CLIP's training produce?
        options:
          - id: b
            text: A decoder that writes captions for new images, one word at a time
          - id: a
            text: Image and text encoders whose vectors are close for matching pairs
          - id: c
            text: A generator that turns a text prompt into an image through denoising
        answer: a
        feedback: CLIP's contrastive training aligns two encoders, so its output is a similarity score. Writing captions needs a language decoder, as in LLaVA, and generating images needs a model like latent diffusion.
      - id: cross-modal-model-case-comparison.base.v2.2
        prompt: Why does a photo add so much to LLaVA's memory use during a conversation?
        options:
          - id: a
            text: The image becomes hundreds of tokens that fill the KV cache like words
          - id: b
            text: The vision encoder's weights are reloaded for every new photo
          - id: c
            text: The image is kept as raw pixels alongside the text in the cache
        answer: a
        feedback: LLaVA-1.5 turns a 336-pixel photo into 576 patch tokens, and each is cached like a text token, about 288 MiB for a 7B model. The encoder's weights load once, and the cache holds keys and values, not pixels.
      - id: cross-modal-model-case-comparison.base.v2.3
        prompt: What is Whisper's inference state while transcribing one 30-second chunk?
        options:
          - id: c
            text: A cache that grows with each of the 480,000 audio samples in the chunk
          - id: b
            text: A recurrent state carried unchanged from the start of the recording
          - id: a
            text: Encoder keys and values for 1,500 positions, plus a small text cache
        answer: a
        feedback: The encoder turns 3,000 spectrogram frames into 1,500 positions once, and the decoder's cache grows with the text it writes. Raw audio samples are never cached, and each chunk is encoded separately.
      - id: cross-modal-model-case-comparison.base.v2.4
        prompt: Stable Diffusion runs 50 denoising steps. How does its memory change from step 1 to step 50?
        options:
          - id: b
            text: It grows with each step, since every step's latent is kept for the next
          - id: a
            text: It stays about the same, since the same latent is refined in place
          - id: c
            text: It shrinks with each step, since less noise needs storing as it clears
        answer: a
        feedback: Diffusion refines one fixed-size latent (64 × 64 × 4 for v1), so more steps cost time, not memory. Only the current latent is needed for the next step, and noise isn't stored separately.
  - id: cross-modal-model-case-comparison.transfer.v2
    objective_ref: objective.cross-modal-model-case-comparison
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name the job first (match, describe, transcribe, generate, or encode), then pick the model whose output procedure does that job.
    remediation_scene: cross-modal-model-case-comparison.s6
    variants:
      - id: cross-modal-model-case-comparison.transfer.v2.1
        prompt: A shop wants to match customers' product photos to its 20,000 catalog descriptions and return the closest five. Which kind of model fits best?
        options:
          - id: c
            text: A latent diffusion model that redraws each photo to match a description
          - id: b
            text: A vision-language chat model asked to name the product in each photo
          - id: a
            text: A CLIP-style model that scores photo–description similarity
        answer: a
        feedback: Ranking by similarity is exactly what contrastive encoders do, and catalog vectors can be computed once. A chat model's free-text answer still has to be matched to entries, and a generator doesn't rank anything.
      - id: cross-modal-model-case-comparison.transfer.v2.2
        prompt: A podcast tool plans to "generate new episodes with EnCodec." What's missing from that plan?
        options:
          - id: a
            text: A separate model that decides which codes to produce
          - id: b
            text: A larger codebook, so EnCodec can store whole sentences
          - id: c
            text: A speech recognizer to convert EnCodec's output into audio
        answer: a
        feedback: EnCodec compresses audio into codes and decodes them back; it doesn't choose what to say. A generator over those codes does that. Codebook size affects fidelity, and recognition goes from audio to text, the wrong direction.
      - id: cross-modal-model-case-comparison.transfer.v2.3
        prompt: A university wants Whisper to transcribe two-hour lectures and worries that memory will grow with the lecture length. What actually happens?
        options:
          - id: b
            text: Memory grows linearly, since the whole lecture is one encoder input
          - id: a
            text: Each 30-second chunk is encoded separately, so memory stays per chunk
          - id: c
            text: Memory grows with the square of the length, as in long-context attention
        answer: a
        feedback: Whisper works on 30-second chunks, so encoder state is fixed per chunk. The practical problem shifts to stitching chunks together, handling words cut at boundaries and context carried between them.
      - id: cross-modal-model-case-comparison.transfer.v2.4
        prompt: A team swaps its transformer for a Mamba-style model to read 500-page contracts with constant memory, and expects the same exact recall of clause numbers. What should they do?
        options:
          - id: c
            text: Nothing, since a constant-size state keeps every token without loss
          - id: b
            text: Double the state size, which makes recall identical to attention
          - id: a
            text: Test exact recall on long contracts before switching
        answer: a
        feedback: A fixed-size state must compress what it has read, so exact recall far back is an empirical question. A bigger state helps but has no fixed exchange rate with attention's full cache; measure it on their documents.
  - id: cross-modal-model-case-comparison.calculate
    objective_ref: objective.cross-modal-model-case-comparison
    task: base
    response_type: numeric
    points: 1
    hint: "Image tokens = (image side ÷ patch side)². Whisper frames = seconds ÷ 0.01, halved by the stride-2 convolution. Cache = tokens × bytes per token."
    remediation_scene: cross-modal-model-case-comparison.s5
    absolute_tolerance: 0.1
    variants:
      - id: cross-modal-model-case-comparison.calculate.1
        prompt: A vision encoder cuts a 224-pixel square image into 14-pixel patches. How many image tokens is that?
        answer: 256
        feedback: 224 ÷ 14 = 16 patches per side, and 16 × 16 = 256 tokens.
      - id: cross-modal-model-case-comparison.calculate.2
        prompt: Whisper computes one spectrogram frame every 10 ms and processes 30-second chunks, then halves the frames with a stride-2 convolution. How many encoder positions does one chunk give?
        answer: 1500
        feedback: 30 s ÷ 0.01 s = 3,000 frames, and the stride-2 convolution halves that to 1,500 positions.
      - id: cross-modal-model-case-comparison.calculate.3
        prompt: LLaVA-1.5 turns one photo into 576 tokens, and its 7B language model caches 512 KiB per token. How many MiB of cache does the photo take?
        answer: 288
        feedback: 576 × 512 KiB = 294,912 KiB, and 294,912 ÷ 1,024 = 288 MiB.
      - id: cross-modal-model-case-comparison.calculate.4
        prompt: Stable Diffusion v1 shrinks each side of a 512 × 512 image by 8 and keeps 4 numbers per position. How many numbers are in the latent?
        answer: 16384
        feedback: 512 ÷ 8 = 64 per side, so 64 × 64 × 4 = 16,384 numbers, against 786,432 in the RGB image.
      - id: cross-modal-model-case-comparison.calculate.5
        prompt: Whisper large has 1,550 million parameters. How many GB are its weights at 2 bytes each?
        answer: 3.1
        feedback: 1.55 × 10⁹ × 2 bytes = 3.1 GB, small next to the language models in this module.
