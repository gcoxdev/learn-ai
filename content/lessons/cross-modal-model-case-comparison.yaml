assessment_families:
- id: cross-modal-model-case-comparison.base
  objective_ref: objective.cross-modal-model-case-comparison
  task: base
  response_type: single_choice
  points: 1
  hint: 'Separate alignment from generation: trace the inputs, operation, and result before choosing.'
  remediation_scene: cross-modal-model-case-comparison.s2
  variants:
  - id: cross-modal-model-case-comparison.base.1
    prompt: Is CLIP alone a pixel generator?
    options:
    - id: c
      text: Only for captions
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Contrastive alignment produces comparable representations.
  - id: cross-modal-model-case-comparison.base.2
    prompt: Does a transformer denoiser necessarily generate images one text token at a time?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only when operating in latent space
    answer: a
    feedback: Component architecture and generation procedure are different properties.
- id: cross-modal-model-case-comparison.transfer
  objective_ref: objective.cross-modal-model-case-comparison
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Complete a mechanism audit: trace the inputs, operation, and result before choosing.'
  remediation_scene: cross-modal-model-case-comparison.s6
  variants:
  - id: cross-modal-model-case-comparison.transfer.1
    prompt: Is a learned audio codec identical to an autoregressive audio generator?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if it uses quantization
    answer: a
    feedback: The codec supplies a representation; a generator models its sequences.
  - id: cross-modal-model-case-comparison.transfer.2
    prompt: Why compare persistent inference state?
    options:
    - id: b
      text: It proves all task quality is equal
    - id: c
      text: It replaces evaluation
    - id: a
      text: Caches, recurrence, and iterative denoising create different resource demands
    answer: a
    feedback: Runtime mechanisms matter alongside measured outputs.
