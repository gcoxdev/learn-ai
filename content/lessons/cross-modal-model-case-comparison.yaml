schema_version: 0.2-draft
lesson:
  id: cross-modal-model-case-comparison
  version: 0.2.0-draft
  title: Compare language, image, audio, and state-space artifacts
  state: draft
  summary: Compare what different models take in, learn, generate, and retain while running.
  slot: M35.7
  category: learning
  sources:
  - title: Learning Transferable Visual Models From Natural Language Supervision
    url: https://arxiv.org/abs/2103.00020
  - title: Visual Instruction Tuning
    url: https://arxiv.org/abs/2304.08485
  - title: High-Resolution Image Synthesis with Latent Diffusion Models
    url: https://arxiv.org/abs/2112.10752
  - title: Scalable Diffusion Models with Transformers
    url: https://arxiv.org/abs/2212.09748
  - title: Whisper
    url: https://arxiv.org/abs/2212.04356
  - title: EnCodec
    url: https://arxiv.org/abs/2210.13438
  - title: 'Mamba: Linear-Time Sequence Modeling with Selective State Spaces'
    url: https://arxiv.org/abs/2312.00752
objectives:
- id: objective.cross-modal-model-case-comparison
  version: 1-draft
  statement: Compare model families by representation, objective, output mechanism, and inference state rather
    than assuming every generative system is a chat transformer.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - cross-modal-model-case-comparison.base
  - cross-modal-model-case-comparison.transfer
  prerequisites:
  - anyOf:
    - objective.model-report-and-artifact-inventory
  - anyOf:
    - objective.multimodal-grounding-evaluation
  - anyOf:
    - objective.flow-matching-and-solvers
  - anyOf:
    - objective.selective-state-spaces
  - anyOf:
    - objective.speech-and-audio-generation
scenes:
- id: cross-modal-model-case-comparison.s1
  title: Use a common comparison sheet
  type: explanation
  depth: intuition
  objective_refs:
  - objective.cross-modal-model-case-comparison
  markdown: 'Give each artifact four columns: input representation, training target, output procedure, and
    persistent inference state. These columns compare systems without claiming they solve identical tasks.
    Use dated papers as mechanism anchors, then inspect the actual checkpoint’s configuration and terms before
    any implementation.'
  text_mode: 'Give each artifact four columns: input representation, training target, output procedure, and
    persistent inference state. These columns compare systems without claiming they solve identical tasks.
    Use dated papers as mechanism anchors, then inspect the actual checkpoint’s configuration and terms before
    any implementation.'
  bridges: []
- id: cross-modal-model-case-comparison.s2
  title: Separate alignment from generation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.cross-modal-model-case-comparison
  markdown: CLIP learns image/text representations through contrastive alignment; it is not by itself an image
    generator. LLaVA connects visual features to a language model for instruction-following responses. Ask
    whether an artifact scores similarity, produces language, or generates another modality before selecting
    a loss or evaluation.
  text_mode: CLIP learns image/text representations through contrastive alignment; it is not by itself an image
    generator. LLaVA connects visual features to a language model for instruction-following responses. Ask
    whether an artifact scores similarity, produces language, or generates another modality before selecting
    a loss or evaluation.
  bridges: []
- id: cross-modal-model-case-comparison.s3
  title: Trace an image generator
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.cross-modal-model-case-comparison
  markdown: 'Latent diffusion moves iterative denoising into a learned compressed image space; a decoder returns
    pixels. The DiT paper studies a transformer denoiser in that setting. A transformer component does not
    turn the overall process into ordinary next-text-token decoding: the denoising schedule still controls
    generation.'
  text_mode: 'Latent diffusion moves iterative denoising into a learned compressed image space; a decoder returns
    pixels. The DiT paper studies a transformer denoiser in that setting. A transformer component does not
    turn the overall process into ordinary next-text-token decoding: the denoising schedule still controls
    generation.'
  bridges: []
- id: cross-modal-model-case-comparison.s4
  title: Trace audio in both directions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.cross-modal-model-case-comparison
  markdown: Whisper uses an encoder-decoder architecture for speech-related text tasks. EnCodec learns an audio
    codec with quantized representations, which can serve as tokens for separate generative systems. Encoding
    sound, transcribing it, and generating new audio are different objectives and require different quality
    measurements.
  text_mode: Whisper uses an encoder-decoder architecture for speech-related text tasks. EnCodec learns an
    audio codec with quantized representations, which can serve as tokens for separate generative systems.
    Encoding sound, transcribing it, and generating new audio are different objectives and require different
    quality measurements.
  bridges: []
- id: cross-modal-model-case-comparison.s5
  title: Compare the sequence state
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.cross-modal-model-case-comparison
  markdown: Mamba’s selective state-space mechanism updates a recurrent state conditioned on input. Contrast
    that with attention cache growth and image denoising iterations. Fast sequence processing alone does not
    establish equivalent retrieval, generation, or grounding quality; match tasks and budgets before drawing
    a conclusion.
  text_mode: Mamba’s selective state-space mechanism updates a recurrent state conditioned on input. Contrast
    that with attention cache growth and image denoising iterations. Fast sequence processing alone does not
    establish equivalent retrieval, generation, or grounding quality; match tasks and budgets before drawing
    a conclusion.
  bridges: []
- id: cross-modal-model-case-comparison.s6
  title: Complete a mechanism audit
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.cross-modal-model-case-comparison
  markdown: 'Pick two papers here and draw the path from raw input to output. Label learned components, repeated
    operations, external preprocessing, and unavailable artifacts. Explain one difference in evaluation and
    one in runtime state. This comparison is a method for reading new releases, not a ranking across unrelated
    modalities.


    For CLIP, sketch image → image encoder → vector, and text → text encoder → vector, followed by similarity.
    For latent diffusion, sketch noise in a compressed image space → repeated conditioned denoising → image
    decoder → pixels. CLIP’s similarity output and the diffusion model’s generated picture answer different
    questions. “Persistent inference state” here means state retained during a request, such as the evolving
    noisy image or a token cache, not necessarily information saved after the request ends.'
  text_mode: 'Pick two papers here and draw the path from raw input to output. Label learned components, repeated
    operations, external preprocessing, and unavailable artifacts. Explain one difference in evaluation and
    one in runtime state. This comparison is a method for reading new releases, not a ranking across unrelated
    modalities.


    For CLIP, sketch image → image encoder → vector, and text → text encoder → vector, followed by similarity.
    For latent diffusion, sketch noise in a compressed image space → repeated conditioned denoising → image
    decoder → pixels. CLIP’s similarity output and the diffusion model’s generated picture answer different
    questions. “Persistent inference state” here means state retained during a request, such as the evolving
    noisy image or a token cache, not necessarily information saved after the request ends.'
  bridges: []
- id: cross-modal-model-case-comparison.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.cross-modal-model-case-comparison
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Compare model families by representation, objective, output mechanism, and inference state rather
    than assuming every generative system is a chat transformer.
