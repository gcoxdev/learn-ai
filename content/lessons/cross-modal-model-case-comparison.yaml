schema_version: 0.2-draft
lesson:
  id: cross-modal-model-case-comparison
  version: 0.4.0-draft
  title: Compare language, image, audio, and state-space artifacts
  state: draft
  summary: A museum guide app that sees, listens, and speaks needs four very different models. Put CLIP, LLaVA, Whisper, and Stable Diffusion on one comparison sheet and see what each one keeps in memory.
  slot: M35.7
  category: learning
  sources:
    - title: Learning Transferable Visual Models From Natural Language Supervision
      url: https://arxiv.org/abs/2103.00020
    - title: Visual Instruction Tuning
      url: https://arxiv.org/abs/2304.08485
    - title: Improved Baselines with Visual Instruction Tuning (LLaVA-1.5)
      url: https://arxiv.org/abs/2310.03744
    - title: High-Resolution Image Synthesis with Latent Diffusion Models
      url: https://arxiv.org/abs/2112.10752
    - title: Scalable Diffusion Models with Transformers
      url: https://arxiv.org/abs/2212.09748
    - title: Whisper
      url: https://arxiv.org/abs/2212.04356
    - title: EnCodec
      url: https://arxiv.org/abs/2210.13438
    - title: 'Mamba: Linear-Time Sequence Modeling with Selective State Spaces'
      url: https://arxiv.org/abs/2312.00752
objectives:
  - id: objective.cross-modal-model-case-comparison
    version: 2-draft
    statement: Compare model families by representation, objective, output mechanism, and inference state rather than assuming every generative system is a chat transformer.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - cross-modal-model-case-comparison.base.v2
      - cross-modal-model-case-comparison.transfer.v2
      - cross-modal-model-case-comparison.calculate
    prerequisites:
      - anyOf:
          - objective.model-report-and-artifact-inventory
      - anyOf:
          - objective.multimodal-grounding-evaluation
      - anyOf:
          - objective.flow-matching-and-solvers
      - anyOf:
          - objective.selective-state-spaces
      - anyOf:
          - objective.speech-and-audio-generation
scenes:
  - id: cross-modal-model-case-comparison.s1
    title: One app, four kinds of model
    type: explanation
    depth: intuition
    objective_refs:
      - objective.cross-modal-model-case-comparison
    markdown: |-
      A museum wants a guide app. A visitor photographs a painting, the guide finds it in the catalog, the visitor asks aloud "Why is her hand like that?", and the guide answers and can sketch a detail. That's four jobs: match an image to text, answer questions about an image, turn speech into text, and generate a picture.

      The models that do these jobs work in very different ways. The previous lessons compared language models on one sheet; here the sheet stretches across modalities, with two groups of columns.

      **Mechanism columns**:

      - what goes in, and in what form
      - what the model was trained to predict
      - how it produces its output
      - its **inference state**: what it holds in memory while handling one request, such as a KV cache or a noisy image being refined

      **Inventory columns**, as in the lesson on reading a release: weights, code, training data, license.

    bridges: []
  - id: cross-modal-model-case-comparison.s2
    title: Matching is not describing
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.cross-modal-model-case-comparison
    markdown: |-
      **CLIP** (OpenAI, 2021) trained an image encoder and a text encoder on 400 million image–caption pairs so that matching pairs get similar vectors, as in the contrastive image–text lesson. Its output is a similarity score. It can rank the museum's 5,000 catalog entries against a photo, but it can't write a sentence or draw a picture.

      **LLaVA** (2023) bolts a CLIP vision encoder onto a language model with a small learned projection. The image becomes patch tokens that sit in the language model's context like words. That's how it answers the visitor's question in prose, and it's also its cost: those image tokens fill the KV cache like any others.

      :::predict LLaVA-1.5 cuts a 336-pixel image into 14-pixel patches and feeds them to a 7B model shaped like Llama 2 7B (32 layers, 32 KV heads of width 128). How much cache does one photo take?
      (336 ÷ 14)² = 576 tokens. Each token caches 2 × 32 × 32 × 128 × 2 bytes = 512 KiB, so the photo costs 288 MiB before the visitor types a word. A text question of 20 tokens adds only 10 MiB.
      :::
    bridges: []
  - id: cross-modal-model-case-comparison.s3
    title: A generator whose state doesn't grow
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.cross-modal-model-case-comparison
    markdown: |-
      To sketch a detail, the guide needs a generator. **Latent diffusion** (Rombach et al., 2022), the basis of Stable Diffusion, denoises a compressed picture instead of pixels, as in the latent diffusion lesson. In Stable Diffusion v1, a 512 × 512 image corresponds to a 64 × 64 × 4 latent, 16,384 numbers.

      Generation starts from random noise in that latent shape and runs the denoising network perhaps 50 times, then decodes once to pixels. The inference state is the latent itself, and it's the same size at step 1 and step 50. Cost grows with the *number of steps*, not with a growing cache.

      The DiT paper (Peebles and Xie, 2022) replaced the usual U-Net denoiser with a transformer over latent patches. That changes the network inside each step, not the procedure: it still refines one latent over many steps, instead of writing an image token by token.
    bridges: []
  - id: cross-modal-model-case-comparison.s4
    title: Audio in, audio out
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.cross-modal-model-case-comparison
    markdown: |-
      **Whisper** (OpenAI, 2022) turns the visitor's question into text. As the speech recognition lesson describes, it trained on 680,000 hours of web audio with transcripts. It resamples audio to 16 kHz, computes 80-channel log-Mel spectrogram frames every 10 ms, and processes 30-second chunks. An encoder reads the chunk once; a decoder writes text tokens while cross-attending to the encoder's output.

      So its inference state has two parts. The encoder's keys and values are fixed per chunk: 3,000 frames, halved by a stride-2 convolution to 1,500 positions. The decoder's own cache grows only with the text it writes.

      **EnCodec** (Meta, 2022) goes the other way: a neural codec that compresses audio into a few streams of discrete codes and decodes them back to sound. It's a representation, not a speaker. To *say* the answer, the guide needs a separate model that generates those codes, as in the speech and audio generation lesson.

      :::mixup "If it outputs audio tokens, it's an audio generator."
      A codec only encodes and decodes. Something else must decide *which* codes to produce, and its quality is measured differently: codec quality by how faithful the round trip sounds, a generator by whether it says the right thing naturally.
      :::
    bridges: []
  - id: cross-modal-model-case-comparison.s5
    title: What each model keeps in memory
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.cross-modal-model-case-comparison
    markdown: |-
      Put the inference-state column side by side, and add the selective state-space model **Mamba** (Gu and Dao, 2023) for contrast:

      ```python run
      # What each model holds in memory while answering one museum visitor
      MiB = 2**20
      # Photo -> LLaVA-1.5-7B: 336-pixel image, 14-pixel patches, Llama-2-7B-shaped decoder
      patches = (336 // 14) ** 2
      kv_per_token = 2 * 32 * 32 * 128 * 2           # 32 layers, 32 KV heads, width 128, 2 bytes
      print(f"LLaVA-1.5-7B: {patches} image tokens -> {patches * kv_per_token / MiB:.0f} MiB of KV cache")

      # Question -> Whisper large: 30 s of audio at a 10 ms hop, then a stride-2 convolution
      frames = 30_000 // 10
      positions = frames // 2
      cross_kv = 32 * 2 * positions * 1280 * 2       # decoder layers x (K, V) x positions x width x bytes
      print(f"Whisper large: {frames} mel frames -> {positions} encoder positions, "
            f"cross-attention K/V {cross_kv / MiB:.0f} MiB per chunk")

      # Picture -> Stable Diffusion v1: a fixed latent, revisited at every denoising step
      latent = 64 * 64 * 4
      print(f"Stable Diffusion v1: latent of {latent:,} numbers, same size at step 1 and step 50")
      ```

      | Model | Inference state | Grows with |
      | --- | --- | --- |
      | LLaVA (chat transformer) | KV cache | every image and text token |
      | Whisper | Encoder K/V + small decoder cache | each 30-second chunk, then text |
      | Stable Diffusion | One latent | nothing; steps add time, not memory |
      | Mamba | Fixed-size recurrent state | nothing |

      Mamba's state stays the same size however long the input, which makes long sequences cheap. But a fixed state has to compress, so exact recall of, say, a phone number from 50 pages back is something to test, not assume, as the lesson on selective state spaces shows.

      Try changing 336 to 672 for a sharper photo: four times the tokens and cache.
    bridges: []
  - id: cross-modal-model-case-comparison.s6
    title: Fill the inventory columns
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.cross-modal-model-case-comparison
    markdown: |-
      Now the other half of the sheet, from each project's paper and repository:

      | | CLIP | LLaVA | Whisper | Stable Diffusion v1 |
      | --- | --- | --- | --- | --- |
      | Weights | Yes | Yes | Yes | Yes |
      | Code | Yes (MIT) | Yes | Yes (MIT, weights too) | Yes |
      | Training data | No (400M pairs, unreleased) | Yes (158K instructions; 665K mix for 1.5) | No (680K hours, unreleased) | Public link list (LAION-5B subsets) |
      | Weights license | MIT repository | Check the base language model's terms | MIT | CreativeML OpenRAIL-M |

      Read down the columns for the museum. CLIP and Whisper are free to use but impossible to retrain from their original data. LLaVA's instruction data is public, so you could extend it with the museum's own question–answer pairs. Stable Diffusion's license has use restrictions a lawyer should read before the sketch feature ships.

      The mechanism columns decide which models *can* do each job; the inventory columns decide which ones you're *allowed* and *able* to adapt.
    bridges: []
  - id: cross-modal-model-case-comparison.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.cross-modal-model-case-comparison
    markdown: Match a catalog search, a podcast tool, a lecture transcriber, and a long-document reader to the right kind of model, then compute image tokens, audio frames, and cache sizes.
    takeaway: |-
      Compare models across modalities on the same sheet: input form, training target, output procedure, inference state, and inventory. CLIP matches, LLaVA describes, Whisper transcribes, diffusion generates, and each holds very different state while it works.
  - id: cross-modal-model-case-comparison.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.cross-modal-model-case-comparison
    markdown: |-
      Compare model families by representation, objective, output mechanism, and inference state rather than assuming every generative system is a chat transformer.
