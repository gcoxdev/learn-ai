assessment_families:
  - id: graph-neural-networks.base
    objective_ref: objective.graph-neural-networks
    task: base
    response_type: single_choice
    points: 1
    hint: 'Pass and aggregate messages: trace the inputs, operation, and result before choosing.'
    remediation_scene: graph-neural-networks.s2
    variants:
      - id: graph-neural-networks.base.1
        prompt: Messages 2 and 4 aggregate to what under a mean?
        options:
          - id: b
            text: '6'
          - id: c
            text: '8'
          - id: a
            text: '3'
        answer: a
        feedback: Mean divides their sum by two neighbors.
        retired: true
      - id: graph-neural-networks.base.2
        prompt: Why use a permutation-invariant neighborhood aggregation?
        options:
          - id: c
            text: Only file order matters
          - id: a
            text: Neighbor listing order should not arbitrarily change the represented graph
          - id: b
            text: All graph nodes must be identical
        answer: a
        feedback: Graph structure is independent of an arbitrary list ordering.
        retired: true
  - id: graph-neural-networks.transfer
    objective_ref: objective.graph-neural-networks
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate graph-specific generalization: trace the inputs, operation, and result before choosing.'
    remediation_scene: graph-neural-networks.s4
    variants:
      - id: graph-neural-networks.transfer.1
        prompt: Does more message-passing depth guarantee better graph reasoning?
        options:
          - id: c
            text: Only for molecules
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Depth can introduce oversmoothing or information bottlenecks.
        retired: true
      - id: graph-neural-networks.transfer.2
        prompt: Why inspect edges crossing a data split?
        options:
          - id: a
            text: They can leak information between training and evaluation entities
          - id: b
            text: Edges never carry information
          - id: c
            text: Only labels can leak
        answer: a
        feedback: Graph connectivity affects independence.
        retired: true
  - id: graph-neural-networks.base.v2
    objective_ref: objective.graph-neural-networks
    task: base
    response_type: single_choice
    points: 1
    hint: Picture one layer from a single node's point of view. It adds up its neighbors' messages, combines them with its own vector, and can only hear nodes one hop further than it could before.
    remediation_scene: graph-neural-networks.s2
    variants:
      - id: graph-neural-networks.base.v2.1
        prompt: A GNN predicts solubility. When the same molecule's atoms are listed in a different order, the prediction changes. Which design choice most likely causes this?
        options:
          - id: b
            text: The update uses ReLU rather than a smooth activation function
          - id: a
            text: The readout joins the atom vectors in list order before the output layer
          - id: c
            text: The update adds each atom's own vector to its neighbors' message sum
        answer: a
        feedback: Message passing with shared weights treats every ordering alike, so the order must be leaking in at the readout. A sum, mean, or max readout ignores order; joining vectors in list order doesn't. ReLU and the self term act on each atom the same way whatever its position.
      - id: graph-neural-networks.base.v2.2
        prompt: 'A carbon bonded to two oxygens and a carbon bonded to one oxygen receive heteroatom flags [1, 1] and [1]. Sum aggregation gives 2 and 1; mean gives 1 and 1. What does this show?'
        options:
          - id: c
            text: Mean aggregation changes when neighbors are listed in another order
          - id: b
            text: Sum is preferred because its outputs stay small on large graphs
          - id: a
            text: Mean aggregation can't count neighbors, so it discards information
        answer: a
        feedback: Both carbons look identical to the mean, but the sum tells them apart. Mean is still order-free, so that isn't the problem, and it's the sum, not the mean, whose values grow with degree.
      - id: graph-neural-networks.base.v2.3
        prompt: In the chain C1–C2–C3–C4–O, which atoms can affect C1's vector after exactly two message-passing layers?
        options:
          - id: a
            text: C1 itself plus C2 and C3, the atoms within two bonds
          - id: b
            text: C1 itself plus C2, since a layer passes messages across one bond
          - id: c
            text: Every atom in the chain, since the messages are summed together
        answer: a
        feedback: Each layer carries information one more bond, so two layers reach two hops. Layer 1 brings C3's information into C2, and layer 2 passes it on to C1. The oxygen is four bonds away and needs four layers.
      - id: graph-neural-networks.base.v2.4
        prompt: A team stacks 30 averaging GNN layers on small molecules and finds that every atom ends up with nearly the same vector. Which problem is this?
        options:
          - id: b
            text: Over-squashing, where distant information crowds into one small vector
          - id: a
            text: Over-smoothing, where repeated averaging pulls all nodes to one value
          - id: c
            text: Vanishing gradients, where the deep stack stops the weights updating
        answer: a
        feedback: Averaging with neighbors again and again drives every node in a connected graph toward the same vector, which is over-smoothing. Over-squashing is about a bottleneck edge, and vanishing gradients would slow training rather than make all atoms identical.
      - id: graph-neural-networks.base.v2.5
        prompt: Why does the GCN rule scale the message between nodes u and v by 1/√(d_u·d_v)?
        options:
          - id: c
            text: So that the aggregation gives the same result in any node order
          - id: b
            text: So that messages from nearer nodes count more than farther ones
          - id: a
            text: So that a node's total doesn't grow with its number of neighbors
        answer: a
        feedback: Without scaling, a node with 2,000 neighbors sums 2,000 messages. Dividing by the degrees keeps totals comparable across busy and quiet nodes. A plain sum is already order-free, and each layer only reaches direct neighbors, so distance isn't what the factor handles.
  - id: graph-neural-networks.transfer.v2
    objective_ref: objective.graph-neural-networks
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask which of the lesson's levers the problem needs. Where do the edges come from, how far must information travel, how should messages be scaled, and how do node vectors become one answer?
    remediation_scene: graph-neural-networks.s4
    variants:
      - id: graph-neural-networks.transfer.v2.1
        prompt: A traffic GNN treats intersections as nodes and roads as edges. Speeds at an intersection depend on jams up to three intersections upstream, but the model has one layer. Which change targets this?
        options:
          - id: a
            text: Use at least three message-passing layers so jams can reach it
          - id: b
            text: Switch from sum to mean so busy intersections don't dominate
          - id: c
            text: Scale each message by the degrees of both intersections
        answer: a
        feedback: One layer only reaches direct neighbors; information three hops away needs three layers. Changing the aggregation or scaling alters how neighbors are weighted but still only reaches one hop.
      - id: graph-neural-networks.transfer.v2.2
        prompt: In a social-network GNN with plain sum aggregation, users who follow a celebrity with 2 million followers get huge, unstable vectors. What is the standard fix?
        options:
          - id: c
            text: Add more layers so the large sum is spread over more nodes
          - id: a
            text: Normalize messages by degree, as in the GCN rule or a mean
          - id: b
            text: Replace the sum readout with a max readout over the graph
        answer: a
        feedback: The trouble is that sums grow with degree, so scaling by degree targets it directly. Extra layers spread the huge value further. The readout acts after message passing and doesn't touch the per-node blow-up.
      - id: graph-neural-networks.transfer.v2.3
        prompt: A lab scans a protein's surface as 5,000 points in 3-D, with no bonds recorded. How can a GNN use this data?
        options:
          - id: b
            text: Sort the points by x-coordinate and feed the list to an MLP
          - id: c
            text: Treat each point as its own graph and average the predictions
          - id: a
            text: Connect points closer than a chosen distance, then pass messages
        answer: a
        feedback: The edges are a modeling choice. Linking nearby points lets each point hear its surroundings. Sorting imposes an arbitrary order that shifts when the scan rotates, and isolated points can't exchange any information.
      - id: graph-neural-networks.transfer.v2.4
        prompt: A materials team wants one formation-energy number per crystal from graphs with anywhere from 8 to 200 atoms. Which output design fits?
        options:
          - id: a
            text: Pass messages, then sum the atom vectors into one crystal vector
          - id: b
            text: Pad each crystal to 200 atoms and flatten the vectors in list order
          - id: c
            text: Predict an energy for each atom and report the largest of them
        answer: a
        feedback: A sum readout handles any size and any atom order (divide by the atom count if the target is quoted per atom). Padding and flattening depends on the listing order, and the largest atom energy ignores all the others.
      - id: graph-neural-networks.transfer.v2.5
        prompt: A molecule has two ring systems joined by a single bond. The target depends on how the two rings interact, and adding layers doesn't help. What best explains this?
        options:
          - id: b
            text: Over-smoothing, since ring atoms average into one shared value
          - id: a
            text: Over-squashing, since everything must pass through one bond
          - id: c
            text: The readout depends on the order in which atoms are listed
        answer: a
        feedback: All information between the rings must cross one bond and fit in a fixed-size vector, and extra layers add more to squeeze through. Over-smoothing would blur atoms together rather than block cross-ring information, and a sum readout isn't order-dependent.
  - id: graph-neural-networks.calculate
    objective_ref: objective.graph-neural-networks
    task: base
    response_type: numeric
    points: 1
    hint: 'Apply h′ = ReLU(W·h_v + W′·(sum of neighbors'' h)) to one node at a time. For a second layer, use the first layer''s values for every node.'
    remediation_scene: graph-neural-networks.s2
    absolute_tolerance: 0.01
    variants:
      - id: graph-neural-networks.calculate.1
        prompt: In the path graph A–B–C, the features are A = 1, B = 2, C = 3. With W = 1, W′ = 0.5, and ReLU, what is B's value after one message-passing layer?
        answer: 4
        feedback: B's neighbors are A and C, so the message sum is 0.5 × (1 + 3) = 2. Adding B's own term 1 × 2 gives 4, and ReLU keeps it.
      - id: graph-neural-networks.calculate.2
        prompt: 'In acetamide, give each heavy atom its hydrogen count as a feature: C1 = 3, C2 = 0, O = 0, N = 2. C2 bonds to C1, O, and N. With W = 1 and W′ = 0.5, what is C2 after one layer?'
        answer: 2.5
        feedback: The neighbors sum to 3 + 0 + 2 = 5, and 0.5 × 5 = 2.5. C2's own term is 1 × 0 = 0, so the result is 2.5.
      - id: graph-neural-networks.calculate.3
        prompt: A node has value 1 and two neighbors with values 2 and 3. With W = 2, W′ = −1, and ReLU, what is the node's new value?
        answer: 0
        feedback: 2 × 1 + (−1) × (2 + 3) = 2 − 5 = −3, and ReLU turns −3 into 0.
      - id: graph-neural-networks.calculate.4
        prompt: In the path graph A–B–C, the features are A = 1, B = 0, C = 0. With W = 1, W′ = 1, and ReLU, what is C's value after two layers?
        answer: 1
        feedback: After layer 1, A = 1 + 0 = 1, B = 0 + (1 + 0) = 1, and C = 0 + 0 = 0. After layer 2, C = 0 + 1 × B = 0 + 1 = 1. A's signal needed two layers to reach C.
      - id: graph-neural-networks.calculate.5
        prompt: In a GCN, a node with 3 neighbors is bonded to a node with 1 neighbor. After adding self-loops, what normalization weight 1/√(d̃_u·d̃_v) does their edge get? Give three decimals.
        answer: 0.354
        feedback: Self-loops raise the degrees to 4 and 2, so the weight is 1/√(4 × 2) = 1/√8 ≈ 0.354. Forgetting the self-loops gives 1/√3 ≈ 0.577.
