assessment_families:
- id: graph-neural-networks.base
  objective_ref: objective.graph-neural-networks
  task: base
  response_type: single_choice
  points: 1
  hint: 'Pass and aggregate messages: trace the inputs, operation, and result before choosing.'
  remediation_scene: graph-neural-networks.s2
  variants:
  - id: graph-neural-networks.base.1
    prompt: Messages 2 and 4 aggregate to what under a mean?
    options:
    - id: b
      text: '6'
    - id: c
      text: '8'
    - id: a
      text: '3'
    answer: a
    feedback: Mean divides their sum by two neighbors.
  - id: graph-neural-networks.base.2
    prompt: Why use a permutation-invariant neighborhood aggregation?
    options:
    - id: c
      text: Only file order matters
    - id: a
      text: Neighbor listing order should not arbitrarily change the represented graph
    - id: b
      text: All graph nodes must be identical
    answer: a
    feedback: Graph structure is independent of an arbitrary list ordering.
- id: graph-neural-networks.transfer
  objective_ref: objective.graph-neural-networks
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate graph-specific generalization: trace the inputs, operation, and result before choosing.'
  remediation_scene: graph-neural-networks.s4
  variants:
  - id: graph-neural-networks.transfer.1
    prompt: Does more message-passing depth guarantee better graph reasoning?
    options:
    - id: c
      text: Only for molecules
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Depth can introduce oversmoothing or information bottlenecks.
  - id: graph-neural-networks.transfer.2
    prompt: Why inspect edges crossing a data split?
    options:
    - id: a
      text: They can leak information between training and evaluation entities
    - id: b
      text: Edges never carry information
    - id: c
      text: Only labels can leak
    answer: a
    feedback: Graph connectivity affects independence.
