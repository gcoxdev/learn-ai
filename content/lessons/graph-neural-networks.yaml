schema_version: 0.2-draft
lesson:
  id: graph-neural-networks
  version: 0.1.0-draft
  title: Learn by exchanging messages across a graph
  state: draft
  summary: Graph neural networks update node or edge representations using neighborhood messages and aggregation;
    graph construction, permutation behavior, and depth determine what relationships can be represented.
  slot: M34.1
  category: learning
  sources:
  - title: Neural Message Passing for Quantum Chemistry
    url: https://arxiv.org/abs/1704.01212
  - title: Graph Convolutional Networks
    url: https://arxiv.org/abs/1609.02907
objectives:
- id: objective.graph-neural-networks
  version: 1-draft
  statement: Graph neural networks update node or edge representations using neighborhood messages and aggregation;
    graph construction, permutation behavior, and depth determine what relationships can be represented.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - graph-neural-networks.base
  - graph-neural-networks.transfer
  prerequisites:
  - anyOf:
    - objective.knowledge-graphs
  - anyOf:
    - objective.neural-forward-pass
scenes:
- id: graph-neural-networks.s1
  title: Represent entities and relations
  type: explanation
  depth: intuition
  objective_refs:
  - objective.graph-neural-networks
  markdown: 'A graph contains nodes and edges, optionally with attributes. Atoms and bonds, users and interactions,
    or locations and connections produce different graph meanings. The choice of edges is an inductive assumption:
    an absent edge may remove an information path the task needs.'
  text_mode: 'A graph contains nodes and edges, optionally with attributes. Atoms and bonds, users and interactions,
    or locations and connections produce different graph meanings. The choice of edges is an inductive assumption:
    an absent edge may remove an information path the task needs.'
  bridges: []
- id: graph-neural-networks.s2
  title: Pass and aggregate messages
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.graph-neural-networks
  markdown: A message function combines a neighbor’s representation with relevant edge information. A node aggregates
    incoming messages, often with a permutation-invariant sum or mean, then updates its state. With neighbor scalar
    messages two and four, a sum gives six while a mean gives three; the choice preserves different information.
  text_mode: A message function combines a neighbor’s representation with relevant edge information. A node aggregates
    incoming messages, often with a permutation-invariant sum or mean, then updates its state. With neighbor scalar
    messages two and four, a sum gives six while a mean gives three; the choice preserves different information.
  bridges: []
- id: graph-neural-networks.s3
  title: Expand the receptive neighborhood
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.graph-neural-networks
  markdown: After one local layer, a node receives information from immediate neighbors; multiple layers can reach
    farther. Excessive aggregation can make representations too similar, while narrow pathways can compress too
    much distant information. Depth alone does not guarantee every graph property is learnable.
  text_mode: After one local layer, a node receives information from immediate neighbors; multiple layers can reach
    farther. Excessive aggregation can make representations too similar, while narrow pathways can compress too
    much distant information. Depth alone does not guarantee every graph property is learnable.
  bridges: []
- id: graph-neural-networks.s4
  title: Evaluate graph-specific generalization
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.graph-neural-networks
  markdown: Test new nodes, new graphs, changed sizes, and structural distributions as appropriate. Avoid leakage
    through edges or related entities crossing splits. Node classification, link prediction, and whole-graph prediction
    require different outputs and evaluation designs.
  text_mode: Test new nodes, new graphs, changed sizes, and structural distributions as appropriate. Avoid leakage
    through edges or related entities crossing splits. Node classification, link prediction, and whole-graph prediction
    require different outputs and evaluation designs.
  bridges: []
- id: graph-neural-networks.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.graph-neural-networks
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Graph neural networks update node or edge representations using neighborhood messages and aggregation;
    graph construction, permutation behavior, and depth determine what relationships can be represented.
