  version: 0.4.0-draft
  title: Evaluate scientific predictions beyond familiar benchmarks
  state: draft
  summary: AlphaFold won a Nobel Prize for predicting protein shapes. Learn to read its confidence scores, see what it can't tell you, and spot the test split that flatters molecule models.
