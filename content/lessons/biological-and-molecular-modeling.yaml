assessment_families:
- id: biological-and-molecular-modeling.base
  objective_ref: objective.biological-and-molecular-modeling
  task: base
  response_type: single_choice
  points: 1
  hint: 'Split by meaningful novelty: trace the inputs, operation, and result before choosing.'
  remediation_scene: biological-and-molecular-modeling.s2
  variants:
  - id: biological-and-molecular-modeling.base.1
    prompt: Does predicted protein structure automatically establish biological function?
    options:
    - id: c
      text: Only if confidence is high
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Structure is one target among many biological properties.
  - id: biological-and-molecular-modeling.base.2
    prompt: Why use scaffold or sequence-aware splits?
    options:
    - id: a
      text: To test novelty beyond close training relatives
    - id: b
      text: To guarantee all labels are correct
    - id: c
      text: Only to equalize file counts
    answer: a
    feedback: Similarity leakage can overstate generalization.
- id: biological-and-molecular-modeling.transfer
  objective_ref: objective.biological-and-molecular-modeling
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Connect prediction to experiment: trace the inputs, operation, and result before choosing.'
  remediation_scene: biological-and-molecular-modeling.s4
  variants:
  - id: biological-and-molecular-modeling.transfer.1
    prompt: Can optimizing a learned property predictor exploit its errors?
    options:
    - id: a
      text: 'Yes'
    - id: b
      text: 'No'
    - id: c
      text: Only if the candidate is text
    answer: a
    feedback: Surrogate optimization can leave the predictor’s reliable domain.
  - id: biological-and-molecular-modeling.transfer.2
    prompt: What strengthens a discovery claim beyond model rescoring?
    options:
    - id: b
      text: Only repeating the same score
    - id: c
      text: Only generating more candidate names
    - id: a
      text: Independent experimental or appropriate physical validation
    answer: a
    feedback: Confirmation needs evidence beyond the optimized proxy.
