assessment_families:
  - id: biological-and-molecular-modeling.base
    objective_ref: objective.biological-and-molecular-modeling
    task: base
    response_type: single_choice
    points: 1
    hint: 'Split by meaningful novelty: trace the inputs, operation, and result before choosing.'
    remediation_scene: biological-and-molecular-modeling.s2
    variants:
      - id: biological-and-molecular-modeling.base.1
        prompt: Does predicted protein structure automatically establish biological function?
        options:
          - id: c
            text: Only if confidence is high
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Structure is one target among many biological properties.
        retired: true
      - id: biological-and-molecular-modeling.base.2
        prompt: Why use scaffold or sequence-aware splits?
        options:
          - id: a
            text: To test novelty beyond close training relatives
          - id: b
            text: To guarantee all labels are correct
          - id: c
            text: Only to equalize file counts
        answer: a
        feedback: Similarity leakage can overstate generalization.
        retired: true
  - id: biological-and-molecular-modeling.transfer
    objective_ref: objective.biological-and-molecular-modeling
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Connect prediction to experiment: trace the inputs, operation, and result before choosing.'
    remediation_scene: biological-and-molecular-modeling.s4
    variants:
      - id: biological-and-molecular-modeling.transfer.1
        prompt: Can optimizing a learned property predictor exploit its errors?
        options:
          - id: a
            text: 'Yes'
          - id: b
            text: 'No'
          - id: c
            text: Only if the candidate is text
        answer: a
        feedback: Surrogate optimization can leave the predictor’s reliable domain.
        retired: true
      - id: biological-and-molecular-modeling.transfer.2
        prompt: What strengthens a discovery claim beyond model rescoring?
        options:
          - id: b
            text: Only repeating the same score
          - id: c
            text: Only generating more candidate names
          - id: a
            text: Independent experimental or appropriate physical validation
        answer: a
        feedback: Confirmation needs evidence beyond the optimized proxy.
        retired: true
  - id: biological-and-molecular-modeling.base.v2
    objective_ref: objective.biological-and-molecular-modeling
    task: base
    response_type: single_choice
    points: 1
    hint: Match each output to its question. pLDDT is about one residue's local placement, PAE is about how two parts sit relative to each other, and a split decides what "new" means in the test.
    remediation_scene: biological-and-molecular-modeling.s3
    variants:
      - id: biological-and-molecular-modeling.base.v2.1
        prompt: An AlphaFold model of a two-domain protein has pLDDT above 90 in both domains, but the predicted aligned error between them is about 25 Å. What should you conclude?
        options:
          - id: b
            text: Both domains and their arrangement can be trusted, since pLDDT is high
          - id: a
            text: Each domain's shape is reliable, but their relative placement is not
          - id: c
            text: The whole prediction is unreliable, since one of the scores is poor
        answer: a
        feedback: pLDDT is local, so it vouches for each domain's own shape. PAE between the domains asks how one sits relative to the other, and 25 Å says that arrangement is a guess. The domains themselves are still usable.
      - id: biological-and-molecular-modeling.base.v2.2
        prompt: A 60-residue stretch at a protein's end has pLDDT around 30 in every AlphaFold run. What is the most common explanation?
        options:
          - id: a
            text: The stretch is likely disordered and has no single fixed shape
          - id: c
            text: The multiple sequence alignment was too large for the model
          - id: b
            text: The stretch folds tightly but AlphaFold places it upside down
        answer: a
        feedback: Very low pLDDT often marks intrinsically disordered regions that flop around until they bind a partner. A large alignment usually helps rather than hurts, and a tightly folded region placed wrongly is a different pattern.
      - id: biological-and-molecular-modeling.base.v2.3
        prompt: What does AlphaFold 2 take in and produce for a single protein chain?
        options:
          - id: c
            text: It takes a measured structure and returns the protein's function
          - id: b
            text: It takes a sequence and returns a movie of the chain folding
          - id: a
            text: It takes a sequence and alignment and returns atom coordinates
        answer: a
        feedback: From the sequence and related sequences lined up across species, it predicts one static 3-D structure with per-residue confidence. It doesn't simulate the folding process or motion, and function must be studied separately.
      - id: biological-and-molecular-modeling.base.v2.4
        prompt: A solubility model scores well on a random split but much worse on a scaffold split. What does the gap mean?
        options:
          - id: a
            text: The random-split score was helped by near-siblings of test molecules in training
          - id: b
            text: The scaffold split is flawed, since it leaves too few molecules for training
          - id: c
            text: The model is overfitting to noise, since its random-split error is too low
        answer: a
        feedback: Molecules sharing a scaffold have similar properties, so a random split lets the model recognize families it saw. The scaffold split asks about new families, which is the harder question most projects care about.
      - id: biological-and-molecular-modeling.base.v2.5
        prompt: How does AlphaFold 3 produce the final atom positions of a protein–DNA complex?
        options:
          - id: b
            text: It predicts the protein and the DNA separately, then docks them together
          - id: a
            text: A diffusion module refines noisy atom positions into a structure step by step
          - id: c
            text: It copies the most similar complex found in the structure database
        answer: a
        feedback: AlphaFold 3's final stage is a diffusion model that starts from noise and denoises all the atoms together, which is how it handles ligands and nucleic acids. That's also why it can hallucinate structure in disordered regions.
  - id: biological-and-molecular-modeling.transfer.v2
    objective_ref: objective.biological-and-molecular-modeling
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what the prediction can and can't show. Is this a new family or a near-copy? Is the evidence from the same model that made the pick, or from an independent measurement?
    remediation_scene: biological-and-molecular-modeling.s4
    variants:
      - id: biological-and-molecular-modeling.transfer.v2.1
        prompt: A design team generates 5,000 binder backbones with RFdiffusion, and a structure predictor says 300 fold as intended. What should their paper report to support the claim that they designed binders?
        options:
          - id: c
            text: The structure predictor's confidence for all 300 designs
          - id: a
            text: Lab measurements of binding for the designs they made
          - id: b
            text: How closely the 300 backbones resemble natural binders
        answer: a
        feedback: The in-silico filter reduces candidates but shares the models' blind spots. Binding measured in the lab is the evidence. Resembling natural binders might even mean the designs aren't new.
      - id: biological-and-molecular-modeling.transfer.v2.2
        prompt: A toxicity model is trained on a company's compounds and tested on a random 20% of them. The chemists plan to use it on a brand-new chemical series. Which evaluation should they add?
        options:
          - id: a
            text: Hold out entire scaffolds and test on those families
          - id: b
            text: Repeat the random split with five different seeds
          - id: c
            text: Report accuracy on the training compounds as well
        answer: a
        feedback: A new series means new scaffolds, so the test must hold out whole families. More random seeds still leave siblings across the split, and training accuracy says nothing about new chemistry.
      - id: biological-and-molecular-modeling.transfer.v2.3
        prompt: A virology lab asks whether a viral protein's loop changes shape when it binds a human receptor. They have one AlphaFold 2 prediction of the viral protein alone. What can it tell them?
        options:
          - id: b
            text: Both shapes, since the loop's pLDDT covers the likely range of motion
          - id: a
            text: One static shape, so the change on binding needs other evidence
          - id: c
            text: The bound shape, since AlphaFold predicts a protein's active form
        answer: a
        feedback: AlphaFold 2 returns one static structure for the chain it's given. pLDDT is confidence, not a range of motion. Bound shapes need a complex prediction checked by experiment, or experimental structures of both states.
      - id: biological-and-molecular-modeling.transfer.v2.4
        prompt: A screen of 1 million molecules sends its top 50 to a lab assay, and 4 are active. A random selection of 50 from the same library gives 1 active. How should the team describe this?
        options:
          - id: a
            text: The model's picks hit at 8% versus 2% for random picks
          - id: c
            text: The model found four new drugs for the target
          - id: b
            text: The model is accurate, since its top picks were active
        answer: a
        feedback: Comparing against a baseline shows the model's actual value, 4/50 = 8% against 1/50 = 2%. Active in one assay is far from a drug, and 46 of the top 50 were inactive, so "accurate" overstates it.
      - id: biological-and-molecular-modeling.transfer.v2.5
        prompt: An enzyme engineer runs AlphaFold on 200 single-mutation variants to rank which ones will stay stable. The predicted structures barely differ. What should she conclude?
        options:
          - id: c
            text: All 200 variants are probably as stable as the original enzyme
          - id: b
            text: The mutations must be on the surface, where they don't matter
          - id: a
            text: AlphaFold isn't built to rank stability changes, so she needs other data
        answer: a
        feedback: AlphaFold often returns nearly the same structure for one-letter changes, even destabilizing ones, because it predicts a fold, not stability. Near-identical structures say little about which variants survive. Stability tools or experiments are needed.
