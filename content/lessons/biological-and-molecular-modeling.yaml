scenes:
- id: biological-and-molecular-modeling.s1
  title: Define the scientific target
  type: explanation
  depth: intuition
  objective_refs:
  - objective.biological-and-molecular-modeling
  markdown: Protein structure prediction, molecular property estimation, and candidate generation are different
    tasks. Inputs may include sequences, alignments, molecular graphs, or coordinates. A predicted structure is
    not automatically a complete account of dynamics, binding, function, or behavior in a living system.
  text_mode: Protein structure prediction, molecular property estimation, and candidate generation are different
    tasks. Inputs may include sequences, alignments, molecular graphs, or coordinates. A predicted structure is
    not automatically a complete account of dynamics, binding, function, or behavior in a living system.
  bridges: []
- id: biological-and-molecular-modeling.s2
  title: Split by meaningful novelty
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.biological-and-molecular-modeling
  markdown: Closely related sequences or molecular scaffolds can cross a random split and make evaluation easier
    than discovering a new family. Use time, sequence similarity, scaffold, or other justified splits to match the
    claim. Report which relationships remain shared across training and test.
  text_mode: Closely related sequences or molecular scaffolds can cross a random split and make evaluation easier
    than discovering a new family. Use time, sequence similarity, scaffold, or other justified splits to match the
    claim. Report which relationships remain shared across training and test.
  bridges: []
- id: biological-and-molecular-modeling.s3
  title: Assess validity and uncertainty
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.biological-and-molecular-modeling
  markdown: Generated molecules need chemical and physical validity checks, while predicted properties need calibrated
    error estimates in relevant regimes. Confidence measures are model-specific and can fail outside familiar data.
    A high-scoring candidate can exploit a learned surrogate instead of possessing the desired real property.
  text_mode: Generated molecules need chemical and physical validity checks, while predicted properties need calibrated
    error estimates in relevant regimes. Confidence measures are model-specific and can fail outside familiar data.
    A high-scoring candidate can exploit a learned surrogate instead of possessing the desired real property.
  bridges: []
- id: biological-and-molecular-modeling.s4
  title: Connect prediction to experiment
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.biological-and-molecular-modeling
  markdown: Independent measurements or suitable physical calculations provide stronger confirmation than rescoring
    with the same model. Track sample preparation, experimental conditions, and negative outcomes. AI can prioritize
    hypotheses and accelerate parts of research without converting a computational proposal into an experimentally
    established discovery.
  text_mode: Independent measurements or suitable physical calculations provide stronger confirmation than rescoring
    with the same model. Track sample preparation, experimental conditions, and negative outcomes. AI can prioritize
    hypotheses and accelerate parts of research without converting a computational proposal into an experimentally
    established discovery.
  bridges: []
- id: biological-and-molecular-modeling.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.biological-and-molecular-modeling
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Protein, molecular, and materials models predict structures or properties from structured evidence;
    similarity leakage, uncertainty, physical validity, and experimental confirmation limit claims of discovery.
