objectives:
  - id: objective.biological-and-molecular-modeling
    version: 2-draft
    statement: Protein, molecular, and materials models predict structures or properties from structured evidence; similarity leakage, uncertainty, physical validity, and experimental confirmation limit claims of discovery.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - biological-and-molecular-modeling.base.v2
      - biological-and-molecular-modeling.transfer.v2
    prerequisites:
      - anyOf:
          - objective.equivariant-scientific-learning
      - anyOf:
          - objective.benchmark-design-and-comparison
scenes:
  - id: biological-and-molecular-modeling.s1
    title: A string of letters folds into a machine
    type: explanation
    depth: intuition
    objective_refs:
      - objective.biological-and-molecular-modeling
    markdown: |-
      A protein is a chain of amino acids, written as a string over a 20-letter alphabet: MKTAYIAKQR… That string is its **sequence**. The chain folds into a precise 3-D shape, its **structure**, and the shape decides what the protein does. Christian Anfinsen shared the 1972 Nobel Prize in Chemistry for showing that the sequence determines the fold. Predicting the fold from the letters became one of biology's great open problems, tested since 1994 by the CASP competition on structures that have been measured but not yet released.

      At CASP14 in 2020, DeepMind's **AlphaFold 2** reached a median score of 92.4 on the Global Distance Test (GDT). GDT runs from 0 to 100 and is roughly the percentage of residues placed close to their measured positions; around 90 is informally considered competitive with experiment. The system (Jumper et al., 2021) reads the sequence plus a **multiple sequence alignment**: related sequences from other species, lined up position by position. Positions that mutate together across species are often touching in the fold. It outputs 3-D coordinates for every heavy atom in the chain, plus a confidence score for each residue.

      :::story A Nobel Prize for folding and design
      The 2024 Nobel Prize in Chemistry went half to David Baker "for computational protein design" and half jointly to Demis Hassabis and John Jumper "for protein structure prediction." A free database from DeepMind and EMBL's European Bioinformatics Institute now holds predicted structures for over 200 million proteins.
      :::
    bridges: []
  - id: biological-and-molecular-modeling.s3
    title: Read the confidence before the shape
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.biological-and-molecular-modeling
    markdown: |-
      AlphaFold colors every residue by **pLDDT** (predicted local distance difference test), its own 0–100 estimate of how well that residue's local surroundings are placed.

      | pLDDT | Band | How to use it |
      | --- | --- | --- |
      | above 90 | very high | side chains usable, e.g. for a binding site |
      | 70–90 | confident | backbone usually right |
      | 50–70 | low | treat with caution |
      | below 50 | very low | often an **intrinsically disordered** region with no fixed shape |

      Say your lab downloads a prediction for a 350-residue enzyme. Residues 1–40 average pLDDT 35, the first domain (41–200) averages 93, the second (201–330) averages 88, and the tail (331–350) averages 55.

      The first domain can guide work on its active site, and the second's backbone is probably right. The start is likely disordered and the tail is shaky, so don't read meaning into either. But pLDDT is local. To ask whether the domains sit correctly *relative to each other*, check the **predicted aligned error (PAE)**, the expected error in ångströms of one residue's position when the structure is aligned on another. If PAE between the domains is about 20 Å, each domain is good but their arrangement is a guess.

      :::predict Your colleague wants to know whether changing residue 150 from glycine to tryptophan wrecks the enzyme. Is running AlphaFold on the mutant sequence a good test?
      Not a reliable one. AlphaFold often returns nearly the same structure for a one-letter change, even one that destroys the protein in the lab. It predicts one static shape; it doesn't simulate stability or motion. Test the mutant experimentally, or use tools built for stability changes.
      :::

      :::mixup "Low pLDDT means AlphaFold failed on that region."
      Often the region has no fixed shape to find: it flops around until it binds a partner. Very low pLDDT is a useful signal of disorder, not just an error bar.
      :::
    bridges: []
  - id: biological-and-molecular-modeling.alphafold3-and-design
    title: From single chains to complexes, and to design
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.biological-and-molecular-modeling
    markdown: |-
      Proteins bind drugs, DNA, RNA, metal ions, and each other. **AlphaFold 3** (Abramson et al., 2024) predicts such complexes whole. Its final stage is a **diffusion model**, like the image generators in module 22's diffusion lessons: it starts from randomly scattered atoms and removes noise step by step. Released in May 2024 through a web server only, it had its code published that November, with weights on request for non-commercial academic use.

      Like image diffusion, it can produce confident-looking structure where there is none. The authors reported this "hallucination" in disordered regions and trained against it, so check pLDDT and PAE on every chain and interface.

      **Protein design** runs the question in reverse: what sequence makes this shape? **RFdiffusion** (Watson et al., 2023), from Baker's lab, fine-tuned a structure-prediction network as a diffusion denoiser to generate new backbones, for example one shaped to grip a chosen target. A second model proposes sequences for each backbone, a structure predictor checks they fold as intended, and the survivors are made in the lab. Many still fail to fold or bind, so design papers are judged on lab measurements, not on how good the backbones look.
    bridges: []
  - id: biological-and-molecular-modeling.s2
    title: The split that flatters molecule models
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.biological-and-molecular-modeling
    markdown: |-
      For small drug-like molecules, a common task is **molecular property prediction**: from a molecule's graph, predict solubility, toxicity, or activity against a target. The graph networks from this module's first lesson are a standard choice, and MoleculeNet (Wu et al., 2018) collects benchmark tasks.

      Chemists work in series: one core ring system, called a **scaffold**, with dozens of different side groups. Variants on one scaffold usually have similar properties. Split at random and nearly every test molecule has a sibling in training, so a model scores well just by recognizing the family.

      A **scaffold split** puts every molecule sharing a scaffold on the same side, so the test asks about new chemical families. The code builds 12 scaffolds with 8 variants each. The "model" simply averages the training molecules that share a test molecule's scaffold, or falls back to the overall average.

      ```python run
      import numpy as np

      rng = np.random.default_rng(2)
      n_scaffolds, per = 12, 8
      scaffold = np.repeat(np.arange(n_scaffolds), per)           # which core each molecule has
      core_effect = rng.normal(0, 1.0, n_scaffolds)                # the core sets most of the property
      y = core_effect[scaffold] + rng.normal(0, 0.1, len(scaffold))  # small side-group effects

      def lookup_model(train, test):
          """Predict with the average of training molecules on the same core, else the overall average."""
          preds = []
          for i in test:
              same = [j for j in train if scaffold[j] == scaffold[i]]
              preds.append(y[same].mean() if same else y[train].mean())
          return np.mean(np.abs(np.array(preds) - y[test]))

      idx = rng.permutation(len(y))
      random_train, random_test = idx[:64], idx[64:]
      test_cores = rng.choice(n_scaffolds, 4, replace=False)
      scaf_test = np.where(np.isin(scaffold, test_cores))[0]
      scaf_train = np.where(~np.isin(scaffold, test_cores))[0]

      print("random split,   mean abs error:", round(lookup_model(random_train, random_test), 3))
      print("scaffold split, mean abs error:", round(lookup_model(scaf_train, scaf_test), 3))
      ```

      A model that knows nothing about chemistry scores an error of 0.093 on the random split and 0.941 on the scaffold split, ten times worse. Change the seed: the scaffold number moves with which families are held out, but stays well above the random-split one. This is the leakage problem from the lesson on benchmark design (module 28). For proteins, the fix is holding out whole families of similar sequences.
    bridges: []
  - id: biological-and-molecular-modeling.s4
    title: The lab has the last word
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.biological-and-molecular-modeling
    markdown: |-
      A startup screens 2 million purchasable molecules with a property model and a docking score, and orders the top 100 to test against a bacterial enzyme. Here is how a careful team reads the results:

      1. **Validity first.** Before ordering, they discard structures that are chemically impossible or unstable, and molecules close to known drugs for this target (those aren't discoveries).
      2. **Independent measurement.** A lab assay, not the model that chose them, measures each compound. 7 of the 100 inhibit the enzyme.
      3. **Compare with a baseline.** They also test 100 compounds picked by a chemist's simple similarity search. 2 of those hit. So the model's picks hit at 7% versus 2%.
      4. **Follow up.** They measure how strongly the 7 bind, repeat the assay, and check they aren't sticky compounds that interfere with many assays.

      Rescoring the hits with the model that found them adds nothing; it shares the model's blind spots. Step 3 turns "we found 7 hits" into a claim about the model's value.
    bridges: []
  - id: biological-and-molecular-modeling.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.biological-and-molecular-modeling
    markdown: Read pLDDT and PAE for new proteins, then judge an antibody complex, a designed binder, a toxicity benchmark, and a mutation study.
    takeaway: |-
      AlphaFold predicts a protein's shape from its sequence, with per-residue confidence you must read first; AlphaFold 3 extends this to complexes, and diffusion tools design new proteins. Judge any such model on held-out families and, in the end, on lab measurements.
  - id: biological-and-molecular-modeling.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.biological-and-molecular-modeling
    markdown: |-
      A predicted structure, property, or molecule is a research result with a defined scope. Check novelty, uncertainty, physical validity, and independent experimental support.
