schema_version: 0.2-draft
lesson:
  id: biological-and-molecular-modeling
  version: 0.1.0-draft
  title: Evaluate scientific predictions beyond familiar benchmarks
  state: draft
  summary: Protein, molecular, and materials models predict structures or properties from structured evidence; similarity
    leakage, uncertainty, physical validity, and experimental confirmation limit claims of discovery.
  slot: M34.4
  category: learning
  minutes: 12
  sources:
  - title: AlphaFold2
    url: https://www.nature.com/articles/s41586-021-03819-2
  - title: MoleculeNet
    url: https://arxiv.org/abs/1703.00564
  - title: Neural Message Passing for Quantum Chemistry
    url: https://arxiv.org/abs/1704.01212
objectives:
- id: objective.biological-and-molecular-modeling
  version: 1-draft
  statement: Protein, molecular, and materials models predict structures or properties from structured evidence;
    similarity leakage, uncertainty, physical validity, and experimental confirmation limit claims of discovery.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - biological-and-molecular-modeling.base
  - biological-and-molecular-modeling.transfer
  prerequisites:
