schema_version: 0.2-draft
lesson:
  id: data-cleaning
  version: 0.3.0-draft
  title: Clean data without erasing the problem
  state: draft
  summary: 'Become a data detective: find a broken unit, a missing value, and a repeated example before they
    fool a model.'
  slot: M03.4
  category: learning
  sources:
  - title: scikit-learn — inconsistent preprocessing and data leakage
    url: https://scikit-learn.org/stable/common_pitfalls.html
  - title: Gebru et al. — Datasheets for Datasets
    url: https://arxiv.org/abs/1803.09010
  archetype: mechanism
objectives:
- id: objective.data-cleaning
  version: 2-draft
  statement: Choose and document a cleaning rule that preserves the task, respects training boundaries, and
    distinguishes errors from unusual valid cases.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - data-cleaning.base.v2
  - data-cleaning.transfer.v2
  prerequisites:
  - anyOf:
    - objective.data
  - anyOf:
    - objective.statistics-evidence
scenes:
- id: data-cleaning.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.data-cleaning
  title: The surprising value might be the important one
  markdown: A school tracks bicycle trips. Most distances are between one and ten kilometers, but one is fifty.
    Is that a typo or a long weekend ride? **Data cleaning** means investigating and correcting problems in
    recorded examples. Deleting every unusual value would make the table look tidy while possibly deleting
    the trips the system most needs to handle. Start with the measurement’s meaning, units, and collection
    process. A strange number is a question to investigate, not automatically a mistake.
  text_mode: A school tracks bicycle trips. Most distances are between one and ten kilometers, but one is fifty.
    Is that a typo or a long weekend ride? **Data cleaning** means investigating and correcting problems in
    recorded examples. Deleting every unusual value would make the table look tidy while possibly deleting
    the trips the system most needs to handle. Start with the measurement’s meaning, units, and collection
    process. A strange number is a question to investigate, not automatically a mistake.
  bridges: []
- id: data-cleaning.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.data-cleaning
  title: Read a tiny table as evidence
  markdown: Suppose distances are recorded as 2 km, 3000 m, blank, and −4 km. Converting 3000 meters to 3 kilometers
    is a unit correction with a clear rule. A blank is a missing measurement; it is not a zero-distance trip.
    A negative distance is inconsistent with this field’s definition, so trace it back to the source. Record
    the original and corrected values. This makes the transformation inspectable instead of silently changing
    history.
  text_mode: Suppose distances are recorded as 2 km, 3000 m, blank, and −4 km. Converting 3000 meters to 3
    kilometers is a unit correction with a clear rule. A blank is a missing measurement; it is not a zero-distance
    trip. A negative distance is inconsistent with this field’s definition, so trace it back to the source.
    Record the original and corrected values. This makes the transformation inspectable instead of silently
    changing history.
  bridges:
  - arithmetic
- id: data-cleaning.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data-cleaning
  title: Missing values need an explicit policy
  markdown: '**Imputation** fills a missing entry using a chosen rule. If training distances are 2, 4, and
    6, their mean is 4, so a mean-imputation rule inserts 4. That does not mean the missing trip actually measured
    four kilometers. An extra “was missing” indicator can preserve the distinction. Some tasks instead reject
    incomplete records or use a method that handles missingness directly. Decide using the task and validate
    the effect on representative examples.'
  text_mode: '**Imputation** fills a missing entry using a chosen rule. If training distances are 2, 4, and
    6, their mean is 4, so a mean-imputation rule inserts 4. That does not mean the missing trip actually measured
    four kilometers. An extra “was missing” indicator can preserve the distinction. Some tasks instead reject
    incomplete records or use a method that handles missingness directly. Decide using the task and validate
    the effect on representative examples.'
  bridges: []
- id: data-cleaning.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data-cleaning
  title: Fit the cleaning rule on the right side
  markdown: Imagine a held-out trip of 100 kilometers. Including it when computing the training mean changes
    the cleaning rule to (2+4+6+100)/4=28. Evaluation information has now influenced training. Choose the partitions
    first; fit learned cleaning settings on training examples; apply those saved settings to validation and
    test examples. The rule may be a mean, a scaling range, or a vocabulary. The principle is the same even
    when no target label was directly copied.
  text_mode: Imagine a held-out trip of 100 kilometers. Including it when computing the training mean changes
    the cleaning rule to (2+4+6+100)/4=28. Evaluation information has now influenced training. Choose the partitions
    first; fit learned cleaning settings on training examples; apply those saved settings to validation and
    test examples. The rule may be a mean, a scaling range, or a vocabulary. The principle is the same even
    when no target label was directly copied.
  bridges: []
- id: data-cleaning.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.data-cleaning
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Check the meaning before fixing the number. Learn cleaning settings from training data, and carry
    the same rules into evaluation and use.
- id: data-cleaning.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.data-cleaning
  markdown: Missingness, outliers, duplicates, class imbalance, and preprocessing choices affect both the training
    signal and what evaluation can legitimately conclude.
  text_mode: Missingness, outliers, duplicates, class imbalance, and preprocessing choices affect both the
    training signal and what evaluation can legitimately conclude.
- id: data-cleaning.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data-cleaning
  title: Duplicates have more than one meaning
  markdown: A duplicated row may be an accidental second copy of one trip. But two genuinely separate trips
    can have the same distance and time. Identify the event or source before removing it. Near-duplicate photos
    and copied passages can also cross an evaluation boundary, making an apparently new example familiar. Keep
    a duplicate-handling record and check which groups lose examples. Cleaning that removes inconvenient error
    cases can inflate a score without improving a real system.
  text_mode: A duplicated row may be an accidental second copy of one trip. But two genuinely separate trips
    can have the same distance and time. Identify the event or source before removing it. Near-duplicate photos
    and copied passages can also cross an evaluation boundary, making an apparently new example familiar. Keep
    a duplicate-handling record and check which groups lose examples. Cleaning that removes inconvenient error
    cases can inflate a score without improving a real system.
  bridges: []
- id: data-cleaning.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data-cleaning
  title: Keep a small cleaning diary
  markdown: For every rule, write what triggered it, why it matches the task, which examples it changed, and
    how you checked the result. Compare a simple model with and without the rule on validation data. Inspect
    a few changed records by hand. Store the rule with the model so future inputs receive compatible treatment.
    The useful memory cue is “meaning, rule, record, recheck.” A reproducible transformation is easier to debug
    than a spreadsheet of unexplained edits.
  text_mode: For every rule, write what triggered it, why it matches the task, which examples it changed, and
    how you checked the result. Compare a simple model with and without the rule on validation data. Inspect
    a few changed records by hand. Store the rule with the model so future inputs receive compatible treatment.
    The useful memory cue is “meaning, rule, record, recheck.” A reproducible transformation is easier to debug
    than a spreadsheet of unexplained edits.
  bridges: []
- id: data-cleaning.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.data-cleaning
  title: Choose the fair mean
  markdown: Training distances are 2, 4, and 6 km. A test trip is 100 km. Which value should a training-fitted
    mean-imputer use for a missing distance?
  text_mode: Training distances are 2, 4, and 6 km. A test trip is 100 km. Which value should a training-fitted
    mean-imputer use for a missing distance?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: 4 km
    - id: b
      text: 28 km
    - id: c
      text: 0 km
    answer: a
    reveal_markdown: The mean of training observations is (2+4+6)/3=4. Test measurements must not fit the training
      transformation.
    hint: Trace the example using the rule from the preceding pages.
    id: data-cleaning.practice.v2.7
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - data-cleaning.s1
    - data-cleaning.s2
    - data-cleaning.s3
    - data-cleaning.s4
    - data-cleaning.s5
    - data-cleaning.s6
    - data-cleaning.s7
    - data-cleaning.check
    gate_refs:
    - gate.core
  scene_aliases:
    data-cleaning.recap: data-cleaning.check
assessment_families:
- id: data-cleaning.base
  objective_ref: objective.data-cleaning
  task: base
  response_type: single_choice
  points: 1
  hint: 'Inspect unusual and repeated records: trace the inputs, operation, and result before choosing.'
  remediation_scene: data-cleaning.s2
  variants:
  - id: data-cleaning.base.1
    prompt: '990 negatives and 10 positives: how accurate is always predicting negative?'
    options:
    - id: c
      text: 100%
    - id: a
      text: 99%
    - id: b
      text: 1%
    answer: a
    feedback: It gets 990 of 1000 cases correct while missing every positive.
    retired: true
  - id: data-cleaning.base.2
    prompt: Should every outlier automatically be deleted?
    options:
    - id: a
      text: No; it may be a genuine rare event
    - id: b
      text: Yes; unusual means incorrect
    - id: c
      text: Only if a model dislikes it
    answer: a
    feedback: Outlier treatment depends on the data-generating process and task.
    retired: true
- id: data-cleaning.transfer
  objective_ref: objective.data-cleaning
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Fit preprocessing inside the training boundary: trace the inputs, operation, and result before choosing.'
  remediation_scene: data-cleaning.s4
  variants:
  - id: data-cleaning.transfer.1
    prompt: A feature scaler uses test-set statistics. What concern arises?
    options:
    - id: a
      text: Held-out information influenced preprocessing
    - id: b
      text: The feature automatically becomes causal
    - id: c
      text: No concern because scaling has no parameters
    answer: a
    feedback: Fitted preprocessing belongs inside the training boundary.
    retired: true
  - id: data-cleaning.transfer.2
    prompt: Two records belong to the same patient but differ in formatting. Can exact deduplication alone
      prevent entity leakage?
    options:
    - id: b
      text: Yes; different bytes guarantee independence
    - id: c
      text: Yes; formatting removes all shared information
    - id: a
      text: No; identity-level grouping may be needed
    answer: a
    feedback: The unit of independence can be larger than a row or exact record.
    retired: true
- id: data-cleaning.base.v2
  objective_ref: objective.data-cleaning
  task: base
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: data-cleaning.s3
  variants:
  - prompt: A distance field contains 3000 meters while other rows use kilometers. What is the justified correction?
    answer: a
    options:
    - id: b
      text: Delete it because it is larger than the other numbers
    - id: a
      text: Convert it to 3 kilometers and record the conversion
    - id: c
      text: Replace it with the most common distance
    feedback: The difference is in units; conversion preserves the measured quantity.
    id: data-cleaning.base.v2.1
  - prompt: A sensor reading is blank. Why is replacing it with zero risky?
    answer: a
    options:
    - id: a
      text: Zero may be a real measurement with a different meaning
    - id: b
      text: Zero cannot be stored in a numerical model
    - id: c
      text: Replacing blanks with zero preserves the original missingness information
    feedback: Missingness and a measured zero are distinct states.
    id: data-cleaning.base.v2.2
  - prompt: Two records have identical features but different trip IDs and collection times. What should you
      investigate before deletion?
    answer: a
    options:
    - id: a
      text: Whether they represent separate real events
    - id: c
      text: Whether deleting one increases the training score
    - id: b
      text: Whether their feature values are numerically equal
    feedback: Identical values can describe distinct events; provenance determines the duplicate claim.
    id: data-cleaning.base.v2.3
  - prompt: A valid rare event is far from the average. What supports keeping it?
    answer: a
    options:
    - id: b
      text: It makes the dataset appear more uniform
    - id: c
      text: It lowers the number of recorded exceptions
    - id: a
      text: It belongs to the intended deployment task
    feedback: Cleaning should preserve valid cases relevant to use, including difficult ones.
    id: data-cleaning.base.v2.4
- id: data-cleaning.transfer.v2
  objective_ref: objective.data-cleaning
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: data-cleaning.s3
  variants:
  - prompt: A scaler uses both training and test data to choose its range. What should be corrected?
    answer: a
    options:
    - id: a
      text: Fit its settings on training data and apply them unchanged to the test
    - id: c
      text: Fit a separate scaler on the test to match its local range
    - id: b
      text: Choose a different model but keep the fitted scaler
    feedback: Learned preprocessing can leak evaluation information even without copying labels.
    id: data-cleaning.transfer.v2.1
  - prompt: A missing-value rule helps average validation accuracy but harms one important group. What is the
      next step?
    answer: a
    options:
    - id: c
      text: Delete the group from the validation report
    - id: a
      text: Inspect group errors and the missingness process before adoption
    - id: b
      text: Adopt the rule based only on the average improvement
    feedback: A global average can hide a consequential change for a group.
    id: data-cleaning.transfer.v2.2
  - prompt: A cleaned table cannot be traced back to its source values. Which addition most improves reproducibility?
    answer: a
    options:
    - id: b
      text: A summary of final column averages without transformation versions
    - id: c
      text: A larger prediction model on the same table
    - id: a
      text: A versioned transformation log and original records
    feedback: A transformation record explains what changed and supports rechecking.
    id: data-cleaning.transfer.v2.3
  - prompt: A new input arrives after training. Which cleaning behavior preserves the trained contract?
    answer: a
    options:
    - id: a
      text: Apply the saved training-fitted transformation
    - id: b
      text: Recompute the entire training mean using that input
    - id: c
      text: Skip transformations because it is not a training example
    feedback: Evaluation and use must follow compatible fitted preprocessing rules.
    id: data-cleaning.transfer.v2.4
