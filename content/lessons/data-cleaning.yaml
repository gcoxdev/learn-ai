schema_version: 0.2-draft
lesson:
  id: data-cleaning
  version: 0.4.0-draft
  title: Clean data without erasing the problem
  state: draft
  summary: 'Become a data detective: find a broken unit, a missing value, and a repeated example before they fool a model, without deleting the trip that mattered most.'
  slot: M03.4
  category: learning
  sources:
    - title: scikit-learn — inconsistent preprocessing and data leakage
      url: https://scikit-learn.org/stable/common_pitfalls.html
    - title: Gebru et al. — Datasheets for Datasets
      url: https://arxiv.org/abs/1803.09010
    - title: "Do We Train on Test Data? Purging CIFAR of Near-Duplicates (Barz & Denzler, 2020)"
      url: https://arxiv.org/abs/1902.00423
  archetype: mechanism
objectives:
  - id: objective.data-cleaning
    version: 3-draft
    statement: Choose and document a cleaning rule that preserves the task, respects training boundaries, and distinguishes errors from unusual valid cases.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - data-cleaning.base.v3
      - data-cleaning.transfer.v3
    prerequisites:
      - anyOf:
          - objective.data
      - anyOf:
          - objective.statistics-evidence
scenes:
  - id: data-cleaning.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.data-cleaning
    title: Typo or adventure?
    markdown: |-
      A school collects students' bike trips to predict how long rides take. Most trips are between 1 and 10 km. One says 50 km. Is that a slipped finger, or a student who rode to the coast and back on a Saturday?

      Finding and fixing mistakes in recorded data is called **data cleaning**, and its first rule is that *strange* and *wrong* are different things. If the 50 km ride is real, it's exactly the kind of trip the model will struggle with, and deleting it hides that. So ask before you fix: What does this column measure? In what unit? Who typed it?

      :::mixup "Cleaning data means removing the outliers."
      An **outlier** is a value far from the rest. Some outliers are errors; others are the rare, real cases that matter most. Cleaning means finding out which is which. A table with every unusual row deleted looks tidy and teaches the model about a world with no surprises.
      :::
  - id: data-cleaning.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.data-cleaning
    title: Read five messy rows
    markdown: |-
      Here are five rows from the distance column, and what a careful detective does with each:

      | Recorded | Probably | What to do |
      | --- | --- | --- |
      | 2 km | Fine | Keep |
      | 3000 | Meters, not km | Convert to 3 km, and note the change |
      | (blank) | Not measured | Mark as missing; never type 0 |
      | −4 km | Impossible for a distance | Trace it to the source form |
      | 50 km | Suspicious but possible | Ask the student or check the ride app |

      Each fix follows a rule you could explain to someone else, and every change goes in a log next to the original value. If the −4 turns out to be a stray minus sign on every trip one student logged, the log makes that pattern easy to spot.
    bridges:
      - arithmetic
  - id: data-cleaning.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.data-cleaning
    title: Fill blanks on purpose
    markdown: |-
      Many models can't accept a blank, so you need a policy. Filling a missing entry with a value chosen by a rule is called **imputation**. The simplest rule is the mean: if the training distances are 2, 4, and 6 km, their mean is (2 + 4 + 6) ÷ 3 = 4, so every blank becomes 4.

      That 4 is a stand-in, not a measurement. So add a second column that records the truth about it:

      | Trip | Distance (km) | was_missing |
      | --- | ---: | ---: |
      | A | 2 | 0 |
      | B | 4 | 1 |
      | C | 6 | 0 |

      :::predict Why bother with the was_missing column?
      Because blanks often happen for a reason. Suppose the ride app loses GPS in a tunnel that only long routes pass through, so blanks are mostly long trips. Filling them with 4 km makes them look short, but the was_missing column lets the model learn that "missing" tends to mean "long." Without it, that clue is erased.
      :::

      Other policies include dropping incomplete rows or using a model that handles blanks directly. Pick one on purpose, and compare the options on validation data.
  - id: data-cleaning.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.data-cleaning
    title: Learn the rule from training data only
    markdown: |-
      The mean is something the imputation rule *learns* from data. Suppose the test set holds a trip on a new 100 km charity route. Compute the mean over all trips, test included, and the fill value becomes (2 + 4 + 6 + 100) ÷ 4 = 28 instead of 4. The test data has quietly shaped the training.

      Run this version, where the test holds two long trips and one blank:

      ```python run
      train = [2, 4, 6]            # training distances in km
      test = [100, 90, None]       # test trips on a new long route; one distance is blank
      true_missing = 95            # what the blank trip really measured

      def mean(values):
          known = [v for v in values if v is not None]
          return sum(known) / len(known)

      honest_fill = mean(train)            # fitted on training data only
      leaky_fill = mean(train + test)      # fitted on training AND test data

      for name, fill in [("fit on training only", honest_fill), ("fit on all data", leaky_fill)]:
          error = abs(fill - true_missing)
          print(f"{name:21} fills the blank with {fill:5.1f} km   error {error:5.1f} km")
      ```

      The leaky rule fills the blank with 40.4 km and misses by 54.6 km; the honest rule fills 4.0 km and misses by 91.0 km. The leaky version *looks* better only because it peeked at the test trips and "knew" they were long. Real future trips give no such hint, so the honest 91 km is the true picture, and it reveals something useful: the training data has no long rides. Try test trips of 5 and 7 with a true value of 6, and watch the two fills land close together.

      The cure is an order of operations: split first, fit each cleaning rule on training data, save its settings, then apply those saved settings to validation, test, and every future input. Libraries build this in; scikit-learn's imputers have separate `fit` and `transform` steps for exactly this reason.
  - id: data-cleaning.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.data-cleaning
    title: Duplicates have more than one meaning
    markdown: |-
      Two rows read "2.0 km, 9 min." Delete one? A student who rides the same 2 km to school every day *should* produce identical rows. Check the trip ID and timestamp before calling anything a copy.

      The dangerous duplicates are the ones that cross the line between training and test. A near-identical photo in each set turns a test question into one the model has already seen. It happens even in famous benchmarks: a 2020 study by Barz and Denzler found near-duplicates of training images for about 3% of the CIFAR-10 test images and about 10% of the CIFAR-100 test images. The next lesson shows how to split data so related examples stay together.
  - id: data-cleaning.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.data-cleaning
    title: A cleaning diary in action
    markdown: |-
      Maya, who runs the project, proposes a rule: "Delete every trip over 30 km as a typo." First, she tests it and writes a diary entry.

      | Step | What she did | What she found |
      | --- | --- | --- |
      | Trigger | Counted trips over 30 km | 4 of 600 |
      | Check | Compared each with the ride app's map | 3 were real weekend rides; 1 was "8" typed as "80" |
      | Decision | Fixed the typo; kept the 3 real rides | Rule rejected |
      | Recheck | Retrained with the 3 rides kept | Errors on long validation rides fell; the average barely moved |

      The blanket rule would have deleted three real rides to hide one typo. The diary took ten minutes, and next term, when someone asks why the dataset has a 50 km trip in it, the answer is written down.
  - id: data-cleaning.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.data-cleaning
    title: Choose the fair mean
    markdown: |-
      Training distances are 2, 4, and 6 km. A test trip is 100 km. Which value should a training-fitted mean-imputer use for a missing distance?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: 4 km
        - id: b
          text: 28 km
        - id: c
          text: 0 km
      answer: a
      reveal_markdown: |-
        The mean of training observations is (2+4+6)/3=4. Test measurements must not fit the training transformation.
      hint: Which rows was the imputer allowed to learn from?
      id: data-cleaning.practice.v2.7
  - id: data-cleaning.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.data-cleaning
    markdown: Four quick calculations of fill values, then a heart-rate strap, a mansion, a scaler, and a café's orders to clean without erasing the truth.
    takeaway: |-
      Ask what a strange value means before you change it, and log every fix. Learn cleaning rules from the training data only, then apply the same saved rules everywhere else.
  - id: data-cleaning.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.data-cleaning
    markdown: |-
      Missingness, outliers, duplicates, class imbalance, and preprocessing choices affect both the training signal and what evaluation can legitimately conclude.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - data-cleaning.s1
        - data-cleaning.s2
        - data-cleaning.s3
        - data-cleaning.s4
        - data-cleaning.s5
        - data-cleaning.s6
        - data-cleaning.s7
        - data-cleaning.check
      gate_refs:
        - gate.core
  scene_aliases:
    data-cleaning.recap: data-cleaning.check
assessment_families:
  - id: data-cleaning.base
    objective_ref: objective.data-cleaning
    task: base
    response_type: single_choice
    points: 1
    hint: 'Inspect unusual and repeated records: trace the inputs, operation, and result before choosing.'
    remediation_scene: data-cleaning.s2
    variants:
      - id: data-cleaning.base.1
        prompt: '990 negatives and 10 positives: how accurate is always predicting negative?'
        options:
          - id: c
            text: 100%
          - id: a
            text: 99%
          - id: b
            text: 1%
        answer: a
        feedback: It gets 990 of 1000 cases correct while missing every positive.
        retired: true
      - id: data-cleaning.base.2
        prompt: Should every outlier automatically be deleted?
        options:
          - id: a
            text: No; it may be a genuine rare event
          - id: b
            text: Yes; unusual means incorrect
          - id: c
            text: Only if a model dislikes it
        answer: a
        feedback: Outlier treatment depends on the data-generating process and task.
        retired: true
  - id: data-cleaning.transfer
    objective_ref: objective.data-cleaning
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Fit preprocessing inside the training boundary: trace the inputs, operation, and result before choosing.'
    remediation_scene: data-cleaning.s4
    variants:
      - id: data-cleaning.transfer.1
        prompt: A feature scaler uses test-set statistics. What concern arises?
        options:
          - id: a
            text: Held-out information influenced preprocessing
          - id: b
            text: The feature automatically becomes causal
          - id: c
            text: No concern because scaling has no parameters
        answer: a
        feedback: Fitted preprocessing belongs inside the training boundary.
        retired: true
      - id: data-cleaning.transfer.2
        prompt: Two records belong to the same patient but differ in formatting. Can exact deduplication alone prevent entity leakage?
        options:
          - id: b
            text: Yes; different bytes guarantee independence
          - id: c
            text: Yes; formatting removes all shared information
          - id: a
            text: No; identity-level grouping may be needed
        answer: a
        feedback: The unit of independence can be larger than a row or exact record.
        retired: true
  - id: data-cleaning.base.v2
    objective_ref: objective.data-cleaning
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: data-cleaning.s3
    variants:
      - prompt: A distance field contains 3000 meters while other rows use kilometers. What is the justified correction?
        answer: a
        options:
          - id: b
            text: Delete it because it is larger than the other numbers
          - id: a
            text: Convert it to 3 kilometers and record the conversion
          - id: c
            text: Replace it with the most common distance
        feedback: The difference is in units; conversion preserves the measured quantity.
        id: data-cleaning.base.v2.1
        retired: true
      - prompt: A sensor reading is blank. Why is replacing it with zero risky?
        answer: a
        options:
          - id: a
            text: Zero may be a real measurement with a different meaning
          - id: b
            text: Zero cannot be stored in a numerical model
          - id: c
            text: Replacing blanks with zero preserves the original missingness information
        feedback: Missingness and a measured zero are distinct states.
        id: data-cleaning.base.v2.2
        retired: true
      - prompt: Two records have identical features but different trip IDs and collection times. What should you investigate before deletion?
        answer: a
        options:
          - id: a
            text: Whether they represent separate real events
          - id: c
            text: Whether deleting one increases the training score
          - id: b
            text: Whether their feature values are numerically equal
        feedback: Identical values can describe distinct events; provenance determines the duplicate claim.
        id: data-cleaning.base.v2.3
        retired: true
      - prompt: A valid rare event is far from the average. What supports keeping it?
        answer: a
        options:
          - id: b
            text: It makes the dataset appear more uniform
          - id: c
            text: It lowers the number of recorded exceptions
          - id: a
            text: It belongs to the intended deployment task
        feedback: Cleaning should preserve valid cases relevant to use, including difficult ones.
        id: data-cleaning.base.v2.4
        retired: true
  - id: data-cleaning.transfer.v2
    objective_ref: objective.data-cleaning
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: data-cleaning.s3
    variants:
      - prompt: A scaler uses both training and test data to choose its range. What should be corrected?
        answer: a
        options:
          - id: a
            text: Fit its settings on training data and apply them unchanged to the test
          - id: c
            text: Fit a separate scaler on the test to match its local range
          - id: b
            text: Choose a different model but keep the fitted scaler
        feedback: Learned preprocessing can leak evaluation information even without copying labels.
        id: data-cleaning.transfer.v2.1
        retired: true
      - prompt: A missing-value rule helps average validation accuracy but harms one important group. What is the next step?
        answer: a
        options:
          - id: c
            text: Delete the group from the validation report
          - id: a
            text: Inspect group errors and the missingness process before adoption
          - id: b
            text: Adopt the rule based only on the average improvement
        feedback: A global average can hide a consequential change for a group.
        id: data-cleaning.transfer.v2.2
        retired: true
      - prompt: A cleaned table cannot be traced back to its source values. Which addition most improves reproducibility?
        answer: a
        options:
          - id: b
            text: A summary of final column averages without transformation versions
          - id: c
            text: A larger prediction model on the same table
          - id: a
            text: A versioned transformation log and original records
        feedback: A transformation record explains what changed and supports rechecking.
        id: data-cleaning.transfer.v2.3
        retired: true
      - prompt: A new input arrives after training. Which cleaning behavior preserves the trained contract?
        answer: a
        options:
          - id: a
            text: Apply the saved training-fitted transformation
          - id: b
            text: Recompute the entire training mean using that input
          - id: c
            text: Skip transformations because it is not a training example
        feedback: Evaluation and use must follow compatible fitted preprocessing rules.
        id: data-cleaning.transfer.v2.4
        retired: true
  - id: data-cleaning.base.v3
    objective_ref: objective.data-cleaning
    task: base
    response_type: numeric
    points: 1
    hint: Use only the values the rule is allowed to learn from. Leave blanks and test values out of a training mean, and convert units before you average.
    remediation_scene: data-cleaning.s4
    absolute_tolerance: 0.01
    variants:
      - id: data-cleaning.base.v3.1
        prompt: Training distances are 3, 5, 7, and 9 km. A test trip is 40 km. A mean imputer is fitted correctly. What value (in km) does it use to fill a missing distance?
        answer: 6
        feedback: Fit on training data only, (3 + 5 + 7 + 9) ÷ 4 = 24 ÷ 4 = 6. Including the 40 km test trip would give 12.8, letting the test shape the rule.
      - id: data-cleaning.base.v3.2
        prompt: Training distances are 2, 4, 6, and 8 km. By mistake, a 30 km test trip is included when the mean imputer is fitted. What fill value (in km) does the leaky imputer use?
        answer: 10
        feedback: (2 + 4 + 6 + 8 + 30) ÷ 5 = 50 ÷ 5 = 10. The correct, training-only value would be 20 ÷ 4 = 5; the test trip doubled it.
      - id: data-cleaning.base.v3.3
        prompt: Training distances are 1, 2, 3, (blank), and 6 km. What value (in km) does a training-fitted mean imputer use for the blank?
        answer: 3
        feedback: Average only the known values, (1 + 2 + 3 + 6) ÷ 4 = 12 ÷ 4 = 3. Counting the blank as a zero and dividing by 5 would give 2.4, which treats "unknown" as "no distance."
      - id: data-cleaning.base.v3.4
        prompt: A kilometer column holds the training values 2 km, 1500 (entered in meters), and 4 km. After converting the unit, what is the training mean in km?
        answer: 2.5
        feedback: 1500 m is 1.5 km, so the mean is (2 + 1.5 + 4) ÷ 3 = 7.5 ÷ 3 = 2.5. Averaging the raw numbers would give about 502, a value that makes no sense for a bike trip.
  - id: data-cleaning.transfer.v3
    objective_ref: objective.data-cleaning
    task: transfer
    response_type: single_choice
    points: 1
    hint: Before changing a value, ask what it means and where it came from. After choosing a fix, ask which data the fix learned from.
    remediation_scene: data-cleaning.s2
    variants:
      - id: data-cleaning.transfer.v3.1
        prompt: A fitness tracker's heart-rate log has blanks whenever the chest strap slipped during a run. The team fills every blank with 0. What will the model learn?
        options:
          - id: c
            text: Nothing unusual, since zeros are ignored during training
          - id: a
            text: That a heart rate of zero happens in the middle of runs
          - id: b
            text: That the strap slipped, which is a useful signal to have
        answer: a
        feedback: A zero is read as a real measurement, so the model learns an impossible heart rate. To keep the "strap slipped" signal, mark the value as missing and add a was_missing column; a zero hides it instead of recording it.
      - id: data-cleaning.transfer.v3.2
        prompt: In a town where most houses sell for about €300,000, one record shows €12,000,000. What should happen before the next training run?
        options:
          - id: b
            text: Delete it, because a value so far from the average will distort the model
          - id: c
            text: Keep it unchecked, because removing any real value biases the data
          - id: a
            text: Check the sale record, since it could be a real mansion or an extra zero
        answer: a
        feedback: The value is strange, not necessarily wrong. Checking the source tells you whether to fix a typo or keep a rare real sale. Deleting it on sight may remove the one case that matters, and keeping it unchecked may leave a typo in place.
      - id: data-cleaning.transfer.v3.3
        prompt: A scaler that squeezes every feature into the range 0 to 1 found each feature's minimum and maximum using the whole dataset, test set included. What is the right fix?
        options:
          - id: a
            text: Find the minimum and maximum on training data, then reuse them on the test set
          - id: c
            text: Fit a second scaler on the test set so that it matches the test data's range
          - id: b
            text: Keep the scaler, since it never looked at the labels in the test set
        answer: a
        feedback: The minimum and maximum are learned settings, so they must come from training data and be reused unchanged. A separate test scaler uses test information in a new way, and leakage can happen through features even when labels stay hidden.
      - id: data-cleaning.transfer.v3.4
        prompt: A café's order data contains two identical rows, "oat latte, large, 8:02 a.m." What should you check before removing one?
        options:
          - id: b
            text: Whether deleting one of them raises the model's validation score
          - id: a
            text: Whether the rows have different order IDs, meaning two real customers
          - id: c
            text: Whether every column in both rows holds exactly the same value
        answer: a
        feedback: Two customers can order the same drink in the same minute, so identical values don't prove a copy; the order ID does. Choosing by validation score lets convenience decide what's true, and matching columns is what made the rows look like copies in the first place.
