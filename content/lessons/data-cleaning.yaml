schema_version: 0.2-draft
lesson:
  id: data-cleaning
  version: 0.1.0-draft
  title: Clean data without erasing the problem
  state: draft
  summary: Missingness, outliers, duplicates, class imbalance, and preprocessing choices affect both the training
    signal and what evaluation can legitimately conclude.
  slot: M03.4
  category: learning
  minutes: 12
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.data-cleaning
  version: 1-draft
  statement: Missingness, outliers, duplicates, class imbalance, and preprocessing choices affect both the training
    signal and what evaluation can legitimately conclude.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - data-cleaning.base
  - data-cleaning.transfer
  prerequisites:
  - anyOf:
    - objective.data
  - anyOf:
    - objective.statistics-evidence
scenes:
- id: data-cleaning.s1
  title: Missing is not always random
  type: explanation
  depth: intuition
  objective_refs:
  - objective.data-cleaning
  markdown: A missing income value could mean refusal, collection failure, or an inapplicable question. These mechanisms
    have different implications. A simple imputation fills missing entries, often using a statistic fitted on training
    data. An indicator can preserve the fact that the value was missing, but can also encode a shortcut.
  text_mode: A missing income value could mean refusal, collection failure, or an inapplicable question. These mechanisms
    have different implications. A simple imputation fills missing entries, often using a statistic fitted on training
    data. An indicator can preserve the fact that the value was missing, but can also encode a shortcut.
  bridges: []
- id: data-cleaning.s2
  title: Inspect unusual and repeated records
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data-cleaning
  markdown: An outlier may be a typo or a real rare case. Removing all unusual values can erase the events the model
    needs to detect. Duplicates may overweight a person or leak a case across splits. Define similarity at the relevant
    entity level, not just exact byte equality.
  text_mode: An outlier may be a typo or a real rare case. Removing all unusual values can erase the events the
    model needs to detect. Duplicates may overweight a person or leak a case across splits. Define similarity at
    the relevant entity level, not just exact byte equality.
  bridges: []
- id: data-cleaning.s3
  title: Work through imbalance
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data-cleaning
  markdown: In a dataset with 990 negatives and 10 positives, always predicting negative gives 99% accuracy and
    detects none of the positives. Class weights, sampling, and threshold changes address different parts of this
    problem. Each should be evaluated against the intended error costs and real deployment prevalence.
  text_mode: In a dataset with 990 negatives and 10 positives, always predicting negative gives 99% accuracy and
    detects none of the positives. Class weights, sampling, and threshold changes address different parts of this
    problem. Each should be evaluated against the intended error costs and real deployment prevalence.
  bridges: []
- id: data-cleaning.s4
  title: Fit preprocessing inside the training boundary
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data-cleaning
  markdown: If a scaler uses the full dataset’s mean before validation, held-out information has influenced training
    preparation. Fit transforms on the training partition and apply the learned transform elsewhere. Keep a reproducible
    pipeline, inspect subgroup effects, and compare with a transparent baseline before accepting a cleaning rule.
  text_mode: If a scaler uses the full dataset’s mean before validation, held-out information has influenced training
    preparation. Fit transforms on the training partition and apply the learned transform elsewhere. Keep a reproducible
    pipeline, inspect subgroup effects, and compare with a transparent baseline before accepting a cleaning rule.
  bridges: []
- id: data-cleaning.check
