assessment_families:
- id: data-cleaning.base
  objective_ref: objective.data-cleaning
  task: base
  response_type: single_choice
  points: 1
  hint: 'Inspect unusual and repeated records: trace the inputs, operation, and result before choosing.'
  remediation_scene: data-cleaning.s2
  variants:
  - id: data-cleaning.base.1
    prompt: '990 negatives and 10 positives: how accurate is always predicting negative?'
    options:
    - id: c
      text: 100%
    - id: a
      text: 99%
    - id: b
      text: 1%
    answer: a
    feedback: It gets 990 of 1000 cases correct while missing every positive.
  - id: data-cleaning.base.2
    prompt: Should every outlier automatically be deleted?
    options:
    - id: a
      text: No; it may be a genuine rare event
    - id: b
      text: Yes; unusual means incorrect
    - id: c
      text: Only if a model dislikes it
    answer: a
    feedback: Outlier treatment depends on the data-generating process and task.
- id: data-cleaning.transfer
  objective_ref: objective.data-cleaning
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Fit preprocessing inside the training boundary: trace the inputs, operation, and result before choosing.'
  remediation_scene: data-cleaning.s4
  variants:
  - id: data-cleaning.transfer.1
    prompt: A feature scaler uses test-set statistics. What concern arises?
    options:
    - id: a
      text: Held-out information influenced preprocessing
    - id: b
      text: The feature automatically becomes causal
    - id: c
      text: No concern because scaling has no parameters
    answer: a
    feedback: Fitted preprocessing belongs inside the training boundary.
  - id: data-cleaning.transfer.2
    prompt: Two records belong to the same patient but differ in formatting. Can exact deduplication alone prevent
      entity leakage?
    options:
    - id: b
      text: Yes; different bytes guarantee independence
    - id: c
      text: Yes; formatting removes all shared information
    - id: a
      text: No; identity-level grouping may be needed
    answer: a
    feedback: The unit of independence can be larger than a row or exact record.
