assessment_families:
- id: flows-and-energy-models.base
  objective_ref: objective.flows-and-energy-models
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace a one-dimensional stretch: trace the inputs, operation, and result before choosing.'
  remediation_scene: flows-and-energy-models.s2
  variants:
  - id: flows-and-energy-models.base.1
    prompt: For x = 2z, what happens to density under the one-dimensional change of variables?
    options:
    - id: a
      text: It is evaluated at x/2 and divided by two
    - id: b
      text: It always doubles
    - id: c
      text: It remains identical at every x
    answer: a
    feedback: Stretching intervals reduces density height while preserving mass.
  - id: flows-and-energy-models.base.2
    prompt: What does a Jacobian determinant account for?
    options:
    - id: b
      text: Only the number of training epochs
    - id: c
      text: The output file format
    - id: a
      text: Local volume change
    answer: a
    feedback: Density transformations need a volume correction.
- id: flows-and-energy-models.transfer
  objective_ref: objective.flows-and-energy-models
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Distinguish generation procedures: trace the inputs, operation, and result before choosing.'
  remediation_scene: flows-and-energy-models.s4
  variants:
  - id: flows-and-energy-models.transfer.1
    prompt: Does an unnormalized energy score alone provide normalized probability?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if the energy is negative
    - id: a
      text: 'No'
    answer: a
    feedback: The partition function supplies normalization.
  - id: flows-and-energy-models.transfer.2
    prompt: Is finding the minimum-energy state equivalent to sampling the whole distribution?
    options:
    - id: c
      text: Only for every multimodal distribution
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Optimization and distributional sampling are distinct tasks.
