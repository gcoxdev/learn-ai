schema_version: 0.2-draft
lesson:
  id: flows-and-energy-models
  version: 0.1.0-draft
  title: Represent probability through invertible maps or energy scores
  state: draft
  summary: Normalizing flows transform a known density with invertible maps and volume corrections; energy-based
    models assign unnormalized scores and require a way to handle normalization and sampling.
  slot: M22.5
  category: learning
  minutes: 12
  sources:
  - title: Real NVP
    url: https://arxiv.org/abs/1605.08803
  - title: A Tutorial on Energy-Based Learning
    url: https://www.cs.toronto.edu/~hinton/absps/ebm.pdf
objectives:
- id: objective.flows-and-energy-models
  version: 1-draft
  statement: Normalizing flows transform a known density with invertible maps and volume corrections; energy-based
    models assign unnormalized scores and require a way to handle normalization and sampling.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - flows-and-energy-models.base
  - flows-and-energy-models.transfer
  prerequisites:
  - anyOf:
    - objective.generative-models
  - anyOf:
    - objective.integrals-density
scenes:
- id: flows-and-energy-models.s1
  title: Transform a simple random variable
  type: explanation
  depth: intuition
  objective_refs:
  - objective.flows-and-energy-models
  markdown: A normalizing flow maps a variable from a tractable base distribution through invertible transformations.
    To compute output density, account for how the transformation expands or contracts volume using a Jacobian determinant.
    Invertibility and tractable volume computation constrain useful layer designs.
  text_mode: A normalizing flow maps a variable from a tractable base distribution through invertible transformations.
    To compute output density, account for how the transformation expands or contracts volume using a Jacobian determinant.
    Invertibility and tractable volume computation constrain useful layer designs.
  bridges: []
- id: flows-and-energy-models.s2
  title: Trace a one-dimensional stretch
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.flows-and-energy-models
  markdown: Let x = 2z for a continuous base variable z. A small interval doubles in width, so density at x is the
    base density at x/2 divided by two. Probability mass is conserved even though density height changes. This is
    the change-of-variables idea behind flow likelihoods.
  text_mode: Let x = 2z for a continuous base variable z. A small interval doubles in width, so density at x is
    the base density at x/2 divided by two. Probability mass is conserved even though density height changes. This
    is the change-of-variables idea behind flow likelihoods.
  bridges:
  - integrals-density
  - multivariable-calculus
- id: flows-and-energy-models.s3
  title: Assign low energy to compatible states
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.flows-and-energy-models
  markdown: An energy model defines probability proportional to exp(-E(x)). Lower energy gives higher unnormalized
    preference, but the partition function must account for all possible states to normalize probability. Computing
    it can be difficult, making likelihood learning and sampling nontrivial.
  text_mode: An energy model defines probability proportional to exp(-E(x)). Lower energy gives higher unnormalized
    preference, but the partition function must account for all possible states to normalize probability. Computing
    it can be difficult, making likelihood learning and sampling nontrivial.
  bridges: []
- id: flows-and-energy-models.s4
  title: Distinguish generation procedures
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.flows-and-energy-models
  markdown: Some flows sample by directly transforming base noise. Many energy-model methods use iterative procedures
    such as Markov chain Monte Carlo, which require mixing and convergence assessment. Minimizing energy finds a
    preferred state; it is not the same as drawing representative samples from the entire distribution.
  text_mode: Some flows sample by directly transforming base noise. Many energy-model methods use iterative procedures
    such as Markov chain Monte Carlo, which require mixing and convergence assessment. Minimizing energy finds a
    preferred state; it is not the same as drawing representative samples from the entire distribution.
  bridges: []
- id: flows-and-energy-models.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.flows-and-energy-models
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: flows-and-energy-models.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.flows-and-energy-models
  markdown: Normalizing flows transform a known density with invertible maps and volume corrections; energy-based
    models assign unnormalized scores and require a way to handle normalization and sampling.
  text_mode: Normalizing flows transform a known density with invertible maps and volume corrections; energy-based
    models assign unnormalized scores and require a way to handle normalization and sampling.
