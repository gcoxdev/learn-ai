schema_version: 0.2-draft
lesson:
  id: flows-and-energy-models
  version: 0.4.0-draft
  title: Represent probability through invertible maps or energy scores
  state: draft
  summary: Stretch a bell curve and its height must drop. Score states instead and you face a sum too big to compute. Two exact-probability ideas, and the problem each one dodges.
  slot: M22.5
  category: learning
  sources:
    - title: "NICE: Non-linear Independent Components Estimation (Dinh, Krueger & Bengio, 2014)"
      url: https://arxiv.org/abs/1410.8516
    - title: Density estimation using Real NVP (Dinh, Sohl-Dickstein & Bengio, 2016)
      url: https://arxiv.org/abs/1605.08803
    - title: "Glow: Generative Flow with Invertible 1x1 Convolutions (Kingma & Dhariwal, 2018)"
      url: https://arxiv.org/abs/1807.03039
    - title: A Tutorial on Energy-Based Learning (LeCun et al., 2006)
      url: http://yann.lecun.com/exdb/publis/pdf/lecun-06.pdf
    - title: "Deep Learning, chapter 18: Confronting the Partition Function (Goodfellow, Bengio & Courville, 2016)"
      url: https://www.deeplearningbook.org/contents/partition.html
objectives:
  - id: objective.flows-and-energy-models
    version: 2-draft
    statement: Normalizing flows transform a known density with invertible maps and volume corrections; energy-based models assign unnormalized scores and require a way to handle normalization and sampling.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - flows-and-energy-models.base.v2
      - flows-and-energy-models.transfer.v2
      - flows-and-energy-models.calculate
    prerequisites:
      - anyOf:
          - objective.generative-models
      - anyOf:
          - objective.integrals-density
scenes:
  - id: flows-and-energy-models.s1
    title: Stack invertible layers
    type: explanation
    depth: intuition
    objective_refs:
      - objective.flows-and-energy-models
    markdown: |-
      One affine stretch only turns a bell curve into a wider bell. A **normalizing flow** stacks many invertible steps, $x = f_K(\cdots f_2(f_1(z)))$, each a small neural network, so a plain Gaussian can bend into the shape of real data. The log-density just collects one correction per layer:

      $$\log p_x(x) = \log p_z(z) - \sum_{k=1}^{K} \log \left|\det J_{f_k}\right|$$

      In many dimensions, the stretch factor comes from the **Jacobian**, the table of how each output changes with each input (see the multivariable calculus lesson). Its **determinant** is how much the step scales a small volume; in 1-D it's just $a$. For a 784-pixel image the Jacobian is 784 × 784, and a general determinant costs roughly $784^3 \approx 480$ million operations, so flow layers are built to make it cheap.

      :::papers Coupling layers (Real NVP; Dinh, Sohl-Dickstein & Bengio, 2016)
      Split the input into halves $z_A$ and $z_B$. Keep $z_A$, and transform $z_B$ with a scale and shift computed from $z_A$:

      $$x_A = z_A, \qquad x_B = z_B \odot e^{s(z_A)} + t(z_A)$$

      Inverting is easy: $z_B = (x_B - t(x_A)) \odot e^{-s(x_A)}$, and $s$ and $t$ can be any network, since they're never inverted. The Jacobian is triangular, so its log-determinant is just $\sum s(z_A)$. Glow (Kingma & Dhariwal, 2018) built on this to generate realistic high-resolution faces.
      :::

      The payoff is rare among generators: an exact likelihood *and* one-pass sampling. The price is that every layer must stay invertible and keep all 784 dimensions, so there's no bottleneck.
    bridges: []
  - id: flows-and-energy-models.s2
    title: Change of variables, worked in 1-D
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.flows-and-energy-models
    markdown: |-
      Now start from a bell curve. Let $z$ follow the standard normal and apply the **affine flow** $x = f(z) = 2z + 1$: stretch by $a = 2$, shift by $b = 1$. To find the density at $x = 3$:

      1. **Invert.** $z = f^{-1}(x) = (3 - 1)/2 = 1$.
      2. **Look up the base density.** $p_z(1) = 0.2420$.
      3. **Correct for stretching.** Space was stretched by 2, so divide by 2: $p_x(3) = 0.2420 / 2 = 0.1210$.

      :::papers The change-of-variables formula
      $$p_x(x) = p_z\big(f^{-1}(x)\big)\,\left|\frac{d f^{-1}}{dx}\right| \qquad\text{so}\qquad \log p_x(x) = \log p_z(z) - \log|a|$$

      Here $f^{-1}(x) = (x - 1)/2$ and its derivative is $1/2$, the "divide by 2" in step 3. In log form, $\log p_x(3) = \log 0.2420 - \log 2 \approx -2.112$. A flow is trained by maximizing exactly this log-likelihood on real data.
      :::

      ```python run
      import numpy as np

      def p_z(z):                      # base density: standard normal
          return np.exp(-z**2 / 2) / np.sqrt(2 * np.pi)

      a, b = 2.0, 1.0                  # the flow: x = f(z) = a*z + b

      def p_x(x):                      # change of variables
          z = (x - b) / a              # invert the flow: f^-1(x)
          return p_z(z) * abs(1 / a)   # times |d f^-1 / dx| = 1/|a|

      for x in [1.0, 3.0, 5.0]:
          print(f"x = {x}: z = {(x - b) / a}, p_z(z) = {p_z((x - b) / a):.4f}, p_x(x) = {p_x(x):.4f}")

      # Check 1: total probability is still 1 (add up thin slices)
      xs = np.linspace(-20, 22, 200_001)
      print("area under p_x:", round(float(np.sum(p_x(xs)) * (xs[1] - xs[0])), 4))

      # Check 2: it matches a normal with mean b and standard deviation a
      direct = np.exp(-(3.0 - b)**2 / (2 * a**2)) / (a * np.sqrt(2 * np.pi))
      print("normal(1, 2) density at 3:", round(float(direct), 4))

      # Log-likelihood of a data point: log p_z(z) - log|a|
      print("log p_x(3) =", round(float(np.log(p_z(1.0)) - np.log(a)), 4))
      ```

      The area stays 1, and the result matches a normal with mean 1 and standard deviation 2, as it should. Delete the `abs(1 / a)` factor and rerun: the area jumps to 2, a "distribution" that's twice too big.

      :::predict With a = 0.5 instead of 2 (a squeeze), what is p_x at the point that maps back to z = 1?
      The point is $x = 0.5 \times 1 + 1 = 1.5$, and squeezing by 0.5 *multiplies* the density by 2: $p_x(1.5) = 0.2420 / 0.5 = 0.484$. Squeezed probability piles up higher.
      :::
    bridges:
      - integrals-density
      - multivariable-calculus
  - id: flows-and-energy-models.s3
    title: The sum you can't compute
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.flows-and-energy-models
    markdown: |-
      Normalizing three states was easy. Now let the states be 4 × 4 black-and-white images, with an energy that charges 1 for each pair of neighboring pixels that differ, so smooth images are preferred. There are $2^{16} = 65{,}536$ images, and the program below visits every one to compute $Z$:

      ```python run
      import numpy as np

      def energy(imgs):                 # each pair of neighbors that differ costs 1
          return ((imgs[:, :, 1:] != imgs[:, :, :-1]).sum(axis=(1, 2))
                  + (imgs[:, 1:, :] != imgs[:, :-1, :]).sum(axis=(1, 2)))

      n = 4                             # a 4 x 4 black-and-white image
      ids = np.arange(2 ** (n * n))
      imgs = ((ids[:, None] >> np.arange(n * n)) & 1).reshape(-1, n, n)
      E = energy(imgs)

      Z = np.exp(-E).sum()              # the partition function: add up every state
      print("states:", len(imgs), "  Z =", round(float(Z), 3))
      print("p(all white)    =", round(float(np.exp(-0) / Z), 4))
      checker = np.indices((n, n)).sum(axis=0) % 2
      print("checkerboard energy:", int(energy(checker[None])[0]),
            "  p =", f"{np.exp(-energy(checker[None])[0]) / Z:.1e}")
      print("states for 28 x 28: about 10 **", round(28 * 28 * np.log10(2)))
      ```

      An all-white image has energy 0 and probability $1/12.155 = 0.0823$; a checkerboard, with 24 disagreeing neighbors, is almost impossible. But a 28 × 28 image has about $10^{236}$ states, far too many to visit, so $Z$ and every exact probability are out of reach. This is the **partition function problem**, and it's why Boltzmann machines (in the associative memory lesson of module 37) are hard to train.

      There is one escape. The gradient of the log-probability with respect to the input, called the **score** (a more specific meaning than "scoring" a sample in the first lesson of this module), is $\nabla_x \log p(x) = -\nabla_x E(x) - \nabla_x \log Z = -\nabla_x E(x)$, because $Z$ is a constant that doesn't depend on $x$. The score tells you which way to nudge an image to make it more probable, with no $Z$ needed. Diffusion models, in the next lesson, are built on this: they learn the score of noisy images.
    bridges: []
  - id: flows-and-energy-models.s4
    title: One pass or a long walk
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.flows-and-energy-models
    markdown: |-
      The two families also sample differently. A flow draws $z$ from a bell curve and pushes it through the layers once. An energy model has no such recipe, so it takes a walk: start from noise, repeatedly nudge the image downhill in energy along the score, and add a little fresh noise each step. This is **Langevin dynamics**, a Markov chain Monte Carlo (MCMC) method like those in module 6's Monte Carlo lesson. With small enough steps, the walk's positions end up following $p(x)$.

      :::mixup "To sample an energy model, find the lowest-energy state."
      Minimizing energy always ends at a perfectly smooth image, all white or all black, but a true sample is all-white only 8.2% of the time. The random kicks in an MCMC walk keep it exploring instead of sliding to the bottom.
      :::

      | | Normalizing flow | Energy-based model |
      | --- | --- | --- |
      | Defines | An invertible map from noise | An energy score for every state |
      | Exact likelihood | Yes, via change of variables | No: needs $Z$ |
      | Sampling | One pass through the layers | Many MCMC steps |
      | Main constraint | Every layer invertible, full dimension | Must estimate or avoid $Z$ |

      To compare two candidates, an energy model is enough: $p(x_1)/p(x_2) = e^{E(x_2) - E(x_1)}$, and $Z$ cancels. For exact probabilities of new data, use a flow.
    bridges: []
  - id: flows-and-energy-models.extension-density-by-area
    title: A density can change while probability stays the same
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.flows-and-energy-models
    markdown: |-
      Spread a cup of sand evenly along a one-metre shelf. Now spread the same cup along two metres. The pile is half as high, but it's still one cup. Probability densities behave the same way.

      Let $z$ be a uniform random number between 0 and 1: every stretch of equal length is equally likely. Its **density**, the height of the curve, is 1 across that interval, so the area is $1 \times 1 = 1$. Now set $x = 2z$. The values now run from 0 to 2, so the height must drop to 1/2 to keep the area at $2 \times 1/2 = 1$. The chance that $x$ lands between 0 and 1 is the area there, $1 \times 1/2 = 1/2$.

      Stretching space by 2 divides the density by 2. (A height of 1/2 isn't the probability of any single point; probabilities are areas.) That's the idea behind a **normalizing flow**: transform a simple random variable with a function you can reverse, and track how the density changes so it still adds up, or normalizes, to 1.
    bridges:
      - integrals-density
      - probability
  - id: flows-and-energy-models.extension-two-state-energy
    title: Energies that don't add up to one
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.flows-and-energy-models
    markdown: |-
      Flows must keep every step reversible. The other idea drops that constraint: give every possible state $x$ one number $E(x)$, called its **energy**, where low means "likely" and high means "unlikely". A model built this way is an **energy-based model**, and any network that outputs one number will do. (The name comes from statistical physics; it isn't physical energy.)

      To turn energies into probabilities, make each one positive with $e^{-E(x)}$, then divide by the total:

      $$p(x) = \frac{e^{-E(x)}}{Z}, \qquad Z = \sum_{x} e^{-E(x)}$$

      The total $Z$ is the **partition function**. With three states of energy 0, 1, and 2:

      | State | Energy | $e^{-E}$ | Probability |
      | --- | ---: | ---: | ---: |
      | A | 0 | 1.000 | 1.000 / 1.503 = 0.665 |
      | B | 1 | 0.368 | 0.245 |
      | C | 2 | 0.135 | 0.090 |
      | Sum | | $Z = 1.503$ | 1.000 |

      Each extra unit of energy makes a state $e \approx 2.7$ times less likely. Before dividing by $Z$, the weights are **unnormalized**: they rank states but don't add to 1.
    bridges:
      - probability
      - powers-logs
  - id: flows-and-energy-models.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.flows-and-energy-models
    markdown: Flow densities and energy probabilities to compute, plus a sensor model, a molecule scorer, and a sampler that keeps returning one image, test whether you can pick and use each approach.
    takeaway: |-
      A flow gets exact densities by inverting an invertible map and dividing by how much it stretches space. An energy model scores states with e^(−E) but needs Z to normalize, so it compares states and samples by walking downhill with noise.
  - id: flows-and-energy-models.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.flows-and-energy-models
    markdown: |-
      A normalizing flow tracks how a reversible transformation changes density. An energy model scores possible states and needs a way to normalize or sample those scores.
