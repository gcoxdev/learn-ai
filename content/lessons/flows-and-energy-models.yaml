scenes:
- id: flows-and-energy-models.s1
  title: Transform a simple random variable
  type: explanation
  depth: intuition
  objective_refs:
  - objective.flows-and-energy-models
  markdown: 'A normalizing flow maps a variable from a tractable base distribution through invertible transformations.
    To compute output density, account for how the transformation expands or contracts volume using a Jacobian
    determinant. Invertibility and tractable volume computation constrain useful layer designs.


    A **Jacobian** is a table of how each output coordinate changes when each input changes. Its **determinant**
    measures local volume scaling for a square transformation. In the preceding one-dimensional stretch, that
    factor is simply 2. The multivariable and linear-algebra bridges supply the deeper mathematics; the key
    accounting rule is to preserve probability when stretching space.'
  text_mode: 'A normalizing flow maps a variable from a tractable base distribution through invertible transformations.
    To compute output density, account for how the transformation expands or contracts volume using a Jacobian
    determinant. Invertibility and tractable volume computation constrain useful layer designs.


    A **Jacobian** is a table of how each output coordinate changes when each input changes. Its **determinant**
    measures local volume scaling for a square transformation. In the preceding one-dimensional stretch, that
    factor is simply 2. The multivariable and linear-algebra bridges supply the deeper mathematics; the key
    accounting rule is to preserve probability when stretching space.'
  bridges: []
- id: flows-and-energy-models.s2
  title: Trace a one-dimensional stretch
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.flows-and-energy-models
  markdown: Let x = 2z for a continuous base variable z. A small interval doubles in width, so density at x
    is the base density at x/2 divided by two. Probability mass is conserved even though density height changes.
    This is the change-of-variables idea behind flow likelihoods.
  text_mode: Let x = 2z for a continuous base variable z. A small interval doubles in width, so density at
    x is the base density at x/2 divided by two. Probability mass is conserved even though density height changes.
    This is the change-of-variables idea behind flow likelihoods.
  bridges:
  - integrals-density
  - multivariable-calculus
- id: flows-and-energy-models.s3
  title: Assign low energy to compatible states
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.flows-and-energy-models
  markdown: 'An energy model defines probability proportional to exp(-E(x)). Lower energy gives higher unnormalized
    preference, but the partition function must account for all possible states to normalize probability. Computing
    it can be difficult, making likelihood learning and sampling nontrivial.


    The “energy” is a mathematical score and need not measure joules or physical energy. The **partition function**
    adds the positive weights exp(−E) over discrete states, or integrates them over continuous states. Its
    role is the denominator that makes total probability one. Finding one low-energy state avoids that sum
    but answers a different question from sampling the distribution.'
  text_mode: 'An energy model defines probability proportional to exp(-E(x)). Lower energy gives higher unnormalized
    preference, but the partition function must account for all possible states to normalize probability. Computing
    it can be difficult, making likelihood learning and sampling nontrivial.


