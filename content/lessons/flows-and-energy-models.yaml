- id: flows-and-energy-models.s4
  title: Distinguish generation procedures
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.flows-and-energy-models
  markdown: Some flows sample by directly transforming base noise. Many energy-model methods use iterative
    procedures such as Markov chain Monte Carlo, which require mixing and convergence assessment. Minimizing
    energy finds a preferred state; it is not the same as drawing representative samples from the entire distribution.
  text_mode: Some flows sample by directly transforming base noise. Many energy-model methods use iterative
    procedures such as Markov chain Monte Carlo, which require mixing and convergence assessment. Minimizing
    energy finds a preferred state; it is not the same as drawing representative samples from the entire distribution.
  bridges: []
- id: flows-and-energy-models.extension-density-by-area
  title: A density can change while probability stays the same
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.flows-and-energy-models
  markdown: Begin with a uniform random number z between 0 and 1. Uniform means equal-length intervals are
    equally likely. Its density height is 1, giving total area 1 × 1 = 1. Map it to x=2z. The possible interval
    is now 0 to 2, so the uniform density height becomes 1/2. Area is still 2 × 1/2 = 1. The probability of
    x lying between 0 and 1 is the area 1 × 1/2 = 1/2. A height of 1/2 is not by itself the probability of
    any single exact continuous point.
  text_mode: Begin with a uniform random number z between 0 and 1. Uniform means equal-length intervals are
    equally likely. Its density height is 1, giving total area 1 × 1 = 1. Map it to x=2z. The possible interval
    is now 0 to 2, so the uniform density height becomes 1/2. Area is still 2 × 1/2 = 1. The probability of
    x lying between 0 and 1 is the area 1 × 1/2 = 1/2. A height of 1/2 is not by itself the probability of
    any single exact continuous point.
  bridges:
  - integrals-density
  - probability
- id: flows-and-energy-models.extension-two-state-energy
  title: Normalize an energy score on two possible states
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.flows-and-energy-models
  markdown: An energy is a model-assigned score; lower energy means greater preference under the usual negative-exponential
    rule. Suppose two states have unnormalized positive weights 2 and 1 after applying that rule. “Unnormalized”
    means they do not yet add to one. Their total, called the partition function in this example, is 3. Divide
    by 3 to get probabilities 2/3 and 1/3. Sampling can choose either state in those proportions; taking only
    the most preferred state chooses the first every time. The challenge for a large energy model is accounting
    for far more than two possible states.
  text_mode: An energy is a model-assigned score; lower energy means greater preference under the usual negative-exponential
    rule. Suppose two states have unnormalized positive weights 2 and 1 after applying that rule. “Unnormalized”
    means they do not yet add to one. Their total, called the partition function in this example, is 3. Divide
    by 3 to get probabilities 2/3 and 1/3. Sampling can choose either state in those proportions; taking only
    the most preferred state chooses the first every time. The challenge for a large energy model is accounting
    for far more than two possible states.
  bridges:
  - probability
  - powers-logs
