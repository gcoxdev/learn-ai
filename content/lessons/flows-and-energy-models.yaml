        prompt: Is finding the minimum-energy state equivalent to sampling the whole distribution?
        options:
          - id: c
            text: Only for every multimodal distribution
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Optimization and distributional sampling are distinct tasks.
        retired: true
  - id: flows-and-energy-models.base.v2
    objective_ref: objective.flows-and-energy-models
    task: base
    response_type: single_choice
    points: 1
    hint: "For a flow: invert, look up the base density, divide by the stretch. For an energy model: e^(−E) ranks states, and only dividing by Z turns them into probabilities."
    remediation_scene: flows-and-energy-models.s2
    variants:
      - id: flows-and-energy-models.base.v2.1
        prompt: A flow maps x = 3z. A student computes p_x(6) as p_z(6). What two corrections are missing?
        options:
          - id: b
            text: Evaluate p_z at 18, then multiply by 3
          - id: a
            text: Evaluate p_z at 2, then divide by 3
          - id: c
            text: Evaluate p_z at 2, then multiply by 3
        answer: a
        feedback: Invert first (z = 6/3 = 2), then divide by the stretch, 3, so p_x(6) = p_z(2)/3. Multiplying would give a total area of 9 instead of 1; mapping forward to 18 uses the wrong direction.
      - id: flows-and-energy-models.base.v2.2
        prompt: Why are Real NVP coupling layers built to leave half the input unchanged?
        options:
          - id: c
            text: It halves the model size, so training runs twice as fast
          - id: b
            text: It keeps half the image fixed as the condition for sampling
          - id: a
            text: It makes the layer easy to invert and its determinant cheap
        answer: a
        feedback: Because x_A = z_A, you can recompute s and t from x_A to invert, and the Jacobian is triangular, so the log-determinant is just the sum of s. Other layers transform the other half, so nothing stays fixed overall.
      - id: flows-and-energy-models.base.v2.3
        prompt: States A and B have energies 1 and 3. Without knowing Z, what can you say?
        options:
          - id: a
            text: A is e² ≈ 7.4 times as likely as B
          - id: b
            text: A has probability e⁻¹ ≈ 0.37
          - id: c
            text: B is 3 times as likely as A
        answer: a
        feedback: The ratio p(A)/p(B) = e^(−1)/e^(−3) = e², and Z cancels. e^(−1) is only an unnormalized weight, and higher energy means less likely, not more.
      - id: flows-and-energy-models.base.v2.4
        prompt: Why can the score ∇ₓ log p(x) of an energy model be computed even when Z can't?
        options:
          - id: b
            text: Because Z is always 1 for a well-trained model
          - id: a
            text: Because Z doesn't depend on x, so its gradient is zero
          - id: c
            text: Because the gradient of E already includes Z
        answer: a
        feedback: log p(x) = −E(x) − log Z, and log Z is the same for every x, so it drops out of the gradient, leaving −∇E(x). Z is rarely 1, and E itself knows nothing about Z.
  - id: flows-and-energy-models.transfer.v2
    objective_ref: objective.flows-and-energy-models
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what the task needs. Exact probabilities of new data point to a flow; comparing candidates only needs energy differences; sampling an energy model needs a noisy walk, not a minimum.
    remediation_scene: flows-and-energy-models.s4
    variants:
      - id: flows-and-energy-models.transfer.v2.1
        prompt: A factory wants the exact probability density of each new sensor reading to flag rare ones. Which model type gives this directly?
        options:
          - id: c
            text: An energy model, since low energy means a common reading
          - id: a
            text: A normalizing flow, via the change-of-variables formula
          - id: b
            text: A GAN, since its discriminator scores how real a reading is
        answer: a
        feedback: A flow gives exact log p(x) by inverting and correcting for stretch. An energy model ranks readings but lacks Z, and a discriminator's output isn't a density.
      - id: flows-and-energy-models.transfer.v2.2
        prompt: A chemist's energy model scores candidate molecules, and she only needs to pick the more stable of two. Does she need the partition function?
        options:
          - id: a
            text: No; comparing two energies is enough, since Z cancels
          - id: b
            text: Yes; without Z the energies can't be compared at all
          - id: c
            text: Yes; she must first estimate Z with a normalizing flow
        answer: a
        feedback: p(x₁)/p(x₂) = e^(E(x₂) − E(x₁)), so ranking two candidates needs only their energies. Z matters for absolute probabilities, not comparisons.
      - id: flows-and-energy-models.transfer.v2.3
        prompt: A sampler for an image energy model returns the same smooth image every run. Its code does gradient descent on E from random starts. What is wrong?
        options:
          - id: b
            text: The energy network is too small to tell images apart
          - id: c
            text: The partition function was never computed
          - id: a
            text: It minimizes energy instead of sampling; it needs added noise
        answer: a
        feedback: Pure descent slides to a lowest-energy image. Langevin dynamics adds fresh noise each step so the walk visits states in proportion to p(x). Sampling doesn't need Z.
      - id: flows-and-energy-models.transfer.v2.4
        prompt: A team wants to shrink a 784-pixel image to a 16-number code inside a normalizing flow. Why won't this work as a flow layer?
        options:
          - id: c
            text: Flows are limited to affine layers, not neural networks
          - id: a
            text: Flow layers must be invertible, so none can drop dimensions
          - id: b
            text: Flows can't work with images larger than 16 pixels
        answer: a
        feedback: A map from 784 numbers to 16 can't be reversed, so the change-of-variables formula fails. Coupling layers do use neural networks, and flows handle large images; they just can't compress.
  - id: flows-and-energy-models.calculate
    objective_ref: objective.flows-and-energy-models
    task: base
    response_type: numeric
    points: 1
    hint: "For a flow x = az + b: invert with z = (x − b)/a, then p_x(x) = p_z(z)/|a|. For energies: probability = e^(−E) / Z."
    remediation_scene: flows-and-energy-models.s2
    absolute_tolerance: 0.005
    variants:
      - id: flows-and-energy-models.calculate.1
        prompt: A flow maps x = 2z + 1, with z standard normal. Given p_z(0) = 0.399, what is p_x(1)?
        answer: 0.1995
        feedback: z = (1 − 1)/2 = 0, so p_x(1) = 0.399 / 2 = 0.1995.
      - id: flows-and-energy-models.calculate.2
        prompt: A flow maps x = 0.5z, with z standard normal. Given p_z(1) = 0.242, what is p_x(0.5)?
        answer: 0.484
        feedback: z = 0.5 / 0.5 = 1, and squeezing by 0.5 doubles the density, so p_x(0.5) = 0.242 / 0.5 = 0.484.
      - id: flows-and-energy-models.calculate.3
        prompt: A flow maps x = 4z − 2, with z standard normal. Given p_z(1) = 0.242, what is p_x(2)?
        answer: 0.0605
        feedback: z = (2 + 2)/4 = 1, so p_x(2) = 0.242 / 4 = 0.0605.
      - id: flows-and-energy-models.calculate.4
        prompt: Two states have energies 0 and ln 3 (so e^(−E) = 1 and 1/3). What is the probability of the lower-energy state?
        answer: 0.75
        feedback: Z = 1 + 1/3 = 4/3, so p = 1 / (4/3) = 0.75.
      - id: flows-and-energy-models.calculate.5
        prompt: Three states have unnormalized weights e^(−E) of 1.0, 0.368, and 0.135. What is the probability of the middle state?
        answer: 0.245
        feedback: Z = 1.0 + 0.368 + 0.135 = 1.503, so p = 0.368 / 1.503 ≈ 0.245.
