lesson:
  id: flows-and-energy-models
  version: 0.3.0-draft
  title: Represent probability through invertible maps or energy scores
  state: draft
  summary: Stretch a simple probability distribution, then compare that approach with assigning scores to possible
    samples.
  slot: M22.5
  category: learning
  sources:
  - title: Real NVP
    url: https://arxiv.org/abs/1605.08803
  - title: A Tutorial on Energy-Based Learning
    url: https://www.cs.toronto.edu/~hinton/absps/ebm.pdf
objectives:
- id: objective.flows-and-energy-models
  version: 1-draft
  statement: Normalizing flows transform a known density with invertible maps and volume corrections; energy-based
    models assign unnormalized scores and require a way to handle normalization and sampling.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - flows-and-energy-models.base
  - flows-and-energy-models.transfer
  prerequisites:
  - anyOf:
