assessment_families:
  - id: batching-streaming-and-cache-management.base
    objective_ref: objective.batching-streaming-and-cache-management
    task: base
    response_type: single_choice
    points: 1
    hint: 'Separate streaming from faster computation: trace the inputs, operation, and result before choosing.'
    remediation_scene: batching-streaming-and-cache-management.s2
    variants:
      - id: batching-streaming-and-cache-management.base.1
        retired: true
        prompt: What can continuous batching do?
        options:
          - id: a
            text: Admit and retire requests during ongoing generation
          - id: b
            text: Make every output length identical
          - id: c
            text: Eliminate every cache allocation
        answer: a
        feedback: The active batch changes over time.
      - id: batching-streaming-and-cache-management.base.2
        retired: true
        prompt: Does streaming necessarily reduce total model compute?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only for short outputs
          - id: a
            text: 'No'
        answer: a
        feedback: It changes delivery timing, not automatically computation.
  - id: batching-streaming-and-cache-management.transfer
    objective_ref: objective.batching-streaming-and-cache-management
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Manage memory in blocks: trace the inputs, operation, and result before choosing.'
    remediation_scene: batching-streaming-and-cache-management.s4
    variants:
      - id: batching-streaming-and-cache-management.transfer.1
        retired: true
        prompt: What must prefix-cache reuse establish?
        options:
          - id: b
            text: Only similar visible wording
          - id: c
            text: Only the same user display name
          - id: a
            text: Compatible model state and identical relevant prefix computation
        answer: a
        feedback: Cached states depend on exact computational inputs.
      - id: batching-streaming-and-cache-management.transfer.2
        retired: true
        prompt: Does paged cache management eliminate all retained-state memory?
        options:
          - id: c
            text: Only for attention models
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Paging organizes allocation rather than deleting required state.
  - id: batching-streaming-and-cache-management.base.v2
    objective_ref: objective.batching-streaming-and-cache-management
    task: base
    response_type: single_choice
    points: 1
    hint: Think about what one decode step reads from memory, and what happens to a request's slot and cache blocks when it finishes or when memory runs out.
    remediation_scene: batching-streaming-and-cache-management.s1
    variants:
      - id: batching-streaming-and-cache-management.base.v2.1
        prompt: A static batch holds four replies that need 20, 50, 100, and 400 tokens. What does continuous batching change?
        options:
          - id: b
            text: It pads the four replies to 400 tokens so they finish together
          - id: a
            text: A finished reply's slot goes to a waiting request at the next step
          - id: c
            text: It runs each request by itself, so short replies skip the wait
        answer: a
        feedback: Continuous batching reschedules at every step, so the slot freed at step 20 is refilled at step 21 instead of idling until step 400. Running requests alone would waste the shared weight reads that make batching worthwhile.
      - id: batching-streaming-and-cache-management.base.v2.2
        prompt: Why can a server add a fifth conversation to a decode batch with almost no extra time per step?
        options:
          - id: c
            text: The new conversation's tokens are computed on the CPU instead
          - id: b
            text: The new conversation reuses the first conversation's KV cache
          - id: a
            text: The step is memory-bound, and one read of the weights serves every row
        answer: a
        feedback: At small batch sizes, reading the weights dominates each step, and every request in the batch uses that same read. Each conversation still needs its own cache and runs on the GPU.
      - id: batching-streaming-and-cache-management.base.v2.3
        prompt: In PagedAttention, what does a request's block table do?
        options:
          - id: a
            text: Maps each of its logical token blocks to a physical spot in GPU memory
          - id: b
            text: Stores a compressed copy of the request's keys and values
          - id: c
            text: Records which of the request's tokens have been streamed so far
        answer: a
        feedback: Like a page table in an operating system, the block table lets a request's cache live in scattered blocks while attention reads them in order. It holds addresses, not the keys and values themselves.
      - id: batching-streaming-and-cache-management.base.v2.4
        prompt: A paged server runs out of free KV blocks while every running request still needs to grow. What does it do?
        options:
          - id: b
            text: Drops the oldest tokens from every running conversation to make room
          - id: a
            text: Preempts a request, then swaps its blocks back or recomputes them later
          - id: c
            text: Halves the block size so that the same memory holds more tokens
        answer: a
        feedback: Preemption frees one request's blocks so the others can continue; that request resumes later by copying its blocks back from CPU memory or rerunning prefill. Dropping tokens would change conversations, and block size doesn't change bytes per token.
  - id: batching-streaming-and-cache-management.transfer.v2
    objective_ref: objective.batching-streaming-and-cache-management
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name what is being wasted (idle slots, reserved memory, or frozen streams) or what is being shared, then pick the scheduling change that targets it.
    remediation_scene: batching-streaming-and-cache-management.s4
    variants:
      - id: batching-streaming-and-cache-management.transfer.v2.1
        prompt: A summarization API runs 8 requests at a time and admits new ones only when all 8 finish. New requests often wait 30 s, though most running summaries ended long before. Which change targets this?
        options:
          - id: a
            text: Admit a waiting request whenever any running one finishes
          - id: b
            text: Raise the static batch to 16 requests at a time
          - id: c
            text: Stream each summary's tokens as they are generated
        answer: a
        feedback: The queue is stuck behind the longest summary in each group. Continuous batching fills freed slots at once. A bigger static batch waits for an even longer maximum, and streaming only helps requests that are already running.
      - id: batching-streaming-and-cache-management.transfer.v2.2
        prompt: 'In a busy chat service, customers'' streams freeze for about half a second whenever someone with a very long prompt joins. What is the likely cause?'
        options:
          - id: c
            text: The scheduler restarts the running requests from their first token
          - id: a
            text: The newcomer's prefill runs in one piece, delaying everyone's next step
          - id: b
            text: The newcomer's KV blocks get copied into the other requests' caches
        answer: a
        feedback: A long prefill occupies the GPU, so the running conversations get no decode step until it finishes. Chunked prefill splits it into pieces that share steps with the decodes. Nothing is restarted or copied between requests.
      - id: batching-streaming-and-cache-management.transfer.v2.3
        prompt: A hosting company serves one model to many business customers and turns on prefix caching. Which rule keeps it safe?
        options:
          - id: b
            text: Share cached blocks freely, since stored keys and values aren't text
          - id: c
            text: Share cached blocks only when two prompts have similar wording
          - id: a
            text: Share cached blocks only between requests allowed to see that text
        answer: a
        feedback: A cache hit is decided by exact tokens, and a hit or miss can reveal that another customer sent the same prefix, so scope sharing to requests with access to that text. Similar wording never matches anyway.
      - id: batching-streaming-and-cache-management.transfer.v2.4
        prompt: A server reserves each request's full 1 GiB maximum context up front and fits only 60 conversations, though most use about 150 MiB. Which change raises concurrency most?
        options:
          - id: a
            text: Allocate cache memory in small blocks as the tokens arrive
          - id: b
            text: Double the maximum context so fewer requests are cut off
          - id: c
            text: Send whole replies instead of streaming them token by token
        answer: a
        feedback: Most of each reservation is empty, so paging turns that empty space into room for more conversations, roughly six times as many here. A bigger maximum makes reservations worse, and streaming doesn't touch memory.
  - id: batching-streaming-and-cache-management.blocks
    objective_ref: objective.batching-streaming-and-cache-management
    task: base
    response_type: numeric
    points: 1
    hint: Blocks needed = tokens ÷ tokens per block, rounded up. The pool holds (pool size ÷ block size) blocks, and whole requests fit when you divide and round down.
    remediation_scene: batching-streaming-and-cache-management.s4
    absolute_tolerance: 0.5
    variants:
      - id: batching-streaming-and-cache-management.blocks.1
        prompt: A paged server uses blocks of 16 tokens. How many blocks does a 1,300-token conversation occupy?
        answer: 82
        feedback: 1,300 ÷ 16 = 81.25, and a partial block is still a whole block, so 82.
      - id: batching-streaming-and-cache-management.blocks.2
        prompt: With 16-token blocks, a request holds 1,000 tokens. How many token slots in its last block are empty?
        answer: 8
        feedback: 1,000 ÷ 16 = 62.5, so it uses 63 blocks holding 1,008 slots, and 1,008 − 1,000 = 8 are empty.
      - id: batching-streaming-and-cache-management.blocks.3
        prompt: Each 16-token block of a model's cache takes 2 MiB. How many blocks fit in a 60 GiB pool?
        answer: 30720
        feedback: 60 GiB is 61,440 MiB, and 61,440 ÷ 2 = 30,720 blocks.
      - id: batching-streaming-and-cache-management.blocks.4
        prompt: A pool holds 30,720 blocks, and every conversation needs 82 blocks. How many whole conversations fit at once?
        answer: 374
        feedback: 30,720 ÷ 82 ≈ 374.6, so 374 whole conversations fit.
      - id: batching-streaming-and-cache-management.blocks.5
        prompt: A model's cache takes 64 KiB per token, and blocks hold 16 tokens. How many MiB does a 500-token request occupy?
        answer: 32
        feedback: 500 ÷ 16 = 31.25, so 32 blocks. Each block is 16 × 64 KiB = 1 MiB, so 32 MiB.
