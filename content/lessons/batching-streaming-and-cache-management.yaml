scenes:
- id: batching-streaming-and-cache-management.s1
  title: Batch compatible work
  type: explanation
  depth: intuition
  objective_refs:
  - objective.batching-streaming-and-cache-management
  markdown: Static batching waits for a fixed group, while continuous batching can admit and retire requests as
    generation progresses. Different prompt and output lengths create uneven work. Scheduling policies decide which
    requests advance and how long others wait.
  text_mode: Static batching waits for a fixed group, while continuous batching can admit and retire requests as
    generation progresses. Different prompt and output lengths create uneven work. Scheduling policies decide which
    requests advance and how long others wait.
  bridges: []
- id: batching-streaming-and-cache-management.s2
  title: Separate streaming from faster computation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.batching-streaming-and-cache-management
  markdown: Streaming exposes partial output as it becomes available, improving perceived responsiveness. It does
    not automatically reduce total model computation. Time to first token, gaps between tokens, and total completion
    time can respond differently to batching and prefill scheduling.
  text_mode: Streaming exposes partial output as it becomes available, improving perceived responsiveness. It does
    not automatically reduce total model computation. Time to first token, gaps between tokens, and total completion
    time can respond differently to batching and prefill scheduling.
  bridges: []
- id: batching-streaming-and-cache-management.s3
  title: Reuse only compatible prefixes
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.batching-streaming-and-cache-management
  markdown: A prefix cache can reuse computed states for an identical compatible prefix under the same model and
    relevant settings. Version, token sequence, position handling, and access scope matter. A visually similar prompt
    is not necessarily an identical token-state computation.
  text_mode: A prefix cache can reuse computed states for an identical compatible prefix under the same model and
    relevant settings. Version, token sequence, position handling, and access scope matter. A visually similar prompt
    is not necessarily an identical token-state computation.
  bridges: []
- id: batching-streaming-and-cache-management.s4
  title: Manage memory in blocks
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.batching-streaming-and-cache-management
  markdown: Paged cache management allocates key/value storage in blocks and maps logical token positions to physical
    storage, reducing some fragmentation and enabling flexible sharing. It does not remove the bytes needed for
    retained states. Measure cache pressure, eviction, tail latency, and cross-request isolation under realistic
    concurrency.
  text_mode: Paged cache management allocates key/value storage in blocks and maps logical token positions to physical
    storage, reducing some fragmentation and enabling flexible sharing. It does not remove the bytes needed for
    retained states. Measure cache pressure, eviction, tail latency, and cross-request isolation under realistic
    concurrency.
  bridges: []
