          note: one token per request
          col: 2
          row: 1
          tone: accent
        - id: stream
          label: Customers
          note: tokens streamed out
          col: 3
          row: 1
          tone: muted
        - id: done
          label: Finished requests
          col: 1
          row: 1
      edges:
        - from: queue
