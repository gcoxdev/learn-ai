  id: batching-streaming-and-cache-management
  version: 0.1.0-draft
  title: Schedule many requests around shared hardware
  state: draft
  summary: Serving schedulers batch work, stream outputs, and manage reusable cache state; throughput gains must
    be evaluated alongside latency, fairness, memory fragmentation, and isolation.
  slot: M27.4
  category: learning
  sources:
