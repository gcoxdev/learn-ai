    url: https://arxiv.org/abs/2309.06180
  - title: The Llama 3 Herd of Models
    url: https://arxiv.org/abs/2407.21783
objectives:
- id: objective.batching-streaming-and-cache-management
  version: 1-draft
  statement: Serving schedulers batch work, stream outputs, and manage reusable cache state; throughput gains must
    be evaluated alongside latency, fairness, memory fragmentation, and isolation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - batching-streaming-and-cache-management.base
  - batching-streaming-and-cache-management.transfer
  prerequisites:
