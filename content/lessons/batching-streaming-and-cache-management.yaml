assessment_families:
- id: batching-streaming-and-cache-management.base
  objective_ref: objective.batching-streaming-and-cache-management
  task: base
  response_type: single_choice
  points: 1
  hint: 'Separate streaming from faster computation: trace the inputs, operation, and result before choosing.'
  remediation_scene: batching-streaming-and-cache-management.s2
  variants:
  - id: batching-streaming-and-cache-management.base.1
    prompt: What can continuous batching do?
    options:
    - id: a
      text: Admit and retire requests during ongoing generation
    - id: b
      text: Make every output length identical
    - id: c
      text: Eliminate every cache allocation
    answer: a
    feedback: The active batch changes over time.
  - id: batching-streaming-and-cache-management.base.2
    prompt: Does streaming necessarily reduce total model compute?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only for short outputs
    - id: a
      text: 'No'
    answer: a
    feedback: It changes delivery timing, not automatically computation.
- id: batching-streaming-and-cache-management.transfer
  objective_ref: objective.batching-streaming-and-cache-management
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Manage memory in blocks: trace the inputs, operation, and result before choosing.'
  remediation_scene: batching-streaming-and-cache-management.s4
  variants:
  - id: batching-streaming-and-cache-management.transfer.1
    prompt: What must prefix-cache reuse establish?
    options:
    - id: b
      text: Only similar visible wording
    - id: c
      text: Only the same user display name
    - id: a
      text: Compatible model state and identical relevant prefix computation
    answer: a
    feedback: Cached states depend on exact computational inputs.
  - id: batching-streaming-and-cache-management.transfer.2
    prompt: Does paged cache management eliminate all retained-state memory?
    options:
    - id: c
      text: Only for attention models
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Paging organizes allocation rather than deleting required state.
