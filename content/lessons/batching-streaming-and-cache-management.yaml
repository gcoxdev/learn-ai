          label: free slot + memory
    bridges: []
  - id: batching-streaming-and-cache-management.s2
    title: Bigger batches, slower ticks
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.batching-streaming-and-cache-management
    markdown: |-
      Batching isn't quite free, because each request also reads its own KV cache at every step. Take 64 Fern conversations of 2,000 tokens each. Their caches total 64 × 250 MiB ≈ 16.8 GB, as much as the weights:

      $$t_{\text{step}} \approx \frac{16 \text{ GB} + 16.8 \text{ GB}}{2 \text{ TB/s}} \approx 16.4 \text{ ms}$$

      The server now makes 64 tokens every 16.4 ms, about 3,900 tokens per second, up from 125. Each customer sees one token per step, about 61 per second instead of 125. Batching trades a little speed per customer for a lot of total throughput, and the last lesson of this module turns that trade into a pricing decision.

      **Streaming** sends each token to the customer as soon as its step finishes, so the gap between tokens on screen is the batch's step time. Two scheduler habits keep that gap smooth:

      - **Chunked prefill.** A new customer's 2,000-token prompt takes about 0.2 s of prefill. Run in one piece, it freezes every other stream for that long. Splitting the prompt into chunks that share steps with ongoing decodes (the Sarathi paper, Agrawal et al., 2023) turns one long freeze into several short delays.
      - **Cancel on disconnect.** When a customer closes the chat window mid-reply, stop the request at once. Otherwise the server keeps generating tokens nobody will read, holding a slot and its cache.

      :::predict Streaming makes Fern's replies feel faster. Does it make the GPU finish them sooner?
      No. The same tokens take the same steps either way, so the GPU's time to first token and total time don't change. Streaming changes when the customer *sees* each token: they start reading at the first token instead of waiting for the last.
      :::
    bridges: []
  - id: batching-streaming-and-cache-management.s4
    title: Page the cache like an operating system
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.batching-streaming-and-cache-management
    markdown: |-
      Continuous batching raises a memory question: how much KV cache to set aside for a request whose final length is unknown? Early servers reserved one contiguous region for the maximum context. For Fern that's 8,192 tokens × 128 KiB = 1 GiB per conversation. A typical conversation holds 1,300 tokens, so 84% of each reservation sits empty, and a 60 GiB pool fits only 60 conversations.

      **PagedAttention**, from the vLLM paper (Kwon et al., 2023), borrows the idea of virtual-memory paging from operating systems. The cache is cut into fixed **blocks** of 16 tokens, 2 MiB each for Fern's model. A request gets a new block only when its last one fills up, and its **block table** records where each of its blocks sits in GPU memory, which needn't be side by side. The attention kernel follows the table.

      ```python run
      import math

      KV_PER_TOKEN = 128 * 2**10        # Llama 3 8B: 128 KiB per token
      POOL = 60 * 2**30                 # 60 GiB left for KV cache
      MAX_CONTEXT = 8192
      BLOCK = 16                        # tokens per block (vLLM's default)
      used = 1300                       # tokens a typical Fern conversation actually holds

      reserved = MAX_CONTEXT * KV_PER_TOKEN
      blocks = math.ceil(used / BLOCK)
      paged = blocks * BLOCK * KV_PER_TOKEN
      print(f"reserve max: {reserved / 2**20:6.0f} MiB each, wasted {1 - used / MAX_CONTEXT:.0%},"
            f" fits {POOL // reserved} conversations")
      print(f"paged:       {paged / 2**20:6.1f} MiB each ({blocks} blocks), wasted {blocks * BLOCK - used} token slots,"
            f" fits {POOL // paged} conversations")
      ```

      A 1,300-token conversation needs 82 blocks; only the last one is partly empty, wasting 12 token slots. The same pool now fits 374 conversations instead of 60. The vLLM authors measured that earlier systems used only about 20–38% of their KV memory for actual tokens, while vLLM wasted under 4%. Try `BLOCK = 256` to see why blocks are kept small.

      :::mixup "Paging shrinks the KV cache."
      Every token still needs its 128 KiB. Paging removes the *empty reservations* around the cache, not the cache itself. To shrink the bytes per token, you need fewer KV heads or lower-precision values.
      :::
    bridges: []
  - id: batching-streaming-and-cache-management.s3
    title: Share blocks, preempt when full
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.batching-streaming-and-cache-management
    markdown: |-
      Blocks make sharing easy. Fern's shared prefix, the start token plus the 605-token system prompt, is 606 tokens: 37 full blocks (592 tokens) plus 14 tokens in a 38th. With prefix caching, every conversation's block table points at the *same* 37 physical blocks, and each block keeps a count of how many requests use it. vLLM shares only full blocks, so each request computes those last 14 prefix tokens itself. Across 120 conversations, sharing saves 119 × 74 MiB, about 8.6 GiB. Share cached blocks only among requests that are allowed to see the same text, such as one customer's own conversation or a system prompt every customer receives.

      Sometimes memory runs out anyway: every running conversation grows by one token per step, and eventually a request needs a block when none is free. The scheduler then **preempts** a request: it frees that request's blocks and puts it back in the queue. When the request resumes, the server either copies its saved blocks back from CPU memory (**swapping**) or rebuilds them with a fresh prefill (**recomputation**). Rebuilding a 1,300-token conversation takes about 0.07 s at the A100's peak.

      Finished requests' prefix blocks can stay cached in case the same prefix returns. When space is needed, the least recently used ones are **evicted** first; a later request with that prefix simply pays for prefill again.
    bridges: []
  - id: batching-streaming-and-cache-management.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.batching-streaming-and-cache-management
    markdown: Block counts to compute, plus a stalled queue, freezing streams, a shared cache across companies, and an oversized reservation, test whether you can schedule requests and their memory.
    takeaway: |-
      Continuous batching refills a finished request's slot at the next step, and paged KV memory allocates small blocks as tokens arrive. Together they keep the GPU busy with many more conversations, at a small cost in each customer's token speed.
  - id: batching-streaming-and-cache-management.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.batching-streaming-and-cache-management
    markdown: |-
      Batching shares hardware work, streaming exposes partial output, and cache management handles retained state. Check their effects on both throughput and each user’s waiting time.
