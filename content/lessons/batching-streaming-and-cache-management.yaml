lesson:
  id: batching-streaming-and-cache-management
  version: 0.4.0-draft
  title: Schedule many requests around shared hardware
  state: draft
  summary: One GPU, forty customers, replies of wildly different lengths. See how continuous batching and paged KV memory let one server hold six times as many conversations.
  slot: M27.4
  category: learning
  sources:
    - title: "Orca: A Distributed Serving System for Transformer-Based Generative Models (Yu et al., OSDI 2022)"
      url: https://www.usenix.org/conference/osdi22/presentation/yu
    - title: Efficient Memory Management for Large Language Model Serving with PagedAttention (Kwon et al., SOSP 2023), the vLLM paper
      url: https://arxiv.org/abs/2309.06180
    - title: "SARATHI: Efficient LLM Inference by Piggybacking Decodes with Chunked Prefills (Agrawal et al., 2023)"
      url: https://arxiv.org/abs/2308.16369
objectives:
  - id: objective.batching-streaming-and-cache-management
    version: 2-draft
    statement: Serving schedulers batch work, stream outputs, and manage reusable cache state; throughput gains must be evaluated alongside latency, fairness, memory fragmentation, and isolation.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - batching-streaming-and-cache-management.base.v2
      - batching-streaming-and-cache-management.transfer.v2
      - batching-streaming-and-cache-management.blocks
    prerequisites:
      - anyOf:
          - objective.cached-inference
      - anyOf:
          - objective.compute-and-bandwidth
      - anyOf:
          - objective.tool-contracts-and-state
scenes:
  - id: batching-streaming-and-cache-management.s1
    title: Forty customers, one GPU
    type: explanation
    depth: intuition
    objective_refs:
      - objective.batching-streaming-and-cache-management
    markdown: |-
      Monday, 9 a.m.: forty customers message Fern at once. Serving them one after another would be absurdly wasteful, for a reason the lesson on prefill and decode found. A decode step for one customer spends its 8 ms reading 16 GB of weights, and the tensor cores sit mostly idle. Feed 4 or 40 conversations through the same step and the weights are still read once. The step barely slows down, and the server makes 4 or 40 tokens instead of 1.

      So servers **batch**: they run many requests' decode steps together. The simplest way is **static batching**. Take four requests, run them together until all four finish, then take the next four. The trouble is that replies vary wildly in length. If the four replies need 20, 50, 100, and 400 tokens, the batch runs for 400 steps, and three slots sit idle for most of them. New customers wait in the queue the whole time.

      **Continuous batching** decides who's in the batch at every step. When a reply finishes, its slot goes to the next waiting request right away. Yu and colleagues introduced this in the Orca serving system (2022), calling it *iteration-level scheduling*. The code below serves twelve queued requests both ways.

      ```python run
      import numpy as np

      rng = np.random.default_rng(1)
      lengths = rng.integers(20, 400, size=12)     # reply lengths (tokens) of 12 queued requests
      SLOTS = 4                                    # requests the GPU runs side by side

      # Static: take 4 at a time; the group runs until its longest reply ends.
      t, static_done = 0, []
      for i in range(0, len(lengths), SLOTS):
          group = lengths[i:i + SLOTS]
          static_done += [t + n for n in group]
          t += group.max()
      static_total = t

      # Continuous: whenever a slot frees up, the next request takes it.
      free_at = [0] * SLOTS
      cont_done = []
      for n in lengths:
          s = int(np.argmin(free_at))              # earliest free slot
          free_at[s] += n
          cont_done.append(free_at[s])
      cont_total = max(free_at)

      for name, total, done in [("static", static_total, static_done),
                                ("continuous", cont_total, cont_done)]:
          busy = lengths.sum() / (SLOTS * total)
          print(f"{name:10}: all done at step {total:4}, average finish {np.mean(done):6.1f}, slots busy {busy:.0%}")
      ```

      Static batching keeps the slots busy 61% of the time and finishes at step 1,111; continuous batching reaches 88% and finishes at step 770. Change the seed or `SLOTS` and compare again.
    diagram:
      caption: Continuous batching. The scheduler reshapes the batch before every decode step.
      description: Waiting requests enter the scheduler, which admits them into the running batch when a slot and cache memory are free. The running batch goes through one decode step together. Each step streams one new token per request to its customer. Requests that are not done return to the running batch for the next step. Requests that hit a stop go to the finished list, which frees their slots and cache memory for the scheduler.
