objectives:
  - id: objective.genetic-programming-and-neuroevolution
    version: 2-draft
    statement: Genetic programming searches executable structures, neuroevolution searches neural parameters or topology, and architecture search must separate candidate selection from independent evaluation.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - genetic-programming-and-neuroevolution.base.v2
      - genetic-programming-and-neuroevolution.transfer.v2
      - genetic-programming-and-neuroevolution.calculate
    prerequisites:
