scenes:
- id: genetic-programming-and-neuroevolution.s1
  title: Evolve an executable expression
  type: explanation
  depth: intuition
  objective_refs:
  - objective.genetic-programming-and-neuroevolution
  markdown: 'Genetic programming can represent a candidate as an expression tree such as add(multiply(x,x),one).
    Mutation replaces a subtree; crossover exchanges compatible parts. Type rules and constrained grammars
    can keep candidates executable, while size penalties address uncontrolled program growth.


    The expression add(multiply(x,x),one) means x² + 1. At x = 3 it returns 10. Replacing the multiply subtree
    with x changes the program to x + 1, which returns 4. A tree is a nested structure whose inner nodes are
    operations and whose leaves are inputs or constants. “Bloat” means growth in program size without enough
    useful improvement; size penalties or limits can discourage it.'
  text_mode: 'Genetic programming can represent a candidate as an expression tree such as add(multiply(x,x),one).
    Mutation replaces a subtree; crossover exchanges compatible parts. Type rules and constrained grammars
    can keep candidates executable, while size penalties address uncontrolled program growth.


    The expression add(multiply(x,x),one) means x² + 1. At x = 3 it returns 10. Replacing the multiply subtree
    with x changes the program to x + 1, which returns 4. A tree is a nested structure whose inner nodes are
    operations and whose leaves are inputs or constants. “Bloat” means growth in program size without enough
    useful improvement; size penalties or limits can discourage it.'
  bridges: []
- id: genetic-programming-and-neuroevolution.s2
  title: Search neural models at different levels
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.genetic-programming-and-neuroevolution
  markdown: Neuroevolution can optimize weights, connectivity, or both. Neural architecture search selects
    structural choices such as layer types and widths, potentially using evolutionary, reinforcement, or differentiable
    methods. Architecture search is therefore broader than one particular evolutionary algorithm.
  text_mode: Neuroevolution can optimize weights, connectivity, or both. Neural architecture search selects
    structural choices such as layer types and widths, potentially using evolutionary, reinforcement, or differentiable
    methods. Architecture search is therefore broader than one particular evolutionary algorithm.
  bridges: []
- id: genetic-programming-and-neuroevolution.s3
  title: Separate outer search from inner fitting
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.genetic-programming-and-neuroevolution
  markdown: A candidate architecture may require training before its validation fitness is measured. Evaluating
    100 candidates for ten training hours each uses roughly 1,000 candidate-hours before overhead, even if
    the final model trains in ten hours. Search cost belongs in the report.
  text_mode: A candidate architecture may require training before its validation fitness is measured. Evaluating
    100 candidates for ten training hours each uses roughly 1,000 candidate-hours before overhead, even if
    the final model trains in ten hours. Search cost belongs in the report.
  bridges: []
- id: genetic-programming-and-neuroevolution.s4
  title: Prevent selection from consuming the test
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.genetic-programming-and-neuroevolution
  markdown: Repeatedly choosing architectures by final-test performance leaks evaluation information into design.
    Use appropriate validation and a held-out final assessment. Shared-weight or short-training proxies can
    reduce cost but may rank candidates differently from fully independent training.
  text_mode: Repeatedly choosing architectures by final-test performance leaks evaluation information into
    design. Use appropriate validation and a held-out final assessment. Shared-weight or short-training proxies
    can reduce cost but may rank candidates differently from fully independent training.
  bridges: []
