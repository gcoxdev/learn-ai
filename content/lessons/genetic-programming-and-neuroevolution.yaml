assessment_families:
- id: genetic-programming-and-neuroevolution.base
  objective_ref: objective.genetic-programming-and-neuroevolution
  task: base
  response_type: single_choice
  points: 1
  hint: 'Search neural models at different levels: trace the inputs, operation, and result before choosing.'
  remediation_scene: genetic-programming-and-neuroevolution.s2
  variants:
  - id: genetic-programming-and-neuroevolution.base.1
    prompt: What can a genetic-programming subtree mutation change?
    options:
    - id: a
      text: A portion of the executable expression
    - id: b
      text: Only the output font
    - id: c
      text: Every label’s truth automatically
    answer: a
    feedback: Program structure is the search representation.
  - id: genetic-programming-and-neuroevolution.base.2
    prompt: Must all architecture search be evolutionary?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if networks have layers
    - id: a
      text: 'No'
    answer: a
    feedback: NAS includes several optimization approaches.
- id: genetic-programming-and-neuroevolution.transfer
  objective_ref: objective.genetic-programming-and-neuroevolution
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Prevent selection from consuming the test: trace the inputs, operation, and result before choosing.'
  remediation_scene: genetic-programming-and-neuroevolution.s4
  variants:
  - id: genetic-programming-and-neuroevolution.transfer.1
    prompt: 100 candidates at 10 training hours each use roughly how many candidate-hours?
    options:
    - id: b
      text: '10'
    - id: c
      text: '100'
    - id: a
      text: 1,000
    answer: a
    feedback: Total search work includes each candidate evaluation.
  - id: genetic-programming-and-neuroevolution.transfer.2
    prompt: Why reserve an independent final test after architecture search?
    options:
    - id: c
      text: Only parameter counts require tests
    - id: a
      text: Selection has already used validation feedback
    - id: b
      text: The best validation model is guaranteed universal
    answer: a
    feedback: Final evaluation should measure beyond search-specific optimization.
