          - objective.evolutionary-search
      - anyOf:
          - objective.neural-training-loop
scenes:
  - id: genetic-programming-and-neuroevolution.s1
    title: A formula hiding in four numbers
    type: explanation
    depth: intuition
    objective_refs:
      - objective.genetic-programming-and-neuroevolution
    markdown: |-
      In 2009 Michael Schmidt and Hod Lipson filmed swinging pendulums and fed the tracked positions to a program. With no physics built in, it returned formulas for conserved quantities such as energy. The program evolved *formulas*, not bit strings.

      Try a small version. Four measurements came from a hidden rule:

      | x | 0 | 1 | 2 | 3 |
      | --- | ---: | ---: | ---: | ---: |
      | y | 1 | 3 | 7 | 13 |

      **Genetic programming (GP)**, popularized by John Koza's 1992 book, evolves programs written as **expression trees**. Inner nodes are operations (add, multiply); leaves are inputs or constants. The tree `add(mul(x, x), 1)` means $x^2 + 1$. Its fitness is its total error on the data:

      | Candidate | Outputs at x = 0, 1, 2, 3 | Total error |
      | --- | --- | ---: |
      | mom: $x^2 + 1$ | 1, 2, 5, 10 | 0 + 1 + 2 + 3 = 6 |
      | dad: $(x + 1) \cdot x$ | 0, 2, 6, 12 | 1 + 1 + 1 + 1 = 4 |

      Lower error means fitter, so dad wins a tournament against mom. Searching for a formula this way is called **symbolic regression**.
  - id: genetic-programming-and-neuroevolution.s2
    title: Swap branches, then watch programs bloat
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.genetic-programming-and-neuroevolution
    markdown: |-
      Bit strings cross over at a cut point. Trees use **subtree crossover**: pick a branch in each parent and swap them. Replace mom's leaf `1` with dad's branch `add(x, 1)`, and the child is `add(mul(x, x), add(x, 1))`, which is $x^2 + x + 1$. **Subtree mutation** is similar: replace a random branch with a freshly generated one.

      ```python run
      data = [(0, 1), (1, 3), (2, 7), (3, 13)]      # hidden rule: y = x*x + x + 1

      def run(tree, x):                             # a tree is "x", a number, or (op, left, right)
          if tree == "x":
              return x
          if not isinstance(tree, tuple):
              return tree
          op, left, right = tree
          a, b = run(left, x), run(right, x)
          return a + b if op == "add" else a * b

      def error(tree):                              # total absolute error: lower is fitter
          return sum(abs(run(tree, x) - y) for x, y in data)

      def size(tree):                               # number of nodes
          return 1 if not isinstance(tree, tuple) else 1 + size(tree[1]) + size(tree[2])

      mom = ("add", ("mul", "x", "x"), 1)           # x*x + 1
      dad = ("mul", ("add", "x", 1), "x")           # (x + 1)*x
      child = (mom[0], mom[1], dad[1])              # subtree crossover: mom's "1" <- dad's (x + 1)
      bloated = ("add", child, ("mul", 0, ("add", "x", ("mul", "x", "x"))))

      for name, t in [("mom", mom), ("dad", dad), ("child", child), ("bloated", bloated)]:
          outputs = [run(t, x) for x, _ in data]
          print(f"{name:8} size {size(t):2}  outputs {outputs}  error {error(t)}")
      ```

      The child fits exactly, with error 0 and 7 nodes. Now look at `bloated`: also error 0, but 15 nodes, because it adds $0 \times (\ldots)$, a branch that can never matter.

      That's **bloat**: GP trees tend to grow over the generations without getting fitter. Dead branches protect a tree from harmful crossover, since swaps landing in them change nothing, so they spread. Bloated programs run slower and are harder to read. Two standard fixes are a cap on tree depth and **parsimony pressure**: a small fitness penalty per node.

      :::try Add parsimony pressure
      Change `error` to return the total error plus `0.1 * size(tree)`. The child now scores 0.7 and `bloated` 1.5, so selection prefers the short program.
      :::
  - id: genetic-programming-and-neuroevolution.s3
    title: "NEAT: grow the network, and number its genes"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.genetic-programming-and-neuroevolution
    markdown: |-
      **Neuroevolution** evolves neural networks: their weights, their wiring, or both. Evolving wiring raises a puzzle: two networks may list similar connections in different orders, so naive crossover splices mismatched parts.

      **NEAT** (NeuroEvolution of Augmenting Topologies; Kenneth Stanley and Risto Miikkulainen, 2002) solved this with three ideas:

      1. **Start minimal.** Networks begin with inputs wired straight to outputs; mutations add connections and hidden nodes.
      2. **Innovation numbers.** Each new connection gets the next number from a global counter, so genes with the same number share an origin and line up for crossover.
      3. **Speciation.** Similar networks form species and compete mainly within them, giving a new structure time to tune its weights.

      Genome A has connection genes numbered 1, 2, 3, 5; genome B has 1, 2, 4, 5, 6. Genes 1, 2, and 5 match. Genes 3 and 4 are **disjoint** (missing from the other genome but inside its range). Gene 6 is **excess** (beyond A's highest number).

      :::papers NEAT's compatibility distance
      $$\delta = \frac{c_1 E}{N} + \frac{c_2 D}{N} + c_3 \bar{W}$$

      $E$ counts excess genes, $D$ disjoint genes, $\bar{W}$ is the average weight difference of matching genes, and $N$ is the size of the larger genome (set to 1 for small genomes, as here). Most of the paper's experiments used $c_1 = c_2 = 1$, $c_3 = 0.4$, and a species threshold $\delta_t = 3.0$.
      :::

      :::predict If the matching genes' weights differ by 0.5 on average, are A and B in the same species?
      $\delta = 1 + 2 + 0.4 \times 0.5 = 3.2$, which exceeds 3.0, so they're placed in different species. If B lacked gene 6, $\delta = 0 + 2 + 0.2 = 2.2$ and they would share one.
      :::
  - id: genetic-programming-and-neuroevolution.es
    title: Evolution strategies as an alternative to RL
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.genetic-programming-and-neuroevolution
    markdown: |-
      In 2017 Tim Salimans and colleagues at OpenAI trained robot-walking and Atari policies with no backpropagation. Their evolution strategy treats a policy network's weights $\theta$ as one candidate, tries noisy copies, and moves toward those that scored well.

      Take a one-weight policy with $\theta = 0$ and noise scale $\sigma = 0.1$. Try one mirrored pair, $\epsilon = +1$ and $\epsilon = -1$: the policy at $\theta = 0.1$ earns return 5, and at $\theta = -0.1$ earns 3. The estimated direction of improvement is

      $$g = \frac{1}{n\sigma} \sum_{i=1}^{n} F_i\,\epsilon_i = \frac{5 \times 1 + 3 \times (-1)}{2 \times 0.1} = 10$$

      With learning rate $\alpha = 0.01$, the update $\theta \leftarrow \theta + \alpha g$ moves $\theta$ to 0.1, toward the better copy. Each $F_i$ is a whole episode's return, as in the RL lessons, but ES perturbs the *weights* rather than sampling *actions*, so it needs no gradients through the network.

      The payoff is parallelism. Workers share random seeds, so each can rebuild everyone's noise and only needs to broadcast one number, its return. With over a thousand CPU workers, the paper reports solving 3-D humanoid walking in 10 minutes. The cost is sample efficiency: ES typically uses more episodes than good RL methods.
  - id: genetic-programming-and-neuroevolution.llm
    title: A language model as the mutation operator
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.genetic-programming-and-neuroevolution
    markdown: |-
      Random subtree swaps rarely produce clever code. DeepMind's **FunSearch** (2023) used a language model instead: show it a few good programs from a database, ask for a better variant, score it with an automatic evaluator, and store it. FunSearch found a cap set of size 512 in dimension 8, larger than any previously known construction, and bin-packing heuristics that beat standard ones.

      **AlphaEvolve** (2025) scaled the loop to whole code files using Gemini models. Among its reported results: a way to multiply two 4×4 complex-valued matrices with 48 scalar multiplications, improving on Strassen's 1969 method, and a data-center scheduling heuristic that recovers about 0.7% of Google's worldwide compute.

      :::mixup "The language model discovered the algorithm on its own."
      The model proposes; the evaluator decides. Most proposals are wrong or worse, and the evolutionary loop keeps only what scores well. Without a fast, trustworthy evaluator, as for "write a better novel," this approach has nothing to select on.
      :::
    diagram:
      caption: The FunSearch and AlphaEvolve loop. The language model plays the role of mutation and crossover.
      description: A program database sends a few high-scoring programs into a prompt. The language model reads the prompt and proposes a new program. An automatic evaluator runs the program and scores it. Scored programs go back into the database, and the loop repeats.
      nodes:
        - id: db
          label: Program database
          note: scored programs
          col: 0
          row: 1
          tone: data
        - id: prompt
          label: Prompt
          note: a few good programs
          col: 0
          row: 0
        - id: llm
          label: Language model
          note: proposes a variant
          col: 1
          row: 0
          tone: accent
        - id: eval
          label: Evaluator
          note: runs and scores it
          col: 1
          row: 1
          tone: warn
      edges:
        - from: db
          to: prompt
          label: sample parents
        - from: prompt
          to: llm
        - from: llm
          to: eval
          label: new program
        - from: eval
          to: db
          label: store with score
  - id: genetic-programming-and-neuroevolution.s4
    title: Count the search, guard the test
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.genetic-programming-and-neuroevolution
    markdown: |-
      Evolution can also search network *architectures*: layer types, widths, connections. Esteban Real and colleagues at Google evolved image classifiers this way (AmoebaNet, 2019), using tournament selection that removes the oldest candidate instead of the worst.

      Every candidate architecture must be trained before it can be scored. Evaluating 100 candidates at 10 GPU-hours each costs 1,000 GPU-hours, even though the final model trains in 10. Report the search cost with the result.

      Selection also uses up data. If you pick the best of 100 architectures by their validation scores, the winner's validation score is flattering, for the same reason as the winner's curse in hyperparameter tuning. Score the final choice once on a test set the search never touched.
  - id: genetic-programming-and-neuroevolution.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.genetic-programming-and-neuroevolution
    markdown: Evaluate expression trees and NEAT distances by hand, then choose methods for a battery-fade formula, a game controller, a code-optimizing loop, and an architecture search.
    takeaway: |-
      Genetic programming evolves program trees; neuroevolution evolves network weights or wiring. Language models can now act as the mutation step, but an evaluator still decides, and the search's cost and test data must be counted.
  - id: genetic-programming-and-neuroevolution.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.genetic-programming-and-neuroevolution
    markdown: |-
      Genetic programming searches programs; neuroevolution searches neural weights or structure. Count the cost of selecting a model as well as the cost of training the final choice.
