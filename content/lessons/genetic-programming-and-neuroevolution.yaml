        options:
          - id: b
            text: '10'
          - id: c
            text: '100'
          - id: a
            text: 1,000
        answer: a
        feedback: Total search work includes each candidate evaluation.
        retired: true
      - id: genetic-programming-and-neuroevolution.transfer.2
        prompt: Why reserve an independent final test after architecture search?
        options:
          - id: c
            text: Only parameter counts require tests
          - id: a
            text: Selection has already used validation feedback
          - id: b
            text: The best validation model is guaranteed universal
        answer: a
        feedback: Final evaluation should measure beyond search-specific optimization.
        retired: true
  - id: genetic-programming-and-neuroevolution.base.v2
    objective_ref: objective.genetic-programming-and-neuroevolution
    task: base
    response_type: single_choice
    points: 1
    hint: Think about the representation each method changes. GP swaps branches of trees, NEAT lines up genes by innovation number, and ES nudges all weights toward noisy copies that scored well.
    remediation_scene: genetic-programming-and-neuroevolution.s3
    variants:
      - id: genetic-programming-and-neuroevolution.base.v2.1
        prompt: A GP run's best program keeps its error but grows from 12 to 80 nodes over 50 generations, mostly branches like `mul(0, …)`. What is happening, and what is a standard fix?
        options:
          - id: b
            text: Overfitting; add more data points so larger trees are needed
          - id: a
            text: Bloat; add a small fitness penalty for each node in the tree
          - id: c
            text: Premature convergence; raise the mutation rate on constants
        answer: a
        feedback: Growth without better fitness, full of branches that can never matter, is bloat. Parsimony pressure or a depth cap counters it. Overfitting would show up as a better fit to the training points that fails on new ones, which isn't what's described.
      - id: genetic-programming-and-neuroevolution.base.v2.2
        prompt: Why does NEAT give each new connection gene an innovation number?
        options:
          - id: c
            text: To rank connections by importance so weak ones can be pruned
          - id: b
            text: To set each connection's starting weight from a counter
          - id: a
            text: To line up genes that share an origin when two genomes cross over
        answer: a
        feedback: Innovation numbers are historical markings. Genes with the same number descend from the same mutation, so crossover can match them without comparing network shapes. They carry no information about importance or weight.
      - id: genetic-programming-and-neuroevolution.base.v2.3
        prompt: In Salimans et al.'s evolution strategy, how does the policy's weight vector θ change after each batch of noisy copies is scored?
        options:
          - id: a
            text: It moves toward the noise directions whose copies earned higher returns
          - id: b
            text: It is replaced by the single best-scoring noisy copy from the batch
          - id: c
            text: It follows the gradient of the return computed by backpropagation
        answer: a
        feedback: The update adds a weighted sum of noise vectors, each weighted by its return, so θ drifts toward directions that helped. Jumping to the single best copy would be a hill-climbing rule, and the method's point is that it needs no backpropagation through the network.
      - id: genetic-programming-and-neuroevolution.base.v2.4
        prompt: NEAT groups networks into species that compete mainly among themselves. What problem does this solve?
        options:
          - id: b
            text: It lets networks of different species cross over more often
          - id: a
            text: A new structure scores poorly at first and would be eliminated early
          - id: c
            text: Large networks run slowly, so they need a separate compute queue
        answer: a
        feedback: Adding a node or connection usually hurts fitness until its weights are tuned. Competing within a species protects that innovation long enough to prove itself. Speciation actually reduces crossover between very different networks.
  - id: genetic-programming-and-neuroevolution.transfer.v2
    objective_ref: objective.genetic-programming-and-neuroevolution
    task: transfer
    response_type: single_choice
    points: 1
    hint: Match the method to what is being searched (a formula, a policy's weights, a program with a scorer, an architecture), and ask what the search has already used up.
    remediation_scene: genetic-programming-and-neuroevolution.s4
    variants:
      - id: genetic-programming-and-neuroevolution.transfer.v2.1
        prompt: An engineer wants a readable formula for how a battery's capacity fades with charge cycles and temperature, from 200 lab measurements. Which approach fits?
        options:
          - id: c
            text: Neuroevolution of a network's wiring with NEAT
          - id: a
            text: Genetic programming for symbolic regression with parsimony pressure
          - id: b
            text: An evolution strategy over the weights of a large policy network
        answer: a
        feedback: A readable formula is an expression tree, which is exactly what symbolic regression searches, and parsimony pressure keeps it short. NEAT and ES both produce networks, which can fit the data but won't give a compact formula.
      - id: genetic-programming-and-neuroevolution.transfer.v2.2
        prompt: A studio wants to train a game-playing policy and has 2,000 cheap CPU machines but few GPUs. Episodes are fast to simulate. Why might an evolution strategy suit them?
        options:
          - id: a
            text: Workers only exchange returns, so it spreads well across many CPUs
          - id: b
            text: It needs fewer episodes than any reinforcement learning method
          - id: c
            text: It computes exact gradients, so it needs no simulator at all
        answer: a
        feedback: With shared random seeds, each worker only broadcasts a scalar return, so ES scales across many CPUs. It usually needs *more* episodes than good RL methods, and it relies entirely on running the simulator.
      - id: genetic-programming-and-neuroevolution.transfer.v2.3
        prompt: A team wants to copy the FunSearch approach to improve a compiler's register-allocation heuristic. What must they have before starting?
        options:
          - id: b
            text: A language model trained specifically on register allocation
          - id: c
            text: A proof that the current heuristic is already near-optimal
          - id: a
            text: A fast, automatic way to score any proposed heuristic
        answer: a
        feedback: The loop selects on scores, so an automatic evaluator (compile benchmarks, measure speed and correctness) is essential. FunSearch used a general code model, and it doesn't need any proof about the current heuristic.
      - id: genetic-programming-and-neuroevolution.transfer.v2.4
        prompt: An evolved architecture scores 94.1% on the validation set that guided 300 generations of selection. The team wants to publish its accuracy. What should they report?
        options:
          - id: c
            text: The 94.1% validation score, since it was measured on held-out images
          - id: a
            text: One score on a test set the search never used, plus the search cost
          - id: b
            text: The average validation score across all 300 generations of the search
        answer: a
        feedback: Selection used the validation set thousands of times, so the winner's 94.1% is optimistically biased. A single untouched test score is honest, and the GPU-hours spent searching belong in the report. Averaging over generations still reuses the same data.
  - id: genetic-programming-and-neuroevolution.calculate
    objective_ref: objective.genetic-programming-and-neuroevolution
    task: base
    response_type: numeric
    points: 1
    hint: For a tree, evaluate the innermost branches first and work outward. For NEAT, add excess, disjoint, and 0.4 times the average weight difference. For ES, weight each noise value by its return, add, and divide by nσ.
    remediation_scene: genetic-programming-and-neuroevolution.s2
    absolute_tolerance: 0.01
    variants:
      - id: genetic-programming-and-neuroevolution.calculate.1
        prompt: What does the tree `add(mul(x, x), add(x, 1))` return at x = 4?
        answer: 21
        feedback: mul(4, 4) = 16 and add(4, 1) = 5, so the tree returns 16 + 5 = 21.
      - id: genetic-programming-and-neuroevolution.calculate.2
        prompt: The data points are (0, 1), (1, 3), (2, 7), (3, 13). What is the total absolute error of the tree `mul(x, add(x, 2))`, which computes x(x + 2)?
        answer: 4
        feedback: "Outputs are 0, 3, 8, 15. Errors: |0 − 1| + |3 − 3| + |8 − 7| + |15 − 13| = 1 + 0 + 1 + 2 = 4."
      - id: genetic-programming-and-neuroevolution.calculate.3
        prompt: Two small NEAT genomes have 2 excess genes, 1 disjoint gene, and an average weight difference of 1.0 on matching genes. With c₁ = c₂ = 1, c₃ = 0.4, and N = 1, what is their compatibility distance δ?
        answer: 3.4
        feedback: δ = 2 + 1 + 0.4 × 1.0 = 3.4, above the 3.0 threshold, so they belong to different species.
      - id: genetic-programming-and-neuroevolution.calculate.4
        prompt: An evolution strategy uses σ = 0.5 and one mirrored pair, ε = +1 and ε = −1. The copies earn returns 8 and 2. What is the estimate g = (1/(nσ)) Σ Fᵢεᵢ?
        answer: 6
        feedback: g = (8 × 1 + 2 × (−1)) / (2 × 0.5) = 6 / 1 = 6.
      - id: genetic-programming-and-neuroevolution.calculate.5
        prompt: An architecture search trains 60 candidates for 8 GPU-hours each, then trains the winner for 8 more GPU-hours. How many GPU-hours did the whole project use?
        answer: 488
        feedback: The search costs 60 × 8 = 480 GPU-hours, and the final training adds 8, for 488. The final model's 8 hours is under 2% of the total.
