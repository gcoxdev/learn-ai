objectives:
- id: objective.genetic-programming-and-neuroevolution
  version: 1-draft
  statement: Genetic programming searches executable structures, neuroevolution searches neural parameters
    or topology, and architecture search must separate candidate selection from independent evaluation.
  depths:
  - intuition
  - mechanics
  critical: true
