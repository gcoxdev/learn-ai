schema_version: 0.2-draft
lesson:
  id: data-and-examples
  version: 0.4.0-draft
  title: 'Data and examples: what a computer can learn from'
  summary: Photo search learned what a dog looks like from pictures. Build a tiny collection of your own and find out what makes examples helpful, or quietly misleading.
  state: draft
  slot: M00.3
  category: common
  archetype: foundation
  sources:
    - title: Dive into Deep Learning — introduction
      url: https://d2l.ai/chapter_introduction/index.html
objectives:
  - id: objective.data-and-examples
    version: 3-draft
    statement: Data means recorded information. A dataset is a collection of examples. A label or target supplies an answer to check when the learning task uses one.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - data-and-examples.base
      - data-and-examples.transfer.v3
    prerequisites:
      - anyOf:
          - objective.inputs-and-outputs
scenes:
  - id: data-and-examples.s1
    title: Start with things you've written down
    type: explanation
    depth: intuition
    objective_refs:
      - objective.data-and-examples
    markdown: |-
      In the first lesson you met spam filters that learn from messages people have marked as junk. Every one of those marked messages was written down somewhere, and that's where learning starts.

      Let's make our own. You photograph three buttons and jot down each color. Those photos and notes are **data**: information that has been recorded. Data can be words, pictures, sounds, or numbers. It doesn't have to be a giant spreadsheet.

      A **dataset** is a collection of examples kept together for a purpose. Ours is tiny:

      | Photo | Note |
      | --- | --- |
      | button1.jpg | red |
      | button2.jpg | blue |
      | button3.jpg | red |

      Three examples, one per button. The collections behind real photo search hold millions of pictures, but the idea is the same.
  - id: data-and-examples.s2
    title: What counts as one example?
    type: explanation
    depth: intuition
    objective_refs:
      - objective.data-and-examples
    markdown: |-
      One **example** is one item the program works on, such as a single button photo. That sounds obvious until a photo holds more than one button.

      :::predict A photo shows six buttons. How many examples is it?
      It depends on the task. If the job is "name a button's color," each button is its own example, so you'd crop the photo into six. If the job is "count the buttons in a photo," the whole photo is one example, and its answer is 6.
      :::

      Deciding what one example is comes before anything else. For our first sorter, we'll use photos with exactly one button each, so every photo lines up with exactly one answer.
  - id: data-and-examples.s3
    title: A label is an answer attached to an example
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.data-and-examples
    markdown: |-
      The notes "red" and "blue" in our table are **labels**: answers attached to examples. They tell you what the right output would be.

      A **target** is the right answer you want the program's output to match. For our color task, the label is the target. Targets can also be numbers. If you recorded how long each of your bike rides to school took, a 12-minute ride would have a target of 12.

      | Task | One example | Its target |
      | --- | --- | --- |
      | Name the button color | One button photo | "red" |
      | Spot junk mail | One email | "junk" |
      | Predict ride time | One bike ride | 12 minutes |

      Labels are what let you check a program's answer. Cover the label, ask the program, and compare.
  - id: data-and-examples.s4
    title: Keep the answer out of the question
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.data-and-examples
    markdown: |-
      Suppose you test a sorter, and it gets every photo right. Impressive! Then you notice the files are named `red-button-1.jpg` and `blue-button-2.jpg`. You rename them `photo1.jpg`, `photo2.jpg`, and so on, and the score drops sharply.

      The sorter may have been reading the file name instead of looking at the colors. When the answer sneaks into the input by accident, it's called **leakage**. It makes a test look great while testing the wrong skill.

      Think of a spelling quiz with each answer printed faintly under its question. You'd score perfectly without learning to spell. So when you test, give the program only what it would really have, and keep the label hidden until you compare.
  - id: data-and-examples.s5
    title: Wrong labels and missing cases
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.data-and-examples
    markdown: |-
      Labels can be wrong. If someone writes "blue" under a red button, the collection now teaches the wrong answer. Check a handful of labels by hand; mistakes are common.

      Collections can also be lopsided. Compare these two:

      | Collection | What's in it |
      | --- | --- |
      | A | 1,000 photos of red and blue buttons, all on a bright table |
      | B | 200 photos: bright, shadowed, faded, and on patterned cloth |

      Collection A is five times bigger, but it can't teach anything about shadows, because there are no shadows in it.

      :::mixup "More data always fixes it."
      More data helps only when it adds what's missing. A thousand more bright photos still say nothing about dim light, and copying a photo ten times adds no new information at all. When a sorter fails on some kind of case, collect examples of *that* case.
      :::
  - id: data-and-examples.s6
    title: Build your own tiny collection
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.data-and-examples
    markdown: |-
      :::try Make a dataset on paper
      Draw four shapes: two circles and two squares. Under each, write its shape name. You now have a dataset of four examples with four labels, for the task "name the shape."

      Now fold the paper so the labels are hidden and ask a friend to name each shape. Unfold it and compare. You just ran a test.
      :::

      Here's a twist. Suppose you change the task to "name the color" of each shape. Your labels say "circle" and "square," so they can't check color answers. The drawings are still useful, but you'd need new labels. Examples and labels have to match the job you want done.

      Next, we'll use examples like these to build a model: a small rule that turns an input into a prediction.
  - id: data-and-examples.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.data-and-examples
    markdown: Bird calls, leaf photos, dog breeds, and house prices ask you to spot the dataset, the label, and the hidden problems in a collection.
    takeaway: |-
      Data is recorded information, and a dataset is a collection of examples. A label is the right answer attached to an example, and a good collection covers the cases you care about without leaking the answer.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - data-and-examples.s1
        - data-and-examples.s2
        - data-and-examples.s3
        - data-and-examples.s4
        - data-and-examples.s5
        - data-and-examples.s6
        - data-and-examples.check
      gate_refs:
        - gate.core
  scene_aliases: {}
assessment_families:
  - id: data-and-examples.base
    objective_ref: objective.data-and-examples
    task: base
    response_type: single_choice
    points: 1
    variants:
      - id: data-and-examples.base.v2.1
        prompt: You collect four sound clips to study bird calls. What is the dataset?
        options:
          - id: a
            text: The collection of four clips
          - id: b
            text: One individual recording from the collection
          - id: c
            text: The name attached to one recorded bird call
        answer: a
        feedback: "A dataset is the whole collection, here all four clips. One clip on its own is a single example, and a bird's name attached to it would be a label."
      - id: data-and-examples.base.v2.2
        prompt: A picture has the word “square” attached for a shape task. What is that word doing?
        options:
          - id: b
            text: Supplying the image that needs a name
          - id: c
            text: Supplying steps to find a shape in the image
          - id: a
            text: Supplying a label for the example
        answer: a
        feedback: "The word \"square\" is the right answer attached to the picture, which makes it a label. The picture itself is the example, and a label gives no steps for finding anything."
      - id: data-and-examples.base.v2.3
        prompt: A delivery example records an actual time of twelve minutes. What could be its target?
        options:
          - id: c
            text: The time proposed before the trip began
          - id: a
            text: The recorded twelve-minute duration
          - id: b
            text: The distance measured before the trip
        answer: a
        feedback: "The target is the real, recorded answer: 12 minutes. A time guessed before the trip would be a prediction, and the distance is part of the input."
      - id: data-and-examples.base.v2.4
        prompt: You switch from naming shapes to naming colors. Which action updates the examples for the new task?
        options:
          - id: a
            text: Replace the shape labels with labels for the colors
          - id: b
            text: Keep the existing shape labels as the color answers
          - id: c
            text: Rename the task and treat the unchanged labels as color labels
        answer: a
        feedback: "Labels have to answer the question being asked. Shape names can't check color answers, and renaming the task doesn't change what the labels say."
      - id: data-and-examples.base.v2.5
        prompt: Each recording in a collection has a bird name attached. What is the bird name used as?
        options:
          - id: a
            text: The recording’s sound samples
          - id: b
            text: The procedure that records the sound
          - id: c
            text: A label for the recording
        answer: c
        feedback: "The bird name is the answer attached to each recording, so it's the label. The sound itself is the example, and making the recording is a separate job."
      - id: data-and-examples.base.v2.6
        prompt: A shop keeps 20 records, each containing a parcel’s weight and observed delivery time. What is the collection of records?
        options:
          - id: a
            text: A dataset
          - id: b
            text: A single target value
          - id: c
            text: A rule for predicting the time
        answer: a
        feedback: The dataset is the collection. One delivery time can be a target; the collection is not itself the prediction rule.
    hint: "Keep three things apart: the whole collection (the dataset), one item in it (an example), and the right answer attached to that item (its label or target)."
    remediation_scene: data-and-examples.s3
  - id: data-and-examples.transfer
    objective_ref: objective.data-and-examples
    task: transfer
    response_type: single_choice
    points: 1
    variants:
      - id: data-and-examples.transfer.v2.1
        prompt: A color test includes “red” in each red picture’s filename. What could make the score misleading?
        options:
          - id: b
            text: The program may compare its answers with labels
          - id: c
            text: The program may process pictures one at a time
          - id: a
            text: The program may use the filename clue
        answer: a
        feedback: The answer can leak through the filename rather than being recognized from the image.
        retired: true
      - id: data-and-examples.transfer.v2.2
        prompt: A collection contains many copies of one bright button. What would add useful variety?
        options:
          - id: c
            text: The same picture saved under different names
          - id: a
            text: Pictures of other buttons in shadow
          - id: b
            text: More copies of the same bright picture
        answer: a
        feedback: Variety should represent conditions missing from the collection.
        retired: true
      - id: data-and-examples.transfer.v2.3
        prompt: A red button is labeled blue. Which description is most helpful?
        options:
          - id: a
            text: A recorded answer needs correction
          - id: b
            text: The recorded label proves the button is blue
          - id: c
            text: The picture must be changed to match its label
        answer: a
        feedback: Labels can be mistaken; check their connection to the actual example.
        retired: true
      - id: data-and-examples.transfer.v2.4
        prompt: A photo holds six buttons. What must you decide before counting examples?
        options:
          - id: b
            text: Whether six objects must count as six examples
          - id: c
            text: Whether one file must count as one example
          - id: a
            text: Whether an example is a photo or a button
        answer: a
        feedback: The unit of analysis determines what one example means.
        retired: true
      - id: data-and-examples.transfer.v2.5
        prompt: To predict delivery time before departure, a record includes the final arrival time as an input. Why is that a problem?
        options:
          - id: a
            text: It supplies an answer-related clue unavailable at departure
          - id: b
            text: It gives the predictor another valid starting measurement
          - id: c
            text: It changes the task into predicting parcel weight
        answer: a
        feedback: An input unavailable when the real prediction is made can make a practice score misleading.
        retired: true
      - id: data-and-examples.transfer.v2.6
        prompt: A shape task becomes a color task. A red triangle is still labeled “triangle.” What needs review?
        options:
          - id: a
            text: Whether the same photo can be stored twice
          - id: b
            text: Whether the label answers the new color question
          - id: c
            text: Whether the filename is short enough to read
        answer: b
        feedback: A label must fit the task. “Triangle” names a shape, while this task asks for a color.
        retired: true
    hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
    remediation_scene: data-and-examples.s3
  - id: data-and-examples.transfer.v3
    objective_ref: objective.data-and-examples
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask whether each example and label truly fits the job, whether the collection covers the cases you care about, and whether the answer could sneak in through the input.
    remediation_scene: data-and-examples.s4
    variants:
      - id: data-and-examples.transfer.v3.1
        prompt: A plant app scores very well at spotting sick leaves. Then you notice every sick-leaf photo was taken in front of the same yellow greenhouse wall. What could make the score misleading?
        options:
          - id: a
            text: The app may have been shown too many leaves overall
          - id: b
            text: The app may be spotting the yellow wall, not the illness
          - id: c
            text: The healthy leaves may have been photographed too clearly
        answer: b
        feedback: If the wall appears only behind sick leaves, it gives away the answer, just like a file name that says "red." Clearer healthy photos or a bigger collection wouldn't create that shortcut.
      - id: data-and-examples.transfer.v3.2
        prompt: A dog-breed collection has 900 golden retriever photos and only 10 poodle photos. The app keeps missing poodles. What would most improve the collection?
        options:
          - id: a
            text: Copy the 10 poodle photos until there are 900 of them
          - id: b
            text: Add 900 more golden retriever photos to the collection
          - id: c
            text: Add many new poodle photos taken in different settings
        answer: c
        feedback: The app fails on poodles, so it needs new poodle examples showing real variety. Copies of the same 10 photos add no new information, and more retrievers add more of what it already has.
      - id: data-and-examples.transfer.v3.3
        prompt: A volunteer labels a photo of a wolf as "husky." Which description is most accurate?
        options:
          - id: c
            text: The photo should be edited to match its label
          - id: b
            text: The animal is a husky, since that is its label
          - id: a
            text: A recorded answer is wrong and needs fixing
        answer: a
        feedback: Labels are written by people, so they can be wrong. The fix is to correct the label. The label doesn't change what's in the photo, and editing the photo would make the data false.
      - id: data-and-examples.transfer.v3.4
        prompt: Each song in a collection is labeled "happy" or "sad." You switch the task to predicting each song's speed in beats per minute. What needs to change?
        options:
          - id: c
            text: Each song needs a new target, its measured speed
          - id: b
            text: Nothing, because the songs themselves are the same
          - id: a
            text: Count "happy" as fast and "sad" as slow from now on
        answer: c
        feedback: A label must answer the question being asked. Mood labels don't give speeds, and guessing that happy means fast would bake a made-up rule into the answers.
      - id: data-and-examples.transfer.v3.5
        prompt: A dataset for predicting a house's price before it goes on sale includes a column with its final sale price as an input. What is wrong?
        options:
          - id: b
            text: It is extra detail that will make the predictions better
          - id: c
            text: Prices are numbers, so they can't be used as inputs
          - id: a
            text: It gives away the answer, which isn't known in advance
        answer: a
        feedback: This is leakage. The final price is exactly what you're trying to predict, and it won't exist when a real prediction is needed. Numbers are fine as inputs in general; this one just contains the answer.
      - id: data-and-examples.transfer.v3.6
        prompt: A single class photo shows 25 students. The task is to guess each student's age from their face. What is one example?
        options:
          - id: a
            text: The whole class photo, all at once
          - id: b
            text: One student's face from the photo
          - id: c
            text: The number of students, which is 25
        answer: b
        feedback: The task asks for one age per student, so each face is one example with its own target. The whole photo would be one example only if the task were about the class as a group.
