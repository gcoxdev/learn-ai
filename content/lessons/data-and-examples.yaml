schema_version: 0.2-draft
lesson:
  id: data-and-examples
  version: 0.3.0-draft
  title: 'Data and examples: what a computer can learn from'
  summary: Make a tiny collection of observations and see how an example differs from the answer used to check
    it.
  state: draft
  slot: M00.3
  category: common
  archetype: foundation
  sources:
  - title: Dive into Deep Learning — introduction
    url: https://d2l.ai/chapter_introduction/index.html
objectives:
- id: objective.data-and-examples
  version: 2-draft
  statement: Data means recorded information. A dataset is a collection of examples. A label or target supplies
    an answer to check when the learning task uses one.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - data-and-examples.base
  - data-and-examples.transfer
  prerequisites:
  - anyOf:
    - objective.inputs-and-outputs
scenes:
- id: data-and-examples.s1
  title: Start with things you have observed
  type: explanation
  depth: intuition
  objective_refs:
  - objective.data-and-examples
  markdown: 'You see three button pictures and write down their colors. Those pictures and notes are **data**:
    information that has been recorded. Data can be words, pictures, sounds, numbers, or other recorded information.
    It does not have to be a giant spreadsheet. A **dataset** is a collection of examples kept together for
    some purpose. Here our little dataset has three examples, one for each photographed button.'
  text_mode: 'You see three button pictures and write down their colors. Those pictures and notes are **data**:
    information that has been recorded. Data can be words, pictures, sounds, numbers, or other recorded information.
    It does not have to be a giant spreadsheet. A **dataset** is a collection of examples kept together for
    some purpose. Here our little dataset has three examples, one for each photographed button.'
- id: data-and-examples.s2
  title: Give each example a clear boundary
  type: explanation
  depth: intuition
  objective_refs:
  - objective.data-and-examples
  markdown: 'One **example** is one item we want to work on: perhaps a single button picture. If a picture
    contains six buttons, decide whether that whole picture is one example or whether each button is a separate
    example. The choice changes the job. For our first sorter, use pictures with one button each. Clear boundaries
    let us connect one supplied picture with the answer that belongs to it.'
  text_mode: 'One **example** is one item we want to work on: perhaps a single button picture. If a picture
    contains six buttons, decide whether that whole picture is one example or whether each button is a separate
    example. The choice changes the job. For our first sorter, use pictures with one button each. Clear boundaries
    let us connect one supplied picture with the answer that belongs to it.'
- id: data-and-examples.s3
  title: A label is an answer attached to an example
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data-and-examples
  markdown: 'Write “red” beside the first picture and “blue” beside the second. These words are **labels**:
    answers attached to examples. A **target** is the answer or value we want a proposed answer to match. For
    a color task, the color label is a target. For a delivery-time task, the target might be twelve minutes.
    These are different kinds of answers, but both can help check a result.'
  text_mode: 'Write “red” beside the first picture and “blue” beside the second. These words are **labels**:
    answers attached to examples. A **target** is the answer or value we want a proposed answer to match. For
    a color task, the color label is a target. For a delivery-time task, the target might be twelve minutes.
    These are different kinds of answers, but both can help check a result.'
- id: data-and-examples.s4
  title: Keep the answer out of the question
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data-and-examples
  markdown: 'When testing whether a sorter can name a color, show it the picture without showing the attached
    answer. Then compare what it says with your recorded answer. Giving it a filename called “red-button.jpg”
    may accidentally supply the answer through a shortcut. That can make a test look good without testing the
    picture skill you intended. Think of practicing spelling: seeing the answer on the same card changes what
    the exercise measures.'
  text_mode: 'When testing whether a sorter can name a color, show it the picture without showing the attached
    answer. Then compare what it says with your recorded answer. Giving it a filename called “red-button.jpg”
    may accidentally supply the answer through a shortcut. That can make a test look good without testing the
    picture skill you intended. Think of practicing spelling: seeing the answer on the same card changes what
    the exercise measures.'
- id: data-and-examples.s5
  title: Examples can be wrong or incomplete
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data-and-examples
  markdown: Suppose someone writes “blue” under a red picture by mistake. A label is recorded information,
    not a guarantee of truth. Suppose all the pictures are bright and clear. The collection tells us little
    about buttons in shadows. Check a few examples by hand, include different conditions, and say what the
    collection leaves out. Adding more copies of the same easy picture does not add the missing variety.
  text_mode: Suppose someone writes “blue” under a red picture by mistake. A label is recorded information,
    not a guarantee of truth. Suppose all the pictures are bright and clear. The collection tells us little
    about buttons in shadows. Check a few examples by hand, include different conditions, and say what the
    collection leaves out. Adding more copies of the same easy picture does not add the missing variety.
- id: data-and-examples.s6
  title: Build your own tiny collection
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data-and-examples
  markdown: 'Draw four shapes on paper: two circles and two squares. Under each, write its shape name. You
    now have four examples and four labels for a shape-naming task. Cover a label and ask someone to name that
    shape. If you instead ask for color, your shape labels are not the targets for the new task. This small
    activity shows why we choose examples and answers to match the job we want to learn.'
  text_mode: 'Draw four shapes on paper: two circles and two squares. Under each, write its shape name. You
    now have four examples and four labels for a shape-naming task. Cover a label and ask someone to name that
    shape. If you instead ask for color, your shape labels are not the targets for the new task. This small
    activity shows why we choose examples and answers to match the job we want to learn.'
- id: data-and-examples.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.data-and-examples
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Data means recorded information. A dataset is a collection of examples. A label or target supplies
    an answer to check when the learning task uses one.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - data-and-examples.s1
    - data-and-examples.s2
    - data-and-examples.s3
    - data-and-examples.s4
    - data-and-examples.s5
    - data-and-examples.s6
    - data-and-examples.check
    gate_refs:
    - gate.core
  scene_aliases: {}
assessment_families:
- id: data-and-examples.base
  objective_ref: objective.data-and-examples
  task: base
  response_type: single_choice
  points: 1
  variants:
  - id: data-and-examples.base.v2.1
    prompt: You collect four sound clips to study bird calls. What is the dataset?
    options:
    - id: a
      text: The collection of four clips
    - id: b
      text: One individual recording from the collection
    - id: c
      text: The name attached to one recorded bird call
    answer: a
    feedback: A dataset is the collection of recorded examples.
  - id: data-and-examples.base.v2.2
    prompt: A picture has the word “square” attached for a shape task. What is that word doing?
    options:
    - id: b
      text: Supplying the image that needs a name
    - id: c
      text: Supplying steps to find a shape in the image
    - id: a
      text: Supplying a label for the example
    answer: a
    feedback: The attached word supplies the answer used for this task.
  - id: data-and-examples.base.v2.3
    prompt: A delivery example records an actual time of twelve minutes. What could be its target?
    options:
    - id: c
      text: The time proposed before the trip began
    - id: a
      text: The recorded twelve-minute duration
    - id: b
      text: The distance measured before the trip
    answer: a
    feedback: The target is the observed answer the proposed answer will be checked against.
  - id: data-and-examples.base.v2.4
    prompt: You switch from naming shapes to naming colors. Which action updates the examples for the new task?
    options:
    - id: a
      text: Replace the shape labels with labels for the colors
    - id: b
      text: Keep the existing shape labels as the color answers
    - id: c
      text: Rename the task and treat the unchanged labels as color labels
    answer: a
    feedback: Shape labels do not supply color answers.
  - id: data-and-examples.base.v2.5
    prompt: Each recording in a collection has a bird name attached. What is the bird name used as?
    options:
    - id: a
      text: The recording’s sound samples
    - id: b
      text: The procedure that records the sound
    - id: c
      text: A label for the recording
    answer: c
    feedback: A label is an answer attached to an example for the chosen task.
  - id: data-and-examples.base.v2.6
    prompt: A shop keeps 20 records, each containing a parcel’s weight and observed delivery time. What is
      the collection of records?
    options:
    - id: a
      text: A dataset
    - id: b
      text: A single target value
    - id: c
      text: A rule for predicting the time
    answer: a
    feedback: The dataset is the collection. One delivery time can be a target; the collection is not itself
      the prediction rule.
  hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
  remediation_scene: data-and-examples.s3
- id: data-and-examples.transfer
  objective_ref: objective.data-and-examples
  task: transfer
  response_type: single_choice
  points: 1
  variants:
  - id: data-and-examples.transfer.v2.1
    prompt: A color test includes “red” in each red picture’s filename. What could make the score misleading?
    options:
    - id: b
      text: The program may compare its answers with labels
    - id: c
      text: The program may process pictures one at a time
    - id: a
      text: The program may use the filename clue
    answer: a
    feedback: The answer can leak through the filename rather than being recognized from the image.
  - id: data-and-examples.transfer.v2.2
    prompt: A collection contains many copies of one bright button. What would add useful variety?
    options:
    - id: c
      text: The same picture saved under different names
    - id: a
      text: Pictures of other buttons in shadow
    - id: b
      text: More copies of the same bright picture
    answer: a
    feedback: Variety should represent conditions missing from the collection.
  - id: data-and-examples.transfer.v2.3
    prompt: A red button is labeled blue. Which description is most helpful?
    options:
    - id: a
      text: A recorded answer needs correction
    - id: b
      text: The recorded label proves the button is blue
    - id: c
      text: The picture must be changed to match its label
    answer: a
    feedback: Labels can be mistaken; check their connection to the actual example.
  - id: data-and-examples.transfer.v2.4
    prompt: A photo holds six buttons. What must you decide before counting examples?
    options:
    - id: b
      text: Whether six objects must count as six examples
    - id: c
      text: Whether one file must count as one example
    - id: a
      text: Whether an example is a photo or a button
    answer: a
    feedback: The unit of analysis determines what one example means.
  - id: data-and-examples.transfer.v2.5
    prompt: To predict delivery time before departure, a record includes the final arrival time as an input.
      Why is that a problem?
    options:
    - id: a
      text: It supplies an answer-related clue unavailable at departure
    - id: b
      text: It gives the predictor another valid starting measurement
    - id: c
      text: It changes the task into predicting parcel weight
    answer: a
    feedback: An input unavailable when the real prediction is made can make a practice score misleading.
  - id: data-and-examples.transfer.v2.6
    prompt: A shape task becomes a color task. A red triangle is still labeled “triangle.” What needs review?
    options:
    - id: a
      text: Whether the same photo can be stored twice
    - id: b
      text: Whether the label answers the new color question
    - id: c
      text: Whether the filename is short enough to read
    answer: b
    feedback: A label must fit the task. “Triangle” names a shape, while this task asks for a color.
  hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
  remediation_scene: data-and-examples.s3
