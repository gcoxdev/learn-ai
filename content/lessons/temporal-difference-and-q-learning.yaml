schema_version: 0.2-draft
lesson:
  id: temporal-difference-and-q-learning
  version: 0.3.0-draft
  title: Update values from sampled transitions
  state: draft
  summary: Update a value estimate using a reward and the next situation.
  slot: M24.4
  category: learning
  sources:
  - title: Dive into Deep Learning — reinforcement learning
    url: https://d2l.ai/chapter_reinforcement-learning/index.html
objectives:
- id: objective.temporal-difference-and-q-learning
  version: 1-draft
  statement: Monte Carlo methods learn from completed returns, temporal-difference methods bootstrap from estimates,
    and Q-learning uses an off-policy greedy next-action target under defined convergence assumptions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - temporal-difference-and-q-learning.base
  - temporal-difference-and-q-learning.transfer
  prerequisites:
  - anyOf:
    - objective.mdps-and-bellman-equations
  - anyOf:
    - objective.monte-carlo
scenes:
- id: temporal-difference-and-q-learning.s1
  title: Wait for a return or bootstrap
  type: explanation
  depth: intuition
  objective_refs:
  - objective.temporal-difference-and-q-learning
  markdown: Monte Carlo value estimation uses sampled returns from completed episodes. Temporal-difference
    learning can update earlier using reward plus an estimated next value. Bootstrapping reduces the need to
    wait but introduces dependence on estimates that may themselves be inaccurate.
  text_mode: Monte Carlo value estimation uses sampled returns from completed episodes. Temporal-difference
    learning can update earlier using reward plus an estimated next value. Bootstrapping reduces the need to
    wait but introduces dependence on estimates that may themselves be inaccurate.
  bridges: []
- id: temporal-difference-and-q-learning.s2
  title: Calculate a TD correction
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.temporal-difference-and-q-learning
  markdown: With current value three, reward one, next value four, and gamma one-half, the target is 1 + 0.5×4
    = 3, so the TD error is zero. If the next value were six, the target would be four and the error one. A
    learning rate scales the correction.
  text_mode: With current value three, reward one, next value four, and gamma one-half, the target is 1 + 0.5×4
    = 3, so the TD error is zero. If the next value were six, the target would be four and the error one. A
    learning rate scales the correction.
  bridges: []
- id: temporal-difference-and-q-learning.s3
  title: Learn action values
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.temporal-difference-and-q-learning
  markdown: '**Q(state, action)** estimates the return from taking that action in that state and then following
    a specified strategy. **Q-learning** updates this estimate toward the observed reward plus γ times the
    largest next-state Q-value.


    If the old estimate is 2, the target is 4, and the learning rate is 0.25, the update is 2 + 0.25 × (4 −
    2) = 2.5. At a true terminal state, there is no later return to add.


    The policy collecting experience can explore while Q-learning''s target uses a greedy next action. That
    makes Q-learning **off-policy**: its learning target can follow a different policy from the one collecting
    data. **SARSA** instead uses the next action actually selected by the behavior policy, giving an **on-policy**
    target.'
  text_mode: '**Q(state, action)** estimates the return from taking that action in that state and then following
    a specified strategy. **Q-learning** updates this estimate toward the observed reward plus γ times the
    largest next-state Q-value.


    If the old estimate is 2, the target is 4, and the learning rate is 0.25, the update is 2 + 0.25 × (4 −
    2) = 2.5. At a true terminal state, there is no later return to add.


    The policy collecting experience can explore while Q-learning''s target uses a greedy next action. That
    makes Q-learning **off-policy**: its learning target can follow a different policy from the one collecting
    data. **SARSA** instead uses the next action actually selected by the behavior policy, giving an **on-policy**
    target.'
  bridges: []
- id: temporal-difference-and-q-learning.s4
  title: Respect the assumptions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.temporal-difference-and-q-learning
  markdown: Tabular convergence results require conditions on visits, learning rates, and the environment.
    Function approximation, bootstrapping, and off-policy learning can create instability together. A working
    toy table does not guarantee that a large neural Q-network will train reliably without additional design.
  text_mode: Tabular convergence results require conditions on visits, learning rates, and the environment.
    Function approximation, bootstrapping, and off-policy learning can create instability together. A working
    toy table does not guarantee that a large neural Q-network will train reliably without additional design.
  bridges: []
- id: temporal-difference-and-q-learning.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.temporal-difference-and-q-learning
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Monte Carlo methods use completed returns. Temporal-difference methods use a reward plus an estimated
    future value; Q-learning builds that target from the best estimated next action.
