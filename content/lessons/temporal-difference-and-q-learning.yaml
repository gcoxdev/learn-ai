lesson:
  id: temporal-difference-and-q-learning
  version: 0.4.0-draft
  title: Update values from sampled transitions
  state: draft
  summary: Pip doesn't know how slippery the rug is. It can still learn the value of every square, one step at a time, by learning from its own surprise.
  slot: M24.4
  category: learning
  sources:
    - title: "Reinforcement Learning: An Introduction, 2nd edition, chapter 6 (Sutton & Barto, 2018)"
      url: http://incompleteideas.net/book/the-book-2nd.html
    - title: "Learning to predict by the methods of temporal differences (Sutton, 1988)"
      url: https://doi.org/10.1007/BF00115009
    - title: Dive into Deep Learning — reinforcement learning
      url: https://d2l.ai/chapter_reinforcement-learning/index.html
objectives:
  - id: objective.temporal-difference-and-q-learning
    version: 2-draft
    statement: Monte Carlo methods learn from completed returns, temporal-difference methods bootstrap from estimates, and Q-learning uses an off-policy greedy next-action target under defined convergence assumptions.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - temporal-difference-and-q-learning.base.v2
      - temporal-difference-and-q-learning.transfer.v2
      - temporal-difference-and-q-learning.calculate
    prerequisites:
      - anyOf:
          - objective.mdps-and-bellman-equations
      - anyOf:
          - objective.monte-carlo
scenes:
  - id: temporal-difference-and-q-learning.s1
    title: No map? Wait for the ending, or learn on the way
    type: explanation
    depth: intuition
    objective_refs:
      - objective.temporal-difference-and-q-learning
    markdown: |-
      In the MDP lesson we knew the rug sends Pip to the dock 80% of the time. A real Pip on a new rug knows nothing of the sort. All it has is experience: "I was at the Door, went forward, got −1, landed on the Rug." Can it still learn $v(\text{Door})$?

      **Monte Carlo** learning waits until the episode ends, adds up the actual return, and nudges the estimate toward it:

      $$V(S_t) \leftarrow V(S_t) + \alpha\,\big[G_t - V(S_t)\big]$$

      The step size $\alpha$ (alpha) sets how far to move. Say $V(\text{Door}) = 5$, $\alpha = 0.5$, and this episode Pip slipped twice: rewards −1, −1, −1, +10, so $G = -1 - 0.9 - 0.81 + 7.29 = 4.58$. The new estimate is $5 + 0.5 \times (4.58 - 5) = 4.79$. It works, but Pip learns nothing about the Door until it docks, and one lucky or unlucky episode swings the estimate a lot.

      **Temporal-difference (TD) learning** doesn't wait. After a single step it already has a better guess: the reward it just got plus its *current estimate* of where it landed. Using an estimate to update another estimate is called **bootstrapping**. It's like updating your arrival time at every landmark on a drive home instead of only once you're parked.
    bridges: []
  - id: temporal-difference-and-q-learning.s2
    title: Calculate a TD correction
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.temporal-difference-and-q-learning
    markdown: |-
      Pip believes $V(\text{Door}) = 5$ and $V(\text{Rug}) = 8$. It moves from the Door to the Rug and gets −1. With $\gamma = 0.9$ and $\alpha = 0.5$:

      1. The **TD target** is $-1 + 0.9 \times 8 = 6.2$. That's a one-step-better guess at the Door's value.
      2. The **TD error** is $6.2 - 5 = 1.2$: the move went better than Pip expected.
      3. The update gives $5 + 0.5 \times 1.2 = 5.6$.

      :::papers TD(0)
      $$\delta_t = R_{t+1} + \gamma\, V(S_{t+1}) - V(S_t)$$
      $$V(S_t) \leftarrow V(S_t) + \alpha\, \delta_t$$

      $\delta_t$ (delta) is the TD error, the surprise between what Pip expected and what one step revealed. In our numbers $R_{t+1} = -1$, $V(S_{t+1}) = 8$, $V(S_t) = 5$, and $\delta_t = 1.2$. Richard Sutton formalized this rule in 1988. It is the Bellman expectation equation with the probabilities replaced by one sampled step.
      :::

      :::predict Suppose Pip had believed V(Rug) = 4 instead. What happens to V(Door)?
      Target $-1 + 0.9 \times 4 = 2.6$, error $2.6 - 5 = -2.4$, new value $5 + 0.5 \times (-2.4) = 3.8$. Same experience, opposite correction: TD is only as good as the estimate it bootstraps from. As V(Rug) itself improves, the Door's target improves too.
      :::

      :::story TD-Gammon
      In the early 1990s Gerald Tesauro at IBM trained a neural network to evaluate backgammon positions using TD learning, with the program playing against itself. TD-Gammon reached close to the level of the best human players, and its unconventional choices changed how some experts played certain opening moves.
      :::
    bridges: []
  - id: temporal-difference-and-q-learning.s3
    title: Learn action values with Q-learning
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.temporal-difference-and-q-learning
    markdown: |-
      State values tell Pip how good a square is, but not which way to move. Without a model, it can't look one step ahead to compare actions. So it learns **action values** instead: $Q(s, a)$, the expected return from taking action $a$ in state $s$ and acting well afterwards. The best action is then simply the one with the largest $Q$.

      **Q-learning** (Chris Watkins, 1989) applies the TD idea to $Q$, using the *best* next action in the target:

      $$Q(S_t, A_t) \leftarrow Q(S_t, A_t) + \alpha\,\big[R_{t+1} + \gamma \max_{a} Q(S_{t+1}, a) - Q(S_t, A_t)\big]$$

      On the Rug, Pip has $Q(\text{Rug}, \text{forward}) = 6$ and $Q(\text{Rug}, \text{back}) = 2$. It goes forward and slips: reward −1, still on the Rug. The target is $-1 + 0.9 \times \max(6, 2) = 4.4$, the error is $4.4 - 6 = -1.6$, and with $\alpha = 0.5$ the new $Q(\text{Rug}, \text{forward})$ is $5.2$.

      The code runs Q-learning in Pip's upstairs hallway: four squares and then the dock, no rug, with 20% random exploration.

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      n_cells, dock = 5, 4                 # cells 0..3 are hallway, cell 4 is the dock
      alpha, gamma, epsilon = 0.5, 0.9, 0.2
      Q = np.zeros((n_cells, 2))           # actions: 0 = back, 1 = forward

      for episode in range(300):
          s = 0
          while s != dock:
              a = rng.integers(2) if rng.random() < epsilon else int(np.argmax(Q[s]))
              s2 = min(s + 1, dock) if a == 1 else max(s - 1, 0)
              r = 10 if s2 == dock else -1
              target = r if s2 == dock else r + gamma * Q[s2].max()   # no future after docking
              Q[s, a] += alpha * (target - Q[s, a])
              s = s2

      for s in range(dock):
          print(f"cell {s}: Q(back) = {Q[s, 0]:6.2f}   Q(forward) = {Q[s, 1]:6.2f}")
      ```

      Forward values come out as 4.58, 6.20, 8.00, and 10.00, exactly the discounted returns you'd compute by hand; cell 1's 6.2 is the rug-route return from the first lesson. Try `range(5)` episodes to see half-learned values. Or set `epsilon = 0`: the forward values still come out right, but the back values freeze at wrong numbers, because Pip never tries them again.
    bridges: []
  - id: temporal-difference-and-q-learning.s5
    title: "SARSA: learn the policy you actually follow"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.temporal-difference-and-q-learning
    markdown: |-
      Q-learning's target assumes Pip will take the best action next, even though Pip really explores 20% of the time. Learning about one policy (the greedy one) while following another (the exploring one) makes Q-learning **off-policy**.

      **SARSA** is the **on-policy** alternative. Its name lists what one update uses: State, Action, Reward, next State, next Action. The target uses the action Pip *actually* takes next:

      $$Q(S_t, A_t) \leftarrow Q(S_t, A_t) + \alpha\,\big[R_{t+1} + \gamma\, Q(S_{t+1}, A_{t+1}) - Q(S_t, A_t)\big]$$

      Replay the slip on the Rug. This time Pip's next choice, an exploring one, is "back". SARSA's target is $-1 + 0.9 \times Q(\text{Rug}, \text{back}) = -1 + 0.9 \times 2 = 0.8$. The error is $-5.2$ and the new value is $3.4$, far below Q-learning's $5.2$.

      That difference matters near danger. Sutton and Barto's "cliff walking" example puts the shortest route along a cliff edge. Q-learning learns the edge route, because the greedy policy never falls. SARSA learns a route a few steps back, because it counts the random steps its exploring self will really take. Picture Pip's route passing the top of the stairs.

      :::mixup "Off-policy means Q-learning ignores the exploratory moves."
      It learns from every move, exploratory ones included. What's "off" is the target: it values each state as if the *best* action came next, not the action the agent will actually take.
      :::
    bridges: []
  - id: temporal-difference-and-q-learning.s4
    title: Know when the table can be trusted
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.temporal-difference-and-q-learning
    markdown: |-
      Two practical rules keep tabular TD methods honest.

      **Don't bootstrap past the end.** When Pip docks, the episode is over, so the target is just the reward, +10. Adding $\gamma \times$ some estimate for "the square after the dock" invents a future that doesn't exist. The code above handles this with `target = r if s2 == dock`.

      **Keep visiting everything.** Tabular Q-learning is proven to converge to the optimal values if every state–action pair keeps being tried and the step size shrinks appropriately over time (Watkins & Dayan, 1992). Stop exploring, and unvisited pairs keep their starting guesses forever.

      Tables stop working when states are camera images, since Pip will never see the same image twice. Replacing the table with a neural network brings back the danger that the next lesson has to tame: bootstrapping, off-policy targets, and function approximation together can make values spiral instead of settle.
    bridges: []
  - id: temporal-difference-and-q-learning.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.temporal-difference-and-q-learning
    markdown: Compute a few TD and Q-learning updates by hand, then decide between Monte Carlo, TD, Q-learning, and SARSA for a commute estimate, a cliff-side robot, and a game with a terminal state.
    takeaway: |-
      TD learning nudges an estimate by α times the TD error: reward plus γ times the next estimate, minus the current one. Q-learning's target uses the best next action; SARSA's uses the action actually taken.
  - id: temporal-difference-and-q-learning.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.temporal-difference-and-q-learning
    markdown: |-
      Monte Carlo methods use completed returns. Temporal-difference methods use a reward plus an estimated future value; Q-learning builds that target from the best estimated next action.
