schema_version: 0.2-draft
lesson:
  id: temporal-difference-and-q-learning
  version: 0.1.0-draft
  title: Update values from sampled transitions
  state: draft
  summary: Monte Carlo methods learn from completed returns, temporal-difference methods bootstrap from estimates,
    and Q-learning uses an off-policy greedy next-action target under defined convergence assumptions.
  slot: M24.4
  category: learning
  minutes: 12
  sources:
  - title: Dive into Deep Learning — reinforcement learning
    url: https://d2l.ai/chapter_reinforcement-learning/index.html
objectives:
- id: objective.temporal-difference-and-q-learning
  version: 1-draft
  statement: Monte Carlo methods learn from completed returns, temporal-difference methods bootstrap from estimates,
    and Q-learning uses an off-policy greedy next-action target under defined convergence assumptions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - temporal-difference-and-q-learning.base
  - temporal-difference-and-q-learning.transfer
  prerequisites:
  - anyOf:
    - objective.mdps-and-bellman-equations
  - anyOf:
    - objective.monte-carlo
scenes:
- id: temporal-difference-and-q-learning.s1
  title: Wait for a return or bootstrap
  type: explanation
  depth: intuition
  objective_refs:
  - objective.temporal-difference-and-q-learning
  markdown: Monte Carlo value estimation uses sampled returns from completed episodes. Temporal-difference learning
    can update earlier using reward plus an estimated next value. Bootstrapping reduces the need to wait but introduces
    dependence on estimates that may themselves be inaccurate.
  text_mode: Monte Carlo value estimation uses sampled returns from completed episodes. Temporal-difference learning
    can update earlier using reward plus an estimated next value. Bootstrapping reduces the need to wait but introduces
    dependence on estimates that may themselves be inaccurate.
  bridges: []
- id: temporal-difference-and-q-learning.s2
  title: Calculate a TD correction
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.temporal-difference-and-q-learning
  markdown: With current value three, reward one, next value four, and gamma one-half, the target is 1 + 0.5×4 =
    3, so the TD error is zero. If the next value were six, the target would be four and the error one. A learning
    rate scales the correction.
  text_mode: With current value three, reward one, next value four, and gamma one-half, the target is 1 + 0.5×4
    = 3, so the TD error is zero. If the next value were six, the target would be four and the error one. A learning
    rate scales the correction.
  bridges: []
- id: temporal-difference-and-q-learning.s3
  title: Learn action values
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.temporal-difference-and-q-learning
  markdown: Q-learning updates Q(state,action) toward reward plus gamma times the largest next-state action value.
    The behavior policy can explore while the target uses a greedy action, making this an off-policy method. At
    terminal transitions, do not bootstrap beyond the true terminal state.
  text_mode: Q-learning updates Q(state,action) toward reward plus gamma times the largest next-state action value.
    The behavior policy can explore while the target uses a greedy action, making this an off-policy method. At
    terminal transitions, do not bootstrap beyond the true terminal state.
  bridges: []
- id: temporal-difference-and-q-learning.s4
  title: Respect the assumptions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.temporal-difference-and-q-learning
  markdown: Tabular convergence results require conditions on visits, learning rates, and the environment. Function
    approximation, bootstrapping, and off-policy learning can create instability together. A working toy table does
    not guarantee that a large neural Q-network will train reliably without additional design.
  text_mode: Tabular convergence results require conditions on visits, learning rates, and the environment. Function
    approximation, bootstrapping, and off-policy learning can create instability together. A working toy table does
    not guarantee that a large neural Q-network will train reliably without additional design.
  bridges: []
