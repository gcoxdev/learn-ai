assessment_families:
  - id: temporal-difference-and-q-learning.base
    objective_ref: objective.temporal-difference-and-q-learning
    task: base
    response_type: single_choice
    points: 1
    hint: 'Calculate a TD correction: trace the inputs, operation, and result before choosing.'
    remediation_scene: temporal-difference-and-q-learning.s2
    variants:
      - id: temporal-difference-and-q-learning.base.1
        prompt: What distinguishes TD from a pure full-return Monte Carlo update?
        options:
          - id: b
            text: TD never uses rewards
          - id: c
            text: Monte Carlo always needs a known transition model
          - id: a
            text: TD can bootstrap from an estimated next value
        answer: a
        feedback: Bootstrapping substitutes an estimate for part of the future return.
        retired: true
      - id: temporal-difference-and-q-learning.base.2
        prompt: Target 4 minus current value 3 gives TD error what?
        options:
          - id: c
            text: '-1'
          - id: a
            text: '1'
          - id: b
            text: '7'
        answer: a
        feedback: TD error is target minus current estimate.
        retired: true
  - id: temporal-difference-and-q-learning.transfer
    objective_ref: objective.temporal-difference-and-q-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Respect the assumptions: trace the inputs, operation, and result before choosing.'
    remediation_scene: temporal-difference-and-q-learning.s4
    variants:
      - id: temporal-difference-and-q-learning.transfer.1
        prompt: Why is Q-learning called off-policy?
        options:
          - id: c
            text: It uses no observations
          - id: a
            text: Its greedy target can differ from the exploratory behavior policy
          - id: b
            text: It never chooses actions
        answer: a
        feedback: Learning and data-collection policies can differ.
        retired: true
      - id: temporal-difference-and-q-learning.transfer.2
        prompt: Should a true terminal transition bootstrap from an imagined future episode value?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if the reward is zero
        answer: a
        feedback: The episode’s return ends at terminal state.
        retired: true
  - id: temporal-difference-and-q-learning.base.v2
    objective_ref: objective.temporal-difference-and-q-learning
    task: base
    response_type: single_choice
    points: 1
    hint: Look at what each target is built from. Monte Carlo uses the actual full return; TD uses one reward plus an estimate; Q-learning takes the max next action, SARSA the one actually taken.
    remediation_scene: temporal-difference-and-q-learning.s2
    variants:
      - id: temporal-difference-and-q-learning.base.v2.1
        prompt: Pip's episodes last about 200 steps. Why can TD learning improve V(Door) sooner than Monte Carlo can?
        options:
          - id: b
            text: TD uses a larger step size, so each update moves further
          - id: c
            text: TD skips the rewards and learns from state estimates alone
          - id: a
            text: TD updates after one step, using the estimate of the next state
        answer: a
        feedback: TD bootstraps, so it can update right after the first move. Monte Carlo must wait for the episode to end to know the return. Both use a step size, and TD's target still includes the real reward.
      - id: temporal-difference-and-q-learning.base.v2.2
        prompt: An exploring agent takes a random action 20% of the time. Its update target uses the largest next Q-value regardless of what it does next. Which method is this, and what kind?
        options:
          - id: a
            text: Q-learning, which is off-policy
          - id: b
            text: SARSA, which is on-policy
          - id: c
            text: Monte Carlo, which is off-policy
        answer: a
        feedback: A max over next actions is Q-learning's signature. It learns the greedy policy's values while behaving with exploration, which is what off-policy means. SARSA would use the next action actually taken.
      - id: temporal-difference-and-q-learning.base.v2.3
        prompt: A TD update gives a negative TD error for a state. What does that tell you?
        options:
          - id: c
            text: The reward on that step was negative
          - id: a
            text: The step turned out worse than the estimate expected
          - id: b
            text: The step size α is too large and should be reduced
        answer: a
        feedback: δ = target − estimate, so a negative δ means reward plus discounted next value fell short of what was predicted. A negative reward can still give a positive δ, as Pip's −1 step did with δ = +1.2.
      - id: temporal-difference-and-q-learning.base.v2.4
        prompt: Q(Rug, forward) = 6 and Q(Rug, back) = 2. Pip goes forward and slips back onto the Rug, and then its next chosen action is back. Why does SARSA lower Q(Rug, forward) more than Q-learning does?
        options:
          - id: b
            text: SARSA uses a larger discount factor than Q-learning
          - id: a
            text: SARSA's target uses Q(Rug, back) = 2, not the max of 6
          - id: c
            text: SARSA also subtracts a penalty for exploratory actions
        answer: a
        feedback: SARSA bootstraps from the action actually taken next, so its target is −1 + 0.9 × 2 = 0.8 instead of Q-learning's −1 + 0.9 × 6 = 4.4. Both can use the same γ, and there is no extra penalty term.
  - id: temporal-difference-and-q-learning.transfer.v2
    objective_ref: objective.temporal-difference-and-q-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: Decide whether you need to learn before the episode ends, whether exploration mistakes are dangerous, and whether the episode really ends at this step.
    remediation_scene: temporal-difference-and-q-learning.s5
    variants:
      - id: temporal-difference-and-q-learning.transfer.v2.1
        prompt: A commuter predicts total travel time and wants to revise the prediction at every station, not only on arrival. Which learning rule matches that habit?
        options:
          - id: a
            text: TD learning, bootstrapping from the new estimate at each station
          - id: b
            text: Monte Carlo, averaging each full trip's actual duration
          - id: c
            text: A bandit, choosing the fastest route from past averages
        answer: a
        feedback: Updating at each station toward "time so far plus current estimate of the rest" is exactly a TD update. Monte Carlo would wait until arrival, and a bandit chooses among options instead of predicting along the way.
      - id: temporal-difference-and-q-learning.transfer.v2.2
        prompt: A warehouse robot will keep exploring randomly 10% of the time even after deployment, and one aisle runs past a loading-dock drop. Which method is more likely to learn a route that keeps a safe margin from the drop?
        options:
          - id: c
            text: Q-learning, because its max target learns faster
          - id: b
            text: Monte Carlo, because it waits for complete episodes
          - id: a
            text: SARSA, because it values the moves it will really make
        answer: a
        feedback: SARSA's target includes the exploratory steps the robot actually takes, so routes where a random step is disastrous look worse. Q-learning values the edge route as if no random step would ever happen, like the cliff-walking example.
      - id: temporal-difference-and-q-learning.transfer.v2.3
        prompt: In a game agent's training code, the step that wins the game uses the target r + γ max Q(next, a), where "next" is a blank screen. What is the fix?
        options:
          - id: a
            text: Use just r as the target when the game has ended
          - id: b
            text: Lower γ on the final step so the blank screen counts less
          - id: c
            text: Add a small penalty so that winning moves are not overvalued
        answer: a
        feedback: A terminal step has no future, so the target is the reward alone. Shrinking γ or adding a penalty still mixes in an invented value for a screen that never leads anywhere.
      - id: temporal-difference-and-q-learning.transfer.v2.4
        prompt: A tabular Q-learner for a thermostat stops exploring after its first day. A week later, one setting it tried once on day one still has its original low Q-value. What explains this?
        options:
          - id: b
            text: Q-learning only updates the action with the highest value
          - id: a
            text: Without exploration, that action is never retried or updated
          - id: c
            text: Its step size was too small for such a rare action
        answer: a
        feedback: Q-learning updates only the pairs it visits. Tabular convergence requires every state–action pair to keep being tried; with exploration switched off, an unlucky early estimate is frozen.
  - id: temporal-difference-and-q-learning.calculate
    objective_ref: objective.temporal-difference-and-q-learning
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: "Build the target first (reward plus γ times the right next estimate, or just the reward at a terminal step), then δ = target − old value, then old value + α × δ."
    remediation_scene: temporal-difference-and-q-learning.s2
    absolute_tolerance: 0.01
    numeric_fields:
      - id: target
        label: Target
      - id: td_error
        label: TD error δ
      - id: new_value
        label: Updated value
    variants:
      - id: temporal-difference-and-q-learning.calculate.1
        prompt: Q-learning. Q(s, a) = 4. The agent gets reward −1 and lands in a state whose Q-values are 6 and 2. With γ = 0.9 and α = 0.5, record the target, the TD error, and the updated Q(s, a), then choose the reason for the target you used.
        feedback: Target −1 + 0.9 × 6 = 4.4; δ = 4.4 − 4 = 0.4; new value 4 + 0.5 × 0.4 = 4.2.
        answers:
          target: 4.4
          td_error: 0.4
          new_value: 4.2
        reason_answer: max
        reason_options:
          - id: actual
            text: The target uses the Q-value of the action the agent will actually take next.
          - id: max
            text: The target uses the largest next Q-value, whatever the agent does next.
          - id: average
            text: The target uses the average of the next state's Q-values.
      - id: temporal-difference-and-q-learning.calculate.2
        prompt: SARSA. Q(s, a) = 4. The agent gets reward −1 and lands in a state whose Q-values are 6 (action x) and 2 (action y), and its next chosen action is y. With γ = 0.9 and α = 0.5, record the target, the TD error, and the updated Q(s, a), then choose the reason for the target you used.
        feedback: Target −1 + 0.9 × 2 = 0.8; δ = 0.8 − 4 = −3.2; new value 4 + 0.5 × (−3.2) = 2.4.
        answers:
          target: 0.8
          td_error: -3.2
          new_value: 2.4
        reason_answer: actual
        reason_options:
          - id: max
            text: The target uses the largest next Q-value, whatever the agent does next.
          - id: average
            text: The target uses the average of the next state's Q-values.
          - id: actual
            text: The target uses the Q-value of the action the agent will actually take next.
      - id: temporal-difference-and-q-learning.calculate.3
        prompt: TD(0). V(s) = 3. The agent gets reward 1 and lands in a state with V = 6. With γ = 0.5 and α = 0.5, record the target, the TD error, and the updated V(s), then choose how the update works.
        feedback: Target 1 + 0.5 × 6 = 4; δ = 4 − 3 = 1; new value 3 + 0.5 × 1 = 3.5.
        answers:
          target: 4
          td_error: 1
          new_value: 3.5
        reason_answer: partial
        reason_options:
          - id: replace
            text: TD(0) replaces V(s) with the target outright.
          - id: partial
            text: TD(0) moves V(s) a fraction α of the way toward the target.
          - id: wait
            text: TD(0) waits for the episode's full return before moving V(s).
      - id: temporal-difference-and-q-learning.calculate.4
        prompt: Q-learning. Q(s, a) = 7. The action docks Pip, reward +10, and the episode ends. With γ = 0.9 and α = 0.1, record the target, the TD error, and the updated Q(s, a), then choose the reason for the target you used.
        feedback: Nothing follows the dock, so the target is 10; δ = 10 − 7 = 3; new value 7 + 0.1 × 3 = 7.3.
        answers:
          target: 10
          td_error: 3
          new_value: 7.3
        reason_answer: terminal
        reason_options:
          - id: terminal
            text: The episode has ended, so the target is the reward alone.
          - id: max
            text: The target adds γ times the largest Q-value of the dock state.
          - id: actual
            text: The target adds γ times the Q-value of the next action taken.
