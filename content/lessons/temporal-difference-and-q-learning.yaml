assessment_families:
- id: temporal-difference-and-q-learning.base
  objective_ref: objective.temporal-difference-and-q-learning
  task: base
  response_type: single_choice
  points: 1
  hint: 'Calculate a TD correction: trace the inputs, operation, and result before choosing.'
  remediation_scene: temporal-difference-and-q-learning.s2
  variants:
  - id: temporal-difference-and-q-learning.base.1
    prompt: What distinguishes TD from a pure full-return Monte Carlo update?
    options:
    - id: b
      text: TD never uses rewards
    - id: c
      text: Monte Carlo always needs a known transition model
    - id: a
      text: TD can bootstrap from an estimated next value
    answer: a
    feedback: Bootstrapping substitutes an estimate for part of the future return.
  - id: temporal-difference-and-q-learning.base.2
    prompt: Target 4 minus current value 3 gives TD error what?
    options:
    - id: c
      text: '-1'
    - id: a
      text: '1'
    - id: b
      text: '7'
    answer: a
    feedback: TD error is target minus current estimate.
- id: temporal-difference-and-q-learning.transfer
  objective_ref: objective.temporal-difference-and-q-learning
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Respect the assumptions: trace the inputs, operation, and result before choosing.'
  remediation_scene: temporal-difference-and-q-learning.s4
  variants:
  - id: temporal-difference-and-q-learning.transfer.1
    prompt: Why is Q-learning called off-policy?
    options:
    - id: c
      text: It uses no observations
    - id: a
      text: Its greedy target can differ from the exploratory behavior policy
    - id: b
      text: It never chooses actions
    answer: a
    feedback: Learning and data-collection policies can differ.
  - id: temporal-difference-and-q-learning.transfer.2
    prompt: Should a true terminal transition bootstrap from an imagined future episode value?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if the reward is zero
    answer: a
    feedback: The episode’s return ends at terminal state.
