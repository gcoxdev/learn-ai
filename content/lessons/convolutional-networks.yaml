  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.convolutional-networks
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: CNNs combine local filter responses into later features. Follow how the resolution, channels, and
    final output change, then test whether the trained system uses the right visual clues.
