schema_version: 0.2-draft
lesson:
  id: convolutional-networks
  version: 0.4.0-draft
  title: Build visual features from local operations
  state: draft
  summary: Stack a few convolution layers and you can tell a beagle from a cat with under 100,000 weights. Trace one network layer by layer, from LeNet to ResNet.
  slot: M12.3
  category: learning
  sources:
    - title: "Gradient-Based Learning Applied to Document Recognition (LeCun, Bottou, Bengio & Haffner, 1998)"
      url: https://ieeexplore.ieee.org/document/726791
    - title: "ImageNet Classification with Deep Convolutional Neural Networks (Krizhevsky, Sutskever & Hinton, 2012)"
      url: https://papers.nips.cc/paper/2012/hash/c399862d3b9d6b76c8436e924a68c45b-Abstract.html
    - title: "Very Deep Convolutional Networks for Large-Scale Image Recognition (Simonyan & Zisserman, 2014)"
      url: https://arxiv.org/abs/1409.1556
    - title: "Deep Residual Learning for Image Recognition (He, Zhang, Ren & Sun, 2015)"
      url: https://arxiv.org/abs/1512.03385
    - title: Dive into Deep Learning — modern convolutional neural networks
      url: https://d2l.ai/chapter_convolutional-modern/index.html
objectives:
  - id: objective.convolutional-networks
    version: 2-draft
    statement: Convolutional networks stack shared filters and nonlinear transformations; residual designs support deeper computation, while classification still depends on data and evaluation.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - convolutional-networks.base.v2
      - convolutional-networks.transfer.v2
      - convolutional-networks.calculate
    prerequisites:
      - anyOf:
          - objective.convolution
      - anyOf:
          - objective.residuals-normalization-dropout
scenes:
  - id: convolutional-networks.s1
    title: From edges to beagles in a few layers
    type: explanation
    depth: intuition
    objective_refs:
      - objective.convolutional-networks
    markdown: |-
      One edge filter can't tell Biscuit from a cat. Pet search needs a whole stack. A **convolutional neural network (CNN)** repeats a simple recipe: convolution, then a nonlinearity such as ReLU (which turns negatives into 0), sometimes pooling, and repeat.

      Each filter in a layer produces one **channel** of the output, its own feature map. Early channels tend to respond to edges and color blobs; deeper ones combine those into textures, then fur, ears, and eyes. Nobody programs these roles; they emerge from training on labeled photos.

      Here is a small pet-search CNN, traced with the output-size formula from the last lesson (3 × 3 filters with padding 1 keep the size; 2 × 2 pooling halves it):

      | Layer | Output shape (H × W × C) |
      | --- | --- |
      | Input photo | 224 × 224 × 3 |
      | Conv 3 × 3, 32 filters | 224 × 224 × 32 |
      | Max pool 2 × 2 | 112 × 112 × 32 |
      | Conv 3 × 3, 64 filters | 112 × 112 × 64 |
      | Max pool 2 × 2 | 56 × 56 × 64 |
      | Conv 3 × 3, 128 filters | 56 × 56 × 128 |
      | Global average pool | 128 |
      | Dense layer | 3 scores: dog, cat, no pet |

      The last two rows turn the grid into three class scores; we'll unpack them shortly. Notice the pattern nearly every CNN follows: the grid shrinks while the channels grow. The network trades *where* for *what*.

      :::story Four networks that set the course
      | Year | Network | What it showed |
      | --- | --- | --- |
      | 1998 | LeNet-5 (LeCun et al.) | Convolution plus pooling reads handwritten digits; about 60,000 weights. Similar networks read bank checks. |
      | 2012 | AlexNet (Krizhevsky, Sutskever & Hinton) | Trained on two GPUs, it won the ImageNet challenge (1,000 classes) with 15.3% top-5 error; the runner-up had 26.2%. |
      | 2014 | VGG (Simonyan & Zisserman) | Just stack 3 × 3 filters, 16 to 19 layers deep. |
      | 2015 | ResNet (He et al.) | Residual connections made 152 layers trainable; it won ImageNet 2015. |
      :::
    bridges: []
  - id: convolutional-networks.s5
    title: Count the weights, and see why sharing wins
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.convolutional-networks
    markdown: |-
      Each filter has $K \times K \times C_{\text{in}}$ weights plus one bias, and a layer has one filter per output channel:

      $$\text{parameters} = (K \cdot K \cdot C_{\text{in}} + 1) \cdot C_{\text{out}}$$

      For the first layer: $(3 \cdot 3 \cdot 3 + 1) \cdot 32 = 28 \cdot 32 = 896$. The layer's size doesn't depend on the photo's size at all. The same 896 numbers work on a 224 × 224 photo or a 4,000 × 3,000 one.

      :::predict How many parameters does the second conv layer have (3 × 3 filters, 32 channels in, 64 out)?
      $(3 \cdot 3 \cdot 32 + 1) \cdot 64 = 289 \cdot 64 = 18{,}496$. Each filter now reads all 32 channels of the layer below.
      :::

      Compare an ordinary **dense layer**, where every input connects to every output with its own weight. Flatten the photo into 150,528 numbers and connect it to just 1,000 hidden units: $150{,}528 \times 1{,}000 + 1{,}000 = 150{,}529{,}000$ parameters. That's about 1,600 times the whole pet-search CNN (93,635 parameters, as the code confirms), before the dense network has even learned that an edge on the left looks like an edge on the right.

      ```python run
      def out_size(W, K, P, S):
          return (W - K + 2 * P) // S + 1

      # (kind, K, filters, P, S) for a small pet-search network
      layers = [("conv", 3, 32, 1, 1), ("pool", 2, None, 0, 2),
                ("conv", 3, 64, 1, 1), ("pool", 2, None, 0, 2),
                ("conv", 3, 128, 1, 1)]
      H = W = 224; C = 3; total = 0
      print(f"{'input':6} {H}x{W}x{C}")
      for kind, K, F, P, S in layers:
          H, W = out_size(H, K, P, S), out_size(W, K, P, S)
          params = (K * K * C + 1) * F if kind == "conv" else 0
          C = F if kind == "conv" else C
          total += params
          shape = f"{H}x{W}x{C}"
          print(f"{kind:6} {shape:12} params {params:>7,}")
      head = C * 3 + 3                     # global average pool -> 3 classes
      total += head
      print(f"{'head':6} {f'{C} -> 3':12} params {head:>7,}")
      print(f"total CNN parameters: {total:,}")
      print(f"one dense layer, 1,000 units: {224*224*3*1000 + 1000:,}")
      ```

      Try changing the last conv to 256 filters, or adding a stride-2 conv. Pooling layers add no parameters; notice which layers do.

      VGG's case for small filters is the same arithmetic. Two stacked 3 × 3 layers see a 5 × 5 patch, like one 5 × 5 filter, but use $2 \times 9 = 18$ weights per channel pair instead of 25, with an extra ReLU in between.
    bridges: []
  - id: convolutional-networks.s2
    title: From 128 channels to "dog"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.convolutional-networks
    markdown: |-
      The last conv layer produces 56 × 56 × 128 numbers, but pet search needs one answer. **Global average pooling** collapses each channel to its mean. A channel with values [2, 4, 6, 8] becomes $20 / 4 = 5$. Now the photo is summarized by 128 numbers, one per learned feature, no matter where Biscuit sat.

      A dense layer turns those 128 numbers into one **score** per class ($128 \times 3 + 3 = 387$ parameters). **Softmax** turns scores into probabilities that sum to 1: raise $e$ to each score and divide by the total.

      | Class | Score | $e^{\text{score}}$ | Probability |
      | --- | ---: | ---: | ---: |
      | dog | 2.0 | 7.389 | 0.659 |
      | cat | 1.0 | 2.718 | 0.242 |
      | no pet | 0.1 | 1.105 | 0.099 |

      The total is 11.212, so "dog" gets $7.389 / 11.212 = 0.659$. The output is one label for the whole photo. It says nothing about *where* the dog is, or whether there are two. That's the next lesson's job.
    bridges: []
  - id: convolutional-networks.s3
    title: "Residual connections: y = F(x) + x"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.convolutional-networks
    markdown: |-
      If 20 layers are good, are 56 better? You met the answer in the lesson on residual connections: in 2015, He and colleagues trained plain stacks of both depths on the CIFAR-10 image set, and the 56-layer network had *higher* error, even on its own training data. It wasn't overfitting: the extra layers made the network harder to optimize. Here is how their fix looks inside a CNN.

      :::mixup "A deeper network can only be at least as good, since extra layers could just pass their input through."
      In principle they could, but gradient descent finds "copy the input exactly" surprisingly hard to reach through a stack of convolutions and ReLUs. Depth paid off once copying became the easy default.
      :::

      ResNet's fix is the residual block. Two conv layers compute a correction $F(x)$, and a skip connection adds the block's input back:

      $$y = F(x) + x$$

      Suppose two channels of a feature map hold $x = [2.0, -1.0]$ and the conv branch outputs $F(x) = [0.3, 0.5]$. Then $y = [2.3, -0.5]$. If the branch learns $F(x) = [0, 0]$, the block passes $x$ through unchanged, so extra blocks are cheap to add. Backpropagation benefits too: $\partial y / \partial x = \partial F / \partial x + 1$, and that "+1" gives the gradient a direct route back to early layers.

      The addition needs matching shapes. When a block halves the grid and doubles channels (say 56 × 56 × 64 to 28 × 28 × 128), the skip path uses a **projection**: a 1 × 1 convolution with stride 2 that reshapes $x$ so the two branches can be added entry by entry.
    diagram:
      caption: A residual block. The conv branch learns a correction F(x); the skip path carries x around it unchanged.
      description: The input x goes two ways. Along the top it passes through a 3 × 3 convolution, a ReLU, and a second 3 × 3 convolution, producing F(x). Along the bottom, the skip path carries x directly to an addition node, which computes F(x) + x. The sum passes through a ReLU to give the block's output y.
      nodes:
        - id: x
          label: Input x
          note: 56 × 56 × 64
          col: 0
          row: 1
          tone: data
        - id: conv1
          label: 3 × 3 conv
          note: then ReLU
          col: 1
          row: 0
        - id: conv2
          label: 3 × 3 conv
          note: output F(x)
          col: 2
          row: 0
        - id: add
          label: Add
          note: F(x) + x
          col: 3
          row: 1
          tone: accent
        - id: y
          label: Output y
          note: after ReLU
          col: 4
          row: 1
          tone: data
      edges:
        - from: x
          to: conv1
        - from: conv1
          to: conv2
        - from: conv2
          to: add
          label: F(x)
        - from: x
          to: add
          label: skip connection
        - from: add
          to: y
          label: ReLU
  - id: convolutional-networks.s4
    title: A better score isn't always a better network
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.convolutional-networks
    markdown: |-
      Two pet-search models are tested on the same 2,000 held-out photos. Model A, a ResNet-50, scores 93%; model B, a smaller ResNet-18, scores 95%. But B trained twice as long with heavier augmentation (random crops, color changes). Any of those could explain the 2 points.

      A fair comparison changes one thing at a time: same data, augmentation, and training budget, different network. Then split the score by condition (indoor and outdoor, day and night), because a strong average can hide a weak slice. The module's last lesson hunts for those slices on purpose.
    bridges: []
  - id: convolutional-networks.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.convolutional-networks
    markdown: Count parameters and trace shapes by hand, then judge a bird-watching model, a skin-lesion classifier, and a benchmark comparison between two networks.
    takeaway: |-
      A CNN stacks shared filters, so the grid shrinks as the channels grow, and each layer needs only (K·K·C_in + 1)·C_out weights. Residual connections (y = F(x) + x) let those stacks go deep.
  - id: convolutional-networks.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.convolutional-networks
    markdown: |-
      CNNs combine local filter responses into later features. Follow how the resolution, channels, and final output change, then test whether the trained system uses the right visual clues.
