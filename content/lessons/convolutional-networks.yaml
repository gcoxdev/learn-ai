assessment_families:
  - id: convolutional-networks.base
    objective_ref: objective.convolutional-networks
    task: base
    response_type: single_choice
    points: 1
    hint: 'Reach a classification output: trace the inputs, operation, and result before choosing.'
    remediation_scene: convolutional-networks.s2
    variants:
      - id: convolutional-networks.base.1
        prompt: What does an image classifier normally output?
        options:
          - id: c
            text: The original camera settings exactly
          - id: a
            text: Scores or probabilities for image-level labels
          - id: b
            text: A guaranteed pixel mask for every object
        answer: a
        feedback: Classification and localization are different tasks.
        retired: true
      - id: convolutional-networks.base.2
        prompt: Why might a residual skip path need a projection?
        options:
          - id: a
            text: To match changed feature dimensions
          - id: b
            text: To remove all input information by definition
          - id: c
            text: Only to add a file dependency
        answer: a
        feedback: Residual addition requires compatible shapes.
        retired: true
  - id: convolutional-networks.transfer
    objective_ref: objective.convolutional-networks
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate the trained visual system: trace the inputs, operation, and result before choosing.'
    remediation_scene: convolutional-networks.s4
    variants:
      - id: convolutional-networks.transfer.1
        prompt: Two CNNs differ in augmentation and data as well as depth. What limits a depth-only explanation of their score difference?
        options:
          - id: a
            text: The changed conditions confound attribution
          - id: b
            text: Nothing; depth gets all credit
          - id: c
            text: Only the chart resolution
        answer: a
        feedback: Architecture comparisons require controlled or clearly reported training conditions.
        retired: true
      - id: convolutional-networks.transfer.2
        prompt: A network’s later channel responds to faces in some examples. Is a universal face-neuron interpretation established?
        options:
          - id: b
            text: Yes; one visualization proves it
          - id: c
            text: Only if the channel is numbered one
          - id: a
            text: No; broader tests and interventions are needed
        answer: a
        feedback: Representations can be distributed and context-dependent.
        retired: true
  - id: convolutional-networks.base.v2
    objective_ref: objective.convolutional-networks
    task: base
    response_type: single_choice
    points: 1
    hint: Follow one photo through the stack. Which shapes change, what does each layer's output mean, and what does the skip connection add?
    remediation_scene: convolutional-networks.s3
    variants:
      - id: convolutional-networks.base.v2.1
        prompt: In a residual block, the input is x = [1.0, 3.0] and the conv branch outputs F(x) = [0.2, −0.4]. What does the block pass on (before its final ReLU)?
        options:
          - id: b
            text: "[0.2, −0.4], the branch output, since the skip only helps gradients"
          - id: a
            text: "[1.2, 2.6], the branch output added to the input"
          - id: c
            text: "[1.0, 3.0, 0.2, −0.4], the input and branch joined end to end"
        answer: a
        feedback: A residual block computes y = F(x) + x entry by entry, giving 1.0 + 0.2 and 3.0 − 0.4. Joining the lists end to end is concatenation, a different operation, and the skip carries x forward as well as helping gradients.
      - id: convolutional-networks.base.v2.2
        prompt: A block halves the grid from 56 × 56 to 28 × 28 and doubles channels from 64 to 128. Why does its skip path need a 1 × 1 convolution with stride 2?
        options:
          - id: c
            text: To add extra depth so the block learns more detailed features
          - id: b
            text: To remove the input so the block learns only the correction
          - id: a
            text: To reshape x to 28 × 28 × 128 so it can be added to F(x)
        answer: a
        feedback: Residual addition works entry by entry, so both branches need the same shape; the projection supplies it. It isn't there to add capacity, and removing x would undo the whole point of the skip.
      - id: convolutional-networks.base.v2.3
        prompt: Pet search ends with global average pooling, a dense layer, and softmax, and outputs 0.66 for "dog". What does this output tell you?
        options:
          - id: a
            text: The model's probability that the photo as a whole shows a dog
          - id: b
            text: The fraction of the photo's pixels that belong to a dog
          - id: c
            text: How far the dog is from the center of the photo
        answer: a
        feedback: A classifier gives one probability per label for the whole photo. Global average pooling has already discarded where features were, so it can't report pixel fractions or positions; those need detection or segmentation.
      - id: convolutional-networks.base.v2.4
        prompt: In the 2015 ResNet paper, a plain 56-layer network had higher training error than a 20-layer one. What does that show?
        options:
          - id: b
            text: The deeper network overfit, memorizing its training photos
          - id: a
            text: The deeper plain stack was harder to optimize, not too flexible
          - id: c
            text: Networks with more than 20 layers can't represent more functions
        answer: a
        feedback: Overfitting would give low training error and high test error; here even training error was worse, so optimization was the problem. A deeper network can represent at least as much, and residual connections made that depth usable.
  - id: convolutional-networks.transfer.v2
    objective_ref: objective.convolutional-networks
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name what the task needs (a label, a location, a fair comparison, or a trainable deep stack), then pick the design or test that supplies it.
    remediation_scene: convolutional-networks.s4
    variants:
      - id: convolutional-networks.transfer.v2.1
        prompt: A bird-watching app's CNN classifier says "robin 0.91" for a photo with three robins. The team wants to count the birds. What is the problem?
        options:
          - id: c
            text: The softmax should be replaced so its outputs sum to 3
          - id: a
            text: A classifier gives one label per photo and discards where things are
          - id: b
            text: The network needs more channels so each robin gets its own
        answer: a
        feedback: Global pooling and softmax summarize the whole photo into one distribution, so counting needs a model that outputs one result per object, such as a detector. Changing softmax or adding channels still leaves a single photo-level answer.
      - id: convolutional-networks.transfer.v2.2
        prompt: Network B beats network A by 3 points on a skin-lesion test set, but B also trained twice as long with stronger augmentation. What should the team conclude first?
        options:
          - id: a
            text: The gap can't be credited to B's design until the recipes match
          - id: b
            text: B's design is better, since both were scored on the same test set
          - id: c
            text: A is better, since B needed extra training to catch up with it
        answer: a
        feedback: A shared test set is necessary but not enough; the training recipes differ, so design, epochs, and augmentation are tangled together. Retrain both with the same recipe and compare again.
      - id: convolutional-networks.transfer.v2.3
        prompt: An engineer adds 30 plain conv layers to a working 20-layer network, and training loss gets worse. Which change most directly addresses this?
        options:
          - id: b
            text: Replace the 3 × 3 filters with 7 × 7 filters in the new layers
          - id: c
            text: Remove the ReLUs so the new layers are purely linear
          - id: a
            text: Wrap the new layers in residual blocks with skip connections
        answer: a
        feedback: Skip connections make "pass the input through" the easy default and give gradients a direct path, which is what ResNet used to train very deep stacks. Bigger filters add parameters without fixing optimization, and removing ReLUs makes the stack collapse to one linear map.
      - id: convolutional-networks.transfer.v2.4
        prompt: A factory camera needs a defect classifier on a small chip with little memory. Why is a CNN a better fit than a dense network on raw pixels?
        options:
          - id: c
            text: A CNN runs without any weights, so the memory use is zero
          - id: b
            text: A dense network cannot process images larger than 32 × 32
          - id: a
            text: Shared filters need far fewer weights than one per pixel pair
        answer: a
        feedback: A 3 × 3 filter's weights are reused across the whole image, so a CNN can be thousands of times smaller than a dense layer with a weight for every input–output pair. Dense networks can take any size input, just at huge cost, and CNNs certainly have weights.
  - id: convolutional-networks.calculate
    objective_ref: objective.convolutional-networks
    task: base
    response_type: numeric
    points: 1
    hint: "Parameters = (K × K × C_in + 1) × C_out: each filter has one weight per position per input channel, plus a bias, and there is one filter per output channel."
    remediation_scene: convolutional-networks.s5
    absolute_tolerance: 0.01
    variants:
      - id: convolutional-networks.calculate.1
        prompt: LeNet-5's first layer applies 6 filters of size 5 × 5 to a 1-channel grayscale image. How many parameters, including biases?
        answer: 156
        feedback: (5 × 5 × 1 + 1) × 6 = 26 × 6 = 156.
      - id: convolutional-networks.calculate.2
        prompt: A conv layer uses 3 × 3 filters, takes 64 input channels, and produces 128 output channels. How many parameters, including biases?
        answer: 73856
        feedback: (3 × 3 × 64 + 1) × 128 = 577 × 128 = 73,856.
      - id: convolutional-networks.calculate.3
        prompt: A 1 × 1 projection on a skip path maps 64 channels to 128. How many parameters, including biases?
        answer: 8320
        feedback: (1 × 1 × 64 + 1) × 128 = 65 × 128 = 8,320. A 1 × 1 filter mixes channels without looking at neighbors.
      - id: convolutional-networks.calculate.4
        prompt: A first layer applies 16 filters of size 3 × 3 to an RGB photo. How many parameters, including biases?
        answer: 448
        feedback: (3 × 3 × 3 + 1) × 16 = 28 × 16 = 448. The photo's height and width don't enter the count.
      - id: convolutional-networks.calculate.5
        prompt: A first layer applies 64 filters of size 7 × 7 to an RGB photo (the size of ResNet's first layer), with a bias per filter. How many parameters?
        answer: 9472
        feedback: (7 × 7 × 3 + 1) × 64 = 148 × 64 = 9,472.
