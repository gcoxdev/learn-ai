scenes:
- id: convolutional-networks.s1
  title: Compose local patterns
  type: explanation
  depth: intuition
  objective_refs:
  - objective.convolutional-networks
  markdown: 'An early convolution can respond to simple local structure, while later layers combine transformed
    features over wider regions. This is a useful intuition, not a guaranteed ladder of human-named concepts.
    Channels and spatial resolution change as the network processes an image.


    CNN means **convolutional neural network**. Each layer can produce several **channels**, or feature maps,
    from different filters. A channel is a grid of responses, not automatically a named concept such as “wheel.”
    A nonlinear activation between layers lets the network combine these responses into more varied patterns.'
  text_mode: 'An early convolution can respond to simple local structure, while later layers combine transformed
    features over wider regions. This is a useful intuition, not a guaranteed ladder of human-named concepts.
    Channels and spatial resolution change as the network processes an image.


    CNN means **convolutional neural network**. Each layer can produce several **channels**, or feature maps,
    from different filters. A channel is a grid of responses, not automatically a named concept such as “wheel.”
    A nonlinear activation between layers lets the network combine these responses into more varied patterns.'
  bridges: []
- id: convolutional-networks.s2
  title: Reach a classification output
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.convolutional-networks
  markdown: 'A classifier may aggregate spatial features with pooling, then project to class scores. Softmax
    can turn those scores into a distribution over mutually exclusive classes. The classifier predicts a label
    for the image; it does not necessarily identify every object’s location or segment its pixels.


    For one feature map with values [2, 4, 6, 8], global average pooling gives 20/4 = 5. A final learned layer
    combines pooled features into class **scores**. Softmax converts these scores into nonnegative numbers
    summing to one. These are the model''s class probabilities, whose reliability still needs evaluation.'
  text_mode: 'A classifier may aggregate spatial features with pooling, then project to class scores. Softmax
    can turn those scores into a distribution over mutually exclusive classes. The classifier predicts a label
    for the image; it does not necessarily identify every object’s location or segment its pixels.


    For one feature map with values [2, 4, 6, 8], global average pooling gives 20/4 = 5. A final learned layer
    combines pooled features into class **scores**. Softmax converts these scores into nonnegative numbers
    summing to one. These are the model''s class probabilities, whose reliability still needs evaluation.'
  bridges: []
- id: convolutional-networks.s3
  title: Keep a residual route
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.convolutional-networks
  markdown: 'Residual networks add block updates to compatible incoming representations. This supports signal
    and gradient flow in deeper networks. A block that changes channel count or resolution may use a projection
    on the skip path. The exact design determines which operations and normalization occur before the addition.


    A **projection** on a skip path is an extra learned transformation that makes its shape match the other
    branch. You cannot add a 16-channel grid to a 32-channel grid entry by entry without defining how they
    correspond. The residual addition combines matching entries; it is not joining the lists end to end.'
  text_mode: 'Residual networks add block updates to compatible incoming representations. This supports signal
    and gradient flow in deeper networks. A block that changes channel count or resolution may use a projection
    on the skip path. The exact design determines which operations and normalization occur before the addition.


    A **projection** on a skip path is an extra learned transformation that makes its shape match the other
    branch. You cannot add a 16-channel grid to a 32-channel grid entry by entry without defining how they
    correspond. The residual addition combines matching entries; it is not joining the lists end to end.'
  bridges: []
- id: convolutional-networks.s4
  title: Evaluate the trained visual system
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.convolutional-networks
  markdown: Use representative images, suitable splits, and task metrics. Check calibration, subgroup or condition
    performance, and sensitivity to background shortcuts. More depth or a familiar architecture name does not
    establish robustness. Compare training recipe, augmentation, and compute when attributing improvement.
