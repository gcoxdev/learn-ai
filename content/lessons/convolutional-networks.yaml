schema_version: 0.2-draft
lesson:
  id: convolutional-networks
  version: 0.1.0-draft
  title: Build visual features from local operations
  state: draft
  summary: Convolutional networks stack shared filters and nonlinear transformations; residual designs support deeper
    computation, while classification still depends on data and evaluation.
  slot: M12.3
  category: learning
  minutes: 12
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.convolutional-networks
  version: 1-draft
  statement: Convolutional networks stack shared filters and nonlinear transformations; residual designs support
    deeper computation, while classification still depends on data and evaluation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - convolutional-networks.base
  - convolutional-networks.transfer
  prerequisites:
  - anyOf:
    - objective.convolution
  - anyOf:
    - objective.residuals-normalization-dropout
scenes:
- id: convolutional-networks.s1
  title: Compose local patterns
  type: explanation
  depth: intuition
  objective_refs:
  - objective.convolutional-networks
  markdown: An early convolution can respond to simple local structure, while later layers combine transformed features
    over wider regions. This is a useful intuition, not a guaranteed ladder of human-named concepts. Channels and
    spatial resolution change as the network processes an image.
  text_mode: An early convolution can respond to simple local structure, while later layers combine transformed
    features over wider regions. This is a useful intuition, not a guaranteed ladder of human-named concepts. Channels
    and spatial resolution change as the network processes an image.
  bridges: []
- id: convolutional-networks.s2
  title: Reach a classification output
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.convolutional-networks
  markdown: A classifier may aggregate spatial features with pooling, then project to class scores. Softmax can
    turn those scores into a distribution over mutually exclusive classes. The classifier predicts a label for the
    image; it does not necessarily identify every object’s location or segment its pixels.
  text_mode: A classifier may aggregate spatial features with pooling, then project to class scores. Softmax can
    turn those scores into a distribution over mutually exclusive classes. The classifier predicts a label for the
    image; it does not necessarily identify every object’s location or segment its pixels.
  bridges: []
- id: convolutional-networks.s3
  title: Keep a residual route
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.convolutional-networks
  markdown: Residual networks add block updates to compatible incoming representations. This supports signal and
    gradient flow in deeper networks. A block that changes channel count or resolution may use a projection on the
    skip path. The exact design determines which operations and normalization occur before the addition.
  text_mode: Residual networks add block updates to compatible incoming representations. This supports signal and
    gradient flow in deeper networks. A block that changes channel count or resolution may use a projection on the
    skip path. The exact design determines which operations and normalization occur before the addition.
  bridges: []
- id: convolutional-networks.s4
  title: Evaluate the trained visual system
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.convolutional-networks
  markdown: Use representative images, suitable splits, and task metrics. Check calibration, subgroup or condition
    performance, and sensitivity to background shortcuts. More depth or a familiar architecture name does not establish
    robustness. Compare training recipe, augmentation, and compute when attributing improvement.
  text_mode: Use representative images, suitable splits, and task metrics. Check calibration, subgroup or condition
    performance, and sensitivity to background shortcuts. More depth or a familiar architecture name does not establish
    robustness. Compare training recipe, augmentation, and compute when attributing improvement.
  bridges: []
- id: convolutional-networks.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.convolutional-networks
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: convolutional-networks.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.convolutional-networks
  markdown: Convolutional networks stack shared filters and nonlinear transformations; residual designs support
    deeper computation, while classification still depends on data and evaluation.
  text_mode: Convolutional networks stack shared filters and nonlinear transformations; residual designs support
    deeper computation, while classification still depends on data and evaluation.
