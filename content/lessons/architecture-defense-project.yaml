schema_version: 0.2-draft
lesson:
  id: architecture-defense-project
  version: 0.4.0-draft
  title: 'Final project: defend an end-to-end AI system design'
  state: draft
  summary: A turbine technician needs exact torque values from a 32,000-token manual, offline, on a 16 GB laptop GPU. Pick the model, do the arithmetic, and defend the trade-offs out loud.
  slot: M36.8
  category: learning
  minutes: 60
  sources:
    - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
      url: https://aima.cs.berkeley.edu/
    - title: Model Cards for Model Reporting (Mitchell et al., 2019)
      url: https://arxiv.org/abs/1810.03993
    - title: 'ZeRO: Memory Optimizations Toward Training Trillion Parameter Models (Rajbhandari et al., 2019)'
      url: https://arxiv.org/abs/1910.02054
objectives:
  - id: objective.architecture-defense-project
    version: 2-draft
    statement: Choose an architecture for a stated product constraint, back the choice with memory, latency, and training-cost arithmetic, and write an honest trade-off defense with tests that could prove it wrong.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - architecture-defense-project.base.v2
      - architecture-defense-project.transfer.v2
      - architecture-defense-project.budget.v2
    prerequisites:
      - anyOf:
          - objective.ai-product-framing
      - anyOf:
          - objective.production-data-and-model-artifacts
      - anyOf:
          - objective.evaluation-releases-and-rollback
      - anyOf:
          - objective.model-report-and-artifact-inventory
scenes:
  - id: architecture-defense-project.s1
    title: A turbine manual, a laptop, and no signal
    type: explanation
    depth: intuition
    objective_refs:
      - objective.architecture-defense-project
    markdown: |-
      A technician is 80 meters up a wind turbine, with no mobile signal, holding a rugged laptop. She asks: "What torque for the blade-bolt retightening on this model?" The answer is in a 32,000-token service manual. A wrong number can crack a bolt, and a vague answer is useless.

      Your client, a turbine-maintenance company, wants an assistant for exactly this. Your job in this final project is to choose the model architecture and defend the choice to a skeptical review panel.

      **Your brief**

      | | |
      | --- | --- |
      | Goal | Choose one of four candidate models and a serving and training plan that meet the constraint sheet |
      | Audience | A review panel: an engineer, a safety lead, and a finance manager, each of whom will challenge one assumption |
      | Done looks like | A two-page defense: a budget table, a system diagram, five acceptance tests, a trade-off paragraph, and answers to three challenges |
      | Time | About 60 minutes; the arithmetic works with a calculator, the code, or both |

      This project pulls together three modules: memory and bandwidth from infrastructure (module 17), architecture trade-offs from efficient architectures (module 19), and serving costs (module 27). No new ideas, just all of them at once, the way a real design review works.
  - id: architecture-defense-project.s2
    title: The constraint sheet and four candidates
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.architecture-defense-project
    markdown: |-
      **Milestone 1: write the requirements first.** The lesson *Compare sequence architectures with an honest budget* showed why: fix the constraints before looking at any results, or you'll pick whichever metric flatters your favorite. The client's sheet:

      | Requirement | Value |
      | --- | --- |
      | Hardware | One laptop GPU: 16 GB memory, 500 GB/s bandwidth, about 50 trillion usable 16-bit FLOP/s (assumed figures for this project) |
      | Context | One manual, up to 32,768 tokens, chosen when the technician selects the turbine |
      | Speed | First words within 2 s of a question; then at least 15 tokens per second |
      | Accuracy | Quote torque values and part numbers exactly |
      | Offline | Everything runs on the laptop |
      | Adaptation | Fine-tune on 2,000 question–answer pairs, using one 80 GB training GPU |

      **The candidates.** All attention layers use 8 KV heads of width 128 (grouped-query attention, from the lesson *Reduce the state stored for attention keys and values*) and a 16-bit cache.

      | | Model | Parameters | Bytes per weight | Attention layers |
      | --- | --- | ---: | ---: | ---: |
      | A | Transformer | 8B | 2 (16-bit) | 32 |
      | B | Same transformer, quantized | 8B | 0.5 (4-bit) | 32 |
      | C | Hybrid, 1 attention layer in 8, rest state-space | 7B | 0.5 (4-bit) | 4 |
      | D | Smaller transformer | 3B | 2 (16-bit) | 28 |

      The hybrid's state-space layers keep a fixed-size state of about 0.02 GB, like Jamba-style designs from module 19. Reserve 1.5 GB for working buffers on every candidate.
  - id: architecture-defense-project.budget
    title: Do the memory and speed arithmetic
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.architecture-defense-project
    markdown: |-
      **Milestone 2: budget every candidate.** You need four formulas, each from an earlier lesson:

      - **Weights** = parameters × bytes per weight.
      - **KV cache** = 2 × attention layers × KV heads × head width × 2 bytes × tokens (*From a prompt to a stream of tokens*).
      - **Decode time per token** ≈ (weights + cache) ÷ bandwidth, since each step reads both.
      - **Prefill time** ≈ 2 × parameters × tokens ÷ FLOP/s. Treat it as a floor: at 32K tokens, attention's own arithmetic, which this formula leaves out, adds roughly another 50–100% for the full transformers. That only strengthens the case for the fix in the predict below.

      Work candidate B by hand first. Weights: 8 billion × 0.5 = 4.0 GB. Cache: 2 × 32 × 8 × 128 × 2 = 131,072 bytes per token, times 32,768 tokens = 4.29 GB. Total 4.0 + 4.29 + 1.5 = 9.8 GB, under 16. Decode: 8.29 GB ÷ 500 GB/s = 16.6 ms per token, about 60 tokens per second.

      ```python run
      MEM_GB, BW_GBps, FLOPS = 16, 500, 50e12     # laptop GPU: memory, bandwidth, usable FLOP/s
      CONTEXT, QUESTION, OVERHEAD_GB = 32_768, 200, 1.5

      #              name                         params  bytes/wt  attn layers  extra state GB
      candidates = [("A 8B transformer, 16-bit", 8e9, 2.0, 32, 0.0),
                    ("B 8B transformer, 4-bit",  8e9, 0.5, 32, 0.0),
                    ("C 7B hybrid 1:7, 4-bit",   7e9, 0.5,  4, 0.02),
                    ("D 3B transformer, 16-bit", 3e9, 2.0, 28, 0.0)]

      for name, params, bpw, layers, state in candidates:
          weights = params * bpw / 1e9
          kv = 2 * layers * 8 * 128 * 2 * CONTEXT / 1e9 + state   # 8 KV heads, width 128, 16-bit
          total = weights + kv + OVERHEAD_GB
          tok_s = BW_GBps / (weights + kv)                        # decode reads weights + cache
          manual = 2 * params * CONTEXT / FLOPS                   # prefill the whole manual once
          ttft = 2 * params * QUESTION / FLOPS                    # prefill one 200-token question
          full_ft = params * 16 / 1e9                             # mixed-precision Adam: 16 bytes/param
          print(f"{name}: {weights:4.1f} + {kv:4.2f} + {OVERHEAD_GB} = {total:4.1f} GB "
                f"{'fits' if total <= MEM_GB else 'TOO BIG'} | {tok_s:3.0f} tok/s | "
                f"manual {manual:4.1f} s, question {ttft * 1e3:2.0f} ms | full fine-tune {full_ft:3.0f} GB")
      ```

      **Expected output:**

      | | Memory (GB) | Fits 16 GB? | Decode (tok/s) | Prefill manual | Prefill question | Full fine-tune states |
      | --- | ---: | --- | ---: | ---: | ---: | ---: |
      | A | 21.8 | No | 25 | 10.5 s | 64 ms | 128 GB |
      | B | 9.8 | Yes | 60 | 10.5 s | 64 ms | 128 GB |
      | C | 5.6 | Yes | 123 | 9.2 s | 56 ms | 112 GB |
      | D | 11.3 | Yes | 51 | 3.9 s | 24 ms | 48 GB |

      A is out on memory alone. B, C, and D all clear the speed floor of 15 tokens per second by a wide margin.

      :::predict The technician asks her first question right after selecting the turbine. If the model has to read the manual and the question together, how long until the first word, for B?
      About 10.5 s for the manual plus 0.06 s for the question: five times over the 2 s limit. The fix is **prefix caching** from module 27: prefill the manual once when the turbine is selected (show a "loading manual" bar), keep its keys and values, and prefill only each new question. Then the first word arrives in well under a second. Every candidate needs this; even D's 3.9 s would fail without it.
      :::
  - id: architecture-defense-project.s3
    title: Tests that could prove you wrong
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.architecture-defense-project
    markdown: |-
      **Milestone 3: write acceptance tests before you run them.** The arithmetic says what *fits*. It says nothing about whether the answers are right. Write five tests now, each with a pass mark, so the panel can see what would change your mind:

      | Test | Pass mark | What it guards |
      | --- | --- | --- |
      | 200 torque and part-number questions, answers compared character by character with the manual | At most 1 error in 200 | Exact quoting |
      | The same 200 questions on the 16-bit model on a server | Same or fewer errors than 4-bit | What 4-bit quantization costs (*Reduce deployment cost while measuring what changes*) |
      | Questions whose answer sits in the middle of the manual | Same accuracy as start and end | Buried facts in long context |
      | Questions the manual doesn't answer | Says "not in this manual" in at least 95% | Abstaining instead of inventing a number |
      | Timed runs on the laptop, cache warm and cold | First word under 2 s warm; at least 15 tok/s | The speed arithmetic |

      Keep a strict wall between these 200 test questions and the 2,000 fine-tuning pairs, split by manual section, so no test answer was seen in training.
  - id: architecture-defense-project.writeup
    title: Write the trade-off paragraph the panel will attack
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.architecture-defense-project
    markdown: |-
      **Milestone 4: choose and defend.** Three candidates fit. The arithmetic alone would pick C, which is lightest and twice as fast. Here's a worked defense that picks B anyway, and says why in terms a reviewer can check:

      > *We choose B, the 8B transformer at 4 bits, with the manual prefix-cached. It uses 9.8 of 16 GB and decodes about 60 tokens per second, four times the requirement. C is faster and smaller, but our hard requirement is exact quoting, and published evidence for hybrids on exact long-range recall is thinner than for transformers, with less mature tooling. We will run C against B on the torque test; if C matches B's error count, we'll switch. D fits too, but a 3B model is our fallback only if B misses the speed test on real hardware. Biggest risk: 4-bit rounding may garble digits, so every quoted number is checked against the manual before display.*

      Every sentence names something measured or measurable. None says "best" without saying at what.

      **The training lane.** Full fine-tuning with mixed-precision Adam needs 16 bytes per parameter for model states (the lesson *Account for everything that occupies accelerator memory*): 128 GB for B's 8 billion parameters, before activations. That doesn't fit the 80 GB training GPU. The plan: train a LoRA adapter on the frozen base (*Adapt a model by learning a smaller parameter update*), which needs the 16 GB of 16-bit weights plus a small adapter and its optimizer state, then serve the 4-bit base with the adapter attached. Rerun the 4-bit test after adapting, since both changes affect accuracy.

      :::mixup "The fastest candidate that fits is the right choice."
      Speed only has to *clear* the bar; beyond 15 tokens per second, the technician can't read any faster. Once the hard constraints are met, spend the remaining budget on the requirement that can still fail: here, exact quoting.
      :::
    diagram:
      caption: The chosen design. The manual is prefilled once; each question reuses its cache, and every quoted number is checked.
      description: The turbine manual goes into a one-time prefill, which writes the cached keys and values of the manual. The technician's question goes to the 8B 4-bit transformer, which also reads the cached manual on every step. The model streams an answer, which passes through a quote check that compares every number with the manual. A LoRA adapter, trained offline, is attached to the model.
      nodes:
        - id: manual
          label: Turbine manual
          note: 32,768 tokens
          col: 0
          row: 0
          tone: data
        - id: prefill
          label: Prefill once
          note: about 10 s at selection
          col: 1
          row: 0
          tone: accent
        - id: cache
          label: Cached manual
          note: 4.3 GB of keys and values
          col: 2
          row: 0
          tone: data
        - id: question
          label: Technician's question
          col: 0
          row: 1
        - id: model
          label: 8B transformer, 4-bit
          note: 4 GB of weights
          col: 2
          row: 1
          tone: accent
        - id: answer
          label: Streamed answer
          note: about 60 tokens/s
          col: 3
          row: 1
        - id: check
          label: Quote check
          note: numbers compared with manual
          col: 4
          row: 1
          tone: warn
        - id: adapter
          label: LoRA adapter
          note: trained offline
          col: 1
          row: 2
          tone: muted
      edges:
        - from: manual
          to: prefill
        - from: prefill
          to: cache
        - from: cache
          to: model
          label: read every step
        - from: question
          to: model
        - from: model
          to: answer
        - from: answer
          to: check
        - from: adapter
          to: model
          dashed: true
  - id: architecture-defense-project.mistakes
    title: Five mistakes review panels catch
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.architecture-defense-project
    markdown: |-
      | Mistake | How to spot it | Fix |
      | --- | --- | --- |
      | Budgeting weights only | Your table has no cache column | Add the KV cache at the *full* context, plus buffers |
      | Mixing GB and GiB | Totals differ from a colleague's by about 7% | Pick one unit and say which |
      | Quoting speed without its phase | "C is 2× faster" with no mention of prefill or decode | Give prefill time and decode tokens per second separately, at a stated context |
      | Treating 4-bit as free | No test compares 4-bit with 16-bit answers | Measure the quality change on your own task |
      | Full fine-tune on a GPU it can't fit | Training plan ignores optimizer state | Count 16 bytes per parameter; use an adapter or more GPUs |

      :::try Change one constraint
      Set `CONTEXT = 131_072` in the code, as if the client wanted four manuals loaded at once. Which candidates still fit? (B's cache grows to 17.2 GB on its own, so only C survives, at 7.2 GB in total. Long context is exactly where the hybrid's small cache pays off, and your defense would change.)
      :::
  - id: architecture-defense-project.s4
    title: Face the panel and score the defense
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.architecture-defense-project
    markdown: |-
      **Milestone 5: answer three challenges.** Write a short reply to each, using numbers from your table:

      1. *Engineer:* "Why not C? It's twice as fast." (Speed clears the bar; exact quoting decides; you'll switch if C passes the torque test.)
      2. *Safety lead:* "What happens when the model gets a torque value wrong?" (The quote check blocks unmatched numbers, and the unanswerable-question test measures abstention.)
      3. *Finance:* "Why can't we fully fine-tune?" (128 GB of model states on an 80 GB GPU.)

      **No-code option.** Fill the budget table by hand for B and D using the four formulas, then take A and C from the expected output. Everything in the defense works the same way.

      **Rubric.** Score yourself, or ask a friend to play the panel.

      | Criterion | Not yet | Solid | Excellent |
      | --- | --- | --- | --- |
      | Requirements | Listed after the choice | Written first, with numbers | Hard constraints separated from preferences |
      | Arithmetic | Weights only | Weights, cache, decode speed | Also prefill, prefix caching, and training memory |
      | Tests | "We'll evaluate it" | Five tests with pass marks | Tests would change the choice if they failed |
      | Trade-off | Picks a favorite | Compares all candidates that fit | Names the deciding requirement and the switch condition |
      | Challenges | Unanswered | Answered in words | Answered with numbers from your own table |

      The questions below check the concepts; judge your defense itself with this rubric.
  - id: architecture-defense-project.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.architecture-defense-project
    markdown: |-
      Budget a few new decode speeds, rescue candidate A, and defend designs for a clinic tablet, a vague speed claim, and a model that misquotes torque values.
    takeaway: |-
      Write the constraints first, then check memory, speed, and training cost against them. Among the designs that fit, let the hardest remaining requirement decide, and say what test would change your mind.
  - id: architecture-defense-project.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.architecture-defense-project
    markdown: |-
      Explain how the system meets its task from inputs through training and inference. Defend the evidence, resource assumptions, and behavior when something fails.
