schema_version: 0.2-draft
lesson:
  id: architecture-defense-project
  version: 0.1.0-draft
  title: 'Final project: defend an end-to-end AI system design'
  state: draft
  summary: Defend a complete AI system recipe by connecting requirements, representations, learning stages, inference,
    evaluation, costs, and failure handling with explicit evidence and uncertainty.
  slot: M36.8
  category: learning
  minutes: 60
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
  - title: Model Cards
    url: https://arxiv.org/abs/1810.03993
objectives:
- id: objective.architecture-defense-project
  version: 1-draft
  statement: Defend a complete AI system recipe by connecting requirements, representations, learning stages, inference,
    evaluation, costs, and failure handling with explicit evidence and uncertainty.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - architecture-defense-project.base
  - architecture-defense-project.transfer
  prerequisites:
  - anyOf:
    - objective.ai-product-framing
  - anyOf:
    - objective.production-data-and-model-artifacts
  - anyOf:
    - objective.evaluation-releases-and-rollback
  - anyOf:
    - objective.model-report-and-artifact-inventory
scenes:
- id: architecture-defense-project.s1
  title: Select a concrete brief
  type: explanation
  depth: intuition
  objective_refs:
  - objective.architecture-defense-project
  markdown: 'Choose one: a museum question-answering assistant using supplied documents; a classifier for a small
    labeled image collection; or a conditional generator of synthetic geometric images. Define users, inputs, outputs,
    an unacceptable failure, and a no-AI baseline. Keep the proposal on paper or in local files; no production deployment
    or expensive training is required.'
  text_mode: 'Choose one: a museum question-answering assistant using supplied documents; a classifier for a small
    labeled image collection; or a conditional generator of synthetic geometric images. Define users, inputs, outputs,
    an unacceptable failure, and a no-AI baseline. Keep the proposal on paper or in local files; no production deployment
    or expensive training is required.'
  bridges: []
- id: architecture-defense-project.s2
  title: Build the complete recipe
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.architecture-defense-project
  markdown: Draw raw inputs → preparation → representation → model → output processing → user action. Add a separate
    training lane for data splits, objective, updates, checkpoints, and any adaptation. For a reused checkpoint,
    cite its exact artifact and distinguish your work from its original pretraining. Explain inference state, stopping
    conditions, resource assumptions, and permissions at each external boundary.
  text_mode: Draw raw inputs → preparation → representation → model → output processing → user action. Add a separate
    training lane for data splits, objective, updates, checkpoints, and any adaptation. For a reused checkpoint,
    cite its exact artifact and distinguish your work from its original pretraining. Explain inference state, stopping
    conditions, resource assumptions, and permissions at each external boundary.
  bridges: []
- id: architecture-defense-project.s3
  title: Make the design falsifiable
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.architecture-defense-project
  markdown: Specify five fresh acceptance cases, two stress cases, and one abstention or failure-recovery case before
    evaluating. For the museum example, include supported hours, an unsupported price, contradictory documents,
    and an injected instruction; citation correctness and authorized actions need separate checks. For images, define
    held-out splits, meaningful quality criteria, and duplicate checks appropriate to classification or generation.
  text_mode: Specify five fresh acceptance cases, two stress cases, and one abstention or failure-recovery case
    before evaluating. For the museum example, include supported hours, an unsupported price, contradictory documents,
    and an injected instruction; citation correctness and authorized actions need separate checks. For images, define
    held-out splits, meaningful quality criteria, and duplicate checks appropriate to classification or generation.
  bridges: []
- id: architecture-defense-project.s4
  title: Defend and revise
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.architecture-defense-project
  markdown: 'Deliver a two-page design, diagram, evidence inventory, test table, and limitations note. Score requirements,
    mechanism correctness, evidence/unknowns, evaluation, and operating boundaries 0–2 each. Revise zeros and ask
    a peer to challenge one assumption. There is no automated capstone grading in this draft: the quiz checks planning
    concepts, and the artifact needs human review before any claim of comprehensive mastery.'
  text_mode: 'Deliver a two-page design, diagram, evidence inventory, test table, and limitations note. Score requirements,
    mechanism correctness, evidence/unknowns, evaluation, and operating boundaries 0–2 each. Revise zeros and ask
    a peer to challenge one assumption. There is no automated capstone grading in this draft: the quiz checks planning
    concepts, and the artifact needs human review before any claim of comprehensive mastery.'
  bridges: []
- id: architecture-defense-project.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.architecture-defense-project
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Defend a complete AI system recipe by connecting requirements, representations, learning stages, inference,
    evaluation, costs, and failure handling with explicit evidence and uncertainty.
- id: architecture-defense-project.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.architecture-defense-project
  markdown: Defend a complete AI system recipe by connecting requirements, representations, learning stages, inference,
    evaluation, costs, and failure handling with explicit evidence and uncertainty.
  text_mode: Defend a complete AI system recipe by connecting requirements, representations, learning stages, inference,
    evaluation, costs, and failure handling with explicit evidence and uncertainty.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - architecture-defense-project.s1
    - architecture-defense-project.s2
    - architecture-defense-project.s3
    - architecture-defense-project.s4
    - architecture-defense-project.check
    gate_refs:
    - gate.core
