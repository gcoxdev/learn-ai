assessment_families:
  - id: architecture-defense-project.base
    objective_ref: objective.architecture-defense-project
    task: base
    response_type: single_choice
    points: 1
    hint: 'Build the complete recipe: trace the inputs, operation, and result before choosing.'
    remediation_scene: architecture-defense-project.s2
    variants:
      - id: architecture-defense-project.base.1
        prompt: What belongs in the training lane for a reused checkpoint?
        options:
          - id: b
            text: A claim that you pretrained it yourself
          - id: c
            text: Only the serving endpoint
          - id: a
            text: Its documented original lifecycle plus your actual adaptation, clearly distinguished
        answer: a
        feedback: Artifact lineage prevents confusing reuse with original training.
        retired: true
      - id: architecture-defense-project.base.2
        prompt: When should acceptance cases be specified?
        options:
          - id: c
            text: Only after deployment
          - id: a
            text: Before examining the system’s evaluation results
          - id: b
            text: After choosing only successful examples
        answer: a
        feedback: Prespecified criteria make evaluation less vulnerable to cherry-picking.
        retired: true
  - id: architecture-defense-project.transfer
    objective_ref: objective.architecture-defense-project
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Defend and revise: trace the inputs, operation, and result before choosing.'
    remediation_scene: architecture-defense-project.s4
    variants:
      - id: architecture-defense-project.transfer.1
        prompt: Does citation correctness alone establish authorized tool use?
        options:
          - id: c
            text: Only for retrieval systems
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Evidence quality and action permissions are separate properties.
        retired: true
      - id: architecture-defense-project.transfer.2
        prompt: Does passing the final project quiz certify the unseen design?
        options:
          - id: a
            text: No; the artifact needs separate review
          - id: b
            text: 'Yes'
          - id: c
            text: Only if all previous quizzes passed
        answer: a
        feedback: Concept checks cannot inspect or defend an artifact they never receive.
        retired: true
  - id: architecture-defense-project.base.v2
    objective_ref: objective.architecture-defense-project
    task: base
    response_type: single_choice
    points: 1
    hint: Recompute the line of the budget the question touches (weights, cache, prefill, or training states) before judging the design.
    remediation_scene: architecture-defense-project.budget
    variants:
      - id: architecture-defense-project.base.v2.1
        prompt: 'Candidate A (8B, 16-bit) needs 21.8 GB on the 16 GB laptop GPU: 16 GB of weights, 4.3 GB of cache, 1.5 GB of buffers. Which single change brings it under budget?'
        options:
          - id: b
            text: Halve the context to 16K tokens, cutting the cache to about 2.1 GB
          - id: a
            text: Store the weights in 4 bits, cutting them from 16 GB to 4 GB
          - id: c
            text: Use a hybrid layout, cutting the cache from 4.3 GB to about 0.6 GB
        answer: a
        feedback: 4 + 4.3 + 1.5 = 9.8 GB fits. The other two leave 16 GB of weights in place, giving 19.6 GB and 18.1 GB, both still over budget; the weights are the line that has to shrink.
      - id: architecture-defense-project.base.v2.2
        prompt: Without prefix caching, candidate B takes about 10.5 s to show its first word. Why does caching the manual fix this?
        options:
          - id: a
            text: The manual's keys and values are computed once, so each question prefills only its own tokens
          - id: b
            text: Caching keeps the weights in faster memory, so each prefill reads them more quickly
          - id: c
            text: Caching lets decode skip rereading the weights for tokens it has already produced
        answer: a
        feedback: The 10.5 s is prefill arithmetic over 32,768 manual tokens. Reuse those keys and values and only about 200 question tokens remain, roughly 64 ms. Prefill is limited by arithmetic, not by weight reads, so faster memory wouldn't help much.
      - id: architecture-defense-project.base.v2.3
        prompt: The team wants to fully fine-tune the 8B model with mixed-precision Adam on one 80 GB GPU. What does the memory count say?
        options:
          - id: c
            text: About 32 GB of states, since gradients double the weights, so it fits
          - id: b
            text: About 16 GB of states, the same as the weights, so it fits easily
          - id: a
            text: About 128 GB of states before activations, so use an adapter or more GPUs
        answer: a
        feedback: 'Model states cost 16 bytes per parameter: 16-bit weights and gradients, plus fp32 master weights and two Adam moments. 8 billion × 16 = 128 GB. Counting only weights and gradients is the classic undercount.'
      - id: architecture-defense-project.base.v2.4
        prompt: Candidate C decodes about twice as fast as B and uses less memory. Which requirement is the reason the worked defense still picks B for now?
        options:
          - id: a
            text: Exact quoting, where published evidence for hybrids on recall is thinner
          - id: b
            text: Memory, since C's 5.6 GB leaves too little room for the manual's cache
          - id: c
            text: First-word time, since C's prefill of the manual is slower than B's
        answer: a
        feedback: Both clear the speed and memory bars, so the hardest remaining requirement decides, and B is kept until C passes the torque test. C's prefill (9.2 s) is actually a little faster than B's (10.5 s), and 5.6 GB already includes its cache.
  - id: architecture-defense-project.transfer.v2
    objective_ref: objective.architecture-defense-project
    task: transfer
    response_type: single_choice
    points: 1
    hint: Check the hard constraints with arithmetic first; only among designs that pass them does quality or speed decide.
    remediation_scene: architecture-defense-project.writeup
    variants:
      - id: architecture-defense-project.transfer.v2.1
        prompt: A clinic wants note summaries on a tablet with 8 GB free, using 4K-token notes. A colleague proposes an 8B transformer in 16-bit because it tops a benchmark. What is the first objection?
        options:
          - id: b
            text: Transformers decode more slowly than hybrids at short contexts like 4K
          - id: a
            text: Its 16 GB of weights alone exceed the 8 GB budget, before any cache
          - id: c
            text: The benchmark was run on server GPUs, so its scores can't carry over
        answer: a
        feedback: 8 billion × 2 bytes = 16 GB, twice the budget, so it's out before quality matters. At 4K tokens, architectures differ little in speed, and benchmark scores don't depend on which GPU ran them.
      - id: architecture-defense-project.transfer.v2.2
        prompt: A vendor's slide says "our model is 3× faster" and gives no other detail. What should your review ask first?
        options:
          - id: c
            text: Faster after quantization, and at what cost in benchmark accuracy?
          - id: b
            text: Faster than which competitor, and was it the same model size?
          - id: a
            text: Faster at prefill or decode, at what context length and batch size?
        answer: a
        feedback: Prefill and decode have different bottlenecks, and speedups often appear only at long contexts or particular batch sizes. Model size and quantization matter too, but without the phase and workload the claim can't be checked at all.
      - id: architecture-defense-project.transfer.v2.3
        prompt: Testing finds the 4-bit model misquotes 3 of 200 torque values, while the 16-bit model on a server misquotes none. What belongs in the defense?
        options:
          - id: a
            text: The 3 misquotes, their likely cause, and a mitigation such as checking numbers
          - id: b
            text: The 16-bit result, since it shows what the chosen architecture can do
          - id: c
            text: The average of both runs, since they are versions of the same model
        answer: a
        feedback: The laptop will run the 4-bit model, so its 3 in 200 is the number that matters, and it misses the 1-in-200 pass mark. Reporting the server result describes a system nobody will ship.
      - id: architecture-defense-project.transfer.v2.4
        prompt: 'A reviewer asks: "Why not give candidate B a 131,072-token context so four manuals fit at once?" What is the strongest reply?'
        options:
          - id: b
            text: The weights would grow fourfold, from 4 GB to 16 GB, and fill the GPU
          - id: c
            text: Decode speed would not change, so the longer context adds no value
          - id: a
            text: The cache would grow to about 17 GB, which alone exceeds the 16 GB GPU
        answer: a
        feedback: The cache grows with context, so 4 × 4.29 = 17.2 GB. The weights stay at 4 GB whatever the context, and decode speed would actually drop, since each step reads the larger cache.
  - id: architecture-defense-project.budget.v2
    objective_ref: objective.architecture-defense-project
    task: base
    response_type: numeric
    points: 1
    hint: Decode tokens per second ≈ bandwidth ÷ (weight GB + cache GB), because every step reads both once.
    remediation_scene: architecture-defense-project.budget
    absolute_tolerance: 0.5
    variants:
      - id: architecture-defense-project.budget.v2.1
        prompt: A model has 4 GB of weights and a 1 GB KV cache, on a GPU with 500 GB/s of memory bandwidth. About how many tokens per second can it decode?
        answer: 100
        feedback: Each step reads 4 + 1 = 5 GB, and 5 ÷ 500 = 0.01 s, so about 100 tokens per second.
      - id: architecture-defense-project.budget.v2.2
        prompt: A model has 6 GB of weights and a 2 GB KV cache, on a GPU with 400 GB/s of memory bandwidth. About how many tokens per second can it decode?
        answer: 50
        feedback: Each step reads 8 GB, and 8 ÷ 400 = 0.02 s, so about 50 tokens per second.
      - id: architecture-defense-project.budget.v2.3
        prompt: A 4-bit model has 2 GB of weights and a 0.5 GB KV cache, on a GPU with 500 GB/s of memory bandwidth. About how many tokens per second can it decode?
        answer: 200
