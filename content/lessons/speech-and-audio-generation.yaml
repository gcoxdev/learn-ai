    A model can generate these codes and decode them into samples.


    Other designs generate waveform values more directly. Each route makes different choices about compression
    rate, retained detail, and computation.'
  bridges: []
- id: speech-and-audio-generation.s3
  title: Understand the generation schedule
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.speech-and-audio-generation
  markdown: Autoregressive generation produces successive units conditioned on earlier ones. Diffusion-style
    or other iterative generators refine a representation through repeated evaluations. Streaming emits usable
    chunks before the full signal is complete. Chunk boundaries, future context, and decoder buffering can
    affect smoothness and delay.
  text_mode: Autoregressive generation produces successive units conditioned on earlier ones. Diffusion-style
    or other iterative generators refine a representation through repeated evaluations. Streaming emits usable
    chunks before the full signal is complete. Chunk boundaries, future context, and decoder buffering can
    affect smoothness and delay.
  bridges: []
- id: speech-and-audio-generation.s4
  title: Evaluate the listening task
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.speech-and-audio-generation
  markdown: 'Measure intelligibility, pronunciation, naturalness, speaker consistency, artifacts, and latency
    under the intended use. A reference waveform need not be the only valid rendition, so simple sample-wise
    error can be misleading. Speaker identity and consent also matter when creating or using voice-conditioned
    systems.


    Imagine two correct readings of “good morning,” one slightly slower. Their sample-by-sample values differ
    greatly, even though both are understandable and natural. Listening judgments and task-specific checks
    help measure what a raw waveform difference misses. Music and sound effects add further goals such as rhythm,
    continuity and matching a description.'
  text_mode: 'Measure intelligibility, pronunciation, naturalness, speaker consistency, artifacts, and latency
    under the intended use. A reference waveform need not be the only valid rendition, so simple sample-wise
    error can be misleading. Speaker identity and consent also matter when creating or using voice-conditioned
    systems.


