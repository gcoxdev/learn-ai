lesson:
  id: speech-and-audio-generation
  version: 0.3.0-draft
  title: Generate sound from a representation
  state: draft
  summary: Follow a sentence or sound description through an acoustic representation to a generated waveform.
  slot: M13.7
  category: learning
  sources:
  - title: 'WaveNet: A Generative Model for Raw Audio'
    url: https://arxiv.org/abs/1609.03499
  - title: High Fidelity Neural Audio Compression
    url: https://arxiv.org/abs/2210.13438
  - title: Speech and Language Processing — authors’ draft
    url: https://web.stanford.edu/~jurafsky/slp3/
objectives:
- id: objective.speech-and-audio-generation
  version: 1-draft
  statement: Speech and audio generators separate conditioning, intermediate representations, and waveform
    synthesis; vocoders, codecs, and streaming choices introduce different quality and latency tradeoffs.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - speech-and-audio-generation.base
  - speech-and-audio-generation.transfer
  prerequisites:
  - anyOf:
    - objective.audio-representations
  - anyOf:
    - objective.sequence-to-sequence
scenes:
- id: speech-and-audio-generation.s1
  title: Decide what should guide the sound
  type: explanation
  depth: intuition
  objective_refs:
  - objective.speech-and-audio-generation
  markdown: '**Conditioning** supplies information that guides generation. Text-to-speech can use a sentence,
    pronunciation cues, a voice, and a requested style. Other audio tasks may use a sound description or preceding
    music.


    **Prosody** is the pattern of timing, stress, and intonation. “You finished?” and “You finished.” use the
    same words but can sound different. Producing these patterns coherently over time is part of the generation
    task.'
  text_mode: '**Conditioning** supplies information that guides generation. Text-to-speech can use a sentence,
    pronunciation cues, a voice, and a requested style. Other audio tasks may use a sound description or preceding
    music.


    **Prosody** is the pattern of timing, stress, and intonation. “You finished?” and “You finished.” use the
    same words but can sound different. Producing these patterns coherently over time is part of the generation
    task.'
  bridges: []
- id: speech-and-audio-generation.s2
  title: Turn an acoustic representation into samples
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.speech-and-audio-generation
  markdown: 'One design predicts an acoustic representation, such as a mel spectrogram. A **vocoder** then
    turns that representation into waveform samples.


    Another route uses a **codec**, short for coder–decoder. Its encoder compresses audio and its decoder reconstructs
    it. Learned **codec tokens** are compact code choices for audio patterns; they need not correspond to words.
    A model can generate these codes and decode them into samples.


    Other designs generate waveform values more directly. Each route makes different choices about compression
    rate, retained detail, and computation.'
