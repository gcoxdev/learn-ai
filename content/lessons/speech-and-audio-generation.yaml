schema_version: 0.2-draft
lesson:
  id: speech-and-audio-generation
  version: 0.2.0-draft
  title: Generate sound from a representation
  state: draft
  summary: Follow a sentence or sound description through an acoustic representation to a generated waveform.
  slot: M13.7
  category: learning
  sources:
  - title: 'WaveNet: A Generative Model for Raw Audio'
    url: https://arxiv.org/abs/1609.03499
  - title: High Fidelity Neural Audio Compression
    url: https://arxiv.org/abs/2210.13438
  - title: Speech and Language Processing — authors’ draft
    url: https://web.stanford.edu/~jurafsky/slp3/
objectives:
- id: objective.speech-and-audio-generation
  version: 1-draft
  statement: Speech and audio generators separate conditioning, intermediate representations, and waveform
    synthesis; vocoders, codecs, and streaming choices introduce different quality and latency tradeoffs.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - speech-and-audio-generation.base
  - speech-and-audio-generation.transfer
  prerequisites:
  - anyOf:
    - objective.audio-representations
  - anyOf:
    - objective.sequence-to-sequence
scenes:
- id: speech-and-audio-generation.s1
  title: Start with the desired condition
  type: explanation
  depth: intuition
  objective_refs:
  - objective.speech-and-audio-generation
  markdown: 'Text-to-speech may condition on text, pronunciation cues, speaker information, and style controls.
    Other audio generation tasks condition on music context or descriptions. The model must produce a temporally
    coherent signal, not merely select a word label. Timing and prosody are part of the output.


    **Conditioning** means supplying information that guides generation, such as the sentence and requested
    speaking style. **Prosody** is the pattern of timing, stress and intonation. “You finished?” and “You finished.”
    can use the same words while sounding different; deciding those patterns is part of speech generation.'
  text_mode: 'Text-to-speech may condition on text, pronunciation cues, speaker information, and style controls.
    Other audio generation tasks condition on music context or descriptions. The model must produce a temporally
    coherent signal, not merely select a word label. Timing and prosody are part of the output.


    **Conditioning** means supplying information that guides generation, such as the sentence and requested
    speaking style. **Prosody** is the pattern of timing, stress and intonation. “You finished?” and “You finished.”
    can use the same words while sounding different; deciding those patterns is part of speech generation.'
  bridges: []
- id: speech-and-audio-generation.s2
  title: Separate acoustic prediction from waveform synthesis
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.speech-and-audio-generation
  markdown: 'One design predicts an acoustic representation such as a mel spectrogram, then a vocoder produces
    waveform samples. Other designs generate waveform values or learned codec tokens more directly. A codec
    encoder compresses audio into a representation and a decoder reconstructs it; this introduces a quality
    and rate tradeoff.


    A **vocoder** turns an acoustic representation into a waveform. A **codec**, short for coder–decoder, compresses
    a signal and reconstructs it. **Codec tokens** are compact code choices for learned audio patterns; they
    need not correspond to words. A model might generate those codes first and then decode them into samples.'
  text_mode: 'One design predicts an acoustic representation such as a mel spectrogram, then a vocoder produces
    waveform samples. Other designs generate waveform values or learned codec tokens more directly. A codec
    encoder compresses audio into a representation and a decoder reconstructs it; this introduces a quality
    and rate tradeoff.


    A **vocoder** turns an acoustic representation into a waveform. A **codec**, short for coder–decoder, compresses
    a signal and reconstructs it. **Codec tokens** are compact code choices for learned audio patterns; they
    need not correspond to words. A model might generate those codes first and then decode them into samples.'
  bridges: []
- id: speech-and-audio-generation.s3
  title: Understand the generation schedule
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.speech-and-audio-generation
  markdown: Autoregressive generation produces successive units conditioned on earlier ones. Diffusion-style
    or other iterative generators refine a representation through repeated evaluations. Streaming emits usable
    chunks before the full signal is complete. Chunk boundaries, future context, and decoder buffering can
    affect smoothness and delay.
  text_mode: Autoregressive generation produces successive units conditioned on earlier ones. Diffusion-style
    or other iterative generators refine a representation through repeated evaluations. Streaming emits usable
    chunks before the full signal is complete. Chunk boundaries, future context, and decoder buffering can
    affect smoothness and delay.
  bridges: []
- id: speech-and-audio-generation.s4
  title: Evaluate the listening task
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.speech-and-audio-generation
  markdown: 'Measure intelligibility, pronunciation, naturalness, speaker consistency, artifacts, and latency
    under the intended use. A reference waveform need not be the only valid rendition, so simple sample-wise
    error can be misleading. Speaker identity and consent also matter when creating or using voice-conditioned
    systems.


    Imagine two correct readings of “good morning,” one slightly slower. Their sample-by-sample values differ
    greatly, even though both are understandable and natural. Listening judgments and task-specific checks
    help measure what a raw waveform difference misses. Music and sound effects add further goals such as rhythm,
    continuity and matching a description.'
  text_mode: 'Measure intelligibility, pronunciation, naturalness, speaker consistency, artifacts, and latency
    under the intended use. A reference waveform need not be the only valid rendition, so simple sample-wise
    error can be misleading. Speaker identity and consent also matter when creating or using voice-conditioned
    systems.


