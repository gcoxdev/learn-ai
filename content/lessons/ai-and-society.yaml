assessment_families:
  - id: ai-and-society.base
    objective_ref: objective.ai-and-society
    task: base
    response_type: single_choice
    points: 1
    hint: 'Consider access and concentration: trace the inputs, operation, and result before choosing.'
    remediation_scene: ai-and-society.s2
    variants:
      - id: ai-and-society.base.1
        prompt: Does automating one task imply eliminating an entire occupation?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if the model is generative
        answer: a
        feedback: Jobs contain multiple tasks and organizational relationships.
        retired: true
      - id: ai-and-society.base.2
        prompt: Does publishing weights remove every access barrier?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only for English models
          - id: a
            text: 'No'
        answer: a
        feedback: Hardware, expertise, language, and terms can still constrain use.
        retired: true
  - id: ai-and-society.transfer
    objective_ref: objective.ai-and-society
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Make governance operational: trace the inputs, operation, and result before choosing.'
    remediation_scene: ai-and-society.s4
    variants:
      - id: ai-and-society.transfer.1
        prompt: Why specify resource-accounting boundaries?
        options:
          - id: b
            text: Energy and compute are identical units
          - id: c
            text: Only final-run time matters universally
          - id: a
            text: Different included stages lead to different totals
        answer: a
        feedback: A number is interpretable only within its measurement scope.
        retired: true
      - id: ai-and-society.transfer.2
        prompt: What makes governance more than a principles document?
        options:
          - id: c
            text: Only a public slogan
          - id: a
            text: Assigned authority, monitoring, response, and correction mechanisms
          - id: b
            text: A longer model name
        answer: a
        feedback: Operational responsibility connects principles to action.
        retired: true
  - id: ai-and-society.base.v2
    objective_ref: objective.ai-and-society
    task: base
    response_type: single_choice
    points: 1
    hint: 'Keep the units apart: tasks versus jobs, power (kW) versus energy (kWh), and training once versus answering prompts every day.'
    remediation_scene: ai-and-society.s3
    variants:
      - id: ai-and-society.base.v2.1
        prompt: A study rates 60% of a translator's tasks as "exposed" to language models. What does that figure measure?
        options:
          - id: b
            text: The share of translators likely to lose their jobs to AI
          - id: a
            text: The share of tasks a tool could do in half the time or less
          - id: c
            text: The share of their work translators already do with AI
        answer: a
        feedback: Exposure, as Eloundou et al. define it, means a tool could cut a task's time by at least half. It describes potential, not layoffs or current use; what employers do with the time is a separate question.
      - id: ai-and-society.base.v2.2
        prompt: A server draws 2 kW for 3 hours in a data center with a PUE of 1.5. How much electricity does the facility use for it?
        options:
          - id: a
            text: 9 kWh, since 2 kW × 3 h × 1.5 = 9
          - id: b
            text: 6 kWh, since 2 kW × 3 h = 6
          - id: c
            text: 4 kWh, since 2 kW × 3 h ÷ 1.5 = 4
        answer: a
        feedback: Energy is power times time, 6 kWh at the server, and PUE scales it up to the whole facility, giving 9 kWh. Leaving out PUE ignores cooling; dividing by it reverses its meaning.
      - id: ai-and-society.base.v2.3
        prompt: One estimate puts a chatbot prompt at 0.24 Wh and another at 3 Wh. What is the most likely reason they differ?
        options:
          - id: c
            text: Newer data centers draw about ten times more power per server
          - id: a
            text: They include different things, such as idle servers and prompt length
          - id: b
            text: One of them must be a typo, since each prompt uses a fixed amount
        answer: a
        feedback: Per-prompt figures depend on the model, the prompt, and what is counted, such as idle machines, cooling, and hardware. Energy per prompt isn't fixed, and a tenfold gap needs no typo to explain it.
      - id: ai-and-society.base.v2.4
        prompt: In Bartz v. Anthropic (June 2025), what distinction did the judge draw?
        options:
          - id: b
            text: Training on fiction was fair use, but training on nonfiction was not
          - id: c
            text: Outputs given away free were fair use, but outputs sold were not
          - id: a
            text: Training on bought books was fair use, but keeping pirated copies was not
        answer: a
        feedback: Judge Alsup treated training itself as highly transformative but ruled that building a library of pirated books was not fair use; the case later settled. The ruling didn't split fiction from nonfiction or turn on how outputs were sold.
  - id: ai-and-society.transfer.v2
    objective_ref: objective.ai-and-society
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Ask what is counted and for whom: whose tasks change, which energy is included, and who is left out.'
    remediation_scene: ai-and-society.s1
    variants:
      - id: ai-and-society.transfer.v2.1
        prompt: A bank gives its call-center staff an AI assistant like the one Brynjolfsson and colleagues studied. Whose productivity would you expect to rise most?
        options:
          - id: a
            text: Newer, less experienced agents
          - id: b
            text: The most experienced agents
          - id: c
            text: All agents by about the same amount
        answer: a
        feedback: In the study, novice and lower-skilled agents gained 34% while experienced agents gained little, since the assistant spread the experts' habits to everyone. Equal gains weren't observed.
      - id: ai-and-society.transfer.v2.2
        prompt: A startup says training its model used only 50 MWh. It serves 10 million prompts a day at about 0.3 Wh each. What does its claim leave out?
        options:
          - id: b
            text: Little, since training usually dominates a model's lifetime energy
          - id: a
            text: Inference, at 3 MWh a day, which passes the training total in weeks
          - id: c
            text: Only the GPU count, since training energy follows from it directly
        answer: a
        feedback: 10 million × 0.3 Wh = 3 MWh a day, so serving matches the 50 MWh of training in about 17 days. For a popular product, inference usually outweighs training; a GPU count alone gives power, not energy.
      - id: ai-and-society.transfer.v2.3
        prompt: A health chatbot works well in English, poorly in Amharic, and costs a monthly fee. A ministry wants it for rural clinics in Ethiopia. What should it check first?
        options:
          - id: c
            text: Whether the model has more parameters than rival chatbots do
          - id: b
            text: Its English benchmark score, which reflects its overall quality
          - id: a
            text: Quality in local languages, the cost, and connectivity at the clinics
        answer: a
        feedback: Access depends on the intended users' language, budget, and connection. An English score says little about Amharic, and parameter counts don't measure whether rural clinics can use the tool.
      - id: ai-and-society.transfer.v2.4
        prompt: A politician dismisses a genuine recording of himself as "obviously AI." What is this an example of?
        options:
          - id: a
            text: The liar's dividend, where fakes make real evidence easier to deny
          - id: b
            text: A deepfake, meaning synthetic media that depicts a real person
          - id: c
            text: A jailbreak, meaning a user persuading a model to break its rules
        answer: a
        feedback: The recording is real; the harm comes from doubt that deepfakes make plausible, which Chesney and Citron called the liar's dividend. No synthetic media or model was involved.
  - id: ai-and-society.energy
    objective_ref: objective.ai-and-society
    task: base
    response_type: numeric
    points: 1
    hint: 'Energy (kWh) = number of GPUs × kW per GPU × hours × PUE. Convert watts to kW (÷ 1,000) and days to hours (× 24) first.'
    remediation_scene: ai-and-society.s3
    absolute_tolerance: 1
    variants:
      - id: ai-and-society.energy.1
        prompt: A fine-tuning job runs 8 GPUs at 700 W each for 24 hours in a data center with PUE 1.5. How many kWh does the facility use?
        answer: 201.6
        feedback: 8 × 0.7 kW × 24 h = 134.4 kWh at the GPUs, and × 1.5 for the facility gives 201.6 kWh.
      - id: ai-and-society.energy.2
        prompt: A training run uses 500 GPUs at 400 W each for 10 days, with PUE 1.1. How many kWh is that?
        answer: 52800
        feedback: 500 × 0.4 kW = 200 kW; × 240 h = 48,000 kWh; × 1.1 = 52,800 kWh.
      - id: ai-and-society.energy.3
        prompt: A chatbot answers 2 million prompts a day at an estimated 0.3 Wh per prompt, with overhead already included. How many kWh per day is that?
        answer: 600
        feedback: 2,000,000 × 0.3 Wh = 600,000 Wh = 600 kWh a day. Divide Wh by 1,000 to get kWh.
      - id: ai-and-society.energy.4
        prompt: A lab trains on 64 GPUs at 700 W each for 14 days, with PUE 1.25. How many kWh does the facility use?
        answer: 18816
        feedback: 64 × 0.7 kW = 44.8 kW; × 336 h = 15,052.8 kWh; × 1.25 = 18,816 kWh.
