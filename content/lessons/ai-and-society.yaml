objectives:
  - id: objective.ai-and-society
    version: 2-draft
    statement: AI’s social effects depend on how systems are built, governed, and used; assess distribution of benefits and costs, provenance, resource accounting, and mechanisms for accountability.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - ai-and-society.base.v2
      - ai-and-society.transfer.v2
      - ai-and-society.energy
    prerequisites:
      - anyOf:
          - objective.stakeholders-and-deployment-decisions
      - anyOf:
          - objective.reliable-training-operations
scenes:
  - id: ai-and-society.s1
    title: Exposed tasks, not doomed jobs
    type: explanation
    depth: intuition
    objective_refs:
      - objective.ai-and-society
    markdown: |-
      In 2023, Tyna Eloundou, Sam Manning, Pamela Mishkin, and Daniel Rock rated about a thousand US occupations task by task. A task counted as **exposed** if a language model could cut the time it takes by at least half at the same quality. Their headline: around 80% of US workers have at least 10% of their tasks exposed, and about 19% have at least half. Higher-paid jobs were, on average, *more* exposed.

      Exposure says a tool *could* speed a task up, not what employers will do. Work through one paralegal's week:

      | Task | Hours | Exposed? |
      | --- | ---: | --- |
      | Reviewing documents | 12 | yes |
      | Writing routine letters | 8 | yes |
      | Legal research | 6 | yes |
      | Client calls | 8 | no |
      | Court filings in person | 6 | no |

      :::predict 26 of 40 hours are exposed. If those tasks take half as long, what happens to this paralegal?
      13 hours a week are freed, and the table can't say what comes next. The firm might take on more cases, cut staff, or move people into client work.
      :::

      Field evidence is still narrow. Erik Brynjolfsson, Danielle Li, and Lindsey Raymond studied 5,179 customer-support agents given an AI assistant. On average they resolved 14% more issues per hour. Novice and lower-skilled agents gained 34%, while the most experienced gained little: the tool narrowed the gap between new and expert workers.
    bridges: []
  - id: ai-and-society.s3
    title: Count the kilowatt-hours yourself
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-and-society
    markdown: |-
      Headlines about AI's electricity use swing wildly because they count different things, so do the arithmetic yourself. **Power** is a rate, measured in kilowatts (kW). **Energy** is power times time, in kilowatt-hours (kWh). A data center also spends electricity on cooling and power conversion; its **PUE** (power usage effectiveness) is total facility energy divided by the energy reaching the computers, so 1.2 means 20% extra.

      Take a training run on 1,000 GPUs rated at 700 W each (an H100's maximum), running 30 days in a data center with PUE 1.2:

      $$1{,}000 \times 0.7\ \text{kW} \times 720\ \text{h} \times 1.2 = 604{,}800\ \text{kWh} \approx 605\ \text{MWh}$$

      That's roughly what 58 average US homes use in a year. Now the other side: answering prompts. Published estimates for one chatbot text prompt run from about 0.24 Wh (Google's August 2025 figure for a median Gemini prompt) and 0.34 Wh (OpenAI chief executive Sam Altman's June 2025 figure for an average ChatGPT query) up to about 3 Wh in earlier outside estimates. They count different things (idle servers, cooling, prompt length, which model), and none has been independently audited.

      ```python run
      # Training run: every number here is an assumption you can change.
      gpus = 1_000
      watts_per_gpu = 700          # an H100 SXM's maximum rated power
      days = 30
      pue = 1.2                    # data-center overhead: cooling, power conversion
      train_kwh = gpus * watts_per_gpu / 1000 * days * 24 * pue
      print(f"training run: {train_kwh:,.0f} kWh = {train_kwh / 1000:,.0f} MWh")
      home_kwh_per_year = 10_500   # roughly an average US household
      print(f"= about {train_kwh / home_kwh_per_year:.0f} US homes' electricity for a year")

      # Inference: published per-prompt estimates differ more than tenfold.
      prompts_per_day = 1_000_000_000
      for wh in [0.24, 0.34, 3.0]:
          mwh_per_day = prompts_per_day * wh / 1_000_000
          days_to_match = train_kwh / 1000 / mwh_per_day
          print(f"{wh:>4} Wh/prompt -> {mwh_per_day:,.0f} MWh per day; "
                f"matches the training run in {days_to_match:.1f} days")
      ```

      At a billion prompts a day, serving uses as much electricity as this training run every 2.5 days, even at the lowest estimate: for a popular product, inference dominates. Try `pue = 1.5` for an older facility, or 10 million prompts a day for a smaller service. For scale, the International Energy Agency estimated that all the world's data centers, AI and otherwise, used about 415 TWh in 2024, around 1.5% of global electricity.
    bridges: []
  - id: ai-and-society.copyright
    title: Who owns what goes in and what comes out
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-and-society
    markdown: |-
      Copyright fights over AI ask two separate questions. **Inputs**: is it lawful to train on copyrighted works without permission? **Outputs**: who owns what a model generates, and what if it reproduces someone's work? In the US, training cases mostly turn on **fair use**, a defense that weighs, among other things, how transformative a use is and whether it harms the market for the original.

      | Case or decision | Question | Claim or ruling |
      | --- | --- | --- |
      | *New York Times v. Microsoft and OpenAI* (filed December 2023) | Training on news articles; outputs that reproduce them | The Times says training and outputs both infringe; the companies argue fair use |
      | *Thomson Reuters v. Ross Intelligence* (February 2025) | Using legal headnotes to build a non-generative search tool | A judge ruled it was not fair use; Ross appealed |
      | *Bartz v. Anthropic* (June 2025) | Training on books | A judge ruled training was fair use, but building a library of pirated copies was not; the parties then agreed a \$1.5 billion settlement |
      | *Kadrey v. Meta* (June 2025) | Training on books | Meta won, but the judge stressed the ruling rested on the authors' arguments and didn't declare such training lawful |
      | US Copyright Office and *Thaler v. Perlmutter* (2025) | Can AI output be copyrighted? | Only with enough human authorship; a machine can't be the author |

      Other countries apply different rules, and many of these cases are still moving through the courts. The lasting point: the input and output questions are separate, and "it was on the web" settles neither.
    bridges: []
  - id: ai-and-society.s2
    title: Who gets to use it
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-and-society
    markdown: |-
      Benefits only reach people who can use the tool. Three barriers matter most:

      - **Connectivity.** The International Telecommunication Union estimated that about 2.6 billion people, roughly a third of the world, were still offline in 2024.
      - **Language.** As the lesson on tokenizing different languages showed, many languages need several times more tokens for the same text, which makes them slower and costlier to serve, and models usually saw far less training text in them.
      - **Cost.** A monthly subscription that is a coffee's price in one country can be a day's wages in another.

      Open-weight models help people with the hardware and skills to run them, who are not the people who need help most. The gap between those who can use a technology and those who can't is the **digital divide**, and choices like these decide whether AI widens or narrows it.
    bridges: []
  - id: ai-and-society.s4
    title: Cheap to make, costly to check
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-and-society
    markdown: |-
      Generative models make convincing text, images, and audio nearly free to produce, while checking them still takes human time. That imbalance worries researchers studying **misinformation**, though measured effects so far are mixed: several analyses of 2024's many elections found less AI-driven deception than had been feared. The damage can also run the other way.

      :::mixup "The danger of deepfakes is that people will believe fake things."
      That's half of it. Legal scholars Robert Chesney and Danielle Citron named the other half the **liar's dividend**: once everyone knows fakes exist, people caught on genuine recordings can claim they're fake. Doubt itself becomes a weapon.
      :::

      Who answers when things go wrong? As in this module's first lesson, accountability is assigned before launch: someone who takes complaints, someone who can correct or withdraw a system, and records that let outsiders check. Laws increasingly require this; the EU AI Act, in force since August 2024, sets duties by risk level. The module's last lesson turns to deliberate misuse and how to verify what you see.
    bridges: []
  - id: ai-and-society.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.ai-and-society
    markdown: Compute kilowatt-hours from GPUs, hours, and PUE, then read an exposure study, a support-desk trial, a copyright ruling, a startup's energy claim, and a politician's "it's fake."
    takeaway: |-
      Exposure studies count tasks, not lost jobs; energy is power × hours × PUE, and inference can outweigh training; copyright splits into what goes in and what comes out. Ask who is counted, what is included, and who is left out.
  - id: ai-and-society.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.ai-and-society
    markdown: |-
      AI’s effects extend beyond a model score. Track who gains, who bears costs, which resources are counted, and who can correct or retire the system.
