schema_version: 0.2-draft
lesson:
  id: ai-and-society
  version: 0.1.0-draft
  title: Assess labor, access, resources, and accountability across the lifecycle
  state: draft
  summary: AI’s social effects depend on how systems are built, governed, and used; assess distribution of benefits
    and costs, provenance, resource accounting, and mechanisms for accountability.
  slot: M29.7
  category: learning
  sources:
  - title: NIST AI Risk Management Framework
    url: https://www.nist.gov/itl/ai-risk-management-framework
  - title: Green AI
    url: https://arxiv.org/abs/1907.10597
  - title: On the Dangers of Stochastic Parrots
    url: https://dl.acm.org/doi/10.1145/3442188.3445922
objectives:
- id: objective.ai-and-society
  version: 1-draft
  statement: AI’s social effects depend on how systems are built, governed, and used; assess distribution of benefits
    and costs, provenance, resource accounting, and mechanisms for accountability.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - ai-and-society.base
  - ai-and-society.transfer
  prerequisites:
  - anyOf:
    - objective.stakeholders-and-deployment-decisions
  - anyOf:
    - objective.reliable-training-operations
scenes:
- id: ai-and-society.s1
  title: Tasks and jobs are different units
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ai-and-society
  markdown: Automating one task can change a job without eliminating the whole role. It can also shift work into
    review, labeling, correction, or supervision. Assess effects on workload, skill, bargaining power, accessibility,
    and who receives productivity gains instead of inferring one universal labor outcome.
  text_mode: Automating one task can change a job without eliminating the whole role. It can also shift work into
    review, labeling, correction, or supervision. Assess effects on workload, skill, bargaining power, accessibility,
    and who receives productivity gains instead of inferring one universal labor outcome.
  bridges: []
- id: ai-and-society.s2
  title: Consider access and concentration
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-and-society
  markdown: Compute, data, expertise, and deployment infrastructure affect who can build or use AI. Open artifacts
    can support inspection and adaptation, while hardware cost and language coverage still constrain participation.
    Public availability alone does not ensure equitable access or appropriate use.
  text_mode: Compute, data, expertise, and deployment infrastructure affect who can build or use AI. Open artifacts
    can support inspection and adaptation, while hardware cost and language coverage still constrain participation.
    Public availability alone does not ensure equitable access or appropriate use.
  bridges: []
- id: ai-and-society.s3
  title: Track provenance and resource boundaries
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-and-society
  markdown: Record data origins, contributions, artifact terms, and generated-content provenance where relevant.
    Authorship and usage rights require context-specific review rather than assumptions from a file’s availability.
    Resource reports should distinguish training, experimentation, inference, energy, water, and hardware lifecycle
    boundaries when those are measured.
  text_mode: Record data origins, contributions, artifact terms, and generated-content provenance where relevant.
    Authorship and usage rights require context-specific review rather than assumptions from a file’s availability.
    Resource reports should distinguish training, experimentation, inference, energy, water, and hardware lifecycle
    boundaries when those are measured.
  bridges: []
- id: ai-and-society.s4
  title: Make governance operational
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-and-society
  markdown: 'Assign responsibility for documentation, evaluation, complaints, incidents, and updates. Include affected
    perspectives and a way to challenge harmful outcomes. Governance is more than publishing a principle statement:
    it needs decisions, evidence, and people able to change or retire a system.'
  text_mode: 'Assign responsibility for documentation, evaluation, complaints, incidents, and updates. Include affected
    perspectives and a way to challenge harmful outcomes. Governance is more than publishing a principle statement:
    it needs decisions, evidence, and people able to change or retire a system.'
  bridges: []
- id: ai-and-society.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.ai-and-society
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: AI’s social effects depend on how systems are built, governed, and used; assess distribution of benefits
    and costs, provenance, resource accounting, and mechanisms for accountability.
