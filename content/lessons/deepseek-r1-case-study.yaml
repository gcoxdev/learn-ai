    bridges: []
  - id: deepseek-r1-case-study.s5
    title: The student caches more than the teacher
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.deepseek-r1-case-study
    markdown: |-
      :::predict R1 has 671B parameters; the Qwen-32B student has about 33B. Which one adds more KV cache per generated token?
      The student. R1 has V3's MLA cache, 61 × (512 + 64) × 2 bytes ≈ 68.6 KiB per token. The student is a Qwen2.5-32B with 64 layers and 8 KV heads of width 128, so 2 × 64 × 8 × 128 × 2 = 256 KiB, nearly four times as much.
      :::

      Reasoning models generate long traces, so the cache matters, as the lesson on batching and cache management showed. Compare the teacher with two students on memory, compute per generated token (about 2N FLOPs, with N the active parameters), and cache for one 8,192-token trace:

      ```python run
      # DeepSeek-R1 against two of its distilled students, per generated token
      # name: (stored params, active params, bytes per weight, KV bytes per token)
      models = {
          "DeepSeek-R1 (FP8)":      (671e9, 37e9, 1, 61 * (512 + 64) * 2),   # V3 shape, MLA
          "Distill-Qwen-32B (bf16)": (32.8e9, 32.8e9, 2, 2 * 64 * 8 * 128 * 2),
          "Distill-Llama-8B (bf16)": (8.03e9, 8.03e9, 2, 2 * 32 * 8 * 128 * 2),
      }
      trace = 8192                                    # tokens in one long reasoning trace

      for name, (stored, active, b, kv) in models.items():
          print(f"{name:24s} weights {stored * b / 1e9:4.0f} GB | "
                f"{2 * active / 1e9:3.0f} GFLOPs/token | KV {kv / 1024:5.1f} KiB/token, "
                f"{kv * trace / 2**30:.2f} GiB per trace")
      ```

      The 32B student saves weight memory, 66 GB against 671 GB, so it fits on one large GPU. It doesn't save much compute per token (66 against 74 GFLOPs), and each trace's cache is about four times bigger. For your checker serving many long traces at once, those caches could fill the GPU before the weights do. Try `trace = 32768`.
    bridges: []
  - id: deepseek-r1-case-study.s6
    title: An evidence ledger for the R1 family
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.deepseek-r1-case-study
    markdown: |-
      Before you choose, write each claim down with its evidence label:

      | Claim | Label |
      | --- | --- |
      | R1-Zero's AIME 2024 score rose from 15.6% to 71.0% | Documented |
      | Distill-Qwen-32B caches 256 KiB per token | Computed |
      | The student will handle our homework questions well | Unknown until measured |
      | The student's shown reasoning is how it reached its answer | Unknown |
      | R1's post-training GPU-hours | Unknown (not in revision 1) |

      The fourth row matters for a checker that *shows* its working. A verifier can confirm the final answer; it can't confirm that the visible reasoning caused it. As the lesson on reasoning and explanations shows, a correct answer can come with a flawed chain. If students will read the working, test it too, for example by checking each step on a sample of solved problems.
    bridges: []
  - id: deepseek-r1-case-study.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.deepseek-r1-case-study
    markdown: Trace which R1-family model came from where, compute teacher and student memory, and advise a self-hosting team, a small lab, and a tutoring product.
    takeaway: |-
      R1-Zero is RL on a pretrained base; R1 is four stages of SFT and RL on the same base; the students are dense Qwen and Llama models fine-tuned on R1's outputs. Students copy behavior, not architecture, so size them from their own configs.
  - id: deepseek-r1-case-study.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.deepseek-r1-case-study
    markdown: |-
      R1-Zero applies RL to a pretrained base; R1 uses staged supervised and reward-based training. Distilled students learn selected behavior while keeping their own architectures.
