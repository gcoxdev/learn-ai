schema_version: 0.2-draft
lesson:
  id: deepseek-r1-case-study
  version: 0.4.0-draft
  title: Separate DeepSeek-R1, R1-Zero, and distilled students
  state: draft
  summary: Download "DeepSeek-R1-Distill-Qwen-32B" and you get a Qwen model, not a small DeepSeek. Untangle R1-Zero, R1, and their students, and find out why the student caches more per token than its giant teacher.
  slot: M35.5
  category: learning
  sources:
    - title: DeepSeek-R1 report v1
      url: https://arxiv.org/abs/2501.12948v1
    - title: DeepSeek-R1 official repository
      url: https://github.com/deepseek-ai/DeepSeek-R1
objectives:
  - id: objective.deepseek-r1-case-study
    version: 2-draft
    statement: DeepSeek-R1 illustrates reasoning post-training on an already pretrained base; distinguish the staged R1 recipe, direct-RL R1-Zero experiment, and architecturally different distilled students.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - deepseek-r1-case-study.base.v2
      - deepseek-r1-case-study.transfer.v2
      - deepseek-r1-case-study.calculate
    prerequisites:
      - anyOf:
          - objective.deepseek-v3-case-study
      - anyOf:
          - objective.group-relative-policy-learning
      - anyOf:
          - objective.reasoning-distillation-and-cost
scenes:
  - id: deepseek-r1-case-study.s1
    title: Three kinds of model under one name
    type: explanation
    depth: intuition
    objective_refs:
      - objective.deepseek-r1-case-study
    markdown: |-
      Your team wants a maths-homework checker that shows its working. Someone downloads "DeepSeek-R1-Distill-Qwen-32B," expecting a small DeepSeek model. Its config says `Qwen2ForCausalLM`: a dense Qwen2.5 model with no experts and no latent attention.

      That's not a mistake. The January 2025 release (**report revision 1, January 22, 2025**) contains three kinds of model, and the name "R1" covers all of them:

      | Model | Starts from | Training | Architecture |
      | --- | --- | --- | --- |
      | DeepSeek-R1-Zero | DeepSeek-V3-Base | RL only | V3: 671B MoE, MLA |
      | DeepSeek-R1 | DeepSeek-V3-Base | SFT and RL, in four stages | V3: 671B MoE, MLA |
      | Six distilled students | Qwen2.5 or Llama bases | SFT on R1's outputs, no RL | Their own base's dense design |

      This lesson takes one row at a time. The reasoning module already covers the machinery: GRPO, verifiable rewards, cold starts, and distillation. Here the job is keeping the three straight. Later date-suffixed R1 releases need their own evidence.
    bridges: []
  - id: deepseek-r1-case-study.s2
    title: "R1-Zero: reinforcement learning on a pretrained base"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.deepseek-r1-case-study
    markdown: |-
      R1-Zero took the pretrained V3-Base and ran RL directly, with no supervised examples first. "Zero" means zero SFT, not zero training: the 14.8T tokens of pretraining were already in the weights.

      Its rewards were two rules: an **accuracy reward** (the final answer matches, or the code passes tests) and a **format reward** (reasoning goes between `<think>` and `</think>`). The update rule was GRPO, which scores each answer against the other answers sampled for the same question.

      :::papers GRPO's group-relative advantage
      $$\hat{A}_i = \frac{r_i - \operatorname{mean}(r_1,\dots,r_G)}{\operatorname{std}(r_1,\dots,r_G)}$$

      Sample $G$ answers to one question and reward each. With $G = 4$ and rewards $1, 0, 0, 1$, the mean is 0.5 and the standard deviation 0.5, so each correct answer gets advantage $+1$ and each wrong one $-1$. No learned critic is needed; the group is the baseline.
      :::

      On AIME 2024, R1-Zero's single-attempt score rose from 15.6% to 71.0% during training, and to 86.7% with majority voting over 64 samples. Its responses grew longer on their own, and the report shows it pausing mid-solution to recheck ("an aha moment"). But its reasoning was often hard to read and mixed languages. That's what R1 set out to fix.
    bridges: []
  - id: deepseek-r1-case-study.s3
    title: "R1: four stages, two of them supervised"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.deepseek-r1-case-study
    markdown: |-
      R1 alternates imitation and reward:

      1. **Cold-start SFT** on "thousands" of long, readable reasoning examples, each ending with a summary.
      2. **Reasoning RL**, as for R1-Zero, plus a **language consistency reward**: the share of reasoning words in the target language. The report notes it cost a little accuracy, and kept it because people prefer readable reasoning.
      3. **Rejection sampling and SFT.** The RL checkpoint answered many prompts; only correct answers were kept, giving about 600K reasoning samples. With about 200K non-reasoning samples (writing, factual QA, translation), that made about 800K. These fine-tuned **V3-Base again from the start**, for two epochs.
      4. **RL for all scenarios**: rule-based rewards for reasoning, and reward models for general helpfulness and harmlessness.

      Step 3 is easy to misread. It doesn't continue training the RL checkpoint. It uses that checkpoint as a data generator, then trains a fresh copy of the base.

      Revision 1 gives no GPU-hours for any of this. R1's post-training cost is **unknown** from this report, even though V3's pretraining cost is documented.
    bridges: []
  - id: deepseek-r1-case-study.s4
    title: The students are Qwen and Llama models
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.deepseek-r1-case-study
    markdown: |-
      The same 800K samples fine-tuned six open models: Qwen2.5-Math-1.5B, Qwen2.5-Math-7B, Qwen2.5-14B, Qwen2.5-32B, Llama-3.1-8B, and Llama-3.3-70B-Instruct. SFT only, with no RL stage.

      It worked remarkably well. DeepSeek-R1-Distill-Qwen-32B scored 72.6% on AIME 2024. The team also ran R1-Zero-style RL directly on Qwen2.5-32B-Base for over 10,000 steps, and it reached only 47.0%. For a model that size, imitating a stronger teacher beat discovering reasoning by RL.

      The repository puts its code and weights under MIT, and notes that the students come from Qwen2.5 (originally Apache 2.0) and Llama 3.1 and 3.3 bases (originally under Meta's licenses). Inventory the exact student you use, as in the lesson on reading a release.

      :::mixup "A distilled student is a smaller copy of its teacher's architecture."
      Distillation copies *behavior* through training text. The student keeps its own base's layers, attention, and tokenizer. R1-Distill-Llama-8B is architecturally Llama 3.1 8B, with no experts and no MLA.
      :::
    diagram:
      caption: The R1 release's lineage. Two models come from V3-Base; the six students come from other companies' bases.
      description: DeepSeek-V3-Base goes directly through RL to become DeepSeek-R1-Zero. V3-Base also goes through R1's four-stage pipeline to become DeepSeek-R1. The pipeline produces about 800K curated samples, which fine-tune Qwen2.5 and Llama base models into the six distilled students.
