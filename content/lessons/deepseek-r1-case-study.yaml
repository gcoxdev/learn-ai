assessment_families:
  - id: deepseek-r1-case-study.base
    objective_ref: objective.deepseek-r1-case-study
    task: base
    response_type: single_choice
    points: 1
    hint: Name the starting weights first, then list the training stages in order.
    remediation_scene: deepseek-r1-case-study.s2
    variants:
      - id: deepseek-r1-case-study.base.1
        prompt: Did R1-Zero begin from random weights?
        options:
          - id: a
            text: No; it began from pretrained V3-Base
          - id: b
            text: 'Yes'
          - id: c
            text: Only its tokenizer was pretrained
        answer: a
        feedback: Direct RL here omits initial SFT, not pretraining.
        retired: true
      - id: deepseek-r1-case-study.base.2
        prompt: Does the original R1 recipe consist only of one RL stage?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if a reward is verifiable
          - id: a
            text: No; it combines supervised and RL stages
        answer: a
        feedback: The stage sequence includes cold-start and later supervised training.
        retired: true
  - id: deepseek-r1-case-study.transfer
    objective_ref: objective.deepseek-r1-case-study
    task: transfer
    response_type: single_choice
    points: 1
    hint: Size a student from its own config, and label every claim before relying on it.
    remediation_scene: deepseek-r1-case-study.s6
    variants:
      - id: deepseek-r1-case-study.transfer.1
        prompt: Must a dense distilled student contain its teacher’s expert router?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only when trained on reasoning traces
          - id: a
            text: 'No'
        answer: a
        feedback: Training targets do not dictate the student architecture.
        retired: true
      - id: deepseek-r1-case-study.transfer.2
        prompt: Does a verified final answer establish a faithful internal reasoning explanation?
        options:
          - id: c
            text: Only for long traces
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Outcome correctness and explanation faithfulness are separate claims.
        retired: true
  - id: deepseek-r1-case-study.base.v2
    objective_ref: objective.deepseek-r1-case-study
    task: base
    response_type: single_choice
    points: 1
    hint: Find the row in the three-model table first, then recall which stages that model went through and why each was added.
    remediation_scene: deepseek-r1-case-study.s3
    variants:
      - id: deepseek-r1-case-study.base.v2.1
        prompt: How was DeepSeek-R1-Zero trained?
        options:
          - id: b
            text: From randomly initialized weights, using reinforcement learning alone
          - id: a
            text: From pretrained V3-Base, with GRPO and rule-based rewards and no SFT first
          - id: c
            text: From the V3 chat model after its SFT, with extra reinforcement learning
        answer: a
        feedback: '"Zero" means no supervised stage before RL; the 14.8T tokens of pretraining were already there. The chat model had its own SFT and RL, which R1-Zero skipped.'
      - id: deepseek-r1-case-study.base.v2.2
        prompt: Why does R1 begin with a cold-start SFT stage that R1-Zero skipped?
        options:
          - id: c
            text: To teach mathematical knowledge that the V3 base model lacked
          - id: b
            text: Because RL can't improve a base model without SFT first
          - id: a
            text: R1-Zero's reasoning was hard to read and mixed languages
        answer: a
        feedback: A few thousand readable examples set the format before RL. R1-Zero itself shows RL can improve a base model without SFT, and a few thousand examples are far too few to add much knowledge.
      - id: deepseek-r1-case-study.base.v2.3
        prompt: What happened to the roughly 800K samples curated in R1's third stage?
        options:
          - id: a
            text: They fine-tuned V3-Base again from the start, for two epochs
          - id: b
            text: They continued training the reasoning-RL checkpoint that generated them
          - id: c
            text: They trained a reward model used in the final RL stage
        answer: a
        feedback: The RL checkpoint served as a data generator, and a fresh copy of V3-Base was fine-tuned on its filtered outputs plus non-reasoning data. The same samples later trained the six students.
      - id: deepseek-r1-case-study.base.v2.4
        prompt: R1's reasoning RL added a language consistency reward even though it slightly lowered benchmark accuracy. Why?
        options:
          - id: b
            text: Mixed-language reasoning was causing most of the wrong final answers
          - id: c
            text: Reasoning in one language uses fewer tokens, which cut training cost
          - id: a
            text: People find single-language reasoning more readable, so the team accepted the cost
        answer: a
        feedback: The report says the reward aligns with human preference for readable reasoning, at a small cost in accuracy. It wasn't adopted to fix accuracy or to save tokens.
  - id: deepseek-r1-case-study.transfer.v2
    objective_ref: objective.deepseek-r1-case-study
    task: transfer
    response_type: single_choice
    points: 1
    hint: Students copy behavior, not architecture. Size each model from its own config, and label each claim as documented, computed, or unknown.
    remediation_scene: deepseek-r1-case-study.s5
    variants:
      - id: deepseek-r1-case-study.transfer.v2.1
        prompt: A team self-hosts DeepSeek-R1-Distill-Qwen-32B "to get R1's efficient MoE on one GPU." What will they actually get?
        options:
          - id: c
            text: A smaller MoE with fewer experts, but the same latent-attention cache
          - id: a
            text: A dense Qwen2.5 model with a larger per-token cache than R1
          - id: b
            text: R1's architecture with fewer layers, so the same cache per layer
        answer: a
        feedback: The student is Qwen2.5-32B fine-tuned on R1's outputs. It saves weight memory, but it caches 256 KiB per token against R1's 68.6, and it has no experts or MLA.
      - id: deepseek-r1-case-study.transfer.v2.2
        prompt: A small lab has a 14B base model, a strong reasoning teacher, and a limited budget. Which approach does the R1 report's evidence favor?
        options:
          - id: a
            text: Fine-tune on the teacher's filtered reasoning traces
          - id: b
            text: Run R1-Zero-style RL directly on the 14B base
          - id: c
            text: Train the 14B only on a few thousand cold-start examples
        answer: a
        feedback: For Qwen2.5-32B, distillation reached 72.6% on AIME 2024, while over 10,000 RL steps reached 47.0%, at higher cost. A small cold-start set is a starting point for RL, not a replacement for the full distillation data.
      - id: deepseek-r1-case-study.transfer.v2.3
        prompt: A tutoring product shows students the reasoning its R1-based model writes, and a checker confirms every final answer. What remains untested?
        options:
          - id: b
            text: Whether the final answers are correct across all the subjects offered
          - id: c
            text: Whether the reasoning was generated with the <think> format tags
          - id: a
            text: Whether the shown reasoning actually reflects how each answer was reached
        answer: a
        feedback: A correct final answer can come with flawed or unfaithful steps, so the working needs its own check. The checker already covers the answers, and format tags don't tell you whether the steps are sound.
      - id: deepseek-r1-case-study.transfer.v2.4
        prompt: A blog says "R1-Zero proves reinforcement learning creates reasoning from scratch." What's the precise correction?
        options:
          - id: c
            text: R1-Zero used thousands of supervised examples before its RL began
          - id: b
            text: R1-Zero's improvement came from majority voting, not from training
          - id: a
            text: RL started from a model already pretrained on 14.8T tokens
        answer: a
        feedback: R1-Zero skipped SFT, not pretraining, so RL drew out abilities the base model's pretraining had laid down. The cold start belongs to R1, and single-attempt scores rose too, from 15.6% to 71.0%.
  - id: deepseek-r1-case-study.calculate
    objective_ref: objective.deepseek-r1-case-study
    task: base
    response_type: numeric
    points: 1
    hint: "Weights = stored parameters × bytes. Compute per generated token ≈ 2 × active parameters. Cache = 2 × layers × KV heads × 128 × 2 bytes. GRPO advantage = (reward − group mean) ÷ group standard deviation."
    remediation_scene: deepseek-r1-case-study.s5
    absolute_tolerance: 0.1
    variants:
      - id: deepseek-r1-case-study.calculate.1
        prompt: DeepSeek-R1 has 671 billion parameters, released in FP8 (1 byte each). How many GB of weights is that?
        answer: 671
        feedback: 671 × 10⁹ × 1 byte = 671 GB, the same as V3, since R1 shares its architecture.
      - id: deepseek-r1-case-study.calculate.2
        prompt: DeepSeek-R1-Distill-Qwen-32B has about 32.8 billion parameters in bf16. How many GB of weights is that?
        answer: 65.6
        feedback: 32.8 × 10⁹ × 2 bytes = 65.6 GB, about a tenth of R1's FP8 weights.
      - id: deepseek-r1-case-study.calculate.3
        prompt: R1 uses 37 billion active parameters per token. At about 2 FLOPs per active parameter, how many GFLOPs does each generated token take?
        answer: 74
        feedback: 2 × 37 × 10⁹ = 74 × 10⁹ FLOPs = 74 GFLOPs, only a little more than the dense 32B student's 66.
      - id: deepseek-r1-case-study.calculate.4
        prompt: The Qwen-32B student has 64 layers and 8 KV heads of width 128, with a 2-byte cache. How many KiB does each token add?
        answer: 256
        feedback: 2 × 64 × 8 × 128 × 2 = 262,144 bytes = 256 KiB, nearly four times R1's 68.6 KiB.
      - id: deepseek-r1-case-study.calculate.5
        prompt: GRPO samples four answers to one question, with rewards 1, 0, 0, 1. What is the advantage of a correct answer, using the group mean and standard deviation?
        answer: 1
        feedback: The mean is 0.5 and the standard deviation (taken over the group, dividing by 4) is 0.5, so the advantage is (1 − 0.5) ÷ 0.5 = 1. Each wrong answer gets −1.
      - id: deepseek-r1-case-study.calculate.6
        prompt: The Qwen-32B student caches 256 KiB per token. How many GiB does one 8,192-token reasoning trace need?
        answer: 2
        feedback: 256 KiB × 8,192 = 2,097,152 KiB, and dividing by 1,024² gives 2 GiB. R1 would need about 0.54 GiB for the same trace.
