scenes:
- id: deepseek-r1-case-study.s1
  title: Pin three different objects
  type: explanation
  depth: intuition
  objective_refs:
  - objective.deepseek-r1-case-study
  markdown: 'Anchor: DeepSeek-R1 report revision 1, January 22, 2025. R1-Zero, R1, and the distilled models are
    different experiments, not interchangeable names. Later date-suffixed releases need their own evidence. Sources
    checked September 13, 2026; this lesson follows the original report and release lineage.'
  text_mode: 'Anchor: DeepSeek-R1 report revision 1, January 22, 2025. R1-Zero, R1, and the distilled models are
    different experiments, not interchangeable names. Later date-suffixed releases need their own evidence. Sources
    checked September 13, 2026; this lesson follows the original report and release lineage.'
  bridges: []
- id: deepseek-r1-case-study.s2
  title: Start from learned capabilities
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.deepseek-r1-case-study
  markdown: R1-Zero applies reinforcement learning directly to pretrained V3-Base without an initial supervised
    fine-tuning stage. It does not begin with random weights or without training data. The report uses this experiment
    to study reasoning behavior arising through reward-driven adaptation of an existing language model.
  text_mode: R1-Zero applies reinforcement learning directly to pretrained V3-Base without an initial supervised
    fine-tuning stage. It does not begin with random weights or without training data. The report uses this experiment
    to study reasoning behavior arising through reward-driven adaptation of an existing language model.
  bridges: []
- id: deepseek-r1-case-study.s3
  title: Trace the staged R1 recipe
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.deepseek-r1-case-study
  markdown: R1 uses cold-start supervised data, reasoning-oriented RL, supervised training on rejection-sampled
    reasoning plus non-reasoning examples, and a further RL stage across scenarios. GRPO and verifiable rewards
    belong within this lifecycle. A verifier still tests a specified outcome; it cannot certify every explanation
    or generalize to every task.
  text_mode: R1 uses cold-start supervised data, reasoning-oriented RL, supervised training on rejection-sampled
    reasoning plus non-reasoning examples, and a further RL stage across scenarios. GRPO and verifiable rewards
    belong within this lifecycle. A verifier still tests a specified outcome; it cannot certify every explanation
    or generalize to every task.
  bridges: []
- id: deepseek-r1-case-study.s4
  title: Inspect the students and artifacts
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.deepseek-r1-case-study
  markdown: The repository links dense Qwen and Llama derivatives trained from generated examples. These students
    do not inherit V3’s sparse architecture merely by imitating R1 outputs. The repository states MIT terms for
    its main code and weights while identifying upstream Qwen/Llama lineages and licenses for derivatives; inventory
    the exact student artifact.
  text_mode: The repository links dense Qwen and Llama derivatives trained from generated examples. These students
    do not inherit V3’s sparse architecture merely by imitating R1 outputs. The repository states MIT terms for
    its main code and weights while identifying upstream Qwen/Llama lineages and licenses for derivatives; inventory
    the exact student artifact.
  bridges: []
- id: deepseek-r1-case-study.s5
  title: Compare inference at the right boundary
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.deepseek-r1-case-study
  markdown: Record which checkpoint, template, stopping policy, and token budget produced each answer. Main-model
    expert memory, student dense weights, and generated reasoning length affect different costs. An inexpensive
    student may be appropriate for some measured tasks without reproducing the teacher’s training procedure or all
    capabilities.
  text_mode: Record which checkpoint, template, stopping policy, and token budget produced each answer. Main-model
    expert memory, student dense weights, and generated reasoning length affect different costs. An inexpensive
    student may be appropriate for some measured tasks without reproducing the teacher’s training procedure or all
    capabilities.
  bridges: []
- id: deepseek-r1-case-study.s6
  title: Build an evidence ledger
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.deepseek-r1-case-study
  markdown: 'Draw three columns: initialization, adaptation, and resulting artifact. Fill one row each for Zero,
    R1, and a named student. Mark missing details instead of guessing. Treat visible reasoning as generated behavior
    to evaluate, with its faithfulness a separate question from whether the final answer passes a check.'
  text_mode: 'Draw three columns: initialization, adaptation, and resulting artifact. Fill one row each for Zero,
    R1, and a named student. Mark missing details instead of guessing. Treat visible reasoning as generated behavior
    to evaluate, with its faithfulness a separate question from whether the final answer passes a check.'
  bridges: []
- id: deepseek-r1-case-study.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.deepseek-r1-case-study
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: DeepSeek-R1 illustrates reasoning post-training on an already pretrained base; distinguish the staged
    R1 recipe, direct-RL R1-Zero experiment, and architecturally different distilled students.
