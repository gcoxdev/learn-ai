assessment_families:
  - id: inference-time-search.base
    objective_ref: objective.inference-time-search
    task: base
    response_type: single_choice
    points: 1
    hint: 'Compare two selection rules: trace the inputs, operation, and result before choosing.'
    remediation_scene: inference-time-search.s2
    variants:
      - id: inference-time-search.base.1
        prompt: Five candidates answer A, A, B, B, B. Majority chooses what?
        options:
          - id: b
            text: A
          - id: c
            text: Neither by definition
          - id: a
            text: B
        answer: a
        feedback: B has three of five votes.
        retired: true
      - id: inference-time-search.base.2
        prompt: Does majority agreement prove correctness?
        options:
          - id: c
            text: Only if five candidates are used
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Samples may share correlated errors.
        retired: true
  - id: inference-time-search.transfer
    objective_ref: objective.inference-time-search
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Measure all spent work: trace the inputs, operation, and result before choosing.'
    remediation_scene: inference-time-search.s4
    variants:
      - id: inference-time-search.transfer.1
        prompt: What can a bad search heuristic do?
        options:
          - id: c
            text: Remove every dependency
          - id: a
            text: Prune a branch containing a valid solution
          - id: b
            text: Guarantee complete exploration at zero cost
        answer: a
        feedback: Search quality depends on which states are retained.
        retired: true
      - id: inference-time-search.transfer.2
        prompt: Which tokens count toward best-of-n compute?
        options:
          - id: a
            text: Tokens from all generated candidates and relevant evaluators
          - id: b
            text: Only the selected response
          - id: c
            text: Only the prompt title
        answer: a
        feedback: Discarded candidates still consumed resources.
        retired: true
  - id: inference-time-search.base.v2
    objective_ref: objective.inference-time-search
    task: base
    response_type: single_choice
    points: 1
    hint: "Name the selection rule first: a vote over final answers, a checker picking any passing sample, or a judge scoring partial steps. Then ask what each one needs to work."
    remediation_scene: inference-time-search.s1
    variants:
      - id: inference-time-search.base.v2.1
        prompt: What does self-consistency do with ten sampled chains of thought for one question?
        options:
          - id: b
            text: Returns the chain that a verifier scores the highest
          - id: a
            text: Returns the final answer that appears most often
          - id: c
            text: Merges the ten chains into one combined explanation
        answer: a
        feedback: Self-consistency is a vote over final answers; it needs no scorer. Picking by verifier score is best-of-n, and merging chains isn't part of either method.
      - id: inference-time-search.base.v2.2
        prompt: A model gets a yes/no question right 40% of the time, and each sample is independent. What does an 11-sample majority vote do to its accuracy?
        options:
          - id: c
            text: Leaves it at 40%, since each sample is just as accurate
          - id: b
            text: Raises it, since more samples cancel out random mistakes
          - id: a
            text: Lowers it, since the wrong answer usually wins the vote
        answer: a
        feedback: With the right answer in the minority, votes make the wrong answer win more reliably. The formula gives about 0.247 at 11 votes. Votes cancel random mistakes only when the right answer is the more common one.
      - id: inference-time-search.base.v2.3
        prompt: With a perfect checker, when does best-of-n succeed?
        options:
          - id: a
            text: When at least one of the n samples is correct
          - id: b
            text: When more than half of the n samples are correct
          - id: c
            text: When the first of the n samples is correct
        answer: a
        feedback: The checker finds any correct sample, so success is 1 − (1 − p)ⁿ. Needing a majority describes voting, and the order of the samples doesn't matter.
      - id: inference-time-search.base.v2.4
        prompt: What does Tree of Thoughts add that sampling complete chains doesn't?
        options:
          - id: c
            text: It fine-tunes the model on its most successful search paths
          - id: a
            text: It judges partial solutions and extends only promising ones
          - id: b
            text: It samples many full answers and then takes a majority vote
        answer: a
        feedback: Tree of Thoughts scores intermediate states and keeps the best, so a doomed first step gets pruned early. Voting on full answers is self-consistency, and Tree of Thoughts changes no weights.
      - id: inference-time-search.base.v2.5
        prompt: A system runs best-of-8 at 400 tokens per sample and shows the user one 400-token answer. How many tokens did it generate?
        options:
          - id: a
            text: 3,200, since every sample was generated in full
          - id: b
            text: 400, since the user sees only one answer
          - id: c
            text: 800, the chosen answer plus one comparison
        answer: a
        feedback: All eight samples were generated, 8 × 400 = 3,200 tokens, before any checking cost. Discarded samples are invisible to the user but not free.
  - id: inference-time-search.transfer.v2
    objective_ref: objective.inference-time-search
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask whether the samples' mistakes are independent, whether a trustworthy checker exists, and what the extra samples cost.
    remediation_scene: inference-time-search.s2
    variants:
      - id: inference-time-search.transfer.v2.1
        prompt: A model falls for a trick riddle in the same way 70% of the time. What will a majority vote over 21 samples most likely return?
        options:
          - id: a
            text: The same common wrong answer, almost every time
          - id: b
            text: The right answer, since extra samples wash out mistakes
          - id: c
            text: A random answer, since the votes will split evenly
        answer: a
        feedback: When 70% of samples share one wrong answer, the right answer wins a 21-vote majority less than 3% of the time. Voting amplifies whatever the model usually says, right or wrong.
      - id: inference-time-search.transfer.v2.2
        prompt: A coding assistant can sample 10 candidate programs, and the task comes with unit tests. Which selection rule fits best?
        options:
          - id: b
            text: Take a majority vote over the programs' source text
          - id: a
            text: Run the tests and return a program that passes them
          - id: c
            text: Return the longest program, since it handles more cases
        answer: a
        feedback: A trustworthy checker turns best-of-n into 1 − (1 − p)ⁿ. Programs that do the same thing rarely have identical text, so a vote over source splits, and length isn't correctness.
      - id: inference-time-search.transfer.v2.3
        prompt: An assistant writes free-text customer emails, and there's no checker. Which method is hardest to apply directly?
        options:
          - id: c
            text: Generating a few drafts for a person to choose from
          - id: b
            text: Asking the model for one careful, well-planned draft
          - id: a
            text: A majority vote, since free-text drafts rarely match
        answer: a
        feedback: Self-consistency needs final answers that can be grouped as identical, like numbers or labels. Emails never match word for word. A person can still pick among drafts, and one careful draft needs no selection at all.
      - id: inference-time-search.transfer.v2.4
        prompt: Picking the top-scoring answer from 1,000 samples with a learned reward model gives answers people rate worse than the top of 16 samples. What is the most likely explanation?
        options:
          - id: a
            text: A wider search finds more answers the scorer wrongly rates highly
          - id: b
            text: Sampling 1,000 times makes each individual sample less accurate
          - id: c
            text: Sixteen samples already contain every answer the model can give
        answer: a
        feedback: Selecting the maximum of a flawed scorer over many candidates finds its errors, a form of reward hacking at inference time. Each sample is just as good at n = 1,000, and more samples do add new answers; the scorer just picks the wrong ones.
  - id: inference-time-search.calculate
    objective_ref: objective.inference-time-search
    task: base
    response_type: numeric
    points: 1
    hint: With a perfect checker, best-of-n fails only if every sample fails. Compute (1 − p)ⁿ and subtract it from 1. (Give a decimal.)
    remediation_scene: inference-time-search.s2
    absolute_tolerance: 0.005
    variants:
      - id: inference-time-search.calculate.1
        prompt: Each sample is correct with probability 0.2, independently. With a perfect checker, what is the chance that best-of-3 succeeds?
        answer: 0.488
        feedback: 1 − 0.8³ = 1 − 0.512 = 0.488.
      - id: inference-time-search.calculate.2
        prompt: Each sample is correct with probability 0.5, independently. With a perfect checker, what is the chance that best-of-4 succeeds?
        answer: 0.9375
        feedback: 1 − 0.5⁴ = 1 − 0.0625 = 0.9375.
      - id: inference-time-search.calculate.3
        prompt: Each sample is correct with probability 0.1, independently. With a perfect checker, what is the chance that best-of-10 succeeds?
        answer: 0.651
        feedback: 1 − 0.9¹⁰ ≈ 1 − 0.349 = 0.651. Ten samples of a weak model still fail about a third of the time.
      - id: inference-time-search.calculate.4
        prompt: Each sample is correct with probability 0.3, independently. With a perfect checker, what is the chance that best-of-5 succeeds?
        answer: 0.832
        feedback: 1 − 0.7⁵ = 1 − 0.168 = 0.832.
  - id: inference-time-search.vote
    objective_ref: objective.inference-time-search
    task: base
    response_type: numeric
    points: 1
    hint: With 3 votes and two possible answers, the majority is right if all 3 are right (p³) or exactly 2 are (3 × p² × (1 − p)). Add them. (Give a decimal.)
    remediation_scene: inference-time-search.s1
    absolute_tolerance: 0.005
    variants:
      - id: inference-time-search.vote.1
        prompt: Each sample is independently right with probability 0.7, and there is one wrong answer. What is the chance a 3-sample majority vote is right?
        answer: 0.784
        feedback: 0.7³ + 3 × 0.7² × 0.3 = 0.343 + 0.441 = 0.784, up from 0.7.
      - id: inference-time-search.vote.2
        prompt: Each sample is independently right with probability 0.6, and there is one wrong answer. What is the chance a 3-sample majority vote is right?
        answer: 0.648
        feedback: 0.6³ + 3 × 0.6² × 0.4 = 0.216 + 0.432 = 0.648.
      - id: inference-time-search.vote.3
        prompt: Each sample is independently right with probability 0.8, and there is one wrong answer. What is the chance a 3-sample majority vote is right?
        answer: 0.896
        feedback: 0.8³ + 3 × 0.8² × 0.2 = 0.512 + 0.384 = 0.896.
      - id: inference-time-search.vote.4
        prompt: Each sample is independently right with probability 0.4, and there is one wrong answer. What is the chance a 3-sample majority vote is right?
        answer: 0.352
        feedback: 0.4³ + 3 × 0.4² × 0.6 = 0.064 + 0.288 = 0.352, down from 0.4. Voting hurts when the right answer is the minority.
