schema_version: 0.2-draft
lesson:
  id: inference-time-search
  version: 0.4.0-draft
  title: Spend extra generation on candidates, checks, and search
  state: draft
  summary: A model that's right 60% of the time can be right 68% of the time if it answers five times and votes, or 99% with a good checker. Here's the arithmetic, and the catch.
  slot: M21.6
  category: learning
  sources:
    - title: "Self-Consistency Improves Chain of Thought Reasoning in Language Models (Wang et al., 2022)"
      url: https://arxiv.org/abs/2203.11171
    - title: "Tree of Thoughts: Deliberate Problem Solving with Large Language Models (Yao et al., 2023)"
      url: https://arxiv.org/abs/2305.10601
    - title: "Training Verifiers to Solve Math Word Problems (Cobbe et al., 2021)"
      url: https://arxiv.org/abs/2110.14168
    - title: "Scaling LLM Test-Time Compute Optimally can be More Effective than Scaling Model Parameters (Snell et al., 2024)"
      url: https://arxiv.org/abs/2408.03314
    - title: "DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning (DeepSeek-AI, 2025)"
      url: https://arxiv.org/abs/2501.12948
objectives:
  - id: objective.inference-time-search
    version: 2-draft
    statement: Self-consistency, best-of-n selection, and tree search use inference compute to explore or select outputs; benefits depend on candidate diversity, evaluator quality, and the total budget.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - inference-time-search.base.v2
      - inference-time-search.transfer.v2
      - inference-time-search.calculate
      - inference-time-search.vote
    prerequisites:
      - anyOf:
          - objective.reasoning-and-explanations
      - anyOf:
          - objective.game-search
scenes:
  - id: inference-time-search.s1
    title: Ask five times, take a vote
    type: explanation
    depth: intuition
    objective_refs:
      - objective.inference-time-search
    markdown: |-
      Everything so far in this module changed the model's weights. This lesson leaves the weights alone and spends more computation when the question arrives, which is called **inference-time** (or test-time) compute.

      The simplest version: sample several chains of thought at a nonzero temperature, so they differ, and return the final answer that appears most often. Wang et al. (2022) called this **self-consistency**. Different valid routes tend to reach the same right answer, while mistakes tend to scatter. On GSM8K it raised chain-of-thought accuracy by 17.9 percentage points. DeepSeek-R1-Zero's AIME 2024 score went from 71.0% with one sample to 86.7% with a majority vote over 64.

      How much can a vote help? Treat each sample as independently right with probability $p$, and wrong with one shared wrong answer otherwise. The vote is right when more than half the samples are:

      $$P(\text{majority right}) = \sum_{k > n/2} \binom{n}{k}\, p^k (1-p)^{n-k}$$

      ```python run
      from math import comb

      def majority_right(p, n):
          """Chance that more than half of n independent samples are right (right vs one wrong answer)."""
          return sum(comb(n, k) * p**k * (1 - p)**(n - k) for k in range(n // 2 + 1, n + 1))

      for p in [0.6, 0.4]:
          for n in [1, 5, 11, 25]:
              print(f"p = {p}, n = {n:2d} votes: majority is right {majority_right(p, n):.3f}")

      # Same 0.6 average accuracy, but split into easy and hard problems
      easy, hard = 0.9, 0.3
      single = (easy + hard) / 2
      vote5 = (majority_right(easy, 5) + majority_right(hard, 5)) / 2
      print(f"mixed set: one sample {single:.3f}, 5-vote majority {vote5:.3f}")
      ```

      :::predict At p = 0.6, five votes give 0.683. What happens at p = 0.4?
      Voting makes it *worse*: 0.317 with five votes, and 0.154 with 25. When the right answer is the minority, more votes make the wrong answer win more reliably. In real problems the wrong answers often scatter across many different values, so the right answer can win with less than half the votes; this two-answer calculation is the pessimistic case.
      :::

      :::mixup "Five samples are five independent opinions."
      They come from the same model, so they share its blind spots. Ask the pen-and-notebook question from the first lesson and many samples may say "40 cents" together. The last line of the program shows a milder version of the problem. Accuracy that averages 0.6 but is really 0.9 on easy problems and 0.3 on hard ones *drops* to 0.577 with a five-vote majority, because voting helps where the model already does well and hurts where it doesn't. Measure the gain on your own problems before you count on the formula.
      :::
    bridges: []
  - id: inference-time-search.s2
    title: Best-of-n needs a good judge
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.inference-time-search
    markdown: |-
      If you can *check* answers, as with code and its tests or the verifiers from earlier in this module, you don't need a vote. Sample $n$ candidates and return one the checker accepts. This is **best-of-n**. With a perfect checker it succeeds whenever *any* sample is right:

      $$P(\text{success}) = 1 - (1-p)^n$$

      Code-generation papers report the same quantity as **pass@k**: the chance that at least one of $k$ samples passes the tests. With $p = 0.3$, a single sample succeeds 30% of the time, and five samples succeed $1 - 0.7^5 \approx 83\%$ of the time.

      ```python run
      p = 0.3            # chance one sample is correct
      tokens = 400       # tokens per sample

      for n in [1, 2, 4, 8, 16]:
          success = 1 - (1 - p) ** n          # at least one correct sample
          print(f"n = {n:2d}: P(some sample correct) = {success:.3f}   tokens = {n * tokens:5d}"
                f"   tokens per solved problem = {n * tokens / success:6.0f}")
      ```

      Success climbs fast and then flattens: 8 samples give 0.942 and 16 give 0.997, but the tokens per solved problem grow almost fivefold along the way (1,333 to 6,421). Try `p = 0.05`, a hard problem: 16 samples still reach only 0.560.

      Without a perfect checker, best-of-n picks the candidate a *learned* scorer rates highest: a reward model, or a PRM from the last lesson. Cobbe et al. (2021) introduced GSM8K partly to test this: they trained verifiers to rank 100 sampled solutions. The catch is that picking the top of many candidates also picks the scorer's mistakes, the answers it wrongly loves. Past some $n$, searching harder mostly finds those.
    bridges: []
  - id: inference-time-search.s3
    title: Search over steps, not whole answers
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.inference-time-search
    markdown: |-
      Voting and best-of-n judge only finished answers. Search can judge **partial** solutions and spend effort only on promising ones, like the game-tree search from the search module.

      Take the Game of 24: combine 4, 9, 10, and 13 with +, −, ×, ÷ to make 24. The first move picks a pair and an operation, so there are 6 pairs × 6 operations = 36 possible first moves (− and ÷ count in both orders). Only 7 of them leave a way to reach 24 (4, if negative numbers aren't allowed). A chain of thought that picks a first move at random is usually doomed by its first step.

      **Tree of Thoughts** (Yao et al., 2023) has the model propose a few next steps, asks the model to judge each resulting state ("can 24 still be reached from 10, 13, 13?"), keeps the best few, and repeats. Keeping the top $b$ states at each level is **beam search** with beam width $b$. On the Game of 24, GPT-4 with chain-of-thought prompting solved 4% of the puzzles; with Tree of Thoughts it solved 74%.

      The **branching factor** is the number of options at each step. It makes exhaustive search explode: at 5 options per step, 3 steps give $5^3 = 125$ complete paths. Exhaustive search builds $5 + 25 + 125 = 155$ states. A beam of width 5 proposes the 5 children of the start, then keeps 5 states and proposes their 25 children at each later level: $5 + 25 + 25 = 55$ states proposed and judged. That's much cheaper, but a wrong judgment prunes a good branch for good.

      :::story Where MCTS didn't pay off
      The DeepSeek-R1 report lists Monte Carlo tree search, the method behind AlphaGo, among its unsuccessful attempts for *training*. Token-level search spaces are vastly larger than a board game's, and the value model guiding the search was hard to train well. The team noted that MCTS can still improve answers at inference time when paired with a pretrained value model.
      :::
    diagram:
      caption: A tree search over steps for the Game of 24 with 4, 9, 10, 13. The judge prunes states from which 24 can't be reached.
      description: The start state 4, 9, 10, 13 branches three ways. The move 10 − 4 = 6 leaves 6, 9, 13 and is kept. The move 13 − 9 = 4 leaves 4, 4, 10 and is kept. The move 4 + 9 = 13 leaves 10, 13, 13, which the judge marks as unable to reach 24, so it is pruned. From 6, 9, 13 the move 13 − 9 = 4 leaves 4 and 6. From 4, 4, 10 the move 10 − 4 = 6 also leaves 4 and 6. From 4 and 6, the move 6 × 4 gives 24.
      nodes:
        - id: root
          label: "4, 9, 10, 13"
          col: 0
          row: 1
          tone: data
        - id: a
          label: "10 − 4 = 6 → 6, 9, 13"
          note: "judge: keep"
          col: 1
          row: 0
        - id: b
          label: "13 − 9 = 4 → 4, 4, 10"
          note: "judge: keep"
          col: 1
          row: 1
        - id: c
          label: "4 + 9 = 13 → 10, 13, 13"
          note: "judge: 24 impossible, prune"
          col: 1
          row: 2
          tone: warn
        - id: a2
          label: "13 − 9 = 4 → 4, 6"
          col: 2
          row: 0
        - id: b2
          label: "10 − 4 = 6 → 4, 6"
          col: 2
          row: 1
        - id: goal
          label: "6 × 4 = 24"
          col: 3
          row: 0
          tone: accent
      edges:
        - from: root
          to: a
        - from: root
          to: b
        - from: root
          to: c
          dashed: true
        - from: a
          to: a2
        - from: b
          to: b2
        - from: a2
          to: goal
        - from: b2
          to: goal
    bridges: []
  - id: inference-time-search.s4
    title: Count every token
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.inference-time-search
    markdown: |-
      Every method here trades tokens for accuracy, and the user sees only the winning answer. Say one 400-token sample is right with $p = 0.6$, and tests are available to check answers:

      | Strategy | Tokens generated | Accuracy | Tokens per solved problem |
      | --- | ---: | ---: | ---: |
      | One sample | 400 | 0.600 | 667 |
      | Majority of 5 | 2,000 | 0.683 | 2,930 |
      | Best of 5, checked by tests | 2,000 (+ test runs) | 0.990 | about 2,020 |

      The four discarded samples still cost money and time. Voting more than quadruples the cost of each solved problem for 8 extra points; checking pays much better, *when a checker exists*. If the samples run one after another, latency grows five times too.

      The right amount of search also depends on the question. Snell et al. (2024) found that allocating test-time compute per prompt, according to difficulty, beat plain best-of-n by more than four times in efficiency. On problems where a small model already had reasonable success, extra test-time compute could outperform a model 14 times larger at matched compute. So spend little on easy questions, search harder on medium ones, and don't expect sampling to rescue questions where $p$ is near 0.
    bridges: []
  - id: inference-time-search.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.inference-time-search
    markdown: Vote and best-of-n probabilities to compute, plus a trick riddle, a code generator, and an over-searched reward model, test whether you can pick a method and predict what it buys.
    takeaway: |-
      Voting helps when the model is usually right and its mistakes scatter; best-of-n helps as much as its checker is trustworthy; tree search helps when partial steps can be judged. Count every generated token when you compare them.
  - id: inference-time-search.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.inference-time-search
    markdown: |-
      Extra generation helps when it produces useful alternatives and a reliable way to choose among them. Count the work spent on every candidate and check.
