schema_version: 0.2-draft
lesson:
  id: inference-time-search
  version: 0.1.0-draft
  title: Spend extra generation on candidates, checks, and search
  state: draft
  summary: Self-consistency, best-of-n selection, and tree search use inference compute to explore or select outputs;
    benefits depend on candidate diversity, evaluator quality, and the total budget.
  slot: M21.6
  category: learning
  minutes: 12
  sources:
  - title: Self-Consistency
    url: https://arxiv.org/abs/2203.11171
  - title: Tree of Thoughts
    url: https://arxiv.org/abs/2305.10601
objectives:
- id: objective.inference-time-search
  version: 1-draft
  statement: Self-consistency, best-of-n selection, and tree search use inference compute to explore or select outputs;
    benefits depend on candidate diversity, evaluator quality, and the total budget.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - inference-time-search.base
  - inference-time-search.transfer
  prerequisites:
  - anyOf:
    - objective.reasoning-and-explanations
  - anyOf:
    - objective.game-search
scenes:
- id: inference-time-search.s1
  title: Generate several candidate solutions
  type: explanation
  depth: intuition
  objective_refs:
  - objective.inference-time-search
  markdown: Self-consistency samples multiple solution paths and aggregates their final answers, often by majority.
    Best-of-n instead selects a candidate using a scorer. Both use extra inference work without necessarily updating
    weights. Correlated mistakes can survive either strategy.
  text_mode: Self-consistency samples multiple solution paths and aggregates their final answers, often by majority.
    Best-of-n instead selects a candidate using a scorer. Both use extra inference work without necessarily updating
    weights. Correlated mistakes can survive either strategy.
  bridges: []
- id: inference-time-search.s2
  title: Compare two selection rules
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.inference-time-search
  markdown: Suppose five candidates answer A, A, B, B, B. Majority chooses B. A verifier could still choose an A
    candidate if it independently establishes validity. Agreement is evidence about the sampled distribution, not
    a proof of correctness; a scorer is useful only to the extent it can distinguish better outputs.
  text_mode: Suppose five candidates answer A, A, B, B, B. Majority chooses B. A verifier could still choose an
    A candidate if it independently establishes validity. Agreement is evidence about the sampled distribution,
    not a proof of correctness; a scorer is useful only to the extent it can distinguish better outputs.
  bridges: []
- id: inference-time-search.s3
  title: Search over partial states
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.inference-time-search
  markdown: A tree-search method can expand partial plans or derivations, score promising nodes, and backtrack.
    Branching factor and depth quickly increase cost. Heuristics, pruning, and tool checks determine what is explored;
    a mistaken evaluator can discard the correct branch early.
  text_mode: A tree-search method can expand partial plans or derivations, score promising nodes, and backtrack.
    Branching factor and depth quickly increase cost. Heuristics, pruning, and tool checks determine what is explored;
    a mistaken evaluator can discard the correct branch early.
  bridges: []
- id: inference-time-search.s4
  title: Measure all spent work
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.inference-time-search
  markdown: Report generated tokens across every candidate, evaluator calls, tool latency, and wall-clock budget.
    Compare against spending the same budget on another model or strategy. More test-time compute can help some
    tasks but can also increase repetition, error propagation, or selection bias.
  text_mode: Report generated tokens across every candidate, evaluator calls, tool latency, and wall-clock budget.
    Compare against spending the same budget on another model or strategy. More test-time compute can help some
    tasks but can also increase repetition, error propagation, or selection bias.
  bridges: []
- id: inference-time-search.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.inference-time-search
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Self-consistency, best-of-n selection, and tree search use inference compute to explore or select outputs;
    benefits depend on candidate diversity, evaluator quality, and the total budget.
- id: inference-time-search.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.inference-time-search
  markdown: Self-consistency, best-of-n selection, and tree search use inference compute to explore or select outputs;
    benefits depend on candidate diversity, evaluator quality, and the total budget.
  text_mode: Self-consistency, best-of-n selection, and tree search use inference compute to explore or select outputs;
