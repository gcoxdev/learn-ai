assessment_families:
- id: inference-time-search.base
  objective_ref: objective.inference-time-search
  task: base
  response_type: single_choice
  points: 1
  hint: 'Compare two selection rules: trace the inputs, operation, and result before choosing.'
  remediation_scene: inference-time-search.s2
  variants:
  - id: inference-time-search.base.1
    prompt: Five candidates answer A, A, B, B, B. Majority chooses what?
    options:
    - id: b
      text: A
    - id: c
      text: Neither by definition
    - id: a
      text: B
    answer: a
    feedback: B has three of five votes.
  - id: inference-time-search.base.2
    prompt: Does majority agreement prove correctness?
    options:
    - id: c
      text: Only if five candidates are used
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Samples may share correlated errors.
- id: inference-time-search.transfer
  objective_ref: objective.inference-time-search
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Measure all spent work: trace the inputs, operation, and result before choosing.'
  remediation_scene: inference-time-search.s4
  variants:
  - id: inference-time-search.transfer.1
    prompt: What can a bad search heuristic do?
    options:
    - id: c
      text: Remove every dependency
    - id: a
      text: Prune a branch containing a valid solution
    - id: b
      text: Guarantee complete exploration at zero cost
    answer: a
    feedback: Search quality depends on which states are retained.
  - id: inference-time-search.transfer.2
    prompt: Which tokens count toward best-of-n compute?
    options:
    - id: a
      text: Tokens from all generated candidates and relevant evaluators
    - id: b
      text: Only the selected response
    - id: c
      text: Only the prompt title
    answer: a
    feedback: Discarded candidates still consumed resources.
