objectives:
- id: objective.sequence-to-sequence
  version: 1-draft
  statement: Sequence-to-sequence models encode an input and generate an output sequence; alignment, attention,
    and teacher forcing address different parts of that task.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - sequence-to-sequence.base
  - sequence-to-sequence.transfer
  prerequisites:
  - anyOf:
    - objective.recurrent-networks
  - anyOf:
    - objective.next-token
scenes:
- id: sequence-to-sequence.s1
  title: Translate one sequence into another
  type: explanation
  depth: intuition
  objective_refs:
  - objective.sequence-to-sequence
  markdown: 'A **sequence** is an ordered list. Translation maps one sequence to another, and their lengths
    can differ: “merci beaucoup” has two words, while “thank you very much” has four. A **tokenizer** may split
    either phrase into smaller units called **tokens**.


    An **encoder** turns the source tokens into representations. A **decoder** uses that information and its
    preceding output tokens to predict the next one. This is what it means to generate an output **conditioned
    on** the source. An end-of-sequence decision lets the output stop at its own length.


    The encoder and decoder can use different architectures. Whatever the design, a fluent output that ignores
    the source has not performed the translation task.'
  text_mode: 'A **sequence** is an ordered list. Translation maps one sequence to another, and their lengths
    can differ: “merci beaucoup” has two words, while “thank you very much” has four. A **tokenizer** may split
    either phrase into smaller units called **tokens**.


    An **encoder** turns the source tokens into representations. A **decoder** uses that information and its
    preceding output tokens to predict the next one. This is what it means to generate an output **conditioned
    on** the source. An end-of-sequence decision lets the output stop at its own length.


    The encoder and decoder can use different architectures. Whatever the design, a fluent output that ignores
    the source has not performed the translation task.'
  bridges: []
- id: sequence-to-sequence.s2
  title: A fixed summary can be a bottleneck
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sequence-to-sequence
  markdown: 'An early encoder-decoder design may compress the whole source into one vector. A long source can
    force that fixed summary to carry many details at once. Attention instead lets the decoder form a context-dependent
    mixture over source positions at each output step.


    For a sentence that mentions both a red bicycle and a blue car, the useful source information changes as
    the decoder generates the words for the bicycle and the car. Attention provides a route to different source
    representations at those moments; it does not guarantee that the selected information is correct.


    Alignment describes which source information is associated with an output position. Word order can change
    between languages, and one source word can correspond to several output words. An alignment is therefore
    not necessarily a diagonal, one-to-one word match.'
