- id: sequence-to-sequence.s4
  title: Evaluate the sequence, not just one token
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sequence-to-sequence
  markdown: 'Greedy decoding keeps the most probable next token at each step. Beam search keeps several partial
    sequences, expands them, and retains the highest-scoring candidates. Beam width is the number retained.
    Both policies can use exactly the same fixed model parameters.


    Try the two-token tree below. A prefix with a weaker first token can have a stronger continuation. Predict
    whether keeping a second prefix changes the winner, then compare products of conditional probabilities.
    The lab uses equal-length outputs so the scores are directly comparable without a length penalty.


    A higher sequence probability is not a guarantee of a better translation. Evaluate whether the output preserves
    the source meaning, ends appropriately, and avoids repetition. Sampling offers another decoding policy;
    changing any of these policies does not by itself retrain the encoder or decoder.'
  text_mode: 'Greedy decoding keeps the most probable next token at each step. Beam search keeps several partial
