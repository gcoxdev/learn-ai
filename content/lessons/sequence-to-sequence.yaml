schema_version: 0.2-draft
lesson:
  id: sequence-to-sequence
  version: 0.4.0-draft
  title: Map one sequence into another
  state: draft
  summary: "\"The iced coffee\" becomes \"le café glacé\": three words in, three out, in a different order. See how an encoder, a decoder, and attention pull that off, and why decoding needs a search."
  slot: M13.4
  category: learning
  sources:
    - title: "Sequence to Sequence Learning with Neural Networks (Sutskever, Vinyals & Le, 2014)"
      url: https://arxiv.org/abs/1409.3215
    - title: "Neural Machine Translation by Jointly Learning to Align and Translate (Bahdanau, Cho & Bengio, 2014)"
      url: https://arxiv.org/abs/1409.0473
    - title: "On the Properties of Neural Machine Translation: Encoder–Decoder Approaches (Cho et al., 2014)"
      url: https://arxiv.org/abs/1409.1259
    - title: "Sequence Level Training with Recurrent Neural Networks (Ranzato et al., 2015)"
      url: https://arxiv.org/abs/1511.06732
    - title: "Scheduled Sampling for Sequence Prediction with Recurrent Neural Networks (Bengio et al., 2015)"
      url: https://arxiv.org/abs/1506.03099
    - title: Dive into Deep Learning — sequence-to-sequence learning
      url: https://d2l.ai/chapter_recurrent-modern/seq2seq.html
    - title: Dive into Deep Learning — beam search
      url: https://d2l.ai/chapter_recurrent-modern/beam-search.html
objectives:
  - id: objective.sequence-to-sequence
    version: 2-draft
    statement: Sequence-to-sequence models encode an input and generate an output sequence; alignment, attention, and teacher forcing address different parts of that task.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - sequence-to-sequence.base.v2
      - sequence-to-sequence.transfer.v2
      - sequence-to-sequence.calc.v2
    prerequisites:
      - anyOf:
          - objective.recurrent-networks
      - anyOf:
          - objective.next-token
scenes:
  - id: sequence-to-sequence.s1
    title: A menu board for French visitors
    type: explanation
    depth: intuition
    objective_refs:
      - objective.sequence-to-sequence
    markdown: |-
      Ana wants Pebble Café's chalkboard specials translated for French tourists. "The iced coffee" should become "le café glacé". "Thank you very much" should become "merci beaucoup": four words in, two words out. The RNNs from the last two lessons emit one output per input step, but here the lengths differ and the order changes ("iced coffee", but "café glacé").

      The fix, published in 2014 by Ilya Sutskever, Oriol Vinyals, and Quoc Le at Google, and at about the same time by Kyunghyun Cho and colleagues, is to split the job between two networks:

      - An **encoder** reads the whole source sentence, one **token** (a word or word piece) at a time, and builds up its hidden state.
      - A **decoder** starts from the encoder's final state and writes the translation one token at a time. Each prediction depends on the source and on the tokens it has already written. That is what it means for the output to be **conditioned on** the source.

      The decoder stops by writing a special **end-of-sequence token**, so the output can have any length. This encoder–decoder pattern is called **sequence-to-sequence**, or **seq2seq**. Sutskever's version used two deep LSTMs and found a curious trick: reading the source sentence *backwards* made training easier, because it put the first source words close to the first output words.
    bridges: []
  - id: sequence-to-sequence.s2
    title: Attention lets the decoder look back
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.sequence-to-sequence
    markdown: |-
      In the basic design, the decoder sees the source only through the encoder's final state: one fixed-size vector for the whole sentence. That is a **bottleneck**. Cho and colleagues found that translation quality dropped sharply as sentences got longer.

      Dzmitry Bahdanau, Cho, and Yoshua Bengio (2014) removed it. Keep *every* encoder state, one per source word, and at each output step let the decoder choose which ones to read. That choice is **attention**. Suppose the decoder has written "le café" and is about to write the next word:

      1. **Score** each source word for how useful it is right now: the 0.1, iced 2.3, coffee 0.9.
      2. **Softmax** turns the scores into weights that sum to 1: 0.08, 0.74, 0.18.
      3. **Average** the encoder states with those weights to get a **context vector**, and feed it to the decoder.

      ```python run
      import numpy as np

      source = ["the", "iced", "coffee"]
      encoder_states = np.array([[1.0, 0.0],    # one vector per source word
                                 [0.0, 2.0],    # (real models use hundreds of numbers)
                                 [2.0, 1.0]])
      scores = np.array([0.1, 2.3, 0.9])        # how well each word matches the decoder's need
                                                # while it is about to write "glacé"
      weights = np.exp(scores) / np.exp(scores).sum()     # softmax
      context = weights @ encoder_states                  # weighted average of the states

      for word, w in zip(source, weights):
          print(f"{word:7s} weight {w:.2f}")
      print("context vector:", context.round(2))
      ```

      The context, about [0.44, 1.66], is mostly the "iced" state, which is what the decoder needs to write "glacé". One step earlier, writing "café", the highest score would have gone to "coffee". The pattern of which source words each output word attends to is called the **alignment**, and it doesn't have to run straight down the diagonal: here the third output word looks at the second input word.

      :::predict Change the score for "coffee" to 2.3, tied with "iced". What are the weights?
      "Iced" and "coffee" each get about 0.47 and "the" gets 0.05. The context becomes an even blend of the two, so the decoder gets a less clear signal about which word it is translating.
      :::

      :::papers Additive (Bahdanau) attention
      $$e_{ij} = v_a^\top \tanh(W_a s_{i-1} + U_a h_j) \qquad \alpha_{ij} = \frac{\exp(e_{ij})}{\sum_k \exp(e_{ik})} \qquad c_i = \sum_j \alpha_{ij} h_j$$
      $h_j$ is the encoder state for source word $j$, and $s_{i-1}$ is the decoder's state before writing output word $i$. $e_{ij}$ is the score (2.3 for "iced"), $\alpha_{ij}$ the weight (0.74), and $c_i$ the context vector. The small network $v_a$, $W_a$, $U_a$ learns to score. The transformer, three years later, kept this idea and dropped the RNNs.
      :::
    bridges: []
    diagram:
      caption: Seq2seq with attention. At each step the decoder asks the encoder states for a context vector, then writes one word.
      description: The source sentence feeds the encoder, which produces one state per word. Those states go to the attention step. The decoder sends its current state to attention, and attention returns a context vector. The decoder combines the context with its previous output word and writes the next word. That word is fed back as the previous output for the following step.
      nodes:
        - id: src
          label: "Source: the iced coffee"
          col: 0
          row: 1
          tone: data
        - id: enc
          label: Encoder RNN
          note: one state per source word
          col: 1
          row: 1
        - id: attn
          label: Attention
          note: score, softmax, average
          col: 2
          row: 1
          tone: accent
        - id: dec
          label: Decoder RNN
          col: 3
          row: 1
        - id: out
          label: "Next word: glacé"
          col: 4
          row: 1
          tone: data
        - id: prev
          label: "Previous word: café"
          col: 3
          row: 2
          tone: muted
      edges:
        - from: src
          to: enc
        - from: enc
          to: attn
          label: all encoder states
        - from: dec
          to: attn
          label: decoder state
          bend: 2
        - from: attn
          to: dec
          label: context vector
        - from: prev
          to: dec
        - from: dec
          to: out
        - from: out
          to: prev
          label: fed back
          dashed: true
  - id: sequence-to-sequence.s3
    title: Teacher forcing, and the first mistake
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.sequence-to-sequence
    markdown: |-
      Training the decoder needs an input at every step. The standard choice is **teacher forcing**: feed the *correct* previous word from the reference translation, whatever the model would have written. Training on "le café glacé", the step that predicts "glacé" receives "le café" as its prefix, even if the model's own guess for the second word was "thé" (tea). That keeps training fast and stable, since one early mistake can't derail the rest of the sentence.

      At translation time there is no reference. The decoder reads its *own* previous words. If it writes "le thé", every later step is conditioned on a prefix it never saw in training, and it may continue confidently in the wrong direction: "le thé glacé", iced tea. This gap between training on perfect prefixes and generating from its own imperfect ones is called **exposure bias**, a name popularized by Ranzato and colleagues in 2015. One fix, **scheduled sampling** (Bengio and colleagues, 2015), gradually replaces some reference words with the model's own predictions during training, so it learns to recover from its mistakes.

      :::mixup "Teacher forcing lets the model see the answer it's supposed to predict."
      It sees the correct *earlier* words, never the word at the current step or anything after it. Feeding in "glacé" itself would be leakage, and the model would learn to copy. When you evaluate, judge sentences the model generated from its own prefixes, not teacher-forced accuracy.
      :::
    bridges: []
  - id: sequence-to-sequence.s4
    title: Greedy or beam, searching for the best sentence
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.sequence-to-sequence
    markdown: |-
      The decoder gives a probability for every possible next word. Choosing the output sentence is a search, and the simplest search is **greedy decoding**: at each step, take the single most likely word. But a sentence's probability is the *product* of its word probabilities, and the best first word doesn't always lead to the best sentence.

      **Beam search** keeps the $k$ best partial sentences (the **beam width**) at every step, extends each with every possible next word, and keeps the $k$ best of the extensions. Greedy decoding is beam search with $k = 1$.

      In the tree below, the first word is "go" (0.6) or "stay" (0.4). After "go", "home" and "here" are equally likely (0.5 each); after "stay", "home" is 0.9 and "here" 0.1.

      :::predict Greedy decoding and a beam of width 2 both search this tree. Do they end on the same two-word sentence? Make your guess in the figure, then open this.
      No. Greedy keeps only "go", and the best it can finish with is $0.6 \times 0.5 = 0.30$. Beam width 2 also keeps "stay", and finds "stay home" at $0.4 \times 0.9 = 0.36$. The less likely first word led to the more likely sentence.
      :::

      Real systems add log probabilities instead of multiplying, and divide by a length term, because every extra word multiplies in a number below 1 and would otherwise make short outputs win. The 2017 transformer paper, for example, used a beam of 4 with a length penalty for translation. None of this touches the weights: the same model gives different sentences under different search settings.
    bridges: []
    figure:
      kind: beam-search
      caption: Keep one or two prefixes in a fixed tree and compare the complete two-token sequence scores.
      description: The first token favors go over stay, but stay has a stronger home continuation. Beam width two retains that alternative; width one prunes it. Probabilities are hand-written and model parameters do not change.
  - id: sequence-to-sequence.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.sequence-to-sequence
    markdown: A subtitle translator, a text summarizer, a chatbot that drifts off course, and a few sequence scores to compute test whether you can follow a decoder step by step.
    takeaway: |-
      An encoder reads the source, and a decoder writes the output one token at a time, using attention to look back at the source words it needs. It trains on correct prefixes but must generate from its own, and beam search looks for a better whole sentence than greedy picks.
  - id: sequence-to-sequence.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.sequence-to-sequence
    markdown: |-
      A sequence-to-sequence model uses an input sequence to generate an output sequence. Check the whole generated result: training with correct prefixes does not guarantee success when it must use its own earlier outputs.
