assessment_families:
- id: sequence-to-sequence.base
  objective_ref: objective.sequence-to-sequence
  task: base
  response_type: single_choice
  points: 1
  hint: 'A fixed summary can be a bottleneck: trace the inputs, operation, and result before choosing.'
  remediation_scene: sequence-to-sequence.s2
  variants:
  - id: sequence-to-sequence.base.1
    prompt: What does teacher forcing supply as the previous decoder token during training?
    options:
    - id: b
      text: Always the model’s sampled token
    - id: c
      text: The final target sentence as unrestricted future input
    - id: a
      text: The recorded reference token
    answer: a
    feedback: Teacher forcing uses reference history while preserving the predictive target boundary.
  - id: sequence-to-sequence.base.2
    prompt: Why can attention help an encoder-decoder model?
    options:
    - id: c
      text: It removes all training objectives
    - id: a
      text: It provides context-dependent access to source positions
    - id: b
      text: It guarantees identical source and target lengths
    answer: a
    feedback: Attention can reduce dependence on one fixed source summary.
- id: sequence-to-sequence.transfer
  objective_ref: objective.sequence-to-sequence
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate the sequence, not just one token: trace the inputs, operation, and result before choosing.'
  remediation_scene: sequence-to-sequence.s4
  variants:
  - id: sequence-to-sequence.transfer.1
    prompt: A model makes one wrong generated token that changes later outputs. What training/inference difference
      is relevant?
    options:
    - id: c
      text: Only the number of files
    - id: a
      text: Reference prefixes during teacher forcing versus generated prefixes at inference
    - id: b
      text: The color of the source text
    answer: a
    feedback: The decoder encounters different histories once it follows its own outputs.
  - id: sequence-to-sequence.transfer.2
    prompt: Changing beam width changes generated text. Have model weights necessarily changed?
    options:
    - id: a
      text: No; decoding policy can change with fixed weights
    - id: b
      text: Yes; beam search is always an optimizer
    - id: c
      text: Only if the text is longer
    answer: a
    feedback: Search over outputs and parameter training are separate operations.
