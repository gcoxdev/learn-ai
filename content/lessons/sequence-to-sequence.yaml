lesson:
  id: sequence-to-sequence
  version: 0.3.0-draft
  title: Map one sequence into another
  state: draft
  summary: Translate one ordered list into another, then compare using correct prefixes in training with generating
    your own prefixes.
  slot: M13.4
  category: learning
  sources:
  - title: Dive into Deep Learning — sequence-to-sequence learning
    url: https://d2l.ai/chapter_recurrent-modern/seq2seq.html
