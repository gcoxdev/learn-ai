assessment_families:
  - id: sequence-to-sequence.base
    objective_ref: objective.sequence-to-sequence
    task: base
    response_type: single_choice
    points: 1
    hint: 'A fixed summary can be a bottleneck: trace the inputs, operation, and result before choosing.'
    remediation_scene: sequence-to-sequence.s2
    variants:
      - id: sequence-to-sequence.base.1
        prompt: What does teacher forcing supply as the previous decoder token during training?
        options:
          - id: b
            text: Always the model’s sampled token
          - id: c
            text: The final target sentence as unrestricted future input
          - id: a
            text: The recorded reference token
        answer: a
        feedback: Teacher forcing uses reference history while preserving the predictive target boundary.
        retired: true
      - id: sequence-to-sequence.base.2
        prompt: Why can attention help an encoder-decoder model?
        options:
          - id: c
            text: It removes all training objectives
          - id: a
            text: It provides context-dependent access to source positions
          - id: b
            text: It guarantees identical source and target lengths
        answer: a
        feedback: Attention can reduce dependence on one fixed source summary.
        retired: true
  - id: sequence-to-sequence.transfer
    objective_ref: objective.sequence-to-sequence
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate the sequence, not just one token: trace the inputs, operation, and result before choosing.'
    remediation_scene: sequence-to-sequence.s4
    variants:
      - id: sequence-to-sequence.transfer.1
        prompt: A model makes one wrong generated token that changes later outputs. What training/inference difference is relevant?
        options:
          - id: c
            text: Only the number of files
          - id: a
            text: Reference prefixes during teacher forcing versus generated prefixes at inference
          - id: b
            text: The color of the source text
        answer: a
        feedback: The decoder encounters different histories once it follows its own outputs.
        retired: true
      - id: sequence-to-sequence.transfer.2
        prompt: Changing beam width changes generated text. Have model weights necessarily changed?
        options:
          - id: a
            text: No; decoding policy can change with fixed weights
          - id: b
            text: Yes; beam search is always an optimizer
          - id: c
            text: Only if the text is longer
        answer: a
        feedback: Search over outputs and parameter training are separate operations.
        retired: true
  - id: sequence-to-sequence.base.v2
    objective_ref: objective.sequence-to-sequence
    task: base
    response_type: single_choice
    points: 1
    hint: "Keep the three parts apart: attention picks which source words to read now, teacher forcing sets the decoder's input during training, and the search picks the output sentence."
    remediation_scene: sequence-to-sequence.s2
    variants:
      - id: sequence-to-sequence.base.v2.1
        prompt: Translating "the iced coffee" into "le café glacé", the decoder has written "le" and is about to write "café". Which source word should get the highest attention weight?
        options:
          - id: c
            text: "\"the\", because the first source word pairs with the first output word"
          - id: a
            text: "\"coffee\", because \"café\" translates it, even though they sit in different positions"
          - id: b
            text: "\"iced\", because the second output word lines up with the second source word"
        answer: a
        feedback: Attention follows meaning, not position, so "café" should read "coffee". Assuming a straight diagonal (first with first, second with second) is exactly what fails when word order changes between languages.
      - id: sequence-to-sequence.base.v2.2
        prompt: During teacher-forced training on the reference "le café glacé", what does the decoder receive as input at the step that predicts "glacé"?
        options:
          - id: b
            text: The words the model itself predicted at the first two steps
          - id: a
            text: The reference words "le café", whatever the model predicted
          - id: c
            text: The full reference "le café glacé", so it can check itself
        answer: a
        feedback: Teacher forcing feeds the correct earlier words from the reference. Feeding the model's own guesses is what happens at generation time, and including "glacé" itself would let the model copy the answer.
      - id: sequence-to-sequence.base.v2.3
        prompt: Early encoder–decoder models translated long sentences much worse than short ones. What was the main cause that attention fixed?
        options:
          - id: a
            text: The whole source had to fit into one fixed-size vector
          - id: b
            text: The decoder could not write more words than the encoder read
          - id: c
            text: Teacher forcing only gave good prefixes for short sentences
        answer: a
        feedback: Without attention, the decoder sees the source only through the encoder's final state, which has the same size for 5 words or 50. Seq2seq outputs could already differ in length from the input, and teacher forcing works at any length.
      - id: sequence-to-sequence.base.v2.4
        prompt: What does beam search with a beam width of 3 do?
        options:
          - id: c
            text: Looks three words ahead before committing to each word
          - id: b
            text: Writes three sentences greedily and keeps the longest one
          - id: a
            text: Keeps the three best partial sentences at every step
        answer: a
        feedback: A beam of width 3 extends each of its three best prefixes and keeps the three best results, step after step. It neither runs separate greedy passes nor uses a fixed lookahead.
  - id: sequence-to-sequence.transfer.v2
    objective_ref: objective.sequence-to-sequence
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask whether the problem happens in training (what the decoder is fed), in the model (what it can read from the source), or in decoding (how the output sentence is chosen).
    remediation_scene: sequence-to-sequence.s3
    variants:
      - id: sequence-to-sequence.transfer.v2.1
        prompt: A subtitle translator predicts the next word correctly 95% of the time in teacher-forced tests, yet its generated subtitles often go off course after one early wrong word. What is the best next step?
        options:
          - id: b
            text: Add dropout, because a 95% score means the model has memorized the training data
          - id: a
            text: Treat it as exposure bias and train with some of its own predictions as inputs
          - id: c
            text: Replace attention, because derailing shows it is reading the wrong source words
        answer: a
        feedback: Teacher-forced accuracy uses perfect prefixes; generation uses the model's own, and one error changes everything after it. Scheduled sampling trains on some of the model's own predictions. The symptom points to the training-versus-generation gap, not to memorization or attention.
      - id: sequence-to-sequence.transfer.v2.2
        prompt: A seq2seq summarizer without attention writes good summaries of short news items but drops facts from the opening paragraphs of long reports. Which change targets the cause?
        options:
          - id: c
            text: Use a wider beam so that more candidate summaries are compared
          - id: b
            text: Train longer with teacher forcing on the short news items
          - id: a
            text: Let the decoder attend to every encoder state, not just the last
        answer: a
        feedback: Long inputs overflow the single fixed-size vector, so early details are lost before decoding starts. Attention keeps every encoder state available. A wider beam searches better over a summary that is already missing the facts.
      - id: sequence-to-sequence.transfer.v2.3
        prompt: A chatbot using beam search keeps giving short replies like "I don't know." Which explanation fits what you know about sequence scores?
        options:
          - id: a
            text: Every extra word multiplies in a probability below 1, so short replies score higher
          - id: b
            text: A wide beam fine-tunes the decoder toward replies that are safe and short
          - id: c
            text: Beam search skips the end-of-sequence token, so long replies are cut off
        answer: a
        feedback: A product of probabilities shrinks with every word, so without length normalization the search favors short outputs. Beam search never changes the weights, and it does use the end token; that is how the short replies end.
      - id: sequence-to-sequence.transfer.v2.4
        prompt: A team changes its translator's beam width from 1 to 5 and the outputs change. Nobody retrained anything. What explains the change?
        options:
          - id: b
            text: Beam search updates the decoder's weights using its best outputs
          - id: c
            text: A wider beam lets attention read more of the source sentence
          - id: a
            text: The search now keeps more candidates, using the same model
        answer: a
        feedback: Decoding is a search over the same model's probabilities; a wider beam can find sentences greedy decoding pruned. It doesn't train the model, and attention reads all source states at any beam width.
  - id: sequence-to-sequence.calc.v2
    objective_ref: objective.sequence-to-sequence
    task: base
    response_type: numeric
    points: 1
    hint: A sentence's probability is the product of its word probabilities. In log form, add the logs instead; to compare lengths, divide the log total by the number of words.
    remediation_scene: sequence-to-sequence.s4
    absolute_tolerance: 0.001
    variants:
      - id: sequence-to-sequence.calc.v2.1
        prompt: A decoder writes "le café glacé" with word probabilities 0.9, 0.8, and 0.5. What is the probability of the whole sentence?
        answer: 0.36
        feedback: 0.9 × 0.8 × 0.5 = 0.36. The sentence probability is the product, not the average, of its word probabilities.
      - id: sequence-to-sequence.calc.v2.2
        prompt: 'The first word is "go" (0.55) or "stay" (0.45). After "go", "home" and "here" are 0.5 each; after "stay", "home" is 0.8. What is the score of the best two-word sentence found with beam width 2?'
        answer: 0.36
        feedback: Beam width 2 keeps both first words. "stay home" scores 0.45 × 0.8 = 0.36, which beats greedy's 0.55 × 0.5 = 0.275.
      - id: sequence-to-sequence.calc.v2.3
        prompt: A three-word output has word probabilities 0.5, 0.25, and 0.5. What is the sum of the base-2 log probabilities?
        answer: -4
        feedback: log₂ 0.5 = −1 and log₂ 0.25 = −2, so the total is −1 − 2 − 1 = −4, matching log₂ of the product 1/16.
      - id: sequence-to-sequence.calc.v2.4
        prompt: A four-word output has word probabilities 0.5, 0.5, 0.25, and 0.5. What is its length-normalized score, the average base-2 log probability per word?
        answer: -1.25
        feedback: The logs are −1, −1, −2, and −1, totaling −5. Dividing by 4 words gives −1.25, which can be compared fairly with outputs of other lengths.
