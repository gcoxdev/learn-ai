    the decoder generates the words for the bicycle and the car. Attention provides a route to different source
    representations at those moments; it does not guarantee that the selected information is correct.


    Alignment describes which source information is associated with an output position. Word order can change
    between languages, and one source word can correspond to several output words. An alignment is therefore
    not necessarily a diagonal, one-to-one word match.'
  bridges: []
- id: sequence-to-sequence.s3
  title: Understand teacher forcing
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sequence-to-sequence
  markdown: 'During teacher-forced training, the decoder receives the recorded correct previous token rather
    than its own selected previous output. If the target begins “the red bicycle”, the training step predicting
    “bicycle” receives the reference prefix “the red”.


    At ordinary generation time, the decoder uses its own selected outputs. Predict what happens if it instead
    produces “the blue”: the next prediction is now conditioned on that generated prefix, not the reference
    “the red”. One early error can change the context for many later decisions.


    Teacher forcing makes training inputs well defined, but good next-token accuracy under reference prefixes
    does not guarantee a good free-running sequence. Training must still hide future target information from
    the position being predicted; feeding in the answer would measure a different task.'
  text_mode: 'During teacher-forced training, the decoder receives the recorded correct previous token rather
