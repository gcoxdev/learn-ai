schema_version: 0.2-draft
lesson:
  id: sequence-to-sequence
  version: 0.1.0-draft
  title: Map one sequence into another
  state: draft
  summary: Sequence-to-sequence models encode an input and generate an output sequence; alignment, attention, and
    teacher forcing address different parts of that task.
  slot: M13.4
  category: learning
  minutes: 12
  sources:
  - title: Dive into Deep Learning — sequence-to-sequence learning
    url: https://d2l.ai/chapter_recurrent-modern/seq2seq.html
objectives:
- id: objective.sequence-to-sequence
  version: 1-draft
  statement: Sequence-to-sequence models encode an input and generate an output sequence; alignment, attention,
    and teacher forcing address different parts of that task.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - sequence-to-sequence.base
  - sequence-to-sequence.transfer
  prerequisites:
  - anyOf:
    - objective.recurrent-networks
  - anyOf:
    - objective.next-token
scenes:
- id: sequence-to-sequence.s1
  title: Input and output lengths can differ
  type: explanation
  depth: intuition
  objective_refs:
  - objective.sequence-to-sequence
  markdown: Translation maps a source sentence to a target sentence with different words and possibly a different
    length. An encoder builds representations of the source. A decoder produces outputs conditioned on those representations
    and its prior outputs. The encoder and decoder need not use identical architectures.
  text_mode: Translation maps a source sentence to a target sentence with different words and possibly a different
    length. An encoder builds representations of the source. A decoder produces outputs conditioned on those representations
    and its prior outputs. The encoder and decoder need not use identical architectures.
  bridges: []
- id: sequence-to-sequence.s2
  title: A fixed summary can be a bottleneck
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sequence-to-sequence
  markdown: An early encoder-decoder design may compress the whole source into one vector. Attention instead lets
    a decoder form a context-dependent mixture over source positions at each step. Alignment describes which source
    information is associated with an output position; word order need not match one-to-one.
  text_mode: An early encoder-decoder design may compress the whole source into one vector. Attention instead lets
    a decoder form a context-dependent mixture over source positions at each step. Alignment describes which source
    information is associated with an output position; word order need not match one-to-one.
  bridges: []
- id: sequence-to-sequence.s3
  title: Understand teacher forcing
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sequence-to-sequence
  markdown: During teacher-forced training, the decoder receives the recorded correct previous token rather than
    its own sampled previous output. At ordinary generation time, it uses its selected outputs. Errors can therefore
    alter later contexts in ways less common during training. The training loss must still hide future target information.
  text_mode: During teacher-forced training, the decoder receives the recorded correct previous token rather than
    its own sampled previous output. At ordinary generation time, it uses its selected outputs. Errors can therefore
    alter later contexts in ways less common during training. The training loss must still hide future target information.
  bridges: []
- id: sequence-to-sequence.s4
  title: Evaluate the sequence, not just one token
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sequence-to-sequence
  markdown: Good next-token accuracy under reference prefixes does not guarantee a coherent full generated sequence.
    Examine task quality, length behavior, repeated outputs, and robustness to different inputs. Beam search or
    sampling changes decoding policy; it does not by itself retrain the encoder or decoder.
  text_mode: Good next-token accuracy under reference prefixes does not guarantee a coherent full generated sequence.
    Examine task quality, length behavior, repeated outputs, and robustness to different inputs. Beam search or
    sampling changes decoding policy; it does not by itself retrain the encoder or decoder.
  bridges: []
- id: sequence-to-sequence.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.sequence-to-sequence
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: sequence-to-sequence.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.sequence-to-sequence
  markdown: Sequence-to-sequence models encode an input and generate an output sequence; alignment, attention, and
    teacher forcing address different parts of that task.
  text_mode: Sequence-to-sequence models encode an input and generate an output sequence; alignment, attention,
    and teacher forcing address different parts of that task.
