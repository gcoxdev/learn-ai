  figure:
    kind: beam-search
    caption: Keep one or two prefixes in a fixed tree and compare the complete two-token sequence scores.
    description: The first token favors go over stay, but stay has a stronger home continuation. Beam width
      two retains that alternative; width one prunes it. Probabilities are hand-written and model parameters
      do not change.
- id: sequence-to-sequence.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.sequence-to-sequence
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: 'A sequence-to-sequence model uses an input sequence to generate an output sequence. Check the
    whole generated result: training with correct prefixes does not guarantee success when it must use its
    own earlier outputs.'
