  - id: generative-adversarial-learning.s2
    title: Take turns, one step each
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.generative-adversarial-learning
    markdown: |-
      Training alternates. Take a batch of real images and a batch of fakes.

      1. **Discriminator step.** Hold $G$ fixed. Update $D$'s weights to push $D(\text{real})$ toward 1 and $D(\text{fake})$ toward 0, exactly like training a classifier with cross-entropy.
      2. **Generator step.** Hold $D$ fixed. Backpropagate from $D$'s output, through $D$, into $G$'s weights, and update $G$ so that $D(G(z))$ goes up.

      Both networks run in both steps; what changes is whose weights move.

      :::papers The GAN minimax objective (Goodfellow et al., 2014)
      $$\min_G \max_D \; V(D, G) = \mathbb{E}_{x \sim p_\text{data}}\big[\log D(x)\big] + \mathbb{E}_{z \sim p_z}\big[\log\big(1 - D(G(z))\big)\big]$$

      $D$ wants $V$ large: $\log D(x)$ near 0 for real images and $\log(1 - D(G(z)))$ near 0 for fakes. $G$ appears only in the second term and wants it very negative, which means $D(G(z))$ near 1. In practice the paper suggests a swap: early on, $D$ rejects fakes easily, $\log(1 - D(G(z)))$ flattens out, and $G$ gets almost no gradient. So $G$ instead maximizes $\log D(G(z))$, the **non-saturating** loss, which pushes hardest exactly when $G$ is losing.
      :::

      This is why GAN training is unlike fitting one fixed target. The discriminator is a moving target, and each network's progress changes the other's loss. There's no single number that should steadily fall.
    bridges: []
  - id: generative-adversarial-learning.s5
    title: The best detective, worked out
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.generative-adversarial-learning
    markdown: |-
      Suppose the generator is frozen. What is the best discriminator possible? Look at one image $x$. It shows up among real images with probability $p_\text{data}(x)$ and among fakes with probability $p_g(x)$. The discriminator should report the fraction of its appearances that are real:

      $$D^*(x) = \frac{p_\text{data}(x)}{p_\text{data}(x) + p_g(x)}$$

      Take four kinds of doodle: real data is 40% cats, 30% dogs, 20% fish, 10% birds. A poor generator makes 10% each of cats, dogs, and fish, and 70% birds. For a bird, $D^* = 0.1 / (0.1 + 0.7) = 0.125$: birds are mostly fake, so they look suspicious. For a cat, $D^* = 0.4 / (0.4 + 0.1) = 0.8$.

      :::predict What does D* say everywhere once the generator matches the data exactly?
      $p_g = p_\text{data}$, so $D^* = p/(p + p) = 0.5$ for every image. The best detective can only shrug. Then $V = \log 0.5 + \log 0.5 = -\log 4 \approx -1.386$, the lowest value the generator can force. Goodfellow and colleagues proved this is the game's global optimum.
      :::

      ```python run
      import numpy as np

      kinds  = ["cat", "dog", "fish", "bird"]
      p_data = np.array([0.4, 0.3, 0.2, 0.1])   # real doodles
      p_g    = np.array([0.1, 0.1, 0.1, 0.7])   # a poor generator: mostly birds

      d_star = p_data / (p_data + p_g)           # the best possible discriminator
      for k, d in zip(kinds, d_star):
          print(f"D*({k}) = {d:.3f}")

      def value(p_g):                            # V(D*, G), the minimax objective
          d = p_data / (p_data + p_g)
          real = np.sum(p_data * np.log(d))
          fake = np.sum(p_g[p_g > 0] * np.log(1 - d[p_g > 0]))
          return real + fake

      print(f"V with the poor generator:    {value(p_g):.3f}")
      print(f"V with a perfect generator:   {value(p_data):.3f}")
      print(f"-log 4 (the theoretical best): {-np.log(4):.3f}")
      ```

      The poor generator leaves $V$ at −0.968; matching the data drives it down to −1.386. Try moving some of the generator's bird mass onto fish and watch $V$ fall.
    bridges: []
  - id: generative-adversarial-learning.s3
    title: Mode collapse, one hop at a time
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.generative-adversarial-learning
    markdown: |-
      The generator is rewarded for fooling the current discriminator, not for covering the data. Say it discovers it can draw one convincing cat and draws nothing else. Then $D^*(\text{cat}) = 0.4 / (0.4 + 1) = 0.29$ while dogs, fish, and birds score 1.0, since no fakes of them exist. So the generator jumps wholesale to one of them (the program below takes the first tie, dogs). Now dogs look suspicious and cats look safe again:

      ```python run
      import numpy as np

      kinds  = ["cat", "dog", "fish", "bird"]
      p_data = np.array([0.4, 0.3, 0.2, 0.1])

      p_g = np.array([1.0, 0.0, 0.0, 0.0])        # collapsed: every sample is a cat
      for round_ in range(1, 6):
          d = p_data / (p_data + p_g)             # discriminator catches up
          target = int(np.argmax(d))              # generator jumps to the most "real" kind
          print(f"round {round_}: generator draws {kinds[int(np.argmax(p_g))]:4}  "
                f"D* = {np.round(d, 2).tolist()}  -> next: {kinds[target]}")
          p_g = np.eye(4)[target]
      ```

      It hops between cats and dogs forever and never draws a fish or a bird. This is **mode collapse**: the generator covers only one or a few **modes**, the distinct peaks of the data distribution. The 2014 paper already warned about it, calling it "the Helvetica scenario". Real GANs move in small gradient steps rather than jumps, but the chase is the same, and a collapsed GAN on handwritten digits might draw beautiful 1s and 7s and never a 4.

      :::mixup "Every sample looks great, so the GAN has learned the data."
      Fidelity and coverage are separate tests, as in the first lesson of this module. Look at hundreds of samples side by side, count how often each kind appears, and compare with the training data.
      :::
    bridges: []
  - id: generative-adversarial-learning.s4
    title: Unstable, then stunning
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.generative-adversarial-learning
    markdown: |-
      Early GANs were notoriously hard to train. If the discriminator got too good, the generator's gradients vanished; if the two fell out of balance, samples oscillated or collapsed. The losses themselves are poor progress meters, because each is measured against a moving opponent. Practitioners save sample grids every few thousand steps and track FID, the realism-and-variety score from the first lesson in this module.

      Fixes came from many directions. **DCGAN** (Radford, Metz & Chintala, 2015) found convolutional architectures that train reliably. **WGAN** (Arjovsky, Chintala & Bottou, 2017) replaced the real-or-fake probability with a critic score that estimates a distance between the two distributions, giving useful gradients even when the fakes are easy to spot.

      Then quality leapt. NVIDIA's **StyleGAN** (Karras, Laine & Aila, 2018) first maps the noise $z$ through a separate network to an intermediate code $w$, then uses $w$ to set the "style" at each resolution of the generator, coarse layers for pose and face shape, fine layers for color and fine texture. In February 2019, the website This Person Does Not Exist showed a new StyleGAN face on every page load, realistic enough to fool many visitors.

      For text-to-image, diffusion models have since largely taken over; Dhariwal and Nichol's 2021 paper was titled "Diffusion Models Beat GANs on Image Synthesis". GANs still shine where speed matters, since one forward pass makes a sample, and adversarial losses help train audio vocoders and the image decoders you'll meet in the latent diffusion lesson.
    bridges: []
  - id: generative-adversarial-learning.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.generative-adversarial-learning
    markdown: Optimal-discriminator values to compute, plus a digit generator, a flat loss curve, and a face model that only draws smiles, test whether you can run and debug the adversarial game.
    takeaway: |-
      A GAN trains a generator to fool a discriminator whose best response is D* = p_data / (p_data + p_g). The game can reach p_g = p_data, but it can also chase its tail into mode collapse, so check coverage as well as realism.
  - id: generative-adversarial-learning.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.generative-adversarial-learning
    markdown: |-
      A GAN trains a generator using feedback from a discriminator. Check whether it produces both convincing samples and the variety present in the data.
