schema_version: 0.2-draft
lesson:
  id: generative-adversarial-learning
  version: 0.1.0-draft
  title: Train a generator against a learned discriminator
  state: draft
  summary: A GAN learns through competing generator and discriminator objectives; alternating updates can create
    useful samples but also instability, mode collapse, and misleading quality impressions.
  slot: M22.4
  category: learning
  sources:
  - title: Generative Adversarial Networks
    url: https://arxiv.org/abs/1406.2661
  - title: Wasserstein GAN
    url: https://arxiv.org/abs/1701.07875
objectives:
- id: objective.generative-adversarial-learning
  version: 1-draft
  statement: A GAN learns through competing generator and discriminator objectives; alternating updates can create
    useful samples but also instability, mode collapse, and misleading quality impressions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - generative-adversarial-learning.base
  - generative-adversarial-learning.transfer
  prerequisites:
  - anyOf:
