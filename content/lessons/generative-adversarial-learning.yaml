lesson:
  id: generative-adversarial-learning
  version: 0.4.0-draft
  title: Train a generator against a learned discriminator
  state: draft
  summary: A forger learns by fooling a detective who keeps getting sharper. That game produced the first photorealistic fake faces, and a famous way of failing. Work out the detective's best strategy exactly.
  slot: M22.4
  category: learning
  sources:
    - title: Generative Adversarial Networks (Goodfellow et al., 2014)
      url: https://arxiv.org/abs/1406.2661
    - title: Wasserstein GAN (Arjovsky, Chintala & Bottou, 2017)
      url: https://arxiv.org/abs/1701.07875
    - title: A Style-Based Generator Architecture for Generative Adversarial Networks (StyleGAN; Karras, Laine & Aila, 2018)
      url: https://arxiv.org/abs/1812.04948
    - title: Diffusion Models Beat GANs on Image Synthesis (Dhariwal & Nichol, 2021)
      url: https://arxiv.org/abs/2105.05233
objectives:
  - id: objective.generative-adversarial-learning
    version: 2-draft
    statement: A GAN learns through competing generator and discriminator objectives; alternating updates can create useful samples but also instability, mode collapse, and misleading quality impressions.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - generative-adversarial-learning.base.v2
      - generative-adversarial-learning.transfer.v2
      - generative-adversarial-learning.calculate
    prerequisites:
      - anyOf:
          - objective.generative-models
      - anyOf:
          - objective.logistic-regression
      - anyOf:
          - objective.neural-training-loop
scenes:
  - id: generative-adversarial-learning.s1
    title: A forger and a detective
    type: explanation
    depth: intuition
    objective_refs:
      - objective.generative-adversarial-learning
    markdown: |-
      A forger paints fake banknotes. A detective inspects notes and says "real" or "fake". Each time the detective catches a fake, the forger learns what gave it away; each time a fake slips through, the detective learns what to look for. Neither is ever told what a banknote *should* look like. They improve by competing.

      In 2014, Ian Goodfellow and colleagues in Montreal turned this game into a training method: the **generative adversarial network**, or **GAN**. It has two neural networks:

      - The **generator** $G$ takes random noise $z$ (a vector of random numbers, the latent from the first lesson of this module) and outputs a sample $G(z)$, such as an image.
      - The **discriminator** $D$ takes an image and outputs $D(x)$, its probability that the image is real. It's a classifier, like the logistic regression you've seen, trained on real images labeled 1 and generated ones labeled 0.

      The generator never sees a real image. Its only teacher is the gradient that flows back through the discriminator: "change these pixels this way and you'll look more real."
    diagram:
