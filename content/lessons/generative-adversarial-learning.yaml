  - anyOf:
    - objective.logistic-regression
  - anyOf:
    - objective.neural-training-loop
scenes:
- id: generative-adversarial-learning.s1
  title: Two networks provide opposing signals
  type: explanation
  depth: intuition
  objective_refs:
  - objective.generative-adversarial-learning
  markdown: A generator maps noise and optional conditions to samples. A discriminator learns to distinguish training
    examples from generated ones. The generator receives a learning signal through the discriminator that encourages
    outputs judged more like data. Different GAN objectives implement this competition differently.
  text_mode: A generator maps noise and optional conditions to samples. A discriminator learns to distinguish training
    examples from generated ones. The generator receives a learning signal through the discriminator that encourages
    outputs judged more like data. Different GAN objectives implement this competition differently.
  bridges: []
- id: generative-adversarial-learning.s2
  title: Alternate updates rather than assume equilibrium
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.generative-adversarial-learning
  markdown: An implementation commonly updates the discriminator using real and generated batches, then updates
    the generator using a differentiable discriminator score. The opponent changes over training, unlike fitting
    one fixed target. An ideal mathematical equilibrium does not guarantee a practical optimizer reaches it.
  text_mode: An implementation commonly updates the discriminator using real and generated batches, then updates
    the generator using a differentiable discriminator score. The opponent changes over training, unlike fitting
    one fixed target. An ideal mathematical equilibrium does not guarantee a practical optimizer reaches it.
  bridges: []
- id: generative-adversarial-learning.s3
  title: Recognize mode collapse
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.generative-adversarial-learning
  markdown: Imagine a dataset containing circles, squares, and triangles while the generator emits only convincing
    circles. Individual samples may look good, but distribution coverage is poor. This is a mode-collapse pattern.
    Visual inspection of a few selected successes can conceal it.
  text_mode: Imagine a dataset containing circles, squares, and triangles while the generator emits only convincing
    circles. Individual samples may look good, but distribution coverage is poor. This is a mode-collapse pattern.
    Visual inspection of a few selected successes can conceal it.
  bridges: []
- id: generative-adversarial-learning.s4
  title: Evaluate more than realism
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.generative-adversarial-learning
  markdown: Inspect diversity, conditioning accuracy, memorization, and failure cases alongside distributional metrics.
    Training stability depends on architecture, normalization, losses, and update balance. A discriminator score
    from the training game is not automatically a calibrated, independent measure of real-world sample quality.
  text_mode: Inspect diversity, conditioning accuracy, memorization, and failure cases alongside distributional
    metrics. Training stability depends on architecture, normalization, losses, and update balance. A discriminator
    score from the training game is not automatically a calibrated, independent measure of real-world sample quality.
  bridges: []
- id: generative-adversarial-learning.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.generative-adversarial-learning
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: A GAN learns through competing generator and discriminator objectives; alternating updates can create
    useful samples but also instability, mode collapse, and misleading quality impressions.
