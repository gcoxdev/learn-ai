assessment_families:
  - id: generative-adversarial-learning.base
    objective_ref: objective.generative-adversarial-learning
    task: base
    response_type: single_choice
    points: 1
    hint: 'Alternate updates rather than assume equilibrium: trace the inputs, operation, and result before choosing.'
    remediation_scene: generative-adversarial-learning.s2
    variants:
      - id: generative-adversarial-learning.base.1
        prompt: What does the generator usually take as a source of variability?
        options:
          - id: a
            text: Noise or latent input, possibly with conditions
          - id: b
            text: Only fixed discriminator labels
          - id: c
            text: The final test answers necessarily
        answer: a
        feedback: Latent variation supports sampling different outputs.
        retired: true
      - id: generative-adversarial-learning.base.2
        prompt: Why is GAN optimization unlike one fixed supervised target?
        options:
          - id: b
            text: No gradients can ever be used
          - id: c
            text: There are no parameters
          - id: a
            text: The learned opponent changes during training
        answer: a
        feedback: Each side changes the other’s learning signal.
        retired: true
  - id: generative-adversarial-learning.transfer
    objective_ref: objective.generative-adversarial-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate more than realism: trace the inputs, operation, and result before choosing.'
    remediation_scene: generative-adversarial-learning.s4
    variants:
      - id: generative-adversarial-learning.transfer.1
        prompt: Real data has three shape types, generated data only realistic circles. What failure is illustrated?
        options:
          - id: b
            text: Perfect distribution coverage
          - id: c
            text: Guaranteed privacy
          - id: a
            text: Mode collapse
        answer: a
        feedback: A realistic subset can omit major modes.
        retired: true
      - id: generative-adversarial-learning.transfer.2
        prompt: Is the training discriminator score an independent quality certificate?
        options:
          - id: c
            text: Only if it exceeds one-half
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: The scorer participates in the optimization game.
        retired: true
  - id: generative-adversarial-learning.base.v2
    objective_ref: objective.generative-adversarial-learning
    task: base
    response_type: single_choice
    points: 1
    hint: "Track who moves in each step: the discriminator step updates D to separate real from fake; the generator step backpropagates through a frozen D into G's weights."
    remediation_scene: generative-adversarial-learning.s2
    variants:
      - id: generative-adversarial-learning.base.v2.1
        prompt: During the generator step of GAN training, what happens to the discriminator's weights?
        options:
          - id: b
            text: They are updated too, to push D(G(z)) toward 0
          - id: a
            text: They stay fixed while gradients pass through D into G
          - id: c
            text: They are copied into the generator for that step
        answer: a
        feedback: D runs forward and carries gradients back, but only G's weights change. Updating D to reject fakes is the separate discriminator step.
      - id: generative-adversarial-learning.base.v2.2
        prompt: Early in training, the discriminator rejects nearly every fake. Why do most GANs have G maximize log D(G(z)) instead of minimizing log(1 − D(G(z)))?
        options:
          - id: c
            text: The two are identical, so the choice is only a convention
          - id: a
            text: The original term is nearly flat there, giving G almost no gradient
          - id: b
            text: Maximizing log D(G(z)) also trains the discriminator for free
        answer: a
        feedback: When D(G(z)) ≈ 0, log(1 − D(G(z))) barely changes, so G learns slowly. The non-saturating version has a steep slope exactly there. Both aim at the same optimum but give very different gradients, and neither updates D.
      - id: generative-adversarial-learning.base.v2.3
        prompt: At the GAN's global optimum, what does the best discriminator output for every image?
        options:
          - id: a
            text: 0.5, since real and generated images are equally likely
          - id: b
            text: 1 for real images and 0 for generated ones
          - id: c
            text: The fraction of the training set the image resembles
        answer: a
        feedback: When p_g = p_data, D* = p/(p + p) = 0.5 everywhere. A perfect 1/0 split is only possible while the generator's images differ from the data.
      - id: generative-adversarial-learning.base.v2.4
        prompt: Why doesn't a steadily falling generator loss show that a GAN is improving?
        options:
          - id: b
            text: Generator loss always rises during healthy training
          - id: c
            text: The generator loss measures reconstruction, not realism
          - id: a
            text: Each loss is measured against an opponent that keeps changing
        answer: a
        feedback: A falling generator loss might just mean the discriminator got worse. Because each network's loss depends on the other, practitioners watch sample grids and FID instead. GANs have no reconstruction term.
  - id: generative-adversarial-learning.transfer.v2
    objective_ref: objective.generative-adversarial-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: Compare the variety of the samples with the variety of the data. A generator rewarded only for fooling the current discriminator can abandon whole kinds of data.
    remediation_scene: generative-adversarial-learning.s3
    variants:
      - id: generative-adversarial-learning.transfer.v2.1
        prompt: A GAN trained on all ten handwritten digits produces crisp 1s and 7s, but you can't find a single 4 in 500 samples. What is this, and what should you report?
        options:
          - id: c
            text: Overfitting; the samples copy training images too closely
          - id: a
            text: Mode collapse; high fidelity but poor coverage of the data
          - id: b
            text: Posterior collapse; the latent code is being ignored
        answer: a
        feedback: Whole digit classes are missing, which is mode collapse. The samples may be crisp and original; the problem is coverage. Posterior collapse is the VAE failure where a decoder ignores its code.
      - id: generative-adversarial-learning.transfer.v2.2
        prompt: A face GAN's samples switch every few thousand steps, from mostly smiling faces to mostly frowning ones and back. What does this pattern suggest?
        options:
          - id: a
            text: The generator is chasing whichever mode the discriminator currently trusts
          - id: b
            text: The training data is being shuffled into smiling and frowning batches
          - id: c
            text: The generator has converged and is sampling the data correctly
        answer: a
        feedback: This is the cat-dog hop from the lesson. When D learns to distrust smiles, G shifts to frowns, then back. A converged generator would draw both at once, in the data's proportions.
      - id: generative-adversarial-learning.transfer.v2.3
        prompt: A game studio needs 10,000 texture variations per second on a phone. Why might it choose a GAN over a diffusion model?
        options:
          - id: b
            text: GANs tend to cover the data more fully than diffusion models
          - id: c
            text: GANs can train from a discriminator, without real images
          - id: a
            text: A GAN makes each sample in one forward pass, not many steps
        answer: a
        feedback: Generation is a single pass through G, while diffusion runs its network many times per sample. GANs are prone to worse coverage, not better, and they need real data to train the discriminator.
      - id: generative-adversarial-learning.transfer.v2.4
        prompt: A discriminator reaches 100% accuracy on real versus fake early in training, and the generator stops improving. Which change targets this problem?
        options:
          - id: c
            text: Train the discriminator for more steps per generator step
          - id: a
            text: Use a WGAN-style critic, which still gives gradients when fakes are easy to spot
          - id: b
            text: Stop training the generator until the discriminator's loss rises
        answer: a
        feedback: A perfect real-or-fake classifier leaves the generator with vanishing gradients; WGAN's distance-based critic keeps giving a useful slope. Strengthening the discriminator further makes it worse, and pausing the generator doesn't change the flat gradient.
  - id: generative-adversarial-learning.calculate
    objective_ref: objective.generative-adversarial-learning
    task: base
    response_type: numeric
    points: 1
    hint: "D*(x) = p_data(x) / (p_data(x) + p_g(x)): the share of this image's appearances that come from real data."
    remediation_scene: generative-adversarial-learning.s5
    absolute_tolerance: 0.01
    variants:
      - id: generative-adversarial-learning.calculate.1
        prompt: An image has p_data = 0.3 and p_g = 0.1. What does the optimal discriminator output for it?
        answer: 0.75
        feedback: D* = 0.3 / (0.3 + 0.1) = 0.75. The image is three times more common among real images, so it looks mostly real.
      - id: generative-adversarial-learning.calculate.2
        prompt: An image has p_data = 0.05 and p_g = 0.2. What does the optimal discriminator output for it?
        answer: 0.2
        feedback: D* = 0.05 / 0.25 = 0.2. The generator over-produces this image, so the discriminator distrusts it.
      - id: generative-adversarial-learning.calculate.3
        prompt: A collapsed generator draws only cats (p_g(cat) = 1), and 40% of real doodles are cats. What is D*(cat)?
        answer: 0.286
        feedback: D* = 0.4 / (0.4 + 1) = 0.4 / 1.4 ≈ 0.286. The cat mode now looks suspicious, which pushes the generator off it.
      - id: generative-adversarial-learning.calculate.4
        prompt: Real data has p_data = 0.15 for an image, and the generator never produces it (p_g = 0). What is D* for that image?
        answer: 1
        feedback: D* = 0.15 / (0.15 + 0) = 1. Anything the generator never makes is certainly real, which is what lures a collapsed generator toward it.
      - id: generative-adversarial-learning.calculate.5
        prompt: The optimal discriminator outputs 0.6 for an image with p_data = 0.3. What is p_g for that image?
        answer: 0.2
        feedback: 0.6 = 0.3 / (0.3 + p_g) gives 0.3 + p_g = 0.5, so p_g = 0.2.
