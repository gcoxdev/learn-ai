schema_version: 0.2-draft
lesson:
  id: defaults-and-exceptions
  version: 0.3.0-draft
  title: Reason when new facts can overturn a conclusion
  state: draft
  summary: Use normal opening hours and exceptions to understand why some conclusions should change when new
    facts arrive.
  slot: M04.6
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.defaults-and-exceptions
  version: 1-draft
  statement: Default reasoning supports tentative conclusions that can be withdrawn when exceptions appear;
    commonsense systems must specify how missing information and conflicting rules are handled.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - defaults-and-exceptions.base
  - defaults-and-exceptions.transfer
  prerequisites:
  - anyOf:
    - objective.rule-engines
scenes:
- id: defaults-and-exceptions.s1
  title: Use the usual case until an exception appears
  type: explanation
  depth: intuition
  objective_refs:
  - objective.defaults-and-exceptions
  markdown: 'Suppose the library is normally open on Tuesday. That gives you a reasonable expectation for a
    Tuesday visit, but a holiday closure can change the answer. The expectation is **tentative**: useful for
    now, open to revision.


    A conclusion that an exception can overturn is called **defeasible**. “Birds normally fly” works the same
    way. It permits exceptions such as penguins or injured birds, whereas “every bird flies” does not.'
  text_mode: 'Suppose the library is normally open on Tuesday. That gives you a reasonable expectation for
    a Tuesday visit, but a holiday closure can change the answer. The expectation is **tentative**: useful
    for now, open to revision.


    A conclusion that an exception can overturn is called **defeasible**. “Birds normally fly” works the same
    way. It permits exceptions such as penguins or injured birds, whereas “every bird flies” does not.'
  bridges: []
- id: defaults-and-exceptions.s2
  title: Can new facts change a conclusion?
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.defaults-and-exceptions
  markdown: 'In **monotonic** reasoning, adding facts does not remove conclusions that already followed from
    the earlier premises. This assumes we keep those premises; correcting an earlier false statement is a different
    operation.


    In **nonmonotonic** reasoning, new information can withdraw a tentative conclusion. Learning about Tuesday’s
    holiday can remove our expectation that the library is open. A default system must say which exceptions
    take priority and remember which assumptions support each conclusion.'
  text_mode: 'In **monotonic** reasoning, adding facts does not remove conclusions that already followed from
    the earlier premises. This assumes we keep those premises; correcting an earlier false statement is a different
    operation.


    In **nonmonotonic** reasoning, new information can withdraw a tentative conclusion. Learning about Tuesday’s
    holiday can remove our expectation that the library is open. A default system must say which exceptions
    take priority and remember which assumptions support each conclusion.'
  bridges: []
- id: defaults-and-exceptions.s3
  title: Trace a changing conclusion
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.defaults-and-exceptions
  markdown: Initially know Bird(Pip) and apply a default that birds fly. Later learn Penguin(Pip), with an
    exception that penguins do not fly. A suitable default system retracts the flight expectation rather than
    preserving both as unconditional facts. It should retain a trace showing why the expectation changed.
  text_mode: Initially know Bird(Pip) and apply a default that birds fly. Later learn Penguin(Pip), with an
    exception that penguins do not fly. A suitable default system retracts the flight expectation rather than
    preserving both as unconditional facts. It should retain a trace showing why the expectation changed.
  bridges: []
- id: defaults-and-exceptions.s4
  title: Why commonsense remains difficult
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.defaults-and-exceptions
  markdown: Real situations involve unstated context, changing goals, indirect effects, and exceptions at several
    levels. A language model may imitate plausible defaults without maintaining a consistent formal belief
    state. Evaluate contradiction handling and updates explicitly; producing one sensible sentence does not
    establish reliable everyday reasoning.
  text_mode: Real situations involve unstated context, changing goals, indirect effects, and exceptions at
    several levels. A language model may imitate plausible defaults without maintaining a consistent formal
    belief state. Evaluate contradiction handling and updates explicitly; producing one sensible sentence does
    not establish reliable everyday reasoning.
  bridges: []
- id: defaults-and-exceptions.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.defaults-and-exceptions
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A default describes the usual case. When an exception appears, a system should revise the conclusions
    that depended on the default and explain what changed.
- id: defaults-and-exceptions.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.defaults-and-exceptions
  markdown: A default describes the usual case. When an exception appears, a system should revise the conclusions
    that depended on the default and explain what changed.
  text_mode: A default describes the usual case. When an exception appears, a system should revise the conclusions
    that depended on the default and explain what changed.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - defaults-and-exceptions.s1
    - defaults-and-exceptions.s2
    - defaults-and-exceptions.s3
    - defaults-and-exceptions.s4
    - defaults-and-exceptions.check
    gate_refs:
    - gate.core
