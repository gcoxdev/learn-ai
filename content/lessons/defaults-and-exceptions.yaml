navigation:
  routes:
  - id: route.core
    scene_sequence:
    - defaults-and-exceptions.s1
    - defaults-and-exceptions.s2
    - defaults-and-exceptions.s3
    - defaults-and-exceptions.s4
    - defaults-and-exceptions.check
    gate_refs:
