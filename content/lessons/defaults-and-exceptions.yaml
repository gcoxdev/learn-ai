schema_version: 0.2-draft
lesson:
  id: defaults-and-exceptions
  version: 0.1.0-draft
  title: Reason when new facts can overturn a conclusion
  state: draft
  summary: Default reasoning supports tentative conclusions that can be withdrawn when exceptions appear; commonsense
    systems must specify how missing information and conflicting rules are handled.
  slot: M04.6
  category: learning
  minutes: 12
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.defaults-and-exceptions
  version: 1-draft
  statement: Default reasoning supports tentative conclusions that can be withdrawn when exceptions appear; commonsense
    systems must specify how missing information and conflicting rules are handled.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - defaults-and-exceptions.base
  - defaults-and-exceptions.transfer
  prerequisites:
  - anyOf:
    - objective.rule-engines
scenes:
- id: defaults-and-exceptions.s1
  title: A useful default is not a universal law
  type: explanation
  depth: intuition
  objective_refs:
  - objective.defaults-and-exceptions
  markdown: “Birds normally fly” supports a tentative expectation about an unfamiliar bird. It is not equivalent
    to “every bird flies.” A penguin or injured bird is a counterexample to the universal statement while remaining
    compatible with the default. Everyday reasoning relies on many such defeasible expectations.
  text_mode: “Birds normally fly” supports a tentative expectation about an unfamiliar bird. It is not equivalent
    to “every bird flies.” A penguin or injured bird is a counterexample to the universal statement while remaining
    compatible with the default. Everyday reasoning relies on many such defeasible expectations.
  bridges: []
- id: defaults-and-exceptions.s2
  title: Contrast monotonic and nonmonotonic reasoning
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.defaults-and-exceptions
  markdown: In classical monotonic logic, adding premises does not invalidate a previously entailed conclusion.
    In nonmonotonic reasoning, adding an exception can withdraw a tentative conclusion. The system must define priorities,
    assumptions, and how conclusions depend on them. Otherwise conflicting defaults can produce arbitrary behavior.
  text_mode: In classical monotonic logic, adding premises does not invalidate a previously entailed conclusion.
    In nonmonotonic reasoning, adding an exception can withdraw a tentative conclusion. The system must define priorities,
    assumptions, and how conclusions depend on them. Otherwise conflicting defaults can produce arbitrary behavior.
  bridges: []
- id: defaults-and-exceptions.s3
  title: Trace a changing conclusion
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.defaults-and-exceptions
  markdown: Initially know Bird(Pip) and apply a default that birds fly. Later learn Penguin(Pip), with an exception
    that penguins do not fly. A suitable default system retracts the flight expectation rather than preserving both
    as unconditional facts. It should retain a trace showing why the expectation changed.
  text_mode: Initially know Bird(Pip) and apply a default that birds fly. Later learn Penguin(Pip), with an exception
    that penguins do not fly. A suitable default system retracts the flight expectation rather than preserving both
    as unconditional facts. It should retain a trace showing why the expectation changed.
  bridges: []
- id: defaults-and-exceptions.s4
  title: Why commonsense remains difficult
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.defaults-and-exceptions
  markdown: Real situations involve unstated context, changing goals, indirect effects, and exceptions at several
    levels. A language model may imitate plausible defaults without maintaining a consistent formal belief state.
    Evaluate contradiction handling and updates explicitly; producing one sensible sentence does not establish reliable
    everyday reasoning.
  text_mode: Real situations involve unstated context, changing goals, indirect effects, and exceptions at several
    levels. A language model may imitate plausible defaults without maintaining a consistent formal belief state.
    Evaluate contradiction handling and updates explicitly; producing one sensible sentence does not establish reliable
    everyday reasoning.
  bridges: []
- id: defaults-and-exceptions.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.defaults-and-exceptions
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Default reasoning supports tentative conclusions that can be withdrawn when exceptions appear; commonsense
    systems must specify how missing information and conflicting rules are handled.
- id: defaults-and-exceptions.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.defaults-and-exceptions
  markdown: Default reasoning supports tentative conclusions that can be withdrawn when exceptions appear; commonsense
    systems must specify how missing information and conflicting rules are handled.
  text_mode: Default reasoning supports tentative conclusions that can be withdrawn when exceptions appear; commonsense
