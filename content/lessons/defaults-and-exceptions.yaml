schema_version: 0.2-draft
lesson:
  id: defaults-and-exceptions
  version: 0.4.0-draft
  title: Reason when new facts can overturn a conclusion
  state: draft
  summary: '"I got a bird named Tweety." "Keep the windows shut!" "Tweety''s a penguin." See how a reasoning system takes back a sensible conclusion, and why common sense defeated decades of hand-written rules.'
  slot: M04.6
  category: learning
  sources:
    - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
      url: https://aima.cs.berkeley.edu/
objectives:
  - id: objective.defaults-and-exceptions
    version: 2-draft
    statement: Default reasoning supports tentative conclusions that can be withdrawn when exceptions appear; commonsense systems must specify how missing information and conflicting rules are handled.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - defaults-and-exceptions.base.v2
      - defaults-and-exceptions.transfer.v2
    prerequisites:
      - anyOf:
          - objective.rule-engines
scenes:
  - id: defaults-and-exceptions.s1
    title: Tweety flies, until you learn more
    type: explanation
    depth: intuition
    objective_refs:
      - objective.defaults-and-exceptions
    markdown: |-
      A friend says, "I just got a bird. Her name's Tweety." You reply, "Keep the windows shut, then!" Your friend laughs: "Tweety's a penguin."

      You weren't being careless. With what you knew, "Tweety can fly" was the sensible bet. When the new fact arrived, you took it back without any fuss. People do this all day; the logic from earlier lessons can't.

      Three kinds of statement are in play:

      | Statement | Kind | Allows exceptions? |
      | --- | --- | --- |
      | "Every bird flies." | universal rule | No, and it's false: penguins, ostriches, kiwis |
      | "Birds normally fly." | **default** | Yes: it's what you assume unless you learn otherwise |
      | "Penguins don't fly." | exception | It overrides the default for penguins |

      A **default** is a rule about the usual case. A conclusion drawn from one is **defeasible**: it holds for now and can be defeated by a new fact. "The library is open on Tuesdays," "trains run on time," and "the stove is off when nobody's cooking" all work the same way.
    bridges: []
  - id: defaults-and-exceptions.s2
    title: More facts, fewer conclusions
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.defaults-and-exceptions
    markdown: |-
      In the propositional and first-order logic of earlier lessons, adding a fact can never remove a conclusion. If the premises entail something, a bigger set of premises still entails it. Logic with that property is **monotonic**: the pile of conclusions only grows. Tweety breaks this:

      | Moment | What you know | What you conclude |
      | --- | --- | --- |
      | 1 | Tweety is a bird | Tweety flies (by default) |
      | 2 | + Tweety is a penguin | Tweety doesn't fly |

      Knowing *more* left you with *fewer* of the old conclusions. Reasoning where new facts can withdraw conclusions is called **nonmonotonic**. Why did the penguin fact win? Because it's more specific: every penguin is a bird, but not the other way round. That preference is called the *specificity principle*.

      When neither rule is more specific, defaults can deadlock. The textbook case is the "Nixon diamond": Quakers are normally pacifists, Republicans normally aren't, and Richard Nixon was both. A careful system concludes nothing either way.

      You've met nonmonotonic reasoning once already. Under the closed-world assumption from the knowledge graph lesson, a film missing from a cinema's listing isn't showing; add the listing, and that conclusion disappears.

      :::papers Writing a default down
      In 1980 two papers in the journal *Artificial Intelligence* gave defaults a precise form. John McCarthy's *circumscription* adds an "abnormal" predicate and then assumes as few abnormal things as possible:
      $$\forall x\;\big(\text{Bird}(x) \land \lnot\text{Abnormal}(x) \to \text{Flies}(x)\big)$$
      At moment 1, nothing says Tweety is abnormal, so Tweety flies. Adding $\forall x\,(\text{Penguin}(x) \to \text{Abnormal}(x))$ makes Tweety abnormal at moment 2, and the conclusion disappears. Raymond Reiter's *default logic* instead reads the rule as "if x is a bird, and it's consistent with everything you know that x flies, conclude that x flies."
      :::

      :::mixup "If a conclusion gets taken back, the reasoning was wrong."
      At moment 1, "Tweety flies" was the best conclusion from what you knew. Withdrawing it at moment 2 is the reasoning working correctly. A good system also keeps a note of *which* default each conclusion rests on, so it knows exactly what to retract.
      :::
    bridges: []
  - id: defaults-and-exceptions.s3
    title: 'Code it: the nearest default wins'
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.defaults-and-exceptions
    markdown: |-
      One simple way to implement specificity: arrange kinds of animal in a hierarchy, store defaults at each level, and let a known fact about an individual beat everything.

      ```python run
      is_a = {"penguin": "bird", "sparrow": "bird", "bird": "animal",
              "bat": "mammal", "mammal": "animal"}
      flies = {"animal": False, "bird": True, "penguin": False, "bat": True}
      known = {"Pip": False}          # facts about one individual: Pip hurt a wing

      def can_fly(name, kind):
          if name in known:                          # a fact beats every default
              return known[name], "fact about " + name
          while kind not in flies:                   # climb to the nearest default
              kind = is_a[kind]
          return flies[kind], "default for " + kind

      for name, kind in [("Tweety", "bird"), ("Tweety", "penguin"),
                         ("Sunny", "sparrow"), ("Batty", "bat"), ("Pip", "sparrow")]:
          answer, why = can_fly(name, kind)
          print(f"{name} the {kind}: flies={answer}  ({why})")
      ```

      Notice the layers. Animals normally don't fly, birds normally do, and penguins normally don't. Other mammals inherit the animal default, but bats override it. Each answer comes with its reason.

      :::try Meet an ostrich
      Add `"ostrich": "bird"` to `is_a` and `("Ozzy", "ostrich")` to the list, then run it. Ozzy flies, because nobody wrote an ostrich exception. Fix it by adding `"ostrich": False` to `flies`. Every exception has to be written down by someone.
      :::
    bridges: []
  - id: defaults-and-exceptions.s4
    title: Why common sense is so hard to write down
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.defaults-and-exceptions
    markdown: |-
      The ostrich is a small taste of two famous problems.

      The **qualification problem**: real rules need an endless list of conditions. John McCarthy's classic example is a car that starts when you turn the key, unless the battery is dead, the tank is empty, or someone has stuffed a potato in the tailpipe. You can never list every "unless."

      The **frame problem**, named by McCarthy and Patrick Hayes in 1969: when an action happens, what *doesn't* change? If a robot carries a vase to the shelf, the lights stay on and the table stays in the kitchen. People never think to say so, but a logical system needs to be told, or it can't conclude anything about the rest of the room after any action.

      :::story Writing it all down
      In 1984 Douglas Lenat started **Cyc**, a project to hand-enter the common sense an encyclopedia takes for granted: that people can't be in two places at once, that water makes things wet. Over the following decades its team entered millions of facts and rules. Cyc found specialized uses, but writing common sense down one rule at a time proved far slower than anyone had hoped.
      :::

      Large language models took the opposite route and absorbed defaults from huge amounts of text. They handle Tweety well, but they don't keep one explicit list of beliefs that each new fact updates. A chatbot might say "penguins can't fly" in one answer and describe a penguin flying south for winter in the next. So test a system's defaults the way this lesson did: give it the default, then the exception, then ask again.
    bridges: []
  - id: defaults-and-exceptions.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.defaults-and-exceptions
    markdown: Bakeries on holidays, back-ordered parcels, robot vacuums, and a quarrel between two defaults test whether you can tell when a conclusion should be withdrawn.
    takeaway: |-
      A default is a rule about the usual case, and its conclusions hold only until a more specific fact defeats them. Good systems withdraw exactly those conclusions and can say which exception caused the change.
  - id: defaults-and-exceptions.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.defaults-and-exceptions
    markdown: |-
      A default describes the usual case. When an exception appears, a system should revise the conclusions that depended on the default and explain what changed.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - defaults-and-exceptions.s1
        - defaults-and-exceptions.s2
        - defaults-and-exceptions.s3
        - defaults-and-exceptions.s4
        - defaults-and-exceptions.check
      gate_refs:
        - gate.core
  scene_aliases:
    defaults-and-exceptions.recap: defaults-and-exceptions.check
assessment_families:
  - id: defaults-and-exceptions.base
    objective_ref: objective.defaults-and-exceptions
    task: base
    response_type: single_choice
    points: 1
    hint: 'Contrast monotonic and nonmonotonic reasoning: trace the inputs, operation, and result before choosing.'
    remediation_scene: defaults-and-exceptions.s2
    variants:
      - id: defaults-and-exceptions.base.1
        prompt: What distinguishes a default from a universal rule?
        options:
          - id: b
            text: A default must be false
          - id: c
            text: A universal rule is only a suggestion
          - id: a
            text: A default permits specified exceptions
        answer: a
        feedback: Defaults are tentative under incomplete information.
        retired: true
      - id: defaults-and-exceptions.base.2
        prompt: What can happen when new facts enter a nonmonotonic system?
        options:
          - id: c
            text: The input data must be deleted
          - id: a
            text: A previous tentative conclusion can be withdrawn
          - id: b
            text: Every old conclusion must remain unconditional
        answer: a
        feedback: New exceptions can defeat earlier default inferences.
        retired: true
  - id: defaults-and-exceptions.transfer
    objective_ref: objective.defaults-and-exceptions
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Why commonsense remains difficult: trace the inputs, operation, and result before choosing.'
    remediation_scene: defaults-and-exceptions.s4
    variants:
      - id: defaults-and-exceptions.transfer.1
        prompt: A system learns that its assumed flying bird is a penguin. What should its trace make clear?
        options:
          - id: c
            text: Only the time the screen refreshed
          - id: a
            text: Which default was defeated and by which exception
          - id: b
            text: That the original expectation was a permanent theorem
        answer: a
        feedback: A dependency trace explains the change in conclusion.
        retired: true
      - id: defaults-and-exceptions.transfer.2
        prompt: A fluent system gives contradictory defaults in two contexts. What needs evaluation?
        options:
          - id: a
            text: Consistency and context-sensitive revision behavior
          - id: b
            text: Only output length
          - id: c
            text: Only whether both sentences sound natural
        answer: a
        feedback: Plausibility in isolation is weaker than coherent reasoning across updates.
        retired: true
  - id: defaults-and-exceptions.base.v2
    objective_ref: objective.defaults-and-exceptions
    task: base
    response_type: single_choice
    points: 1
    hint: Ask which rule is more specific. A more specific exception beats a general default; two defaults with neither more specific leave the question open.
    remediation_scene: defaults-and-exceptions.s2
    variants:
      - id: defaults-and-exceptions.base.v2.1
        prompt: A system has concluded Flies(Tweety) from the bird default. It then learns Penguin(Tweety). What does a nonmonotonic system do?
        options:
          - id: b
            text: Keeps both Flies and not-Flies and reports a contradiction
          - id: a
            text: Withdraws Flies(Tweety) and concludes that Tweety doesn't fly
          - id: c
            text: Keeps Flies(Tweety), since a conclusion stays once it is drawn
        answer: a
        feedback: The penguin fact defeats the default that produced Flies(Tweety), so that conclusion is retracted. Keeping both would treat a tentative conclusion as a permanent one, which is the monotonic habit defaults are meant to escape.
      - id: defaults-and-exceptions.base.v2.2
        prompt: Which of these is a default rather than a universal rule?
        options:
          - id: c
            text: Penguins are a kind of bird
          - id: b
            text: Each bird has feathers
          - id: a
            text: Birds normally fly
        answer: a
        feedback: '"Normally" marks a default: assume it unless you learn otherwise. Having feathers holds for each bird without exception, and "penguins are birds" is a fact about the hierarchy.'
      - id: defaults-and-exceptions.base.v2.3
        prompt: 'Defaults: birds normally fly; penguins normally don''t. Tweety is a penguin, and so also a bird. What does the specificity principle conclude?'
        options:
          - id: a
            text: Tweety doesn't fly, since the penguin rule is more specific
          - id: b
            text: Tweety flies, since the bird rule was written down first
          - id: c
            text: Nothing either way, since the two defaults conflict
        answer: a
        feedback: Every penguin is a bird but not the reverse, so the penguin rule is more specific and wins. Order of writing doesn't matter, and a deadlock only happens when neither rule is more specific, as in the Nixon diamond.
      - id: defaults-and-exceptions.base.v2.4
        prompt: Quakers are normally pacifists; Republicans normally aren't. Someone is both, and neither group is a subgroup of the other. What does a careful default system conclude?
        options:
          - id: b
            text: Pacifist, since the Quaker default is listed first
          - id: a
            text: Nothing either way about being a pacifist
          - id: c
            text: Both pacifist and not, since each default applies
        answer: a
        feedback: This is the Nixon diamond. Neither default is more specific, so a careful system draws no conclusion. Listing order is arbitrary, and accepting both would be a contradiction.
      - id: defaults-and-exceptions.base.v2.5
        prompt: In ordinary first-order logic, you add a new fact to a knowledge base. What happens to conclusions it could already prove?
        options:
          - id: c
            text: Some are withdrawn if the new fact is an exception
          - id: a
            text: They can all still be proved
          - id: b
            text: They must be re-proved before they count again
        answer: a
        feedback: First-order logic is monotonic, so a bigger set of premises still entails everything the smaller set did. Withdrawing conclusions is what nonmonotonic reasoning adds.
  - id: defaults-and-exceptions.transfer.v2
    objective_ref: objective.defaults-and-exceptions
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name the usual case and the new fact that overrides it. Then decide which conclusion should be withdrawn, or which classic problem you are looking at.
    remediation_scene: defaults-and-exceptions.s4
    variants:
      - id: defaults-and-exceptions.transfer.v2.1
        prompt: A maps app shows a bakery as open on Tuesdays, 8 to 5. Today is a public holiday, and the bakery has posted "Closed today." What should the app show?
        options:
          - id: a
            text: Closed today, since the specific notice overrides the usual hours
          - id: b
            text: Both open and closed, and let people decide for themselves
          - id: c
            text: Open, since the regular hours are the rule that was entered
        answer: a
        feedback: Regular hours are a default, and today's notice is a more specific exception. Showing both hands the reasoning to the user, and keeping "open" ignores new information.
      - id: defaults-and-exceptions.transfer.v2.2
        prompt: A store's message says "Ships by Friday," based on "orders ship within 2 days unless an item is back-ordered." The system then learns one item is back-ordered. What should happen to the message?
        options:
          - id: c
            text: Keep it, since it was correct when it was sent
          - id: b
            text: Cancel the order, since its promise can't be kept
          - id: a
            text: Withdraw it and say the back-order caused the change
        answer: a
        feedback: The shipping date was a defeasible conclusion; the back-order defeats it. Retracting it and naming the reason is exactly what a dependency note is for. Cancelling the order overreacts to a changed estimate.
      - id: defaults-and-exceptions.transfer.v2.3
        prompt: 'A robot vacuum''s rule is "if the battery is low, return to the dock." Engineers keep adding exceptions: unless the dock is blocked, unless the robot is stuck, unless the dock is unplugged… Which problem is this?'
        options:
          - id: b
            text: The frame problem
          - id: a
            text: The qualification problem
          - id: c
            text: The Nixon diamond
        answer: a
        feedback: The qualification problem is the endless list of conditions a real rule needs. The frame problem is about what an action leaves unchanged, and the Nixon diamond is two conflicting defaults.
      - id: defaults-and-exceptions.transfer.v2.4
        prompt: A home robot moves a vase from the table to a shelf. Afterwards its planner can't tell whether the lights are still on or whether the table is still in the kitchen. Which problem is this?
        options:
          - id: a
            text: The frame problem
          - id: c
            text: The qualification problem
          - id: b
            text: The specificity principle
        answer: a
        feedback: Nothing told the planner that moving a vase leaves the lights and table alone; that's the frame problem. The qualification problem is about missing conditions on a rule, and specificity is a way of choosing between defaults.
      - id: defaults-and-exceptions.transfer.v2.5
        prompt: A chatbot says "penguins can't fly," then writes a story about a penguin flying south for winter. What is the most useful way to evaluate its default reasoning?
        options:
          - id: b
            text: Ask once whether penguins fly and trust that answer
          - id: c
            text: Check that each sentence reads as fluent and plausible
          - id: a
            text: Test whether it stays consistent across related questions
        answer: a
        feedback: The model has no single belief list that each answer draws on, so one correct answer tells you little. Probing the default, the exception, and follow-ups in different settings shows whether it reasons consistently; fluency doesn't.
