schema_version: 0.2-draft
lesson:
  id: positional-encodings
  version: 0.1.0-draft
  title: Give a transformer information about order
  state: draft
  summary: Positional methods encode absolute or relative location through embeddings, biases, or rotations; evaluating
    positions beyond training is not the same as learning to use long context reliably.
  slot: M15.5
  category: learning
  minutes: 12
  sources:
  - title: Attention Is All You Need
    url: https://arxiv.org/abs/1706.03762
  - title: 'RoFormer: Enhanced Transformer with Rotary Position Embedding'
    url: https://arxiv.org/abs/2104.09864
objectives:
- id: objective.positional-encodings
  version: 1-draft
  statement: Positional methods encode absolute or relative location through embeddings, biases, or rotations; evaluating
    positions beyond training is not the same as learning to use long context reliably.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - positional-encodings.base
  - positional-encodings.transfer
  prerequisites:
  - anyOf:
    - objective.multi-head-attention
  - anyOf:
    - objective.geometry-and-symmetry
scenes:
- id: positional-encodings.s1
  title: Token identity does not fully specify position
  type: explanation
  depth: intuition
  objective_refs:
  - objective.positional-encodings
  markdown: The same words in a different order can express a different relation. A transformer needs a way for
    position to affect its computation. Learned absolute embeddings and sinusoidal vectors can be added to token
    representations. Other designs alter attention scores or query/key features.
  text_mode: The same words in a different order can express a different relation. A transformer needs a way for
    position to affect its computation. Learned absolute embeddings and sinusoidal vectors can be added to token
    representations. Other designs alter attention scores or query/key features.
  bridges: []
- id: positional-encodings.s2
  title: Use several scales of position
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.positional-encodings
  markdown: 'Sinusoidal encodings use sine and cosine patterns at different frequencies. Think of several clocks
    with different cycle lengths: together they distinguish positions across scales. Sine and cosine give coordinates
    around a unit circle. At a quarter turn, [1, 0] becomes [0, 1].'
  text_mode: 'Sinusoidal encodings use sine and cosine patterns at different frequencies. Think of several clocks
    with different cycle lengths: together they distinguish positions across scales. Sine and cosine give coordinates
    around a unit circle. At a quarter turn, [1, 0] becomes [0, 1].'
  bridges:
  - geometry-and-symmetry
  - vectors
- id: positional-encodings.s3
  title: Rotate queries and keys
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.positional-encodings
  markdown: Rotary position embeddings apply position-dependent rotations to pairs of query and key coordinates.
    In the basic construction, their dot product incorporates a relative angle determined by the positions. The
    operation changes the comparison geometry; it is not simply appending the integer position to a token ID. Variants
    differ in scaling and details.
  text_mode: Rotary position embeddings apply position-dependent rotations to pairs of query and key coordinates.
    In the basic construction, their dot product incorporates a relative angle determined by the positions. The
    operation changes the comparison geometry; it is not simply appending the integer position to a token ID. Variants
    differ in scaling and details.
  bridges: []
- id: positional-encodings.s4
  title: Check extrapolation empirically
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.positional-encodings
  markdown: A formula may be computable at position 100,000 while the model has little experience using such contexts.
    Learned absolute tables also have explicit size limits unless extended by a method. Position scaling, continued
    training, attention patterns, and evaluation all matter. A nominal context window is weaker evidence than reliable
    retrieval and reasoning throughout it.
  text_mode: A formula may be computable at position 100,000 while the model has little experience using such contexts.
    Learned absolute tables also have explicit size limits unless extended by a method. Position scaling, continued
    training, attention patterns, and evaluation all matter. A nominal context window is weaker evidence than reliable
    retrieval and reasoning throughout it.
  bridges: []
- id: positional-encodings.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.positional-encodings
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Positional methods encode absolute or relative location through embeddings, biases, or rotations; evaluating
    positions beyond training is not the same as learning to use long context reliably.
- id: positional-encodings.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.positional-encodings
  markdown: Positional methods encode absolute or relative location through embeddings, biases, or rotations; evaluating
    positions beyond training is not the same as learning to use long context reliably.
  text_mode: Positional methods encode absolute or relative location through embeddings, biases, or rotations; evaluating
    positions beyond training is not the same as learning to use long context reliably.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - positional-encodings.s1
    - positional-encodings.s2
    - positional-encodings.s3
    - positional-encodings.s4
    - positional-encodings.check
    gate_refs:
    - gate.core
  scene_aliases:
    positional-encodings.recap: positional-encodings.check
assessment_families:
- id: positional-encodings.base
  objective_ref: objective.positional-encodings
  task: base
  response_type: single_choice
  points: 1
  hint: 'Use several scales of position: trace the inputs, operation, and result before choosing.'
  remediation_scene: positional-encodings.s2
  variants:
  - id: positional-encodings.base.1
    prompt: What information do positional mechanisms add or modify?
    options:
    - id: c
      text: Only the tokenizer’s vocabulary size
    - id: a
      text: Where representations occur relative to a sequence or each other
    - id: b
      text: A guarantee of factual truth
    answer: a
    feedback: Position affects how order can enter the model computation.
  - id: positional-encodings.base.2
    prompt: In a basic RoPE design, which vectors receive position-dependent rotations?
    options:
    - id: a
      text: Queries and keys
    - id: b
      text: Only final class labels
    - id: c
      text: Only optimizer moments
    answer: a
    feedback: Rotating queries and keys makes position affect their attention comparison.
- id: positional-encodings.transfer
  objective_ref: objective.positional-encodings
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Check extrapolation empirically: trace the inputs, operation, and result before choosing.'
  remediation_scene: positional-encodings.s4
  variants:
  - id: positional-encodings.transfer.1
    prompt: A positional formula evaluates at a longer index than used in training. Is long-context competence established?
    options:
    - id: a
      text: No; model behavior needs evaluation
    - id: b
      text: Yes; numerical evaluation proves comprehension
    - id: c
      text: Only if the index is even
    answer: a
    feedback: Representability of positions and learned use of long context differ.
  - id: positional-encodings.transfer.2
    prompt: A learned absolute position table has 2048 entries. What must be addressed to use new positions directly?
    options:
    - id: b
      text: Only the prompt’s font
    - id: c
      text: A claim that every position already has an entry
    - id: a
      text: The table limit and a justified extension strategy
    answer: a
    feedback: An explicit embedding table does not contain arbitrary unseen indices.
