schema_version: 0.2-draft
lesson:
  id: positional-encodings
  version: 0.3.0-draft
  title: Give a transformer information about order
  state: draft
  summary: Swap two words, then discover how a transformer can keep track of where each piece belongs.
  slot: M15.5
  category: learning
  sources:
  - title: Vaswani et al. — Attention Is All You Need
    url: https://arxiv.org/abs/1706.03762
  - title: Su et al. — RoFormer
    url: https://arxiv.org/abs/2104.09864
  archetype: mechanism
objectives:
- id: objective.positional-encodings
  version: 2-draft
  statement: Distinguish token content from position and trace simple additive and two-dimensional rotary position
    examples.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - positional-encodings.base.v2
  - positional-encodings.transfer.v2
  prerequisites:
  - anyOf:
    - objective.multi-head-attention
  - anyOf:
    - objective.geometry-and-symmetry
scenes:
- id: positional-encodings.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.positional-encodings
  title: A pile of words loses an important clue
  markdown: “Dogs chase cats” and “Cats chase dogs” contain the same token types in different places. Without
    position information, plain self-attention carries rearranged inputs into correspondingly rearranged outputs.
    It has no separate signal saying which slot each token occupies. A transformer therefore needs a way to
    represent order when order matters. A **position** is an index locating a token within the sequence. Position
    information is different from the token’s identity, even though both eventually influence numerical representations.
  text_mode: “Dogs chase cats” and “Cats chase dogs” contain the same token types in different places. Without
    position information, plain self-attention carries rearranged inputs into correspondingly rearranged outputs.
    It has no separate signal saying which slot each token occupies. A transformer therefore needs a way to
    represent order when order matters. A **position** is an index locating a token within the sequence. Position
    information is different from the token’s identity, even though both eventually influence numerical representations.
  bridges: []
- id: positional-encodings.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.positional-encodings
  title: Add a location tag to a content vector
  markdown: One approach adds a position vector to an embedding. Let the content vector be [2,1], and the tag
    for position zero be [0,1]. The combined input is [2,2]. At position one, suppose the tag is [1,0], giving
    [3,1]. The token ID and stored embedding can be unchanged while its combined representation differs. These
    are constructed vectors to show addition, not values from a trained model or the exact sinusoidal formula.
  text_mode: One approach adds a position vector to an embedding. Let the content vector be [2,1], and the
    tag for position zero be [0,1]. The combined input is [2,2]. At position one, suppose the tag is [1,0],
    giving [3,1]. The token ID and stored embedding can be unchanged while its combined representation differs.
    These are constructed vectors to show addition, not values from a trained model or the exact sinusoidal
    formula.
  bridges:
  - vectors
- id: positional-encodings.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.positional-encodings
  title: Learned tags and patterned tags make different choices
  markdown: A learned position table stores adjustable vectors for positions seen during training. A sinusoidal
    rule generates position signals from waves at different scales, rather than learning a separate entry for
    every location. Both provide numerical cues, but neither guarantees reliable behavior on much longer sequences.
    The training examples, attention pattern, numerical scale, and evaluation task all matter. A rule that
    can produce a vector for position ten thousand has not thereby proved useful reasoning at that position.
  text_mode: A learned position table stores adjustable vectors for positions seen during training. A sinusoidal
    rule generates position signals from waves at different scales, rather than learning a separate entry for
    every location. Both provide numerical cues, but neither guarantees reliable behavior on much longer sequences.
    The training examples, attention pattern, numerical scale, and evaluation task all matter. A rule that
    can produce a vector for position ten thousand has not thereby proved useful reasoning at that position.
  bridges: []
- id: positional-encodings.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.positional-encodings
  title: Rotate a query and key instead
  markdown: '**Rotary positional embeddings**, often called RoPE, apply position-dependent rotations to pairs
    of query and key coordinates. To see a rotation, turn [1,0] by ninety degrees to get [0,1]. Its length
    stays one. If q=[1,0] and k=[1,0], their dot product starts at one. Rotating only k by ninety degrees gives
    a dot product of zero. Rotating both by the same ninety degrees gives one again. Relative rotation, rather
    than a mere location label, can change their match.'
  text_mode: '**Rotary positional embeddings**, often called RoPE, apply position-dependent rotations to pairs
    of query and key coordinates. To see a rotation, turn [1,0] by ninety degrees to get [0,1]. Its length
    stays one. If q=[1,0] and k=[1,0], their dot product starts at one. Rotating only k by ninety degrees gives
    a dot product of zero. Rotating both by the same ninety degrees gives one again. Relative rotation, rather
    than a mere location label, can change their match.'
  bridges:
  - geometry-and-symmetry
- id: positional-encodings.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.positional-encodings
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Content says what; position helps say where. The chosen positional rule affects how order and distance
    enter attention.
- id: positional-encodings.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.positional-encodings
  markdown: Positional methods encode absolute or relative location through embeddings, biases, or rotations;
    evaluating positions beyond training is not the same as learning to use long context reliably.
  text_mode: Positional methods encode absolute or relative location through embeddings, biases, or rotations;
    evaluating positions beyond training is not the same as learning to use long context reliably.
- id: positional-encodings.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.positional-encodings
  title: Do not mix up the interfaces
  markdown: In an additive design, a position signal enters the input representation. In a rotary design, the
    relevant rotations act on query/key coordinates for attention; this is not just adding a tag to the token
    ID. Another family adds distance-dependent biases to attention scores. These choices can coexist with masks
    that control which positions are allowed. A mask decides permission to attend; a positional scheme supplies
    information about location or relative distance. Their jobs are distinct.
  text_mode: In an additive design, a position signal enters the input representation. In a rotary design,
    the relevant rotations act on query/key coordinates for attention; this is not just adding a tag to the
    token ID. Another family adds distance-dependent biases to attention scores. These choices can coexist
    with masks that control which positions are allowed. A mask decides permission to attend; a positional
    scheme supplies information about location or relative distance. Their jobs are distinct.
  bridges: []
- id: positional-encodings.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.positional-encodings
  title: Test order and distance separately
  markdown: Try a role-swap sentence to check order sensitivity, and a repeated retrieval task with increasing
    separation to investigate distance effects. Keep the content and question controlled when possible. A successful
    nearby lookup does not establish long-context reliability. For unfamiliar angle notation, use the geometry
    side lesson and return to the two-vector example. The memory cue “what, where, allowed” separates content,
    position, and masking before combining them inside a full attention layer.
  text_mode: Try a role-swap sentence to check order sensitivity, and a repeated retrieval task with increasing
    separation to investigate distance effects. Keep the content and question controlled when possible. A successful
    nearby lookup does not establish long-context reliability. For unfamiliar angle notation, use the geometry
    side lesson and return to the two-vector example. The memory cue “what, where, allowed” separates content,
    position, and masking before combining them inside a full attention layer.
  bridges: []
- id: positional-encodings.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.positional-encodings
  title: Turn both arrows together
  markdown: q=[1,0] and k=[1,0] both rotate ninety degrees to [0,1]. What is their new dot product?
  text_mode: q=[1,0] and k=[1,0] both rotate ninety degrees to [0,1]. What is their new dot product?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: '1'
    - id: b
      text: '0'
    - id: c
      text: −1
    answer: a
    reveal_markdown: 'The aligned pair remains aligned: 0×0+1×1=1. A common rotation preserves their dot product
      in this example.'
    hint: Trace the example using the rule from the preceding pages.
    id: positional-encodings.practice.v2.7
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - positional-encodings.s1
    - positional-encodings.s2
    - positional-encodings.s3
    - positional-encodings.s4
    - positional-encodings.s5
    - positional-encodings.s6
    - positional-encodings.s7
    - positional-encodings.check
    gate_refs:
