schema_version: 0.2-draft
lesson:
  id: positional-encodings
  version: 0.4.0-draft
  title: Give a transformer information about order
  state: draft
  summary: To plain self-attention, "dog bites man" and "man bites dog" are the same news. See the three tricks, waves, rotations, and distance penalties, that give transformers a sense of order.
  slot: M15.5
  category: learning
  sources:
    - title: "Attention Is All You Need, section 3.5 (Vaswani et al., 2017)"
      url: https://arxiv.org/abs/1706.03762
    - title: "RoFormer: Enhanced Transformer with Rotary Position Embedding (Su et al., 2021)"
      url: https://arxiv.org/abs/2104.09864
    - title: "Train Short, Test Long: Attention with Linear Biases Enables Input Length Extrapolation (Press, Smith & Lewis, 2021)"
      url: https://arxiv.org/abs/2108.12409
    - title: "Extending Context Window of Large Language Models via Positional Interpolation (Chen et al., 2023)"
      url: https://arxiv.org/abs/2306.15595
    - title: "Transformer Language Models without Positional Encodings Still Learn Positional Information (Haviv et al., 2022)"
      url: https://arxiv.org/abs/2203.16634
    - title: "LLaMA: Open and Efficient Foundation Language Models (Touvron et al., 2023)"
      url: https://arxiv.org/abs/2302.13971
  archetype: mechanism
objectives:
  - id: objective.positional-encodings
    version: 3-draft
    statement: Explain why self-attention needs position information, and trace additive (learned or sinusoidal) positions, rotary position embeddings, and distance biases.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - positional-encodings.base.v2
      - positional-encodings.transfer.v3
    prerequisites:
      - anyOf:
          - objective.multi-head-attention
      - anyOf:
          - objective.geometry-and-symmetry
scenes:
  - id: positional-encodings.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.positional-encodings
    title: Shuffle the words, get the same vectors
    markdown: |-
      "Dog bites man" is not news. "Man bites dog" is. Same three words, opposite meaning. Now look at what self-attention, exactly as you've built it, does with them.

      Every score is a query–key dot product, and nothing in it says where a token sits. Feed "dog bites man" and "man bites dog" through the "bees make honey" embeddings and matrices, with no mask:

      ```python run
      import numpy as np

      emb = {"dog": [1.0, 0.0], "bites": [0.0, 1.0], "man": [1.0, 1.0]}
      W_Q = np.array([[0.0, 2.0], [2.0, 0.0]])
      W_K, W_V = np.eye(2), 4 * np.eye(2)

      def self_attention(X):                     # no mask, no positions
          Q, K, V = X @ W_Q, X @ W_K, X @ W_V
          s = Q @ K.T / np.sqrt(2)
          w = np.exp(s - s.max(axis=1, keepdims=True))
          return (w / w.sum(axis=1, keepdims=True)) @ V

      for sentence in ["dog bites man", "man bites dog"]:
          words = sentence.split()
          out = self_attention(np.array([emb[w] for w in words]))
          for w, o in zip(words, out):
              print(f"{sentence:14s} {w:6s} -> {o.round(2)}")
      ```

      "bites" gets exactly [3.57, 2.22] in both sentences; "dog" and "man" just trade places. Shuffle the inputs and the outputs shuffle the same way. That property is called **permutation equivariance**, and it means the model can't tell who bit whom.

      The cure is to give each token its **position**, its index in the sequence (0, 1, 2, …), in a form the model can use.
    bridges: []
  - id: positional-encodings.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.positional-encodings
    title: Add a location tag to a content vector
    markdown: |-
      The simplest way: keep a second vector for each position and add it to the token's embedding before the first layer. If "dog" has content vector [2, 1] and position 0's tag is [0, 1], the model's input is [2, 2]. The same "dog" at position 1, with tag [1, 0], enters as [3, 1]. Same token, different inputs, so every score downstream can differ.

      Where do the tags come from? The easiest answer is to learn them: a **learned position table** has one trainable vector per position, trained along with everything else. BERT learns 512 of them and GPT-2 learns 1,024.

      :::predict GPT-2 has 1,024 learned position vectors. What happens if you feed it 1,500 tokens?
      Positions 1,024 through 1,499 have no row in the table, so there is nothing to add. A learned table sets a hard maximum length, and any new rows would be untrained.
      :::
    bridges:
      - vectors
  - id: positional-encodings.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.positional-encodings
    title: Waves at many speeds
    markdown: |-
      The original transformer computed its tags from a formula instead. Picture a clock: the second hand spins fast, the hour hand crawls, and together they pin down the time. **Sinusoidal positions** give each pair of coordinates its own "hand", a sine and cosine turning at its own speed.

      :::papers Sinusoidal position encoding (Vaswani et al., 2017)
      $$PE_{(pos,\,2i)} = \sin\!\left(\frac{pos}{10000^{2i/d_{\text{model}}}}\right), \qquad PE_{(pos,\,2i+1)} = \cos\!\left(\frac{pos}{10000^{2i/d_{\text{model}}}}\right)$$

      $pos$ is the position and $i$ picks the coordinate pair. With a tiny $d_{\text{model}} = 4$, pair 0 turns at speed 1 and pair 1 at speed $1/10000^{2/4} = 1/100$, so $PE(pos) = [\sin pos,\ \cos pos,\ \sin \tfrac{pos}{100},\ \cos \tfrac{pos}{100}]$.
      :::

      | Position | $\sin pos$ | $\cos pos$ | $\sin(pos/100)$ | $\cos(pos/100)$ |
      | ---: | ---: | ---: | ---: | ---: |
      | 0 | 0 | 1 | 0 | 1 |
      | 1 | 0.841 | 0.540 | 0.010 | 1.000 |
      | 2 | 0.909 | −0.416 | 0.020 | 1.000 |

      The fast pair changes a lot from one position to the next; the slow pair barely moves but keeps counting long after the fast one has wrapped around. The formula gives a vector for any position, with nothing to train. The authors also tried learned positions and got nearly identical results.
  - id: positional-encodings.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.positional-encodings
    title: "RoPE: rotate the query and key"
    markdown: |-
      Additive tags mix position into the content itself. **Rotary position embedding (RoPE)**, from Su and colleagues in 2021, takes a different route: leave the embeddings alone, and in every attention layer *rotate* each query and key by an angle proportional to its position. LLaMA and many later open models use it.

      Rotating a 2-D vector by 90° turns $[x, y]$ into $[-y, x]$; the length stays the same. Say the angle is $\theta = 90°$ per position, and take $q = k = [1, 0]$:

      - Query at position 1 turns 90° to [0, 1]. Key at position 3 turns 270° to [0, −1]. Score: $0 \times 0 + 1 \times (-1) = -1$.
      - Move both two places later, to positions 3 and 5. Query: 270° to [0, −1]. Key: 450°, the same as 90°, to [0, 1]. Score: −1 again.

      The absolute positions changed; the offset (2) didn't, and neither did the score. That's the point of RoPE: the score depends only on *how far apart* two tokens are.

      :::papers Why only the offset survives
      With $R(\alpha)$ the rotation by angle $\alpha$, RoPE scores a query at position $m$ against a key at position $n$ as

      $$\big(R(m\theta)\,q\big) \cdot \big(R(n\theta)\,k\big) = q \cdot R\big((n - m)\theta\big)\,k$$

      because rotating both vectors by $m\theta$ doesn't change the angle between them. In real models each pair of coordinates $i$ gets its own speed $\theta_i = 10000^{-2i/d}$, the same ladder of speeds as the sinusoidal waves.
      :::

      ```python run
      import numpy as np

      def rope(x, pos, base=10000.0):
          """Rotate each pair (x[0],x[1]), (x[2],x[3]), ... by pos * its own angle."""
          d = len(x)
          theta = base ** (-np.arange(0, d, 2) / d)       # one speed per pair
          a = pos * theta
          x1, x2 = x[0::2], x[1::2]
          out = np.empty(d)
          out[0::2] = x1 * np.cos(a) - x2 * np.sin(a)
          out[1::2] = x1 * np.sin(a) + x2 * np.cos(a)
          return out

      rng = np.random.default_rng(0)
      q, k = rng.standard_normal(8), rng.standard_normal(8)
      for m, n in [(2, 5), (10, 13), (100, 103), (7, 7), (7, 8)]:
          score = rope(q, m) @ rope(k, n)
          print(f"query at {m:3d}, key at {n:3d}, offset {n - m}: score = {score:.4f}")
      ```

      The first three pairs are three apart, and all score −1.6284. Try `(1000, 1003)`, then change only one position to see the score move.
    bridges:
      - geometry-and-symmetry
  - id: positional-encodings.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.positional-encodings
    title: Turn both arrows together
    markdown: q=[1,0] and k=[1,0] both rotate ninety degrees to [0,1]. What is their new dot product?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: '1'
        - id: b
          text: '0'
        - id: c
          text: −1
      answer: a
      reveal_markdown: |-
        Both become [0, 1], so the dot product is 0 × 0 + 1 × 1 = 1, the same as before. Turning the query and key by the same angle leaves the angle between them unchanged. That's why RoPE scores depend only on the offset between positions.
      hint: Rotation keeps lengths and, when both arrows turn together, the angle between them.
      id: positional-encodings.practice.v2.7
  - id: positional-encodings.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.positional-encodings
    title: "ALiBi: charge for distance"
    markdown: |-
      The third approach skips position vectors and rotations entirely. **ALiBi** (Attention with Linear Biases; Press, Smith, and Lewis, 2021) subtracts a penalty from each attention score that grows with distance: $\text{score} - s \cdot (i - j)$ for a query at position $i$ and a key at position $j$. Each head gets its own slope $s$, so some heads look far and others stay local.

      With slope $s = 0.5$, a query at position 5 pays nothing to look at itself, 0.5 to look at position 4, and 1.0 to look at position 3. Its paper showed that a model trained on short sequences held up better on longer ones than sinusoidal positions did. BLOOM is one well-known model that uses it.

      | Method | Where position enters | Example |
      | --- | --- | --- |
      | Learned table | Added to embeddings, once | BERT, GPT-2 |
      | Sinusoidal | Added to embeddings, once | 2017 transformer |
      | RoPE | Rotates $q$ and $k$ in every layer | LLaMA |
      | ALiBi | Penalty on scores in every layer | BLOOM |

      :::mixup "The causal mask already tells the model about order."
      A mask decides which positions a token *may* see; it doesn't say *where* they are. Within the allowed set, attention is still an order-blind weighted average: the last word of "dog bites man" and of "bites dog man" sees the same three keys and gets the same output. Causal models can pick up rough position cues indirectly, for instance from how many tokens are visible (Haviv et al., 2022), but most models add explicit positions anyway.
      :::
  - id: positional-encodings.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.positional-encodings
    title: Test order and distance separately
    markdown: |-
      Suppose you're handed a RoPE model trained on 2,048-token documents and asked to read 8,000-token contracts. RoPE will rotate by any angle, but the model has never seen angles that large, and quality usually drops past the training length. Position interpolation (Chen et al., 2023) squeezes the new positions into the trained range, then fine-tunes briefly.

      Then test order and distance separately. For order, swap roles ("the tenant pays the landlord" versus "the landlord pays the tenant") and check that answers flip. For distance, plant a fact early in a contract and ask about it from 1,000, 4,000, and 8,000 tokens away.

      When reading any design, keep three questions apart: *what* is this token (embedding), *where* is it (positions), and *may* this query see it (mask)?
    bridges: []
  - id: positional-encodings.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.positional-encodings
    markdown: Additive position tags and RoPE rotations to compute by hand, with offsets you work out yourself.
    takeaway: |-
      Self-attention alone can't tell word orders apart, so transformers add position: learned or sinusoidal vectors added to embeddings, RoPE rotations that make scores depend on the offset, or ALiBi's distance penalty.
  - id: positional-encodings.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.positional-encodings
    markdown: |-
      Positional methods encode absolute or relative location through embeddings, biases, or rotations; evaluating positions beyond training is not the same as learning to use long context reliably.
