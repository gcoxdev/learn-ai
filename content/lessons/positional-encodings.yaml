assessment_families:
  - id: positional-encodings.base
    objective_ref: objective.positional-encodings
    task: base
    response_type: single_choice
    points: 1
    hint: 'Use several scales of position: trace the inputs, operation, and result before choosing.'
    remediation_scene: positional-encodings.s2
    variants:
      - id: positional-encodings.base.1
        prompt: What information do positional mechanisms add or modify?
        options:
          - id: c
            text: Only the tokenizer’s vocabulary size
          - id: a
            text: Where representations occur relative to a sequence or each other
          - id: b
            text: A guarantee of factual truth
        answer: a
        feedback: Position affects how order can enter the model computation.
        retired: true
      - id: positional-encodings.base.2
        prompt: In a basic RoPE design, which vectors receive position-dependent rotations?
        options:
          - id: a
            text: Queries and keys
          - id: b
            text: Only final class labels
          - id: c
            text: Only optimizer moments
        answer: a
        feedback: Rotating queries and keys makes position affect their attention comparison.
        retired: true
  - id: positional-encodings.transfer
    objective_ref: objective.positional-encodings
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Check extrapolation empirically: trace the inputs, operation, and result before choosing.'
    remediation_scene: positional-encodings.s4
    variants:
      - id: positional-encodings.transfer.1
        prompt: A positional formula evaluates at a longer index than used in training. Is long-context competence established?
        options:
          - id: a
            text: No; model behavior needs evaluation
          - id: b
            text: Yes; numerical evaluation proves comprehension
          - id: c
            text: Only if the index is even
        answer: a
        feedback: Representability of positions and learned use of long context differ.
        retired: true
      - id: positional-encodings.transfer.2
        prompt: A learned absolute position table has 2048 entries. What must be addressed to use new positions directly?
        options:
          - id: b
            text: Only the prompt’s font
          - id: c
            text: A claim that every position already has an entry
          - id: a
            text: The table limit and a justified extension strategy
        answer: a
        feedback: An explicit embedding table does not contain arbitrary unseen indices.
        retired: true
  - id: positional-encodings.base.v2
    objective_ref: objective.positional-encodings
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: An additive position tag is added entry by entry to the content vector, first with first and second with second. The token ID itself never changes.
    remediation_scene: positional-encodings.s2
    variants:
      - prompt: A content vector is [2,3] and its additive position vector is [1,-1]. Record the two coordinates after adding them.
        answers:
          first: 3
          second: 2
        reason_answer: a
        reason_options:
          - id: a
            text: Add matching coordinates without changing the token ID.
          - id: c
            text: Concatenate the two vectors instead of adding.
          - id: b
            text: Use the position index as a multiplier for both coordinates.
        feedback: '2 + 1 = 3 and 3 + (−1) = 2, giving [3, 2]. Concatenating would give a four-entry vector, which is not how additive tags work.'
        id: positional-encodings.base.v2.1
      - prompt: A content vector is [1,4] and its additive position vector is [2,0]. Record the two coordinates after adding them.
        answers:
          first: 3
          second: 4
        reason_answer: a
        reason_options:
          - id: b
            text: Use the position index as a multiplier for both coordinates.
          - id: a
            text: Add matching coordinates without changing the token ID.
          - id: c
            text: Concatenate the two vectors instead of adding.
        feedback: '1 + 2 = 3 and 4 + 0 = 4, giving [3, 4]. Concatenating would give a four-entry vector, which is not how additive tags work.'
        id: positional-encodings.base.v2.2
      - prompt: A content vector is [-1,2] and its additive position vector is [1,3]. Record the two coordinates after adding them.
        answers:
          first: 0
          second: 5
        reason_answer: a
        reason_options:
          - id: a
            text: Add matching coordinates without changing the token ID.
          - id: c
            text: Concatenate the two vectors instead of adding.
          - id: b
            text: Use the position index as a multiplier for both coordinates.
        feedback: '−1 + 1 = 0 and 2 + 3 = 5, giving [0, 5]. Concatenating would give a four-entry vector, which is not how additive tags work.'
        id: positional-encodings.base.v2.3
      - prompt: A content vector is [3,0] and its additive position vector is [-2,1]. Record the two coordinates after adding them.
        answers:
          first: 1
          second: 1
        reason_answer: a
        reason_options:
          - id: b
            text: Use the position index as a multiplier for both coordinates.
          - id: c
            text: Concatenate the two vectors instead of adding.
          - id: a
            text: Add matching coordinates without changing the token ID.
        feedback: '3 + (−2) = 1 and 0 + 1 = 1, giving [1, 1]. Concatenating would give a four-entry vector, which is not how additive tags work.'
        id: positional-encodings.base.v2.4
    numeric_fields:
      - id: first
        label: Combined first coordinate
      - id: second
        label: Combined second coordinate
    absolute_tolerance: 1e-6
  - id: positional-encodings.transfer.v2
    objective_ref: objective.positional-encodings
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: positional-encodings.s3
    variants:
      - prompt: q=[1,0] stays fixed while k=[1,0] rotates to [0,1]. What is their dot product?
        answer: a
        options:
          - id: a
            text: '0'
          - id: b
            text: '1'
          - id: c
            text: '2'
        feedback: The dot product is 1×0+0×1=0, showing a changed relative orientation.
        id: positional-encodings.transfer.v2.1
        retired: true
      - prompt: A positional formula returns vectors for longer sequences. What still needs evidence?
        answer: a
        options:
          - id: b
            text: Whether any vector can be numerically produced
          - id: c
            text: Whether the word position can be indexed
          - id: a
            text: Performance on the intended tasks at those lengths
        feedback: Computability of a position signal does not establish long-context task performance.
        id: positional-encodings.transfer.v2.2
        retired: true
      - prompt: Which job belongs to an attention mask rather than a positional encoding?
        answer: a
        options:
          - id: c
            text: Representing relative distance in a score bias
          - id: a
            text: Blocking a future token from being attended to
          - id: b
            text: Distinguishing locations through added or rotated information
        feedback: Masking controls allowed information flow.
        id: positional-encodings.transfer.v2.3
        retired: true
      - prompt: A rotary design is described as “change token ID 7 into ID 90.” What is wrong?
        answer: a
        options:
          - id: c
            text: Token IDs must be floating-point vectors
          - id: a
            text: The rotations act on representation coordinates, not token identity numbers
          - id: b
            text: Rotary position changes the attention mask rather than representation coordinates
        feedback: A token ID selects an entry; rotation changes specified numerical coordinates in attention.
        id: positional-encodings.transfer.v2.4
        retired: true
  - id: positional-encodings.transfer.v3
    objective_ref: objective.positional-encodings
    task: transfer
    response_type: numeric_fields_with_reason
    points: 1
    hint: 'Work out the offset n − m (key position minus query position). Then rotate only the key by offset × 90° and take its dot product with the unrotated query. A 90° turn sends [x, y] to [−y, x].'
    remediation_scene: positional-encodings.s4
    variants:
      - id: positional-encodings.transfer.v3.1
        prompt: A RoPE toy turns vectors 90° per position. The query q = [1, 0] is at position 2 and the key k = [0, 1] is at position 3. Record the offset n − m and the attention score after both are rotated.
        answers:
          offset: 1
          score: -1
        reason_answer: b
        reason_options:
          - id: a
            text: The angle comes from adding the positions (m + n), so the score depends on both.
          - id: b
            text: Only the offset matters, because rotating both by the same extra angle changes nothing.
          - id: c
            text: Only the key is rotated in RoPE, so the key's own position sets the angle.
        feedback: 'The offset is 3 − 2 = 1, so rotate k by 90°: [0, 1] becomes [−1, 0], and [1, 0] · [−1, 0] = −1. Rotating q by 180° and k by 270° gives the same −1, since the shared 180° cancels.'
      - id: positional-encodings.transfer.v3.2
        prompt: A RoPE toy turns vectors 90° per position. The query q = [1, 0] is at position 5 and the key k = [1, 0] is at position 7. Record the offset n − m and the attention score after both are rotated.
        answers:
          offset: 2
          score: -1
        reason_answer: c
        reason_options:
          - id: a
            text: Only the key is rotated in RoPE, so the key's own position sets the angle.
          - id: b
            text: The angle comes from adding the positions (m + n), so the score depends on both.
          - id: c
            text: Only the offset matters, because rotating both by the same extra angle changes nothing.
        feedback: The offset is 2, a 180° turn, so k becomes [−1, 0] and the score is −1. Positions 1 and 3, or 100 and 102, would give the same −1.
      - id: positional-encodings.transfer.v3.3
        prompt: A RoPE toy turns vectors 90° per position. The query q = [2, 1] and the key k = [1, 1] are both at position 4 (a token attending to itself). Record the offset n − m and the attention score after both are rotated.
        answers:
          offset: 0
          score: 3
        reason_answer: a
        reason_options:
          - id: a
            text: Only the offset matters, because rotating both by the same extra angle changes nothing.
          - id: c
            text: Only the key is rotated in RoPE, so the key's own position sets the angle.
          - id: b
            text: The angle comes from adding the positions (m + n), so the score depends on both.
        feedback: With offset 0 the rotations cancel completely, so the score is the plain dot product 2 × 1 + 1 × 1 = 3, even though each vector turned 360°.
      - id: positional-encodings.transfer.v3.4
        prompt: A RoPE toy turns vectors 90° per position. The query q = [1, 2] is at position 1 and the key k = [2, 0] is at position 4. Record the offset n − m and the attention score after both are rotated.
        answers:
          offset: 3
          score: -4
        reason_answer: b
        reason_options:
          - id: c
            text: The angle comes from adding the positions (m + n), so the score depends on both.
          - id: b
            text: Only the offset matters, because rotating both by the same extra angle changes nothing.
          - id: a
            text: Only the key is rotated in RoPE, so the key's own position sets the angle.
        feedback: The offset is 3, a 270° turn, which sends [x, y] to [y, −x], so k becomes [0, −2]. The score is 1 × 0 + 2 × (−2) = −4.
      - id: positional-encodings.transfer.v3.5
        prompt: A RoPE toy turns vectors 90° per position. The query q = [0, 1] is at position 10 and the key k = [1, 0] is at position 11. Record the offset n − m and the attention score after both are rotated.
        answers:
          offset: 1
          score: 1
        reason_answer: c
        reason_options:
          - id: b
            text: Only the key is rotated in RoPE, so the key's own position sets the angle.
          - id: a
            text: The angle comes from adding the positions (m + n), so the score depends on both.
          - id: c
            text: Only the offset matters, because rotating both by the same extra angle changes nothing.
        feedback: 'The offset is 1, so rotate k by 90°: [1, 0] becomes [0, 1], and [0, 1] · [0, 1] = 1. Before rotation the score was 0; one position of offset lines the two up.'
    numeric_fields:
      - id: offset
        label: Offset n − m
      - id: score
        label: Score after rotation
    absolute_tolerance: 0.001
