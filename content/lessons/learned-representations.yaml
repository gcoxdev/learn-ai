assessment_families:
  - id: learned-representations.base
    objective_ref: objective.learned-representations
    task: base
    response_type: single_choice
    points: 1
    hint: 'Reuse a representation: trace the inputs, operation, and result before choosing.'
    remediation_scene: learned-representations.s2
    variants:
      - id: learned-representations.base.1
        prompt: Does one hidden coordinate necessarily correspond to one named human concept?
        options:
          - id: a
            text: 'No'
          - id: b
            text: Yes; every coordinate has a fixed dictionary entry
          - id: c
            text: Only in a large network
        answer: a
        retired: true
        feedback: Representations can be distributed and dependent on parameterization.
      - id: learned-representations.base.2
        prompt: What does freezing an encoder do during adaptation?
        options:
          - id: b
            text: Deletes its outputs
          - id: c
            text: Guarantees no domain mismatch
          - id: a
            text: Keeps its parameters fixed while other selected parts train
        answer: a
        retired: true
        feedback: Freezing preserves parameters but does not guarantee task suitability.
  - id: learned-representations.transfer
    objective_ref: objective.learned-representations
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Test claims with more than one lens: trace the inputs, operation, and result before choosing.'
    remediation_scene: learned-representations.s4
    variants:
      - id: learned-representations.transfer.1
        prompt: A probe decodes a property from activations. What remains unproven?
        options:
          - id: b
            text: That any information was decodable
          - id: c
            text: That the probe was trained
          - id: a
            text: That the original model used the property causally for its answer
        answer: a
        retired: true
        feedback: Decodability is not the same as causal use.
      - id: learned-representations.transfer.2
        prompt: Fine-tuning improves a new task but harms an old one. What should evaluation include?
        options:
          - id: c
            text: A claim that old behavior never mattered
          - id: a
            text: Capability retention and the adaptation tradeoff
          - id: b
            text: Only the improved task
        answer: a
        retired: true
        feedback: Adaptation can alter shared representations and existing capabilities.
  - id: learned-representations.base.v2
    objective_ref: objective.learned-representations
    task: base
    response_type: single_choice
    points: 1
    hint: Ask what each experiment can show. A probe shows information can be read out of a layer; an intervention changes a feature and watches the output; a frozen encoder limits what any new head can use.
    remediation_scene: learned-representations.s3
    variants:
      - id: learned-representations.base.v2.1
        prompt: A linear probe trained on a speech model's hidden layer predicts the speaker's accent with 92% accuracy. What does this result show?
        options:
          - id: b
            text: The model relies on accent to transcribe speech
          - id: a
            text: Accent information can be read out of that layer
          - id: c
            text: One neuron in that layer is dedicated to accent
          - id: d
            text: The model was originally trained to detect accent
        answer: a
        feedback: A probe measures what is decodable, so accent is present in the layer. Whether the transcription depends on it needs an intervention, and the information can be spread across many units rather than sitting in one neuron.
      - id: learned-representations.base.v2.2
        prompt: In a bird classifier, you erase the hidden direction that best predicts "water in the background." Its confidence in "duck" on duck photos falls from 0.90 to 0.40. What does this suggest?
        options:
          - id: c
            text: The water probe was trained on the wrong layer
          - id: d
            text: Background information was absent from that layer
          - id: a
            text: The model leans on the background to decide "duck"
          - id: b
            text: The model can no longer see the shape of the duck
        answer: a
        feedback: This is an intervention, and removing the water signal changed the output a lot, so the model was using it, a likely shortcut. The information was clearly present (the probe found it), and nothing about the duck's shape was edited.
      - id: learned-representations.base.v2.3
        prompt: You freeze a pretrained encoder that outputs 2,048 features and train only a new linear head for 5 classes, with a bias per class. How many parameters does training change?
        options:
          - id: d
            text: '10,240'
          - id: b
            text: '2,053'
          - id: c
            text: About 25 million
          - id: a
            text: '10,245'
        answer: a
        feedback: The head has 2,048 × 5 = 10,240 weights plus 5 biases, 10,245 in all. The frozen encoder's millions of weights don't change, and 10,240 forgets the biases.
      - id: learned-representations.base.v2.4
        prompt: With the staircase network's hidden layer frozen, a new head can learn XOR, AND, and OR but not "is the bottom switch up?" Why not?
        options:
          - id: b
            text: That task needs a nonlinear head, and this head is linear
          - id: a
            text: The frozen features give (1, 0) and (0, 1) the same values
          - id: c
            text: The head has too few parameters to learn a fourth task
          - id: d
            text: Least squares cannot fit targets that are exactly 0 or 1
        answer: a
        feedback: Both inputs map to h = [1, 0], so no head of any kind can separate them; the information was discarded upstream. A nonlinear or bigger head would face the same identical inputs, and least squares fits 0/1 targets fine for the other three tasks.
  - id: learned-representations.transfer.v2
    objective_ref: objective.learned-representations
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name the kind of feature or failure first (general, shortcut, memorized, mixed, or overwritten), then choose the test or reuse plan that fits it.
    remediation_scene: learned-representations.s4
    variants:
      - id: learned-representations.transfer.v2.1
        prompt: A sentiment model is fine-tuned on product reviews. Accuracy there rises from 85% to 93%, but on movie reviews, where it was strong, it drops from 90% to 70%. What is the best explanation?
        options:
          - id: a
            text: Fine-tuning overwrote features the movie task relied on
          - id: b
            text: The product reviews were mislabeled during fine-tuning
          - id: c
            text: The model memorized the movie reviews it saw earlier
          - id: d
            text: The learning rate was too low for the new review task
        answer: a
        feedback: Fine-tuning changes the shared encoder, which can erase what older tasks depended on, so always re-test old tasks after adapting. Mislabeled data or a low rate would hurt the new task, which actually improved.
      - id: learned-representations.transfer.v2.2
        prompt: A probe identifies which hospital each chest X-ray came from with 99% accuracy, using the diagnosis model's hidden features. What is the most useful next step?
        options:
          - id: b
            text: Conclude the model diagnoses by hospital and discard it
          - id: c
            text: Conclude it's harmless, since the probe is a separate model
          - id: a
            text: Mask the site markers and test the model at a new hospital
          - id: d
            text: Retrain the probe on a deeper layer to raise its accuracy
        answer: a
        feedback: The probe shows hospital identity is present, not that the diagnosis uses it. Masking the markers (an intervention) and testing at an unseen hospital show whether predictions depend on it. Jumping to either conclusion skips that test.
      - id: learned-representations.transfer.v2.3
        prompt: A clinic has 300 labeled photos of a rare plant disease and a model pretrained on millions of everyday photos. Which plan is the sensible starting point?
        options:
          - id: c
            text: Train a new network from random weights on the 300 photos
          - id: a
            text: Freeze the pretrained encoder and train a small new head
          - id: b
            text: Fine-tune every layer at a high rate on the 300 photos
          - id: d
            text: Use the pretrained model's everyday labels unchanged
        answer: a
        feedback: With little data, reuse general features and fit only a small head, which has few parameters to overfit. Training from scratch wastes the pretrained features, aggressive fine-tuning can wreck them, and the old labels don't include the disease.
      - id: learned-representations.transfer.v2.4
        prompt: A text model, given the start of one customer's support ticket, completes it with that customer's phone number word for word. What kind of learned feature is this?
        options:
          - id: d
            text: A shortcut that happens to track the label
          - id: b
            text: A general feature that transfers well
          - id: c
            text: A nuisance feature such as a background
          - id: a
            text: A memorized detail of a training example
        answer: a
        feedback: Reproducing a specific training example exactly is memorization, and it's a privacy risk. A shortcut would be a feature correlated with a label, and a general feature would help on new inputs, not recite old ones.
      - id: learned-representations.transfer.v2.5
        prompt: A unit in a vision model fires for cat faces, car fronts, and printed text. A teammate says the network must be broken. What is the best reply?
        options:
          - id: b
            text: Units should detect one concept each, so retrain the model
          - id: a
            text: Units often mix several features, which is normal in networks
          - id: c
            text: The unit is dead and should be pruned from the network
          - id: d
            text: It proves the model memorized its training images exactly
        answer: a
        feedback: Training doesn't give units one tidy concept each, and a single unit responding to several unrelated things is common. A dead unit never fires at all, and mixed responses say nothing about memorization.
