schema_version: 0.2-draft
lesson:
  id: learned-representations
  version: 0.3.0-draft
  title: What can a network’s hidden features tell us?
  state: draft
  summary: Investigate what information a network stores internally and whether it actually uses that information.
  slot: M11.8
  category: learning
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.learned-representations
  version: 1-draft
  statement: Hidden representations can transfer across tasks and also encode shortcuts or memorized details;
    probes and interventions provide different evidence about what the network uses.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - learned-representations.base
  - learned-representations.transfer
  prerequisites:
  - anyOf:
    - objective.neural-training-loop
  - anyOf:
    - objective.self-supervised-representations
scenes:
- id: learned-representations.s1
  title: Look at the numbers between layers
  type: explanation
  depth: intuition
  objective_refs:
  - objective.learned-representations
  markdown: 'A **hidden vector** is the list of values at an intermediate layer. In an image model, it may
    carry information about both the object and its background. Training encourages useful predictions, but
    does not label each coordinate with a human concept.


    Some information may be a **nuisance**: a difference irrelevant to the intended task, such as camera tint
    when identifying a shape. Other features may reflect shortcuts or specific training examples. Even models
    with similar predictions can organize their internal values differently.'
  text_mode: 'A **hidden vector** is the list of values at an intermediate layer. In an image model, it may
    carry information about both the object and its background. Training encourages useful predictions, but
    does not label each coordinate with a human concept.


    Some information may be a **nuisance**: a difference irrelevant to the intended task, such as camera tint
    when identifying a shape. Other features may reflect shortcuts or specific training examples. Even models
    with similar predictions can organize their internal values differently.'
  bridges: []
- id: learned-representations.s2
  title: Reuse the features for another task
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.learned-representations
  markdown: 'An **encoder** turns an input into a representation. A **head** is the final task-specific calculation
    that turns that representation into an answer. To recognize flowers, we might keep a photo encoder’s weights
    fixed and train a new head on its outputs.


    This **freezing** preserves the encoder and can reduce training work. **Fine-tuning** instead allows some
    or all of its weights to change for the new task. It may improve flower recognition while overwriting another
    useful capability. Evaluate both what should improve and what should remain.'
  text_mode: 'An **encoder** turns an input into a representation. A **head** is the final task-specific calculation
    that turns that representation into an answer. To recognize flowers, we might keep a photo encoder’s weights
    fixed and train a new head on its outputs.


    This **freezing** preserves the encoder and can reduce training work. **Fine-tuning** instead allows some
    or all of its weights to change for the new task. It may improve flower recognition while overwriting another
    useful capability. Evaluate both what should improve and what should remain.'
  bridges: []
- id: learned-representations.s3
  title: Probe versus intervene
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.learned-representations
  markdown: 'A probe trains a predictor on hidden features to see whether information is decodable. Successful
    decoding does not prove the original network used that information for its output. An intervention that
    changes an activation and measures the resulting behavior asks a more causal question, but can introduce
    unrealistic states.


    Suppose a probe can recover whether the sky was blue from hidden features. The network might still base
    its boat prediction on shape alone. To test use, alter the relevant internal signal or compare controlled
    inputs and measure the output change. But an unrealistic internal edit can disrupt many features at once,
    so it needs controls.'
  text_mode: 'A probe trains a predictor on hidden features to see whether information is decodable. Successful
    decoding does not prove the original network used that information for its output. An intervention that
    changes an activation and measures the resulting behavior asks a more causal question, but can introduce
    unrealistic states.


    Suppose a probe can recover whether the sky was blue from hidden features. The network might still base
    its boat prediction on shape alone. To test use, alter the relevant internal signal or compare controlled
    inputs and measure the output change. But an unrealistic internal edit can disrupt many features at once,
    so it needs controls.'
  bridges: []
- id: learned-representations.s4
  title: Test claims with more than one lens
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.learned-representations
  markdown: Use held-out transfer tasks, controlled counterexamples, memorization tests, and carefully designed
    interventions. A colorful feature visualization or nearest-neighbor list can suggest hypotheses, not settle
    them. State which layer, data, and intervention support the interpretation.
  text_mode: Use held-out transfer tasks, controlled counterexamples, memorization tests, and carefully designed
    interventions. A colorful feature visualization or nearest-neighbor list can suggest hypotheses, not settle
    them. State which layer, data, and intervention support the interpretation.
  bridges: []
- id: learned-representations.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.learned-representations
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Hidden features may contain useful clues, shortcuts, or memorized details. A probe shows what can
    be recovered from them; testing whether the model uses those clues requires a different experiment.
- id: learned-representations.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.learned-representations
