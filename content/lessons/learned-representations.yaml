schema_version: 0.2-draft
lesson:
  id: learned-representations
  version: 0.1.0-draft
  title: What can a network’s hidden features tell us?
  state: draft
  summary: Hidden representations can transfer across tasks and also encode shortcuts or memorized details; probes
    and interventions provide different evidence about what the network uses.
  slot: M11.8
  category: learning
  minutes: 12
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.learned-representations
  version: 1-draft
  statement: Hidden representations can transfer across tasks and also encode shortcuts or memorized details; probes
    and interventions provide different evidence about what the network uses.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - learned-representations.base
  - learned-representations.transfer
  prerequisites:
  - anyOf:
    - objective.neural-training-loop
  - anyOf:
    - objective.self-supervised-representations
scenes:
- id: learned-representations.s1
  title: A hidden vector serves the training objective
  type: explanation
  depth: intuition
  objective_refs:
  - objective.learned-representations
  markdown: A network transforms input into features that help reduce its loss. Those features can reflect useful
    patterns, nuisance correlations, or particular training examples. A coordinate is not automatically a human-readable
    concept. Different parameterizations can implement similar predictive behavior.
  text_mode: A network transforms input into features that help reduce its loss. Those features can reflect useful
    patterns, nuisance correlations, or particular training examples. A coordinate is not automatically a human-readable
    concept. Different parameterizations can implement similar predictive behavior.
  bridges: []
- id: learned-representations.s2
  title: Reuse a representation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.learned-representations
  markdown: Transfer learning can freeze an encoder and fit a new head, or fine-tune some or all weights on a target
    task. Freezing is cheaper and preserves existing features, while fine-tuning can adapt them and also overwrite
    useful behavior. Evaluate both target improvement and any capabilities that need to remain.
  text_mode: Transfer learning can freeze an encoder and fit a new head, or fine-tune some or all weights on a target
    task. Freezing is cheaper and preserves existing features, while fine-tuning can adapt them and also overwrite
    useful behavior. Evaluate both target improvement and any capabilities that need to remain.
  bridges: []
- id: learned-representations.s3
  title: Probe versus intervene
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.learned-representations
  markdown: A probe trains a predictor on hidden features to see whether information is decodable. Successful decoding
    does not prove the original network used that information for its output. An intervention that changes an activation
    and measures the resulting behavior asks a more causal question, but can introduce unrealistic states.
  text_mode: A probe trains a predictor on hidden features to see whether information is decodable. Successful decoding
    does not prove the original network used that information for its output. An intervention that changes an activation
    and measures the resulting behavior asks a more causal question, but can introduce unrealistic states.
  bridges: []
- id: learned-representations.s4
  title: Test claims with more than one lens
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.learned-representations
  markdown: Use held-out transfer tasks, controlled counterexamples, memorization tests, and carefully designed
    interventions. A colorful feature visualization or nearest-neighbor list can suggest hypotheses, not settle
    them. State which layer, data, and intervention support the interpretation.
  text_mode: Use held-out transfer tasks, controlled counterexamples, memorization tests, and carefully designed
    interventions. A colorful feature visualization or nearest-neighbor list can suggest hypotheses, not settle
    them. State which layer, data, and intervention support the interpretation.
  bridges: []
- id: learned-representations.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.learned-representations
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: learned-representations.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.learned-representations
  markdown: Hidden representations can transfer across tasks and also encode shortcuts or memorized details; probes
    and interventions provide different evidence about what the network uses.
  text_mode: Hidden representations can transfer across tasks and also encode shortcuts or memorized details; probes
    and interventions provide different evidence about what the network uses.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - learned-representations.s1
    - learned-representations.s2
    - learned-representations.s3
    - learned-representations.s4
    - learned-representations.check
    - learned-representations.recap
    gate_refs:
    - gate.core
assessment_families:
- id: learned-representations.base
  objective_ref: objective.learned-representations
  task: base
  response_type: single_choice
  points: 1
  hint: 'Reuse a representation: trace the inputs, operation, and result before choosing.'
  remediation_scene: learned-representations.s2
  variants:
  - id: learned-representations.base.1
    prompt: Does one hidden coordinate necessarily correspond to one named human concept?
    options:
    - id: a
      text: 'No'
    - id: b
      text: Yes; every coordinate has a fixed dictionary entry
    - id: c
      text: Only in a large network
    answer: a
    feedback: Representations can be distributed and dependent on parameterization.
  - id: learned-representations.base.2
    prompt: What does freezing an encoder do during adaptation?
    options:
    - id: b
      text: Deletes its outputs
    - id: c
      text: Guarantees no domain mismatch
    - id: a
      text: Keeps its parameters fixed while other selected parts train
    answer: a
    feedback: Freezing preserves parameters but does not guarantee task suitability.
- id: learned-representations.transfer
  objective_ref: objective.learned-representations
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Test claims with more than one lens: trace the inputs, operation, and result before choosing.'
  remediation_scene: learned-representations.s4
  variants:
  - id: learned-representations.transfer.1
    prompt: A probe decodes a property from activations. What remains unproven?
    options:
    - id: b
      text: That any information was decodable
    - id: c
      text: That the probe was trained
    - id: a
      text: That the original model used the property causally for its answer
    answer: a
    feedback: Decodability is not the same as causal use.
  - id: learned-representations.transfer.2
    prompt: Fine-tuning improves a new task but harms an old one. What should evaluation include?
    options:
    - id: c
      text: A claim that old behavior never mattered
    - id: a
      text: Capability retention and the adaptation tradeoff
    - id: b
      text: Only the improved task
    answer: a
    feedback: Adaptation can alter shared representations and existing capabilities.
