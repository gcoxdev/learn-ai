assessment_families:
  - id: digital-representations.base
    objective_ref: objective.digital-representations
    task: base
    response_type: single_choice
    points: 1
    hint: 'Represent different kinds of signals: trace the inputs, operation, and result before choosing.'
    remediation_scene: digital-representations.s2
    variants:
      - id: digital-representations.base.1
        prompt: A 3 × 2 RGB image stores how many channel values?
        options:
          - id: a
            text: '18'
          - id: b
            text: '6'
          - id: c
            text: '9'
        answer: a
        feedback: Six pixels times three channels gives eighteen values.
        retired: true
      - id: digital-representations.base.2
        prompt: Do bits alone specify whether data is text or sound?
        options:
          - id: b
            text: Yes; every byte has one universal meaning
          - id: c
            text: Only if the file is large
          - id: a
            text: No; encoding and format conventions are needed
        answer: a
        feedback: The interpretation depends on the agreed representation.
        retired: true
  - id: digital-representations.transfer
    objective_ref: objective.digital-representations
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Avoid confusing encoding with understanding: trace the inputs, operation, and result before choosing.'
    remediation_scene: digital-representations.s4
    variants:
      - id: digital-representations.transfer.1
        prompt: Image width and height both double. With fixed channels, how does raw value count change?
        options:
          - id: b
            text: It doubles
          - id: c
            text: It stays constant
          - id: a
            text: It quadruples
        answer: a
        feedback: The number of pixels multiplies the two dimensions.
        retired: true
      - id: digital-representations.transfer.2
        prompt: A text pipeline decodes bytes using the wrong encoding. Where should diagnosis begin?
        options:
          - id: c
            text: By adding an output token
          - id: a
            text: At the input representation and decoding step
          - id: b
            text: By assuming the optimizer failed
        answer: a
        feedback: Representation errors can occur before the model runs.
        retired: true
  - id: digital-representations.base.v2
    objective_ref: objective.digital-representations
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: digital-representations.s4
    variants:
      - prompt: A raw image is 3 pixels wide and 2 high, with 3 channels and 1 bytes per channel. Count its pixels, channel values, and raw bytes.
        answers:
          pixels: 6
          values: 18
          bytes: 18
        reason_answer: a
        reason_options:
          - id: a
            text: Multiply width by height, then channels, then bytes per channel.
          - id: b
            text: Add width and height before multiplying by channels.
          - id: c
            text: Count one byte per pixel, regardless of channels.
        feedback: 3 × 2 = 6 pixels; × 3 = 18 values; × 1 = 18 bytes. Metadata is excluded.
        id: digital-representations.base.v2.1
        retired: true
      - prompt: A raw image is 4 pixels wide and 2 high, with 1 channels and 2 bytes per channel. Count its pixels, channel values, and raw bytes.
        answers:
          pixels: 8
          values: 8
          bytes: 16
        reason_answer: a
        reason_options:
          - id: b
            text: Add width and height before multiplying by channels.
          - id: c
            text: Count one byte per pixel, regardless of channels.
          - id: a
            text: Multiply width by height, then channels, then bytes per channel.
        feedback: 4 × 2 = 8 pixels; × 1 = 8 values; × 2 = 16 bytes. Metadata is excluded.
        id: digital-representations.base.v2.2
        retired: true
      - prompt: A raw image is 2 pixels wide and 3 high, with 3 channels and 2 bytes per channel. Count its pixels, channel values, and raw bytes.
        answers:
          pixels: 6
          values: 18
          bytes: 36
        reason_answer: a
        reason_options:
          - id: c
            text: Count one byte per pixel, regardless of channels.
          - id: a
            text: Multiply width by height, then channels, then bytes per channel.
          - id: b
            text: Add width and height before multiplying by channels.
        feedback: 2 × 3 = 6 pixels; × 3 = 18 values; × 2 = 36 bytes. Metadata is excluded.
        id: digital-representations.base.v2.3
        retired: true
      - prompt: A raw image is 5 pixels wide and 2 high, with 1 channels and 1 bytes per channel. Count its pixels, channel values, and raw bytes.
        answers:
          pixels: 10
          values: 10
          bytes: 10
        reason_answer: a
        reason_options:
          - id: a
            text: Multiply width by height, then channels, then bytes per channel.
          - id: b
            text: Add width and height before multiplying by channels.
          - id: c
            text: Count one byte per pixel, regardless of channels.
        feedback: 5 × 2 = 10 pixels; × 1 = 10 values; × 1 = 10 bytes. Metadata is excluded.
        id: digital-representations.base.v2.4
        retired: true
    numeric_fields:
      - id: pixels
        label: Pixels
      - id: values
        label: Channel values
      - id: bytes
        label: Raw bytes
    absolute_tolerance: 1e-6
  - id: digital-representations.transfer.v2
    objective_ref: objective.digital-representations
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: digital-representations.s6
    variants:
      - prompt: The numbers [0, 1, 1, 0] are displayed as one row instead of a 2-by-2 grid. What changed?
        answer: a
        options:
          - id: a
            text: The shape used to interpret the values.
          - id: b
            text: The number of values stored.
          - id: c
            text: The values themselves were retrained.
        feedback: The same four values can have different spatial arrangements.
        id: digital-representations.transfer.v2.1
        retired: true
      - prompt: A recording uses the same samples but doubles the playback sample rate. What happens to its duration?
        answer: a
        options:
          - id: b
            text: It becomes twice as long.
          - id: c
            text: It stays the same because the values are unchanged.
          - id: a
            text: It becomes half as long.
        feedback: Duration is sample count divided by samples per second.
        id: digital-representations.transfer.v2.2
        retired: true
      - prompt: A raw RGB array needs 18 bytes in our one-byte-per-channel format. Must its saved image file be 18 bytes?
        answer: a
        options:
          - id: c
            text: No; each pixel adds exactly one extra byte.
          - id: a
            text: No; metadata and compression can change the file size.
          - id: b
            text: Yes; the file contains precisely the raw channel array.
        feedback: The raw array calculation leaves out the file format and compression.
        id: digital-representations.transfer.v2.3
        retired: true
      - prompt: A UTF-8 text file looks corrupted when read using a different encoding. What should you check first?
        answer: a
        options:
          - id: a
            text: Whether the decoding convention matches the file.
          - id: b
            text: Whether the text model needs more training.
          - id: c
            text: Whether every character was stored in one byte.
        feedback: Decode the bytes correctly before judging later model behavior.
        id: digital-representations.transfer.v2.4
        retired: true
  - id: digital-representations.base.v3
    objective_ref: objective.digital-representations
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Pixels come from width × height. Each pixel holds one value per channel, and each value takes a fixed number of bytes.
    remediation_scene: digital-representations.s4
    numeric_fields:
      - id: pixels
        label: Pixels
      - id: values
        label: Channel values
      - id: bytes
        label: Raw bytes
    absolute_tolerance: 1e-6
    variants:
      - id: digital-representations.base.v3.1
        prompt: A raw RGB image is 3 pixels wide and 2 pixels high, with 1 byte per channel. Count its pixels, channel values, and raw bytes.
        answers:
          pixels: 6
          values: 18
          bytes: 18
        reason_answer: b
        reason_options:
          - id: a
            text: Add width and height for the pixels, then multiply by channels.
          - id: b
            text: Multiply width by height, then by channels, then by bytes per value.
          - id: c
            text: Store one byte per pixel, whatever the number of channels.
        feedback: 3 × 2 = 6 pixels; 6 × 3 channels = 18 values; 18 × 1 byte = 18 bytes. Adding 3 + 2 would give 5 pixels, but a 3-by-2 grid has 6 squares.
      - id: digital-representations.base.v3.2
        prompt: A grayscale image (1 channel) is 4 pixels wide and 4 pixels high, with 1 byte per channel. Count its pixels, channel values, and raw bytes.
        answers:
          pixels: 16
          values: 16
          bytes: 16
        reason_answer: c
        reason_options:
          - id: a
            text: Use three channels, since pictures are stored as RGB.
          - id: b
            text: Add width and height for the pixels, then multiply by channels.
          - id: c
            text: Multiply width by height, then by channels, then by bytes per value.
        feedback: 4 × 4 = 16 pixels; with one channel that's 16 values and 16 bytes. Grayscale stores a single brightness per pixel, so assuming three RGB channels would triple the count.
      - id: digital-representations.base.v3.3
        prompt: A raw RGB image is 2 pixels wide and 3 pixels high, with 2 bytes per channel for finer shades. Count its pixels, channel values, and raw bytes.
        answers:
          pixels: 6
          values: 18
          bytes: 36
        reason_answer: a
        reason_options:
          - id: a
            text: Multiply width by height, then by channels, then by bytes per value.
          - id: b
            text: Stop at the channel values, since each value is one byte.
          - id: c
            text: Add width and height for the pixels, then multiply by channels.
        feedback: 2 × 3 = 6 pixels; × 3 channels = 18 values; × 2 bytes = 36 bytes. Stopping at 18 forgets that each value now takes two bytes.
      - id: digital-representations.base.v3.4
        prompt: An image with 4 channels (red, green, blue, and transparency) is 5 pixels wide and 2 pixels high, with 1 byte per channel. Count its pixels, channel values, and raw bytes.
        answers:
          pixels: 10
          values: 40
          bytes: 40
        reason_answer: b
        reason_options:
          - id: a
            text: Use three channels, since the color part is still RGB.
          - id: b
            text: Multiply width by height, then by channels, then by bytes per value.
          - id: c
            text: Store one byte per pixel, whatever the number of channels.
        feedback: 5 × 2 = 10 pixels; × 4 channels = 40 values; × 1 byte = 40 bytes. The transparency amount is a fourth stored value in every pixel, so it counts as a channel.
      - id: digital-representations.base.v3.5
        prompt: A raw RGB icon is 10 pixels wide and 10 pixels high, with 1 byte per channel. Count its pixels, channel values, and raw bytes.
        answers:
          pixels: 100
          values: 300
          bytes: 300
        reason_answer: c
        reason_options:
          - id: a
            text: Add width and height for the pixels, then multiply by channels.
          - id: b
            text: Store one byte per pixel, whatever the number of channels.
          - id: c
            text: Multiply width by height, then by channels, then by bytes per value.
        feedback: 10 × 10 = 100 pixels; × 3 channels = 300 values; × 1 byte = 300 bytes. Adding 10 + 10 would give only 20 pixels, far fewer than the 100 squares in the grid.
  - id: digital-representations.transfer.v3
    objective_ref: objective.digital-representations
    task: transfer
    response_type: single_choice
    points: 1
    hint: The stored bits rarely change on their own. Ask which reading agreement (width, codebook, channel order, or sample rate) was used, and whether it matches the file.
    remediation_scene: digital-representations.s6
    variants:
      - id: digital-representations.transfer.v3.1
        prompt: A class list saved from one program shows the name "José" as "JosÃ©" when opened in another. What most likely happened?
        options:
          - id: a
            text: The é needs two bytes, so the file ran out of room for it
          - id: b
            text: The file lost the accent when it was saved and added junk
          - id: c
            text: The UTF-8 bytes were read with a one-byte-per-letter codebook
        answer: c
        feedback: é is stored in UTF-8 as two bytes; a codebook that treats each byte as its own letter shows them as "Ã©". The bytes are fine, so nothing was lost or cut off. Opening the file as UTF-8 shows "José" again.
      - id: digital-representations.transfer.v3.2
        prompt: A 1-second recording holds 44,100 samples. A program plays it as if the sample rate were 22,050 samples per second. What do you hear?
        options:
          - id: a
            text: A 2-second recording that sounds slower and lower
          - id: b
            text: A half-second recording that sounds faster and higher
          - id: c
            text: The same 1-second recording, since the samples are unchanged
        answer: a
        feedback: Duration is samples ÷ sample rate, so 44,100 ÷ 22,050 = 2 seconds, and every wiggle is stretched out, so it sounds lower. Halving the rate slows playback; doubling it would give the chipmunk effect.
      - id: digital-representations.transfer.v3.3
        prompt: A model trained on fruit photos suddenly calls every red strawberry "blueberry" after the team switches image libraries. What should they check first?
        options:
          - id: b
            text: Collect more strawberry photos and retrain the model
          - id: c
            text: Print one strawberry pixel and check the channel order
          - id: a
            text: Replace the model with a larger one that sees more detail
        answer: c
        feedback: A sudden failure right after a library change points to how the files are read, such as red and blue channels being swapped. Printing one known pixel checks that in a minute; retraining or a bigger model would try to fix the model when the input is what changed.
      - id: digital-representations.transfer.v3.4
        prompt: 'Sam says: "My 4,000 × 3,000 photo should need 36 million bytes of RGB values, but the file is only 4 MB. My math must be wrong." What is the best reply?'
        options:
          - id: b
            text: Your count is right for the raw values; the file is compressed
          - id: a
            text: Phones store one byte per pixel, so the real raw count is lower
          - id: c
            text: Width and height should be added, which gives a far smaller count
        answer: b
        feedback: 4,000 × 3,000 × 3 = 36,000,000 raw values, one byte each. Photo files use compression to store nearly the same picture in far fewer bytes, plus a little metadata. Color photos do keep three channel values per pixel, not one.
      - id: digital-representations.transfer.v3.5
        prompt: Two programs load the same stored values [1, 1, 0, 0], with 1 meaning white. One shows a white top row over a black bottom row; the other shows a single row of four pixels. What differs?
        options:
          - id: a
            text: The color agreement, since one reads 1 as black
          - id: b
            text: The stored values, since the second program changed them
          - id: c
            text: The width used to arrange the same four values
        answer: c
        feedback: The first reads two values per row, the second reads four per row. The values and the color agreement are identical in both; only the arrangement changed.
      - id: digital-representations.transfer.v3.6
        prompt: A file contains the byte 01000001. What can you say about what it means?
        options:
          - id: a
            text: It is 65 as a number or A as text, depending on the format
          - id: b
            text: It is the letter A, because that is its Unicode code
          - id: c
            text: It is the number 65, and text is stored some other way
        answer: a
        feedback: The same eight bits can be read as the number 65, the letter A, or a pixel's brightness. Only the file's format, the agreement about how to read it, decides which.
