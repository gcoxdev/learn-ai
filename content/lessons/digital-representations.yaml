scenes:
- id: digital-representations.s1
  title: Bits need an interpretation
  type: explanation
  depth: intuition
  objective_refs:
  - objective.digital-representations
  markdown: A bit is a binary value, commonly written 0 or 1. Eight bits form a byte. The same bit pattern can be
    interpreted as a number, part of a character, or part of a file format. Meaning comes from an encoding convention
    and the program using it.
  text_mode: A bit is a binary value, commonly written 0 or 1. Eight bits form a byte. The same bit pattern can
    be interpreted as a number, part of a character, or part of a file format. Meaning comes from an encoding convention
    and the program using it.
  bridges: []
- id: digital-representations.s2
  title: Represent different kinds of signals
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.digital-representations
  markdown: Text encodings map characters to code points and bytes. An image can store a grid of color-channel values.
    Audio samples record a signal’s amplitude at regular times. Structured records attach fields such as date, category,
    or measurement to an example. Each representation loses some aspects of the original world.
  text_mode: Text encodings map characters to code points and bytes. An image can store a grid of color-channel
    values. Audio samples record a signal’s amplitude at regular times. Structured records attach fields such as
    date, category, or measurement to an example. Each representation loses some aspects of the original world.
  bridges: []
- id: digital-representations.s3
  title: Count a tiny image
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.digital-representations
  markdown: 'A 2 × 2 RGB image has four pixels and three channels per pixel: twelve channel values. If each value
    uses one byte, the raw pixel array needs twelve bytes, excluding metadata or compression. Doubling both width
    and height quadruples this raw pixel count; color channels still multiply the total.'
  text_mode: 'A 2 × 2 RGB image has four pixels and three channels per pixel: twelve channel values. If each value
    uses one byte, the raw pixel array needs twelve bytes, excluding metadata or compression. Doubling both width
    and height quadruples this raw pixel count; color channels still multiply the total.'
  bridges: []
- id: digital-representations.s4
  title: Avoid confusing encoding with understanding
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.digital-representations
  markdown: A tokenizer may turn text bytes into token IDs, and a network may turn those IDs into vectors. Neither
    step alone proves semantic understanding. Check units, resolution, missing fields, and encoding errors before
    interpreting a model’s output. Garbage introduced during decoding can look like a learning failure later.
  text_mode: A tokenizer may turn text bytes into token IDs, and a network may turn those IDs into vectors. Neither
    step alone proves semantic understanding. Check units, resolution, missing fields, and encoding errors before
    interpreting a model’s output. Garbage introduced during decoding can look like a learning failure later.
  bridges: []
