scenes:
  - id: digital-representations.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.digital-representations
    title: Eight switches make a byte
    markdown: |-
      Every photo on your phone, every message you send, and every song you stream is stored as long rows of 0s and 1s. So how does your phone know that one row is a selfie and another is a text?

      Start with a row of light switches. Each switch is either off or on. One on/off value is a **bit** (short for *binary digit*), written 0 or 1. Eight bits in a row make a **byte**.

      :::predict How many different on/off patterns can a row of eight switches show?
      Each new switch doubles the count. One switch gives 2 patterns, two give 4, three give 8, and eight give 2 × 2 × 2 × 2 × 2 × 2 × 2 × 2 = 256. That's why one byte usually holds a whole number from 0 to 255.
      :::

      Here's the twist. The byte `01000001` is the number 65 read as a number, the letter A read as text, and a dark gray dot read as a pixel's brightness. The switches are identical each time. Only the agreement about how to read them changes, and those agreements are what this lesson is about.
    bridges: []
  - id: digital-representations.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.digital-representations
    title: Letters need a shared codebook
    markdown: |-
      When you text a friend, both phones must agree on which number stands for which letter. An agreed way to turn information into numbers is called an **encoding**. Reading the numbers back with the same agreement is **decoding**.

      For text, the world's shared codebook is **Unicode**. It gives every character a number called its **code point**: A is 65, é is 233, and € is 8364. **UTF-8** is the most widely used way to turn code points into bytes. Plain English letters take one byte each; other characters take two, three, or four.

      ```python run
      for ch in ["A", "é", "€"]:            # take each character in turn
          data = ch.encode("utf-8")        # turn it into bytes with the UTF-8 rules
          # ord() gives the code point; list() shows each byte as 0-255; len() counts them
          print(ch, "code point:", ord(ch), "| bytes:", list(data), "| count:", len(data))

      word = "café"
      stored = word.encode("utf-8")        # the five bytes a file would hold
      print("stored:", list(stored))
      print("read as UTF-8:  ", stored.decode("utf-8"))    # the right codebook
      print("read as Latin-1:", stored.decode("latin-1"))  # an older one-byte-per-letter codebook
      ```

      Run it. A takes 1 byte, é takes 2 (195 and 169), and € takes 3. Read with the wrong codebook (Latin-1 treats every byte as its own letter), the two bytes of é become two separate characters, and "café" turns into "cafÃ©". If you've ever seen garbled accents on a web page or in an email, this is what happened. Try adding "中" or your own name to the list.

      :::mixup "One letter is one byte."
      Only plain English letters fit in one UTF-8 byte. é takes 2 and € takes 3. Some symbols are even built from two code points: an e followed by a separate accent mark looks exactly like é but takes 3 bytes. Count bytes with code, not by eye.
      :::
    bridges: []
  - id: digital-representations.s3
    type: simulation
    depth: mechanics
    objective_refs:
      - objective.digital-representations
    title: Four numbers, several pictures
    markdown: |-
      A digital picture is a grid of tiny squares called **pixels** (short for *picture elements*). Here's the smallest interesting one: two rows of two pixels, where 0 means black and 1 means white. The top row is [0, 1] and the bottom row is [1, 0], a tiny checkerboard.

      A file stores those values in one long line. Reading the rows from top to bottom gives [0, 1, 1, 0].

      :::predict A program reads the same four values as one row of four pixels. What does it show?
      A strip: black, white, white, black. The checkerboard is gone, yet no stored value changed; only the width did. That's why an image file also records its width, height, reading order, and what each number means.
      :::

      Try it below. Change the pixels per row, swap the colors, or click a pixel. Which changes alter the stored numbers, and which only alter the reading?
    bridges: []
    simulation: pixel-encoding
  - id: digital-representations.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.digital-representations
    title: Count the values in a color picture
    markdown: |-
      Color pixels need more than one number. The usual recipe, **RGB**, mixes red, green, and blue light. Each of the three amounts is called a **channel**. With one byte per channel, each amount runs from 0 to 255, so [255, 0, 0] is pure red and [255, 255, 255] is white.

      Here is the storage for a 2-by-2 color picture:

      | Step | Calculation | Result |
      | --- | --- | ---: |
      | Pixels | 2 wide × 2 high | 4 |
      | Channel values | 4 pixels × 3 channels | 12 |
      | Raw bytes | 12 values × 1 byte each | 12 |

      :::predict You double both the width and the height, to 4 by 4. What happens to the byte count?
      It quadruples, to 48 bytes. Doubling the width doubles the pixels, and doubling the height doubles them again: 4 × 4 = 16 pixels, × 3 channels = 48 values, × 1 byte = 48 bytes. Adding width and height instead of multiplying them is the most common slip here.
      :::

      Now scale up. A 12-megapixel phone photo is 4,000 × 3,000 = 12,000,000 pixels, or 36,000,000 bytes of raw RGB values, yet the file is usually a few megabytes. Files use **compression** to store the same picture (or a very close copy) in fewer bytes, and add **metadata**, facts such as the width, height, and date. Our count is the raw grid of values, not the file. (With two bytes per channel for finer shades, the raw count doubles.)
    bridges:
      - arithmetic
  - id: digital-representations.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.digital-representations
    markdown: Count the bytes in some new images, then track down garbled names, stretched pictures, and slowed-down audio.
    takeaway: |-
      A computer stores only patterns of bits. Agreements like width, channel order, text encoding, and sample rate tell a program how to read them, so check those first when something looks wrong.
  - id: digital-representations.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.digital-representations
    markdown: |-
      Bits encode numbers and structured data under conventions; text, images, and audio require different interpretations of those stored values.
  - id: digital-representations.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.digital-representations
    title: A sound is a list of measurements
    markdown: |-
      A microphone turns air pressure into a signal that rises and falls. To store it, the computer measures the signal again and again. Each measurement is a **sample**, and the **sample rate** says how many samples are taken each second. Music on a CD uses 44,100 samples per second.

      Take a tiny recording of four samples: [0, 1, 0, −1]. Played at 4 samples per second, it lasts 4 ÷ 4 = 1 second.

      :::predict You play the same four samples at 8 samples per second. What changes?
      It lasts 4 ÷ 8 = half a second, and every wiggle happens twice as fast, so a real voice would sound higher, like a cartoon chipmunk. The stored numbers are identical. Only the sample rate, part of the agreement about how to read them, changed.
      :::

      Duration is always the number of samples divided by the sample rate, so a sound file, like an image file, must carry its reading instructions.
    bridges: []
  - id: digital-representations.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.digital-representations
    title: When the colors come out wrong, check the reading first
    markdown: |-
      Everything an AI model sees arrives through a representation like these: a program opens the file, follows its agreements, and hands the model a grid of pixel values or a list of samples. (Text takes one more step: it's split into small pieces called tokens, which a later lesson covers.) So a mistake in reading the file becomes a mistake in what the model sees.

      Here's a real trap. Some popular image libraries, such as OpenCV, store each pixel's channels as blue, green, red instead of red, green, blue. Priya trains a model to spot ripe tomatoes on photos loaded one way, then feeds it photos loaded the other way. Every red tomato now looks blue to the model, and its accuracy collapses.

      Before touching the model, she prints one pixel from the middle of a tomato: `[40, 30, 200]`. The big number sits in the *last* position, where her model expects blue. One line that reorders the channels fixes it, with no retraining.

      :::predict A contacts app shows your friend's name as "ZoÃ«". Were the stored bytes damaged, or read with the wrong codebook?
      Read with the wrong codebook, just like "cafÃ©" in the code above. In UTF-8, ë is two bytes; a one-byte-per-letter codebook shows them as "Ã«". Reopen the same bytes as UTF-8 and "Zoë" comes back.
      :::
    bridges: []
