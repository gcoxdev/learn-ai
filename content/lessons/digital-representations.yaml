schema_version: 0.2-draft
lesson:
  id: digital-representations
  version: 0.2.0-draft
  title: How a computer stores a picture or a sentence
  state: draft
  summary: Follow a picture, a letter, and a sound from everyday objects to stored numbers, then count what a tiny
    image needs.
  slot: M02.1
  category: learning
  minutes: 12
  sources:
  - title: 'Python documentation: Unicode, characters, and encodings'
    url: https://docs.python.org/3/howto/unicode.html
  - title: 'Dive into Deep Learning: linear algebra'
    url: https://d2l.ai/chapter_preliminaries/linear-algebra.html
  archetype: mechanism
objectives:
- id: objective.digital-representations
  version: 2-draft
  statement: Calculate a raw image’s pixels, channel values, and bytes, and explain how encoding and metadata determine
    their interpretation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - digital-representations.base.v2
  - digital-representations.transfer.v2
  prerequisites:
  - anyOf:
    - objective.training-and-inference
scenes:
- id: digital-representations.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.digital-representations
  title: A light switch becomes a bit
  markdown: 'Imagine recording a row of switches. Each switch has two possible states: off or on. A **bit** is one
    value with two possibilities, usually written 0 and 1. The physical device need not contain little switches
    like ours; this is a way to picture the information.


    Eight bits make one **byte**. Eight positions, each with two choices, allow 256 different patterns. One convention
    uses those patterns for whole numbers from 0 through 255. The pattern and its meaning are separate: another
    convention could interpret it differently.'
  text_mode: 'Imagine recording a row of switches. Each switch has two possible states: off or on. A **bit** is
    one value with two possibilities, usually written 0 and 1. The physical device need not contain little switches
    like ours; this is a way to picture the information.


    Eight bits make one **byte**. Eight positions, each with two choices, allow 256 different patterns. One convention
    uses those patterns for whole numbers from 0 through 255. The pattern and its meaning are separate: another
    convention could interpret it differently.'
  bridges: []
- id: digital-representations.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.digital-representations
  title: Give the patterns a shared meaning
  markdown: 'An **encoding** is an agreed way to represent information using other symbols or numbers. To decode
    means to use that agreement to read the representation back.


    Unicode assigns numbers called **code points** to text characters. UTF-8 is an encoding that turns those numbers
    into bytes. In UTF-8, the letter A uses one byte; é uses two when represented by its single code point. A visible
    character can also involve several code points, so “one letter equals one byte” is an unsafe shortcut.


    A program must use the right encoding to recover the intended text.'
  text_mode: 'An **encoding** is an agreed way to represent information using other symbols or numbers. To decode
    means to use that agreement to read the representation back.


    Unicode assigns numbers called **code points** to text characters. UTF-8 is an encoding that turns those numbers
    into bytes. In UTF-8, the letter A uses one byte; é uses two when represented by its single code point. A visible
    character can also involve several code points, so “one letter equals one byte” is an unsafe shortcut.


    A program must use the right encoding to recover the intended text.'
  bridges: []
- id: digital-representations.s3
  type: simulation
  depth: mechanics
  objective_refs:
  - objective.digital-representations
  title: Build the smallest picture
  markdown: 'A digital picture can be a grid of **pixels**, its individual picture elements. Suppose our tiny picture
    has two rows and two columns. Write its top row as [0, 1] and its bottom row as [1, 0]. Under our invented convention,
    0 means black and 1 means white. Reading rows from top to bottom gives [0, 1, 1, 0].


    Those four values specify a picture only when we also know the width, height, reading order, and color convention.
    Read them as a single row and the picture changes. Change the convention and the colors swap.'
  text_mode: 'A digital picture can be a grid of **pixels**, its individual picture elements. Suppose our tiny picture
    has two rows and two columns. Write its top row as [0, 1] and its bottom row as [1, 0]. Under our invented convention,
    0 means black and 1 means white. Reading rows from top to bottom gives [0, 1, 1, 0].


    Those four values specify a picture only when we also know the width, height, reading order, and color convention.
    Read them as a single row and the picture changes. Change the convention and the colors swap.'
  bridges: []
  simulation: pixel-encoding
- id: digital-representations.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.digital-representations
  title: Count color values and storage
  markdown: 'RGB represents a color with red, green, and blue **channels**: three separate amounts. In our simple
    format, each channel uses one byte. A pixel [255, 0, 0] is full red under this convention.


    A 2-by-2 RGB picture contains 2 × 2 = 4 pixels, 4 × 3 = 12 channel values, and 12 × 1 = 12 bytes of raw pixel
    data. If each channel instead uses two bytes, it needs 24 bytes.


    Real image files also store **metadata**, information such as dimensions, and may use compression to reduce
    storage. Our calculation counts the raw array, not the entire file.'
  text_mode: 'RGB represents a color with red, green, and blue **channels**: three separate amounts. In our simple
    format, each channel uses one byte. A pixel [255, 0, 0] is full red under this convention.


    A 2-by-2 RGB picture contains 2 × 2 = 4 pixels, 4 × 3 = 12 channel values, and 12 × 1 = 12 bytes of raw pixel
    data. If each channel instead uses two bytes, it needs 24 bytes.


    Real image files also store **metadata**, information such as dimensions, and may use compression to reduce
    storage. Our calculation counts the raw array, not the entire file.'
  bridges:
  - arithmetic
- id: digital-representations.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.digital-representations
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: A computer stores patterns. The representation tells a program how to interpret those patterns; it does
    not itself teach the program what they mean.
- id: digital-representations.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.digital-representations
  markdown: Bits encode numbers and structured data under conventions; text, images, and audio require different
    interpretations of those stored values.
  text_mode: Bits encode numbers and structured data under conventions; text, images, and audio require different
    interpretations of those stored values.
- id: digital-representations.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.digital-representations
  title: A sound becomes measurements over time
  markdown: 'For sound, a microphone measures a changing signal. A **sample** is one recorded measurement at one
    time; amplitude describes its size and sign. A **sample rate** says how many measurements are taken each second.


    Our invented four-sample recording [0, 1, 0, −1] lasts one second at four samples per second, or half a second
    at eight. The stored numbers are unchanged; the playback timing changes. Four samples are far too few for a
    realistic speech recording. This miniature example isolates why timing information matters.'
  text_mode: 'For sound, a microphone measures a changing signal. A **sample** is one recorded measurement at one
    time; amplitude describes its size and sign. A **sample rate** says how many measurements are taken each second.


    Our invented four-sample recording [0, 1, 0, −1] lasts one second at four samples per second, or half a second
    at eight. The stored numbers are unchanged; the playback timing changes. Four samples are far too few for a
    realistic speech recording. This miniature example isolates why timing information matters.'
  bridges: []
- id: digital-representations.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.digital-representations
  title: Follow the representation into AI
  markdown: 'Before a picture reaches a model, a program reads the file and prepares its pixel values. Before a
    text model reads a sentence, a tokenizer groups text into pieces called tokens and assigns those pieces identifiers.
    Later lessons unpack that extra step; a token is not necessarily a byte or a word.


    If a picture’s channels are read in the wrong order, red can become blue before any learned calculation happens.
    Diagnose the representation first: what does each value mean, in what order, and under which convention? Storing
    a sentence correctly does not explain its meaning.'
  text_mode: 'Before a picture reaches a model, a program reads the file and prepares its pixel values. Before a
    text model reads a sentence, a tokenizer groups text into pieces called tokens and assigns those pieces identifiers.
    Later lessons unpack that extra step; a token is not necessarily a byte or a word.


    If a picture’s channels are read in the wrong order, red can become blue before any learned calculation happens.
    Diagnose the representation first: what does each value mean, in what order, and under which convention? Storing
    a sentence correctly does not explain its meaning.'
  bridges: []
