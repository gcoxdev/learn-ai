schema_version: 0.2-draft
lesson:
  id: digital-representations
  version: 0.4.0-draft
  title: How a computer stores a picture or a sentence
  state: draft
  summary: The same eight on/off switches can be a number, a letter, or a dot of color. Learn how a computer knows which, and why "café" sometimes turns into "cafÃ©".
  slot: M02.1
  category: learning
  sources:
    - title: 'Python documentation: Unicode, characters, and encodings'
      url: https://docs.python.org/3/howto/unicode.html
    - title: 'Dive into Deep Learning: linear algebra'
      url: https://d2l.ai/chapter_preliminaries/linear-algebra.html
  archetype: mechanism
objectives:
  - id: objective.digital-representations
    version: 3-draft
    statement: Calculate a raw image’s pixels, channel values, and bytes, and explain how encoding and metadata determine their interpretation.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - digital-representations.base.v3
