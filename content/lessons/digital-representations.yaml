assessment_families:
- id: digital-representations.base
  objective_ref: objective.digital-representations
  task: base
  response_type: single_choice
  points: 1
  hint: 'Represent different kinds of signals: trace the inputs, operation, and result before choosing.'
  remediation_scene: digital-representations.s2
  variants:
  - id: digital-representations.base.1
    prompt: A 3 × 2 RGB image stores how many channel values?
    options:
    - id: a
      text: '18'
    - id: b
      text: '6'
    - id: c
      text: '9'
    answer: a
    feedback: Six pixels times three channels gives eighteen values.
  - id: digital-representations.base.2
    prompt: Do bits alone specify whether data is text or sound?
    options:
    - id: b
      text: Yes; every byte has one universal meaning
    - id: c
      text: Only if the file is large
    - id: a
      text: No; encoding and format conventions are needed
    answer: a
    feedback: The interpretation depends on the agreed representation.
- id: digital-representations.transfer
  objective_ref: objective.digital-representations
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Avoid confusing encoding with understanding: trace the inputs, operation, and result before choosing.'
  remediation_scene: digital-representations.s4
  variants:
  - id: digital-representations.transfer.1
    prompt: Image width and height both double. With fixed channels, how does raw value count change?
    options:
    - id: b
      text: It doubles
    - id: c
      text: It stays constant
    - id: a
      text: It quadruples
    answer: a
    feedback: The number of pixels multiplies the two dimensions.
  - id: digital-representations.transfer.2
    prompt: A text pipeline decodes bytes using the wrong encoding. Where should diagnosis begin?
    options:
    - id: c
      text: By adding an output token
    - id: a
      text: At the input representation and decoding step
    - id: b
      text: By assuming the optimizer failed
    answer: a
    feedback: Representation errors can occur before the model runs.
