scenes:
- id: python-experiments.s1
  title: A function gives an operation a name
  type: explanation
  depth: intuition
  objective_refs:
  - objective.python-experiments
  markdown: In Python, a function such as predict(x, w, b) can return w * x + b. Arguments supply values; the returned
    result can be inspected or passed onward. Keep data preparation, prediction, scoring, and updating as separate
    operations so a surprising result can be traced to the right step.
  text_mode: In Python, a function such as predict(x, w, b) can return w * x + b. Arguments supply values; the returned
    result can be inspected or passed onward. Keep data preparation, prediction, scoring, and updating as separate
    operations so a surprising result can be traced to the right step.
  bridges: []
- id: python-experiments.s2
  title: Arrays have shapes and meanings
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.python-experiments
  markdown: A numerical array stores entries in an organized shape. For a row-oriented batch X with shape [examples,
    features], matrix multiplication X @ W applies a linear transformation. In NumPy, * is elementwise multiplication
    while @ performs matrix multiplication. Record the axes and inspect a tiny hand-calculated case before increasing
    the batch size.
  text_mode: A numerical array stores entries in an organized shape. For a row-oriented batch X with shape [examples,
    features], matrix multiplication X @ W applies a linear transformation. In NumPy, * is elementwise multiplication
    while @ performs matrix multiplication. Record the axes and inspect a tiny hand-calculated case before increasing
    the batch size.
  bridges:
  - matrices-tensors
- id: python-experiments.s3
  title: Control the experimental conditions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.python-experiments
  markdown: A pseudorandom generator initialized with a seed can repeat a sequence within a stated implementation.
    Record library versions, input data, preprocessing, configuration, and hardware where relevant. Some parallel
    operations remain nondeterministic. A notebook that works only because cells were run in a hidden order is difficult
    to reproduce.
  text_mode: A pseudorandom generator initialized with a seed can repeat a sequence within a stated implementation.
    Record library versions, input data, preprocessing, configuration, and hardware where relevant. Some parallel
    operations remain nondeterministic. A notebook that works only because cells were run in a hidden order is difficult
    to reproduce.
  bridges: []
- id: python-experiments.s4
  title: Start with an inspectable run
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.python-experiments
  markdown: For inputs [1, 2], weight 3, and bias 1, expected outputs are [4, 7]. Check that case, then change one
    variable at a time and plot labeled inputs against outputs. Restart and run the experiment from the beginning.
    Never treat a successful toy run as evidence that the full training system or dataset is correct.
  text_mode: For inputs [1, 2], weight 3, and bias 1, expected outputs are [4, 7]. Check that case, then change
    one variable at a time and plot labeled inputs against outputs. Restart and run the experiment from the beginning.
    Never treat a successful toy run as evidence that the full training system or dataset is correct.
  bridges: []
