schema_version: 0.2-draft
lesson:
  id: python-experiments
  version: 0.4.0-draft
  title: Make a small experiment repeatable
  state: draft
  summary: Your model's slope came out 2.88. Run it again and it's 3.24. Write a small NumPy experiment you can check, rerun, and trust, one function, one shape, and one seed at a time.
  slot: B22
  category: bridge
  sources:
    - title: Python tutorial — official documentation
      url: https://docs.python.org/3/tutorial/
    - title: NumPy — absolute beginners’ guide
      url: https://numpy.org/doc/stable/user/absolute_beginners.html
objectives:
  - id: objective.python-experiments
    version: 2-draft
    statement: Write a small Python experiment with named functions, checked array shapes, and a seeded random generator, and report results across several seeds with the settings needed to rerun them.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - python-experiments.base.v2
      - python-experiments.transfer.v2
      - python-experiments.calculate
    prerequisites:
      - anyOf:
          - objective.functions
      - anyOf:
          - objective.matrices-tensors
scenes:
  - id: python-experiments.s1
    title: A function gives one step a name
    type: explanation
    depth: intuition
    objective_refs:
      - objective.python-experiments
    markdown: |-
      You fit a line to some noisy data and get a slope of 2.88. A friend runs "the same thing" and gets 3.24. Who's right? Neither, yet, until you can see exactly what each run did.

      **Why AI needs this:** every number in this course, from a loss curve to a benchmark score, comes out of a small program. Named steps, checked shapes, and seeded randomness decide whether you can trust that number and get it again.

      Start with a **function**: a named, reusable step that takes inputs (its **arguments**) and gives back a result.

      ```python run
      def predict(x, w, b):
          return w * x + b          # a straight line: weight times input, plus bias

      inputs = [1, 2]
      outputs = [predict(x, 3, 1) for x in inputs]
      print(outputs)
      assert outputs == [4, 7], "predictions changed!"
      print("check passed")
      ```

      `def` names the function, and `return` hands back its result. The list line calls `predict` once per input: 3 × 1 + 1 = 4 and 3 × 2 + 1 = 7. An `assert` states what must be true, and stops the program loudly if it isn't.

      :::predict Change the weight from 3 to 2 and run it. What happens?
      The outputs become [3, 5], and the assert stops the program with "predictions changed!" That's the point: a quiet change in an assumption now makes a loud error instead of a wrong number.
      :::

      Give each stage (preparing data, predicting, scoring) its own function, so when a result looks odd you can test each step alone.
    bridges: []
  - id: python-experiments.s2
    title: Arrays have shapes, and shapes have meanings
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.python-experiments
    markdown: |-
      **NumPy** is Python's library for arrays of numbers. By convention, a batch X has **shape** [examples, features]: one row per example, one column per feature, as in the lesson on matrices and tensors.

      ```python run
      import numpy as np

      X = np.array([[1, 2],             # 2 examples (rows) ...
                    [3, 4]])            # ... with 2 features (columns)
      w = np.array([10, 1])             # one weight per feature

      print("X shape:", X.shape, "  w shape:", w.shape)
      print("X @ w =", X @ w)           # matrix product: one prediction per example
      print("X * w =\n", X * w)         # elementwise: each column times its weight
      ```

      Work it by hand first. `X @ w` takes each row's weighted sum: 1 × 10 + 2 × 1 = 12 and 3 × 10 + 4 × 1 = 34, one prediction per example. `X * w` multiplies matching entries without adding, and gives a 2 × 2 array [[10, 2], [30, 4]].

      :::mixup "`*` and `@` both multiply, so either one works."
      `*` is elementwise; `@` is the matrix product. Here `X * w` doesn't even crash: NumPy stretches w across the rows and hands you the wrong shape. Print `.shape` after every step, and check it against what the step should produce.
      :::
    bridges:
      - matrices-tensors
  - id: python-experiments.s3
    title: Seed the randomness, then vary the seed
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.python-experiments
    markdown: |-
      Real experiments use random numbers: noisy data, shuffled examples, random starting weights. As in the lesson on randomness and reproducibility, a **seed** sets where a pseudorandom generator starts, so the same seed replays the same numbers. In NumPy, create one generator per run with `np.random.default_rng(seed)`.

      Here's a whole experiment: draw 20 points from the line y = 3x + 1, add noise, and fit a slope.

      ```python run
      import numpy as np

      def run_experiment(seed, n=20, true_w=3.0, noise=2.0):
          rng = np.random.default_rng(seed)             # this run's own random numbers
          x = rng.uniform(0, 10, size=n)                # n random inputs
          y = true_w * x + 1 + rng.normal(0, noise, size=n)   # a line, plus noise
          slope, intercept = np.polyfit(x, y, deg=1)    # fit a straight line
          return slope

      print("seed 0, twice:", run_experiment(0), run_experiment(0))
      slopes = np.array([run_experiment(s) for s in range(5)])
      print("seeds 0-4:    ", np.round(slopes, 3))
      print(f"mean {slopes.mean():.3f}, standard deviation {slopes.std():.3f}")
      ```

      Seed 0 gives 2.883 both times: the run is repeatable. Seeds 0 to 4 give slopes from 2.883 to 3.237, with mean 3.105 and standard deviation 0.126. That spread is the honest answer to "what slope do we get?"

      :::mixup "Seed 0 reproduces 2.883 exactly, so the slope is 2.883."
      A seed makes a run repeatable, not right. Seed 0 happens to draw noise that pulls the slope low. Report the mean and spread over several seeds. Try `n=200`: the spread shrinks, because more data averages out more noise.
      :::
    bridges: []
  - id: python-experiments.s4
    title: One clean run, one change at a time
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.python-experiments
    markdown: |-
      Maya's notebook reports a slope of 3.1, but only after she runs cell 7, then cell 3, then cell 7 again. Nobody else can repeat that. Before trusting any result, restart the notebook and run every cell from the top.

      Then treat the experiment as a pipeline, as the diagram below shows. Settings flow in at the start, and the log at the end records everything needed to rerun it: the seeds, the settings, the code version, and the library versions (`np.__version__` prints NumPy's).

      To test an idea, change one setting at a time and rerun all the seeds. If Maya changes the noise level *and* the number of points and the spread shrinks, she can't tell which change did it. The lessons on controlled experiments and on reproducing results build on these same habits.
    diagram:
      caption: A small experiment as a pipeline. The log keeps what's needed to rerun it.
      description: Settings, including the seeds, feed the data step. The data step draws noisy points and passes them to the fit step. The fit step passes the fitted slope to the summary step, which reports the mean and spread across seeds. The summary goes to the log, and the settings also go directly to the log, which records seeds, settings, and library versions.
      nodes:
        - id: config
          label: Settings and seeds
          note: n, noise, seeds 0–4
          col: 0
          row: 0
          tone: accent
        - id: data
          label: Make data
          note: seeded generator
          col: 1
          row: 0
          tone: data
        - id: fit
          label: Fit a line
          note: one slope per seed
          col: 2
          row: 0
        - id: summary
          label: Summarize
          note: mean and spread
          col: 3
          row: 0
        - id: log
          label: Log
          note: seeds, settings, versions, results
          col: 3
          row: 1
          tone: muted
      edges:
        - from: config
          to: data
        - from: data
          to: fit
          label: x, y
        - from: fit
          to: summary
          label: slopes
        - from: summary
          to: log
        - from: config
          to: log
          dashed: true
          bend: 1
    bridges: []
  - id: python-experiments.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.python-experiments
    markdown: Read new NumPy lines by their shapes, then judge a lucky seed, a notebook that only works in one order, and a result that changed three things at once.
    takeaway: |-
      Name each step as a function, print shapes as you go, and seed each run's random generator. A seed makes a run repeatable, not right, so report the spread over several seeds along with what's needed to rerun them.
  - id: python-experiments.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.python-experiments
    markdown: |-
      Functions, arrays, controlled randomness, recorded environments, and explicit inputs turn a small program into an inspectable experiment.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - python-experiments.s1
        - python-experiments.s2
        - python-experiments.s3
        - python-experiments.s4
        - python-experiments.check
      gate_refs:
        - gate.core
  scene_aliases:
    python-experiments.recap: python-experiments.check
assessment_families:
  - id: python-experiments.base
    objective_ref: objective.python-experiments
    task: base
    response_type: single_choice
    points: 1
    hint: Write down each array's shape, then ask whether the step needs a matrix product (@) or matching entries (*).
    remediation_scene: python-experiments.s2
    variants:
      - id: python-experiments.base.1
        prompt: In NumPy, which operator denotes matrix multiplication?
        options:
          - id: b
            text: '* for all arrays'
          - id: c
            text: +
          - id: a
            text: '@'
        answer: a
        feedback: The @ operator performs matrix multiplication; * ordinarily multiplies entries elementwise.
        retired: true
      - id: python-experiments.base.2
        prompt: 'Inputs [2, 3], weight 2, bias 1: what outputs should a tiny linear predictor produce?'
        options:
          - id: c
            text: '[6, 8]'
          - id: a
            text: '[5, 7]'
          - id: b
            text: '[4, 6]'
        answer: a
        feedback: Multiply each input by 2 and add 1.
        retired: true
  - id: python-experiments.transfer
    objective_ref: objective.python-experiments
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask whether someone else could rerun this from a fresh start and get the same numbers.
    remediation_scene: python-experiments.s4
    variants:
      - id: python-experiments.transfer.1
        prompt: A notebook works only after manually running an old cell. What is a useful reproducibility check?
        options:
          - id: c
            text: Change the chart color
          - id: a
            text: Restart the kernel and run all cells in order
          - id: b
            text: Hide the old cell
        answer: a
        feedback: A clean run exposes dependencies on hidden execution state.
        retired: true
      - id: python-experiments.transfer.2
        prompt: Is a random seed alone a complete experiment record?
        options:
          - id: a
            text: No; data, code, environment, and settings also matter
          - id: b
            text: Yes; it reconstructs all missing files
          - id: c
            text: Yes; it guarantees identical results on every device
        answer: a
        feedback: A seed controls only part of the experimental conditions.
        retired: true
  - id: python-experiments.base.v2
    objective_ref: objective.python-experiments
    task: base
    response_type: single_choice
    points: 1
    hint: "Read shapes as [examples, features]: @ turns each row into one number, * multiplies matching entries. A seed replays the same random numbers; it doesn't make them typical."
    remediation_scene: python-experiments.s2
    variants:
      - id: python-experiments.base.v2.1
        prompt: X has shape (100, 3), meaning 100 examples with 3 features, and w has shape (3,). Which expression gives one prediction per example?
        options:
          - id: b
            text: X * w, which has shape (100, 3)
          - id: a
            text: X @ w, which has shape (100,)
          - id: c
            text: w @ X, which has shape (3,)
        answer: a
        feedback: The matrix product takes each row's weighted sum, giving 100 predictions. X * w multiplies entries without adding, so it keeps all 300 numbers. w @ X doesn't even line up, since w has 3 entries and X has 100 rows.
      - id: python-experiments.base.v2.2
        prompt: A test says assert predict(2, 3, 1) == 7, and it passes. You change the weight to 4 and it stops the program. What has the assert done?
        options:
          - id: c
            text: Fixed the prediction back to the value 7 it expected
          - id: a
            text: Caught that the output no longer matches what you expected
          - id: b
            text: Revealed a bug inside Python's handling of multiplication
        answer: a
        feedback: With weight 4 the prediction is 4 × 2 + 1 = 9, not 7, so the assert fails loudly. It never changes values, and Python's arithmetic is fine; your assumption changed.
      - id: python-experiments.base.v2.3
        prompt: An experiment run twice with np.random.default_rng(0) gives the same slope, 2.883, both times. What does that show?
        options:
          - id: a
            text: That the run is repeatable, not that 2.883 is typical
          - id: c
            text: That 2.883 is the true slope of the underlying line
          - id: b
            text: That the seed has removed the noise from the data
        answer: a
        feedback: The same seed replays the same noise, so the result repeats. Other seeds give other slopes (up to 3.237 in the lesson), so only the spread across seeds tells you how much to trust 2.883.
      - id: python-experiments.base.v2.4
        prompt: A batch of data has shape (32, 128), following the [examples, features] convention. What does the 128 count?
        options:
          - id: b
            text: The number of examples in the batch
          - id: a
            text: The number of features for each example
          - id: c
            text: The number of batches in the dataset
        answer: a
        feedback: Rows are examples and columns are features, so this batch holds 32 examples of 128 features each. Nothing in a single batch's shape counts how many batches there are.
      - id: python-experiments.base.v2.5
        prompt: Why split an experiment into separate functions for preparing data, predicting, and scoring?
        options:
          - id: c
            text: Python runs code faster when it is split into many functions
          - id: b
            text: Functions hide the details, so there is less to check later
          - id: a
            text: Each step can be tested alone to find which one went wrong
        answer: a
        feedback: When a score looks strange, you can check each step on a tiny case (like predict giving [4, 7]) and find the broken one. Functions don't speed Python up, and the point is to make each step easier to check, not to hide it.
  - id: python-experiments.transfer.v2
    objective_ref: objective.python-experiments
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what a stranger would need to rerun this from scratch, and whether the result would survive a different seed.
    remediation_scene: python-experiments.s4
    variants:
      - id: python-experiments.transfer.v2.1
        prompt: A classmate's notebook gives the right answer only if cell 5 runs before cell 2. What should they do before sharing it?
        options:
          - id: b
            text: Add a note at the top saying to run cell 5 before cell 2
          - id: a
            text: Fix the order, then restart and run every cell from the top
          - id: c
            text: Clear the outputs so readers rerun the cells themselves
        answer: a
        feedback: A notebook that depends on a hidden run order will eventually be run in the wrong order. Restarting and running top to bottom proves the order works. A note relies on every reader, and clearing outputs hides the problem.
      - id: python-experiments.transfer.v2.2
        prompt: A colleague reports 91.2% accuracy with seed 42, and your rerun with seed 42 also gets 91.2%. Seeds 0 to 4 give 87% to 90%. What should the report say?
        options:
          - id: a
            text: The mean and spread over several seeds, around 88.5%
          - id: c
            text: 91.2%, since the rerun reproduced it exactly
          - id: b
            text: 91.2%, since seed 42 is the correct seed to use
        answer: a
        feedback: Reproducing seed 42 shows the run repeats, not that it's typical; it looks like a lucky draw. The other seeds show the usual range, so report the mean and spread. No seed is more correct than another.
      - id: python-experiments.transfer.v2.3
        prompt: The same code with the same seed gives slightly different numbers on a teammate's laptop. What is the most useful next step?
        options:
          - id: c
            text: Try seeds until both laptops give the same result
          - id: b
            text: Assume one laptop is faulty and keep the other's numbers
          - id: a
            text: Compare library versions and hardware, and record them
        answer: a
        feedback: Different library versions or hardware can change rounding or the random stream, even with the same seed. Recording versions lets you find the cause and lets others rerun your setup. Hunting for a matching seed hides the difference.
      - id: python-experiments.transfer.v2.4
        prompt: You change the learning rate, the data cleaning, and the model size in one go, and accuracy rises 3 points. What can you conclude?
        options:
          - id: b
            text: That the largest change, the model size, caused the gain
          - id: a
            text: Not which change helped, until you test them one at a time
          - id: c
            text: That each of the three changes added about one point
        answer: a
        feedback: With three changes at once, any one of them (or a lucky seed) could explain the gain. Changing one thing per run, over several seeds, tells you which change matters. Splitting credit evenly is a guess.
  - id: python-experiments.calculate
    objective_ref: objective.python-experiments
    task: base
    response_type: numeric
    points: 1
    hint: "For X @ w, each row gives one number: multiply row entries by matching weights and add. For X * w, multiply matching entries without adding across the row."
    remediation_scene: python-experiments.s2
    absolute_tolerance: 0.01
    variants:
      - id: python-experiments.calculate.1
        prompt: X = np.array([[1, 2], [3, 4]]) and w = np.array([2, 1]). What is (X @ w)[1], the prediction for the second example?
        answer: 10
        feedback: The second row is [3, 4], so 3 × 2 + 4 × 1 = 10. (The first row gives 1 × 2 + 2 × 1 = 4.)
      - id: python-experiments.calculate.2
        prompt: X = np.array([[2, 0], [1, 3]]) and w = np.array([4, 5]). What is (X @ w)[0], the prediction for the first example?
        answer: 8
        feedback: The first row is [2, 0], so 2 × 4 + 0 × 5 = 8.
      - id: python-experiments.calculate.3
        prompt: X = np.array([[1, 2], [3, 4]]) and w = np.array([10, 1]). What is (X * w).sum(), the total of all entries of the elementwise product?
        answer: 46
        feedback: X * w is [[10, 2], [30, 4]], because each column is multiplied by its weight. The entries add to 10 + 2 + 30 + 4 = 46.
      - id: python-experiments.calculate.4
        prompt: X has shape (32, 10) and W has shape (10, 4). How many numbers does X @ W contain?
        answer: 128
        feedback: The inner 10s match and disappear, leaving shape (32, 4), which holds 32 × 4 = 128 numbers.
      - id: python-experiments.calculate.5
        prompt: x = np.array([1, 2, 3]). What does (3 * x + 1).sum() print?
        answer: 21
        feedback: 3 * x + 1 is [4, 7, 10], one value per entry, and 4 + 7 + 10 = 21.
