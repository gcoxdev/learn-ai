assessment_families:
- id: python-experiments.base
  objective_ref: objective.python-experiments
  task: base
  response_type: single_choice
  points: 1
  hint: 'Arrays have shapes and meanings: trace the inputs, operation, and result before choosing.'
  remediation_scene: python-experiments.s2
  variants:
  - id: python-experiments.base.1
    prompt: In NumPy, which operator denotes matrix multiplication?
    options:
    - id: b
      text: '* for all arrays'
    - id: c
      text: +
    - id: a
      text: '@'
    answer: a
    feedback: The @ operator performs matrix multiplication; * ordinarily multiplies entries elementwise.
  - id: python-experiments.base.2
    prompt: 'Inputs [2, 3], weight 2, bias 1: what outputs should a tiny linear predictor produce?'
    options:
    - id: c
      text: '[6, 8]'
    - id: a
      text: '[5, 7]'
    - id: b
      text: '[4, 6]'
    answer: a
    feedback: Multiply each input by 2 and add 1.
- id: python-experiments.transfer
  objective_ref: objective.python-experiments
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Start with an inspectable run: trace the inputs, operation, and result before choosing.'
  remediation_scene: python-experiments.s4
  variants:
  - id: python-experiments.transfer.1
    prompt: A notebook works only after manually running an old cell. What is a useful reproducibility check?
    options:
    - id: c
      text: Change the chart color
    - id: a
      text: Restart the kernel and run all cells in order
    - id: b
      text: Hide the old cell
    answer: a
    feedback: A clean run exposes dependencies on hidden execution state.
  - id: python-experiments.transfer.2
    prompt: Is a random seed alone a complete experiment record?
    options:
    - id: a
      text: No; data, code, environment, and settings also matter
    - id: b
      text: Yes; it reconstructs all missing files
    - id: c
      text: Yes; it guarantees identical results on every device
    answer: a
    feedback: A seed controls only part of the experimental conditions.
