assessment_families:
  - id: tensor-shape-tracing.base
    objective_ref: objective.tensor-shape-tracing
    task: base
    response_type: single_choice
    points: 1
    hint: 'Follow a complete linear layer: trace the inputs, operation, and result before choosing.'
    remediation_scene: tensor-shape-tracing.s2
    variants:
      - id: tensor-shape-tracing.base.1
        prompt: X is [7, 5] and W is [5, 3]. What is XW?
        options:
          - id: a
            text: '[7, 3]'
          - id: b
            text: '[5, 5]'
          - id: c
            text: '[7, 5, 3]'
        answer: a
        feedback: The input-feature axis contracts and output features remain.
        retired: true
      - id: tensor-shape-tracing.base.2
        prompt: Does shape [8, 4] alone identify what each axis means?
        options:
          - id: b
            text: Yes; the first axis is always time
          - id: c
            text: Yes; the second axis is always color
          - id: a
            text: No; meanings require a convention
        answer: a
        feedback: Shape sizes do not encode semantic axis labels.
        retired: true
  - id: tensor-shape-tracing.transfer
    objective_ref: objective.tensor-shape-tracing
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Connect shapes to model structure: trace the inputs, operation, and result before choosing.'
    remediation_scene: tensor-shape-tracing.s4
    variants:
      - id: tensor-shape-tracing.transfer.1
        prompt: A target broadcast creates all-pairs errors instead of per-example errors. What should be checked?
        options:
          - id: b
            text: Only the learning rate
          - id: c
            text: Only the final file size
          - id: a
            text: Axis alignment and explicit target shape
        answer: a
        feedback: A valid broadcast can still implement the wrong objective.
        retired: true
      - id: tensor-shape-tracing.transfer.2
        prompt: A tensor has 100 elements. Is that enough to know its memory in bytes?
        options:
          - id: c
            text: Yes; every element uses 100 bytes
          - id: a
            text: No; element type and storage details matter
          - id: b
            text: Yes; every element uses one byte
        answer: a
        feedback: Element count must be combined with storage format and allocation behavior.
        retired: true
  - id: tensor-shape-tracing.base.v2
    objective_ref: objective.tensor-shape-tracing
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: tensor-shape-tracing.s3
    variants:
      - prompt: X has shape [2, 3] (examples, input features), W has shape [3, 4], and b has 4 output offsets shared across examples. For XW + b, give output rows, columns, and value count.
        answers:
          rows: 2
          columns: 4
          values: 8
        reason_answer: a
        reason_options:
          - id: a
            text: Match the input-feature axis; keep the example and output-feature axes.
          - id: b
            text: Multiply the example count by the input-feature count for the output rows.
          - id: c
            text: Add the bias length as extra output columns.
        feedback: The matching 3 axis is summed over. The output has shape [2, 4] and 8 values.
        id: tensor-shape-tracing.base.v2.1
        retired: true
      - prompt: X has shape [5, 2] (examples, input features), W has shape [2, 3], and b has 3 output offsets shared across examples. For XW + b, give output rows, columns, and value count.
        answers:
          rows: 5
          columns: 3
          values: 15
        reason_answer: a
        reason_options:
          - id: b
            text: Multiply the example count by the input-feature count for the output rows.
          - id: c
            text: Add the bias length as extra output columns.
          - id: a
            text: Match the input-feature axis; keep the example and output-feature axes.
        feedback: The matching 2 axis is summed over. The output has shape [5, 3] and 15 values.
        id: tensor-shape-tracing.base.v2.2
        retired: true
      - prompt: X has shape [3, 4] (examples, input features), W has shape [4, 2], and b has 2 output offsets shared across examples. For XW + b, give output rows, columns, and value count.
        answers:
          rows: 3
          columns: 2
          values: 6
        reason_answer: a
        reason_options:
          - id: c
            text: Add the bias length as extra output columns.
          - id: a
            text: Match the input-feature axis; keep the example and output-feature axes.
          - id: b
            text: Multiply the example count by the input-feature count for the output rows.
        feedback: The matching 4 axis is summed over. The output has shape [3, 2] and 6 values.
        id: tensor-shape-tracing.base.v2.3
        retired: true
      - prompt: X has shape [4, 3] (examples, input features), W has shape [3, 1], and b has 1 output offsets shared across examples. For XW + b, give output rows, columns, and value count.
        answers:
          rows: 4
          columns: 1
          values: 4
        reason_answer: a
        reason_options:
          - id: a
            text: Match the input-feature axis; keep the example and output-feature axes.
          - id: b
            text: Multiply the example count by the input-feature count for the output rows.
          - id: c
            text: Add the bias length as extra output columns.
        feedback: The matching 3 axis is summed over. The output has shape [4, 1] and 4 values.
        id: tensor-shape-tracing.base.v2.4
        retired: true
    numeric_fields:
      - id: rows
        label: Output rows
      - id: columns
        label: Output columns
      - id: values
        label: Output values
    absolute_tolerance: 1e-6
  - id: tensor-shape-tracing.transfer.v2
    objective_ref: objective.tensor-shape-tracing
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: tensor-shape-tracing.s4
    variants:
      - prompt: Input columns are swapped but their weights are not. The shapes still match. What can happen?
        answer: a
        options:
          - id: a
            text: The output changes because values now multiply the wrong weights.
          - id: b
            text: The output is preserved because dimensional compatibility fixes column meaning.
          - id: c
            text: The batch gains one extra example.
        feedback: Shapes constrain sizes, not the meaning assigned to each column.
        id: tensor-shape-tracing.transfer.v2.1
        retired: true
      - prompt: A tensor has shape [2, 5, 4] for examples, positions, and features. What does the 5 count?
        answer: a
        options:
          - id: b
            text: The number of examples in the batch.
          - id: c
            text: The number of features per position.
          - id: a
            text: Stored positions per example, including any padding.
        feedback: The axis labels determine what each dimension counts.
        id: tensor-shape-tracing.transfer.v2.2
        retired: true
      - prompt: An example has three real positions and is padded to five. How many real positions did padding add?
        answer: a
        options:
          - id: c
            text: Five; padding replaces the example with a new one.
          - id: a
            text: Zero; the extra positions only fill the storage shape.
          - id: b
            text: Two; every stored position is a new observation.
        feedback: A validity mask distinguishes padding from actual observations.
        id: tensor-shape-tracing.transfer.v2.3
        retired: true
      - prompt: Which multiplication has compatible inner dimensions under the taught row-example convention?
        answer: a
        options:
          - id: a
            text: '[4, 3] multiplied by [3, 2].'
          - id: b
            text: '[4, 3] multiplied by [4, 2].'
          - id: c
            text: '[4, 3] multiplied by [2, 3].'
        feedback: The first matrix’s last size must match the second matrix’s first size.
        id: tensor-shape-tracing.transfer.v2.4
        retired: true
  - id: tensor-shape-tracing.base.v3
    objective_ref: objective.tensor-shape-tracing
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: 'Write the shapes side by side: [examples, features] × [features, outputs]. The matching inner size is used up, and b is copied onto every row without adding rows or columns.'
    remediation_scene: tensor-shape-tracing.s2
    numeric_fields:
      - id: rows
        label: Output rows
      - id: columns
        label: Output columns
      - id: values
        label: Output values
    absolute_tolerance: 1e-6
    variants:
      - id: tensor-shape-tracing.base.v3.1
        prompt: X has shape [7, 3] (examples, features), W has shape [3, 4], and b holds 4 offsets, one per output. For Y = XW + b, give the output rows, columns, and total number of values.
        answers:
          rows: 7
          columns: 4
          values: 28
        reason_answer: b
        reason_options:
          - id: a
            text: Add b's length as extra columns after the multiply.
          - id: b
            text: Keep X's example axis and W's output axis; the shared 3 is used up.
          - id: c
            text: Multiply the examples by the features to get the output rows.
        feedback: '[7, 3] × [3, 4] → [7, 4], and adding b keeps that shape: 7 × 4 = 28 values. Broadcasting copies b onto each row; it never adds 4 more columns.'
      - id: tensor-shape-tracing.base.v3.2
        prompt: X has shape [6, 2] (examples, features), W has shape [2, 3], and b holds 3 offsets, one per output. For Y = XW + b, give the output rows, columns, and total number of values.
        answers:
          rows: 6
          columns: 3
          values: 18
        reason_answer: c
        reason_options:
          - id: a
            text: Multiply the examples by the features to get the output rows.
          - id: b
            text: Keep X's shape, since adding b doesn't change anything.
          - id: c
            text: Keep X's example axis and W's output axis; the shared 2 is used up.
        feedback: '[6, 2] × [2, 3] → [6, 3], or 18 values. The output takes its columns from W, so it has 3 columns, not the 2 features X started with.'
      - id: tensor-shape-tracing.base.v3.3
        prompt: X has shape [4, 5] (examples, features), W has shape [5, 2], and b holds 2 offsets, one per output. For Y = XW + b, give the output rows, columns, and total number of values.
        answers:
          rows: 4
          columns: 2
          values: 8
        reason_answer: a
        reason_options:
          - id: a
            text: Keep X's example axis and W's output axis; the shared 5 is used up.
          - id: b
            text: Add b's length as extra columns after the multiply.
          - id: c
            text: Multiply the examples by the features to get the output rows.
        feedback: '[4, 5] × [5, 2] → [4, 2], or 8 values. Adding b''s 2 offsets as new columns would give [4, 4], but broadcasting adds each offset to an existing column.'
      - id: tensor-shape-tracing.base.v3.4
        prompt: X has shape [10, 3] (examples, features), W has shape [3, 1], and b holds 1 offset. For Y = XW + b, give the output rows, columns, and total number of values.
        answers:
          rows: 10
          columns: 1
          values: 10
        reason_answer: b
        reason_options:
          - id: a
            text: Keep X's shape, since adding b doesn't change anything.
          - id: b
            text: Keep X's example axis and W's output axis; the shared 3 is used up.
          - id: c
            text: Multiply the examples by the features to get the output rows.
        feedback: '[10, 3] × [3, 1] → [10, 1]: one prediction per example, 10 values in all. The three features are combined into a single output, so the 3 disappears.'
      - id: tensor-shape-tracing.base.v3.5
        prompt: X has shape [8, 4] (examples, features), W has shape [4, 6], and b holds 6 offsets, one per output. For Y = XW + b, give the output rows, columns, and total number of values.
        answers:
          rows: 8
          columns: 6
          values: 48
        reason_answer: c
        reason_options:
          - id: a
            text: Add b's length as extra columns after the multiply.
          - id: b
            text: Multiply the examples by the features to get the output rows.
          - id: c
            text: Keep X's example axis and W's output axis; the shared 4 is used up.
        feedback: '[8, 4] × [4, 6] → [8, 6], or 48 values. Treating b as 6 extra columns would give [8, 12], but broadcasting only adds to the columns already there.'
  - id: tensor-shape-tracing.transfer.v3
    objective_ref: objective.tensor-shape-tracing
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name every axis before you use it. Ask two separate questions, whether the sizes match and whether each position still means what the weights expect.
    remediation_scene: tensor-shape-tracing.s4
    variants:
      - id: tensor-shape-tracing.transfer.v3.1
        prompt: A house-price model expects [floor area, bedrooms]. A new data file lists bedrooms first. The shapes still match and no error appears. What happens?
        options:
          - id: a
            text: An error appears later, when the prices are saved
          - id: b
            text: Prices go wrong, since each number meets the wrong weight
          - id: c
            text: Prices stay the same, since the same numbers arrive
        answer: b
        feedback: A shape check only counts entries, so the swapped file runs silently. The bedroom count now gets the floor-area weight and vice versa, so predictions go badly wrong without any error.
      - id: tensor-shape-tracing.transfer.v3.2
        prompt: A text batch has shape [16, 50, 8], labeled [sentences, positions, features]. What does the 50 count?
        options:
          - id: c
            text: Positions per sentence, including padding
          - id: a
            text: Sentences processed together in the batch
          - id: b
            text: Real words in every sentence of the batch
        answer: c
        feedback: The second axis is positions, and short sentences are padded to fill it, so 50 counts stored positions, real and filler alike. The number of sentences is the 16, and the mask tells you how many positions are real.
      - id: tensor-shape-tracing.transfer.v3.3
        prompt: Three sentences have 4, 6, and 2 real positions. They're padded to a common length of 6. How many padding positions does the batch contain?
        options:
          - id: a
            text: '12'
          - id: b
            text: '18'
          - id: c
            text: '6'
        answer: c
        feedback: The batch stores 3 × 6 = 18 positions, of which 4 + 6 + 2 = 12 are real, so 6 are padding. 18 counts every stored position, and 12 counts only the real ones.
      - id: tensor-shape-tracing.transfer.v3.4
        prompt: Which matrix multiplication has matching inner sizes?
        options:
          - id: b
            text: '[5, 3] times [5, 2]'
          - id: a
            text: '[5, 3] times [3, 2]'
          - id: c
            text: '[5, 3] times [2, 3]'
        answer: a
        feedback: The last size of the first matrix must equal the first size of the second, so [5, 3] × [3, 2] works and gives [5, 2]. Matching the first sizes (5 and 5) or the last sizes (3 and 3) is a common slip.
      - id: tensor-shape-tracing.transfer.v3.5
        prompt: 'X has shape [8, 3] and W has shape [4, 2]. The multiply fails because 4 and 3 don''t match. Which is the best first step?'
        options:
          - id: a
            text: Reshape X to [6, 4], so its sizes line up with W
          - id: b
            text: Find the fourth feature that W was built to expect
          - id: c
            text: Add a bias of length 1 to make up the difference
        answer: b
