schema_version: 0.2-draft
lesson:
  id: tensor-shape-tracing
  version: 0.4.0-draft
  title: Trace an example through a batch
  state: draft
  summary: '"Size 3 is different from 2." Learn to read the shape of every array in a model, predict each result before running it, and catch the bug that no error message will flag.'
  slot: M02.4
  category: learning
  sources:
    - title: 'Dive into Deep Learning: linear algebra'
      url: https://d2l.ai/chapter_preliminaries/linear-algebra.html
    - title: 'NumPy documentation: broadcasting'
      url: https://numpy.org/doc/stable/user/basics.broadcasting.html
  archetype: mechanism
objectives:
  - id: objective.tensor-shape-tracing
    version: 3-draft
    statement: Compute the output shape and element count for batched matrix operations, and distinguish dimensional compatibility from correct axis meaning.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - tensor-shape-tracing.base.v3
      - tensor-shape-tracing.transfer.v3
    prerequisites:
      - anyOf:
          - objective.matrices-tensors
scenes:
  - id: tensor-shape-tracing.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.tensor-shape-tracing
    title: Give each axis a job
    markdown: |-
      You send three parcels to a delivery model and get back an error: the sizes *3 and 2 don't match*. No parcel is broken, and neither is the model. The numbers are simply arranged in a grid of the wrong size. Once you can read sizes, messages like this go from baffling to obvious.

      An **array** is a grid of numbers. A list is an array with one direction, or **axis**. A table (a *matrix*) has two axes, rows and columns. AI software calls an array with any number of axes a **tensor**. Its **shape** lists how many entries lie along each axis, in order.

      Three parcels, each described by two features, [distance, weight], make a table of shape [3, 2]: three rows, one per parcel, and two columns, one per feature.

      | | distance (miles) | weight (lb) |
      | --- | ---: | ---: |
      | parcel 1 | 3 | 1 |
      | parcel 2 | 5 | 2 |
      | parcel 3 | 2 | 4 |

      The shape [3, 2] tells you the sizes, not what the rows and columns mean. So always label the axes: **[examples, features]**.
    bridges:
      - matrices-tensors
  - id: tensor-shape-tracing.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.tensor-shape-tracing
    title: The shared size disappears
    markdown: |-
      A **batch** is a group of examples processed together, like our table of three parcels. Call it X, with shape [3, 2]. A weight matrix W of shape [2, 4] turns each parcel's 2 features into 4 output numbers. (The matrices lesson shows the multiply-and-add steps inside.)

      Multiplying X by W, written XW, works because the *inner* sizes match: X ends with 2 and W starts with 2. That shared feature axis gets used up in the multiply-and-add, and the outer sizes survive:

      $$[3, \mathbf{2}] \times [\mathbf{2}, 4] \rightarrow [3, 4]$$

      Three parcels in, three rows out, each now holding 4 numbers.

      :::predict The batch grows to 5 parcels, so X is [5, 2]. W stays [2, 4]. What is the shape of XW?
      [5, 4]. The batch size passes straight through; only the feature axis has to match W. That's why the same trained weights can handle 1 parcel or 1,000: W cares how many *features* each example has, not how many examples arrive.
      :::
    diagram:
      caption: Shapes through Y = XW + b. The shared size 2 is used up; the batch size 3 passes through.
      description: The input batch X with shape [3, 2] and the weights W with shape [2, 4] both feed the matrix multiply, which produces XW with shape [3, 4]. XW and the bias b with shape [4] both feed the addition, which copies b onto every row and produces Y with shape [3, 4].
      nodes:
        - id: x
          label: X [3, 2]
          note: 3 parcels × 2 features
          col: 0
          row: 0
          tone: data
        - id: w
          label: W [2, 4]
          note: 2 features in, 4 outputs
          col: 0
          row: 1
          tone: muted
        - id: mul
          label: XW [3, 4]
          note: inner 2s match and vanish
          col: 1
          row: 0
          tone: accent
        - id: b
          label: b [4]
          note: one offset per output
          col: 1
          row: 1
          tone: muted
        - id: y
          label: Y [3, 4]
          note: b added to every row
          col: 2
          row: 0
          tone: accent
      edges:
        - from: x
          to: mul
        - from: w
          to: mul
        - from: mul
          to: y
        - from: b
          to: y
          label: broadcast
  - id: tensor-shape-tracing.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tensor-shape-tracing
    title: One offset, copied to every row
    markdown: |-
      Most layers also add a bias vector b, one offset per output: Y = XW + b. Here b holds 4 numbers, but XW has 3 rows of 4. Array software copies b onto every row for you. That automatic stretching is called **broadcasting**. Here it is in NumPy, the standard Python library for arrays (it writes shapes in round brackets):

      ```python run
      import numpy as np

      X = np.array([[3.0, 1.0],       # parcel 1: [distance miles, weight lb]
                    [5.0, 2.0],       # parcel 2
                    [2.0, 4.0]])      # parcel 3
      W = np.ones((2, 4))             # 2 input features -> 4 outputs (all 1s keeps the sums easy)
      b = np.array([10, 20, 30, 40])  # one offset per output

      XW = X @ W                      # matrix multiply: each row meets every column of W
      Y = XW + b                      # broadcasting: the same b is added to every row

      print("X:", X.shape, " W:", W.shape, " b:", b.shape)
      print("XW:", XW.shape, " Y:", Y.shape, " values in Y:", Y.size)
      print(Y)
      ```

      Parcel 1's row of XW is 3 + 1 = 4 in every column; adding b gives [14, 24, 34, 44]. Y has shape (3, 4) and 3 × 4 = 12 values. Broadcasting added no new parcel and no fifth output.

      Now break it on purpose: change `np.ones((2, 4))` to `np.ones((3, 4))` and run it again. The error complains that 3 and 2 don't match, the same message from the start of the lesson. Read it as "W expects 3 features per parcel, but X has 2."
    bridges: []
  - id: tensor-shape-tracing.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tensor-shape-tracing
    title: Shapes can match while meanings don't
    markdown: |-
      Take a one-output model with weights [2, 10]: 2 minutes per mile and 10 minutes per pound. A parcel [3 miles, 1 lb] gives 3 × 2 + 1 × 10 = **16 minutes**.

      Now a new data file lists weight first. The same parcel arrives as [1, 3]:

      1 × 2 + 3 × 10 = **32 minutes**.

      Both inputs have shape [1, 2]. The multiplication runs. No error appears. The answer is double what it should be, because each number met the other feature's weight.

      :::mixup "If the shapes line up, the calculation is right."
      A shape check only counts. It can't tell distance from weight, red from blue, or feet from miles. Keep a written list of what each position means, and when you reorder the input columns, reorder the matching weights with them.
      :::
    bridges: []
  - id: tensor-shape-tracing.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.tensor-shape-tracing
    markdown: Predict output shapes for new batches, then diagnose swapped house-price columns, padded sentences, and a confusing error message.
    takeaway: |-
      Label every axis. Matching sizes lets a calculation run; matching meanings makes its answer right.
  - id: tensor-shape-tracing.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.tensor-shape-tracing
    markdown: |-
      Shape tracing tracks the meaning and size of each axis so a model’s numerical operations preserve the intended examples, features, and outputs.
  - id: tensor-shape-tracing.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tensor-shape-tracing
    title: Sentences add a third axis
    markdown: |-
      Text and audio arrive as sequences, so they need one more axis. Suppose each sentence is split into word pieces, and each piece is described by 4 numbers. A batch of 2 sentences, each stretched to 5 positions, has shape **[2, 5, 4]**: [sentences, positions, features], or 2 × 5 × 4 = 40 values.

      But real sentences have different lengths, and an array must be a perfect box. So short sentences get **padding**: filler positions added to the end to make every row the same length. A **mask** is a matching list of 1s and 0s that marks which positions are real (1) and which are filler (0), so later steps can ignore the filler.

      :::predict One sentence has 5 real positions and the other has 3. How many stored positions are real, and how many are padding?
      The array stores 2 × 5 = 10 positions. 5 + 3 = 8 are real, so 2 are padding, both at the end of the second sentence. Its mask is [1, 1, 1, 0, 0]. The shape alone, [2, 5, 4], can't tell you this; only the mask can.
      :::
    bridges: []
  - id: tensor-shape-tracing.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tensor-shape-tracing
    title: Write the shape next to every line
    markdown: |-
      Experienced practitioners write the shape of each array as a comment beside the code, with axis names, before they run anything. It takes seconds and catches a lot of bugs. Here's a realistic case.

      A photo model takes a batch of 32 color images, each 224 × 224 pixels with 3 channels:

      | Question | Answer |
      | --- | --- |
      | Shape, with names | [32, 224, 224, 3]: [images, height, width, channels] |
      | Values | 32 × 224 × 224 × 3 = 4,816,896 |
      | Memory at 4 bytes per value | 19,267,584 bytes, about 19 MB |
      | Double the batch to 64 | Twice the values, about 38.5 MB |

      Watch the axis order, too. PyTorch usually puts channels second, [32, 3, 224, 224], while TensorFlow usually puts them last. Both hold the same 4,816,896 numbers. Converting between them with a reshape, instead of a proper swap of axes, scrambles the pixels without any error: the same silent kind of mistake as the swapped columns. It's the storage lesson's channel-order trap again, one level up.

      Memory is only part of the cost; how fast the arithmetic runs is the subject of the processors lesson.
    bridges: []
