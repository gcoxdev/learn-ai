schema_version: 0.2-draft
lesson:
  id: tensor-shape-tracing
  version: 0.1.0-draft
  title: Trace an example through a batch
  state: draft
  summary: Shape tracing tracks the meaning and size of each axis so a model’s numerical operations preserve the
    intended examples, features, and outputs.
  slot: M02.4
  category: learning
  minutes: 12
  sources:
  - title: NumPy — absolute beginners’ guide
    url: https://numpy.org/doc/stable/user/absolute_beginners.html
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.tensor-shape-tracing
  version: 1-draft
  statement: Shape tracing tracks the meaning and size of each axis so a model’s numerical operations preserve the
    intended examples, features, and outputs.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - tensor-shape-tracing.base
  - tensor-shape-tracing.transfer
  prerequisites:
  - anyOf:
    - objective.matrices-tensors
scenes:
- id: tensor-shape-tracing.s1
  title: Write both sizes and meanings
  type: explanation
  depth: intuition
  objective_refs:
  - objective.tensor-shape-tracing
  markdown: A shape [4, 3] might mean four examples with three features, or four time positions with three channels.
    The numbers alone do not tell you which. Label axes and record whether a layer expects row-oriented or column-oriented
    vectors before matching its dimensions.
  text_mode: A shape [4, 3] might mean four examples with three features, or four time positions with three channels.
    The numbers alone do not tell you which. Label axes and record whether a layer expects row-oriented or column-oriented
    vectors before matching its dimensions.
  bridges: []
- id: tensor-shape-tracing.s2
  title: Follow a complete linear layer
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tensor-shape-tracing
  markdown: Let X have shape [4, 3], W shape [3, 2], and bias b shape [2]. The product XW has shape [4, 2]. Adding
    b across examples preserves that shape. A pointwise activation then changes values without changing the number
    of examples or output features.
  text_mode: Let X have shape [4, 3], W shape [3, 2], and bias b shape [2]. The product XW has shape [4, 2]. Adding
    b across examples preserves that shape. A pointwise activation then changes values without changing the number
    of examples or output features.
  bridges:
  - matrices-tensors
- id: tensor-shape-tracing.s3
  title: A matching shape can still hide a mistake
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tensor-shape-tracing
  markdown: Suppose a model predicts one score per example as shape [4, 1], while targets are shape [4]. Some libraries
    may broadcast their subtraction into a [4, 4] array. The program runs but compares unintended pairs. Reshaping
    deliberately and checking a tiny batch can expose the error.
  text_mode: Suppose a model predicts one score per example as shape [4, 1], while targets are shape [4]. Some libraries
    may broadcast their subtraction into a [4, 4] array. The program runs but compares unintended pairs. Reshaping
    deliberately and checking a tiny batch can expose the error.
  bridges: []
- id: tensor-shape-tracing.s4
  title: Connect shapes to model structure
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tensor-shape-tracing
  markdown: Sequence models commonly use axes for batch, token position, and hidden features. Attention adds head
    axes and score matrices between positions. A shape diagram helps distinguish which dimensions are mixed, summed
    over, or retained. It also supports memory estimates, but byte counts require data types and actual stored intermediates.
  text_mode: Sequence models commonly use axes for batch, token position, and hidden features. Attention adds head
    axes and score matrices between positions. A shape diagram helps distinguish which dimensions are mixed, summed
    over, or retained. It also supports memory estimates, but byte counts require data types and actual stored intermediates.
  bridges: []
- id: tensor-shape-tracing.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.tensor-shape-tracing
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: tensor-shape-tracing.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.tensor-shape-tracing
  markdown: Shape tracing tracks the meaning and size of each axis so a model’s numerical operations preserve the
    intended examples, features, and outputs.
  text_mode: Shape tracing tracks the meaning and size of each axis so a model’s numerical operations preserve the
    intended examples, features, and outputs.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - tensor-shape-tracing.s1
    - tensor-shape-tracing.s2
