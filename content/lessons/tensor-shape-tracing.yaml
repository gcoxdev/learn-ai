schema_version: 0.2-draft
lesson:
  id: tensor-shape-tracing
  version: 0.2.0-draft
  title: Trace an example through a batch
  state: draft
  summary: Label the axes in arrays, trace a batch through a weighted calculation, and catch errors that shape checks
    alone miss.
  slot: M02.4
  category: learning
  sources:
  - title: 'Dive into Deep Learning: linear algebra'
    url: https://d2l.ai/chapter_preliminaries/linear-algebra.html
  archetype: mechanism
objectives:
- id: objective.tensor-shape-tracing
  version: 2-draft
  statement: Compute the output shape and element count for batched matrix operations, and distinguish dimensional
    compatibility from correct axis meaning.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - tensor-shape-tracing.base.v2
  - tensor-shape-tracing.transfer.v2
  prerequisites:
  - anyOf:
    - objective.matrices-tensors
scenes:
- id: tensor-shape-tracing.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.tensor-shape-tracing
  title: Give each axis a job
  markdown: 'An **array** is an organized collection of values. A vector is a one-axis list; a matrix has two axes,
    like rows and columns. In AI software, **tensor** often means an array with any number of axes. Its **shape**
    lists the size of each axis in order.


    A table of three parcels with two features per parcel has shape [3, 2]: three example rows and two feature columns.
    The brackets describe sizes, not the values of the parcels themselves. Always label the axes alongside the numbers;
    [3, 2] alone does not say what a row represents.'
  text_mode: 'An **array** is an organized collection of values. A vector is a one-axis list; a matrix has two axes,
    like rows and columns. In AI software, **tensor** often means an array with any number of axes. Its **shape**
    lists the size of each axis in order.


    A table of three parcels with two features per parcel has shape [3, 2]: three example rows and two feature columns.
    The brackets describe sizes, not the values of the parcels themselves. Always label the axes alongside the numbers;
    [3, 2] alone does not say what a row represents.'
  bridges:
  - matrices-tensors
- id: tensor-shape-tracing.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.tensor-shape-tracing
  title: Follow one example, then the batch
  markdown: 'A **batch** is a group of examples processed together. Let our input table X have shape [3, 2]. Each
    row contains [distance, parcel weight]. A weight matrix W with shape [2, 4] converts those two features into
    four output values per example.


    For XW, the input’s feature count 2 matches the weight matrix’s first size 2. The output shape is [3, 4]: three
    examples, four outputs each. Matrix multiplication combines matching input features; it does not multiply every
    axis size into one long list. The matrix side lesson shows the individual multiply-and-add steps.'
  text_mode: 'A **batch** is a group of examples processed together. Let our input table X have shape [3, 2]. Each
    row contains [distance, parcel weight]. A weight matrix W with shape [2, 4] converts those two features into
    four output values per example.


    For XW, the input’s feature count 2 matches the weight matrix’s first size 2. The output shape is [3, 4]: three
    examples, four outputs each. Matrix multiplication combines matching input features; it does not multiply every
    axis size into one long list. The matrix side lesson shows the individual multiply-and-add steps.'
  bridges:
  - matrices-tensors
- id: tensor-shape-tracing.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tensor-shape-tracing
  title: Add an offset without adding examples
  markdown: 'Suppose a bias vector b contains four offsets, one per output feature. We use the same vector for each
    example: Y = XW + b. This reuse across rows is called **broadcasting** in array software.


    The output still has shape [3, 4], containing 3 × 4 = 12 values. Broadcasting does not append another example
    or create a fifth output. If X instead has shape [5, 2] with the same W and b, Y has shape [5, 4]. Changing
    batch size changes how many examples are processed, not how many features the stored weights expect.'
  text_mode: 'Suppose a bias vector b contains four offsets, one per output feature. We use the same vector for
    each example: Y = XW + b. This reuse across rows is called **broadcasting** in array software.


    The output still has shape [3, 4], containing 3 × 4 = 12 values. Broadcasting does not append another example
    or create a fifth output. If X instead has shape [5, 2] with the same W and b, Y has shape [5, 4]. Changing
    batch size changes how many examples are processed, not how many features the stored weights expect.'
  bridges: []
- id: tensor-shape-tracing.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tensor-shape-tracing
  title: Compatible sizes can hide the wrong meaning
  markdown: 'Consider a one-output rule with weights [2, 10] for [distance, parcel weight]. Input [3, 1] gives 3
    × 2 + 1 × 10 = 16. Accidentally swap the input columns and [1, 3] gives 1 × 2 + 3 × 10 = 32.


    Both inputs have shape [1, 2] when stored as one-row matrices. The shape check passes, yet the meanings attached
    to the columns changed. Swapping both columns and their matching weights would preserve this calculation. Swapping
    only one side breaks the agreed mapping.'
  text_mode: 'Consider a one-output rule with weights [2, 10] for [distance, parcel weight]. Input [3, 1] gives
    3 × 2 + 1 × 10 = 16. Accidentally swap the input columns and [1, 3] gives 1 × 2 + 3 × 10 = 32.


    Both inputs have shape [1, 2] when stored as one-row matrices. The shape check passes, yet the meanings attached
    to the columns changed. Swapping both columns and their matching weights would preserve this calculation. Swapping
    only one side breaks the agreed mapping.'
  bridges: []
- id: tensor-shape-tracing.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.tensor-shape-tracing
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: A shape tells you how many values lie along each axis. Correct calculations also require knowing what
    those axes and positions mean.
- id: tensor-shape-tracing.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.tensor-shape-tracing
  markdown: Shape tracing tracks the meaning and size of each axis so a model’s numerical operations preserve the
    intended examples, features, and outputs.
  text_mode: Shape tracing tracks the meaning and size of each axis so a model’s numerical operations preserve the
    intended examples, features, and outputs.
- id: tensor-shape-tracing.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tensor-shape-tracing
  title: Add an axis for a sequence
  markdown: 'Text and audio often arrive as ordered sequences. Suppose each example has five positions, and each
    position is represented by four numbers. A batch of two examples can have shape [2, 5, 4]: examples, positions,
    features. It contains 2 × 5 × 4 = 40 values.


    A shorter example may be extended with **padding**, extra positions that fill the rectangular array. A **mask**
    records which positions a particular operation may use. Padding does not create new real words or measurements.
    Knowing the shape therefore does not tell you how many positions contain genuine observations.'
  text_mode: 'Text and audio often arrive as ordered sequences. Suppose each example has five positions, and each
    position is represented by four numbers. A batch of two examples can have shape [2, 5, 4]: examples, positions,
    features. It contains 2 × 5 × 4 = 40 values.


    A shorter example may be extended with **padding**, extra positions that fill the rectangular array. A **mask**
    records which positions a particular operation may use. Padding does not create new real words or measurements.
    Knowing the shape therefore does not tell you how many positions contain genuine observations.'
  bridges: []
- id: tensor-shape-tracing.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tensor-shape-tracing
  title: Check the whole input contract
  markdown: 'Before running a tensor calculation, write down axis order, feature order, units, and which positions
    are valid. Check the sizes that must match, then calculate the expected output shape and value count.


    For raw storage, multiply that value count by bytes per value. Our [2, 5, 4] array needs 160 bytes if each value
    uses four bytes, excluding storage overhead. This is a size estimate, not a speed estimate: operations and memory
    movement also matter. The processor lesson will separate those costs. A shape diagram is a practical debugging
    tool because it exposes assumptions before a long calculation starts.'
  text_mode: 'Before running a tensor calculation, write down axis order, feature order, units, and which positions
    are valid. Check the sizes that must match, then calculate the expected output shape and value count.


    For raw storage, multiply that value count by bytes per value. Our [2, 5, 4] array needs 160 bytes if each value
    uses four bytes, excluding storage overhead. This is a size estimate, not a speed estimate: operations and memory
    movement also matter. The processor lesson will separate those costs. A shape diagram is a practical debugging
    tool because it exposes assumptions before a long calculation starts.'
  bridges: []
