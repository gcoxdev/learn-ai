assessment_families:
- id: tensor-shape-tracing.base
  objective_ref: objective.tensor-shape-tracing
  task: base
  response_type: single_choice
  points: 1
  hint: 'Follow a complete linear layer: trace the inputs, operation, and result before choosing.'
  remediation_scene: tensor-shape-tracing.s2
  variants:
  - id: tensor-shape-tracing.base.1
    prompt: X is [7, 5] and W is [5, 3]. What is XW?
    options:
    - id: a
      text: '[7, 3]'
    - id: b
      text: '[5, 5]'
    - id: c
      text: '[7, 5, 3]'
    answer: a
    feedback: The input-feature axis contracts and output features remain.
  - id: tensor-shape-tracing.base.2
    prompt: Does shape [8, 4] alone identify what each axis means?
    options:
    - id: b
      text: Yes; the first axis is always time
    - id: c
      text: Yes; the second axis is always color
    - id: a
      text: No; meanings require a convention
    answer: a
    feedback: Shape sizes do not encode semantic axis labels.
- id: tensor-shape-tracing.transfer
  objective_ref: objective.tensor-shape-tracing
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Connect shapes to model structure: trace the inputs, operation, and result before choosing.'
  remediation_scene: tensor-shape-tracing.s4
  variants:
  - id: tensor-shape-tracing.transfer.1
    prompt: A target broadcast creates all-pairs errors instead of per-example errors. What should be checked?
    options:
    - id: b
      text: Only the learning rate
    - id: c
      text: Only the final file size
    - id: a
      text: Axis alignment and explicit target shape
    answer: a
    feedback: A valid broadcast can still implement the wrong objective.
  - id: tensor-shape-tracing.transfer.2
    prompt: A tensor has 100 elements. Is that enough to know its memory in bytes?
    options:
    - id: c
      text: Yes; every element uses 100 bytes
    - id: a
      text: No; element type and storage details matter
    - id: b
      text: Yes; every element uses one byte
    answer: a
    feedback: Element count must be combined with storage format and allocation behavior.
