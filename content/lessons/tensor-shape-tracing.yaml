  routes:
    - id: route.core
      scene_sequence:
        - tensor-shape-tracing.s1
        - tensor-shape-tracing.s2
        - tensor-shape-tracing.s3
        - tensor-shape-tracing.s4
        - tensor-shape-tracing.s5
        - tensor-shape-tracing.s6
