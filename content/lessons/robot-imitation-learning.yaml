assessment_families:
  - id: robot-imitation-learning.base
    objective_ref: objective.robot-imitation-learning
    task: base
    response_type: single_choice
    points: 1
    hint: 'Predict one action or a short sequence: trace the inputs, operation, and result before choosing.'
    remediation_scene: robot-imitation-learning.s2
    variants:
      - id: robot-imitation-learning.base.1
        prompt: Why identify whether an action is velocity or position?
        options:
          - id: a
            text: The controller interprets them differently
          - id: b
            text: Only the dataset title changes
          - id: c
            text: Both are always interchangeable
        answer: a
        feedback: Action semantics define execution.
        retired: true
      - id: robot-imitation-learning.base.2
        prompt: What can long open-loop action chunks miss?
        options:
          - id: b
            text: Every possible computational benefit
          - id: c
            text: Only token formatting
          - id: a
            text: Changes requiring immediate feedback
        answer: a
        feedback: Longer intervals between feedback can reduce responsiveness.
        retired: true
  - id: robot-imitation-learning.transfer
    objective_ref: objective.robot-imitation-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate recovery and new conditions: trace the inputs, operation, and result before choosing.'
    remediation_scene: robot-imitation-learning.s4
    variants:
      - id: robot-imitation-learning.transfer.1
        prompt: Two safe paths go around opposite sides of an obstacle. Is their average necessarily safe?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if both experts succeed
          - id: a
            text: 'No'
        answer: a
        feedback: Averaging modes can produce an invalid path.
        retired: true
      - id: robot-imitation-learning.transfer.2
        prompt: Does low imitation loss establish robust physical success?
        options:
          - id: c
            text: Only if the demonstrations are videos
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Closed-loop distribution shift and constraints require evaluation.
        retired: true
  - id: robot-imitation-learning.base.v2
    objective_ref: objective.robot-imitation-learning
    task: base
    response_type: single_choice
    points: 1
    hint: "Squared-error cloning predicts the mean of the demonstrated actions; chunking cuts the number of decisions; a generative policy samples one mode at a time."
    remediation_scene: robot-imitation-learning.s3
    variants:
      - id: robot-imitation-learning.base.v2.1
        prompt: Half of a robot's demonstrations pass left of an obstacle and half pass right. A policy trained with squared error drives into the obstacle. Why?
        options:
          - id: b
            text: It follows whichever side appeared more often in the demos
          - id: c
            text: Two conflicting answers make its training loss diverge
          - id: a
            text: It predicts the average action, which lies between the two paths
        answer: a
        feedback: Squared error is minimized by the mean, and the mean of +0.15 and −0.15 is 0, inside the obstacle. It doesn't pick the majority side; with a 60/40 split it would still land near the middle. Training converges fine, to the wrong answer.
      - id: robot-imitation-learning.base.v2.2
        prompt: A 10-second task runs at 50 Hz. A policy predicts chunks of 100 actions instead of one action at a time. What is the main benefit?
        options:
          - id: a
            text: 500 steps become 5 decisions, so errors have fewer chances to compound
          - id: c
            text: The policy reacts faster to surprises in the middle of each chunk
          - id: b
            text: The policy needs one hundredth as many demonstrations to train
        answer: a
        feedback: Chunking shortens the effective horizon from 500 decisions to 5, which limits compounding and smooths the motion. The trade-off runs the other way for surprises, since the robot isn't re-deciding within a chunk, and the demonstration count doesn't shrink by 100.
      - id: robot-imitation-learning.base.v2.3
        prompt: How does Diffusion Policy avoid averaging two valid ways around an obstacle?
        options:
          - id: b
            text: It averages the two modes more smoothly than squared error does
          - id: a
            text: Each sample starts from random noise and is denoised into one real path
          - id: c
            text: It trains one network per mode and switches between them by a rule
        answer: a
        feedback: A diffusion model represents the whole distribution of action sequences. Different starting noise is denoised toward different modes, so each sample is a complete left or right path. It doesn't average at all, and it's a single network.
      - id: robot-imitation-learning.base.v2.4
        prompt: A cloned policy works well for the first few seconds, then drifts off course and never recovers. What best explains the pattern?
        options:
          - id: c
            text: The motors warm up during the run, so later actions come out weaker
          - id: b
            text: The learning rate was too high, so later actions were learned poorly
          - id: a
            text: Small errors lead to states the demos never showed, where it errs more
        answer: a
        feedback: This is compounding error. The demos covered the states near the expert's path, not the slightly-off states the clone drifts into, so its mistakes feed on each other. DAgger-style corrections or chunking help; motor heat and learning rate don't explain a time-dependent drift.
  - id: robot-imitation-learning.transfer.v2
    objective_ref: objective.robot-imitation-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: "Name the failure: averaging several valid choices, drifting into unseen states, reacting too slowly inside a chunk, or a mismatch between recorded and executed actions."
    remediation_scene: robot-imitation-learning.s2
    variants:
      - id: robot-imitation-learning.transfer.v2.1
        prompt: A driving policy learns highway merges from human logs. Half the drivers merge ahead of a truck and half fall in behind it. The cloned policy aims for the truck's side. What fixes this?
        options:
          - id: b
            text: Collect several times as many merge logs from the same drivers
          - id: a
            text: Use a policy that models several modes, such as a diffusion policy
          - id: c
            text: Train a larger network with the same squared-error loss
        answer: a
        feedback: Ahead-or-behind is a multimodal choice, and squared error averages it into the truck. A model of the full action distribution picks one mode per sample. More logs or a bigger network just learn the same average more precisely.
      - id: robot-imitation-learning.transfer.v2.2
        prompt: A warehouse picking policy sometimes wobbles, and an operator takes over with a joystick to recover. How should the team use those takeovers?
        options:
          - id: a
            text: Add the states and the operator's actions to training data
          - id: b
            text: Discard those runs, since they aren't clean demonstrations
          - id: c
            text: Use them only to count failures, keeping them out of training
        answer: a
        feedback: Takeovers are expert labels for exactly the off-course states the policy reaches, the DAgger idea. Discarding them throws away the recovery data the clone is missing; counting them is useful too, but it doesn't teach anything.
      - id: robot-imitation-learning.transfer.v2.3
        prompt: A kitchen robot executes 2-second action chunks without re-checking its camera. A cat bumps the cup half a second into a chunk, and the gripper closes on empty air. What change helps most?
        options:
          - id: c
            text: Use longer chunks so the robot's motions stay smoother
          - id: b
            text: Collect more demonstrations in kitchens with no cats
          - id: a
            text: Execute less of each chunk before predicting a new one
        answer: a
        feedback: Long open-loop chunks can't react to surprises. Replanning more often (or blending overlapping chunks, as ACT's temporal ensembling does) restores feedback. Longer chunks make it worse, and avoiding cats doesn't cover the next surprise.
      - id: robot-imitation-learning.transfer.v2.4
        prompt: Demonstrations recorded each action as "move the gripper this much since the last step" at 10 Hz. The deployed controller sends the policy's actions at 50 Hz. What goes wrong?
        options:
          - id: a
            text: Each step's move is applied five times as often, so the arm goes 5× too fast
          - id: b
            text: The arm moves at one fifth of the demonstrated speed
          - id: c
            text: Nothing, as the policy predicts positions that don't depend on timing
        answer: a
        feedback: A per-step change applied at 50 Hz instead of 10 Hz is applied five times as often per second, so the arm moves five times as fast. The recorded action format, including its rate, is part of the interface the robot must match.
  - id: robot-imitation-learning.calculate
    objective_ref: objective.robot-imitation-learning
    task: base
    response_type: numeric
    points: 1
    hint: "A squared-error policy outputs the weighted average: multiply each side's offset by its share of the demonstrations and add."
    remediation_scene: robot-imitation-learning.s3
    absolute_tolerance: 0.005
    variants:
      - id: robot-imitation-learning.calculate.1
        prompt: Demonstrations pass an obstacle at y = +0.2 ft half the time and y = −0.2 ft half the time. What y does a squared-error behavior-cloning policy output, in feet?
        answer: 0
        feedback: "0.5 × 0.2 + 0.5 × (−0.2) = 0: straight through the obstacle."
      - id: robot-imitation-learning.calculate.2
        prompt: 70% of demonstrations pass at y = +0.2 ft and 30% at y = −0.2 ft. What y does a squared-error policy output, in feet?
        answer: 0.08
        feedback: "0.7 × 0.2 + 0.3 × (−0.2) = 0.14 − 0.06 = 0.08 ft. Not the majority's 0.2: the minority still drags the mean toward the middle."
      - id: robot-imitation-learning.calculate.3
        prompt: 60% of demonstrations pass at y = +0.15 ft and 40% at y = −0.15 ft. What y does a squared-error policy output, in feet?
        answer: 0.03
        feedback: "0.6 × 0.15 + 0.4 × (−0.15) = 0.09 − 0.06 = 0.03 ft."
      - id: robot-imitation-learning.calculate.4
        prompt: Three demonstrations pass at y = +0.1 ft, +0.1 ft, and −0.2 ft. What y does a squared-error policy output, in feet?
        answer: 0
        feedback: "(0.1 + 0.1 − 0.2) / 3 = 0 ft."
      - id: robot-imitation-learning.calculate.5
        prompt: 80% of demonstrations pass at y = +0.25 ft and 20% at y = −0.25 ft. What y does a squared-error policy output, in feet?
        answer: 0.15
        feedback: "0.8 × 0.25 + 0.2 × (−0.25) = 0.2 − 0.05 = 0.15 ft."
