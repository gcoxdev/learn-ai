schema_version: 0.2-draft
lesson:
  id: robot-imitation-learning
  version: 0.1.0-draft
  title: Learn physical actions from demonstrations
  state: draft
  summary: Robot imitation learning maps observations to demonstrated actions or trajectories; collection interfaces,
    action representations, distribution shift, and execution constraints determine transfer.
  slot: M30.5
  category: learning
  minutes: 12
  sources:
  - title: Learning Fine-Grained Bimanual Manipulation with Low-Cost Hardware
    url: https://arxiv.org/abs/2304.13705
  - title: Diffusion Policy
    url: https://arxiv.org/abs/2303.04137
objectives:
- id: objective.robot-imitation-learning
  version: 1-draft
  statement: Robot imitation learning maps observations to demonstrated actions or trajectories; collection interfaces,
    action representations, distribution shift, and execution constraints determine transfer.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - robot-imitation-learning.base
  - robot-imitation-learning.transfer
  prerequisites:
  - anyOf:
    - objective.offline-rl-and-imitation
  - anyOf:
    - objective.kinematics-and-motion-planning
scenes:
- id: robot-imitation-learning.s1
  title: Record the observation-action relationship
  type: explanation
  depth: intuition
  objective_refs:
  - objective.robot-imitation-learning
  markdown: A demonstration can come from teleoperation, kinesthetic teaching, or another controller. Align images,
    joint states, commands, and timestamps. The recorded action might be a joint target, velocity, force, or end-effector
    displacement; these are different interfaces with different execution assumptions.
  text_mode: A demonstration can come from teleoperation, kinesthetic teaching, or another controller. Align images,
    joint states, commands, and timestamps. The recorded action might be a joint target, velocity, force, or end-effector
    displacement; these are different interfaces with different execution assumptions.
  bridges: []
- id: robot-imitation-learning.s2
  title: Predict one action or a short sequence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.robot-imitation-learning
  markdown: Behavior cloning can predict the next action, while action-chunking methods predict several future actions
    together. A chunk can improve temporal coherence and amortize inference, but executing too long without feedback
    can miss a changing obstacle or contact condition.
  text_mode: Behavior cloning can predict the next action, while action-chunking methods predict several future
    actions together. A chunk can improve temporal coherence and amortize inference, but executing too long without
    feedback can miss a changing obstacle or contact condition.
  bridges: []
- id: robot-imitation-learning.s3
  title: Handle multiple valid demonstrations
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.robot-imitation-learning
  markdown: Two experts may move around opposite sides of an obstacle. Averaging their trajectories coordinate by
    coordinate could pass through the obstacle. Multimodal action distributions or sequence-generating policies
    can represent alternatives, but still require constraints and closed-loop evaluation.
  text_mode: Two experts may move around opposite sides of an obstacle. Averaging their trajectories coordinate
    by coordinate could pass through the obstacle. Multimodal action distributions or sequence-generating policies
    can represent alternatives, but still require constraints and closed-loop evaluation.
  bridges: []
- id: robot-imitation-learning.s4
  title: Evaluate recovery and new conditions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.robot-imitation-learning
  markdown: Measure success across object poses, lighting, demonstrators, and initial states, including small deviations
    from the demonstrations. A policy that works only on the exact recorded setup has limited transfer. Provide
    controlled recovery behavior and avoid treating imitation loss as a complete physical performance metric.
  text_mode: Measure success across object poses, lighting, demonstrators, and initial states, including small deviations
    from the demonstrations. A policy that works only on the exact recorded setup has limited transfer. Provide
    controlled recovery behavior and avoid treating imitation loss as a complete physical performance metric.
  bridges: []
- id: robot-imitation-learning.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.robot-imitation-learning
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Robot imitation learning maps observations to demonstrated actions or trajectories; collection interfaces,
    action representations, distribution shift, and execution constraints determine transfer.
- id: robot-imitation-learning.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.robot-imitation-learning
  markdown: Robot imitation learning maps observations to demonstrated actions or trajectories; collection interfaces,
    action representations, distribution shift, and execution constraints determine transfer.
  text_mode: Robot imitation learning maps observations to demonstrated actions or trajectories; collection interfaces,
    action representations, distribution shift, and execution constraints determine transfer.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - robot-imitation-learning.s1
    - robot-imitation-learning.s2
    - robot-imitation-learning.s3
    - robot-imitation-learning.s4
    - robot-imitation-learning.check
    gate_refs:
