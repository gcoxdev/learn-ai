schema_version: 0.2-draft
lesson:
  id: robot-imitation-learning
  version: 0.4.0-draft
  title: Learn physical actions from demonstrations
  state: draft
  summary: Half your demonstrations steer left of the fruit bowl and half steer right. Train a robot to copy them the obvious way and it drives straight into the bowl. Here's why, and the fixes.
  slot: M30.5
  category: learning
  sources:
    - title: "Learning Fine-Grained Bimanual Manipulation with Low-Cost Hardware (ALOHA and ACT; Zhao et al., 2023)"
      url: https://arxiv.org/abs/2304.13705
    - title: "Diffusion Policy: Visuomotor Policy Learning via Action Diffusion (Chi et al., 2023)"
      url: https://arxiv.org/abs/2303.04137
    - title: "A Reduction of Imitation Learning and Structured Prediction to No-Regret Online Learning (DAgger; Ross, Gordon & Bagnell, 2011)"
      url: https://arxiv.org/abs/1011.0686
objectives:
  - id: objective.robot-imitation-learning
    version: 2-draft
    statement: Explain how robot demonstrations are recorded, why behavior-cloning errors compound and how action chunking and expert corrections help, and why averaging multimodal demonstrations fails while generative policies such as Diffusion Policy succeed.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - robot-imitation-learning.base.v2
      - robot-imitation-learning.transfer.v2
      - robot-imitation-learning.calculate
    prerequisites:
      - anyOf:
          - objective.offline-rl-and-imitation
      - anyOf:
          - objective.kinematics-and-motion-planning
scenes:
  - id: robot-imitation-learning.s1
    title: Teach Tidy by doing it yourself
    type: explanation
    depth: intuition
    objective_refs:
      - objective.robot-imitation-learning
    markdown: |-
      Writing the rules for "slide the mug off the table, turn it, and rack it upside down" is hopeless: every mug and every table is a little different. It's far easier to *show* Tidy, forty times, and let it learn the pattern.

      There are two common ways to record a **demonstration**:

      - **Teleoperation**: a person drives the robot remotely. In the ALOHA setup (Zhao et al., 2023), the operator moves a pair of small "leader" arms by hand, and the robot's "follower" arms copy every joint in real time.
      - **Kinesthetic teaching**: a person physically pushes the robot's own arm through the motion.

      Each demonstration becomes a stream of pairs, logged many times a second: an **observation** (camera images plus joint angles) and the **action** taken (for example, the next target angle for each joint). The recorded action format matters. "Joint targets at 50 Hz" and "gripper velocity at 10 Hz" are different languages, and the robot at test time must speak the one it learned.

      Training a network to predict the demonstrated action from the observation is **behavior cloning (BC)**: ordinary supervised learning, with the demonstrator as the label source.
    bridges: []
  - id: robot-imitation-learning.s2
    title: Small slips snowball, so predict in chunks
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.robot-imitation-learning
    markdown: |-
      The lesson on learning from recorded decisions showed BC's classic weakness. A small mistake takes the robot to a state no demonstration visited, where its next mistake is likelier, and so on. In Ross and Bagnell's analysis (2010), with a per-step error rate $\epsilon$ over $T$ steps, a clone's expected cost can grow like $\epsilon T^2$, not $\epsilon T$.

      Robots make this painful because $T$ is huge. Tidy decides 50 times a second, so a 10-second mug pick is $T = 500$ decisions. Double the task length and $\epsilon T$ doubles, but $\epsilon T^2$ quadruples.

      Two fixes attack it from different sides:

      - **Collect the missing states.** DAgger (Ross, Gordon & Bagnell, 2011) has an expert label the states the *learner* reaches. On a robot this often looks like a person taking over with the teleop arms whenever the policy wobbles, and adding those corrections to the training data.
      - **Make fewer decisions.** **Action chunking** predicts the next $k$ actions at once. ACT (Action Chunking with Transformers, Zhao et al., 2023) runs at 50 Hz with chunks of $k = 100$ actions, two seconds of motion. Tidy's 500 steps become just 5 decisions, so there are far fewer chances for errors to feed on each other.

      :::predict A 12-second task at 50 Hz uses chunks of k = 50. How many decisions does the policy make?
      12 × 50 = 600 steps, and 600 / 50 = 12 chunks. The effective horizon falls from 600 to 12.
      :::

      Chunks have a cost: during a long chunk the robot isn't reacting to what it sees. ACT softens this with **temporal ensembling**: it predicts a fresh chunk every step and blends the overlapping predictions for the current moment, weighting them with exponentially decaying weights.
    bridges: []
  - id: robot-imitation-learning.s3
    title: Two good ways around a bowl average to a crash
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.robot-imitation-learning
    markdown: |-
      A small dipping bowl, 0.08 ft in radius, sits in the middle of Tidy's route across the table. In your forty demonstrations you steered around it: twenty times on the left, passing at $y = +0.15$ ft, and twenty on the right, at $y = -0.15$ ft. Both are perfect.

      BC trained with squared error predicts, for each observation, the action that minimizes the average squared error, which is the *mean* of the demonstrated actions:

      $$\hat{y} = \tfrac{1}{2}(+0.15) + \tfrac{1}{2}(-0.15) = 0$$

      Straight through the bowl. Distributions with several separate peaks like this are called **multimodal**, and averaging a multimodal set lands between the peaks, exactly where no demonstrator ever went. (Here "multimodal" means several distinct valid actions, not several input types.)

      ```python run
      import numpy as np

      rng = np.random.default_rng(1)
      BOWL_RADIUS = 0.08                        # a small dipping bowl sits at y = 0 on Tidy's route (ft)
      # 40 demos: the gripper's sideways offset as it passes the bowl (+ = left, - = right)
      left = rng.random(40) < 0.5
      demos = np.where(left, 0.15, -0.15) + rng.normal(0, 0.01, 40)
      print(f"{left.sum()} demos go left, {(~left).sum()} go right")

      def verdict(y):
          return "CRASH" if abs(y) < BOWL_RADIUS else "clear"

      # Behavior cloning with squared error learns the average action
      avg = demos.mean()
      print(f"squared-error policy:  y = {avg:+.3f} ft  {verdict(avg)}")

      # A policy that models both modes: pick a side as often as the demos did, then follow it
      for run in range(1, 5):
          side = rng.random() < left.mean()
          y = demos[left == side].mean()
          print(f"two-mode policy run {run}: y = {y:+.3f} ft  {verdict(y)}")
      ```

      The average passes at $-0.001$ ft, dead center. The two-mode policy goes left on some runs and right on others, and clears the bowl every time. Change `0.5` to `0.8` so most demos go left: the average moves to $+0.096$ ft and scrapes past with under 0.02 ft to spare.

      :::mixup "Collect more demonstrations and the policy will learn which way to go."
      More data makes the estimate of the mean *more precise*, and the mean is still inside the bowl. The fix is a different kind of model, one that represents a whole distribution of actions and picks one mode at a time.
      :::
    bridges: []
  - id: robot-imitation-learning.diffusion
    title: "Diffusion Policy: sample a path, don't average"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.robot-imitation-learning
    markdown: |-
      **Diffusion Policy** (Chi et al., 2023) brings the image generators' trick to robot actions. Recall from the lesson on how an image can emerge from noise: a network learns to remove noise a little at a time, so it can turn pure noise into a realistic sample. Here the "image" is a short sequence of future actions, and the network also sees the current camera images.

      To act, Tidy starts from a random action sequence and denoises it step by step, conditioned on what it sees. Different starting noise lands on different modes: one run produces a clean left-hand path, another a clean right-hand path, but never the blurry average. Like ACT, it plans a chunk (for example, 16 steps), executes part of it (8 steps), then plans again from the new observation.

      :::papers The training objective
      For a demonstrated action sequence $A^0$, observation $O$, random noise $\epsilon$, and noise level $k$:

      $$\mathcal{L} = \big\|\, \epsilon - \epsilon_\theta\big(O,\; \sqrt{\bar\alpha_k}\,A^0 + \sqrt{1-\bar\alpha_k}\,\epsilon,\; k\big) \big\|^2$$

      This is the standard denoising loss with the observation added as a condition: corrupt a real action sequence, and train $\epsilon_\theta$ to predict the noise. The network never has to output one best action. At sampling time, each small denoising step nudges the sequence toward the demonstrations it most resembles, so a sample that starts slightly left ends up as a whole left-hand path.
      :::

      ACT tackles the same problem differently: it's trained as a conditional variational autoencoder, whose latent variable can encode "which way this demonstrator went".
    bridges: []
  - id: robot-imitation-learning.s4
    title: Test it where the demos weren't
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.robot-imitation-learning
    markdown: |-
      A low training loss says Tidy copies the demos on the demo states. The real test is new ones: nudge the mug 0.05 ft off its usual spot, try a taller mug, dim the lights, bump the arm mid-motion. Count the successes, and count every time a person had to step in, since a policy that needs rescuing on one run in five isn't finished. Each rescue, recorded, is also a ready-made DAgger-style correction for the next round of training.
    bridges: []
  - id: robot-imitation-learning.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.robot-imitation-learning
    markdown: Average some split demonstrations by hand, then advise a self-driving merge, a warehouse picker with human takeovers, a policy that ignores a cat, and a replay at the wrong rate.
    takeaway: |-
      Behavior cloning copies demonstrations but its slips compound; chunking and expert corrections help. When demos disagree, squared error averages them into a path nobody took, so use a model that samples one mode, like Diffusion Policy.
  - id: robot-imitation-learning.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.robot-imitation-learning
    markdown: |-
      Robot imitation learns demonstrated actions in a specific control interface. Preserve valid alternatives and test how the policy recovers outside the demonstrated situations.
