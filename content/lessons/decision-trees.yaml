assessment_families:
  - id: decision-trees.base
    objective_ref: objective.decision-trees
    task: base
    response_type: single_choice
    points: 1
    hint: 'Choose a split that improves a criterion: trace the inputs, operation, and result before choosing.'
    remediation_scene: decision-trees.s2
    variants:
      - id: decision-trees.base.1
        prompt: A tree leaf normally supplies what?
        options:
          - id: c
            text: A guarantee of causal effect
          - id: a
            text: A prediction or class distribution for its region
          - id: b
            text: A new raw input feature automatically
        answer: a
        feedback: The leaf summarizes the target behavior for examples routed there.
        retired: true
      - id: decision-trees.base.2
        prompt: Which split is purer for labels [A, A, B, B]?
        options:
          - id: a
            text: '[A, A] versus [B, B]'
          - id: b
            text: '[A, B] versus [A, B]'
          - id: c
            text: Both always equal
        answer: a
        feedback: Separating classes removes within-leaf label mixing in this example.
        retired: true
  - id: decision-trees.transfer
    objective_ref: objective.decision-trees
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Interpret a path with care: trace the inputs, operation, and result before choosing.'
    remediation_scene: decision-trees.s4
    variants:
      - id: decision-trees.transfer.1
        prompt: A tree has one leaf per training example and zero training error. What needs checking?
        options:
          - id: a
            text: Generalization and complexity control
          - id: b
            text: Whether zero training error proves perfect deployment
          - id: c
            text: Only the number of printed branches
        answer: a
        feedback: A deep tree can memorize noise and idiosyncrasies.
        retired: true
      - id: decision-trees.transfer.2
        prompt: A decision path uses income to predict an outcome. Does that establish changing income would cause the predicted change?
        options:
          - id: b
            text: Yes; tree rules are causal by definition
          - id: c
            text: Only if the threshold is an integer
          - id: a
            text: No; predictive splits do not establish interventions
        answer: a
        feedback: Causal claims require additional assumptions and evidence.
        retired: true
  - id: decision-trees.base.v2
    objective_ref: objective.decision-trees
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: For each child, Gini = 1 − (sum of the squared class fractions). Then weight each child by its share of the examples before adding.
    remediation_scene: decision-trees.s2
    variants:
      - id: decision-trees.base.v2.1
        prompt: 'A split sends 8 examples into two children. Left: 4 of class A, 0 of class B. Right: 1 of A, 3 of B. Find each child''s Gini impurity and the size-weighted Gini of the split.'
        feedback: Left is pure, so its Gini is 0. Right is 1 − (1/4)² − (3/4)² = 1 − 0.0625 − 0.5625 = 0.375. Each child holds half the examples, so the weighted Gini is 0.5 × 0 + 0.5 × 0.375 ≈ 0.19.
        answers:
          left: 0
          right: 0.375
          weighted: 0.1875
        reason_answer: share
        reason_options:
          - id: share
            text: Each child counts in proportion to how many examples it holds.
          - id: equal
            text: The two children count equally, whatever their sizes.
          - id: sum
            text: The two children's impurities are simply added together.
      - id: decision-trees.base.v2.2
        prompt: 'A split sends 10 examples into two children. Left: 4 paid, 1 cancelled. Right: 1 paid, 4 cancelled. Find each child''s Gini impurity and the size-weighted Gini of the split.'
        feedback: Each child is 1 − 0.8² − 0.2² = 1 − 0.64 − 0.04 = 0.32. They are the same size, so the weighted Gini is also 0.32, down from 0.5 before the split.
        answers:
          left: 0.32
          right: 0.32
          weighted: 0.32
        reason_answer: share
        reason_options:
          - id: equal
            text: The two children count equally, whatever their sizes.
          - id: share
            text: Each child counts in proportion to how many examples it holds.
          - id: sum
            text: The two children's impurities are simply added together.
      - id: decision-trees.base.v2.3
        prompt: 'A split sends 10 examples into two children. Left: 1 spam, 1 not spam. Right: 0 spam, 8 not spam. Find each child''s Gini impurity and the size-weighted Gini of the split.'
        feedback: Left is 1 − 0.5² − 0.5² = 0.5; right is pure, 0. Left holds only 2 of the 10 examples, so the weighted Gini is 0.2 × 0.5 + 0.8 × 0 = 0.1. An unweighted average would give 0.25, overstating the small mixed group.
        answers:
          left: 0.5
          right: 0
          weighted: 0.1
        reason_answer: share
        reason_options:
          - id: sum
            text: The two children's impurities are simply added together.
          - id: equal
            text: The two children count equally, whatever their sizes.
          - id: share
            text: Each child counts in proportion to how many examples it holds.
      - id: decision-trees.base.v2.4
        prompt: 'A split sends 10 examples into two children. Left: 3 defective, 3 fine. Right: 4 defective, 0 fine. Find each child''s Gini impurity and the size-weighted Gini of the split.'
        feedback: Left is 1 − 0.5² − 0.5² = 0.5, and the pure right child is 0. Left holds 6 of the 10 examples, so the weighted Gini is 0.6 × 0.5 + 0.4 × 0 = 0.3.
        answers:
          left: 0.5
          right: 0
          weighted: 0.3
        reason_answer: share
        reason_options:
          - id: share
            text: Each child counts in proportion to how many examples it holds.
          - id: sum
            text: The two children's impurities are simply added together.
          - id: equal
            text: The two children count equally, whatever their sizes.
    absolute_tolerance: 0.005
    numeric_fields:
      - id: left
        label: Gini of the left child
      - id: right
        label: Gini of the right child
      - id: weighted
        label: Size-weighted Gini of the split
  - id: decision-trees.transfer.v2
    objective_ref: objective.decision-trees
    task: transfer
    response_type: single_choice
    points: 1
    hint: Compare splits by size-weighted impurity, choose depth and pruning on validation data, and read a split as a pattern to test rather than a cause.
    remediation_scene: decision-trees.s4
    variants:
      - id: decision-trees.transfer.v2.1
        prompt: 'A bank tries three loan-approval trees. Depth 2: 80% training, 79% validation accuracy. Depth 5: 88% training, 85% validation. Depth 15: 99% training, 78% validation. Which should it keep?'
        options:
          - id: a
            text: Depth 15, since it fits the training loans best
          - id: b
            text: Depth 5, since it does best on the validation loans
          - id: c
            text: Depth 2, since its two scores are the closest together
        answer: b
        feedback: Validation accuracy stands in for new loans, and depth 5 leads there. Depth 15's 99% training score is memorization; depth 2 has the smallest gap but underfits, trailing depth 5 on both sets.
      - id: decision-trees.transfer.v2.2
        prompt: A fraud team raises the pruning penalty α (the cost per leaf) from 0.1 to 5 before pruning its tree. What should they expect?
        options:
          - id: a
            text: A bigger tree, since a larger α rewards each extra split made
          - id: b
            text: The same leaves with new thresholds inside each split
          - id: c
            text: A smaller tree, with perhaps a few more training errors
        answer: c
        feedback: Each leaf now costs 5 instead of 0.1, so a branch survives only if it removes more than 5 training errors per extra leaf. Most don't, so the tree shrinks and trades a few training errors for simplicity. α changes how many leaves are kept, not the thresholds.
      - id: decision-trees.transfer.v2.3
        prompt: Two analysts grow trees on the same 5,000 customers, but one accidentally dropped 20 rows. One tree's first split is on income, the other's is on age. What is the most likely explanation?
        options:
          - id: b
            text: One analyst has a bug, since the same data must give the same tree
          - id: c
            text: Age must be the true cause, since it held up with fewer rows
          - id: a
            text: Income and age nearly tied, so a few rows flipped the choice
        answer: a
        feedback: Greedy splitting picks the single best-scoring question, so near-ties can swap when a few rows change, and everything below the first split changes too. The data weren't the same (20 rows differed), and winning a split says nothing about cause.
      - id: decision-trees.transfer.v2.4
        prompt: A hospital's readmission tree splits first on "visited the pharmacy within 3 days of discharge." A manager proposes requiring every patient to visit the pharmacy. What is the best response?
        options:
          - id: c
            text: Run a trial first; the split shows a pattern, not a cause
          - id: a
            text: Go ahead, since this is the feature that reduces impurity most
          - id: b
            text: Prune the tree first, then trust whichever splits remain
        answer: c
        feedback: Patients who visit the pharmacy may differ in many ways, such as being healthier or better supported, so the split may mark them rather than help them. A trial shows whether the requirement changes readmissions. Impurity and pruning describe prediction, not cause.
      - id: decision-trees.transfer.v2.5
        prompt: 'Split A gives children with Gini 0.1 (20 examples) and 0.4 (80 examples). Split B gives two children of 50 examples with Gini 0.3 each. Which split does a Gini-based tree choose?'
        options:
          - id: c
            text: A, since its children's Gini values average 0.25, below 0.3
          - id: a
            text: A, since one of its two children is very nearly pure
          - id: b
            text: B, since its weighted Gini is 0.3 against A's 0.34
        answer: b
        feedback: Weighted by size, A scores 0.2 × 0.1 + 0.8 × 0.4 = 0.34 and B scores 0.3, so B wins. The simple average of 0.25 ignores that A's nearly pure child holds only 20 of the 100 examples.
