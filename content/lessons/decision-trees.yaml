schema_version: 0.2-draft
lesson:
  id: decision-trees
  version: 0.1.0-draft
  title: Split a dataset into simpler regions
  state: draft
  summary: Decision trees make predictions through feature tests; split criteria, depth, leaf size, and pruning
    control how closely they fit the training data.
  slot: M07.4
  category: learning
  minutes: 12
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.decision-trees
  version: 1-draft
  statement: Decision trees make predictions through feature tests; split criteria, depth, leaf size, and pruning
    control how closely they fit the training data.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - decision-trees.base
  - decision-trees.transfer
  prerequisites:
  - anyOf:
    - objective.data
  - anyOf:
    - objective.probability
scenes:
- id: decision-trees.s1
  title: Follow a sequence of questions
  type: explanation
  depth: intuition
  objective_refs:
  - objective.decision-trees
  markdown: A tree routes an example through tests such as area < 50 and age < 10. A leaf returns a class distribution
    or numerical estimate. Each path defines a region of feature space. The model is piecewise defined rather than
    one global linear formula.
  text_mode: A tree routes an example through tests such as area < 50 and age < 10. A leaf returns a class distribution
    or numerical estimate. Each path defines a region of feature space. The model is piecewise defined rather than
    one global linear formula.
  bridges: []
- id: decision-trees.s2
  title: Choose a split that improves a criterion
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.decision-trees
  markdown: Classification splits may reduce Gini impurity or entropy; regression splits may reduce squared error.
    Suppose four labels are [A, A, B, B]. A feature test separating the first pair from the second creates two pure
    leaves. A test producing [A, B] on each side does not improve purity.
  text_mode: Classification splits may reduce Gini impurity or entropy; regression splits may reduce squared error.
    Suppose four labels are [A, A, B, B]. A feature test separating the first pair from the second creates two pure
    leaves. A test producing [A, B] on each side does not improve purity.
  bridges:
  - probability
- id: decision-trees.s3
  title: Control the temptation to memorize
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.decision-trees
  markdown: A sufficiently deep tree can isolate individual training examples, including noise. Maximum depth, minimum
    leaf size, and pruning restrict that complexity. A shallow tree may miss interactions. Use validation to select
    a useful level of complexity rather than rewarding training purity alone.
  text_mode: A sufficiently deep tree can isolate individual training examples, including noise. Maximum depth,
    minimum leaf size, and pruning restrict that complexity. A shallow tree may miss interactions. Use validation
    to select a useful level of complexity rather than rewarding training purity alone.
  bridges: []
- id: decision-trees.s4
  title: Interpret a path with care
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.decision-trees
  markdown: A readable path shows how this model reached a prediction, but correlated features can yield different
    plausible trees. A small data change may change an early split substantially. The tree’s condition is a predictive
    rule, not necessarily a causal explanation. Evaluate stability and performance outside the training sample.
  text_mode: A readable path shows how this model reached a prediction, but correlated features can yield different
    plausible trees. A small data change may change an early split substantially. The tree’s condition is a predictive
    rule, not necessarily a causal explanation. Evaluate stability and performance outside the training sample.
  bridges: []
- id: decision-trees.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.decision-trees
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Decision trees make predictions through feature tests; split criteria, depth, leaf size, and pruning
    control how closely they fit the training data.
- id: decision-trees.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.decision-trees
  markdown: Decision trees make predictions through feature tests; split criteria, depth, leaf size, and pruning
    control how closely they fit the training data.
  text_mode: Decision trees make predictions through feature tests; split criteria, depth, leaf size, and pruning
    control how closely they fit the training data.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - decision-trees.s1
    - decision-trees.s2
    - decision-trees.s3
    - decision-trees.s4
    - decision-trees.check
    gate_refs:
    - gate.core
  scene_aliases:
    decision-trees.recap: decision-trees.check
assessment_families:
- id: decision-trees.base
  objective_ref: objective.decision-trees
  task: base
  response_type: single_choice
  points: 1
  hint: 'Choose a split that improves a criterion: trace the inputs, operation, and result before choosing.'
  remediation_scene: decision-trees.s2
  variants:
  - id: decision-trees.base.1
    prompt: A tree leaf normally supplies what?
    options:
    - id: c
      text: A guarantee of causal effect
    - id: a
      text: A prediction or class distribution for its region
    - id: b
      text: A new raw input feature automatically
    answer: a
    feedback: The leaf summarizes the target behavior for examples routed there.
  - id: decision-trees.base.2
    prompt: Which split is purer for labels [A, A, B, B]?
    options:
    - id: a
      text: '[A, A] versus [B, B]'
    - id: b
      text: '[A, B] versus [A, B]'
    - id: c
      text: Both always equal
    answer: a
    feedback: Separating classes removes within-leaf label mixing in this example.
- id: decision-trees.transfer
  objective_ref: objective.decision-trees
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Interpret a path with care: trace the inputs, operation, and result before choosing.'
  remediation_scene: decision-trees.s4
  variants:
  - id: decision-trees.transfer.1
    prompt: A tree has one leaf per training example and zero training error. What needs checking?
    options:
    - id: a
      text: Generalization and complexity control
    - id: b
      text: Whether zero training error proves perfect deployment
    - id: c
      text: Only the number of printed branches
    answer: a
    feedback: A deep tree can memorize noise and idiosyncrasies.
  - id: decision-trees.transfer.2
    prompt: A decision path uses income to predict an outcome. Does that establish changing income would cause the
      predicted change?
    options:
    - id: b
      text: Yes; tree rules are causal by definition
    - id: c
      text: Only if the threshold is an integer
    - id: a
      text: No; predictive splits do not establish interventions
    answer: a
    feedback: Causal claims require additional assumptions and evidence.
