schema_version: 0.2-draft
lesson:
  id: agent-memory-and-context
  version: 0.4.0-draft
  title: Decide what to retain and what to show the model now
  state: draft
  summary: You told the assistant about your peanut allergy on Monday. Why did it suggest satay on Friday? Find out where an agent's memories live and how they get lost.
  slot: M25.4
  category: learning
  sources:
    - title: "Generative Agents: Interactive Simulacra of Human Behavior (Park et al., 2023)"
      url: https://arxiv.org/abs/2304.03442
    - title: "MemGPT: Towards LLMs as Operating Systems (Packer et al., 2023)"
      url: https://arxiv.org/abs/2310.08560
    - title: "Lost in the Middle: How Language Models Use Long Contexts (Liu et al., 2023)"
      url: https://arxiv.org/abs/2307.03172
    - title: ReAct
      url: https://arxiv.org/abs/2210.03629
objectives:
  - id: objective.agent-memory-and-context
    version: 2-draft
    statement: Working context, persistent records, retrieved memories, and learned parameters are different storage mechanisms; retrieval and summarization must preserve relevance, provenance, and correction.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - agent-memory-and-context.base.v2
      - agent-memory-and-context.transfer.v2
    prerequisites:
      - anyOf:
          - objective.tool-contracts-and-state
      - anyOf:
          - objective.lexical-information-retrieval
scenes:
  - id: agent-memory-and-context.s1
    title: Four places a fact can live
    type: explanation
    depth: intuition
    objective_refs:
      - objective.agent-memory-and-context
    markdown: |-
      On Monday you tell a meal-planning assistant, "I'm allergic to peanuts." On Friday, in a new conversation, it suggests chicken satay with peanut sauce. Nothing was broken, exactly. The fact simply wasn't anywhere the assistant looked on Friday.

      An agent can keep information in four very different places:

      | Where | What it holds | How it changes | Example |
      | --- | --- | --- | --- |
      | **Context** | The text the model receives for *this* turn | Rebuilt on every turn | Today's messages plus a few notes |
      | **Memory store** | Saved records: facts, events, preferences | Your program writes, edits, and deletes rows | "Allergy: peanuts (said 3 Mar)" |
      | **Retrieval** | Not storage: the step that picks records for the context | Runs each turn | Search the store for "dietary" |
      | **Weights** | Patterns learned during training | Only by training | Knowing what satay usually contains |

      The **context** (sometimes called the context window) is the only thing the model actually reads when it answers. A fact in the memory store helps only if retrieval puts it into the context. Your allergy was probably never written to the store, or was stored but not retrieved on Friday.
    diagram:
      caption: A memory-backed assistant. Only what reaches the context builder is visible to the model.
      description: A new message goes to a context builder, which also receives records retrieved from the memory store. The builder sends a prompt to the language model, which produces a reply. The model can propose new facts; a write-back check validates and dates them before they enter the memory store. The model's weights feed the model but stay fixed during use.
      nodes:
        - id: message
          label: New message
          col: 0
          row: 0
        - id: builder
          label: Context builder
          note: picks what fits
          col: 1
          row: 0
          tone: accent
        - id: model
          label: Language model
          col: 2
          row: 0
        - id: reply
          label: Reply
          col: 3
          row: 0
        - id: store
          label: Memory store
          note: fact + date + source
          col: 1
          row: 1
          tone: data
        - id: check
          label: Write-back check
          note: validate, date, scope
          col: 2
          row: 1
          tone: warn
        - id: weights
          label: Trained weights
          note: fixed during use
          col: 3
          row: 1
          tone: muted
      edges:
        - from: message
          to: builder
        - from: store
          to: builder
          label: retrieve
        - from: builder
          to: model
          label: prompt
        - from: model
