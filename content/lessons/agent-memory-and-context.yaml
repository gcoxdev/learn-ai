        - from: model
          to: check
          label: proposed fact
        - from: check
          to: store
          label: save
        - from: weights
          to: model
          dashed: true
  - id: agent-memory-and-context.s2
    title: Build the context on a budget
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.agent-memory-and-context
    markdown: |-
      Every turn, a **context builder** (a small piece of ordinary code) assembles the prompt from the pieces available. The model can accept only a fixed number of tokens, so the builder has to choose.

      Suppose the model accepts 8,000 tokens and you reserve 1,000 for the reply. That leaves 7,000 for the prompt:

      | Piece | Tokens | Running total |
      | --- | ---: | ---: |
      | Instructions and tool descriptions | 1,500 | 1,500 |
      | Today's conversation so far | 3,200 | 4,700 |
      | Retrieved memory notes (about 150 each) | ? | |

      :::predict How many retrieved notes still fit?
      7,000 − 4,700 = 2,300 tokens remain. At about 150 tokens per note, that is 15 notes, using 2,250 tokens. If the store holds 500 notes, retrieval must pick the 15 most useful, and the other 485 are invisible this turn.
      :::

      So the quality of memory depends as much on *choosing* as on *keeping*. A system that saves everything but retrieves poorly behaves like one that remembers nothing.

      :::mixup "Just give the model a bigger context window and paste in everything."
      Longer prompts cost more and respond more slowly. Models also tend to use information near the start and end of a long prompt more reliably than information buried in the middle (Liu et al., 2023, "Lost in the Middle"). A larger window lets you keep more; it doesn't remove the need to select.
      :::
  - id: agent-memory-and-context.s3
    title: Summaries drop the "unless"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.agent-memory-and-context
    markdown: |-
      Long histories are often compressed into summaries to save space. Summaries are useful, but they tend to drop exactly the details that matter later: conditions, exceptions, and who said what.

      A planning thread says: *"Book the venue if the quote stays under \$2,000; otherwise ask Dana first."* The saved summary reads: *"Decided to book the venue."* Three weeks later the quote arrives at \$2,600, and the assistant books it.

      Two habits prevent this:

      - **Keep a link to the source.** Store each summary with a pointer to the original messages, so the builder can fetch the full wording when a decision depends on it.
      - **Store conditions as fields, not prose.** A record like `{action: "book venue", condition: "quote < 2000", else: "ask Dana"}` is harder to paraphrase away.

      Keeping a record of where each fact came from is called **provenance**. Provenance lets the agent, and the person reviewing it, check a remembered fact instead of trusting it blindly.
  - id: agent-memory-and-context.s4
    title: When memories disagree, newer and authoritative wins
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.agent-memory-and-context
    markdown: |-
      Memories go stale. In March the team dinner is booked at Rosa's Trattoria; in mid-March Rosa's cancels and the booking moves to Harbor Grill. Both notes mention "team dinner venue," so a search that ranks only by similarity finds them equally relevant, and may return the old one.

      The fix is a **precedence rule**: a policy for which record wins when two conflict. Common rules are "newest wins," "the more authoritative source wins" (an email from the venue beats a chat guess), or both. Precedence needs data, so every stored fact should carry its date and source.

      Run the tiny memory below. Both notes match the question equally well; watch what changes when newer records take precedence.

      ```python run
      from datetime import date

      memory = [
          {"fact": "Team dinner venue: Rosa's Trattoria", "date": date(2026, 3, 2)},
          {"fact": "Team dinner venue: Harbor Grill (Rosa's cancelled)", "date": date(2026, 3, 16)},
          {"fact": "Maya is allergic to peanuts", "date": date(2026, 2, 20)},
      ]

      def overlap(question, text):
          """Count shared words: a stand-in for similarity search."""
          return len(set(question.lower().split()) & set(text.lower().split()))

      def recall(question, newest_wins):
          scores = [overlap(question, m["fact"]) for m in memory]
          best = [m for m, s in zip(memory, scores) if s == max(scores)]
          if newest_wins:
              best.sort(key=lambda m: m["date"], reverse=True)
          return best[0]["fact"]

      question = "where is the team dinner venue"
      print("similarity only:", recall(question, newest_wins=False))
      print("newest wins:    ", recall(question, newest_wins=True))
      ```

      With similarity alone, the tie is broken by whichever note happens to come first: the cancelled restaurant. Try adding a third, even newer note, or changing the question to mention "Harbor."

      :::papers How a research agent ranks its memories
      The *Generative Agents* paper (Park et al., 2023) gave simulated characters a long memory stream and retrieved memories by adding three normalized scores:

      $$\text{score} = \alpha_{\text{recency}}\,\text{recency} + \alpha_{\text{importance}}\,\text{importance} + \alpha_{\text{relevance}}\,\text{relevance}$$

      Recency decays exponentially with time since the memory was last used, importance is a 1–10 rating the model assigns when the memory is written, and relevance is the similarity between the memory and the current situation. Our "newest wins" rule is the simplest possible recency term.
      :::
  - id: agent-memory-and-context.s5
    title: Test the memory like a product feature
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.agent-memory-and-context
    markdown: |-
      You can measure memory directly by **planting** facts in early sessions and asking about them later. Suppose you plant 20 facts in a tutoring assistant, then correct 5 of them in later sessions.

      | Test | Result |
      | --- | --- |
      | Planted facts recalled correctly | 17 of 20 |
      | Corrected facts: answered with the *new* value | 3 of 5 |
      | Questions answered from another student's notes | 1 of 40 |

      Each row points to a different part of the system. The 3 misses send you to retrieval ranking. The 2 stale answers send you to precedence rules. The single cross-student answer is the most serious, because it is a privacy failure: memory lookups must be filtered by *whose* memory it is before similarity is even considered.

      :::key The design in one sentence
      Save facts with a date, a source, and an owner; retrieve by relevance, recency, and permission; and let the model see only what this turn needs.
      :::

      :::deeper Paging memory in and out
      MemGPT (Packer et al., 2023) treats the context like a computer's fast memory and the store like its disk. The model itself calls functions to move information between them, the way an operating system pages data in and out.
      :::
  - id: agent-memory-and-context.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.agent-memory-and-context
    markdown: Four new situations (a support chat, a travel assistant, a shared team workspace, and a tutoring bot) test whether you can tell where a memory failure happened.
    takeaway: |-
      The model only sees what reaches its context this turn. Store facts with a date, source, and owner so the right ones can be retrieved, updated, and kept private.
  - id: agent-memory-and-context.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.agent-memory-and-context
    markdown: |-
      Separate what is in the current prompt from what is stored for later. Useful memory must be relevant, traceable to a source, and correctable when facts change.
