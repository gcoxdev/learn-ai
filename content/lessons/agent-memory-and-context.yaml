assessment_families:
  - id: agent-memory-and-context.base
    objective_ref: objective.agent-memory-and-context
    task: base
    response_type: single_choice
    points: 1
    hint: 'Construct context for a purpose: trace the inputs, operation, and result before choosing.'
    remediation_scene: agent-memory-and-context.s2
    variants:
      - id: agent-memory-and-context.base.1
        prompt: Are model weights and an editable task database the same memory mechanism?
        options:
          - id: c
            text: Only if both store numbers
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: They have different interfaces and update semantics.
        retired: true
      - id: agent-memory-and-context.base.2
        prompt: What can a summary lose?
        options:
          - id: a
            text: Qualifications and source detail
          - id: b
            text: Nothing by definition
          - id: c
            text: Only font choices
        answer: a
        feedback: Compression can omit information needed later.
        retired: true
  - id: agent-memory-and-context.transfer
    objective_ref: objective.agent-memory-and-context
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate retrieval as well as retention: trace the inputs, operation, and result before choosing.'
    remediation_scene: agent-memory-and-context.s4
    variants:
      - id: agent-memory-and-context.transfer.1
        prompt: An old and new meeting date conflict. What is needed?
        options:
          - id: a
            text: Source and update precedence rules
          - id: b
            text: Only the most similar wording
          - id: c
            text: Random selection
        answer: a
        feedback: Freshness and authority resolve record conflicts.
        retired: true
      - id: agent-memory-and-context.transfer.2
        prompt: Does storing all history guarantee relevant recall?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if storage is local
          - id: a
            text: 'No'
        answer: a
        feedback: Retrieval and context selection remain separate problems.
        retired: true
  - id: agent-memory-and-context.base.v2
    objective_ref: objective.agent-memory-and-context
    task: base
    response_type: single_choice
    points: 1
    hint: "Ask where the information lives right now: in this turn's context, in a stored record, or in the trained weights."
    remediation_scene: agent-memory-and-context.s1
    variants:
      - id: agent-memory-and-context.base.v2.1
        prompt: A customer gives a support assistant their order number early in a long chat. Forty messages later the assistant asks for it again. The number was never saved to any memory store. What most likely happened?
        options:
          - id: b
            text: The model's weights were updated during the chat and lost the number
          - id: a
            text: The early messages no longer fit in the context the model received
          - id: c
            text: Retrieval returned a different order number that looked similar
        answer: a
        feedback: With no stored copy, the number existed only in the conversation text. Once the chat grew past what the context builder could include, the model simply never saw it. Weights don't change during a chat, and nothing was stored for retrieval to find.
      - id: agent-memory-and-context.base.v2.2
        prompt: 'A thread said "Book the venue if the quote stays under $2,000; otherwise ask Dana." Memory kept only the summary "Decided to book the venue." Which design would have preserved the condition?'
        options:
          - id: c
            text: Retrain the model's weights on each planning thread
          - id: b
            text: Make summaries even shorter so more of them fit
          - id: a
            text: Store each summary with a link to its original messages
        answer: a
        feedback: A link back to the source lets the context builder fetch the full wording, including the condition, when a decision depends on it. Shorter summaries lose even more, and training would blur the condition into weights that can't be inspected.
      - id: agent-memory-and-context.base.v2.3
        prompt: Why is retraining a model a poor way to record that a customer changed their delivery address?
        options:
          - id: a
            text: A fact learned into weights can't be reliably found, updated, or deleted
          - id: b
            text: Weights store numbers, which cannot represent a street address
          - id: c
            text: Retraining would wipe the model's other knowledge at the same time
        answer: a
        feedback: Training spreads information across millions of numbers with no single row to edit or remove, and no record of the source. A database row can simply be updated. (Weights do encode text as numbers, and retraining doesn't wipe everything, but it can't give you a clean, correctable record.)
      - id: agent-memory-and-context.base.v2.4
        prompt: A memory store holds 500 notes, but only about 15 fit in the prompt. What decides which notes the model sees this turn?
        options:
          - id: b
            text: The model reads all 500 notes and ignores the irrelevant ones
          - id: c
            text: The notes are shown in the order they were first written
          - id: a
            text: A retrieval step ranks the notes and the builder includes the top ones
        answer: a
        feedback: The model can only read what the context builder includes. Retrieval ranks stored notes (by relevance, recency, permission, and so on), and the builder fills the budget with the best-ranked ones.
  - id: agent-memory-and-context.transfer.v2
    objective_ref: objective.agent-memory-and-context
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name the failure first (missing, stale, leaked, or buried), then choose the fix that targets that failure.
    remediation_scene: agent-memory-and-context.s5
    variants:
      - id: agent-memory-and-context.transfer.v2.1
        prompt: 'A travel assistant stored "Seat: aisle" in March and "Seat: window (knee surgery)" in June. Booking a flight in July, it picks an aisle seat. Which fix targets this failure?'
        options:
          - id: b
            text: Save more past trips so it has extra examples to learn from
          - id: a
            text: Keep dates on stored facts and let the newer preference win
          - id: c
            text: Give the model a longer context window for booking steps
        answer: a
        feedback: This is a stale-memory failure. Both notes match "seat"; a precedence rule such as newest-wins (using stored dates) picks the June preference. More examples or a longer window would still leave two conflicting notes with no rule to choose between them.
      - id: agent-memory-and-context.transfer.v2.2
        prompt: A shared team assistant answers Priya's question using a note from Sam's private workspace. Which step was missing?
        options:
          - id: c
            text: Summarizing stored notes so each takes up less context space
          - id: b
            text: Ranking stored notes by how similar they are to the question
          - id: a
            text: Filtering stored notes by who is allowed to see them
        answer: a
        feedback: This is a leak, not a relevance problem. Sam's note may well have been relevant. Permission filtering must happen before ranking, so notes the requester can't access are never candidates.
      - id: agent-memory-and-context.transfer.v2.3
        prompt: You plant 20 facts in a tutoring bot's early sessions and later correct 5 of them. It recalls 17 of 20, and 2 of its 3 misses are facts that had been corrected. What should you investigate first?
        options:
          - id: a
            text: How the memory handles a fact that was updated after it was stored
          - id: b
            text: Whether a larger model would be able to store more of the facts
          - id: c
            text: Whether the three missed facts were written in unusual wording
        answer: a
        feedback: Two of the three misses share one feature, a later correction, which points to precedence or update handling. Model size doesn't govern what a memory store keeps, and unusual wording explains at most one miss.
      - id: agent-memory-and-context.transfer.v2.4
        prompt: An assistant pastes every past conversation, in full, into each prompt. Replies are slow and sometimes ignore the user's latest request. What is the better design?
        options:
          - id: c
            text: Remove stored history entirely so that each turn starts fresh
          - id: a
            text: Store history and retrieve only the relevant, recent items per turn
          - id: b
            text: Ask users to repeat important details at the start of messages
        answer: a
        feedback: Pasting everything makes prompts long, slow, and easy to get lost in; the latest request gets buried. Storing history and selecting what each turn needs keeps the useful facts without the noise. Dropping history or pushing the work onto users gives up memory altogether.
