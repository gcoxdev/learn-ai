schema_version: 0.2-draft
lesson:
  id: agent-memory-and-context
  version: 0.3.0-draft
  title: Decide what to retain and what to show the model now
  state: draft
  summary: Choose what to remember, where to store it, and when to trust it.
  slot: M25.4
  category: learning
  sources:
  - title: Generative Agents
    url: https://arxiv.org/abs/2304.03442
  - title: ReAct
    url: https://arxiv.org/abs/2210.03629
objectives:
- id: objective.agent-memory-and-context
  version: 1-draft
  statement: Working context, persistent records, retrieved memories, and learned parameters are different
    storage mechanisms; retrieval and summarization must preserve relevance, provenance, and correction.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - agent-memory-and-context.base
  - agent-memory-and-context.transfer
  prerequisites:
  - anyOf:
    - objective.tool-contracts-and-state
  - anyOf:
    - objective.lexical-information-retrieval
scenes:
- id: agent-memory-and-context.s1
  title: Separate memory layers
  type: explanation
  depth: intuition
  objective_refs:
  - objective.agent-memory-and-context
  markdown: The current prompt is working context. A database can hold durable task facts or past events. Retrieval
    chooses records for the current decision. Model weights store learned statistical structure, but are not
    an editable record store with the same provenance and deletion behavior.
  text_mode: The current prompt is working context. A database can hold durable task facts or past events.
    Retrieval chooses records for the current decision. Model weights store learned statistical structure,
    but are not an editable record store with the same provenance and deletion behavior.
  bridges: []
- id: agent-memory-and-context.s2
  title: Construct context for a purpose
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agent-memory-and-context
  markdown: A long history may contain obsolete assumptions and irrelevant details. Select recent task state,
    relevant evidence, and applicable instructions within the context budget. A summary compresses information
    and can lose qualifications, so important facts should retain links to their original records.
  text_mode: A long history may contain obsolete assumptions and irrelevant details. Select recent task state,
    relevant evidence, and applicable instructions within the context budget. A summary compresses information
    and can lose qualifications, so important facts should retain links to their original records.
  bridges: []
- id: agent-memory-and-context.s3
  title: Handle correction and freshness
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agent-memory-and-context
  markdown: Suppose an old record says a meeting is Monday and a newer authoritative update says Tuesday. A
    memory system needs version or precedence rules, not merely similarity search. Keep source, timestamp,
    scope, and confidence where they affect interpretation.
  text_mode: Suppose an old record says a meeting is Monday and a newer authoritative update says Tuesday.
    A memory system needs version or precedence rules, not merely similarity search. Keep source, timestamp,
    scope, and confidence where they affect interpretation.
  bridges: []
- id: agent-memory-and-context.s4
  title: Evaluate retrieval as well as retention
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agent-memory-and-context
  markdown: Storing everything does not guarantee finding the right item. Test missed facts, stale memories,
    conflicting records, and inappropriate cross-user access. Measure task success and privacy boundaries;
    longer context or more storage is useful only when the system uses it correctly.
  text_mode: Storing everything does not guarantee finding the right item. Test missed facts, stale memories,
    conflicting records, and inappropriate cross-user access. Measure task success and privacy boundaries;
    longer context or more storage is useful only when the system uses it correctly.
  bridges: []
- id: agent-memory-and-context.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.agent-memory-and-context
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Separate what is in the current prompt from what is stored for later. Useful memory must be relevant,
    traceable to a source, and correctable when facts change.
- id: agent-memory-and-context.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.agent-memory-and-context
  markdown: Separate what is in the current prompt from what is stored for later. Useful memory must be relevant,
    traceable to a source, and correctable when facts change.
  text_mode: Separate what is in the current prompt from what is stored for later. Useful memory must be relevant,
    traceable to a source, and correctable when facts change.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - agent-memory-and-context.s1
    - agent-memory-and-context.s2
    - agent-memory-and-context.s3
    - agent-memory-and-context.s4
    - agent-memory-and-context.check
    gate_refs:
    - gate.core
  scene_aliases:
    agent-memory-and-context.recap: agent-memory-and-context.check
assessment_families:
- id: agent-memory-and-context.base
  objective_ref: objective.agent-memory-and-context
  task: base
  response_type: single_choice
  points: 1
  hint: 'Construct context for a purpose: trace the inputs, operation, and result before choosing.'
  remediation_scene: agent-memory-and-context.s2
  variants:
  - id: agent-memory-and-context.base.1
    prompt: Are model weights and an editable task database the same memory mechanism?
    options:
    - id: c
      text: Only if both store numbers
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: They have different interfaces and update semantics.
  - id: agent-memory-and-context.base.2
    prompt: What can a summary lose?
    options:
    - id: a
      text: Qualifications and source detail
    - id: b
      text: Nothing by definition
    - id: c
      text: Only font choices
    answer: a
    feedback: Compression can omit information needed later.
- id: agent-memory-and-context.transfer
  objective_ref: objective.agent-memory-and-context
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate retrieval as well as retention: trace the inputs, operation, and result before choosing.'
  remediation_scene: agent-memory-and-context.s4
  variants:
  - id: agent-memory-and-context.transfer.1
    prompt: An old and new meeting date conflict. What is needed?
    options:
    - id: a
      text: Source and update precedence rules
    - id: b
      text: Only the most similar wording
    - id: c
      text: Random selection
    answer: a
    feedback: Freshness and authority resolve record conflicts.
  - id: agent-memory-and-context.transfer.2
    prompt: Does storing all history guarantee relevant recall?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if storage is local
    - id: a
      text: 'No'
    answer: a
    feedback: Retrieval and context selection remain separate problems.
