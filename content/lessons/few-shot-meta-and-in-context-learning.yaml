assessment_families:
  - id: few-shot-meta-and-in-context-learning.base
    objective_ref: objective.few-shot-meta-and-in-context-learning
    task: base
    response_type: single_choice
    points: 1
    hint: 'Train for future adaptation: trace the inputs, operation, and result before choosing.'
    remediation_scene: few-shot-meta-and-in-context-learning.s2
    variants:
      - id: few-shot-meta-and-in-context-learning.base.1
        prompt: Does few-shot specify one particular algorithm?
        options:
          - id: c
            text: Only if there are exactly five examples
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: It describes limited data, not a unique mechanism.
        retired: true
      - id: few-shot-meta-and-in-context-learning.base.2
        prompt: What does an outer meta-learning objective evaluate?
        options:
          - id: a
            text: How learning machinery performs across adaptation tasks
          - id: b
            text: Only one fixed token’s spelling
          - id: c
            text: Only file loading speed
        answer: a
        feedback: Meta-training targets useful adaptation behavior.
        retired: true
  - id: few-shot-meta-and-in-context-learning.transfer
    objective_ref: objective.few-shot-meta-and-in-context-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Separate task novelty from example count: trace the inputs, operation, and result before choosing.'
    remediation_scene: few-shot-meta-and-in-context-learning.s4
    variants:
      - id: few-shot-meta-and-in-context-learning.transfer.1
        prompt: Do ordinary in-context examples necessarily update weights?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only when examples have labels
        answer: a
        feedback: They can influence activations and predictions with fixed parameters.
        retired: true
      - id: few-shot-meta-and-in-context-learning.transfer.2
        prompt: Why separate meta-training and evaluation task families?
        options:
          - id: b
            text: To guarantee every task is impossible
          - id: c
            text: Only to rename datasets
          - id: a
            text: To test adaptation beyond familiar tasks
        answer: a
        feedback: Task leakage can inflate few-shot claims.
        retired: true
  - id: few-shot-meta-and-in-context-learning.base.v2
    objective_ref: objective.few-shot-meta-and-in-context-learning
    task: base
    response_type: single_choice
    points: 1
    hint: For each method, ask what the few examples actually change. Prototypes are averages, MAML's inner loop changes weights, and in-context learning changes only the prompt.
    remediation_scene: few-shot-meta-and-in-context-learning.s1
    variants:
      - id: few-shot-meta-and-in-context-learning.base.v2.1
        prompt: A 5-way 1-shot episode is set up for a classifier. How many labeled examples does its support set contain?
        options:
          - id: b
            text: One, a single labeled example shared across the five classes
          - id: a
            text: Five, one labeled example for each of the five classes
          - id: c
            text: Twenty-five, five labeled examples for each of five classes
        answer: a
        feedback: N-way K-shot means N classes with K examples each, so 5 × 1 = 5 support examples. Twenty-five would be 5-way 5-shot.
      - id: few-shot-meta-and-in-context-learning.base.v2.2
        prompt: How does a prototypical network classify a query?
        options:
          - id: a
            text: It picks the class whose mean support embedding is nearest to the query
          - id: b
            text: It picks the class of the single support example nearest to the query
          - id: c
            text: It fine-tunes the encoder on the support set, then runs a classifier
        answer: a
        feedback: Each class is summarized by its prototype, the mean of its support embeddings. Matching the single nearest example is plain nearest-neighbor, and prototypical networks don't train on the support set at all.
      - id: few-shot-meta-and-in-context-learning.base.v2.3
        prompt: In MAML, what does the outer loop update, and using which data?
        options:
          - id: c
            text: Each task's adapted weights, using that task's support set
          - id: a
            text: The shared starting weights, using query loss after adaptation
          - id: b
            text: The inner step size, using the average support loss over tasks
        answer: a
        feedback: The inner loop adapts per task on support data; the outer loop moves the shared start θ to reduce query loss measured after that adaptation. The adapted weights are temporary, and the basic MAML algorithm keeps α fixed.
      - id: few-shot-meta-and-in-context-learning.base.v2.4
        prompt: A language model answers correctly after seeing four examples in its prompt. What changed inside the model?
        options:
          - id: b
            text: Its weights received small gradient updates from the four examples
          - id: c
            text: A temporary copy of its weights was fine-tuned and then discarded
          - id: a
            text: Only the activations computed from the prompt; the weights stayed fixed
        answer: a
        feedback: In-context learning happens in the forward pass. The examples shape the activations, and no gradient step is taken. That's why the effect vanishes when the examples leave the prompt.
      - id: few-shot-meta-and-in-context-learning.base.v2.5
        prompt: In the one-number MAML example, the ordinary-training start is 2 but MAML picks 10, far from task A's best value of 0. Why is that fine for task A?
        options:
          - id: a
            text: Task A is steep enough that one inner step lands on 0 from anywhere
          - id: b
            text: MAML ignores task A because its loss is smaller than task B's loss
          - id: c
            text: Task A's loss is already zero at 10, before any adaptation step
        answer: a
        feedback: With α = 0.25 and loss 2θ², one step multiplies θ by 1 − 0.25 × 4 = 0, so task A is solved from any start. MAML doesn't ignore task A; at θ = 10, task A's loss before adapting is 200, not zero.
  - id: few-shot-meta-and-in-context-learning.transfer.v2
    objective_ref: objective.few-shot-meta-and-in-context-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: Check what you can touch (the weights, an encoder, or only a prompt) and whether the test tasks are truly new to the model.
    remediation_scene: few-shot-meta-and-in-context-learning.s4
    variants:
      - id: few-shot-meta-and-in-context-learning.transfer.v2.1
        prompt: A help desk wants to sort tickets into four new categories using ten examples of each. It can call a large language model through an API but cannot change its weights. What should it try?
        options:
          - id: b
            text: Meta-train the model with MAML on many past ticket-sorting tasks
          - id: a
            text: Put a few labeled examples of each category in the prompt
          - id: c
            text: Train a new classifier from scratch on the forty labeled tickets
        answer: a
        feedback: In-context learning needs only the prompt, which is all the help desk controls. MAML needs weight access and many training tasks, and forty tickets are far too few to train a text classifier from scratch.
      - id: few-shot-meta-and-in-context-learning.transfer.v2.2
        prompt: A museum's image encoder was trained on thousands of object types. It now receives a new kind of artifact with just three photos. How can a prototypical approach handle it?
        options:
          - id: a
            text: Embed the three photos and use their mean as the new class prototype
          - id: b
            text: Retrain the encoder with the three photos added to its training set
          - id: c
            text: Wait until a hundred photos exist, since three can't form a prototype
        answer: a
        feedback: A prototype is just the mean embedding, so a new class needs no training. Retraining on three photos risks overfitting, and even a single photo can serve as a 1-shot prototype.
      - id: few-shot-meta-and-in-context-learning.transfer.v2.3
        prompt: A team meta-trains on 40 handwriting alphabets and reports 5-way 1-shot accuracy on new characters drawn from those same 40 alphabets. What is the main problem?
        options:
          - id: c
            text: One example per class is too few to measure anything useful
          - id: b
            text: Five classes per episode is too few; twenty would be fairer
          - id: a
            text: Test alphabets should be held out, since these ones are already familiar
        answer: a
        feedback: Few-shot claims are about new tasks, so Omniglot's original split tests on alphabets never seen in training. One-shot and five-way are both standard settings, not flaws.
      - id: few-shot-meta-and-in-context-learning.transfer.v2.4
        prompt: The same four examples in a prompt give 85% accuracy in one order and 60% in another. How should this be reported?
        options:
          - id: a
            text: Give the average and range over several example orders and sets
          - id: b
            text: Give the 85% result, since it shows what the model is capable of
          - id: c
            text: Give the 60% result, since the model fine-tuned on the worse order
        answer: a
        feedback: In-context learning is known to be sensitive to example order, so one run can mislead in either direction. Reporting only the best order overstates what users will get, and no fine-tuning happens with either order.
      - id: few-shot-meta-and-in-context-learning.transfer.v2.5
        prompt: A model scores 95% in 5-shot prompting on a quiz benchmark, but the quiz and its answers were posted online before the model was trained. What is the most useful next step?
        options:
          - id: b
            text: Report the 95%, since five examples are too few to memorize a quiz
          - id: c
            text: Run 10-shot prompts instead, since more examples reduce memorization
          - id: a
            text: Test on new questions written after the model's training data ended
        answer: a
        feedback: If the answers were in the training data, the model may be recalling rather than learning from the five examples. Fresh questions separate the two. The number of prompt examples has nothing to do with what the weights already contain.
  - id: few-shot-meta-and-in-context-learning.calculate
    objective_ref: objective.few-shot-meta-and-in-context-learning
    task: base
    response_type: numeric
    points: 1
    hint: Average each coordinate of the support embeddings to get the prototype. The squared distance is the sum of the squared coordinate differences.
    remediation_scene: few-shot-meta-and-in-context-learning.s5
    absolute_tolerance: 0.01
    variants:
      - id: few-shot-meta-and-in-context-learning.calculate.1
        prompt: A class has support embeddings (1, 2), (3, 4), and (5, 0). What is the squared Euclidean distance from its prototype to the query (6, 6)?
        answer: 25
        feedback: The prototype is ((1+3+5)/3, (2+4+0)/3) = (3, 2). The squared distance is (6−3)² + (6−2)² = 9 + 16 = 25.
      - id: few-shot-meta-and-in-context-learning.calculate.2
        prompt: A class has support embeddings (2, 8), (4, 6), and (6, 10). What is the squared Euclidean distance from its prototype to the query (4, 4)?
        answer: 16
        feedback: The prototype is (4, 8). The squared distance is (4−4)² + (4−8)² = 0 + 16 = 16.
      - id: few-shot-meta-and-in-context-learning.calculate.3
        prompt: Prototypes are A = (0, 0) and B = (4, 3). A query sits at (3, 1). What is its squared distance to the nearer prototype?
        answer: 5
        feedback: To A, 3² + 1² = 10. To B, (3−4)² + (1−3)² = 1 + 4 = 5. B is nearer, at 5.
      - id: few-shot-meta-and-in-context-learning.calculate.4
        prompt: In the robin–wren–finch example, the robin prototype is (2, 4). What is the squared distance from it to a new query at (5, 8)?
        answer: 25
        feedback: (5−2)² + (8−4)² = 9 + 16 = 25.
      - id: few-shot-meta-and-in-context-learning.calculate.5
        prompt: In one dimension, two prototypes sit at 2 and 7, and a query at 4. Using a softmax over negative squared distances, what probability goes to the prototype at 2? (Two decimals.)
        answer: 0.99
        feedback: The squared distances are 4 and 9. The probability is e^(−4) / (e^(−4) + e^(−9)) = 1 / (1 + e^(−5)) ≈ 0.993, so 0.99.
