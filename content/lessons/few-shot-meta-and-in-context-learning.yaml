assessment_families:
- id: few-shot-meta-and-in-context-learning.base
  objective_ref: objective.few-shot-meta-and-in-context-learning
  task: base
  response_type: single_choice
  points: 1
  hint: 'Train for future adaptation: trace the inputs, operation, and result before choosing.'
  remediation_scene: few-shot-meta-and-in-context-learning.s2
  variants:
  - id: few-shot-meta-and-in-context-learning.base.1
    prompt: Does few-shot specify one particular algorithm?
    options:
    - id: c
      text: Only if there are exactly five examples
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: It describes limited data, not a unique mechanism.
  - id: few-shot-meta-and-in-context-learning.base.2
    prompt: What does an outer meta-learning objective evaluate?
    options:
    - id: a
      text: How learning machinery performs across adaptation tasks
    - id: b
      text: Only one fixed token’s spelling
    - id: c
      text: Only file loading speed
    answer: a
    feedback: Meta-training targets useful adaptation behavior.
- id: few-shot-meta-and-in-context-learning.transfer
  objective_ref: objective.few-shot-meta-and-in-context-learning
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Separate task novelty from example count: trace the inputs, operation, and result before choosing.'
  remediation_scene: few-shot-meta-and-in-context-learning.s4
  variants:
  - id: few-shot-meta-and-in-context-learning.transfer.1
    prompt: Do ordinary in-context examples necessarily update weights?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only when examples have labels
    answer: a
    feedback: They can influence activations and predictions with fixed parameters.
  - id: few-shot-meta-and-in-context-learning.transfer.2
    prompt: Why separate meta-training and evaluation task families?
    options:
    - id: b
      text: To guarantee every task is impossible
    - id: c
      text: Only to rename datasets
    - id: a
      text: To test adaptation beyond familiar tasks
    answer: a
    feedback: Task leakage can inflate few-shot claims.
