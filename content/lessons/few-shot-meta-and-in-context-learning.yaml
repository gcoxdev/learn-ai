lesson:
  id: few-shot-meta-and-in-context-learning
  version: 0.4.0-draft
  title: Distinguish examples in a prompt from learning to adapt weights
  state: draft
  summary: Three recordings of a bird call you've never heard. Is that enough? Meet three ways to learn from a handful of examples, and find out which ones change the model's weights.
  slot: M31.4
  category: learning
  sources:
    - title: "Prototypical Networks for Few-shot Learning (Snell, Swersky & Zemel, 2017)"
      url: https://arxiv.org/abs/1703.05175
    - title: "Model-Agnostic Meta-Learning for Fast Adaptation of Deep Networks (Finn, Abbeel & Levine, 2017)"
      url: https://arxiv.org/abs/1703.03400
    - title: "Language Models are Few-Shot Learners (Brown et al., 2020)"
      url: https://arxiv.org/abs/2005.14165
    - title: "Calibrate Before Use: Improving Few-Shot Performance of Language Models (Zhao et al., 2021)"
      url: https://arxiv.org/abs/2102.09690
    - title: "Rethinking the Role of Demonstrations: What Makes In-Context Learning Work? (Min et al., 2022)"
      url: https://arxiv.org/abs/2202.12837
    - title: "Human-level concept learning through probabilistic program induction (Lake, Salakhutdinov & Tenenbaum, 2015), the Omniglot paper"
      url: https://www.science.org/doi/10.1126/science.aab3050
    - title: "What Can Transformers Learn In-Context? A Case Study of Simple Function Classes (Garg et al., 2022)"
      url: https://arxiv.org/abs/2208.01066
objectives:
  - id: objective.few-shot-meta-and-in-context-learning
    version: 2-draft
    statement: Set up an N-way K-shot episode, classify with prototypes, explain MAML's inner and outer loops, and tell in-context learning (no weight change) apart from fine-tuning and meta-learning.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - few-shot-meta-and-in-context-learning.base.v2
      - few-shot-meta-and-in-context-learning.transfer.v2
      - few-shot-meta-and-in-context-learning.calculate
    prerequisites:
      - anyOf:
          - objective.transfer-and-domain-adaptation
      - anyOf:
          - objective.supervised-fine-tuning
scenes:
  - id: few-shot-meta-and-in-context-learning.s1
    title: Three recordings of a bird you've never heard
    type: explanation
    depth: intuition
    objective_refs:
      - objective.few-shot-meta-and-in-context-learning
    markdown: |-
      A birdsong recorder in a park must learn three local birds, a robin, a wren, and a finch, from just three labeled recordings each. Then it hears a new call. Which bird is it?

      Learning from a handful of labeled examples is **few-shot learning**. The standard setup is an **N-way K-shot** task: N classes, K labeled examples of each. Our park is 3-way 3-shot. The labeled examples form the **support set**; the new examples to classify form the **query set**. Together they make one **episode**.

      A person does this easily because they've already heard thousands of birds. Few-shot methods lean on the same trick: prior experience with *other* tasks. They differ in where that experience lives and what changes when the new examples arrive:

      | Approach | Where prior experience lives | What the few examples change |
      | --- | --- | --- |
      | Prototypes over a pretrained encoder | The encoder's features | Nothing is trained; the examples are averaged |
      | Meta-learning (MAML) | A starting point chosen for fast adaptation | The weights, by a few gradient steps |
      | In-context learning | A large language model's weights | Only the prompt; the weights stay fixed |

      So "few-shot" describes the data you have, not the method. Each method below is worked on its own example.
    bridges: []
  - id: few-shot-meta-and-in-context-learning.s5
    title: Average the examples, then find the nearest
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.few-shot-meta-and-in-context-learning
    markdown: |-
      A pretrained audio encoder turns each recording into a vector. (Real encoders produce hundreds of numbers; two keep the arithmetic visible.) **Prototypical networks** (Snell, Swersky & Zemel, 2017) represent each class by its **prototype**, the mean of its support vectors, and give a query to the nearest prototype.

      | Bird | Support embeddings | Prototype | Squared distance to query (4, 5) |
      | --- | --- | --- | ---: |
      | Robin | (1, 4), (2, 5), (3, 3) | (2, 4) | (4−2)² + (5−4)² = 5 |
      | Wren | (6, 1), (7, 2), (8, 0) | (7, 1) | 9 + 16 = 25 |
      | Finch | (5, 6), (6, 7), (7, 8) | (6, 7) | 4 + 4 = 8 |

      The query is a robin. Turning distances into probabilities with a softmax over $-d$ gives robin 0.953 and finch 0.047.

      :::papers Prototypical networks
      $$c_k = \frac{1}{|S_k|}\sum_{(x_i, y_i) \in S_k} f_\phi(x_i), \qquad p(y = k \mid x) = \frac{\exp\!\big(-d(f_\phi(x), c_k)\big)}{\sum_{k'} \exp\!\big(-d(f_\phi(x), c_{k'})\big)}$$

      $f_\phi$ is the encoder, $S_k$ the support set of class $k$, and $d$ the squared Euclidean distance. The encoder is trained on many episodes built from *other* classes, so that same-class examples cluster. A new bird needs no training at all: embed its recordings and average them.
      :::

      ```python run
      import numpy as np

      # 3-way 3-shot: embeddings of each bird's support calls (from a pretrained encoder)
      support = {
          "robin": np.array([[1, 4], [2, 5], [3, 3]]),
          "wren":  np.array([[6, 1], [7, 2], [8, 0]]),
          "finch": np.array([[5, 6], [6, 7], [7, 8]]),
      }
      query = np.array([4, 5])

      prototypes = {name: pts.mean(axis=0) for name, pts in support.items()}
      dist = {name: ((query - c) ** 2).sum() for name, c in prototypes.items()}  # squared Euclidean
      z = np.exp(-np.array(list(dist.values())))
      probs = z / z.sum()

      for (name, c), p in zip(prototypes.items(), probs):
          print(f"{name:5s}  prototype {c}  squared distance {dist[name]:5.1f}  p = {p:.3f}")
      print("prediction:", min(dist, key=dist.get))
      ```

      Move the query to `[5, 6]` and predict the answer before you run it. Then add a fourth bird with a single recording: a 1-shot class works the same way.
    bridges: []
  - id: few-shot-meta-and-in-context-learning.s2
    title: "MAML: learn a starting point that adapts fast"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.few-shot-meta-and-in-context-learning
    markdown: |-
      **Meta-learning** means learning how to learn from many tasks. **MAML**, model-agnostic meta-learning (Finn, Abbeel & Levine, 2017), learns a starting set of weights from which a few gradient steps on a new task's support set give good results on its query set. It runs two loops:

      1. **Inner loop:** for each training task, take a gradient step from the shared start $\theta$ on that task's support set, giving adapted weights $\theta_i'$.
      2. **Outer loop:** measure each $\theta_i'$ on its task's query set, and move $\theta$ to reduce that after-adaptation loss.

      :::papers The MAML update
      $$\theta_i' = \theta - \alpha \nabla_\theta \mathcal{L}_{\mathcal{T}_i}^{\text{support}}(\theta), \qquad \theta \leftarrow \theta - \beta \nabla_\theta \sum_i \mathcal{L}_{\mathcal{T}_i}^{\text{query}}(\theta_i')$$

      $\alpha$ is the inner step size and $\beta$ the outer one. The outer gradient flows *through* the inner step, which is what makes MAML expensive.
      :::

      A one-number example shows why the best starting point isn't the best single model. The model is a single weight $\theta$, with $\alpha = 0.25$ and two tasks:

      - Task A: loss $2(\theta - 0)^2$, steep.
      - Task B: loss $0.5(\theta - 10)^2$, shallow.

      Ordinary training minimizes the summed loss $2\theta^2 + 0.5(\theta - 10)^2$, giving $\theta = 2$. After one inner step from 2, task A lands exactly on 0, but task B only reaches 4, with loss $0.5 \times 36 = 18$.

      :::predict Where does MAML put the start?
      At $\theta = 10$. Task A is so steep that one step lands on 0 from anywhere: $10 - 0.25 \times 4 \times 10 = 0$. Task B needs the start close by. From 10, both tasks end with zero loss after one step. MAML puts the start near the task that adapts slowly and lets the fast one catch up.
      :::
    bridges: []
  - id: few-shot-meta-and-in-context-learning.s3
    title: Learning from a prompt, with the weights frozen
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.few-shot-meta-and-in-context-learning
    markdown: |-
      In the prompting lesson (module 21), Mei showed a chat model two product descriptions in her house style, and it wrote a third. The GPT-3 paper (Brown et al., 2020) named this **in-context learning**: a model picks up a task from examples placed in its prompt, with no gradient updates. With 175 billion weights, GPT-3 improved on many tasks as the number of examples in the prompt grew from zero to one to a few.

      Nothing about the weights changes. The examples change the **activations**, the numbers computed inside the network for this prompt. Delete the prompt and the "learning" is gone.

      Researchers are still working out how this works, but three findings are solid:

      - **It's sensitive to format.** Reordering the same examples can move accuracy a lot, and models lean toward labels that appear often or last in the prompt (Zhao et al., 2021).
      - **The examples do more than teach labels.** On many classification tasks, replacing the examples' correct labels with random ones hurt accuracy only a little; showing the format, the input style, and the set of possible labels mattered more (Min et al., 2022).
      - **Transformers *can* learn algorithms in context.** Transformers trained from scratch on prompts of $(x, y)$ pairs from random linear functions learned to predict new points about as well as least-squares regression (Garg et al., 2022).

      :::mixup "The model learns from my examples, so it will remember them next time."
      In-context learning lasts exactly as long as the prompt. To make a change permanent, you need fine-tuning, which updates the weights, or a system that stores the examples and puts them back into later prompts.
      :::
    bridges: []
  - id: few-shot-meta-and-in-context-learning.s4
    title: Is the task really new?
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.few-shot-meta-and-in-context-learning
    markdown: |-
      Few-shot results are only impressive if the test task is new to the model. A 5-shot score on a public quiz means little if the quiz answers were on the web the model trained on: it may be recalling, not adapting.

      Benchmarks guard against this by splitting at the level of *tasks*. Omniglot (Lake et al., 2015), a classic few-shot benchmark, has 1,623 handwritten characters from 50 alphabets. Its original split learns from 30 alphabets and holds out the other 20 for testing.

      A team building the park recorder runs this check before launch:

      1. Pick test birds the encoder never heard during training.
      2. Run 200 random 3-way 3-shot episodes with those birds, so no single lucky support set decides the score.
      3. Report mean accuracy with its spread across episodes, and compare against a plain nearest-neighbor baseline on the same episodes.

      The same habit applies to prompts: try several example sets and orders, and report the range, not just the best run.
    bridges: []
  - id: few-shot-meta-and-in-context-learning.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.few-shot-meta-and-in-context-learning
    markdown: Prototype distances to compute by hand, then a help desk, a museum catalog, a handwriting benchmark, and a shuffled prompt ask which few-shot method fits and what it changes.
    takeaway: |-
      Few-shot describes the data, not the method. Prototypes average examples in a learned feature space, MAML learns a start that adapts in a few steps, and in-context learning adapts through the prompt with the weights frozen.
  - id: few-shot-meta-and-in-context-learning.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.few-shot-meta-and-in-context-learning
    markdown: |-
      Few-shot describes how many examples are available. Meta-learning trains for adaptation; in-context learning uses supplied examples while ordinary inference keeps weights fixed.
