schema_version: 0.2-draft
lesson:
  id: few-shot-meta-and-in-context-learning
  version: 0.1.0-draft
  title: Distinguish examples in a prompt from learning to adapt weights
  state: draft
  summary: Few-shot describes limited examples, meta-learning trains adaptation across tasks, and in-context learning
    conditions on examples without necessarily changing parameters; compare them under explicit task splits.
  slot: M31.4
  category: learning
  sources:
  - title: MAML
    url: https://arxiv.org/abs/1703.03400
  - title: Language Models are Few-Shot Learners
    url: https://arxiv.org/abs/2005.14165
objectives:
- id: objective.few-shot-meta-and-in-context-learning
  version: 1-draft
  statement: Few-shot describes limited examples, meta-learning trains adaptation across tasks, and in-context learning
    conditions on examples without necessarily changing parameters; compare them under explicit task splits.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - few-shot-meta-and-in-context-learning.base
  - few-shot-meta-and-in-context-learning.transfer
  prerequisites:
  - anyOf:
    - objective.transfer-and-domain-adaptation
  - anyOf:
    - objective.supervised-fine-tuning
scenes:
- id: few-shot-meta-and-in-context-learning.s1
  title: Few-shot names a data condition
  type: explanation
  depth: intuition
  objective_refs:
  - objective.few-shot-meta-and-in-context-learning
  markdown: A task with only a few labeled examples can use nearest-neighbor representations, fine-tuning, prompting,
    or other methods. The phrase few-shot alone does not identify the mechanism. State where examples enter and
    which model state can change.
  text_mode: A task with only a few labeled examples can use nearest-neighbor representations, fine-tuning, prompting,
    or other methods. The phrase few-shot alone does not identify the mechanism. State where examples enter and
    which model state can change.
  bridges: []
- id: few-shot-meta-and-in-context-learning.s2
  title: Train for future adaptation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.few-shot-meta-and-in-context-learning
  markdown: Meta-learning uses a distribution of tasks to shape an initialization, update rule, representation,
    or other learning machinery. In gradient-based meta-learning, an outer objective can reward parameters that
    adapt well after a few inner gradient steps on a new task.
  text_mode: Meta-learning uses a distribution of tasks to shape an initialization, update rule, representation,
    or other learning machinery. In gradient-based meta-learning, an outer objective can reward parameters that
    adapt well after a few inner gradient steps on a new task.
  bridges: []
- id: few-shot-meta-and-in-context-learning.s3
  title: Learn within context without an optimizer step
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.few-shot-meta-and-in-context-learning
  markdown: A language model shown three input-output examples can condition its next prediction on that pattern.
    Ordinary in-context inference changes activations and context while weights remain fixed. This can implement
    useful task adaptation without being identical to supervised fine-tuning.
  text_mode: A language model shown three input-output examples can condition its next prediction on that pattern.
    Ordinary in-context inference changes activations and context while weights remain fixed. This can implement
    useful task adaptation without being identical to supervised fine-tuning.
  bridges: []
- id: few-shot-meta-and-in-context-learning.s4
  title: Separate task novelty from example count
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.few-shot-meta-and-in-context-learning
  markdown: A small support set is not impressive evidence of new-task learning if the task or answers leaked into
    pretraining or meta-training. Define support and query sets, task splits, prompt order, and update budgets.
    Compare performance and uncertainty on truly held-out task families where possible.
  text_mode: A small support set is not impressive evidence of new-task learning if the task or answers leaked into
    pretraining or meta-training. Define support and query sets, task splits, prompt order, and update budgets.
    Compare performance and uncertainty on truly held-out task families where possible.
  bridges: []
- id: few-shot-meta-and-in-context-learning.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.few-shot-meta-and-in-context-learning
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Few-shot describes limited examples, meta-learning trains adaptation across tasks, and in-context learning
    conditions on examples without necessarily changing parameters; compare them under explicit task splits.
- id: few-shot-meta-and-in-context-learning.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.few-shot-meta-and-in-context-learning
  markdown: Few-shot describes limited examples, meta-learning trains adaptation across tasks, and in-context learning
