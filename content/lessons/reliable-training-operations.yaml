schema_version: 0.2-draft
lesson:
  id: reliable-training-operations
  version: 0.3.0-draft
  title: Make a large training run recoverable and auditable
  state: draft
  summary: Prepare a training run to recover from failure and leave enough evidence for others to understand
    the resulting model.
  slot: M17.8
  category: learning
  sources:
  - title: The Llama 3 Herd of Models
    url: https://arxiv.org/abs/2407.21783
  - title: DeepSeek-V3 Technical Report
    url: https://arxiv.org/abs/2412.19437
  - title: Green AI
    url: https://arxiv.org/abs/1907.10597
objectives:
- id: objective.reliable-training-operations
  version: 1-draft
  statement: Reliable training operations connect health monitoring, checkpoint recovery, reproducible configuration,
    and resource accounting to the identity and limitations of the resulting model.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - reliable-training-operations.base
  - reliable-training-operations.transfer
  prerequisites:
  - anyOf:
    - objective.pretraining-budget-and-checkpoints
  - anyOf:
    - objective.sharding-and-recomputation
  - anyOf:
    - objective.mixed-precision-training
scenes:
- id: reliable-training-operations.s1
  title: Monitor more than the final loss
  type: explanation
  depth: intuition
  objective_refs:
  - objective.reliable-training-operations
  markdown: Track loss by source, gradient norms, nonfinite events, throughput, device failures, and data-loader
    health. A stalled input pipeline can look like poor accelerator utilization; corrupted batches can create
    loss spikes. Logs should identify the step and configuration without unnecessarily retaining sensitive
    raw examples.
  text_mode: Track loss by source, gradient norms, nonfinite events, throughput, device failures, and data-loader
    health. A stalled input pipeline can look like poor accelerator utilization; corrupted batches can create
    loss spikes. Logs should identify the step and configuration without unnecessarily retaining sensitive
    raw examples.
  bridges: []
- id: reliable-training-operations.s2
  title: Practice recovery before a long run
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reliable-training-operations
  markdown: 'A checkpoint should be complete, consistent across shards, and linked to code, tokenizer, optimizer,
    and data progress. Test restoring it into a short continuation. A file existing on disk does not prove
    that a distributed state can resume coherently after a worker failure.


    A distributed checkpoint may have one **shard**, or file partition, per worker. All must describe a compatible
    step. Combining worker A at step 100 with worker B at step 99 can produce a state no actual run had. An
    **integrity check** detects missing or changed bytes; a restore test checks whether the complete state
    can be used.'
  text_mode: 'A checkpoint should be complete, consistent across shards, and linked to code, tokenizer, optimizer,
    and data progress. Test restoring it into a short continuation. A file existing on disk does not prove
    that a distributed state can resume coherently after a worker failure.


    A distributed checkpoint may have one **shard**, or file partition, per worker. All must describe a compatible
    step. Combining worker A at step 100 with worker B at step 99 can produce a state no actual run had. An
    **integrity check** detects missing or changed bytes; a restore test checks whether the complete state
    can be used.'
  bridges: []
- id: reliable-training-operations.s3
  title: Describe reproducibility precisely
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reliable-training-operations
  markdown: 'Fixed seeds help, but parallel reduction order, nondeterministic kernels, hardware, and library
    versions can alter results. Distinguish bitwise replay from statistically similar reruns. Record what is
    reproducible and what is merely documented; missing training data prevents some forms of independent reproduction.


    **Bitwise replay** means exactly matching stored numerical bits. **Statistically similar** means repeated
    results fall within a documented range under comparable conditions. A seed fixes a random generator''s
    starting state, but does not by itself fix parallel arithmetic order or every device implementation.'
  text_mode: 'Fixed seeds help, but parallel reduction order, nondeterministic kernels, hardware, and library
    versions can alter results. Distinguish bitwise replay from statistically similar reruns. Record what is
    reproducible and what is merely documented; missing training data prevents some forms of independent reproduction.


    **Bitwise replay** means exactly matching stored numerical bits. **Statistically similar** means repeated
    results fall within a documented range under comparable conditions. A seed fixes a random generator''s
    starting state, but does not by itself fix parallel arithmetic order or every device implementation.'
  bridges: []
- id: reliable-training-operations.s4
  title: Account for resources honestly
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reliable-training-operations
  markdown: 'Report accelerator type and time, utilization assumptions, training stages included, and measurement
    boundaries. Energy can be measured or estimated from power over time; emissions also depend on electricity
    and accounting choices. A quoted final-run compute cost is not automatically the total cost of research
    and deployment.


    Power is the rate of energy use; energy accumulates over time. A hypothetical constant 2 kW load running
    for 3 hours uses 6 kWh. Include the equipment covered by the measurement. A final successful run omits
    failed experiments and later serving, so call it final-run energy rather than the project''s complete footprint.'
  text_mode: 'Report accelerator type and time, utilization assumptions, training stages included, and measurement
    boundaries. Energy can be measured or estimated from power over time; emissions also depend on electricity
    and accounting choices. A quoted final-run compute cost is not automatically the total cost of research
    and deployment.


    Power is the rate of energy use; energy accumulates over time. A hypothetical constant 2 kW load running
    for 3 hours uses 6 kWh. Include the equipment covered by the measurement. A final successful run omits
    failed experiments and later serving, so call it final-run energy rather than the project''s complete footprint.'
  bridges: []
- id: reliable-training-operations.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.reliable-training-operations
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A recoverable run needs more than a saved weight file. Test restoration, record the conditions
    of the run, and state exactly which stages your resource measurements include.
