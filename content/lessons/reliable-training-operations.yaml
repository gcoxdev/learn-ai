assessment_families:
  - id: reliable-training-operations.base
    objective_ref: objective.reliable-training-operations
    task: base
    response_type: single_choice
    points: 1
    hint: 'Practice recovery before a long run: trace the inputs, operation, and result before choosing.'
    remediation_scene: reliable-training-operations.s2
    variants:
      - id: reliable-training-operations.base.1
        prompt: Why test checkpoint restoration early?
        options:
          - id: b
            text: Because saved files always prove recovery
          - id: c
            text: To avoid evaluating any outputs
          - id: a
            text: To establish that saved state can actually resume
        answer: a
        feedback: Recovery is a behavior that needs verification.
        retired: true
      - id: reliable-training-operations.base.2
        prompt: Do fixed seeds guarantee bitwise equality across hardware?
        options:
          - id: c
            text: Only for every GPU operation
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Execution and numerical ordering can still differ.
        retired: true
  - id: reliable-training-operations.transfer
    objective_ref: objective.reliable-training-operations
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Account for resources honestly: trace the inputs, operation, and result before choosing.'
    remediation_scene: reliable-training-operations.s4
    variants:
      - id: reliable-training-operations.transfer.1
        prompt: A cost report counts only the final successful run. What should it say?
        options:
          - id: c
            text: That hardware time equals energy exactly
          - id: a
            text: That its scope excludes other experiments and costs
          - id: b
            text: That it proves total project cost
        answer: a
        feedback: Accounting boundaries determine what a number means.
        retired: true
      - id: reliable-training-operations.transfer.2
        prompt: Low device utilization appears with empty input queues. What should be inspected?
        options:
          - id: a
            text: The input pipeline and its bottlenecks
          - id: b
            text: Only model accuracy
          - id: c
            text: Only output token spelling
        answer: a
        feedback: The accelerator may be waiting for data rather than lacking arithmetic capacity.
        retired: true
  - id: reliable-training-operations.base.v2
    objective_ref: objective.reliable-training-operations
    task: base
    response_type: single_choice
    points: 1
    hint: Cluster MTBF is the per-GPU MTBF divided by N, and the best interval is √(2CM), so it moves with the square root of each input. A restart must use shards from a single step.
    remediation_scene: reliable-training-operations.interval
    variants:
      - id: reliable-training-operations.base.v2.1
        prompt: Each of 1,000 GPUs fails on average once every 40,000 hours, independently. About how often does a job that needs all of them fail?
        options:
          - id: b
            text: About every 40,000 hours, the same as one GPU
          - id: a
            text: About every 40 hours
          - id: c
            text: About every 40 million hours
        answer: a
        feedback: Failure rates add, so the cluster fails 1,000 times as often as one GPU, every 40,000 ÷ 1,000 = 40 hours. Multiplying instead of dividing gives 40 million.
      - id: reliable-training-operations.base.v2.2
        prompt: A team's checkpoint write time grows from 1 minute to 4 minutes, with the same MTBF. How should the optimal checkpoint interval change?
        options:
          - id: c
            text: Stay the same, since the failure rate hasn't changed
          - id: b
            text: Grow four times longer, to match the write time
          - id: a
            text: Double, since it grows with the square root of write time
        answer: a
        feedback: τ* = √(2CM), so quadrupling C multiplies τ* by √4 = 2. Checkpoints cost more, so you take them less often, but not four times less often.
      - id: reliable-training-operations.base.v2.3
        prompt: After a crash, the checkpoint directory holds step-1,000 shards from 255 GPUs and a step-999 shard from the 256th. How should the job restart?
        options:
          - id: a
            text: From step 999, the newest step with a complete set of shards
          - id: b
            text: From step 1,000, reusing the one step-999 shard in its place
          - id: c
            text: From each GPU's own newest shard, then let them resync
        answer: a
        feedback: A usable checkpoint is every shard from one step. Mixing steps builds a model state that never existed, so fall back to step 999, if its shards are all present and verified.
      - id: reliable-training-operations.base.v2.4
        prompt: A large run's loss spikes sharply despite gradient clipping. What did the PaLM team do in this situation?
        options:
          - id: c
            text: Removed those batches from the dataset permanently as bad data
          - id: a
            text: Restarted about 100 steps before the spike, skipping those batches
          - id: b
            text: Lowered the learning rate permanently and carried on from the spike
        answer: a
        feedback: They rolled back to a checkpoint before the spike and skipped roughly 200–500 batches. The same batches didn't cause spikes from a different starting point, so they weren't simply bad data.
  - id: reliable-training-operations.transfer.v2
    objective_ref: objective.reliable-training-operations
    task: transfer
    response_type: single_choice
    points: 1
    hint: Decide whether the problem is a crash, a silent wrong answer, a slow worker, or an accounting boundary, then pick the check that exposes that one.
    remediation_scene: reliable-training-operations.incidents
    variants:
      - id: reliable-training-operations.transfer.v2.1
        prompt: In a data-parallel run, a periodic checksum shows that replica 117's weights differ from those of the other 255 replicas. What is the likeliest cause?
        options:
          - id: b
            text: Normal rounding differences, which make replicas drift apart
          - id: a
            text: Silent data corruption on the hardware behind replica 117
          - id: c
            text: A straggler, since slow replicas fall a step behind the others
        answer: a
        feedback: Every replica applies the same all-reduced gradient to the same weights, so they should stay identical. One outlier points to hardware computing wrong numbers. A straggler slows the step but ends with the same weights.
      - id: reliable-training-operations.transfer.v2.2
        prompt: Over a day, step time creeps from 5.5 s to 7 s. Per-GPU timings show one GPU's backward pass taking 40% longer than the rest, and it's running hot. What should the team do?
        options:
          - id: a
            text: Swap that node for a spare and restart from the last checkpoint
          - id: b
            text: Raise the batch size so the slow GPU's delay is spread out
          - id: c
            text: Lower the learning rate to make each step's update smaller
        answer: a
        feedback: In synchronous training the slowest GPU sets the pace for all of them, so removing the straggler recovers the lost time. Batch size and learning rate don't touch a hardware slowdown.
      - id: reliable-training-operations.transfer.v2.3
        prompt: A paper reports "training energy, 74 MWh," computed as GPUs × 400 W rated power × hours of the final run. What should the report make clear?
        options:
          - id: c
            text: That rated power matches measured draw, so the number is exact
          - id: b
            text: That this is the model's full energy footprint, start to finish
          - id: a
            text: That it covers GPU power in the final run only, estimated from ratings
        answer: a
        feedback: The figure leaves out CPUs, networking, cooling, failed runs, and earlier experiments, and rated power isn't measured draw. Naming the boundary makes it a useful number.
      - id: reliable-training-operations.transfer.v2.4
        prompt: A company moves a training job from 256 to 4,096 GPUs of the same type, keeping the checkpoint write time at 2 minutes. How should the checkpoint interval change?
        options:
          - id: b
            text: Shrink about 16×, in step with the cluster's MTBF
          - id: c
            text: Stay the same, since each GPU is just as reliable
          - id: a
            text: Shrink about 4×, the square root of the 16× MTBF drop
        answer: a
        feedback: 16 times the GPUs means a 16× shorter cluster MTBF, and τ* = √(2CM) shrinks by √16 = 4. Per-GPU reliability is unchanged, but the job now depends on 16 times as many parts.
  - id: reliable-training-operations.calculate
    objective_ref: objective.reliable-training-operations
    task: base
    response_type: numeric
    points: 1
    hint: "Cluster MTBF = per-GPU MTBF ÷ N. Best interval = √(2 × C × M). Waste ≈ C/τ + τ/(2M). Keep minutes with minutes and hours with hours."
    remediation_scene: reliable-training-operations.interval
    absolute_tolerance: 0.5
    variants:
      - id: reliable-training-operations.calculate.1
        prompt: Each GPU has an MTBF of 50,000 hours. What is the MTBF, in hours, of a job that needs all of 2,000 such GPUs?
        answer: 25
        feedback: 50,000 ÷ 2,000 = 25 hours, so expect about one failure a day.
      - id: reliable-training-operations.calculate.2
        prompt: A checkpoint takes C = 1 minute to write and the cluster MTBF is M = 200 minutes. What is Young's optimal checkpoint interval, in minutes?
        answer: 20
        feedback: √(2 × 1 × 200) = √400 = 20 minutes.
      - id: reliable-training-operations.calculate.3
        prompt: With C = 1 minute, M = 200 minutes and a checkpoint every 20 minutes, what percentage of time is wasted according to C/τ + τ/(2M)?
        answer: 10
        feedback: 1/20 = 5% writing checkpoints, plus 20/400 = 5% lost work, gives 10%. At the optimal interval the two parts are equal.
      - id: reliable-training-operations.calculate.4
        prompt: A checkpoint takes 2 minutes to write, and the cluster MTBF is 11,700 minutes. What is the optimal checkpoint interval, in minutes?
        answer: 216
        feedback: √(2 × 2 × 11,700) = √46,800 ≈ 216 minutes, about every 3.6 hours.
      - id: reliable-training-operations.calculate.5
        prompt: A run of 64 GPUs lasts 10 days, and each GPU draws about 0.5 kW. Counting GPU power only, how many MWh (1 MWh = 1,000 kWh) does it use?
        answer: 7.7
        feedback: 64 × 0.5 kW × 240 hours = 7,680 kWh ≈ 7.7 MWh, for GPUs alone.
      - id: reliable-training-operations.calculate.6
        prompt: A report counts 419 unexpected interruptions in a 54-day stretch of training. On average, how many hours passed between interruptions?
        answer: 3.1
        feedback: 54 × 24 = 1,296 hours, divided by 419 ≈ 3.1 hours between interruptions.
