schema_version: 0.2-draft
lesson:
  id: reliable-training-operations
  version: 0.1.0-draft
  title: Make a large training run recoverable and auditable
  state: draft
  summary: Reliable training operations connect health monitoring, checkpoint recovery, reproducible configuration,
    and resource accounting to the identity and limitations of the resulting model.
  slot: M17.8
  category: learning
  sources:
  - title: The Llama 3 Herd of Models
    url: https://arxiv.org/abs/2407.21783
  - title: DeepSeek-V3 Technical Report
    url: https://arxiv.org/abs/2412.19437
  - title: Green AI
    url: https://arxiv.org/abs/1907.10597
objectives:
- id: objective.reliable-training-operations
  version: 1-draft
  statement: Reliable training operations connect health monitoring, checkpoint recovery, reproducible configuration,
    and resource accounting to the identity and limitations of the resulting model.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - reliable-training-operations.base
  - reliable-training-operations.transfer
  prerequisites:
  - anyOf:
    - objective.pretraining-budget-and-checkpoints
  - anyOf:
    - objective.sharding-and-recomputation
  - anyOf:
    - objective.mixed-precision-training
scenes:
- id: reliable-training-operations.s1
  title: Monitor more than the final loss
  type: explanation
  depth: intuition
  objective_refs:
  - objective.reliable-training-operations
  markdown: Track loss by source, gradient norms, nonfinite events, throughput, device failures, and data-loader
    health. A stalled input pipeline can look like poor accelerator utilization; corrupted batches can create loss
    spikes. Logs should identify the step and configuration without unnecessarily retaining sensitive raw examples.
  text_mode: Track loss by source, gradient norms, nonfinite events, throughput, device failures, and data-loader
    health. A stalled input pipeline can look like poor accelerator utilization; corrupted batches can create loss
    spikes. Logs should identify the step and configuration without unnecessarily retaining sensitive raw examples.
  bridges: []
- id: reliable-training-operations.s2
  title: Practice recovery before a long run
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reliable-training-operations
  markdown: A checkpoint should be complete, consistent across shards, and linked to code, tokenizer, optimizer,
    and data progress. Test restoring it into a short continuation. A file existing on disk does not prove that
    a distributed state can resume coherently after a worker failure.
  text_mode: A checkpoint should be complete, consistent across shards, and linked to code, tokenizer, optimizer,
    and data progress. Test restoring it into a short continuation. A file existing on disk does not prove that
    a distributed state can resume coherently after a worker failure.
  bridges: []
- id: reliable-training-operations.s3
  title: Describe reproducibility precisely
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reliable-training-operations
  markdown: Fixed seeds help, but parallel reduction order, nondeterministic kernels, hardware, and library versions
    can alter results. Distinguish bitwise replay from statistically similar reruns. Record what is reproducible
    and what is merely documented; missing training data prevents some forms of independent reproduction.
  text_mode: Fixed seeds help, but parallel reduction order, nondeterministic kernels, hardware, and library versions
    can alter results. Distinguish bitwise replay from statistically similar reruns. Record what is reproducible
    and what is merely documented; missing training data prevents some forms of independent reproduction.
  bridges: []
- id: reliable-training-operations.s4
  title: Account for resources honestly
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reliable-training-operations
  markdown: Report accelerator type and time, utilization assumptions, training stages included, and measurement
    boundaries. Energy can be measured or estimated from power over time; emissions also depend on electricity and
    accounting choices. A quoted final-run compute cost is not automatically the total cost of research and deployment.
  text_mode: Report accelerator type and time, utilization assumptions, training stages included, and measurement
    boundaries. Energy can be measured or estimated from power over time; emissions also depend on electricity and
    accounting choices. A quoted final-run compute cost is not automatically the total cost of research and deployment.
  bridges: []
- id: reliable-training-operations.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.reliable-training-operations
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Reliable training operations connect health monitoring, checkpoint recovery, reproducible configuration,
    and resource accounting to the identity and limitations of the resulting model.
