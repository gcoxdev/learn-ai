assessment_families:
- id: reliable-training-operations.base
  objective_ref: objective.reliable-training-operations
  task: base
  response_type: single_choice
  points: 1
  hint: 'Practice recovery before a long run: trace the inputs, operation, and result before choosing.'
  remediation_scene: reliable-training-operations.s2
  variants:
  - id: reliable-training-operations.base.1
    prompt: Why test checkpoint restoration early?
    options:
    - id: b
      text: Because saved files always prove recovery
    - id: c
      text: To avoid evaluating any outputs
    - id: a
      text: To establish that saved state can actually resume
    answer: a
    feedback: Recovery is a behavior that needs verification.
  - id: reliable-training-operations.base.2
    prompt: Do fixed seeds guarantee bitwise equality across hardware?
    options:
    - id: c
      text: Only for every GPU operation
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Execution and numerical ordering can still differ.
- id: reliable-training-operations.transfer
  objective_ref: objective.reliable-training-operations
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Account for resources honestly: trace the inputs, operation, and result before choosing.'
  remediation_scene: reliable-training-operations.s4
  variants:
  - id: reliable-training-operations.transfer.1
    prompt: A cost report counts only the final successful run. What should it say?
    options:
    - id: c
      text: That hardware time equals energy exactly
    - id: a
      text: That its scope excludes other experiments and costs
    - id: b
      text: That it proves total project cost
    answer: a
    feedback: Accounting boundaries determine what a number means.
  - id: reliable-training-operations.transfer.2
    prompt: Low device utilization appears with empty input queues. What should be inspected?
    options:
    - id: a
      text: The input pipeline and its bottlenecks
    - id: b
      text: Only model accuracy
    - id: c
      text: Only output token spelling
    answer: a
    feedback: The accelerator may be waiting for data rather than lacking arithmetic capacity.
