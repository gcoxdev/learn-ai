schema_version: 0.2-draft
lesson:
  id: reliable-training-operations
  version: 0.4.0-draft
  title: Make a large training run recoverable and auditable
  state: draft
  summary: Meta's Llama 3 run was interrupted about every three hours, mostly by hardware. Learn the arithmetic of failures, how often to checkpoint, and how to spot the failures that don't crash anything.
  slot: M17.8
  category: learning
  sources:
    - title: "A first order approximation to the optimum checkpoint interval (Young, Communications of the ACM, 1974)"
      url: https://doi.org/10.1145/361147.361115
    - title: "A higher order estimate of the optimum checkpoint interval for restart dumps (Daly, Future Generation Computer Systems, 2006)"
      url: https://doi.org/10.1016/j.future.2004.11.016
    - title: The Llama 3 Herd of Models (Llama Team, Meta, 2024)
      url: https://arxiv.org/abs/2407.21783
    - title: "PaLM: Scaling Language Modeling with Pathways (Chowdhery et al., 2022)"
      url: https://arxiv.org/abs/2204.02311
    - title: "Silent Data Corruptions at Scale (Dixit et al., 2021)"
      url: https://arxiv.org/abs/2102.11245
    - title: "Llama 2: Open Foundation and Fine-Tuned Chat Models (Touvron et al., 2023), table 2 on training energy"
      url: https://arxiv.org/abs/2307.09288
objectives:
  - id: objective.reliable-training-operations
    version: 2-draft
    statement: Reliable training operations connect health monitoring, checkpoint recovery, reproducible configuration, and resource accounting to the identity and limitations of the resulting model.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - reliable-training-operations.base.v2
      - reliable-training-operations.transfer.v2
      - reliable-training-operations.calculate
    prerequisites:
      - anyOf:
          - objective.pretraining-budget-and-checkpoints
      - anyOf:
          - objective.sharding-and-recomputation
      - anyOf:
          - objective.mixed-precision-training
scenes:
  - id: reliable-training-operations.s1
    title: A failure every eight days, or every three hours
    type: explanation
    depth: intuition
    objective_refs:
      - objective.reliable-training-operations
    markdown: |-
      A single A100 in a well-run data center is reliable. Suppose each GPU, together with its share of host, cables, and switches, fails on average once every 50,000 hours, nearly six years. That average is its **mean time between failures (MTBF)**.

      The team's synchronous job stops if *any* of its 256 GPUs fails. With independent failures, the cluster's failure rate is the sum of the parts' rates, so

      $$\text{MTBF}_{\text{cluster}} \approx \frac{\text{MTBF}_{\text{GPU}}}{N} = \frac{50{,}000 \text{ h}}{256} \approx 195 \text{ hours, about 8 days.}$$

      Over a 30-day run, expect about four crashes.

      :::predict Meta trained Llama 3 405B on 16,384 H100 GPUs. With the same 50,000-hour figure, how often would the job fail?
      50,000 ÷ 16,384 ≈ 3 hours. That's close to what Meta reported: in a 54-day stretch of pretraining, 419 unexpected interruptions, one about every 3.1 hours, with roughly 78% traced to confirmed or suspected hardware problems. At that scale, recovery has to be automatic.
      :::
    bridges: []
  - id: reliable-training-operations.interval
    title: How often to checkpoint
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.reliable-training-operations
    markdown: |-
      A checkpoint (the pretraining module listed what goes in one) costs time to write. The team's sharded checkpoint takes $C$ = 2 minutes. Checkpoint too often and you spend all your time writing; too rarely and each crash throws away hours of work. On average a crash lands halfway through an interval $\tau$, losing $\tau/2$ of work, and crashes come once per MTBF $M$. So the fraction of time wasted is about

      $$\text{waste}(\tau) \approx \frac{C}{\tau} + \frac{\tau}{2M}$$

      :::papers Young's optimal checkpoint interval (Young, 1974; refined by Daly, 2006)
      Setting the derivative of the waste to zero gives

      $$\tau^* = \sqrt{2\,C\,M}$$

      For the team, $M$ = 195.3 hours ≈ 11,719 minutes, so $\tau^* = \sqrt{2 \times 2 \times 11{,}719} \approx 217$ minutes, about every 3.6 hours. At that interval the two costs balance: 2/217 ≈ 0.92% writing plus 217/23,438 ≈ 0.93% lost work, about 1.85% in total. Daly's refinement adds correction terms, including the time to restart, that matter only when $C$ is not small compared with $M$.
      :::

      The simulation below injects random crashes and compares the measured waste with the formula:

      ```python run
      import math, random

      C = 2.0                      # minutes to write one checkpoint
      M = 50_000 * 60 / 256        # cluster MTBF in minutes (per-GPU 50,000 h, 256 GPUs)
      print(f"cluster MTBF {M / 60:.0f} h; Young's interval sqrt(2CM) = {math.sqrt(2 * C * M):.0f} min")

      def simulate(tau, minutes=20_000_000, seed=0):
          """Work tau minutes, write a checkpoint (C), repeat; a crash loses the current segment."""
          rng = random.Random(seed)
          t, useful = 0.0, 0.0
          next_fail = rng.expovariate(1 / M)
          while t < minutes:
              if t + tau + C <= next_fail:          # segment and checkpoint finish safely
                  t += tau + C
                  useful += tau
              else:                                 # crash: roll back to the last checkpoint
                  t = next_fail
                  next_fail = t + rng.expovariate(1 / M)
          return 1 - useful / t

      for tau in [30, 100, 217, 500, 1500]:
          formula = C / tau + tau / (2 * M)
          print(f"every {tau:5d} min: wasted {simulate(tau):6.2%} (formula {formula:6.2%})")
      ```

      The minimum sits at 217 minutes. Now change 256 to 16384, Llama 3's scale: the best interval drops to about 27 minutes, and even the 30-minute row wastes about 14% of the run. That's why large labs write checkpoints asynchronously, first to CPU memory and then to storage, which shrinks $C$.
    bridges: []
  - id: reliable-training-operations.s2
    title: Practice the restart before you need it
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.reliable-training-operations
    markdown: |-
      With FSDP, each of the 256 GPUs writes its own **shard**, its slice of the weights and optimizer state. A usable checkpoint is all 256 shards from the *same* step, plus the data loader's position, the learning-rate schedule, and the random-number states. Combining GPU 1's shard from step 1,000 with GPU 2's from step 999 creates a model that never existed. So a checkpoint counts as done only when every shard has been written and verified with a checksum, and a restart loads the newest step for which that's true.

      Test it before the long run: kill a job on purpose, restart from its last checkpoint, and check that the next steps' losses match an uninterrupted run. Restart time adds to each failure's cost too: with four crashes in a month, a 20-minute restart costs about 80 minutes; with 419 crashes, it costs days.
    bridges: []
  - id: reliable-training-operations.incidents
    title: Spikes, silent errors, and stragglers
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.reliable-training-operations
    markdown: |-
      Crashes are the easy failures, because everyone notices them. Three others don't stop the job:

      | Symptom | Likely cause | What to check and do |
      | --- | --- | --- |
      | Loss jumps far above its recent average, gradient norm spikes | Unstable optimization on particular batches | Roll back to a checkpoint before the spike and skip the batches around it |
      | One replica's weights differ from the others; loss drifts or turns NaN for no clear reason | **Silent data corruption**: hardware returning wrong numbers without raising an error | Compare weight checksums across data-parallel replicas; rerun the step on other hardware; remove the faulty GPU |
      | Step time creeps up; per-GPU timings show one slow worker | A **straggler**: a hot, throttled, or failing GPU or link | Replace that node from a spare pool and restart from the last checkpoint |

      Loss spikes are well documented. Training the 540B PaLM model (2022), Google saw about 20 spikes despite gradient clipping. They restarted from a checkpoint about 100 steps before each spike and skipped roughly 200–500 batches. The same batches caused no spike when fed from a different starting point, so the data wasn't simply bad. To catch spikes automatically, compare each step's loss with a running mean and standard deviation, and alert when it lands several standard deviations above.

      Whenever several GPUs hold full copies of the same weights (plain data parallelism, or sharding inside each node and replicating across nodes), those copies should be identical after every step. That makes corruption detectable: a replica whose weight checksum disagrees with its peers has computed something wrong. Meta has described such silent corruptions in its fleet (Dixit et al., 2021), and the Llama 3 report counts them among its hardware problems.
    bridges: []
  - id: reliable-training-operations.s3
    title: Say exactly what can be reproduced
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.reliable-training-operations
    markdown: |-
      **Bitwise replay**, getting exactly the same bits when a step is rerun, needs the same code, data order, seeds, library versions, hardware, and deterministic kernels. Many fast GPU kernels add numbers in whatever order threads finish, and floating-point addition isn't associative, so a rerun can differ in the last digits. Without that, the most you can promise is that reruns are **statistically similar**: they land within a known range of loss and scores. Record which of the two you can promise, and keep the configuration, commit hash, and data manifest with every checkpoint.
    bridges: []
  - id: reliable-training-operations.s4
    title: Account for resources honestly
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.reliable-training-operations
    markdown: |-
      Energy is power × time. Llama 2's report estimated its emissions from GPU-hours at 400 W per A100, the GPU's peak power rating. For the team: 256 GPUs × 0.4 kW × 720 hours ≈ 74,000 kWh, or 74 MWh, for one 30-day run. State what that number covers: GPU power only, at rated rather than measured draw, for the final run. It leaves out CPUs, networking, cooling, restarts, and every experiment that came before. Report it as "final-run GPU energy," not the model's footprint.
    bridges: []
  - id: reliable-training-operations.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.reliable-training-operations
    markdown: Cluster MTBFs and checkpoint intervals to compute, mismatched shards, a replica whose checksum disagrees, a slow GPU, and an energy report test whether you can keep a long run healthy and honest.
    takeaway: |-
      A cluster of N GPUs fails about N times as often as one GPU, so checkpoint about every √(2 × write time × MTBF) and rehearse restarts. Watch for the failures that don't crash: loss spikes, silent data corruption, and stragglers.
  - id: reliable-training-operations.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.reliable-training-operations
    markdown: |-
      A recoverable run needs more than a saved weight file. Test restoration, record the conditions of the run, and state exactly which stages your resource measurements include.
