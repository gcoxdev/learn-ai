assessment_families:
  - id: comparing-search-and-hybrid-methods.base
    objective_ref: objective.comparing-search-and-hybrid-methods
    task: base
    response_type: single_choice
    points: 1
    hint: 'Count every kind of effort: trace the inputs, operation, and result before choosing.'
    remediation_scene: comparing-search-and-hybrid-methods.s2
    variants:
      - id: comparing-search-and-hybrid-methods.base.1
        prompt: What is an important first distinction when selecting an optimizer?
        options:
          - id: c
            text: Only the final file extension
          - id: a
            text: Whether the objective provides useful derivatives and what evaluations cost
          - id: b
            text: Only the method’s biological analogy
        answer: a
        feedback: Objective access and cost shape suitable search.
        retired: true
      - id: comparing-search-and-hybrid-methods.base.2
        prompt: Does fewer objective evaluations always mean less total effort?
        options:
          - id: a
            text: No; internal and engineering costs can differ
          - id: b
            text: 'Yes'
          - id: c
            text: Only if candidates are neural
        answer: a
        feedback: Resource accounting must include relevant work.
        retired: true
  - id: comparing-search-and-hybrid-methods.transfer
    objective_ref: objective.comparing-search-and-hybrid-methods
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Run a bounded comparative study: trace the inputs, operation, and result before choosing.'
    remediation_scene: comparing-search-and-hybrid-methods.s4
    variants:
      - id: comparing-search-and-hybrid-methods.transfer.1
        prompt: Can a symbolic guarantee depend on incorrect input facts?
        options:
          - id: a
            text: 'Yes'
          - id: b
            text: 'No'
          - id: c
            text: Only if the solver is stochastic
        answer: a
        feedback: Encoded validity does not establish premise truth.
        retired: true
      - id: comparing-search-and-hybrid-methods.transfer.2
        prompt: A method wins one narrow study. What conclusion is supported?
        options:
          - id: b
            text: It is universally superior
          - id: c
            text: Every alternative is obsolete
          - id: a
            text: It performed best under those tested conditions
        answer: a
        feedback: Evidence scope limits generalization.
        retired: true
  - id: comparing-search-and-hybrid-methods.base.v2
    objective_ref: objective.comparing-search-and-hybrid-methods
    task: base
    response_type: single_choice
    points: 1
    hint: Answer the four questions in order (gradient, cost per evaluation, parallel capacity, noise) and rule out the rows that can't fit.
    remediation_scene: comparing-search-and-hybrid-methods.s2
    variants:
      - id: comparing-search-and-hybrid-methods.base.v2.1
        prompt: In the lesson's race, gradient descent stayed at 90 on the terraced bowl while the (1+1)-ES reached 0. Why?
        options:
          - id: b
            text: The ES was given more evaluations than gradient descent
          - id: a
            text: The terraces have zero gradient, while the ES only compares scores
          - id: c
            text: Gradient descent's learning rate of 0.1 was too small for terraces
        answer: a
        feedback: On flat steps the gradient is 0, so gradient descent never moves, whatever its learning rate. The ES needs only to know which of two points scores better, which still works on terraces. Both methods had the same 300 evaluations.
      - id: comparing-search-and-hybrid-methods.base.v2.2
        prompt: What do the no free lunch theorems imply for choosing an optimizer?
        options:
          - id: a
            text: A method beats others by fitting the structure of the problem at hand
          - id: b
            text: Random search is the safest choice, since it matches the average method
          - id: c
            text: Newer methods beat older ones once enough benchmarks are averaged
        answer: a
        feedback: Averaged over all possible objectives, every algorithm ties, so an advantage comes from exploiting structure your problem actually has. Real problems aren't a uniform average of all functions, which is why structured methods beat random search in practice.
      - id: comparing-search-and-hybrid-methods.base.v2.3
        prompt: Why is a genetic algorithm a poor choice for training a 10-million-weight image classifier with a differentiable loss?
        options:
          - id: c
            text: Genetic algorithms can't represent real-valued weights at all
          - id: b
            text: The classifier's loss is too noisy for a population to average
          - id: a
            text: One gradient gives a direction for all weights, which a GA must find by trial
        answer: a
        feedback: A backward pass tells you how to adjust every weight at once, so gradient descent uses each evaluation far more efficiently. Real-valued GAs and ES exist, and minibatch noise is handled well by SGD; the issue is wasting the gradient.
      - id: comparing-search-and-hybrid-methods.base.v2.4
        prompt: Which property most favors Bayesian optimization over a particle swarm?
        options:
          - id: b
            text: Evaluations are cheap and thousands of them can run in parallel
          - id: a
            text: Each evaluation is expensive and only a few dozen are affordable
          - id: c
            text: The problem has hundreds of discrete yes/no design choices
        answer: a
        feedback: BO spends computation choosing each run carefully, which pays off when runs are expensive and few. Cheap, massively parallel evaluations suit swarms or GAs, and hundreds of discrete choices strain a Gaussian-process surrogate.
  - id: comparing-search-and-hybrid-methods.transfer.v2
    objective_ref: objective.comparing-search-and-hybrid-methods
    task: transfer
    response_type: single_choice
    points: 1
    hint: Write down the gradient, cost, parallelism, and noise for the new problem first; the method usually follows.
    remediation_scene: comparing-search-and-hybrid-methods.s4
    variants:
      - id: comparing-search-and-hybrid-methods.transfer.v2.1
        prompt: A chemistry lab's robot runs one reaction at a time, each taking 3 hours, to maximize yield over 3 temperature and concentration settings. Which method fits?
        options:
          - id: a
            text: Bayesian optimization, choosing each reaction from a surrogate
          - id: b
            text: A genetic algorithm with a population of 50 reactions
          - id: c
            text: Gradient descent using the yield's derivative
        answer: a
        feedback: Few expensive, sequential evaluations in a low-dimensional space fit BO. A 50-reaction population would take a week per generation, and a lab reaction gives no derivative.
      - id: comparing-search-and-hybrid-methods.transfer.v2.2
        prompt: A wind-farm designer places 30 turbines on a site. A wake simulator scores a layout in 2 seconds, gives no gradients, and 200 CPU cores are available. Which method fits?
        options:
          - id: c
            text: Bayesian optimization, since each layout must be chosen with care
          - id: a
            text: A genetic algorithm or particle swarm evaluated across the cores
          - id: b
            text: Reinforcement learning, since the turbines are placed one by one
        answer: a
        feedback: Cheap, gradient-free evaluations and many cores suit population methods, which score a whole generation in parallel. BO's careful choices waste that capacity, and placing turbines isn't a sequential decision problem with delayed rewards.
      - id: comparing-search-and-hybrid-methods.transfer.v2.3
        prompt: A game studio wants a bot that decides moves turn by turn, with the score known only at the end of each match. A fast simulator runs thousands of matches per minute. Which approach fits the structure?
        options:
          - id: b
            text: Bayesian optimization over the bot's first move in each match
          - id: c
            text: Simulated annealing on a single fixed sequence of moves
          - id: a
            text: Reinforcement learning, trained on many simulated matches
        answer: a
        feedback: Turn-by-turn decisions with delayed rewards and a fast simulator are RL's home ground. Optimizing only the first move or one fixed move sequence ignores how the game responds to each move.
      - id: comparing-search-and-hybrid-methods.transfer.v2.4
        prompt: A paper claims its hybrid GA-plus-hill-climbing method beats plain simulated annealing on chip floorplans. The hybrid got 10 times as many evaluations and one seed. What is the most important fix?
        options:
          - id: a
            text: Rerun both with equal evaluation budgets over several seeds
          - id: b
            text: Add a neural network to the hybrid so it can also learn
          - id: c
            text: Report the hybrid's best run in more detail than annealing's
        answer: a
        feedback: A fair comparison matches budgets and reports variation across seeds. With 10 times the evaluations, the hybrid's win may just be extra search. Adding components or more detail on one side doesn't fix the comparison.
  - id: comparing-search-and-hybrid-methods.calculate
    objective_ref: objective.comparing-search-and-hybrid-methods
    task: base
    response_type: numeric
    points: 1
    hint: Convert the time budget into evaluations (time ÷ time per evaluation × machines), then divide by what one generation or step needs.
    remediation_scene: comparing-search-and-hybrid-methods.s3
    absolute_tolerance: 0.01
    variants:
      - id: comparing-search-and-hybrid-methods.calculate.1
        prompt: Each evaluation takes 10 minutes. With 4 machines running in parallel for 3 hours, how many evaluations fit?
        answer: 72
        feedback: One machine fits 180 / 10 = 18 evaluations; four machines fit 18 × 4 = 72.
      - id: comparing-search-and-hybrid-methods.calculate.2
        prompt: A genetic algorithm has a population of 50 and a budget of 1,000 evaluations. How many full generations can it run?
        answer: 20
        feedback: Each generation scores 50 candidates, so 1,000 / 50 = 20 generations.
      - id: comparing-search-and-hybrid-methods.calculate.3
        prompt: A grid search tries 5 values for each of 4 hyperparameters. How many training runs does it need?
        answer: 625
        feedback: 5 × 5 × 5 × 5 = 5⁴ = 625 runs, which is why grid search is impractical for expensive runs.
      - id: comparing-search-and-hybrid-methods.calculate.4
        prompt: Each training run takes 4 GPU-hours and the budget is 160 GPU-hours on one GPU. How many runs can Bayesian optimization make?
        answer: 40
        feedback: 160 / 4 = 40 runs, the budget in the lesson's speech-model problem.
      - id: comparing-search-and-hybrid-methods.calculate.5
        prompt: A particle swarm has 20 particles, and each particle's evaluation takes 30 seconds. With 20 machines, one per particle, how many swarm steps fit in 1 hour?
        answer: 120
        feedback: All 20 particles are scored at once in 30 seconds, so one step takes 30 seconds, and 3,600 / 30 = 120 steps.
