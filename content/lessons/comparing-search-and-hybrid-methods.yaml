schema_version: 0.2-draft
lesson:
  id: comparing-search-and-hybrid-methods
  version: 0.1.0-draft
  title: Choose a search or hybrid method for the constraints you have
  state: draft
  summary: Comparisons among evolutionary, fuzzy, symbolic, Bayesian, and gradient methods should expose objective
    access, representation, constraints, evaluation cost, and interpretability limits.
  slot: M32.8
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
  - title: A Tutorial on Bayesian Optimization
    url: https://arxiv.org/abs/1807.02811
objectives:
- id: objective.comparing-search-and-hybrid-methods
  version: 1-draft
  statement: Comparisons among evolutionary, fuzzy, symbolic, Bayesian, and gradient methods should expose objective
    access, representation, constraints, evaluation cost, and interpretability limits.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - comparing-search-and-hybrid-methods.base
  - comparing-search-and-hybrid-methods.transfer
  prerequisites:
  - anyOf:
    - objective.bayesian-optimization-and-automl
  - anyOf:
    - objective.neuro-symbolic-learning
  - anyOf:
    - objective.fuzzy-sets-and-control
  - anyOf:
    - objective.swarm-optimization
scenes:
- id: comparing-search-and-hybrid-methods.s1
  title: Start with the objective interface
  type: explanation
  depth: intuition
  objective_refs:
  - objective.comparing-search-and-hybrid-methods
  markdown: If a smooth differentiable loss is available, gradients can be efficient. If evaluations are expensive
    and low-dimensional, a surrogate-guided search may help. Discrete programs, hard constraints, or expert rules
    suggest other representations. These are starting hypotheses to test, not universal rankings.
  text_mode: If a smooth differentiable loss is available, gradients can be efficient. If evaluations are expensive
    and low-dimensional, a surrogate-guided search may help. Discrete programs, hard constraints, or expert rules
    suggest other representations. These are starting hypotheses to test, not universal rankings.
  bridges: []
- id: comparing-search-and-hybrid-methods.s2
  title: Count every kind of effort
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.comparing-search-and-hybrid-methods
  markdown: A method may use fewer objective evaluations but more internal computation or expert engineering. Another
    parallelizes many cheap candidates but wastes serial resources. Compare wall time, hardware, labels, manual
    rules, and solution quality under the decision’s actual budget.
  text_mode: A method may use fewer objective evaluations but more internal computation or expert engineering. Another
    parallelizes many cheap candidates but wastes serial resources. Compare wall time, hardware, labels, manual
    rules, and solution quality under the decision’s actual budget.
  bridges: []
- id: comparing-search-and-hybrid-methods.s3
  title: Inspect feasibility and explanation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.comparing-search-and-hybrid-methods
  markdown: A fuzzy rule base can be readable yet have complex interactions. A symbolic solver can certify encoded
    constraints while relying on uncertain inputs. An evolved program can be small but difficult to interpret. Explain
    what guarantees or insights follow from the actual representation.
  text_mode: A fuzzy rule base can be readable yet have complex interactions. A symbolic solver can certify encoded
    constraints while relying on uncertain inputs. An evolved program can be small but difficult to interpret. Explain
    what guarantees or insights follow from the actual representation.
  bridges: []
- id: comparing-search-and-hybrid-methods.s4
  title: Run a bounded comparative study
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.comparing-search-and-hybrid-methods
  markdown: Choose a simple baseline, fix data and stopping rules, repeat stochastic methods, and report failures.
    If one method wins on a narrow task, state that scope. Hybrid complexity is justified when its measured benefits
    and maintainability support the intended application.
  text_mode: Choose a simple baseline, fix data and stopping rules, repeat stochastic methods, and report failures.
    If one method wins on a narrow task, state that scope. Hybrid complexity is justified when its measured benefits
    and maintainability support the intended application.
  bridges: []
- id: comparing-search-and-hybrid-methods.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.comparing-search-and-hybrid-methods
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Comparisons among evolutionary, fuzzy, symbolic, Bayesian, and gradient methods should expose objective
    access, representation, constraints, evaluation cost, and interpretability limits.
- id: comparing-search-and-hybrid-methods.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.comparing-search-and-hybrid-methods
  markdown: Comparisons among evolutionary, fuzzy, symbolic, Bayesian, and gradient methods should expose objective
    access, representation, constraints, evaluation cost, and interpretability limits.
  text_mode: Comparisons among evolutionary, fuzzy, symbolic, Bayesian, and gradient methods should expose objective
    access, representation, constraints, evaluation cost, and interpretability limits.
navigation:
