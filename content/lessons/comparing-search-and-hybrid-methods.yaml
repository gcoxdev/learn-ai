lesson:
  id: comparing-search-and-hybrid-methods
  version: 0.4.0-draft
  title: Choose a search or hybrid method for the constraints you have
  state: draft
  summary: Three problems land on your desk on Monday. Gradient descent, a genetic algorithm, a swarm, Bayesian optimization, or reinforcement learning? Four questions about the objective pick the tool.
  slot: M32.8
  category: learning
  sources:
