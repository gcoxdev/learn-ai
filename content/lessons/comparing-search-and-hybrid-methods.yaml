scenes:
  - id: comparing-search-and-hybrid-methods.s1
    title: Ask the objective four questions
    type: explanation
    depth: intuition
    objective_refs:
      - objective.comparing-search-and-hybrid-methods
    markdown: |-
      Three problems arrive on Monday:

      1. **Tune a speech model**: 5 hyperparameters, 4 GPU-hours per training run, budget of 40 runs.
      2. **Build the exam timetable**: 60 exams into 15 slots, with hard clash rules; checking a timetable takes a millisecond.
      3. **Train an image classifier**: 10 million weights, a labeled dataset, and a differentiable loss.

      This module and earlier ones gave you a toolbox: gradient descent, local search and simulated annealing, genetic algorithms, particle swarms, Bayesian optimization, and reinforcement learning. Before reaching for one, ask the objective four questions. **Can I get its gradient?** **How much does one evaluation cost?** **How many evaluations can run at once?** **How noisy is each result?**

      The first question matters most. Here gradient descent, a (1+1) evolution strategy, and random search each get 300 evaluations on two versions of a 10-setting problem. "Smooth" is a bowl with a useful gradient. "Terraced" is the same bowl rounded into flat steps, so its gradient is 0 almost everywhere.

      ```python run
      import numpy as np

      D, BUDGET = 10, 300                       # 10 settings to tune, 300 evaluations each
      smooth = lambda x: np.sum(x**2)           # has a useful gradient: 2x
      terraced = lambda x: np.sum(np.round(x)**2)  # flat terraces: gradient is 0 almost everywhere

      def gradient_descent(f, grad, x):
          for _ in range(BUDGET):               # one gradient per evaluation
              x = x - 0.1 * grad(x)
          return f(x)

      def one_plus_one_es(f, x, rng, sigma=1.0):
          fx, wins = f(x), 0
          for t in range(1, BUDGET + 1):
              child = x + sigma * rng.standard_normal(D)
              if f(child) <= fx:
                  x, fx, wins = child, f(child), wins + 1
              if t % 10 == 0:                   # 1/5 rule, checked every 10 tries
                  sigma *= 1.2 if wins > 2 else 1 / 1.2
                  wins = 0
          return fx

      def random_search(f, rng):
          return min(f(rng.uniform(-3, 3, D)) for _ in range(BUDGET))

      for name, f, grad in [("smooth", smooth, lambda x: 2 * x), ("terraced", terraced, lambda x: 0 * x)]:
          rng = np.random.default_rng(0)
          x0 = np.full(D, 3.0)
          print(f"{name:9} start {f(x0):5.1f} | gradient descent {gradient_descent(f, grad, x0):8.4f}"
                f" | (1+1)-ES {one_plus_one_es(f, x0, rng):8.4f} | random search {random_search(f, rng):5.1f}")
      ```

      On the smooth bowl, gradient descent reaches 0.0000 and the ES gets close (0.0558). On the terraces, gradient descent never moves from 90, while the ES, which only compares scores, reaches 0. Random search manages 7.9 and 11.0: in 10 dimensions, blind sampling rarely lands near the bottom. Try `D = 2` and watch random search catch up.
  - id: comparing-search-and-hybrid-methods.s2
    title: The comparison matrix
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.comparing-search-and-hybrid-methods
    markdown: |-
      Here are the typical profiles. Each cell describes common practice, not a hard limit.

      | Method | Needs gradients? | Evaluations to a good answer | Parallelism | Noise tolerance | Typical use |
      | --- | --- | --- | --- | --- | --- |
      | Gradient descent | Yes | Many cheap steps, even with millions of parameters | Within each step (batches on GPUs) | Good: SGD thrives on minibatch noise | Training neural networks |
      | Local search, annealing | No | Hundreds to millions, one after another | Low: separate restarts only | Fair: noisy comparisons can mislead | Schedules, layouts, discrete puzzles |
      | Genetic algorithm | No | Thousands and up | High: a whole generation at once | Good: the population averages it out | Discrete designs, programs, structures |
      | Particle swarm | No | Thousands | High: all particles each step | Fair | Continuous settings, up to dozens of dimensions |
      | Bayesian optimization | No | Tens to a few hundred | Low: mostly one at a time | Good: the surrogate models noise | Expensive runs with few settings |
      | Reinforcement learning | Not of the environment | Often millions of steps | High with many simulators | Built for random rewards | Sequential decisions |

      Read it by rows you can rule out. No gradient? Drop row 1. Each evaluation takes hours? Drop every row that needs thousands. Decisions unfold over time with delayed rewards? Only RL treats the problem as a sequence.

      :::mixup "Surely one of these is the best optimizer overall."
      No such method exists. David Wolpert and William Macready's **no free lunch theorems** (1997) show that, averaged over all possible objective functions, every search algorithm performs equally well. A method wins by matching the structure of *your* problem: a gradient, a cheap evaluation, a sequence, or a small budget.
      :::
  - id: comparing-search-and-hybrid-methods.s3
    title: Count every kind of effort
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.comparing-search-and-hybrid-methods
    markdown: |-
      Budgets are measured in evaluations and in wall-clock time, and parallel hardware changes one but not the other. Suppose each evaluation takes 10 minutes and you have 2 hours:

      | Setup | Evaluations that fit |
      | --- | ---: |
      | One machine, one at a time | 2 × 60 / 10 = 12 |
      | 8 machines in parallel | 12 × 8 = 96 |

      A genetic algorithm with a population of 100 can't finish its first generation on one machine, and even on 8 it gets fewer than one generation. Bayesian optimization, which makes each of those 12 runs count, fits the single machine. With 1,000 machines, the GA's parallel generations would suddenly look cheap.

      Count human effort too. A fuzzy controller needs experts to write and tune rules; a case-based system needs someone to curate cases; a neuro-symbolic model needs rules someone trusts. That effort buys something the numbers above don't show: rules an engineer can read, precedents a technician can check, constraints a solver enforces on every output.
  - id: comparing-search-and-hybrid-methods.s4
    title: Three problems, three choices
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.comparing-search-and-hybrid-methods
    markdown: |-
      Back to Monday's pile, with the four questions answered:

      | Problem | Gradient? | Cost per evaluation | Budget | Choice |
      | --- | --- | --- | --- | --- |
      | Speech-model tuning | No | 4 GPU-hours | 40 runs | Bayesian optimization, plus successive halving if early epochs predict final scores |
      | Exam timetable | No (discrete) | 1 millisecond | Millions | Simulated annealing or a GA, with hard clash rules enforced by the moves |
      | Image classifier | Yes | Cheap per minibatch | Millions of steps | Gradient descent (Adam), no contest |

      The classifier shows the power of gradients. One backward pass tells you how to change all 10 million weights at once. A GA would have to discover that direction by trial and error, one mutation at a time.

      :::predict A fourth problem arrives: a warehouse robot must learn when to pick, wait, or recharge, and rewards come only when orders ship hours later. Which row fits?
      Reinforcement learning. The decisions form a sequence, and each reward depends on many earlier choices, which is exactly what value functions and policy gradients handle. A GA or ES could still search over policy weights, as in the OpenAI evolution-strategies work, but it would ignore the step-by-step structure.
      :::

      Real systems often stack methods: Bayesian optimization tunes the learning rate of a gradient-trained network; a GA hands its best timetables to hill climbing for final polishing; a learned model proposes and a solver checks. Pick each layer with the same four questions, then compare the whole stack with a simple baseline on the same budget.
  - id: comparing-search-and-hybrid-methods.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.comparing-search-and-hybrid-methods
    markdown: Count how many evaluations fit a budget, then pick methods for a wind-farm layout, a chemistry robot, a game bot, and a chip floorplan.
    takeaway: |-
      Pick a search method by asking whether you have a gradient, how much one evaluation costs, how many can run at once, and how noisy results are. No method wins everywhere, so compare against a simple baseline on the same budget.
  - id: comparing-search-and-hybrid-methods.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.comparing-search-and-hybrid-methods
    markdown: |-
      Choose search methods from the information, constraints, and budget available. Compare complete costs and useful solutions under the same conditions.
