      url: https://aima.cs.berkeley.edu/
objectives:
  - id: objective.comparing-search-and-hybrid-methods
    version: 2-draft
    statement: Comparisons among evolutionary, fuzzy, symbolic, Bayesian, and gradient methods should expose objective access, representation, constraints, evaluation cost, and interpretability limits.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - comparing-search-and-hybrid-methods.base.v2
      - comparing-search-and-hybrid-methods.transfer.v2
      - comparing-search-and-hybrid-methods.calculate
    prerequisites:
