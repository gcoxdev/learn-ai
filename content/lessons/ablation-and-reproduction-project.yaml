schema_version: 0.2-draft
lesson:
  id: ablation-and-reproduction-project
  version: 0.4.0-draft
  title: 'Project: reproduce a result and audit an ablation'
  state: draft
  summary: A paper credits ridge regression with a six-point gain. Rerun it, pull the recipe apart with a seeded 2×2 ablation, and find out which ingredient really did the work.
  slot: M36.7
  category: learning
  minutes: 50
  sources:
    - title: Deep Reinforcement Learning that Matters (Henderson et al., 2018)
      url: https://arxiv.org/abs/1709.06560
    - title: An Introduction to Statistical Learning — authors’ materials
      url: https://www.statlearning.com/
objectives:
  - id: objective.ablation-and-reproduction-project
    version: 2-draft
    statement: Preregister a reproduction, run a seeded 2×2 ablation, and report each effect and their interaction with confidence intervals before crediting any one component.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - ablation-and-reproduction-project.base.v2
      - ablation-and-reproduction-project.transfer.v2
      - ablation-and-reproduction-project.effects.v2
    prerequisites:
      - anyOf:
          - objective.controlled-experiments
      - anyOf:
          - objective.research-reporting
      - anyOf:
          - objective.tiny-language-model-project
scenes:
  - id: ablation-and-reproduction-project.s1
    title: A paper says ridge adds six points
    type: explanation
    depth: intuition
    objective_refs:
      - objective.ablation-and-reproduction-project
    markdown: |-
      Your team is about to adopt a trick from a short workshop paper (made up for this project, but typical of real ones). Its abstract reads:

      > *On the Sensor-20 task, with only 30 training examples, ridge regression (λ = 10) raises test accuracy from 77.1 ± 2.0% to 83.2 ± 1.5%, a gain of 6.1 ± 1.9 points (95% intervals over 20 random seeds). Features were standardized.*

      Your lead asks one question: "Is it the ridge?" Read the last sentence again. The paper changed **two** things at once, ridge and standardizing, just like the math tutor in the lesson on controlled experiments that switched prompt and model together.

      **Your brief**

      | | |
      | --- | --- |
      | Goal | Reproduce the paper's two headline numbers, then find out which change caused the gain |
      | Audience | A teammate deciding whether to switch on ridge in their own pipeline |
      | Done looks like | A one-page note: your written plan, a 2×2 table of means with 95% intervals, the effect of each change, and a two-sentence recommendation |
      | Time | About 50 minutes, with or without code |

      A **reproduction** reruns someone else's experiment and checks that you get the same result within its stated uncertainty. An **ablation** removes or adds one component while holding everything else fixed. You'll do both, in that order: first make sure you can get the paper's numbers, then take its recipe apart.
  - id: ablation-and-reproduction-project.plan
    title: Write the plan before you run anything
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ablation-and-reproduction-project
    markdown: |-
      **Milestone 1: preregister.** (Revisit *Change one thing and measure what follows* for why.) Before any result exists, write down what you'll compare and how you'll decide. Here is a complete plan; copy it into your note and adjust it if you change anything.

      > **Question.** Does ridge improve accuracy, and does its effect depend on standardizing?
      > **Design.** All four combinations of standardize (off/on) × ridge (λ = 0 / λ = 10), trained on the *same* training set within each seed.
      > **Seeds.** 0 to 19, matching the paper.
      > **Metric.** Accuracy on 2,000 fresh test examples per seed.
      > **Analysis.** For each comparison, the per-seed difference, its mean, and a 95% t-interval. An effect counts as supported if its interval excludes zero.
      > **Reproduced** if our baseline mean, full-recipe mean and gain all fall inside the paper's intervals.

      **The data.** Sensor-20 is synthetic, so you can generate it exactly. Each example has 20 readings and a label of 0 or 1:

      | Reading | How it's made | Carries signal? |
      | --- | --- | --- |
      | 0 | (standard normal + 1.5 × sign) × 0.01, where sign is +1 for label 1 and −1 for label 0 | Strong, but in tiny units |
      | 1 | standard normal + 0.5 × sign | Weak |
      | 2–19 | standard normal | None |

      Reading 0 behaves like a length recorded in kilometers when everything else is in meters: a strong clue written in very small numbers. Each seed draws 30 training examples and 2,000 test examples with NumPy's `default_rng(seed)`.

      The model is a least-squares classifier: fit weights $w$ so that $Zw$ is close to the labels written as ±1, and predict label 1 when $Zw > 0$. Here $Z$ is the readings after subtracting each column's mean, and, when standardizing, dividing by each column's standard deviation. Ridge adds a penalty $\lambda \lVert w \rVert^2$ that pulls weights toward zero, the regularizer from the lesson *Why a simpler model can predict better*.
  - id: ablation-and-reproduction-project.s2
    title: Reproduce the headline, then fill the 2×2
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ablation-and-reproduction-project
    markdown: |-
      **Milestone 2: reproduce.** Run the baseline (no standardizing, no ridge) and the full recipe (both). **Milestone 3: ablate.** Add the two single-change cells. The reference solution does all four at once:

      ```python run
      import numpy as np

      SEEDS = 20                                      # preregistered: the paper's 20 seeds
      T95 = {5: 2.776, 10: 2.262, 20: 2.093}[SEEDS]   # t value for a 95% interval

      def make_data(rng, n):
          """20 readings per example. Reading 0 is informative but recorded in tiny units."""
          y = rng.integers(0, 2, n)
          sign = 2 * y - 1
          X = rng.normal(0, 1, (n, 20))
          X[:, 0] = 0.01 * (X[:, 0] + 1.5 * sign)    # strong signal, tiny numbers
          X[:, 1] += 0.5 * sign                       # weak signal; readings 2-19 are noise
          return X, y

      def fit(X, y, standardize, lam):
          mu, sd = X.mean(0), X.std(0) if standardize else np.ones(20)
          Z = (X - mu) / sd
          w = np.linalg.solve(Z.T @ Z + lam * np.eye(20), Z.T @ (2 * y - 1.0))  # lam = 0: least squares
          return lambda Xn: ((Xn - mu) / sd @ w > 0).astype(int)

      cells = {"baseline": (False, 0), "+ standardize": (True, 0),
               "+ ridge": (False, 10), "+ both (paper)": (True, 10)}
      acc = {name: [] for name in cells}
      for seed in range(SEEDS):
          rng = np.random.default_rng(seed)
          X_train, y_train = make_data(rng, 30)
          X_test, y_test = make_data(rng, 2000)
          for name, (std, lam) in cells.items():
              acc[name].append(100 * np.mean(fit(X_train, y_train, std, lam)(X_test) == y_test))
      acc = {name: np.array(v) for name, v in acc.items()}

      def ci(v, sign=""):
          half = T95 * v.std(ddof=1) / np.sqrt(len(v))    # 95% t-interval over seeds
          return f"{v.mean():{sign}5.1f} ± {half:.1f}"

      for name, v in acc.items():
          print(f"{name:15s} {ci(v)}   vs baseline {ci(v - acc['baseline'], '+')}")
      ridge_with = acc["+ both (paper)"] - acc["+ standardize"]
      ridge_without = acc["+ ridge"] - acc["baseline"]
      print(f"ridge effect: {ci(ridge_with, '+')} with standardizing, {ci(ridge_without, '+')} without")
      ```

      **Expected output** (check yours against it):

      | Cell | Accuracy (%) | Change vs baseline (points) |
      | --- | ---: | ---: |
      | Baseline | 76.9 ± 2.1 | +0.0 ± 0.0 |
      | + standardize | 76.9 ± 2.1 | +0.0 ± 0.0 |
      | + ridge | 59.4 ± 1.1 | −17.5 ± 2.3 |
      | + both (paper) | 82.9 ± 1.4 | +6.0 ± 1.8 |

      The last line adds: ridge's effect is +6.0 ± 1.8 with standardizing and −17.5 ± 2.3 without.

      The reproduction succeeds. The paper reported 77.1 → 83.2 (+6.1); you got 76.9 → 82.9 (+6.0), and all three of your numbers sit inside the paper's intervals. Your numbers won't match to the decimal, and they shouldn't have to: a different random-number library draws different training sets. What must match is the result within its uncertainty.

      :::predict Suppose you had only run 5 seeds. Set `SEEDS = 5`. Does the paper's gain still count as supported under your plan?
      No. The five-seed gain is +4.8 ± 6.7 points, an interval from −1.9 to +11.5 that includes zero. The per-seed gains were 12.40, 2.75, 6.05, −2.45, and 5.30: mostly positive, but spread widely, and one seed went the other way. Five seeds couldn't tell a real gain from luck. Twenty narrowed the interval to ±1.8, enough to decide.
      :::
  - id: ablation-and-reproduction-project.s3
    title: Standardizing alone does exactly nothing
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ablation-and-reproduction-project
    markdown: |-
      **Milestone 4: interpret.** (The lesson *Make conclusions match the strength of the experiment* is the guide here.) Read the table one comparison at a time.

      - **Standardizing alone: +0.0 ± 0.0, on every seed.** Plain least squares doesn't care about units. Divide a reading by 100 and the fitted weight for it grows 100-fold, so every prediction stays identical. A result of *exactly* zero is a clue about the mechanism, not bad luck.
      - **Ridge alone: −17.5 points.** Ridge charges for large weights. Reading 0 is written in tiny numbers, so using it needs a very large weight, which ridge makes expensive. The model gives up its best clue and leans on the weak reading and the noise.
      - **Both: +6.0 points.** Once every reading is on the same scale, ridge's charge is fair to all of them. It now shrinks the 18 noise readings, which is exactly what helps with only 30 training examples.

      So the honest answer to "Is it the ridge?" is: *ridge helps only with standardized readings*. The effect of one change depends on the other, which is an **interaction**. Measure it as a difference of differences: +6.0 − (−17.5) = 23.5 points. The paper's one comparison, baseline against both, could never have shown this.

      :::papers The two formulas in this project
      Ridge picks the weights

      $$\hat w = \arg\min_w \lVert y - Zw \rVert^2 + \lambda \lVert w \rVert^2 = (Z^\top Z + \lambda I)^{-1} Z^\top y$$

      with $y$ the labels as ±1, $Z$ the centered (and maybe standardized) readings, and $\lambda = 10$. The code's `np.linalg.solve` line computes exactly this; $\lambda = 0$ is plain least squares.

      The 95% interval for a mean of $n$ paired seed differences $d_i$ is

      $$\bar d \pm t_{0.975,\,n-1}\,\frac{s_d}{\sqrt n}$$

      For the five-seed gain: $\bar d = 4.81$, $s_d = 5.39$, $t_{0.975,4} = 2.776$, so $4.81 \pm 2.776 \times 5.39 / \sqrt 5 = 4.81 \pm 6.69$.
      :::

      :::mixup "Standardizing added nothing on its own, so the paper was right to credit ridge."
      Ridge on its own made things 17.5 points *worse*. Neither change gets the credit alone; the gain belongs to the combination. When a single-change cell looks like zero, check whether the other change depends on it before calling that component useless.
      :::

      Your recommendation to the teammate can now be concrete: "Switch on ridge only after standardizing. Without it, ridge cost 17.5 points in our runs."
  - id: ablation-and-reproduction-project.mistakes
    title: Five ways this project goes wrong
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ablation-and-reproduction-project
    markdown: |-
      Each of these produces a table that looks fine. Here's how to catch them.

      | Mistake | How to spot it | Fix |
      | --- | --- | --- |
      | Different training sets in different cells | Your "+ standardize" row isn't exactly equal to baseline | Draw the data once per seed, then fit all four cells on it |
      | Unpaired intervals | Two cells' intervals overlap, so you call the difference noise | Build the interval on the per-seed *differences*, as the lesson on controlled experiments showed |
      | Standardizing with test statistics | The code computes means from the test set | Take `mu` and `sd` from training data only |
      | Changing the plan after seeing results | Your note names a new metric or drops a seed | Keep the preregistered analysis as primary; label anything added later as exploratory |
      | Reporting only the paper's comparison | Your table has two rows, not four | Fill the whole 2×2, or the interaction stays invisible |

      :::try Break it on purpose
      In the code, move `X_train, y_train = make_data(rng, 30)` inside the inner loop, so each cell draws its own training set. Rerun. The standardize row stops matching baseline exactly, and the change intervals widen. That's what an unpaired ablation costs.
      :::
  - id: ablation-and-reproduction-project.s4
    title: Write the note and score it
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ablation-and-reproduction-project
    markdown: |-
      **Milestone 5: report.** Your note has five parts, following the lesson *Make the result possible to inspect*: the preregistered plan, the reproduction check (paper's numbers beside yours), the 2×2 table, the interaction, and a recommendation with one limitation a reader can act on, such as "Tested only with λ = 10 and 30 training examples; retune λ before using ridge on larger data."

      **No-code option.** Use this five-seed table and a calculator or spreadsheet. Compute each row's mean, the per-seed difference from baseline, and a 95% interval with $t = 2.776$. Your results should match the five-seed answer in the predict question of milestone 3.

      | Seed | Baseline | + standardize | + ridge | + both |
      | ---: | ---: | ---: | ---: | ---: |
      | 0 | 78.80 | 78.80 | 62.75 | 91.20 |
      | 1 | 80.80 | 80.80 | 62.45 | 83.55 |
      | 2 | 79.90 | 79.90 | 54.30 | 85.95 |
      | 3 | 86.10 | 86.10 | 59.15 | 83.65 |
      | 4 | 77.25 | 77.25 | 57.75 | 82.55 |

      **Rubric.** Score your note, or swap with a friend and score each other's.

      | Criterion | Not yet | Solid | Excellent |
      | --- | --- | --- | --- |
      | Plan | Written after the results | Written first, names metric and seeds | Also states the decision rule and what counts as reproduced |
      | Reproduction | Paper's numbers missing | Both headline numbers compared | Compared within stated intervals, differences in setup listed |
      | Ablation | One or two cells | All four cells on the same seeds | Paired differences, and the zero-change row explained |
      | Uncertainty | Means only | Interval for each comparison | Shows how the five-seed and twenty-seed conclusions differ |
      | Conclusion | "Ridge helps" | Names the interaction | Actionable recommendation plus one concrete limitation |

      The questions below check the concepts; the rubric is how you judge the project itself.
  - id: ablation-and-reproduction-project.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.ablation-and-reproduction-project
    markdown: |-
      Read the Sensor-20 table again, compute a few interactions from new 2×2 grids, then advise teams reproducing papers and ablating their own tricks.
    takeaway: |-
      Write the plan first, change one thing at a time on the same seeds, and put an interval on every difference. A gain that belongs to a combination belongs to neither part alone.
  - id: ablation-and-reproduction-project.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.ablation-and-reproduction-project
    markdown: |-
      Reproduce the baseline, change one choice, and report both the original comparison and any separate stress tests. An improvement on one test can coexist with a new failure.
