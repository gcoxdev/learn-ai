assessment_families:
  - id: ablation-and-reproduction-project.base
    objective_ref: objective.ablation-and-reproduction-project
    task: base
    response_type: single_choice
    points: 1
    hint: 'Ablate one choice: trace the inputs, operation, and result before choosing.'
    remediation_scene: ablation-and-reproduction-project.s2
    variants:
      - id: ablation-and-reproduction-project.base.1
        prompt: What is the unsmoothed C1 probability of cat after red?
        options:
          - id: a
            text: 1/2
          - id: b
            text: 2/7
          - id: c
            text: '0'
        answer: a
        feedback: Its observed count is one of two red transitions.
        retired: true
      - id: ablation-and-reproduction-project.base.2
        prompt: What happens to unsmoothed log loss on red→blue?
        options:
          - id: b
            text: It is zero
          - id: c
            text: It is always 0.693
          - id: a
            text: It is infinite because predicted probability is zero
        answer: a
        feedback: Negative log probability diverges at zero.
        retired: true
  - id: ablation-and-reproduction-project.transfer
    objective_ref: objective.ablation-and-reproduction-project
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Write the reproduction note: trace the inputs, operation, and result before choosing.'
    remediation_scene: ablation-and-reproduction-project.s4
    variants:
      - id: ablation-and-reproduction-project.transfer.1
        prompt: Should the stress-test result replace the original test silently?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if it favors your hypothesis
          - id: a
            text: 'No'
        answer: a
        feedback: Different evaluations must be reported as distinct protocols.
        retired: true
      - id: ablation-and-reproduction-project.transfer.2
        prompt: Is a negative ablation result automatically a failed research exercise?
        options:
          - id: c
            text: Only if the experiment is small
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: A controlled, reproducible result can correct the hypothesis.
        retired: true
  - id: ablation-and-reproduction-project.base.v2
    objective_ref: objective.ablation-and-reproduction-project
    task: base
    response_type: single_choice
    points: 1
    hint: Compare only cells that differ by one change, and use the per-seed differences, not two separate averages.
    remediation_scene: ablation-and-reproduction-project.s3
    variants:
      - id: ablation-and-reproduction-project.base.v2.1
        prompt: In the Sensor-20 ablation, standardizing alone changed accuracy by exactly 0.0 points on every one of the 20 seeds. What is the best explanation?
        options:
          - id: b
            text: The standardizing step was skipped by mistake, so the code has a bug
          - id: a
            text: Rescaling a reading rescales its least-squares weight, so predictions stay identical
          - id: c
            text: Twenty seeds are too few to detect a small standardizing effect
        answer: a
        feedback: Plain least squares is unit-free, so dividing a reading by 100 multiplies its weight by 100 and leaves every prediction unchanged. A small real effect would still show some seed-to-seed wobble, not exactly zero on all 20 seeds.
      - id: ablation-and-reproduction-project.base.v2.2
        prompt: 'The Sensor-20 paper compared baseline (76.9%) with ridge plus standardizing (82.9%) and credited ridge. The 2×2 adds: standardize only 76.9%, ridge only 59.4%. What do the four cells show?'
        options:
          - id: c
            text: Ridge causes the whole gain, since standardizing alone added nothing
          - id: b
            text: Standardizing causes the whole gain, since ridge alone did harm
          - id: a
            text: Ridge helps only on standardized readings; alone it costs 17.5 points
        answer: a
        feedback: Ridge's effect is +6.0 with standardizing and −17.5 without, so the gain belongs to the combination. Crediting either change alone ignores that its effect depends on the other.
      - id: ablation-and-reproduction-project.base.v2.3
        prompt: 'With 5 seeds, the full recipe beats baseline by +4.8 ± 6.7 points (95% interval). The plan said an effect is supported if its interval excludes zero. What should the note say?'
        options:
          - id: a
            text: Five seeds can't separate this gain from luck; more seeds are needed
          - id: b
            text: The paper failed to reproduce, because the gain is 1.3 points smaller
          - id: c
            text: The gain is confirmed, because four of the five seeds were positive
        answer: a
        feedback: The interval runs from −1.9 to +11.5, so it includes zero, and by the plan's rule the five-seed run can't decide. That's too little data, not a failed reproduction; with 20 seeds the interval shrinks to ±1.8.
      - id: ablation-and-reproduction-project.base.v2.4
        prompt: Why does the reference solution fit all four cells on the same training set within each seed?
        options:
          - id: b
            text: It makes each cell's own accuracy interval narrower
          - id: c
            text: It lets you drop the seed where a method did worst
          - id: a
            text: Differences within a seed cancel the luck of which data were drawn
        answer: a
        feedback: Pairing means the per-seed difference compares the cells on identical data, so an easy or hard draw affects both sides equally. Each cell's own interval stays just as wide; only the interval for the difference shrinks.
  - id: ablation-and-reproduction-project.transfer.v2
    objective_ref: objective.ablation-and-reproduction-project
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what changed between the two runs being compared, and whether the analysis was fixed before the results came in.
    remediation_scene: ablation-and-reproduction-project.mistakes
    variants:
      - id: ablation-and-reproduction-project.transfer.v2.1
        prompt: A team adds data augmentation and doubles the learning rate in the same run, and accuracy rises 3 points on one seed. What experiment should come next?
        options:
          - id: a
            text: Run all four combinations of the two changes on the same set of seeds
          - id: b
            text: Rerun the combined version on ten more seeds to tighten its interval
          - id: c
            text: Remove augmentation, and credit whatever gain remains to the learning rate
        answer: a
        feedback: Only the full 2×2 on shared seeds separates the two changes and reveals an interaction. More seeds of the combined run tighten the interval but still can't say which change mattered, and removing one change assumes the effects simply add.
      - id: ablation-and-reproduction-project.transfer.v2.2
        prompt: A preregistered comparison of overall accuracy shows no clear gain. Afterwards, the researcher finds a clear gain on long documents. How should the report treat it?
        options:
          - id: c
            text: Make long-document accuracy the primary result, since that's where the effect is
          - id: a
            text: Keep the overall result primary and label the long-document gain as exploratory
          - id: b
            text: Leave the long-document finding out, since it wasn't in the written plan
        answer: a
        feedback: A slice found after looking may be a chance hit, so it's reported as exploratory and retested on fresh data. Promoting it quietly changes the plan after seeing results; hiding it throws away a lead worth testing.
      - id: ablation-and-reproduction-project.transfer.v2.3
        prompt: Rerunning a paper's released code, you get 71.2 ± 1.5 over 10 seeds; the paper reports 74.0 ± 0.8. What is the best next step?
        options:
          - id: b
            text: Report that the paper's result is wrong, since the intervals don't overlap
          - id: c
            text: Tune your hyperparameters until you reach 74.0, then report a reproduction
          - id: a
            text: List every setup difference, such as data version and settings, then rerun matched
        answer: a
        feedback: A gap usually comes from an unmatched detail such as a data version, a library, or a default setting, so find and match those first. Tuning until the number matches hides the cause, and calling the paper wrong skips the most likely explanation.
      - id: ablation-and-reproduction-project.transfer.v2.4
        prompt: In a speech model, dropout alone and label smoothing alone each lower accuracy by about 1 point, but together they raise it by 4. How should the report describe this?
        options:
          - id: a
            text: As an interaction, where each change's effect depends on the other
          - id: b
            text: As a sign that both single-change runs must contain a bug
          - id: c
            text: As two independent effects that add up to the combined gain
        answer: a
        feedback: If the effects simply added, together they'd cost about 2 points, not gain 4. The difference of differences is large, which is what an interaction means. A bug is possible, but unexpected combinations like this are common and worth reporting.
  - id: ablation-and-reproduction-project.effects.v2
    objective_ref: objective.ablation-and-reproduction-project
    task: base
    response_type: numeric
    points: 1
    hint: Interaction = (both − A only) − (B only − neither). That is B's effect with A switched on, minus B's effect with A switched off.
    remediation_scene: ablation-and-reproduction-project.s3
    absolute_tolerance: 0.05
    variants:
      - id: ablation-and-reproduction-project.effects.v2.1
        prompt: 'A 2×2 ablation, averaged over the same seeds, gives accuracy (%): neither change 70, A only 72, B only 71, both 78. How many points larger is B''s effect with A on than with A off? (Enter a negative number if smaller.)'
        answer: 5
        feedback: B with A on is 78 − 72 = 6; B with A off is 71 − 70 = 1. The interaction is 6 − 1 = 5 points.
      - id: ablation-and-reproduction-project.effects.v2.2
        prompt: 'A 2×2 ablation, averaged over the same seeds, gives accuracy (%): neither change 80, A only 80, B only 62, both 86. How many points larger is B''s effect with A on than with A off? (Enter a negative number if smaller.)'
        answer: 24
        feedback: B with A on is 86 − 80 = 6; B with A off is 62 − 80 = −18. The interaction is 6 − (−18) = 24 points, the same pattern as ridge and standardizing.
      - id: ablation-and-reproduction-project.effects.v2.3
        prompt: 'A 2×2 ablation, averaged over the same seeds, gives accuracy (%): neither change 65, A only 70, B only 68, both 73. How many points larger is B''s effect with A on than with A off? (Enter a negative number if smaller.)'
        answer: 0
        feedback: B with A on is 73 − 70 = 3; B with A off is 68 − 65 = 3. The interaction is 0, so the two effects simply add.
      - id: ablation-and-reproduction-project.effects.v2.4
        prompt: 'A 2×2 ablation, averaged over the same seeds, gives accuracy (%): neither change 50, A only 58, B only 55, both 57. How many points larger is B''s effect with A on than with A off? (Enter a negative number if smaller.)'
        answer: -6
        feedback: B with A on is 57 − 58 = −1; B with A off is 55 − 50 = 5. The interaction is −1 − 5 = −6 points, so B helps only when A is off.
