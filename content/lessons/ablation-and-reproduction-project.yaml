schema_version: 0.2-draft
lesson:
  id: ablation-and-reproduction-project
  version: 0.2.0-draft
  title: 'Project: reproduce a result and audit an ablation'
  state: draft
  summary: Repeat a small result, change one choice, and explain both the gain and the failure.
  slot: M36.7
  category: learning
  minutes: 50
  sources:
  - title: Introduction to Information Retrieval — authors’ online edition
    url: https://nlp.stanford.edu/IR-book/
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.ablation-and-reproduction-project
  version: 1-draft
  statement: Reproduce a small specified result, isolate an ablation, and report uncertainty and deviations
    before claiming a mechanism caused an improvement.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - ablation-and-reproduction-project.base
  - ablation-and-reproduction-project.transfer
  prerequisites:
  - anyOf:
    - objective.controlled-experiments
  - anyOf:
    - objective.research-reporting
  - anyOf:
    - objective.tiny-language-model-project
scenes:
- id: ablation-and-reproduction-project.s1
  title: Reproduce a fully specified baseline
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ablation-and-reproduction-project
  markdown: 'Use the exact three-sentence corpus, vocabulary, and C1 counts from the tiny language-model project.
    Evaluate held-out transitions red→cat and red→dog, weighting each equally. With add-one smoothing, both
    probabilities are 2/7 and mean negative log likelihood is about 1.253 nats. Record this protocol before
    changing anything; paper calculations or a small local script both qualify.


    An ablation removes or changes one component to study its contribution. Negative log likelihood scores
    how much probability the model assigned to what actually occurred. A nat is the unit when the logarithm
    uses base e, written ln. You may use the supplied decimal values; understanding why a zero-probability
    event gives an unbounded penalty matters more here than calculating logarithms by hand.'
  text_mode: 'Use the exact three-sentence corpus, vocabulary, and C1 counts from the tiny language-model project.
    Evaluate held-out transitions red→cat and red→dog, weighting each equally. With add-one smoothing, both
    probabilities are 2/7 and mean negative log likelihood is about 1.253 nats. Record this protocol before
    changing anything; paper calculations or a small local script both qualify.


    An ablation removes or changes one component to study its contribution. Negative log likelihood scores
    how much probability the model assigned to what actually occurred. A nat is the unit when the logarithm
    uses base e, written ln. You may use the supplied decimal values; understanding why a zero-probability
    event gives an unbounded penalty matters more here than calculating logarithms by hand.'
  bridges: []
- id: ablation-and-reproduction-project.s2
  title: Ablate one choice
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ablation-and-reproduction-project
  markdown: 'Remove smoothing while keeping corpus, vocabulary, and evaluation fixed. Both held-out probabilities
    become 1/2, so mean negative log likelihood is about 0.693. This is a valid result for this restricted
    test. Now define a separate stress test red→blue: the unsmoothed model assigns zero, giving infinite negative
    log likelihood, while smoothing gives 1/7, about 1.946 nats.'
  text_mode: 'Remove smoothing while keeping corpus, vocabulary, and evaluation fixed. Both held-out probabilities
    become 1/2, so mean negative log likelihood is about 0.693. This is a valid result for this restricted
    test. Now define a separate stress test red→blue: the unsmoothed model assigns zero, giving infinite negative
    log likelihood, while smoothing gives 1/7, about 1.946 nats.'
  bridges:
  - powers-logs
  - statistics-evidence
- id: ablation-and-reproduction-project.s3
  title: Interpret without moving the goalposts
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ablation-and-reproduction-project
  markdown: The ablation improves the first metric yet fails on the unseen-transition stress case. Report both
    test definitions and why they differ; do not silently replace the original metric after seeing a favorable
    result. This deterministic toy needs no invented seed variance. For a stochastic neural reproduction, repeat
    independent runs and report variability, compute limits, and deviations from the paper.
  text_mode: The ablation improves the first metric yet fails on the unseen-transition stress case. Report
    both test definitions and why they differ; do not silently replace the original metric after seeing a favorable
    result. This deterministic toy needs no invented seed variance. For a stochastic neural reproduction, repeat
    independent runs and report variability, compute limits, and deviations from the paper.
  bridges: []
- id: ablation-and-reproduction-project.s4
  title: Write the reproduction note
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ablation-and-reproduction-project
  markdown: Save protocol, expected and observed calculations, ablation, stress test, and one conclusion with
    limits. Score reproducibility, one-variable control, complete outcome reporting, and defensible interpretation
    0–2 each. A reviewer should be able to repeat the arithmetic without guessing. Quiz success checks concepts,
    not your report; a surprising or negative result can still be a successful reproduction exercise.
  text_mode: Save protocol, expected and observed calculations, ablation, stress test, and one conclusion with
    limits. Score reproducibility, one-variable control, complete outcome reporting, and defensible interpretation
    0–2 each. A reviewer should be able to repeat the arithmetic without guessing. Quiz success checks concepts,
    not your report; a surprising or negative result can still be a successful reproduction exercise.
  bridges: []
- id: ablation-and-reproduction-project.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.ablation-and-reproduction-project
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Reproduce a small specified result, isolate an ablation, and report uncertainty and deviations
    before claiming a mechanism caused an improvement.
- id: ablation-and-reproduction-project.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.ablation-and-reproduction-project
  markdown: Reproduce a small specified result, isolate an ablation, and report uncertainty and deviations
    before claiming a mechanism caused an improvement.
  text_mode: Reproduce a small specified result, isolate an ablation, and report uncertainty and deviations
    before claiming a mechanism caused an improvement.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - ablation-and-reproduction-project.s1
    - ablation-and-reproduction-project.s2
    - ablation-and-reproduction-project.s3
    - ablation-and-reproduction-project.s4
    - ablation-and-reproduction-project.check
    gate_refs:
    - gate.core
  scene_aliases:
    ablation-and-reproduction-project.recap: ablation-and-reproduction-project.check
assessment_families:
- id: ablation-and-reproduction-project.base
  objective_ref: objective.ablation-and-reproduction-project
  task: base
  response_type: single_choice
  points: 1
  hint: 'Ablate one choice: trace the inputs, operation, and result before choosing.'
  remediation_scene: ablation-and-reproduction-project.s2
  variants:
  - id: ablation-and-reproduction-project.base.1
    prompt: What is the unsmoothed C1 probability of cat after red?
    options:
    - id: a
      text: 1/2
    - id: b
      text: 2/7
    - id: c
      text: '0'
    answer: a
    feedback: Its observed count is one of two red transitions.
  - id: ablation-and-reproduction-project.base.2
    prompt: What happens to unsmoothed log loss on red→blue?
    options:
    - id: b
      text: It is zero
    - id: c
      text: It is always 0.693
    - id: a
      text: It is infinite because predicted probability is zero
    answer: a
    feedback: Negative log probability diverges at zero.
- id: ablation-and-reproduction-project.transfer
  objective_ref: objective.ablation-and-reproduction-project
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Write the reproduction note: trace the inputs, operation, and result before choosing.'
  remediation_scene: ablation-and-reproduction-project.s4
  variants:
  - id: ablation-and-reproduction-project.transfer.1
    prompt: Should the stress-test result replace the original test silently?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if it favors your hypothesis
    - id: a
      text: 'No'
    answer: a
    feedback: Different evaluations must be reported as distinct protocols.
  - id: ablation-and-reproduction-project.transfer.2
    prompt: Is a negative ablation result automatically a failed research exercise?
    options:
    - id: c
      text: Only if the experiment is small
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: A controlled, reproducible result can correct the hypothesis.
