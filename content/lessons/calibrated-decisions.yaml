schema_version: 0.2-draft
lesson:
  id: calibrated-decisions
  version: 0.3.0-draft
  title: Turn a probability into a justified action
  state: draft
  summary: Use a defect probability and a simple cost table to decide whether an inspection is worth doing.
  slot: M06.8
  category: learning
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.calibrated-decisions
  version: 1-draft
  statement: Calibration describes agreement between predicted probabilities and outcomes; decision theory
    combines probabilities with costs, while uncertainty should be checked under the deployment conditions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - calibrated-decisions.base
  - calibrated-decisions.transfer
  prerequisites:
  - anyOf:
    - objective.bayes-rule
  - anyOf:
    - objective.decisions-and-games
scenes:
- id: calibrated-decisions.s1
  title: A probability is not yet an action
  type: explanation
  depth: intuition
  objective_refs:
  - objective.calibrated-decisions
  markdown: A quality-control model estimates a 20% defect probability. Whether to inspect depends on the cost
    of inspection, the cost of missing a defect, and available capacity. The same probability can support different
    actions under different objectives. A threshold is a decision rule layered on the probability estimate.
  text_mode: A quality-control model estimates a 20% defect probability. Whether to inspect depends on the
    cost of inspection, the cost of missing a defect, and available capacity. The same probability can support
    different actions under different objectives. A threshold is a decision rule layered on the probability
    estimate.
  bridges: []
- id: calibrated-decisions.s2
  title: Understand calibration
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.calibrated-decisions
  markdown: Among comparable cases assigned probability 0.7, roughly 70% should have the event if the predictions
    are calibrated under the evaluation distribution. Calibration concerns groups of predictions, not a guarantee
    for one case. A model can rank cases well yet have systematically overconfident probabilities.
  text_mode: Among comparable cases assigned probability 0.7, roughly 70% should have the event if the predictions
    are calibrated under the evaluation distribution. Calibration concerns groups of predictions, not a guarantee
    for one case. A model can rank cases well yet have systematically overconfident probabilities.
  bridges:
  - decisions-and-games
- id: calibrated-decisions.s3
  title: Compare expected costs
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.calibrated-decisions
  markdown: 'Suppose unnecessary inspection costs 1 and missing a defect costs 9, with correct decisions assigned
    zero cost in this toy model. At defect probability p, inspecting costs (1 − p) while not inspecting costs
    9p. Inspect when p exceeds 0.1. Changing costs changes the threshold even with the same model.


    At p = 0.2, the expected costs are 0.8 for inspection and 1.8 for no inspection, so inspect. At the boundary,
    1 − p = 9p; adding p to both sides gives 1 = 10p and p = 0.1. This toy charges inspection only for a good
    part. If every inspection instead costs 1 and prevents a defect loss of 9, compare 1 with 9p; the boundary
    changes to 1/9. Always read the cost table first.'
  text_mode: 'Suppose unnecessary inspection costs 1 and missing a defect costs 9, with correct decisions assigned
    zero cost in this toy model. At defect probability p, inspecting costs (1 − p) while not inspecting costs
    9p. Inspect when p exceeds 0.1. Changing costs changes the threshold even with the same model.


    At p = 0.2, the expected costs are 0.8 for inspection and 1.8 for no inspection, so inspect. At the boundary,
    1 − p = 9p; adding p to both sides gives 1 = 10p and p = 0.1. This toy charges inspection only for a good
    part. If every inspection instead costs 1 and prevents a defect loss of 9, compare 1 with 9p; the boundary
    changes to 1/9. Always read the cost table first.'
  bridges: []
- id: calibrated-decisions.s4
  title: Check the probabilities on new cases
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.calibrated-decisions
  markdown: '**Recalibration** changes how model scores map to probabilities. Fit that mapping on data reserved
    from the original model fitting, then check it on a separate evaluation set. Otherwise the same outcomes
    both adjust and judge the probabilities.


    Inspect relevant groups and changing conditions too. Calibration on yesterday’s cases may not carry over
    to a new setting. Recalibration need not improve the ranking of cases or recover missing information. If
    uncertain cases go to human review, also measure the review workload and any failures that remain.'
  text_mode: '**Recalibration** changes how model scores map to probabilities. Fit that mapping on data reserved
    from the original model fitting, then check it on a separate evaluation set. Otherwise the same outcomes
    both adjust and judge the probabilities.


    Inspect relevant groups and changing conditions too. Calibration on yesterday’s cases may not carry over
    to a new setting. Recalibration need not improve the ranking of cases or recover missing information. If
    uncertain cases go to human review, also measure the review workload and any failures that remain.'
  bridges: []
- id: calibrated-decisions.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.calibrated-decisions
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Calibration checks whether predicted probabilities match observed frequencies. Choosing an action
    requires a separate decision about the costs of mistakes.
- id: calibrated-decisions.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
