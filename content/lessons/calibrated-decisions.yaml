lesson:
  id: calibrated-decisions
  version: 0.4.0-draft
  title: Turn a probability into a justified action
  state: draft
  summary: When the forecast says 30% rain, does it rain three days in ten? Learn to test whether a model's percentages are honest, and to turn them into decisions with a cost table.
  slot: M06.8
  category: learning
  sources:
    - title: An Introduction to Statistical Learning — authors’ materials
      url: https://www.statlearning.com/
    - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
      url: https://aima.cs.berkeley.edu/
    - title: On Calibration of Modern Neural Networks (Guo et al., 2017)
      url: https://arxiv.org/abs/1706.04599
objectives:
  - id: objective.calibrated-decisions
    version: 3-draft
    statement: Check whether predicted probabilities match how often things happen, and combine probabilities with costs to choose an action.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - calibrated-decisions.base.v2
      - calibrated-decisions.transfer.v2
    prerequisites:
