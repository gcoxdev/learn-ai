scenes:
  - id: calibrated-decisions.s1
    title: Twenty percent chance of a crack. Now what?
    type: explanation
    depth: intuition
    objective_refs:
      - objective.calibrated-decisions
    markdown: |-
      Back at the bracket factory from the Bayes lesson, a new model looks at each bracket and reports the chance that it's cracked. This one says 20%. Do you pull it for inspection or ship it?

      The number alone can't decide. It depends on what each mistake costs. If a shipped crack means a collapsed shelf and a lawsuit, 20% is alarming. If a crack means a slightly wobbly coat hook, 20% might be fine to ship.

      So acting on a probability takes two separate questions:

      1. **Is the number honest?** When the model says 20%, are about 20% of those brackets really cracked? That's calibration.
      2. **What should I do with an honest number?** Weigh the chance of each outcome by what it costs. That's decision theory.

      This lesson takes them in turn.
    bridges: []
  - id: calibrated-decisions.s2
    title: When the forecaster says 30%
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.calibrated-decisions
    markdown: |-
      A forecaster is **calibrated** if, across all the days they say 30% rain, it rains on about 30% of them; across all the 70% days, about 70%; and so on. You can't check one forecast. You check the whole group.

      :::story Weather forecasters invented the scorecard
      Meteorologists have graded probability forecasts for decades. The Brier score, still a standard measure of probability accuracy, was proposed by Glenn Brier in 1950 for weather forecasts. U.S. National Weather Service rain forecasts are generally found to be well calibrated. Some TV forecasters have been reported to show a "wet bias," saying rain is likelier than it is, since viewers forgive an unneeded umbrella more easily than a soaking.
      :::

      To check calibration, sort predictions into buckets by what the model said, then compare with what happened. Plotting "said" against "happened" gives a **reliability diagram**; a calibrated model sits on the diagonal. This program builds the table for an overconfident bracket model:

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      true_p = rng.beta(1, 4, size=5000)                   # each bracket's real crack chance
      logit = np.log(true_p / (1 - true_p))
      stated = 1 / (1 + np.exp(-2 * logit))                # an overconfident model's output
      cracked = rng.random(5000) < true_p                  # what actually happened

      edges = [0, 0.1, 0.3, 0.5, 0.7, 0.9, 1.0]
      ece = 0.0
      print("bucket      count  says   happened  gap")
      for lo, hi in zip(edges, edges[1:]):
          m = (stated >= lo) & (stated < hi)
          says, happened = stated[m].mean(), cracked[m].mean()
          ece += m.mean() * abs(says - happened)
          print(f"{lo:.1f}-{hi:.1f}  {m.sum():6d}  {says:.2f}   {happened:.2f}     {happened - says:+.2f}")
      print(f"expected calibration error (ECE) = {ece:.3f}")
      ```

      The model pushes everything toward the extremes. Brackets it calls 95% cracked are really cracked 72% of the time. Worse, the 3,478 brackets it calls "about 2%" are really cracked 11% of the time. Change `-2 * logit` to `-1 * logit` to make the model honest, and the ECE drops from 0.083 to 0.011.

      :::papers Expected calibration error
      $$\text{ECE} = \sum_{b} \frac{n_b}{N}\,\big|\,\text{happened}_b - \text{says}_b\,\big|$$

      Each bucket $b$ holds $n_b$ of the $N$ predictions, so big buckets count more. Before rounding, the first row's gap is 0.107 − 0.023 = 0.084, so it contributes $\tfrac{3478}{5000} \times 0.084 \approx 0.06$, most of the 0.083. Guo et al. (2017) showed that modern deep networks tend to be overconfident in exactly this way.
      :::

      :::mixup "A well-calibrated model is an accurate model."
      A model that says "1% cracked" for every bracket is perfectly calibrated if 1% really are cracked, and it's useless for finding the cracked ones. Calibration asks whether the numbers are honest; ranking asks whether the model separates cracked from good. Check both.
      :::
    bridges:
      - decisions-and-games
  - id: calibrated-decisions.s3
    title: Compare expected costs
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.calibrated-decisions
    markdown: |-
      Now suppose the 20% is honest. Line A's cost table counts only the damage from each mistake:

      | Line A | Bracket is good | Bracket is cracked |
      | --- | ---: | ---: |
      | Inspect | 1 (wasted inspection) | 0 (crack caught) |
      | Ship | 0 | 9 (crack reaches a customer) |

      The **expected cost** of an action averages its costs, weighted by the probabilities. At p = 0.2 (chance of a crack):

      - Inspect: 0.8 × 1 + 0.2 × 0 = 0.8
      - Ship: 0.8 × 0 + 0.2 × 9 = 1.8

      Inspect. Where's the break-even point? Inspecting costs 1 − p and shipping costs 9p, and they're equal when 1 − p = 9p, so p = 0.1. Inspect any bracket above a 10% crack chance.

      :::papers The expected-cost threshold
      Pick the action $a$ with the lowest expected cost $\sum_y P(y)\,C(a, y)$. With two actions and two outcomes, act (inspect) when

      $$p > p^{*} = \frac{C_{\text{inspect,good}} - C_{\text{ship,good}}}{\big(C_{\text{inspect,good}} - C_{\text{ship,good}}\big) + \big(C_{\text{ship,crack}} - C_{\text{inspect,crack}}\big)}$$

      Line A: $p^{*} = \frac{1 - 0}{(1 - 0) + (9 - 0)} = 0.1$. When correct decisions cost 0, this is just false-alarm cost ÷ (false-alarm cost + miss cost).
      :::

      This is where calibration pays off. The threshold assumes honest numbers. The overconfident model above called thousands of brackets "2%," so every one would be shipped, yet 11% of them were cracked: above the 0.1 threshold.
    bridges: []
  - id: calibrated-decisions.cost-table
    title: Change the cost table, change the threshold
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.calibrated-decisions
    markdown: |-
      Line B uses a slower inspection station. Every inspection costs 2 in labor, whatever it finds. A shipped crack still costs 9.

      | Line B | Bracket is good | Bracket is cracked |
      | --- | ---: | ---: |
      | Inspect | 2 | 2 |
      | Ship | 0 | 9 |

      :::predict Same bracket, same honest p = 0.2. Inspect or ship on Line B?
      Inspect: 0.8 × 2 + 0.2 × 2 = 2. Ship: 0.2 × 9 = 1.8. Ship! The formula gives $p^{*} = \frac{2 - 0}{(2 - 0) + (9 - 2)} = 2/9 \approx 0.22$, and 0.2 falls just below it.
      :::

      The model didn't change, and neither did its 20%. Only the costs changed, and the decision flipped. So when someone asks "what threshold should we use?", the answer is never "0.5 by default." Write down the cost table first, then compute it.
    bridges: []
  - id: calibrated-decisions.s4
    title: Fix the numbers on data the model never saw
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.calibrated-decisions
    markdown: |-
      An overconfident model can often be repaired without retraining. **Recalibration** learns a simple mapping from the model's scores to honest probabilities. The most common is **temperature scaling**: divide the model's raw scores before they become probabilities (its logits) by one number T, chosen so the probabilities fit a separate set of cases the model didn't train on. For our model, T = 2 would exactly undo the doubling. Dividing every score by the same number keeps the order of the brackets, so the ranking is untouched.

      Use three separate sets of brackets: one to train the model, one to fit T, and one to measure the final ECE. If you fit T and measure ECE on the same brackets, the score will look better than the model really is.

      Finally, recheck after anything changes. A new steel supplier, a new camera, or a new season can shift the crack rate and the model's accuracy. Rebuild the bucket table from recent brackets every so often, and refit T when the gaps grow.
    bridges: []
  - id: calibrated-decisions.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.calibrated-decisions
    markdown: Compute break-even thresholds for fraud checks, umbrellas, and patient recalls, then judge rain forecasts, lopsided models, and a recalibration shortcut.
    takeaway: |-
      First check that a model's percentages are honest by comparing what it says with what happens. Then act when the chance is above the threshold set by your cost table, and recompute that threshold whenever the costs change.
  - id: calibrated-decisions.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.calibrated-decisions
    markdown: |-
      Calibration checks whether predicted probabilities match observed frequencies. Choosing an action requires a separate decision about the costs of mistakes.
