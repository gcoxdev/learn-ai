assessment_families:
  - id: calibrated-decisions.base
    objective_ref: objective.calibrated-decisions
    task: base
    response_type: single_choice
    points: 1
    hint: 'Understand calibration: trace the inputs, operation, and result before choosing.'
    remediation_scene: calibrated-decisions.s2
    variants:
      - id: calibrated-decisions.base.1
        prompt: Among 100 comparable predictions of 0.6, what outcome count is consistent with calibration in expectation?
        options:
          - id: c
            text: Exactly zero events
          - id: a
            text: About 60 events
          - id: b
            text: Exactly 100 events guaranteed
        answer: a
        feedback: Calibration links probability groups with observed frequencies over relevant samples.
        retired: true
      - id: calibrated-decisions.base.2
        prompt: A well-ranked classifier can still be what?
        options:
          - id: a
            text: Poorly calibrated
          - id: b
            text: Unable to output a score
          - id: c
            text: Automatically optimal for every cost
        answer: a
        feedback: Ranking and probability accuracy are distinct properties.
        retired: true
  - id: calibrated-decisions.transfer
    objective_ref: objective.calibrated-decisions
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Check the conditions behind confidence: trace the inputs, operation, and result before choosing.'
    remediation_scene: calibrated-decisions.s4
    variants:
      - id: calibrated-decisions.transfer.1
        prompt: False inspection costs 1 and missing a defect costs 4. Under the stated two-action toy costs, inspect above what p?
        options:
          - id: a
            text: '0.2'
          - id: b
            text: 0.5 always
          - id: c
            text: '0.8'
        answer: a
        feedback: Compare 1 − p with 4p; the boundary is p = 1/5.
        retired: true
      - id: calibrated-decisions.transfer.2
        prompt: Deployment prevalence and conditions change. What should happen to probability-based decisions?
        options:
          - id: b
            text: Assume old confidence transfers automatically
          - id: c
            text: Only change the display color
          - id: a
            text: Reevaluate calibration and decision performance under the new conditions
        answer: a
        feedback: Both probability quality and action costs are context-dependent.
        retired: true
  - id: calibrated-decisions.base.v2
    objective_ref: objective.calibrated-decisions
    task: base
    response_type: numeric
    points: 1
    hint: Write the expected cost of each action as a function of p and set them equal. When correct calls cost nothing, the threshold is false-alarm cost ÷ (false-alarm cost + miss cost).
    remediation_scene: calibrated-decisions.s3
    absolute_tolerance: 0.01
    variants:
      - id: calibrated-decisions.base.v2.1
        prompt: A bank's fraud model gives each payment a fraud probability p. Reviewing a legitimate payment wastes 2; letting a fraudulent one through costs 8; correct calls cost 0. Above what p should a payment be reviewed? Use a decimal to two places.
        answer: 0.2
        feedback: Review costs 2(1 − p) and letting it through costs 8p. They're equal when 2 − 2p = 8p, so p = 2/10 = 0.2. Using 0.5 by default would wave through payments with a 20% to 50% fraud chance.
      - id: calibrated-decisions.base.v2.2
        prompt: Carrying an umbrella on a dry day costs you 1 (in annoyance); getting soaked without one costs 3; the other outcomes cost 0. Above what rain probability should you carry it? Use a decimal to two places.
        answer: 0.25
        feedback: Carrying costs 1 × (1 − p) and not carrying costs 3p. Setting 1 − p = 3p gives p = 1/4 = 0.25. Dividing 1 by 3 gives 0.33, which forgets to add the two costs in the denominator.
      - id: calibrated-decisions.base.v2.3
        prompt: A clinic recalls a patient for a follow-up scan when a model's disease probability p is high enough. An unneeded recall costs 1; a missed case costs 19; correct calls cost 0. Above what p should the clinic recall? Use a decimal to two places.
        answer: 0.05
        feedback: Recalling costs 1 − p and not recalling costs 19p, equal at p = 1/20 = 0.05. Missing a case is so expensive that even a 5% chance justifies a recall.
      - id: calibrated-decisions.base.v2.4
        prompt: An email filter quarantines a message when its spam probability p is high enough. Quarantining a real message costs 3; letting spam into the inbox costs 7; correct calls cost 0. Above what p should it quarantine? Use a decimal to two places.
        answer: 0.3
        feedback: Quarantining costs 3(1 − p) and delivering costs 7p. They're equal when 3 − 3p = 7p, so p = 3/10 = 0.3. Blocking real mail costs almost half as much as letting spam through, so the threshold sits well above the 0.05 you'd get if misses cost far more.
  - id: calibrated-decisions.transfer.v2
    objective_ref: objective.calibrated-decisions
    task: transfer
    response_type: single_choice
    points: 1
    hint: Keep two questions apart. Calibration asks whether the stated percentages match what happens; the cost table decides which action a percentage should trigger.
    remediation_scene: calibrated-decisions.s2
    variants:
      - id: calibrated-decisions.transfer.v2.1
        prompt: On 400 days a forecaster said "30% chance of rain," and it rained on 60 of them. What does this show?
        options:
          - id: b
            text: Well calibrated, since it rained on quite a few of those days
          - id: c
            text: Worthless, since it stayed dry on most of the 30% days
          - id: a
            text: Too high, since it rained on only 15% of the "30%" days
        answer: a
        feedback: 60 of 400 is 15%, half the stated 30%, so these forecasts overstate rain. A 30% forecast should see dry days most of the time, so that alone isn't a failure; the mismatch between 30% and 15% is.
      - id: calibrated-decisions.transfer.v2.2
        prompt: Model A ranks cases perfectly but only ever outputs 0.99 or 0.01. Model B outputs 0.3 for every case, and 30% of cases are positive. How do they compare?
        options:
          - id: a
            text: A separates cases but its numbers aren't honest; B is honest but separates nothing
          - id: b
            text: A is better in every way, since perfect ranking implies honest probabilities
          - id: c
            text: B is better in every way, since calibration is what makes a model accurate
        answer: a
        feedback: Calibration and ranking are different properties. B's 0.3 is honest on average but can't tell cases apart; A tells them apart perfectly, but its 0.99 and 0.01 need recalibration before you use them with a cost table.
        retired: true
      - id: calibrated-decisions.transfer.v2.3
        prompt: A clinic's cost of a missed case rises from 9 to 49 after a new treatment deadline. An unneeded recall still costs 1, and the model is unchanged. What happens to the recall threshold?
        options:
          - id: c
            text: It stays at 0.1, because the model's probabilities haven't changed
          - id: a
            text: It falls from 0.1 to 0.02, so more patients get recalled
          - id: b
            text: It rises from 0.1 to 0.5, since each miss now matters more
        answer: a
        feedback: The threshold is 1/(1 + 49) = 0.02, down from 1/(1 + 9) = 0.1. Costlier misses mean you act on weaker evidence. The model's numbers stay the same, but the decision rule built on them must change.
      - id: calibrated-decisions.transfer.v2.4
        prompt: A team fits temperature scaling on its validation set, then reports the ECE on that same validation set. What is the problem?
        options:
          - id: b
            text: Temperature scaling reorders the cases, so accuracy drops
          - id: c
            text: ECE can't be computed after a model is recalibrated
          - id: a
            text: The ECE will look better than it will be on new cases
        answer: a
        feedback: T was chosen to fit those exact cases, so measuring on them flatters the result; use a third, untouched set. Temperature scaling divides every score by the same number, so the ranking doesn't change.
      - id: calibrated-decisions.transfer.v2.5
        prompt: Model A ranks cases well, but of the cases it calls 90% likely, only 60% turn out positive. Model B says 30% for every case, and 30% of cases are positive. How do they compare?
        options:
          - id: b
            text: B is the better model, since calibration is what makes a model accurate
          - id: c
            text: A sorts cases but overstates its confidence; B is honest but sorts nothing
          - id: a
            text: A is the better model, since good ranking implies honest probabilities
        answer: c
        feedback: Calibration and ranking are different properties. B's 30% matches reality but can't tell cases apart; A tells them apart, but its "90%" comes true only 60% of the time, so recalibrate it before using a cost table. Good ranking doesn't make the numbers honest, and honest numbers don't make a model useful.
