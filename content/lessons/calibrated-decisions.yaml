assessment_families:
- id: calibrated-decisions.base
  objective_ref: objective.calibrated-decisions
  task: base
  response_type: single_choice
  points: 1
  hint: 'Understand calibration: trace the inputs, operation, and result before choosing.'
  remediation_scene: calibrated-decisions.s2
  variants:
  - id: calibrated-decisions.base.1
    prompt: Among 100 comparable predictions of 0.6, what outcome count is consistent with calibration in expectation?
    options:
    - id: c
      text: Exactly zero events
    - id: a
      text: About 60 events
    - id: b
      text: Exactly 100 events guaranteed
    answer: a
    feedback: Calibration links probability groups with observed frequencies over relevant samples.
  - id: calibrated-decisions.base.2
    prompt: A well-ranked classifier can still be what?
    options:
    - id: a
      text: Poorly calibrated
    - id: b
      text: Unable to output a score
    - id: c
      text: Automatically optimal for every cost
    answer: a
    feedback: Ranking and probability accuracy are distinct properties.
- id: calibrated-decisions.transfer
  objective_ref: objective.calibrated-decisions
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Check the conditions behind confidence: trace the inputs, operation, and result before choosing.'
  remediation_scene: calibrated-decisions.s4
  variants:
  - id: calibrated-decisions.transfer.1
    prompt: False inspection costs 1 and missing a defect costs 4. Under the stated two-action toy costs, inspect
      above what p?
    options:
    - id: a
      text: '0.2'
    - id: b
      text: 0.5 always
    - id: c
      text: '0.8'
    answer: a
    feedback: Compare 1 − p with 4p; the boundary is p = 1/5.
  - id: calibrated-decisions.transfer.2
    prompt: Deployment prevalence and conditions change. What should happen to probability-based decisions?
    options:
    - id: b
      text: Assume old confidence transfers automatically
    - id: c
      text: Only change the display color
    - id: a
      text: Reevaluate calibration and decision performance under the new conditions
    answer: a
    feedback: Both probability quality and action costs are context-dependent.
