schema_version: 0.2-draft
lesson:
  id: calibrated-decisions
  version: 0.1.0-draft
  title: Turn a probability into a justified action
  state: draft
  summary: Calibration describes agreement between predicted probabilities and outcomes; decision theory combines
    probabilities with costs, while uncertainty should be checked under the deployment conditions.
  slot: M06.8
  category: learning
  minutes: 12
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.calibrated-decisions
  version: 1-draft
  statement: Calibration describes agreement between predicted probabilities and outcomes; decision theory combines
    probabilities with costs, while uncertainty should be checked under the deployment conditions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - calibrated-decisions.base
  - calibrated-decisions.transfer
  prerequisites:
  - anyOf:
    - objective.bayes-rule
  - anyOf:
    - objective.decisions-and-games
scenes:
- id: calibrated-decisions.s1
  title: A probability is not yet an action
  type: explanation
  depth: intuition
  objective_refs:
  - objective.calibrated-decisions
  markdown: A quality-control model estimates a 20% defect probability. Whether to inspect depends on the cost of
    inspection, the cost of missing a defect, and available capacity. The same probability can support different
    actions under different objectives. A threshold is a decision rule layered on the probability estimate.
  text_mode: A quality-control model estimates a 20% defect probability. Whether to inspect depends on the cost
    of inspection, the cost of missing a defect, and available capacity. The same probability can support different
    actions under different objectives. A threshold is a decision rule layered on the probability estimate.
  bridges: []
- id: calibrated-decisions.s2
  title: Understand calibration
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.calibrated-decisions
  markdown: Among comparable cases assigned probability 0.7, roughly 70% should have the event if the predictions
    are calibrated under the evaluation distribution. Calibration concerns groups of predictions, not a guarantee
    for one case. A model can rank cases well yet have systematically overconfident probabilities.
  text_mode: Among comparable cases assigned probability 0.7, roughly 70% should have the event if the predictions
    are calibrated under the evaluation distribution. Calibration concerns groups of predictions, not a guarantee
    for one case. A model can rank cases well yet have systematically overconfident probabilities.
  bridges:
  - decisions-and-games
- id: calibrated-decisions.s3
  title: Compare expected costs
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.calibrated-decisions
  markdown: Suppose unnecessary inspection costs 1 and missing a defect costs 9, with correct decisions assigned
    zero cost in this toy model. At defect probability p, inspecting costs (1 − p) while not inspecting costs 9p.
    Inspect when p exceeds 0.1. Changing costs changes the threshold even with the same model.
  text_mode: Suppose unnecessary inspection costs 1 and missing a defect costs 9, with correct decisions assigned
    zero cost in this toy model. At defect probability p, inspecting costs (1 − p) while not inspecting costs 9p.
    Inspect when p exceeds 0.1. Changing costs changes the threshold even with the same model.
  bridges: []
- id: calibrated-decisions.s4
  title: Check the conditions behind confidence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.calibrated-decisions
  markdown: Use held-out data for calibration assessment and any recalibration fit. Report performance across relevant
    groups and shifts. An abstention option can route uncertain cases to another process, but its workload and missed
    cases need evaluation. Good calibration on yesterday’s sample does not establish confidence in an unfamiliar
    environment.
  text_mode: Use held-out data for calibration assessment and any recalibration fit. Report performance across relevant
    groups and shifts. An abstention option can route uncertain cases to another process, but its workload and missed
    cases need evaluation. Good calibration on yesterday’s sample does not establish confidence in an unfamiliar
    environment.
  bridges: []
- id: calibrated-decisions.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.calibrated-decisions
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Calibration describes agreement between predicted probabilities and outcomes; decision theory combines
    probabilities with costs, while uncertainty should be checked under the deployment conditions.
- id: calibrated-decisions.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
