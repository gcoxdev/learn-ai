- title: Stronger guidance is a tradeoff
  markdown: 'Increasing guidance can strengthen parts of prompt following while reducing diversity or introducing
    artifacts. It does not guarantee correct spelling, object counts, or geometry.


    To understand an output, trace the whole system: compression chooses the representation; training teaches
    the denoiser; conditioning supplies the request; guidance combines predictions; the sampler updates the
    latent; and the decoder produces the image. A change in any of these parts can change the result.'
  id: latent-diffusion.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.latent-diffusion
  text_mode: 'Increasing guidance can strengthen parts of prompt following while reducing diversity or introducing
    artifacts. It does not guarantee correct spelling, object counts, or geometry.


    To understand an output, trace the whole system: compression chooses the representation; training teaches
    the denoiser; conditioning supplies the request; guidance combines predictions; the sampler updates the
    latent; and the decoder produces the image. A change in any of these parts can change the result.'
- id: latent-diffusion.extension-unet-dit
  title: Two backbones for the denoising prediction
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.latent-diffusion
  markdown: 'A U-Net processes spatial arrays through downsampling and upsampling stages, with skip connections
    carrying information between matching resolutions. This combines broader context with spatial detail. Conditioning
    can enter through cross-attention or other defined mechanisms.


    A diffusion transformer can divide a latent array into patches, project them into a sequence, and use transformer
    blocks to predict a denoising-related target. Time and conditioning signals modulate that computation through
    the chosen design. The autoencoder handles compression and reconstruction; the denoising backbone handles
    the generative trajectory. Swapping a U-Net for a transformer does not by itself specify the noise schedule,
    training target, guidance, or sampling solver.'
  text_mode: 'A U-Net processes spatial arrays through downsampling and upsampling stages, with skip connections
    carrying information between matching resolutions. This combines broader context with spatial detail. Conditioning
