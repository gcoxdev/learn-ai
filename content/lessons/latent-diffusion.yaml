assessment_families:
  - response_type: single_choice
    hint: A training example has a clean reference and target; fresh text-to-image sampling starts from noise and uses learned parameters.
    variants:
      - prompt: Which sequence describes fresh text-to-image sampling in the latent-diffusion setup taught here?
        options:
          - id: a
            text: Encode a required clean target image → retrain the model on that target for every prompt.
          - id: b
            text: Classify the prompt as a token ID → return that ID as the finished image.
          - id: answer
            text: Encode the text condition → sample latent noise → iterative denoising/sampling → decode an image.
        answer: answer
        feedback: Fresh sampling uses a condition and initial latent noise, then a learned denoiser/sampler and decoder. An existing target image is not required for that request.
        id: latent-diffusion.base.1
        retired: true
      - prompt: Where does a common latent-diffusion training example obtain its clean latent?
        options:
          - id: b
            text: From the output token IDs of a vocabulary classifier, necessarily.
          - id: answer
            text: From encoding a training image with the image encoder.
          - id: a
            text: From a guarantee that every random latent is already the correct answer.
        answer: answer
        feedback: The encoder maps a training image into latent space. That clean latent can then be deliberately corrupted to construct a denoising example.
        id: latent-diffusion.base.2
        retired: true
    id: latent-diffusion.base
    objective_ref: objective.latent-diffusion
    task: base
    points: 1
    remediation_scene: latent-diffusion.s1
  - response_type: single_choice
    hint: Use the stated guidance convention, and distinguish a tuning effect from a guarantee.
    variants:
      - prompt: Using u + s(c − u), let u = [0, 2], c = [2, 1], and s = 2. What is the combined prediction?
        options:
          - id: b
            text: '[0, 4]'
          - id: answer
            text: '[4, 0]'
          - id: a
            text: '[2, 1]'
        answer: answer
        feedback: The difference is [2, −1]. Doubling it gives [4, −2], which added to [0, 2] gives [4, 0]. This combines predictions; it is not the full sampler update.
        id: latent-diffusion.transfer.1
        retired: true
      - prompt: A larger guidance scale makes a generated image look more prompt-specific. What should you still assess?
        options:
          - id: answer
            text: Diversity, artifacts, and whether requested details are actually correct.
          - id: a
            text: Nothing; high guidance mathematically guarantees correctness.
          - id: b
            text: Only token IDs, because the denoiser and sampler no longer matter.
        answer: answer
        feedback: Guidance is a control with tradeoffs. Stronger conditioning effects can coexist with reduced diversity, artifacts, or incorrect details.
        id: latent-diffusion.transfer.2
        retired: true
    id: latent-diffusion.transfer
    objective_ref: objective.latent-diffusion
    task: transfer
    points: 1
    remediation_scene: latent-diffusion.s1
  - id: latent-diffusion.base.v2
    objective_ref: objective.latent-diffusion
    task: base
    response_type: single_choice
    points: 1
    hint: "Place each part: the autoencoder compresses and decodes, the denoiser loops in latent space, the prompt enters by cross-attention, and guidance combines two predictions."
    remediation_scene: latent-diffusion.s3
    variants:
      - id: latent-diffusion.base.v2.1
        prompt: During one Stable Diffusion text-to-image request, how many times does the image decoder run?
        options:
          - id: b
            text: Once per denoising step, to check progress
          - id: a
            text: Once, at the end, on the final latent
          - id: c
            text: Twice per step, once for each guidance prediction
        answer: a
        feedback: The whole loop runs in latent space; only the final latent is decoded to pixels. Decoding every step would throw away the savings, and guidance's two predictions come from the denoiser, not the decoder.
      - id: latent-diffusion.base.v2.2
        prompt: In the denoiser's cross-attention layers, where do the queries, keys, and values come from?
        options:
          - id: c
            text: All three come from the prompt's token vectors
          - id: b
            text: Queries from the prompt; keys and values from the latent
          - id: a
            text: Queries from the latent; keys and values from the prompt
        answer: a
        feedback: Each latent position asks what it should become (query) and reads from the prompt tokens (keys and values). Reversing them would let words attend to pixels, which doesn't update the image.
      - id: latent-diffusion.base.v2.3
        prompt: Why were 10% of Stable Diffusion's training captions replaced with empty ones?
        options:
          - id: a
            text: So the same network can also predict noise with no prompt, for guidance
          - id: b
            text: So the model learns to ignore the prompt when it is unhelpful
          - id: c
            text: So the autoencoder can be trained without captions at the same time
        answer: a
        feedback: Classifier-free guidance needs an unconditional prediction ε_u alongside ε_c; caption dropout teaches one network both. The autoencoder is trained separately and frozen.
      - id: latent-diffusion.base.v2.4
        prompt: What is the difference between conditioning and guidance in a latent diffusion model?
        options:
          - id: b
            text: Conditioning is used in training, guidance only in the decoder
          - id: a
            text: Conditioning feeds in the prompt; guidance sets how hard to follow it
          - id: c
            text: They are two names for the same cross-attention mechanism
        answer: a
        feedback: Conditioning is the prompt input, via cross-attention. Guidance combines the conditional and unconditional predictions with a scale s during sampling. The decoder never sees the prompt.
  - id: latent-diffusion.transfer.v2
    objective_ref: objective.latent-diffusion
    task: transfer
    response_type: single_choice
    points: 1
    hint: Find the stage responsible. Lost fine detail points to the autoencoder, starting-point control to how much noise is added, and variety versus prompt-following to the guidance scale.
    remediation_scene: latent-diffusion.s6
    variants:
      - id: latent-diffusion.transfer.v2.1
        prompt: A designer's generated posters show mangled small text, even with long sampling runs and precise prompts. Which part most likely limits the text?
        options:
          - id: c
            text: The guidance scale, which is set too low for text
          - id: a
            text: The autoencoder, which can't rebuild fine detail like small letters
          - id: b
            text: The sampler, which needs more steps for small details
        answer: a
        feedback: Whatever the decoder can't reconstruct from a 64 × 64 × 4 latent can't appear in the image, however good the denoising. More steps or guidance won't fix a detail the latent can't carry.
      - id: latent-diffusion.transfer.v2.2
        prompt: A user wants to restyle their own garden photo as a watercolor while keeping the layout. How should the pipeline start?
        options:
          - id: a
            text: Encode the photo, add noise partway, then denoise with the new prompt
          - id: b
            text: Start from fresh random noise and describe the garden in the prompt
          - id: c
            text: Decode the photo's latent directly, skipping the denoising loop
        answer: a
        feedback: Partial noising keeps the layout while leaving room to change the style; less noise keeps more of the original. Fresh noise loses the layout, and skipping denoising changes nothing.
      - id: latent-diffusion.transfer.v2.3
        prompt: At guidance scale 15, every seed for "a dog" gives nearly the same dog with harsh colors. What should the user try?
        options:
          - id: b
            text: Raise the scale further so the prompt dominates
          - id: c
            text: Double the sampling steps so each image finishes
          - id: a
            text: Lower the scale, trading some adherence for variety
        answer: a
        feedback: High guidance narrows the distribution and pushes past typical images, giving sameness and oversaturation. A lower scale restores variety; more steps don't change where guidance aims.
      - id: latent-diffusion.transfer.v2.4
        prompt: A lab switches its denoiser from a U-Net to a diffusion transformer. Which part of the pipeline must also change?
        options:
          - id: c
            text: The autoencoder, since transformers can't read 4-channel latents
          - id: b
            text: The guidance formula, since transformers use a different scale
          - id: a
            text: Only the denoiser; schedule, loss, guidance, and decoder can stay
        answer: a
        feedback: The backbone predicts the same noise from the same inputs, so the rest of the pipeline is unchanged. DiT splits the latent into patches itself, and guidance just combines two of its predictions.
  - id: latent-diffusion.calculate
    objective_ref: objective.latent-diffusion
    task: base
    response_type: numeric
    points: 1
    hint: "Guided prediction: ε_u + s(ε_c − ε_u), one coordinate at a time. Compression factor: (pixels × 3) ÷ (latent height × latent width × channels)."
    remediation_scene: latent-diffusion.s5
    absolute_tolerance: 0.01
    variants:
      - id: latent-diffusion.calculate.1
        prompt: 'For one latent value, ε_u = 0.2 and ε_c = 0.5. With guidance scale s = 7.5, what is the guided prediction?'
        answer: 2.45
        feedback: 0.2 + 7.5 × (0.5 − 0.2) = 0.2 + 2.25 = 2.45. Guidance goes well past the conditional 0.5.
      - id: latent-diffusion.calculate.2
        prompt: 'For one latent value, ε_u = 1.0 and ε_c = 0.6. With s = 3, what is the guided prediction?'
        answer: -0.2
        feedback: 1.0 + 3 × (0.6 − 1.0) = 1.0 − 1.2 = −0.2. A negative difference is amplified the same way.
      - id: latent-diffusion.calculate.3
        prompt: 'With ε_u = [0, 2] and ε_c = [2, 1] and s = 2, what is the second coordinate of the guided prediction?'
        answer: 0
        feedback: The difference is [2, −1]; doubling gives [4, −2]; adding [0, 2] gives [4, 0]. The second coordinate is 0.
      - id: latent-diffusion.calculate.4
        prompt: 'An autoencoder maps a 1024 × 1024 × 3 image to a 128 × 128 × 4 latent. How many times fewer numbers does the denoiser handle?'
        answer: 48
        feedback: 1024 × 1024 × 3 = 3,145,728 and 128 × 128 × 4 = 65,536, so the factor is 48. The same factor-of-8 downsampling with 4 channels always gives 48.
      - id: latent-diffusion.calculate.5
        prompt: 'An autoencoder maps a 256 × 256 × 3 image to a 64 × 64 × 3 latent. How many times fewer numbers is that?'
        answer: 16
        feedback: 256 × 256 × 3 = 196,608 and 64 × 64 × 3 = 12,288; 196,608 / 12,288 = 16, from 4 × 4 downsampling with the same number of channels.
      - id: latent-diffusion.calculate.6
        prompt: 'A sampler takes 30 steps with classifier-free guidance, computing ε_u and ε_c separately each step. How many denoiser predictions is that?'
        answer: 60
        feedback: Two predictions per step, 30 × 2 = 60. Batching the pair speeds it up, but the work is still two predictions.
