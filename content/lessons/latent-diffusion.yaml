schema_version: 0.2-draft
lesson:
  id: latent-diffusion
  version: 0.4.0-draft
  title: Why image generators work in latent space
  state: draft
  summary: Stable Diffusion doesn't denoise pixels. It denoises a picture 48 times smaller, reads your prompt through attention, and exaggerates what the prompt changes. Follow one request from words to image.
  slot: M22.7
  category: destination
  sources:
    - title: High-Resolution Image Synthesis with Latent Diffusion Models (Rombach et al., 2022)
      url: https://arxiv.org/abs/2112.10752
    - title: Classifier-Free Diffusion Guidance (Ho & Salimans, 2022)
      url: https://arxiv.org/abs/2207.12598
    - title: Stable Diffusion v1-4 model card (CompVis)
      url: https://huggingface.co/CompVis/stable-diffusion-v1-4
    - title: Denoising Diffusion Probabilistic Models (Ho, Jain & Abbeel, 2020)
      url: https://arxiv.org/abs/2006.11239
    - title: Scalable Diffusion Models with Transformers (Peebles & Xie, 2022)
      url: https://arxiv.org/abs/2212.09748
objectives:
  - id: objective.latent-diffusion
    version: 2-draft
    statement: Trace latent-diffusion training and sampling, and distinguish conditioning from guidance.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - latent-diffusion.base.v2
      - latent-diffusion.transfer.v2
      - latent-diffusion.calculate
    prerequisites:
      - anyOf:
          - objective.denoising
      - anyOf:
