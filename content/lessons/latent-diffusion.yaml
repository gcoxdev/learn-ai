scenes:
  - title: Denoise a picture 48 times smaller
    markdown: |-
      A 512 × 512 color photo is $512 \times 512 \times 3 = 786{,}432$ numbers. A diffusion sampler runs its denoiser dozens of times per image, over every one of those numbers. Most of that work is spent on detail your eye barely registers, like the exact grain of a wall.

      **Latent diffusion** (Rombach and colleagues, published at CVPR 2022) splits the job in two:

      1. An **autoencoder** learns to compress an image into a small grid of numbers, its latent, and to rebuild the image from it. It's trained once, like the autoencoders in the VAE lesson, on reconstruction plus a GAN-style discriminator that keeps textures sharp.
      2. The diffusion model then does all its noising and denoising on latents, never on pixels.

      In Stable Diffusion v1, the encoder shrinks each side by a factor of 8 and keeps 4 numbers per position: a $512 \times 512 \times 3$ image becomes a $64 \times 64 \times 4$ latent, which is 16,384 numbers.

      :::predict How many times fewer numbers does the denoiser handle?
      $786{,}432 / 16{,}384 = 48$. Every denoising step now works on 1/48 of the numbers, and the decoder runs just once, at the end.
      :::

      The autoencoder handles fine texture, which it can rebuild without understanding the scene; diffusion handles composition, what's in the picture and where. The price: anything the decoder can't reproduce, such as small text, can't appear in the final image.
    bridges:
      - vectors
    id: latent-diffusion.s1
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.latent-diffusion
  - title: Prepare a training example
    markdown: |-
      Training reuses everything from the denoising lesson, one level down:

      1. Encode a training image into its clean latent $z_0$ (64 × 64 × 4).
      2. Encode its caption with a text encoder.
      3. Pick a level $t$ and noise $\varepsilon$, and make $z_t = \sqrt{\bar\alpha_t}\,z_0 + \sqrt{1 - \bar\alpha_t}\,\varepsilon$.
      4. The denoiser predicts $\hat\varepsilon = \varepsilon_\theta(z_t, t, \text{caption})$; the loss is $\|\varepsilon - \hat\varepsilon\|^2$.

      Only the denoiser learns here. In Stable Diffusion v1, both the autoencoder and the text encoder (OpenAI's CLIP ViT-L/14, trained to match images with captions) were frozen: trained beforehand and left unchanged. One more trick: in the later training runs (v1-3 and v1-4), 10% of captions were replaced with an empty one. You'll see why in the guidance scene.
    id: latent-diffusion.s2
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.latent-diffusion
  - title: Follow a text-to-image request
    markdown: |-
      Now type "a red fox in fresh snow". Sampling runs the pieces in this order:

      1. The text encoder turns the prompt into a sequence of token vectors (77 tokens of 768 numbers each for CLIP ViT-L/14).
      2. Draw a random 64 × 64 × 4 latent. There's no fox hidden in it; it's fresh noise.
      3. For each of the sampler's steps (often 20 to 50), the denoiser predicts the noise given the prompt, and the sampler removes some of it.
      4. Decode the final latent into a 512 × 512 image.

      The table compares this with a training example. A useful variant, image-to-image editing, starts from your own photo instead: encode it, add noise partway (say to half the schedule), and denoise from there with a new prompt. The less noise you add, the more of the original survives.
    type: table
    columns:
      - Training example
      - Fresh text-to-image sampling
    rows:
      - - Starts from a real encoded image
        - Starts from sampled latent noise
      - - Creates a noisy latent and known training target
        - Uses the learned denoiser and a sampler
      - - Can update trainable parameters
        - Ordinarily keeps parameters fixed
      - - Evaluates a loss against the chosen target
        - Decodes a generated latent
    diagram:
      caption: One Stable Diffusion request. The expensive loop runs entirely in the small latent space.
      description: The prompt goes to the frozen text encoder, which produces token vectors. Those vectors reach the U-Net denoiser through cross-attention. Random noise shaped 64 by 64 by 4 enters the denoiser. The denoiser and sampler step run in a loop for 20 to 50 steps, each step removing some predicted noise. The final latent goes to the decoder, which produces the 512 by 512 image.
      nodes:
        - id: prompt
          label: Prompt
          note: '"a red fox in fresh snow"'
          col: 0
          row: 0
        - id: textenc
          label: Text encoder (frozen)
          note: 77 token vectors
          col: 1
          row: 0
          tone: muted
        - id: noise
          label: Random latent
          note: 64 × 64 × 4
          col: 1
          row: 1
          tone: data
        - id: unet
          label: U-Net denoiser
          note: predicts noise
          col: 2
          row: 1
          tone: accent
        - id: step
          label: Sampler step
          note: remove some noise
          col: 3
          row: 1
        - id: decoder
          label: Decoder
          col: 4
          row: 1
        - id: image
          label: 512 × 512 image
          col: 5
          row: 1
          tone: data
      edges:
        - from: prompt
          to: textenc
        - from: textenc
          to: unet
          label: cross-attention
        - from: noise
          to: unet
        - from: unet
          to: step
        - from: step
          to: unet
          label: repeat 20–50 times
          dashed: true
          bend: 2
        - from: step
          to: decoder
          label: final latent
        - from: decoder
          to: image
    id: latent-diffusion.s3
    depth: mechanics
    objective_refs:
      - objective.latent-diffusion
  - title: The prompt enters through cross-attention
    markdown: |-
      How does "fox" get from the text encoder into the right part of the latent? Through **cross-attention**, the same query–key–value attention from module 15, but across two different sequences. Inside the denoiser, at each attention layer:

      - every latent position makes a query: "what should I be?";
      - every prompt token makes a key ("here's what I'm about") and a value ("here's what I contribute").

      A patch in the middle might put most of its weight on "fox"; a patch near the bottom, on "snow". Each position mixes in the values it attended to, so the prompt steers different parts of the image differently.

      :::papers Cross-attention in latent diffusion (Rombach et al., 2022)
      $$\text{Attention}(Q, K, V) = \text{softmax}\!\left(\frac{QK^\top}{\sqrt{d}}\right)V, \quad Q = W_Q\,\varphi(z_t),\; K = W_K\,\tau(y),\; V = W_V\,\tau(y)$$

      $\varphi(z_t)$ is the denoiser's internal features for the noisy latent, $\tau(y)$ is the text encoder's output for prompt $y$, and $d$ is the key size. Queries come from the image; keys and values come from the text.
      :::

      Conditioning and guidance are separate ideas. Conditioning, done here, gives the denoiser the prompt. Guidance, next, decides how hard to push toward it.
    id: latent-diffusion.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.latent-diffusion
  - title: Guidance exaggerates what the prompt changes
    markdown: |-
      Remember the 10% of training examples with an empty caption? Because of them, one network can make two predictions for the same noisy latent: $\varepsilon_u$ with an empty prompt (unconditional), and $\varepsilon_c$ with your prompt (conditional). The difference $\varepsilon_c - \varepsilon_u$ is "what the prompt changes". **Classifier-free guidance** (Ho & Salimans, 2022) takes a bigger step in that direction:

      $$\hat\varepsilon = \varepsilon_u + s\,(\varepsilon_c - \varepsilon_u)$$

      Here $s$ is the **guidance scale**. (Ho and Salimans write the same rule with $w = s - 1$, so their $w = 0$ means plain conditional.) Take two-number toy predictions $\varepsilon_u = [1, 1]$ and $\varepsilon_c = [2, 0]$, so the difference is $[1, -1]$. With $s = 2$: $[1, 1] + 2 \times [1, -1] = [3, -1]$. The table shows $s = 0$ (ignore the prompt), $s = 1$ (plain conditional), and $s = 2$.

      :::predict Stable Diffusion's usual default is s = 7.5. What is the guided prediction?
      $[1, 1] + 7.5 \times [1, -1] = [8.5, -6.5]$. Guidance goes far *past* the conditional prediction, not just up to it.
      :::

      ```python run
      import numpy as np

      eps_u = np.array([1.0, 1.0])     # noise prediction with an empty prompt
      eps_c = np.array([2.0, 0.0])     # noise prediction with the prompt

      for s in [0, 1, 2, 7.5]:
          guided = eps_u + s * (eps_c - eps_u)
          print(f"s = {s:>3}: guided prediction = {guided.tolist()}")

      # What guidance does to the distribution, in one dimension.
      # Unconditional images: N(0, 1). Images matching the prompt: N(1, 0.5^2).
      # As scores, eps_u + s*(eps_c - eps_u) is the score of p(x)^(1-s) * p(x|c)^s.
      print()
      for s in [0, 1, 3, 7.5]:
          precision = (1 - s) * 1 + s * 4          # 1/variance of the guided bell
          mean = (s * 4 * 1.0) / precision
          print(f"s = {s:>3}: guided mean = {mean:.2f}, spread (sd) = {1 / np.sqrt(precision):.2f}")

      steps = 50
      print("\nnetwork passes for", steps, "guided steps:", 2 * steps)
      ```

      Guidance doubles the cost: 50 steps take 100 network passes (usually run as batches of two).
    type: table
    columns:
      - Scale s
      - Combined toy prediction
    rows:
      - - 0
        - '[1, 1]'
      - - 1
        - '[2, 0]'
      - - 2
        - '[3, −1]'
    id: latent-diffusion.s5
    depth: mechanics
    objective_refs:
      - objective.latent-diffusion
  - title: Stronger guidance is a tradeoff
    markdown: |-
      The program's second half shows what guidance does to the *distribution* of images. Picture a one-dimensional "image space" where all images follow $p(x) = \mathcal{N}(0, 1)$ and images matching the prompt follow $p(x \mid c) = \mathcal{N}(1, 0.5^2)$. A noise prediction is a scaled score (as in the denoising lesson), so the guided prediction is the score of the tilted density $p(x)^{1-s}\,p(x \mid c)^{s}$. For two bells, that is another bell:

      | Scale $s$ | Guided mean | Spread (sd) |
      | ---: | ---: | ---: |
      | 0 | 0.00 | 1.00 |
      | 1 | 1.00 | 0.50 |
      | 3 | 1.20 | 0.32 |
      | 7.5 | 1.28 | 0.21 |

      A real sampler applies this tilt at every noise level, so its outputs follow the table's trend rather than these exact numbers. Two things happen as $s$ grows. The samples move *beyond* the typical prompt-matching image (mean 1.28, not 1), and they bunch together (spread 0.21, not 0.5). In real images, that's stronger prompt-following and punchier colors, but less variety: ask for "a dog" at a high scale and many seeds give nearly the same dog, sometimes oversaturated.

      :::mixup "Higher guidance always gives better images."
      Guidance trades variety and naturalness for prompt adherence. Past a point, images look overcooked. Try a few scales (say 3, 7.5, 12) on the same seed and pick by eye; the best value differs between models and prompts.
      :::
    id: latent-diffusion.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.latent-diffusion
  - id: latent-diffusion.extension-unet-dit
    title: Two backbones for the denoising prediction
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.latent-diffusion
    markdown: |-
      Stable Diffusion v1's denoiser is a **U-Net**, as in the denoising lesson, with cross-attention layers added to read the prompt.

      A **diffusion transformer**, or DiT (Peebles & Xie, 2022), instead cuts the latent into patches, as a vision transformer does, and runs transformer blocks over the patch sequence, with the time step and condition adjusting each block. DiTs scale predictably with more compute, and newer systems such as Stable Diffusion 3 (2024) use transformer denoisers. Swapping the backbone changes nothing else in this lesson: the autoencoder, the noise schedule, the loss, guidance, and the sampler all stay the same.
    bridges: []
  - id: latent-diffusion.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.latent-diffusion
    markdown: Compression factors and guided predictions to compute, plus a photo editor, a blurry-text problem, and an overcooked image, test whether you can trace a latent diffusion system end to end.
    takeaway: |-
      Latent diffusion denoises a small latent (48× fewer numbers for Stable Diffusion) and decodes at the end. The prompt enters through cross-attention, and guidance, ε_u + s(ε_c − ε_u), pushes past the conditional prediction at the cost of variety.
  - id: latent-diffusion.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.latent-diffusion
    markdown: |-
      Latent diffusion generates in a compressed representation, then decodes an image. Conditioning supplies information; guidance changes how predictions steer the sample.
