scenes:
- title: Move the denoising work into a representation
  markdown: 'A latent-diffusion system can first learn an image encoder and decoder. The encoder maps an image
    into a numerical latent representation; the decoder reconstructs an image from that representation. Diffusion
    then operates in the latent space instead of directly on all pixel values.


    This can reduce the size of the denoising problem. Compression is a tradeoff: a smaller representation
    can lose details. The latent coordinates are learned numerical features, not necessarily a list of objects
    in the scene.'
  bridges:
  - vectors
  id: latent-diffusion.s1
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.latent-diffusion
  text_mode: 'A latent-diffusion system can first learn an image encoder and decoder. The encoder maps an image
    into a numerical latent representation; the decoder reconstructs an image from that representation. Diffusion
    then operates in the latent space instead of directly on all pixel values.


    This can reduce the size of the denoising problem. Compression is a tradeoff: a smaller representation
    can lose details. The latent coordinates are learned numerical features, not necessarily a list of objects
    in the scene.'
- title: Prepare a training example
  markdown: 'In a common staged setup, a trained image encoder supplies a clean latent. Sample a timestep and
    noise, then corrupt the latent according to the schedule. A denoiser receives the noisy latent, timestep
    information, and any condition.


    A training loss compares its prediction with the chosen target. Noise prediction is one common parameterization;
    other targets are possible. Backpropagation and optimization update the intended trainable components.
    Which encoder, decoder, or conditioning parts are frozen is a recipe choice, not a universal rule.'
  id: latent-diffusion.s2
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.latent-diffusion
  text_mode: 'In a common staged setup, a trained image encoder supplies a clean latent. Sample a timestep
    and noise, then corrupt the latent according to the schedule. A denoiser receives the noisy latent, timestep
    information, and any condition.


    A training loss compares its prediction with the chosen target. Noise prediction is one common parameterization;
    other targets are possible. Backpropagation and optimization update the intended trainable components.
    Which encoder, decoder, or conditioning parts are frozen is a recipe choice, not a universal rule.'
- title: Follow a text-to-image sampling request
  markdown: 'For a fresh text-to-image request, encode the text condition and start with sampled latent noise.
    Repeatedly run the denoiser and sampler update, then decode the final latent into an image. You do not
    need an existing clean target image for this request.


    Image editing can add a supplied image and use an encoded, partially noised latent instead. Keep this input-conditioned
    editing case separate from the fresh text-to-image example.'
  type: table
  columns:
  - Training example
  - Fresh text-to-image sampling
  rows:
  - - Starts from a real encoded image
    - Starts from sampled latent noise
  - - Creates a noisy latent and known training target
    - Uses the learned denoiser and a sampler
  - - Can update trainable parameters
    - Ordinarily keeps parameters fixed
  - - Evaluates a loss against the chosen target
    - Decodes a generated latent
  id: latent-diffusion.s3
  depth: mechanics
  objective_refs:
  - objective.latent-diffusion
  text_mode: 'For a fresh text-to-image request, encode the text condition and start with sampled latent noise.
    Repeatedly run the denoiser and sampler update, then decode the final latent into an image. You do not
    need an existing clean target image for this request.


    Image editing can add a supplied image and use an encoded, partially noised latent instead. Keep this input-conditioned
    editing case separate from the fresh text-to-image example.'
- title: Conditioning supplies information
  markdown: 'A prompt encoder supplies representations that influence the denoiser. Cross-attention is one
    possible way to introduce text information; other designs combine conditioning differently. The denoiser
    may use a U-Net-like architecture or transformer-based components.


    Architecture and diffusion objective are different choices. “Transformer” names a family of network mechanisms;
    “diffusion” names a generative learning/sampling framework. A diffusion transformer combines those ideas
    rather than making them competing labels.'
  id: latent-diffusion.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.latent-diffusion
  text_mode: 'A prompt encoder supplies representations that influence the denoiser. Cross-attention is one
    possible way to introduce text information; other designs combine conditioning differently. The denoiser
    may use a U-Net-like architecture or transformer-based components.


    Architecture and diffusion objective are different choices. “Transformer” names a family of network mechanisms;
    “diffusion” names a generative learning/sampling framework. A diffusion transformer combines those ideas
    rather than making them competing labels.'
- title: Guidance changes how predictions steer a sample
  markdown: 'A common classifier-free guidance convention combines an unconditional prediction u and conditional
    prediction c as u + s × (c − u). The multiplier s controls how far the sampler follows their difference.
    Under this convention s = 1 gives c; s = 0 gives u.


    One network can learn both predictions by occasionally dropping the condition during training. At sampling
    time it can evaluate the same noisy latent with the condition and with an empty condition, then combine
    those two predictions. This uses shared parameters; it does not require two separately trained networks.


    For invented vectors u = [1, 1] and c = [2, 0], s = 2 gives [3, −1]. This is a prediction-combination example,
    not a complete diffusion update. Other systems may name or implement the scale differently.'
  type: table
  columns:
  - Scale s
  - Combined toy prediction
  rows:
  - - 0
    - '[1, 1]'
  - - 1
    - '[2, 0]'
  - - 2
    - '[3, −1]'
  id: latent-diffusion.s5
  depth: mechanics
  objective_refs:
  - objective.latent-diffusion
  text_mode: 'A common classifier-free guidance convention combines an unconditional prediction u and conditional
    prediction c as u + s × (c − u). The multiplier s controls how far the sampler follows their difference.
    Under this convention s = 1 gives c; s = 0 gives u.


    One network can learn both predictions by occasionally dropping the condition during training. At sampling
