assessment_families:
- response_type: single_choice
  hint: A training example has a clean reference and target; fresh text-to-image sampling starts from noise
    and uses learned parameters.
  variants:
  - prompt: Which sequence describes fresh text-to-image sampling in the latent-diffusion setup taught here?
    options:
    - id: a
      text: Encode a required clean target image → retrain the model on that target for every prompt.
    - id: b
      text: Classify the prompt as a token ID → return that ID as the finished image.
    - id: answer
      text: Encode the text condition → sample latent noise → iterative denoising/sampling → decode an image.
    answer: answer
    feedback: Fresh sampling uses a condition and initial latent noise, then a learned denoiser/sampler and
      decoder. An existing target image is not required for that request.
    id: latent-diffusion.base.1
  - prompt: Where does a common latent-diffusion training example obtain its clean latent?
    options:
    - id: b
      text: From the output token IDs of a vocabulary classifier, necessarily.
    - id: answer
      text: From encoding a training image with the image encoder.
    - id: a
      text: From a guarantee that every random latent is already the correct answer.
    answer: answer
    feedback: The encoder maps a training image into latent space. That clean latent can then be deliberately
      corrupted to construct a denoising example.
    id: latent-diffusion.base.2
  id: latent-diffusion.base
  objective_ref: objective.latent-diffusion
  task: base
  points: 1
  remediation_scene: latent-diffusion.s1
- response_type: single_choice
  hint: Use the stated guidance convention, and distinguish a tuning effect from a guarantee.
  variants:
  - prompt: Using u + s(c − u), let u = [0, 2], c = [2, 1], and s = 2. What is the combined prediction?
    options:
    - id: b
      text: '[0, 4]'
    - id: answer
      text: '[4, 0]'
    - id: a
      text: '[2, 1]'
    answer: answer
    feedback: The difference is [2, −1]. Doubling it gives [4, −2], which added to [0, 2] gives [4, 0]. This
      combines predictions; it is not the full sampler update.
    id: latent-diffusion.transfer.1
  - prompt: A larger guidance scale makes a generated image look more prompt-specific. What should you still
      assess?
    options:
    - id: answer
      text: Diversity, artifacts, and whether requested details are actually correct.
    - id: a
      text: Nothing; high guidance mathematically guarantees correctness.
    - id: b
      text: Only token IDs, because the denoiser and sampler no longer matter.
    answer: answer
    feedback: Guidance is a control with tradeoffs. Stronger conditioning effects can coexist with reduced
      diversity, artifacts, or incorrect details.
    id: latent-diffusion.transfer.2
  id: latent-diffusion.transfer
  objective_ref: objective.latent-diffusion
  task: transfer
  points: 1
  remediation_scene: latent-diffusion.s1
