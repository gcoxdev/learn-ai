assessment_families:
  - id: gated-recurrence.base
    objective_ref: objective.gated-recurrence
    task: base
    response_type: single_choice
    points: 1
    hint: 'Follow an LSTM cell update: trace the inputs, operation, and result before choosing.'
    remediation_scene: gated-recurrence.s2
    variants:
      - id: gated-recurrence.base.1
        prompt: With f = 0.5, old cell = 4, i = 0.25, candidate = 2, what is new cell?
        options:
          - id: b
            text: '4.5'
          - id: c
            text: '1.5'
          - id: a
            text: '2.5'
        answer: a
        feedback: Retain 2 and add 0.5.
        retired: true
      - id: gated-recurrence.base.2
        prompt: What does a sigmoid-style gate usually output?
        options:
          - id: c
            text: A guaranteed binary decision always
          - id: a
            text: A value between zero and one
          - id: b
            text: An arbitrary document ID only
        answer: a
        feedback: The gate smoothly scales a numerical contribution.
        retired: true
  - id: gated-recurrence.transfer
    objective_ref: objective.gated-recurrence
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate memory as a capability: trace the inputs, operation, and result before choosing.'
    remediation_scene: gated-recurrence.s4
    variants:
      - id: gated-recurrence.transfer.1
        prompt: Does an LSTM guarantee unlimited perfect memory?
        options:
          - id: c
            text: Only if its output gate is named correctly
          - id: a
            text: 'No'
          - id: b
            text: Yes; long short-term memory is a formal unlimited guarantee
        answer: a
        feedback: Memory behavior depends on capacity, learning, and task conditions.
        retired: true
      - id: gated-recurrence.transfer.2
        prompt: Should a GRU be described as having exactly the same separate cell-state structure as a standard LSTM?
        options:
          - id: a
            text: No; their state and gate arrangements differ
          - id: b
            text: Yes; they are identical operations
          - id: c
            text: Only in small batches
        answer: a
        feedback: The architectures share gating ideas but differ in their mechanisms.
        retired: true
  - id: gated-recurrence.base.v2
    objective_ref: objective.gated-recurrence
    task: base
    response_type: single_choice
    points: 1
    hint: "Give each gate its job: forget scales the old cell, input scales what is written, output scales what the hidden state reveals. A gate near 1 passes; near 0 blocks."
    remediation_scene: gated-recurrence.s2
    variants:
      - id: gated-recurrence.base.v2.1
        prompt: On festival day, an ordinary 11 a.m. hour arrives and the LSTM should keep its "expect crowds" memory unchanged. Which gate values do that?
        options:
          - id: b
            text: Forget gate near 0 and input gate near 1
          - id: a
            text: Forget gate near 1 and input gate near 0
          - id: c
            text: Output gate near 0 and forget gate near 0
        answer: a
        feedback: A forget gate near 1 keeps the old cell, and an input gate near 0 writes almost nothing new over it. The reverse erases the memory and replaces it with this hour's content; the output gate only controls what gets revealed.
      - id: gated-recurrence.base.v2.2
        prompt: At one step, an LSTM's output gate is close to 0 while its forget gate is close to 1. What happens?
        options:
          - id: c
            text: The cell is erased, so the next step starts from nothing
          - id: b
            text: The new input is ignored, but the hidden state shows the cell
          - id: a
            text: The cell is kept, but the hidden state reveals little of it
        answer: a
        feedback: The forget gate near 1 preserves the cell, and the output gate near 0 makes h = o × tanh(c) small, so the memory is stored but hidden for now. Erasing is the forget gate's job, and ignoring input is the input gate's.
      - id: gated-recurrence.base.v2.3
        prompt: Why does the gradient survive more steps along an LSTM's cell than through a plain tanh RNN?
        options:
          - id: a
            text: Each step back multiplies it by f, which training can hold near 1
          - id: b
            text: The cell has no weights of its own, so there is no gradient to shrink
          - id: c
            text: LSTMs clip their gradients inside every cell as part of the design
        answer: a
        feedback: Along the cell, ∂c_t/∂c_(t−1) is the forget gate, and a learned f near 1 keeps the product of factors from collapsing. The cell still carries a gradient, and clipping is a separate training trick for explosions.
      - id: gated-recurrence.base.v2.4
        prompt: Which statement correctly describes how a GRU differs from an LSTM?
        options:
          - id: b
            text: It has no gates, and relies on a larger hidden state instead
          - id: c
            text: It adds a fifth gate that decides how much to output
          - id: a
            text: It has no separate cell, and one update gate both keeps and writes
        answer: a
        feedback: A GRU keeps a fraction z of the old state and fills the rest, 1 − z, with its proposal, so one gate does the work of the LSTM's forget and input gates, and there is no separate cell. It has two gates (update and reset), not zero or five.
  - id: gated-recurrence.transfer.v2
    objective_ref: objective.gated-recurrence
    task: transfer
    response_type: single_choice
    points: 1
    hint: Gates help a network learn to keep information across many steps, but the memory is learned and has a fixed size. Match the fix to the kind of memory the task needs.
    remediation_scene: gated-recurrence.s3
    variants:
      - id: gated-recurrence.transfer.v2.1
        prompt: A model reads a patient's heart rhythm once per second and must link a brief irregular beat to an alarm about 300 steps later. A plain tanh RNN never learns the link. What is the most promising change?
        options:
          - id: c
            text: Cut each sequence to 50 steps so training runs faster
          - id: b
            text: Lower the learning rate so that the updates are steadier
          - id: a
            text: Switch to an LSTM or GRU, whose gates can keep the event
        answer: a
        feedback: The link fails because the gradient vanishes across 300 multiplications; gated units let training hold a memory path open. Cutting sequences to 50 steps removes the dependency entirely, and a smaller learning rate doesn't make a vanished gradient reappear.
      - id: gated-recurrence.transfer.v2.2
        prompt: An LSTM-based support bot forgets the order number a customer typed about 2,000 words earlier. What is the most reliable fix?
        options:
          - id: a
            text: Save the order number in a record the bot can look up later
          - id: b
            text: Switch to a GRU, which has fewer gates that could forget it
          - id: c
            text: Double the LSTM's hidden state so it can hold more numbers
        answer: a
        feedback: A fixed-size, learned memory fades over thousands of steps, so exact facts belong in storage that can be looked up. A GRU has the same kind of memory, and a bigger state helps a little without making recall exact.
      - id: gated-recurrence.transfer.v2.3
        prompt: A team must choose between an LSTM and a GRU for hourly energy forecasting. What is the best way to decide?
        options:
          - id: b
            text: Pick the LSTM, since its extra gate means it will remember more
          - id: a
            text: Backtest both on the same days and weigh accuracy against size
          - id: c
            text: Pick the GRU, since it came later and replaced the older LSTM
        answer: a
        feedback: Comparisons such as Chung et al. (2014) found neither unit wins consistently, so measure on your own data with the same backtest. More gates don't mean more memory, and the GRU is an alternative, not a replacement.
      - id: gated-recurrence.transfer.v2.4
        prompt: Engineers plant a sales spike in test data and watch a trained LSTM. Its forecasts still reflect the spike 30 steps later, but not after 100 steps. What does this show?
        options:
          - id: c
            text: The LSTM is broken, since a working one keeps memories forever
          - id: b
            text: The output gate is stuck at 1, so the memory leaks out each step
          - id: a
            text: Its gates learned to hold this kind of event for tens of steps
        answer: a
        feedback: How long an LSTM remembers depends on what training taught its gates, and forget gates below 1 fade over long stretches. Healthy LSTMs forget; the output gate controls what is revealed, not what the cell keeps.
  - id: gated-recurrence.calc.v2
    objective_ref: objective.gated-recurrence
    task: base
    response_type: numeric
    points: 1
    hint: "LSTM: new cell = forget × old cell + input × candidate. GRU: new state = z × old state + (1 − z) × proposal."
    remediation_scene: gated-recurrence.s2
    absolute_tolerance: 0.01
    variants:
      - id: gated-recurrence.calc.v2.1
        prompt: An LSTM has forget gate 0.9, old cell 3.0, input gate 0.5, and candidate 0.4. What is the new cell value?
        answer: 2.9
        feedback: It keeps 0.9 × 3.0 = 2.7 and writes 0.5 × 0.4 = 0.2, so the new cell is 2.9.
      - id: gated-recurrence.calc.v2.2
        prompt: An LSTM has forget gate 0.2, old cell 5.0, input gate 0.8, and candidate −0.5. What is the new cell value?
        answer: 0.6
        feedback: It keeps 0.2 × 5.0 = 1.0 and writes 0.8 × (−0.5) = −0.4, so the new cell is 0.6. A low forget gate wiped most of the old memory.
      - id: gated-recurrence.calc.v2.3
        prompt: A GRU has update gate z = 0.75, old state 0.4, and proposed state 0.8, using h = z × old + (1 − z) × proposal. What is the new state?
        answer: 0.5
        feedback: 0.75 × 0.4 = 0.3 kept, plus 0.25 × 0.8 = 0.2 written, gives 0.5.
      - id: gated-recurrence.calc.v2.4
        prompt: An LSTM has forget gate 0.6, old cell −1.0, input gate 0.5, and candidate 0.6. What is the new cell value?
        answer: -0.3
        feedback: It keeps 0.6 × (−1.0) = −0.6 and writes 0.5 × 0.6 = 0.3, so the new cell is −0.3.
