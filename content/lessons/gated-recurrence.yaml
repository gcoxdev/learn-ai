objectives:
- id: objective.gated-recurrence
  version: 1-draft
  statement: LSTMs and GRUs use learned gates to control state updates; these mechanisms can help long-range learning
    but do not provide unlimited or perfect memory.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - gated-recurrence.base
  - gated-recurrence.transfer
  prerequisites:
  - anyOf:
    - objective.recurrent-networks
scenes:
- id: gated-recurrence.s1
  title: A gate scales an information path
  type: explanation
  depth: intuition
  objective_refs:
  - objective.gated-recurrence
  markdown: A learned gate commonly takes values between zero and one through a sigmoid. Values near zero suppress
    a contribution; values near one retain it more strongly. Gates depend on inputs and states through learned parameters.
    They are numerical controls, not explicit human-written decisions about meaning.
  text_mode: A learned gate commonly takes values between zero and one through a sigmoid. Values near zero suppress
    a contribution; values near one retain it more strongly. Gates depend on inputs and states through learned parameters.
    They are numerical controls, not explicit human-written decisions about meaning.
  bridges: []
- id: gated-recurrence.s2
  title: Follow an LSTM cell update
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.gated-recurrence
  markdown: 'A common LSTM cell update combines retained old cell state with a gated candidate: c_new = f × c_old
    + i × candidate. If f = 0.8, c_old = 2, i = 0.5, and candidate = 1, the new cell state is 2.1. An output gate
    controls how the cell contributes to the exposed hidden state.'
  text_mode: 'A common LSTM cell update combines retained old cell state with a gated candidate: c_new = f × c_old
    + i × candidate. If f = 0.8, c_old = 2, i = 0.5, and candidate = 1, the new cell state is 2.1. An output gate
    controls how the cell contributes to the exposed hidden state.'
  bridges:
  - algebra-notation
- id: gated-recurrence.s3
  title: Compare a GRU
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.gated-recurrence
  markdown: A GRU uses update and reset gates with a hidden state rather than the same separate cell-state structure
    as an LSTM. Implementations differ in precise conventions. Both architectures allow selected paths to retain
    information more directly than a simple recurrence, which can ease some gradient-flow problems.
  text_mode: A GRU uses update and reset gates with a hidden state rather than the same separate cell-state structure
    as an LSTM. Implementations differ in precise conventions. Both architectures allow selected paths to retain
    information more directly than a simple recurrence, which can ease some gradient-flow problems.
  bridges: []
- id: gated-recurrence.s4
  title: Evaluate memory as a capability
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.gated-recurrence
  markdown: Gating does not guarantee remembering every relevant event across any sequence length. Training signals,
    state size, data, and optimization still matter. Test controlled delayed-dependency tasks and real sequence
    conditions. Distinguish a learned retention pattern from a general external memory with exact lookup.
  text_mode: Gating does not guarantee remembering every relevant event across any sequence length. Training signals,
    state size, data, and optimization still matter. Test controlled delayed-dependency tasks and real sequence
    conditions. Distinguish a learned retention pattern from a general external memory with exact lookup.
  bridges: []
- id: gated-recurrence.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.gated-recurrence
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: LSTMs and GRUs use learned gates to control state updates; these mechanisms can help long-range learning
    but do not provide unlimited or perfect memory.
