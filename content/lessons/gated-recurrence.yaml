schema_version: 0.2-draft
lesson:
  id: gated-recurrence
  version: 0.3.0-draft
  title: Choose what to keep, add, and reveal
  state: draft
  summary: Use learned numerical gates to decide how much of an old sequence state to keep and how much to
    replace.
  slot: M13.3
  category: learning
  sources:
  - title: Dive into Deep Learning — LSTM
    url: https://d2l.ai/chapter_recurrent-modern/lstm.html
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.gated-recurrence
  version: 1-draft
  statement: LSTMs and GRUs use learned gates to control state updates; these mechanisms can help long-range
    learning but do not provide unlimited or perfect memory.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - gated-recurrence.base
  - gated-recurrence.transfer
  prerequisites:
  - anyOf:
    - objective.recurrent-networks
scenes:
- id: gated-recurrence.s1
  title: Use a numerical gate to control a contribution
  type: explanation
  depth: intuition
  objective_refs:
  - objective.gated-recurrence
  markdown: 'Think of a gate as a dimmer: 0 passes none of a contribution, 1 passes all, and 0.5 passes half.
    A learned gate commonly uses a **sigmoid**, which maps a score to a number between 0 and 1.


    The network calculates the gate from its input and state using learned parameters. The gate value can therefore
    change at each sequence position without a person setting it or the model being retrained.'
  text_mode: 'Think of a gate as a dimmer: 0 passes none of a contribution, 1 passes all, and 0.5 passes half.
    A learned gate commonly uses a **sigmoid**, which maps a score to a number between 0 and 1.


    The network calculates the gate from its input and state using learned parameters. The gate value can therefore
    change at each sequence position without a person setting it or the model being retrained.'
  bridges: []
- id: gated-recurrence.s2
  title: Calculate an LSTM cell update
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.gated-recurrence
  markdown: '**LSTM** stands for **long short-term memory**. Its cell carries a state, written c. A common
    update keeps part of the old state and adds part of a proposed new value: c_new = f × c_old + i × candidate.
    The **forget gate** f scales what remains; the **input gate** i scales what is added.


    For f = 0.8, c_old = 2, i = 0.5, and candidate = 1, retain 0.8 × 2 = 1.6 and add 0.5 × 1 = 0.5. The new
    cell state is 2.1. An **output gate** then controls how the cell contributes to the exposed hidden state
    under the LSTM’s output rule.'
  text_mode: '**LSTM** stands for **long short-term memory**. Its cell carries a state, written c. A common
    update keeps part of the old state and adds part of a proposed new value: c_new = f × c_old + i × candidate.
    The **forget gate** f scales what remains; the **input gate** i scales what is added.


    For f = 0.8, c_old = 2, i = 0.5, and candidate = 1, retain 0.8 × 2 = 1.6 and add 0.5 × 1 = 0.5. The new
    cell state is 2.1. An **output gate** then controls how the cell contributes to the exposed hidden state
    under the LSTM’s output rule.'
  bridges:
  - algebra-notation
- id: gated-recurrence.s3
  title: Compare a gated recurrent unit
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.gated-recurrence
  markdown: 'A **gated recurrent unit (GRU)** uses a hidden state without the same separate cell-state structure
    as an LSTM. Its **update gate** mixes the old and proposed state; its **reset gate** affects how the old
    state contributes to the proposal.


    Some formulas reverse which side is multiplied by the update-gate value, so compare the actual rules. Both
    GRUs and LSTMs create paths that can retain information more directly than a simple recurrence, helping
    with some gradient-flow problems.'
  text_mode: 'A **gated recurrent unit (GRU)** uses a hidden state without the same separate cell-state structure
    as an LSTM. Its **update gate** mixes the old and proposed state; its **reset gate** affects how the old
    state contributes to the proposal.


    Some formulas reverse which side is multiplied by the update-gate value, so compare the actual rules. Both
    GRUs and LSTMs create paths that can retain information more directly than a simple recurrence, helping
    with some gradient-flow problems.'
  bridges: []
- id: gated-recurrence.s4
  title: Evaluate memory as a capability
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.gated-recurrence
  markdown: Gating does not guarantee remembering every relevant event across any sequence length. Training
    signals, state size, data, and optimization still matter. Test controlled delayed-dependency tasks and
    real sequence conditions. Distinguish a learned retention pattern from a general external memory with exact
    lookup.
  text_mode: Gating does not guarantee remembering every relevant event across any sequence length. Training
    signals, state size, data, and optimization still matter. Test controlled delayed-dependency tasks and
    real sequence conditions. Distinguish a learned retention pattern from a general external memory with exact
    lookup.
  bridges: []
- id: gated-recurrence.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.gated-recurrence
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Gates control how much information is kept, added, and exposed at each step. They can help a sequence
    model retain useful information, but memory still depends on training and the task.
