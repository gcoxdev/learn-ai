lesson:
  id: gated-recurrence
  version: 0.4.0-draft
  title: Choose what to keep, add, and reveal
  state: draft
  summary: The festival started at 7 a.m. Can the model still remember it at 2 p.m.? Compute an LSTM step by hand and see how gates rescue the fading gradient.
  slot: M13.3
  category: learning
  sources:
