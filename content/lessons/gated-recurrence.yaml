objectives:
  - id: objective.gated-recurrence
    version: 2-draft
    statement: LSTMs and GRUs use learned gates to control state updates; these mechanisms can help long-range learning but do not provide unlimited or perfect memory.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - gated-recurrence.base.v2
      - gated-recurrence.transfer.v2
      - gated-recurrence.calc.v2
    prerequisites:
      - anyOf:
          - objective.recurrent-networks
scenes:
  - id: gated-recurrence.s1
    title: A dimmer switch the network sets itself
    type: explanation
    depth: intuition
    objective_refs:
      - objective.gated-recurrence
    markdown: |-
      On festival Saturday, the street outside Pebble Café fills up at 7 a.m. and stays busy until closing. A model that notices at 7 a.m. should still expect crowds at 2 p.m. The plain RNN from the last lesson struggles with that: its state shrinks at every step, and the gradient linking 2 p.m. back to 7 a.m. shrinks even faster.

      The fix is to let the network decide, at each step, how much of its memory to keep. It does this with a **gate**: a number between 0 and 1 that multiplies another quantity, like a dimmer switch. A gate of 0 blocks the quantity, 1 passes it untouched, and 0.5 passes half.

      The gate's value comes from a **sigmoid**, $\sigma(z) = 1 / (1 + e^{-z})$, which squeezes any score into the range 0 to 1: $\sigma(-1) \approx 0.269$, $\sigma(0) = 0.5$, $\sigma(2) \approx 0.881$. The score itself is computed like an RNN update, from the previous state and the new input with learned weights. So a person never sets the gate; the network sets a fresh value at every step, from what it's reading right now. On an ordinary 11 a.m. hour of festival day it can learn to hold the "crowds" memory open; at the next morning's first hour, it can learn to clear it.
    bridges: []
  - id: gated-recurrence.s2
    title: One LSTM step, computed by hand
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.gated-recurrence
    markdown: |-
      The **long short-term memory (LSTM)**, published by Sepp Hochreiter and Jürgen Schmidhuber in 1997, adds a second state called the **cell**, $c_t$, a memory lane that gates read from and write to. The forget gate was added in 2000 by Gers, Schmidhuber, and Cummins, and today's standard LSTM includes it. Each step computes three gates and one candidate from $h_{t-1}$ and $x_t$:

      | Piece | Formula | Job |
      | --- | --- | --- |
      | Forget gate | $f_t = \sigma(\text{score}_f)$ | How much old cell to keep |
      | Input gate | $i_t = \sigma(\text{score}_i)$ | How much new content to write |
      | Candidate | $\tilde{c}_t = \tanh(\text{score}_c)$ | The new content itself |
      | Output gate | $o_t = \sigma(\text{score}_o)$ | How much of the cell to reveal |

      Each score is $W[h_{t-1}, x_t] + b$, where $[h_{t-1}, x_t]$ means the old state and the new input stacked into one list. Each piece has its own $W$ and $b$, just like the RNN update. Then:

      $$c_t = f_t\, c_{t-1} + i_t\, \tilde{c}_t \qquad h_t = o_t \tanh(c_t)$$

      Take festival Saturday at 11 a.m. The cell holds $c_{t-1} = 2.0$ ("festival, expect crowds"), and an ordinary hour produces the scores forget 2.0, input −1.0, candidate 0.5, output 1.0.

      ```python run
      import numpy as np

      def sigmoid(z):
          return 1 / (1 + np.exp(-z))

      c_prev = 2.0                                  # cell: "festival day, expect crowds"
      scores = {"forget": 2.0, "input": -1.0, "candidate": 0.5, "output": 1.0}

      f = sigmoid(scores["forget"])                 # how much old memory to keep
      i = sigmoid(scores["input"])                  # how much new content to write
      g = np.tanh(scores["candidate"])              # the new content itself
      o = sigmoid(scores["output"])                 # how much of the cell to reveal
      c = f * c_prev + i * g
      h = o * np.tanh(c)
      print(f"f = {f:.3f}  i = {i:.3f}  candidate = {g:.3f}  o = {o:.3f}")
      print(f"c = {f:.3f} x {c_prev} + {i:.3f} x {g:.3f} = {c:.3f}")
      print(f"h = {o:.3f} x tanh({c:.3f}) = {h:.3f}")

      # Along the cell path, each step back multiplies the gradient by f.
      for keep in (0.5, 0.881, 0.99):
          print(f"forget gate {keep}: gradient after 24 steps = {keep**24:.3g}")
      ```

      The cell keeps $0.881 \times 2.0 = 1.762$, writes $0.269 \times 0.462 = 0.124$, and ends at $1.886$: the festival memory survives an ordinary hour almost intact. The output gate then reveals $0.731 \times \tanh(1.886) = 0.698$ as the hidden state.

      :::predict At 7 a.m. the next day, the forget score is −2.0 instead of 2.0, and everything else is the same. What is the new cell value?
      $f = \sigma(-2) \approx 0.119$, so the cell keeps only $0.119 \times 2.0 = 0.238$, plus the same $0.124$ written: $c \approx 0.363$. Yesterday's festival is mostly wiped. One learned gate, two different decisions, same weights.
      :::
    bridges:
      - algebra-notation
    diagram:
      caption: An LSTM cell. Gates computed from the inputs decide what the cell keeps, writes, and reveals.
      description: The inputs, the previous hidden state and the new input, feed four pieces - the forget gate, the input gate with its candidate, and the output gate. The old cell flows to the new cell, scaled by the forget gate. The input gate times the candidate is added to the new cell. The new cell passes through tanh and is scaled by the output gate to give the new hidden state.
      nodes:
        - id: cprev
          label: Old cell c(t−1)
          col: 0
          row: 0
          tone: muted
        - id: cnew
          label: New cell c(t)
          note: f·c(t−1) + i·candidate
          col: 3
          row: 0
          tone: accent
        - id: hout
          label: New hidden state h(t)
          note: o · tanh(c(t))
          col: 5
          row: 0
          tone: accent
        - id: fgate
          label: Forget gate f
          note: keep how much?
          col: 1
          row: 2
          tone: warn
        - id: igate
          label: Input gate × candidate
          note: write what, how much?
          col: 3
          row: 2
          tone: warn
        - id: ogate
          label: Output gate o
          note: reveal how much?
          col: 5
          row: 2
          tone: warn
        - id: inputs
          label: h(t−1) and x(t)
          col: 3
          row: 4
          tone: data
      edges:
        - from: cprev
          to: cnew
          label: × f
        - from: fgate
          to: cnew
          label: scales the old cell
        - from: igate
          to: cnew
          label: added
        - from: cnew
          to: hout
          label: tanh
        - from: ogate
          to: hout
          label: × o
        - from: inputs
          to: fgate
        - from: inputs
          to: igate
        - from: inputs
          to: ogate
  - id: gated-recurrence.s3
    title: Why the gradient survives the cell
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.gated-recurrence
    markdown: |-
      In the plain RNN, each step back multiplied the gradient by $W_h(1 - h_t^2)$, and a surprise followed by 23 ordinary hours left about $10^{-7}$. Along the LSTM's cell, $c_t = f_t\,c_{t-1} + \ldots$, so the direct path back one step multiplies by just $f_t$. The last lines of the program show what that buys:

      | Forget gate held at | Gradient left after 24 steps |
      | ---: | ---: |
      | 0.5 | about $6 \times 10^{-8}$ |
      | 0.881 | 0.048 |
      | 0.99 | 0.786 |

      A plain RNN can't choose its factor; it falls out of the weights and the squashing. The LSTM *learns* to hold $f$ near 1 on the steps where a memory matters, so the error signal from 2 p.m. still reaches 7 a.m. Hochreiter and Schmidhuber called this uninterrupted path the "constant error carousel." It's the same idea as the residual connections of module 11: the new cell is the old cell, scaled by $f$, *plus* an update, so the gradient has a direct road back.

      :::mixup "An LSTM remembers everything, forever."
      It remembers what training taught its gates to keep, in a cell of fixed size, say 128 numbers. A forget gate of 0.99 still loses about a fifth of the signal over 24 steps, and much more over thousands. If you need exact recall of a fact from 5,000 steps ago, such as a customer's order number, store it somewhere you can look it up. To check what a trained LSTM keeps, test it: plant an event, wait a controlled number of steps, and see whether its prediction still reflects it.
      :::
    bridges: []
  - id: gated-recurrence.s4
    title: The GRU, a leaner cousin
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.gated-recurrence
    markdown: |-
      In 2014, Kyunghyun Cho and colleagues introduced the **gated recurrent unit (GRU)** in the same paper that proposed the RNN encoder–decoder, the subject of the next lesson. It drops the separate cell and uses two gates:

      - The **update gate** $z_t$ decides how much of the old state to keep.
      - The **reset gate** $r_t$ decides how much of the old state to use when proposing a new one.

      $$\tilde{h}_t = \tanh\big(W x_t + U (r_t \odot h_{t-1}) + b\big) \qquad h_t = z_t\, h_{t-1} + (1 - z_t)\, \tilde{h}_t$$

      Here $\odot$ means multiply entry by entry. With $z = 0.9$, $h_{t-1} = 0.8$, and a proposal $\tilde{h} = -0.5$, the new state is $0.9 \times 0.8 + 0.1 \times (-0.5) = 0.72 - 0.05 = 0.67$. The update gate works like a forget gate and an input gate tied together: whatever fraction you keep, you write the rest. Some textbooks swap the roles of $z$ and $1 - z$, so check which convention a formula uses before you compute.

      How do you choose? A GRU has three weight blocks to an LSTM's four, so about a quarter fewer parameters for the same state size. Chung and colleagues (2014) compared them on music and speech-signal modeling: both gated units clearly beat the plain tanh RNN, and neither won consistently. In practice, treat the choice like any other setting. Ana would backtest both on her café data, and keep the smaller GRU unless the LSTM beats it on the held-out days.
    bridges: []
  - id: gated-recurrence.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.gated-recurrence
    markdown: A few cell updates to compute, plus a heart monitor, a support chatbot, and a model comparison, test whether you can read what each gate is doing.
    takeaway: |-
      An LSTM's gates decide how much old memory to keep, how much new content to write, and how much to reveal. Holding the forget gate near 1 lets both memory and gradient survive many steps.
  - id: gated-recurrence.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.gated-recurrence
    markdown: |-
      Gates control how much information is kept, added, and exposed at each step. They can help a sequence model retain useful information, but memory still depends on training and the task.
