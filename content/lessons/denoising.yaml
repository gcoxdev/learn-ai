    value and noise created the example. A fresh generation request has no such hidden target image waiting
    to be uncovered.'
  figure:
    kind: image-noise
    caption: A clean image and an explicitly corrupted version make the training-pair idea visible.
    description: Add a repeatable bounded disturbance to a six-by-six grayscale image. Inspect a pixel’s clean
      value, disturbance, and clipped displayed value. This demonstrates constructing a corrupted input; it
      is not a learned reverse-diffusion sampler.
  bridges:
  - random-variables
- id: denoising.s3
  type: explanation
  depth: intuition
  objective_refs:
  - objective.denoising
  text_mode: 'At inference, a sampling procedure starts from noise and uses model predictions over several
    steps to form a sample. The selected solver or sampler defines how the state changes.


    The interactive illustration below blends fixed arrays to make the direction visible. It is a teaching
    illustration, not an actual trained diffusion model.'
  title: Generate using repeated model computations
  markdown: 'At inference, a sampling procedure starts from noise and uses model predictions over several steps
    to form a sample. The selected solver or sampler defines how the state changes.


    The interactive illustration below blends fixed arrays to make the direction visible. It is a teaching
    illustration, not an actual trained diffusion model.'
  simulation: denoising
- id: denoising.s4
  type: explanation
  depth: intuition
  objective_refs:
  - objective.denoising
  text_mode: 'A text-conditioned generator encodes the prompt and supplies that representation to a model through
    a specified conditioning mechanism. The prompt influences the sample; it is not simply a photograph hidden
    inside the starting noise.


    Different architectures can use different denoisers. A U-Net and a transformer denoiser are alternatives;
    neither defines every diffusion system.'
  title: Where does the prompt enter?
  markdown: 'A text-conditioned generator encodes the prompt and supplies that representation to a model through
    a specified conditioning mechanism. The prompt influences the sample; it is not simply a photograph hidden
    inside the starting noise.


    Different architectures can use different denoisers. A U-Net and a transformer denoiser are alternatives;
    neither defines every diffusion system.'
- id: denoising.s5
  type: explanation
  depth: intuition
  objective_refs:
  - objective.denoising
  text_mode: 'The **training loop** creates noisy examples, predicts a target, measures loss, and updates trainable
    weights.


    The **sampling loop** uses the trained model to update a developing sample. Its changing values are the
    sample itself; the model''s weights ordinarily stay fixed.


    Keeping these loops separate explains why training starts with known images while a fresh text-to-image
    request can start with noise.'
  title: Two loops, different jobs
  markdown: 'The **training loop** creates noisy examples, predicts a target, measures loss, and updates trainable
    weights.


    The **sampling loop** uses the trained model to update a developing sample. Its changing values are the
    sample itself; the model''s weights ordinarily stay fixed.


    Keeping these loops separate explains why training starts with known images while a fresh text-to-image
    request can start with noise.'
- id: denoising.extension-schedule-score
  title: Noise schedules and the score
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.denoising
  markdown: 'A **noise schedule** controls the mixture of signal and noise at each training time. A common
    form is x_t = a_t x_clean + b_t ε. Here t names the time or noise level, a_t and b_t are chosen multipliers,
    and ε is a draw from a standard Gaussian distribution. The network receives both the noisy state and time
    so it knows which noise level to handle.


    The **score** is the gradient of log density with respect to the noisy input. It points toward a local
    increase in density; it is not a human rating of image quality. The derivatives and integrals side lessons
    explain the calculus behind this quantity.


    Under specified Gaussian corruption, noise prediction and score estimation are related by a known scale
    and sign. Clean-sample, noise, and velocity targets are other related parameterizations, with conversions
    determined by the recipe. Choosing the training target and schedule is separate from choosing the network
    architecture or inference solver.'
  text_mode: 'A **noise schedule** controls the mixture of signal and noise at each training time. A common
