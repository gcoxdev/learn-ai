assessment_families:
  - id: denoising.base
    objective_ref: objective.denoising
    task: base
    response_type: single_choice
    points: 1
    hint: A diffusion-style image generator learns a denoising-related task and uses a chosen sampling procedure to turn noise into a structured sample, often conditioned on text.
    variants:
      - id: denoising.base.1
        prompt: What is the sampling loop changing during image generation?
        options:
          - id: correct
            text: The current sample according to model predictions and a sampling rule.
          - id: a
            text: Necessarily all network weights at each step.
          - id: b
            text: The historical training dataset itself.
        answer: correct
        feedback: The current sample according to model predictions and a sampling rule.
        retired: true
      - id: denoising.base.2
        prompt: What can a grayscale image be represented as?
        options:
          - id: a
            text: Only a sentence.
          - id: b
            text: A single fixed class label with no spatial arrangement.
          - id: correct
            text: An array of brightness values.
        answer: correct
        feedback: An array of brightness values.
        retired: true
  - id: denoising.transfer
    objective_ref: objective.denoising
    task: transfer
    response_type: single_choice
    points: 1
    hint: A diffusion-style image generator learns a denoising-related task and uses a chosen sampling procedure to turn noise into a structured sample, often conditioned on text.
    variants:
      - id: denoising.transfer.1
        prompt: Does every diffusion generator need a U-Net denoiser?
        options:
          - id: a
            text: Yes. U-Net is the definition of diffusion.
          - id: b
            text: Yes. A transformer cannot process image representations.
          - id: correct
            text: No. Other denoiser architectures, including transformers, can be used.
        answer: correct
        feedback: No. Other denoiser architectures, including transformers, can be used.
        retired: true
      - id: denoising.transfer.2
        prompt: Why is a toy blend from noise to a fixed image not proof of a working diffusion model?
        options:
          - id: b
            text: Because a diffusion model cannot start from noise.
          - id: correct
            text: It has no learned denoiser or actual model-based sampling mechanism.
          - id: a
            text: Because all image generation is impossible.
        answer: correct
        feedback: It has no learned denoiser or actual model-based sampling mechanism.
        retired: true
  - id: denoising.base.v2
    objective_ref: objective.denoising
    task: base
    response_type: single_choice
    points: 1
    hint: Separate the loops. Training makes a noisy copy of a real image and scores the noise guess; sampling starts from pure noise and changes the image, never the weights.
    remediation_scene: denoising.s5
    variants:
      - id: denoising.base.v2.1
        prompt: During sampling, what changes from one step to the next?
        options:
          - id: b
            text: The denoiser's weights, nudged toward the prompt
          - id: a
            text: The image, as predicted noise is removed
          - id: c
            text: The noise schedule, which is re-learned each step
        answer: a
        feedback: Sampling updates the image with the frozen network's noise predictions. Weights change only during training, and the schedule is fixed in advance.
      - id: denoising.base.v2.2
        prompt: In one training step, what does the loss compare?
        options:
          - id: c
            text: The noisy image and the clean image
          - id: b
            text: The generated image and the prompt
          - id: a
            text: The added noise and the predicted noise
        answer: a
        feedback: The loss is ‖ε − ε̂‖², the drawn noise against the network's guess. The training program knows ε because it made the noisy image itself.
      - id: denoising.base.v2.3
        prompt: Why does DDPM shrink the clean signal by √ᾱ as it adds noise?
        options:
          - id: a
            text: So the spread stays constant and the final level is pure standard noise
          - id: b
            text: So the pixel values stay between 0 and 1 at every noise level
          - id: c
            text: So the network can undo each step by multiplying by √ᾱ
        answer: a
        feedback: Because ᾱ + (1 − ᾱ) = 1, the variance never grows, and as ᾱ → 0 the image becomes indistinguishable from fresh standard noise, which is where sampling starts. Values can go below 0 or above 1, and undoing a step needs the noise guess.
      - id: denoising.base.v2.4
        prompt: A noise level has √ᾱ = 0.8 and √(1 − ᾱ) = 0.6. The noisy pixel is 0.4 and the network predicts ε̂ = −0.3. What is its guess for the clean pixel?
        options:
          - id: b
            text: '0.58, from 0.4 + 0.18 without dividing'
          - id: c
            text: '0.275, from (0.4 − 0.18) / 0.8'
          - id: a
            text: '0.725, from (0.4 + 0.18) / 0.8'
        answer: a
        feedback: x̂₀ = (x_t − √(1 − ᾱ)·ε̂)/√ᾱ = (0.4 − 0.6 × (−0.3))/0.8 = 0.58/0.8 = 0.725. Forgetting the minus sign on ε̂ gives 0.275, and forgetting to divide by √ᾱ leaves 0.58.
  - id: denoising.transfer.v2
    objective_ref: objective.denoising
    task: transfer
    response_type: single_choice
    points: 1
    hint: Map the new situation onto the two loops, then ask which piece (noise level, network input, number of steps) the problem is really about.
    remediation_scene: denoising.s4
    variants:
      - id: denoising.transfer.v2.1
        prompt: A team adapts diffusion to generate 1-second audio clips as arrays of 16,000 samples. What stays the same as for images?
        options:
          - id: c
            text: The U-Net, since diffusion needs a two-dimensional grid
          - id: a
            text: Mixing clean clips with noise and training a network to predict it
          - id: b
            text: The noise schedule, since images and audio share one scale
        answer: a
        feedback: The recipe of adding noise and predicting it works on any array of numbers. The network and schedule are design choices you'd retune for audio.
      - id: denoising.transfer.v2.2
        prompt: A product team finds that a 1,000-step diffusion sampler takes 40 seconds per image. Where is most of the time going?
        options:
          - id: a
            text: Running the denoiser once for every one of the 1,000 steps
          - id: b
            text: Drawing the 1,000 fresh noise values between steps
          - id: c
            text: Updating the weights after each of the 1,000 steps
        answer: a
        feedback: Each step is a full network pass, so cost scales with the step count. Drawing random numbers is cheap, and sampling never updates weights.
      - id: denoising.transfer.v2.3
        prompt: A text-to-image model's pictures look good but ignore the prompt. Which part of the design would you check first?
        options:
          - id: b
            text: The noise schedule, since it sets how much of the prompt survives
          - id: c
            text: The starting noise, since the prompt is encoded inside it
          - id: a
            text: How the prompt encoding reaches the denoiser at each step
        answer: a
        feedback: The prompt steers generation only through the denoiser's extra input, ε_θ(x_t, t, text). The schedule controls noise levels, and the prompt was never inside the starting noise.
      - id: denoising.transfer.v2.4
        prompt: A photo app uses a trained diffusion denoiser to clean up grainy night shots. Why can the same network help here?
        options:
          - id: c
            text: It memorized clean versions of the user's photos during training
          - id: a
            text: It learned to predict noise at many levels, so it can remove real grain too
          - id: b
            text: It adds noise first, which cancels out the grain in the photo
        answer: a
        feedback: A denoiser trained across noise levels has learned what images look like beneath noise. It hasn't seen the user's photos, and adding noise doesn't cancel grain.
  - id: denoising.calculate
    objective_ref: objective.denoising
    task: base
    response_type: numeric
    points: 1
    hint: "x_t = √ᾱ·x₀ + √(1 − ᾱ)·ε, and ᾱ_t is the product of (1 − β) over the steps so far. Take square roots of ᾱ and of 1 − ᾱ, not of the pixel."
    remediation_scene: denoising.s2
    absolute_tolerance: 0.01
    variants:
      - id: denoising.calculate.1
        prompt: 'With ᾱ = 0.64, a clean pixel x₀ = 0.5 and noise draw ε = 1.0, what is the noisy pixel x_t?'
        answer: 1
        feedback: √0.64 = 0.8 and √0.36 = 0.6, so x_t = 0.8 × 0.5 + 0.6 × 1.0 = 0.4 + 0.6 = 1.0.
      - id: denoising.calculate.2
        prompt: 'With ᾱ = 0.36, a clean pixel x₀ = 1.0 and noise draw ε = −0.5, what is x_t?'
        answer: 0.2
        feedback: √0.36 = 0.6 and √0.64 = 0.8, so x_t = 0.6 × 1.0 + 0.8 × (−0.5) = 0.6 − 0.4 = 0.2.
      - id: denoising.calculate.3
        prompt: 'A schedule has β₁ = 0.1 and β₂ = 0.2. What is ᾱ₂?'
        answer: 0.72
        feedback: ᾱ₂ = (1 − 0.1) × (1 − 0.2) = 0.9 × 0.8 = 0.72. Adding the betas (0.3) or subtracting their sum from 1 (0.7) are the usual slips.
      - id: denoising.calculate.4
        prompt: 'With ᾱ = 0.25, what is the noise multiplier √(1 − ᾱ)?'
        answer: 0.866
        feedback: √(1 − 0.25) = √0.75 ≈ 0.866. The signal multiplier is √0.25 = 0.5, and 0.5² + 0.866² = 1.
      - id: denoising.calculate.5
        prompt: 'The true noise was ε = 0.5 and the network predicted ε̂ = 0.2. What is the squared-error loss?'
        answer: 0.09
        feedback: (0.5 − 0.2)² = 0.3² = 0.09.
