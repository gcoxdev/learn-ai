lesson:
  id: denoising
  version: 0.1.0-draft
  title: How an image can emerge from noise
  state: draft
  summary: A diffusion-style image generator learns a denoising-related task and uses a chosen sampling procedure
    to turn noise into a structured sample, often conditioned on text.
  slot: M22.6
  category: destination
  minutes: 12
  sources:
  - title: Denoising Diffusion Probabilistic Models
    url: https://arxiv.org/abs/2006.11239
  - title: Scalable Diffusion Models with Transformers
    url: https://arxiv.org/abs/2212.09748
  - title: Score-Based Generative Modeling through SDEs
    url: https://arxiv.org/abs/2011.13456
