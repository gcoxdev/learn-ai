schema_version: 0.2-draft
lesson:
  id: denoising
  version: 0.4.0-draft
  title: How an image can emerge from noise
  state: draft
  summary: Add static to a photo a thousand times and it becomes pure snow. Teach a network to undo one step, and it can turn fresh snow into a picture nobody took.
  slot: M22.6
  category: destination
  sources:
    - title: Denoising Diffusion Probabilistic Models (Ho, Jain & Abbeel, 2020)
      url: https://arxiv.org/abs/2006.11239
    - title: Deep Unsupervised Learning using Nonequilibrium Thermodynamics (Sohl-Dickstein et al., 2015)
      url: https://arxiv.org/abs/1503.03585
    - title: Score-Based Generative Modeling through Stochastic Differential Equations (Song et al., 2020)
      url: https://arxiv.org/abs/2011.13456
    - title: Scalable Diffusion Models with Transformers (Peebles & Xie, 2022)
      url: https://arxiv.org/abs/2212.09748
    - title: "U-Net: Convolutional Networks for Biomedical Image Segmentation (Ronneberger, Fischer & Brox, 2015)"
      url: https://arxiv.org/abs/1505.04597
objectives:
  - id: objective.denoising
    version: 2-draft
    statement: A diffusion-style image generator learns a denoising-related task and uses a chosen sampling procedure to turn noise into a structured sample, often conditioned on text.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - denoising.base.v2
      - denoising.transfer.v2
      - denoising.calculate
    prerequisites:
      - anyOf:
          - objective.backpropagation
      - anyOf:
          - objective.data
scenes:
  - id: denoising.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.denoising
    title: Run the film backwards
    markdown: |-
      Take a photo of a lighthouse and sprinkle a little static over it. Then a little more. After a thousand rounds, the lighthouse is gone: you're looking at pure TV snow. Destroying the picture was easy. Now imagine a film of those thousand frames, run backwards: snow slowly clears into a lighthouse. A **diffusion model** learns to run that film backwards, one frame at a time. Start it from brand-new snow and a brand-new picture appears.

      To a computer, a grayscale image is a grid of brightness values between 0 (black) and 1 (white); a color image has three such grids, for red, green, and blue. Everything in this lesson happens to each value in the grid at once, so we can follow a single pixel with brightness 0.8.

      :::story From physics to photographs
      Sohl-Dickstein and colleagues introduced diffusion models in 2015, borrowing the idea from the physics of ink spreading through water. In 2020, Ho, Jain, and Abbeel's **DDPM** (denoising diffusion probabilistic models) simplified training to "predict the noise" and rivaled the best GANs. By 2022, diffusion powered DALL·E 2, Imagen, and Stable Diffusion.
      :::
  - id: denoising.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.denoising
    title: Make a training problem by adding noise
    markdown: |-
      Training pairs are free to make. Take a clean image and draw random **noise** $\varepsilon$ (epsilon): one number per pixel from the standard bell curve, with mean 0 and standard deviation 1. DDPM mixes them like this:

      $$x_t = \sqrt{\bar\alpha_t}\; x_0 + \sqrt{1 - \bar\alpha_t}\; \varepsilon$$

      Here $x_0$ is the clean pixel, $x_t$ the noisy one, and $\bar\alpha_t$ (alpha-bar) a number between 0 and 1 that says how much signal survives at noise level $t$. Say $\bar\alpha_t = 0.64$, so the signal multiplier is $\sqrt{0.64} = 0.8$ and the noise multiplier is $\sqrt{0.36} = 0.6$. With $x_0 = 0.8$ and a draw $\varepsilon = -0.4$:

      $$x_t = 0.8 \times 0.8 + 0.6 \times (-0.4) = 0.64 - 0.24 = 0.40$$

      Notice the signal is *shrunk* as noise is added. Because $0.8^2 + 0.6^2 = 1$, the blend never inflates the spread of the values (for data scaled to spread 1, it stays exactly 1). As $\bar\alpha_t$ falls toward 0, nothing is left but a standard bell curve.

      The explorer below uses a simpler recipe: it adds a fixed pattern of disturbances scaled by the noise amount, without shrinking the image, and clips to the range 0 to 1. At the defaults, pixel 15 (row 3, column 3) shows $0.2 + 0.4 \times (-0.16) = 0.136$. Slide the amount to 1 and the dark disk dissolves, while the clean reference never changes: the training program always knows both halves of the pair.
    figure:
      kind: image-noise
      caption: A clean image and an explicitly corrupted version make the training-pair idea visible.
      description: Add a repeatable bounded disturbance to a six-by-six grayscale image. Inspect a pixel’s clean value, disturbance, and clipped displayed value. This demonstrates constructing a corrupted input; it is not a learned reverse-diffusion sampler.
    bridges:
      - random-variables
  - id: denoising.schedule
    title: A thousand small steps, one shortcut
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.denoising
    markdown: |-
      Where does $\bar\alpha_t$ come from? The **forward process** adds noise in small steps. At step $t$ it keeps a fraction $\alpha_t = 1 - \beta_t$ of the variance and adds fresh noise with variance $\beta_t$. The list of $\beta$ values is the **noise schedule**. Surviving signal multiplies up:

      $$\bar\alpha_t = \alpha_1 \times \alpha_2 \times \cdots \times \alpha_t$$

      With a tiny schedule $\beta = 0.2, 0.2, 0.5$: $\bar\alpha_1 = 0.8$, $\bar\alpha_2 = 0.8 \times 0.8 = 0.64$ (our example above), and $\bar\alpha_3 = 0.64 \times 0.5 = 0.32$.

      :::papers The closed-form forward process (Ho et al., 2020)
      $$q(x_t \mid x_0) = \mathcal{N}\!\big(\sqrt{\bar\alpha_t}\,x_0,\; (1 - \bar\alpha_t)\,I\big) \quad\Longleftrightarrow\quad x_t = \sqrt{\bar\alpha_t}\,x_0 + \sqrt{1 - \bar\alpha_t}\,\varepsilon$$

      You never have to add noise step by step: jump straight to any level $t$ with one draw of $\varepsilon$. DDPM used $T = 1{,}000$ steps with $\beta$ rising linearly from 0.0001 to 0.02.
      :::

      ```python run
      import numpy as np

      x0, eps = 0.8, -0.4                 # one clean pixel and one fixed noise draw

      # A tiny schedule: beta is the fresh noise added at each step
      betas = np.array([0.2, 0.2, 0.5])
      alpha_bar = np.cumprod(1 - betas)   # 0.8, 0.64, 0.32
      for t, ab in enumerate(alpha_bar, start=1):
          xt = np.sqrt(ab) * x0 + np.sqrt(1 - ab) * eps
          print(f"t={t}: alpha_bar={ab:.3f}  signal={np.sqrt(ab):.3f}  "
                f"noise={np.sqrt(1 - ab):.3f}  x_t={xt:.3f}")

      # DDPM's schedule: 1,000 steps, beta rising linearly from 0.0001 to 0.02
      betas = np.linspace(1e-4, 0.02, 1000)
      alpha_bar = np.cumprod(1 - betas)
      print("\nDDPM schedule")
      for t in [1, 100, 250, 500, 1000]:
          ab = alpha_bar[t - 1]
          xt = np.sqrt(ab) * x0 + np.sqrt(1 - ab) * eps
          print(f"t={t:4}: signal={np.sqrt(ab):.3f}  noise={np.sqrt(1 - ab):.3f}  x_t={xt:.3f}")
      ```

      :::predict In DDPM's schedule, how much of the original pixel survives at t = 1,000?
      The signal multiplier is 0.006, so the pixel contributes $0.006 \times 0.8 \approx 0.005$, and $x_{1000} = -0.395$ is almost exactly the noise draw. That's the point: the last step is indistinguishable from fresh noise, so generation can start from fresh noise.
      :::
  - id: denoising.loss
    title: "The network's only job: guess the noise"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.denoising
    markdown: |-
      The **denoiser** is a neural network $\varepsilon_\theta(x_t, t)$ that sees a noisy image and its noise level $t$ and predicts the noise that was added. One training step:

      1. Pick a training image $x_0$, a random level $t$, and fresh noise $\varepsilon$.
      2. Make $x_t$ with the closed form.
      3. Predict $\hat\varepsilon = \varepsilon_\theta(x_t, t)$.
      4. Take the loss $\|\varepsilon - \hat\varepsilon\|^2$ and update the weights by backpropagation.

      For our pixel, the true noise was $-0.4$. If the network predicts $\hat\varepsilon = -0.3$, the loss is $(-0.4 + 0.3)^2 = 0.01$. A noise guess also gives a clean-image guess, by solving the forward formula for $x_0$:

      $$\hat{x}_0 = \frac{x_t - \sqrt{1 - \bar\alpha_t}\,\hat\varepsilon}{\sqrt{\bar\alpha_t}} = \frac{0.40 - 0.6 \times (-0.3)}{0.8} = 0.725$$

      That's close to the true 0.8. Predicting noise is the choice DDPM found worked best; some systems predict $x_0$ or a mix of the two instead, and the formula above converts between them.

      :::mixup "The denoiser uncovers the one real photo hidden in the noise."
      During training there is a real photo, because we made the noise. At generation time there isn't: the snow is fresh, and the denoiser's guesses steer it toward *some* image that looks like the training data.
      :::
  - id: denoising.s3
    type: explanation
    depth: intuition
    objective_refs:
      - objective.denoising
    title: From snow to picture, one step at a time
    markdown: |-
      To generate, start from pure noise $x_T$ and walk down the levels. At each step the denoiser predicts the noise, the sampler removes some of it, then adds back a little fresh noise so the image doesn't settle too early on one blurry average. DDPM took 1,000 such steps.

      :::papers One DDPM reverse step
      $$x_{t-1} = \frac{1}{\sqrt{\alpha_t}}\left(x_t - \frac{\beta_t}{\sqrt{1 - \bar\alpha_t}}\,\hat\varepsilon\right) + \sigma_t z$$

      From $x_2 = 0.40$ in the tiny schedule ($\alpha_2 = 0.8$, $\beta_2 = 0.2$) with $\hat\varepsilon = -0.3$: $(0.40 + \tfrac{0.2}{0.6} \times 0.3) / \sqrt{0.8} = 0.5 / 0.894 = 0.559$, then add fresh noise $\sigma_t z$ with a new random $z$. DDPM's simplest choice is $\sigma_t = \sqrt{\beta_t}$.
      :::

      The illustration below shows only the *direction* of that journey, with no network: each pixel slides in a straight line from a fixed noise value to a fixed landscape. At step $s$ of 10, a pixel shows $(1 - s/10) \times \text{noise} + (s/10) \times \text{picture}$. The top-left pixel starts at 0.29 and ends as sky at 0.67; at step 5 it's 0.48. A trained model finds a different picture for every new start. (This straight-line path returns in the flow matching lesson.)
    simulation: denoising
  - id: denoising.s4
    type: explanation
    depth: intuition
    objective_refs:
      - objective.denoising
    title: Where does the prompt enter?
    markdown: |-
      A text-to-image model gives the denoiser one more input, an encoding of the prompt: $\varepsilon_\theta(x_t, t, \text{text})$. Its noise guesses then steer toward images that match "a lighthouse at dusk". The prompt shapes every step's prediction; it isn't hiding in the starting noise.

      The network inside is a separate choice. DDPM used a **U-Net**, the segmentation network from module 12: it shrinks the image to see the big picture, then expands it back, with skip connections carrying fine detail across. DiT (Peebles & Xie, 2022) uses a transformer over image patches instead. The latent diffusion lesson shows how Stable Diffusion combines these pieces.
  - id: denoising.s5
    type: explanation
    depth: intuition
    objective_refs:
      - objective.denoising
    title: Two loops, different jobs
    markdown: |-
      Diffusion has two loops that are easy to confuse:

      | | Training loop | Sampling loop |
      | --- | --- | --- |
      | Starts from | A real image plus noise you drew | Pure noise |
      | Each pass | One random level $t$ | Every level from $T$ down to 1 |
      | Network output used for | The loss $\|\varepsilon - \hat\varepsilon\|^2$ | Removing noise from the image |
      | What changes | The weights | The image; weights stay frozen |

      A 1,000-step sampler runs the network 1,000 times per picture, which is why the flow matching lesson looks for ways to take fewer steps.
    diagram:
      caption: Training teaches the denoiser on real images; sampling reuses it, frozen, on fresh noise.
      description: In the training loop, a training image is mixed with drawn noise at a random level to make a noisy image. The denoiser predicts the noise, the loss compares it with the true noise, and the loss updates the denoiser's weights. The trained weights are copied to the sampling loop. There, sampling starts from pure noise; the frozen denoiser predicts the noise, a sampler step removes some of it and adds a little fresh noise, and the step repeats T times until an image emerges.
      nodes:
        - id: clean
          label: Training image x₀
          col: 0
          row: 0
          tone: data
        - id: noisy
          label: Noisy x_t
          note: √ᾱ·x₀ + √(1−ᾱ)·ε
          col: 1
          row: 0
        - id: den1
          label: Denoiser ε_θ(x_t, t)
          note: learning
          col: 2
          row: 0
          tone: accent
        - id: loss
          label: Loss ‖ε − ε̂‖²
          col: 3
          row: 0
          tone: warn
        - id: start
          label: Pure noise x_T
          col: 0
          row: 2
          tone: muted
        - id: den2
          label: Same denoiser
          note: weights frozen
          col: 1
          row: 2
          tone: accent
        - id: step
          label: Sampler step
          note: remove some noise, add a little
          col: 2
          row: 2
        - id: image
          label: New image
          note: after T steps
          col: 3
          row: 2
          tone: data
      edges:
        - from: clean
          to: noisy
        - from: noisy
          to: den1
        - from: den1
          to: loss
        - from: loss
          to: den1
          label: update weights
          dashed: true
          bend: 1
        - from: den1
          to: den2
          label: trained weights
          dashed: true
        - from: start
          to: den2
        - from: den2
          to: step
        - from: step
          to: den2
          label: repeat T times
          dashed: true
          bend: 2
        - from: step
          to: image
  - id: denoising.extension-schedule-score
    title: Predicting noise is predicting the score
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.denoising
    markdown: |-
      There's a second way to read the denoiser. The **score** of a distribution is the direction that makes an image more probable: the gradient of the log-density with respect to the pixels, $\nabla_x \log p(x_t)$. For Gaussian noise, the noise prediction and the score are the same arrow, rescaled and flipped:

      $$\nabla_{x}\log p(x_t) \approx -\frac{\hat\varepsilon}{\sqrt{1 - \bar\alpha_t}}$$

      With $\hat\varepsilon = -0.3$ and $\sqrt{1 - \bar\alpha_t} = 0.6$, the score is $+0.5$: brighten this pixel, pushing back against the negative noise the network thinks was added. Song and colleagues (2020) rebuilt diffusion around this view, treating noising as a continuous process and sampling by following the learned score.
    bridges:
      - random-variables
      - multivariable-calculus
  - id: denoising.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.denoising
    markdown: Noisy-pixel and schedule calculations, plus an audio denoiser, a slow sampler, and a model that won't follow prompts, test whether you can trace diffusion training and sampling.
    takeaway: |-
      Training mixes a clean image with noise, x_t = √ᾱ·x₀ + √(1−ᾱ)·ε, and teaches a network to predict the noise. Sampling starts from fresh noise and removes predicted noise step by step until a new image appears.
  - id: denoising.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.denoising
    markdown: |-
      Training teaches a model about noisy data. Sampling uses its predictions and a chosen update rule to turn noise into a structured sample.
navigation:
