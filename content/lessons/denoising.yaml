scenes:
- id: denoising.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.denoising
  text_mode: The complete explanation is available as readable text.
  title: An image is an array of values
  markdown: 'A digital image can be represented by an array of pixel values. Color channels describe quantities
    such as red, green, and blue. Some generators instead work in a compressed learned representation called a latent.


    For this introduction, imagine a small grayscale array: each cell is one brightness value.'
- id: denoising.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.denoising
  text_mode: The complete explanation is available as readable text.
  title: Make a training problem by adding noise
  markdown: 'A diffusion training setup can choose an image, a noise level, and random noise, then create a noisy
    example. The network learns a specified target related to the clean sample or noise.


    Predicting noise is one important parameterization. It is not the only valid objective. Data preparation, noise
    schedule and target definition are separate design choices.'
- id: denoising.s3
  type: explanation
  depth: intuition
  objective_refs:
  - objective.denoising
  text_mode: The complete explanation is available as readable text.
  title: Generate using repeated model computations
  markdown: 'At inference, a sampling procedure starts from noise and uses model predictions over several steps
    to form a sample. The selected solver or sampler defines how the state changes.


    The interactive illustration below blends fixed arrays to make the direction visible. It is a teaching illustration,
    not an actual trained diffusion model.'
  simulation: denoising
- id: denoising.s4
  type: explanation
  depth: intuition
  objective_refs:
  - objective.denoising
  text_mode: The complete explanation is available as readable text.
  title: Where does the prompt enter?
  markdown: 'A text-conditioned generator encodes the prompt and supplies that representation to a model through
    a specified conditioning mechanism. The prompt influences the sample; it is not simply a photograph hidden inside
    the starting noise.


    Different architectures can use different denoisers. A U-Net and a transformer denoiser are alternatives; neither
    defines every diffusion system.'
- id: denoising.s5
  type: explanation
  depth: intuition
  objective_refs:
  - objective.denoising
  text_mode: The complete explanation is available as readable text.
  title: Two loops, different jobs
  markdown: 'The **training loop** creates examples, predicts a target, measures loss, and updates trainable weights.
    The **sampling loop** updates the current sample using a trained model and a sampling rule.


    This path introduces that distinction. Compressed latent spaces, guidance, exact objectives, solvers and evaluation
    require deeper lessons before claiming full system understanding.'
- id: denoising.extension-schedule-score
  title: Noise schedules and the score
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.denoising
  markdown: 'A schedule controls the signal and noise mixture at each training time: a common form is x_t = a_t
    x_clean + b_t epsilon, with epsilon drawn from a standard Gaussian. The network receives the noisy state and
    time so it knows which noise regime to handle. Choosing a schedule is separate from selecting the architecture
    or inference solver.


    The score is the gradient of log density with respect to the noisy input: it points toward locally increasing
    density. Under specified Gaussian corruption, noise prediction and score estimation are related by a known scale
    and sign. Clean-sample, noise, and velocity targets are different parameterizations with recipe-specific conversions.
    None means that a network simply retrieves a hidden original image from arbitrary starting noise.'
  text_mode: 'A schedule controls the signal and noise mixture at each training time: a common form is x_t = a_t
