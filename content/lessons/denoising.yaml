scenes:
- id: denoising.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.denoising
  text_mode: 'A digital image can be represented by an array of pixel values. Color channels describe quantities
    such as red, green, and blue. Some generators instead work in a compressed learned representation called
    a latent.


    For this introduction, imagine a small grayscale array: each cell is one brightness value.'
  title: An image is an array of values
  markdown: 'A digital image can be represented by an array of pixel values. Color channels describe quantities
    such as red, green, and blue. Some generators instead work in a compressed learned representation called
    a latent.


    For this introduction, imagine a small grayscale array: each cell is one brightness value.'
- id: denoising.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.denoising
  text_mode: 'A diffusion training setup can choose an image, a noise level, and random noise, then create
    a noisy example. The network learns a specified target related to the clean sample or noise.


    Predicting noise is one important parameterization. It is not the only valid objective. Data preparation,
    noise schedule and target definition are separate design choices.


    For one toy value, let clean brightness be 0.8, signal multiplier 0.75, noise multiplier 0.5 and sampled
    noise −0.4. The noisy value is 0.75 × 0.8 + 0.5 × (−0.4) = 0.4. The training program knows which clean
    value and noise created the example. A fresh generation request has no such hidden target image waiting
    to be uncovered.'
  title: Make a training problem by adding noise
  markdown: 'A diffusion training setup can choose an image, a noise level, and random noise, then create a
    noisy example. The network learns a specified target related to the clean sample or noise.


    Predicting noise is one important parameterization. It is not the only valid objective. Data preparation,
