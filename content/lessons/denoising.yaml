assessment_families:
- id: denoising.base
  objective_ref: objective.denoising
  task: base
  response_type: single_choice
  points: 1
  hint: A diffusion-style image generator learns a denoising-related task and uses a chosen sampling procedure to
    turn noise into a structured sample, often conditioned on text.
  variants:
  - id: denoising.base.1
    prompt: What is the sampling loop changing during image generation?
    options:
    - id: correct
      text: The current sample according to model predictions and a sampling rule.
    - id: a
      text: Necessarily all network weights at each step.
    - id: b
      text: The historical training dataset itself.
    answer: correct
    feedback: The current sample according to model predictions and a sampling rule.
  - id: denoising.base.2
    prompt: What can a grayscale image be represented as?
    options:
    - id: a
      text: Only a sentence.
    - id: b
      text: A single fixed class label with no spatial arrangement.
    - id: correct
      text: An array of brightness values.
    answer: correct
    feedback: An array of brightness values.
- id: denoising.transfer
  objective_ref: objective.denoising
  task: transfer
  response_type: single_choice
  points: 1
  hint: A diffusion-style image generator learns a denoising-related task and uses a chosen sampling procedure to
    turn noise into a structured sample, often conditioned on text.
  variants:
  - id: denoising.transfer.1
    prompt: Does every diffusion generator need a U-Net denoiser?
    options:
    - id: a
      text: Yes. U-Net is the definition of diffusion.
    - id: b
      text: Yes. A transformer cannot process image representations.
    - id: correct
      text: No. Other denoiser architectures, including transformers, can be used.
    answer: correct
    feedback: No. Other denoiser architectures, including transformers, can be used.
  - id: denoising.transfer.2
    prompt: Why is a toy blend from noise to a fixed image not proof of a working diffusion model?
    options:
    - id: b
      text: Because a diffusion model cannot start from noise.
    - id: correct
      text: It has no learned denoiser or actual model-based sampling mechanism.
    - id: a
      text: Because all image generation is impossible.
    answer: correct
    feedback: It has no learned denoiser or actual model-based sampling mechanism.
