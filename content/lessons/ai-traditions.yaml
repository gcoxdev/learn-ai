assessment_families:
- id: ai-traditions.base
  objective_ref: objective.ai-traditions
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
  remediation_scene: ai-traditions.s3
  variants:
  - id: ai-traditions.base.1
    prompt: Which component directly expresses “a closed road is forbidden”?
    options:
    - id: c
      text: A random seed
    - id: a
      text: An explicit constraint
    - id: b
      text: An embedding coordinate with no defined interpretation
    answer: a
    feedback: A named rule or constraint directly encodes the requirement.
    retired: true
  - id: ai-traditions.base.2
    prompt: A predictor outputs a travel-time distribution. What does this add?
    options:
    - id: a
      text: A representation of uncertainty
    - id: b
      text: A proof that no route can fail
    - id: c
      text: A new physical road
    answer: a
    feedback: A distribution describes possible outcomes under assumptions.
    retired: true
  - id: ai-traditions.base.v2.1
    prompt: Which part checks whether the truck fits under a bridge?
    options:
    - id: c
      text: A search for the shortest road distance
    - id: a
      text: A height rule using recorded facts
    - id: b
      text: A travel-time estimate from examples
    answer: a
    feedback: The constraint compares height information rather than predicted duration.
  - id: ai-traditions.base.v2.2
    prompt: What is search doing in this route example?
    options:
    - id: a
      text: Exploring possible paths to the shop
    - id: b
      text: Estimating how long one chosen road takes
    - id: c
      text: Checking one bridge against the height rule
    answer: a
    feedback: Search examines alternatives for a goal.
  - id: ai-traditions.base.v2.3
    prompt: Route A takes 12 predicted minutes but has a bridge too low for the truck. What is the useful decision?
    options:
    - id: b
      text: Choose A because its time is lower
    - id: c
      text: Average the heights of routes A and B
    - id: a
      text: Reject A under the height rule
    answer: a
    feedback: A short predicted time does not make the route physically suitable.
  - id: ai-traditions.base.v2.4
    prompt: What makes the example system hybrid?
    options:
    - id: c
      text: It gives several estimates from the same rule
    - id: a
      text: It combines rules, search, and learned estimates
    - id: b
      text: It chooses between two possible destinations
    answer: a
    feedback: Hybrid refers to combining approaches to the problem.
- id: ai-traditions.transfer
  objective_ref: objective.ai-traditions
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
  remediation_scene: ai-traditions.s3
  variants:
  - id: ai-traditions.transfer.1
    prompt: The shortest predicted route violates a height limit. What should the planner do?
    options:
    - id: a
      text: Apply the constraint when choosing feasible routes
    - id: b
      text: Treat the prediction as permission to ignore the limit
    - id: c
      text: Delete all training data
    answer: a
    feedback: Predicted utility and feasibility are different parts of the decision.
    retired: true
  - id: ai-traditions.transfer.2
    prompt: A product contains neural perception and symbolic planning. How should it be described?
    options:
    - id: b
      text: As impossible because AI families cannot mix
    - id: c
      text: As entirely symbolic because it has any rule
    - id: a
      text: By the roles and interfaces of both components
    answer: a
    feedback: Hybrid systems combine mechanisms; a component label does not define the whole product.
    retired: true
  - id: ai-traditions.transfer.v2.1
    prompt: The height facts are outdated but time predictions are accurate. Which concern remains?
    options:
    - id: a
      text: The chosen bridge may be unsuitable
    - id: b
      text: The displayed route must take less time
    - id: c
      text: The app cannot compare time estimates
    answer: a
    feedback: Accurate predictions cannot repair incorrect constraint information.
  - id: ai-traditions.transfer.v2.2
    prompt: What does uncertainty mean in a travel-time estimate?
    options:
    - id: b
      text: The app has not yet selected a destination
    - id: c
      text: The measured distance has not been recorded
    - id: a
      text: The actual duration is not known exactly
    answer: a
    feedback: An estimate can be useful while the outcome remains uncertain.
  - id: ai-traditions.transfer.v2.3
    prompt: Which description fits a neural network at this stage?
    options:
    - id: c
      text: An explicit height rule using recorded facts
    - id: a
      text: Connected calculations using adjustable weights
    - id: b
      text: A search through a list of candidate routes
    answer: a
    feedback: This introduces the computational family without pretending it guarantees future outcomes.
  - id: ai-traditions.transfer.v2.4
    prompt: Two methods perform different parts of the routing job. What should you compare?
    options:
    - id: a
      text: The role and evidence needed by each part
    - id: b
      text: Which method predicts a smaller number
    - id: c
      text: Which method finishes its own step faster
    answer: a
    feedback: Method names matter less than the actual operations and their evidence.
