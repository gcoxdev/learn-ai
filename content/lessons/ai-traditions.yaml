schema_version: 0.2-draft
lesson:
  id: ai-traditions
  version: 0.2.0-draft
  title: Different ways to solve the same problem
  state: draft
  summary: Choose a delivery route using written rules, a search through choices, and estimates from examples.
  slot: M00.8
  category: common
  sources:
  - title: Dive into Deep Learning — introduction
    url: https://d2l.ai/chapter_introduction/index.html
  archetype: foundation
objectives:
- id: objective.ai-traditions
  version: 2-draft
  statement: 'AI methods encode different assumptions: explicit rules, uncertainty models, learned representations,
    and combinations of these can serve the same task.'
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - ai-traditions.base
  - ai-traditions.transfer
  prerequisites:
  - anyOf:
    - objective.inside-a-system
scenes:
- id: ai-traditions.s1
  title: The same job can have different solutions
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ai-traditions
  markdown: Suppose a tall delivery truck must reach a shop. You could list streets and choose a route by hand.
    A program might follow rules about closed roads, search possible routes, or use past trips to estimate delays.
    These approaches need not compete for the entire job. A useful system may combine them. Before learning historical
    names, we will see what each approach contributes to this one familiar problem.
  text_mode: Suppose a tall delivery truck must reach a shop. You could list streets and choose a route by hand.
    A program might follow rules about closed roads, search possible routes, or use past trips to estimate delays.
    These approaches need not compete for the entire job. A useful system may combine them. Before learning historical
    names, we will see what each approach contributes to this one familiar problem.
- id: ai-traditions.s2
  title: Rules state something explicitly
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ai-traditions
  markdown: 'A written rule could say: “Do not use a bridge lower than the truck.” The program can compare truck
    height with a recorded bridge height. **Symbolic AI** works with explicitly represented things and relationships,
    such as a road being closed or a bridge being too low. A symbol is a mark or name that stands for something.
    Rules can be easy to inspect, but someone must supply and maintain the relevant facts and instructions.'
  text_mode: 'A written rule could say: “Do not use a bridge lower than the truck.” The program can compare truck
    height with a recorded bridge height. **Symbolic AI** works with explicitly represented things and relationships,
    such as a road being closed or a bridge being too low. A symbol is a mark or name that stands for something.
    Rules can be easy to inspect, but someone must supply and maintain the relevant facts and instructions.'
- id: ai-traditions.s3
  title: Search explores alternatives
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-traditions
  markdown: '**Search** means exploring possible choices to find one that meets a goal. Here the goal is to reach
    the shop. The program might compare route A and route B, then reject any route that breaks the height rule.
    This kind of search does not necessarily mean searching the web. It can mean trying possible moves, schedules,
    or paths inside a problem. More choices can make this exploration expensive, so later lessons study ways to
    explore efficiently.'
  text_mode: '**Search** means exploring possible choices to find one that meets a goal. Here the goal is to reach
    the shop. The program might compare route A and route B, then reject any route that breaks the height rule.
    This kind of search does not necessarily mean searching the web. It can mean trying possible moves, schedules,
    or paths inside a problem. More choices can make this exploration expensive, so later lessons study ways to
    explore efficiently.'
- id: ai-traditions.s4
  title: Estimates use uncertain evidence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-traditions
  markdown: Travel time changes with traffic, so an exact written time may be unreliable. **Statistical learning**
    uses patterns in examples to build predictions while working with uncertainty. Uncertainty means not knowing
    an outcome with complete confidence. **Neural networks** are one family of models that connect many small calculations
    using adjustable weights. Those names describe approaches we will study later; neither label guarantees an accurate
    travel-time estimate. A simple learned rule may be enough for a simple task.
  text_mode: Travel time changes with traffic, so an exact written time may be unreliable. **Statistical learning**
    uses patterns in examples to build predictions while working with uncertainty. Uncertainty means not knowing
    an outcome with complete confidence. **Neural networks** are one family of models that connect many small calculations
    using adjustable weights. Those names describe approaches we will study later; neither label guarantees an accurate
    travel-time estimate. A simple learned rule may be enough for a simple task.
- id: ai-traditions.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.ai-traditions
  markdown: Try a fresh example using the ideas above.
  text_mode: Untimed practice with feedback.
  takeaway: Written rules, searching through choices, and learning from examples can do different jobs inside one
    useful system.
- id: ai-traditions.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.ai-traditions
  markdown: 'AI methods encode different assumptions: explicit rules, uncertainty models, learned representations,
    and combinations of these can serve the same task.'
  text_mode: 'AI methods encode different assumptions: explicit rules, uncertainty models, learned representations,
    and combinations of these can serve the same task.'
- id: ai-traditions.s5
  title: Combine the parts in a worked decision
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-traditions
  markdown: 'Route A is predicted to take 12 minutes and route B 15. The truck is too tall for a bridge on A. The
    rule rejects A; search chooses among the routes still allowed; the time estimates favor quicker legal options.
    B is the remaining choice in this two-route example. This is a **hybrid** system: a combination of approaches.
    The fastest prediction did not remove the height restriction, and the height rule did not learn traffic patterns.'
  text_mode: 'Route A is predicted to take 12 minutes and route B 15. The truck is too tall for a bridge on A. The
    rule rejects A; search chooses among the routes still allowed; the time estimates favor quicker legal options.
    B is the remaining choice in this two-route example. This is a **hybrid** system: a combination of approaches.
    The fastest prediction did not remove the height restriction, and the height rule did not learn traffic patterns.'
- id: ai-traditions.s6
  title: Ask what evidence each part needs
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-traditions
  markdown: To check this system, inspect the recorded bridge heights, the routes explored, and the quality of the
    time predictions. Old height data could cause a dangerous choice even with an excellent time predictor. Poor
    predictions could cause delays even when every chosen bridge is tall enough. In the history module, you will
    see these traditions develop and overlap. For now, remember their jobs rather than memorizing a list of names
    without a use for them.
  text_mode: To check this system, inspect the recorded bridge heights, the routes explored, and the quality of
    the time predictions. Old height data could cause a dangerous choice even with an excellent time predictor.
    Poor predictions could cause delays even when every chosen bridge is tall enough. In the history module, you
    will see these traditions develop and overlap. For now, remember their jobs rather than memorizing a list of
    names without a use for them.
