assessment_families:
  - id: ai-traditions.base
    objective_ref: objective.ai-traditions
    task: base
    response_type: single_choice
    points: 1
    hint: "Match each piece of the truck example to its toolkit: a rule decides what's allowed, search explores the possible routes, and learned estimates predict how long each one takes."
    remediation_scene: ai-traditions.s3
    variants:
      - id: ai-traditions.base.1
        prompt: Which component directly expresses “a closed road is forbidden”?
        options:
          - id: c
            text: A random seed
          - id: a
            text: An explicit constraint
          - id: b
            text: An embedding coordinate with no defined interpretation
        answer: a
        feedback: A named rule or constraint directly encodes the requirement.
        retired: true
      - id: ai-traditions.base.2
        prompt: A predictor outputs a travel-time distribution. What does this add?
        options:
          - id: a
            text: A representation of uncertainty
          - id: b
            text: A proof that no route can fail
          - id: c
            text: A new physical road
        answer: a
        feedback: A distribution describes possible outcomes under assumptions.
        retired: true
      - id: ai-traditions.base.v2.1
        prompt: Which part checks whether the truck fits under a bridge?
        options:
          - id: c
            text: A search for the shortest road distance
          - id: a
            text: A height rule using recorded facts
          - id: b
            text: A travel-time estimate from examples
        answer: a
        feedback: "Whether the truck fits is a hard limit, so a rule compares the recorded heights. A time estimate says how long a route takes, not whether the truck fits, and search only lists the routes."
      - id: ai-traditions.base.v2.2
        prompt: What is search doing in this route example?
        options:
          - id: a
            text: Exploring possible paths to the shop
          - id: b
            text: Estimating how long one chosen road takes
          - id: c
            text: Checking one bridge against the height rule
        answer: a
        feedback: "Search tries out possible paths that reach the goal, the shop. Estimating how long a road takes and checking a bridge are the jobs of the learned estimates and the rule."
      - id: ai-traditions.base.v2.3
        prompt: Route A takes 12 predicted minutes but has a bridge too low for the truck. What is the useful decision?
        options:
          - id: b
            text: Choose A because its time is lower
          - id: c
            text: Average the heights of routes A and B
          - id: a
            text: Reject A under the height rule
        answer: a
        feedback: A short predicted time does not make the route physically suitable.
        retired: true
      - id: ai-traditions.base.v2.4
        prompt: What makes the example system hybrid?
        options:
          - id: c
            text: It gives several estimates from the same rule
          - id: a
            text: It combines rules, search, and learned estimates
          - id: b
            text: It chooses between two possible destinations
        answer: a
        feedback: Hybrid refers to combining approaches to the problem.
        retired: true
      - id: ai-traditions.base.v2.5
        prompt: A delivery planner rejects roads closed to trucks using a recorded restriction. Which part is this?
        options:
          - id: a
            text: Searching all possible destination names
          - id: b
            text: Learning travel times from previous trips
          - id: c
            text: Applying a rule to a recorded fact
        answer: c
        feedback: The restriction is an explicit rule. Searching routes and estimating travel times play other roles.
      - id: ai-traditions.base.v2.6
        prompt: A robot tries several sequences of moves to reach a shelf. Which description matches that step?
        options:
          - id: a
            text: Search through candidate plans
          - id: b
            text: A measurement of one sensor value
          - id: c
            text: A learned estimate of one move’s duration
        answer: a
        feedback: Search considers alternatives. A sensor measurement or time estimate can inform it but is a different operation.
      - id: ai-traditions.base.v3.1
        prompt: Search finds three routes for a truck 4.2 m tall. Route P takes 10 minutes but passes under a 3.9 m bridge. Route Q takes 17 minutes and has no bridges. Route R takes 14 minutes under a 4.5 m bridge. Which route should the system pick?
        options:
          - id: a
            text: Route P, since it is the fastest one
          - id: b
            text: Route Q, since it avoids every bridge
          - id: c
            text: Route R, the fastest allowed route
        answer: c
        feedback: The height rule removes P first, because 3.9 m is lower than the truck. The time estimates then pick the quickest route that's left, R at 14 minutes. Q is allowed too, but it's slower, and R's 4.5 m bridge is tall enough.
      - id: ai-traditions.base.v3.2
        prompt: A navigation system bans roads closed to trucks with a written rule, searches the remaining routes, and ranks them by travel times learned from past trips. What is this design called?
        options:
          - id: c
            text: A symbolic system built from rules
          - id: b
            text: A hybrid of several approaches
          - id: a
            text: A neural network trained on trips
        answer: b
        feedback: It combines written rules, search, and learned estimates, which makes it a hybrid. "Symbolic" describes only the rule part, and a neural network could supply only the learned travel times.
  - id: ai-traditions.transfer
    objective_ref: objective.ai-traditions
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Trace the example in your own words: what goes in, what happens, and what comes out?'
    remediation_scene: ai-traditions.s3
    variants:
      - id: ai-traditions.transfer.1
        prompt: The shortest predicted route violates a height limit. What should the planner do?
        options:
          - id: a
            text: Apply the constraint when choosing feasible routes
          - id: b
            text: Treat the prediction as permission to ignore the limit
          - id: c
            text: Delete all training data
        answer: a
        feedback: Predicted utility and feasibility are different parts of the decision.
        retired: true
      - id: ai-traditions.transfer.2
        prompt: A product contains neural perception and symbolic planning. How should it be described?
        options:
          - id: b
            text: As impossible because AI families cannot mix
          - id: c
            text: As entirely symbolic because it has any rule
          - id: a
            text: By the roles and interfaces of both components
        answer: a
        feedback: Hybrid systems combine mechanisms; a component label does not define the whole product.
        retired: true
      - id: ai-traditions.transfer.v2.1
        prompt: The height facts are outdated but time predictions are accurate. Which concern remains?
        options:
          - id: a
            text: The chosen bridge may be unsuitable
          - id: b
            text: The displayed route must take less time
          - id: c
            text: The app cannot compare time estimates
        answer: a
        feedback: Accurate predictions cannot repair incorrect constraint information.
        retired: true
      - id: ai-traditions.transfer.v2.2
        prompt: What does uncertainty mean in a travel-time estimate?
        options:
          - id: b
            text: The app has not yet selected a destination
          - id: c
            text: The measured distance has not been recorded
          - id: a
            text: The actual duration is not known exactly
        answer: a
        feedback: An estimate can be useful while the outcome remains uncertain.
        retired: true
      - id: ai-traditions.transfer.v2.3
        prompt: Which description fits a neural network at this stage?
        options:
          - id: c
            text: An explicit height rule using recorded facts
          - id: a
            text: Connected calculations using adjustable weights
          - id: b
            text: A search through a list of candidate routes
        answer: a
        feedback: This introduces the computational family without pretending it guarantees future outcomes.
        retired: true
      - id: ai-traditions.transfer.v2.4
        prompt: Two methods perform different parts of the routing job. What should you compare?
        options:
          - id: a
            text: The role and evidence needed by each part
          - id: b
            text: Which method predicts a smaller number
          - id: c
            text: Which method finishes its own step faster
        answer: a
        feedback: Method names matter less than the actual operations and their evidence.
        retired: true
      - id: ai-traditions.transfer.v2.5
        prompt: A route is predicted to take 8 minutes but breaks a road restriction. Another allowed route takes 10. What respects both parts of the system?
        options:
          - id: a
            text: Choose an allowed route even if its estimate is longer
          - id: b
            text: Treat the quicker estimate as permission to ignore the rule
          - id: c
            text: Average the two times and keep the restricted route
        answer: a
        feedback: A time estimate does not cancel a hard restriction. First determine what is allowed, then compare suitable candidates.
        retired: true
      - id: ai-traditions.transfer.v2.6
        prompt: The route rule is correct, but a learned travel-time estimate misses new congestion. What needs attention?
        options:
          - id: a
            text: The truck-height limit merely because the trip is slow
          - id: b
            text: The estimate and the evidence it uses
          - id: c
            text: The destination name merely because the trip is slow
        answer: b
        feedback: A hybrid system combines parts with different jobs. Investigate the part implicated by the observed error.
        retired: true
  - id: ai-traditions.transfer.v3
    objective_ref: objective.ai-traditions
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what kind of job each part does. Hard limits belong to rules, exploring options belongs to search, and uncertain estimates belong to learning, so a failure points to the part doing that job.
    remediation_scene: ai-traditions.s5
    variants:
      - id: ai-traditions.transfer.v3.1
        prompt: A robot vacuum must never drive off the top of the stairs. Which part of its design should make sure of this?
        options:
          - id: a
            text: A learned guess about where stairs usually are in homes
          - id: b
            text: A written rule that blocks moves past a detected edge
          - id: c
            text: A faster search through possible paths around the room
        answer: b
        feedback: A hard safety limit is a job for an explicit rule, which applies every time. A learned guess about stairs would be right most of the time, and a faster search could still choose the unsafe move.
      - id: ai-traditions.transfer.v3.2
        prompt: A chess program considers each move it could make, then each reply its opponent could make, before choosing. Which approach is this?
        options:
          - id: a
            text: A written rule for every possible board position
          - id: b
            text: Learning from photos of famous chess games
          - id: c
            text: Search, exploring possible moves ahead
        answer: c
        feedback: Looking ahead through possible moves and replies is search, the approach Deep Blue used. Nobody could write a rule for every position; there are far too many.
      - id: ai-traditions.transfer.v3.3
        prompt: A tax helper applies checks written by experts, such as "if income is below the limit, the family qualifies." Which approach is this?
        options:
          - id: c
            text: Learning by copying thousands of past tax forms
          - id: b
            text: Searching the possible paths through the whole form
          - id: a
            text: Explicit rules written by people (symbolic AI)
        answer: a
        feedback: The checks are written out by people and applied exactly, which is the rules tradition. Learning from past forms would produce estimates, not the exact legal rule.
      - id: ai-traditions.transfer.v3.4
        prompt: A truck-routing system has excellent travel-time estimates, but its bridge heights were recorded ten years ago. What is the most serious risk?
        options:
          - id: c
            text: Sending the truck under a bridge it can't clear
          - id: b
            text: Arrival times that come out a little optimistic
          - id: a
            text: A route search that takes longer than usual
        answer: c
        feedback: Accurate time estimates can't fix wrong facts in a rule. If a bridge was lowered since then, the rule will allow a route it should block.
      - id: ai-traditions.transfer.v3.5
        prompt: A Go-playing program uses a neural network to judge how good a position looks and a search to explore moves ahead. How is it best described?
        options:
          - id: b
            text: Pure search, since it explores many moves ahead
          - id: a
            text: A hybrid that combines learning with search
          - id: c
            text: Rules written by experts for each position
        answer: a
        feedback: It combines a learned model with search, the design AlphaGo used. Calling it pure search ignores the neural network that judges positions.
      - id: ai-traditions.transfer.v3.6
        prompt: A delivery planner's routes are all allowed and sensible, but its arrival times are badly off since road work started downtown. Which part needs attention?
        options:
          - id: a
            text: The truck-height rule and its list of bridge heights
          - id: c
            text: The list of possible routes that the search considers
          - id: b
            text: The learned time estimates and the trips behind them
        answer: b
        feedback: The routes are fine, so the rule and search are doing their jobs. The times are wrong because the estimates learned from trips made before the road work.
