schema_version: 0.2-draft
lesson:
  id: ai-traditions
  version: 0.4.0-draft
  title: Different ways to solve the same problem
  state: draft
  summary: How does a map app pick your route? Solve one tall-truck delivery three ways, with written rules, a search through choices, and estimates learned from past trips, then combine them.
  slot: M00.8
  category: common
  sources:
    - title: Dive into Deep Learning — introduction
      url: https://d2l.ai/chapter_introduction/index.html
  archetype: foundation
objectives:
  - id: objective.ai-traditions
    version: 4-draft
    statement: 'AI methods encode different assumptions: explicit rules, uncertainty models, learned representations, and combinations of these can serve the same task.'
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - ai-traditions.base
      - ai-traditions.transfer.v3
    prerequisites:
      - anyOf:
          - objective.inside-a-system
scenes:
  - id: ai-traditions.s1
    title: One job, three toolkits
    type: explanation
    depth: intuition
    objective_refs:
      - objective.ai-traditions
    markdown: |-
      When your map app picks a route, it's solving three problems at once. Which roads are allowed? Which of the many possible routes should it consider? And how long will each one take with today's traffic?

      Let's make it harder. A delivery truck 4.2 meters tall must reach a shop across town. Some routes pass under old, low bridges. Three families of AI methods each handle a different part of this job:

      | Approach | What it's good at | Truck example |
      | --- | --- | --- |
      | Written rules | Saying exactly what's allowed | "No bridge lower than the truck" |
      | Search | Trying possibilities to reach a goal | Comparing possible routes to the shop |
      | Learning from examples | Estimating things nobody can write down | Guessing travel time from past trips |

      These approaches grew up as separate traditions in AI's history, and the next module tells that story. Here, you'll see what each one contributes, and why the best systems often use all three.
  - id: ai-traditions.s2
    title: Rules say exactly what's allowed
    type: explanation
    depth: intuition
    objective_refs:
      - objective.ai-traditions
    markdown: |-
      A written rule might say: "Never use a bridge lower than the truck." The program compares two recorded facts: the truck is 4.2 m tall, and the Mill Street bridge is 3.8 m. Blocked.

      **Symbolic AI** works this way: with things and relationships written out explicitly, like "this bridge is too low" or "this road is closed." (A *symbol* is a name that stands for something.)

      :::story Expert systems
      In the 1970s and 1980s, many AI projects packed specialists' knowledge into hundreds or thousands of if-then rules. Stanford's MYCIN used a few hundred rules to recommend antibiotics for serious infections, though it stayed a research system and never treated real patients. XCON, at the computer maker Digital Equipment Corporation, used thousands of rules to check and complete customers' computer orders every day. These "expert systems" were easy to inspect, since you could read every rule, but every fact had to be written and kept up to date by hand.
      :::
  - id: ai-traditions.s3
    title: Search tries the possibilities
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-traditions
    markdown: |-
      **Search** means exploring possible choices to find one that reaches a goal. This isn't web search. It's trying routes, moves, or schedules inside a problem: "Left at Oak Street, then right at the park… does that reach the shop?"

      The trouble is that possibilities multiply fast. If a driver has 3 choices at each of 10 intersections, there are 3 × 3 × … × 3 (ten times) = 59,049 possible routes.

      :::predict How many routes are there with 3 choices at each of 20 intersections?
      About 3.5 billion (3,486,784,401). Doubling the number of intersections squared the number of routes. That's why search methods work hard to skip hopeless routes early instead of checking every one.
      :::

      Search can be astonishingly strong. In 1997, IBM's Deep Blue beat world chess champion Garry Kasparov by searching through many millions of chess positions every second.
  - id: ai-traditions.s4
    title: Learning handles the uncertain parts
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-traditions
    markdown: |-
      How long does a route take? It depends on traffic, weather, and time of day, so nobody can write down one exact rule. This is *uncertainty*: not knowing an outcome for sure.

      **Statistical learning** builds predictions from patterns in examples while keeping track of that uncertainty. It's the delivery estimator from the last lesson, grown up: from thousands of past trips, it might learn that route B usually takes about 15 minutes on a weekday morning, and anywhere from 13 to 19.

      **Neural networks** are one especially powerful family of learned models. They connect many small calculations, each using weights like our snack model's, and stack them in layers. Most of the AI helpers you use today, from photo search to chat assistants, are built on them. You'll build one from scratch later in the course.
  - id: ai-traditions.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.ai-traditions
    markdown: Robot vacuums, chess programs, tax helpers, and game-playing AI ask you which approach handles which part of a job, and which part to blame when something goes wrong.
    takeaway: |-
      Written rules, search, and learning from examples are good at different jobs. Many real systems combine them: rules for what's allowed, search to explore options, and learned estimates to compare them.
  - id: ai-traditions.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.ai-traditions
    markdown: |-
      AI methods encode different assumptions: explicit rules, uncertainty models, learned representations, and combinations of these can serve the same task.
  - id: ai-traditions.s5
    title: Put the pieces together
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-traditions
    markdown: |-
      Search finds three routes to the shop. Here's what the other two parts say about them:

      | Route | Learned time estimate | Lowest bridge | Height rule |
      | --- | ---: | ---: | --- |
      | A | 12 min | 3.8 m | Blocked (lower than 4.2 m) |
      | B | 15 min | 4.6 m | Allowed |
      | C | 19 min | no bridges | Allowed |

      The rule removes A, even though it's fastest. The time estimates then pick B from the routes that are left. A system that combines approaches like this is called a **hybrid**.

      :::predict Today there's a crash on route B, and the estimate for B jumps to 25 minutes. Which route now?
      C, at 19 minutes. A is still blocked: no traffic report can make a low bridge taller. Each part keeps doing its own job.
      :::
  - id: ai-traditions.s6
    title: Know which part to blame
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-traditions
    markdown: |-
      Because each part does a different job, each can fail in its own way. Suppose a bridge was lowered by new road work, but the recorded height is old. Then even a perfect time estimator could send the truck into the bridge. Suppose instead that the estimates ignore school traffic: then every chosen bridge is safe, but deliveries run late.

      So check each part with its own evidence: the recorded heights, the routes search considered, and how the time estimates compare with real trips.

      :::mixup "Neural networks replaced the older kinds of AI."
      They're the most successful approach for many jobs, but rules and search are everywhere. Map apps pair route search with learned traffic estimates. DeepMind's AlphaGo, which beat top Go player Lee Sedol in 2016, used neural networks to judge positions *and* a search to look ahead.
      :::
