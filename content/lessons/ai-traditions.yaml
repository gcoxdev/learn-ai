schema_version: 0.2-draft
lesson:
  id: ai-traditions
  version: 0.1.0-draft
  title: Rules, probabilities, networks, and hybrids
  state: draft
  summary: 'AI methods encode different assumptions: explicit rules, uncertainty models, learned representations,
    and combinations of these can serve the same task.'
  slot: M00.5
  category: common
  minutes: 12
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.ai-traditions
  version: 1-draft
  statement: 'AI methods encode different assumptions: explicit rules, uncertainty models, learned representations,
    and combinations of these can serve the same task.'
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - ai-traditions.base
  - ai-traditions.transfer
  prerequisites:
  - anyOf:
    - objective.ai-systems
scenes:
- id: ai-traditions.s1
  title: Several routes to a useful decision
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ai-traditions
  markdown: A parcel-routing system can follow handwritten rules, search a road graph, predict delays from data,
    or combine all three. Symbolic AI represents entities and relationships explicitly. Statistical AI represents
    patterns and uncertainty. Neural methods learn numerical transformations and representations. These descriptions
    overlap rather than dividing every product into one exclusive box.
  text_mode: A parcel-routing system can follow handwritten rules, search a road graph, predict delays from data,
    or combine all three. Symbolic AI represents entities and relationships explicitly. Statistical AI represents
    patterns and uncertainty. Neural methods learn numerical transformations and representations. These descriptions
    overlap rather than dividing every product into one exclusive box.
  bridges: []
- id: ai-traditions.s2
  title: Compare the mechanisms
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-traditions
  markdown: 'A rule says: if a road is closed, exclude it. A probabilistic estimate says: this road has a 30% chance
    of a long delay. A neural predictor maps traffic measurements into an estimated travel time. Search then compares
    routes using those estimates. Each component answers a different part of the routing problem.'
  text_mode: 'A rule says: if a road is closed, exclude it. A probabilistic estimate says: this road has a 30% chance
    of a long delay. A neural predictor maps traffic measurements into an estimated travel time. Search then compares
    routes using those estimates. Each component answers a different part of the routing problem.'
  bridges: []
- id: ai-traditions.s3
  title: Make a hybrid concrete
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-traditions
  markdown: Suppose routes A and B are predicted to take 12 and 15 minutes. A hard vehicle-height constraint rules
    out A for a tall truck, so the planner chooses B. A learned score alone did not enforce the constraint. Conversely,
    the explicit constraint did not learn the traffic pattern. Their combination can be useful when interfaces and
    assumptions are clear.
  text_mode: Suppose routes A and B are predicted to take 12 and 15 minutes. A hard vehicle-height constraint rules
    out A for a tall truck, so the planner chooses B. A learned score alone did not enforce the constraint. Conversely,
    the explicit constraint did not learn the traffic pattern. Their combination can be useful when interfaces and
    assumptions are clear.
  bridges: []
- id: ai-traditions.s4
  title: Match the method to the problem
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-traditions
  markdown: Rules can be inspectable but costly to maintain. Statistical assumptions can be explicit yet inaccurate.
    Learned representations can handle complex signals while relying on fragile patterns. Compare data needs, uncertainty,
    constraints, error costs, and maintenance. Historical traditions persist inside modern systems; newer methods
    do not make all earlier ideas obsolete.
  text_mode: Rules can be inspectable but costly to maintain. Statistical assumptions can be explicit yet inaccurate.
    Learned representations can handle complex signals while relying on fragile patterns. Compare data needs, uncertainty,
    constraints, error costs, and maintenance. Historical traditions persist inside modern systems; newer methods
    do not make all earlier ideas obsolete.
  bridges: []
