  version: 0.1.0-draft
  title: Help information and learning signals travel
  state: draft
  summary: Residual additions, normalization, dropout, and initialization alter signal flow in different ways; their
    axes, modes, and training assumptions must be explicit.
  slot: M11.6
  category: learning
  minutes: 12
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: The Llama 3 Herd of Models
    url: https://arxiv.org/abs/2407.21783
objectives:
- id: objective.residuals-normalization-dropout
  version: 1-draft
  statement: Residual additions, normalization, dropout, and initialization alter signal flow in different ways;
    their axes, modes, and training assumptions must be explicit.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - residuals-normalization-dropout.base
  - residuals-normalization-dropout.transfer
  prerequisites:
  - anyOf:
    - objective.neural-forward-pass
  - anyOf:
    - objective.stable-training
scenes:
- id: residuals-normalization-dropout.s1
  title: Keep a direct path through a block
  type: explanation
  depth: intuition
  objective_refs:
  - objective.residuals-normalization-dropout
  markdown: A residual block computes an update F(x) and adds it to a compatible input x. For x = [1, 2] and F(x)
    = [0.5, −1], the result is [1.5, 1]. A direct path can help optimization, but dimensions must match or an explicit
    projection must align them.
  text_mode: A residual block computes an update F(x) and adds it to a compatible input x. For x = [1, 2] and F(x)
    = [0.5, −1], the result is [1.5, 1]. A direct path can help optimization, but dimensions must match or an explicit
    projection must align them.
  bridges: []
- id: residuals-normalization-dropout.s2
  title: Normalize selected statistics
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.residuals-normalization-dropout
  markdown: Normalization changes values using statistics over specified axes, often followed by learned scale parameters
    and sometimes offsets. Batch normalization and layer normalization use different axes and state conventions.
    RMS normalization uses a root-mean-square scale without subtracting the mean in its common form. Exact formulas
    matter when comparing architectures.
  text_mode: Normalization changes values using statistics over specified axes, often followed by learned scale
    parameters and sometimes offsets. Batch normalization and layer normalization use different axes and state conventions.
    RMS normalization uses a root-mean-square scale without subtracting the mean in its common form. Exact formulas
    matter when comparing architectures.
  bridges:
  - matrices-tensors
- id: residuals-normalization-dropout.s3
  title: Dropout changes the training computation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.residuals-normalization-dropout
  markdown: Dropout randomly suppresses selected activations during training under a defined probability and scaling
    rule. It encourages robustness to those missing activations rather than literally deleting permanent units.
    Standard inference disables this randomness and uses the matching scaling convention; special uncertainty methods
    can deliberately use it differently.
  text_mode: Dropout randomly suppresses selected activations during training under a defined probability and scaling
    rule. It encourages robustness to those missing activations rather than literally deleting permanent units.
    Standard inference disables this randomness and uses the matching scaling convention; special uncertainty methods
    can deliberately use it differently.
  bridges: []
- id: residuals-normalization-dropout.s4
  title: Consider the interaction
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.residuals-normalization-dropout
  markdown: Initialization sets the starting scales; residual and normalization placement affect later signal statistics;
    dropout changes noise during training. None is a universal cure for depth or bad data. Inspect training/evaluation
    modes and run controlled ablations to attribute any improvement to the intended mechanism.
  text_mode: Initialization sets the starting scales; residual and normalization placement affect later signal statistics;
