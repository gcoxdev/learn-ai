assessment_families:
- id: residuals-normalization-dropout.base
  objective_ref: objective.residuals-normalization-dropout
  task: base
  response_type: single_choice
  points: 1
  hint: 'Normalize selected statistics: trace the inputs, operation, and result before choosing.'
  remediation_scene: residuals-normalization-dropout.s2
  variants:
  - id: residuals-normalization-dropout.base.1
    prompt: Residual input [2, 3] plus update [−1, 0.5] gives what?
    options:
    - id: b
      text: '[−2, 1.5]'
    - id: c
      text: '[2, 0.5]'
    - id: a
      text: '[1, 3.5]'
    answer: a
    feedback: Residual addition combines corresponding coordinates.
  - id: residuals-normalization-dropout.base.2
    prompt: Does ordinary dropout permanently delete the masked units?
    options:
    - id: c
      text: Only if the batch is large
    - id: a
      text: No; it changes selected training computations
    - id: b
      text: Yes; every mask rewrites the architecture permanently
    answer: a
    feedback: Masks vary under a training rule; the model structure remains.
- id: residuals-normalization-dropout.transfer
  objective_ref: objective.residuals-normalization-dropout
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Consider the interaction: trace the inputs, operation, and result before choosing.'
  remediation_scene: residuals-normalization-dropout.s4
  variants:
  - id: residuals-normalization-dropout.transfer.1
    prompt: Two vectors have incompatible sizes for a residual addition. What is needed?
    options:
    - id: c
      text: Only a different optimizer
    - id: a
      text: A compatible shape or explicit projection
    - id: b
      text: An assumption that addition ignores missing entries
    answer: a
    feedback: The direct and update paths must align in dimension.
  - id: residuals-normalization-dropout.transfer.2
    prompt: A model remains in training mode during evaluation. What should be checked?
    options:
    - id: a
      text: Dropout and normalization behavior
    - id: b
      text: Only the number of output classes
    - id: c
      text: A guarantee that predictions are unchanged
    answer: a
    feedback: Mode-dependent components can alter evaluated behavior.
