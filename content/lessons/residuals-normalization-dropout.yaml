            text: Normalize each feature using its values across the whole batch.
          - id: c
            text: Divide each entry by the total so the four entries sum to 1.
          - id: a
            text: Normalize using the mean and spread of this vector's own four entries.
        feedback: The sum is [7, 1, 1, 7], with mean 4 and variance (9 + 9 + 9 + 9) / 4 = 9, so the spread is 3. The first entry becomes (7 − 4) / 3 = 1. Remember to divide by the square root of the variance, not the variance itself.
    absolute_tolerance: 0.01
    numeric_fields:
      - id: mean
        label: Mean of x + F(x)
      - id: variance
        label: Variance of x + F(x)
      - id: first
        label: Normalized first entry
