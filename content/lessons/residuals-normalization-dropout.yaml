scenes:
  - id: residuals-normalization-dropout.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.residuals-normalization-dropout
    title: When deeper got worse
    markdown: |-
      In 2015, Kaiming He and colleagues at Microsoft Research reported something odd. On the CIFAR-10 image dataset, a plain 56-layer network had higher *training* error than a 20-layer one. The extra 36 layers could simply have copied their input forward to match the shallower network, but training couldn't find that setting.

      Their fix, the **residual connection**, let them train networks as deep as 152 layers. These **ResNets** won the 2015 ImageNet classification challenge. Today nearly every deep network, transformers included, uses the first two of these three small helpers, and many add the third:

      | Helper | What it does | Everyday picture |
      | --- | --- | --- |
      | Residual connection | Adds a block's input back to its output | A bypass lane around roadworks |
      | Normalization | Recenters and rescales a group of values | Converting test scores to "how far above average" |
      | Dropout | Randomly silences units during training | Practicing with random teammates benched |

      Each solves a different problem. We'll trace each with small numbers, then put all three in one transformer block.
    bridges: []
  - id: residuals-normalization-dropout.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.residuals-normalization-dropout
    title: A shortcut carries the input past the block
    markdown: |-
      A residual block computes some learned transformation $F(x)$ and then adds the input back: $y = x + F(x)$. With input $x = [2, 4]$ and $F(x) = [1, -1]$, the output is $[3, 3]$. The addition is entry by entry, so $x$ and $F(x)$ need the same shape; when they don't, the shortcut first passes through a small learned projection.

      Two things follow. First, a block that should "do nothing" only has to push $F$ toward zero, which is easy, instead of learning to copy its input exactly. Each block learns a *correction*, a residual.

      Second, gradients get a highway. Since $\partial y / \partial x = 1 + \partial F / \partial x$, there's always a route with slope exactly 1. Stack two blocks whose $F$ has slope 0.1 and apply "multiply along, add across" over every route from output to input:

      | Route | Slope |
      | --- | ---: |
      | Skip both blocks | 1 |
      | Through block 1 only | 0.1 |
      | Through block 2 only | 0.1 |
      | Through both blocks | 0.01 |
      | **Total** | **1.21** |

      Without shortcuts only the last route exists: 0.01 for two layers, $0.1^{20} = 10^{-20}$ for twenty, a vanishing gradient (from the lesson on stable training). With shortcuts the direct route keeps the gradient alive however deep you go. That's what made 100-plus-layer networks trainable; the ResNet authors even trained a 1,202-layer version on CIFAR-10.
    bridges:
      - vectors
  - id: residuals-normalization-dropout.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.residuals-normalization-dropout
    title: Layer normalization rescales one example's features
    markdown: |-
      **Layer normalization** (Ba, Kiros, and Hinton, 2016) turns one example's features into "how far from this vector's own average, in units of its spread." For $x = [2, 4]$:

      1. Mean: $\mu = 3$.
      2. Subtract it: $[-1, 1]$.
      3. Variance, the mean squared deviation: $\sigma^2 = 1$.
      4. Divide by $\sqrt{\sigma^2} = 1$: $[-1, 1]$.

      That's the formula from the lesson on stable training, $\text{LN}(x) = \gamma \odot (x - \mu) / \sqrt{\sigma^2 + \epsilon} + \beta$, with the learned scale $\gamma = 1$, shift $\beta = 0$, and the tiny safety constant $\epsilon$ ignored.

      What's new here is how it's used inside a network. A transformer reads text as **tokens**, words or pieces of words, and holds each token as a row of features. Layer norm treats every row on its own:

      ```python run
      import numpy as np

      def layer_norm(X, eps=1e-5):
          mu = X.mean(axis=-1, keepdims=True)                  # one mean per token (row)
          var = ((X - mu) ** 2).mean(axis=-1, keepdims=True)   # one spread per token
          return (X - mu) / np.sqrt(var + eps)

      X = np.array([[2.0,  4.0,  6.0,  8.0],                   # token 1
                    [20.0, 40.0, 60.0, 80.0],                  # token 2: token 1 times 10
                    [1.0,  1.0,  1.0,  5.0]])                  # token 3
      print("means:    ", X.mean(axis=-1))
      print(layer_norm(X).round(3))
      print("[2, 4] -> ", layer_norm(np.array([[2.0, 4.0]])).round(3))
      ```

      Tokens 1 and 2 differ by a factor of 10 and come out identical. However large or small the earlier layers make a token's values, the next sublayer receives them on the same scale, and that steadiness is what keeps deep stacks trainable. Change token 3 to `[1, 1, 1, 1]` and rerun: with no spread at all, $\epsilon$ is the only thing preventing a division by zero.
    bridges:
      - arithmetic
  - id: residuals-normalization-dropout.s4
    title: Normalized values aren't probabilities
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.residuals-normalization-dropout
    markdown: |-
      Layer norm computes its mean and spread from one token's own features, so a token's output never depends on the other examples in its batch. Batch normalization, also from the lesson on stable training, normalizes each feature *across* the batch instead. Image networks such as ResNet use batch norm; transformers use layer norm, partly because it works the same whether a batch holds one sequence or a thousand.

      :::mixup "After normalization the values are probabilities."
      $[-1, 1]$ has a negative entry and sums to 0. Normalization only recenters and rescales. Turning scores into probabilities that are positive and sum to 1 is softmax's job, a different operation you'll meet with language models.
      :::
    bridges: []
  - id: residuals-normalization-dropout.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.residuals-normalization-dropout
    markdown: Push fresh vectors through a residual-then-normalize block and an inverted-dropout mask, recording the numbers at each stage.
    takeaway: |-
      A residual connection adds a block's input back so information and gradients have a direct route; layer normalization recenters and rescales one example's features; dropout randomly silences units during training and scales the survivors up. At evaluation, dropout switches off.
  - id: residuals-normalization-dropout.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.residuals-normalization-dropout
    markdown: |-
      Residual additions, normalization, dropout, and initialization alter signal flow in different ways; their axes, modes, and training assumptions must be explicit.
  - id: residuals-normalization-dropout.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.residuals-normalization-dropout
    title: Dropout benches random units during training
    markdown: |-
      A big network can overfit by leaning on a few units that memorize the training data. **Dropout** (Srivastava, Hinton, and colleagues, 2014) fights this: on each training step, units are silenced at random, so the network can't depend on any single one.

      **Inverted dropout**, the version frameworks use, also scales each surviving value up by $1/\text{keep probability}$. With keep probability 0.5, activations $[2, 4]$, and a mask that keeps the first and drops the second, the output is $[2/0.5,\ 0] = [4, 0]$.

      :::predict Why divide by 0.5? What is the first unit's average output over many training steps?
      Half the time it's kept and becomes 4; half the time it's dropped and becomes 0. On average that's $0.5 \times 4 + 0.5 \times 0 = 2$, its original value. The scaling keeps each unit's *average* output the same as when nothing is dropped.
      :::

      That's why evaluation needs no correction: switch dropout off (`model.eval()` in PyTorch) and every unit passes its value unchanged.

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      a = np.array([2.0, 4.0])                   # activations
      keep = 0.5                                 # keep probability

      def dropout(a, keep, training=True):
          if not training:
              return a                           # evaluation: use every unit, no scaling
          mask = rng.random(a.shape) < keep      # True = keep this unit
          return a * mask / keep                 # inverted dropout: scale survivors up

      print("one training pass:", dropout(a, keep))
      avg = np.mean([dropout(a, keep) for _ in range(10000)], axis=0)
      print("average of 10,000 passes:", avg.round(2))
      print("evaluation:", dropout(a, keep, training=False))
      ```

      Try `keep = 0.8`: single passes show 2.5 and 5 when kept, but the average still lands near $[2, 4]$.

      :::mixup "PyTorch's Dropout(p=0.1) keeps 10% of units."
      In PyTorch, `p` is the probability of *dropping* a unit, so `p=0.1` keeps 90%. The 2014 paper used $p$ for the probability of *keeping* one. Check which convention a paper or library uses before copying a number.
      :::
    bridges: []
  - id: residuals-normalization-dropout.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.residuals-normalization-dropout
    title: All three in one transformer block
    markdown: |-
      Most modern transformers use the "pre-norm" design, the one GPT-2 adopted by moving layer norm to the start of each sublayer. It wraps each sublayer $F$ like this:

      $$y = x + \text{Dropout}\big(F(\text{LN}(x))\big)$$

      Trace it with $x = [2, 4]$, supposing the sublayer maps $[-1, 1]$ to $[1, -1]$:

      | Stage | Training (keep 0.5, mask keeps the first) | Evaluation |
      | --- | --- | --- |
      | $\text{LN}(x)$ | $[-1, 1]$ | $[-1, 1]$ |
      | $F(\cdot)$ | $[1, -1]$ | $[1, -1]$ |
      | Dropout | $[2, 0]$ | $[1, -1]$ (off) |
      | Add $x$ | $[4, 4]$ | $[3, 3]$ |

      Each helper has one job: layer norm fixes the scale of what $F$ sees, dropout randomizes what $F$ contributes during training, and the shortcut guarantees $x$ itself always reaches the next layer. The original 2017 transformer normalized *after* the addition instead ("post-norm"), so before tracing a model, check where its designers put each helper.
    bridges: []
    diagram:
      caption: A pre-norm residual block. The skip route carries x around everything else.
      description: The input x goes to layer norm, then the sublayer F, then dropout, then into an addition node. A separate skip route carries x directly to the same addition node. The sum is the block's output y.
      nodes:
        - id: x
          label: x
          col: 0
          row: 1
          tone: data
        - id: ln
          label: Layer norm
          note: rescales each token
          col: 1
          row: 0
        - id: f
          label: Sublayer F
          note: attention or feed-forward
          col: 2
          row: 0
          tone: accent
        - id: drop
          label: Dropout
          note: training only
          col: 3
          row: 0
          tone: muted
        - id: add
          label: Add
          col: 4
          row: 1
          tone: warn
        - id: y
          label: y
          col: 5
          row: 1
          tone: data
      edges:
        - from: x
          to: ln
        - from: ln
          to: f
        - from: f
          to: drop
        - from: drop
          to: add
        - from: x
          to: add
          label: skip route
        - from: add
          to: y
  - id: residuals-normalization-dropout.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.residuals-normalization-dropout
    title: Catch the probability mix-up
    markdown: |-
      Layer normalization turns [2,4] into the toy normalized values [−1,1]. Why is it wrong to call these token probabilities?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: They include a negative value and normalization here is not softmax.
        - id: b
          text: They must first be sorted alphabetically.
        - id: c
          text: Every pair of normalized numbers is a valid probability distribution.
      answer: a
      reveal_markdown: |-
        Layer normalization rescales features around a reference. Probabilities must be nonnegative and sum to one; this operation has a different purpose.
      hint: "Check the two things every probability distribution needs: no negative entries, and a total of 1."
      id: residuals-normalization-dropout.practice.v2.7
