scenes:
- id: residuals-normalization-dropout.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.residuals-normalization-dropout
  title: Three helpers, three different jobs
  markdown: Deep networks pass values through many transformations. A **residual connection** adds a shortcut around
    a transformation. **Normalization** adjusts a set of values using a defined reference such as their mean and
    variance. **Dropout** temporarily removes selected activation contributions during training. These are not three
    names for the same operation. We will inspect each with small numbers and then connect them back to a transformer
    block without claiming every architecture uses the same order.
  text_mode: Deep networks pass values through many transformations. A **residual connection** adds a shortcut around
    a transformation. **Normalization** adjusts a set of values using a defined reference such as their mean and
    variance. **Dropout** temporarily removes selected activation contributions during training. These are not three
    names for the same operation. We will inspect each with small numbers and then connect them back to a transformer
    block without claiming every architecture uses the same order.
  bridges: []
- id: residuals-normalization-dropout.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.residuals-normalization-dropout
  title: A residual route carries the original forward
  markdown: Let a block’s input be x=[2,4] and its learned transformation output F(x)=[1,−1]. A residual addition
    gives x+F(x)=[3,3]. The shapes must match for this elementwise sum, unless a separate projection first makes
    them compatible. The original route can also carry derivative contributions during backward computation. A shortcut
    does not mean the learned branch is unused or that all training problems disappear; it changes the possible
    computation and gradient routes.
  text_mode: Let a block’s input be x=[2,4] and its learned transformation output F(x)=[1,−1]. A residual addition
    gives x+F(x)=[3,3]. The shapes must match for this elementwise sum, unless a separate projection first makes
    them compatible. The original route can also carry derivative contributions during backward computation. A shortcut
    does not mean the learned branch is unused or that all training problems disappear; it changes the possible
    computation and gradient routes.
  bridges:
  - vectors
- id: residuals-normalization-dropout.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.residuals-normalization-dropout
  title: Normalize across a stated set of features
  markdown: 'For the two features [2,4], the mean is 3. Subtract it to get [−1,1]. Their mean squared deviation
    is 1, so division by its square root gives [−1,1]. This classroom calculation omits the small positive numerical
    stabilizer used in practical layer normalization. A real layer norm also commonly learns a scale and offset
    afterward. State which entries are normalized together: changing the grouping changes the operation.'
  text_mode: 'For the two features [2,4], the mean is 3. Subtract it to get [−1,1]. Their mean squared deviation
    is 1, so division by its square root gives [−1,1]. This classroom calculation omits the small positive numerical
    stabilizer used in practical layer normalization. A real layer norm also commonly learns a scale and offset
    afterward. State which entries are normalized together: changing the grouping changes the operation.'
  bridges:
  - arithmetic
- id: residuals-normalization-dropout.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.residuals-normalization-dropout
  title: Do not confuse normalization schemes
  markdown: Layer normalization typically uses features within an example or token, while batch normalization uses
    statistics over specified batch-related axes. The exact axes depend on the implementation. Normalization changes
    the calculation’s scale; it does not automatically turn every vector into a probability distribution or remove
    all social bias from a dataset. A normalized vector can contain negative values and does not need to sum to
    one. Softmax has a different role.
  text_mode: Layer normalization typically uses features within an example or token, while batch normalization uses
    statistics over specified batch-related axes. The exact axes depend on the implementation. Normalization changes
    the calculation’s scale; it does not automatically turn every vector into a probability distribution or remove
    all social bias from a dataset. A normalized vector can contain negative values and does not need to sum to
    one. Softmax has a different role.
  bridges: []
- id: residuals-normalization-dropout.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.residuals-normalization-dropout
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Residuals add a route, normalization rescales features, dropout temporarily masks activations. Similar-looking
    helpers solve different problems.
- id: residuals-normalization-dropout.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.residuals-normalization-dropout
  markdown: Residual additions, normalization, dropout, and initialization alter signal flow in different ways;
    their axes, modes, and training assumptions must be explicit.
  text_mode: Residual additions, normalization, dropout, and initialization alter signal flow in different ways;
    their axes, modes, and training assumptions must be explicit.
- id: residuals-normalization-dropout.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.residuals-normalization-dropout
  title: Hide contributions during training
  markdown: With **inverted dropout** and keep probability 0.5, each retained activation is divided by 0.5; dropped
    activations become zero. If [2,4] receives mask [keep,drop], the result is [4,0]. The scaling preserves the
    expected activation over repeated masks, not each individual output. During ordinary evaluation, dropout is
    disabled and this inverted-dropout convention needs no extra scaling. Deliberate stochastic inference methods
    use different procedures and should state them explicitly.
  text_mode: With **inverted dropout** and keep probability 0.5, each retained activation is divided by 0.5; dropped
    activations become zero. If [2,4] receives mask [keep,drop], the result is [4,0]. The scaling preserves the
    expected activation over repeated masks, not each individual output. During ordinary evaluation, dropout is
    disabled and this inverted-dropout convention needs no extra scaling. Deliberate stochastic inference methods
    use different procedures and should state them explicitly.
  bridges: []
- id: residuals-normalization-dropout.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.residuals-normalization-dropout
  title: Trace one block without mixing the helpers
  markdown: 'A particular transformer may normalize before a sublayer, apply a learned transformation, and add a
    residual route; other designs place operations differently. Read the specified architecture before tracing numbers.
    Use three questions: which values are added, which group supplies normalization statistics, and which contributions
    are randomly masked? For memory, imagine a side road, a measuring ruler, and temporary covered windows. Those
    pictures help distinguish the roles, while the equations specify what each actually does.'
  text_mode: 'A particular transformer may normalize before a sublayer, apply a learned transformation, and add
    a residual route; other designs place operations differently. Read the specified architecture before tracing
    numbers. Use three questions: which values are added, which group supplies normalization statistics, and which
    contributions are randomly masked? For memory, imagine a side road, a measuring ruler, and temporary covered
    windows. Those pictures help distinguish the roles, while the equations specify what each actually does.'
  bridges: []
- id: residuals-normalization-dropout.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.residuals-normalization-dropout
  title: Catch the probability mix-up
  markdown: Layer normalization turns [2,4] into the toy normalized values [−1,1]. Why is it wrong to call these
    token probabilities?
  text_mode: Layer normalization turns [2,4] into the toy normalized values [−1,1]. Why is it wrong to call these
    token probabilities?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: They include a negative value and normalization here is not softmax.
    - id: b
      text: They must first be sorted alphabetically.
    - id: c
      text: Every pair of normalized numbers is a valid probability distribution.
    answer: a
    reveal_markdown: Layer normalization rescales features around a reference. Probabilities must be nonnegative
      and sum to one; this operation has a different purpose.
    hint: Trace the example using the rule from the preceding pages.
    id: residuals-normalization-dropout.practice.v2.7
