lesson:
  id: residuals-normalization-dropout
  version: 0.4.0-draft
  title: Help information and learning signals travel
  state: draft
  summary: In 2015 a 56-layer network trained worse than a 20-layer one. Meet the three small tricks, a shortcut, a rescale, and a random silence, that made 100-layer networks work.
  slot: M11.6
  category: learning
  sources:
    - title: "He, Zhang, Ren & Sun — Deep Residual Learning for Image Recognition (2015)"
      url: https://arxiv.org/abs/1512.03385
    - title: Ba, Kiros, Hinton — Layer Normalization
      url: https://arxiv.org/abs/1607.06450
    - title: "Srivastava et al. — Dropout: A Simple Way to Prevent Neural Networks from Overfitting (JMLR, 2014)"
      url: https://jmlr.org/papers/v15/srivastava14a.html
    - title: Dive into Deep Learning — dropout
      url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html
    - title: Vaswani et al. — Attention Is All You Need
      url: https://arxiv.org/abs/1706.03762
  archetype: mechanism
