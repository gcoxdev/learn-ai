lesson:
  id: residuals-normalization-dropout
  version: 0.2.0-draft
  title: Help information and learning signals travel
  state: draft
  summary: 'Follow three training helpers through tiny numbers: a shortcut, a scale adjustment, and a temporary
    hide-and-seek game.'
  slot: M11.6
  category: learning
  sources:
  - title: Ba, Kiros, Hinton — Layer Normalization
    url: https://arxiv.org/abs/1607.06450
  - title: Dive into Deep Learning — dropout
    url: https://d2l.ai/chapter_multilayer-perceptrons/dropout.html
  - title: Vaswani et al. — Attention Is All You Need
    url: https://arxiv.org/abs/1706.03762
  archetype: mechanism
objectives:
- id: objective.residuals-normalization-dropout
  version: 2-draft
  statement: Calculate a residual sum, a simple layer normalization, and an inverted-dropout result while distinguishing
    their roles and training/evaluation behavior.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - residuals-normalization-dropout.base.v2
