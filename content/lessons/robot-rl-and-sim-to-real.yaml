schema_version: 0.2-draft
lesson:
  id: robot-rl-and-sim-to-real
  version: 0.4.0-draft
  title: Learn in simulation and test what transfers
  state: draft
  summary: Learning by trial and error would take a real robot arm 23 days of nonstop practice. In simulation it takes minutes. The hard part is making the skill survive the trip back to reality.
  slot: M30.6
  category: learning
  sources:
    - title: "Domain Randomization for Transferring Deep Neural Networks from Simulation to the Real World (Tobin et al., 2017)"
      url: https://arxiv.org/abs/1703.06907
    - title: "Sim-to-Real Transfer of Robotic Control with Dynamics Randomization (Peng et al., 2018)"
      url: https://arxiv.org/abs/1710.06537
    - title: "Solving Rubik's Cube with a Robot Hand (OpenAI, 2019)"
      url: https://arxiv.org/abs/1910.07113
    - title: "Learning to Walk in Minutes Using Massively Parallel Deep Reinforcement Learning (Rudin et al., 2021)"
      url: https://arxiv.org/abs/2109.11978
    - title: "Data-efficient Deep Reinforcement Learning for Dexterous Manipulation (Popov et al., 2017)"
      url: https://arxiv.org/abs/1704.03073
objectives:
  - id: objective.robot-rl-and-sim-to-real
    version: 2-draft
    statement: Estimate the real-robot cost of reinforcement learning, design rewards that are paired with hard safety limits, and explain how domain randomization, system identification, and staged testing close the gap between simulation and reality.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - robot-rl-and-sim-to-real.base.v2
      - robot-rl-and-sim-to-real.transfer.v2
      - robot-rl-and-sim-to-real.calculate
    prerequisites:
      - anyOf:
          - objective.robot-imitation-learning
      - anyOf:
          - objective.model-based-and-partially-observed-rl
scenes:
  - id: robot-rl-and-sim-to-real.s1
    title: 23 days of practice, or 4 minutes
    type: explanation
    depth: intuition
    objective_refs:
      - objective.robot-rl-and-sim-to-real
    markdown: |-
      Imitation needs a human for every demonstration. Reinforcement learning (RL) needs none: Tidy tries, gets a reward, and improves, just like the agents in module 24. The catch is how many tries. Suppose a policy-gradient method such as PPO needs 100 million steps to learn a mug flip, and Tidy acts 50 times a second:

      $$\frac{100{,}000{,}000 \text{ steps}}{50 \text{ steps/s}} = 2{,}000{,}000 \text{ s} \approx 23 \text{ days}$$

      That's 23 days without a break, a reset, a dropped mug, or a worn gear. Real robot RL is possible, but it's slow and expensive.

      A **simulator** is a physics engine that computes what *would* happen: contacts, friction, motor torques, camera images. It never tires, resets instantly, and can run thousands of copies side by side. If a GPU steps 4,096 simulated Tidys together, 100 million steps take about 24,400 batched steps, around 4 minutes at 100 batched steps a second. Rudin et al. (2021) used this kind of massive parallelism to train a four-legged robot to walk in minutes.

      The price is that the simulator is a model, and the policy will learn *its* physics.
    bridges: []
  - id: robot-rl-and-sim-to-real.s3
    title: Reward what you want, block what you must
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.robot-rl-and-sim-to-real
    markdown: |-
      For "put the mug in the rack", a reward of +10 at the end alone is too rare: random flailing almost never gets there. So designers add **shaping** terms that give partial credit along the way:

      | Term | Value | Purpose |
      | --- | --- | --- |
      | Mug in rack | +10 | The actual goal |
      | Gripper closer to mug | +1 per 10 cm gained | Guide early exploration |
      | Motor effort | −0.01 × torque² | Prefer smooth, gentle motion |
      | Collision | −1 | Discourage hitting things |

      Now suppose knocking a glass out of the way is quicker than reaching around it. The policy earns $+10 - 1 = +9$ by crashing through, and the collision penalty turns into a small toll. A penalty only *discourages*. For anything that must never happen, like forces that could hurt someone or motion outside the workspace, use a hard limit enforced outside the policy, in the controller or a safety layer that clips the command.

      :::story The brick that flipped instead of lifting
      In a 2017 DeepMind study (Popov et al.), a simulated arm learned to stack one Lego Duplo brick on another, helped by shaping terms like those above. One term paid out when the brick was lifted, but it measured the height of the wrong point on the brick, a point that also rises when the brick is simply turned over. The agent learned to flip the brick instead of picking it up. It's a classic example of **specification gaming**: optimizing the reward as written, not as meant.
      :::
    bridges: []
  - id: robot-rl-and-sim-to-real.s2
    title: Make the simulator a little wrong on purpose
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.robot-rl-and-sim-to-real
    markdown: |-
      The difference between simulated and real physics is the **reality gap**. A policy trained on one exact simulated counter may depend on its exact friction, say 0.5. The real counter is 0.45, or 0.7 when sticky, and the flip fails.

      **Domain randomization** attacks the gap by training in many slightly different worlds. Each episode draws new values: friction between 0.3 and 0.9, mug mass between 0.2 and 0.5 kg, motor delay between 10 and 40 ms, random lighting and colors. A policy that succeeds across all of them can't depend on any one value, and the real kitchen looks like just one more draw.

      - **Tobin et al. (2017)** randomized textures, lighting, and camera placement in rendered scenes. An object detector trained only on those images located real objects well enough for a real robot to grasp them.
      - **Peng et al. (2018)** randomized dynamics (masses, friction, damping, delays) and transferred a pushing policy to a real arm without training on it.

      :::predict Tidy trains with friction drawn from 0.3–0.9. The real counter is wet, with friction 0.15. What do you expect?
      Trouble. 0.15 lies outside anything the policy practiced on, so it may push too hard and send the mug skidding. Randomization covers the range you choose, so the range must include the conditions you'll meet.
      :::

      :::story A robot hand and a Rubik's cube
      In 2019, OpenAI trained a Shadow Dexterous Hand, entirely in simulation, to manipulate a Rubik's cube in its fingers. A standard solving algorithm chose the moves; the learned policy did the hard physical part. Their **automatic domain randomization** widened each range whenever the policy mastered the current one. On the real hand it solved the cube about 60% of the time, and 20% for the hardest scrambles.
      :::
    bridges: []
  - id: robot-rl-and-sim-to-real.sysid
    title: Measure the real robot first
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.robot-rl-and-sim-to-real
    markdown: |-
      Randomizing blindly over huge ranges makes learning harder: a policy that must work on ice *and* sandpaper plays it safe everywhere. So first measure the real thing. Fitting a simulator's parameters to real measurements is **system identification**.

      Tidy's team puts a 0.3 kg mug on the counter and pulls it sideways with a force gauge. It starts to slide at 1.5 N. The mug presses down with $0.3 \times 9.81 = 2.94$ N, so the static friction coefficient is

      $$\mu = \frac{1.5}{2.94} \approx 0.51$$

      They also time the motors: a command takes about 30 ms to show up as motion. Now the simulator uses friction near 0.51 and a 30 ms delay, and randomization only has to cover the spread around those values, say 0.4–0.65 and 20–40 ms, not the whole universe.
    bridges: []
  - id: robot-rl-and-sim-to-real.s4
    title: Find which gap is biting
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.robot-rl-and-sim-to-real
    markdown: |-
      Tidy's first mug-flip policy, trained before anyone measured the motors, succeeds 95% of the time in simulation and 60% on the real robot. Rather than guess why, the team reintroduces one real-world effect at a time *in simulation*:

      | Test | Success |
      | --- | ---: |
      | Simulation as trained | 95% |
      | + 30 ms extra motor delay | 72% |
      | + real camera noise | 91% |
      | Real robot | 60% |

      Delay explains most of the drop, so the next step is to randomize delay during training (or speed up the control loop), not to collect more images. Each real trial runs with a force limit and an emergency stop ready, because a policy fresh from simulation hasn't yet met the real world.
    bridges: []
  - id: robot-rl-and-sim-to-real.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.robot-rl-and-sim-to-real
    markdown: Work out how long real-robot training would take, then advise a walking robot on ice, a grasping reward that gets fooled, and a detector that only knows one kitchen.
    takeaway: |-
      Simulation makes RL's millions of tries affordable, but the policy learns the simulator's physics. Measure the real robot, randomize around it, keep hard safety limits outside the reward, and test which gap remains.
  - id: robot-rl-and-sim-to-real.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.robot-rl-and-sim-to-real
    markdown: |-
      Simulation provides practice under chosen assumptions. Test which skills transfer to real sensing, timing, contact, and dynamics; high simulated reward alone does not establish that transfer.
