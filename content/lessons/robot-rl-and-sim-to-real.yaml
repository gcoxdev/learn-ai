assessment_families:
  - id: robot-rl-and-sim-to-real.base
    objective_ref: objective.robot-rl-and-sim-to-real
    task: base
    response_type: single_choice
    points: 1
    hint: 'Randomize plausible conditions: trace the inputs, operation, and result before choosing.'
    remediation_scene: robot-rl-and-sim-to-real.s2
    variants:
      - id: robot-rl-and-sim-to-real.base.1
        prompt: Can a policy exploit simulator inaccuracies?
        options:
          - id: b
            text: 'No'
          - id: c
            text: Only if no reward exists
          - id: a
            text: 'Yes'
        answer: a
        feedback: Optimization can discover unrealistic shortcuts.
        retired: true
      - id: robot-rl-and-sim-to-real.base.2
        prompt: What does domain randomization vary?
        options:
          - id: c
            text: Every possible law of physics without limits
          - id: a
            text: Selected environment and sensing parameters during training
          - id: b
            text: Only lesson names
        answer: a
        feedback: Variation targets anticipated transfer differences.
        retired: true
  - id: robot-rl-and-sim-to-real.transfer
    objective_ref: objective.robot-rl-and-sim-to-real
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Transfer through staged evidence: trace the inputs, operation, and result before choosing.'
    remediation_scene: robot-rl-and-sim-to-real.s4
    variants:
      - id: robot-rl-and-sim-to-real.transfer.1
        prompt: Does a collision penalty guarantee a strict no-collision constraint?
        options:
          - id: c
            text: Only if written in the reward
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Soft incentives and enforced constraints differ.
        retired: true
      - id: robot-rl-and-sim-to-real.transfer.2
        prompt: Why separate sensing and dynamics gaps during diagnosis?
        options:
          - id: a
            text: They require different corrective evidence and changes
          - id: b
            text: All transfer failures have one cause
          - id: c
            text: Only model size can fix transfer
        answer: a
        feedback: The failed interface determines the remedy.
        retired: true
  - id: robot-rl-and-sim-to-real.base.v2
    objective_ref: objective.robot-rl-and-sim-to-real
    task: base
    response_type: single_choice
    points: 1
    hint: "Separate the tools: rewards encourage, hard limits forbid; randomization covers a range; system identification finds the center of that range."
    remediation_scene: robot-rl-and-sim-to-real.s2
    variants:
      - id: robot-rl-and-sim-to-real.base.v2.1
        prompt: A reaching task gives +10 for reaching the target and −1 per collision. The trained policy knocks objects aside instead of going around them. What is the best fix?
        options:
          - id: b
            text: Raise the target reward so the robot values reaching more
          - id: a
            text: Enforce collision limits in the controller, outside the reward
          - id: c
            text: Remove the collision penalty so the reward signal is cleaner
        answer: a
        feedback: Crashing through still nets +9, so the penalty is just a toll. Anything that must never happen belongs in a hard limit the policy can't override. A bigger target reward makes the shortcut even more attractive.
      - id: robot-rl-and-sim-to-real.base.v2.2
        prompt: Why does training across many randomized friction values help a policy work on a real robot?
        options:
          - id: c
            text: It makes the simulator's friction model more accurate
          - id: b
            text: It lets the policy measure the real friction value exactly
          - id: a
            text: The real friction becomes one more case the policy has seen
        answer: a
        feedback: A policy that succeeds across a range of frictions can't rely on any single value, so reality, if it falls inside the range, is familiar. The simulator's model stays the same, and the policy never measures friction exactly.
      - id: robot-rl-and-sim-to-real.base.v2.3
        prompt: What does system identification do in a sim-to-real project?
        options:
          - id: a
            text: It fits the simulator's parameters to measurements of the real robot
          - id: b
            text: It records which robot model and serial number is being used
          - id: c
            text: It widens every randomization range as far as training allows
        answer: a
        feedback: System identification measures real quantities, like friction or motor delay, and sets the simulator to match, so randomization only needs to cover the spread around them. Widening every range is the opposite approach.
      - id: robot-rl-and-sim-to-real.base.v2.4
        prompt: A policy scores 95% in simulation and 60% on the real robot. Adding 30 ms of motor delay in simulation drops it to 72%; adding camera noise drops it to 91%. What should the team work on first?
        options:
          - id: b
            text: Collecting more real camera images to retrain the vision part
          - id: a
            text: Motor delay, by randomizing it in training or speeding up control
          - id: c
            text: Nothing yet, since simulation scores always drop on hardware
        answer: a
        feedback: Delay alone costs 23 points, while camera noise costs 4, so delay is the main gap. Retraining vision targets the smaller cause, and the ablation shows the drop has a specific, fixable source.
  - id: robot-rl-and-sim-to-real.transfer.v2
    objective_ref: objective.robot-rl-and-sim-to-real
    task: transfer
    response_type: single_choice
    points: 1
    hint: "Ask where the gap is: is the real condition outside the range trained on, is the reward measuring the wrong thing, or is real-world practice simply too slow?"
    remediation_scene: robot-rl-and-sim-to-real.s4
    variants:
      - id: robot-rl-and-sim-to-real.transfer.v2.1
        prompt: A walking robot was trained with ground friction randomized between 0.6 and 1.0. On an icy path (friction about 0.1) it falls. What is the most direct fix?
        options:
          - id: a
            text: Widen training to include low-friction ground like ice
          - id: b
            text: Train longer with the same friction range as before
          - id: c
            text: Lower the reward for falling so it takes fewer risks
        answer: a
        feedback: Ice lies far outside anything the policy practiced on. Randomization covers only the range you choose, so extend it (ideally after measuring real icy friction). More training in the same range doesn't add icy experience.
      - id: robot-rl-and-sim-to-real.transfer.v2.2
        prompt: A team plans to train a door-opening policy with 10 million steps of RL directly on one real robot at 10 Hz. About how long is that, and what is a common alternative?
        options:
          - id: c
            text: About 12 hours; run it overnight on the real robot
          - id: a
            text: About 12 days nonstop; train in parallel simulation first
          - id: b
            text: About 12 days; lower the rate to 1 Hz to finish sooner
        answer: a
        feedback: 10,000,000 / 10 = 1,000,000 s ≈ 11.6 days of nonstop operation, before resets and repairs. Parallel simulation makes those steps cheap. Lowering the rate means fewer steps per second, so it would take longer.
      - id: robot-rl-and-sim-to-real.transfer.v2.3
        prompt: A grasping policy is rewarded when a camera sees the object inside the gripper. It learns to hover the open gripper between the camera and the object. What is the best fix?
        options:
          - id: b
            text: Add a second camera so the reward gets a clearer view
          - id: c
            text: Increase the reward so the policy tries harder to grasp
          - id: a
            text: Reward a check that needs a real grasp, like lifting it
        answer: a
        feedback: This is specification gaming; the policy maximized the reward as written. Rewarding something only a real grasp can produce, like the object rising or the wrist feeling its weight, removes the loophole. A bigger reward just pays more for the trick.
      - id: robot-rl-and-sim-to-real.transfer.v2.4
        prompt: An object detector trained on photorealistic renders of one simulated kitchen fails in a real kitchen with different countertops and lighting. What approach fits best?
        options:
          - id: a
            text: Render training images with randomized textures, colors, and lighting
          - id: b
            text: Render the one simulated kitchen at higher resolution and detail
          - id: c
            text: Train longer on the same renders until the detector is more confident
        answer: a
        feedback: Tobin et al. showed that varying textures, lighting, and camera placement lets a detector trained only on renders work on real images; the real kitchen becomes one more variation. More detail of a single kitchen still teaches only that kitchen.
  - id: robot-rl-and-sim-to-real.calculate
    objective_ref: objective.robot-rl-and-sim-to-real
    task: base
    response_type: numeric
    points: 1
    hint: "Divide the steps by the steps per second to get seconds (divided by the number of robots, if they share the work), then divide by 3,600 for hours."
    remediation_scene: robot-rl-and-sim-to-real.s1
    absolute_tolerance: 0.1
    variants:
      - id: robot-rl-and-sim-to-real.calculate.1
        prompt: An RL method needs 1,000,000 steps, and a real robot acts at 50 Hz. How many hours of nonstop operation is that?
        answer: 5.56
        feedback: "1,000,000 / 50 = 20,000 s, and 20,000 / 3,600 ≈ 5.56 hours."
      - id: robot-rl-and-sim-to-real.calculate.2
        prompt: An RL method needs 36,000,000 steps, and a real robot acts at 100 Hz. How many hours of nonstop operation is that?
        answer: 100
        feedback: "36,000,000 / 100 = 360,000 s, and 360,000 / 3,600 = 100 hours, more than 4 days."
      - id: robot-rl-and-sim-to-real.calculate.3
        prompt: An RL method needs 180,000 steps, and a real robot acts at 10 Hz. How many hours of nonstop operation is that?
        answer: 5
        feedback: "180,000 / 10 = 18,000 s, and 18,000 / 3,600 = 5 hours."
      - id: robot-rl-and-sim-to-real.calculate.4
        prompt: An RL method needs 7,200,000 steps, and a real robot acts at 20 Hz. How many hours of nonstop operation is that?
        answer: 100
        feedback: "7,200,000 / 20 = 360,000 s, and 360,000 / 3,600 = 100 hours."
      - id: robot-rl-and-sim-to-real.calculate.5
        prompt: An RL method needs 3,600,000 steps. Ten identical real robots share the work, each acting at 50 Hz. How many hours does training take?
        answer: 2
        feedback: "Together they take 10 × 50 = 500 steps per second. 3,600,000 / 500 = 7,200 s = 2 hours."
