schema_version: 0.2-draft
lesson:
  id: robot-rl-and-sim-to-real
  version: 0.3.0-draft
  title: Learn in simulation and test what transfers
  state: draft
  summary: Learn in a simulated world, then measure where reality differs.
  slot: M30.6
  category: learning
  sources:
  - title: Domain Randomization
    url: https://arxiv.org/abs/1703.06907
  - title: Dynamics Randomization
    url: https://arxiv.org/abs/1710.06537
objectives:
- id: objective.robot-rl-and-sim-to-real
  version: 1-draft
  statement: Robotic RL uses rewards and interaction to improve control; simulation and domain randomization
    can reduce physical data demands, but transfer depends on dynamics, sensing, and coverage.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - robot-rl-and-sim-to-real.base
  - robot-rl-and-sim-to-real.transfer
  prerequisites:
  - anyOf:
    - objective.robot-imitation-learning
  - anyOf:
    - objective.model-based-and-partially-observed-rl
scenes:
- id: robot-rl-and-sim-to-real.s1
  title: Use simulation for controlled experience
  type: explanation
  depth: intuition
  objective_refs:
  - objective.robot-rl-and-sim-to-real
  markdown: A simulator can provide repeatable resets, varied scenarios, and many interactions without identical
    physical wear. It approximates geometry, contact, sensors, and dynamics. A policy can exploit those approximations,
    so simulated return is not the final measure of real-world competence.
  text_mode: A simulator can provide repeatable resets, varied scenarios, and many interactions without identical
    physical wear. It approximates geometry, contact, sensors, and dynamics. A policy can exploit those approximations,
    so simulated return is not the final measure of real-world competence.
  bridges: []
- id: robot-rl-and-sim-to-real.s2
  title: Randomize plausible conditions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.robot-rl-and-sim-to-real
  markdown: 'Domain randomization varies properties such as friction, mass, lighting, camera pose, or delay
    during training. The aim is to reduce dependence on one narrow simulator setting. Wider variation is not
    automatically better: implausible ranges can make learning harder or divert capacity from the intended
    environment.'
  text_mode: 'Domain randomization varies properties such as friction, mass, lighting, camera pose, or delay
    during training. The aim is to reduce dependence on one narrow simulator setting. Wider variation is not
    automatically better: implausible ranges can make learning harder or divert capacity from the intended
    environment.'
  bridges: []
- id: robot-rl-and-sim-to-real.s3
  title: Design rewards and constraints separately
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.robot-rl-and-sim-to-real
  markdown: 'Rewarding progress toward a target can help learning, but a policy may achieve it through unsafe
    collisions if constraints are absent. Penalties alone may be insufficient for strict limits. State which
    boundaries are enforced by controllers or the environment rather than merely encouraged by reward.


    Suppose reaching a target earns 10 points and a collision loses 1. A colliding shortcut can still earn
    9, so the reward does not make collisions impossible. A separately enforced motion limit or collision check
    changes which actions can execute. Meanwhile, if simulated friction is always high, a learned fast turn
    may slip on a real smooth floor. Randomizing friction helps only if the tested range and simulator behavior
    cover the conditions that matter.'
  text_mode: 'Rewarding progress toward a target can help learning, but a policy may achieve it through unsafe
    collisions if constraints are absent. Penalties alone may be insufficient for strict limits. State which
    boundaries are enforced by controllers or the environment rather than merely encouraged by reward.


    Suppose reaching a target earns 10 points and a collision loses 1. A colliding shortcut can still earn
    9, so the reward does not make collisions impossible. A separately enforced motion limit or collision check
    changes which actions can execute. Meanwhile, if simulated friction is always high, a learned fast turn
    may slip on a real smooth floor. Randomizing friction helps only if the tested range and simulator behavior
    cover the conditions that matter.'
  bridges: []
- id: robot-rl-and-sim-to-real.s4
  title: Transfer through staged evidence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.robot-rl-and-sim-to-real
  markdown: Compare simulation tests, controlled physical trials, and held-out conditions with appropriate
    supervision and stop mechanisms. Diagnose perception, dynamics, and timing gaps separately. Use additional
    real data or model calibration when needed; successful transfer is an experimental result, not a property
    guaranteed by the training label.
  text_mode: Compare simulation tests, controlled physical trials, and held-out conditions with appropriate
    supervision and stop mechanisms. Diagnose perception, dynamics, and timing gaps separately. Use additional
    real data or model calibration when needed; successful transfer is an experimental result, not a property
    guaranteed by the training label.
  bridges: []
- id: robot-rl-and-sim-to-real.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.robot-rl-and-sim-to-real
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Simulation provides practice under chosen assumptions. Test which skills transfer to real sensing,
    timing, contact, and dynamics; high simulated reward alone does not establish that transfer.
- id: robot-rl-and-sim-to-real.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.robot-rl-and-sim-to-real
  markdown: Simulation provides practice under chosen assumptions. Test which skills transfer to real sensing,
    timing, contact, and dynamics; high simulated reward alone does not establish that transfer.
  text_mode: Simulation provides practice under chosen assumptions. Test which skills transfer to real sensing,
    timing, contact, and dynamics; high simulated reward alone does not establish that transfer.
