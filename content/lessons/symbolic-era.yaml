schema_version: 0.2-draft
lesson:
  id: symbolic-era
  version: 0.1.0-draft
  title: Symbols, games, and early language programs
  state: draft
  summary: Early symbolic systems showed how search and explicit representations could support reasoning, while
    constrained demonstrations exposed the difficulty of general language and everyday knowledge.
  slot: M01.3
  category: learning
  minutes: 12
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.symbolic-era
  version: 1-draft
  statement: Early symbolic systems showed how search and explicit representations could support reasoning, while
    constrained demonstrations exposed the difficulty of general language and everyday knowledge.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - symbolic-era.base
  - symbolic-era.transfer
  prerequisites:
  - anyOf:
    - objective.early-ai-proposals
scenes:
- id: symbolic-era.s1
  title: Represent a problem so a program can act
  type: explanation
  depth: intuition
  objective_refs:
  - objective.symbolic-era
  markdown: Symbolic programs manipulate explicit objects such as formulas, game positions, and named relations.
    A theorem prover searches for valid rule applications; a game program searches possible moves. The representation
    makes some operations precise, but leaves out details that were not encoded.
  text_mode: Symbolic programs manipulate explicit objects such as formulas, game positions, and named relations.
    A theorem prover searches for valid rule applications; a game program searches possible moves. The representation
    makes some operations precise, but leaves out details that were not encoded.
  bridges: []
- id: symbolic-era.s2
  title: Small worlds made progress visible
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.symbolic-era
  markdown: 'A puzzle has clear legal moves and a goal test. If a search program reaches the goal, success can be
    checked directly. Natural language in an open environment is harder: words have several meanings, missing context
    matters, and the system may lack background knowledge. A constrained domain reduces these difficulties without
    eliminating them everywhere.'
  text_mode: 'A puzzle has clear legal moves and a goal test. If a search program reaches the goal, success can
    be checked directly. Natural language in an open environment is harder: words have several meanings, missing
    context matters, and the system may lack background knowledge. A constrained domain reduces these difficulties
    without eliminating them everywhere.'
  bridges: []
- id: symbolic-era.s3
  title: A dialogue can look deeper than its mechanism
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.symbolic-era
  markdown: Early language programs such as ELIZA used pattern matching and transformations to produce dialogue.
    An illustrative rule might turn “I am tired” into a question about being tired. That response can feel attentive
    while revealing little about a model of the person or the world.
  text_mode: Early language programs such as ELIZA used pattern matching and transformations to produce dialogue.
    An illustrative rule might turn “I am tired” into a question about being tired. That response can feel attentive
    while revealing little about a model of the person or the world.
  bridges: []
- id: symbolic-era.s4
  title: Evaluate the scope of a demonstration
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.symbolic-era
  markdown: Ask what inputs the program accepted, how knowledge was represented, and which failures were outside
    the demonstration. Search and explicit structure remain useful in modern AI. The lesson from narrow success
    is to preserve its conditions when stating a claim, especially when fluent output encourages broader interpretations.
  text_mode: Ask what inputs the program accepted, how knowledge was represented, and which failures were outside
    the demonstration. Search and explicit structure remain useful in modern AI. The lesson from narrow success
    is to preserve its conditions when stating a claim, especially when fluent output encourages broader interpretations.
  bridges: []
- id: symbolic-era.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.symbolic-era
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: symbolic-era.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.symbolic-era
  markdown: Early symbolic systems showed how search and explicit representations could support reasoning, while
    constrained demonstrations exposed the difficulty of general language and everyday knowledge.
  text_mode: Early symbolic systems showed how search and explicit representations could support reasoning, while
    constrained demonstrations exposed the difficulty of general language and everyday knowledge.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - symbolic-era.s1
    - symbolic-era.s2
    - symbolic-era.s3
    - symbolic-era.s4
    - symbolic-era.check
    - symbolic-era.recap
    gate_refs:
    - gate.core
assessment_families:
- id: symbolic-era.base
  objective_ref: objective.symbolic-era
  task: base
  response_type: single_choice
  points: 1
  hint: 'Small worlds made progress visible: trace the inputs, operation, and result before choosing.'
  remediation_scene: symbolic-era.s2
  variants:
  - id: symbolic-era.base.1
    prompt: What does a symbolic theorem prover search over?
    options:
    - id: a
      text: Represented statements and valid rule applications
    - id: b
      text: Only raw pixel brightness
    - id: c
      text: Unrestricted physical experiments without a model
    answer: a
    feedback: The search space is defined by the logical representation and rules.
  - id: symbolic-era.base.2
    prompt: Why are puzzles useful early demonstrations?
    options:
    - id: b
      text: They prove all everyday reasoning solved
    - id: c
      text: They require no representation choices
    - id: a
      text: Their states, actions, and success conditions can be explicit
    answer: a
    feedback: Clear task boundaries make mechanisms and failures easier to inspect.
- id: symbolic-era.transfer
  objective_ref: objective.symbolic-era
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate the scope of a demonstration: trace the inputs, operation, and result before choosing.'
  remediation_scene: symbolic-era.s4
  variants:
  - id: symbolic-era.transfer.1
    prompt: A pattern-matching chatbot responds appropriately to one phrase. What remains unproven?
    options:
    - id: b
      text: That it produced text
    - id: c
      text: That the phrase was an input
    - id: a
      text: General understanding beyond its represented patterns
    answer: a
    feedback: A successful local response is weaker evidence than broad task competence.
  - id: symbolic-era.transfer.2
    prompt: A blocks-world planner fails on a cluttered kitchen. What changed?
    options:
    - id: c
      text: The historical date of the planner
    - id: a
      text: The environment exceeded its representation and assumptions
    - id: b
      text: All search algorithms became mathematically invalid
    answer: a
    feedback: Transfer depends on whether the new task fits the represented world.
