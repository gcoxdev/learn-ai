schema_version: 0.2-draft
lesson:
  id: symbolic-era
  version: 0.3.0-draft
  title: Symbols, games, and early language programs
  state: draft
  summary: Follow facts, rules, and search through a small delivery task, then compare that mechanism with
    early robot and conversation demonstrations.
  slot: M01.3
  category: learning
  sources:
  - title: SRI — Shakey the Robot, 1966–1972
    url: https://www.sri.com/hoi/shakey-the-robot/
  - title: MIT CSAIL — early AI project demonstrations
    url: https://projects.csail.mit.edu/films/aifilms/AIFilms.html
  archetype: perspective
objectives:
- id: objective.symbolic-era
  version: 2-draft
  statement: Explain how symbolic representations support rule-based planning and distinguish a bounded demonstration
    from broader understanding.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - symbolic-era.base.v2
  - symbolic-era.transfer.v2
  prerequisites:
  - anyOf:
    - objective.early-ai-proposals
scenes:
- id: symbolic-era.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.symbolic-era
  title: Describe a world using symbols
  markdown: A **symbol** is a mark or name used to represent something. In a tiny delivery world, names A and
    B can stand for rooms, and “box-in-A” can record the box’s location. A **symbolic system** manipulates
    such descriptions using explicit procedures. It does not need to discover every rule from examples. The
    descriptions make parts of the reasoning easy to inspect, but they simplify the world. A statement that
    the box is in A does not say how heavy it is or whether the doorway is blocked.
  text_mode: A **symbol** is a mark or name used to represent something. In a tiny delivery world, names A
    and B can stand for rooms, and “box-in-A” can record the box’s location. A **symbolic system** manipulates
    such descriptions using explicit procedures. It does not need to discover every rule from examples. The
    descriptions make parts of the reasoning easy to inspect, but they simplify the world. A statement that
    the box is in A does not say how heavy it is or whether the doorway is blocked.
  bridges: []
- id: symbolic-era.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.symbolic-era
  title: Write actions with conditions and effects
  markdown: Suppose a move action is allowed when the robot and box are in the same room and a connecting doorway
    is clear. Its **preconditions** are the conditions that must hold first. Its **effects** describe what
    changes after it succeeds. A **state** records the current relevant situation. Starting with robot-in-A
    and box-in-A, moving the box through a clear doorway can produce robot-in-B and box-in-B. The rule is a
    model of the action; sensors must still check whether the real action worked.
  text_mode: Suppose a move action is allowed when the robot and box are in the same room and a connecting
    doorway is clear. Its **preconditions** are the conditions that must hold first. Its **effects** describe
    what changes after it succeeds. A **state** records the current relevant situation. Starting with robot-in-A
    and box-in-A, moving the box through a clear doorway can produce robot-in-B and box-in-B. The rule is a
    model of the action; sensors must still check whether the real action worked.
  bridges: []
- id: symbolic-era.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.symbolic-era
  title: Search through possible sequences
  markdown: A **plan** is a proposed sequence of actions. **Search** explores alternatives to find one that
    reaches a goal. If the direct A-to-B door is blocked, a planner might try A-to-C followed by C-to-B. A
    **heuristic** is a guiding estimate, such as estimated remaining distance, used to prioritize possibilities.
    It can save effort without supplying a guarantee that every estimate is right. Listing a plan and executing
    it are separate stages; the actual world can change between them.
  text_mode: A **plan** is a proposed sequence of actions. **Search** explores alternatives to find one that
    reaches a goal. If the direct A-to-B door is blocked, a planner might try A-to-C followed by C-to-B. A
    **heuristic** is a guiding estimate, such as estimated remaining distance, used to prioritize possibilities.
    It can save effort without supplying a guarantee that every estimate is right. Listing a plan and executing
    it are separate stages; the actual world can change between them.
  bridges: []
- id: symbolic-era.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.symbolic-era
  title: Read a robot demonstration with its setting attached
  markdown: SRI’s Shakey project, conducted from 1966 to 1972, combined sensing, reasoning, planning, and actions
    involving simple objects. Bringing those parts together let the robot use a plan to act on its surroundings.
    A controlled environment makes it possible to study a mechanism and diagnose failures. Success there does
    not directly establish reliable behavior in crowded homes, bad weather, or unfamiliar buildings. The research
    contribution and the limits of its environment can both be real.
  text_mode: SRI’s Shakey project, conducted from 1966 to 1972, combined sensing, reasoning, planning, and
    actions involving simple objects. Bringing those parts together let the robot use a plan to act on its
    surroundings. A controlled environment makes it possible to study a mechanism and diagnose failures. Success
    there does not directly establish reliable behavior in crowded homes, bad weather, or unfamiliar buildings.
    The research contribution and the limits of its environment can both be real.
  bridges: []
- id: symbolic-era.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.symbolic-era
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A symbolic system reasons over an explicit description. The description, rules, search procedure,
    and observed world can each be a source of error.
- id: symbolic-era.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.symbolic-era
  markdown: Early symbolic systems showed how search and explicit representations could support reasoning,
    while constrained demonstrations exposed the difficulty of general language and everyday knowledge.
  text_mode: Early symbolic systems showed how search and explicit representations could support reasoning,
    while constrained demonstrations exposed the difficulty of general language and everyday knowledge.
- id: symbolic-era.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.symbolic-era
  title: A fluent interaction can use a different mechanism
  markdown: MIT’s ELIZA work in the 1960s demonstrated conversation through pattern-based processing. A toy
    illustration is a rule that notices “I feel …” and returns a question about the supplied phrase. That illustration
    is not a transcript of the historical program; it shows how a response can appear relevant without a general
    model of the speaker’s life. **Pattern matching** looks for specified forms in an input. A helpful way
    to inspect a conversation system is to vary the wording while keeping the intended meaning similar.
  text_mode: MIT’s ELIZA work in the 1960s demonstrated conversation through pattern-based processing. A toy
    illustration is a rule that notices “I feel …” and returns a question about the supplied phrase. That illustration
    is not a transcript of the historical program; it shows how a response can appear relevant without a general
    model of the speaker’s life. **Pattern matching** looks for specified forms in an input. A helpful way
    to inspect a conversation system is to vary the wording while keeping the intended meaning similar.
  bridges: []
- id: symbolic-era.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.symbolic-era
  title: Keep rules and learning in the same larger picture
  markdown: Symbolic methods remain useful when a system needs explicit constraints, plans, or checkable relations.
    Learned perception can supply an estimated object location to a symbolic planner; a planner can then apply
    movement rules. That combination is a **hybrid** system. Neither component makes the other infallible.
    For a failed delivery, inspect whether the location was wrong, a condition was missing, the search chose
    poorly, or execution failed. Checking those steps tells you which part of the system needs improvement.
  text_mode: Symbolic methods remain useful when a system needs explicit constraints, plans, or checkable relations.
    Learned perception can supply an estimated object location to a symbolic planner; a planner can then apply
    movement rules. That combination is a **hybrid** system. Neither component makes the other infallible.
    For a failed delivery, inspect whether the location was wrong, a condition was missing, the search chose
    poorly, or execution failed. Checking those steps tells you which part of the system needs improvement.
  bridges: []
