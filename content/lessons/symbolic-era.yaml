lesson:
  id: symbolic-era
  version: 0.4.0-draft
  title: Symbols, games, and early language programs
  state: draft
  summary: A wobbly robot named Shakey plans its way from room to room, and a tiny chatbot convinces people it understands them. See what symbols can do, and where they run out.
  slot: M01.3
  category: learning
  sources:
    - title: SRI — Shakey the Robot, 1966–1972
      url: https://www.sri.com/hoi/shakey-the-robot/
    - title: MIT CSAIL — early AI project demonstrations
      url: https://projects.csail.mit.edu/films/aifilms/AIFilms.html
    - title: Weizenbaum — ELIZA, a computer program for the study of natural language communication (1966)
      url: https://doi.org/10.1145/365153.365168
  archetype: perspective
objectives:
  - id: objective.symbolic-era
    version: 3-draft
    statement: Explain how symbolic representations support rule-based planning and distinguish a bounded demonstration from broader understanding.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - symbolic-era.base.v3
      - symbolic-era.transfer.v3
    prerequisites:
      - anyOf:
          - objective.early-ai-proposals
scenes:
  - id: symbolic-era.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.symbolic-era
    title: Shakey's world, written in symbols
    markdown: |-
      In 1966, at SRI (then the Stanford Research Institute) in Menlo Park, California, a team began building a robot on wheels with a TV camera, a range finder, and bump sensors. It moved so jerkily that they named it Shakey. Over the next six years it came to roll through a small suite of rooms and push large boxes between them: the first mobile robot able to reason about its own actions.

      Shakey didn't reason about pixels. Its programs worked on **symbols**, names that stand for things, combined into statements like these:

      - `In(Shakey, RoomD)`
      - `In(Box1, RoomA)`
      - `Door(RoomA, RoomC)`

      This was the central bet of the era. Allen Newell and Herbert Simon later stated it boldly (1976): a system that manipulates symbols has "the necessary and sufficient means for general intelligent action." Write the world down in symbols, and intelligence becomes a matter of reasoning about the description.
    bridges: []
  - id: symbolic-era.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.symbolic-era
    title: Every action has a before and an after
    markdown: |-
      To plan, Shakey needs to know what each action requires and what it changes. The STRIPS planner, written for Shakey by Richard Fikes and Nils Nilsson (1971), described every action with two lists:

      | Action | **Preconditions**: must be true first | **Effects**: what changes |
      | --- | --- | --- |
      | `Go(A, C)` | Shakey in A; a door joins A and C | Shakey now in C |
      | `Push(Box1, A, C)` | Shakey and Box1 in A; a door joins A and C | Shakey and Box1 now in C |

      The full set of true statements at a moment is the **state**. Applying an action checks its preconditions against the state, then rewrites the state using its effects. Nothing else changes. That keeps reasoning simple, and fragile: if someone moves the box while Shakey isn't looking, the description is simply wrong.
    bridges: []
  - id: symbolic-era.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.symbolic-era
    title: Search strings actions into a plan
    markdown: |-
      A **plan** is a sequence of actions that turns the starting state into one where the goal holds. Finding one is **search**: try action sequences until the goal is true.

      Below, Shakey starts in room D, the box is in room A, and the goal is to get the box into room B, whose door from A is blocked. The planner uses *breadth-first search*: it tries every 1-step plan, then every 2-step plan, and so on, so the first plan it finds is a shortest one.

      ```python run
      from collections import deque

      open_doors = [("A", "C"), ("C", "B"), ("C", "D")]    # the A-B door is blocked
      doors = sorted(open_doors + [(b, a) for a, b in open_doors])

      def actions(state):
          robot, box = state
          for a, b in doors:
              if a == robot:
                  yield f"go {a}->{b}", (b, box)            # precondition: a door from here
                  if box == robot:                          # precondition: box in same room
                      yield f"push box {a}->{b}", (b, b)    # effect: robot and box both move

      def plan(start, goal_room):
          """Breadth-first search: try every 1-step plan, then every 2-step plan, ..."""
          frontier, seen = deque([(start, [])]), {start}
          while frontier:
              state, steps = frontier.popleft()
              if state[1] == goal_room:
                  return steps, len(seen)
              for name, nxt in actions(state):
                  if nxt not in seen:
                      seen.add(nxt)
                      frontier.append((nxt, steps + [name]))
          return None, len(seen)

      steps, explored = plan(start=("D", "A"), goal_room="B")
      print("plan:", steps)
      print("states discovered:", explored)
      ```

      The planner finds a 4-step detour through room C after discovering 10 states. Add `("A", "B")` to `open_doors` to unblock the door: the plan shrinks to 3 steps and only 6 states are discovered.

      :::predict With 4 rooms, Shakey and one box can each be in any room: 4 × 4 = 16 states. How many states are there with 4 boxes?
      Five objects, each in one of 4 rooms: 4⁵ = 1,024. With 10 rooms and 10 boxes it's 10¹¹, a hundred billion: the combinatorial explosion again. Shakey's team answered it with better search: the A* algorithm (Hart, Nilsson, and Raphael, 1968), which uses a **heuristic**, an estimate of the remaining distance, to try promising routes first. You'll build A* in the search module.
      :::
    bridges: []
  - id: symbolic-era.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.symbolic-era
    title: Tidy rooms and bold predictions
    markdown: |-
      Shakey worked because its world was built for it: plain walls, careful lighting, dark baseboards marking where each wall met the floor, and big boxes painted so their edges were easy to see. Other celebrated programs had the same shape. Terry Winograd's SHRDLU (MIT, around 1970) held impressive typed conversations about a simulated table of blocks, and only about that table.

      Success in small worlds made researchers confident about big ones.

      :::story "Within ten years"
      In 1958 Herbert Simon and Allen Newell predicted that within ten years a digital computer would be the world's chess champion. It took 39. When IBM's Deep Blue beat world champion Garry Kasparov in 1997, it did so mainly by brute force: custom chips searching well over 100 million positions a second, scored with a hand-tuned rule. The prediction wasn't wrong about *whether*; it badly underestimated how far a real problem is from a toy one.
      :::

      A demonstration in a tidy world shows the mechanism works *there*. To claim more, you test in messier worlds: cluttered rooms, bad lighting, boxes that someone else moves.
    bridges: []
  - id: symbolic-era.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.symbolic-era
    markdown: A warehouse robot, a customer-service chatbot, a navigation app, and a home-robot demo ask you to trace symbols, preconditions, and search, and to judge what a demonstration really shows.
    takeaway: |-
      Symbolic systems describe the world in explicit statements, give actions preconditions and effects, and search for a plan. They shine in tidy, well-described worlds and stumble when the world is messier than the description.
  - id: symbolic-era.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.symbolic-era
    markdown: |-
      Early symbolic systems showed how search and explicit representations could support reasoning, while constrained demonstrations exposed the difficulty of general language and everyday knowledge.
  - id: symbolic-era.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.symbolic-era
    title: ELIZA and the illusion of understanding
    markdown: |-
      :::story The secretary who wanted privacy
      At MIT in the mid-1960s, Joseph Weizenbaum wrote ELIZA, described in a 1966 paper. Its best-known script, DOCTOR, imitated a psychotherapist who turns your statements back into questions. Weizenbaum later wrote that his own secretary, who had watched him build it, asked him to leave the room so she could talk to it in private. Alarmed at how readily people confided in a simple program, he became one of AI's sharpest critics.
      :::

      ELIZA used **pattern matching**: look for a keyword pattern such as "I feel ...", then slot the captured words into a canned reply, swapping "my" for "your." Here's a miniature version:

      ```python run
      import re

      SWAP = {"i": "you", "my": "your", "me": "you", "am": "are"}
      RULES = [  # (keyword pattern, reply template); the first match wins
          (r"i feel (.*)", "Why do you feel {0}?"),
          (r"my (mother|father|sister|brother)(.*)", "Tell me more about your family."),
          (r"i am (.*)", "How long have you been {0}?"),
          (r"(.*)", "Please go on."),
      ]

      def reflect(text):
          return " ".join(SWAP.get(word, word) for word in text.split())

      def eliza(sentence):
          s = sentence.lower().strip(".!?")
          for pattern, template in RULES:
              match = re.match(pattern, s)
              if match:
                  return template.format(*[reflect(g) for g in match.groups()])

      for line in ["I feel ignored by my boss.",
                   "My mother never calls.",
                   "I am worried about my exam.",
                   "Nobody listens to me anymore."]:
          print(f"> {line}\n  {eliza(line)}")
      ```

      :::predict What does it reply to "Honestly, I feel terrible"?
      "Please go on." The pattern needs "i feel" at the very start, so one extra word breaks the match. Try it: add the sentence to the list.
      :::

      :::mixup "If the replies fit the conversation, the program understands it."
      The replies fit because *you* supply the meaning. ELIZA keeps no model of your boss, your mother, or you. The tendency to read understanding into fluent text is still called the **ELIZA effect**. To probe it, rephrase the same meaning in a new way and watch what breaks.
      :::
    bridges: []
  - id: symbolic-era.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.symbolic-era
    title: Symbols still plan your route home
    markdown: |-
      Symbolic methods never went away. Your phone's navigation software stores the road network as symbols (roads, junctions, turn restrictions) and uses A*-style search to plan your route, while a learned model estimates traffic. A system that combines explicit rules or search with learned parts is called **hybrid**.

      When such a system fails, ask which part failed. Suppose it sends a driver onto a bridge that closed last week. The search worked perfectly on the map it had; the map's facts were stale. The fix is updating the description, not a smarter search. That's Shakey's lesson, sixty years on.
    bridges: []
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - symbolic-era.s1
        - symbolic-era.s2
        - symbolic-era.s3
