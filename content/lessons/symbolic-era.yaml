assessment_families:
  - id: symbolic-era.base
    objective_ref: objective.symbolic-era
    task: base
    response_type: single_choice
    points: 1
    hint: 'Small worlds made progress visible: trace the inputs, operation, and result before choosing.'
    remediation_scene: symbolic-era.s2
    variants:
      - id: symbolic-era.base.1
        prompt: What does a symbolic theorem prover search over?
        options:
          - id: a
            text: Represented statements and valid rule applications
          - id: b
            text: Only raw pixel brightness
          - id: c
            text: Unrestricted physical experiments without a model
        answer: a
        feedback: The search space is defined by the logical representation and rules.
        retired: true
      - id: symbolic-era.base.2
        prompt: Why are puzzles useful early demonstrations?
        options:
          - id: b
            text: They prove all everyday reasoning solved
          - id: c
            text: They require no representation choices
          - id: a
            text: Their states, actions, and success conditions can be explicit
        answer: a
        feedback: Clear task boundaries make mechanisms and failures easier to inspect.
        retired: true
  - id: symbolic-era.transfer
    objective_ref: objective.symbolic-era
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate the scope of a demonstration: trace the inputs, operation, and result before choosing.'
    remediation_scene: symbolic-era.s4
    variants:
      - id: symbolic-era.transfer.1
        prompt: A pattern-matching chatbot responds appropriately to one phrase. What remains unproven?
        options:
          - id: b
            text: That it produced text
          - id: c
            text: That the phrase was an input
          - id: a
            text: General understanding beyond its represented patterns
        answer: a
        feedback: A successful local response is weaker evidence than broad task competence.
        retired: true
      - id: symbolic-era.transfer.2
        prompt: A blocks-world planner fails on a cluttered kitchen. What changed?
        options:
          - id: c
            text: The historical date of the planner
          - id: a
            text: The environment exceeded its representation and assumptions
          - id: b
            text: All search algorithms became mathematically invalid
        answer: a
        feedback: Transfer depends on whether the new task fits the represented world.
        retired: true
  - id: symbolic-era.base.v2
    objective_ref: objective.symbolic-era
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: symbolic-era.s3
    variants:
      - prompt: An action moves a box only if its doorway is clear. What role does doorway-clear play?
        answer: a
        options:
          - id: b
            text: An effect created by moving the box
          - id: c
            text: A goal automatically reached by writing the action
          - id: a
            text: A precondition that must hold before the action
        feedback: Preconditions are requirements for applying an action.
        id: symbolic-era.base.v2.1
        retired: true
      - prompt: A planner records robot-in-A before trying routes. What is it recording?
        answer: a
        options:
          - id: c
            text: An observation of every property of the robot
          - id: a
            text: Part of the current represented state
          - id: b
            text: A guarantee about the next action’s success
        feedback: A state describes selected relevant facts, not the whole world.
        id: symbolic-era.base.v2.2
        retired: true
      - prompt: A planner tries A-to-C-to-B after rejecting A-to-B. Which operation is it performing?
        answer: a
        options:
          - id: a
            text: Search over candidate action sequences
          - id: b
            text: Learning new weights from labeled routes
          - id: c
            text: Executing the selected moves in the real building
        feedback: Trying alternatives in a representation is search; execution still needs to happen.
        id: symbolic-era.base.v2.3
        retired: true
      - prompt: After a modeled move succeeds, box-in-A becomes box-in-B. What is this change?
        answer: a
        options:
          - id: b
            text: A precondition required before moving
          - id: c
            text: A heuristic estimate of remaining work
          - id: a
            text: An effect of the action
        feedback: Effects specify the changes modeled as following an action.
        id: symbolic-era.base.v2.4
        retired: true
  - id: symbolic-era.transfer.v2
    objective_ref: objective.symbolic-era
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: symbolic-era.s3
    variants:
      - prompt: A robot works in a tidy test room. What evidence is needed for a claim about busy homes?
        answer: a
        options:
          - id: b
            text: A longer description of the tidy-room route
          - id: c
            text: More repetitions of the identical tidy-room trial
          - id: a
            text: Tests covering the additional conditions in homes
        feedback: The claimed environment changes what evidence is needed.
        id: symbolic-era.transfer.v2.1
        retired: true
      - prompt: A pattern-based reply sounds relevant to one sentence. What probes its limits?
        answer: a
        options:
          - id: c
            text: Use the relevance of one reply to infer its internal experience
          - id: a
            text: Rephrase the same meaning and inspect how the response changes
          - id: b
            text: Repeat the identical sentence to count the same successful match
        feedback: Controlled variations help separate a pattern match from broader behavior.
        id: symbolic-era.transfer.v2.2
        retired: true
      - prompt: A planner’s logic is correct but the box location supplied by perception is wrong. Where is the observed problem?
        answer: a
        options:
          - id: a
            text: At the observation feeding the plan
          - id: b
            text: In the meaning of a logically valid action sequence
          - id: c
            text: In the proof that the box must occupy the recorded room
        feedback: Planning depends on the accuracy of its input representation.
        id: symbolic-era.transfer.v2.3
        retired: true
      - prompt: An action plan was valid when computed, but a door is now blocked. What should execution do?
        answer: a
        options:
          - id: b
            text: Treat the earlier plan as a current sensor reading
          - id: c
            text: Change the goal name while executing the old moves
          - id: a
            text: Check the changed state and revise the plan if necessary
        feedback: A plan can become unsuitable when its preconditions no longer hold.
        id: symbolic-era.transfer.v2.4
        retired: true
  - id: symbolic-era.base.v3
    objective_ref: objective.symbolic-era
    task: base
    response_type: single_choice
    points: 1
    hint: Picture the planner's description of the world. Preconditions are checked before an action, effects rewrite the state after it, and search tries sequences until the goal holds.
    remediation_scene: symbolic-era.s2
    variants:
      - id: symbolic-era.base.v3.1
        prompt: 'A planner''s action Unlock(Door) needs HasKey and AtDoor to be true, and afterward DoorOpen is true. What role does HasKey play?'
        options:
          - id: a
            text: An effect that becomes true after unlocking
          - id: b
            text: A goal the planner is trying to reach
          - id: c
            text: A precondition checked before unlocking
        answer: c
        feedback: HasKey must hold before the action can be applied, so it's a precondition. DoorOpen is the effect; confusing the two is the most common slip when reading an action description.
      - id: symbolic-era.base.v3.2
        prompt: A warehouse has 5 rooms. A robot and 2 boxes can each be in any room. How many different states can the planner's description take?
        options:
          - id: a
            text: '125'
          - id: b
            text: '15'
          - id: c
            text: '25'
        answer: a
        feedback: Each of the 3 objects has 5 possible rooms, so 5 × 5 × 5 = 5³ = 125. Adding 5 + 5 + 5 = 15 treats the objects as if their positions didn't combine.
      - id: symbolic-era.base.v3.3
        prompt: A planner produced a valid plan to push a box from room A to room B. Before the robot got there, a person moved the box to room C. Why does the plan fail?
        options:
          - id: a
            text: The search should have found a shorter plan
          - id: b
            text: The stored state no longer matches the real world
          - id: c
            text: The Push action was given the wrong effects
        answer: b
        feedback: The plan was correct for the description it was given, but the description went stale when the box moved. The fix is to sense again and replan; a different search or new effects wouldn't help.
      - id: symbolic-era.base.v3.4
        prompt: A breadth-first planner returns a 4-step plan even though a 6-step plan also reaches the goal. Why does it return the 4-step plan?
        options:
          - id: a
            text: It tries all shorter plans before any longer ones
          - id: b
            text: It uses a heuristic that prefers fewer steps
          - id: c
            text: It picks the plan with the fewest rooms visited
        answer: a
        feedback: Breadth-first search finishes every 1-step, 2-step, and 3-step plan before trying 4-step ones, so the first plan it finds is a shortest one. No heuristic is involved; that's what A* adds.
  - id: symbolic-era.transfer.v3
    objective_ref: objective.symbolic-era
    task: transfer
    response_type: single_choice
    points: 1
    hint: A demonstration shows what works in the world where it was tested. Ask what was different about that world, and which part of the system (facts, rules, search, or patterns) the new situation strains.
    remediation_scene: symbolic-era.s5
    variants:
      - id: symbolic-era.transfer.v3.1
        prompt: 'A support chatbot answers "I feel frustrated with my order" sensibly, but replies "Please go on" to "Honestly, my order has me frustrated." What best explains the difference?'
        options:
          - id: a
            text: It needs a few more example sentences to learn from
          - id: b
            text: It matches keyword patterns, and the rephrasing misses them
          - id: c
            text: It understood both but judged the second less urgent
        answer: b
        feedback: Same meaning, different wording, different reply is the signature of pattern matching, as in ELIZA. The program has no model of the customer's situation, so it can't judge urgency at all.
      - id: symbolic-era.transfer.v3.2
        prompt: A home robot tidies toys flawlessly in the company's demo room, which has bright lighting and a bare floor. The ad says it "works in any home." What would test that claim?
        options:
          - id: a
            text: Trials in varied real homes with clutter and dim light
          - id: b
            text: Many more repeat runs in the same demo room
          - id: c
            text: A longer video of the demo room from other angles
        answer: a
        feedback: Like Shakey's painted boxes, the demo room was built for success. Repeating the same conditions tells you nothing new; only messier homes test the broader claim.
      - id: symbolic-era.transfer.v3.3
        prompt: A navigation app combines a road map, a route search, and a learned traffic model. It sends a driver onto a bridge that closed last week. Which part most likely failed?
        options:
          - id: a
            text: The route search, which should have avoided long delays
          - id: b
            text: The traffic model, which should have predicted the closure
          - id: c
            text: The map's facts, which still list the bridge as open
        answer: c
        feedback: The search did its job on the map it had; the stored facts were stale. A traffic model estimates speeds, but it won't remove a road the map still lists as open.
      - id: symbolic-era.transfer.v3.4
        prompt: In 1958 Simon and Newell predicted a computer chess champion within ten years. It took until 1997. What best explains the gap?
        options:
          - id: a
            text: Chess researchers stopped working on the problem until the 1990s
          - id: b
            text: Small-world successes hid how much search real chess would need
          - id: c
            text: The rules of chess had to be simplified before computers could play
        answer: b
        feedback: Early successes came in tidy, small problems, and chess's search space was vastly larger. Deep Blue needed custom chips searching well over 100 million positions a second; research never stopped, and the rules never changed.
