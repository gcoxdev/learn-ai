assessment_families:
- id: algebra-notation.base
  objective_ref: objective.algebra-notation
  task: base
  response_type: single_choice
  points: 1
  hint: 'Substitute before simplifying: trace the inputs, operation, and result before choosing.'
  remediation_scene: algebra-notation.s2
  variants:
  - id: algebra-notation.base.1
    prompt: For w = 3, x = 2, b = 4, what is w × x + b?
    options:
    - id: c
      text: '9'
    - id: a
      text: '10'
    - id: b
      text: '18'
    answer: a
    feedback: Multiply 3 by 2, then add 4.
    retired: true
  - id: algebra-notation.base.2
    prompt: For x = [4, 8, 9], using one-based indexing, what is x₂?
    options:
    - id: a
      text: '8'
    - id: b
      text: '16'
    - id: c
      text: '2'
    answer: a
    feedback: A subscript identifies an entry; it is not an exponent.
    retired: true
- id: algebra-notation.transfer
  objective_ref: objective.algebra-notation
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Read a model expression aloud: trace the inputs, operation, and result before choosing.'
  remediation_scene: algebra-notation.s4
  variants:
  - id: algebra-notation.transfer.1
    prompt: A score is 2 × x + 3 and must equal 11. Which input satisfies it?
    options:
    - id: a
      text: '4'
    - id: b
      text: '7'
    - id: c
      text: '14'
    answer: a
    feedback: 'Subtract 3 and divide by 2: x = 4.'
    retired: true
  - id: algebra-notation.transfer.2
    prompt: Inputs [1, 2] have weights [3, 4] and bias −1. What is the weighted sum?
    options:
    - id: b
      text: '11'
    - id: c
      text: '20'
    - id: a
      text: '10'
    answer: a
    feedback: The matching products are 3 and 8; adding the bias gives 10.
    retired: true
