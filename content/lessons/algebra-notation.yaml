schema_version: 0.2-draft
lesson:
  id: algebra-notation
  version: 0.3.0-draft
  title: Read an equation one symbol at a time
  state: draft
  summary: "Papers write a neuron as Σ wᵢxᵢ + b and expect you to just read it. Learn to read letters, small labels, and Σ aloud, then turn them into plain arithmetic."
  slot: B02
  category: bridge
  sources:
    - title: OpenStax — use the language of algebra
      url: https://openstax.org/books/elementary-algebra-2e/pages/1-2-use-the-language-of-algebra
    - title: Dive into Deep Learning — linear algebra
      url: https://d2l.ai/chapter_preliminaries/linear-algebra.html
  archetype: foundation
objectives:
  - id: objective.algebra-notation
    version: 3-draft
    statement: Substitute numbers into a short formula such as y = wx + b, and work out an indexed weighted sum by pairing each input with its own weight.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - algebra-notation.base.v3
      - algebra-notation.transfer.v3
    prerequisites:
      - anyOf:
          - objective.arithmetic
scenes:
  - id: algebra-notation.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.algebra-notation
    title: Letters are labels for quantities
    markdown: |-
      You're planning snacks: 2 crackers for each guest, plus 3 spare. With 4 guests that's 2 × 4 + 3 = 11. With 10 guests, 2 × 10 + 3 = 23. Rather than rewrite the plan for every party, let the letter x stand for the number of guests:

      $$2 \times x + 3$$

      A **variable** is a letter that names a quantity whose value can change. An **expression** is a calculation written with numbers, variables, and operations. Read this one aloud: "two times the guest count, plus three."

      **Why AI needs this:** papers and code describe models this way. The lesson "Inside an artificial neuron" writes a whole neuron as $\sum_i w_i x_i + b$, and by the end of this page you'll read that easily.

      | You see | Say | Means |
      | --- | --- | --- |
      | 2x | "two x" | 2 × x (writing a number or letter right beside a letter means multiply, so wx is w × x) |
      | x₂ | "x two" or "x sub two" | the second x in a list |
      | x² | "x squared" | x × x |
      | Σ | "sum" | add up a list of numbers |
  - id: algebra-notation.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.algebra-notation
    title: An equation says two amounts are equal
    markdown: |-
      An **equation** puts an equals sign between two expressions. Writing y = 2x + 3 says "y has the same value as 2x + 3," so once you know x, you know y.

      Code borrows the sign with a different meaning. In Python, `y = 2 * x + 3` means "work out the right side and store it in y," and `==` is the question "are these equal?" In math, = is always a statement that both sides match.
    bridges:
      - arithmetic
  - id: algebra-notation.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.algebra-notation
    title: Substitute, then follow the order
    markdown: |-
      To **substitute** is to replace a letter with its value. For x = 4:

      1. Write it out: y = 2 × 4 + 3.
      2. Multiply first: 2 × 4 = 8.
      3. Then add: 8 + 3 = 11.

      Parentheses change the order: 2 × (4 + 3) = 2 × 7 = 14. In 2x + 3, the 2 is the **coefficient** (the number multiplying the variable) and the 3 is the **constant** (a fixed amount that doesn't depend on x).
    bridges: []
  - id: algebra-notation.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.algebra-notation
    title: Inputs and settings play different roles
    markdown: |-
      Machine learning writes the same shape as y = wx + b. Here x is the **input** (a fact about one example), w is a **weight** (a setting that multiplies the input), and b is a **bias** (a setting added at the end). Training adjusts w and b; each new example brings a new x.

      With w = 3, x = 2, and b = 1: the **product** wx (the result of multiplying w by x) is 3 × 2 = 6, so y = 6 + 1 = 7.

      A second example, with a decimal and a negative: w = 0.5, x = 6, b = −2 gives wx = 3, so y = 3 + (−2) = 1.

      :::predict Keep w = 3 and b = 1 but change x to 5. Then, separately, keep x = 2 and change w to 4. What is y each time?
      New input: y = 3 × 5 + 1 = 16. New weight: y = 4 × 2 + 1 = 9. Changing x asks the same rule about a different example. Changing w changes the rule itself, which is exactly what training does.
      :::

      The roles come from the problem, not the letters. Another author could write the same model as y = ax + c.
    bridges: []
  - id: algebra-notation.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.algebra-notation
    title: Small labels pick out entries
    markdown: |-
      Real models have many inputs, so they number them: x₁, x₂, x₃. The small numbers are **indices** (singular: index), labels that pick an entry out of a list. Each input gets its own weight with the same index.

      The Greek capital sigma, Σ, means "add these up." Read $\sum_{i=1}^{3} w_i x_i$ as "for i = 1, 2, 3, multiply wᵢ by xᵢ, then add the three results."

      **Worked example.** Let w = [3, 1, −2], x = [2, 5, 1], and b = 0.5.

      | i | wᵢ | xᵢ | wᵢxᵢ |
      | ---: | ---: | ---: | ---: |
      | 1 | 3 | 2 | 6 |
      | 2 | 1 | 5 | 5 |
      | 3 | −2 | 1 | −2 |

      The sum is 6 + 5 − 2 = 9, and adding the bias gives 9.5. That's one artificial neuron's score.

      :::mixup "x₂ means x squared, or x times 2."
      A low index is a *label*: x₂ is simply the second input, 5 here. A raised ² is a power. Mixing them up would turn 5 into 25 or 10.
      :::

      In Python, lists count from 0, so x₁ lives at `x[0]`. Run this, then change `b` to −1 and predict the new total before you run it again.

      ```python run
      w = [3, 1, -2]      # w₁, w₂, w₃
      x = [2, 5, 1]       # x₁, x₂, x₃
      b = 0.5

      total = 0
      for i in range(3):              # Python counts from 0, so i is 0, 1, 2
          term = w[i] * x[i]
          print(f"w{i+1} * x{i+1} = {w[i]} * {x[i]} = {term}")
          total = total + term

      print("sum of terms:", total)
      print("plus bias b: ", total + b)
      ```
    bridges: []
  - id: algebra-notation.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.algebra-notation
    title: Solve by undoing, then check
    markdown: |-
      Sometimes you know the answer and need the input. If 2x + 3 = 11, undo the steps in reverse order, doing the same thing to both sides:

      1. Subtract 3: 2x = 8.
      2. Divide by 2: x = 4.
      3. Check by substituting back: 2 × 4 + 3 = 11. ✓

      Before any calculation, mark what's given, what's unknown, and what stays fixed. You'll use this habit constantly: the neuron lessons read $\sum_i w_i x_i + b$, and the optimizer lessons add a time index, as in $w_t$, the weight after t updates.
    bridges: []
  - id: algebra-notation.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.algebra-notation
    markdown: Substitute into y = wx + b for new settings, then score an apartment, an email, and a commute with an indexed weighted sum.
    takeaway: |-
      Letters name quantities, and a small index picks one entry from a list. Substitute the numbers, pair each input with its own weight, multiply first, then add.
  - id: algebra-notation.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.algebra-notation
    markdown: |-
      Variables name quantities; substitution, sums, indices, and simple rearrangements make AI equations readable and checkable.
