schema_version: 0.2-draft
lesson:
  id: algebra-notation
  version: 0.2.0-draft
  title: Read an equation one symbol at a time
  state: draft
  summary: Read letters, brackets, and short equations as ordinary instructions. Then check the result one operation
    at a time.
  slot: B02
  category: bridge
  minutes: 12
  sources:
  - title: OpenStax — use the language of algebra
    url: https://openstax.org/books/elementary-algebra-2e/pages/1-2-use-the-language-of-algebra
  - title: Dive into Deep Learning — linear algebra
    url: https://d2l.ai/chapter_preliminaries/linear-algebra.html
  archetype: foundation
objectives:
- id: objective.algebra-notation
  version: 2-draft
  statement: Substitute values into an expression and trace an indexed weighted sum without confusing names, operations,
    or positions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - algebra-notation.base.v2
  - algebra-notation.transfer.v2
  prerequisites:
  - anyOf:
    - objective.arithmetic
scenes:
- id: algebra-notation.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.algebra-notation
  title: Letters are labels for quantities
  markdown: Imagine planning a snack. You need two crackers for each guest plus three spare crackers. Instead of
    writing a different sentence for every guest count, let x name the number of guests. Then 2 × x + 3 describes
    the plan. A **variable** is a named quantity that can take different values. The letter is a label, not a hidden
    multiplication. An **expression** is a calculation written with numbers, names, and operations. You can read
    this expression aloud as “two times the guest count, plus three.”
  text_mode: Imagine planning a snack. You need two crackers for each guest plus three spare crackers. Instead of
    writing a different sentence for every guest count, let x name the number of guests. Then 2 × x + 3 describes
    the plan. A **variable** is a named quantity that can take different values. The letter is a label, not a hidden
    multiplication. An **expression** is a calculation written with numbers, names, and operations. You can read
    this expression aloud as “two times the guest count, plus three.”
  bridges: []
- id: algebra-notation.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.algebra-notation
  title: An equation says two amounts are equal
  markdown: 'An **equation** joins two expressions with an equals sign: y = 2 × x + 3 says that y has the same value
    as the expression on the right. Once x is supplied, this equation can define y. In an equation such as 2 × x
    + 3 = 11, the task may instead be to find the missing x. The sign still means equality. Some programming languages
    use = to store a value and == to compare values; the mathematical notation in this lesson uses = for equality.'
  text_mode: 'An **equation** joins two expressions with an equals sign: y = 2 × x + 3 says that y has the same
    value as the expression on the right. Once x is supplied, this equation can define y. In an equation such as
    2 × x + 3 = 11, the task may instead be to find the missing x. The sign still means equality. Some programming
    languages use = to store a value and == to compare values; the mathematical notation in this lesson uses = for
    equality.'
  bridges:
  - arithmetic
- id: algebra-notation.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.algebra-notation
  title: Substitute before simplifying
  markdown: '**Substitution** means replacing a name with its supplied value. For x = 4, write y = 2 × 4 + 3. Multiply
    first to get 8, then add 3 to get 11. Parentheses can change the order: 2 × (4 + 3) gives 14. A **coefficient**
    is a number multiplying a quantity, so 2 is the coefficient of x. A **constant** is a fixed amount in the expression,
    such as the spare 3. Writing 2x is another way of writing 2 × x.'
  text_mode: '**Substitution** means replacing a name with its supplied value. For x = 4, write y = 2 × 4 + 3. Multiply
    first to get 8, then add 3 to get 11. Parentheses can change the order: 2 × (4 + 3) gives 14. A **coefficient**
    is a number multiplying a quantity, so 2 is the coefficient of x. A **constant** is a fixed amount in the expression,
    such as the spare 3. Writing 2x is another way of writing 2 × x.'
  bridges: []
- id: algebra-notation.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.algebra-notation
  title: Keep inputs and settings separate
  markdown: For the model expression y = w × x + b, x is an input, w is a weight multiplying it, and b is a bias
    or added starting amount. With w = 3, x = 2, and b = 1, the product is 6 and the output y is 7. With those settings
    fixed, changing x asks about a different input. Changing w changes the rule. These roles come from the problem
    statement, not the shapes of the letters. A different author might choose different names.
  text_mode: For the model expression y = w × x + b, x is an input, w is a weight multiplying it, and b is a bias
    or added starting amount. With w = 3, x = 2, and b = 1, the product is 6 and the output y is 7. With those settings
    fixed, changing x asks about a different input. Changing w changes the rule. These roles come from the problem
    statement, not the shapes of the letters. A different author might choose different names.
  bridges: []
- id: algebra-notation.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.algebra-notation
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Letters name quantities. Brackets group operations. An index selects an entry. Read the instructions
    first, then substitute and calculate.
- id: algebra-notation.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.algebra-notation
  markdown: Variables name quantities; substitution, sums, indices, and simple rearrangements make AI equations
    readable and checkable.
  text_mode: Variables name quantities; substitution, sums, indices, and simple rearrangements make AI equations
    readable and checkable.
- id: algebra-notation.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.algebra-notation
  title: Small labels select entries
  markdown: 'Suppose two inputs are written x₁ and x₂. The small numbers are **indices**: labels selecting the first
    and second entries. They are not powers or multipliers. Let x₁ = 2, x₂ = 5, w₁ = 3, and w₂ = 1. The sum w₁x₁
    + w₂x₂ is 3 × 2 + 1 × 5 = 11. The capital Greek letter sigma, Σ, is shorthand for adding a specified collection
    of terms. Here, Σᵢ₌₁² wᵢxᵢ means calculate the term for i = 1, calculate it for i = 2, and add them.'
  text_mode: 'Suppose two inputs are written x₁ and x₂. The small numbers are **indices**: labels selecting the
    first and second entries. They are not powers or multipliers. Let x₁ = 2, x₂ = 5, w₁ = 3, and w₂ = 1. The sum
    w₁x₁ + w₂x₂ is 3 × 2 + 1 × 5 = 11. The capital Greek letter sigma, Σ, is shorthand for adding a specified collection
    of terms. Here, Σᵢ₌₁² wᵢxᵢ means calculate the term for i = 1, calculate it for i = 2, and add them.'
  bridges: []
- id: algebra-notation.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.algebra-notation
  title: Check the instruction in reverse
  markdown: 'To solve 2x + 3 = 11, subtract 3 from both sides to get 2x = 8, then divide both sides by 2 to get
    x = 4. Check by substituting 4 into the original expression: 8 + 3 = 11. Solving for an unknown and evaluating
    an expression are different jobs. Before calculating, mark what is given, what is unknown, and what must stay
    fixed. This habit will help when a training calculation uses many familiar operations inside unfamiliar notation.'
  text_mode: 'To solve 2x + 3 = 11, subtract 3 from both sides to get 2x = 8, then divide both sides by 2 to get
    x = 4. Check by substituting 4 into the original expression: 8 + 3 = 11. Solving for an unknown and evaluating
    an expression are different jobs. Before calculating, mark what is given, what is unknown, and what must stay
    fixed. This habit will help when a training calculation uses many familiar operations inside unfamiliar notation.'
  bridges: []
