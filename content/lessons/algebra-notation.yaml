scenes:
- id: algebra-notation.s1
  title: A letter is a named quantity
  type: explanation
  depth: intuition
  objective_refs:
  - objective.algebra-notation
  markdown: In prediction = w × x + b, x names the input, w a weight, and b an offset called bias. An equals sign
    says two expressions have the same value. It does not always mean “run the left side first.” Choose units and
    meanings before manipulating symbols.
  text_mode: In prediction = w × x + b, x names the input, w a weight, and b an offset called bias. An equals sign
    says two expressions have the same value. It does not always mean “run the left side first.” Choose units and
    meanings before manipulating symbols.
  bridges: []
- id: algebra-notation.s2
  title: Substitute before simplifying
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.algebra-notation
  markdown: Let x = 4, w = 2, and b = 1. Substitute these values to obtain 2 × 4 + 1 = 9. To solve 2 × x + 1 = 9,
    subtract 1 from both sides, then divide both by 2. The result x = 4 preserves equality at each step.
  text_mode: Let x = 4, w = 2, and b = 1. Substitute these values to obtain 2 × 4 + 1 = 9. To solve 2 × x + 1 =
    9, subtract 1 from both sides, then divide both by 2. The result x = 4 preserves equality at each step.
  bridges:
  - arithmetic
- id: algebra-notation.s3
  title: Indices identify entries
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.algebra-notation
  markdown: The symbol x₂ means the second entry, not x squared. For x = [3, 5, 7], x₂ is 5. A sum sign Σ means
    add terms over a stated index range; the sum of x₁ through x₃ is 15. A product sign Π means multiply the selected
    terms instead.
  text_mode: The symbol x₂ means the second entry, not x squared. For x = [3, 5, 7], x₂ is 5. A sum sign Σ means
    add terms over a stated index range; the sum of x₁ through x₃ is 15. A product sign Π means multiply the selected
    terms instead.
  bridges: []
- id: algebra-notation.s4
  title: Read a model expression aloud
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.algebra-notation
  markdown: A weighted sum adds each input multiplied by its matching weight, then adds the bias. With inputs [2,
    3], weights [4, −1], and bias 2, it gives 8 − 3 + 2 = 7. Parentheses, indexing conventions, and array shapes
    matter; similar symbols can describe different operations.
  text_mode: A weighted sum adds each input multiplied by its matching weight, then adds the bias. With inputs [2,
    3], weights [4, −1], and bias 2, it gives 8 − 3 + 2 = 7. Parentheses, indexing conventions, and array shapes
    matter; similar symbols can describe different operations.
  bridges: []
