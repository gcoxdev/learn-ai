scenes:
  - id: multi-agent-learning-and-games.s1
    title: Two assistants, one last room
    type: explanation
    depth: intuition
    objective_refs:
      - objective.multi-agent-learning-and-games
    markdown: |-
      Conference week in Lisbon. Rua Nova has one room left at a list price of \$120, and two assistants want it: Wayfarer, for its traveler, and a rival assistant, Nomad, for another. Each can offer the list price or bid \$160. The higher offer wins; a tie is settled by coin flip. The room is worth \$220 to each traveler (the next option is far from the venue), so a traveler's gain is \$220 minus the price if they get the room, and \$0 if not.

      A **payoff matrix** lists every combination of choices, with each player's payoff. Wayfarer's comes first in each cell:

      | | Nomad offers \$120 | Nomad bids \$160 |
      | --- | --- | --- |
      | **Wayfarer offers \$120** | 50, 50 | 0, 60 |
      | **Wayfarer bids \$160** | 60, 0 | 30, 30 |

      Check one cell: if both offer \$120, each has a 50% chance at a \$100 gain, so each expects 0.5 × 100 = 50. If both bid, it's 0.5 × (220 − 160) = 30 each.

      Now play Wayfarer. If Nomad offers \$120, bidding earns 60 instead of 50. If Nomad bids, bidding earns 30 instead of 0. Bidding is Wayfarer's **best response** to either choice, which makes it a **dominant strategy**. The same holds for Nomad, so both bid and each gets 30, though both offering \$120 would have given each 50. The hotel collects the difference.

      Neither assistant can do better by changing only its own choice, so (bid, bid) is a **Nash equilibrium**, the idea from the decisions and games lesson. This game has the shape of the famous **prisoner's dilemma**, first posed by Merrill Flood and Melvin Dresher at RAND in 1950 and named by Albert Tucker: every player acting sensibly on its own leads to an outcome all of them would reject together.

      :::predict Suppose the room is worth only \$170 to each traveler. Is bidding still dominant?
      Recompute: both offer \$120 gives 0.5 × 50 = 25 each; a lone bidder gets 170 − 160 = 10; both bidding gives 0.5 × 10 = 5 each. Against \$120, offering \$120 now wins (25 > 10). Against a bid, bidding still wins (5 > 0). No dominant strategy remains. Instead, two cells are equilibria: both offer \$120 (25 each), or both bid (5 each). It has become a coordination game: each assistant wants to do whatever the other does. (A third equilibrium has both assistants randomize, bidding 75% of the time.)
      :::

      :::papers The definition
      Nash (1950) defined an equilibrium as a choice of strategy $s_i^*$ for every player $i$ such that no player gains by switching alone:

      $$u_i(s_i^*, s_{-i}^*) \ge u_i(s_i, s_{-i}^*) \quad \text{for every player } i \text{ and every strategy } s_i$$

      Here $u_i$ is player $i$'s payoff and $s_{-i}^*$ means everyone else's equilibrium choices. For Wayfarer at (bid, bid), writing "list" for the \$120 offer: $u_W(\text{bid}, \text{bid}) = 30 \ge u_W(\text{list}, \text{bid}) = 0$. Nash also proved every finite game has at least one equilibrium, if players may randomize.
      :::
    bridges: []
  - id: multi-agent-learning-and-games.s2
    title: The opponent is learning too
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multi-agent-learning-and-games
    markdown: |-
      Real bidding assistants don't read payoff matrices; they learn from experience, like the reinforcement learners in the previous module. Suppose Wayfarer learns a bidding policy over three months in which Nomad always offered list price, so bidding \$125 was enough to win. Then Nomad's developers retrain it, and Nomad starts bidding \$150. Wayfarer starts losing rooms, and none of its three months of experience says why.

      From Wayfarer's point of view, the world changed its rules. In single-agent reinforcement learning, the chance of each outcome given an action stays fixed while the agent learns. Here the other learner is part of Wayfarer's environment, so every update Nomad makes changes Wayfarer's problem, and every update Wayfarer makes changes Nomad's. The environment is **nonstationary**: the rules generating experience drift over time. Old experience goes stale, and two learners can chase each other in circles instead of settling down.

      When the agents are on the *same* team, a standard remedy is **centralized training with decentralized execution** (CTDE). Imagine Wayfarer's flight agent and hotel agent learning to cooperate in a simulator. During training, a critic may see both agents' observations and actions. Given everyone's actions, outcomes follow fixed rules again, so the critic's learning target stops moving. After deployment, each agent acts only on what it can see itself. MADDPG (Lowe et al., 2017) is the best-known example: each agent has its own actor, trained with a critic that sees all the agents.
    bridges: []
  - id: multi-agent-learning-and-games.s3
    title: Rock, paper, scissors, and the exploiter
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multi-agent-learning-and-games
    markdown: |-
      Rock-paper-scissors shows why learning against one opponent is risky. If your strategy leans toward any move, an opponent who notices can beat it. The expected winnings of that opponent's best response are your strategy's **exploitability**. The program computes it, then runs two kinds of **self-play**, where a learner trains against copies of itself.

      ```python run
      import numpy as np

      # Payoff to me (rows) against the opponent (columns): rock, paper, scissors.
      A = np.array([[0, -1, 1],
                    [1, 0, -1],
                    [-1, 1, 0]])
      MOVES = ["rock", "paper", "scissors"]

      def best_response(opponent_mix):
          values = A @ opponent_mix              # expected payoff of each of my moves
          return values.argmax(), values.max()

      for mix in ([0.5, 0.3, 0.2], [1/3, 1/3, 1/3]):
          move, gain = best_response(np.array(mix))
          reply = MOVES[move] if gain > 1e-9 else "none: every move ties"
          print(f"opponent {np.round(mix, 2)}: best response {reply}; exploitability {gain:+.2f} per game")

      # Self-play 1: always answer only the latest version of yourself.
      move, path = 0, ["rock"]
      for _ in range(6):
          move = best_response(np.eye(3)[move])[0]
          path.append(MOVES[move])
      print("answer the latest:", " -> ".join(path))

      # Self-play 2: answer the average of every past version.
      counts = np.array([1.0, 0.0, 0.0])
      for _ in range(3000):
          counts[best_response(counts / counts.sum())[0]] += 1
      shares = counts / counts.sum()
      print("answer the average:", ", ".join(f"{m} {p:.3f}" for m, p in zip(MOVES, shares)))
      ```

      Against 50% rock, 30% paper, 20% scissors, paper wins 0.5 − 0.2 = +0.30 per game on average; that's the exploitability. The even one-third mix, the game's Nash equilibrium, gives an exploiter nothing: every move ties.

      The two self-play runs are the real lesson. Answering only your latest self goes round in circles, rock → paper → scissors → rock, forever. Answering the average of *all* past selves, a method called **fictitious play**, settles near one-third each (Julia Robinson proved in 1951 that this works in every two-player zero-sum game). Try changing the first mix to `[0.4, 0.4, 0.2]` and predict the best response and exploitability before you run it.
    bridges: []
  - id: multi-agent-learning-and-games.s4
    title: Self-play, from Go to StarCraft
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.multi-agent-learning-and-games
    markdown: |-
      Self-play produced some of the most famous results in AI, and each system had to fight that circling in its own way:

      | System | Game | How self-play was used |
      | --- | --- | --- |
      | AlphaGo (DeepMind, 2016) | Go | First learned from human expert games, then improved by playing itself; beat Lee Sedol 4–1 |
      | AlphaZero (DeepMind, 2017–18) | Go, chess, shogi | Started from random play with only the rules, and learned entirely by self-play |
      | OpenAI Five (2019) | Dota 2 | Played 80% of games against its current self and 20% against earlier versions, so it wouldn't forget how to beat old strategies; beat world champions OG |
      | AlphaStar (DeepMind, 2019) | StarCraft II | Began by imitating human replays, then trained in a **league** of many agents |

      AlphaStar's league is the direct fix for the rock-paper-scissors trap. Its main agents trained against a mix of past and present league members, a version of fictitious play. Besides these *main agents*, it trained *main exploiters*, whose only job was to beat the current main agents, and *league exploiters*, which hunted for weaknesses across the whole league. Any lopsided habit got punished in training rather than in public. AlphaStar reached Grandmaster level on the public ladder.

      :::mixup "It beats its training opponents, so it's strong."
      A policy can beat every opponent it trained against and still be easy to exploit, like the rock-heavy mix above. In cooperative settings the same trap appears as private conventions: two Wayfarer agents trained together might learn that "Tuesday" means "any weekday," and then confuse a human or a differently trained partner.
      :::

      So when Wayfarer's bidding policy comes up for release, its developers test it against a pool of opponents it never trained with, including one trained specifically to exploit it, and check how it performs with unfamiliar partners, not just its own copies.
    bridges: []
  - id: multi-agent-learning-and-games.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.multi-agent-learning-and-games
    markdown: The hotel-room game, then a poker bot, warehouse robots, a negotiator, and two airlines test whether you can find an equilibrium, price an exploit, and spot a learner chasing a moving target.
    takeaway: |-
      When other agents learn too, your environment keeps changing. Find equilibria with best responses, measure how exploitable a strategy is, and test against opponents and partners you never trained with.
  - id: multi-agent-learning-and-games.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.multi-agent-learning-and-games
    markdown: |-
      In multi-agent learning, other players’ changing strategies change the task. Test cooperation or competition with unfamiliar players, not just training opponents.
