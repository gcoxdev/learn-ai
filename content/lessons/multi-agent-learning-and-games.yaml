schema_version: 0.2-draft
lesson:
  id: multi-agent-learning-and-games
  version: 0.2.0-draft
  title: Learn when other decision-makers are learning too
  state: draft
  summary: Learn why a strategy must be tested against more than one opponent.
  slot: M25.6
  category: learning
  sources:
  - title: Multi-Agent Actor-Critic for Mixed Cooperative-Competitive Environments
    url: https://arxiv.org/abs/1706.02275
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.multi-agent-learning-and-games
  version: 1-draft
  statement: Game-theoretic and multi-agent learning settings model interacting objectives; self-play can generate
    useful experience while nonstationarity and strategic overfitting complicate evaluation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - multi-agent-learning-and-games.base
  - multi-agent-learning-and-games.transfer
  prerequisites:
  - anyOf:
    - objective.multi-agent-coordination
  - anyOf:
    - objective.policy-gradients-and-actor-critic
scenes:
- id: multi-agent-learning-and-games.s1
  title: Represent interacting payoffs
  type: explanation
  depth: intuition
  objective_refs:
  - objective.multi-agent-learning-and-games
  markdown: A game assigns outcomes or rewards to joint actions. In a cooperative game, agents may share a
    team objective; in competitive or mixed settings, interests differ. A Nash equilibrium means no player
    benefits from a unilateral strategy change under the modeled payoffs, not that everyone receives the best
    possible outcome.
  text_mode: A game assigns outcomes or rewards to joint actions. In a cooperative game, agents may share a
    team objective; in competitive or mixed settings, interests differ. A Nash equilibrium means no player
    benefits from a unilateral strategy change under the modeled payoffs, not that everyone receives the best
    possible outcome.
  bridges: []
- id: multi-agent-learning-and-games.s2
  title: The environment changes as opponents learn
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multi-agent-learning-and-games
  markdown: A policy trained against yesterday’s opponent may face a different strategy today. From one learner’s
    perspective, this makes experience nonstationary. Centralized training with decentralized execution is
    one approach to using additional training information while preserving local action interfaces at deployment.
  text_mode: A policy trained against yesterday’s opponent may face a different strategy today. From one learner’s
    perspective, this makes experience nonstationary. Centralized training with decentralized execution is
    one approach to using additional training information while preserving local action interfaces at deployment.
  bridges: []
- id: multi-agent-learning-and-games.s3
  title: Use self-play carefully
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multi-agent-learning-and-games
  markdown: 'Playing against copies or past versions can create progressively challenging experience. A narrow
    opponent population can also produce exploitable conventions or cycling strategies. For rock-paper-scissors,
    beating an opponent that always chooses rock does not establish robust play against a varied population.


    Against an opponent that always plays rock, always choosing paper wins. Against an opponent that always
    plays scissors, that same policy loses. In the standard zero-sum rock-paper-scissors game, choosing each
    action with probability one-third prevents an opponent from exploiting a predictable preference. During
    centralized training, a learner might see every player’s observations; decentralized execution means each
    player must act using only the information available through its own deployed interface.'
  text_mode: 'Playing against copies or past versions can create progressively challenging experience. A narrow
    opponent population can also produce exploitable conventions or cycling strategies. For rock-paper-scissors,
    beating an opponent that always chooses rock does not establish robust play against a varied population.


    Against an opponent that always plays rock, always choosing paper wins. Against an opponent that always
    plays scissors, that same policy loses. In the standard zero-sum rock-paper-scissors game, choosing each
    action with probability one-third prevents an opponent from exploiting a predictable preference. During
    centralized training, a learner might see every player’s observations; decentralized execution means each
    player must act using only the information available through its own deployed interface.'
  bridges: []
- id: multi-agent-learning-and-games.s4
  title: Evaluate across partners and opponents
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multi-agent-learning-and-games
  markdown: Test held-out strategies, cooperation with unfamiliar partners, exploitability where tractable,
    and resource use. Distinguish team reward from each participant’s outcome. Communication and reward design
    can create incentives for cooperation, deception, or free riding under the specified game.
  text_mode: Test held-out strategies, cooperation with unfamiliar partners, exploitability where tractable,
    and resource use. Distinguish team reward from each participant’s outcome. Communication and reward design
    can create incentives for cooperation, deception, or free riding under the specified game.
  bridges: []
