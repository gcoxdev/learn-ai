assessment_families:
- id: multi-agent-learning-and-games.base
  objective_ref: objective.multi-agent-learning-and-games
  task: base
  response_type: single_choice
  points: 1
  hint: 'The environment changes as opponents learn: trace the inputs, operation, and result before choosing.'
  remediation_scene: multi-agent-learning-and-games.s2
  variants:
  - id: multi-agent-learning-and-games.base.1
    prompt: Does Nash equilibrium mean the best outcome for every player?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only in every cooperative game
    answer: a
    feedback: It is a unilateral-deviation stability condition.
  - id: multi-agent-learning-and-games.base.2
    prompt: Why can multi-agent experience be nonstationary?
    options:
    - id: b
      text: Every reward is always fixed at zero
    - id: c
      text: No actions affect outcomes
    - id: a
      text: Other agents change their policies
    answer: a
    feedback: Learning participants change the encountered dynamics.
- id: multi-agent-learning-and-games.transfer
  objective_ref: objective.multi-agent-learning-and-games
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate across partners and opponents: trace the inputs, operation, and result before choosing.'
  remediation_scene: multi-agent-learning-and-games.s4
  variants:
  - id: multi-agent-learning-and-games.transfer.1
    prompt: Beating an always-rock opponent proves what?
    options:
    - id: b
      text: Robustness against every opponent
    - id: c
      text: A universal equilibrium strategy
    - id: a
      text: Performance against that narrow strategy
    answer: a
    feedback: Opponent coverage limits evaluation.
  - id: multi-agent-learning-and-games.transfer.2
    prompt: Why test unfamiliar partners?
    options:
    - id: c
      text: To guarantee identical behavior
    - id: a
      text: To measure coordination beyond learned conventions
    - id: b
      text: To remove the need for rewards
    answer: a
    feedback: Policies can overfit specific teammates.
