assessment_families:
  - id: multi-agent-learning-and-games.base
    objective_ref: objective.multi-agent-learning-and-games
    task: base
    response_type: single_choice
    points: 1
    hint: 'The environment changes as opponents learn: trace the inputs, operation, and result before choosing.'
    remediation_scene: multi-agent-learning-and-games.s2
    variants:
      - id: multi-agent-learning-and-games.base.1
        prompt: Does Nash equilibrium mean the best outcome for every player?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only in every cooperative game
        answer: a
        feedback: It is a unilateral-deviation stability condition.
        retired: true
      - id: multi-agent-learning-and-games.base.2
        prompt: Why can multi-agent experience be nonstationary?
        options:
          - id: b
            text: Every reward is always fixed at zero
          - id: c
            text: No actions affect outcomes
          - id: a
            text: Other agents change their policies
        answer: a
        feedback: Learning participants change the encountered dynamics.
        retired: true
  - id: multi-agent-learning-and-games.transfer
    objective_ref: objective.multi-agent-learning-and-games
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate across partners and opponents: trace the inputs, operation, and result before choosing.'
    remediation_scene: multi-agent-learning-and-games.s4
    variants:
      - id: multi-agent-learning-and-games.transfer.1
        prompt: Beating an always-rock opponent proves what?
        options:
          - id: b
            text: Robustness against every opponent
          - id: c
            text: A universal equilibrium strategy
          - id: a
            text: Performance against that narrow strategy
        answer: a
        feedback: Opponent coverage limits evaluation.
        retired: true
      - id: multi-agent-learning-and-games.transfer.2
        prompt: Why test unfamiliar partners?
        options:
          - id: c
            text: To guarantee identical behavior
          - id: a
            text: To measure coordination beyond learned conventions
          - id: b
            text: To remove the need for rewards
        answer: a
        feedback: Policies can overfit specific teammates.
        retired: true
  - id: multi-agent-learning-and-games.base.v2
    objective_ref: objective.multi-agent-learning-and-games
    task: base
    response_type: single_choice
    points: 1
    hint: For each thing the other player might do, find your best reply. An equilibrium is a cell where both players are already giving their best reply.
    remediation_scene: multi-agent-learning-and-games.s1
    variants:
      - id: multi-agent-learning-and-games.base.v2.1
        prompt: 'In the hotel game, payoffs (Wayfarer, Nomad) are: both offer $120 gives 50, 50; Wayfarer bids alone gives 60, 0; Nomad bids alone gives 0, 60; both bid gives 30, 30. Which outcome is the Nash equilibrium?'
        options:
          - id: b
            text: Both offer $120, since that pays both players the most in total
          - id: a
            text: Both bid, since bidding is each player's best reply either way
          - id: c
            text: One bids and one offers $120, since the bidder gets the top payoff
        answer: a
        feedback: Whatever the other does, bidding pays more (60 > 50 and 30 > 0), so neither player will stay at $120. Both-offer is better for both together, but each could gain by switching alone, so it isn't stable. A lone bidder's opponent would also switch to bidding.
      - id: multi-agent-learning-and-games.base.v2.2
        prompt: 'With the room worth $170, payoffs are: both offer $120 gives 25, 25; a lone bidder gets 10 and the other 0; both bid gives 5, 5. Which statement is correct?'
        options:
          - id: c
            text: Bidding is still dominant, so both bidding is the one equilibrium
          - id: b
            text: Both offering $120 is the one equilibrium, since it pays more
          - id: a
            text: Both offering $120 and both bidding are each an equilibrium
        answer: a
        feedback: Against $120 your best reply is $120 (25 > 10); against a bid, your best reply is to bid (5 > 0). So both matching cells are stable. Bidding is no longer dominant, and both-$120 isn't the only equilibrium either.
      - id: multi-agent-learning-and-games.base.v2.3
        prompt: A rock-paper-scissors bot plays rock 60%, paper 20%, and scissors 20% of the time. What is the best response to it?
        options:
          - id: b
            text: Rock, to match the bot's favorite move
          - id: a
            text: Paper, which beats its favorite move
          - id: c
            text: A mix of one-third each, the equilibrium
        answer: a
        feedback: Paper wins against the 60% rock and loses to the 20% scissors, for +0.4 per game. Rock would mostly tie, and the one-third mix wins nothing on average. The equilibrium is safe against anyone, but it doesn't exploit this bot.
      - id: multi-agent-learning-and-games.base.v2.4
        prompt: Wayfarer's bidding policy was trained for months against Nomad. The hotel's rules haven't changed, but after Nomad is retrained, Wayfarer suddenly loses most rooms. What best explains this?
        options:
          - id: a
            text: Nomad is part of Wayfarer's environment, and that environment changed
          - id: b
            text: Wayfarer's weights drifted during use and gradually lost its skill
          - id: c
            text: Wayfarer's training reached a Nash equilibrium and stopped improving
        answer: a
        feedback: When another learner is part of your environment, its updates change the rules you face, so your old experience goes stale. That's nonstationarity. A deployed policy's weights don't drift by themselves, and reaching an equilibrium wouldn't explain a sudden drop.
  - id: multi-agent-learning-and-games.transfer.v2
    objective_ref: objective.multi-agent-learning-and-games
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask who the policy has actually been tested against, and whether that pool includes anyone trying to exploit it or anyone who doesn't share its habits.
    remediation_scene: multi-agent-learning-and-games.s4
    variants:
      - id: multi-agent-learning-and-games.transfer.v2.1
        prompt: A poker bot trained only against its latest self beats that version 55% of the time, but loses to a version from a month ago. Which change to training fits the lesson?
        options:
          - id: c
            text: Train for longer, still only against its own latest version
          - id: b
            text: Lower its exploration, so that it stops trying new moves
          - id: a
            text: Keep past versions and dedicated exploiters in its opponent pool
        answer: a
        feedback: Playing only the latest self can go in circles, forgetting how to beat old strategies. A pool of past versions and exploiters, as OpenAI Five and AlphaStar used, punishes those gaps. More of the same training keeps circling.
      - id: multi-agent-learning-and-games.transfer.v2.2
        prompt: Two warehouse robots learn to cooperate in simulation, with a critic that sees both robots' sensors. After deployment, each robot sees only its own camera. How does the lesson describe this?
        options:
          - id: a
            text: Centralized training with decentralized execution, a standard approach
          - id: b
            text: A mistake, because each robot at work must still see what the critic saw
          - id: c
            text: Self-play, because the robots learn by competing against each other
        answer: a
        feedback: The shared view is used only to train the critic, which steadies learning; at run time each robot acts on its own observations. That's CTDE, as in MADDPG. The robots cooperate rather than compete, so it isn't self-play.
      - id: multi-agent-learning-and-games.transfer.v2.3
        prompt: A negotiation agent trained with copies of itself learned to start every offer with a private code word. Paired with a human, it gets confused and fails. Which evaluation was missing?
        options:
          - id: b
            text: A test against a stronger copy of the same agent
          - id: a
            text: A test with partners it never trained alongside
          - id: c
            text: A longer run of games against its own copies
        answer: a
        feedback: Agents trained together can invent conventions that only they share. Testing with unfamiliar partners, such as humans or independently trained agents, reveals this. More games against its own copies would only reinforce the convention.
      - id: multi-agent-learning-and-games.transfer.v2.4
        prompt: Two airlines' pricing bots each learn to undercut the other, and both end up selling near cost, worse for both than holding prices. Which idea from the lesson describes this outcome?
        options:
          - id: c
            text: Each bot is being exploited by an opponent's best response
          - id: b
            text: Each bot's environment is nonstationary, so learning failed
          - id: a
            text: An equilibrium that leaves both players worse off than cooperating
        answer: a
        feedback: Undercutting is each bot's best reply whatever the other does, so both end up at a stable outcome that both would reject together, the prisoner's dilemma shape. Nothing failed to learn, and neither bot is being singled out, since both are playing their best responses.
  - id: multi-agent-learning-and-games.calculate
    objective_ref: objective.multi-agent-learning-and-games
    task: base
    response_type: numeric
    points: 1
    hint: For each of your three moves, add +1 times the chance it wins and −1 times the chance it loses. The largest total is the best response's value, which is the mix's exploitability.
    remediation_scene: multi-agent-learning-and-games.s3
    absolute_tolerance: 0.01
    variants:
      - id: multi-agent-learning-and-games.calculate.1
        prompt: A rock-paper-scissors bot plays rock 0.6, paper 0.3, scissors 0.1. Scoring a win as +1, a loss as −1, and a tie as 0, how much does a best response win per game on average?
        answer: 0.5
        feedback: Paper beats rock (0.6) and loses to scissors (0.1), for 0.6 − 0.1 = 0.5. Rock scores 0.1 − 0.3 = −0.2 and scissors 0.3 − 0.6 = −0.3, so paper's 0.5 is the exploitability.
      - id: multi-agent-learning-and-games.calculate.2
        prompt: A rock-paper-scissors bot plays rock 0.2, paper 0.5, scissors 0.3. Scoring a win as +1, a loss as −1, and a tie as 0, how much does a best response win per game on average?
        answer: 0.3
        feedback: Scissors beats paper (0.5) and loses to rock (0.2), for 0.3. Rock scores 0.3 − 0.5 = −0.2 and paper 0.2 − 0.3 = −0.1, so the best response is scissors, winning 0.3 per game.
      - id: multi-agent-learning-and-games.calculate.3
        prompt: A rock-paper-scissors bot plays rock 0.4, paper 0.4, scissors 0.2. Scoring a win as +1, a loss as −1, and a tie as 0, how much does a best response win per game on average?
        answer: 0.2
        feedback: Paper scores 0.4 − 0.2 = 0.2, scissors 0.4 − 0.4 = 0, and rock 0.2 − 0.4 = −0.2. The best response is paper, winning 0.2 per game.
      - id: multi-agent-learning-and-games.calculate.4
        prompt: A rock-paper-scissors bot plays rock 0.25, paper 0.25, scissors 0.5. Scoring a win as +1, a loss as −1, and a tie as 0, how much does a best response win per game on average?
        answer: 0.25
        feedback: Rock beats scissors (0.5) and loses to paper (0.25), for 0.25. Paper scores 0.25 − 0.5 = −0.25 and scissors 0.25 − 0.25 = 0, so rock wins 0.25 per game.
