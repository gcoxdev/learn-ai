schema_version: 0.2-draft
lesson:
  id: multi-agent-learning-and-games
  version: 0.3.0-draft
  title: Learn when other decision-makers are learning too
  state: draft
  summary: Learn why a strategy must be tested against more than one opponent.
  slot: M25.6
  category: learning
  sources:
  - title: Multi-Agent Actor-Critic for Mixed Cooperative-Competitive Environments
    url: https://arxiv.org/abs/1706.02275
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.multi-agent-learning-and-games
  version: 1-draft
  statement: Game-theoretic and multi-agent learning settings model interacting objectives; self-play can generate
    useful experience while nonstationarity and strategic overfitting complicate evaluation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - multi-agent-learning-and-games.base
  - multi-agent-learning-and-games.transfer
  prerequisites:
  - anyOf:
    - objective.multi-agent-coordination
  - anyOf:
    - objective.policy-gradients-and-actor-critic
scenes:
- id: multi-agent-learning-and-games.s1
  title: Represent interacting payoffs
  type: explanation
  depth: intuition
  objective_refs:
  - objective.multi-agent-learning-and-games
  markdown: A game assigns outcomes or rewards to joint actions. In a cooperative game, agents may share a
    team objective; in competitive or mixed settings, interests differ. A Nash equilibrium means no player
    benefits from a unilateral strategy change under the modeled payoffs, not that everyone receives the best
    possible outcome.
  text_mode: A game assigns outcomes or rewards to joint actions. In a cooperative game, agents may share a
    team objective; in competitive or mixed settings, interests differ. A Nash equilibrium means no player
    benefits from a unilateral strategy change under the modeled payoffs, not that everyone receives the best
    possible outcome.
  bridges: []
- id: multi-agent-learning-and-games.s2
  title: The environment changes as opponents learn
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multi-agent-learning-and-games
  markdown: 'A policy trained against yesterday''s opponent may face a different strategy today. This makes
    the experience **nonstationary** from one learner''s perspective: the conditions generating its data are
    changing.


    One approach is **centralized training with decentralized execution**. During training, a learner may receive
    information about all players to help estimate values or coordinate behavior. Once deployed, each player
    must choose actions using only the information available through its own interface.'
  text_mode: 'A policy trained against yesterday''s opponent may face a different strategy today. This makes
    the experience **nonstationary** from one learner''s perspective: the conditions generating its data are
    changing.


    One approach is **centralized training with decentralized execution**. During training, a learner may receive
    information about all players to help estimate values or coordinate behavior. Once deployed, each player
    must choose actions using only the information available through its own interface.'
  bridges: []
- id: multi-agent-learning-and-games.s3
  title: Use self-play carefully
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multi-agent-learning-and-games
  markdown: '**Self-play** creates training experience by playing against copies or earlier versions of a learner.
    As the opponents improve, they can present harder challenges. A narrow set of opponents can also teach
    a brittle strategy.


    In rock-paper-scissors, always choosing paper beats an opponent that always chooses rock, but loses to
    one that always chooses scissors. In the standard zero-sum game, choosing each action with probability
    one-third prevents an opponent from exploiting a predictable preference.


    This is why success against familiar opponents is only part of the evaluation. Test varied and previously
    unseen strategies too.'
  text_mode: '**Self-play** creates training experience by playing against copies or earlier versions of a
    learner. As the opponents improve, they can present harder challenges. A narrow set of opponents can also
    teach a brittle strategy.


    In rock-paper-scissors, always choosing paper beats an opponent that always chooses rock, but loses to
    one that always chooses scissors. In the standard zero-sum game, choosing each action with probability
    one-third prevents an opponent from exploiting a predictable preference.


    This is why success against familiar opponents is only part of the evaluation. Test varied and previously
    unseen strategies too.'
  bridges: []
- id: multi-agent-learning-and-games.s4
  title: Evaluate across partners and opponents
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.multi-agent-learning-and-games
  markdown: Test held-out strategies, cooperation with unfamiliar partners, exploitability where tractable,
    and resource use. Distinguish team reward from each participant’s outcome. Communication and reward design
    can create incentives for cooperation, deception, or free riding under the specified game.
  text_mode: Test held-out strategies, cooperation with unfamiliar partners, exploitability where tractable,
    and resource use. Distinguish team reward from each participant’s outcome. Communication and reward design
    can create incentives for cooperation, deception, or free riding under the specified game.
  bridges: []
- id: multi-agent-learning-and-games.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.multi-agent-learning-and-games
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: In multi-agent learning, other players’ changing strategies change the task. Test cooperation or
    competition with unfamiliar players, not just training opponents.
