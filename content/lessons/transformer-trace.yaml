assessment_families:
- response_type: single_choice
  hint: 'Track the type of object at each stage: IDs, vectors, contextual vectors, then vocabulary scores.'
  variants:
  - prompt: Which sequence is a coherent decoder-only forward trace?
    options:
    - id: b
      text: Token IDs → attention weights → immediate decoding, with no value mixing or later layers.
    - id: answer
      text: Token IDs → embeddings/positions → transformer blocks → vocabulary logits.
    - id: a
      text: Vocabulary probabilities → tokenizer training → a guaranteed factual answer.
    answer: answer
    feedback: The model transforms representations through contextual blocks before projecting to vocabulary
      scores. Attention weights alone are not the final next-token distribution.
    id: transformer-trace.base.1
  - prompt: What does a residual addition do in the toy case [2, 1] + [−0.5, 0.25]?
    options:
    - id: answer
      text: It produces [1.5, 1.25] by adding an update coordinate by coordinate.
    - id: a
      text: It discards the incoming representation and outputs only [−0.5, 0.25].
    - id: b
      text: It directly chooses a token ID from the vocabulary.
    answer: answer
    feedback: Residual addition combines the incoming representation and its update. It is a vector operation
      inside the network, not a decoding policy.
    id: transformer-trace.base.2
  id: transformer-trace.base
  objective_ref: objective.transformer-trace
  task: base
  points: 1
  remediation_scene: transformer-trace.s1
- response_type: single_choice
  hint: Attention mixes information from input positions; the output projection scores possible next tokens.
  variants:
  - prompt: An attention head gives an input position weight 0.8. Does that mean the token at that position
      has next-token probability 0.8?
    options:
    - id: answer
      text: No; attention-position weights and output-vocabulary probabilities are different quantities.
    - id: a
      text: Yes; the attention row is always the final vocabulary distribution.
    - id: b
      text: Yes; residual connections copy attention weights into output probabilities unchanged.
    answer: answer
    feedback: Attention weights control value mixing inside a head. Further transformations and a vocabulary
      projection determine the output logits.
    id: transformer-trace.transfer.1
  - prompt: Two prompts contain the same words in different orders. Why does positional information matter?
    options:
    - id: a
      text: It guarantees that both prompts produce exactly the same answer.
    - id: b
      text: It replaces all learned embeddings with the token IDs themselves.
    - id: answer
      text: It lets the computation distinguish where tokens occur and how their order differs.
    answer: answer
    feedback: Order can change meaning. Position-aware computation can distinguish arrangements even when the
      vocabulary entries are the same.
    id: transformer-trace.transfer.2
  id: transformer-trace.transfer
  objective_ref: objective.transformer-trace
  task: transfer
  points: 1
  remediation_scene: transformer-trace.s1
