- id: transformer-trace.extension-context-cost
  title: Count the cost of looking across a context
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.transformer-trace
  markdown: 'For standard dense self-attention over T positions, each query can compare with up to T keys,
    giving work on the scale of T squared for those comparisons. Doubling T quadruples the number of position
    pairs. A causal mask removes future access but does not turn this whole training or prefill computation
    into a constant-size operation.


    During cached autoregressive decoding, one new query can attend to retained keys, so its attention work
    grows with retained context. The KV cache stores earlier per-layer key/value activations and normally grows
    with retained positions. Efficient kernels can avoid materializing a full score matrix, while different
    attention patterns or architectures change the accounting. Distinguish arithmetic, stored intermediates,
    and total end-to-end latency.'
  text_mode: 'For standard dense self-attention over T positions, each query can compare with up to T keys,
