scenes:
- title: Keep one position in view
  markdown: 'Start with the prompt “a bird sings”. Tokenization chooses IDs, and embedding lookup supplies
    vectors. Follow the last prompt position: after the network processes it, its final representation helps
    score the next token.


    A decoder-only transformer repeats blocks over these representations. This is a conceptual trace of the
    main components, not a claim that every architecture uses the same block order or parameter shapes.'
  id: transformer-trace.s1
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.transformer-trace
  text_mode: 'Start with the prompt “a bird sings”. Tokenization chooses IDs, and embedding lookup supplies
    vectors. Follow the last prompt position: after the network processes it, its final representation helps
    score the next token.


    A decoder-only transformer repeats blocks over these representations. This is a conceptual trace of the
    main components, not a claim that every architecture uses the same block order or parameter shapes.'
- title: Order must enter the computation
  markdown: 'A plain collection of token embeddings does not by itself specify sequence positions. Transformers
    include positional information. Designs may add positional vectors or modify query/key calculations using
    position, as rotary methods do.


    Consider “dog bites person” and “person bites dog”. The same vocabulary entries appear, but the order changes
    the sentence. Positional mechanisms give the computation information it needs to distinguish such cases.
    Their detailed mathematics belongs in the positional-encoding lesson.'
  id: transformer-trace.s2
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.transformer-trace
  text_mode: 'A plain collection of token embeddings does not by itself specify sequence positions. Transformers
    include positional information. Designs may add positional vectors or modify query/key calculations using
    position, as rotary methods do.


    Consider “dog bites person” and “person bites dog”. The same vocabulary entries appear, but the order changes
    the sentence. Positional mechanisms give the computation information it needs to distinguish such cases.
    Their detailed mathematics belongs in the positional-encoding lesson.'
- title: Attention supplies contextual information
  markdown: 'At the position we follow, attention computes permitted mixtures of information from earlier and
    current positions. Multiple heads can use different learned projections and therefore different mixtures.
    Their outputs are combined through an output projection.


    A projection is a learned numerical transformation of a vector. It can mix coordinates rather than simply
    selecting one. The single-head experiment explains the central scoring-and-mixing operation; tensor shapes
    and efficient multi-head implementations need a deeper follow-up.'
  bridges:
  - vectors
  id: transformer-trace.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.transformer-trace
  text_mode: 'At the position we follow, attention computes permitted mixtures of information from earlier
    and current positions. Multiple heads can use different learned projections and therefore different mixtures.
    Their outputs are combined through an output projection.


    A projection is a learned numerical transformation of a vector. It can mix coordinates rather than simply
    selecting one. The single-head experiment explains the central scoring-and-mixing operation; tensor shapes
    and efficient multi-head implementations need a deeper follow-up.'
- title: Keep a residual path; transform each position
  markdown: 'A residual connection adds a block’s update to its incoming representation. For a toy vector [1,
    2] and an attention update [0.5, −0.25], the sum is [1.5, 1.75]. This preserves a direct route for information
    while also allowing changes.


    Feed-forward components then apply learned transformations and nonlinearities at each position. Normalization
    controls representation statistics. Common block variants arrange normalization and residual additions
    differently; neither normalization nor the feed-forward network replaces attention’s cross-position mixing.'
  id: transformer-trace.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.transformer-trace
  text_mode: 'A residual connection adds a block’s update to its incoming representation. For a toy vector
    [1, 2] and an attention update [0.5, −0.25], the sum is [1.5, 1.75]. This preserves a direct route for
    information while also allowing changes.


    Feed-forward components then apply learned transformations and nonlinearities at each position. Normalization
    controls representation statistics. Common block variants arrange normalization and residual additions
    differently; neither normalization nor the feed-forward network replaces attention’s cross-position mixing.'
- title: Project to the vocabulary, then choose
  markdown: 'After the final block and the architecture’s final processing, a vocabulary projection gives a
    score, or logit, for each possible next token. A distribution can be formed from those logits and a decoding
    policy selects an output.


    Do not confuse two uses of normalization. Attention weights mix input-position values inside a head. Vocabulary
    probabilities describe candidate output tokens near the end. A head attending strongly to “bird” does not
    mean the next generated token must be “bird”.'
  id: transformer-trace.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.transformer-trace
  text_mode: 'After the final block and the architecture’s final processing, a vocabulary projection gives
    a score, or logit, for each possible next token. A distribution can be formed from those logits and a decoding
    policy selects an output.


    Do not confuse two uses of normalization. Attention weights mix input-position values inside a head. Vocabulary
    probabilities describe candidate output tokens near the end. A head attending strongly to “bird” does not
    mean the next generated token must be “bird”.'
- title: One block is a mechanism, not the entire product
  markdown: 'The selected token is appended and generation continues with fixed model parameters during ordinary
    inference. Training, by contrast, computes losses and updates parameters. Retrieval, tools, safety controls,
    and the user interface may surround the model.


    You can now trace IDs → embeddings and positions → contextual blocks → vocabulary logits → selected token.
    Encoder-only and encoder–decoder families reuse related components for different information flow and objectives;
    this lesson’s assessed trace is specifically decoder-only.'
  id: transformer-trace.s6
