schema_version: 0.2-draft
lesson:
  id: following-the-research-frontier
  version: 0.4.0-draft
  title: Maintain a research record that can change with evidence
  state: draft
  summary: Thousands of machine-learning papers appear every month. Learn to triage an abstract in five minutes, spot the signals that a result will hold up, and keep up without drowning.
  slot: M34.8
  category: learning
  sources:
    - title: How to Read a Paper (Keshav, ACM SIGCOMM Computer Communication Review, 2007)
      url: https://doi.org/10.1145/1273445.1273458
    - title: Improving Reproducibility in Machine Learning Research (A Report from the NeurIPS 2019 Reproducibility Program) (Pineau et al., 2021)
      url: https://arxiv.org/abs/2003.12206
    - title: Deep Reinforcement Learning that Matters (Henderson et al., AAAI 2018)
      url: https://arxiv.org/abs/1709.06560
    - title: Model Cards for Model Reporting (Mitchell et al., 2019)
      url: https://arxiv.org/abs/1810.03993
    - title: arXiv moderation policies (arXiv.org)
      url: https://info.arxiv.org/help/moderation/index.html
objectives:
  - id: objective.following-the-research-frontier
    version: 2-draft
    statement: Research literacy requires versioned claims, primary sources, competing explanations, replication status, and explicit updates; frontier coverage should track evidence rather than imply a final complete taxonomy.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - following-the-research-frontier.base.v2
      - following-the-research-frontier.transfer.v2
    prerequisites:
      - anyOf:
          - objective.emerging-architecture-evidence
      - anyOf:
          - objective.ai-assisted-discovery
scenes:
  - id: following-the-research-frontier.s1
    title: Posted is not the same as reviewed
    type: explanation
    depth: intuition
    objective_refs:
      - objective.following-the-research-frontier
    markdown: |-
      On Monday morning a paper appears online claiming a trick that halves the cost of fine-tuning. By lunch it's all over social media. By Friday, two teams report they can't reproduce it, and the next Tuesday the authors post version 2 with a corrected table. Everyone who formed an opinion on Monday read a different paper.

      Most machine-learning research first appears on **arXiv**, a free paper server that Paul Ginsparg started in 1991. A paper posted before, or without, peer review is called a **preprint**. arXiv's moderators check that a submission is on topic and properly formatted. They don't check whether it's correct.

      | Where a claim appears | Who has checked it | What that means |
      | --- | --- | --- |
      | arXiv preprint | moderators, for topic and format | fast and open; correctness untested |
      | Conference paper (NeurIPS, ICML, ICLR) | usually 3–4 reviewers, over weeks | experts read it; they rarely rerun code |
      | Public review (e.g. ICLR on OpenReview) | reviewers and authors, in the open | you can read the objections |
      | Independent replication | another team, with their own code | the strongest signal there is |

      Preprints also change. arXiv keeps every version (v1, v2, …), and later versions can fix errors, add baselines, or quietly shrink a claim. So when you note a result, note which version you read.
    bridges: []
  - id: following-the-research-frontier.s2
    title: Read a paper in three passes
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.following-the-research-frontier
    markdown: |-
      You can't read everything closely, and you don't need to. Keshav's "How to Read a Paper" (2007) suggests three passes, each deeper and rarer than the last:

      1. **First pass (5–10 minutes).** Read the title, abstract, introduction, section headings, and conclusion, and glance at the figures. Decide: what's the claim, is it relevant to me, and is it worth a second pass?
      2. **Second pass (about an hour).** Read the method and experiments, skipping proofs, and study the figures closely. Check the baselines, datasets, compute, number of seeds, and error bars. Could you explain the result to a colleague?
      3. **Third pass (hours).** Reconstruct the work: rederive the key step or rerun the code. Save this for the few papers that would change what you do.

      Even a glance at a results plot shows the baselines, the axes, and how big the gap really is, faster than any paragraph.

      :::mixup "The abstract tells you what the paper showed."
      The abstract tells you what the authors *claim*, in their most favorable words. The evidence lives in the tables and the experimental setup. Pass one reads the abstract to decide whether to check the claim, not to accept it.
      :::
    bridges: []
  - id: following-the-research-frontier.triage
    title: Triage three abstracts
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.following-the-research-frontier
    markdown: |-
      Imagine you train long-context language models for a biology lab. Three invented but realistic abstracts land in your feed:

      > **A.** "We present SparseTile, a GPU kernel for block-sparse attention that runs 2.1× faster than FlashAttention-2 at 16k tokens on A100 GPUs, with identical outputs. Code is released."
      >
      > **B.** "We show that a language model trained only on chess games develops an internal world model: a linear probe recovers the board state with 94% accuracy."
      >
      > **C.** "Our 7B model surpasses much larger frontier models on reasoning, scoring 91% on ReasonBench-X, a new benchmark we introduce."

      | | Relevant to you? | Checkable? | Claim vs evidence | Decision |
      | --- | --- | --- | --- | --- |
      | A | yes, you train at 16k | code released, narrow claim | matched: speed with identical outputs | second pass, then try the code |
      | B | interesting, not your work | method is standard | "world model" is a big phrase for a probe result | first pass only; note it |
      | C | somewhat | new benchmark by the same authors, no code | a single self-made benchmark | park in your ledger until someone replicates |

      Paper A makes a small claim with a direct test, so it's the one to act on. Paper C makes the biggest claim with the weakest evidence: the authors built the test they won.

      :::predict A month later, paper C's v2 adds results on three established benchmarks, where the model trails larger models by 5–10 points. What do you write in your ledger?
      Update the entry to the new version: strong on its own benchmark, behind on established ones. The headline claim didn't survive, but the model may still be good for its size. Record what changed and why.
      :::
    diagram:
      caption: A first-pass triage. Most abstracts stop at the first or second question.
      description: A new abstract first meets the question "Relevant to my work?". If no, it is skipped or just noted. If yes, the next question is "Checkable? Code, baselines, error bars". If not checkable, it goes into the ledger to watch for replication. If checkable, it gets a second pass reading the method and baselines. From the second pass, a paper that would change your plans goes to reproduction.
      nodes:
        - id: abstract
          label: New abstract
          col: 0
          row: 0
          tone: data
        - id: relevant
          label: Relevant to my work?
          col: 2
          row: 0
          tone: accent
        - id: skip
          label: Skip or just note it
          col: 2
          row: 2
          tone: muted
        - id: checkable
          label: Checkable?
          note: code, matched baselines, error bars
          col: 4
          row: 0
          tone: accent
        - id: ledger
          label: "Ledger: watch for replication"
          col: 4
          row: 2
          tone: warn
        - id: second
          label: Second pass
          note: method, baselines, setup
          col: 4
          row: 4
        - id: reproduce
          label: Reproduce it
          note: only if it changes your plans
          col: 2
          row: 4
          tone: data
      edges:
        - from: abstract
          to: relevant
        - from: relevant
          to: skip
          label: "no"
        - from: relevant
          to: checkable
          label: "yes"
        - from: checkable
          to: ledger
          label: "no"
        - from: checkable
          to: second
          label: "yes"
          bend: 3
        - from: second
          to: reproduce
          label: would change your plans
    bridges: []
  - id: following-the-research-frontier.s3
    title: Signals that a result will hold up
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.following-the-research-frontier
    markdown: |-
      Together these signals shift the odds, roughly strongest first:

      | Signal | Why it helps |
      | --- | --- |
      | Independent replication | another team, other code, same result |
      | Code, weights, and data released | anyone can check and extend it |
      | Several seeds with error bars | shows the gap is bigger than luck |
      | Strong, matched baselines | the comparison from the previous lesson |
      | Ablations | removing each part shows which one matters |
      | Compute and tuning budget stated | you can tell whether the new method got more of both |

      Seeds matter more than most readers expect (module 9's lesson on controlled experiments showed why). Henderson and colleagues (2018) showed that deep reinforcement learning results could shift with the random seed and small implementation details, enough that two groups of five runs of the same algorithm looked like different methods. Since 2019, NeurIPS has asked authors to fill in a reproducibility checklist covering many of these points; check whether a paper answered it honestly.

      When a replication fails, diagnose before you judge. Compare versions, data, hyperparameters, and evaluation scripts. A failed replication often reveals a hidden condition that the original result depends on, which is itself worth knowing.
    bridges: []
  - id: following-the-research-frontier.s4
    title: Keep up without drowning
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.following-the-research-frontier
    markdown: |-
      Here's a routine that fits in about three hours a week:

      - **Monday, 45 minutes:** first-pass 8–10 abstracts from a few sources you trust: a curated newsletter, two or three researchers whose judgment you've checked, and the proceedings of one conference in your area. Mute the rest.
      - **Wednesday, 90 minutes:** second pass on the one or two papers that survived.
      - **Friday, 30 minutes:** update your **claim ledger**, a dated record of what each paper claimed and how well it's supported.

      A good ledger entry is short and specific:

      > *2026-03-12. SparseTile, arXiv v1. Claims 2.1× over FlashAttention-2 at 16k on A100, identical outputs. Author-reported; code released; no replication yet. Tried at our 8k setting: 1.3×. Revisit if v2 or replications appear.*

      That entry separates what the authors reported, what you measured, and what nobody has checked yet. When v2 or a replication arrives, add a new line and keep the old one, so you can see how the claim changed.

      Your map of the field changes too. When a result survives replication and changes how people build systems, it earns a place in what you teach or use. When it doesn't, the ledger shows you why you stopped believing it.
    bridges: []
  - id: following-the-research-frontier.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.following-the-research-frontier
    markdown: Triage new abstracts, judge preprint revisions and failed replications, and decide what belongs in a claim ledger.
    takeaway: |-
      A preprint is a claim, not a checked result. Triage abstracts in minutes, go deeper only where a paper is relevant and checkable, and keep a dated ledger of claims that you update as versions and replications arrive.
  - id: following-the-research-frontier.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.following-the-research-frontier
    markdown: |-
      Keep a dated record of what was claimed, how it was tested, and whether others reproduced it. Revise the record when the evidence changes.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - following-the-research-frontier.s1
        - following-the-research-frontier.s2
        - following-the-research-frontier.triage
        - following-the-research-frontier.s3
        - following-the-research-frontier.s4
        - following-the-research-frontier.check
      gate_refs:
        - gate.core
  scene_aliases:
    following-the-research-frontier.recap: following-the-research-frontier.check
assessment_families:
  - id: following-the-research-frontier.base
    objective_ref: objective.following-the-research-frontier
    task: base
    response_type: single_choice
    points: 1
    hint: 'Read the comparison conditions: trace the inputs, operation, and result before choosing.'
    remediation_scene: following-the-research-frontier.s2
    variants:
      - id: following-the-research-frontier.base.1
        prompt: Why record a paper revision?
        options:
          - id: c
            text: Every revision is identical
          - id: a
            text: Technical details can change under the same title
          - id: b
            text: Only citation style changes
        answer: a
        feedback: Version identity supports reproducibility.
        retired: true
      - id: following-the-research-frontier.base.2
        prompt: Should author-reported results and independent replications be labeled the same?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if scores are close
        answer: a
        feedback: They provide different kinds of evidence.
        retired: true
  - id: following-the-research-frontier.transfer
    objective_ref: objective.following-the-research-frontier
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Update the learning map: trace the inputs, operation, and result before choosing.'
    remediation_scene: following-the-research-frontier.s4
    variants:
      - id: following-the-research-frontier.transfer.1
        prompt: What should a failed replication prompt first?
        options:
          - id: a
            text: Comparison of assumptions, implementation, and evaluation conditions
          - id: b
            text: An automatic accusation of fraud
          - id: c
            text: Automatic dismissal of all results
        answer: a
        feedback: Discrepancies need diagnosis.
        retired: true
      - id: following-the-research-frontier.transfer.2
        prompt: Why retain dated model case studies?
        options:
          - id: b
            text: They prove no newer system exists
          - id: c
            text: Only to avoid updates
          - id: a
            text: They anchor mechanisms to inspectable historical artifacts
        answer: a
        feedback: Stable references support learning while the frontier changes.
        retired: true
  - id: following-the-research-frontier.base.v2
    objective_ref: objective.following-the-research-frontier
    task: base
    response_type: single_choice
    points: 1
    hint: Ask who has checked the claim so far (moderators, reviewers, or another team), and which version you're looking at.
    remediation_scene: following-the-research-frontier.s1
    variants:
      - id: following-the-research-frontier.base.v2.1
        prompt: A paper was posted to arXiv yesterday. What has arXiv's moderation checked?
        options:
          - id: b
            text: That independent reviewers found the main results correct
          - id: a
            text: That it is on topic and properly formatted for its category
          - id: c
            text: That the released code reproduces the reported numbers
        answer: a
        feedback: arXiv moderators screen for topic and format, not correctness. Peer review and replication happen elsewhere, if at all, and nobody reruns code at posting.
      - id: following-the-research-frontier.base.v2.2
        prompt: You cite a preprint's table in your notes. Weeks later the authors post v3 with a corrected table. Why should your notes have recorded the version?
        options:
          - id: c
            text: Because arXiv deletes earlier versions once a new one appears
          - id: b
            text: Because only the latest version can be cited in publications
          - id: a
            text: Because the numbers you noted may differ from the current version
        answer: a
        feedback: Versions can change results under the same title, so your note must say which one it came from. arXiv keeps earlier versions, and you may cite any of them.
      - id: following-the-research-frontier.base.v2.3
        prompt: In a first pass through a paper, which parts should you read?
        options:
          - id: a
            text: Title, abstract, introduction, headings, figures, and conclusion
          - id: b
            text: The method section and proofs, to check the claim is sound
          - id: c
            text: The abstract alone, since it summarizes what was shown
        answer: a
        feedback: A first pass is about deciding whether to go deeper, and figures show the evidence fast. Methods and proofs belong to later passes. The abstract states a claim, not what was shown.
      - id: following-the-research-frontier.base.v2.4
        prompt: Which is the strongest signal that a reported result will hold up?
        options:
          - id: b
            text: The paper was accepted at a major peer-reviewed conference
          - id: c
            text: The authors report their best run out of five seeds
          - id: a
            text: An independent team reproduced it with their own code
        answer: a
        feedback: Independent replication tests the result directly. Reviewers rarely rerun experiments, and reporting the best of five seeds overstates the typical result.
      - id: following-the-research-frontier.base.v2.5
        prompt: A team can't reproduce a published result. What should happen first?
        options:
          - id: a
            text: Compare versions, data, hyperparameters, and evaluation scripts
          - id: c
            text: Retract support for the result in any talks and write-ups
          - id: b
            text: Contact the journal, since the result is likely fabricated
        answer: a
        feedback: Failed replications usually trace to a hidden difference in setup, which is worth finding. Jumping to fabrication or public retraction skips the diagnosis.
  - id: following-the-research-frontier.transfer.v2
    objective_ref: objective.following-the-research-frontier
    task: transfer
    response_type: single_choice
    points: 1
    hint: Match effort to relevance and checkability. Skim what's off-topic, park what's unverifiable, and go deep only where a checkable claim would change what you do.
    remediation_scene: following-the-research-frontier.triage
    variants:
      - id: following-the-research-frontier.transfer.v2.1
        prompt: You build retrieval systems. An abstract claims a new reranker beats the best baseline by 9 points on a benchmark the authors created, with no code. What's the right triage?
        options:
          - id: b
            text: Do a third pass now, since a 9-point gain is large
          - id: a
            text: Note it in your ledger and wait for code or replication
          - id: c
            text: Skip it for good, since new benchmarks are never useful
        answer: a
        feedback: It's relevant but not yet checkable, and the only evidence is a self-made benchmark. Recording it lets you revisit when code or replications appear. Deep reading can't verify missing code, and new benchmarks can be valuable later.
      - id: following-the-research-frontier.transfer.v2.2
        prompt: A robotics researcher has 45 minutes a week for new papers. Which routine keeps her current without drowning?
        options:
          - id: c
            text: Read the three most-shared papers on social media each week in full
          - id: b
            text: Skim every new paper in her arXiv category at a glance
          - id: a
            text: First-pass abstracts from a few trusted sources and keep a ledger
        answer: a
        feedback: A few trusted sources plus quick first passes fit the time and catch what matters, and the ledger remembers. Popularity picks hype over relevance, and a whole arXiv category is far too many papers.
      - id: following-the-research-frontier.transfer.v2.3
        prompt: An RL paper reports a new algorithm beating PPO, using 3 seeds each and no error bars. What should you ask for before believing the ranking?
        options:
          - id: a
            text: More seeds with error bars, since RL results vary a lot by seed
          - id: b
            text: A larger network, since PPO might just need more capacity
          - id: c
            text: Results on a harder task, since easy tasks inflate gains
        answer: a
        feedback: Henderson et al. showed RL results can swing widely by seed, so 3 unreported runs can't separate the methods. Capacity or harder tasks are separate questions.
      - id: following-the-research-frontier.transfer.v2.4
        prompt: 'Which claim-ledger entry is most useful to your future self?'
        options:
          - id: b
            text: '"Great paper on sparse attention; big speedups; must try soon."'
          - id: a
            text: '"v1: 2.1× at 16k on A100, author-reported; code out; we got 1.3× at 8k."'
          - id: c
            text: '"Sparse attention is now solved; replaces FlashAttention for us."'
        answer: a
        feedback: A useful entry records the version, the exact claim, who measured it, and your own check. The others record a feeling or a conclusion the evidence doesn't support.
      - id: following-the-research-frontier.transfer.v2.5
        prompt: A widely shared preprint's v2 drops a headline result after reviewers on OpenReview found a data leak. You mentioned v1 in a team memo. What should you do?
        options:
          - id: c
            text: Leave the memo, since v1 was accurate when you wrote it
          - id: b
            text: Delete the memo and your ledger entry to avoid confusion
          - id: a
            text: Update the memo and ledger, noting what changed in v2 and why
        answer: a
        feedback: Updating while keeping the history tells readers what's true now and why it changed. Leaving it spreads a result the authors withdrew; deleting it hides the lesson.
