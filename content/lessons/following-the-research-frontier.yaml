schema_version: 0.2-draft
lesson:
  id: following-the-research-frontier
  version: 0.3.0-draft
  title: Maintain a research record that can change with evidence
  state: draft
  summary: Keep a research notebook that can change when the evidence changes.
  slot: M34.8
  category: learning
  sources:
  - title: Model Cards
    url: https://arxiv.org/abs/1810.03993
  - title: Deep Reinforcement Learning that Matters
    url: https://arxiv.org/abs/1709.06560
objectives:
- id: objective.following-the-research-frontier
  version: 1-draft
  statement: Research literacy requires versioned claims, primary sources, competing explanations, replication
    status, and explicit updates; frontier coverage should track evidence rather than imply a final complete
    taxonomy.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - following-the-research-frontier.base
  - following-the-research-frontier.transfer
  prerequisites:
  - anyOf:
    - objective.emerging-architecture-evidence
  - anyOf:
    - objective.ai-assisted-discovery
scenes:
- id: following-the-research-frontier.s1
  title: Maintain a claim ledger
  type: explanation
  depth: intuition
  objective_refs:
  - objective.following-the-research-frontier
  markdown: 'For each result, record the question, method, source revision, data, baseline, metric, and stated
    limits. Separate author-reported findings from independent replication and your own inference. A revised
    paper can change details even when its title and model name stay the same.


    A useful entry might read: “Paper revision 2 reports 82% on dataset D using four attempts per item; baseline
    gets 80% using one. Independent replication not found in this review.” That record preserves an observation
    without concluding that the new architecture caused a two-point gain. If revision 3 corrects the score
    or attempt budget, update the entry and preserve what changed. A claim ledger is a record of evidence,
    not a list of permanent winners.'
  text_mode: 'For each result, record the question, method, source revision, data, baseline, metric, and stated
    limits. Separate author-reported findings from independent replication and your own inference. A revised
    paper can change details even when its title and model name stay the same.


    A useful entry might read: “Paper revision 2 reports 82% on dataset D using four attempts per item; baseline
    gets 80% using one. Independent replication not found in this review.” That record preserves an observation
    without concluding that the new architecture caused a two-point gain. If revision 3 corrects the score
    or attempt budget, update the entry and preserve what changed. A claim ledger is a record of evidence,
    not a list of permanent winners.'
  bridges: []
- id: following-the-research-frontier.s2
  title: Read the comparison conditions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.following-the-research-frontier
  markdown: Check training budget, data access, evaluation prompts, selection procedures, and uncertainty.
    A reported gain may combine architecture, data, and engineering changes. Competing explanations should
    be written down before treating the favored mechanism as established.
  text_mode: Check training budget, data access, evaluation prompts, selection procedures, and uncertainty.
    A reported gain may combine architecture, data, and engineering changes. Competing explanations should
    be written down before treating the favored mechanism as established.
  bridges: []
- id: following-the-research-frontier.s3
  title: Use replications and negative evidence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.following-the-research-frontier
  markdown: Independent implementations and failed replications help identify sensitivity to hidden assumptions
    or implementation details. A mismatch is a reason to inspect conditions, not automatically proof of fraud
    or of the original claim. Preserve negative results and unresolved discrepancies.
  text_mode: Independent implementations and failed replications help identify sensitivity to hidden assumptions
    or implementation details. A mismatch is a reason to inspect conditions, not automatically proof of fraud
    or of the original claim. Preserve negative results and unresolved discrepancies.
  bridges: []
- id: following-the-research-frontier.s4
  title: Update the learning map
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.following-the-research-frontier
  markdown: Add new concepts when they introduce a distinct mechanism or resolve an open question, and revise
    prerequisites when better explanations emerge. Keep dated case studies as historical anchors. A comprehensive
    foundation supports reading new work; no static course can contain every future paper or settle every active
    debate.
  text_mode: Add new concepts when they introduce a distinct mechanism or resolve an open question, and revise
    prerequisites when better explanations emerge. Keep dated case studies as historical anchors. A comprehensive
    foundation supports reading new work; no static course can contain every future paper or settle every active
    debate.
  bridges: []
- id: following-the-research-frontier.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.following-the-research-frontier
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Keep a dated record of what was claimed, how it was tested, and whether others reproduced it. Revise
    the record when the evidence changes.
- id: following-the-research-frontier.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.following-the-research-frontier
  markdown: Keep a dated record of what was claimed, how it was tested, and whether others reproduced it. Revise
    the record when the evidence changes.
  text_mode: Keep a dated record of what was claimed, how it was tested, and whether others reproduced it.
    Revise the record when the evidence changes.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - following-the-research-frontier.s1
    - following-the-research-frontier.s2
    - following-the-research-frontier.s3
    - following-the-research-frontier.s4
    - following-the-research-frontier.check
