schema_version: 0.2-draft
lesson:
  id: case-based-and-hybrid-decisions
  version: 0.1.0-draft
  title: Reuse past cases and combine explicit knowledge with learned predictions
  state: draft
  summary: Case-based reasoning retrieves and adapts prior solutions, while hybrid decision systems combine rules,
    models, and human knowledge through explicit conflict and responsibility boundaries.
  slot: M32.5
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
  - title: 'Case-Based Reasoning: Foundational Issues'
    url: https://doi.org/10.1609/aimag.v15i3.1108
objectives:
- id: objective.case-based-and-hybrid-decisions
  version: 1-draft
  statement: Case-based reasoning retrieves and adapts prior solutions, while hybrid decision systems combine rules,
    models, and human knowledge through explicit conflict and responsibility boundaries.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - case-based-and-hybrid-decisions.base
  - case-based-and-hybrid-decisions.transfer
  prerequisites:
  - anyOf:
    - objective.nearest-neighbors
  - anyOf:
    - objective.rule-engines
scenes:
- id: case-based-and-hybrid-decisions.s1
  title: Retrieve a relevant prior case
  type: explanation
  depth: intuition
  objective_refs:
  - objective.case-based-and-hybrid-decisions
  markdown: A case contains a problem description, solution, and outcome. Retrieval uses a similarity measure over
    relevant features. A repair system might find a prior fault with similar symptoms, but similarity alone does
    not establish that the same underlying cause is present.
  text_mode: A case contains a problem description, solution, and outcome. Retrieval uses a similarity measure over
    relevant features. A repair system might find a prior fault with similar symptoms, but similarity alone does
    not establish that the same underlying cause is present.
  bridges: []
- id: case-based-and-hybrid-decisions.s2
  title: Adapt and verify the solution
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.case-based-and-hybrid-decisions
  markdown: A prior case may involve a different component version or operating condition. Adapt its solution to
    current constraints, test whether it works, and retain the new outcome where appropriate. Blindly copying a
    similar case skips the reasoning that makes reuse useful.
  text_mode: A prior case may involve a different component version or operating condition. Adapt its solution to
    current constraints, test whether it works, and retain the new outcome where appropriate. Blindly copying a
    similar case skips the reasoning that makes reuse useful.
  bridges: []
- id: case-based-and-hybrid-decisions.s3
  title: Combine complementary components
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.case-based-and-hybrid-decisions
  markdown: A hybrid can use a statistical model to rank hypotheses, explicit rules to enforce constraints, and
    a person to resolve unusual cases. Define which component owns each decision. Conflicting outputs need a documented
    resolution rule instead of silently trusting whichever answer arrives first.
  text_mode: A hybrid can use a statistical model to rank hypotheses, explicit rules to enforce constraints, and
    a person to resolve unusual cases. Define which component owns each decision. Conflicting outputs need a documented
    resolution rule instead of silently trusting whichever answer arrives first.
  bridges: []
- id: case-based-and-hybrid-decisions.s4
  title: Maintain knowledge and accountability
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.case-based-and-hybrid-decisions
  markdown: Old cases and rules can become stale as the world changes. Track provenance, version, applicability,
    and observed outcomes. Evaluate coverage, exceptions, and end-to-end quality; interpretable pieces do not automatically
    make their composition easy to understand.
  text_mode: Old cases and rules can become stale as the world changes. Track provenance, version, applicability,
    and observed outcomes. Evaluate coverage, exceptions, and end-to-end quality; interpretable pieces do not automatically
    make their composition easy to understand.
  bridges: []
- id: case-based-and-hybrid-decisions.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.case-based-and-hybrid-decisions
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Case-based reasoning retrieves and adapts prior solutions, while hybrid decision systems combine rules,
    models, and human knowledge through explicit conflict and responsibility boundaries.
- id: case-based-and-hybrid-decisions.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.case-based-and-hybrid-decisions
  markdown: Case-based reasoning retrieves and adapts prior solutions, while hybrid decision systems combine rules,
    models, and human knowledge through explicit conflict and responsibility boundaries.
  text_mode: Case-based reasoning retrieves and adapts prior solutions, while hybrid decision systems combine rules,
    models, and human knowledge through explicit conflict and responsibility boundaries.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - case-based-and-hybrid-decisions.s1
    - case-based-and-hybrid-decisions.s2
    - case-based-and-hybrid-decisions.s3
    - case-based-and-hybrid-decisions.s4
    - case-based-and-hybrid-decisions.check
    gate_refs:
    - gate.core
  scene_aliases:
    case-based-and-hybrid-decisions.recap: case-based-and-hybrid-decisions.check
assessment_families:
- id: case-based-and-hybrid-decisions.base
  objective_ref: objective.case-based-and-hybrid-decisions
  task: base
  response_type: single_choice
  points: 1
  hint: 'Adapt and verify the solution: trace the inputs, operation, and result before choosing.'
  remediation_scene: case-based-and-hybrid-decisions.s2
  variants:
  - id: case-based-and-hybrid-decisions.base.1
    prompt: Does symptom similarity prove the same underlying cause?
    options:
    - id: c
      text: Only if a nearest-neighbor score is high
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Relevant similarity is evidence, not causal identity.
  - id: case-based-and-hybrid-decisions.base.2
    prompt: What follows retrieval in useful case-based reasoning?
    options:
    - id: a
      text: Adaptation and verification for the new situation
    - id: b
      text: Automatic copying without checks
    - id: c
      text: Deleting all prior outcomes
    answer: a
    feedback: The old solution must fit current constraints.
- id: case-based-and-hybrid-decisions.transfer
  objective_ref: objective.case-based-and-hybrid-decisions
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Maintain knowledge and accountability: trace the inputs, operation, and result before choosing.'
  remediation_scene: case-based-and-hybrid-decisions.s4
  variants:
  - id: case-based-and-hybrid-decisions.transfer.1
    prompt: Why define decision ownership in a hybrid?
    options:
    - id: a
      text: To resolve conflicts and make responsibility traceable
    - id: b
      text: To guarantee every component agrees
    - id: c
      text: Only to name teams
    answer: a
    feedback: Composition requires explicit authority and fallback rules.
  - id: case-based-and-hybrid-decisions.transfer.2
    prompt: Can a once-correct rule become stale?
    options:
    - id: b
      text: 'No'
    - id: c
      text: Only if its text changes
    - id: a
      text: 'Yes'
    answer: a
    feedback: Applicability depends on changing conditions.
