schema_version: 0.2-draft
lesson:
  id: case-based-and-hybrid-decisions
  version: 0.4.0-draft
  title: Reuse past cases and combine explicit knowledge with learned predictions
  state: draft
  summary: "An e-bike cuts out on cold hills. The shop has fixed something like it before: which past repair is closest, what needs adapting, and when should a safety rule overrule the model?"
  slot: M32.5
  category: learning
  sources:
    - title: "Case-Based Reasoning: Foundational Issues, Methodological Variations, and System Approaches (Aamodt & Plaza, 1994)"
      url: https://doi.org/10.3233/AIC-1994-7104
    - title: Author copy of Aamodt & Plaza (1994)
      url: https://www.iiia.csic.es/~enric/papers/AICom.pdf
    - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
      url: https://aima.cs.berkeley.edu/
objectives:
  - id: objective.case-based-and-hybrid-decisions
    version: 2-draft
    statement: Case-based reasoning retrieves and adapts prior solutions, while hybrid decision systems combine rules, models, and human knowledge through explicit conflict and responsibility boundaries.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - case-based-and-hybrid-decisions.base.v2
      - case-based-and-hybrid-decisions.transfer.v2
      - case-based-and-hybrid-decisions.calculate
    prerequisites:
      - anyOf:
          - objective.nearest-neighbors
      - anyOf:
          - objective.rule-engines
scenes:
  - id: case-based-and-hybrid-decisions.s1
    title: "\"We've seen this one before\""
    type: explanation
    depth: intuition
    objective_refs:
      - objective.case-based-and-hybrid-decisions
    markdown: |-
      A customer wheels in an e-bike: it cuts out on steep hills, and it's been freezing all week. The senior mechanic doesn't start from electrical theory. She remembers a similar bike last winter, with a four-year-old battery that sagged under load in the cold, and checks that first.

      **Case-based reasoning (CBR)** turns that habit into a method. Here a case is a stored problem, the solution that was tried, and how it turned out. Instead of deriving an answer from general rules, the system finds the most similar past case and adapts its solution. The idea grew from Roger Schank's work on memory in the early 1980s, and Agnar Aamodt and Enric Plaza (1994) described it as a cycle of four steps:

      1. **Retrieve** the most similar past cases.
      2. **Reuse** their solution for the new problem.
      3. **Revise** the solution by testing and adapting it.
      4. **Retain** the new problem, fix, and outcome as a fresh case.

      Retrieval is the idea from the lesson on nearest neighbors, applied to whole problem-and-solution records. The other three steps are what make it reasoning rather than lookup: adapting the old answer, checking it, and learning from the result without retraining anything.
    diagram:
      caption: The CBR cycle (Aamodt & Plaza, 1994). Every solved problem becomes a new case.
      description: A new problem goes to the retrieve step, which also searches the case base. Retrieve passes the most similar case to reuse, which proposes its fix. Revise tests and adapts the fix. The confirmed fix goes to retain, which stores it as a new case in the case base.
      nodes:
        - id: problem
          label: New problem
          note: cuts out on cold hills
          col: 0
          row: 0
          tone: data
        - id: retrieve
          label: Retrieve
          note: weighted similarity
          col: 1
          row: 0
          tone: accent
        - id: reuse
          label: Reuse
          note: copy the old fix
          col: 2
          row: 0
        - id: revise
          label: Revise
          note: test and adapt it
          col: 2
          row: 1
          tone: warn
        - id: retain
          label: Retain
          note: store problem, fix, outcome
          col: 1
          row: 1
        - id: base
          label: Case base
          note: past repairs
          col: 0
          row: 1
          tone: data
      edges:
        - from: problem
          to: retrieve
        - from: base
          to: retrieve
          label: search
        - from: retrieve
          to: reuse
          label: most similar case
        - from: reuse
          to: revise
          label: suggested fix
        - from: revise
          to: retain
          label: confirmed fix
        - from: retain
          to: base
          label: new case
  - id: case-based-and-hybrid-decisions.s2
    title: Score the similarity, feature by feature
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.case-based-and-hybrid-decisions
    markdown: |-
      The new bike: symptom "cuts out on hills," battery 4 years old, 42 °F outside, mid-drive motor. Each feature gets a **local similarity** between 0 and 1. Categories score 1 if they match and 0 if not. Numbers score 1 minus their difference divided by the feature's range (0–6 years for battery age, 40 °F for temperature). Then a weighted average gives one **global similarity**. The mechanic judges symptom most telling (weight 3), then battery age (2), temperature (1), and motor type (1).

      | Case | Symptom (×3) | Age (×2) | Temp (×1) | Motor (×1) | Similarity |
      | --- | ---: | ---: | ---: | ---: | ---: |
      | A: hills, 1 yr, 60 °F, mid | 1 | 1 − 3/6 = 0.5 | 1 − 18/40 = 0.55 | 1 | 5.55/7 = 0.793 |
      | B: hills, 4 yr, 40 °F, hub | 1 | 1 | 0.95 | 0 | 5.95/7 = 0.850 |
      | C: won't power on, 4 yr, 43 °F, mid | 0 | 1 | 0.975 | 1 | 3.975/7 = 0.568 |

      Case B wins, with the fix "replace worn battery."

      ```python run
      cases = [   # past repairs: problem features, then the fix that worked
          {"name": "A", "symptom": "cuts out on hills", "age": 1, "temp": 60, "motor": "mid",
           "fix": "reseat loose battery connector"},
          {"name": "B", "symptom": "cuts out on hills", "age": 4, "temp": 40, "motor": "hub",
           "fix": "replace worn battery (voltage sags in the cold)"},
          {"name": "C", "symptom": "won't power on", "age": 4, "temp": 43, "motor": "mid",
           "fix": "replace blown fuse"},
      ]
      new = {"symptom": "cuts out on hills", "age": 4, "temp": 42, "motor": "mid"}

      weights = {"symptom": 3, "age": 2, "temp": 1, "motor": 1}
      ranges = {"age": 6, "temp": 40}          # battery age 0-6 years, temperature 30 to 70 °F

      def local_sim(feature, a, b):
          if feature in ranges:                # numbers: 1 minus the scaled difference
              return 1 - abs(a - b) / ranges[feature]
          return 1.0 if a == b else 0.0        # categories: match or not

      def similarity(case):
          total = sum(w * local_sim(f, new[f], case[f]) for f, w in weights.items())
          return total / sum(weights.values())

      for case in sorted(cases, key=similarity, reverse=True):
          print(f"case {case['name']}: similarity {similarity(case):.3f}  fix: {case['fix']}")
      ```

      :::predict A new mechanic thinks battery age is irrelevant and sets its weight to 0. Which case wins now?
      Case A. Its similarity becomes (3 + 0.55 + 1)/5 = 0.910, while B drops to (3 + 0.95 + 0)/5 = 0.790. The system now suggests reseating a connector on a bike whose real problem is a tired battery. Change the weight in the code and check. The weights are where the experts' knowledge lives.
      :::

      :::papers Weighted global similarity
      $$\text{sim}(q, c) = \frac{\sum_i w_i\,\text{sim}_i(q_i, c_i)}{\sum_i w_i}, \qquad \text{sim}_i(a, b) = 1 - \frac{|a - b|}{\text{range}_i}$$

      $q$ is the new problem, $c$ a stored case, $w_i$ the feature weights (3, 2, 1, 1), and $\text{sim}_i$ the local similarity of feature $i$, with exact match for categories.
      :::
  - id: case-based-and-hybrid-decisions.s3
    title: Reuse, revise, retain
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.case-based-and-hybrid-decisions
    markdown: |-
      Case B's fix was "replace the battery," but B had a hub motor and this bike has a mid-drive, which takes a different battery pack. **Reuse** copies the *kind* of fix; adapting it to the new bike means ordering the right pack.

      **Revise** means testing before committing. The mechanic measures voltage under load on a cold hill: it sags from 36 V to 29 V, below the controller's cut-off. The diagnosis holds. Had the voltage stayed steady, the retrieved case would have been wrong, and case A's loose connector would be next in line.

      **Retain** stores the new case: symptom, battery age, temperature, *mid-drive*, the fix, the test result, and the date. Next winter, a mid-drive bike with the same complaint will match it better than case B. Record failures too. A case marked "replaced battery, didn't help" stops the system from repeating a costly mistake.

      :::mixup "The most similar case tells you the cause."
      It tells you where to look first. Two bikes can share every recorded feature and fail for different reasons, because the case records only what someone thought to write down. That's why the cycle has a revise step: test the reused fix before trusting it.
      :::

      The retrieve step is everywhere today. When a support assistant pulls up past tickets similar to yours and a language model writes a reply from them, that's CBR's retrieve and reuse steps. The revise and retain steps are the ones teams most often forget to build.
  - id: case-based-and-hybrid-decisions.s4
    title: Rules, models, and people in one system
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.case-based-and-hybrid-decisions
    markdown: |-
      The shop grows and builds a triage system for repair requests. It combines three parts, each owning a different decision:

      - A **learned model** reads the customer's description and ride logs and estimates how likely each fault is.
      - **Hard rules** from the safety manual, such as "a swollen or hot battery means stop riding now."
      - A **technician**, who decides whenever the model's top guess is below 50%.

      A system like this is a **hybrid**. What makes it trustworthy is a written **precedence order**: safety rules first, then the confidence check, then the model. Three requests show it working:

      | Request | Model's top guess | Rule fires? | Who decides | Result |
      | --- | --- | --- | --- | --- |
      | 1 | battery, 0.62 | no | model | test battery first; show case B |
      | 2 | connector, 0.45 | no | technician | below 0.5, so a person reviews |
      | 3 | connector, 0.80 | yes: "battery feels hot" | safety rule | stop riding, bring it in |

      Request 3 is the important one. The model was confident and possibly right about the connector, but the rule owns safety, so it wins. Without the precedence order, whichever part answered first would win, and nobody could explain why.

      Keep the parts current, too. Rules need an owner and a review date, and cases need dates and outcomes, so that a fix for last year's battery model doesn't keep winning retrievals after the maker changes the cells.
  - id: case-based-and-hybrid-decisions.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.case-based-and-hybrid-decisions
    markdown: Compute weighted similarities by hand, then work through a legal-research tool, a help desk, a loan system, and a hospital triage hybrid to see which step or part should decide.
    takeaway: |-
      Case-based reasoning retrieves the most similar past case by weighted similarity, reuses and tests its fix, and retains the outcome. In a hybrid system, write down which part owns each decision and which one wins a conflict.
  - id: case-based-and-hybrid-decisions.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.case-based-and-hybrid-decisions
    markdown: |-
      A past case suggests a possible solution. Check its differences from the new case, adapt the solution, and verify the result before treating reuse as success.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - case-based-and-hybrid-decisions.s1
        - case-based-and-hybrid-decisions.s2
        - case-based-and-hybrid-decisions.s3
        - case-based-and-hybrid-decisions.s4
        - case-based-and-hybrid-decisions.check
      gate_refs:
        - gate.core
  scene_aliases:
    case-based-and-hybrid-decisions.recap: case-based-and-hybrid-decisions.check
assessment_families:
  - id: case-based-and-hybrid-decisions.base
    objective_ref: objective.case-based-and-hybrid-decisions
    task: base
    response_type: single_choice
    points: 1
    hint: 'Adapt and verify the solution: trace the inputs, operation, and result before choosing.'
    remediation_scene: case-based-and-hybrid-decisions.s2
    variants:
      - id: case-based-and-hybrid-decisions.base.1
        prompt: Does symptom similarity prove the same underlying cause?
        options:
          - id: c
            text: Only if a nearest-neighbor score is high
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Relevant similarity is evidence, not causal identity.
        retired: true
      - id: case-based-and-hybrid-decisions.base.2
        prompt: What follows retrieval in useful case-based reasoning?
        options:
          - id: a
            text: Adaptation and verification for the new situation
          - id: b
            text: Automatic copying without checks
          - id: c
            text: Deleting all prior outcomes
        answer: a
        feedback: The old solution must fit current constraints.
        retired: true
  - id: case-based-and-hybrid-decisions.transfer
    objective_ref: objective.case-based-and-hybrid-decisions
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Maintain knowledge and accountability: trace the inputs, operation, and result before choosing.'
    remediation_scene: case-based-and-hybrid-decisions.s4
    variants:
      - id: case-based-and-hybrid-decisions.transfer.1
        prompt: Why define decision ownership in a hybrid?
        options:
          - id: a
            text: To resolve conflicts and make responsibility traceable
          - id: b
            text: To guarantee every component agrees
          - id: c
            text: Only to name teams
        answer: a
        feedback: Composition requires explicit authority and fallback rules.
        retired: true
      - id: case-based-and-hybrid-decisions.transfer.2
        prompt: Can a once-correct rule become stale?
        options:
          - id: b
            text: 'No'
          - id: c
            text: Only if its text changes
          - id: a
            text: 'Yes'
        answer: a
        feedback: Applicability depends on changing conditions.
        retired: true
  - id: case-based-and-hybrid-decisions.base.v2
    objective_ref: objective.case-based-and-hybrid-decisions
    task: base
    response_type: single_choice
    points: 1
    hint: Name the CBR step involved (retrieve, reuse, revise, retain) and remember that the feature weights decide which case counts as "most similar."
    remediation_scene: case-based-and-hybrid-decisions.s3
    variants:
      - id: case-based-and-hybrid-decisions.base.v2.1
        prompt: A CBR help desk retrieves a past case and applies its fix, which fails. The failure is never recorded, and a month later the same case is retrieved and the same fix fails again. Which step was skipped?
        options:
          - id: b
            text: Retrieve, since a better similarity measure would find another case
          - id: a
            text: Retain, since the failed outcome was never stored as a case
          - id: c
            text: Reuse, since the fix should have been copied more exactly
        answer: a
        feedback: Retaining the new problem with its outcome, including failures, is how CBR learns. Without it, the case base can't warn against repeating the fix. The retrieval may have been reasonable; what was missing was memory of the result.
      - id: case-based-and-hybrid-decisions.base.v2.2
        prompt: Two stored cases differ mainly in battery age. Raising the weight on battery age in the similarity measure will most directly change what?
        options:
          - id: a
            text: Which past case is ranked most similar to the new problem
          - id: b
            text: The fix recorded inside each stored case
          - id: c
            text: The range used to scale temperature differences
        answer: a
        feedback: Weights change how much each feature's local similarity counts in the global score, and so change the ranking. The stored fixes and other features' ranges stay the same.
      - id: case-based-and-hybrid-decisions.base.v2.3
        prompt: The retrieved case's fix is "replace the battery," but that case was a hub-motor bike and the new one is mid-drive, which uses a different pack. What does the reuse step call for?
        options:
          - id: c
            text: Retrieve a different case, since this one isn't an exact match
          - id: b
            text: Install the hub-motor battery, since the case says it worked
          - id: a
            text: Keep the kind of fix and adapt it by ordering the mid-drive pack
        answer: a
        feedback: Reuse carries over the solution's idea and adapts its details to the new problem. Copying it literally would install the wrong part, and CBR expects imperfect matches, so there's no need to discard a good one.
      - id: case-based-and-hybrid-decisions.base.v2.4
        prompt: In a hybrid triage system, the model is 80% confident a fault is a loose connector, but a safety rule fires because the battery feels hot. With the precedence order "safety rules, then confidence check, then model," what happens?
        options:
          - id: b
            text: The model wins, since 80% is above the 50% confidence threshold
          - id: a
            text: The safety rule wins, and the rider is told to stop riding
          - id: c
            text: A technician averages the two recommendations into one
        answer: a
        feedback: The precedence order puts safety rules first, so the rule decides regardless of the model's confidence. The confidence check only matters when no rule fires, and conflicting parts aren't averaged.
  - id: case-based-and-hybrid-decisions.transfer.v2
    objective_ref: objective.case-based-and-hybrid-decisions
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask which part should own this decision (past cases, hard rules, a model, or a person) and what happens when two of them disagree.
    remediation_scene: case-based-and-hybrid-decisions.s4
    variants:
      - id: case-based-and-hybrid-decisions.transfer.v2.1
        prompt: A legal-research tool shows the past court case most similar to a new dispute, and a junior lawyer copies its outcome into a brief. What is the missing step?
        options:
          - id: a
            text: Check how the new facts differ and whether the old reasoning still applies
          - id: b
            text: Retrieve more cases until one matches the new dispute on each feature
          - id: c
            text: Raise the similarity threshold so only near-identical cases are shown
        answer: a
        feedback: This skips revise. A similar case is a starting point; the differences in facts decide whether its reasoning carries over. Searching for a perfect match or raising thresholds doesn't replace checking the adaptation.
      - id: case-based-and-hybrid-decisions.transfer.v2.2
        prompt: A bank's loan system combines a credit model with regulatory rules. The model approves an applicant, but a rule forbids lending above a debt-to-income limit. Nobody wrote down which wins. What should the team add?
        options:
          - id: c
            text: A second model trained to predict which of the two is right
          - id: a
            text: A documented precedence order in which regulatory rules override the model
          - id: b
            text: A random tie-break so neither part is favored over time
        answer: a
        feedback: Hard legal constraints should own their decisions and override a model's score, and the order should be written down so outcomes are explainable. A second model or a random tie-break leaves the legal requirement to chance.
      - id: case-based-and-hybrid-decisions.transfer.v2.3
        prompt: A help desk's CBR system keeps recommending a fix for a router model the company stopped selling two years ago, because those cases are the most numerous. What maintenance practice fixes this?
        options:
          - id: b
            text: Delete every case older than one month to keep the base fresh
          - id: c
            text: Double the weight on the symptom feature so model matters less
          - id: a
            text: Store dates and product versions with cases and prefer current ones
        answer: a
        feedback: Cases need dates and applicability so retrieval can prefer those that match today's products. Deleting every case older than a month throws away valuable history, and reweighting symptoms would make the product mismatch count even less.
      - id: case-based-and-hybrid-decisions.transfer.v2.4
        prompt: A hospital triage hybrid uses a model to rank patients and a nurse to review uncertain cases. Nurses are overwhelmed because the model sends 70% of patients for review. Which change keeps the responsibility boundary but reduces the load?
        options:
          - id: a
            text: Improve the model's calibration, then set the review threshold from data
          - id: b
            text: Remove nurse review, since the model already ranks each patient
          - id: c
            text: Send the patients the model is most confident about to the nurses
        answer: a
        feedback: A calibrated model with a threshold chosen from data routes the genuinely uncertain cases to people and handles the rest. Removing review erases the boundary, and sending confident cases to nurses inverts it.
  - id: case-based-and-hybrid-decisions.calculate
    objective_ref: objective.case-based-and-hybrid-decisions
    task: base
    response_type: numeric
    points: 1
    hint: Score each feature (1 or 0 for categories, 1 − difference/range for numbers), multiply by its weight, add, and divide by the total weight.
    remediation_scene: case-based-and-hybrid-decisions.s2
    absolute_tolerance: 0.01
    variants:
      - id: case-based-and-hybrid-decisions.calculate.1
        prompt: Battery age has range 6 years. A new bike's battery is 5 years old and a stored case's is 2 years old. What is the local similarity for battery age?
        answer: 0.5
        feedback: 1 − |5 − 2|/6 = 1 − 3/6 = 0.5.
      - id: case-based-and-hybrid-decisions.calculate.2
        prompt: "Weights are symptom 3, age 2, temperature 1, motor 1. A case's local similarities are symptom 1, age 0.5, temperature 0.8, motor 0. What is its global similarity?"
        answer: 0.686
        feedback: (3 × 1 + 2 × 0.5 + 1 × 0.8 + 1 × 0)/7 = (3 + 1 + 0.8 + 0)/7 = 4.8/7 ≈ 0.686.
      - id: case-based-and-hybrid-decisions.calculate.3
        prompt: Temperature has range 40 °F. The new problem was at 45 °F and a stored case at 55 °F. What is the local similarity for temperature?
        answer: 0.75
        feedback: 1 − |45 − 55|/40 = 1 − 10/40 = 0.75.
      - id: case-based-and-hybrid-decisions.calculate.4
        prompt: "A similarity measure uses two features: symptom (weight 3) and motor (weight 1). A case matches the symptom but not the motor. What is its global similarity?"
        answer: 0.75
        feedback: (3 × 1 + 1 × 0)/(3 + 1) = 3/4 = 0.75.
      - id: case-based-and-hybrid-decisions.calculate.5
        prompt: "With weights symptom 3, age 2, temperature 1, motor 1, case C scores symptom 0, age 1, temperature 0.975, motor 1. What is its global similarity?"
        answer: 0.568
        feedback: (0 + 2 + 0.975 + 1)/7 = 3.975/7 ≈ 0.568, the lowest of the three cases in the lesson.
