assessment_families:
  - id: comparing-decision-models.base
    objective_ref: objective.comparing-decision-models
    task: base
    response_type: single_choice
    points: 1
    hint: For each claim ask three things. Is it documented, measured or inferred? Who ran the test, and on what data and how many examples? What would it still leave unknown about your own messages?
    remediation_scene: comparing-decision-models.s2
    variants:
      - id: comparing-decision-models.base.1
        prompt: Laya's model card reports accuracy 0.766 against 0.727 for Jev on its typed-decisions set. How should Tally read that?
        options:
          - id: c
            text: Vendor numbers are all invented, so it carries no information
          - id: b
            text: Independent proof that Laya is the more accurate system overall
          - id: a
            text: A task-tuned checkpoint's own result, beside Jev figures it didn't measure
        answer: a
        feedback: The 0.766 is for the task-fine-tuned checkpoint (base checkpoints score about 0.36), and the card says the Jev figures are third-party published and never measured by Convai, on different samples and prompts. That makes it a lead, not a verdict. It isn't meaningless, since a card also reports where Jev wins, but it isn't independent evidence.
      - id: comparing-decision-models.base.2
        prompt: TypeSafe's pages give a cost multiple of 244.6× in one place and 444.6× in another. What is the safest move?
        options:
          - id: b
            text: Average the two figures and quote 344.6×
          - id: a
            text: Quote neither, and work out cost from the price and your tokens
          - id: c
            text: Use the larger figure, because it is probably the newer one
        answer: a
        feedback: Two figures for one claim means at least one is wrong, and nothing says which. Averaging and guessing at the newer page both manufacture a number. Cost per decision follows from the published price per million tokens and your own token counts.
      - id: comparing-decision-models.base.3
        prompt: DataCamp reports Jev at 67.8% against GPT-5.6 Terra at 67.9% on TypeSafe's four-workflow evaluation, and notes that no large-scale independent reproduction has surfaced. What kind of evidence is this?
        options:
          - id: c
            text: Proof that the two models match on every kind of task
          - id: b
            text: Independent evidence, because a third party reported it
          - id: a
            text: A third party's report of a maker-built evaluation
        answer: a
        feedback: DataCamp reports a result that TypeSafe's own team designed, and says itself that nobody independent has reproduced it. A third party's byline doesn't change who ran the test, and one evaluation says little about other tasks.
      - id: comparing-decision-models.base.4
        prompt: Laya's benchmark file also shows Jev ahead on Banking77, a 77-label intent set, with a published 0.870 against 0.425 for Laya's base checkpoints. Why is that useful to a buyer?
        options:
          - id: b
            text: It shows Jev is the better system on every task
          - id: c
            text: It shows that Banking77 is an unfair test for Laya
          - id: a
            text: A maker's admitted weak spot shows where to test
        answer: a
        feedback: The card explains that Laya's option-token budget leaves only a few tokens per label. That tells a buyer with many labels exactly where to look, though the Jev figure is imported from published results with different samples and prompts, so the size of the gap isn't like for like. One benchmark doesn't make Jev better everywhere, and a limit the maker admits isn't unfairness.
      - id: comparing-decision-models.base.5
        prompt: CLM's authors say it is 13× faster than Jev with about 1,000 candidates. Tally has 4 routes. What follows?
        options:
          - id: a
            text: The gap may shrink with 4 options, so measure it on Tally's setup
          - id: c
            text: The claim is false, since Tally's 4 routes are far below 1,000
          - id: b
            text: CLM will be about 13× faster for Tally too
        answer: a
        feedback: The speed-up comes from embedding candidate actions once and reusing them, which pays off most with many candidates. The claim can be true for its setting and still not carry over to four routes, so you measure rather than assume either way.
      - id: comparing-decision-models.base.6
        prompt: As of October 4, 2026, which statement about the OpenAI Decisions API is documented rather than inferred?
        options:
          - id: b
            text: It restricts a language model's logits to the allowed answers
          - id: c
            text: It costs about the same per million tokens as Jev
          - id: a
            text: It was announced on September 29, 2026 in limited preview
        answer: a
        feedback: The announcement and preview status come from OpenAI's own recap. The mechanism hasn't been published, so naming one is a guess, and no price, schema or latency figure has been verified in an official source.
      - id: comparing-decision-models.base.7
        prompt: A blog post says "Laya scores 0.766." Which detail must come with that number before you compare it with anything?
        options:
          - id: b
            text: The year the model's license was first published online
          - id: a
            text: The checkpoint that produced it, and who measured the comparison
          - id: c
            text: How many GPUs the company that built it owns
        answer: a
        feedback: A result belongs to a named configuration, here the task-fine-tuned checkpoint, and its meaning depends on who ran the comparison and on what samples. A base checkpoint of the same model scores far lower. License dates and hardware ownership don't change what the number means.
  - id: comparing-decision-models.transfer
    objective_ref: objective.comparing-decision-models
    task: transfer
    response_type: single_choice
    points: 1
    hint: Treat each scenario as a bake-off design problem. Which measurement is missing, whose data it must use, and what the interval says about whether two scores can be told apart?
    remediation_scene: comparing-decision-models.s3
    variants:
      - id: comparing-decision-models.transfer.1
        prompt: A spam-filter vendor says "99% accuracy" on 100 emails from its own demo set. What is the main thing missing?
        options:
          - id: b
            text: A bigger model, since 100 emails is too few for training
          - id: a
            text: A test on your own mail, with an interval
          - id: c
            text: A lower price, since accuracy that high is rarely worth paying for
        answer: a
        feedback: The demo set may look nothing like your inbox, and 100 emails leaves an interval of a couple of points even at 99%. Model size and price are separate questions from whether the number holds for you.
      - id: comparing-decision-models.transfer.2
        prompt: On 150 of your labelled messages, system X scores 0.82 and system Y 0.79. The 95% interval for X minus Y runs from -0.04 to +0.10. What should you conclude?
        options:
          - id: c
            text: Y is better, because the lower end of the interval is below zero
          - id: b
            text: X is better, since 0.82 is higher than 0.79
          - id: a
            text: The sample can't resolve it, so add measurements or labels
        answer: a
        feedback: An interval that contains zero means the data are compatible with X ahead, behind or level. That isn't evidence that the two are equal, and choosing either by the point estimate reads noise as a result. Latency, cost and calibration may settle it, or more labelled messages.
      - id: comparing-decision-models.transfer.3
        prompt: A decision model averages 90 ms in a demo, yet your checkout page feels slow when it's added. Which measurement is most likely missing?
        options:
          - id: a
            text: The 95th-percentile latency on your own servers
          - id: c
            text: The model's ECE on your data
          - id: b
            text: The model's average cost per decision
        answer: a
        feedback: An average hides the slow tail, and a user who hits a slow call remembers it. The 95th percentile, measured from your own setup, shows how bad the slow calls are. ECE and cost are about other trade-offs.
      - id: comparing-decision-models.transfer.4
        prompt: A system scores well across a public benchmark, but 40% of your support tickets are in Portuguese and the benchmark has almost none. What should you add?
        options:
          - id: b
            text: Weight the benchmark scores by how common each language is online
          - id: c
            text: Retrain the system on the benchmark's English examples
          - id: a
            text: A slice test on enough labelled Portuguese tickets
        answer: a
        feedback: Overall numbers hide how a system does on the slice you care about. A labelled Portuguese sample, large enough for an interval, shows it directly. Reweighting by web frequency doesn't match your traffic, and retraining on English can't fix a Portuguese gap.
      - id: comparing-decision-models.transfer.5
        prompt: On your data, systems X and Y have the same accuracy, but X's ECE is 0.02 and Y's is 0.09. Tally will route by a gate. What should it measure next?
        options:
          - id: c
            text: Nothing more, since X's low ECE shows its gate is safe
          - id: b
            text: It makes no difference, because accuracy is equal
          - id: a
            text: The errors among the messages each system would automate at the gate
        answer: a
        feedback: ECE averages the gap between confidence and accuracy over every message, so a good score can hide a bad slice or a poor high-confidence tail. A gate acts on the top band only, so count the wrong answers there, along with how many messages that is. Equal accuracy doesn't mean equal calibration, and Y's lower calibration may still be fixable by refitting.
  - id: comparing-decision-models.calculate
    objective_ref: objective.comparing-decision-models
    task: base
    response_type: numeric
    points: 1
    hint: "The 95% half-width of an accuracy is 1.96 × √(p × (1 − p) ÷ n). Compute p × (1 − p), divide by n, take the square root, multiply by 1.96, then convert to percentage points."
    remediation_scene: comparing-decision-models.s3
    absolute_tolerance: 0.2
    variants:
      - id: comparing-decision-models.calculate.1
        prompt: A system gets 90% accuracy on 324 held-out messages. What is the half-width of its 95% interval, in percentage points? Use 1.96 × √(p(1 − p) ÷ n).
        answer: 3.3
        feedback: p(1 − p) = 0.09, and 0.09 ÷ 324 = 0.000278, whose square root is 0.01667. Times 1.96 is 0.0327, or 3.3 points.
      - id: comparing-decision-models.calculate.2
        prompt: A system gets 80% accuracy on 200 messages. What is the half-width of its 95% interval, in percentage points? Use 1.96 × √(p(1 − p) ÷ n).
        answer: 5.5
        feedback: 0.8 × 0.2 = 0.16, and 0.16 ÷ 200 = 0.0008, whose square root is 0.02828. Times 1.96 is 0.0554, or 5.5 points.
      - id: comparing-decision-models.calculate.3
        prompt: A system gets 50% accuracy on 100 messages. What is the half-width of its 95% interval, in percentage points? Use 1.96 × √(p(1 − p) ÷ n).
        answer: 9.8
        feedback: 0.5 × 0.5 = 0.25, and 0.25 ÷ 100 = 0.0025, whose square root is 0.05. Times 1.96 is 0.098, or 9.8 points.
      - id: comparing-decision-models.calculate.4
        prompt: A system gets 90% accuracy on 400 messages. What is the half-width of its 95% interval, in percentage points? Use 1.96 × √(p(1 − p) ÷ n).
        answer: 2.9
        feedback: 0.09 ÷ 400 = 0.000225, whose square root is 0.015. Times 1.96 is 0.0294, or 2.9 points. Compared with 324 messages, more data narrowed it only slightly.
      - id: comparing-decision-models.calculate.5
        prompt: A system gets 70% accuracy on 1,000 messages. What is the half-width of its 95% interval, in percentage points? Use 1.96 × √(p(1 − p) ÷ n).
        answer: 2.8
        feedback: 0.7 × 0.3 = 0.21, and 0.21 ÷ 1,000 = 0.00021, whose square root is 0.01449. Times 1.96 is 0.0284, or 2.8 points.
