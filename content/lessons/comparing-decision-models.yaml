objectives:
  - id: objective.comparing-decision-models
    version: 1-draft
    statement: Claims about decision models fall into documented, measured and inferred, and a measurement is only as strong as who ran it and on what data. A fair comparison runs the candidates on your own labelled messages and reports accuracy with intervals, calibration, tail latency, cost and slices.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - comparing-decision-models.base
      - comparing-decision-models.transfer
      - comparing-decision-models.calculate
    prerequisites:
      - anyOf:
          - objective.building-with-decision-models
      - anyOf:
          - objective.evaluation-metrics-and-uncertainty
scenes:
  - id: comparing-decision-models.s1
    title: Five announcements in one month
    type: explanation
    depth: intuition
    objective_refs:
      - objective.comparing-decision-models
    markdown: |-
      Tally's manager forwards five announcements from September 2026. Each promises fast, cheap decisions from a "System One" model, one that scores a closed set of answers instead of writing text. Which should Tally try?

      Start with what each maker published. This is a snapshot as of October 3, 2026, and every number belongs to the party named beside it.

      | System | How it scores options | Numbers published, and by whom | Limits stated |
      | --- | --- | --- | --- |
      | **Jev** (TypeSafe AI, closed, early access) | Undisclosed | 70 to 500 ms; \$0.042 per million input tokens (TypeSafe) | Own team built the evals; speedups shrink with many options |
      | **Laya** (Convai Innovations, Apache 2.0) | Encoder with a [MASK] slot per option | Accuracy 0.766 vs 0.727 for Jev 1.13 on its own test set; median 32.8 ms on a T4 GPU (Convai) | Near chance before fine-tuning; weak on ordinal scores; ships overconfident |
      | **CLM** (Stanford and NVIDIA authors, Apache 2.0) | Frozen Qwen3-8B, then softmax over similarities | "13× faster than Jev" with about 1,000 candidates (the authors) | No text generation; tied to Qwen3-8B |
      | **Nimble** (Bespoke Labs, open per press reports) | Reads an LLM's logits for allowed tokens | 90.12% vs 93.21% for Jev 1.13.0 on 324 held-out examples (Bespoke's figures, via OrcaRouter) | Second-hand; Bespoke's own model-generated test set |
      | **OpenAI Decisions API** (closed, limited preview from September 29, 2026) | Not disclosed | About 150 ms vs about 1.6 s for a normal call (press reports) | Price, option limit, fine-tuning not announced |

      How much of this table can you stand on?
  - id: comparing-decision-models.s2
    title: Documented, measured, inferred, and who ran the test
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.comparing-decision-models
    markdown: |-
      Sort each claim into one of three kinds. A **documented** claim is what a maker says its system is or does: a mechanism, a limit, a price. A **measured** claim is a number from a test, so ask who ran it, on what data, and how many examples. An **inferred** claim is a guess nobody has confirmed.

      | Claim | Kind | Who stands behind it | What it can't tell you |
      | --- | --- | --- | --- |
      | A choice takes up to 255 options | documented | TypeSafe docs | Quality at 255 options |
      | 70 to 500 ms, against 3 to 329 s for frontier LLMs | measured by the maker | TypeSafe, on evals its own team built | Speed on your messages and network |
      | "193.6× faster"; cost multiple shown as both 244.6× and 444.6× on different pages | measured by the maker | TypeSafe | Which cost multiple is right, so quote neither |
      | Laya 0.766 vs Jev 0.727 | measured by a competitor | Convai, on Jev 1.13 | How Jev does today; the same card shows Jev ahead on Banking77, 0.870 (72 labels) to 0.425 (77 labels) |
      | Nimble 90.12% vs 93.21% | measured by the developer | Bespoke Labs, via OrcaRouter | The winner: on 324 examples each score carries about ±3 points, so a 3-point gap sits inside the noise unless a paired test says otherwise |
      | Jev 67.8% vs GPT-5.6 Terra 67.9% on four workflows | maker's eval, third-party report | DataCamp: "no large-scale independent reproduction has surfaced yet" | Whether it holds on other tasks |
      | The Decisions API scores allowed answers from a language model's outputs | inferred | Nobody | Anything; OpenAI hasn't said |

      Two traps sit in that table. A **vendor-built eval** is designed by a team that hopes to look good; TypeSafe says "some bias could exist." A **competitor's measurement** can tilt the other way, because the rival picks the tasks and the version. Trust more the makers who report their own losses or release data and setup for reruns (press coverage says Bespoke Labs did).

      :::predict Laya's card says 0.766 against Jev's 0.727. Which is more accurate?
      You can't say. A competitor ran one Jev version on tasks it chose, and the same card has Jev far ahead on a large label set. It does tell you where to test.
      :::

      :::mixup "A bigger speed-up number means it will be that much faster for me."
      Laya's 32.8 ms is on a T4 GPU. CLM's 13× is with about 1,000 candidates, and Tally's four routes may shrink it. Measure median and 95th-percentile latency yourself.
      :::
    bridges: []
  - id: comparing-decision-models.s3
    title: Run your own bake-off
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.comparing-decision-models
    markdown: |-
      A **bake-off** runs every candidate on the same labelled examples from your own traffic. For Tally:

      1. Pull 200 recent messages and have staff label them. Fix the set before you look at results. If two staff disagree on 8% of messages (invented), no system can honestly score much above 92%, so check label agreement first.
      2. Run every system on the same messages with the same options.
      3. Report accuracy with a 95% interval, the **bootstrap** way: resample the 200 messages with replacement 2,000 times and take the middle 95% of the accuracies.
      4. Report calibration: ECE and a **reliability table** (confidence band, messages, mean confidence, actual accuracy).
      5. Report latency as p50 and p95 (median and 95th percentile), measured from your servers.
      6. Report cost per decision from the current price list and your token counts.
      7. Test slices: your real number of options, rare routes, other languages.

      Here, two invented systems (not products) run on 200 invented messages.

      ```python run
      import numpy as np

      rng = np.random.default_rng(12)
      n = 200                                    # invented: 200 labelled Tally messages
      ease = rng.beta(5, 2, n)                   # how easy each message is (shared)
      conf = {"A": ease, "B": np.clip(ease + 0.12, 0, 0.99)}
      hit = {"A": rng.random(n) < ease, "B": rng.random(n) < np.clip(ease + 0.03, 0, 1)}
      lat = {"A": rng.lognormal(np.log(0.30), 0.35, n), "B": rng.lognormal(np.log(0.05), 0.70, n)}
      price = {"A": 0.00004, "B": 0.0004}        # invented dollars per decision
      idx = [rng.integers(0, n, n) for _ in range(2000)]   # same resamples for every system

      def bands(c, bounds):                      # list of (mask, low, high) confidence bands
          return [(((c >= lo) & (c < hi)) if hi < 1 else (c >= lo)) for lo, hi in bounds]

      def ece(c, h):
          return sum(m.mean() * abs(c[m].mean() - h[m].mean())
                     for m in bands(c, [(0, .2), (.2, .4), (.4, .6), (.6, .8), (.8, 1)]) if m.any())

      for s in "AB":
          lo, hi = np.percentile([hit[s][i].mean() for i in idx], [2.5, 97.5])
          print(f"{s}: accuracy {hit[s].mean():.3f} (95% CI {lo:.3f}-{hi:.3f}), "
                f"ECE {ece(conf[s], hit[s]):.3f}, p50 {np.percentile(lat[s], 50) * 1000:.0f} ms, "
                f"p95 {np.percentile(lat[s], 95) * 1000:.0f} ms, cost per 1,000 ${price[s] * 1000:.2f}")

      d = hit["B"].mean() - hit["A"].mean()
      lo, hi = np.percentile([hit["B"][i].mean() - hit["A"][i].mean() for i in idx], [2.5, 97.5])
      print(f"B minus A accuracy: {d:.3f} (95% CI {lo:.3f} to {hi:.3f})")

      print("B reliability (band: messages, mean confidence, accuracy)")
      for (lo, hi), m in zip([(0, .6), (.6, .8), (.8, 1)], bands(conf["B"], [(0, .6), (.6, .8), (.8, 1)])):
          print(f"  {lo:.1f}-{hi:.1f}: {m.sum():3d}, {conf['B'][m].mean():.2f}, {hit['B'][m].mean():.2f}")

      short = np.arange(n) < 30                  # invented slice: 30 messages in Spanish
      for s in "AB":
          print(f"{s} on the 30-message Spanish slice: {hit[s][short].mean():.2f}; the other 170: {hit[s][~short].mean():.2f}")
      ```

      **What you should see:**

      ```text
      A: accuracy 0.730 (95% CI 0.665-0.790), ECE 0.037, p50 298 ms, p95 536 ms, cost per 1,000 $0.04
      B: accuracy 0.765 (95% CI 0.705-0.825), ECE 0.076, p50 46 ms, p95 140 ms, cost per 1,000 $0.40
      B minus A accuracy: 0.035 (95% CI -0.045 to 0.115)
      B reliability (band: messages, mean confidence, accuracy)
        0.0-0.6:  12, 0.51, 0.42
        0.6-0.8:  59, 0.72, 0.64
        0.8-1.0: 129, 0.93, 0.85
      A on the 30-message Spanish slice: 0.63; the other 170: 0.75
      B on the 30-message Spanish slice: 0.67; the other 170: 0.78
      ```

      **Accuracy:** B scores 0.765 and A 0.730, but each interval is about ±6 points, and the paired difference of +0.035 runs from -0.045 to +0.115. Nothing separates them. **Calibration:** A's ECE is 0.037, half of B's 0.076. B says 0.93 and is right 85% of the time, so refit its temperature before gating on it. **Speed and cost:** B's median is 46 ms against 298 ms, and its p95 is 140 ms against 536 ms, but B costs 10 times more, \$8 against \$0.80 a day at 20,000 messages. **Slice:** 30 Spanish messages give 0.63 and 0.67, each with about ±17 points of uncertainty.

      The right choice depends on Tally's budget and latency target. A fair bake-off leaves you a table, not a ranking.

      :::predict You've collected 800 messages instead of 200. About how wide does each accuracy interval become?
      About half as wide, roughly ±3 points: the interval shrinks with the square root of the sample size, so four times the data halves it. The paired difference here is about ±8 points at 200 messages, and getting it to ±3 takes well over a thousand.
      :::
    diagram:
      caption: A bake-off in one picture. The same labelled messages go to every candidate, and the decision comes from your own measurements.
      description: Labelled Tally messages go to System A and to System B. Both systems' results flow into one table of measurements covering accuracy with intervals, ECE, p50 and p95 latency, cost and slices. The table feeds a decision made with Tally's own costs and latency target.
      nodes:
        - id: data
          label: 200 labelled messages
          note: fixed before testing
          col: 0
          row: 1
          tone: data
        - id: a
          label: System A
          col: 2
          row: 0
        - id: b
          label: System B
          col: 2
          row: 2
        - id: table
          label: Measurements
          note: accuracy and CI, ECE, p50, p95, cost
          col: 3
          row: 1
          tone: accent
        - id: decide
          label: Decision
          note: your costs and latency target
          col: 4
          row: 1
          tone: warn
      edges:
        - from: data
          to: a
        - from: data
          to: b
        - from: a
          to: table
        - from: b
          to: table
        - from: table
          to: decide
    bridges: []
  - id: comparing-decision-models.s4
    title: Reading tomorrow's announcement
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.comparing-decision-models
    markdown: |-
      On September 29, 2026, OpenAI announced a Decisions API at its developer day. OpenAI's DevDay recap says it focuses a model's intelligence on user-defined questions with finite, pre-defined answers, for classifying content, routing requests or choosing an agent's next action. It's in limited preview, with a broader release planned within days.

      Sorted for Tally today:

      - **Documented:** it exists, what it's for, and its preview status.
      - **Measured:** nothing Tally can check. The speed is a press report of a maker's figure.
      - **Inferred:** how it scores answers. Restricting a language model's output to the allowed answers is plausible but unconfirmed.
      - **Unknown:** the price, the option limit, and fine-tuning.

      So put it on the watch list and bake it off once access opens. Ask of every announcement: who built the evaluation, on what data, with how many examples, on whose hardware, and can anyone rerun it?

      :::try Grade one claim of your own
      Pick a number from any announcement. Write down its kind, who ran the test, and one test on your own data that would settle it.
      :::
    bridges: []
  - id: comparing-decision-models.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.comparing-decision-models
    markdown: Vendor cards, a press summary, an interval to compute, a slow product and a shortlist from another team test whether you can grade a claim and design the bake-off.
    takeaway: |-
      Sort each claim into documented, measured or inferred, and ask who ran the test on what data. Then decide with your own bake-off, reporting intervals, calibration, p95 latency, cost and slices instead of a ranking.
  - id: comparing-decision-models.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.comparing-decision-models
    markdown: |-
      A number is only as good as who measured it and on what. Run your own bake-off on your own messages.
