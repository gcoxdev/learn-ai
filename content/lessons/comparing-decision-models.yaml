objectives:
  - id: objective.comparing-decision-models
    version: 1-draft
    statement: Claims about decision models fall into documented, measured and inferred, and a measurement is only as strong as who ran it and on what data. A fair comparison runs the candidates on your own labelled messages and reports accuracy with intervals, calibration, tail latency, cost and slices.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - comparing-decision-models.base
      - comparing-decision-models.transfer
      - comparing-decision-models.calculate
    prerequisites:
      - anyOf:
          - objective.building-with-decision-models
      - anyOf:
          - objective.evaluation-metrics-and-uncertainty
scenes:
  - id: comparing-decision-models.s1
    title: Five announcements in one month
    type: explanation
    depth: intuition
    objective_refs:
      - objective.comparing-decision-models
    markdown: |-
      Tally's manager forwards five announcements from September 2026. Each promises fast, cheap decisions from a "System One" model, one that scores a closed set of answers instead of writing text. Which should Tally try?

      Start with what each maker published. This is a snapshot as of October 4, 2026, and every number belongs to the party named beside it. Notice too that one brand name can cover several checkpoints (trained versions of a model) with different results, so a fair comparison names the checkpoint, not just the brand.

      | System | How it scores options | Numbers published, and by whom | Limits stated |
      | --- | --- | --- | --- |
      | **Jev** (TypeSafe AI, closed, early access) | Internals not disclosed | 70 to 500 ms; \$0.042 per million input tokens (TypeSafe) | Own team built the evals; speedups shrink with many options |
      | **Laya** (Convai Innovations, Apache 2.0) | Encoder with a [MASK] marker for each option | 0.766 accuracy for its task-fine-tuned checkpoint, beside 0.727 for Jev taken from third-party figures Convai did not measure | Base checkpoints near chance before tuning; weak on ordinal scores; overconfident until refit |
      | **CLM** (Stanford and NVIDIA authors, Apache 2.0) | Frozen Qwen3-8B encoder, then softmax over similarities | "13× faster than Jev" with about 1,000 candidates (the authors) | No text generation; tied to Qwen3-8B; probabilities relative to the supplied candidates |
      | **Nimble** (Bespoke Labs, Apache 2.0) | One-token answer codes read from an LLM's logits | 74.8% against 76.0% for Jev 1.13.0, macro accuracy over 3,880 records in 13 subsets (Bespoke's own guide) | Text only; contamination and wording caveats listed |
      | **OpenAI Decisions API** (closed, limited preview announced September 29, 2026) | Not disclosed | None verified in an official source | Price, schema, limits and mechanism not verified |

      How much of this table can you stand on?
  - id: comparing-decision-models.s2
    title: Documented, measured, inferred, and who ran the test
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.comparing-decision-models
    markdown: |-
      Sort each claim into one of three kinds. A **documented** claim is what a maker says its system is or does: a mechanism, a limit, a price. A **measured** claim is a number from a test, so ask who ran it, on what data, with which checkpoint, and how many examples. An **inferred** claim is a guess nobody has confirmed. Some details are simply **unknown**, and a lesson that says so is more useful than one that fills the gap.

      | Claim | Kind | Who stands behind it | What it can't tell you |
      | --- | --- | --- | --- |
      | A choice takes up to 255 options | documented | TypeSafe docs | Quality at 255 options |
      | 70 to 500 ms, against 3 to 329 s for frontier LLMs | measured by the maker | TypeSafe, on evals its own team built | Speed on your messages and network |
      | "193.6× faster"; cost multiple shown as both 244.6× and 444.6× on different pages | measured by the maker | TypeSafe | Which cost multiple is right, so quote neither |
      | Laya 0.766 against Jev 0.727 | measured by the developer, against imported figures | Convai. Its card says the Jev figures are "third-party published, never measured here", with different samples and prompts | Which is better. The 0.766 is the task-fine-tuned checkpoint; base checkpoints score 0.362 zero-shot, and no committed result file backs it yet |
      | Jev 0.870 against Laya 0.425 on Banking77 | Laya measured by its developer; Jev's figure imported from published results | Convai, which says it never measured Jev | A like-for-like gap, since samples and prompts differ; the fine-tuned Laya checkpoint scores 0.492 |
      | Nimble 74.8% against Jev 76.0% | measured by the developer, on public data | Bespoke Labs' guide: 3,880 records, 13 subsets, with contamination and wording caveats | Independent certification. The guide itself lists five statistically significant subsets: four favor Jev and one favors Nimble |
      | Jev 67.8% against GPT-5.6 Terra 67.9% on four workflows | maker's eval, third-party report | DataCamp: "no large-scale independent reproduction has surfaced yet" | Whether it holds on other tasks |
      | Strong overall results can hide confident failures on agent-security slices | measured by a third party | Liu, a recent preprint covering named configurations on security datasets | That your configuration behaves the same on your task |
      | The Decisions API works like Nimble | inferred | Nobody. OpenAI hasn't published its mechanism | Anything |

      Two traps sit in that table. A **vendor-built eval** is designed by a team that hopes to look good; TypeSafe says "some bias could exist." A **competitor's measurement** can tilt the other way, because the rival picks the tasks, the prompts and which version of the other system to quote. Trust more the makers who list their subsets, caveats and losses. Bespoke's public guide is more useful than a headline number, though it is still a project-hosted evaluation and not an independent test.

      :::predict Laya's card says 0.766 against Jev's 0.727. Which is more accurate?
      You can't say. The 0.766 belongs to Laya's task-fine-tuned checkpoint, and the 0.727 is a third-party published Jev figure that Convai didn't measure, taken on different samples and prompts. The same card shows Jev far ahead on a large label set. It does tell you which checkpoint and which tasks to test.
      :::

      :::mixup "A bigger speed-up number means it will be that much faster for me."
      Laya's 32.8 ms is on a T4 GPU. CLM's 13× is with about 1,000 candidates, and Tally's four routes may shrink it. The comparison matters too: a chat model asked for a short schema-constrained answer (as in OpenAI's Structured Outputs guide) isn't the slow paragraph-writer the headline numbers compare against. Measure median and 95th-percentile latency yourself, against the baseline you would really use.
      :::
    bridges: []
  - id: comparing-decision-models.s3
    title: Run your own bake-off
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.comparing-decision-models
    markdown: |-
      A **bake-off** runs every candidate on the same labelled examples from your own traffic. For Tally:

      1. Pull 200 recent messages and have staff label them. Fix the set before you look at results. Check how often two staff label a message differently. If they disagree on 8% of messages (invented), that's a reason to clarify the labelling rules and adjudicate those messages. It doesn't set a ceiling: a consistent model can beat a single annotator, so disagreement tells you how much to trust the labels, not the best score possible.
      2. Run every system on the same messages with the same options.
      3. Report accuracy with a 95% interval, the **bootstrap** way: resample the 200 messages with replacement 2,000 times and take the middle 95% of the accuracies.
      4. Report calibration: ECE and a **reliability table** (band of the number each system reports, messages, mean reported value, actual accuracy). Check which quantity each system reports, a top probability or a provider confidence field, because the two aren't interchangeable. Then measure what your policy will do: the errors among the messages a gate would automate.
      5. Report latency as p50 and p95 (median and 95th percentile), measured from your servers.
      6. Report cost per decision from the current price list and your token counts.
      7. Test slices: your real number of options, rare routes, other languages.
      8. Include the baseline you would really use, such as a short schema-constrained chat-model answer or a plain rules-and-classifier version, so a speed-up is measured against something fair.

      Here, two invented systems (not products) run on 200 invented messages.

      ```python run
      import numpy as np

      rng = np.random.default_rng(12)
      n = 200                                    # invented: 200 labelled Tally messages
      ease = rng.beta(5, 2, n)                   # how easy each message is (shared)
      conf = {"A": ease, "B": np.clip(ease + 0.12, 0, 0.99)}   # the number each system reports
      hit = {"A": rng.random(n) < ease, "B": rng.random(n) < np.clip(ease + 0.03, 0, 1)}
      lat = {"A": rng.lognormal(np.log(0.30), 0.35, n), "B": rng.lognormal(np.log(0.05), 0.70, n)}
      price = {"A": 0.00004, "B": 0.0004}        # invented dollars per decision
      idx = [rng.integers(0, n, n) for _ in range(2000)]   # same resamples for every system

      def bands(c, bounds):                      # list of (mask, low, high) confidence bands
          return [(((c >= lo) & (c < hi)) if hi < 1 else (c >= lo)) for lo, hi in bounds]

      def ece(c, h):
          return sum(m.mean() * abs(c[m].mean() - h[m].mean())
                     for m in bands(c, [(0, .2), (.2, .4), (.4, .6), (.6, .8), (.8, 1)]) if m.any())

      for s in "AB":
          lo, hi = np.percentile([hit[s][i].mean() for i in idx], [2.5, 97.5])
          print(f"{s}: accuracy {hit[s].mean():.3f} (95% CI {lo:.3f}-{hi:.3f}), "
                f"ECE {ece(conf[s], hit[s]):.3f}, p50 {np.percentile(lat[s], 50) * 1000:.0f} ms, "
                f"p95 {np.percentile(lat[s], 95) * 1000:.0f} ms, cost per 1,000 ${price[s] * 1000:.2f}")

      d = hit["B"].mean() - hit["A"].mean()
      lo, hi = np.percentile([hit["B"][i].mean() - hit["A"][i].mean() for i in idx], [2.5, 97.5])
      print(f"B minus A accuracy: {d:.3f} (95% CI {lo:.3f} to {hi:.3f})")

      print("B reliability (band: messages, mean confidence, accuracy)")
      for (lo, hi), m in zip([(0, .6), (.6, .8), (.8, 1)], bands(conf["B"], [(0, .6), (.6, .8), (.8, 1)])):
          print(f"  {lo:.1f}-{hi:.1f}: {m.sum():3d}, {conf['B'][m].mean():.2f}, {hit['B'][m].mean():.2f}")

      print("errors among messages above a 0.80 gate (automated, wrong, rate)")
      for s in "AB":
          auto = conf[s] >= 0.80
          wrong = (~hit[s][auto]).sum()
          print(f"  {s}: {auto.sum()} automated, {wrong} wrong, {wrong / auto.sum():.1%}")

      short = np.arange(n) < 30                  # invented slice: 30 messages in Spanish
      for s in "AB":
          print(f"{s} on the 30-message Spanish slice: {hit[s][short].mean():.2f}; the other 170: {hit[s][~short].mean():.2f}")
      ```

      **What you should see:**

      ```text
      A: accuracy 0.730 (95% CI 0.665-0.790), ECE 0.037, p50 298 ms, p95 536 ms, cost per 1,000 $0.04
      B: accuracy 0.765 (95% CI 0.705-0.825), ECE 0.076, p50 46 ms, p95 140 ms, cost per 1,000 $0.40
      B minus A accuracy: 0.035 (95% CI -0.045 to 0.115)
      B reliability (band: messages, mean confidence, accuracy)
        0.0-0.6:  12, 0.51, 0.42
        0.6-0.8:  59, 0.72, 0.64
        0.8-1.0: 129, 0.93, 0.85
      errors among messages above a 0.80 gate (automated, wrong, rate)
        A: 77 automated, 7 wrong, 9.1%
        B: 129 automated, 19 wrong, 14.7%
      A on the 30-message Spanish slice: 0.63; the other 170: 0.75
      B on the 30-message Spanish slice: 0.67; the other 170: 0.78
      ```

      **Accuracy:** B scores 0.765 and A 0.730, but each interval is about ±6 points, and the paired difference of +0.035 runs from -0.045 to +0.115. This sample doesn't resolve the difference. That isn't the same as the two being equal: the data are compatible with B ahead, level or behind. **Calibration:** A's ECE is 0.037, half of B's 0.076. B says 0.93 and is right 85% of the time, so its temperature may need refitting before you gate on it. A low ECE is an average over all messages, though, and doesn't guarantee any one decision. What the policy needs is the error among the messages it would automate: above a 0.80 gate, A automates 77 messages with 7 wrong (9.1%) and B automates 129 with 19 wrong (14.7%). **Speed and cost:** B's median is 46 ms against 298 ms, and its p95 is 140 ms against 536 ms, but B costs 10 times more, \$8 against \$0.80 a day at 20,000 messages. **Slice:** 30 Spanish messages give 0.63 and 0.67, each with about ±17 points of uncertainty.

      The right choice depends on Tally's budget and latency target. A fair bake-off leaves you a table, not a ranking.

      :::predict You've collected 800 messages instead of 200. About how wide does each accuracy interval become?
      About half as wide, roughly ±3 points: the interval shrinks with the square root of the sample size, so four times the data halves it. The paired difference here is about ±8 points at 200 messages, and getting it to ±3 takes well over a thousand.
      :::
    diagram:
      caption: A bake-off in one picture. The same labelled messages go to every candidate, and the decision comes from your own measurements.
      description: Labelled Tally messages go to System A and to System B. Both systems' results flow into one table of measurements covering accuracy with intervals, ECE, p50 and p95 latency, cost and slices. The table feeds a decision made with Tally's own costs and latency target.
      nodes:
        - id: data
          label: 200 labelled messages
          note: fixed before testing
          col: 0
          row: 1
          tone: data
        - id: a
          label: System A
          col: 2
          row: 0
        - id: b
          label: System B
          col: 2
          row: 2
        - id: table
          label: Measurements
          note: accuracy and CI, ECE, p50, p95, cost
          col: 3
          row: 1
          tone: accent
        - id: decide
          label: Decision
          note: your costs and latency target
          col: 4
          row: 1
          tone: warn
      edges:
        - from: data
          to: a
        - from: data
          to: b
        - from: a
          to: table
        - from: b
          to: table
        - from: table
          to: decide
    bridges: []
  - id: comparing-decision-models.s4
    title: Reading a new announcement
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.comparing-decision-models
    markdown: |-
      On September 29, 2026, OpenAI announced a Decisions API at its developer day. OpenAI's DevDay recap says it points a model called Luna at user-defined questions with finite, pre-defined answers. Developers supply context as text or images, and the answers can be used to classify content, route requests or choose an agent's next action. The recap describes a limited preview on that date, with a broader release planned.

      Sorted for Tally as of October 4, 2026:

      - **Documented:** the announcement, what it's for, that context can be text or images, and the preview status on September 29. A planned release is not evidence that the release has happened.
      - **Measured:** nothing Tally can check. A press report of about 150 ms against about 1.6 s for a normal call hasn't been verified in an official source, so leave it out of any comparison.
      - **Unknown in the public sources reviewed:** the request and response format, whether every option's probability or a separate confidence is returned, how it scores answers, how it was trained or calibrated, the price, the option limit, batching, fine-tuning and rate limits. This reflects what was found, not proof that the details don't exist.

      Here is an illustration, and it is *not* an API example. Say Tally wants a photo of a returned bike sorted into one of five damage categories: bent wheel, cracked frame, flat tyre, paint scratch only, no visible damage. The context is an image, the question is fixed and the answers are a closed list. That is the shape the announcement describes, and it also shows why details matter.

      :::try What would you need to know before choosing it?
      Write five questions about the bike-damage example, such as: does it return a probability for every category, and does it also return a separate confidence? What happens if the photo shows damage that fits no category? Is the price per image or per token? Then ask of every announcement: who built the evaluation, on what data, with how many examples, on whose hardware, and can anyone rerun it?
      :::

      Two recent preprints suggest tests to run on your own data. Sun and colleagues (arXiv 2609.26758) report that with Jev, swapping option labels from "0/1" to "no/yes" while keeping the written definitions the same collapsed one model's ranking quality (AUC from 0.94 to 0.23) while every output stayed schema-valid. So test your option names. Wu and Lim's REFLEX paper (arXiv 2609.26532) used Jev as a fast decision layer for an agent and reported 72.7% fewer strong-model calls than a strong-only agent on their benchmark, with limited advantage over a cheap generative cascade in some settings. So compare against that cascade. Both are single-benchmark preprints, and neither ranks the products for you.
    bridges: []
  - id: comparing-decision-models.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.comparing-decision-models
    markdown: Vendor cards, a press summary, an interval to compute, a slow product and a shortlist from another team test whether you can grade a claim and design the bake-off.
    takeaway: |-
      Sort each claim into documented, measured or inferred, and ask who ran the test on what data. Then decide with your own bake-off, reporting intervals, calibration, p95 latency, cost and slices instead of a ranking.
  - id: comparing-decision-models.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.comparing-decision-models
    markdown: |-
      A number is only as good as who measured it and on what. Run your own bake-off on your own messages.
