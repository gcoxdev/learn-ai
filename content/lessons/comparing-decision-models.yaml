lesson:
  id: comparing-decision-models
  version: 0.4.0-draft
  title: Compare decision models without trusting the brochure
  state: draft
  summary: Five decision-model launches in September 2026, nearly all with numbers their makers produced. Learn to sort documented claims from measured ones, spot who ran the test, and bake off the candidates on your own messages.
  slot: M38.6
  category: learning
  archetype: comparison
