assessment_families:
  - id: penalties-and-clipping.base
    objective_ref: objective.penalties-and-clipping
    task: base
    response_type: single_choice
    points: 1
    hint: Find the gradient's length first, then scale every coordinate by threshold ÷ length.
    remediation_scene: penalties-and-clipping.s2
    variants:
      - id: penalties-and-clipping.base.1
        retired: true
        prompt: Gradient [6, 8] has norm 10. Clipping its norm to 5 gives what?
        options:
          - id: a
            text: '[3, 4]'
          - id: b
            text: '[5, 5]'
          - id: c
            text: '[6, 5]'
        answer: a
        feedback: Global norm clipping multiplies every coordinate by 0.5.
      - id: penalties-and-clipping.base.2
        retired: true
        prompt: Does a finite penalty always enforce a hard constraint exactly?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if its name includes regularization
          - id: a
            text: 'No'
        answer: a
        feedback: An optimizer may trade violation against the rest of the objective.
  - id: penalties-and-clipping.transfer
    objective_ref: objective.penalties-and-clipping
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask where each safeguard acts (the loss, the gradient, the update, or the weight) before choosing one.
    remediation_scene: penalties-and-clipping.s4
    variants:
      - id: penalties-and-clipping.transfer.1
        retired: true
        prompt: Are L2 penalties and decoupled decay always equivalent under adaptive optimization?
        options:
          - id: b
            text: Yes; every optimizer uses the same geometry
          - id: c
            text: Only for vector parameters
          - id: a
            text: No; update transformations differ
        answer: a
        feedback: The penalty gradient can be adaptively scaled while decoupled decay is applied separately.
      - id: penalties-and-clipping.transfer.2
        retired: true
        prompt: Almost every step is heavily clipped. What is a useful response?
        options:
          - id: c
            text: Remove all diagnostics
          - id: a
            text: Investigate gradient scale and training instability
          - id: b
            text: Assume clipping proves healthy training
        answer: a
        feedback: Persistent clipping may indicate a deeper issue or an inappropriate threshold.
  - id: penalties-and-clipping.base.v2
    objective_ref: objective.penalties-and-clipping
    task: base
    response_type: numeric
    points: 1
    absolute_tolerance: 0.001
    hint: 'Global-norm clipping: compute the length √(sum of squares) of the whole gradient. If it exceeds the threshold, multiply every coordinate by threshold ÷ length; otherwise leave it alone.'
    remediation_scene: penalties-and-clipping.s3
    variants:
      - id: penalties-and-clipping.base.v2.1
        prompt: A gradient is [6, 8]. Global-norm clipping uses threshold 5. What is the first coordinate after clipping?
        answer: 3
        feedback: The norm is √(36 + 64) = 10, so every coordinate is scaled by 5 / 10 = 0.5, giving [3, 4]. Clamping each coordinate to 5 would give 5 instead and change the direction.
      - id: penalties-and-clipping.base.v2.2
        prompt: A gradient is [0, 3, 4]. Global-norm clipping uses threshold 1. What is the last coordinate after clipping?
        answer: 0.8
        feedback: The norm is √(0 + 9 + 16) = 5, so the scale is 1 / 5 = 0.2, giving [0, 0.6, 0.8]. Dividing by the threshold instead of the norm would get the scale wrong.
      - id: penalties-and-clipping.base.v2.3
        prompt: A model has two weight tensors with gradients [2] and [−1, 2]. Global-norm clipping uses threshold 1.5 over all of them together. What does the gradient [2] become?
        answer: 1
        feedback: The global norm is √(4 + 1 + 4) = 3, so every coordinate is scaled by 1.5 / 3 = 0.5, and [2] becomes [1]. Clipping each tensor separately would scale [2] to 1.5 instead.
      - id: penalties-and-clipping.base.v2.4
        prompt: A gradient is [0.6, −0.8]. Global-norm clipping uses threshold 2. What is the second coordinate after clipping?
        answer: -0.8
        feedback: The norm is √(0.36 + 0.64) = 1, which is already under the threshold of 2, so the gradient passes through unchanged. Clipping only ever shrinks; it never stretches a short gradient up to the threshold.
  - id: penalties-and-clipping.transfer.v2
    objective_ref: objective.penalties-and-clipping
    task: transfer
    response_type: single_choice
    points: 1
    hint: A penalty changes the loss, projection moves weights back into bounds, decoupled decay shrinks weights outside the optimizer, and clipping shortens the step. Match the tool to where the problem shows up.
    remediation_scene: penalties-and-clipping.s4
    variants:
      - id: penalties-and-clipping.transfer.v2.1
        prompt: A mixing weight in a model must stay between 0 and 1. With an L2 penalty added, it still drifts to 1.3 on some steps. Which approach enforces the rule?
        options:
          - id: b
            text: Make the L2 penalty ten times stronger
          - id: a
            text: After each step, project the weight back into [0, 1]
          - id: c
            text: Clip the gradient norm so the weight moves more slowly
        answer: a
        feedback: A penalty only makes large values expensive, so a stronger one reduces drift without forbidding it. Projection enforces the bound after every step. Clipping slows the drift but doesn't stop it.
      - id: penalties-and-clipping.transfer.v2.2
        prompt: A team trains with Adam and an L2 penalty added to the loss. Weights whose gradients are usually large barely shrink at all. What change fixes this?
        options:
          - id: c
            text: Increase the penalty until the large-gradient weights shrink
          - id: b
            text: Clip the global gradient norm so the large gradients get smaller
          - id: a
            text: Switch to AdamW, which applies the decay outside Adam's scaling
        answer: a
        feedback: Inside Adam, the penalty's pull is divided by each weight's typical gradient size, so big-gradient weights feel little decay. AdamW decouples it so every weight shrinks by the same fraction. A bigger penalty would over-shrink the small-gradient weights.
      - id: penalties-and-clipping.transfer.v2.3
        prompt: A run's logs show about 97% of steps clipped, with gradient norms steady around 30 and a clipping threshold of 1. What is the most useful next step?
        options:
          - id: b
            text: Raise the threshold to 30 so clipping stops triggering
          - id: c
            text: Keep going, since clipping is holding training stable
          - id: a
            text: Look for why gradients are 30× larger than expected
        answer: a
        feedback: When nearly every step is clipped, clipping is acting as a hidden 30-times-smaller learning rate, and something upstream (learning rate, loss reduction, input scale) needs fixing. Raising the threshold just removes the protection, and carrying on hides the cause.
      - id: penalties-and-clipping.transfer.v2.4
        prompt: A recurrent network trains smoothly, except that every few thousand steps the loss spikes to NaN after one enormous gradient. Which safeguard targets this?
        options:
          - id: a
            text: Global-norm clipping, which caps each step's length
          - id: b
            text: Weight decay, which shrinks every weight a little each step
          - id: c
            text: An L2 penalty, which makes large weights more expensive
        answer: a
        feedback: The trouble is one rare, huge step, and clipping shortens exactly those while leaving normal steps alone. Decay and penalties act on every step and change where training ends up; they don't stop a single gradient from being enormous.
      - id: penalties-and-clipping.transfer.v2.5
        prompt: To tame a gradient of [12, 1], an engineer clamps each coordinate to at most 2, getting [2, 1]. What has this done to the step?
        options:
          - id: c
            text: Shortened it while keeping the same direction
          - id: b
            text: Shortened it and swung it toward the second weight
          - id: a
            text: Left it unchanged, since only one coordinate was big
        answer: b
        feedback: The ratio went from 12-to-1 to 2-to-1, so the step now leans much more toward the second weight. Global-norm clipping would shrink both coordinates by the same factor and keep the 12-to-1 direction.
