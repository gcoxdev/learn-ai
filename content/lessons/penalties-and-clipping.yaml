lesson:
  id: penalties-and-clipping
  version: 0.3.0-draft
  title: Constrain a solution or change the update
  state: draft
  summary: Separate discouraging large weights, enforcing a limit, and shortening an update that is too large.
  slot: M10.5
  category: learning
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: Decoupled Weight Decay Regularization
    url: https://arxiv.org/abs/1711.05101
objectives:
- id: objective.penalties-and-clipping
  version: 1-draft
  statement: Penalties, decoupled weight decay, projection, and gradient clipping act at different points in
    learning; they should not be treated as interchangeable safeguards.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - penalties-and-clipping.base
  - penalties-and-clipping.transfer
  prerequisites:
  - anyOf:
    - objective.optimization-math
  - anyOf:
    - objective.momentum-and-adam
scenes:
- id: penalties-and-clipping.s1
  title: A penalty changes the objective
  type: explanation
  depth: intuition
  objective_refs:
  - objective.penalties-and-clipping
  markdown: 'Adding a multiple of squared weights to the loss discourages large coefficients. Its derivative
    contributes to the gradient. A hard constraint instead restricts feasible parameters, perhaps through projection
    after a step. A finite penalty does not necessarily enforce a hard limit exactly.


    If a weight must stay between 0 and 1, an update proposing 1.2 can be **projected** back to 1, the nearest
    allowed value in this scalar example. A penalty merely makes some choices more expensive: a sufficiently
    valuable reduction in prediction loss could still outweigh it. “Discourage” and “forbid” describe different
    operations.'
  text_mode: 'Adding a multiple of squared weights to the loss discourages large coefficients. Its derivative
    contributes to the gradient. A hard constraint instead restricts feasible parameters, perhaps through projection
    after a step. A finite penalty does not necessarily enforce a hard limit exactly.


    If a weight must stay between 0 and 1, an update proposing 1.2 can be **projected** back to 1, the nearest
    allowed value in this scalar example. A penalty merely makes some choices more expensive: a sufficiently
    valuable reduction in prediction loss could still outweigh it. “Discourage” and “forbid” describe different
    operations.'
  bridges: []
- id: penalties-and-clipping.s2
  title: Decay need not equal a loss penalty
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.penalties-and-clipping
  markdown: 'With plain gradient descent, a squared-weight penalty can correspond to multiplicative shrinkage
    under matching conventions. With adaptive optimizers, applying a gradient penalty and applying decoupled
    weight decay can have different effects. AdamW makes the decay separate from the adaptive gradient transformation.


    **Decoupled** means the shrinkage is applied separately from the optimizer''s transformation of the prediction
    gradient. An illustrative shrink factor of 0.99 changes a weight of 2 to 1.98. The precise factor depends
    on learning rate and the stated decay convention; it is not an instruction to subtract the same amount
    from every weight.'
  text_mode: 'With plain gradient descent, a squared-weight penalty can correspond to multiplicative shrinkage
    under matching conventions. With adaptive optimizers, applying a gradient penalty and applying decoupled
    weight decay can have different effects. AdamW makes the decay separate from the adaptive gradient transformation.


    **Decoupled** means the shrinkage is applied separately from the optimizer''s transformation of the prediction
    gradient. An illustrative shrink factor of 0.99 changes a weight of 2 to 1.98. The precise factor depends
    on learning rate and the stated decay convention; it is not an instruction to subtract the same amount
    from every weight.'
  bridges:
  - vectors
  - optimization-math
- id: penalties-and-clipping.s3
  title: Shorten a gradient that is too large
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.penalties-and-clipping
  markdown: 'The **Euclidean norm** is a vector’s length: square its coordinates, add them, and take the square
    root. For gradient [3, 4], the norm is √(9 + 16) = 5.


    **Global norm clipping** scales the entire gradient down if its norm exceeds a threshold. To limit this
    gradient to norm 2, multiply both coordinates by 2 / 5, giving [1.2, 1.6]. Scaling them equally preserves
    direction.


    Clamping each coordinate separately is a different form of clipping and can change direction. State which
    method you use when explaining an update.'
  text_mode: 'The **Euclidean norm** is a vector’s length: square its coordinates, add them, and take the square
