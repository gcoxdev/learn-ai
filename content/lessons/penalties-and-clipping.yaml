schema_version: 0.2-draft
lesson:
  id: penalties-and-clipping
  version: 0.1.0-draft
  title: Constrain a solution or change the update
  state: draft
  summary: Penalties, decoupled weight decay, projection, and gradient clipping act at different points in learning;
    they should not be treated as interchangeable safeguards.
  slot: M10.5
  category: learning
  minutes: 12
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: Decoupled Weight Decay Regularization
    url: https://arxiv.org/abs/1711.05101
objectives:
- id: objective.penalties-and-clipping
  version: 1-draft
  statement: Penalties, decoupled weight decay, projection, and gradient clipping act at different points in learning;
    they should not be treated as interchangeable safeguards.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - penalties-and-clipping.base
  - penalties-and-clipping.transfer
  prerequisites:
  - anyOf:
    - objective.optimization-math
  - anyOf:
    - objective.momentum-and-adam
scenes:
- id: penalties-and-clipping.s1
  title: A penalty changes the objective
  type: explanation
  depth: intuition
  objective_refs:
  - objective.penalties-and-clipping
  markdown: Adding a multiple of squared weights to the loss discourages large coefficients. Its derivative contributes
    to the gradient. A hard constraint instead restricts feasible parameters, perhaps through projection after a
    step. A finite penalty does not necessarily enforce a hard limit exactly.
  text_mode: Adding a multiple of squared weights to the loss discourages large coefficients. Its derivative contributes
    to the gradient. A hard constraint instead restricts feasible parameters, perhaps through projection after a
    step. A finite penalty does not necessarily enforce a hard limit exactly.
  bridges: []
- id: penalties-and-clipping.s2
  title: Decay need not equal a loss penalty
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.penalties-and-clipping
  markdown: With plain gradient descent, a squared-weight penalty can correspond to multiplicative shrinkage under
    matching conventions. With adaptive optimizers, applying a gradient penalty and applying decoupled weight decay
    can have different effects. AdamW makes the decay separate from the adaptive gradient transformation.
  text_mode: With plain gradient descent, a squared-weight penalty can correspond to multiplicative shrinkage under
    matching conventions. With adaptive optimizers, applying a gradient penalty and applying decoupled weight decay
    can have different effects. AdamW makes the decay separate from the adaptive gradient transformation.
  bridges:
  - vectors
  - optimization-math
- id: penalties-and-clipping.s3
  title: Clip an excessive gradient
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.penalties-and-clipping
  markdown: Global norm clipping scales a gradient down when its norm exceeds a threshold. Gradient [3, 4] has norm
    5. Clipping to norm 2 multiplies it by 2/5, giving [1.2, 1.6]. This preserves direction in the example while
    limiting magnitude; coordinate-wise clipping would be a different operation.
  text_mode: Global norm clipping scales a gradient down when its norm exceeds a threshold. Gradient [3, 4] has
    norm 5. Clipping to norm 2 multiplies it by 2/5, giving [1.2, 1.6]. This preserves direction in the example
    while limiting magnitude; coordinate-wise clipping would be a different operation.
  bridges: []
- id: penalties-and-clipping.s4
  title: Diagnose before adding a safeguard
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.penalties-and-clipping
  markdown: Clipping can reduce destructive updates but can also conceal a persistent problem if nearly every step
    is clipped. Penalties encode preferences, decay changes parameter evolution, and constraints encode feasibility.
    Inspect gradient norms, loss, validation, and the exact update order before deciding which mechanism is appropriate.
  text_mode: Clipping can reduce destructive updates but can also conceal a persistent problem if nearly every step
    is clipped. Penalties encode preferences, decay changes parameter evolution, and constraints encode feasibility.
    Inspect gradient norms, loss, validation, and the exact update order before deciding which mechanism is appropriate.
  bridges: []
- id: penalties-and-clipping.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.penalties-and-clipping
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Penalties, decoupled weight decay, projection, and gradient clipping act at different points in learning;
    they should not be treated as interchangeable safeguards.
- id: penalties-and-clipping.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.penalties-and-clipping
  markdown: Penalties, decoupled weight decay, projection, and gradient clipping act at different points in learning;
    they should not be treated as interchangeable safeguards.
  text_mode: Penalties, decoupled weight decay, projection, and gradient clipping act at different points in learning;
    they should not be treated as interchangeable safeguards.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - penalties-and-clipping.s1
    - penalties-and-clipping.s2
    - penalties-and-clipping.s3
    - penalties-and-clipping.s4
    - penalties-and-clipping.check
    gate_refs:
