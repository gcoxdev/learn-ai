  bridges: []
- id: penalties-and-clipping.s4
  title: Diagnose before adding a safeguard
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.penalties-and-clipping
  markdown: Clipping can reduce destructive updates but can also conceal a persistent problem if nearly every
    step is clipped. Penalties encode preferences, decay changes parameter evolution, and constraints encode
    feasibility. Inspect gradient norms, loss, validation, and the exact update order before deciding which
    mechanism is appropriate.
  text_mode: Clipping can reduce destructive updates but can also conceal a persistent problem if nearly every
    step is clipped. Penalties encode preferences, decay changes parameter evolution, and constraints encode
    feasibility. Inspect gradient norms, loss, validation, and the exact update order before deciding which
    mechanism is appropriate.
  bridges: []
