schema_version: 0.2-draft
lesson:
  id: sharding-and-recomputation
  version: 0.4.0-draft
  title: Save memory by sharing state or recreating it
  state: draft
  summary: Plain data parallelism keeps 256 identical copies of the optimizer. Remove the duplicates and the 7B model's states drop from 112 GB to under half a gigabyte per GPU.
  slot: M17.5
  category: learning
  sources:
    - title: "ZeRO: Memory Optimizations Toward Training Trillion Parameter Models (Rajbhandari et al., 2019)"
      url: https://arxiv.org/abs/1910.02054
    - title: "PyTorch FSDP: Experiences on Scaling Fully Sharded Data Parallel (Zhao et al., 2023)"
      url: https://arxiv.org/abs/2304.11277
    - title: "Training Deep Nets with Sublinear Memory Cost (Chen et al., 2016)"
      url: https://arxiv.org/abs/1604.06174
    - title: "Reducing Activation Recomputation in Large Transformer Models (Korthikanti et al., 2022)"
      url: https://arxiv.org/abs/2205.05198
    - title: "ZeRO-Offload: Democratizing Billion-Scale Model Training (Ren et al., 2021)"
      url: https://arxiv.org/abs/2101.06840
objectives:
  - id: objective.sharding-and-recomputation
    version: 2-draft
    statement: State sharding, activation checkpointing, and offloading reduce different memory allocations and trade them for communication, recomputation, or transfer latency.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - sharding-and-recomputation.base.v2
      - sharding-and-recomputation.transfer.v2
      - sharding-and-recomputation.calculate
    prerequisites:
      - anyOf:
          - objective.training-memory
      - anyOf:
          - objective.model-parallel-training
scenes:
  - id: sharding-and-recomputation.s1
    title: Stop storing the same optimizer on every GPU
    type: explanation
    depth: intuition
    objective_refs:
      - objective.sharding-and-recomputation
    markdown: |-
      In plain data parallelism every GPU keeps the full model states: 112 GB for the team's 7B model. Look closer and most of that is pure duplication. The fp32 master weights and Adam's $m$ and $v$, 84 GB, are identical on all 256 GPUs, because every GPU applies the same update.

      **ZeRO** (the Zero Redundancy Optimizer; Rajbhandari et al., Microsoft, 2019) removes the duplicates. Each GPU keeps only a **shard**, a 1/N slice of an array, and updates only its own slice. It comes in three stages, each sharding one more item:

      | Stage | What is sharded | Per-GPU model states | 7B model, N = 64 |
      | --- | --- | --- | ---: |
      | Plain data parallel | Nothing | 16 bytes × params | 112 GB |
      | ZeRO-1 | Optimizer states (master, $m$, $v$) | 2 + 2 bytes + 12/N bytes | 29.3 GB |
      | ZeRO-2 | + gradients | 2 bytes + 14/N bytes | 15.5 GB |
      | ZeRO-3 | + bf16 weights | 16/N bytes | 1.75 GB |

      :::papers ZeRO's memory formulas
      With $\Psi$ parameters, $N_d$ data-parallel GPUs, and $K = 12$ bytes of optimizer state per parameter, per-GPU model states are

      $$\underbrace{(2 + 2 + K)\Psi}_{\text{plain}} \;\to\; \underbrace{4\Psi + \tfrac{K\Psi}{N_d}}_{\text{ZeRO-1}} \;\to\; \underbrace{2\Psi + \tfrac{(2+K)\Psi}{N_d}}_{\text{ZeRO-2}} \;\to\; \underbrace{\tfrac{(4+K)\Psi}{N_d}}_{\text{ZeRO-3}}$$

      For $\Psi$ = 7 billion and $N_d$ = 64 these give the table's 112, 29.3, 15.5, and 1.75 GB. The paper's own example, 7.5 billion parameters on 64 GPUs, goes 120 → 31.4 → 16.6 → 1.9 GB.
      :::

      :::predict The team shards over all 256 GPUs. What does each stage give now?
      ZeRO-1: 28 + 84/256 ≈ 28.3 GB. ZeRO-2: 14 + 98/256 ≈ 14.4 GB. ZeRO-3: 112/256 ≈ 0.44 GB. ZeRO-1 and ZeRO-2 barely improve on N = 64, because the unsharded bf16 weights and gradients (28 GB, then 14 GB) set a floor. Only ZeRO-3 keeps shrinking.
      :::

      ```python run
      P = 7e9          # parameters
      N = 64           # data-parallel GPUs sharing the model states
      K = 12           # fp32 master weights + Adam m + v: 4 + 4 + 4 bytes

      stages = {
          "plain data parallel": 2 * P + 2 * P + K * P,
          "ZeRO-1 (optimizer)":  2 * P + 2 * P + K * P / N,
          "ZeRO-2 (+gradients)": 2 * P + (2 + K) * P / N,
          "ZeRO-3 (+weights)":   (2 + 2 + K) * P / N,
      }
      for name, nbytes in stages.items():
          print(f"{name:21s} {nbytes / 1e9:7.2f} GB per GPU")

      # Activation checkpointing: keep only each layer's input, recompute the rest
      L, s, b, h = 32, 4096, 1, 4096
      full = L * 34 * s * b * h                    # every activation kept (fused attention)
      ckpt = L * 2 * s * b * h + 34 * s * b * h    # layer inputs + one layer rebuilt at a time
      print(f"activations kept: {full / 1e9:5.2f} GB; checkpointed: {ckpt / 1e9:5.2f} GB")
      ```

      Change `N` to 8 (one machine): 38.50, 26.25, and 14.00 GB. Add the 18.3 GB of activations and all three fit on an 80 GB A100, but on a 40 GB GPU only ZeRO-3 does.
    bridges: []
  - id: sharding-and-recomputation.zero3
    title: "ZeRO-3 in motion: gather, compute, scatter"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.sharding-and-recomputation
    markdown: |-
      If a GPU holds only 1/256 of the weights, how does it run a layer? It borrows the rest just in time. For each layer, ZeRO-3:

      1. **All-gathers** the layer's weights from every GPU's shard, runs the forward pass, and frees the borrowed weights.
      2. Does the same again during backward, when the layer's weights are needed a second time.
      3. **Reduce-scatters** the layer's gradients: they are summed across GPUs, but each GPU keeps only the sum for its own shard.
      4. Updates its own shard of the master weights with its own shard of $m$ and $v$.

      Only one or two layers' full weights exist on a GPU at any moment: about 0.44 GB per layer for the 7B model (7 billion ÷ 32 layers × 2 bytes). To hide the gathering, ZeRO-3 uses **prefetching**: it starts fetching the next layer's weights while the current layer computes.

      What does it cost? Recall from the data-parallel lesson that an all-reduce is a reduce-scatter followed by an all-gather. ZeRO-1 and ZeRO-2 send the same bytes as plain data parallelism, just arranged differently. ZeRO-3 adds one extra all-gather of the weights, so it moves about 1.5 times as much data. PyTorch's **FSDP** (Fully Sharded Data Parallel) implements the same idea; its default full-sharding mode corresponds to ZeRO-3.
    diagram:
      caption: One layer's journey through a ZeRO-3 step, seen from one GPU.
      description: The GPU starts with a 1/N shard of the layer's weights. An all-gather assembles the full layer weights temporarily. The GPU runs forward, and later backward, then frees them. The layer's full gradients are reduce-scattered, leaving a 1/N gradient shard. The GPU updates its own shard of master weights, m, and v, which produces the next step's weight shard.
      nodes:
        - id: shard
          label: Weight shard (1/N)
          note: all this GPU keeps
          col: 0
          row: 0
          tone: data
        - id: full
          label: Full layer weights
          note: temporary
          col: 2
          row: 0
          tone: warn
        - id: compute
          label: Forward + backward
          col: 4
          row: 0
          tone: accent
        - id: gshard
          label: Gradient shard
          note: 1/N of the summed grads
          col: 4
          row: 2
          tone: data
        - id: update
          label: Update own shard
          note: master, m, v are 1/N
          col: 0
          row: 2
        - id: alt
          label: Other GPUs' shards
          col: 2
          row: 1
          tone: muted
      edges:
        - from: shard
          to: full
          label: all-gather
        - from: alt
          to: full
          dashed: true
        - from: full
          to: compute
        - from: compute
          to: gshard
          label: reduce-scatter
        - from: gshard
          to: update
        - from: update
          to: shard
          label: next step
    bridges: []
  - id: sharding-and-recomputation.s2
    title: Recompute activations instead of storing them
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.sharding-and-recomputation
    markdown: |-
      Sharding shrinks model states, but each 4,096-token sequence still leaves 18.3 GB of activations (from the lesson on training memory). **Activation checkpointing** keeps only a few activations, usually each layer's input, and throws the rest away during forward. When backward reaches a layer, it reruns that layer's forward from the saved input to rebuild what it needs. Chen et al. (2016) popularized the idea.

      For the team's model, each layer's input is 4,096 × 4,096 × 2 bytes ≈ 34 MB, so 32 of them take 1.07 GB. Add one layer rebuilt at a time (0.57 GB) and activations drop from 18.3 GB to about 1.64 GB.

      :::predict A forward pass costs 1 unit of compute and a backward pass about 2. How much extra compute does full checkpointing add?
      One extra forward: 3 units become 4, a third more, about 33%. Korthikanti et al. (2022) measured 30–40% in practice and showed that recomputing only the attention-score part saves most of the memory for a few percent of extra compute.
      :::

      :::mixup "Activation checkpointing means saving the model to disk."
      Same word, different thing. A training checkpoint saves weights and optimizer state to storage so you can resume after a crash (the last lesson in this module). Activation checkpointing decides which intermediate values stay in GPU memory during one step.
      :::
    bridges: []
  - id: sharding-and-recomputation.s3
    title: Park state in CPU memory
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.sharding-and-recomputation
    markdown: |-
      A server's CPU memory is often several times larger than its GPUs' memory, but it sits across a PCIe link of about 32 GB/s each way, about 60 times slower than HBM. **Offloading** stores some tensors there and copies them over when needed.

      What you move matters. Shipping the 7B model's 84 GB of optimizer state across PCIe each step would take about 2.6 s each way. ZeRO-Offload (Ren et al., 2021) avoids that: it keeps the optimizer states on the CPU and runs the Adam update there too, so only 14 GB of bf16 gradients travel to the CPU and 14 GB of updated bf16 weights come back, about 0.44 s each way. Prefetching helps only if each transfer finishes before the GPU needs its data; a GPU that has already stalled can't win back the wait.
    bridges: []
  - id: sharding-and-recomputation.s4
    title: Choose the lever that fits the biggest line
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.sharding-and-recomputation
    markdown: |-
      Each lever shrinks one line of the budget and adds one cost:

      | Lever | Shrinks | Costs |
      | --- | --- | --- |
      | ZeRO-1 or ZeRO-2 | Optimizer states, gradients | Nothing extra over data parallelism |
      | ZeRO-3 / FSDP | Weights too | About 1.5× the communication |
      | Activation checkpointing | Activations | About 33% more compute |
      | Offloading | Whatever you move | PCIe transfers on the critical path |

      So measure first. A long-context fine-tune of a 1B model might hold 60 GB of activations and only 16 GB of states: sharding the optimizer saves little, checkpointing saves most. A 20B model on short sequences is the reverse.

      For a 7B model this is simpler than the 3-D layout from the model-parallelism lesson, so the team settles on FSDP (ZeRO-3) across all 256 GPUs plus activation checkpointing. Each GPU holds 0.44 GB of model states and about 1.6 GB of activations per sequence, leaving room to process all 4 of its sequences at once instead of accumulating them one at a time.
    bridges: []
  - id: sharding-and-recomputation.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.sharding-and-recomputation
    markdown: ZeRO memory for several models and cluster sizes, a long-context fine-tune, a slow offload, and a slow network test whether you can pick the lever that fits the biggest line.
    takeaway: |-
      ZeRO shards optimizer states, then gradients, then weights across data-parallel GPUs, dividing that memory by N. Activation checkpointing trades about a third more compute for most of the activation memory. Pick whichever targets your biggest line.
  - id: sharding-and-recomputation.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.sharding-and-recomputation
    markdown: |-
      Sharding splits stored state, offloading moves it to another memory tier, and recomputation recreates values later. Choose according to what fills memory and what extra work you can afford.
