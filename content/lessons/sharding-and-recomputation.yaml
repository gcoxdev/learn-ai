assessment_families:
  - id: sharding-and-recomputation.base
    objective_ref: objective.sharding-and-recomputation
    task: base
    response_type: single_choice
    points: 1
    hint: 'Checkpoint activations selectively: trace the inputs, operation, and result before choosing.'
    remediation_scene: sharding-and-recomputation.s2
    variants:
      - id: sharding-and-recomputation.base.1
        prompt: What does optimizer-state sharding reduce?
        options:
          - id: a
            text: Duplicate local optimizer-state storage
          - id: b
            text: The mathematical existence of all optimizer state
          - id: c
            text: Every activation automatically
        answer: a
        feedback: State remains distributed across owners.
        retired: true
      - id: sharding-and-recomputation.base.2
        prompt: Is activation checkpointing the same as saving weights to disk?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only for large batches
          - id: a
            text: No; it controls saved intermediates for backward computation
        answer: a
        feedback: The same word describes different mechanisms.
        retired: true
  - id: sharding-and-recomputation.transfer
    objective_ref: objective.sharding-and-recomputation
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Choose the limiting allocation: trace the inputs, operation, and result before choosing.'
    remediation_scene: sharding-and-recomputation.s4
    variants:
      - id: sharding-and-recomputation.transfer.1
        prompt: A long-sequence run is dominated by activations. What directly targets that allocation?
        options:
          - id: b
            text: Only renaming optimizer files
          - id: c
            text: Only vocabulary sorting
          - id: a
            text: Activation recomputation
        answer: a
        feedback: Recomputation reduces saved intermediate tensors.
        retired: true
      - id: sharding-and-recomputation.transfer.2
        prompt: Why can offloading make a fitting model slow?
        options:
          - id: c
            text: It always changes the prediction target
          - id: a
            text: State transfers may sit on the critical path
          - id: b
            text: CPU memory removes all latency
        answer: a
        feedback: Capacity savings introduce data movement.
        retired: true
  - id: sharding-and-recomputation.base.v2
    objective_ref: objective.sharding-and-recomputation
    task: base
    response_type: single_choice
    points: 1
    hint: ZeRO-1 shards the optimizer states, ZeRO-2 adds gradients, ZeRO-3 adds weights. Whatever isn't sharded stays full-size on every GPU.
    remediation_scene: sharding-and-recomputation.s1
    variants:
      - id: sharding-and-recomputation.base.v2.1
        prompt: Which model states does ZeRO stage 2 split across the data-parallel GPUs?
        options:
          - id: b
            text: The optimizer states only
          - id: a
            text: The optimizer states and gradients
          - id: c
            text: The optimizer states, gradients, and weights
        answer: a
        feedback: Stage 1 shards the optimizer states, stage 2 adds the gradients, and stage 3 adds the weights themselves.
      - id: sharding-and-recomputation.base.v2.2
        prompt: With ZeRO-1 over 256 GPUs, the 7B model still needs about 28 GB of model states per GPU rather than almost nothing. Why?
        options:
          - id: a
            text: The bf16 weights and gradients, 4 bytes per parameter, stay unsharded
          - id: b
            text: Optimizer states can only be split into at most 8 pieces in practice
          - id: c
            text: ZeRO-1 keeps a spare copy of the master weights on each GPU for safety
        answer: a
        feedback: ZeRO-1 divides the 12 bytes of optimizer state by 256, but every GPU still holds 2 + 2 bytes per parameter of weights and gradients, 28 GB. Stages 2 and 3 remove that floor.
      - id: sharding-and-recomputation.base.v2.3
        prompt: In ZeRO-3, what happens just before a GPU computes a layer's forward pass?
        options:
          - id: c
            text: It reduce-scatters that layer's gradients across the GPUs
          - id: b
            text: It loads the whole model's weights from CPU memory at once
          - id: a
            text: It all-gathers that layer's weights, then frees them after use
        answer: a
        feedback: Each GPU borrows one layer's full weights at a time with an all-gather and frees them after use. Reduce-scatter happens to gradients in the backward pass, and nothing loads the whole model at once.
      - id: sharding-and-recomputation.base.v2.4
        prompt: Full activation checkpointing reruns each layer's forward pass during backward. If forward costs 1 unit and backward 2, how much does compute per step grow?
        options:
          - id: b
            text: It doubles, since forward now runs twice
          - id: a
            text: It grows by about a third, from 3 units to 4
          - id: c
            text: It barely changes, since recomputed values are cached
        answer: a
        feedback: The extra forward adds 1 unit to the original 3, a 33% increase. Forward runs twice, but it's only a third of the original step; nothing is cached, which is the whole point.
  - id: sharding-and-recomputation.transfer.v2
    objective_ref: objective.sharding-and-recomputation
    task: transfer
    response_type: single_choice
    points: 1
    hint: Find the biggest line of the memory budget first, then pick the lever that shrinks that line at a cost you can afford.
    remediation_scene: sharding-and-recomputation.s4
    variants:
      - id: sharding-and-recomputation.transfer.v2.1
        prompt: A 1B-parameter model is fine-tuned on 32,000-token documents with ZeRO-3 on 8 GPUs. Each GPU holds 2 GB of model states and 60 GB of activations, and it runs out of memory. Which change targets the largest line?
        options:
          - id: a
            text: Turn on activation checkpointing
          - id: b
            text: Shard the states over 16 GPUs
          - id: c
            text: Offload optimizer states to CPU
        answer: a
        feedback: Activations are 60 of the 62 GB, and checkpointing cuts them to a small fraction. More sharding or offloading only chips at the 2 GB of states.
      - id: sharding-and-recomputation.transfer.v2.2
        prompt: A 20B-parameter model trains with plain data parallelism on 64 GPUs using short sequences. Model states need 320 GB per GPU; activations need 6 GB. Which change helps most?
        options:
          - id: c
            text: Checkpoint activations to recompute them in backward
          - id: a
            text: Shard the model states across the GPUs with ZeRO
          - id: b
            text: Shorten the sequences further to cut memory use
        answer: a
        feedback: Model states dominate, and ZeRO-3 over 64 GPUs cuts 320 GB to 5 GB per GPU. Checkpointing or shorter sequences only shrink the 6 GB of activations.
      - id: sharding-and-recomputation.transfer.v2.3
        prompt: After a team offloads optimizer states to CPU memory, the step time triples and GPUs sit idle between layers. What best explains it?
        options:
          - id: b
            text: CPU memory has less total capacity than the GPUs' memory
          - id: a
            text: PCIe transfers now sit on the critical path, not overlapped
          - id: c
            text: Offloading changes the optimizer, so training needs more steps
        answer: a
        feedback: PCIe is far slower than HBM, and transfers that aren't prefetched or overlapped make the GPU wait. CPU memory is usually larger, and offloading doesn't change the math of the update.
      - id: sharding-and-recomputation.transfer.v2.4
        prompt: A cluster has a slow network between machines. A model already fits with ZeRO-2, and the team considers moving to ZeRO-3 anyway. What should they expect?
        options:
          - id: a
            text: About 50% more communication for memory savings they don't need
          - id: b
            text: Faster steps, since each GPU now stores and moves less data
          - id: c
            text: Identical speed, since sharding the weights costs no traffic
        answer: a
        feedback: ZeRO-3 adds an all-gather of the weights, about 1.5 times data-parallel traffic. On a slow network that can slow every step, so stop at the stage that fits.
  - id: sharding-and-recomputation.calculate
    objective_ref: objective.sharding-and-recomputation
    task: base
    response_type: numeric
    points: 1
    hint: "Per GPU with Ψ parameters and N GPUs: ZeRO-1 = 4Ψ + 12Ψ/N, ZeRO-2 = 2Ψ + 14Ψ/N, ZeRO-3 = 16Ψ/N bytes. Give GB to one decimal place (1 GB = 10⁹ bytes)."
    remediation_scene: sharding-and-recomputation.s1
    absolute_tolerance: 0.1
    variants:
      - id: sharding-and-recomputation.calculate.1
        prompt: With ZeRO-3 across 16 GPUs, how many GB of model states does each GPU hold for a 7-billion-parameter model?
        answer: 7
        feedback: 16 × 7 billion ÷ 16 = 7 billion bytes = 7 GB.
      - id: sharding-and-recomputation.calculate.2
        prompt: With ZeRO-1 across the 8 GPUs of one machine, how many GB of model states does each GPU hold for a 7-billion-parameter model?
        answer: 38.5
        feedback: 4 × 7 = 28 GB of unsharded weights and gradients, plus 12 × 7 ÷ 8 = 10.5 GB of sharded optimizer state, is 38.5 GB.
      - id: sharding-and-recomputation.calculate.3
        prompt: With ZeRO-2 across 16 GPUs, how many GB of model states does each GPU hold for a 7-billion-parameter model?
        answer: 20.1
        feedback: 2 × 7 = 14 GB of unsharded weights, plus 14 × 7 ÷ 16 ≈ 6.1 GB of sharded gradients and optimizer state, is about 20.1 GB.
      - id: sharding-and-recomputation.calculate.4
        prompt: With ZeRO-3 across 32 GPUs, how many GB of model states does each GPU hold for a 13-billion-parameter model?
        answer: 6.5
        feedback: 16 × 13 billion = 208 GB, divided by 32 GPUs = 6.5 GB each.
      - id: sharding-and-recomputation.calculate.5
        prompt: Forward costs 1 unit and backward 2 units. With full activation checkpointing adding one extra forward, by what percentage does compute per step increase?
        answer: 33.3
        feedback: The step goes from 3 units to 4, an increase of 1/3 ≈ 33.3%.
      - id: sharding-and-recomputation.calculate.6
        prompt: With checkpointing, a 32-layer model keeps only each layer's bf16 input, 2 × s × b × h bytes. For s = 2,048 tokens, b = 2 sequences and h = 4,096, how many GB do those saved inputs take?
        answer: 1.1
        feedback: 2 × 2,048 × 2 × 4,096 ≈ 33.6 million bytes per layer; × 32 layers ≈ 1.07 GB, about 1.1 GB.
