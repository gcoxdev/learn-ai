assessment_families:
- id: sharding-and-recomputation.base
  objective_ref: objective.sharding-and-recomputation
  task: base
  response_type: single_choice
  points: 1
  hint: 'Checkpoint activations selectively: trace the inputs, operation, and result before choosing.'
  remediation_scene: sharding-and-recomputation.s2
  variants:
  - id: sharding-and-recomputation.base.1
    prompt: What does optimizer-state sharding reduce?
    options:
    - id: a
      text: Duplicate local optimizer-state storage
    - id: b
      text: The mathematical existence of all optimizer state
    - id: c
      text: Every activation automatically
    answer: a
    feedback: State remains distributed across owners.
  - id: sharding-and-recomputation.base.2
    prompt: Is activation checkpointing the same as saving weights to disk?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only for large batches
    - id: a
      text: No; it controls saved intermediates for backward computation
    answer: a
    feedback: The same word describes different mechanisms.
- id: sharding-and-recomputation.transfer
  objective_ref: objective.sharding-and-recomputation
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Choose the limiting allocation: trace the inputs, operation, and result before choosing.'
  remediation_scene: sharding-and-recomputation.s4
  variants:
  - id: sharding-and-recomputation.transfer.1
    prompt: A long-sequence run is dominated by activations. What directly targets that allocation?
    options:
    - id: b
      text: Only renaming optimizer files
    - id: c
      text: Only vocabulary sorting
    - id: a
      text: Activation recomputation
    answer: a
    feedback: Recomputation reduces saved intermediate tensors.
  - id: sharding-and-recomputation.transfer.2
    prompt: Why can offloading make a fitting model slow?
    options:
    - id: c
      text: It always changes the prediction target
    - id: a
      text: State transfers may sit on the critical path
    - id: b
      text: CPU memory removes all latency
    answer: a
    feedback: Capacity savings introduce data movement.
