schema_version: 0.2-draft
lesson:
  id: sharding-and-recomputation
  version: 0.1.0-draft
  title: Save memory by sharing state or recreating it
  state: draft
  summary: State sharding, activation checkpointing, and offloading reduce different memory allocations and trade
    them for communication, recomputation, or transfer latency.
  slot: M17.5
  category: learning
  minutes: 12
  sources:
  - title: ZeRO
    url: https://arxiv.org/abs/1910.02054
  - title: Training Deep Nets with Sublinear Memory Cost
    url: https://arxiv.org/abs/1604.06174
objectives:
- id: objective.sharding-and-recomputation
  version: 1-draft
  statement: State sharding, activation checkpointing, and offloading reduce different memory allocations and trade
    them for communication, recomputation, or transfer latency.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - sharding-and-recomputation.base
  - sharding-and-recomputation.transfer
  prerequisites:
  - anyOf:
    - objective.training-memory
  - anyOf:
    - objective.model-parallel-training
scenes:
- id: sharding-and-recomputation.s1
  title: Shard duplicated training state
  type: explanation
  depth: intuition
  objective_refs:
  - objective.sharding-and-recomputation
  markdown: Ordinary data replicas may duplicate optimizer state, gradients, and parameters. Sharding assigns ownership
    of some of these tensors to different workers, reconstructing or communicating values when needed. Different
    sharding stages retain different amounts locally; read the actual implementation’s state ownership contract.
  text_mode: Ordinary data replicas may duplicate optimizer state, gradients, and parameters. Sharding assigns ownership
    of some of these tensors to different workers, reconstructing or communicating values when needed. Different
    sharding stages retain different amounts locally; read the actual implementation’s state ownership contract.
  bridges: []
- id: sharding-and-recomputation.s2
  title: Checkpoint activations selectively
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sharding-and-recomputation
  markdown: Activation checkpointing saves selected intermediate boundaries and recomputes missing forward values
    during backward differentiation. This is distinct from saving a model checkpoint to disk. A four-block segment
    may save its input instead of every internal activation, then rerun the segment when gradients need them.
  text_mode: Activation checkpointing saves selected intermediate boundaries and recomputes missing forward values
    during backward differentiation. This is distinct from saving a model checkpoint to disk. A four-block segment
    may save its input instead of every internal activation, then rerun the segment when gradients need them.
  bridges: []
- id: sharding-and-recomputation.s3
  title: Move state to another memory tier
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sharding-and-recomputation
  markdown: Offloading stores selected tensors in CPU memory or storage and transfers them when required. It can
    make a larger run fit, while adding bandwidth and latency costs. Prefetching helps only when transfers finish
    before the data are needed and sufficient staging memory exists.
  text_mode: Offloading stores selected tensors in CPU memory or storage and transfers them when required. It can
    make a larger run fit, while adding bandwidth and latency costs. Prefetching helps only when transfers finish
    before the data are needed and sufficient staging memory exists.
  bridges: []
- id: sharding-and-recomputation.s4
  title: Choose the limiting allocation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.sharding-and-recomputation
  markdown: If long sequences dominate activation memory, optimizer-only sharding may not solve the failure. If
    optimizer state dominates, recomputing activations addresses a smaller target. Profile peak allocations and
    communication under a representative step, including temporary gathered parameters and checkpoint writes.
  text_mode: If long sequences dominate activation memory, optimizer-only sharding may not solve the failure. If
    optimizer state dominates, recomputing activations addresses a smaller target. Profile peak allocations and
    communication under a representative step, including temporary gathered parameters and checkpoint writes.
  bridges: []
- id: sharding-and-recomputation.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.sharding-and-recomputation
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: State sharding, activation checkpointing, and offloading reduce different memory allocations and trade
    them for communication, recomputation, or transfer latency.
