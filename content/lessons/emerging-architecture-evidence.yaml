schema_version: 0.2-draft
lesson:
  id: emerging-architecture-evidence
  version: 0.4.0-draft
  title: Evaluate new computing and learning claims without assuming a breakthrough
  state: draft
  summary: A new architecture beats transformers by 12 points; a quantum model promises exponential speedups. Learn the questions that shrink, or confirm, a headline, and the quantum results that surprised everyone.
  slot: M34.7
  category: learning
  sources:
    - title: Quantum Machine Learning (Biamonte et al., Nature 2017)
      url: https://arxiv.org/abs/1611.09347
    - title: Barren Plateaus in Quantum Neural Network Training Landscapes (McClean et al., Nature Communications 2018)
      url: https://arxiv.org/abs/1803.11173
    - title: Quantum Recommendation Systems (Kerenidis & Prakash, 2016)
      url: https://arxiv.org/abs/1603.08675
    - title: A quantum-inspired classical algorithm for recommendation systems (Tang, STOC 2019)
      url: https://arxiv.org/abs/1807.04271
    - title: "Better than classical? The subtle art of benchmarking quantum machine learning models (Bowles, Ahmed & Schuld, 2024)"
      url: https://arxiv.org/abs/2403.07059
    - title: Is quantum advantage the right goal for quantum machine learning? (Schuld & Killoran, PRX Quantum 2022)
      url: https://arxiv.org/abs/2203.01340
objectives:
  - id: objective.emerging-architecture-evidence
    version: 2-draft
    statement: Judge claims about new approaches, including quantum ML, by their assumptions, their baselines, and the full cost of running them, before accepting any practical advantage.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - emerging-architecture-evidence.base.v2
      - emerging-architecture-evidence.transfer.v2
      - emerging-architecture-evidence.calculate
    prerequisites:
      - anyOf:
          - objective.architecture-tradeoff-study
      - anyOf:
          - objective.causal-evaluation-and-negative-results
scenes:
  - id: emerging-architecture-evidence.s1
    title: A 12-point jump, until the baseline caught up
    type: explanation
    depth: intuition
    objective_refs:
      - objective.emerging-architecture-evidence
    markdown: |-
      A preprint introduces the "Recall Lattice," a new memory architecture. Its headline: 12 points better than a transformer (module 15) on a long-document reasoning benchmark. Before you rewrite your roadmap, ask what else differed between the two runs. Here's what a careful reading of the appendix turns up (the paper is invented; the pattern is common):

      | Difference | Recall Lattice | Transformer baseline |
      | --- | --- | --- |
      | Training tokens | 300 billion | 100 billion |
      | Hyperparameter search | 40 runs | defaults from an older paper |
      | Context length at test | 32k | 8k, documents truncated |
      | Seeds reported | best of 3 | 1 |

      Every row could add points without the new mechanism doing anything. A claim about a mechanism needs a comparison that differs in that mechanism alone, like the matched comparisons in module 19's lesson on comparing sequence architectures with an honest budget.
    bridges: []
  - id: emerging-architecture-evidence.s3
    title: Match the baseline, then see what's left
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.emerging-architecture-evidence
    markdown: |-
      Suppose an independent team reruns the comparison, matching tokens, tuning budget, and context length, with 5 seeds each:

      | Setup | Recall Lattice | Transformer | Gap |
      | --- | ---: | ---: | ---: |
      | As published | 71 | 59 | 12 |
      | Same tokens (300B) | 71 | 66 | 5 |
      | + same tuning budget | 71 | 68 | 3 |
      | + same 32k context | 71 | 69.5 | 1.5 |
      | Seed spread (± 1 s.d.) | ± 1.2 | ± 1.4 | |

      :::predict Is the remaining 1.5-point gap a real advantage?
      Not yet. Each model's seed-to-seed spread is more than a point, so a 1.5-point gap could flip with other seeds; it's worth more seeds and a second benchmark. The headline 12 points shrank to 1.5 once the baseline got the same resources, and most of the gain (7 points) came from training data.
      :::

      A **matched baseline** gets the same data, compute, tuning effort, and evaluation settings as the new method, and it should be a strong, current method, not the weakest version you can find. Also check that the benchmark isn't one the new method was developed on.

      :::mixup "It beat the state of the art on a benchmark, so the architecture is better."
      A leaderboard number bundles architecture, data, compute, tuning, and luck. Only a matched comparison, repeated across seeds and tasks, isolates the architecture.
      :::
    bridges: []
  - id: emerging-architecture-evidence.s2
    title: What a quantum speedup has to pay for
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.emerging-architecture-evidence
    markdown: |-
      Quantum machine learning promises dramatic speedups, so it deserves the same questions, plus some new ones.

      A **qubit** is the quantum version of a bit. The state of $n$ qubits is described by $2^n$ numbers called **amplitudes**, and measuring them returns just $n$ ordinary bits, each outcome with probability equal to its amplitude's squared magnitude. So 20 qubits can hold $2^{20} = 1{,}048{,}576$ amplitudes, which is why people suggest storing a million-feature data vector in 20 qubits (**amplitude encoding**).

      Now follow the whole job, not just the quantum core:

      | Step | Rough cost for a million features |
      | --- | --- |
      | Load the data into 20 qubits | in general about a million operations; fast loading assumes a quantum RAM that doesn't yet exist at scale |
      | Run the quantum algorithm | possibly only a few dozen steps; this is the headline |
      | Read the answer out | one measurement gives 20 bits; each estimated probability needs many repeated runs |

      How many runs? To estimate a probability $p$ to within a standard error $\varepsilon$ you need about $p(1-p)/\varepsilon^2$ runs. For $p = 0.5$ and $\varepsilon = 0.01$: $0.25 / 0.0001 = 2{,}500$ runs, each one reloading the data. A fast middle step can't rescue a slow first and last step.

      Training brings its own trap. McClean and colleagues (2018) showed that for many randomly initialized parameterized circuits, the gradients shrink exponentially as qubits are added, a **barren plateau**. The loss landscape becomes flat almost everywhere, and estimating a tiny gradient from noisy measurements takes enormous numbers of runs.
    bridges: []
  - id: emerging-architecture-evidence.dequantization
    title: When the classical side caught up
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.emerging-architecture-evidence
    markdown: |-
      :::story An undergraduate removes an exponential speedup
      In 2016, Kerenidis and Prakash published a quantum algorithm for recommendation systems (suggest products from a huge, mostly empty ratings table) that appeared exponentially faster than any known classical method. It was one of the flagship examples of quantum machine learning. In 2018, Ewin Tang, then an undergraduate at the University of Texas at Austin, set out to prove no fast classical algorithm existed, and instead found one. Her key move was to give the classical algorithm the same kind of data access the quantum one assumed: the ability to sample entries in proportion to their size. With that, a classical method matched the quantum one up to polynomial factors, and the exponential gap disappeared.
      :::

      Researchers call this **dequantization**: showing that a classical algorithm, given equally strong assumptions about data access, does about as well. Several other proposed quantum ML speedups for low-rank linear algebra were dequantized in the following years. Quantum computing isn't useless; a speedup claim is only as strong as its comparison, and both sides must get the same assumptions.

      Empirical checks point the same way. In 2024, Bowles, Ahmed, and Schuld ran 12 popular quantum classifiers (simulated) on 160 small datasets. Out-of-the-box classical models did better overall, and removing entanglement from the quantum models often didn't hurt. As of this writing, there is no widely accepted demonstration of a quantum computer beating strong classical methods on a practical machine-learning task. Some researchers, such as Schuld and Killoran (2022), argue the field should study what quantum models can learn rather than chase advantage claims.
    bridges: []
  - id: emerging-architecture-evidence.s4
    title: Ten minutes with a checklist
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.emerging-architecture-evidence
    markdown: |-
      Here's an invented but typical abstract, and a reader working through it:

      > *"Our quantum kernel classifier achieves 98% accuracy on a medical-imaging task, outperforming a classical support vector machine (91%), and runs with an exponential speedup."*

      | Question | What she finds in the paper |
      | --- | --- |
      | What exactly changed? | The kernel; features were first shrunk from images to 8 numbers by a separate classical step |
      | Real hardware or simulation? | Simulated, 8 qubits |
      | Is the baseline strong and matched? | Default-settings SVM; no gradient boosting or small CNN; no tuning |
      | End-to-end cost? | The speedup is a big-O claim for the kernel step only; loading and 10,000 shots per kernel entry not counted |
      | Uncertainty and repeats? | One test split, about 200 images |
      | Independent replication? | None yet |

      Her summary for the team: "On a tiny simulated problem, a quantum kernel beat an untuned classical model. Interesting to watch; nothing to act on." That's a decision, not a dismissal: if a follow-up shows the gain against tuned baselines on real hardware with full costs counted, she'll revisit it.

      The same six questions work for any emerging claim: a new memory architecture, analog chips, a neuromorphic system from the previous lessons, or the next thing with a striking name.
    bridges: []
  - id: emerging-architecture-evidence.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.emerging-architecture-evidence
    markdown: Count shots and qubits by hand, then audit new claims about a linear-attention model, a quantum optimizer, an analog chip, and a reasoning benchmark.
    takeaway: |-
      A new architecture's gain counts only against a strong baseline given the same data, compute, tuning, and evaluation. For quantum ML, count the cost of loading data and reading answers, and grant the classical side the same assumptions.
  - id: emerging-architecture-evidence.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.emerging-architecture-evidence
    markdown: |-
      For a new computing approach, inspect the mechanism, assumptions, and complete cost. A theoretical advantage and a demonstrated practical benefit need different evidence.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - emerging-architecture-evidence.s1
        - emerging-architecture-evidence.s3
        - emerging-architecture-evidence.s2
        - emerging-architecture-evidence.dequantization
        - emerging-architecture-evidence.s4
        - emerging-architecture-evidence.check
      gate_refs:
        - gate.core
  scene_aliases:
    emerging-architecture-evidence.recap: emerging-architecture-evidence.check
assessment_families:
  - id: emerging-architecture-evidence.base
    objective_ref: objective.emerging-architecture-evidence
    task: base
    response_type: single_choice
    points: 1
    hint: 'Understand the quantum-ML boundary: trace the inputs, operation, and result before choosing.'
    remediation_scene: emerging-architecture-evidence.s2
    variants:
      - id: emerging-architecture-evidence.base.1
        prompt: What can limit a claimed quantum speedup?
        options:
          - id: b
            text: Only the word quantum
          - id: c
            text: All classical baselines must be ignored
          - id: a
            text: Data loading, noise, measurement, and access assumptions
        answer: a
        feedback: End-to-end cost includes more than the central algorithm.
        retired: true
      - id: emerging-architecture-evidence.base.2
        prompt: Does classical simulation of a small quantum circuit prove practical quantum advantage?
        options:
          - id: c
            text: Only if accuracy is high
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Simulation results and hardware advantage are different claims.
        retired: true
  - id: emerging-architecture-evidence.transfer
    objective_ref: objective.emerging-architecture-evidence
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Treat evidence as provisional and specific: trace the inputs, operation, and result before choosing.'
    remediation_scene: emerging-architecture-evidence.s4
    variants:
      - id: emerging-architecture-evidence.transfer.1
        prompt: Why use strong matched baselines?
        options:
          - id: c
            text: Only to increase experiment count
          - id: a
            text: To test whether gains exceed existing methods under comparable conditions
          - id: b
            text: To guarantee the new method loses
        answer: a
        feedback: Weak comparisons can exaggerate novelty and usefulness.
        retired: true
      - id: emerging-architecture-evidence.transfer.2
        prompt: What should a theoretical complexity claim state?
        options:
          - id: a
            text: Its computational and data-access assumptions
          - id: b
            text: Only a headline speedup
          - id: c
            text: That every deployment will improve
        answer: a
        feedback: Assumptions define where the result applies.
        retired: true
  - id: emerging-architecture-evidence.base.v2
    objective_ref: objective.emerging-architecture-evidence
    task: base
    response_type: single_choice
    points: 1
    hint: Ask what else differed besides the mechanism, and for quantum claims, what the loading and readout steps cost and what access the classical side was allowed.
    remediation_scene: emerging-architecture-evidence.s3
    variants:
      - id: emerging-architecture-evidence.base.v2.1
        prompt: A new architecture beats a transformer by 8 points, but it trained on three times as many tokens. What should the authors do before crediting the architecture?
        options:
          - id: b
            text: Report the gain per training token instead of the raw score
          - id: a
            text: Retrain the transformer on the same tokens and compare again
          - id: c
            text: Test the new model on a second benchmark to confirm the gain
        answer: a
        feedback: Only a comparison that differs in the architecture alone can credit the architecture. Dividing by tokens assumes gains scale linearly, and a second benchmark with the same mismatch repeats the confound.
      - id: emerging-architecture-evidence.base.v2.2
        prompt: Why did Ewin Tang's 2018 result remove the claimed exponential speedup of a quantum recommendation algorithm?
        options:
          - id: a
            text: She gave a classical algorithm the same kind of data access the quantum one assumed
          - id: c
            text: She showed that the quantum algorithm contained an error in its main proof
          - id: b
            text: She ran the quantum algorithm on hardware and found it slower than predicted
        answer: a
        feedback: With comparable sampling access, a classical method matched the quantum one up to polynomial factors. The quantum algorithm wasn't wrong, and no hardware was involved; the comparison had granted only one side strong data access.
      - id: emerging-architecture-evidence.base.v2.3
        prompt: A quantum algorithm processes a million-feature vector in 20 qubits in a few dozen steps. Which cost is most likely to erase the speedup?
        options:
          - id: b
            text: Storing the 20 qubits, since each one needs its own processor
          - id: c
            text: The few dozen steps, since quantum gates run slower than CPU gates
          - id: a
            text: Loading the million numbers in, which generally takes about a million steps
        answer: a
        feedback: Preparing an arbitrary state of a million amplitudes generally takes on the order of a million operations, which swamps a fast middle step. Readout adds more, with many repeated runs.
      - id: emerging-architecture-evidence.base.v2.4
        prompt: What is a barren plateau in a parameterized quantum circuit?
        options:
          - id: a
            text: Gradients shrink exponentially with qubit count, so training stalls
          - id: b
            text: The circuit runs out of qubits before it can encode all features
          - id: c
            text: Measurement noise makes the final accuracy stop improving
        answer: a
        feedback: McClean and colleagues showed that for many random initializations the gradient variance vanishes exponentially as qubits are added, leaving a flat landscape. Noise makes those tiny gradients even harder to estimate, but the plateau is about the landscape itself.
      - id: emerging-architecture-evidence.base.v2.5
        prompt: A new model leads the baseline by 1.5 points, and each model's scores vary by about ±1.3 across seeds. What is the best reading?
        options:
          - id: c
            text: A clear win, since the new model scored higher on average
          - id: a
            text: Not yet distinguishable; run more seeds and another task
          - id: b
            text: A clear loss, since the gap is smaller than the spread
        answer: a
        feedback: A gap about the size of seed-to-seed variation could flip with other seeds, so it's unresolved rather than a win or a loss. More seeds and a second task would tell you which.
  - id: emerging-architecture-evidence.transfer.v2
    objective_ref: objective.emerging-architecture-evidence
    task: transfer
    response_type: single_choice
    points: 1
    hint: Run the six checklist questions (what changed, hardware or simulation, matched baseline, end-to-end cost, repeats, replication) and find the one the claim fails first.
    remediation_scene: emerging-architecture-evidence.s4
    variants:
      - id: emerging-architecture-evidence.transfer.v2.1
        prompt: An analog AI chip is reported to be "50× more energy-efficient" than a GPU. The figure covers only the chip's multiply step, not data conversion or memory. What should you ask for?
        options:
          - id: b
            text: The energy per multiply of the GPU's own tensor cores
          - id: c
            text: A larger model, since efficiency grows with model size
          - id: a
            text: Measured energy for the whole task at matched accuracy
        answer: a
        feedback: Converting signals and moving data can dominate the energy, so the whole task must be measured at the same accuracy. Comparing per-multiply numbers repeats the narrow framing.
      - id: emerging-architecture-evidence.transfer.v2.2
        prompt: A quantum optimization startup reports beating a classical solver on scheduling problems. The classical solver ran with a one-second time limit; the quantum run took ten minutes including queueing. What is the main issue?
        options:
          - id: a
            text: The classical baseline wasn't given a comparable time budget
          - id: b
            text: Scheduling problems are too easy to show any quantum advantage
          - id: c
            text: Queueing time should be excluded from the quantum run's cost
        answer: a
        feedback: A baseline limited to one second against a ten-minute run isn't matched. Give the classical solver the same wall-clock budget. Queueing is part of the real cost a user pays.
      - id: emerging-architecture-evidence.transfer.v2.3
        prompt: A linear-attention paper shows its model matching a transformer on short texts and beating it on 64k-token documents, where the transformer's context was cut to 4k. What conclusion is fair?
        options:
          - id: c
            text: Linear attention reasons better over long documents than attention does
          - id: a
            text: The long-document win may come from the context cut, not the mechanism
          - id: b
            text: The two models are equivalent, since they matched on short texts
        answer: a
        feedback: The transformer couldn't see most of each document, so the gap may reflect truncation. A fair test gives both the full context, or compares at equal compute. Short-text parity says nothing about long inputs.
      - id: emerging-architecture-evidence.transfer.v2.4
        prompt: A reasoning architecture tops a benchmark that its authors also used to choose its design during development. What should a reviewer ask for?
        options:
          - id: b
            text: Results on the same benchmark with more random seeds
          - id: a
            text: Results on a separate benchmark not used during design
          - id: c
            text: A larger version of the model on the same benchmark
        answer: a
        feedback: Choosing a design on the benchmark overfits to it, so a fresh benchmark tests whether the gain transfers. More seeds or a bigger model on the same benchmark keep the same bias.
      - id: emerging-architecture-evidence.transfer.v2.5
        prompt: A quantum classifier paper reports results from an 8-qubit simulation. Its abstract says it "demonstrates quantum advantage." What does the evidence support?
        options:
          - id: a
            text: A result about a simulated model, not an advantage on quantum hardware
          - id: c
            text: Quantum advantage for small datasets, which may grow with more qubits
          - id: b
            text: Nothing at all, since simulated circuits can't be studied scientifically
        answer: a
        feedback: An 8-qubit circuit can be simulated on a laptop, so it can't show a speedup over classical computers. The model can still be studied in simulation; the advantage claim is what goes too far.
  - id: emerging-architecture-evidence.calculate
    objective_ref: objective.emerging-architecture-evidence
    task: base
    response_type: numeric
    points: 1
    hint: Estimating a probability p to standard error ε takes about p(1 − p)/ε² runs. Amplitude encoding stores 2ⁿ numbers in n qubits.
    remediation_scene: emerging-architecture-evidence.s2
    absolute_tolerance: 0.5
    variants:
      - id: emerging-architecture-evidence.calculate.1
        prompt: About how many repeated runs are needed to estimate a measurement probability near 0.5 to a standard error of 0.05?
        answer: 100
        feedback: 0.5 × 0.5 / 0.05² = 0.25 / 0.0025 = 100 runs.
      - id: emerging-architecture-evidence.calculate.2
        prompt: About how many repeated runs are needed to estimate a probability near 0.1 to a standard error of 0.01?
        answer: 900
        feedback: 0.1 × 0.9 / 0.01² = 0.09 / 0.0001 = 900 runs.
      - id: emerging-architecture-evidence.calculate.3
        prompt: With amplitude encoding, how many qubits are needed to hold a data vector of 1,024 numbers?
        answer: 10
        feedback: n qubits hold 2ⁿ amplitudes, and 2¹⁰ = 1,024.
      - id: emerging-architecture-evidence.calculate.4
        prompt: About how many runs are needed to estimate a probability near 0.5 to a standard error of 0.02?
        answer: 625
        feedback: 0.25 / 0.02² = 0.25 / 0.0004 = 625 runs.
      - id: emerging-architecture-evidence.calculate.5
        prompt: A paper reports a 9-point gain. Matching the baseline's training tokens cuts it to 4 points, and matching its tuning budget cuts it by 2.5 more. How many points remain?
        answer: 1.5
        feedback: 9 → 4 after matching tokens, then 4 − 2.5 = 1.5 points after matching tuning.
