schema_version: 0.2-draft
lesson:
  id: emerging-architecture-evidence
  version: 0.3.0-draft
  title: Evaluate new computing and learning claims without assuming a breakthrough
  state: draft
  summary: Inspect a new computing claim from its assumptions to its measured results.
  slot: M34.7
  category: learning
  sources:
  - title: Quantum Machine Learning
    url: https://arxiv.org/abs/1611.09347
  - title: Barren Plateaus in Quantum Neural Network Training Landscapes
    url: https://arxiv.org/abs/1803.11173
objectives:
- id: objective.emerging-architecture-evidence
  version: 1-draft
  statement: Emerging approaches such as quantum ML and new memory architectures require explicit computational
    assumptions, strong baselines, and end-to-end resource evidence before practical advantage is established.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - emerging-architecture-evidence.base
  - emerging-architecture-evidence.transfer
  prerequisites:
  - anyOf:
    - objective.architecture-tradeoff-study
  - anyOf:
    - objective.causal-evaluation-and-negative-results
scenes:
- id: emerging-architecture-evidence.s1
  title: Ask what the proposed mechanism changes
  type: explanation
  depth: intuition
  objective_refs:
  - objective.emerging-architecture-evidence
  markdown: A new method may change data encoding, memory access, optimization, or the computational substrate.
    Draw inputs, state, operations, and outputs. Claims about faster inference, better reasoning, or lower
    energy need different experiments; a novel name does not identify the mechanism.
  text_mode: A new method may change data encoding, memory access, optimization, or the computational substrate.
    Draw inputs, state, operations, and outputs. Claims about faster inference, better reasoning, or lower
    energy need different experiments; a novel name does not identify the mechanism.
  bridges: []
- id: emerging-architecture-evidence.s2
  title: Understand the quantum-ML boundary
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.emerging-architecture-evidence
  markdown: 'Quantum algorithms manipulate quantum states and use measurements to obtain classical information.
    A claimed speedup can depend on how data are loaded, which access oracle is assumed, device noise, and
    measurement cost. Simulating a small circuit classically is useful research but not itself evidence of
    practical quantum advantage.


    A qubit is a quantum information unit whose measurement produces a classical result under the chosen measurement
    setup. Quantum superposition does not let a user simply read every candidate answer at once. An oracle
    is an assumed operation an algorithm can call; a complexity claim may exclude the cost of building or implementing
    that access. A barren plateau is a training setting where gradients become extremely small across much
    of the parameter space, making useful updates difficult to estimate. These costs belong in the evidence
    for an advantage.'
  text_mode: 'Quantum algorithms manipulate quantum states and use measurements to obtain classical information.
    A claimed speedup can depend on how data are loaded, which access oracle is assumed, device noise, and
    measurement cost. Simulating a small circuit classically is useful research but not itself evidence of
    practical quantum advantage.


    A qubit is a quantum information unit whose measurement produces a classical result under the chosen measurement
    setup. Quantum superposition does not let a user simply read every candidate answer at once. An oracle
    is an assumed operation an algorithm can call; a complexity claim may exclude the cost of building or implementing
    that access. A barren plateau is a training setting where gradients become extremely small across much
    of the parameter space, making useful updates difficult to estimate. These costs belong in the evidence
    for an advantage.'
  bridges: []
- id: emerging-architecture-evidence.s3
  title: Compare realistic alternatives
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.emerging-architecture-evidence
  markdown: A method beating one old baseline may lose to a tuned contemporary classical or neural approach.
    Match accuracy, problem size, preprocessing, and total resources. For memory architectures, include write/read
    costs, retrieval quality, state growth, and update consistency.
  text_mode: A method beating one old baseline may lose to a tuned contemporary classical or neural approach.
    Match accuracy, problem size, preprocessing, and total resources. For memory architectures, include write/read
    costs, retrieval quality, state growth, and update consistency.
  bridges: []
- id: emerging-architecture-evidence.s4
  title: Treat evidence as provisional and specific
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.emerging-architecture-evidence
  markdown: Separate theoretical complexity under assumptions, controlled experiments, and demonstrated product
    value. Identify independent replications and unresolved failure modes. A promising result can justify further
    research while leaving its scalability and practical advantage open.
  text_mode: Separate theoretical complexity under assumptions, controlled experiments, and demonstrated product
    value. Identify independent replications and unresolved failure modes. A promising result can justify further
    research while leaving its scalability and practical advantage open.
  bridges: []
- id: emerging-architecture-evidence.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.emerging-architecture-evidence
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: For a new computing approach, inspect the mechanism, assumptions, and complete cost. A theoretical
    advantage and a demonstrated practical benefit need different evidence.
- id: emerging-architecture-evidence.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.emerging-architecture-evidence
  markdown: For a new computing approach, inspect the mechanism, assumptions, and complete cost. A theoretical
    advantage and a demonstrated practical benefit need different evidence.
  text_mode: For a new computing approach, inspect the mechanism, assumptions, and complete cost. A theoretical
    advantage and a demonstrated practical benefit need different evidence.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - emerging-architecture-evidence.s1
    - emerging-architecture-evidence.s2
    - emerging-architecture-evidence.s3
    - emerging-architecture-evidence.s4
    - emerging-architecture-evidence.check
    gate_refs:
    - gate.core
  scene_aliases:
    emerging-architecture-evidence.recap: emerging-architecture-evidence.check
assessment_families:
- id: emerging-architecture-evidence.base
  objective_ref: objective.emerging-architecture-evidence
  task: base
  response_type: single_choice
  points: 1
  hint: 'Understand the quantum-ML boundary: trace the inputs, operation, and result before choosing.'
  remediation_scene: emerging-architecture-evidence.s2
  variants:
  - id: emerging-architecture-evidence.base.1
    prompt: What can limit a claimed quantum speedup?
    options:
    - id: b
      text: Only the word quantum
    - id: c
      text: All classical baselines must be ignored
    - id: a
      text: Data loading, noise, measurement, and access assumptions
    answer: a
    feedback: End-to-end cost includes more than the central algorithm.
  - id: emerging-architecture-evidence.base.2
    prompt: Does classical simulation of a small quantum circuit prove practical quantum advantage?
    options:
    - id: c
      text: Only if accuracy is high
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Simulation results and hardware advantage are different claims.
- id: emerging-architecture-evidence.transfer
  objective_ref: objective.emerging-architecture-evidence
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Treat evidence as provisional and specific: trace the inputs, operation, and result before choosing.'
  remediation_scene: emerging-architecture-evidence.s4
  variants:
  - id: emerging-architecture-evidence.transfer.1
    prompt: Why use strong matched baselines?
    options:
    - id: c
      text: Only to increase experiment count
    - id: a
      text: To test whether gains exceed existing methods under comparable conditions
    - id: b
      text: To guarantee the new method loses
    answer: a
    feedback: Weak comparisons can exaggerate novelty and usefulness.
  - id: emerging-architecture-evidence.transfer.2
    prompt: What should a theoretical complexity claim state?
    options:
    - id: a
      text: Its computational and data-access assumptions
    - id: b
      text: Only a headline speedup
    - id: c
      text: That every deployment will improve
    answer: a
    feedback: Assumptions define where the result applies.
