schema_version: 0.2-draft
lesson:
  id: reasoning-and-explanations
  version: 0.1.0-draft
  title: Separate a correct solution from a convincing explanation
  state: draft
  summary: Reasoning capability is evaluated through problem-solving behavior; generated explanations can help or
    mislead and are not guaranteed transcripts of the computation that caused an answer.
  slot: M21.1
  category: learning
  sources:
  - title: Chain-of-Thought Prompting
    url: https://arxiv.org/abs/2201.11903
  - title: Language Models Don’t Always Say What They Think
    url: https://arxiv.org/abs/2305.04388
objectives:
- id: objective.reasoning-and-explanations
  version: 1-draft
  statement: Reasoning capability is evaluated through problem-solving behavior; generated explanations can help
    or mislead and are not guaranteed transcripts of the computation that caused an answer.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - reasoning-and-explanations.base
  - reasoning-and-explanations.transfer
  prerequisites:
  - anyOf:
    - objective.posttraining-stages
  - anyOf:
    - objective.thinking-critically
scenes:
- id: reasoning-and-explanations.s1
  title: Define the task rather than a human analogy
  type: explanation
  depth: intuition
  objective_refs:
  - objective.reasoning-and-explanations
  markdown: A reasoning task may require combining constraints, constructing a proof, debugging a program, or planning
    several dependent steps. Measure whether the solution meets those requirements on fresh cases. Fluent language,
    confidence, and human-like expressions of reflection do not by themselves establish success.
  text_mode: A reasoning task may require combining constraints, constructing a proof, debugging a program, or planning
    several dependent steps. Measure whether the solution meets those requirements on fresh cases. Fluent language,
    confidence, and human-like expressions of reflection do not by themselves establish success.
  bridges: []
- id: reasoning-and-explanations.s2
  title: External steps can change the computation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reasoning-and-explanations
  markdown: Generating intermediate text gives an autoregressive model additional tokens on which later predictions
    can condition. A worked solution can organize subproblems and expose checkable errors. The benefit depends on
    the task, model, prompting, and training; longer output can also repeat mistakes or distract from evidence.
  text_mode: Generating intermediate text gives an autoregressive model additional tokens on which later predictions
    can condition. A worked solution can organize subproblems and expose checkable errors. The benefit depends on
    the task, model, prompting, and training; longer output can also repeat mistakes or distract from evidence.
  bridges: []
- id: reasoning-and-explanations.s3
  title: Check faithfulness separately
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reasoning-and-explanations
  markdown: An explanation can be correct, plausible, or misleading independently of why the model produced its
    answer. Test causal influence with controlled interventions rather than assuming self-reports reveal internal
    mechanisms. A model may rationalize a choice or omit factors that affected it.
  text_mode: An explanation can be correct, plausible, or misleading independently of why the model produced its
    answer. Test causal influence with controlled interventions rather than assuming self-reports reveal internal
    mechanisms. A model may rationalize a choice or omit factors that affected it.
  bridges: []
- id: reasoning-and-explanations.s4
  title: Evaluate outputs and process claims
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reasoning-and-explanations
  markdown: For an arithmetic puzzle, verify the answer and each stated step. For code, run independent tests in
    an appropriate environment. Report whether evidence supports final correctness, intermediate validity, or causal
    faithfulness; these are distinct properties and should not share one unsupported label.
  text_mode: For an arithmetic puzzle, verify the answer and each stated step. For code, run independent tests in
    an appropriate environment. Report whether evidence supports final correctness, intermediate validity, or causal
    faithfulness; these are distinct properties and should not share one unsupported label.
  bridges: []
- id: reasoning-and-explanations.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.reasoning-and-explanations
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Reasoning capability is evaluated through problem-solving behavior; generated explanations can help
    or mislead and are not guaranteed transcripts of the computation that caused an answer.
- id: reasoning-and-explanations.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.reasoning-and-explanations
  markdown: Reasoning capability is evaluated through problem-solving behavior; generated explanations can help
    or mislead and are not guaranteed transcripts of the computation that caused an answer.
  text_mode: Reasoning capability is evaluated through problem-solving behavior; generated explanations can help
    or mislead and are not guaranteed transcripts of the computation that caused an answer.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - reasoning-and-explanations.s1
    - reasoning-and-explanations.s2
    - reasoning-and-explanations.s3
    - reasoning-and-explanations.s4
    - reasoning-and-explanations.check
    gate_refs:
    - gate.core
  scene_aliases:
    reasoning-and-explanations.recap: reasoning-and-explanations.check
assessment_families:
- id: reasoning-and-explanations.base
  objective_ref: objective.reasoning-and-explanations
  task: base
  response_type: single_choice
  points: 1
  hint: 'External steps can change the computation: trace the inputs, operation, and result before choosing.'
  remediation_scene: reasoning-and-explanations.s2
  variants:
  - id: reasoning-and-explanations.base.1
    prompt: Does fluent explanation alone establish correct reasoning?
    options:
    - id: c
      text: Only if it says “therefore”
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Success depends on the task’s constraints and evidence.
  - id: reasoning-and-explanations.base.2
    prompt: How can intermediate generated text affect later output?
    options:
    - id: a
      text: Later tokens can condition on it
    - id: b
      text: It necessarily updates model weights
    - id: c
      text: It removes the autoregressive dependency
    answer: a
    feedback: Externalized steps become part of the input prefix.
- id: reasoning-and-explanations.transfer
  objective_ref: objective.reasoning-and-explanations
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate outputs and process claims: trace the inputs, operation, and result before choosing.'
  remediation_scene: reasoning-and-explanations.s4
  variants:
  - id: reasoning-and-explanations.transfer.1
    prompt: Is a plausible explanation guaranteed to reveal the actual cause of the answer?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if the model is large
    answer: a
    feedback: Faithfulness requires separate evidence.
  - id: reasoning-and-explanations.transfer.2
    prompt: An answer is right but a stated step is invalid. Which claims differ?
    options:
    - id: b
      text: Tokenization and file size
    - id: c
      text: All evaluation properties are identical
    - id: a
      text: Final correctness and intermediate validity
    answer: a
    feedback: A correct conclusion does not validate every explanation step.
