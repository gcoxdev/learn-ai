schema_version: 0.2-draft
lesson:
  id: reasoning-and-explanations
  version: 0.4.0-draft
  title: Separate a correct solution from a convincing explanation
  state: draft
  summary: Ask a model to "think step by step" and it often gets more answers right. But is the reasoning it writes down how it really got there? You can test that.
  slot: M21.1
  category: learning
  sources:
    - title: "Chain-of-Thought Prompting Elicits Reasoning in Large Language Models (Wei et al., 2022)"
      url: https://arxiv.org/abs/2201.11903
    - title: "Large Language Models are Zero-Shot Reasoners (Kojima et al., 2022)"
      url: https://arxiv.org/abs/2205.11916
    - title: "Language Models Don't Always Say What They Think: Unfaithful Explanations in Chain-of-Thought Prompting (Turpin et al., 2023)"
      url: https://arxiv.org/abs/2305.04388
    - title: "Measuring Faithfulness in Chain-of-Thought Reasoning (Lanham et al., 2023)"
      url: https://arxiv.org/abs/2307.13702
objectives:
  - id: objective.reasoning-and-explanations
    version: 3-draft
    statement: Reasoning capability is evaluated through problem-solving behavior; generated explanations can help or mislead and are not guaranteed transcripts of the computation that caused an answer.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - reasoning-and-explanations.base.v2
      - reasoning-and-explanations.transfer.v2
    prerequisites:
      - anyOf:
          - objective.posttraining-stages
      - anyOf:
          - objective.thinking-critically
scenes:
  - id: reasoning-and-explanations.s1
    title: Forty cents, or twenty?
    type: explanation
    depth: intuition
    objective_refs:
      - objective.reasoning-and-explanations
    markdown: |-
      *A notebook and a pen cost \$2.40 together. The notebook costs \$2.00 more than the pen. How much is the pen?*

      The answer that jumps out is 40 cents: \$2.40 minus \$2.00. It's wrong. If the pen cost \$0.40, the notebook would cost \$2.40 and the pair would cost \$2.80. Write it down properly and the right answer falls out: call the pen $x$, so the notebook is $x + 2.00$, the pair is $2x + 2.00 = 2.40$, and $x = 0.20$.

      A language model can fall into the same trap, and writing the steps helps it for a concrete reason. As the lesson on next-token prediction showed, the model produces one token at a time. Each token gets the same fixed amount of computation, one pass through the network. If the model must print the price immediately, all the work has to fit in that one pass. If it writes "notebook = pen + 2.00" first, that text becomes part of the context, and every later token can read it. Written steps work as scratch paper.
    diagram:
      caption: Answering at once versus writing the working first. Each written step becomes input for the tokens that follow.
      description: In the top row, the question goes straight to an immediate answer of 40 cents, which is wrong. In the bottom row, the question goes to a first step that names the unknowns, then a second step that writes the equation 2x + 2.00 = 2.40, and then to the answer of 20 cents. Each step is read by the next one as part of the context.
      nodes:
        - id: q1
          label: Question
          col: 0
          row: 0
        - id: fast
          label: "Answer: $0.40"
          note: all work in one token
          col: 1
          row: 0
          tone: warn
        - id: q2
          label: Question
          col: 0
          row: 1
        - id: step1
          label: "Let pen = x"
          note: "notebook = x + 2.00"
          col: 1
          row: 1
          tone: data
        - id: step2
          label: "2x + 2.00 = 2.40"
          col: 2
          row: 1
          tone: data
        - id: slow
          label: "Answer: $0.20"
          col: 3
          row: 1
          tone: accent
      edges:
        - from: q1
          to: fast
        - from: q2
          to: step1
        - from: step1
          to: step2
        - from: step2
          to: slow
    bridges: []
  - id: reasoning-and-explanations.s2
    title: '"Let''s think step by step"'
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.reasoning-and-explanations
    markdown: |-
      Two papers from 2022 turned this into a prompting technique called **chain-of-thought** (CoT): getting the model to write intermediate reasoning before its final answer.

      | Prompt style | What you add | Paper |
      | --- | --- | --- |
      | Standard | Nothing; the model answers directly | |
      | Few-shot chain-of-thought | A few solved examples whose answers show their working | Wei et al., 2022 |
      | Zero-shot chain-of-thought | The phrase "Let's think step by step." | Kojima et al., 2022 |

      Wei and colleagues found that the benefit showed up mainly in very large models, around 100 billion parameters; smaller models wrote fluent chains that didn't hold together. Kojima and colleagues showed that no examples were needed. With OpenAI's text-davinci-002, adding that one sentence raised accuracy on the MultiArith word problems from 17.7% to 78.7%, and on GSM8K (grade-school math) from 10.4% to 40.7%.

      :::predict Would "Let's think step by step" help with "What is the capital of Peru?"
      Very little. The answer is a single remembered fact, with no intermediate results to store. Chain-of-thought helps when a problem has several dependent steps, such as arithmetic, logic puzzles, and planning, because each step needs the one before it.
      :::

      Since 2024, **reasoning models** such as OpenAI's o1 (September 2024) and DeepSeek-R1 (January 2025) have been *trained* to write long chains before answering, instead of being prompted to. The rest of this module shows how that training works: demonstrations, rewards that can be checked automatically, and reinforcement learning.
    bridges: []
  - id: reasoning-and-explanations.s3
    title: Right answer, wrong reasoning
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.reasoning-and-explanations
    markdown: |-
      Once a model writes its working, you can ask three separate questions about it:

      | Question | Name | How you check it |
      | --- | --- | --- |
      | Is the final answer right? | **Correctness** | Compare with the known answer |
      | Does each written step follow? | **Validity** | Check every step |
      | Does the text describe what actually produced the answer? | **Faithfulness** | Change things and see what the answer depends on |

      The first two are easy to confuse. Below are three chains for the pen problem, and a checker that verifies each arithmetic step.

      ```python run
      from fractions import Fraction as F
      import operator

      OPS = {"+": operator.add, "-": operator.sub, "*": operator.mul, "/": operator.truediv}

      def check(step):
          """Check one step written as 'a op b = c'."""
          left, claimed = step.split("=")
          a, op, b = left.split()
          actual = OPS[op](F(a), F(b))
          return actual == F(claimed), actual

      chains = {
          "chain A": ["2.40 - 2.00 = 0.40", "0.40 / 2 = 0.20", "0.20 + 2.00 = 2.20"],
          "chain B": ["2.00 / 10 = 0.20", "0.20 + 2.00 = 2.20"],
          "chain C": ["2.40 - 2.00 = 0.40", "0.40 / 2 = 0.25", "0.25 + 2.00 = 2.25"],
      }
      for name, steps in chains.items():
          print(name)
          for s in steps:
              ok, actual = check(s)
              print(f"  {s:22} {'ok' if ok else 'WRONG, actually ' + str(float(actual))}")
      ```

      Chain A is correct and valid: take away the \$2.00 difference, split the rest, add the difference back. Chain C makes one slip (0.40 / 2 = 0.25) and every later step inherits it. Chain B is the sneaky one. It says the pen costs a tenth of the difference. Every calculation checks out and it lands on \$0.20, but nothing in the problem justifies dividing by 10, and the chain never even uses the \$2.40 total. Change the total to \$3.00 and this chain still says 20 cents, though the pen would then cost 50. It's a correct answer with invalid reasoning, and an arithmetic checker can't see that. Try changing chain B's first step to `2.00 / 10 = 0.25` to watch the checker catch an actual slip.
    bridges: []
  - id: reasoning-and-explanations.s4
    title: Does the explanation tell you why?
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.reasoning-and-explanations
    markdown: |-
      Faithfulness is the hardest of the three. A chain can be correct and valid and still not be the reason the model gave its answer.

      :::story The answer is always (A)
      Turpin and colleagues (2023) gave models multiple-choice questions with a few solved examples in the prompt. In one version, they reordered the options in the examples so that the right answer was always "(A)". The models then drifted toward (A) on new questions and wrote chain-of-thought explanations justifying it. The explanations almost never mentioned the pattern: of 426 that the authors checked, just one did. On 13 BIG-Bench Hard tasks, this bias cut accuracy by as much as 36% for GPT-3.5 and Claude 1.0.
      :::

      So test faithfulness with experiments, not by asking. Lanham and colleagues (2023) edited the chain and watched the answer: cut the chain off early, or insert a mistake partway through. Suppose you corrupt step 2 of the chain in 40 word problems. In 30, the final answer changes to follow the mistake; there the chain was carrying the calculation. In the other 10 the answer stays put, so the model was getting that answer some other way and the chain was mostly decoration.

      :::papers The chain as an intermediate variable
      A model with chain-of-thought first samples a chain $c$ for question $q$, then an answer $a$ given both:

      $$p(a \mid q) = \sum_{c} p(c \mid q)\; p(a \mid q, c)$$

      Correctness asks whether $a$ is right, and validity asks whether $c$ is sound. Faithfulness asks whether $p(a \mid q, c)$ actually depends on $c$. Corrupting step 2 changes $c$; in 30 of the 40 problems $a$ moved with it.
      :::

      :::mixup "The model showed its work, so I know how it got the answer."
      You know what it *wrote*. The written chain is more generated text, produced by the same next-token process as the answer. Often it does carry the calculation, as in 30 of our 40 problems. The only way to find out which case you're in is to change the chain, or the input, and see what the answer depends on.
      :::

      In practice: grade answers against known solutions, check the steps when people will learn from them or rely on them, and run a change-one-thing test before you claim to know *why* a model answered.
    bridges: []
  - id: reasoning-and-explanations.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.reasoning-and-explanations
    markdown: A loan screener, a coding assistant, a fractions tutor, and a few written chains test whether you can tell a correct answer, a valid chain, and a faithful explanation apart.
    takeaway: |-
      Writing steps gives a model scratch space, so chain-of-thought often raises accuracy. Check the answer and the steps separately, and test with controlled changes whether the written reasoning is what actually drove the answer.
  - id: reasoning-and-explanations.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.reasoning-and-explanations
    markdown: |-
      Check the answer and the written steps separately. A convincing explanation does not by itself reveal what caused the model to answer.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - reasoning-and-explanations.s1
        - reasoning-and-explanations.s2
        - reasoning-and-explanations.s3
        - reasoning-and-explanations.s4
        - reasoning-and-explanations.check
      gate_refs:
        - gate.core
  scene_aliases:
    reasoning-and-explanations.recap: reasoning-and-explanations.check
assessment_families:
  - id: reasoning-and-explanations.base
    objective_ref: objective.reasoning-and-explanations
    task: base
    response_type: single_choice
    points: 1
    hint: 'External steps can change the computation: trace the inputs, operation, and result before choosing.'
    remediation_scene: reasoning-and-explanations.s2
    variants:
      - id: reasoning-and-explanations.base.1
        prompt: Does fluent explanation alone establish correct reasoning?
        options:
          - id: c
            text: Only if it says “therefore”
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Success depends on the task’s constraints and evidence.
        retired: true
      - id: reasoning-and-explanations.base.2
        prompt: How can intermediate generated text affect later output?
        options:
          - id: a
            text: Later tokens can condition on it
          - id: b
            text: It necessarily updates model weights
          - id: c
            text: It removes the autoregressive dependency
        answer: a
        feedback: Externalized steps become part of the input prefix.
        retired: true
  - id: reasoning-and-explanations.transfer
    objective_ref: objective.reasoning-and-explanations
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate outputs and process claims: trace the inputs, operation, and result before choosing.'
    remediation_scene: reasoning-and-explanations.s4
    variants:
      - id: reasoning-and-explanations.transfer.1
        prompt: Is a plausible explanation guaranteed to reveal the actual cause of the answer?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if the model is large
        answer: a
        feedback: Faithfulness requires separate evidence.
        retired: true
      - id: reasoning-and-explanations.transfer.2
        prompt: An answer is right but a stated step is invalid. Which claims differ?
        options:
          - id: b
            text: Tokenization and file size
          - id: c
            text: All evaluation properties are identical
          - id: a
            text: Final correctness and intermediate validity
        answer: a
        feedback: A correct conclusion does not validate every explanation step.
        retired: true
  - id: reasoning-and-explanations.base.v2
    objective_ref: objective.reasoning-and-explanations
    task: base
    response_type: single_choice
    points: 1
    hint: "Keep three questions apart: is the answer right (correctness), does each written step follow (validity), and did the written chain actually drive the answer (faithfulness)?"
    remediation_scene: reasoning-and-explanations.s3
    variants:
      - id: reasoning-and-explanations.base.v2.1
        prompt: A model gets a two-step word problem wrong when it must reply with only a number, but right when it writes its working first. Which explanation fits how the model generates text?
        options:
          - id: b
            text: Writing the steps updates its weights on this problem as it goes
          - id: a
            text: The written steps become context that later tokens are computed from
          - id: c
            text: Writing steps switches the model over to a hidden built-in calculator
        answer: a
        feedback: Each token gets one fixed pass through the network, so intermediate results written into the text give later tokens something to read, like scratch paper. Weights don't change while a model generates, and nothing switches to a separate calculator.
      - id: reasoning-and-explanations.base.v2.2
        prompt: 'For the pen problem, a model writes "2.40 / 2 = 1.20, then 1.20 − 1.00 = 0.20, so the pen costs $0.20." How should you describe this answer?'
        options:
          - id: a
            text: The answer is correct, but subtracting 1.00 has no basis in the problem
          - id: b
            text: The reasoning is valid, since every calculation in it checks out
          - id: c
            text: The answer is wrong, since the method used to reach it is wrong
        answer: a
        feedback: This chain is actually valid. $2.40 / 2 is the average price, and the pen sits half the $2.00 difference ($1.00) below it, so the answer and the method are both sound.
        retired: true
      - id: reasoning-and-explanations.base.v2.3
        prompt: You want to know whether a model's written reasoning actually drives its final answers. Which experiment tests that?
        options:
          - id: c
            text: Check each arithmetic step in its explanations with a calculator
          - id: b
            text: Ask it to explain again and see whether the two explanations match
          - id: a
            text: Insert a mistake partway through its chain and see if the answer changes
        answer: a
        feedback: If the answer follows the planted mistake, the chain was carrying the calculation. Checking arithmetic tests validity, not faithfulness, and a second explanation is just more generated text that can agree with the first for the wrong reasons.
      - id: reasoning-and-explanations.base.v2.4
        prompt: In a prompt's solved examples, the correct option is always (A). On a new question the model picks (A) and writes a sensible explanation that never mentions the pattern. What does this show?
        options:
          - id: b
            text: The model reasoned soundly, because its explanation is logical
          - id: a
            text: The explanation left out something that influenced the answer
          - id: c
            text: The model can't notice the order of the options in its prompt
        answer: a
        feedback: This is the Turpin et al. setup. The option order pushed the answer toward (A), yet the explanation gave other reasons, so it was unfaithful. The model clearly did respond to the order; it just didn't say so.
      - id: reasoning-and-explanations.base.v2.5
        prompt: How does few-shot chain-of-thought (Wei et al., 2022) differ from zero-shot chain-of-thought (Kojima et al., 2022)?
        options:
          - id: c
            text: Few-shot fine-tunes on reasoning traces; zero-shot only prompts
          - id: b
            text: Few-shot helps small models most; zero-shot needs large models
          - id: a
            text: Few-shot shows solved examples with working; zero-shot adds a phrase
        answer: a
        feedback: Wei et al. put worked examples in the prompt; Kojima et al. added only "Let's think step by step." Both are prompting methods with no training, and Wei et al. found the gains mainly in the largest models, not the small ones.
      - id: reasoning-and-explanations.base.v2.6
        prompt: 'For the pen problem, a model writes "The pen costs a tenth of the difference: 2.00 / 10 = 0.20, so the pen costs $0.20." How should you describe this answer?'
        options:
          - id: b
            text: The reasoning is valid, since every calculation in it checks out
          - id: c
            text: The answer is wrong, since the method used to reach it is wrong
          - id: a
            text: The answer is correct, but dividing by 10 has no basis in the problem
        answer: a
        feedback: The pen really does cost $0.20, and 2.00 / 10 is accurate arithmetic. But nothing in the problem says the pen is a tenth of the difference, and the chain never uses the $2.40 total, so with a $3.00 total it would still say 20 cents. A right answer can come from an invalid chain.
  - id: reasoning-and-explanations.transfer.v2
    objective_ref: objective.reasoning-and-explanations
    task: transfer
    response_type: single_choice
    points: 1
    hint: Decide what the situation needs, a right answer, sound steps, or the true reason for a decision, and pick the check that actually measures that.
    remediation_scene: reasoning-and-explanations.s4
    variants:
      - id: reasoning-and-explanations.transfer.v2.1
        prompt: 'A coding assistant fixes a bug and explains, "I changed the loop bound because an off-by-one error skipped the last item." The tests now pass. A colleague says this proves the model found the off-by-one error. What is the best reply?'
        options:
          - id: a
            text: The tests show the fix works; why it chose the fix needs its own test
          - id: b
            text: Agreed, because a working fix with a sensible reason must be faithful
          - id: c
            text: Unlikely, because models can't find bugs, so the fix was a lucky guess
        answer: a
        feedback: Passing tests is evidence of correctness. Whether the explanation describes what drove the change is a faithfulness question, which a sensible-sounding reason doesn't settle. And models can find real bugs, so "lucky guess" doesn't follow.
      - id: reasoning-and-explanations.transfer.v2.2
        prompt: 'A loan-screening model rejects an applicant and explains, "Debt is too high relative to income." You suspect the applicant''s postcode also influenced the decision. Which check fits?'
        options:
          - id: b
            text: Ask the model directly whether postcode affected its decision
          - id: c
            text: Confirm the debt and income figures quoted in the explanation
          - id: a
            text: Resubmit the application with only the postcode changed
        answer: a
        feedback: Changing one input and holding everything else fixed shows what the decision depends on. The model's answer about itself is more generated text, and checking the quoted figures tests the explanation's accuracy, not whether it left something out.
      - id: reasoning-and-explanations.transfer.v2.3
        prompt: A homework bot shows pupils how to solve fraction problems. Its final answers are right, but some of its steps are invalid. Which property most needs fixing?
        options:
          - id: c
            text: Faithfulness, since pupils should see its true internal process
          - id: a
            text: Validity of each step, since pupils will copy the method shown
          - id: b
            text: Brevity, since pupils skip over long explanations anyway
        answer: a
        feedback: Pupils learn the method from the written steps, so invalid steps teach them wrong methods even when the answers are right. Faithfulness matters for auditing a decision, but here the job is to show a sound method.
      - id: reasoning-and-explanations.transfer.v2.4
        prompt: Which request is least likely to benefit from adding "Let's think step by step"?
        options:
          - id: b
            text: Planning a four-city trip that has to fit a strict budget
          - id: a
            text: Naming the author of the novel Pride and Prejudice
          - id: c
            text: A word problem about two trains with different speeds
        answer: a
        feedback: Naming an author is one remembered fact, with no intermediate results to write down. The trip plan and the train problem each have several dependent steps, which is where written reasoning helps.
      - id: reasoning-and-explanations.transfer.v2.5
        prompt: You compare two models on 200 held-out logic puzzles. Model A writes long, confident explanations; Model B writes short ones. What should decide which one reasons better?
        options:
          - id: c
            text: Which model's explanations sound more careful to a reader
          - id: b
            text: Which model uses more reasoning tokens per puzzle on average
          - id: a
            text: How many puzzles each solves, with a sample of steps checked
        answer: a
        feedback: Reasoning ability shows up in solved problems, so count correct answers and spot-check the steps. A careful tone and a long chain are features of the text, and neither tells you the answer is right.
