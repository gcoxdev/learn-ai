assessment_families:
  - id: foundation-model-era.base
    objective_ref: objective.foundation-model-era
    task: base
    response_type: single_choice
    points: 1
    hint: 'Attention changed sequence modeling: trace the inputs, operation, and result before choosing.'
    remediation_scene: foundation-model-era.s2
    variants:
      - id: foundation-model-era.base.1
        prompt: Is attention itself a complete training recipe?
        options:
          - id: b
            text: Yes; it determines every dataset
          - id: c
            text: Yes; it guarantees instruction following
          - id: a
            text: No; objectives, data, and optimization must also be specified
        answer: a
        feedback: An architecture component does not specify the entire learning pipeline.
        retired: true
      - id: foundation-model-era.base.2
        prompt: What makes broad pretraining useful downstream?
        options:
          - id: c
            text: It proves every possible capability
          - id: a
            text: Representations and parameters can be adapted across tasks
          - id: b
            text: It eliminates task-specific evaluation
        answer: a
        feedback: Transfer is an empirical possibility that still requires evaluation.
        retired: true
  - id: foundation-model-era.transfer
    objective_ref: objective.foundation-model-era
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Read a modern milestone critically: trace the inputs, operation, and result before choosing.'
    remediation_scene: foundation-model-era.s4
    variants:
      - id: foundation-model-era.transfer.1
        prompt: A game agent uses neural evaluation and tree search. Should success be attributed to the network alone?
        options:
          - id: c
            text: Yes; rules never affect game tasks
          - id: a
            text: No; the complete system and search budget matter
          - id: b
            text: Yes; search is not computation
        answer: a
        feedback: System components jointly contribute to measured performance.
        retired: true
      - id: foundation-model-era.transfer.2
        prompt: One answer system has retrieval and another does not. What must a comparison report?
        options:
          - id: a
            text: The available evidence and tool conditions
          - id: b
            text: Only the number of words in their names
          - id: c
            text: Only which system is newer
        answer: a
        feedback: External evidence changes the task conditions and interpretation of results.
        retired: true
  - id: foundation-model-era.base.v2
    objective_ref: objective.foundation-model-era
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: foundation-model-era.s3
    variants:
      - prompt: One broadly trained model is adapted to several later tasks. What does foundation describe here?
        answer: a
        options:
          - id: a
            text: Its reusable role across applications
          - id: b
            text: A requirement to use one particular layer design
          - id: c
            text: The completion of each application’s evaluation
        feedback: The term describes broad training and reuse, not a fixed architecture.
        id: foundation-model-era.base.v2.1
        retired: true
      - prompt: A transformer is trained narrowly for one specialized prediction task. Which distinction matters?
        answer: a
        options:
          - id: b
            text: Its architecture proves it has been adapted to many tasks
          - id: c
            text: Its parameter file contains every application using transformers
          - id: a
            text: Architecture alone does not establish broad foundation-model reuse
        feedback: Architecture and reuse are separate descriptions.
        id: foundation-model-era.base.v2.2
        retired: true
      - prompt: A user changes the prompt while keeping the checkpoint fixed. Which operation is directly changed?
        answer: a
        options:
          - id: c
            text: The original examples used to fit the checkpoint
          - id: a
            text: The information supplied at inference
          - id: b
            text: The stored weights updated during training
        feedback: A changed input can change behavior without modifying stored settings.
        id: foundation-model-era.base.v2.3
        retired: true
      - prompt: A model receives further adjustment for instruction following after broad training. Which stage is being described?
        answer: a
        options:
          - id: a
            text: Post-training adaptation
          - id: b
            text: Unchanged-weight inference on a new request
          - id: c
            text: A retrieved document added to one prompt
        feedback: Additional weight adjustment is distinct from supplying information to a fixed model.
        id: foundation-model-era.base.v2.4
        retired: true
  - id: foundation-model-era.transfer.v2
    objective_ref: objective.foundation-model-era
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: foundation-model-era.s3
    variants:
      - prompt: An application gives fresher answers after adding document lookup. What should be investigated first?
        answer: a
        options:
          - id: a
            text: The retrieval and context supplied to the existing model
          - id: b
            text: Whether the model necessarily relearned its original dataset
          - id: c
            text: Whether the new documents changed the architecture’s layer count
        feedback: The surrounding pipeline can change information available at inference.
        id: foundation-model-era.transfer.v2.1
        retired: true
      - prompt: Three products reuse a model that struggles with one dialect. What concern deserves testing?
        answer: a
        options:
          - id: b
            text: Whether separate product names eliminate shared model weaknesses
          - id: c
            text: Whether successful deployment on another dialect establishes this one
          - id: a
            text: Whether that weakness carries into their different applications
        feedback: Shared components can propagate weaknesses, but each application needs evidence.
        id: foundation-model-era.transfer.v2.2
        retired: true
      - prompt: A release supplies weights but no training dataset. Which claim is supported?
        answer: a
        options:
          - id: c
            text: The released weights document every training decision
          - id: a
            text: The checkpoint is available; dataset availability remains separate
          - id: b
            text: The dataset can be treated as published through the weights
        feedback: Artifacts provide different kinds of access and evidence.
        id: foundation-model-era.transfer.v2.3
        retired: true
      - prompt: A new checkpoint scores better in one application with new tools. What comparison isolates checkpoint effects?
        answer: a
        options:
          - id: a
            text: Compare checkpoints with the surrounding tools held comparable
          - id: b
            text: Attribute the full gain to the checkpoint’s release date
          - id: c
            text: Compare the new system with an unrelated historical task
        feedback: Changes in model and pipeline need separate comparisons where possible.
        id: foundation-model-era.transfer.v2.4
        retired: true
  - id: foundation-model-era.base.v3
    objective_ref: objective.foundation-model-era
    task: base
    response_type: single_choice
    points: 1
    hint: Keep four things apart. The architecture is how the calculation is arranged, pretraining builds broad skill, adaptation (fine-tuning, prompting, or RLHF) shapes it for a job, and only training steps change the weights.
    remediation_scene: foundation-model-era.s4
    variants:
      - id: foundation-model-era.base.v3.1
        prompt: GPT-3 translates a sentence correctly after seeing three example translations in its prompt. What changed inside the model?
        options:
          - id: a
            text: Its weights were fine-tuned on the three examples
          - id: b
            text: Nothing; the examples changed only its input
          - id: c
            text: It switched to a translation-only architecture
        answer: b
        feedback: This is in-context learning. The examples sit in the prompt, and the 175 billion weights stay exactly as they were; fine-tuning would mean further training.
      - id: foundation-model-era.base.v3.2
        prompt: A bank takes BERT, which was pretrained by filling in hidden words, adds a small output layer, and trains on 5,000 labeled customer complaints. What is this second step called?
        options:
          - id: a
            text: Fine-tuning a pretrained model for a downstream task
          - id: b
            text: Pretraining a new model on the bank's own data
          - id: c
            text: Prompting the model with examples at answer time
        answer: a
        feedback: A little extra training on labeled examples for one job is fine-tuning. Pretraining is the broad first stage that already happened, and prompting changes no weights.
      - id: foundation-model-era.base.v3.3
        prompt: What does the term "foundation model" describe?
        options:
          - id: a
            text: Any model that uses the Transformer architecture
          - id: b
            text: A model trained to follow instructions with feedback
          - id: c
            text: A model trained broadly, then reused for many tasks
        answer: c
        feedback: The term names a role, broad training followed by reuse. Most foundation models are Transformers, and many get instruction tuning, but neither defines the term.
      - id: foundation-model-era.base.v3.4
        prompt: In InstructGPT's training, people ranked several answers to the same request. How were those rankings used?
        options:
          - id: a
            text: They were pasted into each prompt at answer time
          - id: b
            text: They trained a reward model that then guided training
          - id: c
            text: They replaced the text used for pretraining
        answer: b
        feedback: The rankings trained a reward model, and reinforcement learning then pushed the assistant toward answers that model scored highly. That's RLHF; pretraining on web text had already happened.
  - id: foundation-model-era.transfer.v3
    objective_ref: objective.foundation-model-era
    task: transfer
    response_type: single_choice
    points: 1
    hint: Trace the behavior to its source. Did it come from the shared pretrained model, from post-training, from what sits in the prompt right now, or from the product built around the model?
    remediation_scene: foundation-model-era.s6
    variants:
      - id: foundation-model-era.transfer.v3.1
        prompt: A tutoring app, a support bot, and a translation tool are built on the same foundation model. All three mishandle one regional dialect. What should be tested first?
        options:
          - id: a
            text: The shared base model, directly, on that dialect
          - id: b
            text: Each app's prompt, since each likely has its own bug
          - id: c
            text: Whether Transformers can process dialects at all
        answer: a
        feedback: Three apps failing the same way points to a weakness inherited from the shared model's training. Three independent prompt bugs matching exactly would be a coincidence, and Transformers handle many dialects when trained on them.
      - id: foundation-model-era.transfer.v3.2
        prompt: Deep Blue beat the chess champion with hand-tuned scoring and brute-force search. Why did AlphaGo need learned networks for Go instead?
        options:
          - id: a
            text: Go computers had slower chips, so search was too costly
          - id: b
            text: Go has far more positions and no good hand-written scoring
          - id: c
            text: Go has simpler rules, so search wasn't needed at all
        answer: b
        feedback: Go's positions are too many for brute force, and experts couldn't write down reliable scoring rules, so AlphaGo learned its judgment. It still used tree search, guided by its networks.
      - id: foundation-model-era.transfer.v3.3
        prompt: A chatbot remembers that you're vegetarian for the rest of a conversation. Which part of the system explains this?
        options:
          - id: a
            text: Fine-tuning on each message you send during the chat
          - id: b
            text: Pretraining on the text of your earlier conversations
          - id: c
            text: The conversation it reads as input; its weights don't change
        answer: c
        feedback: Earlier messages are part of the input the model reads for each reply, like GPT-3's in-context examples. No training happens mid-conversation.
      - id: foundation-model-era.transfer.v3.4
        prompt: ChatGPT was built on an existing GPT-3.5 model. Why did it feel so different from raw GPT-3 to most users?
        options:
          - id: a
            text: It used a new architecture that replaced the Transformer
          - id: b
            text: Instruction tuning and RLHF taught it to answer requests
          - id: c
            text: It was pretrained on far more text than any earlier model
        answer: b
        feedback: The big change was post-training, which turned a text-continuer into an assistant, plus a simple chat window. It was still a Transformer, and the InstructGPT results showed post-training could matter more than sheer size.
