schema_version: 0.2-draft
lesson:
  id: foundation-model-era
  version: 0.3.0-draft
  title: Games, attention, and broadly reusable models
  state: draft
  summary: Follow a reusable pretrained model into several applications, separating architecture, training
    stages, and the surrounding product.
  slot: M01.7
  category: learning
  sources:
  - title: Bommasani and colleagues — foundation models (2021)
    url: https://arxiv.org/abs/2108.07258
  - title: Vaswani and colleagues — Attention Is All You Need (2017)
    url: https://arxiv.org/abs/1706.03762
  - title: Silver et al. — Mastering the game of Go with deep neural networks and tree search (2016)
    url: https://www.nature.com/articles/nature16961
  archetype: perspective
objectives:
- id: objective.foundation-model-era
  version: 2-draft
  statement: Distinguish a foundation model’s reusable training role from its architecture, adaptation method,
    and deployed application.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - foundation-model-era.base.v2
  - foundation-model-era.transfer.v2
  prerequisites:
  - anyOf:
    - objective.deep-learning-revival
scenes:
- id: foundation-model-era.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.foundation-model-era
  title: Learn something reusable before a specific application
  markdown: A **foundation model** is broadly trained and can be adapted or used for a range of downstream
    tasks. A **downstream task** is a particular later use, such as categorizing a document or answering a
    question. The term describes a model’s role and breadth of reuse; it is not a single architecture or a
    claim that the model has complete knowledge. The 2021 Stanford-led report on foundation models analyzes
    this reuse and its opportunities and risks. Earlier work on learned representations and transfer helped
    make that role possible.
  text_mode: A **foundation model** is broadly trained and can be adapted or used for a range of downstream
    tasks. A **downstream task** is a particular later use, such as categorizing a document or answering a
    question. The term describes a model’s role and breadth of reuse; it is not a single architecture or a
    claim that the model has complete knowledge. The 2021 Stanford-led report on foundation models analyzes
    this reuse and its opportunities and risks. Earlier work on learned representations and transfer helped
    make that role possible.
  bridges: []
- id: foundation-model-era.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.foundation-model-era
  title: Representations can be reused in different ways
  markdown: 'A **representation** is the form in which a system carries information. A learned representation
    might help several later tasks distinguish patterns without designing every feature from scratch. **Transfer**
    means using something learned in one setting to support another. A small application may reuse a model
    unchanged, add a new output component, or adjust some of its weights. The amount and quality of transfer
    depend on the tasks and data. Reuse should be evaluated on the actual later use, not inferred from the
    model’s popularity.


    Model reuse is one way to combine learned capabilities. A different example comes from games, where learning
    can support search. The 2016 AlphaGo paper combined a policy network that helps choose moves, a value network
    that estimates how promising a position is, and tree search that explores continuations. It used learning
    from human examples and self-play. Self-play means generating experience by playing against versions of
    the system itself. Here the learned networks support one game-playing system. A foundation model has the
    broader role of supporting a range of later tasks.'
  text_mode: 'A **representation** is the form in which a system carries information. A learned representation
    might help several later tasks distinguish patterns without designing every feature from scratch. **Transfer**
    means using something learned in one setting to support another. A small application may reuse a model
    unchanged, add a new output component, or adjust some of its weights. The amount and quality of transfer
    depend on the tasks and data. Reuse should be evaluated on the actual later use, not inferred from the
    model’s popularity.


