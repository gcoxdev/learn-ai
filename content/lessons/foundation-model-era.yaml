      url: https://www.nature.com/articles/s41586-021-03819-2
  archetype: perspective
objectives:
  - id: objective.foundation-model-era
    version: 3-draft
    statement: Distinguish a foundation model’s reusable training role from its architecture, adaptation method, and deployed application.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - foundation-model-era.base.v3
      - foundation-model-era.transfer.v3
    prerequisites:
      - anyOf:
          - objective.deep-learning-revival
scenes:
  - id: foundation-model-era.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.foundation-model-era
    title: Move 37
    markdown: |-
      :::story Seoul, March 2016
      In game 2 of its match against Lee Sedol, one of the world's best Go players, DeepMind's AlphaGo placed a stone where no expert expected. Commentators thought it was a mistake. AlphaGo's own move-suggesting network had rated the chance a human would play it at about 1 in 10,000. Move 37 turned out to be brilliant, and AlphaGo won the match 4–1. Lee's one win came from a stunning move of his own, move 78 in game 4.
      :::

      Compare AlphaGo with IBM's Deep Blue, which beat Kasparov at chess in 1997:

      | | Deep Blue (1997) | AlphaGo (2016) |
      | --- | --- | --- |
      | How it scored positions | Rules tuned by hand with chess experts | A *value network* learned from games |
      | How it chose moves to explore | Brute-force search, over 100 million positions a second | A *policy network* suggests moves; tree search checks them |
      | Where its skill came from | Programmers and grandmasters | Human games first, then millions of games against itself |

      Go has too many positions for brute force and no good hand-written scoring rules, so AlphaGo had to *learn* its judgment. Learning by trial and reward, as in self-play, is **reinforcement learning**. Yet AlphaGo could only play Go. The next big idea was a model you could reuse for almost anything.
    bridges: []
  - id: foundation-model-era.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.foundation-model-era
    title: Words become vectors
    markdown: |-
      In 2013 Tomas Mikolov and colleagues at Google released **word2vec**, which learns a list of numbers, a *vector*, for each word by predicting the words around it in billions of words of text. Words used in similar ways end up with similar vectors. The famous surprise was that arithmetic on these vectors captures relationships:

      ```python run
      import numpy as np

      # Invented 3-number vectors. Real word2vec vectors have ~300 numbers,
      # learned by predicting each word's neighbors in billions of words of text.
      vec = {
          "king":   np.array([0.9, 0.7, 0.1]),
          "queen":  np.array([0.9, -0.6, 0.2]),
          "man":    np.array([0.1, 0.8, 0.0]),
          "woman":  np.array([0.1, -0.7, 0.1]),
          "prince": np.array([0.7, 0.6, -0.1]),
          "apple":  np.array([0.0, 0.0, 0.9]),
      }

      def cosine(a, b):
          return a @ b / (np.linalg.norm(a) * np.linalg.norm(b))

      target = vec["king"] - vec["man"] + vec["woman"]
      print("king - man + woman =", np.round(target, 2))
      for word in ["queen", "prince", "apple"]:     # skip the three input words
          print(f"  similarity to {word:>6}: {cosine(target, vec[word]):.3f}")
      ```

      :::predict Before you run it: which word is closest to king − man + woman?
      "Queen," with similarity 0.991 (1.0 means pointing the same way). Subtracting "man" and adding "woman" flips the second number while keeping the "royal" first number.
      :::

      The bigger idea was reuse: teams plugged the downloaded vectors into their own spam filters, search engines, and review classifiers. Training once on huge text and reusing the result everywhere is **pretraining**, and it would soon grow from single words to whole models.
    bridges: []
  - id: foundation-model-era.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.foundation-model-era
    title: The Transformer reads everything at once
    markdown: |-
      In 2017, eight Google researchers introduced the **Transformer**, built to translate between languages. Earlier translators used LSTMs, which read a sentence one word at a time, so training couldn't use a GPU's full parallel power.

      The Transformer relies on **attention**: every word scores how relevant each other word is, then takes a weighted mix of their information. In "The animal didn't cross the street because it was tired," the word "it" might give "animal" a weight of 0.8 and "street" 0.2, so its new meaning is mostly "animal." Attention for translation dated from 2014 (Bahdanau, Cho, and Bengio); the Transformer made it the whole design, hence the paper's title, "Attention Is All You Need." Every word does this at once, so training runs in parallel on GPUs, and models could grow far larger.

      :::mixup "A Transformer and a foundation model are the same thing."
      *Transformer* names an architecture. *Foundation model* names a role: trained broadly, then reused for many tasks. Most foundation models are Transformers, but a small Transformer trained only to translate English to German isn't a foundation model. You'll take a Transformer apart in the attention module.
      :::
    bridges: []
  - id: foundation-model-era.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.foundation-model-era
    title: Pretrain once, adapt many times
    markdown: |-
      From 2018, labs trained Transformers on enormous amounts of text and reused them:

      - **GPT** (OpenAI, 2018) and its successors learned by predicting the next word.
      - **BERT** (Google, 2018) learned by filling in hidden words. Teams then **fine-tuned** it, training a little more on a few thousand labeled examples for their own task. By 2019 Google was using it in Search.
      - **GPT-2** (2019, 1.5 billion weights) wrote text fluent enough that OpenAI released it in stages, citing misuse worries.
      - **GPT-3** (2020, 175 billion weights) could do new tasks from a few examples placed in its prompt, with no retraining at all.

      In 2021 a Stanford report named this pattern: a **foundation model** is trained broadly once, then adapted to many *downstream tasks*, the specific jobs it's later used for.

      :::predict You show GPT-3 three English-to-French examples in its prompt, then a fourth English sentence, and it translates it. Which of its 175 billion weights changed?
      None. The examples changed only the *input*. Learning from examples in the prompt is called *in-context learning*, and it's why one frozen model could serve thousands of different applications.
      :::
    diagram:
      caption: One pretrained model, three ways to adapt it, many applications.
      description: A large text collection feeds pretraining, which produces a foundation model. The foundation model can be fine-tuned on labeled examples (as with BERT), prompted with examples at answer time (as with GPT-3), or instruction-tuned with human feedback (as with ChatGPT). Each of the three routes leads to applications.
      nodes:
        - id: text
          label: Huge text collection
          col: 0
          row: 1
          tone: data
        - id: fm
          label: Foundation model
          note: pretrained once
          col: 1
          row: 1
          tone: accent
        - id: ft
          label: Fine-tune on labeled data
          note: BERT-style
          col: 2
          row: 0
        - id: prompt
          label: Prompt with examples
          note: GPT-3-style, weights unchanged
          col: 2
          row: 1
        - id: rlhf
          label: Instruction tuning + RLHF
          note: ChatGPT-style
          col: 2
          row: 2
        - id: apps
          label: Many applications
          col: 3
          row: 1
      edges:
        - from: text
          to: fm
          label: pretraining
        - from: fm
          to: ft
        - from: fm
          to: prompt
        - from: fm
          to: rlhf
        - from: ft
          to: apps
        - from: prompt
          to: apps
        - from: rlhf
          to: apps
    bridges: []
  - id: foundation-model-era.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.foundation-model-era
    markdown: Separate the architecture, the pretraining, the adaptation, and the product in cases from GPT-3's prompts to three apps that share one weakness.
    takeaway: |-
      A foundation model is pretrained broadly once, then adapted by fine-tuning, by prompting, or by instruction tuning with human feedback. The Transformer is its usual architecture, and a product like ChatGPT is the model plus all of that adaptation and the system around it.
  - id: foundation-model-era.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.foundation-model-era
    markdown: |-
      Modern AI combines scalable representation learning with task-specific systems; major demonstrations in games, attention, and generation establish scoped capabilities rather than one universal kind of intelligence.
  - id: foundation-model-era.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.foundation-model-era
    title: From autocomplete to assistant
    markdown: |-
      Ask raw GPT-3 "How do I bake bread?" and it might continue with more questions, like a forum page. It was trained to continue text, not to help. Turning it into an assistant took extra training, called **post-training**:

      1. **Instruction tuning:** train on thousands of example requests paired with good answers written by people.
      2. **Reward model:** people rank several answers to the same request; a second model learns to predict their rankings.
      3. **Reinforcement learning:** the assistant is trained to produce answers the reward model scores highly.

      Steps 2 and 3 are **reinforcement learning from human feedback (RLHF)**. In OpenAI's 2022 InstructGPT paper, people preferred the answers of a 1.3-billion-weight model trained this way over those of the original 175-billion-weight GPT-3.

      :::story November 30, 2022
      OpenAI released ChatGPT, a GPT-3.5 model post-trained this way, in a simple chat window. It passed a million users in about five days, and analysts estimated it reached 100 million monthly users by January 2023, which they called the fastest growth of any consumer app to that point.
      :::

      You'll build these post-training steps in the post-training module.
    bridges: []
  - id: foundation-model-era.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.foundation-model-era
    title: Shared foundations share strengths and weaknesses
    markdown: |-
      Deep learning with attention reached science too. At the CASP14 protein-structure competition in 2020, DeepMind's AlphaFold 2 predicted proteins' 3D shapes from their amino-acid sequences with a median score above 90 on the contest's 100-point scale, close to the accuracy of lab experiments for many proteins. Demis Hassabis and John Jumper, who led the work, shared half of the 2024 Nobel Prize in Chemistry; the other half went to David Baker for designing new proteins.

      Reuse has a flip side. Suppose three companies build a tutoring app, a support bot, and a translation tool on the same foundation model, and all three stumble on the same regional dialect. They likely inherited one weakness from the shared pretraining data, so test the base model itself on that dialect first. The fix may belong there, not in three apps.
    bridges: []
