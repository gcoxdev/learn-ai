assessment_families:
- id: foundation-model-era.base
  objective_ref: objective.foundation-model-era
  task: base
  response_type: single_choice
  points: 1
  hint: 'Attention changed sequence modeling: trace the inputs, operation, and result before choosing.'
  remediation_scene: foundation-model-era.s2
  variants:
  - id: foundation-model-era.base.1
    prompt: Is attention itself a complete training recipe?
    options:
    - id: b
      text: Yes; it determines every dataset
    - id: c
      text: Yes; it guarantees instruction following
    - id: a
      text: No; objectives, data, and optimization must also be specified
    answer: a
    feedback: An architecture component does not specify the entire learning pipeline.
    retired: true
  - id: foundation-model-era.base.2
    prompt: What makes broad pretraining useful downstream?
    options:
    - id: c
      text: It proves every possible capability
    - id: a
      text: Representations and parameters can be adapted across tasks
    - id: b
      text: It eliminates task-specific evaluation
    answer: a
    feedback: Transfer is an empirical possibility that still requires evaluation.
    retired: true
- id: foundation-model-era.transfer
  objective_ref: objective.foundation-model-era
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Read a modern milestone critically: trace the inputs, operation, and result before choosing.'
  remediation_scene: foundation-model-era.s4
  variants:
  - id: foundation-model-era.transfer.1
    prompt: A game agent uses neural evaluation and tree search. Should success be attributed to the network
      alone?
    options:
    - id: c
      text: Yes; rules never affect game tasks
    - id: a
      text: No; the complete system and search budget matter
    - id: b
      text: Yes; search is not computation
    answer: a
    feedback: System components jointly contribute to measured performance.
    retired: true
  - id: foundation-model-era.transfer.2
    prompt: One answer system has retrieval and another does not. What must a comparison report?
    options:
    - id: a
      text: The available evidence and tool conditions
    - id: b
      text: Only the number of words in their names
    - id: c
      text: Only which system is newer
    answer: a
    feedback: External evidence changes the task conditions and interpretation of results.
    retired: true
- id: foundation-model-era.base.v2
  objective_ref: objective.foundation-model-era
  task: base
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: foundation-model-era.s3
  variants:
  - prompt: One broadly trained model is adapted to several later tasks. What does foundation describe here?
    answer: a
    options:
    - id: a
      text: Its reusable role across applications
    - id: b
      text: A requirement to use one particular layer design
    - id: c
      text: The completion of each application’s evaluation
    feedback: The term describes broad training and reuse, not a fixed architecture.
    id: foundation-model-era.base.v2.1
  - prompt: A transformer is trained narrowly for one specialized prediction task. Which distinction matters?
    answer: a
    options:
    - id: b
      text: Its architecture proves it has been adapted to many tasks
    - id: c
      text: Its parameter file contains every application using transformers
    - id: a
      text: Architecture alone does not establish broad foundation-model reuse
    feedback: Architecture and reuse are separate descriptions.
    id: foundation-model-era.base.v2.2
  - prompt: A user changes the prompt while keeping the checkpoint fixed. Which operation is directly changed?
    answer: a
    options:
    - id: c
      text: The original examples used to fit the checkpoint
    - id: a
      text: The information supplied at inference
    - id: b
      text: The stored weights updated during training
    feedback: A changed input can change behavior without modifying stored settings.
    id: foundation-model-era.base.v2.3
  - prompt: A model receives further adjustment for instruction following after broad training. Which stage
      is being described?
    answer: a
    options:
    - id: a
      text: Post-training adaptation
    - id: b
      text: Unchanged-weight inference on a new request
    - id: c
      text: A retrieved document added to one prompt
    feedback: Additional weight adjustment is distinct from supplying information to a fixed model.
    id: foundation-model-era.base.v2.4
- id: foundation-model-era.transfer.v2
  objective_ref: objective.foundation-model-era
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: foundation-model-era.s3
  variants:
  - prompt: An application gives fresher answers after adding document lookup. What should be investigated
      first?
    answer: a
    options:
    - id: a
      text: The retrieval and context supplied to the existing model
    - id: b
      text: Whether the model necessarily relearned its original dataset
    - id: c
      text: Whether the new documents changed the architecture’s layer count
    feedback: The surrounding pipeline can change information available at inference.
    id: foundation-model-era.transfer.v2.1
  - prompt: Three products reuse a model that struggles with one dialect. What concern deserves testing?
    answer: a
    options:
    - id: b
      text: Whether separate product names eliminate shared model weaknesses
    - id: c
      text: Whether successful deployment on another dialect establishes this one
    - id: a
      text: Whether that weakness carries into their different applications
    feedback: Shared components can propagate weaknesses, but each application needs evidence.
    id: foundation-model-era.transfer.v2.2
  - prompt: A release supplies weights but no training dataset. Which claim is supported?
    answer: a
    options:
    - id: c
      text: The released weights document every training decision
    - id: a
      text: The checkpoint is available; dataset availability remains separate
    - id: b
      text: The dataset can be treated as published through the weights
    feedback: Artifacts provide different kinds of access and evidence.
    id: foundation-model-era.transfer.v2.3
  - prompt: A new checkpoint scores better in one application with new tools. What comparison isolates checkpoint
      effects?
    answer: a
    options:
    - id: a
      text: Compare checkpoints with the surrounding tools held comparable
    - id: b
      text: Attribute the full gain to the checkpoint’s release date
    - id: c
      text: Compare the new system with an unrelated historical task
    feedback: Changes in model and pipeline need separate comparisons where possible.
    id: foundation-model-era.transfer.v2.4
