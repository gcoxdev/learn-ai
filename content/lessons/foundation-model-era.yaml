lesson:
  id: foundation-model-era
  version: 0.4.0-draft
  title: Games, attention, and broadly reusable models
  state: draft
  summary: In 2016 a Go program played a move no expert would choose. Six years later ChatGPT reached a million users in five days. Trace how one pretrained model came to power thousands of products.
  slot: M01.7
  category: learning
  sources:
    - title: Bommasani and colleagues — foundation models (2021)
      url: https://arxiv.org/abs/2108.07258
    - title: Vaswani and colleagues — Attention Is All You Need (2017)
      url: https://arxiv.org/abs/1706.03762
    - title: Silver et al. — Mastering the game of Go with deep neural networks and tree search (2016)
      url: https://www.nature.com/articles/nature16961
    - title: Mikolov et al. — Efficient Estimation of Word Representations in Vector Space (2013)
      url: https://arxiv.org/abs/1301.3781
    - title: Devlin et al. — BERT (2018)
      url: https://arxiv.org/abs/1810.04805
    - title: Brown et al. — Language Models are Few-Shot Learners (GPT-3, 2020)
      url: https://arxiv.org/abs/2005.14165
    - title: Ouyang et al. — Training language models to follow instructions with human feedback (2022)
      url: https://arxiv.org/abs/2203.02155
