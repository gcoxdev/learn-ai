schema_version: 0.2-draft
lesson:
  id: foundation-model-era
  version: 0.1.0-draft
  title: Games, attention, and broadly reusable models
  state: draft
  summary: Modern AI combines scalable representation learning with task-specific systems; major demonstrations
    in games, attention, and generation establish scoped capabilities rather than one universal kind of intelligence.
  slot: M01.7
  category: learning
  minutes: 12
  sources:
  - title: Attention Is All You Need
    url: https://arxiv.org/abs/1706.03762
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.foundation-model-era
  version: 1-draft
  statement: Modern AI combines scalable representation learning with task-specific systems; major demonstrations
    in games, attention, and generation establish scoped capabilities rather than one universal kind of intelligence.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - foundation-model-era.base
  - foundation-model-era.transfer
  prerequisites:
  - anyOf:
    - objective.deep-learning-revival
scenes:
- id: foundation-model-era.s1
  title: Learn useful representations across tasks
  type: explanation
  depth: intuition
  objective_refs:
  - objective.foundation-model-era
  markdown: Deep reinforcement learning joined learned representations with reward-driven decisions. Game systems
    also used search, simulation, and carefully defined rules. A strong result in a game can reveal valuable mechanisms
    while leaving open how they transfer to environments with ambiguous goals and limited feedback.
  text_mode: Deep reinforcement learning joined learned representations with reward-driven decisions. Game systems
    also used search, simulation, and carefully defined rules. A strong result in a game can reveal valuable mechanisms
    while leaving open how they transfer to environments with ambiguous goals and limited feedback.
  bridges: []
- id: foundation-model-era.s2
  title: Attention changed sequence modeling
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.foundation-model-era
  markdown: Attention lets a model compute context-dependent mixtures of representations. The 2017 Transformer used
    attention as a central sequence-processing mechanism. Later systems adapted these components for language, images,
    audio, and other data. Attention is an architectural operation; the objective and training data still determine
    what behavior is encouraged.
  text_mode: Attention lets a model compute context-dependent mixtures of representations. The 2017 Transformer
    used attention as a central sequence-processing mechanism. Later systems adapted these components for language,
    images, audio, and other data. Attention is an architectural operation; the objective and training data still
    determine what behavior is encouraged.
  bridges: []
- id: foundation-model-era.s3
  title: Pretrain once, adapt for several uses
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.foundation-model-era
  markdown: A foundation model is trained broadly enough to support adaptation to a range of downstream tasks. Pretraining,
    instruction tuning, preference optimization, retrieval, and tools can contribute at different stages. The phrase
    does not imply that every release contains all these stages or that the base model alone is the entire product.
  text_mode: A foundation model is trained broadly enough to support adaptation to a range of downstream tasks.
    Pretraining, instruction tuning, preference optimization, retrieval, and tools can contribute at different stages.
    The phrase does not imply that every release contains all these stages or that the base model alone is the entire
    product.
  bridges: []
- id: foundation-model-era.s4
  title: Read a modern milestone critically
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.foundation-model-era
  markdown: 'Compare what changed: an architecture, data mixture, scale, post-training method, inference budget,
    or application scaffolding. A model that answers more questions after using a search tool has a different evidence
    source from a model tested without tools. Historical comparisons need matched tasks and reported resource conditions.'
  text_mode: 'Compare what changed: an architecture, data mixture, scale, post-training method, inference budget,
    or application scaffolding. A model that answers more questions after using a search tool has a different evidence
    source from a model tested without tools. Historical comparisons need matched tasks and reported resource conditions.'
  bridges: []
- id: foundation-model-era.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.foundation-model-era
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Modern AI combines scalable representation learning with task-specific systems; major demonstrations
    in games, attention, and generation establish scoped capabilities rather than one universal kind of intelligence.
- id: foundation-model-era.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.foundation-model-era
  markdown: Modern AI combines scalable representation learning with task-specific systems; major demonstrations
    in games, attention, and generation establish scoped capabilities rather than one universal kind of intelligence.
  text_mode: Modern AI combines scalable representation learning with task-specific systems; major demonstrations
    in games, attention, and generation establish scoped capabilities rather than one universal kind of intelligence.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - foundation-model-era.s1
    - foundation-model-era.s2
    - foundation-model-era.s3
    - foundation-model-era.s4
    - foundation-model-era.check
    gate_refs:
