- id: foundation-model-era.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.foundation-model-era
  title: Place the transformer milestone in context
  markdown: The 2017 Attention Is All You Need paper introduced the Transformer and evaluated it on language-processing
    tasks including translation. **Attention** is a calculation that scores pieces of information and combines
    their represented contents. The architecture made attention central and enabled useful parallel computation
    during training. Attention and learned representations already had a broader research history. A transformer
    is one architecture family; “foundation model” describes reuse after broad training. The terms are related
    in many systems but are not synonyms.
  text_mode: The 2017 Attention Is All You Need paper introduced the Transformer and evaluated it on language-processing
    tasks including translation. **Attention** is a calculation that scores pieces of information and combines
    their represented contents. The architecture made attention central and enabled useful parallel computation
    during training. Attention and learned representations already had a broader research history. A transformer
    is one architecture family; “foundation model” describes reuse after broad training. The terms are related
    in many systems but are not synonyms.
  bridges: []
- id: foundation-model-era.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.foundation-model-era
  title: Separate pretraining, adaptation, and inference
  markdown: '**Pretraining** is an earlier training phase that builds reusable model capabilities. **Post-training**
    describes later adjustment stages, often aimed at task behavior, instruction following, or preferences.
    **Inference** applies a model to an input to produce outputs. A **prompt** is information supplied for
    a particular use. Changing the prompt can change an answer without changing the stored weights. These roles
    matter when reading a claim that a system improved: was it retrained, given different information, or connected
    to another component?'
  text_mode: '**Pretraining** is an earlier training phase that builds reusable model capabilities. **Post-training**
    describes later adjustment stages, often aimed at task behavior, instruction following, or preferences.
    **Inference** applies a model to an input to produce outputs. A **prompt** is information supplied for
    a particular use. Changing the prompt can change an answer without changing the stored weights. These roles
    matter when reading a claim that a system improved: was it retrained, given different information, or connected
    to another component?'
  bridges: []
- id: foundation-model-era.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.foundation-model-era
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Reusable pretraining links many applications to shared model strengths and weaknesses. Inspect
    each training stage and each deployed task rather than treating a model name as a complete explanation.
- id: foundation-model-era.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.foundation-model-era
  markdown: Modern AI combines scalable representation learning with task-specific systems; major demonstrations
    in games, attention, and generation establish scoped capabilities rather than one universal kind of intelligence.
  text_mode: Modern AI combines scalable representation learning with task-specific systems; major demonstrations
    in games, attention, and generation establish scoped capabilities rather than one universal kind of intelligence.
- id: foundation-model-era.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.foundation-model-era
  title: A model becomes part of a larger system
  markdown: A writing application might combine a pretrained language model with document lookup, a calculator,
    and checks on the response. **Retrieval** finds relevant stored information; it can supply newer facts
    without putting those facts into the model’s weights. A model checkpoint is a saved set of model settings
    at a particular point. Different checkpoints, prompts, and tools can produce different systems even under
    a shared family name. A product’s success should therefore be traced through the complete pipeline.
  text_mode: A writing application might combine a pretrained language model with document lookup, a calculator,
    and checks on the response. **Retrieval** finds relevant stored information; it can supply newer facts
    without putting those facts into the model’s weights. A model checkpoint is a saved set of model settings
    at a particular point. Different checkpoints, prompts, and tools can produce different systems even under
    a shared family name. A product’s success should therefore be traced through the complete pipeline.
  bridges: []
- id: foundation-model-era.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.foundation-model-era
  title: Shared foundations can also share failures
  markdown: When several applications reuse one model, useful capabilities can spread, but weaknesses can spread
    too. A pattern that is poorly represented in training may affect several downstream uses. Ask who supplied
    the data, which tasks were tested, how the later application was evaluated, and what remains undisclosed.
    Released weights, source code, and training data are different artifacts; availability of one does not
    imply availability of all. These questions will guide our later model case studies.
  text_mode: When several applications reuse one model, useful capabilities can spread, but weaknesses can
    spread too. A pattern that is poorly represented in training may affect several downstream uses. Ask who
    supplied the data, which tasks were tested, how the later application was evaluated, and what remains undisclosed.
    Released weights, source code, and training data are different artifacts; availability of one does not
    imply availability of all. These questions will guide our later model case studies.
  bridges: []
