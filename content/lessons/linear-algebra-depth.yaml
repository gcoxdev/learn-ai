scenes:
- id: linear-algebra-depth.s1
  title: Coordinates depend on a basis
  type: explanation
  depth: intuition
  objective_refs:
  - objective.linear-algebra-depth
  markdown: A basis is a set of independent directions that can express every vector in the space. In the usual
    plane, [1, 0] and [0, 1] are a basis. Changing the basis changes coordinate numbers without necessarily changing
    the underlying geometric vector. Dependence means one direction can be built from others.
  text_mode: A basis is a set of independent directions that can express every vector in the space. In the usual
    plane, [1, 0] and [0, 1] are a basis. Changing the basis changes coordinate numbers without necessarily changing
    the underlying geometric vector. Dependence means one direction can be built from others.
  bridges: []
- id: linear-algebra-depth.s2
  title: Find a direction preserved by a transformation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.linear-algebra-depth
  markdown: 'For the diagonal matrix with entries 3 and 1, multiplying [1, 0] gives [3, 0]. The direction is preserved
    and scaled by 3: this vector is an eigenvector with eigenvalue 3. The second coordinate direction has eigenvalue
    1. Arbitrary vectors need not keep their direction.'
  text_mode: 'For the diagonal matrix with entries 3 and 1, multiplying [1, 0] gives [3, 0]. The direction is preserved
    and scaled by 3: this vector is an eigenvector with eigenvalue 3. The second coordinate direction has eigenvalue
    1. Arbitrary vectors need not keep their direction.'
  bridges:
  - matrices-tensors
- id: linear-algebra-depth.s3
  title: Separate rotations from scaling
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.linear-algebra-depth
  markdown: A singular value decomposition writes a matrix as two orthogonal coordinate transformations with nonnegative
    scalings between them. Unlike an eigenvalue decomposition, it also applies to rectangular real matrices. Singular
    values tell us the strengths of these transformed directions. Keeping only the strongest few gives a low-rank
    approximation under stated error criteria.
  text_mode: A singular value decomposition writes a matrix as two orthogonal coordinate transformations with nonnegative
    scalings between them. Unlike an eigenvalue decomposition, it also applies to rectangular real matrices. Singular
    values tell us the strengths of these transformed directions. Keeping only the strongest few gives a low-rank
    approximation under stated error criteria.
  bridges: []
- id: linear-algebra-depth.s4
  title: Connect compression to a model
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.linear-algebra-depth
  markdown: A 100 × 100 weight update stores 10,000 numbers. Representing a rank-two update as a 100 × 2 matrix
    times a 2 × 100 matrix stores 400 numbers. This can save trainable parameters, but restricts which updates are
    representable. PCA similarly keeps selected variance directions, which need not be the directions most useful
    for every downstream task.
