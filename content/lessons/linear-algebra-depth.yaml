- id: linear-algebra-depth.s4
  title: Connect compression to a model
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.linear-algebra-depth
  markdown: A 100 × 100 weight update stores 10,000 numbers. Representing a rank-two update as a 100 × 2 matrix
    times a 2 × 100 matrix stores 400 numbers. This can save trainable parameters, but restricts which updates
    are representable. PCA similarly keeps selected variance directions, which need not be the directions most
    useful for every downstream task.
