    [0, 4]. Orthogonal means perpendicular in this geometry. A square root undoes squaring for a nonnegative
    result: √25 = 5.'
  bridges:
  - vectors
- id: linear-algebra-depth.s2
  title: Find a direction preserved by a transformation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.linear-algebra-depth
  markdown: 'For the diagonal matrix with entries 3 and 1, multiplying [1, 0] gives [3, 0]. The direction is
    preserved and scaled by 3: this vector is an eigenvector with eigenvalue 3. The second coordinate direction
    has eigenvalue 1. Arbitrary vectors need not keep their direction.'
  text_mode: 'For the diagonal matrix with entries 3 and 1, multiplying [1, 0] gives [3, 0]. The direction
    is preserved and scaled by 3: this vector is an eigenvector with eigenvalue 3. The second coordinate direction
    has eigenvalue 1. Arbitrary vectors need not keep their direction.'
  bridges:
  - matrices-tensors
- id: linear-algebra-depth.s3
  title: Separate rotations from scaling
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.linear-algebra-depth
  markdown: 'A **singular value decomposition**, or **SVD**, represents a matrix as two orthogonal coordinate
    transformations with nonnegative scalings between them. The orthogonal transformations preserve lengths
    and angles; the scalings stretch or shrink selected directions. Their scale factors are the **singular
    values**.


    Unlike an eigenvalue decomposition, this also applies to rectangular real matrices. **Rank** counts the
    independent output directions.


    A diagonal transformation with scale factors 3 and 1 has rank two. Replacing the weaker factor with zero
    leaves scale factors 3 and 0, giving rank one. It preserves the first direction and discards the second.
    Keeping the strongest few singular directions gives a low-rank approximation under stated error criteria;
    whether that lost detail matters depends on the task.'
  text_mode: 'A **singular value decomposition**, or **SVD**, represents a matrix as two orthogonal coordinate
