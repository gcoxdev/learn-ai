schema_version: 0.2-draft
lesson:
  id: linear-algebra-depth
  version: 0.3.0-draft
  title: Directions, eigenvectors, and low-rank structure
  state: draft
  summary: Some directions a matrix only stretches, never turns. Find them in a 2×2 example, then see how keeping only the strongest ones powers PCA and LoRA fine-tuning.
  slot: B08
  category: bridge
  sources:
    - title: Deep Learning — linear algebra
      url: https://www.deeplearningbook.org/contents/linear_algebra.html
objectives:
  - id: objective.linear-algebra-depth
    version: 2-draft
    statement: Find an eigenvalue by checking Av = λv, describe the SVD as rotate-stretch-rotate, and count the numbers saved by a low-rank factorization.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - linear-algebra-depth.base.v2
      - linear-algebra-depth.transfer.v2
    prerequisites:
      - anyOf:
          - objective.matrices-tensors
scenes:
  - id: linear-algebra-depth.s1
    title: Length, and the directions you measure along
    type: explanation
    depth: intuition
    objective_refs:
      - objective.linear-algebra-depth
    markdown: |-
      LoRA, a popular way to fine-tune language models, can adjust a 4096 × 4096 weight matrix, almost 17 million numbers, by training only 65,536. PCA (principal component analysis) squeezes a table with many columns into two or three. Both rest on one idea: most matrices do their important work along a few special directions.

      **Why AI needs this:** those directions are what the lessons "Compress variation into fewer directions" (PCA) and "Adapt a model by learning a smaller parameter update" (LoRA) compute.

      First, two tools. A vector's **length** (or **norm**), written ‖v‖, is √(sum of squared coordinates): ‖[3, 4]‖ = √(9 + 16) = 5. And coordinates are measured along chosen directions. The usual ones are [1, 0] and [0, 1], but any set of independent directions that can build every vector, called a **basis**, works too. The trick in this lesson is choosing a basis that suits the matrix.
    bridges:
      - vectors
  - id: linear-algebra-depth.s2
    title: Eigenvectors are directions a matrix only stretches
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.linear-algebra-depth
    markdown: |-
      Multiply a few vectors by

      $$A = \begin{bmatrix} 2 & 1 \\ 1 & 2 \end{bmatrix}$$

      | v | Av | What happened |
      | --- | --- | --- |
      | [1, 0] | [2, 1] | turned and stretched |
      | [1, 1] | [3, 3] | same direction, 3 times longer |
      | [1, −1] | [1, −1] | same direction, unchanged |

      Most vectors get turned. But [1, 1] and [1, −1] only get stretched. A direction that a matrix only stretches is an **eigenvector**, and the stretch factor is its **eigenvalue**, written λ (lambda):

      $$A v = \lambda v$$

      Here [1, 1] has λ = 3 and [1, −1] has λ = 1. To test any candidate, multiply and see whether the result is a multiple of the original.

      :::predict What does A do to [2, 2]? And to [0, 1]?
      [2, 2] → [6, 6], three times longer, because it points the same way as [1, 1]; any stretch of an eigenvector is also an eigenvector. [0, 1] → [1, 2], which has turned, so it isn't one.
      :::

      :::mixup "The eigenvalues are the numbers on the diagonal."
      Only for diagonal (or triangular) matrices. A has 2 and 2 on its diagonal, yet its eigenvalues are 3 and 1. For a 2 × 2 matrix they solve λ² − (a + d)λ + (ad − bc) = 0, here λ² − 4λ + 3 = 0.
      :::

      The covariance matrix in the PCA lesson, [[5, 4], [4, 5]], has these same two eigenvectors, with eigenvalues 9 and 1: the data's variance (its spread) is 9 times larger along [1, 1] than along [1, −1].
    bridges:
      - matrices-tensors
  - id: linear-algebra-depth.s3
    title: 'Every matrix: rotate, stretch, rotate'
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.linear-algebra-depth
    markdown: |-
      Eigenvectors need a square matrix, and even then they can be awkward. The **singular value decomposition (SVD)** works for *any* matrix, including rectangular ones: M = UΣVᵀ. Read it right to left as three steps: rotate (Vᵀ), stretch along each axis (Σ), rotate again (U). The stretch factors in Σ are the **singular values**, listed largest first. For our A they're 3 and 1.

      The **rank** of a matrix is the number of independent directions it can output, which equals the number of nonzero singular values. A has rank 2.

      Now the payoff. Keep only the biggest singular value and drop the rest, and you get the best possible rank-1 stand-in for A:

      $$A_1 = \begin{bmatrix} 1.5 & 1.5 \\ 1.5 & 1.5 \end{bmatrix}$$

      Everything A did along [1, −1] is gone; its work along [1, 1] is kept. The leftover A − A₁ has size exactly 1, the singular value you dropped. Keeping the top k singular values gives the best rank-k approximation in squared error (Eckart and Young, 1936), and that's exactly what PCA does to a data table.

      :::mixup "A low-rank matrix has small entries."
      Rank counts directions, not sizes. [[100, 200], [300, 600]] has huge entries but rank 1: its second row is just 3 times its first.
      :::
    bridges:
      - matrices-tensors
  - id: linear-algebra-depth.s4
    title: Low rank saves numbers
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.linear-algebra-depth
    markdown: |-
      A rank-r matrix of size d × d can be written as a (d × r) matrix times an (r × d) matrix. That stores 2dr numbers instead of d². (For an m × n matrix it's m × r + r × n instead of m × n.)

      Three worked counts:

      1. d = 100, r = 2: 400 numbers instead of 10,000.
      2. d = 20, r = 3: 2 × 20 × 3 = 120 instead of 400.
      3. The LoRA lesson's example, d = 4096 and r = 8: 65,536 instead of 16,777,216, under 0.4%.

      LoRA freezes the original weights W and learns an update ΔW = BA, with B of shape (d, r) and A of shape (r, d). The bet is that fine-tuning needs only a few new directions. The price is that ΔW can never have rank above r, so a big change, like a new language, may need a larger r.

      Run this to check every number in this lesson, then change `r` to 64:

      ```python run
      import numpy as np

      A = np.array([[2.0, 1.0],
                    [1.0, 2.0]])

      for v in ([1, 0], [1, 1], [1, -1]):
          print("A @", v, "=", A @ np.array(v))

      U, S, Vt = np.linalg.svd(A)
      print("singular values:", np.round(S, 3))

      A1 = S[0] * np.outer(U[:, 0], Vt[0])      # keep only the strongest direction
      print("rank-1 version:\n", np.round(A1, 3))
      print("leftover size:", round(float(np.linalg.norm(A - A1)), 3))

      d, r = 4096, 8
      print(f"full {d}x{d}: {d*d:,} numbers; rank-{r} factors: {2*d*r:,}")
      ```

      With r = 64 the factors hold 524,288 numbers, still only about 3% of the full matrix.
    bridges: []
  - id: linear-algebra-depth.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.linear-algebra-depth
    markdown: Test candidate eigenvectors for new 2×2 matrices, then count what low-rank factors save on attention, embedding, and recommendation matrices.
    takeaway: |-
      An eigenvector is a direction a matrix only stretches, by its eigenvalue. The SVD finds the strongest directions of any matrix, and keeping only a few of them (low rank) is how PCA compresses data and LoRA saves parameters.
  - id: linear-algebra-depth.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.linear-algebra-depth
    markdown: |-
      A basis supplies coordinate directions. Eigenvectors and singular vectors describe a transformation; low-rank approximation keeps selected directions while discarding others.
