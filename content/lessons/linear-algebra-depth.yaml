objectives:
- id: objective.linear-algebra-depth
  version: 1-draft
  statement: Bases describe coordinates; eigenvectors and singular vectors expose how a linear transformation
    acts, and low-rank approximation trades detail for a smaller representation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - linear-algebra-depth.base
  - linear-algebra-depth.transfer
  prerequisites:
  - anyOf:
    - objective.matrices-tensors
scenes:
- id: linear-algebra-depth.s1
  title: Coordinates depend on a basis
  type: explanation
  depth: intuition
  objective_refs:
  - objective.linear-algebra-depth
  markdown: 'A basis is a set of independent directions that can express every vector in the space. In the
    usual plane, [1, 0] and [0, 1] are a basis. Changing the basis changes coordinate numbers without necessarily
    changing the underlying geometric vector. Dependence means one direction can be built from others.


    A vector’s Euclidean length, or norm, is the square root of the sum of squared coordinates. For [3, 4],
    length is √(9 + 16) = 5. Its projection onto the horizontal axis is [3, 0], leaving the perpendicular part
    [0, 4]. Orthogonal means perpendicular in this geometry. A square root undoes squaring for a nonnegative
    result: √25 = 5.'
  text_mode: 'A basis is a set of independent directions that can express every vector in the space. In the
    usual plane, [1, 0] and [0, 1] are a basis. Changing the basis changes coordinate numbers without necessarily
