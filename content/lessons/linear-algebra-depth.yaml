assessment_families:
  - id: linear-algebra-depth.base
    objective_ref: objective.linear-algebra-depth
    task: base
    response_type: single_choice
    points: 1
    hint: Multiply the matrix by the vector and check whether the result points the same way.
    remediation_scene: linear-algebra-depth.s2
    variants:
      - id: linear-algebra-depth.base.1
        retired: true
        prompt: The matrix diag(4, 2) maps [1, 0] to which vector?
        options:
          - id: a
            text: '[4, 0]'
          - id: b
            text: '[1, 2]'
          - id: c
            text: '[4, 2]'
        answer: a
        feedback: The first coordinate is scaled by 4 while the zero second coordinate stays zero.
      - id: linear-algebra-depth.base.2
        retired: true
        prompt: Which decomposition naturally handles a rectangular real matrix?
        options:
          - id: b
            text: Only diagonal eigenvalue scaling with no other factors
          - id: c
            text: Integer factorization
          - id: a
            text: Singular value decomposition
        answer: a
        feedback: SVD separates a general real matrix into orthogonal factors and singular values.
  - id: linear-algebra-depth.transfer
    objective_ref: objective.linear-algebra-depth
    task: transfer
    response_type: single_choice
    points: 1
    hint: A rank-r factorization of a d × d matrix stores 2dr numbers.
    remediation_scene: linear-algebra-depth.s4
    variants:
      - id: linear-algebra-depth.transfer.1
        retired: true
        prompt: A rank-three update for a 20 × 20 matrix uses factors 20 × 3 and 3 × 20. How many factor entries are stored?
        options:
          - id: b
            text: '400'
          - id: c
            text: '60'
          - id: a
            text: '120'
        answer: a
        feedback: Each factor has 60 entries, giving 120 in total.
      - id: linear-algebra-depth.transfer.2
        retired: true
        prompt: Does the largest-variance PCA direction necessarily separate a rare class best?
        options:
          - id: c
            text: Yes; PCA uses the rare-class target automatically
          - id: a
            text: No; variance and task usefulness are different criteria
          - id: b
            text: Yes; variance is a class label
        answer: a
        feedback: Unsupervised variance retention does not guarantee supervised discrimination.
  - id: linear-algebra-depth.base.v2
    objective_ref: objective.linear-algebra-depth
    task: base
    response_type: numeric
    points: 1
    hint: Compute Av (each entry is a row of A dotted with v). If Av is a multiple of v, that multiple is the eigenvalue λ.
    remediation_scene: linear-algebra-depth.s2
    absolute_tolerance: 1e-6
    variants:
      - id: linear-algebra-depth.base.v2.1
        prompt: A = [[4, 1], [2, 3]] (rows listed in order). The vector v = [1, 1] is an eigenvector. What is its eigenvalue?
        answer: 5
        feedback: Av = [4 + 1, 2 + 3] = [5, 5] = 5 × [1, 1], so λ = 5. Reading the eigenvalue off the diagonal (4 or 3) only works for diagonal or triangular matrices.
      - id: linear-algebra-depth.base.v2.2
        prompt: A = [[3, 1], [0, 2]]. The vector v = [1, 0] is an eigenvector. What is its eigenvalue?
        answer: 3
        feedback: Av = [3, 0] = 3 × [1, 0], so λ = 3. (This matrix is triangular, so its eigenvalues, 3 and 2, do sit on the diagonal.)
      - id: linear-algebra-depth.base.v2.3
        prompt: A = [[2, 1], [1, 2]]. The vector v = [1, −1] is an eigenvector. What is its eigenvalue?
        answer: 1
        feedback: Av = [2 − 1, 1 − 2] = [1, −1], exactly v, so λ = 1. The matrix leaves this direction unchanged; its other eigenvalue, 3, belongs to [1, 1].
      - id: linear-algebra-depth.base.v2.4
        prompt: A = [[1, 2], [2, 1]]. The vector v = [1, −1] is an eigenvector. What is its eigenvalue?
        answer: -1
        feedback: Av = [1 − 2, 2 − 1] = [−1, 1] = −1 × [1, −1], so λ = −1. A negative eigenvalue flips the direction but keeps it on the same line.
      - id: linear-algebra-depth.base.v2.5
        prompt: A = [[5, 2], [2, 2]]. The vector v = [2, 1] is an eigenvector. What is its eigenvalue?
        answer: 6
        feedback: Av = [10 + 2, 4 + 2] = [12, 6] = 6 × [2, 1], so λ = 6. Both entries scale by 6 (12 = 6 × 2 and 6 = 6 × 1), so v wasn't turned.
      - id: linear-algebra-depth.base.v2.6
        prompt: A = [[0, 2], [2, 0]]. The vector v = [1, 1] is an eigenvector. What is its eigenvalue?
        answer: 2
        feedback: Av = [0 + 2, 2 + 0] = [2, 2] = 2 × [1, 1], so λ = 2. The diagonal holds zeros here, which shows why reading it off gives the wrong answer.
  - id: linear-algebra-depth.transfer.v2
    objective_ref: objective.linear-algebra-depth
    task: transfer
    response_type: numeric_fields_with_reason
    points: 1
    hint: A full m × n matrix stores m × n numbers. Rank-r factors of shapes (m, r) and (r, n) store m × r + r × n.
    remediation_scene: linear-algebra-depth.s4
    numeric_fields:
      - id: full
        label: Numbers in the full matrix
      - id: factors
        label: Numbers in the two factors
    absolute_tolerance: 1e-6
    variants:
      - id: linear-algebra-depth.transfer.v2.1
        prompt: "A team replaces a 20 × 20 weight update with rank-3 factors of shapes (20, 3) and (3, 20). Record how many numbers the full matrix holds and how many the two factors hold together."
        answers:
          full: 400
          factors: 120
        reason_answer: b
        reason_options:
          - id: a
            text: A rank-r matrix is stored as just r numbers, one per direction.
          - id: b
            text: Rank r needs r columns in one factor and r rows in the other.
          - id: c
            text: Only the first factor counts, since the second can be recomputed.
        feedback: "The factors hold 20 × 3 = 60 plus 3 × 20 = 60, so 120 numbers against 400 for the full matrix. Both factors must be stored, and each has r columns or rows, not a single number per direction."
      - id: linear-algebra-depth.transfer.v2.2
        prompt: "A recommender stores a 1000 × 1000 user-by-user similarity table as rank-4 factors of shapes (1000, 4) and (4, 1000). Record how many numbers the full matrix holds and how many the two factors hold together."
        answers:
          full: 1000000
          factors: 8000
        reason_answer: c
        reason_options:
          - id: b
            text: Only the first factor counts, since the second can be recomputed.
          - id: c
            text: Rank r needs r columns in one factor and r rows in the other.
          - id: a
            text: A rank-r matrix is stored as just r numbers, one per direction.
        feedback: "The factors hold 1000 × 4 = 4,000 plus 4 × 1000 = 4,000, so 8,000 numbers against 1,000,000 for the full matrix. Both factors must be stored, and each has r columns or rows, not a single number per direction."
      - id: linear-algebra-depth.transfer.v2.3
        prompt: "A LoRA adapter with r = 16 updates a 4096 × 4096 attention matrix using B of shape (4096, 16) and A of shape (16, 4096). Record how many numbers the full matrix holds and how many the two factors hold together."
        answers:
          full: 16777216
          factors: 131072
        reason_answer: a
        reason_options:
          - id: c
            text: Only the first factor counts, since the second can be recomputed.
          - id: a
            text: Rank r needs r columns in one factor and r rows in the other.
          - id: b
            text: A rank-r matrix is stored as just r numbers, one per direction.
        feedback: "The factors hold 4096 × 16 = 65,536 plus 16 × 4096 = 65,536, so 131,072 numbers against 16,777,216 for the full matrix. Both factors must be stored, and each has r columns or rows, not a single number per direction."
      - id: linear-algebra-depth.transfer.v2.4
        prompt: "A LoRA adapter with r = 8 updates a rectangular 512 × 256 projection using B of shape (512, 8) and A of shape (8, 256). Record how many numbers the full matrix holds and how many the two factors hold together."
        answers:
          full: 131072
          factors: 6144
        reason_answer: b
        reason_options:
          - id: a
            text: A rank-r matrix is stored as just r numbers, one per direction.
          - id: b
            text: Rank r needs r columns in one factor and r rows in the other.
          - id: c
            text: Only the first factor counts, since the second can be recomputed.
        feedback: "The factors hold 512 × 8 = 4,096 plus 8 × 256 = 2,048, so 6,144 numbers against 131,072 for the full matrix. Both factors must be stored, and each has r columns or rows, not a single number per direction."
      - id: linear-algebra-depth.transfer.v2.5
        prompt: "An embedding projection of size 300 × 300 is compressed to rank 10, with factors (300, 10) and (10, 300). Record how many numbers the full matrix holds and how many the two factors hold together."
        answers:
          full: 90000
          factors: 6000
        reason_answer: c
        reason_options:
          - id: b
            text: Only the first factor counts, since the second can be recomputed.
          - id: c
            text: Rank r needs r columns in one factor and r rows in the other.
          - id: a
            text: A rank-r matrix is stored as just r numbers, one per direction.
        feedback: "The factors hold 300 × 10 = 3,000 plus 10 × 300 = 3,000, so 6,000 numbers against 90,000 for the full matrix. Both factors must be stored, and each has r columns or rows, not a single number per direction."
