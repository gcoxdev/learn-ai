assessment_families:
- id: linear-algebra-depth.base
  objective_ref: objective.linear-algebra-depth
  task: base
  response_type: single_choice
  points: 1
  hint: 'Find a direction preserved by a transformation: trace the inputs, operation, and result before choosing.'
  remediation_scene: linear-algebra-depth.s2
  variants:
  - id: linear-algebra-depth.base.1
    prompt: The matrix diag(4, 2) maps [1, 0] to which vector?
    options:
    - id: a
      text: '[4, 0]'
    - id: b
      text: '[1, 2]'
    - id: c
      text: '[4, 2]'
    answer: a
    feedback: The first coordinate is scaled by 4 while the zero second coordinate stays zero.
  - id: linear-algebra-depth.base.2
    prompt: Which decomposition naturally handles a rectangular real matrix?
    options:
    - id: b
      text: Only diagonal eigenvalue scaling with no other factors
    - id: c
      text: Integer factorization
    - id: a
      text: Singular value decomposition
    answer: a
    feedback: SVD separates a general real matrix into orthogonal factors and singular values.
- id: linear-algebra-depth.transfer
  objective_ref: objective.linear-algebra-depth
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Connect compression to a model: trace the inputs, operation, and result before choosing.'
  remediation_scene: linear-algebra-depth.s4
  variants:
  - id: linear-algebra-depth.transfer.1
    prompt: A rank-three update for a 20 × 20 matrix uses factors 20 × 3 and 3 × 20. How many factor entries
      are stored?
    options:
    - id: b
      text: '400'
    - id: c
      text: '60'
    - id: a
      text: '120'
    answer: a
    feedback: Each factor has 60 entries, giving 120 in total.
  - id: linear-algebra-depth.transfer.2
    prompt: Does the largest-variance PCA direction necessarily separate a rare class best?
    options:
    - id: c
      text: Yes; PCA uses the rare-class target automatically
    - id: a
      text: No; variance and task usefulness are different criteria
    - id: b
      text: Yes; variance is a class label
    answer: a
    feedback: Unsupervised variance retention does not guarantee supervised discrimination.
