  routes:
    - id: route.core
      scene_sequence:
        - evaluation-selection.s1
        - evaluation-selection.s2
        - evaluation-selection.s7
        - evaluation-selection.s3
        - evaluation-selection.s4
        - evaluation-selection.s5
        - evaluation-selection.s6
        - evaluation-selection.check
      gate_refs:
        - gate.core
  scene_aliases:
    evaluation-selection.recap: evaluation-selection.check
assessment_families:
  - id: evaluation-selection.base
    objective_ref: objective.evaluation-selection
    task: base
    response_type: single_choice
    points: 1
    hint: 'Keep inner and outer decisions separate: trace the inputs, operation, and result before choosing.'
    remediation_scene: evaluation-selection.s2
    variants:
      - id: evaluation-selection.base.1
        prompt: Why can the highest of many noisy validation scores be optimistic?
        options:
          - id: b
            text: The metric stops using arithmetic
          - id: c
            text: All candidates become identical after selection
          - id: a
            text: Selection favors positive noise as well as real quality
        answer: a
        feedback: The maximum observed value reflects a winner’s-curse effect.
        retired: true
      - id: evaluation-selection.base.2
        prompt: What does the outer loop in nested evaluation estimate?
        options:
          - id: c
            text: The number of source files
          - id: a
            text: Performance of the inner selection procedure on held-out data
          - id: b
            text: Only training loss of every candidate
        answer: a
        feedback: The outer holdout is not used to make inner choices.
        retired: true
  - id: evaluation-selection.transfer
    objective_ref: objective.evaluation-selection
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Record the search budget: trace the inputs, operation, and result before choosing.'
    remediation_scene: evaluation-selection.s4
    variants:
      - id: evaluation-selection.transfer.1
        prompt: Is choosing the best checkpoint using validation a selection step?
        options:
          - id: c
            text: Only if training used a GPU
          - id: a
            text: 'Yes'
          - id: b
            text: No, because the architecture is unchanged
        answer: a
        feedback: Checkpoint choice uses feedback to select a model state.
        retired: true
      - id: evaluation-selection.transfer.2
        prompt: One method gets 500 tuning trials and another gets 5. What should a comparison disclose?
        options:
          - id: a
            text: The unequal selection budgets
          - id: b
            text: Only the best scores
          - id: c
            text: Only model names
        answer: a
        feedback: Tuning effort is an experimental condition affecting the result.
        retired: true
  - id: evaluation-selection.base.v2
    objective_ref: objective.evaluation-selection
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: evaluation-selection.s3
    variants:
      - prompt: Which should be specified before selecting a model?
        answer: a
        options:
          - id: a
            text: The task, success metric, and operating constraints
          - id: b
            text: Only the largest reported benchmark score
          - id: c
            text: Only the model with the most parameters
        feedback: Selection needs a task-specific rule, not a prestige proxy.
        retired: true
        id: evaluation-selection.base.v2.1
      - prompt: A candidate must respond within two seconds. What role does that requirement play?
        answer: a
        options:
          - id: c
            text: A tokenization rule
          - id: a
            text: An operating constraint
          - id: b
            text: A training-example label
        feedback: A constraint limits eligible candidates under the stated decision policy.
        retired: true
        id: evaluation-selection.base.v2.2
      - prompt: Why inspect error slices as well as overall accuracy?
        answer: a
        options:
          - id: b
            text: Every slice must contain equally many examples
          - id: a
            text: Different groups or failure types may be hidden by the average
          - id: c
            text: Slicing replaces the need for representative data
        feedback: Subgroup measurements can reveal important failures concealed by aggregation.
        retired: true
        id: evaluation-selection.base.v2.3
      - prompt: Which partition is intended for repeated candidate comparison during development?
        answer: a
        options:
          - id: b
            text: A protected final test used as often as needed
          - id: c
            text: The production incident log treated as a complete test
          - id: a
            text: Validation
        feedback: Validation supports selection; final testing has a different job.
        retired: true
        id: evaluation-selection.base.v2.4
  - id: evaluation-selection.transfer.v2
    objective_ref: objective.evaluation-selection
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: evaluation-selection.s3
    variants:
      - prompt: A=91% at 3 seconds; B=89% at 1 second; C=88% at 2 seconds. Choose the highest accuracy among candidates at most 2 seconds.
        answer: a
        options:
          - id: b
            text: A
          - id: a
            text: B
          - id: c
            text: C
        feedback: B and C qualify; B has the higher accuracy among them.
        retired: true
        id: evaluation-selection.transfer.v2.1
      - prompt: One model is given retrieved evidence and another receives only the question. What does their comparison measure?
        answer: a
        options:
          - id: b
            text: Only a controlled difference in model weights
          - id: c
            text: Only their tokenizer vocabulary sizes
          - id: a
            text: The two differently configured systems
        feedback: Input and tool differences are part of the system being compared.
        retired: true
        id: evaluation-selection.transfer.v2.2
      - prompt: A team tries 100 variants and reports only the best validation result. What context is missing?
        answer: a
        options:
          - id: a
            text: The selection process and uncertainty from repeated comparisons
          - id: b
            text: The most attractive model name
          - id: c
            text: The final score’s rounding convention alone
        feedback: Selecting among many noisy results can favor a lucky estimate.
        retired: true
        id: evaluation-selection.transfer.v2.3
      - prompt: A final-test result is used to redesign the prompt. What must the team acknowledge?
        answer: a
        options:
          - id: b
            text: The test stays independent because the weights did not change
          - id: c
            text: The test can now be relabeled as training without explanation
          - id: a
            text: The test informed development and is no longer untouched for that choice
        feedback: System selection includes prompt changes as well as parameter updates.
        retired: true
        id: evaluation-selection.transfer.v2.4
  - id: evaluation-selection.base.v3
    objective_ref: objective.evaluation-selection
    task: base
    response_type: single_choice
    points: 1
    hint: Give each split one job. Validation data pick the winner; the test set measures it once. And the maximum of many noisy scores is lifted by luck.
    remediation_scene: evaluation-selection.s4
    variants:
      - id: evaluation-selection.base.v3.1
        prompt: A team tries 200 prompt variants. The median validation accuracy is 81% and the best is 87%, which they report. What should they expect from the best variant on fresh data?
        options:
          - id: b
            text: About 87%, since the validation data were held out from training
          - id: a
            text: Less than 87%, because picking the maximum also picks luck
          - id: c
            text: More than 87%, since the best variant keeps improving with use
        answer: a
        feedback: Picking the best of 200 noisy scores favors whichever variant got lucky on these particular sentences, so the reported 87% is optimistic. Being held out from training doesn't help once the same data were used to choose.
      - id: evaluation-selection.base.v3.2
        prompt: 'A team''s rule reads: "Lowest error among models smaller than 500 MB." What role does the 500 MB limit play?'
        options:
          - id: c
            text: It is the objective the team tries to improve
          - id: b
            text: It is a slice for checking errors in detail
          - id: a
            text: It is a constraint that candidates must pass
        answer: a
        feedback: The size limit filters which models are eligible; the error is the objective improved among them. A slice is a subset of test cases, not a condition on the model.
      - id: evaluation-selection.base.v3.3
        prompt: In nested cross-validation, what is each outer held-out fold used for?
        options:
          - id: a
            text: Scoring the tuned-and-retrained model once
          - id: b
            text: Choosing the best hyperparameter setting
          - id: c
            text: Supplying extra data to the inner search
        answer: a
        feedback: The inner loop picks the setting using only the outer training folds; the held-out fold is touched once, afterwards, so it measures the whole procedure honestly. If it helped choose, its score would carry the winner's curse.
      - id: evaluation-selection.base.v3.4
        prompt: Why is the final test set scored only once, after every choice is made?
        options:
          - id: b
            text: It should be saved to train the final model afterwards
          - id: a
            text: Any choice made with it lets its luck into the estimate
          - id: c
            text: Scoring it twice would give two different answers
        answer: a
        feedback: Once a test score influences a choice, the test set becomes another validation set, and the reported number is flattered by selection. Rescoring the same model on the same set gives the same answer, so repetition itself isn't the problem.
      - id: evaluation-selection.base.v3.5
        prompt: A team saves 30 training checkpoints and keeps the one with the best validation score. How should they treat that score?
        options:
          - id: c
            text: As a clean estimate, since the architecture never changed
          - id: b
            text: As a test score, since checkpoints aren't hyperparameters
          - id: a
            text: As slightly optimistic, since picking a checkpoint is selection
        answer: a
        feedback: Choosing among 30 checkpoints by validation score is a selection step like any other, so the winner's score is lifted by luck. The architecture staying the same doesn't change that.
  - id: evaluation-selection.transfer.v3
    objective_ref: objective.evaluation-selection
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask whether the number you're given was also used to make a choice, and whether every candidate got the same chance. If not, look for an untouched, equal comparison.
    remediation_scene: evaluation-selection.s5
    variants:
      - id: evaluation-selection.transfer.v3.1
        prompt: A student submits 300 tweaks to a public leaderboard and keeps whichever scores highest there. Final rankings use a separate private split. What should she expect?
        options:
          - id: b
            text: A private score about equal to her public one
          - id: c
            text: A private score above her public one
          - id: a
            text: A private score below her public one
        answer: a
        feedback: Keeping the best of 300 public scores selects for luck on the public split, which doesn't carry over to the private split. That drop is the leaderboard shake-up.
      - id: evaluation-selection.transfer.v3.2
        prompt: A new architecture gets 500 tuning runs and the baseline gets 10. The new one wins by one point. What is the best response?
        options:
          - id: a
            text: Rerun both with the same tuning budget before crediting the design
          - id: b
            text: Credit the design, since it scored higher under the same test
          - id: c
            text: Drop the baseline, since it clearly can't compete anymore
        answer: a
        feedback: With 50 times more tuning, the one-point win could come from effort alone, as the LSTM re-tuning study showed. An equal budget isolates the design.
      - id: evaluation-selection.transfer.v3.3
        prompt: 'Rule: highest accuracy among models that answer within 2 seconds. A: 91% in 3 s. B: 89% in 1 s. C: 88% in 2 s. Which model does the rule pick?'
        options:
          - id: c
            text: A
          - id: a
            text: B
          - id: b
            text: C
        answer: a
        feedback: A fails the 2-second constraint. B and C pass, and B has the higher accuracy among them.
      - id: evaluation-selection.transfer.v3.4
        prompt: After seeing the final test score, a team edits the prompt, retests on the same test set, and gains 3 points. How should they report the new score?
        options:
          - id: b
            text: As an unbiased estimate, since the weights didn't change
          - id: a
            text: As partly selected on the test, to be confirmed on fresh data
          - id: c
            text: As the average of the old and new test scores
        answer: a
        feedback: The test set helped choose the prompt, so it now carries some winner's curse; a prompt change is a model choice just like a weight change. Fresh data gives an honest check.
      - id: evaluation-selection.transfer.v3.5
        prompt: Lecture captions must get at least 80% of technical terms right. X is 91% overall and 76% on technical terms; Y is 88% overall and 83% on technical terms. Which should be chosen?
        options:
          - id: c
            text: X, because its overall accuracy is higher
          - id: b
            text: Neither, until the two overall scores match
          - id: a
            text: Y, because only Y meets the technical-term requirement
        answer: a
        feedback: The technical-term requirement is a constraint, and X fails it however good its average is. Among models that pass, Y is the only one.
  - id: evaluation-selection.calculate
    objective_ref: objective.evaluation-selection
    task: base
    response_type: numeric
    points: 1
    hint: The wobble of an accuracy on n examples is about √(p(1 − p)/n). The best of 50 identical candidates lands about 2.25 wobbles above the true accuracy p.
    remediation_scene: evaluation-selection.s4
    absolute_tolerance: 0.005
    variants:
      - id: evaluation-selection.calculate.1
        prompt: Fifty settings all have true accuracy 0.80, each scored on 400 validation examples. Using wobble √(p(1 − p)/n) and "best of 50 ≈ p + 2.25 wobbles," what best validation score do you expect?
        answer: 0.845
        feedback: √(0.8 × 0.2 / 400) = 0.02, and 0.80 + 2.25 × 0.02 = 0.845.
      - id: evaluation-selection.calculate.2
        prompt: Fifty settings all have true accuracy 0.90, each scored on 900 validation examples. Using wobble √(p(1 − p)/n) and "best of 50 ≈ p + 2.25 wobbles," what best validation score do you expect?
        answer: 0.9225
        feedback: √(0.9 × 0.1 / 900) = 0.01, and 0.90 + 2.25 × 0.01 = 0.9225.
      - id: evaluation-selection.calculate.3
        prompt: Fifty settings all have true accuracy 0.50, each scored on 100 validation examples. Using wobble √(p(1 − p)/n) and "best of 50 ≈ p + 2.25 wobbles," what best validation score do you expect?
        answer: 0.6125
        feedback: √(0.5 × 0.5 / 100) = 0.05, and 0.50 + 2.25 × 0.05 = 0.6125. With small validation sets the curse is huge.
      - id: evaluation-selection.calculate.4
        prompt: Fifty settings all have true accuracy 0.60, each scored on 600 validation examples. Using wobble √(p(1 − p)/n) and "best of 50 ≈ p + 2.25 wobbles," what best validation score do you expect?
        answer: 0.645
        feedback: √(0.6 × 0.4 / 600) = 0.02, and 0.60 + 2.25 × 0.02 = 0.645.
      - id: evaluation-selection.calculate.5
        prompt: Fifty settings all have true accuracy 0.70, each scored on 2,100 validation examples. Using wobble √(p(1 − p)/n) and "best of 50 ≈ p + 2.25 wobbles," what best validation score do you expect?
        answer: 0.7225
