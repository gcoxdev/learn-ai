schema_version: 0.2-draft
lesson:
  id: evaluation-selection
  version: 0.4.0-draft
  title: Evaluate the procedure that chose the model
  state: draft
  summary: Try 50 settings, keep the best, and your score is probably inflated even when nothing improved. Learn to choose a model without fooling yourself, and to measure the whole choosing procedure.
  slot: M09.5
  category: learning
  sources:
    - title: scikit-learn — common evaluation and preprocessing pitfalls
      url: https://scikit-learn.org/stable/common_pitfalls.html
    - title: scikit-learn — nested versus non-nested cross-validation
      url: https://scikit-learn.org/stable/auto_examples/model_selection/plot_nested_cross_validation_iris.html
    - title: "On the State of the Art of Evaluation in Neural Language Models (Melis, Dyer & Blunsom, 2018)"
      url: https://arxiv.org/abs/1707.05589
    - title: "Are GANs Created Equal? A Large-Scale Study (Lucic et al., 2018)"
      url: https://arxiv.org/abs/1711.10337
    - title: Liang et al. — Holistic Evaluation of Language Models
      url: https://arxiv.org/abs/2211.09110
  archetype: mechanism
objectives:
  - id: objective.evaluation-selection
    version: 3-draft
    statement: Apply a stated validation-selection rule with quality and operating constraints while protecting final-test independence.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - evaluation-selection.base.v3
      - evaluation-selection.transfer.v3
      - evaluation-selection.calculate
    prerequisites:
      - anyOf:
          - objective.regularization-and-tuning
      - anyOf:
          - objective.statistics-evidence
scenes:
  - id: evaluation-selection.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.evaluation-selection
    title: The best score depends on the job
    markdown: |-
      A university wants live captions for its lectures. Two speech models are candidates. On 1,000 validation sentences, model A transcribes 90% without error and returns each caption in about one second. Model B gets 92%, but takes eight seconds.

      B has the higher score, and B is useless here: captions that trail the lecturer by eight seconds are unreadable. For captioning recorded videos overnight, B could be the better pick. A **metric** is a number you measure, such as accuracy or response time. A **selection rule** says how those numbers decide the winner, and it comes from the job, not from the scoreboard.
    bridges: []
  - id: evaluation-selection.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.evaluation-selection
    title: Write the rule before you see the scores
    markdown: |-
      The captioning team writes: "Among models that respond within two seconds, choose the highest validation accuracy." The two-second limit is a **constraint**, a condition a candidate must pass. Accuracy is the **objective**, the number you try to improve among candidates that pass.

      A qualifies and B doesn't, so A wins. Writing the rule first matters because it's easy, after seeing the results, to find a reason why the model you like best "really" meets the need ("maybe three seconds is fine?"). Deciding the rule in advance keeps the choice honest.
    bridges: []
  - id: evaluation-selection.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.evaluation-selection
    title: Check the errors behind the average
    markdown: |-
      Before you commit, split the validation errors into groups that matter for the job. Each group is a **slice**:

      | Slice of validation sentences | Model A | Model C |
      | --- | ---: | ---: |
      | Everyday speech | 93% | 92% |
      | Technical terms ("eigenvalue," "mitochondria") | 71% | 84% |
      | All sentences | 90% | 89% |

      One point apart overall, but C is 13 points better on the technical terms that lecture captions exist for. If those matter, make that a requirement in the rule ("at least 80% on technical terms"), rather than hoping the average reflects it. The evaluation module goes deeper into slices.
    bridges: []
  - id: evaluation-selection.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.evaluation-selection
    title: The winner's curse
    markdown: |-
      Now the team tunes model A, trying 50 **hyperparameter** settings (choices fixed before training, such as learning rate or model size) and keeping the one with the best validation score. Suppose, to make the point, that all 50 are truly identical: each would get 80% right on the endless stream of future lectures.

      :::predict With 500 validation sentences, what will the best of the 50 validation scores look like?
      Noticeably above 80%. Each score is 80% plus random luck in which sentences were drawn, and picking the maximum picks the luckiest. The program shows it.
      :::

      ```python run
      import numpy as np

      rng = np.random.default_rng(1)
      true_acc = 0.80          # every configuration is truly 80% accurate
      n_configs = 50           # hyperparameter settings tried
      n_val, n_test = 500, 500 # validation and test sentences

      val = rng.binomial(n_val, true_acc, n_configs) / n_val
      best = val.argmax()
      test = rng.binomial(n_test, true_acc) / n_test

      print(f"median validation score: {np.median(val):.3f}")
      print(f"best validation score:   {val[best]:.3f}  (config {best})")
      print(f"that config on the test: {test:.3f}")

      # Repeat the whole search 1,000 times to see the average optimism
      bests = rng.binomial(n_val, true_acc, (1000, n_configs)).max(axis=1) / n_val
      print(f"average best-of-{n_configs}:     {bests.mean():.3f}")
      ```

      The winning setting scores 0.840 on validation and 0.800 on fresh test sentences: four points of pure luck. This is the **winner's curse**, and its size is predictable. A score on 500 sentences wobbles by about $\sqrt{0.8 \times 0.2 / 500} \approx 0.018$, and the best of 50 draws typically lands about 2.25 of those wobbles above the true value: 0.80 + 0.04 = 0.84, just what the program found.

      So the validation score of a chosen model is no longer an honest estimate. That's why the final **test set** is used once, after every choice is made. Try `n_configs = 500` to see the curse grow, or `n_val = 5000` to see it shrink.

      :::story Kaggle's shake-up
      Kaggle competitions show a public leaderboard scored on part of the hidden test data, and they rank the final results on a separate private part. Teams that submit hundreds of tweaks and keep whatever climbs the public board often fall sharply when the private scores are revealed. Competitors call it the shake-up, and it is the winner's curse at scale.
      :::
    bridges: []
  - id: evaluation-selection.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.evaluation-selection
    title: Give every candidate the same tuning budget
    markdown: |-
      Tuning is part of the method. If your new model gets 200 tuning runs and the old one gets 5, the comparison mostly measures effort.

      :::story Old models, tuned properly
      In 2018, Gábor Melis, Chris Dyer, and Phil Blunsom re-tuned several language-model architectures with a large, automated hyperparameter search. A standard LSTM, carefully tuned, outperformed several newer and more complicated designs that had been reported as improvements over it. The same year, Mario Lucic and colleagues ran a similar large-scale study of GANs and found no clear evidence that the newer variants beat the original once all were given enough tuning.
      :::

      So give each candidate the same search budget, report that budget, and include a simple **baseline** (a basic method that sets the bar, like the current captioning system). If the fancy model can't beat a well-tuned simple one, you've learned something useful.
    bridges: []
  - id: evaluation-selection.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.evaluation-selection
    title: Nested evaluation measures the choosing too
    markdown: |-
      With little data, you can't afford a large untouched test set, and you still want an honest score. Recall **cross-validation** from the regularization lesson: it rotates which part of the data is held out. **Nested cross-validation** puts one cross-validation inside another, so it scores the whole procedure, "try 10 settings and keep the best," instead of one lucky winner.

      1. **Outer loop:** split the data into 5 folds. Hold one out as a test fold.
      2. **Inner loop:** on the other 4 folds, run ordinary cross-validation (here, 4 inner folds) to pick the best of the 10 settings.
      3. Retrain that setting on all 4 folds and score it once on the held-out outer fold.
      4. Repeat for each outer fold and average the 5 scores.

      The outer test fold never influences which setting wins, so the average is an honest estimate of how well "tune, then train" works. The cost is compute: each outer fold needs 4 inner folds × 10 settings = 40 fits, plus 1 refit, so 5 × 41 = 205 fits in all.

      The five outer folds may pick different settings. That's fine: you are measuring the procedure. To ship, run the inner search once on all the data and train the winner.
    diagram:
      caption: The outer fold is scored only after the inner search has finished.
      description: The full dataset is split into outer folds. For each outer split, the training folds go to an inner cross-validation search, which picks the best setting. That setting is retrained on the training folds and scored once on the held-out outer fold. The outer scores from all five folds are averaged into an honest estimate.
      nodes:
        - id: data
          label: All labeled data
          col: 0
          row: 1
          tone: data
        - id: train
          label: 4 outer training folds
          col: 1
          row: 0
          tone: data
        - id: hold
          label: 1 held-out outer fold
          note: untouched during search
          col: 1
          row: 2
          tone: warn
        - id: inner
          label: Inner cross-validation
          note: pick best of 10 settings
          col: 2
          row: 0
          tone: accent
        - id: refit
          label: Retrain the winner
          col: 3
          row: 0
        - id: score
          label: Score once
          col: 3
          row: 2
        - id: avg
          label: Average of 5 outer scores
          note: honest estimate of the procedure
          col: 4
          row: 1
          tone: accent
      edges:
        - from: data
          to: train
          label: split
        - from: data
          to: hold
          label: split
        - from: train
          to: inner
        - from: inner
          to: refit
        - from: refit
          to: score
        - from: hold
          to: score
        - from: score
          to: avg
          label: repeat for each fold
    bridges: []
  - id: evaluation-selection.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.evaluation-selection
    markdown: Leaderboards, checkpoint picks, unequal tuning budgets, and a latency limit ask you to apply a selection rule and spot a score inflated by choosing.
    takeaway: |-
      Write the selection rule before looking, choose on validation data, and remember that the winner's validation score is flattered by the choosing. An untouched test set, or nested cross-validation, measures what you'll actually get.
  - id: evaluation-selection.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.evaluation-selection
    markdown: |-
      Hyperparameter search and repeated evaluation can exploit noise; nested or reserved evaluation separates selection from evidence about the selected procedure.
  - id: evaluation-selection.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.evaluation-selection
    title: Pick under the stated rule
    markdown: |-
      Three new captioning models arrive. The rule is still "highest accuracy among models that respond within two seconds." A: 90% accuracy, 1 second. B: 94%, 4 seconds. C: 89%, 1.5 seconds. Which one wins?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: A
        - id: b
          text: B
        - id: c
          text: C
      answer: a
      reveal_markdown: |-
        A and C both respond within two seconds; of those two, A is more accurate. B is the most accurate overall, but at 4 seconds it breaks the rule, so it can't win.
      hint: Apply the two-second limit first, then compare accuracy among the models that pass.
      id: evaluation-selection.practice.v2.7
