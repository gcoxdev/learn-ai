schema_version: 0.2-draft
lesson:
  id: evaluation-selection
  version: 0.3.0-draft
  title: Evaluate the procedure that chose the model
  state: draft
  summary: Choose a model for a real job, not just the largest number on a scoreboard.
  slot: M09.5
  category: learning
  sources:
  - title: scikit-learn — common evaluation and preprocessing pitfalls
    url: https://scikit-learn.org/stable/common_pitfalls.html
  - title: Liang et al. — Holistic Evaluation of Language Models
    url: https://arxiv.org/abs/2211.09110
  archetype: mechanism
objectives:
- id: objective.evaluation-selection
  version: 2-draft
  statement: Apply a stated validation-selection rule with quality and operating constraints while protecting
    final-test independence.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - evaluation-selection.base.v2
  - evaluation-selection.transfer.v2
  prerequisites:
  - anyOf:
    - objective.regularization-and-tuning
  - anyOf:
    - objective.statistics-evidence
scenes:
- id: evaluation-selection.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.evaluation-selection
  title: The best score depends on the job
  markdown: Two library assistants answer questions. A gets 90 of 100 validation cases correct and responds
    in one second. B gets 92 correct but takes eight seconds. Which is better? We cannot decide until we know
    the task. A **metric** is a numerical measurement, such as correctness rate or response time. A **selection
    rule** says how those measurements determine the choice. A system for a live conversation may have a response-time
    limit that a background indexing job does not.
  text_mode: Two library assistants answer questions. A gets 90 of 100 validation cases correct and responds
    in one second. B gets 92 correct but takes eight seconds. Which is better? We cannot decide until we know
    the task. A **metric** is a numerical measurement, such as correctness rate or response time. A **selection
    rule** says how those measurements determine the choice. A system for a live conversation may have a response-time
    limit that a background indexing job does not.
  bridges: []
- id: evaluation-selection.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.evaluation-selection
  title: Write the rule before choosing the winner
  markdown: Suppose the rule is “among candidates with average response time at most two seconds, choose the
    highest validation correctness.” A qualifies and B does not, so A is selected. This is not a claim that
    A is universally better. It follows the stated constraint. A latency **constraint** is a condition a candidate
    must satisfy; an optimization **objective** is what we try to improve among allowed candidates. Recording
    both prevents moving the goalposts after seeing attractive results.
  text_mode: Suppose the rule is “among candidates with average response time at most two seconds, choose the
    highest validation correctness.” A qualifies and B does not, so A is selected. This is not a claim that
    A is universally better. It follows the stated constraint. A latency **constraint** is a condition a candidate
    must satisfy; an optimization **objective** is what we try to improve among allowed candidates. Recording
    both prevents moving the goalposts after seeing attractive results.
  bridges: []
- id: evaluation-selection.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.evaluation-selection
  title: Check the errors behind the average
  markdown: A 90% correctness rate can hide different mistakes. One system may fail harmless spelling questions;
    another may confidently invent opening hours when no schedule was supplied. A **slice** is a defined subset,
    such as missing-information cases or questions in a particular language. Compare errors by relevant slices
    and severity. A single weighted average can conceal a requirement that should instead be treated as a separate
    condition. Define those requirements with the intended users and task in mind.
  text_mode: A 90% correctness rate can hide different mistakes. One system may fail harmless spelling questions;
    another may confidently invent opening hours when no schedule was supplied. A **slice** is a defined subset,
    such as missing-information cases or questions in a particular language. Compare errors by relevant slices
    and severity. A single weighted average can conceal a requirement that should instead be treated as a separate
    condition. Define those requirements with the intended users and task in mind.
  bridges: []
- id: evaluation-selection.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.evaluation-selection
  title: Choose on validation and report on fresh evidence
  markdown: Use training data to fit candidates and validation data for repeated selection. Once the choice
    and decision rules are fixed, use the protected test to estimate its performance. If the test result triggers
    new changes, acknowledge that it has informed development and plan an appropriate fresh evaluation. **Selection
    bias** can arise when many candidates are tried and only the lucky winner’s score is reported. Record the
    search procedure and number of comparisons, not just the final name.
  text_mode: Use training data to fit candidates and validation data for repeated selection. Once the choice
    and decision rules are fixed, use the protected test to estimate its performance. If the test result triggers
    new changes, acknowledge that it has informed development and plan an appropriate fresh evaluation. **Selection
    bias** can arise when many candidates are tried and only the lucky winner’s score is reported. Record the
    search procedure and number of comparisons, not just the final name.
  bridges: []
- id: evaluation-selection.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.evaluation-selection
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Define the job, set the decision rule, compare fairly, and keep the final test protected. The winning
    metric must match the promised use.
- id: evaluation-selection.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.evaluation-selection
  markdown: Hyperparameter search and repeated evaluation can exploit noise; nested or reserved evaluation
    separates selection from evidence about the selected procedure.
  text_mode: Hyperparameter search and repeated evaluation can exploit noise; nested or reserved evaluation
    separates selection from evidence about the selected procedure.
- id: evaluation-selection.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.evaluation-selection
  title: Compare under matching conditions
  markdown: 'Use the same evaluation cases, scoring rubric, allowed context, and relevant resource limits.
    If one candidate receives a retrieved document and another does not, the comparison is about different
    systems, not only different model weights. Include a simple **baseline**, such as keyword lookup or the
    current workflow, to reveal whether added complexity helps. Measurement uncertainty matters: a difference
    of one answer on a small test may reverse on another sample. Inspect paired errors rather than treating
    a tiny lead as conclusive.'
  text_mode: 'Use the same evaluation cases, scoring rubric, allowed context, and relevant resource limits.
    If one candidate receives a retrieved document and another does not, the comparison is about different
    systems, not only different model weights. Include a simple **baseline**, such as keyword lookup or the
    current workflow, to reveal whether added complexity helps. Measurement uncertainty matters: a difference
    of one answer on a small test may reverse on another sample. Inspect paired errors rather than treating
    a tiny lead as conclusive.'
  bridges: []
- id: evaluation-selection.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.evaluation-selection
  title: Keep a decision card
  markdown: Write the intended task, candidates, data partitions, success metric, constraints, slice results,
    and unresolved limitations. Explain why the selected candidate fits that decision rule. A colleague should
    be able to reproduce the choice from the card without knowing your favorite model name. This habit transfers
    to image generators, speech systems, and robots. The memory cue “job, rule, comparison, evidence” keeps
    model selection connected to the purpose of the system.
  text_mode: Write the intended task, candidates, data partitions, success metric, constraints, slice results,
    and unresolved limitations. Explain why the selected candidate fits that decision rule. A colleague should
    be able to reproduce the choice from the card without knowing your favorite model name. This habit transfers
    to image generators, speech systems, and robots. The memory cue “job, rule, comparison, evidence” keeps
    model selection connected to the purpose of the system.
  bridges: []
- id: evaluation-selection.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.evaluation-selection
  title: Pick under the stated rule
  markdown: 'Choose the most accurate candidate with latency at most two seconds: A=90%, 1 second; B=94%, 4
    seconds; C=89%, 1.5 seconds. Which qualifies and wins?'
  text_mode: 'Choose the most accurate candidate with latency at most two seconds: A=90%, 1 second; B=94%,
    4 seconds; C=89%, 1.5 seconds. Which qualifies and wins?'
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: A
    - id: b
      text: B
    - id: c
      text: C
    answer: a
    reveal_markdown: A and C meet the latency limit; A has higher accuracy among those candidates. B’s higher
      accuracy does not satisfy the stated constraint.
    hint: Trace the example using the rule from the preceding pages.
    id: evaluation-selection.practice.v2.7
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - evaluation-selection.s1
    - evaluation-selection.s2
    - evaluation-selection.s3
    - evaluation-selection.s4
    - evaluation-selection.s5
    - evaluation-selection.s6
    - evaluation-selection.s7
    - evaluation-selection.check
    gate_refs:
    - gate.core
  scene_aliases:
    evaluation-selection.recap: evaluation-selection.check
assessment_families:
- id: evaluation-selection.base
  objective_ref: objective.evaluation-selection
  task: base
  response_type: single_choice
  points: 1
  hint: 'Keep inner and outer decisions separate: trace the inputs, operation, and result before choosing.'
  remediation_scene: evaluation-selection.s2
  variants:
  - id: evaluation-selection.base.1
    prompt: Why can the highest of many noisy validation scores be optimistic?
    options:
    - id: b
      text: The metric stops using arithmetic
    - id: c
      text: All candidates become identical after selection
    - id: a
      text: Selection favors positive noise as well as real quality
    answer: a
    feedback: The maximum observed value reflects a winner’s-curse effect.
    retired: true
  - id: evaluation-selection.base.2
    prompt: What does the outer loop in nested evaluation estimate?
    options:
    - id: c
      text: The number of source files
    - id: a
      text: Performance of the inner selection procedure on held-out data
    - id: b
      text: Only training loss of every candidate
    answer: a
    feedback: The outer holdout is not used to make inner choices.
    retired: true
- id: evaluation-selection.transfer
  objective_ref: objective.evaluation-selection
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Record the search budget: trace the inputs, operation, and result before choosing.'
  remediation_scene: evaluation-selection.s4
  variants:
  - id: evaluation-selection.transfer.1
    prompt: Is choosing the best checkpoint using validation a selection step?
    options:
    - id: c
      text: Only if training used a GPU
    - id: a
      text: 'Yes'
    - id: b
      text: No, because the architecture is unchanged
    answer: a
    feedback: Checkpoint choice uses feedback to select a model state.
    retired: true
  - id: evaluation-selection.transfer.2
    prompt: One method gets 500 tuning trials and another gets 5. What should a comparison disclose?
    options:
    - id: a
      text: The unequal selection budgets
    - id: b
      text: Only the best scores
    - id: c
      text: Only model names
    answer: a
    feedback: Tuning effort is an experimental condition affecting the result.
    retired: true
- id: evaluation-selection.base.v2
  objective_ref: objective.evaluation-selection
  task: base
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: evaluation-selection.s3
  variants:
  - prompt: Which should be specified before selecting a model?
    answer: a
    options:
    - id: a
      text: The task, success metric, and operating constraints
    - id: b
      text: Only the largest reported benchmark score
    - id: c
      text: Only the model with the most parameters
    feedback: Selection needs a task-specific rule, not a prestige proxy.
    id: evaluation-selection.base.v2.1
  - prompt: A candidate must respond within two seconds. What role does that requirement play?
    answer: a
    options:
    - id: c
      text: A tokenization rule
    - id: a
      text: An operating constraint
    - id: b
      text: A training-example label
    feedback: A constraint limits eligible candidates under the stated decision policy.
    id: evaluation-selection.base.v2.2
  - prompt: Why inspect error slices as well as overall accuracy?
    answer: a
    options:
    - id: b
      text: Every slice must contain equally many examples
    - id: a
      text: Different groups or failure types may be hidden by the average
    - id: c
      text: Slicing replaces the need for representative data
    feedback: Subgroup measurements can reveal important failures concealed by aggregation.
    id: evaluation-selection.base.v2.3
  - prompt: Which partition is intended for repeated candidate comparison during development?
    answer: a
    options:
    - id: b
      text: A protected final test used as often as needed
    - id: c
      text: The production incident log treated as a complete test
    - id: a
      text: Validation
    feedback: Validation supports selection; final testing has a different job.
    id: evaluation-selection.base.v2.4
- id: evaluation-selection.transfer.v2
  objective_ref: objective.evaluation-selection
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: evaluation-selection.s3
  variants:
  - prompt: A=91% at 3 seconds; B=89% at 1 second; C=88% at 2 seconds. Choose the highest accuracy among candidates
      at most 2 seconds.
    answer: a
    options:
    - id: b
      text: A
    - id: a
      text: B
    - id: c
      text: C
    feedback: B and C qualify; B has the higher accuracy among them.
    id: evaluation-selection.transfer.v2.1
  - prompt: One model is given retrieved evidence and another receives only the question. What does their comparison
      measure?
    answer: a
    options:
    - id: b
      text: Only a controlled difference in model weights
    - id: c
      text: Only their tokenizer vocabulary sizes
    - id: a
      text: The two differently configured systems
    feedback: Input and tool differences are part of the system being compared.
    id: evaluation-selection.transfer.v2.2
  - prompt: A team tries 100 variants and reports only the best validation result. What context is missing?
    answer: a
    options:
    - id: a
      text: The selection process and uncertainty from repeated comparisons
    - id: b
      text: The most attractive model name
    - id: c
      text: The final score’s rounding convention alone
    feedback: Selecting among many noisy results can favor a lucky estimate.
    id: evaluation-selection.transfer.v2.3
  - prompt: A final-test result is used to redesign the prompt. What must the team acknowledge?
    answer: a
    options:
    - id: b
      text: The test stays independent because the weights did not change
    - id: c
      text: The test can now be relabeled as training without explanation
    - id: a
      text: The test informed development and is no longer untouched for that choice
    feedback: System selection includes prompt changes as well as parameter updates.
    id: evaluation-selection.transfer.v2.4
