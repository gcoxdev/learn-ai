schema_version: 0.2-draft
lesson:
  id: evaluation-selection
  version: 0.1.0-draft
  title: Evaluate the procedure that chose the model
  state: draft
  summary: Hyperparameter search and repeated evaluation can exploit noise; nested or reserved evaluation separates
    selection from evidence about the selected procedure.
  slot: M09.5
  category: learning
  minutes: 12
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.evaluation-selection
  version: 1-draft
  statement: Hyperparameter search and repeated evaluation can exploit noise; nested or reserved evaluation separates
    selection from evidence about the selected procedure.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - evaluation-selection.base
  - evaluation-selection.transfer
  prerequisites:
  - anyOf:
    - objective.regularization-and-tuning
  - anyOf:
    - objective.statistics-evidence
scenes:
- id: evaluation-selection.s1
  title: Selection changes the meaning of a score
  type: explanation
  depth: intuition
  objective_refs:
  - objective.evaluation-selection
  markdown: Suppose twenty equally capable models are tested on a small noisy validation set. Some will score higher
    by chance. Selecting the highest observed score makes that score an optimistic estimate of the winner’s typical
    performance. The search procedure is part of what should be evaluated.
  text_mode: Suppose twenty equally capable models are tested on a small noisy validation set. Some will score higher
    by chance. Selecting the highest observed score makes that score an optimistic estimate of the winner’s typical
    performance. The search procedure is part of what should be evaluated.
  bridges: []
- id: evaluation-selection.s2
  title: Keep inner and outer decisions separate
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.evaluation-selection
  markdown: An inner loop chooses preprocessing, hyperparameters, or architecture using training and validation
    partitions. An outer held-out partition estimates the resulting procedure’s performance. In nested cross-validation,
    this arrangement is repeated across outer folds. Grouping and time constraints must be preserved at both levels.
  text_mode: An inner loop chooses preprocessing, hyperparameters, or architecture using training and validation
    partitions. An outer held-out partition estimates the resulting procedure’s performance. In nested cross-validation,
    this arrangement is repeated across outer folds. Grouping and time constraints must be preserved at both levels.
  bridges: []
- id: evaluation-selection.s3
  title: Treat early stopping as selection
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.evaluation-selection
  markdown: Choosing a checkpoint because validation improves is a form of model selection. Looking at the same
    validation set across many checkpoints can exploit fluctuations. The remedy is not to avoid all feedback, but
    to maintain an honest final evaluation boundary and report how much selection occurred.
  text_mode: Choosing a checkpoint because validation improves is a form of model selection. Looking at the same
    validation set across many checkpoints can exploit fluctuations. The remedy is not to avoid all feedback, but
    to maintain an honest final evaluation boundary and report how much selection occurred.
  bridges: []
- id: evaluation-selection.s4
  title: Record the search budget
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.evaluation-selection
  markdown: Compare tuning ranges, trial counts, seeds, and failed runs alongside the chosen model. A method given
    a thousand trials has more opportunity to find a favorable setting than one given five. Report uncertainty across
    the relevant repeated procedure rather than only a single best checkpoint.
  text_mode: Compare tuning ranges, trial counts, seeds, and failed runs alongside the chosen model. A method given
    a thousand trials has more opportunity to find a favorable setting than one given five. Report uncertainty across
    the relevant repeated procedure rather than only a single best checkpoint.
  bridges: []
- id: evaluation-selection.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.evaluation-selection
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Hyperparameter search and repeated evaluation can exploit noise; nested or reserved evaluation separates
    selection from evidence about the selected procedure.
- id: evaluation-selection.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.evaluation-selection
  markdown: Hyperparameter search and repeated evaluation can exploit noise; nested or reserved evaluation separates
    selection from evidence about the selected procedure.
  text_mode: Hyperparameter search and repeated evaluation can exploit noise; nested or reserved evaluation separates
    selection from evidence about the selected procedure.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - evaluation-selection.s1
    - evaluation-selection.s2
    - evaluation-selection.s3
    - evaluation-selection.s4
    - evaluation-selection.check
    gate_refs:
    - gate.core
  scene_aliases:
    evaluation-selection.recap: evaluation-selection.check
assessment_families:
- id: evaluation-selection.base
  objective_ref: objective.evaluation-selection
  task: base
  response_type: single_choice
  points: 1
  hint: 'Keep inner and outer decisions separate: trace the inputs, operation, and result before choosing.'
  remediation_scene: evaluation-selection.s2
  variants:
  - id: evaluation-selection.base.1
    prompt: Why can the highest of many noisy validation scores be optimistic?
    options:
    - id: b
      text: The metric stops using arithmetic
    - id: c
      text: All candidates become identical after selection
    - id: a
      text: Selection favors positive noise as well as real quality
    answer: a
    feedback: The maximum observed value reflects a winner’s-curse effect.
  - id: evaluation-selection.base.2
    prompt: What does the outer loop in nested evaluation estimate?
    options:
    - id: c
      text: The number of source files
    - id: a
      text: Performance of the inner selection procedure on held-out data
    - id: b
      text: Only training loss of every candidate
    answer: a
    feedback: The outer holdout is not used to make inner choices.
- id: evaluation-selection.transfer
  objective_ref: objective.evaluation-selection
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Record the search budget: trace the inputs, operation, and result before choosing.'
  remediation_scene: evaluation-selection.s4
  variants:
  - id: evaluation-selection.transfer.1
    prompt: Is choosing the best checkpoint using validation a selection step?
    options:
    - id: c
      text: Only if training used a GPU
    - id: a
      text: 'Yes'
    - id: b
      text: No, because the architecture is unchanged
    answer: a
    feedback: Checkpoint choice uses feedback to select a model state.
  - id: evaluation-selection.transfer.2
    prompt: One method gets 500 tuning trials and another gets 5. What should a comparison disclose?
    options:
    - id: a
      text: The unequal selection budgets
    - id: b
      text: Only the best scores
    - id: c
      text: Only model names
    answer: a
    feedback: Tuning effort is an experimental condition affecting the result.
