  - id: prediction.transfer.v2
    objective_ref: objective.prediction
    task: transfer
    response_type: single_choice
    points: 1
    hint: Write the operation and the intermediate values before choosing the final answer.
    remediation_scene: prediction.s3
    variants:
      - id: prediction.transfer.v2.1
        prompt: A trip rule adds 4 minutes even at zero distance. What is that 4?
        answer: a
        feedback: The constant offset shifts the output independently of distance.
        options:
          - id: c
            text: The observed target
          - id: a
            text: An intercept or bias
          - id: b
            text: The distance input
        retired: true
      - id: prediction.transfer.v2.2
        prompt: Predictions 4 and 8 are compared with target 6 using squared error. Which relation holds?
        answer: a
        feedback: The residuals differ in sign but have the same square.
        options:
          - id: a
            text: Both losses are 4
          - id: b
            text: Both residuals are 2
          - id: c
            text: The lower prediction has lower loss
        retired: true
      - id: prediction.transfer.v2.3
        prompt: You change the weight but keep the trip distance fixed. Which role changed?
        answer: a
        feedback: The weight belongs to the rule, not the current observation.
        options:
          - id: b
            text: The example’s recorded input
          - id: c
            text: The example’s observed answer
          - id: a
            text: A setting of the prediction rule
        retired: true
      - id: prediction.transfer.v2.4
        prompt: Absolute error and squared error penalize large misses differently. Why?
        answer: a
        feedback: 'Both rank individual miss magnitudes in the same order. Squaring increases the relative penalty on a large miss: misses of 2 and 4 cost 2 and 4 under absolute error, but 4 and 16 under squared error.'
        options:
          - id: c
            text: They rewrite the observed target values
          - id: a
            text: They score the mismatch with different rules
          - id: b
            text: They use different definitions of an input
        retired: true
  - id: prediction.transfer.v3
    objective_ref: objective.prediction
    task: transfer
    response_type: single_choice
    points: 1
    hint: Keep the rule (weights and intercept) separate from its misses. Square each residual before you average, and ask which number a change in the data actually moves.
    remediation_scene: prediction.s5
    variants:
      - id: prediction.transfer.v3.1
        prompt: 'A bike shop scores two lines on the same four days. Line A misses by +1, −1, +1, −1 rentals; Line B misses by 0, 0, 0, +4. Using mean squared error, which line fits better?'
        options:
          - id: a
            text: Line B, since three of its four days are exactly right
          - id: c
            text: Neither; each misses by a total of 4 rentals
          - id: b
            text: Line A, with an MSE of 1 against B's 4
        answer: b
        feedback: 'Square, then average: A gives (1 + 1 + 1 + 1)/4 = 1, and B gives 16/4 = 4. The tie in total absolute miss is real, but it is the MAE view; squaring makes B''s single miss of 4 cost as much as sixteen misses of 1.'
      - id: prediction.transfer.v3.2
        prompt: A tutoring company fits test score against hours studied by least squares. One student's score of 90 was typed in as 9. What happens to the fitted line?
        options:
          - id: a
            text: The intercept moves but the slope stays where it was
          - id: c
            text: That row tilts the line toward it; its squared miss is huge
          - id: b
            text: Little changes, because one row is a small share of the data
        answer: c
        feedback: A miss of about 80 points squares to about 6,400, so least squares tilts and shifts the line a long way to shrink it. One row is a small share of the rows but can be a large share of the squared error, and unless that student sits right at the average number of hours, the typo changes the slope as well as the level.
      - id: prediction.transfer.v3.3
        prompt: A model predicts a home's daily heating cost from outdoor temperature in °C, with a fitted weight of −4 cents per degree. The team refits it with temperature in °F. What should they expect?
        options:
          - id: b
            text: The weight stays −4, since the relationship hasn't changed
          - id: a
            text: It becomes about −2.2 per °F, with the same predictions
          - id: c
            text: The weight grows to about −7.2, since °F numbers are larger
        answer: a
        feedback: One °C equals 1.8 °F, so each °F is a smaller step and gets a smaller weight, −4 ÷ 1.8 ≈ −2.2, giving the same predictions. Multiplying by 1.8 instead is the tempting slip; it would make the same temperature change cost almost twice as much.
      - id: prediction.transfer.v3.4
        prompt: A gym's least-squares line is sign-ups = 1.5 × ads shown + 20. Next month, every day gets exactly 5 extra walk-in sign-ups, whatever the ads. After refitting, what changes?
        options:
          - id: a
            text: Both rise by 5, to a weight of 6.5 and an intercept of 25
          - id: b
            text: The weight rises, because more sign-ups come with each day
          - id: c
            text: The intercept rises to 25 and the weight stays 1.5
        answer: c
        feedback: Adding the same amount to every target leaves each target's distance from the average unchanged, so the slope is still 1.5; only the level moves, to 20 + 5 = 25. The weight would change only if the extra sign-ups grew with the number of ads.
      - id: prediction.transfer.v3.5
        prompt: A colleague fits a line with an intercept to five days of sales and reports residuals of +3, +1, +4, +2, +2. What do these residuals tell you?
        options:
          - id: b
            text: It's not the least-squares line; shifting it down 2.4 helps
          - id: a
            text: The fit is good, since the misses are small and share a sign
          - id: c
            text: The weight is too large, because the predictions run too high
        answer: b
        feedback: With an intercept, least-squares residuals add to zero. These add to 12, an average overshoot of 2.4, so moving the whole line down by 2.4 cuts the MSE. A too-large weight would overshoot more at one end than the other, not by a similar amount everywhere.
