scenes:
  - id: prediction.s1
    title: Forty cups or seventy?
    type: explanation
    depth: intuition
    objective_refs:
      - objective.prediction
    markdown: |-
      Lena runs a coffee truck. Each morning she guesses how much cold brew to make; leftovers get poured away. Today's forecast says 30 °C. How many cups? Her notebook:

      | Day's high (°C) | Cups sold |
      | ---: | ---: |
      | 20 | 45 |
      | 25 | 57 |
      | 30 | 61 |
      | 35 | 77 |

      Hotter days sell roughly 2 extra cups per degree. As a rule:

      $$\text{cups} = 2 \times \text{temperature} + 5$$

      Temperature is the **feature** (the input) and cups sold is the **target** (the answer to predict). The 2 is a **weight** that multiplies the feature, as in the weights lesson, and the 5 is the **intercept** (or bias), a fixed amount added whatever the input. For 30 °C the rule predicts 2 × 30 + 5 = 65 cups.

      Predicting a number with a weighted sum plus an intercept is **linear regression**. Papers write $\hat{y} = wx + b$, where the hat on $\hat{y}$ marks a prediction and plain $y$ is the true target.
    bridges: []
  - id: prediction.s2
    title: Add a second clue
    type: explanation
    depth: intuition
    objective_refs:
      - objective.prediction
    markdown: |-
      Weekends sell more at every temperature, so Lena adds a second feature, *weekend*: 1 on Saturday and Sunday, 0 otherwise.

      $$\text{cups} = 2 \times \text{temperature} + 12 \times \text{weekend} + 5$$

      For a 30 °C Saturday the pieces are 2 × 30 = 60, plus 12 × 1 = 12, plus 5: 77 cups. Each weight scales its own feature, and the pieces add. With many features, papers write $\hat{y} = \mathbf{w}^\top \mathbf{x} + b$, the dot product from the vectors lesson: multiply matching entries and add.

      :::mixup "The weekend weight (12) is bigger than the temperature weight (2), so weekends matter more."
      A weight's size depends on units. Temperature spans 15 degrees in the notebook, moving the prediction by up to 2 × 15 = 30 cups, against 12 for weekends. Switch to °F and the weight shrinks to about 1.1 (2 ÷ 1.8) though nothing about coffee changed.
      :::
    bridges:
      - arithmetic
      - functions
  - id: prediction.s3
    title: Keep the signed miss
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.prediction
    markdown: |-
      Test the rule on the notebook. Each day's **residual** here is prediction minus target, $\hat{y} - y$: positive means too high, negative too low.

      | °C | Sold $y$ | Predicted $\hat{y}$ | Residual $\hat{y} - y$ |
      | ---: | ---: | ---: | ---: |
      | 20 | 45 | 45 | 0 |
      | 25 | 57 | 55 | −2 |
      | 30 | 61 | 65 | +4 |
      | 35 | 77 | 75 | −2 |

      The signs carry information: the rule overshot the 30 °C day by 4 cups (rain at lunch?). Statistics books often subtract the other way, target minus prediction; squaring later gives the same loss either way.

      Notice that the residuals add up to 0 − 2 + 4 − 2 = 0. The rule overshoots exactly as much as it undershoots. That fact returns when we find the best line.
    diagram:
      caption: From a feature to one number that scores the whole rule.
      description: The feature (temperature) goes into the model, w times x plus b, which outputs a prediction. The prediction and the recorded target both go to a subtraction step that gives the residual. The residuals are squared and averaged to give the mean squared error.
      nodes:
        - id: feature
          label: Feature x
          note: 30 °C
          col: 0
          row: 0
          tone: data
        - id: model
          label: Model w·x + b
          note: 2 × 30 + 5
          col: 1
          row: 0
          tone: accent
        - id: pred
          label: Prediction ŷ
          note: 65 cups
          col: 2
          row: 0
        - id: target
          label: Target y
          note: 61 cups sold
          col: 2
          row: 1
          tone: data
        - id: residual
          label: Residual ŷ − y
          note: "+4"
          col: 3
          row: 0
        - id: mse
          label: Square and average
          note: MSE over all days
          col: 4
          row: 0
          tone: warn
      edges:
        - from: feature
          to: model
        - from: model
          to: pred
        - from: pred
          to: residual
        - from: target
          to: residual
          label: subtract
        - from: residual
          to: mse
  - id: prediction.s4
    title: Square the misses, then average
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.prediction
    markdown: |-
      To compare rules you need one number for how wrong a rule is overall: a **loss**. Adding residuals fails, since +4, −2, and −2 cancel to zero. So square them first (0, 4, 16, 4) and average, giving the **mean squared error (MSE)**:

      $$\text{MSE} = \frac{1}{n}\sum_{i=1}^{n} (\hat{y}_i - y_i)^2 = \frac{0 + 4 + 16 + 4}{4} = 6$$

      Here $n = 4$ days. The square root, about 2.4 cups, is a typical miss in the original units.

      :::predict Which day contributes most to this MSE, and how much of it?
      The 30 °C day: its miss of 4 squares to 16, two-thirds of the total of 24, though it's only twice the other misses. Squaring makes big misses count far more.
      :::

      Squaring is a choice. The **mean absolute error (MAE)** averages the miss sizes instead: (0 + 2 + 4 + 2) / 4 = 2. MAE counts a miss of 4 as twice as bad as a miss of 2; MSE, four times as bad. Pick the one that matches what misses really cost.
  - id: prediction.s5
    title: Find the line that misses least
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.prediction
    markdown: |-
      Is Lena's rule the best line or a decent guess? **Least squares** picks the weight and intercept with the smallest possible MSE. For one feature:

      1. Average inputs and targets: $\bar{x} = 27.5$ °C, $\bar{y} = 60$ cups.
      2. Subtract the averages: temperatures become −7.5, −2.5, 2.5, 7.5; sales become −15, −3, 1, 17.
      3. Divide the sum of paired products by the sum of squared temperature differences:
         $$w = \frac{\sum_i (x_i - \bar{x})(y_i - \bar{y})}{\sum_i (x_i - \bar{x})^2} = \frac{112.5 + 7.5 + 2.5 + 127.5}{56.25 + 6.25 + 6.25 + 56.25} = \frac{250}{125} = 2$$
      4. Pass the line through the averages: $b = \bar{y} - w\bar{x} = 60 - 2 \times 27.5 = 5$.

      Lena's rule *was* the least-squares line: no straight line scores below MSE 6 here.

      :::predict A street festival adds exactly 10 cups to every day's sales. What happens to the weight and the intercept?
      The differences from the average don't change, so the weight stays 2. The intercept absorbs the shift: $b = 70 - 2 \times 27.5 = 15$. The weight sets the slope; the intercept sets the level.
      :::

      The same calculation in code, checked by a second method:

      ```python run
      import numpy as np

      temp = np.array([20, 25, 30, 35])   # day's high, in °C
      cups = np.array([45, 57, 61, 77])   # cold brews sold

      # Least squares for one feature
      dx = temp - temp.mean()
      dy = cups - cups.mean()
      w = (dx * dy).sum() / (dx ** 2).sum()
      b = cups.mean() - w * temp.mean()
      pred = w * temp + b
      res = pred - cups
      print(f"w = {w:.2f}  b = {b:.2f}")
      print("predictions:", pred)
      print("residuals:  ", res)
      print("MSE:", (res ** 2).mean())

      # The same line from the normal equation (X has a column of 1s for b)
      X = np.column_stack([temp, np.ones(4)])
      print("normal equation [w, b]:", np.linalg.solve(X.T @ X, X.T @ cups))
      ```

      Change the last sale from 77 to 85 and rerun. One busy day tilts the whole line: the weight jumps to 2.48 and the intercept drops to −6.2. Squared misses make least squares bend a long way to avoid one big one.

      :::papers The normal equations
      Put one example per row in a matrix $X$ (plus a column of 1s for the intercept) and the targets in $\mathbf{y}$. The least-squares weights solve

      $$X^\top X\,\mathbf{w} = X^\top \mathbf{y}, \qquad \text{so} \qquad \mathbf{w} = (X^\top X)^{-1} X^\top \mathbf{y}.$$

      These *normal equations* say the MSE's gradient (its slope with respect to each weight) is zero: $\sum_i (\hat{y}_i - y_i) = 0$ and $\sum_i (\hat{y}_i - y_i)\,x_i = 0$. On Lena's residuals, 0 − 2 + 4 − 2 = 0 and 0 × 20 − 2 × 25 + 4 × 30 − 2 × 35 = 0. On huge datasets, gradient descent reaches the same line by stepping downhill, as the optimization module shows.
      :::

      :::story Two mathematicians and a lost dwarf planet
      Adrien-Marie Legendre published least squares in 1805, for comet orbits. Carl Friedrich Gauss published it in 1809, saying he'd used it since 1795; his orbit work had helped astronomers find Ceres again in late 1801. They disputed the credit for years.
      :::
    bridges: []
  - id: prediction.s6
    title: Use the line tomorrow morning
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.prediction
    markdown: |-
      Tomorrow's forecast is 28 °C, so the line predicts 2 × 28 + 5 = 61 cups. Running out costs more than leftovers, so she adds about one typical miss: 64 cups.

      Next week a 41 °C heat wave is forecast. The line says 87 cups, but her notebook stops at 35 °C. Predicting beyond your data's range is **extrapolation**, and the slope out there is a guess. Lena makes a cautious batch, records what sells, and refits. Predict, record, refit: every model in this module improves in that loop.
  - id: prediction.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.prediction
    markdown: Work out predictions, residuals, and squared losses by hand, then judge competing lines, a typo in the data, and a change of units.
    takeaway: |-
      A linear model predicts with a weighted sum of features plus an intercept. Least squares picks the weights and intercept that make the average squared miss as small as possible.
  - id: prediction.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.prediction
    markdown: |-
      A linear predictor uses weights to turn numeric features into a prediction; residual and loss describe different aspects of its error.
