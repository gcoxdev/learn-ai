schema_version: 0.2-draft
lesson:
  id: prediction
  version: 0.1.0-draft
  title: Build a tiny prediction model
  state: draft
  summary: A linear predictor uses weights to turn numeric features into a prediction; residual and loss describe
    different aspects of its error.
  slot: M07.1
  category: learning
  minutes: 10
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — topic overview'
    url: https://aima.cs.berkeley.edu/contents.html
objectives:
- id: objective.prediction
  version: 1-draft
  statement: A linear predictor uses weights to turn numeric features into a prediction; residual and loss
    describe different aspects of its error.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - prediction.base
  - prediction.transfer
  prerequisites:
  - anyOf:
    - objective.data
  - anyOf:
    - objective.functions
scenes:
- id: prediction.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.prediction
  text_mode: The complete explanation is available as readable text.
  title: One feature, one weight
  markdown: 'Imagine a toy rule that estimates a quantity from an input: prediction = weight × input. With
    weight 2 and input 3, prediction is 6.


    This is a deliberately small linear predictor with no intercept. It helps us see how a parameter changes
    behavior before adding many features.'
- id: prediction.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.prediction
  text_mode: The complete explanation is available as readable text.
  title: Fit does not mean understand everything
  markdown: 'Suppose input 2 should produce 6. Weight 3 fits that point exactly. Many problems require more
    than one point to determine whether the rule is useful.


    A more general linear predictor can add an intercept and combine several weighted features. The simple
    case is a model choice, not a definition of all machine learning.'
- id: prediction.s3
  type: explanation
  depth: intuition
  objective_refs:
  - objective.prediction
  text_mode: The complete explanation is available as readable text.
  title: Residual versus loss
  markdown: 'A **residual** can be written as prediction minus target; it keeps a sign. A **squared-error loss**
    squares that residual.


    Prediction 4 and target 6 give residual −2 and loss 4. The negative sign describes the direction of the
    miss; the nonnegative loss measures its squared size.'
- id: prediction.s4
  type: explanation
  depth: intuition
  objective_refs:
  - objective.prediction
  text_mode: The complete explanation is available as readable text.
  title: Next, let the rule adjust
  markdown: 'We could try many weights manually and compare errors. An optimizer supplies a more systematic
    update rule.


    The next lesson connects the chosen loss to changes in the weight. Keep the prediction rule, target, and
    measured error distinct.'
- id: prediction.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.prediction
  markdown: Use two different examples to check your understanding. Hints are available for practice. A later,
    fresh answer without hints can demonstrate personal-study mastery.
  text_mode: Labeled radio options and a submit button; no timing requirement.
- id: prediction.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.prediction
  markdown: A linear predictor uses weights to turn numeric features into a prediction; residual and loss describe
    different aspects of its error.
  text_mode: A linear predictor uses weights to turn numeric features into a prediction; residual and loss
    describe different aspects of its error.
navigation:
  routes:
  - id: route.core
    scene_sequence:
