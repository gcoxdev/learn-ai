assessment_families:
- id: prediction.base
  objective_ref: objective.prediction
  task: base
  response_type: single_choice
  points: 1
  hint: A linear predictor uses weights to turn numeric features into a prediction; residual and loss describe different
    aspects of its error.
  variants:
  - id: prediction.base.1
    prompt: With prediction = 2 × input and input 4, what is the prediction?
    options:
    - id: a
      text: '6'
    - id: b
      text: '2'
    - id: correct
      text: '8'
    answer: correct
    feedback: 2×4=8. This is the prediction, before comparing it with a target.
    retired: true
  - id: prediction.base.2
    prompt: Prediction is 4 and target is 6. What is the residual prediction − target?
    options:
    - id: b
      text: '10'
    - id: correct
      text: −2
    - id: a
      text: '4'
    answer: correct
    feedback: Prediction minus target is 4−6=−2; the negative sign indicates an underestimate.
    retired: true
- id: prediction.transfer
  objective_ref: objective.prediction
  task: transfer
  response_type: single_choice
  points: 1
  hint: A linear predictor uses weights to turn numeric features into a prediction; residual and loss describe different
    aspects of its error.
  variants:
  - id: prediction.transfer.1
    prompt: A weight fits one training point exactly. What follows?
    options:
    - id: b
      text: The rule is necessarily the only possible model.
    - id: correct
      text: That point has zero loss under this error measure.
    - id: a
      text: All future inputs must be predicted correctly.
    answer: correct
    feedback: That point has zero loss under this error measure.
    retired: true
  - id: prediction.transfer.2
    prompt: Why distinguish a residual from squared loss?
    options:
    - id: correct
      text: The residual keeps direction; squared loss measures squared distance.
    - id: a
      text: Both always have opposite signs.
    - id: b
      text: Loss never depends on the prediction.
    answer: correct
    feedback: The residual keeps direction; squared loss measures squared distance.
    retired: true
- id: prediction.base.v2
  objective_ref: objective.prediction
  task: base
  response_type: numeric_fields_with_reason
  points: 1
  hint: Write the operation and the intermediate values before choosing the final answer.
  remediation_scene: prediction.s3
  variants:
  - id: prediction.base.v2.1
    prompt: Use prediction=3×distance+1 at distance 4, with target 10. Calculate prediction, then prediction minus
      target, then record all three values.
    feedback: Prediction is 13, residual is 13−10=3, and loss is 3²=9.
    answers:
      prediction: 13
      residual: 3
      loss: 9
    reason_answer: rule
    reason_options:
    - id: prediction
      text: Square the prediction before comparing it with the target.
    - id: target
      text: Subtract the prediction’s square from the target’s square.
    - id: rule
      text: Square the signed difference between prediction and target.
  - id: prediction.base.v2.2
    prompt: Use prediction=2×distance+3 at distance 5, with target 15. Calculate prediction and residual, then record
      all three values.
    feedback: Prediction is 13, residual is 13−15=−2, and loss is (−2)²=4.
    answers:
      prediction: 13
      residual: -2
      loss: 4
    reason_answer: rule
    reason_options:
    - id: target
      text: Subtract the prediction’s square from the target’s square.
    - id: rule
      text: Square the signed difference between prediction and target.
    - id: prediction
      text: Square the prediction before comparing it with the target.
  - id: prediction.base.v2.3
    prompt: Use prediction=4×distance−1 at distance 2, with target 10. Calculate prediction and residual, then record
      all three values.
    feedback: Prediction is 7, residual is 7−10=−3, and loss is (−3)²=9.
    answers:
      prediction: 7
      residual: -3
      loss: 9
    reason_answer: rule
    reason_options:
    - id: rule
      text: Square the signed difference between prediction and target.
    - id: prediction
      text: Square the prediction before comparing it with the target.
    - id: target
      text: Subtract the prediction’s square from the target’s square.
  - id: prediction.base.v2.4
    prompt: Use prediction=2×distance+1 at distance 3, with target 3. Calculate prediction and residual, then record
      all three values.
    feedback: Prediction is 7, residual is 7−3=4, and loss is 4²=16.
    answers:
      prediction: 7
      residual: 4
      loss: 16
    reason_answer: rule
    reason_options:
    - id: prediction
      text: Square the prediction before comparing it with the target.
    - id: target
      text: Subtract the prediction’s square from the target’s square.
    - id: rule
      text: Square the signed difference between prediction and target.
  absolute_tolerance: 1.0e-06
  numeric_fields:
  - id: prediction
    label: Prediction
  - id: residual
    label: Prediction minus target
  - id: loss
    label: Squared-error loss
- id: prediction.transfer.v2
  objective_ref: objective.prediction
  task: transfer
  response_type: single_choice
  points: 1
  hint: Write the operation and the intermediate values before choosing the final answer.
  remediation_scene: prediction.s3
  variants:
  - id: prediction.transfer.v2.1
    prompt: A trip rule adds 4 minutes even at zero distance. What is that 4?
    answer: a
    feedback: The constant offset shifts the output independently of distance.
    options:
    - id: c
      text: The observed target
    - id: a
      text: An intercept or bias
    - id: b
      text: The distance input
  - id: prediction.transfer.v2.2
    prompt: Predictions 4 and 8 are compared with target 6 using squared error. Which relation holds?
    answer: a
    feedback: The residuals differ in sign but have the same square.
    options:
    - id: a
      text: Both losses are 4
    - id: b
      text: Both residuals are 2
    - id: c
      text: The lower prediction has lower loss
  - id: prediction.transfer.v2.3
    prompt: You change the weight but keep the trip distance fixed. Which role changed?
    answer: a
    feedback: The weight belongs to the rule, not the current observation.
    options:
    - id: b
      text: The example’s recorded input
    - id: c
      text: The example’s observed answer
    - id: a
      text: A setting of the prediction rule
  - id: prediction.transfer.v2.4
    prompt: Absolute error and squared error penalize large misses differently. Why?
    answer: a
    feedback: 'Both rank individual miss magnitudes in the same order. Squaring increases the relative penalty on
      a large miss: misses of 2 and 4 cost 2 and 4 under absolute error, but 4 and 16 under squared error.'
    options:
    - id: c
      text: They rewrite the observed target values
    - id: a
      text: They score the mismatch with different rules
    - id: b
      text: They use different definitions of an input
