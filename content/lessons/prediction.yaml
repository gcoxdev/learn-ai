lesson:
  id: prediction
  version: 0.4.0-draft
  title: Build a tiny prediction model
  state: draft
  summary: A coffee truck has to guess tomorrow's sales from the weather forecast. Build the straight-line rule behind that guess, and find the one line that misses least.
  slot: M07.1
  category: learning
  sources:
    - title: Dive into Deep Learning — linear regression
      url: https://d2l.ai/chapter_linear-regression/linear-regression.html
    - title: An Introduction to Statistical Learning — authors’ materials
      url: https://www.statlearning.com/
  archetype: foundation
objectives:
  - id: objective.prediction
    version: 3-draft
    statement: A linear predictor uses weights to turn numeric features into a prediction; residual and loss describe different aspects of its error.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - prediction.base.v2
      - prediction.transfer.v3
    prerequisites:
      - anyOf:
          - objective.data
      - anyOf:
