schema_version: 0.2-draft
lesson:
  id: prediction
  version: 0.2.0-draft
  title: Build a tiny prediction model
  state: draft
  summary: Build a one-input predictor, calculate its error, and distinguish a weight, a residual, and a loss.
  slot: M07.1
  category: learning
  sources:
  - title: Dive into Deep Learning — linear regression
    url: https://d2l.ai/chapter_linear-regression/linear-regression.html
  archetype: foundation
objectives:
- id: objective.prediction
  version: 2-draft
  statement: A linear predictor uses weights to turn numeric features into a prediction; residual and loss describe
    different aspects of its error.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - prediction.base.v2
  - prediction.transfer.v2
  prerequisites:
  - anyOf:
    - objective.data
  - anyOf:
    - objective.functions
  - anyOf:
    - objective.weights-and-predictions
scenes:
- id: prediction.s1
  title: Begin with the role of a weight
  type: explanation
  depth: intuition
  objective_refs:
  - objective.prediction
  markdown: A **prediction** is an answer proposed from an input. Use the delivery rule prediction = weight × distance.
    The weight is the adjustable minutes-per-kilometer number; the distance is today’s input. With weight 2 and
    distance 3, the prediction is 6 minutes. This is a **linear predictor** with one feature and no starting offset.
    Each extra kilometer adds the same two minutes under this rule.
  text_mode: A **prediction** is an answer proposed from an input. Use the delivery rule prediction = weight × distance.
    The weight is the adjustable minutes-per-kilometer number; the distance is today’s input. With weight 2 and
    distance 3, the prediction is 6 minutes. This is a **linear predictor** with one feature and no starting offset.
    Each extra kilometer adds the same two minutes under this rule.
  bridges: []
- id: prediction.s2
  title: Add a fixed starting amount
  type: explanation
  depth: intuition
  objective_refs:
  - objective.prediction
  markdown: 'Some trips include loading time regardless of distance. An **intercept**, also called a bias in this
    setting, adds a starting amount: prediction = weight × distance + intercept. With weight 2, distance 3, and
    intercept 4, the prediction is 2 × 3 + 4 = 10 minutes. The weight controls the extra amount per input unit;
    the intercept shifts the prediction as a whole. At zero distance this rule still gives four minutes.'
  text_mode: 'Some trips include loading time regardless of distance. An **intercept**, also called a bias in this
    setting, adds a starting amount: prediction = weight × distance + intercept. With weight 2, distance 3, and
    intercept 4, the prediction is 2 × 3 + 4 = 10 minutes. The weight controls the extra amount per input unit;
    the intercept shifts the prediction as a whole. At zero distance this rule still gives four minutes.'
  bridges:
  - arithmetic
  - functions
- id: prediction.s3
  title: Combine two features explicitly
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.prediction
  markdown: 'Suppose a deliberately simple rule uses distance and number of stops: minutes = 2 × distance + 3 ×
    stops + 4. For distance 3 and two stops, compute the contributions separately: 6 for distance, 6 for stops,
    and 4 fixed. The total is 16. Each weight scales its associated input, and the contributions are added. The
    chosen form is a model assumption; it does not prove every real trip behaves this way.'
  text_mode: 'Suppose a deliberately simple rule uses distance and number of stops: minutes = 2 × distance + 3 ×
    stops + 4. For distance 3 and two stops, compute the contributions separately: 6 for distance, 6 for stops,
    and 4 fixed. The total is 16. Each weight scales its associated input, and the contributions are added. The
    chosen form is a model assumption; it does not prove every real trip behaves this way.'
  bridges: []
- id: prediction.s4
  title: Keep the signed miss
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.prediction
  markdown: The **target** is the observed answer. A **residual** is a signed difference; here we use prediction
    minus target. Predicting 4 for target 6 gives residual −2, meaning two too low. Predicting 8 for target 6 gives
    +2, meaning two too high. Some books use the opposite subtraction, so check the stated convention. Keeping the
    sign helps describe the error direction before we choose how to score its size.
  text_mode: The **target** is the observed answer. A **residual** is a signed difference; here we use prediction
    minus target. Predicting 4 for target 6 gives residual −2, meaning two too low. Predicting 8 for target 6 gives
    +2, meaning two too high. Some books use the opposite subtraction, so check the stated convention. Keeping the
    sign helps describe the error direction before we choose how to score its size.
  bridges: []
- id: prediction.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.prediction
  markdown: Use two different examples to check your understanding. Hints are available for practice. A later, fresh
    answer without hints can demonstrate personal-study mastery.
  text_mode: Labeled radio options and a submit button; no timing requirement.
  takeaway: The model produces a prediction. The residual keeps the direction of its miss. The loss scores the miss
    using a chosen rule; it is not the prediction or the weight.
- id: prediction.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.prediction
  markdown: A linear predictor uses weights to turn numeric features into a prediction; residual and loss describe
    different aspects of its error.
  text_mode: A linear predictor uses weights to turn numeric features into a prediction; residual and loss describe
    different aspects of its error.
- id: prediction.s5
  title: Choose a loss rule
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.prediction
  markdown: 'A **loss** assigns a number to a prediction’s mismatch with a target. **Squared-error loss** squares
    the residual. Both −2 and +2 give a loss of 4; a residual of −4 gives 16. Thus squaring discards direction and
    makes larger misses count more strongly. This is one possible design choice. **Absolute error** uses the distance
    from zero instead: those misses score 2, 2, and 4. Different loss choices can prefer different fitted models.'
  text_mode: 'A **loss** assigns a number to a prediction’s mismatch with a target. **Squared-error loss** squares
    the residual. Both −2 and +2 give a loss of 4; a residual of −4 gives 16. Thus squaring discards direction and
    makes larger misses count more strongly. This is one possible design choice. **Absolute error** uses the distance
    from zero instead: those misses score 2, 2, and 4. Different loss choices can prefer different fitted models.'
  bridges: []
- id: prediction.s6
  title: Fit and then ask what carries over
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.prediction
  markdown: Training might compare candidate weights against many examples and reduce the chosen loss. A weight
    that fits one trip exactly need not fit another trip, and a low average score can hide costly errors on an important
    group. Keep input, weight, prediction, target, residual, and loss in separate labeled columns for a few examples.
    Then change one number and recalculate. That small worksheet prepares you for automatic updates without hiding
    the basic accounting.
  text_mode: Training might compare candidate weights against many examples and reduce the chosen loss. A weight
    that fits one trip exactly need not fit another trip, and a low average score can hide costly errors on an important
    group. Keep input, weight, prediction, target, residual, and loss in separate labeled columns for a few examples.
    Then change one number and recalculate. That small worksheet prepares you for automatic updates without hiding
    the basic accounting.
  bridges: []
