assessment_families:
- id: ai-service-boundaries.base
  objective_ref: objective.ai-service-boundaries
  task: base
  response_type: single_choice
  points: 1
  hint: 'Use queues and limits deliberately: trace the inputs, operation, and result before choosing.'
  remediation_scene: ai-service-boundaries.s2
  variants:
  - id: ai-service-boundaries.base.1
    prompt: What can an unbounded queue do during overload?
    options:
    - id: c
      text: Remove all capacity constraints
    - id: a
      text: Accumulate delay and stale work
    - id: b
      text: Guarantee constant latency
    answer: a
    feedback: Backlog grows when arrivals exceed service capacity.
  - id: ai-service-boundaries.base.2
    prompt: Why include evidence version in some answer-cache keys?
    options:
    - id: a
      text: The supported answer can change when documents change
    - id: b
      text: Only to lengthen the key
    - id: c
      text: Versions never affect meaning
    answer: a
    feedback: Cache validity depends on its inputs.
- id: ai-service-boundaries.transfer
  objective_ref: objective.ai-service-boundaries
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Design explicit failure behavior: trace the inputs, operation, and result before choosing.'
  remediation_scene: ai-service-boundaries.s4
  variants:
  - id: ai-service-boundaries.transfer.1
    prompt: What can make retrying a write unsafe for correctness?
    options:
    - id: a
      text: The first attempt may already have taken effect
    - id: b
      text: Writes never have side effects
    - id: c
      text: Every timeout proves no execution
    answer: a
    feedback: Ambiguous outcomes can cause duplicates.
  - id: ai-service-boundaries.transfer.2
    prompt: Does a successful model API call prove workflow completion?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if the response is streamed
    - id: a
      text: 'No'
    answer: a
    feedback: Other stages and outcome conditions still matter.
