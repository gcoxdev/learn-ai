schema_version: 0.2-draft
lesson:
  id: ai-service-boundaries
  version: 0.1.0-draft
  title: Build a reliable request path around local or remote inference
  state: draft
  summary: AI services coordinate APIs, queues, caches, timeouts, and tool boundaries; request identity, authorization,
    and failure semantics determine whether the surrounding application behaves reliably.
  slot: M33.5
  category: learning
  minutes: 12
  sources:
  - title: Hidden Technical Debt in ML Systems
    url: https://research.google/pubs/hidden-technical-debt-in-machine-learning-systems/
  - title: NIST AI Risk Management Framework
    url: https://www.nist.gov/itl/ai-risk-management-framework
objectives:
- id: objective.ai-service-boundaries
  version: 1-draft
  statement: AI services coordinate APIs, queues, caches, timeouts, and tool boundaries; request identity, authorization,
    and failure semantics determine whether the surrounding application behaves reliably.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - ai-service-boundaries.base
  - ai-service-boundaries.transfer
  prerequisites:
  - anyOf:
    - objective.production-data-and-model-artifacts
  - anyOf:
    - objective.tool-contracts-and-state
  - anyOf:
    - objective.batching-streaming-and-cache-management
scenes:
- id: ai-service-boundaries.s1
  title: Draw the full request path
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ai-service-boundaries
  markdown: A client may send a request to an application, which fetches evidence, calls a local or remote model,
    validates output, and returns a result. Each boundary adds latency and possible failure. Define data formats,
    identities, and which component owns authorization and retries.
  text_mode: A client may send a request to an application, which fetches evidence, calls a local or remote model,
    validates output, and returns a result. Each boundary adds latency and possible failure. Define data formats,
    identities, and which component owns authorization and retries.
  bridges: []
- id: ai-service-boundaries.s2
  title: Use queues and limits deliberately
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-service-boundaries
  markdown: Queues absorb bursts but can increase waiting time. Apply capacity limits, cancellation, and backpressure
    so overload does not grow without bound. A request that has exceeded its useful deadline may no longer deserve
    expensive generation even if it finally reaches a worker.
  text_mode: Queues absorb bursts but can increase waiting time. Apply capacity limits, cancellation, and backpressure
    so overload does not grow without bound. A request that has exceeded its useful deadline may no longer deserve
    expensive generation even if it finally reaches a worker.
  bridges: []
- id: ai-service-boundaries.s3
  title: Cache with the right identity
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-service-boundaries
  markdown: A cache key may need model revision, prompt, retrieval version, user scope, and relevant decoding settings.
    Reusing an answer under changed permissions or evidence can be incorrect. Distinguish deterministic artifact
    reuse from approximate semantic caching that may change answer quality.
  text_mode: A cache key may need model revision, prompt, retrieval version, user scope, and relevant decoding settings.
    Reusing an answer under changed permissions or evidence can be incorrect. Distinguish deterministic artifact
    reuse from approximate semantic caching that may change answer quality.
  bridges: []
- id: ai-service-boundaries.s4
  title: Design explicit failure behavior
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-service-boundaries
  markdown: Timeouts, partial streams, malformed output, and unavailable tools need bounded recovery or clear user-facing
    states. Retrying an external write can duplicate effects unless the operation supports idempotency or outcome
    checks. A model API succeeding does not establish that the whole user workflow completed.
  text_mode: Timeouts, partial streams, malformed output, and unavailable tools need bounded recovery or clear user-facing
    states. Retrying an external write can duplicate effects unless the operation supports idempotency or outcome
    checks. A model API succeeding does not establish that the whole user workflow completed.
  bridges: []
- id: ai-service-boundaries.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.ai-service-boundaries
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: AI services coordinate APIs, queues, caches, timeouts, and tool boundaries; request identity, authorization,
    and failure semantics determine whether the surrounding application behaves reliably.
- id: ai-service-boundaries.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.ai-service-boundaries
  markdown: AI services coordinate APIs, queues, caches, timeouts, and tool boundaries; request identity, authorization,
    and failure semantics determine whether the surrounding application behaves reliably.
  text_mode: AI services coordinate APIs, queues, caches, timeouts, and tool boundaries; request identity, authorization,
    and failure semantics determine whether the surrounding application behaves reliably.
navigation:
  routes:
  - id: route.core
    scene_sequence:
