schema_version: 0.2-draft
lesson:
  id: ai-service-boundaries
  version: 0.3.0-draft
  title: Build a reliable request path around local or remote inference
  state: draft
  summary: Follow a request through the programs surrounding the model.
  slot: M33.5
  category: learning
  sources:
  - title: Hidden Technical Debt in ML Systems
    url: https://research.google/pubs/hidden-technical-debt-in-machine-learning-systems/
  - title: NIST AI Risk Management Framework
    url: https://www.nist.gov/itl/ai-risk-management-framework
objectives:
- id: objective.ai-service-boundaries
  version: 1-draft
  statement: AI services coordinate APIs, queues, caches, timeouts, and tool boundaries; request identity,
    authorization, and failure semantics determine whether the surrounding application behaves reliably.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - ai-service-boundaries.base
  - ai-service-boundaries.transfer
  prerequisites:
  - anyOf:
    - objective.production-data-and-model-artifacts
  - anyOf:
    - objective.tool-contracts-and-state
  - anyOf:
    - objective.batching-streaming-and-cache-management
scenes:
- id: ai-service-boundaries.s1
  title: Draw the full request path
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ai-service-boundaries
  markdown: 'A request may pass from a client to an application, then to a retriever, a local or remote model,
    and output validation before a result returns. An **API**, or **application programming interface**, defines
    how programs request these operations and receive their results.


    Each boundary adds possible delay or failure. Specify the data format, the identity making the request,
    and which component authorizes actions and handles retries.'
  text_mode: 'A request may pass from a client to an application, then to a retriever, a local or remote model,
    and output validation before a result returns. An **API**, or **application programming interface**, defines
    how programs request these operations and receive their results.


    Each boundary adds possible delay or failure. Specify the data format, the identity making the request,
    and which component authorizes actions and handles retries.'
  bridges: []
- id: ai-service-boundaries.s2
  title: Use queues and limits deliberately
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-service-boundaries
  markdown: 'A **queue** holds requests waiting for service. It can absorb bursts, but a growing queue also
    means longer waits. **Backpressure** asks earlier stages to slow down or stop accepting work when later
    stages cannot keep up.


    Use capacity limits, deadlines, and cancellation to avoid spending work on requests that are no longer
    useful. If a learner cancels a long answer, passing that cancellation through the queue and model call
    can stop unnecessary generation.


    A timeout and a cancellation are different: failing to receive a result does not necessarily stop the operation
    that is producing it.'
  text_mode: 'A **queue** holds requests waiting for service. It can absorb bursts, but a growing queue also
    means longer waits. **Backpressure** asks earlier stages to slow down or stop accepting work when later
    stages cannot keep up.


    Use capacity limits, deadlines, and cancellation to avoid spending work on requests that are no longer
    useful. If a learner cancels a long answer, passing that cancellation through the queue and model call
    can stop unnecessary generation.


    A timeout and a cancellation are different: failing to receive a result does not necessarily stop the operation
    that is producing it.'
  bridges: []
- id: ai-service-boundaries.s3
  title: Cache with the right identity
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-service-boundaries
  markdown: A cache key may need model revision, prompt, retrieval version, user scope, and relevant decoding
    settings. Reusing an answer under changed permissions or evidence can be incorrect. Distinguish deterministic
    artifact reuse from approximate semantic caching that may change answer quality.
  text_mode: A cache key may need model revision, prompt, retrieval version, user scope, and relevant decoding
    settings. Reusing an answer under changed permissions or evidence can be incorrect. Distinguish deterministic
    artifact reuse from approximate semantic caching that may change answer quality.
  bridges: []
- id: ai-service-boundaries.s4
  title: Design explicit failure behavior
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-service-boundaries
  markdown: Timeouts, partial streams, malformed output, and unavailable tools need bounded recovery or clear
    user-facing states. Retrying an external write can duplicate effects unless the operation supports idempotency
    or outcome checks. A model API succeeding does not establish that the whole user workflow completed.
  text_mode: Timeouts, partial streams, malformed output, and unavailable tools need bounded recovery or clear
    user-facing states. Retrying an external write can duplicate effects unless the operation supports idempotency
    or outcome checks. A model API succeeding does not establish that the whole user workflow completed.
  bridges: []
- id: ai-service-boundaries.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.ai-service-boundaries
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Trace the whole request across services. Clear identities, limits, cancellation, caching rules,
    and recovery behavior make the surrounding application reliable.
- id: ai-service-boundaries.recap
  title: One idea to take with you
  type: recap
