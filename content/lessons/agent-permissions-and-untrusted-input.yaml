schema_version: 0.2-draft
lesson:
  id: agent-permissions-and-untrusted-input
  version: 0.2.0-draft
  title: Keep the authority to act outside retrieved content
  state: draft
  summary: Keep a document’s contents separate from permission to act.
  slot: M25.7
  category: learning
  sources:
  - title: Indirect Prompt Injection
    url: https://arxiv.org/abs/2302.12173
  - title: NIST AI Risk Management Framework
    url: https://www.nist.gov/itl/ai-risk-management-framework
objectives:
- id: objective.agent-permissions-and-untrusted-input
  version: 1-draft
  statement: Agent systems should bind actions to explicit permissions and task scope, treat external content
    as untrusted evidence, and enforce consequential boundaries in the execution layer.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - agent-permissions-and-untrusted-input.base
  - agent-permissions-and-untrusted-input.transfer
  prerequisites:
  - anyOf:
    - objective.tool-contracts-and-state
  - anyOf:
    - objective.agent-memory-and-context
scenes:
- id: agent-permissions-and-untrusted-input.s1
  title: Separate instruction from evidence
  type: explanation
  depth: intuition
  objective_refs:
  - objective.agent-permissions-and-untrusted-input
  markdown: A retrieved page can contain useful facts and text that attempts to redirect the agent. Its presence
    in context does not grant authority to change the task or access private resources. The application needs
    a clear trust boundary between authorized instructions and external data.
  text_mode: A retrieved page can contain useful facts and text that attempts to redirect the agent. Its presence
    in context does not grant authority to change the task or access private resources. The application needs
    a clear trust boundary between authorized instructions and external data.
  bridges: []
- id: agent-permissions-and-untrusted-input.s2
  title: Enforce capability limits
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agent-permissions-and-untrusted-input
  markdown: Expose only operations and resource scopes needed for the task. Validate destinations, identities,
    and permissions in the execution layer rather than relying entirely on model compliance. A read-only research
    task should not silently acquire an unrelated write capability because a document requests it.
  text_mode: Expose only operations and resource scopes needed for the task. Validate destinations, identities,
    and permissions in the execution layer rather than relying entirely on model compliance. A read-only research
    task should not silently acquire an unrelated write capability because a document requests it.
  bridges: []
- id: agent-permissions-and-untrusted-input.s3
  title: Make consequential actions reviewable
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agent-permissions-and-untrusted-input
  markdown: For actions requiring authorization, prepare exact targets, arguments, and effects before approval.
    Bind approval to that concrete action so later substituted content cannot broaden it. Read-only and reversible
    work can often proceed within existing scope without repetitive interruptions.
  text_mode: For actions requiring authorization, prepare exact targets, arguments, and effects before approval.
    Bind approval to that concrete action so later substituted content cannot broaden it. Read-only and reversible
    work can often proceed within existing scope without repetitive interruptions.
  bridges: []
- id: agent-permissions-and-untrusted-input.s4
  title: Test failure paths in a bounded environment
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.agent-permissions-and-untrusted-input
  markdown: Use synthetic malicious documents and controlled tools to test attempted instruction takeover,
    data leakage, and unauthorized actions. Log relevant decisions without retaining unnecessary sensitive
    content. Prompt wording is one control, while permission enforcement and isolation provide independent
    boundaries.
  text_mode: Use synthetic malicious documents and controlled tools to test attempted instruction takeover,
    data leakage, and unauthorized actions. Log relevant decisions without retaining unnecessary sensitive
    content. Prompt wording is one control, while permission enforcement and isolation provide independent
    boundaries.
  bridges: []
- id: agent-permissions-and-untrusted-input.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.agent-permissions-and-untrusted-input
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Agent systems should bind actions to explicit permissions and task scope, treat external content
    as untrusted evidence, and enforce consequential boundaries in the execution layer.
- id: agent-permissions-and-untrusted-input.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.agent-permissions-and-untrusted-input
  markdown: Agent systems should bind actions to explicit permissions and task scope, treat external content
    as untrusted evidence, and enforce consequential boundaries in the execution layer.
  text_mode: Agent systems should bind actions to explicit permissions and task scope, treat external content
    as untrusted evidence, and enforce consequential boundaries in the execution layer.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - agent-permissions-and-untrusted-input.s1
    - agent-permissions-and-untrusted-input.s2
    - agent-permissions-and-untrusted-input.s3
    - agent-permissions-and-untrusted-input.s4
    - agent-permissions-and-untrusted-input.check
    gate_refs:
