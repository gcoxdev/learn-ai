schema_version: 0.2-draft
lesson:
  id: distillation-and-selection
  version: 0.4.0-draft
  title: Transfer behavior through teacher outputs and selected examples
  state: draft
  summary: Can't afford 20,000 hand-written answers? Borrow a bigger model's, or write eight and keep the best. Both work, and both copy mistakes you didn't mean to keep.
  slot: M20.7
  category: learning
  sources:
    - title: "Distilling the Knowledge in a Neural Network (Hinton, Vinyals & Dean, 2015)"
      url: https://arxiv.org/abs/1503.02531
    - title: "Alpaca: A Strong, Replicable Instruction-Following Model (Stanford CRFM, 2023)"
      url: https://crfm.stanford.edu/2023/03/13/alpaca.html
    - title: "Llama 2: Open Foundation and Fine-Tuned Chat Models (Touvron et al., 2023)"
      url: https://arxiv.org/abs/2307.09288
    - title: "Constitutional AI: Harmlessness from AI Feedback (Bai et al., 2022)"
      url: https://arxiv.org/abs/2212.08073
    - title: "AI models collapse when trained on recursively generated data (Shumailov et al., Nature, 2024)"
      url: https://www.nature.com/articles/s41586-024-07566-y
objectives:
  - id: objective.distillation-and-selection
    version: 2-draft
    statement: Distillation and rejection-based data selection transfer or emphasize behavior through supervised signals; teacher errors, filtering criteria, and student capacity shape what is learned.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - distillation-and-selection.base.v2
      - distillation-and-selection.transfer.v2
      - distillation-and-selection.calculate
    prerequisites:
      - anyOf:
          - objective.supervised-fine-tuning
      - anyOf:
          - objective.preferences-and-reward-models
scenes:
  - id: distillation-and-selection.s1
    title: Borrow a stronger model's answers
    type: explanation
    depth: intuition
    objective_refs:
      - objective.distillation-and-selection
    markdown: |-
      Ferncliff's staff wrote 860 demonstrations and then ran out of time. They'd like 20,000. A much larger model, given Ferncliff's price list and policies in its prompt, writes good answers but is too slow and expensive to run for every customer. So they let it write the demonstrations and fine-tune their small 7-billion-parameter model on them. That's **distillation**: a small **student** model learns from the outputs of a larger **teacher** model.

      There are two main flavors:

      | | What the student learns from | Needs |
      | --- | --- | --- |
      | **Sequence-level distillation** | The teacher's written answers, used as ordinary SFT demonstrations | Only the teacher's text |
      | **Logit distillation** | The teacher's full probability for every candidate token | The teacher's probabilities and a shared tokenizer |

      Full probabilities carry more information. Hinton, Vinyals, and Dean (2015) called them **soft targets**. If the teacher gives the next word "Tuesday" 0.7, "Wednesday" 0.2, and "Monday" 0.1, the student learns that Wednesday was a reasonable second guess, which a single correct answer, a hard target, never tells it.

      :::story Alpaca: a chat model built from borrowed answers
      In March 2023, a Stanford team fine-tuned Meta's 7-billion-parameter LLaMA on 52,000 instruction-and-answer demonstrations written by OpenAI's text-davinci-003. The result, Alpaca, behaved surprisingly like its teacher in simple chats. It also inherited the teacher's habits, including confident wrong answers.
      :::

      That last point is the catch. The student copies the teacher's mistakes as faithfully as its skills. If the teacher misreads Ferncliff's warranty rules, 20,000 demonstrations will teach the misreading 20,000 times.
    bridges: []
  - id: distillation-and-selection.s2
    title: Write eight, keep the best
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.distillation-and-selection
    markdown: |-
      Instead of trusting every answer, generate several and keep only the good ones. For booking requests, Ferncliff has a checker: valid format, real slot, open shop. A single answer from the current model passes 30% of the time. Sample 8 answers per request and keep one that passes: the chance that at least one does is

      $$1 - (1 - 0.3)^8 = 1 - 0.7^8 = 0.942$$

      When there's no pass/fail checker, a reward model can rank the samples instead, and you keep the top one. Either way this is **best-of-n** sampling, or **rejection sampling**: generate $n$, reject all but the best. Training on the survivors is rejection-sampling fine-tuning. Meta used it in the RLHF rounds for Llama 2's chat models: sample several answers per prompt, keep the reward model's favorite, fine-tune on those, and only in the later rounds apply PPO on top.

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      p_pass = 0.3                 # chance that one sampled answer passes the checker
      for n in [1, 2, 4, 8, 16, 64]:
          at_least_one = 1 - (1 - p_pass) ** n
          scores = rng.normal(size=(20_000, n))        # reward-model scores: mean 0, spread 1
          best = scores.max(axis=1).mean()             # average score of the best of n
          print(f"n = {n:2d}: P(at least one passes) = {at_least_one:.3f}   "
                f"expected best score = {best:.2f}")
      ```

      :::predict Going from 8 to 64 samples costs 8 times as much. How much does the expected best score rise?
      From 1.43 to 2.34, less than one extra spread unit for eight times the cost. The first few samples buy the most: going from 1 to 4 raised it from 0 to 1.03. And pushing $n$ very high against a reward model invites the same reward hacking as RLHF, since the best of 64 is often the answer that best exploits the reward model's blind spots.
      :::

      Try `p_pass = 0.05`, a hard request: even 16 samples give only a 56% chance of keeping anything.
    bridges: []
  - id: distillation-and-selection.s3
    title: Let a model judge by written principles
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.distillation-and-selection
    markdown: |-
      Human preference labels are slow, and people get tired of reading harmful requests. **Constitutional AI** (Bai et al., 2022, Anthropic) replaced the human labels for harmlessness with AI feedback guided by a short written list of principles, the *constitution*; helpfulness labels still came from people. It had two phases:

      1. **Critique and revise (supervised; the paper calls it SL-CAI).** The model answers a prompt, then is asked to critique its answer against one principle and rewrite it. The revised answers become SFT demonstrations.
      2. **AI preferences (RL).** The model is shown two answers and asked which better follows a principle. Those AI-made labels train a preference model, and RL proceeds as in RLHF. This is called **RLAIF**, reinforcement learning from AI feedback.

      Ferncliff tries phase 1 with its own principle: "Never promise a repair date; point the customer to the shop." The assistant's first answer says "We'll have it ready Saturday!" The critique notes the promise; the revision says "Most repairs take two to three days. Your shop can confirm Saturday." That revision becomes a training example, with no staff time spent.

      The paper's goal was an assistant that is harmless *without* being evasive: it should explain why it won't help with something harmful rather than refuse vaguely. Principles can be read, argued over, and edited, which is harder with thousands of individual human labels.
    bridges: []
  - id: distillation-and-selection.s4
    title: The self-improvement loop narrows what it sees
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.distillation-and-selection
    markdown: |-
      Put these pieces in a loop: the model generates, a filter or judge keeps the best, the model trains on the survivors, and the improved model generates the next round. It really does improve models, especially where a strict checker exists. It also has three traps.

      **The filter tilts the data toward easy cases.** Ferncliff has 100 easy booking requests (90% pass rate) and 100 hard ones, such as multi-bike group bookings (5% pass rate). With one sample each, about 90 easy and 5 hard answers survive, so the new training set is 95% easy even though half the requests were hard. The model gets better at what it already did well. Sampling 8 answers for each hard request raises the hard survivors to about 34, since $1 - 0.95^8 = 0.34$.

      **The judge's blind spots get amplified.** If the same model judges its own answers, every round rewards the errors it can't see.

      **Variety shrinks.** Shumailov and colleagues (*Nature*, 2024) showed that models trained repeatedly on their own generated data lose the rare cases first and can drift into narrow, degraded output, which they called **model collapse**.

      So each round, Ferncliff spends extra samples on hard requests, checks the survivors with a judge that differs from the model being trained, and mixes some fresh human-written demonstrations back in.
    bridges: []
  - id: distillation-and-selection.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.distillation-and-selection
    markdown: Compute best-of-n pass chances, then diagnose distillation and self-training plans for a medical-coding tool, a maths tutor, and a translation team.
    takeaway: |-
      A student model learns from whatever teacher outputs or filtered samples it is given, mistakes included. Best-of-n raises quality with sharply diminishing returns, and a filter or AI judge shapes the data as much as the generator does.
  - id: distillation-and-selection.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.distillation-and-selection
    markdown: |-
      A student learns from the teacher signals it receives. Filtering can improve those signals, but teacher errors and selection choices can also carry over.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - distillation-and-selection.s1
        - distillation-and-selection.s2
        - distillation-and-selection.s3
        - distillation-and-selection.s4
        - distillation-and-selection.check
      gate_refs:
        - gate.core
  scene_aliases:
    distillation-and-selection.recap: distillation-and-selection.check
assessment_families:
  - id: distillation-and-selection.base
    objective_ref: objective.distillation-and-selection
    task: base
    response_type: single_choice
    points: 1
    hint: 'Select before fitting: trace the inputs, operation, and result before choosing.'
    remediation_scene: distillation-and-selection.s2
    variants:
      - id: distillation-and-selection.base.1
        prompt: What can soft-target distillation convey beyond one label?
        options:
          - id: c
            text: Guaranteed hidden internal reasoning
          - id: a
            text: Relative probabilities of alternatives
          - id: b
            text: The complete teacher training corpus automatically
        answer: a
        feedback: A distribution carries richer supervised information than one class ID.
        retired: true
      - id: distillation-and-selection.base.2
        prompt: Two of ten generated candidates pass a filter. What does fitting only those two emphasize?
        options:
          - id: a
            text: Behavior represented among accepted candidates
          - id: b
            text: The full unfiltered behavior distribution equally
          - id: c
            text: Every possible solution
        answer: a
        feedback: Selection changes the supervised data distribution.
        retired: true
  - id: distillation-and-selection.transfer
    objective_ref: objective.distillation-and-selection
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Trace what transferred and what did not: trace the inputs, operation, and result before choosing.'
    remediation_scene: distillation-and-selection.s4
    variants:
      - id: distillation-and-selection.transfer.1
        prompt: Can a distilled student inherit teacher errors?
        options:
          - id: a
            text: 'Yes'
          - id: b
            text: 'No'
          - id: c
            text: Only if model sizes are equal
        answer: a
        feedback: Teacher-produced targets can contain systematic mistakes.
        retired: true
      - id: distillation-and-selection.transfer.2
        prompt: Why test unnecessary refusals as well as harmful compliance?
        options:
          - id: b
            text: Refusal is always correct
          - id: c
            text: Utility cannot be evaluated
          - id: a
            text: Both affect whether safety adaptation meets its intended behavior
        answer: a
        feedback: Appropriate behavior depends on the actual request.
        retired: true
  - id: distillation-and-selection.base.v2
    objective_ref: objective.distillation-and-selection
    task: base
    response_type: single_choice
    points: 1
    hint: "Ask what signal the student or the filter actually receives: text, full probabilities, a pass/fail check, or another model's judgment. It learns exactly that, errors included."
    remediation_scene: distillation-and-selection.s1
    variants:
      - id: distillation-and-selection.base.v2.1
        prompt: "A teacher gives the next token 'Tuesday' 0.7, 'Wednesday' 0.2, and 'Monday' 0.1. What does training on these soft targets give the student that training on the single answer 'Tuesday' does not?"
        options:
          - id: b
            text: The teacher's reasons for choosing Tuesday over the others
          - id: a
            text: How plausible the teacher found each of the other options
          - id: c
            text: A check that Tuesday is actually the correct answer
        answer: a
        feedback: Soft targets show the teacher's whole spread of belief, including that Wednesday was a fair second guess. They carry no explanation of why, and they don't verify correctness; a wrong teacher gives wrong soft targets too.
      - id: distillation-and-selection.base.v2.2
        prompt: "A team samples 8 answers per prompt, keeps the one a reward model scores highest, and fine-tunes on those. What is this method called?"
        options:
          - id: c
            text: Logit distillation from the reward model
          - id: b
            text: Direct preference optimization on the 8 answers
          - id: a
            text: Rejection-sampling fine-tuning, a best-of-n method
        answer: a
        feedback: Generating n answers, keeping the best, and running SFT on the survivors is rejection-sampling fine-tuning. DPO would train on chosen-and-rejected pairs, and logit distillation matches a teacher's token probabilities, which a reward model doesn't produce.
      - id: distillation-and-selection.base.v2.3
        prompt: "In the supervised phase of Constitutional AI, where do the training demonstrations come from?"
        options:
          - id: a
            text: The model's own answers, rewritten after it critiques them against a principle
          - id: b
            text: Human labelers who rewrite each answer to follow the constitution
          - id: c
            text: A reward model trained on the constitution that scores each answer
        answer: a
        feedback: The model critiques its own answer against a principle and revises it, and the revisions become SFT data. Humans write the principles, not the demonstrations, and the reward-style preference model belongs to the second, RL phase.
      - id: distillation-and-selection.base.v2.4
        prompt: "A team distills a 70-billion-parameter teacher into a 1-billion-parameter student using the teacher's written answers. The teacher sometimes gets unit conversions wrong. What should they expect from the student?"
        options:
          - id: c
            text: Fewer conversion errors, since small models make simpler mistakes
          - id: a
            text: The same conversion errors, since it imitates the teacher's answers
          - id: b
            text: No conversion errors, since the student learns general rules
        answer: a
        feedback: The student is trained to reproduce the teacher's text, so errors in that text become targets. Being smaller doesn't filter mistakes out; if anything, a small student has less capacity to learn around them.
  - id: distillation-and-selection.transfer.v2
    objective_ref: objective.distillation-and-selection
    task: transfer
    response_type: single_choice
    points: 1
    hint: "Look at what the filter or judge lets through: which cases survive, whose blind spots decide, and what disappears over repeated rounds."
    remediation_scene: distillation-and-selection.s4
    variants:
      - id: distillation-and-selection.transfer.v2.1
        prompt: "A maths tutor model generates one solution per problem, keeps those with the right final answer, and retrains. After three rounds it is better on arithmetic but no better on proofs, where its pass rate was 4%. What is the best change?"
        options:
          - id: b
            text: Run more rounds, since improvement on hard problems comes later
          - id: c
            text: Remove the arithmetic problems so only proofs remain
          - id: a
            text: Sample many more solutions for the hard problems before filtering
        answer: a
        feedback: With one sample at 4%, almost no proofs survive, so the training data is nearly all arithmetic. More samples per hard problem let some survive. More rounds repeat the same tilt, and dropping arithmetic throws away useful data without fixing the proofs.
      - id: distillation-and-selection.transfer.v2.2
        prompt: "A team lets its model grade its own outputs, keeps the ones it rates highest, and retrains, round after round. Scores from the model's self-grading climb, but outside reviewers see no improvement. What went wrong?"
        options:
          - id: a
            text: The judge shares the model's blind spots, so its errors are rewarded
          - id: c
            text: Too few rounds were run for the gains to reach reviewers
          - id: b
            text: The model's temperature was too low to make any new answers
        answer: a
        feedback: A model judging itself can't catch mistakes it can't see, so each round selects for them. A separate judge or an objective check breaks the loop. More rounds amplify the problem, and temperature affects variety, not whose judgment counts.
      - id: distillation-and-selection.transfer.v2.3
        prompt: "A translation team trains each new model version mostly on translations written by the previous version. Over several versions, rare idioms and regional spellings gradually disappear from its output. What is this, and what helps?"
        options:
          - id: b
            text: Overfitting; train each version for fewer steps
          - id: a
            text: Model collapse; mix fresh human-written data back in each round
          - id: c
            text: Reward hacking; add a KL penalty to the reference model
        answer: a
        feedback: Training repeatedly on a model's own output loses rare cases first, which is model collapse. Fresh human data restores them. Fewer steps doesn't restore lost variety, and there's no reward being exploited here.
      - id: distillation-and-selection.transfer.v2.4
        prompt: "A medical-coding startup wants to distill a large model into a small one by matching the teacher's full token probabilities. The teacher is only available through an API that returns text. What can they do?"
        options:
          - id: c
            text: Logit distillation using probabilities estimated from the text
          - id: b
            text: Nothing, since distillation needs access to the teacher's weights
          - id: a
            text: Sequence-level distillation, fine-tuning on the teacher's answers
        answer: a
        feedback: Without probabilities, they can still train on the teacher's written answers as SFT data. Guessing probabilities from single samples is not logit distillation, and neither kind of distillation needs the teacher's weights.
  - id: distillation-and-selection.calculate
    objective_ref: objective.distillation-and-selection
    task: base
    response_type: numeric
    points: 1
    hint: "The chance that all n samples fail is (1 − p)^n, so the chance that at least one passes is 1 − (1 − p)^n."
    remediation_scene: distillation-and-selection.s2
    absolute_tolerance: 0.005
    variants:
      - id: distillation-and-selection.calculate.1
        prompt: One sampled answer passes a checker with probability 0.3. You sample 4 independent answers. What is the probability that at least one passes?
        answer: 0.76
        feedback: All four fail with probability 0.7^4 = 0.2401, so at least one passes with probability 1 − 0.2401 ≈ 0.760.
      - id: distillation-and-selection.calculate.2
        prompt: One sampled answer passes a checker with probability 0.5. You sample 3 independent answers. What is the probability that at least one passes?
        answer: 0.875
        feedback: All three fail with probability 0.5^3 = 0.125, so at least one passes with probability 0.875.
      - id: distillation-and-selection.calculate.3
        prompt: One sampled answer passes a checker with probability 0.1. You sample 10 independent answers. What is the probability that at least one passes?
        answer: 0.651
        feedback: All ten fail with probability 0.9^10 ≈ 0.349, so at least one passes with probability ≈ 0.651. Ten samples at 10% each don't add up to 100%.
      - id: distillation-and-selection.calculate.4
        prompt: One sampled answer passes a checker with probability 0.2. You sample 8 independent answers. What is the probability that at least one passes?
        answer: 0.832
        feedback: All eight fail with probability 0.8^8 ≈ 0.168, so at least one passes with probability ≈ 0.832.
      - id: distillation-and-selection.calculate.5
        prompt: A hard request's sampled answers pass a checker with probability 0.05 each. You sample 16 independent answers. What is the probability that at least one passes?
        answer: 0.56
        feedback: All sixteen fail with probability 0.95^16 ≈ 0.440, so at least one passes with probability ≈ 0.560, barely better than a coin flip.
