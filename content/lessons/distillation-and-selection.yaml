schema_version: 0.2-draft
lesson:
  id: distillation-and-selection
  version: 0.1.0-draft
  title: Transfer behavior through teacher outputs and selected examples
  state: draft
  summary: Distillation and rejection-based data selection transfer or emphasize behavior through supervised signals;
    teacher errors, filtering criteria, and student capacity shape what is learned.
  slot: M20.7
  category: learning
  minutes: 12
  sources:
  - title: Distilling the Knowledge in a Neural Network
    url: https://arxiv.org/abs/1503.02531
  - title: DeepSeek-R1
    url: https://arxiv.org/abs/2501.12948
objectives:
- id: objective.distillation-and-selection
  version: 1-draft
  statement: Distillation and rejection-based data selection transfer or emphasize behavior through supervised signals;
    teacher errors, filtering criteria, and student capacity shape what is learned.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - distillation-and-selection.base
  - distillation-and-selection.transfer
  prerequisites:
  - anyOf:
    - objective.supervised-fine-tuning
  - anyOf:
    - objective.preferences-and-reward-models
scenes:
- id: distillation-and-selection.s1
  title: Use a teacher as a source of targets
  type: explanation
  depth: intuition
  objective_refs:
  - objective.distillation-and-selection
  markdown: A student can learn from a teacher’s output distributions, generated responses, intermediate representations,
    or selected traces, depending on the recipe. Matching soft distributions can convey alternatives beyond one
    correct label. Sequence-level distillation instead often treats generated text as supervised examples.
  text_mode: A student can learn from a teacher’s output distributions, generated responses, intermediate representations,
    or selected traces, depending on the recipe. Matching soft distributions can convey alternatives beyond one
    correct label. Sequence-level distillation instead often treats generated text as supervised examples.
  bridges: []
- id: distillation-and-selection.s2
  title: Select before fitting
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.distillation-and-selection
  markdown: Rejection sampling in a training-data pipeline can generate several candidates and retain those passing
    a verifier or scoring rule. If two of ten candidates pass, the resulting dataset emphasizes successful outputs
    while hiding failures from that supervised target set. Selection quality depends on the verifier and sampling
    coverage.
  text_mode: Rejection sampling in a training-data pipeline can generate several candidates and retain those passing
    a verifier or scoring rule. If two of ten candidates pass, the resulting dataset emphasizes successful outputs
    while hiding failures from that supervised target set. Selection quality depends on the verifier and sampling
    coverage.
  bridges: []
- id: distillation-and-selection.s3
  title: Curate behavior and safeguards
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.distillation-and-selection
  markdown: Safety-related demonstrations or preference pairs can teach appropriate refusals and useful handling
    of legitimate requests. Overbroad filtering can reduce utility, while incomplete coverage leaves failure modes.
    Evaluate both harmful compliance and unnecessary refusal under a clearly defined policy and task distribution.
  text_mode: Safety-related demonstrations or preference pairs can teach appropriate refusals and useful handling
    of legitimate requests. Overbroad filtering can reduce utility, while incomplete coverage leaves failure modes.
    Evaluate both harmful compliance and unnecessary refusal under a clearly defined policy and task distribution.
  bridges: []
- id: distillation-and-selection.s4
  title: Trace what transferred and what did not
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.distillation-and-selection
  markdown: A smaller student has different capacity, tokenizer, and architecture; matching selected teacher outputs
    does not copy the teacher’s full knowledge or training process. Preserve provenance, filtering rules, and independent
    tests. A student can inherit teacher mistakes and sometimes generalize differently from them.
  text_mode: A smaller student has different capacity, tokenizer, and architecture; matching selected teacher outputs
    does not copy the teacher’s full knowledge or training process. Preserve provenance, filtering rules, and independent
    tests. A student can inherit teacher mistakes and sometimes generalize differently from them.
  bridges: []
- id: distillation-and-selection.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.distillation-and-selection
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Distillation and rejection-based data selection transfer or emphasize behavior through supervised signals;
    teacher errors, filtering criteria, and student capacity shape what is learned.
- id: distillation-and-selection.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.distillation-and-selection
  markdown: Distillation and rejection-based data selection transfer or emphasize behavior through supervised signals;
    teacher errors, filtering criteria, and student capacity shape what is learned.
  text_mode: Distillation and rejection-based data selection transfer or emphasize behavior through supervised signals;
    teacher errors, filtering criteria, and student capacity shape what is learned.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - distillation-and-selection.s1
    - distillation-and-selection.s2
    - distillation-and-selection.s3
    - distillation-and-selection.s4
    - distillation-and-selection.check
    gate_refs:
    - gate.core
