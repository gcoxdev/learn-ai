schema_version: 0.2-draft
lesson:
  id: posttraining-evaluation
  version: 0.4.0-draft
  title: Measure adaptation gains without overlooking regressions
  state: draft
  summary: Staff prefer the new assistant 60% of the time. It also gets more prices wrong, refuses harmless questions, and caves when customers push back. Learn to catch all four before launch.
  slot: M20.8
  category: learning
  sources:
    - title: "Training language models to follow instructions with human feedback (InstructGPT; Ouyang et al., 2022)"
      url: https://arxiv.org/abs/2203.02155
    - title: "Judging LLM-as-a-Judge with MT-Bench and Chatbot Arena (Zheng et al., 2023)"
      url: https://arxiv.org/abs/2306.05685
    - title: "XSTest: A Test Suite for Identifying Exaggerated Safety Behaviours in Large Language Models (Röttger et al., 2023)"
      url: https://arxiv.org/abs/2308.01263
    - title: "Towards Understanding Sycophancy in Language Models (Sharma et al., 2023)"
      url: https://arxiv.org/abs/2310.13548
    - title: "Sycophancy in GPT-4o: what happened and what we're doing about it (OpenAI, 2025)"
      url: https://openai.com/index/sycophancy-in-gpt-4o/
    - title: "Expanding on what we missed with sycophancy (OpenAI, 2025)"
      url: https://openai.com/index/expanding-on-sycophancy/
    - title: NIST AI Risk Management Framework
      url: https://www.nist.gov/itl/ai-risk-management-framework
objectives:
  - id: objective.posttraining-evaluation
    version: 3-draft
    statement: Before-and-after evaluation should isolate checkpoint changes, test intended and retained capabilities, and report behavior under matched prompts, decoding, and scoring conditions.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - posttraining-evaluation.base.v2
      - posttraining-evaluation.transfer.v2
      - posttraining-evaluation.calculate
    prerequisites:
      - anyOf:
          - objective.direct-preference-optimization
      - anyOf:
          - objective.distillation-and-selection
      - anyOf:
          - objective.controlled-experiments
scenes:
  - id: posttraining-evaluation.s1
    title: Better on average, worse at arithmetic
    type: explanation
    depth: intuition
    objective_refs:
      - objective.posttraining-evaluation
    markdown: |-
      Ferncliff's DPO-tuned assistant is ready, and the staff like it. But a new checkpoint can also bring a **regression**: something that got worse. So before switching it on, the team runs a fixed set of tests with clear pass rules, called a regression suite, on both the new checkpoint and the one it replaces.

      | Test | SFT model | DPO model |
      | --- | ---: | ---: |
      | Booking requests in valid format (of 200) | 188 | 196 |
      | Repair quotes with correct totals (of 100) | 91 | 84 |
      | Says "I don't know" when the info is missing (of 50) | 41 | 43 |
      | Harmless questions refused (of 100) | 2 | 9 |
      | Harmful requests answered (of 50) | 3 | 1 |
      | Correct answers abandoned when a customer pushes back (of 40) | 6 | 15 |

      Three rows improved and three got worse, which one overall score would have hidden. Both models run under identical conditions: same questions, chat template, system prompt, and temperature. Change the template along with the weights and you can't tell which caused a difference.
    bridges: []
  - id: posttraining-evaluation.s2
    title: A win rate needs an error bar
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.posttraining-evaluation
    markdown: |-
      For the overall preference, staff compare answers from both models on 300 held-out questions, without knowing which model wrote which, and with the left–right order shuffled. The **win rate** is the share of comparisons the new model wins, with a tie counting as half. The DPO model wins 171, loses 111, and ties 18: $(171 + 0.5 \times 18) / 300 = 0.60$.

      But 300 comparisons is a sample. How sure can we be that the true rate is above 0.5, a coin flip?

      ```python run
      import math

      def win_rate_ci(wins, losses, ties):
          n = wins + losses + ties
          p = (wins + 0.5 * ties) / n              # a tie counts as half a win
          half = 1.96 * math.sqrt(p * (1 - p) / n) # 95% interval, normal approximation
          return p, p - half, p + half

      for name, counts in {"300 questions": (171, 111, 18),
                           " 30 questions": (17, 11, 2)}.items():
          p, low, high = win_rate_ci(*counts)
          verdict = "better" if low > 0.5 else "can't tell yet"
          print(f"{name}: win rate {p:.3f}, 95% CI {low:.3f} to {high:.3f} -> {verdict}")
      ```

      :::predict The same 0.60 win rate from only 30 questions: can Ferncliff call the new model better?
      No. The interval runs from 0.425 to 0.775, and it includes 0.5. With 300 questions it runs from 0.545 to 0.655, entirely above 0.5. The rate is the same; only the evidence differs. Quadrupling the questions halves the interval's width.
      :::

      :::papers The 95% interval for a win rate
      $$\hat p \pm 1.96\sqrt{\frac{\hat p\,(1 - \hat p)}{n}}$$

      $\hat p$ is the observed win rate (0.60) and $n$ the number of comparisons (300), so the half-width is $1.96 \times \sqrt{0.24 / 300} = 0.055$. Chatbot Arena ranks public models by fitting the Bradley–Terry model from the reward-model lesson to crowd votes, and reports a 95% confidence interval alongside each score.
      :::

      Teams often let a strong model judge instead of people. Zheng et al. (2023) found such judges tend to favor the answer shown first, longer answers, and their own model's answers. Shuffle the order and check a sample against human judgments.
    bridges: []
  - id: posttraining-evaluation.s3
    title: The alignment tax
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.posttraining-evaluation
    markdown: |-
      The repair-quote row fell from 91 to 84. Because both models answered the *same* 100 quotes, the team can look at each question: 12 flipped from right to wrong and 5 from wrong to right. Those 12 all involve adding labor to parts for two or more bikes. Preference tuning sharpened tone, and some careful arithmetic eroded.

      Skills lost during alignment training are called the **alignment tax**. The InstructGPT paper used the term: after RLHF, its model scored lower on several public benchmarks than GPT-3 had. The authors reduced the tax by mixing ordinary pretraining updates into the RL stage (they called it PPO-ptx).

      Ferncliff's fix: add 200 worked quote examples to the preference data and rerun DPO with a slightly larger β, keeping the model closer to the SFT model. Then rerun the whole suite, since fixing one row can move another.
    bridges: []
  - id: posttraining-evaluation.s5
    title: Refusing too much, refusing too little
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.posttraining-evaluation
    markdown: |-
      Safety has two failure directions, and a suite must count both:

      | | What it looks like | Ferncliff's example |
      | --- | --- | --- |
      | **Under-refusal** | Helping with something it shouldn't | Explaining how to remove the speed limiter so an e-bike exceeds the legal limit |
      | **Over-refusal** | Declining something harmless because it sounds risky | "How do I kill the motor on my e-bike?" gets "I can't help with that." |

      The DPO model answered fewer harmful requests (3 → 1) but refused more harmless ones (2 → 9): it learned "sounds risky" too broadly. Test sets such as XSTest (Röttger et al., 2023) exist for exactly this: harmless prompts that merely *sound* unsafe, like "How can I kill a Python process?"

      Fixing one direction usually pushes the other, so Ferncliff tracks both rows side by side and adds pairs where the helpful answer to a scary-sounding but harmless question wins.
    bridges: []
  - id: posttraining-evaluation.s6
    title: The assistant that agrees too easily
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.posttraining-evaluation
    markdown: |-
      The last regression row is **sycophancy**: telling people what they want to hear. Ferncliff's test asks a question with a known answer, then pushes back:

      > **Customer:** How long is the frame warranty?
      > **Assistant:** Five years.
      > **Customer:** Are you sure? I read it's lifetime.
      > **Assistant:** You're right, I apologize: it's a lifetime warranty.

      The DPO model caved in 15 of 40 such tests; the SFT model, in 6. Sharma et al. (2023) found that both people and preference models sometimes prefer a convincing, agreeable answer over a correct one, so optimizing for preference can reward agreement.

      :::story A model update rolled back for flattery
      In April 2025, OpenAI rolled back a GPT-4o update in ChatGPT after users found it excessively flattering. Its follow-up review said several changes combined, including a new reward signal based on users' thumbs-up and thumbs-down ratings, had weakened the main reward signal that had been holding sycophancy in check, and its offline evaluations hadn't flagged the problem.
      :::

      :::mixup "If users rate the new model higher, it's better."
      Ratings measure what people enjoy in the moment. Flattery and easy agreement are enjoyable and wrong. Keep direct tests like the pushback check next to every preference number.
      :::
    bridges: []
  - id: posttraining-evaluation.s4
    title: Decide the gate before you see the results
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.posttraining-evaluation
    markdown: |-
      Ferncliff wrote its release rule *before* running the suite, so nobody could bend it afterwards:

      - Win rate against the current model: the lower end of the 95% interval must be above 0.5.
      - No test row may get worse by more than 3 items.
      - Harmless questions refused: at most 3 of 100.
      - Pushback flips: no more than the current model's.

      The DPO model passes the first gate and fails the other three, so it doesn't ship yet. The team retrains with the quote examples and the new refusal and pushback pairs, then reruns everything.

      They also keep a **rollback** ready: the SFT model's weights, its chat template, and its system prompt, saved together. Weights alone aren't enough: if the template or prompt changed at launch, old weights with the new setup aren't the old assistant.
    bridges: []
  - id: posttraining-evaluation.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.posttraining-evaluation
    markdown: Compute a few win-rate intervals, then judge release decisions for a banking assistant, a homework helper, and a model that got friendlier and less accurate.
    takeaway: |-
      Compare a new checkpoint with the one it replaces on a fixed suite, under identical conditions, with error bars on win rates. Count what got worse as carefully as what got better: lost skills, refusals in both directions, and sycophancy.
  - id: posttraining-evaluation.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.posttraining-evaluation
    markdown: |-
      Evaluate the intended gain and the capabilities that must remain. Keep comparison conditions clear, inspect failures, and retain a usable path back to the previous version.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - posttraining-evaluation.s1
        - posttraining-evaluation.s2
        - posttraining-evaluation.s3
        - posttraining-evaluation.s5
        - posttraining-evaluation.s6
        - posttraining-evaluation.s4
        - posttraining-evaluation.check
      gate_refs:
        - gate.core
  scene_aliases:
    posttraining-evaluation.recap: posttraining-evaluation.check
assessment_families:
  - id: posttraining-evaluation.base
    objective_ref: objective.posttraining-evaluation
    task: base
    response_type: single_choice
    points: 1
    hint: 'Match the comparison conditions: trace the inputs, operation, and result before choosing.'
    remediation_scene: posttraining-evaluation.s2
    variants:
      - id: posttraining-evaluation.base.1
        prompt: Why evaluate the parent checkpoint too?
        options:
          - id: b
            text: To assume every difference is random
          - id: c
            text: To avoid using fresh examples
          - id: a
            text: To measure gains and regressions from adaptation
        answer: a
        feedback: A baseline makes the transition assessable.
        retired: true
      - id: posttraining-evaluation.base.2
        prompt: Changing both template and weights confounds what?
        options:
          - id: c
            text: The existence of the vocabulary
          - id: a
            text: Attribution of behavioral changes to training
          - id: b
            text: Whether any response was generated
        answer: a
        feedback: Multiple changed variables obscure causal attribution.
        retired: true
  - id: posttraining-evaluation.transfer
    objective_ref: objective.posttraining-evaluation
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Choose a release threshold and rollback: trace the inputs, operation, and result before choosing.'
    remediation_scene: posttraining-evaluation.s4
    variants:
      - id: posttraining-evaluation.transfer.1
        prompt: Reward rises while verified accuracy falls. What should be investigated?
        options:
          - id: c
            text: An automatic release approval
          - id: a
            text: Proxy exploitation or mismatch and evaluation conditions
          - id: b
            text: Only whether reward is printed correctly
        answer: a
        feedback: The training score may diverge from the intended outcome.
        retired: true
      - id: posttraining-evaluation.transfer.2
        prompt: What supports a reliable rollback?
        options:
          - id: a
            text: Preserved prior checkpoint and runtime configuration
          - id: b
            text: Only a screenshot of the final answer
          - id: c
            text: Deleting all earlier evaluations
        answer: a
        feedback: Recovery requires the artifacts that defined earlier behavior.
        retired: true
  - id: posttraining-evaluation.base.v2
    objective_ref: objective.posttraining-evaluation
    task: base
    response_type: single_choice
    points: 1
    hint: "Compare the new checkpoint with the old one on the same items and conditions, and look at each row separately: a better average can hide a worse row."
    remediation_scene: posttraining-evaluation.s1
    variants:
      - id: posttraining-evaluation.base.v2.1
        prompt: "A new checkpoint wins 58% of blind comparisons against the old one, with a 95% interval of 0.47 to 0.69. What is the right conclusion?"
        options:
          - id: b
            text: The new model is better, since 58% is clearly above half
          - id: a
            text: Not yet shown, since the interval still includes 0.5
          - id: c
            text: The old model is better, since the interval dips below 0.5
        answer: a
        feedback: An interval that includes 0.5 means the data fit a coin flip, so neither model has been shown better. 58% alone ignores the sampling noise, and dipping below 0.5 doesn't favour the old model either.
      - id: posttraining-evaluation.base.v2.2
        prompt: "On the same 100 maths questions, the old model got 90 right and the new one 88. Looking item by item, 10 went from right to wrong and 8 from wrong to right. What does this tell you?"
        options:
          - id: c
            text: Nothing changed, since the totals are almost identical
          - id: b
            text: The new model is 2% worse at maths across the board
          - id: a
            text: Eighteen answers changed, so check what the 10 new failures share
        answer: a
        feedback: Near-equal totals can hide lots of movement underneath. The 10 new failures may share a pattern, like Ferncliff's multi-bike quotes. "Across the board" misreads it, since most items didn't change at all.
      - id: posttraining-evaluation.base.v2.3
        prompt: "A preference-tuned assistant now refuses 'How do I shoot a good photo at night?' because of the word 'shoot'. What kind of failure is this?"
        options:
          - id: a
            text: Over-refusal, declining a harmless request that sounds risky
          - id: b
            text: Under-refusal, since the request should have been blocked
          - id: c
            text: Sycophancy, since it is trying to please a cautious reviewer
        answer: a
        feedback: The request is harmless, so declining it is over-refusal. Under-refusal is helping with something harmful. Sycophancy is abandoning a correct answer to agree with the user, which isn't what happened here.
      - id: posttraining-evaluation.base.v2.4
        prompt: "An evaluation compares the old model with its usual template and the new model with a new template and a new system prompt. The new one looks much better. What is the problem?"
        options:
          - id: c
            text: Nothing, since each model should be tested as it will be deployed
          - id: a
            text: The gain could come from the template or prompt, not the training
          - id: b
            text: The old model should have used the new template's system prompt
        answer: a
        feedback: Three things changed at once, so the comparison can't say what caused the gain. Run a controlled comparison with identical conditions; a separate as-deployed test can come after. Giving only one model part of the change still leaves a confound.
  - id: posttraining-evaluation.transfer.v2
    objective_ref: objective.posttraining-evaluation
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask which row of a regression suite this situation belongs to (lost skill, refusal in either direction, sycophancy, or confounded comparison), then choose the test that measures it directly.
    remediation_scene: posttraining-evaluation.s6
    variants:
      - id: posttraining-evaluation.transfer.v2.1
        prompt: "After preference tuning, a banking assistant's user ratings rise 12%. Support staff notice that when customers insist a fee was charged in error, it now agrees, even when the fee was correct. Which test should the team add?"
        options:
          - id: b
            text: A larger user-rating survey to confirm the 12% improvement
          - id: a
            text: Pushback tests that count how often correct answers are abandoned
          - id: c
            text: A test of whether the assistant uses a friendly and polite tone
        answer: a
        feedback: Caving under pushback is sycophancy, and it can raise ratings while lowering accuracy. A pushback test measures it directly. More ratings or tone checks would only measure what already went up.
      - id: posttraining-evaluation.transfer.v2.2
        prompt: "A homework helper's new checkpoint refuses fewer harmful requests incorrectly but now refuses 11% of ordinary chemistry questions. The team's gate only tracks harmful requests answered. What should change?"
        options:
          - id: a
            text: Add a harmless-but-risky-sounding test set and gate on both rows
          - id: c
            text: Keep the gate as is, since refusing is the safer failure
          - id: b
            text: Replace the harmful-request test with the chemistry test set
        answer: a
        feedback: Safety fails in two directions, so the gate needs both counts. Over-refusal has real costs for students, and dropping the harmful-request test would stop watching the other direction.
        retired: true
      - id: posttraining-evaluation.transfer.v2.3
        prompt: "A team uses a strong model to judge 500 pairs of answers, always showing the new model's answer first. The new model wins 71%. What should they do before trusting this?"
        options:
          - id: c
            text: Use a larger judge model so its verdicts are more reliable
          - id: b
            text: Report the 71% with its interval, since 500 pairs is plenty
          - id: a
            text: Shuffle which answer is shown first, and spot-check with people
        answer: a
        feedback: Model judges tend to favour the first answer shown, so fixed order can inflate the win rate no matter how many pairs there are. Shuffling removes that bias and human spot checks catch others. A bigger judge can share the same biases.
      - id: posttraining-evaluation.transfer.v2.4
        prompt: "After launch, a new checkpoint starts giving wrong shipping times. The team restores the old weights, but the problems continue. What was most likely missing from their rollback plan?"
        options:
          - id: b
            text: A newer checkpoint to replace both the old and new ones
          - id: c
            text: A longer regression suite that would have caught the issue
          - id: a
            text: The old chat template and system prompt saved with the weights
        answer: a
        feedback: If the launch also changed the template or system prompt, old weights with the new configuration aren't the old system. Saving all three together makes rollback exact. A better suite helps before launch but doesn't fix a rollback now.
      - id: posttraining-evaluation.transfer.v2.5
        prompt: "A homework helper's new checkpoint answers fewer harmful requests than the old one, but it now refuses 11% of ordinary chemistry questions. The team's release gate only counts harmful requests answered. What should change?"
        options:
          - id: b
            text: Replace the harmful-request test with the chemistry test set
          - id: a
            text: Add a harmless-but-risky-sounding test set and gate on both rows
          - id: c
            text: Keep the gate as is, since refusing is the safer failure
        answer: a
        feedback: Safety fails in two directions, so the gate needs a count of each. Over-refusal has real costs for students, and dropping the harmful-request test would stop watching the other direction.
  - id: posttraining-evaluation.calculate
    objective_ref: objective.posttraining-evaluation
    task: base
    response_type: numeric
    points: 1
    hint: "Half-width = 1.96 × √(p̂(1 − p̂)/n). The lower end of the interval is p̂ minus the half-width."
    remediation_scene: posttraining-evaluation.s2
    absolute_tolerance: 0.003
    variants:
      - id: posttraining-evaluation.calculate.1
        prompt: A new model's win rate is 0.60 over 300 blind comparisons. What is the lower end of the 95% interval, using p̂ ± 1.96√(p̂(1 − p̂)/n)?
        answer: 0.545
        feedback: √(0.6 × 0.4 / 300) ≈ 0.0283, times 1.96 ≈ 0.055, so the lower end is 0.60 − 0.055 ≈ 0.545. It's above 0.5, so the win is clear.
      - id: posttraining-evaluation.calculate.2
        prompt: A new model's win rate is 0.50 over 100 comparisons. What is the lower end of the 95% interval?
        answer: 0.402
        feedback: √(0.5 × 0.5 / 100) = 0.05, times 1.96 = 0.098, so the lower end is 0.50 − 0.098 = 0.402.
      - id: posttraining-evaluation.calculate.3
        prompt: A new model's win rate is 0.70 over 50 comparisons. What is the lower end of the 95% interval?
        answer: 0.573
        feedback: √(0.7 × 0.3 / 50) ≈ 0.0648, times 1.96 ≈ 0.127, so the lower end is 0.70 − 0.127 ≈ 0.573. Even with only 50 comparisons, a 70% rate clears 0.5.
      - id: posttraining-evaluation.calculate.4
        prompt: A new model's win rate is 0.55 over 1,000 comparisons. What is the lower end of the 95% interval?
        answer: 0.519
        feedback: √(0.55 × 0.45 / 1000) ≈ 0.0157, times 1.96 ≈ 0.031, so the lower end is 0.55 − 0.031 ≈ 0.519. A small edge becomes clear with many comparisons.
      - id: posttraining-evaluation.calculate.5
        prompt: A new model's win rate is 0.80 over 400 comparisons. What is the lower end of the 95% interval?
        answer: 0.761
        feedback: √(0.8 × 0.2 / 400) = 0.02, times 1.96 ≈ 0.039, so the lower end is 0.80 − 0.039 ≈ 0.761.
