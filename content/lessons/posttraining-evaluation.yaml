schema_version: 0.2-draft
lesson:
  id: posttraining-evaluation
  version: 0.1.0-draft
  title: Measure adaptation gains without overlooking regressions
  state: draft
  summary: Before-and-after evaluation should isolate checkpoint changes, test intended and retained capabilities,
    and report behavior under matched prompts, decoding, and scoring conditions.
  slot: M20.8
  category: learning
  minutes: 12
  sources:
  - title: InstructGPT
    url: https://arxiv.org/abs/2203.02155
  - title: NIST AI Risk Management Framework
    url: https://www.nist.gov/itl/ai-risk-management-framework
objectives:
- id: objective.posttraining-evaluation
  version: 1-draft
  statement: Before-and-after evaluation should isolate checkpoint changes, test intended and retained capabilities,
    and report behavior under matched prompts, decoding, and scoring conditions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - posttraining-evaluation.base
  - posttraining-evaluation.transfer
  prerequisites:
  - anyOf:
    - objective.direct-preference-optimization
  - anyOf:
    - objective.distillation-and-selection
  - anyOf:
    - objective.controlled-experiments
scenes:
- id: posttraining-evaluation.s1
  title: Define the intended change
  type: explanation
  depth: intuition
  objective_refs:
  - objective.posttraining-evaluation
  markdown: Write a measurable goal such as valid structured responses on new requests or more accurate verified
    solutions at a fixed token budget. Include retention constraints and relevant refusal behavior. A single preference
    win rate cannot answer every question about correctness, calibration, or usefulness.
  text_mode: Write a measurable goal such as valid structured responses on new requests or more accurate verified
    solutions at a fixed token budget. Include retention constraints and relevant refusal behavior. A single preference
    win rate cannot answer every question about correctness, calibration, or usefulness.
  bridges: []
- id: posttraining-evaluation.s2
  title: Match the comparison conditions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.posttraining-evaluation
  markdown: Evaluate parent and adapted checkpoints with documented templates, system messages, sampling settings,
    tool access, and output budgets. If the intended production templates differ, report both a controlled comparison
    and the actual product configurations. Otherwise template changes may masquerade as training gains.
  text_mode: Evaluate parent and adapted checkpoints with documented templates, system messages, sampling settings,
    tool access, and output budgets. If the intended production templates differ, report both a controlled comparison
    and the actual product configurations. Otherwise template changes may masquerade as training gains.
  bridges: []
- id: posttraining-evaluation.s3
  title: Inspect distributions and failure slices
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.posttraining-evaluation
  markdown: Disaggregate by task, language, difficulty, response length, and relevant user groups. Use paired examples
    where possible and uncertainty estimates suited to the sample. Inspect cases where a reward score rises but
    independently verified quality falls; that is evidence to investigate the proxy.
  text_mode: Disaggregate by task, language, difficulty, response length, and relevant user groups. Use paired examples
    where possible and uncertainty estimates suited to the sample. Inspect cases where a reward score rises but
    independently verified quality falls; that is evidence to investigate the proxy.
  bridges: []
- id: posttraining-evaluation.s4
  title: Choose a release threshold and rollback
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.posttraining-evaluation
  markdown: Predefine acceptance criteria, retain artifacts and evaluation data, and identify which regressions
    block release. Offline tests precede controlled real-world measurement. Save the parent checkpoint and configuration
    so a problematic adaptation can be reverted and diagnosed without guessing what changed.
  text_mode: Predefine acceptance criteria, retain artifacts and evaluation data, and identify which regressions
    block release. Offline tests precede controlled real-world measurement. Save the parent checkpoint and configuration
    so a problematic adaptation can be reverted and diagnosed without guessing what changed.
  bridges: []
- id: posttraining-evaluation.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.posttraining-evaluation
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: posttraining-evaluation.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.posttraining-evaluation
  markdown: Before-and-after evaluation should isolate checkpoint changes, test intended and retained capabilities,
    and report behavior under matched prompts, decoding, and scoring conditions.
  text_mode: Before-and-after evaluation should isolate checkpoint changes, test intended and retained capabilities,
    and report behavior under matched prompts, decoding, and scoring conditions.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - posttraining-evaluation.s1
    - posttraining-evaluation.s2
    - posttraining-evaluation.s3
    - posttraining-evaluation.s4
    - posttraining-evaluation.check
    - posttraining-evaluation.recap
    gate_refs:
    - gate.core
assessment_families:
- id: posttraining-evaluation.base
  objective_ref: objective.posttraining-evaluation
  task: base
  response_type: single_choice
  points: 1
  hint: 'Match the comparison conditions: trace the inputs, operation, and result before choosing.'
  remediation_scene: posttraining-evaluation.s2
  variants:
  - id: posttraining-evaluation.base.1
    prompt: Why evaluate the parent checkpoint too?
    options:
    - id: b
      text: To assume every difference is random
    - id: c
      text: To avoid using fresh examples
    - id: a
      text: To measure gains and regressions from adaptation
    answer: a
    feedback: A baseline makes the transition assessable.
  - id: posttraining-evaluation.base.2
    prompt: Changing both template and weights confounds what?
    options:
    - id: c
      text: The existence of the vocabulary
    - id: a
      text: Attribution of behavioral changes to training
    - id: b
      text: Whether any response was generated
    answer: a
    feedback: Multiple changed variables obscure causal attribution.
- id: posttraining-evaluation.transfer
  objective_ref: objective.posttraining-evaluation
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Choose a release threshold and rollback: trace the inputs, operation, and result before choosing.'
  remediation_scene: posttraining-evaluation.s4
  variants:
  - id: posttraining-evaluation.transfer.1
    prompt: Reward rises while verified accuracy falls. What should be investigated?
    options:
    - id: c
      text: An automatic release approval
    - id: a
      text: Proxy exploitation or mismatch and evaluation conditions
    - id: b
      text: Only whether reward is printed correctly
    answer: a
    feedback: The training score may diverge from the intended outcome.
  - id: posttraining-evaluation.transfer.2
    prompt: What supports a reliable rollback?
    options:
    - id: a
      text: Preserved prior checkpoint and runtime configuration
    - id: b
      text: Only a screenshot of the final answer
    - id: c
      text: Deleting all earlier evaluations
    answer: a
    feedback: Recovery requires the artifacts that defined earlier behavior.
