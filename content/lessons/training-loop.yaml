schema_version: 0.2-draft
lesson:
  id: training-loop
  version: 0.4.0-draft
  title: Inside a language model training step
  state: draft
  summary: Every 1.6 seconds, Kestrel reads a million tokens and nudges a billion weights. Follow one training step from batch to update, and run a tiny one yourself.
  slot: M16.6
  category: learning
  sources:
    - title: Brown et al. — Language Models are Few-Shot Learners (GPT-3, 2020), appendix B
      url: https://arxiv.org/abs/2005.14165
    - title: Biderman et al. — Pythia, a suite for analyzing language-model training (2023)
      url: https://arxiv.org/abs/2304.01373
    - title: PyTorch — optimizing model parameters
      url: https://docs.pytorch.org/tutorials/beginner/basics/optimization_tutorial.html
    - title: Dive into Deep Learning — transformer architecture
      url: https://d2l.ai/chapter_attention-mechanisms-and-transformers/transformer.html
objectives:
  - id: objective.training-loop
    version: 2-draft
    statement: Distinguish forward evaluation, gradient computation, and optimizer updates in next-token pretraining.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - training-loop.base.v2
      - training-loop.transfer.v2
      - training-loop.calculate
    prerequisites:
      - anyOf:
          - objective.transformer-trace
      - anyOf:
          - objective.update-consequence
      - anyOf:
          - objective.data
scenes:
  - title: A million tokens every 1.6 seconds
    markdown: |-
      Once Kestrel's run starts, the same short routine repeats about 95,000 times. Each repetition is one **training step**, and it always does the same six things:

      1. **Load a batch**: 512 packed rows of 2,048 tokens, with targets shifted one place.
      2. **Forward pass**: run the rows through the model to get a probability for every possible next token at every position.
      3. **Loss**: average $-\ln p$ of the true next tokens, over the scored targets.
      4. **Backward pass**: compute the gradient of that loss for every one of the 1.01 billion weights.
      5. **Clip**: if the gradient is unusually large, shrink it.
      6. **Optimizer step**: change the weights, using the learning rate the schedule sets for this step. Then clear the gradients and go again.

      The amount of text per step is $\text{batch} \times \text{sequence length} = 512 \times 2{,}048 = 1{,}048{,}576$ tokens, about a million. To read 100 billion tokens takes $100 \times 10^9 / 1{,}048{,}576 \approx 95{,}367$ steps. On 32 GPUs, each step takes about 1.6 seconds; the budget lesson shows where that number comes from.
    id: training-loop.s1
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.training-loop
    diagram:
      caption: One Kestrel training step. The loop runs about 95,000 times.
      description: A batch of token rows goes into the forward pass, which produces predictions for the loss. The backward pass turns the loss into gradients. Gradients are clipped, then the optimizer step changes the weights, using the learning rate from the schedule. The updated weights are used by the next forward pass.
      nodes:
        - id: batch
          label: Batch
          note: 512 rows × 2,048 tokens
          col: 0
          row: 0
          tone: data
        - id: forward
          label: Forward pass
          note: probabilities at every position
          col: 1
          row: 0
        - id: loss
          label: Loss
          note: mean −ln p of true tokens
          col: 2
          row: 0
        - id: backward
          label: Backward pass
          note: a gradient for every weight
          col: 3
          row: 0
        - id: clip
          label: Clip
          note: global norm ≤ 1.0
          col: 3
          row: 1
          tone: warn
        - id: step
          label: Optimizer step
          note: AdamW changes the weights
          col: 2
          row: 1
          tone: accent
        - id: schedule
          label: Learning-rate schedule
          note: warmup, then cosine decay
          col: 2
          row: 2
          tone: muted
      edges:
        - from: batch
          to: forward
        - from: forward
          to: loss
        - from: loss
          to: backward
        - from: backward
          to: clip
        - from: clip
          to: step
        - from: schedule
          to: step
          label: rate for this step
          dashed: true
        - from: step
          to: forward
          label: updated weights
          bend: -1
  - title: Forward and loss, on one position
    markdown: |-
      Shrink the vocabulary to three tokens to see one position's arithmetic. The forward pass ends with three scores (logits), and softmax turns them into probabilities $[0.2, 0.5, 0.3]$. The true next token is the third one, so this position's loss is $-\ln 0.3 \approx 1.204$.

      The backward pass starts from a remarkably simple fact: for softmax followed by this loss, the gradient with respect to the logits is the predicted probabilities minus a one-hot vector for the true token:

      $$\frac{\partial \mathcal{L}}{\partial \text{logits}} = p - \text{onehot}(y) = [0.2,\ 0.5,\ 0.3 - 1] = [0.2,\ 0.5,\ -0.7]$$

      The negative entry says "raise the true token's score"; the positive entries say "lower the others", each in proportion to how much probability it wrongly took. Backpropagation then carries these numbers back through all 16 blocks to every weight. In Kestrel, the same happens at about a million positions per step, and their gradients are averaged.
    bridges:
      - probability
      - powers-logs
    id: training-loop.s2
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.training-loop
  - title: Gradients are advice; the optimizer acts on it
    markdown: |-
      The backward pass changes nothing. It only computes, for each weight, which direction would lower the loss. The **optimizer step** is the one moment weights change. With plain gradient descent, a weight of 1.0 with gradient 0.4 and learning rate 0.1 becomes $1.0 - 0.1 \times 0.4 = 0.96$.

      Kestrel uses AdamW, from the optimization module, with settings GPT-3 also used: $\beta_1 = 0.9$, $\beta_2 = 0.95$, weight decay 0.1. Before the step, it **clips** the gradient: if the length (norm) of the whole gradient, all billion numbers taken together, exceeds 1.0, every entry is scaled down by the same factor. A gradient of $(3, 4)$ has norm 5, so it becomes $(0.6, 0.8)$: same direction, length 1.

      :::mixup "Clipping caps each gradient entry at 1.0."
      Global-norm clipping scales the *whole* vector, so the direction is kept. Capping entries one by one would turn $(3, 4)$ into $(1, 1)$, which points somewhere else.
      :::

      The table sums up who does what.
    type: table
    columns:
      - Stage
      - Result
    rows:
      - - Forward
        - Predictions and loss
      - - Backward
        - Gradients
      - - Optimizer step
        - Updated parameters
    id: training-loop.s3
    depth: mechanics
    objective_refs:
      - objective.training-loop
  - title: A training step you can run
    markdown: |-
      Here is the whole loop at toy scale: a one-matrix bigram model (it predicts the next word from the current word only) learning a thirteen-word sentence. Each numbered comment is one of the six stages from the start of this lesson.

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      words = "the kestrel hovers over the field and the kestrel dives on the vole".split()
      vocab = sorted(set(words)); V = len(vocab)
      ids = np.array([vocab.index(w) for w in words])
      x, y = ids[:-1], ids[1:]                   # 1. batch: targets = inputs shifted one place
      W = rng.normal(0, 0.02, (V, V))            # a bigram model: logits for next token = W[current]
      steps, warmup, peak_lr, max_norm = 300, 30, 2.0, 1.0

      for step in range(steps):
          if step < warmup:                      # linear warmup, then cosine down to 10% of peak
              lr = peak_lr * (step + 1) / warmup
          else:
              lr = peak_lr * (0.1 + 0.45 * (1 + np.cos(np.pi * (step - warmup) / (steps - warmup))))
          logits = W[x]                                              # 2. forward
          p = np.exp(logits - logits.max(1, keepdims=True)); p /= p.sum(1, keepdims=True)
          loss = -np.log(p[np.arange(len(y)), y]).mean()             # 3. loss
          g = p.copy(); g[np.arange(len(y)), y] -= 1; g /= len(y)    # 4. backward: dL/dlogits = p - onehot
          grad = np.zeros_like(W); np.add.at(grad, x, g)
          norm = np.linalg.norm(grad)
          if norm > max_norm:                                        # 5. clip the global norm
              grad *= max_norm / norm
          W -= lr * grad                                             # 6. optimizer step (plain SGD)
          if step in (0, 29, 100, 299):
              print(f"step {step:3d}  lr {lr:.2f}  grad norm {norm:.3f}  loss {loss:.3f}")
      print(f"ln V = ln {V} = {np.log(V):.3f}")
      ```

      The first loss, 2.194, matches $\ln 9 = 2.197$, the loss of a model guessing evenly among the 9 distinct words, just as this module's first lesson predicted for Kestrel at $\ln 50{,}304$. The loss then falls to 0.493. It can't reach 0, because "the" is followed by three different words in this sentence.

      Now break it on purpose. Set `max_norm = 0.01` and every step gets clipped hard: the loss is still 1.412 at step 299. Or set `x, y = ids, ids` to forget the shift: the loss drops to 0.028, because each position only has to copy its own input.
    id: training-loop.s7
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.training-loop
  - title: Accumulate gradients on purpose, never by accident
    markdown: |-
      Kestrel's batch is 512 rows, but each GPU can hold only 8 rows at once. Across 32 GPUs that's 256 rows. So each GPU runs two **micro-batches**, adds their gradients together (each loss scaled by ½, so the sum is an average), and only then takes an optimizer step: $32 \times 8 \times 2 = 512$ rows. This is **gradient accumulation**, which the lesson on stochastic gradients showed gives the same gradient as one big batch.

      Accumulation works because most frameworks *add* new gradients into a buffer rather than overwriting it. That same design causes a classic bug. If the loop forgets to clear the buffer after a step, the old gradient leaks into the next one. Suppose the new gradient is 0.4 and a stale 0.6 remains: the step uses 1.0, and with learning rate 0.1 the weight moves by 0.1 instead of 0.04.

      :::predict The team moves Kestrel to 16 GPUs, still 8 rows each. How many accumulation steps keep the batch at 512 rows?
      $512 / (16 \times 8) = 4$. Each optimizer step now takes about twice as long, but it sees exactly the same data and gives the same update.
      :::
    id: training-loop.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.training-loop
  - title: The schedule picks each step's learning rate
    markdown: |-
      The optimizer's learning rate changes every step. Kestrel uses warmup followed by cosine decay, from the optimization module, with one change borrowed from GPT-3: the cosine ends at 10% of the peak instead of zero.

      | Step | Phase | Learning rate |
      | ---: | --- | ---: |
      | 500 | warmup, a quarter of the way | $7.5 \times 10^{-5}$ |
      | 2,000 | end of warmup (peak) | $3 \times 10^{-4}$ |
      | 48,684 | halfway through the decay | $1.65 \times 10^{-4}$ |
      | 95,367 | final step | $3 \times 10^{-5}$ |

      Halfway through a cosine decay, the rate sits exactly midway between peak and floor: $(3 \times 10^{-4} + 3 \times 10^{-5}) / 2 = 1.65 \times 10^{-4}$. Because the schedule depends on the step number, the step number must be saved with every checkpoint.
    id: training-loop.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.training-loop
  - title: Measure without stepping
    markdown: |-
      Every 1,000 steps, Kestrel pauses to compute loss on held-out text it never trains on. An **evaluation pass** runs forward and loss only: no backward pass, no optimizer step, so the weights don't change and the held-out text never becomes training data. Frameworks also let you turn off gradient tracking here, which saves memory.

      The team watches two curves. Training loss should fall steadily. Held-out loss should fall with it. If held-out loss rises while training loss falls, the model is memorizing its training text, a sign to check for repeated data, as in the mixtures lesson.
    id: training-loop.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.training-loop
  - id: training-loop.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.training-loop
    markdown: Tokens-per-step and accumulation arithmetic, a clipped gradient, a stale buffer, and an evaluation routine that trains by mistake test whether you can follow one step from batch to update.
    takeaway: |-
      A training step loads batch × sequence-length tokens, runs forward and loss, computes gradients backward, clips them, and lets the optimizer change the weights at the schedule's learning rate. Only that last step changes the model.
  - id: training-loop.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.training-loop
    markdown: |-
      Forward computes predictions, backward computes gradients, and the optimizer changes parameters. Keep fitting, deliberate gradient accumulation, and held-out measurement separate.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - training-loop.s1
        - training-loop.s2
