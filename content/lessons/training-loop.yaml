scenes:
- title: Turn a recorded sequence into a task
  markdown: 'For a toy sequence [“a”, “bird”, “sings”, “end”], next-token examples pair each prefix with its following
    token. In a packed tensor, inputs and targets can be shifted views of the same sequence: [a, bird, sings] predicts
    [bird, sings, end].


    A causal mask keeps each input position from using future target information. Padding, document boundaries,
    and the intended objective determine which positions should contribute to loss; not every array cell is necessarily
    an example.'
  id: training-loop.s1
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-loop
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Run the forward computation
  markdown: 'The model calculates vocabulary logits for the eligible positions. Suppose a three-token vocabulary
    receives probabilities [0.2, 0.5, 0.3], and the recorded target is the third token. The loss should reward raising
    the target’s share relative to the alternatives.


    A common next-token objective is negative log probability of the target, averaged over selected positions. This
    connects the probability lesson and logarithm lesson to training: a confident wrong prediction is costly, and
    increasing the target probability reduces this loss.'
  bridges:
  - probability
  - powers-logs
  id: training-loop.s2
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-loop
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Backward computes information; the optimizer acts on it
  markdown: 'Backpropagation computes derivatives of the loss with respect to trainable parameters. That tells the
    optimizer how local parameter changes affect the objective. Gradient calculation alone is not the parameter
    update.


    The optimizer then changes parameters using its update rule, learning rate, and possibly accumulated state.
    In simple descent, a weight 1 with gradient 0.4 and rate 0.1 becomes 0.96. This toy update illustrates the distinction;
    practical optimizers may use momentum and adaptive statistics.'
  type: table
  columns:
  - Stage
  - Result
  rows:
  - - Forward
    - Predictions and loss
  - - Backward
    - Gradients
  - - Optimizer step
    - Updated parameters
  id: training-loop.s3
  depth: mechanics
  objective_refs:
  - objective.training-loop
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Be deliberate about accumulation
  markdown: 'Programs commonly accumulate gradients into buffers. Clear those buffers when starting a new intended
    update, or deliberately accumulate across smaller microbatches before stepping. Accidental leftover gradients
    change the effective update.


    For a toy objective with desired gradient 0.4, an old gradient 0.6 left in the buffer makes the combined value
    1.0. At rate 0.1 this changes a weight by 0.1 rather than 0.04. The arithmetic is consistent; the unintended
    training procedure is the problem.'
  id: training-loop.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-loop
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Measure learning on data outside the update
  markdown: 'Training loss describes the examples used for fitting. Evaluate on suitable held-out data to test generalization.
    In an evaluation pass, parameters should ordinarily stay fixed and the held-out examples should not silently
    become optimizer updates.


    Dropout and similar components may also have training/evaluation behavior. Disabling gradient recording and
    choosing evaluation behavior are related engineering choices, but neither by itself proves that your dataset
    split is clean.'
  id: training-loop.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-loop
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Repeat with checkpoints and a purpose
  markdown: 'A run repeats data preparation, forward computation, loss, backward computation, and optimizer updates.
    Checkpoints can preserve parameters and the state needed to resume training. A base model is the result of an
    objective and data process, not an automatically helpful chat assistant.


    Later post-training may use demonstrations, preferences, rewards, or other objectives. Those choices alter the
    learning recipe. This lesson explains the common step boundary; data curation, distributed optimization, and
    each post-training method remain deeper units.'
  id: training-loop.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.training-loop
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- id: training-loop.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.training-loop
  markdown: Use a fresh example to check what you can explain. Hints remain available for practice.
  text_mode: Labeled controls and untimed feedback.
  takeaway: Forward computes predictions, backward computes gradients, and the optimizer changes parameters. Keep
    fitting, deliberate gradient accumulation, and held-out measurement separate.
- id: training-loop.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.training-loop
  markdown: Forward computes predictions, backward computes gradients, and the optimizer changes parameters. Keep
    fitting, deliberate gradient accumulation, and held-out measurement separate.
  text_mode: Forward computes predictions, backward computes gradients, and the optimizer changes parameters. Keep
    fitting, deliberate gradient accumulation, and held-out measurement separate.
