assessment_families:
  - response_type: single_choice
    hint: Forward produces predictions; backward produces gradients; the optimizer applies a parameter change.
    variants:
      - prompt: Which operation applies a parameter change in the usual training loop?
        options:
          - id: answer
            text: The optimizer step.
          - id: a
            text: Reading the loss value for display.
          - id: b
            text: Tokenizing a held-out sentence, by itself.
        answer: answer
        feedback: The optimizer uses gradients and its update rule to change parameters. Merely calculating or displaying a loss does not apply an update.
        id: training-loop.base.1
        retired: true
      - prompt: A backward pass finishes successfully. What has it primarily computed?
        options:
          - id: a
            text: A guarantee that the next generated statement is true.
          - id: b
            text: A new tokenizer vocabulary for the next request.
          - id: answer
            text: Gradients of the selected loss with respect to trainable parameters.
        answer: answer
        feedback: Backpropagation computes derivatives through the forward graph. Parameter updates and tokenizer design are separate operations.
        id: training-loop.base.2
        retired: true
    id: training-loop.base
    objective_ref: objective.training-loop
    task: base
    points: 1
    remediation_scene: training-loop.s1
  - response_type: single_choice
    hint: Ask whether the observed data should fit parameters or only measure fixed-model behavior.
    variants:
      - prompt: A held-out evaluation routine accidentally calls the optimizer after computing its loss. What is wrong?
        options:
          - id: a
            text: Nothing; evaluation must always retrain the model.
          - id: b
            text: The input token IDs necessarily become probabilities.
          - id: answer
            text: The supposed measurement can now change parameters using the evaluation data.
        answer: answer
        feedback: An optimizer call can turn held-out examples into fitting data. A reported evaluation then no longer cleanly measures the unchanged model on those examples.
        id: training-loop.transfer.1
        retired: true
      - prompt: The intended new gradient is 0.2, but an old 0.3 remains in the accumulation buffer. What must be decided explicitly?
        options:
          - id: b
            text: Whether inference must always perform the same parameter update.
          - id: answer
            text: Whether accumulating to 0.5 is intended; otherwise clear the old gradients before the new update.
          - id: a
            text: Whether to rename the tokens so the old gradient disappears.
        answer: answer
        feedback: Gradient accumulation is valid when designed. An uncleared buffer accidentally changes the effective gradient and therefore the training procedure.
        id: training-loop.transfer.2
        retired: true
    id: training-loop.transfer
    objective_ref: objective.training-loop
    task: transfer
    points: 1
    remediation_scene: training-loop.s1
  - id: training-loop.base.v2
    objective_ref: objective.training-loop
    task: base
    response_type: single_choice
    points: 1
    hint: Place the event in the six stages (batch, forward, loss, backward, clip, optimizer step). Only the optimizer step changes weights, and clipping rescales the whole gradient.
    remediation_scene: training-loop.s3
    variants:
      - id: training-loop.base.v2.1
        prompt: During one training step, at which moment do the model's weights actually change?
        options:
          - id: b
            text: During the backward pass, when each weight's gradient is computed
          - id: a
            text: During the optimizer step, after gradients have been clipped
          - id: c
            text: During the loss calculation, when the error is measured
        answer: a
        feedback: The backward pass only computes which way each weight should move; the optimizer step applies the change. The loss is just a measurement of the forward pass.
      - id: training-loop.base.v2.2
        prompt: A gradient has global norm 5.0 and the clipping threshold is 1.0. What happens to it?
        options:
          - id: c
            text: Each entry larger than 1.0 is set to 1.0, and the rest stay the same
          - id: a
            text: Every entry is multiplied by 0.2, so its direction is kept
          - id: b
            text: The step is skipped, since the gradient is over the threshold
        answer: a
        feedback: Global-norm clipping scales the whole vector by 1.0 / 5.0 = 0.2, keeping the direction. Capping entries one by one changes the direction, and clipping shrinks the step rather than skipping it.
      - id: training-loop.base.v2.3
        prompt: A loop forgets to clear the gradient buffer after each optimizer step. What does the next step use?
        options:
          - id: a
            text: The new gradient plus the previous step's gradient
          - id: b
            text: The average of the new gradient and the previous one
          - id: c
            text: The previous step's gradient in place of the new one
        answer: a
        feedback: Frameworks add new gradients into the buffer, so stale ones accumulate and the step is too big. That adding is what makes deliberate accumulation work, but here nothing cleared the buffer.
      - id: training-loop.base.v2.4
        prompt: A run warms up linearly to a peak learning rate of 3 × 10⁻⁴ over 2,000 steps. What is the rate at step 500?
        options:
          - id: b
            text: 3 × 10⁻⁴, since warmup only changes the rate after the peak
          - id: c
            text: 1.5 × 10⁻⁴, since warmup begins at half the peak rate
          - id: a
            text: 7.5 × 10⁻⁵, a quarter of the way up to the peak
        answer: a
        feedback: Linear warmup climbs from 0 to the peak, so step 500 of 2,000 gives 500/2,000 × 3 × 10⁻⁴ = 7.5 × 10⁻⁵. 1.5 × 10⁻⁴ is the rate at step 1,000.
  - id: training-loop.transfer.v2
    objective_ref: objective.training-loop
    task: transfer
    response_type: single_choice
    points: 1
    hint: Decide whether the data in question should change the weights, and whether the number of rows per optimizer step stays the same.
    remediation_scene: training-loop.s4
    variants:
      - id: training-loop.transfer.v2.1
        prompt: An evaluation routine computes held-out loss and then, by mistake, calls the optimizer step. What is the problem?
        options:
          - id: c
            text: The held-out loss is reported with gradient tracking turned on
          - id: b
            text: The evaluation runs slower because of the extra computation
          - id: a
            text: The held-out text is now training the model it's meant to measure
        answer: a
        feedback: An optimizer step turns the held-out text into training data, so later held-out losses are no longer honest. Tracking gradients wastes memory and time, but only the step changes the weights.
      - id: training-loop.transfer.v2.2
        prompt: A team moves from 64 GPUs to 32, keeping 4 rows per GPU and a global batch of 512 rows. How should gradient accumulation change?
        options:
          - id: a
            text: Double it, from 2 to 4 micro-batches per step
          - id: b
            text: Keep it at 2, and halve the learning rate instead
          - id: c
            text: Keep it at 2, since the batch size is set per GPU
        answer: a
        feedback: 64 × 4 × 2 = 512 before; with 32 GPUs, 32 × 4 × 4 = 512. Keeping 2 would halve the batch to 256 rows, and a smaller learning rate doesn't restore the missing rows.
      - id: training-loop.transfer.v2.3
        prompt: A run's gradient norm sits near 0.3 for thousands of steps. Then one batch gives a norm of 40, with clipping at 1.0. What does that step's update look like?
        options:
          - id: b
            text: The step is skipped, so the weights don't change at all
          - id: a
            text: It points the same way as the gradient, scaled to norm 1.0
          - id: c
            text: It is 40 times larger than usual, pointing the same way
        answer: a
        feedback: Clipping multiplies the gradient by 1/40, so the update keeps its direction but is limited to norm 1.0. Without clipping it would be about 130 times the usual size. Clipping doesn't skip steps, though some teams add that rule separately.
      - id: training-loop.transfer.v2.4
        prompt: Run A uses 256 rows per step and run B uses 512 rows, both of 2,048 tokens. At step 10,000, B's loss is lower. What is the fairest first comparison?
        options:
          - id: c
            text: Compare them at step 10,000, since both ran the same number of steps
          - id: b
            text: Compare them at step 5,000, since B's steps took longer to run
          - id: a
            text: Compare them after the same number of tokens, B's step 5,000 and A's 10,000
        answer: a
        feedback: By step 10,000, B has read twice as many tokens. Comparing at equal tokens, as the lesson on stochastic gradients advised, separates the effect of batch size from the effect of more data.
  - id: training-loop.calculate
    objective_ref: objective.training-loop
    task: base
    response_type: numeric
    points: 1
    hint: Tokens per step = rows per step × tokens per row. Rows per step = GPUs × rows per GPU × accumulation steps. Steps = total tokens ÷ tokens per step.
    remediation_scene: training-loop.s1
    absolute_tolerance: 1
    variants:
      - id: training-loop.calculate.1
        prompt: A run uses batches of 256 rows, each 4,096 tokens long. How many tokens does one optimizer step read?
        answer: 1048576
        feedback: 256 × 4,096 = 1,048,576 tokens, the same as Kestrel's 512 × 2,048.
      - id: training-loop.calculate.2
        prompt: 8 GPUs each hold 4 rows of 2,048 tokens, and each GPU accumulates 8 micro-batches before stepping. How many tokens does one optimizer step read?
        answer: 524288
        feedback: 8 × 4 × 8 = 256 rows per step, and 256 × 2,048 = 524,288 tokens.
      - id: training-loop.calculate.3
        prompt: Pythia's models read 2,097,152 tokens per step (1,024 rows of 2,048). How many steps does a 300-billion-token run take? Round to the nearest step.
        answer: 143051
        feedback: 300,000,000,000 ÷ 2,097,152 ≈ 143,051 steps. Pythia's released checkpoints run to step 143,000.
      - id: training-loop.calculate.4
        prompt: A global batch is 1,024 rows. There are 64 GPUs, and each holds 4 rows at a time. How many accumulation steps does each GPU need per optimizer step?
        answer: 4
        feedback: 64 × 4 = 256 rows per micro-batch round, and 1,024 ÷ 256 = 4 rounds.
