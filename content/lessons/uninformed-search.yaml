schema_version: 0.2-draft
lesson:
  id: uninformed-search
  version: 0.1.0-draft
  title: Choose an order for exploring possibilities
  state: draft
  summary: Breadth-first, depth-first, uniform-cost, and iterative-deepening search prioritize candidates differently,
    producing different cost, memory, and completeness properties.
  slot: M05.2
  category: learning
  minutes: 12
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.uninformed-search
  version: 1-draft
  statement: Breadth-first, depth-first, uniform-cost, and iterative-deepening search prioritize candidates differently,
    producing different cost, memory, and completeness properties.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - uninformed-search.base
  - uninformed-search.transfer
  prerequisites:
  - anyOf:
    - objective.search-problems
scenes:
- id: uninformed-search.s1
  title: Breadth-first explores by depth
  type: explanation
  depth: intuition
  objective_refs:
  - objective.uninformed-search
  markdown: Breadth-first search uses a queue to expand shallower paths before deeper ones. It finds a solution
    with the fewest edges under standard finite-branching conditions. That is also minimum cost when every edge
    has the same positive cost, but not when edge costs differ. Its frontier can require substantial memory.
  text_mode: Breadth-first search uses a queue to expand shallower paths before deeper ones. It finds a solution
    with the fewest edges under standard finite-branching conditions. That is also minimum cost when every edge
    has the same positive cost, but not when edge costs differ. Its frontier can require substantial memory.
  bridges: []
- id: uninformed-search.s2
  title: Depth-first follows a branch
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.uninformed-search
  markdown: Depth-first search explores one branch before alternatives, commonly using a stack. It can use little
    frontier memory but may become stuck on an infinite branch without safeguards. Cycle detection and finite-state
    assumptions change completeness. The first solution found need not be shallow or cheap.
  text_mode: Depth-first search explores one branch before alternatives, commonly using a stack. It can use little
    frontier memory but may become stuck on an infinite branch without safeguards. Cycle detection and finite-state
    assumptions change completeness. The first solution found need not be shallow or cheap.
  bridges: []
- id: uninformed-search.s3
  title: Uniform-cost follows accumulated cost
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.uninformed-search
  markdown: Uniform-cost search expands the frontier path with the lowest cost so far. In a finite graph with nonnegative
    edge costs and correct cost bookkeeping, it can find a minimum-cost goal. A direct edge of cost 9 should lose
    to a two-edge route costing 2 + 3, even though the latter is deeper.
  text_mode: Uniform-cost search expands the frontier path with the lowest cost so far. In a finite graph with nonnegative
    edge costs and correct cost bookkeeping, it can find a minimum-cost goal. A direct edge of cost 9 should lose
    to a two-edge route costing 2 + 3, even though the latter is deeper.
  bridges: []
- id: uninformed-search.s4
  title: Iterative deepening repeats bounded searches
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.uninformed-search
  markdown: Iterative deepening runs depth-limited searches with increasing limits. It combines shallow-solution
    discovery with modest depth-first memory, at the expense of repeating earlier work. Choose an algorithm by the
    task’s costs, state space, memory budget, and assumptions, not by a universal ranking of names.
  text_mode: Iterative deepening runs depth-limited searches with increasing limits. It combines shallow-solution
    discovery with modest depth-first memory, at the expense of repeating earlier work. Choose an algorithm by the
    task’s costs, state space, memory budget, and assumptions, not by a universal ranking of names.
  bridges: []
- id: uninformed-search.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.uninformed-search
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: uninformed-search.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.uninformed-search
  markdown: Breadth-first, depth-first, uniform-cost, and iterative-deepening search prioritize candidates differently,
    producing different cost, memory, and completeness properties.
  text_mode: Breadth-first, depth-first, uniform-cost, and iterative-deepening search prioritize candidates differently,
    producing different cost, memory, and completeness properties.
