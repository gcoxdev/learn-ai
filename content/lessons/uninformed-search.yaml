schema_version: 0.2-draft
lesson:
  id: uninformed-search
  version: 0.3.0-draft
  title: Choose an order for exploring possibilities
  state: draft
  summary: Compare four ways to manage a waiting list of routes, and decide when distance matters more than
    step count.
  slot: M05.2
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.uninformed-search
  version: 1-draft
  statement: Breadth-first, depth-first, uniform-cost, and iterative-deepening search prioritize candidates
    differently, producing different cost, memory, and completeness properties.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - uninformed-search.base
  - uninformed-search.transfer
  prerequisites:
  - anyOf:
    - objective.search-problems
scenes:
- id: uninformed-search.s1
  title: Explore one level at a time
  type: explanation
  depth: intuition
  objective_refs:
  - objective.uninformed-search
  markdown: 'The **frontier** is the waiting list of paths we have found but have not yet explored. **Breadth-first
    search** manages it with a queue: take the oldest waiting item first, like a line at a shop. If A connects
    to B and C, and B connects to D, one possible visit order is A, B, C, D.


    This explores shallow paths before deeper ones. With finitely many choices at each step, it finds a solution
    with the fewest edges if one exists. Fewest edges also means lowest cost when every edge has the same positive
    cost. The waiting list can become large, so memory is a practical limit.'
  text_mode: 'The **frontier** is the waiting list of paths we have found but have not yet explored. **Breadth-first
    search** manages it with a queue: take the oldest waiting item first, like a line at a shop. If A connects
    to B and C, and B connects to D, one possible visit order is A, B, C, D.


    This explores shallow paths before deeper ones. With finitely many choices at each step, it finds a solution
    with the fewest edges if one exists. Fewest edges also means lowest cost when every edge has the same positive
    cost. The waiting list can become large, so memory is a practical limit.'
  bridges: []
- id: uninformed-search.s2
  title: Follow one branch before returning
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.uninformed-search
  markdown: '**Depth-first search** follows a branch before trying its alternatives. It commonly uses a **stack**,
    which takes the newest item first, like the top plate in a pile. On the same map, choosing B first can
    give the order A, B, D, C.


    This often needs less frontier memory, but the first solution may be deep or expensive. An infinite branch
    or a cycle such as A → B → A can prevent progress unless the method has safeguards. Whether it finds a
    solution therefore depends on the state space and how repeats and stopping are handled.'
  text_mode: '**Depth-first search** follows a branch before trying its alternatives. It commonly uses a **stack**,
    which takes the newest item first, like the top plate in a pile. On the same map, choosing B first can
    give the order A, B, D, C.


    This often needs less frontier memory, but the first solution may be deep or expensive. An infinite branch
    or a cycle such as A → B → A can prevent progress unless the method has safeguards. Whether it finds a
    solution therefore depends on the state space and how repeats and stopping are handled.'
  bridges: []
- id: uninformed-search.s3
  title: Uniform-cost follows accumulated cost
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.uninformed-search
  markdown: 'Uniform-cost search expands the frontier path with the lowest cost so far. In a finite graph with
    nonnegative edge costs and correct cost bookkeeping, it can find a minimum-cost goal. A direct edge of
    cost 9 should lose to a two-edge route costing 2 + 3, even though the latter is deeper.


    For uniform-cost search, check a goal when its cheapest waiting path is taken out for expansion, not merely
    when the goal is first noticed. The first discovered route might cost 9 while an unfinished route will
    reach it for 5. Correct bookkeeping keeps that cheaper alternative eligible.'
  text_mode: 'Uniform-cost search expands the frontier path with the lowest cost so far. In a finite graph
    with nonnegative edge costs and correct cost bookkeeping, it can find a minimum-cost goal. A direct edge
    of cost 9 should lose to a two-edge route costing 2 + 3, even though the latter is deeper.


    For uniform-cost search, check a goal when its cheapest waiting path is taken out for expansion, not merely
    when the goal is first noticed. The first discovered route might cost 9 while an unfinished route will
    reach it for 5. Correct bookkeeping keeps that cheaper alternative eligible.'
  bridges: []
- id: uninformed-search.s4
  title: Iterative deepening repeats bounded searches
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.uninformed-search
  markdown: Iterative deepening runs depth-limited searches with increasing limits. It combines shallow-solution
    discovery with modest depth-first memory, at the expense of repeating earlier work. Choose an algorithm
    by the task’s costs, state space, memory budget, and assumptions, not by a universal ranking of names.
  text_mode: Iterative deepening runs depth-limited searches with increasing limits. It combines shallow-solution
    discovery with modest depth-first memory, at the expense of repeating earlier work. Choose an algorithm
    by the task’s costs, state space, memory budget, and assumptions, not by a universal ranking of names.
  bridges: []
- id: uninformed-search.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.uninformed-search
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: 'The waiting-list rule changes the search: breadth-first favors few steps, depth-first follows
    a branch, and uniform-cost favors the cheapest path so far.'
- id: uninformed-search.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.uninformed-search
  markdown: 'The waiting-list rule changes the search: breadth-first favors few steps, depth-first follows
    a branch, and uniform-cost favors the cheapest path so far.'
  text_mode: 'The waiting-list rule changes the search: breadth-first favors few steps, depth-first follows
    a branch, and uniform-cost favors the cheapest path so far.'
