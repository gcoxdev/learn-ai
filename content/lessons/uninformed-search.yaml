schema_version: 0.2-draft
lesson:
  id: uninformed-search
  version: 0.4.0-draft
  title: Choose an order for exploring possibilities
  state: draft
  summary: Four ways to pick the next route from a waiting list. Race them across the town map and see why the fewest roads isn't the shortest drive.
  slot: M05.2
  category: learning
  sources:
    - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
      url: https://aima.cs.berkeley.edu/
objectives:
  - id: objective.uninformed-search
    version: 2-draft
    statement: Breadth-first, depth-first, uniform-cost, and iterative-deepening search prioritize candidates differently, producing different cost, memory, and completeness properties.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - uninformed-search.base.v2
      - uninformed-search.transfer.v2
      - uninformed-search.calc.v2
    prerequisites:
      - anyOf:
          - objective.search-problems
scenes:
  - id: uninformed-search.s1
    title: Explore one level at a time
    type: explanation
    depth: intuition
    objective_refs:
      - objective.uninformed-search
    markdown: |-
      Every search here keeps a **frontier**: a waiting list of routes found but not yet explored. Each step **expands** one route: it takes the route off the frontier, checks whether it ends at the goal, and if not, adds one new route per road leaving its last town. The algorithms differ only in *which* route comes off next.

      **Breadth-first search (BFS)** takes the oldest route first, like a queue at a shop, and skips towns already reached. On the town map, trying roads alphabetically:

      | Step | Take off | Add | Frontier afterwards |
      | ---: | --- | --- | --- |
      | 1 | A | A-B, A-C, A-F | A-B, A-C, A-F |
      | 2 | A-B | A-B-D, A-B-G | A-C, A-F, A-B-D, A-B-G |
      | 3 | A-C | A-C-E | A-F, A-B-D, A-B-G, A-C-E |
      | 4 | A-F | nothing new | A-B-D, A-B-G, A-C-E |
      | 5 | A-B-D | nothing (G already reached) | A-B-G, A-C-E |
      | 6 | A-B-G | goal! | |

      BFS returns A → B → G after expanding 6 towns. It tries every 1-road route before any 2-road route, so it finds the fewest roads.

      :::predict Is A → B → G the shortest drive?
      No. It's 17 miles; A → C → E → G is 12 miles. BFS counts roads, not miles.
      :::
    diagram:
