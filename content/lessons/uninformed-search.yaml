    bridges: []
  - id: uninformed-search.s2
    title: Dive down one branch
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.uninformed-search
    markdown: |-
      **Depth-first search (DFS)** takes the *newest* route first, like the top plate on a stack. It dives down one branch to the goal or a dead end, then backs up to the latest untried road. Here each town's roads are tried in alphabetical order (a stack version pushes them in reverse, so the first one sits on top), never revisiting a town on the current route:

      | Step | Current route | What happens |
      | ---: | --- | --- |
      | 1 | A | Take the first road, to Brook |
      | 2 | A-B | Ashford is already on the route, so try Dunmore |
      | 3 | A-B-D | Try Greyhaven |
      | 4 | A-B-D-G | Goal! |

      DFS returns A → B → D → G: 3 roads, 14 miles. Neither the fewest roads nor the fewest miles; just *a* route, found quickly.

      DFS's strength is memory: it stores only the current route and the untried roads beside it, while BFS holds its whole frontier. Its weakness is getting lost. Without the revisit check it could drive A → B → A → B… forever, and in an endless space it can dive down a branch that never reaches a goal.
    bridges: []
  - id: uninformed-search.s3
    title: Uniform-cost follows the cheapest route so far
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.uninformed-search
    markdown: |-
      **Uniform-cost search (UCS)** takes the route with the lowest total cost so far, written $g$. It is Edsger Dijkstra's 1959 shortest-path algorithm, stopped as soon as the goal comes off the frontier.

      | Step | Take off (g) | Add or improve | Frontier afterwards (g) |
      | ---: | --- | --- | --- |
      | 1 | A (0) | B 5, C 3, F 2 | F 2, C 3, B 5 |
      | 2 | F (2) | nothing new | C 3, B 5 |
      | 3 | C (3) | E 7 | B 5, E 7 |
      | 4 | B (5) | D 10, G 17 | E 7, D 10, G 17 |
      | 5 | E (7) | G: 12 beats 17 | D 10, G 12 |
      | 6 | D (10) | G: 14 doesn't beat 12 | G 12 |
      | 7 | G (12) | goal! | |

      Step 4 is the trap. Greyhaven is on the frontier at 17 miles, but UCS waits until it's the cheapest thing waiting, and by then a 12-mile route has replaced it. So check the goal when a route comes *off* the frontier, not when it's added. With that rule and no negative road lengths, UCS returns the cheapest route.

      Run both searches:

      ```python run
      from collections import deque
      import heapq

      roads = {}
      for x, y, miles in [("A", "B", 5), ("A", "C", 3), ("A", "F", 2), ("B", "D", 5),
                       ("B", "G", 12), ("C", "E", 4), ("D", "G", 4), ("E", "G", 5)]:
          roads.setdefault(x, {})[y] = miles
          roads.setdefault(y, {})[x] = miles

      def bfs(start, goal):
          frontier, reached, order = deque([[start]]), {start}, []
          while frontier:
              path = frontier.popleft()                  # oldest route first
              order.append(path[-1])
              if path[-1] == goal:
                  return path, order
              for nxt in sorted(roads[path[-1]]):
                  if nxt not in reached:
                      reached.add(nxt)
                      frontier.append(path + [nxt])

      def ucs(start, goal):
          frontier, best, order = [(0, [start])], {start: 0}, []
          while frontier:
              g, path = heapq.heappop(frontier)          # cheapest route first
              if g > best[path[-1]]:
                  continue                               # a cheaper copy was found later
              order.append(path[-1])
              if path[-1] == goal:
                  return path, order
              for nxt, miles in roads[path[-1]].items():
                  if g + miles < best.get(nxt, float("inf")):
                      best[nxt] = g + miles
                      heapq.heappush(frontier, (g + miles, path + [nxt]))

      for name, search in [("BFS", bfs), ("UCS", ucs)]:
          path, order = search("A", "G")
          miles = sum(roads[a][b] for a, b in zip(path, path[1:]))
          print(f"{name}: route {'-'.join(path)}, {miles} miles | expanded {' '.join(order)} ({len(order)})")
      ```

      BFS expands 6 towns and drives 17 miles; UCS expands 7 and drives 12. Now change the Brook–Greyhaven road from 12 to 6 miles. Both return A-B-G at 11 miles, because the fewest-roads route happens to be cheapest too.
    bridges: []
  - id: uninformed-search.s4
    title: Iterative deepening repeats bounded searches
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.uninformed-search
    markdown: |-
      Can you get BFS's fewest-roads answer with DFS's tiny memory? **Iterative deepening search** runs DFS with a depth limit of 0 roads, then 1, then 2, and so on, starting fresh each time, until it finds the goal.

      | Depth limit | Towns visited, in order | Goal found? |
      | ---: | --- | --- |
      | 0 | A | No |
      | 1 | A, B, C, F | No |
      | 2 | A, B, D, G | Yes: A → B → G |

      At limit 2, Dunmore sits at the limit, so the search backs up to Brook's next road, which reaches Greyhaven. It returns BFS's 2-road route after 1 + 4 + 4 = 9 visits instead of 6, holding only one short route in memory.

      :::predict The shallow levels get searched over and over. If every state has 10 actions and the goal is 5 moves deep, how much extra work does that cost?
      Surprisingly little: each level holds 10 times as many nodes as the one above, so the deepest level dominates. Not counting the start, BFS generates 10 + 100 + 1,000 + 10,000 + 100,000 = 111,110 nodes down to the goal's level. Iterative deepening generates the bottom level once, the level above it twice, and so on: 5 × 10 + 4 × 100 + 3 × 1,000 + 2 × 10,000 + 1 × 100,000 = 123,450. That's only about 11% more work.
      :::
    bridges: []
  - id: uninformed-search.compare
    title: Match the frontier rule to the job
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.uninformed-search
    markdown: |-
      In this table, $b$ is the **branching factor** (the number of actions per state) and $d$ is the depth of the shallowest goal.

      | Algorithm | Takes next | Returns | Memory |
      | --- | --- | --- | --- |
      | BFS | Oldest route | Fewest steps | Whole frontier, about $b^d$ |
      | DFS | Newest route | Some route | One route plus its siblings |
      | UCS | Lowest $g$ | Cheapest route | Whole frontier |
      | Iterative deepening | Newest, with a rising limit | Fewest steps | About $b \times d$ |

      A worked choice: a sliding-tile puzzle app, every move costing 1, solutions up to 20 moves deep. Equal costs make BFS optimal, but its frontier would swell to millions of boards. Iterative deepening finds the same answer storing one path. A road planner with unequal distances needs UCS instead.

      :::mixup "Breadth-first search finds the shortest route."
      It finds the route with the fewest *steps*. On the town map that's the 17-mile drive, 5 miles longer than the best. Fewest steps is shortest only when every step costs the same.
      :::

      All four are **uninformed** (or blind) searches: none of them knows which direction Greyhaven lies in. The next lesson gives search a sense of direction.
    bridges: []
  - id: uninformed-search.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.uninformed-search
    markdown: New maps, ferries, mazes, and puzzles ask you to trace a frontier, count the nodes a search generates, and pick the right search for the job.
    takeaway: |-
      The frontier rule is the algorithm. Oldest-first (BFS) finds the fewest steps, cheapest-first (UCS) finds the lowest cost, newest-first (DFS) saves memory, and iterative deepening gets BFS's answer with DFS's memory.
  - id: uninformed-search.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.uninformed-search
    markdown: |-
      The waiting-list rule changes the search: breadth-first favors few steps, depth-first follows a branch, and uniform-cost favors the cheapest path so far.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - uninformed-search.s1
        - uninformed-search.s2
        - uninformed-search.s3
