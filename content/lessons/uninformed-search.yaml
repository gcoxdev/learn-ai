  scene_aliases:
    uninformed-search.recap: uninformed-search.check
assessment_families:
  - id: uninformed-search.base
    objective_ref: objective.uninformed-search
    task: base
    response_type: single_choice
    points: 1
    hint: 'Depth-first follows a branch: trace the inputs, operation, and result before choosing.'
    remediation_scene: uninformed-search.s2
    variants:
      - id: uninformed-search.base.1
        prompt: With unequal edge costs, does breadth-first search always find the cheapest path?
        options:
          - id: a
            text: No; it prioritizes edge count
          - id: b
            text: Yes; depth always equals cost
          - id: c
            text: Only if a graph has labels
        answer: a
        feedback: Fewest edges and lowest total cost differ when costs vary.
        retired: true
      - id: uninformed-search.base.2
        prompt: What priority does uniform-cost search use?
        options:
          - id: b
            text: Only the final city name
          - id: c
            text: Maximum depth first
          - id: a
            text: Accumulated path cost
        answer: a
        feedback: It expands the frontier candidate with the smallest cost so far.
        retired: true
  - id: uninformed-search.transfer
    objective_ref: objective.uninformed-search
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Iterative deepening repeats bounded searches: trace the inputs, operation, and result before choosing.'
    remediation_scene: uninformed-search.s4
    variants:
      - id: uninformed-search.transfer.1
        prompt: A direct path costs 8; a two-edge path costs 3 + 2. Which is cheaper?
        options:
          - id: b
            text: The direct path because it has fewer edges
          - id: c
            text: They are equal
          - id: a
            text: The two-edge path, cost 5
        answer: a
        feedback: Cost is the sum of edge costs, not the number of edges.
        retired: true
      - id: uninformed-search.transfer.2
        prompt: A depth-first search can follow an infinite branch. What concern does that raise?
        options:
          - id: c
            text: It cannot use memory
          - id: a
            text: It may never reach an existing solution on another branch
          - id: b
            text: It must return the shortest solution immediately
        answer: a
        feedback: Completeness depends on the space and search safeguards.
        retired: true
  - id: uninformed-search.base.v2
    objective_ref: objective.uninformed-search
    task: base
    response_type: single_choice
    points: 1
    hint: Ask which route each algorithm takes off the frontier next. BFS takes the oldest, DFS the newest, and UCS the one with the lowest cost so far (g).
    remediation_scene: uninformed-search.s3
    variants:
      - id: uninformed-search.base.v2.1
        prompt: 'Roads (both ways): S–X 1 mile, S–Y 4 miles, X–Z 1 mile, Z–T 1 mile, Y–T 1 mile. Starting at S with goal T, which routes do BFS and UCS return?'
        options:
          - id: b
            text: Both return S-X-Z-T, the 3-mile route
          - id: a
            text: BFS returns S-Y-T; UCS returns S-X-Z-T
          - id: c
            text: BFS returns S-X-Z-T; UCS returns S-Y-T
        answer: a
        feedback: BFS finds the fewest roads, S-Y-T (2 roads, 5 miles). UCS finds the lowest cost, S-X-Z-T (3 roads, 3 miles). Assuming BFS is also cheapest is the classic mix-up.
      - id: uninformed-search.base.v2.2
        prompt: Uniform-cost search is planning a ferry trip. The destination port joins the frontier with cost 15, while an island with cost 6 is still waiting. What does UCS do next?
        options:
          - id: c
            text: Stop and return the route to the port, since it reached the goal
          - id: a
            text: Expand the island, since it has the lowest cost waiting
          - id: b
            text: Expand the port first, since goal routes take priority
        answer: a
        feedback: UCS always takes the lowest g next and checks the goal only when a route comes off the frontier. A route through the island might still reach the port for less than 15, as the 12-mile route through Elmwood did on the town map.
      - id: uninformed-search.base.v2.3
        prompt: A breadth-first frontier holds routes P, Q, R, oldest first. BFS expands P, which adds routes S and T. Which route comes off the frontier next?
        options:
          - id: b
            text: T, the route that was added most recently
          - id: c
            text: Whichever of Q, R, S, T has the lowest cost
          - id: a
            text: Q, the oldest route still waiting
        answer: a
        feedback: BFS is a queue, so the oldest waiting route (Q) goes next. Taking the newest (T) is depth-first, and taking the cheapest is uniform-cost.
      - id: uninformed-search.base.v2.4
        prompt: Iterative deepening runs depth limits 0, 1, 2, and so on. The shallowest goal is 3 roads from the start. With which limit does it first find the goal?
        options:
          - id: a
            text: Limit 3
          - id: b
            text: Limit 4
          - id: c
            text: Limit 2
        answer: a
        feedback: A limit of 3 lets the search go 3 roads deep, exactly where the goal is. Limit 2 stops one road short, and there's no need to reach limit 4, since the search stops as soon as it finds the goal.
      - id: uninformed-search.base.v2.5
        prompt: Depth-first search on a map tries roads in alphabetical order and skips towns already on its current route. What does it return?
        options:
          - id: c
            text: The route with the fewest roads to the goal
          - id: b
            text: The cheapest route to the goal
          - id: a
            text: The first route to the goal its road order leads to
        answer: a
        feedback: DFS dives down the first branch its ordering suggests and returns the first route that reaches the goal. On the town map that was A-B-D-G, 14 miles and 3 roads, neither the cheapest nor the fewest roads.
  - id: uninformed-search.transfer.v2
    objective_ref: objective.uninformed-search
    task: transfer
    response_type: single_choice
    points: 1
    hint: Decide what "best" means here (fewest steps, lowest cost, or any answer at all) and how much memory you can spare. Then pick the frontier rule that fits.
    remediation_scene: uninformed-search.compare
    variants:
      - id: uninformed-search.transfer.v2.1
        prompt: A robot must find any exit from a maze with millions of cells. Any exit will do, and the robot has very little memory. Which search suits it best?
        options:
          - id: b
            text: Breadth-first, since it explores level by level
          - id: a
            text: Depth-first, since it stores only its current path
          - id: c
            text: Uniform-cost, since it tracks the cost of each path
        answer: a
        feedback: When any solution will do and memory is tight, DFS's small footprint wins. BFS and UCS keep the whole frontier, which in a huge maze can be enormous.
      - id: uninformed-search.transfer.v2.2
        prompt: A delivery drone flies between rooftops, and the legs have very different lengths. It must use the least battery, which is proportional to distance. Which search should it use?
        options:
          - id: c
            text: Breadth-first, since it finds the fewest legs
          - id: b
            text: Iterative deepening, since it saves memory
          - id: a
            text: Uniform-cost, since it follows total distance
        answer: a
        feedback: With unequal leg lengths, only UCS orders routes by total cost. BFS and iterative deepening both minimize the number of legs, which can mean a longer flight.
      - id: uninformed-search.transfer.v2.3
        prompt: A sliding-tile puzzle solver must find the fewest moves. Solutions can be 20 moves deep, and a breadth-first frontier would need far more memory than the device has. What should it use?
        options:
          - id: a
            text: Iterative deepening, for BFS's answer in little memory
          - id: b
            text: Depth-first, since its memory stays small too
          - id: c
            text: Breadth-first, since it finds the fewest moves
        answer: a
        feedback: Iterative deepening returns the fewest-moves solution while storing one path at a time. Plain DFS also saves memory but can return a long, wandering solution, and BFS runs out of memory.
      - id: uninformed-search.transfer.v2.4
        prompt: A subway app wants the fewest-minutes trip, and every stop-to-stop hop takes 2 minutes. Which is the simplest search that finds the fastest trip?
        options:
          - id: b
            text: Depth-first, since it reaches far stations quickly
          - id: a
            text: Breadth-first, since every hop costs the same
          - id: c
            text: Iterative deepening, since BFS ignores travel time
        answer: a
        feedback: When every step costs the same, fewest hops means fewest minutes, so BFS is optimal. (UCS would also work, but it's more machinery than needed.) DFS returns whatever route its ordering finds first.
      - id: uninformed-search.transfer.v2.5
        prompt: A web crawler wants every page within 3 clicks of a home page. Depth-first crawling keeps following "next page" links through a huge archive. Which fix targets this?
        options:
          - id: c
            text: Follow the links in alphabetical order instead
          - id: b
            text: Give the archive links a smaller cost each
          - id: a
            text: Stop each branch at a depth limit of 3 clicks
        answer: a
        feedback: A depth limit, the core of iterative deepening, stops DFS from diving down an endless branch. Reordering or re-costing the links still lets it wander arbitrarily deep.
  - id: uninformed-search.calc.v2
    objective_ref: objective.uninformed-search
    task: base
    response_type: numeric
    points: 1
    hint: Level k of the tree has b^k nodes. BFS generates each level once. Iterative deepening generates the deepest level once, the level above it twice, and so on.
    remediation_scene: uninformed-search.s4
    absolute_tolerance: 0.001
    variants:
      - id: uninformed-search.calc.v2.1
        prompt: Every state has 3 actions, and the shallowest goal is 3 moves deep. Not counting the start, how many nodes does breadth-first search generate down to that depth?
        answer: 39
        feedback: 3 + 9 + 27 = 39. Counting only the bottom level (27) forgets the levels above it.
      - id: uninformed-search.calc.v2.2
        prompt: Every state has 3 actions, and the shallowest goal is 3 moves deep. Not counting the start, how many nodes does iterative deepening generate in total?
        answer: 54
        feedback: Level 1 is generated 3 times, level 2 twice, and level 3 once, so 3 × 3 + 2 × 9 + 1 × 27 = 9 + 18 + 27 = 54. BFS would generate 39.
      - id: uninformed-search.calc.v2.3
        prompt: Every state has 2 actions, and the shallowest goal is 5 moves deep. Not counting the start, how many nodes does breadth-first search generate down to that depth?
        answer: 62
        feedback: 2 + 4 + 8 + 16 + 32 = 62. Each level doubles the one above it.
      - id: uninformed-search.calc.v2.4
        prompt: Every state has 2 actions, and the shallowest goal is 4 moves deep. Not counting the start, how many nodes does iterative deepening generate in total?
        answer: 52
        feedback: 4 × 2 + 3 × 4 + 2 × 8 + 1 × 16 = 8 + 12 + 16 + 16 = 52. The shallowest level is regenerated on every pass, 4 times here.
      - id: uninformed-search.calc.v2.5
        prompt: Every state has 10 actions, and the shallowest goal is 3 moves deep. Not counting the start, how many nodes does iterative deepening generate in total?
        answer: 1230
        feedback: 3 × 10 + 2 × 100 + 1 × 1,000 = 1,230, only about 11% more than BFS's 1,110, because the bottom level dominates.
