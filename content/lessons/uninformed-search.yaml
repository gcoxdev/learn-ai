schema_version: 0.2-draft
lesson:
  id: uninformed-search
  version: 0.2.0-draft
  title: Choose an order for exploring possibilities
  state: draft
  summary: Compare four ways to manage a waiting list of routes, and decide when distance matters more than
    step count.
  slot: M05.2
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.uninformed-search
  version: 1-draft
  statement: Breadth-first, depth-first, uniform-cost, and iterative-deepening search prioritize candidates
    differently, producing different cost, memory, and completeness properties.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - uninformed-search.base
  - uninformed-search.transfer
  prerequisites:
  - anyOf:
    - objective.search-problems
scenes:
- id: uninformed-search.s1
  title: Breadth-first explores by depth
  type: explanation
  depth: intuition
  objective_refs:
  - objective.uninformed-search
  markdown: 'Breadth-first search uses a queue to expand shallower paths before deeper ones. It finds a solution
    with the fewest edges under standard finite-branching conditions. That is also minimum cost when every
    edge has the same positive cost, but not when edge costs differ. Its frontier can require substantial memory.


    The **frontier** is the waiting list of paths discovered but not yet explored. A **queue** takes the oldest
    waiting item first, like a line at a shop. If A connects to B and C, and B connects to D, breadth-first
    order can be A, B, C, D. Here **depth** counts steps from the start, not money or distance.'
  text_mode: 'Breadth-first search uses a queue to expand shallower paths before deeper ones. It finds a solution
    with the fewest edges under standard finite-branching conditions. That is also minimum cost when every
    edge has the same positive cost, but not when edge costs differ. Its frontier can require substantial memory.


    The **frontier** is the waiting list of paths discovered but not yet explored. A **queue** takes the oldest
    waiting item first, like a line at a shop. If A connects to B and C, and B connects to D, breadth-first
    order can be A, B, C, D. Here **depth** counts steps from the start, not money or distance.'
  bridges: []
- id: uninformed-search.s2
  title: Depth-first follows a branch
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.uninformed-search
  markdown: 'Depth-first search explores one branch before alternatives, commonly using a stack. It can use
    little frontier memory but may become stuck on an infinite branch without safeguards. Cycle detection and
    finite-state assumptions change completeness. The first solution found need not be shallow or cheap.


    A **stack** takes the newest waiting item first, like removing the top plate. With the same map and B explored
    first, depth-first order can be A, B, D, C. Draw these orders and notice that D is reached before the unexplored
    sibling C. A stopping rule prevents the procedure following a cycle such as A → B → A forever.'
  text_mode: 'Depth-first search explores one branch before alternatives, commonly using a stack. It can use
    little frontier memory but may become stuck on an infinite branch without safeguards. Cycle detection and
    finite-state assumptions change completeness. The first solution found need not be shallow or cheap.


    A **stack** takes the newest waiting item first, like removing the top plate. With the same map and B explored
    first, depth-first order can be A, B, D, C. Draw these orders and notice that D is reached before the unexplored
    sibling C. A stopping rule prevents the procedure following a cycle such as A → B → A forever.'
  bridges: []
- id: uninformed-search.s3
  title: Uniform-cost follows accumulated cost
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.uninformed-search
  markdown: 'Uniform-cost search expands the frontier path with the lowest cost so far. In a finite graph with
    nonnegative edge costs and correct cost bookkeeping, it can find a minimum-cost goal. A direct edge of
    cost 9 should lose to a two-edge route costing 2 + 3, even though the latter is deeper.


    For uniform-cost search, check a goal when its cheapest waiting path is taken out for expansion, not merely
    when the goal is first noticed. The first discovered route might cost 9 while an unfinished route will
    reach it for 5. Correct bookkeeping keeps that cheaper alternative eligible.'
  text_mode: 'Uniform-cost search expands the frontier path with the lowest cost so far. In a finite graph
    with nonnegative edge costs and correct cost bookkeeping, it can find a minimum-cost goal. A direct edge
    of cost 9 should lose to a two-edge route costing 2 + 3, even though the latter is deeper.


    For uniform-cost search, check a goal when its cheapest waiting path is taken out for expansion, not merely
    when the goal is first noticed. The first discovered route might cost 9 while an unfinished route will
    reach it for 5. Correct bookkeeping keeps that cheaper alternative eligible.'
  bridges: []
- id: uninformed-search.s4
  title: Iterative deepening repeats bounded searches
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.uninformed-search
  markdown: Iterative deepening runs depth-limited searches with increasing limits. It combines shallow-solution
    discovery with modest depth-first memory, at the expense of repeating earlier work. Choose an algorithm
    by the task’s costs, state space, memory budget, and assumptions, not by a universal ranking of names.
  text_mode: Iterative deepening runs depth-limited searches with increasing limits. It combines shallow-solution
    discovery with modest depth-first memory, at the expense of repeating earlier work. Choose an algorithm
    by the task’s costs, state space, memory budget, and assumptions, not by a universal ranking of names.
  bridges: []
- id: uninformed-search.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
