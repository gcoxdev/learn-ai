assessment_families:
  - id: typed-decision-questions.base
    objective_ref: objective.typed-decision-questions
    task: base
    response_type: single_choice
    points: 1
    hint: Match the question to the answer's shape (one of a list, an ordered level, or yes/no), then check the options overlap nowhere and leave nothing out.
    remediation_scene: typed-decision-questions.s1
    variants:
      - id: typed-decision-questions.base.1
        prompt: Tally wants to rate urgency from 0 (whenever) to 3 (right now), with each level described. Which question type fits?
        options:
          - id: b
            text: A choice, since it picks one answer from a list
          - id: a
            text: A score, since the levels have an order
          - id: c
            text: A noul, asked once for every level separately
        answer: a
        feedback: Urgency levels are ordered, so a score question lets a near miss count as nearer than a far one. A plain choice treats a wrong 2 and a wrong 0 alike. A noul answers a single yes/no.
      - id: typed-decision-questions.base.2
        prompt: Tally's route options include both "billing" and "refunds", and a refund-for-a-double-charge message gets 0.38 and 0.36 on the two. What is the underlying problem?
        options:
          - id: c
            text: The model is poorly calibrated and needs retraining
          - id: b
            text: The options overlap, so probability splits between them
          - id: a
            text: The message is too short for any model to read
        answer: b
        feedback: When two options both fit, probability divides between them and no answer looks confident. Merge them, or write descriptions that separate the cases. Retraining wouldn't fix an ambiguous list.
      - id: typed-decision-questions.base.3
        prompt: Why add an "other / unclear" option to the route question?
        options:
          - id: a
            text: A message that fits nothing isn't forced onto a wrong route
          - id: c
            text: It raises the probability of the best of the real options
          - id: b
            text: It makes every option list the same length
        answer: a
        feedback: Without an escape, the model has to put a message somewhere, and the wrong route can look confident. An "other" option gives the code a signal to ask a person. It doesn't raise the other options' probabilities.
      - id: typed-decision-questions.base.4
        prompt: Why does Tally ask four atomic questions instead of one question with 80 combined options?
        options:
          - id: c
            text: Atomic questions have more options, which gives finer answers
          - id: a
            text: Each question is easier to check, and code combines the answers
          - id: b
            text: A single question can only be about one thing at a time
        answer: a
        feedback: Small option lists are easier to write and test, and mistakes stay inside one question. The combining rules live in visible code. A giant question can be asked, but it hides all of that.
      - id: typed-decision-questions.base.5
        prompt: Tally's model says P(refund) = 0.62. The rules are to start the refund flow at 0.9 or above and say no at 0.1 or below. What happens?
        options:
          - id: b
            text: The refund starts, since 0.62 is above 0.5
          - id: c
            text: The message is marked "no refund", since 0.62 is below 0.9
          - id: a
            text: A person reviews it, since 0.62 sits in the middle band
        answer: a
        feedback: Between the two thresholds the model hasn't earned an automatic action in either direction. A single 0.5 line would act on a coin-flip-ish answer, and the "no" rule applies only at 0.1 or below.
      - id: typed-decision-questions.base.6
        prompt: A route answer comes back "repairs" with confidence 0.41, and Tally's threshold is 0.7. What should the code do?
        options:
          - id: c
            text: Act on repairs, because it is still the most likely option
          - id: b
            text: Ask the model again until the confidence reaches 0.7
          - id: a
            text: Send the message to a person or a second check
        answer: a
        feedback: The answer says what the model prefers, and the confidence says whether to act. At 0.41 the model is unsure, and asking again returns the same score unless the input changes.
  - id: typed-decision-questions.transfer
    objective_ref: objective.typed-decision-questions
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name the answer's shape first, then look for overlapping options, missing options, or combined questions, and fix that one problem.
    remediation_scene: typed-decision-questions.s2
    variants:
      - id: typed-decision-questions.transfer.1
        prompt: A restaurant wants to record how spicy each guest wants a dish, from mild through medium and hot to extra hot. Which question type fits?
        options:
          - id: b
            text: A choice, since there are four named options to pick from
          - id: c
            text: A noul, since each guest either wants spicy or doesn't
          - id: a
            text: A score, since the heat levels form an ordered scale
        answer: a
        feedback: The levels run in order, so being off by one level is a smaller miss than being off by three, and a score question keeps that order. A noul would reduce four levels to a single yes/no.
      - id: typed-decision-questions.transfer.2
        prompt: An airline lists reasons for a complaint as "delay", "late flight", "cancellation", and "baggage". Which fix helps most?
        options:
          - id: a
            text: Merge "delay" and "late flight" and add an "other" option
          - id: b
            text: Add "long delay" and "short delay" so there are more options
          - id: c
            text: Remove "baggage" so the list stays short
        answer: a
        feedback: Delay and late flight mean the same thing, so they split probability between them, and the list also has no place for complaints about food or staff. Adding more near-twins makes the split worse.
      - id: typed-decision-questions.transfer.3
        prompt: A bank wants six complaint categories plus three yes/no flags. A developer plans one question listing every combination. How many options is that, and what is the better design?
        options:
          - id: c
            text: 9 options, which is fine as one question
          - id: b
            text: 48 options, so ask one question per idea and combine in code
          - id: a
            text: 54 options, so ask one question per idea and combine in code
        answer: b
        feedback: Six categories times three yes/no flags is 6 × 2 × 2 × 2 = 48 options. Four small questions need only 6 + 2 + 2 + 2 = 12 probabilities and are easier to check. Counting each flag as 3 gives 54, which is a miscount.
      - id: typed-decision-questions.transfer.4
        prompt: A bank blocks a card payment automatically only at fraud probability 0.95 or above, and clears it at 0.20 or below. A payment scores 0.55. What should happen?
        options:
          - id: c
            text: Block it, since fraud is more likely than not
          - id: a
            text: Send it to an analyst, since it sits between the thresholds
          - id: b
            text: Clear it, since 0.55 is below the blocking threshold
        answer: a
        feedback: Neither automatic action is justified at 0.55, so a person decides. Blocking at "more likely than not" would freeze many good payments, and clearing it would let many bad ones through.
      - id: typed-decision-questions.transfer.5
        prompt: A support team writes refund options as "Yes, definitely", "Probably", and "No". What is the better design?
        options:
          - id: b
            text: Keep the three options and treat "Probably" as a yes
          - id: c
            text: Add "Maybe", so the model has an option for every degree of doubt
          - id: a
            text: Ask a yes/no question and read the doubt from its probability
        answer: a
        feedback: A yes/no question already returns how sure the model is, as P(true). Putting degrees of doubt into the options overlaps them and makes the probabilities hard to read. More hedge words would add more overlap.
      - id: typed-decision-questions.transfer.6
        prompt: A team asks "Is this message safe to auto-reply?" and gets different answers when they reword it as "Is this message unsafe to auto-reply?" Accuracy on known examples falls. What is the best next step?
        options:
          - id: c
            text: Keep the first wording and skip further tests, since it worked once
          - id: b
            text: Average the two wordings and assume the result is right
          - id: a
            text: Test each wording on labeled messages and keep the one that scores better
        answer: a
        feedback: Yes/no questions can follow the wording of their labels instead of the message, so compare wordings on messages with known answers. Averaging without testing hides the problem, and one good run isn't a test.
  - id: typed-decision-questions.calculate
    objective_ref: objective.typed-decision-questions
    task: base
    response_type: numeric
    points: 1
    hint: Multiply the option counts for the giant question, add them for the atomic questions (a yes/no counts as 2), then subtract.
    remediation_scene: typed-decision-questions.s3
    absolute_tolerance: 0.01
    variants:
      - id: typed-decision-questions.calculate.1
        prompt: One giant question would combine 4 routes, 4 urgency levels, and two yes/no flags. Atomic questions ask each separately. How many fewer probabilities do the atomic questions need?
        answer: 52
        feedback: The giant question has 4 × 4 × 2 × 2 = 64 options. The atomic ones need 4 + 4 + 2 + 2 = 12. The difference is 52.
      - id: typed-decision-questions.calculate.2
        prompt: A desk combines 5 routes, 4 urgency levels, and one yes/no flag into a single question, or asks three atomic questions. How many fewer probabilities do the atomic questions need?
        answer: 29
        feedback: 5 × 4 × 2 = 40 combined options, against 5 + 4 + 2 = 11. The difference is 29.
      - id: typed-decision-questions.calculate.3
        prompt: A giant question would combine 3 routes, 3 urgency levels, and one yes/no flag. Atomic questions ask each separately. How many fewer probabilities do the atomic questions need?
        answer: 10
        feedback: 3 × 3 × 2 = 18 combined options, against 3 + 3 + 2 = 8. The difference is 10.
      - id: typed-decision-questions.calculate.4
        prompt: A giant question would combine 6 routes, 4 urgency levels, and one yes/no flag. Atomic questions ask each separately. How many fewer probabilities do the atomic questions need?
        answer: 36
        feedback: 6 × 4 × 2 = 48 combined options, against 6 + 4 + 2 = 12. The difference is 36.
      - id: typed-decision-questions.calculate.5
        prompt: A giant question would combine 4 routes, 4 urgency levels, and three yes/no flags. Atomic questions ask each separately. How many fewer probabilities do the atomic questions need?
        answer: 114
        feedback: 4 × 4 × 2 × 2 × 2 = 128 combined options, against 4 + 4 + 2 + 2 + 2 = 14. The difference is 114.
