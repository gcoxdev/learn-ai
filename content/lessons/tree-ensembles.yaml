assessment_families:
  - id: tree-ensembles.base
    objective_ref: objective.tree-ensembles
    task: base
    response_type: single_choice
    points: 1
    hint: 'A forest randomizes the splits too: trace the inputs, operation, and result before choosing.'
    remediation_scene: tree-ensembles.s2
    variants:
      - id: tree-ensembles.base.1
        prompt: When does averaging help least with model error?
        options:
          - id: c
            text: Whenever there is more than one model
          - id: a
            text: When all models make the same error
          - id: b
            text: When errors differ usefully
        answer: a
        feedback: Perfectly correlated errors are not canceled by averaging.
        retired: true
      - id: tree-ensembles.base.2
        prompt: What additional randomness is characteristic of random forests?
        options:
          - id: a
            text: Considering subsets of features at splits
          - id: b
            text: Changing the test labels after scoring
          - id: c
            text: Removing every tree objective
        answer: a
        feedback: Feature randomness helps diversify tree predictions.
        retired: true
  - id: tree-ensembles.transfer
    objective_ref: objective.tree-ensembles
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Compare the mechanisms and risks: trace the inputs, operation, and result before choosing.'
    remediation_scene: tree-ensembles.s4
    variants:
      - id: tree-ensembles.transfer.1
        prompt: A new boosting stage is fitted to negative-gradient targets. What is its role?
        options:
          - id: a
            text: Reduce the current objective through an additive correction
          - id: b
            text: Vote independently with no relation to earlier stages
          - id: c
            text: Replace the data-collection process
        answer: a
        feedback: Boosting stages respond to the current model’s remaining error signal.
        retired: true
      - id: tree-ensembles.transfer.2
        prompt: Adding hundreds of stages lowers training loss but worsens validation. What should be considered?
        options:
          - id: b
            text: A guarantee that validation is invalid
          - id: c
            text: Only adding more stages indefinitely
          - id: a
            text: Overfitting and regularization or early stopping
        answer: a
        feedback: Training fit and generalization can diverge as complexity grows.
        retired: true
  - id: tree-ensembles.base.v2
    objective_ref: objective.tree-ensembles
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: The residual is target minus current prediction. Each stage adds learning rate × residual (here the new tree fits the residual exactly); then recompute the residual for the next stage.
    remediation_scene: tree-ensembles.s3
    variants:
      - id: tree-ensembles.base.v2.1
        prompt: 'A boosted model currently predicts 20 for a house whose true value is 12, with learning rate 0.5. Each new tree fits the current residual exactly. Find the first residual, the prediction after one stage, and the prediction after two stages.'
        feedback: The residual is 12 − 20 = −8, so stage one gives 20 + 0.5 × (−8) = 16. The new residual is −4, so stage two gives 16 − 2 = 14. Each stage closes half the remaining gap.
        answers:
          residual: -8
          stage1: 16
          stage2: 14
        reason_answer: leftover
        reason_options:
          - id: leftover
            text: Each new tree is fitted to what the current model still gets wrong.
          - id: fresh
            text: Each new tree is fitted to the original targets from scratch.
          - id: average
            text: Each new tree is fitted to the average of the earlier trees.
      - id: tree-ensembles.base.v2.2
        prompt: 'A boosted model currently predicts 5 for a customer who actually spends 15, with learning rate 0.1. Each new tree fits the current residual exactly. Find the first residual, the prediction after one stage, and the prediction after two stages.'
        feedback: The residual is 15 − 5 = 10, so stage one gives 5 + 0.1 × 10 = 6. The new residual is 9, so stage two gives 6 + 0.9 = 6.9. A small learning rate takes many stages but moves carefully.
        answers:
          residual: 10
          stage1: 6
          stage2: 6.9
        reason_answer: leftover
        reason_options:
          - id: fresh
            text: Each new tree is fitted to the original targets from scratch.
          - id: leftover
            text: Each new tree is fitted to what the current model still gets wrong.
          - id: average
            text: Each new tree is fitted to the average of the earlier trees.
      - id: tree-ensembles.base.v2.3
        prompt: 'A boosted model currently predicts 100 for a delivery that actually took 140 minutes, with learning rate 0.25. Each new tree fits the current residual exactly. Find the first residual, the prediction after one stage, and the prediction after two stages.'
        feedback: The residual is 140 − 100 = 40, so stage one gives 100 + 0.25 × 40 = 110. The new residual is 30, so stage two gives 110 + 7.5 = 117.5.
        answers:
          residual: 40
          stage1: 110
          stage2: 117.5
        reason_answer: leftover
        reason_options:
          - id: average
            text: Each new tree is fitted to the average of the earlier trees.
          - id: fresh
            text: Each new tree is fitted to the original targets from scratch.
          - id: leftover
            text: Each new tree is fitted to what the current model still gets wrong.
      - id: tree-ensembles.base.v2.4
        prompt: 'A boosted model currently predicts 3 for a patient whose true score is 1, with learning rate 0.5. Each new tree fits the current residual exactly. Find the first residual, the prediction after one stage, and the prediction after two stages.'
        feedback: The residual is 1 − 3 = −2, so stage one gives 3 + 0.5 × (−2) = 2. The new residual is −1, so stage two gives 2 − 0.5 = 1.5. Negative residuals pull the prediction down.
        answers:
          residual: -2
          stage1: 2
          stage2: 1.5
        reason_answer: leftover
        reason_options:
          - id: leftover
            text: Each new tree is fitted to what the current model still gets wrong.
          - id: average
            text: Each new tree is fitted to the average of the earlier trees.
          - id: fresh
            text: Each new tree is fitted to the original targets from scratch.
    absolute_tolerance: 0.01
    numeric_fields:
      - id: residual
        label: First residual (target − prediction)
      - id: stage1
        label: Prediction after one stage
      - id: stage2
        label: Prediction after two stages
  - id: tree-ensembles.transfer.v2
    objective_ref: objective.tree-ensembles
    task: transfer
    response_type: single_choice
    points: 1
    hint: Bagging and forests average many varied trees to cut their wobble, so ask how alike the trees are. Boosting adds small corrections in sequence, so ask where validation error stops falling.
    remediation_scene: tree-ensembles.s2
    variants:
      - id: tree-ensembles.transfer.v2.1
        prompt: A random forest of 300 trees is trained on 10,000 loan applications, each tree on its own bootstrap sample. For one application, about how many trees never saw it during training?
        options:
          - id: a
            text: About 190, since a sample misses roughly 63% of rows
          - id: b
            text: About 110, since a sample misses roughly 37% of rows
          - id: c
            text: None, since each sample has 10,000 rows like the original
        answer: b
        feedback: A sample misses a given row with probability (1 − 1/n)^n ≈ 1/e ≈ 0.368, and 0.368 × 300 ≈ 110. The 63% is the share of rows a sample does contain; the sample has 10,000 draws, but many are repeats.
      - id: tree-ensembles.transfer.v2.2
        prompt: A team bags deep trees to predict crop yield. One feature, rainfall, is far stronger than the others. Going from 50 to 500 trees barely changes validation error. What is the most promising change?
        options:
          - id: a
            text: Grow each tree deeper so that it captures more of the detail
          - id: b
            text: Add another 500 trees so the extra votes average out noise
          - id: c
            text: Let each split choose from a random subset of features
        answer: c
        feedback: With rainfall dominating, every tree splits on it first, so the trees are highly correlated and more of them can't lower the ρσ² floor. Random feature subsets (a random forest) make the trees disagree. Deeper trees would add wobble, not diversity.
      - id: tree-ensembles.transfer.v2.3
        prompt: A gradient-boosting run for insurance claims shows validation error falling until about stage 300, then slowly rising through stage 2,000, while training error keeps falling. What should the team do?
        options:
          - id: a
            text: Keep the model from around stage 300 and stop there
          - id: b
            text: Keep going past 2,000, since training error still falls
          - id: c
            text: Switch to deeper trees so each stage fixes more error
        answer: a
        feedback: This is early stopping. After stage 300 the new trees fit noise in the training data, so validation error rises. Falling training error is exactly what overfitting looks like, and deeper trees would overfit sooner.
      - id: tree-ensembles.transfer.v2.4
        prompt: Two boosting runs on the same data reach similar training error. Run A uses learning rate 1.0 and 50 trees; run B uses 0.1 and 500 trees. B does better on validation. What is the best explanation?
        options:
          - id: b
            text: B averages its 500 trees, so their noise cancels like in bagging
          - id: c
            text: Small steps spread each fix over many trees and fit less noise
          - id: a
            text: A lower learning rate grows deeper, more detailed trees
        answer: c
        feedback: With a small learning rate, each tree contributes a little and later trees can correct earlier ones, which tends to generalize better. Boosting adds its trees in sequence rather than averaging them, and the learning rate doesn't change tree depth.
      - id: tree-ensembles.transfer.v2.5
        prompt: 'A retailer predicts next month''s returns from a 40-column table of 50,000 orders: prices, dates, regions, and product codes in very different units. Which model is a strong first choice after a simple baseline?'
        options:
          - id: c
            text: One deep decision tree, as it can be read and explained
          - id: b
            text: Gradient-boosted trees, stopped early on held-out rows
          - id: a
            text: kNN on the raw columns, since it has no weights to fit
        answer: b
        feedback: Boosted trees handle mixed units, jumps, and weak columns without special preparation and do very well on tables like this. A single deep tree is readable but jumpy, and kNN on unscaled columns would let the biggest units dominate every distance.
