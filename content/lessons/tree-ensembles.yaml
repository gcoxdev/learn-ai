schema_version: 0.2-draft
lesson:
  id: tree-ensembles
  version: 0.1.0-draft
  title: Combine many imperfect predictors
  state: draft
  summary: Bagging reduces instability by averaging varied fits; random forests add feature randomness, while boosting
    builds an additive model that targets remaining error.
  slot: M07.5
  category: learning
  minutes: 12
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.tree-ensembles
  version: 1-draft
  statement: Bagging reduces instability by averaging varied fits; random forests add feature randomness, while
    boosting builds an additive model that targets remaining error.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - tree-ensembles.base
  - tree-ensembles.transfer
  prerequisites:
  - anyOf:
    - objective.decision-trees
  - anyOf:
    - objective.randomness-reproducibility
scenes:
- id: tree-ensembles.s1
  title: Average models that make different errors
  type: explanation
  depth: intuition
  objective_refs:
  - objective.tree-ensembles
  markdown: Bagging trains models on resampled training sets and combines predictions. Averaging can reduce variance
    when errors are not perfectly correlated. If every model makes exactly the same mistake, voting does not fix
    it. Diversity must coexist with useful individual predictors.
  text_mode: Bagging trains models on resampled training sets and combines predictions. Averaging can reduce variance
    when errors are not perfectly correlated. If every model makes exactly the same mistake, voting does not fix
    it. Diversity must coexist with useful individual predictors.
  bridges: []
- id: tree-ensembles.s2
  title: A forest randomizes the splits too
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tree-ensembles
  markdown: Random forests use trees with randomness in examples and candidate features. Restricting features considered
    at a split can reduce correlation between trees. Out-of-bag examples offer a useful internal evaluation mechanism
    under the bootstrap setup, but do not replace every external validation requirement.
  text_mode: Random forests use trees with randomness in examples and candidate features. Restricting features considered
    at a split can reduce correlation between trees. Out-of-bag examples offer a useful internal evaluation mechanism
    under the bootstrap setup, but do not replace every external validation requirement.
  bridges: []
- id: tree-ensembles.s3
  title: Boosting adds corrections sequentially
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tree-ensembles
  markdown: Gradient boosting adds a weak learner aimed at reducing the current objective, often by fitting negative-gradient
    targets. For squared error, these correspond to residual-like corrections. A learning rate scales each addition.
    The method depends on loss, tree complexity, number of stages, and regularization.
  text_mode: Gradient boosting adds a weak learner aimed at reducing the current objective, often by fitting negative-gradient
    targets. For squared error, these correspond to residual-like corrections. A learning rate scales each addition.
    The method depends on loss, tree complexity, number of stages, and regularization.
  bridges: []
- id: tree-ensembles.s4
  title: Compare the mechanisms and risks
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tree-ensembles
  markdown: Bagging emphasizes averaging variable fits; boosting builds a staged additive predictor. Neither is
    simply “more trees means better.” Excessive boosting can fit noise, and correlated training data can undermine
    evaluation. Use held-out tests, inspect errors, and compare resource cost with simpler alternatives.
  text_mode: Bagging emphasizes averaging variable fits; boosting builds a staged additive predictor. Neither is
    simply “more trees means better.” Excessive boosting can fit noise, and correlated training data can undermine
    evaluation. Use held-out tests, inspect errors, and compare resource cost with simpler alternatives.
  bridges: []
- id: tree-ensembles.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.tree-ensembles
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: tree-ensembles.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.tree-ensembles
  markdown: Bagging reduces instability by averaging varied fits; random forests add feature randomness, while boosting
    builds an additive model that targets remaining error.
  text_mode: Bagging reduces instability by averaging varied fits; random forests add feature randomness, while
    boosting builds an additive model that targets remaining error.
