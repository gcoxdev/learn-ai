schema_version: 0.2-draft
lesson:
  id: tree-ensembles
  version: 0.3.0-draft
  title: Combine many imperfect predictors
  state: draft
  summary: Compare averaging several trees with building a sequence of small corrections.
  slot: M07.5
  category: learning
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.tree-ensembles
  version: 1-draft
  statement: Bagging reduces instability by averaging varied fits; random forests add feature randomness, while
    boosting builds an additive model that targets remaining error.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - tree-ensembles.base
  - tree-ensembles.transfer
  prerequisites:
  - anyOf:
    - objective.decision-trees
  - anyOf:
    - objective.randomness-reproducibility
scenes:
- id: tree-ensembles.s1
  title: Combine models that make different mistakes
  type: explanation
  depth: intuition
  objective_refs:
  - objective.tree-ensembles
  markdown: 'An **ensemble** combines several models. **Bagging**, short for bootstrap aggregating, trains
    each model on a resampled training set and combines their predictions.


    A **bootstrap sample** draws examples with replacement: one record can appear twice while another is left
    out. These different samples can lead the models to make different errors. Predictions 8, 10, and 12 average
    to 10; three predictions of 8 still average to 8.


    Averaging can reduce variation between fitted models when their errors are not perfectly correlated. The
    models need both useful predictions and enough differences for the combination to help.'
  text_mode: 'An **ensemble** combines several models. **Bagging**, short for bootstrap aggregating, trains
    each model on a resampled training set and combines their predictions.


    A **bootstrap sample** draws examples with replacement: one record can appear twice while another is left
    out. These different samples can lead the models to make different errors. Predictions 8, 10, and 12 average
    to 10; three predictions of 8 still average to 8.


    Averaging can reduce variation between fitted models when their errors are not perfectly correlated. The
    models need both useful predictions and enough differences for the combination to help.'
  bridges: []
- id: tree-ensembles.s2
  title: A forest randomizes the splits too
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tree-ensembles
  markdown: 'Random forests use trees with randomness in examples and candidate features. Restricting features
    considered at a split can reduce correlation between trees. Out-of-bag examples offer a useful internal
    evaluation mechanism under the bootstrap setup, but do not replace every external validation requirement.


    An **out-of-bag** example was not drawn for a particular tree''s training sample. That tree can predict
    it without having fitted it directly. Aggregating these predictions supplies an internal check, provided
    the sampling assumptions fit the data. Repeated records from the same person can still create dependence.'
  text_mode: 'Random forests use trees with randomness in examples and candidate features. Restricting features
    considered at a split can reduce correlation between trees. Out-of-bag examples offer a useful internal
    evaluation mechanism under the bootstrap setup, but do not replace every external validation requirement.


    An **out-of-bag** example was not drawn for a particular tree''s training sample. That tree can predict
    it without having fitted it directly. Aggregating these predictions supplies an internal check, provided
    the sampling assumptions fit the data. Repeated records from the same person can still create dependence.'
  bridges: []
- id: tree-ensembles.s3
  title: Boosting adds corrections sequentially
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tree-ensembles
  markdown: 'Gradient boosting adds a weak learner aimed at reducing the current objective, often by fitting
    negative-gradient targets. For squared error, these correspond to residual-like corrections. A learning
    rate scales each addition. The method depends on loss, tree complexity, number of stages, and regularization.


    A **weak learner** is a deliberately limited component, often a shallow tree. Suppose the current prediction
    is 6 and the target is 10. For a half-squared-error objective, the desired correction is target minus prediction,
    or +4. If a new tree predicts that correction and the learning rate is 0.25, the updated prediction is
    6 + 0.25 × 4 = 7. The next stage works on what remains.'
  text_mode: 'Gradient boosting adds a weak learner aimed at reducing the current objective, often by fitting
    negative-gradient targets. For squared error, these correspond to residual-like corrections. A learning
    rate scales each addition. The method depends on loss, tree complexity, number of stages, and regularization.


    A **weak learner** is a deliberately limited component, often a shallow tree. Suppose the current prediction
