  bridges: []
- id: tree-ensembles.s4
  title: Compare the mechanisms and risks
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tree-ensembles
  markdown: Bagging emphasizes averaging variable fits; boosting builds a staged additive predictor. Neither
    is simply “more trees means better.” Excessive boosting can fit noise, and correlated training data can
    undermine evaluation. Use held-out tests, inspect errors, and compare resource cost with simpler alternatives.
  text_mode: Bagging emphasizes averaging variable fits; boosting builds a staged additive predictor. Neither
    is simply “more trees means better.” Excessive boosting can fit noise, and correlated training data can
    undermine evaluation. Use held-out tests, inspect errors, and compare resource cost with simpler alternatives.
  bridges: []
- id: tree-ensembles.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.tree-ensembles
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Bagging averages models fitted to different samples. Random forests also vary the features considered
    at each split. Boosting adds models in sequence to improve the current prediction.
