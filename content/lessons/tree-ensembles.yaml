schema_version: 0.2-draft
lesson:
  id: tree-ensembles
  version: 0.4.0-draft
  title: Combine many imperfect predictors
  state: draft
  summary: One decision tree is jumpy. Fifty trees voting, or a chain of small trees each fixing the last one's mistakes, give the models that still win most spreadsheet problems.
  slot: M07.5
  category: learning
  sources:
    - title: An Introduction to Statistical Learning — authors’ materials
      url: https://www.statlearning.com/
    - title: "Breiman (2001), Random Forests"
      url: https://doi.org/10.1023/A:1010933404324
    - title: "Chen & Guestrin (2016), XGBoost: A Scalable Tree Boosting System"
      url: https://arxiv.org/abs/1603.02754
objectives:
  - id: objective.tree-ensembles
    version: 2-draft
    statement: Bagging reduces instability by averaging varied fits; random forests add feature randomness, while boosting builds an additive model that targets remaining error.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - tree-ensembles.base.v2
      - tree-ensembles.transfer.v2
    prerequisites:
      - anyOf:
          - objective.decision-trees
      - anyOf:
          - objective.randomness-reproducibility
scenes:
  - id: tree-ensembles.s1
    title: Ask fifty jumpy trees instead of one
    type: explanation
    depth: intuition
    objective_refs:
      - objective.tree-ensembles
    markdown: |-
      In 1907 Francis Galton reported on a country-fair contest to guess an ox's weight. Single guesses varied wildly, but the middle guess of roughly 800 entries was 1,207 lb, against a true 1,198 lb: within 1%. Errors pointing in different directions cancel.

      A deep decision tree is jumpy: a few changed rows can reshape it. So grow many trees and let them vote. A group of models whose predictions are combined is an **ensemble**.

      To get different trees from one dataset, give each tree a different **bootstrap sample**: draw rows at random *with replacement* until you have as many as the original. Some rows get drawn twice or more, and others not at all. Train one deep tree per sample, then average their predictions (or take a majority vote for classes). That's **bagging**, short for bootstrap aggregating, introduced by Leo Breiman in 1996.

      How much of the data does each tree see? One draw misses a given row with probability $1 - 1/n$, so all $n$ draws miss it with probability

      $$\left(1 - \frac{1}{n}\right)^n \approx \frac{1}{e} \approx 0.368$$

      Each bootstrap sample therefore contains about 63.2% of the distinct rows ($1 - 1/e$). The other 36.8% are that tree's **out-of-bag** rows: rows it never trained on, which come in handy shortly.
    bridges: []
  - id: tree-ensembles.s5
    title: Averaging shrinks the wobble
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tree-ensembles
    markdown: |-
      Does averaging help? Simulate 300 fresh datasets of 30 streaming users, predicting next month's viewing hours from this week's (the true answer at 5 hours is 5). On one feature, a fully grown tree predicts with the closest training user, which the code uses as a shortcut.

      ```python run
      import numpy as np
      data_rng, boot_rng = np.random.default_rng(0), np.random.default_rng(1)
      B = 50                                     # number of trees in the bag

      def deep_tree(x, y, q):
          """Prediction at q of a tree grown until every leaf holds one distinct x value
          (thresholds halfway between neighbors): the target of the closest training point."""
          gap = np.abs(x - q)
          return y[gap == gap.min()].mean()

      single, bagged, seen = [], [], []
      for trial in range(300):                   # 300 fresh datasets of 30 users
          x = data_rng.uniform(0, 10, 30)        # hours watched this week
          y = x + data_rng.normal(0, 2, 30)      # hours watched next month (noisy)
          single.append(deep_tree(x, y, 5.0))
          votes = []
          for b in range(B):                     # B trees, each on a bootstrap sample
              i = boot_rng.integers(0, 30, 30)   # draw 30 rows with replacement
              seen.append(len(np.unique(i)) / 30)
              votes.append(deep_tree(x[i], y[i], 5.0))
          bagged.append(np.mean(votes))

      print("true value at 5 hours: 5.00")
      print(f"one deep tree:     average {np.mean(single):.2f}, spread (std) {np.std(single):.2f}")
      print(f"bag of {B:3d} trees: average {np.mean(bagged):.2f}, spread (std) {np.std(bagged):.2f}")
      print(f"share of rows each bootstrap sample contains: {np.mean(seen):.3f}")
      ```

      Both are right on average (5.04 and 4.97), but the single tree's predictions spread with a standard deviation of 2.02, the bag's only 1.41. Each sample held 63.8% of the rows, just as $1 - (1 - 1/30)^{30}$ predicts (it approaches $1 - 1/e$ for large datasets).

      :::predict Would 200 trees instead of 50 shrink the spread to nearly zero?
      No. Set `B = 200` (the run takes a few seconds) and the spread stays at 1.41. The trees were all grown from the same 30 users, so their errors are correlated. For $B$ trees, each with variance $\sigma^2$ and pairwise correlation $\rho$ (how closely two trees' errors move together: 0 for unrelated, 1 for identical), the average has variance $\rho\sigma^2 + (1 - \rho)\sigma^2 / B$. Here $\sigma = 2.02$ and the bag's 1.41 imply $\rho \approx 0.48$. More trees shrink only the second term, so the spread can't fall below about $\sqrt{0.48} \times 2.02 \approx 1.40$. To do better, make the trees less alike. (Try `B = 1` too: one bootstrapped tree wobbles as much as a plain one.)
      :::
    bridges: []
  - id: tree-ensembles.s2
    title: A forest randomizes the splits too
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tree-ensembles
    markdown: |-
      If one feature, say "shows watched in week 1," is much stronger than the rest, almost every bagged tree splits on it first, so the trees stay alike.

      A **random forest** (Breiman, 2001) breaks this up. At every split, each tree may choose only from a random handful of features, often about $\sqrt{p}$ of the $p$ available for classification. Some trees must start with a weaker feature and find other patterns. Each tree gets a little worse, but they disagree more, and the lower $\rho$ improves the average.

      Forests also come with a free check. Each row is out-of-bag for roughly 37% of the trees, about 184 of 500. Predict each row using only those trees, which never trained on it, and score the results: the **out-of-bag error** is an estimate of performance on new data without setting aside a separate validation set. If one household appears in many rows, though, its other rows sit in the trees' training samples and flatter the out-of-bag score, so group such rows together or use a proper held-out set.
    bridges: []
  - id: tree-ensembles.s3
    title: Boosting fixes the leftovers, one small tree at a time
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tree-ensembles
    markdown: |-
      Bagging grows trees independently and averages them. **Boosting** builds a model in stages instead. Each stage adds a **weak learner**, a deliberately simple model such as a two-level tree, trained to fix what the current model still gets wrong.

      For squared error, that's just the residual, taken here as target minus current prediction, so adding it moves the prediction the right way. Take one user whose next-month viewing is 10 hours while the current model predicts 6. The new tree learns the correction +4, and a **learning rate** of 0.25 adds a quarter of it: 6 + 0.25 × 4 = 7. The next stage sees a residual of 3 and moves the prediction to 7.75, then 8.31. If every tree fixed its residual exactly, the gap after 10 stages would be 4 × 0.75¹⁰ ≈ 0.23.

      :::papers Gradient boosting
      Friedman's gradient boosting (2001) writes the model after $m$ stages as

      $$F_m(x) = F_{m-1}(x) + \nu\, h_m(x)$$

      where $h_m$ is a small tree fitted to the residuals $r_i = y_i - F_{m-1}(x_i)$ and $\nu$ is the learning rate. For squared loss, the residual is the negative gradient of $\tfrac{1}{2}(y - F)^2$ with respect to $F$; other losses swap in their own negative gradient. Above, $F_0 = 6$, $r = 4$, $\nu = 0.25$, and $F_1 = 7$.
      :::

      :::mixup "Boosting can't overfit, since every stage lowers the training error."
      That's exactly why it can overfit: keep adding stages and the trees fit noise. Stop adding trees when validation error stops falling (**early stopping**). A small learning rate with more trees usually generalizes better than big steps.
      :::
    bridges: []
  - id: tree-ensembles.s4
    title: Why boosted trees still win on spreadsheets
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tree-ensembles
    markdown: |-
      | | Bagging and random forests | Gradient boosting |
      | --- | --- | --- |
      | Trees are grown | Independently (easy to run in parallel) | In sequence, each fixing the last |
      | Typical tree | Deep, jumpy | Shallow, weak |
      | Mainly reduces | Variance (the wobble) | Bias (the systematic miss) |
      | Main knobs | Number of trees, features per split | Learning rate, tree depth, number of stages |

      XGBoost (Chen and Guestrin, 2016) made gradient boosting fast and well regularized, and it became a competition staple: its paper reports that 17 of the 29 winning solutions published on Kaggle's blog in 2015 used it. LightGBM and CatBoost followed. For tables, with rows of customers or transactions and columns that each mean something different, boosted trees remain among the strongest choices; Grinsztajn, Oyallon and Varoquaux (2022) found them ahead of deep networks on many medium-sized tabular benchmarks. Trees shrug off columns in wildly different units, sudden jumps in the target, and useless columns.

      So for a new spreadsheet problem, a sensible first plan is a simple baseline, then a random forest, then gradient boosting with early stopping, all scored on the same held-out rows.
    bridges: []
  - id: tree-ensembles.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.tree-ensembles
    markdown: Step boosting predictions forward by hand, then diagnose forests that stop improving, boosting runs that overfit, and out-of-bag counts.
    takeaway: |-
      Bagging and random forests average many varied trees to cancel their wobble. Boosting adds small trees in sequence, each fixing what's left of the error, so stop it when validation error stops falling.
  - id: tree-ensembles.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.tree-ensembles
    markdown: |-
      Bagging averages models fitted to different samples. Random forests also vary the features considered at each split. Boosting adds models in sequence to improve the current prediction.
