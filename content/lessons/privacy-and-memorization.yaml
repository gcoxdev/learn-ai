schema_version: 0.2-draft
lesson:
  id: privacy-and-memorization
  version: 0.4.0-draft
  title: Understand what training and deployment can reveal about data
  state: draft
  summary: Researchers got a chatbot to recite its training data by asking it to repeat one word forever. See how models leak, and how to add just enough noise to protect one person.
  slot: M29.3
  category: learning
  sources:
    - title: Deep Learning with Differential Privacy (Abadi et al., 2016)
      url: https://arxiv.org/abs/1607.00133
    - title: Extracting Training Data from Large Language Models (Carlini et al., 2021)
      url: https://arxiv.org/abs/2012.07805
    - title: Extracting Training Data from Diffusion Models (Carlini et al., 2023)
      url: https://arxiv.org/abs/2301.13188
    - title: Scalable Extraction of Training Data from (Production) Language Models (Nasr et al., 2023)
      url: https://arxiv.org/abs/2311.17035
    - title: Membership Inference Attacks against Machine Learning Models (Shokri et al., 2017)
      url: https://arxiv.org/abs/1610.05820
    - title: The Algorithmic Foundations of Differential Privacy (Dwork & Roth, 2014)
      url: https://www.cis.upenn.edu/~aaroth/Papers/privacybook.pdf
    - title: Simple Demographics Often Identify People Uniquely (Sweeney, 2000)
      url: https://dataprivacylab.org/projects/identifiability/paper1.pdf
objectives:
  - id: objective.privacy-and-memorization
    version: 2-draft
    statement: Privacy risks arise from memorization, membership signals, extraction, and application data flows; differential privacy bounds a defined training-data influence while other controls address storage and access.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - privacy-and-memorization.base.v2
      - privacy-and-memorization.transfer.v2
      - privacy-and-memorization.noise
    prerequisites:
      - anyOf:
          - objective.data-provenance
      - anyOf:
          - objective.information-theory
      - anyOf:
          - objective.stochastic-gradients
scenes:
  - id: privacy-and-memorization.s1
    title: A poem, a poem, a poem, and then an email address
    type: explanation
    depth: intuition
    objective_refs:
      - objective.privacy-and-memorization
    markdown: |-
      In late 2023, Milad Nasr, Nicholas Carlini, and colleagues asked ChatGPT to repeat the word "poem" forever. After many repetitions it drifted off course and began printing text copied word for word from its training data, including a real person's email signature with contact details. OpenAI has since blocked the trick, but the point stands: the model had stored that text, and a strange enough prompt brought it out.

      You met an earlier case in the lesson on scaling and memorization: in 2021, Carlini's team pulled names, phone numbers, and email addresses out of GPT-2. In 2023 the same group extracted over a thousand training images, including photos of real people, from image generators such as Stable Diffusion. Images repeated many times in the training data were the easiest to pull out, so deduplication, from the lesson on pretraining data, is also a privacy tool.

      Getting a model to reproduce its training data is **training-data extraction**. Suppose Riverbend General fine-tunes a model on 200,000 of its discharge notes to help doctors write new ones. Extraction would mean a user coaxing out a real patient's note. There's a subtler risk too.
    bridges: []
  - id: privacy-and-memorization.membership
    title: Was this note in the training set?
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.privacy-and-memorization
    markdown: |-
      Suppose Riverbend's model was fine-tuned only on notes from its HIV clinic. Then learning that someone's note was *in* the training set reveals their diagnosis, even if no text leaks. Guessing whether a record was used in training is **membership inference** (Shokri et al., 2017).

      The simplest attack uses the model's **loss**, how surprised it is by a text; models are less surprised by text they trained on. An attacker with ten notes, five used in training and five not, guesses "member" whenever the loss is below 0.5:

      | | Losses | Below 0.5 |
      | --- | --- | ---: |
      | Training notes | 0.2, 0.3, 0.4, 0.9, 0.3 | 4 of 5 |
      | Unseen notes | 1.1, 0.8, 1.4, 0.45, 1.0 | 1 of 5 |

      The attacker is right on 4 + 4 = 8 of 10 notes, 80%, against 50% for coin-flipping. The wider the gap between training and unseen loss (the generalization gap), the better this attack works.

      :::mixup "We removed the names, so the data is anonymous."
      In 2000, Latanya Sweeney estimated that 87% of the US population could be uniquely identified by just ZIP code, sex, and date of birth. In 1997 she had picked out Massachusetts Governor William Weld's hospital records from a "de-identified" state dataset using those fields and a voter roll. Removing names is only a start.
      :::
    bridges: []
  - id: privacy-and-memorization.s3
    title: Add noise sized to one person
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.privacy-and-memorization
    markdown: |-
      Riverbend wants to publish how many patients in each town have a rare condition. Smallville has 37. If it publishes 37, and next month 36, anyone who knows a Smallville patient moved away learns her diagnosis.

      **Differential privacy** (DP) fixes this with a promise: whatever gets published would have been almost as likely with or without any one person in the data. A number **ε** (epsilon) sets how close "almost" is; smaller ε means a stronger promise.

      The **Laplace mechanism** keeps the promise by adding random noise from a Laplace distribution, a sharp-peaked bell curve. Its width, the scale $b$, is

      $$b = \frac{\Delta}{\varepsilon}$$

      where the **sensitivity** $\Delta$ is the most one person can change the true answer. For a count, $\Delta = 1$. At ε = 1 the scale is 1, and a typical published value is off by about 1 patient.

      :::predict Riverbend's privacy officer wants ε = 0.1 instead. How large is the noise, and is the Smallville count still useful?
      $b = 1/0.1 = 10$, so a typical error is about 10 patients on a true count of 37: barely useful. On a statewide count of 3,700, the same noise is about 0.3%. DP is gentle on big totals and harsh on small ones.
      :::

      Run it. The last lines check the promise: at ε = 1, removing one patient changes the likelihood of any output by at most a factor of $e^1 \approx 2.72$ either way.

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      true_count = 37      # patients with the condition in one small town
      sensitivity = 1      # adding or removing one patient changes the count by at most 1

      for eps in [2.0, 1.0, 0.5, 0.1]:
          b = sensitivity / eps                        # Laplace noise scale
          releases = true_count + rng.laplace(0, b, size=10_000)
          typical_error = np.mean(np.abs(releases - true_count))
          print(f"eps = {eps:<4} scale b = {b:<5} one release: {releases[0]:6.1f}   "
                f"average error: {typical_error:5.2f}   e^eps = {np.exp(eps):.2f}")

      # The privacy promise: with or without one patient (37 vs 36), the chance of
      # any output differs by at most a factor of e^eps.
      eps, b = 1.0, 1.0
      for x in [30.0, 36.5, 40.0]:
          with_her = np.exp(-abs(x - 37) / b)
          without = np.exp(-abs(x - 36) / b)
          print(f"output {x}: likelihood ratio {with_her / without:.2f} (limit {np.exp(eps):.2f})")
      ```

      The average error comes out close to $b$ each time. Now try a sum of visits where each patient contributes up to 3: set `sensitivity = 3` and watch every error triple.

      :::papers The definition (Dwork, McSherry, Nissim & Smith, 2006)
      A randomized mechanism $M$ is ε-differentially private if, for any two datasets $D$ and $D'$ that differ in one person, and any set of outputs $S$,
      $$P[M(D) \in S] \le e^{\varepsilon}\, P[M(D') \in S].$$
      Here $D$ is Smallville with the patient (37) and $D'$ without her (36). The common relaxation, $(\varepsilon, \delta)$-DP, adds a small slack $\delta$ to the right-hand side.
      :::
    bridges: []
  - id: privacy-and-memorization.s4
    title: Clip, add noise, and count the budget
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.privacy-and-memorization
    markdown: |-
      Training a model is a long series of releases: every gradient step uses the data. **DP-SGD** (Abadi et al., 2016) makes each step private in three moves:

      1. **Clip** each example's gradient to a maximum length $C$. A patient whose gradient has length 5, with $C = 1$, gets scaled down to length 1. That caps the sensitivity: no single example can push the model further than $C$.
      2. **Add noise** from a Gaussian distribution, scaled to $C$, to the sum of the clipped gradients.
      3. **Count the privacy spent.** A privacy accountant tracks the total ε used across the whole run.

      The price is accuracy: DP-trained models usually score lower than ordinary ones, most of all on rare cases. That is partly the point, since rare cases are exactly what a model would otherwise memorize.

      :::mixup "The noise is random, so just ask the same question many times and average."
      Averaging does cancel the noise, which is why each answer spends privacy. Under basic composition, 10 queries at ε = 0.5 each cost ε = 5 in total. A DP system tracks a **privacy budget** and stops answering when it runs out.
      :::

      :::story The 2020 US census
      The US Census Bureau protected its published 2020 census tables with differential privacy, arguing that older methods no longer resisted modern re-identification. Some demographers and local officials objected to noisier counts for small towns and groups: the Smallville trade-off at national scale.
      :::
    bridges: []
  - id: privacy-and-memorization.s2
    title: The safest data is data you never kept
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.privacy-and-memorization
    markdown: |-
      Most privacy failures in AI products don't involve the model's weights at all. They happen in logs, caches, prompts, retrieved documents, and analytics tools. So first ask whether you need the data. Riverbend's privacy officer rewrote the note assistant's design line by line:

      | Before | Risk | After |
      | --- | --- | --- |
      | Fine-tune on 200,000 notes | Extraction and membership inference | No fine-tuning; retrieve only this patient's past notes, filtered by the doctor's access |
      | Log every full prompt for 90 days | Anyone with log access sees diagnoses | Log request IDs and error codes for 14 days |
      | Send prompts to an outside analytics tool | Data leaves the hospital | Count usage inside the hospital |
      | Keep unsigned notes forever | Data outlives its purpose | Delete them once the final note is signed |

      This is **data minimization**: collect only what the task needs, keep it only as long as needed, and let as few people and systems see it as possible. Each "after" removes a leak instead of guarding it. When you really must train on sensitive data, deduplicate first, plant fake "canary" records and test whether they can be extracted, and consider DP-SGD.
    bridges:
      - probability
  - id: privacy-and-memorization.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.privacy-and-memorization
    markdown: Size Laplace noise from ε and sensitivity, then find the leak in a clinic chatbot's logs, a "de-identified" dataset, a small-area count, and an analyst who keeps asking.
    takeaway: |-
      Models can leak training data through extraction and membership inference. Differential privacy adds noise of scale sensitivity ÷ ε, and every answer spends budget, but the biggest wins come from not collecting or keeping data you don't need.
  - id: privacy-and-memorization.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.privacy-and-memorization
    markdown: |-
      Privacy risks can come from learned information and from application data flows. Differential privacy bounds a defined contribution’s influence; storage and access still need their own controls.
