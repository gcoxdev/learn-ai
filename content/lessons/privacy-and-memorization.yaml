schema_version: 0.2-draft
lesson:
  id: privacy-and-memorization
  version: 0.1.0-draft
  title: Understand what training and deployment can reveal about data
  state: draft
  summary: Privacy risks arise from memorization, membership signals, extraction, and application data flows; differential
    privacy bounds a defined training-data influence while other controls address storage and access.
  slot: M29.3
  category: learning
  sources:
  - title: Deep Learning with Differential Privacy
    url: https://arxiv.org/abs/1607.00133
  - title: Extracting Training Data from LLMs
    url: https://arxiv.org/abs/2012.07805
objectives:
- id: objective.privacy-and-memorization
  version: 1-draft
  statement: Privacy risks arise from memorization, membership signals, extraction, and application data flows;
    differential privacy bounds a defined training-data influence while other controls address storage and access.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - privacy-and-memorization.base
  - privacy-and-memorization.transfer
  prerequisites:
  - anyOf:
    - objective.data-provenance
  - anyOf:
    - objective.information-theory
  - anyOf:
    - objective.stochastic-gradients
scenes:
- id: privacy-and-memorization.s1
  title: Different attacks ask different questions
  type: explanation
  depth: intuition
  objective_refs:
  - objective.privacy-and-memorization
  markdown: Membership inference asks whether a record participated in training. Extraction seeks training content
    or sensitive details. A model can generalize usefully and still memorize some unusual sequences. Removing obvious
    names does not guarantee anonymity when other fields can identify someone.
  text_mode: Membership inference asks whether a record participated in training. Extraction seeks training content
    or sensitive details. A model can generalize usefully and still memorize some unusual sequences. Removing obvious
    names does not guarantee anonymity when other fields can identify someone.
  bridges: []
- id: privacy-and-memorization.s2
  title: Trace privacy through the application
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.privacy-and-memorization
  markdown: Prompts, retrieved documents, logs, caches, backups, and tool calls can expose data independently of
    model training. Minimize unnecessary collection and retain access and deletion rules across derived state. A
    local model does not make unrelated network telemetry or shared logs private automatically.
  text_mode: Prompts, retrieved documents, logs, caches, backups, and tool calls can expose data independently of
    model training. Minimize unnecessary collection and retain access and deletion rules across derived state. A
    local model does not make unrelated network telemetry or shared logs private automatically.
  bridges:
  - probability
- id: privacy-and-memorization.s3
  title: Introduce differential privacy precisely
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.privacy-and-memorization
  markdown: Differential privacy bounds how much an algorithm’s output distribution can change when one defined
    individual or record changes in the dataset. The privacy unit, epsilon, delta, and composition accounting matter.
    It is a formal guarantee under a specified mechanism, not a claim that outputs contain no sensitive facts whatsoever.
  text_mode: Differential privacy bounds how much an algorithm’s output distribution can change when one defined
    individual or record changes in the dataset. The privacy unit, epsilon, delta, and composition accounting matter.
    It is a formal guarantee under a specified mechanism, not a claim that outputs contain no sensitive facts whatsoever.
  bridges: []
- id: privacy-and-memorization.s4
  title: See the training tradeoff
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.privacy-and-memorization
  markdown: DP-SGD commonly clips per-example gradients, aggregates them with calibrated noise, and tracks privacy
    spending across updates. Clipping limits influence; noise obscures individual contributions. Utility, compute,
    and privacy parameters interact, and a correct guarantee requires the full implementation and accounting assumptions.
  text_mode: DP-SGD commonly clips per-example gradients, aggregates them with calibrated noise, and tracks privacy
    spending across updates. Clipping limits influence; noise obscures individual contributions. Utility, compute,
    and privacy parameters interact, and a correct guarantee requires the full implementation and accounting assumptions.
  bridges: []
- id: privacy-and-memorization.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.privacy-and-memorization
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Privacy risks arise from memorization, membership signals, extraction, and application data flows; differential
    privacy bounds a defined training-data influence while other controls address storage and access.
