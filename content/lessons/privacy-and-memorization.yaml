assessment_families:
  - id: privacy-and-memorization.base
    objective_ref: objective.privacy-and-memorization
    task: base
    response_type: single_choice
    points: 1
    hint: 'Trace privacy through the application: trace the inputs, operation, and result before choosing.'
    remediation_scene: privacy-and-memorization.s2
    variants:
      - id: privacy-and-memorization.base.1
        prompt: What does membership inference try to determine?
        options:
          - id: c
            text: Every private fact about a person necessarily
          - id: a
            text: Whether a record participated in training
          - id: b
            text: Only whether a model can spell a name
        answer: a
        feedback: Membership is a specific training-data question.
        retired: true
      - id: privacy-and-memorization.base.2
        prompt: Does removing names guarantee anonymity?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only in every tabular dataset
        answer: a
        feedback: Other attributes can identify or link records.
        retired: true
  - id: privacy-and-memorization.transfer
    objective_ref: objective.privacy-and-memorization
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'See the training tradeoff: trace the inputs, operation, and result before choosing.'
    remediation_scene: privacy-and-memorization.s4
    variants:
      - id: privacy-and-memorization.transfer.1
        prompt: What does gradient clipping do in DP-SGD?
        options:
          - id: a
            text: Bounds a contribution before noisy aggregation
          - id: b
            text: Eliminates all privacy risk alone
          - id: c
            text: Deletes every training example
        answer: a
        feedback: Bounded sensitivity supports calibrated privacy mechanisms.
        retired: true
      - id: privacy-and-memorization.transfer.2
        prompt: Why identify the privacy unit and composition accounting?
        options:
          - id: b
            text: They only change terminology
          - id: c
            text: Every epsilon has identical meaning
          - id: a
            text: They define what is protected and how repeated releases spend privacy
        answer: a
        feedback: Guarantees depend on the precise mechanism and neighboring-data definition.
        retired: true
  - id: privacy-and-memorization.base.v2
    objective_ref: objective.privacy-and-memorization
    task: base
    response_type: single_choice
    points: 1
    hint: 'Match the attacker''s question: "give me the text" is extraction, "was this record used?" is membership inference, and "how much can one person change the output?" is what ε limits.'
    remediation_scene: privacy-and-memorization.membership
    variants:
      - id: privacy-and-memorization.base.v2.1
        prompt: An attacker holds a patient's discharge note and wants to learn whether it was in a model's training set, which came only from an HIV clinic. What kind of attack is this?
        options:
          - id: b
            text: Training-data extraction, since the note is clinical text
          - id: a
            text: Membership inference, since being included reveals a diagnosis
          - id: c
            text: Prompt injection, since the attacker controls what the model reads
        answer: a
        feedback: The attacker already has the text and only asks whether it was used, which is membership inference. Extraction would mean pulling unknown text out of the model; prompt injection is about hijacking instructions, not training data.
      - id: privacy-and-memorization.base.v2.2
        prompt: In a loss-threshold test, 4 of 5 training notes and 1 of 5 unseen notes fall below the cutoff, so the attacker is right 80% of the time. What does that show?
        options:
          - id: a
            text: The model leaks membership, well above the 50% of guessing
          - id: b
            text: The model generalizes well, since it rejects most unseen notes
          - id: c
            text: The model has memorized 80% of its training notes word for word
        answer: a
        feedback: Coin-flipping scores 50%, so 80% means training notes are measurably easier for the model, and that difference leaks membership. It says nothing about verbatim recall, and rejecting unseen notes is the attack working, not good generalization.
      - id: privacy-and-memorization.base.v2.3
        prompt: A hospital releases a statistic with ε = 1 differential privacy. What does that promise any one patient?
        options:
          - id: c
            text: An attacker can guess whether she is included at most 1% better than chance
          - id: b
            text: Her record appears in at most one of every e¹ published statistics
          - id: a
            text: Any output is at most e¹ ≈ 2.7 times likelier with her data than without
        answer: a
        feedback: ε bounds the ratio of output probabilities with and without one person by e^ε, here about 2.72. It isn't a percentage of attacker accuracy, and DP doesn't decide which records appear anywhere.
      - id: privacy-and-memorization.base.v2.4
        prompt: In DP-SGD, one example's gradient has length 5 and the clipping norm C is 1. What happens to it before noise is added?
        options:
          - id: b
            text: It's dropped from the batch, since a large gradient marks an outlier
          - id: a
            text: It's scaled to length 1, capping how far one example can move the model
          - id: c
            text: It's kept at length 5, and only its own gradient gets extra noise
        answer: a
        feedback: Clipping rescales every oversized gradient to length C, which bounds the sensitivity so a fixed amount of noise suffices. Dropping it would bias training, and noise is added to the summed batch, not per example.
  - id: privacy-and-memorization.transfer.v2
    objective_ref: objective.privacy-and-memorization
    task: transfer
    response_type: single_choice
    points: 1
    hint: Follow the data to where it is stored, logged, or published. Then ask whether the fix is not keeping it, spending less privacy budget, or accepting more noise.
    remediation_scene: privacy-and-memorization.s2
    variants:
      - id: privacy-and-memorization.transfer.v2.1
        prompt: A clinic's chatbot uses a model never trained on patient data, but every conversation is logged for a year in an analytics tool the whole company can read. Where is the main privacy risk?
        options:
          - id: b
            text: The model weights, which may memorize the chats over time
          - id: c
            text: The replies, which other users could extract with odd prompts
          - id: a
            text: The logs, which hold patient details that many people can read
        answer: a
        feedback: The model never trained on these chats, so its weights hold none of them. The year-long, widely readable logs do. Shorter retention, less logged content, and tighter access fix the real leak.
      - id: privacy-and-memorization.transfer.v2.2
        prompt: A research dataset has names removed but keeps ZIP code, date of birth, and sex. Why is releasing it risky?
        options:
          - id: a
            text: Together, those three fields single out most people uniquely
          - id: b
            text: The removed names can be recovered from the order of the rows
          - id: c
            text: A date of birth by itself is enough to identify each person
        answer: a
        feedback: Sweeney estimated that 87% of Americans are unique on ZIP, sex, and birth date, so linking to a voter roll re-identifies them. It's the combination that identifies, not one field alone, and row order is a separate, easily fixed issue.
      - id: privacy-and-memorization.transfer.v2.3
        prompt: A city publishes differentially private counts of a rare condition per neighborhood at ε = 0.1 (noise scale 10). Most true counts are around 5. What will readers see?
        options:
          - id: c
            text: Exact counts, since each person changes a count by only 1
          - id: a
            text: Noise that swamps the counts, so larger areas or a larger ε are needed
          - id: b
            text: Accurate counts, since the Laplace noise averages out to zero
        answer: a
        feedback: A typical error of about 10 on counts near 5 hides the signal. Sensitivity 1 is why the scale is 1/ε, not a reason for exactness, and noise averaging to zero over many releases doesn't help a single published number.
      - id: privacy-and-memorization.transfer.v2.4
        prompt: An analyst sends the same differentially private query 50 times at ε = 0.5 each and averages the answers. What has happened to privacy?
        options:
          - id: b
            text: Nothing, since each of the 50 answers was private on its own
          - id: c
            text: It improved, since averaging hides the noise of each single answer
          - id: a
            text: The total spent is ε = 25, so the average reveals far more
        answer: a
        feedback: Under basic composition, privacy costs add up, 50 × 0.5 = 25, and averaging strips out the noise that protected people. That's why DP systems enforce a total budget. Each answer being private alone doesn't make the collection private.
  - id: privacy-and-memorization.noise
    objective_ref: objective.privacy-and-memorization
    task: base
    response_type: numeric
    points: 1
    hint: 'Find the sensitivity first: the most one person can change the true answer. Then divide it by ε.'
    remediation_scene: privacy-and-memorization.s3
    absolute_tolerance: 0.01
    variants:
      - id: privacy-and-memorization.noise.1
        prompt: A hospital publishes a count of patients with a condition, using the Laplace mechanism with ε = 0.5. What is the noise scale b?
        answer: 2
        feedback: One patient changes a count by at most 1, so Δ = 1 and b = 1 / 0.5 = 2. Halving ε doubled the noise.
      - id: privacy-and-memorization.noise.2
        prompt: A school publishes the number of students who used a counselling service this term, with the Laplace mechanism at ε = 0.25. What is the noise scale b?
        answer: 4
        feedback: A count has sensitivity 1, so b = 1 / 0.25 = 4. A typical published value is off by about 4 students.
      - id: privacy-and-memorization.noise.3
        prompt: A clinic publishes its total number of visits. Each patient contributes at most 3 visits. Using the Laplace mechanism with ε = 0.6, what is the noise scale b?
        answer: 5
        feedback: Removing one patient can change the total by up to 3, so Δ = 3 and b = 3 / 0.6 = 5. Larger contributions need proportionally more noise.
      - id: privacy-and-memorization.noise.4
        prompt: A survey publishes the sum of respondents' ages, with each age capped at 100 before summing. Using the Laplace mechanism with ε = 2, what is the noise scale b?
        answer: 50
        feedback: One respondent can change the sum by up to 100, so Δ = 100 and b = 100 / 2 = 50. Capping the values is what makes the sensitivity finite at all.
