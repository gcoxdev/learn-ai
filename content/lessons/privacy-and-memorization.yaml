    permits additive slack in the probability inequality. Smaller values generally give a stronger bound under
    the same definition. Delta is not simply “the chance your data leaks.” The privacy unit and accounting
    rules matter, and repeated releases can consume additional privacy budget.'
  bridges: []
- id: privacy-and-memorization.s4
  title: See the training tradeoff
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.privacy-and-memorization
  markdown: '**Differentially private stochastic gradient descent**, or **DP-SGD**, commonly clips per-example
    gradients, adds calibrated noise to their aggregation, and tracks privacy spending across updates.


    Clipping limits each example''s influence; noise makes individual contributions harder to distinguish.
    The privacy unit, sampling procedure, noise level, and number of updates must match the accounting assumptions.
    Privacy, utility, and compute costs interact, so the guarantee depends on the complete mechanism and its
    implementation.'
  text_mode: '**Differentially private stochastic gradient descent**, or **DP-SGD**, commonly clips per-example
