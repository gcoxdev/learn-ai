schema_version: 0.2-draft
lesson:
  id: privacy-and-memorization
  version: 0.3.0-draft
  title: Understand what training and deployment can reveal about data
  state: draft
  summary: Distinguish private data in a model from private data elsewhere in the application.
  slot: M29.3
  category: learning
  sources:
  - title: Deep Learning with Differential Privacy
    url: https://arxiv.org/abs/1607.00133
  - title: Extracting Training Data from LLMs
    url: https://arxiv.org/abs/2012.07805
objectives:
- id: objective.privacy-and-memorization
  version: 1-draft
  statement: Privacy risks arise from memorization, membership signals, extraction, and application data flows;
    differential privacy bounds a defined training-data influence while other controls address storage and
    access.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - privacy-and-memorization.base
  - privacy-and-memorization.transfer
  prerequisites:
  - anyOf:
    - objective.data-provenance
  - anyOf:
    - objective.information-theory
  - anyOf:
    - objective.stochastic-gradients
scenes:
- id: privacy-and-memorization.s1
  title: Different attacks ask different questions
  type: explanation
  depth: intuition
  objective_refs:
  - objective.privacy-and-memorization
  markdown: Membership inference asks whether a record participated in training. Extraction seeks training
    content or sensitive details. A model can generalize usefully and still memorize some unusual sequences.
    Removing obvious names does not guarantee anonymity when other fields can identify someone.
  text_mode: Membership inference asks whether a record participated in training. Extraction seeks training
    content or sensitive details. A model can generalize usefully and still memorize some unusual sequences.
    Removing obvious names does not guarantee anonymity when other fields can identify someone.
  bridges: []
- id: privacy-and-memorization.s2
  title: Trace privacy through the application
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.privacy-and-memorization
  markdown: Prompts, retrieved documents, logs, caches, backups, and tool calls can expose data independently
    of model training. Minimize unnecessary collection and retain access and deletion rules across derived
    state. A local model does not make unrelated network telemetry or shared logs private automatically.
  text_mode: Prompts, retrieved documents, logs, caches, backups, and tool calls can expose data independently
    of model training. Minimize unnecessary collection and retain access and deletion rules across derived
    state. A local model does not make unrelated network telemetry or shared logs private automatically.
  bridges:
  - probability
- id: privacy-and-memorization.s3
  title: Introduce differential privacy precisely
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.privacy-and-memorization
  markdown: '**Differential privacy** bounds how much a randomized algorithm''s output distribution can change
    when one defined person''s or record''s contribution changes.


    Imagine two training datasets differing only in one person''s contribution. The guarantee compares the
    probabilities of possible outputs from the whole algorithm on those neighboring datasets. It is about limiting
    individual influence, not promising that outputs contain no sensitive facts.


    Two parameters describe the bound. **Epsilon** controls a multiplicative factor exp(epsilon); **delta**
    permits additive slack in the probability inequality. Smaller values generally give a stronger bound under
    the same definition. Delta is not simply “the chance your data leaks.” The privacy unit and accounting
    rules matter, and repeated releases can consume additional privacy budget.'
  text_mode: '**Differential privacy** bounds how much a randomized algorithm''s output distribution can change
    when one defined person''s or record''s contribution changes.


    Imagine two training datasets differing only in one person''s contribution. The guarantee compares the
    probabilities of possible outputs from the whole algorithm on those neighboring datasets. It is about limiting
    individual influence, not promising that outputs contain no sensitive facts.


