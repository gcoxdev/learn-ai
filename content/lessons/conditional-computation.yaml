assessment_families:
  - id: conditional-computation.base
    objective_ref: objective.conditional-computation
    task: base
    response_type: single_choice
    points: 1
    hint: 'Locate the sparse part: trace the inputs, operation, and result before choosing.'
    remediation_scene: conditional-computation.s2
    variants:
      - id: conditional-computation.base.1
        prompt: What is an expert in this context?
        options:
          - id: a
            text: A learned subnetwork
          - id: b
            text: A human consultant queried for each token
          - id: c
            text: A guaranteed topic database
        answer: a
        feedback: Expert refers to model parameters and computation.
        retired: true
      - id: conditional-computation.base.2
        prompt: Must sparse experts make attention sparse too?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only when top-one is used
          - id: a
            text: 'No'
        answer: a
        feedback: Different parts of a layer have different execution patterns.
        retired: true
  - id: conditional-computation.transfer
    objective_ref: objective.conditional-computation
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Treat specialization as evidence: trace the inputs, operation, and result before choosing.'
    remediation_scene: conditional-computation.s4
    variants:
      - id: conditional-computation.transfer.1
        prompt: Two tokens choose different experts. Must they be different user requests?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only with separate tokenizers
          - id: a
            text: No; routing can differ within one sequence
        answer: a
        feedback: Routing commonly operates on token representations.
        retired: true
      - id: conditional-computation.transfer.2
        prompt: An expert receives many code tokens. What does that establish?
        options:
          - id: c
            text: That other experts cannot process code
          - id: a
            text: A routing association requiring further analysis
          - id: b
            text: Exclusive ownership of all coding knowledge
        answer: a
        feedback: Assignment patterns alone do not prove exclusive semantic function.
        retired: true
  - id: conditional-computation.base.v2
    objective_ref: objective.conditional-computation
    task: base
    response_type: single_choice
    points: 1
    hint: Separate what is stored from what runs. Every expert's weights sit in the layer, but the router picks only k of them for each token, and attention stays shared.
    remediation_scene: conditional-computation.s2
    variants:
      - id: conditional-computation.base.v2.1
        prompt: A team converts a dense transformer into an MoE transformer in the usual way. Which part of each converted block becomes a set of experts?
        options:
          - id: b
            text: The attention sublayer, so each token looks at fewer earlier words
          - id: c
            text: The embedding table, so each word in the vocabulary gets its own expert
          - id: a
            text: The feed-forward sublayer, which transforms each token on its own
        answer: a
        feedback: The feed-forward step treats every token separately, so tokens can use different weights there. Attention mixes information across tokens and stays shared; the embedding table is a lookup, not the part that gets routed.
      - id: conditional-computation.base.v2.2
        prompt: 'In one MoE layer, the token "The" is sent to expert 2 while "cat", from the same sentence, is sent to expert 4. What does this show?'
        options:
          - id: c
            text: Expert 4 has learned what animals are, so it takes animal words
          - id: a
            text: The router makes a separate choice for each token's vector
          - id: b
            text: The sentence was split into two requests before reaching the layer
        answer: a
        feedback: The router scores each token's vector on its own, so words in one sentence can take different experts. Nothing split the request, and a single routing choice says little about meaning; measured routing in real models tracks syntax more than topic.
      - id: conditional-computation.base.v2.3
        prompt: A token passes through one Mixtral MoE layer, which has 8 experts and picks the top 2. Which describes that layer for this token?
        options:
          - id: b
            text: 2 experts are stored in the layer, and the other 6 are loaded on demand
          - id: a
            text: 8 experts are stored in the layer, and 2 of them run on this token
          - id: c
            text: 8 experts run on the token, and the router keeps the best 2 outputs
        answer: a
        feedback: All 8 experts' weights live in the layer; the router chooses 2 before any expert runs. Running all 8 and discarding 6 outputs would throw away the savings that make MoE worthwhile.
      - id: conditional-computation.base.v2.4
        prompt: How did the 1991 "Adaptive Mixtures of Local Experts" differ from the 2017 sparsely-gated MoE layer?
        options:
          - id: a
            text: In 1991 every expert ran on every input, and the gate weighted their outputs
          - id: c
            text: In 1991 the experts were rule-based programs written by human specialists
          - id: b
            text: In 1991 there was no gating network, so every expert's output counted equally
        answer: a
        feedback: The 1991 system had a learned gating network, but all experts computed on each case. Shazeer et al. (2017) kept only the top k experts, which is what saves compute. The 1991 experts were small neural networks, not hand-written rules.
  - id: conditional-computation.transfer.v2
    objective_ref: objective.conditional-computation
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what changes the stored parameters (how many experts there are) and what changes the work per token (how many each token uses), and what evidence a claim about an expert would need.
    remediation_scene: conditional-computation.s4
    variants:
      - id: conditional-computation.transfer.v2.1
        prompt: An analyst finds that expert 5 in layer 12 receives 40% of the code tokens in a test set. A manager wants to call it "the coding expert" in the model's documentation. What is the best next step?
        options:
          - id: b
            text: Accept the name, since training pushes each expert to own one topic
          - id: a
            text: Compare its share across kinds of text and test what breaks without it
          - id: c
            text: Accept the name only if expert 5 also gets 40% of the math tokens
        answer: a
        feedback: A skewed count is a clue, not a job description. Training doesn't assign topics, and Mixtral's analysis found routing tracked syntax more than subject, so measure across domains and try switching the expert off before naming it.
      - id: conditional-computation.transfer.v2.2
        prompt: A team wants a model with many more parameters, but the arithmetic per token must stay about the same as their current dense model. Which change fits?
        options:
          - id: c
            text: Double the width of the feed-forward block in each layer
          - id: b
            text: Add eight more attention heads to each transformer layer
          - id: a
            text: Replace each feed-forward block with 8 copies and route each token to 1
        answer: a
        feedback: With top-1 routing each token still runs one feed-forward network, so the work per token barely changes while stored feed-forward weights grow eightfold. Wider blocks or extra heads add parameters and add work for every token.
      - id: conditional-computation.transfer.v2.3
        prompt: An image classifier splits each photo into patches and uses MoE layers on the patch vectors. A patch of sky and a patch of a dog come from the same photo. Which statement is right?
        options:
          - id: a
            text: The two patches can go to different experts, since routing is per patch
          - id: b
            text: Both patches must share experts, since they belong to one input image
          - id: c
            text: The router chooses experts once per photo, based on its predicted label
        answer: a
        feedback: Routing works on each token's vector, and here each patch is a token. One photo can spread across many experts, just as the words of one sentence can.
      - id: conditional-computation.transfer.v2.4
        prompt: Model A has 8 experts per MoE layer and model B has 32, with the same expert size, and both route each token to 2. How do they compare?
        options:
          - id: c
            text: B does about 4 times the expert work per token as A
          - id: a
            text: Same expert work per token, but B stores 4 times the expert weights
          - id: b
            text: B does a quarter of A's work, since each expert sees fewer tokens
        answer: a
        feedback: Work per token depends on k, which is 2 in both. The number of experts sets how many weights are stored. Each expert in B does see fewer tokens, but each token still runs exactly two experts.
  - id: conditional-computation.calculate
    objective_ref: objective.conditional-computation
    task: base
    response_type: numeric
    points: 1
    hint: Stored expert parameters are (number of experts) × (size of one expert). Parameters used per token are k × (size of one expert).
    remediation_scene: conditional-computation.budget
    absolute_tolerance: 1
    variants:
      - id: conditional-computation.calculate.1
        prompt: An MoE layer has 16 experts of 50 million parameters each and routes each token to the top 2. How many million expert parameters does one token use in this layer?
        answer: 100
        feedback: 2 experts × 50 million = 100 million. The other 14 experts are stored but idle for this token.
      - id: conditional-computation.calculate.2
        prompt: The same layer has 16 experts of 50 million parameters each. How many million expert parameters must be stored for the layer?
        answer: 800
        feedback: 16 × 50 million = 800 million. Every expert is stored, whichever ones a given token uses.
      - id: conditional-computation.calculate.3
        prompt: A dense feed-forward block with 120 million parameters is replaced by 8 copies of itself, with top-1 routing. How many million feed-forward parameters does each token use?
        answer: 120
        feedback: Top-1 means one copy runs, so each token uses 120 million, the same as before. Storage grows to 8 × 120 = 960 million.
      - id: conditional-computation.calculate.4
        prompt: A 40-token sentence passes through one MoE layer with top-2 routing. How many token-to-expert runs happen in that layer?
        answer: 80
        feedback: Each of the 40 tokens runs 2 experts, so 40 × 2 = 80 expert runs, however the tokens spread across experts.
      - id: conditional-computation.calculate.5
        prompt: One expert has 176 million parameters, and a matrix multiply costs about 2 FLOPs per weight. With top-2 routing, about how many million FLOPs does one token spend in the experts of this layer?
        answer: 704
        feedback: 2 experts × 176 million weights × 2 FLOPs = 704 million FLOPs, about twice one dense feed-forward block. (The lesson's table shows 705M because it uses the unrounded 176.16M.)
