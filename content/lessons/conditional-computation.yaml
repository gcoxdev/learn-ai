schema_version: 0.2-draft
lesson:
  id: conditional-computation
  version: 0.3.0-draft
  title: Give each token a selected route through some parameters
  state: draft
  summary: Mixtral stores 47 billion parameters but uses about 13 billion for each word it reads. See how routing tokens to a few "experts" buys a bigger model without more work per token.
  slot: M18.1
  category: learning
  sources:
    - title: "Adaptive Mixtures of Local Experts (Jacobs, Jordan, Nowlan & Hinton, 1991)"
      url: https://doi.org/10.1162/neco.1991.3.1.79
    - title: "Outrageously Large Neural Networks: The Sparsely-Gated Mixture-of-Experts Layer (Shazeer et al., 2017)"
      url: https://arxiv.org/abs/1701.06538
    - title: "GShard: Scaling Giant Models with Conditional Computation and Automatic Sharding (Lepikhin et al., 2020)"
      url: https://arxiv.org/abs/2006.16668
    - title: "Switch Transformers: Scaling to Trillion Parameter Models with Simple and Efficient Sparsity (Fedus, Zoph & Shazeer, 2021)"
      url: https://arxiv.org/abs/2101.03961
    - title: "Mixtral of Experts (Jiang et al., 2024)"
      url: https://arxiv.org/abs/2401.04088
objectives:
  - id: objective.conditional-computation
    version: 2-draft
    statement: Conditional computation activates input-dependent parts of a network; sparse MoE layers commonly replace dense feed-forward blocks while retaining shared transformer computation.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - conditional-computation.base.v2
      - conditional-computation.transfer.v2
      - conditional-computation.calculate
    prerequisites:
      - anyOf:
          - objective.transformer-block-components
scenes:
  - id: conditional-computation.s1
    title: A 47-billion-parameter model that works like a 13-billion one
    type: explanation
    depth: intuition
    objective_refs:
      - objective.conditional-computation
    markdown: |-
      In December 2023, Mistral AI released Mixtral 8x7B. It stores about 47 billion parameters, yet each token it reads uses only about 13 billion of them. Its authors reported that it matched or beat Llama 2 70B on the benchmarks they tested, with about five times fewer parameters at work per token.

      How can a model use only part of itself? The trick is **conditional computation**: the input decides which parts of the network run. An ordinary **dense** layer runs all of its weights on every token. Mixtral's layers instead hold several feed-forward networks with separate weights, called **experts**, plus a small **router** that looks at each token's vector and picks which experts will process it. The design is called a **mixture of experts (MoE)**.

      | | Dense feed-forward layer | MoE layer in Mixtral |
      | --- | --- | --- |
      | Feed-forward networks stored | 1 | 8 experts |
      | Networks run per token | 1 | 2, picked by the router |
      | Who decides the path | Nobody: every token takes the same one | The router, token by token |

      Despite the name, an expert is a block of weights, not a specialist that knows a subject.
    bridges: []
  - id: conditional-computation.s2
    title: Swap the feed-forward block for a set of experts
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.conditional-computation
    markdown: |-
      Recall the transformer block from module 15: attention mixes information *across* tokens, then a feed-forward network transforms *each token on its own*. Because the feed-forward step treats every token separately, nothing stops two tokens from using different feed-forward weights. That makes it the natural place for experts.

      So an MoE transformer keeps attention, normalization, and the residual connection as before, shared by every token. Only the feed-forward block is replaced, by a router plus $N$ experts, of which each token uses $k$. Mixtral has $N = 8$ and $k = 2$ in every layer. Some models swap only every other feed-forward block.

      :::papers The MoE layer in one line
      $$y = \sum_{i \in \mathcal{T}} g_i(x)\, E_i(x)$$

      $x$ is the token's vector, $E_i$ is expert $i$ (a feed-forward network), $\mathcal{T}$ is the set of $k$ experts the router chose, and $g_i(x)$ is the router's weight for expert $i$. For one Mixtral token, $\mathcal{T}$ might be {expert 2, expert 7} with weights 0.69 and 0.31. The next lesson shows where those weights come from.
      :::
    diagram:
      caption: One token through an MoE transformer layer. Only the feed-forward part is routed.
      description: The token vector passes through attention and normalization, which are shared and run for every token. It then reaches the router, which scores all eight experts. The router sends the token to its two chosen experts with gate weights 0.69 and 0.31; the six other experts are skipped for this token. The two expert outputs go to a weighted sum, which is added to the residual stream and passed to the next block.
      nodes:
        - id: token
          label: Token vector
          col: 0
          row: 1
        - id: attn
          label: Attention + norm
          note: shared, runs for every token
          col: 1
          row: 1
        - id: router
          label: Router
          note: scores 8 experts, keeps 2
          col: 2
          row: 1
          tone: accent
        - id: e2
          label: Expert 2
          note: chosen
          col: 3
          row: 0
          tone: data
        - id: e7
          label: Expert 7
          note: chosen
          col: 3
          row: 1
          tone: data
        - id: rest
          label: 6 other experts
          note: skipped for this token
          col: 3
          row: 2
          tone: muted
        - id: sum
          label: Weighted sum
          col: 4
          row: 1
          tone: accent
        - id: out
          label: Add to residual stream
          note: on to the next block
          col: 5
          row: 1
      edges:
        - from: token
          to: attn
        - from: attn
          to: router
        - from: router
          to: e2
          label: gate 0.69
        - from: router
          to: e7
          label: gate 0.31
        - from: router
          to: rest
          label: not run
          dashed: true
        - from: e2
          to: sum
        - from: e7
          to: sum
        - from: sum
          to: out
  - id: conditional-computation.budget
    title: Eight times the weights, twice the work
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.conditional-computation
    markdown: |-
      Let's put numbers on one Mixtral layer. Each expert is a gated feed-forward network (SwiGLU, from the lesson on transformer blocks in module 15) with three weight matrices of size 4,096 × 14,336. That is

      $$3 \times 4{,}096 \times 14{,}336 = 176{,}160{,}768 \approx 176\text{M parameters per expert.}$$

      Multiplying a vector by a matrix costs about 2 floating-point operations (FLOPs) per weight: one multiply and one add. So running one expert on one token costs about 352 million FLOPs.

      | Design | Feed-forward weights stored | Weights used per token | FLOPs per token |
      | --- | ---: | ---: | ---: |
      | Dense: 1 network | 176M | 176M | 352M |
      | MoE: 8 experts, top-2 | 1,409M | 352M | 705M |

      The layer stores 8 times the weights but does only 2 times the work. The router itself is tiny: one 4,096 × 8 matrix, about 33,000 weights.

      :::predict Keep the same expert size but use 64 experts, still picking 2. What happens to storage and to work?
      Storage grows to 64 × 176M ≈ 11.3 billion weights in this one layer. Work per token doesn't change at all: still 2 experts, about 705M FLOPs. Stored parameters grow with the number of experts $N$; work per token grows with $k$.
      :::

  - id: conditional-computation.s3
    title: Trace three tokens through four experts
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.conditional-computation
    markdown: |-
      Here is a tiny MoE layer: four experts, each a 4 × 4 matrix, and a router that scores them. Each word goes to its single best expert (top-1).

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      d, N = 4, 4                                  # vector width, number of experts
      experts = rng.normal(size=(N, d, d))         # four small "feed-forward" matrices
      W_r = rng.normal(size=(d, N))                # the router: one column per expert
      tokens = {"The": rng.normal(size=d), "cat": rng.normal(size=d),
                "sat": rng.normal(size=d)}

      multiplies = 0                               # expert work only
      for word, x in tokens.items():
          scores = x @ W_r
          e = int(np.argmax(scores))               # top-1: run only the best expert
          y = x @ experts[e]
          multiplies += d * d
          print(f"{word:>4}: scores {scores.round(2)} -> expert E{e + 1}")

      print("expert multiplies used:  ", multiplies)
      print("if all 4 experts ran:   ", len(tokens) * N * d * d)
      print("expert weights stored:  ", experts.size)
      ```

      "The" goes to expert 2; "cat" and "sat" go to expert 4. The tokens use 48 expert multiplies instead of 192, yet all 64 expert weights stay stored (the router adds 16 multiplies per token). Change the seed from 0 to 1 and watch the routes change.

      :::mixup "The router picks experts for the whole prompt."
      It picks for each token, in each MoE layer, separately. Words in one sentence can take different experts, as "The" and "cat" did here. Mixtral has 32 layers, so a single token makes 32 separate routing choices on its way through the model.
      :::
  - id: conditional-computation.s4
    title: Experts aren't subject specialists
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.conditional-computation
    markdown: |-
      It's tempting to picture a biology expert and a coding expert. Training doesn't ask for that: router and experts learn together, and each token goes wherever that lowers the training loss.

      The Mixtral authors checked. Expert choices on arXiv papers, PubMed biology abstracts, and philosophy papers were very similar; only a synthetic math dataset looked a little different. The patterns they did find looked like syntax: "self" in Python and "Question" in English often went to the same expert, indentation tokens were routed consistently, and consecutive tokens often shared an expert.

      :::mixup "Expert 5 handles most of our code tokens, so it's the coding expert."
      A skewed count is a starting point, not a job title. Before naming an expert, compare its share across many kinds of text and see what changes when you switch it off.
      :::
    bridges: []
  - id: conditional-computation.history
    title: From 1991 to trillion-parameter models
    type: explanation
    depth: intuition
    objective_refs:
      - objective.conditional-computation
    markdown: |-
      The idea is older than transformers:

      | Year | Work | What it added |
      | --- | --- | --- |
      | 1991 | Jacobs, Jordan, Nowlan & Hinton, "Adaptive Mixtures of Local Experts" | A learned gating network splits training cases among small expert networks. Every expert still ran on every input. |
      | 2017 | Shazeer et al., "Outrageously Large Neural Networks" | *Sparse* gating: run only the top $k$ experts. Thousands of experts between LSTM layers, up to 137 billion parameters. |
      | 2020 | GShard (Lepikhin et al.) | Top-2 MoE inside a Transformer: a 600-billion-parameter translation model trained on 2,048 TPU v3 accelerators in 4 days. |
      | 2021 | Switch Transformer (Fedus, Zoph & Shazeer) | Top-1 routing. Up to 7 times faster pretraining than dense T5 at equal compute; up to 1.6 trillion parameters. |

      Mixtral (2023) and DeepSeek-V3 (2024, 671 billion parameters with 37 billion active per token) brought the design into widely used open-weight language models.

      Saving compute this way creates new jobs: pick experts well, get tokens to them, keep any one from being swamped, and hold every expert in memory even when idle. The rest of this module takes these in turn, starting with how the router picks.
  - id: conditional-computation.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.conditional-computation
    markdown: Count stored versus used experts, trace routing one token at a time, and judge claims about a "coding expert" and a bigger model on a fixed budget.
    takeaway: |-
      An MoE layer stores many expert networks but runs only the few its router picks for each token. Total parameters can grow while the work per token stays almost the same.
  - id: conditional-computation.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.conditional-computation
    markdown: |-
      A sparse MoE layer chooses part of its computation for each token. The unselected experts still exist in the model, and shared operations may still run for every token.
