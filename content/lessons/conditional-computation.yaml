assessment_families:
- id: conditional-computation.base
  objective_ref: objective.conditional-computation
  task: base
  response_type: single_choice
  points: 1
  hint: 'Locate the sparse part: trace the inputs, operation, and result before choosing.'
  remediation_scene: conditional-computation.s2
  variants:
  - id: conditional-computation.base.1
    prompt: What is an expert in this context?
    options:
    - id: a
      text: A learned subnetwork
    - id: b
      text: A human consultant queried for each token
    - id: c
      text: A guaranteed topic database
    answer: a
    feedback: Expert refers to model parameters and computation.
  - id: conditional-computation.base.2
    prompt: Must sparse experts make attention sparse too?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only when top-one is used
    - id: a
      text: 'No'
    answer: a
    feedback: Different parts of a layer have different execution patterns.
- id: conditional-computation.transfer
  objective_ref: objective.conditional-computation
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Treat specialization as evidence: trace the inputs, operation, and result before choosing.'
  remediation_scene: conditional-computation.s4
  variants:
  - id: conditional-computation.transfer.1
    prompt: Two tokens choose different experts. Must they be different user requests?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only with separate tokenizers
    - id: a
      text: No; routing can differ within one sequence
    answer: a
    feedback: Routing commonly operates on token representations.
  - id: conditional-computation.transfer.2
    prompt: An expert receives many code tokens. What does that establish?
    options:
    - id: c
      text: That other experts cannot process code
    - id: a
      text: A routing association requiring further analysis
    - id: b
      text: Exclusive ownership of all coding knowledge
    answer: a
    feedback: Assignment patterns alone do not prove exclusive semantic function.
