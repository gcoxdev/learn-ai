schema_version: 0.2-draft
lesson:
  id: conditional-computation
  version: 0.1.0-draft
  title: Give each token a selected route through some parameters
  state: draft
  summary: Conditional computation activates input-dependent parts of a network; sparse MoE layers commonly replace
    dense feed-forward blocks while retaining shared transformer computation.
  slot: M18.1
  category: learning
  sources:
  - title: Sparsely-Gated Mixture-of-Experts
    url: https://arxiv.org/abs/1701.06538
  - title: Switch Transformers
    url: https://arxiv.org/abs/2101.03961
objectives:
- id: objective.conditional-computation
  version: 1-draft
  statement: Conditional computation activates input-dependent parts of a network; sparse MoE layers commonly replace
    dense feed-forward blocks while retaining shared transformer computation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - conditional-computation.base
  - conditional-computation.transfer
  prerequisites:
  - anyOf:
    - objective.transformer-block-components
scenes:
- id: conditional-computation.s1
  title: Separate storage from execution
  type: explanation
  depth: intuition
  objective_refs:
  - objective.conditional-computation
  markdown: A dense feed-forward block uses the same learned transformation for every token. A sparse mixture-of-experts
    block holds several candidate networks and selects some for each token representation. All experts belong to
    one model, even though one token does not execute all their computations.
  text_mode: A dense feed-forward block uses the same learned transformation for every token. A sparse mixture-of-experts
    block holds several candidate networks and selects some for each token representation. All experts belong to
    one model, even though one token does not execute all their computations.
  bridges: []
- id: conditional-computation.s2
  title: Locate the sparse part
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.conditional-computation
  markdown: A transformer can keep attention, normalization, and residual pathways shared while replacing selected
    feed-forward blocks with MoE layers. Sparsity in the expert block does not imply that every model operation
    is sparse. Different layers can use different experts or remain dense.
  text_mode: A transformer can keep attention, normalization, and residual pathways shared while replacing selected
    feed-forward blocks with MoE layers. Sparsity in the expert block does not imply that every model operation
    is sparse. Different layers can use different experts or remain dense.
  bridges: []
- id: conditional-computation.s3
  title: Trace two token routes
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.conditional-computation
  markdown: Suppose four experts exist and top-one routing chooses expert two for token A and expert four for token
    B. Both tokens still pass through the shared parts of the layer. Their chosen experts process vector representations,
    not necessarily human-readable topic labels or complete conversational requests.
  text_mode: Suppose four experts exist and top-one routing chooses expert two for token A and expert four for token
    B. Both tokens still pass through the shared parts of the layer. Their chosen experts process vector representations,
    not necessarily human-readable topic labels or complete conversational requests.
  bridges: []
- id: conditional-computation.s4
  title: Treat specialization as evidence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.conditional-computation
  markdown: The word expert names a parameterized subnetwork. Training may produce patterns in its assignments,
    but it need not correspond neatly to a profession, language, or fact database. Analyze actual routing and interventions
    before assigning semantic roles. Sparse capacity brings routing and communication costs alongside potential
    compute savings.
  text_mode: The word expert names a parameterized subnetwork. Training may produce patterns in its assignments,
    but it need not correspond neatly to a profession, language, or fact database. Analyze actual routing and interventions
    before assigning semantic roles. Sparse capacity brings routing and communication costs alongside potential
    compute savings.
  bridges: []
