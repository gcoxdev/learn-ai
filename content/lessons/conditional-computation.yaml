schema_version: 0.2-draft
lesson:
  id: conditional-computation
  version: 0.3.0-draft
  title: Give each token a selected route through some parameters
  state: draft
  summary: Let each token use selected subnetworks while distinguishing stored capacity from work done for
    that token.
  slot: M18.1
  category: learning
  sources:
  - title: Sparsely-Gated Mixture-of-Experts
    url: https://arxiv.org/abs/1701.06538
  - title: Switch Transformers
    url: https://arxiv.org/abs/2101.03961
objectives:
- id: objective.conditional-computation
  version: 1-draft
  statement: Conditional computation activates input-dependent parts of a network; sparse MoE layers commonly
    replace dense feed-forward blocks while retaining shared transformer computation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - conditional-computation.base
  - conditional-computation.transfer
  prerequisites:
  - anyOf:
    - objective.transformer-block-components
scenes:
- id: conditional-computation.s1
  title: Store several expert networks, run a selected few
  type: explanation
  depth: intuition
  objective_refs:
  - objective.conditional-computation
  markdown: '**MoE** stands for **mixture of experts**. Here each expert is a neural subnetwork. A learned
    **router** chooses which experts process a token’s representation. All experts belong to one model, even
    when a token uses only some of them.


    This execution is **sparse** because only part of the expert computation runs for each token, not because
    most stored weights must be zero. A dense feed-forward block, by comparison, applies the same learned transformation
    to every token.'
  text_mode: '**MoE** stands for **mixture of experts**. Here each expert is a neural subnetwork. A learned
    **router** chooses which experts process a token’s representation. All experts belong to one model, even
    when a token uses only some of them.


    This execution is **sparse** because only part of the expert computation runs for each token, not because
    most stored weights must be zero. A dense feed-forward block, by comparison, applies the same learned transformation
    to every token.'
  bridges: []
- id: conditional-computation.s2
  title: Locate the sparse part
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.conditional-computation
  markdown: A transformer can keep attention, normalization, and residual pathways shared while replacing selected
    feed-forward blocks with MoE layers. Sparsity in the expert block does not imply that every model operation
    is sparse. Different layers can use different experts or remain dense.
  text_mode: A transformer can keep attention, normalization, and residual pathways shared while replacing
    selected feed-forward blocks with MoE layers. Sparsity in the expert block does not imply that every model
    operation is sparse. Different layers can use different experts or remain dense.
  bridges: []
- id: conditional-computation.s3
  title: Trace two token routes
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.conditional-computation
  markdown: 'Suppose four experts exist and top-one routing chooses expert two for token A and expert four
    for token B. Both tokens still pass through the shared parts of the layer. Their chosen experts process
    vector representations, not necessarily human-readable topic labels or complete conversational requests.


    Token A and token B can select different experts while all model weights remain fixed. This is input-dependent
    inference. During training, feedback can update the router and selected computation under the training
    recipe. Choosing a new path on a request is not the same as creating or retraining an expert.'
  text_mode: 'Suppose four experts exist and top-one routing chooses expert two for token A and expert four
    for token B. Both tokens still pass through the shared parts of the layer. Their chosen experts process
    vector representations, not necessarily human-readable topic labels or complete conversational requests.


    Token A and token B can select different experts while all model weights remain fixed. This is input-dependent
    inference. During training, feedback can update the router and selected computation under the training
    recipe. Choosing a new path on a request is not the same as creating or retraining an expert.'
  bridges: []
- id: conditional-computation.s4
  title: Treat specialization as evidence
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.conditional-computation
  markdown: The word expert names a parameterized subnetwork. Training may produce patterns in its assignments,
    but it need not correspond neatly to a profession, language, or fact database. Analyze actual routing and
    interventions before assigning semantic roles. Sparse capacity brings routing and communication costs alongside
    potential compute savings.
  text_mode: The word expert names a parameterized subnetwork. Training may produce patterns in its assignments,
    but it need not correspond neatly to a profession, language, or fact database. Analyze actual routing and
    interventions before assigning semantic roles. Sparse capacity brings routing and communication costs alongside
    potential compute savings.
  bridges: []
- id: conditional-computation.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.conditional-computation
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: A sparse MoE layer chooses part of its computation for each token. The unselected experts still
    exist in the model, and shared operations may still run for every token.
- id: conditional-computation.recap
  title: One idea to take with you
  type: recap
