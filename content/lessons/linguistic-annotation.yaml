          tone: data
        - id: robotics
          label: Robotics
          note: ORG
          col: 1
          row: 2
          tone: data
        - id: in
          label: in
          col: 3
          row: 1
        - id: june
          label: June
          note: DATE
          col: 5
          row: 1
          tone: data
        - id: priya
          label: Priya
          col: 0
          row: 2
        - id: acme
          label: Acme
          col: 1
          row: 3
        - id: toronto
          label: Toronto
          note: GPE
          col: 3
          row: 2
          tone: data
        - id: last
          label: last
          col: 5
          row: 2
      edges:
        - from: joined
          to: shah
          label: nsubj
        - from: joined
          to: robotics
          label: dobj
        - from: joined
          to: in
          label: prep
        - from: joined
          to: june
          label: npadvmod
        - from: shah
          to: priya
          label: compound
        - from: robotics
          to: acme
          label: compound
        - from: in
          to: toronto
          label: pobj
        - from: june
          to: last
          label: amod
    bridges: []
  - id: linguistic-annotation.s5
    title: One early mistake, three wrong answers
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.linguistic-annotation
    markdown: |-
      Classic systems stack these steps into a **pipeline** (see the diagram), so errors flow downstream. If the tagger reads "Mark" in "Mark Diaz joined Hollis" as a verb, the parser builds the wrong tree and the extractor may never find Mark Diaz.

      Each step can be built from hand-written rules or learned from annotated examples:

      | | Hand-written rules | Learned models |
      | --- | --- | --- |
      | Good at | fixed formats: "INV-2024-00317", "2024-06-03" | varied wording: "the first Monday in June" |
      | Weak at | anything the rule-writer didn't foresee | text unlike their training data |

      That last weakness is **domain shift**. A news-trained tagger has rarely seen a clinical note like "Pt c/o SOB since Tues" (patient complains of shortness of breath since Tuesday), and may tag "SOB" as a proper noun. Before trusting a news-trained tool on new text, hand-label 50 sentences from that text and score the tool on them.

      :::mixup "The extractor found (Priya Shah, works for, Acme Robotics), so she works there."
      The row records what the story *says*. If the story is wrong or out of date, so is the row. Keep a link from each row to its source sentence so someone can check it.
      :::
    diagram:
      caption: A classic annotation pipeline. Each stage reads the text plus everything earlier stages added.
      description: Raw text goes to a tokenizer, which splits it into words. The words go to a part-of-speech tagger, then to a dependency parser, then to a named-entity recognizer. A relation extractor combines the parse and the entities into rows such as (Priya Shah, works for, Acme Robotics), which are stored in a table. A dashed arrow from the tagger to the extractor marks that a tagging error can travel all the way down.
      nodes:
        - id: text
          label: Raw text
          col: 0
          row: 0
        - id: tokens
          label: Tokenizer
          note: split into words
          col: 1
          row: 0
        - id: tagger
          label: POS tagger
          note: NNP, VBD, …
          col: 2
          row: 0
        - id: parser
          label: Dependency parser
          note: nsubj, dobj, …
          col: 3
          row: 0
        - id: ner
          label: Entity recognizer
          note: PERSON, ORG, …
          col: 3
          row: 1
          tone: accent
        - id: extractor
          label: Relation extractor
          note: rules over parse + entities
          col: 2
          row: 1
          tone: accent
        - id: table
          label: Structured rows
          note: (person, works for, org)
          col: 1
          row: 1
          tone: data
      edges:
        - from: text
          to: tokens
        - from: tokens
          to: tagger
        - from: tagger
          to: parser
        - from: parser
          to: ner
        - from: ner
          to: extractor
        - from: extractor
          to: table
        - from: tagger
          to: extractor
          label: errors travel down
          dashed: true
  - id: linguistic-annotation.s4
    title: Score the spans, and say how
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.linguistic-annotation
    markdown: |-
      To score an entity recognizer, compare its spans with a **gold standard**: the same text labeled carefully by people. Suppose the gold labels are our four entities, and a model predicts three: Priya Shah (PERSON), Acme (ORG), and Toronto (GPE).

      - **Precision** is the share of predicted spans that are correct.
      - **Recall** is the share of gold spans that were found.
      - **F1** combines the two: $F_1 = \frac{2PR}{P + R}$.

      Under **exact match**, a prediction counts only if its boundaries and type both match a gold span. "Acme" is not "Acme Robotics," so 2 of 3 predictions are right and 2 of 4 gold spans are found: precision $2/3 \approx 0.667$, recall $2/4 = 0.5$, F1 $\approx 0.571$. The CoNLL-2003 shared task, a standard NER benchmark, scores this way.

      ```python run
      gold = {("Priya Shah", "PERSON"), ("Acme Robotics", "ORG"),
              ("Toronto", "GPE"), ("last June", "DATE")}
      pred = {("Priya Shah", "PERSON"), ("Acme", "ORG"), ("Toronto", "GPE")}

      def score(matches):
          p = matches / len(pred)            # share of predictions that are right
          r = matches / len(gold)            # share of gold spans that were found
          f1 = 2 * p * r / (p + r)
          return f"precision {p:.3f}  recall {r:.3f}  F1 {f1:.3f}"

      exact = len(gold & pred)
      print("exact match:  ", score(exact))

      def overlaps(a, b):                    # same type and one text inside the other
          return a[1] == b[1] and (a[0] in b[0] or b[0] in a[0])

      loose = sum(any(overlaps(p, g) for g in gold) for p in pred)
      print("overlap match:", score(loose))
      ```

      A lenient overlap rule gives "Acme" credit and lifts F1 from 0.571 to 0.857 on the same predictions. So a score means little until you know the matching rule. Try adding ("June", "DATE") to `pred` and predict both lines before you run it.
    bridges: []
  - id: linguistic-annotation.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.linguistic-annotation
    markdown: BIO tags, dependency heads, a hospital's notes, and a few precision and recall calculations test whether you can read annotations and judge them.
    takeaway: |-
      Tags label words, entities label spans, and a dependency parse says who did what to whom. An extracted row records what the text claims, and its score depends on the matching rule.
  - id: linguistic-annotation.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.linguistic-annotation
    markdown: |-
      Text labels and extracted relationships depend on a defined annotation scheme. Check the boundaries and roles, and distinguish extracting a claim from verifying it.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - linguistic-annotation.s1
        - linguistic-annotation.s2
        - linguistic-annotation.s3
        - linguistic-annotation.s5
        - linguistic-annotation.s4
        - linguistic-annotation.check
      gate_refs:
        - gate.core
  scene_aliases:
    linguistic-annotation.recap: linguistic-annotation.check
assessment_families:
  - id: linguistic-annotation.base
    objective_ref: objective.linguistic-annotation
    task: base
    response_type: single_choice
    points: 1
    hint: 'Trace a small extraction: trace the inputs, operation, and result before choosing.'
    remediation_scene: linguistic-annotation.s2
    variants:
      - id: linguistic-annotation.base.1
        retired: true
        prompt: What does named-entity recognition commonly identify?
        options:
          - id: b
            text: Only the truth of every sentence
          - id: c
            text: Only the document’s byte length
          - id: a
            text: Text spans and entity types
        answer: a
        feedback: NER maps mentions to a defined span/type schema.
      - id: linguistic-annotation.base.2
        retired: true
        prompt: A dependency parser primarily represents what?
        options:
          - id: c
            text: Only a list of topic frequencies
          - id: a
            text: Syntactic relations among words
          - id: b
            text: The author’s guaranteed intent
        answer: a
        feedback: Parsing supplies structural relationships under a grammar or learned model.
  - id: linguistic-annotation.transfer
    objective_ref: objective.linguistic-annotation
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate the structured output: trace the inputs, operation, and result before choosing.'
    remediation_scene: linguistic-annotation.s4
    variants:
      - id: linguistic-annotation.transfer.1
        retired: true
        prompt: An extractor finds “Ada joined Acme” in a document. Has it independently verified the event?
        options:
          - id: c
            text: Only if Ada is capitalized
          - id: a
            text: No; it extracted a claim from text
          - id: b
            text: Yes; extraction is factual verification
        answer: a
        feedback: Source claims and independently validated facts are different.
      - id: linguistic-annotation.transfer.2
        retired: true
        prompt: A predicted entity has the right type but wrong span boundary. Can exact-match evaluation count it wrong?
        options:
          - id: a
            text: 'Yes'
          - id: b
            text: No; boundaries never matter
          - id: c
            text: Only in short documents
        answer: a
        feedback: The scoring convention determines which aspects must match.
  - id: linguistic-annotation.base.v2
    objective_ref: objective.linguistic-annotation
    task: base
    response_type: single_choice
    points: 1
    hint: Match the question to the layer. Tags label single words in context, BIO tags mark where names start and stop, and a dependency parse says which word attaches to which, and how.
    remediation_scene: linguistic-annotation.s2
    variants:
      - id: linguistic-annotation.base.v2.1
        prompt: 'A tagger labels "New York Times reporter" as B-ORG I-ORG I-ORG O. Which span did it mark as an organization?'
        options:
          - id: b
            text: "“New York”"
          - id: a
            text: "“New York Times”"
          - id: c
            text: "“New York Times reporter”"
        answer: a
        feedback: B-ORG starts the entity and each I-ORG continues it, so the span is the first three words. O on "reporter" means that word is outside every entity. "New York" alone would need an O or a new B on "Times."
      - id: linguistic-annotation.base.v2.2
        prompt: 'In a dependency parse of "Lena bought three red apples," which word is the head of "red"?'
        options:
          - id: c
            text: bought, the main verb of the sentence
          - id: b
            text: three, the word right before it
          - id: a
            text: apples, the noun it describes
        answer: a
        feedback: '"Red" describes the apples, so it attaches to "apples" as an adjective modifier. The main verb heads "Lena" and "apples," not the adjective, and being next to a word doesn''t make it the head.'
      - id: linguistic-annotation.base.v2.3
        prompt: 'In "Acme hired Priya," which layer of annotation tells you who did the hiring?'
        options:
          - id: a
            text: The dependency parse, which marks "Acme" as the subject of "hired"
          - id: b
            text: The part-of-speech tags, which mark both names as proper nouns
          - id: c
            text: The named entities, which label Acme an ORG and Priya a PERSON
        answer: a
        feedback: Both names are proper nouns and both are entities, so neither layer says who hired whom. The subject relation (nsubj) from the parse does. In "Priya hired Acme's lawyer," the entity types alone would mislead you.
      - id: linguistic-annotation.base.v2.4
        prompt: 'A tagger outputs "book/NN" for the sentence "Please book a table for four." What went wrong?'
        options:
          - id: b
            text: It split "book" into two tokens instead of keeping one
          - id: a
            text: It chose the noun reading; here "book" is a verb (VB)
          - id: c
            text: Nothing, since "book" is a noun far more often than a verb
        answer: a
        feedback: Tags describe how a word is used in this sentence. After "Please" and before "a table," "book" is a command verb. Picking the most common tag for a word, regardless of context, is exactly the mistake taggers are built to avoid.
  - id: linguistic-annotation.transfer.v2
    objective_ref: objective.linguistic-annotation
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what the tool was trained on, which earlier step its input came from, and whether its output is a fact or a claim found in the text.
    remediation_scene: linguistic-annotation.s5
    variants:
      - id: linguistic-annotation.transfer.v2.1
        prompt: An entity recognizer trained on news articles finds names well in news but misses most drug names in hospital notes. What is the most likely cause?
        options:
          - id: a
            text: The notes use names and a writing style it never saw in training
          - id: b
            text: Hospital notes are too short for an entity model to read
          - id: c
            text: Drug names are verbs, and entity models label only nouns
        answer: a
        feedback: This is domain shift. News rarely contains drug names or clinical shorthand, so the model has no patterns for them. Short text isn't the issue, and drug names are nouns.
      - id: linguistic-annotation.transfer.v2.2
        prompt: 'A pipeline tags, then parses, then extracts "who works where." The tagger labels "Mark" in "Mark Diaz joined Hollis" as a verb. What happens next?'
        options:
          - id: c
            text: The parser fixes the tag, since it reads the whole sentence
          - id: a
            text: Later steps build on the wrong tag and may miss Mark Diaz
          - id: b
            text: The extractor is unaffected, since it reads the entities
        answer: a
        feedback: Each stage takes the previous stage's output as given, so the parser builds a tree with "Mark" as a verb, and the extractor's subject rule can't find a person. Stages don't usually go back and repair earlier labels.
      - id: linguistic-annotation.transfer.v2.3
        prompt: An extractor reads a company press release and stores (Lena Ito, CEO of, Brightline). A reporter wants to cite it. What does the stored row show?
        options:
          - id: b
            text: That Lena Ito is Brightline's current chief executive
          - id: c
            text: That two independent sources agree about her role
          - id: a
            text: That the press release claims Lena Ito leads Brightline
        answer: a
        feedback: Extraction records what a text says. The release could be old, wrong, or promotional, so the reporter still needs to check it. Nothing in the row came from a second source.
      - id: linguistic-annotation.transfer.v2.4
        prompt: You need invoice numbers from emails, and every one has the exact form "INV-2024-00317". Which approach fits best?
        options:
          - id: b
            text: A named-entity model trained on news articles
          - id: c
            text: A dependency parser that finds each invoice's subject
          - id: a
            text: A hand-written pattern that matches the fixed format
        answer: a
        feedback: A fixed, predictable format is where rules shine; a pattern like INV-dddd-ddddd is precise and easy to check. A news-trained model has never seen invoice codes, and a parse says nothing about which strings are codes.
  - id: linguistic-annotation.score
    objective_ref: objective.linguistic-annotation
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Count the exact matches first. Precision divides them by the number of predicted spans; recall divides them by the number of gold spans.
    remediation_scene: linguistic-annotation.s4
    absolute_tolerance: 0.01
    numeric_fields:
      - id: precision
        label: Precision (as a decimal)
      - id: recall
        label: Recall (as a decimal)
    variants:
      - id: linguistic-annotation.score.1
        prompt: The gold standard for a news article has 5 entity spans. A model predicts 4 spans, and 3 of them match a gold span exactly (same boundaries and type). What are its precision and recall?
        answers:
          precision: 0.75
          recall: 0.6
        reason_answer: a
        reason_options:
          - id: a
            text: Precision divides matches by predictions; recall divides by gold spans.
          - id: b
            text: Both divide the matches by the number of gold spans.
          - id: c
            text: Precision divides matches by gold spans; recall divides by predictions.
        feedback: Precision is 3/4 = 0.75, since 3 of the 4 predictions are right. Recall is 3/5 = 0.6, since 3 of the 5 real entities were found.
      - id: linguistic-annotation.score.2
        prompt: A contract has 4 gold entity spans. A model predicts 5 spans and every gold span is among them, matched exactly. What are its precision and recall?
        answers:
          precision: 0.8
          recall: 1
        reason_answer: b
        reason_options:
          - id: a
            text: Both divide the matches by the number of gold spans.
          - id: b
            text: Precision divides matches by predictions; recall divides by gold spans.
          - id: c
            text: Precision divides matches by gold spans; recall divides by predictions.
        feedback: All 4 gold spans were found, so recall is 4/4 = 1. One of the 5 predictions is extra, so precision is 4/5 = 0.8. Perfect recall can hide false alarms.
      - id: linguistic-annotation.score.3
        prompt: A clinical note has 8 gold entity spans. A model predicts 6 spans, and 3 match a gold span exactly. What are its precision and recall?
        answers:
          precision: 0.5
          recall: 0.375
        reason_answer: c
        reason_options:
          - id: a
            text: Precision divides matches by gold spans; recall divides by predictions.
          - id: b
            text: Both divide the matches by the number of gold spans.
          - id: c
            text: Precision divides matches by predictions; recall divides by gold spans.
        feedback: Precision is 3/6 = 0.5 and recall is 3/8 = 0.375. Swapping the two denominators is the most common slip.
      - id: linguistic-annotation.score.4
        prompt: 'Gold spans are PERSON "Ana Ruiz" and ORG "Delta Labs". A model predicts PERSON "Ana Ruiz", ORG "Delta", and DATE "Monday". Using exact matching, what are its precision and recall?'
        answers:
          precision: 0.333
          recall: 0.5
        reason_answer: a
        reason_options:
          - id: a
            text: Only "Ana Ruiz" matches, so divide 1 by 3 predictions and by 2 gold spans.
          - id: b
            text: '"Delta" overlaps "Delta Labs," so divide 2 by 3 predictions and by 2 gold spans.'
          - id: c
            text: Only "Ana Ruiz" matches, so divide 1 by 2 predictions and by 3 gold spans.
        feedback: Under exact matching, "Delta" is not "Delta Labs," and "Monday" isn't in the gold set, so only one prediction is right. Precision is 1/3 ≈ 0.333 and recall is 1/2 = 0.5. A lenient overlap rule would count "Delta," which is why you must say which rule you used.
