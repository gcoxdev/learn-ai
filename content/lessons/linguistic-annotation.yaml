schema_version: 0.2-draft
lesson:
  id: linguistic-annotation
  version: 0.4.0-draft
  title: Turn text into structured labels and relations
  state: draft
  summary: A news story says someone joined a company. Tag the words, find the names, and parse who did what, then learn how to tell whether the labels are any good.
  slot: M14.2
  category: learning
  sources:
    - title: "Building a Large Annotated Corpus of English: The Penn Treebank (Marcus, Santorini & Marcinkiewicz, 1993)"
      url: https://aclanthology.org/J93-2004/
    - title: Speech and Language Processing, 3rd edition draft, chapters on POS tagging, NER, and dependency parsing (Jurafsky & Martin)
      url: https://web.stanford.edu/~jurafsky/slp3/
    - title: Universal Dependencies — universal POS tags
      url: https://universaldependencies.org/u/pos/
    - title: "Introduction to the CoNLL-2003 Shared Task: Language-Independent Named Entity Recognition (Tjong Kim Sang & De Meulder, 2003)"
      url: https://aclanthology.org/W03-0419/
objectives:
  - id: objective.linguistic-annotation
    version: 2-draft
    statement: Tagging, parsing, named-entity recognition, and information extraction impose annotation schemas on language; ambiguity and domain shifts affect their reliability.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - linguistic-annotation.base.v2
      - linguistic-annotation.transfer.v2
      - linguistic-annotation.score
    prerequisites:
      - anyOf:
          - objective.language-structure
      - anyOf:
          - objective.first-order-logic
scenes:
  - id: linguistic-annotation.s1
    title: Give every word a job title
    type: explanation
    depth: intuition
    objective_refs:
      - objective.linguistic-annotation
    markdown: |-
      A hiring-news service reads thousands of stories a day and fills a table: who joined which company, where, and when. One story says: *"Priya Shah joined Acme Robotics in Toronto last June."* First, the program labels the words.

      Adding structured labels to text is called **annotation**. The **schema** is the agreed list of labels and what each one means. The first layer is **part-of-speech (POS) tagging**: labeling each word as a noun, verb, adjective, and so on, as it's used *in this sentence*. Here is the kind of output a parser such as spaCy prints:

      ```text
      TEXT      POS    TAG   DEP       HEAD
      Priya     PROPN  NNP   compound  Shah
      Shah      PROPN  NNP   nsubj     joined
      joined    VERB   VBD   ROOT      joined
      Acme      PROPN  NNP   compound  Robotics
      Robotics  PROPN  NNP   dobj      joined
      in        ADP    IN    prep      joined
      Toronto   PROPN  NNP   pobj      in
      last      ADJ    JJ    amod      June
      June      PROPN  NNP   npadvmod  joined
      .         PUNCT  .     punct     joined
      ```

      The POS column uses the 17 coarse Universal Dependencies tags (PROPN is a proper noun, ADP a preposition). The TAG column uses the finer Penn Treebank tags: VBD is a past-tense verb, NNP a singular proper noun. DEP and HEAD come later.

      Tags depend on context: *book* is a noun in "read the book" and a verb in "book a table," so taggers look at neighboring words, not just a dictionary.

      :::story The treebank that trained a generation of parsers
      In 1993, Mitchell Marcus, Beatrice Santorini, and Mary Ann Marcinkiewicz published the Penn Treebank. Its best-known part is about a million words of *Wall Street Journal* text, every word tagged with one of about 45 part-of-speech tags and every sentence bracketed into a parse tree. For years, English parsers were compared by training on sections 2–21 and testing on section 23.
      :::
    bridges: []
  - id: linguistic-annotation.s2
    title: Names are spans, not single words
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.linguistic-annotation
    markdown: |-
      The table needs "Priya Shah," not "Priya" and "Shah" separately. **Named-entity recognition (NER)** finds **spans**, runs of consecutive words, that name something, and gives each a type. A common schema, used by spaCy's English models, includes PERSON, ORG (organization), GPE (a country, city, or state), and DATE.

      A tagger labels one word at a time, so how does it mark a two-word name? The standard trick is **BIO tagging**: **B** marks the first word of an entity, **I** marks a word inside the same entity, and **O** marks a word outside any entity.

      | Word | Priya | Shah | joined | Acme | Robotics | in | Toronto | last | June | . |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | BIO tag | B-PERSON | I-PERSON | O | B-ORG | I-ORG | O | B-GPE | B-DATE | I-DATE | O |

      Reading the tags back gives four entities: Priya Shah (PERSON), Acme Robotics (ORG), Toronto (GPE), and last June (DATE).

      :::predict Two different people are listed back to back: "…thanked Ada Lin Omar Haddad…". Why can't the tags be I-PERSON on all four words?
      Four I-PERSON tags in a row would read as one four-word name. The tagger needs B-PERSON on "Omar" to say a new entity starts there: B, I, B, I. That's exactly the job of the B tag.
      :::
    bridges: []
  - id: linguistic-annotation.s3
    title: Who joined what? Read the arrows
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.linguistic-annotation
    markdown: |-
      Entities alone don't say who joined whom. For that we need **dependency parsing**: every word points to one other word, its **head**, with a label naming the relationship. Look back at the DEP and HEAD columns. "Shah" points to "joined" as its subject (**nsubj**), "Robotics" points to "joined" as its direct object (**dobj**), and "Priya" points to "Shah" as part of a compound name. The one word with no head, "joined," is the **root** (spaCy marks it ROOT and lists it as its own head).

      An extractor can now read off a relation with a simple rule: *if the verb is "joined," its subject is a PERSON entity, and its object is an ORG entity, then record (person, works for, organization)*. That gives the row **(Priya Shah, works for, Acme Robotics)**, plus the place and date hanging off the same verb.

      Change the sentence to "Acme Robotics hired Priya Shah" and the subject and object swap, so the rule needs a second pattern for "hired." Pulling structured rows like this out of text is called **information extraction**.
    diagram:
      caption: The dependency parse of "Priya Shah joined Acme Robotics in Toronto last June." Each arrow runs from a head to a word that depends on it.
      description: The root verb "joined" has four dependents. "Shah" is its subject (nsubj), "Robotics" is its direct object (dobj), "in" is a prepositional modifier (prep), and "June" is a time modifier (npadvmod). "Shah" has the dependent "Priya" (compound), "Robotics" has "Acme" (compound), "in" has "Toronto" (pobj), and "June" has "last" (amod).
      nodes:
        - id: joined
          label: joined
          note: ROOT
          col: 2
          row: 0
          tone: accent
        - id: shah
          label: Shah
          note: PERSON
          col: 0
