schema_version: 0.2-draft
lesson:
  id: linguistic-annotation
  version: 0.3.0-draft
  title: Turn text into structured labels and relations
  state: draft
  summary: Mark names, word roles, and relationships in a sentence while keeping extracted claims separate
    from verified facts.
  slot: M14.2
  category: learning
  sources:
  - title: Speech and Language Processing — authors’ draft
    url: https://web.stanford.edu/~jurafsky/slp3/
objectives:
- id: objective.linguistic-annotation
  version: 1-draft
  statement: Tagging, parsing, named-entity recognition, and information extraction impose annotation schemas
    on language; ambiguity and domain shifts affect their reliability.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - linguistic-annotation.base
  - linguistic-annotation.transfer
  prerequisites:
  - anyOf:
    - objective.language-structure
  - anyOf:
    - objective.first-order-logic
scenes:
- id: linguistic-annotation.s1
  title: Decide which labels to add
  type: explanation
  depth: intuition
  objective_refs:
  - objective.linguistic-annotation
  markdown: '**Annotation** adds structured labels to text. A **schema** defines the allowed labels and what
    each means. Different tasks annotate different parts of a sentence:


    - **Part-of-speech tagging** labels tokens as nouns, verbs, and other categories in context.

    - **Named-entity recognition** finds named spans, such as the consecutive words “New York,” and assigns
    types such as person or place.

    - **Dependency parsing** links words through grammatical relationships, such as which word is the subject
    of an action.


    The schema determines which distinctions matter. These labels describe what the text says; they do not
    establish that the described event occurred.'
  text_mode: '**Annotation** adds structured labels to text. A **schema** defines the allowed labels and what
    each means. Different tasks annotate different parts of a sentence:


    - **Part-of-speech tagging** labels tokens as nouns, verbs, and other categories in context.

    - **Named-entity recognition** finds named spans, such as the consecutive words “New York,” and assigns
    types such as person or place.

    - **Dependency parsing** links words through grammatical relationships, such as which word is the subject
    of an action.


    The schema determines which distinctions matter. These labels describe what the text says; they do not
    establish that the described event occurred.'
  bridges: []
- id: linguistic-annotation.s2
  title: Trace a small extraction
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.linguistic-annotation
  markdown: In “Ada joined Acme in June,” an extractor might identify Ada as a person, Acme as an organization,
    and joined as an employment-related event. The time expression June still needs a year and contextual interpretation.
    Extracted structure is an inference from text, not independent confirmation that the event occurred.
  text_mode: In “Ada joined Acme in June,” an extractor might identify Ada as a person, Acme as an organization,
    and joined as an employment-related event. The time expression June still needs a year and contextual interpretation.
    Extracted structure is an inference from text, not independent confirmation that the event occurred.
  bridges: []
- id: linguistic-annotation.s3
  title: Rules and learned models make different tradeoffs
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.linguistic-annotation
  markdown: Rules can exploit predictable formats, while learned models can generalize across varied expressions.
    Domain-specific names, ambiguous spans, and changing style can challenge both. Sequence labeling must handle
    boundaries consistently, including multiword entities and nested mentions if the schema supports them.
  text_mode: Rules can exploit predictable formats, while learned models can generalize across varied expressions.
    Domain-specific names, ambiguous spans, and changing style can challenge both. Sequence labeling must handle
    boundaries consistently, including multiword entities and nested mentions if the schema supports them.
  bridges: []
- id: linguistic-annotation.s4
  title: Evaluate the structured output
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.linguistic-annotation
  markdown: 'Span-level precision and recall depend on whether exact boundaries and types must match. Relation
    and event extraction require matching arguments and roles. Inspect annotation disagreements and unsupported
    conclusions. A pipeline can propagate an early entity error into later graph or retrieval results.


    Suppose the reference organization is “Acme Research,” but the model labels only “Acme.” Under exact span
    matching, that is not a correct complete match even if the category is organization in both. A different
    evaluation could give partial credit, but must say so. Try marking the beginning and end of each name before
    comparing scores.'
  text_mode: 'Span-level precision and recall depend on whether exact boundaries and types must match. Relation
    and event extraction require matching arguments and roles. Inspect annotation disagreements and unsupported
    conclusions. A pipeline can propagate an early entity error into later graph or retrieval results.


    Suppose the reference organization is “Acme Research,” but the model labels only “Acme.” Under exact span
    matching, that is not a correct complete match even if the category is organization in both. A different
    evaluation could give partial credit, but must say so. Try marking the beginning and end of each name before
    comparing scores.'
  bridges: []
- id: linguistic-annotation.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.linguistic-annotation
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Text labels and extracted relationships depend on a defined annotation scheme. Check the boundaries
    and roles, and distinguish extracting a claim from verifying it.
- id: linguistic-annotation.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.linguistic-annotation
  markdown: Text labels and extracted relationships depend on a defined annotation scheme. Check the boundaries
    and roles, and distinguish extracting a claim from verifying it.
  text_mode: Text labels and extracted relationships depend on a defined annotation scheme. Check the boundaries
    and roles, and distinguish extracting a claim from verifying it.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - linguistic-annotation.s1
    - linguistic-annotation.s2
    - linguistic-annotation.s3
    - linguistic-annotation.s4
    - linguistic-annotation.check
    gate_refs:
    - gate.core
  scene_aliases:
    linguistic-annotation.recap: linguistic-annotation.check
assessment_families:
- id: linguistic-annotation.base
  objective_ref: objective.linguistic-annotation
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace a small extraction: trace the inputs, operation, and result before choosing.'
  remediation_scene: linguistic-annotation.s2
  variants:
  - id: linguistic-annotation.base.1
    prompt: What does named-entity recognition commonly identify?
    options:
    - id: b
      text: Only the truth of every sentence
    - id: c
      text: Only the document’s byte length
    - id: a
      text: Text spans and entity types
    answer: a
    feedback: NER maps mentions to a defined span/type schema.
  - id: linguistic-annotation.base.2
    prompt: A dependency parser primarily represents what?
    options:
    - id: c
      text: Only a list of topic frequencies
    - id: a
      text: Syntactic relations among words
    - id: b
      text: The author’s guaranteed intent
    answer: a
    feedback: Parsing supplies structural relationships under a grammar or learned model.
- id: linguistic-annotation.transfer
  objective_ref: objective.linguistic-annotation
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate the structured output: trace the inputs, operation, and result before choosing.'
  remediation_scene: linguistic-annotation.s4
  variants:
  - id: linguistic-annotation.transfer.1
    prompt: An extractor finds “Ada joined Acme” in a document. Has it independently verified the event?
    options:
    - id: c
      text: Only if Ada is capitalized
    - id: a
      text: No; it extracted a claim from text
    - id: b
      text: Yes; extraction is factual verification
    answer: a
    feedback: Source claims and independently validated facts are different.
  - id: linguistic-annotation.transfer.2
    prompt: A predicted entity has the right type but wrong span boundary. Can exact-match evaluation count
      it wrong?
    options:
    - id: a
      text: 'Yes'
    - id: b
      text: No; boundaries never matter
    - id: c
      text: Only in short documents
    answer: a
    feedback: The scoring convention determines which aspects must match.
