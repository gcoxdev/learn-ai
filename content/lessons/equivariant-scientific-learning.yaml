assessment_families:
  - id: equivariant-scientific-learning.base
    objective_ref: objective.equivariant-scientific-learning
    task: base
    response_type: single_choice
    points: 1
    hint: 'Use geometric relationships: trace the inputs, operation, and result before choosing.'
    remediation_scene: equivariant-scientific-learning.s2
    variants:
      - id: equivariant-scientific-learning.base.1
        prompt: How should a force vector behave under a rigid rotation of the modeled system?
        options:
          - id: a
            text: Rotate consistently under the stated physical assumptions
          - id: b
            text: Always remain the identical coordinate tuple
          - id: c
            text: Become a class label
        answer: a
        feedback: Vector outputs are typically equivariant.
        retired: true
      - id: equivariant-scientific-learning.base.2
        prompt: What is invariant under rigid translation and rotation?
        options:
          - id: b
            text: Every coordinate component
          - id: c
            text: Every force component
          - id: a
            text: Pairwise Euclidean distance
        answer: a
        feedback: Relative distances do not depend on frame orientation or origin.
        retired: true
  - id: equivariant-scientific-learning.transfer
    objective_ref: objective.equivariant-scientific-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Choose the correct symmetry group: trace the inputs, operation, and result before choosing.'
    remediation_scene: equivariant-scientific-learning.s4
    variants:
      - id: equivariant-scientific-learning.transfer.1
        prompt: Does passing an equivariance test prove physical accuracy?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if tolerance is small
          - id: a
            text: 'No'
        answer: a
        feedback: Symmetry consistency and predictive correctness differ.
        retired: true
      - id: equivariant-scientific-learning.transfer.2
        prompt: Can an incorrect symmetry assumption hurt expressiveness?
        options:
          - id: c
            text: Only if the dataset is small
          - id: a
            text: 'Yes'
          - id: b
            text: 'No'
        answer: a
        feedback: The model may be forced to equate outcomes that should differ.
        retired: true
  - id: equivariant-scientific-learning.base.v2
    objective_ref: objective.equivariant-scientific-learning
    task: base
    response_type: single_choice
    points: 1
    hint: Ask what kind of thing the output is. A single number describing the whole system should stay the same; an arrow attached to the system should turn with it.
    remediation_scene: equivariant-scientific-learning.s1
    variants:
      - id: equivariant-scientific-learning.base.v2.1
        prompt: A model predicts a molecule's dipole moment, an arrow pointing from its negative to its positive side. The molecule is rotated 90°. What should the prediction do?
        options:
          - id: b
            text: Stay the same arrow, since the molecule itself hasn't changed
          - id: a
            text: Rotate 90° as well, since the dipole is attached to the molecule
          - id: c
            text: Keep its length but point in a direction learned from data
        answer: a
        feedback: A dipole is a vector, so it must be equivariant and turn with the molecule. Keeping the same arrow would make it point the wrong way relative to the atoms. Its length is invariant, but its direction is fixed by the rotation, not learned.
      - id: equivariant-scientific-learning.base.v2.2
        prompt: Which input keeps a model's energy prediction unchanged when a molecule is rotated and shifted?
        options:
          - id: a
            text: The distances between each pair of atoms
          - id: c
            text: The x, y, z coordinates of each atom
          - id: b
            text: The atoms' positions measured from the first atom listed
        answer: a
        feedback: Rigid moves preserve every pairwise distance, so a model reading only distances is invariant. Raw coordinates change under both moves. Positions relative to one atom survive a shift but still turn under rotation.
      - id: equivariant-scientific-learning.base.v2.3
        prompt: An energy model is exactly rotation-invariant, and its forces are computed as F = −∂E/∂x. How will those forces behave when the molecule rotates?
        options:
          - id: c
            text: They stay the same, since they come from an invariant energy
          - id: a
            text: They rotate with the molecule, since they are slopes in space
          - id: b
            text: They need a separate equivariant layer before they rotate
        answer: a
        feedback: The slope of an invariant energy points along spatial directions, and those directions turn with the molecule, so the forces come out equivariant automatically. That's why many force fields predict only energy.
      - id: equivariant-scientific-learning.base.v2.4
        prompt: In an E(n)-equivariant graph network, why may positions be updated as x_i + Σ (x_i − x_j)·φ(m_ij)?
        options:
          - id: b
            text: The φ network learns during training which way to rotate each atom
          - id: c
            text: The sum over neighbors cancels any rotation of the input
          - id: a
            text: Difference vectors turn with the molecule and φ(m_ij) is invariant
        answer: a
        feedback: Each term is a rotating arrow (x_i − x_j) times an invariant number, so the whole update rotates with the input. Nothing about rotation is learned, and the sum doesn't cancel rotation; it preserves it.
      - id: equivariant-scientific-learning.base.v2.5
        prompt: Why did the NequIP authors highlight data efficiency for their equivariant model?
        options:
          - id: a
            text: It needn't learn rotations from examples, so each label teaches chemistry
          - id: b
            text: It skipped quantum-chemistry labels and learned from distances alone
          - id: c
            text: It trained on rotated copies of each molecule, multiplying the data
        answer: a
        feedback: Built-in symmetry means no training examples are spent learning that rotated molecules are the same, and labels are costly quantum calculations. NequIP still used those labels, and rotated copies describe data augmentation, the alternative approach.
  - id: equivariant-scientific-learning.transfer.v2
    objective_ref: objective.equivariant-scientific-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: List what really leaves the target unchanged in this situation. Watch for mirror images, external fields, and repeating patterns.
    remediation_scene: equivariant-scientific-learning.s4
    variants:
      - id: equivariant-scientific-learning.transfer.v2.1
        prompt: A model scores how strongly drug candidates bind a protein pocket. Two candidates are mirror images of each other. Which symmetry should the model build in?
        options:
          - id: b
            text: Full E(3), so mirror images always receive the same score
          - id: a
            text: Rotations and shifts only, so mirror images can score differently
          - id: c
            text: No symmetry, so the model learns every orientation from data
        answer: a
        feedback: Mirror-image drugs can fit a pocket differently, so reflections must not be treated as "no change." Rotations and shifts still don't matter. Dropping all symmetry throws away help the model can use.
      - id: equivariant-scientific-learning.transfer.v2.2
        prompt: A team predicts a molecule's energy in a strong electric field pointing along the z-axis. Which transformations should leave the energy unchanged?
        options:
          - id: c
            text: Any rotation, since energy is a scalar
          - id: b
            text: Rotations about the x-axis, across the field
          - id: a
            text: Rotations about the z-axis, the field's own axis
        answer: a
        feedback: The field picks out a direction, so tilting the molecule relative to it changes the energy. Spinning around the field's axis leaves the whole setup looking the same. Turning about the x-axis tilts the molecule relative to the field. Being a scalar doesn't make energy invariant when something outside the molecule fixes a direction.
      - id: equivariant-scientific-learning.transfer.v2.3
        prompt: A weather model reads wind vectors on a map of one country and predicts tomorrow's wind. Why might a fully rotation-equivariant design be a poor fit?
        options:
          - id: a
            text: Geography and Earth's rotation fix real directions like north
          - id: b
            text: Wind is a scalar, so it should be invariant instead
          - id: c
            text: Equivariant layers can't handle data on a flat grid
        answer: a
        feedback: Mountains, coastlines, and the Coriolis effect make north and east physically different, so rotating the map is not a real symmetry. Wind is a vector, not a scalar, and grids can be equivariant; the problem is that the symmetry isn't true.
      - id: equivariant-scientific-learning.transfer.v2.4
        prompt: A robot's grasp planner predicts where to put its gripper on objects lying on a table, seen from above. Which behavior should it have when an object is spun on the table?
        options:
          - id: b
            text: The grasp point stays at the same table coordinates
          - id: c
            text: The grasp point is recomputed from scratch at a random spot
          - id: a
            text: The grasp point spins with the object around the same axis
        answer: a
        feedback: The grasp is attached to the object, so it should be equivariant to rotations about the vertical axis. Staying fixed in table coordinates would miss the handle once it has turned.
      - id: equivariant-scientific-learning.transfer.v2.5
        prompt: A crystal-property model uses distances between atoms but ignores that the crystal repeats in every direction. What will it get wrong?
        options:
          - id: c
            text: It will treat mirror-image crystals as identical
          - id: a
            text: It will miss neighbors across the edge of the unit cell
          - id: b
            text: It will change its prediction when the crystal rotates
        answer: a
        feedback: In a periodic crystal, an atom near one face has neighbors in the next copy of the cell, so distances must be measured across the repeating boundary. Pure distances are still rotation-invariant, and mirror images are a separate question.
  - id: equivariant-scientific-learning.calculate
    objective_ref: objective.equivariant-scientific-learning
    task: base
    response_type: numeric
    points: 1
    hint: Invariant outputs keep their value. For a vector, a 90° counterclockwise turn sends (x, y) to (−y, x), and a 180° turn sends it to (−x, −y).
    remediation_scene: equivariant-scientific-learning.s2
    absolute_tolerance: 0.01
    variants:
      - id: equivariant-scientific-learning.calculate.1
        prompt: A 2-D molecule is rotated 90° counterclockwise. Before the rotation an equivariant model predicted a force (2, 1) on one atom. What is the x-component of the force after the rotation?
        answer: -1
        feedback: (x, y) → (−y, x) turns (2, 1) into (−1, 2), so the x-component is −1.
      - id: equivariant-scientific-learning.calculate.2
        prompt: An equivariant model predicts a force (0, −3) on an atom. The system is rotated 90° counterclockwise. What is the new x-component?
        answer: 3
        feedback: (x, y) → (−y, x) turns (0, −3) into (3, 0). A downward push becomes a push to the right.
      - id: equivariant-scientific-learning.calculate.3
        prompt: An invariant model predicts an energy of 7.3 for a molecule. The molecule is shifted 5 units along x and then rotated 60°. What should the model predict now?
        answer: 7.3
        feedback: An invariant output ignores rigid moves, so it stays 7.3. A different answer means the model reads raw coordinates somewhere.
      - id: equivariant-scientific-learning.calculate.4
        prompt: An equivariant model predicts a force (1.5, −2) on an atom. The system is rotated 180°. What is the new y-component?
        answer: 2
        feedback: A 180° turn flips both components, (1.5, −2) → (−1.5, 2), so the y-component is 2.
      - id: equivariant-scientific-learning.calculate.5
        prompt: Atoms sit at (0, 0) and (3, 4). Both are rotated 90° counterclockwise about the origin. What is the distance between them afterward?
        answer: 5
        feedback: The second atom moves to (−4, 3), and √(4² + 3²) = 5, the same as before. Distances are invariant, which is why distance-based models are too.
