schema_version: 0.2-draft
lesson:
  id: equivariant-scientific-learning
  version: 0.2.0-draft
  title: Build symmetry into predictions about geometry
  state: draft
  summary: Make predictions that respond correctly when an object moves or rotates.
  slot: M34.2
  category: learning
  sources:
  - title: E(n) Equivariant Graph Neural Networks
    url: https://arxiv.org/abs/2102.09844
  - title: Geometric Deep Learning
    url: https://arxiv.org/abs/2104.13478
objectives:
- id: objective.equivariant-scientific-learning
  version: 1-draft
  statement: Geometric learning uses invariance or equivariance under relevant transformations; match scalar,
    vector, and structural outputs to the symmetries the scientific task actually possesses.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - equivariant-scientific-learning.base
  - equivariant-scientific-learning.transfer
  prerequisites:
  - anyOf:
    - objective.graph-neural-networks
  - anyOf:
    - objective.geometry-and-symmetry
scenes:
- id: equivariant-scientific-learning.s1
  title: State what should stay or move
  type: explanation
  depth: intuition
  objective_refs:
  - objective.equivariant-scientific-learning
  markdown: A molecule’s scalar energy should usually not change when the whole isolated configuration is translated
    or rotated under the model’s assumptions. A predicted force vector should rotate with the molecule. Invariance
    preserves an output; equivariance transforms it consistently with the input.
  text_mode: A molecule’s scalar energy should usually not change when the whole isolated configuration is
    translated or rotated under the model’s assumptions. A predicted force vector should rotate with the molecule.
    Invariance preserves an output; equivariance transforms it consistently with the input.
  bridges: []
- id: equivariant-scientific-learning.s2
  title: Use geometric relationships
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.equivariant-scientific-learning
  markdown: Distances between points remain unchanged under rigid rotations and translations. Networks can
    use such quantities or structured vector/tensor operations to respect symmetry. Atom types, charges, boundary
    conditions, and external fields can introduce additional information or break otherwise expected symmetries.
  text_mode: Distances between points remain unchanged under rigid rotations and translations. Networks can
    use such quantities or structured vector/tensor operations to respect symmetry. Atom types, charges, boundary
    conditions, and external fields can introduce additional information or break otherwise expected symmetries.
  bridges:
  - geometry-and-symmetry
- id: equivariant-scientific-learning.s3
  title: Test a concrete transformation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.equivariant-scientific-learning
  markdown: 'Rotate every coordinate and compare predictions. An invariant scalar should agree within numerical
    tolerance, while a vector prediction should match the rotated original vector. This checks the implementation’s
    symmetry property but does not prove its physical predictions are accurate.


    A quarter-turn counterclockwise in a two-dimensional plane maps vector [1, 0] to [0, 1]. An equivariant
    force prediction should rotate the same way. A scalar energy of 5 should remain 5 when the physical situation
    is unchanged by that rotation. A symmetry group is a collection of transformations with consistent composition
    and inverses. Chirality describes handedness: a shape and its mirror image may not be interchangeable for
    a particular scientific task.'
  text_mode: 'Rotate every coordinate and compare predictions. An invariant scalar should agree within numerical
    tolerance, while a vector prediction should match the rotated original vector. This checks the implementation’s
    symmetry property but does not prove its physical predictions are accurate.


    A quarter-turn counterclockwise in a two-dimensional plane maps vector [1, 0] to [0, 1]. An equivariant
    force prediction should rotate the same way. A scalar energy of 5 should remain 5 when the physical situation
    is unchanged by that rotation. A symmetry group is a collection of transformations with consistent composition
    and inverses. Chirality describes handedness: a shape and its mirror image may not be interchangeable for
    a particular scientific task.'
  bridges: []
- id: equivariant-scientific-learning.s4
  title: Choose the correct symmetry group
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.equivariant-scientific-learning
  markdown: Reflection symmetry may be inappropriate for some chirality-sensitive tasks; periodic boundaries
    require their own handling. A strong but wrong symmetry assumption can prevent the model from expressing
    the target. Evaluate both structural consistency and held-out scientific accuracy.
  text_mode: Reflection symmetry may be inappropriate for some chirality-sensitive tasks; periodic boundaries
    require their own handling. A strong but wrong symmetry assumption can prevent the model from expressing
    the target. Evaluate both structural consistency and held-out scientific accuracy.
  bridges: []
- id: equivariant-scientific-learning.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.equivariant-scientific-learning
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Geometric learning uses invariance or equivariance under relevant transformations; match scalar,
    vector, and structural outputs to the symmetries the scientific task actually possesses.
- id: equivariant-scientific-learning.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.equivariant-scientific-learning
  markdown: Geometric learning uses invariance or equivariance under relevant transformations; match scalar,
    vector, and structural outputs to the symmetries the scientific task actually possesses.
  text_mode: Geometric learning uses invariance or equivariance under relevant transformations; match scalar,
    vector, and structural outputs to the symmetries the scientific task actually possesses.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - equivariant-scientific-learning.s1
    - equivariant-scientific-learning.s2
    - equivariant-scientific-learning.s3
