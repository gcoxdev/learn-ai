scenes:
  - id: speech-audio-project.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.speech-audio-project
    title: A doorbell Sam can see
    markdown: |-
      Sam is deaf. His kitchen tablet should do two things: flash the screen when the doorbell goes "ding-dong", and caption whatever the visitor says into the intercom. Last week it flashed for the microwave and captioned "who is at the front door" as "who is at the front floor".

      In this project you'll build the doorbell detector from raw samples and measure the captions, using the tools from module 13: spectrograms, speech recognition, and word error rate.

      **Your brief**

      | | |
      | --- | --- |
      | Goal | Detect the doorbell's two-note chime from audio, ignore the microwave, and measure caption accuracy in quiet and noisy conditions |
      | Audience | Sam's family, who set up the tablet, and the developer who maintains it |
      | Done looks like | A spectrogram and note list for the test signal, a detector that says yes to the doorbell and no to the microwave, a word-error table by condition, and one recommendation |
      | Time | About 35 minutes |

      Two different jobs share this pipeline. The detector looks at *pitch*, how high a sound is. The captions come from a speech recognizer, which maps sound to words. They fail in different ways, so each gets its own test.
  - id: speech-audio-project.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.speech-audio-project
    title: Make a sound you can check by hand
    markdown: |-
      **The supplied data** is a signal you synthesize, so you know exactly what's in it. Tones are sine waves, as in the figure below: a higher frequency fits more cycles into the same window.

      | Time (s) | Sound | Pitch |
      | --- | --- | --- |
      | 0.0 to 0.3 | Doorbell "ding" | 600 Hz |
      | 0.3 to 0.7 | Doorbell "dong" | 400 Hz |
      | 0.7 to 1.0 | Silence | none |
      | 1.0 to 1.2 | Microwave beep | 800 Hz |

      Everything gets a faint hiss (random noise with a standard deviation of 0.05) so the detector can't cheat on perfect silence.

      **Milestone 1: count the samples.** Use 8,000 samples per second, as old telephone lines did. By the Nyquist rule from *From a waveform to time-frequency features*, that captures pitches up to 4,000 Hz, far above the 800 Hz beep. The 1.2-second signal is 1.2 × 8,000 = 9,600 samples; stored at 2 bytes each, 19,200 bytes.

      Cut it into 25 ms windows (200 samples) starting every 10 ms (80 samples). That gives 118 full windows: the first starts at sample 0 and the last at sample 117 × 80 = 9,360. Each window's FFT has 200 ÷ 2 + 1 = 101 frequency bins, spaced 8,000 ÷ 200 = 40 Hz apart. So 400 Hz lands exactly in bin 10, 600 Hz in bin 15, and 800 Hz in bin 20.
    bridges:
      - arithmetic
      - audio-representations
    figure:
      kind: audio
      caption: A brief synthetic tone connects frequency to a waveform. Playback starts only when you press Play.
      description: 'A sine wave describes one simple tone, not a speech model. Inspect the same fixed time window while changing frequency: more cycles fit into that window at a higher frequency. Play a brief tone to connect the picture with the sound.'
  - id: speech-audio-project.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.speech-audio-project
    title: From waveform to spectrogram to notes
    markdown: |-
      **Milestone 2: build the detector.** Four steps turn samples into a yes or no:

      1. **Spectrogram.** Window each 25 ms frame and take its FFT, exactly the pipeline from *From a waveform to time-frequency features*.
      2. **Silence gate.** Skip frames whose loudness (standard deviation of the samples) is below 0.1; hiss alone is about 0.03.
      3. **Pitch track.** For each loud frame, the pitch is the loudest bin × 40 Hz.
      4. **Notes and rule.** Merge runs of the same pitch lasting at least 3 frames into notes. The doorbell is a 600 Hz note followed by a 400 Hz note that starts less than 0.5 s later.

      ```python run
      import numpy as np

      SR = 8000                                   # samples per second
      rng = np.random.default_rng(0)
      def tone(freq, seconds):                    # a pure tone at the given pitch
          return np.sin(2 * np.pi * freq * np.arange(int(SR * seconds)) / SR)
      def silence(seconds):
          return np.zeros(int(SR * seconds))
      # doorbell "ding" (600 Hz), "dong" (400 Hz), a pause, then a microwave beep (800 Hz), plus hiss
      audio = np.concatenate([tone(600, 0.3), tone(400, 0.4), silence(0.3), tone(800, 0.2)])
      audio += 0.05 * rng.normal(size=audio.size)

      WIN, HOP = 200, 80                          # 25 ms windows every 10 ms
      frames = np.array([audio[s:s + WIN] * np.hanning(WIN) for s in range(0, audio.size - WIN + 1, HOP)])
      spec = np.abs(np.fft.rfft(frames, axis=1))  # spectrogram: one row per frame, bins 40 Hz apart
      print("spectrogram shape (frames, bins):", spec.shape)

      loud = frames.std(axis=1) > 0.1             # silence gate: skip frames that are only hiss
      pitch = np.where(loud, spec.argmax(axis=1) * SR / WIN, 0)

      notes, start = [], 0                        # merge runs of equal pitch into notes
      for i in range(1, len(pitch) + 1):
          if i == len(pitch) or pitch[i] != pitch[start]:
              if pitch[start] > 0 and i - start >= 3:
                  notes.append((int(pitch[start]), round(start * HOP / SR, 2), i - start))
              start = i
      print("notes (Hz, starts at s, frames):", notes)
      pairs = zip(notes, notes[1:])
      print("doorbell?", any(a[0] == 600 and b[0] == 400 and b[1] - a[1] < 0.5 for a, b in pairs))
      ```

      **Expected output:**

      ```
      spectrogram shape (frames, bins): (118, 101)
      notes (Hz, starts at s, frames): [(600, 0.0, 29), (400, 0.29, 41), (800, 0.99, 19)]
      doorbell? True
      ```

      Three notes, in the right order, at the right pitches. The microwave's 800 Hz beep becomes a note too, but it doesn't match the doorbell rule, so it can't trigger a flash on its own. Notes start about 0.01 s early because a window that straddles a boundary already hears the next tone.

      :::predict The doorbell wears out and its "dong" drifts to 420 Hz. Change `tone(400, 0.4)` to `tone(420, 0.4)`. What does the detector say?
      "doorbell? False." 420 Hz sits halfway between the 400 and 440 Hz bins, so the loudest bin flips between them from frame to frame. The 41-frame note shatters into short 440 and 400 Hz pieces, and the rule, which wants exactly 400, never fires. Fix it by accepting pitches within about 60 Hz of the target and merging neighboring bins before finding notes.
      :::
  - id: speech-audio-project.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.speech-audio-project
    title: Score the captions with word error rate
    markdown: |-
      **Milestone 3: measure the recognizer.** The developer recorded four intercom phrases, two in a quiet kitchen and two with the dishwasher running, and saved what the recognizer wrote. This is the second supplied dataset:

      | Condition | Said (reference) | Captioned (hypothesis) |
      | --- | --- | --- |
      | Quiet | turn on the porch light | turn on the porch light |
      | Quiet | set a timer for ten minutes and remind me to stir | set a timer for ten minutes and remind me to stir it |
      | Noisy | who is at the front door | who is at the front floor |
      | Noisy | call my sister on speaker | call sister on the speaker |

      Word error rate, from *Map sound into words with an alignment model*, is $(S + D + I) / N$: substitutions, deletions, and insertions, over the number of words actually said. The code finds the smallest set of edits with the same edit-distance table as that lesson, then totals each condition.

      ```python run
      import numpy as np

      def edits(ref, hyp):
          """Minimum substitutions, deletions, insertions turning ref into hyp (word lists)."""
          d = np.zeros((len(ref) + 1, len(hyp) + 1), dtype=int)
          d[:, 0], d[0, :] = range(len(ref) + 1), range(len(hyp) + 1)
          for i in range(1, len(ref) + 1):
              for j in range(1, len(hyp) + 1):
                  d[i, j] = min(d[i - 1, j - 1] + (ref[i - 1] != hyp[j - 1]), d[i - 1, j] + 1, d[i, j - 1] + 1)
          S = D = I = 0
          i, j = len(ref), len(hyp)
          while i or j:                                        # walk back to label each edit
              if i and j and d[i, j] == d[i - 1, j - 1] + (ref[i - 1] != hyp[j - 1]):
                  S, i, j = S + (ref[i - 1] != hyp[j - 1]), i - 1, j - 1
              elif i and d[i, j] == d[i - 1, j] + 1:
                  D, i = D + 1, i - 1
              else:
                  I, j = I + 1, j - 1
          return S, D, I

      tests = [  # (condition, what was said, what the recognizer wrote)
          ("quiet", "turn on the porch light", "turn on the porch light"),
          ("quiet", "set a timer for ten minutes and remind me to stir", "set a timer for ten minutes and remind me to stir it"),
          ("noisy", "who is at the front door", "who is at the front floor"),
          ("noisy", "call my sister on speaker", "call sister on the speaker"),
      ]
      totals = {}
      for cond, ref, hyp in tests:
          S, D, I = edits(ref.split(), hyp.split())
          n = len(ref.split())
          print(f"{cond}: S={S} D={D} I={I} N={n}  WER {(S + D + I) / n:.3f}   '{hyp}'")
          e, w = totals.get(cond, (0, 0)); totals[cond] = (e + S + D + I, w + n)
      for cond, (e, w) in totals.items():
          print(f"{cond} WER = {e}/{w} = {e / w:.3f}")
      e, w = map(sum, zip(*totals.values()))
      print(f"overall WER = {e}/{w} = {e / w:.3f}")
      ```

      **Expected output:**

      | Phrase | S | D | I | N | WER |
      | --- | ---: | ---: | ---: | ---: | ---: |
      | porch light | 0 | 0 | 0 | 5 | 0.000 |
      | timer | 0 | 0 | 1 | 11 | 0.091 |
      | front door | 1 | 0 | 0 | 6 | 0.167 |
      | call my sister | 0 | 1 | 1 | 5 | 0.400 |

      Then: quiet 1/16 (printed as 0.062; exactly 6.25%), noisy 3/11 = 0.273, overall 4/27 = 0.148.

      :::predict Why is "call sister on the speaker" 2 edits, not 3?
      Line it up: "call" matches, "my" is missing (one deletion), "sister on" match, "the" is extra (one insertion), "speaker" matches. Treating it as substitutions instead ("my"→"sister", "sister"→"on", "on"→"the") costs 3, and the table always keeps the cheapest alignment.
      :::
  - id: speech-audio-project.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.speech-audio-project
    title: What to fix first
    markdown: |-
      **Milestone 4: interpret.** The overall 14.8% hides the story. Split by condition, as the lesson *Judge quality across time, languages, and delay* recommends: quiet speech is at 6.25%, noisy speech at 27.3%, more than four times worse. The fix belongs in the noisy kitchen: a better microphone position, noise suppression, or a recognizer tested on kitchen noise.

      Then read the errors, not only the rate. "stir it" is harmless. "front floor" for "front door" changes what Sam thinks is happening, but it's one substitution, the same count as a harmless one. WER treats every edit alike, so always list the actual errors beside the number.

      Keep the evidence size in mind: the noisy rate rests on 11 words. Before promising anything, record at least a few hundred words per condition.

      | Mistake | How to spot it | Fix |
      | --- | --- | --- |
      | Dividing by words the recognizer wrote | Your N differs from the reference word count | Always divide by reference words |
      | Averaging the per-phrase rates | You get 16.4% instead of 14.8% | Total the edits and the words, then divide once |
      | One overall number | No condition column | Report WER per condition |
      | Exact pitch matching | The detector fails at 420 Hz | Allow a tolerance around each note |
      | No negative test | Nothing checks that the microwave is ignored | Include sounds that must *not* trigger |

      :::mixup "The average of the four phrase WERs is the system's WER."
      That average, (0 + 0.091 + 0.167 + 0.400) ÷ 4 = 16.4%, gives the 5-word phrase the same weight as the 11-word one. Standard WER totals edits over total reference words: 4/27 = 14.8%. With many short phrases the two can differ a lot, so say which you report.
      :::
  - id: speech-audio-project.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.speech-audio-project
    title: Report to the family, then score it
    markdown: |-
      **Milestone 5: recommend.** Write three or four sentences Sam's family can act on. For example: "The doorbell detector found the chime and ignored the microwave, but it misses if the dong drifts from 400 Hz, so we widened its tolerance to ±60 Hz. Captions are accurate in a quiet kitchen (6% word errors) but four times worse with the dishwasher running (27%), and one noisy error changed 'door' to 'floor'. Until the noise problem is fixed, the tablet should also flash for any intercom speech, so Sam never relies on the caption alone."

      **No-code option.** Do milestone 1's arithmetic by hand. Sketch the spectrogram as a grid (time across, bins up) with the three notes as bright bars, and apply the doorbell rule by eye. Then align the four transcript pairs with pencil, mark each S, D, and I, and compute the WER table.

      **Extension.** Add a synthesized "speech-like" sound: a 150 Hz tone plus its harmonics at 300, 450, and 600 Hz. Give the harmonics equal loudness. What pitch does the loudest-bin detector report, and why is that a problem for tracking a voice?

      **Rubric.** Score yourself, or ask a friend to check your numbers.

      | Criterion | Not yet | Solid | Excellent |
      | --- | --- | --- | --- |
      | Signal arithmetic | Missing | Samples, frames, and bins correct | Explains why each tone lands in its bin |
      | Detector | Fires on any note | Fires on the doorbell only | Tested on a drifted pitch and a non-target sound |
      | WER | Wrong denominator | Correct per phrase | Correct per condition, totaled properly |
      | Error reading | Rates only | Lists the actual errors | Ranks errors by what they do to Sam |
      | Recommendation | None | Names what to fix | Includes a safe fallback and how much more data to collect |

      The questions below check the concepts; judge your own project with the rubric.
  - id: speech-audio-project.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.speech-audio-project
    markdown: |-
      Compute a few error rates, explain the drifting doorbell, then judge a smoke-alarm detector, a captioning vendor, and a bird-song app that fails in the wind.
    takeaway: |-
      A spectrogram turns samples into pitches you can reason about, and a sound detector needs tolerance and a test that must not fire. Report word error rate per condition, totaled over reference words, with the actual errors beside it.
