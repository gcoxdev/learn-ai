schema_version: 0.2-draft
lesson:
  id: speech-audio-project
  version: 0.1.0-draft
  title: 'Project: trace a speech and audio system'
  state: draft
  summary: Design a small transcription-and-speech workflow, separate its stages, and evaluate words, sound, timing,
    and speaker data.
  slot: M36.11
  category: destination
  archetype: project
  minutes: 35
  sources:
  - title: 'Whisper: Robust Speech Recognition (2022)'
    url: https://arxiv.org/abs/2212.04356
  - title: 'Jurafsky and Martin: Speech and Language Processing'
    url: https://web.stanford.edu/~jurafsky/slp3/
objectives:
- id: objective.speech-audio-project
  version: 1-draft
  statement: Calculate word error rate from an alignment and raw audio duration, and distinguish recognition, synthesis,
    and independent evaluation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - speech-audio-project.base
  - speech-audio-project.transfer
  prerequisites:
  - anyOf:
    - objective.speech-recognition
  - anyOf:
    - objective.speech-and-audio-generation
  - anyOf:
    - objective.sequence-evaluation
scenes:
- id: speech-audio-project.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.speech-audio-project
  title: Give each stage a separate job
  markdown: 'Imagine an accessibility tool that listens to a short instruction, displays its words, and reads the
    confirmed text aloud. **Speech recognition** maps recorded speech to text. **Speech synthesis** maps text or
    another representation to speech. An **audio codec** encodes and decodes a sound representation; it is not automatically
    a speech recognizer.


    Your project is a diagram and evaluation sheet for these separate jobs. Work from the supplied words and counts
    on paper, without recording anyone or downloading a model. Name the input, output, and potential failure at
    every stage.'
  text_mode: 'Imagine an accessibility tool that listens to a short instruction, displays its words, and reads the
    confirmed text aloud. **Speech recognition** maps recorded speech to text. **Speech synthesis** maps text or
    another representation to speech. An **audio codec** encodes and decodes a sound representation; it is not automatically
    a speech recognizer.


    Your project is a diagram and evaluation sheet for these separate jobs. Work from the supplied words and counts
    on paper, without recording anyone or downloading a model. Name the input, output, and potential failure at
    every stage.'
  bridges: []
- id: speech-audio-project.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.speech-audio-project
  title: Specify the sound representation
  markdown: 'A digital waveform stores samples, measurements taken at regular times. For this toy format, use one
    audio channel, 16,000 samples per second, and two bytes per sample. A one-second input contains 16,000 samples
    and requires 32,000 raw bytes. File headers and compression are excluded.


    A recognition model may turn the waveform into time-frequency features, which describe changing frequency content,
    before predicting text. A synthesis system may generate waveform samples or intermediate acoustic/codec representations.
    Label those interfaces rather than calling every intermediate value a word. The audio-representations lesson
    explains why timing and frequency information matter.'
  text_mode: 'A digital waveform stores samples, measurements taken at regular times. For this toy format, use one
    audio channel, 16,000 samples per second, and two bytes per sample. A one-second input contains 16,000 samples
    and requires 32,000 raw bytes. File headers and compression are excluded.


    A recognition model may turn the waveform into time-frequency features, which describe changing frequency content,
    before predicting text. A synthesis system may generate waveform samples or intermediate acoustic/codec representations.
    Label those interfaces rather than calling every intermediate value a word. The audio-representations lesson
    explains why timing and frequency information matter.'
  bridges:
  - arithmetic
  - audio-representations
- id: speech-audio-project.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.speech-audio-project
  title: Trace recognition and synthesis separately
  markdown: 'Draw audio preparation, recognition, text review, synthesis, and playback as separate boxes. A wrong
    transcript can be spoken clearly, so pleasant sound does not prove correct recognition. Conversely, correct
    displayed words do not prove intelligible generated audio.


    Whisper is a documented encoder-decoder speech-recognition example trained on paired audio and text. This reference
    does not prescribe the architecture of your synthesizer. For each learned component, label training examples,
    targets, updates, and evaluation. During an ordinary inference request, the fixed model is used rather than
    retrained. An optional extension compares this modular design with a joint audio model.'
  text_mode: 'Draw audio preparation, recognition, text review, synthesis, and playback as separate boxes. A wrong
    transcript can be spoken clearly, so pleasant sound does not prove correct recognition. Conversely, correct
    displayed words do not prove intelligible generated audio.


    Whisper is a documented encoder-decoder speech-recognition example trained on paired audio and text. This reference
    does not prescribe the architecture of your synthesizer. For each learned component, label training examples,
    targets, updates, and evaluation. During an ordinary inference request, the fixed model is used rather than
    retrained. An optional extension compares this modular design with a joint audio model.'
  bridges: []
- id: speech-audio-project.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.speech-audio-project
  title: Compute an error rate from an alignment
  markdown: 'The reference transcript is “turn left at station.” An aligned hypothesis is “turn right station now.”
    It substitutes right for left, deletes at, and inserts now. With one substitution S, one deletion D, one insertion
    I, and four reference words N, **word error rate** is (S + D + I) ÷ N = 3 ÷ 4 = 0.75, or 75%.


    Use an alignment with a stated word-normalization rule. The denominator counts reference words, not hypothesis
    words. With enough insertions, this rate can exceed 100%. It counts edit operations; it does not directly measure
    the consequence of saying the wrong direction.'
  text_mode: 'The reference transcript is “turn left at station.” An aligned hypothesis is “turn right station now.”
    It substitutes right for left, deletes at, and inserts now. With one substitution S, one deletion D, one insertion
    I, and four reference words N, **word error rate** is (S + D + I) ÷ N = 3 ÷ 4 = 0.75, or 75%.


    Use an alignment with a stated word-normalization rule. The denominator counts reference words, not hypothesis
    words. With enough insertions, this rate can exceed 100%. It counts edit operations; it does not directly measure
    the consequence of saying the wrong direction.'
  bridges: []
- id: speech-audio-project.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.speech-audio-project
  title: Evaluate the experience as well as the transcript
  markdown: 'For recognition, list accuracy by language, accent, microphone, noise, and speaker conditions. Reserve
    speakers and source recordings appropriately when testing generalization. For synthesis, use a listening rubric
    covering intelligibility, pronunciation, timing, and speaker characteristics permitted by the task.


    For the workflow, measure time to first useful output and total response time. **Latency** includes preparation,
    model work, and waiting. Report errors separately: wrong words, unintelligible sound, and a slow response need
    different fixes. A reference transcript is not a complete evaluation of sound quality, and a single clean recording
    does not establish reliable noisy-room performance.'
  text_mode: 'For recognition, list accuracy by language, accent, microphone, noise, and speaker conditions. Reserve
    speakers and source recordings appropriately when testing generalization. For synthesis, use a listening rubric
    covering intelligibility, pronunciation, timing, and speaker characteristics permitted by the task.


    For the workflow, measure time to first useful output and total response time. **Latency** includes preparation,
    model work, and waiting. Report errors separately: wrong words, unintelligible sound, and a slow response need
    different fixes. A reference transcript is not a complete evaluation of sound quality, and a single clean recording
    does not establish reliable noisy-room performance.'
  bridges: []
- id: speech-audio-project.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.speech-audio-project
  title: Write the hand-in and inspect its boundaries
  markdown: 'Submit the pipeline diagram, the raw-size calculation, the aligned word-error calculation, and one
    failure case per stage. Include what would happen if the input contained silence, unfamiliar language, or conflicting
    background speech. State the data permissions and which evaluation samples were held out.


    A peer can check whether your stage labels, arithmetic, and conclusions agree. Keep a separate synthesis rubric
    instead of using transcription error as its only score. You may add music or general sound generation as an
    extension, but do not assume the speech-specific scoring rule transfers unchanged. The quiz checks these concepts;
    it does not certify a deployed audio system or grade an unseen recording.'
  text_mode: 'Submit the pipeline diagram, the raw-size calculation, the aligned word-error calculation, and one
    failure case per stage. Include what would happen if the input contained silence, unfamiliar language, or conflicting
    background speech. State the data permissions and which evaluation samples were held out.


    A peer can check whether your stage labels, arithmetic, and conclusions agree. Keep a separate synthesis rubric
    instead of using transcription error as its only score. You may add music or general sound generation as an
    extension, but do not assume the speech-specific scoring rule transfers unchanged. The quiz checks these concepts;
    it does not certify a deployed audio system or grade an unseen recording.'
  bridges: []
- id: speech-audio-project.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.speech-audio-project
  markdown: These checks assess the supporting concepts. Use the rubric to review your project; the app does not
    grade your submitted artifact.
  text_mode: Untimed checks of the supporting concepts, followed by continuation links.
  takeaway: Recognizing speech and generating sound are different tasks. Evaluate the words, the audible signal,
    and the time taken at the appropriate stage.
