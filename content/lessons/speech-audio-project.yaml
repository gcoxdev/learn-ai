  version: 0.4.0-draft
  title: 'Project: trace a speech and audio system'
  state: draft
  summary: Sam is deaf, and his tablet should flash when the doorbell rings and caption the intercom. Build the chime detector from a spectrogram, then find out where the captions fail.
  slot: M36.11
  category: destination
  archetype: project
  minutes: 35
  sources:
