assessment_families:
  - id: speech-audio-project.base
    objective_ref: objective.speech-audio-project
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: speech-audio-project.s4
    variants:
      - prompt: A system speaks the wrong transcript very clearly. Which conclusion is justified?
        answer: a
        options:
          - id: b
            text: Clear speech proves that recognition was correct.
          - id: c
            text: The error must be a sample-rate arithmetic error.
          - id: a
            text: Speech clarity and recognition correctness need separate evaluation.
        feedback: The synthesizer can pronounce incorrect text clearly.
        id: speech-audio-project.base.1
        retired: true
      - prompt: Which count is the denominator in the taught word error rate?
        answer: a
        options:
          - id: c
            text: Audio samples in the original waveform.
          - id: a
            text: Reference transcript words.
          - id: b
            text: Hypothesis transcript words.
        feedback: Word error rate divides edit counts by reference length under stated normalization.
        id: speech-audio-project.base.2
        retired: true
      - prompt: Can word error rate exceed 100%?
        answer: a
        options:
          - id: a
            text: Yes, when edit counts including insertions exceed reference word count.
          - id: b
            text: No, it is a probability assigned to the transcript.
          - id: c
            text: No, insertion errors are excluded from the numerator.
        feedback: It is an edit rate, not a bounded probability.
        id: speech-audio-project.base.3
        retired: true
      - prompt: A model performs well on clips from speakers it also trained on. What remains untested?
        answer: a
        options:
          - id: b
            text: Whether text is an output of speech recognition.
          - id: c
            text: Whether the reference transcript has words.
          - id: a
            text: Generalization to reserved speakers and recording conditions.
        feedback: Related source speakers can make evaluation easier than the intended new-speaker task.
        id: speech-audio-project.base.4
        retired: true
  - id: speech-audio-project.transfer
    objective_ref: objective.speech-audio-project
    task: transfer
    response_type: numeric_fields_with_reason
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: speech-audio-project.s4
    variants:
      - prompt: An alignment has S=1 substitutions, D=1 deletions, I=0 insertions, and N=8 reference words. The mono audio contains 32000 samples at 16,000 samples/second. Give word error rate as a percentage and audio duration in seconds.
        answers:
          percent: 25.0
          seconds: 2.0
        reason_answer: a
        reason_options:
          - id: b
            text: Divide edits by audio duration instead of reference words.
          - id: c
            text: Exclude inserted words from the edit count.
          - id: a
            text: Divide total edits by reference words; divide samples by sample rate.
        feedback: Word error rate and duration measure different quantities. Keep their denominators separate.
        id: speech-audio-project.transfer.1
        retired: true
      - prompt: An alignment has S=0 substitutions, D=1 deletions, I=1 insertions, and N=4 reference words. The mono audio contains 16000 samples at 16,000 samples/second. Give word error rate as a percentage and audio duration in seconds.
        answers:
          percent: 50.0
          seconds: 1.0
        reason_answer: a
        reason_options:
          - id: c
            text: Exclude inserted words from the edit count.
          - id: a
            text: Divide total edits by reference words; divide samples by sample rate.
          - id: b
            text: Divide edits by audio duration instead of reference words.
        feedback: Word error rate and duration measure different quantities. Keep their denominators separate.
        id: speech-audio-project.transfer.2
        retired: true
      - prompt: An alignment has S=1 substitutions, D=0 deletions, I=2 insertions, and N=2 reference words. The mono audio contains 48000 samples at 16,000 samples/second. Give word error rate as a percentage and audio duration in seconds.
        answers:
          percent: 150.0
          seconds: 3.0
        reason_answer: a
        reason_options:
          - id: a
            text: Divide total edits by reference words; divide samples by sample rate.
          - id: b
            text: Divide edits by audio duration instead of reference words.
          - id: c
            text: Exclude inserted words from the edit count.
        feedback: Word error rate and duration measure different quantities. Keep their denominators separate.
        id: speech-audio-project.transfer.3
        retired: true
      - prompt: An alignment has S=0 substitutions, D=0 deletions, I=1 insertions, and N=10 reference words. The mono audio contains 8000 samples at 16,000 samples/second. Give word error rate as a percentage and audio duration in seconds.
        answers:
          percent: 10.0
          seconds: 0.5
        reason_answer: a
        reason_options:
          - id: b
            text: Divide edits by audio duration instead of reference words.
          - id: c
            text: Exclude inserted words from the edit count.
          - id: a
            text: Divide total edits by reference words; divide samples by sample rate.
        feedback: Word error rate and duration measure different quantities. Keep their denominators separate.
        id: speech-audio-project.transfer.4
        retired: true
    numeric_fields:
      - id: percent
        label: Word error rate (%)
      - id: seconds
        label: Audio duration (seconds)
    absolute_tolerance: 1e-6
  - id: speech-audio-project.base.v2
    objective_ref: objective.speech-audio-project
    task: base
    response_type: single_choice
    points: 1
    hint: For pitch, think in bins of sample rate ÷ window length. For captions, line the words up and count S, D, and I over the words actually said.
    remediation_scene: speech-audio-project.s3
    variants:
      - id: speech-audio-project.base.v2.1
        prompt: The detector uses 200-sample windows on audio sampled at 8,000 Hz. Why does it report pitches only in steps of 40 Hz?
        options:
          - id: b
            text: The hop between windows is 80 samples, and half of that is 40
          - id: a
            text: FFT bins are spaced by sample rate ÷ window length, 8,000 ÷ 200
          - id: c
            text: The Hann window smears each tone by 40 Hz to either side
        answer: a
        feedback: 'A 200-sample window gives bins 8,000 ÷ 200 = 40 Hz apart, and the detector reports the loudest bin. The hop controls how often a new frame starts (100 per second), not the pitch spacing.'
      - id: speech-audio-project.base.v2.2
        prompt: The doorbell's "dong" drifts from 400 Hz to 420 Hz, and the detector stops recognizing the chime. What happened?
        options:
          - id: a
            text: 420 Hz sits between two bins, so the pitch flips between 400 and 440 and the note breaks up
          - id: b
            text: 420 Hz is above the Nyquist frequency, so it aliases to a lower and wrong pitch
          - id: c
            text: The silence gate drops a 420 Hz tone because it is quieter than a 400 Hz one
        answer: a
        feedback: The rule wants a long run at exactly 400 Hz, and a tone between bins never gives one. Nyquist at 8,000 Hz sampling is 4,000 Hz, far above 420, and both tones are equally loud.
      - id: speech-audio-project.base.v2.3
        prompt: The two noisy phrases contain 3 edits and 11 reference words, out of 27 reference words in the whole test. Which noisy-condition WER is correct?
        options:
          - id: c
            text: 2 ÷ 11 = 18%, because an insertion isn't a mistake in a word that was said
          - id: b
            text: 3 ÷ 27 = 11%, because WER divides by all the reference words in the test
          - id: a
            text: 3 ÷ 11 = 27%, because WER divides edits by the words said in that condition
        answer: a
        feedback: 'A condition''s WER totals its own edits over its own reference words. Dividing by all 27 dilutes the noisy errors with quiet words, and insertions count as errors: "the" was never said.'
      - id: speech-audio-project.base.v2.4
        prompt: '"call my sister on speaker" was captioned "call sister on the speaker". Which edits give its word error rate?'
        options:
          - id: a
            text: One deletion ("my") and one insertion ("the"), so 2 ÷ 5 = 0.4
          - id: b
            text: Three substitutions where the words shift, so 3 ÷ 5 = 0.6
          - id: c
            text: No edits, since every word said also appears in the caption
        answer: a
        feedback: The alignment keeps "call", "sister on", and "speaker" matched, costing one deletion and one insertion. Shifted substitutions would cost 3, and edit distance keeps the cheapest alignment.
  - id: speech-audio-project.transfer.v2
    objective_ref: objective.speech-audio-project
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask which condition the evidence covers, whether the sample rate can represent the sound, and which errors matter to the person using the system.
    remediation_scene: speech-audio-project.s5
    variants:
      - id: speech-audio-project.transfer.v2.1
        prompt: A smoke-alarm detector listens for a 3,000 Hz tone, but the device records at 4,000 samples per second. What goes wrong?
        options:
          - id: b
            text: The windows must be longer to resolve a pitch that high
          - id: a
            text: 3,000 Hz is above the 2,000 Hz limit and shows up as 1,000 Hz
          - id: c
            text: The silence gate will reject a tone as loud as an alarm
        answer: a
        feedback: Nyquist for 4,000 samples per second is 2,000 Hz, so a 3,000 Hz tone aliases to 4,000 − 3,000 = 1,000 Hz. Window length changes bin spacing, not which pitches can be represented.
      - id: speech-audio-project.transfer.v2.2
        prompt: A captioning vendor reports "WER 8%" over 500 clips recorded mostly in quiet offices. Your users will speak in moving cars. What should you ask for?
        options:
          - id: a
            text: WER on a car-noise slice, and how many reference words it covers
          - id: b
            text: The same WER recomputed on a larger set of quiet office clips
          - id: c
            text: Character error rate in place of WER on the same office clips
        answer: a
        feedback: Sam's kitchen showed quiet and noisy error rates differing fourfold, so a quiet-office number says little about cars. More quiet clips or a different unit measure the wrong condition more precisely.
      - id: speech-audio-project.transfer.v2.3
        prompt: For an intercom that relays who is at the door, system A has WER 10%, mostly dropped "a" and "the"; system B has WER 9%, mostly wrong names and numbers. What is the best reading?
        options:
          - id: c
            text: Choose B, since a lower WER means fewer harmful mistakes
          - id: b
            text: Treat them as equal, since the rates differ by one point
          - id: a
            text: Look at which words fail; A's errors matter less here
        answer: a
        feedback: WER counts every edit alike, so a wrong name costs the same as a missing "the". For this job the names are the message, which makes A the safer choice despite its slightly higher rate.
      - id: speech-audio-project.transfer.v2.4
        prompt: A bird-song app's pitch detector works perfectly in a quiet lab, but outdoors in wind it keeps reporting birds that aren't there. What should the evaluation add?
        options:
          - id: a
            text: Windy test clips, scoring false alarms and misses separately
          - id: b
            text: A higher sample rate, so the detector can see finer detail
          - id: c
            text: Longer windows, so each frame averages over more sound
        answer: a
        feedback: The failure is a condition the tests never covered, and false alarms and misses need separate counts, like the microwave test that must not fire. A higher sample rate or longer windows might help, but only a windy test set can show it.
  - id: speech-audio-project.wer.v2
    objective_ref: objective.speech-audio-project
    task: base
    response_type: numeric
    points: 1
    hint: WER = (S + D + I) ÷ N, where N counts reference words. For several phrases, add up all the edits and all the reference words first, then divide once.
    remediation_scene: speech-audio-project.s4
    absolute_tolerance: 0.5
    variants:
      - id: speech-audio-project.wer.v2.1
        prompt: An alignment has 2 substitutions, 1 deletion, and 0 insertions against a 12-word reference. What is the word error rate, as a percentage?
        answer: 25
        feedback: (2 + 1 + 0) ÷ 12 = 0.25, so 25%.
      - id: speech-audio-project.wer.v2.2
        prompt: A recognizer adds 3 words that were never said and gets every other word right, on a 6-word reference. What is the word error rate, as a percentage?
        answer: 50
        feedback: Insertions count as errors, so 3 ÷ 6 = 0.5, or 50%.
      - id: speech-audio-project.wer.v2.3
        prompt: Phrase 1 has 1 edit in 4 reference words; phrase 2 has 3 edits in 16 reference words. What is the combined word error rate over both phrases, as a percentage?
        answer: 20
        feedback: Total edits over total words is (1 + 3) ÷ (4 + 16) = 4 ÷ 20 = 20%. Averaging 25% and 18.75% would give 21.9%, which overweights the short phrase.
      - id: speech-audio-project.wer.v2.4
        prompt: An alignment has 1 substitution, 2 deletions, and 1 insertion against a 5-word reference. What is the word error rate, as a percentage?
        answer: 80
        feedback: (1 + 2 + 1) ÷ 5 = 0.8, so 80%.
