schema_version: 0.2-draft
lesson:
  id: statistics-evidence
  version: 0.1.0-draft
  title: What can a small experiment tell us?
  state: draft
  summary: Estimates and uncertainty intervals depend on sampling assumptions; hypothesis tests, bootstrap estimates,
    and multiple-comparison controls answer different questions.
  slot: B11
  category: bridge
  minutes: 12
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.statistics-evidence
  version: 1-draft
  statement: Estimates and uncertainty intervals depend on sampling assumptions; hypothesis tests, bootstrap estimates,
    and multiple-comparison controls answer different questions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - statistics-evidence.base
  - statistics-evidence.transfer
  prerequisites:
  - anyOf:
    - objective.random-variables
scenes:
- id: statistics-evidence.s1
  title: A measured number is an estimate
  type: explanation
  depth: intuition
  objective_refs:
  - objective.statistics-evidence
  markdown: If a model gets 80 of 100 sampled questions right, the observed accuracy is 80%. The accuracy on a larger
    target population may differ. Record the population, sampling process, metric, and sample size. Measurement
    error, dependence, and changes in the data can matter more than one extra decimal place.
  text_mode: If a model gets 80 of 100 sampled questions right, the observed accuracy is 80%. The accuracy on a
    larger target population may differ. Record the population, sampling process, metric, and sample size. Measurement
    error, dependence, and changes in the data can matter more than one extra decimal place.
  bridges: []
- id: statistics-evidence.s2
  title: Interpret an interval carefully
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.statistics-evidence
  markdown: A frequentist 95% confidence procedure is designed to cover a fixed population quantity in 95% of repeated
    samples under its assumptions. It is not a statement that 95% of individual predictions are correct. A Bayesian
    credible interval has a different interpretation and depends on a probability model and prior.
  text_mode: A frequentist 95% confidence procedure is designed to cover a fixed population quantity in 95% of repeated
    samples under its assumptions. It is not a statement that 95% of individual predictions are correct. A Bayesian
    credible interval has a different interpretation and depends on a probability model and prior.
  bridges:
  - random-variables
- id: statistics-evidence.s3
  title: Resample to see sensitivity
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.statistics-evidence
  markdown: The bootstrap repeatedly resamples observed units with replacement and recomputes a statistic. If records
    are grouped by person, resampling whole people can preserve that dependence better than resampling individual
    rows. Bootstrap intervals reflect the observed sample and chosen procedure; they cannot repair a sample that
    omits an important population.
  text_mode: The bootstrap repeatedly resamples observed units with replacement and recomputes a statistic. If records
    are grouped by person, resampling whole people can preserve that dependence better than resampling individual
    rows. Bootstrap intervals reflect the observed sample and chosen procedure; they cannot repair a sample that
    omits an important population.
  bridges: []
- id: statistics-evidence.s4
  title: Avoid selecting a lucky winner
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.statistics-evidence
  markdown: A hypothesis test compares data with a specified null model; a p-value is not the probability that the
    null hypothesis is true. Trying many models or subgroup tests increases opportunities for chance findings. Separate
    exploration from confirmation, report effect sizes and intervals, and use appropriate multiple-comparison procedures
    when making many claims.
  text_mode: A hypothesis test compares data with a specified null model; a p-value is not the probability that
    the null hypothesis is true. Trying many models or subgroup tests increases opportunities for chance findings.
    Separate exploration from confirmation, report effect sizes and intervals, and use appropriate multiple-comparison
    procedures when making many claims.
  bridges: []
- id: statistics-evidence.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.statistics-evidence
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Estimates and uncertainty intervals depend on sampling assumptions; hypothesis tests, bootstrap estimates,
    and multiple-comparison controls answer different questions.
- id: statistics-evidence.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.statistics-evidence
  markdown: Estimates and uncertainty intervals depend on sampling assumptions; hypothesis tests, bootstrap estimates,
    and multiple-comparison controls answer different questions.
  text_mode: Estimates and uncertainty intervals depend on sampling assumptions; hypothesis tests, bootstrap estimates,
    and multiple-comparison controls answer different questions.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - statistics-evidence.s1
    - statistics-evidence.s2
    - statistics-evidence.s3
    - statistics-evidence.s4
    - statistics-evidence.check
    gate_refs:
    - gate.core
  scene_aliases:
    statistics-evidence.recap: statistics-evidence.check
assessment_families:
- id: statistics-evidence.base
  objective_ref: objective.statistics-evidence
  task: base
  response_type: single_choice
  points: 1
  hint: 'Interpret an interval carefully: trace the inputs, operation, and result before choosing.'
  remediation_scene: statistics-evidence.s2
  variants:
  - id: statistics-evidence.base.1
    prompt: A model answers 45 of 50 cases correctly. What is observed accuracy?
    options:
    - id: a
      text: 90%
    - id: b
      text: 45%
    - id: c
      text: 95%
    answer: a
    feedback: The sample proportion is 45 divided by 50, or 0.9.
  - id: statistics-evidence.base.2
    prompt: What does a bootstrap sample typically do?
    options:
    - id: b
      text: Create guaranteed representative new people
    - id: c
      text: Train every model from scratch without data
    - id: a
      text: Resample observed units with replacement
    answer: a
    feedback: Resampling approximates sampling variability under the chosen scheme.
- id: statistics-evidence.transfer
  objective_ref: objective.statistics-evidence
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Avoid selecting a lucky winner: trace the inputs, operation, and result before choosing.'
  remediation_scene: statistics-evidence.s4
  variants:
  - id: statistics-evidence.transfer.1
    prompt: Two hundred models are tried and only the best test result is reported. What concern arises?
    options:
    - id: b
      text: The reported winner must be universally best
    - id: c
      text: More trials eliminate the need for validation
    - id: a
      text: Selection can exploit chance variation in the test set
    answer: a
    feedback: Repeated selection changes the evidential meaning of the chosen score.
  - id: statistics-evidence.transfer.2
    prompt: An interval procedure assumes independent people, but each person contributes many correlated rows.
      What should change?
    options:
    - id: c
      text: Report more decimal places
    - id: a
      text: Account for grouping in sampling or analysis
    - id: b
      text: Pretend the rows are independent to narrow the interval
    answer: a
    feedback: The uncertainty calculation must reflect the dependence structure.
