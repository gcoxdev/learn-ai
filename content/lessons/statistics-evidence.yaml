schema_version: 0.2-draft
lesson:
  id: statistics-evidence
  version: 0.3.0-draft
  title: What can a small experiment tell us?
  state: draft
  summary: Use a small sample without confusing its score with a precise answer about everyone.
  slot: B11
  category: bridge
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.statistics-evidence
  version: 1-draft
  statement: Estimates and uncertainty intervals depend on sampling assumptions; hypothesis tests, bootstrap
    estimates, and multiple-comparison controls answer different questions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - statistics-evidence.base
  - statistics-evidence.transfer
  prerequisites:
  - anyOf:
    - objective.random-variables
scenes:
- id: statistics-evidence.s1
  title: A measured number is an estimate
  type: explanation
  depth: intuition
  objective_refs:
  - objective.statistics-evidence
  markdown: 'If a model gets 80 of 100 sampled questions right, observed accuracy is 80%. Another sample can
    give a different score. An estimate is a number calculated from observations to describe a larger population.
    The population is the group you actually want to make a claim about.


    Start by recording which questions were sampled, how they were chosen, and how “correct” was decided. One
    hundred nearly identical questions do not provide the same evidence as one hundred independent representative
    questions. Extra decimal places cannot repair a missing population.'
  text_mode: 'If a model gets 80 of 100 sampled questions right, observed accuracy is 80%. Another sample can
    give a different score. An estimate is a number calculated from observations to describe a larger population.
    The population is the group you actually want to make a claim about.


    Start by recording which questions were sampled, how they were chosen, and how “correct” was decided. One
    hundred nearly identical questions do not provide the same evidence as one hundred independent representative
    questions. Extra decimal places cannot repair a missing population.'
  bridges: []
- id: statistics-evidence.s2
  title: An interval expresses uncertainty in an estimate
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.statistics-evidence
  markdown: 'An uncertainty interval gives a range alongside the estimate. A frequentist 95% confidence procedure
    is designed so that, across repeated samples under its assumptions, about 95% of the intervals cover the
    fixed population quantity. It does not mean 95% of individual answers are correct, or assign a 95% probability
    to that fixed quantity after an interval has been computed.


    A Bayesian 95% credible interval instead contains 95% of the posterior probability under a specified model
    and prior. The posterior is the distribution after incorporating the observations; the prior is the starting
    distribution. These are different interpretations, so name the procedure.'
  text_mode: 'An uncertainty interval gives a range alongside the estimate. A frequentist 95% confidence procedure
    is designed so that, across repeated samples under its assumptions, about 95% of the intervals cover the
    fixed population quantity. It does not mean 95% of individual answers are correct, or assign a 95% probability
    to that fixed quantity after an interval has been computed.


    A Bayesian 95% credible interval instead contains 95% of the posterior probability under a specified model
    and prior. The posterior is the distribution after incorporating the observations; the prior is the starting
    distribution. These are different interpretations, so name the procedure.'
  bridges:
  - random-variables
  - probability
- id: statistics-evidence.s3
  title: Resample a small collection
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.statistics-evidence
  markdown: 'The bootstrap repeatedly samples observed units with replacement and recalculates a statistic.
    Replacement means an item can appear more than once in a resample. Starting from values [1, 2, 6], whose
    mean is 3, one resample might be [2, 2, 6], whose mean is 10/3. Another could be [1, 1, 2], with mean 4/3.
    Many such resamples reveal sensitivity to the observed collection.


    If rows are grouped by person, resampling whole people can preserve the relevant dependence better than
    treating every row as independent. Bootstrapping cannot supply a group that was missing from the original
    sample.'
  text_mode: 'The bootstrap repeatedly samples observed units with replacement and recalculates a statistic.
    Replacement means an item can appear more than once in a resample. Starting from values [1, 2, 6], whose
    mean is 3, one resample might be [2, 2, 6], whose mean is 10/3. Another could be [1, 1, 2], with mean 4/3.
    Many such resamples reveal sensitivity to the observed collection.


    If rows are grouped by person, resampling whole people can preserve the relevant dependence better than
    treating every row as independent. Bootstrapping cannot supply a group that was missing from the original
    sample.'
  bridges:
  - random-variables
- id: statistics-evidence.s4
  title: A surprising result still needs a fair comparison
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.statistics-evidence
  markdown: 'A null hypothesis is a specified reference claim, such as no average improvement. A p-value measures
    how likely a result at least as extreme as the observed one would be under that null model and the test’s
    assumptions. It is not the probability that the null is true.


    Testing many claims creates more opportunities for false alarms. If 20 true-null tests each have a 5% false-positive
    rate, the expected number of false positives is one; this does not guarantee exactly one. A simple Bonferroni
    rule uses 0.05/20 = 0.0025 per test to control the chance of any false positive at no more than 5% under
    valid tests. Report the improvement’s size and uncertainty too, and reserve fresh evidence for confirming
    ideas chosen during exploration.'
  text_mode: 'A null hypothesis is a specified reference claim, such as no average improvement. A p-value measures
    how likely a result at least as extreme as the observed one would be under that null model and the test’s
    assumptions. It is not the probability that the null is true.


    Testing many claims creates more opportunities for false alarms. If 20 true-null tests each have a 5% false-positive
