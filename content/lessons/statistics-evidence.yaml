schema_version: 0.2-draft
lesson:
  id: statistics-evidence
  version: 0.4.0-draft
  title: What can a small experiment tell us?
  state: draft
  summary: Your model scores 80% on 100 test questions. Is the real number 79%, or 70%? Learn to put an honest error bar on a score, and read it correctly.
  slot: B11
  category: bridge
  sources:
    - title: An Introduction to Statistical Learning — authors’ materials
      url: https://www.statlearning.com/
objectives:
  - id: objective.statistics-evidence
    version: 2-draft
    statement: Estimates and uncertainty intervals depend on sampling assumptions; hypothesis tests, bootstrap estimates, and multiple-comparison controls answer different questions.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - statistics-evidence.base.v2
      - statistics-evidence.transfer.v2
    prerequisites:
      - anyOf:
          - objective.random-variables
scenes:
  - id: statistics-evidence.s1
    title: A test score is an estimate
    type: explanation
    depth: intuition
    objective_refs:
      - objective.statistics-evidence
    markdown: |-
      Model A scores 75% on 200 test questions and model B scores 78%. Is B better, or did it get friendlier questions? Every AI evaluation meets this question, and the answer starts with an error bar.

      Say a model gets 80 of 100 sampled questions right. What you care about is its accuracy on *all* the questions it will ever face, the **population**. You measured a sample, so 0.80 is an **estimate**: a number computed from observations to stand in for the population value. A different 100 questions would give a slightly different score, perhaps 0.77 or 0.83.

      The formulas below assume independent questions drawn from that population. A hundred near-copies of one question carry about as much evidence as one.
    bridges: []
  - id: statistics-evidence.s2
    title: Put an error bar on 80 out of 100
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.statistics-evidence
    markdown: |-
      For an accuracy $\hat p$ measured on $n$ independent questions, the typical wobble from sample to sample is the **standard error**:

      $$\text{SE} = \sqrt{\frac{\hat p\,(1 - \hat p)}{n}}$$

      A 95% **confidence interval** reaches 1.96 standard errors either side of the estimate. (The 1.96 comes from the bell curve: 95% of its area lies within 1.96 standard deviations of the middle.)

      :::example 80 out of 100
      SE = √(0.8 × 0.2 / 100) = √0.0016 = 0.04. The margin is 1.96 × 0.04 ≈ 0.078. The interval is 0.80 ± 0.078, or about [0.72, 0.88].
      :::

      :::predict You want the margin cut in half, to about ±0.039, at the same 80% accuracy. How many questions do you need?
      400. The sample size sits under a square root, so halving the margin takes four times the data: √(0.16 / 400) = 0.02, and 1.96 × 0.02 ≈ 0.039.
      :::

      Now run it backward. To reach ±0.02 at 80% accuracy, solve 1.96 × √(0.16 / n) = 0.02, which gives n = 1.96² × 0.16 / 0.02² ≈ 1,537 questions. Precise evaluation is expensive, which is why the evaluation lessons treat a 3-point gap on 200 questions with suspicion.
    bridges:
      - random-variables
      - probability
  - id: statistics-evidence.meaning
    title: What the 95% belongs to
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.statistics-evidence
    markdown: |-
      The program below fixes a true accuracy of 0.80, draws 10,000 separate test sets of 100 questions, and builds a 95% interval from each:

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      true_acc, n, trials = 0.80, 100, 10_000

      correct = rng.binomial(n, true_acc, size=trials)   # 10,000 separate test sets
      p_hat = correct / n
      margin = 1.96 * np.sqrt(p_hat * (1 - p_hat) / n)
      covers = (p_hat - margin <= true_acc) & (true_acc <= p_hat + margin)

      print("first three intervals:")
      for p, m in zip(p_hat[:3], margin[:3]):
          print(f"  {p:.3f} ± {m:.3f}  ->  [{p - m:.3f}, {p + m:.3f}]")
      print(f"share of intervals that cover 0.80: {covers.mean():.3f}")
      ```

      The first two intervals contain 0.80. The third, [0.804, 0.936], misses it. Overall 93.4% of intervals cover the truth, close to the promised 95%; the formula is an approximation that improves with more questions. Set `n = 400` and the share rises to 94.7%.

      :::mixup "My interval is [0.72, 0.88], so there's a 95% chance the true accuracy is in it."
      The true accuracy is one fixed number, and your interval is now fixed too, so it either contains the truth or it doesn't. The 95% describes the *method*: across many fresh test sets, about 95% of the intervals it builds cover the truth. Before you ran the test, you had a 95% chance of getting a covering interval. Afterwards, you don't know whether yours is one of the hits or, like the third one above, a miss. A statement like "95% probability the value is in here" needs a Bayesian **credible interval**, which combines the data with a prior belief.
      :::
    bridges:
      - random-variables
  - id: statistics-evidence.s3
    title: No formula? Resample your data
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.statistics-evidence
    markdown: |-
      For many scores, such as a median or an F1 score, there's no simple standard-error formula. The **bootstrap** estimates the wobble anyway: draw a new sample of the same size from your own data *with replacement* (so an item can appear twice), recompute the score, and repeat thousands of times. The spread of those scores approximates the spread you'd see across fresh samples.

      With the values [1, 2, 6], whose mean is 3, one resample might be [2, 2, 6], with mean 10/3 ≈ 3.33. Another might be [1, 1, 2], with mean 4/3 ≈ 1.33. If one person contributed many rows, resample whole people rather than rows, so their related answers stay together.
    bridges:
      - random-variables
  - id: statistics-evidence.s4
    title: Try twenty ideas, and one will look great
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.statistics-evidence
    markdown: |-
      A **hypothesis test** starts from a **null hypothesis**, a boring reference claim such as "the new prompt doesn't change accuracy." The **p-value** is the probability, if the null were true, of seeing a difference at least as large as the one you observed. A p-value of 0.03 says "a gap this big would be rare if nothing had changed." It is not the probability that the null is true.

      Now test 20 prompt tweaks that truly do nothing, each at the usual 0.05 cutoff. You should expect 20 × 0.05 = 1 of them to look like a win by luck alone. The **Bonferroni correction** divides the cutoff by the number of tests, here 0.05 / 20 = 0.0025, which keeps the chance of *any* false win at 5% or less. The simplest protection is to pick your winner on one set of data and confirm it on a fresh one.
    bridges: []
  - id: statistics-evidence.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.statistics-evidence
    markdown: Error bars for new test sets, a reported interval, a leaderboard of 200 tries, and user-grouped data ask you to size uncertainty and read it correctly.
    takeaway: |-
      A test score is an estimate with a margin of about 1.96 × √(p(1 − p)/n). The 95% describes how often the method's intervals cover the truth, not the chance that this one does.
  - id: statistics-evidence.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.statistics-evidence
    markdown: |-
      A sample score is an estimate. Explain how cases were sampled, how uncertainty was calculated, and how multiple comparisons or selected results affect the claim.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - statistics-evidence.s1
        - statistics-evidence.s2
        - statistics-evidence.meaning
        - statistics-evidence.s3
        - statistics-evidence.s4
        - statistics-evidence.check
      gate_refs:
        - gate.core
  scene_aliases:
    statistics-evidence.recap: statistics-evidence.check
assessment_families:
  - id: statistics-evidence.base
    objective_ref: objective.statistics-evidence
    task: base
    response_type: single_choice
    points: 1
    hint: 'Interpret an interval carefully: trace the inputs, operation, and result before choosing.'
    remediation_scene: statistics-evidence.s2
    variants:
      - id: statistics-evidence.base.1
        prompt: A model answers 45 of 50 cases correctly. What is observed accuracy?
        options:
          - id: a
            text: 90%
          - id: b
            text: 45%
          - id: c
            text: 95%
        answer: a
        feedback: The sample proportion is 45 divided by 50, or 0.9.
        retired: true
      - id: statistics-evidence.base.2
        prompt: What does a bootstrap sample typically do?
        options:
          - id: b
            text: Create guaranteed representative new people
          - id: c
            text: Train every model from scratch without data
          - id: a
            text: Resample observed units with replacement
        answer: a
        feedback: Resampling approximates sampling variability under the chosen scheme.
        retired: true
  - id: statistics-evidence.transfer
    objective_ref: objective.statistics-evidence
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Avoid selecting a lucky winner: trace the inputs, operation, and result before choosing.'
    remediation_scene: statistics-evidence.s4
    variants:
      - id: statistics-evidence.transfer.1
        prompt: Two hundred models are tried and only the best test result is reported. What concern arises?
        options:
          - id: b
            text: The reported winner must be universally best
          - id: c
            text: More trials eliminate the need for validation
          - id: a
            text: Selection can exploit chance variation in the test set
        answer: a
        feedback: Repeated selection changes the evidential meaning of the chosen score.
        retired: true
      - id: statistics-evidence.transfer.2
        prompt: An interval procedure assumes independent people, but each person contributes many correlated rows. What should change?
        options:
          - id: c
            text: Report more decimal places
          - id: a
            text: Account for grouping in sampling or analysis
          - id: b
            text: Pretend the rows are independent to narrow the interval
        answer: a
        feedback: The uncertainty calculation must reflect the dependence structure.
        retired: true
  - id: statistics-evidence.base.v2
    objective_ref: objective.statistics-evidence
    task: base
    response_type: numeric
    points: 1
    hint: Write the accuracy as a decimal p. The standard error is √(p(1 − p)/n), and the 95% margin is 1.96 times that.
    remediation_scene: statistics-evidence.s2
    absolute_tolerance: 0.002
    variants:
      - id: statistics-evidence.base.v2.1
        prompt: A model answers 90 of 100 test questions correctly. What is the margin of error (the half-width) of a 95% confidence interval for its accuracy? Enter a decimal such as 0.05.
        answer: 0.0588
        feedback: SE = √(0.9 × 0.1 / 100) = √0.0009 = 0.03, and 1.96 × 0.03 ≈ 0.059. Forgetting the square root gives 1.96 × 0.0009 ≈ 0.002, far too small.
      - id: statistics-evidence.base.v2.2
        prompt: A classifier is right on 50 of 100 test images. What is the margin of error (the half-width) of a 95% confidence interval for its accuracy? Enter a decimal such as 0.05.
        answer: 0.098
        feedback: SE = √(0.5 × 0.5 / 100) = √0.0025 = 0.05, and 1.96 × 0.05 = 0.098. Accuracy near 50% gives the widest interval for a given n.
      - id: statistics-evidence.base.v2.3
        prompt: A chatbot resolves 320 of 400 support questions. What is the margin of error (the half-width) of a 95% confidence interval for its resolution rate? Enter a decimal such as 0.05.
        answer: 0.0392
        feedback: p = 0.8, so SE = √(0.8 × 0.2 / 400) = √0.0004 = 0.02, and 1.96 × 0.02 ≈ 0.039. That's half the margin you'd get from 100 questions, because n sits under a square root.
      - id: statistics-evidence.base.v2.4
        prompt: A translation model's output is judged acceptable for 225 of 300 sentences. What is the margin of error (the half-width) of a 95% confidence interval for its acceptance rate? Enter a decimal such as 0.05.
        answer: 0.049
        feedback: p = 0.75, so SE = √(0.75 × 0.25 / 300) = √0.000625 = 0.025, and 1.96 × 0.025 = 0.049. Using n = 225, the number of successes, would inflate the margin.
  - id: statistics-evidence.transfer.v2
    objective_ref: objective.statistics-evidence
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what the stated number is a probability of. A 95% interval and a p-value both describe what a method does across repeated samples, not the chance that one claim is true.
    remediation_scene: statistics-evidence.meaning
    variants:
      - id: statistics-evidence.transfer.v2.1
        prompt: A report gives a model's accuracy as 0.82 with a 95% confidence interval of [0.78, 0.86]. Which statement is correct?
        options:
          - id: b
            text: There is a 95% probability the true accuracy is between 0.78 and 0.86
          - id: c
            text: The model will score between 0.78 and 0.86 on 95% of future questions
          - id: a
            text: Intervals built this way on fresh test sets would cover the truth 95% of the time
        answer: a
        feedback: The 95% belongs to the procedure. This particular interval either contains the fixed true accuracy or doesn't. Reading it as a 95% probability for this one interval is the classic slip; that reading needs a Bayesian credible interval.
      - id: statistics-evidence.transfer.v2.2
        prompt: A team tries 200 hyperparameter settings, all scored on the same test set, and reports only the best one's score. What should a reader conclude?
        options:
          - id: a
            text: The best score is probably inflated by luck; confirm it on fresh data
          - id: c
            text: The best score is trustworthy, since 200 tries covered the options well
          - id: b
            text: The best score is exact, since every setting used the same test set
        answer: a
        feedback: With 200 chances, some settings score high partly by luck, and picking the maximum selects that luck. A fresh test set shows how much of the win was real. More tries make this selection effect stronger, not weaker.
      - id: statistics-evidence.transfer.v2.3
        prompt: An evaluation has 500 rows, 20 from each of 25 users. The interval formula treats all 500 rows as independent. What should change?
        options:
          - id: c
            text: Double the margin of error to leave a safety buffer
          - id: a
            text: Resample or analyze by user, since one user's rows are related
          - id: b
            text: Nothing, since 500 rows already give a narrow, precise interval
        answer: a
        feedback: Rows from the same user tend to succeed or fail together, so there are closer to 25 independent units than 500. Resampling whole users (a grouped bootstrap) reflects that. Doubling the margin is a guess, not a fix.
      - id: statistics-evidence.transfer.v2.4
        prompt: A test of "no difference in accuracy" between two chatbots gives p = 0.03. Which reading is correct?
        options:
          - id: b
            text: There is a 3% chance that the two chatbots are equally accurate
          - id: a
            text: If there were no real difference, a gap this big would appear about 3% of the time
          - id: c
            text: The new chatbot answers better than the old one on 97% of questions
        answer: a
        feedback: A p-value assumes the null is true and asks how surprising the data would be. It is not the probability that the null itself is true, and it says nothing about the share of questions each model wins.
