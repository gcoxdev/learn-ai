- id: autoencoders-and-vaes.s3
  title: Reparameterize a toy sample
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.autoencoders-and-vaes
  markdown: 'For a Gaussian latent, write z = mean + scale×epsilon, where epsilon is sampled from a standard
    normal distribution. Mean two, scale one-half, and epsilon minus one produce z = 1.5. This expresses randomness
    separately so gradients can reach the encoder’s mean and scale.


    A **standard normal** distribution is bell-shaped with mean zero and standard deviation one. Epsilon, ε,
    names the sampled random value. The mean and scale can be differentiated while treating this random draw
    as the supplied noise for that calculation. The scale must follow the recipe''s valid positive parameterization.'
  text_mode: 'For a Gaussian latent, write z = mean + scale×epsilon, where epsilon is sampled from a standard
    normal distribution. Mean two, scale one-half, and epsilon minus one produce z = 1.5. This expresses randomness
    separately so gradients can reach the encoder’s mean and scale.


    A **standard normal** distribution is bell-shaped with mean zero and standard deviation one. Epsilon, ε,
    names the sampled random value. The mean and scale can be differentiated while treating this random draw
    as the supplied noise for that calculation. The scale must follow the recipe''s valid positive parameterization.'
  bridges: []
- id: autoencoders-and-vaes.s4
  title: Understand the tradeoff
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.autoencoders-and-vaes
  markdown: 'A stronger prior-matching term can make random sampling easier while reducing reconstruction detail
    or contributing to posterior collapse. Latent interpolation can be useful without every intermediate representing
    a real object. Evaluate reconstruction, sample diversity, and downstream usefulness under the actual loss
    and decoder.


    **Posterior collapse** is a failure in which the latent carries little input-specific information and the
    decoder effectively ignores it. A reasonable-looking reconstruction loss alone may miss this. Inspect whether
    changing the latent changes meaningful output and whether the intended information is retained.'
  text_mode: 'A stronger prior-matching term can make random sampling easier while reducing reconstruction
    detail or contributing to posterior collapse. Latent interpolation can be useful without every intermediate
    representing a real object. Evaluate reconstruction, sample diversity, and downstream usefulness under
    the actual loss and decoder.


