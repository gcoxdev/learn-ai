assessment_families:
- id: autoencoders-and-vaes.base
  objective_ref: objective.autoencoders-and-vaes
  task: base
  response_type: single_choice
  points: 1
  hint: 'Make the latent probabilistic: trace the inputs, operation, and result before choosing.'
  remediation_scene: autoencoders-and-vaes.s2
  variants:
  - id: autoencoders-and-vaes.base.1
    prompt: Does a plain autoencoder guarantee meaningful samples from arbitrary random latent codes?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only with a small file size
    answer: a
    feedback: Reconstruction training alone need not organize unused latent regions.
  - id: autoencoders-and-vaes.base.2
    prompt: Mean 2, scale 0.5, epsilon -1 give z what?
    options:
    - id: b
      text: '2.5'
    - id: c
      text: '-1.5'
    - id: a
      text: '1.5'
    answer: a
    feedback: Compute 2 + 0.5×(-1).
- id: autoencoders-and-vaes.transfer
  objective_ref: objective.autoencoders-and-vaes
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Understand the tradeoff: trace the inputs, operation, and result before choosing.'
  remediation_scene: autoencoders-and-vaes.s4
  variants:
  - id: autoencoders-and-vaes.transfer.1
    prompt: What does the VAE prior-matching term compare?
    options:
    - id: b
      text: Only two output image file names
    - id: c
      text: Only model runtime
    - id: a
      text: Approximate latent posterior and chosen prior
    answer: a
    feedback: It regularizes the probabilistic latent representation.
  - id: autoencoders-and-vaes.transfer.2
    prompt: Can stronger latent regularization trade away reconstruction detail?
    options:
    - id: c
      text: Only if the decoder is removed
    - id: a
      text: 'Yes'
    - id: b
      text: 'No'
    answer: a
    feedback: Training balances competing terms.
