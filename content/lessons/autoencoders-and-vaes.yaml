assessment_families:
  - id: autoencoders-and-vaes.base
    objective_ref: objective.autoencoders-and-vaes
    task: base
    response_type: single_choice
    points: 1
    hint: 'Make the latent probabilistic: trace the inputs, operation, and result before choosing.'
    remediation_scene: autoencoders-and-vaes.s2
    variants:
      - id: autoencoders-and-vaes.base.1
        prompt: Does a plain autoencoder guarantee meaningful samples from arbitrary random latent codes?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only with a small file size
        answer: a
        feedback: Reconstruction training alone need not organize unused latent regions.
        retired: true
      - id: autoencoders-and-vaes.base.2
        prompt: Mean 2, scale 0.5, epsilon -1 give z what?
        options:
          - id: b
            text: '2.5'
          - id: c
            text: '-1.5'
          - id: a
            text: '1.5'
        answer: a
        feedback: Compute 2 + 0.5×(-1).
        retired: true
  - id: autoencoders-and-vaes.transfer
    objective_ref: objective.autoencoders-and-vaes
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Understand the tradeoff: trace the inputs, operation, and result before choosing.'
    remediation_scene: autoencoders-and-vaes.s4
    variants:
      - id: autoencoders-and-vaes.transfer.1
        prompt: What does the VAE prior-matching term compare?
        options:
          - id: b
            text: Only two output image file names
          - id: c
            text: Only model runtime
          - id: a
            text: Approximate latent posterior and chosen prior
        answer: a
        feedback: It regularizes the probabilistic latent representation.
        retired: true
      - id: autoencoders-and-vaes.transfer.2
        prompt: Can stronger latent regularization trade away reconstruction detail?
        options:
          - id: c
            text: Only if the decoder is removed
          - id: a
            text: 'Yes'
          - id: b
            text: 'No'
        answer: a
        feedback: Training balances competing terms.
        retired: true
  - id: autoencoders-and-vaes.base.v2
    objective_ref: objective.autoencoders-and-vaes
    task: base
    response_type: single_choice
    points: 1
    hint: "Keep the three pieces apart: the encoder's μ and σ describe a cloud, z = μ + σε samples from it with the randomness in ε, and the KL term pulls the cloud toward N(0, 1)."
    remediation_scene: autoencoders-and-vaes.s3
    variants:
      - id: autoencoders-and-vaes.base.v2.1
        prompt: An encoder outputs μ = 2 and σ = 0.5, and the noise draw is ε = −1. What is z?
        options:
          - id: b
            text: '2.5, from μ + σ'
          - id: a
            text: '1.5, from 2 + 0.5 × (−1)'
          - id: c
            text: '−1, from the noise draw alone'
        answer: a
        feedback: z = μ + σε = 2 + 0.5 × (−1) = 1.5. Adding σ ignores the draw, and ε alone ignores what the encoder said about this input.
      - id: autoencoders-and-vaes.base.v2.2
        prompt: Why does a VAE write z = μ + σε instead of sampling z directly from N(μ, σ²)?
        options:
          - id: c
            text: It makes z less random, so training is more stable
          - id: b
            text: It forces z to have mean 0 and standard deviation 1
          - id: a
            text: It makes z a differentiable function of μ and σ
        answer: a
        feedback: With the randomness moved into ε, ∂z/∂μ = 1 and ∂z/∂σ = ε, so gradients reach the encoder. z has exactly the same distribution, N(μ, σ²), as before; only ε has mean 0 and standard deviation 1.
      - id: autoencoders-and-vaes.base.v2.3
        prompt: With ε = 0.4 held fixed, σ rises from 0.5 to 0.6. By how much does z change?
        options:
          - id: a
            text: 'Up by 0.04, since ∂z/∂σ = ε'
          - id: b
            text: 'Up by 0.1, the same as the change in σ'
          - id: c
            text: 'Not at all, since only μ moves z'
        answer: a
        feedback: z changes by ε × Δσ = 0.4 × 0.1 = 0.04. A change in μ moves z one-for-one; a change in σ is scaled by the noise draw.
      - id: autoencoders-and-vaes.base.v2.4
        prompt: Which statement describes the two parts of the ELBO that a VAE maximizes?
        options:
          - id: b
            text: Reconstruction plus the KL, so both terms push the same way
          - id: a
            text: Reconstruction minus the KL from each cloud to the prior
          - id: c
            text: The KL between the decoder output and the input image
        answer: a
        feedback: ELBO = E[log p(x | z)] − KL(q(z | x) ‖ p(z)). The KL is subtracted, so it acts as a penalty that pulls clouds toward the prior. The KL compares latent distributions, not images.
      - id: autoencoders-and-vaes.base.v2.5
        prompt: Why can a VAE generate new samples from N(0, 1) when a plain autoencoder usually can't?
        options:
          - id: c
            text: Its decoder is larger, so it can draw from any code at all
          - id: a
            text: The KL penalty packs the training clouds around 0, so the decoder has seen that region
          - id: b
            text: Its encoder memorizes the training set, so random codes point to real inputs
        answer: a
        feedback: Pulling every cloud toward N(0, 1) fills the region you sample from with codes the decoder has trained on. Decoder size doesn't help with regions it never saw, and memorizing would defeat the purpose.
  - id: autoencoders-and-vaes.transfer.v2
    objective_ref: objective.autoencoders-and-vaes
    task: transfer
    response_type: single_choice
    points: 1
    hint: Decide which ELBO term is winning. Too much KL and the code stops carrying information; too little and the codes spread out, leaving gaps the decoder never learned.
    remediation_scene: autoencoders-and-vaes.s4
    variants:
      - id: autoencoders-and-vaes.transfer.v2.1
        prompt: A VAE for faces rebuilds training faces sharply, but faces decoded from random N(0, 1) samples are smudges. What is the likely cause?
        options:
          - id: c
            text: The KL term is too strong, so every code is the same
          - id: b
            text: The decoder is too small to draw a face from a code
          - id: a
            text: The KL term is too weak, so codes don't fill the prior's region
        answer: a
        feedback: Sharp reconstructions but bad prior samples mean the codes sit away from where you sample, like a plain autoencoder. A strong KL would blur the reconstructions too, and a too-small decoder couldn't rebuild faces sharply.
      - id: autoencoders-and-vaes.transfer.v2.2
        prompt: A music VAE's decoder gives the same tune whatever z you feed it, though its training loss looks fine. What has happened, and how do you confirm it?
        options:
          - id: a
            text: Posterior collapse; vary z and compare the tunes
          - id: b
            text: Overfitting; check the loss on held-out tunes
          - id: c
            text: Mode collapse; add more songs from rare genres
        answer: a
        feedback: A decoder that ignores z is posterior collapse, where the KL term won. Varying z and checking the output tests it directly. Held-out loss may look normal, and mode collapse is the GAN failure you'll meet next.
      - id: autoencoders-and-vaes.transfer.v2.3
        prompt: An engineer wants a latent space where one coordinate controls a font's weight and another its slant. Which change to a VAE is most commonly tried?
        options:
          - id: b
            text: Remove the KL term so each code can be more precise
          - id: a
            text: Raise the weight on the KL term (a β-VAE)
          - id: c
            text: Replace the Gaussian prior with the training data
        answer: a
        feedback: A β above 1 pushes harder toward the factorized N(0, 1) prior, which tends to encourage separate coordinates for separate factors, at some cost to reconstruction. Removing the KL gives a plain autoencoder with no pressure on the coordinates.
      - id: autoencoders-and-vaes.transfer.v2.4
        prompt: A sensor-data VAE's encoder outputs σ values that sometimes come out negative, crashing training. What is the standard fix?
        options:
          - id: c
            text: Clip ε to be positive so σε can't go negative
          - id: b
            text: Take the absolute value of μ before sampling z
          - id: a
            text: Have the encoder output log σ², then take σ = exp(½ log σ²)
        answer: a
        feedback: Predicting log σ² lets the network output any real number while σ stays positive. Clipping ε changes the distribution of z, and μ may be any sign.
  - id: autoencoders-and-vaes.calculate
    objective_ref: objective.autoencoders-and-vaes
    task: base
    response_type: numeric
    points: 1
    hint: Use KL = ½(μ² + σ² − 1 − ln σ²). Square σ first, and remember ln σ² is negative when σ < 1.
    remediation_scene: autoencoders-and-vaes.s5
    absolute_tolerance: 0.01
    variants:
      - id: autoencoders-and-vaes.calculate.1
        prompt: An encoder outputs μ = 2 and σ = 1 for one latent coordinate. What is its KL divergence from N(0, 1)?
        answer: 2
        feedback: ½(4 + 1 − 1 − ln 1) = ½ × 4 = 2. With σ = 1 only the μ² term remains.
      - id: autoencoders-and-vaes.calculate.2
        prompt: An encoder outputs μ = 0 and σ = 0.5. What is the KL divergence from N(0, 1)? (ln 0.25 ≈ −1.386)
        answer: 0.318
        feedback: ½(0 + 0.25 − 1 + 1.386) = ½ × 0.636 = 0.318. A cloud narrower than the prior costs something even at the center.
      - id: autoencoders-and-vaes.calculate.3
        prompt: An encoder outputs μ = 1 and σ = 2. What is the KL divergence from N(0, 1)? (ln 4 ≈ 1.386)
        answer: 1.307
        feedback: ½(1 + 4 − 1 − 1.386) = ½ × 2.614 = 1.307.
      - id: autoencoders-and-vaes.calculate.4
        prompt: An encoder outputs μ = −1 and σ = 1. What is the KL divergence from N(0, 1)?
        answer: 0.5
        feedback: ½(1 + 1 − 1 − 0) = 0.5. The sign of μ doesn't matter, only its distance from 0.
      - id: autoencoders-and-vaes.calculate.5
        prompt: A two-coordinate latent has (μ, σ) = (1, 1) and (0, 1). What is the total KL divergence from N(0, 1)?
        answer: 0.5
        feedback: The first coordinate costs ½(1 + 1 − 1 − 0) = 0.5; the second, at the prior itself, costs 0. Coordinates add, for a total of 0.5.
