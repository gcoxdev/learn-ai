schema_version: 0.2-draft
lesson:
  id: autoencoders-and-vaes
  version: 0.4.0-draft
  title: Learn a latent representation and a way back to data
  state: draft
  summary: Squeeze a doodle into two numbers and rebuild it. Then pick two random numbers and decode a doodle nobody drew. Learn the one-line trick and the one penalty that make the second part work.
  slot: M22.3
  category: learning
  sources:
    - title: Auto-Encoding Variational Bayes (Kingma & Welling, 2013)
      url: https://arxiv.org/abs/1312.6114
    - title: Stochastic Backpropagation and Approximate Inference in Deep Generative Models (Rezende, Mohamed & Wierstra, 2014)
      url: https://arxiv.org/abs/1401.4082
    - title: An Introduction to Variational Autoencoders (Kingma & Welling, 2019)
      url: https://arxiv.org/abs/1906.02691
    - title: "Deep Learning, chapter 14: Autoencoders (Goodfellow, Bengio & Courville, 2016)"
      url: https://www.deeplearningbook.org/contents/autoencoders.html
objectives:
  - id: objective.autoencoders-and-vaes
    version: 2-draft
    statement: Autoencoders reconstruct inputs through a latent representation; variational autoencoders learn a probabilistic encoder and decoder with a prior-matching term that supports principled latent sampling.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - autoencoders-and-vaes.base.v2
      - autoencoders-and-vaes.transfer.v2
      - autoencoders-and-vaes.calculate
    prerequisites:
      - anyOf:
          - objective.generative-models
      - anyOf:
          - objective.random-variables
scenes:
  - id: autoencoders-and-vaes.s1
    title: Squeeze 784 numbers through two
    type: explanation
    depth: intuition
    objective_refs:
      - objective.autoencoders-and-vaes
    markdown: |-
      A 28 × 28 doodle is 784 brightness values. Train a network to squeeze those 784 numbers down to just two, then rebuild all 784 from the two. If the rebuilt doodle looks like the original, those two numbers captured something essential.

      That network is an **autoencoder**, which you met in module 8 as an anomaly detector. Its **encoder** maps the input $x$ to a short **code** $z$, also called the **latent representation**. Its **decoder** maps $z$ back to a reconstruction $\hat{x}$. Training minimizes the **reconstruction error**, such as the squared difference between $x$ and $\hat{x}$. The narrow middle, the **bottleneck**, forces the code to keep what matters most.

      Now try to *generate*: pick a random point, say $z = (3.1, -0.4)$, and decode it. With a plain autoencoder you usually get a smudge. Training only asked the decoder to handle the codes of real doodles, and those codes can sit on scattered islands with empty sea between them. Nothing taught the decoder what to draw in the sea.

      :::mixup "An autoencoder that rebuilds its inputs well is a good generator."
      Rebuilding only tests codes the encoder actually produced. A generator needs every region you might sample from to decode into something sensible, and a plain autoencoder never trains on those regions.
      :::
    bridges: []
  - id: autoencoders-and-vaes.s2
    title: Encode to a cloud, not a point
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.autoencoders-and-vaes
    markdown: |-
      The **variational autoencoder**, or **VAE** (Kingma & Welling, 2013; Rezende, Mohamed & Wierstra independently, 2014), fixes the sea with two changes.

      First, the encoder outputs a small cloud instead of a point. For each latent coordinate it outputs a **mean** $\mu$ and a **standard deviation** $\sigma$, describing the bell curve $q(z \mid x) = \mathcal{N}(\mu, \sigma^2)$. For one cat doodle it might say $\mu = 1.0$, $\sigma = 0.5$: "this doodle's code is around 1.0, give or take 0.5." During training the decoder gets a random $z$ from that cloud, so it learns to handle a whole neighborhood, not one exact point.

      Second, a penalty pulls every cloud toward a fixed **prior**, $p(z) = \mathcal{N}(0, 1)$, the **standard normal** bell curve (mean 0, standard deviation 1). The clouds then overlap and fill the region around 0 with no gaps. To generate, sample $z$ from the prior and decode it: every such point lies in territory the decoder has trained on.
    diagram:
      caption: A VAE during training. The dashed path is how it generates new doodles afterwards.
      description: A doodle x goes to the encoder, which outputs a mean mu and a standard deviation sigma. Random noise epsilon, drawn from a standard normal, joins them to form z equals mu plus sigma times epsilon. The decoder turns z into a rebuilt doodle, scored by the reconstruction term. The KL term pulls mu and sigma toward the standard normal prior. To generate, sample z from the prior and send it straight to the decoder.
      nodes:
        - id: x
          label: Doodle x
          note: 784 pixels
          col: 0
          row: 0
        - id: encoder
          label: Encoder
          col: 1
          row: 0
        - id: musigma
          label: μ = 1.0, σ = 0.5
          note: KL term pulls toward N(0, 1)
          col: 2
          row: 0
          tone: accent
        - id: z
          label: z = μ + σ·ε
          col: 3
          row: 0
          tone: data
        - id: decoder
          label: Decoder
          col: 4
          row: 0
        - id: xhat
          label: Rebuilt doodle x̂
          note: reconstruction term
          col: 5
          row: 0
        - id: eps
          label: ε from N(0, 1)
          note: random noise, no gradient needed
          col: 3
          row: 1
          tone: muted
        - id: prior
          label: Prior N(0, 1)
          note: sample here to generate
          col: 4
          row: 1
          tone: warn
      edges:
        - from: x
          to: encoder
        - from: encoder
          to: musigma
        - from: musigma
          to: z
        - from: eps
          to: z
        - from: z
          to: decoder
        - from: decoder
          to: xhat
        - from: prior
          to: decoder
          label: generate
          dashed: true
    bridges:
      - random-variables
  - id: autoencoders-and-vaes.s3
    title: A random draw you can differentiate
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.autoencoders-and-vaes
    markdown: |-
      Training needs gradients to flow from the reconstruction error back through $z$ into the encoder's $\mu$ and $\sigma$. But "draw $z$ at random from $\mathcal{N}(\mu, \sigma^2)$" is a dice roll, and you can't ask how a dice roll changes when you nudge $\mu$.

      The **reparameterization trick** moves the randomness to the side. Draw $\varepsilon$ (epsilon) from the fixed standard normal, then compute

      $$z = \mu + \sigma \cdot \varepsilon$$

      With $\mu = 1.0$, $\sigma = 0.5$, and a draw $\varepsilon = 0.4$: $z = 1.0 + 0.5 \times 0.4 = 1.2$. The result has exactly the distribution $\mathcal{N}(\mu, \sigma^2)$, but now $z$ is ordinary arithmetic on $\mu$ and $\sigma$. Its derivatives are simple: $\partial z / \partial \mu = 1$ and $\partial z / \partial \sigma = \varepsilon = 0.4$. Backpropagation treats $\varepsilon$ as a fixed input for this step, just like a pixel.

      :::predict Keep ε = 0.4. If training nudges σ from 0.5 up to 0.6, how much does z move? And if it nudges μ up by 0.1?
      $z$ becomes $1.0 + 0.6 \times 0.4 = 1.24$, up by 0.04, which is $\varepsilon \times 0.1$. Nudging $\mu$ by 0.1 moves $z$ by exactly 0.1. Those two rates, 0.4 and 1, are the gradients the encoder receives.
      :::

      In practice the encoder outputs $\log \sigma^2$ rather than $\sigma$, so any real number it produces gives a valid positive $\sigma$.
    bridges: []
  - id: autoencoders-and-vaes.s5
    title: "The ELBO: rebuild well, stay near the prior"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.autoencoders-and-vaes
    markdown: |-
      The two pressures combine into one objective, the **evidence lower bound (ELBO)** from the Bayesian learning lesson in module 6. Here the unknowns are each doodle's code:

      :::papers The VAE objective (Kingma & Welling, 2013)
      $$\text{ELBO}(x) = \underbrace{\mathbb{E}_{q(z \mid x)}\big[\log p(x \mid z)\big]}_{\text{reconstruction}} \;-\; \underbrace{\mathrm{KL}\big(q(z \mid x)\,\|\,p(z)\big)}_{\text{stay near the prior}} \;\le\; \log p(x)$$

      Training maximizes the ELBO. The first term rewards decoding $z$ back into $x$; with squared error, it's the usual reconstruction loss with a minus sign. The second is the **KL divergence**, the mismatch between the cloud and the prior. For one Gaussian coordinate against $\mathcal{N}(0, 1)$ it has a closed form:

      $$\mathrm{KL} = \tfrac{1}{2}\big(\mu^2 + \sigma^2 - 1 - \ln \sigma^2\big)$$
      :::

      For our cat doodle, $\mu = 1.0$ and $\sigma = 0.5$:

      $$\mathrm{KL} = \tfrac{1}{2}\big(1 + 0.25 - 1 - \ln 0.25\big) = \tfrac{1}{2}(0.25 + 1.386) = 0.818$$

      The $\mu^2$ part charges for sitting away from 0; the $\sigma^2 - 1 - \ln\sigma^2$ part charges for a cloud narrower or wider than 1. It is zero only at $\mu = 0, \sigma = 1$. With several latent coordinates, add their KLs.

      The code checks this formula by sampling, and confirms that gradients reach $\mu$ and $\sigma$ through $z$:

      ```python run
      import numpy as np

      def kl(mu, sigma):          # KL( N(mu, sigma^2) || N(0, 1) ), closed form
          return 0.5 * (mu**2 + sigma**2 - 1 - np.log(sigma**2))

      for mu, sigma in [(0, 1), (1, 0.5), (2, 1), (0, 0.5), (0, 2)]:
          print(f"mu={mu}, sigma={sigma}: KL = {kl(mu, sigma):.3f}")

      # Reparameterize: z = mu + sigma * eps, with eps drawn from N(0, 1)
      rng = np.random.default_rng(0)
      mu, sigma = 1.0, 0.5
      eps = rng.standard_normal(200_000)
      z = mu + sigma * eps

      # Check the KL by averaging log q(z) - log p(z) over the samples
      log_q = -0.5 * eps**2 - np.log(sigma) - 0.5 * np.log(2 * np.pi)
      log_p = -0.5 * z**2 - 0.5 * np.log(2 * np.pi)
      print(f"sampled KL estimate: {np.mean(log_q - log_p):.3f}")

      # Gradients flow through z: for loss = z**2, d loss/d mu = 2z, d loss/d sigma = 2z * eps
      print(f"avg d(z^2)/d mu    = {np.mean(2 * z):.3f}   (exact 2*mu    = {2 * mu})")
      print(f"avg d(z^2)/d sigma = {np.mean(2 * z * eps):.3f}   (exact 2*sigma = {2 * sigma})")
      ```

      The sampled estimate, 0.817, matches the formula's 0.818. A narrow cloud at the center, $(0, 0.5)$, costs 0.318; a wide one, $(0, 2)$, costs 0.807. Try $\mu = -1$: the cost is the same as $\mu = 1$, because only the distance from 0 matters.
    bridges: []
  - id: autoencoders-and-vaes.s4
    title: Too much KL, too little KL
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.autoencoders-and-vaes
    markdown: |-
      The two ELBO terms pull against each other, and the balance shows up in the samples.

      | If the KL term wins too much | If reconstruction wins too much |
      | --- | --- |
      | Every cloud sits at $\mu = 0$, $\sigma = 1$ and carries no information about its doodle | Clouds shrink to tiny points far apart, back to a plain autoencoder |
      | The decoder learns to ignore $z$: **posterior collapse** | Random samples from the prior land in the sea and decode to smudges |

      Posterior collapse is easy to miss, since the loss can look fine. Test for it directly: decode two very different $z$ values and see whether the doodle changes. VAE samples also tend to look blurry, because a decoder trained with squared error averages over the doodles each cloud could mean. The **β-VAE** (Higgins et al., 2017) multiplies the KL term by a weight β to move this balance on purpose. Setting β above 1 costs some reconstruction detail but tends to make separate coordinates capture separate factors, such as a stroke's thickness and its slant.

      You'll meet the VAE's encoder and decoder again. The token models in the previous lesson used a discrete cousin, VQ-VAE. Stable Diffusion, in the latent diffusion lesson, uses a VAE-style autoencoder with only a light KL penalty, purely to shrink images before generating.
    bridges: []
  - id: autoencoders-and-vaes.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.autoencoders-and-vaes
    markdown: Gaussian KLs to compute by hand, reparameterization arithmetic, and a face generator, a music model, and a collapsed decoder test whether you can train and diagnose a VAE.
    takeaway: |-
      A VAE encodes each input to a small Gaussian cloud, samples from it with z = μ + σε so gradients flow, and trains on reconstruction minus a KL penalty that keeps every cloud near the prior you sample from.
  - id: autoencoders-and-vaes.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.autoencoders-and-vaes
    markdown: |-
      An autoencoder reconstructs inputs through a code. A VAE also learns how input-specific code distributions relate to a prior used for fresh generation.
