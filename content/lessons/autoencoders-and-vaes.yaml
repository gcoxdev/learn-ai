schema_version: 0.2-draft
lesson:
  id: autoencoders-and-vaes
  version: 0.1.0-draft
  title: Learn a latent representation and a way back to data
  state: draft
  summary: Autoencoders reconstruct inputs through a latent representation; variational autoencoders learn a probabilistic
    encoder and decoder with a prior-matching term that supports principled latent sampling.
  slot: M22.3
  category: learning
  sources:
  - title: Auto-Encoding Variational Bayes
    url: https://arxiv.org/abs/1312.6114
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.autoencoders-and-vaes
  version: 1-draft
  statement: Autoencoders reconstruct inputs through a latent representation; variational autoencoders learn a probabilistic
    encoder and decoder with a prior-matching term that supports principled latent sampling.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - autoencoders-and-vaes.base
  - autoencoders-and-vaes.transfer
  prerequisites:
  - anyOf:
    - objective.generative-models
  - anyOf:
    - objective.random-variables
scenes:
- id: autoencoders-and-vaes.s1
  title: Compress and reconstruct
  type: explanation
  depth: intuition
  objective_refs:
  - objective.autoencoders-and-vaes
  markdown: An autoencoder maps input x to latent code z and decodes z into a reconstruction. A bottleneck or other
    constraint discourages merely copying every input detail. Reconstruction quality describes information retained
    under the chosen loss, not necessarily useful semantics or a valid distribution for random latent samples.
  text_mode: An autoencoder maps input x to latent code z and decodes z into a reconstruction. A bottleneck or other
    constraint discourages merely copying every input detail. Reconstruction quality describes information retained
    under the chosen loss, not necessarily useful semantics or a valid distribution for random latent samples.
  bridges: []
- id: autoencoders-and-vaes.s2
  title: Make the latent probabilistic
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.autoencoders-and-vaes
  markdown: A VAE encoder can output a mean and scale for an approximate latent distribution. A sampled latent is
    decoded through a likelihood model. Training balances expected reconstruction log likelihood against a divergence
    between the approximate posterior and a chosen prior; this is an evidence lower bound formulation.
  text_mode: A VAE encoder can output a mean and scale for an approximate latent distribution. A sampled latent
    is decoded through a likelihood model. Training balances expected reconstruction log likelihood against a divergence
    between the approximate posterior and a chosen prior; this is an evidence lower bound formulation.
  bridges:
  - random-variables
- id: autoencoders-and-vaes.s3
  title: Reparameterize a toy sample
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.autoencoders-and-vaes
  markdown: For a Gaussian latent, write z = mean + scale×epsilon, where epsilon is sampled from a standard normal
    distribution. Mean two, scale one-half, and epsilon minus one produce z = 1.5. This expresses randomness separately
    so gradients can reach the encoder’s mean and scale.
  text_mode: For a Gaussian latent, write z = mean + scale×epsilon, where epsilon is sampled from a standard normal
    distribution. Mean two, scale one-half, and epsilon minus one produce z = 1.5. This expresses randomness separately
    so gradients can reach the encoder’s mean and scale.
  bridges: []
- id: autoencoders-and-vaes.s4
  title: Understand the tradeoff
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.autoencoders-and-vaes
  markdown: A stronger prior-matching term can make random sampling easier while reducing reconstruction detail
    or contributing to posterior collapse. Latent interpolation can be useful without every intermediate representing
    a real object. Evaluate reconstruction, sample diversity, and downstream usefulness under the actual loss and
    decoder.
  text_mode: A stronger prior-matching term can make random sampling easier while reducing reconstruction detail
    or contributing to posterior collapse. Latent interpolation can be useful without every intermediate representing
    a real object. Evaluate reconstruction, sample diversity, and downstream usefulness under the actual loss and
    decoder.
  bridges: []
- id: autoencoders-and-vaes.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.autoencoders-and-vaes
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Autoencoders reconstruct inputs through a latent representation; variational autoencoders learn a probabilistic
    encoder and decoder with a prior-matching term that supports principled latent sampling.
- id: autoencoders-and-vaes.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.autoencoders-and-vaes
  markdown: Autoencoders reconstruct inputs through a latent representation; variational autoencoders learn a probabilistic
