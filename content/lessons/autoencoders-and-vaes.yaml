schema_version: 0.2-draft
lesson:
  id: autoencoders-and-vaes
  version: 0.3.0-draft
  title: Learn a latent representation and a way back to data
  state: draft
  summary: Compress an example, reconstruct it, and see what extra structure helps a model generate from new
    latent samples.
  slot: M22.3
  category: learning
  sources:
  - title: Auto-Encoding Variational Bayes
    url: https://arxiv.org/abs/1312.6114
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.autoencoders-and-vaes
  version: 1-draft
  statement: Autoencoders reconstruct inputs through a latent representation; variational autoencoders learn
    a probabilistic encoder and decoder with a prior-matching term that supports principled latent sampling.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - autoencoders-and-vaes.base
  - autoencoders-and-vaes.transfer
  prerequisites:
  - anyOf:
    - objective.generative-models
  - anyOf:
    - objective.random-variables
scenes:
- id: autoencoders-and-vaes.s1
  title: Compress and reconstruct
  type: explanation
  depth: intuition
  objective_refs:
  - objective.autoencoders-and-vaes
  markdown: 'An **autoencoder** learns two operations. Its **encoder** turns input x into an internal code
    z, called a **latent representation**. Its **decoder** turns z back into a reconstruction of x.


    A bottleneck, or another constraint, limits what the code can carry so the system cannot simply copy every
    detail. The reconstruction loss measures which details it preserves under that scoring rule.


    Good reconstruction does not guarantee that random codes will produce useful samples. An ordinary autoencoder
    may have learned to decode only a small part of the possible code space.'
  text_mode: 'An **autoencoder** learns two operations. Its **encoder** turns input x into an internal code
    z, called a **latent representation**. Its **decoder** turns z back into a reconstruction of x.


    A bottleneck, or another constraint, limits what the code can carry so the system cannot simply copy every
    detail. The reconstruction loss measures which details it preserves under that scoring rule.


    Good reconstruction does not guarantee that random codes will produce useful samples. An ordinary autoencoder
    may have learned to decode only a small part of the possible code space.'
  bridges: []
- id: autoencoders-and-vaes.s2
  title: Make the latent probabilistic
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.autoencoders-and-vaes
  markdown: 'A **variational autoencoder**, or **VAE**, makes the latent code probabilistic. Its encoder proposes
    a distribution of codes for each input, called an **approximate posterior**. A common encoder outputs a
    mean and a scale; a sampled code then goes to the decoder.


    A **prior** describes codes before a particular input is observed. For fresh generation, sample a code
    from this prior and decode it.


    Training must connect these two uses. The **evidence lower bound**, or **ELBO**, balances expected reconstruction
    log likelihood with a divergence penalty between the approximate posterior and the prior. It is a computable
    lower bound on the model''s log probability of the observed data. This gives a principled training objective,
    though useful samples still depend on what the model learns.'
  text_mode: 'A **variational autoencoder**, or **VAE**, makes the latent code probabilistic. Its encoder proposes
    a distribution of codes for each input, called an **approximate posterior**. A common encoder outputs a
