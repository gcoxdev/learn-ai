assessment_families:
  - id: shared-and-latent-kv.base
    objective_ref: objective.shared-and-latent-kv
    task: base
    response_type: single_choice
    points: 1
    hint: Only the number of key/value heads enters the cache formula; the query heads don't.
    remediation_scene: shared-and-latent-kv.s2
    variants:
      - id: shared-and-latent-kv.base.1
        prompt: What does grouped-query attention share?
        options:
          - id: a
            text: Key/value heads among groups of query heads
          - id: b
            text: All token IDs across languages
          - id: c
            text: One output token across every request
        answer: a
        feedback: Groups reuse key/value projections.
        retired: true
      - id: shared-and-latent-kv.base.2
        prompt: Eight KV heads become two with equal dimensions. Simplified KV element reduction?
        options:
          - id: b
            text: Twofold
          - id: c
            text: No reduction
          - id: a
            text: Fourfold
        answer: a
        feedback: The KV-head count falls by a factor of four.
        retired: true
  - id: shared-and-latent-kv.transfer
    objective_ref: objective.shared-and-latent-kv
    task: transfer
    response_type: single_choice
    points: 1
    hint: Separate the cache from the weights, and sharing heads from compressing them.
    remediation_scene: shared-and-latent-kv.s4
    variants:
      - id: shared-and-latent-kv.transfer.1
        prompt: Is latent attention just a different name for MQA?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if both cache tensors
          - id: a
            text: No; it uses a compressed latent parameterization
        answer: a
        feedback: Sharing head count and latent compression are distinct mechanisms.
        retired: true
      - id: shared-and-latent-kv.transfer.2
        prompt: Does a fourfold KV reduction imply fourfold total-memory reduction?
        options:
          - id: c
            text: Only for every batch
          - id: a
            text: No; weights and other allocations remain
          - id: b
            text: 'Yes'
        answer: a
        feedback: One allocation is only part of the budget.
        retired: true
  - id: shared-and-latent-kv.base.v2
    objective_ref: objective.shared-and-latent-kv
    task: base
    response_type: single_choice
    points: 1
    hint: "Keep three things apart: query heads (each scores its own way), key/value heads (what gets cached), and MLA's latent (a compressed vector the heads' keys and values are rebuilt from)."
    remediation_scene: shared-and-latent-kv.s2
    variants:
      - id: shared-and-latent-kv.base.v2.1
        prompt: A model uses grouped-query attention with 32 query heads and 8 key/value heads. How are the heads arranged?
        options:
          - id: b
            text: Each group of 8 query heads shares one key/value head
          - id: c
            text: Each query head chooses among all 8 key/value heads
          - id: a
            text: Each group of 4 query heads shares one key/value head
        answer: a
        feedback: 32 query heads ÷ 8 KV heads = 4 query heads per group. Eight per group would need only 4 KV heads, and query heads don't choose freely among KV heads; each is fixed to its group's.
      - id: shared-and-latent-kv.base.v2.2
        prompt: Under GQA, four query heads share one set of keys and values. Why do those four heads still produce different outputs?
        options:
          - id: a
            text: Each has its own query projection, so each weighs the shared keys differently
          - id: b
            text: Each has its own positional encoding, so each sees the tokens in another order
          - id: c
            text: Each is followed by its own feed-forward layer, which separates their outputs
        answer: a
        feedback: Different queries give different scores against the same keys, so each head blends the shared values in its own proportions. RoPE rotates by position the same way for every head, and the feed-forward layer comes after the heads are combined.
      - id: shared-and-latent-kv.base.v2.3
        prompt: Shazeer's multi-query attention was proposed to speed up generating text one token at a time. What does it shrink?
        options:
          - id: c
            text: The number of query heads, so fewer attention patterns are computed
          - id: a
            text: The keys and values stored per token, which each new token must read
          - id: b
            text: The feed-forward weights, which dominate the arithmetic per token
        answer: a
        feedback: Decoding each token reads the whole KV cache, and that memory traffic sets the speed. MQA keeps every query head but caches one key/value head. The feed-forward weights are unchanged.
      - id: shared-and-latent-kv.base.v2.4
        prompt: What does DeepSeek-V2's multi-head latent attention store in the cache for each token and layer?
        options:
          - id: b
            text: Keys and values for 2 shared heads, as in GQA with two groups
          - id: a
            text: A 512-number latent plus a 64-number key that carries RoPE
          - id: c
            text: The full keys and values for all 128 heads, at 4-bit precision
        answer: a
        feedback: MLA caches one compressed latent (rebuilt into each head's keys and values by learned up-projections) plus a small shared RoPE key, 576 numbers in all. That equals the size of GQA with 2.25 groups, but it isn't head sharing, and it isn't quantization.
  - id: shared-and-latent-kv.transfer.v2
    objective_ref: objective.shared-and-latent-kv
    task: transfer
    response_type: single_choice
    points: 1
    hint: Write the cache formula and ask which factor the proposed change actually touches. Then remember the weights sit in memory too.
    remediation_scene: shared-and-latent-kv.s4
    variants:
      - id: shared-and-latent-kv.transfer.v2.1
        prompt: A chatbot runs a trained 13B multi-head model and runs out of memory at 8 concurrent 8,000-token chats. The team wants a lasting fix without training a new model from scratch. Which plan fits?
        options:
          - id: b
            text: Switch to a FlashAttention kernel, which removes the need to keep a cache
          - id: c
            text: Cut the number of query heads in half, which halves the cache per token
          - id: a
            text: Convert to GQA by averaging KV heads per group, then train a little more
        answer: a
        feedback: Ainslie et al. converted checkpoints this way with about 5% of the original training compute. FlashAttention cuts temporary attention memory during a step, not the stored cache, and query heads don't appear in the cache formula.
      - id: shared-and-latent-kv.transfer.v2.2
        prompt: A server holds 60 GB of weights and 16 GB of KV cache. Switching to a design with 4× fewer KV heads is proposed. About how much memory will the model then use in total?
        options:
          - id: c
            text: About 19 GB
          - id: a
            text: About 64 GB
          - id: b
            text: About 38 GB
        answer: a
        feedback: Only the cache shrinks, from 16 GB to 4 GB, so the total falls from 76 GB to 64 GB. Dividing the whole 76 GB by 4 (19 GB) or by 2 (38 GB) wrongly shrinks the weights too.
      - id: shared-and-latent-kv.transfer.v2.3
        prompt: A code assistant keeps a 16-bit cache of 20 GiB for its longest sessions, using 8 KV heads. The team switches to an 8-bit cache and to 4 KV heads (after retraining). What is the new cache size?
        options:
          - id: b
            text: 10 GiB
          - id: c
            text: 2.5 GiB
          - id: a
            text: 5 GiB
        answer: a
        feedback: "The two savings multiply: half the bytes per value and half the heads give 20 × ½ × ½ = 5 GiB. 10 GiB applies only one of them, and 2.5 GiB applies one twice."
      - id: shared-and-latent-kv.transfer.v2.4
        prompt: A new model's card says "64 attention heads, head size 128, 80 layers". An engineer estimates the cache from those numbers alone. What should she check first?
        options:
          - id: a
            text: How many key/value heads the model has, since GQA uses fewer
          - id: b
            text: How many experts it has, since each one keeps a separate cache
          - id: c
            text: How large its vocabulary is, since each token's cache scales with it
        answer: a
        feedback: With 8 KV heads instead of 64 the estimate would be 8× too high. Experts in a mixture-of-experts model live in the feed-forward layers and don't add attention caches, and vocabulary size doesn't enter the formula.
  - id: shared-and-latent-kv.bytes
    objective_ref: objective.shared-and-latent-kv
    task: base
    response_type: numeric
    points: 1
    hint: "Multiply 2 × layers × KV heads × head width × tokens × bytes per value (× batch). 1 KiB = 1,024 bytes and 1 GiB = 1,024³ bytes."
    remediation_scene: shared-and-latent-kv.s1
    absolute_tolerance: 0.01
    variants:
      - id: shared-and-latent-kv.bytes.1
        prompt: A model has 32 layers, 8 key/value heads, and head width 128, with a 16-bit (2-byte) cache. How many KiB does the cache grow per token?
        answer: 128
        feedback: "2 × 32 × 8 × 128 × 2 = 131,072 bytes = 128 KiB per token."
      - id: shared-and-latent-kv.bytes.2
        prompt: A Llama-2-70B-like model has 80 layers, 8 key/value heads, and head width 128, with a 2-byte cache. How many GiB of cache does one 4,096-token conversation need?
        answer: 1.25
        feedback: "Per token: 2 × 80 × 8 × 128 × 2 = 327,680 bytes (320 KiB). Times 4,096 tokens = 1,342,177,280 bytes = 1.25 GiB."
      - id: shared-and-latent-kv.bytes.3
        prompt: A multi-head model has 32 layers, 32 heads (each with its own keys and values), and head width 128, with a 2-byte cache. How many GiB does one 4,096-token sequence need?
        answer: 2
        feedback: "2 × 32 × 32 × 128 × 2 = 524,288 bytes (512 KiB) per token. Times 4,096 = 2 GiB."
      - id: shared-and-latent-kv.bytes.4
        prompt: The Llama-2-70B-like model (80 layers, 8 KV heads, head width 128, 2 bytes) serves a batch of 8 conversations, each 4,096 tokens long. How many GiB of KV cache in total?
        answer: 10
        feedback: "1.25 GiB per conversation × 8 = 10 GiB. With 64 KV heads (plain MHA) it would be 80 GiB."
      - id: shared-and-latent-kv.bytes.5
        prompt: DeepSeek-V2 has 60 layers and caches 576 numbers per token per layer (a 512-number latent plus a 64-number RoPE key), at 2 bytes each. How many KiB of cache per token?
        answer: 67.5
        feedback: "60 × 576 × 2 = 69,120 bytes = 67.5 KiB, versus 3,840 KiB if it cached full keys and values for all 128 heads."
