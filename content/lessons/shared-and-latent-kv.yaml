schema_version: 0.2-draft
lesson:
  id: shared-and-latent-kv
  version: 0.4.0-draft
  title: Reduce the state stored for attention keys and values
  state: draft
  summary: Sixteen users chatting with a 70B model can need 160 GiB of attention cache, more than the model itself. Learn the one-line formula, and the tricks that cut it 8× and beyond.
  slot: M19.2
  category: learning
  sources:
    - title: "Fast Transformer Decoding: One Write-Head is All You Need (Shazeer, 2019)"
      url: https://arxiv.org/abs/1911.02150
    - title: "GQA: Training Generalized Multi-Query Transformer Models from Multi-Head Checkpoints (Ainslie et al., 2023)"
      url: https://arxiv.org/abs/2305.13245
    - title: "Llama 2: Open Foundation and Fine-Tuned Chat Models (Touvron et al., 2023)"
      url: https://arxiv.org/abs/2307.09288
    - title: "DeepSeek-V2: A Strong, Economical, and Efficient Mixture-of-Experts Language Model (DeepSeek-AI, 2024)"
      url: https://arxiv.org/abs/2405.04434
objectives:
  - id: objective.shared-and-latent-kv
    version: 2-draft
    statement: Multi-query and grouped-query attention share key/value heads, while latent attention compresses their representation; cache savings depend on exact dimensions and implementation.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - shared-and-latent-kv.base.v2
      - shared-and-latent-kv.transfer.v2
      - shared-and-latent-kv.bytes
    prerequisites:
      - anyOf:
          - objective.multi-head-attention
      - anyOf:
          - objective.cached-inference
scenes:
  - id: shared-and-latent-kv.s1
    title: The cache that outgrows the model
    type: explanation
    depth: intuition
    objective_refs:
      - objective.shared-and-latent-kv
    markdown: |-
      You're serving a 70-billion-parameter model to 16 people at once, each in a 4,096-token conversation. The weights in 16-bit precision take 140 GB. With standard multi-head attention, the conversations need another 160 GiB. The weights are the same for everyone, but every conversation needs its own copy of something else.

      That something is the **KV cache**. When the model generates token 4,097, each layer needs the keys and values of all 4,096 earlier tokens. Recomputing them for every new token would waste work, so the server keeps them: for every token, every layer, every head, one key vector and one value vector. As the end-to-end token trace in module 15 showed, the cache grows with every token the conversation adds.

      Count it for a model shaped like Llama 2 70B: 80 layers, 64 attention heads, 128 numbers per head, 2 bytes per number.

      :::papers KV-cache size
      $$\text{bytes} = 2 \times \text{layers} \times \text{kv\_heads} \times \text{head\_dim} \times \text{seq\_len} \times \text{bytes per value} \times \text{batch}$$

      The leading 2 counts one key and one value. With every head keeping its own keys and values: $2 \times 80 \times 64 \times 128 \times 2 = 2{,}621{,}440$ bytes, or 2.5 MiB per token. Times 4,096 tokens gives 10 GiB per conversation, and times 16 conversations gives 160 GiB. (1 GiB is $2^{30}$ bytes.)
      :::

      Size is only half the problem. Generating each new token reads the *whole* cache from memory. Noam Shazeer (2019) pointed out that for incremental decoding, this memory traffic, not arithmetic, sets the speed. A smaller cache means more users per GPU and faster tokens.
    bridges: []
  - id: shared-and-latent-kv.s2
    title: Let query heads share keys and values
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.shared-and-latent-kv
    markdown: |-
      Look at the formula again: only `kv_heads` is a design choice. Every other factor is fixed by the model's size or the conversation. So keep all 64 query heads, but let them share fewer key/value heads.

      - **Multi-query attention (MQA)**, from Shazeer's 2019 paper, keeps one key/value head that all query heads share.
      - **Grouped-query attention (GQA)**, from Ainslie et al. (2023), splits the query heads into groups; each group shares one key/value head. GQA with 1 group is MQA, and GQA with one group per query head is ordinary multi-head attention (MHA).

      | Design | Query heads | KV heads | Query heads per KV head | Cache per token (70B-like, 16-bit) |
      | --- | ---: | ---: | ---: | ---: |
      | MHA | 64 | 64 | 1 | 2,560 KiB |
      | GQA-8 | 64 | 8 | 8 | 320 KiB |
      | MQA | 64 | 1 | 64 | 40 KiB |

      Llama 2 used GQA in its larger models, and its 70B model has 8 KV heads. That cuts the 16-conversation cache from 160 GiB to 20 GiB.

      :::predict A team picks 16 KV heads instead of 8 for the same model. What is the cache per token, and for one 4,096-token conversation?
      Twice GQA-8: 640 KiB per token, and 2.5 GiB per conversation. The cache scales in direct proportion to the number of KV heads.
      :::

      ```python run
      def kv_bytes(layers, kv_heads, head_dim, tokens, bytes_per_value=2, batch=1):
          return 2 * layers * kv_heads * head_dim * tokens * bytes_per_value * batch

      KiB, GiB = 2**10, 2**30
      # Llama-2-70B-like: 80 layers, 64 query heads of width 128, 16-bit values
      for name, kv_heads in [("MHA", 64), ("GQA-8", 8), ("MQA", 1)]:
          per_token = kv_bytes(80, kv_heads, 128, tokens=1)
          one_chat = kv_bytes(80, kv_heads, 128, tokens=4096)
          print(f"{name:6s} {per_token / KiB:5.0f} KiB/token   one 4,096-token chat "
                f"{one_chat / GiB:6.2f} GiB   16 chats {16 * one_chat / GiB:6.1f} GiB")

      # DeepSeek-V2 MLA: 60 layers, each caching 512 latent + 64 RoPE-key numbers
      mla_per_token = 60 * (512 + 64) * 2
      print(f"MLA    {mla_per_token / KiB:5.1f} KiB/token  (DeepSeek-V2 shape)")
      ```

      Try `tokens=131072` (a 128K context) for GQA-8: a single conversation needs 40 GiB. Or set `bytes_per_value=1` to see what an 8-bit cache saves.

      :::mixup "If eight query heads share one key/value head, those eight heads all compute the same thing."
      Each query head still has its own query projection, so each scores the shared keys differently and gets its own blend of the shared values. The heads lose some freedom (they must agree on what the keys and values *are*), not their individual attention patterns.
      :::
    diagram:
      caption: Grouped-query attention with 4 query heads and 2 KV heads. Only the KV heads are cached.
      description: "Query heads 1 and 2 both read KV head A. Query heads 3 and 4 both read KV head B. The KV cache stores keys and values only for KV heads A and B, for every past token, so it holds half as much as a design where each of the four query heads had its own KV head."
      nodes:
        - id: q1
          label: Query head 1
          col: 0
          row: 0
        - id: q2
          label: Query head 2
          col: 1
          row: 0
        - id: q3
          label: Query head 3
          col: 3
          row: 0
        - id: q4
          label: Query head 4
          col: 4
          row: 0
        - id: kva
          label: KV head A
          note: keys + values, shared
          col: 0
          row: 1
          tone: data
        - id: kvb
          label: KV head B
          note: keys + values, shared
          col: 4
          row: 1
          tone: data
        - id: cache
          label: KV cache
          note: stores A and B for every past token
          col: 2
          row: 2
          tone: accent
      edges:
        - from: kva
          to: q1
        - from: kva
          to: q2
        - from: kvb
          to: q3
        - from: kvb
          to: q4
        - from: cache
          to: kva
          label: per token
        - from: cache
          to: kvb
          label: per token
    bridges: []
  - id: shared-and-latent-kv.s3
    title: Cache a compressed latent instead
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.shared-and-latent-kv
    markdown: |-
      GQA saves memory by giving heads fewer distinct keys and values. DeepSeek-V2 (2024) took a different route: keep many full heads, but cache one short compressed vector per token, the **latent** (a learned code, not directly readable), and rebuild each head's keys and values from it. The method is called **multi-head latent attention (MLA)**.

      :::papers Multi-head latent attention (DeepSeek-V2)
      For hidden state $h_t$, one learned down-projection makes the latent, and learned up-projections rebuild each head's key and value:

      $$c_t = W^{DKV} h_t, \qquad k_t^{(i)} = W^{UK,(i)} c_t, \qquad v_t^{(i)} = W^{UV,(i)} c_t$$

      Only $c_t$ is cached. The trick that makes this cheap is associativity: a head's score is $q^{(i)\top} W^{UK,(i)} c_t = \big(W^{UK,(i)\top} q^{(i)}\big)^{\top} c_t$, so $W^{UK}$ can be folded into the query side and $W^{UV}$ into the output projection. The model scores against $c_t$ directly and never rebuilds full keys during decoding.
      :::

      Position needs special care. RoPE (rotary position embedding, from module 15's lesson on positions) rotates each key by an angle that depends on its position. That rotation would sit between the query and $W^{UK}$, and because it changes with every position, $W^{UK}$ can no longer be folded into the query once and for all. So MLA adds a small separate key that carries RoPE, shared by all heads, and caches that too.

      DeepSeek-V2's numbers: 128 heads of width 128, a latent of 512 numbers, and a RoPE key of 64 numbers. Per token per layer:

      | Design | Numbers cached per token per layer |
      | --- | ---: |
      | MHA, 128 heads × 128 | $2 \times 128 \times 128 = 32{,}768$ |
      | MLA | $512 + 64 = 576$ |

      That is about 57 times smaller. The paper notes it equals GQA with only 2.25 groups ($2 \times 2.25 \times 128 = 576$), and reports quality better than standard multi-head attention in its experiments.
    bridges: []
  - id: shared-and-latent-kv.s4
    title: Before you switch, count and budget
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.shared-and-latent-kv
    markdown: |-
      Suppose you must serve an existing multi-head model on GPUs that are already short of memory. Here is how the options play out.

      1. **Count first.** Use the formula with the model's real `kv_heads`, `head_dim`, and cache precision. A model card that says "64 heads" may still have 8 KV heads.
      2. **Converting costs training.** Sharing heads changes the model, so you can't just delete key/value heads from a trained checkpoint. Ainslie et al. converted multi-head checkpoints by averaging the key and value heads within each group, then continued training with about 5% of the original pre-training compute. The result came close to multi-head quality at close to multi-query speed. DeepSeek built MLA into the model from the start of training.
      3. **Weights don't shrink.** In our opening case, the 140 GB of weights is about 130 GiB. Going from MHA to GQA-8 cuts total memory from about 290 GiB (130 GiB of weights plus 160 GiB of cache) to about 150 GiB. That is a big win, but now the weights dominate, and halving the cache again saves far less.

      Cache savings also stack. An 8-bit cache halves every row of the table, and a sliding window (the previous lesson, on attention patterns) caps `seq_len` at the window size: Mistral 7B keeps a rolling buffer of the last 4,096 tokens.
    bridges: []
  - id: shared-and-latent-kv.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.shared-and-latent-kv
    markdown: Compute cache sizes for real model shapes, then decide what sharing heads or caching a latent would save a chatbot, a code assistant, and a memory-starved server.
    takeaway: |-
      KV cache = 2 × layers × KV heads × head width × tokens × bytes. GQA and MQA shrink it by sharing key/value heads across query heads; MLA caches a small latent and rebuilds keys and values from it.
  - id: shared-and-latent-kv.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.shared-and-latent-kv
    markdown: |-
      MQA and GQA reduce KV duplication by sharing heads. Latent attention compresses the representation itself. Count the actual cached arrays before claiming a memory saving.
