schema_version: 0.2-draft
lesson:
  id: shared-and-latent-kv
  version: 0.2.0-draft
  title: Reduce the state stored for attention keys and values
  state: draft
  summary: Compare sharing attention keys and values with storing a compressed representation of them.
  slot: M19.2
  category: learning
  sources:
  - title: Multi-query attention
    url: https://arxiv.org/abs/1911.02150
  - title: Grouped-query attention
    url: https://arxiv.org/abs/2305.13245
  - title: DeepSeek-V2
    url: https://arxiv.org/abs/2405.04434
objectives:
- id: objective.shared-and-latent-kv
  version: 1-draft
  statement: Multi-query and grouped-query attention share key/value heads, while latent attention compresses
    their representation; cache savings depend on exact dimensions and implementation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - shared-and-latent-kv.base
  - shared-and-latent-kv.transfer
  prerequisites:
  - anyOf:
    - objective.multi-head-attention
  - anyOf:
    - objective.cached-inference
scenes:
- id: shared-and-latent-kv.s1
  title: Query heads need not each own unique keys
  type: explanation
  depth: intuition
  objective_refs:
  - objective.shared-and-latent-kv
  markdown: 'Standard multi-head attention commonly has separate query, key, and value projections per head.
    Multi-query attention shares one key/value head across query heads. Grouped-query attention uses several
    key/value heads, each shared by a group of query heads, providing an intermediate design.


    KV means **keys and values**, the attention representations kept for reuse. **Multi-query attention (MQA)**
    shares one KV head. **Grouped-query attention (GQA)** shares each KV head among a group of query heads.
    The query heads still ask distinct learned numerical questions; sharing does not mean their outputs must
    be identical.'
  text_mode: 'Standard multi-head attention commonly has separate query, key, and value projections per head.
    Multi-query attention shares one key/value head across query heads. Grouped-query attention uses several
    key/value heads, each shared by a group of query heads, providing an intermediate design.


    KV means **keys and values**, the attention representations kept for reuse. **Multi-query attention (MQA)**
    shares one KV head. **Grouped-query attention (GQA)** shares each KV head among a group of query heads.
    The query heads still ask distinct learned numerical questions; sharing does not mean their outputs must
    be identical.'
  bridges: []
- id: shared-and-latent-kv.s2
  title: Count a simple cache change
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.shared-and-latent-kv
  markdown: 'Ignoring overhead and using equal head dimensions, eight query heads with eight key/value heads
    store four times the key/value elements of a two-key/value-head design for the same tokens and layers.
    Query heads still perform their computations. Cache reduction does not imply every model allocation shrinks
    by four.


    With 100 cached positions, head width 16 and one layer, eight KV heads store 2 × 100 × 8 × 16 = 25,600
    values. Two KV heads store 6,400. The leading 2 counts keys and values. Multiply by bytes per value for
    payload memory; weights and allocation overhead are separate.'
  text_mode: 'Ignoring overhead and using equal head dimensions, eight query heads with eight key/value heads
    store four times the key/value elements of a two-key/value-head design for the same tokens and layers.
    Query heads still perform their computations. Cache reduction does not imply every model allocation shrinks
    by four.


    With 100 cached positions, head width 16 and one layer, eight KV heads store 2 × 100 × 8 × 16 = 25,600
    values. Two KV heads store 6,400. The leading 2 counts keys and values. Multiply by bytes per value for
    payload memory; weights and allocation overhead are separate.'
  bridges: []
- id: shared-and-latent-kv.s3
  title: Compress into a learned latent state
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.shared-and-latent-kv
  markdown: 'Multi-head latent attention stores a compressed learned representation from which needed key/value
    information is used through projections and algebraic rearrangements. Positional components and absorbed
    matrices require specific handling. It is not merely another name for reducing the count of independent
    key/value heads.


    **Latent** means a learned internal representation. **Multi-head latent attention (MLA)** stores a smaller
    representation intended to support the needed key/value calculations. Unlike simply sharing heads, it changes
    how the information is represented and reconstructed or used algebraically. Check the actual cached dimensions,
    including positional state.'
  text_mode: 'Multi-head latent attention stores a compressed learned representation from which needed key/value
    information is used through projections and algebraic rearrangements. Positional components and absorbed
    matrices require specific handling. It is not merely another name for reducing the count of independent
    key/value heads.


    **Latent** means a learned internal representation. **Multi-head latent attention (MLA)** stores a smaller
    representation intended to support the needed key/value calculations. Unlike simply sharing heads, it changes
    how the information is represented and reconstructed or used algebraically. Check the actual cached dimensions,
    including positional state.'
  bridges: []
- id: shared-and-latent-kv.s4
  title: Check accuracy and actual cache layout
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.shared-and-latent-kv
  markdown: Sharing or compressing keys and values changes the parameterization and can require training or
    adaptation. Report stored tensor shapes, precision, position state, and kernel support. Compare latency
    and quality under representative sequence lengths rather than treating theoretical element savings as automatic
    end-to-end gains.
  text_mode: Sharing or compressing keys and values changes the parameterization and can require training or
