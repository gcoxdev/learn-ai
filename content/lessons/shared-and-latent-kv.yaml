assessment_families:
- id: shared-and-latent-kv.base
  objective_ref: objective.shared-and-latent-kv
  task: base
  response_type: single_choice
  points: 1
  hint: 'Count a simple cache change: trace the inputs, operation, and result before choosing.'
  remediation_scene: shared-and-latent-kv.s2
  variants:
  - id: shared-and-latent-kv.base.1
    prompt: What does grouped-query attention share?
    options:
    - id: a
      text: Key/value heads among groups of query heads
    - id: b
      text: All token IDs across languages
    - id: c
      text: One output token across every request
    answer: a
    feedback: Groups reuse key/value projections.
  - id: shared-and-latent-kv.base.2
    prompt: Eight KV heads become two with equal dimensions. Simplified KV element reduction?
    options:
    - id: b
      text: Twofold
    - id: c
      text: No reduction
    - id: a
      text: Fourfold
    answer: a
    feedback: The KV-head count falls by a factor of four.
- id: shared-and-latent-kv.transfer
  objective_ref: objective.shared-and-latent-kv
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Check accuracy and actual cache layout: trace the inputs, operation, and result before choosing.'
  remediation_scene: shared-and-latent-kv.s4
  variants:
  - id: shared-and-latent-kv.transfer.1
    prompt: Is latent attention just a different name for MQA?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if both cache tensors
    - id: a
      text: No; it uses a compressed latent parameterization
    answer: a
    feedback: Sharing head count and latent compression are distinct mechanisms.
  - id: shared-and-latent-kv.transfer.2
    prompt: Does a fourfold KV reduction imply fourfold total-memory reduction?
    options:
    - id: c
      text: Only for every batch
    - id: a
      text: No; weights and other allocations remain
    - id: b
      text: 'Yes'
    answer: a
    feedback: One allocation is only part of the budget.
