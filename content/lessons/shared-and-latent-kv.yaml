schema_version: 0.2-draft
lesson:
  id: shared-and-latent-kv
  version: 0.3.0-draft
  title: Reduce the state stored for attention keys and values
  state: draft
  summary: Compare sharing attention keys and values with storing a compressed representation of them.
  slot: M19.2
  category: learning
  sources:
  - title: Multi-query attention
    url: https://arxiv.org/abs/1911.02150
  - title: Grouped-query attention
    url: https://arxiv.org/abs/2305.13245
  - title: DeepSeek-V2
    url: https://arxiv.org/abs/2405.04434
objectives:
- id: objective.shared-and-latent-kv
  version: 1-draft
  statement: Multi-query and grouped-query attention share key/value heads, while latent attention compresses
    their representation; cache savings depend on exact dimensions and implementation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - shared-and-latent-kv.base
  - shared-and-latent-kv.transfer
  prerequisites:
  - anyOf:
    - objective.multi-head-attention
  - anyOf:
    - objective.cached-inference
scenes:
- id: shared-and-latent-kv.s1
  title: Let query heads share keys and values
  type: explanation
  depth: intuition
  objective_refs:
  - objective.shared-and-latent-kv
  markdown: '**KV** means the attention keys and values kept for reuse. Standard multi-head attention commonly
    gives each head its own query, key, and value projections.


    **Multi-query attention (MQA)** shares one KV head across all query heads. **Grouped-query attention (GQA)**
    uses several KV heads, each shared by a group of query heads. This offers an intermediate amount of sharing.
    The query projections remain distinct, so sharing keys and values does not make every head’s output identical.'
  text_mode: '**KV** means the attention keys and values kept for reuse. Standard multi-head attention commonly
    gives each head its own query, key, and value projections.


    **Multi-query attention (MQA)** shares one KV head across all query heads. **Grouped-query attention (GQA)**
    uses several KV heads, each shared by a group of query heads. This offers an intermediate amount of sharing.
    The query projections remain distinct, so sharing keys and values does not make every head’s output identical.'
  bridges: []
- id: shared-and-latent-kv.s2
  title: Count a simple cache change
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.shared-and-latent-kv
  markdown: 'Ignoring overhead and using equal head dimensions, eight query heads with eight key/value heads
    store four times the key/value elements of a two-key/value-head design for the same tokens and layers.
    Query heads still perform their computations. Cache reduction does not imply every model allocation shrinks
    by four.


    With 100 cached positions, head width 16 and one layer, eight KV heads store 2 × 100 × 8 × 16 = 25,600
    values. Two KV heads store 6,400. The leading 2 counts keys and values. Multiply by bytes per value for
    payload memory; weights and allocation overhead are separate.'
  text_mode: 'Ignoring overhead and using equal head dimensions, eight query heads with eight key/value heads
    store four times the key/value elements of a two-key/value-head design for the same tokens and layers.
    Query heads still perform their computations. Cache reduction does not imply every model allocation shrinks
    by four.


    With 100 cached positions, head width 16 and one layer, eight KV heads store 2 × 100 × 8 × 16 = 25,600
    values. Two KV heads store 6,400. The leading 2 counts keys and values. Multiply by bytes per value for
    payload memory; weights and allocation overhead are separate.'
  bridges: []
- id: shared-and-latent-kv.s3
  title: Store a compressed internal representation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.shared-and-latent-kv
  markdown: '**Multi-head latent attention (MLA)** stores a smaller learned representation that supports the
    required key/value calculations. **Latent** refers to that internal representation. This changes how the
    information is represented, rather than simply reducing the number of independent KV heads.


    Projections and algebraic rearrangements use the compressed state in attention. Positional components and
    any matrices folded into other operations require architecture-specific handling. To calculate cache size,
    inspect the actual stored dimensions, including positional state.'
  text_mode: '**Multi-head latent attention (MLA)** stores a smaller learned representation that supports the
    required key/value calculations. **Latent** refers to that internal representation. This changes how the
    information is represented, rather than simply reducing the number of independent KV heads.


    Projections and algebraic rearrangements use the compressed state in attention. Positional components and
    any matrices folded into other operations require architecture-specific handling. To calculate cache size,
    inspect the actual stored dimensions, including positional state.'
  bridges: []
- id: shared-and-latent-kv.s4
  title: Check accuracy and actual cache layout
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.shared-and-latent-kv
  markdown: Sharing or compressing keys and values changes the parameterization and can require training or
    adaptation. Report stored tensor shapes, precision, position state, and kernel support. Compare latency
    and quality under representative sequence lengths rather than treating theoretical element savings as automatic
    end-to-end gains.
  text_mode: Sharing or compressing keys and values changes the parameterization and can require training or
    adaptation. Report stored tensor shapes, precision, position state, and kernel support. Compare latency
    and quality under representative sequence lengths rather than treating theoretical element savings as automatic
    end-to-end gains.
  bridges: []
- id: shared-and-latent-kv.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.shared-and-latent-kv
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: MQA and GQA reduce KV duplication by sharing heads. Latent attention compresses the representation
    itself. Count the actual cached arrays before claiming a memory saving.
