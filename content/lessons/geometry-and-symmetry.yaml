schema_version: 0.2-draft
lesson:
  id: geometry-and-symmetry
  version: 0.4.0-draft
  title: Distances, neighborhoods, and transformations
  state: draft
  summary: Rotate a molecule and its energy shouldn't change, but its forces should turn with it. Pick the right distance for an embedding, then tell invariant from equivariant.
  slot: B23
  category: bridge
  sources:
    - title: Deep Learning — linear algebra
      url: https://www.deeplearningbook.org/contents/linear_algebra.html
objectives:
  - id: objective.geometry-and-symmetry
    version: 2-draft
    statement: Compute Euclidean distance and cosine similarity, explain how a flattened plot can distort neighborhoods, and decide whether an output should be invariant or equivariant to a rotation, translation, or reordering.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - geometry-and-symmetry.base.v2
      - geometry-and-symmetry.transfer.v2
      - geometry-and-symmetry.calculate
    prerequisites:
      - anyOf:
          - objective.vectors
scenes:
  - id: geometry-and-symmetry.s1
    title: Near by length, or near by direction?
    type: explanation
    depth: intuition
    objective_refs:
      - objective.geometry-and-symmetry
    markdown: |-
      A search app stores each document as a list of word counts. Document A mentions "goal" once; document B is a long article that mentions it ten times; document C is about something else entirely. Which is "closest" to A?

      **Why AI needs this:** embeddings turn words, images, and documents into vectors, and nearest-neighbor search, clustering, and retrieval all depend on the distance you choose. Equivariant networks for molecules and robots depend on knowing how outputs should react to rotations.

      Two standard choices, with A = [1, 0], B = [10, 0], C = [0, 1]:

      | Measure | A to B | A to C |
      | --- | ---: | ---: |
      | **Euclidean distance**, the straight-line length √(Δx² + Δy²) | 9 | √2 ≈ 1.41 |
      | **Cosine similarity**, cos of the angle between vectors (1 = same direction, 0 = at right angles) | 1 | 0 |

      By Euclidean distance, C is nearer to A. By cosine similarity, B points exactly the way A does. Neither is wrong. The question is whether length carries meaning: for word counts, a longer document is just longer, so direction is the better guide.

      To compute cosine similarity, divide the dot product by the two lengths: for A and B, (1 × 10 + 0 × 0) ÷ (1 × 10) = 1. And a quick distance check: from [0, 0] to [3, 4] is √(9 + 16) = 5.
    bridges:
      - vectors
  - id: geometry-and-symmetry.s2
    title: A flat map can tear neighbors apart
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.geometry-and-symmetry
    markdown: |-
      Imagine a runner on a circular track drawn on a map. A spot on the track needs only one number, the distance along it, even though the map uses two coordinates. A **manifold** is a space like this: simple and low-dimensional up close, even if it sits inside a bigger one. Embeddings of real data often lie near such curved sheets.

      **Topology** studies properties such as neighborhoods that survive stretching without cutting or gluing. Cutting the circle open into a line breaks that: positions just before and just after the cut are neighbors on the track, but sit at opposite ends of the line.

      :::mixup "Two points far apart in my 2D embedding plot are far apart in the original data."
      A plot squeezes many dimensions into two and must distort something. The lesson on nonlinear embeddings shows clusters that appear or split because of the squeeze. Check a few neighbors in the original space before trusting a gap in the picture.
      :::
    bridges:
      - vectors
  - id: geometry-and-symmetry.s3
    title: Invariant stays put, equivariant follows
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.geometry-and-symmetry
    markdown: |-
      Take three points forming a triangle with corners at [0, 0], [4, 0], and [0, 3]. Turn it 90 degrees counterclockwise about the origin.

      - Its side lengths (4, 3, 5) don't change. A quantity that stays the same under a transformation is **invariant**.
      - Its center (the average of the corners) moves from [1.33, 1] to [−1, 1.33], exactly where rotating the old center sends it. An output that transforms the same way as the input is **equivariant**.

      Three common transformations: **translation** shifts every point by the same amount, **rotation** turns them about a center, and **permutation** reorders the items, such as renaming graph nodes.

      :::predict A model reads a molecule's atom positions. If you rotate the whole molecule, should its predicted energy change? Should its predicted force on each atom?
      The energy shouldn't change: it's invariant to rotation. Each force is a vector with a direction, so it should rotate with the molecule: equivariant. Predicting forces that stayed fixed would point the wrong way.
      :::

      ```python run
      import numpy as np

      def rotate(points, degrees):
          t = np.radians(degrees)
          R = np.array([[np.cos(t), -np.sin(t)],
                        [np.sin(t),  np.cos(t)]])
          return points @ R.T                      # rotate every row (point)

      def spread(points):                          # invariant: sum of pairwise distances
          d = points[:, None, :] - points[None, :, :]
          return np.sqrt((d ** 2).sum(-1)).sum() / 2

      def center(points):                          # equivariant: moves with the points
          return points.mean(axis=0)

      pts = np.array([[0.0, 0.0], [4.0, 0.0], [0.0, 3.0]])
      turned = rotate(pts, 90)
      print("spread before:", round(spread(pts), 3), " after:", round(spread(turned), 3))
      print("center before:", np.round(center(pts), 3))
      print("center after: ", np.round(center(turned), 3))
      print("rotate the old center:", np.round(rotate(center(pts)[None, :], 90)[0], 3))
      ```

      The spread stays 12.0 (4 + 3 + 5), while the center changes yet matches the rotated old center. Change 90 to 30 and look again.
    bridges: []
  - id: geometry-and-symmetry.s4
    title: Decide the symmetry before the model
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.geometry-and-symmetry
    markdown: |-
      For any task, ask what change the answer should ignore (invariance) and what change it should follow (equivariance):

      | Task | Transformation | Output should be |
      | --- | --- | --- |
      | Is this photo a cat? | Shift the cat in the frame | Invariant |
      | Where is the cat's bounding box? | Shift the cat in the frame | Equivariant: the box moves too |
      | Molecule energy | Rotate the molecule | Invariant |
      | Forces on atoms | Rotate the molecule | Equivariant |
      | Graph's class label | Rename (reorder) the nodes | Invariant |

      Convolutions give image features that are equivariant to shifts (as in the convolution lesson), and pooling or a final classifier can then make the label invariant. Models for molecules (the lesson on equivariant scientific learning) build rotation behavior into their layers instead of hoping the network learns it from augmented data. Robots do the same with coordinate frames, as in the lesson on robot sensors and frames.

      A guarantee for one transformation says nothing about the others: a model built to ignore shifts can still change its answer under rotation.
    bridges: []
  - id: geometry-and-symmetry.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.geometry-and-symmetry
    markdown: Choose a distance for search, spot a distorted map, and decide whether a bounding box, a class label, and a force vector should be invariant or equivariant.
    takeaway: |-
      Pick a distance that matches what the numbers mean, and don't trust a 2D plot's gaps. An invariant output stays put when the input is transformed; an equivariant output transforms along with it.
  - id: geometry-and-symmetry.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.geometry-and-symmetry
    markdown: |-
      Choose distances and neighborhoods that fit the objects. Invariance preserves an output under a transformation; equivariance makes the output follow that transformation.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - geometry-and-symmetry.s1
        - geometry-and-symmetry.s2
        - geometry-and-symmetry.s3
        - geometry-and-symmetry.s4
        - geometry-and-symmetry.check
      gate_refs:
        - gate.core
  scene_aliases:
    geometry-and-symmetry.recap: geometry-and-symmetry.check
assessment_families:
  - id: geometry-and-symmetry.base
    objective_ref: objective.geometry-and-symmetry
    task: base
    response_type: single_choice
    points: 1
    hint: Ask whether length carries meaning (Euclidean) or only direction (cosine), and whether a flattened plot kept the original neighbors.
    remediation_scene: geometry-and-symmetry.s2
    variants:
      - id: geometry-and-symmetry.base.1
        prompt: What is Euclidean distance from [0, 0] to [6, 8]?
        options:
          - id: c
            text: '100'
          - id: a
            text: '10'
          - id: b
            text: '14'
        answer: a
        feedback: The squared distance is 36 + 64 = 100, so distance is 10.
        retired: true
      - id: geometry-and-symmetry.base.2
        prompt: A classification label stays unchanged under image translation. What behavior is intended?
        options:
          - id: a
            text: Translation invariance
          - id: b
            text: Translation equivariance of coordinates
          - id: c
            text: No defined transformation property
        answer: a
        feedback: The output label is intended to remain the same.
        retired: true
  - id: geometry-and-symmetry.transfer
    objective_ref: objective.geometry-and-symmetry
    task: transfer
    response_type: single_choice
    points: 1
    hint: Transform the input and ask whether the output should stay the same (invariant) or transform with it (equivariant).
    remediation_scene: geometry-and-symmetry.s4
    variants:
      - id: geometry-and-symmetry.transfer.1
        prompt: A detector’s bounding box should move when the object moves. Which property describes that relationship?
        options:
          - id: a
            text: Equivariance
          - id: b
            text: An unchanged coordinate output
          - id: c
            text: Randomness
        answer: a
        feedback: The output geometry should transform with the input.
        retired: true
      - id: geometry-and-symmetry.transfer.2
        prompt: A 2D embedding separates two points widely. Must they be far apart in the original space?
        options:
          - id: b
            text: Yes; every projection preserves every distance
          - id: c
            text: Yes; two dimensions are always sufficient
          - id: a
            text: No; the visualization can distort geometry
        answer: a
        feedback: Dimensionality reduction does not generally preserve all geometric relationships.
        retired: true
  - id: geometry-and-symmetry.base.v2
    objective_ref: objective.geometry-and-symmetry
    task: base
    response_type: single_choice
    points: 1
    hint: "Invariant: the output stays the same after the transformation. Equivariant: the output is transformed in the same way as the input."
    remediation_scene: geometry-and-symmetry.s3
    variants:
      - id: geometry-and-symmetry.base.v2.1
        prompt: A pose model outputs the pixel position of a person's nose. The photo is shifted 20 pixels right. What should happen to the output?
        options:
          - id: b
            text: It should stay the same, since the person is unchanged
          - id: c
            text: It should become random, since the picture changed
          - id: a
            text: It should move 20 pixels right, following the input
        answer: a
        feedback: A position should move with the image, which is equivariance. Staying the same would be invariance, right for a label like "person" but wrong for a coordinate.
      - id: geometry-and-symmetry.base.v2.2
        prompt: A classifier answers "triangle" for a shape, and still "triangle" after the shape is rotated. Which property does this show?
        options:
          - id: a
            text: Rotation invariance of the label
          - id: b
            text: Rotation equivariance of the label
          - id: c
            text: Translation equivariance of the label
        answer: a
        feedback: The output didn't change when the input was rotated, which is invariance. Equivariance would mean the output itself rotates along with the input, which a label can't do.
      - id: geometry-and-symmetry.base.v2.3
        prompt: Document A is [2, 0] and document B is [6, 0]. Compared with C = [0, 5], which statement is right?
        options:
          - id: c
            text: Cosine similarity says B is closer to C than to A
          - id: a
            text: Cosine similarity rates A and B as identical in direction
          - id: b
            text: Euclidean distance rates A and B as identical
        answer: a
        feedback: A and B point the same way, so their cosine similarity is 1 even though B is longer. Euclidean distance between them is 4, so it doesn't rate them identical.
      - id: geometry-and-symmetry.base.v2.4
        prompt: A graph model must give the same class to a molecule graph whatever order its atoms are listed in. What kind of change is the reordering, and what should the label do?
        options:
          - id: b
            text: A rotation, and the label should rotate too
          - id: c
            text: A translation, and the label should shift too
          - id: a
            text: A permutation, and the label should stay the same
        answer: a
        feedback: Renaming or reordering items is a permutation, and a graph-level label should be invariant to it. Rotation and translation move points in space, which isn't what reordering does.
      - id: geometry-and-symmetry.base.v2.5
        prompt: A circular track is drawn on a map, and a runner's position is described by one number, the distance along the track. Why can that be a good description?
        options:
          - id: a
            text: The track is a curve that needs one coordinate nearby
          - id: b
            text: The map secretly uses only one coordinate for every point
          - id: c
            text: The track has no neighborhoods, so distances don't matter
        answer: a
        feedback: "A curve embedded in a plane is a one-dimensional manifold: locally one number suffices. The map still has two coordinates, and nearby positions on the track are real neighborhoods."
  - id: geometry-and-symmetry.transfer.v2
    objective_ref: objective.geometry-and-symmetry
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name the object, the transformation, and the output, then decide whether the output should stay the same or move with the input.
    remediation_scene: geometry-and-symmetry.s4
    variants:
      - id: geometry-and-symmetry.transfer.v2.1
        prompt: A self-driving car's lane detector outputs the lane line's position in the image. The camera tilts a few degrees. What is the right behavior?
        options:
          - id: c
            text: Invariant, with the line position unchanged by the tilt
          - id: a
            text: Equivariant, with the line's position tilting with the image
          - id: b
            text: Neither, since tilts are too small for geometry to matter
        answer: a
        feedback: The line's coordinates should follow the image, which is equivariance. Keeping them fixed would put the line in the wrong place, and small tilts still change coordinates.
      - id: geometry-and-symmetry.transfer.v2.2
        prompt: 'A retrieval system finds documents "near" a query. Short and long documents on the same topic score as far apart under Euclidean distance. What is a sensible fix?'
        options:
          - id: b
            text: Delete the long documents so every vector has a similar length
          - id: a
            text: Compare with cosine similarity, which ignores vector length
          - id: c
            text: Switch to a 2D plot and judge the distances by eye
        answer: a
        feedback: Cosine similarity compares direction, so a longer document on the same topic still points the same way. Deleting documents throws away data, and a 2D plot adds distortion.
      - id: geometry-and-symmetry.transfer.v2.3
        prompt: A 2D plot of embeddings shows two clusters far apart. A teammate wants to conclude the two groups of items are very different. What should you do first?
        options:
          - id: c
            text: Trust the plot, since two dimensions are enough for any data
          - id: b
            text: Rerun the plot until the clusters stop moving
          - id: a
            text: Check distances between those items in the original space
        answer: a
        feedback: The 2D squeeze can pull apart neighbors or push groups together. Original-space distances are the reference. Rerunning only checks stability of the plot, not whether it matches the data.
      - id: geometry-and-symmetry.transfer.v2.4
        prompt: A model predicts a protein's total energy and the force on each atom. Which pairing of behaviors under rotating the structure is right?
        options:
          - id: b
            text: Energy equivariant, forces invariant
          - id: a
            text: Energy invariant, forces equivariant
          - id: c
            text: Both invariant, since the protein is unchanged
        answer: a
        feedback: Energy is one number that doesn't depend on orientation, so it's invariant. Forces are vectors pointing in physical directions, so they turn with the structure. Both invariant would give forces pointing the wrong way.
  - id: geometry-and-symmetry.calculate
    objective_ref: objective.geometry-and-symmetry
    task: base
    response_type: numeric
    points: 1
    hint: "Euclidean distance is √(Δx² + Δy²). Cosine similarity is the dot product divided by the two lengths."
    remediation_scene: geometry-and-symmetry.s1
    absolute_tolerance: 0.01
    variants:
      - id: geometry-and-symmetry.calculate.1
        prompt: What is the Euclidean distance from [0, 0] to [6, 8]?
        answer: 10
        feedback: 36 + 64 = 100, and the square root is 10.
      - id: geometry-and-symmetry.calculate.2
        prompt: What is the Euclidean distance from [1, 1] to [4, 5]?
        answer: 5
        feedback: The differences are 3 and 4, so √(9 + 16) = 5.
      - id: geometry-and-symmetry.calculate.3
        prompt: What is the Euclidean distance from [2, 3] to [5, 7]?
        answer: 5
        feedback: The differences are 3 and 4, so the distance is √(9 + 16) = 5.
      - id: geometry-and-symmetry.calculate.4
        prompt: What is the cosine similarity of [3, 0] and [0, 5]?
        answer: 0
        feedback: The dot product is 3 × 0 + 0 × 5 = 0, so the cosine is 0. The vectors are at right angles.
      - id: geometry-and-symmetry.calculate.5
        prompt: What is the cosine similarity of [1, 2] and [2, 4]? (They point the same way.)
        answer: 1
        feedback: The dot product is 2 + 8 = 10, and the lengths are √5 and √20, which multiply to 10, so the cosine is 1. The longer vector is the same direction at double the length.
