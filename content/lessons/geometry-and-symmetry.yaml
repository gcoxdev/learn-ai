schema_version: 0.2-draft
lesson:
  id: geometry-and-symmetry
  version: 0.1.0-draft
  title: Distances, neighborhoods, and transformations
  state: draft
  summary: Geometry supplies distances and directions; topology describes continuity and neighborhoods, while invariance
    and equivariance specify how outputs respond to transformations.
  slot: B23
  category: bridge
  minutes: 12
  sources:
  - title: Deep Learning — linear algebra
    url: https://www.deeplearningbook.org/contents/linear_algebra.html
objectives:
- id: objective.geometry-and-symmetry
  version: 1-draft
  statement: Geometry supplies distances and directions; topology describes continuity and neighborhoods, while
    invariance and equivariance specify how outputs respond to transformations.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - geometry-and-symmetry.base
  - geometry-and-symmetry.transfer
  prerequisites:
  - anyOf:
