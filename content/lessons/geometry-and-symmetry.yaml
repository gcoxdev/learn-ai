scenes:
- id: geometry-and-symmetry.s1
  title: Choose a distance that fits the object
  type: explanation
  depth: intuition
  objective_refs:
  - objective.geometry-and-symmetry
  markdown: Euclidean distance is straight-line distance in coordinate space. Between [0, 0] and [3, 4] it is 5,
    from the square root of 3² + 4². Cosine similarity instead compares directions after accounting for lengths.
    Different measures can produce different nearest neighbors, so a geometric choice is an assumption.
  text_mode: Euclidean distance is straight-line distance in coordinate space. Between [0, 0] and [3, 4] it is 5,
    from the square root of 3² + 4². Cosine similarity instead compares directions after accounting for lengths.
    Different measures can produce different nearest neighbors, so a geometric choice is an assumption.
  bridges: []
- id: geometry-and-symmetry.s2
  title: Local neighborhoods need not fill the whole space
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.geometry-and-symmetry
  markdown: A circle can be embedded in a two-dimensional plane but is locally described by one position along its
    circumference. A manifold generalizes this idea of locally simpler coordinates. A neighborhood contains nearby
    points under a chosen topology. A learned two-dimensional plot can distort neighborhoods and distances from
    the original data.
  text_mode: A circle can be embedded in a two-dimensional plane but is locally described by one position along
    its circumference. A manifold generalizes this idea of locally simpler coordinates. A neighborhood contains
    nearby points under a chosen topology. A learned two-dimensional plot can distort neighborhoods and distances
    from the original data.
  bridges:
  - vectors
- id: geometry-and-symmetry.s3
  title: Distinguish invariant from equivariant
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.geometry-and-symmetry
  markdown: 'An invariant output stays the same under a specified transformation: a shape label might remain “triangle”
    after rotation. An equivariant output transforms correspondingly: predicted corner coordinates should rotate
    with the input. Translation, rotation, and permutation are different transformations; a guarantee for one does
    not establish the others.'
  text_mode: 'An invariant output stays the same under a specified transformation: a shape label might remain “triangle”
    after rotation. An equivariant output transforms correspondingly: predicted corner coordinates should rotate
    with the input. Translation, rotation, and permutation are different transformations; a guarantee for one does
    not establish the others.'
  bridges: []
- id: geometry-and-symmetry.s4
  title: Connect the geometry to an AI task
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.geometry-and-symmetry
  markdown: Molecular energy should not change merely because the coordinate frame rotates, while predicted force
    vectors should rotate. Curvature describes how a space bends and can affect local approximations. State the
    object, coordinates, distance, transformation group, and desired output behavior before claiming a model respects
    the relevant geometry.
  text_mode: Molecular energy should not change merely because the coordinate frame rotates, while predicted force
    vectors should rotate. Curvature describes how a space bends and can affect local approximations. State the
    object, coordinates, distance, transformation group, and desired output behavior before claiming a model respects
    the relevant geometry.
  bridges: []
