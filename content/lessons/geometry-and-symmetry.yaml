assessment_families:
- id: geometry-and-symmetry.base
  objective_ref: objective.geometry-and-symmetry
  task: base
  response_type: single_choice
  points: 1
  hint: 'Local neighborhoods need not fill the whole space: trace the inputs, operation, and result before
    choosing.'
  remediation_scene: geometry-and-symmetry.s2
  variants:
  - id: geometry-and-symmetry.base.1
    prompt: What is Euclidean distance from [0, 0] to [6, 8]?
    options:
    - id: c
      text: '100'
    - id: a
      text: '10'
    - id: b
      text: '14'
    answer: a
    feedback: The squared distance is 36 + 64 = 100, so distance is 10.
  - id: geometry-and-symmetry.base.2
    prompt: A classification label stays unchanged under image translation. What behavior is intended?
    options:
    - id: a
      text: Translation invariance
    - id: b
      text: Translation equivariance of coordinates
    - id: c
      text: No defined transformation property
    answer: a
    feedback: The output label is intended to remain the same.
- id: geometry-and-symmetry.transfer
  objective_ref: objective.geometry-and-symmetry
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Connect the geometry to an AI task: trace the inputs, operation, and result before choosing.'
  remediation_scene: geometry-and-symmetry.s4
  variants:
  - id: geometry-and-symmetry.transfer.1
    prompt: A detector’s bounding box should move when the object moves. Which property describes that relationship?
    options:
    - id: a
      text: Equivariance
    - id: b
      text: An unchanged coordinate output
    - id: c
      text: Randomness
    answer: a
    feedback: The output geometry should transform with the input.
  - id: geometry-and-symmetry.transfer.2
    prompt: A 2D embedding separates two points widely. Must they be far apart in the original space?
    options:
    - id: b
      text: Yes; every projection preserves every distance
    - id: c
      text: Yes; two dimensions are always sufficient
    - id: a
      text: No; the visualization can distort geometry
    answer: a
    feedback: Dimensionality reduction does not generally preserve all geometric relationships.
