lesson:
  id: geometry-and-symmetry
  version: 0.3.0-draft
  title: Distances, neighborhoods, and transformations
  state: draft
  summary: Choose distances and transformations that match the meaning of the task.
  slot: B23
  category: bridge
  sources:
