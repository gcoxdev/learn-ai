    url: https://www.deeplearningbook.org/contents/linear_algebra.html
objectives:
- id: objective.geometry-and-symmetry
  version: 1-draft
  statement: Geometry supplies distances and directions; topology describes continuity and neighborhoods, while
    invariance and equivariance specify how outputs respond to transformations.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - geometry-and-symmetry.base
  - geometry-and-symmetry.transfer
  prerequisites:
  - anyOf:
    - objective.vectors
scenes:
- id: geometry-and-symmetry.s1
  title: Choose a distance that fits the object
  type: explanation
  depth: intuition
  objective_refs:
  - objective.geometry-and-symmetry
  markdown: Euclidean distance is straight-line distance in coordinate space. Between [0, 0] and [3, 4] it
    is 5, from the square root of 3² + 4². Cosine similarity instead compares directions after accounting for
    lengths. Different measures can produce different nearest neighbors, so a geometric choice is an assumption.
  text_mode: Euclidean distance is straight-line distance in coordinate space. Between [0, 0] and [3, 4] it
    is 5, from the square root of 3² + 4². Cosine similarity instead compares directions after accounting for
    lengths. Different measures can produce different nearest neighbors, so a geometric choice is an assumption.
  bridges: []
- id: geometry-and-symmetry.s2
  title: Local neighborhoods need not fill the whole space
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.geometry-and-symmetry
  markdown: 'Imagine walking along a circular track drawn on a two-coordinate map. A nearby position on the
    track can be described with one small distance along it, even though the surrounding plane uses two coordinates.


    A **manifold** generalizes this idea: a space can have simpler local coordinates than the larger space
    containing it. **Topology** studies properties such as neighborhoods and connectedness that can survive
    continuous stretching without cutting or gluing.


    Flattening a space into a plot can distort these relationships. Cutting the circle into a line makes positions
    on opposite sides of the cut look far apart, even though they were neighbors on the track. Inspect that
    distortion before treating a learned plot as a faithful map.'
  text_mode: 'Imagine walking along a circular track drawn on a two-coordinate map. A nearby position on the
    track can be described with one small distance along it, even though the surrounding plane uses two coordinates.


    A **manifold** generalizes this idea: a space can have simpler local coordinates than the larger space
    containing it. **Topology** studies properties such as neighborhoods and connectedness that can survive
    continuous stretching without cutting or gluing.


    Flattening a space into a plot can distort these relationships. Cutting the circle into a line makes positions
    on opposite sides of the cut look far apart, even though they were neighbors on the track. Inspect that
    distortion before treating a learned plot as a faithful map.'
  bridges:
  - vectors
- id: geometry-and-symmetry.s3
  title: Distinguish invariant from equivariant
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.geometry-and-symmetry
  markdown: 'An invariant output stays the same under a specified transformation: a shape label might remain
    “triangle” after rotation. An equivariant output transforms correspondingly: predicted corner coordinates
    should rotate with the input. Translation, rotation, and permutation are different transformations; a guarantee
    for one does not establish the others.


    Translation means shifting every point by the same displacement. Rotation turns the points around a chosen
    center. Permutation changes the order of entries, such as renaming graph nodes. Ask which change your task
    should ignore and which change its output should follow.'
  text_mode: 'An invariant output stays the same under a specified transformation: a shape label might remain
    “triangle” after rotation. An equivariant output transforms correspondingly: predicted corner coordinates
    should rotate with the input. Translation, rotation, and permutation are different transformations; a guarantee
    for one does not establish the others.


    Translation means shifting every point by the same displacement. Rotation turns the points around a chosen
    center. Permutation changes the order of entries, such as renaming graph nodes. Ask which change your task
    should ignore and which change its output should follow.'
  bridges: []
- id: geometry-and-symmetry.s4
  title: Connect the geometry to an AI task
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.geometry-and-symmetry
  markdown: Molecular energy should not change merely because the coordinate frame rotates, while predicted
    force vectors should rotate. Curvature describes how a space bends and can affect local approximations.
    State the object, coordinates, distance, transformation group, and desired output behavior before claiming
    a model respects the relevant geometry.
  text_mode: Molecular energy should not change merely because the coordinate frame rotates, while predicted
    force vectors should rotate. Curvature describes how a space bends and can affect local approximations.
    State the object, coordinates, distance, transformation group, and desired output behavior before claiming
    a model respects the relevant geometry.
  bridges: []
- id: geometry-and-symmetry.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
