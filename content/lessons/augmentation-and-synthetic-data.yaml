schema_version: 0.2-draft
lesson:
  id: augmentation-and-synthetic-data
  version: 0.3.0-draft
  title: Create more examples without inventing evidence
  state: draft
  summary: Create useful practice examples while keeping the answers valid and the test independent.
  slot: M03.7
  category: learning
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: Datasheets for Datasets
    url: https://arxiv.org/abs/1803.09010
objectives:
- id: objective.augmentation-and-synthetic-data
  version: 1-draft
  statement: Augmentation and synthetic data alter the training distribution; their usefulness depends on label
    validity, diversity, provenance, and evaluation on independent target data.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - augmentation-and-synthetic-data.base
  - augmentation-and-synthetic-data.transfer
  prerequisites:
  - anyOf:
    - objective.data-cleaning
  - anyOf:
    - objective.sampling-and-shift
scenes:
- id: augmentation-and-synthetic-data.s1
  title: Change an example while keeping its answer valid
  type: explanation
  depth: intuition
  objective_refs:
  - objective.augmentation-and-synthetic-data
  markdown: '**Augmentation** creates a changed version of an existing example. Shifting a picture of a circle
    slightly may leave its label correct. Cropping the circle out does not. Rotating a handwritten 6 into a
    9 can also change the answer.


    When we want the answer to stay the same under a particular change, we call that **invariance**. Each augmentation
    makes such an assumption about the task. Check the assumption before copying the original label to the
    changed example.'
  text_mode: '**Augmentation** creates a changed version of an existing example. Shifting a picture of a circle
    slightly may leave its label correct. Cropping the circle out does not. Rotating a handwritten 6 into a
    9 can also change the answer.


    When we want the answer to stay the same under a particular change, we call that **invariance**. Each augmentation
    makes such an assumption about the task. Check the assumption before copying the original label to the
    changed example.'
  bridges: []
- id: augmentation-and-synthetic-data.s2
  title: Create new examples for a reason
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.augmentation-and-synthetic-data
  markdown: '**Synthetic data** is produced artificially. For example, a program can draw new circles instead
    of collecting photographs. A simulator or generative model can also supply examples that are expensive
    to collect or uncommon in an existing dataset.


    Record how the examples were made: the generator, its inputs and settings, and any filtering. Generated
    data can contain errors, repetition, or patterns inherited from its source. Decide what the extra examples
    should help the model learn.'
  text_mode: '**Synthetic data** is produced artificially. For example, a program can draw new circles instead
    of collecting photographs. A simulator or generative model can also supply examples that are expensive
    to collect or uncommon in an existing dataset.


    Record how the examples were made: the generator, its inputs and settings, and any filtering. Generated
    data can contain errors, repetition, or patterns inherited from its source. Decide what the extra examples
    should help the model learn.'
  bridges: []
- id: augmentation-and-synthetic-data.s3
  title: Trace a feedback loop
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.augmentation-and-synthetic-data
  markdown: A recommender shows mostly one category, then collects clicks mainly within that category. Training
    on those clicks can reinforce the initial exposure pattern. Similarly, repeatedly training on model-generated
    text can narrow diversity if selection and coverage are not managed. The generated dataset is shaped by
    the system that produced it.
  text_mode: A recommender shows mostly one category, then collects clicks mainly within that category. Training
    on those clicks can reinforce the initial exposure pattern. Similarly, repeatedly training on model-generated
    text can narrow diversity if selection and coverage are not managed. The generated dataset is shaped by
    the system that produced it.
  bridges: []
- id: augmentation-and-synthetic-data.s4
  title: Test whether the extra examples help
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.augmentation-and-synthetic-data
  markdown: 'Split the original examples before creating variants. Ten crops of one photograph are ten training
    inputs, but they still come from one photograph. If some crops enter training and others enter a test meant
    to contain new images, the test may be too familiar.


    Compare a model trained with the extra examples against the same training setup without them. Evaluate
    on separately collected target examples that did not guide generation or selection. Check rare cases and
    label correctness as well as the average score. The useful question is whether the extra data improves
    the intended task.'
  text_mode: 'Split the original examples before creating variants. Ten crops of one photograph are ten training
    inputs, but they still come from one photograph. If some crops enter training and others enter a test meant
    to contain new images, the test may be too familiar.


    Compare a model trained with the extra examples against the same training setup without them. Evaluate
    on separately collected target examples that did not guide generation or selection. Check rare cases and
    label correctness as well as the average score. The useful question is whether the extra data improves
    the intended task.'
  bridges: []
- id: augmentation-and-synthetic-data.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.augmentation-and-synthetic-data
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Extra training examples help when they preserve the right answers and add useful variety. Test
    their value on independent examples from the setting you care about.
- id: augmentation-and-synthetic-data.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.augmentation-and-synthetic-data
  markdown: Extra training examples help when they preserve the right answers and add useful variety. Test
    their value on independent examples from the setting you care about.
  text_mode: Extra training examples help when they preserve the right answers and add useful variety. Test
