assessment_families:
- id: augmentation-and-synthetic-data.base
  objective_ref: objective.augmentation-and-synthetic-data
  task: base
  response_type: single_choice
  points: 1
  hint: 'Synthetic data needs a purpose: trace the inputs, operation, and result before choosing.'
  remediation_scene: augmentation-and-synthetic-data.s2
  variants:
  - id: augmentation-and-synthetic-data.base.1
    prompt: What assumption usually supports label-preserving augmentation?
    options:
    - id: a
      text: The transformation keeps the target meaning valid
    - id: b
      text: Every transformation is harmless
    - id: c
      text: More rows always improve generalization
    answer: a
    feedback: Augmentation must match the task’s intended invariances.
  - id: augmentation-and-synthetic-data.base.2
    prompt: Can a synthetic example carry an incorrect label?
    options:
    - id: b
      text: No; generated data is correct by definition
    - id: c
      text: Only when saved as text
    - id: a
      text: Yes; generation and annotation can fail
    answer: a
    feedback: Synthetic origin does not certify validity.
- id: augmentation-and-synthetic-data.transfer
  objective_ref: objective.augmentation-and-synthetic-data
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Judge usefulness on independent data: trace the inputs, operation, and result before choosing.'
  remediation_scene: augmentation-and-synthetic-data.s4
  variants:
  - id: augmentation-and-synthetic-data.transfer.1
    prompt: A recommender trains on clicks from its own narrow exposure policy. What can happen?
    options:
    - id: b
      text: The data becomes automatically unbiased
    - id: c
      text: All unseen interests become fully observed
    - id: a
      text: The policy’s selection pattern can reinforce itself
    answer: a
    feedback: Feedback data reflects what users were allowed to see.
  - id: augmentation-and-synthetic-data.transfer.2
    prompt: Where should the benefit of synthetic training data be checked?
    options:
    - id: c
      text: Only the total row count
    - id: a
      text: Independent representative target evaluation
    - id: b
      text: Only the generator’s own preferred examples
    answer: a
    feedback: Independent target data tests whether the added examples help the intended task.
