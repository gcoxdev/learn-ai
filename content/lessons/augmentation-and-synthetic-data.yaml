schema_version: 0.2-draft
lesson:
  id: augmentation-and-synthetic-data
  version: 0.1.0-draft
  title: Create more examples without inventing evidence
  state: draft
  summary: Augmentation and synthetic data alter the training distribution; their usefulness depends on label validity,
    diversity, provenance, and evaluation on independent target data.
  slot: M03.7
  category: learning
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: Datasheets for Datasets
    url: https://arxiv.org/abs/1803.09010
objectives:
- id: objective.augmentation-and-synthetic-data
  version: 1-draft
  statement: Augmentation and synthetic data alter the training distribution; their usefulness depends on label
    validity, diversity, provenance, and evaluation on independent target data.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - augmentation-and-synthetic-data.base
  - augmentation-and-synthetic-data.transfer
  prerequisites:
  - anyOf:
    - objective.data-cleaning
  - anyOf:
    - objective.sampling-and-shift
scenes:
- id: augmentation-and-synthetic-data.s1
  title: An augmentation encodes an assumption
  type: explanation
  depth: intuition
  objective_refs:
  - objective.augmentation-and-synthetic-data
  markdown: Cropping, color changes, or small translations can create training variants. The assumption is that
    the target label remains appropriate after the transformation. Rotating a handwritten 6 into a 9 can violate
    that assumption. Different tasks require different invariances.
  text_mode: Cropping, color changes, or small translations can create training variants. The assumption is that
    the target label remains appropriate after the transformation. Rotating a handwritten 6 into a 9 can violate
    that assumption. Different tasks require different invariances.
  bridges: []
- id: augmentation-and-synthetic-data.s2
  title: Synthetic data needs a purpose
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.augmentation-and-synthetic-data
  markdown: A simulator or generative model can create examples where collection is expensive or a rare case matters.
    Keep the generator, prompts or parameters, filtering rules, and source lineage. Generated examples may contain
    errors, repetitive patterns, or biases inherited from their creator.
  text_mode: A simulator or generative model can create examples where collection is expensive or a rare case matters.
    Keep the generator, prompts or parameters, filtering rules, and source lineage. Generated examples may contain
    errors, repetitive patterns, or biases inherited from their creator.
  bridges: []
- id: augmentation-and-synthetic-data.s3
  title: Trace a feedback loop
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.augmentation-and-synthetic-data
  markdown: A recommender shows mostly one category, then collects clicks mainly within that category. Training
    on those clicks can reinforce the initial exposure pattern. Similarly, repeatedly training on model-generated
    text can narrow diversity if selection and coverage are not managed. The generated dataset is shaped by the
    system that produced it.
  text_mode: A recommender shows mostly one category, then collects clicks mainly within that category. Training
    on those clicks can reinforce the initial exposure pattern. Similarly, repeatedly training on model-generated
    text can narrow diversity if selection and coverage are not managed. The generated dataset is shaped by the
    system that produced it.
  bridges: []
- id: augmentation-and-synthetic-data.s4
  title: Judge usefulness on independent data
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.augmentation-and-synthetic-data
  markdown: Compare a baseline with and without the augmentation or synthetic mixture while holding other conditions
    stable. Evaluate on real target examples that did not guide generation or selection. Inspect rare cases and
    label correctness, not only the total number of training rows. More examples can amplify the wrong signal.
  text_mode: Compare a baseline with and without the augmentation or synthetic mixture while holding other conditions
    stable. Evaluate on real target examples that did not guide generation or selection. Inspect rare cases and
    label correctness, not only the total number of training rows. More examples can amplify the wrong signal.
  bridges: []
- id: augmentation-and-synthetic-data.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.augmentation-and-synthetic-data
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Augmentation and synthetic data alter the training distribution; their usefulness depends on label validity,
