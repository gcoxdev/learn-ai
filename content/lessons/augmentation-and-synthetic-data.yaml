schema_version: 0.2-draft
lesson:
  id: augmentation-and-synthetic-data
  version: 0.4.0-draft
  title: Create more examples without inventing evidence
  state: draft
  summary: Flip a photo of a cat and it's still a cat. Flip a "turn left" sign and it's a different sign. Learn when made-up examples help a model, and when they quietly teach it lies.
  slot: M03.7
  category: learning
  sources:
    - title: Dive into Deep Learning — image augmentation
      url: https://d2l.ai/chapter_computer-vision/image-augmentation.html
    - title: Datasheets for Datasets
      url: https://arxiv.org/abs/1803.09010
    - title: "AI models collapse when trained on recursively generated data (Shumailov et al., 2024)"
      url: https://www.nature.com/articles/s41586-024-07566-y
objectives:
  - id: objective.augmentation-and-synthetic-data
    version: 3-draft
    statement: Augmentation and synthetic data alter the training distribution; their usefulness depends on label validity, diversity, provenance, and evaluation on independent target data.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - augmentation-and-synthetic-data.base.v2
      - augmentation-and-synthetic-data.transfer.v2
    prerequisites:
      - anyOf:
          - objective.data-cleaning
      - anyOf:
          - objective.sampling-and-shift
scenes:
  - id: augmentation-and-synthetic-data.s1
    title: Some changes keep the answer, some flip it
    type: explanation
    depth: intuition
    objective_refs:
      - objective.augmentation-and-synthetic-data
    markdown: |-
      You have 2,000 photos for a road-sign reader and wish you had 20,000. One cheap trick: make new training examples by changing the ones you have. Brighten a photo, shift it a few pixels, zoom in slightly. Each changed copy keeps the original's label. Making extra training examples this way is called **data augmentation**.

      It works only when the change really keeps the answer the same. When a label stays correct under a change, we say the task is **invariant** to that change. Which changes are safe depends entirely on the task:

      | Change | Cat photos | Handwritten digits | Road signs |
      | --- | --- | --- | --- |
      | Shift a few pixels | Safe | Safe | Safe |
      | Brighter or darker | Safe | Safe | Safe |
      | Mirror left–right | Safe | Breaks: a mirrored 2 isn't a digit | Breaks: "turn left" becomes "turn right" |
      | Turn upside down | Odd but still a cat | Breaks: 6 becomes 9 | Breaks: a left arrow now points right |

      Run this to watch a 6 survive a shift and turn into a 9:

      ```python run
      six = [
          ".###..",
          "#.....",
          "#.....",
          "####..",
          "#...#.",
          "#...#.",
          ".###..",
      ]

      def shift_right(img):            # move every pixel one column right
          return ["." + row[:-1] for row in img]

      def rotate_180(img):             # turn the picture upside down
          return [row[::-1] for row in img[::-1]]

      versions = {"original": six, "shifted": shift_right(six), "rotated 180": rotate_180(six)}
      print("   ".join(f"{name:12}" for name in versions))
      for r in range(len(six)):
          print("   ".join(f"{img[r]:12}" for img in versions.values()))
      ```

      The shifted copy is still clearly a 6. The rotated copy is a 9, and if it keeps the label "6," you've just taught the model a mistake. Try adding a `mirror` function that reverses each row, and decide whether its output still deserves the label.

      :::predict A reader for road signs is trained with random left–right mirroring. What mistake will it make on the road?
      It will confuse "turn left" with "turn right" (and "no left turn" with "no right turn"), because training showed it left-pointing arrows labeled as both. The augmentation erased exactly the detail the task depends on.
      :::
  - id: augmentation-and-synthetic-data.s2
    title: Examples made from scratch
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.augmentation-and-synthetic-data
    markdown: |-
      Augmentation changes real examples. **Synthetic data** is made from scratch: a program draws road signs in different fonts and weather, a driving simulator stages a child running between parked cars, or a language model writes 1,000 made-up customer questions. It's most valuable for cases that are rare, dangerous, or expensive to collect for real. You can't wait for enough real near-accidents; you can simulate them.

      Synthetic examples come with two built-in risks. They look slightly unlike reality: simulated snow is too clean, generated questions too polite. And their labels are only as right as the program that made them. So give every synthetic batch the same ingredient card as real data: which generator, which settings, which filters, and how many examples a person checked.

      :::mixup "Synthetic data is clean, so it avoids the biases of real data."
      A generator carries its makers' choices and its own training data's habits. If the language model writing customer questions has only seen polite English, every synthetic question will be polite English. Synthetic data can fill a gap you know about; it can also paper over one you don't.
      :::
  - id: augmentation-and-synthetic-data.s3
    title: When a model feeds on its own output
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.augmentation-and-synthetic-data
    markdown: |-
      A news app shows each reader mostly sports, because sports got clicks last month. This month's clicks are then mostly on sports too; that's what was on screen. Retrain on those clicks, and the recommender grows even surer that readers want sports. Nobody ever learns whether they'd have clicked on science, because science was never shown. This is a **feedback loop**: the model's own choices shape the data used to train its next version.

      The same trap appears with generated text. In a 2024 *Nature* paper, Shumailov and colleagues trained language models generation after generation, each on text written by the one before. The rare, unusual parts of the original data faded first, and after enough rounds the output became repetitive and wrong, an effect they called **model collapse**.

      The fix in both cases is fresh outside evidence: show a small, varied slice of articles to see what readers really choose, and keep training data anchored in real human-written text.
  - id: augmentation-and-synthetic-data.s4
    title: Prove the extra examples earn their place
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.augmentation-and-synthetic-data
    markdown: |-
      Two rules make the test honest.

      **Split first, then augment.** Ten crops of one photo are ten training inputs, but they're still one photo. If some crops land in training and others in test, the test is full of pictures the model has nearly seen. Split the original photos, then augment only the training side.

      **Compare against the same setup without the extra data, on real examples.** Suppose a warehouse robot must spot dropped boxes. The team has 500 real photos and renders 5,000 synthetic ones. On 200 real photos held out from a different warehouse, they score three versions:

      | Trained on | Accuracy on real held-out photos |
      | --- | ---: |
      | 500 real | 82% |
      | 500 real + 5,000 synthetic | 88% |
      | 5,000 synthetic only | 61% |

      The synthetic photos help as a supplement: 82% rises to 88%. On their own they fall to 61%, because rendered boxes don't look quite like real ones. The team keeps the mix. They also check the rare cases they generated synthetic data for, such as boxes in shadow, since an average can hide whether those improved. Had the mix scored 82% or less, they'd drop the synthetic photos, however many there were.
  - id: augmentation-and-synthetic-data.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.augmentation-and-synthetic-data
    markdown: Road signs, skin photos, voice commands, and a news feed ask whether extra examples keep the right answer and whether they really help.
    takeaway: |-
      An augmentation is safe only if the change keeps the label true for this task. Synthetic and augmented data earn their place only when they beat the same setup without them, on real examples kept apart from the start.
  - id: augmentation-and-synthetic-data.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.augmentation-and-synthetic-data
    markdown: |-
      Extra training examples help when they preserve the right answers and add useful variety. Test their value on independent examples from the setting you care about.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - augmentation-and-synthetic-data.s1
        - augmentation-and-synthetic-data.s2
        - augmentation-and-synthetic-data.s3
        - augmentation-and-synthetic-data.s4
        - augmentation-and-synthetic-data.check
      gate_refs:
        - gate.core
  scene_aliases:
    augmentation-and-synthetic-data.recap: augmentation-and-synthetic-data.check
assessment_families:
  - id: augmentation-and-synthetic-data.base
    objective_ref: objective.augmentation-and-synthetic-data
    task: base
    response_type: single_choice
    points: 1
    hint: 'Synthetic data needs a purpose: trace the inputs, operation, and result before choosing.'
    remediation_scene: augmentation-and-synthetic-data.s2
    variants:
      - id: augmentation-and-synthetic-data.base.1
        prompt: What assumption usually supports label-preserving augmentation?
        options:
          - id: a
            text: The transformation keeps the target meaning valid
          - id: b
            text: Every transformation is harmless
          - id: c
            text: More rows always improve generalization
        answer: a
        feedback: Augmentation must match the task’s intended invariances.
        retired: true
      - id: augmentation-and-synthetic-data.base.2
        prompt: Can a synthetic example carry an incorrect label?
        options:
          - id: b
            text: No; generated data is correct by definition
          - id: c
            text: Only when saved as text
          - id: a
            text: Yes; generation and annotation can fail
        answer: a
        feedback: Synthetic origin does not certify validity.
        retired: true
  - id: augmentation-and-synthetic-data.transfer
    objective_ref: objective.augmentation-and-synthetic-data
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Judge usefulness on independent data: trace the inputs, operation, and result before choosing.'
    remediation_scene: augmentation-and-synthetic-data.s4
    variants:
      - id: augmentation-and-synthetic-data.transfer.1
        prompt: A recommender trains on clicks from its own narrow exposure policy. What can happen?
        options:
          - id: b
            text: The data becomes automatically unbiased
          - id: c
            text: All unseen interests become fully observed
          - id: a
            text: The policy’s selection pattern can reinforce itself
        answer: a
        feedback: Feedback data reflects what users were allowed to see.
        retired: true
      - id: augmentation-and-synthetic-data.transfer.2
        prompt: Where should the benefit of synthetic training data be checked?
        options:
          - id: c
            text: Only the total row count
          - id: a
            text: Independent representative target evaluation
          - id: b
            text: Only the generator’s own preferred examples
        answer: a
        feedback: Independent target data tests whether the added examples help the intended task.
        retired: true
  - id: augmentation-and-synthetic-data.base.v2
    objective_ref: objective.augmentation-and-synthetic-data
    task: base
    response_type: single_choice
    points: 1
    hint: Apply the change in your head and ask whether the original label is still true. Then ask whether any copy of one original could end up on both sides of the split.
    remediation_scene: augmentation-and-synthetic-data.s1
    variants:
      - id: augmentation-and-synthetic-data.base.v2.1
        prompt: A road-sign reader needs more training photos. Which augmentation keeps every label correct?
        options:
          - id: b
            text: Mirroring each photo left to right
          - id: a
            text: Making each photo a little brighter or darker
          - id: c
            text: Turning each photo upside down
        answer: a
        feedback: A darker or brighter sign is still the same sign. Mirroring turns "turn left" into "turn right," and turning a sign upside down isn't something the reader will meet on the road.
        retired: true
      - id: augmentation-and-synthetic-data.base.v2.2
        prompt: A handwritten-digit reader is trained with every image randomly rotated anywhere up to 180 degrees, keeping the original labels. Which mistake should you expect?
        options:
          - id: c
            text: It struggles with slightly tilted digits, since it saw too few of them
          - id: b
            text: It learns more slowly but ends up equally accurate on every digit
          - id: a
            text: It confuses 6 with 9, since upside-down 6s were labeled "6"
        answer: a
        feedback: A 6 rotated 180 degrees is a 9, so the training set now shows 9-shaped images labeled "6." Small tilts were well covered by the rotations; the damage is concentrated on digits that turn into each other.
      - id: augmentation-and-synthetic-data.base.v2.3
        prompt: A team makes 10 crops of each of 1,000 photos, then randomly splits the 10,000 crops into training and test sets. What's wrong?
        options:
          - id: a
            text: Crops of one photo land on both sides, so the test is too easy
          - id: b
            text: Crops are smaller than the originals, so the test is too hard
          - id: c
            text: Ten crops per photo is too many; three would be enough
        answer: a
        feedback: Crops of one photo share almost everything, so a test crop's siblings in training give the answer away. Split the 1,000 originals first, then crop only the training side. The number of crops isn't the problem.
      - id: augmentation-and-synthetic-data.base.v2.4
        prompt: A team uses a language model to write 5,000 made-up customer questions for training a support bot. What should they expect about these questions?
        options:
          - id: b
            text: They will cover more situations than real questions, since the generator knows everything
          - id: c
            text: They will be free of bias, since no real customers were involved
          - id: a
            text: They will carry the generator's habits and errors, so some need checking
        answer: a
        feedback: Generated text reflects the generator's own training and style, such as always being polite, and its labels can be wrong. That's why a sample should be checked by a person. A generator doesn't know everything, and it brings its own biases rather than none.
      - id: augmentation-and-synthetic-data.base.v2.5
        prompt: A parking app reads street-name signs and needs more training photos. Which change to the photos keeps every label correct?
        options:
          - id: a
            text: Mirroring each photo left to right
          - id: c
            text: Shifting each photo a few pixels
          - id: b
            text: Turning each photo upside down
        answer: c
        feedback: A small shift leaves the letters readable and the street name unchanged. A mirror image writes every letter backward, and an upside-down sign is text the app will never meet, so both teach it to read signs that don't exist.
  - id: augmentation-and-synthetic-data.transfer.v2
    objective_ref: objective.augmentation-and-synthetic-data
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what the task actually depends on (color, direction, sound, what users choose) and whether the extra data protects that detail and gets tested on real examples.
    remediation_scene: augmentation-and-synthetic-data.s4
    variants:
      - id: augmentation-and-synthetic-data.transfer.v2.1
        prompt: A skin-condition model is trained with strong random color changes, turning reddish patches green or blue. Why is that risky here?
        options:
          - id: c
            text: Color changes make the photos harder to store and load
          - id: a
            text: Color helps tell conditions apart, so labels may stop fitting
          - id: b
            text: Color changes are too mild to add any real variety
        answer: a
        feedback: Redness can be part of what a doctor looks for, so a green version may no longer deserve the same label. Mild brightness changes might be fine; strong hue swaps erase a clue the task depends on.
      - id: augmentation-and-synthetic-data.transfer.v2.2
        prompt: A voice-command model will be used in busy cafés. Which augmentation best fits the task?
        options:
          - id: b
            text: Playing each recording backward to double the data
          - id: c
            text: Speeding each recording up to three times its pace
          - id: a
            text: Mixing café background noise into clean recordings
        answer: a
        feedback: Background noise leaves the spoken words, and so the label, unchanged while adding the conditions the model will face. Reversed or triple-speed speech no longer sounds like the command, so the label stops fitting.
      - id: augmentation-and-synthetic-data.transfer.v2.3
        prompt: A drone team has 400 real aerial photos and 8,000 simulated ones. What's the best way to decide whether the simulated photos help?
        options:
          - id: a
            text: Train with and without them, and compare on held-out real photos
          - id: b
            text: Check the model's accuracy on a held-out set of simulated photos
          - id: c
            text: Keep them if the combined model scores higher on training data
        answer: a
        feedback: The question is whether the simulated photos improve performance in the real world, so compare otherwise identical setups on real photos kept apart from the start. Simulated test photos share the simulator's look, and training accuracy mostly measures memorization.
      - id: augmentation-and-synthetic-data.transfer.v2.4
        prompt: A video app recommends mostly cooking videos because they got clicks, then retrains on the clicks from what it showed. Which change best breaks this feedback loop?
        options:
          - id: c
            text: Retrain more often on the same clicks, so it adapts faster
          - id: b
            text: Drop the categories with few clicks to make the feed cleaner
          - id: a
            text: Show a small, varied slice of other videos and record the clicks
        answer: a
        feedback: The app only learns about what it shows, so it needs outside evidence about the videos it has been hiding. Retraining faster on the same clicks tightens the loop, and dropping low-click categories makes it permanent.
