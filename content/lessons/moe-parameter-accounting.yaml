schema_version: 0.2-draft
lesson:
  id: moe-parameter-accounting
  version: 0.1.0-draft
  title: Count total capacity and active work separately
  state: draft
  summary: Total parameters describe stored model capacity, while activated parameters approximate the subset used
    per token; neither alone determines memory, FLOPs, latency, or quality.
  slot: M18.4
  category: learning
  minutes: 12
  sources:
  - title: Sparsely-Gated Mixture-of-Experts
    url: https://arxiv.org/abs/1701.06538
  - title: Switch Transformers
    url: https://arxiv.org/abs/2101.03961
objectives:
- id: objective.moe-parameter-accounting
  version: 1-draft
  statement: Total parameters describe stored model capacity, while activated parameters approximate the subset
    used per token; neither alone determines memory, FLOPs, latency, or quality.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - moe-parameter-accounting.base
  - moe-parameter-accounting.transfer
  prerequisites:
  - anyOf:
    - objective.expert-dispatch-and-combine
  - anyOf:
    - objective.training-memory
scenes:
- id: moe-parameter-accounting.s1
  title: Count shared and expert parameters
  type: explanation
  depth: intuition
  objective_refs:
  - objective.moe-parameter-accounting
  markdown: Suppose a toy model has 10 million shared parameters and four experts of 5 million each in one sparse
    block. Total parameters are 10 + 4×5 = 30 million. Under top-one routing, roughly 15 million participate for
    a token, ignoring small routing details in this simplified count.
  text_mode: Suppose a toy model has 10 million shared parameters and four experts of 5 million each in one sparse
    block. Total parameters are 10 + 4×5 = 30 million. Under top-one routing, roughly 15 million participate for
    a token, ignoring small routing details in this simplified count.
  bridges: []
- id: moe-parameter-accounting.s2
  title: Account for all resident weights
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.moe-parameter-accounting
  markdown: Choosing one expert per token does not eliminate the others from the model artifact. Serving arbitrary
    routes may require all experts resident across devices or a slower loading strategy. Active parameter count
    therefore cannot be used alone as the model’s weight-memory requirement.
  text_mode: Choosing one expert per token does not eliminate the others from the model artifact. Serving arbitrary
    routes may require all experts resident across devices or a slower loading strategy. Active parameter count
    therefore cannot be used alone as the model’s weight-memory requirement.
  bridges: []
- id: moe-parameter-accounting.s3
  title: Parameters are not FLOPs
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.moe-parameter-accounting
  markdown: Different operations reuse parameters different numbers of times, and attention cost depends on context.
    Router work, communication, shared computation, batching, and expert dimensions affect actual operations and
    runtime. Two models with the same active parameter count can have different latency and throughput.
  text_mode: Different operations reuse parameters different numbers of times, and attention cost depends on context.
    Router work, communication, shared computation, batching, and expert dimensions affect actual operations and
    runtime. Two models with the same active parameter count can have different latency and throughput.
  bridges: []
- id: moe-parameter-accounting.s4
  title: Compare on a declared budget
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.moe-parameter-accounting
  markdown: Specify whether a comparison fixes total capacity, active arithmetic, hardware memory, training compute,
    or serving cost. Evaluate quality under the same task protocol. A sparse model may offer more stored capacity
    at a chosen compute budget, but the benefit is an empirical systems result.
  text_mode: Specify whether a comparison fixes total capacity, active arithmetic, hardware memory, training compute,
    or serving cost. Evaluate quality under the same task protocol. A sparse model may offer more stored capacity
    at a chosen compute budget, but the benefit is an empirical systems result.
  bridges: []
- id: moe-parameter-accounting.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.moe-parameter-accounting
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: moe-parameter-accounting.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.moe-parameter-accounting
  markdown: Total parameters describe stored model capacity, while activated parameters approximate the subset used
    per token; neither alone determines memory, FLOPs, latency, or quality.
  text_mode: Total parameters describe stored model capacity, while activated parameters approximate the subset
    used per token; neither alone determines memory, FLOPs, latency, or quality.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - moe-parameter-accounting.s1
    - moe-parameter-accounting.s2
