assessment_families:
- id: moe-parameter-accounting.base
  objective_ref: objective.moe-parameter-accounting
  task: base
  response_type: single_choice
  points: 1
  hint: 'Account for all resident weights: trace the inputs, operation, and result before choosing.'
  remediation_scene: moe-parameter-accounting.s2
  variants:
  - id: moe-parameter-accounting.base.1
    prompt: 10 million shared plus four 5-million experts gives total parameters?
    options:
    - id: b
      text: 15 million
    - id: c
      text: 20 million
    - id: a
      text: 30 million
    answer: a
    feedback: Total includes every expert plus shared parameters.
  - id: moe-parameter-accounting.base.2
    prompt: In that toy top-one model, approximate active parameters per token?
    options:
    - id: c
      text: 5 million
    - id: a
      text: 15 million
    - id: b
      text: 30 million
    answer: a
    feedback: The selected expert and shared computation both participate.
- id: moe-parameter-accounting.transfer
  objective_ref: objective.moe-parameter-accounting
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Compare on a declared budget: trace the inputs, operation, and result before choosing.'
  remediation_scene: moe-parameter-accounting.s4
  variants:
  - id: moe-parameter-accounting.transfer.1
    prompt: Can active parameter count alone size all weight storage?
    options:
    - id: c
      text: Only if routing is learned
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Unselected experts still belong to the artifact.
  - id: moe-parameter-accounting.transfer.2
    prompt: Two MoEs have equal active counts. Must latency match?
    options:
    - id: a
      text: No; hardware, routing, shapes, and communication differ
    - id: b
      text: 'Yes'
    - id: c
      text: Only total count can change speed
    answer: a
    feedback: Parameter counts are incomplete runtime descriptions.
