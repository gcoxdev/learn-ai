schema_version: 0.2-draft
lesson:
  id: matrices-tensors
  version: 0.2.0-draft
  title: Follow shapes through a numerical layer
  state: draft
  summary: Use small number tables to calculate several predictions at once, keeping track of what each row and
    column means.
  slot: B07
  category: bridge
  sources:
  - title: Dive into Deep Learning — linear algebra
    url: https://d2l.ai/chapter_preliminaries/linear-algebra.html
  archetype: foundation
objectives:
- id: objective.matrices-tensors
  version: 2-draft
  statement: Trace a two-feature matrix product with bias and determine the output shape of a batch.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - matrices-tensors.base.v2
  - matrices-tensors.transfer.v2
  prerequisites:
  - anyOf:
    - objective.vectors
  - anyOf:
    - objective.algebra-notation
scenes:
- id: matrices-tensors.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.matrices-tensors
  title: A vector is a list; a matrix is a table
  markdown: 'A **vector** is an ordered list of numbers. An input vector [distance, stops] might be [2, 1]. A **matrix**
    is a rectangular table of numbers. Suppose two trips form the rows of X: the first row is [2, 1] and the second
    is [1, 3]. X has two rows and two columns. Its **shape** is written (2, 2). In this example, rows identify trips
    and columns identify features. The word shape describes sizes; it does not tell you those meanings by itself.'
  text_mode: 'A **vector** is an ordered list of numbers. An input vector [distance, stops] might be [2, 1]. A **matrix**
    is a rectangular table of numbers. Suppose two trips form the rows of X: the first row is [2, 1] and the second
    is [1, 3]. X has two rows and two columns. Its **shape** is written (2, 2). In this example, rows identify trips
    and columns identify features. The word shape describes sizes; it does not tell you those meanings by itself.'
  bridges: []
- id: matrices-tensors.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.matrices-tensors
  title: Read dimensions before multiplying
  markdown: Imagine producing two different estimates from each trip. Let the weight table W have rows [2, 1] and
    [3, −1]. The first row contains the contributions from distance; the second contains the contributions from
    stops. Each column belongs to one output. X has two features per trip, and W has two feature rows, so those
    dimensions match. With the row-vector convention used here, the product XW has one row per trip and one column
    per output. A different book may use a transposed convention.
  text_mode: Imagine producing two different estimates from each trip. Let the weight table W have rows [2, 1] and
    [3, −1]. The first row contains the contributions from distance; the second contains the contributions from
    stops. Each column belongs to one output. X has two features per trip, and W has two feature rows, so those
    dimensions match. With the row-vector convention used here, the product XW has one row per trip and one column
    per output. A different book may use a transposed convention.
  bridges:
  - vectors
  - algebra-notation
- id: matrices-tensors.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.matrices-tensors
  title: Calculate one output at a time
  markdown: 'For the first input [2, 1], calculate output one using W’s first column [2, 3]: 2 × 2 + 1 × 3 = 7.
    Calculate output two with the second column [1, −1]: 2 × 1 + 1 × (−1) = 1. The output row is [7, 1]. This row-times-column
    calculation is a **dot product**. It combines matching contributions and adds them. Matrix multiplication is
    many dot products arranged in a table; it is not multiplication of corresponding cells alone.'
  text_mode: 'For the first input [2, 1], calculate output one using W’s first column [2, 3]: 2 × 2 + 1 × 3 = 7.
    Calculate output two with the second column [1, −1]: 2 × 1 + 1 × (−1) = 1. The output row is [7, 1]. This row-times-column
    calculation is a **dot product**. It combines matching contributions and adds them. Matrix multiplication is
    many dot products arranged in a table; it is not multiplication of corresponding cells alone.'
  bridges: []
- id: matrices-tensors.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.matrices-tensors
  title: Add a bias and repeat for another example
  markdown: A **bias vector** adds one fixed number to each output column. For bias [1, 2], the first result becomes
    [8, 3]. The second trip [1, 3] produces [1 × 2 + 3 × 3, 1 × 1 + 3 × (−1)] = [11, −2] before bias, then [12,
    0] after bias. Thus Y = XW + b has rows [8, 3] and [12, 0]. Adding the same bias vector to every row is an example
    of **broadcasting**, an agreed rule for reusing smaller-shaped data.
  text_mode: A **bias vector** adds one fixed number to each output column. For bias [1, 2], the first result becomes
    [8, 3]. The second trip [1, 3] produces [1 × 2 + 3 × 3, 1 × 1 + 3 × (−1)] = [11, −2] before bias, then [12,
    0] after bias. Thus Y = XW + b has rows [8, 3] and [12, 0]. Adding the same bias vector to every row is an example
    of **broadcasting**, an agreed rule for reusing smaller-shaped data.
  bridges: []
- id: matrices-tensors.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.matrices-tensors
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: A matrix product pairs matching entries, multiplies them, and adds the contributions. Shapes tell you
    which operations fit; axis meanings tell you whether they make sense.
- id: matrices-tensors.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.matrices-tensors
  markdown: Matrix multiplication combines matching dimensions; tensor shapes, transposes, and broadcasting describe
    how numerical data is organized and transformed.
  text_mode: Matrix multiplication combines matching dimensions; tensor shapes, transposes, and broadcasting describe
    how numerical data is organized and transformed.
- id: matrices-tensors.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.matrices-tensors
  title: Generalize the shape without hiding the meanings
  markdown: 'A **batch** is a group of examples processed together. If X has shape (5, 2) and W has shape (2, 3),
    Y has shape (5, 3): five examples, three outputs each. The matching 2 counts features; it is not an output size.
    There are 15 values in Y. A **tensor** generalizes these arrays to more axes. An image batch may use axes for
    example, height, width, and color channel. Write labels beside sizes so a height of three cannot accidentally
    be treated as three color channels.'
  text_mode: 'A **batch** is a group of examples processed together. If X has shape (5, 2) and W has shape (2, 3),
    Y has shape (5, 3): five examples, three outputs each. The matching 2 counts features; it is not an output size.
    There are 15 values in Y. A **tensor** generalizes these arrays to more axes. An image batch may use axes for
    example, height, width, and color channel. Write labels beside sizes so a height of three cannot accidentally
    be treated as three color channels.'
  bridges: []
- id: matrices-tensors.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.matrices-tensors
  title: Changing the layout is not changing the information
  markdown: 'A **transpose** swaps matrix rows and columns. Transposing a (2, 3) matrix gives shape (3, 2); it does
    not learn new values. The term rank is overloaded: tensor rank sometimes means the number of axes, while matrix
    rank measures independent rows or columns. Check the author’s convention. A calculation can have compatible
    shapes and still pair the wrong features with weights. Test one named example by hand, then compare it with
    the batched result. That catches mistakes a shape check alone cannot.'
  text_mode: 'A **transpose** swaps matrix rows and columns. Transposing a (2, 3) matrix gives shape (3, 2); it
    does not learn new values. The term rank is overloaded: tensor rank sometimes means the number of axes, while
    matrix rank measures independent rows or columns. Check the author’s convention. A calculation can have compatible
    shapes and still pair the wrong features with weights. Test one named example by hand, then compare it with
    the batched result. That catches mistakes a shape check alone cannot.'
  bridges: []
