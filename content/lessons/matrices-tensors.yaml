  version: 0.1.0-draft
  title: Follow shapes through a numerical layer
  state: draft
  summary: Matrix multiplication combines matching dimensions; tensor shapes, transposes, and broadcasting describe
    how numerical data is organized and transformed.
  slot: B07
  category: bridge
  minutes: 12
  sources:
