lesson:
  id: matrices-tensors
  version: 0.3.0-draft
  title: Follow shapes through a numerical layer
  state: draft
  summary: Nearly every layer in a neural network computes XW + b. Work one out by hand for two songs, then learn the shape rule that catches most bugs before they happen.
  slot: B07
  category: bridge
  sources:
    - title: Dive into Deep Learning — linear algebra
      url: https://d2l.ai/chapter_preliminaries/linear-algebra.html
  archetype: foundation
objectives:
  - id: objective.matrices-tensors
    version: 3-draft
    statement: Compute an entry of XW + b by hand, predict the shape of a matrix product, and explain why XW and WX usually differ.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
