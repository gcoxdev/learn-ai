assessment_families:
- id: matrices-tensors.base
  objective_ref: objective.matrices-tensors
  task: base
  response_type: single_choice
  points: 1
  hint: 'Multiply matching dimensions: trace the inputs, operation, and result before choosing.'
  remediation_scene: matrices-tensors.s2
  variants:
  - id: matrices-tensors.base.1
    prompt: What is the output shape of (5 × 3) times (3 × 2)?
    options:
    - id: b
      text: 3 × 3
    - id: c
      text: 5 × 3 × 2
    - id: a
      text: 5 × 2
    answer: a
    feedback: The inner dimensions match and are summed over; the outer dimensions remain.
  - id: matrices-tensors.base.2
    prompt: What is [1, 3] multiplied by column [2, 4]?
    options:
    - id: c
      text: '10'
    - id: a
      text: '14'
    - id: b
      text: '[2, 12]'
    answer: a
    feedback: 'Matrix multiplication sums matching products: 2 + 12 = 14.'
- id: matrices-tensors.transfer
  objective_ref: objective.matrices-tensors
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Transpose and rank answer different questions: trace the inputs, operation, and result before choosing.'
  remediation_scene: matrices-tensors.s4
  variants:
  - id: matrices-tensors.transfer.1
    prompt: A batch has 8 examples with 6 features. A layer produces 4 features per example. What weight shape fits
      row-oriented batches?
    options:
    - id: c
      text: 4 × 8
    - id: a
      text: 6 × 4
    - id: b
      text: 8 × 4
    answer: a
    feedback: The input-feature dimension contracts with the first weight dimension.
  - id: matrices-tensors.transfer.2
    prompt: A 2 × 5 matrix is transposed. What changes?
    options:
    - id: a
      text: Its shape becomes 5 × 2
    - id: b
      text: Its values are sorted
    - id: c
      text: Its rank must become 5
    answer: a
    feedback: Transpose swaps axes; it does not sort entries or force full rank.
