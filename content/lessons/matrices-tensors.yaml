scenes:
  - id: matrices-tensors.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.matrices-tensors
    title: A matrix is a table of vectors
    markdown: |-
      A music app wants two scores for every song: how good it is for a party, and how good it is for focusing. It describes each song by two features, [beat, vocals]. Song 1 is [2, 1]; song 2 is [1, 3].

      **Why AI needs this:** a neural-network layer computes Y = XW + b (W is a table of weights, b a list of offsets, both explained below), and attention compares every word with every other word in one big multiplication. Once you can do one by hand, those formulas stop being mysterious.

      Stack the songs as rows and you get a **matrix**, a rectangular table of numbers:

      $$X = \begin{bmatrix} 2 & 1 \\ 1 & 3 \end{bmatrix}$$

      Its **shape** is (rows, columns) = (2, 2). Here rows are songs and columns are features. The shape tells you the sizes; you have to remember what each axis means.
    bridges: []
  - id: matrices-tensors.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.matrices-tensors
    title: Read the shapes before you multiply
    markdown: |-
      The **weight matrix** W says how each feature feeds each score. Row 1 is beat's effect on [party, focus], and row 2 is vocals' effect:

      $$W = \begin{bmatrix} 2 & 1 \\ 3 & -1 \end{bmatrix}$$

      So party = 2·beat + 3·vocals, and focus = 1·beat − 1·vocals (vocals distract). Each *column* of W produces one output.

      The shape rule: (n, **k**) times (**k**, m) gives (n, m). The inner sizes must match, and they get used up; the outer sizes survive.

      | X | W | XW |
      | --- | --- | --- |
      | (2, 2): songs × features | (2, 2): features × scores | (2, 2): songs × scores |
      | (5, 2) | (2, 3) | (5, 3) |
      | (5, 2) | (3, 2) | error: 2 ≠ 3 |

      Books differ in layout. The batch lesson "Trace an example through a batch" puts examples in rows and writes XW + b; "Inside an artificial neuron" uses one column vector x and writes Wx + b. Same arithmetic, transposed.
    bridges:
      - vectors
      - algebra-notation
  - id: matrices-tensors.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.matrices-tensors
    title: Each entry is one dot product
    markdown: |-
      Entry (row i, column j) of XW is the dot product of row i of X with column j of W. For song 1, [2, 1]:

      1. **Party** uses W's first column, [2, 3]: 2 × 2 + 1 × 3 = 7.
      2. **Focus** uses W's second column, [1, −1]: 2 × 1 + 1 × (−1) = 1.

      Song 1's row of XW is [7, 1]. A matrix product is just many dot products arranged in a table.

      :::predict Before reading on, work out song 2's row, using [1, 3] and the same two columns.
      Party: 1 × 2 + 3 × 3 = 11. Focus: 1 × 1 + 3 × (−1) = −2. So song 2's row is [11, −2]: plenty of vocals makes it a party song and a poor focus song.
      :::
    bridges: []
  - id: matrices-tensors.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.matrices-tensors
    title: Add the bias to every row
    markdown: |-
      A **bias** vector adds one fixed number to each output column. With b = [1, 2], every song's party score gets +1 and focus score gets +2:

      | Song | XW | + b | Y = XW + b |
      | --- | --- | --- | --- |
      | 1 | [7, 1] | [1, 2] | [8, 3] |
      | 2 | [11, −2] | [1, 2] | [12, 0] |

      b has shape (2,), but XW has two rows. Array libraries copy b onto every row for you. That automatic copying is called **broadcasting**.
    bridges: []
  - id: matrices-tensors.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.matrices-tensors
    title: Batches and tensors are the same idea, bigger
    markdown: |-
      A **batch** is a group of examples processed together. With 5 songs, X is (5, 2); with W still (2, 3) for three scores, Y is (5, 3): 15 numbers, one row per song. The shared 2 counts features, and it disappears.

      A **tensor** is the same kind of array with any number of axes. A batch of color images often has four: (images, height, width, color channels). Label every axis, so a height of 3 is never mistaken for 3 color channels.

      :::predict In attention, a sentence of 10 tokens gives a query matrix Q of shape (10, 64) and a key matrix K of the same shape. What is the shape of QKᵀ, where Kᵀ is K flipped to (64, 10)?
      (10, 64) times (64, 10) gives (10, 10): one score for every pair of tokens. The 64 inner numbers are used up in each dot product. You'll meet this in "Attention: queries, keys, and values."
      :::
    bridges: []
  - id: matrices-tensors.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.matrices-tensors
    title: Order matters, and so does the transpose
    markdown: |-
      The **transpose** of a matrix, written with a small T, swaps its rows and columns: a (2, 3) matrix becomes (3, 2). The numbers are the same, just laid out the other way.

      :::mixup "XW and WX are the same, like 2 × 3 and 3 × 2."
      Order matters for matrices. With our songs, XW = [[7, 1], [11, −2]] but WX = [[5, 5], [5, 0]]. Often the swapped product isn't even allowed: (5, 2) times (2, 3) works, but (2, 3) times (5, 2) fails because 3 ≠ 5.
      :::

      Run this to check every number in this lesson, then change song 2 to [0, 3] and predict its new row before rerunning:

      ```python run
      import numpy as np

      X = np.array([[2, 1],      # song 1: [beat, vocals]
                    [1, 3]])     # song 2
      W = np.array([[2, 1],      # how beat feeds [party, focus]
                    [3, -1]])    # how vocals feed [party, focus]
      b = np.array([1, 2])       # one offset per output

      print("XW =\n", X @ W)
      print("XW + b =\n", X @ W + b)     # b is added to every row
      print("WX =\n", W @ X)             # swap the order: different answer

      batch = np.ones((5, 2))            # 5 songs, 2 features
      W3 = np.ones((2, 3))               # 2 features in, 3 scores out
      print("batch shape:", (batch @ W3).shape)
      try:
          W3 @ batch
      except ValueError:
          print("W3 @ batch fails: inner sizes", W3.shape[1], "and", batch.shape[0], "don't match")
      ```

      Matching shapes don't prove the features meet the right weights, so check one example by hand, as you did for song 1. One more warning: "rank" means the number of axes for a tensor but something different for a matrix, which the lesson "Directions, eigenvectors, and low-rank structure" covers.
    bridges: []
  - id: matrices-tensors.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.matrices-tensors
    markdown: Compute layer outputs for a weather station, a thermostat, and more, then predict shapes for attention scores, an image classifier, and a transposed product.
    takeaway: |-
      Each entry of XW is a row of X dotted with a column of W. Check shapes first, (n, k) times (k, m) gives (n, m), and keep the order: XW and WX usually differ.
  - id: matrices-tensors.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.matrices-tensors
    markdown: |-
      Matrix multiplication combines matching dimensions; tensor shapes, transposes, and broadcasting describe how numerical data is organized and transformed.
