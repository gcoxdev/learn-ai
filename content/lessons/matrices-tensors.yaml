scenes:
- id: matrices-tensors.s1
  title: A shape is a useful contract
  type: explanation
  depth: intuition
  objective_refs:
  - objective.matrices-tensors
  markdown: 'A matrix is a rectangular array. A 2 × 3 matrix has two rows and three columns. A tensor generalizes
    arrays to more axes: a batch of images might have axes for examples, height, width, and channels. Axis order
    is a convention, so document it rather than guessing from the numbers.'
  text_mode: 'A matrix is a rectangular array. A 2 × 3 matrix has two rows and three columns. A tensor generalizes
    arrays to more axes: a batch of images might have axes for examples, height, width, and channels. Axis order
    is a convention, so document it rather than guessing from the numbers.'
  bridges: []
- id: matrices-tensors.s2
  title: Multiply matching dimensions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.matrices-tensors
  markdown: A matrix with shape m × n can multiply one with shape n × p, producing m × p. The shared n dimension
    is summed over. For row [2, 1] and column [3, 4], the result is 2 × 3 + 1 × 4 = 10. Matrix multiplication differs
    from multiplying entries in the same positions.
  text_mode: A matrix with shape m × n can multiply one with shape n × p, producing m × p. The shared n dimension
    is summed over. For row [2, 1] and column [3, 4], the result is 2 × 3 + 1 × 4 = 10. Matrix multiplication differs
    from multiplying entries in the same positions.
  bridges:
  - vectors
  - algebra-notation
- id: matrices-tensors.s3
  title: Trace a batch
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.matrices-tensors
  markdown: 'Suppose three examples each have two features, so X has shape 3 × 2. A weight matrix W of shape 2 ×
    4 produces XW with shape 3 × 4: four output features per example. A four-entry bias can be broadcast across
    the three rows, adding the same bias vector to each example.'
  text_mode: 'Suppose three examples each have two features, so X has shape 3 × 2. A weight matrix W of shape 2
    × 4 produces XW with shape 3 × 4: four output features per example. A four-entry bias can be broadcast across
    the three rows, adding the same bias vector to each example.'
  bridges: []
- id: matrices-tensors.s4
  title: Transpose and rank answer different questions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.matrices-tensors
  markdown: A transpose swaps rows and columns, turning a 2 × 4 matrix into 4 × 2. Matrix rank measures the number
    of independent directions represented, not its number of axes. Broadcasting repeats a compatible pattern conceptually;
    an unintended broadcast can silently produce the wrong calculation despite valid array shapes.
  text_mode: A transpose swaps rows and columns, turning a 2 × 4 matrix into 4 × 2. Matrix rank measures the number
    of independent directions represented, not its number of axes. Broadcasting repeats a compatible pattern conceptually;
    an unintended broadcast can silently produce the wrong calculation despite valid array shapes.
  bridges: []
