- id: objective.matrices-tensors
  version: 1-draft
  statement: Matrix multiplication combines matching dimensions; tensor shapes, transposes, and broadcasting describe
    how numerical data is organized and transformed.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - matrices-tensors.base
  - matrices-tensors.transfer
  prerequisites:
  - anyOf:
    - objective.vectors
  - anyOf:
