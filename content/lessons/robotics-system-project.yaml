    checks these distinctions and calculations, not real-world operating competence.'
  bridges: []
- id: robotics-system-project.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.robotics-system-project
  markdown: These checks assess the supporting concepts. Use the rubric to review your project; the app does not
    grade your submitted artifact.
  text_mode: Untimed checks of the supporting concepts, followed by continuation links.
  takeaway: Robotics connects sensing, decisions, and physical consequences. A controller needs fresh observations
    and appropriate constraints whether or not it uses a learned policy.
