  - id: robotics-system-project.base.v2
    objective_ref: objective.robotics-system-project
    task: base
    response_type: single_choice
    points: 1
    hint: Trace which part of the loop produced the result (planner, controller, or safety layer), and remember that cruising speed is about (Kp ÷ Kd) × error.
    remediation_scene: robotics-system-project.trials
    variants:
      - id: robotics-system-project.base.v2.1
        prompt: Every waypoint on the hug path is 0.25 ft from the island, yet every trial breaks the 0.2 ft clearance rule. Why?
        options:
          - id: b
            text: A* returns an inadmissible path when obstacles are not inflated
          - id: a
            text: Tidy cuts corners between waypoints, and slip pushes it closer still
          - id: c
            text: The clearance check measures from waypoints instead of from Tidy
        answer: a
        feedback: The robot drives straight between waypoints, and the line between two diagonal ones crosses the island's corner, so the 0.05 ft of spare room is gone before slip adds more. A* is still optimal on its grid, and the check measures the simulated position at every step.
      - id: robotics-system-project.base.v2.2
        prompt: Brisk gains (Kp 1.5, Kd 2) break the 0.5 ft/s limit in most trials, while gentle gains (Kp 1, Kd 2) never do. Why?
        options:
          - id: a
            text: Cruising speed is about (Kp ÷ Kd) × error, so brisk gains cruise 50% faster
          - id: b
            text: A higher Kp lets the command exceed the motor's 1 ft/s² limit
          - id: c
            text: Brisk gains make the simulator add more wheel slip to each step
        answer: a
        feedback: At cruise the P push balances the D brake, so v ≈ (Kp ÷ Kd) × error, about 0.56 ft/s for brisk against 0.375 ft/s for gentle with a 0.75 ft error. The motor clip and the slip are the same for both.
      - id: robotics-system-project.base.v2.3
        prompt: The governed setup succeeds in 50 of 50 trials. What can the report claim?
        options:
          - id: c
            text: Success is exactly 100%, with no uncertainty left
          - id: b
            text: Tidy never fails on this route in this kitchen
          - id: a
            text: The success rate is plausibly between 93% and 100%
        answer: a
        feedback: The Wilson interval for 50/50 is 93–100%, so a failure rate up to about 7% still fits the data. Fifty successes can't show a rate of exactly 100%.
      - id: robotics-system-project.base.v2.4
        prompt: The controller uses Kp and Kd but sets Ki = 0. Why is that reasonable for this task?
        options:
          - id: a
            text: Nothing pushes steadily, and the large waypoint error would wind up an integral
          - id: b
            text: Integral terms only work for one-dimensional systems like the lift
          - id: c
            text: The motor's acceleration limit already removes steady-state error
        answer: a
        feedback: An integral cancels a steady push, like the mug's weight on the lift. Chasing waypoints keeps the error large the whole way, so an integral would keep growing and overshoot. Integrals work fine in 2-D, and clipping doesn't remove a steady offset.
  - id: robotics-system-project.transfer.v2
    objective_ref: objective.robotics-system-project
    task: transfer
    response_type: single_choice
    points: 1
    hint: Count a trial as a success only if every rule held with no help, and fix the part of the loop that caused the failure.
    remediation_scene: robotics-system-project.s5
    variants:
      - id: robotics-system-project.transfer.v2.1
        prompt: A warehouse robot reaches its shelf in 47 of 50 trials, but 5 of those 47 needed a person to nudge it free. What should the report say?
        options:
          - id: b
            text: 47/50, because the nudges happened outside the controller
          - id: c
            text: 47/55, counting every nudge as an extra failed trial
          - id: a
            text: 42/50 unassisted, with the 5 assisted runs listed apart
        answer: a
        feedback: A nudge is help, so those runs aren't unassisted successes; report them separately so readers see what the robot did alone. Adding nudges as extra trials changes the denominator without answering the question.
      - id: robotics-system-project.transfer.v2.2
        prompt: A delivery robot tuned for speed arrives on time but exceeds its speed limit in 70% of trials. Which fix keeps it on time?
        options:
          - id: a
            text: Add a speed governor below the limit, then rerun the trials
          - id: b
            text: Lower the gains until it stops speeding, whatever the delay
          - id: c
            text: Raise the speed limit to match the speeds it reaches
        answer: a
        feedback: Tidy's governor removed speeding and cost only 0.2 s. Detuning trades one failed rule for another, like the gentle gains that arrived late, and raising the limit changes the rule rather than meeting it.
      - id: robotics-system-project.transfer.v2.3
        prompt: A lawn-mowing robot 0.4 ft wide plans with A* on a grid, treating itself as a point, and keeps clipping flower beds. What should the planner change?
        options:
          - id: c
            text: Add more waypoints along the same planned path
          - id: a
            text: Inflate obstacles by the robot's radius before searching
          - id: b
            text: Use a heuristic that overestimates near the beds
        answer: a
        feedback: Inflating obstacles leaves room for the body, like Tidy's wide berth. More waypoints follow the same too-close path, and an overestimating heuristic makes A* lose its optimality without adding clearance.
      - id: robotics-system-project.transfer.v2.4
        prompt: A drone lands perfectly in 20 of 20 simulated trials, and the team wants to announce "100% reliable landings". What should they say instead?
        options:
          - id: a
            text: 20/20 in simulation (Wilson 84–100%), with hardware tests still to come
          - id: b
            text: 100% reliable, since the simulator uses the real equations of flight
          - id: c
            text: 95% reliable, subtracting five points to allow for the simulator gap
        answer: a
        feedback: Twenty successes still allow a failure rate up to about 16%, and simulation leaves out real wind, sensors, and batteries. An arbitrary deduction is no more honest than 100%.
  - id: robotics-system-project.command.v2
    objective_ref: objective.robotics-system-project
    task: base
    response_type: numeric
    points: 1
    hint: Compute Kp × error − Kd × velocity, then clip the result to the motor limit of −1 to +1 ft/s².
    remediation_scene: robotics-system-project.s4
    absolute_tolerance: 0.01
    variants:
      - id: robotics-system-project.command.v2.1
        prompt: 'With Kp = 1.5 and Kd = 2, the waypoint is 0.5 ft ahead on this axis and the robot is at rest. What acceleration (ft/s²) does the PD controller command? The motor limit is ±1.'
        answer: 0.75
        feedback: 1.5 × 0.5 − 2 × 0 = 0.75, inside the ±1 limit.
      - id: robotics-system-project.command.v2.2
        prompt: 'With Kp = 1 and Kd = 2, the waypoint is 0.4 ft ahead on this axis and the robot moves toward it at 0.3 ft/s. What acceleration (ft/s²) does the PD controller command? The motor limit is ±1.'
        answer: -0.2
        feedback: 1 × 0.4 − 2 × 0.3 = −0.2. The D term brakes, because the robot is already closing fast.
      - id: robotics-system-project.command.v2.3
        prompt: 'With Kp = 2 and Kd = 1, the waypoint is 0.8 ft ahead on this axis and the robot moves toward it at 0.1 ft/s. What acceleration (ft/s²) does the PD controller command? The motor limit is ±1.'
        answer: 1
        feedback: 2 × 0.8 − 1 × 0.1 = 1.5, clipped to the motor limit of 1.
      - id: robotics-system-project.command.v2.4
        prompt: 'With Kp = 1.5 and Kd = 2, the waypoint is 0.6 ft behind on this axis (error −0.6) and the robot still moves away from it at 0.2 ft/s. What acceleration (ft/s²) does the PD controller command? The motor limit is ±1.'
        answer: -1
        feedback: 1.5 × (−0.6) − 2 × 0.2 = −1.3, clipped to −1.
