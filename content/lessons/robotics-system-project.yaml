assessment_families:
- id: robotics-system-project.base
  objective_ref: objective.robotics-system-project
  task: base
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: robotics-system-project.s4
  variants:
  - prompt: The true position is 1 but the sensor reports 0. Which value does our specified controller use in target
      minus observation?
    answer: a
    options:
    - id: b
      text: The hidden true 1, even though the controller has not observed it.
    - id: c
      text: The average of target and true position by definition.
    - id: a
      text: The reported 0; true state is used separately in the toy dynamics.
    feedback: The controller acts on its available observation; the simulation tracks the separate true state.
    id: robotics-system-project.base.1
  - prompt: Does the paper controller require a transformer or reinforcement learning to choose its next action?
    answer: a
    options:
    - id: c
      text: Yes; proportional feedback is a reward-training algorithm.
    - id: a
      text: No; its explicit error-and-clipping rule already specifies the action.
    - id: b
      text: Yes; every physical action is a learned token.
    feedback: Feedback control and learned policy training are different mechanisms.
    id: robotics-system-project.base.2
  - prompt: A trial reaches the goal after a person resets the robot twice. What should the evaluation record?
    answer: a
    options:
    - id: a
      text: The completion and the two interventions.
    - id: b
      text: Only completion, because resets occur outside the model.
    - id: c
      text: Two extra autonomous successes.
    feedback: Human assistance affects what the observed success demonstrates.
    id: robotics-system-project.base.3
  - prompt: Which claim is supported by the hand simulation?
    answer: a
    options:
    - id: b
      text: The same rule is sufficient to drive a vehicle on public roads.
    - id: c
      text: Sensor delay is beneficial because one delayed example reached the target.
    - id: a
      text: The specified controller produces the calculated states under the stated toy assumptions.
    feedback: The trace checks a simplified mechanism, not a broad operating guarantee.
    id: robotics-system-project.base.4
- id: robotics-system-project.transfer
  objective_ref: objective.robotics-system-project
  task: transfer
  response_type: numeric_fields_with_reason
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: robotics-system-project.s2
  variants:
  - prompt: Use target=3, observed position=0, and true position=0. Error = target − observed; raw command = 0.5
      × error; clip command to [−1, 1]; next true position = true position + clipped command. Give error, clipped
      command, and next true position.
    answers:
      error: 3
      command: 1
      next: 1
    reason_answer: a
    reason_options:
    - id: b
      text: Compute the command from the hidden true state instead of the observation.
    - id: c
      text: Apply the unclipped command to the observed position.
    - id: a
      text: Compute the command from the observation, clip it, then apply it to the true state.
    feedback: Keep observed and true positions distinct, and respect the command limit.
    id: robotics-system-project.transfer.1
  - prompt: Use target=0, observed position=3, and true position=2. Error = target − observed; raw command = 0.5
      × error; clip command to [−1, 1]; next true position = true position + clipped command. Give error, clipped
      command, and next true position.
    answers:
      error: -3
      command: -1
      next: 1
    reason_answer: a
    reason_options:
    - id: c
      text: Apply the unclipped command to the observed position.
    - id: a
      text: Compute the command from the observation, clip it, then apply it to the true state.
    - id: b
      text: Compute the command from the hidden true state instead of the observation.
    feedback: Keep observed and true positions distinct, and respect the command limit.
    id: robotics-system-project.transfer.2
  - prompt: Use target=2, observed position=1, and true position=1. Error = target − observed; raw command = 0.5
      × error; clip command to [−1, 1]; next true position = true position + clipped command. Give error, clipped
      command, and next true position.
    answers:
      error: 1
      command: 0.5
      next: 1.5
    reason_answer: a
    reason_options:
    - id: a
      text: Compute the command from the observation, clip it, then apply it to the true state.
    - id: b
      text: Compute the command from the hidden true state instead of the observation.
    - id: c
      text: Apply the unclipped command to the observed position.
    feedback: Keep observed and true positions distinct, and respect the command limit.
    id: robotics-system-project.transfer.3
  - prompt: Use target=2, observed position=0, and true position=1. Error = target − observed; raw command = 0.5
      × error; clip command to [−1, 1]; next true position = true position + clipped command. Give error, clipped
      command, and next true position.
    answers:
      error: 2
      command: 1
      next: 2
    reason_answer: a
    reason_options:
    - id: b
      text: Compute the command from the hidden true state instead of the observation.
    - id: c
      text: Apply the unclipped command to the observed position.
    - id: a
      text: Compute the command from the observation, clip it, then apply it to the true state.
    feedback: Keep observed and true positions distinct, and respect the command limit.
    id: robotics-system-project.transfer.4
  numeric_fields:
  - id: error
    label: Observed error
  - id: command
    label: Clipped command
  - id: next
    label: Next true position
  absolute_tolerance: 1.0e-06
