schema_version: 0.2-draft
lesson:
  id: robotics-system-project
  version: 0.1.0-draft
  title: 'Project: trace a robot sensing and control loop'
  state: draft
  summary: Trace a bounded controller on paper, account for sensor error, and compare classical control with optional
    learned policies.
  slot: M36.12
  category: destination
  archetype: project
  minutes: 35
  sources:
  - title: 'Lynch and Park: Modern Robotics'
    url: https://modernrobotics.northwestern.edu/nu-gm-book-resource/
  - title: 'Octo: a generalist robot policy (2024)'
    url: https://arxiv.org/abs/2405.12213
objectives:
- id: objective.robotics-system-project
  version: 1-draft
  statement: Calculate a bounded proportional-control step and identify why observed feedback, constraints, and
    closed-loop evaluation matter to a robot system.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - robotics-system-project.base
  - robotics-system-project.transfer
  prerequisites:
  - anyOf:
    - objective.feedback-and-robot-control
  - anyOf:
    - objective.localization-mapping-and-slam
  - anyOf:
    - objective.kinematics-and-motion-planning
  - anyOf:
    - objective.physical-ai-evaluation
scenes:
- id: robotics-system-project.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.robotics-system-project
  title: Start with a robot small enough to reason about
  markdown: 'Our toy robot moves along a numbered line toward target position 2. Its true position starts at 0.
    A sensor reports an observed position, and the controller produces a movement command. A **controller** is a
    rule for choosing actions from a goal and feedback. A **policy** also maps available information to actions;
    it may be written by people or learned.


    This is a hand simulation, not instructions for operating hardware. Deliver a table of observations, actions,
    and resulting positions, plus a diagram connecting sensing, planning, control, and evaluation.'
  text_mode: 'Our toy robot moves along a numbered line toward target position 2. Its true position starts at 0.
    A sensor reports an observed position, and the controller produces a movement command. A **controller** is a
    rule for choosing actions from a goal and feedback. A **policy** also maps available information to actions;
    it may be written by people or learned.


    This is a hand simulation, not instructions for operating hardware. Deliver a table of observations, actions,
    and resulting positions, plus a diagram connecting sensing, planning, control, and evaluation.'
  bridges: []
- id: robotics-system-project.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.robotics-system-project
  title: Calculate one bounded control rule
  markdown: 'Use error = target − observed position. Choose raw command = 0.5 × error, then limit that command to
    the interval from −1 to +1. Limiting a command this way is **clipping**. In our simplified dynamics, next true
    position = current true position + clipped command.


    With an accurate sensor at 0 and target 2, error is 2 and command is 1, giving next position 1. At the next
    step, error is 1 and command is 0.5, giving position 1.5. A third step reaches 1.75. State the units and assumptions:
    instant commands, one-dimensional motion, and no unmodeled forces.'
  text_mode: 'Use error = target − observed position. Choose raw command = 0.5 × error, then limit that command
    to the interval from −1 to +1. Limiting a command this way is **clipping**. In our simplified dynamics, next
    true position = current true position + clipped command.


    With an accurate sensor at 0 and target 2, error is 2 and command is 1, giving next position 1. At the next
    step, error is 1 and command is 0.5, giving position 1.5. A third step reaches 1.75. State the units and assumptions:
    instant commands, one-dimensional motion, and no unmodeled forces.'
  bridges:
  - arithmetic
  - feedback-and-robot-control
- id: robotics-system-project.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.robotics-system-project
  title: Put sensing and planning around the controller
  markdown: 'A **coordinate frame** specifies the origin and directions used to express a position. An observation
    in a camera’s frame must be related to the robot’s working frame before it can support an action. **State estimation**
    combines measurements and a model to estimate quantities that are not known exactly.


    A planner might choose a route around an obstacle while a controller follows the next target. These are different
    responsibilities. Label where your toy removed obstacles, orientation, changing sensor quality, and motion delay.
    Omitting these details makes the arithmetic inspectable; it does not show that a physical robot can safely omit
    them.'
  text_mode: 'A **coordinate frame** specifies the origin and directions used to express a position. An observation
    in a camera’s frame must be related to the robot’s working frame before it can support an action. **State estimation**
    combines measurements and a model to estimate quantities that are not known exactly.


    A planner might choose a route around an obstacle while a controller follows the next target. These are different
    responsibilities. Label where your toy removed obstacles, orientation, changing sensor quality, and motion delay.
    Omitting these details makes the arithmetic inspectable; it does not show that a physical robot can safely omit
    them.'
  bridges: []
- id: robotics-system-project.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.robotics-system-project
  title: Break one assumption and inspect the consequence
  markdown: 'Suppose the true position is 1 but a delayed sensor still reports 0. The target remains 2. The controller
    uses the observation, computes command 1, and our toy dynamics reaches true position 2. With the fresh observation
    1, it would choose 0.5 and reach 1.5 instead.


    The delayed measurement happened to produce the target in this example, but the mismatch shows why an old command
    can be inappropriate for a changed state. Test both directions of sensor error and include stopping conditions.
    A favorable single outcome is not evidence that delay is beneficial or safe in general.'
  text_mode: 'Suppose the true position is 1 but a delayed sensor still reports 0. The target remains 2. The controller
    uses the observation, computes command 1, and our toy dynamics reaches true position 2. With the fresh observation
    1, it would choose 0.5 and reach 1.5 instead.


    The delayed measurement happened to produce the target in this example, but the mismatch shows why an old command
    can be inappropriate for a changed state. Test both directions of sensor error and include stopping conditions.
    A favorable single outcome is not evidence that delay is beneficial or safe in general.'
  bridges: []
- id: robotics-system-project.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.robotics-system-project
  title: Locate learned policies without making them compulsory
  markdown: 'A learned perception system can estimate object positions; imitation learning can fit actions from
    demonstrations; reinforcement learning can use rewards to adjust a policy. Vision-language-action models can
    connect instructions and visual inputs to an action representation. These are alternative or additional components,
    not mandatory parts of every controller.


    Octo is a documented generalist robot policy example with adaptation to different observation and action interfaces.
    Its research results do not turn our simple controller into that policy. If you choose a learned extension,
    state its input/action units, training data, adaptation stage, and where conventional control or explicit constraints
    remain.'
  text_mode: 'A learned perception system can estimate object positions; imitation learning can fit actions from
    demonstrations; reinforcement learning can use rewards to adjust a policy. Vision-language-action models can
    connect instructions and visual inputs to an action representation. These are alternative or additional components,
    not mandatory parts of every controller.


    Octo is a documented generalist robot policy example with adaptation to different observation and action interfaces.
    Its research results do not turn our simple controller into that policy. If you choose a learned extension,
    state its input/action units, training data, adaptation stage, and where conventional control or explicit constraints
    remain.'
  bridges: []
- id: robotics-system-project.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.robotics-system-project
  title: Evaluate the whole loop and review the project
  markdown: 'Define success as reaching a stated tolerance of the goal while respecting movement limits. Record
    interventions, failures, delayed observations, and recovery attempts, rather than reporting only completed trials.
    Test changed starting positions and sensor errors on paper.


    Submit the accurate-sensor trace, the delayed-sensor comparison, and a block diagram with clear boundaries.
    A reviewer should be able to recompute each action and distinguish true state from observation. Explain why
    success in this one-dimensional simulation cannot establish performance for a robot arm or autonomous vehicle.
    A driving extension additionally needs road-specific perception, prediction, rules, and validation. The quiz
    checks these distinctions and calculations, not real-world operating competence.'
  text_mode: 'Define success as reaching a stated tolerance of the goal while respecting movement limits. Record
    interventions, failures, delayed observations, and recovery attempts, rather than reporting only completed trials.
    Test changed starting positions and sensor errors on paper.


    Submit the accurate-sensor trace, the delayed-sensor comparison, and a block diagram with clear boundaries.
