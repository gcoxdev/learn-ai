schema_version: 0.2-draft
lesson:
  id: reasoning-demonstrations
  version: 0.3.0-draft
  title: Teach a useful starting style for problem solving
  state: draft
  summary: Build short, checkable problem-solving demonstrations before attributing gains to later training
    stages.
  slot: M21.2
  category: learning
  sources:
  - title: DeepSeek-R1
    url: https://arxiv.org/abs/2501.12948
  - title: Distilling Step-by-Step
    url: https://arxiv.org/abs/2305.02301
objectives:
- id: objective.reasoning-demonstrations
  version: 1-draft
  statement: Reasoning demonstrations and cold-start tuning supply examples of problem decomposition and presentation;
    curate valid, diverse traces and distinguish supervised imitation from later reward optimization.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - reasoning-demonstrations.base
  - reasoning-demonstrations.transfer
  prerequisites:
  - anyOf:
    - objective.reasoning-and-explanations
  - anyOf:
    - objective.supervised-fine-tuning
scenes:
- id: reasoning-demonstrations.s1
  title: Demonstrate a checkable solution
  type: explanation
  depth: intuition
  objective_refs:
  - objective.reasoning-demonstrations
  markdown: 'A **solution trace** records the steps used to solve a problem. A useful demonstration shows how
    to interpret the question, work through it, and check the result.


    For “three boxes contain four pencils each,” a short trace is: “3 groups of 4 gives 12 pencils. Dividing
    12 by 3 returns 4 per box.” Each step connects to the question and can be checked. The amount of explanation
    should fit the task; statements such as “I should think carefully” add no calculation.'
  text_mode: 'A **solution trace** records the steps used to solve a problem. A useful demonstration shows
    how to interpret the question, work through it, and check the result.


    For “three boxes contain four pencils each,” a short trace is: “3 groups of 4 gives 12 pencils. Dividing
    12 by 3 returns 4 per box.” Each step connects to the question and can be checked. The amount of explanation
    should fit the task; statements such as “I should think carefully” add no calculation.'
  bridges: []
- id: reasoning-demonstrations.s2
  title: Cold start means an initial adaptation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reasoning-demonstrations
  markdown: 'Some reasoning-training recipes begin with a small set of curated demonstrations before reinforcement
    learning. This initial supervised adaptation is called **cold-start tuning** in that setting.


    It gives later training a useful starting behavior, such as readable formatting or checkable solution steps.
    It is one role a supervised stage can play, rather than a required stage for every reasoning model.'
  text_mode: 'Some reasoning-training recipes begin with a small set of curated demonstrations before reinforcement
    learning. This initial supervised adaptation is called **cold-start tuning** in that setting.


    It gives later training a useful starting behavior, such as readable formatting or checkable solution steps.
    It is one role a supervised stage can play, rather than a required stage for every reasoning model.'
  bridges: []
- id: reasoning-demonstrations.s3
  title: Curate beyond successful final answers
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reasoning-demonstrations
  markdown: 'A trace may reach the right answer through an invalid step or exploit leaked information. Check
    its derivation, data provenance, difficulty coverage, and format. Retaining only one style can narrow the
    model’s behavior; include concise direct solutions where long derivations are unnecessary.


    A final-answer filter could keep “3 × 4 = 10, then add 2 to get 12,” despite the invalid first step. Review
    the steps as well as the answer when the demonstration is intended to teach a method. Include changed-number
    examples so a memorized final answer cannot stand in for the relationship.'
  text_mode: 'A trace may reach the right answer through an invalid step or exploit leaked information. Check
    its derivation, data provenance, difficulty coverage, and format. Retaining only one style can narrow the
    model’s behavior; include concise direct solutions where long derivations are unnecessary.


    A final-answer filter could keep “3 × 4 = 10, then add 2 to get 12,” despite the invalid first step. Review
    the steps as well as the answer when the demonstration is intended to teach a method. Include changed-number
    examples so a memorized final answer cannot stand in for the relationship.'
  bridges: []
- id: reasoning-demonstrations.s4
  title: Separate the stages experimentally
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.reasoning-demonstrations
  markdown: Compare the base, demonstration-tuned, and later reward-trained checkpoints under matched evaluation.
    If a skill improves only after reward training, do not attribute it solely to the demonstrations. The number
    of examples alone does not describe their quality or the strength of their influence.
  text_mode: Compare the base, demonstration-tuned, and later reward-trained checkpoints under matched evaluation.
    If a skill improves only after reward training, do not attribute it solely to the demonstrations. The number
    of examples alone does not describe their quality or the strength of their influence.
  bridges: []
- id: reasoning-demonstrations.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.reasoning-demonstrations
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Use demonstrations with valid, checkable steps. Compare training stages separately to see which
    stage produced each improvement.
- id: reasoning-demonstrations.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.reasoning-demonstrations
  markdown: Use demonstrations with valid, checkable steps. Compare training stages separately to see which
    stage produced each improvement.
  text_mode: Use demonstrations with valid, checkable steps. Compare training stages separately to see which
    stage produced each improvement.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - reasoning-demonstrations.s1
    - reasoning-demonstrations.s2
    - reasoning-demonstrations.s3
    - reasoning-demonstrations.s4
    - reasoning-demonstrations.check
    gate_refs:
    - gate.core
  scene_aliases:
    reasoning-demonstrations.recap: reasoning-demonstrations.check
assessment_families:
- id: reasoning-demonstrations.base
  objective_ref: objective.reasoning-demonstrations
  task: base
  response_type: single_choice
  points: 1
  hint: 'Cold start means an initial adaptation: trace the inputs, operation, and result before choosing.'
  remediation_scene: reasoning-demonstrations.s2
  variants:
  - id: reasoning-demonstrations.base.1
    prompt: What does a reasoning demonstration provide?
    options:
    - id: b
      text: A guarantee of faithful internal self-report
    - id: c
      text: Only a scalar optimizer state
    - id: a
      text: A supervised example of a solution and its presentation
    answer: a
    feedback: It is a target behavior for learning.
  - id: reasoning-demonstrations.base.2
    prompt: Is a cold-start supervised stage mandatory for all reasoning models?
    options:
    - id: c
      text: Only if the model uses tokens
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Recipes can differ in their starting stages.
- id: reasoning-demonstrations.transfer
  objective_ref: objective.reasoning-demonstrations
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Separate the stages experimentally: trace the inputs, operation, and result before choosing.'
  remediation_scene: reasoning-demonstrations.s4
  variants:
  - id: reasoning-demonstrations.transfer.1
    prompt: A correct final answer contains an invalid derivation. Should the trace be accepted as fully valid?
    options:
    - id: c
      text: Only if it is long
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Step validity requires checking beyond the final result.
  - id: reasoning-demonstrations.transfer.2
    prompt: How can the contribution of demonstrations be assessed?
    options:
    - id: a
      text: Compare checkpoints before and after that stage under matched conditions
    - id: b
      text: Inspect only the final model name
    - id: c
      text: Count generated words alone
    answer: a
    feedback: Stage-level comparisons isolate evidence about the transition.
