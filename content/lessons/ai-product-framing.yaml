schema_version: 0.2-draft
lesson:
  id: ai-product-framing
  version: 0.3.0-draft
  title: Choose a useful problem before choosing a model
  state: draft
  summary: The board wants "an AI chatbot." A front desk log, a homepage banner, and one line of arithmetic decide whether the library should build one.
  slot: M33.1
  category: learning
  sources:
    - title: Rules of Machine Learning (Martin Zinkevich, Google)
      url: https://developers.google.com/machine-learning/guides/rules-of-ml
    - title: Guidelines for Human-AI Interaction (Amershi et al., CHI 2019)
      url: https://www.microsoft.com/en-us/research/publication/guidelines-for-human-ai-interaction/
    - title: "Trustworthy Online Controlled Experiments: A Practical Guide to A/B Testing (Kohavi, Tang & Xu, 2020)"
      url: https://doi.org/10.1017/9781108653985
  archetype: mechanism
objectives:
  - id: objective.ai-product-framing
    version: 3-draft
    statement: Frame an AI product from the user's problem, compare it with a non-AI baseline, set success metrics, guardrails, and constraints, and estimate its value after the cost of errors.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - ai-product-framing.base.v3
      - ai-product-framing.transfer.v3
      - ai-product-framing.calc.v3
    prerequisites:
      - anyOf:
          - objective.stakeholders-and-deployment-decisions
      - anyOf:
          - objective.baselines-and-success
scenes:
  - id: ai-product-framing.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.ai-product-framing
    title: Read the front desk's log first
    markdown: |-
      Linden Public Library's board has approved "an AI chatbot." Before anyone picks a model, the service manager, Rosa, reads a month of the front desk's log, about 1,200 questions a week:

      | Kind of question | Share | Answering it needs |
      | --- | ---: | --- |
      | Opening hours and closures | 40% | The published schedule |
      | Holds and renewals | 25% | The visitor's private account |
      | Events and room bookings | 15% | The events calendar |
      | Everything else | 20% | Usually a person |

      "Add a chatbot" names a tool. The log shows a **user problem**, the question from the lesson "Decide whose problem the system solves and who bears its errors": a visitor phones to ask if the branch is open and waits while staff read out the schedule. That sequence of steps is the **workflow**, and the real question is which step, if any, a model should take over.

      Hours make the best first job: 480 questions a week, a public source, no private data, and every answer checkable against the schedule.
    bridges: []
  - id: ai-product-framing.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.ai-product-framing
    title: Price the job without AI first
    markdown: |-
      Rule #1 of Google's *Rules of Machine Learning* (Martin Zinkevich) is "Don't be afraid to launch a product without machine learning." So Rosa first sets up a **baseline**, as in the lesson "Decide what success means before training": the simplest non-AI fix, which any AI option must beat. Here it's a homepage banner showing today's hours, linked to a closures page.

      She tests both on 20 real hours questions from the log:

      | | Banner and link | Assistant prototype |
      | --- | ---: | ---: |
      | Right answer | 18 of 20 | 19 of 20 |
      | Time to an answer | 30 s | 10 s |
      | What a miss costs | A phone call | A wasted trip and a complaint |

      The assistant wins two rows, but its one wrong answer ("open until 8" on a day the branch closed at 5) sent a visitor across town. Measure from question to correct result, including the cost of mistakes.
    bridges: []
  - id: ai-product-framing.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-product-framing
    title: Success metrics, guardrails, and constraints
    markdown: |-
      Next Rosa writes down how the pilot will be judged, *before* seeing results. A **success metric** is the number the project exists to move. A **guardrail metric** is a number that must stay within a set limit however good the success metric looks. A **constraint** is a hard rule with no trade-off at all.

      | Number | Kind | Target |
      | --- | --- | --- |
      | Hours questions answered without staff | Success metric | At least 70% |
      | Wrong hours, from a weekly review of 50 answers | Guardrail | At most 2% |
      | Time to answer, 95th percentile | Guardrail | Under 3 s |
      | Account data sent to the model | Constraint | Never |

      So if the assistant answers 85% of questions but gives wrong hours 4% of the time, the pilot fails. The 85% can't buy off the guardrail.
    bridges: []
  - id: ai-product-framing.value
    title: Is it worth it? Do the sum
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-product-framing
    markdown: |-
      Now put the job in dollars. Staff cost about \$30 an hour and spend 3 minutes per hours question, so each one answered by hand costs \$1.50. Rosa estimates:

      - the assistant resolves 70% of 480 questions a week: 336
      - 2% of those are wrong: 6.72 a week, at about \$20 each (a wasted trip, a callback)
      - \$34.80 a week to run (model usage plus an hour of upkeep)

      $$\text{net value} = \underbrace{336 \times 1.50}_{504} - \underbrace{6.72 \times 20}_{134.40} - 34.80 = 334.80 \text{ dollars a week}$$

      That looks healthy until you remember the banner. Rosa estimates that 40% of hours questions (192 a week) would be settled by the banner before anyone calls, almost error-free, saving 192 × \$1.50 = \$288. The assistant's real value is the *difference*: \$46.80 a week, so a \$6,000 build takes 128 weeks to pay back.

      ```python run
      questions = 480          # hours questions per week
      resolve_rate = 0.70      # share the assistant answers without staff
      saving = 1.50            # staff cost of answering one question ($)
      error_rate = 0.02        # share of assistant answers that are wrong
      cost_per_error = 20.00   # wasted trip plus follow-up call ($)
      run_cost = 34.80         # model usage + 1 hour of upkeep per week ($)
      baseline = 288.00        # the homepage banner's weekly saving ($)
      build_cost = 6000.00     # one-off cost to build the assistant ($)

      def money(x):
          return f"-${-x:.2f}" if x < 0 else f"${x:.2f}"

      resolved = questions * resolve_rate
      wrong = resolved * error_rate
      net = resolved * saving - wrong * cost_per_error - run_cost
      extra = net - baseline
      print(f"resolved {resolved:.0f}, wrong {wrong:.2f} per week")
      print("assistant's net value:", money(net), "per week")
      print("value over the banner:", money(extra), "per week")
      if extra > 0:
          print(f"weeks to pay back the build: {build_cost / extra:.0f}")
      break_even = (resolved * saving - run_cost - baseline) / wrong
      print("the banner wins if an error costs more than", money(break_even))
      ```

      Run it, then set `cost_per_error = 40.00`.

      :::predict At \$40 per wrong answer, which option wins?
      The banner. Errors now cost 6.72 × \$40 = \$268.80 a week, so the assistant nets \$200.40, below the banner's \$288. Past about \$26.96 per error, the banner wins: what a mistake costs matters more than a point of accuracy.
      :::

      :::mixup "It's 98% accurate, so it's worth building."
      Accuracy isn't value. The same 98% is a bargain when mistakes are cheap and a loss when each one costs a wasted trip. Price the errors, and compare against the cheapest baseline, not against nothing.
      :::
  - id: ai-product-framing.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-product-framing
    title: "\"I'm not sure\" is cheaper than wrong"
    markdown: |-
      The sum shows where to push. A wrong answer costs about \$20; "I'm not sure, please call the front desk" costs a \$1.50 call. Each wrong answer turned into an honest handoff saves \$18.50.

      That handoff is a **fallback**: a safe next step when the normal route can't finish the task. When the closures page leaves out holiday hours, the assistant must say so and give the front desk number, never guess the regular Monday hours. Rosa adds ten such unanswerable holiday questions to the test set.

      Someone must also own the source, or the assistant will repeat stale hours. The circulation lead owns the closures page and receives every "Wrong answer?" report.
    bridges: []
  - id: ai-product-framing.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.ai-product-framing
    markdown: A city pothole line, a bank's dispute chat, a pharmacy's store-hours bot, and a school district's data rule test whether you can frame an AI product and price its value.
    takeaway: "Start from the user's problem and the cheapest non-AI baseline. Set a success metric, guardrails, and constraints up front, and count what errors cost: AI is worth building only if it beats the baseline after its mistakes are paid for."
  - id: ai-product-framing.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.ai-product-framing
    markdown: |-
      AI product design should define the user task, success criteria, baseline, integration constraints, and build-or-buy tradeoffs before committing to model complexity.
  - id: ai-product-framing.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-product-framing
    title: Build, buy, or neither
    markdown: |-
      The capability can come from three places, and the banner is still one of them. Comparing them is called **build or buy**:

      | | Hosted model API | Self-hosted model | Banner, no AI |
      | --- | --- | --- | --- |
      | Upfront work | One integration | Servers and setup | Very little |
      | Cost per question | Pay per request | Mostly fixed hardware | Near zero |
      | Visitor text goes | To the vendor | Nowhere outside | Nowhere |
      | Model changes | On the vendor's schedule | When you choose | None |

      For public hours questions, the hosted API wins on effort. If a later phase touches borrowing records, the constraint may rule the vendor out at any price. Let constraints decide first, then compare costs.
    bridges: []
  - id: ai-product-framing.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.ai-product-framing
    title: Write the pilot card
    markdown: |-
      A **pilot** is a small, time-limited trial that tests your assumptions before a wider launch. Rosa's fits on one card:

      | | |
      | --- | --- |
      | User | Visitors asking about hours, about 480 a week |
      | Source | Closures page, owned by the circulation lead |
      | Baseline | Homepage banner, worth about \$288 a week |
      | Success | At least 70% answered without staff |
      | Guardrails | Wrong hours at most 2%; 95th-percentile time under 3 s |
      | Constraint | No account data reaches the model |
      | Fallback | Say what's missing; give the front desk number |
      | Decision | Continue only if it beats the banner's value by week 4 |

      Every line can be checked, so in week 4 nobody argues about what "working" meant.
    bridges: []
  - id: ai-product-framing.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.ai-product-framing
    title: Spot the better starting point
    markdown: Which pilot description gives us something concrete to evaluate?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: Help visitors find current opening hours and cite the schedule.
        - id: b
          text: Use the largest language model available.
        - id: c
          text: Add a conversational interface to every library service.
      answer: a
      reveal_markdown: Only the opening-hours pilot names a user outcome and the evidence each answer must cite, so you can count right and wrong answers. "The largest model" is a tool choice, and "every library service" is a scope with nothing specific to test.
      hint: Look for the option that names a user, a task, and a source you could check each answer against.
      id: ai-product-framing.practice.v2.7
