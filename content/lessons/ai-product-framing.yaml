schema_version: 0.2-draft
lesson:
  id: ai-product-framing
  version: 0.3.0-draft
  title: Choose a useful problem before choosing a model
  state: draft
  summary: Turn “let’s add AI” into a useful, testable job for a library helper.
  slot: M33.1
  category: learning
  sources:
  - title: Google — Rules of Machine Learning
    url: https://developers.google.com/machine-learning/guides/rules-of-ml
  - title: Amershi et al. — Guidelines for Human-AI Interaction
    url: https://www.microsoft.com/en-us/research/publication/guidelines-for-human-ai-interaction/
  archetype: mechanism
objectives:
- id: objective.ai-product-framing
  version: 2-draft
  statement: Define a bounded user task, compare a baseline, and choose success criteria, constraints, and
    fallback behavior.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - ai-product-framing.base.v2
  - ai-product-framing.transfer.v2
  prerequisites:
  - anyOf:
    - objective.stakeholders-and-deployment-decisions
  - anyOf:
    - objective.baselines-and-success
scenes:
- id: ai-product-framing.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ai-product-framing
  title: Give the helper a job
  markdown: 'A library wants an AI assistant. That is a tool choice, not yet a problem statement. Try this
    instead: “Help visitors find the current opening hours, using the library’s published schedule.” We know
    who needs help, what information matters, and where the answer should come from. A **workflow** is the
    sequence of steps someone follows to finish a task. Observe the existing workflow before deciding which
    step a model should handle.'
  text_mode: 'A library wants an AI assistant. That is a tool choice, not yet a problem statement. Try this
    instead: “Help visitors find the current opening hours, using the library’s published schedule.” We know
    who needs help, what information matters, and where the answer should come from. A **workflow** is the
    sequence of steps someone follows to finish a task. Observe the existing workflow before deciding which
    step a model should handle.'
  bridges: []
- id: ai-product-framing.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ai-product-framing
  title: Compare a simple alternative
  markdown: A **baseline** is a reference method used for comparison. Here it could be a prominent link to
    the opening-hours page. On 20 representative questions, the link helps visitors complete 18 correctly in
    an average of 30 seconds. An assistant completes 19 correctly in 10 seconds, but checking its mistakes
    takes staff time. Measure the whole job, including correction and review. A faster generated response is
    not necessarily a faster completed task.
  text_mode: A **baseline** is a reference method used for comparison. Here it could be a prominent link to
    the opening-hours page. On 20 representative questions, the link helps visitors complete 18 correctly in
    an average of 30 seconds. An assistant completes 19 correctly in 10 seconds, but checking its mistakes
    takes staff time. Measure the whole job, including correction and review. A faster generated response is
    not necessarily a faster completed task.
  bridges: []
- id: ai-product-framing.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-product-framing
  title: Write a promise you can test
  markdown: For this pilot, define success as finding the correct current schedule and identifying the source.
    Set a response-time limit and a policy for missing information. A **constraint** is a boundary the solution
    must respect, such as keeping private borrowing records out of the assistant’s inputs. Separate desired
    improvements from requirements that cannot be traded away for a higher average score. Record these rules
    before comparing candidate systems.
  text_mode: For this pilot, define success as finding the correct current schedule and identifying the source.
    Set a response-time limit and a policy for missing information. A **constraint** is a boundary the solution
    must respect, such as keeping private borrowing records out of the assistant’s inputs. Separate desired
    improvements from requirements that cannot be traded away for a higher average score. Record these rules
    before comparing candidate systems.
  bridges: []
- id: ai-product-framing.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-product-framing
  title: Plan for “I cannot tell”
  markdown: 'The published page may omit holiday hours. A useful **fallback** is a safe next step when the
    normal route cannot complete the task: say what is missing and offer the library’s contact details. Inventing
    a plausible holiday schedule would break the promise. Test these cases deliberately. Also decide who maintains
    the source, who investigates errors, and how a visitor can report an incorrect answer. Those responsibilities
    are part of the design.'
  text_mode: 'The published page may omit holiday hours. A useful **fallback** is a safe next step when the
    normal route cannot complete the task: say what is missing and offer the library’s contact details. Inventing
    a plausible holiday schedule would break the promise. Test these cases deliberately. Also decide who maintains
    the source, who investigates errors, and how a visitor can report an incorrect answer. Those responsibilities
    are part of the design.'
  bridges: []
- id: ai-product-framing.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.ai-product-framing
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: 'Start with the job: who needs help, what counts as success, what can go wrong, and what happens
    next?'
- id: ai-product-framing.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.ai-product-framing
  markdown: AI product design should define the user task, success criteria, baseline, integration constraints,
    and build-or-buy tradeoffs before committing to model complexity.
  text_mode: AI product design should define the user task, success criteria, baseline, integration constraints,
    and build-or-buy tradeoffs before committing to model complexity.
- id: ai-product-framing.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-product-framing
  title: Choose a way to supply the capability
  markdown: An external model service can reduce infrastructure work, while a locally operated model can give
    different control over data and configuration. **Build or buy** means comparing these ways of obtaining
    a capability. Include usage cost, integration work, maintenance, data handling, reliability, and the ability
    to leave a service later. Compare against the non-AI baseline too. Ownership alone does not tell us which
    choice best serves this particular workflow.
  text_mode: An external model service can reduce infrastructure work, while a locally operated model can give
    different control over data and configuration. **Build or buy** means comparing these ways of obtaining
    a capability. Include usage cost, integration work, maintenance, data handling, reliability, and the ability
    to leave a service later. Compare against the non-AI baseline too. Ownership alone does not tell us which
    choice best serves this particular workflow.
  bridges: []
- id: ai-product-framing.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-product-framing
  title: Make a small pilot card
  markdown: A **pilot** is a limited trial used to test assumptions before wider use. Write one card with the
    user, task, source, baseline, success measure, constraints, fallback, and responsible person. Start with
    opening hours rather than promising to answer every library question. After observing real attempts, adjust
    the scope or approach based on evidence. The card should give everyone involved the same practical definition
    of a useful result.
  text_mode: A **pilot** is a limited trial used to test assumptions before wider use. Write one card with
    the user, task, source, baseline, success measure, constraints, fallback, and responsible person. Start
    with opening hours rather than promising to answer every library question. After observing real attempts,
    adjust the scope or approach based on evidence. The card should give everyone involved the same practical
    definition of a useful result.
  bridges: []
- id: ai-product-framing.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.ai-product-framing
  title: Spot the better starting point
  markdown: Which pilot description gives us something concrete to evaluate?
  text_mode: Which pilot description gives us something concrete to evaluate?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: Help visitors find current opening hours and cite the schedule.
    - id: b
      text: Use the largest language model available.
    - id: c
      text: Add a conversational interface to every library service.
    answer: a
    reveal_markdown: The opening-hours task describes a user outcome and its evidence. The other choices specify
      technology or broad scope before defining success.
    hint: Trace the example using the rule from the preceding pages.
    id: ai-product-framing.practice.v2.7
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - ai-product-framing.s1
    - ai-product-framing.s2
    - ai-product-framing.s3
    - ai-product-framing.s4
    - ai-product-framing.s5
    - ai-product-framing.s6
    - ai-product-framing.s7
    - ai-product-framing.check
    gate_refs:
    - gate.core
  scene_aliases:
    ai-product-framing.recap: ai-product-framing.check
assessment_families:
- id: ai-product-framing.base
  objective_ref: objective.ai-product-framing
  task: base
  response_type: single_choice
  points: 1
  hint: 'Establish a practical baseline: trace the inputs, operation, and result before choosing.'
  remediation_scene: ai-product-framing.s2
  variants:
  - id: ai-product-framing.base.1
    prompt: Which is a user outcome rather than an implementation label?
    options:
    - id: c
      text: Add vector embeddings
    - id: a
      text: Find the correct policy quickly with evidence
    - id: b
      text: Use a large model
    answer: a
    feedback: The outcome describes a user benefit that can be measured.
    retired: true
  - id: ai-product-framing.base.2
    prompt: Why compare to the current workflow?
    options:
    - id: a
      text: To measure practical value and added review effort
    - id: b
      text: To prove no change is possible
    - id: c
      text: Only to choose colors
    answer: a
    feedback: A baseline anchors usefulness.
    retired: true
- id: ai-product-framing.transfer
  objective_ref: objective.ai-product-framing
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Define a testable first release: trace the inputs, operation, and result before choosing.'
  remediation_scene: ai-product-framing.s4
  variants:
  - id: ai-product-framing.transfer.1
    prompt: Does buying a model service remove all maintenance responsibility?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if billed per token
    answer: a
    feedback: Integration, evaluation, and operations remain.
    retired: true
  - id: ai-product-framing.transfer.2
    prompt: What makes a first release reviewable?
    options:
    - id: b
      text: An unlimited capability promise
    - id: c
      text: Only a model name
    - id: a
      text: Bounded scope, observable success, and fallback behavior
    answer: a
    feedback: Concrete behavior supports testing and iteration.
    retired: true
- id: ai-product-framing.base.v2
  objective_ref: objective.ai-product-framing
  task: base
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: ai-product-framing.s3
  variants:
  - prompt: Which statement defines a user task?
    answer: a
    options:
    - id: a
      text: Help a visitor locate the current schedule
    - id: c
      text: Switch to a new inference provider
    - id: b
      text: Use a model with more layers
    feedback: A task describes what someone needs to accomplish.
    id: ai-product-framing.base.v2.1
  - prompt: What should a baseline comparison measure?
    answer: a
    options:
    - id: b
      text: Response generation time alone
    - id: a
      text: Completion quality and effort across the whole workflow
    - id: c
      text: The number of AI features in each interface
    feedback: Review and correction costs affect whether the task improved.
    id: ai-product-framing.base.v2.2
  - prompt: What role does a ban on sending borrowing records to the assistant play?
    answer: a
    options:
    - id: a
      text: A constraint on the design
    - id: b
      text: A metric to maximize on average
    - id: c
      text: A model architecture choice
    feedback: A constraint limits acceptable designs.
    id: ai-product-framing.base.v2.3
  - prompt: When holiday hours are absent, what fits the stated task?
    answer: a
    options:
    - id: b
      text: Use regular hours without mentioning the gap
    - id: c
      text: Train on the unanswered question before replying
    - id: a
      text: Explain the gap and offer a contact route
    feedback: A fallback handles missing evidence without pretending it was supplied.
    id: ai-product-framing.base.v2.4
- id: ai-product-framing.transfer.v2
  objective_ref: objective.ai-product-framing
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: ai-product-framing.s3
  variants:
  - prompt: The assistant saves visitors time but doubles staff correction work. What should be compared?
    answer: a
    options:
    - id: b
      text: Only the assistant’s reply speed
    - id: a
      text: The combined visitor and staff workflow
    - id: c
      text: Only the visitor satisfaction score
    feedback: A local speedup can shift effort elsewhere.
    id: ai-product-framing.transfer.v2.1
  - prompt: A prominent schedule link already solves the task cheaply. What follows?
    answer: a
    options:
    - id: c
      text: Make the AI match its wording before evaluating
    - id: b
      text: Remove it because the project is called AI
    - id: a
      text: Keep it in the comparison with AI candidates
    feedback: A baseline may remain the best solution.
    id: ai-product-framing.transfer.v2.2
  - prompt: A service is cheap per request but needs extensive integration and review. Which estimate matters?
    answer: a
    options:
    - id: a
      text: The total cost of operating the workflow
    - id: c
      text: The initial setup cost without ongoing use
    - id: b
      text: The request price without staff costs
    feedback: Lifecycle cost includes the work surrounding the model.
    id: ai-product-framing.transfer.v2.3
  - prompt: A pilot keeps giving outdated hours because nobody maintains its source. What needs repair?
    answer: a
    options:
    - id: c
      text: The sampling temperature as the first response
    - id: b
      text: The reply’s writing style
    - id: a
      text: Source ownership and update workflow
    feedback: The failure comes from the information workflow.
    id: ai-product-framing.transfer.v2.4
