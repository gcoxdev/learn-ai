assessment_families:
  - id: ai-product-framing.base
    objective_ref: objective.ai-product-framing
    task: base
    response_type: single_choice
    points: 1
    hint: 'Establish a practical baseline: trace the inputs, operation, and result before choosing.'
    remediation_scene: ai-product-framing.s2
    variants:
      - id: ai-product-framing.base.1
        prompt: Which is a user outcome rather than an implementation label?
        options:
          - id: c
            text: Add vector embeddings
          - id: a
            text: Find the correct policy quickly with evidence
          - id: b
            text: Use a large model
        answer: a
        feedback: The outcome describes a user benefit that can be measured.
        retired: true
      - id: ai-product-framing.base.2
        prompt: Why compare to the current workflow?
        options:
          - id: a
            text: To measure practical value and added review effort
          - id: b
            text: To prove no change is possible
          - id: c
            text: Only to choose colors
        answer: a
        feedback: A baseline anchors usefulness.
        retired: true
  - id: ai-product-framing.transfer
    objective_ref: objective.ai-product-framing
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Define a testable first release: trace the inputs, operation, and result before choosing.'
    remediation_scene: ai-product-framing.s4
    variants:
      - id: ai-product-framing.transfer.1
        prompt: Does buying a model service remove all maintenance responsibility?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if billed per token
        answer: a
        feedback: Integration, evaluation, and operations remain.
        retired: true
      - id: ai-product-framing.transfer.2
        prompt: What makes a first release reviewable?
        options:
          - id: b
            text: An unlimited capability promise
          - id: c
            text: Only a model name
          - id: a
            text: Bounded scope, observable success, and fallback behavior
        answer: a
        feedback: Concrete behavior supports testing and iteration.
        retired: true
  - id: ai-product-framing.base.v2
    objective_ref: objective.ai-product-framing
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: ai-product-framing.s3
    variants:
      - prompt: Which statement defines a user task?
        answer: a
        options:
          - id: a
            text: Help a visitor locate the current schedule
          - id: c
            text: Switch to a new inference provider
          - id: b
            text: Use a model with more layers
        feedback: A task describes what someone needs to accomplish.
        id: ai-product-framing.base.v2.1
        retired: true
      - prompt: What should a baseline comparison measure?
        answer: a
        options:
          - id: b
            text: Response generation time alone
          - id: a
            text: Completion quality and effort across the whole workflow
          - id: c
            text: The number of AI features in each interface
        feedback: Review and correction costs affect whether the task improved.
        id: ai-product-framing.base.v2.2
        retired: true
      - prompt: What role does a ban on sending borrowing records to the assistant play?
        answer: a
        options:
          - id: a
            text: A constraint on the design
          - id: b
            text: A metric to maximize on average
          - id: c
            text: A model architecture choice
        feedback: A constraint limits acceptable designs.
        id: ai-product-framing.base.v2.3
        retired: true
      - prompt: When holiday hours are absent, what fits the stated task?
        answer: a
        options:
          - id: b
            text: Use regular hours without mentioning the gap
          - id: c
            text: Train on the unanswered question before replying
          - id: a
            text: Explain the gap and offer a contact route
        feedback: A fallback handles missing evidence without pretending it was supplied.
        id: ai-product-framing.base.v2.4
        retired: true
  - id: ai-product-framing.transfer.v2
    objective_ref: objective.ai-product-framing
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: ai-product-framing.s3
    variants:
      - prompt: The assistant saves visitors time but doubles staff correction work. What should be compared?
        answer: a
        options:
          - id: b
            text: Only the assistant’s reply speed
          - id: a
            text: The combined visitor and staff workflow
          - id: c
            text: Only the visitor satisfaction score
        feedback: A local speedup can shift effort elsewhere.
        id: ai-product-framing.transfer.v2.1
        retired: true
      - prompt: A prominent schedule link already solves the task cheaply. What follows?
        answer: a
        options:
          - id: c
            text: Make the AI match its wording before evaluating
          - id: b
            text: Remove it because the project is called AI
          - id: a
            text: Keep it in the comparison with AI candidates
        feedback: A baseline may remain the best solution.
        id: ai-product-framing.transfer.v2.2
        retired: true
      - prompt: A service is cheap per request but needs extensive integration and review. Which estimate matters?
        answer: a
        options:
          - id: a
            text: The total cost of operating the workflow
          - id: c
            text: The initial setup cost without ongoing use
          - id: b
            text: The request price without staff costs
        feedback: Lifecycle cost includes the work surrounding the model.
        id: ai-product-framing.transfer.v2.3
        retired: true
      - prompt: A pilot keeps giving outdated hours because nobody maintains its source. What needs repair?
        answer: a
        options:
          - id: c
            text: The sampling temperature as the first response
          - id: b
            text: The reply’s writing style
          - id: a
            text: Source ownership and update workflow
        feedback: The failure comes from the information workflow.
        id: ai-product-framing.transfer.v2.4
        retired: true
  - id: ai-product-framing.base.v3
    objective_ref: objective.ai-product-framing
    task: base
    response_type: single_choice
    points: 1
    hint: Sort each number into success metric, guardrail, or constraint, and compare the AI option with the baseline, not with doing nothing.
    remediation_scene: ai-product-framing.s3
    variants:
      - id: ai-product-framing.base.v3.1
        prompt: 'A pilot card lists "hours questions answered without staff: at least 70%" and "wrong hours given: at most 2%." What role does the second number play?'
        options:
          - id: b
            text: A second success metric that can be traded against the first
          - id: c
            text: The baseline result that the assistant needs to beat
          - id: a
            text: A guardrail that must hold even if the first number looks great
        answer: a
        feedback: The 2% limit is a guardrail, a line the pilot must not cross however well the success metric does. Treating it as a tradeable second success metric is exactly how a launch that answers more questions but misleads more visitors gets approved.
      - id: ai-product-framing.base.v3.2
        prompt: An assistant would save a library $400 a week after its running and error costs. A homepage banner would save $350 a week at almost no cost. What weekly value should drive the decision to build the assistant?
        options:
          - id: c
            text: About $400, the assistant's own net saving
          - id: a
            text: About $50, the assistant's gain over the banner
          - id: b
            text: About $750, the two savings added together
        answer: a
        feedback: The alternative to the assistant isn't nothing; it's the banner. Only the $50 difference is value the assistant adds. Adding the two double-counts the same questions, which can only be answered once.
      - id: ai-product-framing.base.v3.3
        prompt: For a library assistant, a wrong "we're open" costs a visitor a wasted trip (about $20), while "please call the front desk" costs a $1.50 call. The closures page has no entry for a coming holiday. What should the assistant do?
        options:
          - id: b
            text: Give the regular hours for that weekday, since most days are regular
          - id: c
            text: Estimate the hours from last year's schedule for the same holiday
          - id: a
            text: Say the holiday hours aren't published and give the front desk number
        answer: a
        feedback: When the source is silent, a fallback that admits it costs $1.50, while any guess risks the $20 mistake. Last year's schedule sounds careful, but it's still a guess presented as a fact.
      - id: ai-product-framing.base.v3.4
        prompt: On 20 test questions an assistant is right 19 times and a plain link 18 times, but each assistant mistake takes staff ten minutes to fix. What should the comparison measure?
        options:
          - id: a
            text: Total time and cost from question to correct result, including fixes
          - id: b
            text: The share of the 20 test questions that each option answered correctly
          - id: c
            text: How quickly each option shows the visitor its first reply
        answer: a
        feedback: The job ends when the visitor has the right answer, so correction work belongs in the count. Accuracy on 20 questions and reply speed each leave out the ten-minute fixes that decide the comparison.
  - id: ai-product-framing.transfer.v3
    objective_ref: objective.ai-product-framing
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what the cheapest non-AI fix would achieve, which limits can't be traded away, and what one wrong answer costs.
    remediation_scene: ai-product-framing.value
    variants:
      - id: ai-product-framing.transfer.v3.1
        prompt: A city's pothole line wants a chatbot. Half the calls ask "has my report been fixed?", which staff answer by reading a ticket's status. Which baseline belongs in the comparison?
        options:
          - id: c
            text: No baseline, since the chatbot only has to beat having no chatbot
          - id: b
            text: The same chatbot running on a smaller, cheaper language model
          - id: a
            text: A text message sent to the caller whenever their ticket changes
        answer: a
        feedback: A status text is the cheap non-AI fix that could remove most of these calls, so the chatbot has to beat it. A smaller model is another AI option, not a baseline, and comparing against nothing overstates the chatbot's value.
      - id: ai-product-framing.transfer.v3.2
        prompt: A bank's chat assistant raises card disputes resolved in chat from 30% to 55%, but wrongly denied disputes rise from 0.5% to 2%. The guardrail limit was 1%. What should the team do?
        options:
          - id: b
            text: Launch it, because the success metric almost doubled
          - id: a
            text: Hold the launch, because a guardrail was breached
          - id: c
            text: Launch it and track the denial rate as a success metric
        answer: a
        feedback: A guardrail is agreed in advance precisely so a big win elsewhere can't buy it off. Relabeling the denial rate after the fact would remove the protection it was set up to give.
      - id: ai-product-framing.transfer.v3.3
        prompt: A pharmacy chain's bot answers "is my store open?" Each wrong answer costs a customer a wasted trip, while a handoff costs a short call. Which change most improves the bot's value?
        options:
          - id: a
            text: Hand off with the store's number when its hours data is missing or stale
          - id: c
            text: Answer every question itself to push up the share resolved by the bot
          - id: b
            text: Move to a larger model first, then look at the errors it still makes
        answer: a
        feedback: When errors cost far more than handoffs, turning likely errors into handoffs raises net value directly. Answering everything increases the costly mistakes, and a bigger model can't know hours that were never published.
      - id: ai-product-framing.transfer.v3.4
        prompt: A school district may not send student records outside its own servers. A hosted API vendor has the best quality, and a self-hosted model is slightly weaker. For a tool that reads student records, what decides first?
        options:
          - id: b
            text: The per-request price of the API against the cost of hosting
          - id: c
            text: The size of the quality gap between the two models on a test set
          - id: a
            text: The data rule, which rules out sending records to the vendor
        answer: a
        feedback: A constraint isn't traded against price or quality; it removes options before the comparison starts. Price and quality then decide among the designs that remain.
  - id: ai-product-framing.calc.v3
    objective_ref: objective.ai-product-framing
    task: base
    response_type: numeric
    points: 1
    hint: Net value = resolved × saving per question − wrong answers × cost per error − running cost, where wrong answers = resolved × error rate.
    remediation_scene: ai-product-framing.value
    absolute_tolerance: 0.5
    variants:
      - id: ai-product-framing.calc.v3.1
        prompt: An assistant gets 1,000 questions a week and resolves 60% of them. Each resolved question saves $2 of staff time. 5% of resolved answers are wrong, costing $10 each, and running costs are $100 a week. What is its net value in dollars per week?
        answer: 800
        feedback: Resolved = 600, saving 600 × $2 = $1,200. Wrong = 600 × 0.05 = 30, costing $300. Net = 1,200 − 300 − 100 = $800 a week.
      - id: ai-product-framing.calc.v3.2
        prompt: An assistant gets 500 questions a week and resolves 80%. Each resolved question saves $1.50. 2.5% of resolved answers are wrong, costing $30 each, and running costs are $50 a week. What is its net value in dollars per week?
        answer: 250
        feedback: Resolved = 400, saving $600. Wrong = 400 × 0.025 = 10, costing $300. Net = 600 − 300 − 50 = $250 a week. Half the saving goes to paying for errors.
      - id: ai-product-framing.calc.v3.3
        prompt: An assistant gets 2,000 questions a week, resolves 40%, and saves $1 per resolved question. 1% of resolved answers are wrong at $50 each, and running costs are $200 a week. A no-AI baseline saves $300 a week. What is the assistant's value over the baseline, in dollars per week? (Use a minus sign if it's negative.)
        answer: -100
        feedback: Resolved = 800, saving $800. Wrong = 8, costing $400. Net = 800 − 400 − 200 = $200, which is $100 a week less than the baseline, so the answer is −100.
      - id: ai-product-framing.calc.v3.4
        prompt: An assistant gets 400 questions a week, resolves 50%, and saves $3 per resolved question. 4% of resolved answers are wrong, and running costs are $40 a week. A baseline saves $300 a week. Above what cost per wrong answer, in dollars, does the baseline win?
        answer: 32.5
        feedback: Resolved = 200, saving $600; wrong = 8. The assistant ties the baseline when 600 − 8c − 40 = 300, so 8c = 260 and c = $32.50. Any costlier error and the baseline wins.
