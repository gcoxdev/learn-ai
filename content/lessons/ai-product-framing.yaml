schema_version: 0.2-draft
lesson:
  id: ai-product-framing
  version: 0.1.0-draft
  title: Choose a useful problem before choosing a model
  state: draft
  summary: AI product design should define the user task, success criteria, baseline, integration constraints, and
    build-or-buy tradeoffs before committing to model complexity.
  slot: M33.1
  category: learning
  minutes: 12
  sources:
  - title: NIST AI Risk Management Framework
    url: https://www.nist.gov/itl/ai-risk-management-framework
  - title: Rules of Machine Learning
    url: https://developers.google.com/machine-learning/guides/rules-of-ml
objectives:
- id: objective.ai-product-framing
  version: 1-draft
  statement: AI product design should define the user task, success criteria, baseline, integration constraints,
    and build-or-buy tradeoffs before committing to model complexity.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - ai-product-framing.base
  - ai-product-framing.transfer
  prerequisites:
  - anyOf:
    - objective.stakeholders-and-deployment-decisions
  - anyOf:
    - objective.baselines-and-success
scenes:
- id: ai-product-framing.s1
  title: Write the user’s actual outcome
  type: explanation
  depth: intuition
  objective_refs:
  - objective.ai-product-framing
  markdown: “Use an LLM” is an implementation idea. “Help a support agent locate the correct policy quickly with
    traceable evidence” defines a task. Identify current workflow, pain points, acceptable errors, and what happens
    when the system cannot help.
  text_mode: “Use an LLM” is an implementation idea. “Help a support agent locate the correct policy quickly with
    traceable evidence” defines a task. Identify current workflow, pain points, acceptable errors, and what happens
    when the system cannot help.
  bridges: []
- id: ai-product-framing.s2
  title: Establish a practical baseline
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-product-framing
  markdown: Compare against keyword search, a form, a rule, or the current human process. Measure time, correctness,
    effort, and user experience on representative tasks. A model that improves one benchmark may still add more
    review work than it saves.
  text_mode: Compare against keyword search, a form, a rule, or the current human process. Measure time, correctness,
    effort, and user experience on representative tasks. A model that improves one benchmark may still add more
    review work than it saves.
  bridges: []
- id: ai-product-framing.s3
  title: Compare build and service options
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-product-framing
  markdown: An external service may reduce infrastructure effort while introducing dependency, data-flow, cost,
    and configuration constraints. Local or custom models offer different control and maintenance burdens. Compare
    concrete requirements and total lifecycle cost rather than assuming ownership or outsourcing is always preferable.
  text_mode: An external service may reduce infrastructure effort while introducing dependency, data-flow, cost,
    and configuration constraints. Local or custom models offer different control and maintenance burdens. Compare
    concrete requirements and total lifecycle cost rather than assuming ownership or outsourcing is always preferable.
  bridges: []
- id: ai-product-framing.s4
  title: Define a testable first release
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.ai-product-framing
  markdown: Choose a bounded workflow with observable outcomes, usable fallback, and evaluation examples. Record
    which assumptions need a pilot. Expanding scope before measuring the initial use can multiply failure paths
    and make it harder to tell whether the product is helping.
  text_mode: Choose a bounded workflow with observable outcomes, usable fallback, and evaluation examples. Record
    which assumptions need a pilot. Expanding scope before measuring the initial use can multiply failure paths
    and make it harder to tell whether the product is helping.
  bridges: []
- id: ai-product-framing.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.ai-product-framing
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: ai-product-framing.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.ai-product-framing
  markdown: AI product design should define the user task, success criteria, baseline, integration constraints,
    and build-or-buy tradeoffs before committing to model complexity.
  text_mode: AI product design should define the user task, success criteria, baseline, integration constraints,
    and build-or-buy tradeoffs before committing to model complexity.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - ai-product-framing.s1
    - ai-product-framing.s2
    - ai-product-framing.s3
    - ai-product-framing.s4
    - ai-product-framing.check
    - ai-product-framing.recap
    gate_refs:
    - gate.core
assessment_families:
- id: ai-product-framing.base
  objective_ref: objective.ai-product-framing
  task: base
  response_type: single_choice
  points: 1
  hint: 'Establish a practical baseline: trace the inputs, operation, and result before choosing.'
  remediation_scene: ai-product-framing.s2
  variants:
  - id: ai-product-framing.base.1
    prompt: Which is a user outcome rather than an implementation label?
    options:
    - id: c
      text: Add vector embeddings
    - id: a
      text: Find the correct policy quickly with evidence
    - id: b
      text: Use a large model
    answer: a
    feedback: The outcome describes a user benefit that can be measured.
  - id: ai-product-framing.base.2
    prompt: Why compare to the current workflow?
    options:
    - id: a
      text: To measure practical value and added review effort
    - id: b
      text: To prove no change is possible
    - id: c
      text: Only to choose colors
    answer: a
    feedback: A baseline anchors usefulness.
- id: ai-product-framing.transfer
  objective_ref: objective.ai-product-framing
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Define a testable first release: trace the inputs, operation, and result before choosing.'
  remediation_scene: ai-product-framing.s4
  variants:
  - id: ai-product-framing.transfer.1
    prompt: Does buying a model service remove all maintenance responsibility?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if billed per token
    answer: a
    feedback: Integration, evaluation, and operations remain.
  - id: ai-product-framing.transfer.2
    prompt: What makes a first release reviewable?
    options:
    - id: b
      text: An unlimited capability promise
    - id: c
      text: Only a model name
    - id: a
      text: Bounded scope, observable success, and fallback behavior
    answer: a
    feedback: Concrete behavior supports testing and iteration.
