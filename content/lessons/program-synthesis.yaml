schema_version: 0.2-draft
lesson:
  id: program-synthesis
  version: 0.1.0-draft
  title: Search for a program that fits a specification
  state: draft
  summary: Program synthesis constructs executable rules from specifications or examples; inductive logic learning
    adds background knowledge, and testing must distinguish fitting examples from satisfying the intended task.
  slot: M04.7
  category: learning
  minutes: 12
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.program-synthesis
  version: 1-draft
  statement: Program synthesis constructs executable rules from specifications or examples; inductive logic learning
    adds background knowledge, and testing must distinguish fitting examples from satisfying the intended task.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - program-synthesis.base
  - program-synthesis.transfer
  prerequisites:
  - anyOf:
    - objective.proof-search
  - anyOf:
    - objective.algorithms-and-programs
scenes:
- id: program-synthesis.s1
  title: Specify what the program should do
  type: explanation
  depth: intuition
  objective_refs:
  - objective.program-synthesis
  markdown: A synthesizer searches over candidate programs rather than only numeric parameters. A specification
    may be input-output examples, logical constraints, or a formal property. The allowed program language defines
    the search space and its inductive bias. A narrow language can make search tractable but exclude the intended
    solution.
  text_mode: A synthesizer searches over candidate programs rather than only numeric parameters. A specification
    may be input-output examples, logical constraints, or a formal property. The allowed program language defines
    the search space and its inductive bias. A narrow language can make search tractable but exclude the intended
    solution.
  bridges: []
- id: program-synthesis.s2
  title: Examples can underdetermine the answer
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.program-synthesis
  markdown: Examples 1 → 2 and 2 → 4 fit doubling, but also many functions that behave differently elsewhere. A
    candidate that matches examples is consistent with those observations. It is not necessarily the intended general
    rule. More informative examples or stronger specifications reduce ambiguity.
  text_mode: Examples 1 → 2 and 2 → 4 fit doubling, but also many functions that behave differently elsewhere. A
    candidate that matches examples is consistent with those observations. It is not necessarily the intended general
    rule. More informative examples or stronger specifications reduce ambiguity.
  bridges: []
- id: program-synthesis.s3
  title: Use background relations
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.program-synthesis
  markdown: Inductive logic programming can learn rules using examples and background knowledge. Given parent facts
    and grandparent examples, it might seek a two-step parent relation. The result depends on the permitted predicates,
    rule forms, and negative examples. Unstated background assumptions can strongly shape the learned rule.
  text_mode: Inductive logic programming can learn rules using examples and background knowledge. Given parent facts
    and grandparent examples, it might seek a two-step parent relation. The result depends on the permitted predicates,
    rule forms, and negative examples. Unstated background assumptions can strongly shape the learned rule.
  bridges: []
- id: program-synthesis.s4
  title: Verify before relying on execution
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.program-synthesis
  markdown: A generated program can be tested on held-out cases or formally checked against a suitable specification.
    Run unfamiliar code only within an appropriate constrained environment. Test behavior at boundaries and invalid
    inputs. Code that compiles or matches a few examples has passed only part of the verification problem.
  text_mode: A generated program can be tested on held-out cases or formally checked against a suitable specification.
    Run unfamiliar code only within an appropriate constrained environment. Test behavior at boundaries and invalid
    inputs. Code that compiles or matches a few examples has passed only part of the verification problem.
  bridges: []
- id: program-synthesis.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.program-synthesis
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: program-synthesis.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.program-synthesis
  markdown: Program synthesis constructs executable rules from specifications or examples; inductive logic learning
    adds background knowledge, and testing must distinguish fitting examples from satisfying the intended task.
  text_mode: Program synthesis constructs executable rules from specifications or examples; inductive logic learning
    adds background knowledge, and testing must distinguish fitting examples from satisfying the intended task.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - program-synthesis.s1
    - program-synthesis.s2
    - program-synthesis.s3
    - program-synthesis.s4
    - program-synthesis.check
    - program-synthesis.recap
    gate_refs:
    - gate.core
assessment_families:
- id: program-synthesis.base
  objective_ref: objective.program-synthesis
  task: base
  response_type: single_choice
  points: 1
  hint: 'Examples can underdetermine the answer: trace the inputs, operation, and result before choosing.'
  remediation_scene: program-synthesis.s2
  variants:
  - id: program-synthesis.base.1
    prompt: What does program synthesis search for?
    options:
    - id: c
      text: A guaranteed theory of every task
    - id: a
      text: A program meeting a specification within a chosen language
    - id: b
      text: Only a prettier source-code font
    answer: a
    feedback: The candidate space consists of programs or rules constrained by the synthesis setup.
  - id: program-synthesis.base.2
    prompt: Do examples 1 → 2 and 2 → 4 uniquely determine doubling?
    options:
    - id: a
      text: No; multiple functions fit those examples
    - id: b
      text: Yes; two examples always determine every function
    - id: c
      text: Only if examples are integers
    answer: a
    feedback: Finite observations usually leave many possible generalizations.
- id: program-synthesis.transfer
  objective_ref: objective.program-synthesis
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Verify before relying on execution: trace the inputs, operation, and result before choosing.'
  remediation_scene: program-synthesis.s4
  variants:
  - id: program-synthesis.transfer.1
    prompt: A learned rule fits all positive examples but predicts everything positive. What additional evidence
      helps?
    options:
    - id: a
      text: Negative examples and an appropriate specification
    - id: b
      text: Only more copies of the same positives
    - id: c
      text: A longer rule name
    answer: a
    feedback: Negative evidence and constraints can rule out overly broad hypotheses.
  - id: program-synthesis.transfer.2
    prompt: Generated code compiles successfully. What remains unestablished?
    options:
    - id: b
      text: Whether its syntax was accepted
    - id: c
      text: Whether a compiler ran
    - id: a
      text: Whether its behavior meets the intended specification
    answer: a
    feedback: Compilation is a syntactic and limited semantic check, not full task validation.
