scenes:
- title: Describe a collection of possibilities
  markdown: 'Imagine a bag with two red counters, three blue counters, and five green counters. A uniformly chosen
    counter has probabilities 0.2, 0.3, and 0.5 for those colors. There are ten counters altogether; each color
    receives its share of the total.


    For mutually exclusive outcomes covering every possibility, probabilities lie between zero and one and add to
    one. A probability of 0.2 means 20%, not two counters in every small sample with certainty.'
  id: probability.s1
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.probability
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Weights become probabilities by normalization
  markdown: 'Suppose a toy system assigns nonnegative weights 2, 3, and 5 to three choices. Their total is 10. Dividing
    each by 10 gives 0.2, 0.3, and 0.5. If every weight doubles, the normalized shares stay the same.


    A zero total cannot be used as a denominator. Negative numbers cannot directly serve as these weights. A later
    softmax lesson converts arbitrary real scores into positive weights before normalizing.'
  type: table
  columns:
  - Outcome
  - Weight
  - Normalized share
  rows:
  - - Red
    - 2
    - 0.2
  - - Blue
    - 3
    - 0.3
  - - Green
    - 5
    - 0.5
  id: probability.s2
  depth: mechanics
  objective_refs:
  - objective.probability
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: A condition changes the relevant possibilities
  markdown: 'Now you are told the counter is not green. Only the two red and three blue counters remain possible.
    Red has conditional probability 2 / 5 = 0.4. We did not add any red counters; we changed the information being
    conditioned on.


    A language model similarly uses a context when assigning continuation probabilities. The distribution after
    “pour a cup of” can differ from the distribution after “repair the broken”.'
  id: probability.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.probability
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Sampling is not the same as taking the maximum
  markdown: 'A random draw according to [0.2, 0.3, 0.5] can select the first outcome. Always choosing the largest
    probability always selects the third. Those are different selection procedures.


    Across many independent draws from the same fixed bag, frequencies tend toward its probabilities. A short sequence
    may look quite uneven. Changing the bag or the condition invalidates the assumption that each draw follows the
    old distribution.'
  id: probability.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.probability
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Probability depends on the question
  markdown: '“The model gives this continuation probability 0.8” and “this claim has an 80% chance of being factually
    correct” are different statements. You need a reason to connect the two. A continuation score is not calibrated
    factual confidence by definition.


    Likewise, independence is an assumption: one event being observed does not change the probability of the other.
    Do not multiply arbitrary event probabilities as if independence had already been established.'
  id: probability.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.probability
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- id: probability.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.probability
  markdown: Use a fresh example to check what you can explain. Hints remain available for practice.
  text_mode: Labeled controls and untimed feedback.
  takeaway: A probability is a share of a specified set of possibilities under stated information. Identify the
    outcomes, the condition, and the selection procedure before interpreting the number.
