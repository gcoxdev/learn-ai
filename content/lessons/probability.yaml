assessment_families:
  - response_type: numeric
    hint: Add the weights, then divide the selected weight by that total.
    variants:
      - prompt: Three outcomes have weights 1, 2, and 7. What is the normalized probability of the second? Enter a decimal.
        answer: 0.2
        feedback: The total is 10, so the second outcome receives 2 / 10 = 0.2.
        id: probability.base.1
        retired: true
      - prompt: Two outcomes have weights 3 and 2. What is the normalized probability of the first? Enter a decimal.
        answer: 0.6
        feedback: The total is 5, so the first receives 3 / 5 = 0.6. A weight of 3 is not itself a probability.
        id: probability.base.2
        retired: true
    id: probability.base
    objective_ref: objective.probability
    task: base
    points: 1
    remediation_scene: probability.s1
  - response_type: single_choice
    hint: A conditional probability is computed within the possibilities compatible with the condition.
    variants:
      - prompt: A bag has 4 red, 1 blue, and 5 green counters. Given that a draw is not green, what is the probability of red?
        options:
          - id: a
            text: '0.4'
          - id: b
            text: '1.0'
          - id: answer
            text: '0.8'
        answer: answer
        feedback: Among the five remaining counters, four are red. Conditioning changes the denominator from ten to five.
        id: probability.transfer.1
        retired: true
      - prompt: A text model assigns a continuation 0.9 probability. What can you infer directly?
        options:
          - id: b
            text: Every generation will select that continuation.
          - id: answer
            text: It gives that continuation a high share under its model and context.
          - id: a
            text: The continuation is proven factually true.
        answer: answer
        feedback: The score concerns the modeled continuation distribution. Neither factual verification nor deterministic selection follows just from a high probability.
        id: probability.transfer.2
        retired: true
    id: probability.transfer
    objective_ref: objective.probability
    task: transfer
    points: 1
    remediation_scene: probability.s1
  - id: probability.base.v2
    objective_ref: objective.probability
    task: base
    response_type: numeric
    points: 1
    hint: Find the group named after "given," and count only inside it. Your answer is the matching count divided by that group's size, not by the grand total.
    remediation_scene: probability.s3
    absolute_tolerance: 0.006
    variants:
      - id: probability.base.v2.1
        prompt: Of 50 photos, 30 show a dog. Twelve of the dog photos also show a person, and 8 of the photos without a dog show a person. What is P(dog | person)? Enter a decimal to two places.
        answer: 0.6
        feedback: Photos with a person number 12 + 8 = 20, and 12 of them show a dog, so 12/20 = 0.60. Dividing by the 30 dog photos gives 0.40, which is the reverse, P(person | dog).
      - id: probability.base.v2.2
        prompt: A chatbot gives the replies "yes," "no," and "maybe" the weights 3, 5, and 12. A rule then forbids "maybe." Given that the reply is not "maybe," what is the probability of "no"? Enter a decimal to two places.
        answer: 0.625
        feedback: 'Only "yes" and "no" remain, with total weight 3 + 5 = 8, so P(no | not maybe) = 5/8 = 0.625 (0.62 or 0.63). Dividing by the full total 20 gives 0.25, which ignores the condition.'
      - id: probability.base.v2.3
        prompt: A clinic sees 1,000 patients, and 50 have the flu. A rapid test is positive for 45 of the flu patients and for 95 of the others. What is P(flu | positive)? Enter a decimal to two places.
        answer: 0.32
        feedback: Positives number 45 + 95 = 140, and 45 of them have the flu, so 45/140 ≈ 0.32. The tempting 0.90 is P(positive | flu) = 45/50, which counts inside the wrong group.
      - id: probability.base.v2.4
        prompt: A support team logs 400 tickets, and 120 are about billing. Ninety of the billing tickets are marked urgent, and 70 of the other tickets are marked urgent. What is P(billing | urgent)? Enter a decimal to two places.
        answer: 0.5625
        feedback: Urgent tickets number 90 + 70 = 160, and 90 are about billing, so 90/160 ≈ 0.56. The value 0.75 is P(urgent | billing) = 90/120, counted inside the billing row instead of the urgent column.
  - id: probability.transfer.v2
    objective_ref: objective.probability
    task: transfer
    response_type: single_choice
    points: 1
    hint: Say which group the probability counts within (the part after the bar) and how the outcome gets chosen, by a random draw or by picking the top.
    remediation_scene: probability.s3
    variants:
      - id: probability.transfer.v2.1
        prompt: 'A leaflet says, "90% of people with the disease test positive." Your friend tests positive and concludes there is a 90% chance they have it. What went wrong?'
        options:
          - id: b
            text: The chance is really 10%, since 90% applies to the healthy people
          - id: c
            text: No probability applies until a second test confirms the first result
          - id: a
            text: 90% is P(positive | disease), but they need P(disease | positive)
        answer: a
        feedback: The leaflet counts inside the group who have the disease. Your friend needs the share of positive testers who have it, which also depends on how rare the disease is and how often healthy people test positive. Subtracting from 100% doesn't swap the two sides of the bar.
      - id: probability.transfer.v2.2
        prompt: A chatbot's next-word probabilities are "sunny" 0.6, "rainy" 0.3, and "snowy" 0.1, and it samples its words. About how often will "snowy" appear in 1,000 replies?
        options:
          - id: c
            text: About 333 times, since each of the three words takes a turn
          - id: a
            text: About 100 times, one reply in ten on average
          - id: b
            text: Never, since sampling settles on "sunny," the top word
        answer: a
        feedback: Sampling draws in proportion to the probabilities, so 0.1 × 1,000 ≈ 100. Picking the top word every time is greedy decoding, a different procedure from sampling.
      - id: probability.transfer.v2.3
        prompt: A model gives the answer "Canberra" a probability of 0.9 for a quiz question. Which reading is justified from that number alone?
        options:
          - id: b
            text: There is a 90% chance that Canberra is the true answer
          - id: a
            text: The model puts 90% of its prediction on Canberra here
          - id: c
            text: Sampling from the model will output Canberra every time
        answer: a
        feedback: The 0.9 is a share of the model's own prediction. It equals a 90% chance of being right only if the model is calibrated, which you have to measure. Sampling would still pick another answer about one time in ten.
      - id: probability.transfer.v2.4
        prompt: In a photo set, 30% of photos are outdoors and 40% show a dog. A teammate says 12% must be outdoor dog photos, because 0.3 × 0.4 = 0.12. When is that multiplication valid?
        options:
          - id: c
            text: Whenever each of the two probabilities is below 0.5
          - id: b
            text: Whenever the photo set is large enough to trust
          - id: a
            text: When being outdoors doesn't change the chance of a dog
        answer: a
        feedback: Multiplying works only for independent events. If dogs appear more often in outdoor photos, the true share of outdoor dog photos is above 12%, however many photos you have.
