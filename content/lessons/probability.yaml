schema_version: 0.2-draft
lesson:
  id: probability
  version: 0.4.0-draft
  title: Probability without the mystery
  state: draft
  summary: Almost all spam has a link, yet most emails with links aren't spam. Learn the three probability moves AI uses constantly, normalize, condition, and sample, in one short detour.
  slot: B09
  category: bridge
  sources:
    - title: Deep Learning — probability and information theory
      url: https://www.deeplearningbook.org/contents/prob.html
objectives:
  - id: objective.probability
    version: 2-draft
    statement: Normalize finite outcome weights and interpret conditional probability without treating likelihood as certainty.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - probability.base.v2
      - probability.transfer.v2
    prerequisites:
      - anyOf:
          - objective.arithmetic
scenes:
  - title: A probability is a share of a total
    markdown: |-
      A spam filter says an email is 97% likely to be junk. A chatbot often picks its next word at random, using odds it has computed. To follow either one, you need three moves: turn counts into shares, narrow the shares when you learn something, and draw from them.

      Take a bag of 10 sweets: 2 red, 3 blue, and 5 green. Reach in without looking. The **probability** of red is red's share of the total: 2/10 = 0.2. Blue gets 3/10 = 0.3 and green 5/10 = 0.5. Whenever exactly one outcome happens, each probability lies between 0 (impossible) and 1 (certain), and together they add to 1.
    id: probability.s1
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.probability
  - title: Divide each weight by the total
    markdown: |-
      Models rarely produce tidy probabilities. They produce **weights**, nonnegative scores where bigger means "more likely," and divide each by the total. That step is called **normalizing**. If a model finishing "My favorite color is…" gives red, blue, and green the weights in the table, the total is 10 and each probability is its weight divided by 10.

      :::example Normalize a new set of weights
      Three words get weights 1, 3, and 4. The total is 1 + 3 + 4 = 8. The probabilities are 1/8 = 0.125, 3/8 = 0.375, and 4/8 = 0.5. Check: 0.125 + 0.375 + 0.5 = 1.
      :::

      Doubling every weight changes nothing, because the total doubles too. Real models output raw scores that can be negative, so they first make each score positive with the exponential function, then normalize. That recipe is **softmax**, which returns in the transformer and decoding lessons.
    type: table
    columns:
      - Outcome
      - Weight
      - Normalized share
    rows:
      - - Red
        - 2
        - 0.2
      - - Blue
        - 3
        - 0.3
      - - Green
        - 5
        - 0.5
    id: probability.s2
    depth: mechanics
    objective_refs:
      - objective.probability
  - title: '"Given" shrinks the total'
    markdown: |-
      A friend peeks into the bag and says, "It isn't green." Only 5 sweets remain possible, 2 red and 3 blue, so the probability of red **given** not-green is 2/5 = 0.4. We write P(red | not green) and read the bar as "given." This is a **conditional probability**: no red sweets were added, but the group you count within got smaller.

      :::predict Given that the sweet is not blue, what is the probability it is red?
      Set aside the 3 blue sweets. Seven remain, and 2 of them are red, so P(red | not blue) = 2/7 ≈ 0.29.
      :::

      A spam filter does the same thing. Picture 100 emails:

      | | Has a link | No link | Total |
      | --- | ---: | ---: | ---: |
      | Spam | 19 | 1 | 20 |
      | Real mail | 48 | 32 | 80 |
      | Total | 67 | 33 | 100 |

      A new email arrives with a link. Count only inside the "Has a link" column: 67 emails, 19 of them spam. So P(spam | link) = 19/67 ≈ 0.28.

      :::mixup "Almost all spam has a link, so an email with a link is almost surely spam."
      That swaps the two sides of the bar. P(link | spam) = 19/20 = 0.95 counts inside the spam *row*. P(spam | link) = 19/67 ≈ 0.28 counts inside the link *column*. Most emails with links are ordinary mail, because ordinary mail is far more common. Bayes' rule, in the probability module, converts one number into the other.
      :::

      Check the table with 100,000 simulated emails at the same rates:

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      n = 100_000
      spam = rng.random(n) < 0.20                  # 20% of mail is spam
      link_rate = np.where(spam, 0.95, 0.60)       # links: 95% of spam, 60% of real mail
      link = rng.random(n) < link_rate

      print("P(link | spam) ≈", round(link[spam].mean(), 3))
      print("P(spam | link) ≈", round(spam[link].mean(), 3))
      exact = 0.20 * 0.95 / (0.20 * 0.95 + 0.80 * 0.60)
      print("exact P(spam | link) =", round(exact, 3))
      ```

      The simulation gives about 0.95 and 0.285 (the exact value is 0.284), matching the table. Now make spam half of all mail (change 0.20 and 0.80 to 0.50): P(spam | link) jumps to 0.613, while P(link | spam) stays near 0.95.
    id: probability.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.probability
  - title: Drawing at random is not picking the top
    markdown: |-
      A chatbot has next-word probabilities 0.2 for "red," 0.3 for "blue," and 0.5 for "green." It can choose in two ways:

      - **Sampling** draws at random in proportion to the probabilities, so "red" comes out about one time in five.
      - **Picking the most likely** word, often called greedy decoding, chooses "green" every single time.

      Same probabilities, very different behavior. Run both:

      ```python run
      import numpy as np

      rng = np.random.default_rng(3)
      words = np.array(["red", "blue", "green"])
      probs = [0.2, 0.3, 0.5]

      for n in [10, 10_000]:
          draws = rng.choice(words, size=n, p=probs)
          shares = [round(float(np.mean(draws == w)), 3) for w in words]
          print(f"sample {n:>6} times:", dict(zip(words.tolist(), shares)))

      print("pick the top:  ", words[np.argmax(probs)], "(every time)")
      ```

      In 10 draws, red shows up 4 times and beats green; short runs are lumpy. In 10,000 draws the shares settle near 0.2, 0.3, and 0.5. Change the seed and watch only the short run jump around. The decoding lesson builds temperature and top-p settings on this choice.
    id: probability.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.probability
  - title: 0.8 of what?
    markdown: |-
      A model gives the next word "Paris" a probability of 0.8. That is a share of the model's own prediction, not an 80% chance the sentence is true. The two match only when a model is **calibrated**: of all the times it says 0.8, it's right about 80% of the time. You measure calibration; the lesson on calibrated decisions shows how.

      Be just as careful before multiplying. P(A and B) = P(A) × P(B) works only when A and B are **independent**: learning one doesn't change the chance of the other. In the email table, P(spam) × P(link) = 0.2 × 0.67 = 0.134, but the true share of spam with a link is 19/100 = 0.19, because spam is more likely to carry a link.
    id: probability.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.probability
  - id: probability.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.probability
    markdown: Photo sets, clinic tests, support tickets, and a chatbot's word choices ask you to count inside the right group and say which side of the bar a number belongs on.
    takeaway: |-
      A probability is a share of a total. "Given" shrinks the total you count within, so P(A | B) and P(B | A) can be very different numbers.
  - id: probability.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.probability
    markdown: |-
      A probability is a share of a specified set of possibilities under stated information. Identify the outcomes, the condition, and the selection procedure before interpreting the number.
