assessment_families:
- id: data-provenance.base
  objective_ref: objective.data-provenance
  task: base
  response_type: single_choice
  points: 1
  hint: 'Document the decisions: trace the inputs, operation, and result before choosing.'
  remediation_scene: data-provenance.s2
  variants:
  - id: data-provenance.base.1
    prompt: What does provenance describe?
    options:
    - id: c
      text: Only the model’s final score
    - id: a
      text: The origin and transformation history of data
    - id: b
      text: Only its compressed file size
    answer: a
    feedback: Lineage connects records to collection and processing decisions.
  - id: data-provenance.base.2
    prompt: Two sources define the same label differently. What is needed?
    options:
    - id: a
      text: Record and reconcile the definitions before treating targets as equivalent
    - id: b
      text: Assume identical column names prove identical meaning
    - id: c
      text: Discard all documentation
    answer: a
    feedback: Label semantics are part of the learning task.
- id: data-provenance.transfer
  objective_ref: objective.data-provenance
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Maintain lineage through processing: trace the inputs, operation, and result before choosing.'
  remediation_scene: data-provenance.s4
  variants:
  - id: data-provenance.transfer.1
    prompt: A web page is publicly readable. Does that alone establish unrestricted permission for every use?
    options:
    - id: a
      text: No; use conditions need separate consideration
    - id: b
      text: Yes; accessibility settles all conditions
    - id: c
      text: Only if the page contains numbers
    answer: a
    feedback: Access and authorized use are separate questions.
  - id: data-provenance.transfer.2
    prompt: Filtering removes many examples from one subgroup. What should be documented?
    options:
    - id: b
      text: Only the new row count
    - id: c
      text: Nothing if validation accuracy rises
    - id: a
      text: The rule, affected population, and resulting coverage change
    answer: a
    feedback: Preprocessing can alter representativeness and the meaning of evaluation.
