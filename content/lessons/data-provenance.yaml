schema_version: 0.2-draft
lesson:
  id: data-provenance
  version: 0.1.0-draft
  title: Where did this dataset come from?
  state: draft
  summary: Data provenance records origin, collection conditions, permissions, annotation choices, and transformations
    so a dataset can be evaluated and maintained responsibly.
  slot: M03.3
  category: learning
  minutes: 12
  sources:
  - title: Datasheets for Datasets
    url: https://arxiv.org/abs/1803.09010
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.data-provenance
  version: 1-draft
  statement: Data provenance records origin, collection conditions, permissions, annotation choices, and transformations
    so a dataset can be evaluated and maintained responsibly.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - data-provenance.base
  - data-provenance.transfer
  prerequisites:
  - anyOf:
    - objective.data
scenes:
- id: data-provenance.s1
  title: A dataset has a history
  type: explanation
  depth: intuition
  objective_refs:
  - objective.data-provenance
  markdown: 'A row is the end of a collection process: someone selected a source, measured or recorded an event,
    and assigned fields. Provenance records that chain. A training file without its collection context can hide
    selection effects, duplicate records, changing definitions, or restrictions on appropriate use.'
  text_mode: 'A row is the end of a collection process: someone selected a source, measured or recorded an event,
    and assigned fields. Provenance records that chain. A training file without its collection context can hide
    selection effects, duplicate records, changing definitions, or restrictions on appropriate use.'
  bridges: []
- id: data-provenance.s2
  title: Document the decisions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data-provenance
  markdown: Record collection purpose, population, time range, instruments, permissions, and retention choices.
    Annotation instructions should define what a label means and how disagreements are resolved. Consent and rights
    require attention to the actual collection and use context; public accessibility alone does not establish unrestricted
    permission.
  text_mode: Record collection purpose, population, time range, instruments, permissions, and retention choices.
    Annotation instructions should define what a label means and how disagreements are resolved. Consent and rights
    require attention to the actual collection and use context; public accessibility alone does not establish unrestricted
    permission.
  bridges: []
- id: data-provenance.s3
  title: Trace one label
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data-provenance
  markdown: Suppose “late delivery” means more than two days late in one source and more than one day late in another.
    Combining them without recording definitions creates inconsistent targets. Preserve source and annotation version,
    reconcile definitions where justified, or model the distinction explicitly. A larger table is not necessarily
    a more coherent dataset.
  text_mode: Suppose “late delivery” means more than two days late in one source and more than one day late in another.
    Combining them without recording definitions creates inconsistent targets. Preserve source and annotation version,
    reconcile definitions where justified, or model the distinction explicitly. A larger table is not necessarily
    a more coherent dataset.
  bridges: []
- id: data-provenance.s4
  title: Maintain lineage through processing
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data-provenance
  markdown: Filtering, redaction, deduplication, augmentation, and relabeling change the dataset. Record their versions
    and effects, including which groups are removed. Dataset documentation should make appropriate uses, known limitations,
    and update procedures visible. It supports investigation and accountability; it does not certify that every
    example is correct.
  text_mode: Filtering, redaction, deduplication, augmentation, and relabeling change the dataset. Record their
    versions and effects, including which groups are removed. Dataset documentation should make appropriate uses,
    known limitations, and update procedures visible. It supports investigation and accountability; it does not
    certify that every example is correct.
  bridges: []
- id: data-provenance.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.data-provenance
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: data-provenance.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.data-provenance
  markdown: Data provenance records origin, collection conditions, permissions, annotation choices, and transformations
    so a dataset can be evaluated and maintained responsibly.
  text_mode: Data provenance records origin, collection conditions, permissions, annotation choices, and transformations
    so a dataset can be evaluated and maintained responsibly.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - data-provenance.s1
    - data-provenance.s2
    - data-provenance.s3
    - data-provenance.s4
    - data-provenance.check
    - data-provenance.recap
    gate_refs:
