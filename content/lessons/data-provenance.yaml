schema_version: 0.2-draft
lesson:
  id: data-provenance
  version: 0.4.0-draft
  title: Where did this dataset come from?
  state: draft
  summary: Twelve thousand leaf photos, three sources, one folder. Learn to write the "ingredient card" that tells you which photos to trust, and track down a bad batch after it ships.
  slot: M03.3
  category: learning
  sources:
    - title: Gebru et al. — Datasheets for Datasets
      url: https://arxiv.org/abs/1803.09010
    - title: Dive into Deep Learning — environment and distribution shift
      url: https://d2l.ai/chapter_linear-classification/environment-and-distribution-shift.html
    - title: "Using Deep Learning for Image-Based Plant Disease Detection (Mohanty, Hughes & Salathé, 2016)"
      url: https://arxiv.org/abs/1604.03169
  archetype: mechanism
objectives:
  - id: objective.data-provenance
    version: 4-draft
    statement: Document a dataset’s origin, transformations, permissions context, and collection limits without confusing public availability with suitability.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - data-provenance.base.v3
      - data-provenance.transfer.v3
    prerequisites:
      - anyOf:
          - objective.data
scenes:
  - id: data-provenance.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.data-provenance
    title: Three sources, one folder
    markdown: |-
      Priya's team is building a phone app that spots disease on tomato leaves. They've gathered 12,000 labeled photos from three places:

      | Source | Photos | Taken where | Label written by |
      | --- | ---: | --- | --- |
      | A university lab | 6,000 | Picked leaves on a gray tabletop | Plant pathologists |
      | A gardening forum | 4,000 | Phone photos in real gardens | Each post's title |
      | Batch B | 2,000 | Web images | An earlier version of their own model |

      Once the files are resized and poured into one folder, they all look the same: a 256 × 256 image and a label. Nothing inside a file says which row of this table it came from, and in six months nobody on the team will remember.

      The record of where each example came from and what was done to it is its **provenance**. It's the difference between "12,000 labeled photos" and knowing which 2,000 labels were a machine's guesses.
  - id: data-provenance.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.data-provenance
    title: Write an ingredient card
    markdown: |-
      A food label says what's inside and where it came from. For each source, Priya writes the same kind of card:

      - **Why and by whom:** collected by the university lab for a 2019 study.
      - **What and how:** leaves picked from greenhouse plants, photographed indoors on a gray background.
      - **Labels:** diagnosed by two plant pathologists.
      - **Changes:** resized to 256 × 256; blurry photos removed.
      - **Permissions:** the lab's license allows research use; commercial use needs written permission.
      - **Gaps:** no field photos, no nighttime light, greenhouse plants only.

      Each time the team changes the data, they freeze a named snapshot, a **dataset version** (v1, v2, v3). If accuracy jumps from 88% to 93% between two runs, the version numbers tell you whether the model got better or the data changed underneath it.

      :::story Datasheets for datasets
      In 2018, Timnit Gebru and colleagues pointed out that electronic components, even cheap ones, ship with a datasheet describing how it was made, how it was tested, and the conditions it's safe to use in. Datasets usually came with nothing. Their paper, *Datasheets for Datasets*, proposed a standard set of questions every dataset's creators should answer, an idea today's dataset cards follow.
      :::
  - id: data-provenance.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.data-provenance
    title: Represented isn't the same as representative
    markdown: |-
      The lab photos *represent* lab photos perfectly. They are not *representative* of what farmers will photograph: a leaf still on the plant, with soil, shadows, and other leaves behind it. The forum photos have a different skew. People post when a plant looks alarming and they're stumped, so the forum is full of dramatic late-stage disease and nearly empty of healthy leaves or faint early spots.

      When the way data is collected makes some cases more likely to be included than they are in real use, that's **selection bias**. You can't see it by looking at any one photo; you see it by reading the card.

      :::predict The model scores 97% on a test set drawn from the same folder. How will it do on farmers' phone photos?
      Probably much worse. The test photos share the folder's collection habits, so the test can't reveal them, and the model may have learned shortcuts like "gray background means one of the lab's diseases." A widely cited 2016 study (Mohanty and colleagues) trained on leaves photographed against plain backgrounds. It reported over 99% accuracy on held-out photos from that same collection, and far lower accuracy on leaf photos gathered elsewhere.
      :::
  - id: data-provenance.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.data-provenance
    title: Who wrote the label?
    markdown: |-
      A label is a claim, and different sources make claims of very different quality. Priya asks a pathologist to recheck 50 random forum photos. She agrees with 38 of the post titles: 38 ÷ 50 = 76%. So roughly one forum label in four is wrong. Batch B is worse in a sneakier way: its labels came from an earlier model, so training on them teaches the new model to repeat the old one's mistakes.

      Because the team recorded each photo's source, they can act: recheck forum labels for the diseases that matter most, and measure accuracy on pathologist-labeled test photos. Log every change to the data too, because changes cut both ways: stripping GPS locations from forum photos protects posters' addresses, while cropping may cut off the one spot that showed the disease.

      :::story A dataset nobody looked at
      The *80 Million Tiny Images* dataset, released by MIT researchers in 2008, was built by searching the web for tens of thousands of English nouns and labeling each result with the word used to find it. No person checked the pairs. In 2020, researchers found racist and misogynistic slurs among its labels, attached to photos of real people, and MIT took the dataset offline. Nobody had checked what the labels said, because nobody had written them.
      :::
  - id: data-provenance.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.data-provenance
    title: Downloadable isn't the same as allowed
    markdown: |-
      Every forum photo downloaded without a problem. That answers exactly one question: can you get it? It doesn't tell you whether you may use it, and for what. The forum's terms may forbid collecting posts automatically. Many photos carry a Creative Commons "NC" license, which rules out commercial use. Some show people's faces or houses.

      :::mixup "It's public on the web, so we can use it for anything."
      Public means reachable. Permission comes from the license, the site's terms, and privacy law, and they often differ from photo to photo. If the card's "Permissions" line says "unknown," that's a question to settle before training, not after launch.
      :::
  - id: data-provenance.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.data-provenance
    title: Trace a bad batch
    markdown: |-
      In March, a farmer complains that the model keeps calling early blight "late blight." Priya's team finds that Batch B makes exactly this mistake on hundreds of photos. Which models are affected?

      Because they kept a **lineage**, a record linking each dataset version to the sources that went into it and each model to the dataset version it was trained on, the answer takes minutes. Batch B entered in dataset v2. v3 was built from v2 plus the forum photos. Model m5 was trained on v2 and m6, the one farmers use today, on v3. Both are affected.

      The fix follows the same chain: build v4 without Batch B, train m7 on it, and compare m6 and m7 on a pathologist-checked test set.
    diagram:
      caption: The lineage that let Priya's team find every model trained on Batch B.
      description: Lab photos and Batch B, labeled by an earlier model, both feed dataset v2. Dataset v2 plus the forum photos make dataset v3. Model m5 is trained on v2, and model m6, the one in use, is trained on v3. So Batch B reaches both models.
      nodes:
        - id: lab
          label: Lab photos
          note: pathologist labels
          col: 0
          row: 0
          tone: data
        - id: forum
          label: Forum photos
          note: labels from post titles
          col: 0
          row: 2
          tone: data
        - id: batchb
          label: Batch B
          note: labeled by an old model
          col: 0
          row: 1
          tone: warn
        - id: v2
          label: Dataset v2
          col: 2
          row: 0
          tone: accent
        - id: v3
          label: Dataset v3
          col: 2
          row: 2
          tone: accent
        - id: m5
          label: Model m5
          note: older model
          col: 4
          row: 0
          tone: muted
        - id: m6
          label: Model m6
          note: in use by farmers
          col: 4
          row: 2
      edges:
        - from: lab
          to: v2
        - from: batchb
          to: v2
        - from: v2
          to: v3
          label: copied into
        - from: forum
          to: v3
        - from: v2
          to: m5
          label: trained
        - from: v3
          to: m6
          label: trained
  - id: data-provenance.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.data-provenance
    title: Spot the missing ingredient
    markdown: |-
      A dataset card gives a download link and row count but no collection method. What remains hard to judge?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: Which cases the collection process may have excluded.
        - id: b
          text: Whether the file has exactly the stated number of rows.
        - id: c
          text: Whether a browser can open the recorded link.
      answer: a
      reveal_markdown: |-
        Collection method is needed to reason about selection and coverage; access and size do not provide that history.
      hint: A link and a row count tell you the file exists. What would you need to know about how the rows were gathered?
      id: data-provenance.practice.v2.7
  - id: data-provenance.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.data-provenance
    markdown: A clinic dataset, a call-recording archive, a batch of wrong transcripts, and some shrunken bird photos ask what their ingredient cards should say.
    takeaway: |-
      For every source, know where it came from, who wrote its labels, what was changed, who it leaves out, and what you're allowed to do with it. Keep the chain from source to model so you can trace a problem back.
  - id: data-provenance.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.data-provenance
    markdown: |-
      Data provenance records origin, collection conditions, permissions, annotation choices, and transformations so a dataset can be evaluated and maintained responsibly.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - data-provenance.s1
        - data-provenance.s2
        - data-provenance.s3
        - data-provenance.s4
        - data-provenance.s5
        - data-provenance.s6
        - data-provenance.s7
        - data-provenance.check
      gate_refs:
        - gate.core
  scene_aliases:
    data-provenance.recap: data-provenance.check
assessment_families:
  - id: data-provenance.base
    objective_ref: objective.data-provenance
    task: base
    response_type: single_choice
    points: 1
    hint: 'Document the decisions: trace the inputs, operation, and result before choosing.'
    remediation_scene: data-provenance.s2
    variants:
      - id: data-provenance.base.1
        prompt: What does provenance describe?
        options:
          - id: c
            text: Only the model’s final score
          - id: a
            text: The origin and transformation history of data
          - id: b
            text: Only its compressed file size
        answer: a
        feedback: Lineage connects records to collection and processing decisions.
        retired: true
      - id: data-provenance.base.2
        prompt: Two sources define the same label differently. What is needed?
        options:
          - id: a
            text: Record and reconcile the definitions before treating targets as equivalent
          - id: b
            text: Assume identical column names prove identical meaning
          - id: c
            text: Discard all documentation
        answer: a
        feedback: Label semantics are part of the learning task.
        retired: true
  - id: data-provenance.transfer
    objective_ref: objective.data-provenance
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Maintain lineage through processing: trace the inputs, operation, and result before choosing.'
    remediation_scene: data-provenance.s4
    variants:
      - id: data-provenance.transfer.1
        prompt: A web page is publicly readable. Does that alone establish unrestricted permission for every use?
        options:
          - id: a
            text: No; use conditions need separate consideration
          - id: b
            text: Yes; accessibility settles all conditions
          - id: c
            text: Only if the page contains numbers
        answer: a
        feedback: Access and authorized use are separate questions.
        retired: true
      - id: data-provenance.transfer.2
        prompt: Filtering removes many examples from one subgroup. What should be documented?
        options:
          - id: b
            text: Only the new row count
          - id: c
            text: Nothing if validation accuracy rises
          - id: a
            text: The rule, affected population, and resulting coverage change
        answer: a
        feedback: Preprocessing can alter representativeness and the meaning of evaluation.
        retired: true
  - id: data-provenance.base.v2
    objective_ref: objective.data-provenance
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: data-provenance.s3
    variants:
      - prompt: What does provenance primarily record?
        answer: a
        options:
          - id: a
            text: Origins and transformations of data
          - id: b
            text: The next token a model will generate
          - id: c
            text: The learning rate used for every future model
        feedback: Provenance concerns the data’s history, with links to transformations and versions.
        id: data-provenance.base.v2.1
        retired: true
      - prompt: Which distinction matters for interpreting a label?
        answer: a
        options:
          - id: b
            text: Whether labels were encoded as integers instead of strings
          - id: a
            text: Whether a human, rule, or model produced it
          - id: c
            text: Whether a high agreement rate is sufficient to establish factual correctness
        feedback: Label origin affects its error process and the evidence it supplies.
        id: data-provenance.base.v2.2
        retired: true
      - prompt: A ticket dataset contains only successful submissions. Which cases may be missing?
        answer: a
        options:
          - id: b
            text: Every ticket containing a common word
          - id: a
            text: People who abandoned the process before submitting
          - id: c
            text: All experienced users by definition
        feedback: The collection mechanism can exclude a relevant group before a row exists.
        id: data-provenance.base.v2.3
        retired: true
      - prompt: What does a dataset version identify?
        answer: a
        options:
          - id: c
            text: The identity of every future model trained from it
          - id: b
            text: A guarantee that its labels are correct
          - id: a
            text: A particular collection at a recorded stage
        feedback: Versioning identifies an artifact, not universal quality or all downstream uses.
        id: data-provenance.base.v2.4
        retired: true
  - id: data-provenance.transfer.v2
    objective_ref: objective.data-provenance
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: data-provenance.s3
    variants:
      - prompt: A team downloads public examples for a new use. What should it check before treating access as sufficient?
        answer: a
        options:
          - id: a
            text: Documentation, use terms, and relevant privacy context
          - id: b
            text: Whether another team used the same examples for a different purpose
          - id: c
            text: Whether removing obvious names is enough to settle every use question
        feedback: Access alone does not resolve suitability or permitted use.
        id: data-provenance.transfer.v2.1
        retired: true
      - prompt: Errors are traced to one annotation batch. What record helps find affected releases?
        answer: a
        options:
          - id: c
            text: A summary of the current model without the data-version links
          - id: b
            text: The average quality score without the contributing batch identities
          - id: a
            text: Lineage from source batches through dataset and model versions
        feedback: Lineage connects a faulty input batch to downstream artifacts.
        id: data-provenance.transfer.v2.2
        retired: true
      - prompt: Adding more experienced-user tickets leaves novice failures unchanged. What should be reconsidered?
        answer: a
        options:
          - id: a
            text: The collection’s coverage of the intended population
          - id: b
            text: Whether more duplicate experienced-user tickets are needed
          - id: c
            text: Whether a higher overall score is enough to stop reviewing that subgroup
        feedback: More data from the same selection process may leave the missing group unrepresented.
        id: data-provenance.transfer.v2.3
        retired: true
      - prompt: A translated dataset drops ambiguity present in the source. What should be documented?
        answer: a
        options:
          - id: b
            text: Only the final token count after translation
          - id: a
            text: The transformation and its effect on the task’s evidence
          - id: c
            text: Treating the translated labels as unchanged ground truth without review
        feedback: Transformations can alter what the examples mean and which conclusions they support.
        id: data-provenance.transfer.v2.4
        retired: true
  - id: data-provenance.base.v3
    objective_ref: objective.data-provenance
    task: base
    response_type: single_choice
    points: 1
    hint: Read the ingredient card, not the photo. Who collected these examples, who wrote the labels, and which cases would that process tend to leave out?
    remediation_scene: data-provenance.s4
    variants:
      - id: data-provenance.base.v3.1
        prompt: Two equally sharp leaf photos carry the same label. One label came from a plant pathologist, the other from a worried gardener's post title. Why record which is which?
        options:
          - id: b
            text: So the model can read the label source as an extra input
          - id: a
            text: So each source's error rate can be checked and handled separately
          - id: c
            text: So the gardener labels can be deleted, since non-experts are unreliable
        answer: a
        feedback: Different label sources make different mistakes, so recording the source lets you measure and handle each one. Giving the source to the model as an input would let it learn shortcuts, and deleting all forum labels throws away real field photos that may be mostly right.
      - id: data-provenance.base.v3.2
        prompt: A model's accuracy rose from 88% to 93% between two runs. The code changed, and so did the data. What does recording a dataset version for each run let you do?
        options:
          - id: c
            text: Show that the newer labels are more accurate than the old ones
          - id: b
            text: Show that the new data now represents the people who will use it
          - id: a
            text: Tell whether the gain came from the code change or the data change
        answer: a
        feedback: A version pins down exactly which data each run used, so you can rerun the new code on the old data and separate the two effects. A version number records what the data was; it says nothing by itself about label quality or coverage.
      - id: data-provenance.base.v3.3
        prompt: A symptom-checker dataset is built from the records of people who visited a clinic. Which group is most likely under-represented?
        options:
          - id: a
            text: People with mild symptoms who stayed home to rest
          - id: b
            text: People with severe symptoms who needed urgent care
          - id: c
            text: People who came back to the clinic several times
        answer: a
        feedback: Only people who came in could become rows, so mild cases that never reached the clinic are scarce. Severe cases and repeat visitors are, if anything, over-represented by this collection process.
      - id: data-provenance.base.v3.4
        prompt: A team labels 10,000 new photos with its current model, then trains the next model on those labels. What is the main risk?
        options:
          - id: b
            text: The machine-made labels will be too varied for training to settle
          - id: a
            text: The next model learns to repeat the current model's mistakes
          - id: c
            text: Training runs slower, because model labels need extra processing
        answer: a
        feedback: Labels from a model carry that model's errors, so the next model is trained to agree with them. Model-made labels tend to be too consistent rather than too varied, and they don't slow training down.
  - id: data-provenance.transfer.v3
    objective_ref: objective.data-provenance
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name the specific gap first (permission, label source, coverage, or a change made along the way), then pick the record that would reveal or fix it.
    remediation_scene: data-provenance.s6
    variants:
      - id: data-provenance.transfer.v3.1
        prompt: A voice-assistant startup finds a large archive of recorded customer-service calls on a public website. Before training a paid product on it, what should it check first?
        options:
          - id: c
            text: Whether the audio files open and play without errors
          - id: a
            text: The license, the site's terms, and whether callers agreed to this use
          - id: b
            text: Whether the archive holds enough hours of audio to train a model
        answer: a
        feedback: Being able to download the calls answers only whether you can get them. Permission for a commercial product, and the privacy of the people on the calls, are separate questions to settle before any training. File health and size matter later.
      - id: data-provenance.transfer.v3.2
        prompt: A hospital learns that a batch of 300 scans was mislabeled last year. Which record lets it find every model that may be affected?
        options:
          - id: b
            text: The accuracy report of the model that is in use today
          - id: c
            text: A count of how many scans each dataset version contains
          - id: a
            text: Links from each batch to dataset versions, and from those to models
        answer: a
        feedback: That chain of links is the lineage, and it answers "which models ever saw this batch?" directly. An accuracy report covers only one model, and scan counts don't say which batches went into which version.
        retired: true
      - id: data-provenance.transfer.v3.3
        prompt: A Spanish review dataset was machine-translated into English, and sarcasm is often lost in translation. What should the dataset card record?
        options:
          - id: a
            text: Which examples were translated, by what tool, and a spot-check of changed meanings
          - id: b
            text: The final English text alone, since that's the version the model will see
          - id: c
            text: The original Spanish labels, marked as verified for the English text
        answer: a
        feedback: Translation can flip a sarcastic "great product" into sincere praise, so the card should say what was translated and how often the meaning changed. Keeping only the English hides the change, and marking the old labels as verified claims a check nobody did.
        retired: true
      - id: data-provenance.transfer.v3.4
        prompt: A job-ad classifier is trained on ads from one big city's job board and will be used nationwide. What should its card flag most clearly?
        options:
          - id: c
            text: That the dataset is large, so nationwide coverage should be fine
          - id: b
            text: That big-city ads use more words, so they should be shortened
          - id: a
            text: That small-town and rural ads are missing, so results there are unknown
        answer: a
        feedback: The ads represent one city's board, not the whole country, which is a coverage gap to flag before use. Size doesn't fix a gap in who was collected, and ad length is a much smaller concern.
      - id: data-provenance.transfer.v3.5
        prompt: A speech team learns that 500 clips in last spring's batch were transcribed from the wrong script. Which record tells them every model that may be affected?
        options:
          - id: a
            text: The error report for the speech model that's live today
          - id: c
            text: A count of how many clips each dataset version holds
          - id: b
            text: Links from each batch to dataset versions, then to models
        answer: b
        feedback: Only the chain from batch to dataset version to model answers "which models ever saw these clips?" Today's error report covers one model, and clip counts don't say which batches went into which version.
      - id: data-provenance.transfer.v3.6
        prompt: A team shrinks 20,000 bird photos from 4,000 pixels wide to 256 to save space, then shares the dataset. What should its card say about this step?
        options:
          - id: b
            text: The resize, and that tiny field marks may now be lost
          - id: a
            text: The new size alone, since that's what the model will see
          - id: c
            text: Nothing, since resizing doesn't change any of the labels
        answer: b
        feedback: At 256 pixels, the small marks that tell similar species apart may vanish, so anyone using the data needs to know the step happened. Recording only the new size hides what was lost, and a label can stay the same while the evidence behind it shrinks.
