schema_version: 0.2-draft
lesson:
  id: data-provenance
  version: 0.2.0-draft
  title: Where did this dataset come from?
  state: draft
  summary: Follow an example back to its source, like tracing an ingredient before putting it in a recipe.
  slot: M03.3
  category: learning
  sources:
  - title: Gebru et al. — Datasheets for Datasets
    url: https://arxiv.org/abs/1803.09010
  - title: Dive into Deep Learning — environment and distribution shift
    url: https://d2l.ai/chapter_linear-classification/environment-and-distribution-shift.html
  archetype: mechanism
objectives:
- id: objective.data-provenance
  version: 2-draft
  statement: Document a dataset’s origin, transformations, permissions context, and collection limits without confusing
    public availability with suitability.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - data-provenance.base.v2
  - data-provenance.transfer.v2
  prerequisites:
  - anyOf:
    - objective.data
scenes:
- id: data-provenance.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.data-provenance
  title: A useful example has a history
  markdown: A screenshot of a sentence does not tell you who wrote it, when it was collected, or whether it was
    edited. **Provenance** is the record of where data came from and what happened to it. Imagine a classroom story
    collection containing original stories, copied excerpts, and machine-written continuations. They may look similar
    as plain text but support different claims about authorship, quality, and intended use. The model cannot reconstruct
    that history simply by reading the words.
  text_mode: A screenshot of a sentence does not tell you who wrote it, when it was collected, or whether it was
    edited. **Provenance** is the record of where data came from and what happened to it. Imagine a classroom story
    collection containing original stories, copied excerpts, and machine-written continuations. They may look similar
    as plain text but support different claims about authorship, quality, and intended use. The model cannot reconstruct
    that history simply by reading the words.
  bridges: []
- id: data-provenance.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.data-provenance
  title: Make a small ingredient card
  markdown: 'For each source collection, record an identifier, origin, collection date, selection method, stated
    permissions or restrictions, and relevant notices about personal information. Add a record of transformations:
    normalization, redaction, translation, filtering, or labeling. A **dataset version** identifies a particular
    collection at a particular stage. If a score changes after an update, these cards help distinguish a better
    learning method from a different mixture of examples. Keep source records separate from model predictions about
    source quality.'
  text_mode: 'For each source collection, record an identifier, origin, collection date, selection method, stated
    permissions or restrictions, and relevant notices about personal information. Add a record of transformations:
    normalization, redaction, translation, filtering, or labeling. A **dataset version** identifies a particular
    collection at a particular stage. If a score changes after an update, these cards help distinguish a better
    learning method from a different mixture of examples. Keep source records separate from model predictions about
    source quality.'
  bridges: []
- id: data-provenance.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data-provenance
  title: Represented is different from representative
  markdown: Suppose a help-desk dataset contains 900 English tickets and 100 Spanish tickets, all submitted by experienced
    users. It represents those recorded interactions. It does not automatically represent new users, other languages,
    or people who gave up before submitting a ticket. **Selection bias** arises when the collection process favors
    some cases in a way relevant to the claim. Count groups and inspect the collection mechanism; adding more of
    the same selected tickets may preserve the same blind spot.
  text_mode: Suppose a help-desk dataset contains 900 English tickets and 100 Spanish tickets, all submitted by
    experienced users. It represents those recorded interactions. It does not automatically represent new users,
    other languages, or people who gave up before submitting a ticket. **Selection bias** arises when the collection
    process favors some cases in a way relevant to the claim. Count groups and inspect the collection mechanism;
    adding more of the same selected tickets may preserve the same blind spot.
  bridges: []
- id: data-provenance.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data-provenance
  title: Transformations change what evidence means
  markdown: A label can come from the original author, a paid annotator, a rule, or another model. Those are different
    sources of evidence. A model-generated label may repeat that model’s mistakes. A translation may change an ambiguous
    phrase. De-identification can remove some identifying details without proving that re-identification is impossible.
    Record what each operation was intended to do and what was actually checked. Keeping a record is part of reproducibility,
    not a guarantee that the resulting dataset is suitable.
  text_mode: A label can come from the original author, a paid annotator, a rule, or another model. Those are different
    sources of evidence. A model-generated label may repeat that model’s mistakes. A translation may change an ambiguous
    phrase. De-identification can remove some identifying details without proving that re-identification is impossible.
    Record what each operation was intended to do and what was actually checked. Keeping a record is part of reproducibility,
    not a guarantee that the resulting dataset is suitable.
  bridges: []
- id: data-provenance.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.data-provenance
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: For each example ask where it came from, what changed, who it represents, and what uses are supported
    by its documentation.
- id: data-provenance.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.data-provenance
  markdown: Data provenance records origin, collection conditions, permissions, annotation choices, and transformations
    so a dataset can be evaluated and maintained responsibly.
  text_mode: Data provenance records origin, collection conditions, permissions, annotation choices, and transformations
    so a dataset can be evaluated and maintained responsibly.
- id: data-provenance.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data-provenance
  title: Availability does not answer every use question
  markdown: Being downloadable answers an access question. It does not settle permissions, consent, privacy expectations,
    or whether the examples fit your task. Read the dataset’s documentation and the relevant terms for the proposed
    use; unresolved questions need appropriate review. In our classroom exercise, use invented examples so learners
    can inspect the full history. For a real deployment, a provenance card makes missing information visible rather
    than treating a web address as complete authorization.
  text_mode: Being downloadable answers an access question. It does not settle permissions, consent, privacy expectations,
    or whether the examples fit your task. Read the dataset’s documentation and the relevant terms for the proposed
    use; unresolved questions need appropriate review. In our classroom exercise, use invented examples so learners
    can inspect the full history. For a real deployment, a provenance card makes missing information visible rather
    than treating a web address as complete authorization.
  bridges: []
- id: data-provenance.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.data-provenance
  title: Use lineage to investigate a failure
  markdown: A **lineage** links a released dataset back through its transformations to earlier versions and sources.
    If a batch of corrupted labels appears, lineage helps identify affected examples and model versions. Test the
    record by asking someone else to trace one row from collection to final use. A practical memory cue is “source,
    changes, coverage, use.” The card will not prove every legal or scientific claim, but it turns vague confidence
    in a dataset into concrete questions that can be checked.
  text_mode: A **lineage** links a released dataset back through its transformations to earlier versions and sources.
    If a batch of corrupted labels appears, lineage helps identify affected examples and model versions. Test the
    record by asking someone else to trace one row from collection to final use. A practical memory cue is “source,
    changes, coverage, use.” The card will not prove every legal or scientific claim, but it turns vague confidence
    in a dataset into concrete questions that can be checked.
  bridges: []
- id: data-provenance.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.data-provenance
  title: Spot the missing ingredient
  markdown: A dataset card gives a download link and row count but no collection method. What remains hard to judge?
  text_mode: A dataset card gives a download link and row count but no collection method. What remains hard to judge?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: Which cases the collection process may have excluded.
    - id: b
      text: Whether the file has exactly the stated number of rows.
    - id: c
      text: Whether a browser can open the recorded link.
    answer: a
    reveal_markdown: Collection method is needed to reason about selection and coverage; access and size do not
      provide that history.
    hint: Trace the example using the rule from the preceding pages.
    id: data-provenance.practice.v2.7
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - data-provenance.s1
    - data-provenance.s2
    - data-provenance.s3
    - data-provenance.s4
    - data-provenance.s5
    - data-provenance.s6
    - data-provenance.s7
    - data-provenance.check
    gate_refs:
    - gate.core
  scene_aliases:
    data-provenance.recap: data-provenance.check
assessment_families:
- id: data-provenance.base
  objective_ref: objective.data-provenance
  task: base
  response_type: single_choice
  points: 1
  hint: 'Document the decisions: trace the inputs, operation, and result before choosing.'
  remediation_scene: data-provenance.s2
  variants:
  - id: data-provenance.base.1
    prompt: What does provenance describe?
    options:
    - id: c
      text: Only the model’s final score
    - id: a
      text: The origin and transformation history of data
    - id: b
      text: Only its compressed file size
    answer: a
    feedback: Lineage connects records to collection and processing decisions.
    retired: true
  - id: data-provenance.base.2
    prompt: Two sources define the same label differently. What is needed?
    options:
    - id: a
      text: Record and reconcile the definitions before treating targets as equivalent
    - id: b
      text: Assume identical column names prove identical meaning
    - id: c
      text: Discard all documentation
    answer: a
    feedback: Label semantics are part of the learning task.
    retired: true
- id: data-provenance.transfer
  objective_ref: objective.data-provenance
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Maintain lineage through processing: trace the inputs, operation, and result before choosing.'
  remediation_scene: data-provenance.s4
  variants:
  - id: data-provenance.transfer.1
    prompt: A web page is publicly readable. Does that alone establish unrestricted permission for every use?
    options:
    - id: a
      text: No; use conditions need separate consideration
    - id: b
      text: Yes; accessibility settles all conditions
    - id: c
      text: Only if the page contains numbers
    answer: a
    feedback: Access and authorized use are separate questions.
    retired: true
  - id: data-provenance.transfer.2
    prompt: Filtering removes many examples from one subgroup. What should be documented?
    options:
    - id: b
      text: Only the new row count
    - id: c
      text: Nothing if validation accuracy rises
    - id: a
      text: The rule, affected population, and resulting coverage change
    answer: a
    feedback: Preprocessing can alter representativeness and the meaning of evaluation.
    retired: true
- id: data-provenance.base.v2
  objective_ref: objective.data-provenance
  task: base
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: data-provenance.s3
  variants:
  - prompt: What does provenance primarily record?
    answer: a
    options:
    - id: a
      text: Origins and transformations of data
    - id: b
      text: The next token a model will generate
    - id: c
      text: The learning rate used for every future model
    feedback: Provenance concerns the data’s history, with links to transformations and versions.
    id: data-provenance.base.v2.1
  - prompt: Which distinction matters for interpreting a label?
    answer: a
    options:
    - id: b
      text: Whether labels were encoded as integers instead of strings
    - id: a
      text: Whether a human, rule, or model produced it
    - id: c
      text: Whether a high agreement rate is sufficient to establish factual correctness
    feedback: Label origin affects its error process and the evidence it supplies.
    id: data-provenance.base.v2.2
  - prompt: A ticket dataset contains only successful submissions. Which cases may be missing?
    answer: a
    options:
    - id: b
      text: Every ticket containing a common word
    - id: a
      text: People who abandoned the process before submitting
    - id: c
      text: All experienced users by definition
    feedback: The collection mechanism can exclude a relevant group before a row exists.
    id: data-provenance.base.v2.3
  - prompt: What does a dataset version identify?
    answer: a
    options:
    - id: c
      text: The identity of every future model trained from it
    - id: b
      text: A guarantee that its labels are correct
    - id: a
      text: A particular collection at a recorded stage
    feedback: Versioning identifies an artifact, not universal quality or all downstream uses.
    id: data-provenance.base.v2.4
- id: data-provenance.transfer.v2
  objective_ref: objective.data-provenance
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: data-provenance.s3
  variants:
  - prompt: A team downloads public examples for a new use. What should it check before treating access as sufficient?
    answer: a
    options:
    - id: a
      text: Documentation, use terms, and relevant privacy context
    - id: b
      text: Whether another team used the same examples for a different purpose
    - id: c
      text: Whether removing obvious names is enough to settle every use question
    feedback: Access alone does not resolve suitability or permitted use.
    id: data-provenance.transfer.v2.1
  - prompt: Errors are traced to one annotation batch. What record helps find affected releases?
    answer: a
    options:
    - id: c
      text: A summary of the current model without the data-version links
    - id: b
      text: The average quality score without the contributing batch identities
    - id: a
      text: Lineage from source batches through dataset and model versions
    feedback: Lineage connects a faulty input batch to downstream artifacts.
    id: data-provenance.transfer.v2.2
  - prompt: Adding more experienced-user tickets leaves novice failures unchanged. What should be reconsidered?
    answer: a
    options:
    - id: a
      text: The collection’s coverage of the intended population
    - id: b
      text: Whether more duplicate experienced-user tickets are needed
    - id: c
      text: Whether a higher overall score is enough to stop reviewing that subgroup
    feedback: More data from the same selection process may leave the missing group unrepresented.
    id: data-provenance.transfer.v2.3
  - prompt: A translated dataset drops ambiguity present in the source. What should be documented?
    answer: a
    options:
    - id: b
      text: Only the final token count after translation
    - id: a
      text: The transformation and its effect on the task’s evidence
    - id: c
      text: Treating the translated labels as unchanged ground truth without review
    feedback: Transformations can alter what the examples mean and which conclusions they support.
    id: data-provenance.transfer.v2.4
