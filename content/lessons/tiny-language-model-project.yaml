- id: tiny-language-model-project.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.tiny-language-model-project
  markdown: Try these questions to check the ideas behind your project. Use the lesson’s rubric for self or
    peer review of your work; the app does not grade the project artifact.
  text_mode: Try these questions to check the ideas behind your project. Use the lesson’s rubric for self or
    peer review of your work; the app does not grade the project artifact.
  takeaway: 'Your model is small enough to inspect completely. Carry that habit into larger systems: preserve
    the recipe, freeze comparisons, and explain limits.'
- id: tiny-language-model-project.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.tiny-language-model-project
  markdown: Build a transparent count-based language model, compare held-out likelihoods across frozen checkpoints,
    and connect the exercise to the much larger neural training lifecycle.
  text_mode: Build a transparent count-based language model, compare held-out likelihoods across frozen checkpoints,
    and connect the exercise to the much larger neural training lifecycle.
- id: tiny-language-model-project.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tiny-language-model-project
  title: Explain what the score does and does not say
  markdown: 'C2 has the lower loss on this specified average, but it assigns less probability to dog. A different
    mix of targets could change which checkpoint wins.


    Add-one smoothing also gives positive probability to transitions such as red→END. That avoids zero probabilities,
    but does not make every allowed transition sensible.


    This model uses only the preceding token. Fitting means counting pairs; inference means reading probabilities
    from the fixed table. It has no neural layers, learned embeddings, gradient optimizer, or instruction and
    preference training. Use it to inspect the checkpoint and evaluation process, then identify the additional
    mechanisms a neural model would need.'
  text_mode: 'C2 has the lower loss on this specified average, but it assigns less probability to dog. A different
    mix of targets could change which checkpoint wins.


    Add-one smoothing also gives positive probability to transitions such as red→END. That avoids zero probabilities,
    but does not make every allowed transition sensible.


    This model uses only the preceding token. Fitting means counting pairs; inference means reading probabilities
    from the fixed table. It has no neural layers, learned embeddings, gradient optimizer, or instruction and
    preference training. Use it to inspect the checkpoint and evaluation process, then identify the additional
    mechanisms a neural model would need.'
  bridges: []
- id: tiny-language-model-project.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tiny-language-model-project
  title: Present the artifact and review it
  markdown: 'Keep four items for self or peer review: both count tables, both checkpoint manifests, the two
    target probabilities and losses for each checkpoint, and a paragraph explaining the decision and its limits.
    Self-review or ask a peer to score four criteria from 0–2: counts and arithmetic; preserved versions; fixed
    and fair comparison; honest scope. Zero means missing or incorrect, one means partly correct, and two means
    correct with an inspectable explanation. Eight points means the supplied exercise is explained, not that
    you have built a transformer. The in-app quiz checks related reasoning; it cannot inspect or certify your
    external artifact.'
  text_mode: 'Keep four items for self or peer review: both count tables, both checkpoint manifests, the two
    target probabilities and losses for each checkpoint, and a paragraph explaining the decision and its limits.
