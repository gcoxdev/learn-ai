- id: tiny-language-model-project.transfer.v2
  objective_ref: objective.tiny-language-model-project
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: tiny-language-model-project.s3
  variants:
  - prompt: A team reports only the target whose loss improved. What is missing?
    answer: a
    options:
    - id: a
      text: The rest of the fixed evaluation and its agreed aggregation
    - id: c
      text: The new checkpoint’s training loss alone
    - id: b
      text: A larger smoothing constant chosen after inspection
    feedback: The complete preselected evaluation must support the claim.
    id: tiny-language-model-project.transfer.v2.1
  - prompt: A saved checkpoint omits the vocabulary ordering. What becomes ambiguous?
    answer: a
    options:
    - id: c
      text: Whether the held-out observations have labels
    - id: b
      text: Whether natural logarithms can be calculated
    - id: a
      text: Which token each probability-table column represents
    feedback: Values need their matching input and output meanings.
    id: tiny-language-model-project.transfer.v2.2
  - prompt: Does looking up a probability in a frozen count table update its counts?
    answer: a
    options:
    - id: c
      text: Yes; sampling changes the smoothing rule
    - id: a
      text: No; fitting and lookup are separate operations here
    - id: b
      text: Yes; every query adds the predicted pair
    feedback: Inference reads the frozen table unless an explicit learning procedure updates it.
    id: tiny-language-model-project.transfer.v2.3
  - prompt: What does this project demonstrate directly?
    answer: a
    options:
    - id: c
      text: A tested instruction-and-preference adaptation pipeline
    - id: b
