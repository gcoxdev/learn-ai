assessment_families:
- id: tiny-language-model-project.base
  objective_ref: objective.tiny-language-model-project
  task: base
  response_type: single_choice
  points: 1
  hint: 'Compute the conditional distribution: trace the inputs, operation, and result before choosing.'
  remediation_scene: tiny-language-model-project.s2
  variants:
  - id: tiny-language-model-project.base.1
    prompt: What is C1’s smoothed probability of cat after red?
    options:
    - id: a
      text: 2/7
    - id: b
      text: 1/2
    - id: c
      text: 1/5
    answer: a
    feedback: Add one to its count and five to the total.
    retired: true
  - id: tiny-language-model-project.base.2
    prompt: What is C2’s probability of cat after red?
    options:
    - id: b
      text: 2/7
    - id: c
      text: '1'
    - id: a
      text: 3/8
    answer: a
    feedback: The count becomes two, then add-one smoothing gives 3/8.
    retired: true
- id: tiny-language-model-project.transfer
  objective_ref: objective.tiny-language-model-project
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Deliver the lifecycle trace: trace the inputs, operation, and result before choosing.'
  remediation_scene: tiny-language-model-project.s4
  variants:
  - id: tiny-language-model-project.transfer.1
    prompt: Does the added sentence improve the probability of every held-out transition?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only with smoothing
    - id: a
      text: 'No'
    answer: a
    feedback: Probability mass shifts; red→dog receives less.
    retired: true
  - id: tiny-language-model-project.transfer.2
    prompt: Does this count model implement transformer backpropagation?
    options:
    - id: c
      text: Only if saved as a checkpoint
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: The lifecycle analogy does not make the mechanisms identical.
    retired: true
