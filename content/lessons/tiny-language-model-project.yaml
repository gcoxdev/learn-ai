scenes:
  - id: tiny-language-model-project.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.tiny-language-model-project
    title: 'Your brief: a language model you can read end to end'
    markdown: |-
      Every chatbot reply comes from the same loop: score every possible next token, pick one, append it, repeat. In this project you build that loop twice, small enough to read every number: first from counts, the way Shannon did in 1948, then as a tiny neural network in the style of Bengio and colleagues' 2003 model, a landmark neural language model that learned a vector for each word.

      | Brief | |
      | --- | --- |
      | Goal | Build two next-token models, compare them fairly, and generate text with temperature |
      | Reader | A study partner who will rerun your work from your notes |
      | Data | A three-sentence paper corpus, then 110 bird names |
      | Time | About 90 minutes; the paper-only version takes about 45 |

      **Done looks like:**

      - two hand-built count tables saved as checkpoints C1 and C2, compared on held-out pairs;
      - a character-level bigram model of bird names, with training and held-out perplexity;
      - a tiny neural model with a checkpoint ledger, and the checkpoint you kept, with the reason;
      - samples at three temperatures, and one sentence on what temperature changed;
      - a short note saying which model won on held-out perplexity, by how much, and why.
    bridges: []
  - id: tiny-language-model-project.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.tiny-language-model-project
    title: 'Milestone 1: count pairs on paper (checkpoint C1)'
    markdown: |-
      Start with a corpus of three sentences: "red cat END", "red dog END", and "blue cat END". The token END marks the end of a sentence, so the model can learn when to stop. Use the vocabulary [red, blue, cat, dog, END], in that order.

      Count each pair of neighboring tokens inside a sentence, as in "Represent text with counts and short contexts." The six pairs are red→cat, cat→END, red→dog, dog→END, blue→cat, and cat→END.

      | After… | red | blue | cat | dog | END | Total |
      | --- | ---: | ---: | ---: | ---: | ---: | ---: |
      | red | 0 | 0 | 1 | 1 | 0 | 2 |
      | blue | 0 | 0 | 1 | 0 | 0 | 1 |
      | cat | 0 | 0 | 0 | 0 | 2 | 2 |
      | dog | 0 | 0 | 0 | 0 | 1 | 1 |

      Apply **add-one smoothing**: add 1 to every count in a row, then divide by the new row total. The red row [0, 0, 1, 1, 0] becomes [1, 1, 2, 2, 1] out of 7, so $P(\text{cat} \mid \text{red}) = 2/7 \approx 0.286$.

      Save this table as checkpoint **C1**, a snapshot you won't change, together with the corpus, the vocabulary order, and the smoothing rule. Without the vocabulary order, nobody can tell which column is which.
    bridges: []
  - id: tiny-language-model-project.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tiny-language-model-project
    title: 'Milestone 2: a second checkpoint, without overwriting the first'
    markdown: |-
      Add one more training sentence, "red cat END", and save the new table as **C2**. The red row becomes [0, 0, 2, 1, 0], and its smoothed probabilities are [1/8, 1/8, 3/8, 2/8, 1/8]. The cat→END count rises to three; every other count stays the same.

      Keep C1 exactly as it was. The whole point of the next milestone is to compare the two, and you can't compare against a table you've overwritten. The lesson "Allocate compute and preserve useful checkpoints" makes the same case for real training runs.

      Two words to keep apart: changing the counts is *training*. Looking up a probability in a saved table is *inference*, and it never changes the table.
    bridges: []
  - id: tiny-language-model-project.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tiny-language-model-project
    title: 'Milestone 3: score both checkpoints on held-out pairs'
    markdown: |-
      Reserve two extra observations, red→cat and red→dog, and keep them out of the training counts. Decide the rule *before* scoring: each pair's loss is the negative natural log of the probability the checkpoint gives it, $-\ln p$, and the two losses count equally. Lower is better.

      | Checkpoint | $-\ln P(\text{cat} \mid \text{red})$ | $-\ln P(\text{dog} \mid \text{red})$ | Average loss | Perplexity |
      | --- | ---: | ---: | ---: | ---: |
      | C1 | $-\ln(2/7) = 1.253$ | $-\ln(2/7) = 1.253$ | 1.253 | 3.50 |
      | C2 | $-\ln(3/8) = 0.981$ | $-\ln(2/8) = 1.386$ | 1.184 | 3.27 |

      *Perplexity* is $e^{\text{average loss}}$, as in "How a language model takes its next step": C1 is as unsure as a choice among 3.5 equally likely tokens, C2 among 3.27. C2 wins on the fixed rule, even though it got *worse* at red→dog.

      :::predict Which checkpoint would win if the held-out pairs were red→dog three times and red→cat once?
      C1. Its average stays 1.253, while C2's becomes (3 × 1.386 + 0.981) / 4 = 1.285. Even with red→dog twice, C2 would win by only 0.002 (1.251 against 1.253). The winner depends on the mix of held-out pairs, which is why you fix them before looking.
      :::

      Because these pairs help you *choose* a checkpoint, they're validation data. If you wanted an unbiased final score for C2, you'd need a further set of pairs that played no part in the choice.
    bridges: []
  - id: tiny-language-model-project.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.tiny-language-model-project
    title: Don't cherry-pick the good news
    markdown: C2 improves red→cat but worsens red→dog. Which comparison matches the fixed project rule?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: Average both reserved target losses with equal weight.
        - id: b
          text: Report only the improved cat loss.
        - id: c
          text: Use C2’s added training sentence as the whole test.
      answer: a
      reveal_markdown: |-
        The rule was written down before scoring: both held-out pairs, equal weight. That gives C1 1.253 and C2 1.184, so C2 wins, and the report says it got worse on red→dog. Scoring only the pair that improved would make C2 look better than the rule allows, and testing on a sentence it trained on measures memory, not prediction.
      hint: Look back at the rule fixed in milestone 3, before any scores were computed. How many pairs, and with what weights?
      id: tiny-language-model-project.practice.v2.7
  - id: tiny-language-model-project.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tiny-language-model-project
    title: 'Milestone 4: a character bigram model of 110 bird names'
    markdown: |-
      Now scale up. The corpus is 110 real bird names, from "robin" to "oystercatcher". The tokens are single characters, plus "." to mark both the start and the end of a name. Hold out the last 12 names (redwing, kestrel, nuthatch, goldfinch, jay, ibis, dunnock, petrel, emu, kiwi, puffbird, crossbill) as validation data, and fit on the other 98.

      The program builds the same smoothed count table as milestone 1, now 27 × 27, measures perplexity per character (including each name's end marker), and samples new names at three **temperatures**. Temperature $T$ divides every logit before the softmax, which is the same as raising each probability to the power $1/T$ and renormalizing: $T < 1$ sharpens the distribution, $T > 1$ flattens it.

      ```python run
      import numpy as np

      words = """robin wren finch crow raven swan owl heron eagle hawk lark dove gull kite stork crane egret
      magpie rook swift martin plover puffin osprey falcon parrot pigeon thrush starling sparrow linnet
      bunting tern grebe curlew dunlin avocet godwit bittern siskin blackbird greenfinch bullfinch
      chiffchaff warbler wagtail pipit skylark swallow cuckoo woodpecker kingfisher dipper treecreeper
      waxwing redstart wheatear stonechat whinchat nightingale merlin harrier buzzard goshawk hobby shrike
      jackdaw chough nightjar quail partridge pheasant grouse ptarmigan lapwing snipe woodcock sandpiper
      turnstone sanderling oystercatcher gannet cormorant shag fulmar shearwater kittiwake razorbill
      guillemot albatross pelican flamingo penguin toucan hummingbird condor vulture ostrich
      redwing kestrel nuthatch goldfinch jay ibis dunnock petrel emu kiwi puffbird crossbill""".split()
      train, valid = words[:98], words[98:]            # the last 12 names are held out
      chars = ["."] + sorted(set("".join(words)))       # "." marks start and end
      ix = {c: i for i, c in enumerate(chars)}
      V = len(chars)

      def pairs(ws):                                    # (previous char, next char) ids
          return [(ix[a], ix[b]) for w in ws for a, b in zip("." + w, w + ".")]

      counts = np.ones((V, V))                          # add-one smoothing
      for a, b in pairs(train):
          counts[a, b] += 1
      P = counts / counts.sum(1, keepdims=True)         # each row sums to 1

      def perplexity(ws):
          return np.exp(np.mean([-np.log(P[a, b]) for a, b in pairs(ws)]))

      print(f"vocabulary {V}: train ppl {perplexity(train):.2f}, held-out ppl {perplexity(valid):.2f}")
      top = np.argsort(-P[0])[:3]
      print("likeliest first letters:", [(chars[i], round(float(P[0, i]), 3)) for i in top])

      rng = np.random.default_rng(0)
      def sample(T):
          out, c = "", 0
          while len(out) < 12:
              p = P[c] ** (1 / T)                       # temperature on probabilities
              c = rng.choice(V, p=p / p.sum())
              if c == 0:
                  break
              out += chars[c]
          return out
      for T in (0.5, 1.0, 1.5):
          print(f"T = {T}:", " ".join(sample(T) for _ in range(6)))
      ```

      **What you should see:**

      ```text
      vocabulary 27: train ppl 12.16, held-out ppl 18.28
      likeliest first letters: [('s', 0.128), ('p', 0.088), ('c', 0.072)]
      T = 0.5: sh butckero sar spee ckgonyzrin cke
      T = 1.0: mvxjncmhetar cstavambjufa kaeokn wfbowhxminzz mrinnerow swy
      T = 1.5: uzzcywtigtwd ngxaspas smxavaliynde veajoptleito xjnkvdiw tht
      ```

      At $T = 1$ the names are mostly letter soup. Add-one smoothing gave every one of the 27 × 27 pairs at least one pretend count, while the whole corpus supplies only 762 real ones, so in the median row about a third of the probability, and in the rows for rare letters most of it, sits on pairs that never occurred. At $T = 0.5$, squaring the probabilities strips most of that away, and you get fragments like "butckero."

      :::try Change one thing
      Replace `np.ones((V, V))` with `np.full((V, V), 0.1)`, a gentler **add-k smoothing** with $k = 0.1$. Training perplexity falls to 9.39, but held-out perplexity *rises* to 20.02: the model is now more confident about the pairs it saw and more surprised by the ones it didn't.
      :::
    bridges: []
  - id: tiny-language-model-project.neural
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tiny-language-model-project
    title: 'Milestone 5: a tiny neural next-token model with a checkpoint ledger'
    markdown: |-
      A bigram model sees one character of context and treats every character as unrelated to every other. The neural model fixes both: it looks at the previous **two** characters, and it gives each character a learned vector (an embedding, as in "From token IDs to learned vectors"), so that similar characters can share what they learn.

      :::papers A character-level Bengio-style model
      $$e = [E_{c_{t-2}};\, E_{c_{t-1}}], \qquad h = \tanh(eW_1 + b_1), \qquad P(c_t \mid c_{t-2}, c_{t-1}) = \operatorname{softmax}(hW_2 + b_2)$$

      $E$ is a 27 × 4 table with one vector per character; $e$ joins the two context vectors into 8 numbers; $h$ has 32 hidden units; the softmax turns 27 logits into probabilities. Training minimizes the average $-\ln P$ of the true next character, the same loss you computed by hand in milestone 3, by gradient descent. Bengio and colleagues' 2003 model had this shape, with words instead of characters.
      :::

      Every 50 steps the program writes a row in a **checkpoint ledger**, training and held-out perplexity, and saves a copy of the weights whenever held-out perplexity is the best so far. At the end it restores that best checkpoint and samples from it.

      ```python run
      import numpy as np

      words = """robin wren finch crow raven swan owl heron eagle hawk lark dove gull kite stork crane egret
      magpie rook swift martin plover puffin osprey falcon parrot pigeon thrush starling sparrow linnet
      bunting tern grebe curlew dunlin avocet godwit bittern siskin blackbird greenfinch bullfinch
      chiffchaff warbler wagtail pipit skylark swallow cuckoo woodpecker kingfisher dipper treecreeper
      waxwing redstart wheatear stonechat whinchat nightingale merlin harrier buzzard goshawk hobby shrike
      jackdaw chough nightjar quail partridge pheasant grouse ptarmigan lapwing snipe woodcock sandpiper
      turnstone sanderling oystercatcher gannet cormorant shag fulmar shearwater kittiwake razorbill
      guillemot albatross pelican flamingo penguin toucan hummingbird condor vulture ostrich
      redwing kestrel nuthatch goldfinch jay ibis dunnock petrel emu kiwi puffbird crossbill""".split()
      train, valid = words[:98], words[98:]            # the last 12 names are held out
      chars = ["."] + sorted(set("".join(words)))       # "." marks start and end
      ix = {c: i for i, c in enumerate(chars)}
      V, d, H = len(chars), 4, 32                       # vocab, embedding size, hidden units

      def examples(ws):                                 # context = previous 2 characters
          X, Y = [], []
          for w in ws:
              s = ".." + w + "."
              X += [[ix[s[i - 2]], ix[s[i - 1]]] for i in range(2, len(s))]
              Y += [ix[c] for c in s[2:]]
          return np.array(X), np.array(Y)
      Xtr, Ytr = examples(train); Xva, Yva = examples(valid)

      rng = np.random.default_rng(0)
      E = rng.normal(0, 1, (V, d))                      # one learned vector per character
      W1, b1 = rng.normal(0, 0.35, (2 * d, H)), np.zeros(H)
      W2, b2 = rng.normal(0, 0.02, (H, V)), np.zeros(V)

      def forward(X):
          e = E[X].reshape(len(X), 2 * d)               # look up and join the 2 vectors
          h = np.tanh(e @ W1 + b1)
          z = h @ W2 + b2                               # logits: one score per character
          p = np.exp(z - z.max(1, keepdims=True))
          return e, h, p / p.sum(1, keepdims=True)      # softmax

      def perplexity(X, Y):
          return np.exp(-np.mean(np.log(forward(X)[2][np.arange(len(Y)), Y])))

      onehot = [np.eye(V)[Xtr[:, j]] for j in (0, 1)]
      ledger, best = [], None                           # checkpoint ledger
      for step in range(401):
          if step % 50 == 0:
              ledger.append((step, perplexity(Xtr, Ytr), perplexity(Xva, Yva)))
              if best is None or ledger[-1][2] < best[0]:   # save the best checkpoint
                  best = (ledger[-1][2], step, [P.copy() for P in (E, W1, b1, W2, b2)])
          e, h, p = forward(Xtr)
          dz = p.copy(); dz[np.arange(len(Ytr)), Ytr] -= 1; dz /= len(Ytr)
          dh = dz @ W2.T * (1 - h ** 2)                 # back through tanh
          de = (dh @ W1.T).reshape(-1, 2, d)
          dE = onehot[0].T @ de[:, 0] + onehot[1].T @ de[:, 1]
          for P, g in ((W2, h.T @ dz), (b2, dz.sum(0)), (W1, e.T @ dh), (b1, dh.sum(0)), (E, dE)):
              P -= 1.0 * g
      for row in ledger:
          print("step %3d   train ppl %5.2f   held-out ppl %5.2f" % row)
      E, W1, b1, W2, b2 = best[2]                        # restore the best checkpoint
      print(f"kept step {best[1]} (held-out ppl {best[0]:.2f})")

      def sample(T):
          out, c = "", [0, 0]
          while len(out) < 12:
              p = forward(np.array([c]))[2][0] ** (1 / T)   # temperature on probabilities
              nxt = rng.choice(V, p=p / p.sum())
              if nxt == 0:
                  break
              out += chars[nxt]; c = [c[1], nxt]
          return out
      for T in (0.5, 1.0, 1.5):
          print(f"T = {T}:", " ".join(sample(T) for _ in range(6)))
      ```

      **What you should see:**

      ```text
      step   0   train ppl 27.24   held-out ppl 27.28
      step  50   train ppl 12.74   held-out ppl 18.24
      step 100   train ppl 10.41   held-out ppl 16.83
      step 150   train ppl  9.04   held-out ppl 16.09
      step 200   train ppl  8.01   held-out ppl 15.32
      step 250   train ppl  7.16   held-out ppl 14.76
      step 300   train ppl  6.51   held-out ppl 14.64
      step 350   train ppl  6.01   held-out ppl 14.89
      step 400   train ppl  5.63   held-out ppl 15.36
      kept step 300 (held-out ppl 14.64)
      T = 0.5: bullover stin gras startbird oshrow but
      T = 1.0: dotknleml cod per ronagdae ch ke
      T = 1.5: byabkinkshem famk dull obaneanorbit gaxtoo stu
      ```

      Step 0 is about 27, the vocabulary size: an untrained model is as unsure as a uniform guess. Training perplexity keeps falling all the way to step 400, but held-out perplexity bottoms out at step 300 and then climbs, because the model has started memorizing its 98 names. The ledger lets you keep step 300, as in "Connect data, gradients, and saved model state." On held-out names the kept checkpoint scores 14.64 against the bigram model's 18.28. The low-temperature samples now look like birds.

      :::mixup "The last checkpoint is the best one, since it trained the longest."
      By training perplexity it is, but that measures how well the model recalls its own 98 names. Held-out perplexity measures prediction, and here the last checkpoint is worse than step 300. Save checkpoints under separate names so the best one still exists when you find it.
      :::

      **Where transformers come in.** This model's context is a fixed window of two characters. A transformer replaces the window with causal attention, so every position can look back at *every* earlier token, as "From attention scores to a causal mask" and "Follow one token through a transformer" show. The embedding table, the logits, the softmax, the $-\ln p$ loss, temperature sampling, and the checkpoint ledger all stay exactly as you built them here.
    bridges: []
  - id: tiny-language-model-project.mistakes
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tiny-language-model-project
    title: Five mistakes that fake a better model
    markdown: |-
      | Mistake | How to spot it | Fix |
      | --- | --- | --- |
      | Reporting training perplexity as the score | The number keeps falling however long you train | Report held-out perplexity from names the model never trained on |
      | Keeping only the last checkpoint | The ledger shows a lower held-out perplexity earlier, and those weights are gone | Save the best checkpoint separately, as the code does |
      | Comparing perplexities across tokenizers | A word-level model's 150 is "worse" than a character model's 12 | Compare only models that split text the same way; "One vocabulary does not divide every language equally" explains why |
      | Choosing the held-out set after scoring | The held-out names changed between runs | Fix them before training, as in milestone 3 |
      | Temperature applied the wrong way round | Samples at $T = 0.5$ look *more* random than at $T = 1$ | Divide logits by $T$ (or raise probabilities to $1/T$); don't multiply |
    bridges: []
  - id: tiny-language-model-project.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.tiny-language-model-project
    title: The no-code path and the rubric
    markdown: |-
      **No code?** Milestones 1 to 3 are complete on paper. Add temperature by hand: to sample C1's red row at $T = 0.5$, square its probabilities [1, 1, 2, 2, 1]/7 to get [1, 1, 4, 4, 1] and renormalize by 11. Cat goes from 2/7 ≈ 0.29 to 4/11 ≈ 0.36, and blue from 0.14 to 0.09. Then draw a few samples from each version with any random-number generator, and describe what changed. Read through the code's expected outputs and explain, in your own words, why the neural model wins on held-out names.

      **Rubric.** Score each row 0, 1, or 2:

      | Criterion | 0: missing or wrong | 1: partly there | 2: solid |
      | --- | --- | --- | --- |
      | Counts and smoothing | Table or arithmetic wrong | Right table, a smoothing slip | C1 and C2 both right, rows sum to 1 |
      | Checkpoints | C1 overwritten, or no ledger | Checkpoints saved, choice unexplained | Every checkpoint kept, best one chosen by held-out score |
      | Fair comparison | Held-out set chosen after scoring | Fixed set, but only one model scored | Fixed set, both models scored, gap stated |
      | Perplexity | Not computed | Computed on training data only | Training and held-out, and read in plain words |
      | Temperature | No samples | Samples at one temperature | Three temperatures, effect explained |
      | Explanation | Claims beyond the evidence | Accurate but vague | Says which model won, by how much, and why |

      The quiz below checks the ideas; this rubric, used by you or a study partner, judges your tables, ledger, and notes.
    bridges: []
  - id: tiny-language-model-project.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.tiny-language-model-project
    markdown: |-
      Smoothed probabilities, perplexities, and temperatures to compute, then a name generator, an overwritten checkpoint, and two tokenizers test the habits from your tiny models.
    takeaway: |-
      A language model scores every next token and samples one, with temperature setting how adventurous it is. Judge models by held-out perplexity, and keep the checkpoint where that number was lowest, not the last one.
  - id: tiny-language-model-project.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.tiny-language-model-project
    markdown: |-
      Build a transparent count-based language model, compare held-out likelihoods across frozen checkpoints, and connect the exercise to the much larger neural training lifecycle.
