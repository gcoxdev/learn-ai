  version: 0.4.0-draft
  title: 'Project: build a tiny next-token model and checkpoint ledger'
  state: draft
  summary: Teach a model 98 bird names and it will invent new ones, like "startbird" and "bullover". Build it twice, from tally marks and then from learned vectors, and measure which one is less surprised.
  slot: M36.4
