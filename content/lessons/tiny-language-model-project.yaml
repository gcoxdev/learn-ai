    external artifact.'
  bridges: []
- id: tiny-language-model-project.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.tiny-language-model-project
  title: Do not cherry-pick the good news
  markdown: C2 improves red→cat but worsens red→dog. Which comparison matches the fixed project rule?
  text_mode: C2 improves red→cat but worsens red→dog. Which comparison matches the fixed project rule?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: Average both reserved target losses with equal weight.
    - id: b
      text: Report only the improved cat loss.
    - id: c
      text: Use C2’s added training sentence as the whole test.
    answer: a
    reveal_markdown: The selection rule was fixed before comparison. Include both held-out observations; report
      the tiny fixture’s limits alongside the result.
    hint: Trace the example using the rule from the preceding pages.
    id: tiny-language-model-project.practice.v2.7
