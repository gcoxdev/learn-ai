  - id: tiny-language-model-project.base.v3
    objective_ref: objective.tiny-language-model-project
    task: base
    response_type: single_choice
    points: 1
    hint: 'Keep three numbers apart: probabilities (what the model predicts), perplexity (how surprised it is on text, in "equally likely choices"), and temperature (how the sampler reshapes the probabilities).'
    remediation_scene: tiny-language-model-project.neural
    variants:
      - id: tiny-language-model-project.base.v3.1
        prompt: You sample from the bird-name model at temperature 0.5 instead of 1. What happens to the next-character probabilities?
        options:
          - id: b
            text: Each probability is halved, then the row is renormalized
          - id: a
            text: Likely characters get likelier and unlikely ones rarer
          - id: c
            text: The weights are retrained to make the model more confident
        answer: a
        feedback: T = 0.5 raises each probability to the power 2 and renormalizes, which sharpens the distribution. Halving every probability and renormalizing would change nothing, and temperature never touches the weights; it only reshapes the probabilities at sampling time.
      - id: tiny-language-model-project.base.v3.2
        prompt: The kept checkpoint has a held-out perplexity of 14.64 per character. What does that number mean?
        options:
          - id: a
            text: It is as unsure as choosing among about 15 equal options
          - id: b
            text: About 14.64% of held-out characters are predicted wrongly
          - id: c
            text: It makes about 14.64 wrong guesses in each held-out name
        answer: a
        feedback: Perplexity is e to the average −ln p, read as an effective number of equally likely choices per step. It isn't an error rate or a count of mistakes; a model can have low perplexity and still pick the wrong top character often.
      - id: tiny-language-model-project.base.v3.3
        prompt: 'A ledger shows training perplexity falling at every step to 400, while held-out perplexity is 14.76 at step 250, 14.64 at 300, and 14.89 at 350. Which checkpoint should you keep?'
        options:
          - id: c
            text: Step 250, the last one before held-out perplexity rose
          - id: b
            text: Step 400, which has the lowest training perplexity
          - id: a
            text: Step 300, which has the lowest held-out perplexity
        answer: a
        feedback: Keep the checkpoint with the best held-out score, step 300. Held-out perplexity was still falling from 250 to 300, so 250 isn't the turning point. Training perplexity rewards memorizing the 98 training names.
      - id: tiny-language-model-project.base.v3.4
        prompt: The neural model reaches a held-out perplexity of 14.64 against the bigram model's 18.28. What best explains the gap?
        options:
          - id: b
            text: It memorized the 12 held-out names during training
          - id: a
            text: It uses two characters of context and learned vectors
          - id: c
            text: It works with a larger vocabulary of characters
        answer: a
        feedback: Two characters of context and shared learned vectors let it predict better from less evidence. The held-out names never entered training, and both models use the same 27-character vocabulary.
      - id: tiny-language-model-project.base.v3.5
        prompt: 'Why do the bigram model''s samples at temperature 1 look like "mvxjncmhetar"?'
        options:
          - id: a
            text: Add-one smoothing spreads a lot of probability over unseen pairs
          - id: b
            text: The sampler ignores the previous character when it chooses
          - id: c
            text: Temperature 1 flattens every row into a uniform distribution
        answer: a
        feedback: With 27 × 27 pairs each given one pretend count and only 762 real pairs, much of each row sits on pairs that never occurred. The sampler does use the previous character, and T = 1 leaves the probabilities unchanged.
  - id: tiny-language-model-project.calculate
    objective_ref: objective.tiny-language-model-project
    task: base
    response_type: numeric
    points: 1
    hint: 'Add-one smoothing: (count + 1) / (row total + V). Perplexity: e raised to the average of −ln p. Temperature T: raise each probability to 1/T, then divide by the new total.'
    remediation_scene: tiny-language-model-project.s4
    absolute_tolerance: 0.005
    variants:
      - id: tiny-language-model-project.calculate.1
        prompt: In a character model with V = 27, the letter q appears 3 times in training, always followed by u. With add-one smoothing, what is P(u | q)? Give a decimal.
        answer: 0.133
        feedback: (3 + 1) / (3 + 27) = 4 / 30 ≈ 0.133. Without smoothing it would be 1; add-one moves most of that probability onto 26 letters that never followed q.
      - id: tiny-language-model-project.calculate.2
        prompt: A model gives the two held-out tokens probabilities 0.25 and 0.5. What is its perplexity on them? Give a decimal.
        answer: 2.828
        feedback: 'The losses are −ln 0.25 = 1.386 and −ln 0.5 = 0.693, averaging 1.040, and e^1.040 ≈ 2.83. Averaging the probabilities first and inverting (1 / 0.375 = 2.67) gives the wrong answer.'
      - id: tiny-language-model-project.calculate.3
        prompt: Checkpoint C1 gives each of two held-out pairs probability 2/7. What is its perplexity on them? Give a decimal.
        answer: 3.5
        feedback: Both losses are −ln(2/7) = 1.253, so the average is 1.253 and e^1.253 = 7/2 = 3.5. When every probability is the same p, perplexity is simply 1/p.
      - id: tiny-language-model-project.calculate.4
        prompt: Two possible next tokens have probabilities 0.8 and 0.2. After applying temperature T = 0.5, what is the probability of the first? Give a decimal.
        answer: 0.941
        feedback: 'Raise each to 1/T = 2: 0.64 and 0.04. Renormalize: 0.64 / 0.68 ≈ 0.941. Lower temperature makes the favorite even more likely.'
      - id: tiny-language-model-project.calculate.5
        prompt: A context has been seen 5 times, followed by the target twice. The vocabulary has 5 tokens. With add-one smoothing, what is the target's probability? Give a decimal.
        answer: 0.3
        feedback: (2 + 1) / (5 + 5) = 3 / 10 = 0.3. The denominator grows by the vocabulary size, not by 1.
  - id: tiny-language-model-project.transfer.v3
    objective_ref: objective.tiny-language-model-project
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Ask what each number is measured on (training or held-out text), whether two models split text the same way, and whether the evidence you need still exists.'
    remediation_scene: tiny-language-model-project.mistakes
    variants:
      - id: tiny-language-model-project.transfer.v3.1
        prompt: 'A team reports that its character model "reached perplexity 1.9 after 10,000 steps," measured on its training text. What should they report instead?'
        options:
          - id: b
            text: Perplexity after even more steps, to show it has converged
          - id: a
            text: Held-out perplexity at each saved checkpoint
          - id: c
            text: Samples at a higher temperature, to show variety
        answer: a
        feedback: Training perplexity mostly measures recall of the training text and keeps falling as the model memorizes. Held-out perplexity at each checkpoint shows prediction and which checkpoint to keep. More steps or livelier samples don't answer that.
      - id: tiny-language-model-project.transfer.v3.2
        prompt: One product completes code; another writes bedtime stories. How should their sampling temperatures differ?
        options:
          - id: a
            text: Lower for code, where the likeliest token is usually right
          - id: c
            text: Higher for code, so that it explores more possible fixes
          - id: b
            text: The same for both, since temperature only affects speed
        answer: a
        feedback: Code usually has one right continuation, so a low temperature keeps to it; stories benefit from variety, so a higher one helps. Temperature changes which tokens are chosen, not how fast they're produced.
      - id: tiny-language-model-project.transfer.v3.3
        prompt: On the same text, a character-level model has perplexity 12 and a word-level model has perplexity 150. What can you conclude?
        options:
          - id: b
            text: The character model is better, because its perplexity is lower
          - id: c
            text: The word model is better, because words carry more meaning
          - id: a
            text: Nothing yet; they predict different units, so compare per text
        answer: a
        feedback: Perplexity is per token, and a word is many characters, so the two numbers measure surprise over different steps. Compare models that tokenize the same way, or convert both to a per-character or per-byte measure.
      - id: tiny-language-model-project.transfer.v3.4
        prompt: A training script saves every checkpoint to the same file name. Held-out perplexity was lowest at step 3,000, and the run ended at step 5,000. What has been lost?
        options:
          - id: a
            text: The step-3,000 weights; only step 5,000 remains on disk
          - id: b
            text: Nothing, because the final weights include all earlier learning
          - id: c
            text: The training data, which was stored beside the checkpoint
        answer: a
        feedback: Overwriting keeps only the latest weights, and those scored worse on held-out text. Later training changes the weights, so step 3,000's state can't be recovered from step 5,000's. Save checkpoints under separate names.
      - id: tiny-language-model-project.transfer.v3.5
        prompt: 'A bird-name generator at temperature 0.2 keeps producing real training names like "sparrow" and "swallow." Why?'
        options:
          - id: c
            text: The held-out names must have leaked into the training set
          - id: a
            text: Low temperature follows the likeliest path, often a seen name
          - id: b
            text: The model is broken, as sampling can't repeat training data
        answer: a
        feedback: At low temperature the sampler nearly always takes the likeliest next character, which tends to retrace common training names. Sparrow and swallow are training names, so no leak is needed; raise the temperature for more invention.
