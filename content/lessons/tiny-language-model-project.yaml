schema_version: 0.2-draft
lesson:
  id: tiny-language-model-project
  version: 0.3.0-draft
  title: 'Project: build a tiny next-token model and checkpoint ledger'
  state: draft
  summary: Make two paper language models, compare their predictions, and defend which evidence supports a
    checkpoint choice.
  slot: M36.4
  category: learning
  minutes: 45
  sources:
  - title: Dive into Deep Learning — Language Models
    url: https://d2l.ai/chapter_recurrent-neural-networks/language-model.html
  archetype: project
objectives:
- id: objective.tiny-language-model-project
  version: 2-draft
  statement: Build and compare two frozen count-model checkpoints using a supplied corpus, probability tables,
    and a fixed held-out evaluation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - tiny-language-model-project.base.v2
  - tiny-language-model-project.transfer.v2
  prerequisites:
  - anyOf:
    - objective.count-based-language
  - anyOf:
    - objective.next-token
  - anyOf:
    - objective.pretraining-budget-and-checkpoints
scenes:
- id: tiny-language-model-project.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.tiny-language-model-project
  title: Build a model you can fit on paper
  markdown: 'Your training sentences are “red cat END”, “red dog END”, and “blue cat END”. **END** is an explicit
    end-of-sentence token. Use the vocabulary [red, blue, cat, dog, END] in that order.


    Count adjacent pairs within each sentence, without crossing sentence boundaries. Then apply **add-one smoothing**:
    add one to every possible next-token count and divide by the new row total.


    Keep a count table, two checkpoint records, probability calculations, and a short evaluation note. Paper
    or a spreadsheet is enough; optional code should produce the same numbers.'
  text_mode: 'Your training sentences are “red cat END”, “red dog END”, and “blue cat END”. **END** is an explicit
    end-of-sentence token. Use the vocabulary [red, blue, cat, dog, END] in that order.


    Count adjacent pairs within each sentence, without crossing sentence boundaries. Then apply **add-one smoothing**:
    add one to every possible next-token count and divide by the new row total.


    Keep a count table, two checkpoint records, probability calculations, and a short evaluation note. Paper
    or a spreadsheet is enough; optional code should produce the same numbers.'
  bridges: []
- id: tiny-language-model-project.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.tiny-language-model-project
  title: 'Reference trace: checkpoint C1'
  markdown: 'Pause and make your pair table before comparing. The six pairs are red→cat, cat→END, red→dog,
    dog→END, blue→cat, and cat→END. Thus red has two outgoing observations, blue one, cat two, and dog one.
    Save these counts as C1 with the corpus, vocabulary order, and smoothing rule. After red, the count row
    is [0, 0, 1, 1, 0]. Add one to each entry: [1, 1, 2, 2, 1]. Divide by the total 7 to obtain probabilities.
    The five probabilities sum to one.'
  text_mode: 'Pause and make your pair table before comparing. The six pairs are red→cat, cat→END, red→dog,
    dog→END, blue→cat, and cat→END. Thus red has two outgoing observations, blue one, cat two, and dog one.
    Save these counts as C1 with the corpus, vocabulary order, and smoothing rule. After red, the count row
    is [0, 0, 1, 1, 0]. Add one to each entry: [1, 1, 2, 2, 1]. Divide by the total 7 to obtain probabilities.
    The five probabilities sum to one.'
  bridges: []
- id: tiny-language-model-project.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tiny-language-model-project
  title: Make a second checkpoint without overwriting the first
  markdown: Add one training sentence, “red cat END”, and save the resulting table as C2. The red row becomes
    [0, 0, 2, 1, 0]. Its smoothed probabilities are [1/8, 1/8, 3/8, 2/8, 1/8]. Cat→END now has count three;
    the other previously observed pairs retain their counts. Keep C1 intact so the comparison is reproducible.
    These are training changes. Looking up a probability from a fixed table is inference and does not itself
    change the table.
  text_mode: Add one training sentence, “red cat END”, and save the resulting table as C2. The red row becomes
    [0, 0, 2, 1, 0]. Its smoothed probabilities are [1/8, 1/8, 3/8, 2/8, 1/8]. Cat→END now has count three;
    the other previously observed pairs retain their counts. Keep C1 intact so the comparison is reproducible.
    These are training changes. Looking up a probability from a fixed table is inference and does not itself
    change the table.
  bridges: []
- id: tiny-language-model-project.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tiny-language-model-project
  title: Fix a validation comparison before choosing
  markdown: 'Reserve two transition observations, red→cat and red→dog, and give them equal weight in the comparison.
    They do not add to the training counts. They repeat patterns seen in training, which can occur for distinct
    observations; this tiny, selected example does not establish real-world generalization.


    Score each target using **negative natural-log probability**, −ln(p), where lower is better. A calculator
    or these supplied values will do:


    - C1: 1.253 for cat and 1.253 for dog; average 1.253.

    - C2: 0.981 for cat and 1.386 for dog; average about 1.184.


    Use both cases, rather than selecting only the improved cat result. Because these reserved observations
    help choose a checkpoint, they are **validation data**, not an untouched final test. An independent estimate
    after selection would need additional reserved data.'
  text_mode: 'Reserve two transition observations, red→cat and red→dog, and give them equal weight in the comparison.
    They do not add to the training counts. They repeat patterns seen in training, which can occur for distinct
    observations; this tiny, selected example does not establish real-world generalization.


    Score each target using **negative natural-log probability**, −ln(p), where lower is better. A calculator
