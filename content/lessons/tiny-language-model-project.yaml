schema_version: 0.2-draft
lesson:
  id: tiny-language-model-project
  version: 0.1.0-draft
  title: 'Project: build a tiny next-token model and checkpoint ledger'
  state: draft
  summary: Build a transparent count-based language model, compare held-out likelihoods across frozen checkpoints,
    and connect the exercise to the much larger neural training lifecycle.
  slot: M36.4
  category: learning
  minutes: 45
  sources:
  - title: Introduction to Information Retrieval — authors’ online edition
    url: https://nlp.stanford.edu/IR-book/
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.tiny-language-model-project
  version: 1-draft
  statement: Build a transparent count-based language model, compare held-out likelihoods across frozen checkpoints,
    and connect the exercise to the much larger neural training lifecycle.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - tiny-language-model-project.base
  - tiny-language-model-project.transfer
  prerequisites:
  - anyOf:
    - objective.count-based-language
  - anyOf:
    - objective.next-token
  - anyOf:
    - objective.pretraining-budget-and-checkpoints
scenes:
- id: tiny-language-model-project.s1
  title: Use a tiny explicit corpus
  type: explanation
  depth: intuition
  objective_refs:
  - objective.tiny-language-model-project
  markdown: 'This no-code project uses three tokenized training sentences: “red cat END”, “red dog END”, “blue cat
    END”. Vocabulary: red, blue, cat, dog, END. Count adjacent token pairs within each sentence only. Save counts,
    token order, smoothing rule, and data version as checkpoint C1. A count model predicts tokens but has no transformer
    or gradient optimizer.'
  text_mode: 'This no-code project uses three tokenized training sentences: “red cat END”, “red dog END”, “blue
    cat END”. Vocabulary: red, blue, cat, dog, END. Count adjacent token pairs within each sentence only. Save counts,
    token order, smoothing rule, and data version as checkpoint C1. A count model predicts tokens but has no transformer
    or gradient optimizer.'
  bridges: []
- id: tiny-language-model-project.s2
  title: Compute the conditional distribution
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tiny-language-model-project
  markdown: 'After red, counts are cat=1, dog=1, and zero for the other three tokens. Add-one smoothing gives denominator
    2+5=7: cat and dog each get 2/7; red, blue, and END each get 1/7. They sum to one. Explain why smoothing assigns
    some probability to transitions absent from the training set, including implausible ones.'
  text_mode: 'After red, counts are cat=1, dog=1, and zero for the other three tokens. Add-one smoothing gives denominator
    2+5=7: cat and dog each get 2/7; red, blue, and END each get 1/7. They sum to one. Explain why smoothing assigns
    some probability to transitions absent from the training set, including implausible ones.'
  bridges:
  - powers-logs
  - python-experiments
- id: tiny-language-model-project.s3
  title: Compare a frozen update
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tiny-language-model-project
  markdown: Add one training sentence “red cat END” and save C2 separately. Its probability of cat after red becomes
    3/8, compared with 2/7 for C1. On the fixed held-out transition red→cat, negative log probability improves from
    about 1.253 to 0.981 nats. On red→dog it worsens from about 1.253 to 1.386. Choose an aggregate evaluation before
    selecting a checkpoint.
  text_mode: Add one training sentence “red cat END” and save C2 separately. Its probability of cat after red becomes
    3/8, compared with 2/7 for C1. On the fixed held-out transition red→cat, negative log probability improves from
    about 1.253 to 0.981 nats. On red→dog it worsens from about 1.253 to 1.386. Choose an aggregate evaluation before
    selecting a checkpoint.
  bridges: []
- id: tiny-language-model-project.s4
  title: Deliver the lifecycle trace
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.tiny-language-model-project
  markdown: Save the corpus, count tables, both checkpoint manifests, probability calculations, and an evaluation
    note. Optionally implement them in Python; paper is equivalent for this task. Map counts to neural parameters,
    pair counting to optimization, and conditional lookup to decoding, while naming those differences. Score arithmetic,
    frozen artifacts, fair comparison, and limits 0–2 each. The quiz does not grade your files or certify transformer
    implementation.
  text_mode: Save the corpus, count tables, both checkpoint manifests, probability calculations, and an evaluation
    note. Optionally implement them in Python; paper is equivalent for this task. Map counts to neural parameters,
    pair counting to optimization, and conditional lookup to decoding, while naming those differences. Score arithmetic,
    frozen artifacts, fair comparison, and limits 0–2 each. The quiz does not grade your files or certify transformer
    implementation.
  bridges: []
- id: tiny-language-model-project.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.tiny-language-model-project
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: tiny-language-model-project.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.tiny-language-model-project
  markdown: Build a transparent count-based language model, compare held-out likelihoods across frozen checkpoints,
    and connect the exercise to the much larger neural training lifecycle.
  text_mode: Build a transparent count-based language model, compare held-out likelihoods across frozen checkpoints,
    and connect the exercise to the much larger neural training lifecycle.
