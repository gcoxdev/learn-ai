schema_version: 0.2-draft
lesson:
  id: mechanistic-interpretability
  version: 0.1.0-draft
  title: Test hypotheses about internal representations and computation
  state: draft
  summary: Probes, activation interventions, circuit analyses, and sparse autoencoders provide different evidence
    about learned computation; distinguish decodability, causal influence, and complete mechanistic explanation.
  slot: M28.7
  category: learning
  minutes: 12
  sources:
  - title: Locating and Editing Factual Associations
    url: https://arxiv.org/abs/2202.05262
  - title: Towards Monosemanticity
    url: https://transformer-circuits.pub/2023/monosemantic-features/index.html
  - title: Towards Automated Circuit Discovery
    url: https://arxiv.org/abs/2304.14997
objectives:
- id: objective.mechanistic-interpretability
  version: 1-draft
  statement: Probes, activation interventions, circuit analyses, and sparse autoencoders provide different evidence
    about learned computation; distinguish decodability, causal influence, and complete mechanistic explanation.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - mechanistic-interpretability.base
  - mechanistic-interpretability.transfer
  prerequisites:
  - anyOf:
    - objective.attribution-and-counterfactual-explanations
  - anyOf:
    - objective.learned-representations
scenes:
- id: mechanistic-interpretability.s1
  title: Probe what information is decodable
  type: explanation
  depth: intuition
  objective_refs:
  - objective.mechanistic-interpretability
  markdown: A probe predicts a property from internal activations. Success shows that the chosen probe can extract
    information under the experiment’s conditions. It does not by itself prove the original model uses that information
    for its output or that the property lives in one isolated neuron.
  text_mode: A probe predicts a property from internal activations. Success shows that the chosen probe can extract
    information under the experiment’s conditions. It does not by itself prove the original model uses that information
    for its output or that the property lives in one isolated neuron.
  bridges: []
- id: mechanistic-interpretability.s2
  title: Intervene on the computation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mechanistic-interpretability
  markdown: Ablation removes or changes activations; activation patching substitutes selected states between controlled
    runs. If output changes, the intervention has evidence of causal influence within that setup. Off-distribution
    interventions and broad collateral effects can complicate claims about the intended feature.
  text_mode: Ablation removes or changes activations; activation patching substitutes selected states between controlled
    runs. If output changes, the intervention has evidence of causal influence within that setup. Off-distribution
    interventions and broad collateral effects can complicate claims about the intended feature.
  bridges: []
- id: mechanistic-interpretability.s3
  title: Represent features with sparse dictionaries
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mechanistic-interpretability
  markdown: Sparse autoencoders reconstruct activations using a larger set of sparsely active learned features.
    This can help study superposition, where features share representation dimensions. Reconstruction error, feature
    splitting, missing concepts, and interpretive ambiguity remain important limitations.
  text_mode: Sparse autoencoders reconstruct activations using a larger set of sparsely active learned features.
    This can help study superposition, where features share representation dimensions. Reconstruction error, feature
    splitting, missing concepts, and interpretive ambiguity remain important limitations.
  bridges: []
- id: mechanistic-interpretability.s4
  title: Build and challenge a circuit hypothesis
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.mechanistic-interpretability
  markdown: Propose which components compute a behavior, test necessity and sufficiency under controlled examples,
    and evaluate new cases and alternatives. A useful local circuit explanation is not automatically a complete
    account of the model. Preserve interventions, metrics, and negative results so the hypothesis is reproducible.
  text_mode: Propose which components compute a behavior, test necessity and sufficiency under controlled examples,
    and evaluate new cases and alternatives. A useful local circuit explanation is not automatically a complete
    account of the model. Preserve interventions, metrics, and negative results so the hypothesis is reproducible.
  bridges: []
- id: mechanistic-interpretability.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.mechanistic-interpretability
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: mechanistic-interpretability.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.mechanistic-interpretability
  markdown: Probes, activation interventions, circuit analyses, and sparse autoencoders provide different evidence
    about learned computation; distinguish decodability, causal influence, and complete mechanistic explanation.
  text_mode: Probes, activation interventions, circuit analyses, and sparse autoencoders provide different evidence
    about learned computation; distinguish decodability, causal influence, and complete mechanistic explanation.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - mechanistic-interpretability.s1
    - mechanistic-interpretability.s2
    - mechanistic-interpretability.s3
    - mechanistic-interpretability.s4
    - mechanistic-interpretability.check
    - mechanistic-interpretability.recap
    gate_refs:
    - gate.core
assessment_families:
- id: mechanistic-interpretability.base
  objective_ref: objective.mechanistic-interpretability
  task: base
  response_type: single_choice
  points: 1
  hint: 'Intervene on the computation: trace the inputs, operation, and result before choosing.'
  remediation_scene: mechanistic-interpretability.s2
  variants:
  - id: mechanistic-interpretability.base.1
    prompt: A probe decodes a property. What does that alone establish?
    options:
    - id: c
      text: A complete model explanation
    - id: a
      text: Decodability under the probe setup
    - id: b
      text: That the model necessarily uses it causally
    answer: a
    feedback: Information availability and causal use differ.
  - id: mechanistic-interpretability.base.2
    prompt: What does activation patching change?
    options:
    - id: a
      text: Selected internal states between controlled runs
    - id: b
      text: Only the source-code comments
    - id: c
      text: The original training corpus automatically
    answer: a
    feedback: It intervenes on intermediate computation.
- id: mechanistic-interpretability.transfer
  objective_ref: objective.mechanistic-interpretability
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Build and challenge a circuit hypothesis: trace the inputs, operation, and result before choosing.'
  remediation_scene: mechanistic-interpretability.s4
  variants:
  - id: mechanistic-interpretability.transfer.1
    prompt: What can sparse autoencoders help investigate?
    options:
    - id: a
      text: Features distributed through shared activation dimensions
    - id: b
      text: Guaranteed unique human concepts for every neuron
    - id: c
      text: Every causal question without tests
    answer: a
    feedback: Sparse representations can expose candidate feature structure.
  - id: mechanistic-interpretability.transfer.2
    prompt: Why test a circuit hypothesis on new examples?
    options:
    - id: b
      text: To assume all components are solved
    - id: c
      text: Only to increase output length
    - id: a
      text: To check whether it generalizes beyond the discovery cases
    answer: a
    feedback: Mechanistic claims need broader evidence and alternatives.
