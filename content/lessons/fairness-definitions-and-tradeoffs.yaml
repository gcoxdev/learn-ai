schema_version: 0.2-draft
lesson:
  id: fairness-definitions-and-tradeoffs
  version: 0.2.0-draft
  title: Choose fairness measurements that match the decision context
  state: draft
  summary: Compare fairness measures without mixing up the questions they answer.
  slot: M29.2
  category: learning
  sources:
  - title: Equality of Opportunity
    url: https://arxiv.org/abs/1610.02413
  - title: Inherent Trade-Offs in the Fair Determination of Risk Scores
    url: https://arxiv.org/abs/1609.05807
objectives:
- id: objective.fairness-definitions-and-tradeoffs
  version: 1-draft
  statement: Fairness metrics encode different comparisons among groups and outcomes; label validity, error
    costs, uncertainty, and incompatible criteria require explicit contextual judgment.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - fairness-definitions-and-tradeoffs.base
  - fairness-definitions-and-tradeoffs.transfer
  prerequisites:
  - anyOf:
    - objective.classification-metrics
  - anyOf:
    - objective.stakeholders-and-deployment-decisions
scenes:
- id: fairness-definitions-and-tradeoffs.s1
  title: Name the comparison
  type: explanation
  depth: intuition
  objective_refs:
  - objective.fairness-definitions-and-tradeoffs
  markdown: Demographic parity compares positive-decision rates across groups. Equal opportunity compares true-positive
    rates among people with the positive label. Equalized odds also compares false-positive rates. Calibration
    asks whether scores mean similar observed outcome frequencies under the specified conditions.
  text_mode: Demographic parity compares positive-decision rates across groups. Equal opportunity compares
    true-positive rates among people with the positive label. Equalized odds also compares false-positive rates.
    Calibration asks whether scores mean similar observed outcome frequencies under the specified conditions.
  bridges: []
- id: fairness-definitions-and-tradeoffs.s2
  title: Work through different denominators
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.fairness-definitions-and-tradeoffs
  markdown: 'If group A receives 40 positive decisions among 100 people, its selection rate is 40 percent.
    If 30 of its 50 truly positive cases are selected, its true-positive rate is 60 percent. These measure
    different things and should not be swapped in a fairness claim.


    Continue the same example: 40 people were selected, and 30 were truly positive, so 10 selected people were
    false positives. There were 50 truly negative people, giving a false-positive rate of 10/50 = 20%. Precision
    among selected people is 30/40 = 75%. To compare two groups fairly, name the measurement and use the corresponding
    denominator for each group. A base rate is the proportion with the positive label before making a selection.'
  text_mode: 'If group A receives 40 positive decisions among 100 people, its selection rate is 40 percent.
    If 30 of its 50 truly positive cases are selected, its true-positive rate is 60 percent. These measure
    different things and should not be swapped in a fairness claim.


    Continue the same example: 40 people were selected, and 30 were truly positive, so 10 selected people were
    false positives. There were 50 truly negative people, giving a false-positive rate of 10/50 = 20%. Precision
    among selected people is 30/40 = 75%. To compare two groups fairly, name the measurement and use the corresponding
    denominator for each group. A base rate is the proportion with the positive label before making a selection.'
  bridges: []
- id: fairness-definitions-and-tradeoffs.s3
  title: Inspect labels and incompatibilities
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.fairness-definitions-and-tradeoffs
  markdown: Historical labels can reflect unequal access or biased decisions, so matching labels may reproduce
    an unjust process. Some fairness criteria cannot generally all be satisfied together when group base rates
    differ and prediction is imperfect. State assumptions and tradeoffs rather than promising one universal
    fairness score.
  text_mode: Historical labels can reflect unequal access or biased decisions, so matching labels may reproduce
    an unjust process. Some fairness criteria cannot generally all be satisfied together when group base rates
    differ and prediction is imperfect. State assumptions and tradeoffs rather than promising one universal
    fairness score.
  bridges: []
- id: fairness-definitions-and-tradeoffs.s4
  title: Include context and uncertainty
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.fairness-definitions-and-tradeoffs
  markdown: Measure relevant groups and intersections with adequate privacy and sample care. Discuss whose
    harms the chosen criterion addresses, whether thresholds differ, and how decisions can be appealed. A statistical
    parity result is evidence about a defined metric, not a complete ethical or legal conclusion.
  text_mode: Measure relevant groups and intersections with adequate privacy and sample care. Discuss whose
    harms the chosen criterion addresses, whether thresholds differ, and how decisions can be appealed. A statistical
    parity result is evidence about a defined metric, not a complete ethical or legal conclusion.
  bridges: []
- id: fairness-definitions-and-tradeoffs.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.fairness-definitions-and-tradeoffs
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Fairness metrics encode different comparisons among groups and outcomes; label validity, error
    costs, uncertainty, and incompatible criteria require explicit contextual judgment.
- id: fairness-definitions-and-tradeoffs.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.fairness-definitions-and-tradeoffs
