schema_version: 0.2-draft
lesson:
  id: fairness-definitions-and-tradeoffs
  version: 0.4.0-draft
  title: Choose fairness measurements that match the decision context
  state: draft
  summary: Three people check the same model for fairness. One says it's fair, two say it isn't, and all three have done their arithmetic right. Find out how.
  slot: M29.2
  category: learning
  sources:
    - title: Equality of Opportunity in Supervised Learning (Hardt, Price & Srebro, 2016)
      url: https://arxiv.org/abs/1610.02413
    - title: Inherent Trade-Offs in the Fair Determination of Risk Scores (Kleinberg, Mullainathan & Raghavan, 2016)
      url: https://arxiv.org/abs/1609.05807
    - title: "Fair prediction with disparate impact: A study of bias in recidivism prediction instruments (Chouldechova, 2017)"
      url: https://arxiv.org/abs/1610.07524
    - title: Machine Bias (Angwin, Larson, Mattu & Kirchner, ProPublica, May 2016)
      url: https://www.propublica.org/article/machine-bias-risk-assessments-in-criminal-sentencing
    - title: How We Analyzed the COMPAS Recidivism Algorithm (ProPublica, 2016)
      url: https://www.propublica.org/article/how-we-analyzed-the-compas-recidivism-algorithm
    - title: Dissecting racial bias in an algorithm used to manage the health of populations (Obermeyer et al., Science, 2019)
      url: https://www.science.org/doi/10.1126/science.aax2342
objectives:
  - id: objective.fairness-definitions-and-tradeoffs
    version: 2-draft
    statement: Fairness metrics encode different comparisons among groups and outcomes; label validity, error costs, uncertainty, and incompatible criteria require explicit contextual judgment.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - fairness-definitions-and-tradeoffs.base.v2
      - fairness-definitions-and-tradeoffs.transfer.v2
      - fairness-definitions-and-tradeoffs.metrics
    prerequisites:
      - anyOf:
          - objective.classification-metrics
      - anyOf:
          - objective.stakeholders-and-deployment-decisions
scenes:
  - id: fairness-definitions-and-tradeoffs.s1
    title: Three honest answers to "is it fair?"
    type: explanation
    depth: intuition
    objective_refs:
      - objective.fairness-definitions-and-tradeoffs
    markdown: |-
      Riverbend General, the hospital from the last lesson, offers home nurse visits to patients likely to be readmitted within 30 days. A model flags "high risk" patients, and they get the visits. An audit compares two groups of 1,000 patients, A and B (in a real audit, groups defined by race, sex, age, or language). Three people read it:

      - A **community advocate**: "40% of group A get visits, but only 10% of group B. That's unfair."
      - A **ward nurse**: "Of the patients who ended up readmitted, the model caught 80% in group A and only 40% in group B. That's unfair."
      - The **data scientist**: "When the model flags someone, 60% of them are readmitted, in both groups. That's fair."

      All three numbers are correct. They disagree because each person divides by a different set of people.
    bridges: []
  - id: fairness-definitions-and-tradeoffs.s2
    title: One confusion table per group
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.fairness-definitions-and-tradeoffs
    markdown: |-
      A fairness audit starts with a confusion matrix for each group, the table of true and false positives from the lesson on classification metrics. "Positive" means readmitted.

      | | Group A | Group B |
      | --- | ---: | ---: |
      | Flagged and readmitted (TP) | 240 | 60 |
      | Flagged, not readmitted (FP) | 160 | 40 |
      | Not flagged, readmitted (FN) | 60 | 90 |
      | Not flagged, not readmitted (TN) | 540 | 810 |

      Now the rates, and who each one divides by:

      | Rate | Divides by | Group A | Group B |
      | --- | --- | ---: | ---: |
      | **Base rate** | everyone: (TP + FN) / all | 300/1000 = 30% | 150/1000 = 15% |
      | **Selection rate** | everyone: (TP + FP) / all | 400/1000 = 40% | 100/1000 = 10% |
      | **True positive rate** (TPR) | the readmitted: TP / (TP + FN) | 240/300 = 80% | 60/150 = 40% |
      | **False positive rate** (FPR) | the not readmitted: FP / (FP + TN) | 160/700 = 22.9% | 40/850 = 4.7% |
      | **Precision** (PPV) | the flagged: TP / (TP + FP) | 240/400 = 60% | 60/100 = 60% |

      The **base rate** is how common the outcome is before any model acts; group A is readmitted twice as often as group B, and that will matter. The advocate compared selection rates, the nurse compared TPRs, and the data scientist compared precision, also called positive predictive value (PPV).
    bridges: []
  - id: fairness-definitions-and-tradeoffs.s3
    title: Three definitions, three different promises
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.fairness-definitions-and-tradeoffs
    markdown: |-
      Each verdict matches a named criterion:

      | Criterion | Promise | Compare across groups | Riverbend |
      | --- | --- | --- | --- |
      | **Demographic parity** | Each group gets the benefit at the same rate | Selection rate | 40% vs 10%: fails |
      | **Equalized odds** | People with the same true outcome are treated alike | TPR *and* FPR | 80% vs 40%, 22.9% vs 4.7%: fails |
      | **Calibration within groups** | A score means the same thing in every group | Outcome rate at each score | 60% vs 60% flagged, 10% vs 10% not flagged: holds |

      A weaker form of equalized odds, **equal opportunity** (Hardt, Price & Srebro, 2016), asks only for equal TPRs: people who need the help are equally likely to get it.

      :::mixup "Fair means every group is selected at the same rate."
      That's demographic parity, one criterion among several. If group A really is readmitted twice as often, equal selection rates would send visits to low-risk patients in B while turning away high-risk patients in A. Parity can be the right choice, for example when you distrust the labels themselves, but choose it for a reason.
      :::
    bridges: []
  - id: fairness-definitions-and-tradeoffs.impossibility
    title: Why you can't have all three
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.fairness-definitions-and-tradeoffs
    markdown: |-
      Could Riverbend fix the model so it is calibrated *and* has equal error rates? Not while the base rates differ.

      :::papers The impossibility result
      Alexandra Chouldechova (2017) showed that for any yes/no classifier, rearranging the definitions of TPR, FPR, and PPV gives

      $$\text{FPR} = \frac{p}{1-p}\cdot\frac{1-\text{PPV}}{\text{PPV}}\cdot\text{TPR}$$

      where $p$ is the group's base rate. For group B: $\frac{0.15}{0.85}\times\frac{0.4}{0.6}\times 0.40 = 0.047$, the 4.7% in the table. If two groups share the same PPV and the same TPR but have different $p$, their FPRs *must* differ. Kleinberg, Mullainathan & Raghavan (2016) proved the matching result for risk scores: calibration within groups and balanced errors for both classes can hold together only if the base rates are equal or the predictions are perfect.
      :::

      :::predict Keep PPV at 60% in both groups and push group B's TPR up to 80%, matching A. What FPR must group B then have?
      $\frac{0.15}{0.85}\times\frac{0.4}{0.6}\times 0.80 = 9.4\%$. Group A's is 22.9%. Matching two of the three rates forces the third apart.
      :::

      Run it, then in the last loop change group B's base rate `0.15` to `0.30`: the two FPRs match, because the conflict disappears when base rates are equal.

      ```python run
      groups = {                      # one confusion table per group (1,000 patients each)
          "A": {"TP": 240, "FP": 160, "FN": 60, "TN": 540},
          "B": {"TP": 60,  "FP": 40,  "FN": 90, "TN": 810},
      }
      for name, c in groups.items():
          n = sum(c.values())
          base = (c["TP"] + c["FN"]) / n          # share readmitted
          sel = (c["TP"] + c["FP"]) / n           # share given home visits
          tpr = c["TP"] / (c["TP"] + c["FN"])     # of the readmitted, share flagged
          fpr = c["FP"] / (c["FP"] + c["TN"])     # of the not readmitted, share flagged
          ppv = c["TP"] / (c["TP"] + c["FP"])     # of the flagged, share readmitted
          print(f"group {name}: base rate {base:.0%}  selected {sel:.0%}  "
                f"TPR {tpr:.0%}  FPR {fpr:.1%}  PPV {ppv:.0%}")

      def fpr_forced(p, ppv, tpr):
          """Chouldechova's identity: FPR = p/(1-p) * (1-PPV)/PPV * TPR."""
          return p / (1 - p) * (1 - ppv) / ppv * tpr

      print("\nSame PPV (60%) and same TPR (80%) in both groups:")
      for name, p in [("A", 0.30), ("B", 0.15)]:
          print(f"  group {name}, base rate {p:.0%}: FPR must be {fpr_forced(p, 0.6, 0.8):.1%}")
      ```
    bridges: []
  - id: fairness-definitions-and-tradeoffs.compas
    title: "COMPAS: two analyses, both correct"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.fairness-definitions-and-tradeoffs
    markdown: |-
      :::story ProPublica and Northpointe, 2016
      COMPAS is a commercial risk score that some US courts use to estimate whether a defendant will reoffend. In May 2016, ProPublica's "Machine Bias" analyzed scores for more than 7,000 people arrested in Broward County, Florida. Among defendants *not* rearrested within two years, Black defendants had been labeled medium or high risk about 45% of the time, white defendants about 23%. Among those who *were* rearrested, white defendants had been labeled low risk about 48% of the time, Black defendants about 28%. In the terms above: unequal false positive and false negative rates.

      Northpointe, the company behind COMPAS, replied that the score was equally predictive for both groups: at a given score, Black and white defendants were rearrested at similar rates. That's calibration.
      :::

      Both analyses were arithmetically sound. Recorded rearrest rates differed between the groups, so by Chouldechova's identity a score calibrated for both had to have unequal error rates.

      Which should a court score have? Calibration, so "high risk" means the same for everyone, or equal error rates, because a wrong "high risk" label can mean jail? Careful scholars still disagree. And underneath both: rearrest isn't reoffending, since who gets arrested depends partly on where police patrol.
    bridges: []
  - id: fairness-definitions-and-tradeoffs.s4
    title: Check the label, then choose the criterion
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.fairness-definitions-and-tradeoffs
    markdown: |-
      Every criterion above trusts the labels. Sometimes the label is the problem.

      :::story The cost-based care algorithm
      In 2019, Ziad Obermeyer and colleagues studied an algorithm widely used by US health systems to choose patients for extra-care programs. It predicted future health-care *costs* as a stand-in for health *needs*. Less money had historically been spent on Black patients with the same illness, so at a given score, Black patients were considerably sicker than white patients. Removing this gap, the authors estimated, would raise the share of Black patients selected for extra help from 17.7% to 46.5%.
      :::

      Riverbend's team makes its own choice in three steps:

      1. **Check the label.** Group B patients more often return to a *different* hospital, so their readmissions go unrecorded. The team links records with nearby hospitals.
      2. **Name the harm.** Home visits are a benefit, so the costly mistake is missing a patient who needed one. The criterion that matters most is **equal opportunity**: equal TPRs.
      3. **Accept the trade-off in writing.** Lowering group B's threshold until its TPR reaches 80% lowers B's precision: more visits go to patients who wouldn't have been readmitted. The team records that choice and its reason. (In areas such as lending and hiring, using group membership this way can be illegal, so check the law.)

      When a decision *punishes* rather than helps, such as freezing a bank account, the costly mistake is the false positive, and equal FPRs usually matter more.
    bridges: []
  - id: fairness-definitions-and-tradeoffs.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.fairness-definitions-and-tradeoffs
    markdown: Compute one group's four rates from its confusion table, then pick the right criterion for tutoring, fraud, lending, and a cost-based care model.
    takeaway: |-
      Selection rate, TPR, FPR, and precision divide by different people, so fairness criteria can disagree. When base rates differ, calibration and equal error rates can't both hold: check the label, name the costly mistake, and choose in writing.
  - id: fairness-definitions-and-tradeoffs.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.fairness-definitions-and-tradeoffs
    markdown: |-
      Fairness measures answer different questions about decisions and errors. Name the comparison, inspect the labels, and explain whose harms the chosen measure addresses.
