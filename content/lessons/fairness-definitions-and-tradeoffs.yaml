assessment_families:
  - id: fairness-definitions-and-tradeoffs.base
    objective_ref: objective.fairness-definitions-and-tradeoffs
    task: base
    response_type: single_choice
    points: 1
    hint: 'Work through different denominators: trace the inputs, operation, and result before choosing.'
    remediation_scene: fairness-definitions-and-tradeoffs.s2
    variants:
      - id: fairness-definitions-and-tradeoffs.base.1
        prompt: 40 positive decisions among 100 people gives selection rate what?
        options:
          - id: c
            text: 30 percent
          - id: a
            text: 40 percent
          - id: b
            text: 60 percent
        answer: a
        feedback: Selection rate uses all people in the group as denominator.
        retired: true
      - id: fairness-definitions-and-tradeoffs.base.2
        prompt: 30 selected among 50 truly positive cases gives true-positive rate what?
        options:
          - id: a
            text: 60 percent
          - id: b
            text: 30 percent
          - id: c
            text: 40 percent
        answer: a
        feedback: True-positive rate conditions on the positive label.
        retired: true
  - id: fairness-definitions-and-tradeoffs.transfer
    objective_ref: objective.fairness-definitions-and-tradeoffs
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Include context and uncertainty: trace the inputs, operation, and result before choosing.'
    remediation_scene: fairness-definitions-and-tradeoffs.s4
    variants:
      - id: fairness-definitions-and-tradeoffs.transfer.1
        prompt: Can historical labels encode unequal treatment?
        options:
          - id: a
            text: 'Yes'
          - id: b
            text: 'No'
          - id: c
            text: Only if the model is neural
        answer: a
        feedback: Labels come from social and measurement processes.
        retired: true
      - id: fairness-definitions-and-tradeoffs.transfer.2
        prompt: Does satisfying one parity metric settle every fairness question?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only with a large sample
          - id: a
            text: 'No'
        answer: a
        feedback: Metrics address particular comparisons and can conflict.
        retired: true
  - id: fairness-definitions-and-tradeoffs.base.v2
    objective_ref: objective.fairness-definitions-and-tradeoffs
    task: base
    response_type: single_choice
    points: 1
    hint: 'Ask who each rate divides by: everyone (selection rate), the truly positive (TPR), the truly negative (FPR), or the flagged (precision).'
    remediation_scene: fairness-definitions-and-tradeoffs.s3
    variants:
      - id: fairness-definitions-and-tradeoffs.base.v2.1
        prompt: A hiring screen passes 30% of applicants from one group and 18% from another. Which fairness criterion does this comparison test?
        options:
          - id: b
            text: Equalized odds, which compares error rates between groups
          - id: a
            text: Demographic parity, which compares selection rates
          - id: c
            text: Calibration, which compares what a pass means in each group
        answer: a
        feedback: A share of all applicants who pass is a selection rate, the quantity demographic parity compares. Equalized odds would split applicants by whether they were truly qualified first; calibration would look only at those who passed.
      - id: fairness-definitions-and-tradeoffs.base.v2.2
        prompt: 'An auditor says a hiring screen "satisfies equalized odds." What did she check?'
        options:
          - id: c
            text: Among applicants who pass, equal shares in each group are qualified
          - id: b
            text: Applicants in each group pass at the same overall rate
          - id: a
            text: Qualified applicants pass at equal rates, and so do unqualified ones
        answer: a
        feedback: Equalized odds means equal TPRs (qualified applicants) and equal FPRs (unqualified applicants) across groups. Equal pass rates overall is demographic parity, and equal shares qualified among those who pass is precision, the calibration view.
      - id: fairness-definitions-and-tradeoffs.base.v2.3
        prompt: A model is calibrated in two groups whose base rates are 30% and 15%, and it makes some mistakes. What follows?
        options:
          - id: a
            text: The groups can't have both equal TPRs and equal FPRs
          - id: b
            text: The groups must also have equal selection rates
          - id: c
            text: The model must be flagging the lower-risk group too often
        answer: a
        feedback: With equal precision and different base rates, Chouldechova's identity forces the FPRs apart whenever the TPRs match, and vice versa. Calibration pushes selection rates apart rather than together, as Riverbend's 40% and 10% show.
      - id: fairness-definitions-and-tradeoffs.base.v2.4
        prompt: ProPublica found unequal error rates in COMPAS; Northpointe found the scores equally predictive. How can both analyses be arithmetically right?
        options:
          - id: c
            text: One side miscounted, since calibration and error rates move together
          - id: a
            text: Each measured a different criterion, and they conflict when base rates differ
          - id: b
            text: They analyzed different defendants, so the two results can't be compared
        answer: a
        feedback: ProPublica compared error rates and Northpointe compared calibration, using the same Broward County data. With different recorded rearrest rates, a calibrated score must have unequal error rates, so neither side had to be wrong about its own numbers.
  - id: fairness-definitions-and-tradeoffs.transfer.v2
    objective_ref: objective.fairness-definitions-and-tradeoffs
    task: transfer
    response_type: single_choice
    points: 1
    hint: Name the costly mistake in this setting, a person who needed help and was missed or a person wrongly flagged, and check whether the label measures what you care about.
    remediation_scene: fairness-definitions-and-tradeoffs.s4
    variants:
      - id: fairness-definitions-and-tradeoffs.transfer.v2.1
        prompt: A school offers free tutoring to students a model flags as likely to fail. Missing a struggling student is the harm the school most wants to avoid. Which rate should match across groups?
        options:
          - id: b
            text: The false positive rate, among students who would have passed
          - id: c
            text: The selection rate, among all students in each group
          - id: a
            text: The true positive rate, among students who would have failed
        answer: a
        feedback: Tutoring is a benefit, so the costly error is missing a struggling student. Equal TPRs (equal opportunity) make struggling students equally likely to get help in every group. Equal FPRs protect against wrongly flagging students, which costs little here.
      - id: fairness-definitions-and-tradeoffs.transfer.v2.2
        prompt: A bank's fraud model freezes the accounts it flags. Honest customers frozen by mistake are the harm the bank most wants to spread fairly. Which rate should it compare across groups?
        options:
          - id: a
            text: The false positive rate, among honest customers
          - id: b
            text: The true positive rate, among fraudulent customers
          - id: c
            text: Precision, among the accounts that were frozen
        answer: a
        feedback: The harm falls on honest customers who were flagged, which is exactly what the FPR counts. The TPR is about catching fraud, and precision describes the frozen accounts, not the honest customers' chance of being frozen.
      - id: fairness-definitions-and-tradeoffs.transfer.v2.3
        prompt: A care program's model predicts next year's medical spending to find the sickest patients. One group has historically received less care for the same illness. What is the main problem?
        options:
          - id: c
            text: The threshold should be set separately for each group
          - id: a
            text: Spending measures access to care, so that group's need is underestimated
          - id: b
            text: The model is calibrated too well for the group that spends more
        answer: a
        feedback: This is the Obermeyer et al. (2019) finding. The label is spending, a proxy for need, and it records less need wherever less care was given. Adjusting thresholds or calibration still trusts the wrong label; the fix starts with a better target.
      - id: fairness-definitions-and-tradeoffs.transfer.v2.4
        prompt: A well-calibrated loan model approves 50% of one group and 35% of another, whose recorded repayment rates differ. A manager proposes separate thresholds to equalize approvals. What trade-off should the team state?
        options:
          - id: b
            text: Equal approval rates will also correct any bias in the repayment labels
          - id: c
            text: Nothing else changes, because the model itself stays calibrated
          - id: a
            text: Equal approval rates will make precision or error rates differ by group
        answer: a
        feedback: Moving thresholds to force demographic parity changes who is approved at each score, so precision or error rates diverge between groups. Parity doesn't repair biased labels, and the thresholded decisions no longer inherit the model's calibration.
  - id: fairness-definitions-and-tradeoffs.metrics
    objective_ref: objective.fairness-definitions-and-tradeoffs
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: 'Selection rate divides by everyone, TPR by the truly positive (TP + FN), FPR by the truly negative (FP + TN), and precision by the flagged (TP + FP).'
    remediation_scene: fairness-definitions-and-tradeoffs.s2
    variants:
      - id: fairness-definitions-and-tradeoffs.metrics.1
        prompt: 'One group of 100 applicants: TP = 20, FP = 5, FN = 10, TN = 65. Give the selection rate, TPR, FPR, and precision as percentages (one decimal place). Then say what must hold for a second group with the same precision but a lower base rate.'
        feedback: Selection 25/100 = 25%. TPR 20/30 = 66.7%. FPR 5/70 = 7.1%. Precision 20/25 = 80%. With equal precision and different base rates, Chouldechova's identity forces the TPRs or FPRs apart.
        answers:
          selection_rate: 25
          tpr: 66.7
          fpr: 7.1
          precision: 80
        reason_answer: conflict
        reason_options:
          - id: conflict
            text: Its TPR and FPR can't both match this group's unless predictions are perfect.
          - id: parity
            text: Its selection rate must match this group's, because precision matches.
          - id: higher
            text: Its FPR must be higher than this group's, because its base rate is lower.
      - id: fairness-definitions-and-tradeoffs.metrics.2
        prompt: 'One group of 200 patients: TP = 45, FP = 15, FN = 5, TN = 135. Give the selection rate, TPR, FPR, and precision as percentages (one decimal place). Then say what must hold for a second group with the same precision but a lower base rate.'
        feedback: Selection 60/200 = 30%. TPR 45/50 = 90%. FPR 15/150 = 10%. Precision 45/60 = 75%. Equal precision with a different base rate means equal TPR and equal FPR can't both hold.
        answers:
          selection_rate: 30
          tpr: 90
          fpr: 10
          precision: 75
        reason_answer: conflict
        reason_options:
          - id: parity
            text: Its selection rate must match this group's, because precision matches.
          - id: conflict
            text: Its TPR and FPR can't both match this group's unless predictions are perfect.
          - id: higher
            text: Its FPR must be higher than this group's, because its base rate is lower.
      - id: fairness-definitions-and-tradeoffs.metrics.3
        prompt: 'One group of 500 borrowers: TP = 60, FP = 40, FN = 20, TN = 380. Give the selection rate, TPR, FPR, and precision as percentages (one decimal place). Then say what must hold for a second group with the same precision but a lower base rate.'
        feedback: Selection 100/500 = 20%. TPR 60/80 = 75%. FPR 40/420 = 9.5%. Precision 60/100 = 60%. A lower base rate at the same precision makes matching both error rates impossible for an imperfect model.
        answers:
          selection_rate: 20
          tpr: 75
          fpr: 9.5
          precision: 60
        reason_answer: conflict
        reason_options:
          - id: higher
            text: Its FPR must be higher than this group's, because its base rate is lower.
          - id: parity
            text: Its selection rate must match this group's, because precision matches.
          - id: conflict
            text: Its TPR and FPR can't both match this group's unless predictions are perfect.
      - id: fairness-definitions-and-tradeoffs.metrics.4
        prompt: 'One group of 400 students: TP = 72, FP = 48, FN = 8, TN = 272. Give the selection rate, TPR, FPR, and precision as percentages (one decimal place). Then say what must hold for a second group with the same precision but a lower base rate.'
        feedback: Selection 120/400 = 30%. TPR 72/80 = 90%. FPR 48/320 = 15%. Precision 72/120 = 60%. By Chouldechova's identity, the second group's TPR and FPR can't both match these.
        answers:
          selection_rate: 30
          tpr: 90
          fpr: 15
          precision: 60
        reason_answer: conflict
        reason_options:
          - id: conflict
            text: Its TPR and FPR can't both match this group's unless predictions are perfect.
          - id: higher
            text: Its FPR must be higher than this group's, because its base rate is lower.
          - id: parity
            text: Its selection rate must match this group's, because precision matches.
    absolute_tolerance: 0.15
    numeric_fields:
      - id: selection_rate
        label: Selection rate (%)
      - id: tpr
        label: True positive rate (%)
      - id: fpr
        label: False positive rate (%)
      - id: precision
        label: Precision (%)
