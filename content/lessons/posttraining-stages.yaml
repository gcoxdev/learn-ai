schema_version: 0.2-draft
lesson:
  id: posttraining-stages
  version: 0.4.0-draft
  title: Track what each adaptation stage changes
  state: draft
  summary: Ask a raw base model "Do you fix e-bikes?" and it may write a whole forum thread. Meet the training stages that turn it into an assistant, and what each can break.
  slot: M20.1
  category: learning
  sources:
    - title: "Training language models to follow instructions with human feedback (InstructGPT; Ouyang et al., 2022)"
      url: https://arxiv.org/abs/2203.02155
    - title: "Direct Preference Optimization: Your Language Model is Secretly a Reward Model (Rafailov et al., 2023)"
      url: https://arxiv.org/abs/2305.18290
    - title: "Tülu 3: Pushing Frontiers in Open Language Model Post-Training (Lambert et al., 2024)"
      url: https://arxiv.org/abs/2411.15124
    - title: "DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning (DeepSeek-AI, 2025)"
      url: https://arxiv.org/abs/2501.12948
  archetype: mechanism
objectives:
  - id: objective.posttraining-stages
    version: 3-draft
    statement: Classify supervised demonstrations, preference training, reward-based updates, and runtime-only changes by the data and parameters involved.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - posttraining-stages.base.v3
      - posttraining-stages.transfer.v3
    prerequisites:
      - anyOf:
          - objective.pretraining-objectives
      - anyOf:
          - objective.continued-pretraining
scenes:
  - id: posttraining-stages.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.posttraining-stages
    title: A base model continues documents
    markdown: |-
      Ferncliff Cycles runs three bike shops and wants an assistant that answers customer questions. The team downloads an open **base model**, a model that has only been pretrained (as in the pretraining module) to predict the next token of web text, books, and code. They type:

      ```text
      Customer: Do you fix e-bikes?
      Assistant:
      ```

      :::predict What does the base model write next?
      More of the page. It might write "Yes, we do!" and then carry on with "Customer: What about tubeless tires? Assistant: ...", playing both parts. It has never been trained to be one helpful party that answers and stops.
      :::

      The base model already knows a great deal about bikes. What it lacks is the *habit* of answering. **Post-training** is all the training that comes after pretraining to fix that: it turns a document-continuer into an assistant. Most modern chat models go through some version of this pipeline:

      | Stage | Training data | What it fixes | What can get worse |
      | --- | --- | --- | --- |
      | **Supervised fine-tuning (SFT)** | Written examples: a prompt plus an ideal answer | Answers in the assistant's role, in the right format, then stops | Copies the writers' style and their mistakes |
      | **Preference tuning** (RLHF or DPO) | Comparisons: answer A is better than answer B | Tone, helpfulness, when to decline: things easier to judge than to write | Wordiness, flattery, needless refusals |
      | **RL with verifiable rewards** (sometimes) | Tasks with checkable answers: maths, code with tests | Accuracy on long multi-step problems | Gaming the checker; very long answers |
    diagram:
      caption: The usual post-training pipeline. Each stage starts from the previous checkpoint and learns from a different kind of data.
      description: A base model is fine-tuned on written demonstrations (SFT). The SFT model is then tuned on preference comparisons (RLHF or DPO). Sometimes a further stage applies reinforcement learning with verifiable rewards from automatic checks such as unit tests. Demonstrations feed SFT, comparisons feed preference tuning, and automatic checks feed the RL stage; the arrow to the RL stage is dashed because not every model has one.
      nodes:
        - id: base
          label: Base model
          note: predicts web text
          col: 0
          row: 0
          tone: muted
        - id: sft
          label: SFT
          note: imitate good answers
          col: 1
          row: 0
          tone: accent
        - id: pref
          label: Preference tuning
          note: RLHF or DPO
          col: 2
          row: 0
          tone: accent
        - id: rlvr
          label: RL, verifiable rewards
          note: maths, code, tools
          col: 3
          row: 0
          tone: accent
        - id: demos
          label: Demonstrations
          note: prompt + ideal answer
          col: 1
          row: 1
          tone: data
        - id: pairs
          label: Comparisons
          note: A is better than B
          col: 2
          row: 1
          tone: data
        - id: checks
          label: Automatic checks
          note: tests pass or fail
          col: 3
          row: 1
          tone: data
      edges:
        - from: base
          to: sft
        - from: sft
          to: pref
        - from: pref
          to: rlvr
          label: sometimes
          dashed: true
        - from: demos
          to: sft
        - from: pairs
          to: pref
        - from: checks
          to: rlvr
    bridges: []
  - id: posttraining-stages.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.posttraining-stages
    title: "Stage one: show it good answers"
    markdown: |-
      Ferncliff's staff pull 800 real questions from old support emails and write the answer they wish they had sent:

      > **Customer:** Do you fix e-bikes?
      > **Assistant:** Yes. All three shops service e-bikes from the major brands. Book a slot online or call your nearest shop.

      Each pair is a **demonstration**. Training on demonstrations is **supervised fine-tuning (SFT)**: the model's weights are nudged so the written answer becomes more likely, token by token. After SFT it answers in one voice and stops when it's done.

      :::mixup "Fine-tuning is how the assistant learns about bikes."
      Most of what the model knows came from pretraining on trillions of tokens. A few hundred demonstrations mostly teach *how to behave*: role, format, and tone. If the model doesn't know how e-bike motors work, 800 examples won't teach it.
      :::
    bridges: []
  - id: posttraining-stages.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.posttraining-stages
    title: "Stage two: it's easier to judge than to write"
    markdown: |-
      Writing a perfect answer is slow; picking the better of two is fast. In Ferncliff's trial, a staff member wrote about 15 demonstrations an hour but judged about 100 pairs an hour. With 50 staff hours to spend, that's 750 demonstrations or 5,000 comparisons.

      A **preference pair** is one prompt with two candidate answers and a label saying which is better. For "How much is a tune-up?", answer A quotes the price list; answer B invents a price. Staff pick A.

      Two families of methods learn from pairs:

      - **RLHF** (reinforcement learning from human feedback) first trains a separate *reward model* to score answers the way the staff would, then uses reinforcement learning to push the assistant toward high scores.
      - **DPO** (direct preference optimization) skips the reward model and adjusts the assistant's probabilities directly from the pairs.

      Both start from the SFT model: SFT gets answers into shape, and preferences sharpen which good-looking answer is better.
    bridges: []
  - id: posttraining-stages.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.posttraining-stages
    title: "Stage three: reward answers a program can check"
    markdown: |-
      In reinforcement learning, the model being trained is called the **policy**: the rule that assigns a probability to each token it might write next. The policy writes answers, something scores them with a number called a **reward**, and training makes high-reward answers more likely.

      Ferncliff's assistant can book repairs by writing a booking request. A program checks it: valid JSON, a real slot, an open shop? Pass earns 1, fail earns 0. Training against checks like these is called **reinforcement learning with verifiable rewards (RLVR)**. The Tülu 3 report (2024) coined the name, and DeepSeek-R1 (2025) used rule-based rewards of this kind to push maths and coding ability; the reasoning module covers it in depth.

      A reward is only as good as its rule. Suppose the team adds a small bonus for "thorough" answers, measured by length. Soon the assistant pads every reply with safety tips. The policy did exactly what the reward asked, which is why every stage needs checks on the behavior you actually want.
    bridges: []
  - id: posttraining-stages.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.posttraining-stages
    markdown: A travel app, a coding assistant, a model card, and a surprising regression test whether you can name which stage, or which runtime change, produced a behavior.
    takeaway: |-
      Post-training turns a document-continuer into an assistant: SFT imitates written answers, preference tuning learns from comparisons, and RL rewards checkable success. Name each stage's data and what it changed, and check what got worse.
  - id: posttraining-stages.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.posttraining-stages
    markdown: |-
      To understand a post-training stage, identify its data, training signal, parameter changes, and measured results.
  - id: posttraining-stages.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.posttraining-stages
    title: Some changes never touch the weights
    markdown: |-
      In November, Ferncliff's assistant starts quoting the new winter prices. Nobody retrained anything: an engineer added the price list to the **system prompt**, the standing instructions placed before every conversation.

      Many changes never touch a weight:

      | Change | Where it lives |
      | --- | --- |
      | A system prompt or an example in the prompt | Runtime input |
      | A retrieved document or a tool result | Runtime input |
      | Temperature or other sampling settings | How tokens are picked from the model's output |
      | SFT, RLHF, DPO, RLVR | Saved weights |

      When behavior changes, sort each change into *saved weights* or *this conversation* before you guess why. Runtime changes are instant and easy to undo; weight changes persist into every conversation, so they need the before-and-after testing at the end of this module.
    bridges: []
  - id: posttraining-stages.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.posttraining-stages
    title: The recipe that made ChatGPT possible
    markdown: |-
      The map below places post-training in a model's whole life: prepare the data, pretrain, adapt if needed, evaluate and release, use the model, then watch how it does. Only two of those stages change weights, pretraining and adaptation. Evaluation, everyday use (including Ferncliff's system-prompt change), and monitoring all run the model with its weights fixed; a fix found while monitoring means a new, separately tested training run.

      Real recipes vary: some skip a stage, repeat SFT and preference rounds, or mix in extra pretraining. When you read a model card, look for each stage's data, training signal, and evaluations, including what got worse.

      :::story InstructGPT: smaller but preferred
      In 2022, OpenAI's Ouyang and colleagues published the recipe behind InstructGPT. It had three steps: SFT on answers written by human labelers, a reward model trained on labelers' rankings of several model answers, and reinforcement learning (PPO) against that reward model. Labelers preferred answers from the 1.3-billion-parameter InstructGPT to those from the 175-billion-parameter GPT-3, a model about 135 times larger. Post-training didn't add knowledge; it made the knowledge usable. ChatGPT, released in November 2022, was trained with similar methods.
      :::
    bridges: []
    figure:
      kind: lifecycle
      caption: Find adaptation in the larger lifecycle, then compare it with changes made only at inference time.
      description: Post-training can change a saved model using demonstrations or feedback. A changed prompt or sampling rule can also change an answer while weights remain fixed. Select stages to distinguish these operations.
  - id: posttraining-stages.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.posttraining-stages
    title: The answer changed; did the weights?
    markdown: |-
      A frozen model answers differently after a relevant document is added to its prompt. Which change does this show?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: Its runtime context changed.
        - id: b
          text: Its weights were necessarily fine-tuned.
        - id: c
          text: Its original pretraining dataset was rewritten.
      answer: a
      reveal_markdown: |-
        The document went into the prompt, which is runtime input, just like Ferncliff's winter price list in the system prompt. The weights are exactly the same numbers as before; the model simply read something new.
      hint: Where did the new document go, into the prompt or into a training run?
      id: posttraining-stages.practice.v2.7
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - posttraining-stages.s1
        - posttraining-stages.s2
        - posttraining-stages.s3
        - posttraining-stages.s4
        - posttraining-stages.s5
        - posttraining-stages.s6
        - posttraining-stages.s7
        - posttraining-stages.check
      gate_refs:
        - gate.core
  scene_aliases:
    posttraining-stages.recap: posttraining-stages.check
assessment_families:
  - id: posttraining-stages.base
    objective_ref: objective.posttraining-stages
    task: base
    response_type: single_choice
    points: 1
    hint: 'Record each transformation: trace the inputs, operation, and result before choosing.'
    remediation_scene: posttraining-stages.s2
    variants:
      - id: posttraining-stages.base.1
        prompt: Does every model follow one mandatory post-training sequence?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only dense models do
        answer: a
        feedback: Recipes vary and may repeat or omit stages.
        retired: true
      - id: posttraining-stages.base.2
        prompt: Which action necessarily describes a parameter adaptation?
        options:
          - id: b
            text: Adding a document to the prompt
          - id: c
            text: Changing output temperature only
          - id: a
            text: Fine-tuning selected weights
        answer: a
        feedback: Fine-tuning updates learned parameters.
        retired: true
  - id: posttraining-stages.transfer
    objective_ref: objective.posttraining-stages
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate retained and added abilities: trace the inputs, operation, and result before choosing.'
    remediation_scene: posttraining-stages.s4
    variants:
      - id: posttraining-stages.transfer.1
        prompt: A system prompt changes behavior. Does this prove weights changed?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if the response is longer
          - id: a
            text: 'No'
        answer: a
        feedback: Runtime inputs can change output without training.
        retired: true
      - id: posttraining-stages.transfer.2
        prompt: What belongs on a training-stage transition record?
        options:
          - id: c
            text: Only the final response length
          - id: a
            text: Starting artifact, data, objective, updated state, and evaluation
          - id: b
            text: Only the product name
        answer: a
        feedback: Lineage makes the transformation inspectable.
        retired: true
  - id: posttraining-stages.base.v2
    objective_ref: objective.posttraining-stages
    task: base
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: posttraining-stages.s3
    variants:
      - prompt: A prompt is paired with a desired response used as training targets. Which signal is this?
        answer: a
        options:
          - id: b
            text: A comparison between two complete responses
          - id: c
            text: A runtime-only document retrieval
          - id: a
            text: A supervised demonstration
        feedback: Supervised fine-tuning uses desired output examples under a defined objective.
        id: posttraining-stages.base.v2.1
        retired: true
      - prompt: A reviewer ranks response A above response B for the same prompt. What kind of data is supplied?
        answer: a
        options:
          - id: c
            text: A fixed attention mask
          - id: a
            text: A preference comparison
          - id: b
            text: A next-token vocabulary table
        feedback: The data says which candidate is preferred under the review criteria.
        id: posttraining-stages.base.v2.2
        retired: true
      - prompt: A model generates candidates, receives numerical scores, and updates its policy from them. Which process is described?
        answer: a
        options:
          - id: c
            text: Saving a tokenizer without training
          - id: b
            text: Adding an unchanged document to a prompt
          - id: a
            text: Reward-based training on generated behavior
        feedback: Generated behavior and scores drive parameter updates in the described loop.
        id: posttraining-stages.base.v2.3
        retired: true
      - prompt: A developer lowers temperature while keeping weights frozen. What changed?
        answer: a
        options:
          - id: a
            text: The output-selection procedure
          - id: c
            text: The original training examples
          - id: b
            text: The learned parameter values
        feedback: A decoding change affects runtime selection without necessarily training the model.
        id: posttraining-stages.base.v2.4
        retired: true
  - id: posttraining-stages.transfer.v2
    objective_ref: objective.posttraining-stages
    task: transfer
    response_type: single_choice
    points: 1
    hint: Work through the example one step at a time before answering.
    remediation_scene: posttraining-stages.s3
    variants:
      - prompt: A checkpoint is called “reasoning.” What evidence is needed to explain how it was trained?
        answer: a
        options:
          - id: c
            text: One particularly long generated answer
          - id: a
            text: Its documented data, objectives, parameter updates, and evaluations
          - id: b
            text: The name by itself
        feedback: A label does not uniquely specify a training procedure.
        id: posttraining-stages.transfer.v2.1
        retired: true
      - prompt: A reward gives points for longer answers and verbosity increases. What should be examined?
        answer: a
        options:
          - id: c
            text: Whether the reward was normalized, without examining what it rewards
          - id: b
            text: Whether a longer response is automatically more correct
          - id: a
            text: Whether the reward matches the intended usefulness criterion
        feedback: Optimizing a proxy can change behavior without improving the intended outcome.
        id: posttraining-stages.transfer.v2.2
        retired: true
      - prompt: Preference reviewers disagree on concise versus detailed answers. What should be recorded?
        answer: a
        options:
          - id: a
            text: The rubric and reviewer population behind the labels
          - id: b
            text: Only the chosen winner with disagreement removed
          - id: c
            text: Only the total number of tokens generated
        feedback: Preference data reflects criteria and judgments, including disagreements.
        id: posttraining-stages.transfer.v2.3
        retired: true
      - prompt: Fine-tuning improves one task but harms another required task. What comparison is needed?
        answer: a
        options:
          - id: c
            text: The new checkpoint’s training score without comparison on required tasks
          - id: b
            text: Only the improved task’s best example
          - id: a
            text: Before/after evaluation across the intended task mix
        feedback: Adaptation can involve tradeoffs, so evaluate the promised range.
        id: posttraining-stages.transfer.v2.4
        retired: true
  - id: posttraining-stages.base.v3
    objective_ref: objective.posttraining-stages
    task: base
    response_type: single_choice
    points: 1
    hint: "Look at the training data first: a written answer means SFT, two answers with a winner means preference tuning, and a score from a program means RL with a reward."
    remediation_scene: posttraining-stages.s1
    variants:
      - id: posttraining-stages.base.v3.1
        prompt: "A team collects 2,000 records, each a customer question plus the reply a support agent wrote as the ideal answer. The model is trained to make those replies more likely. Which stage is this?"
        options:
          - id: b
            text: Preference tuning, because the agents chose the best reply
          - id: a
            text: Supervised fine-tuning on demonstrations
          - id: c
            text: Reinforcement learning, because each reply earns a reward
        answer: a
        feedback: Each record gives one written target answer, which is exactly a demonstration, so this is SFT. Preference tuning needs at least two candidate answers and a label saying which is better; there is no comparison here.
      - id: posttraining-stages.base.v3.2
        prompt: "Reviewers see two model answers to the same prompt and mark which one is better. Thousands of these labels are used to train the model. Which stage uses this data?"
        options:
          - id: c
            text: Supervised fine-tuning, since the better answer becomes the target
          - id: b
            text: RL with verifiable rewards, since a label acts as a check
          - id: a
            text: Preference tuning, such as RLHF or DPO
        answer: a
        feedback: A winner-and-loser pair is a preference comparison, the input to RLHF or DPO. SFT would need a single written target and would throw away the information in the losing answer; a verifiable reward comes from a program, not a human judgment.
      - id: posttraining-stages.base.v3.3
        prompt: "A coding model writes solutions to programming problems. Each solution is run against unit tests, earns 1 if all pass and 0 otherwise, and the model is updated to make passing solutions more likely. Which stage is this?"
        options:
          - id: a
            text: Reinforcement learning with verifiable rewards
          - id: b
            text: Supervised fine-tuning on the reference solutions
          - id: c
            text: Preference tuning with an automatic judge
        answer: a
        feedback: The model generates its own answers and a program scores them, which is RL with a verifiable reward. No written target answer is used, so it isn't SFT, and there's no pair of answers being compared.
      - id: posttraining-stages.base.v3.4
        prompt: "Before SFT, a base model answers 'Do you ship to Canada?' by writing the answer and then several more made-up customer questions and replies. What is the most likely reason?"
        options:
          - id: c
            text: It doesn't know enough about shipping to give one answer
          - id: a
            text: It learned to continue documents, not to answer once and stop
          - id: b
            text: Its sampling temperature is too low to end the reply
        answer: a
        feedback: Pretraining teaches next-token prediction on web text, where chat logs go on and on. SFT teaches the assistant role and when to stop. The knowledge is probably fine, and temperature changes which tokens are picked, not the habit of continuing.
  - id: posttraining-stages.transfer.v3
    objective_ref: objective.posttraining-stages
    task: transfer
    response_type: single_choice
    points: 1
    hint: Sort each change into saved weights or this conversation first. If it's in the weights, ask which kind of data trained it and what that data rewards.
    remediation_scene: posttraining-stages.s5
    variants:
      - id: posttraining-stages.transfer.v3.1
        prompt: "A travel app's assistant suddenly recommends only eco-friendly hotels. The team finds a new line in the system prompt: 'Prefer sustainable options.' No training job has run since last month. What changed the behavior?"
        options:
          - id: b
            text: A preference-tuning run that rewarded eco-friendly answers
          - id: c
            text: Supervised fine-tuning on examples of sustainable trips
          - id: a
            text: A runtime instruction added before every conversation
        answer: a
        feedback: A system-prompt line is runtime input, so the weights are unchanged and deleting the line undoes it. Preference tuning or SFT would need a training run, and none happened.
      - id: posttraining-stages.transfer.v3.2
        prompt: "After a preference-tuning round, a helpdesk assistant scores higher with reviewers, but its answers are 60% longer and it refuses some harmless questions. What is the best reading?"
        options:
          - id: a
            text: The stage improved what reviewers liked and also brought typical regressions
          - id: c
            text: The SFT data must have been wrong, since preference tuning adds no length
          - id: b
            text: The model has learned new facts, so it now writes more about each topic
        answer: a
        feedback: Wordiness and needless refusals are the classic side effects of preference tuning, which is why each stage needs checks on what got worse. Preference tuning can change length on its own, and extra length doesn't mean extra knowledge.
      - id: posttraining-stages.transfer.v3.3
        prompt: "A model card says: 'Base → SFT on 50k chats → DPO on 200k pairs.' A colleague says the model was 'trained with RLHF like ChatGPT.' What is the most accurate correction?"
        options:
          - id: c
            text: It had no preference tuning, since DPO is a kind of SFT
          - id: a
            text: It had preference tuning, but with DPO instead of a reward model plus RL
          - id: b
            text: It had RLHF, since DPO is a name for PPO with a reward model
        answer: a
        feedback: DPO is a preference-tuning method, so it learns from comparisons like RLHF does, but it updates the model directly from the pairs without training a reward model or running RL. It isn't SFT, because it uses both the preferred and the rejected answer.
      - id: posttraining-stages.transfer.v3.4
        prompt: "A startup has 30 staff hours to improve its assistant's tone. A staff member writes about 12 ideal replies an hour but judges about 90 answer pairs an hour. Which plan gives the most training signal about tone?"
        options:
          - id: b
            text: Write 360 ideal replies and run SFT, since targets beat comparisons
          - id: c
            text: Add a tone instruction to the system prompt and skip training
          - id: a
            text: Judge 2,700 pairs and run preference tuning on the SFT model
        answer: a
        feedback: Tone is easier to judge than to write, and 30 hours buys 2,700 comparisons against only 360 written replies. A system prompt helps too, but it doesn't train the model; SFT on a few hundred replies gives far less signal about which subtle choices are better.
