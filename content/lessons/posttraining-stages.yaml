schema_version: 0.2-draft
lesson:
  id: posttraining-stages
  version: 0.1.0-draft
  title: Track what each adaptation stage changes
  state: draft
  summary: Base, instruction-tuned, preference-trained, and reasoning-oriented checkpoints describe training histories;
    identify data, objectives, updated parameters, and evaluation for each transition.
  slot: M20.1
  category: learning
  minutes: 12
  sources:
  - title: InstructGPT
    url: https://arxiv.org/abs/2203.02155
  - title: Qwen3 Technical Report
    url: https://arxiv.org/abs/2505.09388
objectives:
- id: objective.posttraining-stages
  version: 1-draft
  statement: Base, instruction-tuned, preference-trained, and reasoning-oriented checkpoints describe training histories;
    identify data, objectives, updated parameters, and evaluation for each transition.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - posttraining-stages.base
  - posttraining-stages.transfer
  prerequisites:
  - anyOf:
    - objective.pretraining-objectives
  - anyOf:
    - objective.continued-pretraining
scenes:
- id: posttraining-stages.s1
  title: A checkpoint name is an incomplete recipe
  type: explanation
  depth: intuition
  objective_refs:
  - objective.posttraining-stages
  markdown: A base model learns its pretraining task. Later stages may teach instruction formats, prefer some responses,
    improve verified problem solving, or adapt a domain. These stages can be interleaved and repeated; there is
    no universal mandatory order shared by every modern model.
  text_mode: A base model learns its pretraining task. Later stages may teach instruction formats, prefer some responses,
    improve verified problem solving, or adapt a domain. These stages can be interleaved and repeated; there is
    no universal mandatory order shared by every modern model.
  bridges: []
- id: posttraining-stages.s2
  title: Record each transformation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.posttraining-stages
  markdown: For every arrow between checkpoints, list the starting artifact, data source, prediction or reward objective,
    updated parameters, and stopping criterion. Supervised examples provide desired outputs; preference pairs compare
    outputs; reward-based training generates behavior and scores it. Similar user-visible behavior can arise from
    different recipes.
  text_mode: For every arrow between checkpoints, list the starting artifact, data source, prediction or reward
    objective, updated parameters, and stopping criterion. Supervised examples provide desired outputs; preference
    pairs compare outputs; reward-based training generates behavior and scores it. Similar user-visible behavior
    can arise from different recipes.
  bridges: []
- id: posttraining-stages.s3
  title: Distinguish weights from runtime context
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.posttraining-stages
  markdown: A system prompt, retrieved document, decoding setting, or tool result changes inputs or execution without
    necessarily updating weights. Fine-tuning does update selected parameters. A deployment may combine both, so
    behavioral changes cannot automatically be attributed to a new model checkpoint.
  text_mode: A system prompt, retrieved document, decoding setting, or tool result changes inputs or execution without
    necessarily updating weights. Fine-tuning does update selected parameters. A deployment may combine both, so
    behavioral changes cannot automatically be attributed to a new model checkpoint.
  bridges: []
- id: posttraining-stages.s4
  title: Evaluate retained and added abilities
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.posttraining-stages
  markdown: A stage that improves instruction following can alter verbosity, refusal behavior, calibration, or unrelated
    skills. Compare before and after under the same template and sampling settings, while also testing intended
    production settings. Preserve the full lineage instead of treating the final model as an unexplained artifact.
  text_mode: A stage that improves instruction following can alter verbosity, refusal behavior, calibration, or
    unrelated skills. Compare before and after under the same template and sampling settings, while also testing
    intended production settings. Preserve the full lineage instead of treating the final model as an unexplained
    artifact.
  bridges: []
- id: posttraining-stages.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.posttraining-stages
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Base, instruction-tuned, preference-trained, and reasoning-oriented checkpoints describe training histories;
    identify data, objectives, updated parameters, and evaluation for each transition.
- id: posttraining-stages.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.posttraining-stages
  markdown: Base, instruction-tuned, preference-trained, and reasoning-oriented checkpoints describe training histories;
    identify data, objectives, updated parameters, and evaluation for each transition.
  text_mode: Base, instruction-tuned, preference-trained, and reasoning-oriented checkpoints describe training histories;
    identify data, objectives, updated parameters, and evaluation for each transition.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - posttraining-stages.s1
    - posttraining-stages.s2
    - posttraining-stages.s3
    - posttraining-stages.s4
    - posttraining-stages.check
    gate_refs:
    - gate.core
  scene_aliases:
    posttraining-stages.recap: posttraining-stages.check
assessment_families:
- id: posttraining-stages.base
  objective_ref: objective.posttraining-stages
  task: base
  response_type: single_choice
  points: 1
  hint: 'Record each transformation: trace the inputs, operation, and result before choosing.'
  remediation_scene: posttraining-stages.s2
  variants:
  - id: posttraining-stages.base.1
    prompt: Does every model follow one mandatory post-training sequence?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only dense models do
    answer: a
    feedback: Recipes vary and may repeat or omit stages.
  - id: posttraining-stages.base.2
    prompt: Which action necessarily describes a parameter adaptation?
    options:
    - id: b
      text: Adding a document to the prompt
    - id: c
      text: Changing output temperature only
    - id: a
      text: Fine-tuning selected weights
    answer: a
    feedback: Fine-tuning updates learned parameters.
- id: posttraining-stages.transfer
  objective_ref: objective.posttraining-stages
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate retained and added abilities: trace the inputs, operation, and result before choosing.'
  remediation_scene: posttraining-stages.s4
  variants:
  - id: posttraining-stages.transfer.1
    prompt: A system prompt changes behavior. Does this prove weights changed?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if the response is longer
    - id: a
      text: 'No'
    answer: a
    feedback: Runtime inputs can change output without training.
  - id: posttraining-stages.transfer.2
    prompt: What belongs on a training-stage transition record?
    options:
    - id: c
      text: Only the final response length
    - id: a
      text: Starting artifact, data, objective, updated state, and evaluation
    - id: b
      text: Only the product name
    answer: a
    feedback: Lineage makes the transformation inspectable.
