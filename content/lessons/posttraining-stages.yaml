schema_version: 0.2-draft
lesson:
  id: posttraining-stages
  version: 0.2.1-draft
  title: Track what each adaptation stage changes
  state: draft
  summary: Read a model’s training history as a sequence of choices, rather than guessing what words such as “chat”
    or “reasoning” guarantee.
  slot: M20.1
  category: learning
  sources:
  - title: Ouyang et al. — instruction following with human feedback
    url: https://arxiv.org/abs/2203.02155
  - title: Rafailov et al. — Direct Preference Optimization
    url: https://arxiv.org/abs/2305.18290
  archetype: mechanism
objectives:
- id: objective.posttraining-stages
  version: 2-draft
  statement: Classify supervised demonstrations, preference training, reward-based updates, and runtime-only changes
    by the data and parameters involved.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - posttraining-stages.base.v2
  - posttraining-stages.transfer.v2
  prerequisites:
  - anyOf:
    - objective.pretraining-objectives
  - anyOf:
    - objective.continued-pretraining
scenes:
- id: posttraining-stages.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.posttraining-stages
  title: A good continuation is not yet a helpful assistant
  markdown: A base language model has learned its pretraining task, such as predicting the next token. It may continue
    a question with another question or imitate an unhelpful style. **Post-training** means later training used
    to adapt behavior or capabilities. A **checkpoint** is a saved model state at a particular point. Labels such
    as base, instruct, or reasoning summarize a claimed history; they do not reveal the entire recipe or prove performance
    on your task.
  text_mode: A base language model has learned its pretraining task, such as predicting the next token. It may continue
    a question with another question or imitate an unhelpful style. **Post-training** means later training used
    to adapt behavior or capabilities. A **checkpoint** is a saved model state at a particular point. Labels such
    as base, instruct, or reasoning summarize a claimed history; they do not reveal the entire recipe or prove performance
    on your task.
  bridges: []
- id: posttraining-stages.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.posttraining-stages
  title: Teach with a demonstration
  markdown: In **supervised fine-tuning**, a training example includes a desired response. For a library helper,
    the prompt might ask for the closing time and the demonstration might answer concisely from a supplied schedule.
    The objective increases probability of the demonstrated response tokens under the selected loss mask. Some recipes
    update all model weights; others update a smaller set of added or selected parameters. The essential evidence
    is the example and update procedure, not the file’s name.
  text_mode: In **supervised fine-tuning**, a training example includes a desired response. For a library helper,
    the prompt might ask for the closing time and the demonstration might answer concisely from a supplied schedule.
    The objective increases probability of the demonstrated response tokens under the selected loss mask. Some recipes
    update all model weights; others update a smaller set of added or selected parameters. The essential evidence
    is the example and update procedure, not the file’s name.
  bridges: []
- id: posttraining-stages.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.posttraining-stages
  title: Teach with a comparison
  markdown: A **preference pair** compares two candidate responses to the same prompt. A reviewer might prefer an
    answer that cites the supplied schedule over one that invents a time. A preference-training objective uses such
    comparisons to influence model behavior. Direct Preference Optimization is one documented approach using preferred
    and less-preferred responses with a reference-policy formulation. Preferences depend on the judging instructions
    and population. Winning a comparison does not establish that every claim in the preferred response is correct.
  text_mode: A **preference pair** compares two candidate responses to the same prompt. A reviewer might prefer
    an answer that cites the supplied schedule over one that invents a time. A preference-training objective uses
    such comparisons to influence model behavior. Direct Preference Optimization is one documented approach using
    preferred and less-preferred responses with a reference-policy formulation. Preferences depend on the judging
    instructions and population. Winning a comparison does not establish that every claim in the preferred response
    is correct.
  bridges: []
- id: posttraining-stages.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.posttraining-stages
  title: Teach with scored generated behavior
  markdown: 'A **reward** is a numerical training signal evaluating generated behavior under a defined rule. In
    some reinforcement-learning approaches, the model generates responses, a reward process scores them, and an
    update changes the generating policy. A **policy** here is the rule assigning probabilities to possible outputs.
    Rewards might come from learned judgments or verifiable checks. A reward can be misspecified: a length bonus
    might encourage verbosity rather than useful explanation. Evaluate the intended outcome as well as the score.'
  text_mode: 'A **reward** is a numerical training signal evaluating generated behavior under a defined rule. In
    some reinforcement-learning approaches, the model generates responses, a reward process scores them, and an
    update changes the generating policy. A **policy** here is the rule assigning probabilities to possible outputs.
    Rewards might come from learned judgments or verifiable checks. A reward can be misspecified: a length bonus
    might encourage verbosity rather than useful explanation. Evaluate the intended outcome as well as the score.'
  bridges: []
- id: posttraining-stages.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.posttraining-stages
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: 'For each change ask: what data, what signal, which parameters, and what evidence? A checkpoint name
    is the start of that investigation.'
- id: posttraining-stages.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.posttraining-stages
  markdown: Base, instruction-tuned, preference-trained, and reasoning-oriented checkpoints describe training histories;
    identify data, objectives, updated parameters, and evaluation for each transition.
  text_mode: Base, instruction-tuned, preference-trained, and reasoning-oriented checkpoints describe training histories;
    identify data, objectives, updated parameters, and evaluation for each transition.
- id: posttraining-stages.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.posttraining-stages
  title: Separate training from runtime ingredients
  markdown: Adding a system instruction, retrieving a document, changing sampling temperature, or supplying a tool
    result can change a response without changing model weights. These are runtime inputs or execution choices.
    Fine-tuning changes trainable parameters. A product can combine both. Draw one box for saved model state and
    another for the current conversation and tools; place each change in the right box before diagnosing why the
    output differs.
  text_mode: Adding a system instruction, retrieving a document, changing sampling temperature, or supplying a tool
    result can change a response without changing model weights. These are runtime inputs or execution choices.
    Fine-tuning changes trainable parameters. A product can combine both. Draw one box for saved model state and
    another for the current conversation and tools; place each change in the right box before diagnosing why the
    output differs.
  bridges: []
- id: posttraining-stages.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.posttraining-stages
  title: Follow the arrows instead of assuming a ladder
  markdown: There is no required universal sequence of post-training stages. A project may interleave supervised
    data, preference updates, domain adaptation, and reward-based training. For every checkpoint transition, record
    its starting state, data source, objective, updated parameters, and evaluation. Compare the behavior gained
    and any behavior lost. The memory questions are “data, signal, settings, evidence.” They work even when a model
    release uses an unfamiliar name or discloses only part of its process.
  text_mode: There is no required universal sequence of post-training stages. A project may interleave supervised
    data, preference updates, domain adaptation, and reward-based training. For every checkpoint transition, record
    its starting state, data source, objective, updated parameters, and evaluation. Compare the behavior gained
    and any behavior lost. The memory questions are “data, signal, settings, evidence.” They work even when a model
    release uses an unfamiliar name or discloses only part of its process.
  bridges: []
  figure:
    kind: lifecycle
    caption: Find adaptation in the larger lifecycle, then compare it with changes made only at inference time.
    description: Post-training can change a saved model using demonstrations or feedback. A changed prompt or sampling
      rule can also change an answer while weights remain fixed. Select stages to distinguish these operations.
- id: posttraining-stages.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.posttraining-stages
  title: The answer changed; did the weights?
  markdown: A frozen model answers differently after a relevant document is added to its prompt. Which change is
    demonstrated?
  text_mode: A frozen model answers differently after a relevant document is added to its prompt. Which change is
    demonstrated?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: Its runtime context changed.
    - id: b
      text: Its weights were necessarily fine-tuned.
    - id: c
      text: Its original pretraining dataset was rewritten.
    answer: a
    reveal_markdown: The supplied document changes the input context. Different output does not by itself establish
      a parameter update.
    hint: Trace the example using the rule from the preceding pages.
    id: posttraining-stages.practice.v2.7
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - posttraining-stages.s1
    - posttraining-stages.s2
    - posttraining-stages.s3
    - posttraining-stages.s4
    - posttraining-stages.s5
    - posttraining-stages.s6
    - posttraining-stages.s7
    - posttraining-stages.check
    gate_refs:
    - gate.core
  scene_aliases:
    posttraining-stages.recap: posttraining-stages.check
assessment_families:
- id: posttraining-stages.base
  objective_ref: objective.posttraining-stages
  task: base
  response_type: single_choice
  points: 1
  hint: 'Record each transformation: trace the inputs, operation, and result before choosing.'
  remediation_scene: posttraining-stages.s2
  variants:
  - id: posttraining-stages.base.1
    prompt: Does every model follow one mandatory post-training sequence?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only dense models do
    answer: a
    feedback: Recipes vary and may repeat or omit stages.
    retired: true
  - id: posttraining-stages.base.2
    prompt: Which action necessarily describes a parameter adaptation?
    options:
    - id: b
      text: Adding a document to the prompt
    - id: c
      text: Changing output temperature only
    - id: a
      text: Fine-tuning selected weights
    answer: a
    feedback: Fine-tuning updates learned parameters.
    retired: true
- id: posttraining-stages.transfer
  objective_ref: objective.posttraining-stages
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate retained and added abilities: trace the inputs, operation, and result before choosing.'
  remediation_scene: posttraining-stages.s4
  variants:
  - id: posttraining-stages.transfer.1
    prompt: A system prompt changes behavior. Does this prove weights changed?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if the response is longer
    - id: a
      text: 'No'
    answer: a
    feedback: Runtime inputs can change output without training.
    retired: true
  - id: posttraining-stages.transfer.2
    prompt: What belongs on a training-stage transition record?
    options:
    - id: c
      text: Only the final response length
    - id: a
      text: Starting artifact, data, objective, updated state, and evaluation
    - id: b
      text: Only the product name
    answer: a
    feedback: Lineage makes the transformation inspectable.
    retired: true
- id: posttraining-stages.base.v2
  objective_ref: objective.posttraining-stages
  task: base
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: posttraining-stages.s3
  variants:
  - prompt: A prompt is paired with a desired response used as training targets. Which signal is this?
    answer: a
    options:
    - id: b
      text: A comparison between two complete responses
    - id: c
      text: A runtime-only document retrieval
    - id: a
      text: A supervised demonstration
    feedback: Supervised fine-tuning uses desired output examples under a defined objective.
    id: posttraining-stages.base.v2.1
  - prompt: A reviewer ranks response A above response B for the same prompt. What kind of data is supplied?
    answer: a
    options:
    - id: c
      text: A fixed attention mask
    - id: a
      text: A preference comparison
    - id: b
      text: A next-token vocabulary table
    feedback: The data says which candidate is preferred under the review criteria.
    id: posttraining-stages.base.v2.2
  - prompt: A model generates candidates, receives numerical scores, and updates its policy from them. Which process
      is described?
    answer: a
    options:
    - id: c
      text: Saving a tokenizer without training
    - id: b
      text: Adding an unchanged document to a prompt
    - id: a
      text: Reward-based training on generated behavior
    feedback: Generated behavior and scores drive parameter updates in the described loop.
    id: posttraining-stages.base.v2.3
  - prompt: A developer lowers temperature while keeping weights frozen. What changed?
    answer: a
    options:
    - id: a
      text: The output-selection procedure
    - id: c
      text: The original training examples
    - id: b
      text: The learned parameter values
    feedback: A decoding change affects runtime selection without necessarily training the model.
    id: posttraining-stages.base.v2.4
- id: posttraining-stages.transfer.v2
  objective_ref: objective.posttraining-stages
  task: transfer
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: posttraining-stages.s3
  variants:
  - prompt: A checkpoint is called “reasoning.” What evidence is needed to explain how it was trained?
    answer: a
    options:
    - id: c
      text: One particularly long generated answer
    - id: a
      text: Its documented data, objectives, parameter updates, and evaluations
    - id: b
      text: The name by itself
    feedback: A label does not uniquely specify a training procedure.
    id: posttraining-stages.transfer.v2.1
  - prompt: A reward gives points for longer answers and verbosity increases. What should be examined?
    answer: a
    options:
    - id: c
      text: Whether the reward was normalized, without examining what it rewards
    - id: b
      text: Whether a longer response is automatically more correct
    - id: a
      text: Whether the reward matches the intended usefulness criterion
    feedback: Optimizing a proxy can change behavior without improving the intended outcome.
    id: posttraining-stages.transfer.v2.2
  - prompt: Preference reviewers disagree on concise versus detailed answers. What should be recorded?
    answer: a
    options:
    - id: a
      text: The rubric and reviewer population behind the labels
    - id: b
      text: Only the chosen winner with disagreement removed
    - id: c
      text: Only the total number of tokens generated
    feedback: Preference data reflects criteria and judgments, including disagreements.
    id: posttraining-stages.transfer.v2.3
  - prompt: Fine-tuning improves one task but harms another required task. What comparison is needed?
    answer: a
    options:
    - id: c
      text: The new checkpoint’s training score without comparison on required tasks
    - id: b
      text: Only the improved task’s best example
    - id: a
      text: Before/after evaluation across the intended task mix
    feedback: Adaptation can involve tradeoffs, so evaluate the promised range.
    id: posttraining-stages.transfer.v2.4
