lesson:
  id: monte-carlo
  version: 0.4.0-draft
  title: Estimate a difficult average by sampling
  state: draft
  summary: Throw random darts at a square and you can find π. Learn why that works, why 100 times more darts only buys 10 times more accuracy, and how a random walk samples the unsampleable.
  slot: M06.6
  category: learning
  sources:
    - title: Deep Learning — probability and information theory
      url: https://www.deeplearningbook.org/contents/prob.html
    - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
      url: https://aima.cs.berkeley.edu/
    - title: Equation of State Calculations by Fast Computing Machines (Metropolis et al., 1953)
      url: https://doi.org/10.1063/1.1699114
objectives:
  - id: objective.monte-carlo
    version: 2-draft
    statement: Monte Carlo approximates expectations with samples; Markov-chain methods target difficult distributions, but dependence, mixing, and diagnostics limit the effective evidence.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - monte-carlo.base.v2
      - monte-carlo.transfer.v2
    prerequisites:
      - anyOf:
          - objective.random-variables
      - anyOf:
          - objective.probability
scenes:
  - id: monte-carlo.s1
    title: Throw darts to find π
    type: explanation
    depth: intuition
    objective_refs:
      - objective.monte-carlo
    markdown: |-
      Draw a square 1 unit on a side, and inside it a quarter circle of radius 1. The quarter circle covers π/4 of the square, about 78.5%. Now throw darts at the square completely at random. About 78.5% should land inside the curve, so 4 × (fraction inside) estimates π.

      Throw 4 darts and suppose 3 land inside: the estimate is 4 × 3/4 = 3.0. Not bad for four darts, and more darts will do better.

      This is a **Monte Carlo estimate**: replace a hard calculation with an average over random samples. The quantity it estimates is an **expectation**, the probability-weighted average of something. Here, each dart scores 4 if it lands inside and 0 if not, and the expected score is exactly π. The same trick estimates the average cost over every possible traffic pattern, or a model's average prediction over every plausible parameter setting, whenever listing all the cases is impossible but drawing examples is easy.

      :::story Solitaire at Los Alamos
      In 1946, mathematician Stanislaw Ulam was recovering from an illness and playing solitaire. He wondered what fraction of games could be won. The combinatorics were hopeless, but he realized he could simply deal many games and count. With John von Neumann he turned the idea into a method for the neutron calculations at Los Alamos. Their colleague Nicholas Metropolis later recalled suggesting the name, after the Monte Carlo casino where Ulam's uncle liked to gamble.
      :::
    bridges: []
  - id: monte-carlo.s2
    title: A hundred times the darts, ten times the accuracy
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.monte-carlo
    markdown: |-
      Run this to throw more and more darts:

      ```python run
      import numpy as np

      rng = np.random.default_rng(7)
      print("      n   estimate   error   predicted error")
      for n in [100, 1_000, 10_000, 100_000, 1_000_000]:
          x, y = rng.random(n), rng.random(n)
          inside = (x**2 + y**2 <= 1.0)            # dart lands inside the quarter circle
          estimate = 4 * inside.mean()
          predicted = 4 * np.sqrt(np.pi / 4 * (1 - np.pi / 4) / n)
          print(f"{n:>9,} {estimate:9.4f} {abs(estimate - np.pi):8.4f} {predicted:10.4f}")
      ```

      The error falls from 0.18 at 100 darts to 0.019 at 10,000 and 0.003 at a million. Each 100× more darts buys only about 10× less error. The "predicted error" column is the **standard error**: the typical distance between one run's estimate and the true value, if you repeated the whole run many times. Actual errors wobble around it, sometimes above and sometimes below.

      :::papers The Monte Carlo estimate and its error
      For independent samples $x_1, \dots, x_n$ drawn from $p$:

      $$\mathbb{E}_{p}[f(x)] \approx \hat{\mu}_n = \frac{1}{n}\sum_{i=1}^{n} f(x_i), \qquad \text{standard error} = \frac{\sigma}{\sqrt{n}}$$

      Here $f(x) = 4$ inside the curve and 0 outside, and $\sigma = 4\sqrt{0.785 \times 0.215} \approx 1.64$ is the spread of a single dart's score. At $n = 10{,}000$: $1.64 / 100 = 0.0164$, the program's predicted error. The error shrinks like $1/\sqrt{n}$ however many dimensions $x$ has, which is why Monte Carlo beats grids for high-dimensional problems.
      :::

      :::predict Your estimate has standard error 0.02 with 2,500 samples. How many samples do you need for 0.01?
      Halving the error needs 2² = 4 times the samples: 10,000. For 0.002 (ten times better) you'd need 100 times as many, 250,000.
      :::
    bridges:
      - random-variables
  - id: monte-carlo.s3
    title: When you can't sample directly, take a walk
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.monte-carlo
    markdown: |-
      Darts are easy to throw. But in Bayesian AI, the thing you want to sample is often a posterior over model parameters, and you can compute only *relative* weights: "this setting is twice as plausible as that one." The total you'd divide by to turn weights into probabilities is out of reach.

      **Markov chain Monte Carlo (MCMC)** gets around this with a random walk. The oldest recipe, the **Metropolis algorithm** (Metropolis and colleagues, 1953), works like this:

      1. From the current state $x$, propose a nearby state $x'$, with left and right equally likely.
      2. If $x'$ has more weight, move there. If it has less, move with probability weight($x'$) / weight($x$).
      3. Otherwise stay put, and record $x$ again.

      Take five states with weights 1, 2, 4, 2, 1. At the middle state (weight 4), a proposal to its neighbor (weight 2) is accepted with probability 2/4 = 0.5. A proposal from weight 2 up to weight 4 is always accepted. Only the ratio is used, so the unknown total cancels.

      ```python run
      import random

      random.seed(0)
      weights = [1, 2, 4, 2, 1]            # unnormalized target: only ratios matter
      x, visits = 0, [0] * len(weights)
      accepted = 0
      steps = 50_000

      for _ in range(steps):
          proposal = x + random.choice([-1, 1])            # step left or right
          if 0 <= proposal < len(weights):
              if random.random() < min(1, weights[proposal] / weights[x]):
                  x = proposal                              # accept the move
                  accepted += 1
          visits[x] += 1                                    # rejected: stay and count x again

      total = sum(weights)
      for state, (w, v) in enumerate(zip(weights, visits)):
          print(f"state {state}: target {w / total:.3f}   visited {v / steps:.3f}")
      print(f"acceptance rate: {accepted / steps:.2f}")
      ```

      The walker's time in each state matches the target: 0.099, 0.199, 0.405, 0.199, 0.098 against 0.1, 0.2, 0.4, 0.2, 0.1.

      :::papers Metropolis acceptance
      With a symmetric proposal, accept a move from $x$ to $x'$ with probability

      $$A(x \to x') = \min\!\left(1, \frac{p(x')}{p(x)}\right)$$

      From weight 4 to weight 2, $A = \min(1, 2/4) = 0.5$. Since $p$ appears only as a ratio, any unnormalized $\tilde{p} = c\,p$ works. Hastings (1970) extended the rule to lopsided proposals.
      :::

      :::mixup "The sampler climbs to the most probable state, like an optimizer."
      It deliberately accepts downhill moves some of the time. That's what makes it spend 10% of its time in a state with 10% of the probability, instead of parking on the peak. An optimizer finds the single best point; a sampler maps the whole distribution.
      :::
  - id: monte-carlo.s4
    title: 10,000 draws can be worth 200
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.monte-carlo
    markdown: |-
      The walker's draws aren't independent: each step starts where the last one ended. Worse, a walker can get stuck. In the program above, set `weights = [10, 1, 0.01, 1, 10]` and `steps = 2_000`. The target puts 45% on each end, but the valley in the middle is so deep that the walker, starting on the left, visits state 4 zero times. The output looks confident and is badly wrong.

      How freely a chain moves around the important regions is called **mixing**. Practitioners check it three ways:

      - **Run several chains** from different starting points. If they disagree, none has mixed. The **R-hat** statistic compares spread within and between chains; values near 1 are what you want.
      - **Measure autocorrelation**: how similar each draw is to the draw a few steps earlier.
      - **Report the effective sample size (ESS)**, the number of independent draws your chain is worth. A chain of 10,000 highly correlated draws might have an ESS of 200, and its standard error is then about σ/√200, not σ/√10,000.

      A common habit is to discard the first stretch of draws ("burn-in"), since the walker starts somewhere arbitrary. That helps, but only the checks above tell you whether the rest has mixed.

      :::deeper Another route: reweight the samples
      Another way around hard-to-sample distributions is **importance sampling**: draw from an easier distribution, then reweight each sample by how much more or less likely it is under the one you care about. If a few samples end up with almost all the weight, the estimate rests on those few and becomes unreliable, so check how evenly the weight is spread.
      :::
    bridges: []
  - id: monte-carlo.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.monte-carlo
    markdown: Work out how many samples an error target needs, then judge Metropolis moves, stuck chains, and lopsided importance weights.
    takeaway: |-
      Averaging random samples estimates what you can't calculate, with error shrinking like 1/√n. MCMC samples hard distributions by a walk that uses only weight ratios; count its effective samples, not its raw draws.
  - id: monte-carlo.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.monte-carlo
    markdown: |-
      Sampling can estimate an average that is hard to calculate directly. Check that the samples explore the right possibilities; a long list of similar draws may contain little new information.
