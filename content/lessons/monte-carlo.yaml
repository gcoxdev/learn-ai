assessment_families:
  - id: monte-carlo.base
    objective_ref: objective.monte-carlo
    task: base
    response_type: single_choice
    points: 1
    hint: 'Work through a sample average: trace the inputs, operation, and result before choosing.'
    remediation_scene: monte-carlo.s2
    variants:
      - id: monte-carlo.base.1
        prompt: What is the mean of samples [2, 4, 6, 8]?
        options:
          - id: a
            text: '5'
          - id: b
            text: '4'
          - id: c
            text: '20'
        answer: a
        feedback: The sum is 20 over four observations.
        retired: true
      - id: monte-carlo.base.2
        prompt: Under the usual independent finite-variance setting, quadrupling sample count changes standard-error scale how?
        options:
          - id: b
            text: Makes it exactly zero
          - id: c
            text: Roughly quarters it
          - id: a
            text: Roughly halves it
        answer: a
        feedback: The scale follows one divided by the square root of sample count.
        retired: true
  - id: monte-carlo.transfer
    objective_ref: objective.monte-carlo
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Check exploration rather than counting rows: trace the inputs, operation, and result before choosing.'
    remediation_scene: monte-carlo.s4
    variants:
      - id: monte-carlo.transfer.1
        prompt: A Markov chain repeats nearly the same state 10,000 times. What concern matters?
        options:
          - id: b
            text: A guarantee of 10,000 independent samples
          - id: c
            text: A proof the target has one state
          - id: a
            text: Low effective sample size and poor exploration
        answer: a
        feedback: Raw draw count can greatly overstate independent information.
        retired: true
      - id: monte-carlo.transfer.2
        prompt: Does discarding the first 100 draws guarantee convergence of every chain?
        options:
          - id: c
            text: Only if draws are saved in order
          - id: a
            text: No; convergence and mixing require diagnostics and assumptions
          - id: b
            text: Yes; 100 is universal
        answer: a
        feedback: A fixed burn-in count is not a general convergence proof.
        retired: true
  - id: monte-carlo.base.v2
    objective_ref: objective.monte-carlo
    task: base
    response_type: numeric
    points: 1
    hint: The standard error is σ/√n. To divide the error by k, multiply the number of samples by k².
    remediation_scene: monte-carlo.s2
    absolute_tolerance: 0.001
    variants:
      - id: monte-carlo.base.v2.1
        prompt: A Monte Carlo estimate from 100 independent samples has standard error 0.6. How many samples do you need for a standard error of 0.15?
        answer: 1600
        feedback: Dividing the error by 4 needs 4² = 16 times the samples, so 100 × 16 = 1,600. Multiplying the samples by only 4 would halve the error, to 0.3.
      - id: monte-carlo.base.v2.2
        prompt: A simulation of 2,500 independent games estimates a win rate with standard error 0.04. How many games do you need for a standard error of 0.01?
        answer: 40000
        feedback: A four-times-smaller error needs 16 times the games, so 2,500 × 16 = 40,000. Error shrinks with the square root of the sample count.
      - id: monte-carlo.base.v2.3
        prompt: With 900 independent samples, the standard error of your average is 0.3. What will the standard error be with 8,100 samples?
        answer: 0.1
        feedback: 8,100 is 9 times 900, and √9 = 3, so the error falls to 0.3 / 3 = 0.1. Dividing by 9 would forget the square root.
      - id: monte-carlo.base.v2.4
        prompt: Each sample of a quantity has spread (standard deviation) σ = 2. What is the standard error of the average of 400 independent samples?
        answer: 0.1
        feedback: The standard error is σ/√n = 2 / √400 = 2 / 20 = 0.1. Dividing by 400 instead of √400 gives 0.005, far too optimistic.
  - id: monte-carlo.transfer.v2
    objective_ref: objective.monte-carlo
    task: transfer
    response_type: single_choice
    points: 1
    hint: Metropolis uses only the ratio of weights, and its draws are correlated. Judge a sampler by how well it explores and how many independent draws it's worth, not by its raw count.
    remediation_scene: monte-carlo.s4
    variants:
      - id: monte-carlo.transfer.v2.1
        prompt: A Metropolis sampler with a symmetric proposal sits at a state with weight 6 and proposes a neighbor with weight 2. What happens next?
        options:
          - id: b
            text: It rejects the move, since the neighbor is less probable
          - id: a
            text: It moves with probability 1/3, or stays and repeats its state
          - id: c
            text: It moves with probability 1/4, the neighbor's share of the weight
        answer: a
        feedback: Acceptance is min(1, 2/6) = 1/3, and a rejected proposal records the current state again. Always rejecting downhill moves would turn the sampler into an optimizer, and 2/(6 + 2) is not the Metropolis rule.
      - id: monte-carlo.transfer.v2.2
        prompt: An MCMC run of 20,000 draws for a model with two well-separated peaks spent all its time near one peak. Which check would best reveal the problem?
        options:
          - id: c
            text: Discard the first 5,000 draws as burn-in, then summarize the rest
          - id: b
            text: Double the run to 40,000 draws from the same starting point
          - id: a
            text: Run several chains from different starting points and compare them
        answer: a
        feedback: Chains started near different peaks will disagree, which exposes poor mixing (and R-hat will be well above 1). Burn-in trims the start but can't send the walker to the other peak, and a longer run from the same start may stay stuck.
      - id: monte-carlo.transfer.v2.3
        prompt: A chain of 10,000 draws reports an effective sample size of 250. How precise is its estimate of the average?
        options:
          - id: a
            text: About as precise as 250 independent draws would be
          - id: b
            text: As precise as 10,000 independent draws, since all were kept
          - id: c
            text: As precise as 40 independent draws, one per 250 draws
        answer: a
        feedback: Effective sample size is the number of independent draws the correlated chain is worth, so its standard error is about σ/√250. Counting all 10,000 overstates the information; the 40 comes from dividing the wrong way.
      - id: monte-carlo.transfer.v2.4
        prompt: You estimate an average with importance sampling. Out of 5,000 samples, a single sample carries 90% of the total weight. How should you read the estimate?
        options:
          - id: c
            text: As sharp, since the heaviest sample is the one that matters most
          - id: a
            text: As shaky, since it rests almost entirely on one sample
          - id: b
            text: As fine, since the weights cancel out when you normalize
        answer: a
        feedback: With one sample holding nearly all the weight, the estimate is effectively built from one draw, and another run could give a very different answer. Normalizing rescales the weights but doesn't spread them out.
