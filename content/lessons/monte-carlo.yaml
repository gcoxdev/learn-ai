assessment_families:
- id: monte-carlo.base
  objective_ref: objective.monte-carlo
  task: base
  response_type: single_choice
  points: 1
  hint: 'Work through a sample average: trace the inputs, operation, and result before choosing.'
  remediation_scene: monte-carlo.s2
  variants:
  - id: monte-carlo.base.1
    prompt: What is the mean of samples [2, 4, 6, 8]?
    options:
    - id: a
      text: '5'
    - id: b
      text: '4'
    - id: c
      text: '20'
    answer: a
    feedback: The sum is 20 over four observations.
  - id: monte-carlo.base.2
    prompt: Under the usual independent finite-variance setting, quadrupling sample count changes standard-error
      scale how?
    options:
    - id: b
      text: Makes it exactly zero
    - id: c
      text: Roughly quarters it
    - id: a
      text: Roughly halves it
    answer: a
    feedback: The scale follows one divided by the square root of sample count.
- id: monte-carlo.transfer
  objective_ref: objective.monte-carlo
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Check exploration rather than counting rows: trace the inputs, operation, and result before choosing.'
  remediation_scene: monte-carlo.s4
  variants:
  - id: monte-carlo.transfer.1
    prompt: A Markov chain repeats nearly the same state 10,000 times. What concern matters?
    options:
    - id: b
      text: A guarantee of 10,000 independent samples
    - id: c
      text: A proof the target has one state
    - id: a
      text: Low effective sample size and poor exploration
    answer: a
    feedback: Raw draw count can greatly overstate independent information.
  - id: monte-carlo.transfer.2
    prompt: Does discarding the first 100 draws guarantee convergence of every chain?
    options:
    - id: c
      text: Only if draws are saved in order
    - id: a
      text: No; convergence and mixing require diagnostics and assumptions
    - id: b
      text: Yes; 100 is universal
    answer: a
    feedback: A fixed burn-in count is not a general convergence proof.
