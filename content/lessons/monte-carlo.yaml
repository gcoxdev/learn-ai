lesson:
  id: monte-carlo
  version: 0.2.0-draft
  title: Estimate a difficult average by sampling
  state: draft
  summary: Estimate a large average using a few sampled cases, then learn why repeated copies are not fresh
    evidence.
  slot: M06.6
  category: learning
  sources:
  - title: Deep Learning — probability and information theory
    url: https://www.deeplearningbook.org/contents/prob.html
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.monte-carlo
  version: 1-draft
  statement: Monte Carlo approximates expectations with samples; Markov-chain methods target difficult distributions,
    but dependence, mixing, and diagnostics limit the effective evidence.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - monte-carlo.base
  - monte-carlo.transfer
  prerequisites:
  - anyOf:
    - objective.random-variables
  - anyOf:
    - objective.probability
scenes:
- id: monte-carlo.s1
  title: Replace a huge sum with an estimate
  type: explanation
  depth: intuition
  objective_refs:
  - objective.monte-carlo
  markdown: 'Suppose you want average travel cost over many possible traffic conditions. Sampling conditions
    from the modeled distribution and averaging their costs gives a Monte Carlo estimate. Its usefulness depends
    on whether the sampling procedure represents the intended distribution and whether enough informative samples
    were obtained.


    An **expectation** is an average weighted by probabilities. When listing every possible traffic situation
    is too expensive, generate representative situations and average the trip costs. The randomness is a tool
    for estimating that average; it is not a claim that the first few generated trips cover everything.'
  text_mode: 'Suppose you want average travel cost over many possible traffic conditions. Sampling conditions
    from the modeled distribution and averaging their costs gives a Monte Carlo estimate. Its usefulness depends
    on whether the sampling procedure represents the intended distribution and whether enough informative samples
    were obtained.


    An **expectation** is an average weighted by probabilities. When listing every possible traffic situation
    is too expensive, generate representative situations and average the trip costs. The randomness is a tool
    for estimating that average; it is not a claim that the first few generated trips cover everything.'
  bridges: []
- id: monte-carlo.s2
  title: Work through a sample average
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.monte-carlo
  markdown: 'Simulated costs [4, 6, 5, 9] average to 6. Another four draws may produce a different estimate.
    For independent draws with finite variance, standard error commonly decreases in proportion to the inverse
    square root of sample count. Four times as many samples roughly halves that error scale, not quarters it.


    The **standard error** describes how much the estimated average would vary over repeated sampling runs.
    It differs from the spread of individual trip costs. The square-root rule means going from 100 to 400 independent
    samples gives about half the uncertainty in the average, provided the same finite-variance assumptions
    apply.'
  text_mode: 'Simulated costs [4, 6, 5, 9] average to 6. Another four draws may produce a different estimate.
    For independent draws with finite variance, standard error commonly decreases in proportion to the inverse
    square root of sample count. Four times as many samples roughly halves that error scale, not quarters it.


    The **standard error** describes how much the estimated average would vary over repeated sampling runs.
    It differs from the spread of individual trip costs. The square-root rule means going from 100 to 400 independent
    samples gives about half the uncertainty in the average, provided the same finite-variance assumptions
    apply.'
  bridges:
  - random-variables
- id: monte-carlo.s3
  title: Build a chain when direct draws are difficult
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.monte-carlo
  markdown: 'MCMC constructs a sequence of states whose long-run distribution is a desired target under appropriate
    conditions. Metropolis-type methods propose a move and accept or reject it with a probability that accounts
    for target and proposal densities. Consecutive samples are usually dependent.


    MCMC stands for **Markov chain Monte Carlo**. Picture a walker proposing a step among possible explanations.
    Some proposals are rejected, so the walker stays put. The acceptance rule is designed to spend the right
    long-run fractions of time in the target distribution, not simply to walk uphill forever. **Mixing** describes
    how well it travels between important regions rather than lingering in one.'
  text_mode: 'MCMC constructs a sequence of states whose long-run distribution is a desired target under appropriate
    conditions. Metropolis-type methods propose a move and accept or reject it with a probability that accounts
    for target and proposal densities. Consecutive samples are usually dependent.


    MCMC stands for **Markov chain Monte Carlo**. Picture a walker proposing a step among possible explanations.
    Some proposals are rejected, so the walker stays put. The acceptance rule is designed to spend the right
    long-run fractions of time in the target distribution, not simply to walk uphill forever. **Mixing** describes
    how well it travels between important regions rather than lingering in one.'
  bridges: []
- id: monte-carlo.s4
  title: Check exploration rather than counting rows
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.monte-carlo
  markdown: A chain stuck in one region can produce thousands of nearly redundant draws. Inspect multiple chains,
    convergence diagnostics, autocorrelation, and effective sample size. Discarding an initial segment alone
    does not prove mixing. Importance sampling is another approach, but highly concentrated weights can also
    make estimates unreliable.
  text_mode: A chain stuck in one region can produce thousands of nearly redundant draws. Inspect multiple
    chains, convergence diagnostics, autocorrelation, and effective sample size. Discarding an initial segment
    alone does not prove mixing. Importance sampling is another approach, but highly concentrated weights can
    also make estimates unreliable.
  bridges: []
