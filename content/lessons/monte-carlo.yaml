scenes:
- id: monte-carlo.s1
  title: Replace a huge sum with an estimate
  type: explanation
  depth: intuition
  objective_refs:
  - objective.monte-carlo
  markdown: Suppose you want average travel cost over many possible traffic conditions. Sampling conditions from
    the modeled distribution and averaging their costs gives a Monte Carlo estimate. Its usefulness depends on whether
    the sampling procedure represents the intended distribution and whether enough informative samples were obtained.
  text_mode: Suppose you want average travel cost over many possible traffic conditions. Sampling conditions from
    the modeled distribution and averaging their costs gives a Monte Carlo estimate. Its usefulness depends on whether
    the sampling procedure represents the intended distribution and whether enough informative samples were obtained.
  bridges: []
- id: monte-carlo.s2
  title: Work through a sample average
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.monte-carlo
  markdown: Simulated costs [4, 6, 5, 9] average to 6. Another four draws may produce a different estimate. For
    independent draws with finite variance, standard error commonly decreases in proportion to the inverse square
    root of sample count. Four times as many samples roughly halves that error scale, not quarters it.
  text_mode: Simulated costs [4, 6, 5, 9] average to 6. Another four draws may produce a different estimate. For
    independent draws with finite variance, standard error commonly decreases in proportion to the inverse square
    root of sample count. Four times as many samples roughly halves that error scale, not quarters it.
  bridges:
  - random-variables
- id: monte-carlo.s3
  title: Build a chain when direct draws are difficult
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.monte-carlo
  markdown: MCMC constructs a sequence of states whose long-run distribution is a desired target under appropriate
    conditions. Metropolis-type methods propose a move and accept or reject it with a probability that accounts
    for target and proposal densities. Consecutive samples are usually dependent.
  text_mode: MCMC constructs a sequence of states whose long-run distribution is a desired target under appropriate
    conditions. Metropolis-type methods propose a move and accept or reject it with a probability that accounts
    for target and proposal densities. Consecutive samples are usually dependent.
  bridges: []
- id: monte-carlo.s4
  title: Check exploration rather than counting rows
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.monte-carlo
  markdown: A chain stuck in one region can produce thousands of nearly redundant draws. Inspect multiple chains,
    convergence diagnostics, autocorrelation, and effective sample size. Discarding an initial segment alone does
    not prove mixing. Importance sampling is another approach, but highly concentrated weights can also make estimates
    unreliable.
  text_mode: A chain stuck in one region can produce thousands of nearly redundant draws. Inspect multiple chains,
    convergence diagnostics, autocorrelation, and effective sample size. Discarding an initial segment alone does
    not prove mixing. Importance sampling is another approach, but highly concentrated weights can also make estimates
    unreliable.
  bridges: []
- id: monte-carlo.check
