schema_version: 0.2-draft
lesson:
  id: monte-carlo
  version: 0.3.0-draft
  title: Estimate a difficult average by sampling
  state: draft
  summary: Estimate a large average using a few sampled cases, then learn why repeated copies are not fresh
    evidence.
  slot: M06.6
  category: learning
  sources:
  - title: Deep Learning — probability and information theory
    url: https://www.deeplearningbook.org/contents/prob.html
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.monte-carlo
  version: 1-draft
  statement: Monte Carlo approximates expectations with samples; Markov-chain methods target difficult distributions,
    but dependence, mixing, and diagnostics limit the effective evidence.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - monte-carlo.base
  - monte-carlo.transfer
  prerequisites:
  - anyOf:
    - objective.random-variables
  - anyOf:
    - objective.probability
scenes:
- id: monte-carlo.s1
  title: Estimate an average from sampled cases
  type: explanation
  depth: intuition
  objective_refs:
  - objective.monte-carlo
  markdown: 'Suppose we want the average travel cost across many possible traffic conditions. This probability-weighted
    average is an **expectation**. Listing every possible condition may be too expensive.


    Instead, sample conditions from the model and average their trip costs. This is a **Monte Carlo estimate**.
    It is useful when the samples represent the intended distribution and include enough information to estimate
    the average. A few random trips may still miss important conditions.'
  text_mode: 'Suppose we want the average travel cost across many possible traffic conditions. This probability-weighted
    average is an **expectation**. Listing every possible condition may be too expensive.


    Instead, sample conditions from the model and average their trip costs. This is a **Monte Carlo estimate**.
    It is useful when the samples represent the intended distribution and include enough information to estimate
    the average. A few random trips may still miss important conditions.'
  bridges: []
- id: monte-carlo.s2
  title: Work through a sample average
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.monte-carlo
  markdown: 'Simulated costs [4, 6, 5, 9] average to 6. Another four draws may produce a different estimate.
    For independent draws with finite variance, standard error commonly decreases in proportion to the inverse
    square root of sample count. Four times as many samples roughly halves that error scale, not quarters it.


    The **standard error** describes how much the estimated average would vary over repeated sampling runs.
    It differs from the spread of individual trip costs. The square-root rule means going from 100 to 400 independent
    samples gives about half the uncertainty in the average, provided the same finite-variance assumptions
    apply.'
  text_mode: 'Simulated costs [4, 6, 5, 9] average to 6. Another four draws may produce a different estimate.
    For independent draws with finite variance, standard error commonly decreases in proportion to the inverse
    square root of sample count. Four times as many samples roughly halves that error scale, not quarters it.


    The **standard error** describes how much the estimated average would vary over repeated sampling runs.
    It differs from the spread of individual trip costs. The square-root rule means going from 100 to 400 independent
    samples gives about half the uncertainty in the average, provided the same finite-variance assumptions
    apply.'
  bridges:
  - random-variables
- id: monte-carlo.s3
  title: Explore possibilities with a chain of samples
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.monte-carlo
  markdown: '**Markov chain Monte Carlo (MCMC)** is useful when direct sampling is difficult. Picture a walker
    proposing moves among possible states or explanations. A rule accepts or rejects each proposal; a rejection
    leaves the walker where it is.


    Metropolis-type acceptance rules account for both the target distribution and how proposals are made. Under
    appropriate conditions, the chain spends the right long-run proportions of time in different regions. It
    is not simply climbing toward the highest point.


    Consecutive samples are usually dependent. **Mixing** describes how well the chain moves among important
    regions instead of remaining in one, which is why we need the checks on the next page.'
  text_mode: '**Markov chain Monte Carlo (MCMC)** is useful when direct sampling is difficult. Picture a walker
    proposing moves among possible states or explanations. A rule accepts or rejects each proposal; a rejection
    leaves the walker where it is.


    Metropolis-type acceptance rules account for both the target distribution and how proposals are made. Under
    appropriate conditions, the chain spends the right long-run proportions of time in different regions. It
    is not simply climbing toward the highest point.


    Consecutive samples are usually dependent. **Mixing** describes how well the chain moves among important
    regions instead of remaining in one, which is why we need the checks on the next page.'
  bridges: []
- id: monte-carlo.s4
  title: Check exploration rather than counting rows
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.monte-carlo
  markdown: A chain stuck in one region can produce thousands of nearly redundant draws. Inspect multiple chains,
    convergence diagnostics, autocorrelation, and effective sample size. Discarding an initial segment alone
    does not prove mixing. Importance sampling is another approach, but highly concentrated weights can also
    make estimates unreliable.
  text_mode: A chain stuck in one region can produce thousands of nearly redundant draws. Inspect multiple
    chains, convergence diagnostics, autocorrelation, and effective sample size. Discarding an initial segment
    alone does not prove mixing. Importance sampling is another approach, but highly concentrated weights can
    also make estimates unreliable.
  bridges: []
- id: monte-carlo.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.monte-carlo
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Sampling can estimate an average that is hard to calculate directly. Check that the samples explore
    the right possibilities; a long list of similar draws may contain little new information.
