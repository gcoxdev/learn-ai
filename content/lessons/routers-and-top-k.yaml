schema_version: 0.2-draft
lesson:
  id: routers-and-top-k
  version: 0.1.0-draft
  title: Score experts and choose a small set
  state: draft
  summary: A router maps token representations to expert scores, selects a top-k set, and supplies combination weights
    under an explicit normalization rule.
  slot: M18.2
  category: learning
  minutes: 12
  sources:
  - title: Sparsely-Gated Mixture-of-Experts
    url: https://arxiv.org/abs/1701.06538
  - title: Switch Transformers
    url: https://arxiv.org/abs/2101.03961
objectives:
- id: objective.routers-and-top-k
  version: 1-draft
  statement: A router maps token representations to expert scores, selects a top-k set, and supplies combination
    weights under an explicit normalization rule.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - routers-and-top-k.base
  - routers-and-top-k.transfer
  prerequisites:
  - anyOf:
    - objective.conditional-computation
  - anyOf:
    - objective.softmax-attention
scenes:
- id: routers-and-top-k.s1
  title: Compute router scores
  type: explanation
  depth: intuition
  objective_refs:
  - objective.routers-and-top-k
  markdown: A simple router multiplies a token’s hidden vector by learned weights to obtain one score per expert.
    A transformation such as softmax or sigmoid converts scores to affinities. The recipe specifies whether selection
    happens before or after normalization and how selected outputs are weighted.
  text_mode: A simple router multiplies a token’s hidden vector by learned weights to obtain one score per expert.
    A transformation such as softmax or sigmoid converts scores to affinities. The recipe specifies whether selection
    happens before or after normalization and how selected outputs are weighted.
  bridges: []
- id: routers-and-top-k.s2
  title: Select and normalize explicitly
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.routers-and-top-k
  markdown: For four affinities 0.5, 0.3, 0.15, and 0.05, top-two chooses the first two. If this recipe renormalizes
    selected affinities, their weights become 0.625 and 0.375. Another recipe can retain unnormalized selected weights;
    the normalization convention changes the combined result.
  text_mode: For four affinities 0.5, 0.3, 0.15, and 0.05, top-two chooses the first two. If this recipe renormalizes
    selected affinities, their weights become 0.625 and 0.375. Another recipe can retain unnormalized selected weights;
    the normalization convention changes the combined result.
  bridges: []
- id: routers-and-top-k.s3
  title: The router sees a representation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.routers-and-top-k
  markdown: Earlier layers have already mixed contextual information into a token vector. The router therefore acts
    on learned features, not simply a literal word lookup. The same written token can take different routes depending
    on context, position, layer, and model state.
  text_mode: Earlier layers have already mixed contextual information into a token vector. The router therefore
    acts on learned features, not simply a literal word lookup. The same written token can take different routes
    depending on context, position, layer, and model state.
  bridges: []
- id: routers-and-top-k.s4
  title: Keep decisions reproducible
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.routers-and-top-k
  markdown: Tie breaking, noise during training, precision, capacity policies, and load-balancing adjustments can
    affect assignments. Record the router rule when comparing models. Top-k selection is a discrete boundary, which
    matters later when reasoning about gradient flow and routing stability.
  text_mode: Tie breaking, noise during training, precision, capacity policies, and load-balancing adjustments can
    affect assignments. Record the router rule when comparing models. Top-k selection is a discrete boundary, which
    matters later when reasoning about gradient flow and routing stability.
  bridges: []
- id: routers-and-top-k.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.routers-and-top-k
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: routers-and-top-k.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.routers-and-top-k
  markdown: A router maps token representations to expert scores, selects a top-k set, and supplies combination
    weights under an explicit normalization rule.
  text_mode: A router maps token representations to expert scores, selects a top-k set, and supplies combination
    weights under an explicit normalization rule.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - routers-and-top-k.s1
    - routers-and-top-k.s2
    - routers-and-top-k.s3
