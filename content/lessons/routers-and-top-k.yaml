schema_version: 0.2-draft
lesson:
  id: routers-and-top-k
  version: 0.2.0-draft
  title: Score experts and choose a small set
  state: draft
  summary: Choose two expert networks, renormalize their scores, and mix their outputs by hand and in a playground.
  slot: M18.2
  category: learning
  sources:
  - title: Shazeer et al. — Sparsely-Gated Mixture-of-Experts
    url: https://arxiv.org/abs/1701.06538
  archetype: mechanism
objectives:
- id: objective.routers-and-top-k
  version: 2-draft
  statement: Trace top-k expert selection and weighted output combination under an explicitly stated normalization
    rule.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - routers-and-top-k.base.v2
  - routers-and-top-k.transfer.v2
  prerequisites:
  - anyOf:
    - objective.conditional-computation
  - anyOf:
    - objective.softmax-attention
scenes:
- id: routers-and-top-k.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.routers-and-top-k
  title: A switchboard inside a layer
  markdown: An **expert** here is a learned neural subnetwork, not a person or a guaranteed subject specialist.
    A **router** scores these subnetworks using the current token’s hidden representation. That representation is
    a list of numbers describing the token in context. A mixture-of-experts layer can run a selected subset of experts
    for each token. The router itself requires computation, and the full collection of expert weights still has
    to be stored somewhere.
  text_mode: An **expert** here is a learned neural subnetwork, not a person or a guaranteed subject specialist.
    A **router** scores these subnetworks using the current token’s hidden representation. That representation is
    a list of numbers describing the token in context. A mixture-of-experts layer can run a selected subset of experts
    for each token. The router itself requires computation, and the full collection of expert weights still has
    to be stored somewhere.
  bridges: []
- id: routers-and-top-k.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.routers-and-top-k
  title: Choose the two largest scores
  markdown: 'Our toy router produces four positive probabilities: E1=0.55, E2=0.25, E3=0.15, E4=0.05. **Top-k**
    means selecting the k largest entries; with k=2, we select E1 and E2. This is deterministic selection for this
    example. It is not randomly drawing two experts from the distribution. In practice, a recipe specifies its scoring
    transform, selection rule, tie handling, and any capacity restrictions. Here we use distinct scores and unlimited
    toy capacity.'
  text_mode: 'Our toy router produces four positive probabilities: E1=0.55, E2=0.25, E3=0.15, E4=0.05. **Top-k**
    means selecting the k largest entries; with k=2, we select E1 and E2. This is deterministic selection for this
    example. It is not randomly drawing two experts from the distribution. In practice, a recipe specifies its scoring
    transform, selection rule, tie handling, and any capacity restrictions. Here we use distinct scores and unlimited
    toy capacity.'
  bridges: []
- id: routers-and-top-k.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.routers-and-top-k
  title: Rescale the selected pair
  markdown: Our example renormalizes selected probabilities so they sum to one. Their total is 0.55 + 0.25 = 0.80.
    E1 receives weight 0.55/0.80 = 0.6875, and E2 receives 0.25/0.80 = 0.3125. Renormalization preserves their ratio
    while discarding the other entries. Some model recipes use a different convention, including retaining selected
    weights without this rescaling. State the convention before calculating the mixed output.
  text_mode: Our example renormalizes selected probabilities so they sum to one. Their total is 0.55 + 0.25 = 0.80.
    E1 receives weight 0.55/0.80 = 0.6875, and E2 receives 0.25/0.80 = 0.3125. Renormalization preserves their ratio
    while discarding the other entries. Some model recipes use a different convention, including retaining selected
    weights without this rescaling. State the convention before calculating the mixed output.
  bridges: []
- id: routers-and-top-k.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.routers-and-top-k
  title: Combine each coordinate
  markdown: 'Let E1 output [2, 0] and E2 output [0, 4]. Multiply each vector by its routing weight, then add matching
    coordinates: first coordinate = 0.6875 × 2 + 0.3125 × 0 = 1.375; second = 0.6875 × 0 + 0.3125 × 4 = 1.25. The
    mixture is [1.375, 1.25]. We do not concatenate these two outputs or select a word from them. This is a hidden
    representation inside a network.'
  text_mode: 'Let E1 output [2, 0] and E2 output [0, 4]. Multiply each vector by its routing weight, then add matching
    coordinates: first coordinate = 0.6875 × 2 + 0.3125 × 0 = 1.375; second = 0.6875 × 0 + 0.3125 × 4 = 1.25. The
    mixture is [1.375, 1.25]. We do not concatenate these two outputs or select a word from them. This is a hidden
    representation inside a network.'
  bridges: []
- id: routers-and-top-k.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.routers-and-top-k
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Score, select, rescale, combine. The routing recipe determines which experts run and how their outputs
    contribute.
- id: routers-and-top-k.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.routers-and-top-k
  markdown: A router maps token representations to expert scores, selects a top-k set, and supplies combination
    weights under an explicit normalization rule.
  text_mode: A router maps token representations to expert scores, selects a top-k set, and supplies combination
    weights under an explicit normalization rule.
- id: routers-and-top-k.s5
  type: simulation
  depth: mechanics
  objective_refs:
  - objective.routers-and-top-k
  title: Predict, then change the expert count
  markdown: 'Before changing k, predict what happens at k=1: only E1 remains, its renormalized weight is one, and
    the output is [2, 0]. Try the playground, then compare k=2 and k=4. It uses the same four probabilities and
    explicit renormalization rule as our worked example. E3 outputs [-1, 1] and E4 outputs [3, -2]. Notice that
    adding experts changes the mixture; more active experts does not by itself establish better task performance.'
  text_mode: 'Before changing k, predict what happens at k=1: only E1 remains, its renormalized weight is one, and
    the output is [2, 0]. Try the playground, then compare k=2 and k=4. It uses the same four probabilities and
    explicit renormalization rule as our worked example. E3 outputs [-1, 1] and E4 outputs [3, -2]. Notice that
    adding experts changes the mixture; more active experts does not by itself establish better task performance.'
  bridges: []
  simulation: moe
- id: routers-and-top-k.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.routers-and-top-k
  title: Keep the toy’s boundaries visible
  markdown: Real systems must manage how many tokens reach each expert, communication between devices, and training
    incentives that discourage overloaded routes. Those are additional mechanisms beyond this arithmetic. Expert
    names do not establish topic specialization, and the router’s probability is not a calibrated statement that
    an expert’s answer is correct. The memory cue “score, select, rescale, combine” describes this toy route while
    keeping its assumptions visible.
  text_mode: Real systems must manage how many tokens reach each expert, communication between devices, and training
    incentives that discourage overloaded routes. Those are additional mechanisms beyond this arithmetic. Expert
    names do not establish topic specialization, and the router’s probability is not a calibrated statement that
    an expert’s answer is correct. The memory cue “score, select, rescale, combine” describes this toy route while
    keeping its assumptions visible.
  bridges: []
- id: routers-and-top-k.s7
  type: question
  depth: mechanics
  objective_refs:
  - objective.routers-and-top-k
  title: Choose the rescaling denominator
  markdown: The selected expert probabilities are 0.6 and 0.2. Under our renormalization rule, what divides each
    selected probability?
  text_mode: The selected expert probabilities are 0.6 and 0.2. Under our renormalization rule, what divides each
    selected probability?
  bridges: []
  question:
    response_type: single_choice
    options:
    - id: a
      text: '0.8'
    - id: b
      text: '1.0'
    - id: c
      text: '2.0'
    answer: a
    reveal_markdown: The selected mass is 0.6 + 0.2 = 0.8. The weights become 0.75 and 0.25, summing to one.
    hint: Trace the example using the rule from the preceding pages.
    id: routers-and-top-k.practice.v2.7
