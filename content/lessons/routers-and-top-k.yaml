  - id: routers-and-top-k.combine
    objective_ref: objective.routers-and-top-k
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Multiply each expert's output vector by its gate weight, then add the first coordinates together and the second coordinates together.
    remediation_scene: routers-and-top-k.s4
    variants:
      - id: routers-and-top-k.combine.1
        prompt: Gate weights are 0.7 and 0.3. The first expert outputs [1, 3]; the second outputs [5, −1]. Find both coordinates of the layer's output.
        answers:
          first: 2.2
          second: 1.8
        reason_answer: b
        reason_options:
          - id: a
            text: Keep only the output of the expert with the larger gate
          - id: b
            text: Add the weighted outputs coordinate by coordinate
          - id: c
            text: Average the two outputs, since both experts were chosen
        feedback: 0.7 × 1 + 0.3 × 5 = 2.2 and 0.7 × 3 + 0.3 × (−1) = 1.8. A plain average would give [3, 1] and ignore that the router preferred the first expert.
      - id: routers-and-top-k.combine.2
        prompt: Gate weights are 0.6 and 0.4. The first expert outputs [4, 0]; the second outputs [−1, 2]. Find both coordinates of the layer's output.
        answers:
          first: 2.0
          second: 0.8
        reason_answer: c
        reason_options:
          - id: c
            text: Add the weighted outputs coordinate by coordinate
          - id: a
            text: Average the two outputs, since both experts were chosen
          - id: b
            text: Keep only the output of the expert with the larger gate
        feedback: 0.6 × 4 + 0.4 × (−1) = 2.0 and 0.6 × 0 + 0.4 × 2 = 0.8. Keeping only the first expert would give [4, 0] and waste the second expert's work.
      - id: routers-and-top-k.combine.3
        prompt: Gate weights are 0.8 and 0.2. The first expert outputs [0, 5]; the second outputs [3, 1]. Find both coordinates of the layer's output.
        answers:
          first: 0.6
          second: 4.2
        reason_answer: a
        reason_options:
          - id: b
            text: Keep only the output of the expert with the larger gate
          - id: a
            text: Add the weighted outputs coordinate by coordinate
          - id: c
            text: Average the two outputs, since both experts were chosen
        feedback: 0.8 × 0 + 0.2 × 3 = 0.6 and 0.8 × 5 + 0.2 × 1 = 4.2. Even a small gate adds its expert's contribution to every coordinate.
      - id: routers-and-top-k.combine.4
        prompt: Gate weights are 0.25 and 0.75. The first expert outputs [2, 2]; the second outputs [6, −2]. Find both coordinates of the layer's output.
        answers:
          first: 5.0
          second: -1.0
        reason_answer: b
        reason_options:
          - id: a
            text: Average the two outputs, since both experts were chosen
          - id: c
            text: Keep only the output of the expert with the larger gate
          - id: b
            text: Add the weighted outputs coordinate by coordinate
        feedback: 0.25 × 2 + 0.75 × 6 = 5.0 and 0.25 × 2 + 0.75 × (−2) = −1.0. A plain average would give [4, 0], treating the two experts as equally trusted.
    numeric_fields:
      - id: first
        label: First coordinate
      - id: second
        label: Second coordinate
    absolute_tolerance: 1e-6
  - id: routers-and-top-k.transfer.v3
    objective_ref: objective.routers-and-top-k
    task: transfer
    response_type: single_choice
    points: 1
    hint: Walk through score, select, rescale, combine, and ask which step the situation changes. Remember that a gate weight is a mixing weight inside one layer.
    remediation_scene: routers-and-top-k.s6
    variants:
      - id: routers-and-top-k.transfer.v3.1
        prompt: A model card says "top-2 routing, kept weights renormalized." An engineer reimplements the layer but forgets to renormalize. The router keeps probabilities 0.5 and 0.3. What changes?
        options:
          - id: b
            text: The router now picks different experts, since the scores changed
          - id: c
            text: Nothing, since the two weights keep the same 5 to 3 ratio
          - id: a
            text: The mixed output shrinks to 0.8 times what it should be
        answer: a
        feedback: The same two experts are chosen, and the ratio is unchanged, but the gates sum to 0.8 instead of 1, so the layer's output is scaled down by 0.8. Selection happens before rescaling, so it isn't affected.
      - id: routers-and-top-k.transfer.v3.2
        prompt: 'The word "bank" appears in "river bank" and in "bank loan." In layer 10 of an MoE model, the two occurrences go to different experts. How is that possible?'
        options:
          - id: c
            text: The router samples experts at random, so repeats can differ
          - id: a
            text: The router scores the token's vector, which carries its context
          - id: b
            text: The router has a fixed expert per word but retries when it is busy
        answer: a
        feedback: By layer 10, attention has mixed context into each token's vector, so the two "bank" vectors differ and get different logits. Top-k selection itself is deterministic, and routers don't keep a word-to-expert table.
      - id: routers-and-top-k.transfer.v3.3
        prompt: 'A dashboard shows a gate weight of 0.92 for expert 3 on one token. A product manager writes, "The model is 92% sure expert 3 is right." What is the best correction?'
        options:
          - id: b
            text: It means expert 3 handled 92% of the tokens in that batch
          - id: a
            text: It means expert 3's output makes up 92% of this layer's mix
          - id: c
            text: The statement is fine, since gate weights are calibrated confidence
        answer: a
        feedback: A gate is a mixing weight inside one layer; there's no "right" expert to be sure about. Share of tokens per expert is a different number, the expert's load, which the balance lessons use.
      - id: routers-and-top-k.transfer.v3.4
        prompt: A team switches its MoE from top-2 to top-1 but keeps renormalizing the kept weight. Afterwards the router's weights barely change during training. What explains it?
        options:
          - id: c
            text: Top-1 does half the compute, so each training step is slower
          - id: b
            text: Top-1 routing stores fewer experts, so there is less to learn
          - id: a
            text: A single renormalized weight is always 1, so it carries no signal
        answer: a
        feedback: With one kept expert, p / p = 1 whatever the logits are, so the loss can't push the router's scores through the gate. Switch Transformer avoids this by using the unnormalized probability p as the gate. Top-1 stores just as many experts, and it makes steps cheaper, not slower.
