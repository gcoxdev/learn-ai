assessment_families:
- id: routers-and-top-k.base
  objective_ref: objective.routers-and-top-k
  task: base
  response_type: single_choice
  points: 1
  hint: 'Select and normalize explicitly: trace the inputs, operation, and result before choosing.'
  remediation_scene: routers-and-top-k.s2
  variants:
  - id: routers-and-top-k.base.1
    prompt: Top-two selects from affinities 0.5, 0.3, 0.15, 0.05. Which pair?
    options:
    - id: a
      text: The first and second experts
    - id: b
      text: The third and fourth
    - id: c
      text: All four equally
    answer: a
    feedback: Top-k chooses the highest-ranked candidates under the specified rule.
  - id: routers-and-top-k.base.2
    prompt: Renormalizing selected weights 0.6 and 0.2 gives what?
    options:
    - id: b
      text: 0.6 and 0.2
    - id: c
      text: 0.8 and 0.8
    - id: a
      text: 0.75 and 0.25
    answer: a
    feedback: Divide each selected affinity by their sum, 0.8.
- id: routers-and-top-k.transfer
  objective_ref: objective.routers-and-top-k
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Keep decisions reproducible: trace the inputs, operation, and result before choosing.'
  remediation_scene: routers-and-top-k.s4
  variants:
  - id: routers-and-top-k.transfer.1
    prompt: Must one written token always select one fixed expert?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only capitalized tokens vary
    - id: a
      text: No; its contextual representation can change
    answer: a
    feedback: Routing depends on representations, not necessarily a static token table.
  - id: routers-and-top-k.transfer.2
    prompt: Why state whether selected affinities are renormalized?
    options:
    - id: c
      text: It has no computational effect
    - id: a
      text: It changes the scale and mixture of expert outputs
    - id: b
      text: It determines the corpus license
    answer: a
    feedback: Combination weights are part of the layer’s definition.
