schema_version: 0.2-draft
lesson:
  id: routers-and-top-k
  version: 0.3.0-draft
  title: Score experts and choose a small set
  state: draft
  summary: One small matrix decides which experts see each token. Compute its scores, keep the top two, rescale them, and mix the outputs, by hand and in code.
  slot: M18.2
  category: learning
  sources:
    - title: "Outrageously Large Neural Networks: The Sparsely-Gated Mixture-of-Experts Layer (Shazeer et al., 2017)"
      url: https://arxiv.org/abs/1701.06538
    - title: "Switch Transformers (Fedus, Zoph & Shazeer, 2021)"
      url: https://arxiv.org/abs/2101.03961
    - title: "Mixtral of Experts (Jiang et al., 2024)"
      url: https://arxiv.org/abs/2401.04088
    - title: "DeepSeek-V3 Technical Report (DeepSeek-AI, 2024)"
      url: https://arxiv.org/abs/2412.19437
  archetype: mechanism
objectives:
  - id: objective.routers-and-top-k
    version: 3-draft
    statement: Trace how a router picks the top-k experts and weights their outputs, including whether the kept weights are renormalized.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - routers-and-top-k.base.v2
      - routers-and-top-k.combine
      - routers-and-top-k.transfer.v3
    prerequisites:
      - anyOf:
          - objective.conditional-computation
      - anyOf:
          - objective.softmax-attention
scenes:
  - id: routers-and-top-k.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.routers-and-top-k
    title: The router is one small matrix
    markdown: |-
      A token arrives at an MoE layer with four experts. Which two should run? The router answers with a single matrix multiplication.

      The router holds a weight matrix $W_r$ with one column per expert. Multiplying the token's vector $x$ by $W_r$ gives one score per expert, called a **logit** (a raw score that can be any real number). To keep the arithmetic visible, take a token vector with just two numbers, $x = [1, 2]$, and a router with four columns:

      | | Expert 1 | Expert 2 | Expert 3 | Expert 4 |
      | --- | ---: | ---: | ---: | ---: |
      | Column of $W_r$ | [0.3979, 1.0] | [0.2094, 0.7] | [0.2986, 0.4] | [0.4, −0.2] |
      | Logit $x \cdot w_i$ | 2.40 | 1.61 | 1.10 | 0.00 |

      For expert 1: $1 \times 0.3979 + 2 \times 1.0 = 2.3979 \approx 2.40$. (We picked these weights so the next step gives round numbers.) In Mixtral, $x$ has 4,096 numbers and $W_r$ has 8 columns, but the operation is the same.

      Because $x$ is the token's vector *after* the earlier layers have mixed in context, the same word can score differently in different sentences.
    bridges: []
  - id: routers-and-top-k.s2
    type: explanation
    depth: intuition
    objective_refs:
      - objective.routers-and-top-k
    title: Softmax, then keep the two largest
    markdown: |-
      A softmax turns the logits into probabilities that sum to 1, exactly as in attention: exponentiate each logit, then divide by the total.

      $$e^{2.40}, e^{1.61}, e^{1.10}, e^{0} \approx 11, 5, 3, 1 \quad\Rightarrow\quad p = [0.55,\ 0.25,\ 0.15,\ 0.05]$$

      **Top-k** selection keeps the $k$ largest entries and drops the rest. With $k = 2$, experts 1 and 2 run; experts 3 and 4 do no work for this token.

      :::mixup "Top-2 draws two experts at random, in proportion to their probabilities."
      Selection is a plain sort: the two largest scores win, every time. Run the same token twice and you get the same experts. (Shazeer's 2017 router added random noise to the logits during training to spread tokens across experts, but even then it kept the largest $k$ of the noisy scores.)
      :::
    bridges: []
  - id: routers-and-top-k.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.routers-and-top-k
    title: Rescale the kept pair
    markdown: |-
      The two kept probabilities, 0.55 and 0.25, add up to only 0.80. Most routers **renormalize**: divide each kept probability by their sum so the weights add to 1.

      $$g_1 = \frac{0.55}{0.80} = 0.6875, \qquad g_2 = \frac{0.25}{0.80} = 0.3125$$

      The ratio 0.55 to 0.25 is unchanged; the dropped experts' share is simply spread over the kept ones. The code runs the whole route: logits, softmax, top-k, renormalize, combine.

      ```python run
      import numpy as np

      x = np.array([1.0, 2.0])                  # one token's hidden vector (d = 2)
      W_r = np.array([[0.3979, 0.2094, 0.2986, 0.4],   # router weights: d x N
                      [1.0,    0.7,    0.4,   -0.2]])  # (N = 4 experts)
      k = 2

      logits = x @ W_r                          # one score per expert
      probs = np.exp(logits) / np.exp(logits).sum()   # softmax over all 4
      chosen = np.argsort(-probs)[:k]           # indices of the k largest
      gates = probs[chosen] / probs[chosen].sum()     # renormalize kept weights

      outputs = np.array([[2, 0], [0, 4], [-1, 1], [3, -2]])  # each expert's output
      y = gates @ outputs[chosen]               # weighted sum of chosen outputs

      print("logits:       ", logits.round(3))
      print("probabilities:", probs.round(3))
      print("chosen experts:", [f"E{i+1}" for i in chosen])
      print("gate weights: ", gates.round(4))
      print("output y:     ", y.round(3))
      # Same gates straight from the kept logits (Shazeer 2017, Mixtral):
      kept = np.exp(logits[chosen]) / np.exp(logits[chosen]).sum()
      print("softmax of kept logits:", kept.round(4))
      ```

      The last line shows a useful fact: a softmax over only the kept logits gives exactly the renormalized weights. Try `k = 3`, or change `x` to `[2.0, 1.0]` and see which experts win.

      :::papers Two ways to write the same gate
      Shazeer et al. (2017) and Mixtral write the gate as

      $$G(x) = \operatorname{Softmax}\big(\operatorname{TopK}(x \cdot W_r,\ k)\big)$$

      where TopK keeps the $k$ largest logits and sets the rest to $-\infty$, so their gates become 0. Here that means a softmax over 2.40 and 1.61 alone, giving 0.6875 and 0.3125: the same as renormalizing $p$.
      :::

      :::predict With k = 1, what weight does expert 1 get?
      Renormalized, it gets 0.55 / 0.55 = 1, and the output is just expert 1's. That's why Switch Transformer, which uses $k = 1$, *doesn't* renormalize: it multiplies the expert's output by $p = 0.55$. A weight fixed at 1 wouldn't change when the router's scores change, so the router would get no training signal through it.
      :::
    bridges: []
  - id: routers-and-top-k.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.routers-and-top-k
    title: Combine each coordinate
    markdown: |-
      Say expert 1 outputs $[2, 0]$ and expert 2 outputs $[0, 4]$. Scale each by its gate and add matching coordinates:

      | | Coordinate 1 | Coordinate 2 |
      | --- | ---: | ---: |
      | $0.6875 \times [2, 0]$ | 1.375 | 0 |
      | $0.3125 \times [0, 4]$ | 0 | 1.25 |
      | Sum $y$ | 1.375 | 1.25 |

      The result $[1.375, 1.25]$ has the same width as each expert's output, just as the code printed. It's a hidden vector that flows on through the network, not a word or an answer.
    bridges: []
  - id: routers-and-top-k.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.routers-and-top-k
    markdown: Renormalize kept probabilities, mix two expert outputs by hand, and diagnose routers that skip a step or read too much into a gate weight.
    takeaway: |-
      Score, select, rescale, combine: logits from one matrix, keep the top k, divide the kept probabilities by their sum, and add the weighted expert outputs.
  - id: routers-and-top-k.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.routers-and-top-k
    markdown: |-
      A router maps token representations to expert scores, selects a top-k set, and supplies combination weights under an explicit normalization rule.
  - id: routers-and-top-k.s5
    type: simulation
    depth: mechanics
    objective_refs:
      - objective.routers-and-top-k
    title: Predict, then change the expert count
    markdown: |-
      The playground uses our four probabilities (0.55, 0.25, 0.15, 0.05) and renormalizes whatever it keeps. Experts 3 and 4 output $[-1, 1]$ and $[3, -2]$.

      Predict before you click. At top-1, only expert 1 runs with weight 1, so the output is $[2, 0]$. At top-3 the kept mass is 0.95, and the output becomes $(0.55[2, 0] + 0.25[0, 4] + 0.15[-1, 1]) / 0.95 \approx [1.0, 1.21]$. With all 4, no rescaling is needed: $[1.1, 1.05]$.

      Each extra expert pulls the mixture toward its own output and costs one more expert's worth of compute. Real models settle $k$ by training and measuring; Switch uses 1, and Mixtral and GShard use 2.
    bridges: []
    simulation: moe
  - id: routers-and-top-k.s6
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.routers-and-top-k
    title: Same recipe, different conventions
    markdown: |-
      Every MoE router follows score, select, rescale, combine, but real models differ in the details:

      | Model | Scores | Kept per token | Rescaling |
      | --- | --- | --- | --- |
      | Shazeer et al. (2017) | Softmax, with noise added during training | $k$ (often 2 or 4) | Softmax over kept logits |
      | Switch Transformer (2021) | Softmax | 1 | None: gate is $p$ |
      | Mixtral (2023) | Softmax | 2 of 8 | Softmax over kept logits |
      | DeepSeek-V3 (2024) | Sigmoid of each score | 8 of 256 | Divide by the kept scores' sum |

      So before you compute a gate, check which convention the model uses.

      A gate weight is a mixing weight, not a confidence score. A gate of 0.6875 means expert 1's output counts for 68.75% of the mixture. It doesn't mean the model is 69% sure that expert 1 is "right." There is no right expert, only a blend that training has made useful.
    bridges: []
  - id: routers-and-top-k.s7
    type: question
    depth: mechanics
    objective_refs:
      - objective.routers-and-top-k
    title: Choose the rescaling denominator
    markdown: |-
      A different token's two kept expert probabilities are 0.6 and 0.2. Before you rescale them, what do you divide each one by?
    bridges: []
    question:
      response_type: single_choice
      options:
        - id: a
          text: '0.8'
        - id: b
          text: '1.0'
        - id: c
          text: '2.0'
      answer: a
      reveal_markdown: The kept mass is 0.6 + 0.2 = 0.8, so the weights become 0.6 / 0.8 = 0.75 and 0.2 / 0.8 = 0.25. They sum to 1 and keep the original 3-to-1 ratio. Dividing by 1.0 would leave them summing to 0.8, and dividing by 2 (the number of experts) would give 0.3 and 0.1.
      hint: Add up only the probabilities of the experts you kept. That sum is what each kept probability gets divided by.
      id: routers-and-top-k.practice.v2.7
