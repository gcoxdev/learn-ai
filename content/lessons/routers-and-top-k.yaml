  - id: routers-and-top-k.base.v2
    objective_ref: objective.routers-and-top-k
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Add only the kept probabilities to get the denominator, then divide each kept probability by it. The new weights keep their ratio and sum to 1.
    remediation_scene: routers-and-top-k.s3
    variants:
      - prompt: The already selected top-two probabilities are 0.6 and 0.2. Renormalize them; the remaining experts are excluded.
        answers:
          total: 0.8
          first: 0.7499999999999999
          second: 0.25
        reason_answer: a
        reason_options:
          - id: c
            text: Keep the selected probabilities unchanged despite the renormalization rule
          - id: a
            text: Divide each selected probability by their sum
          - id: b
            text: Divide each by the number of selected experts
        feedback: 0.6 + 0.2 = 0.8, so the weights are 0.6/0.8 = 0.75 and 0.2/0.8 = 0.25. Dividing by the number of experts (2) would give 0.3 and 0.1, which don't sum to 1.
        id: routers-and-top-k.base.v2.1
      - prompt: The already selected top-two probabilities are 0.45 and 0.3. Renormalize them; the remaining experts are excluded.
        answers:
          total: 0.75
          first: 0.6
          second: 0.39999999999999997
        reason_answer: a
        reason_options:
          - id: b
            text: Divide each by the number of selected experts
          - id: c
            text: Keep the selected probabilities unchanged despite the renormalization rule
          - id: a
            text: Divide each selected probability by their sum
        feedback: 0.45 + 0.3 = 0.75, so the weights are 0.45/0.75 = 0.6 and 0.3/0.75 = 0.4. Leaving them unchanged would scale the layer's output by 0.75.
        id: routers-and-top-k.base.v2.2
      - prompt: The already selected top-two probabilities are 0.5 and 0.3. Renormalize them; the remaining experts are excluded.
        answers:
          total: 0.8
          first: 0.625
          second: 0.37499999999999994
        reason_answer: a
        reason_options:
          - id: c
            text: Keep the selected probabilities unchanged despite the renormalization rule
          - id: a
            text: Divide each selected probability by their sum
          - id: b
            text: Divide each by the number of selected experts
        feedback: 0.5 + 0.3 = 0.8, so the weights are 0.5/0.8 = 0.625 and 0.3/0.8 = 0.375. They keep the 5-to-3 ratio and now sum to 1.
        id: routers-and-top-k.base.v2.3
      - prompt: The already selected top-two probabilities are 0.48 and 0.32. Renormalize them; the remaining experts are excluded.
        answers:
          total: 0.8
          first: 0.6
          second: 0.39999999999999997
        reason_answer: a
        reason_options:
          - id: a
            text: Divide each selected probability by their sum
          - id: b
            text: Divide each by the number of selected experts
          - id: c
            text: Keep the selected probabilities unchanged despite the renormalization rule
        feedback: 0.48 + 0.32 = 0.8, so the weights are 0.48/0.8 = 0.6 and 0.32/0.8 = 0.4. Dividing by 2 instead would give 0.24 and 0.16, losing the rescaling entirely.
        id: routers-and-top-k.base.v2.4
    numeric_fields:
