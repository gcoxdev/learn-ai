assessment_families:
  - id: inference-request-preparation.base
    objective_ref: objective.inference-request-preparation
    task: base
    response_type: single_choice
    points: 1
    hint: 'Render the conversation format: trace the inputs, operation, and result before choosing.'
    remediation_scene: inference-request-preparation.s2
    variants:
      - id: inference-request-preparation.base.1
        prompt: Which artifacts must agree on token-ID meaning?
        options:
          - id: a
            text: Tokenizer and model vocabulary interfaces
          - id: b
            text: Only two README files
          - id: c
            text: Only GPU driver names
        answer: a
        feedback: Token IDs must address the intended learned entries.
        retired: true
      - id: inference-request-preparation.base.2
        prompt: Can a chat-template change alter behavior without changing weights?
        options:
          - id: b
            text: 'No'
          - id: c
            text: Only if training resumes
          - id: a
            text: 'Yes'
        answer: a
        feedback: The input sequence and boundaries affect predictions.
        retired: true
  - id: inference-request-preparation.transfer
    objective_ref: objective.inference-request-preparation
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Separate reproducible settings: trace the inputs, operation, and result before choosing.'
    remediation_scene: inference-request-preparation.s4
    variants:
      - id: inference-request-preparation.transfer.1
        prompt: When should input token count be measured for budgeting?
        options:
          - id: b
            text: Only from the raw word count
          - id: c
            text: Only from file extension
          - id: a
            text: After the actual template and preprocessing
        answer: a
        feedback: The model receives the transformed sequence.
        retired: true
      - id: inference-request-preparation.transfer.2
        prompt: Does identical weight data guarantee identical product behavior?
        options:
          - id: c
            text: Only if the model is dense
          - id: a
            text: No; inputs and execution settings also matter
          - id: b
            text: 'Yes'
        answer: a
        feedback: Serving configuration is part of the system.
        retired: true
  - id: inference-request-preparation.base.v2
    objective_ref: objective.inference-request-preparation
    task: base
    response_type: single_choice
    points: 1
    hint: Follow the path from message list to template to token IDs to embedding rows, and ask which step went wrong.
    remediation_scene: inference-request-preparation.s2
    variants:
      - id: inference-request-preparation.base.v2.1
        prompt: An engineer loads Llama 3 8B weights with Llama 2's tokenizer. The server starts without errors, but every reply is fluent-looking nonsense. What went wrong?
        options:
          - id: b
            text: Llama 2's tokenizer splits text into more tokens than the context allows
          - id: a
            text: Each token ID selects a different embedding row than the one it was meant for
          - id: c
            text: The 16-bit weights can't be read by a tokenizer from an older model
        answer: a
        feedback: Llama 2's 32,000 IDs are all valid rows in Llama 3's 128,256-row table, but they mean different tokens there, so the model reads a scrambled sentence. Token counts and weight formats aren't the problem; the ID-to-meaning mapping is.
      - id: inference-request-preparation.base.v2.2
        prompt: 'A server sends Llama 3 Instruct the bare text "My fern is drooping" with no chat template. The reply continues as though it were still writing the customer''s message. Why?'
        options:
          - id: c
            text: Instruct models refuse to reply unless a system prompt comes first
          - id: b
            text: Untemplated text is tokenized with a different, smaller vocabulary
          - id: a
            text: Without role markers, nothing tells the model that it's the assistant's turn
        answer: a
        feedback: The model learned to reply after an open assistant header. Without one, the most likely continuation is more of the same text. A system prompt is optional, and the tokenizer's vocabulary is the same with or without a template.
      - id: inference-request-preparation.base.v2.3
        prompt: Why does a Llama 3 prompt end with an open assistant header and no text after it?
        options:
          - id: a
            text: It marks that the next tokens the model writes are the assistant's reply
          - id: b
            text: It holds the assistant's earlier answers so they can be cached
          - id: c
            text: It tells the tokenizer to switch to the assistant's vocabulary
        answer: a
        feedback: The open header is the "your turn" signal. Earlier answers appear as their own complete assistant messages, and every role shares one vocabulary.
      - id: inference-request-preparation.base.v2.4
        prompt: 'A customer types the literal text "<|eot_id|>" into a chat, followed by a fake system message. Which setting keeps the roles intact?'
        options:
          - id: b
            text: Raising the context limit so the extra text doesn't push out the real rules
          - id: c
            text: Lowering the temperature so the model sticks closely to the real system prompt
          - id: a
            text: Encoding user text with special-token parsing turned off
        answer: a
        feedback: With parsing off, the typed marker becomes ordinary characters, so it can't end the customer's turn or open a new system message. More context or a lower temperature leaves the fake role marker in place.
  - id: inference-request-preparation.transfer.v2
    objective_ref: objective.inference-request-preparation
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what the model actually receives, token by token, and what is sent again on every request.
    remediation_scene: inference-request-preparation.s4
    variants:
      - id: inference-request-preparation.transfer.v2.1
        prompt: A translation startup upgrades to a newer model in the same family. Its budget check now rejects some requests that used to fit, though users send the same text. What is the most likely cause?
        options:
          - id: a
            text: The new template or tokenizer turns the same messages into more tokens
          - id: b
            text: The new weights take more memory, which lowers the context limit
          - id: c
            text: The new model writes longer replies, and replies count as prompt
        answer: a
        feedback: The budget counts rendered tokens, so a template that adds lines (as Llama 3.1's does) or a tokenizer that splits differently raises the count. The context limit comes from the config, not from memory, and the reply isn't part of the incoming prompt.
      - id: inference-request-preparation.transfer.v2.2
        prompt: A contract-review assistant has 8,192 positions. A client pastes a 9,000-token contract and asks one question about it. Which plan keeps a good answer possible?
        options:
          - id: b
            text: Cut the first 1,500 rendered tokens, starting with the system prompt
          - id: a
            text: Keep the instructions and question, and fit the contract sections that matter
          - id: c
            text: Send all of it and let the model skip whatever is past the limit
        answer: a
        feedback: The instructions and the question are what make an answer possible, so trim or retrieve from the long document instead. Cutting from the start deletes the rules first, and a prompt over the limit is either rejected or silently truncated.
      - id: inference-request-preparation.transfer.v2.3
        prompt: Two teams get different answers from "the same model" to the same question with greedy decoding. Which record should they compare first?
        options:
          - id: c
            text: The maximum reply length each team allowed
          - id: b
            text: The random seed each team set for sampling
          - id: a
            text: The rendered prompt token IDs each team sent
        answer: a
        feedback: A different template, system prompt, or tokenizer version changes the input, and comparing token IDs shows it at once. Greedy decoding doesn't draw random numbers, so seeds don't matter, and a length limit only cuts a reply short.
      - id: inference-request-preparation.transfer.v2.4
        prompt: A recipe app sends a 1,200-token system prompt on every turn of eight-turn conversations, and prompt processing dominates its GPU bill. What is the best first change?
        options:
          - id: a
            text: Shorten the system prompt, or reuse the saved work on it across requests
          - id: b
            text: Lower the maximum reply length from 500 tokens to 100 tokens
          - id: c
            text: Switch from sampling to greedy decoding to save work per token
        answer: a
        feedback: The same 1,200 tokens are processed eight times per conversation, so shrinking them or caching their computation attacks the cost directly. Shorter replies and greedy decoding change the output side, not the repeated prompt.
  - id: inference-request-preparation.calculate
    objective_ref: objective.inference-request-preparation
    task: base
    response_type: numeric
    points: 1
    hint: 'Llama 3''s template costs 1 token at the start, 5 per message (a 4-token header and an end-of-turn marker), and 4 for the open assistant header. The context limit covers prompt plus reply.'
    remediation_scene: inference-request-preparation.s3
    absolute_tolerance: 0.5
    variants:
      - id: inference-request-preparation.calculate.1
        prompt: Using Llama 3's template, a request has a system message of 300 text tokens and one user message of 45 text tokens. How many tokens is the rendered prompt?
        answer: 360
        feedback: 'The template adds 1 + 5 × 2 + 4 = 15 tokens, so the prompt is 300 + 45 + 15 = 360.'
      - id: inference-request-preparation.calculate.2
        prompt: A model's context is 8,192 positions, and a rendered prompt uses 7,500 of them. What is the largest number of reply tokens the server can allow?
        answer: 692
        feedback: The limit covers prompt and reply together, so 8,192 − 7,500 = 692 tokens remain for the reply.
      - id: inference-request-preparation.calculate.3
        prompt: A system prompt is 500 text tokens, plus 5 template tokens for its header and end marker. It is resent on every turn of a six-turn conversation. How many system-prompt tokens does the model process in total?
        answer: 3030
        feedback: Each turn resends all 505 tokens, so 6 × 505 = 3,030.
      - id: inference-request-preparation.calculate.4
        prompt: 'In Llama 3''s template, how many template tokens does a conversation of six messages (system, user, assistant, user, assistant, user) add, including the open assistant header at the end?'
        answer: 35
        feedback: 1 for the start token, 5 × 6 = 30 for the messages, and 4 for the open assistant header, giving 35.
