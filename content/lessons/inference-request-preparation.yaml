schema_version: 0.2-draft
lesson:
  id: inference-request-preparation
  version: 0.4.0-draft
  title: Load a compatible model and prepare its exact input
  state: draft
  summary: Right weights, wrong tokenizer, fluent nonsense. See the exact tokens a chat model reads, and why a long system prompt costs you on every single turn.
  slot: M27.1
  category: learning
  sources:
    - title: The Llama 3 Herd of Models (Llama Team, Meta, 2024)
      url: https://arxiv.org/abs/2407.21783
    - title: Hugging Face Transformers documentation, chat templates
      url: https://huggingface.co/docs/transformers/chat_templating
    - title: Llama 3 8B Instruct model files and configuration (Meta, on Hugging Face)
      url: https://huggingface.co/meta-llama/Meta-Llama-3-8B-Instruct
objectives:
  - id: objective.inference-request-preparation
    version: 2-draft
    statement: Inference preparation connects weights, configuration, tokenizer, templates, and runtime settings; a request must use compatible artifacts and preserve its intended role and modality boundaries.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - inference-request-preparation.base.v2
      - inference-request-preparation.transfer.v2
      - inference-request-preparation.calculate
    prerequisites:
      - anyOf:
          - objective.base-model-design
      - anyOf:
          - objective.training-and-inference
scenes:
  - id: inference-request-preparation.s1
    title: Right weights, wrong dictionary
    type: explanation
    depth: intuition
    objective_refs:
      - objective.inference-request-preparation
    markdown: |-
      Fernly sells houseplants online. Its support assistant, Fern, answers questions like "Why is my monstera turning yellow?" The team serves an open model, Llama 3 8B Instruct, on one rented GPU, and we'll follow them through this module. On day one, an engineer loads the new weights but points the loader at the tokenizer folder of the team's old model, Llama 2. Nothing crashes. Fern replies in fluent-looking nonsense.

      A downloaded model is a set of files, often called **artifacts**, and they only work as a matching set:

      | File | What it holds | Llama 3 8B Instruct |
      | --- | --- | --- |
      | Weights (`.safetensors`) | The learned numbers | About 8 billion, 16 GB in 16-bit |
      | Config (`config.json`) | The shapes: layers, heads, widths, vocabulary size | 32 layers, 32 query heads, 8 KV heads, 128,256 tokens |
      | Tokenizer | The mapping between text and integer IDs, plus special tokens | 128,256 entries |
      | Chat template | How a list of messages becomes one string | Role headers and an end-of-turn marker |
      | Generation config | Default stopping and sampling settings | Which tokens end a reply |

      The tokenizer turns text into IDs, and each ID selects one row of the model's embedding table, as in the embeddings lesson. Llama 2's tokenizer has 32,000 entries, so every ID it produces is a valid row in Llama 3's 128,256-row table. It's just the *wrong* row: the model reads a sentence spelled with a scrambled dictionary.

      So the server now checks two things at startup: the config's `vocab_size` equals the tokenizer's length, and "Hello, Fern" survives encoding and decoding unchanged.
    bridges: []
  - id: inference-request-preparation.s2
    title: What the model actually reads
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.inference-request-preparation
    markdown: |-
      Fern's code keeps a conversation as a list of messages, each with a role: `system` for the company's standing instructions, `user` for the customer, `assistant` for Fern. The model never sees that list. A **chat template** flattens it into one string, and for Llama 3 Instruct the result looks like this:

      ```text
      <|begin_of_text|><|start_header_id|>system<|end_header_id|>

      You are Fern, Fernly's plant-care assistant. Be brief and kind.<|eot_id|><|start_header_id|>user<|end_header_id|>

      My monstera has yellow leaves. What should I do?<|eot_id|><|start_header_id|>assistant<|end_header_id|>

      ```

      Each marker in angle brackets is a **special token**: a single vocabulary entry that marks structure rather than standing for text. `<|eot_id|>` means "end of turn". The string ends with an *open* assistant header, which tells the model that the next tokens are its reply. When the model later produces `<|eot_id|>` itself, the server stops generating.

      The model learned these markers during instruction tuning, so it follows them closely. Send the bare question without the template and it may carry on writing more of the customer's message, because nothing says whose turn it is.

      :::mixup "Special tokens are just text, so a customer can't do any harm by typing one."
      If the tokenizer turns a typed `<|eot_id|>` into the real special token, a customer can end their own turn early and write a fake `system` message after it. Encode user text with special-token parsing turned off, so typed markers become ordinary characters. Only the template itself should produce real role markers.
      :::
    diagram:
      caption: How a conversation becomes model input. The model only ever sees token IDs.
      description: The message list goes into the chat template, which produces one rendered string with role markers. The tokenizer turns that string into token IDs, which go into the model. The weights and config, loaded at startup, feed the model. The model's reply tokens return to the message list as a new assistant message.
      nodes:
        - id: messages
          label: Message list
          note: system, user, assistant
          col: 0
          row: 0
          tone: data
        - id: template
          label: Chat template
          note: adds role markers
          col: 1
          row: 0
          tone: accent
        - id: text
          label: Rendered string
          col: 2
          row: 0
        - id: tokenizer
          label: Tokenizer
          note: text to IDs
          col: 2
          row: 1
          tone: accent
        - id: model
          label: Model
          col: 1
          row: 1
        - id: weights
          label: Weights + config
          note: must match the tokenizer
          col: 0
          row: 2
          tone: muted
      edges:
        - from: messages
          to: template
        - from: template
          to: text
        - from: text
          to: tokenizer
        - from: tokenizer
          to: model
          label: IDs
        - from: weights
          to: model
          dashed: true
        - from: model
          to: messages
          label: reply
    bridges: []
  - id: inference-request-preparation.s3
    title: Count the tokens, then the budget
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.inference-request-preparation
    markdown: |-
      Llama 3 8B can attend to at most 8,192 token positions, and that limit covers the prompt *and* the reply. Fern reserves 512 positions for its answer, so a prompt can use at most 7,680.

      Count the rendered prompt, not the visible words. In Llama 3's template, `<|begin_of_text|>` appears once, each message adds a four-token header plus one `<|eot_id|>`, and the open assistant header at the end adds four more. So the template costs $1 + 5 \times \text{messages} + 4$ tokens on top of the text.

      ```python run
      # Token counts the tokenizer reported for each message's text
      messages = [
          ("system",    412),   # Fern's instructions and tone guide
          ("user",       38),   # "My monstera has yellow leaves..."
          ("assistant", 164),   # Fern's first answer
          ("user",       27),   # "It's by a north window. Too dark?"
      ]
      CONTEXT = 8192      # Llama 3's context length
      RESERVE = 512       # room kept for the reply

      # Llama 3 template: <|begin_of_text|> once; per message a 4-token header
      # (<|start_header_id|> role <|end_header_id|> "\n\n") and <|eot_id|>;
      # then an open assistant header (4 tokens) to start the reply.
      overhead = 1 + 5 * len(messages) + 4
      content = sum(n for _, n in messages)
      prompt = content + overhead
      print(f"content tokens:  {content}")
      print(f"template tokens: {overhead}")
      print(f"prompt tokens:   {prompt}")
      print(f"room left for retrieved care notes: {CONTEXT - RESERVE - prompt}")
      ```

      The four messages hold 641 tokens of text, the template adds 25, and 7,014 positions remain for care-guide passages that retrieval might add. Add a fifth message of 50 tokens and watch both the template cost and the remaining room change.

      :::predict A customer pastes a 7,300-token watering log into the conversation above. What should the server cut?
      The prompt would be 666 + 7,300 + 5 = 7,971 tokens, which is 291 over the 7,680 limit. Keep the system prompt, since it holds the rules, and keep the latest question, since that's what needs answering. Cut from the middle: summarize or trim the log, or drop the oldest turns. Cutting blindly from the start would delete the instructions first.
      :::
    bridges: []
  - id: inference-request-preparation.system-prompt-cost
    title: The system prompt is paid for on every turn
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.inference-request-preparation
    markdown: |-
      The model keeps nothing between requests. To answer turn 3, the server sends the whole conversation again: system prompt, turns 1 and 2, and the new question. So the system prompt is processed on *every* turn.

      Say Fern's system prompt is 600 tokens (605 with its header), each customer message is 60 (65 with markers), and each reply is 200 (205). Turn $n$ sends the 5 fixed template tokens, the system prompt, $n$ customer messages, and $n - 1$ replies:

      | Turn | Prompt tokens | Of which system prompt |
      | ---: | ---: | ---: |
      | 1 | 675 | 605 |
      | 2 | 945 | 605 |
      | 3 | 1,215 | 605 |
      | 4 | 1,485 | 605 |
      | 5 | 1,755 | 605 |
      | **Total** | **6,075** | **3,025** |

      Half of all the prompt tokens in a five-turn chat are the same 605 system tokens, over and over. At 40,000 conversations a day, that's 121 million repeated tokens out of 243 million.

      Every prompt token costs GPU time before the first word of the reply appears. The team has two levers: write a shorter system prompt, or stop recomputing the parts that never change. The next lesson shows the second lever, called **prefix caching**: the server saves the work it did on the system prompt and reuses it for every request that starts with the same tokens.
    bridges: []
  - id: inference-request-preparation.s4
    title: Pin every piece that shapes the input
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.inference-request-preparation
    markdown: |-
      A month later Fernly upgrades to Llama 3.1 8B Instruct. The new chat template adds two lines to the top of every system message: a knowledge-cutoff date and today's date. The weights changed, but so did the input: every prompt grew by about 20 tokens, and a few answers now mention the date.

      Answers can change even when the weights don't, so the team records, for every deployment:

      - the model repository and its exact revision (a commit hash);
      - the tokenizer and chat-template version;
      - the generation settings: stop tokens, temperature, maximum reply length;
      - the serving software's version.

      Then they keep a **golden request**: one fixed conversation, run with greedy decoding, whose rendered token IDs and reply are saved. After any change, they rerun it. If the token IDs differ, the input changed, and they read the diff before blaming the model. That check caught the new date lines in a minute.
    bridges: []
  - id: inference-request-preparation.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.inference-request-preparation
    markdown: Mismatched tokenizers, a missing template, a typed special token, token budgets to count, and a costly system prompt test whether you can prepare exactly what a model should read.
    takeaway: |-
      A model reads token IDs, not messages: load weights, config, tokenizer, and chat template as one matching set, and count the rendered prompt, including the system prompt resent on every turn.
  - id: inference-request-preparation.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.inference-request-preparation
    markdown: |-
      Use compatible weights, configuration, tokenizer, and templates. Count the exact prepared input and reserve enough space for the intended output.
