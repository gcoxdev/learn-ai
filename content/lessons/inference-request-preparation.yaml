schema_version: 0.2-draft
lesson:
  id: inference-request-preparation
  version: 0.1.0-draft
  title: Load a compatible model and prepare its exact input
  state: draft
  summary: Inference preparation connects weights, configuration, tokenizer, templates, and runtime settings; a
    request must use compatible artifacts and preserve its intended role and modality boundaries.
  slot: M27.1
  category: learning
  minutes: 12
  sources:
  - title: The Llama 3 Herd of Models
    url: https://arxiv.org/abs/2407.21783
  - title: Hugging Face chat templating
    url: https://huggingface.co/docs/transformers/chat_templating
objectives:
- id: objective.inference-request-preparation
  version: 1-draft
  statement: Inference preparation connects weights, configuration, tokenizer, templates, and runtime settings;
    a request must use compatible artifacts and preserve its intended role and modality boundaries.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - inference-request-preparation.base
  - inference-request-preparation.transfer
  prerequisites:
  - anyOf:
    - objective.base-model-design
  - anyOf:
    - objective.training-and-inference
scenes:
- id: inference-request-preparation.s1
  title: Load an artifact set
  type: explanation
  depth: intuition
  objective_refs:
  - objective.inference-request-preparation
  markdown: Weights need an architecture configuration describing their shapes and operations. The tokenizer supplies
    token-ID mappings, and the runtime must support the intended precision and kernels. Check artifact identity
    and compatibility rather than assuming any similarly named files form a working model.
  text_mode: Weights need an architecture configuration describing their shapes and operations. The tokenizer supplies
    token-ID mappings, and the runtime must support the intended precision and kernels. Check artifact identity
    and compatibility rather than assuming any similarly named files form a working model.
  bridges: []
- id: inference-request-preparation.s2
  title: Render the conversation format
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.inference-request-preparation
  markdown: A chat template converts roles, messages, tool records, and generation markers into the sequence the
    model expects. Adding or omitting a special boundary can change behavior. Human-readable conversation text and
    the exact token sequence are related but distinct interfaces.
  text_mode: A chat template converts roles, messages, tool records, and generation markers into the sequence the
    model expects. Adding or omitting a special boundary can change behavior. Human-readable conversation text and
    the exact token sequence are related but distinct interfaces.
  bridges: []
- id: inference-request-preparation.s3
  title: Validate the request budget
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.inference-request-preparation
  markdown: Count input tokens after templating and modality preprocessing, then reserve an output budget within
    supported limits. Truncation policies should preserve essential instructions and evidence. A nominal context
    limit does not guarantee that an arbitrary combination of prompt, output, and concurrent requests fits memory.
  text_mode: Count input tokens after templating and modality preprocessing, then reserve an output budget within
    supported limits. Truncation policies should preserve essential instructions and evidence. A nominal context
    limit does not guarantee that an arbitrary combination of prompt, output, and concurrent requests fits memory.
  bridges: []
- id: inference-request-preparation.s4
  title: Separate reproducible settings
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.inference-request-preparation
  markdown: Record model revision, template, preprocessing, sampling, stop rules, tools, and relevant runtime versions.
    A product can change answers through request preparation even with identical weights. Validate a known short
    request before interpreting a larger serving experiment.
  text_mode: Record model revision, template, preprocessing, sampling, stop rules, tools, and relevant runtime versions.
    A product can change answers through request preparation even with identical weights. Validate a known short
    request before interpreting a larger serving experiment.
  bridges: []
- id: inference-request-preparation.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.inference-request-preparation
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: inference-request-preparation.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.inference-request-preparation
  markdown: Inference preparation connects weights, configuration, tokenizer, templates, and runtime settings; a
    request must use compatible artifacts and preserve its intended role and modality boundaries.
  text_mode: Inference preparation connects weights, configuration, tokenizer, templates, and runtime settings;
    a request must use compatible artifacts and preserve its intended role and modality boundaries.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - inference-request-preparation.s1
    - inference-request-preparation.s2
    - inference-request-preparation.s3
    - inference-request-preparation.s4
