schema_version: 0.2-draft
lesson:
  id: active-and-curriculum-learning
  version: 0.4.0-draft
  title: Choose which examples to learn from next
  state: draft
  summary: An astronomer can label 500 of 100,000 galaxy images. Which 500? Let the model ask about what confuses it, and learn why it can still miss its own worst mistakes.
  slot: M31.6
  category: learning
  sources:
    - title: "Active Learning Literature Survey (Settles, 2009)"
      url: https://burrsettles.com/pub/settles.activelearning.pdf
    - title: "Curriculum Learning (Bengio, Louradour, Collobert & Weston, 2009)"
      url: https://dl.acm.org/doi/10.1145/1553374.1553380
    - title: "When Do Curricula Work? (Wu, Dyer & Neyshabur, 2021)"
      url: https://arxiv.org/abs/2012.03107
objectives:
  - id: objective.active-and-curriculum-learning
    version: 2-draft
    statement: Rank unlabeled examples by least confidence or entropy, recognize the sampling bias that model-chosen labels create, and design a fair comparison for a training curriculum.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - active-and-curriculum-learning.base.v2
      - active-and-curriculum-learning.transfer.v2
      - active-and-curriculum-learning.calculate
    prerequisites:
      - anyOf:
          - objective.continual-and-online-learning
      - anyOf:
          - objective.training-data-mixtures
scenes:
  - id: active-and-curriculum-learning.s1
    title: Five hundred labels for a hundred thousand galaxies
    type: explanation
    depth: intuition
    objective_refs:
      - objective.active-and-curriculum-learning
    markdown: |-
      An observatory has 100,000 telescope images of galaxies and wants a model that sorts them into spiral, elliptical, or merging. An astronomer can label about 500 this month. Picking 500 at random wastes many labels on easy spirals the model would get right anyway.

      **Active learning** lets the model choose. It runs as a loop:

      1. Train on the labels you have (start with, say, 50 random ones).
      2. Score every unlabeled image by how useful a label would be.
      3. Send the top few to the astronomer, who acts as the **oracle**, the source of true labels.
      4. Add the new labels and repeat until the budget runs out.

      The most common score is the model's own uncertainty, which is called **uncertainty sampling** (Lewis & Gale, 1994): ask about the images the model is least sure of. Those tend to lie near the boundary between classes, where a label moves the boundary most. An image the model already calls "spiral, 0.99" teaches it almost nothing.
    diagram:
      caption: The active learning loop. The model picks what the expert labels next.
      description: The labeled set trains the model. The model scores every image in the unlabeled pool. The most uncertain images go to the astronomer, the oracle, whose new labels join the labeled set, and the loop repeats.
      nodes:
        - id: labeled
          label: Labeled set
          note: starts with 50 random labels
          col: 0
          row: 0
          tone: data
        - id: model
          label: Train the model
          col: 1
          row: 0
          tone: accent
        - id: pool
          label: Unlabeled pool
          note: 100,000 images
          col: 2
          row: 0
          tone: data
        - id: oracle
          label: Astronomer (oracle)
          note: labels the top few
          col: 1
          row: 1
          tone: warn
      edges:
        - from: labeled
          to: model
        - from: model
          to: pool
          label: score uncertainty
        - from: pool
          to: oracle
          label: most uncertain
        - from: oracle
          to: labeled
          label: new labels
    bridges: []
  - id: active-and-curriculum-learning.s3
    title: Two ways to measure "unsure"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.active-and-curriculum-learning
    markdown: |-
      The model outputs a probability for each class. Two standard uncertainty scores:

      - **Least confidence:** $1 - \max_k p_k$. It looks only at the top class.
      - **Entropy:** $H = -\sum_k p_k \log_2 p_k$, in bits. It looks at the whole spread: 0 when the model is certain, and $\log_2 3 \approx 1.585$ bits when three classes are equally likely.

      | Image | $p$(spiral, elliptical, merger) | Least confidence | Entropy (bits) |
      | --- | --- | ---: | ---: |
      | G1 | 0.90, 0.05, 0.05 | 0.10 | 0.569 |
      | G2 | 0.50, 0.50, 0.00 | 0.50 | 1.000 |
      | G3 | 0.55, 0.225, 0.225 | 0.45 | 1.443 |

      For G2, entropy is $-(0.5 \log_2 0.5 + 0.5 \log_2 0.5) = 1$ bit.

      :::predict You can label one of G1–G3. Which does each score pick?
      Least confidence picks G2 (0.50 beats 0.45). Entropy picks G3 (1.443 beats 1.000). G2 is a coin toss between two classes, but it has ruled out mergers. G3 leans spiral with doubts spread over both alternatives. Neither score is "right"; they define uncertainty differently, and the difference matters most with many classes.
      :::

      ```python run
      import numpy as np

      # Model's predicted probabilities (spiral, elliptical, merger) for unlabeled galaxy images
      pool = {
          "G1": [0.90, 0.05, 0.05],
          "G2": [0.50, 0.50, 0.00],
          "G3": [0.55, 0.225, 0.225],
          "G4": [0.34, 0.33, 0.33],
          "G5": [0.70, 0.20, 0.10],
      }

      def least_confidence(p):
          return 1 - max(p)

      def entropy(p):
          p = np.array([q for q in p if q > 0])
          return -(p * np.log2(p)).sum()          # in bits; the maximum for 3 classes is log2(3) = 1.585

      print("image  least-confidence  entropy (bits)")
      for name, p in pool.items():
          print(f"  {name}       {least_confidence(p):.3f}          {entropy(p):.3f}")

      budget = 2
      for rule in (least_confidence, entropy):
          picked = sorted(pool, key=lambda k: rule(pool[k]), reverse=True)[:budget]
          print(f"{rule.__name__} asks the astronomer to label: {picked}")
      ```

      Both scores put G4, a near three-way tie, first. Change G5 to `[0.40, 0.40, 0.20]` and predict where each rule now ranks it before you run it.
    bridges: []
  - id: active-and-curriculum-learning.s4
    title: The mistakes the model never asks about
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.active-and-curriculum-learning
    markdown: |-
      Suppose the early model has decided that galaxies seen edge-on, which look like thin streaks, are ellipticals, and it's 95% sure. Many are actually spirals. Uncertainty sampling will never ask about them, because the model isn't uncertain. The labels it collects confirm its picture of the boundary it already knows and never visit the region where it's confidently wrong.

      This is **sampling bias**: the labeled set is chosen by the model, so it doesn't represent the data. It causes three practical problems:

      | Problem | Galaxy example | Fix |
      | --- | --- | --- |
      | Confident errors go unfound | Edge-on spirals never queried | Spend some of the budget (say 1 label in 5) on random images |
      | Accuracy on the labeled set misleads | Queried images are the hard ones, so accuracy looks too low, or skewed | Label a separate random test set once, and never let the model choose it |
      | The most uncertain can be junk | Satellite trails and camera glitches score as maximally uncertain | Filter obvious junk, or weight uncertainty by how typical an image is |

      A batch of the ten most uncertain images can also be ten near-copies of one odd galaxy. Choosing a batch that is uncertain *and* varied makes each label count.

      :::mixup "The actively labeled set is our best-labeled data, so it makes the best test set."
      It's the least representative data you have: picked for being hard, by the model being tested. A random test set measures what users will see.
      :::
    bridges: []
  - id: active-and-curriculum-learning.s2
    title: Easy lessons first?
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.active-and-curriculum-learning
    markdown: |-
      Active learning chooses which examples get *labeled*. A **curriculum** chooses the *order* in which labeled examples are used for training, usually easy ones first, as in school. For the galaxy model, "easy" could mean bright, sharp images that every astronomer agrees on; the faint and disputed ones join later.

      Bengio, Louradour, Collobert, and Weston named **curriculum learning** in 2009. In their experiments, starting with simpler examples, such as basic geometric shapes before varied ones, or a small vocabulary before a large one, helped networks learn faster and generalize better. Difficulty can also come from the model itself: train on the examples it currently finds easy, then widen the set.

      The evidence since is mixed. A large study by Wu, Dyer, and Neyshabur (2021) ran thousands of orderings on image benchmarks. With a full training budget, curricula gave only marginal gains over random order. They helped when training time was short, or when many labels were wrong: noisy examples look "hard", so an easy-first schedule meets them late.

      So test a curriculum the way the lesson on controlled experiments (module 9) tests anything. Run it against shuffled order with the same data, the same number of training steps, and several seeds. The galaxy team does this: curriculum 91.8% ± 0.4 and shuffled 91.5% ± 0.5 over five seeds, a difference too small to matter at full budget. Cut training to a quarter, though, and the curriculum wins 88% to 84%. They keep it for quick retraining runs.
    bridges: []
  - id: active-and-curriculum-learning.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.active-and-curriculum-learning
    markdown: Entropies to compute in bits, then contract review, product photos, a fraud model, and a curriculum claim test which examples to label and how to judge the result.
    takeaway: |-
      Active learning spends labels where the model is unsure, ranked by least confidence or entropy. Keep some labels random and the test set separate, because the model can't ask about mistakes it's confident in.
  - id: active-and-curriculum-learning.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.active-and-curriculum-learning
    markdown: |-
      Active learning chooses which examples to label; a curriculum chooses training exposure. Judge both by learning gained under a realistic budget and an independent test.
