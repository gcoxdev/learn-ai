schema_version: 0.2-draft
lesson:
  id: active-and-curriculum-learning
  version: 0.1.0-draft
  title: Choose which examples to learn from next
  state: draft
  summary: Active learning selects information to label, while curriculum and data-selection methods schedule training
    exposure; selection bias, annotation cost, and validation determine whether the strategy helps.
  slot: M31.6
  category: learning
  sources:
  - title: Active Learning Literature Survey
    url: https://burrsettles.com/pub/settles.activelearning.pdf
  - title: Curriculum Learning
    url: https://dl.acm.org/doi/10.1145/1553374.1553380
objectives:
- id: objective.active-and-curriculum-learning
  version: 1-draft
  statement: Active learning selects information to label, while curriculum and data-selection methods schedule
    training exposure; selection bias, annotation cost, and validation determine whether the strategy helps.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - active-and-curriculum-learning.base
  - active-and-curriculum-learning.transfer
  prerequisites:
  - anyOf:
    - objective.continual-and-online-learning
  - anyOf:
    - objective.training-data-mixtures
scenes:
- id: active-and-curriculum-learning.s1
  title: Ask for informative labels
  type: explanation
  depth: intuition
  objective_refs:
  - objective.active-and-curriculum-learning
  markdown: An active learner chooses examples for an annotator or oracle under a budget. Uncertainty sampling targets
    ambiguous cases; diversity or expected-improvement criteria ask different questions. The most uncertain example
    may be an outlier or unanswerable, so uncertainty alone need not maximize useful learning.
  text_mode: An active learner chooses examples for an annotator or oracle under a budget. Uncertainty sampling
    targets ambiguous cases; diversity or expected-improvement criteria ask different questions. The most uncertain
    example may be an outlier or unanswerable, so uncertainty alone need not maximize useful learning.
  bridges: []
- id: active-and-curriculum-learning.s2
  title: Schedule a learning curriculum
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.active-and-curriculum-learning
  markdown: A curriculum can start with simpler cases and increase difficulty, or adapt sampling to current performance.
    Difficulty may depend on the learner rather than one fixed human ordering. Compare to shuffled or uniform sampling
    under the same data and compute budget.
  text_mode: A curriculum can start with simpler cases and increase difficulty, or adapt sampling to current performance.
    Difficulty may depend on the learner rather than one fixed human ordering. Compare to shuffled or uniform sampling
    under the same data and compute budget.
  bridges: []
- id: active-and-curriculum-learning.s3
  title: Trace a budget choice
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.active-and-curriculum-learning
  markdown: With funds for ten labels, querying ten nearly identical uncertain examples may teach less than covering
    several distinct failure regions. Annotation quality and time differ by example. Evaluate utility per realistic
    labeling cost, not only the count of requests.
  text_mode: With funds for ten labels, querying ten nearly identical uncertain examples may teach less than covering
    several distinct failure regions. Annotation quality and time differ by example. Evaluate utility per realistic
    labeling cost, not only the count of requests.
  bridges: []
- id: active-and-curriculum-learning.s4
  title: Preserve independent evaluation
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.active-and-curriculum-learning
  markdown: Selected training examples are not a representative test sample. Keep a separate evaluation distribution
    and record the selection policy. Feedback loops can overemphasize what the model already recognizes as uncertain
    while missing confident errors or underserved domains.
  text_mode: Selected training examples are not a representative test sample. Keep a separate evaluation distribution
    and record the selection policy. Feedback loops can overemphasize what the model already recognizes as uncertain
    while missing confident errors or underserved domains.
  bridges: []
- id: active-and-curriculum-learning.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.active-and-curriculum-learning
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Active learning selects information to label, while curriculum and data-selection methods schedule training
    exposure; selection bias, annotation cost, and validation determine whether the strategy helps.
- id: active-and-curriculum-learning.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.active-and-curriculum-learning
  markdown: Active learning selects information to label, while curriculum and data-selection methods schedule training
    exposure; selection bias, annotation cost, and validation determine whether the strategy helps.
  text_mode: Active learning selects information to label, while curriculum and data-selection methods schedule
    training exposure; selection bias, annotation cost, and validation determine whether the strategy helps.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - active-and-curriculum-learning.s1
    - active-and-curriculum-learning.s2
    - active-and-curriculum-learning.s3
    - active-and-curriculum-learning.s4
    - active-and-curriculum-learning.check
    gate_refs:
    - gate.core
  scene_aliases:
