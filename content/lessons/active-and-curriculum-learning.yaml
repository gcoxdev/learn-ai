assessment_families:
  - id: active-and-curriculum-learning.base
    objective_ref: objective.active-and-curriculum-learning
    task: base
    response_type: single_choice
    points: 1
    hint: 'Schedule a learning curriculum: trace the inputs, operation, and result before choosing.'
    remediation_scene: active-and-curriculum-learning.s2
    variants:
      - id: active-and-curriculum-learning.base.1
        prompt: What does active learning select?
        options:
          - id: c
            text: Every test answer automatically
          - id: a
            text: Examples or queries whose labels should be acquired
          - id: b
            text: Only final output tokens
        answer: a
        feedback: It allocates an information-acquisition budget.
        retired: true
      - id: active-and-curriculum-learning.base.2
        prompt: Must the most uncertain example be the most useful label?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if confidence is numeric
        answer: a
        feedback: Uncertainty can reflect noise, redundancy, or unanswerability.
        retired: true
  - id: active-and-curriculum-learning.transfer
    objective_ref: objective.active-and-curriculum-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Preserve independent evaluation: trace the inputs, operation, and result before choosing.'
    remediation_scene: active-and-curriculum-learning.s4
    variants:
      - id: active-and-curriculum-learning.transfer.1
        prompt: Why compare a curriculum with shuffled training?
        options:
          - id: a
            text: To test whether ordering helps at the same budget
          - id: b
            text: To guarantee every sequence is equivalent
          - id: c
            text: Only to change file order
        answer: a
        feedback: A baseline isolates the value of scheduling.
        retired: true
      - id: active-and-curriculum-learning.transfer.2
        prompt: Can actively selected examples serve as an unbiased test sample automatically?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if labels are accurate
          - id: a
            text: 'No'
        answer: a
        feedback: Selection changes the observed distribution.
        retired: true
  - id: active-and-curriculum-learning.base.v2
    objective_ref: objective.active-and-curriculum-learning
    task: base
    response_type: single_choice
    points: 1
    hint: Least confidence looks only at the top probability; entropy looks at the whole spread. And remember who chose the labeled examples.
    remediation_scene: active-and-curriculum-learning.s3
    variants:
      - id: active-and-curriculum-learning.base.v2.1
        prompt: "A model gives three images these class probabilities: A (0.80, 0.15, 0.05), B (0.45, 0.35, 0.20), C (0.60, 0.39, 0.01). Which does least-confidence sampling query first?"
        options:
          - id: b
            text: C, because its top two classes are the closest together
          - id: a
            text: B, because its top probability, 0.45, is the lowest
          - id: c
            text: A, because it has the largest gap between top and second class
        answer: a
        feedback: Least confidence is 1 − max p, which is 0.55 for B, 0.40 for C, and 0.20 for A. The closest top-two gap is a different score (margin sampling), and a large gap means the model is sure.
      - id: active-and-curriculum-learning.base.v2.2
        prompt: "Image X has probabilities (0.50, 0.50, 0.00) and image Y (0.55, 0.225, 0.225). Least confidence prefers X. Why does entropy prefer Y?"
        options:
          - id: a
            text: Y's doubt is spread over two alternatives, while X has ruled one class out
          - id: c
            text: Entropy favors whichever image has the higher top probability
          - id: b
            text: Entropy is driven by the smallest probability, not the top class
        answer: a
        feedback: Entropy counts the whole distribution, so Y's spread gives 1.443 bits against X's 1.000. It doesn't always favor a higher top class (G4 in the lesson is highest on both scores), and it uses every probability, not mainly the smallest.
      - id: active-and-curriculum-learning.base.v2.3
        prompt: After active learning, a team reports its accuracy on the 500 images the model chose for labeling. Why is that a poor estimate of real accuracy?
        options:
          - id: b
            text: 500 images are too few to estimate accuracy within a few points
          - id: c
            text: The astronomer labeled them, and expert labels are often noisy
          - id: a
            text: The model chose them for being hard, so they don't represent real data
        answer: a
        feedback: The queried set is selected by uncertainty, so it's skewed toward hard, boundary cases. A separate random test set is needed. Five hundred random images would be a fine test set; it's the selection, not the size, that biases this one.
      - id: active-and-curriculum-learning.base.v2.4
        prompt: An early model is 95% sure that edge-on spirals are ellipticals. How does uncertainty sampling handle these images?
        options:
          - id: a
            text: It rarely queries them, because the model isn't uncertain about them
          - id: b
            text: It queries them first, because they are wrong and so have high loss
          - id: c
            text: It queries them once the other classes have enough labels
        answer: a
        feedback: Uncertainty sampling ranks by the model's own confidence, and it can't know it's wrong without a label. That's the sampling-bias trap; spending part of the budget on random images is the usual fix. Loss can't be computed on unlabeled images.
      - id: active-and-curriculum-learning.base.v2.5
        prompt: How does a curriculum differ from active learning?
        options:
          - id: c
            text: A curriculum picks which examples to label; active learning orders them
          - id: a
            text: A curriculum orders labeled examples for training; active learning picks what to label
          - id: b
            text: A curriculum trains on easy examples only and drops the hard ones
        answer: a
        feedback: Active learning spends a labeling budget; a curriculum schedules training on data you already have, usually easy to hard. Hard examples join later rather than being dropped.
  - id: active-and-curriculum-learning.transfer.v2
    objective_ref: objective.active-and-curriculum-learning
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what the chosen examples will miss (confident errors, duplicates, junk) and whether the comparison was fair (a random test set, equal training budgets).
    remediation_scene: active-and-curriculum-learning.s4
    variants:
      - id: active-and-curriculum-learning.transfer.v2.1
        prompt: A law firm has a million contracts and can pay lawyers to label 2,000 as risky or safe. Which plan makes the best use of the budget?
        options:
          - id: b
            text: Label 2,000 random contracts and train once, since selection adds bias
          - id: a
            text: Query uncertain contracts in rounds, plus a random share and a random test set
          - id: c
            text: Label the 2,000 contracts the first model is most confident are risky
        answer: a
        feedback: Uncertainty rounds spend labels where they move the model; a random share guards against confident errors, and a random test set gives an honest score. All-random labeling wastes budget on easy cases, and confident predictions teach the model little.
      - id: active-and-curriculum-learning.transfer.v2.2
        prompt: A product-photo classifier's most uncertain images turn out to be blank, corrupted, or mostly cropped out, and annotators can't label them. What should the team change?
        options:
          - id: a
            text: Filter out junk, or weight uncertainty by how typical each image is
          - id: b
            text: Switch from least confidence to entropy, which scores junk lower
          - id: c
            text: Label them anyway, since maximum uncertainty means maximum value
        answer: a
        feedback: Outliers can be maximally uncertain yet teach nothing. Filtering them or preferring uncertain images that resemble real data fixes that. Switching to entropy doesn't help, because a blank image with near-equal probabilities scores high on both.
      - id: active-and-curriculum-learning.transfer.v2.3
        prompt: A batch of the 50 most uncertain product photos turns out to be 50 shots of the same unusual lamp. What is the better batch strategy?
        options:
          - id: c
            text: Label the whole batch, since a hard product deserves extra labels
          - id: b
            text: Label just the single most uncertain photo in each round
          - id: a
            text: Choose a batch that is both uncertain and varied across products
        answer: a
        feedback: Near-duplicates teach nearly the same thing, so most of those labels are wasted. A diverse uncertain batch spreads the budget. One label per round works but makes the loop very slow.
      - id: active-and-curriculum-learning.transfer.v2.4
        prompt: A team reports that its easy-to-hard curriculum beats random order, 93% to 90%. The curriculum run trained for three times as many steps. What should they do next?
        options:
          - id: a
            text: Rerun both at the same number of steps, with several seeds each
          - id: b
            text: Report the gain, since both runs used exactly the same data
          - id: c
            text: Try hard-to-easy ordering, since the gain shows that order matters
        answer: a
        feedback: Three times the training could explain the gain on its own, so the comparison needs equal budgets and seed variation. Same data isn't enough; everything else must match too.
      - id: active-and-curriculum-learning.transfer.v2.5
        prompt: A fraud model uses active learning. A new scam is scored "legitimate, 0.97" and never reaches the review team. What would catch it?
        options:
          - id: b
            text: Lowering the threshold so that more uncertain cases are reviewed
          - id: a
            text: Reviewing a random sample of transactions, including confident ones
          - id: c
            text: Retraining more often on the transactions already sent for review
        answer: a
        feedback: A confident error is invisible to any uncertainty-based rule, however the threshold is set. Only a random audit can surface it. Retraining on reviewed cases reinforces the same blind spot.
  - id: active-and-curriculum-learning.calculate
    objective_ref: objective.active-and-curriculum-learning
    task: base
    response_type: numeric
    points: 1
    hint: Entropy in bits is the sum of −p × log₂ p over the classes. log₂ 0.5 = −1 and log₂ 0.25 = −2; a class with probability 0 adds nothing.
    remediation_scene: active-and-curriculum-learning.s3
    absolute_tolerance: 0.01
    variants:
      - id: active-and-curriculum-learning.calculate.1
        prompt: A model gives probabilities (0.5, 0.5) for two classes. What is the entropy, in bits?
        answer: 1
        feedback: −(0.5 × −1 + 0.5 × −1) = 1 bit, the maximum for two classes.
      - id: active-and-curriculum-learning.calculate.2
        prompt: A model spreads its prediction evenly over four classes, 0.25 each. What is the entropy, in bits?
        answer: 2
        feedback: Each class adds −0.25 × log₂ 0.25 = 0.25 × 2 = 0.5, and four of them give 2 bits, the maximum for four classes.
      - id: active-and-curriculum-learning.calculate.3
        prompt: A model gives probabilities (0.5, 0.25, 0.25). What is the entropy, in bits?
        answer: 1.5
        feedback: 0.5 × 1 + 0.25 × 2 + 0.25 × 2 = 0.5 + 0.5 + 0.5 = 1.5 bits.
      - id: active-and-curriculum-learning.calculate.4
        prompt: A model gives probabilities (0.9, 0.1). What is the entropy, in bits? (log₂ 0.9 ≈ −0.152, log₂ 0.1 ≈ −3.322; answer to two decimals.)
        answer: 0.47
        feedback: 0.9 × 0.152 + 0.1 × 3.322 = 0.137 + 0.332 ≈ 0.47 bits. A confident prediction has low entropy.
      - id: active-and-curriculum-learning.calculate.5
        prompt: A model gives probabilities (0.8, 0.1, 0.1). What is the entropy, in bits? (log₂ 0.8 ≈ −0.322, log₂ 0.1 ≈ −3.322; answer to two decimals.)
        answer: 0.92
        feedback: 0.8 × 0.322 + 2 × 0.1 × 3.322 = 0.258 + 0.664 ≈ 0.92 bits.
