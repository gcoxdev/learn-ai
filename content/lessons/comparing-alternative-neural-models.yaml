schema_version: 0.2-draft
lesson:
  id: comparing-alternative-neural-models
  version: 0.4.0-draft
  title: Compare learning rules, state dynamics, and hardware evidence
  state: draft
  summary: Hebbian rules, Hopfield nets, spikes, reservoirs, neural ODEs. Which ones quietly power today's systems, which are mostly for understanding brains, and how can you tell a real energy win from a sales pitch?
  slot: M37.8
  category: learning
  sources:
    - title: "The Hardware Lottery (Hooker, 2020)"
      url: https://arxiv.org/abs/2009.06489
    - title: "Surrogate Gradient Learning in Spiking Neural Networks (Neftci, Mostafa & Zenke, 2019)"
      url: https://arxiv.org/abs/1901.09948
    - title: Neural Ordinary Differential Equations
      url: https://arxiv.org/abs/1806.07366
    - title: Neuronal Dynamics
      url: https://neuronaldynamics.epfl.ch/online/
objectives:
  - id: objective.comparing-alternative-neural-models
    version: 2-draft
    statement: Alternative neural models should be compared by the state they update, learning signals they require, tasks they solve, and measured system costs; biological analogy and architectural novelty are separate from demonstrated advantage.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - comparing-alternative-neural-models.base.v2
      - comparing-alternative-neural-models.transfer.v2
      - comparing-alternative-neural-models.calculate
    prerequisites:
      - anyOf:
          - objective.spike-timing-and-surrogate-gradients
      - anyOf:
          - objective.reservoir-computing
      - anyOf:
          - objective.neural-ordinary-differential-equations
      - anyOf:
          - objective.associative-memory-and-boltzmann-models
      - anyOf:
          - objective.sparse-coding-and-self-organizing-maps
scenes:
  - id: comparing-alternative-neural-models.s1
    title: Three questions for any model
    type: explanation
    depth: intuition
    objective_refs:
      - objective.comparing-alternative-neural-models
    markdown: |-
      A startup pitches you a "brain-inspired" chip: spiking neurons, on-chip learning, "a thousand times more efficient than a GPU." Should you believe it? After this module you can ask the three questions that sort out any neural model, alternative or mainstream:

      1. **What changes when it runs, and what changes when it learns?** Hopfield recall and reservoir dynamics change *states* with fixed weights. Hebbian rules, STDP, ridge readouts, and backpropagation change *weights*.
      2. **What signal teaches it?** A **local** rule uses only what's present at the connection (Oja, STDP). A **global** rule sends a task error through the whole network (backpropagation, surrogate gradients). A reservoir's readout sits in between: a global fit of one layer.
      3. **What hardware does it want?** Dense matrix multiplies suit GPUs. Sparse, event-driven spikes suit neuromorphic chips. A single linear solve suits a microcontroller. A solver with adaptive steps suits anything, at a cost that varies input by input.

      Keep these separate. "Spiking" describes how neurons signal, not how they learn: the same spiking network can be trained with STDP or with surrogate gradients. And "neural ODE" describes how depth works, not what the network computes.
    bridges: []
  - id: comparing-alternative-neural-models.s2
    title: The whole module on one page
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.comparing-alternative-neural-models
    markdown: |-
      | Model | Learning rule | Local? | Hardware fit | Used today | What it teaches |
      | --- | --- | --- | --- | --- | --- |
      | Hebb / Oja | $\Delta w = \eta y(x - yw)$ | Yes | Any; suits on-chip learning | Neuroscience models; streaming PCA | Local rules need a stabilizer |
      | Hopfield network | Outer products $w_{ij} = \sum p_i p_j$ | Yes | Analog and physics-based hardware research | Mostly teaching; capacity only 0.14 N | Recall as sliding downhill in energy |
      | Modern Hopfield | Gradient descent, inside larger networks | No | GPUs | A lens on attention; some research layers | Attention is one retrieval step |
      | Boltzmann machine, RBM | Contrastive divergence | Nearly | GPUs | Largely replaced by VAEs and diffusion | Learning a distribution by matching correlations |
      | Sparse coding | Sparse inference plus dictionary update | Nearly | GPUs | Sparse autoencoders for interpreting LLMs; denoising | Overcomplete dictionaries with few active atoms |
      | Self-organizing map | Winner and neighbors move toward input | Yes | Any | Niche exploration and visualization | Shrinking neighborhoods sort a map |
      | Spiking net + STDP | Spike-timing window | Yes | Neuromorphic chips | Research; adaptive sensors | Timing can carry and shape information |
      | Spiking net + surrogate gradients | Backprop through time with a smooth stand-in | No | Train on GPU, run on neuromorphic chips | Low-power event-based sensing, growing | How to backpropagate through a step |
      | Echo state network | Ridge regression on the readout only | Readout only | Microcontrollers, physical systems | Small chaotic time series; physical computing | Random dynamics plus a linear fit go far |
      | Neural ODE, CNF | Backprop or the adjoint through a solver | No | GPUs | Irregular time series; ODE-based generators via flow matching | Depth as time; solvers as a design choice |

      Two patterns stand out. First, every *local* rule needed a fix to become useful: Oja's forgetting term, a Boltzmann machine's free-running phase, a third factor for reward. Second, the ideas with the biggest practical footprint today, sparse dictionaries and ODE-based generation, arrived there by being trained with ordinary gradients on GPUs.
  - id: comparing-alternative-neural-models.s3
    title: Count the operations before believing the energy claim
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.comparing-alternative-neural-models
    markdown: |-
      Back to the startup's chip. A standard dense layer with 1,000 inputs and 1,000 outputs does $1{,}000 \times 1{,}000 = 1{,}000{,}000$ multiply-adds per input. A spiking version does work only when a neuron spikes: each input spike adds one weight into each of the 1,000 outputs. But it runs for $T$ time steps, and each input neuron spikes on some fraction $p$ of them. So it does $p \times 10^6 \times T$ additions.

      With $T = 20$ steps and $p = 0.05$, that's exactly $10^6$ additions, the same count as the dense layer. The spiking version wins only because an addition is cheaper than a multiply-add, and only if spikes stay rare. The program assumes an addition costs a fifth of a multiply-add, a setting you can change:

      ```python run
      n_in, n_out = 1000, 1000              # one fully connected layer
      dense_macs = n_in * n_out             # multiply-adds for one pass of a standard network
      ac_cost = 0.2                         # assumed cost of one add, relative to one multiply-add

      print(f"standard layer: {dense_macs:,} multiply-adds per input")
      print(" time steps  firing rate   spike-driven adds   relative arithmetic cost")
      for T in (10, 20, 50):                # how many time steps the spiking network runs
          for p in (0.01, 0.05, 0.2):       # chance each input neuron spikes per step
              adds = p * n_in * n_out * T   # each spike adds one weight into every output
              cost = adds * ac_cost / dense_macs
              print(f"{T:10d}  {p:11.2f}   {adds:17,.0f}   {cost:22.2f}")
      ```

      :::predict At 50 time steps and a firing rate of 0.2, is the spiking layer cheaper?
      No. It does 10 million additions, and even at a fifth of the cost each, that's 2.00 times the dense layer's arithmetic. The spiking layer breaks even when $p \times T \times 0.2 = 1$, so with 50 steps the firing rate must stay below 0.1.
      :::

      This counts arithmetic only. Real chips also spend energy moving weights and spikes through memory, often more than on arithmetic, which is why module 34's lesson on neuromorphic applications insists on measuring the whole system at the same accuracy and latency.
  - id: comparing-alternative-neural-models.s4
    title: Which ideas have practical wins?
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.comparing-alternative-neural-models
    markdown: |-
      Sorted honestly:

      - **Clear wins today.** Sparse dictionaries, as sparse autoencoders, are a main tool for looking inside language models (module 28). ODE thinking runs every flow-matching image generator. Reservoirs are a quick, strong baseline for small chaotic time series and the natural way to compute with physical systems.
      - **Real but narrow.** Spiking networks trained with surrogate gradients on chips such as Intel's Loihi can save power on sparse, event-driven inputs like event cameras and keyword spotting. The advantage shrinks when inputs are dense.
      - **Mainly for understanding.** Classic Hopfield networks, Boltzmann machines, SOMs, and pure Hebbian or STDP learning rarely beat standard methods on engineering tasks. They explain how brains might store memories, learn without labels, and form maps, and they seeded ideas that later won: the 2024 Nobel Prize in Physics went to Hopfield and Hinton for exactly this lineage.

      :::mixup "Brain-inspired means more efficient, because the brain runs on about 20 watts."
      The brain's efficiency comes from its whole physical design, not from any one abstraction. A spiking network simulated on a GPU is usually *less* efficient than a standard one. Efficiency is a measurement on specific hardware, at matched accuracy.
      :::

      :::story The hardware lottery
      In 2020 Sara Hooker argued that research ideas often win because they suit the hardware of their day, not only because they're better. Backpropagation with dense matrix multiplies happened to fit GPUs, which were built for graphics. Ideas that want different hardware, like spikes and local learning, have had to wait for chips such as IBM's TrueNorth (2014) and Intel's Loihi (2018) to be tested fairly.
      :::

      So when the startup pitches its chip, ask for three numbers on your task, accuracy, latency, and energy per inference, for their chip and for a well-tuned GPU or mobile baseline.
  - id: comparing-alternative-neural-models.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.comparing-alternative-neural-models
    markdown: Spike-count arithmetic, plus a drone camera, a chaotic laser, a model-interpretability team, and a chip vendor's claim, test whether you can pick the right model and question an efficiency result.
    takeaway: |-
      Compare neural models by what changes during running and learning, what signal teaches them, and what hardware they suit. Some alternatives have clear practical wins today; others mainly explain brains. Energy claims need measurements on the whole system at matched accuracy.
  - id: comparing-alternative-neural-models.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.comparing-alternative-neural-models
    markdown: |-
      Compare what each model changes, what information teaches it, and which task it solves. Measure the full computation before inferring a benefit from biological inspiration or novelty.
