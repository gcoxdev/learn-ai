schema_version: 0.2-draft
lesson:
  id: comparing-alternative-neural-models
  version: 0.3.0-draft
  title: Compare learning rules, state dynamics, and hardware evidence
  state: draft
  summary: Compare alternative neural models by what changes, what teaches them, and what they can do.
  slot: M37.8
  category: learning
  sources:
  - title: Neuronal Dynamics
    url: https://neuronaldynamics.epfl.ch/online/
  - title: Neural Ordinary Differential Equations
    url: https://arxiv.org/abs/1806.07366
  - title: The Hardware Lottery
    url: https://arxiv.org/abs/2009.06489
objectives:
- id: objective.comparing-alternative-neural-models
  version: 1-draft
  statement: Alternative neural models should be compared by the state they update, learning signals they require,
    tasks they solve, and measured system costs; biological analogy and architectural novelty are separate
    from demonstrated advantage.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - comparing-alternative-neural-models.base
  - comparing-alternative-neural-models.transfer
  prerequisites:
  - anyOf:
    - objective.spike-timing-and-surrogate-gradients
  - anyOf:
    - objective.reservoir-computing
  - anyOf:
    - objective.neural-ordinary-differential-equations
  - anyOf:
    - objective.associative-memory-and-boltzmann-models
  - anyOf:
    - objective.sparse-coding-and-self-organizing-maps
scenes:
- id: comparing-alternative-neural-models.s1
  title: Separate state dynamics from parameter learning
  type: explanation
  depth: intuition
  objective_refs:
  - objective.comparing-alternative-neural-models
  markdown: Hopfield recall updates states, Hebbian learning updates connections, reservoir readouts learn
    from fixed internal dynamics, and neural ODEs learn a vector field. Spiking describes signaling and state
    evolution, while STDP or surrogate gradients describe possible learning rules. These categories can overlap
    without being interchangeable.
  text_mode: Hopfield recall updates states, Hebbian learning updates connections, reservoir readouts learn
    from fixed internal dynamics, and neural ODEs learn a vector field. Spiking describes signaling and state
    evolution, while STDP or surrogate gradients describe possible learning rules. These categories can overlap
    without being interchangeable.
  bridges: []
- id: comparing-alternative-neural-models.s2
  title: Match the task and information access
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.comparing-alternative-neural-models
  markdown: Associative recall, temporal sensing, scientific dynamics, and supervised classification reward
    different capabilities. Compare the same input information, training labels, memory, and evaluation splits.
    A local learning rule receiving fewer global signals solves a different constraint problem from unrestricted
    backpropagation.
  text_mode: Associative recall, temporal sensing, scientific dynamics, and supervised classification reward
    different capabilities. Compare the same input information, training labels, memory, and evaluation splits.
    A local learning rule receiving fewer global signals solves a different constraint problem from unrestricted
    backpropagation.
  bridges: []
- id: comparing-alternative-neural-models.s3
  title: Measure the complete hardware path
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.comparing-alternative-neural-models
  markdown: Count encoding, state storage, communication, solver evaluations, and output decoding. A specialized
    chip’s energy advantage must be tested at comparable accuracy and latency. Simulated biological detail
    can be expensive even when the biological system itself is energy efficient.
  text_mode: Count encoding, state storage, communication, solver evaluations, and output decoding. A specialized
    chip’s energy advantage must be tested at comparable accuracy and latency. Simulated biological detail
    can be expensive even when the biological system itself is energy efficient.
  bridges: []
- id: comparing-alternative-neural-models.s4
  title: Write a defensible conclusion
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.comparing-alternative-neural-models
  markdown: Identify where a method succeeds, where it fails, which assumptions matter, and what further evidence
    would change the choice. Use mechanism-level explanations instead of a ladder from primitive to advanced.
    AI research contains multiple useful traditions whose strengths depend on the problem and available resources.
  text_mode: Identify where a method succeeds, where it fails, which assumptions matter, and what further evidence
    would change the choice. Use mechanism-level explanations instead of a ladder from primitive to advanced.
    AI research contains multiple useful traditions whose strengths depend on the problem and available resources.
  bridges: []
- id: comparing-alternative-neural-models.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.comparing-alternative-neural-models
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Compare what each model changes, what information teaches it, and which task it solves. Measure
    the full computation before inferring a benefit from biological inspiration or novelty.
- id: comparing-alternative-neural-models.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.comparing-alternative-neural-models
  markdown: Compare what each model changes, what information teaches it, and which task it solves. Measure
