assessment_families:
  - id: comparing-alternative-neural-models.base
    objective_ref: objective.comparing-alternative-neural-models
    task: base
    response_type: single_choice
    points: 1
    hint: 'Match the task and information access: trace the inputs, operation, and result before choosing.'
    remediation_scene: comparing-alternative-neural-models.s2
    variants:
      - id: comparing-alternative-neural-models.base.1
        prompt: Is spiking itself a unique learning rule?
        options:
          - id: a
            text: No; several learning methods can train spiking systems
          - id: b
            text: 'Yes'
          - id: c
            text: Only if spikes are discrete
        answer: a
        feedback: Signaling dynamics and parameter updates are different dimensions.
        retired: true
      - id: comparing-alternative-neural-models.base.2
        prompt: Why distinguish state updates from weight updates?
        options:
          - id: b
            text: Only terminology differs
          - id: c
            text: Every update is backpropagation
          - id: a
            text: Inference dynamics and learning change different parts of the system
        answer: a
        feedback: The distinction explains what the system retains and adapts.
        retired: true
  - id: comparing-alternative-neural-models.transfer
    objective_ref: objective.comparing-alternative-neural-models
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Write a defensible conclusion: trace the inputs, operation, and result before choosing.'
    remediation_scene: comparing-alternative-neural-models.s4
    variants:
      - id: comparing-alternative-neural-models.transfer.1
        prompt: What is needed for a meaningful energy comparison?
        options:
          - id: b
            text: Only energy per isolated neuron operation
          - id: c
            text: Only a biological analogy
          - id: a
            text: Matched useful quality and latency with full system boundaries
        answer: a
        feedback: End-to-end conditions determine practical efficiency.
        retired: true
      - id: comparing-alternative-neural-models.transfer.2
        prompt: What conclusion fits a successful narrow experiment?
        options:
          - id: c
            text: All other traditions are obsolete
          - id: a
            text: The method helped under the tested task and assumptions
          - id: b
            text: It is the final universal AI architecture
        answer: a
        feedback: Evidence supports scoped advantages and further questions.
        retired: true
  - id: comparing-alternative-neural-models.base.v2
    objective_ref: objective.comparing-alternative-neural-models
    task: base
    response_type: single_choice
    points: 1
    hint: "Ask the three questions in order: what changes when it runs versus when it learns, whether the teaching signal is local or global, and what hardware it suits."
    remediation_scene: comparing-alternative-neural-models.s1
    variants:
      - id: comparing-alternative-neural-models.base.v2.1
        prompt: A Hopfield network recalls a smudged letter, and an echo state network processes a new time series. What do the two have in common while they run?
        options:
          - id: b
            text: Both update their weights with a Hebbian rule as each input arrives
          - id: a
            text: Both change only their unit states, while their weights stay fixed
          - id: c
            text: Both send a task error backward through time to their weights
        answer: a
        feedback: Recall and reservoir dynamics are state changes under fixed weights. Weights change only when they are stored or fitted, which is a separate step.
      - id: comparing-alternative-neural-models.base.v2.2
        prompt: Someone says spiking networks can't be trained with gradients, since spiking is a local learning rule. What is wrong with this claim?
        options:
          - id: a
            text: Spiking describes how neurons signal; STDP or surrogate gradients can train them
          - id: c
            text: Spiking networks are trained with Oja's rule, which is a gradient method
          - id: b
            text: Spiking networks never learn; their weights are set by hand
        answer: a
        feedback: How neurons signal and how weights learn are separate choices. The same spiking network can learn with a local timing rule or with backpropagation using a surrogate for the step's derivative.
      - id: comparing-alternative-neural-models.base.v2.3
        prompt: Which pair of learning rules are both local, using only information available at the connection?
        options:
          - id: b
            text: Surrogate gradients and the neural ODE adjoint method
          - id: c
            text: Oja's rule and training an echo state network's readout
          - id: a
            text: Oja's rule and pair-based STDP
        answer: a
        feedback: Oja needs x, y, and w; STDP needs two spike times. Surrogate gradients and the adjoint send task errors through the network, and a ridge readout is a global fit over all states.
      - id: comparing-alternative-neural-models.base.v2.4
        prompt: A spiking layer runs 20 time steps with a firing rate of 0.05 per step. Compared with the dense version of the same layer, how many operations does it do?
        options:
          - id: c
            text: One twentieth as many, since only 5% of neurons fire
          - id: a
            text: About the same number, since 0.05 × 20 = 1
          - id: b
            text: Twenty times as many, since it runs for 20 steps
        answer: a
        feedback: Spike-driven operations scale with p × T, which is 1 here, so the count matches the dense layer. Any saving must come from cheaper additions, not fewer operations.
  - id: comparing-alternative-neural-models.transfer.v2
    objective_ref: objective.comparing-alternative-neural-models
    task: transfer
    response_type: single_choice
    points: 1
    hint: "Match the setting to the model's strength: sparse event data suits spikes, small chaotic signals suit reservoirs, irregular timing suits ODEs, and interpreting activations suits sparse dictionaries. For efficiency, demand whole-system measurements at matched accuracy."
    remediation_scene: comparing-alternative-neural-models.s4
    variants:
      - id: comparing-alternative-neural-models.transfer.v2.1
        prompt: A drone team uses an event camera that reports only pixels whose brightness changes, and they need to save battery. Which approach is most worth testing?
        options:
          - id: a
            text: A spiking network trained with surrogate gradients, run on a neuromorphic chip
          - id: b
            text: A Hopfield network storing the most common event patterns
          - id: c
            text: A self-organizing map of camera events, trained on the drone
        answer: a
        feedback: Sparse, event-driven input is where spiking hardware can save energy, and surrogate gradients give accurate training. A Hopfield network only recalls stored patterns, and a SOM organizes data rather than solving the control task.
      - id: comparing-alternative-neural-models.transfer.v2.2
        prompt: A physics lab has 3,000 measurements of a chaotic laser's intensity and wants a quick forecasting baseline this afternoon. What fits?
        options:
          - id: b
            text: A large transformer trained from scratch on the 3,000 points
          - id: c
            text: A Boltzmann machine sampling likely future intensities
          - id: a
            text: An echo state network with a ridge-regression readout
        answer: a
        feedback: Reservoirs are fast to fit, need little data, and do well on low-dimensional chaotic signals. A transformer needs far more data, and a Boltzmann machine is slow to train and aimed at generation.
      - id: comparing-alternative-neural-models.transfer.v2.3
        prompt: An interpretability team wants to find which human-readable concepts are active inside a language model's middle layer. Which idea from this module fits?
        options:
          - id: a
            text: Sparse dictionary learning, as in sparse autoencoders
          - id: b
            text: A classic Hopfield network storing each layer's activations
          - id: c
            text: STDP between the model's layers during normal use
        answer: a
        feedback: Sparse autoencoders learn many atoms, few active per input, which often line up with concepts. That's one of the clearest practical wins of this module's ideas.
      - id: comparing-alternative-neural-models.transfer.v2.4
        prompt: "A vendor reports that its spiking chip uses 100 times less energy per synaptic operation than a GPU. What would best show a real advantage on your task?"
        options:
          - id: c
            text: A count of how many neurons the chip can simulate per watt
          - id: a
            text: Energy per inference for the whole system, at the same accuracy and latency
          - id: b
            text: Evidence that the chip's neurons behave like biological ones
        answer: a
        feedback: Per-operation energy ignores how many operations run (p × T), memory traffic, and accuracy. Only whole-system measurements at matched accuracy and latency answer the question.
  - id: comparing-alternative-neural-models.calculate
    objective_ref: objective.comparing-alternative-neural-models
    task: base
    response_type: numeric
    points: 1
    hint: "Spike-driven additions = p × (inputs × outputs) × T. Relative cost = additions × (cost of an add) ÷ dense multiply-adds."
    remediation_scene: comparing-alternative-neural-models.s3
    absolute_tolerance: 0.01
    variants:
      - id: comparing-alternative-neural-models.calculate.1
        prompt: A spiking layer with 1,000 inputs and 1,000 outputs runs 10 time steps at firing rate 0.02. How many millions of additions does it do?
        answer: 0.2
        feedback: 0.02 × 1,000,000 × 10 = 200,000 additions, which is 0.2 million.
      - id: comparing-alternative-neural-models.calculate.2
        prompt: A spiking layer runs T = 25 time steps. If an addition costs a fifth of a multiply-add, below what firing rate p is it cheaper than the dense layer? (Break-even is p × T × 0.2 = 1.)
        answer: 0.2
        feedback: p = 1 / (25 × 0.2) = 0.2. Above that, the spiking layer does more arithmetic work.
      - id: comparing-alternative-neural-models.calculate.3
        prompt: A spiking layer runs 40 time steps at firing rate 0.1, and an addition costs 0.2 of a multiply-add. What is its arithmetic cost relative to the dense layer?
        answer: 0.8
        feedback: 0.1 × 40 × 0.2 = 0.8, so 80% of the dense layer's arithmetic.
      - id: comparing-alternative-neural-models.calculate.4
        prompt: A spiking layer with 500 inputs and 200 outputs runs 30 time steps at firing rate 0.05. How many thousands of additions does it do?
        answer: 150
        feedback: 0.05 × 500 × 200 × 30 = 150,000 additions, which is 150 thousand.
      - id: comparing-alternative-neural-models.calculate.5
        prompt: An addition costs 0.25 of a multiply-add and a spiking layer fires at rate 0.1. What is the largest number of time steps T at which it still breaks even with the dense layer?
        answer: 40
        feedback: Break-even is p × T × 0.25 = 1, so T = 1 / (0.1 × 0.25) = 40.
