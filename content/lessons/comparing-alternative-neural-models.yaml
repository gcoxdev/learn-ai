assessment_families:
- id: comparing-alternative-neural-models.base
  objective_ref: objective.comparing-alternative-neural-models
  task: base
  response_type: single_choice
  points: 1
  hint: 'Match the task and information access: trace the inputs, operation, and result before choosing.'
  remediation_scene: comparing-alternative-neural-models.s2
  variants:
  - id: comparing-alternative-neural-models.base.1
    prompt: Is spiking itself a unique learning rule?
    options:
    - id: a
      text: No; several learning methods can train spiking systems
    - id: b
      text: 'Yes'
    - id: c
      text: Only if spikes are discrete
    answer: a
    feedback: Signaling dynamics and parameter updates are different dimensions.
  - id: comparing-alternative-neural-models.base.2
    prompt: Why distinguish state updates from weight updates?
    options:
    - id: b
      text: Only terminology differs
    - id: c
      text: Every update is backpropagation
    - id: a
      text: Inference dynamics and learning change different parts of the system
    answer: a
    feedback: The distinction explains what the system retains and adapts.
- id: comparing-alternative-neural-models.transfer
  objective_ref: objective.comparing-alternative-neural-models
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Write a defensible conclusion: trace the inputs, operation, and result before choosing.'
  remediation_scene: comparing-alternative-neural-models.s4
  variants:
  - id: comparing-alternative-neural-models.transfer.1
    prompt: What is needed for a meaningful energy comparison?
    options:
    - id: b
      text: Only energy per isolated neuron operation
    - id: c
      text: Only a biological analogy
    - id: a
      text: Matched useful quality and latency with full system boundaries
    answer: a
    feedback: End-to-end conditions determine practical efficiency.
  - id: comparing-alternative-neural-models.transfer.2
    prompt: What conclusion fits a successful narrow experiment?
    options:
    - id: c
      text: All other traditions are obsolete
    - id: a
      text: The method helped under the tested task and assumptions
    - id: b
      text: It is the final universal AI architecture
    answer: a
    feedback: Evidence supports scoped advantages and further questions.
