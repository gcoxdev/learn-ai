schema_version: 0.2-draft
lesson:
  id: model-report-and-artifact-inventory
  version: 0.4.0-draft
  title: Read a model release as an inspectable set of artifacts
  state: draft
  summary: Llama 3.1, DeepSeek-V3, and Olmo 3 are all called "open," yet only one lets you rerun its training. Learn to read a release file by file, and turn a config into memory and compute numbers.
  slot: M35.1
  category: learning
  sources:
    - title: Model Cards
      url: https://arxiv.org/abs/1810.03993
    - title: Olmo 3 model card
      url: https://huggingface.co/allenai/Olmo-3-7B-Think
objectives:
  - id: objective.model-report-and-artifact-inventory
    version: 2-draft
    statement: A model study should inventory exact checkpoints, configurations, tokenizers, code, data, licenses, and evaluation evidence; open weights, open code, and reproducible training are different properties.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - model-report-and-artifact-inventory.base.v2
      - model-report-and-artifact-inventory.transfer.v2
      - model-report-and-artifact-inventory.calculate
    prerequisites:
      - anyOf:
          - objective.research-reporting
      - anyOf:
          - objective.production-data-and-model-artifacts
scenes:
  - id: model-report-and-artifact-inventory.s1
    title: Three "open" models, three different gifts
    type: explanation
    depth: intuition
    objective_refs:
      - objective.model-report-and-artifact-inventory
    markdown: |-
      Your team lead forwards three links: Meta's Llama 3.1 (July 2024), DeepSeek-V3 (December 2024), and Ai2's Olmo 3 (November 2025). "They're all open. Pick one we can fine-tune, ship, and, if a regulator asks, explain how it was trained."

      All three let you download weights. Only Olmo 3 also gives you the training data, the training code, and checkpoints from partway through training. The word *open* hides three separate questions: can I **run** it, can I **use** it for my purpose, and can I **rebuild** it?

      First, pin down exactly what you're studying. A family name like "Qwen3" covers eight models, each in base and post-trained versions, plus later date-suffixed updates. Write down four things:

      | Pin | Example |
      | --- | --- |
      | Model ID | `meta-llama/Llama-3.1-8B-Instruct` |
      | Revision | the repository commit hash you downloaded |
      | Report version | arXiv 2407.21783 **v3** (November 23, 2024) |
      | Date checked | the day you read the card and license |

      This module's case studies use dated reports like these as historical anchors, not as a list of the newest models.
    bridges: []
  - id: model-report-and-artifact-inventory.s2
    title: One row per artifact
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.model-report-and-artifact-inventory
    markdown: |-
      A release is a bundle of separate files, and each can be present or missing on its own. A **checkpoint** is a saved set of weights from one point in training. The **config** (usually `config.json`) lists the shapes: layers, width, heads, vocabulary. The **tokenizer** turns text into token IDs, and the **chat template** wraps messages in the role markers the model was trained on.

      Here is the inventory for the three links, from their official cards, repositories, and reports:

      | Artifact | Llama 3.1 8B | DeepSeek-V3 | Olmo 3 7B |
      | --- | --- | --- | --- |
      | Final weights | Yes | Yes (FP8 only) | Yes |
      | Config, tokenizer, template | Yes | Yes | Yes |
      | Inference code | Yes | Yes (demo + engines) | Yes |
      | Training code | No | No full pipeline | Yes (OLMo-core, Open Instruct) |
      | Training data | Described ("~15T tokens") | Described (14.8T tokens) | Yes (Dolma 3, Dolci) |
      | Intermediate checkpoints | No | No | Yes, every stage |
      | Weights license | Llama 3.1 Community License | DeepSeek License Agreement | Apache 2.0 |

      Llama 3.1 and DeepSeek-V3 are **open-weight**: you can run and fine-tune them. Olmo 3 is **fully open**: with enough GPUs, you could rerun its training.

      :::mixup "Open weights means open source, so I can reproduce the model."
      Weights are the *output* of training. Reproducing it needs the inputs too: data, code, and recipe. A final checkpoint shows behavior, not which documents shaped it.
      :::
    bridges: []
  - id: model-report-and-artifact-inventory.s3
    title: Licenses attach to files, not families
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.model-report-and-artifact-inventory
    markdown: |-
      Each file can carry its own terms. DeepSeek-V3's code is under the MIT license; its weights are under a separate DeepSeek License Agreement.

      Terms also travel down a lineage. The DeepSeek-R1 repository puts its own code and weights under MIT, but notes that its distilled students were built on Qwen2.5 bases (originally Apache 2.0) and Llama 3.1 and 3.3 bases (originally under Meta's Llama licenses). A fine-tune you download may carry conditions from the model it started from.

      So give the license column one entry, with a link, for each artifact you'll actually use: the base weights, any adapter, the dataset if you retrain, and the code you run. Flag anything unclear for whoever reviews licensing on your team.
    bridges: []
  - id: model-report-and-artifact-inventory.sheet
    title: Turn a config into memory and compute
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.model-report-and-artifact-inventory
    markdown: |-
      A config file is enough to estimate three numbers that every deployment and budget depends on. Each formula comes from an earlier module.

      :::papers Three numbers from a config
      $$\text{weight bytes} = N \times b \qquad \text{KV bytes per token} = 2 \cdot L \cdot n_{kv} \cdot d_h \cdot b \qquad C \approx 6ND$$

      $N$ is the parameter count and $b$ the bytes per number (2 for bf16, 1 for FP8, 0.5 for int4). The cache stores a key and a value (the 2) for each of $L$ layers, $n_{kv}$ key/value heads, and head width $d_h$, as in the lesson on shared and latent KV caches. $C$ is training compute in FLOPs for $D$ training tokens, from the pretraining budget lesson.
      :::

      For Llama 3.1 8B the config gives 32 layers, width 4,096, 32 query heads, 8 KV heads of width 128, and a 128,256-entry vocabulary. That adds up to 8.03 billion parameters, so the bf16 weights take 16.1 GB. Each token adds 2 × 32 × 8 × 128 × 2 = 131,072 bytes (128 KiB) of cache. The model card reports roughly 15T pretraining tokens, so 6ND ≈ 7.2 × 10²³ FLOPs.

      ```python run
      # A one-page model sheet from config.json fields (Llama 3.1 8B)
      cfg = dict(vocab=128256, d=4096, layers=32, ffn=14336,
                 heads=32, kv_heads=8, head_dim=128, tied=False)
      L, d, hd = cfg["layers"], cfg["d"], cfg["head_dim"]

      attn = 2 * d * cfg["heads"] * hd + 2 * d * cfg["kv_heads"] * hd  # Q, O + K, V
      mlp = 3 * d * cfg["ffn"]                                         # gate, up, down
      emb = cfg["vocab"] * d * (1 if cfg["tied"] else 2)               # input table + output head
      N = L * (attn + mlp) + emb
      print(f"parameters:       {N / 1e9:.2f} B")

      for name, nbytes in [("bf16", 2), ("fp8", 1), ("int4", 0.5)]:
          print(f"weights at {name:4s}:  {N * nbytes / 1e9:6.1f} GB")

      kv = 2 * L * cfg["kv_heads"] * hd * 2                            # K and V, 2 bytes each
      print(f"KV per token:     {kv / 1024:.0f} KiB  (8,192 tokens: {kv * 8192 / 2**30:.1f} GiB)")

      D = 15e12                                                        # training tokens
      print(f"6ND compute:      {6 * N * D:.2e} FLOPs")
      ```

      Now load Qwen3-32B: `vocab=151936, d=5120, layers=64, ffn=25600, heads=64, kv_heads=8, head_dim=128` and `D = 36e12`. You should get 32.76 B parameters (the card says 32.8B), 65.5 GB at bf16, and 256 KiB per token.

      :::mixup "Head width is always the model width divided by the number of heads."
      Often, not always. For Qwen3-32B, 5,120 ÷ 64 = 80, but its config sets `head_dim` to 128. Read the field; don't derive it.
      :::

      :::predict DeepSeek-V3 has 671B parameters, yet its README says the Hugging Face files hold 685B. Where do the other 14B come from?
      From the multi-token prediction (MTP) weights: an extra layer, trained to predict one more token ahead, that ships with the main model (the DeepSeek-V3 lesson explains it). The report counts the main model; the download counts every file. Counts differ elsewhere too: Qwen3's report gives 151,669 vocabulary tokens, while its config allocates 151,936 embedding rows, some of them padding. Trust the config for memory, and the report for intent.
      :::
    bridges: []
  - id: model-report-and-artifact-inventory.s4
    title: Label every claim by where it came from
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.model-report-and-artifact-inventory
    markdown: |-
      Your last step is an evidence table: one row per claim, with a label and a source. Four labels cover almost everything:

      - **Documented**: a primary source (report, card, config) states it.
      - **Computed**: you derived it from documented numbers.
      - **Inferred**: a reasoned guess from indirect evidence.
      - **Unknown**: nothing public settles it.

      Here's a mini-case for DeepSeek-V3:

      | Claim | Label | Source |
      | --- | --- | --- |
      | 671B total, 37B active per token | Documented | Report §4.2 |
      | About 1.34 TB of weights at bf16 | Computed | 671B × 2 bytes |
      | Needs several GPUs to serve at full precision | Computed | 1.34 TB vs 80 GB per GPU |
      | Cheaper per token to run than Llama 3.1 405B | Inferred | 37B vs 405B active; depends on the serving setup |
      | Exact documents in the 14.8T tokens | Unknown | Not released |

      Benchmark scores can support an inference, but they can't reveal an undisclosed expert count or corpus. The diagram shows the reading order the rest of this module follows.
    diagram:
      caption: Reading a model release, in order. Each box feeds the evidence table.
      description: Pinning the model ID, revision, and report version comes first. That feeds the artifact inventory, which records weights, code, data, and licenses. The inventory's config file feeds the model sheet, where weights, KV cache per token, and 6ND are computed. The model sheet and the report's own claims both feed a comparison step, where computed numbers are checked against reported ones. That comparison feeds the evidence table, which labels each claim documented, computed, inferred, or unknown.
      nodes:
        - id: pin
          label: Pin the release
          note: model ID, revision, report version
          col: 0
          row: 0
          tone: accent
        - id: inventory
          label: Inventory artifacts
          note: weights, code, data, licenses
          col: 1
          row: 0
        - id: sheet
          label: Model sheet
          note: weights, KV per token, 6ND
          col: 2
          row: 0
          tone: data
        - id: report
          label: Report's own claims
          note: sizes, tokens, GPU-hours
          col: 2
          row: 1
          tone: muted
        - id: compare
          label: Compare computed vs reported
          col: 3
          row: 0
        - id: table
          label: Evidence table
          note: documented / computed / inferred / unknown
          col: 4
          row: 0
          tone: warn
      edges:
        - from: pin
          to: inventory
        - from: inventory
          to: sheet
          label: config
        - from: sheet
          to: compare
        - from: report
          to: compare
        - from: compare
          to: table
    bridges: []
  - id: model-report-and-artifact-inventory.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.model-report-and-artifact-inventory
    markdown: Inventory a speech model, a fine-tuned derivative, and a research release; label claims by their evidence; and compute weight and cache sizes from config fields.
    takeaway: |-
      Pin the exact release, then inventory it file by file: weights, config, code, data, licenses, and checkpoints. Compute memory and compute from the config, and label every claim as documented, computed, inferred, or unknown.
  - id: model-report-and-artifact-inventory.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.model-report-and-artifact-inventory
    markdown: |-
      Inspect the exact release: weights, configuration, code, data, terms, and evaluation evidence. Available weights alone do not make the original training reproducible.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - model-report-and-artifact-inventory.s1
        - model-report-and-artifact-inventory.s2
        - model-report-and-artifact-inventory.s3
        - model-report-and-artifact-inventory.sheet
        - model-report-and-artifact-inventory.s4
        - model-report-and-artifact-inventory.check
      gate_refs:
        - gate.core
  scene_aliases:
    model-report-and-artifact-inventory.recap: model-report-and-artifact-inventory.check
assessment_families:
  - id: model-report-and-artifact-inventory.base
    objective_ref: objective.model-report-and-artifact-inventory
    task: base
    response_type: single_choice
    points: 1
    hint: Separate the artifacts. Ask which file a claim depends on, and whether that exact file was released.
    remediation_scene: model-report-and-artifact-inventory.s2
    variants:
      - id: model-report-and-artifact-inventory.base.1
        prompt: Does a family name uniquely identify a checkpoint?
        options:
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
          - id: c
            text: Only if it contains a number
        answer: a
        feedback: Families can include multiple revisions and variants.
        retired: true
      - id: model-report-and-artifact-inventory.base.2
        prompt: Do open weights imply released training data?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only if inference code is available
          - id: a
            text: 'No'
        answer: a
        feedback: Artifact availability must be checked separately.
        retired: true
  - id: model-report-and-artifact-inventory.transfer
    objective_ref: objective.model-report-and-artifact-inventory
    task: transfer
    response_type: single_choice
    points: 1
    hint: Match each claim to its source, and label it documented, computed, inferred, or unknown.
    remediation_scene: model-report-and-artifact-inventory.s4
    variants:
      - id: model-report-and-artifact-inventory.transfer.1
        prompt: Why inventory licenses per artifact?
        options:
          - id: b
            text: Every repository has one universal rule
          - id: c
            text: Only file names matter
          - id: a
            text: Code, weights, data, and derivatives can have different terms
        answer: a
        feedback: Terms follow the relevant artifact and lineage.
        retired: true
      - id: model-report-and-artifact-inventory.transfer.2
        prompt: Can benchmark behavior establish an undisclosed expert count?
        options:
          - id: c
            text: Only with enough prompts
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Output behavior does not uniquely identify internal architecture.
        retired: true
  - id: model-report-and-artifact-inventory.base.v2
    objective_ref: objective.model-report-and-artifact-inventory
    task: base
    response_type: single_choice
    points: 1
    hint: Read across one row of the inventory. Which exact file does the claim need, and was that file released?
    remediation_scene: model-report-and-artifact-inventory.s2
    variants:
      - id: model-report-and-artifact-inventory.base.v2.1
        prompt: A release includes final weights, config, tokenizer, and inference code under a permissive license. The report describes its training data in two paragraphs. A colleague calls it "fully open, so we can reproduce the training." Which inventory row contradicts that?
        options:
          - id: b
            text: The license row, since permissive terms may still forbid retraining
          - id: a
            text: The training data row, since the data is described but not released
          - id: c
            text: The tokenizer row, since retraining needs a new tokenizer first
        answer: a
        feedback: Reproducing training needs its inputs, and a prose description isn't the data. The permissive license already allows retraining, and the released tokenizer is exactly what a rerun would reuse.
      - id: model-report-and-artifact-inventory.base.v2.2
        prompt: A report says a model's vocabulary has 151,669 tokens, but its config sets vocab_size to 151,936. You're estimating the embedding table's memory. Which number do you use?
        options:
          - id: c
            text: The report's 151,669, since the unused padding rows are never loaded
          - id: b
            text: The average of the two, since each source rounds the count differently
          - id: a
            text: The config's 151,936, since that is how many rows are stored
        answer: a
        feedback: The config describes the tensors actually allocated, including padding rows beyond the real tokens. Padding rows are loaded like any other row, so the report's count underestimates memory.
      - id: model-report-and-artifact-inventory.base.v2.3
        prompt: You benchmark a model called "Nimbus-7B" on Monday and again on Friday, and the scores differ. The hub page shows a new commit on Wednesday. What should your notes have recorded to explain this?
        options:
          - id: a
            text: The model ID and the exact revision hash used for each run
          - id: b
            text: The family name and parameter count shown on the model card
          - id: c
            text: The report's arXiv number, since it fixes the weights in place
        answer: a
        feedback: A repository can change under the same name, and only the revision pins the files you actually ran. The family name and size didn't change, and a report version pins the description, not the files.
      - id: model-report-and-artifact-inventory.base.v2.4
        prompt: From a config (8.03B parameters, bfloat16) you write "weights take about 16 GB." Which evidence label fits that row?
        options:
          - id: b
            text: Documented, since the parameter count comes from the config
          - id: a
            text: Computed, since you derived it from documented numbers
          - id: c
            text: Inferred, since actual memory use varies by runtime
        answer: a
        feedback: The inputs are documented, but the 16 GB is your arithmetic (8.03B × 2 bytes), so label it computed. Inferred is for reasoned guesses from indirect evidence, not direct calculations.
  - id: model-report-and-artifact-inventory.transfer.v2
    objective_ref: objective.model-report-and-artifact-inventory
    task: transfer
    response_type: single_choice
    points: 1
    hint: Decide what the person needs to do (run, use, rebuild, or study training), then check the one artifact that decides it.
    remediation_scene: model-report-and-artifact-inventory.s3
    variants:
      - id: model-report-and-artifact-inventory.transfer.v2.1
        prompt: A startup wants to ship a paid transcription app on a speech model. Its code is MIT-licensed, and its weights are under a non-commercial license. What does the inventory tell them?
        options:
          - id: c
            text: The MIT code license covers the model, since the code loads the weights
          - id: a
            text: The weights' license governs the product, so it blocks this plan as is
          - id: b
            text: Either license may apply, so they can pick the more permissive one
        answer: a
        feedback: Each file carries its own terms, and a paid product ships the weights. Running MIT code doesn't relicense the weights it loads, and you don't get to choose which license applies.
      - id: model-report-and-artifact-inventory.transfer.v2.2
        prompt: A researcher wants to know at what point in training a model started solving multi-digit multiplication. Which release lets her answer that directly?
        options:
          - id: b
            text: One with final weights and a detailed report of the training stages
          - id: c
            text: One served through an API that lets her pin a dated model version
          - id: a
            text: One that publishes checkpoints saved throughout training
        answer: a
        feedback: To see when a skill appears, she has to test the model at several points in training. A report can describe the stages, but it can't be evaluated, and a pinned API version is still one final model.
      - id: model-report-and-artifact-inventory.transfer.v2.3
        prompt: A fine-tuned model on a hub is labeled MIT. Its card says it was trained from a Llama 3.1 8B base. What belongs in the license column of your inventory?
        options:
          - id: a
            text: The MIT label plus the base model's license, flagged for review
          - id: b
            text: The MIT label, since the fine-tuner's label replaces earlier terms
          - id: c
            text: The base model's license, since fine-tunes can't set their own terms
        answer: a
        feedback: Terms can travel down a lineage. The DeepSeek-R1 repository notes the same thing about its Llama-based students. Record both licenses and let a reviewer decide how they interact, rather than assuming one cancels the other.
      - id: model-report-and-artifact-inventory.transfer.v2.4
        prompt: A blog post says a closed model "must be a mixture of experts because it answers fast for its quality." How should your evidence table record this?
        options:
          - id: b
            text: As documented, since a published post is a public source
          - id: c
            text: As computed, since latency is a number that was measured
          - id: a
            text: As inferred, citing the latency evidence it rests on
        answer: a
        feedback: It's a reasoned guess from indirect evidence. Speed depends on hardware, batching, and quantization too. A blog isn't a primary source for the architecture, and a measured latency doesn't compute an expert count.
  - id: model-report-and-artifact-inventory.calculate
    objective_ref: objective.model-report-and-artifact-inventory
    task: base
    response_type: numeric
    points: 1
    hint: "Weights: parameters × bytes per number (bf16 = 2, FP8 = 1, int4 = 0.5); 10⁹ bytes = 1 GB. KV per token: 2 × layers × KV heads × head width × bytes; 1 KiB = 1,024 bytes."
    remediation_scene: model-report-and-artifact-inventory.sheet
    absolute_tolerance: 0.5
    variants:
      - id: model-report-and-artifact-inventory.calculate.1
        prompt: A config describes a model with 8.03 billion parameters stored in bfloat16. How many GB do the weights take?
        answer: 16.06
        feedback: 8.03 × 10⁹ × 2 bytes = 16.06 × 10⁹ bytes ≈ 16.1 GB.
      - id: model-report-and-artifact-inventory.calculate.2
        prompt: The same 8.03-billion-parameter model is quantized to int4 (half a byte per weight, ignoring scale factors). How many GB do the weights take?
        answer: 4.015
        feedback: 8.03 × 10⁹ × 0.5 bytes ≈ 4.0 GB, a quarter of the bf16 size.
      - id: model-report-and-artifact-inventory.calculate.3
        prompt: A config has 36 layers, 8 key/value heads, and head width 128, with a 2-byte cache. How many KiB does the KV cache grow per token?
        answer: 144
        feedback: 2 × 36 × 8 × 128 × 2 = 147,456 bytes, and 147,456 ÷ 1,024 = 144 KiB. (This is Qwen3-8B's shape.)
      - id: model-report-and-artifact-inventory.calculate.4
        prompt: DeepSeek-V3's Hugging Face files hold 685 billion parameters, shipped in FP8 (1 byte each). Ignoring small scale factors, how many GB is the download?
        answer: 685
        feedback: 685 × 10⁹ × 1 byte = 685 GB. That includes the 14B multi-token prediction weights on top of the 671B main model. A few tensors, such as the embeddings, stay in bf16, so the real download is slightly larger.
      - id: model-report-and-artifact-inventory.calculate.5
        prompt: A config has 64 layers, 8 key/value heads, and head width 128, with a 2-byte cache. How many KiB does the cache grow per token?
        answer: 256
        feedback: 2 × 64 × 8 × 128 × 2 = 262,144 bytes = 256 KiB. (This is Qwen3-32B's shape.)
