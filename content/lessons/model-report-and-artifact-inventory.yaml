schema_version: 0.2-draft
lesson:
  id: model-report-and-artifact-inventory
  version: 0.1.0-draft
  title: Read a model release as an inspectable set of artifacts
  state: draft
  summary: A model study should inventory exact checkpoints, configurations, tokenizers, code, data, licenses, and
    evaluation evidence; open weights, open code, and reproducible training are different properties.
  slot: M35.1
  category: learning
  minutes: 12
  sources:
  - title: Model Cards
    url: https://arxiv.org/abs/1810.03993
  - title: Olmo 3 model card
    url: https://huggingface.co/allenai/Olmo-3-7B-Think
objectives:
- id: objective.model-report-and-artifact-inventory
  version: 1-draft
  statement: A model study should inventory exact checkpoints, configurations, tokenizers, code, data, licenses,
    and evaluation evidence; open weights, open code, and reproducible training are different properties.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - model-report-and-artifact-inventory.base
  - model-report-and-artifact-inventory.transfer
  prerequisites:
  - anyOf:
    - objective.research-reporting
  - anyOf:
    - objective.production-data-and-model-artifacts
scenes:
- id: model-report-and-artifact-inventory.s1
  title: Pin the object of study
  type: explanation
  depth: intuition
  objective_refs:
  - objective.model-report-and-artifact-inventory
  markdown: Record the model ID, release date, checkpoint revision or hash, report revision, and retrieval date.
    A family name can cover dense and sparse models, base and adapted weights, or later updates. These lessons use
    dated historical anchors, not a claim to list the newest or best systems.
  text_mode: Record the model ID, release date, checkpoint revision or hash, report revision, and retrieval date.
    A family name can cover dense and sparse models, base and adapted weights, or later updates. These lessons use
    dated historical anchors, not a claim to list the newest or best systems.
  bridges: []
- id: model-report-and-artifact-inventory.s2
  title: Inventory released components
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.model-report-and-artifact-inventory
  markdown: Check weights, configuration, tokenizer, chat template, inference code, training code, training data,
    intermediate checkpoints, evaluation code, and logs separately. Mark each available, partially documented, unavailable,
    or not applicable, with a primary-source link. A final weight download does not supply the full training lifecycle.
  text_mode: Check weights, configuration, tokenizer, chat template, inference code, training code, training data,
    intermediate checkpoints, evaluation code, and logs separately. Mark each available, partially documented, unavailable,
    or not applicable, with a primary-source link. A final weight download does not supply the full training lifecycle.
  bridges: []
- id: model-report-and-artifact-inventory.s3
  title: Read terms at the artifact level
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.model-report-and-artifact-inventory
  markdown: Code, weights, and datasets can have different terms, and derivative checkpoints can retain upstream
    conditions. Record the actual files and versions for review rather than inferring permissions from the word
    open. This inventory supports technical inspection and appropriate downstream review without replacing context-specific
    interpretation.
  text_mode: Code, weights, and datasets can have different terms, and derivative checkpoints can retain upstream
    conditions. Record the actual files and versions for review rather than inferring permissions from the word
    open. This inventory supports technical inspection and appropriate downstream review without replacing context-specific
    interpretation.
  bridges: []
- id: model-report-and-artifact-inventory.s4
  title: Build a mechanism-to-evidence table
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.model-report-and-artifact-inventory
  markdown: For each architecture and training claim, link its source and distinguish documented fact from inference.
    Trace data to objective, update, checkpoint, template, and serving path. Identify missing details openly; performance
    alone cannot reveal an undisclosed expert count or training corpus.
  text_mode: For each architecture and training claim, link its source and distinguish documented fact from inference.
    Trace data to objective, update, checkpoint, template, and serving path. Identify missing details openly; performance
    alone cannot reveal an undisclosed expert count or training corpus.
  bridges: []
- id: model-report-and-artifact-inventory.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.model-report-and-artifact-inventory
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: model-report-and-artifact-inventory.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.model-report-and-artifact-inventory
  markdown: A model study should inventory exact checkpoints, configurations, tokenizers, code, data, licenses,
    and evaluation evidence; open weights, open code, and reproducible training are different properties.
  text_mode: A model study should inventory exact checkpoints, configurations, tokenizers, code, data, licenses,
    and evaluation evidence; open weights, open code, and reproducible training are different properties.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - model-report-and-artifact-inventory.s1
    - model-report-and-artifact-inventory.s2
    - model-report-and-artifact-inventory.s3
    - model-report-and-artifact-inventory.s4
    - model-report-and-artifact-inventory.check
    - model-report-and-artifact-inventory.recap
    gate_refs:
    - gate.core
assessment_families:
- id: model-report-and-artifact-inventory.base
  objective_ref: objective.model-report-and-artifact-inventory
  task: base
  response_type: single_choice
  points: 1
  hint: 'Inventory released components: trace the inputs, operation, and result before choosing.'
  remediation_scene: model-report-and-artifact-inventory.s2
  variants:
  - id: model-report-and-artifact-inventory.base.1
    prompt: Does a family name uniquely identify a checkpoint?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if it contains a number
    answer: a
    feedback: Families can include multiple revisions and variants.
  - id: model-report-and-artifact-inventory.base.2
    prompt: Do open weights imply released training data?
    options:
    - id: b
      text: 'Yes'
    - id: c
      text: Only if inference code is available
    - id: a
      text: 'No'
    answer: a
    feedback: Artifact availability must be checked separately.
- id: model-report-and-artifact-inventory.transfer
  objective_ref: objective.model-report-and-artifact-inventory
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Build a mechanism-to-evidence table: trace the inputs, operation, and result before choosing.'
  remediation_scene: model-report-and-artifact-inventory.s4
  variants:
  - id: model-report-and-artifact-inventory.transfer.1
    prompt: Why inventory licenses per artifact?
    options:
    - id: b
      text: Every repository has one universal rule
    - id: c
      text: Only file names matter
    - id: a
      text: Code, weights, data, and derivatives can have different terms
    answer: a
    feedback: Terms follow the relevant artifact and lineage.
  - id: model-report-and-artifact-inventory.transfer.2
    prompt: Can benchmark behavior establish an undisclosed expert count?
    options:
    - id: c
      text: Only with enough prompts
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Output behavior does not uniquely identify internal architecture.
