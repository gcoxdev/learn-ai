assessment_families:
  - id: regularization-and-tuning.base
    objective_ref: objective.regularization-and-tuning
    task: base
    response_type: single_choice
    points: 1
    hint: 'Choose transformations with the task in mind: trace the inputs, operation, and result before choosing.'
    remediation_scene: regularization-and-tuning.s2
    variants:
      - id: regularization-and-tuning.base.1
        prompt: What does regularization introduce?
        options:
          - id: c
            text: A replacement for every test set
          - id: a
            text: A preference or constraint on fitted solutions
          - id: b
            text: A guarantee of perfect labels
        answer: a
        feedback: Regularization shapes which fits are favored.
        retired: true
      - id: regularization-and-tuning.base.2
        prompt: Where should a data-fitted scaler be fitted during cross-validation?
        options:
          - id: a
            text: Within each training fold
          - id: b
            text: On all folds before splitting
          - id: c
            text: Only on the outer test set
        answer: a
        feedback: Preprocessing must obey the same information boundary as model fitting.
        retired: true
  - id: regularization-and-tuning.transfer
    objective_ref: objective.regularization-and-tuning
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Keep a final assessment distinct: trace the inputs, operation, and result before choosing.'
    remediation_scene: regularization-and-tuning.s4
    variants:
      - id: regularization-and-tuning.transfer.1
        prompt: A team chooses features after inspecting the final test result. What has happened?
        options:
          - id: a
            text: Test information entered model selection
          - id: b
            text: Nothing, because weights were unchanged
          - id: c
            text: The features became independent of data
        answer: a
        feedback: Model selection includes feature choices, not only weight updates.
        retired: true
      - id: regularization-and-tuning.transfer.2
        prompt: What is nested evaluation useful for?
        options:
          - id: b
            text: Guaranteeing every candidate is optimal
          - id: c
            text: Eliminating the need to state metrics
          - id: a
            text: Estimating the performance of a tuning procedure with an outer holdout
        answer: a
        feedback: The outer evaluation measures the selection process without sharing its feedback.
        retired: true
  - id: regularization-and-tuning.base.v2
    objective_ref: objective.regularization-and-tuning
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Plain least squares divides Σxy by Σx². Ridge adds λ to the bottom of that fraction; lasso subtracts λ/2 from the top and stops at zero.
    remediation_scene: regularization-and-tuning.s2
    variants:
      - id: regularization-and-tuning.base.v2.1
        prompt: 'One weight, no intercept. The data give Σxy = 30 and Σx² = 10, and the penalty strength is λ = 20. Find the unpenalized weight, the ridge weight, and the lasso weight.'
        feedback: Unpenalized, w = 30/10 = 3. Ridge gives 30/(10 + 20) = 1. Lasso gives (30 − 10)/10 = 2. Ridge shrank this weight more here, but lasso is the one that can reach exactly zero.
        answers:
          plain: 3
          ridge: 1
          lasso: 2
        reason_answer: subtract
        reason_options:
          - id: subtract
            text: Ridge adds λ to Σx²; lasso subtracts λ/2 from Σxy and stops at zero.
          - id: divide
            text: Ridge subtracts λ from Σxy; lasso adds λ to Σx² and stops at zero.
          - id: both
            text: Both divide the unpenalized weight by (1 + λ), so they shrink equally.
      - id: regularization-and-tuning.base.v2.2
        prompt: 'One weight, no intercept. The data give Σxy = 12 and Σx² = 4, and the penalty strength is λ = 4. Find the unpenalized weight, the ridge weight, and the lasso weight.'
        feedback: Unpenalized, w = 12/4 = 3. Ridge gives 12/(4 + 4) = 1.5. Lasso gives (12 − 2)/4 = 2.5.
        answers:
          plain: 3
          ridge: 1.5
          lasso: 2.5
        reason_answer: subtract
        reason_options:
          - id: divide
            text: Ridge subtracts λ from Σxy; lasso adds λ to Σx² and stops at zero.
          - id: subtract
            text: Ridge adds λ to Σx²; lasso subtracts λ/2 from Σxy and stops at zero.
          - id: both
            text: Both divide the unpenalized weight by (1 + λ), so they shrink equally.
      - id: regularization-and-tuning.base.v2.3
        prompt: 'One weight, no intercept. The data give Σxy = 20 and Σx² = 5, and the penalty strength is λ = 15. Find the unpenalized weight, the ridge weight, and the lasso weight.'
        feedback: Unpenalized, w = 20/5 = 4. Ridge gives 20/(5 + 15) = 1. Lasso gives (20 − 7.5)/5 = 2.5.
        answers:
          plain: 4
          ridge: 1
          lasso: 2.5
        reason_answer: subtract
        reason_options:
          - id: both
            text: Both divide the unpenalized weight by (1 + λ), so they shrink equally.
          - id: divide
            text: Ridge subtracts λ from Σxy; lasso adds λ to Σx² and stops at zero.
          - id: subtract
            text: Ridge adds λ to Σx²; lasso subtracts λ/2 from Σxy and stops at zero.
      - id: regularization-and-tuning.base.v2.4
        prompt: 'One weight, no intercept. The data give Σxy = 6 and Σx² = 2, and the penalty strength is λ = 14. Find the unpenalized weight, the ridge weight, and the lasso weight.'
        feedback: Unpenalized, w = 6/2 = 3. Ridge gives 6/(2 + 14) = 0.375, small but not zero. Lasso would give (6 − 7)/2, which is below zero, so it stops at exactly 0 and the feature is switched off.
        answers:
          plain: 3
          ridge: 0.375
          lasso: 0
        reason_answer: subtract
        reason_options:
          - id: subtract
            text: Ridge adds λ to Σx²; lasso subtracts λ/2 from Σxy and stops at zero.
          - id: both
            text: Both divide the unpenalized weight by (1 + λ), so they shrink equally.
          - id: divide
            text: Ridge subtracts λ from Σxy; lasso adds λ to Σx² and stops at zero.
    absolute_tolerance: 0.01
    numeric_fields:
      - id: plain
        label: Unpenalized weight
      - id: ridge
        label: Ridge weight
      - id: lasso
        label: Lasso weight
  - id: regularization-and-tuning.transfer.v2
    objective_ref: objective.regularization-and-tuning
    task: transfer
    response_type: single_choice
    points: 1
    hint: Anything chosen by looking at data (λ, features, scaling) must be chosen inside the training folds, and a test score counts only if nothing was chosen with it.
    remediation_scene: regularization-and-tuning.s4
    variants:
      - id: regularization-and-tuning.transfer.v2.1
        prompt: A team standardizes all 5,000 rows of a housing dataset, then runs 5-fold cross-validation to tune λ. What is the problem?
        options:
          - id: a
            text: Standardizing isn't needed for ridge, so it wastes effort
          - id: c
            text: Five folds are too few for 5,000 rows to give a stable score
          - id: b
            text: The held-out folds helped set the scaling used in training
        answer: b
        feedback: The means and spreads came partly from each held-out fold, so a little of its information leaked into training. Fit the scaler on the training folds inside each round. Ridge does care about scale, since the penalty treats every weight alike, and 1,000 rows per fold is plenty.
      - id: regularization-and-tuning.transfer.v2.2
        prompt: A team tries 40 values of λ, scores each on its test set, and reports the best test score, 91%, as the model's expected accuracy. What is wrong?
        options:
          - id: c
            text: The test set chose λ, so 91% is likely optimistic
          - id: b
            text: Forty values is too few to find the best λ reliably
          - id: a
            text: Test scores need averaging across all 40 values of λ
        answer: c
        feedback: Picking the best of 40 noisy test scores favors a lucky setting, so the test set has become tuning data. Choose λ by cross-validation on development data, then score the single chosen model on a fresh test set. Averaging all 40 scores would describe none of the models.
      - id: regularization-and-tuning.transfer.v2.3
        prompt: 'Two settings are compared with 5-fold cross-validation. Setting A''s fold errors are 4, 6, 5, 7, 8. Setting B''s are 3, 9, 4, 8, 7. Which has the lower cross-validation error?'
        options:
          - id: c
            text: B, since it has the single best fold, with an error of 3
          - id: b
            text: B, once its worst fold of 9 is set aside as an outlier
          - id: a
            text: A, with an average of 6.0 against B's 6.2
        answer: a
        feedback: The cross-validation score is the average over all folds, 30/5 = 6.0 for A and 31/5 = 6.2 for B. Judging by the best fold, or dropping an inconvenient fold, turns the comparison into cherry-picking.
      - id: regularization-and-tuning.transfer.v2.4
        prompt: A genetics lab has 500 candidate gene features for 200 patients and suspects only a few dozen matter. They want a model that also yields a short list of genes to study. Which penalty fits best?
        options:
          - id: b
            text: Ridge, since it shrinks the 500 weights smoothly and evenly
          - id: c
            text: Lasso, since it can set many weights to exactly zero
          - id: a
            text: Skip the penalty, since 200 patients is plenty of data
        answer: c
        feedback: Lasso's fixed subtraction switches weak features off, leaving a short list of nonzero weights. Ridge keeps all 500 small but nonzero, and with 500 features and 200 patients, an unpenalized fit can match the training data perfectly and generalize badly.
      - id: regularization-and-tuning.transfer.v2.5
        prompt: A shop forecasts next week's sales. Random 5-fold cross-validation over its daily records gives a small error, but live forecasts are far worse. What change to the evaluation is most important?
        options:
          - id: c
            text: Use 10 folds instead of 5 to reduce the noise in the score
          - id: b
            text: Hold out later weeks and train only on earlier ones
          - id: a
            text: Add a stronger ridge penalty so the model is simpler
        answer: b
        feedback: Random folds let the model train on days after the ones it's tested on, a peek at the future it won't have live. Time-ordered folds mimic real forecasting. More folds keep the same leak, and a penalty changes the model, not the flawed evaluation.
      - id: regularization-and-tuning.transfer.v2.6
        prompt: 'As λ rises from 0 to 1, cross-validation error falls. By λ = 100 it has risen sharply, and every weight is close to zero. What is happening at λ = 100?'
        options:
          - id: a
            text: The penalty is so strong the model can't follow the trend
          - id: b
            text: The model is overfitting, because its weights are too large
          - id: c
            text: The folds have leaked, since error shouldn't rise with λ
        answer: a
        feedback: A huge λ shrinks the weights so far that even the real pattern is lost, which is underfitting. Overfitting sits at the other end, with small λ and large weights. Error rising on both sides of a sweet spot is the expected U shape, not a sign of leakage.
