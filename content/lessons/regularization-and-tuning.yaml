lesson:
  id: regularization-and-tuning
  version: 0.3.0-draft
  title: Control complexity without peeking at the answer
  state: draft
  summary: Choose model settings with practice data while protecting a separate final check from those choices.
  slot: M07.7
  category: learning
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.regularization-and-tuning
  version: 1-draft
  statement: Regularization, feature engineering, cross-validation, and hyperparameter tuning shape generalization
    and must remain inside a clearly defined development boundary.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - regularization-and-tuning.base
  - regularization-and-tuning.transfer
  prerequisites:
  - anyOf:
    - objective.logistic-regression
  - anyOf:
    - objective.splits-and-leakage
scenes:
- id: regularization-and-tuning.s1
  title: Prefer some fits over others
  type: explanation
  depth: intuition
  objective_refs:
  - objective.regularization-and-tuning
  markdown: 'Regularization discourages selected kinds of complexity, such as large coefficients. It can be
    expressed as a penalty added to loss or through architecture, early stopping, or constrained fitting. It
    deliberately introduces a preference; whether that preference helps depends on the data and task.


    A **parameter** is fitted during training, such as a weight. A **hyperparameter** is a setting of that
    fitting process, such as tree depth or the strength of a weight penalty. **Tuning** means comparing candidate
    settings. For example, a penalty proportional to the sum of squared weights makes weight 10 cost more than
    weight 1, even before prediction errors are considered.'
  text_mode: 'Regularization discourages selected kinds of complexity, such as large coefficients. It can be
    expressed as a penalty added to loss or through architecture, early stopping, or constrained fitting. It
    deliberately introduces a preference; whether that preference helps depends on the data and task.


    A **parameter** is fitted during training, such as a weight. A **hyperparameter** is a setting of that
    fitting process, such as tree depth or the strength of a weight penalty. **Tuning** means comparing candidate
    settings. For example, a penalty proportional to the sum of squared weights makes weight 10 cost more than
    weight 1, even before prediction errors are considered.'
  bridges: []
- id: regularization-and-tuning.s2
  title: Choose transformations with the task in mind
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.regularization-and-tuning
  markdown: A log transform can change how a model represents skewed values; interactions let one feature’s
    effect depend on another. Fit learned transforms using training data. Feature engineering is part of the
    model-selection process, so trying many alternatives against the same validation set can overfit that feedback
    too.
  text_mode: A log transform can change how a model represents skewed values; interactions let one feature’s
    effect depend on another. Fit learned transforms using training data. Feature engineering is part of the
    model-selection process, so trying many alternatives against the same validation set can overfit that feedback
    too.
  bridges: []
- id: regularization-and-tuning.s3
  title: Rotate which examples are held out
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.regularization-and-tuning
  markdown: 'A **fold** is one partition of the development data. **Cross-validation** rotates which fold is
    held out. With folds A, B, and C, train on B+C and evaluate on A; train on A+C and evaluate on B; then
    train on A+B and evaluate on C. Combine the three results to compare a candidate setting.


    Refit preprocessing within each training portion so the held-out fold does not determine its means or scales.
    If records share a person or have a time order, the folds must respect that structure. The next step explains
    how an outer evaluation can also keep the tuning choices separate.'
  text_mode: 'A **fold** is one partition of the development data. **Cross-validation** rotates which fold
    is held out. With folds A, B, and C, train on B+C and evaluate on A; train on A+C and evaluate on B; then
    train on A+B and evaluate on C. Combine the three results to compare a candidate setting.


    Refit preprocessing within each training portion so the held-out fold does not determine its means or scales.
    If records share a person or have a time order, the folds must respect that structure. The next step explains
    how an outer evaluation can also keep the tuning choices separate.'
  bridges: []
- id: regularization-and-tuning.s4
  title: Keep a final assessment distinct
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.regularization-and-tuning
  markdown: 'After choosing hyperparameters and preprocessing, evaluate on held-out data not used to make those
    choices. Report the search space and budget, not just the winner. A complex method with a much larger tuning
    budget is a different experimental condition from a minimally tuned baseline.


    In **nested** evaluation, an outer held-out group judges the entire selection procedure. Inside the outer
    training portion, use separate folds to choose the settings. Then fit the chosen setup on that outer training
    portion and evaluate once on its outer holdout. The extra layer prevents choosing a setting and claiming
    an unbiased score from the same feedback.'
  text_mode: 'After choosing hyperparameters and preprocessing, evaluate on held-out data not used to make
    those choices. Report the search space and budget, not just the winner. A complex method with a much larger
    tuning budget is a different experimental condition from a minimally tuned baseline.


    In **nested** evaluation, an outer held-out group judges the entire selection procedure. Inside the outer
    training portion, use separate folds to choose the settings. Then fit the chosen setup on that outer training
    portion and evaluate once on its outer holdout. The extra layer prevents choosing a setting and claiming
    an unbiased score from the same feedback.'
  bridges: []
