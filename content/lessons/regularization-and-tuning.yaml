schema_version: 0.2-draft
lesson:
  id: regularization-and-tuning
  version: 0.1.0-draft
  title: Control complexity without peeking at the answer
  state: draft
  summary: Regularization, feature engineering, cross-validation, and hyperparameter tuning shape generalization
    and must remain inside a clearly defined development boundary.
  slot: M07.7
  category: learning
  minutes: 12
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.regularization-and-tuning
  version: 1-draft
  statement: Regularization, feature engineering, cross-validation, and hyperparameter tuning shape generalization
    and must remain inside a clearly defined development boundary.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - regularization-and-tuning.base
  - regularization-and-tuning.transfer
  prerequisites:
  - anyOf:
    - objective.logistic-regression
  - anyOf:
    - objective.splits-and-leakage
scenes:
- id: regularization-and-tuning.s1
  title: Prefer some fits over others
  type: explanation
  depth: intuition
  objective_refs:
  - objective.regularization-and-tuning
  markdown: Regularization discourages selected kinds of complexity, such as large coefficients. It can be expressed
    as a penalty added to loss or through architecture, early stopping, or constrained fitting. It deliberately
    introduces a preference; whether that preference helps depends on the data and task.
  text_mode: Regularization discourages selected kinds of complexity, such as large coefficients. It can be expressed
    as a penalty added to loss or through architecture, early stopping, or constrained fitting. It deliberately
    introduces a preference; whether that preference helps depends on the data and task.
  bridges: []
- id: regularization-and-tuning.s2
  title: Choose transformations with the task in mind
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.regularization-and-tuning
  markdown: A log transform can change how a model represents skewed values; interactions let one feature’s effect
    depend on another. Fit learned transforms using training data. Feature engineering is part of the model-selection
    process, so trying many alternatives against the same validation set can overfit that feedback too.
  text_mode: A log transform can change how a model represents skewed values; interactions let one feature’s effect
    depend on another. Fit learned transforms using training data. Feature engineering is part of the model-selection
    process, so trying many alternatives against the same validation set can overfit that feedback too.
  bridges: []
- id: regularization-and-tuning.s3
  title: Rotate validation partitions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.regularization-and-tuning
  markdown: Cross-validation repeatedly trains on some folds and evaluates on the held-out fold, then combines results.
    Entity or temporal structure may require grouped or time-aware folds. For comparing a tuned procedure, nested
    evaluation separates the inner tuning loop from an outer performance estimate.
  text_mode: Cross-validation repeatedly trains on some folds and evaluates on the held-out fold, then combines
    results. Entity or temporal structure may require grouped or time-aware folds. For comparing a tuned procedure,
    nested evaluation separates the inner tuning loop from an outer performance estimate.
  bridges: []
- id: regularization-and-tuning.s4
  title: Keep a final assessment distinct
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.regularization-and-tuning
  markdown: After choosing hyperparameters and preprocessing, evaluate on held-out data not used to make those choices.
    Report the search space and budget, not just the winner. A complex method with a much larger tuning budget is
    a different experimental condition from a minimally tuned baseline.
  text_mode: After choosing hyperparameters and preprocessing, evaluate on held-out data not used to make those
    choices. Report the search space and budget, not just the winner. A complex method with a much larger tuning
    budget is a different experimental condition from a minimally tuned baseline.
  bridges: []
- id: regularization-and-tuning.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.regularization-and-tuning
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: regularization-and-tuning.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.regularization-and-tuning
  markdown: Regularization, feature engineering, cross-validation, and hyperparameter tuning shape generalization
    and must remain inside a clearly defined development boundary.
  text_mode: Regularization, feature engineering, cross-validation, and hyperparameter tuning shape generalization
    and must remain inside a clearly defined development boundary.
