    bridges: []
  - id: regularization-and-tuning.s5
    title: Let cross-validation set the price
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.regularization-and-tuning
    markdown: |-
      Now put it together: ridge regression on the ten polynomial features, with 5-fold cross-validation choosing $\lambda$. The program also prints the largest weight (other than the intercept) when fitting all 20 days.

      ```python run
      import numpy as np
      rng = np.random.default_rng(0)

      temp = np.linspace(65, 85, 20)                   # 20 days' high temperatures, °F
      cups = 2 * temp - 95 + rng.normal(0, 3, 20)       # a straight trend plus noise
      x = (temp - 75) / 10                             # rescale to roughly -1..1
      X = np.vander(x, 10, increasing=True)            # features 1, x, x², ..., x⁹
      folds = np.arange(20) % 5                        # 5 folds of 4 days each

      def ridge(X, y, lam):
          P = lam * np.eye(X.shape[1])
          P[0, 0] = 0                                  # don't penalize the intercept
          return np.linalg.solve(X.T @ X + P, X.T @ y)

      for lam in [0, 0.001, 0.01, 0.1, 1, 10, 100]:
          errors = []
          for k in range(5):                           # hold out fold k, train on the rest
              train, val = folds != k, folds == k
              w = ridge(X[train], cups[train], lam)
              errors.append(np.mean((X[val] @ w - cups[val]) ** 2))
          biggest = np.abs(ridge(X, cups, lam)[1:]).max()
          print(f"lambda = {lam:<6} CV error {np.mean(errors):9.1f}   largest weight {biggest:8.1f}")
      ```

      Read the output as a U. With $\lambda = 0$, the weights reach 160 and the CV error is 188.8: overfitting. Around $\lambda = 0.01$ to 0.1, the CV error bottoms out near 5.2. By $\lambda = 100$, the largest weight is 1.2, too small even for the real upward trend, and the error climbs to 118.5: underfitting. Change the noise in `rng.normal(0, 3, 20)` from 3 to 6 and see whether the winning $\lambda$ moves.
    bridges: []
  - id: regularization-and-tuning.s4
    title: Keep one test for the very end
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.regularization-and-tuning
    markdown: |-
      Lena's analyst picks $\lambda = 0.01$ because its CV error, 5.2, was the lowest of seven. Can she promise a typical error of 5.2 on future days?

      Not quite. Picking the smallest of seven noisy scores favors a setting that got a little lucky, so the winning score runs optimistic. The same happens when you try twenty feature ideas and keep the one that scores best. Feature choices are tuning too.

      So the full routine has three steps:

      1. **Before anything else**, set aside a test set: here, say, the next 10 days Lena records.
      2. **Tune on the rest.** Use cross-validation to choose $\lambda$, the features, and the scaling, then refit the winner on all 20 development days.
      3. **Test once.** Score that one model on the 10 test days and report that number. If you then change the model because of it, the test set has become development data, and you need fresh days.

      When data are too scarce to set aside a test set, **nested cross-validation** wraps the whole tuning routine inside an outer loop of folds, so every outer score comes from data the tuning never saw. The generalization module covers it in depth.
    bridges: []
  - id: regularization-and-tuning.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.regularization-and-tuning
    markdown: Work out ridge and lasso weights by hand, then catch leaks and optimistic scores in scaling, time-series, and hyperparameter-search setups.
    takeaway: |-
      Regularization charges a model for big weights, ridge by shrinking them and lasso by switching some off. Choose its strength with cross-validation on development data, and keep a test set that no choice ever touched.
  - id: regularization-and-tuning.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.regularization-and-tuning
    markdown: |-
      Choose regularization and other training settings using development data. Keep the final evaluation separate from every choice, including preprocessing and feature design.
