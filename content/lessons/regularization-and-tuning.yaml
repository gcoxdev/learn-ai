schema_version: 0.2-draft
lesson:
  id: regularization-and-tuning
  version: 0.4.0-draft
  title: Control complexity without peeking at the answer
  state: draft
  summary: Give a model ten knobs and twenty examples, and it will fit noise. Charge it for big weights, let cross-validation set the price, and keep one test for the end.
  slot: M07.7
  category: learning
  sources:
    - title: An Introduction to Statistical Learning — authors’ materials
      url: https://www.statlearning.com/
    - title: "Tibshirani (1996), Regression Shrinkage and Selection via the Lasso"
      url: https://doi.org/10.1111/j.2517-6161.1996.tb02080.x
objectives:
  - id: objective.regularization-and-tuning
    version: 2-draft
    statement: Regularization, feature engineering, cross-validation, and hyperparameter tuning shape generalization and must remain inside a clearly defined development boundary.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - regularization-and-tuning.base.v2
      - regularization-and-tuning.transfer.v2
    prerequisites:
      - anyOf:
          - objective.logistic-regression
      - anyOf:
          - objective.splits-and-leakage
scenes:
  - id: regularization-and-tuning.s1
    title: Ten knobs, twenty days
    type: explanation
    depth: intuition
    objective_refs:
      - objective.regularization-and-tuning
    markdown: |-
      Lena's coffee truck now has 20 days of records. A friend suggests a fancier model: besides the temperature $x$, add $x^2, x^3, \dots, x^9$ as extra features, so the prediction can follow any curve. Building new features from existing ones like this is **feature engineering**.

      The fancy curve hugs the 20 training days closely. But between and beyond them it swings wildly, because a big weight on $x^9$ can cancel a big weight on $x^8$ at the training points and nowhere else. When checked on days it didn't train on, its average squared error is about 189, versus about 5 for the tamer versions you'll see below.

      Two kinds of numbers are involved. A **parameter** is fitted by training, like each of the ten weights. A **hyperparameter** is a setting you choose before training, like how many powers of $x$ to include or how strongly to penalize big weights. Choosing hyperparameters by comparing candidates is **tuning**.

      **Regularization** is any change that pushes training toward simpler fits. The most common kind adds a penalty to the loss, so the model pays for large weights as well as for misses:

      $$\text{loss} = \sum_i (y_i - \hat{y}_i)^2 + \lambda \times \text{penalty}(\mathbf{w})$$

      The hyperparameter $\lambda$ ("lambda") sets the price: 0 means no penalty; a huge $\lambda$ forces every weight toward zero. (Some libraries use the mean squared error instead of the total; that only rescales $\lambda$.)
    bridges: []
  - id: regularization-and-tuning.s2
    title: "Ridge and lasso: two prices for big weights"
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.regularization-and-tuning
    markdown: |-
      The two classic penalties differ in one symbol:

      | Name | Penalty | Effect on weights |
      | --- | --- | --- |
      | **Ridge** (L2) | $\lambda \sum_j w_j^2$ | Shrinks all weights smoothly toward zero |
      | **Lasso** (L1) | $\lambda \sum_j \lvert w_j \rvert$ | Shrinks, and sets some weights exactly to zero |

      See the difference with a single weight and no intercept, using the total squared error $\sum (y - wx)^2$. Suppose the data give $\sum xy = 20$ and $\sum x^2 = 10$. Setting the slope of each loss to zero gives:

      - No penalty: $w = \sum xy / \sum x^2 = 20 / 10 = 2$.
      - Ridge: $w = \sum xy / (\sum x^2 + \lambda)$. With $\lambda = 10$, $w = 20/20 = 1$; with $\lambda = 30$, $w = 0.5$.
      - Lasso: $w = (\sum xy - \lambda/2) / \sum x^2$, stopping at zero. With $\lambda = 10$, $w = 15/10 = 1.5$; with $\lambda = 40$ or more, $w = 0$.

      :::predict Ridge with λ = 1,000: is the weight zero?
      No. $w = 20 / 1{,}010 \approx 0.02$. Ridge divides, so the weight gets tiny but never reaches zero. Lasso subtracts a fixed amount, so it hits zero exactly. That's why lasso doubles as **feature selection**: with 500 candidate features, it might keep 20 nonzero weights and switch off the rest.
      :::

      :::story Two penalties, 26 years apart
      Arthur Hoerl and Robert Kennard introduced ridge regression in 1970 to tame unstable least-squares fits when features are correlated. Robert Tibshirani introduced the lasso in 1996. In neural networks, the ridge penalty goes by another name: weight decay.
      :::
    bridges: []
  - id: regularization-and-tuning.s3
    title: Rotate which days are held out
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.regularization-and-tuning
    markdown: |-
      To pick $\lambda$, we need error on days the model didn't train on. With only 20 days, setting aside one validation group wastes data and gives a noisy answer. **k-fold cross-validation** fixes both. Split the development data into $k$ equal parts called **folds**. Train on $k - 1$ folds and measure error on the one left out; repeat so every fold is held out once; then average:

      $$\text{CV}(\lambda) = \frac{1}{k}\sum_{j=1}^{k} \text{Err}_j(\lambda)$$

      Lena's 20 days make 5 folds of 4 days. With $\lambda = 0.01$, the five held-out errors are 0.1, 7.0, 9.1, 3.9, and 6.2, which average to about 5.2. Every day is used for training four times and for checking once.

      With no penalty, the fold errors are 895.5, 18.5, 17.8, 6.1, and 6.0. One fold holds the coldest day, where the unpenalized curve shoots off, and that single fold drags the average to 188.8. Cross-validation caught a failure that one lucky split could have hidden.

      Two rules keep the folds honest. First, anything learned from data, such as the mean and spread used for scaling, must be fitted on the training folds only, then applied to the held-out fold. Second, the folds must match how the model will be used: if you'll predict next week from past weeks, hold out later weeks, not random days, and keep all rows from one person in the same fold.
    diagram:
      caption: Five-fold cross-validation. Each round holds out a different fold; the five errors are averaged.
      description: The development data is split into five folds. In round 1, fold 1 is held out and folds 2 to 5 train the model. In round 2, fold 2 is held out, and so on through round 5. Each round gives one validation error, and the five errors are averaged into the cross-validation score used to choose lambda.
      nodes:
        - id: data
          label: Development data
          note: 20 days
          col: 0
          row: 1
          tone: data
        - id: r1
          label: "Round 1: hold out fold 1"
