schema_version: 0.2-draft
lesson:
  id: rag-evidence-pipeline
  version: 0.1.0-draft
  title: Retrieve evidence and condition an answer on it
  state: draft
  summary: A RAG system retrieves external material and supplies selected evidence to a generator; ingestion, retrieval,
    context construction, generation, and verification each contribute distinct failure modes.
  slot: M26.5
  category: learning
  minutes: 12
  sources:
  - title: Retrieval-Augmented Generation
    url: https://arxiv.org/abs/2005.11401
  - title: Introduction to Information Retrieval — authors’ online edition
    url: https://nlp.stanford.edu/IR-book/
objectives:
- id: objective.rag-evidence-pipeline
  version: 1-draft
  statement: A RAG system retrieves external material and supplies selected evidence to a generator; ingestion,
    retrieval, context construction, generation, and verification each contribute distinct failure modes.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - rag-evidence-pipeline.base
  - rag-evidence-pipeline.transfer
  prerequisites:
  - anyOf:
    - objective.hybrid-search-and-reranking
  - anyOf:
    - objective.next-token
scenes:
- id: rag-evidence-pipeline.s1
  title: Separate stored knowledge from supplied evidence
  type: explanation
  depth: intuition
  objective_refs:
  - objective.rag-evidence-pipeline
  markdown: A language model has learned parameters, while a retrieval system can access a changing document collection.
    RAG supplies selected documents or passages as context for generation. This can improve access to specific information
    without updating weights, but does not guarantee the model uses that evidence correctly.
  text_mode: A language model has learned parameters, while a retrieval system can access a changing document collection.
    RAG supplies selected documents or passages as context for generation. This can improve access to specific information
    without updating weights, but does not guarantee the model uses that evidence correctly.
  bridges: []
- id: rag-evidence-pipeline.s2
  title: Trace one answer request
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.rag-evidence-pipeline
  markdown: For a question about a product specification, retrieve permitted candidate passages, rerank them, preserve
    source identifiers, and construct a bounded context. The generator then answers with the relevant qualifications
    and citations. If the needed fact is absent, the pipeline needs a defined fallback or abstention behavior.
  text_mode: For a question about a product specification, retrieve permitted candidate passages, rerank them, preserve
    source identifiers, and construct a bounded context. The generator then answers with the relevant qualifications
    and citations. If the needed fact is absent, the pipeline needs a defined fallback or abstention behavior.
  bridges: []
- id: rag-evidence-pipeline.s3
  title: Keep the context interpretable
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.rag-evidence-pipeline
  markdown: Label document boundaries, versions, and source IDs so claims can be traced. Remove irrelevant duplication
    while retaining necessary caveats. Retrieved instructions should not override the system’s authorized task.
    Context construction is an evidence-selection step, not just concatenating the top search results.
  text_mode: Label document boundaries, versions, and source IDs so claims can be traced. Remove irrelevant duplication
    while retaining necessary caveats. Retrieved instructions should not override the system’s authorized task.
    Context construction is an evidence-selection step, not just concatenating the top search results.
  bridges: []
- id: rag-evidence-pipeline.s4
  title: Diagnose by stage
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.rag-evidence-pipeline
  markdown: If no relevant passage was retrieved, inspect indexing and query behavior. If a good passage was present
    but ignored, inspect context and generation. If the answer misattributes it, inspect citation handling. Evaluate
    the full pipeline as well as its components to avoid blaming every failure on the language model.
  text_mode: If no relevant passage was retrieved, inspect indexing and query behavior. If a good passage was present
    but ignored, inspect context and generation. If the answer misattributes it, inspect citation handling. Evaluate
    the full pipeline as well as its components to avoid blaming every failure on the language model.
  bridges: []
- id: rag-evidence-pipeline.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.rag-evidence-pipeline
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: rag-evidence-pipeline.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.rag-evidence-pipeline
  markdown: A RAG system retrieves external material and supplies selected evidence to a generator; ingestion, retrieval,
    context construction, generation, and verification each contribute distinct failure modes.
  text_mode: A RAG system retrieves external material and supplies selected evidence to a generator; ingestion,
    retrieval, context construction, generation, and verification each contribute distinct failure modes.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - rag-evidence-pipeline.s1
    - rag-evidence-pipeline.s2
    - rag-evidence-pipeline.s3
    - rag-evidence-pipeline.s4
    - rag-evidence-pipeline.check
    - rag-evidence-pipeline.recap
    gate_refs:
    - gate.core
assessment_families:
- id: rag-evidence-pipeline.base
  objective_ref: objective.rag-evidence-pipeline
  task: base
  response_type: single_choice
  points: 1
  hint: 'Trace one answer request: trace the inputs, operation, and result before choosing.'
  remediation_scene: rag-evidence-pipeline.s2
  variants:
  - id: rag-evidence-pipeline.base.1
    prompt: Does ordinary RAG necessarily update model weights?
    options:
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    - id: c
      text: Only if retrieved text is long
    answer: a
    feedback: Retrieved material can condition inference without training.
  - id: rag-evidence-pipeline.base.2
    prompt: Relevant evidence was retrieved but the model ignored it. Which stages deserve inspection?
    options:
    - id: b
      text: Only document collection size
    - id: c
      text: Only the network adapter
    - id: a
      text: Context construction and generation
    answer: a
    feedback: The failure occurs after evidence retrieval.
- id: rag-evidence-pipeline.transfer
  objective_ref: objective.rag-evidence-pipeline
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Diagnose by stage: trace the inputs, operation, and result before choosing.'
  remediation_scene: rag-evidence-pipeline.s4
  variants:
  - id: rag-evidence-pipeline.transfer.1
    prompt: Why preserve source IDs in the prompt context?
    options:
    - id: b
      text: To prove all generated claims automatically
    - id: c
      text: To replace all relevance checks
    - id: a
      text: To support traceable use and citation of evidence
    answer: a
    feedback: Identifiers connect outputs to retrieved passages.
  - id: rag-evidence-pipeline.transfer.2
    prompt: What should happen when required evidence is absent?
    options:
    - id: c
      text: Assume the top result proves the answer
    - id: a
      text: Use a defined fallback or acknowledge the gap
    - id: b
      text: Invent a citation confidently
    answer: a
    feedback: The system should not manufacture support.
