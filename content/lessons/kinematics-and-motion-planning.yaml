objectives:
  - id: objective.kinematics-and-motion-planning
    version: 2-draft
    statement: Compute a two-link arm's gripper position from its joint angles and the joint angles for a target (both elbow solutions, or none), explain the Jacobian and configuration space, and choose between grid search and sampling-based planning.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - kinematics-and-motion-planning.base.v2
      - kinematics-and-motion-planning.transfer.v2
      - kinematics-and-motion-planning.fk
      - kinematics-and-motion-planning.ik
    prerequisites:
      - anyOf:
          - objective.robot-sensors-and-frames
      - anyOf:
          - objective.search-problems
      - anyOf:
          - objective.constraint-solving
scenes:
  - id: kinematics-and-motion-planning.s1
    title: Joint angles in, gripper position out
    type: explanation
    depth: intuition
    objective_refs:
      - objective.kinematics-and-motion-planning
    markdown: |-
      Seen from the side, Tidy's arm is two links: an upper arm $L_1 = 0.4$ ft from the shoulder to the elbow, and a forearm $L_2 = 0.3$ ft from the elbow to the gripper. The shoulder angle $\theta_1$ is measured from horizontal; the elbow angle $\theta_2$ is measured from the line of the upper arm.

      **Forward kinematics** turns joint angles into the position of the **end effector**, the working tip (here, the gripper). Add the two links as arrows:

      $$x = L_1\cos\theta_1 + L_2\cos(\theta_1 + \theta_2), \qquad y = L_1\sin\theta_1 + L_2\sin(\theta_1 + \theta_2)$$

      Take $\theta_1 = 30°$ and $\theta_2 = 60°$, so the forearm points at $30° + 60° = 90°$, straight up:

      | | Upper arm | Forearm | Gripper |
      | --- | ---: | ---: | ---: |
      | $x$ | $0.4 \cos 30° = 0.346$ | $0.3 \cos 90° = 0$ | 0.346 |
      | $y$ | $0.4 \sin 30° = 0.2$ | $0.3 \sin 90° = 0.3$ | 0.5 |

      The gripper is at $(0.346, 0.5)$ ft from the shoulder, just where a mug sits on the shelf.

      :::predict Straighten the elbow (θ2 = 0°) and keep θ1 = 30°. Where is the gripper?
      Both links now point at 30°, so the arm acts like one 0.7 ft link: $(0.7\cos 30°,\; 0.7\sin 30°) = (0.606, 0.35)$. That's as far as the arm reaches in that direction.
      :::
    bridges: []
  - id: kinematics-and-motion-planning.inverse
    title: Two ways to reach, or none
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.kinematics-and-motion-planning
    markdown: |-
      The real question runs backwards. The camera found the mug at $(0.346, 0.5)$; which joint angles put the gripper there? That's **inverse kinematics (IK)**.

      Start with the elbow. The distance from shoulder to target, $r$, depends only on how bent the elbow is. The law of cosines gives:

      $$\cos\theta_2 = \frac{x^2 + y^2 - L_1^2 - L_2^2}{2 L_1 L_2} = \frac{0.37 - 0.16 - 0.09}{0.24} = 0.5$$

      Both $\theta_2 = +60°$ and $\theta_2 = -60°$ have cosine 0.5, so there are **two solutions**: elbow down ($\theta_1 = 30°$, $\theta_2 = 60°$) and elbow up ($\theta_1 = 80.57°$, $\theta_2 = -60°$). Both put the gripper exactly on the mug. A planner picks the one that keeps the elbow clear of the shelf.

      Now try a mug at $(0.8, 0)$: $\cos\theta_2 = (0.64 - 0.25)/0.24 = 1.625$. No angle has a cosine above 1, so **no solution** exists. The arm reaches at most $L_1 + L_2 = 0.7$ ft (and at least $0.4 - 0.3 = 0.1$ ft). Tidy must drive closer first.

      ```python run
      import math

      L1, L2 = 0.4, 0.3                       # Tidy's upper arm and forearm (ft)

      def fk(t1, t2):
          """Joint angles (degrees) -> gripper position (ft)."""
          a, b = math.radians(t1), math.radians(t1 + t2)
          return L1 * math.cos(a) + L2 * math.cos(b), L1 * math.sin(a) + L2 * math.sin(b)

      def ik(x, y):
          """Gripper position -> both joint-angle solutions, or None if unreachable."""
          c2 = (x * x + y * y - L1**2 - L2**2) / (2 * L1 * L2)
          if abs(c2) > 1:
              return None                      # too far (or too close) for any elbow angle
          sols = []
          for t2 in (math.acos(c2), -math.acos(c2)):
              t1 = math.atan2(y, x) - math.atan2(L2 * math.sin(t2), L1 + L2 * math.cos(t2))
              sols.append((round(math.degrees(t1), 2), round(math.degrees(t2), 2)))
          return sols

      x, y = fk(30, 60)
      print(f"FK(30°, 60°) = ({x:.4f}, {y:.4f})")
      print("IK of that point:", ik(x, y))
      print("IK of (0.8, 0):  ", ik(0.8, 0))
      ```

      Try `ik(0.7, 0)`: the two solutions merge into one, with the arm dead straight. Then try `ik(0.05, 0)`, too close to the shoulder.

      :::mixup "Inverse kinematics is just forward kinematics run backwards, so there's always one answer."
      Forward kinematics always has exactly one answer. The inverse can have two (as here), infinitely many (a 7-joint arm can swing its elbow while the gripper stays still), or none (out of reach). Joint limits then rule some out.
      :::
    bridges: []
  - id: kinematics-and-motion-planning.jacobian
    title: Small turns, small moves
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.kinematics-and-motion-planning
    markdown: |-
      To slide the gripper smoothly toward the mug, a controller needs to know how a *tiny* change in each joint moves the tip. Those rates form the **Jacobian** matrix $J$, with $\Delta p \approx J\,\Delta\theta$ (angles in radians):

      $$J = \begin{bmatrix} -L_1 \sin\theta_1 - L_2 \sin(\theta_1{+}\theta_2) & -L_2 \sin(\theta_1{+}\theta_2) \\ L_1 \cos\theta_1 + L_2 \cos(\theta_1{+}\theta_2) & L_2 \cos(\theta_1{+}\theta_2) \end{bmatrix} = \begin{bmatrix} -0.5 & -0.3 \\ 0.346 & 0 \end{bmatrix}$$

      at our pose (30°, 60°). Turn the elbow by 0.01 rad and the gripper moves $(-0.003, 0)$: 0.003 ft straight back, since the forearm points up. Turn the shoulder by 0.01 rad and it moves $(-0.005, 0.0035)$.

      When the arm is fully stretched ($\theta_2 = 0$), both joints can only swing the tip sideways; nothing moves it further out. The Jacobian's determinant, $L_1 L_2 \sin\theta_2$, drops to zero: the matrix **loses rank**, because its two columns now point the same way. That's a **singularity**, and near one, small tip motions demand huge joint speeds. Controllers steer around them.
    bridges: []
  - id: kinematics-and-motion-planning.s2
    title: Search the space of arm poses
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.kinematics-and-motion-planning
    markdown: |-
      To move the mug from one side of a shelf post to the other, Tidy must avoid hitting the post with *any* part of the arm. Checking that in the room is awkward. So planners work in **configuration space (C-space)**: one axis per joint. Each point $(\theta_1, \theta_2)$ is an entire arm pose, and the poses where some part of the arm would touch the post form a forbidden region. Planning becomes: find a line from the start point to the goal point that stays out of the forbidden regions.

      With two joints, you could chop C-space into a 1° grid ($360 \times 360 \approx 130{,}000$ cells) and run the A\* search from module 5. A 7-joint arm at 1° has $360^7 \approx 7.8 \times 10^{17}$ cells. No grid search will finish.

      **Sampling-based planners** skip the grid. The **rapidly exploring random tree (RRT)** (LaValle, 1998) grows a tree from the start: pick a random configuration, find the nearest tree node, step 10° toward the sample, and keep the step if it's collision-free. A tree node at the edge of a big unexplored gap is the nearest node to many possible samples, so it gets extended often and the tree spreads fast. Below, the shelf blocks $70° \le \theta_1 \le 110°$ for elbow angles from 0° to 120°:

      ```python run
      import numpy as np

      rng = np.random.default_rng(4)
      start, goal = np.array([20.0, 30.0]), np.array([160.0, 30.0])   # (θ1, θ2) in degrees
      def blocked(q):            # configurations where the forearm would hit the shelf
          return 70 <= q[0] <= 110 and 0 <= q[1] <= 120
      def edge_free(a, b):       # check 20 points along the straight move from a to b
          return not any(blocked(a + t * (b - a)) for t in np.linspace(0, 1, 20))

      nodes, parent = [start], {0: None}
      for i in range(5000):
          sample = goal if rng.random() < 0.1 else rng.uniform(0, 180, 2)   # 10% of the time, aim at the goal
          near = min(range(len(nodes)), key=lambda k: np.linalg.norm(nodes[k] - sample))
          step = sample - nodes[near]
          new = nodes[near] + step * min(1.0, 10.0 / np.linalg.norm(step))    # grow at most 10°
          if edge_free(nodes[near], new):
              nodes.append(new); parent[len(nodes) - 1] = near
              if np.linalg.norm(new - goal) < 1e-9:
                  break

      path, k = [], len(nodes) - 1
      while k is not None:
          path.append(nodes[k]); k = parent[k]
      path = path[::-1]
      length = sum(np.linalg.norm(b - a) for a, b in zip(path, path[1:]))
      print(f"tree size: {len(nodes)} nodes after {i + 1} samples")
      print(f"path: {len(path)} waypoints, {length:.0f}° of joint motion")
      print("highest θ2 on the path:", round(max(q[1] for q in path)), "degrees")
      ```

      The tree finds a way over the shelf (the elbow rises to 150°) after 141 samples. The path is wobbly: 339° of joint motion, where the best route over the corner is about 246°. Real planners shortcut the path afterward, or use RRT\* (Karaman & Frazzoli, 2011), which keeps rewiring the tree toward shorter paths. Change the seed and you'll get a different, equally valid path.
    bridges: []
  - id: kinematics-and-motion-planning.s3
    title: A path isn't a schedule
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.kinematics-and-motion-planning
    markdown: |-
      The RRT returns a **path**: a sequence of poses. The motors need a **trajectory**: those poses with times attached, so every joint knows how fast to move at each instant. A full mug limits the answer: accelerate too hard and the coffee sloshes out. So the timing must respect speed, acceleration, and torque limits, even when the geometry is collision-free.
    bridges: []
  - id: kinematics-and-motion-planning.s4
    title: Leave a margin, then watch
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.kinematics-and-motion-planning
    markdown: |-
      Tidy's map of the shelf is off by a fraction of an inch, and its joints track the trajectory imperfectly. So its planner inflates every obstacle by a safety margin, say 0.03 ft, and the feedback controller from the control lesson follows the trajectory while the camera keeps watching. If someone moves the shelf post, Tidy stops and replans rather than finishing a plan made for yesterday's kitchen.
    bridges: []
  - id: kinematics-and-motion-planning.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.kinematics-and-motion-planning
    markdown: Compute gripper positions and elbow angles by hand, then plan for a 7-joint arm, an excavator, and a forklift taking a tight corner.
    takeaway: |-
      Forward kinematics adds link arrows to find the gripper; inverse kinematics can give two answers or none. Planners search configuration space, and in many dimensions random trees beat grids.
  - id: kinematics-and-motion-planning.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.kinematics-and-motion-planning
    markdown: |-
      Kinematics tells you which poses a robot can reach. Planning finds a route, and dynamics and timing determine whether the robot can execute it.
