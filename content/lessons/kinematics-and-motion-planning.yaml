        prompt: What does forward kinematics compute?
        options:
          - id: a
            text: Pose from joint configuration
          - id: b
            text: Joint values from every target uniquely
          - id: c
            text: The training reward automatically
        answer: a
        feedback: It applies the robot’s geometric model.
        retired: true
      - id: kinematics-and-motion-planning.base.2
        prompt: Can inverse kinematics have multiple solutions or no solution?
        options:
          - id: b
            text: 'No'
          - id: c
            text: Only for text-based agents
          - id: a
            text: 'Yes'
        answer: a
        feedback: Geometry and constraints determine reachability.
        retired: true
  - id: kinematics-and-motion-planning.transfer
    objective_ref: objective.kinematics-and-motion-planning
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Execute with feedback and margins: trace the inputs, operation, and result before choosing.'
    remediation_scene: kinematics-and-motion-planning.s4
    variants:
      - id: kinematics-and-motion-planning.transfer.1
        prompt: How does a trajectory add to a geometric path?
        options:
          - id: b
            text: It removes every obstacle
          - id: c
            text: It guarantees stable contact
          - id: a
            text: It specifies timing
        answer: a
        feedback: Dynamics depend on how motion unfolds over time.
        retired: true
      - id: kinematics-and-motion-planning.transfer.2
        prompt: Does collision-free geometry alone prove executable motion?
        options:
          - id: c
            text: Only if joints are numbered
          - id: a
            text: No; dynamic and actuator constraints also matter
          - id: b
            text: 'Yes'
        answer: a
        feedback: Physical feasibility requires more than geometric clearance.
        retired: true
  - id: kinematics-and-motion-planning.base.v2
    objective_ref: objective.kinematics-and-motion-planning
    task: base
    response_type: single_choice
    points: 1
    hint: "Picture the two links as arrows from the shoulder. The elbow's bend sets how far the tip is from the shoulder; the shoulder angle sets the direction."
    remediation_scene: kinematics-and-motion-planning.inverse
    variants:
      - id: kinematics-and-motion-planning.base.v2.1
        prompt: For a two-link arm, IK gives θ2 = +60° and θ2 = −60° for the same target. What do the two answers represent?
        options:
          - id: b
            text: One reaches the target and the other reaches its mirror image
          - id: a
            text: Elbow-down and elbow-up postures that both put the tip on the target
          - id: c
            text: An exact answer and a rounded approximation of that answer
        answer: a
        feedback: Both solutions put the gripper exactly on the target, with the elbow bent opposite ways (the shoulder angle changes to compensate). Checking with forward kinematics confirms both; neither is a mirror target or an approximation.
      - id: kinematics-and-motion-planning.base.v2.2
        prompt: An arm has links of 0.4 ft and 0.3 ft. A target sits 0.75 ft from the shoulder. What should inverse kinematics report?
        options:
          - id: c
            text: The elbow-up solution, since elbow-down would hit the table
          - id: b
            text: The straight-arm pose θ2 = 0°, since that is the closest it can get
          - id: a
            text: No solution, since the arm reaches at most 0.7 ft
        answer: a
        feedback: The formula gives cos θ2 above 1, so no joint angles reach the target; the robot must move closer. The straight arm gets nearest, but it doesn't reach the target, and reporting it as a solution hides the failure.
      - id: kinematics-and-motion-planning.base.v2.3
        prompt: With the arm stretched fully straight (θ2 = 0°), why can't small joint motions move the gripper straight outward?
        options:
          - id: a
            text: Both joints can only swing the tip sideways, so the Jacobian loses rank
          - id: b
            text: The motors reach their torque limits when the arm is fully extended
          - id: c
            text: Inverse kinematics has two solutions there, so the controller hesitates
        answer: a
        feedback: At full stretch both joints move the tip perpendicular to the arm, so the Jacobian's determinant L1·L2·sin θ2 is zero, a singularity. The two IK solutions actually merge into one there, and torque limits are a separate issue.
      - id: kinematics-and-motion-planning.base.v2.4
        prompt: Why do arm planners search configuration space rather than the room around the gripper?
        options:
          - id: b
            text: Configuration space has fewer dimensions than the room around the arm
          - id: c
            text: Obstacles vanish in configuration space, so every path is collision-free
          - id: a
            text: Each point in it is a whole arm pose, so collisions of any link are covered
        answer: a
        feedback: A collision depends on the whole arm, not just the gripper. In C-space the entire arm is one point, and forbidden poses form regions to avoid. C-space often has more dimensions than the room (7 for a 7-joint arm), and obstacles become forbidden regions rather than vanishing.
  - id: kinematics-and-motion-planning.transfer.v2
    objective_ref: objective.kinematics-and-motion-planning
    task: transfer
    response_type: single_choice
    points: 1
    hint: "Ask which layer the problem lives in: reachability (IK), finding a collision-free path (planning), or moving along it within limits (timing)."
    remediation_scene: kinematics-and-motion-planning.s2
    variants:
      - id: kinematics-and-motion-planning.transfer.v2.1
        prompt: A team wants to plan motions for a 7-joint arm with A* on a grid of 1° steps per joint. What is the main problem, and a standard alternative?
        options:
          - id: c
            text: A* ignores obstacles; switch to a 10° grid so they show up clearly
          - id: a
            text: The grid has about 10¹⁸ cells; use a sampling-based planner such as RRT
          - id: b
            text: A* can't handle angles; convert every joint angle to x and y first
        answer: a
        feedback: 360⁷ ≈ 7.8 × 10¹⁷ cells is far too many to search. Sampling-based planners explore without building the grid. A 10° grid still has 36⁷ ≈ 7.8 × 10¹⁰ cells, and A* handles obstacles and angles fine.
      - id: kinematics-and-motion-planning.transfer.v2.2
        prompt: An RRT returns a valid but zigzagging path for a painting robot's arm. What is a sensible next step?
        options:
          - id: a
            text: Shortcut and smooth the path, or plan with RRT* instead
          - id: b
            text: Rerun the same RRT with ten times as many samples
          - id: c
            text: Switch to forward kinematics, which gives straight paths
        answer: a
        feedback: Plain RRT stops at the first path it finds, so more samples don't make that path shorter. Shortcutting removes detours, and RRT* keeps rewiring toward shorter paths. Forward kinematics computes positions; it doesn't plan.
      - id: kinematics-and-motion-planning.transfer.v2.3
        prompt: A forklift's planned path clears every rack, but at its normal speed the forklift can't make one tight corner without tipping its load. What should change?
        options:
          - id: b
            text: Inflate the racks' safety margins so the path swings wider
          - id: c
            text: Recompute the inverse kinematics of the forklift's mast
          - id: a
            text: Time the path with speed and acceleration limits, slowing for the corner
        answer: a
        feedback: The geometry is fine; the timing isn't. Turning a path into a trajectory with speed and acceleration limits slows the forklift at the corner. Wider margins may still leave a tight turn, and the mast's kinematics don't affect cornering.
      - id: kinematics-and-motion-planning.transfer.v2.4
        prompt: An excavator's controller reaches for a spot with the boom's elbow bent so that the arm hits the cab. The same bucket position is reachable another way. What should the controller do?
        options:
          - id: c
            text: Report the spot as unreachable and ask the operator to move the tracks
          - id: a
            text: Use the other IK solution, reaching the spot with the elbow bent the other way
          - id: b
            text: Straighten the elbow fully, which keeps the arm furthest from the cab
        answer: a
        feedback: Two-link reaching usually has two IK solutions; if one collides, try the other. The spot is reachable, so moving the tracks is unnecessary, and a fully straight arm puts the bucket somewhere else entirely.
  - id: kinematics-and-motion-planning.fk
    objective_ref: objective.kinematics-and-motion-planning
    task: base
    response_type: numeric
    points: 1
    hint: "x = L1 cos θ1 + L2 cos(θ1 + θ2) and y = L1 sin θ1 + L2 sin(θ1 + θ2). The forearm's direction is θ1 + θ2."
    remediation_scene: kinematics-and-motion-planning.s1
    absolute_tolerance: 0.01
    variants:
      - id: kinematics-and-motion-planning.fk.1
        prompt: A two-link arm has L1 = 0.4 ft and L2 = 0.3 ft. With θ1 = 0° and θ2 = 90°, what is the gripper's y-coordinate, in feet?
        answer: 0.3
        feedback: "The upper arm points along x (y = 0), and the forearm points at 0° + 90° = 90°, straight up: y = 0 + 0.3 × sin 90° = 0.3 ft."
      - id: kinematics-and-motion-planning.fk.2
        prompt: A two-link arm has L1 = 0.4 ft and L2 = 0.3 ft. With θ1 = 90° and θ2 = 0°, what is the gripper's y-coordinate, in feet?
        answer: 0.7
        feedback: "Both links point straight up, so y = 0.4 + 0.3 = 0.7 ft."
      - id: kinematics-and-motion-planning.fk.3
        prompt: A two-link arm has L1 = 0.4 ft and L2 = 0.3 ft. With θ1 = 30° and θ2 = 0°, what is the gripper's x-coordinate, in feet?
        answer: 0.606
        feedback: "Both links point at 30°: x = 0.7 × cos 30° ≈ 0.7 × 0.866 = 0.606 ft."
      - id: kinematics-and-motion-planning.fk.4
        prompt: A two-link arm has L1 = 0.5 ft and L2 = 0.5 ft. With θ1 = 60° and θ2 = −60°, what is the gripper's x-coordinate, in feet?
        answer: 0.75
        feedback: "Upper arm: 0.5 × cos 60° = 0.25. The forearm points at 60° − 60° = 0°: 0.5 × cos 0° = 0.5. Total x = 0.75 ft."
      - id: kinematics-and-motion-planning.fk.5
        prompt: A two-link arm has L1 = 0.4 ft and L2 = 0.4 ft. With θ1 = 45° and θ2 = 45°, what is the gripper's x-coordinate, in feet?
        answer: 0.283
        feedback: "Upper arm: 0.4 × cos 45° ≈ 0.283. The forearm points at 90°, straight up, adding 0 to x. Total x ≈ 0.283 ft."
  - id: kinematics-and-motion-planning.ik
    objective_ref: objective.kinematics-and-motion-planning
    task: base
    response_type: numeric
    points: 1
    hint: "Use cos θ2 = (x² + y² − L1² − L2²) / (2 L1 L2), then take the angle whose cosine that is. The elbow angle depends only on the distance to the target."
    remediation_scene: kinematics-and-motion-planning.inverse
    absolute_tolerance: 0.5
    variants:
      - id: kinematics-and-motion-planning.ik.1
        prompt: A two-link arm has L1 = 0.4 ft and L2 = 0.3 ft. The target is (0.5, 0) ft. What is the elbow angle θ2 of the elbow-down solution, in degrees (a positive number)?
        answer: 90
        feedback: "cos θ2 = (0.25 − 0.16 − 0.09) / 0.24 = 0, so θ2 = 90°. The 0.3-0.4-0.5 triangle has a right angle at the elbow."
      - id: kinematics-and-motion-planning.ik.2
        prompt: A two-link arm has L1 = 0.5 ft and L2 = 0.5 ft. The target is (0.5, 0) ft. What is the elbow angle θ2 of the elbow-down solution, in degrees (a positive number)?
        answer: 120
        feedback: "cos θ2 = (0.25 − 0.25 − 0.25) / 0.5 = −0.5, so θ2 = 120°. The target is close, so the elbow folds sharply."
      - id: kinematics-and-motion-planning.ik.3
        prompt: A two-link arm has L1 = 0.4 ft and L2 = 0.3 ft. The target is (0.7, 0) ft. What is the elbow angle θ2, in degrees?
        answer: 0
        feedback: "cos θ2 = (0.49 − 0.25) / 0.24 = 1, so θ2 = 0°: the arm is fully straight, at the edge of its reach, and the two solutions merge."
      - id: kinematics-and-motion-planning.ik.4
        prompt: A two-link arm has L1 = 0.4 ft and L2 = 0.3 ft. The target is (0.6, 0.1) ft. What is the elbow angle θ2 of the elbow-down solution, in degrees (a positive number)?
        answer: 60
