schema_version: 0.2-draft
lesson:
  id: kinematics-and-motion-planning
  version: 0.1.0-draft
  title: Turn a desired pose into feasible movement
  state: draft
  summary: Kinematics relates joint configurations to body poses, while motion planning searches collision-free
    configurations or trajectories; reachability, dynamics, and uncertainty constrain executable plans.
  slot: M30.4
  category: learning
  minutes: 12
  sources:
  - title: Modern Robotics — authors’ textbook and resources
    url: https://modernrobotics.northwestern.edu/nu-gm-book-resource/
  - title: Planning Algorithms — author’s book
    url: https://lavalle.pl/planning/
objectives:
- id: objective.kinematics-and-motion-planning
  version: 1-draft
  statement: Kinematics relates joint configurations to body poses, while motion planning searches collision-free
    configurations or trajectories; reachability, dynamics, and uncertainty constrain executable plans.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - kinematics-and-motion-planning.base
  - kinematics-and-motion-planning.transfer
  prerequisites:
  - anyOf:
    - objective.robot-sensors-and-frames
  - anyOf:
    - objective.search-problems
  - anyOf:
    - objective.constraint-solving
scenes:
- id: kinematics-and-motion-planning.s1
  title: Map joints to geometry
  type: explanation
  depth: intuition
  objective_refs:
  - objective.kinematics-and-motion-planning
  markdown: Forward kinematics computes an end-effector pose from joint positions. Inverse kinematics seeks joint
    positions producing a desired pose. A target can have multiple solutions or none, depending on geometry and
    joint limits. A valid pose solution is not yet a safe path to reach it.
  text_mode: Forward kinematics computes an end-effector pose from joint positions. Inverse kinematics seeks joint
    positions producing a desired pose. A target can have multiple solutions or none, depending on geometry and
    joint limits. A valid pose solution is not yet a safe path to reach it.
  bridges: []
- id: kinematics-and-motion-planning.s2
  title: Search configuration space
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.kinematics-and-motion-planning
  markdown: A configuration describes the robot’s joint values. Obstacles and self-collisions exclude regions of
    this space. Sampling-based planners such as probabilistic roadmaps or rapidly exploring random trees can search
    high-dimensional spaces without enumerating every configuration, under specific completeness and practical constraints.
  text_mode: A configuration describes the robot’s joint values. Obstacles and self-collisions exclude regions of
    this space. Sampling-based planners such as probabilistic roadmaps or rapidly exploring random trees can search
    high-dimensional spaces without enumerating every configuration, under specific completeness and practical constraints.
  bridges: []
- id: kinematics-and-motion-planning.s3
  title: Add timing and dynamics
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.kinematics-and-motion-planning
  markdown: A path specifies geometric progression; a trajectory adds timing. Velocity, acceleration, torque, contact,
    and balance constraints can make a collision-free geometric path physically infeasible. Manipulation also requires
    grasp and contact reasoning, not just placing a point at a coordinate.
  text_mode: A path specifies geometric progression; a trajectory adds timing. Velocity, acceleration, torque, contact,
    and balance constraints can make a collision-free geometric path physically infeasible. Manipulation also requires
    grasp and contact reasoning, not just placing a point at a coordinate.
  bridges: []
- id: kinematics-and-motion-planning.s4
  title: Execute with feedback and margins
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.kinematics-and-motion-planning
  markdown: Perception and actuation are uncertain, so plans need appropriate margins, monitoring, and replanning.
    Test in controlled environments and evaluate clearance, success, smoothness, and recovery. A simulated path
    that avoids idealized obstacles does not establish safety around unmodeled people or objects.
  text_mode: Perception and actuation are uncertain, so plans need appropriate margins, monitoring, and replanning.
    Test in controlled environments and evaluate clearance, success, smoothness, and recovery. A simulated path
    that avoids idealized obstacles does not establish safety around unmodeled people or objects.
  bridges: []
- id: kinematics-and-motion-planning.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.kinematics-and-motion-planning
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Kinematics relates joint configurations to body poses, while motion planning searches collision-free
    configurations or trajectories; reachability, dynamics, and uncertainty constrain executable plans.
