assessment_families:
  - id: kinematics-and-motion-planning.base
    objective_ref: objective.kinematics-and-motion-planning
    task: base
    response_type: single_choice
    points: 1
    hint: 'Search configuration space: trace the inputs, operation, and result before choosing.'
    remediation_scene: kinematics-and-motion-planning.s2
    variants:
