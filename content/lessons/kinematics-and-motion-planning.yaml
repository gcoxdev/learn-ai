  version: 0.4.0-draft
  title: Turn a desired pose into feasible movement
  state: draft
  summary: Tidy's arm can reach the same mug with its elbow up or down, and can't reach one 0.8 ft away at all. Work out both by hand, then grow a random tree around a shelf.
