schema_version: 0.2-draft
lesson:
  id: planning-under-uncertainty
  version: 0.1.0-draft
  title: Plan when you cannot see the whole state
  state: draft
  summary: Partial observability and uncertain action outcomes require plans that condition on observations or maintain
    beliefs, rather than assuming one perfectly known future.
  slot: M05.7
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.planning-under-uncertainty
  version: 1-draft
  statement: Partial observability and uncertain action outcomes require plans that condition on observations or
    maintain beliefs, rather than assuming one perfectly known future.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - planning-under-uncertainty.base
  - planning-under-uncertainty.transfer
  prerequisites:
  - anyOf:
    - objective.classical-planning
  - anyOf:
    - objective.probability
scenes:
- id: planning-under-uncertainty.s1
  title: A state and an observation differ
  type: explanation
  depth: intuition
  objective_refs:
  - objective.planning-under-uncertainty
  markdown: A robot may know its camera reading but not its exact location. The observation supplies evidence about
    a hidden state. A belief can represent several possible states and their probabilities. Planning from a single
    guessed state can fail when uncertainty changes which actions are safe or useful.
  text_mode: A robot may know its camera reading but not its exact location. The observation supplies evidence about
    a hidden state. A belief can represent several possible states and their probabilities. Planning from a single
    guessed state can fail when uncertainty changes which actions are safe or useful.
  bridges: []
- id: planning-under-uncertainty.s2
  title: An action can have several outcomes
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.planning-under-uncertainty
  markdown: A door-opening action may succeed, fail, or reveal that the door is locked. A contingent plan includes
    different next steps after different observations. An open-loop sequence commits to actions without using new
    feedback. Closed-loop behavior updates decisions as evidence arrives.
  text_mode: A door-opening action may succeed, fail, or reveal that the door is locked. A contingent plan includes
    different next steps after different observations. An open-loop sequence commits to actions without using new
    feedback. Closed-loop behavior updates decisions as evidence arrives.
  bridges:
  - probability
- id: planning-under-uncertainty.s3
  title: Value an information-gathering action
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.planning-under-uncertainty
  markdown: Suppose two corridors lead toward a goal but one may be blocked. Checking a sign costs time yet can
    prevent a long wrong turn. The value of information depends on whether the observation can change the later
    decision enough to justify its cost. More information is not automatically worth any price.
  text_mode: Suppose two corridors lead toward a goal but one may be blocked. Checking a sign costs time yet can
    prevent a long wrong turn. The value of information depends on whether the observation can change the later
    decision enough to justify its cost. More information is not automatically worth any price.
  bridges: []
- id: planning-under-uncertainty.s4
  title: Choose assumptions explicitly
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.planning-under-uncertainty
  markdown: Worst-case planning, expected-cost planning, and chance constraints treat uncertainty differently. Replanning
    can help with changed conditions, but does not excuse an inaccurate observation model or unlimited delay. Evaluate
    both action outcomes and the cost of sensing, waiting, and recovery.
  text_mode: Worst-case planning, expected-cost planning, and chance constraints treat uncertainty differently.
    Replanning can help with changed conditions, but does not excuse an inaccurate observation model or unlimited
    delay. Evaluate both action outcomes and the cost of sensing, waiting, and recovery.
  bridges: []
- id: planning-under-uncertainty.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.planning-under-uncertainty
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Partial observability and uncertain action outcomes require plans that condition on observations or
    maintain beliefs, rather than assuming one perfectly known future.
- id: planning-under-uncertainty.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.planning-under-uncertainty
  markdown: Partial observability and uncertain action outcomes require plans that condition on observations or
    maintain beliefs, rather than assuming one perfectly known future.
  text_mode: Partial observability and uncertain action outcomes require plans that condition on observations or
    maintain beliefs, rather than assuming one perfectly known future.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - planning-under-uncertainty.s1
    - planning-under-uncertainty.s2
    - planning-under-uncertainty.s3
    - planning-under-uncertainty.s4
    - planning-under-uncertainty.check
    gate_refs:
    - gate.core
  scene_aliases:
