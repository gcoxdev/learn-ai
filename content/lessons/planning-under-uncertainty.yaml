assessment_families:
- id: planning-under-uncertainty.base
  objective_ref: objective.planning-under-uncertainty
  task: base
  response_type: single_choice
  points: 1
  hint: 'An action can have several outcomes: trace the inputs, operation, and result before choosing.'
  remediation_scene: planning-under-uncertainty.s2
  variants:
  - id: planning-under-uncertainty.base.1
    prompt: What is a belief state used to represent?
    options:
    - id: a
      text: Uncertainty over possible underlying states
    - id: b
      text: Only one unquestioned observation
    - id: c
      text: A formal guarantee that sensors are perfect
    answer: a
    feedback: A belief summarizes what the agent knows or estimates about hidden state.
  - id: planning-under-uncertainty.base.2
    prompt: What distinguishes a contingent plan?
    options:
    - id: b
      text: It never branches
    - id: c
      text: It ignores all sensing
    - id: a
      text: Its next actions depend on observations or outcomes
    answer: a
    feedback: Contingent planning explicitly handles alternative futures.
- id: planning-under-uncertainty.transfer
  objective_ref: objective.planning-under-uncertainty
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Choose assumptions explicitly: trace the inputs, operation, and result before choosing.'
  remediation_scene: planning-under-uncertainty.s4
  variants:
  - id: planning-under-uncertainty.transfer.1
    prompt: A measurement cannot affect any later choice. Must it have positive decision value?
    options:
    - id: b
      text: Yes; every observation has unlimited value
    - id: c
      text: Only if stored permanently
    - id: a
      text: No; information is useful relative to decisions and costs
    answer: a
    feedback: Information value depends on how it changes expected outcomes.
  - id: planning-under-uncertainty.transfer.2
    prompt: A planner assumes every action succeeds, but failures are common. What needs revision?
    options:
    - id: c
      text: The definition of a byte
    - id: a
      text: The transition model and recovery policy
    - id: b
      text: Only the chart labels
    answer: a
    feedback: Uncertain outcomes must enter the planning and execution assumptions.
