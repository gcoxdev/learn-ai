      gate_refs:
        - gate.core
  scene_aliases:
    planning-under-uncertainty.recap: planning-under-uncertainty.check
assessment_families:
  - id: planning-under-uncertainty.base
    objective_ref: objective.planning-under-uncertainty
    task: base
    response_type: single_choice
    points: 1
    hint: 'An action can have several outcomes: trace the inputs, operation, and result before choosing.'
    remediation_scene: planning-under-uncertainty.s2
    variants:
      - id: planning-under-uncertainty.base.1
        prompt: What is a belief state used to represent?
        options:
          - id: a
            text: Uncertainty over possible underlying states
          - id: b
            text: Only one unquestioned observation
          - id: c
            text: A formal guarantee that sensors are perfect
        answer: a
        feedback: A belief summarizes what the agent knows or estimates about hidden state.
        retired: true
      - id: planning-under-uncertainty.base.2
        prompt: What distinguishes a contingent plan?
        options:
          - id: b
            text: It never branches
          - id: c
            text: It ignores all sensing
          - id: a
            text: Its next actions depend on observations or outcomes
        answer: a
        feedback: Contingent planning explicitly handles alternative futures.
        retired: true
  - id: planning-under-uncertainty.transfer
    objective_ref: objective.planning-under-uncertainty
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Choose assumptions explicitly: trace the inputs, operation, and result before choosing.'
    remediation_scene: planning-under-uncertainty.s4
    variants:
      - id: planning-under-uncertainty.transfer.1
        prompt: A measurement cannot affect any later choice. Must it have positive decision value?
        options:
          - id: b
            text: Yes; every observation has unlimited value
          - id: c
            text: Only if stored permanently
          - id: a
            text: No; information is useful relative to decisions and costs
        answer: a
        feedback: Information value depends on how it changes expected outcomes.
        retired: true
      - id: planning-under-uncertainty.transfer.2
        prompt: A planner assumes every action succeeds, but failures are common. What needs revision?
        options:
          - id: c
            text: The definition of a byte
          - id: a
            text: The transition model and recovery policy
          - id: b
            text: Only the chart labels
        answer: a
        feedback: Uncertain outcomes must enter the planning and execution assumptions.
        retired: true
  - id: planning-under-uncertainty.base.v2
    objective_ref: objective.planning-under-uncertainty
    task: base
    response_type: single_choice
    points: 1
    hint: Weight each outcome by its probability. An observation is worth something only in the cases where it would change what you do.
    remediation_scene: planning-under-uncertainty.s3
    variants:
      - id: planning-under-uncertainty.base.v2.1
        prompt: A cleaning robot can't tell whether it's in Room A or Room B, which look identical. It thinks each is equally likely. What is its belief state?
        options:
          - id: b
            text: Whichever room it guessed most recently
          - id: a
            text: Probability 0.5 for Room A and 0.5 for Room B
          - id: c
            text: The camera image it is receiving right now
        answer: a
        feedback: A belief state is a probability for each possible hidden state. A single guess throws away the uncertainty, and the camera image is an observation, evidence about the state rather than the state itself.
      - id: planning-under-uncertainty.base.v2.2
        prompt: Which of these delivery plans is contingent?
        options:
          - id: c
            text: Take the elevator, ride to floor 5, then deliver
          - id: b
            text: Take the ramp every time, whatever the elevator does
          - id: a
            text: Check the screen, then pick the elevator or ramp
        answer: a
        feedback: A contingent plan chooses its next action from what it observes. The other two are fixed lists that never look at the world.
      - id: planning-under-uncertainty.base.v2.3
        prompt: Route X takes 5 minutes with probability 0.8 and 15 minutes with probability 0.2. What is its expected time?
        options:
          - id: a
            text: 7 minutes
          - id: b
            text: 10 minutes
          - id: c
            text: 5 minutes
        answer: a
        feedback: 0.8 × 5 + 0.2 × 15 = 4 + 3 = 7. Averaging 5 and 15 equally (10) ignores the probabilities, and 5 is only the most likely outcome.
      - id: planning-under-uncertainty.base.v2.4
        prompt: 'Before a sensor reading, a robot believes the elevator works with probability 0.5. It hears a hum; P(hum | works) = 0.8 and P(hum | broken) = 0.2. What is its new belief that the elevator works?'
        options:
          - id: c
            text: '0.64'
          - id: b
            text: '0.5'
          - id: a
            text: '0.8'
        answer: a
        feedback: (0.5 × 0.8) / (0.5 × 0.8 + 0.5 × 0.2) = 0.4 / 0.5 = 0.8. Staying at 0.5 ignores the evidence, and 0.64 multiplies the likelihoods without normalizing.
        retired: true
      - id: planning-under-uncertainty.base.v2.6
        prompt: 'Before a sensor reading, a robot believes the elevator works with probability 0.6. It hears a hum; P(hum | works) = 0.9 and P(hum | broken) = 0.3. What is its new belief that the elevator works?'
        options:
          - id: b
            text: '0.90'
          - id: c
            text: '0.54'
          - id: a
            text: '0.82'
        answer: a
        feedback: (0.6 × 0.9) / (0.6 × 0.9 + 0.4 × 0.3) = 0.54 / 0.66 ≈ 0.82. 0.90 is the chance of a hum given a working elevator, not the chance it works given a hum, and 0.54 forgets to divide by the total chance of a hum.
      - id: planning-under-uncertainty.base.v2.5
        prompt: Whatever a sensor reports, the robot's best next action stays the same. What is that reading worth for this decision?
        options:
          - id: b
            text: What the sensor costs to read
          - id: a
            text: Zero, since no reading changes the choice
          - id: c
            text: More the more accurate the sensor is
        answer: a
        feedback: Information pays off only by changing actions. If no reading changes the choice, the expected outcome is the same with or without it. Its cost is what you'd lose by reading it, not what it's worth.
  - id: planning-under-uncertainty.transfer.v2
    objective_ref: objective.planning-under-uncertainty
    task: transfer
    response_type: single_choice
    points: 1
    hint: Decide what you're promising (the best average, the best worst case, or a cap on the chance of failure), then compare what sensing costs with what it saves.
    remediation_scene: planning-under-uncertainty.s4
    variants:
      - id: planning-under-uncertainty.transfer.v2.1
        prompt: An ambulance service must reach 99% of calls within 8 minutes. Which way of judging routes fits that requirement?
        options:
          - id: b
            text: Pick the route with the lowest average time
          - id: c
            text: Pick the route with the fewest turns
          - id: a
            text: Cap the chance of arriving later than 8 minutes
        answer: a
        feedback: A deadline met with a set probability is a chance constraint. A route with a great average can still be late too often.
      - id: planning-under-uncertainty.transfer.v2.2
        prompt: Checking a weather report costs a delivery drone 2 minutes. It changes the route only on stormy days (10% of days), and then saves 15 minutes. Should the drone check?
        options:
          - id: a
            text: No; it saves 1.5 minutes on average but costs 2
          - id: b
            text: Yes; storms cost 15 minutes, far more than 2
          - id: c
            text: Yes; more information leads to better plans
        answer: a
        feedback: The check changes the action only 10% of the time, so it's worth 0.1 × 15 = 1.5 minutes on average, less than its 2-minute cost. Comparing the full 15 minutes with 2 forgets the probability.
      - id: planning-under-uncertainty.transfer.v2.3
        prompt: A Mars rover can't be rescued if it gets stuck. Which way of judging its driving plans fits best?
        options:
          - id: c
            text: Lowest expected driving time per day
          - id: a
            text: Best outcome in the worst case
          - id: b
            text: Most ground covered on a typical day
        answer: a
        feedback: When one bad outcome ends the mission, planning for the worst case makes sense. Average-based criteria happily accept a small chance of disaster in exchange for speed.
      - id: planning-under-uncertainty.transfer.v2.4
        prompt: A shelf-stocking robot follows a fixed list of moves. When a box is out of place it carries on and knocks items off the shelf. Which change targets this?
        options:
          - id: b
            text: Make the list of moves longer and more detailed
          - id: c
            text: Run through the list faster so errors have less time
          - id: a
            text: Choose each move from what the sensors report
        answer: a
        feedback: The robot is running open-loop. Closing the loop, so each move depends on fresh observations, lets it react to the misplaced box. A longer or faster list still can't notice anything.
      - id: planning-under-uncertainty.transfer.v2.5
        prompt: A self-driving car's camera view is partly blocked by a parked van. Its belief is 0.9 "no pedestrian" and 0.1 "pedestrian behind the van." What should its planner work with?
        options:
          - id: a
            text: The whole belief, including the 10% chance
          - id: c
            text: The single most likely state, no pedestrian
          - id: b
            text: Only what the camera can see directly
        answer: a
        feedback: Planning on the full belief lets the car slow down for the 10% case, where a mistake would be very costly. Acting as if the most likely state were certain throws that risk away.
  - id: planning-under-uncertainty.calc.v2
    objective_ref: objective.planning-under-uncertainty
    task: base
    response_type: numeric_fields_with_reason
    points: 1
    hint: Without the check, take the lower of the elevator's expected time and the ramp's time. With a perfect check, use the elevator when it works and the ramp when it's broken. The value of the check is the difference.
    remediation_scene: planning-under-uncertainty.s3
    absolute_tolerance: 0.01
    numeric_fields:
      - id: without
        label: Best expected minutes without the check
      - id: with
        label: Expected minutes with a free, perfect check
      - id: value
        label: Value of the check (minutes)
    variants:
      - id: planning-under-uncertainty.calc.v2.1
        prompt: 'The elevator takes 4 minutes if it works. If it''s broken (probability 0.6), the robot finds out at the door and the trip takes 12 minutes. The ramp always takes 10 minutes. Record the three values.'
        feedback: 'Without: elevator 0.4 × 4 + 0.6 × 12 = 8.8, which beats the ramp''s 10. With: 0.4 × 4 + 0.6 × 10 = 7.6. Value: 8.8 − 7.6 = 1.2 minutes.'
        answers:
          without: 8.8
          with: 7.6
          value: 1.2
        reason_answer: change
        reason_options:
          - id: change
            text: The check helps only when it changes the route, when the elevator is broken.
          - id: whole
            text: The check is worth the full time lost when the elevator is broken.
          - id: best
            text: The check is worth the time of the fastest route.
      - id: planning-under-uncertainty.calc.v2.2
        prompt: 'The elevator takes 5 minutes if it works. If it''s broken (probability 0.2), the trip takes 15 minutes. The ramp always takes 12 minutes. Record the three values.'
        feedback: 'Without: 0.8 × 5 + 0.2 × 15 = 7, which beats 12. With: 0.8 × 5 + 0.2 × 12 = 6.4. Value: 0.6 minutes, which is 0.2 × (15 − 12).'
        answers:
          without: 7
          with: 6.4
          value: 0.6
        reason_answer: change
        reason_options:
          - id: whole
            text: The check is worth the full time lost when the elevator is broken.
          - id: change
            text: The check helps only when it changes the route, when the elevator is broken.
          - id: best
            text: The check is worth the time of the fastest route.
      - id: planning-under-uncertainty.calc.v2.3
        prompt: 'The elevator takes 3 minutes if it works. If it''s broken (probability 0.5), the trip takes 11 minutes. The ramp always takes 8 minutes. Record the three values.'
        feedback: 'Without: 0.5 × 3 + 0.5 × 11 = 7, which beats 8. With: 0.5 × 3 + 0.5 × 8 = 5.5. Value: 1.5 minutes, which is 0.5 × (11 − 8).'
        answers:
          without: 7
          with: 5.5
          value: 1.5
        reason_answer: change
        reason_options:
          - id: best
            text: The check is worth the time of the fastest route.
          - id: whole
            text: The check is worth the full time lost when the elevator is broken.
          - id: change
            text: The check helps only when it changes the route, when the elevator is broken.
      - id: planning-under-uncertainty.calc.v2.4
        prompt: 'The elevator takes 6 minutes if it works. If it''s broken (probability 0.1), the trip takes 16 minutes. The ramp always takes 9 minutes. Record the three values.'
        feedback: 'Without: 0.9 × 6 + 0.1 × 16 = 7, which beats 9. With: 0.9 × 6 + 0.1 × 9 = 6.3. Value: 0.7 minutes, which is 0.1 × (16 − 9).'
        answers:
          without: 7
          with: 6.3
          value: 0.7
        reason_answer: change
        reason_options:
          - id: change
            text: The check helps only when it changes the route, when the elevator is broken.
          - id: best
            text: The check is worth the time of the fastest route.
          - id: whole
            text: The check is worth the full time lost when the elevator is broken.
      - id: planning-under-uncertainty.calc.v2.5
        prompt: 'The elevator takes 4 minutes if it works. If it''s broken (probability 0.8), the trip takes 12 minutes. The ramp always takes 10 minutes. Record the three values.'
        feedback: 'Without: the elevator expects 0.2 × 4 + 0.8 × 12 = 10.4, so the ramp''s 10 is better. With: 0.2 × 4 + 0.8 × 10 = 8.8. Value: 10 − 8.8 = 1.2 minutes. This time the check pays off when the elevator works, letting the robot skip the ramp.'
        answers:
          without: 10
          with: 8.8
          value: 1.2
        reason_answer: change
        reason_options:
          - id: whole
            text: The check is worth the full time lost when the elevator is broken.
          - id: change
            text: The check helps only when it changes the route it would otherwise take.
          - id: best
            text: The check is worth the time of the fastest route.
