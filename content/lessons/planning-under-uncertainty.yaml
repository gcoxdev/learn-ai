schema_version: 0.2-draft
lesson:
  id: planning-under-uncertainty
  version: 0.3.0-draft
  title: Plan when you cannot see the whole state
  state: draft
  summary: Choose whether to look before acting when a robot has an incomplete view of the world.
  slot: M05.7
  category: learning
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
objectives:
- id: objective.planning-under-uncertainty
  version: 1-draft
  statement: Partial observability and uncertain action outcomes require plans that condition on observations
    or maintain beliefs, rather than assuming one perfectly known future.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - planning-under-uncertainty.base
  - planning-under-uncertainty.transfer
  prerequisites:
  - anyOf:
    - objective.classical-planning
  - anyOf:
    - objective.probability
scenes:
- id: planning-under-uncertainty.s1
  title: A state and an observation differ
  type: explanation
  depth: intuition
  objective_refs:
  - objective.planning-under-uncertainty
  markdown: A robot may know its camera reading but not its exact location. The observation supplies evidence
    about a hidden state. A belief can represent several possible states and their probabilities. Planning
    from a single guessed state can fail when uncertainty changes which actions are safe or useful.
  text_mode: A robot may know its camera reading but not its exact location. The observation supplies evidence
    about a hidden state. A belief can represent several possible states and their probabilities. Planning
    from a single guessed state can fail when uncertainty changes which actions are safe or useful.
  bridges: []
- id: planning-under-uncertainty.s2
  title: An action can have several outcomes
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.planning-under-uncertainty
  markdown: A door-opening action may succeed, fail, or reveal that the door is locked. A contingent plan includes
    different next steps after different observations. An open-loop sequence commits to actions without using
    new feedback. Closed-loop behavior updates decisions as evidence arrives.
  text_mode: A door-opening action may succeed, fail, or reveal that the door is locked. A contingent plan
    includes different next steps after different observations. An open-loop sequence commits to actions without
    using new feedback. Closed-loop behavior updates decisions as evidence arrives.
  bridges:
  - probability
- id: planning-under-uncertainty.s3
  title: Value an information-gathering action
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.planning-under-uncertainty
  markdown: 'Suppose two corridors lead toward a goal but one may be blocked. Checking a sign costs time yet
    can prevent a long wrong turn. The value of information depends on whether the observation can change the
    later decision enough to justify its cost. More information is not automatically worth any price.


    Try an invented calculation. A wrong corridor adds 10 minutes, and before checking you have a one-half
    chance of choosing it. That is 5 extra minutes on average across repeated trips. A perfect sign that costs
    1 minute to check would reduce that expected extra time to 1 minute. If checking costs 6 minutes, it loses
    this time-only comparison. Real signs may be unreliable, so include their error rate too.'
  text_mode: 'Suppose two corridors lead toward a goal but one may be blocked. Checking a sign costs time yet
    can prevent a long wrong turn. The value of information depends on whether the observation can change the
    later decision enough to justify its cost. More information is not automatically worth any price.


    Try an invented calculation. A wrong corridor adds 10 minutes, and before checking you have a one-half
    chance of choosing it. That is 5 extra minutes on average across repeated trips. A perfect sign that costs
    1 minute to check would reduce that expected extra time to 1 minute. If checking costs 6 minutes, it loses
    this time-only comparison. Real signs may be unreliable, so include their error rate too.'
  bridges: []
- id: planning-under-uncertainty.s4
  title: Choose what kind of promise to make
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.planning-under-uncertainty
  markdown: '**Expected-cost** planning compares probability-weighted average costs. **Worst-case** planning
    prepares for the most costly allowed outcome. A **chance constraint** limits the modeled probability of
    a specified failure. These are different goals: a low average delay does not promise every trip will be
    short.


    Whichever criterion you choose, include time spent sensing, waiting, and recovering from mistakes. Replanning
    can respond to new evidence, but the result still depends on whether the observations and their uncertainty
    are modeled well.'
  text_mode: '**Expected-cost** planning compares probability-weighted average costs. **Worst-case** planning
    prepares for the most costly allowed outcome. A **chance constraint** limits the modeled probability of
    a specified failure. These are different goals: a low average delay does not promise every trip will be
    short.


    Whichever criterion you choose, include time spent sensing, waiting, and recovering from mistakes. Replanning
    can respond to new evidence, but the result still depends on whether the observations and their uncertainty
    are modeled well.'
  bridges: []
- id: planning-under-uncertainty.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.planning-under-uncertainty
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: When the state is uncertain, a plan may need to gather information and change its next action.
    Compare the value of that information with the time or resources it costs.
- id: planning-under-uncertainty.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.planning-under-uncertainty
  markdown: When the state is uncertain, a plan may need to gather information and change its next action.
    Compare the value of that information with the time or resources it costs.
  text_mode: When the state is uncertain, a plan may need to gather information and change its next action.
    Compare the value of that information with the time or resources it costs.
