schema_version: 0.2-draft
lesson:
  id: planning-under-uncertainty
  version: 0.4.0-draft
  title: Plan when you cannot see the whole state
  state: draft
  summary: A hospital robot can't tell whether the elevator works until it gets there. Should it check first? Work out exactly what a look is worth.
  slot: M05.7
  category: learning
  sources:
    - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
      url: https://aima.cs.berkeley.edu/
objectives:
  - id: objective.planning-under-uncertainty
    version: 3-draft
    statement: Partial observability and uncertain action outcomes require plans that condition on observations or maintain beliefs, rather than assuming one perfectly known future.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - planning-under-uncertainty.base.v2
      - planning-under-uncertainty.transfer.v2
      - planning-under-uncertainty.calc.v2
    prerequisites:
      - anyOf:
          - objective.classical-planning
      - anyOf:
          - objective.probability
scenes:
  - id: planning-under-uncertainty.s1
    title: The robot can't see the elevator
    type: explanation
    depth: intuition
    objective_refs:
      - objective.planning-under-uncertainty
    markdown: |-
      A hospital robot must carry medicine to Ward 5. It has two routes:

      | Route | If the elevator works | If the elevator is out of order |
      | --- | ---: | ---: |
      | Elevator | 4 minutes | 12 minutes (it finds out at the door, then takes the ramp) |
      | Ramp | 10 minutes | 10 minutes |

      Shakey's planner in the last lesson knew every fact. This robot doesn't: from its room it can't tell whether the elevator works. The true situation, the **hidden state**, is out of sight. What it gets instead are **observations**, sensor readings that are evidence about the hidden state but not the state itself.

      So the robot keeps a **belief state**: a probability for each state it might be in. From maintenance logs, the elevator is out of order about 30% of the time, so the robot starts with the belief {works: 0.7, broken: 0.3}.

      An observation updates the belief using Bayes' rule, as in the probability lesson. Suppose the robot hears a motor hum. A working elevator hums 90% of the time, and a broken one 20% of the time (a fan, say):

      $$P(\text{works} \mid \text{hum}) = \frac{0.7 \times 0.9}{0.7 \times 0.9 + 0.3 \times 0.2} = \frac{0.63}{0.69} \approx 0.91$$

      One hum raises the robot's confidence from 0.7 to 0.91. The robot still isn't certain, but it's much better informed.
    bridges:
      - probability
  - id: planning-under-uncertainty.s2
    title: Plans that branch on what they see
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.planning-under-uncertainty
    markdown: |-
      A classical plan is a fixed list: "go to the elevator, ride to floor 5, deliver." Carrying out a fixed list without looking is **open-loop** control. It works only if the world does exactly what the model predicted.

      Here, the same action (walking to the elevator) can lead to two different outcomes. A **contingent plan** branches on what the robot observes:

      - Check the status screen by the nurses' station.
      - If the elevator works, ride it (4 minutes).
      - If it's out of order, take the ramp (10 minutes).

      Acting on fresh observations like this is **closed-loop** control. It's how a good driver drives: not by memorizing every turn of the wheel, but by watching the road.

      When actions are uncertain at every step, the full version of this problem has names you'll meet again in the reinforcement-learning module: a **Markov decision process (MDP)** when the robot can always see its state, and a **POMDP** (partially observable MDP) when it has to act on beliefs. A POMDP's solution is a policy that maps each belief state to an action.
    diagram:
      caption: A contingent plan. The robot's next action depends on what the status screen shows.
      description: The robot sets off from its room carrying the medicine and checks the status screen. If the screen says the elevator works, the robot rides the elevator, a 4-minute trip. If the screen says it is out of order, the robot takes the ramp, a 10-minute trip. Both branches end at Ward 5.
      nodes:
        - id: start
          label: Robot sets off
          note: carrying medicine
          col: 0
          row: 1
        - id: check
          label: Check the screen
          note: an observation
          col: 1
          row: 1
          tone: accent
        - id: lift
          label: Ride the elevator
          note: 4 minutes
          col: 2
          row: 0
          tone: data
        - id: ramp
          label: Take the ramp
          note: 10 minutes
          col: 2
          row: 2
          tone: warn
        - id: ward
          label: Ward 5
          col: 3
          row: 1
      edges:
        - from: start
          to: check
        - from: check
          to: lift
          label: works
        - from: check
          to: ramp
          label: out of order
        - from: lift
          to: ward
        - from: ramp
          to: ward
    bridges:
      - probability
  - id: planning-under-uncertainty.s3
    title: What is a look worth?
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.planning-under-uncertainty
    markdown: |-
      Walking to the status screen costs 1 minute. Is it worth it? Compare expected times, weighting each outcome by its probability.

      **Without checking**, pick the better route on average:

      - Elevator: 0.7 × 4 + 0.3 × 12 = 2.8 + 3.6 = 6.4 minutes
      - Ramp: 10 minutes

      So the robot would take the elevator, expecting 6.4 minutes.

      **With a free, perfect check**, it takes the best route in each case: the elevator when it works, the ramp when it's broken.

      - 0.7 × 4 + 0.3 × 10 = 2.8 + 3.0 = 5.8 minutes

      The check saves 6.4 − 5.8 = 0.6 minutes on average: 36 seconds. That is the **expected value of perfect information** for this decision. Since the walk to the screen costs a full minute, the robot should skip it and head straight for the elevator.

      Notice where the saving comes from. When the elevator works, the check changes nothing: the robot would have taken the elevator anyway. Only in the broken case (probability 0.3) does it change the action, saving 12 − 10 = 2 minutes. So 0.3 × 2 = 0.6. **Information is worth something only in the situations where it would change what you do.**

      :::predict The elevator gets less reliable, and is now out of order 60% of the time. Is the 1-minute check worth it now?
      Yes. Without checking: elevator 0.4 × 4 + 0.6 × 12 = 8.8 minutes, still better than the ramp's 10. With a perfect check: 0.4 × 4 + 0.6 × 10 = 7.6 minutes. The check is now worth 8.8 − 7.6 = 1.2 minutes, more than the 1 minute it costs.
      :::

      :::papers Value of perfect information
      $$\text{VPI}(E) = \Big(\sum_{e} P(E = e)\, \max_a \text{EU}(a \mid E = e)\Big) - \max_a \text{EU}(a)$$
      $E$ is the thing you might observe (the elevator's status), EU is expected utility, and $a$ ranges over actions. Here utility is negative minutes: the first term is −5.8 (best action in each case, averaged) and the second is −6.4 (best action without knowing), so VPI = 0.6 minutes. It is never negative, and it is zero whenever no possible observation would change the best action.
      :::
    bridges: []
  - id: planning-under-uncertainty.s4
    title: Choose what kind of promise to make
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.planning-under-uncertainty
    markdown: |-
      "Best on average" is only one way to judge a plan. The same two routes look different under three standard criteria:

      | Criterion | Question it asks | Elevator | Ramp | Winner |
      | --- | --- | ---: | ---: | --- |
      | Expected cost | Lowest average time? | 6.4 min | 10 min | Elevator |
      | Worst case | Lowest time in the worst outcome? | 12 min | 10 min | Ramp |
      | **Chance constraint** | On time (11 min) at least 95% of trips? | 70% | 100% | Ramp |

      A chance constraint caps the probability of failure: here, missing an 11-minute deadline on no more than 5% of trips. The elevator arrives within 11 minutes only when it works, 70% of the time, so it fails the test.

      :::mixup "The plan with the lowest average time is the best plan."
      It's the best plan if you care only about the average. For a routine supply run, you should. For a medicine dose that must arrive within 11 minutes, the elevator's 30% chance of taking 12 minutes is unacceptable, and the steady ramp is the right choice even though it's slower on average.
      :::

      Pick the criterion first, then the plan. A delivery service might minimize expected time. An ambulance dispatcher works with deadlines, and a Mars rover, which can't be rescued, leans toward the worst case.
    bridges: []
  - id: planning-under-uncertainty.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.planning-under-uncertainty
    markdown: Cleaning robots, drones, rovers, and self-driving cars ask you to update a belief, price a look, and pick the criterion that fits the stakes.
    takeaway: |-
      When you can't see the whole state, plan on a belief and branch on what you observe. A look is worth only what it saves in the cases where it would change your action, and the right plan depends on whether you care about the average, the worst case, or a deadline.
  - id: planning-under-uncertainty.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.planning-under-uncertainty
    markdown: |-
      When the state is uncertain, a plan may need to gather information and change its next action. Compare the value of that information with the time or resources it costs.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - planning-under-uncertainty.s1
        - planning-under-uncertainty.s2
        - planning-under-uncertainty.s3
        - planning-under-uncertainty.s4
