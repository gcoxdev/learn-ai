schema_version: 0.2-draft
lesson:
  id: application-security-boundaries
  version: 0.1.0-draft
  title: Protect tools and sensitive data around the model
  state: draft
  summary: Language-model application security depends on trust boundaries, least-privilege tools, output handling,
    and data isolation; prompt injection exploits confusion between external content and authorized instructions.
  slot: M29.5
  category: learning
  minutes: 12
  sources:
  - title: Indirect Prompt Injection
    url: https://arxiv.org/abs/2302.12173
  - title: NIST AI Risk Management Framework
    url: https://www.nist.gov/itl/ai-risk-management-framework
objectives:
- id: objective.application-security-boundaries
  version: 1-draft
  statement: Language-model application security depends on trust boundaries, least-privilege tools, output handling,
    and data isolation; prompt injection exploits confusion between external content and authorized instructions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - application-security-boundaries.base
  - application-security-boundaries.transfer
  prerequisites:
  - anyOf:
    - objective.agent-permissions-and-untrusted-input
  - anyOf:
    - objective.retrieval-boundaries-and-failures
scenes:
- id: application-security-boundaries.s1
  title: Follow the data and authority paths
  type: explanation
  depth: intuition
  objective_refs:
  - objective.application-security-boundaries
  markdown: A request may cross a browser, application server, model service, retriever, and external tools. Identify
    who controls each input and which component authorizes actions. The model’s generated text can be useful while
    remaining untrusted for privileged execution.
  text_mode: A request may cross a browser, application server, model service, retriever, and external tools. Identify
    who controls each input and which component authorizes actions. The model’s generated text can be useful while
    remaining untrusted for privileged execution.
  bridges: []
- id: application-security-boundaries.s2
  title: Treat injection as a boundary problem
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.application-security-boundaries
  markdown: A document might request that the model ignore its task or reveal unrelated data. The application must
    prevent that text from acquiring tool authority. Instruction hierarchy and filtering can help, but enforcement
    should also constrain actual destinations, resources, and operations.
  text_mode: A document might request that the model ignore its task or reveal unrelated data. The application must
    prevent that text from acquiring tool authority. Instruction hierarchy and filtering can help, but enforcement
    should also constrain actual destinations, resources, and operations.
  bridges: []
- id: application-security-boundaries.s3
  title: Validate generated outputs at their use site
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.application-security-boundaries
  markdown: Text inserted into a webpage, database query, shell command, or tool argument needs the appropriate
    structured interface and escaping or validation. A refusal-tuned model is not a replacement for these software
    controls. Schema-valid output may still violate semantic or authorization rules.
  text_mode: Text inserted into a webpage, database query, shell command, or tool argument needs the appropriate
    structured interface and escaping or validation. A refusal-tuned model is not a replacement for these software
    controls. Schema-valid output may still violate semantic or authorization rules.
  bridges: []
- id: application-security-boundaries.s4
  title: Test realistic chained failures
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.application-security-boundaries
  markdown: A retrieved passage can influence a tool call that accesses a cache containing another user’s data.
    Test components together with synthetic secrets and bounded operations. Preserve useful traces, scope credentials
    narrowly, and verify that errors fail within the intended boundary rather than silently broadening access.
  text_mode: A retrieved passage can influence a tool call that accesses a cache containing another user’s data.
    Test components together with synthetic secrets and bounded operations. Preserve useful traces, scope credentials
    narrowly, and verify that errors fail within the intended boundary rather than silently broadening access.
  bridges: []
- id: application-security-boundaries.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.application-security-boundaries
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Language-model application security depends on trust boundaries, least-privilege tools, output handling,
    and data isolation; prompt injection exploits confusion between external content and authorized instructions.
- id: application-security-boundaries.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.application-security-boundaries
  markdown: Language-model application security depends on trust boundaries, least-privilege tools, output handling,
    and data isolation; prompt injection exploits confusion between external content and authorized instructions.
  text_mode: Language-model application security depends on trust boundaries, least-privilege tools, output handling,
    and data isolation; prompt injection exploits confusion between external content and authorized instructions.
navigation:
  routes:
  - id: route.core
    scene_sequence:
