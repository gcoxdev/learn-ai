assessment_families:
  - id: application-security-boundaries.base
    objective_ref: objective.application-security-boundaries
    task: base
    response_type: single_choice
    points: 1
    hint: 'Treat injection as a boundary problem: trace the inputs, operation, and result before choosing.'
    remediation_scene: application-security-boundaries.s2
    variants:
      - id: application-security-boundaries.base.1
        prompt: Should generated text directly authorize a privileged operation?
        options:
          - id: a
            text: No; the execution layer must validate authority and scope
          - id: b
            text: Yes if it sounds certain
          - id: c
            text: Only if it contains a tool name
        answer: a
        feedback: Model output is not an authorization decision by itself.
        retired: true
      - id: application-security-boundaries.base.2
        prompt: What does prompt injection try to blur?
        options:
          - id: b
            text: Only the boundary between pixels
          - id: c
            text: The optimizer’s learning rate
          - id: a
            text: The boundary between external content and controlling instructions
        answer: a
        feedback: Hostile content attempts to redirect system behavior.
        retired: true
  - id: application-security-boundaries.transfer
    objective_ref: objective.application-security-boundaries
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Test realistic chained failures: trace the inputs, operation, and result before choosing.'
    remediation_scene: application-security-boundaries.s4
    variants:
      - id: application-security-boundaries.transfer.1
        prompt: Does refusal tuning replace safe output handling in software?
        options:
          - id: b
            text: 'Yes'
          - id: c
            text: Only for database queries
          - id: a
            text: 'No'
        answer: a
        feedback: Application sinks still require appropriate controls.
        retired: true
      - id: application-security-boundaries.transfer.2
        prompt: Why test component chains instead of isolated prompts only?
        options:
          - id: c
            text: Only model weights can fail
          - id: a
            text: Failures can arise from interactions among retrieval, tools, and shared state
          - id: b
            text: All components are independent by definition
        answer: a
        feedback: System boundaries can fail through composition.
        retired: true
  - id: application-security-boundaries.base.v2
    objective_ref: objective.application-security-boundaries
    task: base
    response_type: single_choice
    points: 1
    hint: 'Ask two things: who wrote the text (the user, an outsider, or the model), and which system will act on it next.'
    remediation_scene: application-security-boundaries.s2
    variants:
      - id: application-security-boundaries.base.v2.1
        prompt: A Ledgerly user frames a role-play story to coax the assistant into explaining how to hide income from tax authorities. What kind of attack is this?
        options:
          - id: b
            text: A prompt injection, since the story smuggles in hidden instructions
          - id: a
            text: A jailbreak, since the user is pushing against the model's own rules
          - id: c
            text: Improper output handling, since the answer reaches a web page
        answer: a
        feedback: The attacker is the user, and the target is the model's safety policy, which makes it a jailbreak. Prompt injection needs a third party's text acting against the user, and output handling is about what systems do with the reply afterward.
      - id: application-security-boundaries.base.v2.2
        prompt: A supplier's PDF contains hidden text telling the assistant to email all invoices to an outside address. Who is the victim if it works?
        options:
          - id: a
            text: The Ledgerly user, whose invoices are sent to the supplier's address
          - id: b
            text: The model provider, whose safety training has been bypassed
          - id: c
            text: Future users, since the PDF will poison the model's next training
        answer: a
        feedback: This is indirect prompt injection, and it works against the user whose data leaves. It needn't break any safety rule, since emailing invoices looks like an ordinary task, and reading a PDF at run time doesn't retrain the model.
      - id: application-security-boundaries.base.v2.3
        prompt: Ledgerly inserts the assistant's reply into the web page as raw HTML. What is the risk?
        options:
          - id: c
            text: The model may refuse to answer once it notices HTML in its reply
          - id: b
            text: Long replies may overflow the page and hide the invoice table
          - id: a
            text: Markup in the reply can run in the user's browser or leak data via images
        answer: a
        feedback: Raw HTML lets injected markup act, for example an image whose address carries account data out. Escaping makes the page show it as text. Refusals and layout are nuisances, not security failures.
      - id: application-security-boundaries.base.v2.4
        prompt: Why does Ledgerly take the tenant ID from the login session instead of letting the model put it in its query plan?
        options:
          - id: b
            text: The model tends to forget the tenant ID during long conversations
          - id: a
            text: Injected text can make the model name another tenant; a session can't
          - id: c
            text: Reading the session is faster than waiting for the model to answer
        answer: a
        feedback: Anything the model produces can be steered by text it read, so authority over whose data is queried must come from something an attacker can't write. Forgetfulness and speed are real but beside the point.
  - id: application-security-boundaries.transfer.v2
    objective_ref: objective.application-security-boundaries
    task: transfer
    response_type: single_choice
    points: 1
    hint: Treat everything the model produces as if a stranger had typed it. Which check or which reduced privilege would contain the damage?
    remediation_scene: application-security-boundaries.s4
    variants:
      - id: application-security-boundaries.transfer.v2.1
        prompt: A support bot turns customers' requests into shell commands that run on a server. Which design follows the lesson?
        options:
          - id: a
            text: Map requests to a fixed set of allowed actions with checked arguments
          - id: b
            text: Tell the model in its instructions not to write dangerous commands
          - id: c
            text: Run the commands with administrator rights, but log each of them
        answer: a
        feedback: Like Ledgerly's named queries, a fixed set of actions means the model chooses but the application decides what can run. An instruction is a soft layer an injection can override, and logging with full rights records the damage without limiting it.
      - id: application-security-boundaries.transfer.v2.2
        prompt: A coding assistant's database account can read every customer's tables, though it only ever needs one project's. Which OWASP risk is this, and what is the fix?
        options:
          - id: c
            text: Misinformation; require citations in each of its answers
          - id: b
            text: Unbounded consumption; put a rate limit on its queries
          - id: a
            text: Excessive agency; give it an account scoped to that project
        answer: a
        feedback: Access beyond the task is excessive agency, and least privilege shrinks the blast radius to one project. Rate limits cap cost, not reach, and citations address accuracy.
      - id: application-security-boundaries.transfer.v2.3
        prompt: A team wants to know whether one tenant's documents can leak into another tenant's answers. Which test measures that directly?
        options:
          - id: a
            text: Plant a unique canary string in tenant B and search tenant A's outputs
          - id: b
            text: Ask the model whether it ever mixes up different tenants' data
          - id: c
            text: Check that every answer's JSON matches the expected output schema
        answer: a
        feedback: A canary turns "did data cross?" into a count you can search for. The model's opinion of itself measures nothing, and a leaked invoice can sit inside perfectly valid JSON.
      - id: application-security-boundaries.transfer.v2.4
        prompt: A chatbot renders markdown. An injected web page makes it output an image whose address contains the user's email. Which fix works on the output side?
        options:
          - id: b
            text: Scan pages for "ignore previous instructions" before reading them
          - id: a
            text: Refuse to load images or links except from approved domains
          - id: c
            text: Fine-tune the model so it declines requests to produce images
        answer: a
        feedback: Blocking unapproved image and link addresses at render time stops the data from leaving, whatever the model was tricked into writing. Phrase scanning misses new wordings, and fine-tuning is another soft layer.
