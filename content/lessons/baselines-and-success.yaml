schema_version: 0.2-draft
lesson:
  id: baselines-and-success
  version: 0.4.0-draft
  title: Decide what success means before training
  state: draft
  summary: A forecasting model with the smaller average error can still cost a bakery more money. Learn to pick the simple rule to beat, price each mistake, and agree on "good enough" before training.
  slot: M03.8
  category: learning
  sources:
    - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
      url: https://aima.cs.berkeley.edu/
    - title: An Introduction to Statistical Learning — authors’ materials
      url: https://www.statlearning.com/
objectives:
  - id: objective.baselines-and-success
    version: 3-draft
    statement: A useful AI problem specifies a decision, a baseline, a metric, and error costs; sometimes a simple rule or process change is the better solution.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - baselines-and-success.base.v2
      - baselines-and-success.transfer.v2
      - baselines-and-success.cost.v2
    prerequisites:
      - anyOf:
          - objective.data
      - anyOf:
          - objective.sampling-and-shift
scenes:
  - id: baselines-and-success.s1
    title: Start with the decision, not the data
    type: explanation
    depth: intuition
    objective_refs:
      - objective.baselines-and-success
    markdown: |-
      Rosa's bakery, from the first lesson of this module, has grown into a chain of 40 shops. Her operations manager says, "We have three years of sales data. Let's use AI on it." That sentence isn't a task yet. Nobody could tell whether a model succeeded at it.

      Turn it into a decision someone makes:

      | Question | Answer for Rosa's chain |
      | --- | --- |
      | Who acts on the output? | Each shop's head baker |
      | What do they decide? | How many croissants to bake |
      | When? | 5 a.m., so the forecast must be ready by 4:30 |
      | Using what? | Only what's known by 4:30: past sales, day, weather forecast, local events |
      | What's the output? | One number per shop per day |

      Now "success" can be measured. And sometimes this exercise shows you don't need a model at all. When Rosa's team looked closely, two shops kept selling out because the delivery van reached them last, at 7 a.m. The fix was a new van route, not a forecast.
  - id: baselines-and-success.s2
    title: Beat the simple rule first
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.baselines-and-success
    markdown: |-
      Before building anything clever, write down the simplest reasonable rule. For bakery sales, that's "bake what sold on the same day last week." As in the lesson on judging AI answers, a simple method you compare against is called a **baseline**. A new model has to beat it to show it adds anything.

      Here's one shop's week, with the average miss (the **mean absolute error**: the average size of the errors, ignoring whether they're too high or too low):

      | Day | Actual | Baseline | Its miss | Model | Its miss |
      | --- | ---: | ---: | ---: | ---: | ---: |
      | Mon | 70 | 66 | 4 | 72 | 2 |
      | Tue | 64 | 70 | 6 | 66 | 2 |
      | Wed | 80 | 74 | 6 | 77 | 3 |
      | Thu | 76 | 80 | 4 | 74 | 2 |
      | Fri | 90 | 84 | 6 | 88 | 2 |
      | Average | | | 5.2 | | 2.2 |

      The model misses by 2.2 croissants on average against the baseline's 5.2, a real improvement.

      :::predict A different team's model misses by 5.0 on average, and another's misses by just 0.3. What should Rosa think of each?
      5.0 barely beats the baseline's 5.2, so it may not be worth building, running, and maintaining. And 0.3 is too good to be true for something as noisy as bakery sales: check for leakage first, such as a "left at closing" column sneaking in. A baseline is a yardstick in both directions.
      :::
  - id: baselines-and-success.s3
    title: Put a price on each kind of mistake
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.baselines-and-success
    markdown: |-
      Average miss treats every mistake the same. Rosa's mistakes aren't the same. An unsold croissant costs her about €1 in ingredients and labor. A customer turned away costs about €3 in lost profit and goodwill. A score that measures how well a model does is called a **metric**, and the right metric for Rosa counts euros, not croissants.

      Compare two models over a week:

      ```python run
      actual  = [70, 64, 80, 76, 90, 120, 110]   # croissants wanted, Mon to Sun
      model_a = [66, 60, 76, 72, 86, 114, 104]   # tends to bake a little too few
      model_b = [76, 70, 86, 80, 96, 126, 116]   # tends to bake a little too many

      COST_LEFTOVER = 1.0    # euros lost per unsold croissant (ingredients, labor)
      COST_SHORT = 3.0       # euros lost per customer turned away (profit, goodwill)

      def report(name, forecast):
          misses = [abs(f - a) for f, a in zip(forecast, actual)]
          leftover = sum(max(f - a, 0) for f, a in zip(forecast, actual))
          short = sum(max(a - f, 0) for f, a in zip(forecast, actual))
          cost = leftover * COST_LEFTOVER + short * COST_SHORT
          print(f"{name}: average miss {sum(misses) / len(misses):.2f}   "
                f"leftover {leftover:3}   short {short:3}   cost €{cost:.0f}")

      report("Model A", model_a)
      report("Model B", model_b)
      ```

      Model A has the smaller average miss (4.57 against 5.71), but all its misses are shortfalls: 32 × €3 = €96. Model B's 40 leftovers cost 40 × €1 = €40. Under Rosa's prices, B is the better model. Set `COST_SHORT` to 1.0 and the ranking flips: A costs €32 and B €40.

      The same idea works for yes-or-no decisions. If missing an urgent support ticket costs 20 and an unnecessary review costs 1, a model with 1 miss and 5 extra reviews costs 1 × 20 + 5 × 1 = 25, while one with 2 misses and no extra reviews costs 2 × 20 = 40, even though it made fewer mistakes.

      :::mixup "The model with the lowest error is the best model."
      Lowest error on which metric? Average miss, accuracy, and cost can each crown a different winner. Decide which mistakes hurt most, and by how much, before comparing models, or you'll pick the one that's best at the wrong thing.
      :::
  - id: baselines-and-success.s4
    title: Agree on "good enough" before you train
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.baselines-and-success
    markdown: |-
      Rosa's team writes the rules down before training anything:

      - *Test on:* next month's sales from all 40 shops.
      - *Target:* at least 10% lower cost than "same day last week."
      - *Speed:* every forecast ready by 4:30 a.m.
      - *Fallback:* if the model is down, shops bake last week's number.

      Now "is the model good enough?" has an answer everyone agreed on in advance, and nobody can move the goalposts after seeing the results. If the baseline had already met the targets, Rosa wouldn't need a model at all.

      A month later the results come in. Costs fell 18% overall, clearing the target, but in the 6 shops near the university the model did *worse* than the baseline. It had never learned the university's term calendar, so it baked for students who were away on holiday. The decision writes itself: use the model in 34 shops, keep the baseline in the other 6, and add term dates as a feature before trying again. Overall success, checked shop by shop, turned into two clear actions.
  - id: baselines-and-success.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.baselines-and-success
    markdown: Price the mistakes of four models in euros and points, then turn vague goals, suspicious scores, and mixed results into decisions.
    takeaway: |-
      Name the decision first, write down the simple rule a model must beat, and price each kind of mistake. Agree on "good enough" and a fallback before training, then check the result group by group.
  - id: baselines-and-success.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.baselines-and-success
    markdown: |-
      Define the task, compare a simple baseline, and decide which mistakes matter. A more complicated model is useful only if it improves the outcome you care about.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - baselines-and-success.s1
        - baselines-and-success.s2
        - baselines-and-success.s3
        - baselines-and-success.s4
        - baselines-and-success.check
      gate_refs:
        - gate.core
  scene_aliases:
    baselines-and-success.recap: baselines-and-success.check
assessment_families:
  - id: baselines-and-success.base
    objective_ref: objective.baselines-and-success
    task: base
    response_type: single_choice
    points: 1
    hint: 'Build a meaningful baseline: trace the inputs, operation, and result before choosing.'
    remediation_scene: baselines-and-success.s2
    variants:
      - id: baselines-and-success.base.1
        prompt: Which is a concrete prediction task?
        options:
          - id: a
            text: Estimate next-day demand from information available today
          - id: b
            text: Use AI somewhere
          - id: c
            text: Make the dashboard impressive
        answer: a
        feedback: A task specifies output, timing, and available information.
        retired: true
      - id: baselines-and-success.base.2
        prompt: Why retain a simple baseline?
        options:
          - id: b
            text: To guarantee the complex model wins
          - id: c
            text: To avoid defining a metric
          - id: a
            text: To measure added value and diagnose errors
        answer: a
        feedback: A baseline is a reference under the same evaluation conditions.
        retired: true
  - id: baselines-and-success.transfer
    objective_ref: objective.baselines-and-success
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Define acceptance and a fallback: trace the inputs, operation, and result before choosing.'
    remediation_scene: baselines-and-success.s4
    variants:
      - id: baselines-and-success.transfer.1
        prompt: Two classifiers have equal accuracy but different false-negative counts. Can their practical value differ?
        options:
          - id: b
            text: No; accuracy determines every decision
          - id: c
            text: Only if their names differ
          - id: a
            text: Yes; error types may have different costs
        answer: a
        feedback: A metric can hide asymmetry in real decision consequences.
        retired: true
      - id: baselines-and-success.transfer.2
        prompt: A fixed rule already meets quality and cost requirements. Must it be replaced by learning?
        options:
          - id: c
            text: Yes; learning is always cheaper
          - id: a
            text: No; the simpler solution may be appropriate
          - id: b
            text: Yes; every task needs a neural model
        answer: a
        feedback: The objective is useful reliable behavior, not complexity for its own sake.
        retired: true
  - id: baselines-and-success.base.v2
    objective_ref: objective.baselines-and-success
    task: base
    response_type: single_choice
    points: 1
    hint: Compare every result with the simple rule it has to beat. A gain that's tiny may not be worth it, and a gain that's huge may be a leak.
    remediation_scene: baselines-and-success.s2
    variants:
      - id: baselines-and-success.base.v2.1
        prompt: Which of these is a well-defined prediction task for a bakery chain?
        options:
          - id: b
            text: Build the most accurate model we can from our three years of sales
          - id: c
            text: Use AI on our sales data to find ways to improve the business
          - id: a
            text: By 4:30 a.m., forecast each shop's croissant sales for the day
        answer: a
        feedback: A task names who gets the output, when, and what it's for, so success can be measured. "Most accurate model" sounds precise but never says what decision it serves or when it's needed.
      - id: baselines-and-success.base.v2.2
        prompt: 'The baseline "same day last week" misses by 5.2 croissants on average. A new model misses by 5.0 and needs a server to run. What is the fairest conclusion?'
        options:
          - id: a
            text: It barely beats the baseline, so it may not be worth the upkeep
          - id: b
            text: It beats the baseline, so it should replace it in every shop
          - id: c
            text: The baseline must contain a bug, since it scored so closely
        answer: a
        feedback: A 0.2-croissant gain is small next to the cost of building and running a model. Beating the baseline is required, not sufficient; a close score is normal for a decent simple rule and doesn't point to a bug.
      - id: baselines-and-success.base.v2.3
        prompt: For daily bakery sales, the baseline misses by 5.2 on average. A teammate's new model misses by 0.3. What should happen next?
        options:
          - id: c
            text: Ship it right away, since it's far better than the baseline
          - id: a
            text: Check its inputs for leakage before trusting the score
          - id: b
            text: Retrain the baseline, since it's clearly out of date
        answer: a
        feedback: Near-perfect forecasts of something as noisy as daily sales are a warning sign, often of a column like "left at closing" that holds the answer. The baseline's job here is to make the too-good score stand out.
      - id: baselines-and-success.base.v2.4
        prompt: In a support inbox, 95% of emails are not urgent. A new classifier is 95% accurate. What does the baseline comparison tell you?
        options:
          - id: b
            text: The classifier is excellent, since 95% is a high accuracy
          - id: c
            text: The classifier is useless, since accuracy can't judge urgency
          - id: a
            text: Calling everything "not urgent" also scores 95%, so no gain is shown
        answer: a
        feedback: The majority-class baseline already gets 95% while catching no urgent emails, so the classifier hasn't shown it adds anything. Accuracy can still be useful, but only next to the baseline and alongside counts of each kind of mistake.
  - id: baselines-and-success.transfer.v2
    objective_ref: objective.baselines-and-success
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what decision is really being made and what was agreed before the results came in. Then look at the result for each group, not just the average.
    remediation_scene: baselines-and-success.s4
    variants:
      - id: baselines-and-success.transfer.v2.1
        prompt: A school asks for AI to "reduce lateness." Most late students ride one bus that is scheduled to arrive at 8:05 for an 8:00 start. What's the best first step?
        options:
          - id: c
            text: Train a model to predict which students will be late each day
          - id: b
            text: Collect more attendance data before deciding anything at all
          - id: a
            text: Ask the bus company to move the arrival earlier
        answer: a
        feedback: The cause is a schedule, not a missing prediction. A model that predicts lateness would forecast the same bus every day without changing it; a process fix solves the problem directly.
      - id: baselines-and-success.transfer.v2.2
        prompt: A clinic wants a model that predicts waiting times. Which acceptance rule, written before training, is most useful?
        options:
          - id: b
            text: The model should reach at least 99% accuracy on the training data
          - id: a
            text: Beat last month's average wait by 10% on next month's visits, or keep using that average
          - id: c
            text: The model should give accurate, trustworthy waiting times to patients
        answer: a
        feedback: It names the test data, the baseline, the margin, and the fallback, so everyone can tell afterward whether it passed. Training accuracy says little about new visits, and "accurate and trustworthy" can't be checked.
        retired: true
      - id: baselines-and-success.transfer.v2.3
        prompt: A chain's new forecast cuts costs 18% overall but does worse than the baseline in the 6 of its 40 shops near a university. What should the chain do?
        options:
          - id: c
            text: Use the model everywhere, since the overall saving clears the target
          - id: b
            text: Drop the model, since it failed in some of the shops
          - id: a
            text: Use it in 34 shops, keep the baseline in 6, and investigate
        answer: a
        feedback: The results split cleanly by group, so the decision can too. Using it everywhere accepts known losses in 6 shops, and dropping it throws away a real gain in the other 34.
      - id: baselines-and-success.transfer.v2.4
        prompt: The forecasting server fails at 4 a.m. What should the bakers do, according to a well-written plan?
        options:
          - id: a
            text: Bake the agreed fallback amount, last week's same-day sales
          - id: b
            text: Wait until the server returns before baking anything
          - id: c
            text: Use each baker's own guess, since no rule was agreed for this
        answer: a
        feedback: A fallback agreed in advance, usually the baseline, keeps the shops running when the model is down. Waiting means empty shelves, and a good plan never leaves the failure case to guesswork.
      - id: baselines-and-success.transfer.v2.5
        prompt: A clinic wants a model that predicts waiting times. Which rule, agreed before training, lets everyone judge the result afterward?
        options:
          - id: c
            text: Give waiting times that patients find accurate and trustworthy
          - id: b
            text: Err 10% less than "last month's average" on next month's visits
          - id: a
            text: Reach 99% accuracy on the visits it was trained on, before launch
        answer: b
        feedback: It names the baseline, the margin, and fresh test data, so anyone can check afterward whether the model passed. Accuracy on the training visits says little about new ones, and "accurate and trustworthy" has no number to check.
  - id: baselines-and-success.cost.v2
    objective_ref: objective.baselines-and-success
    task: base
    response_type: numeric
    points: 1
    hint: Multiply the count of each kind of mistake by its price, then add the two products. Don't count all mistakes as equal.
    remediation_scene: baselines-and-success.s3
    absolute_tolerance: 0.01
    variants:
      - id: baselines-and-success.cost.v2.1
        prompt: An unsold croissant costs €1 and a customer turned away costs €3. Over a week, a model leaves 12 croissants unsold and turns away 5 customers. What is its total cost in euros?
        answer: 27
        feedback: 12 × 1 + 5 × 3 = 12 + 15 = €27. Counting all 17 mistakes at the same price would hide that the 5 shortfalls cost more than the 12 leftovers.
      - id: baselines-and-success.cost.v2.2
        prompt: Missing an urgent ticket costs 20 points and an unnecessary review costs 1. A model misses 2 urgent tickets and asks for 7 unnecessary reviews. What is its total cost in points?
        answer: 47
        feedback: 2 × 20 + 7 × 1 = 40 + 7 = 47. The two misses make up most of the cost even though they're the smaller count.
      - id: baselines-and-success.cost.v2.3
        prompt: An unsold croissant costs €1 and a customer turned away costs €3. A model leaves 20 croissants unsold and turns away 1 customer. What is its total cost in euros?
        answer: 23
        feedback: 20 × 1 + 1 × 3 = 20 + 3 = €23. It makes 21 mistakes, more than a model with 12 leftovers and 5 shortfalls, yet costs less than that model's €27.
      - id: baselines-and-success.cost.v2.4
        prompt: A spam filter's mistakes cost 10 points for each real email sent to junk and 1 point for each spam left in the inbox. It sends 3 real emails to junk and leaves 40 spam in the inbox. What is its total cost in points?
        answer: 70
        feedback: 3 × 10 + 40 × 1 = 30 + 40 = 70. Here the many small mistakes add up to more than the few expensive ones.
