schema_version: 0.2-draft
lesson:
  id: baselines-and-success
  version: 0.1.0-draft
  title: Decide what success means before training
  state: draft
  summary: A useful AI problem specifies a decision, a baseline, a metric, and error costs; sometimes a simple rule
    or process change is the better solution.
  slot: M03.8
  category: learning
  minutes: 12
  sources:
  - title: 'Artificial Intelligence: A Modern Approach — authors’ materials'
    url: https://aima.cs.berkeley.edu/
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.baselines-and-success
  version: 1-draft
  statement: A useful AI problem specifies a decision, a baseline, a metric, and error costs; sometimes a simple
    rule or process change is the better solution.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - baselines-and-success.base
  - baselines-and-success.transfer
  prerequisites:
  - anyOf:
    - objective.data
  - anyOf:
    - objective.sampling-and-shift
scenes:
- id: baselines-and-success.s1
  title: Start with the decision
  type: explanation
  depth: intuition
  objective_refs:
  - objective.baselines-and-success
  markdown: “Use AI on our data” is not a prediction task. “Estimate tomorrow’s item demand so inventory can be
    prepared” names an output and use. Identify who acts on the output, when the action happens, and what information
    is available then. Some problems concern missing process clarity rather than missing prediction.
  text_mode: “Use AI on our data” is not a prediction task. “Estimate tomorrow’s item demand so inventory can be
    prepared” names an output and use. Identify who acts on the output, when the action happens, and what information
    is available then. Some problems concern missing process clarity rather than missing prediction.
  bridges: []
- id: baselines-and-success.s2
  title: Build a meaningful baseline
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.baselines-and-success
  markdown: A demand baseline might reuse last week’s same-day value. A classifier baseline might predict the most
    frequent class. A rule-based workflow may already meet requirements. Baselines reveal whether a complex model
    adds value and can expose mistakes when an implausibly weak method wins.
  text_mode: A demand baseline might reuse last week’s same-day value. A classifier baseline might predict the most
    frequent class. A rule-based workflow may already meet requirements. Baselines reveal whether a complex model
    adds value and can expose mistakes when an implausibly weak method wins.
  bridges: []
- id: baselines-and-success.s3
  title: Put costs beside the metric
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.baselines-and-success
  markdown: Suppose missing an urgent case costs 20 units while reviewing an unnecessary case costs 1. Two models
    with equal accuracy can have very different practical costs. Thresholds, abstention, and human review affect
    the final decision. A model probability alone does not select the correct action without a value rule.
  text_mode: Suppose missing an urgent case costs 20 units while reviewing an unnecessary case costs 1. Two models
    with equal accuracy can have very different practical costs. Thresholds, abstention, and human review affect
    the final decision. A model probability alone does not select the correct action without a value rule.
  bridges: []
- id: baselines-and-success.s4
  title: Define acceptance and a fallback
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.baselines-and-success
  markdown: Specify the evaluation population, minimum performance, resource limits, and response to failure. Test
    the full workflow, including how people use the output. Prefer the simplest approach that reliably meets the
    need. Record why learning is warranted and what evidence would cause the team to keep the baseline instead.
  text_mode: Specify the evaluation population, minimum performance, resource limits, and response to failure. Test
    the full workflow, including how people use the output. Prefer the simplest approach that reliably meets the
    need. Record why learning is warranted and what evidence would cause the team to keep the baseline instead.
  bridges: []
- id: baselines-and-success.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.baselines-and-success
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: A useful AI problem specifies a decision, a baseline, a metric, and error costs; sometimes a simple
    rule or process change is the better solution.
- id: baselines-and-success.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.baselines-and-success
  markdown: A useful AI problem specifies a decision, a baseline, a metric, and error costs; sometimes a simple
    rule or process change is the better solution.
  text_mode: A useful AI problem specifies a decision, a baseline, a metric, and error costs; sometimes a simple
    rule or process change is the better solution.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - baselines-and-success.s1
    - baselines-and-success.s2
    - baselines-and-success.s3
    - baselines-and-success.s4
    - baselines-and-success.check
    gate_refs:
