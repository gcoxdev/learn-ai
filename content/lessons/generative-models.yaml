scenes:
- title: Two different questions about the same photos
  markdown: 'A classifier might answer: “given this photo, how likely is each label?” A generator might answer:
    “what photos could fit this label or description?” Both may use learned parameters, but their output spaces
    and objectives differ.


    A label distribution has a small named set of outcomes in a toy example. An image distribution describes
    many possible arrangements of pixel or latent values. Generating a sample is not the same action as choosing
    a class for an existing image.'
  id: generative-models.s1
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.generative-models
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: More than one output can fit the condition
  markdown: 'The prompt “a small green house” does not specify every pixel. Many viewpoints, materials, and
    arrangements are compatible. A conditional generator represents variation among possible outputs, influenced
    by its training and the supplied condition.


    A useful generator needs more than variation: outputs should also have relevant structure and fit the intended
    task. Random pixels vary greatly but do not establish a useful learned image distribution.


    A **distribution** assigns probabilities or density across possibilities. A **sample** is one result drawn
    using a generation procedure. A **condition** is supplied information, such as the house description. Some
    generators use explicit latent variables; generation as a general idea does not require every architecture
    to use the same latent representation.'
  id: generative-models.s2
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.generative-models
  text_mode: 'The prompt “a small green house” does not specify every pixel. Many viewpoints, materials, and
    arrangements are compatible. A conditional generator represents variation among possible outputs, influenced
    by its training and the supplied condition.


    A useful generator needs more than variation: outputs should also have relevant structure and fit the intended
    task. Random pixels vary greatly but do not establish a useful learned image distribution.


    A **distribution** assigns probabilities or density across possibilities. A **sample** is one result drawn
    using a generation procedure. A **condition** is supplied information, such as the house description. Some
    generators use explicit latent variables; generation as a general idea does not require every architecture
    to use the same latent representation.'
- title: A latent variable stands behind an observation
  markdown: 'A latent variable is not directly observed as part of the data description you are modeling. In
    a toy drawing system, an unobserved style choice could select thick or thin strokes while the visible output
    is a drawing.


    In learned systems, latents are often numerical representations. Their coordinates need not correspond
    to named factors such as “style” or “viewpoint”. A convenient explanatory latent in a toy example is not
    proof that a real model learned that exact factor.'
  id: generative-models.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.generative-models
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: A random seed chooses a computation path
  markdown: 'A sampler can use pseudo-random numbers to choose among possible outputs. A seed initializes that
    random-number sequence. Reusing a seed can support repeatability under matching implementation and settings,
    but the seed is not a compressed catalogue entry for one universal image.


    Changing the model, prompt, scheduler, or implementation can change the output. A seed alone does not specify
    the complete generation process.'
  id: generative-models.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.generative-models
  text_mode: Full prose, labeled calculations, and equivalent text tables are available in reading order.
- title: Evaluate both coverage and useful structure
  markdown: 'Imagine a generator that always makes the same excellent-looking house. It may have good quality
    for that one output and poor coverage of possible houses. Another may produce many varied but incoherent
    pictures. These failures differ.


    Assessment should consider fidelity, diversity, conditioning, and the application’s failure cases. A sample
    can look convincing without proving that the system understands the scene in a human sense.


    **Fidelity** concerns how well outputs match the relevant data characteristics. **Diversity** concerns
    variety; **coverage** asks which parts of the target distribution are represented. For the green-house
    task, also check whether the houses are actually green and whether object counts and geometry meet the
    request. These measurements can move in different directions.'
  id: generative-models.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.generative-models
  text_mode: 'Imagine a generator that always makes the same excellent-looking house. It may have good quality
