scenes:
- title: Two different questions about the same photos
  markdown: 'A classifier might answer: “given this photo, how likely is each label?” A generator might answer:
    “what photos could fit this label or description?” Both may use learned parameters, but their output spaces
    and objectives differ.


    A label distribution has a small named set of outcomes in a toy example. An image distribution describes
    many possible arrangements of pixel or latent values. Generating a sample is not the same action as choosing
    a class for an existing image.'
  id: generative-models.s1
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.generative-models
  text_mode: 'A classifier might answer: “given this photo, how likely is each label?” A generator might answer:
    “what photos could fit this label or description?” Both may use learned parameters, but their output spaces
    and objectives differ.


    A label distribution has a small named set of outcomes in a toy example. An image distribution describes
    many possible arrangements of pixel or latent values. Generating a sample is not the same action as choosing
    a class for an existing image.'
- title: More than one output can fit the condition
  markdown: 'The prompt “a small green house” leaves many details open: viewpoint, materials, windows, and
    arrangement. The prompt is a **condition**, or supplied information. A conditional generator models possibilities
    that fit that information.


    A **distribution** assigns probabilities or density across possibilities. A **sample** is one result drawn
    using a generation procedure. Useful samples need structure as well as variation: random pixels vary greatly
    but rarely look like a house.


    Some generators use explicit latent variables to represent hidden variation. The next page explains what
    that means.'
  id: generative-models.s2
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.generative-models
  text_mode: 'The prompt “a small green house” leaves many details open: viewpoint, materials, windows, and
    arrangement. The prompt is a **condition**, or supplied information. A conditional generator models possibilities
    that fit that information.


    A **distribution** assigns probabilities or density across possibilities. A **sample** is one result drawn
    using a generation procedure. Useful samples need structure as well as variation: random pixels vary greatly
    but rarely look like a house.


    Some generators use explicit latent variables to represent hidden variation. The next page explains what
    that means.'
- title: A latent variable stands behind an observation
  markdown: 'A latent variable is not directly observed as part of the data description you are modeling. In
    a toy drawing system, an unobserved style choice could select thick or thin strokes while the visible output
    is a drawing.


    In learned systems, latents are often numerical representations. Their coordinates need not correspond
    to named factors such as “style” or “viewpoint”. A convenient explanatory latent in a toy example is not
    proof that a real model learned that exact factor.'
  id: generative-models.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.generative-models
  text_mode: 'A latent variable is not directly observed as part of the data description you are modeling.
    In a toy drawing system, an unobserved style choice could select thick or thin strokes while the visible
    output is a drawing.


    In learned systems, latents are often numerical representations. Their coordinates need not correspond
    to named factors such as “style” or “viewpoint”. A convenient explanatory latent in a toy example is not
    proof that a real model learned that exact factor.'
- title: A random seed chooses a computation path
  markdown: 'A sampler can use pseudo-random numbers to choose among possible outputs. A seed initializes that
    random-number sequence. Reusing a seed can support repeatability under matching implementation and settings,
    but the seed is not a compressed catalogue entry for one universal image.


    Changing the model, prompt, scheduler, or implementation can change the output. A seed alone does not specify
    the complete generation process.'
  id: generative-models.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.generative-models
  text_mode: 'A sampler can use pseudo-random numbers to choose among possible outputs. A seed initializes
    that random-number sequence. Reusing a seed can support repeatability under matching implementation and
    settings, but the seed is not a compressed catalogue entry for one universal image.


    Changing the model, prompt, scheduler, or implementation can change the output. A seed alone does not specify
    the complete generation process.'
- title: Evaluate both coverage and useful structure
  markdown: 'Imagine a generator that always makes the same excellent-looking house. Its individual output
    may look convincing, but it represents little of the variety of possible houses. Another generator might
    produce varied but incoherent pictures.


    These examples separate **fidelity**, how well outputs match relevant data characteristics, from **diversity**,
    their variety. **Coverage** asks which parts of the target distribution the generator represents.


    Also check the supplied condition. Are the houses green? Do their object counts and geometry match the
    request? A generator can improve on one of these measures while getting worse on another.'
  id: generative-models.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.generative-models
  text_mode: 'Imagine a generator that always makes the same excellent-looking house. Its individual output
