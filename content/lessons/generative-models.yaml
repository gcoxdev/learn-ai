lesson:
  id: generative-models
  version: 0.2.0-draft
  title: Predicting a label, generating a possibility
  state: draft
  summary: Distinguish conditional prediction from generation over possible samples, and identify the role
    of a latent variable.
  slot: M22.1
  category: learning
  sources:
  - title: Deep Learning — probability and information theory
