  scene_aliases:
    generative-models.recap: generative-models.check
assessment_families:
  - response_type: single_choice
    hint: Identify what is given and whether the output is a label for existing data or a newly constructed sample.
    variants:
      - prompt: A system receives a photo and outputs probabilities for cat, dog, or bird. What task is described?
        options:
          - id: answer
            text: Conditional classification of an existing photo.
          - id: a
            text: Necessarily generating a new photo.
          - id: b
            text: A proof that the image distribution has been fully learned.
        answer: answer
        feedback: The photo is the input and labels are the outcomes. This is a classification task, even if the predictor uses a large neural network.
        id: generative-models.base.1
        retired: true
      - prompt: A system receives “a blue vase” and samples one of many possible images. Which description fits?
        options:
          - id: a
            text: A single deterministic label assigned to an existing image.
          - id: b
            text: A requirement that every prompt determine one unique image.
          - id: answer
            text: Conditional generation with room for unspecified variation.
        answer: answer
        feedback: The description leaves many details open. A conditional generator can produce different samples consistent with some of that information.
        id: generative-models.base.2
        retired: true
    id: generative-models.base
    objective_ref: objective.generative-models
    task: base
    points: 1
    remediation_scene: generative-models.s1
  - response_type: single_choice
    hint: A latent belongs to the model’s description of hidden variation; a seed belongs to a particular sampling procedure.
    variants:
      - prompt: A toy model uses an unobserved style variable to influence a visible drawing. What role does that variable play?
        options:
          - id: a
            text: A guarantee that every real neural model has a human-readable style coordinate.
          - id: b
            text: A directly observed pixel by definition.
          - id: answer
            text: A latent variable in that model.
        answer: answer
        feedback: The variable is hidden in the chosen model of the observation. Its interpretation is an assumption of the toy model, not a guarantee about learned representations.
        id: generative-models.transfer.1
        retired: true
      - prompt: Two programs use the same seed but different models and prompts. Must they generate the same image?
        options:
          - id: b
            text: Yes; model weights have no influence once a seed is set.
          - id: answer
            text: No; the seed does not specify the whole computation.
          - id: a
            text: Yes; every seed names one universal image.
        answer: answer
        feedback: A seed controls a random-number sequence within a setup. Model parameters, conditioning, sampling rules, and implementation also influence the result.
        id: generative-models.transfer.2
        retired: true
    id: generative-models.transfer
    objective_ref: objective.generative-models
    task: transfer
    points: 1
    remediation_scene: generative-models.s1
  - id: generative-models.base.v2
    objective_ref: objective.generative-models
    task: base
    response_type: single_choice
    points: 1
    hint: Ask which distribution the model learned. p(y | x) only ranks labels for a given input; p(x) or p(x | y) describes the inputs themselves, so it can sample and score.
    remediation_scene: generative-models.s1
    variants:
      - id: generative-models.base.v2.1
        prompt: A spam filter was trained only to output p(spam | email). A colleague asks it to write a new, typical spam email. Why can't it?
        options:
          - id: b
            text: It was trained on real emails, so it can only copy one of them
          - id: a
            text: It learned how to label a given email, not which emails are likely
          - id: c
            text: Its probabilities are for two labels, which is too few to write text
        answer: a
        feedback: A discriminative model learns p(label | email), which says nothing about how likely each email is to occur, so there is nothing to sample from. The number of labels isn't the issue; even a thousand-label classifier can't write an email.
      - id: generative-models.base.v2.2
        prompt: A model has learned p(sketch | label) for every label, plus how common each label is. Which extra task can it do with Bayes' rule?
        options:
          - id: c
            text: It can't, since it has no p(label | sketch) of its own
          - id: b
            text: Sample sketches, but classifying needs a separate model
          - id: a
            text: Classify a new sketch by comparing p(sketch | label) × p(label)
        answer: a
        feedback: Multiply each label's likelihood by its prior and normalize; that gives p(label | sketch). This is how naive Bayes classifies. A generative model carries enough information to classify; the reverse is what fails.
      - id: generative-models.base.v2.3
        prompt: Which pair correctly matches each model type to what it learns?
        options:
          - id: a
            text: "Discriminative learns p(y | x); generative learns p(x) or p(x | y)"
          - id: c
            text: "Discriminative learns p(x | y); generative learns p(y | x)"
          - id: b
            text: "Discriminative learns p(x); generative learns p(y) alone"
        answer: a
        feedback: A discriminative model learns labels given inputs. A generative model learns the distribution of the inputs themselves, possibly per label. Swapping them is the most common slip.
      - id: generative-models.base.v2.4
        prompt: A generator of bird photos learned p(photo) well. What can you do with it that you can't do with a bird-species classifier?
        options:
          - id: b
            text: Tell a robin photo from a sparrow photo with higher accuracy
          - id: c
            text: Run faster, since it only outputs a single probability per photo
          - id: a
            text: Draw a new bird photo, or flag a photo as unusually unlikely
        answer: a
        feedback: Knowing p(photo) lets you sample new photos and score how typical any photo is. It doesn't make classification more accurate; a dedicated classifier often classifies better.
  - id: generative-models.transfer.v2
    objective_ref: objective.generative-models
    task: transfer
    response_type: single_choice
    points: 1
    hint: Decide whether the job needs a label for an input, a new sample, or a typicality score; then check whether the model has what that job needs (and, for seeds, whether everything else stayed fixed).
    remediation_scene: generative-models.s4
    variants:
      - id: generative-models.transfer.v2.1
        prompt: A bank has millions of normal card transactions and almost no labeled fraud. Which model best flags strange transactions?
        options:
          - id: c
            text: A fraud classifier trained on the few labeled fraud cases
          - id: a
            text: A generative model of normal transactions that flags low scores
          - id: b
            text: A generator that invents new fraud cases to use as a test set
        answer: a
        feedback: A model of p(transaction) learned from normal data can score new transactions; very unlikely ones are worth a look. A classifier needs many labeled fraud examples, which the bank doesn't have.
      - id: generative-models.transfer.v2.2
        prompt: 'A music generator trained on 1,000 songs (400 jazz, 600 folk) produces 100 samples: 100 polished jazz tunes. What should you report?'
        options:
          - id: a
            text: High fidelity but poor coverage, since no folk appears
          - id: b
            text: Good coverage, since every tune it made sounds realistic
          - id: c
            text: Low fidelity, since jazz makes up less than half the data
        answer: a
        feedback: The samples look good (fidelity) but ignore 60% of the data (coverage). Realistic samples don't imply coverage, and being a minority genre doesn't lower the quality of the tunes it did make.
      - id: generative-models.transfer.v2.3
        prompt: You regenerate a favorite image with the same seed and prompt after a software update, and get a different image. What is the best explanation?
        options:
          - id: b
            text: Seeds expire, so reusing one gives a fresh random sequence
          - id: c
            text: The prompt was too short to pin down a single image
          - id: a
            text: The same seed only repeats if the computation around it is unchanged
        answer: a
        feedback: A seed fixes the random numbers, but the image also depends on the model, settings, and software; the update changed some of that computation. Seeds don't expire, and prompt length isn't what makes a result repeatable.
      - id: generative-models.transfer.v2.4
        prompt: A handwriting generator first picks a hidden "pen pressure" value, then draws letters given it. Pressure is never stored in the dataset. What is pen pressure here?
        options:
          - id: c
            text: A label, since each drawing has one pressure value
          - id: a
            text: A latent variable that the model samples before drawing
          - id: b
            text: A seed, since it controls which drawing appears
        answer: a
        feedback: It's chosen first, shapes the output, and is never observed, which makes it a latent variable, as in p(x) = Σ p(z) p(x | z). A label is recorded in the data; a seed only starts the random-number sequence.
  - id: generative-models.calculate
    objective_ref: objective.generative-models
    task: base
    response_type: numeric
    points: 1
    hint: For p(label | x), read across the x row and divide by the row total. For p(x | label), read down the label's column and divide by the column total.
    remediation_scene: generative-models.s2
    absolute_tolerance: 0.01
    variants:
      - id: generative-models.calculate.1
        prompt: 'In the doodle table (pointy 8 cats / 2 dogs, floppy 1 / 5, round 3 / 1), what is p(dog | floppy)? Give a decimal.'
        answer: 0.833
        feedback: The floppy row has 1 + 5 = 6 doodles, and 5 are dogs, so p(dog | floppy) = 5/6 ≈ 0.833. Dividing by the dog column total (5/8) would give p(floppy | dog) instead.
      - id: generative-models.calculate.2
        prompt: 'In the same doodle table, what is p(pointy | dog)? Give a decimal.'
        answer: 0.25
        feedback: The dog column has 2 + 5 + 1 = 8 doodles, and 2 are pointy, so p(pointy | dog) = 2/8 = 0.25. Reading across the row instead gives p(dog | pointy) = 0.2.
      - id: generative-models.calculate.3
        prompt: 'A shop logs 50 visitors: 30 browse only (6 of them on a phone) and 20 buy (12 on a phone). What is p(phone | buy)? Give a decimal.'
        answer: 0.6
        feedback: Of the 20 buyers, 12 used a phone, so p(phone | buy) = 12/20 = 0.6. p(buy | phone) would be 12/18 ≈ 0.667, a different question.
      - id: generative-models.calculate.4
        prompt: 'Hidden styles: "quick" (probability 0.6) draws pointy ears with probability 0.5; "careful" (0.4) draws them with probability 0.9. What is p(not pointy)?'
        answer: 0.34
        feedback: p(pointy) = 0.6 × 0.5 + 0.4 × 0.9 = 0.66, so p(not pointy) = 1 − 0.66 = 0.34. Directly, 0.6 × 0.5 + 0.4 × 0.1 = 0.30 + 0.04 = 0.34.
      - id: generative-models.calculate.5
        prompt: 'In the doodle table, use Bayes: p(round | cat) = 0.25, p(cat) = 0.6, and p(round) = 0.2. What is p(cat | round)?'
        answer: 0.75
        feedback: p(cat | round) = 0.25 × 0.6 / 0.2 = 0.15 / 0.2 = 0.75, matching the round row's 3 cats out of 4 doodles.
