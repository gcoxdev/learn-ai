schema_version: 0.2-draft
lesson:
  id: generative-models
  version: 0.4.0-draft
  title: Predicting a label, generating a possibility
  state: draft
  summary: One model looks at a doodle and says "cat". Another draws a brand-new cat. From the same twenty doodles, see what each one learns and what only the second can do.
  slot: M22.1
  category: learning
  sources:
    - title: "Deep Learning, chapter 20: Deep Generative Models (Goodfellow, Bengio & Courville, 2016)"
      url: https://www.deeplearningbook.org/contents/generative_models.html
    - title: "On Discriminative vs. Generative Classifiers: A comparison of logistic regression and naive Bayes (Ng & Jordan, 2001)"
      url: https://proceedings.neurips.cc/paper/2001/hash/7b7a53e239400a13bd6be6c91c4f6c4e-Abstract.html
    - title: "GANs Trained by a Two Time-Scale Update Rule Converge to a Local Nash Equilibrium (Heusel et al., 2017), which introduced FID"
      url: https://arxiv.org/abs/1706.08500
    - title: Denoising Diffusion Probabilistic Models (Ho, Jain & Abbeel, 2020)
      url: https://arxiv.org/abs/2006.11239
objectives:
  - id: objective.generative-models
    version: 2-draft
    statement: Distinguish conditional prediction from generation over possible samples, and identify the role of a latent variable.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - generative-models.base.v2
      - generative-models.transfer.v2
      - generative-models.calculate
    prerequisites:
      - anyOf:
          - objective.probability
      - anyOf:
          - objective.data
scenes:
  - title: Two different questions about the same doodle
    markdown: |-
      In a drawing game, you sketch something in twenty seconds and a model guesses "cat!" before you've finished. A second model does the reverse: you type "cat" and it draws a cat nobody has drawn before. Both learned from the same pile of doodles, but they learned different things.

      The first model answers "given this drawing $x$, which label $y$?" It learns the **conditional distribution** $p(y \mid x)$: for each drawing, a probability for each label. A model that learns only this is called **discriminative**, because it learns to tell classes apart.

      The second model answers "what drawings are likely?" It learns $p(x)$, the distribution over the drawings themselves, or $p(x \mid y)$, the drawings likely for one label. A model that learns this is called **generative**, because it can generate new examples.

      | | Discriminative | Generative |
      | --- | --- | --- |
      | Learns | $p(y \mid x)$ | $p(x)$ or $p(x \mid y)$ |
      | Answers | "Which label fits this drawing?" | "What might a drawing look like?" |
      | Can **sample** (make a new $x$) | No | Yes |
      | Can **score** (say how typical an $x$ is) | No | Yes, for most kinds |
      | Familiar examples | Logistic regression, an image classifier | Naive Bayes, GPT, image generators |

      A **sample** is one outcome drawn at random from a distribution. A **score** is the probability (or density) the model gives to a particular outcome.
    id: generative-models.s1
    type: explanation
    depth: intuition
    objective_refs:
      - objective.generative-models
  - title: Twenty doodles, read two ways
    markdown: |-
      Here are twenty doodles, sorted by label and by ear shape:

      | Ears | Cat | Dog | Row total |
      | --- | ---: | ---: | ---: |
      | Pointy | 8 | 2 | 10 |
      | Floppy | 1 | 5 | 6 |
      | Round | 3 | 1 | 4 |
      | **Column total** | 12 | 8 | 20 |

      A discriminative model reads **across a row**. Of the 10 pointy-eared doodles, 8 are cats, so $p(\text{cat} \mid \text{pointy}) = 8/10 = 0.8$.

      A generative model of cats reads **down the cat column**. Of the 12 cats, 8 have pointy ears, 1 floppy, and 3 round, so $p(\text{ears} \mid \text{cat}) = 0.667, 0.083, 0.25$. Those three numbers add to 1. They are a recipe for drawing a cat: pick pointy two times in three, round one time in four.

      :::predict A new doodle has round ears. Using only the cat and dog columns and the label counts, can the generative model still guess the label?
      Yes, with Bayes' rule from module 6. $p(\text{cat} \mid \text{round}) = \dfrac{p(\text{round} \mid \text{cat})\,p(\text{cat})}{p(\text{round})} = \dfrac{0.25 \times 12/20}{4/20} = \dfrac{0.15}{0.2} = 0.75$, the same 3/4 you get by reading the round row directly.
      :::

      So a generative model can classify too. That is exactly how naive Bayes works, as in the naive Bayes lesson. The reverse fails: the row ratios alone never tell you how many doodles were round in the first place, so a discriminative model can't draw one.

      :::papers Generative classifiers through Bayes' rule
      $$p(y \mid x) = \frac{p(x \mid y)\,p(y)}{\sum_{y'} p(x \mid y')\,p(y')}$$

      The numerator for "cat, round" is $0.25 \times 0.6 = 0.15$; for "dog, round" it is $(1/8) \times 0.4 = 0.05$. The denominator is their sum, 0.2. Ng and Jordan (2001) compared naive Bayes with logistic regression, its discriminative partner. The generative classifier often did better with little data; the discriminative one usually won with plenty.
      :::
    id: generative-models.s2
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.generative-models
  - title: A hidden choice stands behind each drawing
    markdown: |-
      Real doodles aren't three ear shapes. A 28 × 28 black-and-white doodle has $2^{784}$ possible pixel patterns, far more than there are atoms in the universe, so no one can fill in a table with a row for each. Every generator in this module is a trick for describing $p(x)$ without that table.

      One trick is a **latent variable**: something the model chooses first that never appears in the data itself. Suppose each doodler is either "quick" (60% of people) or "careful" (40%). Quick doodlers give cats pointy ears half the time; careful ones, 90% of the time. The style is never recorded, yet it shapes the drawing:

      $$p(\text{pointy}) = 0.6 \times 0.5 + 0.4 \times 0.9 = 0.30 + 0.36 = 0.66$$

      To sample, pick the style first, then draw given that style. In symbols, $p(x) = \sum_z p(z)\,p(x \mid z)$, where $z$ is the latent. This is the mixture-model idea from module 8, and VAEs, GANs, and diffusion all use a latent $z$, usually a vector of random numbers.

      :::mixup "Each number in a learned latent vector means something nameable, like 'style' or 'viewpoint'."
      We named our latent to make the arithmetic clear. A trained model's latent coordinates are whatever helped it fit the data. Sometimes one direction lines up with a nameable property, but you find that out by changing it and looking, not by assuming it.
      :::
    id: generative-models.s3
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.generative-models
  - title: Sample new cats, score old doodles
    markdown: |-
      The program below learns both kinds of model from the table: it prints the classifier's row ratios, then uses the cat column to sample new cats and to score how typical a doodle is.

      ```python run
      import numpy as np

      ears = ["pointy", "floppy", "round"]
      counts = {"cat": [8, 1, 3], "dog": [2, 5, 1]}   # 20 doodles in all

      # Discriminative: p(cat | ears) reads across one row of the table
      for i, e in enumerate(ears):
          c, d = counts["cat"][i], counts["dog"][i]
          print(f"p(cat | {e}) = {c}/{c + d} = {c / (c + d):.2f}")

      # Generative: p(ears | cat) reads down the cat column
      p_ears_cat = np.array(counts["cat"]) / sum(counts["cat"])
      print("p(ears | cat):", dict(zip(ears, p_ears_cat.round(3).tolist())))

      # Sampling: draw six new cat doodles (fixed start, so it repeats)
      rng = np.random.default_rng(7)
      print("six sampled cats:", rng.choice(ears, size=6, p=p_ears_cat).tolist())

      # Scoring: how typical is a doodle? p(ears, label) = count / 20
      for e, y in [("pointy", "cat"), ("floppy", "cat"), ("round", "dog")]:
          print(f"p({e}, {y}) = {counts[y][ears.index(e)] / 20:.2f}")
      ```

      A floppy-eared cat scores 0.05, eight times rarer than a pointy-eared one (0.40). Scores like this power the anomaly detectors in module 8: a low score flags an unusual case.

      The **seed** (the 7) starts the random-number sequence. Run it twice and you get the same six cats; change the seed and you get different ones. Image generators work the same way: a seed reproduces an image only if the model, prompt, settings, and software stay the same too. Try seed 8, then change the cat counts to `[4, 4, 4]` and watch the samples even out.
    id: generative-models.s4
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.generative-models
  - title: Good-looking and varied are two different tests
    markdown: |-
      Imagine a generator that draws the same excellent pointy-eared cat every time. Each drawing looks great, yet a third of real cats have floppy or round ears and it never draws one. Now imagine a generator that draws every ear shape in the right proportions, but the cats are scribbles.

      These two failures name the two things to measure:

      - **Fidelity**: do individual samples look like real data?
      - **Diversity**, or **coverage**: do the samples spread across everything the real data contains, in roughly the right proportions?

      Compare the always-pointy generator's proportions (1, 0, 0) with the real cat column (0.667, 0.083, 0.25): perfect fidelity, poor coverage. For images, the standard summary is **FID** (Fréchet Inception Distance, Heusel et al., 2017). It runs real and generated images through a trained image network, fits a bell curve to each set's features, and measures the distance between the two bells. Lower is better, and it drops only when samples are both realistic and varied. When a request is involved ("a green cat"), also check that the samples match it.

      Next, the module builds real generators, each with its own trick for $p(x)$.
    id: generative-models.s5
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.generative-models
  - id: generative-models.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.generative-models
    markdown: Count tables to read both ways, plus a fraud scorer, a music generator, and a seed that won't reproduce, test whether you can tell what a model learned and what it can do.
    takeaway: |-
      A discriminative model learns p(label | data) and can only classify. A generative model learns p(data), so it can also sample new examples and score how typical one is.
  - id: generative-models.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.generative-models
    markdown: |-
      A generator produces possible samples, often guided by a condition. Check their quality, variety, coverage, and fit to the request separately.
navigation:
  routes:
    - id: route.core
      scene_sequence:
        - generative-models.s1
