schema_version: 0.2-draft
lesson:
  id: transfer-and-domain-adaptation
  version: 0.4.0-draft
  title: Reuse learning when the next task or domain changes
  state: draft
  summary: A solar farm has 600 photos of cracked panels, too few to train a vision model. Borrow one trained on a million images, then keep it working when the weather changes.
  slot: M31.3
  category: learning
  sources:
    - title: "How transferable are features in deep neural networks? (Yosinski et al., 2014)"
      url: https://arxiv.org/abs/1411.1792
    - title: "Domain-Adversarial Training of Neural Networks (Ganin et al., 2016)"
      url: https://arxiv.org/abs/1505.07818
    - title: Dive into Deep Learning — Fine-Tuning
      url: https://d2l.ai/chapter_computer-vision/fine-tuning.html
    - title: Dive into Deep Learning — Environment and Distribution Shift (covariate shift correction)
      url: https://d2l.ai/chapter_linear-classification/environment-and-distribution-shift.html
objectives:
  - id: objective.transfer-and-domain-adaptation
    version: 2-draft
    statement: Choose between feature extraction and fine-tuning, estimate target performance under covariate shift with importance weights, explain domain-adversarial training, and check for negative transfer on labeled target data.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - transfer-and-domain-adaptation.base.v2
      - transfer-and-domain-adaptation.transfer.v2
      - transfer-and-domain-adaptation.calculate
    prerequisites:
      - anyOf:
          - objective.learned-representations
      - anyOf:
          - objective.robustness-and-shift
scenes:
  - id: transfer-and-domain-adaptation.s1
    title: Six hundred photos and a borrowed network
    type: explanation
    depth: intuition
    objective_refs:
      - objective.transfer-and-domain-adaptation
    markdown: |-
      A solar farm wants a model that spots cracked panels in drone photos. It has 600 labeled photos. A ResNet-50 has about 25 million weights; trained from scratch on 600 photos, it would mostly memorize them. But a ResNet-50 already trained on ImageNet's 1.2 million photos can detect edges, textures, and shapes. **Transfer learning** reuses a network trained on one task as the starting point for another.

      There are two standard ways to do it:

      | | **Feature extraction** | **Fine-tuning** |
      | --- | --- | --- |
      | What trains | Only a new output layer (the *head*) | The head plus some or all pretrained layers |
      | Weights updated | 2,048 × 2 + 2 = 4,098 | Up to about 25 million |
      | Learning rate | Normal | Small, so the pretrained features aren't wrecked |
      | Suits | Few labels | More labels, or images unlike the originals |

      In feature extraction the pretrained body is **frozen**: each photo passes through it once, becomes a vector of 2,048 numbers, and a small classifier learns "cracked or intact" from those vectors.

      Why do borrowed features help at all? Yosinski et al. (2014) found that a network's first layers learn general detectors, such as edges and color blobs, that suit almost any photo, while later layers become specific to the original task. That's why fine-tuning often freezes the early layers and retrains the later ones.

      :::predict The farm has only 60 labeled photos instead of 600. Which option would you try first?
      Feature extraction. Fine-tuning 25 million weights on 60 photos can overfit within a few passes, while 4,098 weights on fixed features are much harder to overfit. As labels grow into the thousands, fine-tuning usually pulls ahead.
      :::
    bridges: []
  - id: transfer-and-domain-adaptation.s2
    title: Source, target, and what you get to see
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.transfer-and-domain-adaptation
    markdown: |-
      The fine-tuned model works well at the first farm, with 93% accuracy on 200 held-out photos. Now the company opens a second farm in a cloudier region. The first farm's photos are the **source domain**, where the model learned. The new farm's photos are the **target domain**, where it must work. What you may use from the target decides which methods apply:

      | Setting | Target data during training | Solar example |
      | --- | --- | --- |
      | Supervised fine-tuning | Labeled | 600 labeled photos from the new farm |
      | **Unsupervised domain adaptation** | Inputs only, no labels | 5,000 unlabeled drone photos from the new farm |
      | **Domain generalization** | None | Must work at farms nobody has photographed yet |

      Keep the names honest. A method that looked at the new farm's photos during training is doing adaptation, even without labels, and shouldn't be reported as generalizing to unseen farms.

      :::mixup "Starting from a pretrained model can only help."
      Sometimes the source's habits fit the target badly. Suppose the farm switches to thermal cameras, and fine-tuning the ImageNet network gives 76% while training from scratch on the same labeled thermal photos gives 80%. That's **negative transfer**: reuse made things worse. Always train a from-scratch baseline on the same data, so you'd notice.
      :::
    bridges: []
  - id: transfer-and-domain-adaptation.s3
    title: Reweight the old farm to look like the new one
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.transfer-and-domain-adaptation
    markdown: |-
      At the new farm, a cracked panel still looks cracked; only the mix of photos has changed. Most are taken under overcast skies. That's **covariate shift**, which you met in module 3: the inputs change, but the right label for each input doesn't. And the fix from module 3's museum survey works here too: count each example by how common its kind is in the target, divided by how common it is in the source.

      The team's 1,000 labeled validation photos come from the old farm:

      | Sky | Old farm (source) | New farm (target) | Weight | Accuracy on source photos |
      | --- | ---: | ---: | ---: | ---: |
      | Sunny | 80% | 30% | 0.3 / 0.8 = 0.375 | 95% |
      | Overcast | 20% | 70% | 0.7 / 0.2 = 3.5 | 80% |

      Plain accuracy is 0.8 × 95 + 0.2 × 80 = 92%. Reweighted to the new farm's mix, it's 0.3 × 95 + 0.7 × 80 = 84.5%. Expect about 84.5%, not 92%.

      :::papers Importance weighting
      $$\mathbb{E}_{x,y \sim T}\big[\ell(x,y)\big] = \mathbb{E}_{x,y \sim S}\Big[\tfrac{p_T(x)}{p_S(x)}\,\ell(x,y)\Big]$$

      This holds when $p(y \mid x)$ is the same in both domains, and every kind of target input also appears in the source. Here $\ell$ is "was the prediction wrong", and $p_T(x)/p_S(x)$ is 3.5 for an overcast photo. Multiplying the *training* loss by the same weights makes the model care more about overcast photos. For real images you can't write down $p_T(x)$, so you train a classifier to tell source photos from target photos and turn its odds into weights.
      :::

      ```python run
      import numpy as np

      # 1,000 labeled validation photos from the old farm (the source)
      sky = np.array(["sunny"] * 800 + ["overcast"] * 200)
      correct = np.concatenate([np.ones(760), np.zeros(40),    # sunny: 760 of 800 right
                                np.ones(160), np.zeros(40)])   # overcast: 160 of 200 right

      p_source = {"sunny": 0.8, "overcast": 0.2}
      p_target = {"sunny": 0.3, "overcast": 0.7}   # the new farm is mostly overcast
      w = np.array([p_target[s] / p_source[s] for s in sky])

      print(f"weights: sunny {p_target['sunny'] / p_source['sunny']:.3f}, "
            f"overcast {p_target['overcast'] / p_source['overcast']:.3f}")
      print(f"plain accuracy (source mix):     {correct.mean():.1%}")
      print(f"weighted accuracy (target mix):  {(w * correct).sum() / w.sum():.1%}")
      print(f"effective sample size: {w.sum() ** 2 / (w ** 2).sum():.0f} of {len(w)}")
      ```

      The last line shows the cost. Because 200 overcast photos carry most of the weight, the 1,000 reweighted photos are about as informative as 390 ordinary ones. Change the target to 5% sunny and 95% overcast: the estimate drops to 80.8%, and the effective sample size to 221.
    bridges: []
  - id: transfer-and-domain-adaptation.s4
    title: Train features that can't tell the farms apart
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.transfer-and-domain-adaptation
    markdown: |-
      Reweighting needs the target's kinds of photos to appear in the source. If the new farm uses different drones, every photo looks a little different, and there's nothing to upweight. Another idea: learn features that separate cracked from intact panels but *can't* reveal which farm a photo came from.

      **Domain-adversarial training** (DANN; Ganin et al., 2016) adds a third part to the network: a **domain classifier** that tries to guess, from the features, whether a photo came from the source or the target. The feature extractor is trained to help the label predictor and to *fool* the domain classifier. A **gradient reversal layer** does this with one trick: it passes features forward unchanged, but multiplies the gradient by $-\lambda$ on the way back. Only source photos need crack labels. The domain classifier trains on photos from both farms, and its only label is which farm each came from.

      :::papers The DANN objective
      $$E(\theta_f, \theta_y, \theta_d) = \sum_{i \in S} L_y\big(G_y(G_f(x_i)),\, y_i\big) \;-\; \lambda \sum_{i \in S \cup T} L_d\big(G_d(G_f(x_i)),\, d_i\big)$$

      $G_f$ is the feature extractor, $G_y$ the crack predictor, and $G_d$ the domain classifier; $d_i$ is 0 for old-farm photos and 1 for new-farm photos. Training looks for a saddle point: $\theta_f$ and $\theta_y$ minimize $E$, while $\theta_d$ maximizes it (which means minimizing the domain loss $L_d$). When the domain classifier can do no better than 50%, the features carry no farm information.
      :::

      Aligned features can still line up the wrong things. If 5% of old-farm panels are cracked but 40% of new-farm panels are, forcing the two feature distributions to match will push some cracked new-farm panels toward intact old ones. So label a couple of hundred target photos as a test set before trusting any adapted model. It's the only direct measurement you have.
    diagram:
      caption: Domain-adversarial training. The reversed gradient pushes the features to hide which farm a photo came from.
      description: A photo from either farm goes into the feature extractor. The features go to the crack predictor, which is trained on labeled source photos. The features also pass through the gradient reversal layer to the domain classifier, which guesses source or target. The reversal layer leaves features unchanged going forward and multiplies the gradient by minus lambda going back.
      nodes:
        - id: photo
          label: Drone photo
          note: old farm or new farm
          col: 0
          row: 1
          tone: data
        - id: features
          label: Feature extractor
          note: G_f
          col: 1
          row: 1
          tone: accent
        - id: label
          label: Crack predictor
          note: "G_y: trained on source labels"
          col: 2
          row: 0
        - id: grl
          label: Gradient reversal
          note: forward unchanged, backward × (−λ)
          col: 2
          row: 2
          tone: warn
        - id: domain
          label: Domain classifier
          note: "G_d: old farm or new farm?"
          col: 3
          row: 2
      edges:
        - from: photo
          to: features
        - from: features
          to: label
          label: features
        - from: features
          to: grl
          label: features
        - from: grl
          to: domain
    bridges: []
  - id: transfer-and-domain-adaptation.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.transfer-and-domain-adaptation
    markdown: Importance weights and reweighted accuracies to compute, then hospital scans, children's speech, night cameras, and satellite images test which transfer method fits which data.
    takeaway: |-
      Reuse a pretrained network: freeze it when labels are scarce, fine-tune when you have more. When the target shifts, reweight, align features, or both, and measure on labeled target data.
  - id: transfer-and-domain-adaptation.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.transfer-and-domain-adaptation
    markdown: |-
      Transfer reuses earlier learning. Check whether it helps the new task, which target data were available, and whether earlier capabilities were lost.
