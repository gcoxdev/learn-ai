schema_version: 0.2-draft
lesson:
  id: transfer-and-domain-adaptation
  version: 0.1.0-draft
  title: Reuse learning when the next task or domain changes
  state: draft
  summary: Transfer learning reuses learned components, domain adaptation uses information from a target domain,
    and domain generalization aims at unseen domains; evaluate negative transfer and data-access assumptions.
  slot: M31.3
  category: learning
  minutes: 12
  sources:
  - title: Domain-Adversarial Training of Neural Networks
    url: https://arxiv.org/abs/1505.07818
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
objectives:
- id: objective.transfer-and-domain-adaptation
  version: 1-draft
  statement: Transfer learning reuses learned components, domain adaptation uses information from a target domain,
    and domain generalization aims at unseen domains; evaluate negative transfer and data-access assumptions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - transfer-and-domain-adaptation.base
  - transfer-and-domain-adaptation.transfer
  prerequisites:
  - anyOf:
    - objective.continued-pretraining
  - anyOf:
    - objective.robustness-and-shift
scenes:
- id: transfer-and-domain-adaptation.s1
  title: Reuse a useful representation
  type: explanation
  depth: intuition
  objective_refs:
  - objective.transfer-and-domain-adaptation
  markdown: A pretrained vision encoder can supply features for a smaller labeled task, either frozen or fine-tuned.
    Transfer can reduce data requirements when learned structure is relevant. It can also hurt when source assumptions
    conflict with the target, a phenomenon called negative transfer.
  text_mode: A pretrained vision encoder can supply features for a smaller labeled task, either frozen or fine-tuned.
    Transfer can reduce data requirements when learned structure is relevant. It can also hurt when source assumptions
    conflict with the target, a phenomenon called negative transfer.
  bridges: []
- id: transfer-and-domain-adaptation.s2
  title: Distinguish target access
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.transfer-and-domain-adaptation
  markdown: Domain adaptation typically allows some target-domain data during adaptation, possibly without labels.
    Domain generalization aims to perform on domains not available during training. A study using target examples
    should not describe the same protocol as fully unseen-domain generalization.
  text_mode: Domain adaptation typically allows some target-domain data during adaptation, possibly without labels.
    Domain generalization aims to perform on domains not available during training. A study using target examples
    should not describe the same protocol as fully unseen-domain generalization.
  bridges: []
- id: transfer-and-domain-adaptation.s3
  title: Trace a change in image conditions
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.transfer-and-domain-adaptation
  markdown: A classifier trained on studio photos encounters warehouse cameras with different lighting and backgrounds.
    Feature alignment or target tuning may help. If class meanings or label processes also change, simply matching
    feature distributions can align the wrong things.
  text_mode: A classifier trained on studio photos encounters warehouse cameras with different lighting and backgrounds.
    Feature alignment or target tuning may help. If class meanings or label processes also change, simply matching
    feature distributions can align the wrong things.
  bridges: []
- id: transfer-and-domain-adaptation.s4
  title: Evaluate the transfer contract
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.transfer-and-domain-adaptation
  markdown: Record which source weights, target examples, labels, and tuning feedback were used. Compare training
    from scratch and frozen-feature baselines where feasible. Measure target quality, retained source skills, and
    robustness; transfer is useful when evidence supports the intended new setting.
  text_mode: Record which source weights, target examples, labels, and tuning feedback were used. Compare training
    from scratch and frozen-feature baselines where feasible. Measure target quality, retained source skills, and
    robustness; transfer is useful when evidence supports the intended new setting.
  bridges: []
- id: transfer-and-domain-adaptation.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.transfer-and-domain-adaptation
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Transfer learning reuses learned components, domain adaptation uses information from a target domain,
    and domain generalization aims at unseen domains; evaluate negative transfer and data-access assumptions.
- id: transfer-and-domain-adaptation.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.transfer-and-domain-adaptation
  markdown: Transfer learning reuses learned components, domain adaptation uses information from a target domain,
    and domain generalization aims at unseen domains; evaluate negative transfer and data-access assumptions.
  text_mode: Transfer learning reuses learned components, domain adaptation uses information from a target domain,
    and domain generalization aims at unseen domains; evaluate negative transfer and data-access assumptions.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - transfer-and-domain-adaptation.s1
    - transfer-and-domain-adaptation.s2
    - transfer-and-domain-adaptation.s3
    - transfer-and-domain-adaptation.s4
    - transfer-and-domain-adaptation.check
    gate_refs:
    - gate.core
  scene_aliases:
    transfer-and-domain-adaptation.recap: transfer-and-domain-adaptation.check
assessment_families:
- id: transfer-and-domain-adaptation.base
  objective_ref: objective.transfer-and-domain-adaptation
  task: base
  response_type: single_choice
  points: 1
  hint: 'Distinguish target access: trace the inputs, operation, and result before choosing.'
  remediation_scene: transfer-and-domain-adaptation.s2
  variants:
  - id: transfer-and-domain-adaptation.base.1
    prompt: What is negative transfer?
    options:
    - id: c
      text: Every form of fine-tuning
    - id: a
      text: Reusing source learning harms the target task
    - id: b
      text: Any decrease in file size
    answer: a
    feedback: Source structure can be mismatched to the target.
  - id: transfer-and-domain-adaptation.base.2
    prompt: Using unlabeled target images during training belongs to which access setting?
    options:
    - id: a
      text: Domain adaptation
    - id: b
      text: Fully unseen-target domain generalization
    - id: c
      text: No target access
    answer: a
    feedback: Target data are available even without labels.
- id: transfer-and-domain-adaptation.transfer
  objective_ref: objective.transfer-and-domain-adaptation
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Evaluate the transfer contract: trace the inputs, operation, and result before choosing.'
  remediation_scene: transfer-and-domain-adaptation.s4
  variants:
  - id: transfer-and-domain-adaptation.transfer.1
    prompt: Why can feature-distribution matching fail?
    options:
    - id: a
      text: Similar distributions may align semantically different classes
    - id: b
      text: Matching always proves label correctness
    - id: c
      text: Only model size matters
    answer: a
    feedback: Distributional similarity does not establish semantic correspondence.
  - id: transfer-and-domain-adaptation.transfer.2
    prompt: What should a transfer report disclose?
    options:
    - id: b
      text: Only final accuracy
    - id: c
      text: Only the model’s nickname
    - id: a
      text: Source artifacts, target-data access, labels, and tuning protocol
    answer: a
    feedback: The access contract determines what was learned from where.
