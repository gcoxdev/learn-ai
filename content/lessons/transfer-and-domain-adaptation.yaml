assessment_families:
  - id: transfer-and-domain-adaptation.base
    objective_ref: objective.transfer-and-domain-adaptation
    task: base
    response_type: single_choice
    points: 1
    hint: 'Distinguish target access: trace the inputs, operation, and result before choosing.'
    remediation_scene: transfer-and-domain-adaptation.s2
    variants:
      - id: transfer-and-domain-adaptation.base.1
        prompt: What is negative transfer?
        options:
          - id: c
            text: Every form of fine-tuning
          - id: a
            text: Reusing source learning harms the target task
          - id: b
            text: Any decrease in file size
        answer: a
        feedback: Source structure can be mismatched to the target.
        retired: true
      - id: transfer-and-domain-adaptation.base.2
        prompt: Using unlabeled target images during training belongs to which access setting?
        options:
          - id: a
            text: Domain adaptation
          - id: b
            text: Fully unseen-target domain generalization
          - id: c
            text: No target access
        answer: a
        feedback: Target data are available even without labels.
        retired: true
  - id: transfer-and-domain-adaptation.transfer
    objective_ref: objective.transfer-and-domain-adaptation
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Evaluate the transfer contract: trace the inputs, operation, and result before choosing.'
    remediation_scene: transfer-and-domain-adaptation.s4
    variants:
      - id: transfer-and-domain-adaptation.transfer.1
        prompt: Why can feature-distribution matching fail?
        options:
          - id: a
            text: Similar distributions may align semantically different classes
          - id: b
            text: Matching always proves label correctness
          - id: c
            text: Only model size matters
        answer: a
        feedback: Distributional similarity does not establish semantic correspondence.
        retired: true
      - id: transfer-and-domain-adaptation.transfer.2
        prompt: What should a transfer report disclose?
        options:
          - id: b
            text: Only final accuracy
          - id: c
            text: Only the model’s nickname
          - id: a
            text: Source artifacts, target-data access, labels, and tuning protocol
        answer: a
        feedback: The access contract determines what was learned from where.
        retired: true
  - id: transfer-and-domain-adaptation.base.v2
    objective_ref: objective.transfer-and-domain-adaptation
    task: base
    response_type: single_choice
    points: 1
    hint: Ask which weights change and what the target data look like. Few labels favor a frozen body; an importance weight is target share divided by source share.
    remediation_scene: transfer-and-domain-adaptation.s1
    variants:
      - id: transfer-and-domain-adaptation.base.v2.1
        prompt: A team has 60 labeled photos for a new task and an ImageNet-pretrained ResNet-50. Which approach is the safer first try?
        options:
          - id: b
            text: Fine-tune all 25 million weights at the usual learning rate
          - id: a
            text: Freeze the pretrained body and train only a new output layer
          - id: c
            text: Train a fresh ResNet-50 from random weights on the 60 photos
        answer: a
        feedback: With 60 photos, training a few thousand head weights on fixed features is much harder to overfit. Updating 25 million weights at a normal learning rate can wreck the pretrained features and memorize the photos, and training from scratch throws away what the network already knows.
      - id: transfer-and-domain-adaptation.base.v2.2
        prompt: During feature extraction with a pretrained network, which weights does training update?
        options:
          - id: a
            text: Only the new output layer that maps features to the new labels
          - id: b
            text: The early layers, since they hold the general edge detectors
          - id: c
            text: All layers, but with a learning rate ten times smaller than usual
        answer: a
        feedback: Feature extraction freezes the whole pretrained body and trains only the new head. Updating layers with a small learning rate is fine-tuning, and it's the early, general layers that are usually kept frozen.
      - id: transfer-and-domain-adaptation.base.v2.3
        prompt: Overcast photos are 20% of the source validation set and 70% of the target. Under importance weighting, why does each overcast source photo count 3.5 times?
        options:
          - id: c
            text: Overcast photos are harder, so errors on them deserve extra weight
          - id: b
            text: The model is 3.5 times less accurate on overcast photos
          - id: a
            text: Overcast photos are 3.5 times as common in the target as in the source
        answer: a
        feedback: The weight is p_target / p_source = 0.7 / 0.2 = 3.5, a ratio of frequencies. It says nothing about how hard the photos are or how accurate the model is on them.
      - id: transfer-and-domain-adaptation.base.v2.4
        prompt: In domain-adversarial training (DANN), what does the gradient reversal layer make the feature extractor do?
        options:
          - id: b
            text: Help the domain classifier tell source photos from target photos
          - id: a
            text: Produce features from which the domain classifier can't tell the domains apart
          - id: c
            text: Undo its last update whenever the label predictor makes an error
        answer: a
        feedback: Reversing the gradient flips the feature extractor's goal from helping the domain classifier to fooling it, so the features lose domain information. The domain classifier itself still learns to tell the domains apart.
      - id: transfer-and-domain-adaptation.base.v2.5
        prompt: A paper trains on photos from three farms and also uses 5,000 unlabeled photos from a fourth farm during training, then tests on that fourth farm. How should it describe the setting?
        options:
          - id: a
            text: Unsupervised domain adaptation, since it used target photos without labels
          - id: b
            text: Domain generalization, since no labels from the fourth farm were used
          - id: c
            text: Supervised fine-tuning, since the model was trained on the fourth farm
        answer: a
        feedback: Seeing unlabeled target inputs during training is unsupervised domain adaptation. Domain generalization means no target data at all, and supervised fine-tuning needs target labels.
  - id: transfer-and-domain-adaptation.transfer.v2
    objective_ref: objective.transfer-and-domain-adaptation
    task: transfer
    response_type: single_choice
    points: 1
    hint: "List what the target offers: labels, unlabeled inputs, or nothing. Then check whether target inputs ever appear in the source, and keep a from-scratch baseline in mind."
    remediation_scene: transfer-and-domain-adaptation.s2
    variants:
      - id: transfer-and-domain-adaptation.transfer.v2.1
        prompt: A chest X-ray model trained at Hospital A will be deployed at Hospital B, which has 10,000 unlabeled scans and a budget to label 200. Which plan fits?
        options:
          - id: c
            text: Deploy the Hospital A model as is, since X-rays look alike everywhere
          - id: a
            text: Adapt using the unlabeled B scans, and test on the 200 labeled ones
          - id: b
            text: Fine-tune on all 10,000 B scans, using the model's own predictions as labels
        answer: a
        feedback: Unlabeled target scans support domain adaptation, and 200 labeled B scans give the only direct measure of how it works there. Scanners and patients differ between hospitals, so deploying as is risks a silent drop. Training on the model's own guesses, with no labeled B scans to check them, could lock in its mistakes at B unnoticed.
      - id: transfer-and-domain-adaptation.transfer.v2.2
        prompt: A speech recognizer pretrained on adult speech and fine-tuned on children's recordings scores 70%. The same network trained from scratch on those recordings scores 75%. What does this show?
        options:
          - id: a
            text: Negative transfer, since the adult pretraining hurt this target
          - id: b
            text: Overfitting, since the from-scratch model memorized the data
          - id: c
            text: Covariate shift, which importance weighting will fix directly
        answer: a
        feedback: Reuse did worse than the baseline on the same data, which is negative transfer. Overfitting would lower the from-scratch score, yet it came out higher. Reweighting adult examples can't fix a source whose habits don't fit the target.
      - id: transfer-and-domain-adaptation.transfer.v2.3
        prompt: A parking camera's training photos are all daytime. It will now run at night too. Why won't importance weighting of the daytime photos help?
        options:
          - id: b
            text: Night photos need larger weights than the method allows
          - id: c
            text: Weighting only works when the labels change, not the inputs
          - id: a
            text: No night photos exist in the source, so there's nothing to upweight
        answer: a
        feedback: Importance weighting needs every kind of target input to appear in the source. With zero night photos, no weight creates them; collect and label night photos instead. Weighting is designed for input shift, not label change.
      - id: transfer-and-domain-adaptation.transfer.v2.4
        prompt: A land-use classifier has 1 million labeled satellite images and an ImageNet-pretrained network. Satellite images look quite unlike everyday photos. Which approach should the team expect to do best?
        options:
          - id: c
            text: Feature extraction, since frozen ImageNet features can't overfit
          - id: b
            text: Domain-adversarial training, since the images differ from ImageNet
          - id: a
            text: Fine-tuning many layers, since there are plenty of target labels
        answer: a
        feedback: With a million labels and images unlike the source, updating the pretrained layers lets the features adapt, and overfitting is not the main risk. DANN aligns an unlabeled target with a labeled source, which isn't the situation here.
      - id: transfer-and-domain-adaptation.transfer.v2.5
        prompt: A new farm has 40% cracked panels, against 5% at the old farm. A team runs DANN until the domain classifier sits at 50%. What is the risk?
        options:
          - id: a
            text: Forcing equal feature distributions may map cracked panels onto intact ones
          - id: b
            text: The domain classifier at 50% means the crack predictor has stopped learning
          - id: c
            text: The model will now ignore the old farm, since its data count less
        answer: a
        feedback: When class proportions differ, matching the overall feature distributions pushes some target cracks toward source intact panels. A domain classifier at chance says nothing about the crack predictor, which still trains on source labels.
  - id: transfer-and-domain-adaptation.calculate
    objective_ref: objective.transfer-and-domain-adaptation
    task: base
    response_type: numeric
    points: 1
    hint: An importance weight is target share divided by source share. To estimate target accuracy, weight each group's accuracy by its share in the target.
    remediation_scene: transfer-and-domain-adaptation.s3
    absolute_tolerance: 0.01
    variants:
      - id: transfer-and-domain-adaptation.calculate.1
        prompt: Night photos are 20% of a source dataset and 60% of the target. What importance weight does each night photo get?
        answer: 3
        feedback: 0.6 / 0.2 = 3. Each night source photo stands in for three, because night is three times as common in the target.
      - id: transfer-and-domain-adaptation.calculate.2
        prompt: A model is 96% accurate on daytime validation photos and 70% on night photos. The target is half day and half night. What is the estimated target accuracy, in percent?
        answer: 83
        feedback: 0.5 × 96 + 0.5 × 70 = 48 + 35 = 83%.
      - id: transfer-and-domain-adaptation.calculate.3
        prompt: English messages are 90% of a training set but 50% of the messages a model will see in use. What importance weight does each English training message get? (Two decimals.)
        answer: 0.56
        feedback: 0.5 / 0.9 ≈ 0.56. English is over-represented in training, so each English message counts for less than one.
      - id: transfer-and-domain-adaptation.calculate.4
        prompt: A classifier is 90% accurate on type-A inputs and 75% on type-B. In the target, 40% of inputs are type A and 60% type B. What is the estimated target accuracy, in percent?
        answer: 81
        feedback: 0.4 × 90 + 0.6 × 75 = 36 + 45 = 81%.
      - id: transfer-and-domain-adaptation.calculate.5
        prompt: In the solar example, sunny photos are 80% of the source and 30% of the target. What importance weight does a sunny photo get? (Three decimals.)
        answer: 0.375
        feedback: 0.3 / 0.8 = 0.375. Sunny photos are rarer in the target, so each counts for less than one.
