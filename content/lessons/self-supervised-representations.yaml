schema_version: 0.2-draft
lesson:
  id: self-supervised-representations
  version: 0.2.0-draft
  title: Create a learning task from the data itself
  state: draft
  summary: Hide part of an example or compare two views to create a training puzzle, then check whether the
    learned features help elsewhere.
  slot: M08.6
  category: learning
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: A Simple Framework for Contrastive Learning of Visual Representations
    url: https://arxiv.org/abs/2002.05709
objectives:
- id: objective.self-supervised-representations
  version: 1-draft
  statement: Self-supervised objectives derive targets from observations; masking, prediction, and contrastive
    learning encourage representations whose usefulness must be tested on independent tasks.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - self-supervised-representations.base
  - self-supervised-representations.transfer
  prerequisites:
  - anyOf:
    - objective.ways-to-learn
  - anyOf:
    - objective.features-and-bias
scenes:
- id: self-supervised-representations.s1
  title: The data can supply a target
  type: explanation
  depth: intuition
  objective_refs:
  - objective.self-supervised-representations
  markdown: Hide part of an input and predict it, predict the next part, or compare two views of the same example.
    These tasks create supervision without manually labeling every desired downstream category. People still
    choose the data, transformations, objective, and model, so self-supervised does not mean design-free.
  text_mode: Hide part of an input and predict it, predict the next part, or compare two views of the same
    example. These tasks create supervision without manually labeling every desired downstream category. People
    still choose the data, transformations, objective, and model, so self-supervised does not mean design-free.
  bridges: []
- id: self-supervised-representations.s2
  title: A contrastive comparison
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.self-supervised-representations
  markdown: 'Take two valid augmented views of one image as a positive pair and selected views of other images
    as negatives. A contrastive objective favors higher similarity for the positive pair relative to alternatives.
    The representation learns according to what the augmentation preserves and what the comparison distinguishes.


    A **view** is one version of an example. **Augmentation** creates another version, such as a crop. For
    two crops containing the same bicycle, the learner is encouraged to keep related information close in its
    number representation. A crop containing only empty sky may no longer support the bicycle task; calling
    it a positive pair does not fix that mismatch.'
  text_mode: 'Take two valid augmented views of one image as a positive pair and selected views of other images
    as negatives. A contrastive objective favors higher similarity for the positive pair relative to alternatives.
    The representation learns according to what the augmentation preserves and what the comparison distinguishes.


    A **view** is one version of an example. **Augmentation** creates another version, such as a crop. For
    two crops containing the same bicycle, the learner is encouraged to keep related information close in its
    number representation. A crop containing only empty sky may no longer support the bicycle task; calling
    it a positive pair does not fix that mismatch.'
  bridges: []
- id: self-supervised-representations.s3
  title: Prevent a trivial solution
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.self-supervised-representations
  markdown: 'If an objective only asks all positive views to match, a constant representation may satisfy it
    while losing useful distinctions. Negative comparisons or suitable noncontrastive mechanisms can help avoid
    collapse. A negative pair can also be misleading when two different examples share the same relevant content.


    If every image is represented by [0, 0], all pairs match perfectly but bicycles and boats become indistinguishable.
    That is **collapse**. Requiring useful distinctions, or using appropriately designed alternative objectives,
    prevents the “make everything equal” shortcut. Merely seeing a low loss does not tell you whether this
    shortcut occurred.'
  text_mode: 'If an objective only asks all positive views to match, a constant representation may satisfy
    it while losing useful distinctions. Negative comparisons or suitable noncontrastive mechanisms can help
    avoid collapse. A negative pair can also be misleading when two different examples share the same relevant
    content.


    If every image is represented by [0, 0], all pairs match perfectly but bicycles and boats become indistinguishable.
    That is **collapse**. Requiring useful distinctions, or using appropriately designed alternative objectives,
    prevents the “make everything equal” shortcut. Merely seeing a low loss does not tell you whether this
    shortcut occurred.'
  bridges: []
- id: self-supervised-representations.s4
  title: Measure the representation’s usefulness
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.self-supervised-representations
  markdown: 'Evaluate transfer to held-out tasks, including a simple probe or controlled fine-tuning setup.
    Strong performance on the pretext objective does not guarantee every desired property. Inspect shortcuts,
    augmentation validity, and domain shift. Representation quality is a relationship between objective, data,
    and intended use.


    The **pretext task** is the training puzzle made from the data. A **probe** is a small predictor trained
    on the saved representations to test what information is usable. **Fine-tuning** adjusts some or all of
    the original model on a new task. State which test you used: a frozen representation and a fully adapted
    model answer different questions.'
  text_mode: 'Evaluate transfer to held-out tasks, including a simple probe or controlled fine-tuning setup.
    Strong performance on the pretext objective does not guarantee every desired property. Inspect shortcuts,
    augmentation validity, and domain shift. Representation quality is a relationship between objective, data,
    and intended use.


    The **pretext task** is the training puzzle made from the data. A **probe** is a small predictor trained
    on the saved representations to test what information is usable. **Fine-tuning** adjusts some or all of
    the original model on a new task. State which test you used: a frozen representation and a fully adapted
    model answer different questions.'
