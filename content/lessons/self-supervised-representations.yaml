schema_version: 0.2-draft
lesson:
  id: self-supervised-representations
  version: 0.4.0-draft
  title: Create a learning task from the data itself
  state: draft
  summary: Nobody labeled the text word2vec learned from, yet it discovered that king − man + woman lands near queen. See how models invent their own training puzzles, and how those puzzles can backfire.
  slot: M08.6
  category: learning
  sources:
    - title: Dive into Deep Learning — authors’ open textbook
      url: https://d2l.ai/
    - title: "A Simple Framework for Contrastive Learning of Visual Representations (SimCLR; Chen et al., 2020)"
      url: https://arxiv.org/abs/2002.05709
    - title: "Efficient Estimation of Word Representations in Vector Space (word2vec; Mikolov et al., 2013)"
      url: https://arxiv.org/abs/1301.3781
    - title: "Representation Learning with Contrastive Predictive Coding (van den Oord et al., 2018)"
      url: https://arxiv.org/abs/1807.03748
objectives:
  - id: objective.self-supervised-representations
    version: 2-draft
    statement: Self-supervised learning makes its own targets from unlabeled data; test the learned features on separate tasks to see if they help.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - self-supervised-representations.base.v2
      - self-supervised-representations.transfer.v2
      - self-supervised-representations.calc.v2
    prerequisites:
      - anyOf:
          - objective.ways-to-learn
      - anyOf:
          - objective.features-and-bias
scenes:
  - id: self-supervised-representations.s1
    title: Hide a word, then guess it
    type: explanation
    depth: intuition
    objective_refs:
      - objective.self-supervised-representations
    markdown: |-
      In 2013, a Google team led by Tomas Mikolov released **word2vec**. It read billions of words of ordinary text, and nobody labeled a single one. Its whole job was a guessing game: given a word, predict the words that tend to appear around it. To win, it gave every word a list of a few hundred numbers, an embedding like those in the last lesson. Words used in similar company, like "coffee" and "tea," ended up with similar lists. The famous party trick: take the vector for *king*, subtract *man*, add *woman*, and the nearest word (other than the three you started with) is *queen*.

      That's **self-supervised learning**: the training targets come from the data itself, by hiding part of an example and asking the model to fill it in. The made-up puzzle is called the **pretext task**. Nobody cares about the guesses themselves. What we want is the **representation**, the internal list of numbers the model builds to make good guesses, because it can be reused for other jobs.

      | Pretext task | Hidden part | Famous example |
      | --- | --- | --- |
      | Predict neighboring words | The words around a word | word2vec (2013) |
      | Fill in masked words | About 15% of the words | BERT (2018) |
      | Predict the next word | Everything after this point | GPT models |
      | Match two views of one photo | Which crops belong together | SimCLR (2020) |

      Self-supervised doesn't mean design-free. People still choose the data, the puzzle, and what gets hidden, and those choices decide what the model learns.
    bridges: []
  - id: self-supervised-representations.s2
    title: Two crops of the same photo should match
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.self-supervised-representations
    markdown: |-
      Photos have no words to hide, so **contrastive learning** uses a different puzzle. Take a photo of a bicycle and make two altered copies, called **views**: crop a different region of each, shift the colors, blur one a little. Making such copies is **augmentation**. The two views form a **positive pair**, since they show the same thing. Views of other photos in the batch, say a boat and a dog, are **negatives**. The model must give the positive pair similar vectors and the negatives dissimilar ones.

      SimCLR (Chen, Kornblith, Norouzi, and Hinton, 2020) made this simple recipe famous. With a batch of N photos it makes 2N views, so each view has one positive partner and 2(N − 1) negatives.

      Here's the score for one view. Compare it with the other three by **cosine similarity** (1 means pointing the same way, 0 unrelated): 0.8 with its partner, 0.1 with the boat, 0.3 with the dog. Divide each by a **temperature** τ = 0.5, giving 1.6, 0.2, and 0.6, then apply softmax to turn them into probabilities: $e^{1.6} / (e^{1.6} + e^{0.2} + e^{0.6}) = 4.95 / 8.00 = 0.62$. The model "picks" its partner with probability 0.62, and the loss is $-\ln 0.62 = 0.48$. Training nudges the vectors to push that probability toward 1.

      ```python run
      import numpy as np

      def info_nce(sim_pos, sim_negs, tau):
          """Contrastive loss for one anchor: softmax over similarities / tau."""
          logits = np.array([sim_pos, *sim_negs]) / tau
          p = np.exp(logits) / np.exp(logits).sum()
          return p[0], -np.log(p[0])

      # Anchor: a crop of a bicycle photo. Positive: another crop of the same photo.
      cases = {
          "good features": (0.8, [0.1, 0.3]),    # negatives: a boat, a dog
          "false negative": (0.8, [0.1, 0.8]),   # the dog swapped for another bicycle
          "collapsed": (1.0, [1.0, 1.0]),        # every image maps to the same vector
      }
      tau = 0.5
      for name, (pos, negs) in cases.items():
          p, loss = info_nce(pos, negs, tau)
          print(f"{name:15s} P(pick the positive) = {p:.3f}   loss = {loss:.3f}")
      ```

      :::predict In the second case, the dog photo is replaced by a photo of a different bicycle, with similarity 0.8. What happens to the loss?
      It rises from 0.479 to 0.809. The loss insists the other bicycle is a negative, so training pushes two bicycle photos apart. That's a false negative, a "negative" that really matches, and it's common when a dataset has many photos of the same kind of thing.
      :::

      :::papers The InfoNCE loss
      For a view $i$ with positive partner $j$, SimCLR minimizes

      $$\mathcal{L}_i = -\log \frac{\exp(\mathrm{sim}(z_i, z_j)/\tau)}{\sum_{k \ne i} \exp(\mathrm{sim}(z_i, z_k)/\tau)}$$

      where $z$ is a view's vector, $\mathrm{sim}$ is cosine similarity, and the sum runs over the partner and every negative. With our numbers, the fraction is $e^{1.6}/(e^{1.6}+e^{0.2}+e^{0.6}) = 0.62$ and $\mathcal{L} = 0.48$. The name InfoNCE comes from van den Oord and colleagues (2018); SimCLR calls it NT-Xent. Change `tau` to 0.1 in the code: the softmax sharpens, and the loss for good features falls to 0.008.
      :::
    bridges: []
  - id: self-supervised-representations.s3
    title: The shortcut of making everything identical
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.self-supervised-representations
    markdown: |-
      Suppose the loss only asked positive pairs to match. There's a lazy way to win: map every photo to the same vector, say [1, 0]. Every pair matches perfectly, and bicycles, boats, and dogs become indistinguishable. This failure is called **collapse**.

      Negatives block that shortcut. Look at the third case in the code: when everything maps to one vector, all three similarities equal 1, the model can only guess among three candidates, and the loss is $\ln 3 = 1.099$, far worse than the 0.479 for useful features. The only way down is to keep different photos apart. Other methods avoid collapse without negatives, using tricks such as a slowly updated copy of the network, but they all need some force that stops everything from merging.

      Augmentations cause subtler shortcuts. If one crop shows only sky, calling it a positive with a bicycle crop asks the model to match things that share nothing. And whatever the augmentations change, the model learns to ignore. Shift colors, and it learns that color doesn't matter.
    bridges: []
  - id: self-supervised-representations.s4
    title: Test the features on a job they never saw
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.self-supervised-representations
    markdown: |-
      A low pretext loss says the model solved its puzzle. It doesn't say the representation helps with your job. Two standard checks answer that:

      - A **linear probe** freezes the model, turns each labeled example into its representation, and trains just one simple linear classifier on top. It tests what the representation already contains. SimCLR's headline result was a linear probe on ImageNet: its best model, a ResNet-50 image network made four times wider, scored 76.5% top-1, matching a standard-width ResNet-50 trained with all the labels.
      - **Fine-tuning** keeps training the whole model on the labeled task. It usually scores higher, but it tests the model's starting point more than the frozen features.

      :::mixup "Self-supervised features work for any downstream task."
      Features keep what the pretext task needed and drop what the augmentations taught the model to ignore.
      :::

      Here's how Ines, who sorts fruit by ripeness from photos, catches exactly that. She has 200,000 unlabeled fruit photos and 800 labeled ones. She pretrains with SimCLR's standard augmentations and runs a linear probe on the 800. Ripeness accuracy is poor. She rereads her augmentations: strong color shifts, which taught the model that color doesn't matter, and ripeness is mostly color. She pretrains again with crops and blur but no color shifts, and the probe improves clearly on her held-out photos. Same data, same loss; the augmentations decided what was learned.
    bridges: []
  - id: self-supervised-representations.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.self-supervised-representations
    markdown: Medical scans, near-duplicate product photos, a model that learned nothing, and a few contrastive-loss calculations test whether you can design a pretext task and judge what it taught.
    takeaway: |-
      Self-supervised learning invents a training puzzle from unlabeled data, such as hiding words or matching two views of a photo. The loss must block shortcuts like collapse, and the features must be tested on the job you actually care about.
  - id: self-supervised-representations.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.self-supervised-representations
    markdown: |-
      Self-supervised learning creates training puzzles from the data itself. Check whether solving those puzzles produces useful features for new tasks, rather than a shortcut such as making every example look identical.
