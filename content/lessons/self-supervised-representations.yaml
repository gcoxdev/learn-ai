assessment_families:
  - id: self-supervised-representations.base
    objective_ref: objective.self-supervised-representations
    task: base
    response_type: single_choice
    points: 1
    hint: 'A contrastive comparison: trace the inputs, operation, and result before choosing.'
    remediation_scene: self-supervised-representations.s2
    variants:
      - id: self-supervised-representations.base.1
        prompt: Where do self-supervised targets come from?
        options:
          - id: b
            text: Necessarily a human label for every downstream class
          - id: c
            text: No target or objective at all
          - id: a
            text: A task constructed from the observed data
        answer: a
        feedback: The training signal is derived from the data under a designed task.
        retired: true
      - id: self-supervised-representations.base.2
        prompt: What is representation collapse?
        options:
          - id: c
            text: Only a storage failure
          - id: a
            text: Different inputs map to uninformative nearly identical representations
          - id: b
            text: A guaranteed increase in every downstream score
        answer: a
        feedback: A trivial constant-like solution can satisfy some poorly constrained objectives.
        retired: true
  - id: self-supervised-representations.transfer
    objective_ref: objective.self-supervised-representations
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Measure the representation’s usefulness: trace the inputs, operation, and result before choosing.'
    remediation_scene: self-supervised-representations.s4
    variants:
      - id: self-supervised-representations.transfer.1
        prompt: An image augmentation removes the object needed downstream. What assumption is threatened?
        options:
          - id: c
            text: That all neural layers are linear
          - id: a
            text: That the positive views preserve relevant content
          - id: b
            text: That arrays contain numbers
        answer: a
        feedback: The objective may train away information the downstream task needs.
        retired: true
      - id: self-supervised-representations.transfer.2
        prompt: A pretext-task loss improves. What should be checked next?
        options:
          - id: a
            text: Transfer performance under a stated evaluation setup
          - id: b
            text: A claim that every task must improve
          - id: c
            text: Only the model’s display name
        answer: a
        feedback: Pretext success and downstream usefulness are distinct evidence.
        retired: true
  - id: self-supervised-representations.base.v2
    objective_ref: objective.self-supervised-representations
    task: base
    response_type: single_choice
    points: 1
    hint: In contrastive learning, the positive is another view of the same example and the negatives are views of other examples. Ask what the loss rewards, and what lazy solution it would allow.
    remediation_scene: self-supervised-representations.s2
    variants:
      - id: self-supervised-representations.base.v2.1
        prompt: A model reads millions of unlabeled news articles. In each sentence it hides one word and tries to predict it. Where does the training target come from?
        options:
          - id: c
            text: From editors who tagged each sentence with a topic
          - id: a
            text: From the hidden word, which is part of the text itself
          - id: b
            text: Nowhere, since learning without labels has no targets
        answer: a
        feedback: The hidden word is the target, taken from the data itself; that's what makes it self-supervised. No one tagged topics, and the model still has a clear objective to minimize.
      - id: self-supervised-representations.base.v2.2
        prompt: In a SimCLR batch, which two images form a positive pair?
        options:
          - id: b
            text: Two differently cropped and colored views of the same photo
          - id: c
            text: Two different photos that share the same class label
          - id: a
            text: The two photos in the batch that look the most alike
        answer: b
        feedback: SimCLR makes two augmented views of each photo and treats that pair as positive. It uses no class labels, and two look-alike photos are still negatives, which is how false negatives arise.
      - id: self-supervised-representations.base.v2.3
        prompt: A model trained only to pull positive pairs together reaches near-zero loss within an hour. A probe on its features does no better than chance. What most likely happened?
        options:
          - id: a
            text: The learning rate was too low for the model to learn much
          - id: b
            text: The probe overfit, since it had too few labeled examples
          - id: c
            text: It collapsed, mapping every image to nearly the same vector
        answer: c
        feedback: With nothing pushing different images apart, the easiest way to make every pair match is one shared vector, which scores well and carries no information. A too-low learning rate wouldn't reach near-zero loss so fast.
      - id: self-supervised-representations.base.v2.4
        prompt: Why does a contrastive loss include negatives at all?
        options:
          - id: a
            text: They make "map everything to one vector" score badly
          - id: c
            text: They supply the class labels the model needs to learn
          - id: b
            text: They let the model skip making augmented views
        answer: a
        feedback: If all vectors collapse, the positive looks no better than the negatives and the loss stays high (ln 3 with two negatives). Negatives are just other images; they aren't labels, and augmented views are still needed for positives.
      - id: self-supervised-representations.base.v2.5
        prompt: You lower the temperature τ in a contrastive loss from 0.5 to 0.1. What changes?
        options:
          - id: c
            text: Every similarity is pulled toward the same value
          - id: b
            text: The softmax sharpens, so small similarity gaps matter more
          - id: a
            text: The batch gets more negatives for each view
        answer: b
        feedback: Dividing by a smaller τ stretches the similarity gaps before softmax, so the loss focuses on the closest competitors. Temperature doesn't change the number of negatives, which is set by the batch.
  - id: self-supervised-representations.transfer.v2
    objective_ref: objective.self-supervised-representations
    task: transfer
    response_type: single_choice
    points: 1
    hint: Features keep what the pretext task needed and drop what the augmentations said to ignore. Judge them with a probe or fine-tuning on the real task, using held-out examples.
    remediation_scene: self-supervised-representations.s4
    variants:
      - id: self-supervised-representations.transfer.v2.1
        prompt: A team pretrains on leaf photos with strong color-shift augmentation, then probes for a disease that shows up as yellowing. The probe does poorly. What is the most likely reason?
        options:
          - id: c
            text: The batches had too few negatives for each view
          - id: b
            text: The augmentation taught the model to ignore color
          - id: a
            text: A linear probe is too simple for any image task
        answer: b
        feedback: Color shifts made color irrelevant to the pretext task, so the features dropped the very signal the disease needs. Linear probes work well when the representation holds the information, as SimCLR's ImageNet result shows.
      - id: self-supervised-representations.transfer.v2.2
        prompt: A pretraining run's contrastive loss keeps falling steadily. What should the team check next?
        options:
          - id: a
            text: Train longer until the loss reaches zero
          - id: b
            text: Nothing more, since lower loss means better features
          - id: c
            text: A probe on a held-out downstream task
        answer: c
        feedback: The loss measures the pretext puzzle, not the job you care about, so a probe on held-out labeled data is the real test. Driving the pretext loss to zero can even overfit the puzzle.
      - id: self-supervised-representations.transfer.v2.3
        prompt: A hospital has 300 labeled lung scans and 200,000 unlabeled ones. Which plan makes the best use of both?
        options:
          - id: a
            text: Pretrain on the unlabeled scans, then probe or fine-tune on the 300
          - id: b
            text: Train only on the 300 labeled scans and set the rest aside
          - id: c
            text: Cluster the unlabeled scans and use the clusters as diagnoses
        answer: a
        feedback: Self-supervised pretraining learns from the 200,000 scans without labels, and the 300 labels then adapt and test it (on held-out scans). Ignoring the unlabeled data wastes it, and clusters aren't diagnoses.
      - id: self-supervised-representations.transfer.v2.4
        prompt: A shopping site has many near-identical photos of the same product from different sellers. Contrastive pretraining treats them as negatives. What effect should you expect?
        options:
          - id: a
            text: The features collapse, since the photos look alike
          - id: c
            text: No effect, since negatives are picked at random
          - id: b
            text: Training pushes apart photos of the very same item
        answer: b
        feedback: These are false negatives. The loss rewards separating them, so the model learns to split identical products, which hurts tasks like finding duplicates. Negatives keep the vectors from collapsing, and random picking doesn't prevent the clash.
  - id: self-supervised-representations.calc.v2
    objective_ref: objective.self-supervised-representations
    task: base
    response_type: numeric
    points: 1
    hint: Divide each similarity by τ, exponentiate, and take the positive's share of the total. The loss is minus the natural log of that share.
    remediation_scene: self-supervised-representations.s2
    variants:
      - id: self-supervised-representations.calc.v2.1
        prompt: A view's similarities are 0.8 with its positive and 0.1 and 0.3 with two negatives, and τ = 0.5. What probability does the softmax give the positive? Give two decimal places.
        answer: 0.62
        feedback: The scaled values are 1.6, 0.2, and 0.6. e^1.6 / (e^1.6 + e^0.2 + e^0.6) = 4.95 / 8.00 ≈ 0.62.
      - id: self-supervised-representations.calc.v2.2
        prompt: After dividing by τ, a view's scores are 2 for its positive and 0 for each of two negatives. What probability does the softmax give the positive? Give two decimal places.
        answer: 0.79
        feedback: e² / (e² + 1 + 1) = 7.39 / 9.39 ≈ 0.79.
      - id: self-supervised-representations.calc.v2.3
        prompt: A collapsed model gives every similarity the same value. With one positive and three negatives, what is the contrastive loss, −ln of the positive's probability? Give two decimal places.
        answer: 1.39
        feedback: Equal scores give each of the four candidates probability 1/4, so the loss is −ln(0.25) = ln 4 ≈ 1.39.
      - id: self-supervised-representations.calc.v2.4
        prompt: The positive's softmax probability is 0.5. What is the contrastive loss, −ln of that probability? Give two decimal places.
        answer: 0.69
        feedback: −ln(0.5) = ln 2 ≈ 0.69. A perfect score of probability 1 would give a loss of 0.
      - id: self-supervised-representations.calc.v2.5
        prompt: A SimCLR batch holds 8 photos, and each gets two augmented views. How many negatives does each view have?
        answer: 14
        feedback: 8 photos make 16 views. Leave out the view itself and its positive partner, and 16 − 2 = 14 remain, which is 2(N − 1) with N = 8.
    absolute_tolerance: 0.01
