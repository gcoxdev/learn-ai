schema_version: 0.2-draft
lesson:
  id: self-supervised-representations
  version: 0.3.0-draft
  title: Create a learning task from the data itself
  state: draft
  summary: Hide part of an example or compare two views to create a training puzzle, then check whether the
    learned features help elsewhere.
  slot: M08.6
  category: learning
  sources:
  - title: Dive into Deep Learning — authors’ open textbook
    url: https://d2l.ai/
  - title: A Simple Framework for Contrastive Learning of Visual Representations
    url: https://arxiv.org/abs/2002.05709
objectives:
- id: objective.self-supervised-representations
  version: 1-draft
  statement: Self-supervised objectives derive targets from observations; masking, prediction, and contrastive
    learning encourage representations whose usefulness must be tested on independent tasks.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - self-supervised-representations.base
  - self-supervised-representations.transfer
  prerequisites:
  - anyOf:
    - objective.ways-to-learn
  - anyOf:
    - objective.features-and-bias
scenes:
- id: self-supervised-representations.s1
  title: The data can supply a target
  type: explanation
  depth: intuition
  objective_refs:
  - objective.self-supervised-representations
  markdown: Hide part of an input and predict it, predict the next part, or compare two views of the same example.
    These tasks create supervision without manually labeling every desired downstream category. People still
    choose the data, transformations, objective, and model, so self-supervised does not mean design-free.
  text_mode: Hide part of an input and predict it, predict the next part, or compare two views of the same
    example. These tasks create supervision without manually labeling every desired downstream category. People
    still choose the data, transformations, objective, and model, so self-supervised does not mean design-free.
  bridges: []
- id: self-supervised-representations.s2
  title: Compare two views of one example
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.self-supervised-representations
  markdown: 'A **view** is a version of an example. **Augmentation** creates another view, such as a crop of
    a picture. Two crops containing the same bicycle can form a **positive pair**. Selected views of other
    images provide **negative** comparisons.


    A **contrastive objective** encourages the positive pair to have more similar representations than those
    alternatives. What it learns depends on what the crops preserve and which distinctions the comparison rewards.
    If one crop contains only empty sky, calling it a positive pair does not restore the missing bicycle.'
  text_mode: 'A **view** is a version of an example. **Augmentation** creates another view, such as a crop
    of a picture. Two crops containing the same bicycle can form a **positive pair**. Selected views of other
    images provide **negative** comparisons.


    A **contrastive objective** encourages the positive pair to have more similar representations than those
    alternatives. What it learns depends on what the crops preserve and which distinctions the comparison rewards.
    If one crop contains only empty sky, calling it a positive pair does not restore the missing bicycle.'
  bridges: []
- id: self-supervised-representations.s3
  title: Prevent a trivial solution
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.self-supervised-representations
  markdown: 'If an objective only asks all positive views to match, a constant representation may satisfy it
    while losing useful distinctions. Negative comparisons or suitable noncontrastive mechanisms can help avoid
    collapse. A negative pair can also be misleading when two different examples share the same relevant content.


    If every image is represented by [0, 0], all pairs match perfectly but bicycles and boats become indistinguishable.
    That is **collapse**. Requiring useful distinctions, or using appropriately designed alternative objectives,
    prevents the “make everything equal” shortcut. Merely seeing a low loss does not tell you whether this
    shortcut occurred.'
  text_mode: 'If an objective only asks all positive views to match, a constant representation may satisfy
    it while losing useful distinctions. Negative comparisons or suitable noncontrastive mechanisms can help
    avoid collapse. A negative pair can also be misleading when two different examples share the same relevant
    content.


    If every image is represented by [0, 0], all pairs match perfectly but bicycles and boats become indistinguishable.
    That is **collapse**. Requiring useful distinctions, or using appropriately designed alternative objectives,
    prevents the “make everything equal” shortcut. Merely seeing a low loss does not tell you whether this
    shortcut occurred.'
  bridges: []
- id: self-supervised-representations.s4
  title: Check what the learned features are good for
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.self-supervised-representations
  markdown: 'The training puzzle created from the data is the **pretext task**. Doing well on it does not establish
    that the representation helps with every later task.


    One check trains a small predictor, called a **probe**, on the saved representations. Another uses **fine-tuning**,
    adjusting some or all of the original model for a new task. State which approach you use: a fixed representation
    and a fully adapted model answer different questions.


    Evaluate on held-out tasks or examples, and inspect shortcuts, valid augmentations, and changes in the
    data. The useful result is a representation that supports its intended use.'
  text_mode: 'The training puzzle created from the data is the **pretext task**. Doing well on it does not
    establish that the representation helps with every later task.


    One check trains a small predictor, called a **probe**, on the saved representations. Another uses **fine-tuning**,
    adjusting some or all of the original model for a new task. State which approach you use: a fixed representation
    and a fully adapted model answer different questions.


    Evaluate on held-out tasks or examples, and inspect shortcuts, valid augmentations, and changes in the
    data. The useful result is a representation that supports its intended use.'
  bridges: []
- id: self-supervised-representations.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.self-supervised-representations
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Self-supervised learning creates training puzzles from the data itself. Check whether solving those
    puzzles produces useful features for new tasks, rather than a shortcut such as making every example look
    identical.
- id: self-supervised-representations.recap
  title: One idea to take with you
  type: recap
