assessment_families:
- id: self-supervised-representations.base
  objective_ref: objective.self-supervised-representations
  task: base
  response_type: single_choice
  points: 1
  hint: 'A contrastive comparison: trace the inputs, operation, and result before choosing.'
  remediation_scene: self-supervised-representations.s2
  variants:
  - id: self-supervised-representations.base.1
    prompt: Where do self-supervised targets come from?
    options:
    - id: b
      text: Necessarily a human label for every downstream class
    - id: c
      text: No target or objective at all
    - id: a
      text: A task constructed from the observed data
    answer: a
    feedback: The training signal is derived from the data under a designed task.
  - id: self-supervised-representations.base.2
    prompt: What is representation collapse?
    options:
    - id: c
      text: Only a storage failure
    - id: a
      text: Different inputs map to uninformative nearly identical representations
    - id: b
      text: A guaranteed increase in every downstream score
    answer: a
    feedback: A trivial constant-like solution can satisfy some poorly constrained objectives.
- id: self-supervised-representations.transfer
  objective_ref: objective.self-supervised-representations
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Measure the representation’s usefulness: trace the inputs, operation, and result before choosing.'
  remediation_scene: self-supervised-representations.s4
  variants:
  - id: self-supervised-representations.transfer.1
    prompt: An image augmentation removes the object needed downstream. What assumption is threatened?
    options:
    - id: c
      text: That all neural layers are linear
    - id: a
      text: That the positive views preserve relevant content
    - id: b
      text: That arrays contain numbers
    answer: a
    feedback: The objective may train away information the downstream task needs.
  - id: self-supervised-representations.transfer.2
    prompt: A pretext-task loss improves. What should be checked next?
    options:
    - id: a
      text: Transfer performance under a stated evaluation setup
    - id: b
      text: A claim that every task must improve
    - id: c
      text: Only the model’s display name
    answer: a
    feedback: Pretext success and downstream usefulness are distinct evidence.
