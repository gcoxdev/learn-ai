assessment_families:
  - id: long-context-capability.base
    objective_ref: objective.long-context-capability
    task: base
    response_type: single_choice
    points: 1
    hint: Move the evidence to different depths and watch how accuracy changes.
    remediation_scene: long-context-capability.s1
    variants:
      - id: long-context-capability.base.1
        prompt: Does an accepted 128k-token input prove useful reasoning over all 128k tokens?
        options:
          - id: c
            text: Only if the request succeeds without an error
          - id: a
            text: 'No'
          - id: b
            text: 'Yes'
        answer: a
        feedback: Accepted length and evaluated capability differ.
        retired: true
      - id: long-context-capability.base.2
        prompt: Why move a needed fact to different positions?
        options:
          - id: a
            text: To measure positional sensitivity
          - id: b
            text: To train a new tokenizer
          - id: c
            text: To remove every distractor
        answer: a
        feedback: Information use may vary by location.
        retired: true
  - id: long-context-capability.transfer
    objective_ref: objective.long-context-capability
    task: transfer
    response_type: single_choice
    points: 1
    hint: A single planted fact tests retrieval; combining several facts tests more.
    remediation_scene: long-context-capability.s3
    variants:
      - id: long-context-capability.transfer.1
        prompt: What is broader than single-string needle retrieval?
        options:
          - id: a
            text: Combining multiple separated facts under distractors
          - id: b
            text: Echoing one exact string only
          - id: c
            text: Counting input bytes alone
        answer: a
        feedback: Multi-evidence tasks test additional reasoning and access demands.
        retired: true
      - id: long-context-capability.transfer.2
        prompt: What unit should a reported token limit identify?
        options:
          - id: b
            text: An assumed universal word count
          - id: c
            text: Only file size
          - id: a
            text: The actual tokenizer’s tokens
        answer: a
        feedback: Tokenization changes the relation between text and sequence length.
        retired: true
  - id: long-context-capability.base.v2
    objective_ref: objective.long-context-capability
    task: base
    response_type: single_choice
    points: 1
    hint: "Separate three things: where in the prompt the evidence sits, how positions are mapped into RoPE's trained range, and what skill a test actually checks."
    remediation_scene: long-context-capability.s2
    variants:
      - id: long-context-capability.base.v2.1
        prompt: Liu et al. moved the document holding the answer through a list of 20 documents. What pattern did accuracy follow?
        options:
          - id: b
            text: Steadily falling from first position to last
          - id: a
            text: Highest at the start and end, lowest in the middle
          - id: c
            text: Roughly flat, since every document was in context
        answer: a
        feedback: The U-shape is the "lost in the middle" effect. A steady fall would mean only the start matters, but the end did well too; and being in context didn't mean being used equally.
      - id: long-context-capability.base.v2.2
        prompt: Why does position interpolation divide positions by s instead of letting the model run on positions it never trained on?
        options:
          - id: a
            text: Unseen positions give RoPE angles outside the trained range, which disrupts attention
          - id: c
            text: Dividing positions shortens the prompt, which cuts the attention cost by s²
          - id: b
            text: Dividing positions adds new learned embeddings for the positions beyond training
        answer: a
        feedback: Beyond the training length, the slow RoPE pairs reach angles the model never saw, and attention scores blow up. PI maps every position back into the seen range. The prompt keeps all its tokens, and no new embeddings are learned.
      - id: long-context-capability.base.v2.3
        prompt: How does NTK-aware scaling differ from plain position interpolation?
        options:
          - id: c
            text: It interpolates the fast rotation pairs and leaves the slow pairs alone
          - id: b
            text: It divides every rotation speed by s, the same as interpolation does
          - id: a
            text: It raises the RoPE base, slowing the slow pairs while keeping the fast ones
        answer: a
        feedback: "The new base b′ = b·s^(d/(d−2)) slows the slowest pair by s but leaves the fastest pair almost unchanged, so neighboring tokens stay distinct. Plain PI slows all pairs by s. The other option has the pairs backwards."
      - id: long-context-capability.base.v2.4
        prompt: A model scores nearly 100% on needle-in-a-haystack at 128K tokens. What has that shown?
        options:
          - id: b
            text: That it can combine facts spread across 128K tokens
          - id: a
            text: That it can find one distinctive planted fact at 128K
          - id: c
            text: That its effective context is 128K for most tasks
        answer: a
        feedback: NIAH checks retrieval of a single string that often stands out from the filler. RULER found that models with near-perfect NIAH scores still dropped sharply on multi-needle, tracing, and aggregation tasks.
  - id: long-context-capability.transfer.v2
    objective_ref: objective.long-context-capability
    task: transfer
    response_type: single_choice
    points: 1
    hint: Design the test to match the real task (similar distractors, several facts, real lengths), and weigh the cost of a long prompt against retrieving a short one.
    remediation_scene: long-context-capability.s4
    variants:
      - id: long-context-capability.transfer.v2.1
        prompt: You're evaluating a model for reviewing 300-page leases, where many clauses look alike. Which test design fits best?
        options:
          - id: a
            text: Plant the answer clause at many depths among look-alike clauses, and add questions that need two clauses
          - id: b
            text: Plant one unusual sentence at the end of a lease and check the model can repeat it word for word
          - id: c
            text: Check that a 300-page lease fits within the model's context limit without being cut off
        answer: a
        feedback: The real task means finding the right clause among similar ones, at any depth, sometimes combining two. A single standout sentence at the end is the easiest possible needle, and fitting the limit only shows acceptance.
      - id: long-context-capability.transfer.v2.2
        prompt: "A vendor's slide says \"100% needle-in-a-haystack accuracy at 128K\". You need the model to track which of 40 account balances changed across a long transaction log. What should you conclude?"
        options:
          - id: c
            text: The model is ready, since tracking balances is a form of retrieval
          - id: a
            text: Single-fact retrieval works; test tracking and aggregation separately
          - id: b
            text: The claim is misleading, since NIAH scores don't relate to real use
        answer: a
        feedback: NIAH is real evidence of retrieval, but tracking changes across a log is closer to RULER's variable-tracking and aggregation tasks, where scores often fall. So the slide is true but answers a different question.
      - id: long-context-capability.transfer.v2.3
        prompt: A chat service runs a 70B GQA model whose cache costs 40 GiB per 128K-token conversation. Users paste long manuals but ask about a few pages at a time. What should the team try first?
        options:
          - id: b
            text: Double the GPUs so that every conversation keeps its full 128K cache
          - id: c
            text: Switch to a model advertised with a longer context limit, such as 1M
          - id: a
            text: Retrieve the relevant pages and send a few thousand tokens, then compare
        answer: a
        feedback: If retrieval matches accuracy, a 5,000-token prompt needs about 1.5 GiB of cache and far less attention work. More GPUs pay the bill instead of reducing it, and a longer limit makes each conversation more expensive, not cheaper.
      - id: long-context-capability.transfer.v2.4
        prompt: A support prompt contains 30 help articles, then the customer's question. Answers often ignore the articles in the middle of the list. Which change targets that pattern?
        options:
          - id: a
            text: Put the question before and after the articles, and rank the likeliest articles first
          - id: b
            text: Add more articles so the relevant one is surrounded by extra helpful context
          - id: c
            text: Randomly shuffle the order of the articles each time the question is asked
        answer: a
        feedback: Models use the start and end of a long prompt best, so put the question and the best evidence there. More articles push relevant ones further into the middle, and shuffling only moves the problem around.
  - id: long-context-capability.scale
    objective_ref: objective.long-context-capability
    task: base
    response_type: numeric
    points: 1
    hint: "The scale factor is s = new length ÷ trained length. Position interpolation treats position m as m ÷ s."
    remediation_scene: long-context-capability.s2
    absolute_tolerance: 0.01
    variants:
      - id: long-context-capability.scale.1
        prompt: A RoPE model trained on 4,096 tokens is extended to 32,768 with position interpolation. What is the scale factor s?
        answer: 8
        feedback: "s = 32,768 ÷ 4,096 = 8."
      - id: long-context-capability.scale.2
        prompt: A model trained on 2,048 tokens is extended to 32,768 with position interpolation. What is the scale factor s?
        answer: 16
        feedback: "s = 32,768 ÷ 2,048 = 16."
      - id: long-context-capability.scale.3
        prompt: With position interpolation at s = 8, which position does the model treat token 20,000 as?
        answer: 2500
        feedback: "20,000 ÷ 8 = 2,500, which lies inside the trained range of 0 to 4,095."
      - id: long-context-capability.scale.4
        prompt: A model trained on 8,192 tokens is extended to 131,072 with position interpolation. Which position does it treat token 100,000 as?
        answer: 6250
        feedback: "s = 131,072 ÷ 8,192 = 16, so 100,000 ÷ 16 = 6,250."
      - id: long-context-capability.scale.5
        prompt: A model trained on 4,096 tokens is extended to 131,072 with position interpolation. What is the scale factor s?
        answer: 32
        feedback: "s = 131,072 ÷ 4,096 = 32. The YaRN paper reached 128K from Llama 2's 4,096 with s = 32."
