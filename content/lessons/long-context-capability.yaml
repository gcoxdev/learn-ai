assessment_families:
- id: long-context-capability.base
  objective_ref: objective.long-context-capability
  task: base
  response_type: single_choice
  points: 1
  hint: 'Vary where evidence appears: trace the inputs, operation, and result before choosing.'
  remediation_scene: long-context-capability.s2
  variants:
  - id: long-context-capability.base.1
    prompt: Does an accepted 128k-token input prove useful reasoning over all 128k tokens?
    options:
    - id: c
      text: Only if the request succeeds without an error
    - id: a
      text: 'No'
    - id: b
      text: 'Yes'
    answer: a
    feedback: Accepted length and evaluated capability differ.
  - id: long-context-capability.base.2
    prompt: Why move a needed fact to different positions?
    options:
    - id: a
      text: To measure positional sensitivity
    - id: b
      text: To train a new tokenizer
    - id: c
      text: To remove every distractor
    answer: a
    feedback: Information use may vary by location.
- id: long-context-capability.transfer
  objective_ref: objective.long-context-capability
  task: transfer
  response_type: single_choice
  points: 1
  hint: 'Design a useful report: trace the inputs, operation, and result before choosing.'
  remediation_scene: long-context-capability.s4
  variants:
  - id: long-context-capability.transfer.1
    prompt: What is broader than single-string needle retrieval?
    options:
    - id: a
      text: Combining multiple separated facts under distractors
    - id: b
      text: Echoing one exact string only
    - id: c
      text: Counting input bytes alone
    answer: a
    feedback: Multi-evidence tasks test additional reasoning and access demands.
  - id: long-context-capability.transfer.2
    prompt: What unit should a reported token limit identify?
    options:
    - id: b
      text: An assumed universal word count
    - id: c
      text: Only file size
    - id: a
      text: The actual tokenizer’s tokens
    answer: a
    feedback: Tokenization changes the relation between text and sequence length.
