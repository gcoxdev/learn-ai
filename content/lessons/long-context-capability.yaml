schema_version: 0.2-draft
lesson:
  id: long-context-capability
  version: 0.3.0-draft
  title: Can the model use a long prompt?
  state: draft
  summary: Test whether a model can use a long prompt, rather than only whether it accepts one.
  slot: M19.7
  category: learning
  sources:
  - title: Lost in the Middle
    url: https://arxiv.org/abs/2307.03172
  - title: RULER
    url: https://arxiv.org/abs/2404.06654
objectives:
- id: objective.long-context-capability
  version: 1-draft
  statement: Long-context capability combines positional behavior, training exposure, information access, and
    serving resources; evaluation must test retrieval, distraction, and reasoning across positions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - long-context-capability.base
  - long-context-capability.transfer
  prerequisites:
  - anyOf:
    - objective.continued-pretraining
  - anyOf:
    - objective.hybrid-sequence-architectures
scenes:
- id: long-context-capability.s1
  title: Accepting a prompt is only the first test
  type: explanation
  depth: intuition
  objective_refs:
  - objective.long-context-capability
  markdown: 'A model may accept 20,000 tokens yet fail to use a fact in the middle. The configured context
    limit tells us what the implementation accepts. The training context describes the lengths used while fitting
    the model.


    **Effective context** asks how much supplied information the model can use for a particular task. It is
    measured through behavior, not set by one configuration value. A length that works for retrieving a code
    may not work equally well for combining evidence across documents.'
  text_mode: 'A model may accept 20,000 tokens yet fail to use a fact in the middle. The configured context
    limit tells us what the implementation accepts. The training context describes the lengths used while fitting
    the model.


    **Effective context** asks how much supplied information the model can use for a particular task. It is
    measured through behavior, not set by one configuration value. A length that works for retrieving a code
    may not work equally well for combining evidence across documents.'
  bridges: []
- id: long-context-capability.s2
  title: Vary where evidence appears
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.long-context-capability
  markdown: 'Place a needed fact near the beginning, middle, or end among controlled distractors. Then vary
    the number of required facts and whether they conflict. Exact retrieval of one inserted string tests a
    narrower skill than combining several documents to support a justified answer.


    Put “locker code: 482” at 10%, 50% and 90% of otherwise comparable prompts, then ask for the code. The
    unrelated surrounding text consists of **distractors**. Next require combining two separately placed clues.
    Success on the first experiment tests retrieval; the second asks for an additional relationship. Use invented
    codes so outside knowledge cannot supply the answer.'
  text_mode: 'Place a needed fact near the beginning, middle, or end among controlled distractors. Then vary
    the number of required facts and whether they conflict. Exact retrieval of one inserted string tests a
    narrower skill than combining several documents to support a justified answer.


    Put “locker code: 482” at 10%, 50% and 90% of otherwise comparable prompts, then ask for the code. The
    unrelated surrounding text consists of **distractors**. Next require combining two separately placed clues.
    Success on the first experiment tests retrieval; the second asks for an additional relationship. Use invented
    codes so outside knowledge cannot supply the answer.'
  bridges: []
- id: long-context-capability.s3
  title: Separate position and workload effects
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.long-context-capability
  markdown: Positional scaling, sliding windows, context training, and memory compression can each affect long
    inputs. Longer prompts also increase processing time and may consume larger caches. A model can succeed
    in an offline benchmark but exceed a product’s latency or capacity budget.
  text_mode: Positional scaling, sliding windows, context training, and memory compression can each affect
    long inputs. Longer prompts also increase processing time and may consume larger caches. A model can succeed
    in an offline benchmark but exceed a product’s latency or capacity budget.
  bridges: []
- id: long-context-capability.s4
  title: Design a useful report
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.long-context-capability
  markdown: Record prompt length in the actual tokenizer’s tokens, output budget, evidence positions, distractor
    construction, scoring, and hardware. Include failure examples and confidence intervals where appropriate.
    Compare to retrieval or task decomposition when the full context does not need to be processed at once.
  text_mode: Record prompt length in the actual tokenizer’s tokens, output budget, evidence positions, distractor
    construction, scoring, and hardware. Include failure examples and confidence intervals where appropriate.
    Compare to retrieval or task decomposition when the full context does not need to be processed at once.
  bridges: []
- id: long-context-capability.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.long-context-capability
  markdown: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  text_mode: Try the questions below with a new example. You can revisit the lesson or use a hint for practice.
  takeaway: Test where evidence appears and what the model must do with it. Accepting a long prompt, retrieving
    one fact, and reasoning across several facts are different capabilities.
- id: long-context-capability.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.long-context-capability
  markdown: Test where evidence appears and what the model must do with it. Accepting a long prompt, retrieving
    one fact, and reasoning across several facts are different capabilities.
  text_mode: Test where evidence appears and what the model must do with it. Accepting a long prompt, retrieving
    one fact, and reasoning across several facts are different capabilities.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - long-context-capability.s1
    - long-context-capability.s2
    - long-context-capability.s3
    - long-context-capability.s4
