schema_version: 0.2-draft
lesson:
  id: long-context-capability
  version: 0.4.0-draft
  title: Can the model use a long prompt?
  state: draft
  summary: A model that accepts 128K tokens can still miss a fact on page 150. See how RoPE gets stretched to reach long contexts, why the middle gets lost, and how to test honestly.
  slot: M19.7
  category: learning
  sources:
    - title: "Lost in the Middle: How Language Models Use Long Contexts (Liu et al., 2023)"
      url: https://arxiv.org/abs/2307.03172
    - title: "Extending Context Window of Large Language Models via Positional Interpolation (Chen et al., 2023)"
      url: https://arxiv.org/abs/2306.15595
    - title: "NTK-Aware Scaled RoPE (bloc97, 2023, r/LocalLLaMA post)"
      url: https://www.reddit.com/r/LocalLLaMA/comments/14lz7j5/ntkaware_scaled_rope_allows_llama_models_to_have/
    - title: "YaRN: Efficient Context Window Extension of Large Language Models (Peng et al., 2023)"
      url: https://arxiv.org/abs/2309.00071
    - title: "RULER: What's the Real Context Size of Your Long-Context Language Models? (Hsieh et al., 2024)"
      url: https://arxiv.org/abs/2404.06654
objectives:
  - id: objective.long-context-capability
    version: 2-draft
    statement: Long-context capability combines positional behavior, training exposure, information access, and serving resources; evaluation must test retrieval, distraction, and reasoning across positions.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - long-context-capability.base.v2
      - long-context-capability.transfer.v2
      - long-context-capability.scale
    prerequisites:
      - anyOf:
          - objective.continued-pretraining
      - anyOf:
          - objective.hybrid-sequence-architectures
scenes:
  - id: long-context-capability.s1
    title: Accepted is not the same as used
    type: explanation
    depth: intuition
    objective_refs:
      - objective.long-context-capability
    markdown: |-
      A model card promises a 128K-token context. You paste in a 300-page lease and ask, "What is the notice period for ending early?" The clause is on page 150. The model answers confidently, using a clause from page 3 about something else.

      Nothing crashed; the model *accepted* the prompt. Three different numbers hide behind "context length":

      | Term | What it means | How you learn it |
      | --- | --- | --- |
      | Context limit | The longest input the software will run | Read the configuration |
      | Training context | The lengths the model actually practiced on | Read the training report |
      | **Effective context** | The length at which the model still uses the information for *your* task | Measure it |

      Liu et al. (2023) measured one version. They gave models 20 documents, only one of which held the answer to a question, and moved that document from first to last. Accuracy traced a U-shape: best when the answer sat at the start or end, worst in the middle. For GPT-3.5-Turbo, with the answer in the middle, accuracy fell *below* its score with no documents at all (56.1%). They called the effect **lost in the middle**.

      :::predict If a model is lost in the middle, where should you put the question and the most important instructions in a long prompt?
      At the start or the end, where use is strongest, and often both. Liu et al. found that placing the question both before and after the documents helped on their key-value lookup task. Better still, shorten the prompt so less sits in the middle.
      :::
    bridges: []
  - id: long-context-capability.s2
    title: Stretch the rotations, not the model
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.long-context-capability
    markdown: |-
      Why can't a model trained on 4,096 tokens simply read 32,768? Recall RoPE from module 15's lesson on positions: each pair of query and key coordinates is rotated by an angle $m\,\theta_i$, where $m$ is the position and $\theta_i = b^{-2i/d}$ is that pair's speed ($b = 10{,}000$, head width $d$). The fast pairs spin by a whole radian per token; the slowest barely turn. Beyond position 4,095, the slow pairs reach angles the model never saw, and attention scores go haywire.

      **Position interpolation (PI)** (Chen et al., 2023) squeezes positions back into the trained range. With scale factor $s = L_{\text{new}} / L_{\text{train}} = 32{,}768 / 4{,}096 = 8$, position $m$ is treated as $m / s$: position 20,000 becomes 2,500. After at most 1,000 fine-tuning steps, LLaMA models worked at 32,768 tokens.

      PI has a cost: neighboring tokens now differ by 1/8 radian in the fast pairs instead of 1, so fine local detail gets crowded. The **NTK-aware** fix (posted by "bloc97" on Reddit, 2023) raises the base instead: $b' = b \cdot s^{d/(d-2)}$. The slowest pair is slowed by exactly $s$, like PI, while the fastest pair is left alone. **YaRN** (Peng et al., 2023) refines this "by parts": interpolate the slow pairs, leave the fast pairs untouched, blend in between, and slightly sharpen attention as $s$ grows. YaRN extended Llama 2 to 128K tokens with about 10× fewer training tokens than earlier methods, and DeepSeek-V2 used it to go from 4K to 128K.

      ```python run
      import numpy as np

      d, base = 128, 10000.0                      # head width and RoPE base
      L_train, L_new = 4096, 32768
      s = L_new / L_train                         # scale factor s = 8
      speeds = base ** (-np.arange(0, d, 2) / d)  # 64 rotation speeds (radians per token), fastest first
      ntk_base = base * s ** (d / (d - 2))
      speeds_ntk = ntk_base ** (-np.arange(0, d, 2) / d)

      m = 20000                                   # a position far beyond training
      slow, slow_ntk = speeds[-1], speeds_ntk[-1]
      print(f"slowest pair: angles seen in training run from 0 to {L_train * slow:.3f} rad")
      print(f"  at position {m}: raw {m * slow:.3f}   PI {m / s * slow:.3f}   NTK {m * slow_ntk:.3f}")
      print(f"fastest pair: neighboring tokens differ by {speeds[0]:.3f} rad in training")
      print(f"  after scaling:        PI {speeds[0] / s:.3f}   NTK {speeds_ntk[0]:.3f}")
      print(f"NTK-aware base: {ntk_base:,.0f}")
      ```

      At position 20,000 the slowest pair's raw angle is 2.310 radians, far outside the 0 to 0.473 seen in training. Both fixes bring it to 0.289. Only NTK keeps the fast pair's 1-radian step between neighbors. Change `L_new` to 131072 and compare.
    bridges: []
  - id: long-context-capability.s3
    title: A needle is not a haystack test
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.long-context-capability
    markdown: |-
      The most popular long-context check is the **needle in a haystack (NIAH)**: hide one sentence, such as "The locker code is 4812," at a chosen depth in a long filler text and ask for it. Many models score nearly perfectly across every depth and length.

      That grid tests one skill, *finding a single distinctive string*. It has three blind spots:

      1. The needle usually stands out. A sentence about locker codes inside essays about start-ups is easy to spot, even by word overlap with the question.
      2. Nothing competes with it. There are no near-copies, such as an old locker code and a new one.
      3. Nothing has to be combined. Copying one string back is retrieval, not reasoning.

      **RULER** (Hsieh et al., 2024) keeps the needle idea but adds harder versions: several needles and look-alike distractors, *variable tracking* (follow `X = 12`, `Y = X`, `Z = Y` across the text), *aggregation* (count the most frequent words), and question answering over long documents. Across 17 models and 13 tasks, almost all models dropped sharply as length grew, despite near-perfect NIAH scores. All the models claimed at least 32K tokens, but only about half kept satisfactory performance at 32K.

      :::mixup "It passed needle-in-a-haystack at 128K, so it can reason over 128K."
      NIAH shows the model can *find* one planted fact. Your lease question needs finding the right clause among similar clauses, and perhaps combining it with a definition 80 pages earlier. Test with look-alike distractors and multi-step questions at the lengths you'll really use.
      :::
    bridges: []
  - id: long-context-capability.s4
    title: What 128K tokens cost
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.long-context-capability
    markdown: |-
      Even when a model uses 128K tokens well, each request is expensive. Take the Llama-2-70B-like model from the lesson on sharing keys and values: 80 layers, 8 KV heads of width 128, and a model width of 8,192.

      ```python run
      layers, kv_heads, head_dim, d_model, params = 80, 8, 128, 8192, 70e9   # Llama-2-70B-like
      for n in [4096, 131072]:
          kv_gib = 2 * layers * kv_heads * head_dim * n * 2 / 2**30          # 16-bit cache
          weight_flops = 2 * params * n                                     # every weight, every token
          attn_flops = 2 * n * n * d_model * layers                         # QK^T and AV over n^2/2 pairs
          print(f"n = {n:7,d}: KV cache {kv_gib:5.2f} GiB | weight FLOPs {weight_flops:.2e}"
                f" | attention FLOPs {attn_flops:.2e} | attention/weights {attn_flops / weight_flops:.2f}")
      ```

      | | 4,096 tokens | 131,072 tokens |
      | --- | ---: | ---: |
      | KV cache (16-bit, GQA-8) | 1.25 GiB | 40 GiB |
      | Attention arithmetic ÷ weight arithmetic (prefill) | 0.04 | 1.23 |

      At 4K tokens, the attention scores are a rounding error next to the weight multiplications. At 128K they are *more* than all the weight work combined, because the attention term grows with $n^2$ and the weight term with $n$. Then, during generation, every new token must read the whole 40 GiB cache. On a GPU that reads memory at 3 TB/s, that alone takes about 14 milliseconds per token.

      So for the lease, compare two plans on the same questions: paste all 300 pages, or retrieve the 10 most relevant pages (the retrieval lessons show how) and send about 5,000 tokens. If retrieval matches the long prompt's accuracy, it wins on cost and speed. When you do use long contexts, report the effective length you measured, with the task and distractors you used, not the length on the model card.
    bridges: []
  - id: long-context-capability.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.long-context-capability
    markdown: Work out interpolation scales and stretched positions, then design a fair long-context test for a lease reviewer, a vendor's needle claim, and a busy chat service.
    takeaway: |-
      Accepting a long prompt is not using it: models lose facts in the middle, and needle tests check only single-fact retrieval. RoPE scaling (PI, NTK-aware, YaRN) stretches position angles into the trained range, and at 128K the cache and the n² attention cost become the bill.
  - id: long-context-capability.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.long-context-capability
    markdown: |-
      Test where evidence appears and what the model must do with it. Accepting a long prompt, retrieving one fact, and reasoning across several facts are different capabilities.
