schema_version: 0.2-draft
lesson:
  id: long-context-capability
  version: 0.1.0-draft
  title: Distinguish accepting a long prompt from using it well
  state: draft
  summary: Long-context capability combines positional behavior, training exposure, information access, and serving
    resources; evaluation must test retrieval, distraction, and reasoning across positions.
  slot: M19.7
  category: learning
  minutes: 12
  sources:
  - title: Lost in the Middle
    url: https://arxiv.org/abs/2307.03172
  - title: RULER
    url: https://arxiv.org/abs/2404.06654
objectives:
- id: objective.long-context-capability
  version: 1-draft
  statement: Long-context capability combines positional behavior, training exposure, information access, and serving
    resources; evaluation must test retrieval, distraction, and reasoning across positions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - long-context-capability.base
  - long-context-capability.transfer
  prerequisites:
  - anyOf:
    - objective.continued-pretraining
  - anyOf:
    - objective.hybrid-sequence-architectures
scenes:
- id: long-context-capability.s1
  title: Length has several meanings
  type: explanation
  depth: intuition
  objective_refs:
  - objective.long-context-capability
  markdown: A configured context limit says what the implementation accepts. Training context describes exposures
    used to fit the model. Effective context is task-dependent evidence of useful information use. These quantities
    can differ substantially, so one maximum-length number cannot summarize capability.
  text_mode: A configured context limit says what the implementation accepts. Training context describes exposures
    used to fit the model. Effective context is task-dependent evidence of useful information use. These quantities
    can differ substantially, so one maximum-length number cannot summarize capability.
  bridges: []
- id: long-context-capability.s2
  title: Vary where evidence appears
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.long-context-capability
  markdown: Place a needed fact near the beginning, middle, or end among controlled distractors. Then vary the number
    of required facts and whether they conflict. Exact retrieval of one inserted string tests a narrower skill than
    combining several documents to support a justified answer.
  text_mode: Place a needed fact near the beginning, middle, or end among controlled distractors. Then vary the
    number of required facts and whether they conflict. Exact retrieval of one inserted string tests a narrower
    skill than combining several documents to support a justified answer.
  bridges: []
- id: long-context-capability.s3
  title: Separate position and workload effects
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.long-context-capability
  markdown: Positional scaling, sliding windows, context training, and memory compression can each affect long inputs.
    Longer prompts also increase processing time and may consume larger caches. A model can succeed in an offline
    benchmark but exceed a product’s latency or capacity budget.
  text_mode: Positional scaling, sliding windows, context training, and memory compression can each affect long
    inputs. Longer prompts also increase processing time and may consume larger caches. A model can succeed in an
    offline benchmark but exceed a product’s latency or capacity budget.
  bridges: []
- id: long-context-capability.s4
  title: Design a useful report
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.long-context-capability
  markdown: Record prompt length in the actual tokenizer’s tokens, output budget, evidence positions, distractor
    construction, scoring, and hardware. Include failure examples and confidence intervals where appropriate. Compare
    to retrieval or task decomposition when the full context does not need to be processed at once.
  text_mode: Record prompt length in the actual tokenizer’s tokens, output budget, evidence positions, distractor
    construction, scoring, and hardware. Include failure examples and confidence intervals where appropriate. Compare
    to retrieval or task decomposition when the full context does not need to be processed at once.
  bridges: []
- id: long-context-capability.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.long-context-capability
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
  takeaway: Long-context capability combines positional behavior, training exposure, information access, and serving
    resources; evaluation must test retrieval, distraction, and reasoning across positions.
- id: long-context-capability.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.long-context-capability
  markdown: Long-context capability combines positional behavior, training exposure, information access, and serving
    resources; evaluation must test retrieval, distraction, and reasoning across positions.
  text_mode: Long-context capability combines positional behavior, training exposure, information access, and serving
    resources; evaluation must test retrieval, distraction, and reasoning across positions.
navigation:
  routes:
  - id: route.core
    scene_sequence:
    - long-context-capability.s1
