lesson:
  id: nearest-neighbors
  version: 0.4.0-draft
  title: Predict from similar stored examples
  state: draft
  summary: Estate agents price an apartment from similar ones nearby. Machines can too, but change the units, and the "similar" apartments change with them.
  slot: M07.3
  category: learning
  sources:
    - title: An Introduction to Statistical Learning — authors’ materials
      url: https://www.statlearning.com/
    - title: Cover & Hart (1967), Nearest neighbor pattern classification
      url: https://doi.org/10.1109/TIT.1967.1053964
objectives:
  - id: objective.nearest-neighbors
    version: 2-draft
    statement: Nearest-neighbor methods use a distance and neighborhood rule; feature scaling, dimensionality, ties, and reference-data quality shape their predictions.
    depths:
      - intuition
      - mechanics
    critical: true
    evidence_families:
      - nearest-neighbors.base.v2
      - nearest-neighbors.transfer.v2
    prerequisites:
      - anyOf:
          - objective.features-and-bias
      - anyOf:
          - objective.geometry-and-symmetry
scenes:
  - id: nearest-neighbors.s1
    title: Price an apartment the way an agent does
    type: explanation
    depth: intuition
    objective_refs:
      - objective.nearest-neighbors
    markdown: |-
      Ask an estate agent what an apartment should rent for, and they'll pull up "comps": similar places nearby that rented recently. That's the whole idea of **k-nearest neighbors** (kNN). To predict for a new case, find the k stored examples most similar to it and combine their answers.

      Priya wants to price a 60 m² apartment 0.5 km from a subway station. Here are six recent listings:

      | Listing | Size (m²) | To subway (km) | Rent |
      | --- | ---: | ---: | ---: |
      | A | 62 | 3.0 | \$1,300 |
      | B | 58 | 2.8 | \$1,250 |
      | C | 70 | 0.6 | \$1,900 |
      | D | 55 | 0.4 | \$1,700 |
      | E | 80 | 2.0 | \$1,600 |
      | F | 48 | 1.5 | \$1,350 |

      With k = 2, find the two most similar listings and average their rents. Averaging numbers this way makes kNN a **regressor**; letting the neighbors vote on a label makes it a **classifier**.

      Notice what's missing: there are no weights to fit. kNN stores the examples and does all its work when a question arrives. The model is the data plus three choices: which features to compare, what "similar" means, and how many neighbors to ask.

      :::story An idea from 1951
      Evelyn Fix and Joseph Hodges described the nearest-neighbor rule in a 1951 report for the US Air Force School of Aviation Medicine. In 1967, Thomas Cover and Peter Hart proved a striking fact about it: with enough data, the error rate of the one-nearest-neighbor classifier is at most twice that of the best possible classifier.
      :::
    bridges: []
  - id: nearest-neighbors.s2
    title: How many neighbors should vote?
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.nearest-neighbors
    markdown: |-
      Suppose each listing is also labelled by whether it rented within a week. A new apartment's three nearest neighbors are *fast, fast, slow*, so a majority vote predicts *fast*. The number k controls how much of the data speaks:

      - **k = 1** trusts a single neighbor. If that listing was mislabelled, or rented fast by luck, the prediction copies the fluke.
      - **Large k** averages over more listings. Predictions get steadier but blur local detail: a small studio far out and a big flat downtown start to look alike.

      :::predict With k = 6, what rent does kNN predict for Priya's apartment, or for any apartment at all?
      All six listings are always the neighbors, so every prediction is their average: 9,100 ÷ 6 ≈ \$1,517. When k equals the size of the dataset, kNN ignores the query entirely.
      :::

      Small k gives a jumpy model and large k a flat one, so try several values on examples held out from the stored set and keep the best (the tuning lesson later in this module shows how). Don't score k on the stored examples themselves: each one is its own nearest neighbor at distance 0, so k = 1 always looks perfect there. Decide how to break ties, too. With two classes, an odd k avoids a 2–2 vote; with three or more classes, ties can still happen, and a common rule lets the closest neighbor decide.
    bridges:
      - geometry-and-symmetry
  - id: nearest-neighbors.s3
    title: Units decide who counts as near
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.nearest-neighbors
    markdown: |-
      Similarity is usually measured by **Euclidean distance**, the straight-line distance between two lists of features:

      $$d(\mathbf{x}, \mathbf{q}) = \sqrt{\sum_{j=1}^{m} (x_j - q_j)^2}$$

      Here $\mathbf{q}$ is the query, $\mathbf{x}$ a stored listing, and $j$ runs through the $m$ features. For listing A: $\sqrt{(62-60)^2 + (3.0-0.5)^2} = \sqrt{4 + 6.25} \approx 3.20$.

      | Listing | Raw distance | Scaled distance |
      | --- | ---: | ---: |
      | A | 3.20 | 2.51 |
      | B | 3.05 | 2.31 |
      | C | 10.00 | 1.00 |
      | D | 5.00 | 0.51 |
      | E | 20.06 | 2.50 |
      | F | 12.04 | 1.56 |

      In raw units, the nearest two are B and A, predicting \$1,275. But both are nearly 3 km from a station! A difference of 1 m² counts as much as a difference of 1 km, so size swamps the distance.

      Now **scale** the features: divide each by its typical spread, here about 10 m² for size and 1 km for distance (their standard deviations). Listing A's differences become 0.2 and 2.5, a distance of 2.51. The nearest two are now D and C, both close to a station, and the prediction jumps to \$1,800. Same data, same k: only the units changed.

      ```python run
      import numpy as np

      # Listings: [size in m², km to the nearest subway station], monthly rent
      homes = np.array([[62, 3.0], [58, 2.8], [70, 0.6], [55, 0.4], [80, 2.0], [48, 1.5]])
      rent  = np.array([1300, 1250, 1900, 1700, 1600, 1350])
      query = np.array([60, 0.5])            # the apartment we want to price

      def knn(X, q, k):
          dist = np.sqrt(((X - q) ** 2).sum(axis=1))    # Euclidean distance
          nearest = np.argsort(dist)[:k]
          return nearest, rent[nearest].mean()

      idx, guess = knn(homes, query, k=2)
      print("raw units:    neighbors", idx, "-> predicted rent", guess)

      spread = homes.std(axis=0)                        # typical spread of each feature
      print("spreads:", spread.round(2))
      idx, guess = knn(homes / spread, query / spread, k=2)
      print("scaled units: neighbors", idx, "-> predicted rent", guess)
      ```

      Listings are numbered from 0, so `[3 2]` means D and C. Try k=3, then measure distance in meters (multiply the second column and the query's 0.5 by 1,000) and watch which feature takes over.

      :::mixup "Scaling is cosmetic. The model sees the same information either way."
      For kNN, the units *are* the model: they decide who counts as a neighbor. Compute each feature's spread from the stored training examples only, then divide every new query by those same numbers.
      :::
    bridges: []
  - id: nearest-neighbors.s4
    title: When every neighbor is far away
    type: explanation
    depth: mechanics
    objective_refs:
      - objective.nearest-neighbors
    markdown: |-
      kNN rests on a hope: the nearest examples are genuinely close. With many features that hope fades, a problem called the **curse of dimensionality**. Scatter 1,000 random points in a cube and compare the nearest and farthest distances from a random query:

      ```python run
      import numpy as np

      rng = np.random.default_rng(0)
      for d in (2, 10, 100, 1000):
          points = rng.random((1000, d))        # 1,000 random points in a d-dimensional cube
          q = rng.random(d)                     # one random query
          dist = np.sqrt(((points - q) ** 2).sum(axis=1))
          print(f"d = {d:4d}: nearest / farthest distance = {dist.min() / dist.max():.2f}")
      ```

      With 2 features, the nearest point is over 100 times closer than the farthest (ratio 0.01). With 1,000 features, the ratio is 0.90: the "nearest" neighbor is almost as far away as the farthest one. Here's another view. To enclose 10% of evenly spread data, a cube-shaped neighborhood needs sides 0.1 long in one dimension, 0.79 in 10 dimensions, and 0.98 in 100, since $0.1^{1/d}$ climbs toward 1. A "local" neighborhood ends up spanning nearly the whole range of every feature.

      So kNN works best with a few well-chosen, well-scaled features, or with **embeddings**: short lists of numbers produced by a trained neural network, arranged so that similar items land close together. Photo search and document retrieval work this way. They store millions of embeddings and use approximate nearest-neighbor indexes, which find almost-the-nearest items far faster than comparing the query with every stored one. Before you trust such an index, check a sample of its answers against an exact search.
    bridges: []
  - id: nearest-neighbors.check
    title: Review and check your understanding
    type: assessment
    depth: mechanics
    objective_refs:
      - objective.nearest-neighbors
    markdown: Compute distances and neighbor averages by hand, then fix medical, text, and photo-search systems whose idea of "near" has gone wrong.
    takeaway: |-
      kNN predicts from the most similar stored examples. The features, their units, the distance, and the number of neighbors together decide what "similar" means, so scale features and choose k on held-out data.
  - id: nearest-neighbors.recap
    title: One idea to take with you
    type: recap
    depth: intuition
    objective_refs:
      - objective.nearest-neighbors
    markdown: |-
      Nearest neighbors predicts from similar stored examples. The choice of features, units, distance rule, and neighbor count determines what “similar” means.
