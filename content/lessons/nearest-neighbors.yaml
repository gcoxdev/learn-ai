schema_version: 0.2-draft
lesson:
  id: nearest-neighbors
  version: 0.1.0-draft
  title: Predict from similar stored examples
  state: draft
  summary: Nearest-neighbor methods use a distance and neighborhood rule; feature scaling, dimensionality, ties,
    and reference-data quality shape their predictions.
  slot: M07.3
  category: learning
  minutes: 12
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.nearest-neighbors
  version: 1-draft
  statement: Nearest-neighbor methods use a distance and neighborhood rule; feature scaling, dimensionality, ties,
    and reference-data quality shape their predictions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - nearest-neighbors.base
  - nearest-neighbors.transfer
  prerequisites:
  - anyOf:
    - objective.features-and-bias
  - anyOf:
    - objective.geometry-and-symmetry
scenes:
- id: nearest-neighbors.s1
  title: Let examples supply the local rule
  type: explanation
  depth: intuition
  objective_refs:
  - objective.nearest-neighbors
  markdown: A k-nearest-neighbor classifier stores reference examples, finds the k closest to a query, and combines
    their labels. A regressor can average nearby target values. There may be little explicit parameter fitting,
    but feature selection, scaling, distance choice, and k are still modeling decisions.
  text_mode: A k-nearest-neighbor classifier stores reference examples, finds the k closest to a query, and combines
    their labels. A regressor can average nearby target values. There may be little explicit parameter fitting,
    but feature selection, scaling, distance choice, and k are still modeling decisions.
  bridges: []
- id: nearest-neighbors.s2
  title: Work through a vote
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.nearest-neighbors
  markdown: A query’s three nearest labeled neighbors are red, red, and blue. Majority voting predicts red. With
    one neighbor, a mislabeled closest example can dominate. With a very large neighborhood, local structure can
    be washed out. Distance-weighted voting changes the combination rule and needs an explicit convention.
  text_mode: A query’s three nearest labeled neighbors are red, red, and blue. Majority voting predicts red. With
    one neighbor, a mislabeled closest example can dominate. With a very large neighborhood, local structure can
    be washed out. Distance-weighted voting changes the combination rule and needs an explicit convention.
  bridges:
  - geometry-and-symmetry
- id: nearest-neighbors.s3
  title: Distance depends on units
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.nearest-neighbors
  markdown: If income is measured in thousands and age in years, raw coordinate magnitudes affect Euclidean distance.
    Changing income to dollars without rescaling can make it dominate. Fit suitable scaling on training data and
    assess whether geometric closeness reflects the task. Categorical and missing features require deliberate handling.
  text_mode: If income is measured in thousands and age in years, raw coordinate magnitudes affect Euclidean distance.
    Changing income to dollars without rescaling can make it dominate. Fit suitable scaling on training data and
    assess whether geometric closeness reflects the task. Categorical and missing features require deliberate handling.
  bridges: []
- id: nearest-neighbors.s4
  title: Know the cost and limits
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.nearest-neighbors
  markdown: Exact lookup can be expensive in large reference sets. Approximate indexes trade speed for retrieval
    accuracy. In high-dimensional spaces, distance can become less informative and data coverage sparse. Test unseen
    queries, inspect neighbor explanations, and avoid treating similarity as proof of a causal relationship.
  text_mode: Exact lookup can be expensive in large reference sets. Approximate indexes trade speed for retrieval
    accuracy. In high-dimensional spaces, distance can become less informative and data coverage sparse. Test unseen
    queries, inspect neighbor explanations, and avoid treating similarity as proof of a causal relationship.
  bridges: []
- id: nearest-neighbors.check
  title: Make the idea your own
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.nearest-neighbors
  markdown: Apply the mechanism to a fresh example. You can use hints for practice and revisit any explanation.
  text_mode: Untimed questions with labeled controls and answer feedback.
- id: nearest-neighbors.recap
  title: One idea to take with you
  type: recap
  depth: intuition
  objective_refs:
  - objective.nearest-neighbors
  markdown: Nearest-neighbor methods use a distance and neighborhood rule; feature scaling, dimensionality, ties,
    and reference-data quality shape their predictions.
  text_mode: Nearest-neighbor methods use a distance and neighborhood rule; feature scaling, dimensionality, ties,
    and reference-data quality shape their predictions.
