    people count as neighbors.


    Fit scaling rules on training data, and check whether closeness under those rules is useful for the task.
    Categories and missing values also need a stated treatment.'
  bridges: []
- id: nearest-neighbors.s4
  title: Know the cost and limits
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.nearest-neighbors
  markdown: Exact lookup can be expensive in large reference sets. Approximate indexes trade speed for retrieval
    accuracy. In high-dimensional spaces, distance can become less informative and data coverage sparse. Test
    unseen queries, inspect neighbor explanations, and avoid treating similarity as proof of a causal relationship.
  text_mode: Exact lookup can be expensive in large reference sets. Approximate indexes trade speed for retrieval
