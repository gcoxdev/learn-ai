schema_version: 0.2-draft
lesson:
  id: nearest-neighbors
  version: 0.3.0-draft
  title: Predict from similar stored examples
  state: draft
  summary: Predict from similar examples, and see how the meaning of “similar” changes the result.
  slot: M07.3
  category: learning
  sources:
  - title: An Introduction to Statistical Learning — authors’ materials
    url: https://www.statlearning.com/
objectives:
- id: objective.nearest-neighbors
  version: 1-draft
  statement: Nearest-neighbor methods use a distance and neighborhood rule; feature scaling, dimensionality,
    ties, and reference-data quality shape their predictions.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - nearest-neighbors.base
  - nearest-neighbors.transfer
  prerequisites:
  - anyOf:
    - objective.features-and-bias
  - anyOf:
    - objective.geometry-and-symmetry
scenes:
- id: nearest-neighbors.s1
  title: Ask the closest examples
  type: explanation
  depth: intuition
  objective_refs:
  - objective.nearest-neighbors
  markdown: 'To estimate a delivery time, find similar recorded deliveries and combine their answers. **k-nearest
    neighbors** uses the k closest examples; k is simply how many to consult.


    A **regressor** predicts a number. For nearby deliveries taking 8, 10, and 12 minutes, their average predicts
    10 minutes. A **classifier** instead combines labels to predict a category. “Nearby” means similar under
    the chosen feature and distance rules, not necessarily near on a street.


    There may be little parameter fitting, but choosing the features, distance measure, scaling, and k still
    determines the model.'
  text_mode: 'To estimate a delivery time, find similar recorded deliveries and combine their answers. **k-nearest
    neighbors** uses the k closest examples; k is simply how many to consult.


    A **regressor** predicts a number. For nearby deliveries taking 8, 10, and 12 minutes, their average predicts
    10 minutes. A **classifier** instead combines labels to predict a category. “Nearby” means similar under
    the chosen feature and distance rules, not necessarily near on a street.


    There may be little parameter fitting, but choosing the features, distance measure, scaling, and k still
    determines the model.'
  bridges: []
- id: nearest-neighbors.s2
  title: Work through a vote
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.nearest-neighbors
  markdown: 'A query’s three nearest labeled neighbors are red, red, and blue. Majority voting predicts red.
    With one neighbor, a mislabeled closest example can dominate. With a very large neighborhood, local structure
    can be washed out. Distance-weighted voting changes the combination rule and needs an explicit convention.


    Decide tie rules before testing. With two red and two blue neighbors, the majority does not choose a unique
    answer. You could use total distance as a tie-breaker or ask for another neighbor under a stated rule.
    An odd k avoids a two-class vote tie, but does not prevent every tie when there are more than two classes.'
  text_mode: 'A query’s three nearest labeled neighbors are red, red, and blue. Majority voting predicts red.
    With one neighbor, a mislabeled closest example can dominate. With a very large neighborhood, local structure
    can be washed out. Distance-weighted voting changes the combination rule and needs an explicit convention.


    Decide tie rules before testing. With two red and two blue neighbors, the majority does not choose a unique
    answer. You could use total distance as a tie-breaker or ask for another neighbor under a stated rule.
    An odd k avoids a two-class vote tie, but does not prevent every tie when there are more than two classes.'
  bridges:
  - geometry-and-symmetry
- id: nearest-neighbors.s3
  title: Choose what distance means
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.nearest-neighbors
  markdown: '**Euclidean distance** is straight-line distance between lists of numerical features. If only
    one feature differs, the distance is the size of that difference. Its units therefore matter.


    Suppose features include income and age. Changing income from thousands of dollars to dollars multiplies
    its numerical differences by 1,000. Without rescaling, income can dominate the distance and change which
    people count as neighbors.


    Fit scaling rules on training data, and check whether closeness under those rules is useful for the task.
    Categories and missing values also need a stated treatment.'
  text_mode: '**Euclidean distance** is straight-line distance between lists of numerical features. If only
