assessment_families:
  - id: nearest-neighbors.base
    objective_ref: objective.nearest-neighbors
    task: base
    response_type: single_choice
    points: 1
    hint: 'Work through a vote: trace the inputs, operation, and result before choosing.'
    remediation_scene: nearest-neighbors.s2
    variants:
      - id: nearest-neighbors.base.1
        prompt: Nearest labels [A, B, A, A, B] with majority voting predict what?
        options:
          - id: a
            text: A
          - id: b
            text: B
          - id: c
            text: No label because k is odd
        answer: a
        feedback: Three of five neighbors vote for A.
        retired: true
      - id: nearest-neighbors.base.2
        prompt: Which choice directly changes what “near” means?
        options:
          - id: b
            text: Only the output file extension
          - id: c
            text: Only the class display color
          - id: a
            text: Feature scaling and the distance metric
        answer: a
        feedback: Distances depend on coordinate representation and measurement units.
        retired: true
  - id: nearest-neighbors.transfer
    objective_ref: objective.nearest-neighbors
    task: transfer
    response_type: single_choice
    points: 1
    hint: 'Know the cost and limits: trace the inputs, operation, and result before choosing.'
    remediation_scene: nearest-neighbors.s4
    variants:
      - id: nearest-neighbors.transfer.1
        prompt: One mislabeled nearest example causes an error with k = 1. What tradeoff can a larger k introduce?
        options:
          - id: b
            text: Guaranteed perfect classification
          - id: c
            text: Elimination of all reference data
          - id: a
            text: More smoothing but possible loss of local detail
        answer: a
        feedback: A larger neighborhood can reduce sensitivity while increasing smoothing bias.
        retired: true
      - id: nearest-neighbors.transfer.2
        prompt: An approximate index returns a slightly different neighbor set. What should be evaluated?
        options:
          - id: c
            text: A claim that approximation has no effect
          - id: a
            text: Both retrieval quality and downstream prediction
          - id: b
            text: Only index construction time
        answer: a
        feedback: Approximate retrieval can change the predictions built from its results.
        retired: true
  - id: nearest-neighbors.base.v2
    objective_ref: objective.nearest-neighbors
    task: base
    response_type: numeric
    points: 1
    hint: Find each distance as the square root of the summed squared differences, keep the k smallest, and average those neighbors' values.
    remediation_scene: nearest-neighbors.s3
    variants:
      - id: nearest-neighbors.base.v2.1
        prompt: 'Query at (0, 0). Stored points: P at (3, 4) with value 10, Q at (1, 1) with value 20, R at (0, 2) with value 30. Using Euclidean distance and k = 2, what does kNN predict?'
        answer: 25
        feedback: 'Distances: P = √(9 + 16) = 5, Q = √2 ≈ 1.41, R = 2. The two nearest are Q and R, so the prediction is (20 + 30)/2 = 25. Including P would mean picking by value or by listed order instead of distance.'
      - id: nearest-neighbors.base.v2.2
        prompt: 'Query at (5, 5). Stored points: P at (6, 5) with value 8, Q at (5, 8) with value 14, R at (9, 8) with value 20. Using Euclidean distance and k = 2, what does kNN predict?'
        answer: 11
        feedback: 'Distances: P = 1, Q = 3, R = √(16 + 9) = 5. The two nearest are P and Q, so the prediction is (8 + 14)/2 = 11.'
      - id: nearest-neighbors.base.v2.3
        prompt: 'Query at (2, 1). Stored points: P at (2, 4) with value 40, Q at (6, 4) with value 10, R at (0, 1) with value 70. Using Euclidean distance and k = 2, what does kNN predict?'
        answer: 55
        feedback: 'Distances: P = 3, Q = √(16 + 9) = 5, R = 2. The two nearest are R and P, so the prediction is (70 + 40)/2 = 55.'
      - id: nearest-neighbors.base.v2.4
        prompt: 'Query at (10, 0). Stored points: P at (13, 4) with value 6, Q at (10, 2) with value 9, R at (7, 0) with value 3, S at (16, 8) with value 30. Using Euclidean distance and k = 3, what does kNN predict?'
        answer: 6
        feedback: 'Distances: P = √(9 + 16) = 5, Q = 2, R = 3, S = √(36 + 64) = 10. The three nearest are Q, R, and P, so the prediction is (9 + 3 + 6)/3 = 6. S is far away, so its large value of 30 never enters.'
    absolute_tolerance: 0.01
  - id: nearest-neighbors.transfer.v2
    objective_ref: objective.nearest-neighbors
    task: transfer
    response_type: single_choice
    points: 1
    hint: Ask what "near" means in this system. Which feature dominates the distance, how many neighbors vote, and does nearness still mean anything with this many features?
    remediation_scene: nearest-neighbors.s3
    variants:
      - id: nearest-neighbors.transfer.v2.1
        prompt: A clinic's kNN model uses age in years (20 to 90) and a blood marker measured in mg/L (0.1 to 2.0). Its predictions barely change when the marker changes. What is the best first fix?
        options:
          - id: a
            text: Raise k so that more patients get a vote on each prediction
          - id: b
            text: Rescale both features by their spread in the training data
          - id: c
            text: Drop age, since it is the feature crowding out the blood marker
        answer: b
        feedback: Age differences run into tens while marker differences stay below 2, so age dominates every distance. Scaling puts both on a comparable footing. More voters would still be chosen by age, and dropping age throws away a useful feature instead of fixing the units.
      - id: nearest-neighbors.transfer.v2.2
        prompt: On a plant-disease dataset, kNN with k = 1 scores 100% on its own stored examples but 70% on held-out leaves. With k = 15 it scores 82% on the held-out leaves. What best explains the gap?
        options:
          - id: a
            text: With k = 15, the held-out leaves must have leaked into the stored set
          - id: c
            text: A larger k compares each leaf on more of its measured features at once
          - id: b
            text: Each stored leaf is its own nearest neighbor, so k = 1 copies noise
        answer: b
        feedback: Scored on its own examples, k = 1 finds each example itself at distance 0, so a perfect score is automatic. On new leaves, one neighbor passes on its quirks; 15 neighbors average them out. k sets how many neighbors vote, not how many features are compared.
      - id: nearest-neighbors.transfer.v2.3
        prompt: A news site finds similar articles with kNN on raw counts of 50,000 different words. For most articles, the nearest and farthest stored articles are almost equally distant. What is the most promising change?
        options:
          - id: c
            text: Represent articles by compact embeddings, then search
          - id: a
            text: Use k = 1 so just the closest article counts
          - id: b
            text: Store many more articles so queries find close matches
        answer: c
        feedback: With 50,000 dimensions, distances bunch together, which is the curse of dimensionality. A short learned embedding makes distance meaningful again. Changing k doesn't fix distances that barely differ, and extra articles would need to be astronomically many to fill so many dimensions.
      - id: nearest-neighbors.transfer.v2.4
        prompt: An engineer standardizes features by computing each feature's mean and spread on the full dataset, then splits it into stored and test examples for kNN. What is wrong?
        options:
          - id: b
            text: Standardizing is unneeded for kNN once k is chosen well
          - id: a
            text: The spreads should come from the test examples instead
          - id: c
            text: The test examples helped set the scaling the model uses
        answer: c
        feedback: Scaling numbers are part of the model, so computing them with test data lets test information leak into it. Compute them from the stored training examples and reuse them for every query. A good k can't rescue a feature that swamps the distance.
      - id: nearest-neighbors.transfer.v2.5
        prompt: A photo app keeps 50 million image embeddings, and exact nearest-neighbor search takes several seconds per query. What is the standard remedy?
        options:
          - id: c
            text: Use k = 1, so each search finds one image instead of many
          - id: a
            text: Use an approximate index, spot-checked against exact search
          - id: b
            text: Raise k, so each search can finish after far fewer comparisons
        answer: a
        feedback: Approximate nearest-neighbor indexes skip most comparisons and return almost-the-nearest images quickly; spot-checks show how often they miss. Exact search compares the query with every stored image whatever k is, so changing k barely changes the time.
