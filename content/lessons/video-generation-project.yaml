assessment_families:
- id: video-generation-project.base
  objective_ref: objective.video-generation-project
  task: base
  response_type: single_choice
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: video-generation-project.s5
  variants:
  - prompt: Four sharp frames change the main object from red to blue halfway through. What failed?
    answer: a
    options:
    - id: b
      text: Raw storage arithmetic, because color cannot change between frames.
    - id: c
      text: Frame rate, which directly determines object identity.
    - id: a
      text: Identity consistency across time, even if each frame looks good.
    feedback: Appearance and identity consistency are different evaluation dimensions.
    id: video-generation-project.base.1
  - prompt: Adjacent frames from one source clip appear in training and testing. What is the concern?
    answer: a
    options:
    - id: c
      text: The model must use an autoregressive rather than diffusion objective.
    - id: a
      text: Related source content can leak across the evaluation boundary.
    - id: b
      text: The raw RGB representation cannot store adjacent frames.
    feedback: Split related source clips before constructing examples.
    id: video-generation-project.base.2
  - prompt: A user changes the initial noise seed while leaving model parameters fixed. Which stage changed?
    answer: a
    options:
    - id: a
      text: The inference sampling setup.
    - id: b
      text: The parameter-training dataset.
    - id: c
      text: The recorded source clip’s frame rate.
    feedback: A different random draw can change generation without updating model parameters.
    id: video-generation-project.base.3
  - prompt: The entire scene shifts right in a clip. What can you conclude about object motion?
    answer: a
    options:
    - id: b
      text: Every object must have moved right in the world.
    - id: c
      text: The motion proves the model contains a physical simulator.
    - id: a
      text: Camera motion and object motion must be distinguished before making that claim.
    feedback: Image motion alone does not uniquely specify motion in the world.
    id: video-generation-project.base.4
- id: video-generation-project.transfer
  objective_ref: objective.video-generation-project
  task: transfer
  response_type: numeric_fields_with_reason
  points: 1
  hint: Work through the example one step at a time before answering.
  remediation_scene: video-generation-project.s2
  variants:
  - prompt: A clip contains 6 frames, each 4 by 3 pixels, with 3 RGB channels and one byte per channel. It plays
      at 2 frames per second with each frame displayed for 1/2 second. Give raw bytes and playback duration.
    answers:
      bytes: 216
      seconds: 3.0
    reason_answer: a
    reason_options:
    - id: b
      text: Use only the timestamp at which the last frame begins for the duration.
    - id: c
      text: Add width and height when counting pixels.
    - id: a
      text: Multiply all storage dimensions; divide frame count by frame rate for duration.
    feedback: Storage counts every pixel channel in every frame; playback includes the display time of the final
      frame.
    id: video-generation-project.transfer.1
  - prompt: A clip contains 8 frames, each 2 by 2 pixels, with 3 RGB channels and one byte per channel. It plays
      at 4 frames per second with each frame displayed for 1/4 second. Give raw bytes and playback duration.
    answers:
      bytes: 96
      seconds: 2.0
    reason_answer: a
    reason_options:
    - id: c
      text: Add width and height when counting pixels.
    - id: a
      text: Multiply all storage dimensions; divide frame count by frame rate for duration.
    - id: b
      text: Use only the timestamp at which the last frame begins for the duration.
    feedback: Storage counts every pixel channel in every frame; playback includes the display time of the final
      frame.
    id: video-generation-project.transfer.2
  - prompt: A clip contains 3 frames, each 4 by 2 pixels, with 3 RGB channels and one byte per channel. It plays
      at 2 frames per second with each frame displayed for 1/2 second. Give raw bytes and playback duration.
    answers:
      bytes: 72
      seconds: 1.5
    reason_answer: a
    reason_options:
    - id: a
      text: Multiply all storage dimensions; divide frame count by frame rate for duration.
    - id: b
      text: Use only the timestamp at which the last frame begins for the duration.
    - id: c
      text: Add width and height when counting pixels.
    feedback: Storage counts every pixel channel in every frame; playback includes the display time of the final
      frame.
    id: video-generation-project.transfer.3
  - prompt: A clip contains 10 frames, each 3 by 2 pixels, with 3 RGB channels and one byte per channel. It plays
      at 5 frames per second with each frame displayed for 1/5 second. Give raw bytes and playback duration.
    answers:
      bytes: 180
      seconds: 2.0
    reason_answer: a
    reason_options:
    - id: b
      text: Use only the timestamp at which the last frame begins for the duration.
    - id: c
      text: Add width and height when counting pixels.
    - id: a
      text: Multiply all storage dimensions; divide frame count by frame rate for duration.
    feedback: Storage counts every pixel channel in every frame; playback includes the display time of the final
      frame.
    id: video-generation-project.transfer.4
  numeric_fields:
  - id: bytes
    label: Raw bytes
  - id: seconds
    label: Playback seconds
  absolute_tolerance: 1.0e-06
