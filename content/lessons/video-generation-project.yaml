  - id: video-generation-project.base.v2
    objective_ref: objective.video-generation-project
    task: base
    response_type: single_choice
    points: 1
    hint: Ask which frames the model actually generated, which were filled in, and which frames the check looked at.
    remediation_scene: video-generation-project.s4
    variants:
      - id: video-generation-project.base.v2.1
        prompt: The independent-frames plan fails the "same look" check in nearly every clip. Why?
        options:
          - id: b
            text: The 16-pixel strip is too narrow to show the dot at a steady brightness
          - id: a
            text: Each frame draws its own brightness, so nothing ties frames together
          - id: c
            text: Rounding the dot's position also changes the brightness it's drawn with
        answer: a
        feedback: Twelve separate calls pick twelve separate brightnesses, and the chance they all land within 0.05 of each other is tiny. The keyframe plans pass because they choose one brightness and reuse it.
      - id: video-generation-project.base.v2.2
        prompt: Keys at frames 0, 4, 8, 11 pass every check on frames 0, 4, 8, but fail "on script" on all frames in every clip. What went wrong?
        options:
          - id: a
            text: The pause on frames 5 to 7 falls between keys, and the line turns it into a crawl
          - id: b
            text: The keyframes each drew their own look, so brightness drifts between them
          - id: c
            text: Checking only frames 0, 4, 8 made the first check stricter than the second
        answer: a
        feedback: Interpolating from position 6 at frame 4 to 8 at frame 8 gives 6, 6, 7, 8, 8 instead of 6, 7, 7, 7, 8. The keyframe plans share one look, so brightness is fine; the failure is an event that no keyframe saw.
      - id: video-generation-project.base.v2.3
        prompt: With the same 4 calls, why do keys at 0, 5, 7, 11 keep the pause that keys at 0, 4, 8, 11 lose?
        options:
          - id: c
            text: Odd-numbered keyframes round positions downward, which slows the dot
          - id: b
            text: Keys closer to the end let the dot catch up after it has paused
          - id: a
            text: Frames 5 and 7 pin both ends of the pause, so the line between stays flat
        answer: a
        feedback: Both keys sit at position 7, so interpolating between them gives 7, 7, 7. The lesson is placement, not count; the rounding rule and the end of the clip play no part.
      - id: video-generation-project.base.v2.4
        prompt: Checking frames 0, 4, 8 only, 84% of independent clips pass "one dot". Checking all 12 frames, 56% pass. Why the difference?
        options:
          - id: a
            text: Stray dots on the nine unchecked frames go unseen
          - id: b
            text: Checking more frames adds random measurement errors
          - id: c
            text: The model makes fewer stray dots on frames 0, 4, 8
        answer: a
        feedback: With a 5% chance per frame, $0.95^3 \approx 0.86$ of clips look clean on 3 frames but only $0.95^{12} \approx 0.54$ are clean on all 12. The model treats every frame alike; the sparse check simply looks at fewer of them.
  - id: video-generation-project.transfer.v2
    objective_ref: objective.video-generation-project
    task: transfer
    response_type: single_choice
    points: 1
    hint: Decide whether the failure lives inside one frame or between frames, then pick the check or the keyframe placement that targets it.
    remediation_scene: video-generation-project.mistakes
    variants:
      - id: video-generation-project.transfer.v2.1
        prompt: A text-to-video demo's frames each look excellent, but a character's shirt changes color twice in 8 seconds. What should the evaluation add?
        options:
          - id: b
            text: A higher-resolution image-quality score for each frame
          - id: a
            text: An identity check comparing the shirt across all frames
          - id: c
            text: A longer clip, to see whether the color settles down
        answer: a
        feedback: The color change exists only between frames, so a per-frame score can't see it however sharp it is. An identity check like "same look" compares the frames directly.
      - id: video-generation-project.transfer.v2.2
        prompt: A generator makes 2 keyframes per 5-second clip and interpolates straight lines between them. A user asks for "a ball bounces once". What is the likely failure?
        options:
          - id: a
            text: The bounce falls between the keyframes, so the ball travels in a straight line
          - id: b
            text: The ball's color flickers, because the keyframes share a single appearance
          - id: c
            text: The clip plays too fast, since interpolated frames are shown for less time
        answer: a
        feedback: Like the lost pause, a bounce is a change of direction between keys, and a straight line can't turn. Sharing one appearance prevents flicker rather than causing it.
      - id: video-generation-project.transfer.v2.3
        prompt: To save time, a review team checks 1 frame per second of each 24-frames-per-second generated clip for visual glitches. What is the problem?
        options:
          - id: c
            text: Glitches that last several seconds will be counted too many times
          - id: b
            text: One frame per second is too many frames to review with care
          - id: a
            text: Glitches lasting a few frames are mostly missed, so the rate looks too low
        answer: a
        feedback: A glitch lasting 3 frames is seen only if it covers the one sampled frame in its second, so most go unseen and the reported rate comes out far too low. Consistency checks are cheap enough to run on every frame.
      - id: video-generation-project.transfer.v2.4
        prompt: In a generated clip of a parked car, the camera pans right, so the car moves left across the frames. A motion check reports "car drove left". What should the check do?
        options:
          - id: a
            text: Check whether the background shifts too, to separate camera from object motion
          - id: b
            text: Sample more frames per second, so the car's movement is measured more finely
          - id: c
            text: Require the car to stay at the same pixel position in every single frame
        answer: a
        feedback: If the whole scene shifts together, the camera moved, as the lesson on motion across frames showed. More frames measure the wrong motion more precisely, and a fixed-position rule would fail every pan.
  - id: video-generation-project.catch.v2
    objective_ref: objective.video-generation-project
    task: base
    response_type: numeric
    points: 1
    hint: The chance a clip shows at least one defect is 1 − (1 − p)ⁿ, where p is the per-frame defect rate and n is the number of frames you check.
    remediation_scene: video-generation-project.mistakes
    absolute_tolerance: 0.5
    variants:
      - id: video-generation-project.catch.v2.1
        prompt: A frame model adds a stray object to 5% of frames, independently. What percentage of 12-frame clips contain at least one stray object?
        answer: 45.96
        feedback: 0.95¹² ≈ 0.540, so 1 − 0.540 = 0.460, or about 46%.
      - id: video-generation-project.catch.v2.2
        prompt: A frame model adds a stray object to 5% of frames, independently. A reviewer checks only 3 frames of each clip. What percentage of clips show a stray object on those 3 frames?
        answer: 14.26
        feedback: 0.95³ ≈ 0.857, so 1 − 0.857 = 0.143, or about 14%, far below the true rate for 12-frame clips.
      - id: video-generation-project.catch.v2.3
        prompt: A generator flickers on 10% of frames, independently. What percentage of 6-frame clips contain at least one flicker?
        answer: 46.86
