schema_version: 0.2-draft
lesson:
  id: video-generation-project
  version: 0.1.1-draft
  title: 'Project: trace and evaluate a tiny video generator'
  state: draft
  summary: Plan a short generated clip, count its representation, and test whether objects and events remain consistent
    over time.
  slot: M36.10
  category: destination
  archetype: project
  minutes: 35
  sources:
  - title: 'Video LDM: Align your Latents (2023)'
    url: https://arxiv.org/abs/2304.08818
objectives:
- id: objective.video-generation-project
  version: 1-draft
  statement: Calculate a clip’s raw storage and playback duration, and distinguish temporal consistency from frame
    quality in a proposed generation experiment.
  depths:
  - intuition
  - mechanics
  critical: true
  evidence_families:
  - video-generation-project.base
  - video-generation-project.transfer
  prerequisites:
  - anyOf:
    - objective.video-models
  - anyOf:
    - objective.latent-diffusion
  - anyOf:
    - objective.modality-tokenization
  - anyOf:
    - objective.multimodal-grounding-evaluation
scenes:
- id: video-generation-project.s1
  type: explanation
  depth: intuition
  objective_refs:
  - objective.video-generation-project
  title: Specify a clip you can inspect by hand
  markdown: 'Your project is a paper design for a tiny video generator: a red square moves one position right in
    each of four frames. A **frame** is one image in the clip. Choose a grid four pixels wide and three high, and
    show the clip at two frames per second. You can draw the frames on paper; no trained model or GPU is required.


    Write down the input instruction, the expected sequence, and what would count as failure. This makes the task
    concrete before selecting a model architecture. The deliverable is a storyboard, a lifecycle diagram, and an
    evaluation sheet.'
  text_mode: 'Your project is a paper design for a tiny video generator: a red square moves one position right in
    each of four frames. A **frame** is one image in the clip. Choose a grid four pixels wide and three high, and
    show the clip at two frames per second. You can draw the frames on paper; no trained model or GPU is required.


    Write down the input instruction, the expected sequence, and what would count as failure. This makes the task
    concrete before selecting a model architecture. The deliverable is a storyboard, a lifecycle diagram, and an
    evaluation sheet.'
  bridges: []
- id: video-generation-project.s2
  type: explanation
  depth: intuition
  objective_refs:
  - objective.video-generation-project
  title: Count space and time separately
  markdown: 'Each frame has 4 × 3 = 12 pixels. RGB stores three channel values per pixel, so four frames have 4
    × 12 × 3 = 144 values. At one byte per value, raw storage is 144 bytes, excluding metadata and compression.


    At two frames per second, four displayed frames occupy two seconds if each remains visible for half a second.
    Their starting timestamps are 0, 0.5, 1.0, and 1.5 seconds. The last starting timestamp is not the playback
    duration. Explain this distinction beside your drawing; confusing these two measurements makes timing comparisons
    misleading.'
  text_mode: 'Each frame has 4 × 3 = 12 pixels. RGB stores three channel values per pixel, so four frames have 4
    × 12 × 3 = 144 values. At one byte per value, raw storage is 144 bytes, excluding metadata and compression.


    At two frames per second, four displayed frames occupy two seconds if each remains visible for half a second.
    Their starting timestamps are 0, 0.5, 1.0, and 1.5 seconds. The last starting timestamp is not the playback
    duration. Explain this distinction beside your drawing; confusing these two measurements makes timing comparisons
    misleading.'
  bridges:
  - arithmetic
  - tensor-shape-tracing
- id: video-generation-project.s3
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.video-generation-project
  title: Use one reference generation recipe
  markdown: 'Our reference design uses a latent diffusion video model. **Latent** means an internal representation;
    an encoder compresses images into this representation and a decoder converts it back. **Diffusion generation**
    starts from noise and repeatedly predicts changes that produce a sample, conditioned here on an instruction
    or starting image.


    A temporal component lets the model combine information across times. The Video LDM paper illustrates adapting
    image diffusion models with temporal components. This is one documented design, not a requirement that every
    video generator use the same architecture. Draw where frame order and the instruction enter your chosen calculation.'
  text_mode: 'Our reference design uses a latent diffusion video model. **Latent** means an internal representation;
    an encoder compresses images into this representation and a decoder converts it back. **Diffusion generation**
    starts from noise and repeatedly predicts changes that produce a sample, conditioned here on an instruction
    or starting image.


    A temporal component lets the model combine information across times. The Video LDM paper illustrates adapting
    image diffusion models with temporal components. This is one documented design, not a requirement that every
    video generator use the same architecture. Draw where frame order and the instruction enter your chosen calculation.'
  bridges: []
- id: video-generation-project.s4
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.video-generation-project
  title: Separate the training stages from the request
  markdown: 'Your diagram should show video collection, timestamps and captions, training examples, parameter updates,
    and inference with fixed parameters. An image-pretrained model may supply useful visual features; learning temporal
    behavior still requires suitable data and training. Split data by original clips or related sources so neighboring
    frames do not leak across training and evaluation.


    For inference, show the instruction, chosen duration and frame rate, initial noise, repeated model evaluations,
    and decoding. Describe what each setting controls. Do not claim that changing the random seed retrains the model
    or that more frames prove a longer useful reasoning horizon.'
  text_mode: 'Your diagram should show video collection, timestamps and captions, training examples, parameter updates,
    and inference with fixed parameters. An image-pretrained model may supply useful visual features; learning temporal
    behavior still requires suitable data and training. Split data by original clips or related sources so neighboring
    frames do not leak across training and evaluation.


    For inference, show the instruction, chosen duration and frame rate, initial noise, repeated model evaluations,
    and decoding. Describe what each setting controls. Do not claim that changing the random seed retrains the model
    or that more frames prove a longer useful reasoning horizon.'
  bridges: []
- id: video-generation-project.s5
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.video-generation-project
  title: Give the evaluation a counterexample
  markdown: 'Compare three invented outputs. A has four sharp frames but the red square turns blue halfway through.
    B keeps the square red but reverses its direction after frame two. C follows the requested order with slightly
    rough edges. A frame-quality score alone may favor A, while missing the task failure.


    Your rubric should separately score appearance, object identity, direction, event order, timing, and instruction
    adherence. Include ambiguous camera motion: a scene shifting right does not uniquely identify an object moving
    right. Generated plausibility is evidence about the output, not evidence that the depicted event occurred.'
  text_mode: 'Compare three invented outputs. A has four sharp frames but the red square turns blue halfway through.
    B keeps the square red but reverses its direction after frame two. C follows the requested order with slightly
    rough edges. A frame-quality score alone may favor A, while missing the task failure.


    Your rubric should separately score appearance, object identity, direction, event order, timing, and instruction
    adherence. Include ambiguous camera motion: a scene shifting right does not uniquely identify an object moving
    right. Generated plausibility is evidence about the output, not evidence that the depicted event occurred.'
  bridges: []
  figure:
    kind: video
    caption: These authored frames isolate temporal consistency; they are not outputs from a video generator.
    description: Scrub six frames showing a moving object. Compare a consistent sequence with one that changes the
      object unexpectedly, and inspect neighboring frames rather than judging each frame in isolation.
- id: video-generation-project.s6
  type: explanation
  depth: mechanics
  objective_refs:
  - objective.video-generation-project
  title: Review the project and state its limits
  markdown: 'Submit the four-frame storyboard and annotate dimensions, timestamps, raw size, and playback duration.
    Add the training/inference diagram and a comparison table for outputs A, B, and C. State the reference design
    and which alternatives you did not test.


    For self or peer review, ask whether every count has units, whether training and inference are distinct, whether
    a temporal failure can change the evaluation, and whether source clips remain separated. A stronger extension
    adds occlusion or a camera shift. This hand exercise checks your system explanation; it does not measure a trained
    model’s quality. The knowledge check below grades supporting concepts, not your unseen storyboard.'
  text_mode: 'Submit the four-frame storyboard and annotate dimensions, timestamps, raw size, and playback duration.
    Add the training/inference diagram and a comparison table for outputs A, B, and C. State the reference design
    and which alternatives you did not test.


    For self or peer review, ask whether every count has units, whether training and inference are distinct, whether
    a temporal failure can change the evaluation, and whether source clips remain separated. A stronger extension
    adds occlusion or a camera shift. This hand exercise checks your system explanation; it does not measure a trained
    model’s quality. The knowledge check below grades supporting concepts, not your unseen storyboard.'
  bridges: []
- id: video-generation-project.check
  title: Review and check your understanding
  type: assessment
  depth: mechanics
  objective_refs:
  - objective.video-generation-project
  markdown: These checks assess the supporting concepts. Use the rubric to review your project; the app does not
    grade your submitted artifact.
  text_mode: Untimed checks of the supporting concepts, followed by continuation links.
  takeaway: A video system must represent time and preserve useful relationships between frames. Attractive individual
    frames do not establish coherent motion.
